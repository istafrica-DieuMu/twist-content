                say: "Four hundred and seventy-nine divided by two. Write the remainder at the end."
                frame: "479 ÷ 2 = _ r _"
                options: ["239", "1", "240", "3"]
                answer: ["239", "1"]
                hints: ["4 ÷ 2, then 7 ÷ 2 = 3 r 1, then 19 ÷ 2."]
              - id: l2-s2
                type: text_input
