# Lesson set: Maths, Year 5. Hand-authored draft.
id: en-GB.math.written-div-remainder
skill: math.written-mult-div.div-remainder-zeros
curriculum: en-GB
language: en
title:
  de: Schriftlich teilen mit Rest und Nullen
  en: Short division with zeros and remainders
summary: >
  Short division where the answer has a zero or there is a remainder.
  Lesson 1 writes a 0 in the answer when a place is too small to divide
  (824 ÷ 4 = 206, 6030 ÷ 3 = 2010); lesson 2 ends with a remainder
  (857 ÷ 4 = 214 r 1), checks it with the inverse (214 × 4 + 1), decides
  in a story whether to round the answer up or down, and ends with the
  skill check. The bus stop layout is drawn with its exchanged digits.
metadata:
  year: year-5
  topic: { de: Schriftlich teilen, en: Written division }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.written-mult-div.div-one-digit]
  also_practises: [math.mult-div.remainder]
  vocabulary: { en: [short division, remainder, placeholder zero, exchange, inverse, round up, round down] }
  forms: [text, audio, drawn]
  drawn: [short-division]
  facets: []
  parts:
    - { id: zeros, what: { de: schriftlich teilen mit Nullen im Ergebnis, en: short division with zeros in the answer } }
    - { id: remainders, what: { de: schriftlich teilen mit Rest und mit der Umkehraufgabe prüfen, en: short division with a remainder and checking it with the inverse } }
    - { id: in-context, what: { de: "in Sachaufgaben entscheiden, ob man aufrundet oder abrundet", en: deciding in a story whether to round up or down } }
  misconceptions:
    - id: skip-zero
      what: Leaves out the 0 when a place cannot be divided (824 ÷ 4 = 26)
      addressed: lesson 1 Learn writes the 0 as a placeholder; l1-f2 has feedback on 26, l1-s2, l1-n2 and l2-c2 offer the answer without the zero
    - id: remainder-too-big
      what: Leaves a remainder as big as the divisor or bigger (857 ÷ 4 = 213 r 5)
      addressed: lesson 2 Learn says the remainder is always smaller than the number you divide by; l2-f3 has feedback on r 5, l2-s3 and l2-n3 ask again
    - id: remainder-context
      what: "Gives the remainder answer in a story where you must round up or down (54 children, 8 in a car: 6 r 6 cars)"
      addressed: lesson 2 Learn rounds up for cars and down for full boxes; l2-f5, l2-s5, l2-n5 and l2-c5 are stories, with feedback in l2-f5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Nullen im Ergebnis", en: "Zeros in the answer" }
    goal:
      de: "Schreib eine Null ins Ergebnis, wenn eine Stelle zu klein zum Teilen ist, so wie 824 geteilt durch 4 ist 206."
      en: "Write a zero in the answer when a place is too small to divide, like 824 divided by 4 is 206."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "736 ÷ 4 = _"
            say: "Seven hundred and thirty-six divided by four."
            answer: "184"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "3492 ÷ 3 = _"
            say: "Three thousand four hundred and ninety-two divided by three."
            answer: "1164"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "824 ÷ 4. Is the answer 26, 206 or 260? What do you think?"
            say: "Eight hundred and twenty-four divided by four. Is the answer twenty-six, two hundred and six, or two hundred and sixty? Have a guess."
          - text: "824 ÷ 4\nhundreds: 8 ÷ 4 = 2\ntens: 2 ÷ 4 = 0 r 2\nones: 24 ÷ 4 = 6\n824 ÷ 4 = 206"
            say: "Eight hundred and twenty-four divided by four. Eight hundreds divided by four is two. Two tens divided by four: four does not go, so write nought in the tens place of the answer and exchange the two tens for twenty ones. Twenty-four ones divided by four is six. The answer is two hundred and six."
            show: { drawn: short-division, divisor: 4, dividend: "824", quotient: "206", carries: "  2" }
          - text: "Without the 0: 26\nCheck: 26 × 4 = 104, not 824"
            say: "If you leave out the nought, the answer becomes twenty-six, which is far too small. The nought keeps the two in the hundreds place."
          - text: "6030 ÷ 3\n6 ÷ 3 = 2, 0 ÷ 3 = 0, 3 ÷ 3 = 1, 0 ÷ 3 = 0\n6030 ÷ 3 = 2010"
            say: "Six thousand and thirty divided by three. Six thousands divided by three is two thousands. No hundreds: nought. Three tens divided by three is one ten. No ones: nought. The answer is two thousand and ten."
            show: { drawn: short-division, divisor: 3, dividend: "6030", quotient: "2010" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "618 ÷ 3. Write a 0 when a place is too small."
                say: "Six hundred and eighteen divided by three. Write a nought when a place is too small."
                frame: "6 ÷ 3 = _; 1 ÷ 3 = _ r 1; 18 ÷ 3 = _"
                options: ["2", "0", "6", "1"]
                answer: ["2", "0", "6"]
                hints:
                  - "Three does not go into one ten."
                  - "Write 0 in the tens place and exchange the 1 ten for 10 ones: 18 ones."
                  - "2, 0, 6. The answer is 206."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "824 ÷ 4 = _"
                say: "Eight hundred and twenty-four divided by four."
                options: ["206", "26", "260"]
                answer: "206"
                feedback:
                  "26": "Check: 26 × 4 = 104. The 0 in the tens place is missing."
                hints:
                  - "Four does not go into 2 tens."
                  - "Write 0 in the tens place. Then 24 ones divided by 4."
                  - "206."
              - id: l1-f3
                type: text_input
                text: "4520 ÷ 5 = _"
                say: "Four thousand five hundred and twenty divided by five."
                show: { drawn: short-division, divisor: 5, dividend: "4520", quotient: " ___" }
                answer: "904"
                hints:
                  - "Start with 45 hundreds."
                  - "45 ÷ 5 = 9. 2 tens ÷ 5 = 0 r 2, so 20 ones."
                  - "904."
              - id: l1-f4
                type: true_false
                text: "Is it true? 6030 ÷ 3 = 201"
                say: "Six thousand and thirty divided by three equals two hundred and one. Is it true?"
                answer: false
                hints:
                  - "How many places should the answer have?"
                  - "6 thousands ÷ 3 = 2 thousands. Every place after that needs a digit, even 0."
                  - "No. 6030 ÷ 3 = 2010."
              - id: l1-f5
                type: text_input
                text: "A school has 1260 sheets of card to share between 6 classes. How many sheets does each class get?"
                answer: "210"
                hints:
                  - "Work out 1260 ÷ 6."
                  - "12 hundreds ÷ 6 = 2 hundreds. 6 tens ÷ 6 = 1 ten. 0 ones."
                  - "210."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "721 ÷ 7. Write a 0 when a place is too small."
                say: "Seven hundred and twenty-one divided by seven. Write a nought when a place is too small."
                frame: "7 ÷ 7 = _; 2 ÷ 7 = _ r 2; 21 ÷ 7 = _"
                options: ["1", "0", "3", "2"]
                answer: ["1", "0", "3"]
                hints: ["Seven does not go into 2 tens."]
              - id: l1-s2
                type: multiple_choice
                text: "936 ÷ 9 = _"
                say: "Nine hundred and thirty-six divided by nine."
                options: ["104", "14", "140"]
                answer: "104"
                hints: ["Nine does not go into 3 tens."]
              - id: l1-s3
                type: text_input
                text: "8048 ÷ 8 = _"
                say: "Eight thousand and forty-eight divided by eight."
                show: { drawn: short-division, divisor: 8, dividend: "8048", quotient: "____" }
                answer: "1006"
                hints: ["0 hundreds, then 4 tens ÷ 8 = 0 r 4."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 2412 ÷ 4 = 603"
                say: "Two thousand four hundred and twelve divided by four equals six hundred and three. Is it true?"
                answer: true
                hints: ["Check: 603 × 4."]
              - id: l1-s5
                type: text_input
                text: "A farmer packs 3240 apples into bags of 8. How many bags does he fill?"
                answer: "405"
                hints: ["32 ÷ 8 = 4. Then 4 tens ÷ 8 = 0 r 4."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "515 ÷ 5. Write a 0 when a place is too small."
                say: "Five hundred and fifteen divided by five. Write a nought when a place is too small."
                frame: "5 ÷ 5 = _; 1 ÷ 5 = _ r 1; 15 ÷ 5 = _"
                options: ["1", "0", "3", "5"]
                answer: ["1", "0", "3"]
              - id: l1-n2
                type: multiple_choice
                text: "642 ÷ 6 = _"
                say: "Six hundred and forty-two divided by six."
                options: ["107", "17", "170"]
                answer: "107"
              - id: l1-n3
                type: text_input
                text: "5600 ÷ 7 = _"
                say: "Five thousand six hundred divided by seven."
                answer: "800"
              - id: l1-n4
                type: text_input
                text: "9054 ÷ 9 = _"
                say: "Nine thousand and fifty-four divided by nine."
                answer: "1006"
              - id: l1-n5
                type: text_input
                text: "4 friends win £1620 in a competition and share it equally. How much does each friend get, in pounds?"
                answer: "405"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "816 ÷ 8 = _"
            say: "Eight hundred and sixteen divided by eight."
            answer: "102"
          - id: l1-c2
            type: text_input
            text: "3015 ÷ 3 = _"
            say: "Three thousand and fifteen divided by three."
            answer: "1005"
          - id: l1-c3
            type: true_false
            text: "Is it true? 1830 ÷ 6 = 35"
            say: "One thousand eight hundred and thirty divided by six equals thirty-five. Is it true?"
            answer: false
          - id: l1-c4
            type: text_input
            text: "6042 ÷ 6 = _"
            say: "Six thousand and forty-two divided by six."
            answer: "1007"
          - id: l1-c5
            type: true_false
            text: "Is it true? 1624 ÷ 4 = 406"
            say: "One thousand six hundred and twenty-four divided by four equals four hundred and six. Is it true?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "735 ÷ 7 = _"
            say: "Seven hundred and thirty-five divided by seven."
            options: ["105", "15", "150"]
            answer: "105"

  - n: 2
    title: { de: "Teilen mit Rest", en: "Remainders" }
    goal:
      de: "Teile mit Rest und entscheide in Sachaufgaben, ob du auf- oder abrundest, so wie 54 Kinder brauchen 7 Kleinbusse."
      en: "Divide with a remainder, and decide in a story whether to round up or down, like 54 children need 7 minibuses."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "721 ÷ 7 = _"
            say: "Seven hundred and twenty-one divided by seven."
            answer: "103"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "4816 ÷ 8 = _"
            say: "Four thousand eight hundred and sixteen divided by eight."
            options: ["602", "62", "620"]
            answer: "602"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "54 children go on a trip. 8 fit in each minibus. How many minibuses do they need?"
            say: "Fifty-four children go on a trip. Eight children fit in each minibus. How many minibuses do you think they need? Have a guess. We will come back to them."
          - text: "857 ÷ 4\n8 ÷ 4 = 2\n5 ÷ 4 = 1 r 1\n17 ÷ 4 = 4 r 1\n857 ÷ 4 = 214 r 1"
            say: "Eight hundred and fifty-seven divided by four. Eight divided by four is two. Five tens divided by four is one, remainder one. Seventeen ones divided by four is four, remainder one. There are no more places, so the one is left over. The answer is two hundred and fourteen remainder one."
            show: { drawn: short-division, divisor: 4, dividend: "857", quotient: "214", carries: "  1", remainder: 1 }
          - text: "The remainder is always less than the number you divide by."
            say: "If the remainder is four or more, another four would fit. So with four, the remainder can only be nought, one, two or three."
          - text: "Check: 214 × 4 + 1 = 856 + 1 = 857"
            say: "Check with the inverse: multiply the answer by four, then add the remainder. Eight hundred and fifty-six add one is eight hundred and fifty-seven."
          - text: "54 children, 8 in each minibus: 54 ÷ 8 = 6 r 6 → 7 minibuses\n54 cakes, boxes of 8: 54 ÷ 8 = 6 r 6 → 6 full boxes"
            say: "In a story, think about the remainder. Fifty-four children with eight in each minibus need seven minibuses, so the six children left over still get a seat: round up. Fifty-four cakes fill only six full boxes of eight: round down."
          - text: "Did you know? 100 days from a Monday is a Wednesday, because 100 ÷ 7 = 14 r 2."
            say: "Did you know? A remainder can tell you the day of the week. A week has seven days, and one hundred divided by seven is fourteen remainder two. So one hundred days after a Monday, fourteen whole weeks have gone by, and two more days: it is a Wednesday!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "635 ÷ 3. Write the remainder at the end."
                say: "Six hundred and thirty-five divided by three. Write the remainder at the end."
                frame: "6 ÷ 3 = 2; 3 ÷ 3 = 1; 5 ÷ 3 = 1 r _; 635 ÷ 3 = _ r _"
                options: ["2", "211", "1", "212"]
                answer: ["2", "211", "2"]
                hints:
                  - "Divide each place. What is left at the end?"
                  - "5 ÷ 3 = 1 remainder 2."
                  - "211 r 2."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Write the remainder only. 947 ÷ 5 = 189 r _"
                say: "Nine hundred and forty-seven divided by five equals one hundred and eighty-nine remainder what?"
                show: { drawn: short-division, divisor: 5, dividend: "947", quotient: "189", carries: " 44", remainder: "_" }
                answer: "2"
                hints:
                  - "Work out 189 × 5 first."
                  - "189 × 5 = 945."
                  - "947 − 945 = 2."
              - id: l2-f3
                type: multiple_choice
                text: "Which answer is right? 857 ÷ 4"
                say: "Eight hundred and fifty-seven divided by four. Which answer is right?"
                options: ["214 r 1", "213 r 5", "214 r 4"]
                answer: "214 r 1"
                feedback:
                  "213 r 5": "A remainder of 5 holds another 4. The remainder must be less than 4."
                hints:
                  - "The remainder must be less than the number you divide by."
                  - "With 4, the remainder can be 0, 1, 2 or 3."
                  - "214 r 1."
              - id: l2-f4
                type: true_false
                text: "Check with the inverse. Is 1253 ÷ 6 = 208 r 5?"
                say: "Check with the inverse. Is one thousand two hundred and fifty-three divided by six equal to two hundred and eight remainder five?"
                answer: true
                hints:
                  - "Multiply 208 by 6, then add 5."
                  - "208 × 6 = 1248."
                  - "1248 + 5 = 1253. Yes."
              - id: l2-f5
                type: multiple_choice
                text: "58 children go on a trip. Each minibus holds 8 children. How many minibuses are needed?"
                options: ["8", "7", "7 r 2"]
                answer: "8"
                feedback:
                  "7": "7 minibuses carry 56 children. The other 2 children need a seat too."
                  "7 r 2": "You can't hire 2 children's worth of minibus! A whole extra minibus is needed: 8."
                hints:
                  - "Work out 58 ÷ 8."
                  - "58 ÷ 8 = 7 r 2. Can 2 children stay at home?"
                  - "No, so round up: 8 minibuses."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
