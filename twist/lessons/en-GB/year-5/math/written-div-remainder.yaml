                answer: "127 r 1"
                hints: ["The remainder must be less than 6."]
              - id: l2-s4
                type: true_false
                text: "Check with the inverse. Is 1909 ÷ 3 = 636 r 2?"
                say: "Check with the inverse. Is one thousand nine hundred and nine divided by three equal to six hundred and thirty-six remainder two?"
                answer: false
                hints: ["636 × 3 + 2."]
              - id: l2-s5
                type: multiple_choice
                text: "A baker has 75 cupcakes. A box holds 6. How many full boxes can she fill?"
                options: ["12", "13", "12 r 3"]
                answer: "12"
                hints: ["75 ÷ 6 = 12 r 3. Is a box with 3 cakes full?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Short division with a remainder."
                say: "Nine hundred and fifty-three divided by four."
                frame: "953 ÷ 4 = _ r _"
                options: ["238", "1", "239", "3"]
                answer: ["238", "1"]
              - id: l2-n2
                type: text_input
                text: "Write the remainder only. 6047 ÷ 6 = 1007 r _"
                say: "Six thousand and forty-seven divided by six equals one thousand and seven remainder what?"
                answer: "5"
              - id: l2-n3
                type: multiple_choice
                text: "Which answer is right? 593 ÷ 7"
                say: "Five hundred and ninety-three divided by seven. Which answer is right?"
                options: ["84 r 5", "83 r 12", "84 r 7"]
                answer: "84 r 5"
              - id: l2-n4
                type: true_false
                text: "Check with the inverse. Is 4130 ÷ 8 = 516 r 2?"
                say: "Check with the inverse. Is four thousand one hundred and thirty divided by eight equal to five hundred and sixteen remainder two?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "A school needs 130 chairs for a concert. Chairs are stacked in piles of 9. How many piles must be fetched?"
                answer: "15"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
