# Lesson set: French, learning year 4 (Year 6). Hand-authored draft.
id: en-GB.fl.fr-now-and-routine
skill: fl.grammar.now-and-routine
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Jetzt und jeden Tag (Französisch)
  en: Now and every day in French
summary: >
  French uses one present tense where English has two: il lit is both he
  reads and he is reading. To stress right now, French says en train de
  (il est en train de lire); for every day, a time word (tous les jours,
  le samedi). Lesson 1 uses je and il / elle with routine words; lesson 2
  sets en train de against tous les jours and ends with the skill check.
metadata:
  year: ly-4
  topic: { de: Satzmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 11
  builds_on: [fl.themes.hobbies]
  also_practises: [fl.grammar.chunks]
  vocabulary: { fr: [je lis, il lit, elle nage, je joue, je chante, il fait du vélo, tous les jours, le samedi, le matin, maintenant, en train de] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: routine, what: { de: "sagen, was jemand jeden Tag tut: je lis, il lit", en: "saying what someone does every day: je lis, il lit" } }
    - { id: now, what: { de: "sagen, was jemand gerade tut: en train de", en: "saying what someone is doing right now: en train de" } }
    - { id: choose, what: { de: "an der Zeitangabe erkennen, ob es jetzt oder immer wieder geschieht", en: telling from the time word whether it happens now or again and again } }
  misconceptions:
    - id: two-present-tenses
      what: Tries to copy English is ...-ing word by word (il est lire)
      addressed: Learn shows that il lit already means he is reading; a word-card task offers lit as a distractor after en train de
    - id: verb-endings
      what: Uses the je form for il or elle (il lis, elle chantes)
      addressed: lesson 1 sets je and il forms side by side; a full-stage task picks the right ending
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was macht er jeden Tag?", en: "What does he do every day?" }
    goal:
      de: "Sag, was jemand immer wieder macht, mit einem Zeitwort wie tous les jours."
      en: "Say what someone does again and again, with a time word like tous les jours."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Listen. Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "nager" }
            options: [{ object: swim }, { object: read }, { object: sing }]
            answer: swim
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Listen. Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "faire du vélo" }
            options: [{ object: ride-bike }, { object: dance }, { object: paint }]
            answer: ride-bike
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "je lis · il lit\n\nDo they sound the same?"
            say: { en: "Listen to je lis, I read, and il lit, he reads. Do you think they sound the same, or different? Have a guess.", fr: "Je lis. Il lit." }
            show: { object: read }
          - text: "je lis · il lit · elle lit"
            say: { en: "They sound just the same! Only the written ending changes, from s to t. Talking about yourself, you write je lis. About a boy, il lit; about a girl, elle lit.", fr: "Je lis. Il lit. Elle lit." }
            show: { object: read }
          - text: "je chante · il chante"
            say: { en: "With verbs ending in er, like chanter, the je and il forms sound the same: je chante, il chante.", fr: "Je chante. Il chante." }
            show: { object: sing }
          - text: "Tous les jours, elle nage."
            say: { en: "Time words tell you it happens again and again: tous les jours, every day; le samedi, on Saturdays; le matin, in the morning.", fr: "Tous les jours, elle nage." }
            show: { object: swim }
          - text: "Did you know? Many children in France have no school on Wednesdays."
            say: { en: "Did you know? In France, many primary schools have no lessons on Wednesdays. So lots of French children can say: le mercredi, je joue au foot! On Wednesdays, I play football.", fr: "Le mercredi, je joue au foot." }
            show: { object: play-football }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What does Léa do every day?"
                say: { en: "Listen. What does Léa do every day?" }
                audio: { fr: "Tous les jours, Léa nage." }
                options: [{ object: swim }, { object: read }, { object: dance }]
                answer: swim
                hints:
                  - "Listen for the verb."
                  - "Nage comes from nager."
                  - "Léa swims."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Hugo reads every day. Finish the sentence."
                say: { en: "Hugo reads every day. Finish the sentence." }
                show: { object: read }
                frame: "Tous les jours, il _."
                options: ["lit", "lis", "lire"]
                answer: ["lit"]
                option_audio: false
                feedback:
                  lis: "Lis goes with je. With il, the ending is t: il lit."
                hints:
                  - "The sentence is about il, a boy."
                  - "Je lis, il lit."
                  - "Lit."
              - id: l1-f3
                type: true_false
                text: "Le samedi, je joue au foot.\n\nDoes it say what happens on Saturdays?"
                say: { en: "Read the sentence. Does it say what happens on Saturdays?" }
                answer: true
                hints:
                  - "Le samedi means on Saturdays."
                  - "Je joue au foot: I play football."
                  - "Yes."
              - id: l1-f4
                type: image_multiple_choice
                text: "Le matin, elle fait du vélo.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: ride-bike }, { object: swim }, { object: play-tennis }]
                answer: ride-bike
                option_audio: false
                hints:
                  - "Read the end: fait du vélo."
                  - "Vélo is bike."
                  - "The child on the bike."
              - id: l1-f5
                type: multiple_choice
                text: "Which time word means every day?"
                options: ["tous les jours", "le samedi", "le matin"]
                answer: "tous les jours"
                option_audio: false
                hints:
                  - "Jours means days."
                  - "Tous means all, every."
                  - "Tous les jours."
              - id: l1-f6
                type: audio_choice
                text: "What does Tom do on Saturdays?"
                say: { en: "Listen. What does Tom do on Saturdays?" }
                audio: { fr: "Le samedi, Tom joue de la guitare." }
                options: [{ object: play-guitar }, { object: play-football }, { object: sing }]
                answer: play-guitar
                hints:
                  - "Listen for joue de la."
                  - "Guitare."
                  - "He plays the guitar."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What does Chloé do in the mornings?"
                say: { en: "Listen. What does Chloé do in the mornings?" }
                audio: { fr: "Le matin, Chloé chante." }
                options: [{ object: sing }, { object: swim }, { object: paint }]
                answer: sing
                hints: ["Chante comes from chanter."]
              - id: l1-s2
                type: fill_in_blank
                text: "I read every day. Finish the sentence."
                say: { en: "I read every day. Finish the sentence." }
                show: { object: read }
                frame: "Tous les jours, je _."
                options: ["lis", "lit", "lire"]
                answer: ["lis"]
                option_audio: false
                hints: ["Je goes with s."]
              - id: l1-s3
                type: true_false
                text: "Tous les jours, il nage.\n\nDoes he swim only on Saturdays?"
                say: { en: "Read the sentence. Does he swim only on Saturdays?" }
                answer: false
                hints: ["Tous les jours means every day."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Le samedi, elle danse.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: sing }, { object: dance }, { object: read }]
                answer: dance
                option_audio: false
                hints: ["Danse comes from danser."]
              - id: l1-s5
                type: multiple_choice
                text: "Which time word means on Saturdays?"
                options: ["le samedi", "le matin", "tous les jours"]
                answer: "le samedi"
                option_audio: false
                hints: ["Samedi is Saturday."]
              - id: l1-s6
                type: speak
                say: { en: "Say in French that you sing every day.", fr: "Tous les jours, je chante." }
                show: { object: sing }
                expected_text: "tous les jours je chante"
                hints: ["Say it with me: tous les jours, je chante."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What does Nathan do every day?"
                say: { en: "Listen. What does Nathan do every day?" }
                audio: { fr: "Tous les jours, Nathan peint." }
                options: [{ object: paint }, { object: read }, { object: swim }]
                answer: paint
              - id: l1-n2
                type: fill_in_blank
                text: "She reads in the morning. Finish the sentence."
                say: { en: "She reads in the morning. Finish the sentence." }
                show: { object: read }
                frame: "Le matin, elle _."
                options: ["lit", "lis", "lire"]
                answer: ["lit"]
                option_audio: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Le samedi, il joue au tennis.\n\nWhich picture matches?"
                say: { en: "Read the sentence. Which picture matches?" }
                options: [{ object: play-football }, { object: play-tennis }, { object: play-guitar }]
                answer: play-tennis
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Le matin, je fais du vélo.\n\nDoes it happen in the morning?"
                say: { en: "Read the sentence. Does it happen in the morning?" }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which time word means in the morning?"
                options: ["le matin", "le samedi", "maintenant"]
                answer: "le matin"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "What does Inès do on Saturdays?"
            say: { en: "Listen. What does Inès do on Saturdays?" }
            audio: { fr: "Le samedi, Inès nage." }
            options: [{ object: swim }, { object: dance }, { object: ride-bike }]
            answer: swim
          - id: l1-c2
            type: fill_in_blank
            text: "My sister sings every day. Finish the sentence."
            say: { en: "My sister sings every day. Finish the sentence." }
            frame: "Tous les jours, ma sœur _."
            options: ["chante", "chantes", "chanter"]
            answer: ["chante"]
            option_audio: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Tous les jours, elle chante.\n\nWhich picture matches?"
            say: { en: "Read the sentence. Which picture matches?" }
            options: [{ object: sing }, { object: read }, { object: paint }]
            answer: sing
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Which sentence says: I read in the morning?"
            say: { en: "Which sentence says: I read in the morning?" }
            options: ["Le matin, je lis.", "Le matin, il lit.", "Le samedi, je lis."]
            answer: "Le matin, je lis."
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Le samedi, Hugo danse.\n\nDoes Hugo dance every day?"
            say: { en: "Read the sentence. Does Hugo dance every day?" }
            answer: false
          - id: l1-c6
            type: audio_choice
            text: "What does the boy do every day?"
            say: { en: "Listen. What does the boy do every day?" }
            audio: { fr: "Tous les jours, je danse dans ma chambre.", speaker: male }
            options: [{ object: sing }, { object: dance }, { object: read }]
            answer: dance

  - n: 2
    title: { de: "Jetzt oder jeden Tag?", en: "Now or every day?" }
    goal:
      de: "Erkenne, ob etwas gerade passiert oder jeden Tag, und sag mit en train de, was jemand gerade macht."
      en: "Tell right now from every day, and say what someone is doing now with en train de."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "I read every day. Finish the sentence."
            say: { en: "I read every day. Finish the sentence." }
            frame: "Tous les jours, je _."
            options: ["lis", "lit", "lire"]
            answer: ["lis"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which time word means every day?"
            options: ["tous les jours", "maintenant", "le samedi"]
            answer: "tous les jours"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "He reads.\nHe is reading.\n\nHow many ways does French have to say this?"
            say: { en: "In English you can say he reads, or he is reading. How many ways do you think French has? Have a guess." }
            show: { object: read }
          - text: "Il lit. = He reads. / He is reading."
            say: { en: "Just one! In English there are two ways: he reads, and he is reading. French has just one: il lit. It can mean both.", fr: "Il lit." }
            show: { object: read }
          - text: "Il est en train de lire."
            say: { en: "To stress right now, French says en train de: il est en train de lire, he is busy reading right now. After de, the verb stays as it is, lire.", fr: "Il est en train de lire." }
          - text: "maintenant ↔ tous les jours"
            say: { en: "Maintenant means now. Tous les jours means every day. The time word tells you which one is meant.", fr: "Maintenant, elle nage. Tous les jours, elle lit." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Elle est en train de danser.\n\nWhen is it happening?"
                say: { en: "Read the sentence. When is it happening?" }
                options: ["right now", "every day", "on Saturdays"]
                answer: "right now"
                hints:
                  - "Look for en train de."
                  - "En train de stresses right now."
                  - "Right now."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Tous les jours, il fait du vélo.\n\nWhen does it happen?"
                say: { en: "Read the sentence. When does it happen?" }
                options: ["every day", "right now", "only today"]
                answer: "every day"
                hints:
                  - "Look for the time word."
                  - "Tous les jours."
                  - "Every day."
              - id: l2-f3
                type: ordering
                text: "Build the sentence: She is reading right now."
                say: { en: "Build the sentence: She is reading right now." }
                options: ["lire", "Elle est", "en train de", "lit"]
                slot_count: 3
                answer: ["Elle est", "en train de", "lire"]
                option_audio: false
                hints:
                  - "Start with Elle est."
                  - "Then en train de, then the verb."
                  - "Elle est en train de lire."
              - id: l2-f4
                type: fill_in_blank
                text: "He is busy swimming right now. Finish the sentence."
                say: { en: "He is busy swimming right now. Finish the sentence." }
                show: { object: swim }
                frame: "Il est en train de _."
                options: ["nager", "nage", "nages"]
                answer: ["nager"]
                option_audio: false
                feedback:
                  nage: "After en train de, the verb stays as it is: nager."
                hints:
                  - "What comes after de?"
                  - "The verb in its full form."
                  - "Nager."
              - id: l2-f5
                type: true_false
                text: "\"Il lit\" can mean he reads and he is reading."
                say: { en: "Read the sentence. Is it true?" }
                answer: true
                hints:
                  - "French has one present tense."
                  - "Il lit covers both."
                  - "Yes."
              - id: l2-f6
                type: audio_choice
                text: "What is Hugo doing right now?"
                say: { en: "Listen. What is Hugo doing right now?" }
                audio: { fr: "Tous les jours, Hugo joue au foot. Mais maintenant, il est en train de lire." }
                options: [{ object: play-football }, { object: read }, { object: swim }]
                answer: read
                feedback:
                  play-football: "Football is what he does every day. Maintenant, right now, he is reading."
                hints:
                  - "Listen for maintenant."
                  - "Maintenant, il est en train de lire."
                  - "He is reading."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Je suis en train de chanter.\n\nWhen is it happening?"
                say: { en: "Read the sentence. When is it happening?" }
                options: ["right now", "every day", "on Saturdays"]
                answer: "right now"
                hints: ["En train de."]
              - id: l2-s2
                type: multiple_choice
                text: "Le samedi, elle peint.\n\nWhen does it happen?"
                say: { en: "Read the sentence. When does it happen?" }
                options: ["on Saturdays", "right now", "every morning"]
                answer: "on Saturdays"
                hints: ["Le samedi."]
              - id: l2-s3
                type: ordering
                text: "Build the sentence: I am dancing right now."
                say: { en: "Build the sentence: I am dancing right now." }
                options: ["danser", "en train de", "Je suis"]
                slot_count: 3
                answer: ["Je suis", "en train de", "danser"]
                option_audio: false
                hints: ["Je suis first."]
              - id: l2-s4
                type: fill_in_blank
                text: "She is busy painting right now. Finish the sentence."
                say: { en: "She is busy painting right now. Finish the sentence." }
                show: { object: paint }
                frame: "Elle est en train de _."
                options: ["peindre", "peint", "peins"]
                answer: ["peindre"]
                option_audio: false
                hints: ["The full verb after de."]
              - id: l2-s5
                type: true_false
                text: "Maintenant means every day."
                say: { en: "Read the sentence. Is it true?" }
                answer: false
                hints: ["Maintenant means now."]
              - id: l2-s6
                type: audio_choice
                text: "What does Léa do every day?"
                say: { en: "Listen. What does Léa do every day?" }
                audio: { fr: "Maintenant, Léa est en train de danser. Mais tous les jours, elle nage." }
                options: [{ object: dance }, { object: swim }, { object: sing }]
                answer: swim
                hints: ["Listen for tous les jours."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Nous sommes en train de jouer au tennis.\n\nWhen is it happening?"
                say: { en: "Read the sentence. When is it happening?" }
                options: ["right now", "every day", "on Saturdays"]
                answer: "right now"
              - id: l2-n2
                type: ordering
                text: "Build the sentence: He is singing right now."
                say: { en: "Build the sentence: He is singing right now." }
                options: ["chanter", "Il est", "en train de"]
                slot_count: 3
                answer: ["Il est", "en train de", "chanter"]
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "I am busy reading right now. Finish the sentence."
                say: { en: "I am busy reading right now. Finish the sentence." }
                show: { object: read }
                frame: "Je suis en train de _."
                options: ["lire", "lis", "lit"]
                answer: ["lire"]
                option_audio: false
              - id: l2-n4
                type: audio_choice
                text: "What is Tom doing right now?"
                say: { en: "Listen. What is Tom doing right now?" }
                audio: { fr: "Le samedi, Tom fait du vélo. Mais maintenant, il est en train de chanter." }
                options: [{ object: ride-bike }, { object: sing }, { object: read }]
                answer: sing
              - id: l2-n5
                type: true_false
                text: "Tous les jours, je lis.\n\nDoes it say this happens again and again?"
                say: { en: "Read the sentence. Does it say this happens again and again?" }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: routine
            type: fill_in_blank
            text: "Inès swims every day. Finish the sentence."
            say: { en: "Inès swims every day. Finish the sentence." }
            frame: "Tous les jours, Inès _."
            options: ["nage", "nager", "nages"]
            answer: ["nage"]
            option_audio: false
          - id: l2-c2
            part: choose
            type: multiple_choice
            text: "Il est en train de nager.\n\nWhich English sentence means the same?"
            say: { en: "Read the sentence. Which English sentence means the same?" }
            options: ["He is swimming right now.", "He swims every day.", "He swims on Saturdays."]
            answer: "He is swimming right now."
            option_audio: false
          - id: l2-c3
            part: now
            type: ordering
            text: "Build the sentence: Right now, I am painting."
            say: { en: "Build the sentence: right now, I am painting." }
            options: ["peindre", "je suis", "peins", "Maintenant,", "en train de"]
            slot_count: 4
            answer: ["Maintenant,", "je suis", "en train de", "peindre"]
            option_audio: false
          - id: l2-c4
            part: choose
            type: audio_choice
            text: "What is the boy doing right now?"
            say: { en: "Listen. What is the boy doing right now?" }
            audio: { fr: "Le matin, je chante. Mais maintenant, je suis en train de peindre.", speaker: male }
            options: [{ object: sing }, { object: paint }, { object: swim }]
            answer: paint
          - id: l2-c5
            part: choose
            type: matching
            text: "Match each time word to its meaning."
            say: { en: "Tap a French time word, then what it means in English." }
            option_audio: false
            pairs:
              - { left: { text: "maintenant" }, right: { text: "now" } }
              - { left: { text: "tous les jours" }, right: { text: "every day" } }
              - { left: { text: "le samedi" }, right: { text: "on Saturdays" } }
              - { left: { text: "le matin" }, right: { text: "in the morning" } }
          - id: l2-c6
            part: routine
            type: fill_in_blank
            text: "I play the guitar every morning. Finish the sentence."
            say: { en: "I play the guitar every morning. Finish the sentence." }
            frame: "Le matin, je _ de la guitare."
            options: ["joue", "jouer", "joues"]
            answer: ["joue"]
            option_audio: false
          - id: l2-c7
            part: routine
            type: audio_choice
            text: "What does the girl do on Saturdays?"
            say: { en: "Listen. What does the girl do on Saturdays?" }
            audio: { fr: "Le samedi, je fais du vélo avec papa.", speaker: female }
            options: [{ object: swim }, { object: ride-bike }, { object: play-tennis }]
            answer: ride-bike
          - id: l2-c8
            part: routine
            type: multiple_choice
            text: "Which sentence says: She reads every day?"
            say: { en: "Which sentence says: she reads every day?" }
            options: ["Tous les jours, elle lit.", "Tous les jours, elle lis.", "Maintenant, elle lit."]
            answer: "Tous les jours, elle lit."
            option_audio: false
          - id: l2-c9
            part: routine
            type: matching
            text: "Match each French sentence to its meaning."
            say: { en: "Tap a French sentence, then what it means in English." }
            option_audio: false
            pairs:
              - { left: { text: "je lis" }, right: { text: "I read" } }
              - { left: { text: "il lit" }, right: { text: "he reads" } }
              - { left: { text: "elle nage" }, right: { text: "she swims" } }
              - { left: { text: "je chante" }, right: { text: "I sing" } }
          - id: l2-c10
            part: routine
            type: true_false
            text: "Il lis tous les jours.\n\nIs this sentence right?"
            say: { en: "Read the sentence. Is it right?" }
