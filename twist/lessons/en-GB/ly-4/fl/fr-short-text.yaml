# Lesson set: French, learning year 4 (Year 6). Hand-authored draft.
id: en-GB.fl.fr-short-text
skill: fl.writing.short-text
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Einen kurzen Text schreiben (Französisch)
  en: Writing a short text in French
summary: >
  Writing a short French text about oneself from a model: a Je me présente
  profile and a holiday postcard. Lesson 1 takes a Je me présente text apart
  (name, age, family, pets, likes, can) and builds a new one for a given
  child, changing the details instead of copying them; lesson 2 learns the
  parts of a postcard (Cher or Chère ..., where you are, the weather, what
  you do, Bisous and your name) and puts one together, and ends with the
  skill check. The child writes by choosing, ordering, filling gaps and
  typing short words; free writing is not marked.
metadata:
  year: ly-4
  topic: { de: Schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.writing.complete-sentences, fl.reading.short-texts]
  also_practises: [fl.themes.family, fl.themes.hobbies, fl.themes.weather, fl.speaking.about-me]
  vocabulary: { fr: [Je me présente, "Je m'appelle ...", "J'ai ... ans", "J'ai un frère / une sœur", "J'aime ...", "Je sais ...", cher, chère, bisous, les vacances, il fait beau, il pleut, tous les jours, à bientôt] }
  forms: [text, picture, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: cher-chere
      what: Writes Cher for a woman or girl (Cher mamie), or starts the card with Bisous
      addressed: lesson 2 Learn says Cher for a man or boy, Chère for a woman or girl, and Bisous at the end before your name; l2-f1 and l2-s1 give feedback on the wrong form; l2-n1 and l2-c1 ask again
    - id: off-topic
      what: Puts a sentence into the text that does not fit the person or the topic
      addressed: l1-f5 and l2-f5 ask which sentence does not belong, with feedback naming what the text is about; l1-n4 and l2-c4 ask without help
    - id: copy-model
      what: Copies the model text word for word instead of changing the details for the new person
      addressed: lesson 1 Learn shows the model and a changed text side by side; l1-f2 and l1-s2 give feedback when the model's detail is kept
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Ein Text über mich, en: About me }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            option_audio: false
            text: "Finish the sentence to match the picture."
            say: { en: "The child can swim. Finish the sentence." }
            show: { object: swim }
            frame: "Je _ nager."
            options: ["sais", "suis", "ai"]
            answer: ["sais"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "Cher Sam,\nJe suis à la mer.\nBisous,\nNina\n\nWho wrote it?"
            say: { en: "Read the postcard. Who wrote it?" }
            options: ["Nina", "Sam"]
            answer: "Nina"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Je me présente\nJe m'appelle Ella. J'ai neuf ans. J'ai un frère et un chat. J'aime nager. Je sais jouer de la guitare."
            say: { en: "This is a model text about Ella. Je me présente means let me introduce myself. Each sentence says something different: her name, her age, her family and her pet, what she likes and what she can do." }
            show: { objects: [girl, cat] }
          - text: "Je m'appelle ...\nJ'ai ... ans.\nJ'ai un ... / une ...\nJ'aime ...\nJe sais ..."
            say: { en: "These are the sentence starts. They stay the same. For your own text you only change the end." }
          - text: "Ella: Je m'appelle Ella. J'ai neuf ans.\nJonas: Je m'appelle Jonas. J'ai dix ans."
            say: { en: "Here Jonas writes about himself with the same model. He does not copy what Ella wrote. He puts in his own name and his own age." }
            show: { object: boy }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                option_audio: false
                text: "Je me présente\nJe m'appelle Tom. J'ai _ ans."
                say: { en: "Tom is eight. Finish his text." }
                frame: "J'ai _ ans."
                options: ["huit", "neuf", "Tom"]
                answer: ["huit"]
                hints:
                  - "After j'ai comes the age."
                  - "Eight is huit."
                  - "J'ai huit ans."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                option_audio: false
                text: "Model: J'ai un frère et un chat.\nNoah has got a brother and a dog."
                say: { en: "Write Noah's sentence from the model." }
                frame: "J'ai un frère et un _."
                options: ["chien", "chat", "lapin"]
                answer: ["chien"]
                feedback:
                  "chat": "Chat is in the model. Noah has got a dog: chien."
                hints:
                  - "The start stays the same. Only swap the animal."
                  - "Noah has got a dog, not a cat."
                  - "J'ai un frère et un chien."
              - id: l1-f3
                type: ordering
                option_audio: false
                text: "Put the sentences in a good order."
                say: { en: "Build Mia's text. What comes first?" }
                options: ["J'ai neuf ans.", "J'aime peindre.", "Je m'appelle Mia."]
                slot_count: 3
                answer: ["Je m'appelle Mia.", "J'ai neuf ans.", "J'aime peindre."]
                hints:
                  - "First you say your name."
                  - "Then comes your age."
                  - "Je m'appelle Mia. J'ai neuf ans. J'aime peindre."
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "Je me présente\nJe m'appelle Léo. J'ai dix ans. ___\n\nLéo likes football. Which sentence fits?"
                say: { en: "Léo likes football. Which sentence fits in his text?" }
                options: ["J'aime le foot.", "Je suis le foot.", "Je m'appelle le foot."]
                answer: "J'aime le foot."
                hints:
                  - "Which start says what you like?"
                  - "J'aime means I like."
                  - "J'aime le foot."
              - id: l1-f5
                type: multiple_choice
                option_audio: false
                text: "Je me présente\nJe m'appelle Sara. J'ai neuf ans. J'ai un lapin. Le bus est rouge. J'aime lire.\n\nWhich sentence does not belong?"
                say: { en: "Read Sara's text. Which sentence does not belong?" }
                options: ["Le bus est rouge.", "J'ai un lapin.", "J'aime lire."]
                answer: "Le bus est rouge."
                feedback:
                  "J'ai un lapin.": "That fits: Sara is telling you about her pet. Find the sentence that says nothing about Sara."
                  "J'aime lire.": "That fits: Sara says what she likes. Find the sentence that says nothing about Sara."
                hints:
                  - "The text is called Je me présente. Every sentence says something about Sara."
                  - "Check each sentence: does it tell you about Sara, her family, what she likes or can do?"
                  - "Le bus est rouge says nothing about Sara."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                option_audio: false
                text: "Je me présente\nJe m'appelle Ben. J'ai neuf ans. Je _ faire du vélo."
                say: { en: "Ben can ride a bike. Finish his text." }
                show: { object: ride-bike }
                frame: "Je _ faire du vélo."
                options: ["sais", "suis", "ai"]
                answer: ["sais"]
                hints: ["It is about what Ben can do."]
              - id: l1-s2
                type: fill_in_blank
                option_audio: false
                text: "Model: J'aime le tennis.\nZoé likes dancing."
                say: { en: "Write Zoé's sentence from the model." }
                frame: "J'aime _."
                options: ["danser", "le tennis", "nager"]
                answer: ["danser"]
                feedback:
                  "le tennis": "Le tennis is in the model. Zoé likes dancing: danser."
                hints: ["Swap the hobby for Zoé's."]
              - id: l1-s3
                type: ordering
                option_audio: false
                text: "Put the sentences in a good order."
                say: { en: "Build Adam's text. What comes first?" }
                options: ["J'ai une sœur.", "Je m'appelle Adam.", "J'ai onze ans."]
                slot_count: 3
                answer: ["Je m'appelle Adam.", "J'ai onze ans.", "J'ai une sœur."]
                hints: ["Name first, then age."]
              - id: l1-s4
                type: multiple_choice
                option_audio: false
                text: "Je me présente\nJe m'appelle Lou. J'ai huit ans. ___\n\nLou has got a sister. Which sentence fits?"
                say: { en: "Lou has got a sister. Which sentence fits in her text?" }
                options: ["J'ai une sœur.", "J'ai un frère.", "Je suis une sœur."]
                answer: "J'ai une sœur."
                hints: ["Une sœur is a sister."]
              - id: l1-s5
                type: text_input
                keyboard: letters
                text: "Je me présente\nJe m'appelle Yanis. J'ai dix ans. J'ai un ___."
                say: { en: "Yanis has got a cat. Write the French word for cat." }
                show: { object: cat }
                answer: "chat"
                hints: ["It is c h a t."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                option_audio: false
                text: "Je me présente\nJe m'appelle Chloé. J'ai _ ans."
                say: { en: "Chloé is ten. Finish her text." }
                frame: "J'ai _ ans."
                options: ["dix", "deux", "douze"]
                answer: ["dix"]
              - id: l1-n2
                type: fill_in_blank
                option_audio: false
                text: "Model: Je sais nager.\nLina can sing."
                say: { en: "Write Lina's sentence from the model." }
                frame: "Je sais _."
                options: ["chanter", "nager", "lire"]
                answer: ["chanter"]
              - id: l1-n3
                type: ordering
                option_audio: false
                text: "Put the sentences in a good order."
                say: { en: "Build Hugo's text. What comes first?" }
                options: ["J'aime le foot.", "J'ai dix ans.", "Je m'appelle Hugo."]
                slot_count: 3
                answer: ["Je m'appelle Hugo.", "J'ai dix ans.", "J'aime le foot."]
              - id: l1-n4
                type: multiple_choice
                option_audio: false
                text: "Je me présente\nJe m'appelle Inès. J'ai neuf ans. J'ai un chien. Il pleut à Londres. Je sais nager.\n\nWhich sentence does not belong?"
                say: { en: "Read Inès's text. Which sentence does not belong?" }
                options: ["Il pleut à Londres.", "J'ai un chien.", "Je sais nager."]
                answer: "Il pleut à Londres."
              - id: l1-n5
                type: text_input
                keyboard: letters
                text: "Je me présente\nJe m'appelle Noé. J'aime ___."
                say: { en: "Noé likes reading. Write the French word for to read." }
                show: { object: read }
                answer: "lire"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            option_audio: false
            text: "Model: J'ai un chat.\nMax has got a rabbit."
            say: { en: "Write Max's sentence from the model." }
            frame: "J'ai un _."
            options: ["lapin", "chat", "chien"]
            answer: ["lapin"]
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Which sentence starts a Je me présente text?"
            say: { en: "Which sentence starts a Je me présente text?" }
            options: ["Je m'appelle Emma.", "J'aime la pizza.", "Bisous, Emma."]
            answer: "Je m'appelle Emma."
          - id: l1-c3
            type: fill_in_blank
            option_audio: false
            text: "Je me présente\nJe m'appelle Rose. J'ai neuf ans. _ jouer au tennis."
            say: { en: "Rose can play tennis. Finish her text." }
            frame: "_ jouer au tennis."
            options: ["Je sais", "Je suis", "J'ai"]
            answer: ["Je sais"]

  - n: 2
    title: { de: Eine Postkarte schreiben, en: Writing a postcard }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            option_audio: false
            text: "Je me présente\nJe m'appelle Sam. J'ai _ ans."
            say: { en: "Sam is nine. Finish his text." }
            frame: "J'ai _ ans."
            options: ["neuf", "dix"]
            answer: ["neuf"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "Je me présente\nJe m'appelle Jade. ___\n\nJade likes singing. Which sentence fits?"
            say: { en: "Jade likes singing. Which sentence fits?" }
            options: ["J'aime chanter.", "Je suis chanter."]
            answer: "J'aime chanter."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Chère mamie,\nJe suis en vacances à la mer. Il fait beau. Tous les jours, je nage.\nÀ bientôt !\nBisous,\nEmma"
            say: { en: "This is a postcard. It has four parts: who it is for, where you are and the weather, what you do, and the end with your name." }
            show: { object: sun }
          - text: "Cher papi, Cher Tom\nChère mamie, Chère Léa"
            say: { en: "The card starts with cher or chère and the name. Cher is for a man or a boy. Chère, with an e at the end, is for a woman or a girl." }
          - text: "Bisous,\nEmma"
            say: { en: "At the end you write bisous, which means kisses, or à bientôt, see you soon. Then your name. Bisous never comes at the start." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                option_audio: false
                text: "Emma writes to her grandma. How does the card start?"
                say: { en: "Emma writes to her grandma. How does the card start?" }
                frame: "_ mamie,"
                options: ["Chère", "Cher", "Bisous"]
                answer: ["Chère"]
                feedback:
                  "Cher": "Mamie is a woman, so it is chère, with an e."
                  "Bisous": "Bisous comes at the end, before your name."
                hints:
                  - "Is mamie a man or a woman?"
                  - "For a woman you write chère."
                  - "Chère mamie,"
                difficulty: easy
              - id: l2-f2
                type: ordering
                option_audio: false
                text: "Put the parts of the postcard in order."
                say: { en: "Put the parts of Tom's postcard in order." }
                options: ["Bisous, Tom", "Je suis à la montagne.", "Cher Max,", "Tous les jours, je fais du ski."]
                slot_count: 4
                answer: ["Cher Max,", "Je suis à la montagne.", "Tous les jours, je fais du ski.", "Bisous, Tom"]
                hints:
                  - "First, who the card is for."
                  - "Then where you are, then what you do."
                  - "Cher Max, je suis à la montagne, tous les jours je fais du ski, bisous, Tom."
              - id: l2-f3
                type: fill_in_blank
                option_audio: false
                text: "Chère Lola,\nJe suis à la mer. Il fait _. Je nage tous les jours."
                say: { en: "It is sunny. Finish the sentence about the weather." }
                show: { object: sun }
                frame: "Il fait _."
                options: ["beau", "froid", "pluie"]
                answer: ["beau"]
                hints:
                  - "The picture shows the sun."
                  - "Il fait beau means the weather is nice."
                  - "Il fait beau."
              - id: l2-f4
                type: fill_in_blank
                option_audio: false
                text: "Cher Léo,\nJe suis à Paris. Il pleut. _, je visite un musée."
                say: { en: "Finish the sentence. I visit a museum every day." }
                frame: "_, je visite un musée."
                options: ["Tous les jours", "Bisous", "Cher"]
                answer: ["Tous les jours"]
                hints:
                  - "The sentence says how often."
                  - "Every day is tous les jours."
                  - "Tous les jours, je visite un musée."
              - id: l2-f5
                type: multiple_choice
                option_audio: false
                text: "Chère Zoé,\nJe suis en vacances à la campagne. Il fait chaud. J'ai neuf ans. Je joue avec les poules.\nBisous,\nAdam\n\nWhich sentence does not belong?"
                say: { en: "Read Adam's postcard. Which sentence does not belong in a holiday card?" }
                options: ["J'ai neuf ans.", "Il fait chaud.", "Je joue avec les poules."]
                answer: "J'ai neuf ans."
                feedback:
                  "Il fait chaud.": "That fits: a holiday card tells you about the weather."
                  "Je joue avec les poules.": "That fits: a holiday card says what you do."
                hints:
                  - "A holiday card says where you are, the weather and what you do."
                  - "Zoé knows Adam already. Does she need his age?"
                  - "J'ai neuf ans does not belong."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                option_audio: false
                text: "Lina writes to her brother Noah. How does the card start?"
                say: { en: "Lina writes to her brother Noah. How does the card start?" }
                frame: "_ Noah,"
                options: ["Cher", "Chère", "Bisous"]
                answer: ["Cher"]
                feedback:
                  "Chère": "Noah is a boy, so it is cher, with no e."
                hints: ["Noah is a boy."]
              - id: l2-s2
                type: ordering
                option_audio: false
                text: "Put the parts of the postcard in order."
                say: { en: "Put the parts of Inès's postcard in order." }
                options: ["Il fait froid.", "Bisous, Inès", "Chère maman,"]
                slot_count: 3
                answer: ["Chère maman,", "Il fait froid.", "Bisous, Inès"]
                hints: ["Who the card is for comes first."]
              - id: l2-s3
                type: fill_in_blank
                option_audio: false
                text: "Cher papi,\nJe suis à Londres. Il _. Je prends le bus rouge."
                say: { en: "It is raining. Finish the sentence about the weather." }
                show: { object: rain }
                frame: "Il _."
                options: ["pleut", "fait beau", "neige"]
                answer: ["pleut"]
                hints: ["Il pleut means it is raining."]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Which ending is right for a postcard?"
                say: { en: "Which ending is right for a postcard?" }
                options: ["À bientôt ! Bisous, Lucas", "Cher Lucas", "Je m'appelle Lucas."]
                answer: "À bientôt ! Bisous, Lucas"
                hints: ["The end says goodbye and gives your name."]
              - id: l2-s5
                type: text_input
                keyboard: letters
                text: "Chère Jade,\nJe suis à la plage. Il fait beau.\n___,\nMaël"
                say: { en: "Write the word that means kisses, before your name at the end." }
                answer: "Bisous"
                hints: ["It starts with a capital B: B i s o u s."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                option_audio: false
                text: "Hugo writes to his friend Léa. How does the card start?"
                say: { en: "Hugo writes to his friend Léa. How does the card start?" }
                frame: "_ Léa,"
                options: ["Chère", "Cher", "Bisous"]
                answer: ["Chère"]
              - id: l2-n2
                type: ordering
                option_audio: false
                text: "Put the parts of the postcard in order."
                say: { en: "Put the parts of Sam's postcard in order." }
                options: ["Tous les jours, je joue au foot.", "Cher Ben,", "Bisous, Sam", "Je suis chez mamie."]
                slot_count: 4
                answer: ["Cher Ben,", "Je suis chez mamie.", "Tous les jours, je joue au foot.", "Bisous, Sam"]
              - id: l2-n3
                type: fill_in_blank
                option_audio: false
                text: "Chère Clara,\nJe suis à la montagne. Il _. Je fais un bonhomme de neige !"
                say: { en: "It is snowing. Finish the sentence about the weather." }
                show: { object: snow }
                frame: "Il _."
                options: ["neige", "pleut", "fait beau"]
                answer: ["neige"]
              - id: l2-n4
                type: multiple_choice
                option_audio: false
                text: "Which line starts a postcard to Grandpa?"
                say: { en: "Which line starts a postcard to Grandpa?" }
                options: ["Cher papi,", "Chère papi,", "Bisous, papi,"]
                answer: "Cher papi,"
              - id: l2-n5
                type: text_input
                keyboard: letters
                text: "Cher Paul,\nJe suis en vacances. Tous les ___, je nage."
                say: { en: "Write the missing word. Tous les ... means every day." }
                answer: "jours"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            option_audio: false
            text: "Nathan writes to his mum. How does the card start?"
            say: { en: "Nathan writes to his mum. How does the card start?" }
            frame: "_ maman,"
            options: ["Chère", "Cher", "Bisous"]
            answer: ["Chère"]
          - id: l2-c2
            type: ordering
            option_audio: false
            text: "Put the parts of the postcard in order."
            say: { en: "Put the parts of Jade's postcard in order." }
            options: ["Bisous, Jade", "Il fait chaud.", "Cher papa,", "Je suis à la plage."]
            slot_count: 4
            answer: ["Cher papa,", "Je suis à la plage.", "Il fait chaud.", "Bisous, Jade"]
          - id: l2-c3
            type: fill_in_blank
            option_audio: false
            text: "Model: Je m'appelle Ella. J'ai neuf ans.\nOscar is eleven."
            say: { en: "Write Oscar's sentences from the model." }
            frame: "Je m'appelle _. J'ai _ ans."
            options: ["Oscar", "onze", "Ella", "neuf"]
            answer: ["Oscar", "onze"]
          - id: l2-c4
            type: multiple_choice
            option_audio: false
            text: "Je me présente\nJe m'appelle Manon. J'ai dix ans. J'ai deux frères. La tour Eiffel est grande. J'aime danser.\n\nWhich sentence does not belong?"
            say: { en: "Read Manon's text. Which sentence does not belong?" }
            options: ["La tour Eiffel est grande.", "J'ai deux frères.", "J'aime danser."]
            answer: "La tour Eiffel est grande."
          - id: l2-c5
            type: text_input
            keyboard: letters
            text: "Je me présente\nJe m'appelle Tom. J'ai un ___."
            say: { en: "Tom has got a dog. Write the French word for dog." }
            show: { object: dog }
            answer: "chien"
