# Lesson set: French, learning year 4 (Year 6). Hand-authored draft.
id: en-GB.fl.fr-gender-verbs
skill: fl.grammar.gender-verbs
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Genus und häufige Verben (Französisch)
  en: Gender and key verbs in French
summary: >
  French nouns are masculine or feminine, and the article shows which: un
  or une, le or la, and l' before a vowel. Lesson 1 sorts nouns by gender,
  chooses the article and learns to learn every noun with its article.
  Lesson 2 conjugates être (je suis, tu es, il est, elle est) and lesson 3
  avoir (j'ai, tu as, il a, elle a), sets the two side by side (j'ai dix
  ans, je suis grand) and ends with the skill check. Instructions are in
  English; English has no gender for things and only one the, so the
  lessons say that plainly.
metadata:
  year: ly-4
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.plurals-articles, fl.grammar.he-she-it]
  also_practises: [fl.grammar.plurals-articles, fl.grammar.he-she-it]
  vocabulary: { fr: [un, une, le, la, "l'", les, masculin, féminin, le chat, la pomme, le livre, la maison, "l'arbre", "l'école", je suis, tu es, il est, elle est, "j'ai", tu as, il a, elle a] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: gender, what: { de: "am Artikel erkennen, ob ein Nomen männlich oder weiblich ist", en: telling from the article whether a noun is masculine or feminine } }
    - { id: article, what: { de: "den passenden Artikel wählen: un, une, le, la, l'", en: "choosing the matching article: un, une, le, la, l'" } }
    - { id: etre, what: { de: "être konjugieren: je suis, tu es, il est, elle est", en: "conjugating être: je suis, tu es, il est, elle est" } }
    - { id: avoir, what: { de: "avoir konjugieren: j'ai, tu as, il a, elle a", en: "conjugating avoir: j'ai, tu as, il a, elle a" } }
    - { id: etre-avoir, what: { de: "être oder avoir wählen, auch beim Alter", en: "choosing être or avoir, also for your age" } }
  misconceptions:
    - id: one-article
      what: Uses le or un for every noun, because English has only the and a
      addressed: lesson 1 Learn says every French noun is masculine or feminine and shows le and la, un and une; l1-f1, l1-f2, l1-s2 and l3-c1 ask for the article, with feedback in l1-f2
    - id: le-before-vowel
      what: Writes le arbre or la école instead of l'arbre, l'école
      addressed: lesson 1 Learn shows l' before a vowel; l1-f4, l1-s4, l1-n4 and l3-c2 ask for it, with feedback in l1-f4
    - id: verb-forms
      what: Uses one form for every person (je est, tu suis, il as)
      addressed: lessons 2 and 3 Learn give each person its form; l2-f2, l2-s2, l3-f2 and l3-c3, l3-c4 ask for the form, with feedback in l2-f2 and l3-f2
    - id: etre-avoir-age
      what: Uses être for age (je suis dix ans), as in English
      addressed: lesson 3 Learn sets j'ai dix ans against je suis grand; l3-f4, l3-s4 and l3-c5 ask, with feedback in l3-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Le oder la? Un oder une?", en: "Le or la? Un or une?" }
    goal:
      de: "Wähl für jedes französische Wort le oder la, un oder une, so wie la pomme und le chien."
      en: "Choose le or la, un or une for each French word, like la pomme and le chien."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            option_audio: false
            text: "One dog, two dogs.\nun chien, deux ___"
            say: { en: "Which word fits? One dog, two dogs." }
            options: ["chiens", "chien", "chienes"]
            answer: "chiens"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Who is it about, a boy or a girl?"
            say: { en: "Listen. Who is it about, a boy or a girl?" }
            audio: { fr: "Elle a un chat." }
            options: [{ object: boy }, { object: girl }]
            answer: girl
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "le chat, un chat\nla pomme, une pomme"
            say: { en: "In French every noun is masculine or feminine, even things. You can tell from the little word in front. Masculine nouns take le and un. Feminine nouns take la and une. In English we just say the and a.", fr: "Le chat. Un chat. La pomme. Une pomme." }
            show: { objects: [cat, apple] }
          - text: "l'arbre, l'école"
            say: { en: "Before a vowel, le and la both become l'. L'arbre is masculine, l'école is feminine, but both have l'.", fr: "L'arbre. L'école." }
            show: { object: tree }
          - text: "Learn it like this:\nun livre, une maison"
            say: { en: "You cannot always see the gender from the noun. So learn every new noun with un or une. Say it, write it, and keep them together.", fr: "Un livre. Une maison." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                option_audio: false
                text: "the apple: ___ pomme\n(feminine)"
                say: { en: "Pomme is feminine. Which word goes in front for the?" }
                show: { object: apple }
                options: ["la", "le", "un"]
                answer: "la"
                hints:
                  - "Feminine nouns take la or une."
                  - "You need the word for the."
                  - "La pomme."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "a dog: ___ chien\n(masculine)"
                say: { en: "Chien is masculine. Which word goes in front for a?" }
                show: { object: dog }
                options: ["un", "une", "la"]
                answer: "un"
                feedback:
                  "une": "Une is for feminine nouns. Chien is masculine: un chien."
                hints:
                  - "Masculine nouns take le or un."
                  - "You need the word for a."
                  - "Un chien."
              - id: l1-f3
                type: sorting
                text: "Masculine or feminine?"
                say: { en: "Look at the article. Sort the nouns: masculine or feminine?" }
                option_audio: false
                bins:
                  - { id: m, show: { text: "masculine (le, un)" } }
                  - { id: f, show: { text: "feminine (la, une)" } }
                options:
                  - { text: "le livre", bin: m }
                  - { text: "un vélo", bin: m }
                  - { text: "la table", bin: f }
                  - { text: "une fleur", bin: f }
                hints:
                  - "Look only at the little word in front."
                  - "Le and un are masculine. La and une are feminine."
                  - "Le livre, un vélo: masculine. La table, une fleur: feminine."
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "___ arbre"
                say: { en: "Which is the right way to say the tree?" }
                show: { object: tree }
                options: ["l'arbre", "le arbre", "la arbre"]
                answer: "l'arbre"
                feedback:
                  "le arbre": "Arbre starts with a vowel, so le becomes l': l'arbre."
                hints:
                  - "Look at the first letter of arbre."
                  - "Before a vowel, le and la become l'."
                  - "L'arbre."
              - id: l1-f5
                type: true_false
                text: "In French, a table is masculine because it is a thing."
                say: { en: "Is this true?" }
                answer: false
                hints:
                  - "Do things have a gender in French?"
                  - "Every noun has a gender, but it does not depend on what it is."
                  - "No: it is la table, feminine."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                option_audio: false
                text: "a house: ___ maison\n(feminine)"
                say: { en: "Maison is feminine. Which word goes in front for a?" }
                show: { object: house }
                options: ["une", "un", "le"]
                answer: "une"
                hints: ["Feminine: une."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "un soleil → ___ soleil"
                say: { en: "Un soleil is masculine. How do you say the sun?" }
                show: { object: sun }
                options: ["le", "la", "l'"]
                answer: "le"
                hints: ["Un goes with le."]
              - id: l1-s3
                type: sorting
                text: "Masculine or feminine?"
                say: { en: "Look at the article. Sort the nouns: masculine or feminine?" }
                option_audio: false
                bins:
                  - { id: m, show: { text: "masculine (le, un)" } }
                  - { id: f, show: { text: "feminine (la, une)" } }
                options:
                  - { text: "une voiture", bin: f }
                  - { text: "le lit", bin: m }
                  - { text: "la porte", bin: f }
                  - { text: "un crayon", bin: m }
                hints: ["Look at the little word in front."]
              - id: l1-s4
                type: multiple_choice
                option_audio: false
                text: "___ école"
                say: { en: "Which is the right way to say the school?" }
                show: { object: school }
                options: ["l'école", "la école", "le école"]
                answer: "l'école"
                hints: ["École starts with a vowel."]
              - id: l1-s5
                type: multiple_choice
                text: "What is the best way to learn a new French noun?"
                say: { en: "What is the best way to learn a new French noun?" }
                options: ["Learn it with un or une.", "Learn the noun on its own.", "Guess the gender each time."]
                answer: "Learn it with un or une."
                hints: ["The article tells you the gender."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                option_audio: false
                text: "the chair: ___ chaise\n(feminine)"
                say: { en: "Chaise is feminine. Which word goes in front for the?" }
                show: { object: chair }
                options: ["la", "le", "une"]
                answer: "la"
              - id: l1-n2
                type: matching
                option_audio: false
                text: "Match each noun with a to the same noun with the."
                say: { en: "Tap a noun with a, then the same noun with the." }
                pairs:
                  - { left: { text: "un stylo" }, right: { text: "le stylo" } }
                  - { left: { text: "une règle" }, right: { text: "la règle" } }
                  - { left: { text: "un ami" }, right: { text: "l'ami" } }
              - id: l1-n3
                type: sorting
                text: "Masculine or feminine?"
                say: { en: "Look at the article. Sort the nouns: masculine or feminine?" }
                option_audio: false
                bins:
                  - { id: m, show: { text: "masculine (le, un)" } }
                  - { id: f, show: { text: "feminine (la, une)" } }
                options:
                  - { text: "la lune", bin: f }
                  - { text: "un gâteau", bin: m }
                  - { text: "une gomme", bin: f }
                  - { text: "le sac", bin: m }
              - id: l1-n4
                type: multiple_choice
                option_audio: false
                text: "___ orange"
                say: { en: "Which is the right way to say the orange?" }
                show: { object: orange }
                options: ["l'orange", "la orange", "le orange"]
                answer: "l'orange"
              - id: l1-n5
                type: true_false
                text: "L'arbre is masculine and l'école is feminine, but both start with l'."
                say: { en: "Is this true?" }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            option_audio: false
            text: "a book: ___ livre\n(masculine)"
            say: { en: "Livre is masculine. Which word goes in front for a?" }
            show: { object: book }
            options: ["un", "une"]
            answer: "un"
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "the flower: ___ fleur\n(feminine)"
            say: { en: "Fleur is feminine. Which word goes in front for the?" }
            show: { object: flower }
            options: ["la", "le", "l'"]
            answer: "la"
          - id: l1-c3
            type: multiple_choice
            option_audio: false
            text: "___ oiseau"
            say: { en: "Which is the right way to say the bird?" }
            show: { object: bird }
            options: ["l'oiseau", "le oiseau", "la oiseau"]
            answer: "l'oiseau"
          - id: l1-c4
            type: true_false
            text: "La lune is a masculine noun."
            say: { en: "La lune is a masculine noun. Is this true?" }
            answer: false
          - id: l1-c5
            type: fill_in_blank
            option_audio: false
            text: "A pencil and a rubber. Finish it in French."
            say: { en: "A pencil and a rubber. Finish it in French." }
            frame: "_ crayon et _ gomme"
            options: ["un", "une"]
            answer: ["un", "une"]
          - id: l1-c6
            type: multiple_choice
            option_audio: false
            text: "Which noun do you write with l' for the?"
            say: { en: "Which noun do you write with l' for the?" }
            options: ["ananas", "vélo", "bus"]
            answer: "ananas"

  - n: 2
    title: { de: "Être: je suis, tu es, il est", en: "Être: je suis, tu es, il est" }
    goal:
      de: "Nimm die richtige Form von être, um zu sagen, wie jemand ist, zum Beispiel je suis oder elle est."
      en: "Use the right form of être to say how someone is, like je suis or elle est."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            option_audio: false
            text: "an apple: ___ pomme\n(feminine)"
            say: { en: "Pomme is feminine. Which word goes in front for a?" }
            options: ["une", "un"]
            answer: "une"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "___ école"
            say: { en: "Which is the right way to say the school?" }
            options: ["l'école", "la école"]
            answer: "l'école"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "être = to be\nje suis\ntu es\nil est, elle est"
            say: { en: "Être means to be. In English, I am, you are, he is. In French each person has its own form too: je suis, tu es, il est, elle est.", fr: "Je suis. Tu es. Il est. Elle est." }
          - text: "Je suis content.\nTu es grand.\nElle est petite."
            say: { en: "Listen to them in sentences. Je suis content: I am happy. Tu es grand: you are tall. Elle est petite: she is small.", fr: "Je suis content. Tu es grand. Elle est petite." }
            show: { object: happy }
          - text: "Tu es fatigué ? Oui, je suis fatigué."
            say: { en: "When someone asks with tu es, you answer with je suis.", fr: "Tu es fatigué ? Oui, je suis fatigué." }
            show: { object: tired }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                option_audio: false
                text: "Match each person to its form of être."
                say: { en: "Tap a person, then the right form of être." }
                pairs:
                  - { left: { text: "je" }, right: { text: "suis" } }
                  - { left: { text: "tu" }, right: { text: "es" } }
                  - { left: { text: "il" }, right: { text: "est" } }
                hints:
                  - "Start with the one you know best: je."
                  - "Je suis, tu es."
                  - "Je suis, tu es, il est."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                option_audio: false
                text: "I am tired. Finish the sentence."
                say: { en: "I am tired. Finish the sentence." }
                show: { object: tired }
                frame: "Je _ fatigué."
                options: ["suis", "est", "es"]
                answer: ["suis"]
                feedback:
                  "est": "Est goes with il or elle. With je you say suis."
                hints:
                  - "The sentence starts with je."
                  - "With je, être becomes suis."
                  - "Je suis fatigué."
              - id: l2-f3
                type: fill_in_blank
                option_audio: false
                text: "She is sad. Finish the sentence."
                say: { en: "She is sad. Finish the sentence." }
                show: { object: sad }
                frame: "Elle _ triste."
                options: ["est", "suis", "es"]
                answer: ["est"]
                hints:
                  - "Elle goes with the same form as il."
                  - "Il est, elle est."
                  - "Elle est triste."
              - id: l2-f4
                type: audio_choice
                text: "Who is it about?"
                say: { en: "Listen. Who is it about?" }
                audio: { fr: "Tu es très grand !" }
                options: ["you", "me", "her"]
                answer: "you"
                hints:
                  - "Listen to the first word."
                  - "Tu means you."
                  - "Tu es: you are."
              - id: l2-f5
                type: ordering
                option_audio: false
                text: "Build the sentence: You are happy."
                say: { en: "Build the sentence: You are happy." }
                options: ["content.", "Tu", "es"]
                slot_count: 3
                answer: ["Tu", "es", "content."]
                hints:
                  - "Start with the person."
                  - "Then the form of être for tu."
                  - "Tu es content."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                option_audio: false
                text: "He is angry. Finish the sentence."
                say: { en: "He is angry. Finish the sentence." }
                show: { object: angry }
                frame: "Il _ en colère."
                options: ["est", "es", "suis"]
                answer: ["est"]
                hints: ["Il est."]
              - id: l2-s2
                type: multiple_choice
                option_audio: false
                text: "Which sentence is right?"
                say: { en: "Which sentence is right?" }
                options: ["Tu es petit.", "Tu est petit.", "Tu suis petit."]
                answer: "Tu es petit."
                hints: ["Tu goes with es."]
              - id: l2-s3
                type: audio_choice
                text: "Who is it about?"
                say: { en: "Listen. Who is it about?" }
                audio: { fr: "Je suis content aujourd'hui.", speaker: male }
                options: ["me, the speaker", "you", "him"]
                answer: "me, the speaker"
                hints: ["Je means I."]
              - id: l2-s4
                type: true_false
                text: "Tu es means you are."
                say: { en: "Is this true?" }
                answer: true
                hints: ["Tu is you."]
              - id: l2-s5
                type: speak
                say: { en: "Say in French that you are happy.", fr: "Je suis content." }
                show: { object: happy }
                expected_text: "Je suis content."
                hints: ["Je suis, then content."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                option_audio: false
                text: "You are tired. Finish the sentence."
                say: { en: "You are tired. Finish the sentence." }
                show: { object: tired }
                frame: "Tu _ fatigué."
                options: ["es", "est", "suis"]
                answer: ["es"]
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "Which sentence is right?"
                say: { en: "Which sentence is right?" }
                options: ["Elle est grande.", "Elle es grande.", "Elle suis grande."]
                answer: "Elle est grande."
              - id: l2-n3
                type: ordering
                option_audio: false
                text: "Build the sentence: I am tall."
                say: { en: "Build the sentence: I am tall." }
                options: ["grand.", "suis", "Je"]
                slot_count: 3
                answer: ["Je", "suis", "grand."]
              - id: l2-n4
                type: true_false
                text: "Je est triste is right."
                say: { en: "Is this true?" }
                answer: false
              - id: l2-n5
                type: audio_choice
                text: "Who is tired?"
                say: { en: "Listen. Who is tired?" }
                audio: { fr: "Il est fatigué." }
                options: ["he", "she", "you"]
                answer: "he"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: fill_in_blank
            option_audio: false
            text: "She is happy. Finish the sentence."
            say: { en: "She is happy. Finish the sentence." }
            frame: "Elle _ contente."
            options: ["est", "es", "suis"]
            answer: ["est"]
          - id: l2-c2
            type: multiple_choice
            option_audio: false
            text: "Which form of être goes with je?"
            say: { en: "Which form of être goes with je?" }
            options: ["suis", "es", "est"]
            answer: "suis"
          - id: l2-c3
            type: multiple_choice
            option_audio: false
            text: "Tu es fatigué ?\n\nWhich answer is right?"
            say: { en: "Someone asks: tu es fatigué? Which answer is right?" }
            options: ["Oui, je suis fatigué.", "Oui, tu es fatigué.", "Oui, je est fatigué."]
            answer: "Oui, je suis fatigué."
          - id: l2-c4
            type: ordering
            option_audio: false
            text: "Build the sentence: He is sad."
            say: { en: "Build the sentence: He is sad." }
            options: ["triste.", "est", "Il"]
            slot_count: 3
            answer: ["Il", "est", "triste."]
          - id: l2-c5
            type: true_false
            text: "Il est means he has."
            say: { en: "Il est means he has. Is this true?" }
            answer: false
          - id: l2-c6
            type: audio_choice
            text: "Listen. How does the girl feel?"
            say: { en: "Listen. How does the girl feel?" }
            audio: { fr: "Je suis triste.", speaker: female }
            options: [{ object: happy }, { object: sad }, { object: tired }]
            answer: sad

  - n: 3
    title: { de: "Avoir: j'ai, tu as, il a", en: "Avoir: j'ai, tu as, il a" }
    goal:
      de: "Sag mit avoir, was jemand hat und wie alt du bist, so wie j'ai dix ans."
      en: "Use avoir to say what someone has and how old you are, like j'ai dix ans."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: fill_in_blank
            option_audio: false
            text: "You are tall. Finish the sentence."
            say: { en: "You are tall. Finish the sentence." }
            frame: "Tu _ grand."
            options: ["es", "suis"]
            answer: ["es"]
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            option_audio: false
            text: "Which sentence is right?"
            say: { en: "Which sentence is right?" }
            options: ["Il est petit.", "Il suis petit."]
            answer: "Il est petit."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "avoir = to have\nj'ai\ntu as\nil a, elle a"
            say: { en: "Avoir means to have. J'ai, I have. Tu as, you have. Il a, elle a, he has, she has. Je becomes j' before ai.", fr: "J'ai. Tu as. Il a. Elle a." }
          - text: "J'ai un chien.\nTu as une sœur ?\nElle a un vélo."
            say: { en: "Listen to them in sentences.", fr: "J'ai un chien. Tu as une sœur ? Elle a un vélo." }
            show: { objects: [dog, bike] }
          - text: "J'ai dix ans. (avoir)\nJe suis grand. (être)"
            say: { en: "Your age goes with avoir: j'ai dix ans. How you are goes with être: je suis grand, je suis content.", fr: "J'ai dix ans. Je suis grand." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: matching
                option_audio: false
                text: "Match each person to its form of avoir."
