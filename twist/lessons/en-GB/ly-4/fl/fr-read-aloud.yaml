# Lesson set: French, learning year 4 (Year 6). Hand-authored draft.
id: en-GB.fl.fr-read-aloud
skill: fl.reading.read-aloud
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Laut vorlesen (Französisch)
  en: Reading aloud in French
summary: >
  Reading a short familiar French text aloud so that others understand.
  Lesson 1 works on the sounds: the last consonant you do not say (chat,
  grand, trois), the silent -ent of ils chantent, and the nasal sounds in
  bon, blanc and pain. Lesson 2 works on the flow: linking words in a
  liaison (les amis), pausing at commas and full stops, and letting the
  voice rise for a question and fall for a statement; the child then reads
  a short text about a pet. It ends with the skill check. Reading aloud is
  practised with speak tasks, which are never marked; the skill check asks
  about silent letters, liaison, pauses and intonation by choosing and
  tapping.
metadata:
  year: ly-4
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.short-texts, fl.speaking.imitate]
  also_practises: [fl.reading.sound-spelling, fl.speaking.imitate]
  vocabulary: { fr: [le chat, grand, trois, vert, gros, le lit, ils chantent, ils dansent, bon, blanc, le pain, les amis, les enfants, "Tu viens ?"] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: silent, what: { de: "stumme Buchstaben am Wortende, auch -ent", en: "silent letters at the end of a word, also -ent" } }
    - { id: nasal, what: { de: Nasallaute erkennen, en: recognising nasal sounds } }
    - { id: liaison, what: { de: Wörter in der Liaison verbinden, en: linking words in a liaison } }
    - { id: pause, what: { de: an Komma und Punkt eine Pause machen, en: pausing at commas and full stops } }
    - { id: intonation, what: { de: "die Stimme bei der Frage heben, beim Aussagesatz senken", en: "letting the voice rise for a question and fall for a statement" } }
  misconceptions:
    - id: say-every-letter
      what: Says every written letter, as in English (the t of chat, the s of trois)
      addressed: lesson 1 Learn shows that a last consonant is usually silent; l1-f1, l1-f2, l1-s1, l1-n1 and l2-c1 ask for the silent letter, with feedback in l1-f2
    - id: say-ent
      what: Reads the -ent of ils chantent aloud
      addressed: lesson 1 Learn says the -ent of a verb after ils or elles is silent; l1-f4, l1-s4 and l2-c2 ask about it, with feedback in l1-f4
    - id: flat-voice
      what: Reads with no pauses and the same flat voice for a question and a statement
      addressed: lesson 2 Learn shows pauses at commas and full stops and the rising voice in a question; l2-f3, l2-f4, l2-s3, l2-s4 and l2-c4, l2-c5 ask about them, with feedback in l2-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Laute und stumme Buchstaben, en: Sounds and silent letters }
    goal:
      de: "Lies Französisch laut vor und lass die Buchstaben weg, die man nicht spricht, wie am Ende von chat."
      en: "Read French aloud and leave out the letters you do not say, like at the end of chat."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: speak
            say: { en: "Listen and repeat.", fr: "Bonjour ! Je m'appelle Léa." }
            expected_text: "Bonjour ! Je m'appelle Léa."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "Le chat est sous la table.\n\nWhere is the cat?"
            say: { en: "Read the sentence. Where is the cat?" }
            options: ["under the table", "on the table", "next to the table"]
            answer: "under the table"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "le chat, grand, trois, vert"
            say: { en: "When you read French aloud, many letters at the end of a word stay silent. Listen: you do not say the t of chat, the d of grand, the s of trois or the t of vert.", fr: "Le chat. Grand. Trois. Vert." }
            show: { drawn: letter-card, text: "chat grand trois vert" }
          - text: "ils chantent, elles dansent"
            say: { en: "The -ent at the end of a verb after ils or elles is silent too. The s of ils is silent before a consonant, so ils chantent sounds just like il chante.", fr: "Il chante. Ils chantent." }
            show: { drawn: letter-card, text: "ils chantent" }
          - text: "bon, blanc, le pain"
            say: { en: "Some sounds come through your nose. These are the nasal sounds. You do not say the n or the m clearly. Listen and copy.", fr: "Bon. Blanc. Le pain." }
            show: { drawn: letter-card, text: "bon blanc pain" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the letter you do not say."
                say: { en: "The word chat is split into letters. Listen, then tap the letter you do not say.", fr: "Le chat." }
                show: { drawn: letter-card, text: "c h a t" }
                spans: ["t"]
                hints:
                  - "Listen again: chat."
                  - "Look at the end of the word."
                  - "You do not say the t."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the letter you do not say."
                say: { en: "The word trois is split into letters. Listen, then tap the letter you do not say.", fr: "Trois." }
                show: { drawn: letter-card, text: "t r o i s" }
                spans: ["s"]
                feedback:
                  t: "You do say the t at the start: trois. The silent letter is at the end."
                hints:
                  - "Listen to the end of the word."
                  - "A last consonant in French is often silent."
                  - "You do not say the s."
              - id: l1-f3
                type: multiple_choice
                option_audio: false
                text: "Which word has a silent last letter?"
                say: { en: "Which word has a last letter you do not say?" }
                options: ["grand", "il", "avec"]
                answer: "grand"
                hints:
                  - "Say each word in your head."
                  - "The d of grand is silent."
                  - "Grand."
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "Ils chantent.\n\nWhich letters do you not say?"
                say: { en: "Which letters do you not say in this sentence?" }
                options: ["the -ent and the s of ils", "the ch", "nothing, you say every letter"]
                answer: "the -ent and the s of ils"
                feedback:
                  "nothing, you say every letter": "In French the -ent of the verb is silent, and so is the s of ils: ils chantent sounds like il chante."
                hints:
                  - "Ils chantent sounds like il chante."
                  - "The ending of the verb is silent, and so is the s of ils."
                  - "The -ent and the s of ils."
              - id: l1-f5
                type: speak
                say: { en: "Read the sentence aloud. Watch out for the silent letters at the ends of the words.", fr: "Le chat est petit et gris." }
                show: { drawn: letter-card, text: "Le chat est petit et gris." }
                expected_text: "Le chat est petit et gris."
                hints:
                  - "Listen again and read with me."
                  - "The t of chat, est and petit and the s of gris are silent."
                  - "Read it with me: le chat est petit et gris."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the letter you do not say."
                say: { en: "The word vert is split into letters. Listen, then tap the letter you do not say.", fr: "Vert." }
                show: { drawn: letter-card, text: "v e r t" }
                spans: ["t"]
                hints: ["Look at the very last letter."]
              - id: l1-s2
                type: audio_choice
                text: "Which word do you hear?"
                say: { en: "Listen. Which word do you hear?" }
                audio: { fr: "Gros." }
                options: ["gros", "grand", "gris"]
                answer: "gros"
                hints: ["Listen to the vowel in the middle."]
              - id: l1-s3
                type: multiple_choice
                option_audio: false
                text: "Which word has a nasal sound, through your nose?"
                say: { en: "Which word has a nasal sound, a sound through your nose?" }
                options: ["blanc", "lit", "vert"]
                answer: "blanc"
                hints: ["Look for an or on."]
              - id: l1-s4
                type: true_false
                text: "In elles dansent, you say the -ent at the end."
                say: { en: "Is this true?" }
                answer: false
                hints: ["Elles dansent sounds like elle danse."]
              - id: l1-s5
                type: speak
                say: { en: "Read the sentence aloud.", fr: "Ils chantent et ils dansent." }
                show: { drawn: letter-card, text: "Ils chantent et ils dansent." }
                expected_text: "Ils chantent et ils dansent."
                hints: ["The -ent is silent."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the letter you do not say."
                say: { en: "The word grand is split into letters. Listen, then tap the letter you do not say.", fr: "Grand." }
                show: { drawn: letter-card, text: "g r a n d" }
                spans: ["d"]
              - id: l1-n2
                type: audio_choice
                text: "Which word do you hear?"
                say: { en: "Listen. Which word do you hear?" }
                audio: { fr: "Bon." }
                options: ["bon", "beau", "bain"]
                answer: "bon"
              - id: l1-n3
                type: multiple_choice
                option_audio: false
                text: "Ils jouent.\n\nWhich sounds the same?"
                say: { en: "Which sounds the same as ils jouent?" }
                options: ["il joue", "il jouent", "ils joue-ent"]
                answer: "il joue"
              - id: l1-n4
                type: true_false
                text: "In petit, you say the last t."
                say: { en: "Is this true?" }
                answer: false
              - id: l1-n5
                type: speak
                say: { en: "Read the sentence aloud." }
                show: { drawn: letter-card, text: "Mon chien est grand et blanc." }
                expected_text: "Mon chien est grand et blanc."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the letter you do not say."
            say: { en: "The word lit is split into letters. Listen, then tap the letter you do not say.", fr: "Le lit." }
            show: { drawn: letter-card, text: "l i t" }
            spans: ["t"]
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Which word has a silent last letter?"
            say: { en: "Which word has a last letter you do not say?" }
            options: ["gros", "bus", "sac"]
            answer: "gros"
          - id: l1-c3
            type: true_false
            text: "Ils mangent sounds like il mange."
            say: { en: "Is this true?" }
            answer: true
          - id: l1-c4
            type: highlight_in_text
            text: "Tap the letter you do not say."
            say: { en: "The word nez is split into letters. Listen, then tap the letter you do not say.", fr: "Le nez." }
            show: { drawn: letter-card, text: "n e z" }
            spans: ["z"]
          - id: l1-c5
            type: audio_choice
            text: "Which word do you hear?"
            say: { en: "Listen. Which word do you hear?" }
            audio: { fr: "Rond." }
            options: ["rouge", "rond", "robe"]
            answer: "rond"
          - id: l1-c6
            type: true_false
            text: "In ils dansent, you say the s of ils."
            say: { en: "In ils dansent, you say the s of ils. Is this true?" }
            answer: false

  - n: 2
    title: { de: Flüssig und mit Satzmelodie, en: Reading with flow and intonation }
    goal:
      de: "Lies einen kurzen Text flüssig vor, verbinde Wörter wie les amis und heb die Stimme bei einer Frage."
      en: "Read a short text aloud smoothly, link words like les amis, and let your voice go up for a question."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the letter you do not say."
            say: { en: "The word gris is split into letters. Listen, then tap the letter you do not say.", fr: "Gris." }
            show: { drawn: letter-card, text: "g r i s" }
            spans: ["s"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ils dansent sounds like il danse."
            say: { en: "Is this true?" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "les amis → lé-z-amis\nles chats → lé chats"
            say: { en: "When a word ends in a silent s and the next word starts with a vowel, you link them. The s now sounds like z. This is called a liaison. Before a consonant, there is no link.", fr: "Les amis. Les chats." }
            show: { drawn: letter-card, text: "les amis" }
          - text: "Le chat dort, le chien joue."
            say: { en: "At a comma, make a short pause. At a full stop, make a longer pause. Then listeners can follow you.", fr: "Le chat dort, le chien joue." }
            show: { drawn: letter-card, text: "Le chat dort, le chien joue." }
          - text: "Tu viens ? ↗\nTu viens. ↘"
            say: { en: "In a question your voice goes up at the end. In a statement it goes down. Listen to the difference.", fr: "Tu viens ? Tu viens." }
          - text: "Voici Pixel. C'est mon chat. Il est noir et blanc. Il aime dormir. Tu as un chat ?"
            say: { en: "Now listen to a short text read aloud. Listen for the silent letters, the pauses and the question at the end.", fr: "Voici Pixel. C'est mon chat. Il est noir et blanc. Il aime dormir. Tu as un chat ?" }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "In which pair do you link the words with a z sound?"
                say: { en: "In which pair do you link the words with a z sound?" }
                options: ["les enfants", "les chiens", "les pommes"]
                answer: "les enfants"
                hints:
                  - "A liaison needs a vowel at the start of the second word."
                  - "Which word starts with a vowel?"
                  - "Enfants starts with e: les enfants, lé-z-enfants."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which words do you hear?"
                say: { en: "Listen. Which words do you hear?" }
                audio: { fr: "Les amis." }
                options: ["les amis", "le ami", "les mis"]
                answer: "les amis"
                hints:
                  - "Listen for the z sound in the middle."
                  - "The s of les links to amis."
                  - "Les amis."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the word after which you pause."
                say: { en: "Read the sentences. After which word do you make a pause? Tap it." }
                show: { drawn: letter-card, text: "Je m'appelle Hugo. J'ai dix ans." }
                spans: ["Hugo."]
                hints:
                  - "Where does the first sentence end?"
                  - "At a full stop you pause."
                  - "After Hugo."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Tu as un chien ?\n\nHow does your voice go at the end?"
                say: { en: "You read this aloud. How does your voice go at the end?" }
                options: ["up", "down", "it stays the same"]
                answer: "up"
                keep_order: true
                feedback:
                  "down": "The question mark shows it is a question. In a question your voice goes up."
                hints:
                  - "Look at the mark at the end."
                  - "It is a question mark."
                  - "In a question your voice goes up."
              - id: l2-f5
                type: speak
                say: { en: "Read the question aloud. Let your voice go up at the end.", fr: "Tu as un chat ?" }
                show: { drawn: letter-card, text: "Tu as un chat ?" }
                expected_text: "Tu as un chat ?"
                hints:
                  - "Listen again and read with me."
                  - "Your voice goes up on chat."
                  - "Read it with me: tu as un chat ?"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "In which pair do you link the words with a z sound?"
                say: { en: "Look at these pairs. In which pair do you hear a z sound between the words?" }
                options: ["les chats", "les oiseaux", "les vélos"]
                answer: "les oiseaux"
                hints: ["Which second word starts with a vowel?"]
              - id: l2-s2
                type: audio_choice
                text: "Which words do you hear?"
                say: { en: "Listen. Which words do you hear?" }
                audio: { fr: "Les enfants." }
                options: ["les enfants", "le enfant", "les fans"]
                answer: "les enfants"
                hints: ["Listen for the z sound."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the word after which you pause."
                say: { en: "Read the sentence. After which word do you make a short pause? Tap it." }
                show: { drawn: letter-card, text: "Le matin, je mange une tartine." }
                spans: ["matin,"]
                hints: ["A comma means a short pause."]
              - id: l2-s4
                type: true_false
                text: "Il fait beau.\n\nYour voice goes up at the end."
                say: { en: "You read this sentence aloud. Is this true?" }
                answer: false
                hints: ["Is it a question or a statement?"]
              - id: l2-s5
                type: speak
                say: { en: "Read the sentences aloud. Pause at the full stop.", fr: "Voici Pixel. C'est mon chat." }
                show: { drawn: letter-card, text: "Voici Pixel. C'est mon chat." }
                expected_text: "Voici Pixel. C'est mon chat."
                hints: ["Pause after Pixel."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                option_audio: false
                text: "Which pair has a liaison?"
                say: { en: "Which pair has a liaison, a link between the words?" }
                options: ["les arbres", "les tables", "les livres"]
                answer: "les arbres"
              - id: l2-n2
                type: highlight_in_text
                text: "Tap the word after which you pause."
                say: { en: "Read the sentences. After which word do you make a pause? Tap it." }
                show: { drawn: letter-card, text: "Il pleut. On reste à la maison." }
                spans: ["pleut."]
              - id: l2-n3
                type: multiple_choice
                option_audio: false
                text: "Which sentence do you read with your voice going up at the end?"
                say: { en: "Which sentence do you read with your voice going up at the end?" }
                options: ["Tu aimes le foot ?", "J'aime le foot.", "Le foot, c'est super !"]
                answer: "Tu aimes le foot ?"
              - id: l2-n4
                type: speak
                say: { en: "Read the short text aloud: silent letters, pauses, and a question at the end." }
                show: { drawn: letter-card, text: "Voici Pixel. C'est mon chat. Il est noir et blanc. Il aime dormir. Tu as un chat ?" }
                expected_text: "Voici Pixel. C'est mon chat. Il est noir et blanc. Il aime dormir. Tu as un chat ?"
              - id: l2-n5
                type: audio_choice
                text: "Is it a question or a statement?"
                say: { en: "Listen. Is it a question or a statement?" }
                audio: { fr: "Tu as faim ?" }
                options: ["a question", "a statement"]
                answer: "a question"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: silent
            type: highlight_in_text
            text: "Tap the letter you do not say."
            say: { en: "The word lait is split into letters. Listen, then tap the letter you do not say.", fr: "Le lait." }
            show: { drawn: letter-card, text: "l a i t" }
            spans: ["t"]
          - id: l2-c2
            part: silent
            type: multiple_choice
            option_audio: false
            text: "Elles parlent.\n\nWhich letters at the end of parlent do you not say?"
            say: { en: "Read the sentence. Which letters at the end of parlent do you not say?" }
            options: ["the -ent", "only the t", "none, you say them all"]
            answer: "the -ent"
          - id: l2-c3
            part: liaison
            type: multiple_choice
            option_audio: false
            text: "In which pair do you link the words with a z sound?"
            say: { en: "Which of these pairs has a z sound between the words?" }
            options: ["les écoles", "les maisons", "les jardins"]
            answer: "les écoles"
          - id: l2-c4
            part: pause
            type: highlight_in_text
            text: "Tap the word after which you pause."
            say: { en: "Read the sentence. After which word do you make a short pause? Tap it." }
            show: { drawn: letter-card, text: "Le soir, je lis un livre." }
            spans: ["soir,"]
          - id: l2-c5
            part: intonation
            type: multiple_choice
            option_audio: false
            text: "Tu viens au parc ? Oui, je viens.\n\nIn which sentence does your voice go up at the end?"
            say: { en: "You read these two sentences aloud. In which one does your voice go up at the end?" }
            options: ["Tu viens au parc ?", "Oui, je viens."]
            answer: "Tu viens au parc ?"
            keep_order: true
          - id: l2-c6
            part: silent
            type: highlight_in_text
            text: "Tap the letter you do not say."
            say: { en: "The word chaud is split into letters. Listen, then tap the letter you do not say.", fr: "Chaud." }
            show: { drawn: letter-card, text: "c h a u d" }
            spans: ["d"]
          - id: l2-c7
            part: silent
            type: sorting
            text: "Do you say the last letter? Sort the words."
            say: { en: "Do you say the last letter, or is it silent? Sort the words." }
            option_audio: false
            bins:
              - { id: say, show: { text: "I say the last letter." } }
              - { id: silent, show: { text: "The last letter is silent." } }
            options:
              - { text: "petit", bin: silent }
              - { text: "sac", bin: say }
              - { text: "souris", bin: silent }
              - { text: "neuf", bin: say }
          - id: l2-c8
            part: nasal
            type: audio_choice
            text: "Which word do you hear?"
            say: { en: "Listen. Which word do you hear?" }
            audio: { fr: "Blanc." }
            options: ["bleu", "blanc", "balle"]
            answer: "blanc"
          - id: l2-c9
            part: nasal
            type: multiple_choice
            option_audio: false
            text: "In which pair do both words have a nasal sound?"
            say: { en: "In which pair do both words have a nasal sound, a sound through your nose?" }
            options: ["maman, jardin", "maman, table", "vélo, jardin"]
            answer: "maman, jardin"
          - id: l2-c10
            part: nasal
            type: true_false
            text: "In lion, you say the n clearly, as in English."
            say: { en: "In lion, you say the n clearly, as in English. Is this true?" }
            answer: false
          - id: l2-c11
            part: nasal
            type: highlight_in_text
            text: "Tap every word with a nasal sound."
            say: { en: "Read the sentence. Tap every word with a nasal sound." }
            show: { drawn: letter-card, text: "Mon chat est blanc." }
            spans: ["Mon", "blanc"]
          - id: l2-c12
            part: liaison
            type: true_false
            text: "Do you hear a z sound between les and avions?"
            say: { en: "Listen. Do you hear a z sound between les and avions?" }
            audio: { fr: "Les avions." }
            answer: true
          - id: l2-c13
            part: liaison
            type: true_false
            text: "les vélos\n\nYou link les and vélos with a z sound."
            say: { en: "You link les and vélos with a z sound. Is this true?" }
            answer: false
          - id: l2-c14
            part: liaison
            type: sorting
            text: "Liaison or no liaison? Sort the pairs."
            say: { en: "Do you link the words with a z sound? Sort the pairs." }
            option_audio: false
            bins:
              - { id: link, show: { text: "z sound" } }
              - { id: none, show: { text: "no link" } }
            options:
              - { text: "les ananas", bin: link }
              - { text: "les bananes", bin: none }
