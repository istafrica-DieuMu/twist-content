# Lesson set: French, learning year 4 (Year 6). Hand-authored draft.
id: en-GB.fl.fr-dictionary
skill: fl.culture-strategies.dictionary
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Mit dem Wörterbuch arbeiten (Französisch)
  en: Using a French dictionary
summary: >
  Using a bilingual French and English dictionary to find the meaning of a
  new word. Lesson 1 finds the right half (French to English or English to
  French), puts words in alphabetical order by the first and second letter,
  and uses the guide words at the top of a page. Lesson 2 reads an entry:
  the word class (n, v, adj), the gender (m or f) and the meaning; picks the
  meaning that fits the sentence when there are several; and looks up the
  base form (manger for je mange, chat for chats). It ends with the skill
  check. Dictionary entries are shown as short text; no real dictionary is
  quoted.
metadata:
  year: ly-4
  topic: { de: Lernstrategien, en: Learning strategies }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.culture-strategies.learn-words, fl.reading.sentences]
  also_practises: [fl.culture-strategies.learn-words, fl.culture-strategies.guess-meaning]
  vocabulary: { fr: [le dictionnaire, nm, nf, v, adj, manger, jouer, la glace, le chat, la chaise, le chien] }
  forms: [text]
  drawn: []
  facets: []
  parts:
    - { id: half, what: { de: die richtige Hälfte des Wörterbuchs wählen, en: choosing the right half of the dictionary } }
    - { id: find, what: { de: "ein Wort finden: Alphabet und Leitwörter", en: "finding a word: alphabetical order and guide words" } }
    - { id: entry, what: { de: "einen Eintrag lesen: Wortart und Genus", en: "reading an entry: word class and gender" } }
    - { id: meaning, what: { de: "die Bedeutung wählen, die zum Satz passt", en: choosing the meaning that fits the sentence } }
    - { id: base-form, what: { de: "die Grundform nachschlagen: Infinitiv und Singular", en: "looking up the base form: infinitive and singular" } }
  misconceptions:
    - id: wrong-half
      what: Looks up a French word in the English to French half
      addressed: lesson 1 Learn shows the two halves; l1-f1, l1-s1 and l2-c1 ask which half to use, with feedback in l1-f1
    - id: first-letter-only
      what: Sorts or searches by the first letter only and gets lost among the words with the same first letter
      addressed: lesson 1 Learn sorts by the second letter and uses guide words; l1-f2, l1-f4, l1-s2, l1-s4, l1-n2 and l2-c2 ask, with feedback in l1-f4
    - id: first-meaning
      what: Takes the first meaning in an entry even when it does not fit the sentence
      addressed: lesson 2 Learn reads the whole entry and checks the sentence; l2-f3, l2-s3, l2-n3 and l2-c4 offer the first meaning as the wrong answer, with feedback in l2-f3
    - id: look-up-as-written
      what: Looks up a verb or plural exactly as written (mange, chats) and does not find it
      addressed: lesson 2 Learn says to look up the infinitive and the singular; l2-f4, l2-s4, l2-n4 and l2-c5 ask for the base form
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das richtige Wort finden, en: Finding the word }
    goal:
      de: "Wähl die richtige Hälfte des Wörterbuchs und finde ein Wort mit Hilfe des Alphabets, zum Beispiel chat."
      en: "Pick the right half of the dictionary and use the alphabet to find a word, like chat."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            option_audio: false
            text: "Put the words in alphabetical order."
            say: { en: "Put the French words in alphabetical order." }
            options: ["lapin", "fleur", "arbre"]
            slot_count: 3
            answer: ["arbre", "fleur", "lapin"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "La banane\n\nUnder which letter do you look?"
            say: { en: "You want to find la banane in a word list. Under which letter do you look?" }
            options: ["b", "l"]
            answer: "b"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "fourmi\n\nYou do not know this French word. Where in a French and English dictionary do you think you look?"
            say: { en: "You read the French word fourmi and you do not know what it means. Where in a French and English dictionary do you think you look? Have a guess." }
          - text: "French → English\nEnglish → French"
            say: { en: "Fourmi is French, so you look in the French to English half. It means ant! A bilingual dictionary has two halves. In the French to English half, you look up a French word and find what it means in English. In the English to French half, you look up an English word and find the French." }
          - text: "banane, bébé, bus"
            say: { en: "The words are in alphabetical order. When the first letter is the same, look at the second letter: ba, bé, bu. Then the third, and so on." }
          - text: "chaise ... chien\n\nchat is on this page."
            say: { en: "At the top of each page are two guide words: the first and the last word on the page. Chat comes after chaise and before chien, so chat is on this page." }
          - text: "Did you know? The forty people who write the dictionary of the Académie française are called les immortels: the immortals."
            say: { en: "Did you know? The Académie française in Paris was started in sixteen thirty-five. Its forty members look after the French language and write a big dictionary of French. They are nicknamed les immortels, the immortals!" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "You read the French word grenouille. Which half of the dictionary do you use?"
                say: { en: "You read the French word grenouille and want to know what it means. Which half of the dictionary do you use?" }
                options: ["French to English", "English to French"]
                answer: "French to English"
                keep_order: true
                feedback:
                  "English to French": "That half starts from English words. Grenouille is French, so start in the French to English half."
                hints:
                  - "Is the word you have French or English?"
                  - "Grenouille is French. You want the English."
                  - "French to English."
                difficulty: easy
              - id: l1-f2
                type: ordering
                option_audio: false
                text: "Put the words in alphabetical order."
                say: { en: "These words all start with b. Look at the second letter and put them in order." }
                options: ["bus", "banane", "bébé"]
                slot_count: 3
                answer: ["banane", "bébé", "bus"]
                hints:
                  - "All start with b. Look at the second letter."
                  - "a comes before e, and e before u."
                  - "Banane, bébé, bus."
              - id: l1-f3
                type: multiple_choice
                option_audio: false
                text: "You want to know the French for rabbit. Which half do you use?"
                say: { en: "You want to know the French word for rabbit. Which half do you use?" }
                options: ["English to French", "French to English"]
                answer: "English to French"
                keep_order: true
                hints:
                  - "Which word do you already have, French or English?"
                  - "You have the English word rabbit."
                  - "English to French."
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "Guide words: chaise ... chien\n\nWhich word is on this page?"
                say: { en: "The guide words at the top of the page are chaise and chien. Which word is on this page?" }
                options: ["chat", "chocolat", "cerise"]
                answer: "chat"
                feedback:
                  "chocolat": "Cho comes after chi, so chocolat is after chien. It is on a later page."
                  "cerise": "Ce comes before ch, so cerise is on an earlier page."
                hints:
                  - "The word must come after chaise and before chien."
                  - "Look at the third and fourth letters: chai, chat, chie."
                  - "Chat."
              - id: l1-f5
                type: true_false
                text: "In a dictionary, pomme comes before poisson."
                say: { en: "Is this true?" }
                answer: false
                hints:
                  - "Both start with po. Look at the third letter."
                  - "Poisson has i, pomme has m."
                  - "No: i comes before m, so poisson comes first."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                option_audio: false
                text: "Your penfriend writes papillon. Which half do you use?"
                say: { en: "Your French penfriend writes the word papillon. Which half of the dictionary do you use?" }
                options: ["French to English", "English to French"]
                answer: "French to English"
                keep_order: true
                hints: ["Papillon is a French word."]
              - id: l1-s2
                type: ordering
                option_audio: false
                text: "Put the words in alphabetical order."
                say: { en: "These words all start with m. Put them in order." }
                options: ["mur", "maison", "mer"]
                slot_count: 3
                answer: ["maison", "mer", "mur"]
                hints: ["Look at the second letter."]
              - id: l1-s3
                type: true_false
                text: "Guide words help you find the right page quickly."
                say: { en: "Is this true?" }
                answer: true
                hints: ["They show the first and last word on the page."]
              - id: l1-s4
                type: multiple_choice
                option_audio: false
                text: "Guide words: lait ... lune\n\nWhich word is on this page?"
                say: { en: "The guide words are lait and lune. Which word is on this page?" }
                options: ["livre", "lac", "maman"]
                answer: "livre"
                hints: ["It must come after lait and before lune."]
              - id: l1-s5
                type: multiple_choice
                option_audio: false
                text: "Le chien\n\nWhat do you look up?"
                say: { en: "You want to find le chien in the dictionary. What do you look up?" }
                options: ["chien", "le", "chiens"]
                answer: "chien"
                hints: ["Look up the noun without le."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                option_audio: false
                text: "You want to write the French for window. Which half do you use?"
                say: { en: "You want to write the French word for window. Which half do you use?" }
                options: ["English to French", "French to English"]
                answer: "English to French"
                keep_order: true
              - id: l1-n2
                type: ordering
                option_audio: false
                text: "Put the words in alphabetical order."
                say: { en: "Put these words in alphabetical order." }
                options: ["table", "tigre", "tasse"]
                slot_count: 3
                answer: ["table", "tasse", "tigre"]
              - id: l1-n3
                type: multiple_choice
                option_audio: false
                text: "Guide words: fée ... fleur\n\nWhich word is on this page?"
                say: { en: "The guide words are fée and fleur. Which word is on this page?" }
                options: ["fille", "forêt", "facteur"]
                answer: "fille"
              - id: l1-n4
                type: true_false
                text: "In a dictionary, gâteau comes before girafe."
                say: { en: "Is this true?" }
                answer: true
              - id: l1-n5
                type: multiple_choice
                option_audio: false
                text: "L'oiseau\n\nUnder which letter do you look?"
                say: { en: "You want to find l'oiseau. Under which letter do you look?" }
                options: ["o", "l"]
                answer: "o"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            option_audio: false
            text: "You read the French word étoile. Which half do you use?"
            say: { en: "You read the French word étoile. Which half do you use?" }
            options: ["French to English", "English to French"]
            answer: "French to English"
            keep_order: true
          - id: l1-c2
            type: ordering
            option_audio: false
            text: "Put the words in alphabetical order."
            say: { en: "Put these words in alphabetical order." }
            options: ["porte", "pain", "piscine"]
            slot_count: 3
            answer: ["pain", "piscine", "porte"]
          - id: l1-c3
            type: multiple_choice
            option_audio: false
            text: "Guide words: rat ... robe\n\nWhich word is on this page?"
            say: { en: "The guide words are rat and robe. Which word is on this page?" }
            options: ["rideau", "rose", "radio"]
            answer: "rideau"
          - id: l1-c4
            type: true_false
            text: "In a dictionary, lapin comes before lait."
            say: { en: "In a dictionary, lapin comes before lait. Is this true?" }
            answer: false
          - id: l1-c5
            type: multiple_choice
            option_audio: false
            text: "Which word comes first in the dictionary?"
            say: { en: "Which word comes first in the dictionary?" }
            options: ["souris", "soleil", "sac"]
            answer: "sac"
          - id: l1-c6
            type: multiple_choice
            option_audio: false
            text: "Le hérisson dort.\n\nYou want to know what hérisson means. Where do you look?"
            say: { en: "You read le hérisson dort and want to know what hérisson means. Where do you look?" }
            options: ["French to English, under h", "English to French, under h", "French to English, under l"]
            answer: "French to English, under h"

  - n: 2
    title: { de: Einen Eintrag lesen, en: Reading an entry }
    goal:
      de: "Lies einen Eintrag im Wörterbuch und wähl die Bedeutung, die passt, so wie Eis für glace."
      en: "Read a dictionary entry and choose the meaning that fits, like ice cream for glace."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            option_audio: false
            text: "You read the French word nuage. Which half do you use?"
            say: { en: "You read the French word nuage. Which half do you use?" }
            options: ["French to English", "English to French"]
            answer: "French to English"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: ordering
            option_audio: false
            text: "Put the words in alphabetical order."
            say: { en: "Put these words in alphabetical order." }
            options: ["sol", "sac", "sel"]
            slot_count: 3
            answer: ["sac", "sel", "sol"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "chaise  nf  chair\n\nWhat do you think the letters nf stand for?"
            say: { en: "Here is an entry from a dictionary: chaise, nf, chair. What do you think the little letters nf stand for? Have a guess." }
          - text: "chat  nm  cat\nchaise  nf  chair\nmanger  v  to eat\npetit  adj  small"
            say: { en: "Each entry gives you the word, then short labels, then the meaning. N is a noun, v is a verb, adj is an adjective. For nouns, m means masculine and f means feminine. So chat is a masculine noun: un chat." }
          - text: "glace  nf  1. ice  2. ice cream  3. mirror\n\nJ'aime la glace au chocolat."
            say: { en: "Some words have more than one meaning. Read them all, then check which one fits your sentence. You do not eat a mirror or plain ice, so here la glace means ice cream." }
          - text: "je mange → manger\nles chats → chat"
            say: { en: "Verbs are listed in their base form, the infinitive, often ending in -er. For je mange, look up manger. Nouns are listed in the singular: for chats, look up chat." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "maison  nf  house\n\nIs maison masculine or feminine?"
                say: { en: "Read the entry. Is maison masculine or feminine?" }
                options: ["feminine", "masculine"]
                answer: "feminine"
                keep_order: true
                hints:
                  - "Look at the label after the word."
                  - "Nf means a feminine noun."
                  - "Feminine: une maison."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                option_audio: false
                text: "courir  v  to run\n\nWhat kind of word is courir?"
                say: { en: "Read the entry. What kind of word is courir?" }
                options: ["a verb", "a noun", "an adjective"]
                answer: "a verb"
                hints:
                  - "Look at the label after the word."
                  - "V stands for verb."
                  - "Courir is a verb."
              - id: l2-f3
                type: multiple_choice
                option_audio: false
                text: "glace  nf  1. ice  2. ice cream  3. mirror\n\nJe me regarde dans la glace.\n\nWhat does glace mean here?"
                say: { en: "Read the entry and the sentence. Je me regarde dans la glace means I look at myself in the ... What does glace mean here?" }
                options: ["mirror", "ice", "ice cream"]
                answer: "mirror"
                feedback:
                  "ice": "Ice is the first meaning, but it does not fit. You look at yourself in a mirror."
                hints:
                  - "Read all three meanings."
                  - "You look at yourself in it."
                  - "Here glace means mirror."
              - id: l2-f4
                type: fill_in_blank
                option_audio: false
                text: "Elle joue au tennis.\n\nWhich word do you look up for joue?"
                say: { en: "You do not know joue in elle joue au tennis. Which word do you look up?" }
                frame: "For joue, I look up _."
                options: ["jouer", "joue", "elle"]
                answer: ["jouer"]
                hints:
                  - "Joue is a verb."
                  - "Verbs are listed in the infinitive, often ending in -er."
                  - "Look up jouer."
              - id: l2-f5
                type: multiple_choice
                option_audio: false
                text: "vert  adj  green\n\nWhich sentence uses vert?"
                say: { en: "Read the entry. Vert is an adjective. Which sentence uses it?" }
                options: ["J'ai un sac vert.", "Je vert au parc.", "Le vert mange."]
                answer: "J'ai un sac vert."
                hints:
                  - "An adjective describes a noun."
                  - "Vert describes something green."
                  - "J'ai un sac vert: I have a green bag."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "livre  nm  book\n\nHow do you say a book?"
                say: { en: "Read the entry. How do you say a book in French?" }
                options: ["un livre", "une livre", "la livre"]
                answer: "un livre"
                hints: ["Nm means masculine."]
              - id: l2-s2
                type: true_false
                text: "heureux  adj  happy\n\nHeureux is a verb."
                say: { en: "Read the entry. Heureux is a verb. Is this true?" }
                answer: false
                hints: ["Adj stands for adjective."]
              - id: l2-s3
                type: multiple_choice
                option_audio: false
                text: "feuille  nf  1. leaf  2. sheet of paper\n\nÉcris ton nom sur la feuille.\n\nWhat does feuille mean here?"
                say: { en: "Read the entry and the sentence. Écris ton nom sur la feuille means write your name on the ... What does feuille mean here?" }
                options: ["sheet of paper", "leaf"]
                answer: "sheet of paper"
                hints: ["Where do you write your name?"]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Les oiseaux chantent.\n\nWhich word do you look up for chantent?"
                say: { en: "You do not know chantent. Which word do you look up?" }
                options: ["chanter", "chantent", "chante"]
                answer: "chanter"
                hints: ["Look up the infinitive."]
              - id: l2-s5
                type: true_false
                text: "nf means a feminine noun."
                say: { en: "Is this true?" }
                answer: true
                hints: ["N is noun, f is feminine."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                option_audio: false
                text: "jardin  nm  garden\n\nHow do you say the garden?"
                say: { en: "Read the entry. How do you say the garden in French?" }
                frame: "_ jardin"
                options: ["le", "la"]
                answer: ["le"]
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "nager  v  to swim\n\nWhat does nager mean?"
                say: { en: "Read the entry. What does nager mean?" }
                options: ["to swim", "a swimmer", "wet"]
                answer: "to swim"
              - id: l2-n3
                type: multiple_choice
                option_audio: false
                text: "carte  nf  1. card  2. map  3. menu\n\nOn regarde la carte pour trouver le chemin.\n\nWhat does carte mean here?"
                say: { en: "Read the entry and the sentence. On regarde la carte pour trouver le chemin means we look at the ... to find the way. What does carte mean here?" }
                options: ["map", "card", "menu"]
                answer: "map"
              - id: l2-n4
                type: multiple_choice
                option_audio: false
                text: "J'ai trois chevaux.\n\nWhich word do you look up for chevaux?"
                say: { en: "Chevaux is the plural of a noun. Which word do you look up?" }
                options: ["cheval", "chevaux", "chevauxs"]
                answer: "cheval"
                difficulty: stretch
              - id: l2-n5
                type: true_false
                text: "adj means a verb."
                say: { en: "Is this true?" }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: half
            type: multiple_choice
            option_audio: false
            text: "You want to know the French for apple. Which half do you use?"
            say: { en: "You want to know the French word for apple. Which half do you use?" }
            options: ["English to French", "French to English"]
            answer: "English to French"
            keep_order: true
          - id: l2-c2
            part: find
            type: multiple_choice
            option_audio: false
            text: "Guide words: bain ... bleu\n\nWhich word is on this page?"
            say: { en: "The guide words are bain and bleu. Which word is on this page?" }
            options: ["bébé", "bus", "arbre"]
            answer: "bébé"
          - id: l2-c3
            part: entry
            type: multiple_choice
            option_audio: false
            text: "fenêtre  nf  window\n\nHow do you say a window?"
            say: { en: "Read the entry. How do you say a window in French?" }
            options: ["une fenêtre", "un fenêtre"]
            answer: "une fenêtre"
            keep_order: true
          - id: l2-c4
            part: meaning
            type: multiple_choice
            option_audio: false
            text: "pièce  nf  1. room  2. coin  3. play (at the theatre)\n\nJ'ai une pièce de deux euros.\n\nWhat does pièce mean here?"
            say: { en: "Read the entry and the sentence. J'ai une pièce de deux euros means I have a two euro ... What does pièce mean here?" }
            options: ["coin", "room", "play"]
            answer: "coin"
          - id: l2-c5
            part: base-form
            type: multiple_choice
            option_audio: false
            text: "Nous regardons la télé.\n\nWhich word do you look up for regardons?"
            say: { en: "You do not know regardons. Which word do you look up?" }
            options: ["regarder", "regardons", "nous"]
            answer: "regarder"
          - id: l2-c6
            part: half
            type: sorting
            text: "Which half of the dictionary do you use? Sort the cards."
            say: { en: "Which half of the dictionary do you use? Sort the cards." }
            option_audio: false
            bins:
              - { id: fe, show: { text: "French to English" } }
              - { id: ef, show: { text: "English to French" } }
            options:
              - { text: "You want to know what fromage means.", bin: fe }
              - { text: "You want to write horse in French.", bin: ef }
              - { text: "Your penfriend writes the word plage.", bin: fe }
              - { text: "You need the French word for spoon.", bin: ef }
          - id: l2-c7
            part: half
            type: true_false
            text: "To find the French word for kitchen, you look in the French to English half."
            say: { en: "To find the French word for kitchen, you look in the French to English half. Is this true?" }
            answer: false
          - id: l2-c8
            part: half
            type: multiple_choice
            option_audio: false
            text: "Ali looks up the word window in the French to English half. He cannot find it. Why not?"
            say: { en: "Ali looks up the word window in the French to English half. He cannot find it. Why not?" }
            options: ["Window is English, so it is in the English to French half.", "His dictionary is too small.", "Window has no word in French."]
            answer: "Window is English, so it is in the English to French half."
          - id: l2-c9
            part: find
            type: ordering
            option_audio: false
            text: "Put the words in dictionary order."
