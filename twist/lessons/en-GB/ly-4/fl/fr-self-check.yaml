# Lesson set: French, learning year 4 (Year 6). Hand-authored draft.
id: en-GB.fl.fr-self-check
skill: fl.culture-strategies.self-check
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Mich selbst einschätzen (Französisch)
  en: Checking what I can do in French
summary: >
  Judging honestly what you can already do in French and setting a next
  goal. Lesson 1 brings Je sais ... (I can) and J'apprends encore ... (I'm
  still learning), and the rule that you can do something when it works
  without help, several times; short self-tests (a colour, a number, a day)
  stand for checking yourself. Lesson 2 chooses a next goal that is one step
  on (not too easy, not too hard), picks a way to practise from the
  word-learning tips, and checks again after a few days; it ends with the
  skill check. Instructions are in English; the je sais sentences are read
  and spoken in French.
metadata:
  year: ly-4
  topic: { de: Lernstrategien, en: Learning strategies }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.culture-strategies.learn-words]
  also_practises: [fl.culture-strategies.learn-words, fl.themes.colours, fl.themes.numbers-to-20]
  vocabulary: { fr: ["Je sais ...", "J'apprends encore ...", "Mon prochain objectif : ...", compter, dire, lire, les couleurs, les nombres, les jours de la semaine, les mois] }
  forms: [text, audio, drawn]
  drawn: [colour-swatch]
  facets: []
  misconceptions:
    - id: once-is-enough
      what: Counts a skill as done after one success, or after doing it with help
      addressed: lesson 1 Learn sets the rule (without help, several times); l1-f4 (with feedback), l1-f5, l1-n3, l1-c3 and l2-c3 ask about help and one try
    - id: cannot-is-failure
      what: Will not say "J'apprends encore", or says "I can't learn French" instead
      addressed: lesson 1 Learn says it is no mistake to name what you are still practising; l1-s3, l2-n4 and l2-c4 offer J'apprends encore as the honest answer and a give-up sentence as a wrong one
    - id: goal-size
      what: Picks a goal that is already done or far too big
      addressed: lesson 2 Learn shows a goal that is too easy and one that is too hard; l2-f1 (with feedback), l2-s1, l2-n1 and l2-c1 offer both
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Je sais ... oder J'apprends encore ...", en: "Je sais ... or J'apprends encore ..." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which tip helps you learn new words?"
            say: { en: "Which tip helps you learn new French words?" }
            options: ["I make picture cards.", "I look at the word just once.", "I learn everything in one day."]
            answer: "I make picture cards."
            difficulty: easy
          - id: l1-w2
            type: ordering
            option_audio: false
            text: "Put the words in alphabetical order."
            say: { en: "Put the French words in alphabetical order." }
            options: ["chat", "pomme", "arbre"]
            slot_count: 3
            answer: ["arbre", "chat", "pomme"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Je sais compter jusqu'à 20."
            say: { en: "With je sais you say in French what you can already do. Je sais compter jusqu'à vingt means I can count to twenty.", fr: "Je sais compter jusqu'à vingt." }
          - text: "Can I really do it?"
            say: { en: "But can you really do it? Try it without help. If it works several times in a row, you can do it. If it only works with help, you are still practising." }
          - text: "Je sais dire les couleurs.\nJ'apprends encore les nombres."
            say: { en: "Say honestly what you can do and what you are still learning. J'apprends encore means I'm still learning. That is not a mistake. It tells you what to learn next.", fr: "Je sais dire les couleurs. J'apprends encore les nombres." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: matching
                option_audio: false
                text: "Match each French sentence to its meaning."
                say: { en: "Match each French sentence to its meaning in English." }
                pairs:
                  - { left: { text: "Je sais compter jusqu'à 20." }, right: { text: "I can count to 20." } }
                  - { left: { text: "Je sais dire les couleurs." }, right: { text: "I can say the colours." } }
                  - { left: { text: "Je sais chanter une chanson." }, right: { text: "I can sing a song." } }
                hints:
                  - "All the sentences start with je sais. Look at the end."
                  - "Compter is to count. Les couleurs are the colours."
                  - "Chanter une chanson is to sing a song."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { en: "Check yourself. Do you know the colours? Listen and tap the colour." }
                audio: { fr: "Violet." }
                options:
                  - { drawn: colour-swatch, colour: purple }
                  - { drawn: colour-swatch, colour: pink }
                  - { drawn: colour-swatch, colour: blue }
                answer: purple
                hints:
                  - "Listen again carefully."
                  - "Violet sounds like the English word violet, a flower colour."
                  - "Violet is purple."
              - id: l1-f3
                type: multiple_choice
                option_audio: false
                text: "Mia names ten colours in French with no help. What can she say?"
                say: { en: "Mia names ten colours in French with no help. What can she say?" }
                options: ["Je sais dire les couleurs.", "Je sais compter jusqu'à 20.", "J'apprends encore les couleurs."]
                answer: "Je sais dire les couleurs."
                hints:
                  - "What is it about?"
                  - "Mia knows the colours, and she needs no help."
                  - "She says: je sais dire les couleurs."
              - id: l1-f4
                type: multiple_choice
                text: "How do you know you can really do something?"
                say: { en: "How do you know you can really do something?" }
                options: ["It works without help, several times.", "I heard it once.", "Someone told me the answer."]
                answer: "It works without help, several times."
                feedback:
                  "I heard it once.": "Hearing it once is usually not enough. Try it without help, several times."
                hints:
                  - "Is it enough if it works once, or with help?"
                  - "Two things count: without help, and several times."
                  - "If it works without help several times, you can do it."
              - id: l1-f5
                type: true_false
                text: "Tom counts to 20 in French. His mum helps him with 13 and 14. So Tom can really count to 20."
                say: { en: "Tom counts to twenty in French. His mum helps him with thirteen and fourteen. So Tom can really count to twenty. Is this true?" }
                answer: false
                hints:
                  - "Does Tom need help?"
                  - "Mum helps him with two numbers."
                  - "No, Tom is still practising."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { en: "Check yourself. Do you know the numbers? Listen and tap the number." }
                audio: { fr: "Dix-sept." }
                options: ["17", "7", "70"]
                answer: "17"
                hints: ["Dix is ten. Dix-sept is ten and seven."]
              - id: l1-s2
                type: fill_in_blank
                option_audio: false
                text: "Which word is missing?"
                say: { en: "You can count to ten. Which word is missing?" }
                frame: "Je _ compter jusqu'à dix."
                options: ["sais", "suis", "ai"]
                answer: ["sais"]
                hints: ["I can is je sais."]
              - id: l1-s3
                type: multiple_choice
                option_audio: false
                text: "Jonas mixes up the days of the week. What can he honestly say?"
                say: { en: "Jonas often mixes up the days of the week. What can he honestly say?" }
                options: ["J'apprends encore les jours.", "Je sais dire les jours.", "I can't learn French."]
                answer: "J'apprends encore les jours."
                hints: ["It is fine to say you are still learning."]
              - id: l1-s4
                type: audio_choice
                say: { en: "Check yourself. Do you know the days? Listen and tap the day." }
                audio: { fr: "Mercredi." }
                options: ["Wednesday", "Monday", "Friday"]
                answer: "Wednesday"
                hints: ["Mercredi is the middle of the school week."]
              - id: l1-s5
                type: speak
                say: { en: "Say in French what you can already do. For example:", fr: "Je sais dire les couleurs." }
                expected_text: "Je sais dire les couleurs."
                hints: ["Start with je sais."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { en: "Check yourself. Listen and tap the colour." }
                audio: { fr: "Marron." }
                options:
                  - { drawn: colour-swatch, colour: brown }
                  - { drawn: colour-swatch, colour: orange }
                  - { drawn: colour-swatch, colour: black }
                answer: brown
              - id: l1-n2
                type: matching
                option_audio: false
                text: "Match each French sentence to its meaning."
                say: { en: "Match each French sentence to its meaning in English." }
                pairs:
                  - { left: { text: "J'apprends encore les mois." }, right: { text: "I'm still learning the months." } }
                  - { left: { text: "Je sais dire les jours." }, right: { text: "I can say the days." } }
                  - { left: { text: "Je sais lire une histoire." }, right: { text: "I can read a story." } }
              - id: l1-n3
                type: true_false
                text: "Lena says the months in French five times, with no help and no mistakes. She can say the months."
                say: { en: "Lena says the months in French five times, with no help and no mistakes. She can say the months. Is this true?" }
                answer: true
              - id: l1-n4
                type: audio_choice
                say: { en: "Check yourself. Listen and tap the number." }
                audio: { fr: "Quatorze." }
                options: ["14", "4", "40"]
                answer: "14"
              - id: l1-n5
                type: speak
                say: { en: "Say in French something you are still learning. Use j'apprends encore." }
                expected_text: "J'apprends encore les nombres."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            option_audio: false
            text: "What does J'apprends encore mean?"
            say: { en: "What does j'apprends encore mean?" }
            options: ["I'm still learning", "I can", "I don't like"]
            answer: "I'm still learning"
          - id: l1-c2
            type: audio_choice
            say: { en: "Check yourself. Listen and tap the colour." }
            audio: { fr: "Jaune." }
            options:
              - { drawn: colour-swatch, colour: yellow }
              - { drawn: colour-swatch, colour: green }
              - { drawn: colour-swatch, colour: orange }
            answer: yellow
          - id: l1-c3
            type: true_false
            text: "Sam got the numbers right once, with help from his friend. He can say the numbers."
            say: { en: "Is this true?" }
            answer: false

  - n: 2
    title: { de: Mein nächstes Ziel, en: My next goal }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "How do you know you can do something?"
            say: { en: "How do you know you can do something?" }
            options: ["It works without help, several times.", "I saw it once.", "Someone tells me the answer."]
            answer: "It works without help, several times."
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "What does Je sais mean?"
            say: { en: "What does je sais mean here?" }
            options: ["I can", "I have", "I am"]
            answer: "I can"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mon prochain objectif : savoir compter jusqu'à 100."
            say: { en: "When you know what you can do, you choose a next goal. A good goal is the next step. Paul can count to twenty. His next goal: count to a hundred. Mon prochain objectif means my next goal.", fr: "Mon prochain objectif : savoir compter jusqu'à cent." }
          - text: "not too easy, not too hard"
            say: { en: "A good goal is not too easy and not too hard. Paul can already count to ten, so that is too easy. Reading a whole book in French is still too hard." }
          - text: "goal, practise, check"
            say: { en: "Then think how you will practise: with picture cards, a little every day, saying the words out loud. After a few days, check yourself without help. If it works, choose a new goal. If not yet, keep practising." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Aisha can say the colours in French. What is a good next goal?"
                say: { en: "Aisha can say the colours in French. What is a good next goal?" }
                options: ["Say clothes with colours, like un pull rouge", "Learn the colours red and blue", "Write a whole book in French"]
                answer: "Say clothes with colours, like un pull rouge"
                feedback:
                  "Learn the colours red and blue": "Aisha already knows the colours. That goal is too easy."
                  "Write a whole book in French": "That is still far too hard. A good goal is the next step."
                hints:
                  - "What can Aisha already do?"
                  - "A good goal is not too easy and not too hard."
                  - "The next step: colours and clothes together."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Ben can already count to 10. Counting to 10 is a good next goal for him."
                say: { en: "Ben can already count to ten in French. Counting to ten is a good next goal for him. Is this true?" }
                answer: false
                hints:
                  - "What can Ben already do?"
                  - "He can already count to ten."
                  - "No, that goal is too easy."
              - id: l2-f3
                type: multiple_choice
                text: "Mia wants to learn the animals in French. What is a good way to practise?"
                say: { en: "Mia wants to learn the animals in French. What is a good way to practise?" }
                options: ["She makes picture cards and practises a few animals every day.", "She reads the list once.", "She waits until she just knows them."]
                answer: "She makes picture cards and practises a few animals every day."
                hints:
                  - "Think of the tips for learning words."
                  - "Picture cards help, and a little every day."
                  - "Mia makes picture cards and practises every day."
              - id: l2-f4
                type: fill_in_blank
                option_audio: false
                text: "Which word is missing?"
                say: { en: "Emma writes down her next goal. Which word is missing?" }
                frame: "Mon prochain _ : savoir dire les mois."
                options: ["objectif", "objet", "oiseau"]
                answer: ["objectif"]
                hints:
                  - "You need the French word for goal."
                  - "It looks like the English word objective."
                  - "Mon prochain objectif."
              - id: l2-f5
                type: multiple_choice
                text: "When does Mia check whether she has reached her goal?"
                say: { en: "When does Mia check whether she has reached her goal?" }
                options: ["after a few days of practice, without help", "straight away, before she practises", "never"]
                answer: "after a few days of practice, without help"
                hints:
                  - "Practice comes first."
                  - "Then she checks herself without help."
                  - "After a few days of practice, without help."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Noah can count to 20 in French. What is a good next goal?"
                say: { en: "Noah can count to twenty in French. What is a good next goal?" }
                options: ["count to 50", "count to 5", "count to a million"]
                answer: "count to 50"
                hints: ["The next step, not too easy and not too hard."]
              - id: l2-s2
                type: true_false
                text: "Lily practises the months a little every day for a week. That is a good way to practise."
                say: { en: "Is this true?" }
                answer: true
                hints: ["A little every day helps."]
              - id: l2-s3
                type: ordering
                text: "Put the steps in order."
                say: { en: "Put the steps in the right order." }
                options: ["check myself", "practise", "choose a goal"]
                slot_count: 3
                answer: ["choose a goal", "practise", "check myself"]
                hints: ["First the goal, at the end the check."]
              - id: l2-s4
                type: multiple_choice
                text: "Your check worked, without help, several times. What do you do now?"
                say: { en: "Your check worked, without help, several times. What do you do now?" }
                options: ["choose a new goal", "stop learning French", "do the same goal again forever"]
                answer: "choose a new goal"
                hints: ["You reached the goal."]
              - id: l2-s5
                type: speak
                say: { en: "Say your next goal in French. For example:", fr: "Mon prochain objectif : savoir dire les mois." }
                expected_text: "Mon prochain objectif : savoir dire les mois."
                hints: ["Start with mon prochain objectif."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Chloé can say ten animals in French. What is a good next goal?"
                say: { en: "Chloé can say ten animals in French. What is a good next goal?" }
                options: ["Describe an animal: le chat est petit et noir.", "Learn the word chat.", "Give a talk about every animal in the world."]
                answer: "Describe an animal: le chat est petit et noir."
              - id: l2-n2
                type: ordering
                text: "Put the steps in order."
                say: { en: "Put Max's steps in the right order." }
                options: ["Max checks himself after a week.", "Max chooses to learn the days.", "Max practises with cards every day."]
                slot_count: 3
                answer: ["Max chooses to learn the days.", "Max practises with cards every day.", "Max checks himself after a week."]
              - id: l2-n3
                type: true_false
                text: "After a few days, Ella checks herself and it does not work yet. She should keep practising."
                say: { en: "Is this true?" }
                answer: true
              - id: l2-n4
                type: multiple_choice
                option_audio: false
                text: "Leo still gets the months wrong. What can he honestly say?"
                say: { en: "Leo still gets the months wrong. What can he honestly say?" }
                options: ["J'apprends encore les mois.", "Je sais dire les mois.", "I'm bad at French."]
                answer: "J'apprends encore les mois."
              - id: l2-n5
                type: fill_in_blank
                option_audio: false
                text: "Which word is missing?"
                say: { en: "Jade writes what she is still learning. Which word is missing?" }
                frame: "J'apprends _ les jours de la semaine."
                options: ["encore", "sais", "aime"]
                answer: ["encore"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Sam can say the days of the week in French. What is a good next goal?"
            say: { en: "Sam can say the days of the week in French. What is a good next goal?" }
            options: ["Say what he does each day: le lundi, je nage.", "Learn the word lundi.", "Speak French perfectly by tomorrow."]
            answer: "Say what he does each day: le lundi, je nage."
          - id: l2-c2
            type: audio_choice
            say: { en: "Check yourself. Listen and tap the number." }
            audio: { fr: "Douze." }
            options: ["12", "2", "20"]
            answer: "12"
          - id: l2-c3
            type: multiple_choice
            text: "Ava says the colours right once, with her teacher's help. What is true?"
            say: { en: "Ava says the colours right once, with her teacher's help. What is true?" }
            options: ["She is still practising.", "She can really say the colours.", "She will never learn them."]
            answer: "She is still practising."
          - id: l2-c4
            type: multiple_choice
            option_audio: false
            text: "Zoé finds the numbers over 20 hard. What can she honestly say?"
            say: { en: "Zoé finds the numbers over twenty hard. What can she honestly say?" }
            options: ["J'apprends encore les nombres.", "Je sais dire les nombres.", "I can't learn French."]
            answer: "J'apprends encore les nombres."
          - id: l2-c5
            type: matching
            option_audio: false
            text: "Match each French sentence to its meaning."
            say: { en: "Match each French sentence to what it means." }
            pairs:
              - { left: { text: "Mon prochain objectif" }, right: { text: "My next goal" } }
              - { left: { text: "J'apprends encore" }, right: { text: "I'm still learning" } }
              - { left: { text: "Je sais" }, right: { text: "I can" } }
