# Lesson set: French, learning year 4 (Year 6). Hand-authored draft.
id: en-GB.fl.fr-speak-about-me
skill: fl.speaking.about-me
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Über mich sprechen (Französisch)
  en: Talking about myself in French
summary: >
  Talking about oneself in French in a few connected sentences: name, age,
  where you live, family, pets, hobbies and what you like doing. Lesson 1
  listens to French children introducing themselves and says the first
  sentences about name, age (j'ai dix ans, never je suis dix) and family;
  lesson 2 adds hobbies and likes, joins sentences with et, mais and aussi,
  and ends with the skill check. Speaking tasks are practice only; the
  skill check asks for the building blocks of a short talk by listening,
  choosing and ordering.
metadata:
  year: ly-4
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.describe, fl.themes.hobbies]
  also_practises: [fl.themes.family, fl.themes.hobbies, fl.grammar.chunks, fl.listening.details]
  vocabulary: { fr: ["Je m'appelle ...", "J'ai ... ans", "J'habite à ...", "J'ai un frère / une sœur", "Mon sport préféré, c'est ...", "J'aime ...", et, mais, aussi, le frère, la sœur, mamie, papi] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: me, what: { de: "sich vorstellen: Name, Alter, Wohnort", en: "introducing yourself: name, age, where you live" } }
    - { id: family, what: { de: Familie und Haustiere nennen, en: naming your family and pets } }
    - { id: likes, what: { de: "sagen, was man gern macht und kann", en: saying what you like doing and can do } }
    - { id: join, what: { de: "Sätze mit et, mais und aussi verbinden", en: "joining sentences with et, mais and aussi" } }
  misconceptions:
    - id: list-not-talk
      what: Says single words (dix, chien, foot) instead of whole sentences
      addressed: lesson 1 Learn models every fact as a sentence; speak tasks give a whole sentence as the model; l1-s4 asks which answer is a whole sentence
    - id: suis-for-age
      what: Says je suis dix or je suis dix ans, from the English I'm ten
      addressed: lesson 1 Learn says French has the years, j'ai dix ans; l1-f2, l1-s2 and l2-c2 offer je suis, with feedback in l1-f2
    - id: same-start
      what: Starts every sentence with J'aime ... and never joins them
      addressed: lesson 2 Learn joins sentences with et, mais and aussi; l2-f3, l2-s3 and l2-c4 build joined sentences
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das bin ich, en: This is me }
    goal:
      de: "Sag in ganzen Sätzen, wie du heißt, wie alt du bist und wo du wohnst, zum Beispiel j'ai neuf ans."
      en: "Tell people your name, your age and where you live in whole sentences, like j'ai neuf ans."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "What can the child do?"
            say: { en: "Listen. What can the child do?" }
            audio: { fr: "Je sais nager.", speaker: female }
            options: [{ object: swim }, { object: dance }, { object: read }]
            answer: swim
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which animal is it?"
            say: { en: "Listen. Which animal is it?" }
            audio: { fr: "Il est petit et il a de grandes oreilles." }
            options: [{ object: rabbit }, { object: elephant }, { object: fish }]
            answer: rabbit
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "I am ten.\n\nDo French children say I am ten too?"
            say: { en: "In English you say: I am ten. What do you think French children say? I am ten, or something different? Have a guess." }
          - text: "J'ai dix ans.\nnot: Je suis dix."
            say: { en: "Something different! In French you say your age with j'ai: j'ai dix ans. In English you are ten, but in French you have ten years.", fr: "J'ai dix ans." }
          - text: "Salut ! Je m'appelle Camille.\nJ'ai neuf ans.\nJ'habite à Lille.\nJ'ai un petit frère. Il s'appelle Léo."
            say: { en: "Listen. This is how Camille talks about herself.", fr: "Salut ! Je m'appelle Camille. J'ai neuf ans. J'habite à Lille. J'ai un petit frère. Il s'appelle Léo." }
            show: { object: girl }
          - text: "Did you know? Word for word, je m'appelle means I call myself."
            say: { en: "Did you know? Word for word, je m'appelle means I call myself. So when Camille says je m'appelle Camille, she is really saying: I call myself Camille!", fr: "Je m'appelle Camille." }
          - text: "Salut ! Je m'appelle ...\nJ'ai ... ans.\nJ'habite à ...\nJ'ai ..."
            say: { en: "This is your plan. Each sentence says one thing about you. Speak in whole sentences, not single words." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Where does Hugo live?"
                say: { en: "Listen. Where does Hugo live?" }
                audio: { fr: "Bonjour, je m'appelle Hugo. J'ai dix ans. J'habite à Bordeaux avec ma maman et mon papa.", speaker: male }
                options: ["in Bordeaux", "in Paris", "in Lille"]
                answer: "in Bordeaux"
                hints:
                  - "Listen for j'habite à."
                  - "J'habite means I live."
                  - "J'habite à Bordeaux."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "How do you say: I'm ten years old?"
                say: { en: "How do you say in French: I'm ten years old?" }
                options: ["J'ai dix ans.", "Je suis dix ans.", "Mon dix ans."]
                answer: "J'ai dix ans."
                feedback:
                  "Je suis dix ans.": "In French you have your years: j'ai dix ans."
                hints:
                  - "Do you have your age or are you your age in French?"
                  - "French uses j'ai, I have, then the number and ans."
                  - "J'ai dix ans."
              - id: l1-f3
                type: speak
                say: { en: "Introduce yourself. Say your name. For example:", fr: "Salut ! Je m'appelle Camille." }
                show: { object: girl }
                expected_text: "Salut ! Je m'appelle Camille."
                hints:
                  - "Start with salut."
                  - "Then je m'appelle and your name."
                  - "Say it with me: salut, je m'appelle Camille."
              - id: l1-f4
                type: audio_choice
                text: "Who is in Manon's family?"
                say: { en: "Listen. Who is in Manon's family?" }
                audio: { fr: "Je m'appelle Manon. J'ai deux sœurs et un petit frère.", speaker: female }
                options: ["two sisters and a little brother", "two brothers and a sister", "one sister"]
                answer: "two sisters and a little brother"
                hints:
                  - "Listen after j'ai."
                  - "Sœurs are sisters. Un petit frère is a little brother."
                  - "Two sisters and a little brother."
              - id: l1-f5
                type: ordering
                option_audio: false
                text: "Put the sentences in a good order."
                say: { en: "Ben wants to introduce himself. What does he say first?" }
                options: ["J'habite à Nice.", "Salut ! Je m'appelle Ben.", "J'ai huit ans."]
                slot_count: 3
                answer: ["Salut ! Je m'appelle Ben.", "J'ai huit ans.", "J'habite à Nice."]
                hints:
                  - "First you say hello and your name."
                  - "Then your age."
                  - "Salut, je m'appelle Ben. J'ai huit ans. J'habite à Nice."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "How old is Inès?"
                say: { en: "Listen. How old is Inès?" }
                audio: { fr: "Bonjour ! Je m'appelle Inès et j'ai onze ans.", speaker: female }
                options: ["11", "10", "12"]
                answer: "11"
                hints: ["Listen for the number before ans."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "How do you say: I'm nine?"
                say: { en: "How do you say in French: I'm nine?" }
                options: ["Je suis neuf.", "J'ai neuf ans.", "Je neuf ans."]
                answer: "J'ai neuf ans."
                hints: ["Your age goes with j'ai and ans."]
              - id: l1-s3
                type: speak
                say: { en: "Say how old you are. For example:", fr: "J'ai neuf ans." }
                expected_text: "J'ai neuf ans."
                hints: ["Start with j'ai."]
              - id: l1-s4
                type: multiple_choice
                option_audio: false
                text: "Your teacher asks: Tu as des frères et sœurs ? Which answer is a whole sentence?"
                say: { en: "Your teacher asks if you have brothers and sisters. Which answer is a whole sentence?" }
                options: ["J'ai un frère.", "Un frère.", "Frère."]
                answer: "J'ai un frère."
                hints: ["A whole sentence has j'ai at the start."]
              - id: l1-s5
                type: speak
                say: { en: "Say where you live. For example:", fr: "J'habite à Londres." }
                expected_text: "J'habite à Londres."
                hints: ["J'habite à, then your town."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Where does Lucas live?"
                say: { en: "Listen. Where does Lucas live?" }
                audio: { fr: "Salut ! Je m'appelle Lucas. J'habite à Marseille, près de la mer.", speaker: male }
                options: ["in Marseille", "in Lyon", "in Nice"]
                answer: "in Marseille"
              - id: l1-n2
                type: audio_choice
                text: "Has Chloé got a brother?"
                say: { en: "Listen. Has Chloé got a brother?" }
                audio: { fr: "Je m'appelle Chloé. Je n'ai pas de frère, mais j'ai une sœur.", speaker: female }
                options: ["No, but she has a sister.", "Yes, one brother.", "Yes, two brothers."]
                answer: "No, but she has a sister."
              - id: l1-n3
                type: ordering
                option_audio: false
                text: "Put the sentences in a good order."
                say: { en: "Zoé wants to introduce herself. Put her sentences in order." }
                options: ["J'ai une sœur.", "J'ai dix ans.", "Bonjour ! Je m'appelle Zoé."]
                slot_count: 3
                answer: ["Bonjour ! Je m'appelle Zoé.", "J'ai dix ans.", "J'ai une sœur."]
              - id: l1-n4
                type: speak
                say: { en: "Introduce yourself in two sentences: your name and your age." }
                expected_text: "Je m'appelle Tom. J'ai dix ans."
              - id: l1-n5
                type: audio_choice
                text: "What is the boy's name?"
                say: { en: "Listen. What is the boy's name?" }
                audio: { fr: "Bonjour ! J'ai neuf ans. Je m'appelle Nathan.", speaker: male }
                options: ["Nathan", "Noah", "Hugo"]
                answer: "Nathan"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "How old is Jules?"
            say: { en: "Listen. How old is Jules?" }
            audio: { fr: "Salut, je m'appelle Jules. J'ai huit ans.", speaker: male }
            options: ["8", "9", "10"]
            answer: "8"
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "How do you say: I live in London?"
            say: { en: "How do you say in French: I live in London?" }
            options: ["J'habite à Londres.", "Je suis Londres.", "J'ai Londres."]
            answer: "J'habite à Londres."
          - id: l1-c3
            type: ordering
            option_audio: false
            text: "Put the sentences in a good order."
            say: { en: "Emma wants to introduce herself. Put her sentences in order." }
            options: ["J'habite à York.", "Je m'appelle Emma.", "J'ai neuf ans."]
            slot_count: 3
            answer: ["Je m'appelle Emma.", "J'ai neuf ans.", "J'habite à York."]
          - id: l1-c4
            type: audio_choice
            text: "Who does Clara live with?"
            say: { en: "Listen. Who does Clara live with?" }
            audio: { fr: "Bonjour ! Je m'appelle Clara. J'habite à Nantes avec mon papi.", speaker: female }
            options: ["her grandpa", "her brother", "her mum"]
            answer: "her grandpa"
          - id: l1-c5
            type: true_false
            text: "Tim is nine. He says: J'ai neuf ans.\n\nIs his sentence right?"
            say: { en: "Tim is nine. He says: j'ai neuf ans. Is his sentence right?" }
            answer: true
          - id: l1-c6
            type: multiple_choice
            option_audio: false
            text: "How do you say: I have got two brothers?"
            say: { en: "How do you say in French: I have got two brothers?" }
            options: ["J'ai deux frères.", "Je suis deux frères.", "Deux frères j'ai."]
            answer: "J'ai deux frères."

  - n: 2
    title: { de: Was ich gern mache, en: What I like doing }
    goal:
      de: "Sag, was du gern machst, und verbinde deine Sätze mit et, mais und aussi."
      en: "Say what you like doing and join your sentences with et, mais and aussi."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "How old is Léa?"
            say: { en: "Listen. How old is Léa?" }
            audio: { fr: "Je m'appelle Léa. J'ai dix ans.", speaker: female }
            options: ["10", "9"]
            answer: "10"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "How do you say: I'm eleven?"
            say: { en: "How do you say in French: I'm eleven?" }
            options: ["J'ai onze ans.", "Je suis onze."]
            answer: "J'ai onze ans."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Mon sport préféré, c'est le foot.\n\nPréféré looks a bit like an English word. What could it mean?"
            say: { en: "Listen. Préféré looks a bit like an English word. What do you think it means? Have a guess.", fr: "Mon sport préféré, c'est le foot." }
            show: { object: play-football }
          - text: "J'aime nager.\nMon sport préféré, c'est le foot."
            say: { en: "Préféré means favourite, a bit like preferred in English. Mon sport préféré, c'est ... means my favourite sport is ... And to say what you like doing: j'aime, then the hobby.", fr: "J'aime nager. Mon sport préféré, c'est le foot." }
            show: { objects: [swim, play-football] }
          - text: "J'aime nager et j'aime danser.\nJ'aime le foot, mais je n'aime pas le tennis.\nJ'aime lire. Ma sœur aime lire aussi."
            say: { en: "Do not start every sentence with j'aime. Join your sentences: et means and, mais means but, aussi means too.", fr: "J'aime nager et j'aime danser. J'aime le foot, mais je n'aime pas le tennis. J'aime lire. Ma sœur aime lire aussi." }
          - text: "Salut ! Je m'appelle Hugo. J'ai dix ans. J'aime le foot et je sais nager, mais je n'aime pas chanter."
            say: { en: "Listen to Hugo. This is a short talk with joined sentences.", fr: "Salut ! Je m'appelle Hugo. J'ai dix ans. J'aime le foot et je sais nager, mais je n'aime pas chanter." }
            show: { object: boy }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "What is Lina's favourite sport?"
                say: { en: "Listen. What is Lina's favourite sport?" }
                audio: { fr: "Je m'appelle Lina. Mon sport préféré, c'est le tennis.", speaker: female }
                options: [{ object: play-tennis }, { object: play-football }, { object: swim }]
                answer: play-tennis
                hints:
                  - "Listen after préféré."
                  - "You hear c'est le tennis."
                  - "Lina's favourite sport is tennis."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "What does Théo not like?"
                say: { en: "Listen. What does Théo not like?" }
                audio: { fr: "J'aime lire, mais je n'aime pas danser.", speaker: male }
                options: [{ object: read }, { object: dance }, { object: sing }]
                answer: dance
                feedback:
                  read: "Théo likes reading: j'aime lire. Listen after mais: je n'aime pas danser."
                hints:
                  - "Listen for je n'aime pas."
                  - "Mais means but. After it comes what he does not like."
                  - "Je n'aime pas danser. He does not like dancing."
              - id: l2-f3
                type: ordering
                option_audio: false
                text: "Build the sentence: I like swimming and I like dancing."
                say: { en: "Build the sentence: I like swimming and I like dancing." }
                options: ["et", "j'aime danser.", "J'aime nager"]
                slot_count: 3
                answer: ["J'aime nager", "et", "j'aime danser."]
                hints:
                  - "Start with J'aime nager."
                  - "Et joins the two parts."
                  - "J'aime nager et j'aime danser."
              - id: l2-f4
                type: speak
                say: { en: "Say what you like doing. For example:", fr: "J'aime peindre." }
                show: { object: paint }
                expected_text: "J'aime peindre."
                hints:
                  - "Listen again and say it with me."
                  - "J'aime, then the hobby."
                  - "Say it with me: j'aime peindre."
              - id: l2-f5
                type: fill_in_blank
                option_audio: false
                text: "Jules likes football, but he does not like tennis. Finish the sentence."
                say: { en: "Jules likes football, but he does not like tennis. Finish the sentence." }
                frame: "J'aime le foot, _ je n'aime pas le tennis."
                options: ["mais", "et", "aussi"]
                answer: ["mais"]
                hints:
                  - "The second part says something different."
                  - "Mais means but."
                  - "J'aime le foot, mais je n'aime pas le tennis."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "What does Noah like doing?"
                say: { en: "Listen. What does Noah like doing?" }
                audio: { fr: "Je m'appelle Noah. J'aime chanter et j'aime jouer de la guitare.", speaker: male }
                options: ["singing and playing the guitar", "singing and dancing", "reading and playing the guitar"]
                answer: "singing and playing the guitar"
                hints: ["Listen for the two hobbies after j'aime."]
              - id: l2-s2
                type: speak
                say: { en: "Say your favourite sport. For example:", fr: "Mon sport préféré, c'est le foot." }
                show: { object: play-football }
                expected_text: "Mon sport préféré, c'est le foot."
                hints: ["Mon sport préféré, c'est, then the sport."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Build the sentence: I like reading, but I don't like singing."
                say: { en: "Build the sentence: I like reading, but I don't like singing." }
                options: ["je n'aime pas chanter.", "mais", "J'aime lire,"]
                slot_count: 3
                answer: ["J'aime lire,", "mais", "je n'aime pas chanter."]
                hints: ["Mais goes in the middle."]
              - id: l2-s4
                type: fill_in_blank
                option_audio: false
                text: "Ella likes painting. Her brother likes painting too. Finish the sentence."
                say: { en: "Ella likes painting. Her brother likes painting too. Finish the sentence." }
                frame: "Mon frère aime peindre _."
                options: ["aussi", "mais", "et"]
                answer: ["aussi"]
                hints: ["Aussi means too."]
              - id: l2-s5
                type: audio_choice
                text: "What can Zoé do?"
                say: { en: "Listen. What can Zoé do?" }
                audio: { fr: "Je ne sais pas nager, mais je sais faire du vélo.", speaker: female }
                options: [{ object: swim }, { object: ride-bike }, { object: play-tennis }]
                answer: ride-bike
                hints: ["Listen after mais."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "What is Adam's favourite sport?"
                say: { en: "Listen. What is Adam's favourite sport?" }
                audio: { fr: "Salut ! Je m'appelle Adam. J'aime nager, mais mon sport préféré, c'est le foot.", speaker: male }
                options: [{ object: play-football }, { object: swim }, { object: play-tennis }]
                answer: play-football
              - id: l2-n2
                type: ordering
                option_audio: false
                text: "Put the sentences in a good order."
                say: { en: "Build Rose's short talk. Put her sentences in order." }
                options: ["J'aime danser et chanter.", "J'ai neuf ans.", "Salut ! Je m'appelle Rose."]
                slot_count: 3
                answer: ["Salut ! Je m'appelle Rose.", "J'ai neuf ans.", "J'aime danser et chanter."]
              - id: l2-n3
                type: speak
                say: { en: "Talk about yourself in three sentences: your name, your age and what you like doing." }
                expected_text: "Je m'appelle Sam. J'ai dix ans. J'aime nager."
              - id: l2-n4
                type: fill_in_blank
                option_audio: false
                text: "Inès likes reading and she likes painting. Finish the sentence."
                say: { en: "Inès likes reading and she likes painting. Finish the sentence." }
                frame: "J'aime lire _ j'aime peindre."
                options: ["et", "mais", "aussi"]
                answer: ["et"]
              - id: l2-n5
                type: audio_choice
                text: "Who likes football too?"
                say: { en: "Listen. Who likes football too?" }
                audio: { fr: "J'aime le foot. Mon papa aime le foot aussi.", speaker: male }
                options: ["Dad", "Mum", "a sister"]
                answer: "Dad"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: me
            type: audio_choice
            text: "Where does Maël live?"
            say: { en: "Listen. Where does Maël live?" }
            audio: { fr: "Bonjour ! Je m'appelle Maël. J'ai neuf ans et j'habite à Rennes.", speaker: male }
            options: ["in Rennes", "in Nice", "in Lyon"]
            answer: "in Rennes"
          - id: l2-c2
            part: me
            type: multiple_choice
            option_audio: false
            text: "How do you say: I'm twelve?"
            say: { en: "How do you say in French: I'm twelve?" }
            options: ["Je suis douze.", "J'ai douze ans.", "Je douze ans."]
            answer: "J'ai douze ans."
          - id: l2-c3
            part: likes
            type: audio_choice
            text: "What does Jade not like?"
            say: { en: "Listen. What does Jade not like?" }
            audio: { fr: "Le samedi, je joue au tennis. Mais je n'aime pas le foot.", speaker: female }
            options: [{ object: play-tennis }, { object: play-football }, { object: swim }]
            answer: play-football
          - id: l2-c4
            part: join
            type: ordering
            option_audio: false
            text: "Build the sentence: I like tennis, but I don't like football."
            say: { en: "Build the sentence: I like tennis, but I don't like football." }
            options: ["mais", "je n'aime pas le foot.", "J'aime le tennis,"]
            slot_count: 3
            answer: ["J'aime le tennis,", "mais", "je n'aime pas le foot."]
          - id: l2-c5
            part: me
            type: ordering
            option_audio: false
            text: "Put Louis's sentences in the order of the plan: name, age, where he lives, what he likes."
            say: { en: "Build Louis's short talk. Put his sentences in the order of the plan: name, age, where he lives, what he likes." }
            options: ["J'aime le foot, mais je n'aime pas le tennis.", "J'habite à Leeds.", "Bonjour ! Je m'appelle Louis.", "J'ai dix ans."]
            slot_count: 4
            answer: ["Bonjour ! Je m'appelle Louis.", "J'ai dix ans.", "J'habite à Leeds.", "J'aime le foot, mais je n'aime pas le tennis."]
          - id: l2-c6
            part: me
            type: true_false
