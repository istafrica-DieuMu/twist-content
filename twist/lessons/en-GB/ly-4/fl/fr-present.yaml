# Lesson set: French, learning year 4 (Year 6). Hand-authored draft.
id: en-GB.fl.fr-present
skill: fl.speaking.present
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Einen kurzen Vortrag halten (Französisch)
  en: Giving a short talk in French
summary: >
  Giving a short prepared talk in French: my pet, my favourite animal, my
  hobby. Lesson 1 listens to children presenting their pets and learns the
  three parts of a talk (a start, three or four facts, an end), with il and
  elle for the animal, then presents a pet; lesson 2 presents a favourite
  animal or hobby with Mon animal préféré, c'est ... and J'aime ... parce
  que ..., and ends with the skill check. Speaking tasks are practice only;
  the skill check asks for the parts of a talk by listening, choosing and
  ordering.
metadata:
  year: ly-4
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.about-me]
  also_practises: [fl.speaking.describe, fl.grammar.he-she-it, fl.themes.hobbies, fl.themes.outside-animals]
  vocabulary: { fr: ["Bonjour à tous !", "Je vais vous présenter ...", "Voici ...", "C'est mon / ma ...", "Il est ... / Elle est ...", "Il aime ...", "Mon animal préféré, c'est ...", "parce que ...", "C'est tout. Merci !", préféré, drôle, mignon] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: no-start-end
      what: Starts straight with a fact and stops without an end, so the listeners do not know when the talk begins and ends
      addressed: lesson 1 Learn names the three parts (start, facts, end); l1-f3, l1-s3 and l2-n2 order a whole talk; l1-f2 and l1-s2 ask for a good start or end, with feedback in l1-f2; l2-c3 orders a whole talk
    - id: il-for-every-animal
      what: Uses il for every animal, even a female pet or a feminine word (la souris, la girafe)
      addressed: lesson 1 Learn says il for le chien or a male pet, elle for la souris or a female pet; l1-f4 and l1-s4 give feedback on the wrong word; l2-f2 and l2-c4 ask again
    - id: no-parce-que
      what: Gives a reason without parce que, or puts it before the opinion
      addressed: lesson 2 Learn models J'aime ... parce que ...; l2-f3, l2-s3 and l2-n3 build the parce que sentence from cards
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Mein Haustier, en: My pet }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { en: "Listen. What does Noah like doing?" }
            audio: { fr: "Je m'appelle Noah. J'aime lire et j'aime chanter." }
            options: ["reading and singing", "reading and painting", "dancing and singing"]
            answer: "reading and singing"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "J'aime les chats. J'aime les chiens ___."
            say: { en: "Which word fits? I like cats. I like dogs too." }
            options: ["aussi", "mais"]
            answer: "aussi"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - say: { en: "Listen. Jules is presenting his pet to the class.", fr: "Bonjour à tous ! Je vais vous présenter mon animal. Voici Bruno. C'est mon chien. Il est marron et il a de grandes oreilles. Il aime jouer avec sa balle. C'est tout. Merci !" }
            show: { objects: [dog, ball] }
          - text: "1. Start: Bonjour à tous ! Je vais vous présenter mon animal.\n2. Facts: Voici Bruno. Il est marron. Il aime ...\n3. End: C'est tout. Merci !"
            say: { en: "A short talk has three parts. At the start you say hello and what you will talk about. In the middle you tell three or four facts. At the end you say c'est tout, merci. Then everyone knows when you start and when you have finished." }
          - text: "le chien, Bruno → il\nla souris, Luna → elle"
            say: { en: "For a boy animal or a le word you say il. For a girl animal or a la word you say elle. Bruno is a boy: il est marron. La souris is a la word: elle est petite.", fr: "Il est marron. Elle est petite." }
            show: { objects: [dog, mouse] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { en: "Listen to Lily's talk. Which pet has she got?" }
                audio: { fr: "Bonjour à tous ! Je vais vous présenter mon animal. Voici Luna. C'est mon lapin. Elle est blanche et elle a de grandes oreilles. Elle aime les carottes. C'est tout. Merci !" }
                options: [{ object: rabbit }, { object: cat }, { object: mouse }]
                answer: rabbit
                hints:
                  - "Listen for c'est mon ..."
                  - "Long ears and carrots: which animal is that?"
                  - "Un lapin is a rabbit."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "How do you start your talk?"
                say: { en: "You want to present your pet to the class. Which sentence is a good start?" }
                options: ["Bonjour à tous ! Je vais vous présenter mon animal.", "C'est tout. Merci !", "Il aime sa balle."]
                answer: "Bonjour à tous ! Je vais vous présenter mon animal."
                feedback:
                  "C'est tout. Merci !": "That is how you finish. At the start you say what you will talk about."
                  "Il aime sa balle.": "That belongs in the middle. At the start you greet everyone and say your topic."
                hints:
                  - "At the start you greet the class."
                  - "Then you say what you will talk about."
                  - "Bonjour à tous ! Je vais vous présenter mon animal."
              - id: l1-f3
                type: ordering
                option_audio: false
                text: "Put the sentences in the right order."
                say: { en: "Build Jules's talk. What comes first?" }
                options: ["C'est tout. Merci !", "Voici Bruno. C'est mon chien.", "Bonjour à tous !"]
                slot_count: 3
                answer: ["Bonjour à tous !", "Voici Bruno. C'est mon chien.", "C'est tout. Merci !"]
                hints:
                  - "First you greet everyone."
                  - "At the end you say thank you."
                  - "Bonjour à tous, voici Bruno, c'est tout, merci."
              - id: l1-f4
                type: fill_in_blank
                option_audio: false
                text: "Voici Max. C'est mon hamster. _ est très petit."
                say: { en: "Max the hamster is a boy. Which word fits?" }
                frame: "_ est très petit."
                options: ["Il", "Elle", "Je"]
                answer: ["Il"]
                feedback:
                  "Elle": "Elle is for a girl animal or a la word. Max is a boy."
                hints:
                  - "Max is a boy."
                  - "For a boy animal you say il."
                  - "Il est très petit."
              - id: l1-f5
                type: speak
                say: { en: "Start your talk. For example:", fr: "Bonjour à tous ! Je vais vous présenter mon animal." }
                expected_text: "Bonjour à tous ! Je vais vous présenter mon animal."
                hints:
                  - "First greet everyone: bonjour à tous."
                  - "Then: je vais vous présenter mon animal."
                  - "Say it with me: bonjour à tous, je vais vous présenter mon animal."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { en: "Listen to Adam's talk. What does his pet like?" }
                audio: { fr: "Voici Pixel. C'est mon chat. Il est noir. Il aime dormir sur mon lit." }
                options: ["sleeping on Adam's bed", "playing with a ball", "eating carrots"]
                answer: "sleeping on Adam's bed"
                hints: ["Listen after il aime."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "How do you end your talk?"
                say: { en: "Which sentence is a good end for your talk?" }
                options: ["C'est tout. Merci !", "Bonjour à tous !", "Voici mon chien."]
                answer: "C'est tout. Merci !"
                hints: ["At the end you say thank you."]
              - id: l1-s3
                type: ordering
                option_audio: false
                text: "Put the sentences in the right order."
                say: { en: "Build Lily's talk. What comes first?" }
                options: ["Elle est blanche.", "C'est tout. Merci !", "Bonjour à tous ! Voici Luna."]
                slot_count: 3
                answer: ["Bonjour à tous ! Voici Luna.", "Elle est blanche.", "C'est tout. Merci !"]
                hints: ["Start, facts, end."]
              - id: l1-s4
                type: fill_in_blank
                option_audio: false
                text: "Voici ma souris. _ s'appelle Fleur."
                say: { en: "Fleur is a girl mouse. Which word fits?" }
                frame: "_ s'appelle Fleur."
                options: ["Elle", "Il", "Je"]
                answer: ["Elle"]
                feedback:
                  "Il": "Fleur is a girl, and la souris is a la word: elle."
                hints: ["A girl animal is elle."]
              - id: l1-s5
                type: speak
                say: { en: "Say two things about the animal. For example:", fr: "Voici Luna. C'est mon chat. Elle est noire et blanche." }
                show: { object: cat }
                expected_text: "Voici Luna. C'est mon chat. Elle est noire et blanche."
                hints: ["Start with voici and the name."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { en: "Listen to Inès's talk. Which pet has she got?" }
                audio: { fr: "Bonjour à tous ! Voici Bulle. C'est mon poisson. Il est orange. Il nage toute la journée. Merci !" }
                options: [{ object: fish }, { object: bird }, { object: cat }]
                answer: fish
              - id: l1-n2
                type: audio_choice
                say: { en: "Listen. What colour is Rocky?" }
                audio: { fr: "Voici Rocky. C'est mon chien. Il est petit et il est noir." }
                options: ["black", "brown", "white"]
                answer: "black"
              - id: l1-n3
                type: ordering
                option_audio: false
                text: "Put the sentences in the right order."
                say: { en: "Build Hugo's talk. Put the sentences in order." }
                options: ["Il aime les carottes.", "C'est tout. Merci !", "Bonjour à tous !", "Voici Caramel. C'est mon lapin."]
                slot_count: 4
                answer: ["Bonjour à tous !", "Voici Caramel. C'est mon lapin.", "Il aime les carottes.", "C'est tout. Merci !"]
              - id: l1-n4
                type: speak
                say: { en: "Present your pet or an animal you like in three sentences. Start, one fact, end." }
                expected_text: "Bonjour à tous ! Voici Bruno. Il est marron. C'est tout. Merci !"
              - id: l1-n5
                type: fill_in_blank
                option_audio: false
                text: "Voici Mimi. C'est mon chat. _ aime le lait."
                say: { en: "Mimi is a girl cat. Which word fits?" }
                frame: "_ aime le lait."
                options: ["Elle", "Il", "Tu"]
                answer: ["Elle"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { en: "Listen to the talk. Which pet is it about?" }
            audio: { fr: "Bonjour à tous ! Voici Coco. C'est mon oiseau. Il est bleu et il chante. Merci !" }
            options: [{ object: bird }, { object: fish }, { object: dog }]
            answer: bird
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Which sentence belongs in the middle of a talk?"
            say: { en: "Which sentence belongs in the middle of a talk?" }
            options: ["Il est marron.", "Bonjour à tous !", "C'est tout. Merci !"]
            answer: "Il est marron."
          - id: l1-c3
            type: fill_in_blank
            option_audio: false
            text: "Voici Oscar. C'est mon chien. _ est grand."
            say: { en: "Oscar is a boy dog. Which word fits?" }
            frame: "_ est grand."
            options: ["Il", "Elle"]
            answer: ["Il"]

  - n: 2
    title: { de: Mein Lieblingstier, en: My favourite animal }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            option_audio: false
            text: "How do you start a talk?"
            say: { en: "Which sentence is a good start for a talk?" }
            options: ["Bonjour à tous !", "C'est tout. Merci !"]
            answer: "Bonjour à tous !"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            option_audio: false
            text: "Voici Lola. C'est ma souris. _ est grise."
            say: { en: "Lola is a girl mouse. Which word fits?" }
            frame: "_ est grise."
            options: ["Elle", "Il"]
            answer: ["Elle"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Mon animal préféré, c'est la girafe.\nElle est grande. Elle mange des feuilles."
            say: { en: "You can also present your favourite animal. Mon animal préféré, c'est ... means my favourite animal is ... La girafe is a la word, so you say elle.", fr: "Mon animal préféré, c'est la girafe. Elle est grande. Elle mange des feuilles." }
            show: { object: giraffe }
          - text: "J'aime la girafe parce qu'elle est drôle."
            say: { en: "To give a reason, say parce que, because. First what you like, then parce que, then the reason. Before il or elle, parce que becomes parce qu'.", fr: "J'aime la girafe parce qu'elle est drôle." }
          - text: "Mon sport préféré, c'est la natation.\nJ'aime nager parce que c'est amusant."
            say: { en: "It works for a hobby too. Natation is swimming. J'aime nager parce que c'est amusant: I like swimming because it's fun.", fr: "Mon sport préféré, c'est la natation. J'aime nager parce que c'est amusant." }
            show: { object: swim }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { en: "Listen. What is Zoé's favourite animal?" }
                audio: { fr: "Bonjour à tous ! Mon animal préféré, c'est l'éléphant. Il est très grand et il est gris. Merci !" }
                options: [{ object: elephant }, { object: giraffe }, { object: lion }]
                answer: elephant
                hints:
                  - "Listen after préféré, c'est."
                  - "Big and grey: très grand et gris."
                  - "L'éléphant is the elephant."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                option_audio: false
                text: "Mon animal préféré, c'est la girafe. _ a un long cou."
                say: { en: "La girafe is a la word. Which word fits?" }
                frame: "_ a un long cou."
                options: ["Elle", "Il", "Je"]
                answer: ["Elle"]
                hints:
                  - "Look at the word before girafe."
                  - "La girafe is a la word, so you say elle."
                  - "Elle a un long cou."
              - id: l2-f3
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I like monkeys because they are funny." }
                options: ["parce qu'ils", "J'aime les singes", "sont drôles."]
                slot_count: 3
                answer: ["J'aime les singes", "parce qu'ils", "sont drôles."]
                hints:
                  - "First say what you like."
                  - "Then parce que, then the reason."
                  - "J'aime les singes parce qu'ils sont drôles."
              - id: l2-f4
                type: speak
                say: { en: "Say your favourite animal. For example:", fr: "Mon animal préféré, c'est le lion." }
                show: { object: lion }
                expected_text: "Mon animal préféré, c'est le lion."
                hints:
                  - "Listen again and say it with me."
                  - "Mon animal préféré, c'est, then the animal."
                  - "Say it with me: mon animal préféré, c'est le lion."
              - id: l2-f5
                type: audio_choice
                say: { en: "Listen. Why does Max like football?" }
                audio: { fr: "Mon sport préféré, c'est le foot. J'aime le foot parce que je joue avec mes copains." }
                options: ["He plays with his friends.", "He is very fast.", "His dad is a coach."]
                answer: "He plays with his friends."
                hints:
                  - "Listen after parce que."
                  - "Mes copains are my friends."
                  - "He plays with his friends."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { en: "Listen. What is Léo's favourite sport?" }
                audio: { fr: "Mon sport préféré, c'est le tennis. J'aime le tennis parce que c'est rapide." }
                options: [{ object: play-tennis }, { object: play-football }, { object: swim }]
                answer: play-tennis
                hints: ["Listen after c'est."]
              - id: l2-s2
                type: multiple_choice
                option_audio: false
                text: "Which sentence gives a reason?"
                say: { en: "Which sentence gives a reason?" }
                options: ["J'aime les chats parce qu'ils sont mignons.", "J'aime les chats.", "Les chats sont gris."]
                answer: "J'aime les chats parce qu'ils sont mignons."
                hints: ["A reason starts with parce que."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I like swimming because it's fun." }
                options: ["c'est amusant.", "J'aime nager", "parce que"]
                slot_count: 3
                answer: ["J'aime nager", "parce que", "c'est amusant."]
                hints: ["Parce que goes in the middle."]
              - id: l2-s4
                type: speak
                say: { en: "Say why you like your hobby. For example:", fr: "J'aime danser parce que c'est amusant." }
                show: { object: dance }
                expected_text: "J'aime danser parce que c'est amusant."
                hints: ["J'aime, the hobby, then parce que."]
              - id: l2-s5
                type: audio_choice
                say: { en: "Listen. Why does Lina like the elephant?" }
                audio: { fr: "J'aime l'éléphant parce qu'il est très intelligent." }
                options: ["It is very clever.", "It is very small.", "It is very fast."]
                answer: "It is very clever."
                hints: ["Intelligent looks like an English word."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { en: "Listen. What does the zebra eat?" }
                audio: { fr: "Mon animal préféré, c'est le zèbre. Il est noir et blanc. Il mange de l'herbe." }
                options: ["grass", "fish", "bananas"]
                answer: "grass"
              - id: l2-n2
                type: ordering
                option_audio: false
                text: "Put the sentences in the right order."
                say: { en: "Build Chloé's talk about her favourite animal." }
                options: ["Elle est grande.", "C'est tout. Merci !", "Bonjour à tous !", "Mon animal préféré, c'est la girafe."]
                slot_count: 4
                answer: ["Bonjour à tous !", "Mon animal préféré, c'est la girafe.", "Elle est grande.", "C'est tout. Merci !"]
              - id: l2-n3
                type: ordering
                option_audio: false
                text: "Put the words in order."
                say: { en: "Build the sentence: I like the lion because it is strong." }
                options: ["parce qu'il", "est fort.", "J'aime le lion"]
                slot_count: 3
                answer: ["J'aime le lion", "parce qu'il", "est fort."]
              - id: l2-n4
                type: speak
                say: { en: "Give a short talk about your favourite animal: start, two facts and a reason, end." }
                expected_text: "Bonjour à tous ! Mon animal préféré, c'est le chat. Il est petit. J'aime le chat parce qu'il est mignon. C'est tout. Merci !"
              - id: l2-n5
                type: audio_choice
                say: { en: "Listen. What is Hugo's talk about?" }
                audio: { fr: "Bonjour à tous ! Je vais vous présenter mon sport préféré. C'est la natation. Je nage tous les mercredis." }
                options: ["his favourite sport", "his pet", "his family"]
                answer: "his favourite sport"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { en: "Listen to the talk. Which animal is it about?" }
            audio: { fr: "Bonjour à tous ! Mon animal préféré, c'est le singe. Il est petit et il aime les bananes. Merci !" }
            options: [{ object: monkey }, { object: elephant }, { object: giraffe }]
            answer: monkey
          - id: l2-c2
            type: audio_choice
            say: { en: "Listen. Why does Emma like her cat?" }
            audio: { fr: "Voici Minou. C'est mon chat. J'aime Minou parce qu'il est très doux." }
            options: ["It is very soft.", "It is very big.", "It sleeps a lot."]
            answer: "It is very soft."
          - id: l2-c3
            type: ordering
            option_audio: false
            text: "Put the sentences in the right order."
            say: { en: "Build Nathan's talk. Put the sentences in order." }
            options: ["Il est noir et blanc.", "Merci !", "Voici Pirate. C'est mon chien.", "Bonjour à tous !"]
            slot_count: 4
            answer: ["Bonjour à tous !", "Voici Pirate. C'est mon chien.", "Il est noir et blanc.", "Merci !"]
          - id: l2-c4
            type: fill_in_blank
            option_audio: false
            text: "Mon animal préféré, c'est la tortue. _ est très lente."
            say: { en: "La tortue is a la word. Which word fits?" }
            frame: "_ est très lente."
            options: ["Elle", "Il", "Tu"]
            answer: ["Elle"]
          - id: l2-c5
            type: multiple_choice
            option_audio: false
            text: "Which sentence gives a reason?"
            say: { en: "Which of these sentences gives a reason?" }
            options: ["J'aime le foot parce que c'est rapide.", "Mon sport préféré, c'est le foot.", "Bonjour à tous !"]
            answer: "J'aime le foot parce que c'est rapide."
