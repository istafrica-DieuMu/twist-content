# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.percent-of-amount
skill: math.percentages-ratio.percent-of-amount
curriculum: en-GB
language: en
title:
  de: Prozent von einer Größe
  en: Percentages of amounts
summary: >
  Lesson 1 finds 50%, 25%, 10%, 1% and 5% of an amount from the matching
  fraction and builds others from them (15% of 360 = 10% + 5% = 36 + 18
  = 54); lesson 2 builds harder percentages (35%, 12%, 60%), uses them in
  sales and surveys, compares proportions by changing them into
  percentages (18 out of 25 is 72%, 14 out of 20 is 70%), and ends with
  the skill check.
metadata:
  year: year-6
  topic: { de: Prozent, en: Percentages }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.percentages-ratio.equivalences, math.written-mult-div.mult-multi-digit]
  also_practises: [math.percentages-ratio.equivalences]
  vocabulary: { en: [per cent, percentage, "%", one tenth, half, quarter, discount, proportion, out of] }
  forms: [drawn, text, audio]
  drawn: [fraction]
  facets: []
  misconceptions:
    - id: percent-subtracted
      what: Takes the percentage away as a number (10% of 360 = 350)
      addressed: lesson 1 Learn says 10% is one tenth, so divide by 10; l1-f1 has feedback, l1-s2 offers it again
    - id: percent-as-number
      what: Gives the percentage itself as the answer (25% of 80 = 25)
      addressed: lesson 1 Learn links 25% to a quarter; l1-f2 has feedback, l1-c2, l2-c2 and l1-f5 offer it
    - id: compare-by-count
      what: Thinks the bigger count is the bigger share whatever it is out of (11 out of 25 beats 9 out of 20)
      addressed: lesson 2 Learn changes both into percentages; l2-f3 has feedback, l2-s5, l2-n4 and l2-c4 compare again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "10 %, 5 % und 15 %", en: "10%, 5% and 15%" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which fraction is the same as 25%?"
            options: ["1/4", "1/2", "1/25"]
            answer: "1/4"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "245 × 13 = _"
            answer: "3185"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "10% of 360 = 360 ÷ 10 = 36"
            say: "Ten per cent is ten out of a hundred, which is one tenth. To find ten per cent of three hundred and sixty, divide by ten: thirty-six."
            show: { drawn: fraction, kind: bar, parts: 10, shaded: 1 }
          - text: "50% = 1/2, 25% = 1/4, 1% = 1/100"
            say: "Fifty per cent is a half, so divide by two. Twenty-five per cent is a quarter, so divide by four. One per cent is one hundredth, so divide by one hundred."
            show: { drawn: fraction, kind: rect, parts: 100, rows: 10, shaded: 25 }
          - text: "5% of 360 = half of 36 = 18"
            say: "Five per cent is half of ten per cent. Half of thirty-six is eighteen."
          - text: "15% of 360 = 10% + 5% = 36 + 18 = 54"
            say: "Build other percentages from the ones you know. Fifteen per cent is ten per cent add five per cent: thirty-six add eighteen is fifty-four."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is 10% of 360?"
                options: ["36", "3.6", "350"]
                answer: "36"
                feedback:
                  "350": "That is 360 − 10. 10% is one tenth, so divide by 10."
                  "3.6": "That is 360 ÷ 100, which is 1%. For 10%, divide by 10."
                hints:
                  - "10% is one tenth."
                  - "Divide 360 by 10."
                  - "360 ÷ 10 = 36."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is 25% of 80?"
                options: ["20", "25", "40"]
                answer: "20"
                feedback:
                  "25": "25 is the percentage, not the answer. 25% is a quarter of 80."
                  "40": "40 is half of 80, which is 50%. 25% is half of that."
                hints:
                  - "Which fraction is 25%?"
                  - "25% is a quarter, so divide by 4."
                  - "80 ÷ 4 = 20."
              - id: l1-f3
                type: fill_in_blank
                text: "Find 15% of 240."
                frame: "10% = _, 5% = _, 15% = _"
                options: ["24", "12", "36", "48"]
                answer: ["24", "12", "36"]
                hints:
                  - "Start with 10%: divide by 10."
                  - "10% is 24. 5% is half of that."
                  - "24, 12, and 24 + 12 = 36."
              - id: l1-f4
                type: text_input
                text: "What is 1% of 700?"
                answer: "7"
                hints:
                  - "1% is one hundredth."
                  - "Divide 700 by 100."
                  - "700 ÷ 100 = 7."
              - id: l1-f5
                type: multiple_choice
                text: "What is 20% of 45?"
                options: ["9", "20", "4.5"]
                answer: "9"
                hints:
                  - "20% is two lots of 10%."
                  - "10% of 45 is 4.5."
                  - "4.5 × 2 = 9."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "What is 10% of 520?"
                answer: "52"
                hints: ["Divide by 10."]
              - id: l1-s2
                type: multiple_choice
                text: "What is 50% of 76?"
                options: ["38", "26", "50"]
                answer: "38"
                hints: ["50% is a half."]
              - id: l1-s3
                type: fill_in_blank
                text: "Find 15% of 600."
                frame: "10% = _, 5% = _, 15% = _"
                options: ["60", "30", "90", "15"]
                answer: ["60", "30", "90"]
                hints: ["5% is half of 10%."]
              - id: l1-s4
                type: text_input
                text: "What is 5% of 80?"
                answer: "4"
                hints: ["Find 10% first, then halve it."]
              - id: l1-s5
                type: multiple_choice
                text: "What is 75% of 40?"
                options: ["30", "10", "35"]
                answer: "30"
                hints: ["75% is three quarters. One quarter of 40 is 10."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "What is 25% of 360?"
                answer: "90"
              - id: l1-n2
                type: text_input
                text: "What is 15% of 160?"
                answer: "24"
              - id: l1-n3
                type: multiple_choice
                text: "What is 30% of 70?"
                options: ["21", "40", "2.1"]
                answer: "21"
              - id: l1-n4
                type: true_false
                text: "Is it true? 1% of 450 is 45."
                answer: false
              - id: l1-n5
                type: text_input
                keyboard: decimal
                text: "What is 10% of 35?"
                answer: "3.5"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "What is 10% of 90?"
            answer: "9"
          - id: l1-c2
            type: multiple_choice
            text: "What is 25% of 120?"
            options: ["30", "25", "60"]
            answer: "30"
          - id: l1-c3
            type: fill_in_blank
            text: "Find 15% of 80."
            frame: "10% = _, 5% = _, 15% = _"
            options: ["8", "4", "12", "15"]
            answer: ["8", "4", "12"]

  - n: 2
    title: { de: "Prozente bilden und vergleichen", en: "Build and compare percentages" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "What is 10% of 640?"
            answer: "64"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is 5% of 200?"
            options: ["10", "5", "20"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "35% of 260\n30% = 3 × 26 = 78, 5% = 13\n35% = 78 + 13 = 91"
            say: "Thirty-five per cent is three lots of ten per cent and five per cent more. Ten per cent of two hundred and sixty is twenty-six, so thirty per cent is seventy-eight. Five per cent is thirteen. Seventy-eight add thirteen is ninety-one."
          - text: "12% of 50 = 10% + 1% + 1% = 5 + 0.5 + 0.5 = 6"
            say: "Twelve per cent is ten per cent and two lots of one per cent. Five add nought point five add nought point five is six."
          - text: "20% off £45: 10% = £4.50, 20% = £9\nSale price: £45 − £9 = £36"
            say: "In a sale, twenty per cent off means you pay twenty per cent less. Twenty per cent of forty-five pounds is nine pounds, so the coat costs thirty-six pounds."
          - text: "Class A: 18 out of 25 = 72 out of 100 = 72%\nClass B: 14 out of 20 = 70 out of 100 = 70%"
            say: "To compare shares that are out of different numbers, change both into percentages. Eighteen out of twenty-five: multiply both by four, seventy-two out of a hundred. Fourteen out of twenty: multiply both by five, seventy out of a hundred. Class A has the bigger share."
            show: { drawn: fraction, kind: rect, parts: 100, rows: 10, shaded: 72 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Find 35% of 80."
                frame: "10% = _, 30% = _, 5% = _, 35% = _"
                options: ["8", "24", "4", "28", "32"]
                answer: ["8", "24", "4", "28"]
                hints:
                  - "Start with 10% of 80."
                  - "10% is 8, so 30% is 3 × 8. 5% is half of 8."
                  - "8, 24, 4, and 24 + 4 = 28."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is 60% of 150?"
                options: ["90", "60", "9"]
                answer: "90"
                hints:
                  - "60% is six lots of 10%."
                  - "10% of 150 is 15."
                  - "6 × 15 = 90."
              - id: l2-f3
                type: multiple_choice
                text: "Which is the bigger share: 9 out of 20, or 11 out of 25?"
                options: ["9 out of 20", "11 out of 25", "They are the same."]
                keep_order: true
                answer: "9 out of 20"
                feedback:
                  "11 out of 25": "11 is more than 9, but it is out of more. 9 out of 20 is 45%, and 11 out of 25 is 44%."
                hints:
                  - "Change both into percentages: out of 100."
                  - "9 out of 20: multiply both by 5. 11 out of 25: multiply both by 4."
                  - "45% and 44%, so 9 out of 20 is bigger."
              - id: l2-f4
                type: text_input
                text: "A coat costs £60. The sale takes 20% off. What is the sale price? £_"
                answer: "48"
                hints:
                  - "Find 20% of £60 first."
                  - "10% is £6, so 20% is £12."
                  - "£60 − £12 = £48."
              - id: l2-f5
                type: text_input
                text: "What is 12% of 300?"
                answer: "36"
                hints:
                  - "12% is 10% add 1% add 1%."
                  - "10% of 300 is 30 and 1% is 3."
                  - "30 + 3 + 3 = 36."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "What is 45% of 60?"
                answer: "27"
                hints: ["40% is 4 × 6. 5% is half of 6."]
              - id: l2-s2
                type: multiple_choice
                text: "What is 70% of 50?"
                options: ["35", "20", "7"]
                answer: "35"
                hints: ["10% of 50 is 5."]
              - id: l2-s3
                type: multiple_choice
                text: "Write 13 out of 20 as a percentage."
                options: ["65%", "13%", "33%"]
                answer: "65%"
                hints: ["Multiply both numbers by 5 to make it out of 100."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 30% of 50 is more than 50% of 30."
                answer: false
                hints: ["Work out both: 3 × 5, and half of 30."]
              - id: l2-s5
                type: multiple_choice
                text: "Team Red won 16 of 25 games. Team Blue won 13 of 20 games. Who won the bigger share?"
                options: ["Team Red", "Team Blue", "They are the same."]
                keep_order: true
                answer: "Team Blue"
                hints: ["16 out of 25 is 64%. What is 13 out of 20?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A school has 400 pupils. 35% of them walk to school. How many pupils walk?"
                answer: "140"
              - id: l2-n2
                type: multiple_choice
                text: "Trainers cost £80. Shop A takes 25% off. Shop B takes £15 off. Where are they cheaper?"
                options: ["Shop A", "Shop B", "They cost the same."]
                keep_order: true
                answer: "Shop A"
              - id: l2-n3
                type: text_input
                text: "A football club sells 340 tickets. 5% are for children. How many children's tickets is that?"
                answer: "17"
              - id: l2-n4
                type: multiple_choice
                text: "In a quiz, Ali scores 21 out of 25 and Ben scores 17 out of 20. Who did better?"
                options: ["Ali", "Ben", "They did the same."]
                keep_order: true
                answer: "Ben"
              - id: l2-n5
                type: true_false
                text: "Is it true? A tip of 15% on a £120 meal is £18."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "What is 10% of 470?"
            answer: "47"
          - id: l2-c2
            type: multiple_choice
            text: "What is 25% of 260?"
            options: ["65", "25", "130"]
            answer: "65"
          - id: l2-c3
            type: text_input
            text: "What is 15% of 420?"
            answer: "63"
          - id: l2-c4
            type: multiple_choice
            text: "Which is the bigger share: 7 out of 10, or 18 out of 25?"
            options: ["7 out of 10", "18 out of 25", "They are the same."]
            keep_order: true
            answer: "18 out of 25"
          - id: l2-c5
            type: text_input
            text: "A bike costs £250. It has 40% off. How much money is taken off? £_"
            answer: "100"
