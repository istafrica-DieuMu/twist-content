# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.missing-angles
skill: math.angles.missing-angles
curriculum: en-GB
language: en
title:
  de: Fehlende Winkel berechnen
  en: Missing angles
summary: >
  Calculating angles from known facts. Lesson 1 uses the angles in a
  triangle (180°) and in a quadrilateral (360°), including isosceles and
  equilateral triangles; lesson 2 finds vertically opposite angles where
  two straight lines cross, works out each angle of a regular polygon by
  splitting it into triangles, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Winkel, en: Angles }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.angles.angle-facts, math.shapes.classify-polygons]
  also_practises: [math.angles.angle-facts]
  vocabulary: { en: [angle, degrees, triangle, quadrilateral, isosceles, equilateral, vertically opposite, regular polygon, interior angle] }
  forms: [drawn, text, audio]
  drawn: [shape]
  facets: []
  parts:
    - { id: triangles, what: { de: fehlende Winkel im Dreieck berechnen, en: calculating missing angles in triangles } }
    - { id: quadrilaterals, what: { de: fehlende Winkel im Viereck berechnen, en: calculating missing angles in quadrilaterals } }
    - { id: opposite, what: { de: Scheitelwinkel und Nebenwinkel finden, en: finding vertically opposite angles and angles on a line } }
    - { id: polygons, what: { de: Winkel in regelmäßigen Vielecken berechnen, en: calculating the angles of regular polygons } }
  misconceptions:
    - id: wrong-total
      what: Uses 360° for a triangle or 180° for a quadrilateral
      addressed: lesson 1 Learn shows why a triangle makes 180° and a quadrilateral two triangles; l1-f1 has feedback on 360° − 140°, l1-f5 and l1-n5 test the 180° total, l1-n4 the 360° total, and l2-n4 the pentagon total
    - id: isosceles-halving
      what: In an isosceles triangle, forgets to halve what is left for the two base angles, or halves the wrong angle
      addressed: lesson 1 Learn works one through; l1-f4, l1-n3, l1-c3 and l2-c5 ask again
    - id: opposite-as-adjacent
      what: Thinks the vertically opposite angle makes 180° with the given one
      addressed: lesson 2 Learn shows opposite angles are equal and angles next to each other make 180°; l2-f1 has feedback, l2-s1, l2-n5 and l2-c3 offer the angle on the line
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Dreiecke und Vierecke", en: "Triangles and quadrilaterals" }
    goal:
      de: "Finde fehlende Winkel in Dreiecken, die zusammen 180 Grad haben, und in Vierecken, die zusammen 360 Grad haben."
      en: "Find missing angles in triangles, which add up to 180 degrees, and in quadrilaterals, which add up to 360 degrees."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Angles on a straight line add up to ..."
            options: ["180°", "90°", "360°"]
            answer: "180°"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which shape has 4 right angles but sides that are not all equal?"
            options: ["rectangle", "square", "rhombus"]
            answer: "rectangle"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The angles in a triangle add up to 180°."
            say: "Tear the three corners off a paper triangle and put them side by side. They make a straight line. So the angles inside any triangle add up to one hundred and eighty degrees."
            show: { drawn: shape, kind: triangle }
          - text: "50° + 70° + ? = 180°\n? = 180° − 120° = 60°"
            say: "A triangle has angles of fifty and seventy degrees. Together they make one hundred and twenty. The third angle is one hundred and eighty subtract one hundred and twenty: sixty degrees."
          - text: "The angles in a quadrilateral add up to 360°."
            say: "A line from one corner to the opposite corner cuts any quadrilateral into two triangles. So its angles add up to two lots of one hundred and eighty: three hundred and sixty degrees."
            show: { drawn: shape, kind: trapezoid }
          - text: "Isosceles triangle, top angle 40°\nBase angles: (180° − 40°) ÷ 2 = 70° each"
            say: "An isosceles triangle has two equal angles at its base. Take the top angle away from one hundred and eighty, then halve what is left. One hundred and forty halved is seventy degrees. An equilateral triangle has three equal angles of sixty degrees."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "A triangle has angles of 60° and 80°. What is the third angle?"
                options: ["40°", "140°", "220°"]
                answer: "40°"
                feedback:
                  "220°": "The angles in a triangle add up to 180°, not 360°."
                  "140°": "140° is the two angles added together. Take it away from 180°."
                hints:
                  - "What do the angles in a triangle add up to?"
                  - "180°. The two angles make 60° + 80° = 140°."
                  - "180° − 140° = 40°."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "A triangle has angles of 35° and 90°. Find the third angle."
                frame: "180° − 35° − 90° = _°"
                options: ["55", "65", "235", "125"]
                answer: ["55"]
                hints:
                  - "Take both angles away from 180°."
                  - "180 − 35 = 145."
                  - "145 − 90 = 55."
              - id: l1-f3
                type: multiple_choice
                text: "A quadrilateral has angles of 90°, 90° and 110°. What is the fourth angle?"
                options: ["70°", "90°", "250°"]
                answer: "70°"
                hints:
                  - "What do the angles in a quadrilateral add up to?"
                  - "360°. The three angles make 290°."
                  - "360° − 290° = 70°."
              - id: l1-f4
                type: multiple_choice
                text: "An isosceles triangle has a 40° angle at the top. The two base angles are equal. How big is each base angle?"
                options: ["70°", "140°", "40°"]
                answer: "70°"
                feedback:
                  "140°": "140° is both base angles together. Halve it."
                hints:
                  - "Take the top angle away from 180°."
                  - "180° − 40° = 140° for the two base angles."
                  - "140° ÷ 2 = 70°."
              - id: l1-f5
                type: true_false
                text: "Is it true? A triangle can have angles of 100°, 50° and 40°."
                answer: false
                hints:
                  - "Add the three angles."
                  - "100 + 50 + 40 = 190."
                  - "No. A triangle's angles must make exactly 180°."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "A triangle has angles of 45° and 75°. What is the third angle? _°"
                say: "A triangle has angles of forty-five degrees and seventy-five degrees. What is the third angle, in degrees?"
                answer: "60"
                hints: ["180° − 120°."]
              - id: l1-s2
                type: multiple_choice
                text: "A quadrilateral has angles of 80°, 100° and 95°. What is the fourth angle?"
                options: ["85°", "95°", "265°"]
                answer: "85°"
                hints: ["The four angles make 360°."]
              - id: l1-s3
                type: multiple_choice
                text: "An equilateral triangle has three equal angles. How big is each one?"
                options: ["60°", "90°", "120°"]
                answer: "60°"
                hints: ["180° ÷ 3."]
              - id: l1-s4
                type: text_input
                text: "A right-angled triangle has one angle of 28°. What is its third angle? _°"
                say: "A right-angled triangle has one angle of twenty-eight degrees. What is its third angle, in degrees?"
                answer: "62"
                hints: ["A right angle is 90°. 90° + 28° = 118°."]
              - id: l1-s5
                type: true_false
                text: "Is it true? A kite has angles of 120°, 70° and 70°, so its fourth angle is 100°."
                answer: true
                hints: ["Add the three angles and take them from 360°."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "A triangle has angles of 38° and 67°. What is the third angle? _°"
                say: "A triangle has angles of thirty-eight degrees and sixty-seven degrees. What is the third angle, in degrees?"
                answer: "75"
              - id: l1-n2
                type: text_input
                text: "A parallelogram has angles of 65°, 115° and 65°. What is the fourth angle? _°"
                say: "A parallelogram has angles of sixty-five degrees, one hundred and fifteen degrees and sixty-five degrees. What is the fourth angle, in degrees?"
                answer: "115"
              - id: l1-n3
                type: multiple_choice
                text: "An isosceles triangle has two base angles of 50°. What is the angle at the top?"
                options: ["80°", "130°", "50°"]
                answer: "80°"
              - id: l1-n4
                type: true_false
                text: "Is it true? A quadrilateral can have four angles of 90°."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Which three angles could be the angles of one triangle?"
                options: ["30°, 60°, 90°", "40°, 60°, 90°", "50°, 50°, 90°"]
                answer: "30°, 60°, 90°"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "A triangle has angles of 25° and 105°. What is the third angle? _°"
            say: "A triangle has angles of twenty-five degrees and one hundred and five degrees. What is the third angle, in degrees?"
            answer: "50"
          - id: l1-c2
            type: multiple_choice
            text: "A quadrilateral has angles of 120°, 60° and 90°. What is the fourth angle?"
            options: ["90°", "270°", "30°"]
            answer: "90°"
          - id: l1-c3
            type: multiple_choice
            text: "An isosceles triangle has a 100° angle at the top. How big is each base angle?"
            options: ["40°", "80°", "50°"]
            answer: "40°"
          - id: l1-c4
            type: true_false
            text: "Is it true? 90°, 90°, 100° and 80° can be the four angles of one quadrilateral."
            say: "Ninety degrees, ninety degrees, one hundred degrees and eighty degrees can be the four angles of one quadrilateral. Is it true?"
            answer: true
          - id: l1-c5
            type: text_input
            text: "A right-angled triangle has one angle of 63°. What is its third angle? _°"
            say: "A right-angled triangle has one angle of sixty-three degrees. What is its third angle, in degrees?"
            answer: "27"
          - id: l1-c6
            type: multiple_choice
            text: "An isosceles triangle has two base angles of 35°. What is the angle at the top?"
            options: ["110°", "145°", "35°"]
            answer: "110°"

  - n: 2
    title: { de: "Scheitelwinkel und regelmäßige Vielecke", en: "Opposite angles and regular polygons" }
    goal:
      de: "Finde gegenüberliegende Winkel, wo sich zwei Geraden kreuzen, und berechne jeden Winkel eines regelmäßigen Vielecks, so wie 120 Grad im Sechseck."
      en: "Find opposite angles where two straight lines cross, and work out each angle of a regular polygon, like 120 degrees in a hexagon."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "A triangle has angles of 55° and 85°. What is the third angle? _°"
            say: "A triangle has angles of fifty-five degrees and eighty-five degrees. What is the third angle, in degrees?"
            answer: "40"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "A quadrilateral has angles of 70°, 70° and 110°. What is the fourth angle?"
            options: ["110°", "70°", "290°"]
            answer: "110°"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Two straight lines cross. Opposite angles are equal."
            say: "When two straight lines cross, they make four angles. The angles opposite each other are equal. They are called vertically opposite angles."
          - text: "One angle is 50°.\nOpposite it: 50°. Next to it: 180° − 50° = 130°."
            say: "If one angle is fifty degrees, the angle opposite it is also fifty. The angle next to it sits on the same straight line, so it is one hundred and eighty subtract fifty: one hundred and thirty degrees. The four angles are fifty, one hundred and thirty, fifty and one hundred and thirty."
          - text: "Regular pentagon: 3 triangles\n3 × 180° = 540°, 540° ÷ 5 = 108°"
            say: "A regular polygon has equal sides and equal angles. From one corner, a pentagon splits into three triangles, so its angles add up to three times one hundred and eighty: five hundred and forty degrees. Five equal angles: each one is one hundred and eight degrees."
            show: { drawn: shape, kind: pentagon }
          - text: "Regular hexagon: 4 triangles\n4 × 180° = 720°, 720° ÷ 6 = 120°"
            say: "A hexagon splits into four triangles: seven hundred and twenty degrees. Each of its six angles is one hundred and twenty degrees. A polygon always splits into two fewer triangles than it has sides."
            show: { drawn: shape, kind: hexagon }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Two straight lines cross. One of the angles is 40°. What is the angle opposite it?"
                options: ["40°", "140°", "320°"]
                answer: "40°"
                feedback:
                  "140°": "140° is the angle next to it, on the same straight line. The opposite angle is equal."
                hints:
                  - "What do you know about vertically opposite angles?"
                  - "Opposite angles are equal."
                  - "It is 40°."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Two straight lines cross. One angle is 65°. What is the angle next to it?"
                options: ["115°", "65°", "295°"]
                answer: "115°"
                hints:
                  - "The two angles sit on one straight line."
                  - "Angles on a straight line make 180°."
                  - "180° − 65° = 115°."
              - id: l2-f3
                type: fill_in_blank
                text: "Find each angle of a regular hexagon."
                show: { drawn: shape, kind: hexagon }
                frame: "4 triangles: 4 × 180° = _°   each angle: _° ÷ 6 = _°"
                options: ["720", "120", "540", "108"]
                answer: ["720", "720", "120"]
                hints:
                  - "A hexagon splits into 4 triangles."
                  - "4 × 180 = 720, and there are 6 equal angles."
                  - "720, 720, then 720 ÷ 6 = 120."
              - id: l2-f4
                type: multiple_choice
                text: "The angles of a regular pentagon add up to 540°. How big is each angle?"
                options: ["108°", "90°", "135°"]
                answer: "108°"
                hints:
                  - "A regular pentagon has 5 equal angles."
                  - "Divide 540° by 5."
                  - "540 ÷ 5 = 108."
              - id: l2-f5
                type: true_false
                text: "Is it true? Two straight lines cross. If one angle is 90°, all four angles are 90°."
                answer: true
                hints:
                  - "The opposite angle is equal: 90°."
                  - "The angle next to it is 180° − 90°."
                  - "That is 90° too, so yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Two straight lines cross. One angle is 125°. What is the angle opposite it?"
                options: ["125°", "55°", "235°"]
                answer: "125°"
                hints: ["Vertically opposite angles are equal."]
              - id: l2-s2
                type: text_input
                text: "Two straight lines cross. One angle is 72°. What is the angle next to it? _°"
                say: "Two straight lines cross. One angle is seventy-two degrees. What is the angle next to it, in degrees?"
                answer: "108"
                hints: ["The two angles make a straight line."]
              - id: l2-s3
                type: multiple_choice
                text: "The angles of a regular octagon add up to 1080°. How big is each angle?"
                options: ["135°", "120°", "108°"]
                answer: "135°"
                hints: ["An octagon has 8 equal angles."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Each angle of a regular hexagon is 108°."
                answer: false
                hints: ["A hexagon has 6 angles adding up to 720°."]
              - id: l2-s5
                type: text_input
                text: "From one corner, how many triangles can an octagon be split into?"
                answer: "6"
                hints: ["Two fewer triangles than sides."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Two straight lines cross. One angle is 33°. What is the angle opposite it? _°"
                say: "Two straight lines cross. One angle is thirty-three degrees. What is the angle opposite it, in degrees?"
                answer: "33"
              - id: l2-n2
                type: text_input
                text: "Two straight lines cross. One angle is 148°. What is the angle next to it? _°"
                say: "Two straight lines cross. One angle is one hundred and forty-eight degrees. What is the angle next to it, in degrees?"
                answer: "32"
              - id: l2-n3
                type: multiple_choice
                text: "A regular polygon has 6 equal angles that add up to 720°. How big is each one?"
                options: ["120°", "108°", "144°"]
                answer: "120°"
              - id: l2-n4
                type: true_false
                text: "Is it true? The angles of a regular pentagon add up to 360°."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Two straight lines cross. One angle is 50°. What are the other three angles, going round?"
                options: ["130°, 50°, 130°", "50°, 50°, 50°", "130°, 130°, 130°"]
                answer: "130°, 50°, 130°"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: triangles
            type: text_input
            text: "A triangle has angles of 48° and 76°. What is the third angle? _°"
            say: "A triangle has angles of forty-eight degrees and seventy-six degrees. What is the third angle, in degrees?"
            answer: "56"
          - id: l2-c2
            part: quadrilaterals
            type: multiple_choice
            text: "A quadrilateral has angles of 85°, 95° and 100°. What is the fourth angle?"
            options: ["80°", "100°", "260°"]
            answer: "80°"
          - id: l2-c3
            part: opposite
            type: multiple_choice
            text: "Two straight lines cross. One angle is 37°. What is the angle opposite it?"
            options: ["37°", "143°", "323°"]
            answer: "37°"
          - id: l2-c4
            part: polygons
            type: multiple_choice
            text: "The angles of a regular decagon (10 sides) add up to 1440°. How big is each angle?"
            options: ["144°", "140°", "160°"]
            answer: "144°"
          - id: l2-c5
            part: triangles
            type: text_input
            text: "An isosceles triangle has two equal base angles of 65°. What is the angle at the top? _°"
            say: "An isosceles triangle has two equal base angles of sixty-five degrees. What is the angle at the top, in degrees?"
            answer: "50"
          - id: l2-c6
            part: triangles
            type: true_false
            text: "Is it true? A triangle has angles of 90° and 45°, so its third angle is 45°."
            say: "A triangle has angles of ninety degrees and forty-five degrees, so its third angle is forty-five degrees. Is it true?"
            answer: true
          - id: l2-c7
            part: triangles
            type: text_input
            text: "An isosceles triangle has a 30° angle at the top. The two base angles are equal. How big is each base angle? _°"
            say: "An isosceles triangle has a thirty degree angle at the top. The two base angles are equal. How big is each base angle, in degrees?"
            answer: "75"
          - id: l2-c8
            part: triangles
            type: multiple_choice
            text: "A triangle has angles of 110° and 35°. What is the third angle?"
            options: ["35°", "145°", "215°"]
            answer: "35°"
          - id: l2-c9
            part: quadrilaterals
            type: text_input
            text: "A quadrilateral has angles of 75°, 105° and 130°. What is the fourth angle? _°"
            say: "A quadrilateral has angles of seventy-five degrees, one hundred and five degrees and one hundred and thirty degrees. What is the fourth angle, in degrees?"
            answer: "50"
          - id: l2-c10
            part: quadrilaterals
            type: true_false
            text: "Is it true? A quadrilateral can have four angles of 100°."
            say: "A quadrilateral can have four angles of one hundred degrees. Is it true?"
            answer: false
          - id: l2-c11
            part: quadrilaterals
            type: multiple_choice
            text: "A trapezium has two right angles and one angle of 65°. What is the fourth angle?"
            options: ["115°", "65°", "295°"]
            answer: "115°"
          - id: l2-c12
            part: quadrilaterals
            type: multiple_choice
            text: "A kite has two equal angles of 110° and one angle of 50°. What is the fourth angle?"
            options: ["90°", "100°", "270°"]
            answer: "90°"
          - id: l2-c13
            part: opposite
            type: text_input
            text: "Two straight lines cross. One angle is 104°. What is the angle opposite it? _°"
            say: "Two straight lines cross. One angle is one hundred and four degrees. What is the angle opposite it, in degrees?"
            answer: "104"
          - id: l2-c14
            part: opposite
            type: multiple_choice
            text: "Two straight lines cross. One angle is 58°. What is the angle next to it?"
            options: ["122°", "58°", "302°"]
            answer: "122°"
          - id: l2-c15
            part: opposite
            type: true_false
            text: "Is it true? Two straight lines cross. One angle is 70°, so the angle opposite it is 110°."
            say: "Two straight lines cross. One angle is seventy degrees, so the angle opposite it is one hundred and ten degrees. Is it true?"
            answer: false
          - id: l2-c16
            part: opposite
            type: multiple_choice
            text: "Two straight lines cross and make the angles a, b, c and d, going round. a = 140°. How big is c?"
            say: "Two straight lines cross and make the angles a, b, c and d, going round. Angle a is one hundred and forty degrees. How big is angle c?"
            options: ["140°", "40°", "220°"]
            answer: "140°"
          - id: l2-c17
            part: polygons
            type: multiple_choice
            text: "The angles of a regular nonagon (9 sides) add up to 1260°. How big is each angle?"
            options: ["140°", "126°", "160°"]
            answer: "140°"
          - id: l2-c18
            part: polygons
            type: text_input
            text: "What do the angles of a heptagon (7 sides) add up to? _°"
            say: "What do the angles of a heptagon, a shape with seven sides, add up to, in degrees?"
            answer: "900"
          - id: l2-c19
            part: polygons
            type: true_false
            text: "Is it true? Each angle of a regular octagon is bigger than each angle of a regular hexagon."
            answer: true
          - id: l2-c20
            part: polygons
            type: text_input
            text: "The angles of a regular polygon add up to 1800°. Each angle is 150°. How many sides does it have?"
            say: "The angles of a regular polygon add up to one thousand eight hundred degrees. Each angle is one hundred and fifty degrees. How many sides does it have?"
            answer: "12"
