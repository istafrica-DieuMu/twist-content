# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.check-plausible
skill: math.word-problems.check-plausible
curriculum: en-GB
language: en
title:
  de: Kann das stimmen?
  en: Does the answer make sense?
summary: >
  Lesson 1 asks whether an answer fits the problem: is the size possible,
  is the unit right, does a remainder mean rounding up (one more coach) or
  rounding down (not enough money for another book), and is the change
  less than the money paid? Lesson 2 finds the mistake in a wrong
  solution (a zero too many, the wrong operation, the decimal point in
  the wrong place), puts it right, checks with an estimate or the inverse,
  and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.word-problems.multi-step]
  also_practises: [math.mult-div.remainder]
  vocabulary: { en: [answer, check, estimate, inverse, remainder, round up, round down, change, sensible] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: size, what: { de: "prüfen, ob Größe und Einheit eines Ergebnisses stimmen können", en: checking whether the size and unit of an answer are possible } }
    - { id: remainder, what: { de: den Rest in der Sachsituation deuten, en: deciding what a remainder means in the story } }
    - { id: fix, what: { de: den Fehler in einer Lösung finden und sie verbessern, en: finding the mistake in a solution and putting it right } }
    - { id: check, what: { de: eine Lösung mit Überschlag oder Umkehraufgabe prüfen, en: checking a solution with an estimate or the inverse } }
  misconceptions:
    - id: result-not-checked
      what: Accepts any answer the calculation gives, even a classroom 900 m long or change worth more than the money paid
      addressed: lesson 1 Learn compares answers with what the child knows of the world; l1-f1, l1-f4, l1-s1, l1-n2, l1-c1, l1-c3 and l2-c1 ask which size or amount makes sense; lesson 2 Learn checks with an estimate, with feedback in l2-f1
    - id: remainder-wrong-way
      what: Gives the quotient or the remainder form when the problem needs rounding up (130 pupils, 50 per coach, 2 coaches) or rounds up when it needs rounding down
      addressed: lesson 1 Learn shows rounding up for coaches and rounding down for books; l1-f2 and l1-f3 have feedback, l1-s2, l1-s3, l1-n1, l1-n4, l1-c2, l2-w1, l2-n5, l2-c2 and l2-c5 ask again
    - id: wrong-step-kept
      what: Sees an answer is wrong but cannot find the step (a zero too many, the wrong operation, the decimal point)
      addressed: lesson 2 Learn names the usual mistakes; l2-f1, l2-f3, l2-f4, l2-s1, l2-s3, l2-s5, l2-n1, l2-n2 and l2-c3 find and fix one
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Passt das Ergebnis?", en: "Does it fit?" }
    goal:
      de: "Prüf, ob dein Ergebnis zur Aufgabe passt, zum Beispiel ob ein Rest bedeutet, dass ihr noch einen Bus mehr braucht."
      en: "Check that your answer fits the problem, like whether a remainder means you need one more coach."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Leo buys 3 comics at £2 each and a drink for £1. How much does he spend? £_"
            say: "Leo buys three comics at two pounds each and a drink for one pound. How much does he spend, in pounds?"
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "28 pupils and 2 teachers go on a trip. Each seat on the coach costs £3. How much do the seats cost altogether?"
            options: ["£90", "£84", "£33"]
            answer: "£90"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A teacher is 168 m tall?"
            say: "Ben works out a teacher's height and gets one hundred and sixty-eight metres. That is taller than a block of flats. Ask yourself: can that be true? A teacher is about one hundred and seventy centimetres tall, so the unit must be centimetres."
          - text: "150 pupils, 40 seats on a coach\n150 ÷ 40 = 3 r 30\n4 coaches"
            say: "Three coaches carry one hundred and twenty pupils. Thirty pupils are still waiting, so you need four coaches. Here the remainder means rounding up."
          - text: "£20, books at £6 each\n20 ÷ 6 = 3 r 2\n3 books"
            say: "With twenty pounds you can buy three books. Two pounds are left over, which is not enough for another book. Here the remainder means rounding down."
          - text: "Pay £10, change £12.40?"
            say: "Change is always less than the money you pay. If your change comes out bigger, look at your calculation again."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Amira works out the length of her classroom. Which answer makes sense?"
                options: ["9 m", "9 cm", "900 m"]
                answer: "9 m"
                hints:
                  - "Think of something you know: a door is about 2 m tall."
                  - "9 cm is shorter than a pencil, and 900 m is longer than a football pitch."
                  - "A classroom is about 9 m long."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "130 pupils go on a trip. A coach holds 50. How many coaches are needed?"
                options: ["3", "2", "2 r 30"]
                answer: "3"
                feedback:
                  "2": "Two coaches carry only 100 pupils. 30 pupils would be left behind."
                  "2 r 30": "You cannot book part of a coach. The 30 pupils left over need one more coach."
                hints:
                  - "130 ÷ 50. Is there a remainder?"
                  - "2 coaches carry 100 pupils, so 30 are left over."
                  - "The 30 need a coach too: 3 coaches."
              - id: l1-f3
                type: multiple_choice
                text: "Jake has £25. Cinema tickets cost £7 each. How many tickets can he buy?"
                options: ["3", "4", "3 r 4"]
                answer: "3"
                feedback:
                  "4": "4 tickets cost £28, and Jake only has £25."
                hints:
                  - "25 ÷ 7. What does the remainder mean here?"
                  - "3 tickets cost £21. £4 is left, and that is not enough for another ticket."
                  - "Round down: 3 tickets."
              - id: l1-f4
                type: true_false
                text: "Is it true? Zara pays for a £1.20 drink with a £5 note. Her change is £6.20."
                answer: false
                hints:
                  - "Can the change be more than the money she paid?"
                  - "Change is the £5 take away the price, so it is less than £5."
                  - "No. Her change is £5 − £1.20 = £3.80."
              - id: l1-f5
                type: multiple_choice
                text: "Olivia shares 50 marbles equally between 4 friends and keeps the rest. How many marbles does each friend get?"
                options: ["12", "13", "12.5"]
                answer: "12"
                feedback:
                  "12.5": "A marble cannot be cut in half. Each friend gets whole marbles."
                hints:
                  - "50 ÷ 4. Only whole marbles can be shared."
                  - "4 × 12 = 48, so 2 marbles are left for Olivia."
                  - "Each friend gets 12."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ravi works out the mass of his cat. Which answer makes sense?"
                options: ["4 kg", "4 g", "400 kg"]
                answer: "4 kg"
                hints: ["A bag of sugar is 1 kg. Is a cat a few bags, or much more?"]
              - id: l1-s2
                type: multiple_choice
                text: "75 children go rowing. A boat holds 4. How many boats do they need?"
                options: ["19", "18", "18 r 3"]
                answer: "19"
                hints: ["18 boats carry 72 children. What about the other 3?"]
              - id: l1-s3
                type: multiple_choice
                text: "A plank is 2 m long. How many 30 cm shelves can be cut from it?"
                options: ["6", "7", "60"]
                answer: "6"
                hints: ["2 m is 200 cm. 6 shelves use 180 cm. Is 20 cm enough for another?"]
              - id: l1-s4
                type: true_false
                text: "Is it true? Mo pays £50 for a coat that costs £34.99. His change is £15.01."
                answer: true
                hints: ["£34.99 + £15.01 should make £50."]
              - id: l1-s5
                type: multiple_choice
                text: "A train leaves at 10:50 am. The journey takes 2 hours 15 minutes. Which arrival time makes sense?"
                options: ["1:05 pm", "12:05 pm", "8:35 am"]
                answer: "1:05 pm"
                hints: ["It must arrive after 10:50 am, a little more than 2 hours later."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "245 pupils each need 2 pencils. Pencils come in boxes of 100. How many boxes does the school need?"
                options: ["5", "4", "4.9"]
                answer: "5"
              - id: l1-n2
                type: multiple_choice
                text: "Which answer makes sense for the mass of an apple?"
                options: ["150 g", "150 kg", "1.5 g"]
                answer: "150 g"
              - id: l1-n3
                type: true_false
                text: "Is it true? 30 children each bring 2 litres of water. That is 6 litres altogether."
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Lily has £12. Books cost £5 each. How many books can she buy?"
                options: ["2", "3", "2.4"]
                answer: "2"
              - id: l1-n5
                type: multiple_choice
                text: "Freddie saves £4.50 a week. He works out that in 8 weeks he saves £360. What went wrong?"
                options: ["The decimal point: it is £36.", "He should have added 8.", "Nothing: £360 is right."]
                answer: "The decimal point: it is £36."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Grace measures her pencil. Which answer makes sense?"
            options: ["15 cm", "15 m", "15 mm"]
            answer: "15 cm"
          - id: l1-c2
            type: multiple_choice
            text: "58 people take minibuses. A minibus holds 12. How many minibuses are needed?"
            options: ["5", "4", "4 r 10"]
            answer: "5"
          - id: l1-c3
            type: true_false
            text: "Is it true? Tom pays £20 for a game that costs £13.50. His change is £33.50."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Which answer makes sense for the time it takes to brush your teeth?"
            options: ["2 minutes", "2 hours", "2 seconds"]
            answer: "2 minutes"
          - id: l1-c5
            type: multiple_choice
            text: "A ribbon is 3 m long. How many 40 cm pieces can be cut from it?"
            options: ["7", "8", "7.5"]
            answer: "7"
          - id: l1-c6
            type: true_false
            text: "95 pupils go on a trip. A coach holds 32. Mr Lee books 2 coaches. Is it true that 2 coaches are enough?"
            answer: false

  - n: 2
    title: { de: "Fehler finden und verbessern", en: "Find and fix the mistake" }
    goal:
      de: "Finde den Fehler in einer falschen Lösung, zum Beispiel eine Null zu viel, und prüf deine Verbesserung mit einem Überschlag."
      en: "Find the mistake in a wrong answer, like a zero too many, then fix it and check with an estimate."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "92 pupils go to the museum. A coach holds 30. How many coaches are needed?"
            options: ["4", "3", "3 r 2"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which answer makes sense for the height of a giraffe?"
            options: ["5 m", "5 cm", "50 m"]
            answer: "5 m"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ali: 5 tickets at £48 cost £2400.\nEstimate: £50 × 5 = £250"
            say: "Ali works out five tickets at forty-eight pounds and gets two thousand four hundred pounds. Estimate: fifty pounds times five is two hundred and fifty pounds. His answer is ten times too big, because he wrote a zero too many. Five times forty-eight pounds is two hundred and forty pounds."
          - text: "Holly: 345 + 268 = 513\nCheck: 513 − 268 = 245"
            say: "Holly checks with the inverse. Five hundred and thirteen subtract two hundred and sixty-eight is two hundred and forty-five, not three hundred and forty-five. So her sum is wrong. Three hundred and forty-five add two hundred and sixty-eight is six hundred and thirteen."
          - text: "A cake needs 250 g of flour. 4 cakes?\nJosh: 250 + 4 = 254 g\nRight: 250 × 4 = 1000 g"
            say: "Josh used the wrong operation. Four cakes need four times as much flour: two hundred and fifty times four is one thousand grams, which is one kilogram."
          - text: "Estimate. Use the inverse. Does it make sense?"
            say: "When an answer does not fit, look for the step that went wrong: a wrong operation, a zero too many, the decimal point in the wrong place, or a remainder. Then put it right and check again."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Noah says 6 tickets at £19 each cost £1140. What went wrong?"
                options: ["A zero too many: it is £114.", "He should have divided.", "Nothing: it is right."]
                answer: "A zero too many: it is £114."
                feedback:
                  "Nothing: it is right.": "Estimate: £20 × 6 is £120. £1140 is far too much."
                hints:
                  - "Estimate: round £19 to £20."
                  - "£20 × 6 = £120, so the answer should be a bit less than £120."
                  - "£19 × 6 = £114. Noah wrote a zero too many."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Ruby says 702 − 358 = 444. Check with the inverse, then put it right."
                frame: "444 + 358 = _, so 702 − 358 = _"
                options: ["802", "344", "444", "702"]
                answer: ["802", "344"]
                hints:
                  - "The inverse of subtract is add."
                  - "444 + 358 is 802, not 702. Ruby's answer is 100 too big."
                  - "802, and 702 − 358 = 344."
              - id: l2-f3
                type: multiple_choice
                text: "300 g of rice feeds 4 people. Ella works out the rice for 8 people: 300 + 4 = 304 g. What is right?"
                options: ["600 g", "304 g", "2400 g"]
                answer: "600 g"
                feedback:
                  "2400 g": "That is 300 × 8. 8 people are twice as many as 4, so they need twice the rice."
                hints:
                  - "Adding 4 grams cannot feed 4 more people."
                  - "8 people are twice as many as 4 people."
                  - "300 g × 2 = 600 g."
              - id: l2-f4
                type: multiple_choice
                text: "Is there a mistake? 3.6 kg × 5 = 180 kg"
                options: ["Yes, it is 18 kg.", "Yes, it is 8.6 kg.", "No, it is right."]
                answer: "Yes, it is 18 kg."
                hints:
                  - "Estimate: 3.6 kg is about 4 kg."
                  - "4 kg × 5 = 20 kg, so 180 kg is far too much."
                  - "36 × 5 = 180, so 3.6 × 5 = 18. It is 18 kg."
              - id: l2-f5
                type: text_input
                text: "96 children sit at tables of 8. Isla says they need 13 tables. Check: how many tables are really needed?"
                answer: "12"
                hints:
                  - "Check with the inverse: 13 × 8."
                  - "13 × 8 = 104, which is more than 96."
                  - "12 × 8 = 96, so 12 tables."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Is there a mistake? 7 bags of flour at 450 g each weigh 31,500 g."
                options: ["Yes, it is 3150 g.", "Yes, it is 457 g.", "No, it is right."]
                answer: "Yes, it is 3150 g."
                hints: ["Estimate: 7 × 500 g = 3500 g."]
              - id: l2-s2
                type: fill_in_blank
                text: "Sophie says 615 − 287 = 328. Check with the inverse."
                frame: "328 + 287 = _"
                options: ["615", "605", "515"]
                answer: ["615"]
                hints: ["Add the hundreds, the tens and the ones. Is it 615 again?"]
              - id: l2-s3
                type: multiple_choice
                text: "Max buys 4 drinks at 85p each. He says he pays £34. What is right?"
                options: ["£3.40", "£34.00", "£0.34"]
                answer: "£3.40"
                hints: ["85p × 4 = 340p. How many pounds is that?"]
              - id: l2-s4
                type: true_false
                text: "Is it true? Priya works out 52 × 19 = 988. Her estimate, 50 × 20 = 1000, shows it could be right."
                answer: true
                hints: ["Is 988 close to 1000?"]
              - id: l2-s5
                type: multiple_choice
                text: "A pool is 25 m long. Leo swims 16 lengths and says he swam 41 m. What is right?"
                options: ["400 m", "41 m", "4000 m"]
                answer: "400 m"
                hints: ["16 lengths of 25 m: 16 × 25, not 16 + 25."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Is there a mistake? 9 boxes of 24 cans hold 2016 cans."
                options: ["Yes, it is 216 cans.", "Yes, it is 33 cans.", "No, it is right."]
                answer: "Yes, it is 216 cans."
              - id: l2-n2
                type: text_input
                text: "Jess shares £84 equally between 4 children and says each gets £24. Put it right: each child gets £_"
                say: "Jess shares eighty-four pounds equally between four children and says each gets twenty-four pounds. Put it right. How many pounds does each child get?"
                answer: "21"
              - id: l2-n3
                type: multiple_choice
                text: "A film starts at 6:45 pm and lasts 1 hour 50 minutes. Dan says it ends at 7:35 pm. When does it really end?"
                options: ["8:35 pm", "7:35 pm", "9:35 pm"]
                answer: "8:35 pm"
              - id: l2-n4
                type: true_false
                text: "Is it true? 1500 ÷ 6 = 250, because 250 × 6 = 1500."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "64 pupils go canoeing. A canoe holds 3. Mrs Shah books 21 canoes. Is that enough?"
                options: ["No, 22 are needed.", "Yes, 21 is enough.", "No, 64 are needed."]
                answer: "No, 22 are needed."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: size
            type: multiple_choice
            text: "Which answer makes sense for the mass of a school bag?"
            options: ["3 kg", "3 g", "300 kg"]
            answer: "3 kg"
          - id: l2-c2
            part: remainder
            type: multiple_choice
            text: "110 people come to a party. A table seats 8. How many tables are needed?"
            options: ["14", "13", "13 r 6"]
            answer: "14"
          - id: l2-c3
            part: fix
            type: multiple_choice
            text: "Is there a mistake? 8 tickets at £15 each cost £1200."
            options: ["Yes, it is £120.", "Yes, it is £23.", "No, it is right."]
            answer: "Yes, it is £120."
          - id: l2-c4
            part: check
            type: fill_in_blank
            text: "Zac says 843 − 476 = 367. Check with the inverse."
            frame: "367 + 476 = _"
            options: ["843", "833", "743"]
            answer: ["843"]
          - id: l2-c5
            part: remainder
            type: multiple_choice
            text: "Ivy has £30. T-shirts cost £8 each. How many can she buy?"
            options: ["3", "4", "3.75"]
            answer: "3"
          - id: l2-c6
            part: size
            type: multiple_choice
            text: "Which answer makes sense for the capacity of a mug?"
            options: ["300 ml", "300 l", "3 ml"]
            answer: "300 ml"
          - id: l2-c7
            part: size
            type: true_false
            text: "Kai works out that his walk to school takes 15 hours. Does that answer make sense?"
            answer: false
          - id: l2-c8
            part: size
            type: multiple_choice
            text: "A school buys 6 footballs. Which total cost makes sense?"
            options: ["£48", "£4.80", "£4800"]
            answer: "£48"
          - id: l2-c9
            part: size
            type: true_false
            text: "A recipe for 4 people uses 2 eggs. Mum works out that she needs 16 eggs for 8 people. Does that answer make sense?"
            answer: false
          - id: l2-c10
            part: remainder
            type: text_input
            text: "A minibus holds 16 people. 70 fans travel to a match. How many minibuses are needed?"
            answer: "5"
          - id: l2-c11
            part: remainder
            type: multiple_choice
            text: "Tia has £40. Swimming lessons cost £9 each. How many lessons can she pay for?"
            options: ["4", "5", "4 r 4"]
            answer: "4"
          - id: l2-c12
            part: remainder
            type: multiple_choice
            text: "Eggs are packed in boxes of 6. A farmer has 100 eggs. How many boxes can he fill?"
            options: ["16", "17", "16 r 4"]
            answer: "16"
          - id: l2-c13
            part: fix
            type: text_input
            text: "Lewis says 7 bikes at £120 each cost £8400. Put it right: the bikes cost £_"
            say: "Lewis says seven bikes at one hundred and twenty pounds each cost eight thousand four hundred pounds. Put it right. How many pounds do the bikes cost?"
            answer: "840"
          - id: l2-c14
            part: fix
            type: multiple_choice
            text: "A bottle holds 1.5 litres. Abi says 4 bottles hold 60 litres. What is right?"
            options: ["6 litres", "5.5 litres", "60 litres"]
            answer: "6 litres"
          - id: l2-c15
            part: fix
            type: multiple_choice
            text: "Omar has 3 packs of 12 stickers. He works out 12 + 3 = 15 stickers. What went wrong?"
            options: ["He should have multiplied: 36 stickers.", "He should have divided: 4 stickers.", "Nothing: 15 is right."]
            answer: "He should have multiplied: 36 stickers."
          - id: l2-c16
            part: fix
            type: true_false
            text: "Leah works out 4.5 m × 3 = 13.5 m. Is her answer right?"
            answer: true
          - id: l2-c17
            part: check
            type: fill_in_blank
            text: "Finn says 924 ÷ 4 = 231. Check with the inverse."
            frame: "231 × 4 = _"
            options: ["924", "824", "934"]
            answer: ["924"]
          - id: l2-c18
            part: check
            type: multiple_choice
            text: "Hugo works out 38 × 21 = 7980. Which estimate shows that he made a mistake?"
            options: ["40 × 20 = 800", "40 + 20 = 60", "38 × 2 = 76"]
            answer: "40 × 20 = 800"
          - id: l2-c19
            part: check
            type: true_false
            text: "Ella works out 612 − 395 = 317. She checks with the inverse: 317 + 395 = 712. Is it true that her answer is wrong?"
            answer: true
          - id: l2-c20
            part: check
            type: multiple_choice
            text: "Which check shows that 156 ÷ 12 = 13 is right?"
            options: ["13 × 12 = 156", "156 + 12 = 168", "156 − 13 = 143"]
            answer: "13 × 12 = 156"
