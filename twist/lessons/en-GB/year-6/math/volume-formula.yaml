# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.volume-formula
skill: math.area-volume.volume-formula
curriculum: en-GB
language: en
title:
  de: Rauminhalt von Quadern berechnen
  en: Volume of cubes and cuboids
summary: >
  The volume of a cuboid as length × width × height. Lesson 1 counts the
  cubes in one layer, then multiplies by the number of layers, and turns
  that into the formula. Lesson 2 works in cm³ and m³, chooses the right
  unit, estimates, compares cuboids that look different, finds a missing
  length, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Rauminhalt, en: Volume }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.area-volume.volume-cubes, math.area-volume.area-rectangles]
  also_practises: [math.area-volume.area-rectangles]
  vocabulary: { en: [volume, cubic centimetre, cm³, cubic metre, m³, cuboid, cube, length, width, height, layer] }
  forms: [drawn, text, audio]
  drawn: [cubes]
  facets: []
  misconceptions:
    - id: adds-dimensions
      what: Adds the three lengths instead of multiplying them
      addressed: lesson 1 Learn builds the volume layer by layer; l1-f2 has feedback for the sum, l1-s3, l1-n2 and l2-c2 offer it
    - id: area-only
      what: Multiplies only two lengths and gives the area of one face
      addressed: l1-f3 has feedback for one layer; l1-s1, l1-c1 and l2-c1 offer the one-layer count
    - id: cube-side-times-3
      what: Works out a cube's volume as side × 3
      addressed: l1-f5 has feedback; l1-n5, l2-w2 and l2-c4 offer side × 3
    - id: wrong-unit
      what: Gives a volume in cm or cm² instead of cm³, or picks cm³ for a room
      addressed: lesson 2 Learn and l2-f1, l2-s1, l2-n1 choose the unit
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Länge mal Breite mal Höhe, en: Length × width × height }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many cubes are in this building?"
            show: { drawn: cubes, plan: [[1, 2], [2, 2]], mode: building, colour: blue }
            options: ["7", "4", "8"]
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "A rectangle is 5 cm long and 3 cm wide. What is its area, in cm²?"
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "One layer: 3 × 2 = 6 cubes"
            say: "This cuboid is made of centimetre cubes. Look at the bottom layer. It is three cubes long and two cubes wide, so it has three times two, six cubes."
            show: { drawn: cubes, plan: [[1, 1, 1], [1, 1, 1]], mode: building, colour: blue }
          - text: "4 layers: 6 × 4 = 24 cubes"
            say: "Now there are four layers of six cubes. Six times four is twenty-four cubes. Each cube is one cubic centimetre, so the volume is twenty-four cubic centimetres."
            show: { drawn: cubes, plan: [[4, 4, 4], [4, 4, 4]], mode: building, colour: blue }
          - text: "Volume = length × width × height"
            say: "So you do not need to count every cube. Multiply the length, the width and the height. Three times two times four is twenty-four."
          - text: "A cube with sides of 5 cm: 5 × 5 × 5 = 125 cm³"
            say: "A cube has the same length, width and height. A cube with sides of five centimetres has a volume of five times five times five: one hundred and twenty-five cubic centimetres. It is not five times three."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "The cuboid is made of 1 cm cubes. What is its volume?"
                show: { drawn: cubes, plan: [[2, 2], [2, 2]], mode: building, colour: blue }
                options: ["8 cm³", "4 cm³", "6 cm³"]
                answer: "8 cm³"
                hints:
                  - "Count the cubes in one layer, then count the layers."
                  - "One layer is 2 × 2 = 4 cubes. There are 2 layers."
                  - "4 × 2 = 8 cm³."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A cuboid is 5 cm long, 2 cm wide and 4 cm tall. What is its volume?"
                options: ["40 cm³", "11 cm³", "10 cm³"]
                answer: "40 cm³"
                feedback:
                  "11 cm³": "That adds the three lengths. Volume is length × width × height."
                  "10 cm³": "That is only the bottom layer. There are 4 layers."
                hints:
                  - "Multiply length × width × height."
                  - "5 × 2 = 10 cubes in one layer, and 4 layers."
                  - "10 × 4 = 40 cm³."
              - id: l1-f3
                type: multiple_choice
                text: "A cuboid is 4 cm long, 3 cm wide and 5 cm tall. What is its volume?"
                options: ["60 cm³", "12 cm³", "20 cm³"]
                answer: "60 cm³"
                feedback:
                  "12 cm³": "That is only the bottom layer. There are 5 layers."
                hints:
                  - "How many cubes in one layer? How many layers?"
                  - "4 × 3 = 12 in one layer, and 5 layers."
                  - "12 × 5 = 60 cm³."
              - id: l1-f4
                type: fill_in_blank
                text: "A cuboid is 6 cm long, 2 cm wide and 4 cm tall."
                frame: "6 × 2 = _, then _ × 4 = _ cm³"
                options: ["8", "12", "24", "48"]
                answer: ["12", "12", "48"]
                hints:
                  - "Find one layer first."
                  - "6 × 2 = 12 cubes in a layer. Then multiply by 4 layers."
                  - "12, 12 and 48."
              - id: l1-f5
                type: multiple_choice
                text: "A cube has sides of 3 cm. What is its volume?"
                options: ["27 cm³", "9 cm³", "18 cm³"]
                answer: "27 cm³"
                feedback:
                  "9 cm³": "That is 3 × 3, one face. Multiply by 3 again for the height."
                hints:
                  - "A cube has the same length, width and height."
                  - "3 × 3 × 3."
                  - "9 × 3 = 27 cm³."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The cuboid is made of 1 cm cubes. What is its volume?"
                show: { drawn: cubes, plan: [[3, 3, 3], [3, 3, 3]], mode: building, colour: blue }
                options: ["18 cm³", "6 cm³", "9 cm³"]
                answer: "18 cm³"
                hints: ["One layer has 3 × 2 cubes. How many layers?"]
              - id: l1-s2
                type: text_input
                text: "A cuboid is 7 cm long, 3 cm wide and 2 cm tall. What is its volume, in cm³?"
                answer: "42"
                hints: ["7 × 3 × 2."]
              - id: l1-s3
                type: multiple_choice
                text: "A cuboid is 10 cm long, 4 cm wide and 2 cm tall. What is its volume?"
                options: ["80 cm³", "16 cm³", "40 cm³"]
                answer: "80 cm³"
                hints: ["Multiply all three lengths."]
              - id: l1-s4
                type: text_input
                text: "A cube has sides of 4 cm. What is its volume, in cm³?"
                answer: "64"
                hints: ["4 × 4 × 4."]
              - id: l1-s5
                type: true_false
                text: "Is it true? A cuboid 2 cm by 3 cm by 4 cm has a volume of 24 cm³."
                answer: true
                hints: ["2 × 3 = 6, then × 4."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "A cuboid is 8 cm long, 5 cm wide and 3 cm tall. What is its volume, in cm³?"
                answer: "120"
              - id: l1-n2
                type: multiple_choice
                text: "A cuboid is 6 cm long, 6 cm wide and 2 cm tall. What is its volume?"
                options: ["72 cm³", "14 cm³", "36 cm³"]
                answer: "72 cm³"
              - id: l1-n3
                type: text_input
                text: "A cube has sides of 10 cm. What is its volume, in cm³?"
                answer: "1000"
              - id: l1-n4
                type: multiple_choice
                text: "The cuboid is made of 1 cm cubes. What is its volume?"
                show: { drawn: cubes, plan: [[2, 2, 2, 2], [2, 2, 2, 2], [2, 2, 2, 2]], mode: building, colour: blue }
                options: ["24 cm³", "12 cm³", "9 cm³"]
                answer: "24 cm³"
              - id: l1-n5
                type: true_false
                text: "Is it true? A cube with sides of 2 cm has a volume of 6 cm³."
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "A cuboid is 5 cm long, 4 cm wide and 3 cm tall. What is its volume?"
            options: ["60 cm³", "20 cm³", "12 cm³"]
            answer: "60 cm³"
          - id: l1-c2
            type: text_input
            text: "A cube has sides of 6 cm. What is its volume, in cm³?"
            answer: "216"
          - id: l1-c3
            type: text_input
            text: "A cuboid is 9 cm long, 2 cm wide and 5 cm tall. What is its volume, in cm³?"
            answer: "90"

  - n: 2
    title: { de: "cm³ und m³", en: "cm³ and m³" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "A cuboid is 3 cm long, 3 cm wide and 4 cm tall. What is its volume, in cm³?"
            answer: "36"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "A cube has sides of 5 cm. What is its volume?"
            options: ["125 cm³", "15 cm³", "25 cm³"]
            answer: "125 cm³"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 cm³: a sugar cube. 1 m³: a big box you could sit in."
            say: "A cubic centimetre is about the size of a sugar cube. A cubic metre is a cube with sides of one metre, big enough for two children to sit inside. Use cubic centimetres for small things like a box of tissues, and cubic metres for big things like a room or a skip."
          - text: "A room: 5 m × 4 m × 3 m = 60 m³"
            say: "A room is five metres long, four metres wide and three metres high. Its volume is sixty cubic metres. Volume is always in cubed units: cm³ or m³."
          - text: "4 × 3 × 2 = 24 and 6 × 2 × 2 = 24"
            say: "Two cuboids can look different and still have the same volume. One is four by three by two, the other six by two by two. Both have a volume of twenty-four."
          - text: "Volume 60 cm³, length 5 cm, width 3 cm. Height = 60 ÷ 15 = 4 cm"
            say: "To find a missing length, first multiply the two lengths you know. Five times three is fifteen. Then divide the volume by fifteen. Sixty divided by fifteen is four, so the height is four centimetres."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which unit would you use for the volume of a classroom?"
                options: ["m³", "cm³", "m²"]
                answer: "m³"
                feedback:
                  "cm³": "A classroom is very big. Cubic centimetres are for small things."
                  "m²": "m² is for area. Volume needs a cubed unit."
                hints:
                  - "Is a classroom small or very big?"
                  - "Big volumes are measured in cubic metres."
                  - "m³."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "A shed is 3 m long, 2 m wide and 2 m tall. What is its volume, in m³?"
                answer: "12"
                hints:
                  - "Length × width × height."
                  - "3 × 2 = 6, then × 2."
                  - "12 m³."
              - id: l2-f3
                type: multiple_choice
                text: "Which has the bigger volume: a cube with sides of 4 cm, or a cuboid 8 cm by 2 cm by 2 cm?"
                options: ["the cube", "the cuboid", "they are the same"]
                answer: "the cube"
                keep_order: true
                hints:
                  - "Work out both volumes."
                  - "4 × 4 × 4 = 64. 8 × 2 × 2 = 32."
                  - "The cube: 64 cm³ is more than 32 cm³."
              - id: l2-f4
                type: fill_in_blank
                text: "A box has a volume of 48 cm³. It is 4 cm long and 3 cm wide."
                frame: "4 × 3 = _, height = 48 ÷ _ = _ cm"
                options: ["4", "7", "12", "41"]
                answer: ["12", "12", "4"]
                hints:
                  - "Multiply the two lengths you know."
                  - "4 × 3 = 12. Divide the volume by 12."
                  - "48 ÷ 12 = 4 cm."
              - id: l2-f5
                type: multiple_choice
                text: "Estimate. A shoebox is about 30 cm long, 20 cm wide and 10 cm tall. About how big is its volume?"
                options: ["about 6000 cm³", "about 60 cm³", "about 600 m³"]
                answer: "about 6000 cm³"
                feedback:
                  "about 60 cm³": "That adds the lengths. 30 × 20 = 600, then × 10."
                hints:
                  - "Multiply the three lengths."
                  - "30 × 20 = 600."
                  - "600 × 10 = 6000 cm³."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which unit would you use for the volume of a dice?"
                options: ["cm³", "m³", "cm"]
                answer: "cm³"
                hints: ["A dice is small, and volume needs a cubed unit."]
              - id: l2-s2
                type: text_input
                text: "A swimming pool is 10 m long, 5 m wide and 2 m deep. What is its volume, in m³?"
                answer: "100"
                hints: ["10 × 5 × 2."]
              - id: l2-s3
                type: true_false
                text: "Is it true? A cuboid 6 cm by 4 cm by 1 cm has the same volume as a cuboid 3 cm by 2 cm by 4 cm."
                answer: true
                hints: ["Work out both volumes."]
              - id: l2-s4
                type: text_input
                text: "A box has a volume of 70 cm³. It is 7 cm long and 5 cm wide. How tall is it, in cm?"
                answer: "2"
                hints: ["7 × 5 = 35. How many 35s make 70?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which cuboid has the biggest volume?"
                options: ["5 cm by 5 cm by 4 cm", "10 cm by 3 cm by 2 cm", "6 cm by 6 cm by 2 cm"]
                answer: "5 cm by 5 cm by 4 cm"
                hints: ["Work out each volume: 100, 60 and 72."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "A skip is 4 m long, 2 m wide and 1 m deep. What is its volume?"
                options: ["8 m³", "8 cm³", "7 m³"]
                answer: "8 m³"
              - id: l2-n2
                type: text_input
                text: "A tissue box is 20 cm long, 10 cm wide and 8 cm tall. What is its volume, in cm³?"
                answer: "1600"
              - id: l2-n3
                type: text_input
                text: "A fish tank is 50 cm long and 20 cm wide. Its volume is 30,000 cm³. How deep is it, in cm?"
                say: "A fish tank is fifty centimetres long and twenty centimetres wide. Its volume is thirty thousand cubic centimetres. How deep is it, in centimetres?"
                answer: "30"
              - id: l2-n4
                type: text_input
                text: "Small boxes are cubes with sides of 2 cm. How many fit exactly into a box 8 cm by 4 cm by 2 cm?"
                answer: "8"
              - id: l2-n5
                type: multiple_choice
                text: "Leo's box is 6 cm by 5 cm by 4 cm. Amira's box is a cube with sides of 5 cm. Whose box has the bigger volume?"
                options: ["Amira's", "Leo's", "they are the same"]
                answer: "Amira's"
                keep_order: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "The cuboid is made of 1 cm cubes. What is its volume?"
            show: { drawn: cubes, plan: [[3, 3], [3, 3], [3, 3]], mode: building, colour: blue }
            options: ["18 cm³", "6 cm³", "8 cm³"]
            answer: "18 cm³"
          - id: l2-c2
            type: multiple_choice
            text: "A cuboid is 7 cm long, 4 cm wide and 3 cm tall. What is its volume?"
            options: ["84 cm³", "14 cm³", "28 cm³"]
            answer: "84 cm³"
          - id: l2-c3
            type: text_input
            text: "A store room is 4 m long, 3 m wide and 3 m tall. What is its volume, in m³?"
            answer: "36"
          - id: l2-c4
            type: multiple_choice
            text: "A cube has sides of 7 cm. What is its volume?"
            options: ["343 cm³", "21 cm³", "49 cm³"]
            answer: "343 cm³"
          - id: l2-c5
            type: text_input
            text: "A box has a volume of 90 cm³. It is 6 cm long and 5 cm wide. How tall is it, in cm?"
            answer: "3"
