# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.simplify-fractions
skill: math.fractions.simplify
curriculum: en-GB
language: en
title:
  de: Brüche kürzen und vergleichen
  en: Simplifying and comparing fractions
summary: >
  Simplifying fractions with common factors, and comparing fractions with
  common multiples. Lesson 1 divides the numerator and the denominator by
  the same number, best by the highest common factor, until the fraction
  is in its simplest form. Lesson 2 puts fractions over a common
  denominator to compare and order them, including fractions greater
  than 1 and mixed numbers, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Brüche, en: Fractions }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.fractions.mixed-numbers, math.mult-div-larger.multiples-divisors]
  also_practises: [math.fractions.mixed-numbers, math.mult-div-larger.multiples-divisors]
  vocabulary: { en: [simplify, simplest form, numerator, denominator, common factor, highest common factor, common multiple, common denominator, equivalent, improper fraction, mixed number] }
  forms: [drawn, text, audio]
  drawn: [fraction]
  facets: []
  parts:
    - { id: simplify, what: { de: Brüche vollständig kürzen, en: simplifying fractions to their simplest form } }
    - { id: common, what: { de: Brüche gleichnamig machen, en: putting fractions over a common denominator } }
    - { id: compare, what: { de: echte Brüche vergleichen und ordnen, en: comparing and ordering proper fractions } }
    - { id: greater-than-one, what: { de: Brüche größer als 1 und gemischte Zahlen vergleichen, en: comparing fractions greater than 1 and mixed numbers } }
  misconceptions:
    - id: not-simplest
      what: Stops after one step and leaves a fraction that can still be simplified (12/18 as 6/9)
      addressed: lesson 1 Learn simplifies 12/18 in two steps and with the highest common factor; l1-f1 has feedback, l1-s4 and l1-n4 ask whether a fraction is in its simplest form
    - id: one-part-only
      what: Divides only the numerator or only the denominator
      addressed: l1-f4 has feedback; l1-s2 and l1-c1 offer a fraction with one part divided
    - id: bigger-digits-bigger
      what: Thinks 5/8 is bigger than 3/4 because 5 and 8 are bigger numbers
      addressed: lesson 2 Learn compares over a common denominator; l2-f2 has feedback; l2-n1 compares fractions where the bigger digits lose, l2-s1 and l2-c3 fractions where they win
    - id: adds-denominators
      what: Adds the denominators to get a common denominator (1/4 and 1/6 over 10)
      addressed: l2-f3 has feedback for 10; lesson 2 Learn uses a common multiple
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Brüche kürzen, en: Simplifying fractions }
    goal:
      de: "Kürze Brüche, indem du Zähler und Nenner durch dieselbe Zahl teilst, so wie 6 Achtel gleich 3 Viertel."
      en: "Simplify fractions by dividing the top and bottom by the same number, like 6 eighths becomes 3 quarters."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Write 7/5 as a mixed number."
            options: ["1 2/5", "2 1/5", "1 5/7"]
            answer: "1 2/5"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which number is a factor of both 12 and 18?"
            options: ["6", "4", "9"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6/8 of a cake or 3/4 of the same cake: which is more? Guess!"
            say: "Would you rather have six eighths of a cake, or three quarters of the same cake? Which do you think is more? Have a guess."
          - text: "6/8 = 3/4"
            say: "Neither! Six eighths and three quarters cover the same amount of the bar. They are equivalent fractions. Three quarters uses smaller numbers, so it is simpler."
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 6 }
          - text: "6/8: 6 ÷ 2 = 3 and 8 ÷ 2 = 4, so 6/8 = 3/4"
            say: "To simplify a fraction, divide the numerator and the denominator by the same number. Six and eight can both be divided by two. So six eighths is three quarters."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }
          - text: "12/18 → 6/9 → 2/3, or 12/18 ÷ 6 = 2/3"
            say: "Twelve eighteenths. Divide by two to get six ninths. Six and nine can still both be divided by three, so keep going: two thirds. Or divide by six, the highest common factor of twelve and eighteen, and get two thirds in one step."
          - text: "Did you know? People in ancient Babylon counted in 60s. That is why an hour has 60 minutes!\n15 minutes = 15/60 of an hour = 1/4"
            say: "Did you know? Long ago, people in Babylon counted in sixties, and that is why an hour still has sixty minutes. Sixty can be shared in lots of ways. Fifteen minutes is fifteen sixtieths of an hour. Divide the top and the bottom by fifteen: one quarter. That is why we say a quarter past!"
          - text: "5/7 is in its simplest form."
            say: "A fraction is in its simplest form when the only number that divides both the numerator and the denominator is one. Five sevenths cannot be simplified."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Write 4/8 in its simplest form."
                show: { drawn: fraction, kind: bar, parts: 8, shaded: 4 }
                options: ["1/2", "2/4", "1/4"]
                answer: "1/2"
                option_audio: false
                feedback:
                  "2/4": "2/4 is equal to 4/8, but 2 and 4 can still both be divided by 2."
                hints:
                  - "Which number divides both 4 and 8?"
                  - "The highest common factor is 4: 4 ÷ 4 and 8 ÷ 4."
                  - "4/8 = 1/2."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Simplify 12/16 by dividing the numerator and the denominator by 4."
                frame: "12 ÷ 4 = _, 16 ÷ 4 = _, so 12/16 = _"
                options: ["3", "4", "3/4", "4/3"]
                answer: ["3", "4", "3/4"]
                hints:
                  - "Divide both numbers by 4."
                  - "12 ÷ 4 = 3 and 16 ÷ 4 = 4."
                  - "12/16 = 3/4."
              - id: l1-f3
                type: multiple_choice
                text: "What is the highest common factor of 12 and 18?"
                options: ["6", "3", "36"]
                answer: "6"
                hints:
                  - "List the factors of each number."
                  - "12: 1, 2, 3, 4, 6, 12. 18: 1, 2, 3, 6, 9, 18."
                  - "The biggest one in both lists is 6."
              - id: l1-f4
                type: multiple_choice
                text: "Write 15/20 in its simplest form."
                options: ["3/4", "3/20", "5/4"]
                answer: "3/4"
                option_audio: false
                feedback:
                  "3/20": "Only the numerator was divided. Divide the denominator by 5 as well."
                hints:
                  - "15 and 20 are both in the 5 times table."
                  - "15 ÷ 5 = 3 and 20 ÷ 5 = 4."
                  - "15/20 = 3/4."
              - id: l1-f5
                type: true_false
                text: "Is it true? 5/9 is already in its simplest form."
                answer: true
                hints:
                  - "Is there a number other than 1 that divides 5 and 9?"
                  - "The factors of 5 are 1 and 5. 5 does not divide 9."
                  - "Yes, 5/9 cannot be simplified."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Write 6/9 in its simplest form."
                options: ["2/3", "1/3", "6/3"]
                answer: "2/3"
                option_audio: false
                hints: ["Divide 6 and 9 by 3."]
              - id: l1-s2
                type: multiple_choice
                text: "Write 10/25 in its simplest form."
                options: ["2/5", "2/25", "5/2"]
                answer: "2/5"
                option_audio: false
                hints: ["Divide both by 5."]
              - id: l1-s3
                type: multiple_choice
                text: "Write 18/24 in its simplest form."
                options: ["3/4", "9/12", "2/3"]
                answer: "3/4"
                option_audio: false
                hints: ["The highest common factor of 18 and 24 is 6."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 8/12 in its simplest form is 4/6."
                answer: false
                hints: ["Can 4 and 6 still be divided by the same number?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Write 14/21 in its simplest form."
                frame: "14/21 = _/_"
                options: ["2", "3", "7"]
                answer: ["2", "3"]
                hints: ["14 and 21 are both in the 7 times table."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Write 20/30 in its simplest form."
                options: ["2/3", "2/30", "1/3"]
                answer: "2/3"
                option_audio: false
              - id: l1-n2
                type: text_input
                text: "Write 9/27 in its simplest form."
                keyboard: fraction
                answer: "1/3"
              - id: l1-n3
                type: fill_in_blank
                text: "Write 24/36 in its simplest form."
                frame: "24/36 = _/_"
                options: ["2", "3", "4", "6"]
                answer: ["2", "3"]
              - id: l1-n4
                type: multiple_choice
                text: "Which fraction is not in its simplest form?"
                options: ["6/15", "4/9", "7/10"]
                answer: "6/15"
                option_audio: false
              - id: l1-n5
                type: text_input
                text: "Write 16/40 in its simplest form."
                keyboard: fraction
                answer: "2/5"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Write 8/10 in its simplest form."
            options: ["4/5", "4/10", "8/5"]
            answer: "4/5"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "What is the highest common factor of 16 and 24?"
            options: ["8", "4", "48"]
            answer: "8"
          - id: l1-c3
            type: true_false
            text: "Is it true? 21/28 in its simplest form is 3/4."
            answer: true
          - id: l1-c4
            type: text_input
            text: "Write 12/20 in its simplest form."
            keyboard: fraction
            answer: "3/5"
          - id: l1-c5
            type: multiple_choice
            text: "Write 16/24 in its simplest form."
            options: ["2/3", "8/12", "4/6"]
            answer: "2/3"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Is it true? 7/9 can be simplified."
            answer: false

  - n: 2
    title: { de: Gleichnamig machen und vergleichen, en: Common denominators }
    goal:
      de: "Mach Brüche gleichnamig, um sie zu vergleichen, so wie 2 Drittel gleich 8 Zwölftel und 3 Viertel gleich 9 Zwölftel."
      en: "Give fractions a common denominator to compare them, like 2 thirds is 8 twelfths and 3 quarters is 9 twelfths."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Write 12/15 in its simplest form."
            options: ["4/5", "4/15", "2/3"]
            answer: "4/5"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Write 10/12 in its simplest form."
            options: ["5/6", "5/12", "2/3"]
            answer: "5/6"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2/3 of a pizza or 3/4 of the same pizza: which is bigger? Guess!"
            say: "Two thirds of a pizza, or three quarters of the same pizza. Which do you think is bigger? Have a guess."
          - text: "2/3 or 3/4? 2/3 = 8/12 and 3/4 = 9/12, so 3/4 is bigger."
            say: "Thirds and quarters are different sizes, so make them the same. Twelve is a multiple of three and of four. Two thirds is eight twelfths and three quarters is nine twelfths. Nine twelfths is more, so three quarters is bigger."
          - text: "Common denominator: a common multiple of 3 and 4. 3, 6, 9, 12 and 4, 8, 12"
            say: "To find a common denominator, find a number in both times tables. Count in threes and in fours: twelve is the first number in both. Do not add the denominators: three add four is seven, and seven is not a multiple of either."
          - text: "7/4 or 5/3? 21/12 and 20/12, so 7/4 is bigger."
            say: "Fractions greater than one work the same way. Seven quarters is twenty-one twelfths. Five thirds is twenty twelfths. So seven quarters is bigger."
          - text: "1 3/4 or 1 2/3? Both have 1 whole. 3/4 > 2/3, so 1 3/4 is bigger."
            say: "With mixed numbers, look at the whole numbers first. One and three quarters and one and two thirds both have one whole. Then compare the fractions: three quarters is bigger than two thirds, so one and three quarters is bigger."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Write 1/2 and 3/5 with the denominator 10."
                frame: "1/2 = _/10, 3/5 = _/10"
                options: ["2", "3", "5", "6"]
                answer: ["5", "6"]
                hints:
                  - "What do you multiply 2 by to get 10? And 5?"
                  - "1/2: multiply top and bottom by 5. 3/5: multiply top and bottom by 2."
                  - "5/10 and 6/10."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which is bigger, 3/4 or 5/8?"
                options: ["3/4", "5/8", "they are the same"]
                answer: "3/4"
                option_audio: false
                keep_order: true
                feedback:
                  "5/8": "5 and 8 are bigger numbers, but eighths are small. 3/4 = 6/8, which is more than 5/8."
                hints:
                  - "Write both fractions in eighths."
                  - "3/4 = 6/8."
                  - "6/8 is more than 5/8, so 3/4 is bigger."
              - id: l2-f3
                type: multiple_choice
                text: "What is the lowest common denominator of 1/4 and 1/6?"
                options: ["12", "10", "24"]
                answer: "12"
                feedback:
                  "10": "4 + 6 = 10, but 10 is not in the 4 times table. Find a number in both the 4 and the 6 times tables."
                hints:
                  - "Find the first number in both the 4 and the 6 times tables."
                  - "4, 8, 12 and 6, 12."
                  - "12."
              - id: l2-f4
                type: multiple_choice
                text: "Which is bigger, 7/5 or 4/3?"
                options: ["7/5", "4/3", "they are the same"]
                answer: "7/5"
                option_audio: false
                keep_order: true
                hints:
                  - "Use fifteenths for both."
                  - "7/5 = 21/15 and 4/3 = 20/15."
                  - "21/15 is more, so 7/5 is bigger."
              - id: l2-f5
                type: ordering
                text: "Put the fractions in order, smallest first."
                options: ["2/3", "1/2", "5/6"]
                slot_count: 3
                answer: ["1/2", "2/3", "5/6"]
                option_audio: false
                hints:
                  - "Write them all in sixths."
                  - "1/2 = 3/6, 2/3 = 4/6, 5/6."
                  - "1/2, 2/3, 5/6."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which is bigger, 2/5 or 1/3?"
                options: ["2/5", "1/3", "they are the same"]
                answer: "2/5"
                option_audio: false
                keep_order: true
                hints: ["Use fifteenths: 6/15 and 5/15."]
              - id: l2-s2
                type: fill_in_blank
                text: "Write 2/3 and 3/4 with the denominator 12."
                frame: "2/3 = _/12, 3/4 = _/12"
                options: ["6", "8", "9", "10"]
                answer: ["8", "9"]
                hints: ["Multiply 2/3 by 4 on top and bottom, and 3/4 by 3."]
              - id: l2-s3
                type: multiple_choice
                text: "Which is bigger, 1 2/3 or 1 3/5?"
                options: ["1 2/3", "1 3/5", "they are the same"]
                answer: "1 2/3"
                option_audio: false
                keep_order: true
                hints: ["The wholes are the same. Compare 2/3 and 3/5 in fifteenths."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 9/4 is greater than 2 1/2."
                answer: false
                hints: ["9/4 = 2 1/4."]
              - id: l2-s5
                type: ordering
                text: "Put the fractions in order, smallest first."
                options: ["3/4", "5/8", "1/2"]
                slot_count: 3
                answer: ["1/2", "5/8", "3/4"]
                option_audio: false
                hints: ["Write them all in eighths."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is bigger, 5/6 or 7/9?"
                options: ["5/6", "7/9", "they are the same"]
                answer: "5/6"
                option_audio: false
                keep_order: true
              - id: l2-n2
                type: multiple_choice
                text: "Which is greater, 11/4 or 2 2/3?"
                options: ["11/4", "2 2/3", "they are the same"]
                answer: "11/4"
                option_audio: false
                keep_order: true
              - id: l2-n3
                type: ordering
                text: "Put the numbers in order, smallest first."
                options: ["7/3", "2 1/2", "9/4"]
                slot_count: 3
                answer: ["9/4", "7/3", "2 1/2"]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Mia ate 3/8 of a pizza. Leo ate 1/3 of the same size pizza. Who ate more?"
                options: ["Mia", "Leo", "they ate the same"]
                answer: "Mia"
                keep_order: true
              - id: l2-n5
                type: true_false
                text: "Is it true? 4/6 and 6/9 are equal."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: simplify
            type: text_input
            text: "Write 18/30 in its simplest form."
            keyboard: fraction
            answer: "3/5"
          - id: l2-c2
            part: common
            type: fill_in_blank
            text: "Write 4/5 and 2/3 with the denominator 15."
            frame: "4/5 = _/15, 2/3 = _/15"
            options: ["8", "10", "12", "13"]
            answer: ["12", "10"]
          - id: l2-c3
            part: compare
            type: multiple_choice
            text: "Which is bigger, 5/8 or 3/5?"
            options: ["5/8", "3/5", "they are the same"]
            answer: "5/8"
            option_audio: false
            keep_order: true
          - id: l2-c4
            part: greater-than-one
            type: multiple_choice
            text: "Which is greater, 13/5 or 2 1/2?"
            options: ["13/5", "2 1/2", "they are the same"]
            answer: "13/5"
            option_audio: false
            keep_order: true
          - id: l2-c5
            part: greater-than-one
            type: ordering
            text: "Put the numbers in order, smallest first."
            options: ["5/4", "1 1/3", "7/6"]
            slot_count: 3
            answer: ["7/6", "5/4", "1 1/3"]
            option_audio: false
          - id: l2-c6
            part: simplify
            type: multiple_choice
            text: "Write 14/35 in its simplest form."
            options: ["2/5", "2/35", "7/5"]
            answer: "2/5"
            option_audio: false
          - id: l2-c7
            part: simplify
            type: true_false
            text: "Is it true? 30/45 in its simplest form is 6/9."
            answer: false
          - id: l2-c8
            part: simplify
            type: multiple_choice
            text: "What is the highest common factor of 20 and 30?"
            options: ["10", "5", "60"]
            answer: "10"
          - id: l2-c9
            part: simplify
            type: multiple_choice
            text: "Which fraction is in its simplest form?"
            options: ["9/15", "8/14", "7/12"]
            answer: "7/12"
            option_audio: false
          - id: l2-c10
            part: common
            type: multiple_choice
            text: "What is the lowest common denominator of 1/6 and 1/9?"
            options: ["18", "15", "54"]
            answer: "18"
          - id: l2-c11
            part: common
            type: fill_in_blank
            text: "Write 3/4 and 5/6 with the denominator 12."
            frame: "3/4 = _/12, 5/6 = _/12"
            options: ["8", "9", "10", "11"]
            answer: ["9", "10"]
          - id: l2-c12
            part: common
            type: true_false
            text: "Is it true? 2/5 = 6/15"
            answer: true
          - id: l2-c13
            part: common
            type: text_input
            text: "1/3 = _/24"
            say: "One third is how many twenty-fourths?"
            answer: "8"
          - id: l2-c14
            part: compare
            type: multiple_choice
            text: "Which is bigger, 4/7 or 1/2?"
            options: ["4/7", "1/2", "they are the same"]
            answer: "4/7"
            option_audio: false
            keep_order: true
          - id: l2-c15
            part: compare
            type: ordering
            text: "Put the fractions in order, smallest first."
            options: ["3/10", "2/5", "1/4"]
            slot_count: 3
            answer: ["1/4", "3/10", "2/5"]
            option_audio: false
          - id: l2-c16
            part: compare
            type: true_false
            text: "Is it true? 7/10 is bigger than 3/4."
            answer: false
          - id: l2-c17
            part: compare
            type: multiple_choice
            text: "Sam ran 5/6 of a mile. Ella ran 4/5 of a mile. Who ran further?"
            options: ["Sam", "Ella", "they ran the same"]
            answer: "Sam"
            keep_order: true
          - id: l2-c18
            part: greater-than-one
            type: multiple_choice
            text: "Which is greater, 2 3/4 or 2 5/6?"
            options: ["2 3/4", "2 5/6", "they are the same"]
            answer: "2 5/6"
            option_audio: false
            keep_order: true
          - id: l2-c19
            part: greater-than-one
            type: true_false
            text: "Is it true? 10/3 is more than 3 1/4."
            answer: true
          - id: l2-c20
            part: greater-than-one
            type: ordering
            text: "Put the numbers in order, smallest first."
            options: ["11/8", "1 1/2", "5/4"]
            slot_count: 3
            answer: ["5/4", "11/8", "1 1/2"]
            option_audio: false
