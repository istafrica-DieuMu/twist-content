# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.area-triangles
skill: math.area-volume.area-triangles
curriculum: en-GB
language: en
title:
  de: Flächeninhalt von Parallelogramm und Dreieck
  en: Area of parallelograms and triangles
summary: >
  Area formulae for parallelograms and triangles. Lesson 1 cuts a
  triangle off a parallelogram and moves it to make a rectangle, so the
  area is base × perpendicular height. Lesson 2 shows a triangle as half a
  rectangle or half a parallelogram, so its area is half of base ×
  height, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.area-volume.area-rectangles, math.algebra.formulae]
  also_practises: [math.area-volume.area-rectangles]
  vocabulary: { en: [area, square centimetre, cm², parallelogram, triangle, base, perpendicular height, formula] }
  forms: [drawn, text, audio]
  drawn: [grid]
  facets: []
  misconceptions:
    - id: slant-side
      what: Multiplies the base by the sloping side instead of the perpendicular height
      addressed: lesson 1 Learn marks the height at a right angle to the base; l1-f3 has feedback, l1-s3, l1-n2 and l2-c2 give the slanted side as extra data
    - id: forgets-half
      what: Works out base × height for a triangle and forgets to halve
      addressed: lesson 2 Learn shows the triangle as half a rectangle; l2-f1 and l2-f4 have feedback, l2-s2, l2-n1 and l2-c3 offer the unhalved answer
    - id: perimeter-for-area
      what: Adds the sides instead of finding the area
      addressed: l1-f2 has feedback for the sum of the sides; l1-c2 offers it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Parallelogramme, en: Parallelograms }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "A rectangle is 6 cm long and 4 cm wide. What is its area?"
            options: ["24 cm²", "20 cm²", "10 cm²"]
            answer: "24 cm²"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Perimeter of a rectangle = 2 × (a + b). Work it out for a = 5 cm and b = 3 cm. Answer in cm."
            answer: "16"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A parallelogram: base 4, height 3"
            say: "This is a parallelogram. Its base is four squares long. Its height is three squares. The height is measured straight up from the base, at a right angle, not along the sloping side."
            show: { drawn: grid, cols: 8, rows: 5, lines: [[1, 4, 5, 4], [5, 4, 6, 1], [6, 1, 2, 1], [2, 1, 1, 4]] }
          - text: "Cut off the triangle, move it across: a rectangle"
            say: "Cut the triangle off the left end and slide it to the right end. Now it is a rectangle, four squares by three squares. Nothing was added or taken away, so the area is the same."
            show: { drawn: grid, cols: 8, rows: 5, lines: [[2, 4, 6, 4], [6, 4, 6, 1], [6, 1, 2, 1], [2, 1, 2, 4]] }
          - text: "Area = base × perpendicular height"
            say: "So the area of a parallelogram is the base times the perpendicular height. Four times three is twelve square units."
          - text: "Base 8 cm, height 5 cm, sloping side 6 cm. Area = 8 × 5 = 40 cm²"
            say: "Here the sloping side is six centimetres, but we do not need it. The base is eight and the perpendicular height is five, so the area is forty square centimetres."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is the area of the parallelogram, in squares?"
                show: { drawn: grid, cols: 8, rows: 5, lines: [[1, 4, 6, 4], [6, 4, 7, 2], [7, 2, 2, 2], [2, 2, 1, 4]] }
                options: ["10 squares", "12 squares", "7 squares"]
                answer: "10 squares"
                hints:
                  - "Find the base and the height in squares."
                  - "The base is 5 squares. The height is 2 squares."
                  - "5 × 2 = 10 squares."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A parallelogram has a base of 7 cm and a perpendicular height of 4 cm. What is its area?"
                options: ["28 cm²", "11 cm²", "22 cm²"]
                answer: "28 cm²"
                feedback:
                  "11 cm²": "That adds the two lengths. Area is base × height."
                  "22 cm²": "That is 2 × (7 + 4), like a perimeter. Area is base × height."
                hints:
                  - "Use area = base × perpendicular height."
                  - "7 × 4."
                  - "28 cm²."
              - id: l1-f3
                type: multiple_choice
                text: "A parallelogram has a base of 10 cm, a sloping side of 6 cm and a perpendicular height of 5 cm. What is its area?"
                options: ["50 cm²", "60 cm²", "300 cm²"]
                answer: "50 cm²"
                feedback:
                  "60 cm²": "The sloping side is not the height. Use the height at a right angle to the base."
                hints:
                  - "Which length is at a right angle to the base?"
                  - "The perpendicular height is 5 cm. Leave out the sloping side."
                  - "10 × 5 = 50 cm²."
              - id: l1-f4
                type: true_false
                text: "Is it true? A parallelogram and a rectangle with the same base and the same height have the same area."
                answer: true
                hints:
                  - "Think of cutting the triangle off and moving it."
                  - "The parallelogram becomes a rectangle with the same base and height."
                  - "Yes, the area is the same."
              - id: l1-f5
                type: text_input
                text: "A parallelogram has a base of 9 m and a perpendicular height of 6 m. What is its area, in m²?"
                answer: "54"
                hints:
                  - "Base × perpendicular height."
                  - "9 × 6."
                  - "54 m²."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What is the area of the parallelogram, in squares?"
                show: { drawn: grid, cols: 9, rows: 5, lines: [[0, 4, 6, 4], [6, 4, 8, 1], [8, 1, 2, 1], [2, 1, 0, 4]] }
                options: ["18 squares", "24 squares", "9 squares"]
                answer: "18 squares"
                hints: ["The base is 6 squares and the height 3 squares."]
              - id: l1-s2
                type: multiple_choice
                text: "A parallelogram has a base of 12 cm and a perpendicular height of 3 cm. What is its area?"
                options: ["36 cm²", "15 cm²", "30 cm²"]
                answer: "36 cm²"
                hints: ["Base × height."]
              - id: l1-s3
                type: text_input
                text: "A parallelogram has a base of 8 cm, a sloping side of 5 cm and a perpendicular height of 4 cm. What is its area, in cm²?"
                answer: "32"
                hints: ["Use the perpendicular height, not the sloping side."]
              - id: l1-s4
                type: fill_in_blank
                text: "A parallelogram has an area of 42 cm² and a base of 7 cm."
                frame: "7 × _ = 42, so the height is _ cm"
                options: ["5", "6", "35", "49"]
                answer: ["6", "6"]
                hints: ["Which number times 7 is 42?"]
              - id: l1-s5
                type: multiple_choice
                text: "Which parallelogram has the biggest area?"
                options: ["base 6 cm, height 5 cm", "base 8 cm, height 3 cm", "base 4 cm, height 7 cm"]
                answer: "base 6 cm, height 5 cm"
                hints: ["Work out base × height for each one."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "A parallelogram has a base of 11 cm and a perpendicular height of 6 cm. What is its area, in cm²?"
                answer: "66"
              - id: l1-n2
                type: multiple_choice
                text: "A parallelogram has a base of 9 cm, a sloping side of 7 cm and a perpendicular height of 5 cm. What is its area?"
                options: ["45 cm²", "63 cm²", "32 cm²"]
                answer: "45 cm²"
              - id: l1-n3
                type: text_input
                text: "A parallelogram has an area of 56 cm² and a perpendicular height of 7 cm. How long is its base, in cm?"
                answer: "8"
              - id: l1-n4
                type: multiple_choice
                text: "What is the area of the parallelogram, in squares?"
                show: { drawn: grid, cols: 9, rows: 6, lines: [[0, 5, 4, 5], [4, 5, 8, 1], [8, 1, 4, 1], [4, 1, 0, 5]] }
                options: ["16 squares", "20 squares", "8 squares"]
                answer: "16 squares"
              - id: l1-n5
                type: text_input
                text: "A flower bed is a parallelogram with a base of 15 m and a perpendicular height of 4 m. What is its area, in m²?"
                answer: "60"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "A parallelogram has a base of 6 cm and a perpendicular height of 8 cm. What is its area, in cm²?"
            answer: "48"
          - id: l1-c2
            type: multiple_choice
            text: "A parallelogram has a base of 5 cm and a perpendicular height of 9 cm. What is its area?"
            options: ["45 cm²", "14 cm²", "28 cm²"]
            answer: "45 cm²"
          - id: l1-c3
            type: true_false
            text: "Is it true? To find the area of a parallelogram, you multiply the base by the sloping side."
            answer: false

  - n: 2
    title: { de: Dreiecke, en: Triangles }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "A parallelogram has a base of 7 cm and a perpendicular height of 3 cm. What is its area, in cm²?"
            answer: "21"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "A parallelogram has a base of 4 cm, a sloping side of 5 cm and a perpendicular height of 3 cm. Which lengths do you multiply?"
            options: ["4 and 3", "4 and 5", "5 and 3"]
            answer: "4 and 3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A triangle is half a rectangle."
            say: "Draw a line from one corner of a rectangle to the opposite corner. It cuts the rectangle into two equal triangles. So each triangle has half the area of the rectangle."
            show: { drawn: grid, cols: 8, rows: 5, lines: [[1, 4, 7, 4], [7, 4, 7, 1], [7, 1, 1, 1], [1, 1, 1, 4], [7, 1, 1, 4]] }
          - text: "Area of a triangle = 1/2 × base × height"
            show: { drawn: grid, cols: 8, rows: 5, lines: [[1, 4, 7, 4], [7, 4, 7, 1], [7, 1, 1, 4]] }
            say: "The rectangle around this triangle is six squares by three squares, which is eighteen squares. The triangle is half of that: nine squares. So the area of a triangle is half of the base times the perpendicular height."
          - text: "Base 6, height 4: 6 × 4 = 24, half of 24 = 12"
            say: "This works for every triangle, even when the top is not above a corner. Two copies of a triangle make a parallelogram with the same base and height. Base six, height four: six times four is twenty-four, and half of twenty-four is twelve."
            show: { drawn: grid, cols: 8, rows: 5, lines: [[1, 4, 7, 4], [7, 4, 3, 0], [3, 0, 1, 4]] }
          - text: "Do not forget to halve."
            say: "The most common mistake is to multiply the base by the height and stop. For a triangle, always halve at the end."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is the area of the triangle, in squares?"
                show: { drawn: grid, cols: 8, rows: 5, lines: [[1, 4, 5, 4], [5, 4, 1, 0], [1, 0, 1, 4]] }
                options: ["8 squares", "16 squares", "12 squares"]
                answer: "8 squares"
                feedback:
                  "16 squares": "That is the whole square around the triangle. The triangle is half of it."
                hints:
                  - "The triangle is half of a square."
                  - "The square is 4 by 4, which is 16 squares."
                  - "Half of 16 is 8 squares."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "A triangle has a base of 10 cm and a perpendicular height of 6 cm."
                frame: "10 × 6 = _, half of it = _ cm²"
                options: ["16", "30", "60", "120"]
                answer: ["60", "30"]
                hints:
                  - "Multiply the base by the height first."
                  - "10 × 6 = 60. Now halve it."
                  - "60, then 30 cm²."
              - id: l2-f3
                type: multiple_choice
                text: "What is the area of the triangle, in squares?"
                show: { drawn: grid, cols: 8, rows: 5, lines: [[0, 4, 6, 4], [6, 4, 2, 1], [2, 1, 0, 4]] }
                options: ["9 squares", "18 squares", "12 squares"]
                answer: "9 squares"
                hints:
                  - "Find the base and the height. The top does not have to be above a corner."
                  - "The base is 6 squares. The height is 3 squares."
                  - "6 × 3 = 18, and half is 9 squares."
              - id: l2-f4
                type: multiple_choice
                text: "A triangle has a base of 8 cm and a perpendicular height of 5 cm. What is its area?"
                options: ["20 cm²", "40 cm²", "13 cm²"]
                answer: "20 cm²"
                feedback:
                  "40 cm²": "That is base × height. A triangle is half of that."
                hints:
                  - "Area = 1/2 × base × height."
                  - "8 × 5 = 40."
                  - "Half of 40 is 20 cm²."
              - id: l2-f5
                type: text_input
                text: "A triangle has a base of 12 cm and a perpendicular height of 7 cm. What is its area, in cm²?"
                answer: "42"
                hints:
                  - "Multiply, then halve."
                  - "12 × 7 = 84."
                  - "Half of 84 is 42 cm²."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What is the area of the triangle, in squares?"
                show: { drawn: grid, cols: 9, rows: 6, lines: [[0, 5, 8, 5], [8, 5, 5, 0], [5, 0, 0, 5]] }
                options: ["20 squares", "40 squares", "13 squares"]
                answer: "20 squares"
                hints: ["Base 8, height 5. Multiply, then halve."]
              - id: l2-s2
                type: multiple_choice
                text: "A triangle has a base of 9 cm and a perpendicular height of 4 cm. What is its area?"
                options: ["18 cm²", "36 cm²", "13 cm²"]
                answer: "18 cm²"
                hints: ["9 × 4 = 36. Do not forget to halve."]
              - id: l2-s3
                type: text_input
                text: "A triangle has a base of 6 cm, a sloping side of 5 cm and a perpendicular height of 4 cm. What is its area, in cm²?"
                answer: "12"
                hints: ["Use the base and the perpendicular height, then halve."]
              - id: l2-s4
                type: true_false
                text: "Is it true? A triangle with base 10 cm and height 4 cm has the same area as a rectangle 5 cm by 4 cm."
                answer: true
                hints: ["Work out both areas."]
              - id: l2-s5
                type: text_input
                text: "A triangle has an area of 15 cm² and a base of 6 cm. What is its perpendicular height, in cm?"
                answer: "5"
                hints: ["Base × height is double the area: 30. Which number times 6 is 30?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "A triangular sail has a base of 4 m and a height of 7 m. What is its area?"
                options: ["14 m²", "28 m²", "11 m²"]
                answer: "14 m²"
              - id: l2-n2
                type: text_input
                text: "A triangular flag has a base of 30 cm and a height of 20 cm. What is its area, in cm²?"
                answer: "300"
              - id: l2-n3
                type: multiple_choice
                text: "Which has the bigger area: a triangle with base 10 cm and height 8 cm, or a parallelogram with base 6 cm and height 6 cm?"
                options: ["the triangle", "the parallelogram", "they are the same"]
                answer: "the triangle"
                keep_order: true
              - id: l2-n4
                type: text_input
                text: "A garden is a rectangle 8 m by 5 m. A triangular pond inside has a base of 4 m and a height of 3 m. How much of the garden is not pond, in m²?"
                answer: "34"
              - id: l2-n5
                type: text_input
                text: "A triangle on a road sign has a base of 70 cm and a height of 60 cm. What is its area, in cm²?"
                answer: "2100"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What is the area of the triangle, in squares?"
            show: { drawn: grid, cols: 8, rows: 6, lines: [[1, 5, 7, 5], [7, 5, 1, 1], [1, 1, 1, 5]] }
            options: ["12 squares", "24 squares", "10 squares"]
            answer: "12 squares"
          - id: l2-c2
            type: text_input
            text: "A parallelogram has a base of 13 cm, a sloping side of 6 cm and a perpendicular height of 4 cm. What is its area, in cm²?"
            answer: "52"
          - id: l2-c3
            type: multiple_choice
            text: "A triangle has a base of 14 cm and a perpendicular height of 5 cm. What is its area?"
            options: ["35 cm²", "70 cm²", "19 cm²"]
            answer: "35 cm²"
          - id: l2-c4
            type: text_input
            text: "A parallelogram has an area of 72 cm² and a base of 9 cm. What is its perpendicular height, in cm?"
            answer: "8"
          - id: l2-c5
            type: true_false
            text: "Is it true? A triangle with base 6 cm and height 8 cm has an area of 48 cm²."
            answer: false
