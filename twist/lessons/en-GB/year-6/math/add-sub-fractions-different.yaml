# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.add-sub-fractions-different
skill: math.fractions.add-sub-different
curriculum: en-GB
language: en
title:
  de: Brüche mit verschiedenen Nennern addieren und subtrahieren
  en: Adding and subtracting fractions
summary: >
  Adding and subtracting fractions with different denominators and mixed
  numbers. Lesson 1 changes both fractions to a common denominator,
  adds or subtracts the numerators, and simplifies the answer or writes
  it as a mixed number. Lesson 2 adds and subtracts mixed numbers, with
  the wholes and the fractions apart, exchanges a whole when the first
  fraction is too small, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Mit Brüchen rechnen, en: Calculating with fractions }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [math.fractions.simplify, math.fractions.add-sub-related]
  also_practises: [math.fractions.simplify]
  vocabulary: { en: [numerator, denominator, common denominator, equivalent, simplify, mixed number, improper fraction, exchange] }
  forms: [drawn, text, audio]
  drawn: [fraction]
  facets: []
  misconceptions:
    - id: adds-tops-and-bottoms
      what: Adds the numerators and adds the denominators (1/3 + 1/4 = 2/7)
      addressed: lesson 1 Learn says it is not 2/7; l1-f2 has feedback, l1-s1, l1-s4, l1-n1, l1-n3 and l2-c1 offer it
    - id: subtracts-tops-and-bottoms
      what: Subtracts the numerators and the denominators (3/4 − 1/3 = 2/1)
      addressed: l1-f3 has feedback; l1-s2 and l2-c2 offer it
    - id: extra-whole-lost
      what: Leaves the fractions part as an improper fraction or drops the extra whole when the fractions make more than 1
      addressed: lesson 2 Learn turns 5/4 into 1 1/4; l2-f3 has feedback, l2-s3 and l2-n1 offer the dropped whole
    - id: subtracts-smaller-from-larger
      what: In 3 1/4 − 1 1/2 works out 1/2 − 1/4 instead of exchanging a whole
      addressed: lesson 2 Learn exchanges a whole; l2-f5 has feedback, l2-n2 and l2-c5 offer the reversed answer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Gleichnamig machen, en: Using a common denominator }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1/2 + 1/4 = ?"
            options: ["3/4", "2/6", "2/4"]
            answer: "3/4"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Write 4/6 in its simplest form."
            options: ["2/3", "1/2", "4/3"]
            answer: "2/3"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1/3 + 1/4 = 4/12 + 3/12 = 7/12"
            say: "Thirds and quarters are different sizes, so you cannot add them straight away. Find a common denominator: twelve is in the three and the four times tables. One third is four twelfths and one quarter is three twelfths. Four twelfths and three twelfths make seven twelfths."
            show: { drawn: fraction, kind: rect, parts: 12, rows: 3, shaded: 7 }
          - text: "1/3 + 1/4 is not 2/7"
            say: "Never add the denominators. Two sevenths is less than one third on its own, so it cannot be the answer. Only the numerators are added, once the parts are the same size."
          - text: "5/6 − 1/4 = 10/12 − 3/12 = 7/12"
            say: "Subtracting works the same way. Five sixths is ten twelfths. One quarter is three twelfths. Ten twelfths take away three twelfths is seven twelfths."
          - text: "3/4 + 2/3 = 9/12 + 8/12 = 17/12 = 1 5/12"
            say: "Check your answer at the end. Seventeen twelfths is more than one whole, so write it as a mixed number: one and five twelfths. If the answer can be simplified, simplify it."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "1/2 + 1/3 = ?"
                frame: "1/2 + 1/3 = _/6 + _/6 = _/6"
                options: ["2", "3", "5", "6"]
                answer: ["3", "2", "5"]
                hints:
                  - "Write both fractions in sixths."
                  - "1/2 = 3/6 and 1/3 = 2/6."
                  - "3/6 + 2/6 = 5/6."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "2/5 + 1/4 = ?"
                options: ["13/20", "3/9", "3/20"]
                answer: "13/20"
                option_audio: false
                feedback:
                  "3/9": "The numerators and the denominators were both added. Change to twentieths first: 8/20 + 5/20."
                hints:
                  - "Find a common denominator for 5 and 4."
                  - "20 is in both tables. 2/5 = 8/20 and 1/4 = 5/20."
                  - "8/20 + 5/20 = 13/20."
              - id: l1-f3
                type: multiple_choice
                text: "3/4 − 1/3 = ?"
                options: ["5/12", "2/1", "1/2"]
                answer: "5/12"
                option_audio: false
                feedback:
                  "2/1": "The numerators and the denominators were both subtracted. Change to twelfths first: 9/12 − 4/12."
                hints:
                  - "Write both fractions in twelfths."
                  - "3/4 = 9/12 and 1/3 = 4/12."
                  - "9/12 − 4/12 = 5/12."
              - id: l1-f4
                type: multiple_choice
                text: "1/4 + 3/8 = ?"
                options: ["5/8", "4/12", "4/8"]
                answer: "5/8"
                option_audio: false
                hints:
                  - "8 is a multiple of 4, so use eighths."
                  - "1/4 = 2/8."
                  - "2/8 + 3/8 = 5/8."
              - id: l1-f5
                type: multiple_choice
                text: "5/6 + 1/2 = ? Give the answer as a mixed number in its simplest form."
                options: ["1 1/3", "6/8", "1 1/2"]
                answer: "1 1/3"
                option_audio: false
                hints:
                  - "Use sixths: 1/2 = 3/6."
                  - "5/6 + 3/6 = 8/6, which is 1 2/6."
                  - "2/6 simplifies to 1/3, so 1 1/3."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "1/3 + 1/5 = ?"
                options: ["8/15", "2/8", "2/15"]
                answer: "8/15"
                option_audio: false
                hints: ["Use fifteenths: 5/15 + 3/15."]
              - id: l1-s2
                type: multiple_choice
                text: "7/8 − 1/2 = ?"
                options: ["3/8", "6/6", "1/4"]
                answer: "3/8"
                option_audio: false
                hints: ["1/2 = 4/8."]
              - id: l1-s3
                type: fill_in_blank
                text: "2/3 − 1/4 = ?"
                frame: "2/3 − 1/4 = _/12 − _/12 = _/12"
                options: ["3", "5", "8", "11"]
                answer: ["8", "3", "5"]
                hints: ["2/3 = 8/12 and 1/4 = 3/12."]
              - id: l1-s4
                type: true_false
                text: "Is it true? 1/2 + 1/4 = 2/6"
                answer: false
                hints: ["Is 2/6 more or less than 1/2 on its own?"]
              - id: l1-s5
                type: multiple_choice
                text: "3/10 + 1/5 = ? Give the answer in its simplest form."
                options: ["1/2", "4/15", "2/5"]
                answer: "1/2"
                option_audio: false
                hints: ["1/5 = 2/10. Then simplify 5/10."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "1/4 + 1/6 = ?"
                options: ["5/12", "2/10", "1/5"]
                answer: "5/12"
                option_audio: false
              - id: l1-n2
                type: text_input
                text: "4/5 − 1/3 = ?"
                keyboard: fraction
                answer: "7/15"
              - id: l1-n3
                type: multiple_choice
                text: "3/5 + 1/2 = ? Give the answer as a mixed number."
                options: ["1 1/10", "4/7", "1 1/5"]
                answer: "1 1/10"
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Sam drinks 1/2 of a bottle of water in the morning and 1/3 of it in the afternoon. How much of the bottle has he drunk?"
                options: ["5/6", "2/5", "1/6"]
                answer: "5/6"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? 5/8 − 1/4 = 3/8"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "1/2 + 2/5 = ?"
            options: ["9/10", "3/7", "3/10"]
            answer: "9/10"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "5/6 − 1/3 = ? Give the answer in its simplest form."
            options: ["1/2", "4/3", "1/3"]
            answer: "1/2"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? 1/3 + 1/6 = 1/2"
            answer: true

  - n: 2
    title: { de: Gemischte Zahlen, en: Mixed numbers }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "1/4 + 2/3 = ?"
            options: ["11/12", "3/7", "3/12"]
            answer: "11/12"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "3/5 − 1/2 = ?"
            options: ["1/10", "2/3", "1/5"]
            answer: "1/10"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2 1/4 + 1 1/3: 2 + 1 = 3 and 1/4 + 1/3 = 7/12, so 3 7/12"
            say: "Two and a quarter add one and a third. Add the wholes: two add one is three. Then add the fractions: one quarter and one third make seven twelfths. The answer is three and seven twelfths."
          - text: "1 3/4 + 2 1/2: 3/4 + 2/4 = 5/4 = 1 1/4, so 3 + 1 1/4 = 4 1/4"
            say: "One and three quarters add two and a half. The wholes make three. Three quarters and two quarters make five quarters, which is one and a quarter. So there is another whole: four and a quarter."
          - text: "3 1/2 − 1 1/3: 3 − 1 = 2 and 1/2 − 1/3 = 1/6, so 2 1/6"
            say: "Three and a half take away one and a third. Take the wholes: three take away one is two. Take the fractions: three sixths take away two sixths is one sixth. The answer is two and one sixth."
          - text: "3 1/4 − 1 1/2: exchange a whole. 3 1/4 = 2 5/4, and 2 5/4 − 1 2/4 = 1 3/4"
            say: "Three and a quarter take away one and a half. One quarter is less than two quarters, so exchange one whole for four quarters. Three and a quarter is two and five quarters. Two and five quarters take away one and two quarters is one and three quarters. You can also change both into improper fractions: thirteen quarters take away six quarters is seven quarters."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "1 1/2 + 2 1/4 = ?"
                options: ["3 3/4", "3 2/6", "2 3/4"]
                answer: "3 3/4"
                option_audio: false
                hints:
                  - "Add the wholes, then the fractions."
                  - "1 + 2 = 3. 1/2 + 1/4 = 2/4 + 1/4."
                  - "3 and 3/4."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Work out 2 1/3 + 1 1/2."
                frame: "2 + 1 = _, 1/3 + 1/2 = _, so 2 1/3 + 1 1/2 = _"
                options: ["3", "5/6", "2/5", "3 5/6", "3 2/5"]
                answer: ["3", "5/6", "3 5/6"]
                option_audio: false
                hints:
                  - "Wholes first, then fractions in sixths."
                  - "1/3 = 2/6 and 1/2 = 3/6."
                  - "3 and 5/6."
              - id: l2-f3
                type: multiple_choice
                text: "1 3/4 + 1 1/2 = ?"
                options: ["3 1/4", "2 4/6", "2 1/4"]
                answer: "3 1/4"
                option_audio: false
                feedback:
                  "2 1/4": "3/4 + 2/4 = 5/4, which is 1 1/4. That extra whole must be added to the 2 wholes."
                hints:
                  - "The fractions make more than a whole."
                  - "3/4 + 2/4 = 5/4 = 1 1/4. The wholes make 2."
                  - "2 + 1 1/4 = 3 1/4."
              - id: l2-f4
                type: multiple_choice
                text: "4 5/6 − 2 1/3 = ? Give the answer in its simplest form."
                options: ["2 1/2", "2 4/3", "2 1/6"]
                answer: "2 1/2"
                option_audio: false
                hints:
                  - "Wholes first: 4 − 2. Then the fractions in sixths."
                  - "5/6 − 2/6 = 3/6."
                  - "3/6 = 1/2, so 2 1/2."
              - id: l2-f5
                type: multiple_choice
                text: "3 1/3 − 1 1/2 = ?"
                options: ["1 5/6", "2 1/6", "2 5/6"]
                answer: "1 5/6"
                option_audio: false
                feedback:
                  "2 1/6": "That works out 1/2 − 1/3, the wrong way round. 1/3 is less than 1/2, so exchange a whole first."
                hints:
                  - "Use sixths: 3 2/6 − 1 3/6. 2/6 is less than 3/6, so exchange one whole."
                  - "3 2/6 = 2 8/6. Then 2 8/6 − 1 3/6."
                  - "1 5/6."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "2 1/5 + 1 1/2 = ?"
                options: ["3 7/10", "3 2/7", "3 2/10"]
                answer: "3 7/10"
                option_audio: false
                hints: ["1/5 + 1/2 in tenths: 2/10 + 5/10."]
              - id: l2-s2
                type: multiple_choice
                text: "3 2/3 − 1 1/6 = ? Give the answer in its simplest form."
                options: ["2 1/2", "2 1/3", "2 1/6"]
                answer: "2 1/2"
                option_audio: false
                hints: ["2/3 = 4/6. Then 4/6 − 1/6 and simplify."]
              - id: l2-s3
                type: multiple_choice
                text: "2 2/3 + 1 1/2 = ?"
                options: ["4 1/6", "3 3/5", "3 1/6"]
                answer: "4 1/6"
                option_audio: false
                hints: ["2/3 + 1/2 = 7/6, which is more than a whole."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 4 1/3 − 1 2/3 = 2 2/3"
                answer: true
                hints: ["Exchange a whole: 4 1/3 = 3 4/3."]
              - id: l2-s5
                type: multiple_choice
                text: "5 − 1 3/8 = ?"
                options: ["3 5/8", "4 3/8", "4 5/8"]
                answer: "3 5/8"
                option_audio: false
                hints: ["5 = 4 8/8."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "A recipe uses 1 1/2 cups of flour and 3/4 of a cup of sugar. How many cups is that altogether?"
                options: ["2 1/4", "1 4/6", "1 1/4"]
                answer: "2 1/4"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "A ribbon is 3 1/2 m long. Amy cuts off 1 3/4 m. How much is left?"
                options: ["1 3/4 m", "2 1/4 m", "2 3/4 m"]
                answer: "1 3/4 m"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Jo walks 2 1/3 km to the park and then 1 1/4 km to the shop. How far does she walk?"
                options: ["3 7/12 km", "3 2/7 km", "3 1/12 km"]
                answer: "3 7/12 km"
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "A jug holds 2 litres of juice. 1 1/5 litres are poured out. How much is left?"
                options: ["4/5 of a litre", "1 4/5 litres", "1 1/5 litres"]
                answer: "4/5 of a litre"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? 1 1/2 + 1 2/3 = 2 3/5"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "1/3 + 2/5 = ?"
            options: ["11/15", "3/8", "3/15"]
            answer: "11/15"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "7/8 − 1/3 = ?"
            options: ["13/24", "6/5", "1/2"]
            answer: "13/24"
            option_audio: false
          - id: l2-c3
            type: fill_in_blank
            text: "3/4 + 5/6 = ? Give the answer as a mixed number."
            frame: "3/4 + 5/6 = _/12 + _/12 = 1 _/12"
            options: ["7", "8", "9", "10"]
            answer: ["9", "10", "7"]
          - id: l2-c4
            type: multiple_choice
            text: "2 1/6 + 1 3/4 = ?"
            options: ["3 11/12", "3 4/10", "4 1/12"]
            answer: "3 11/12"
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "4 1/5 − 1 1/2 = ?"
            options: ["2 7/10", "3 3/10", "3 7/10"]
            answer: "2 7/10"
            option_audio: false
