# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.written-mult-money
skill: math.written-mult-div.mult-money
curriculum: en-GB
language: en
title:
  de: Geldbeträge malnehmen
  en: Multiplying money
summary: >
  Multiplying amounts in pounds with a decimal point by a whole number.
  Lesson 1 changes the amount into pence, uses short multiplication and
  changes back (£3.45 × 4 = 345p × 4 = 1380p = £13.80); lesson 2
  estimates first to check where the decimal point goes, multiplies by
  numbers up to 12 in shopping problems, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Schriftlich malnehmen, en: Written multiplication }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.written-mult-div.mult-one-digit, math.money.decimal-notation]
  also_practises: [math.written-mult-div.mult-one-digit]
  vocabulary: { en: [pounds, pence, decimal point, short multiplication, estimate, total, change] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: pence, what: { de: Geldbeträge in Cent umrechnen und malnehmen, en: changing amounts to pence and multiplying } }
    - { id: point, what: { de: das Komma im Ergebnis richtig setzen, en: putting the decimal point in the right place } }
    - { id: estimate, what: { de: mit einem Überschlag prüfen, en: checking with an estimate } }
    - { id: shopping, what: { de: Einkaufsaufgaben lösen, en: solving shopping problems } }
  misconceptions:
    - id: point-wrong-place
      what: Puts the decimal point in the wrong place after multiplying (£1.380 or £138.0 for 1380p)
      addressed: lesson 1 Learn says the point goes two places from the right because 100p make £1; l1-f2, l1-s2, l1-n1, l1-n3 and l1-c1 offer the wrongly placed point, with feedback in l1-f2; lesson 2 checks with an estimate in l2-f1, l2-s1 and l2-n4
    - id: pence-forgotten
      what: Multiplies only the pounds and keeps the pence (£3.45 × 2 = £6.45)
      addressed: l1-f4 and l1-f5 (with feedback), l1-s4, l1-n3, l1-c3 and l2-c3 offer the pounds-only answer
    - id: pence-written-alongside
      what: Multiplies pounds and pence separately and writes the pence product next to the pounds (£2.35 × 4 = £8.140)
      addressed: l1-s4 and l1-c3 offer it; lesson 1 Learn multiplies the whole amount in pence
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "In Pence rechnen", en: "Working in pence" }
    goal:
      de: "Rechne Geldbeträge in Pence um, multipliziere schriftlich und rechne zurück, so wie 4 Hefte zu 3 Pfund 45 kosten 13 Pfund 80."
      en: "Change money into pence, multiply in writing, then change back, so 4 notebooks at 3 pounds 45 cost 13 pounds 80."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many pence is £2.50?"
            options: ["250p", "25p", "2500p"]
            answer: "250p"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "274 × 3 = _"
            answer: "822"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "£3.45 × 4"
            say: "A notebook costs three pounds forty-five. How much do four notebooks cost? First change the amount into pence. Three pounds forty-five is three hundred and forty-five pence."
          - text: "345p × 4 = 1380p"
            say: "Now use short multiplication. Five times four is twenty: write the zero and carry the two. Four times four is sixteen, add two is eighteen: write the eight and carry the one. Three times four is twelve, add one is thirteen. That makes one thousand three hundred and eighty pence."
            show: { drawn: written-calc, rows: ["345", "4"], op: "×", carry: "12 ", result: "1380" }
          - text: "1380p = £13.80"
            say: "One hundred pence make one pound, so the decimal point goes two places from the right. One thousand three hundred and eighty pence is thirteen pounds eighty."
          - text: "£3.45 × 4 = £13.80"
            say: "You can also multiply with the decimal point in place. The price has two digits after the point, so the answer has two digits after the point as well."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Work in pence, then change back to pounds."
                frame: "£2.15 × 3 = 215p × 3 = _p = _"
                options: ["645", "£6.45", "£64.50", "£0.645"]
                answer: ["645", "£6.45"]
                hints:
                  - "Multiply 215 by 3 first."
                  - "215 × 3 is 645, so it is 645 pence. 100p make £1."
                  - "645p and £6.45."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Where does the decimal point go? 1750p = ?"
                options: ["£17.50", "£1.750", "£175.0"]
                answer: "£17.50"
                feedback:
                  "£1.750": "100p make £1, so the point goes two places from the right, not three."
                  "£175.0": "The point goes two places from the right, because 100p make £1."
                hints:
                  - "How many pence make one pound?"
                  - "100p make £1, so the last two digits are the pence."
                  - "£17.50."
              - id: l1-f3
                type: text_input
                text: "£1.25 × 6 = _p"
                say: "One pound twenty-five times six. How many pence is that?"
                show: { drawn: written-calc, rows: ["125", "6"], op: "×", carry: "13 ", result: "___" }
                answer: "750"
                hints:
                  - "Change £1.25 into pence first."
                  - "125p × 6. Six lots of 100 and six lots of 25."
                  - "600 + 150 = 750, so 750p."
              - id: l1-f4
                type: true_false
                text: "Is it true? £3.45 × 2 = £6.45"
                answer: false
                hints:
                  - "Were the pence multiplied too?"
                  - "345p × 2 = 690p."
                  - "No. £3.45 × 2 = £6.90."
              - id: l1-f5
                type: multiple_choice
                text: "A loaf costs £1.80. How much do 3 loaves cost?"
                options: ["£5.40", "£3.80", "£54.00"]
                answer: "£5.40"
                feedback:
                  "£3.80": "Only the pounds were multiplied. The 80p must be multiplied by 3 as well."
                hints:
                  - "Work in pence: 180p × 3."
                  - "180 × 3 is 540, so 540p."
                  - "540p is £5.40."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Work in pence, then change back to pounds."
                frame: "£4.20 × 2 = 420p × 2 = _p = _"
                options: ["840", "£8.40", "£84.00", "£0.84"]
                answer: ["840", "£8.40"]
                hints: ["420 × 2, then the point goes two places from the right."]
              - id: l1-s2
                type: multiple_choice
                text: "Where does the decimal point go? 2385p = ?"
                options: ["£23.85", "£2.385", "£238.5"]
                answer: "£23.85"
                hints: ["The last two digits are the pence."]
              - id: l1-s3
                type: text_input
                text: "£1.60 × 5 = _p"
                say: "One pound sixty times five. How many pence is that?"
                answer: "800"
                hints: ["160p × 5. Five lots of 160."]
              - id: l1-s4
                type: multiple_choice
                text: "£2.35 × 4 = ?"
                options: ["£9.40", "£8.35", "£8.140"]
                answer: "£9.40"
                hints: ["Multiply the whole amount in pence: 235p × 4."]
              - id: l1-s5
                type: text_input
                keyboard: decimal
                text: "£1.15 × 7 = £_"
                say: "One pound fifteen times seven. How much is that in pounds?"
                answer: "8.05"
                hints: ["115p × 7 = 805p. Where does the point go?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Where does the decimal point go? 1406p = ?"
                options: ["£14.06", "£1.406", "£140.6"]
                answer: "£14.06"
              - id: l1-n2
                type: text_input
                text: "£3.25 × 3 = _p"
                say: "Three pounds twenty-five times three. How many pence is that?"
                answer: "975"
              - id: l1-n3
                type: multiple_choice
                text: "£4.15 × 6 = ?"
                options: ["£24.90", "£24.15", "£2.490"]
                answer: "£24.90"
              - id: l1-n4
                type: true_false
                text: "Is it true? £2.50 × 4 = £10.00"
                answer: true
              - id: l1-n5
                type: text_input
                keyboard: decimal
                text: "£1.45 × 5 = £_"
                say: "One pound forty-five times five. How much is that in pounds?"
                answer: "7.25"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Where does the decimal point go? 2070p = ?"
            options: ["£20.70", "£2.070", "£207.0"]
            answer: "£20.70"
          - id: l1-c2
            type: text_input
            text: "£2.40 × 3 = _p"
            say: "Two pounds forty times three. How many pence is that?"
            answer: "720"
          - id: l1-c3
            type: multiple_choice
            text: "£1.35 × 4 = ?"
            options: ["£5.40", "£4.35", "£4.140"]
            answer: "£5.40"
          - id: l1-c4
            type: text_input
            text: "£1.55 × 4 = _p"
            say: "One pound fifty-five times four. How many pence is that?"
            answer: "620"
          - id: l1-c5
            type: true_false
            text: "Is it true? 1095p = £10.95"
            say: "One thousand and ninety-five pence is ten pounds ninety-five. Is it true?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "A bottle of juice costs £2.15. How much do 4 bottles cost?"
            options: ["£8.60", "£8.15", "£86.00"]
            answer: "£8.60"

  - n: 2
    title: { de: "Erst überschlagen", en: "Estimate first" }
    goal:
      de: "Überschlag zuerst, damit das Komma an der richtigen Stelle steht, so wie 3 mal 4 Pfund 95 ist etwa 15 Pfund."
      en: "Estimate first so the decimal point lands in the right place, like 3 times 4 pounds 95 is about 15 pounds."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Where does the decimal point go? 1290p = ?"
            options: ["£12.90", "£1.290", "£129.0"]
            answer: "£12.90"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "£1.30 × 4 = _p"
            say: "One pound thirty times four. How many pence is that?"
            answer: "520"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "£4.95 × 3 ≈ £5 × 3 = £15"
            say: "Before you multiply, estimate. Four pounds ninety-five is nearly five pounds. Five pounds times three is fifteen pounds, so the answer is a little less than fifteen pounds."
          - text: "495p × 3 = 1485p = £14.85"
            say: "Now multiply: four hundred and ninety-five times three is one thousand four hundred and eighty-five pence. That is fourteen pounds eighty-five, close to the estimate."
          - text: "£148.50? £1.485? No: about £15."
            say: "If you get one hundred and forty-eight pounds fifty, or one pound and a bit, the estimate shows the decimal point is in the wrong place."
          - text: "£2.35 × 12 = 235p × 12 = 2820p = £28.20"
            say: "You can multiply by twelve the same way. Two hundred and thirty-five times twelve is two thousand eight hundred and twenty pence, which is twenty-eight pounds twenty. Estimate: two pounds times twelve is twenty-four, three pounds times twelve is thirty-six. The answer fits between them."
            show: { drawn: written-calc, rows: ["235", "12"], op: "×", partials: ["470", "2350"], result: "2820" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Estimate first. Which answer fits £3.95 × 4?"
                options: ["£15.80", "£158.00", "£1.58"]
                answer: "£15.80"
                feedback:
                  "£158.00": "Estimate: £4 × 4 is £16. £158 is far too much."
                  "£1.58": "Estimate: £4 × 4 is £16. £1.58 is far too little."
                hints:
                  - "Round £3.95 to the nearest pound."
                  - "£3.95 is nearly £4, and £4 × 4 is £16."
                  - "The answer close to £16 is £15.80."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which estimate helps with £6.10 × 5?"
                options: ["£6 × 5 = £30", "£6 × 10 = £60", "£10 × 5 = £50"]
                answer: "£6 × 5 = £30"
                hints:
                  - "Round only the price, and keep the 5."
                  - "£6.10 is close to £6."
                  - "£6 × 5 = £30."
              - id: l2-f3
                type: text_input
                keyboard: decimal
                text: "A cinema ticket costs £7.45. How much do 3 tickets cost? £_"
                say: "A cinema ticket costs seven pounds forty-five. How much do three tickets cost, in pounds?"
                answer: "22.35"
                hints:
                  - "Estimate: about £7.50 × 3, a bit more than £22."
                  - "745p × 3. 700 × 3 = 2100 and 45 × 3 = 135."
                  - "2235p, which is £22.35."
              - id: l2-f4
                type: true_false
                text: "Is it true? £2.99 × 6 = £17.94"
                answer: true
                hints:
                  - "Estimate: £3 × 6 = £18."
                  - "£2.99 is 1p less than £3, so 6 of them are 6p less than £18."
                  - "Yes. £18 − 6p = £17.94."
              - id: l2-f5
                type: text_input
                keyboard: decimal
                text: "£1.99 × 12 = £_"
                say: "One pound ninety-nine times twelve. How much is that in pounds?"
                answer: "23.88"
                hints:
                  - "Estimate: £2 × 12 = £24."
                  - "£1.99 is 1p less than £2, so 12 of them are 12p less than £24."
                  - "£24 − 12p = £23.88."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Estimate first. Which answer fits £5.85 × 3?"
                options: ["£17.55", "£175.50", "£1.755"]
                answer: "£17.55"
                hints: ["£5.85 is nearly £6, and £6 × 3 is £18."]
              - id: l2-s2
                type: text_input
                keyboard: decimal
                text: "A pen costs £1.65. How much do 3 pens cost? £_"
                say: "A pen costs one pound sixty-five. How much do three pens cost, in pounds?"
                answer: "4.95"
                hints: ["165p × 3."]
              - id: l2-s3
                type: multiple_choice
                text: "A book costs £4.99. Roughly how much do 6 books cost?"
                options: ["about £30", "about £24", "about £300"]
                answer: "about £30"
                hints: ["£4.99 is nearly £5."]
              - id: l2-s4
                type: multiple_choice
                text: "Mia buys 5 drinks at £1.15 each. Which calculation finds the total?"
                options: ["£1.15 × 5", "£1.15 + 5", "£5 ÷ 1.15"]
                answer: "£1.15 × 5"
                hints: ["5 drinks at the same price: 5 lots of £1.15."]
              - id: l2-s5
                type: text_input
                keyboard: decimal
                text: "£3.25 × 11 = £_"
                say: "Three pounds twenty-five times eleven. How much is that in pounds?"
                answer: "35.75"
                hints: ["325p × 11 = 325p × 10 + 325p."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                keyboard: decimal
                text: "A football shirt costs £8.75. A club buys 3. What is the total? £_"
                say: "A football shirt costs eight pounds seventy-five. A club buys three. What is the total, in pounds?"
                answer: "26.25"
              - id: l2-n2
                type: multiple_choice
                text: "Ella buys 6 bags of apples at £1.45 each. She pays with a £10 note. How much change does she get?"
                options: ["£1.30", "£8.70", "£2.30"]
                answer: "£1.30"
              - id: l2-n3
                type: true_false
                text: "Is it true? 7 bus fares at £2.15 each cost £15.05."
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Estimate first. Which answer fits 9 × £2.05?"
                options: ["£18.45", "£184.50", "£18.045"]
                answer: "£18.45"
              - id: l2-n5
                type: text_input
                keyboard: decimal
                text: "Swimming costs £4.35 a session. How much do 7 sessions cost? £_"
                say: "Swimming costs four pounds thirty-five a session. How much do seven sessions cost, in pounds?"
                answer: "30.45"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: point
            type: multiple_choice
            text: "Where does the decimal point go? 3045p = ?"
            options: ["£30.45", "£3.045", "£304.5"]
            answer: "£30.45"
          - id: l2-c2
            part: pence
            type: text_input
            text: "£2.65 × 3 = _p"
            say: "Two pounds sixty-five times three. How many pence is that?"
            answer: "795"
          - id: l2-c3
            part: pence
            type: multiple_choice
            text: "£3.15 × 6 = ?"
            options: ["£18.90", "£18.15", "£1.890"]
            answer: "£18.90"
          - id: l2-c4
            part: estimate
            type: multiple_choice
            text: "Estimate first. Which answer fits £6.95 × 4?"
            options: ["£27.80", "£278.00", "£2.78"]
            answer: "£27.80"
          - id: l2-c5
            part: shopping
            type: text_input
            keyboard: decimal
            text: "A sandwich costs £2.45. How much do 5 sandwiches cost? £_"
            say: "A sandwich costs two pounds forty-five. How much do five sandwiches cost, in pounds?"
            answer: "12.25"
          - id: l2-c6
            part: pence
            type: fill_in_blank
            text: "Work in pence, then change back to pounds."
            frame: "£1.85 × 4 = 185p × 4 = _p = _"
            options: ["740", "£7.40", "£74.00", "£4.85"]
            answer: ["740", "£7.40"]
          - id: l2-c7
            part: pence
            type: true_false
            text: "Is it true? £4.25 × 3 = £12.25"
            say: "Four pounds twenty-five times three is twelve pounds twenty-five. Is it true?"
            answer: false
          - id: l2-c8
            part: pence
            type: text_input
            text: "£2.05 × 8 = _p"
            say: "Two pounds five times eight. How many pence is that?"
            answer: "1640"
          - id: l2-c9
            part: point
            type: multiple_choice
            text: "Where does the decimal point go? 4508p = ?"
            options: ["£45.08", "£4.508", "£450.8"]
            answer: "£45.08"
          - id: l2-c10
            part: point
            type: text_input
            keyboard: decimal
            text: "Write 1365p in pounds. £_"
            say: "Write one thousand three hundred and sixty-five pence in pounds."
            answer: "13.65"
          - id: l2-c11
            part: point
            type: true_false
            text: "Is it true? 960p = £9.60"
            say: "Nine hundred and sixty pence is nine pounds sixty. Is it true?"
            answer: true
          - id: l2-c12
            part: point
            type: multiple_choice
            text: "£1.75 × 8 = ?"
            options: ["£14.00", "£1.400", "£140.00"]
            answer: "£14.00"
          - id: l2-c13
            part: estimate
            type: multiple_choice
            text: "Which estimate helps with £7.90 × 6?"
            options: ["£8 × 6 = £48", "£8 × 10 = £80", "£79 × 6 = £474"]
            answer: "£8 × 6 = £48"
          - id: l2-c14
            part: estimate
            type: multiple_choice
            text: "Estimate first. Which answer fits £9.05 × 7?"
            options: ["£63.35", "£633.50", "£6.335"]
            answer: "£63.35"
          - id: l2-c15
            part: estimate
            type: true_false
            text: "Is it true? £5.98 × 4 is a little less than £24."
            say: "Five pounds ninety-eight times four is a little less than twenty-four pounds. Is it true?"
            answer: true
          - id: l2-c16
            part: estimate
            type: multiple_choice
            text: "Sam works out £3.10 × 9 and gets £279.00. What does an estimate show?"
            options: ["It is far too big. It should be about £27.", "It is about right.", "It is far too small. It should be about £2700."]
            answer: "It is far too big. It should be about £27."
          - id: l2-c17
            part: shopping
            type: text_input
            keyboard: decimal
            text: "A comic costs £2.85. How much do 7 comics cost? £_"
            say: "A comic costs two pounds eighty-five. How much do seven comics cost, in pounds?"
            answer: "19.95"
          - id: l2-c18
            part: shopping
            type: multiple_choice
            text: "Tom buys 4 pizzas at £3.65 each. He pays with a £20 note. How much change does he get?"
            options: ["£5.40", "£14.60", "£6.40"]
            answer: "£5.40"
          - id: l2-c19
            part: shopping
            type: true_false
            text: "Is it true? 12 pencils at 45p each cost £4.50."
            say: "Twelve pencils at forty-five pence each cost four pounds fifty. Is it true?"
            answer: false
          - id: l2-c20
            part: shopping
            type: multiple_choice
            text: "Which is cheaper: 6 rolls at £1.25 each, or a pack of 6 rolls for £7.20?"
            options: ["6 rolls at £1.25 each", "the pack for £7.20", "They cost the same."]
            answer: "the pack for £7.20"
            keep_order: true
