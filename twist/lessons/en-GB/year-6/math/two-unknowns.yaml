# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.two-unknowns
skill: math.algebra.two-unknowns
curriculum: en-GB
language: en
title:
  de: Gleichungen mit zwei Unbekannten
  en: Two unknowns
summary: >
  Equations with two unknowns have more than one answer. Lesson 1 finds
  pairs for a + b = 7 and a × b = 12, lists them all in a table by
  changing one number in steps of one, and uses a second clue to find
  the one pair that fits; lesson 2 lists the pairs for equations such as
  2a + b = 10, solves shopping problems (pencils at 3p, rubbers at 5p,
  spend exactly 30p), and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Terme und Gleichungen, en: Algebra }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.algebra.missing-numbers, math.chance.combinations]
  also_practises: [math.algebra.missing-numbers]
  vocabulary: { en: [unknown, pair, equation, systematic, list, possibilities, whole number] }
  forms: [drawn, text, audio]
  drawn: [table]
  facets: []
  parts:
    - { id: pairs, what: { de: "Zahlenpaare finden, die eine Gleichung mit zwei Unbekannten erfüllen", en: finding pairs that fit an equation with two unknowns } }
    - { id: list, what: { de: alle Möglichkeiten systematisch auflisten, en: listing all the possibilities systematically } }
    - { id: clue, what: { de: mit einer zweiten Bedingung das eine passende Paar finden, en: using a second clue to find the one pair that fits } }
    - { id: problems, what: { de: Sachaufgaben mit zwei Unbekannten lösen, en: solving word problems with two unknowns } }
  misconceptions:
    - id: pairs-missed
      what: Lists pairs at random and misses some, or counts a = 1, b = 5 and a = 5, b = 1 as one pair
      addressed: lesson 1 Learn lists a from 1 upwards in a table; l1-f3 has feedback, l1-s3, l1-n3, l1-c2, l2-w1 and l2-c2 count all pairs
    - id: coefficient-ignored
      what: Treats 2a + b = 9 like a + b = 9 and lets b go down in ones
      addressed: lesson 2 Learn shows b going down in twos; l2-f3 has feedback, l2-s3, l2-s5 and l2-c4 count again
    - id: one-answer-only
      what: Stops at the first pair that works and thinks it is the only answer
      addressed: lesson 1 Learn finds six pairs for one equation; lesson 2 Learn finds three ways to spend 30p; l2-n1 asks how many ways
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Alle Paare finden", en: "Finding all the pairs" }
    goal:
      de: "Finde alle Zahlenpaare für a plus b gleich 7, indem du a Schritt für Schritt um 1 erhöhst."
      en: "Find every pair of numbers for a plus b makes 7, by going up one step at a time."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "3n + 5 = 26. n = _"
            say: "Three n add five equals twenty-six. What is n?"
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "A café has 3 kinds of sandwich and 2 kinds of drink. How many different sandwich and drink pairs can you choose?"
            options: ["6", "5", "9"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "a + b = 7"
            say: "This equation has two unknowns, a and b. Many pairs work: a equals one and b equals six, or a equals two and b equals five. One equation can have lots of answers."
          - text: "a + b = 7, whole numbers of 1 or more"
            say: "To find them all, work systematically. Start with a equals one and go up by one each time. Each time, b gets one smaller. a equals three, b equals four is a different pair from a equals four, b equals three. There are six pairs."
            show: { drawn: table, rows: [[a, b], ["1", "6"], ["2", "5"], ["3", "4"], ["4", "3"], ["5", "2"], ["6", "1"]] }
          - text: "a × b = 12\n1 × 12, 2 × 6, 3 × 4, 4 × 3, 6 × 2, 12 × 1"
            say: "For a times b equals twelve, the pairs are the factor pairs of twelve. With a first and b second, there are six of them."
          - text: "a + b = 10 and a is 4 more than b\na = 7, b = 3"
            say: "A second clue can leave only one pair. Of all the pairs that make ten, only seven and three have a four more than b."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "a + b = 9. Which pair works?"
                options: ["a = 4, b = 5", "a = 4, b = 6", "a = 3, b = 3"]
                answer: "a = 4, b = 5"
                hints:
                  - "Add a and b for each pair."
                  - "4 + 6 = 10 and 3 + 3 = 6."
                  - "4 + 5 = 9, so a = 4, b = 5."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Complete the list for a + b = 8."
                show: { drawn: table, rows: [[a, b], ["1", "7"], ["2", "?"], ["3", "?"], ["4", "4"]] }
                frame: "a = 2: b = _   a = 3: b = _"
                options: ["6", "5", "4", "7"]
                answer: ["6", "5"]
                hints:
                  - "Each time a goes up by one, b goes down by one."
                  - "2 + b = 8 and 3 + b = 8."
                  - "b = 6, then b = 5."
              - id: l1-f3
                type: multiple_choice
                text: "a + b = 6. a and b are whole numbers of 1 or more. How many pairs (a, b) are there?"
                options: ["5", "6", "3"]
                answer: "5"
                feedback:
                  "3": "a = 1, b = 5 and a = 5, b = 1 are different pairs. Count them both."
                  "6": "Start at a = 1 and stop when b would be 0. Zero is not allowed here."
                hints:
                  - "List them: start with a = 1."
                  - "a = 1, 2, 3, 4, 5 gives b = 5, 4, 3, 2, 1."
                  - "There are 5 pairs."
              - id: l1-f4
                type: multiple_choice
                text: "a × b = 18. Which pair does not work?"
                options: ["a = 3, b = 6", "a = 2, b = 9", "a = 4, b = 5"]
                answer: "a = 4, b = 5"
                hints:
                  - "Multiply a and b for each pair."
                  - "3 × 6 = 18 and 2 × 9 = 18."
                  - "4 × 5 = 20, so that pair does not work."
              - id: l1-f5
                type: true_false
                text: "Is it true? a + b = 10 and a − b = 2 give a = 6, b = 4."
                answer: true
                hints:
                  - "Check both clues."
                  - "6 + 4 = 10. What is 6 − 4?"
                  - "6 − 4 = 2, so yes."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "x + y = 12. Which pair works?"
                options: ["x = 5, y = 7", "x = 5, y = 8", "x = 6, y = 5"]
                answer: "x = 5, y = 7"
                hints: ["Add x and y for each pair."]
              - id: l1-s2
                type: fill_in_blank
                text: "Complete the list for a × b = 20."
                show: { drawn: table, rows: [[a, b], ["1", "20"], ["2", "?"], ["4", "?"], ["5", "4"]] }
                frame: "a = 2: b = _   a = 4: b = _"
                options: ["10", "5", "18", "16"]
                answer: ["10", "5"]
                hints: ["2 × b = 20 and 4 × b = 20."]
              - id: l1-s3
                type: multiple_choice
                text: "a + b = 5. a and b are whole numbers of 0 or more. How many pairs (a, b) are there?"
                options: ["6", "5", "4"]
                answer: "6"
                hints: ["Start with a = 0, b = 5."]
              - id: l1-s4
                type: multiple_choice
                text: "a + b = 11 and a is 3 more than b. What are a and b?"
                options: ["a = 7, b = 4", "a = 8, b = 3", "a = 6, b = 5"]
                answer: "a = 7, b = 4"
                hints: ["Which pair that makes 11 has a difference of 3?"]
              - id: l1-s5
                type: true_false
                text: "Is it true? There are 4 pairs of whole numbers (a, b) with a × b = 7."
                answer: false
                hints: ["7 has only two factors."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "p + q = 15 and p = 9. q = _"
                answer: "6"
              - id: l1-n2
                type: multiple_choice
                text: "m × n = 30 and m + n = 11. Which numbers are m and n?"
                options: ["5 and 6", "3 and 10", "2 and 15"]
                answer: "5 and 6"
              - id: l1-n3
                type: multiple_choice
                text: "a + b = 9. a and b are whole numbers of 1 or more. How many pairs (a, b) are there?"
                options: ["8", "9", "4"]
                answer: "8"
              - id: l1-n4
                type: true_false
                text: "Is it true? x + y = 14 and x − y = 4 give x = 10, y = 4."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Tom has 12 pets, all cats and dogs. He has 4 more cats than dogs. How many cats does he have?"
                options: ["8", "4", "6"]
                answer: "8"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "a + b = 13. Which pair works?"
            options: ["a = 6, b = 7", "a = 6, b = 8", "a = 7, b = 7"]
            answer: "a = 6, b = 7"
          - id: l1-c2
            type: multiple_choice
            text: "a × b = 15. How many pairs of whole numbers (a, b) are there?"
            options: ["4", "2", "15"]
            answer: "4"
          - id: l1-c3
            type: multiple_choice
            text: "a + b = 20 and a is 6 more than b. What are a and b?"
            options: ["a = 13, b = 7", "a = 14, b = 6", "a = 12, b = 8"]
            answer: "a = 13, b = 7"
          - id: l1-c4
            type: true_false
            text: "Is it true? There are 4 pairs of whole numbers (a, b) with a × b = 10."
            answer: true
          - id: l1-c5
            type: fill_in_blank
            text: "Complete the list for a + b = 12."
            show: { drawn: table, rows: [[a, b], ["1", "11"], ["2", "?"], ["3", "?"], ["4", "8"]] }
            frame: "a = 2: b = _   a = 3: b = _"
            options: ["10", "9", "8", "11"]
            answer: ["10", "9"]
          - id: l1-c6
            type: text_input
            text: "x + y = 17 and x is 5 more than y. y = _"
            say: "x add y equals seventeen, and x is five more than y. What is y?"
            answer: "6"

  - n: 2
    title: { de: "Gleichungen wie 2a + b = 10", en: "Equations like 2a + b = 10" }
    goal:
      de: "Finde alle Lösungen für ein Einkaufsrätsel, so wie genau 30 Pence für Stifte zu 3 Pence und Radiergummi zu 5 Pence auszugeben."
      en: "List all the answers to a shopping puzzle, like spending exactly 30 pence on pencils at 3 pence and rubbers at 5 pence."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "a + b = 7. a and b are whole numbers of 1 or more. How many pairs (a, b) are there?"
            options: ["6", "7", "3"]
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "a × b = 16. Which pair works?"
            options: ["a = 2, b = 8", "a = 4, b = 12", "a = 3, b = 5"]
            answer: "a = 2, b = 8"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2a + b = 10\na = 1: 2 + b = 10, so b = 8"
            say: "Now a is doubled. Try a equals one: two add b equals ten, so b equals eight."
          - text: "2a + b = 10, whole numbers of 1 or more"
            say: "Go up one at a time in a. Each time, two a goes up by two, so b goes down by two. If a and b are whole numbers of one or more, a can be one, two, three or four: four pairs."
            show: { drawn: table, rows: [[a, 2a, b], ["1", "2", "8"], ["2", "4", "6"], ["3", "6", "4"], ["4", "8", "2"]] }
          - text: "Pencils 3p, rubbers 5p. Spend exactly 30p.\nx pencils and y rubbers: 3x + 5y = 30"
            say: "Write the problem as an equation with two unknowns: x pencils and y rubbers. Try each number of rubbers in turn. No rubbers: ten pencils. Three rubbers cost fifteen pence, so five pencils. Six rubbers cost thirty pence, so no pencils. With one, two, four or five rubbers, the rest cannot be made with pencils."
          - text: "Change one unknown in steps of one. Work out the other each time."
            say: "Working systematically like this means you know when you have found every possibility."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "2a + b = 12. Find b."
                show: { drawn: table, rows: [[a, b], ["1", "?"], ["2", "?"], ["3", "6"]] }
                frame: "a = 1: b = _   a = 2: b = _"
                options: ["10", "8", "11", "9"]
                answer: ["10", "8"]
                hints:
                  - "Double a first."
                  - "a = 1: 2 + b = 12. a = 2: 4 + b = 12."
                  - "b = 10, then b = 8."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "3x + y = 15. x and y are whole numbers of 1 or more. Which pair works?"
                options: ["x = 4, y = 3", "x = 3, y = 5", "x = 5, y = 1"]
                answer: "x = 4, y = 3"
                hints:
                  - "Work out 3x first, then add y."
                  - "3 × 4 = 12, 3 × 3 = 9, 3 × 5 = 15."
                  - "12 + 3 = 15, so x = 4, y = 3."
              - id: l2-f3
                type: multiple_choice
                text: "2a + b = 9. a and b are whole numbers of 1 or more. How many pairs (a, b) are there?"
                options: ["4", "8", "9"]
                answer: "4"
                feedback:
                  "8": "That would be a + b = 9. Here a is doubled, so b goes down in twos."
                hints:
                  - "List them: start with a = 1."
                  - "a = 1, 2, 3, 4 gives b = 7, 5, 3, 1. a = 5 would need b below 0."
                  - "There are 4 pairs."
              - id: l2-f4
                type: multiple_choice
                text: "Pencils cost 2p and rubbers cost 5p. Kim spends exactly 20p and buys at least one of each. What does she buy?"
                options: ["5 pencils and 2 rubbers", "4 pencils and 2 rubbers", "5 pencils and 1 rubber"]
                answer: "5 pencils and 2 rubbers"
                hints:
                  - "Try 1 rubber, then 2 rubbers."
                  - "1 rubber leaves 15p, which 2p pencils cannot make. 2 rubbers leave 10p."
                  - "10p is 5 pencils: 5 pencils and 2 rubbers."
              - id: l2-f5
                type: true_false
                text: "Is it true? a + 2b = 10 works for a = 4, b = 3."
                answer: true
                hints:
                  - "Double b first."
                  - "2 × 3 = 6."
                  - "4 + 6 = 10, so yes."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "a + 3b = 13. Find a."
                show: { drawn: table, rows: [[b, a], ["1", "?"], ["2", "?"], ["3", "4"]] }
                frame: "b = 1: a = _   b = 2: a = _"
                options: ["10", "7", "12", "11"]
                answer: ["10", "7"]
                hints: ["3b is 3, then 6."]
              - id: l2-s2
                type: multiple_choice
                text: "4x + y = 17. x and y are whole numbers of 1 or more. Which pair works?"
                options: ["x = 3, y = 5", "x = 4, y = 2", "x = 2, y = 8"]
                answer: "x = 3, y = 5"
                hints: ["Work out 4x first, then add y."]
              - id: l2-s3
                type: multiple_choice
                text: "2a + b = 7. a and b are whole numbers of 1 or more. How many pairs (a, b) are there?"
                options: ["3", "6", "7"]
                answer: "3"
                hints: ["b goes down in twos: 5, 3, 1."]
              - id: l2-s4
                type: multiple_choice
                text: "Tickets cost £3 for a child and £5 for an adult. A group pays exactly £22, with at least one child and one adult. Who is in the group?"
                options: ["4 children and 2 adults", "2 children and 4 adults", "5 children and 1 adult"]
                answer: "4 children and 2 adults"
                hints: ["Work out the cost of each group."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 2x + y = 8 has 4 pairs of whole numbers of 1 or more."
                answer: false
                hints: ["List them: x = 1, 2, 3 ..."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Cakes cost £2 and cookies cost £1. Sam spends exactly £7 and buys at least one of each. How many different ways can he do it?"
                options: ["3", "4", "7"]
                answer: "3"
              - id: l2-n2
                type: text_input
                text: "Bikes have 2 wheels and trikes have 3. There are 3 trikes and 13 wheels altogether. How many bikes are there?"
                answer: "2"
              - id: l2-n3
                type: multiple_choice
                text: "a + b = 12 and b is twice a. What are a and b?"
                options: ["a = 4, b = 8", "a = 6, b = 6", "a = 8, b = 4"]
                answer: "a = 4, b = 8"
              - id: l2-n4
                type: true_false
                text: "Is it true? With 2p and 3p stamps you can make exactly 11p from three 3p stamps and one 2p stamp."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Chairs have 4 legs and stools have 3. Together they have 25 legs. Which of these is possible?"
                options: ["4 chairs and 3 stools", "3 chairs and 4 stools", "5 chairs and 2 stools"]
                answer: "4 chairs and 3 stools"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: pairs
            type: multiple_choice
            text: "x + y = 16. Which pair works?"
            options: ["x = 9, y = 7", "x = 9, y = 8", "x = 10, y = 7"]
            answer: "x = 9, y = 7"
          - id: l2-c2
            part: list
            type: multiple_choice
            text: "a × b = 28. How many pairs of whole numbers (a, b) are there?"
            options: ["6", "3", "4"]
            answer: "6"
          - id: l2-c3
            part: clue
            type: multiple_choice
            text: "a + b = 14 and a is 4 more than b. What are a and b?"
            options: ["a = 9, b = 5", "a = 10, b = 4", "a = 8, b = 6"]
            answer: "a = 9, b = 5"
          - id: l2-c4
            part: list
            type: multiple_choice
            text: "3a + b = 11. a and b are whole numbers of 1 or more. How many pairs (a, b) are there?"
            options: ["3", "10", "4"]
            answer: "3"
          - id: l2-c5
            part: problems
            type: multiple_choice
            text: "Pens cost 4p and pencils cost 3p. Ali spends exactly 18p and buys at least one of each. What does he buy?"
            options: ["3 pens and 2 pencils", "2 pens and 3 pencils", "4 pens and 1 pencil"]
            answer: "3 pens and 2 pencils"
          - id: l2-c6
            part: pairs
            type: multiple_choice
            text: "a × b = 24. Which pair works?"
            options: ["a = 3, b = 8", "a = 4, b = 7", "a = 5, b = 5"]
            answer: "a = 3, b = 8"
          - id: l2-c7
            part: pairs
            type: true_false
            text: "Is it true? 2a + b = 15 works for a = 5, b = 10."
            answer: false
          - id: l2-c8
            part: pairs
            type: text_input
            text: "3x + y = 20 and x = 4. y = _"
            say: "Three x add y equals twenty, and x equals four. What is y?"
            answer: "8"
          - id: l2-c9
            part: pairs
            type: multiple_choice
            text: "a + 4b = 18. a and b are whole numbers of 1 or more. Which pair works?"
            options: ["a = 6, b = 3", "a = 2, b = 5", "a = 10, b = 1"]
            answer: "a = 6, b = 3"
          - id: l2-c10
            part: list
            type: fill_in_blank
            text: "Complete the list for a × b = 36."
            show: { drawn: table, rows: [[a, b], ["1", "36"], ["2", "18"], ["3", "?"], ["4", "?"], ["6", "6"]] }
            frame: "a = 3: b = _   a = 4: b = _"
            options: ["12", "9", "33", "32"]
            answer: ["12", "9"]
          - id: l2-c11
            part: list
            type: true_false
            text: "Is it true? 2a + b = 11 has 5 pairs of whole numbers of 1 or more."
            answer: true
          - id: l2-c12
            part: list
            type: multiple_choice
            text: "x × y = 9. x and y are whole numbers. How many pairs (x, y) are there?"
            options: ["3", "2", "4"]
            answer: "3"
          - id: l2-c13
            part: clue
            type: multiple_choice
            text: "a + b = 15 and a is twice b. What are a and b?"
            options: ["a = 10, b = 5", "a = 5, b = 10", "a = 9, b = 6"]
            answer: "a = 10, b = 5"
          - id: l2-c14
            part: clue
            type: true_false
            text: "Is it true? a × b = 24 and a + b = 11 give a = 6, b = 4."
            answer: false
          - id: l2-c15
            part: clue
            type: text_input
            text: "a + b = 18 and a − b = 4. a = _"
            say: "a add b equals eighteen, and a subtract b equals four. What is a?"
            answer: "11"
          - id: l2-c16
            part: clue
            type: multiple_choice
            text: "m × n = 36 and n is 5 more than m. What are m and n?"
            options: ["m = 4, n = 9", "m = 3, n = 12", "m = 6, n = 6"]
            answer: "m = 4, n = 9"
          - id: l2-c17
            part: problems
            type: multiple_choice
            text: "Apples cost 5p and pears cost 4p. Jo spends exactly 23p and buys at least one of each. What does she buy?"
            options: ["3 apples and 2 pears", "2 apples and 3 pears", "1 apple and 4 pears"]
            answer: "3 apples and 2 pears"
          - id: l2-c18
            part: problems
            type: text_input
            text: "Spiders have 8 legs and beetles have 6. A box has 3 spiders and some beetles, with 42 legs in all. How many beetles are there?"
            answer: "3"
          - id: l2-c19
            part: problems
            type: multiple_choice
            text: "Adult tickets cost £4 and child tickets cost £2. A family spends exactly £18 and buys at least one of each. How many different ways can they do it?"
            options: ["4", "3", "9"]
            answer: "4"
          - id: l2-c20
            part: problems
            type: true_false
            text: "Is it true? You can make exactly 13p from 5p and 2p coins, using at least one of each."
            answer: true
