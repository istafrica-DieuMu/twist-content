# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.area-perimeter-relation
skill: math.area-volume.area-perimeter-relation
curriculum: en-GB
language: en
title:
  de: Gleicher Flächeninhalt, anderer Umfang
  en: Area and perimeter together
summary: >
  Lesson 1 shows that rectangles with the same area can have different
  perimeters (12 squares as 1 by 12, 2 by 6 or 3 by 4: perimeters 26, 16
  and 14), and that the closer a rectangle is to a square, the shorter its
  perimeter; lesson 2 turns it round, so rectangles with the same
  perimeter have different areas and the square encloses the most, uses
  it for fences and patios, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.area-volume.area-rectangles, math.area-volume.perimeter]
  also_practises: [math.area-volume.area-rectangles, math.area-volume.perimeter]
  vocabulary: { en: [area, perimeter, rectangle, square, cm², m², length, width] }
  forms: [drawn, text, audio]
  drawn: [grid, table]
  facets: []
  misconceptions:
    - id: same-area-same-perimeter
      what: Thinks shapes with the same area must have the same perimeter
      addressed: lesson 1 Learn draws three rectangles of 12 squares with three perimeters; l1-f1 has feedback, l1-f4, l1-s1, l1-c1, l1-c3 and l2-c1 ask again
    - id: same-perimeter-same-area
      what: Thinks shapes with the same perimeter must have the same area
      addressed: lesson 2 Learn lists the rectangles with a perimeter of 20 cm and their areas; l2-f1 has feedback, l2-f5, l2-s1, l2-n3, l2-c2 and l2-c4 ask again
    - id: area-perimeter-mixed
      what: Gives the area when asked for the perimeter, or the other way round
      addressed: l1-f2 has feedback, l1-s3 and l2-s3 offer the other measure
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gleicher Flächeninhalt", en: "Same area" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "A rectangle is 5 cm long and 3 cm wide. What is its area?"
            options: ["15 cm²", "16 cm²", "8 cm²"]
            answer: "15 cm²"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "A rectangle is 5 cm long and 3 cm wide. What is its perimeter?"
            options: ["16 cm", "15 cm", "8 cm"]
            answer: "16 cm"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2 by 6: area 12 squares, perimeter 16"
            say: "Each square is one centimetre. This rectangle is two by six. Its area is twelve squares. Its perimeter is six add two add six add two: sixteen centimetres."
            show: { drawn: grid, cols: 8, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue], [6, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue], [5, 2, blue], [6, 2, blue]] }
          - text: "3 by 4: area 12 squares, perimeter 14"
            say: "Move the same twelve squares into a three by four rectangle. The area is still twelve squares, but the perimeter is now fourteen centimetres."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green], [1, 2, green], [2, 2, green], [3, 2, green], [4, 2, green], [1, 3, green], [2, 3, green], [3, 3, green], [4, 3, green]] }
          - text: "1 by 12: area 12 squares, perimeter 26"
            say: "In one long row, the same twelve squares have a perimeter of twenty-six centimetres. The longer and thinner a rectangle is, the bigger its perimeter. The closer it is to a square, the smaller its perimeter."
            show: { drawn: grid, cols: 14, rows: 3, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue], [6, 1, blue], [7, 1, blue], [8, 1, blue], [9, 1, blue], [10, 1, blue], [11, 1, blue], [12, 1, blue]] }
          - text: "Same area, different perimeters."
            say: "So two shapes can have the same area and still have different perimeters. Always work out each one."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Rectangle A is 2 cm by 6 cm. Rectangle B is 3 cm by 4 cm. Both have an area of 12 cm². Which has the bigger perimeter?"
                options: ["A", "B", "They are the same."]
                keep_order: true
                answer: "A"
                feedback:
                  "They are the same.": "They have the same area, but A's perimeter is 16 cm and B's is 14 cm."
                hints:
                  - "Work out each perimeter: add all four sides."
                  - "A: 2 + 6 + 2 + 6. B: 3 + 4 + 3 + 4."
                  - "A is 16 cm and B is 14 cm, so A."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Each square is 1 cm. The shape has an area of 6 cm². What is its perimeter?"
                show: { drawn: grid, cols: 8, rows: 3, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue], [6, 1, blue]] }
                options: ["14 cm", "6 cm", "12 cm"]
                answer: "14 cm"
                feedback:
                  "6 cm": "6 is the number of squares, which is the area. The perimeter is the distance all the way round."
                hints:
                  - "Go all the way round the outside."
                  - "The long sides are 6 cm each and the short sides 1 cm each."
                  - "6 + 1 + 6 + 1 = 14 cm."
              - id: l1-f3
                type: fill_in_blank
                text: "Both rectangles have an area of 18 cm². Find their perimeters."
                frame: "2 cm by 9 cm: _ cm   3 cm by 6 cm: _ cm"
                options: ["22", "18", "20", "11"]
                answer: ["22", "18"]
                hints:
                  - "Perimeter = 2 × (length + width)."
                  - "2 × (2 + 9) and 2 × (3 + 6)."
                  - "22 cm and 18 cm."
              - id: l1-f4
                type: true_false
                text: "Is it true? Two rectangles with the same area always have the same perimeter."
                answer: false
                hints:
                  - "Think of 12 squares made into different rectangles."
                  - "2 by 6 has a perimeter of 16, 3 by 4 has 14."
                  - "No. Same area can mean different perimeters."
              - id: l1-f5
                type: multiple_choice
                text: "Which rectangle with an area of 16 cm² has the smallest perimeter?"
                options: ["4 cm by 4 cm", "2 cm by 8 cm", "1 cm by 16 cm"]
                answer: "4 cm by 4 cm"
                hints:
                  - "The closer to a square, the smaller the perimeter."
                  - "Perimeters: 16 cm, 20 cm and 34 cm."
                  - "The 4 cm by 4 cm square."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Rectangle A is 1 cm by 10 cm. Rectangle B is 2 cm by 5 cm. Both have an area of 10 cm². Which has the bigger perimeter?"
                options: ["A", "B", "They are the same."]
                keep_order: true
                answer: "A"
                hints: ["The longer and thinner, the bigger the perimeter."]
              - id: l1-s2
                type: text_input
                text: "Each square is 1 cm. What is the perimeter of this rectangle? _ cm"
                show: { drawn: grid, cols: 7, rows: 4, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue], [5, 2, blue]] }
                answer: "14"
                hints: ["It is 5 cm long and 2 cm wide. Go all the way round."]
              - id: l1-s3
                type: multiple_choice
                text: "A rectangle has an area of 20 cm² and a length of 5 cm. What is its perimeter?"
                options: ["18 cm", "20 cm", "9 cm"]
                answer: "18 cm"
                hints: ["First find the width: 20 ÷ 5."]
              - id: l1-s4
                type: true_false
                text: "Is it true? A 3 cm by 8 cm rectangle and a 4 cm by 6 cm rectangle have the same area."
                answer: true
                hints: ["Work out 3 × 8 and 4 × 6."]
              - id: l1-s5
                type: multiple_choice
                text: "Which two rectangles have the same area but different perimeters?"
                options: ["2 cm by 9 cm and 3 cm by 6 cm", "2 cm by 9 cm and 3 cm by 8 cm", "4 cm by 5 cm and 5 cm by 4 cm"]
                answer: "2 cm by 9 cm and 3 cm by 6 cm"
                hints: ["Work out both areas first, then both perimeters."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: text_input
                text: "A garden is 3 m by 12 m. A square garden has the same area. How long is each side of the square? _ m"
                answer: "6"
              - id: l1-n2
                type: multiple_choice
                text: "A field has an area of 36 m². Which shape of field needs the shortest fence round it?"
                options: ["6 m by 6 m", "4 m by 9 m", "3 m by 12 m"]
                answer: "6 m by 6 m"
              - id: l1-n3
                type: text_input
                text: "A rectangle is 1 cm by 24 cm. What is its perimeter? _ cm"
                answer: "50"
              - id: l1-n4
                type: true_false
                text: "Is it true? A 2 cm by 12 cm rectangle has a bigger perimeter than a 4 cm by 6 cm rectangle."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Sam makes a rectangle from 24 square tiles, each 1 m by 1 m. Which of these perimeters can he not get?"
                options: ["24 m", "22 m", "28 m"]
                answer: "24 m"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Rectangle A is 2 cm by 8 cm. Rectangle B is 4 cm by 4 cm. Both have an area of 16 cm². Which has the bigger perimeter?"
            options: ["A", "B", "They are the same."]
            keep_order: true
            answer: "A"
          - id: l1-c2
            type: fill_in_blank
            text: "Both rectangles have an area of 20 cm². Find their perimeters."
            frame: "2 cm by 10 cm: _ cm   4 cm by 5 cm: _ cm"
            options: ["24", "18", "20", "12"]
            answer: ["24", "18"]
          - id: l1-c3
            type: true_false
            text: "Is it true? A 1 cm by 9 cm rectangle and a 3 cm by 3 cm square have the same perimeter."
            answer: false

  - n: 2
    title: { de: "Gleicher Umfang", en: "Same perimeter" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Rectangle A is 1 cm by 8 cm. Rectangle B is 2 cm by 4 cm. Both have an area of 8 cm². Which has the bigger perimeter?"
            options: ["A", "B", "They are the same."]
            keep_order: true
            answer: "A"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "A rectangle is 3 cm by 7 cm. What is its perimeter? _ cm"
            answer: "20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Perimeter 20 cm: length + width = 10 cm"
            say: "Now turn it round. All these rectangles have a perimeter of twenty centimetres, because the length and the width always add up to ten: nine and one, eight and two, seven and three, six and four, five and five."
          - text: "Same perimeter, different areas"
            say: "But their areas are different. Nine by one is only nine square centimetres. Five by five is twenty-five. The square encloses the most."
            show: { drawn: table, rows: [[Length, Width, Area], [9 cm, 1 cm, 9 cm²], [8 cm, 2 cm, 16 cm²], [7 cm, 3 cm, 21 cm²], [6 cm, 4 cm, 24 cm²], [5 cm, 5 cm, 25 cm²]] }
          - text: "Both have a perimeter of 14 cm.\nBlue: 6 cm². Green: 12 cm²."
            say: "Each square is one centimetre. The blue strip and the green rectangle both have a perimeter of fourteen centimetres. The blue strip covers six squares and the green rectangle twelve."
            show: { drawn: grid, cols: 8, rows: 7, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue], [6, 1, blue], [1, 3, green], [2, 3, green], [3, 3, green], [4, 3, green], [1, 4, green], [2, 4, green], [3, 4, green], [4, 4, green], [1, 5, green], [2, 5, green], [3, 5, green], [4, 5, green]] }
          - text: "Same perimeter does not mean same area."
            say: "So shapes with the same perimeter can have different areas, just as shapes with the same area can have different perimeters."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Rectangle A is 1 cm by 7 cm. Rectangle B is 4 cm by 4 cm. Both have a perimeter of 16 cm. Which has the bigger area?"
                options: ["A", "B", "They are the same."]
                keep_order: true
                answer: "B"
                feedback:
                  "They are the same.": "They have the same perimeter, but A's area is 7 cm² and B's is 16 cm²."
                hints:
                  - "Work out each area: length × width."
                  - "A: 1 × 7. B: 4 × 4."
                  - "7 cm² and 16 cm², so B."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Both rectangles have a perimeter of 24 cm. Find their areas."
                frame: "2 cm by 10 cm: _ cm²   6 cm by 6 cm: _ cm²"
                options: ["20", "36", "24", "12"]
                answer: ["20", "36"]
                hints:
                  - "Area = length × width."
                  - "2 × 10 and 6 × 6."
                  - "20 cm² and 36 cm²."
              - id: l2-f3
                type: multiple_choice
                text: "A rectangle has a perimeter of 18 cm and a length of 6 cm. What is its width?"
                options: ["3 cm", "12 cm", "6 cm"]
                answer: "3 cm"
                hints:
                  - "Length and width together are half the perimeter."
                  - "Half of 18 cm is 9 cm."
                  - "9 − 6 = 3 cm."
              - id: l2-f4
                type: multiple_choice
                text: "Which rectangle with a perimeter of 12 cm has the biggest area?"
                options: ["3 cm by 3 cm", "2 cm by 4 cm", "1 cm by 5 cm"]
                answer: "3 cm by 3 cm"
                hints:
                  - "The square encloses the most."
                  - "Areas: 9 cm², 8 cm² and 5 cm²."
                  - "The 3 cm by 3 cm square."
              - id: l2-f5
                type: true_false
                text: "Is it true? Two rectangles with the same perimeter always have the same area."
                answer: false
                hints:
                  - "Think of the rectangles with a perimeter of 20 cm."
                  - "9 by 1 has an area of 9 cm², 5 by 5 has 25 cm²."
                  - "No. Same perimeter can mean different areas."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Rectangle A is 2 cm by 6 cm. Rectangle B is 3 cm by 5 cm. Both have a perimeter of 16 cm. Which has the bigger area?"
                options: ["A", "B", "They are the same."]
                keep_order: true
                answer: "B"
                hints: ["Work out 2 × 6 and 3 × 5."]
              - id: l2-s2
                type: text_input
                text: "A rectangle has a perimeter of 14 cm and a length of 5 cm. What is its area? _ cm²"
                answer: "10"
                hints: ["Half the perimeter is 7 cm, so the width is 2 cm."]
              - id: l2-s3
                type: multiple_choice
                text: "Each square is 1 cm. Both shapes have a perimeter of 12 cm. What is the area of the green square?"
                show: { drawn: grid, cols: 7, rows: 7, cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue], [1, 3, green], [2, 3, green], [3, 3, green], [1, 4, green], [2, 4, green], [3, 4, green], [1, 5, green], [2, 5, green], [3, 5, green]] }
                options: ["9 cm²", "12 cm²", "5 cm²"]
                answer: "9 cm²"
                hints: ["Count the green squares."]
              - id: l2-s4
                type: true_false
                text: "Is it true? A 1 cm by 11 cm rectangle and a 6 cm by 6 cm square have the same perimeter."
                answer: true
                hints: ["Work out 2 × (1 + 11) and 4 × 6."]
              - id: l2-s5
                type: multiple_choice
                text: "Which two rectangles have the same perimeter but different areas?"
                options: ["1 cm by 8 cm and 4 cm by 5 cm", "1 cm by 8 cm and 3 cm by 3 cm", "2 cm by 6 cm and 6 cm by 2 cm"]
                answer: "1 cm by 8 cm and 4 cm by 5 cm"
                hints: ["Work out both perimeters first, then both areas."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ella has 20 m of fence for a rectangular rabbit pen. Which pen gives the rabbit the most space?"
                options: ["5 m by 5 m", "4 m by 6 m", "2 m by 8 m"]
                answer: "5 m by 5 m"
              - id: l2-n2
                type: text_input
                text: "A rectangle and a square both have a perimeter of 32 cm. The rectangle is 4 cm wide. How much bigger is the area of the square? _ cm²"
                answer: "16"
              - id: l2-n3
                type: multiple_choice
                text: "A 2 m by 10 m patio is relaid as a 6 m by 6 m patio. The edging round it is the same length. What happens to the area?"
                options: ["It gets bigger by 16 m².", "It stays the same.", "It gets smaller by 16 m²."]
                keep_order: true
                answer: "It gets bigger by 16 m²."
              - id: l2-n4
                type: true_false
                text: "Is it true? A 3 cm by 9 cm rectangle has a bigger area than a square with the same perimeter."
                answer: false
              - id: l2-n5
                type: text_input
                text: "A square has a perimeter of 28 cm. What is its area? _ cm²"
                answer: "49"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Rectangle A is 1 cm by 18 cm. Rectangle B is 3 cm by 6 cm. Both have an area of 18 cm². Which has the bigger perimeter?"
            options: ["A", "B", "They are the same."]
            keep_order: true
            answer: "A"
          - id: l2-c2
            type: multiple_choice
            text: "Rectangle A is 2 cm by 8 cm. Rectangle B is 5 cm by 5 cm. Both have a perimeter of 20 cm. Which has the bigger area?"
            options: ["A", "B", "They are the same."]
            keep_order: true
            answer: "B"
          - id: l2-c3
            type: fill_in_blank
            text: "Both rectangles have an area of 30 cm². Find their perimeters."
            frame: "3 cm by 10 cm: _ cm   5 cm by 6 cm: _ cm"
            options: ["26", "22", "30", "13"]
            answer: ["26", "22"]
          - id: l2-c4
            type: true_false
            text: "Is it true? Shapes with the same perimeter can have different areas."
            answer: true
          - id: l2-c5
            type: text_input
            text: "A rectangle has a perimeter of 22 cm and a width of 4 cm. What is its area? _ cm²"
            answer: "28"
