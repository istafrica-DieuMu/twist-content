# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.numbers-to-ten-million
skill: math.large-numbers.to-ten-million
curriculum: en-GB
language: en
title:
  de: Zahlen bis 10 000 000
  en: Numbers to 10,000,000
summary: >
  Year 6 opens with numbers to ten million. The millions are a third group
  of digits (4,250,816), read like the thousands group with "million"
  after it. Lesson 1 reads, writes and gives the value of each digit;
  lesson 2 orders and compares, with real figures such as populations,
  and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Zahlen bis 10 000 000, en: Numbers to 10 000 000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.order-to-million]
  also_practises: [math.large-numbers.to-million]
  vocabulary: { en: [million, ten million, digit, place value, group, ascending, descending] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart]
  facets: [operation-signs]
  parts:
    - { id: read-write, what: { de: Zahlen bis zehn Millionen lesen und schreiben, en: reading and writing numbers to ten million } }
    - { id: value, what: { de: den Stellenwert jeder Ziffer angeben, en: giving the value of each digit } }
    - { id: compare, what: { de: Zahlen bis zehn Millionen vergleichen, en: comparing numbers to ten million } }
    - { id: order, what: { de: Zahlen bis zehn Millionen ordnen, en: ordering numbers to ten million } }
  misconceptions:
    - id: group-reading
      what: Reads 4,250,816 as four hundred and twenty-five thousand, eight hundred and sixteen
      addressed: lesson 1 Learn reads one group at a time, millions first
    - id: zeros
      what: Drops zeros inside a group (three million and forty thousand as 340,000 or 3,400,000)
      addressed: both lessons set numbers with zeros inside a group; lesson 1 feedback counts the places
    - id: digit-count
      what: Compares by the first digit when the numbers have different lengths
      addressed: lesson 2 Learn counts digits first; feedback on that option says so
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Millionen lesen und schreiben, en: Reading and writing millions }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What is the 4 in 342,615 worth?"
            options: ["4000", "40,000", "400,000"]
            answer: "40,000"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "How many hundred thousands make one million?"
            options: ["10", "100", "1000"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "M | HTh | TTh | Th | H | T | O"
            say: "After the hundred thousands comes the millions column. Ten hundred thousands make one million."
            show: { drawn: place-value-chart, columns: [millions, hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [4, 2, 5, 0, 8, 1, 6] }
          - text: "4,250,816"
            say: "Read it group by group. Four million. Then two hundred and fifty thousand. Then eight hundred and sixteen. Four million, two hundred and fifty thousand, eight hundred and sixteen."
          - text: "3,040,000"
            say: "Three million and forty thousand: the thousands group is zero, four, zero, and the last group is all zeros. Every group after the first has three digits."
            show: { drawn: place-value-chart, columns: [millions, hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [3, 0, 4, 0, 0, 0, 0] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [millions, hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [6, 1, 3, 0, 2, 0, 5] }
                options: ["6,130,205", "613,205", "6,132,005"]
                answer: "6,130,205"
                hints:
                  - "Seven digits: one for the millions, then two groups of three."
                  - "6 million, 130 thousand, 205."
                  - "6,130,205."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is the 5 in 2,503,000 worth?"
                options: ["50,000", "500,000", "5,000,000"]
                answer: "500,000"
                feedback:
                  "50,000": "The 5 is right after the millions, in the hundred thousands."
                hints:
                  - "Which column is the 5 in?"
                  - "It is in the hundred thousands."
                  - "It is worth 500,000."
              - id: l1-f3
                type: multiple_choice
                text: "Listen. Which number is it?"
                say: "Three million and forty thousand. Which number is it?"
                options: ["3,040,000", "340,000", "3,400,000"]
                answer: "3,040,000"
                option_audio: false
                feedback:
                  "3,400,000": "Forty thousand is 040 in the thousands group, not 400."
                  "340,000": "There are 3 millions. A million number has seven digits."
                hints:
                  - "Three million: 3 in the millions."
                  - "Forty thousand: the thousands group is 040."
                  - "3,040,000."
              - id: l1-f4
                type: text_input
                text: "Listen and write the number."
                say: "Seven million, two hundred thousand and sixty. Write the number."
                answer: "7200060"
                hints:
                  - "Seven million: 7."
                  - "Two hundred thousand: 200. Sixty: 060."
                  - "7,200,060."
              - id: l1-f5
                type: multiple_choice
                text: "Which word matches 1,005,300?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["one million, five thousand, three hundred", "one million, fifty thousand, three hundred", "one hundred and five thousand, three hundred"]
                answer: "one million, five thousand, three hundred"
                option_audio: false
                hints:
                  - "The thousands group is 005."
                  - "That is five thousand."
                  - "One million, five thousand, three hundred."
              - id: l1-f6
                type: fill_in_blank
                text: "Partition 8,406,000."
                frame: "8,406,000 = _ + 400,000 + _"
                options: ["8,000,000", "800,000", "6000", "60,000"]
                answer: ["8,000,000", "6000"]
                hints:
                  - "The 8 is in the millions."
                  - "The 6 is in the thousands."
                  - "8,000,000 + 400,000 + 6000."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [millions, hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [9, 0, 0, 7, 5, 0, 0] }
                options: ["9,007,500", "9,075,000", "907,500"]
                answer: "9,007,500"
                hints: ["The thousands group is 007."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the 3 in 5,830,412 worth?"
                options: ["3000", "30,000", "300,000"]
                answer: "30,000"
                hints: ["Which column?"]
              - id: l1-s3
                type: text_input
                text: "Listen and write the number."
                say: "Two million, sixty-five thousand, one hundred. Write the number."
                answer: "2065100"
                hints: ["Sixty-five thousand: 065."]
              - id: l1-s4
                type: multiple_choice
                text: "Which word matches 4,700,000?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["four million, seven hundred thousand", "four million, seventy thousand", "forty-seven million"]
                answer: "four million, seven hundred thousand"
                option_audio: false
                hints: ["The thousands group is 700."]
              - id: l1-s5
                type: true_false
                text: "Is it true? Ten million is written 10,000,000."
                answer: true
                hints: ["Ten millions."]
              - id: l1-s6
                type: fill_in_blank
                text: "Partition 3,090,040."
                frame: "3,090,040 = 3,000,000 + _ + _"
                options: ["90,000", "9000", "40", "400"]
                answer: ["90,000", "40"]
                hints: ["The 9 is in the ten thousands."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What number is in the chart?"
                show: { drawn: place-value-chart, columns: [millions, hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [1, 2, 0, 0, 3, 4, 0] }
                options: ["1,200,340", "120,340", "1,203,400"]
                answer: "1,200,340"
              - id: l1-n2
                type: multiple_choice
                text: "What is the 7 in 7,140,000 worth?"
                options: ["700,000", "7,000,000", "70,000"]
                answer: "7,000,000"
              - id: l1-n3
                type: text_input
                text: "Listen and write the number."
                say: "Five million and five. Write the number."
                answer: "5000005"
              - id: l1-n4
                type: multiple_choice
                text: "Which word matches 6,018,000?"
                say: "Which number word matches the number? Read the words yourself."
                options: ["six million, eighteen thousand", "six million, one hundred and eighty thousand", "six hundred and eighteen thousand"]
                answer: "six million, eighteen thousand"
                option_audio: false
              - id: l1-n5
                type: fill_in_blank
                text: "Partition 2,500,700."
                frame: "2,500,700 = _ + 500,000 + _"
                options: ["2,000,000", "200,000", "700", "7000"]
                answer: ["2,000,000", "700"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [millions, hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [8, 0, 6, 1, 0, 0, 9] }
            options: ["8,061,009", "861,009", "8,610,009"]
            answer: "8,061,009"
          - id: l1-c2
            type: text_input
            text: "Listen and write the number."
            say: "Four million, three hundred and twelve thousand. Write the number."
            answer: "4312000"
          - id: l1-c3
            type: multiple_choice
            text: "What is the 2 in 3,452,600 worth?"
            options: ["2000", "20,000", "200,000"]
            answer: "2000"
          - id: l1-c4
            type: multiple_choice
            text: "Which word matches 3,600,050?"
            say: "Which number word matches the number? Read the words yourself."
            options: ["three million, six hundred thousand and fifty", "three million, sixty thousand and fifty", "thirty-six million and fifty"]
            answer: "three million, six hundred thousand and fifty"
            option_audio: false
          - id: l1-c5
            type: fill_in_blank
            text: "Partition 7,030,600."
            frame: "7,030,600 = _ + 30,000 + _"
            options: ["7,000,000", "700,000", "6000", "600"]
            answer: ["7,000,000", "600"]
          - id: l1-c6
            type: true_false
            text: "Is it true? 2,000,400 is two million, four thousand."
            say: "Look at the number. Is it two million, four thousand?"
            answer: false

  - n: 2
    title: { de: Große Zahlen vergleichen, en: Comparing and ordering large numbers }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is the 6 in 6,240,000 worth?"
            options: ["600,000", "6,000,000", "60,000"]
            answer: "6,000,000"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Listen and write the number."
            say: "One million, one hundred thousand. Write the number."
            answer: "1100000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "999,999 < 1,000,000"
            say: "Count the digits first. Nine hundred and ninety-nine thousand, nine hundred and ninety-nine has six digits. One million has seven. More digits means greater."
          - text: "2,540,000 and 2,450,000"
            say: "Same number of digits? Compare from the left. The millions are both two. In the hundred thousands, five is more than four. So two million, five hundred and forty thousand is greater."
          - text: "Birmingham 1,145,000, Glasgow 635,000"
            say: "Real numbers are often this big. A city of about one million, one hundred and forty-five thousand people is bigger than one of about six hundred and thirty-five thousand."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "999,999 _ 1,000,000"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "The nines are big digits, but 1,000,000 has seven digits and 999,999 only six."
                hints:
                  - "Count the digits."
                  - "Six against seven."
                  - "999,999 is less."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "2,540,000 _ 2,450,000"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "The millions are the same."
                  - "Compare the hundred thousands: 5 and 4."
                  - "2,540,000 is greater."
              - id: l2-f3
                type: ordering
                text: "Put the numbers in ascending order, smallest first."
                options: ["3,300,000", "3,030,000", "330,000", "3,003,000"]
                slot_count: 4
                answer: ["330,000", "3,003,000", "3,030,000", "3,300,000"]
                hints:
                  - "Which has the fewest digits?"
                  - "330,000 first. Then compare the others from the left."
                  - "330,000, 3,003,000, 3,030,000, 3,300,000."
              - id: l2-f4
                type: multiple_choice
                text: "Leeds has about 812,000 people and Bristol about 472,000. Which is bigger?"
                options: ["Leeds", "Bristol"]
                answer: "Leeds"
                hints:
                  - "Compare 812,000 and 472,000."
                  - "Both have six digits. Compare the hundred thousands."
                  - "8 is more than 4: Leeds."
              - id: l2-f5
                type: true_false
                text: "Is it true? 5,099,999 < 5,100,000"
                answer: true
                hints:
                  - "Millions are the same."
                  - "Hundred thousands: 0 and 1."
                  - "Yes."
              - id: l2-f6
                type: multiple_choice
                text: "Which is the greatest?"
                options: ["8,909,000", "8,990,000", "8,099,000"]
                answer: "8,990,000"
                hints:
                  - "All have 8 millions."
                  - "Compare the hundred thousands, then the ten thousands."
                  - "8,990,000."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "7,060,500 _ 7,600,500"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Compare the hundred thousands."]
              - id: l2-s2
                type: ordering
                text: "Put the numbers in descending order, greatest first."
                options: ["1,111,000", "1,011,100", "1,101,000", "111,100"]
                slot_count: 4
                answer: ["1,111,000", "1,101,000", "1,011,100", "111,100"]
                hints: ["The six-digit number is smallest."]
              - id: l2-s3
                type: multiple_choice
                text: "A film had 4,350,000 viewers and another 4,305,000. Which had more?"
                options: ["4,350,000", "4,305,000"]
                answer: "4,350,000"
                hints: ["Compare the ten thousands."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 10,000,000 > 9,999,999"
                answer: true
                hints: ["Count the digits."]
              - id: l2-s5
                type: multiple_choice
                text: "Which is the smallest?"
                options: ["6,066,000", "6,606,000", "6,060,600"]
                answer: "6,060,600"
                hints: ["Compare from the left."]
              - id: l2-s6
                type: fill_in_blank
                text: "Which number makes it true?"
                frame: "_ > 4,999,999"
                options: ["4,999,990", "5,000,000", "499,999"]
                answer: ["5,000,000"]
                hints: ["One more than 4,999,999."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Which sign goes in the gap?"
                frame: "900,900 _ 9,009,000"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Put the numbers in ascending order, smallest first."
                options: ["2,220,000", "2,022,000", "2,202,000", "2,002,200"]
                slot_count: 4
                answer: ["2,002,200", "2,022,000", "2,202,000", "2,220,000"]
              - id: l2-n3
                type: multiple_choice
                text: "A charity raised £1,250,000 one year and £1,205,000 the next. Which year raised more?"
                options: ["the first year", "the next year"]
                answer: "the first year"
              - id: l2-n4
                type: true_false
                text: "Is it true? 3,450,000 > 3,540,000"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Which is the greatest?"
                options: ["7,707,000", "7,770,000", "7,077,700"]
                answer: "7,770,000"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read-write
            type: multiple_choice
            text: "What number is in the chart?"
            show: { drawn: place-value-chart, columns: [millions, hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [5, 4, 0, 0, 0, 7, 0] }
            options: ["5,400,070", "540,070", "5,400,700"]
            answer: "5,400,070"
          - id: l2-c2
            part: value
            type: multiple_choice
            text: "What is the 9 in 1,290,000 worth?"
            options: ["9000", "90,000", "900,000"]
            answer: "90,000"
          - id: l2-c3
            part: read-write
            type: text_input
            text: "Listen and write the number."
            say: "Nine million, nine thousand and nine. Write the number."
            answer: "9009009"
          - id: l2-c4
            part: compare
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "6,505,000 _ 6,550,000"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c5
            part: order
            type: ordering
            text: "Put the numbers in descending order, greatest first."
            options: ["4,040,400", "4,400,040", "440,400", "4,004,040"]
            slot_count: 4
            answer: ["4,400,040", "4,040,400", "4,004,040", "440,400"]
          - id: l2-c6
            part: read-write
            type: multiple_choice
            text: "Which word matches 2,060,400?"
            say: "Which number word matches the number? Read the words yourself."
            options: ["two million, sixty thousand, four hundred", "two million, six hundred thousand, four hundred", "two hundred and six thousand, four hundred"]
            answer: "two million, sixty thousand, four hundred"
            option_audio: false
          - id: l2-c7
            part: read-write
            type: text_input
            text: "Listen and write the number."
            say: "Six million, four hundred thousand and thirty. Write the number."
            answer: "6400030"
          - id: l2-c8
            part: read-write
            type: true_false
            text: "Is it true? Three million, five thousand is written 3,500,000."
            say: "Three million, five thousand is written like the number on the screen. Is it true?"
            answer: false
          - id: l2-c9
            part: value
            type: multiple_choice
            text: "What is the 6 in 4,186,250 worth?"
            options: ["600", "6000", "60,000"]
            answer: "6000"
          - id: l2-c10
            part: value
            type: text_input
            text: "What is the 7 in 3,570,914 worth? _"
            say: "What is the seven in the number on the screen worth?"
            answer: "70000"
          - id: l2-c11
            part: value
            type: fill_in_blank
            text: "Partition 5,302,080."
            frame: "5,302,080 = 5,000,000 + _ + _ + 80"
            options: ["300,000", "30,000", "2000", "200"]
            answer: ["300,000", "2000"]
          - id: l2-c12
            part: value
            type: true_false
            text: "Is it true? In 9,420,000 the 4 is worth 400,000."
            answer: true
          - id: l2-c13
            part: compare
            type: fill_in_blank
            text: "Which sign goes in the gap?"
            frame: "8,080,000 _ 808,000"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c14
            part: compare
            type: true_false
            text: "Is it true? 6,999,000 < 6,990,999"
            answer: false
          - id: l2-c15
            part: compare
            type: multiple_choice
            text: "Scotland has about 5,450,000 people and Wales about 3,130,000. Which has more people?"
            options: ["Scotland", "Wales"]
            answer: "Scotland"
          - id: l2-c16
            part: compare
            type: fill_in_blank
            text: "Which number makes it true?"
            frame: "3,405,000 < _"
            options: ["3,045,000", "3,400,500", "3,450,000"]
            answer: ["3,450,000"]
          - id: l2-c17
            part: order
            type: ordering
            text: "Put the numbers in ascending order, smallest first."
            options: ["8,120,000", "8,201,000", "812,000", "8,102,000"]
            slot_count: 4
            answer: ["812,000", "8,102,000", "8,120,000", "8,201,000"]
          - id: l2-c18
            part: order
            type: multiple_choice
            text: "Which is the smallest?"
            options: ["9,090,900", "9,009,990", "9,099,000"]
            answer: "9,009,990"
          - id: l2-c19
            part: order
            type: ordering
            text: "Put the numbers in descending order, greatest first."
            options: ["2,750,000", "725,000", "7,250,000", "2,705,000"]
            slot_count: 4
            answer: ["7,250,000", "2,750,000", "2,705,000", "725,000"]
          - id: l2-c20
            part: order
            type: multiple_choice
            text: "Which number comes between 4,600,000 and 4,700,000?"
            options: ["4,060,000", "4,650,000", "4,750,000"]
            answer: "4,650,000"
