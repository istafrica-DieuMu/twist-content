# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.long-division
skill: math.written-mult-div.long-division
curriculum: en-GB
language: en
title:
  de: Schriftlich durch zweistellige Zahlen teilen
  en: Long division
summary: >
  Dividing numbers up to four digits by a two-digit number with long
  division. Lesson 1 divides, multiplies, subtracts and brings down,
  with a list of multiples to help, and keeps a zero in the answer
  (7248 ÷ 24 = 302). Lesson 2 gives the remainder as a remainder, a
  fraction or a decimal, decides in a story whether to round up or down,
  and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Schriftlich teilen, en: Written division }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [math.written-mult-div.div-remainder-zeros, math.written-mult-div.mult-multi-digit]
  also_practises: [math.written-mult-div.mult-multi-digit]
  vocabulary: { en: [long division, short division, divisor, dividend, quotient, remainder, multiple, bring down, estimate] }
  forms: [drawn, text, audio]
  drawn: [table, short-division]
  facets: [number-format]
  parts:
    - { id: divide, what: { de: schriftlich durch eine zweistellige Zahl teilen, en: dividing by a two-digit number with long division } }
    - { id: remainder, what: { de: das Ergebnis mit Rest angeben, en: giving the answer with a remainder } }
    - { id: fraction-decimal, what: { de: den Rest als Bruch oder Dezimalzahl schreiben, en: writing the remainder as a fraction or a decimal } }
    - { id: in-context, what: { de: in einer Sachaufgabe auf- oder abrunden, en: rounding up or down in a word problem } }
  misconceptions:
    - id: zero-dropped
      what: Leaves out a zero in the answer when the divisor does not go (7248 ÷ 24 = 32)
      addressed: lesson 1 Learn shows 7248 ÷ 24 = 302; l1-f4 and l1-n5 ask about a dropped zero; l1-f1, l1-s1 and l1-n3 offer a zero that does not belong, with feedback in l1-f1
    - id: remainder-too-big
      what: Leaves a remainder as big as the divisor or bigger
      addressed: lesson 2 Learn says the remainder is always smaller than the divisor; l2-f1 has feedback, l2-s1 and l2-c2 offer a remainder bigger than the divisor
    - id: remainder-over-ten
      what: Writes the remainder as a fraction over 10 or as the digits after the point (32 r 5 as 32.5 for ÷ 12)
      addressed: l2-f2 and l2-f3 have feedback; l2-s2 and l2-c3 offer the tenths answer
    - id: ignores-context
      what: Gives the answer with a remainder when the story needs a whole number, or rounds the wrong way
      addressed: lesson 2 Learn rounds the coaches up; l2-f4 has feedback, l2-s5 and l2-c5 need rounding up, l2-f5, l2-s4 and l2-n2 rounding down
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Teilen Schritt für Schritt", en: "Divide, multiply, subtract, bring down" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "625 ÷ 6 = ?"
            options: ["104 r 1", "14 r 1", "103 r 7"]
            answer: "104 r 1"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "24 × 13 = _"
            answer: "312"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "432 ÷ 12. 12 into 43: 3 times. 3 × 12 = 36. 43 − 36 = 7."
            say: "Four hundred and thirty-two divided by twelve. Twelve does not go into four, so look at forty-three. Twelve goes into forty-three three times. Three twelves are thirty-six. Forty-three take away thirty-six leaves seven."
            show: { drawn: short-division, divisor: 12, dividend: "432", quotient: " 3 " }
          - text: "Bring down the 2: 72. 12 into 72: 6 times. 432 ÷ 12 = 36"
            say: "Bring down the two next to the seven to make seventy-two. Twelve goes into seventy-two six times exactly. So four hundred and thirty-two divided by twelve is thirty-six. Divide, multiply, subtract, bring down: then do it again."
            show: { drawn: short-division, divisor: 12, dividend: "432", quotient: " 36" }
          - text: "Multiples of 15"
            say: "A list of multiples of the divisor makes each step quicker. Write it before you start."
            show: { drawn: table, rows: [["× 1", "× 2", "× 3", "× 4", "× 5", "× 6", "× 7", "× 8", "× 9"], ["15", "30", "45", "60", "75", "90", "105", "120", "135"]] }
          - text: "7248 ÷ 24 = 302"
            say: "Seven thousand two hundred and forty-eight divided by twenty-four. Twenty-four into seventy-two goes three times, nothing left. Bring down the four: twenty-four into four does not go, so write a zero in the answer. Bring down the eight: twenty-four into forty-eight goes twice. The answer is three hundred and two. Never leave out that zero."
            show: { drawn: short-division, divisor: 24, dividend: "7248", quotient: " 302" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "384 ÷ 16 = ?"
                show: { drawn: short-division, divisor: 16, dividend: "384", quotient: " __" }
                options: ["24", "23", "204"]
                answer: "24"
                feedback:
                  "204": "16 into 38 goes 2 times, remainder 6. Bring down the 4 to make 64, and 16 into 64 goes 4 times. No zero is needed."
                hints:
                  - "16 into 38 first. Then bring down the 4."
                  - "16 into 38 goes 2 times: 38 − 32 = 6. Bring down the 4: 64."
                  - "16 into 64 goes 4 times, so the answer is 24."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "676 ÷ 13. 13 into 67 goes 5 times: 5 × 13 = 65."
                frame: "67 − 65 = _, bring down the 6: 26 ÷ 13 = _, so 676 ÷ 13 = _"
                options: ["2", "3", "25", "52"]
                answer: ["2", "2", "52"]
                hints:
                  - "Subtract, then bring down the next digit."
                  - "67 − 65 = 2. With the 6 brought down it is 26."
                  - "26 ÷ 13 = 2, so the answer is 52."
              - id: l1-f3
                type: multiple_choice
                text: "1035 ÷ 15 = ?"
                show: { drawn: table, rows: [["× 1", "× 2", "× 3", "× 4", "× 5", "× 6", "× 7", "× 8", "× 9"], ["15", "30", "45", "60", "75", "90", "105", "120", "135"]] }
                options: ["69", "609", "79"]
                answer: "69"
                hints:
                  - "15 does not go into 10, so start with 103."
                  - "15 into 103: 6 times, 90. 103 − 90 = 13. Bring down the 5: 135."
                  - "15 into 135 is 9 times. The answer is 69."
              - id: l1-f4
                type: true_false
                text: "Is it true? 2592 ÷ 24 = 108"
                answer: true
                hints:
                  - "24 into 25 is 1, remainder 1. Bring down the 9: 19."
                  - "24 into 19 does not go, so write 0. Bring down the 2: 192."
                  - "24 into 192 is 8. Yes, 108."
              - id: l1-f5
                type: text_input
                text: "6552 ÷ 21 = _"
                answer: "312"
                hints:
                  - "21 into 65 first."
                  - "21 into 65 is 3, remainder 2. Bring down the 5: 25, and 21 into 25 is 1, remainder 4."
                  - "Bring down the 2: 42, and 21 into 42 is 2. The answer is 312."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "448 ÷ 14 = ?"
                options: ["32", "31", "302"]
                answer: "32"
                hints: ["14 into 44 is 3, remainder 2. Bring down the 8."]
              - id: l1-s2
                type: text_input
                text: "851 ÷ 23 = _"
                answer: "37"
                hints: ["23 into 85 is 3. 85 − 69 = 16. Bring down the 1."]
              - id: l1-s3
                type: text_input
                text: "4428 ÷ 36 = _"
                answer: "123"
                hints: ["36 into 44 is 1, remainder 8. Bring down the 2: 82."]
              - id: l1-s4
                type: multiple_choice
                text: "Estimate first. About how big is 3920 ÷ 41?"
                options: ["about 100", "about 10", "about 1000"]
                answer: "about 100"
                hints: ["Round 41 to 40. What is 4000 ÷ 40?"]
              - id: l1-s5
                type: true_false
                text: "Is it true? 5040 ÷ 15 = 326"
                answer: false
                hints: ["Check: 326 × 15. Or work it out: 15 into 50 is 3, remainder 5."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "875 ÷ 25 = _"
                answer: "35"
              - id: l1-n2
                type: text_input
                text: "9135 ÷ 35 = _"
                answer: "261"
              - id: l1-n3
                type: multiple_choice
                text: "2706 ÷ 22 = ?"
                options: ["123", "113", "1203"]
                answer: "123"
              - id: l1-n4
                type: text_input
                text: "A school orders 1344 pencils. They come in boxes of 32. How many boxes is that?"
                answer: "42"
              - id: l1-n5
                type: true_false
                text: "Sam says 4836 ÷ 12 = 43. Is he right?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "594 ÷ 18 = _"
            answer: "33"
          - id: l1-c2
            type: multiple_choice
            text: "3864 ÷ 23 = ?"
            options: ["168", "158", "1608"]
            answer: "168"
          - id: l1-c3
            type: true_false
            text: "Is it true? 7500 ÷ 25 = 300"
            answer: true
          - id: l1-c4
            type: text_input
            text: "3608 ÷ 44 = _"
            answer: "82"
          - id: l1-c5
            type: multiple_choice
            text: "4182 ÷ 41 = ?"
            options: ["102", "12", "112"]
            answer: "102"
          - id: l1-c6
            type: true_false
            text: "Is it true? 2268 ÷ 27 = 74"
            answer: false

  - n: 2
    title: { de: Reste angeben, en: Remainders }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "672 ÷ 16 = _"
            answer: "42"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "4920 ÷ 24 = ?"
            options: ["205", "25", "215"]
            answer: "205"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "487 ÷ 15 = 32 r 7"
            say: "Four hundred and eighty-seven divided by fifteen. Fifteen into forty-eight goes three times, remainder three. Bring down the seven: thirty-seven. Fifteen into thirty-seven goes twice, remainder seven. So the answer is thirty-two remainder seven. A remainder is always smaller than the divisor."
            show: { drawn: short-division, divisor: 15, dividend: "487", quotient: " 32", remainder: 7 }
          - text: "32 r 7 = 32 7/15"
            say: "You can write the remainder as a fraction. Seven is left over, to be shared by fifteen: seven fifteenths. So it is thirty-two and seven fifteenths."
          - text: "435 ÷ 12 = 36 r 3 = 36 3/12 = 36 1/4 = 36.25"
            say: "Or give it as a decimal. Four hundred and thirty-five divided by twelve is thirty-six remainder three. Three twelfths is one quarter, and one quarter is nought point two five. So the answer is thirty-six point two five. You can also carry on dividing after a decimal point."
          - text: "500 children, 48 seats on a coach: 500 ÷ 48 = 10 r 20, so 11 coaches"
            say: "In a story, think about what the remainder means. Five hundred children go on a trip. A coach seats forty-eight. Five hundred divided by forty-eight is ten remainder twenty. Twenty children still need a seat, so you need eleven coaches. Sometimes you round up, sometimes down."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "625 ÷ 24 = ?"
                options: ["26 r 1", "25 r 25", "26 r 2"]
                answer: "26 r 1"
                feedback:
                  "25 r 25": "A remainder of 25 is bigger than 24, so 24 goes in once more."
                hints:
                  - "24 into 62 first, then bring down the 5."
                  - "24 into 62 is 2, remainder 14. Bring down the 5: 145."
                  - "24 into 145 is 6, which is 144. Remainder 1: 26 r 1."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "389 ÷ 12 = 32 r 5. Write the answer as a mixed number."
                say: "Three hundred and eighty-nine divided by twelve is thirty-two remainder five. Write the answer as a mixed number."
                options: ["32 5/12", "32 5/10", "32 12/5"]
                answer: "32 5/12"
                option_audio: false
                feedback:
                  "32 5/10": "The 5 left over is shared by 12, not by 10. It is 5/12."
                hints:
                  - "The remainder is shared by the divisor."
                  - "5 left over, divided by 12."
                  - "32 5/12."
              - id: l2-f3
                type: text_input
                text: "918 ÷ 12 = 76 r 6. Write the answer as a decimal."
                keyboard: decimal
                answer: "76.5"
                feedback:
                  "76.6": "The remainder 6 is not 6 tenths. 6/12 is a half."
                hints:
                  - "Write the remainder as a fraction of 12 first."
                  - "6/12 = 1/2."
                  - "1/2 = 0.5, so 76.5."
              - id: l2-f4
                type: multiple_choice
                text: "350 people go to a match. A minibus holds 16 people. How many minibuses are needed?"
                options: ["22", "21", "21 r 14"]
                answer: "22"
                feedback:
                  "21": "21 minibuses leave 14 people behind. They need one more minibus."
                hints:
                  - "Work out 350 ÷ 16."
                  - "350 ÷ 16 = 21 r 14. What about the 14 people left?"
                  - "They need a bus too: 22."
              - id: l2-f5
                type: text_input
                text: "A baker has 1000 g of flour. Each loaf needs 75 g. How many whole loaves can she make?"
                answer: "13"
                hints:
                  - "Work out 1000 ÷ 75."
                  - "75 × 13 = 975, and 25 g is left."
                  - "25 g is not enough for a loaf, so 13."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "763 ÷ 18 = ?"
                options: ["42 r 7", "41 r 25", "43 r 7"]
                answer: "42 r 7"
                hints: ["The remainder must be less than 18."]
              - id: l2-s2
                type: multiple_choice
                text: "1250 ÷ 24 = 52 r 2. Write the answer as a mixed number in its simplest form."
                say: "One thousand two hundred and fifty divided by twenty-four is fifty-two remainder two. Write the answer as a mixed number in its simplest form."
                options: ["52 1/12", "52 2/10", "52 1/2"]
                answer: "52 1/12"
                option_audio: false
                hints: ["2/24 simplifies to 1/12."]
              - id: l2-s3
                type: text_input
                text: "1170 ÷ 25 = 46 r 20. Write the answer as a decimal."
                keyboard: decimal
                answer: "46.8"
                hints: ["20/25 = 80/100."]
              - id: l2-s4
                type: text_input
                text: "Eggs are packed in boxes of 12. There are 400 eggs. How many boxes can be filled?"
                answer: "33"
                hints: ["400 ÷ 12 = 33 r 4. Is a box with 4 eggs full?"]
              - id: l2-s5
                type: multiple_choice
                text: "A ferry takes 45 cars on each trip. 1000 cars are waiting. How many trips does it make?"
                options: ["23", "22", "22 r 10"]
                answer: "23"
                hints: ["1000 ÷ 45 = 22 r 10. The last 10 cars need a trip too."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "£1035 is shared equally between 18 people. How much does each person get?"
                options: ["£57.50", "£57.09", "£58"]
                answer: "£57.50"
              - id: l2-n2
                type: text_input
                text: "A rope is 940 cm long. It is cut into pieces 16 cm long. How many whole pieces are there?"
                answer: "58"
              - id: l2-n3
                type: multiple_choice
                text: "1500 stickers are shared equally between 32 children. How many does each get, and how many are left?"
                options: ["46 each, 28 left", "46 each, 8 left", "47 each, 4 left"]
                answer: "46 each, 28 left"
              - id: l2-n4
                type: text_input
                text: "1386 kg of sand fills 12 bags equally. How many kg go in each bag?"
                keyboard: decimal
                answer: "115.5"
              - id: l2-n5
                type: true_false
                text: "Is it true? 636 children need exactly 12 coaches if each coach holds 53 children."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: divide
            type: text_input
            text: "4554 ÷ 18 = _"
            answer: "253"
          - id: l2-c2
            part: remainder
            type: multiple_choice
            text: "914 ÷ 21 = ?"
            options: ["43 r 11", "42 r 32", "43 r 1"]
            answer: "43 r 11"
          - id: l2-c3
            part: fraction-decimal
            type: multiple_choice
            text: "545 ÷ 15 = 36 r 5. Write the answer as a mixed number in its simplest form."
            say: "Five hundred and forty-five divided by fifteen is thirty-six remainder five. Write the answer as a mixed number in its simplest form."
            options: ["36 1/3", "36 5/10", "36 1/5"]
            answer: "36 1/3"
            option_audio: false
          - id: l2-c4
            part: fraction-decimal
            type: text_input
            text: "2010 ÷ 24 = 83 r 18. Write the answer as a decimal."
            keyboard: decimal
            answer: "83.75"
          - id: l2-c5
            part: in-context
            type: text_input
            text: "A theatre has rows of 28 seats. 750 people come. How many rows are needed?"
            answer: "27"
          - id: l2-c6
            part: divide
            type: text_input
            text: "2958 ÷ 34 = _"
            answer: "87"
          - id: l2-c7
            part: divide
            type: multiple_choice
            text: "6936 ÷ 34 = ?"
            options: ["204", "24", "214"]
            answer: "204"
          - id: l2-c8
            part: divide
            type: true_false
            text: "Is it true? 1748 ÷ 19 = 92"
            answer: true
          - id: l2-c9
            part: divide
            type: text_input
            text: "5625 ÷ 45 = _"
            answer: "125"
          - id: l2-c10
            part: remainder
            type: multiple_choice
            text: "800 ÷ 17 = ?"
            options: ["47 r 1", "46 r 18", "47 r 11"]
            answer: "47 r 1"
          - id: l2-c11
            part: remainder
            type: fill_in_blank
            text: "1000 ÷ 27 = ?"
            frame: "1000 ÷ 27 = _ r _"
            options: ["37", "1", "36", "28"]
            answer: ["37", "1"]
          - id: l2-c12
            part: remainder
            type: true_false
            text: "Is it true? 653 ÷ 25 = 25 r 28"
            answer: false
          - id: l2-c13
            part: remainder
            type: multiple_choice
            text: "3000 ÷ 64 = ?"
            options: ["46 r 56", "47 r 8", "46 r 6"]
            answer: "46 r 56"
          - id: l2-c14
            part: fraction-decimal
            type: multiple_choice
            text: "711 ÷ 14 = 50 r 11. Write the answer as a mixed number."
            say: "Seven hundred and eleven divided by fourteen is fifty remainder eleven. Write the answer as a mixed number."
            options: ["50 11/14", "50 11/10", "50 14/11"]
            answer: "50 11/14"
            option_audio: false
          - id: l2-c15
            part: fraction-decimal
            type: text_input
            text: "1554 ÷ 40 = 38 r 34. Write the answer as a decimal."
            keyboard: decimal
            answer: "38.85"
          - id: l2-c16
            part: fraction-decimal
            type: true_false
            text: "Is it true? 870 ÷ 16 = 54 r 6, so as a decimal the answer is 54.6."
            answer: false
          - id: l2-c17
            part: in-context
            type: text_input
            text: "A school has £2500 to spend on tents. A tent costs £36. How many tents can it buy?"
            say: "A school has two thousand five hundred pounds to spend on tents. A tent costs thirty-six pounds. How many tents can it buy?"
            answer: "69"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "A lift carries 13 people at a time. 200 people need to go up. How many trips must the lift make?"
            options: ["16", "15", "15 r 5"]
            answer: "16"
          - id: l2-c19
            part: in-context
            type: text_input
            text: "Pencils are sold in packs of 24. A teacher has 1000 pencils to pack. How many full packs can she make?"
            answer: "41"
          - id: l2-c20
            part: in-context
            type: multiple_choice
            text: "One tin of paint covers 24 m². The walls of a hall measure 1170 m². How many tins are needed?"
            options: ["49", "48", "48 r 18"]
            answer: "49"
