# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.fraction-as-division
skill: math.decimals.fraction-as-division
curriculum: en-GB
language: en
title:
  de: Bruch als Division
  en: Fractions as division
summary: >
  A fraction is a division: 3/4 means 3 ÷ 4. Lesson 1 shares things
  equally (3 pizzas between 4 children is 3/4 of a pizza each) and writes
  divisions as fractions and mixed numbers. Lesson 2 divides the
  numerator by the denominator with short division to find the decimal
  (3/8 = 3 ÷ 8 = 0.375), and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Dezimalzahlen, en: Decimals }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.decimals.calculate]
  also_practises: [math.decimals.calculate]
  vocabulary: { en: [fraction, numerator, denominator, divide, share equally, decimal, decimal point, tenths, hundredths, thousandths] }
  forms: [drawn, text, audio]
  drawn: [fraction, short-division]
  facets: [number-format]
  parts:
    - { id: division, what: { de: einen Bruch als Division schreiben und umgekehrt, en: writing a fraction as a division and a division as a fraction } }
    - { id: sharing, what: { de: gerecht teilen und den Anteil als Bruch angeben, en: sharing equally and giving each share as a fraction } }
    - { id: mixed, what: { de: eine Division als gemischte Zahl schreiben, en: writing a division as a mixed number } }
    - { id: decimal, what: { de: einen Bruch in eine Dezimalzahl umwandeln, en: changing a fraction into a decimal } }
  misconceptions:
    - id: divides-wrong-way
      what: Divides the denominator by the numerator (3/4 as 4 ÷ 3)
      addressed: lesson 1 Learn says the top number is shared by the bottom number; l1-f2 has feedback, l1-s2, l1-n1 and l2-c1 offer the reversed division
    - id: digits-as-decimal
      what: Writes the digits of the fraction after the point (3/4 = 0.34, 1/5 = 0.15)
      addressed: l2-f1 and l2-f3 have feedback; l2-s1, l2-n2 and l2-c2 offer the digit answer
    - id: share-must-be-whole
      what: Thinks a share must be a whole number, or says 3 ÷ 4 cannot be done
      addressed: lesson 1 Learn cuts each pizza into quarters; l1-f1 and l1-f4 share fewer things than people
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Teilen und Brüche, en: Sharing and fractions }
    goal:
      de: "Sieh einen Bruch als Teilung: 3 Pizzas für 4 Kinder heißt 3 geteilt durch 4, also bekommt jedes Kind 3 Viertel."
      en: "See a fraction as a division, so 3 pizzas shared between 4 children gives 3 quarters of a pizza each."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "7 ÷ 2 = _"
            keyboard: decimal
            answer: "3.5"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is 0.25 as a fraction?"
            options: ["1/4", "1/25", "2/5"]
            answer: "1/4"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 pizzas, 4 children"
            say: "Three pizzas are shared equally between four children. There is not a whole pizza for each child. So cut every pizza into quarters."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
          - text: "3 ÷ 4 = 3/4"
            say: "There are twelve quarters, and each child gets three of them: three quarters of a pizza. So three divided by four is three quarters. The numerator is divided by the denominator."
          - text: "2/5 = 2 ÷ 5    5/2 = 5 ÷ 2"
            say: "Every fraction is a division. Two fifths is two divided by five. Five halves is five divided by two. Read the top number first: it is the number being shared."
          - text: "7 ÷ 3 = 7/3 = 2 1/3"
            say: "Seven divided by three is seven thirds. Three goes into seven twice with one left over, and the one left over is shared too: one third. So it is two and one third."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "2 cakes are shared equally between 3 friends. How much does each friend get?"
                options: ["2/3 of a cake", "3/2 of a cake", "1/3 of a cake"]
                answer: "2/3 of a cake"
                option_audio: false
                hints:
                  - "The cakes are divided by the number of friends."
                  - "2 ÷ 3. The number shared goes on top."
                  - "2 ÷ 3 = 2/3 of a cake."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which division is the same as 3/5?"
                options: ["3 ÷ 5", "5 ÷ 3", "3 × 5"]
                answer: "3 ÷ 5"
                feedback:
                  "5 ÷ 3": "That is the wrong way round. The numerator, 3, is divided by the denominator, 5."
                hints:
                  - "A fraction is the numerator divided by the denominator."
                  - "The numerator is 3 and the denominator is 5."
                  - "3 ÷ 5."
              - id: l1-f3
                type: fill_in_blank
                text: "Write the division as a fraction."
                frame: "4 ÷ 7 = _"
                options: ["4/7", "7/4", "4/11"]
                answer: ["4/7"]
                option_audio: false
                hints:
                  - "The number being divided goes on top."
                  - "4 is divided, so 4 is the numerator."
                  - "4/7."
              - id: l1-f4
                type: true_false
                text: "Is it true? 5 sandwiches shared equally between 8 children is 5/8 of a sandwich each."
                answer: true
                hints:
                  - "Write the sharing as a division."
                  - "5 sandwiches ÷ 8 children."
                  - "Yes, 5 ÷ 8 = 5/8."
              - id: l1-f5
                type: multiple_choice
                text: "9 ÷ 4 = ? Write it as a mixed number."
                options: ["2 1/4", "4/9", "2 4/9"]
                answer: "2 1/4"
                option_audio: false
                say: "Nine divided by four. Write it as a mixed number."
                hints:
                  - "How many whole fours go into 9? What is left?"
                  - "4 goes into 9 twice, with 1 left over."
                  - "The 1 left over is shared by 4: 2 1/4."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "3 pies are shared equally between 5 people. How much does each person get?"
                options: ["3/5 of a pie", "5/3 of a pie", "1/5 of a pie"]
                answer: "3/5 of a pie"
                option_audio: false
                hints: ["3 ÷ 5."]
              - id: l1-s2
                type: multiple_choice
                text: "Which division is the same as 7/10?"
                options: ["7 ÷ 10", "10 ÷ 7", "10 − 7"]
                answer: "7 ÷ 10"
                hints: ["Numerator ÷ denominator."]
              - id: l1-s3
                type: fill_in_blank
                text: "Write the division as a fraction."
                frame: "1 ÷ 6 = _"
                options: ["1/6", "6/1", "1/7"]
                answer: ["1/6"]
                option_audio: false
                hints: ["1 is divided, so 1 goes on top."]
              - id: l1-s4
                type: multiple_choice
                text: "11 ÷ 3 = ? Write it as a mixed number."
                say: "Eleven divided by three. Write it as a mixed number."
                options: ["3 2/3", "3 1/3", "3/11"]
                answer: "3 2/3"
                option_audio: false
                hints: ["3 goes into 11 three times. How many are left?"]
              - id: l1-s5
                type: true_false
                text: "Is it true? 4/9 is the same as 9 ÷ 4."
                answer: false
                hints: ["Which number is divided in a fraction?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which division is the same as 2/9?"
                options: ["2 ÷ 9", "9 ÷ 2", "9 × 2"]
                answer: "2 ÷ 9"
              - id: l1-n2
                type: multiple_choice
                text: "4 litres of juice are poured equally into 5 jugs. How much goes in each jug?"
                options: ["4/5 of a litre", "5/4 of a litre", "1/4 of a litre"]
                answer: "4/5 of a litre"
                option_audio: false
              - id: l1-n3
                type: text_input
                text: "13 ÷ 5 = ? Write it as a mixed number."
                say: "Thirteen divided by five. Write it as a mixed number."
                keyboard: fraction
                answer: "2 3/5"
              - id: l1-n4
                type: fill_in_blank
                text: "Write the division as a fraction."
                frame: "8 ÷ 3 = _"
                options: ["8/3", "3/8", "8/11"]
                answer: ["8/3"]
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Is it true? 6 ribbons shared equally between 4 children is 1 1/2 ribbons each."
                say: "Is it true? Six ribbons shared equally between four children is one and a half ribbons each."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which division is the same as 5/6?"
            options: ["5 ÷ 6", "6 ÷ 5", "6 − 5"]
            answer: "5 ÷ 6"
          - id: l1-c2
            type: multiple_choice
            text: "3 melons are shared equally between 8 people. How much does each person get?"
            options: ["3/8 of a melon", "8/3 of a melon", "1/8 of a melon"]
            answer: "3/8 of a melon"
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "7 ÷ 2 = ? Write it as a mixed number."
            say: "Seven divided by two. Write it as a mixed number."
            options: ["3 1/2", "2 1/2", "2/7"]
            answer: "3 1/2"
            option_audio: false
          - id: l1-c4
            type: text_input
            text: "Write 6 ÷ 11 as a fraction."
            keyboard: fraction
            answer: "6/11"
          - id: l1-c5
            type: true_false
            text: "Is it true? 5 ÷ 8 = 8/5"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "9 apples are shared equally between 2 children. How many apples does each child get?"
            options: ["4 1/2", "2/9", "4 1/9"]
            answer: "4 1/2"
            option_audio: false

  - n: 2
    title: { de: Vom Bruch zur Dezimalzahl, en: From fraction to decimal }
    goal:
      de: "Teil den Zähler durch den Nenner, um aus einem Bruch eine Dezimalzahl zu machen, so wie 3 Achtel gleich 0,375."
      en: "Divide the top number by the bottom number to turn a fraction into a decimal, like 3 eighths is 0.375."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which division is the same as 4/5?"
            options: ["4 ÷ 5", "5 ÷ 4", "4 × 5"]
            answer: "4 ÷ 5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "5 ÷ 2 = ? Write it as a mixed number."
            say: "Five divided by two. Write it as a mixed number."
            options: ["2 1/2", "2/5", "1 1/2"]
            answer: "2 1/2"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3/4 = 3 ÷ 4 = 0.75"
            say: "To change a fraction into a decimal, divide the numerator by the denominator. Three divided by four: write three as three point zero zero. Four into three does not go, so write nought point. Four into thirty goes seven times, remainder two. Four into twenty goes five times. Three quarters is nought point seven five."
            show: { drawn: short-division, divisor: 4, dividend: "3.00", quotient: "0.75", carries: "  32" }
          - text: "3/8 = 3 ÷ 8 = 0.375"
            say: "Three eighths is three divided by eight. Write three as three point zero zero zero. Eight into thirty goes three times, remainder six. Eight into sixty goes seven times, remainder four. Eight into forty goes five times. So three eighths is nought point three seven five."
            show: { drawn: short-division, divisor: 8, dividend: "3.000", quotient: "0.375", carries: "  364" }
          - text: "1/5 = 2/10 = 0.2"
            say: "Sometimes there is a quicker way. If you can make the denominator ten or a hundred, the decimal is easy to read. One fifth is two tenths, which is nought point two."
          - text: "3/4 is not 0.34"
            say: "Do not just write the digits after the point. Three quarters is not nought point three four. Always divide."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What is 1/4 as a decimal?"
                options: ["0.25", "0.14", "1.4"]
                answer: "0.25"
                feedback:
                  "0.14": "That writes the digits after the point. Divide 1 by 4 instead."
                hints:
                  - "Divide the numerator by the denominator: 1 ÷ 4."
                  - "4 into 10 goes 2 times, remainder 2. 4 into 20 goes 5 times."
                  - "1/4 = 0.25."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Change 3/5 into a decimal."
                frame: "3/5 = _/10 = _"
                options: ["6", "0.6", "0.35", "3"]
                answer: ["6", "0.6"]
                hints:
                  - "Make the denominator 10."
                  - "Multiply top and bottom by 2."
                  - "6/10 = 0.6."
              - id: l2-f3
                type: multiple_choice
                text: "What is 1/8 as a decimal?"
                show: { drawn: short-division, divisor: 8, dividend: "1.000", quotient: "0.___" }
                options: ["0.125", "0.18", "0.8"]
                answer: "0.125"
                feedback:
                  "0.18": "The digits 1 and 8 were written after the point. Work out 1 ÷ 8."
                hints:
                  - "Work out 1 ÷ 8. Write 1 as 1.000."
                  - "8 into 10 is 1 r 2. 8 into 20 is 2 r 4. 8 into 40 is 5."
                  - "1/8 = 0.125."
              - id: l2-f4
                type: text_input
                text: "Change 7/20 into a decimal."
                keyboard: decimal
                answer: "0.35"
                hints:
                  - "You could make the denominator 100."
                  - "Multiply top and bottom by 5: 35/100."
                  - "35 hundredths is 0.35."
              - id: l2-f5
                type: true_false
                text: "Is it true? 1/2 = 0.5"
                answer: true
                hints:
                  - "Work out 1 ÷ 2."
                  - "1 is 10 tenths. 10 tenths ÷ 2 = 5 tenths."
                  - "Yes, 0.5."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "What is 3/4 as a decimal?"
                options: ["0.75", "0.34", "0.43"]
                answer: "0.75"
                hints: ["3 ÷ 4."]
              - id: l2-s2
                type: text_input
                text: "What is 2/5 as a decimal?"
                keyboard: decimal
                answer: "0.4"
                hints: ["2/5 = 4/10."]
              - id: l2-s3
                type: multiple_choice
                text: "What is 3/8 as a decimal?"
                options: ["0.375", "0.38", "0.83"]
                answer: "0.375"
                hints: ["Work out 3 ÷ 8, writing 3 as 3.000."]
              - id: l2-s4
                type: text_input
                text: "What is 9/25 as a decimal?"
                keyboard: decimal
                answer: "0.36"
                hints: ["Multiply top and bottom by 4 to make hundredths."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 1/5 = 0.15"
                answer: false
                hints: ["1/5 = 2/10."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "What is 5/8 as a decimal?"
                keyboard: decimal
                answer: "0.625"
              - id: l2-n2
                type: multiple_choice
                text: "What is 4/5 as a decimal?"
                options: ["0.8", "0.45", "0.54"]
                answer: "0.8"
              - id: l2-n3
                type: text_input
                text: "Write 7 ÷ 4 as a decimal."
                keyboard: decimal
                answer: "1.75"
              - id: l2-n4
                type: multiple_choice
                text: "Which is bigger: 3/8 or 0.4?"
                options: ["0.4", "3/8", "they are the same"]
                answer: "0.4"
                option_audio: false
                keep_order: true
              - id: l2-n5
                type: text_input
                text: "3 m of ribbon is cut into 8 equal pieces. How long is each piece, in m?"
                keyboard: decimal
                answer: "0.375"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: division
            type: multiple_choice
            text: "Which division is the same as 6/7?"
            options: ["6 ÷ 7", "7 ÷ 6", "7 − 6"]
            answer: "6 ÷ 7"
          - id: l2-c2
            part: decimal
            type: multiple_choice
            text: "What is 1/5 as a decimal?"
            options: ["0.2", "0.15", "0.5"]
            answer: "0.2"
          - id: l2-c3
            part: decimal
            type: text_input
            text: "What is 7/8 as a decimal?"
            keyboard: decimal
            answer: "0.875"
          - id: l2-c4
            part: sharing
            type: multiple_choice
            text: "4 pizzas are shared equally between 5 children. How much does each child get?"
            options: ["4/5 of a pizza", "5/4 of a pizza", "1/5 of a pizza"]
            answer: "4/5 of a pizza"
            option_audio: false
          - id: l2-c5
            part: decimal
            type: text_input
            text: "What is 3/20 as a decimal?"
            keyboard: decimal
            answer: "0.15"
          - id: l2-c6
            part: division
            type: text_input
            text: "Write 4 ÷ 11 as a fraction."
            keyboard: fraction
            answer: "4/11"
          - id: l2-c7
            part: division
            type: true_false
            text: "Is it true? 8 ÷ 9 = 9/8"
            answer: false
          - id: l2-c8
            part: division
            type: multiple_choice
            text: "Which fraction is the same as 10 ÷ 3?"
            options: ["10/3", "3/10", "13/3"]
            answer: "10/3"
            option_audio: false
          - id: l2-c9
            part: division
            type: multiple_choice
            text: "Which is not the same as 3/10?"
            options: ["10 ÷ 3", "3 ÷ 10", "0.3"]
            answer: "10 ÷ 3"
          - id: l2-c10
            part: sharing
            type: text_input
            text: "5 chocolate bars are shared equally between 6 children. What fraction of a bar does each child get?"
            keyboard: fraction
            answer: "5/6"
          - id: l2-c11
            part: sharing
            type: multiple_choice
            text: "7 m of rope is cut into 4 equal pieces. How long is each piece?"
            options: ["1 3/4 m", "4/7 m", "1 1/4 m"]
            answer: "1 3/4 m"
            option_audio: false
          - id: l2-c12
            part: sharing
            type: true_false
            text: "Is it true? 2 pizzas shared equally between 6 children is 1/3 of a pizza each."
            answer: true
          - id: l2-c13
            part: sharing
            type: multiple_choice
            text: "Some cakes are shared equally between 4 friends. Each friend gets 3/4 of a cake. How many cakes were there?"
            options: ["3", "4", "12"]
            answer: "3"
          - id: l2-c14
            part: mixed
            type: multiple_choice
            text: "17 ÷ 5 = ? Write it as a mixed number."
            say: "Seventeen divided by five. Write it as a mixed number."
            options: ["3 2/5", "2 3/5", "5/17"]
            answer: "3 2/5"
            option_audio: false
          - id: l2-c15
            part: mixed
            type: text_input
            text: "23 ÷ 4 = ? Write it as a mixed number."
            say: "Twenty-three divided by four. Write it as a mixed number."
            keyboard: fraction
            answer: "5 3/4"
          - id: l2-c16
            part: mixed
            type: true_false
            text: "Is it true? 10 ÷ 3 = 3 1/3"
            say: "Is it true? Ten divided by three is three and one third."
            answer: true
          - id: l2-c17
            part: mixed
            type: multiple_choice
            text: "Which division gives 4 1/2?"
            options: ["9 ÷ 2", "4 ÷ 2", "2 ÷ 9"]
            answer: "9 ÷ 2"
          - id: l2-c18
            part: mixed
            type: multiple_choice
            text: "15 sausages are shared equally between 4 people. How many sausages does each person get?"
            options: ["3 3/4", "3 1/4", "4/15"]
            answer: "3 3/4"
            option_audio: false
          - id: l2-c19
            part: decimal
            type: multiple_choice
            text: "What is 3/25 as a decimal?"
            options: ["0.12", "0.325", "0.3"]
            answer: "0.12"
          - id: l2-c20
            part: decimal
            type: text_input
            text: "Write 9 ÷ 4 as a decimal."
            keyboard: decimal
            answer: "2.25"
