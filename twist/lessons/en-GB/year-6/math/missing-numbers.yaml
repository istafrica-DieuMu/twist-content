# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.missing-numbers
skill: math.algebra.missing-numbers
curriculum: en-GB
language: en
title:
  de: Platzhalter mit Buchstaben
  en: Missing numbers with letters
summary: >
  Equations where a letter stands for the missing number. Lesson 1 solves
  one-step equations (n + 7 = 15, 4n = 28, n ÷ 3 = 6) with the inverse
  operation and writes "I think of a number" puzzles as equations; lesson
  2 solves two-step equations (3n + 4 = 19) by undoing the steps in
  reverse order, checks by substituting, writes equations for word
  problems, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Terme und Gleichungen, en: Algebra }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.add-sub-to-100.equations, math.mult-div-larger.order-of-operations]
  also_practises: [math.mult-div-larger.order-of-operations]
  vocabulary: { en: [equation, letter, unknown, solve, inverse operation, substitute, check] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: one-step, what: { de: Gleichungen mit einem Rechenschritt lösen, en: solving one-step equations with a letter } }
    - { id: two-step, what: { de: Gleichungen mit zwei Rechenschritten lösen, en: solving two-step equations } }
    - { id: write, what: { de: eine Gleichung zu einem Rätsel oder einer Sachaufgabe aufstellen, en: writing an equation for a number puzzle or word problem } }
    - { id: check, what: { de: eine Lösung durch Einsetzen prüfen, en: checking a solution by substituting it for the letter } }
  misconceptions:
    - id: letter-term-as-add
      what: Reads 5n = 35 as 5 + n = 35 and gives n = 30
      addressed: lesson 1 Learn says 4n means 4 × n; l1-f2 has feedback, l1-c2 and l2-c2 offer the subtracted answer
    - id: same-operation
      what: Does the same operation instead of the inverse (k ÷ 5 = 9 gives k = 9 ÷ 5; 2n + 5 = 17 gives 2n = 22)
      addressed: lesson 1 Learn undoes each operation; l1-f3 asks which operation undoes ÷ 4; l2-f1 has feedback on 22, l2-f2, l2-s4 and l2-s5 offer the added result
    - id: wrong-order
      what: Divides first in 3n + 4 = 19, or writes 3(n + 4) for "multiply by 3 and add 4"
      addressed: lesson 2 Learn undoes the steps in reverse order; l2-f3 asks what to do first, l2-s3 and l2-c4 offer the bracket form
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ein Schritt", en: "One step" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Find the missing number."
            frame: "45 + _ = 72"
            options: ["27", "37", "117"]
            answer: ["27"]
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "4 + 5 × 3 = _"
            answer: "19"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "n + 7 = 15\nn = 15 − 7 = 8"
            say: "A letter can stand for a missing number. n add seven equals fifteen. To find n, undo the add seven by subtracting seven. Fifteen subtract seven is eight, so n equals eight."
          - text: "4n = 28\nn = 28 ÷ 4 = 7"
            say: "Four n means four times n. Undo the times four by dividing by four. Twenty-eight divided by four is seven."
          - text: "n ÷ 3 = 6\nn = 6 × 3 = 18"
            say: "n divided by three equals six. Undo the divide by multiplying: six times three is eighteen."
          - text: "I think of a number and add 9. I get 23.\nn + 9 = 23, so n = 14"
            say: "A number puzzle can be written as an equation. Call the number n. n add nine equals twenty-three, so n is twenty-three subtract nine, which is fourteen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "n + 12 = 30. n = _"
                say: "n add twelve equals thirty. What is n?"
                answer: "18"
                hints:
                  - "Undo the add 12."
                  - "Subtract 12 from 30."
                  - "30 − 12 = 18."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "5n = 35. What is n?"
                say: "Five n equals thirty-five. What is n?"
                options: ["7", "30", "175"]
                answer: "7"
                feedback:
                  "30": "5n means 5 × n, not 5 + n. Divide 35 by 5."
                  "175": "That multiplies by 5. Undo × 5 by dividing by 5."
                hints:
                  - "5n means 5 × n."
                  - "Undo × 5 by dividing: 35 ÷ 5."
                  - "n = 7."
              - id: l1-f3
                type: multiple_choice
                text: "Which operation undoes ÷ 4?"
                options: ["× 4", "− 4", "+ 4"]
                answer: "× 4"
                hints:
                  - "Multiplying and dividing undo each other."
                  - "12 ÷ 4 = 3. What gets you from 3 back to 12?"
                  - "× 4."
              - id: l1-f4
                type: text_input
                text: "a − 15 = 26. a = _"
                say: "a subtract fifteen equals twenty-six. What is a?"
                answer: "41"
                hints:
                  - "Undo the subtract 15."
                  - "Add 15 to 26."
                  - "26 + 15 = 41."
              - id: l1-f5
                type: multiple_choice
                text: "I think of a number and multiply it by 6. I get 54. Which equation fits?"
                options: ["6n = 54", "n + 6 = 54", "n ÷ 6 = 54"]
                answer: "6n = 54"
                hints:
                  - "What happens to the number?"
                  - "It is multiplied by 6, and 6 × n is written 6n."
                  - "6n = 54."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "y + 27 = 50. y = _"
                say: "y add twenty-seven equals fifty. What is y?"
                answer: "23"
                hints: ["50 − 27."]
              - id: l1-s2
                type: text_input
                text: "8m = 72. m = _"
                say: "Eight m equals seventy-two. What is m?"
                answer: "9"
                hints: ["Undo × 8 by dividing by 8."]
              - id: l1-s3
                type: multiple_choice
                text: "k ÷ 5 = 9. What is k?"
                say: "k divided by five equals nine. What is k?"
                options: ["45", "14", "4"]
                answer: "45"
                hints: ["Undo ÷ 5 by multiplying by 5."]
              - id: l1-s4
                type: multiple_choice
                text: "I think of a number and subtract 13. I get 29. Which equation fits?"
                options: ["n − 13 = 29", "13 − n = 29", "n + 13 = 29"]
                answer: "n − 13 = 29"
                hints: ["Start with the number n, then take 13 away."]
              - id: l1-s5
                type: true_false
                text: "Is it true? If 7p = 63, then p = 9."
                say: "If seven p equals sixty-three, then p equals nine. Is it true?"
                answer: true
                hints: ["Check: 7 × 9."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "b − 38 = 47. b = _"
                say: "b subtract thirty-eight equals forty-seven. What is b?"
                answer: "85"
              - id: l1-n2
                type: text_input
                text: "12t = 84. t = _"
                say: "Twelve t equals eighty-four. What is t?"
                answer: "7"
              - id: l1-n3
                type: multiple_choice
                text: "w ÷ 8 = 7. What is w?"
                say: "w divided by eight equals seven. What is w?"
                options: ["56", "15", "1"]
                answer: "56"
              - id: l1-n4
                type: true_false
                text: "Is it true? If x + 45 = 100, then x = 65."
                say: "If x add forty-five equals one hundred, then x equals sixty-five. Is it true?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Ben gives away 18 stickers and has 35 left. He had s stickers. Which is right?"
                options: ["s − 18 = 35, so s = 53", "s + 18 = 35, so s = 17", "s − 35 = 18, so s = 17"]
                answer: "s − 18 = 35, so s = 53"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "n + 19 = 41. n = _"
            say: "n add nineteen equals forty-one. What is n?"
            answer: "22"
          - id: l1-c2
            type: multiple_choice
            text: "9n = 54. What is n?"
            say: "Nine n equals fifty-four. What is n?"
            options: ["6", "45", "486"]
            answer: "6"
          - id: l1-c3
            type: text_input
            text: "q ÷ 4 = 12. q = _"
            say: "q divided by four equals twelve. What is q?"
            answer: "48"
          - id: l1-c4
            type: true_false
            text: "Is it true? If d − 24 = 39, then d = 15."
            say: "If d subtract twenty-four equals thirty-nine, then d equals fifteen. Is it true?"
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "I think of a number and add 16. I get 40. Which equation fits?"
            options: ["n + 16 = 40", "16n = 40", "n − 16 = 40"]
            answer: "n + 16 = 40"
          - id: l1-c6
            type: text_input
            text: "6z = 66. z = _"
            say: "Six z equals sixty-six. What is z?"
            answer: "11"

  - n: 2
    title: { de: "Zwei Schritte", en: "Two steps" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "6n = 42. n = _"
            say: "Six n equals forty-two. What is n?"
            answer: "7"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "m − 25 = 40. What is m?"
            say: "m subtract twenty-five equals forty. What is m?"
            options: ["65", "15", "55"]
            answer: "65"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3n + 4 = 19"
            say: "Here n is multiplied by three, and then four is added. To find n, undo the steps in reverse order: first undo the add four, then undo the times three."
          - text: "3n + 4 = 19\n3n = 19 − 4 = 15\nn = 15 ÷ 3 = 5"
            say: "Subtract four from both sides: three n equals fifteen. Then divide by three: n equals five."
          - text: "Check: 3 × 5 + 4 = 15 + 4 = 19"
            say: "Check by putting five in place of n. Three times five add four is nineteen, so the answer is right."
          - text: "I think of a number, multiply it by 4 and subtract 7. I get 25.\n4n − 7 = 25\n4n = 32, n = 8"
            say: "Write the puzzle as an equation: four n subtract seven equals twenty-five. Undo the subtract seven by adding seven: four n equals thirty-two. Then divide by four: n equals eight."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Solve 2n + 5 = 17."
                say: "Solve two n add five equals seventeen."
                frame: "2n = 17 − 5 = _, so n = _"
                options: ["12", "6", "22", "11"]
                answer: ["12", "6"]
                feedback:
                  "22": "Undo the + 5 by subtracting 5, not adding it."
                hints:
                  - "Undo the + 5 first."
                  - "17 − 5 = 12, so 2n = 12."
                  - "12, then n = 12 ÷ 2 = 6."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Solve 4n − 3 = 25. What is n?"
                say: "Solve four n subtract three equals twenty-five. What is n?"
                options: ["7", "5.5", "22"]
                answer: "7"
                feedback:
                  "5.5": "That subtracts 3 again. Undo − 3 by adding 3: 4n = 28."
                hints:
                  - "Undo the − 3 first, by adding 3."
                  - "25 + 3 = 28, so 4n = 28."
                  - "28 ÷ 4 = 7."
              - id: l2-f3
                type: multiple_choice
                text: "To solve 5n + 2 = 37, what do you do first?"
                say: "To solve five n add two equals thirty-seven, what do you do first?"
                options: ["subtract 2", "divide by 5", "add 2"]
                answer: "subtract 2"
                hints:
                  - "Undo the steps in reverse order."
                  - "The last thing done to n was + 2."
                  - "Undo it first: subtract 2."
              - id: l2-f4
                type: text_input
                text: "3a + 8 = 29. a = _"
                say: "Three a add eight equals twenty-nine. What is a?"
                answer: "7"
                hints:
                  - "Undo the + 8 first."
                  - "29 − 8 = 21, so 3a = 21."
                  - "21 ÷ 3 = 7."
              - id: l2-f5
                type: multiple_choice
                text: "Is n = 6 the answer to 7n − 4 = 38?"
                say: "Is n equals six the answer to seven n subtract four equals thirty-eight?"
                options: ["Yes, 7 × 6 − 4 = 38", "No, 7 × 6 − 4 = 34", "No, n = 5"]
                answer: "Yes, 7 × 6 − 4 = 38"
                hints:
                  - "Put 6 in place of n."
                  - "7 × 6 = 42."
                  - "42 − 4 = 38, so yes."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "2n + 9 = 25. n = _"
                say: "Two n add nine equals twenty-five. What is n?"
                answer: "8"
                hints: ["25 − 9 first."]
              - id: l2-s2
                type: text_input
                text: "6y − 5 = 31. y = _"
                say: "Six y subtract five equals thirty-one. What is y?"
                answer: "6"
                hints: ["31 + 5 first."]
              - id: l2-s3
                type: multiple_choice
                text: "I think of a number, multiply it by 3 and add 10. I get 31. Which equation fits?"
                options: ["3n + 10 = 31", "3(n + 10) = 31", "10n + 3 = 31"]
                answer: "3n + 10 = 31"
                hints: ["The number is multiplied first, then 10 is added."]
              - id: l2-s4
                type: multiple_choice
                text: "Solve 5m + 15 = 50. What is m?"
                say: "Solve five m add fifteen equals fifty. What is m?"
                options: ["7", "13", "35"]
                answer: "7"
                hints: ["50 − 15 = 35, then divide by 5."]
              - id: l2-s5
                type: true_false
                text: "Is it true? 4n + 6 = 30 gives n = 9."
                say: "Four n add six equals thirty gives n equals nine. Is it true?"
                answer: false
                hints: ["Check: 4 × 9 + 6."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A taxi charges £3 plus £2 a mile. Jo's ride costs £17, so 2m + 3 = 17. How many miles did she go? m = _"
                say: "A taxi charges three pounds plus two pounds a mile. Jo's ride costs seventeen pounds, so two m add three equals seventeen. How many miles did she go?"
                answer: "7"
              - id: l2-n2
                type: multiple_choice
                text: "4 cinema tickets and a £6 bag of popcorn cost £38. Which equation finds the price t of one ticket?"
                options: ["4t + 6 = 38", "4 + 6t = 38", "4t − 6 = 38"]
                answer: "4t + 6 = 38"
              - id: l2-n3
                type: text_input
                text: "4t + 6 = 38. How much is one ticket? t = £_"
                say: "Four t add six equals thirty-eight. How much is one ticket?"
                answer: "8"
              - id: l2-n4
                type: text_input
                text: "Mia has 5 equal bags of sweets and 4 loose sweets, 49 sweets in all. 5b + 4 = 49. How many sweets are in each bag? b = _"
                say: "Mia has five equal bags of sweets and four loose sweets, forty-nine sweets in all. Five b add four equals forty-nine. How many sweets are in each bag?"
                answer: "9"
              - id: l2-n5
                type: true_false
                text: "Is it true? 8n − 10 = 54 gives n = 8."
                say: "Eight n subtract ten equals fifty-four gives n equals eight. Is it true?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: one-step
            type: text_input
            text: "p + 34 = 71. p = _"
            say: "p add thirty-four equals seventy-one. What is p?"
            answer: "37"
          - id: l2-c2
            part: one-step
            type: multiple_choice
            text: "7n = 91. What is n?"
            say: "Seven n equals ninety-one. What is n?"
            options: ["13", "84", "98"]
            answer: "13"
          - id: l2-c3
            part: two-step
            type: text_input
            text: "3n + 7 = 28. n = _"
            say: "Three n add seven equals twenty-eight. What is n?"
            answer: "7"
          - id: l2-c4
            part: write
            type: multiple_choice
            text: "I think of a number, multiply it by 5 and subtract 6. I get 29. Which equation fits?"
            options: ["5n − 6 = 29", "5(n − 6) = 29", "6n − 5 = 29"]
            answer: "5n − 6 = 29"
          - id: l2-c5
            part: two-step
            type: text_input
            text: "9k − 7 = 47. k = _"
            say: "Nine k subtract seven equals forty-seven. What is k?"
            answer: "6"
          - id: l2-c6
            part: one-step
            type: text_input
            text: "r − 48 = 67. r = _"
            say: "r subtract forty-eight equals sixty-seven. What is r?"
            answer: "115"
          - id: l2-c7
            part: one-step
            type: true_false
            text: "Is it true? If h ÷ 6 = 8, then h = 48."
            say: "If h divided by six equals eight, then h equals forty-eight. Is it true?"
            answer: true
          - id: l2-c8
            part: one-step
            type: multiple_choice
            text: "11g = 132. What is g?"
            say: "Eleven g equals one hundred and thirty-two. What is g?"
            options: ["12", "121", "143"]
            answer: "12"
          - id: l2-c9
            part: two-step
            type: text_input
            text: "4n + 11 = 47. n = _"
            say: "Four n add eleven equals forty-seven. What is n?"
            answer: "9"
          - id: l2-c10
            part: two-step
            type: multiple_choice
            text: "Solve 6x − 8 = 40. What is x?"
            say: "Solve six x subtract eight equals forty. What is x?"
            options: ["8", "48", "32"]
            answer: "8"
          - id: l2-c11
            part: two-step
            type: true_false
            text: "Is it true? 5n − 9 = 41 gives n = 8."
            say: "Five n subtract nine equals forty-one gives n equals eight. Is it true?"
            answer: false
          - id: l2-c12
            part: write
            type: multiple_choice
            text: "I think of a number and divide it by 4. I get 9. Which equation fits?"
            options: ["n ÷ 4 = 9", "4 ÷ n = 9", "4n = 9"]
            answer: "n ÷ 4 = 9"
          - id: l2-c13
            part: write
            type: multiple_choice
            text: "Sam buys 3 pens at c pence each and a rubber for 40p. He pays 85p in all. Which equation fits?"
            say: "Sam buys three pens at c pence each and a rubber for forty pence. He pays eighty-five pence in all. Which equation fits?"
            options: ["3c + 40 = 85", "3 + 40c = 85", "3c − 40 = 85"]
            answer: "3c + 40 = 85"
          - id: l2-c14
            part: write
            type: fill_in_blank
            text: "A box holds b pencils. 6 boxes and 5 loose pencils make 77 pencils. Write the equation."
            say: "A box holds b pencils. Six boxes and five loose pencils make seventy-seven pencils. Write the equation."
            frame: "_b + _ = 77"
            options: ["6", "5", "11", "77"]
            answer: ["6", "5"]
          - id: l2-c15
            part: write
            type: true_false
            text: "Is it true? \"I think of a number, multiply it by 2 and add 7. I get 19.\" can be written as 2n + 7 = 19."
            say: "I think of a number, multiply it by two and add seven. I get nineteen. This can be written as two n add seven equals nineteen. Is it true?"
            answer: true
          - id: l2-c16
            part: check
            type: true_false
            text: "Is it true? n = 7 makes 4n − 5 = 23 true."
            say: "n equals seven makes four n subtract five equals twenty-three true. Is it true?"
            answer: true
          - id: l2-c17
            part: check
            type: multiple_choice
            text: "Ali says n = 5 solves 8n + 3 = 45. Put 5 in place of n. What do you find?"
            say: "Ali says n equals five solves eight n add three equals forty-five. Put five in place of n. What do you find?"
            options: ["8 × 5 + 3 = 43, so Ali is wrong", "8 × 5 + 3 = 45, so Ali is right", "8 × 5 + 3 = 40, so Ali is wrong"]
            answer: "8 × 5 + 3 = 43, so Ali is wrong"
          - id: l2-c18
            part: check
            type: multiple_choice
            text: "Which value of n makes 2n + 15 = 41 true?"
            say: "Which value of n makes two n add fifteen equals forty-one true?"
            options: ["13", "28", "12"]
            answer: "13"
          - id: l2-c19
            part: check
            type: true_false
            text: "Is it true? n = 9 makes 5n + 4 = 50 true."
            say: "n equals nine makes five n add four equals fifty true. Is it true?"
            answer: false
          - id: l2-c20
            part: check
            type: multiple_choice
            text: "Which equation has the answer n = 6?"
            say: "Which equation has the answer n equals six?"
            options: ["3n + 2 = 20", "3n + 2 = 18", "2n + 3 = 18"]
            answer: "3n + 2 = 20"
