# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.multiply-divide-fractions
skill: math.fractions.multiply-divide
curriculum: en-GB
language: en
title:
  de: Brüche multiplizieren und durch ganze Zahlen teilen
  en: Multiplying and dividing fractions
summary: >
  Multiplying two proper fractions and dividing a fraction by a whole
  number. Lesson 1 finds a fraction of a fraction in a rectangle split
  both ways (1/2 × 1/3 = 1/6), then multiplies the numerators and the
  denominators and simplifies. Lesson 2 shares a fraction equally (1/3 ÷
  2 = 1/6), divides the numerator when it can, and ends with the skill
  check.
metadata:
  year: year-6
  topic: { de: Mit Brüchen rechnen, en: Calculating with fractions }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.fractions.simplify, math.fractions.multiply-by-whole]
  also_practises: [math.fractions.simplify]
  vocabulary: { en: [multiply, divide, numerator, denominator, "of", simplest form, share equally] }
  forms: [drawn, text, audio]
  drawn: [fraction]
  facets: []
  parts:
    - { id: multiply, what: { de: zwei echte Brüche multiplizieren, en: multiplying two proper fractions } }
    - { id: divide, what: { de: einen Bruch durch eine ganze Zahl teilen, en: dividing a fraction by a whole number } }
    - { id: simplest, what: { de: das Ergebnis vollständig kürzen, en: giving the answer in its simplest form } }
    - { id: in-context, what: { de: Sachaufgaben mit Bruchteilen von Brüchen und Verteilen, en: word problems with a fraction of a fraction or sharing a fraction } }
  misconceptions:
    - id: adds-instead
      what: Adds the numerators or the denominators when multiplying (1/2 × 1/4 = 2/6)
      addressed: l1-f1 has feedback; l1-s2, l1-n2 and l2-c1 offer the added answer
    - id: product-bigger
      what: Thinks multiplying always makes a number bigger, so 1/3 × 1/2 is more than 1/3
      addressed: lesson 1 Learn says the answer is smaller than both fractions; l1-f4 and l1-n4 ask about it
    - id: divides-by-multiplying
      what: Multiplies the numerator by the whole number when dividing (1/2 ÷ 3 = 3/2)
      addressed: lesson 2 Learn shares a third between two; l2-f1 has feedback, l2-s4, l2-n5 and l2-c3 offer the multiplied answer
    - id: not-simplified
      what: Leaves the answer unsimplified (2/3 × 3/4 = 6/12)
      addressed: l1-f3, l1-s2, l1-s4, l2-s3 and l2-c1 ask for the simplest form
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Bruch mal Bruch, en: A fraction of a fraction }
    goal:
      de: "Multipliziere zwei Brüche: Zähler mal Zähler und Nenner mal Nenner, so wie die Hälfte von einem Drittel ein Sechstel ist."
      en: "Multiply two fractions by multiplying the tops and the bottoms, like half of 1 third is 1 sixth."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "3 × 2/5 = ?"
            options: ["1 1/5", "6/15", "5/5"]
            answer: "1 1/5"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Write 6/8 in its simplest form."
            options: ["3/4", "2/3", "3/8"]
            answer: "3/4"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1/2 × 1/3 = 1/6"
            say: "One half times one third means one half of one third. Split a rectangle into thirds one way and into halves the other way. That makes six equal parts. Half of one third is one of them: one sixth."
            show: { drawn: fraction, kind: rect, parts: 6, rows: 2, shaded: 1 }
          - text: "2/3 × 3/4 = (2 × 3)/(3 × 4) = 6/12 = 1/2"
            say: "To multiply two fractions, multiply the numerators, then multiply the denominators. Two times three is six. Three times four is twelve. Six twelfths simplifies to one half."
          - text: "1/2 × 1/3 is less than 1/2 and less than 1/3."
            say: "When you multiply by a fraction smaller than one, you take only part of the number. So the answer is smaller than both fractions you started with."
          - text: "1/4 of 2/5 = 1/4 × 2/5 = 2/20 = 1/10"
            say: "The word of means multiply. One quarter of two fifths is one quarter times two fifths. That is two twentieths, which simplifies to one tenth."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1/2 × 1/4 = ?"
                show: { drawn: fraction, kind: rect, parts: 8, rows: 2, shaded: 1 }
                options: ["1/8", "2/6", "1/6"]
                answer: "1/8"
                option_audio: false
                feedback:
                  "2/6": "The numerators and the denominators were added. Multiply them: 1 × 1 and 2 × 4."
                  "1/6": "The denominators were added. Multiply them: 2 × 4."
                hints:
                  - "Half of one quarter. Count the equal parts in the rectangle."
                  - "There are 8 parts. Multiply the denominators: 2 × 4 = 8."
                  - "1/8."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Work out 2/3 × 1/5."
                frame: "2/3 × 1/5 = _/_"
                options: ["2", "3", "8", "15"]
                answer: ["2", "15"]
                hints:
                  - "Multiply the numerators, then the denominators."
                  - "2 × 1 = 2 and 3 × 5 = 15."
                  - "2/15."
              - id: l1-f3
                type: multiple_choice
                text: "3/4 × 2/5 = ? Give the answer in its simplest form."
                options: ["3/10", "6/20", "5/9"]
                answer: "3/10"
                option_audio: false
                feedback:
                  "6/20": "6/20 is the right size, but it is not in its simplest form. Divide 6 and 20 by 2."
                hints:
                  - "Multiply the numerators, then the denominators."
                  - "3 × 2 = 6 and 4 × 5 = 20, so 6/20."
                  - "6/20 = 3/10."
              - id: l1-f4
                type: true_false
                text: "Is it true? 1/3 × 1/2 is bigger than 1/3."
                answer: false
                hints:
                  - "1/3 × 1/2 is half of one third."
                  - "Half of something is less than the whole of it."
                  - "No. 1/3 × 1/2 = 1/6, which is less than 1/3."
              - id: l1-f5
                type: multiple_choice
                text: "What is 1/2 of 3/5?"
                options: ["3/10", "6/5", "3/7"]
                answer: "3/10"
                option_audio: false
                hints:
                  - "Of means multiply."
                  - "1/2 × 3/5: 1 × 3 and 2 × 5."
                  - "3/10."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "1/3 × 1/4 = ?"
                options: ["1/12", "1/7", "2/7"]
                answer: "1/12"
                option_audio: false
                hints: ["Multiply the denominators: 3 × 4."]
              - id: l1-s2
                type: multiple_choice
                text: "2/5 × 1/2 = ? Give the answer in its simplest form."
                options: ["1/5", "3/7", "2/7"]
                answer: "1/5"
                option_audio: false
                hints: ["2/10 simplifies."]
              - id: l1-s3
                type: fill_in_blank
                text: "Work out 3/4 × 1/2."
                frame: "3/4 × 1/2 = _/_"
                options: ["3", "4", "6", "8"]
                answer: ["3", "8"]
                hints: ["3 × 1 and 4 × 2."]
              - id: l1-s4
                type: multiple_choice
                text: "4/5 × 3/4 = ? Give the answer in its simplest form."
                options: ["3/5", "7/9", "12/9"]
                answer: "3/5"
                option_audio: false
                hints: ["12/20 simplifies: divide both by 4."]
              - id: l1-s5
                type: true_false
                text: "Is it true? 2/3 × 3/5 = 2/5"
                answer: true
                hints: ["Work out 6/15 and simplify."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "1/5 × 1/2 = ?"
                options: ["1/10", "1/7", "2/7"]
                answer: "1/10"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "5/6 × 2/3 = ? Give the answer in its simplest form."
                options: ["5/9", "7/9", "10/9"]
                answer: "5/9"
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "1/2 of a garden is grass. 1/4 of the grass has daisies. What fraction of the whole garden has daisies?"
                options: ["1/8", "1/6", "3/4"]
                answer: "1/8"
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Which is the biggest?"
                options: ["1/2 × 1/2", "1/2 × 1/3", "1/2 × 1/4"]
                answer: "1/2 × 1/2"
                option_audio: false
              - id: l1-n5
                type: text_input
                text: "3/8 × 2/3 = ? Give the answer in its simplest form."
                keyboard: fraction
                answer: "1/4"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "1/4 × 1/3 = ?"
            options: ["1/12", "2/7", "1/7"]
            answer: "1/12"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "3/5 × 1/3 = ? Give the answer in its simplest form."
            options: ["1/5", "4/8", "3/8"]
            answer: "1/5"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? 1/2 of 1/2 is 1/4."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "1/3 × 1/3 = ?"
            options: ["1/9", "1/6", "2/6"]
            answer: "1/9"
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it true? 3/4 of 2/3 = 1/2"
            answer: true
          - id: l1-c6
            type: fill_in_blank
            text: "Work out 4/5 × 2/3."
            frame: "4/5 × 2/3 = _/_"
            options: ["6", "8", "9", "15"]
            answer: ["8", "15"]

  - n: 2
    title: { de: Bruch durch ganze Zahl, en: Dividing by a whole number }
    goal:
      de: "Teil einen Bruch gerecht durch eine ganze Zahl, so wie 1 Drittel geteilt durch 2 ein Sechstel ist."
      en: "Share a fraction equally by a whole number, like 1 third divided by 2 is 1 sixth."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "1/2 × 1/5 = ?"
            options: ["1/10", "2/7", "1/7"]
            answer: "1/10"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "5/6 × 3/5 = ? Give the answer in its simplest form."
            options: ["1/2", "8/11", "15/30"]
            answer: "1/2"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1/3 ÷ 2 = 1/6"
            say: "One third is shared equally between two people. Cut each third in half. Now the whole is in six equal parts, and each person gets one sixth. So one third divided by two is one sixth."
            show: { drawn: fraction, kind: bar, parts: 6, shaded: 1 }
          - text: "4/5 ÷ 2 = 2/5"
            say: "If the numerator can be divided, divide it. Four fifths shared by two is two fifths each, just like four apples shared by two is two each."
          - text: "3/4 ÷ 2 = 3/8"
            say: "Three cannot be shared equally by two, so make the parts smaller. Multiply the denominator by two: three quarters divided by two is three eighths. Dividing by two is the same as finding half."
          - text: "2/3 ÷ 4 = 2/12 = 1/6"
            say: "Always check whether the answer simplifies. Two thirds divided by four is two twelfths, which is one sixth. Dividing makes the fraction smaller, never bigger."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "1/2 ÷ 3 = ?"
                show: { drawn: fraction, kind: bar, parts: 6, shaded: 1 }
                options: ["1/6", "3/2", "1/5"]
                answer: "1/6"
                option_audio: false
                feedback:
                  "3/2": "That multiplies by 3. Dividing makes the fraction smaller: share the half into 3 parts."
                hints:
                  - "Share one half into 3 equal parts."
                  - "Multiply the denominator by 3: 2 × 3 = 6."
                  - "1/6."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "6/7 ÷ 3 = ?"
                options: ["2/7", "18/7", "6/4"]
                answer: "2/7"
                option_audio: false
                hints:
                  - "Can 6 be divided by 3?"
                  - "6 sevenths shared by 3 is 2 sevenths each."
                  - "2/7."
              - id: l2-f3
                type: fill_in_blank
                text: "Work out 2/5 ÷ 3."
                frame: "2/5 ÷ 3 = _/_"
                options: ["2", "3", "6", "15"]
                answer: ["2", "15"]
                hints:
                  - "2 cannot be shared equally by 3."
                  - "Multiply the denominator by 3: 5 × 3."
                  - "2/15."
              - id: l2-f4
                type: true_false
                text: "Is it true? 1/4 ÷ 2 = 1/8"
                answer: true
                hints:
                  - "Dividing by 2 is finding half."
                  - "Half of a quarter."
                  - "Yes, 1/8."
              - id: l2-f5
                type: multiple_choice
                text: "3/4 ÷ 3 = ?"
                options: ["1/4", "9/4", "3/7"]
                answer: "1/4"
                option_audio: false
                hints:
                  - "Can the numerator be divided by 3?"
                  - "3 quarters shared by 3 is 1 quarter each."
                  - "1/4."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "1/5 ÷ 2 = ?"
                options: ["1/10", "2/5", "1/7"]
                answer: "1/10"
                option_audio: false
                hints: ["Multiply the denominator by 2."]
              - id: l2-s2
                type: multiple_choice
                text: "8/9 ÷ 4 = ?"
                options: ["2/9", "32/9", "8/13"]
                answer: "2/9"
                option_audio: false
                hints: ["8 ÷ 4 = 2."]
              - id: l2-s3
                type: multiple_choice
                text: "3/4 ÷ 6 = ? Give the answer in its simplest form."
                options: ["1/8", "18/4", "3/10"]
                answer: "1/8"
                option_audio: false
                hints: ["3/24 simplifies."]
              - id: l2-s4
                type: true_false
                text: "Is it true? 3/5 ÷ 2 = 6/5"
                answer: false
                hints: ["Does dividing make a fraction bigger or smaller?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Work out 5/6 ÷ 2."
                frame: "5/6 ÷ 2 = _/_"
                options: ["5", "10", "3", "12"]
                answer: ["5", "12"]
                hints: ["5 cannot be shared equally by 2, so double the denominator."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Half a pizza is shared equally by 4 friends. What fraction of the whole pizza does each friend get?"
                options: ["1/8", "1/6", "2"]
                answer: "1/8"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "3/4 of a litre of juice is poured equally into 3 cups. How much is in each cup?"
                options: ["1/4 of a litre", "9/4 of a litre", "1/12 of a litre"]
                answer: "1/4 of a litre"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "2/5 of a field is shared equally between 2 farmers. What fraction of the field does each farmer get?"
                options: ["1/5", "4/5", "2/7"]
                answer: "1/5"
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Ben has 2/3 of a chocolate bar. He shares it equally between himself and 3 friends. What fraction of the bar does each of them get?"
                options: ["1/6", "2/9", "1/3"]
                answer: "1/6"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? When you divide a fraction by 2, the answer is a bigger fraction."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: simplest
            type: multiple_choice
            text: "2/3 × 1/4 = ? Give the answer in its simplest form."
            options: ["1/6", "3/7", "2/7"]
            answer: "1/6"
            option_audio: false
          - id: l2-c2
            part: multiply
            type: fill_in_blank
            text: "Work out 1/4 × 3/5."
            frame: "1/4 × 3/5 = _/_"
            options: ["3", "4", "9", "20"]
            answer: ["3", "20"]
          - id: l2-c3
            part: divide
            type: multiple_choice
            text: "4/7 ÷ 2 = ?"
            options: ["2/7", "8/7", "4/9"]
            answer: "2/7"
            option_audio: false
          - id: l2-c4
            part: divide
            type: multiple_choice
            text: "1/6 ÷ 3 = ?"
            options: ["1/18", "3/6", "1/9"]
            answer: "1/18"
            option_audio: false
          - id: l2-c5
            part: in-context
            type: multiple_choice
            text: "3/5 of a class are girls. 1/3 of the girls wear glasses. What fraction of the whole class are girls who wear glasses?"
            options: ["1/5", "4/8", "3/8"]
            answer: "1/5"
            option_audio: false
          - id: l2-c6
            part: multiply
            type: text_input
            text: "5/8 × 1/3 = _"
            keyboard: fraction
            answer: "5/24"
          - id: l2-c7
            part: multiply
            type: true_false
            text: "Is it true? 3/5 × 1/4 is less than 1/4."
            answer: true
          - id: l2-c8
            part: multiply
            type: multiple_choice
            text: "Which calculation finds 2/3 of 4/5?"
            options: ["2/3 × 4/5", "2/3 + 4/5", "4/5 − 2/3"]
            answer: "2/3 × 4/5"
            option_audio: false
          - id: l2-c9
            part: multiply
            type: multiple_choice
            text: "1/3 × 2/7 = ?"
            options: ["2/21", "3/10", "2/10"]
            answer: "2/21"
            option_audio: false
          - id: l2-c10
            part: divide
            type: text_input
            text: "3/5 ÷ 4 = _"
            keyboard: fraction
            answer: "3/20"
          - id: l2-c11
            part: divide
            type: true_false
            text: "Is it true? 1/3 ÷ 3 = 1/6"
            answer: false
          - id: l2-c12
            part: divide
            type: multiple_choice
            text: "Which is the same as 7/8 ÷ 2?"
            options: ["half of 7/8", "7/8 × 2", "7/4"]
            answer: "half of 7/8"
            option_audio: false
          - id: l2-c13
            part: simplest
            type: multiple_choice
            text: "4/5 × 1/2 = ? Give the answer in its simplest form."
            options: ["2/5", "4/10", "5/7"]
            answer: "2/5"
            option_audio: false
          - id: l2-c14
            part: simplest
            type: text_input
            text: "5/6 × 3/10 = ? Give the answer in its simplest form."
            keyboard: fraction
            answer: "1/4"
          - id: l2-c15
            part: simplest
            type: true_false
            text: "Is it true? 2/5 × 5/6 = 10/30, and 10/30 is in its simplest form."
            answer: false
          - id: l2-c16
            part: simplest
            type: multiple_choice
            text: "4/9 ÷ 6 = ? Give the answer in its simplest form."
            options: ["2/27", "4/54", "24/9"]
            answer: "2/27"
            option_audio: false
          - id: l2-c17
            part: in-context
            type: multiple_choice
            text: "A ribbon is 4/5 of a metre long. It is cut into 2 equal pieces. How long is each piece?"
            options: ["2/5 of a metre", "8/5 of a metre", "4/7 of a metre"]
            answer: "2/5 of a metre"
            option_audio: false
          - id: l2-c18
            part: in-context
            type: text_input
            text: "2/3 of a garden is lawn. 1/2 of the lawn gets new seed. What fraction of the whole garden gets new seed? Give the answer in its simplest form."
            keyboard: fraction
            answer: "1/3"
          - id: l2-c19
            part: in-context
            type: multiple_choice
            text: "1/3 of a cake is left. 4 children share it equally. What fraction of the whole cake does each child get?"
            options: ["1/12", "4/3", "1/7"]
            answer: "1/12"
            option_audio: false
          - id: l2-c20
            part: in-context
            type: true_false
            text: "Is it true? 3/4 of the children in a school have a pet. 1/3 of those children have a dog. So 1/4 of all the children have a dog."
            answer: true
