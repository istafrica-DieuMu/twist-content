# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.unequal-sharing
skill: math.percentages-ratio.unequal-sharing
curriculum: en-GB
language: en
title:
  de: Im Verhältnis aufteilen
  en: Sharing in a ratio
summary: >
  Sharing an amount unequally when the ratio is known. Lesson 1 draws a
  bar of equal parts, adds the parts of the ratio, finds one part and
  then each share (20 in the ratio 3 : 2 is 12 and 8); lesson 2 works
  back from one share or from the difference between the shares to the
  total, shares in three-part ratios (1 : 2 : 3), and ends with the skill
  check.
metadata:
  year: year-6
  topic: { de: Verhältnisse, en: Ratio }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.percentages-ratio.relative-size, math.fractions.of-quantities]
  also_practises: [math.fractions.of-quantities]
  vocabulary: { en: [ratio, share, part, bar model, total, difference, unequal] }
  forms: [drawn, text, audio]
  drawn: [fraction]
  facets: []
  parts:
    - { id: share, what: { de: eine Menge im Verhältnis zweier Teile aufteilen, en: sharing an amount in a ratio of two parts } }
    - { id: from-share, what: { de: aus einem Anteil das Ganze oder den anderen Anteil finden, en: finding the total or the other share from one share } }
    - { id: difference, what: { de: mit dem Unterschied der Anteile rechnen, en: working from the difference between the shares } }
    - { id: three-parts, what: { de: im Verhältnis dreier Teile aufteilen, en: sharing in a ratio of three parts } }
  misconceptions:
    - id: divide-by-one-number
      what: "Divides the total by one number of the ratio or by the number of people (30 in the ratio 2 : 1 gives 15)"
      addressed: lesson 1 Learn adds the parts of the ratio first; l1-f1 has feedback, l1-f3 asks how many parts, l1-f5, l1-s5 and l2-w2 offer the equal share
    - id: ratio-as-shares
      what: "Gives the numbers of the ratio as the shares (35 in the ratio 4 : 3 gives 4)"
      addressed: lesson 1 Learn says the ratio gives parts, not amounts; l1-f2 has feedback, l1-s5, l1-c2 and l2-c2 offer it
    - id: share-as-total
      what: "Gives one share or the other share when asked for the total (15 red in the ratio 3 : 2, total 10)"
      addressed: lesson 2 Learn counts all the parts; l2-f1 has feedback, l2-f5, l2-s1 and l2-c3 offer the other share
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Teile und Anteile", en: "Parts and shares" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "There are 2 red beads for every 3 blue beads. There are 6 red beads. How many blue beads are there?"
            options: ["9", "7", "4"]
            answer: "9"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "What is 3/5 of 40?"
            answer: "24"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Share 20 sweets in the ratio 3 : 2."
            say: "Amir and Bea share twenty sweets so that Amir gets three for every two that Bea gets. Draw a bar of five equal parts: three parts for Amir and two parts for Bea."
            show: { drawn: fraction, kind: bar, parts: 5, shaded: 3 }
          - text: "3 + 2 = 5 parts\n1 part = 20 ÷ 5 = 4"
            say: "Add the parts of the ratio: three add two is five parts. All five parts together are twenty sweets, so one part is twenty divided by five, which is four."
          - text: "Amir: 3 × 4 = 12, Bea: 2 × 4 = 8\nCheck: 12 + 8 = 20"
            say: "Amir has three parts: twelve sweets. Bea has two parts: eight sweets. Check that the shares add up to the total."
          - text: "Not 10 each, and not 3 and 2."
            say: "Sharing in a ratio is not sharing equally, and the numbers in the ratio are parts, not the shares themselves. Always find one part first."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Share 30 in the ratio 2 : 1."
                show: { drawn: fraction, kind: bar, parts: 3, shaded: 2 }
                frame: "1 part = 30 ÷ 3 = _   2 parts = _"
                options: ["10", "20", "15", "30"]
                answer: ["10", "20"]
                feedback:
                  "15": "That is half of 30. The ratio 2 : 1 has 3 parts, not 2."
                hints:
                  - "How many equal parts are in the bar?"
                  - "2 + 1 = 3 parts, so divide 30 by 3."
                  - "10, then 2 × 10 = 20."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Tom and Kai share 35 marbles in the ratio 4 : 3. How many marbles does Tom get?"
                options: ["20", "15", "4"]
                answer: "20"
                feedback:
                  "4": "4 is the number of parts Tom gets, not the number of marbles."
                  "15": "That is Kai's share. Tom has the 4 parts."
                hints:
                  - "Add the parts: 4 + 3."
                  - "7 parts make 35, so 1 part is 5."
                  - "Tom has 4 parts: 4 × 5 = 20."
              - id: l1-f3
                type: multiple_choice
                text: "How many equal parts does the ratio 5 : 3 have?"
                options: ["8", "5", "2"]
                answer: "8"
                hints:
                  - "Each number counts parts."
                  - "5 parts and 3 parts."
                  - "5 + 3 = 8 parts."
              - id: l1-f4
                type: text_input
                text: "Share £40 in the ratio 3 : 5. How much is the smaller share? £_"
                say: "Share forty pounds in the ratio three to five. How many pounds is the smaller share?"
                answer: "15"
                hints:
                  - "3 + 5 = 8 parts."
                  - "£40 ÷ 8 = £5 for one part."
                  - "The smaller share is 3 parts: £15."
              - id: l1-f5
                type: multiple_choice
                text: "Ruby and Sam share 24 stickers in the ratio 1 : 2. Ruby says she gets 12. Is she right?"
                options: ["No, she gets 8.", "Yes, half of 24 is 12.", "No, she gets 16."]
                answer: "No, she gets 8."
                hints:
                  - "Is this an equal share?"
                  - "1 + 2 = 3 parts, so 1 part is 24 ÷ 3 = 8."
                  - "Ruby has 1 part: 8 stickers."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Share 24 in the ratio 3 : 1."
                show: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }
                frame: "1 part = _   3 parts = _"
                options: ["6", "18", "8", "12"]
                answer: ["6", "18"]
                hints: ["3 + 1 = 4 parts."]
              - id: l1-s2
                type: multiple_choice
                text: "Share 45 in the ratio 2 : 7. What is the bigger share?"
                options: ["35", "10", "7"]
                answer: "35"
                hints: ["2 + 7 = 9 parts. What is one part?"]
              - id: l1-s3
                type: text_input
                text: "Share 60 in the ratio 1 : 4. What is the smaller share?"
                answer: "12"
                hints: ["60 ÷ 5 parts."]
              - id: l1-s4
                type: true_false
                text: "Is it true? Sharing 50 in the ratio 3 : 2 gives 30 and 20."
                answer: true
                hints: ["5 parts make 50, so 1 part is 10."]
              - id: l1-s5
                type: multiple_choice
                text: "Share 18 sweets in the ratio 5 : 1. How many does each person get?"
                options: ["15 and 3", "9 and 9", "5 and 1"]
                answer: "15 and 3"
                hints: ["5 + 1 = 6 parts. What is one part?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: text_input
                text: "A 56 cm ribbon is cut in the ratio 3 : 4. How long is the longer piece? _ cm"
                say: "A fifty-six centimetre ribbon is cut in the ratio three to four. How long is the longer piece, in centimetres?"
                answer: "32"
              - id: l1-n2
                type: multiple_choice
                text: "Mum and Dad share the driving on a 240-mile journey in the ratio 1 : 2. How far does Dad drive?"
                options: ["160 miles", "120 miles", "80 miles"]
                answer: "160 miles"
              - id: l1-n3
                type: text_input
                text: "A class of 32 pupils has 3 girls for every 5 boys. How many girls are there?"
                answer: "12"
              - id: l1-n4
                type: true_false
                text: "Is it true? £100 shared in the ratio 3 : 7 gives £30 and £60."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Zoe mixes blue and yellow paint in the ratio 2 : 3. She makes 15 litres. How much yellow paint does she use?"
                options: ["9 litres", "6 litres", "3 litres"]
                answer: "9 litres"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Share 40 in the ratio 3 : 1."
            frame: "1 part = _   3 parts = _"
            options: ["10", "30", "13", "20"]
            answer: ["10", "30"]
          - id: l1-c2
            type: multiple_choice
            text: "Share 28 in the ratio 2 : 5. What is the smaller share?"
            options: ["8", "20", "2"]
            answer: "8"
          - id: l1-c3
            type: text_input
            text: "Share 36 in the ratio 1 : 2. What is the bigger share?"
            answer: "24"
          - id: l1-c4
            type: true_false
            text: "Is it true? Sharing 21 in the ratio 1 : 2 gives 7 and 14."
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Ava and Dan share 45 stamps in the ratio 2 : 3. How many stamps does Dan get?"
            options: ["27", "18", "3"]
            answer: "27"
          - id: l1-c6
            type: text_input
            text: "A 64 cm strip of card is cut in the ratio 5 : 3. How long is the longer piece? _ cm"
            say: "A sixty-four centimetre strip of card is cut in the ratio five to three. How long is the longer piece, in centimetres?"
            answer: "40"

  - n: 2
    title: { de: "Vom Anteil zum Ganzen", en: "From a share to the total" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Share 30 in the ratio 1 : 4. What is the smaller share?"
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Share 42 in the ratio 3 : 4. What is the bigger share?"
            options: ["24", "18", "21"]
            answer: "24"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ratio 3 : 2. Amir gets 12. How many altogether?\n3 parts = 12, 1 part = 4, 5 parts = 20"
            say: "Sometimes you know one share and need the total. Amir's three parts are twelve sweets, so one part is four. All five parts are twenty sweets."
            show: { drawn: fraction, kind: bar, parts: 5, shaded: 3 }
          - text: "Ratio 3 : 2. Amir gets 6 more than Bea.\n1 part = 6: Amir 18, Bea 12, total 30"
            say: "Sometimes you know the difference. Amir has one part more than Bea, so one part is six. Amir has eighteen, Bea has twelve, and together they have thirty."
          - text: "Share 60 in the ratio 1 : 2 : 3.\n6 parts, 1 part = 10: 10, 20 and 30"
            say: "A ratio can have three parts. One add two add three is six parts. Sixty divided by six is ten, so the shares are ten, twenty and thirty."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Red and blue beads are in the ratio 3 : 2. There are 15 red beads. How many beads are there altogether?"
                options: ["25", "10", "17"]
                answer: "25"
                feedback:
                  "10": "10 is the number of blue beads. Add the red beads to find how many altogether."
                hints:
                  - "15 red beads are 3 parts. What is 1 part?"
                  - "1 part is 5. There are 5 parts in all."
                  - "5 × 5 = 25 beads."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "The ratio is 4 : 1. The bigger share is 20."
                frame: "1 part = _   total = _"
                options: ["5", "25", "4", "21"]
                answer: ["5", "25"]
                hints:
                  - "The bigger share is 4 parts."
                  - "20 ÷ 4 = 5. The total is 5 parts."
                  - "5, then 5 × 5 = 25."
              - id: l2-f3
                type: multiple_choice
                text: "Ali and Ben share sweets in the ratio 5 : 2. Ali gets 9 more than Ben. How many sweets does Ben get?"
                options: ["6", "9", "15"]
                answer: "6"
                hints:
                  - "How many more parts does Ali have than Ben?"
                  - "5 − 2 = 3 parts, and 3 parts are 9 sweets, so 1 part is 3."
                  - "Ben has 2 parts: 6 sweets."
              - id: l2-f4
                type: text_input
                text: "Share 48 in the ratio 1 : 2 : 3. What is the biggest share?"
                answer: "24"
                hints:
                  - "Add all three parts."
                  - "1 + 2 + 3 = 6 parts, so 1 part is 8."
                  - "The biggest share is 3 parts: 24."
              - id: l2-f5
                type: multiple_choice
                text: "Cars and vans in a car park are in the ratio 7 : 1. There are 6 vans. How many vehicles are there altogether?"
                options: ["48", "42", "13"]
                answer: "48"
                hints:
                  - "The vans are 1 part."
                  - "1 part is 6, and there are 7 + 1 = 8 parts."
                  - "8 × 6 = 48."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Girls and boys in a club are in the ratio 2 : 3. There are 12 girls. How many children are there altogether?"
                options: ["30", "18", "17"]
                answer: "30"
                hints: ["12 girls are 2 parts, so 1 part is 6."]
              - id: l2-s2
                type: text_input
                text: "Share 50 in the ratio 2 : 3 : 5. What is the smallest share?"
                answer: "10"
                hints: ["2 + 3 + 5 = 10 parts."]
              - id: l2-s3
                type: multiple_choice
                text: "Two shares are in the ratio 4 : 1. The difference between them is 15. What is the smaller share?"
                options: ["5", "15", "3"]
                answer: "5"
                hints: ["The difference is 4 − 1 = 3 parts."]
              - id: l2-s4
                type: true_false
                text: "Is it true? In the ratio 3 : 5, the smaller share is 9, so the total is 24."
                answer: true
                hints: ["9 is 3 parts. How many parts in all?"]
              - id: l2-s5
                type: multiple_choice
                text: "Squash and water are mixed in the ratio 1 : 5. A jug holds 600 ml of drink. How much of it is squash?"
                options: ["100 ml", "120 ml", "500 ml"]
                answer: "100 ml"
                hints: ["1 + 5 = 6 parts make 600 ml."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "Lucy and Max share money in the ratio 2 : 5. Max gets £35. How much do they share altogether? £_"
                say: "Lucy and Max share money in the ratio two to five. Max gets thirty-five pounds. How many pounds do they share altogether?"
                answer: "49"
              - id: l2-n2
                type: multiple_choice
                text: "A crumble uses flour, sugar and butter in the ratio 3 : 1 : 2. The mixture weighs 600 g. How much flour is in it?"
                options: ["300 g", "200 g", "100 g"]
                answer: "300 g"
              - id: l2-n3
                type: text_input
                text: "Two friends share shells in the ratio 3 : 7. One gets 12 more than the other. How many shells are there altogether?"
                answer: "30"
              - id: l2-n4
                type: true_false
                text: "Is it true? Green and white tiles are in the ratio 1 : 3. With 40 tiles in all, 13 are green."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Three friends share £90 in the ratio 1 : 3 : 5. How much does the friend with the biggest share get?"
                options: ["£50", "£30", "£45"]
                answer: "£50"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: share
            type: fill_in_blank
            text: "Share 56 in the ratio 5 : 3."
            frame: "1 part = _   5 parts = _"
            options: ["7", "35", "8", "21"]
            answer: ["7", "35"]
          - id: l2-c2
            part: share
            type: multiple_choice
            text: "Share 63 in the ratio 2 : 7. What is the smaller share?"
            options: ["14", "49", "2"]
            answer: "14"
          - id: l2-c3
            part: from-share
            type: multiple_choice
            text: "Cats and dogs at a rescue centre are in the ratio 4 : 3. There are 12 dogs. How many animals are there altogether?"
            options: ["28", "16", "19"]
            answer: "28"
          - id: l2-c4
            part: three-parts
            type: text_input
            text: "Share 72 in the ratio 1 : 2 : 3. What is the biggest share?"
            answer: "36"
          - id: l2-c5
            part: share
            type: text_input
            text: "A 45 m rope is cut in the ratio 4 : 5. How long is the shorter piece? _ m"
            say: "A forty-five metre rope is cut in the ratio four to five. How long is the shorter piece, in metres?"
            answer: "20"
          - id: l2-c6
            part: share
            type: true_false
            text: "Is it true? Sharing 32 in the ratio 5 : 3 gives 20 and 12."
            answer: true
          - id: l2-c7
            part: share
            type: multiple_choice
            text: "Ella and Jack share £27 in the ratio 4 : 5. How much does Jack get?"
            options: ["£15", "£12", "£5"]
            answer: "£15"
          - id: l2-c8
            part: from-share
            type: text_input
            text: "Apples and pears in a box are in the ratio 5 : 2. There are 25 apples. How many pieces of fruit are there altogether?"
            answer: "35"
          - id: l2-c9
            part: from-share
            type: multiple_choice
            text: "On a trip, adults and children are in the ratio 1 : 6. There are 42 children. How many people are there altogether?"
            options: ["49", "7", "48"]
            answer: "49"
          - id: l2-c10
            part: from-share
            type: true_false
            text: "Is it true? Two shares are in the ratio 2 : 3. The bigger share is 18, so the smaller share is 9."
            answer: false
          - id: l2-c11
            part: from-share
            type: multiple_choice
            text: "Mo mixes red and white paint in the ratio 3 : 4. He uses 9 litres of red. How much white does he use?"
            options: ["12 litres", "10 litres", "21 litres"]
            answer: "12 litres"
          - id: l2-c12
            part: difference
            type: multiple_choice
            text: "Two shares are in the ratio 3 : 1. The difference between them is 10. What is the bigger share?"
            options: ["15", "10", "5"]
            answer: "15"
          - id: l2-c13
            part: difference
            type: text_input
            text: "Mia and Leo share stickers in the ratio 5 : 3. Mia gets 8 more than Leo. How many stickers does Leo get?"
            answer: "12"
          - id: l2-c14
            part: difference
            type: true_false
            text: "Is it true? Two shares are in the ratio 7 : 2. One is 20 more than the other, so the total is 36."
            answer: true
          - id: l2-c15
            part: difference
            type: multiple_choice
            text: "A bag has red and green apples in the ratio 2 : 5. There are 12 more green apples than red ones. How many apples are there in all?"
            options: ["28", "20", "17"]
            answer: "28"
          - id: l2-c16
            part: difference
            type: text_input
            text: "Two ropes are in the ratio 4 : 9. The longer rope is 15 m longer than the shorter one. How long is the shorter rope? _ m"
            say: "Two ropes are in the ratio four to nine. The longer rope is fifteen metres longer than the shorter one. How long is the shorter rope, in metres?"
            answer: "12"
          - id: l2-c17
            part: three-parts
            type: multiple_choice
            text: "Share 40 in the ratio 1 : 3 : 4. What is the smallest share?"
            options: ["5", "10", "8"]
            answer: "5"
          - id: l2-c18
            part: three-parts
            type: text_input
            text: "Three friends share 80 cards in the ratio 2 : 3 : 5. How many cards does the friend with the middle share get?"
            answer: "24"
          - id: l2-c19
            part: three-parts
            type: true_false
            text: "Is it true? Sharing 36 in the ratio 1 : 1 : 2 gives 8, 8 and 20."
            answer: false
          - id: l2-c20
            part: three-parts
            type: multiple_choice
            text: "Orange juice, lemonade and water are mixed in the ratio 2 : 1 : 3 to make 1200 ml of punch. How much lemonade is in it?"
            options: ["200 ml", "400 ml", "600 ml"]
            answer: "200 ml"
