# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.linear-sequences
skill: math.algebra.linear-sequences
curriculum: en-GB
language: en
title:
  de: Zahlenfolgen und ihre Regel
  en: Linear sequences
summary: >
  Sequences with a constant step. Lesson 1 continues and describes them in
  words (start at 3, add 4 each time), going down past zero and in
  decimal steps; lesson 2 links each term to its position and writes the
  rule as an expression (3n + 1), uses it to find the 10th or 100th term,
  and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Terme und Gleichungen, en: Algebra }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.patterns.number-patterns, math.large-numbers.sequences]
  also_practises: [math.large-numbers.negative-numbers]
  vocabulary: { en: [sequence, term, step, rule, position, nth term, expression, linear] }
  forms: [drawn, text, audio]
  drawn: [number-line, table]
  facets: []
  parts:
    - { id: continue, what: { de: eine Folge mit gleichem Schritt fortsetzen, en: continuing a sequence with a constant step } }
    - { id: rule-words, what: { de: die Regel in Worten beschreiben, en: describing the rule in words } }
    - { id: expression, what: { de: die Regel als Term schreiben, en: writing the rule as an expression } }
    - { id: any-term, what: { de: mit der Regel ein beliebiges Glied finden, en: using the rule to find any term } }
  misconceptions:
    - id: step-as-addend
      what: Writes a sequence that goes up in 4s as n + 4 instead of 4n plus or minus a number
      addressed: lesson 2 Learn says the step gives the times table; l2-f1 and l2-f2 have feedback on n + 4, l2-s1, l2-s2, l2-n3 and l2-c3 offer it again
    - id: start-at-zero
      what: Starts the sequence at n = 0, so 3n + 4 gives 4, 7, 10 instead of 7, 10, 13
      addressed: lesson 2 Learn checks the first term with n = 1; l2-f3, l2-s4, l2-n4 and l2-c5 find the first terms
    - id: step-past-zero
      what: Stops at zero or loses the sign when a sequence goes down below zero (2, −1 written as 2, 1)
      addressed: lesson 1 Learn carries a sequence on below zero; l1-f4, l1-n2, l2-w2 and l2-c2 continue one
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die Regel in Worten", en: "The rule in words" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Continue the sequence."
            frame: "25, 50, 75, _, _"
            options: ["100", "125", "80", "150"]
            answer: ["100", "125"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "What is the rule? 90, 80, 70, 60"
            options: ["subtract 10", "add 10", "subtract 1"]
            answer: "subtract 10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3, 7, 11, 15, ..."
            say: "This sequence starts at three and goes up by four each time. The step is always the same, so it is called a linear sequence."
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[3, 4], [7, 4], [11, 4]] }
          - text: "Rule: start at 3, add 4 each time."
            say: "You can describe it in words: start at three, add four each time. Each number in a sequence is called a term."
          - text: "20, 17, 14, 11, 8, 5, 2, −1, −4"
            say: "A sequence can go down by the same step too. This one subtracts three each time, and it carries on below zero: two, negative one, negative four."
            show: { drawn: number-line, from: -5, to: 20, labels: all, jumps: [[20, -3], [17, -3], [14, -3], [11, -3], [8, -3], [5, -3], [2, -3], [-1, -3]] }
          - text: "0.5, 1.25, 2, 2.75, ..."
            say: "The step can be a decimal. Here it is nought point seven five each time: start at nought point five, add nought point seven five."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is the rule? 5, 11, 17, 23"
                options: ["add 6", "add 5", "add 7"]
                answer: "add 6"
                hints:
                  - "Find the difference between two terms next to each other."
                  - "From 5 to 11 is 6. From 11 to 17 is 6 as well."
                  - "The rule is add 6."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Start at 4 and add 7 each time."
                frame: "4, _, _, 25"
                options: ["11", "18", "14", "21"]
                answer: ["11", "18"]
                hints:
                  - "Add 7 to the first term."
                  - "4 + 7 = 11. Then add 7 again."
                  - "11, then 18, then 25."
              - id: l1-f3
                type: multiple_choice
                text: "What comes next? 30, 26, 22, 18, _"
                options: ["14", "16", "22"]
                answer: "14"
                hints:
                  - "Is the sequence going up or down?"
                  - "It goes down by 4 each time."
                  - "18 − 4 = 14."
              - id: l1-f4
                type: text_input
                keyboard: decimal
                text: "What comes next? 8, 5, 2, −1, _"
                answer: "−4"
                hints:
                  - "Find the step first."
                  - "It goes down by 3 each time, past zero."
                  - "−1 − 3 = −4."
              - id: l1-f5
                type: multiple_choice
                text: "Which sequence follows the rule: start at 2, add 0.5 each time?"
                options: ["2, 2.5, 3, 3.5", "2, 7, 12, 17", "2, 2.05, 2.1, 2.15"]
                answer: "2, 2.5, 3, 3.5"
                feedback:
                  "2, 2.05, 2.1, 2.15": "That adds 0.05. Half of one is 0.5."
                hints:
                  - "0.5 is a half."
                  - "2 and a half is 2.5. Add another half."
                  - "2, 2.5, 3, 3.5."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What is the rule? 12, 21, 30, 39"
                options: ["add 9", "add 8", "add 11"]
                answer: "add 9"
                hints: ["From 12 to 21 is how many?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Start at 50 and subtract 8 each time."
                frame: "50, _, _, 26"
                options: ["42", "34", "38", "30"]
                answer: ["42", "34"]
                hints: ["50 − 8 first."]
              - id: l1-s3
                type: text_input
                keyboard: decimal
                text: "What comes next? 1.2, 1.5, 1.8, 2.1, _"
                answer: "2.4"
                hints: ["The step is 0.3."]
              - id: l1-s4
                type: multiple_choice
                text: "Which number is missing? 7, 13, _, 25, 31"
                options: ["19", "18", "20"]
                answer: "19"
                hints: ["The step is 6."]
              - id: l1-s5
                type: true_false
                text: "Is it true? The sequence 3, 8, 13, 18, ... will reach 43."
                answer: true
                hints: ["The terms are 3 more than a multiple of 5. Is 43?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What is the rule? 64, 57, 50, 43"
                options: ["subtract 7", "subtract 6", "add 7"]
                answer: "subtract 7"
              - id: l1-n2
                type: text_input
                keyboard: decimal
                text: "What comes next? 10, 6, 2, −2, _"
                answer: "−6"
              - id: l1-n3
                type: fill_in_blank
                text: "Start at 0.25 and add 0.25 each time."
                frame: "0.25, _, _, 1"
                options: ["0.5", "0.75", "0.3", "0.35"]
                answer: ["0.5", "0.75"]
              - id: l1-n4
                type: true_false
                text: "Is it true? The sequence 4, 9, 14, 19, ... will reach 50."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Which number does not fit? 6, 15, 24, 32, 42"
                options: ["15", "32", "42"]
                answer: "32"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What is the rule? 9, 17, 25, 33"
            options: ["add 8", "add 9", "add 7"]
            answer: "add 8"
          - id: l1-c2
            type: text_input
            text: "What comes next? 45, 39, 33, 27, _"
            answer: "21"
          - id: l1-c3
            type: fill_in_blank
            text: "Start at 1 and add 1.5 each time."
            frame: "1, _, _, 5.5"
            options: ["2.5", "4", "2", "3.5"]
            answer: ["2.5", "4"]
          - id: l1-c4
            type: fill_in_blank
            text: "Start at 6 and subtract 4 each time."
            frame: "6, _, _, −6"
            options: ["2", "−2", "0", "−4"]
            answer: ["2", "−2"]
          - id: l1-c5
            type: multiple_choice
            text: "What is the rule? 0.9, 1.6, 2.3, 3"
            options: ["add 0.7", "add 0.6", "add 7"]
            answer: "add 0.7"
          - id: l1-c6
            type: true_false
            text: "Is it true? The sequence 2, 9, 16, 23, ... will reach 51."
            answer: true

  - n: 2
    title: { de: "Die Regel als Term", en: "The rule as an expression" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What is the rule? 14, 25, 36, 47"
            options: ["add 11", "add 10", "add 12"]
            answer: "add 11"
            difficulty: easy
          - id: l2-w2
            type: text_input
            keyboard: decimal
            text: "What comes next? 3, 1, −1, −3, _"
            answer: "−5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Each term is 3 times its position: 3n"
            say: "Here the terms are three, six, nine, twelve: the three times table. Each term is three times its position. We write the rule as three n, where n is the position."
            show: { drawn: table, rows: [[Position, "1", "2", "3", "4"], [Term, "3", "6", "9", "12"]] }
          - text: "4, 7, 10, 13: 3n + 1"
            say: "This sequence also goes up in threes, so it is linked to three n. Each term is one more than three times its position. The rule is three n add one."
            show: { drawn: table, rows: [[Position, "1", "2", "3", "4"], [3n, "3", "6", "9", "12"], [Term, "4", "7", "10", "13"]] }
          - text: "7, 12, 17, 22: step 5, so 5n\n5 × 1 = 5, first term 7, so 5n + 2"
            say: "The step tells you the times table: a step of five means five n. Then check the first term. Five times one is five, but the first term is seven, so add two. The rule is five n add two."
          - text: "10th term of 3n + 1 = 3 × 10 + 1 = 31"
            say: "The rule lets you jump straight to any term without counting on. For the tenth term, n is ten: three times ten add one is thirty-one."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The terms are 4, 8, 12, 16. Which rule gives the term at position n?"
                options: ["4n", "n + 4", "4n + 4"]
                answer: "4n"
                feedback:
                  "n + 4": "n + 4 gives 5, 6, 7, 8, which goes up in ones. A step of 4 means 4n."
                hints:
                  - "What is the step?"
                  - "The step is 4, and the terms are the 4 times table."
                  - "The rule is 4n."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The terms are 5, 9, 13, 17. Which rule gives the term at position n?"
                options: ["4n + 1", "n + 4", "5n"]
                answer: "4n + 1"
                feedback:
                  "n + 4": "n + 4 goes up by 1 each time. This sequence goes up by 4."
                  "5n": "5n gives 5, 10, 15. The step here is 4, not 5."
                hints:
                  - "The step is 4, so start with 4n."
                  - "4n gives 4, 8, 12, 16. Each term here is one more."
                  - "The rule is 4n + 1."
              - id: l2-f3
                type: fill_in_blank
                text: "The rule is 2n + 3. Find the first three terms."
                frame: "_, _, _"
                options: ["5", "7", "9", "3", "6"]
                answer: ["5", "7", "9"]
                hints:
                  - "The first term has n = 1."
                  - "2 × 1 + 3 = 5. Then n = 2 and n = 3."
                  - "5, 7, 9."
              - id: l2-f4
                type: text_input
                text: "The rule is 3n + 2. What is the 10th term?"
                answer: "32"
                hints:
                  - "For the 10th term, n = 10."
                  - "3 × 10 = 30."
                  - "30 + 2 = 32."
              - id: l2-f5
                type: multiple_choice
                text: "The terms are 6, 11, 16, 21. Which rule gives the term at position n?"
                options: ["5n + 1", "5n + 6", "n + 5"]
                answer: "5n + 1"
                feedback:
                  "5n + 6": "5n + 6 starts at 11. Check the first term: 5 × 1 + 1 = 6."
                hints:
                  - "The step is 5, so start with 5n."
                  - "5 × 1 = 5, and the first term is 6."
                  - "The rule is 5n + 1."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The terms are 7, 14, 21, 28. Which rule gives the term at position n?"
                options: ["7n", "n + 7", "7n + 7"]
                answer: "7n"
                hints: ["Which times table is it?"]
              - id: l2-s2
                type: multiple_choice
                text: "The terms are 3, 5, 7, 9. Which rule gives the term at position n?"
                options: ["2n + 1", "n + 2", "3n"]
                answer: "2n + 1"
                hints: ["The step is 2, so start with 2n."]
              - id: l2-s3
                type: text_input
                text: "The rule is 5n − 1. What is the 6th term?"
                answer: "29"
                hints: ["n = 6: 5 × 6 first."]
              - id: l2-s4
                type: fill_in_blank
                text: "The rule is 4n − 3. Find the first three terms."
                frame: "_, _, _"
                options: ["1", "5", "9", "4", "7"]
                answer: ["1", "5", "9"]
                hints: ["n = 1: 4 × 1 − 3."]
              - id: l2-s5
                type: true_false
                text: "Is it true? The sequence 10, 20, 30, 40 has the rule 10n."
                answer: true
                hints: ["Try n = 1 and n = 2."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Tables in a row: 1 table seats 6, 2 tables seat 10, 3 tables seat 14. Which rule gives the seats for n tables?"
                options: ["4n + 2", "n + 4", "6n"]
                answer: "4n + 2"
              - id: l2-n2
                type: text_input
                text: "A row of matchstick squares needs 4, 7, 10, 13 matches. The rule is 3n + 1. How many matches do 20 squares need?"
                answer: "61"
              - id: l2-n3
                type: multiple_choice
                text: "A plant is 5 cm tall and grows 2 cm each week. Which rule gives its height in cm after n weeks?"
                options: ["2n + 5", "5n + 2", "n + 7"]
                answer: "2n + 5"
              - id: l2-n4
                type: true_false
                text: "Is it true? The rule 3n + 4 gives the sequence 4, 7, 10, 13."
                answer: false
              - id: l2-n5
                type: text_input
                text: "The rule is 6n − 2. What is the 100th term?"
                answer: "598"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: rule-words
            type: multiple_choice
            text: "What is the rule? 13, 22, 31, 40"
            options: ["add 9", "add 8", "add 13"]
            answer: "add 9"
          - id: l2-c2
            part: continue
            type: text_input
            keyboard: decimal
            text: "What comes next? 7, 4, 1, −2, _"
            answer: "−5"
          - id: l2-c3
            part: expression
            type: multiple_choice
            text: "The terms are 8, 11, 14, 17. Which rule gives the term at position n?"
            options: ["3n + 5", "n + 3", "8n"]
            answer: "3n + 5"
          - id: l2-c4
            part: any-term
            type: text_input
            text: "The rule is 4n + 3. What is the 10th term?"
            answer: "43"
          - id: l2-c5
            part: any-term
            type: fill_in_blank
            text: "The rule is 5n − 2. Find the first three terms."
            frame: "_, _, _"
            options: ["3", "8", "13", "5", "10"]
            answer: ["3", "8", "13"]
          - id: l2-c6
            part: continue
            type: fill_in_blank
            text: "Continue the sequence."
            frame: "−9, −5, −1, _, _"
            options: ["3", "7", "4", "−3"]
            answer: ["3", "7"]
          - id: l2-c7
            part: continue
            type: text_input
            keyboard: decimal
            text: "What comes next? 4.6, 4.2, 3.8, 3.4, _"
            answer: "3"
          - id: l2-c8
            part: continue
            type: multiple_choice
            text: "Which number is missing? 15, 9, _, −3, −9"
            options: ["3", "1", "0"]
            answer: "3"
          - id: l2-c9
            part: continue
            type: true_false
            text: "Is it true? The next term of 0.4, 0.8, 1.2, 1.6 is 1.10."
            answer: false
          - id: l2-c10
            part: rule-words
            type: multiple_choice
            text: "What is the rule? 1.4, 2.6, 3.8, 5"
            options: ["add 1.2", "add 1.4", "add 0.12"]
            answer: "add 1.2"
          - id: l2-c11
            part: rule-words
            type: multiple_choice
            text: "What is the rule? 18, 11, 4, −3"
            options: ["subtract 7", "add 7", "subtract 6"]
            answer: "subtract 7"
          - id: l2-c12
            part: rule-words
            type: true_false
            text: "Is it true? The rule for 6, 14, 22, 30 is: start at 6, add 8 each time."
            answer: true
          - id: l2-c13
            part: rule-words
            type: multiple_choice
            text: "Which sequence follows the rule: start at 40, subtract 15 each time?"
            options: ["40, 25, 10, −5", "40, 25, 15, 5", "40, 55, 70, 85"]
            answer: "40, 25, 10, −5"
          - id: l2-c14
            part: expression
            type: multiple_choice
            text: "The terms are 2, 8, 14, 20. Which rule gives the term at position n?"
            options: ["6n − 4", "n + 6", "6n + 2"]
            answer: "6n − 4"
          - id: l2-c15
            part: expression
            type: fill_in_blank
            text: "The terms are 11, 13, 15, 17. Complete the rule for the term at position n."
            frame: "_n + _"
            options: ["2", "9", "11", "3"]
            answer: ["2", "9"]
          - id: l2-c16
            part: expression
            type: true_false
            text: "Is it true? The rule for 10, 13, 16, 19 is n + 3."
            answer: false
          - id: l2-c17
            part: expression
            type: multiple_choice
            text: "A row of stick houses needs 7, 13, 19, 25 sticks. Which rule gives the sticks for n houses?"
            options: ["6n + 1", "n + 6", "7n"]
            answer: "6n + 1"
          - id: l2-c18
            part: any-term
            type: text_input
            text: "The rule is 7n − 4. What is the 10th term?"
            answer: "66"
          - id: l2-c19
            part: any-term
            type: multiple_choice
            text: "The rule is 2n + 15. What is the 100th term?"
            options: ["215", "2115", "117"]
            answer: "215"
          - id: l2-c20
            part: any-term
            type: true_false
            text: "Is it true? The 5th term of 4n − 1 is 19."
            answer: true
