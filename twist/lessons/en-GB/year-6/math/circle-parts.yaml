# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.circle-parts
skill: math.shapes.circle-parts
curriculum: en-GB
language: en
title:
  de: Teile des Kreises
  en: Parts of a circle
summary: >
  The centre, radius, diameter and circumference of a circle. Lesson 1
  names the parts and what each one is. Lesson 2 uses the fact that the
  diameter is twice the radius: doubling and halving, circles side by
  side and a circle that fits in a square, and ends with the skill
  check. A drawn circle with its parts marked waits for a component.
metadata:
  year: year-6
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.circles-compass]
  also_practises: []
  vocabulary: { en: [circle, centre, radius, radii, diameter, circumference, perimeter, compasses] }
  forms: [drawn, text, audio]
  drawn: [shape]
  facets: []
  misconceptions:
    - id: radius-diameter-swapped
      what: Mixes up radius and diameter
      addressed: lesson 1 Learn shows the diameter as two radii; l1-f2 has feedback, l1-s1, l1-s5 and l1-n3 ask which is which
    - id: halves-for-diameter
      what: Halves the radius to get the diameter, or doubles the diameter to get the radius
      addressed: l2-f1 and l2-f2 have feedback; l2-s3, l2-s2 and l2-c5 offer the wrong way round
    - id: circumference-is-area
      what: Thinks the circumference is the space inside the circle
      addressed: lesson 1 Learn calls it the perimeter of the circle; l1-f3 has feedback, l1-n1 and l2-c2 ask about the distance round
    - id: any-chord
      what: Calls any line across the circle a diameter, even if it misses the centre
      addressed: l1-s4 and l1-n4 ask about it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die Teile benennen, en: Naming the parts }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "You draw a circle with compasses. Where does the point of the compasses go?"
            options: ["in the centre", "on the edge", "anywhere outside"]
            answer: "in the centre"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "The compasses are opened to 4 cm. How far is the edge of the circle from its centre?"
            options: ["4 cm", "8 cm", "2 cm"]
            answer: "4 cm"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "The centre"
            say: "The point in the middle of a circle is its centre. Every point on the edge of the circle is the same distance from the centre."
            show: { drawn: shape, kind: circle }
          - text: "The radius: from the centre to the edge"
            say: "A straight line from the centre to the edge is a radius. A circle has lots of radii, and they are all the same length."
          - text: "The diameter: from edge to edge, through the centre"
            say: "A straight line from one edge to the other that goes through the centre is a diameter. It is made of two radii, one on each side of the centre. It is the longest straight line you can draw inside a circle."
          - text: "The circumference: the distance all the way round"
            say: "The circumference is the distance all the way round the edge. It is the perimeter of the circle. It is not the space inside."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is the point in the middle of a circle called?"
                show: { drawn: shape, kind: circle }
                options: ["the centre", "the radius", "the diameter"]
                answer: "the centre"
                hints:
                  - "It is a point, not a line."
                  - "The point of the compasses goes there."
                  - "The centre."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A straight line goes from the centre to the edge. What is it called?"
                options: ["a radius", "a diameter", "the circumference"]
                answer: "a radius"
                feedback:
                  "a diameter": "A diameter goes right across, from edge to edge. This line stops at the centre."
                hints:
                  - "Does the line go right across, or only from the middle?"
                  - "It goes from the middle to the edge."
                  - "A radius."
              - id: l1-f3
                type: multiple_choice
                text: "What is the circumference of a circle?"
                options: ["the distance all the way round", "the distance across through the centre", "the space inside"]
                answer: "the distance all the way round"
                feedback:
                  "the space inside": "The space inside is the area. The circumference is the edge, all the way round."
                hints:
                  - "Think of the perimeter of a shape."
                  - "The circumference is the perimeter of a circle."
                  - "The distance all the way round."
              - id: l1-f4
                type: matching
                text: "Match each word to what it means."
                pairs:
                  - { left: { text: "centre" }, right: { text: "the point in the middle" } }
                  - { left: { text: "radius" }, right: { text: "from the centre to the edge" } }
                  - { left: { text: "diameter" }, right: { text: "edge to edge through the centre" } }
                  - { left: { text: "circumference" }, right: { text: "the distance round" } }
                hints:
                  - "Start with the one you are surest of."
                  - "The radius stops at the centre. The diameter goes right across."
                  - "Centre: the middle. Radius: centre to edge. Diameter: edge to edge. Circumference: round."
              - id: l1-f5
                type: true_false
                text: "Is it true? A diameter always goes through the centre."
                answer: true
                hints:
                  - "What makes a line a diameter?"
                  - "It goes from edge to edge through the middle."
                  - "Yes, always."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A straight line goes from one edge to the other, through the centre. What is it called?"
                options: ["a diameter", "a radius", "the circumference"]
                answer: "a diameter"
                hints: ["It goes right across."]
              - id: l1-s2
                type: true_false
                text: "Is it true? All the radii of one circle are the same length."
                answer: true
                hints: ["Every point on the edge is the same distance from the centre."]
              - id: l1-s3
                type: multiple_choice
                text: "Which word means the perimeter of a circle?"
                options: ["circumference", "diameter", "centre"]
                answer: "circumference"
                hints: ["The perimeter is the distance round."]
              - id: l1-s4
                type: true_false
                text: "Is it true? A line from edge to edge that misses the centre is a diameter."
                answer: false
                hints: ["A diameter must go through the centre."]
              - id: l1-s5
                type: multiple_choice
                text: "How many radii, end to end, make a diameter?"
                options: ["2", "1", "4"]
                answer: "2"
                hints: ["One radius on each side of the centre."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Leo walks all the way round a round pond. Which part of the circle has he walked along?"
                options: ["the circumference", "the diameter", "the radius"]
                answer: "the circumference"
              - id: l1-n2
                type: true_false
                text: "Is it true? The centre of a circle is on its circumference."
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "A bicycle wheel has spokes from the hub in the middle out to the tyre. Which part of a circle is a spoke like?"
                options: ["a radius", "a diameter", "the circumference"]
                answer: "a radius"
              - id: l1-n4
                type: multiple_choice
                text: "Which is the longest straight line you can draw inside a circle?"
                options: ["a diameter", "a radius", "any line that misses the centre"]
                answer: "a diameter"
              - id: l1-n5
                type: true_false
                text: "Is it true? A circle has only one diameter."
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What do we call the distance round a circle?"
            options: ["the circumference", "the radius", "the centre"]
            answer: "the circumference"
          - id: l1-c2
            type: multiple_choice
            text: "What do we call a straight line from the centre of a circle to its edge?"
            options: ["a radius", "a diameter", "the centre"]
            answer: "a radius"
          - id: l1-c3
            type: true_false
            text: "Is it true? The radius of a circle is longer than its diameter."
            answer: false

  - n: 2
    title: { de: Durchmesser und Radius, en: Diameter and radius }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A straight line goes from edge to edge through the centre. What is it called?"
            options: ["a diameter", "a radius", "the circumference"]
            answer: "a diameter"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which word means the distance all the way round a circle?"
            options: ["circumference", "radius", "diameter"]
            answer: "circumference"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Radius 3 cm → diameter 2 × 3 = 6 cm"
            say: "A diameter is two radii. So the diameter is twice the radius. If the radius is three centimetres, the diameter is six centimetres."
            show: { drawn: shape, kind: circle }
          - text: "Diameter 10 cm → radius 10 ÷ 2 = 5 cm"
            say: "Going the other way, halve. A circle with a diameter of ten centimetres has a radius of five centimetres."
          - text: "3 coins in a row, each 2 cm across: 3 × 2 = 6 cm"
            say: "Three coins lie in a row, touching. Each one is two centimetres across, so that is its diameter. The row is three diameters long: six centimetres."
          - text: "A circle fits exactly in a square with sides of 8 cm: diameter 8 cm, radius 4 cm"
            say: "A circle that fits exactly inside a square touches all four sides. So its diameter is the same as the side of the square, eight centimetres, and its radius is four centimetres."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "A circle has a radius of 4 cm. What is its diameter?"
                options: ["8 cm", "2 cm", "4 cm"]
                answer: "8 cm"
                feedback:
                  "2 cm": "That halves the radius. The diameter is two radii, so double it."
                hints:
                  - "The diameter is twice the radius."
                  - "2 × 4 cm."
                  - "8 cm."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "A circle has a diameter of 12 cm. What is its radius?"
                options: ["6 cm", "24 cm", "12 cm"]
                answer: "6 cm"
                feedback:
                  "24 cm": "That doubles the diameter. The radius is half of the diameter."
                hints:
                  - "The radius is half the diameter."
                  - "12 ÷ 2."
                  - "6 cm."
              - id: l2-f3
                type: fill_in_blank
                text: "A circle has a radius of 7 cm. Find its diameter."
                frame: "diameter = _ × 7 = _ cm"
                options: ["2", "14", "3.5", "49"]
                answer: ["2", "14"]
                hints:
                  - "How many radii make a diameter?"
                  - "2 radii, so 2 × 7."
                  - "2 × 7 = 14 cm."
              - id: l2-f4
                type: text_input
                text: "A circle has a diameter of 9 cm. What is its radius, in cm?"
                keyboard: decimal
                answer: "4.5"
                hints:
                  - "Halve the diameter."
                  - "9 ÷ 2. Half of 8 is 4 and half of 1 is 0.5."
                  - "4.5 cm."
              - id: l2-f5
                type: text_input
                text: "Four coins lie in a row, touching. Each has a radius of 1 cm. How long is the row, in cm?"
                answer: "8"
                hints:
                  - "Find the diameter of one coin first."
                  - "The diameter is 2 cm. There are 4 coins."
                  - "4 × 2 = 8 cm."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "A circle has a radius of 15 cm. What is its diameter, in cm?"
                answer: "30"
                hints: ["Double the radius."]
              - id: l2-s2
                type: multiple_choice
                text: "A circle has a diameter of 50 m. What is its radius?"
                options: ["25 m", "100 m", "50 m"]
                answer: "25 m"
                hints: ["Halve the diameter."]
              - id: l2-s3
                type: true_false
                text: "Is it true? A circle with a radius of 6 cm has a diameter of 3 cm."
                answer: false
                hints: ["Is the diameter bigger or smaller than the radius?"]
              - id: l2-s4
                type: text_input
                text: "A circle fits exactly inside a square with sides of 10 cm. What is the radius of the circle, in cm?"
                answer: "5"
                hints: ["The diameter is the same as the side of the square."]
              - id: l2-s5
                type: multiple_choice
                text: "Which circle is bigger: one with a radius of 5 cm, or one with a diameter of 8 cm?"
                options: ["radius 5 cm", "diameter 8 cm", "they are the same"]
                answer: "radius 5 cm"
                keep_order: true
                hints: ["A radius of 5 cm means a diameter of 10 cm."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A round table has a diameter of 120 cm. What is its radius, in cm?"
                answer: "60"
              - id: l2-n2
                type: text_input
                text: "A clock face has a radius of 14 cm. How wide is it across the middle, in cm?"
                answer: "28"
              - id: l2-n3
                type: text_input
                text: "Three tins stand in a row, touching. Each has a radius of 4 cm. How long is the row, in cm?"
                answer: "24"
              - id: l2-n4
                type: text_input
                text: "A roundabout has a diameter of 7 m. What is its radius, in m?"
                keyboard: decimal
                answer: "3.5"
              - id: l2-n5
                type: true_false
                text: "Is it true? A circle with a diameter of 20 cm fits exactly inside a square with sides of 20 cm."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "A pizza is cut once, straight across from edge to edge through the middle. Which part of the circle is the cut?"
            options: ["a diameter", "a radius", "the circumference"]
            answer: "a diameter"
          - id: l2-c2
            type: multiple_choice
            text: "Ella puts a ribbon all the way round the edge of a round cake. Which part of the circle does the ribbon show?"
            options: ["the circumference", "the diameter", "the centre"]
            answer: "the circumference"
          - id: l2-c3
            type: text_input
            text: "A circle has a radius of 9 cm. What is its diameter, in cm?"
            answer: "18"
          - id: l2-c4
            type: text_input
            text: "A circle has a diameter of 15 cm. What is its radius, in cm?"
            keyboard: decimal
            answer: "7.5"
          - id: l2-c5
            type: multiple_choice
            text: "Five plates lie in a row, touching. Each has a radius of 10 cm. How long is the row?"
            options: ["100 cm", "50 cm", "200 cm"]
            answer: "100 cm"
