# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.construct-shapes
skill: math.shapes.construct
curriculum: en-GB
language: en
title:
  de: Figuren genau zeichnen
  en: Drawing shapes accurately
summary: >
  Drawing shapes from given lengths and angles. Lesson 1 measures lines
  to the nearest millimetre, reads a protractor on the right scale and
  puts the steps for drawing an angle in order. Lesson 2 plans a
  triangle from a side and two angles or from two sides and the angle
  between, works out the third angle to check, picks drawings that
  match the measurements, and ends with the skill check. The child does
  not draw yet: drawing with a ruler and protractor on screen waits for
  a drawing task.
metadata:
  year: year-6
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.angles.measure-draw, math.shapes.grid-drawing]
  also_practises: [math.angles.measure-draw]
  vocabulary: { en: [accurate, ruler, protractor, millimetre, centimetre, degrees, vertex, arm, base, construct, right angle] }
  forms: [drawn, text, audio]
  drawn: [ruler, angle, grid]
  facets: []
  misconceptions:
    - id: wrong-scale
      what: Reads the protractor's other scale (140° for 40°)
      addressed: lesson 1 Learn reads the scale that starts at 0 on the arm; l1-f2 has feedback, l1-f5, l1-s2, l1-s5, l1-n2, l1-c2, l2-w1 and l2-c1 offer the other scale's reading
    - id: ruler-not-from-zero
      what: Measures from the end of the ruler or from 1 instead of from 0
      addressed: lesson 1 Learn starts at 0; l1-f4 and l1-n4 show a strip that starts at 1 cm or 2 cm
    - id: angle-sum
      what: Plans a triangle whose angles do not make 180°, or adds the two given angles to find the third
      addressed: lesson 2 Learn finds the third angle as 180° − the other two; l2-f2 has feedback, l2-f4 and l2-c3
    - id: millimetre-slips
      what: Confuses 0.5 cm with 5 mm or writes 6.5 cm as 65 cm
      addressed: l1-f1, l1-s3 and l1-s4 convert between cm and mm
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Genau messen, en: Measuring accurately }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What size is the angle?"
            show: { drawn: angle, degrees: 70, label: false, protractor: true }
            options: ["70°", "110°", "60°"]
            answer: "70°"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "The rectangle is drawn on squared paper. How many squares long is its longer side?"
            show: { drawn: grid, cols: 7, rows: 5, lines: [[1, 1, 5, 1], [5, 1, 5, 3], [5, 3, 1, 3], [1, 3, 1, 1]] }
            options: ["4", "2", "6"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6.4 cm = 64 mm"
            say: "To measure a line accurately, put the zero of the ruler at one end. Read the other end to the nearest millimetre. This strip is six centimetres and four millimetres: six point four centimetres, or sixty-four millimetres."
            show: { drawn: ruler, length: 6.4, colour: blue }
          - text: "Reading a protractor: 50°"
            say: "To measure an angle, put the centre of the protractor on the corner, the vertex. Line up the zero line with one arm. Then read the scale that starts at zero on that arm. This angle is fifty degrees, not one hundred and thirty."
            show: { drawn: angle, degrees: 50, label: false, protractor: true }
          - text: "Drawing an angle of 50°"
            say: "To draw an angle, draw a straight line with a ruler. Put the centre of the protractor on one end. Find fifty on the scale that starts at zero on your line, and mark a dot. Take the protractor away and join the end of the line to the dot."
            show: { drawn: angle, degrees: 50 }
          - text: "A line of 7.5 cm: from 0 to 7 cm and 5 mm"
            say: "To draw a line seven point five centimetres long, start at zero and make a mark at seven centimetres and five millimetres. Keep your pencil sharp: a thick line is not accurate."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How long is the strip?"
                show: { drawn: ruler, length: 5.7, colour: red }
                options: ["5.7 cm", "5.3 cm", "57 cm"]
                answer: "5.7 cm"
                feedback:
                  "57 cm": "It is 57 mm, not 57 cm. 57 mm is 5.7 cm."
                hints:
                  - "Count the whole centimetres, then the millimetres."
                  - "5 whole centimetres and 7 small marks."
                  - "5.7 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What size is the angle?"
                show: { drawn: angle, degrees: 40, label: false, protractor: true }
                options: ["40°", "140°", "50°"]
                answer: "40°"
                feedback:
                  "140°": "That is the other scale. The angle is smaller than a right angle, so it must be less than 90°."
                hints:
                  - "Is the angle smaller or bigger than a right angle?"
                  - "It is smaller, so it is less than 90°. Use the scale that starts at 0 on the arm."
                  - "40°."
              - id: l1-f3
                type: ordering
                text: "Put the steps for drawing an angle of 65° in order."
                options: ["Mark a dot at 65° on the scale that starts at 0.", "Join the end of the line to the dot with a ruler.", "Draw a straight line with a ruler.", "Put the centre of the protractor on one end of the line."]
                slot_count: 4
                answer: ["Draw a straight line with a ruler.", "Put the centre of the protractor on one end of the line.", "Mark a dot at 65° on the scale that starts at 0.", "Join the end of the line to the dot with a ruler."]
                hints:
                  - "You need a line before you can use the protractor."
                  - "Line, then protractor, then the dot."
                  - "Line, protractor on the end, dot at 65°, join."
              - id: l1-f4
                type: true_false
                text: "Is it true? The strip is 5 cm long."
                show: { drawn: ruler, length: 4, start: 1, colour: green }
                answer: false
                hints:
                  - "Where does the strip start?"
                  - "It starts at 1 cm, not at 0."
                  - "No. From 1 to 5 is 4 cm."
              - id: l1-f5
                type: multiple_choice
                text: "What size is the angle?"
                show: { drawn: angle, degrees: 125, label: false, protractor: true }
                options: ["125°", "55°", "135°"]
                answer: "125°"
                hints:
                  - "Is the angle smaller or bigger than a right angle?"
                  - "It is bigger than 90°, an obtuse angle."
                  - "125°."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "How long is the strip, in cm?"
                show: { drawn: ruler, length: 8.2, colour: blue }
                keyboard: decimal
                answer: "8.2"
                hints: ["8 whole centimetres and some millimetres."]
              - id: l1-s2
                type: multiple_choice
                text: "What size is the angle?"
                show: { drawn: angle, degrees: 75, label: false, protractor: true }
                options: ["75°", "105°", "85°"]
                answer: "75°"
                hints: ["Smaller than a right angle."]
              - id: l1-s3
                type: true_false
                text: "Is it true? 4.5 cm is the same as 45 mm."
                answer: true
                hints: ["1 cm is 10 mm."]
              - id: l1-s4
                type: multiple_choice
                text: "Tia must draw a line 6.8 cm long. Her line is 6.3 cm. How much too short is it?"
                options: ["5 mm", "0.5 mm", "1 mm"]
                answer: "5 mm"
                hints: ["6.8 − 6.3 = 0.5 cm. How many mm is that?"]
              - id: l1-s5
                type: multiple_choice
                text: "What size is the angle?"
                show: { drawn: angle, degrees: 160, label: false, protractor: true }
                options: ["160°", "20°", "150°"]
                answer: "160°"
                hints: ["It is nearly a straight line."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "How long is the strip, in cm?"
                show: { drawn: ruler, length: 11.6, colour: red }
                keyboard: decimal
                answer: "11.6"
              - id: l1-n2
                type: multiple_choice
                text: "What size is the angle?"
                show: { drawn: angle, degrees: 35, label: false, protractor: true }
                options: ["35°", "145°", "45°"]
                answer: "35°"
              - id: l1-n3
                type: image_multiple_choice
                text: "Which angle is 110°?"
                options:
                  - { drawn: angle, degrees: 110, label: false, key: "110" }
                  - { drawn: angle, degrees: 70, label: false, key: "70" }
                  - { drawn: angle, degrees: 150, label: false, key: "150" }
                answer: "110"
              - id: l1-n4
                type: text_input
                text: "The strip starts at 2 cm. How long is it, in cm?"
                show: { drawn: ruler, length: 6.5, start: 2, colour: green }
                keyboard: decimal
                answer: "6.5"
              - id: l1-n5
                type: true_false
                text: "Is it true? To draw an angle of 30°, you read the scale that starts at 0 on your line."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How long is the strip?"
            show: { drawn: ruler, length: 9.3, colour: blue }
            options: ["9.3 cm", "9.7 cm", "93 cm"]
            answer: "9.3 cm"
          - id: l1-c2
            type: multiple_choice
            text: "What size is the angle?"
            show: { drawn: angle, degrees: 55, label: false, protractor: true }
            options: ["55°", "125°", "65°"]
            answer: "55°"
          - id: l1-c3
            type: true_false
            text: "Is it true? This angle is a right angle."
            show: { drawn: angle, degrees: 90, label: false }
            answer: true

  - n: 2
    title: { de: Dreiecke und Vierecke konstruieren, en: Constructing triangles and rectangles }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What size is the angle?"
            show: { drawn: angle, degrees: 120, label: false, protractor: true }
            options: ["120°", "60°", "130°"]
            answer: "120°"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "How long is the strip, in cm?"
            show: { drawn: ruler, length: 4.8, colour: red }
            keyboard: decimal
            answer: "4.8"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A side of 6 cm with angles of 50° and 60° at its ends"
            say: "To construct this triangle, draw the six centimetre side first, as the base. At one end, draw an angle of fifty degrees. At the other end, draw an angle of sixty degrees. Make the arms long. Where they cross is the third corner."
            show: { drawn: angle, degrees: 50 }
          - text: "Third angle: 180° − 50° − 60° = 70°"
            say: "The three angles of a triangle add up to one hundred and eighty degrees. So the third angle should be seventy degrees. Measure it to check your drawing."
          - text: "Sides of 7 cm and 5 cm with 40° between them"
            say: "Another triangle: two sides and the angle between them. Draw the seven centimetre side. At one end, draw an angle of forty degrees. Measure five centimetres along the new arm and mark it. Join that mark to the other end of the base."
          - text: "A rectangle 5 cm by 3 cm"
            say: "For a rectangle, draw a five centimetre line. Draw a right angle at each end and measure three centimetres up each one. Join the two marks. Check that the opposite sides are equal."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Put the steps in order to construct a triangle with a 6 cm side and angles of 50° and 60° at its ends."
                options: ["Mark where the two arms cross and label the corners.", "Draw an angle of 50° at one end.", "Draw a line 6 cm long.", "Draw an angle of 60° at the other end."]
                slot_count: 4
                answer: ["Draw a line 6 cm long.", "Draw an angle of 50° at one end.", "Draw an angle of 60° at the other end.", "Mark where the two arms cross and label the corners."]
                hints:
                  - "Start with the side you know."
                  - "Then one angle at each end."
                  - "Line, 50°, 60°, then where the arms cross."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "A triangle has angles of 50° and 60°. What is the third angle?"
                options: ["70°", "110°", "80°"]
                answer: "70°"
                feedback:
                  "110°": "110° is 50° + 60°. The three angles make 180°, so take 110° from 180°."
                hints:
                  - "The angles in a triangle add up to 180°."
                  - "50° + 60° = 110°."
                  - "180° − 110° = 70°."
              - id: l2-f3
                type: image_multiple_choice
                text: "Each square is 1 cm. Which rectangle is 4 cm by 2 cm?"
                options:
                  - { drawn: grid, cols: 7, rows: 5, lines: [[1, 1, 5, 1], [5, 1, 5, 3], [5, 3, 1, 3], [1, 3, 1, 1]], key: "4x2" }
                  - { drawn: grid, cols: 7, rows: 5, lines: [[1, 1, 5, 1], [5, 1, 5, 4], [5, 4, 1, 4], [1, 4, 1, 1]], key: "4x3" }
                  - { drawn: grid, cols: 7, rows: 5, lines: [[1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 1, 3], [1, 3, 1, 1]], key: "2x2" }
                answer: "4x2"
                hints:
                  - "Count the squares along each side."
                  - "One side must be 4 squares and the other 2."
                  - "The long, thin rectangle: 4 by 2."
              - id: l2-f4
                type: true_false
                text: "Is it true? A triangle can have angles of 40°, 60° and 90°."
                answer: false
                hints:
                  - "Add the three angles."
                  - "40° + 60° + 90° = 190°."
                  - "No. The angles of a triangle must make 180°."
              - id: l2-f5
                type: text_input
                text: "An isosceles triangle has two angles of 65°. What is the third angle, in degrees?"
                answer: "50"
                hints:
                  - "The three angles make 180°."
                  - "65° + 65° = 130°."
                  - "180° − 130° = 50°."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A triangle has angles of 35° and 85°. What is the third angle?"
                options: ["60°", "120°", "70°"]
                answer: "60°"
                hints: ["180° − 35° − 85°."]
              - id: l2-s2
                type: ordering
                text: "Put the steps in order to draw a rectangle 6 cm by 4 cm."
                options: ["Join the two marks with a ruler.", "Measure 4 cm up each arm and mark it.", "Draw a line 6 cm long.", "Draw a right angle at each end."]
                slot_count: 4
                answer: ["Draw a line 6 cm long.", "Draw a right angle at each end.", "Measure 4 cm up each arm and mark it.", "Join the two marks with a ruler."]
                hints: ["Start with the long side."]
              - id: l2-s3
                type: multiple_choice
                text: "Which angle do you draw at each corner of a rectangle?"
                options: ["90°", "60°", "180°"]
                answer: "90°"
                hints: ["Every corner of a rectangle is a right angle."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Each square is 1 cm. Which parallelogram has a base of 5 cm and a perpendicular height of 2 cm?"
                options:
                  - { drawn: grid, cols: 8, rows: 5, lines: [[0, 3, 5, 3], [5, 3, 6, 1], [6, 1, 1, 1], [1, 1, 0, 3]], key: "5x2" }
                  - { drawn: grid, cols: 8, rows: 5, lines: [[0, 4, 5, 4], [5, 4, 6, 1], [6, 1, 1, 1], [1, 1, 0, 4]], key: "5x3" }
                  - { drawn: grid, cols: 8, rows: 5, lines: [[0, 3, 4, 3], [4, 3, 5, 1], [5, 1, 1, 1], [1, 1, 0, 3]], key: "4x2" }
                answer: "5x2"
                hints: ["Count the base, then the squares straight up to the top side."]
              - id: l2-s5
                type: true_false
                text: "Is it true? An equilateral triangle with sides of 6 cm has three angles of 60°."
                answer: true
                hints: ["All three angles are equal and make 180°."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "Raj plans a triangle with angles of 72° and 48° at the ends of its base. What should the third angle measure, in degrees?"
                answer: "60"
              - id: l2-n2
                type: multiple_choice
                text: "Lily draws a 7 cm base with an angle of 45° at each end. What kind of triangle does she get?"
                options: ["a right-angled isosceles triangle", "an equilateral triangle", "a scalene triangle"]
                answer: "a right-angled isosceles triangle"
              - id: l2-n3
                type: multiple_choice
                text: "Sam's triangle should have an angle of 50°. He measures it and gets 56°. What should he do?"
                options: ["Draw that angle again, more carefully.", "Nothing, it is accurate.", "Make the sides longer."]
                answer: "Draw that angle again, more carefully."
              - id: l2-n4
                type: true_false
                text: "Is it true? This side should be 7.5 cm, and it is drawn accurately."
                show: { drawn: ruler, length: 7.5, colour: blue }
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "Ella must draw an angle of 135° at one corner. Which angle should it look like?"
                options:
                  - { drawn: angle, degrees: 135, label: false, key: "135" }
                  - { drawn: angle, degrees: 45, label: false, key: "45" }
                  - { drawn: angle, degrees: 100, label: false, key: "100" }
                answer: "135"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What size is the angle?"
            show: { drawn: angle, degrees: 65, label: false, protractor: true }
            options: ["65°", "115°", "75°"]
            answer: "65°"
          - id: l2-c2
            type: text_input
            text: "How long is the strip, in cm?"
            show: { drawn: ruler, length: 7.8, colour: green }
            keyboard: decimal
            answer: "7.8"
          - id: l2-c3
            type: multiple_choice
            text: "A triangle has angles of 55° and 75°. What is the third angle?"
            options: ["50°", "130°", "60°"]
            answer: "50°"
          - id: l2-c4
            type: image_multiple_choice
            text: "Each square is 1 cm. Which rectangle is 5 cm by 3 cm?"
            options:
              - { drawn: grid, cols: 8, rows: 5, lines: [[1, 1, 6, 1], [6, 1, 6, 4], [6, 4, 1, 4], [1, 4, 1, 1]], key: "5x3" }
              - { drawn: grid, cols: 8, rows: 5, lines: [[1, 1, 6, 1], [6, 1, 6, 3], [6, 3, 1, 3], [1, 3, 1, 1]], key: "5x2" }
              - { drawn: grid, cols: 8, rows: 5, lines: [[1, 1, 5, 1], [5, 1, 5, 4], [5, 4, 1, 4], [1, 4, 1, 1]], key: "4x3" }
            answer: "5x3"
          - id: l2-c5
            type: ordering
            text: "Put the steps in order to construct a triangle with sides of 8 cm and 5 cm and an angle of 30° between them."
            options: ["Measure 5 cm along the new arm and mark it.", "Draw a line 8 cm long.", "Join the mark to the other end of the line.", "Draw an angle of 30° at one end."]
            slot_count: 4
            answer: ["Draw a line 8 cm long.", "Draw an angle of 30° at one end.", "Measure 5 cm along the new arm and mark it.", "Join the mark to the other end of the line."]
