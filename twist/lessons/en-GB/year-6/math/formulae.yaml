# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.formulae
skill: math.algebra.formulae
curriculum: en-GB
language: en
title:
  de: Formeln verwenden
  en: Using formulae
summary: >
  Simple formulae, first in words and then with letters. Lesson 1 uses
  rules in words (perimeter of a rectangle = 2 × (length + width), a taxi
  fare of £3 plus £2 a mile) and works out the bracket or the
  multiplication first; lesson 2 writes the same rules with letters
  (P = 2(a + b), C = 3 + 2m), says what 2a means, substitutes values, and
  ends with the skill check.
metadata:
  year: year-6
  topic: { de: Terme und Gleichungen, en: Algebra }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.mult-div-larger.order-of-operations, math.area-volume.perimeter]
  also_practises: [math.mult-div-larger.order-of-operations]
  vocabulary: { en: [formula, formulae, perimeter, area, length, width, substitute, letter, brackets] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: in-words, what: { de: eine Formel in Worten anwenden, en: using a formula in words } }
    - { id: letters, what: { de: "verstehen, was 2a und 2(a + b) bedeuten", en: knowing what 2a and 2(a + b) mean } }
    - { id: substitute, what: { de: Zahlen in eine Formel mit Buchstaben einsetzen, en: substituting numbers into a formula with letters } }
    - { id: write, what: { de: eine Formel für eine Regel aufschreiben, en: writing a formula for a rule } }
  misconceptions:
    - id: bracket-ignored
      what: Works out 2 × (a + b) as 2 × a + b (length 6, width 4 gives 16)
      addressed: lesson 1 Learn works the bracket first; l1-f1 and l2-f2 have the chip with feedback, l1-n3, l2-s2 and l2-n3 offer it again
    - id: fixed-charge-multiplied
      what: Multiplies the fixed charge too (£3 + £2 a mile for 5 miles gives £25)
      addressed: lesson 1 Learn says the £3 is paid once and to multiply before adding; l1-f2 has feedback, l1-f5, l1-s2, l1-c2, l2-f4, l2-n2 and l2-c3 offer it
    - id: letter-as-digit
      what: Reads 3x as a two-digit number or as 3 + x (x = 4 gives 34 or 7)
      addressed: lesson 2 Learn says a number next to a letter means multiply; l2-f1 and l2-f5 have feedback, l2-s5 and l2-c1 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Formeln in Worten", en: "Formulae in words" }
    goal:
      de: "Nutze eine Formel in Worten, so wie eine Taxifahrt: 3 Pfund plus 2 Pfund pro Meile, also kosten 6 Meilen 15 Pfund."
      en: "Use a formula in words, like a taxi fare of 3 pounds plus 2 pounds a mile, so 6 miles costs 15 pounds."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "(6 + 4) × 2 = _"
            answer: "20"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "A rectangle is 7 cm long and 3 cm wide. What is its perimeter?"
            options: ["20 cm", "21 cm", "10 cm"]
            answer: "20 cm"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A taxi costs £3 to start, then £2 for each mile. Does a 6-mile ride cost £15 or £30? Guess!"
            say: "A taxi costs three pounds to start, then two pounds for each mile. Does a six mile ride cost fifteen pounds or thirty pounds? Have a guess. A formula will tell you."
          - text: "Perimeter of a rectangle = 2 × (length + width)"
            say: "A formula is a rule that works every time. To find the perimeter of any rectangle, add the length and the width, then double it, because each side comes twice."
          - text: "Length 8 cm, width 5 cm\n2 × (8 + 5) = 2 × 13 = 26 cm"
            say: "Put the numbers into the formula. Work out the bracket first: eight add five is thirteen. Then double it: twenty-six centimetres."
          - text: "Taxi fare = £3 + £2 for each mile\n6 miles: £3 + 6 × £2 = £3 + £12 = £15"
            say: "A taxi costs three pounds to start, then two pounds for each mile. For six miles, multiply first: six times two pounds is twelve pounds. Then add the three pounds, which you pay only once. Fifteen pounds, not thirty!"
          - text: "Cooking time = 20 minutes for each kg + 30 minutes\n2 kg: 20 × 2 + 30 = 70 minutes"
            say: "A chicken cooks for twenty minutes for each kilogram, and thirty minutes more. A two kilogram chicken: twenty times two is forty, add thirty is seventy minutes."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Perimeter = 2 × (length + width). Length 6 cm, width 4 cm."
                frame: "2 × (6 + 4) = 2 × _ = _ cm"
                options: ["10", "20", "16", "24"]
                answer: ["10", "20"]
                feedback:
                  "16": "That is 2 × 6 + 4. Work out the bracket first, then double."
                hints:
                  - "Start with the bracket."
                  - "6 + 4 = 10. Now double it."
                  - "10, then 20 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Taxi fare = £3 + £2 for each mile. How much is a 5-mile ride?"
                options: ["£13", "£25", "£10"]
                answer: "£13"
                feedback:
                  "£25": "That is (£3 + £2) × 5. The £3 is paid only once; only the £2 is for each mile."
                  "£10": "That is the miles only. Add the £3 start charge."
                hints:
                  - "Which part is paid for each mile, and which part only once?"
                  - "5 miles at £2 is £10. Then add the £3."
                  - "£10 + £3 = £13."
              - id: l1-f3
                type: text_input
                text: "Perimeter = 2 × (length + width). A rectangle is 9 m long and 6 m wide. Perimeter = _ m"
                say: "Perimeter equals two times, bracket, length add width. A rectangle is nine metres long and six metres wide. What is its perimeter, in metres?"
                answer: "30"
                hints:
                  - "Add the length and the width first."
                  - "9 + 6 = 15. Now double it."
                  - "2 × 15 = 30 m."
              - id: l1-f4
                type: multiple_choice
                text: "Which formula gives the perimeter of any square?"
                options: ["Perimeter = 4 × side", "Perimeter = side + 4", "Perimeter = 2 × side"]
                answer: "Perimeter = 4 × side"
                hints:
                  - "How many sides does a square have?"
                  - "A square has 4 equal sides."
                  - "Perimeter = 4 × side."
              - id: l1-f5
                type: multiple_choice
                text: "Cooking time = 20 minutes for each kg + 30 minutes. How long does a 3 kg chicken take?"
                options: ["90 minutes", "150 minutes", "53 minutes"]
                answer: "90 minutes"
                hints:
                  - "Multiply first: 20 minutes for each kg."
                  - "20 × 3 = 60 minutes. Then add 30 minutes."
                  - "60 + 30 = 90 minutes."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Perimeter = 2 × (length + width). Length 12 cm, width 5 cm. Perimeter = _ cm"
                say: "Perimeter equals two times, bracket, length add width. The length is twelve centimetres and the width is five centimetres. What is the perimeter, in centimetres?"
                answer: "34"
                hints: ["12 + 5 first, then double."]
              - id: l1-s2
                type: multiple_choice
                text: "Bike hire = £5 + £4 for each hour. How much for 3 hours?"
                options: ["£17", "£27", "£12"]
                answer: "£17"
                hints: ["3 hours at £4, then add the £5 once."]
              - id: l1-s3
                type: multiple_choice
                text: "Number of legs = 4 × number of dogs. How many legs do 7 dogs have?"
                options: ["28", "11", "47"]
                answer: "28"
                hints: ["4 × 7."]
              - id: l1-s4
                type: text_input
                text: "Area of a rectangle = length × width. Length 8 m, width 7 m. Area = _ m²"
                say: "Area of a rectangle equals length times width. The length is eight metres and the width is seven metres. What is the area, in square metres?"
                answer: "56"
                hints: ["8 × 7."]
              - id: l1-s5
                type: multiple_choice
                text: "A plumber charges £30 to come out and £25 for each hour. Which formula gives the cost?"
                options: ["Cost = £30 + £25 × hours", "Cost = (£30 + £25) × hours", "Cost = £25 + hours"]
                answer: "Cost = £30 + £25 × hours"
                hints: ["The £30 is paid once. The £25 is paid for each hour."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Perimeter = 2 × (length + width). Length 15 cm, width 8 cm. Perimeter = _ cm"
                say: "Perimeter equals two times, bracket, length add width. The length is fifteen centimetres and the width is eight centimetres. What is the perimeter, in centimetres?"
                answer: "46"
              - id: l1-n2
                type: multiple_choice
                text: "Phone plan = £10 a month + 5p for each text. What does a month with 40 texts cost?"
                options: ["£12", "£210", "£10.40"]
                answer: "£12"
              - id: l1-n3
                type: true_false
                text: "Is it true? Perimeter = 2 × (length + width), so a rectangle 10 cm long and 3 cm wide has a perimeter of 23 cm."
                answer: false
              - id: l1-n4
                type: text_input
                text: "Cooking time = 40 minutes for each kg + 20 minutes. A joint of meat weighs 2 kg. Cooking time = _ minutes"
                say: "Cooking time equals forty minutes for each kilogram, add twenty minutes. A joint of meat weighs two kilograms. How many minutes does it cook for?"
                answer: "100"
              - id: l1-n5
                type: multiple_choice
                text: "Which formula gives the number of wheels on some bikes?"
                options: ["Wheels = 2 × bikes", "Wheels = bikes + 2", "Wheels = bikes ÷ 2"]
                answer: "Wheels = 2 × bikes"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Perimeter = 2 × (length + width). Length 7 cm, width 2 cm. Perimeter = _ cm"
            say: "Perimeter equals two times, bracket, length add width. The length is seven centimetres and the width is two centimetres. What is the perimeter, in centimetres?"
            answer: "18"
          - id: l1-c2
            type: multiple_choice
            text: "Taxi fare = £4 + £3 for each mile. How much is a 6-mile ride?"
            options: ["£22", "£42", "£13"]
            answer: "£22"
          - id: l1-c3
            type: text_input
            text: "Area = length × width. Length 9 cm, width 6 cm. Area = _ cm²"
            say: "Area equals length times width. The length is nine centimetres and the width is six centimetres. What is the area, in square centimetres?"
            answer: "54"
          - id: l1-c4
            type: text_input
            text: "Area of a square = side × side. A square has sides of 6 cm. Area = _ cm²"
            say: "Area of a square equals side times side. A square has sides of six centimetres. What is its area, in square centimetres?"
            answer: "36"
          - id: l1-c5
            type: multiple_choice
            text: "Taxi fare = £2 + £3 for each mile. Which works out the fare for 8 miles?"
            options: ["£2 + 8 × £3", "(£2 + £3) × 8", "£2 × 8 + £3"]
            answer: "£2 + 8 × £3"
          - id: l1-c6
            type: true_false
            text: "Is it true? Cooking time = 30 minutes for each kg + 15 minutes, so a 2 kg chicken takes 75 minutes."
            answer: true

  - n: 2
    title: { de: "Formeln mit Buchstaben", en: "Formulae with letters" }
    goal:
      de: "Setz Zahlen für die Buchstaben in eine Formel ein, so wie 2 a heißt 2 mal a, und rechne das Ergebnis aus."
      en: "Put numbers in place of the letters in a formula and work it out, knowing that 2 a means 2 times a."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Perimeter = 2 × (length + width). Length 11 cm, width 4 cm. Perimeter = _ cm"
            say: "Perimeter equals two times, bracket, length add width. The length is eleven centimetres and the width is four centimetres. What is the perimeter, in centimetres?"
            answer: "30"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Bike hire = £2 + £3 for each hour. How much for 4 hours?"
            options: ["£14", "£20", "£9"]
            answer: "£14"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2a\nDoes it mean 2 + a, 2 × a or a number in the twenties? Guess!"
            say: "In maths you might see two a: a two, then the letter a. Does it mean two add a, two times a, or a number in the twenties? Have a guess."
          - text: "P = 2 × (a + b)"
            say: "Mathematicians write formulae with letters to keep them short. P stands for the perimeter, a for the length and b for the width. P equals two times, bracket, a add b."
          - text: "2a means 2 × a\n2(a + b) means 2 × (a + b)"
            say: "A number written right next to a letter or a bracket means multiply. Two a means two times a. It is not twenty-something, and it is not two add a."
          - text: "a = 7, b = 3\nP = 2 × (7 + 3) = 2 × 10 = 20"
            say: "To use a formula, put the numbers in place of the letters. This is called substituting. Then work it out in the right order: the bracket first."
          - text: "C = 3 + 2m\nm = 10: C = 3 + 2 × 10 = 23"
            say: "The taxi formula with letters: C is the cost in pounds and m is the number of miles. For ten miles, C equals three add two times ten, which is twenty-three pounds."
          - text: "Did you know? In the USA, the weather forecast gives temperatures in °F. A formula changes °C into °F:\nF = C × 9 ÷ 5 + 32\n100 °C: 100 × 9 ÷ 5 + 32 = 212 °F"
            say: "Did you know? In the USA, the weather forecast gives temperatures in degrees Fahrenheit, not degrees Celsius. A formula changes one into the other: F equals C times nine, divided by five, add thirty-two. Water boils at one hundred degrees Celsius. One hundred times nine is nine hundred, divided by five is one hundred and eighty, add thirty-two is two hundred and twelve degrees Fahrenheit!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "What does 5n mean?"
                say: "What does five n mean?"
                options: ["5 × n", "5 + n", "n − 5"]
                answer: "5 × n"
                feedback:
                  "5 + n": "A number next to a letter means multiply, not add."
                hints:
                  - "What does a number written next to a letter mean?"
                  - "2a means 2 × a."
                  - "5n means 5 × n."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "P = 2(a + b). Substitute a = 5 and b = 3."
                say: "P equals two, bracket, a add b. Substitute a equals five and b equals three."
                frame: "P = 2 × (5 + 3) = 2 × _ = _"
                options: ["8", "16", "13", "30"]
                answer: ["8", "16"]
                feedback:
                  "13": "That is 2 × 5 + 3. Work out the bracket first, then multiply by 2."
                hints:
                  - "Start with the bracket."
                  - "5 + 3 = 8. Now multiply by 2."
                  - "8, then 16."
              - id: l2-f3
                type: text_input
                text: "A = l × w. Substitute l = 9 and w = 4. A = _"
                say: "A equals l times w. Substitute l equals nine and w equals four."
                answer: "36"
                hints:
                  - "Put 9 in place of l and 4 in place of w."
                  - "A = 9 × 4."
                  - "A = 36."
              - id: l2-f4
                type: multiple_choice
                text: "C = 3 + 2m. What is C when m = 6?"
                say: "C equals three add two m. What is C when m equals six?"
                options: ["15", "30", "11"]
                answer: "15"
                hints:
                  - "2m means 2 × m. Multiply before you add."
                  - "2 × 6 = 12."
                  - "3 + 12 = 15."
              - id: l2-f5
                type: multiple_choice
                text: "y = 3x − 1. What is y when x = 4?"
                say: "y equals three x subtract one. What is y when x equals four?"
                options: ["11", "33", "6"]
                answer: "11"
                feedback:
                  "33": "3x means 3 × x. It is not the number 34."
                  "6": "3x means 3 × x, not 3 + x."
                hints:
                  - "3x means 3 × x."
                  - "3 × 4 = 12. Then subtract 1."
                  - "y = 11."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "The perimeter of a square is P = 4s. What is P when s = 7?"
                say: "The perimeter of a square is P equals four s. What is P when s equals seven?"
                answer: "28"
                hints: ["4s means 4 × s."]
              - id: l2-s2
                type: multiple_choice
                text: "P = 2(a + b). What is P when a = 10 and b = 6?"
                say: "P equals two, bracket, a add b. What is P when a equals ten and b equals six?"
                options: ["32", "26", "22"]
                answer: "32"
                hints: ["10 + 6 first, then multiply by 2."]
              - id: l2-s3
                type: multiple_choice
                text: "Tickets cost £5 each. Which formula gives the cost C in pounds for t tickets?"
                say: "Tickets cost five pounds each. Which formula gives the cost C in pounds for t tickets?"
                options: ["C = 5t", "C = t + 5", "t = 5C"]
                answer: "C = 5t"
                hints: ["Each ticket adds £5, so it is 5 lots of t."]
              - id: l2-s4
                type: text_input
                text: "The volume of a cuboid is V = l × w × h. What is V when l = 5, w = 3 and h = 2?"
                say: "The volume of a cuboid is V equals l times w times h. What is V when l equals five, w equals three and h equals two?"
                answer: "30"
                hints: ["5 × 3 × 2."]
              - id: l2-s5
                type: multiple_choice
                text: "y = 2x + 5. What is y when x = 0?"
                say: "y equals two x add five. What is y when x equals zero?"
                options: ["5", "7", "25"]
                answer: "5"
                hints: ["2x means 2 × x, and 2 × 0 = 0."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A taxi costs C = 4 + 3m pounds for m miles. What does a 7-mile ride cost? £_"
                say: "A taxi costs C equals four add three m pounds, for m miles. What does a seven mile ride cost?"
                answer: "25"
              - id: l2-n2
                type: multiple_choice
                text: "A candle is 20 cm tall. After t hours its height is h = 20 − 2t. How tall is it after 6 hours?"
                say: "A candle is twenty centimetres tall. After t hours its height is h equals twenty subtract two t. How tall is it after six hours?"
                options: ["8 cm", "108 cm", "12 cm"]
                answer: "8 cm"
              - id: l2-n3
                type: true_false
                text: "Is it true? P = 2(a + b), so when a = 8 and b = 4, P = 24."
                say: "P equals two, bracket, a add b. So when a equals eight and b equals four, P equals twenty-four. Is it true?"
                answer: true
              - id: l2-n4
                type: text_input
                text: "A = l × w. A rectangle has A = 48 cm² and l = 8 cm. What is w? _ cm"
                say: "A equals l times w. A rectangle has an area of forty-eight square centimetres and l equals eight centimetres. What is w?"
                answer: "6"
              - id: l2-n5
                type: multiple_choice
                text: "Hiring the hall costs £50 plus £8 for each person. Which formula gives the cost C for p people?"
                say: "Hiring the hall costs fifty pounds plus eight pounds for each person. Which formula gives the cost C for p people?"
                options: ["C = 50 + 8p", "C = 58p", "C = 8 + 50p"]
                answer: "C = 50 + 8p"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: letters
            type: multiple_choice
            text: "What does 7y mean?"
            say: "What does seven y mean?"
            options: ["7 × y", "7 + y", "y − 7"]
            answer: "7 × y"
          - id: l2-c2
            part: substitute
            type: text_input
            text: "P = 2(a + b). What is P when a = 9 and b = 5?"
            say: "P equals two, bracket, a add b. What is P when a equals nine and b equals five?"
            answer: "28"
          - id: l2-c3
            part: substitute
            type: multiple_choice
            text: "C = 6 + 4m. What is C when m = 5?"
            say: "C equals six add four m. What is C when m equals five?"
            options: ["26", "50", "15"]
            answer: "26"
          - id: l2-c4
            part: in-words
            type: text_input
            text: "Perimeter = 2 × (length + width). Length 13 m, width 7 m. Perimeter = _ m"
            say: "Perimeter equals two times, bracket, length add width. The length is thirteen metres and the width is seven metres. What is the perimeter, in metres?"
            answer: "40"
          - id: l2-c5
            part: write
            type: multiple_choice
            text: "A bus fare is £1 plus 50p for each stop. Which formula gives the fare F in pounds for s stops?"
            say: "A bus fare is one pound plus fifty pence for each stop. Which formula gives the fare F in pounds for s stops?"
            options: ["F = 1 + 0.5s", "F = 1.5s", "F = 50 + s"]
            answer: "F = 1 + 0.5s"
          - id: l2-c6
            part: in-words
            type: multiple_choice
            text: "Cooking time = 25 minutes for each kg + 20 minutes. How long does a 4 kg turkey take?"
            options: ["120 minutes", "180 minutes", "49 minutes"]
            answer: "120 minutes"
          - id: l2-c7
            part: in-words
            type: text_input
            text: "Perimeter of a square = 4 × side. A square has sides of 13 cm. Perimeter = _ cm"
            say: "Perimeter of a square equals four times side. A square has sides of thirteen centimetres. What is its perimeter, in centimetres?"
            answer: "52"
          - id: l2-c8
            part: in-words
            type: true_false
            text: "Is it true? Taxi fare = £5 + £2 for each mile, so a 4-mile ride costs £28."
            answer: false
          - id: l2-c9
            part: in-words
            type: multiple_choice
            text: "Window cleaning = £8 + £3 for each window. How much for 9 windows?"
            options: ["£35", "£99", "£20"]
            answer: "£35"
          - id: l2-c10
            part: letters
            type: multiple_choice
            text: "What does 4(a + b) mean?"
            say: "What does four, bracket, a add b mean?"
            options: ["4 × (a + b)", "4 + a + b", "4 × a + b"]
            answer: "4 × (a + b)"
          - id: l2-c11
            part: letters
            type: true_false
            text: "Is it true? When n = 6, 3n is 18."
            say: "When n equals six, three n is eighteen. Is it true?"
            answer: true
          - id: l2-c12
            part: letters
            type: multiple_choice
            text: "Which is the same as k + k + k?"
            say: "Which is the same as k add k add k?"
            options: ["3k", "k + 3", "k × k × k"]
            answer: "3k"
          - id: l2-c13
            part: letters
            type: multiple_choice
            text: "a = 8. What is 2a + 1?"
            say: "a equals eight. What is two a add one?"
            options: ["17", "29", "11"]
            answer: "17"
          - id: l2-c14
            part: substitute
            type: text_input
            text: "A = l × w. What is A when l = 12 and w = 5?"
            say: "A equals l times w. What is A when l equals twelve and w equals five?"
            answer: "60"
          - id: l2-c15
            part: substitute
            type: multiple_choice
            text: "y = 4x − 3. What is y when x = 5?"
            say: "y equals four x subtract three. What is y when x equals five?"
            options: ["17", "42", "6"]
            answer: "17"
          - id: l2-c16
            part: substitute
            type: true_false
            text: "Is it true? P = 2(a + b), so when a = 6 and b = 9, P = 21."
            say: "P equals two, bracket, a add b. So when a equals six and b equals nine, P equals twenty-one. Is it true?"
            answer: false
          - id: l2-c17
            part: write
            type: multiple_choice
            text: "A rectangle is twice as long as it is wide. Its width is w. Which formula gives its length l?"
            options: ["l = 2w", "l = w + 2", "w = 2l"]
            answer: "l = 2w"
          - id: l2-c18
            part: write
            type: multiple_choice
            text: "A cinema charges £6 for each child and £9 for each adult. Which formula gives the total cost?"
            options: ["Cost = £6 × children + £9 × adults", "Cost = (£6 + £9) × children", "Cost = £15 × adults"]
