# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.four-quadrants
skill: math.coordinates.four-quadrants
curriculum: en-GB
language: en
title:
  de: Koordinaten in vier Quadranten
  en: Coordinates in four quadrants
summary: >
  The coordinate grid with negative numbers. Lesson 1 reads and finds
  points in all four quadrants, across first and then up or down
  ((−4, 3), (2, −5)), and finds a missing corner of a shape; lesson 2
  translates points and shapes (right adds to x, down takes from y),
  reflects them in the x-axis and the y-axis, and ends with the skill
  check.
metadata:
  year: year-6
  topic: { de: Koordinaten, en: Coordinates }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.coordinates.reflect-translate, math.large-numbers.negative-numbers]
  also_practises: [math.large-numbers.negative-numbers]
  vocabulary: { en: [coordinates, x-axis, y-axis, quadrant, origin, negative, translate, reflect, mirror line] }
  forms: [drawn, text, audio]
  drawn: [coordinates]
  facets: []
  misconceptions:
    - id: order-swapped
      what: Gives y before x, so (−3, 4) is read as (4, −3)
      addressed: lesson 1 Learn says across first; l1-f1 has feedback, l1-f3, l1-s1, l1-s2, l1-n1, l1-n3 and every check offer the swapped pair
    - id: sign-lost
      what: Drops the minus sign for points left of or below zero, or moves the wrong way past zero (−2 + 4 = −6)
      addressed: lesson 1 Learn counts left and down as negative; l2-f1 has feedback, l1-f4, l1-n2, l2-s1, l2-n1 and l2-c3 cross zero
    - id: wrong-axis-reflection
      what: Changes the sign of the wrong coordinate when reflecting (in the y-axis, changes y)
      addressed: lesson 2 Learn shows which coordinate changes for each axis; l2-f3 has feedback, l2-f5, l2-s2, l2-s4, l2-n2, l2-n3, l2-n4, l2-c4 and l2-c5 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Punkte in allen Quadranten", en: "Points in all four quadrants" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "What are the coordinates of A?"
            show: { drawn: coordinates, quadrants: 1, max: 8, points: [[4, 6, A]] }
            options: ["(4, 6)", "(6, 4)", "(4, 4)"]
            answer: "(4, 6)"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which number is 4 less than 1?"
            options: ["−3", "3", "−5"]
            answer: "−3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "The axes carry on past zero."
            say: "Now the axes carry on past zero. To the left of zero, x is negative. Below zero, y is negative. The two axes cut the grid into four parts, called quadrants. They cross at the origin, nought, nought."
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[0, 0, O]] }
          - text: "B = (−4, 3)"
            say: "Always go across first, then up or down. B is four squares left of zero and three squares up, so its coordinates are negative four, three."
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-4, 3, B]] }
          - text: "C = (2, −5), D = (−3, −2)"
            say: "C is two right and five down: two, negative five. D is three left and two down: negative three, negative two."
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[2, -5, C], [-3, -2, D]] }
          - text: "E = (0, 4) is on the y-axis. F = (−5, 0) is on the x-axis."
            say: "When x is zero, the point sits on the y-axis. When y is zero, it sits on the x-axis."
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[0, 4, E], [-5, 0, F]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What are the coordinates of P?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-3, 4, P]] }
                options: ["(−3, 4)", "(4, −3)", "(3, 4)"]
                answer: "(−3, 4)"
                feedback:
                  "(4, −3)": "Across first: the x-coordinate is written first."
                  "(3, 4)": "P is left of zero, so its x-coordinate is negative."
                hints:
                  - "Go across first. Is P left or right of zero?"
                  - "P is 3 squares left of zero and 4 squares up."
                  - "P = (−3, 4)."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What are the coordinates of Q?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[2, -5, Q]] }
                options: ["(2, −5)", "(−5, 2)", "(2, 5)"]
                answer: "(2, −5)"
                hints:
                  - "Across first, then up or down."
                  - "Q is 2 right and 5 down. Down means negative."
                  - "Q = (2, −5)."
              - id: l1-f3
                type: multiple_choice
                text: "Which point is at (−4, −2)?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-2, -4, A], [-4, -2, B], [4, -2, C]] }
                options: ["A", "B", "C"]
                answer: "B"
                hints:
                  - "Start at the origin. Go across first."
                  - "Go 4 left, then 2 down."
                  - "That is point B."
              - id: l1-f4
                type: fill_in_blank
                text: "Write the coordinates of R."
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-5, 1, R]] }
                frame: "R = ( _ , _ )"
                options: ["−5", "5", "1", "−1"]
                answer: ["−5", "1"]
                hints:
                  - "Is R left or right of the y-axis?"
                  - "R is 5 left, so x is −5. It is 1 up."
                  - "R = (−5, 1)."
              - id: l1-f5
                type: multiple_choice
                text: "A point has a negative x-coordinate and a positive y-coordinate. Where is it?"
                options: ["left of the y-axis, above the x-axis", "right of the y-axis, below the x-axis", "left of the y-axis, below the x-axis"]
                answer: "left of the y-axis, above the x-axis"
                hints:
                  - "Negative x means left of zero."
                  - "Positive y means up from zero."
                  - "Left of the y-axis and above the x-axis."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What are the coordinates of S?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-6, -3, S]] }
                options: ["(−6, −3)", "(−3, −6)", "(6, 3)"]
                answer: "(−6, −3)"
                hints: ["Across first: how far left?"]
              - id: l1-s2
                type: multiple_choice
                text: "Which point is at (3, −1)?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-1, 3, A], [-3, 1, B], [3, -1, C]] }
                options: ["A", "B", "C"]
                answer: "C"
                hints: ["3 right, then 1 down."]
              - id: l1-s3
                type: fill_in_blank
                text: "Write the coordinates of T."
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[0, -4, T]] }
                frame: "T = ( _ , _ )"
                options: ["0", "−4", "4"]
                answer: ["0", "−4"]
                hints: ["T is on the y-axis, so it does not go across at all."]
              - id: l1-s4
                type: true_false
                text: "Is it true? The point (−5, 2) is 5 squares to the left of the y-axis."
                answer: true
                hints: ["The x-coordinate tells you how far left or right."]
              - id: l1-s5
                type: multiple_choice
                text: "A, B and C are three corners of a square. Where is the fourth corner?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-2, 1, A], [1, 1, B], [1, -2, C]] }
                options: ["(−2, −2)", "(2, −2)", "(−2, 2)"]
                answer: "(−2, −2)"
                hints: ["The fourth corner is below A and level with C."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What are the coordinates of K?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[5, -6, K]] }
                options: ["(5, −6)", "(−6, 5)", "(−5, 6)"]
                answer: "(5, −6)"
              - id: l1-n2
                type: fill_in_blank
                text: "Write the coordinates of M."
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-2, -5, M]] }
                frame: "M = ( _ , _ )"
                options: ["−2", "2", "−5", "5"]
                answer: ["−2", "−5"]
              - id: l1-n3
                type: multiple_choice
                text: "Which point is at (−1, −6)?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-1, -6, A], [-6, -1, B], [1, -6, C]] }
                options: ["A", "B", "C"]
                answer: "A"
              - id: l1-n4
                type: true_false
                text: "Is it true? The point (4, 0) lies on the y-axis."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "A rectangle has corners at (−4, 3), (2, 3) and (2, −1). Where is the fourth corner?"
                options: ["(−4, −1)", "(−1, −4)", "(4, −1)"]
                answer: "(−4, −1)"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What are the coordinates of W?"
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-2, 6, W]] }
            options: ["(−2, 6)", "(6, −2)", "(2, 6)"]
            answer: "(−2, 6)"
          - id: l1-c2
            type: multiple_choice
            text: "Which point is at (4, −3)?"
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-3, 4, A], [4, -3, B], [-4, 3, C]] }
            options: ["A", "B", "C"]
            answer: "B"
          - id: l1-c3
            type: fill_in_blank
            text: "Write the coordinates of Z."
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-6, 0, Z]] }
            frame: "Z = ( _ , _ )"
            options: ["−6", "6", "0"]
            answer: ["−6", "0"]

  - n: 2
    title: { de: "Verschieben und spiegeln", en: "Translate and reflect" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What are the coordinates of A?"
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-5, -2, A]] }
            options: ["(−5, −2)", "(−2, −5)", "(5, 2)"]
            answer: "(−5, −2)"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which point is at (−3, 5)?"
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[5, -3, A], [3, 5, B], [-3, 5, C]] }
            options: ["A", "B", "C"]
            answer: "C"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Translate: 4 right, 3 down"
            say: "To translate a shape means to slide it. Each corner of the purple triangle moves four squares right and three squares down, to the green triangle. The shape does not turn or change size."
            show: { drawn: coordinates, quadrants: 4, max: 6, shape: [[-5, 1], [-2, 1], [-5, 4]], moved: [[-1, -2], [2, -2], [-1, 1]] }
          - text: "(−3, 2) → 5 right, 4 down → (2, −2)"
            say: "Right adds to x, left takes away from x. Up adds to y, down takes away from y. Negative three add five is two. Two take away four is negative two."
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-3, 2, A], [2, -2, "A′"]] }
          - text: "Reflect in the y-axis: (4, 1) → (−4, 1)"
            say: "To reflect in the y-axis, each corner lands the same distance away on the other side. The y-coordinate stays the same, and the x-coordinate changes sign: four becomes negative four."
            show: { drawn: coordinates, quadrants: 4, max: 6, shape: [[1, 1], [4, 1], [1, 3]], moved: [[-1, 1], [-4, 1], [-1, 3]], mirror: { axis: y, at: 0 } }
          - text: "Reflect in the x-axis: (5, 2) → (5, −2)"
            say: "To reflect in the x-axis, the x-coordinate stays the same, and the y-coordinate changes sign: two becomes negative two."
            show: { drawn: coordinates, quadrants: 4, max: 6, shape: [[2, 2], [5, 2], [2, 5]], moved: [[2, -2], [5, -2], [2, -5]], mirror: { axis: x, at: 0 } }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Point A (−2, 3) moves 4 right. Where does it land?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-2, 3, A]] }
                options: ["(2, 3)", "(−6, 3)", "(−2, 7)"]
                answer: "(2, 3)"
                feedback:
                  "(−6, 3)": "Right adds to x: −2 + 4 = 2. The point crosses the y-axis."
                  "(−2, 7)": "That moved 4 up. Right changes the x-coordinate."
                hints:
                  - "Right changes the x-coordinate."
                  - "Count 4 right from −2: −1, 0, 1, 2."
                  - "(2, 3)."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Point B (1, −1) moves 3 left and 2 down. Where does it land?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[1, -1, B]] }
                options: ["(−2, −3)", "(4, 1)", "(−2, 1)"]
                answer: "(−2, −3)"
                hints:
                  - "Left takes away from x. Down takes away from y."
                  - "1 − 3 = −2 and −1 − 2 = −3."
                  - "(−2, −3)."
              - id: l2-f3
                type: multiple_choice
                text: "Reflect C (3, 4) in the y-axis. Where does it land?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[3, 4, C]], mirror: { axis: y, at: 0 } }
                options: ["(−3, 4)", "(3, −4)", "(−3, −4)"]
                answer: "(−3, 4)"
                feedback:
                  "(3, −4)": "That is a reflection in the x-axis. In the y-axis, the x-coordinate changes sign."
                hints:
                  - "The mirror is the y-axis. Which way does C flip?"
                  - "C is 3 right of the mirror, so its image is 3 left. The height stays the same."
                  - "(−3, 4)."
              - id: l2-f4
                type: multiple_choice
                text: "The purple triangle slides to the green triangle. Describe the translation."
                show: { drawn: coordinates, quadrants: 4, max: 6, shape: [[-4, -1], [-2, -1], [-4, 2]], moved: [[1, -4], [3, -4], [1, -1]] }
                options: ["5 right, 3 down", "3 right, 5 down", "5 right, 3 up"]
                answer: "5 right, 3 down"
                hints:
                  - "Follow one corner, such as (−4, −1)."
                  - "It moves to (1, −4). Across from −4 to 1, then down from −1 to −4."
                  - "5 right, 3 down."
              - id: l2-f5
                type: multiple_choice
                text: "Reflect D (−5, 2) in the x-axis. Where does it land?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-5, 2, D]], mirror: { axis: x, at: 0 } }
                options: ["(−5, −2)", "(5, 2)", "(5, −2)"]
                answer: "(−5, −2)"
                hints:
                  - "The mirror is the x-axis. Which coordinate changes?"
                  - "D is 2 above the mirror, so its image is 2 below. x stays the same."
                  - "(−5, −2)."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Point E (−4, −3) moves 6 right. Where does it land?"
                options: ["(2, −3)", "(−10, −3)", "(−4, 3)"]
                answer: "(2, −3)"
                hints: ["−4 + 6."]
              - id: l2-s2
                type: multiple_choice
                text: "Reflect F (−2, −5) in the y-axis. Where does it land?"
                show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-2, -5, F]], mirror: { axis: y, at: 0 } }
                options: ["(2, −5)", "(−2, 5)", "(2, 5)"]
                answer: "(2, −5)"
                hints: ["In the y-axis, only x changes sign."]
              - id: l2-s3
                type: multiple_choice
                text: "The purple square slides to the green square. Describe the translation."
                show: { drawn: coordinates, quadrants: 4, max: 6, shape: [[-5, 3], [-3, 3], [-3, 5], [-5, 5]], moved: [[-5, -3], [-3, -3], [-3, -1], [-5, -1]] }
                options: ["6 down", "4 down", "6 up"]
                answer: "6 down"
                hints: ["Follow one corner, not the gap between the squares."]
              - id: l2-s4
                type: true_false
                text: "Is it true? Reflecting (6, −1) in the x-axis gives (6, 1)."
                answer: true
                hints: ["In the x-axis, only y changes sign."]
              - id: l2-s5
                type: fill_in_blank
                text: "Point G (2, 5) moves 5 left and 7 down. Write where it lands."
                frame: "( _ , _ )"
                options: ["−3", "−2", "3", "7"]
                answer: ["−3", "−2"]
                hints: ["2 − 5 and 5 − 7."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Point H (−6, 4) moves 3 right and 6 down. Where does it land?"
                options: ["(−3, −2)", "(−9, −2)", "(−3, 10)"]
                answer: "(−3, −2)"
              - id: l2-n2
                type: multiple_choice
                text: "Reflect J (4, −3) in the y-axis. Where does it land?"
                options: ["(−4, −3)", "(4, 3)", "(−4, 3)"]
                answer: "(−4, −3)"
              - id: l2-n3
                type: multiple_choice
                text: "A triangle has corners (1, 2), (4, 2) and (1, 5). It is reflected in the x-axis. Where are the corners of the image?"
                options: ["(1, −2), (4, −2), (1, −5)", "(−1, 2), (−4, 2), (−1, 5)", "(1, −2), (4, 2), (1, −5)"]
                answer: "(1, −2), (4, −2), (1, −5)"
              - id: l2-n4
                type: true_false
                text: "Is it true? Reflecting a point in the y-axis keeps its x-coordinate the same."
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Point K (−3, −4) moves 4 right and 6 up. Write where it lands."
                frame: "( _ , _ )"
                options: ["1", "2", "−7", "−10"]
                answer: ["1", "2"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What are the coordinates of L?"
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[-4, -6, L]] }
            options: ["(−4, −6)", "(−6, −4)", "(4, 6)"]
            answer: "(−4, −6)"
          - id: l2-c2
            type: multiple_choice
            text: "Which point is at (−5, 1)?"
            show: { drawn: coordinates, quadrants: 4, max: 6, points: [[1, -5, A], [-5, 1, B], [5, -1, C]] }
            options: ["A", "B", "C"]
            answer: "B"
          - id: l2-c3
            type: multiple_choice
            text: "Point N (3, −2) moves 5 left and 4 up. Where does it land?"
            options: ["(−2, 2)", "(8, 2)", "(−2, −6)"]
            answer: "(−2, 2)"
          - id: l2-c4
            type: multiple_choice
            text: "Reflect P (−1, 6) in the y-axis. Where does it land?"
            options: ["(1, 6)", "(−1, −6)", "(1, −6)"]
            answer: "(1, 6)"
          - id: l2-c5
            type: multiple_choice
            text: "Reflect Q (5, 3) in the x-axis. Where does it land?"
            options: ["(5, −3)", "(−5, 3)", "(−5, −3)"]
            answer: "(5, −3)"
