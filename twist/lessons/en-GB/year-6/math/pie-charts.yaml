# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.pie-charts
skill: math.data.pie-charts
curriculum: en-GB
language: en
title:
  de: Kreisdiagramme
  en: Pie charts
summary: >
  Reading and drawing pie charts. Lesson 1 reads a pie chart as
  fractions and percentages of a whole and uses the total to find how
  many (a quarter of 24 children is 6). Lesson 2 works out the angle for
  each sector from 360°, chooses the pie chart that fits a table, and
  ends with the skill check. The check covers drawing up to the sector
  angles; measuring them with a protractor waits for a drawing task.
metadata:
  year: year-6
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.data.read-charts, math.fractions.of-quantities, math.angles.angle-facts]
  also_practises: [math.fractions.of-quantities, math.angles.angle-facts]
  vocabulary: { en: [pie chart, sector, whole, fraction, percentage, total, angle, degrees, key] }
  forms: [drawn, text, audio]
  drawn: [pie-chart, table, angle]
  facets: []
  parts:
    - { id: read, what: { de: Anteile im Kreisdiagramm als Bruch und Prozent ablesen, en: reading a pie chart as fractions and percentages } }
    - { id: how-many, what: { de: mit der Gesamtzahl die Anzahl eines Teils finden, en: finding how many from a sector and the total } }
    - { id: angles, what: { de: die Winkel der Kreisausschnitte für das Zeichnen berechnen, en: working out the sector angles to draw a pie chart } }
    - { id: match, what: { de: ein Kreisdiagramm passenden Daten zuordnen, en: matching a pie chart to its data } }
  misconceptions:
    - id: sector-is-count
      what: Reads a fraction of the pie as a number of people without using the total
      addressed: lesson 1 Learn finds the number from the fraction and the total; l1-f2 has feedback, l1-s2 and l1-n2 give the total
    - id: same-sector-same-number
      what: Thinks equal sectors in two pie charts with different totals stand for the same number
      addressed: lesson 1 Learn compares half of 20 with half of 100; l1-f5, l1-n5 and l2-c5 compare two charts
    - id: angle-is-count
      what: Uses the number of people as the angle in degrees (9 children drawn as 9°)
      addressed: lesson 2 Learn finds the degrees for one person first; l2-f1 and l2-f3 have feedback, l2-s3 and l2-c3 offer the count as the angle
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Kreisdiagramme lesen, en: Reading pie charts }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "What is 1/4 of 32?"
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Angles at a point add up to how many degrees?"
            options: ["360°", "180°", "90°"]
            answer: "360°"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Favourite sport of 24 children"
            say: "A pie chart shows how a whole is split into parts. The whole circle is all twenty-four children. Football takes half of the circle, so half of the children chose football. Half of twenty-four is twelve."
            show: { drawn: pie-chart, parts: [[Football, 12], [Swimming, 6], [Tennis, 6]] }
          - text: "Swimming: 1/4 of 24 = 6"
            say: "Swimming takes a quarter of the circle. A quarter of twenty-four is six, so six children chose swimming. Tennis is also a quarter: six children."
            show: { drawn: pie-chart, parts: [[Football, 12], [Swimming, 6], [Tennis, 6]] }
          - text: "The whole circle is 100%. Half is 50%. A quarter is 25%."
            say: "You can also read a pie chart in percentages. The whole circle is one hundred per cent. Half the circle is fifty per cent and a quarter is twenty-five per cent."
          - text: "Half of 20 is 10. Half of 100 is 50."
            say: "Two pie charts can look the same and still show different numbers. If one class has twenty children and another has one hundred, half of the first is ten and half of the second is fifty. You always need the total to find how many."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What fraction of the pets are dogs?"
                show: { drawn: pie-chart, parts: [[Dogs, 10], [Cats, 5], [Rabbits, 5]] }
                options: ["1/2", "1/4", "1/3"]
                answer: "1/2"
                option_audio: false
                hints:
                  - "How much of the circle is the dogs sector?"
                  - "The dogs sector is exactly half of the circle."
                  - "1/2 of the pets are dogs."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "The pie chart shows 20 pets. How many are cats?"
                show: { drawn: pie-chart, parts: [[Dogs, 10], [Cats, 5], [Rabbits, 5]] }
                options: ["5", "10", "15"]
                answer: "5"
                feedback:
                  "10": "That is half of 20. Cats are only a quarter of the circle: find 1/4 of 20."
                hints:
                  - "What fraction of the circle is cats?"
                  - "Cats are a quarter. Find 1/4 of 20."
                  - "20 ÷ 4 = 5 cats."
              - id: l1-f3
                type: multiple_choice
                text: "What percentage of the cars are blue?"
                show: { drawn: pie-chart, parts: [[Blue, 30], [Red, 10], [Silver, 20]] }
                options: ["50%", "30%", "25%"]
                answer: "50%"
                feedback:
                  "30%": "30 is the number of blue cars, not the percentage. Blue is half of the circle."
                hints:
                  - "What fraction of the circle is blue?"
                  - "Blue is half of the circle."
                  - "Half is 50%."
              - id: l1-f4
                type: text_input
                text: "40 children chose a fruit. A quarter chose bananas. How many chose bananas?"
                show: { drawn: pie-chart, parts: [[Bananas, 10], [Apples, 20], [Grapes, 10]] }
                answer: "10"
                hints:
                  - "Find a quarter of the total."
                  - "1/4 of 40 = 40 ÷ 4."
                  - "10 children."
              - id: l1-f5
                type: true_false
                text: "Class A has 30 children and class B has 20. In both classes, half chose pizza. Is it true? The same number of children chose pizza in each class."
                answer: false
                hints:
                  - "Find half of each total."
                  - "Half of 30 is 15. Half of 20 is 10."
                  - "No: 15 and 10 are different."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What fraction of the votes went to green?"
                show: { drawn: pie-chart, parts: [[Green, 6], [Yellow, 18]] }
                options: ["1/4", "3/4", "1/6"]
                answer: "1/4"
                option_audio: false
                hints: ["Green is the smaller sector. How many of those fill the circle?"]
              - id: l1-s2
                type: text_input
                text: "The pie chart shows 60 visitors. Half came by car. How many came by car?"
                show: { drawn: pie-chart, parts: [[Car, 30], [Bus, 15], [Walk, 15]] }
                answer: "30"
                hints: ["Half of 60."]
              - id: l1-s3
                type: multiple_choice
                text: "What percentage of the visitors walked?"
                show: { drawn: pie-chart, parts: [[Car, 30], [Bus, 15], [Walk, 15]] }
                options: ["25%", "15%", "50%"]
                answer: "25%"
                hints: ["Walk is a quarter of the circle."]
              - id: l1-s4
                type: multiple_choice
                text: "Which was the most popular colour?"
                show: { drawn: pie-chart, parts: [[Red, 8], [Blue, 14], [Green, 6], [Yellow, 4]] }
                options: ["Blue", "Red", "Green"]
                answer: "Blue"
                hints: ["Find the biggest sector."]
              - id: l1-s5
                type: text_input
                text: "80 people were asked. 25% said winter. How many said winter?"
                answer: "20"
                hints: ["25% is a quarter."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What fraction of the children walk to school?"
                show: { drawn: pie-chart, parts: [[Walk, 9], [Car, 3]] }
                options: ["3/4", "1/4", "1/2"]
                answer: "3/4"
                option_audio: false
              - id: l1-n2
                type: text_input
                text: "The pie chart shows 36 children. A quarter come by car. How many come by car?"
                show: { drawn: pie-chart, parts: [[Walk, 27], [Car, 9]] }
                answer: "9"
              - id: l1-n3
                type: text_input
                text: "200 people voted. 50% voted for the park. How many voted for the park?"
                answer: "100"
              - id: l1-n4
                type: multiple_choice
                text: "Which sector is one third of the circle?"
                show: { drawn: pie-chart, parts: [[Rain, 10], [Sun, 15], [Cloud, 5]] }
                options: ["Rain", "Sun", "Cloud"]
                answer: "Rain"
              - id: l1-n5
                type: true_false
                text: "Is it true? A quarter of 100 children is more than half of 40 children."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What fraction of the books are stories?"
            show: { drawn: pie-chart, parts: [[Stories, 12], [Comics, 6], [Facts, 6]] }
            options: ["1/2", "1/3", "1/4"]
            answer: "1/2"
            option_audio: false
          - id: l1-c2
            type: text_input
            text: "The pie chart shows 24 books. How many are comics?"
            show: { drawn: pie-chart, parts: [[Stories, 12], [Comics, 6], [Facts, 6]] }
            answer: "6"
          - id: l1-c3
            type: multiple_choice
            text: "What percentage of the books are stories?"
            show: { drawn: pie-chart, parts: [[Stories, 12], [Comics, 6], [Facts, 6]] }
            options: ["50%", "12%", "25%"]
            answer: "50%"
          - id: l1-c4
            type: text_input
            text: "The pie chart shows 32 pets. How many are cats?"
            show: { drawn: pie-chart, parts: [[Dogs, 16], [Cats, 8], [Fish, 8]] }
            answer: "8"
          - id: l1-c5
            type: multiple_choice
            text: "What percentage of the people came by bus?"
            show: { drawn: pie-chart, parts: [[Bus, 25], [Train, 75]] }
            options: ["25%", "75%", "50%"]
            answer: "25%"
          - id: l1-c6
            type: true_false
            text: "Is it true? A quarter of 40 children is the same number as half of 20 children."
            answer: true

  - n: 2
    title: { de: Winkel im Kreisdiagramm, en: Angles in a pie chart }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "The pie chart shows 48 children. A quarter chose art. How many chose art?"
            show: { drawn: pie-chart, parts: [[Art, 12], [PE, 24], [Music, 12]] }
            answer: "12"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What percentage of the children chose PE?"
            show: { drawn: pie-chart, parts: [[Art, 12], [PE, 24], [Music, 12]] }
            options: ["50%", "24%", "25%"]
            answer: "50%"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "36 children, 360°: 360 ÷ 36 = 10° for each child"
            say: "To draw a pie chart, share the three hundred and sixty degrees of the circle between the data. Thirty-six children were asked. Three hundred and sixty divided by thirty-six is ten, so each child gets ten degrees."
            show: { drawn: table, rows: [[Pet, Children], [Dog, 18], [Cat, 12], [Fish, 6]] }
          - text: "Dog: 18 × 10° = 180°. Cat: 12 × 10° = 120°. Fish: 6 × 10° = 60°"
            say: "Eighteen children chose dog, so the dog sector is eighteen times ten: one hundred and eighty degrees. Cat is one hundred and twenty degrees and fish is sixty degrees. Check: they add up to three hundred and sixty."
            show: { drawn: angle, degrees: 120 }
          - text: "Draw: a radius, then each angle with a protractor."
            say: "Draw a circle and a radius. Put the protractor on the centre and measure the first angle. Then measure the next angle from the line you just drew. Label each sector or add a key."
            show: { drawn: pie-chart, parts: [[Dog, 18], [Cat, 12], [Fish, 6]] }
          - text: "Do not use the number as the angle."
            say: "Twelve children is not twelve degrees. Always find the degrees for one first."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "18 children were asked. How many degrees does each child get in the pie chart?"
                options: ["20°", "18°", "10°"]
                answer: "20°"
                feedback:
                  "18°": "18 is the number of children. Share the 360° between them: 360 ÷ 18."
                hints:
                  - "The whole circle is 360°."
                  - "Share 360° between 18 children: 360 ÷ 18."
                  - "20° for each child."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "60 people were asked. 15 chose tea."
                frame: "360 ÷ 60 = _° each. Tea: 15 × _ = _°"
                options: ["6", "15", "90", "60"]
                answer: ["6", "6", "90"]
                hints:
                  - "Find the degrees for one person first."
                  - "360 ÷ 60 = 6°. Then multiply by 15."
                  - "15 × 6 = 90°."
              - id: l2-f3
                type: multiple_choice
                text: "30 children were asked. 10 chose red. What angle is the red sector?"
                options: ["120°", "10°", "100°"]
                answer: "120°"
                feedback:
                  "10°": "10 is the number of children. Each child gets 360 ÷ 30 = 12°."
                hints:
                  - "Find the degrees for one child: 360 ÷ 30."
                  - "Each child gets 12°."
                  - "10 × 12 = 120°."
              - id: l2-f4
                type: image_multiple_choice
                text: "24 children: walk 12, bus 6, car 6. Which pie chart shows this?"
                options:
                  - { drawn: pie-chart, parts: [[Walk, 12], [Bus, 6], [Car, 6]], key: half-walk }
                  - { drawn: pie-chart, parts: [[Walk, 6], [Bus, 12], [Car, 6]], key: half-bus }
                  - { drawn: pie-chart, parts: [[Walk, 8], [Bus, 8], [Car, 8]], key: thirds }
                answer: half-walk
                hints:
                  - "What fraction of the 24 children walk?"
                  - "12 of 24 is a half."
                  - "The chart where walk is half of the circle."
              - id: l2-f5
                type: text_input
                text: "A pie chart shows 40 people. One sector is 90°. How many people does it show?"
                answer: "10"
                hints:
                  - "90° is a quarter of 360°."
                  - "So the sector is a quarter of the people."
                  - "1/4 of 40 is 10."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "45 children were asked. How many degrees does each child get in the pie chart?"
                answer: "8"
                hints: ["360 ÷ 45."]
              - id: l2-s2
                type: fill_in_blank
                text: "90 people were asked. 30 chose chess."
                frame: "360 ÷ 90 = _° each. Chess: 30 × _ = _°"
                options: ["4", "30", "120", "90"]
                answer: ["4", "4", "120"]
                hints: ["Degrees for one person first."]
              - id: l2-s3
                type: multiple_choice
                text: "20 children were asked. 5 chose blue. What angle is the blue sector?"
                options: ["90°", "5°", "50°"]
                answer: "90°"
                hints: ["Each child gets 360 ÷ 20 = 18°."]
              - id: l2-s4
                type: multiple_choice
                text: "What angle is the dog sector?"
                show: { drawn: pie-chart, parts: [[Dog, 9], [Cat, 3]] }
                options: ["270°", "90°", "9°"]
                answer: "270°"
                hints: ["Dog is three quarters of the circle."]
              - id: l2-s5
                type: true_false
                text: "Is it true? The angles of a pie chart are 150°, 120° and 100°."
                answer: false
                hints: ["The angles must add up to 360°."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A pie chart shows 72 children. 18 chose swimming. What angle is the swimming sector, in degrees?"
                answer: "90"
              - id: l2-n2
                type: text_input
                text: "A pie chart of 120 people has a sector of 60°. How many people does it show?"
                answer: "20"
              - id: l2-n3
                type: image_multiple_choice
                text: "The weather on 20 days: rain 5, sun 10, snow 5. Which pie chart shows this?"
                options:
                  - { drawn: pie-chart, parts: [[Rain, 5], [Sun, 10], [Snow, 5]], key: half-sun }
                  - { drawn: pie-chart, parts: [[Rain, 10], [Sun, 5], [Snow, 5]], key: half-rain }
                  - { drawn: pie-chart, parts: [[Rain, 5], [Sun, 5], [Snow, 10]], key: half-snow }
                answer: half-sun
              - id: l2-n4
                type: text_input
                text: "Two sectors of a pie chart are 100° and 140°. What is the angle of the third sector, in degrees?"
                answer: "120"
              - id: l2-n5
                type: multiple_choice
                text: "In a pie chart of 30 children, 12 chose music. In a pie chart of 60 children, 12 chose music too. Which music sector is bigger?"
                options: ["the one for 30 children", "the one for 60 children", "they are the same"]
                answer: "the one for 30 children"
                keep_order: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "What fraction of the drinks sold were juice?"
            show: { drawn: pie-chart, parts: [[Juice, 15], [Water, 45]] }
            options: ["1/4", "3/4", "1/3"]
            answer: "1/4"
            option_audio: false
          - id: l2-c2
            part: how-many
            type: text_input
            text: "The pie chart shows 60 drinks. How many were water?"
            show: { drawn: pie-chart, parts: [[Juice, 15], [Water, 45]] }
            answer: "45"
          - id: l2-c3
            part: angles
            type: multiple_choice
            text: "24 children were asked. 8 chose green. What angle is the green sector?"
            options: ["120°", "8°", "80°"]
            answer: "120°"
          - id: l2-c4
            part: angles
            type: text_input
            text: "A pie chart of 90 people has a sector of 120°. How many people does it show?"
            answer: "30"
          - id: l2-c5
            part: how-many
            type: true_false
            text: "Is it true? Half of a pie chart of 30 children shows more children than a quarter of a pie chart of 80 children."
            answer: false
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "What fraction of the trees in the park are oaks?"
            show: { drawn: pie-chart, parts: [[Oak, 20], [Ash, 40], [Birch, 20]] }
            options: ["1/4", "1/2", "1/5"]
            answer: "1/4"
            option_audio: false
          - id: l2-c7
            part: read
            type: multiple_choice
            text: "What percentage of the votes were Yes?"
            show: { drawn: pie-chart, parts: [[Yes, 75], [No, 25]] }
            options: ["75%", "25%", "50%"]
            answer: "75%"
          - id: l2-c8
            part: read
            type: true_false
            text: "Is it true? One third of the children chose tennis."
            show: { drawn: pie-chart, parts: [[Tennis, 8], [Golf, 8], [Hockey, 8]] }
            answer: true
          - id: l2-c9
            part: read
            type: multiple_choice
            text: "Which was the least popular lunch?"
            show: { drawn: pie-chart, parts: [[Pasta, 10], [Soup, 4], [Salad, 6], [Curry, 12]] }
            options: ["Soup", "Salad", "Pasta"]
            answer: "Soup"
          - id: l2-c10
            part: how-many
            type: text_input
            text: "The pie chart shows 48 birds seen in a garden. How many were robins?"
            show: { drawn: pie-chart, parts: [[Robins, 12], [Sparrows, 24], [Blackbirds, 12]] }
            answer: "12"
          - id: l2-c11
            part: how-many
            type: text_input
            text: "The pie chart shows 300 votes for a class trip. 25% went to the zoo. How many votes went to the zoo?"
            show: { drawn: pie-chart, parts: [[Zoo, 75], [Beach, 150], [Museum, 75]] }
            answer: "75"
          - id: l2-c12
            part: how-many
            type: multiple_choice
            text: "In class 6A, half of the 28 children walk to school. In class 6B, half of the 32 children walk. Which class has more children who walk?"
            options: ["6A", "6B", "They are the same."]
            keep_order: true
            answer: "6B"
          - id: l2-c13
            part: angles
            type: text_input
            text: "40 people were asked. 10 chose hockey. What angle is the hockey sector, in degrees?"
            answer: "90"
          - id: l2-c14
            part: angles
            type: multiple_choice
            text: "A pie chart shows 12 children. 5 chose art. What angle is the art sector?"
            options: ["150°", "5°", "50°"]
            answer: "150°"
          - id: l2-c15
            part: angles
            type: true_false
            text: "Is it true? A pie chart shows 36 children. The sector for 9 of them is 90°."
            answer: true
          - id: l2-c16
            part: match
            type: image_multiple_choice
            text: "30 children: football 15, rugby 10, cricket 5. Which pie chart shows this?"
            options:
              - { drawn: pie-chart, parts: [[Football, 15], [Rugby, 10], [Cricket, 5]], key: half-football }
              - { drawn: pie-chart, parts: [[Football, 10], [Rugby, 15], [Cricket, 5]], key: half-rugby }
              - { drawn: pie-chart, parts: [[Football, 15], [Rugby, 5], [Cricket, 10]], key: small-rugby }
            answer: half-football
          - id: l2-c17
            part: match
            type: image_multiple_choice
            text: "18 children: apple 9, pear 3, plum 6. Which pie chart shows this?"
            options:
              - { drawn: pie-chart, parts: [[Apple, 6], [Pear, 3], [Plum, 9]], key: half-plum }
              - { drawn: pie-chart, parts: [[Apple, 9], [Pear, 6], [Plum, 3]], key: small-plum }
              - { drawn: pie-chart, parts: [[Apple, 9], [Pear, 3], [Plum, 6]], key: half-apple }
            answer: half-apple
          - id: l2-c18
            part: match
            type: true_false
            text: "Is it true? This pie chart shows 20 days: 10 sunny, 5 rainy and 5 cloudy."
            show: { drawn: pie-chart, parts: [[Sunny, 5], [Rainy, 10], [Cloudy, 5]] }
            answer: false
          - id: l2-c19
            part: match
            type: multiple_choice
            text: "Which data fits this pie chart?"
            show: { drawn: pie-chart, parts: [[Bus, 20], [Car, 20], [Walk, 40]] }
            options: ["bus 10, car 10, walk 20", "bus 10, car 20, walk 10", "bus 20, car 10, walk 10"]
            answer: "bus 10, car 10, walk 20"
          - id: l2-c20
            part: match
            type: true_false
            text: "Is it true? A table shows red 6, blue 6 and green 12. In its pie chart, the green sector is half of the circle."
            answer: true
