# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.scale-factor
skill: math.percentages-ratio.scale-factor
curriculum: en-GB
language: en
title:
  de: Vergrößerungsfaktor
  en: Scale factor
summary: >
  Similar shapes and the scale factor between them. Lesson 1 enlarges
  shapes on squared paper: every length is multiplied by the same scale
  factor, and the angles stay the same. Lesson 2 finds the scale factor
  from a pair of matching sides, uses it to find a missing length, and
  ends with the skill check on problems about photos, models and plans.
metadata:
  year: year-6
  topic: { de: Verhältnisse, en: Ratio }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.shapes.scale, math.percentages-ratio.relative-size]
  also_practises: [math.shapes.scale]
  vocabulary: { en: [similar, enlarge, enlargement, scale factor, corresponding sides, length, angle] }
  forms: [drawn, text, audio]
  drawn: [grid]
  facets: []
  parts:
    - { id: enlarge, what: { de: Längen mit einem bekannten Faktor vergrößern, en: enlarging lengths by a known scale factor } }
    - { id: similar, what: { de: "erkennen, ob Figuren ähnlich sind", en: telling whether shapes are similar } }
    - { id: find-factor, what: { de: den Faktor aus zwei passenden Seiten finden, en: finding the scale factor from matching sides } }
    - { id: missing, what: { de: eine fehlende Länge in ähnlichen Figuren finden, en: finding a missing length in similar shapes } }
  misconceptions:
    - id: adds-instead-of-multiplies
      what: Adds the same amount to every side instead of multiplying (a 2 by 3 rectangle enlarged to 4 by 5)
      addressed: lesson 1 Learn compares adding with multiplying; l1-f1 and l1-f3 (with feedback), l1-s4, l1-n3 and l2-c2 offer the added answer
    - id: only-one-side
      what: Multiplies one side and leaves the other the same
      addressed: l1-f2 has feedback for the one-side answer; l1-s2 and l1-c2 offer it
    - id: angles-scaled
      what: Thinks the angles grow with the scale factor
      addressed: lesson 1 Learn says the angles stay the same; l1-f4 and l1-n5 ask about an angle after enlarging
    - id: factor-upside-down
      what: Finds the scale factor the wrong way round or divides when the shape gets bigger
      addressed: lesson 2 Learn finds the factor as big side ÷ small side; l2-f2 has feedback, l2-s3 and l2-c4 offer the inverted answer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Mit einem Faktor vergrößern, en: Enlarging by a scale factor }
    goal:
      de: "Vergrößere eine Form, indem du jede Seite mit demselben Faktor malnimmst, so wird aus 2 mal 3 Kästchen 4 mal 6 Kästchen."
      en: "Enlarge a shape by multiplying every side by the same scale factor, so a 2 by 3 rectangle becomes 4 by 6."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "This rectangle is 2 squares wide. It is drawn twice as big. How wide is it now?"
            show: { drawn: grid, cols: 8, rows: 5, cells: [[1, 1, blue], [2, 1, blue], [1, 2, blue], [2, 2, blue], [1, 3, blue], [2, 3, blue]] }
            options: ["4 squares", "3 squares", "6 squares"]
            answer: "4 squares"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "For every 2 blue beads there are 3 red beads. There are 8 blue beads. How many red beads are there?"
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "2 by 3 → 4 by 6"
            say: "This rectangle is two squares by three squares. In the bigger one, every side is twice as long: four by six. We say it is enlarged by scale factor two."
            show: { drawn: grid, cols: 10, rows: 7, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [1, 1, blue], [0, 2, blue], [1, 2, blue], [4, 0, red], [5, 0, red], [6, 0, red], [7, 0, red], [4, 1, red], [5, 1, red], [6, 1, red], [7, 1, red], [4, 2, red], [5, 2, red], [6, 2, red], [7, 2, red], [4, 3, red], [5, 3, red], [6, 3, red], [7, 3, red], [4, 4, red], [5, 4, red], [6, 4, red], [7, 4, red], [4, 5, red], [5, 5, red], [6, 5, red], [7, 5, red]] }
          - text: "Scale factor 3: every length × 3"
            say: "With scale factor three, you multiply every length by three. A side of two centimetres becomes six centimetres, and a side of five centimetres becomes fifteen centimetres. The two shapes are similar: the same shape, a different size."
          - text: "2 by 3 → 4 by 5 is not an enlargement"
            say: "Adding the same number to each side does not work. Two by three and four by five are not the same shape. To enlarge, always multiply."
          - text: "The angles stay the same."
            say: "When a shape is enlarged, the sides get longer but the angles do not change. A right angle is still a right angle, and an angle of sixty degrees is still sixty degrees."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "A side is 4 cm. The shape is enlarged by scale factor 3. How long is the side now?"
                options: ["12 cm", "7 cm", "4 cm"]
                answer: "12 cm"
                feedback:
                  "7 cm": "That adds 3. Scale factor 3 means multiply by 3."
                hints:
                  - "Scale factor 3 means every length is multiplied by 3."
                  - "4 cm × 3."
                  - "12 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A rectangle is 3 cm by 5 cm. It is enlarged by scale factor 2. What size is the new rectangle?"
                options: ["6 cm by 10 cm", "6 cm by 5 cm", "5 cm by 7 cm"]
                answer: "6 cm by 10 cm"
                feedback:
                  "6 cm by 5 cm": "Only one side was multiplied. Every side is multiplied by 2."
                hints:
                  - "Multiply both sides by the scale factor."
                  - "3 × 2 and 5 × 2."
                  - "6 cm by 10 cm."
              - id: l1-f3
                type: multiple_choice
                text: "Which rectangle is an enlargement of a 2 by 3 rectangle?"
                options: ["6 by 9", "5 by 6", "4 by 5"]
                answer: "6 by 9"
                feedback:
                  "4 by 5": "2 was added to each side. An enlargement multiplies every side by the same number."
                hints:
                  - "Look for both sides multiplied by the same number."
                  - "2 × 3 = 6. Is 3 × 3 the other side?"
                  - "6 by 9: both sides × 3."
              - id: l1-f4
                type: multiple_choice
                text: "A triangle has an angle of 40°. It is enlarged by scale factor 2. What size is that angle now?"
                options: ["40°", "80°", "42°"]
                answer: "40°"
                feedback:
                  "80°": "The sides double, but the angles stay the same."
                hints:
                  - "What changes in an enlargement: the sides or the angles?"
                  - "The sides get longer. The shape stays the same shape."
                  - "The angle is still 40°."
              - id: l1-f5
                type: text_input
                text: "A square has sides of 7 cm. It is enlarged by scale factor 4. How long is each side now, in cm?"
                answer: "28"
                hints:
                  - "Multiply the side by the scale factor."
                  - "7 × 4."
                  - "28 cm."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A side is 6 cm. The shape is enlarged by scale factor 5. How long is the side now?"
                options: ["30 cm", "11 cm", "65 cm"]
                answer: "30 cm"
                hints: ["Multiply by the scale factor: 6 × 5."]
              - id: l1-s2
                type: multiple_choice
                text: "A rectangle is 4 cm by 7 cm. It is enlarged by scale factor 3. What size is the new rectangle?"
                options: ["12 cm by 21 cm", "12 cm by 7 cm", "7 cm by 10 cm"]
                answer: "12 cm by 21 cm"
                hints: ["Both sides are multiplied by 3."]
              - id: l1-s3
                type: true_false
                text: "Is it true? A 3 by 4 rectangle and a 9 by 12 rectangle are similar."
                answer: true
                hints: ["Is each side multiplied by the same number?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which rectangle is similar to a 1 by 4 rectangle?"
                options: ["3 by 12", "3 by 6", "4 by 7"]
                answer: "3 by 12"
                hints: ["Both sides must be multiplied by the same number."]
              - id: l1-s5
                type: multiple_choice
                text: "A triangle has sides of 3 cm, 4 cm and 5 cm. It is enlarged by scale factor 2. How long is the longest side now?"
                options: ["10 cm", "7 cm", "8 cm"]
                answer: "10 cm"
                hints: ["The longest side is 5 cm. Multiply it by 2."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "A side is 9 cm. The shape is enlarged by scale factor 3. How long is the side now, in cm?"
                answer: "27"
              - id: l1-n2
                type: multiple_choice
                text: "A rectangle is 5 cm by 8 cm. It is enlarged by scale factor 4. What size is the new rectangle?"
                options: ["20 cm by 32 cm", "9 cm by 12 cm", "20 cm by 8 cm"]
                answer: "20 cm by 32 cm"
              - id: l1-n3
                type: true_false
                text: "Is it true? A 2 by 5 rectangle and a 4 by 7 rectangle are similar."
                answer: false
              - id: l1-n4
                type: text_input
                text: "A model car is 12 cm long. A poster shows it enlarged by scale factor 6. How long is the car on the poster, in cm?"
                answer: "72"
              - id: l1-n5
                type: true_false
                text: "Is it true? When a shape is enlarged by scale factor 3, its right angles become 270°."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "A side is 8 cm. The shape is enlarged by scale factor 2. How long is the side now?"
            options: ["16 cm", "10 cm", "82 cm"]
            answer: "16 cm"
          - id: l1-c2
            type: multiple_choice
            text: "A rectangle is 2 cm by 9 cm. It is enlarged by scale factor 3. What size is the new rectangle?"
            options: ["6 cm by 27 cm", "6 cm by 9 cm", "5 cm by 12 cm"]
            answer: "6 cm by 27 cm"
          - id: l1-c3
            type: true_false
            text: "Is it true? A 5 by 6 rectangle and a 10 by 12 rectangle are similar."
            answer: true
          - id: l1-c4
            type: text_input
            text: "A side is 7 cm. The shape is enlarged by scale factor 5. How long is the side now, in cm?"
            answer: "35"
          - id: l1-c5
            type: multiple_choice
            text: "Which rectangle is an enlargement of a 3 by 4 rectangle?"
            options: ["6 by 8", "5 by 6", "6 by 4"]
            answer: "6 by 8"
          - id: l1-c6
            type: true_false
            text: "Is it true? A square is enlarged by scale factor 2. Its corners are still right angles."
            answer: true

  - n: 2
    title: { de: Den Faktor finden, en: Finding the scale factor }
    goal:
      de: "Finde den Vergrößerungsfaktor aus zwei passenden Seiten, so wie 3 und 12 Zentimeter Faktor 4 ergeben, und berechne damit eine fehlende Länge."
      en: "Find the scale factor from two matching sides, like 3 and 12 centimetres give 4, and use it to find a missing length."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A side is 5 cm. The shape is enlarged by scale factor 3. How long is the side now?"
            options: ["15 cm", "8 cm", "53 cm"]
            answer: "15 cm"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? A 3 by 5 rectangle and a 6 by 8 rectangle are similar."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 cm → 12 cm. Scale factor: 12 ÷ 3 = 4"
            say: "Two shapes are similar. A side of three centimetres matches a side of twelve centimetres. To find the scale factor, divide the big length by the small length. Twelve divided by three is four."
          - text: "Small: 2 cm by 5 cm. Big: 6 cm by ? cm"
            say: "The short sides are two and six centimetres, so the scale factor is three. The long side of the big shape is five times three: fifteen centimetres."
          - text: "Big: 20 cm. Scale factor 4. Small: 20 ÷ 4 = 5 cm"
            say: "You can go back from the big shape to the small one. Then divide by the scale factor. Twenty divided by four is five centimetres."
          - text: "Match sides that correspond."
            say: "Always match the short side with the short side and the long side with the long side. These are corresponding sides."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "A side of 4 cm is enlarged to 20 cm. What is the scale factor?"
                options: ["5", "16", "80"]
                answer: "5"
                feedback:
                  "16": "That is the difference, 20 − 4. The scale factor is how many times bigger: divide."
                hints:
                  - "How many times does 4 go into 20?"
                  - "20 ÷ 4."
                  - "The scale factor is 5."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Two shapes are similar. A side of 6 cm matches a side of 18 cm. What is the scale factor from the small shape to the big one?"
                options: ["3", "1/3", "12"]
                answer: "3"
                option_audio: false
                feedback:
                  "1/3": "The shape gets bigger, so the scale factor is more than 1. Divide 18 by 6."
                hints:
                  - "Divide the big length by the small length."
                  - "18 ÷ 6."
                  - "The scale factor is 3."
              - id: l2-f3
                type: fill_in_blank
                text: "Small rectangle: 3 cm by 7 cm. Big rectangle: 12 cm by ? cm\n\nFind the scale factor and the long side."
                say: "The small rectangle is three centimetres by seven centimetres. The big rectangle is similar, and its short side is twelve centimetres. Find the scale factor and the long side."
                frame: "Scale factor: _   Long side: _ cm"
                options: ["4", "9", "16", "28"]
                answer: ["4", "28"]
                hints:
                  - "Use the short sides to find the scale factor."
                  - "12 ÷ 3 = 4. Then multiply the long side by 4."
                  - "Scale factor 4. 7 × 4 = 28 cm."
              - id: l2-f4
                type: text_input
                text: "A big triangle has a side of 35 cm. It is an enlargement by scale factor 5 of a small triangle. How long is that side on the small triangle, in cm?"
                answer: "7"
                hints:
                  - "Go back from big to small."
                  - "Divide by the scale factor: 35 ÷ 5."
                  - "7 cm."
              - id: l2-f5
                type: multiple_choice
                text: "A photo is 10 cm wide and 15 cm tall. It is enlarged so that it is 30 cm wide. How tall is it now?"
                options: ["45 cm", "35 cm", "30 cm"]
                answer: "45 cm"
                feedback:
                  "35 cm": "20 cm was added. Find the scale factor and multiply the height by it."
                hints:
                  - "Find the scale factor from the widths."
                  - "30 ÷ 10 = 3, so multiply the height by 3."
                  - "15 × 3 = 45 cm."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A side of 7 cm is enlarged to 42 cm. What is the scale factor?"
                options: ["6", "35", "7"]
                answer: "6"
                hints: ["42 ÷ 7."]
              - id: l2-s2
                type: fill_in_blank
                text: "Small rectangle: 2 cm by 9 cm. Big rectangle: 10 cm by ? cm\n\nFind the scale factor and the long side."
                say: "The small rectangle is two centimetres by nine centimetres. The big rectangle is similar, and its short side is ten centimetres. Find the scale factor and the long side."
                frame: "Scale factor: _   Long side: _ cm"
                options: ["5", "8", "17", "45"]
                answer: ["5", "45"]
                hints: ["10 ÷ 2 gives the scale factor."]
              - id: l2-s3
                type: multiple_choice
                text: "Two squares are similar. One has sides of 9 cm, the other 36 cm. What is the scale factor from the small square to the big one?"
                options: ["4", "1/4", "27"]
                answer: "4"
                option_audio: false
                hints: ["Big ÷ small."]
              - id: l2-s4
                type: text_input
                text: "A big rectangle is 48 cm long. It is an enlargement by scale factor 8 of a small one. How long is the small rectangle, in cm?"
                answer: "6"
                hints: ["Divide by the scale factor."]
              - id: l2-s5
                type: multiple_choice
                text: "A flag is 4 cm by 6 cm. A big copy is 20 cm wide on the short side. How long is its long side?"
                options: ["30 cm", "22 cm", "24 cm"]
                answer: "30 cm"
                hints: ["20 ÷ 4 = 5. Multiply 6 by 5."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "A model boat is 8 cm long. The real boat is 400 cm long. What is the scale factor?"
                answer: "50"
              - id: l2-n2
                type: text_input
                text: "A garden on a plan is 5 cm by 3 cm. The real garden is 500 cm long on the long side. How wide is the real garden, in cm?"
                answer: "300"
              - id: l2-n3
                type: multiple_choice
                text: "A poster is an enlargement of a card by scale factor 4. The poster is 60 cm tall. How tall is the card?"
                options: ["15 cm", "240 cm", "56 cm"]
                answer: "15 cm"
              - id: l2-n4
                type: multiple_choice
                text: "Ruby enlarges a 6 cm by 4 cm picture. The long side is now 18 cm. How long is the short side?"
                options: ["12 cm", "16 cm", "8 cm"]
                answer: "12 cm"
              - id: l2-n5
                type: true_false
                text: "Is it true? A triangle with sides 2 cm, 3 cm and 4 cm is similar to one with sides 6 cm, 9 cm and 12 cm."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: enlarge
            type: multiple_choice
            text: "A side is 11 cm. The shape is enlarged by scale factor 3. How long is the side now?"
            options: ["33 cm", "14 cm", "113 cm"]
            answer: "33 cm"
          - id: l2-c2
            part: similar
            type: multiple_choice
            text: "Which rectangle is similar to a 3 by 5 rectangle?"
            options: ["12 by 20", "6 by 8", "9 by 20"]
            answer: "12 by 20"
          - id: l2-c3
            part: missing
            type: fill_in_blank
            text: "Small rectangle: 4 cm by 5 cm. Big rectangle: 24 cm by ? cm\n\nFind the scale factor and the long side."
            say: "The small rectangle is four centimetres by five centimetres. The big rectangle is similar, and its short side is twenty-four centimetres. Find the scale factor and the long side."
            frame: "Scale factor: _   Long side: _ cm"
            options: ["6", "20", "25", "30"]
            answer: ["6", "30"]
          - id: l2-c4
            part: find-factor
            type: multiple_choice
            text: "Two similar triangles have matching sides of 5 cm and 35 cm. What is the scale factor from the small triangle to the big one?"
            options: ["7", "1/7", "30"]
            answer: "7"
            option_audio: false
          - id: l2-c5
            part: enlarge
            type: text_input
            text: "A model house is 9 cm tall. The scale factor is 100. How tall is the real house, in cm?"
            answer: "900"
          - id: l2-c6
            part: enlarge
            type: text_input
            text: "A rectangle is 6 cm by 2 cm. It is enlarged by scale factor 5. How long is the long side now, in cm?"
            answer: "30"
          - id: l2-c7
            part: enlarge
            type: multiple_choice
            text: "A square has sides of 3 cm. It is enlarged by scale factor 7. How long is each side now?"
            options: ["21 cm", "10 cm", "37 cm"]
            answer: "21 cm"
          - id: l2-c8
            part: enlarge
            type: true_false
            text: "Is it true? A 4 cm by 6 cm rectangle enlarged by scale factor 2 becomes 8 cm by 8 cm."
            answer: false
          - id: l2-c9
            part: similar
            type: multiple_choice
            text: "A triangle has an angle of 75°. It is enlarged by scale factor 4. What size is that angle now?"
            options: ["75°", "300°", "79°"]
            answer: "75°"
          - id: l2-c10
            part: similar
            type: true_false
            text: "Is it true? A 5 by 2 rectangle and a 20 by 8 rectangle are similar."
            answer: true
          - id: l2-c11
            part: similar
            type: multiple_choice
            text: "Which rectangle is not similar to a 2 by 6 rectangle?"
            options: ["4 by 12", "5 by 15", "4 by 8"]
            answer: "4 by 8"
          - id: l2-c12
            part: similar
            type: multiple_choice
            text: "A triangle has sides of 3 cm, 5 cm and 6 cm. Which triangle is similar to it?"
            options: ["6 cm, 10 cm, 12 cm", "6 cm, 8 cm, 9 cm", "4 cm, 6 cm, 7 cm"]
            answer: "6 cm, 10 cm, 12 cm"
          - id: l2-c13
            part: find-factor
            type: text_input
            text: "A side of 8 cm is enlarged to 72 cm. What is the scale factor?"
            answer: "9"
          - id: l2-c14
            part: find-factor
            type: multiple_choice
            text: "A photo 12 cm wide is printed 60 cm wide. What is the scale factor?"
            options: ["5", "48", "1/5"]
            answer: "5"
            option_audio: false
          - id: l2-c15
            part: find-factor
            type: true_false
            text: "Is it true? Two shapes are similar. A 3 cm side matches a 24 cm side, so the scale factor is 8."
            answer: true
          - id: l2-c16
            part: find-factor
            type: multiple_choice
            text: "A model plane is 25 cm long. The real plane is 2500 cm long. What is the scale factor?"
            options: ["100", "2475", "10"]
            answer: "100"
          - id: l2-c17
            part: missing
            type: text_input
            text: "A rectangle is 3 cm by 8 cm. A similar rectangle has a short side of 15 cm. How long is its long side, in cm?"
            answer: "40"
          - id: l2-c18
            part: missing
            type: text_input
            text: "A real car is 400 cm long. It is an enlargement of a toy car by scale factor 40. How long is the toy car, in cm?"
            answer: "10"
          - id: l2-c19
            part: missing
            type: multiple_choice
            text: "A door on a plan is 2 cm wide and 5 cm tall. The real door is 80 cm wide. How tall is the real door?"
            options: ["200 cm", "83 cm", "160 cm"]
            answer: "200 cm"
          - id: l2-c20
            part: missing
            type: true_false
            text: "Is it true? A 6 cm by 10 cm picture is enlarged so that its short side is 18 cm. Its long side is now 22 cm."
            answer: false
