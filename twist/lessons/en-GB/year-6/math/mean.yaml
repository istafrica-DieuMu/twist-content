# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.mean
skill: math.data.mean
curriculum: en-GB
language: en
title:
  de: Mittelwert
  en: The mean
summary: >
  The mean as an average. Lesson 1 levels out bars so that every bar is
  the same height, then works out the mean as the total ÷ the number of
  values. Lesson 2 uses mean × number to find the total or a missing
  value, sees how one very big value pulls the mean up, compares groups,
  and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [math.data.read-tables, math.written-mult-div.div-one-digit]
  also_practises: [math.data.read-tables]
  vocabulary: { en: [mean, average, total, data, value, share equally, outlier] }
  forms: [drawn, text, audio]
  drawn: [bar-chart, table]
  facets: [number-format]
  parts:
    - { id: calculate, what: { de: den Mittelwert als Summe geteilt durch die Anzahl berechnen, en: working out the mean as the total divided by the number of values } }
    - { id: from-data, what: { de: den Mittelwert aus einem Diagramm oder einer Tabelle berechnen, en: finding the mean from a chart or a table } }
    - { id: total-missing, what: { de: aus dem Mittelwert die Summe oder einen fehlenden Wert finden, en: finding the total or a missing value from the mean } }
    - { id: interpret, what: { de: den Mittelwert deuten und Gruppen vergleichen, en: interpreting the mean and comparing groups } }
  misconceptions:
    - id: total-not-divided
      what: Gives the total as the mean, or divides by the wrong number of values
      addressed: lesson 1 Learn adds, then divides by how many values; l1-f1 and l1-f3 have feedback, l1-s4, l1-n4 and l2-c2 offer the total
    - id: middle-value
      what: Takes the middle value or the most common value as the mean
      addressed: l1-f4 asks whether the middle value is the mean; l1-s4 offers the middle value
    - id: mean-is-everyone
      what: Thinks a higher mean means every member of the group did better, or that the mean shows what most did
      addressed: lesson 2 Learn shows one big value pulling the mean up; l2-f3, l2-f5 and l2-c4 ask about it
    - id: missing-value
      what: Uses the mean itself as the missing value instead of working from the total
      addressed: lesson 2 Learn finds the total as mean × number first; l2-f1, l2-f4, l2-s2, l2-n2 and l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Den Mittelwert berechnen, en: Working out the mean }
    goal:
      de: "Berechne den Mittelwert: Zähl alle Werte zusammen und teil durch ihre Anzahl, so wie 2, 5 und 8 Sticker ergeben im Mittel 5."
      en: "Work out the mean by adding the values and dividing by how many there are, like 2, 5 and 8 give 5."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "How many goals were scored in all four matches?"
            show: { drawn: table, rows: [[Match, Goals], ["1", "3"], ["2", "1"], ["3", "4"], ["4", "2"]] }
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "245 ÷ 5 = _"
            answer: "49"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ava 2, Ben 5, Cal 8"
            say: "Three children have some stickers. Ava has two, Ben has five and Cal has eight. If they shared them out equally, how many would each child have?"
            show: { drawn: bar-chart, rows: [[Ava, 2], [Ben, 5], [Cal, 8]], step: 1 }
          - text: "Cal gives 3 to Ava: 5, 5, 5"
            say: "Cal gives three stickers to Ava. Now every child has five. Five is the mean: the amount each one would have if everything were shared out equally."
            show: { drawn: bar-chart, rows: [[Ava, 5], [Ben, 5], [Cal, 5]], step: 1 }
          - text: "Mean = total ÷ number of values. (2 + 5 + 8) ÷ 3 = 15 ÷ 3 = 5"
            say: "You can work out the mean without moving anything. Add all the values to find the total. Then divide by how many values there are. Fifteen divided by three is five."
          - text: "3, 4, 8: mean = 15 ÷ 3 = 5"
            say: "The mean does not have to be one of the numbers. The mean of three, four and eight is five. And it is not always the middle number: here the middle number is four."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Books read by a group. What is the mean number of books?"
                show: { drawn: bar-chart, rows: [[Mo, 3], [Isla, 5], [Raj, 7]], step: 1 }
                options: ["5", "15", "7"]
                answer: "5"
                feedback:
                  "15": "15 is the total. Share it between the 3 children: 15 ÷ 3."
                hints:
                  - "Add the books, then divide by the number of children."
                  - "3 + 5 + 7 = 15. There are 3 children."
                  - "15 ÷ 3 = 5."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Scores: 6, 8, 10, 4. Find the mean."
                frame: "6 + 8 + 10 + 4 = _, _ ÷ 4 = _"
                options: ["7", "24", "28", "32"]
                answer: ["28", "28", "7"]
                hints:
                  - "Find the total first."
                  - "The total is 28. There are 4 scores."
                  - "28 ÷ 4 = 7."
              - id: l1-f3
                type: multiple_choice
                text: "What is the mean of 12, 15 and 9?"
                options: ["12", "36", "15"]
                answer: "12"
                feedback:
                  "36": "36 is the total. Divide it by the number of values, 3."
                hints:
                  - "Total ÷ number of values."
                  - "12 + 15 + 9 = 36."
                  - "36 ÷ 3 = 12."
              - id: l1-f4
                type: true_false
                text: "Is it true? The mean of 2, 4 and 9 is 4, because 4 is in the middle."
                answer: false
                hints:
                  - "Work out total ÷ number of values."
                  - "2 + 4 + 9 = 15, and 15 ÷ 3 = 5."
                  - "No. The mean is 5, not the middle number."
              - id: l1-f5
                type: text_input
                text: "What is the mean of 10, 20, 30, 40 and 50?"
                answer: "30"
                hints:
                  - "Add them up, then divide by 5."
                  - "The total is 150."
                  - "150 ÷ 5 = 30."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "What is the mean number of goals per match?"
                show: { drawn: table, rows: [[Match, Goals], ["1", "2"], ["2", "0"], ["3", "4"], ["4", "2"]] }
                answer: "2"
                hints: ["The total is 8. There are 4 matches."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the mean of 7, 7, 7 and 7?"
                options: ["7", "28", "4"]
                answer: "7"
                hints: ["They are already equal."]
              - id: l1-s3
                type: text_input
                text: "What is the mean of 15, 25 and 20?"
                answer: "20"
                hints: ["The total is 60."]
              - id: l1-s4
                type: multiple_choice
                text: "What is the mean of 3, 5, 6 and 10?"
                options: ["6", "24", "5.5"]
                answer: "6"
                hints: ["Total ÷ 4. Do not just pick the middle."]
              - id: l1-s5
                type: text_input
                text: "What is the mean of 4, 5, 6 and 7?"
                keyboard: decimal
                answer: "5.5"
                hints: ["22 ÷ 4. The mean can be a decimal."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "What is the mean of 8, 12 and 10?"
                answer: "10"
              - id: l1-n2
                type: text_input
                text: "Heights of four children in cm. What is the mean height, in cm?"
                show: { drawn: bar-chart, rows: [[Sam, 130], [Ella, 140], [Jo, 150], [Kai, 140]], step: 10, from: 100 }
                answer: "140"
              - id: l1-n3
                type: text_input
                text: "What is the mean of 2, 3, 3, 4 and 5?"
                keyboard: decimal
                answer: "3.4"
              - id: l1-n4
                type: multiple_choice
                text: "The temperature at noon on five days: 10 °C, 12 °C, 9 °C, 14 °C, 15 °C. What is the mean?"
                options: ["12 °C", "60 °C", "14 °C"]
                answer: "12 °C"
              - id: l1-n5
                type: true_false
                text: "Is it true? The mean of 1, 2, 3 and 10 is 4."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "What is the mean of 4, 6 and 8?"
            answer: "6"
          - id: l1-c2
            type: text_input
            text: "Pages read each day. What is the mean number of pages?"
            show: { drawn: table, rows: [[Day, Pages], [Mon, "20"], [Tue, "30"], [Wed, "40"], [Thu, "10"]] }
            answer: "25"
          - id: l1-c3
            type: multiple_choice
            text: "What is the mean of 9, 11, 13 and 7?"
            options: ["10", "40", "11"]
            answer: "10"
          - id: l1-c4
            type: text_input
            text: "What is the mean of 11, 13, 17 and 19?"
            answer: "15"
          - id: l1-c5
            type: true_false
            text: "Is it true? The mean of 5, 6 and 10 is 7."
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Apples picked by three children. What is the mean number of apples?"
            show: { drawn: bar-chart, rows: [[Lily, 9], [Omar, 7], [Ruby, 2]], step: 1 }
            options: ["6", "18", "7"]
            answer: "6"

  - n: 2
    title: { de: Mit dem Mittelwert arbeiten, en: Using the mean }
    goal:
      de: "Nutze den Mittelwert, um die Summe oder einen fehlenden Wert zu finden, so wie 4 Zahlen mit Mittelwert 6 zusammen 24 ergeben."
      en: "Use the mean to find a total or a missing value, like 4 numbers with a mean of 6 adding up to 24."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "What is the mean of 5, 9 and 7?"
            answer: "7"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is the mean of 2, 6, 4 and 8?"
            options: ["5", "20", "4"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4 numbers, mean 6. Total = 6 × 4 = 24"
            say: "If you know the mean, you can find the total. Four numbers have a mean of six. So their total is six times four: twenty-four."
          - text: "5, 7, 8, ?  Mean 6. 24 − 20 = 4"
            say: "Three of the numbers are five, seven and eight. They add up to twenty. The total must be twenty-four, so the missing number is four."
          - text: "£3, £4, £3, £5, £35: mean £10"
            say: "Five friends get pocket money. The total is fifty pounds, so the mean is ten pounds. But four of them get five pounds or less. One very big value pulls the mean up, so the mean does not show what most of them get."
          - text: "Class A mean 8, class B mean 6"
            say: "A mean helps you compare groups. On average, class A did better. But that does not mean every child in class A did better than every child in class B."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "The mean of 3 numbers is 8. Two of them are 5 and 7."
                frame: "Total = 8 × 3 = _. The third number is _"
                options: ["8", "12", "15", "24"]
                answer: ["24", "12"]
                feedback:
                  "8": "8 is the mean, not the missing number. Use the total: 24 − 5 − 7."
                hints:
                  - "Find the total from the mean first."
                  - "8 × 3 = 24. The two numbers make 12."
                  - "24 − 12 = 12."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The mean of 4 numbers is 10. What is their total?"
                options: ["40", "14", "2.5"]
                answer: "40"
                feedback:
                  "14": "That adds 10 and 4. The total is the mean × the number of values."
                hints:
                  - "Total = mean × number of values."
                  - "10 × 4."
                  - "40."
              - id: l2-f3
                type: multiple_choice
                text: "Pocket money: £2, £5, £4, £4, £40. The mean is £11. Does the mean show what most of them get?"
                options: ["No, one big amount pulls it up", "Yes, most get about £11", "No, the mean is too small"]
                answer: "No, one big amount pulls it up"
                hints:
                  - "Look at the amounts most of them get."
                  - "Four get £5 or less. One gets £40."
                  - "No: the £40 pulls the mean up."
              - id: l2-f4
                type: text_input
                text: "Ellie's mean score in 4 tests is 7. In three tests she scored 6, 8 and 5. What did she score in the fourth test?"
                answer: "9"
                hints:
                  - "Find her total from the mean."
                  - "7 × 4 = 28. The three scores make 19."
                  - "28 − 19 = 9."
              - id: l2-f5
                type: true_false
                text: "Is it true? Class A's mean score is 8 and class B's is 6, so every child in class A scored more than every child in class B."
                answer: false
                hints:
                  - "A mean is an average for the whole group."
                  - "Some children in class B could still score more than some in class A."
                  - "No, it only says class A did better on average."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "The mean of 5 numbers is 6. What is their total?"
                answer: "30"
                hints: ["Mean × number of values."]
              - id: l2-s2
                type: text_input
                text: "The mean of 4, 9 and one more number is 7. What is the missing number?"
                answer: "8"
                hints: ["7 × 3 = 21. 4 + 9 = 13."]
              - id: l2-s3
                type: multiple_choice
                text: "Team A scored 2, 3 and 4 goals. Team B scored 1, 5 and 6 goals. Which team has the higher mean?"
                options: ["Team A", "Team B", "they are the same"]
                answer: "Team B"
                keep_order: true
                hints: ["Team A: 9 ÷ 3. Team B: 12 ÷ 3."]
              - id: l2-s4
                type: multiple_choice
                text: "Five children read a mean of 5 books. A sixth child, who read 20 books, joins them. What happens to the mean?"
                options: ["it goes up", "it goes down", "it stays the same"]
                answer: "it goes up"
                keep_order: true
                hints: ["20 is much bigger than 5."]
              - id: l2-s5
                type: text_input
                text: "Three bags have a mean mass of 4 kg. A fourth bag of 8 kg is added. What is the new mean, in kg?"
                answer: "5"
                hints: ["The three bags make 12 kg. Add 8 kg, then divide by 4."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "Max ran 5 km, 3 km, 4 km and 4 km. What is the mean distance, in km?"
                answer: "4"
              - id: l2-n2
                type: text_input
                text: "The mean height of 3 plants is 15 cm. Two of them are 12 cm and 20 cm. How tall is the third plant, in cm?"
                answer: "13"
              - id: l2-n3
                type: text_input
                text: "The mean age of 6 children is 10. What is the total of their ages?"
                answer: "60"
              - id: l2-n4
                type: multiple_choice
                text: "Ali scored a mean of 6 points in 4 games. Bea scored 25 points in 5 games. Who has the higher mean?"
                options: ["Ali", "Bea", "they are the same"]
                answer: "Ali"
                keep_order: true
              - id: l2-n5
                type: text_input
                text: "Four parcels weigh 2 kg, 3 kg, 4 kg and 4 kg. What is their mean mass, in kg?"
                keyboard: decimal
                answer: "3.25"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: calculate
            type: text_input
            text: "What is the mean of 14, 16, 18 and 12?"
            answer: "15"
          - id: l2-c2
            part: from-data
            type: multiple_choice
            text: "Cakes sold each day. What is the mean number of cakes?"
            show: { drawn: bar-chart, rows: [[Mon, 6], [Tue, 2], [Wed, 4], [Thu, 8]], step: 1 }
            options: ["5", "20", "4"]
            answer: "5"
          - id: l2-c3
            part: total-missing
            type: text_input
            text: "The mean of 5 numbers is 8. Four of them are 5, 7, 9 and 10. What is the fifth number?"
            answer: "9"
          - id: l2-c4
            part: interpret
            type: multiple_choice
            text: "Race times: 30 s, 32 s, 31 s, 29 s and 78 s. Which is true?"
            say: "Race times: thirty seconds, thirty-two seconds, thirty-one seconds, twenty-nine seconds and seventy-eight seconds. Which is true?"
            option_audio: false
            options: ["The mean is 40 s, but most times are about 30 s.", "The mean is 30 s.", "Most times are about 40 s."]
            answer: "The mean is 40 s, but most times are about 30 s."
          - id: l2-c5
            part: calculate
            type: text_input
            text: "What is the mean of 3, 4, 6 and 8?"
            keyboard: decimal
            answer: "5.25"
          - id: l2-c6
            part: calculate
            type: multiple_choice
            text: "What is the mean of 21, 25, 17 and 29?"
            options: ["23", "92", "21"]
            answer: "23"
          - id: l2-c7
            part: calculate
            type: true_false
            text: "Is it true? The mean of 6, 9 and 12 is 9."
            answer: true
          - id: l2-c8
            part: calculate
            type: text_input
            text: "What is the mean of 9, 4, 6, 7 and 9?"
            answer: "7"
          - id: l2-c9
            part: from-data
            type: text_input
            text: "Points scored in four games. What is the mean number of points?"
            show: { drawn: table, rows: [[Game, Points], ["1", "12"], ["2", "8"], ["3", "15"], ["4", "9"]] }
            answer: "11"
          - id: l2-c10
            part: from-data
            type: multiple_choice
            text: "Rainfall in three months, in mm. What is the mean rainfall?"
            show: { drawn: bar-chart, rows: [[Jan, 50], [Feb, 40], [Mar, 75]], step: 5 }
            options: ["55 mm", "165 mm", "50 mm"]
            answer: "55 mm"
          - id: l2-c11
            part: from-data
            type: true_false
            text: "Pets owned by four children. Is it true that the mean number of pets is 3?"
            show: { drawn: bar-chart, rows: [[Amy, 1], [Leo, 4], [Zara, 2], [Tom, 5]], step: 1 }
            answer: true
          - id: l2-c12
            part: from-data
            type: text_input
            text: "Hours of sleep on four nights. What is the mean, in hours?"
            show: { drawn: table, rows: [[Night, Hours], [Fri, "9"], [Sat, "10"], [Sun, "8"], [Mon, "8"]] }
            keyboard: decimal
            answer: "8.75"
          - id: l2-c13
            part: total-missing
            type: text_input
            text: "The mean of 6 numbers is 9. What is their total?"
            answer: "54"
          - id: l2-c14
            part: total-missing
            type: multiple_choice
            text: "The mean of 3 numbers is 12. Two of them are 10 and 15. What is the third number?"
            options: ["11", "12", "25"]
            answer: "11"
          - id: l2-c15
            part: total-missing
            type: text_input
            text: "Zac's mean score in 5 spelling tests is 8. In four of the tests he scored 7, 9, 6 and 8. What did he score in the fifth test?"
            answer: "10"
          - id: l2-c16
            part: total-missing
            type: true_false
            text: "Is it true? 4 bags have a mean mass of 3 kg, so together they weigh 7 kg."
            answer: false
          - id: l2-c17
            part: interpret
            type: multiple_choice
            text: "Class A's mean spelling score is 7. Class B's mean score is 9. Which is true?"
            options: ["On average, class B did better.", "Every child in class B did better.", "Class B has more children."]
            answer: "On average, class B did better."
          - id: l2-c18
            part: interpret
            type: true_false
            text: "Five friends have 1, 2, 2, 3 and 42 marbles. The mean is 10. Is it true that most of them have about 10 marbles?"
            answer: false
          - id: l2-c19
            part: interpret
            type: multiple_choice
            text: "Four children have a mean of 6 stickers. A fifth child with 6 stickers joins them. What happens to the mean?"
            options: ["it goes up", "it goes down", "it stays the same"]
            keep_order: true
            answer: "it stays the same"
          - id: l2-c20
            part: interpret
            type: multiple_choice
            text: "Jo scored 18 points in 3 games. Kit scored 35 points in 5 games. Who has the higher mean?"
            options: ["Jo", "Kit", "they are the same"]
            keep_order: true
            answer: "Kit"
