# Lesson set: Maths, Year 6. Hand-authored draft.
id: en-GB.math.relative-size
skill: math.percentages-ratio.relative-size
curriculum: en-GB
language: en
title:
  de: Verhältnisse
  en: Ratio and relative size
summary: >
  Two quantities in a fixed ratio. Lesson 1 uses "for every" (3 red beads
  for every 2 blue), scales both up together in a table and finds a
  missing value with multiplication and division facts; lesson 2 writes
  the ratio as 3 : 2 in the right order, links it to the fraction of the
  whole (3 out of every 5), scales recipes through the amount for one,
  and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Verhältnisse, en: Ratio }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.patterns.proportional]
  also_practises: [math.patterns.proportional]
  vocabulary: { en: [ratio, for every, relative size, scale up, recipe, "3 : 2", fraction of the whole] }
  forms: [drawn, text, audio]
  drawn: [dots, table]
  facets: []
  misconceptions:
    - id: adds-not-scales
      what: Adds the same amount to both quantities instead of multiplying (2 blue to 5 red, so 4 blue to 7 red)
      addressed: lesson 1 Learn scales in groups; l1-f1 has feedback, l1-f3, l1-s1, l1-s5, l1-n2, l1-c1, l2-n2, l2-n3 and l2-c1 offer the added answer
    - id: ratio-order
      what: Writes the ratio the wrong way round (dogs to cats for cats to dogs)
      addressed: lesson 2 Learn says the order matters; l2-f1 has feedback, l2-s1 and l2-c2 ask again
    - id: ratio-as-fraction
      what: "Reads 2 : 3 as the fraction 2/3 of the whole instead of 2/5"
      addressed: lesson 2 Learn shows 3 out of every 5; l2-f2 has feedback, l2-s2 and l2-c4 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Auf je ... kommen ...", en: "For every" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1 bag of apples costs £2. How much do 4 bags cost?"
            options: ["£8", "£6", "£2"]
            answer: "£8"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "3 pencils cost 45p. How much does 1 pencil cost? _p"
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 red beads for every 2 blue beads"
            say: "On this necklace there are three red beads for every two blue beads. The pattern repeats all the way round."
            show: { drawn: dots, count: 5, layout: row, colour_split: [3, 2] }
          - text: "Scale both up together."
            say: "Each time the pattern repeats, there are three more red and two more blue. Six red go with four blue, nine red with six blue, twelve red with eight blue."
            show: { drawn: table, rows: [[Red, Blue], ["3", "2"], ["6", "4"], ["9", "6"], ["12", "8"]] }
          - text: "15 red: 15 ÷ 3 = 5 groups\n5 × 2 = 10 blue"
            say: "To find the blue beads that go with fifteen red, find the number of groups first. Fifteen divided by three is five groups. Each group has two blue, so five times two is ten blue beads."
          - text: "1 adult for every 4 children\n32 children: 32 ÷ 4 = 8 adults"
            say: "A school trip needs one adult for every four children. For thirty-two children, thirty-two divided by four is eight, so eight adults."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "There are 5 red beads for every 2 blue beads. There are 4 blue beads. How many red beads are there?"
                show: { drawn: dots, count: 7, layout: row, colour_split: [5, 2] }
                options: ["10", "7", "9"]
                answer: "10"
                feedback:
                  "7": "Blue went from 2 to 4, which is double. Red doubles too: 5 × 2, not 5 + 2."
                hints:
                  - "How many groups of 2 blue beads are there?"
                  - "4 blue beads are 2 groups. Each group has 5 red."
                  - "2 × 5 = 10 red beads."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "There are 3 red for every 2 blue. Fill the gaps."
                show: { drawn: table, rows: [[Red, Blue], ["3", "2"], ["6", "?"], ["?", "6"]] }
                frame: "6 red: _ blue   _ red: 6 blue"
                options: ["4", "9", "5", "7"]
                answer: ["4", "9"]
                hints:
                  - "6 red is two groups of 3."
                  - "Two groups have 2 × 2 blue. 6 blue is three groups."
                  - "4 blue, and 3 × 3 = 9 red."
              - id: l1-f3
                type: multiple_choice
                text: "A recipe uses 3 cups of flour for every 1 cup of sugar. How much flour goes with 4 cups of sugar?"
                options: ["12 cups", "6 cups", "7 cups"]
                answer: "12 cups"
                hints:
                  - "Each cup of sugar needs 3 cups of flour."
                  - "4 cups of sugar is 4 groups."
                  - "4 × 3 = 12 cups of flour."
              - id: l1-f4
                type: text_input
                text: "A school trip needs 1 adult for every 6 children. How many adults are needed for 30 children?"
                answer: "5"
                hints:
                  - "How many groups of 6 children are there?"
                  - "30 ÷ 6."
                  - "5 groups, so 5 adults."
              - id: l1-f5
                type: multiple_choice
                text: "A bag has 4 green sweets for every 1 yellow sweet. There are 20 green sweets. How many sweets are there altogether?"
                options: ["25", "20", "24"]
                answer: "25"
                hints:
                  - "First find the yellow sweets."
                  - "20 green is 5 groups of 4, so there are 5 yellow."
                  - "20 + 5 = 25 sweets."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "There are 3 dogs for every 2 cats. There are 8 cats. How many dogs are there?"
                options: ["12", "9", "11"]
                answer: "12"
                hints: ["8 cats are 4 groups of 2."]
              - id: l1-s2
                type: text_input
                text: "A paint mix uses 2 tins of yellow for every 1 tin of blue. How many tins of yellow go with 7 tins of blue?"
                answer: "14"
                hints: ["Each tin of blue needs 2 tins of yellow."]
              - id: l1-s3
                type: fill_in_blank
                text: "There are 5 red for every 2 blue. Fill the gaps."
                show: { drawn: table, rows: [[Red, Blue], ["5", "2"], ["10", "?"], ["?", "8"]] }
                frame: "10 red: _ blue   _ red: 8 blue"
                options: ["4", "20", "7", "16"]
                answer: ["4", "20"]
                hints: ["8 blue is 4 groups of 2."]
              - id: l1-s4
                type: true_false
                text: "Is it true? There are 3 boys for every 4 girls. With 12 girls, there are 9 boys."
                answer: true
                hints: ["12 girls are how many groups of 4?"]
              - id: l1-s5
                type: multiple_choice
                text: "A recipe for 4 people uses 6 eggs. How many eggs are needed for 12 people?"
                options: ["18", "14", "24"]
                answer: "18"
                hints: ["12 people are 3 times as many as 4."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: text_input
                text: "A class has 1 tablet for every 5 pupils. How many tablets are there for 35 pupils?"
                answer: "7"
              - id: l1-n2
                type: multiple_choice
                text: "Orange squash is mixed with 1 part squash for every 4 parts water. Ella uses 200 ml of squash. How much water does she need?"
                options: ["800 ml", "204 ml", "50 ml"]
                answer: "800 ml"
              - id: l1-n3
                type: text_input
                text: "A pattern has 3 squares for every 5 circles. There are 15 circles. How many squares are there?"
                answer: "9"
              - id: l1-n4
                type: true_false
                text: "Is it true? A fruit bowl has 2 apples for every 7 grapes. With 6 apples there are 11 grapes."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "On a map, 1 cm stands for 5 km. Two towns are 7 cm apart on the map. How far apart are they really?"
                options: ["35 km", "12 km", "75 km"]
                answer: "35 km"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "There are 4 red beads for every 3 blue beads. There are 12 red beads. How many blue beads are there?"
            options: ["9", "11", "16"]
            answer: "9"
          - id: l1-c2
            type: text_input
            text: "A trip needs 1 adult for every 8 children. How many adults are needed for 40 children?"
            answer: "5"
          - id: l1-c3
            type: fill_in_blank
            text: "There are 2 red for every 5 blue. Fill the gaps."
            show: { drawn: table, rows: [[Red, Blue], ["2", "5"], ["4", "?"], ["?", "20"]] }
            frame: "4 red: _ blue   _ red: 20 blue"
            options: ["10", "8", "7", "18"]
            answer: ["10", "8"]

  - n: 2
    title: { de: "Verhältnisse schreiben und nutzen", en: "Writing and using ratios" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "There are 3 red beads for every 2 blue beads. There are 9 red beads. How many blue beads are there?"
            options: ["6", "8", "4"]
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "A trip needs 1 teacher for every 7 children. How many teachers are needed for 28 children?"
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 red for every 2 blue: the ratio of red to blue is 3 : 2"
            say: "We write three red for every two blue as a ratio: three to two. The order matters. Red to blue is three to two, but blue to red is two to three."
            show: { drawn: dots, count: 5, layout: row, colour_split: [3, 2] }
          - text: "3 : 2 means 3 red in every 5 beads: 3/5 are red"
            say: "In every group of five beads, three are red and two are blue. So three fifths of all the beads are red, and two fifths are blue. The ratio compares the parts; the fraction compares a part with the whole."
          - text: "6 people: 300 g of pasta. 4 people?\n1 person: 300 ÷ 6 = 50 g\n4 people: 50 × 4 = 200 g"
            say: "When the numbers do not scale straight up, find the amount for one first. Three hundred grams for six people is fifty grams each. Four people need fifty times four, which is two hundred grams."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "There are 5 red cars for every 3 blue cars. What is the ratio of red to blue?"
                options: ["5 : 3", "3 : 5", "5 : 8"]
                answer: "5 : 3"
                feedback:
                  "3 : 5": "Red comes first in red to blue, so 5 comes first."
                  "5 : 8": "8 is all the cars. The ratio compares red with blue."
                hints:
                  - "Red to blue: red first."
                  - "There are 5 red and 3 blue in each group."
                  - "5 : 3."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "The ratio of red to blue beads is 2 : 3. What fraction of the beads are red?"
                show: { drawn: dots, count: 5, layout: row, colour_split: [2, 3] }
                options: ["2/5", "2/3", "3/5"]
                answer: "2/5"
                feedback:
                  "2/3": "2/3 compares red with blue. Out of every 5 beads, 2 are red."
                hints:
                  - "How many beads are in one group?"
                  - "2 red and 3 blue make 5 beads."
                  - "2 out of 5 are red: 2/5."
              - id: l2-f3
                type: fill_in_blank
                text: "A recipe for 6 people uses 300 g of pasta. Find the pasta for 4 people."
                frame: "1 person: _ g   4 people: _ g"
                options: ["50", "200", "75", "298"]
                answer: ["50", "200"]
                hints:
                  - "Find the amount for 1 person first."
                  - "300 ÷ 6 = 50."
                  - "50 g, then 50 × 4 = 200 g."
              - id: l2-f4
                type: text_input
                text: "The ratio of boys to girls in a club is 4 : 5. There are 20 boys. How many girls are there?"
                answer: "25"
                hints:
                  - "For every 4 boys there are 5 girls."
                  - "20 boys are 5 groups of 4."
                  - "5 × 5 = 25 girls."
              - id: l2-f5
                type: multiple_choice
                text: "8 pencils cost £2. How much do 12 pencils cost?"
                options: ["£3", "£6", "£2.50"]
                answer: "£3"
                hints:
                  - "Find the cost of 4 pencils, or of 1 pencil."
                  - "4 pencils cost £1."
                  - "12 pencils are 3 lots of 4: £3."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "There are 7 dogs for every 2 cats. What is the ratio of cats to dogs?"
                options: ["2 : 7", "7 : 2", "2 : 9"]
                answer: "2 : 7"
                hints: ["Cats to dogs: cats first."]
              - id: l2-s2
                type: multiple_choice
                text: "The ratio of green to yellow counters is 3 : 1. What fraction of the counters are green?"
                options: ["3/4", "3/1", "1/4"]
                answer: "3/4"
                hints: ["3 green and 1 yellow make a group of 4."]
              - id: l2-s3
                type: text_input
                text: "A recipe for 4 people uses 6 potatoes. How many potatoes are needed for 10 people?"
                answer: "15"
                hints: ["Find the potatoes for 2 people first."]
              - id: l2-s4
                type: true_false
                text: "Is it true? The ratio of red to blue beads is 3 : 4. With 15 red beads there are 20 blue beads."
                answer: true
                hints: ["15 red is how many groups of 3?"]
              - id: l2-s5
                type: multiple_choice
                text: "5 bus tickets cost £15. How much do 8 tickets cost?"
                options: ["£24", "£18", "£40"]
                answer: "£24"
                hints: ["Find the cost of 1 ticket first."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "Pastry uses flour and butter in the ratio 2 : 1. Sam uses 300 g of flour. How many grams of butter does he need?"
                answer: "150"
              - id: l2-n2
                type: multiple_choice
                text: "A class has 3 girls for every 2 boys. There are 12 boys. How many girls are there?"
                options: ["18", "13", "8"]
                answer: "18"
              - id: l2-n3
                type: multiple_choice
                text: "A recipe for 8 biscuits uses 120 g of sugar. How much sugar is needed for 6 biscuits?"
                options: ["90 g", "118 g", "160 g"]
                answer: "90 g"
              - id: l2-n4
                type: true_false
                text: "Is it true? Blue and white paint are mixed in the ratio 1 : 3. To make 8 tins in all, you need 3 tins of blue."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Shop A sells 3 pens for £2. Shop B sells 6 pens for £5. Where is one pen cheaper?"
                options: ["Shop A", "Shop B", "They cost the same."]
                keep_order: true
                answer: "Shop A"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "There are 7 red beads for every 3 blue beads. There are 9 blue beads. How many red beads are there?"
            options: ["21", "13", "27"]
            answer: "21"
          - id: l2-c2
            type: multiple_choice
            text: "There are 4 apples for every 9 oranges. What is the ratio of oranges to apples?"
            options: ["9 : 4", "4 : 9", "9 : 13"]
            answer: "9 : 4"
          - id: l2-c3
            type: text_input
            text: "A school needs 1 coach for every 50 pupils. How many coaches are needed for 250 pupils?"
            answer: "5"
          - id: l2-c4
            type: multiple_choice
            text: "The ratio of red to yellow tiles is 1 : 4. What fraction of the tiles are red?"
            options: ["1/5", "1/4", "4/5"]
            answer: "1/5"
          - id: l2-c5
            type: text_input
            text: "A recipe for 5 people uses 400 g of rice. How many grams are needed for 3 people?"
            answer: "240"
