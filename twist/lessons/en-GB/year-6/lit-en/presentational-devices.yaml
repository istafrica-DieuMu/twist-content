# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.presentational-devices
skill: lit-en.composition.presentational-devices
curriculum: en-GB
language: en
title:
  de: Gestaltungsmittel nutzen
  en: Using layout devices
summary: >
  Layout devices guide the reader: headings and sub-headings say what a
  section is about, bullet points list items in no order, numbered lists
  give steps in order, tables compare facts, columns set text side by
  side, and captions explain a picture. Lesson 1 names the devices and
  what each is for; lesson 2 chooses the device that fits the content and
  reads a table, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.composition.headings]
  also_practises: [lit-en.composition.headings]
  vocabulary: { en: [heading, sub-heading, bullet point, numbered list, table, column, caption, layout, bold] }
  forms: [text, audio, drawn]
  drawn: [table]
  facets: []
  misconceptions:
    - id: bullets-for-steps
      what: Uses bullet points for steps that must be done in order, where a numbered list is needed
      addressed: l1-f2, l1-s2, l2-f1, l2-n1 and l2-c1; feedback in l2-f1
    - id: decoration-not-guide
      what: Thinks layout is decoration, chosen to look nice, not to help the reader find and compare information
      addressed: Learn screen 1; l1-f5, l1-n5 and l2-c5 ask what a device helps the reader do
    - id: table-for-everything
      what: Puts any information in a table, even a story or a single fact
      addressed: l2-f3, l2-s3 and l2-n3 ask which content suits a table
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Welche Mittel gibt es?", en: "What layout devices are there?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "A section of a report is about what hedgehogs eat.\n\nWhich sub-heading fits?"
            options: ["Food", "Habitat", "Babies"]
            answer: "Food"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? A heading tells the reader what a text or section is about."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Layout devices help the reader to:\n• find information quickly\n• follow steps in order\n• compare facts"
            say: "Layout devices are not decoration. Each one helps the reader find, follow or compare information."
          - text: "Heading: the title of the whole text\nSub-heading: the title of one section\nBold: makes a key word stand out\nCaption: a sentence under a picture that explains it"
            say: "Headings and sub-headings show what each part is about. Bold makes key words stand out. A caption explains a picture or diagram."
          - text: "Bullet points: a list where order does not matter\n• torch\n• water\n\nNumbered list: steps in order\n1. Crack the eggs.\n2. Whisk them."
            say: "Use bullet points for a list where order does not matter, like what to pack. Use a numbered list when the order matters, like the steps of a recipe."
          - text: "Columns: text set side by side, as in a newspaper\nTable: facts in rows and columns, so they can be compared"
            say: "Columns set text side by side, as in a newspaper or a leaflet. A table puts facts in rows and columns, so the reader can compare them at a glance."
            show: { drawn: table, rows: [["Planet", "Moons"], ["Earth", "1"], ["Mars", "2"]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Under a photo of a lighthouse: \"The lighthouse at Flamborough Head was built in 1806.\"\n\nWhat is this sentence called?"
                options: ["a caption", "a heading", "a bullet point"]
                answer: "a caption"
                hints:
                  - "Where is the sentence?"
                  - "It is under a picture and explains it."
                  - "A caption."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which device is best for the steps of a science experiment?"
                options: ["a numbered list", "bullet points", "a caption"]
                answer: "a numbered list"
                hints:
                  - "Does the order of the steps matter?"
                  - "Yes. Which device shows order?"
                  - "A numbered list."
              - id: l1-f3
                type: matching
                text: "Match each device to its job."
                pairs:
                  - { left: { text: "sub-heading" }, right: { text: "names one section" } }
                  - { left: { text: "table" }, right: { text: "compares facts in rows and columns" } }
                  - { left: { text: "bold" }, right: { text: "makes a key word stand out" } }
                  - { left: { text: "caption" }, right: { text: "explains a picture" } }
                hints:
                  - "Start with the ones you are sure of."
                  - "A caption sits under a picture."
                  - "sub-heading: one section; table: compares; bold: key word; caption: picture."
              - id: l1-f4
                type: multiple_choice
                text: "Read the table.\n\nHow many moons does Mars have?"
                show: { drawn: table, rows: [["Planet", "Moons"], ["Earth", "1"], ["Mars", "2"], ["Venus", "0"]] }
                options: ["2", "1", "0"]
                answer: "2"
                hints:
                  - "Find the row for Mars."
                  - "Read across to the Moons column."
                  - "2."
              - id: l1-f5
                type: multiple_choice
                text: "Why do writers use layout devices?"
                options: ["to help the reader find and follow information", "to fill up the page", "to make the text longer"]
                answer: "to help the reader find and follow information"
                hints:
                  - "Who are the devices for?"
                  - "Think about the reader."
                  - "To help the reader find and follow information."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A newspaper sets two stories side by side on one page.\n\nWhat layout device is this?"
                options: ["columns", "a caption", "a numbered list"]
                answer: "columns"
                hints: ["Side by side, like a newspaper."]
              - id: l1-s2
                type: multiple_choice
                text: "Which device is best for a list of things to pack for camp?"
                options: ["bullet points", "a numbered list", "a caption"]
                answer: "bullet points"
                hints: ["Does the order matter when you pack?"]
              - id: l1-s3
                type: matching
                text: "Match each device to its job."
                pairs:
                  - { left: { text: "heading" }, right: { text: "the title of the whole text" } }
                  - { left: { text: "numbered list" }, right: { text: "steps in order" } }
                  - { left: { text: "bullet points" }, right: { text: "a list in no order" } }
                  - { left: { text: "columns" }, right: { text: "text side by side" } }
                hints: ["Numbers show order."]
              - id: l1-s4
                type: multiple_choice
                text: "Read the table.\n\nWhich animal is the heaviest?"
                show: { drawn: table, rows: [["Animal", "Weight"], ["fox", "7 kg"], ["badger", "12 kg"], ["otter", "9 kg"]] }
                options: ["badger", "fox", "otter"]
                answer: "badger"
                hints: ["Compare the Weight column."]
              - id: l1-s5
                type: true_false
                text: "Is it true? Bold is used to make a key word stand out."
                answer: true
                hints: ["Think of glossary words in a fact book."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "In a report on owls, the words \"Where owls live\" appear above one section.\n\nWhat is this?"
                options: ["a sub-heading", "a caption", "a bullet point"]
                answer: "a sub-heading"
              - id: l1-n2
                type: multiple_choice
                text: "Which device is best for instructions to build a model?"
                options: ["a numbered list", "bullet points", "columns"]
                answer: "a numbered list"
              - id: l1-n3
                type: matching
                text: "Match each device to its job."
                pairs:
                  - { left: { text: "caption" }, right: { text: "explains a picture" } }
                  - { left: { text: "table" }, right: { text: "compares facts" } }
                  - { left: { text: "sub-heading" }, right: { text: "names one section" } }
              - id: l1-n4
                type: multiple_choice
                text: "Read the table.\n\nWhich club meets on Wednesday?"
                show: { drawn: table, rows: [["Club", "Day"], ["Chess", "Monday"], ["Choir", "Wednesday"], ["Football", "Friday"]] }
                options: ["Choir", "Chess", "Football"]
                answer: "Choir"
              - id: l1-n5
                type: true_false
                text: "Is it true? Writers choose layout devices mainly to make the page look pretty."
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which device is best for the steps to plant a seed?"
            options: ["a numbered list", "a caption", "bold"]
            answer: "a numbered list"
          - id: l1-c2
            type: multiple_choice
            text: "What does a caption do?"
            options: ["explains a picture", "lists steps", "names the whole text"]
            answer: "explains a picture"
          - id: l1-c3
            type: multiple_choice
            text: "Read the table.\n\nHow tall is the oak?"
            show: { drawn: table, rows: [["Tree", "Height"], ["oak", "20 m"], ["birch", "15 m"], ["holly", "8 m"]] }
            options: ["20 m", "15 m", "8 m"]
            answer: "20 m"

  - n: 2
    title: { de: Das passende Mittel wählen, en: Choosing the right device }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which device shows steps in order?"
            options: ["a numbered list", "bullet points", "a caption"]
            answer: "a numbered list"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? A table puts facts in rows and columns so they can be compared."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Content: how to make a paper aeroplane\nAsk: does the order matter?\nYes → numbered list"
            say: "To choose a device, look at your content and ask a question. Does the order matter? Then use a numbered list."
          - text: "Content: the price, size and speed of three bikes\nAsk: will the reader compare things?\nYes → table"
            say: "Will the reader want to compare several things on the same points? Then a table is best: one row for each bike, one column for each point."
          - text: "Content: a leaflet about a museum\n• heading: Visit Redbrook Museum\n• sub-headings: Opening times, Prices, How to find us\n• photo with caption"
            say: "A leaflet often uses several devices together. A heading for the whole leaflet, sub-headings for each section, and a photo with a caption. A story, though, needs none of these: it is told in paragraphs."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "You are writing how to bake bread: mix, knead, leave to rise, bake.\n\nWhich device fits?"
                options: ["a numbered list", "bullet points", "a table"]
                answer: "a numbered list"
                feedback:
                  "bullet points": "Bullet points are for lists where order does not matter. You cannot bake before you knead, so number the steps."
                hints:
                  - "Does the order matter?"
                  - "You must knead before you bake."
                  - "A numbered list."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "You are comparing three holiday parks by price, pool and distance.\n\nWhich device fits?"
                options: ["a table", "a caption", "a numbered list"]
                answer: "a table"
                hints:
                  - "Will the reader compare things?"
                  - "Three parks, three points each: rows and columns."
                  - "A table."
              - id: l2-f3
                type: multiple_choice
                text: "Which content suits a table best?"
                options: ["the opening times of four shops on each day", "a ghost story", "one sentence about a cat"]
                answer: "the opening times of four shops on each day"
                option_audio: false
                hints:
                  - "Tables are for comparing many facts."
                  - "Which has lots of facts on the same points?"
                  - "The opening times of four shops."
              - id: l2-f4
                type: fill_in_blank
                text: "The canal walk is 3 miles and takes 1 hour. The hill walk is 5 miles and takes 3 hours.\n\nComplete the table."
                say: "Read about the two walks. Fill the gaps in the table."
                show: { drawn: table, rows: [["Walk", "Distance", "Time"], ["Canal", "3 miles", "?"], ["Hill", "?", "3 hours"]] }
                frame: "Canal time: _   Hill distance: _"
                options: ["1 hour", "3 hours", "5 miles", "3 miles"]
                answer: ["1 hour", "5 miles"]
                hints:
                  - "Read the sentences above the table again."
                  - "The canal walk takes 1 hour; the hill walk is 5 miles."
                  - "1 hour, then 5 miles."
              - id: l2-f5
                type: multiple_choice
                text: "A leaflet has the sections \"Opening times\", \"Prices\" and \"How to find us\".\n\nWhat are these?"
                options: ["sub-headings", "captions", "bullet points"]
                answer: "sub-headings"
                hints:
                  - "Each one names a section."
                  - "They are like small headings."
                  - "Sub-headings."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "You are writing what to bring on a school trip: coat, packed lunch, water bottle.\n\nWhich device fits?"
                options: ["bullet points", "a numbered list", "a caption"]
                answer: "bullet points"
                hints: ["Does the order matter?"]
              - id: l2-s2
                type: multiple_choice
                text: "Under a diagram of the heart, you write: \"The heart pumps blood around the body.\"\n\nWhich device is this?"
                options: ["a caption", "a heading", "a table"]
                answer: "a caption"
                hints: ["It explains a picture."]
              - id: l2-s3
                type: multiple_choice
                text: "Which content suits a table best?"
                options: ["the number of goals each team scored in four matches", "a poem about the sea", "a diary entry"]
                answer: "the number of goals each team scored in four matches"
                option_audio: false
                hints: ["Facts to compare."]
              - id: l2-s4
                type: multiple_choice
                text: "Read the table.\n\nWhich bike is the lightest?"
                show: { drawn: table, rows: [["Bike", "Price", "Weight"], ["Zoom", "£200", "11 kg"], ["Dash", "£150", "13 kg"], ["Flash", "£250", "9 kg"]] }
                options: ["Flash", "Dash", "Zoom"]
                answer: "Flash"
                hints: ["Look down the Weight column."]
              - id: l2-s5
                type: true_false
                text: "Is it true? A story is usually written in paragraphs, not in a table."
                answer: true
                hints: ["Do we compare facts in a story?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "You are writing how to wash a dog: wet it, add shampoo, rinse, dry.\n\nWhich device fits?"
                options: ["a numbered list", "bullet points", "columns"]
                answer: "a numbered list"
              - id: l2-n2
                type: multiple_choice
                text: "Read the table.\n\nWhich bike costs £150?"
                show: { drawn: table, rows: [["Bike", "Price", "Weight"], ["Zoom", "£200", "11 kg"], ["Dash", "£150", "13 kg"], ["Flash", "£250", "9 kg"]] }
                options: ["Dash", "Zoom", "Flash"]
                answer: "Dash"
              - id: l2-n3
                type: multiple_choice
                text: "Which content suits a table best?"
                options: ["the height, weight and lifespan of five dinosaurs", "a letter to your gran", "a joke"]
                answer: "the height, weight and lifespan of five dinosaurs"
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "A school newsletter puts the sports news on the left and the music news on the right of the same page.\n\nWhich device is this?"
                options: ["columns", "a numbered list", "a caption"]
                answer: "columns"
              - id: l2-n5
                type: multiple_choice
                text: "You want the word \"photosynthesis\" to stand out in your science report.\n\nWhich device fits?"
                options: ["bold", "a numbered list", "a table"]
                answer: "bold"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "You are writing how to make a cup of tea: boil the kettle, add a tea bag, pour, stir.\n\nWhich device fits?"
            options: ["a numbered list", "bullet points", "a caption"]
            answer: "a numbered list"
          - id: l2-c2
            type: multiple_choice
            text: "You are comparing four phones by price, battery and camera.\n\nWhich device fits?"
            options: ["a table", "bullet points", "a caption"]
            answer: "a table"
          - id: l2-c3
            type: multiple_choice
            text: "Read the table.\n\nWhich film is the longest?"
            show: { drawn: table, rows: [["Film", "Length"], ["Sky Rescue", "95 min"], ["Pirate Bay", "110 min"], ["Snow Fox", "85 min"]] }
            options: ["Pirate Bay", "Sky Rescue", "Snow Fox"]
            answer: "Pirate Bay"
          - id: l2-c4
            type: multiple_choice
            text: "In a guide to a zoo, the words \"Feeding times\" appear above one section.\n\nWhat is this?"
            options: ["a sub-heading", "a caption", "a table"]
            answer: "a sub-heading"
          - id: l2-c5
            type: multiple_choice
            text: "Why might a leaflet use bullet points for its list of activities?"
            options: ["so the reader can see each activity quickly", "because the activities must be done in order", "to make the leaflet longer"]
            answer: "so the reader can see each activity quickly"
