# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.bullets-hyphens
skill: lit-en.grammar.bullets-hyphens
curriculum: en-GB
language: en
title:
  de: Aufzählungspunkte und Bindestriche
  en: Bullet points and hyphens
summary: >
  Bullet points follow one pattern all the way down: a colon after the
  lead-in, then either short items with no capitals or full stops, or full
  sentences with both, each starting the same way. A hyphen joins words
  to avoid ambiguity: a man-eating shark is not a man eating a shark, and
  to re-cover a chair is not to recover from a cold. Lesson 1 makes bullet
  lists consistent; lesson 2 uses hyphens to make meaning clear, and ends
  with the skill check.
metadata:
  year: year-6
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.grammar.semicolons-colons]
  also_practises: [lit-en.composition.presentational-devices]
  vocabulary: { en: [bullet point, consistent, lead-in, colon, hyphen, ambiguity, compound adjective, prefix] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: bullets, what: { de: "Aufzählungspunkte einheitlich setzen, mit Doppelpunkt nach der Einleitung", en: "punctuating bullet points consistently, with a colon after the lead-in" } }
    - { id: compound, what: { de: "Bindestrich zwischen Wörtern, die zusammen ein Nomen beschreiben (man-eating shark)", en: "hyphens between words that describe a noun together (man-eating shark)" } }
    - { id: prefix, what: { de: "Bindestrich nach der Vorsilbe re, wenn er die Bedeutung ändert (re-cover, recover)", en: "a hyphen after re when it changes the meaning (re-cover, recover)" } }
  misconceptions:
    - id: mixed-bullets
      what: Mixes styles in one list, some bullets with capitals and full stops and some without, or some starting with a verb and some not
      addressed: l1-f1, l1-f3, l1-s1, l1-s3, l1-n1 and l2-c1; feedback in l1-f1
    - id: hyphen-optional
      what: Thinks a hyphen never changes the meaning, so leaves it out where the sentence becomes ambiguous
      addressed: l2-f1, l2-f2, l2-s1, l2-n1 and l2-c3; feedback in l2-f1
    - id: hyphen-everywhere
      what: Hyphenates any two words that stand next to each other (the shark-swam)
      addressed: l2-f4, l2-s4 and l2-n4 ask where a hyphen does belong
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Aufzählungspunkte einheitlich setzen, en: Consistent bullet points }
    goal:
      de: "Mach eine Liste mit Aufzählungspunkten, in der jeder Punkt gleich aussieht, zum Beispiel lauter kurze Dinge ohne Punkt am Ende."
      en: "Make every bullet in a list follow the same pattern, like short items such as a pencil, with no full stops."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which sentence uses a colon correctly?"
            options: ["Bring two things: a coat and a drink.", "Bring: a coat and a drink.", "Bring two: things a coat."]
            answer: "Bring two things: a coat and a drink."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? \"It snowed; the school closed.\" uses a semicolon correctly."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "For the trip, bring:\n• a packed lunch\n• a waterproof coat\n• a pencil"
            say: "A bullet list starts with a lead-in that ends in a colon. Here each bullet is a short item: no capital letter and no full stop. That is one style."
          - text: "Before the trip:\n• Check the weather.\n• Pack your bag.\n• Charge your camera."
            say: "Another style uses full sentences: a capital at the start and a full stop at the end of every bullet. Both styles are fine. Choose one, and keep it all the way down."
          - text: "Not consistent:\n• Check the weather.\n• pack your bag\n• Your camera."
            say: "This list mixes styles. One bullet has a full stop, one has none, and the last one does not start with a verb like the others. Each bullet should follow the same pattern."
          - text: "Consistent: every bullet starts the same way.\n• Wash your hands.\n• Wear an apron.\n• Tie back long hair."
            say: "Each bullet here starts with a command verb: wash, wear, tie. Same punctuation, same shape. That is consistent."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which list is consistent?"
                options: ["We need:\n• paint\n• brushes\n• paper", "We need:\n• Paint.\n• brushes\n• paper", "We need:\n• paint\n• Brushes.\n• and paper"]
                answer: "We need:\n• paint\n• brushes\n• paper"
                option_audio: false
                feedback:
                  "We need:\n• Paint.\n• brushes\n• paper": "Paint has a capital and a full stop, but brushes and paper do not. Use the same style for every bullet."
                hints:
                  - "Check the capitals and full stops of each bullet."
                  - "Do all the bullets match?"
                  - "The list with paint, brushes and paper, all small letters and no full stops."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What usually ends the lead-in sentence before a bullet list?"
                options: ["a colon", "a question mark", "a dash"]
                answer: "a colon"
                hints:
                  - "Look back at the lead-in \"For the trip, bring\". Which mark comes next?"
                  - "It is two dots, one above the other."
                  - "A colon."
              - id: l1-f3
                type: multiple_choice
                text: "Rules for the library:\n• Return books on time.\n• Speak quietly.\n• _\n\nWhich bullet keeps the list consistent?"
                say: "Which bullet keeps the list consistent?"
                options: ["Handle books with care.", "books handled with care", "Careful with the books!"]
                answer: "Handle books with care."
                option_audio: false
                hints:
                  - "How do the other bullets start and end?"
                  - "A command verb, a capital, a full stop."
                  - "Handle books with care."
              - id: l1-f4
                type: true_false
                text: "Is it true? This list is consistent:\nAt the beach you can:\n• swim\n• build sandcastles\n• Look for crabs."
                answer: false
                hints:
                  - "Compare the last bullet with the others."
                  - "Look has a capital and a full stop."
                  - "No, it is not consistent."
              - id: l1-f5
                type: multiple_choice
                text: "Why should bullet points be consistent?"
                options: ["so the list is clear and easy to read", "so the list is longer", "so every bullet has a different style"]
                answer: "so the list is clear and easy to read"
                hints:
                  - "Who is the list for?"
                  - "A reader can scan a neat list quickly."
                  - "So the list is clear and easy to read."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which list is consistent?"
                options: ["To stay safe:\n• Wear a helmet.\n• Use lights at night.\n• Ride on the left.", "To stay safe:\n• Wear a helmet.\n• lights at night\n• Ride on the left.", "To stay safe:\n• wear a helmet.\n• Use lights\n• left"]
                answer: "To stay safe:\n• Wear a helmet.\n• Use lights at night.\n• Ride on the left."
                option_audio: false
                hints: ["Every bullet the same shape."]
              - id: l1-s2
                type: true_false
                text: "Is it true? Short bullet items like \"• a pencil\" do not need a full stop."
                answer: true
                hints: ["Think of the first style."]
              - id: l1-s3
                type: multiple_choice
                text: "In my bag I have:\n• a book\n• a lunchbox\n• _\n\nWhich bullet keeps the list consistent?"
                say: "Which bullet keeps the list consistent?"
                options: ["a water bottle", "A water bottle.", "I also have water."]
                answer: "a water bottle"
                option_audio: false
                hints: ["Short item, small letter, no full stop."]
              - id: l1-s4
                type: multiple_choice
                text: "Which lead-in fits before a bullet list?"
                options: ["Our class jobs are:", "Our class jobs are.", "Our class jobs are?"]
                answer: "Our class jobs are:"
                option_audio: false
                hints: ["A colon introduces the list."]
              - id: l1-s5
                type: multiple_choice
                text: "Steps:\n• Fold the paper.\n• Cut along the line.\n• _\n\nWhich bullet keeps the list consistent?"
                say: "Which bullet keeps the list consistent?"
                options: ["Open it out.", "opened out", "The paper, opened"]
                answer: "Open it out."
                option_audio: false
                hints: ["Start with a command verb."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which list is consistent?"
                options: ["You will see:\n• lions\n• zebras\n• giraffes", "You will see:\n• lions\n• Zebras.\n• giraffes", "You will see:\n• Lions.\n• zebras\n• Giraffes!"]
                answer: "You will see:\n• lions\n• zebras\n• giraffes"
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "Is it true? This list is consistent:\nTo make toast:\n• Put bread in the toaster.\n• Press the lever.\n• Wait for it to pop up."
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Things to pack:\n• a towel\n• sun cream\n• _\n\nWhich bullet keeps the list consistent?"
                say: "Which bullet keeps the list consistent?"
                options: ["a hat", "A hat.", "Don't forget a hat!"]
                answer: "a hat"
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Rules for the pond:\n• Stay behind the rail.\n• Do not feed the ducks.\n• _\n\nWhich bullet keeps the list consistent?"
                say: "Which bullet keeps the list consistent?"
                options: ["Keep dogs on a lead.", "dogs on leads", "No dogs!!"]
                answer: "Keep dogs on a lead."
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Which mark ends the lead-in before a bullet list?"
                options: ["a colon", "a semicolon", "a comma"]
                answer: "a colon"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which list is consistent?"
            options: ["We grew:\n• carrots\n• peas\n• beans", "We grew:\n• Carrots.\n• peas\n• beans", "We grew:\n• carrots.\n• Peas\n• and beans"]
            answer: "We grew:\n• carrots\n• peas\n• beans"
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Is it true? In one bullet list, some bullets can be full sentences and some short items."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Fire drill:\n• Leave the room quietly.\n• Line up outside.\n• _\n\nWhich bullet keeps the list consistent?"
            say: "Which bullet keeps the list consistent?"
            options: ["Wait for your name.", "waiting for names", "Names!"]
            answer: "Wait for your name."
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "On sports day:\n• Wear your house colour.\n• Bring a water bottle.\n• sun hat\n• Listen for the whistle.\n\nWhich bullet breaks the pattern?"
            say: "Which bullet breaks the pattern?"
            options: ["Wear your house colour.", "Bring a water bottle.", "sun hat", "Listen for the whistle."]
            answer: "sun hat"
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it true? This list is consistent:\nOur class pets:\n• a rabbit\n• two goldfish\n• a tortoise"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which lead-in is punctuated correctly?\n_\n• a ruler\n• a rubber\n• a sharp pencil"
            say: "Which lead-in is punctuated correctly?"
            options: ["For the test, you need:", "For the test, you need.", "For the test: you need"]
            answer: "For the test, you need:"
            option_audio: false

  - n: 2
    title: { de: Bindestriche gegen Missverständnisse, en: Hyphens for clear meaning }
    goal:
      de: "Setz einen Bindestrich, damit klar ist, was gemeint ist, so wie bei einem menschenfressenden Hai."
      en: "Use a hyphen to make the meaning clear, so a man-eating shark is a shark that eats people."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which list is consistent?"
            options: ["I like:\n• reading\n• swimming\n• cooking", "I like:\n• Reading.\n• swimming\n• cooking", "I like:\n• reading\n• Swim.\n• cooks"]
            answer: "I like:\n• reading\n• swimming\n• cooking"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? A lead-in before a bullet list usually ends with a colon."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "a man-eating shark\na man eating shark"
            say: "A hyphen can change the meaning. A man-eating shark is a shark that eats people. A man eating shark is a man having shark for dinner!"
          - text: "a little-used path (a path not used much)\na little used path (a small path that someone has used)"
            say: "Little-used, with a hyphen, means not used much. Without it, little could mean small."
          - text: "recover (get better) → re-cover (cover again)\nresign (leave a job) → re-sign (sign again)"
            say: "A hyphen after the prefix re can show a different word. Re-cover a sofa means put a new cover on it. Recover means get better."
          - text: "a well-known author\nThe author is well known."
            say: "Two words that work together to describe a noun, before the noun, often take a hyphen: a well-known author. After the noun, as in the author is well known, there is no hyphen. A hyphen goes only where it joins words into one meaning. Do not put one between any two words."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "The sign warns of a shark that eats people.\n\nWhich is correct?"
                options: ["Beware: man-eating shark!", "Beware: man eating shark!"]
                answer: "Beware: man-eating shark!"
                option_audio: false
                feedback:
                  "Beware: man eating shark!": "Without the hyphen, it means a man who is eating a shark. The hyphen joins man and eating into one describing word."
                hints:
                  - "Who is doing the eating?"
                  - "The hyphen joins man and eating."
                  - "Man-eating shark."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Grandad is putting a new cover on the old armchair.\n\nWhich is correct?"
                options: ["Grandad will re-cover the armchair.", "Grandad will recover the armchair."]
                answer: "Grandad will re-cover the armchair."
                option_audio: false
                hints:
                  - "Does he get better, or cover it again?"
                  - "Cover again needs re, hyphen, cover."
                  - "Re-cover."
              - id: l2-f3
                type: matching
                text: "Match each phrase to its meaning."
                pairs:
                  - { left: { text: "re-sign" }, right: { text: "sign again" } }
                  - { left: { text: "resign" }, right: { text: "leave a job" } }
                  - { left: { text: "re-cover" }, right: { text: "cover again" } }
                  - { left: { text: "recover" }, right: { text: "get better" } }
                option_audio: false
                hints:
                  - "The hyphen keeps re and the word apart."
                  - "Re-sign is sign again."
                  - "re-sign: sign again; resign: leave a job; re-cover: cover again; recover: get better."
              - id: l2-f4
                type: multiple_choice
                text: "Where does the hyphen belong?"
                options: ["She is a well-known singer.", "She is a well known-singer.", "She-is a well known singer."]
                answer: "She is a well-known singer."
                option_audio: false
                hints:
                  - "Which two words work together to describe the singer?"
                  - "Well and known."
                  - "A well-known singer."
              - id: l2-f5
                type: true_false
                text: "Is it true? \"A little-used path\" means a path that not many people use."
                answer: true
                hints:
                  - "What does the hyphen join?"
                  - "Little-used means used only a little."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The fish has sharp teeth and eats meat.\n\nWhich is correct?"
                options: ["It is a meat-eating fish.", "It is a meat eating fish."]
                answer: "It is a meat-eating fish."
                option_audio: false
                hints: ["Join the two describing words."]
              - id: l2-s2
                type: multiple_choice
                text: "The footballer signed a new contract with the same club.\n\nWhich is correct?"
                options: ["The footballer has re-signed for the club.", "The footballer has resigned for the club."]
                answer: "The footballer has re-signed for the club."
                option_audio: false
                hints: ["He signed again; he did not leave."]
              - id: l2-s3
                type: multiple_choice
                text: "What does \"a little-known fact\" mean?"
                options: ["a fact that not many people know", "a small fact", "a fact that everyone knows"]
                answer: "a fact that not many people know"
                hints: ["The hyphen joins little and known into one describing word, like little-used."]
              - id: l2-s4
                type: multiple_choice
                text: "Where does the hyphen belong?"
                options: ["We stayed in a five-star hotel.", "We stayed in a five star-hotel.", "We-stayed in a five star hotel."]
                answer: "We stayed in a five-star hotel."
                option_audio: false
                hints: ["Which words describe the hotel together?"]
              - id: l2-s5
                type: true_false
                text: "Is it true? \"Resign\" and \"re-sign\" mean the same."
                answer: false
                hints: ["Leave a job, or sign again?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "The plant catches and eats insects.\n\nWhich is correct?"
                options: ["It is an insect-eating plant.", "It is an insect eating plant."]
                answer: "It is an insect-eating plant."
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "The shop sells shirts in a very big size.\n\nWhich is correct?"
                options: ["We sell extra-large shirts.", "We sell extra large shirts."]
                answer: "We sell extra-large shirts."
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "What does \"a hot-water bottle\" mean?"
                options: ["a bottle for hot water", "a water bottle that got hot in the sun", "a bottle of cold water"]
                answer: "a bottle for hot water"
              - id: l2-n4
                type: multiple_choice
                text: "Where does the hyphen belong?"
                options: ["He told a far-fetched story.", "He told a far fetched-story.", "He-told a far fetched story."]
                answer: "He told a far-fetched story."
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? \"The author is well known\" needs a hyphen, because it comes after the noun."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: bullets
            type: multiple_choice
            text: "Which list is consistent?"
            options: ["Before swimming:\n• Shower first.\n• Remove jewellery.\n• Tie back long hair.", "Before swimming:\n• Shower first.\n• jewellery off\n• Tie back long hair.", "Before swimming:\n• shower\n• Remove jewellery.\n• hair!"]
            answer: "Before swimming:\n• Shower first.\n• Remove jewellery.\n• Tie back long hair."
            option_audio: false
          - id: l2-c2
            part: bullets
            type: multiple_choice
            text: "Camp kit:\n• a sleeping bag\n• a torch\n• _\n\nWhich bullet keeps the list consistent?"
            say: "Which bullet keeps the list consistent?"
            options: ["a spare jumper", "A spare jumper.", "Bring a jumper too!"]
            answer: "a spare jumper"
            option_audio: false
          - id: l2-c3
            part: compound
            type: multiple_choice
            text: "The dinosaur ate plants, not meat.\n\nWhich is correct?"
            options: ["It was a plant-eating dinosaur.", "It was a plant eating dinosaur."]
            answer: "It was a plant-eating dinosaur."
            option_audio: false
          - id: l2-c4
            part: prefix
            type: multiple_choice
            text: "After the operation, Gran needed time to get better.\n\nWhich word fits?\n\nGran will _ at home."
            say: "After the operation, Gran needed time to get better. Which word fits? Gran will ... at home."
            options: ["recover", "re-cover"]
            answer: "recover"
            option_audio: false
          - id: l2-c5
            part: compound
            type: multiple_choice
            text: "Where does the hyphen belong?"
            options: ["It was a last-minute goal.", "It was a last minute-goal.", "It-was a last minute goal."]
            answer: "It was a last-minute goal."
            option_audio: false
          - id: l2-c6
            part: bullets
            type: sorting
            text: "Sort the bullets: short item or full sentence?"
            bins:
              - { id: item, show: { text: "short item" }, say: "short item" }
              - { id: sentence, show: { text: "full sentence" }, say: "full sentence" }
            options:
              - { text: "• a spare pencil", bin: item }
              - { text: "• Label your bag.", bin: sentence }
              - { text: "• two apples", bin: item }
              - { text: "• Bring a spare pencil.", bin: sentence }
            option_audio: false
          - id: l2-c7
            part: bullets
            type: multiple_choice
            text: "How to plant a seed:\n• Fill a pot with soil.\n• Push the seed in.\n• water it every day\n• Put the pot in the sun.\n\nWhich bullet breaks the pattern?"
            say: "Which bullet breaks the pattern?"
            options: ["Fill a pot with soil.", "Push the seed in.", "water it every day", "Put the pot in the sun."]
            answer: "water it every day"
            option_audio: false
          - id: l2-c8
            part: bullets
            type: true_false
            text: "Is it true? This list is consistent:\nOur school council will:\n• plan a cake sale\n• choosing a charity\n• paint the fence"
            answer: false
          - id: l2-c9
            part: bullets
            type: multiple_choice
            text: "In the park you can:\n• feed the ducks\n• climb the tower\n• _\n\nWhich bullet keeps the list consistent?"
            say: "Which bullet keeps the list consistent?"
            options: ["fly a kite", "a kite", "Fly a kite."]
            answer: "fly a kite"
            option_audio: false
          - id: l2-c10
            part: bullets
            type: multiple_choice
            text: "Which lead-in is punctuated correctly?\n_\n• a ruler\n• a protractor\n• a calculator"
            say: "Which lead-in is punctuated correctly?"
            options: ["In maths today, you will use:", "In maths today, you will use.", "In maths today: you will use"]
            answer: "In maths today, you will use:"
            option_audio: false
          - id: l2-c11
            part: compound
            type: multiple_choice
            text: "The vet looks after small animals, such as rabbits and hamsters.\n\nWhich is correct?"
            options: ["She is a small-animal vet.", "She is a small animal vet."]
            answer: "She is a small-animal vet."
            option_audio: false
          - id: l2-c12
            part: compound
            type: multiple_choice
            text: "What does \"a big-cat expert\" mean?"
            options: ["someone who knows a lot about lions and tigers", "a tall person who knows about cats", "a cat that is very big"]
            answer: "someone who knows a lot about lions and tigers"
          - id: l2-c13
            part: compound
            type: highlight_in_text
            text: "Two words should be joined by a hyphen. Tap them both."
            say: "Two words in this sentence should be joined by a hyphen. Tap them both."
            show: { drawn: letter-card, text: "We read a heart warming story about a lost dog." }
            spans: ["heart", "warming"]
          - id: l2-c14
            part: compound
            type: true_false
            text: "Is it true? This hyphen is used correctly:\nThe shark-swam towards the boat."
            answer: false
          - id: l2-c15
            part: compound
            type: multiple_choice
            text: "Which sentence needs no hyphen?"
            options: ["The singer is well known.", "She is a well known singer.", "We were stuck behind a slow moving lorry."]
            answer: "The singer is well known."
            option_audio: false
          - id: l2-c16
            part: prefix
            type: multiple_choice
            text: "The tests were marked wrongly, so the teacher will mark them again.\n\nWhich is correct?"
            options: ["The teacher will re-mark the tests.", "The teacher will remark the tests."]
            answer: "The teacher will re-mark the tests."
            option_audio: false
          - id: l2-c17
            part: prefix
            type: multiple_choice
            text: "The vet will re-treat the dog's sore paw.\n\nWhat does re-treat mean?"
            options: ["treat it again", "move back from it", "give it a treat"]
            answer: "treat it again"
          - id: l2-c18
            part: prefix
            type: matching
