# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.semicolons-colons
skill: lit-en.grammar.semicolons-colons
curriculum: en-GB
language: en
title:
  de: Semikolon, Doppelpunkt und Gedankenstrich
  en: Semicolons, colons and dashes
summary: >
  A semicolon joins two independent clauses that are closely linked (It
  was raining; we stayed inside). A colon comes after a complete clause to
  introduce a list, or before a clause that explains the first. A dash can
  also join two clauses, less formally. Lesson 1 works on semicolons
  between clauses and the comma splice; lesson 2 on colons for lists and
  explanations, on semicolons that split a list of longer items with
  commas inside (a colon introduces the list, semicolons go between the
  items, and the last item takes "and"), and on dashes, and ends with the
  skill check. The record
  writes the dash as a spaced hyphen ( - ), because record text carries
  no dash characters; the app shows a proper dash.
metadata:
  year: year-6
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [lit-en.grammar.parenthesis]
  also_practises: []
  vocabulary: { en: [semicolon, colon, dash, independent clause, main clause, list, comma splice, explain] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: comma-splice
      what: Joins two independent clauses with only a comma (It was late, we went home)
      addressed: l1-f2, l1-s2, l1-n2 and l2-c1; feedback in l1-f2
    - id: semicolon-before-fragment
      what: Puts a semicolon before words that cannot stand alone as a sentence (We went out; because it was sunny)
      addressed: l1-f3, l1-s3 and l1-n3 check that both sides are complete clauses
    - id: colon-after-fragment
      what: "Puts a colon after words that are not a complete clause (I need: eggs, flour and milk)"
      addressed: l2-f2, l2-s2, l2-n2 and l2-c3; feedback in l2-f2
    - id: commas-only-in-long-list
      what: Separates list items that have commas inside with more commas, so the reader cannot tell where one item ends (Sam, our coach, Priya, the captain, and Tom)
      addressed: l2-s5, l2-n5 and l2-c2
  twist_reuse: []
  dashes: true
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das Semikolon, en: The semicolon }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which sentence uses brackets for parenthesis correctly?"
            options: ["My uncle (a pilot) flies to Spain.", "My uncle a (pilot flies) to Spain.", "(My uncle a pilot flies) to Spain."]
            answer: "My uncle (a pilot) flies to Spain."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? Commas can mark parenthesis: \"The dog, wet and muddy, ran inside.\""
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "It was raining. We stayed inside.\nIt was raining; we stayed inside."
            say: "An independent clause can stand alone as a sentence. When two independent clauses are closely linked, a semicolon can join them. It was raining, semicolon, we stayed inside."
          - text: "Test: can each side stand alone as a sentence?\nIt was raining. ✓   We stayed inside. ✓"
            say: "Test each side. If both sides make sense as sentences on their own, a semicolon can go between them."
          - text: "Wrong: It was late, we went home.\nRight: It was late; we went home."
            say: "Joining two sentences with only a comma is a mistake called a comma splice. Use a semicolon, a full stop, or a conjunction instead."
          - text: "Wrong: We went out; because it was sunny.\n(because it was sunny cannot stand alone)"
            say: "Do not use a semicolon before words that cannot stand alone. Because it was sunny is not a sentence on its own."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Choose the punctuation."
                frame: "The sun set _ the stars came out."
                options: [";", ":", ","]
                answer: [";"]
                option_audio: false
                hints:
                  - "Can each side stand alone?"
                  - "The sun set. The stars came out. Both are sentences, and they are linked."
                  - "A semicolon."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which sentence is punctuated correctly?"
                options: ["I love maths; my sister loves art.", "I love maths, my sister loves art.", "I love maths my sister loves art."]
                answer: "I love maths; my sister loves art."
                option_audio: false
                feedback:
                  "I love maths, my sister loves art.": "That is a comma splice: two sentences joined by only a comma. Use a semicolon."
                hints:
                  - "Are there two independent clauses?"
                  - "A comma alone cannot join them."
                  - "I love maths; my sister loves art."
              - id: l1-f3
                type: true_false
                text: "Is it true? This semicolon is used correctly:\n\"We played outside; after lunch.\""
                answer: false
                hints:
                  - "Can after lunch stand alone?"
                  - "After lunch is not a sentence."
                  - "No, it is not correct."
              - id: l1-f4
                type: multiple_choice
                text: "Which pair of clauses could be joined with a semicolon?"
                options: ["The bus was late. We missed the start of the film.", "The bus was late. Penguins live in Antarctica.", "The bus was late. Because of traffic."]
                answer: "The bus was late. We missed the start of the film."
                option_audio: false
                hints:
                  - "Both must be sentences, and closely linked."
                  - "Penguins has nothing to do with the bus."
                  - "The bus was late. We missed the start of the film."
              - id: l1-f5
                type: multiple_choice
                text: "What is a comma splice?"
                options: ["two sentences joined with only a comma", "a list with commas", "a comma after a fronted adverbial"]
                answer: "two sentences joined with only a comma"
                hints:
                  - "It is a mistake."
                  - "It happens between two independent clauses."
                  - "Two sentences joined with only a comma."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Choose the punctuation."
                frame: "Dad cooked dinner _ Mum washed up."
                options: [";", ":", ","]
                answer: [";"]
                option_audio: false
                hints: ["Two linked sentences."]
              - id: l1-s2
                type: multiple_choice
                text: "Which sentence is punctuated correctly?"
                options: ["The film was long; I fell asleep.", "The film was long, I fell asleep.", "The film was long; and boring."]
                answer: "The film was long; I fell asleep."
                option_audio: false
                hints: ["Both sides must be sentences."]
              - id: l1-s3
                type: true_false
                text: "Is it true? This semicolon is used correctly:\n\"The river froze; the ducks stood on the ice.\""
                answer: true
                hints: ["Can each side stand alone?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which pair of clauses could be joined with a semicolon?"
                options: ["Kai was hungry. He made a sandwich.", "Kai was hungry. Because he skipped lunch.", "Kai was hungry. The moon is round."]
                answer: "Kai was hungry. He made a sandwich."
                option_audio: false
                hints: ["Two sentences, closely linked."]
              - id: l1-s5
                type: multiple_choice
                text: "Fix the comma splice.\n\n\"The shop was shut, we went home.\""
                options: ["The shop was shut; we went home.", "The shop was shut, we, went home.", "The shop; was shut we went home."]
                answer: "The shop was shut; we went home."
                option_audio: false
                hints: ["Swap the comma."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Choose the punctuation."
                frame: "The alarm rang _ everyone left the building."
                options: [";", ":", ","]
                answer: [";"]
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which sentence is punctuated correctly?"
                options: ["Some people like tea; others prefer coffee.", "Some people like tea, others prefer coffee.", "Some people; like tea others prefer coffee."]
                answer: "Some people like tea; others prefer coffee."
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Is it true? This semicolon is used correctly:\n\"I was tired; so tired.\""
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Which pair of clauses could be joined with a semicolon?"
                options: ["Ella practised every day. She won the competition.", "Ella practised every day. Even on Sundays.", "Ella practised every day. Owls hoot."]
                answer: "Ella practised every day. She won the competition."
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Fix the comma splice.\n\n\"The snow was deep, the school closed.\""
                options: ["The snow was deep; the school closed.", "The snow, was deep the school closed.", "The snow was; deep the school closed."]
                answer: "The snow was deep; the school closed."
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Choose the punctuation."
            frame: "The kettle boiled _ Gran made the tea."
            options: [";", ":", ","]
            answer: [";"]
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Is it true? \"It was cold, we wore hats.\" is a comma splice."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Which sentence is punctuated correctly?"
            options: ["The door creaked; someone was coming.", "The door creaked, someone was coming.", "The door creaked; slowly."]
            answer: "The door creaked; someone was coming."
            option_audio: false

  - n: 2
    title: { de: "Doppelpunkt, Listen und Gedankenstrich", en: "Colons, lists and dashes" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Choose the punctuation."
            frame: "The wind howled _ the windows rattled."
            options: [";", ","]
            answer: [";"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? A semicolon joins two clauses that could each stand alone."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "You will need three things: a torch, a map and a whistle."
            say: "A colon can introduce a list. The words before the colon must be a complete clause: You will need three things. Then the list follows."
          - text: "Wrong: You will need: a torch, a map and a whistle.\nRight: You will need a torch, a map and a whistle."
            say: "Do not put a colon after words that are not complete, such as you will need. Either finish the clause first, or leave the colon out."
          - text: "We visited three places: York, a city with walls; Whitby, a seaside town; and Leeds, where my aunt lives."
            say: "When the items in a list are longer and have commas inside them, semicolons split the items. A colon introduces the list, a semicolon goes between each item, and the last item takes and after its semicolon. York, a city with walls, is one item."
          - text: "I was exhausted: I had run ten miles."
            say: "A colon can also come between two clauses when the second explains the first. Why was I exhausted? I had run ten miles."
          - text: "The door opened - nobody was there."
            say: "A dash can join two clauses too. It is less formal than a colon or a semicolon, and it adds a pause, often for drama. A dash is longer than a hyphen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Choose the punctuation."
                frame: "Pack these items _ a coat, a hat and some gloves."
                options: [":", ";", ","]
                answer: [":"]
                option_audio: false
                hints:
                  - "What comes after the gap?"
                  - "A list."
                  - "A colon."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which sentence uses a colon correctly?"
                options: ["We bought three things: bread, milk and eggs.", "We bought: bread, milk and eggs.", "We: bought bread, milk and eggs."]
                answer: "We bought three things: bread, milk and eggs."
                option_audio: false
                feedback:
                  "We bought: bread, milk and eggs.": "We bought is not complete before the colon. Write We bought three things, then the colon."
                hints:
                  - "Is the part before the colon complete?"
                  - "We bought three things makes sense alone."
                  - "We bought three things: bread, milk and eggs."
              - id: l2-f3
                type: multiple_choice
                text: "In which sentence does the second clause explain the first?"
                options: ["The plant died: nobody had watered it.", "The plant died: I like cake.", "The plant: died nobody watered it."]
                answer: "The plant died: nobody had watered it."
                option_audio: false
                hints:
                  - "Why did the plant die?"
                  - "The second part should give the reason."
                  - "The plant died: nobody had watered it."
              - id: l2-f4
                type: multiple_choice
                text: "Which sentence uses a dash to join two clauses for drama?"
                options: ["I opened the box - it was empty.", "I opened - the box it was empty.", "I - opened the box."]
                answer: "I opened the box - it was empty."
                option_audio: false
                hints:
                  - "A dash goes between two clauses."
                  - "Both sides must be complete."
                  - "I opened the box - it was empty."
              - id: l2-f5
                type: sorting
                text: "Sort the sentences."
                say: "Is each sentence punctuated correctly or not?"
                option_audio: false
                bins:
                  - { id: ok, show: { text: "correct" }, say: "Correct." }
                  - { id: wrong, show: { text: "not correct" }, say: "Not correct." }
                options:
                  - { text: "Bring your kit: shorts, a T-shirt and trainers.", bin: ok }
                  - { text: "Bring: shorts, a T-shirt and trainers.", bin: wrong }
                  - { text: "I was soaked: it had poured all day.", bin: ok }
                  - { text: "I was soaked, it had poured all day.", bin: wrong }
                hints:
                  - "Check what comes before each colon."
                  - "Is the last one a comma splice?"
                  - "Correct: Bring your kit, and I was soaked. Not correct: Bring followed by a colon, and the comma splice."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Choose the punctuation."
                frame: "The recipe needs four things _ flour, sugar, eggs and butter."
                options: [":", ";", ","]
                answer: [":"]
                option_audio: false
                hints: ["A list follows."]
              - id: l2-s2
                type: multiple_choice
                text: "Which sentence uses a colon correctly?"
                options: ["I have two pets: a cat and a rabbit.", "I have: a cat and a rabbit.", "I: have two pets a cat and a rabbit."]
                answer: "I have two pets: a cat and a rabbit."
                option_audio: false
                hints: ["Complete clause before the colon."]
              - id: l2-s3
                type: multiple_choice
                text: "In which sentence does the second clause explain the first?"
                options: ["The match was called off: the pitch was flooded.", "The match was called off: dogs bark.", "The match: was called off the pitch."]
                answer: "The match was called off: the pitch was flooded."
                option_audio: false
                hints: ["Why was it called off?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence uses a dash to join two clauses?"
                options: ["The lights went out - someone screamed.", "The lights - went out someone screamed.", "The - lights went out."]
                answer: "The lights went out - someone screamed."
                option_audio: false
                hints: ["Two complete clauses."]
              - id: l2-s5
                type: multiple_choice
                text: "Which list is punctuated correctly?"
                options: ["We met three people: Sam, our coach; Priya, the captain; and Tom, the goalkeeper.", "We met three people: Sam, our coach, Priya, the captain, and Tom, the goalkeeper.", "We met three people; Sam, our coach: Priya, the captain: and Tom, the goalkeeper."]
                answer: "We met three people: Sam, our coach; Priya, the captain; and Tom, the goalkeeper."
                option_audio: false
                hints: ["The items have commas inside, so a semicolon goes between the items."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Choose the punctuation."
                frame: "Mia speaks three languages _ English, Polish and French."
                options: [":", ";", ","]
                answer: [":"]
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Which sentence uses a colon correctly?"
                options: ["The box held two surprises: a puppy and a note.", "The box held: a puppy and a note.", "The: box held a puppy and a note."]
                answer: "The box held two surprises: a puppy and a note."
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "In which sentence does the second clause explain the first?"
                options: ["Leo was grinning: he had passed his test.", "Leo was grinning: the sky is blue.", "Leo: was grinning he passed."]
                answer: "Leo was grinning: he had passed his test."
                option_audio: false
              - id: l2-n4
                type: sorting
                text: "Sort the sentences."
                say: "Is each sentence punctuated correctly or not?"
                option_audio: false
                bins:
                  - { id: ok, show: { text: "correct" }, say: "Correct." }
                  - { id: wrong, show: { text: "not correct" }, say: "Not correct." }
                options:
                  - { text: "The town has two parks; both have ponds.", bin: ok }
                  - { text: "The town has two parks, both have ponds.", bin: wrong }
                  - { text: "You need: a pen.", bin: wrong }
                  - { text: "You need one thing: a pen.", bin: ok }
              - id: l2-n5
                type: fill_in_blank
                text: "Choose the punctuation."
                frame: "The club meets on three days: Monday, after school _ Wednesday, at lunch; and Friday, before school."
                options: [";", ",", ":"]
                answer: [";"]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Fix the comma splice.\n\n\"The bell rang, the lesson ended.\""
            options: ["The bell rang; the lesson ended.", "The bell, rang the lesson ended.", "The bell rang: the, lesson ended."]
            answer: "The bell rang; the lesson ended."
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Which list is punctuated correctly?"
            options: ["The menu had three dishes: soup, served hot; pasta, with cheese; and salad, with nuts.", "The menu had three dishes: soup, served hot, pasta, with cheese, and salad, with nuts.", "The menu had three dishes: soup; served hot, pasta; with cheese, and salad; with nuts."]
            answer: "The menu had three dishes: soup, served hot; pasta, with cheese; and salad, with nuts."
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "Which sentence uses a colon correctly?"
            options: ["The shop sells three fruits: apples, pears and plums.", "The shop sells: apples, pears and plums.", "The shop: sells apples, pears and plums."]
            answer: "The shop sells three fruits: apples, pears and plums."
            option_audio: false
          - id: l2-c4
            type: fill_in_blank
            text: "Choose the punctuation."
            frame: "She could not sleep _ the storm was too loud."
            options: [":", ","]
            answer: [":"]
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Which sentence uses a dash to join two clauses?"
            options: ["We reached the top - the view was amazing.", "We - reached the top the view.", "We reached - the top."]
            answer: "We reached the top - the view was amazing."
            option_audio: false
