# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.word-list-5-6
skill: lit-en.spelling.word-list-5-6
curriculum: en-GB
language: en
title:
  de: Wortliste Year 5 und 6
  en: The Year 5 and 6 word list
summary: >
  Words from the statutory Year 5 and 6 list, learnt through their parts
  and origins: double letters (accommodate, committee, embarrass), word
  families that show a silent letter (sign and signature, muscle and
  muscular), Greek spellings (rhythm, physical, system) and words from
  French (queue, restaurant, leisure). Lesson 1 works on double letters
  and word families; lesson 2 on word origins and silent letters, and
  ends with the skill check, typed from dictation.
metadata:
  year: year-6
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.spelling.suffixes-ks2-upper]
  also_practises: []
  vocabulary: { en: [word family, root word, origin, Greek, French, double letter, silent letter, statutory list] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: double, what: { de: Wörter mit doppelten Buchstaben, en: words with double letters } }
    - { id: families, what: { de: "Wortfamilien und langsames Sprechen in Teilen (sign, signature)", en: "word families and saying words slowly in parts (sign, signature)" } }
    - { id: origins, what: { de: "griechische und französische Schreibungen und stumme Buchstaben", en: "Greek and French spellings, and silent letters" } }
  misconceptions:
    - id: single-for-double
      what: Writes one letter where the word has a double (acommodate, comittee, embarass)
      addressed: l1-f1, l1-f2, l1-s1, l1-n1, l1-c1 and l2-c1; feedback on the single-letter spelling in l1-f1
    - id: spells-as-said
      what: Spells a word as it sounds and drops a silent letter or a vowel that is not said (rythm, intrested, mussle)
      addressed: l1-f4, l1-s4, l2-f3, l2-s3, l2-n2 and l2-c3; word families in Learn show the hidden letters
    - id: ignores-origin
      what: Uses an English pattern for a borrowed word (kew for queue, fisical for physical)
      addressed: l2-f1, l2-f2, l2-s1, l2-n1 and l2-c4 use the Greek and French patterns from Learn
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Doppelte Buchstaben und Wortfamilien, en: Double letters and word families }
    goal:
      de: "Schreib schwierige Wörter wie accommodate mit allen doppelten Buchstaben und nutze Wortfamilien, um stumme Buchstaben zu hören, wie in sign und signature."
      en: "Spell tricky words like accommodate with all their double letters, and use word families like sign and signature to hear hidden letters."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which spelling is correct?"
            options: ["delicious", "delitious", "delisious"]
            answer: "delicious"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Choose the ending.\n\nThe instructions were very sens_."
            say: "Choose the ending to spell sensible. The instructions were very sensible."
            options: ["ible", "able"]
            answer: "ible"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "accommodate, committee, embarrass\nimmediately, excellent, communicate\nequip → equipped"
            say: "Some words on the Year 5 and 6 list have double letters that are easy to miss. Accommodate has double c and double m. Committee has double m, double t and double e. Embarrass has double r and double s. Immediately and communicate have double m, excellent has double l, and equip doubles its p to make equipped."
          - text: "necessary: one collar, two sleeves\n(one c, two s)"
            say: "A memory trick helps. A shirt has one collar and two sleeves, so necessary has one c and two s's."
          - text: "sign → signature, signal\nmuscle → muscular\ndefine → definite\ngovern → government"
            say: "Word families help with letters you cannot hear. In signature you hear the g, so you remember it in sign. In muscular you hear the c, so you remember it in muscle. Government keeps the n of govern, even when we do not say it."
          - text: "interest → interested\nvegetable: veg-e-ta-ble"
            say: "Some words lose a vowel when we say them fast. Say them slowly in parts when you spell them: in-ter-est-ed, veg-e-ta-ble."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["committee", "comittee", "committe"]
                answer: "committee"
                option_audio: false
                feedback:
                  "comittee": "Committee has three double letters: mm, tt and ee."
                hints:
                  - "Count the double letters."
                  - "There are three pairs: m, t and e."
                  - "Committee."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fill the gap.\n\nThe hotel can a_odate forty guests."
                say: "Fill the gap to spell accommodate."
                frame: "a_odate"
                options: ["ccomm", "comm", "ccom"]
                answer: ["ccomm"]
                option_audio: false
                hints:
                  - "Accommodate has two double letters."
                  - "Double c and double m."
                  - "c c o m m."
              - id: l1-f3
                type: matching
                text: "Match each word to its family member that shows the hidden letter."
                pairs:
                  - { left: { text: "sign" }, right: { text: "signature" } }
                  - { left: { text: "muscle" }, right: { text: "muscular" } }
                  - { left: { text: "define" }, right: { text: "definite" } }
                hints:
                  - "Which longer word starts with the same letters?"
                  - "Signature starts with sign."
                  - "sign and signature, muscle and muscular, define and definite."
              - id: l1-f4
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["interested", "intrested", "interrested"]
                answer: "interested"
                option_audio: false
                hints:
                  - "Say it slowly in parts."
                  - "in-ter-est-ed."
                  - "Interested."
              - id: l1-f5
                type: text_input
                text: "Write the word you hear.\n\nIt is _ to bring a coat."
                say: "Necessary. It is necessary to bring a coat. Write necessary."
                keyboard: letters
                answer: "necessary"
                hints:
                  - "One collar, two sleeves."
                  - "One c, two s's."
                  - "n e c e s s a r y."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["embarrass", "embarass", "embaras"]
                answer: "embarrass"
                option_audio: false
                hints: ["Double r and double s."]
              - id: l1-s2
                type: fill_in_blank
                text: "Fill the gap.\n\nThis bus is a_able for the trip."
                say: "Fill the gap to spell available."
                frame: "a_able"
                options: ["vail", "vale", "vaill"]
                answer: ["vail"]
                option_audio: false
                hints: ["Think of the vowel team in rain."]
              - id: l1-s3
                type: matching
                text: "Match each word to its family member."
                pairs:
                  - { left: { text: "communicate" }, right: { text: "community" } }
                  - { left: { text: "excel" }, right: { text: "excellent" } }
                  - { left: { text: "familiar" }, right: { text: "family" } }
                hints: ["Look for the same letters at the start."]
              - id: l1-s4
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["vegetable", "vegtable", "vegatable"]
                answer: "vegetable"
                option_audio: false
                hints: ["veg-e-ta-ble."]
              - id: l1-s5
                type: text_input
                text: "Write the word you hear.\n\nPhones help us _ with friends far away."
                say: "Communicate. Phones help us communicate with friends far away. Write communicate."
                keyboard: letters
                answer: "communicate"
                hints: ["Double m."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["immediately", "imediately", "immediatly"]
                answer: "immediately"
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Fill the gap.\n\nThe boat was well e_ed for the storm."
                say: "Fill the gap to spell equipped."
                frame: "e_ed"
                options: ["quipp", "quip", "qipp"]
                answer: ["quipp"]
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Which word helps you remember the silent g in \"sign\"?"
                options: ["signal", "sing", "sight"]
                answer: "signal"
              - id: l1-n4
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["definite", "definate", "defenite"]
                answer: "definite"
                option_audio: false
              - id: l1-n5
                type: text_input
                text: "Write the word you hear.\n\nThat was an _ café."
                say: "Excellent. That was an excellent café. Write excellent."
                keyboard: letters
                answer: "excellent"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which spelling is correct?"
            options: ["accommodate", "acommodate", "accomodate"]
            answer: "accommodate"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which word helps you spell \"muscle\"?"
            options: ["muscular", "mussel", "must"]
            answer: "muscular"
          - id: l1-c3
            type: text_input
            text: "Write the word you hear.\n\nThat is my _ answer."
            say: "Definite. That is my definite answer. Write definite."
            keyboard: letters
            answer: "definite"
          - id: l1-c4
            type: multiple_choice
            text: "Which spelling is correct?"
            options: ["aggressive", "agressive", "aggresive"]
            answer: "aggressive"
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Which word helps you spell \"mischievous\"?"
            options: ["mischief", "mission", "machine"]
            answer: "mischief"
          - id: l1-c6
            type: text_input
            text: "Write the word you hear.\n\nThe library is open to the whole _."
            say: "Community. The library is open to the whole community. Write community."
            keyboard: letters
            answer: "community"

  - n: 2
    title: { de: Woher Wörter kommen, en: Where words come from }
    goal:
      de: "Nutze, woher ein Wort kommt, um es richtig zu schreiben, wie rhythm aus dem Griechischen und queue aus dem Französischen."
      en: "Use where a word comes from to spell it, like rhythm from Greek and queue from French."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which spelling is correct?"
            options: ["necessary", "neccessary", "necesary"]
            answer: "necessary"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which word helps you spell \"definite\"?"
            options: ["define", "defend", "delight"]
            answer: "define"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "rhythm\nphysical, symbol, system"
            say: "Many words came into English from Greek. Greek words often spell the f sound ph, as in physical, and the short i sound y, as in symbol and system. Rh at the start of rhythm is Greek too."
          - text: "queue, restaurant, leisure, amateur, soldier"
            say: "Some words came from French. They keep French spellings: queue ends in ueue, restaurant has au, amateur ends in eur."
          - text: "yacht, muscle, foreign, island\n(silent letters)"
            say: "Some words have silent letters that came from older spellings. You cannot hear the ch in yacht or the g in foreign, so learn them by sight. Say them in a funny way to remember: yak-t, for-eig-n."
          - text: "forty (not fourty)\ntwelfth (twelve → twelfth)"
            say: "Watch out for words that look like they come from another word but change. Four loses its u in forty. Twelve becomes twelfth with an f."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["physical", "fysical", "phisical"]
                answer: "physical"
                option_audio: false
                feedback:
                  "fysical": "Physical comes from Greek, so the f sound is spelt ph and the i sound is y."
                hints:
                  - "Is this word from Greek?"
                  - "Greek words use ph for f and y for i."
                  - "Physical."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["queue", "queu", "kew"]
                answer: "queue"
                option_audio: false
                hints:
                  - "This word comes from French."
                  - "It has five letters and ends in ueue."
                  - "Queue."
              - id: l2-f3
                type: fill_in_blank
                text: "Fill the gap.\n\nWe clapped to the _ of the drum."
                say: "Fill the gap to spell rhythm."
                frame: "_thm"
                options: ["rhy", "ri", "ry"]
                answer: ["rhy"]
                option_audio: false
                hints:
                  - "It is a Greek word."
                  - "It starts with rh and has a y."
                  - "r h y."
              - id: l2-f4
                type: sorting
                text: "Sort the words by where they came from."
                say: "Which words came from Greek, and which came from French?"
                option_audio: false
                bins:
                  - { id: greek, show: { text: "Greek" }, say: "Greek." }
                  - { id: french, show: { text: "French" }, say: "French." }
                options:
                  - { text: "symbol", bin: greek }
                  - { text: "restaurant", bin: french }
                  - { text: "system", bin: greek }
                  - { text: "amateur", bin: french }
                hints:
                  - "Greek words often have y for i."
                  - "French words keep French endings like eur and au."
                  - "Symbol and system: Greek. Restaurant and amateur: French."
              - id: l2-f5
                type: text_input
                text: "Write the word you hear.\n\nThe boy sailed his toy _ on the pond."
                say: "Yacht. The boy sailed his toy yacht on the pond. Write yacht."
                keyboard: letters
                answer: "yacht"
                hints:
                  - "It has a silent ch."
                  - "y a ... then the silent letters, then t."
                  - "y a c h t."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["leisure", "leasure", "liesure"]
                answer: "leisure"
                option_audio: false
                hints: ["A French word with ei."]
              - id: l2-s2
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["forty", "fourty", "fortey"]
                answer: "forty"
                option_audio: false
                hints: ["Four loses its u."]
              - id: l2-s3
                type: fill_in_blank
                text: "Fill the gap.\n\nShe lives in a _ country now."
                say: "Fill the gap to spell foreign."
                frame: "for_"
                options: ["eign", "ein", "ign"]
                answer: ["eign"]
                option_audio: false
                hints: ["There is a silent g."]
              - id: l2-s4
                type: sorting
                text: "Sort the words by where they came from."
                say: "Which words came from Greek, and which came from French?"
                option_audio: false
                bins:
                  - { id: greek, show: { text: "Greek" }, say: "Greek." }
                  - { id: french, show: { text: "French" }, say: "French." }
                options:
                  - { text: "rhythm", bin: greek }
                  - { text: "queue", bin: french }
                  - { text: "physical", bin: greek }
                  - { text: "leisure", bin: french }
                hints: ["Look for rh, ph and y."]
              - id: l2-s5
                type: text_input
                text: "Write the word you hear.\n\nThe _ marched across the field."
                say: "Soldier. The soldier marched across the field. Write soldier."
                keyboard: letters
                answer: "soldier"
                hints: ["The j sound is spelt di."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["system", "sistem", "systum"]
                answer: "system"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Which spelling is correct?"
                options: ["twelfth", "twelth", "twelveth"]
                answer: "twelfth"
                option_audio: false
              - id: l2-n3
                type: highlight_in_text
                text: "Tap the silent letter in \"island\"."
                show: { drawn: letter-card, text: "i s l a n d" }
                spans: ["s"]
              - id: l2-n4
                type: multiple_choice
                text: "Which word comes from French?"
                options: ["restaurant", "rhythm", "symbol"]
                answer: "restaurant"
              - id: l2-n5
                type: text_input
                text: "Write the word you hear.\n\nWe ate at a new _ in town."
                say: "Restaurant. We ate at a new restaurant in town. Write restaurant."
                keyboard: letters
                answer: "restaurant"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: double
            type: text_input
            text: "Write the word you hear.\n\nPlease do not _ your sister."
            say: "Embarrass. Please do not embarrass your sister. Write embarrass."
            keyboard: letters
            answer: "embarrass"
          - id: l2-c2
            part: families
            type: multiple_choice
            text: "Which spelling is correct?"
            options: ["signature", "signiture", "sigature"]
            answer: "signature"
            option_audio: false
          - id: l2-c3
            part: origins
            type: text_input
            text: "Write the word you hear.\n\nThe _ of the song was fast."
            say: "Rhythm. The rhythm of the song was fast. Write rhythm."
            keyboard: letters
            answer: "rhythm"
          - id: l2-c4
            part: origins
            type: multiple_choice
            text: "Which spelling is correct?"
            options: ["symbol", "simbol", "symbal"]
            answer: "symbol"
            option_audio: false
          - id: l2-c5
            part: families
            type: multiple_choice
            text: "Which spelling is correct?"
            options: ["government", "goverment", "govenment"]
            answer: "government"
            option_audio: false
          - id: l2-c6
            part: double
            type: multiple_choice
            text: "Which spelling is correct?"
            options: ["recommend", "reccommend", "recomend"]
            answer: "recommend"
            option_audio: false
          - id: l2-c7
            part: double
            type: text_input
            text: "Write the word you hear.\n\nPlease do not _ while I am talking."
            say: "Interrupt. Please do not interrupt while I am talking. Write interrupt."
            keyboard: letters
            answer: "interrupt"
          - id: l2-c8
            part: double
            type: fill_in_blank
            text: "Fill the gap.\n\nThe fisherman liked to e_erate the size of his catch."
            say: "Fill the gap to spell exaggerate."
            frame: "e_erate"
            options: ["xagg", "xag", "xxag"]
            answer: ["xagg"]
            option_audio: false
          - id: l2-c9
            part: double
            type: multiple_choice
            text: "Which spelling is correct?"
            options: ["opportunity", "oportunity", "opportunaty"]
            answer: "opportunity"
            option_audio: false
          - id: l2-c10
            part: double
            type: text_input
            text: "Write the word you hear.\n\nI _ that you try the soup."
            say: "Suggest. I suggest that you try the soup. Write suggest."
            keyboard: letters
            answer: "suggest"
          - id: l2-c11
            part: double
            type: true_false
            text: "Is it true? In British English, \"marvellous\" is spelt with a double l."
            answer: true
          - id: l2-c12
            part: families
            type: multiple_choice
            text: "Which word helps you remember the c in \"criticise\"?"
            options: ["critic", "crisis", "cricket"]
            answer: "critic"
          - id: l2-c13
            part: families
            type: matching
            text: "Match each word to the family word that helps you spell it."
            pairs:
              - { left: { text: "competition" }, right: { text: "compete" } }
              - { left: { text: "secretary" }, right: { text: "secret" } }
              - { left: { text: "existence" }, right: { text: "exist" } }
          - id: l2-c14
            part: families
            type: true_false
            text: "Is it true? \"Pronunciation\" is spelt with ou, like \"pronounce\"."
            answer: false
          - id: l2-c15
            part: families
            type: text_input
            text: "Write the word you hear.\n\nThe _ is high today, so wear sun cream."
            say: "Temperature. The temperature is high today, so wear sun cream. Write temperature."
            keyboard: letters
            answer: "temperature"
          - id: l2-c16
            part: origins
            type: multiple_choice
            text: "Which spelling is correct?"
            options: ["amateur", "amature", "ammateur"]
            answer: "amateur"
            option_audio: false
          - id: l2-c17
            part: origins
            type: text_input
            text: "Write the word you hear.\n\nWe waited in a long _ for the bus."
            say: "Queue. We waited in a long queue for the bus. Write queue."
            keyboard: letters
            answer: "queue"
          - id: l2-c18
            part: origins
            type: multiple_choice
            text: "Which word comes from Greek?"
            options: ["physical", "amateur", "soldier"]
            answer: "physical"
          - id: l2-c19
            part: origins
            type: fill_in_blank
            text: "Fill the gap.\n\nThis poem has a _ at the end of every line."
            say: "Fill the gap to spell rhyme."
            frame: "_me"
            options: ["rhy", "ry", "ri"]
            answer: ["rhy"]
            option_audio: false
          - id: l2-c20
            part: origins
            type: multiple_choice
            text: "Which letter is silent in \"guarantee\"?"
            options: ["u", "g", "t"]
            answer: "u"
            option_audio: false
