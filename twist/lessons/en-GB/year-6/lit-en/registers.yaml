# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.registers
skill: lit-en.speaking.registers
curriculum: en-GB
language: en
title:
  de: Passend sprechen, förmlich oder locker
  en: Speaking to fit the situation
summary: >
  How we speak changes with who is listening and why: chatty with friends,
  formal in an assembly, a phone call to a museum or a school council
  speech. Lesson 1 matches situations to formal or informal speech and
  says lines both ways; lesson 2 changes a line from one register to the
  other, picks the right greeting, request and ending, and ends with the
  skill check. Speaking tasks are practice only.
metadata:
  year: year-6
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.speaking.standard-english-speech, lit-en.grammar.formal-informal]
  also_practises: [lit-en.grammar.formal-informal]
  vocabulary: { en: [formal, informal, register, audience, purpose, polite, greeting, request] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: formal-is-rude-to-friends
      what: Thinks informal speech is always wrong, so speaks formally to friends as well
      addressed: l1-f2, l1-s1 and l2-c2 include situations where informal speech is the right choice
    - id: adult-means-formal
      what: Thinks the register depends only on age, so any adult needs very formal speech and any child informal
      addressed: Learn screen 2; l1-f4 and l1-n4 set a relaxed chat with family against a formal speech to children
    - id: slang-in-formal
      what: Keeps slang or chatty fillers (like, yeah, stuff) in a formal talk
      addressed: l2-f2, l2-s2, l2-n2 and l2-c4 choose the formal line; feedback on the filler in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wer hört zu?", en: "Who is listening?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which is the formal word for \"find out\"?"
            options: ["discover", "grab", "look"]
            answer: "discover"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which sentence uses Standard English?"
            options: ["I was going to tell you.", "I were going to tell you.", "I weren't going to tell you."]
            answer: "I was going to tell you."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "With a friend: \"Hiya! Fancy coming round later?\"\nTo the head teacher: \"Good morning, Mrs Clarke. Would you be free to visit our class later?\""
            say: "Listen to both. They ask the same thing in two ways. The way we speak for a situation is called a register."
          - text: "Who is listening?\nWhy am I speaking?\nWhere am I?"
            say: "Ask yourself three questions. Who is listening, why you are speaking, and where you are. An assembly, a speech or a phone call to a business needs formal speech. A chat with friends or family can be informal."
          - text: "Formal speech: full sentences, polite words (please, would, could), no slang.\nInformal speech: short forms, everyday words, jokes."
            say: "Formal speech uses full sentences and polite words like would and could. Informal speech can be short and relaxed. Both are right in the right place."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "You are giving a talk in assembly to the whole school.\n\nWhich register fits?"
                options: ["formal", "informal"]
                answer: "formal"
                keep_order: true
                hints:
                  - "Who is listening?"
                  - "The whole school, teachers too, in a special event."
                  - "Formal."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "You are telling your best friend about a funny film at break.\n\nWhich register fits?"
                options: ["formal", "informal"]
                answer: "informal"
                keep_order: true
                feedback:
                  "formal": "Formal speech would sound odd here. With a close friend at break, relaxed speech is right."
                hints:
                  - "Who is listening, and where are you?"
                  - "A friend, in the playground."
                  - "Informal."
              - id: l1-f3
                type: sorting
                text: "Sort the situations."
                say: "Does each situation need formal or informal speech?"
                option_audio: false
                bins:
                  - { id: formal, show: { text: "formal" }, say: "Formal." }
                  - { id: informal, show: { text: "informal" }, say: "Informal." }
                options:
                  - { text: "phoning a museum to book a visit", bin: formal }
                  - { text: "playing a board game with your cousin", bin: informal }
                  - { text: "a speech to the school governors", bin: formal }
                  - { text: "asking your brother what is for tea", bin: informal }
                hints:
                  - "Ask who is listening for each one."
                  - "A museum and the governors do not know you well."
                  - "Museum and governors: formal. Cousin and brother: informal."
              - id: l1-f4
                type: true_false
                text: "Is it true? You must always speak formally to any grown-up, even your own grandma at tea."
                answer: false
                hints:
                  - "Is it about age, or about the situation?"
                  - "Tea with Grandma is a relaxed family time."
                  - "No, it depends on the situation."
              - id: l1-f5
                type: speak
                text: "Say it in a formal way: \"Can I have a look?\""
                say: "You are at a museum and want to see an old map. Ask the guide politely."
                expected_text: "Would it be possible to see the map, please?"
                hints:
                  - "Use would or could."
                  - "Add please."
                  - "Would it be possible to see the map, please?"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "You are chatting with your team after a football match.\n\nWhich register fits?"
                options: ["formal", "informal"]
                answer: "informal"
                keep_order: true
                hints: ["Team mates, after a game."]
              - id: l1-s2
                type: multiple_choice
                text: "You are interviewing the mayor for the school newspaper.\n\nWhich register fits?"
                options: ["formal", "informal"]
                answer: "formal"
                keep_order: true
                hints: ["Someone important you do not know."]
              - id: l1-s3
                type: sorting
                text: "Sort the lines."
                say: "Is each line formal or informal?"
                option_audio: false
                bins:
                  - { id: formal, show: { text: "formal" }, say: "Formal." }
                  - { id: informal, show: { text: "informal" }, say: "Informal." }
                options:
                  - { text: "Thank you for listening.", bin: formal }
                  - { text: "See ya!", bin: informal }
                  - { text: "Could I ask a question, please?", bin: formal }
                  - { text: "No way, that's mad!", bin: informal }
                hints: ["Slang is informal."]
              - id: l1-s4
                type: multiple_choice
                text: "Why do we choose a register?"
                options: ["to fit the listener and the situation", "to use as many long words as we can", "to sound like a grown-up"]
                answer: "to fit the listener and the situation"
                hints: ["Think of the three questions."]
              - id: l1-s5
                type: speak
                text: "Say it in a formal way: \"Hi, I'm Ali from Year 6.\""
                say: "You are starting a speech to parents at an open evening. Introduce yourself formally."
                expected_text: "Good evening. My name is Ali and I am in Year 6."
                hints: ["Start with Good evening."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "You are asking a shop assistant where the batteries are.\n\nWhich line fits best?"
                options: ["Excuse me, could you tell me where the batteries are?", "Oi, where's the batteries?", "Batteries. Where?"]
                answer: "Excuse me, could you tell me where the batteries are?"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "You are reading the news on the school radio.\n\nWhich register fits?"
                options: ["formal", "informal"]
                answer: "formal"
                keep_order: true
              - id: l1-n3
                type: sorting
                text: "Sort the situations."
                say: "Does each situation need formal or informal speech?"
                option_audio: false
                bins:
                  - { id: formal, show: { text: "formal" }, say: "Formal." }
                  - { id: informal, show: { text: "informal" }, say: "Informal." }
                options:
                  - { text: "a class debate in front of a judge", bin: formal }
                  - { text: "a sleepover with friends", bin: informal }
                  - { text: "thanking a visiting author on stage", bin: formal }
                  - { text: "a video call with your aunt", bin: informal }
              - id: l1-n4
                type: true_false
                text: "Is it true? A speech to a class of Reception children can still be formal if it is a special event."
                answer: true
              - id: l1-n5
                type: speak
                text: "Say it in an informal way: \"Would you care to join us for lunch?\""
                say: "Now you are asking your best friend. Say it in a relaxed way."
                expected_text: "Want to have lunch with us?"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "You are leaving a phone message for the dentist.\n\nWhich register fits?"
            options: ["formal", "informal"]
            answer: "formal"
            keep_order: true
          - id: l1-c2
            type: multiple_choice
            text: "You are joking with your sister in the car.\n\nWhich register fits?"
            options: ["formal", "informal"]
            answer: "informal"
            keep_order: true
          - id: l1-c3
            type: multiple_choice
            text: "Which line fits a speech to the school governors?"
            options: ["Thank you for giving us this chance to speak.", "Cheers for having us, guys!", "Right, so, yeah."]
            answer: "Thank you for giving us this chance to speak."
            option_audio: false

  - n: 2
    title: { de: Umschalten, en: Switching register }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "You are giving a tour of the school to a new teacher.\n\nWhich register fits?"
            options: ["formal", "informal"]
            answer: "formal"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? Informal speech is the right choice with friends at a party."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Informal: \"Got any tickets left?\"\nFormal: \"Do you have any tickets left, please?\""
            say: "To make a line formal, use a full sentence, add polite words and do not leave words out."
          - text: "Informal fillers: like, yeah, stuff, you know\nFormal: leave them out, or pause"
            say: "In a formal talk, leave out fillers such as like, yeah and stuff. A short pause sounds better than a filler."
          - text: "Formal start: Good morning, everyone.\nFormal end: Thank you for listening.\nInformal start: Hey!\nInformal end: See you!"
            say: "The start and the end of a talk set the register. A formal talk starts with a greeting such as Good morning and ends with thank you."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Make it formal: \"Wanna come to our play?\""
                options: ["Would you like to come to our play?", "You wanna come, yeah?", "Come to our play, OK?"]
                answer: "Would you like to come to our play?"
                option_audio: false
                hints:
                  - "Use a full sentence with a polite word."
                  - "Wanna becomes would you like to."
                  - "Would you like to come to our play?"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which line fits a school council speech?"
                options: ["I believe we need more benches in the playground.", "So, like, we need benches and stuff.", "Benches, yeah? Loads of them."]
                answer: "I believe we need more benches in the playground."
                option_audio: false
                feedback:
                  "So, like, we need benches and stuff.": "Like and stuff are fillers. Leave them out in a formal speech."
                hints:
                  - "Look for fillers and slang."
                  - "Which line has none of them?"
                  - "I believe we need more benches in the playground."
              - id: l2-f3
                type: multiple_choice
                text: "How should a formal talk end?"
                options: ["Thank you for listening.", "Laters!", "That's it, bye."]
                answer: "Thank you for listening."
                option_audio: false
                hints:
                  - "The end of a talk sets the register."
                  - "Think of a polite thank you."
                  - "Thank you for listening."
              - id: l2-f4
                type: highlight_in_text
                text: "Tap the fillers you would leave out of a formal talk."
                show: { drawn: letter-card, text: "Our trip was, like, really interesting, yeah." }
                spans: ["like", "yeah"]
                hints:
                  - "Fillers add nothing to the meaning."
                  - "There are two."
                  - "Like and yeah."
              - id: l2-f5
                type: speak
                text: "Say it in a formal way: \"Can we have a new climbing frame?\""
                say: "You are speaking to the head teacher at a school council meeting. Make the request formally."
                expected_text: "We would like to ask whether we could have a new climbing frame, please."
                hints:
                  - "Start with We would like to ask."
                  - "Add please at the end."
                  - "We would like to ask whether we could have a new climbing frame, please."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Make it formal: \"Hey, what's this thing for?\""
                options: ["Excuse me, could you tell me what this is for?", "Oi, what's that?", "What's it for, mate?"]
                answer: "Excuse me, could you tell me what this is for?"
                option_audio: false
                hints: ["Use excuse me and could."]
              - id: l2-s2
                type: multiple_choice
                text: "Which line fits a speech at a prize evening?"
                options: ["I would like to thank my teachers for their help.", "Big up my teachers!", "Yeah, so, thanks and stuff."]
                answer: "I would like to thank my teachers for their help."
                option_audio: false
                hints: ["No slang, no fillers."]
              - id: l2-s3
                type: multiple_choice
                text: "Make it informal: \"I am afraid I am unable to attend.\""
                say: "You are telling your friend you cannot come. Which line fits?"
                options: ["Sorry, I can't make it.", "I regret that I am unable to attend.", "Please accept my apologies."]
                answer: "Sorry, I can't make it."
                option_audio: false
                hints: ["Which one would you say to a friend?"]
              - id: l2-s4
                type: multiple_choice
                text: "How should a formal talk start?"
                options: ["Good afternoon, everyone.", "Hiya!", "Right, listen up."]
                answer: "Good afternoon, everyone."
                option_audio: false
                hints: ["A greeting with the time of day."]
              - id: l2-s5
                type: speak
                text: "Say it in a formal way: \"Thanks for coming!\""
                say: "You are ending a class assembly for parents. Thank them formally."
                expected_text: "Thank you all for coming today."
                hints: ["Thank you all ..."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Make it formal: \"Can I borrow a pen?\""
                say: "You are at the town library desk. Which line fits best?"
                options: ["Could I possibly borrow a pen, please?", "Gimme a pen.", "Pen, please, mate."]
                answer: "Could I possibly borrow a pen, please?"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Which line fits a talk to visitors at a museum?"
                options: ["This room shows how Victorian children lived.", "So this is, like, where kids lived and stuff.", "This bit's well old."]
                answer: "This room shows how Victorian children lived."
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Make it informal: \"Would you care for a biscuit?\""
                say: "You are offering a biscuit to your friend. Which line fits?"
                options: ["Want a biscuit?", "May I offer you a biscuit?", "Would you care for refreshments?"]
                answer: "Want a biscuit?"
                option_audio: false
              - id: l2-n4
                type: highlight_in_text
                text: "Tap the slang you would change in a formal talk."
                show: { drawn: letter-card, text: "The science fair was awesome and the kids loved it." }
                spans: ["awesome", "kids"]
              - id: l2-n5
                type: speak
                text: "Say it in a formal way: \"Hey, I'm phoning about the trip.\""
                say: "You are phoning the farm to ask about a school trip. Start the call formally."
                expected_text: "Good morning. I am calling about our school trip to the farm."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "You are speaking at a meeting with the local police officer.\n\nWhich register fits?"
            options: ["formal", "informal"]
            answer: "formal"
            keep_order: true
          - id: l2-c2
            type: multiple_choice
            text: "You are on the phone to your best friend, planning to meet at the park.\n\nWhich line fits?"
            options: ["Meet you at the park at 4?", "I would be most grateful if you could meet me at the park.", "Good afternoon. Please attend the park at 4 pm."]
            answer: "Meet you at the park at 4?"
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "Make it formal: \"Where's the loo?\""
            options: ["Excuse me, where are the toilets, please?", "Loo?", "Where's the loo, then?"]
            answer: "Excuse me, where are the toilets, please?"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Which line fits a speech to the whole school?"
            options: ["We are raising money for the local food bank.", "So, yeah, we're doing, like, money stuff.", "Gimme your cash for the food bank!"]
            answer: "We are raising money for the local food bank."
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Is it true? The register you choose depends on who is listening and why you are speaking."
            answer: true
