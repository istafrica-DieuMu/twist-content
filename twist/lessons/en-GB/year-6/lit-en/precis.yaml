# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.precis
skill: lit-en.composition.precis
curriculum: en-GB
language: en
title:
  de: Einen Text kurz zusammenfassen
  en: Writing a précis
summary: >
  A précis is a much shorter version of a passage that keeps every main
  point, in the same order, and drops examples, extra description and
  repetition. Lesson 1 sorts main points from details and picks what to
  cut; lesson 2 chooses and builds précis of longer passages, checks that
  no main point is lost, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [lit-en.comprehension.main-ideas]
  also_practises: [lit-en.comprehension.main-ideas]
  vocabulary: { en: [précis, main point, detail, example, summarise, cut, condense, own words] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: keeps-details
      what: Keeps vivid details and examples and drops a main point, so the précis is short but incomplete
      addressed: l1-f2, l1-f3, l1-s3, l1-n3 and l2-c2 sort or cut details; feedback in l1-f2
    - id: copies-first-sentences
      what: Copies the first sentence or two and stops, missing main points later in the passage
      addressed: l2-f1, l2-s1, l2-n1 and l2-c3 offer a précis that copies only the opening; feedback in l2-f1
    - id: adds-opinion
      what: Adds the writer's own opinion or new facts to the précis
      addressed: l2-f4, l2-s4 and l2-c5 ask whether a précis may add an opinion
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Hauptpunkt oder Detail?", en: "Main point or detail?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Hedgehogs sleep all winter. This is called hibernation. Before they sleep, they eat lots of beetles and worms to build up fat.\n\nWhat is the main idea?"
            options: ["Hedgehogs hibernate in winter and prepare by eating.", "Hedgehogs eat beetles.", "Worms are food."]
            answer: "Hedgehogs hibernate in winter and prepare by eating."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? A summary is shorter than the text it summarises."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The Great Fire of London began on 2 September 1666 in a bakery on Pudding Lane. The baker, Thomas Farriner, had left his oven burning. Strong winds spread the flames quickly through the wooden houses, which were packed tightly together. The fire burned for four days and destroyed more than 13,000 homes."
            say: "Read this paragraph about the Great Fire of London. It has 52 words."
          - text: "Main points: where and when it started; why it spread; how much it destroyed.\nDetails: the baker's name, his oven, the houses packed tightly."
            say: "A précis keeps the main points and cuts the details. Ask: if I took this out, would the reader still understand what happened?"
          - text: "In 1666, a fire started in a London bakery. Wind spread it through the wooden houses, and over four days it destroyed more than 13,000 homes."
            say: "Here is a précis. It keeps every main point, in the same order, in about half the words. It uses some of its own words, and it adds no opinions."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What is a précis?"
                options: ["a shorter version that keeps all the main points", "the first sentence of a text", "a longer version with more detail"]
                answer: "a shorter version that keeps all the main points"
                hints:
                  - "Is it longer or shorter?"
                  - "What must it keep?"
                  - "A shorter version that keeps all the main points."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Bees are vital for farming. They carry pollen from flower to flower, which helps crops grow. One bee can visit 5,000 flowers in a day. Without bees, many fruits would not grow.\n\nWhich sentence is a detail you could cut?"
                options: ["One bee can visit 5,000 flowers in a day.", "Bees are vital for farming.", "Without bees, many fruits would not grow."]
                answer: "One bee can visit 5,000 flowers in a day."
                option_audio: false
                feedback:
                  "Without bees, many fruits would not grow.": "This is a main point: it explains why bees matter. The 5,000 flowers is an interesting detail you could cut."
                hints:
                  - "Which sentence could go without losing the main message?"
                  - "Interesting numbers are often details."
                  - "One bee can visit 5,000 flowers in a day."
              - id: l1-f3
                type: sorting
                text: "Sort the sentences about the Great Fire."
                say: "Is each sentence a main point or a detail?"
                option_audio: false
                bins:
                  - { id: main, show: { text: "main point" }, say: "Main point." }
                  - { id: detail, show: { text: "detail" }, say: "Detail." }
                options:
                  - { text: "The fire started in a bakery.", bin: main }
                  - { text: "The baker was called Thomas Farriner.", bin: detail }
                  - { text: "It destroyed over 13,000 homes.", bin: main }
                  - { text: "The houses were packed tightly.", bin: detail }
                hints:
                  - "Would the reader still understand without it?"
                  - "Names and extra description are often details."
                  - "Bakery and 13,000 homes: main points. The baker's name and tightly packed houses: details."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap the words you could cut without losing the meaning."
                show: { drawn: letter-card, text: "The very old, crumbling castle stands on a hill." }
                spans: ["very", "old", "crumbling"]
                hints:
                  - "Which words only add description?"
                  - "The main point is that the castle stands on a hill."
                  - "Very, old and crumbling."
              - id: l1-f5
                type: true_false
                text: "Is it true? A précis can leave out a main point if it is near the end of the passage."
                answer: false
                hints:
                  - "What must a précis keep?"
                  - "Every main point, wherever it is."
                  - "No, it keeps every main point."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is the best order for a précis?"
                options: ["the same order as the passage", "the most exciting point first", "any order you like"]
                answer: "the same order as the passage"
                hints: ["Think of the Great Fire précis."]
              - id: l1-s2
                type: multiple_choice
                text: "Plastic in the sea harms wildlife. Turtles mistake bags for jellyfish. My uncle saw a turtle once in Spain. Many countries now charge for plastic bags.\n\nWhich sentence does not belong in a précis?"
                options: ["My uncle saw a turtle once in Spain.", "Plastic in the sea harms wildlife.", "Many countries now charge for plastic bags."]
                answer: "My uncle saw a turtle once in Spain."
                option_audio: false
                hints: ["Which sentence is not about the main topic at all?"]
              - id: l1-s3
                type: sorting
                text: "Sort the sentences about bees."
                say: "Is each sentence a main point or a detail?"
                option_audio: false
                bins:
                  - { id: main, show: { text: "main point" }, say: "Main point." }
                  - { id: detail, show: { text: "detail" }, say: "Detail." }
                options:
                  - { text: "Bees help crops grow.", bin: main }
                  - { text: "Bees have stripes.", bin: detail }
                  - { text: "Bee numbers are falling.", bin: main }
                  - { text: "My favourite flower is a daisy.", bin: detail }
                hints: ["Is it needed to understand the message?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the words you could cut without losing the meaning."
                show: { drawn: letter-card, text: "The tiny, fluffy, golden chick hatched on Monday." }
                spans: ["tiny", "fluffy", "golden"]
                hints: ["Three describing words."]
              - id: l1-s5
                type: true_false
                text: "Is it true? A précis should use some of your own words."
                answer: true
                hints: ["Does a précis copy every word?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Why do we write a précis?"
                options: ["to give the main points quickly", "to make a text longer", "to add our opinion"]
                answer: "to give the main points quickly"
              - id: l1-n2
                type: multiple_choice
                text: "The Romans built roads across Britain. The roads were straight, so soldiers could march quickly. Some were paved with flat stones. Many modern roads follow the same routes.\n\nWhich sentence is a detail you could cut?"
                options: ["Some were paved with flat stones.", "The Romans built roads across Britain.", "Many modern roads follow the same routes."]
                answer: "Some were paved with flat stones."
                option_audio: false
              - id: l1-n3
                type: sorting
                text: "Sort the sentences about Roman roads."
                say: "Is each sentence a main point or a detail?"
                option_audio: false
                bins:
                  - { id: main, show: { text: "main point" }, say: "Main point." }
                  - { id: detail, show: { text: "detail" }, say: "Detail." }
                options:
                  - { text: "The roads let soldiers move fast.", bin: main }
                  - { text: "Some stones were grey.", bin: detail }
                  - { text: "Modern roads follow Roman routes.", bin: main }
                  - { text: "One road was near a river.", bin: detail }
              - id: l1-n4
                type: highlight_in_text
                text: "Tap the words you could cut without losing the meaning."
                show: { drawn: letter-card, text: "The extremely loud, terrifying storm lasted all night." }
                spans: ["extremely", "loud", "terrifying"]
              - id: l1-n5
                type: true_false
                text: "Is it true? A précis keeps the main points in the same order as the passage."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Owls hunt at night. They have soft feathers, so they fly silently. Their hooting is spooky. They catch mice and voles.\n\nWhich sentence is a detail you could cut?"
            options: ["Their hooting is spooky.", "Owls hunt at night.", "They have soft feathers, so they fly silently."]
            answer: "Their hooting is spooky."
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Is it true? A précis should be longer than the passage."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "What does a précis keep?"
            options: ["every main point", "every example", "every describing word"]
            answer: "every main point"

  - n: 2
    title: { de: Den ganzen Abschnitt kürzen, en: Shortening a whole passage }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is a detail, not a main point?\n\nVolcanoes erupt when melted rock rises. The rock is called magma. Eruptions can destroy towns."
            options: ["The rock is called magma.", "Volcanoes erupt when melted rock rises.", "Eruptions can destroy towns."]
            answer: "The rock is called magma."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? A précis keeps the main points in the same order."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1. Read the whole passage.\n2. Find the main point of each paragraph.\n3. Cut examples, description and repetition.\n4. Write the points in your own words, in order.\n5. Check: is every main point there?"
            say: "Here are five steps for a précis. Read it all, find the main point of each paragraph, cut what is extra, write it in your own words, and check nothing important is missing."
          - text: "Watch out:\nCopying the first two sentences is not a précis.\nAdding \"I think this is amazing\" is not a précis."
            say: "Two traps. A précis is not just the start of the passage, because it must cover the whole thing. And a précis never adds your own opinion or new facts."
          - text: "Paragraph 1: Foxes now live in cities.\nParagraph 2: They eat food from bins.\nParagraph 3: Some people feed them, others see them as pests.\nPrécis: Foxes now live in cities, eating from bins; some people welcome them, but others see them as pests."
            say: "Here, one main point from each paragraph is joined into one sentence. All three are there, in order."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Penguins live in the Southern Hemisphere. They cannot fly, but their wings work like flippers. Most penguins live in cold places like Antarctica. Sadly, melting ice is making it harder for them to find food.\n\nWhich is the best précis?"
                options: ["Penguins are flightless swimmers of the cold south, and melting ice threatens their food.", "Penguins live in the Southern Hemisphere. They cannot fly.", "Penguins are amazing and I love them."]
                answer: "Penguins are flightless swimmers of the cold south, and melting ice threatens their food."
                option_audio: false
                feedback:
                  "Penguins live in the Southern Hemisphere. They cannot fly.": "This copies the first two sentences and misses the melting ice. A précis covers the whole passage."
                hints:
                  - "Does it cover the whole passage?"
                  - "Check for the last point: melting ice."
                  - "The one about flightless swimmers and melting ice."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Put the main points in the order of the passage."
                say: "These are the main points of the passage about penguins. Put them in order."
                option_audio: false
                options: ["Melting ice threatens their food.", "Penguins live in the south.", "Most live in cold places.", "Their wings work as flippers."]
                slot_count: 4
                answer: ["Penguins live in the south.", "Their wings work as flippers.", "Most live in cold places.", "Melting ice threatens their food."]
                hints:
                  - "Read the passage again from the start."
                  - "Where they live, then wings, then cold places."
                  - "South, flippers, cold places, melting ice."
              - id: l2-f3
                type: multiple_choice
                text: "Passage: 80 words.\n\nWhich length suits a précis?"
                options: ["about 30 to 40 words", "about 80 words", "about 120 words"]
                answer: "about 30 to 40 words"
                hints:
                  - "A précis is much shorter."
                  - "About half or less."
                  - "About 30 to 40 words."
              - id: l2-f4
                type: true_false
                text: "Is it true? You can add \"This is the best animal\" to your précis to make it interesting."
                answer: false
                hints:
                  - "Was that opinion in the passage?"
                  - "A précis adds no new opinions."
                  - "No, leave it out."
              - id: l2-f5
                type: multiple_choice
                text: "A précis says: \"Penguins cannot fly but swim well.\"\n\nWhich main point is missing?"
                options: ["melting ice threatens their food", "their feathers are black and white", "they waddle"]
                answer: "melting ice threatens their food"
                hints:
                  - "Look back at the last sentence of the passage."
                  - "What problem do penguins face?"
                  - "Melting ice threatens their food."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "The Victorians built the first railways. Trains made travel much faster. People could now visit the seaside for a day. Towns like Blackpool grew quickly.\n\nWhich is the best précis?"
                options: ["Victorian railways made travel faster, so day trips to seaside towns like Blackpool became popular.", "The Victorians built the first railways.", "Trains are brilliant and fast."]
                answer: "Victorian railways made travel faster, so day trips to seaside towns like Blackpool became popular."
                option_audio: false
                hints: ["It must cover every point."]
              - id: l2-s2
                type: ordering
                text: "Put the main points in the order of the passage."
                say: "These are the main points about Victorian railways. Put them in order."
                option_audio: false
                options: ["Seaside towns grew.", "Travel became faster.", "Railways were built.", "Day trips became possible."]
                slot_count: 4
                answer: ["Railways were built.", "Travel became faster.", "Day trips became possible.", "Seaside towns grew."]
                hints: ["Follow the passage from the first sentence."]
              - id: l2-s3
                type: multiple_choice
                text: "A précis says: \"Victorians built railways, which made travel faster.\"\n\nWhich main point is missing?"
                options: ["seaside trips and towns grew", "trains had steam", "tickets cost pennies"]
                answer: "seaside trips and towns grew"
                hints: ["Look at the end of the passage."]
              - id: l2-s4
                type: true_false
                text: "Is it true? A précis may add a new fact that was not in the passage."
                answer: false
                hints: ["Keep only what the passage says."]
              - id: l2-s5
                type: multiple_choice
                text: "Which step comes first when writing a précis?"
                options: ["Read the whole passage.", "Write your opinion.", "Copy the first sentence."]
                answer: "Read the whole passage."
                hints: ["You need to know it all first."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Recycling saves resources. Paper can be made into new paper. Glass can be melted down again and again. However, only some plastics can be recycled.\n\nWhich is the best précis?"
                options: ["Recycling paper and glass saves resources, but only some plastics can be recycled.", "Recycling saves resources. Paper can be made into new paper.", "Everyone should recycle because it is great."]
                answer: "Recycling paper and glass saves resources, but only some plastics can be recycled."
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Put the main points in the order of the passage."
                say: "These are the main points about recycling. Put them in order."
                option_audio: false
                options: ["Only some plastics can be recycled.", "Glass can be reused.", "Recycling saves resources.", "Paper can be reused."]
                slot_count: 4
                answer: ["Recycling saves resources.", "Paper can be reused.", "Glass can be reused.", "Only some plastics can be recycled."]
              - id: l2-n3
                type: multiple_choice
                text: "A précis says: \"Recycling paper and glass saves resources.\"\n\nWhich main point is missing?"
                options: ["only some plastics can be recycled", "glass is shiny", "paper comes from trees"]
                answer: "only some plastics can be recycled"
              - id: l2-n4
                type: true_false
                text: "Is it true? Joining main points with words like \"but\" and \"so\" can make a précis shorter."
                answer: true
              - id: l2-n5
                type: highlight_in_text
                text: "Tap the words you could cut without losing the meaning."
                show: { drawn: letter-card, text: "The huge, shiny, brand-new train left on time." }
                spans: ["huge", "shiny", "brand-new"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which step comes last when you write a précis?"
            options: ["Check that every main point is there.", "Read the whole passage.", "Add your own opinion."]
            answer: "Check that every main point is there."
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Rainforests cover a small part of the Earth. Yet they are home to half of all animal species. One tree can hold hundreds of kinds of insect. Rainforests are being cut down for farmland.\n\nWhich sentence is a detail you could cut?"
            options: ["One tree can hold hundreds of kinds of insect.", "Yet they are home to half of all animal species.", "Rainforests are being cut down for farmland."]
            answer: "One tree can hold hundreds of kinds of insect."
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "Rainforests cover a small part of the Earth. Yet they are home to half of all animal species. One tree can hold hundreds of kinds of insect. Rainforests are being cut down for farmland.\n\nWhich is the best précis?"
            options: ["Though small, rainforests hold half of all animal species and are being cut down for farms.", "Rainforests cover a small part of the Earth.", "Rainforests are beautiful and we must love them."]
            answer: "Though small, rainforests hold half of all animal species and are being cut down for farms."
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "A précis says: \"Rainforests are small but home to half of all species.\"\n\nWhich main point is missing?"
            options: ["they are being cut down for farmland", "they are hot", "insects live in trees"]
            answer: "they are being cut down for farmland"
          - id: l2-c5
            type: true_false
            text: "Is it true? \"I think rainforests are the best place on Earth\" belongs in the précis."
            answer: false
