# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.passive
skill: lit-en.grammar.passive
curriculum: en-GB
language: en
title:
  de: Das Passiv
  en: The passive voice
summary: >
  In the active voice the subject does the action (I broke the window); in
  the passive voice the subject has the action done to it (The window was
  broken by me). The passive is formed with a form of be and a past
  participle, and the "by" phrase can be left out. Lesson 1 tells active
  from passive and finds the parts; lesson 2 changes active sentences into
  the passive, chooses the passive for effect (in reports, or when the
  doer is unknown) and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [lit-en.grammar.perfect-forms]
  also_practises: [lit-en.grammar.formal-informal]
  vocabulary: { en: [active voice, passive voice, subject, object, past participle, by phrase, agent, formal] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: recognise, what: { de: Aktiv und Passiv unterscheiden, en: telling active from passive } }
    - { id: form, what: { de: "das Passiv bilden (be und Partizip Perfekt)", en: "forming the passive (be and a past participle)" } }
    - { id: effect, what: { de: das Passiv für eine Wirkung wählen, en: choosing the passive for its effect } }
  misconceptions:
    - id: past-is-passive
      what: Thinks any sentence in the past tense is passive (The dog chased the cat)
      addressed: l1-f1, l1-f2, l1-s1, l1-n1 and l2-c1; feedback in l1-f1
    - id: needs-by
      what: Thinks a passive sentence must have a "by" phrase, so misses passives like "The cake was eaten"
      addressed: Learn lesson 1 screen 3; l1-f4, l1-s4, l1-n4 and l2-c5
    - id: wrong-participle
      what: Uses the past tense instead of the past participle (The window was broke)
      addressed: l2-f2, l2-s2, l2-n2 and l2-c3; feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Aktiv oder Passiv?", en: "Active or passive?" }
    goal:
      de: "Erkenne, ob ein Satz im Aktiv oder im Passiv steht, so wie bei The ball was kicked by Sam."
      en: "Tell an active sentence from a passive one, like Sam kicked the ball and the ball was kicked by Sam."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Choose the verb form.\n\nBy the time we arrived, the film _ started."
            say: "Choose the verb form. By the time we arrived, the film ... started."
            options: ["had", "has", "have"]
            answer: "had"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which sentence uses the present perfect?"
            options: ["I have finished my book.", "I finish my book.", "I will finish my book."]
            answer: "I have finished my book."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Active: Sam kicked the ball.\n(subject Sam does the action)"
            say: "In an active sentence, the subject does the action. Sam kicked the ball. Sam is doing the kicking."
          - text: "Passive: The ball was kicked by Sam.\n(subject the ball has the action done to it)"
            say: "In a passive sentence, the subject has the action done to it. The ball was kicked by Sam. Now the ball comes first, and Sam comes after by."
          - text: "was / were / is / has been + past participle\nwas kicked, were eaten, is made, has been stolen"
            say: "A passive verb uses a form of be, like was, were or is, with a past participle, like kicked, eaten or stolen. The by phrase can be left out: The cake was eaten. We still know it is passive."
          - text: "Past tense, but active: The dog chased the cat.\nPassive: The cat was chased by the dog."
            say: "Careful. The dog chased the cat is in the past, but it is active, because the dog does the chasing. Passive is not the same as past."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"The children painted the fence.\"\n\nActive or passive?"
                options: ["active", "passive"]
                answer: "active"
                feedback:
                  "passive": "It is in the past, but the subject, the children, does the painting. So it is active."
                hints:
                  - "Who or what is the subject?"
                  - "Do the children do the painting, or have it done to them?"
                  - "Active."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"The fence was painted by the children.\"\n\nActive or passive?"
                options: ["passive", "active"]
                answer: "passive"
                hints:
                  - "What is the subject now?"
                  - "The fence has the painting done to it. Look for was and a past participle."
                  - "Passive."
              - id: l1-f3
                type: highlight_in_text
                text: "Tap the passive verb."
                show: { drawn: letter-card, text: "The letter was written by Grandma." }
                spans: ["was", "written"]
                hints:
                  - "A passive verb has two parts."
                  - "A form of be and a past participle."
                  - "Was written."
              - id: l1-f4
                type: true_false
                text: "Is it true? \"The cake was eaten.\" is a passive sentence."
                answer: true
                hints:
                  - "Is there a form of be and a past participle?"
                  - "Was eaten. The by phrase is left out."
                  - "Yes, it is passive."
              - id: l1-f5
                type: sorting
                text: "Sort the sentences."
                say: "Is each sentence active or passive?"
                option_audio: false
                bins:
                  - { id: active, show: { text: "active" }, say: "Active." }
                  - { id: passive, show: { text: "passive" }, say: "Passive." }
                options:
                  - { text: "The bee stung Tom.", bin: active }
                  - { text: "Tom was stung by a bee.", bin: passive }
                  - { text: "Mum baked bread.", bin: active }
                  - { text: "The bread was baked.", bin: passive }
                hints:
                  - "Does the subject do the action?"
                  - "Look for was with a past participle."
                  - "Stung Tom and baked bread: active. Was stung and was baked: passive."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"The wind blew the leaves away.\"\n\nActive or passive?"
                options: ["active", "passive"]
                answer: "active"
                hints: ["Does the wind do the blowing?"]
              - id: l1-s2
                type: multiple_choice
                text: "\"The castle was built in 1200.\"\n\nActive or passive?"
                options: ["passive", "active"]
                answer: "passive"
                hints: ["Look for was and a past participle."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the passive verb."
                show: { drawn: letter-card, text: "The windows were cleaned on Monday." }
                spans: ["were", "cleaned"]
                hints: ["Two words."]
              - id: l1-s4
                type: true_false
                text: "Is it true? A passive sentence must always say who did the action."
                answer: false
                hints: ["Think of The cake was eaten."]
              - id: l1-s5
                type: multiple_choice
                text: "\"The vase was smashed by the cat.\"\n\nWho did the action?"
                options: ["the cat", "the vase"]
                answer: "the cat"
                hints: ["Look after by."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"Our class planted a tree.\"\n\nActive or passive?"
                options: ["active", "passive"]
                answer: "active"
              - id: l1-n2
                type: multiple_choice
                text: "\"The road is being repaired.\"\n\nActive or passive?"
                options: ["passive", "active"]
                answer: "passive"
                difficulty: stretch
              - id: l1-n3
                type: highlight_in_text
                text: "Tap the passive verb."
                show: { drawn: letter-card, text: "My bike has been stolen." }
                spans: ["has", "been", "stolen"]
              - id: l1-n4
                type: true_false
                text: "Is it true? \"The prize was won.\" is a passive sentence."
                answer: true
              - id: l1-n5
                type: sorting
                text: "Sort the sentences."
                say: "Is each sentence active or passive?"
                option_audio: false
                bins:
                  - { id: active, show: { text: "active" }, say: "Active." }
                  - { id: passive, show: { text: "passive" }, say: "Passive." }
                options:
                  - { text: "The fox ate the eggs.", bin: active }
                  - { text: "The eggs were eaten.", bin: passive }
                  - { text: "A goal was scored.", bin: passive }
                  - { text: "Ella scored a goal.", bin: active }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "\"The parcel was delivered by a robot.\"\n\nActive or passive?"
            options: ["passive", "active"]
            answer: "passive"
          - id: l1-c2
            type: multiple_choice
            text: "\"A robot delivered the parcel.\"\n\nActive or passive?"
            options: ["active", "passive"]
            answer: "active"
          - id: l1-c3
            type: highlight_in_text
            text: "Tap the passive verb."
            show: { drawn: letter-card, text: "The song is sung every morning." }
            spans: ["is", "sung"]
          - id: l1-c4
            type: sorting
            text: "Sort the sentences about the school trip."
            say: "Sort the sentences about the school trip. Is each one active or passive?"
            option_audio: false
            bins:
              - { id: active, show: { text: "active" }, say: "Active." }
              - { id: passive, show: { text: "passive" }, say: "Passive." }
            options:
              - { text: "The coach was booked by Mr Lee.", bin: passive }
              - { text: "We visited a castle.", bin: active }
              - { text: "Lunch was eaten on the grass.", bin: passive }
              - { text: "Ali lost his hat.", bin: active }
          - id: l1-c5
            type: true_false
            text: "Is it true? \"The baby cried all night.\" is passive, because it is in the past tense."
            answer: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tap the words that tell you who did the action."
            show: { drawn: letter-card, text: "The trophy was presented by Mrs Okafor." }
            spans: ["Mrs", "Okafor"]

  - n: 2
    title: { de: Ins Passiv setzen, en: Changing to the passive }
    goal:
      de: "Setz Sätze ins Passiv, so wird aus The dog chewed the shoe der Satz The shoe was chewed by the dog."
      en: "Turn active sentences into the passive, so the dog chewed the shoe becomes the shoe was chewed by the dog."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"The door was opened.\"\n\nActive or passive?"
            options: ["passive", "active"]
            answer: "passive"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "\"Ben opened the door.\"\n\nActive or passive?"
            options: ["active", "passive"]
            answer: "active"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Active: The dog chewed the shoe.\n1. Move the object to the front: The shoe ...\n2. Add was or were + past participle: ... was chewed ...\n3. Add by + the doer (if needed): ... by the dog."
            say: "To change an active sentence into the passive, move the object to the front, add was or were with the past participle, then add by and the doer if you need it."
          - text: "broke → was broken\nate → was eaten\nwrote → was written\nstole → was stolen"
            say: "Use the past participle, not the past tense. The window was broken, not was broke. The cake was eaten, not was ate."
          - text: "Report: The water was heated to 100 °C.\nMystery: The diamond was stolen during the night."
            say: "Why use the passive? In science reports, the action matters more than who did it. In a mystery, the doer may be unknown. The passive puts the focus on what happened."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Change into the passive.\n\n\"The chef cooked the meal.\""
                options: ["The meal was cooked by the chef.", "The chef was cooked by the meal.", "The meal cooked the chef."]
                answer: "The meal was cooked by the chef."
                option_audio: false
                hints:
                  - "Move the object, the meal, to the front."
                  - "Then was cooked, then by the chef."
                  - "The meal was cooked by the chef."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Choose the correct passive verb.\n\nThe window was _ by the ball."
                say: "Choose the correct passive verb. The window was ... by the ball."
                options: ["broken", "broke", "breaked"]
                answer: "broken"
                feedback:
                  "broke": "Broke is the past tense. The passive needs the past participle: broken."
                hints:
                  - "After was, use the past participle."
                  - "Think: it has been ..."
                  - "Broken."
              - id: l2-f3
                type: ordering
                text: "Build the passive sentence."
                say: "Put the parts in order to make a passive sentence."
                option_audio: false
                options: ["by a famous author.", "The book", "was written"]
                slot_count: 3
                answer: ["The book", "was written", "by a famous author."]
                hints:
                  - "Start with the thing the action is done to."
                  - "Then the passive verb."
                  - "The book, was written, by a famous author."
              - id: l2-f4
                type: multiple_choice
                text: "Why might a science report say \"The mixture was stirred for two minutes\"?"
                options: ["The action matters more than who did it.", "Nobody stirred it.", "It is a story."]
                answer: "The action matters more than who did it."
                hints:
                  - "Does the reader need to know who stirred?"
                  - "The passive puts the focus on what happened."
                  - "The action matters more than who did it."
              - id: l2-f5
                type: text_input
                text: "Write the past participle to finish the passive.\n\nThe treasure was (hide) under the floor."
                keyboard: letters
                answer: "hidden"
                hints:
                  - "Think: it has been ..."
                  - "Hide, hid, ..."
                  - "Hidden."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Change into the passive.\n\n\"The storm damaged the roof.\""
                options: ["The roof was damaged by the storm.", "The storm was damaged by the roof.", "The roof damaged the storm."]
                answer: "The roof was damaged by the storm."
                option_audio: false
                hints: ["Start with the roof."]
              - id: l2-s2
                type: multiple_choice
                text: "Choose the correct passive verb.\n\nThe pies were _ by the hungry children."
                say: "Choose the correct passive verb. The pies were ... by the hungry children."
                options: ["eaten", "ate", "eat"]
                answer: "eaten"
                hints: ["Use the past participle."]
              - id: l2-s3
                type: ordering
                text: "Build the passive sentence."
                say: "Put the parts in order to make a passive sentence."
                option_audio: false
                options: ["were found", "in the garden.", "The keys"]
                slot_count: 3
                answer: ["The keys", "were found", "in the garden."]
                hints: ["The thing found comes first."]
              - id: l2-s4
                type: multiple_choice
                text: "Which sentence keeps the doer a mystery?"
                options: ["The biscuits were taken from the jar.", "Max took the biscuits from the jar.", "The dog took the biscuits."]
                answer: "The biscuits were taken from the jar."
                option_audio: false
                hints: ["Which one does not say who did it?"]
              - id: l2-s5
                type: text_input
                text: "Write the past participle to finish the passive.\n\nThe bridge was (build) in 1890."
                keyboard: letters
                answer: "built"
                hints: ["It has been ..."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Change into the passive.\n\n\"The police caught the thief.\""
                options: ["The thief was caught by the police.", "The police were caught by the thief.", "The thief caught the police."]
                answer: "The thief was caught by the police."
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Choose the correct passive verb.\n\nThe money was _ from the safe."
                say: "Choose the correct passive verb. The money was ... from the safe."
                options: ["stolen", "stole", "steal"]
                answer: "stolen"
              - id: l2-n3
                type: ordering
                text: "Build the passive sentence."
                say: "Put the parts in order to make a passive sentence."
                option_audio: false
                options: ["by the head teacher.", "The prizes", "were given out"]
                slot_count: 3
                answer: ["The prizes", "were given out", "by the head teacher."]
              - id: l2-n4
                type: multiple_choice
                text: "Which sentence would fit best in a science report?"
                options: ["The seeds were planted in damp soil.", "I planted the seeds and it was fun.", "We wanna plant seeds."]
                answer: "The seeds were planted in damp soil."
                option_audio: false
              - id: l2-n5
                type: text_input
                text: "Write the past participle to finish the passive.\n\nThe invitations were (send) last week."
                keyboard: letters
                answer: "sent"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: recognise
            type: sorting
            text: "Sort these sentences into active and passive."
            say: "Put each sentence in the right group."
            option_audio: false
            bins:
              - { id: active, show: { text: "active" }, say: "Active." }
              - { id: passive, show: { text: "passive" }, say: "Passive." }
            options:
              - { text: "The girl rode the horse.", bin: active }
              - { text: "The horse was ridden.", bin: passive }
              - { text: "The match was cancelled.", bin: passive }
              - { text: "The rain stopped the match.", bin: active }
          - id: l2-c2
            part: form
            type: multiple_choice
            text: "Change into the passive.\n\n\"A wasp stung the farmer.\""
            options: ["The farmer was stung by a wasp.", "A wasp was stung by the farmer.", "The farmer stung a wasp."]
            answer: "The farmer was stung by a wasp."
            option_audio: false
          - id: l2-c3
            part: form
            type: text_input
            text: "Write the past participle to finish the passive.\n\nThe poem was (write) by our class."
            keyboard: letters
            answer: "written"
          - id: l2-c4
            part: effect
            type: multiple_choice
            text: "Why might a news report say \"A painting was stolen from the museum last night\"?"
            options: ["Nobody knows yet who stole it.", "The painting stole itself.", "It is an informal chat."]
            answer: "Nobody knows yet who stole it."
          - id: l2-c5
            part: recognise
            type: true_false
            text: "Is it true? \"The gate was locked.\" is passive even without a \"by\" phrase."
            answer: true
          - id: l2-c6
            part: recognise
            type: highlight_in_text
            text: "Tap every word of the passive verb."
            show: { drawn: letter-card, text: "Last night, three cars were damaged outside the school." }
            spans: ["were", "damaged"]
          - id: l2-c7
            part: recognise
            type: multiple_choice
            text: "Which sentence is passive?"
            options: ["The flowers were picked this morning.", "We picked the flowers this morning.", "The flowers grew this morning."]
            answer: "The flowers were picked this morning."
            option_audio: false
          - id: l2-c8
            part: recognise
            type: true_false
            text: "Is it true? \"The children were laughing.\" is a passive sentence."
            answer: false
          - id: l2-c9
            part: recognise
            type: multiple_choice
            text: "\"The puppy was found by a postman.\"\n\nWhat is the subject of this sentence?"
            options: ["the puppy", "a postman"]
            answer: "the puppy"
          - id: l2-c10
            part: recognise
            type: true_false
            text: "Is it true? \"The clock was fixed.\" is active, because it does not say who fixed it."
            answer: false
          - id: l2-c11
            part: form
            type: multiple_choice
            text: "Change into the passive.\n\n\"The teacher marked the books.\""
            options: ["The books were marked by the teacher.", "The books was marked by the teacher.", "The teacher was marked by the books."]
            answer: "The books were marked by the teacher."
            option_audio: false
          - id: l2-c12
            part: form
            type: multiple_choice
            text: "Choose the correct passive verb.\n\nThe song was _ by the whole school."
            say: "Choose the correct passive verb. The song was ... by the whole school."
            options: ["sung", "sang", "singed"]
            answer: "sung"
          - id: l2-c13
            part: form
            type: text_input
            text: "Write the past participle to finish the passive.\n\nThe ice lollies were (freeze) overnight."
            keyboard: letters
            answer: "frozen"
          - id: l2-c14
            part: form
            type: ordering
            text: "Build the passive sentence."
            say: "Put the parts in order to make a passive sentence."
            option_audio: false
            options: ["by the lifeguard.", "The swimmer", "was rescued"]
            slot_count: 3
            answer: ["The swimmer", "was rescued", "by the lifeguard."]
          - id: l2-c15
            part: form
            type: fill_in_blank
            text: "Active: Lightning hit the old oak tree.\n\nFinish the passive sentence."
            say: "Active: Lightning hit the old oak tree. Finish the passive sentence."
            frame: "The old oak tree _ _ by lightning."
            options: ["was", "were", "hit", "hitted"]
            answer: ["was", "hit"]
          - id: l2-c16
            part: effect
            type: multiple_choice
            text: "A museum guide wants the focus on the painting, not on the painter.\n\nWhich sentence fits?"
            options: ["The painting was finished in 1889.", "The painter finished the painting in 1889."]
            answer: "The painting was finished in 1889."
            option_audio: false
          - id: l2-c17
            part: effect
            type: multiple_choice
            text: "Rewrite for a science report.\n\n\"I poured the water into the beaker.\""
            options: ["The water was poured into the beaker.", "The beaker poured the water.", "I was poured into the beaker."]
            answer: "The water was poured into the beaker."
            option_audio: false
          - id: l2-c18
            part: effect
            type: true_false
            text: "Is it true? In \"The new library will be opened by the mayor\", the passive puts the focus on the new library."
            answer: true
          - id: l2-c19
            part: effect
            type: multiple_choice
            text: "A notice says: \"Mobile phones must be switched off.\"\n\nWhy does it use the passive?"
            options: ["What must happen matters, not who does it.", "The phones switch themselves off.", "It is a chatty message to a friend."]
            answer: "What must happen matters, not who does it."
          - id: l2-c20
            part: effect
            type: true_false
            text: "Is it true? Reports use the passive to make the writing sound chatty."
            answer: false
