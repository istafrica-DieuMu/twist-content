# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.formal-informal
skill: lit-en.grammar.formal-informal
curriculum: en-GB
language: en
title:
  de: Förmlich und umgangssprachlich
  en: Formal and informal
summary: >
  Formal writing uses words such as request, discover and receive, full
  forms instead of contractions, and structures such as the subjunctive
  (If I were ...); informal speech and writing use everyday words, short
  forms and question tags (It's late, isn't it?). Lesson 1 swaps informal
  words and contractions for formal ones; lesson 2 adds question tags and
  the subjunctive and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.grammar.standard-verb-forms]
  also_practises: []
  vocabulary: { en: [formal, informal, contraction, question tag, subjunctive, request, discover, receive, purchase, assist] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: vocabulary, what: { de: förmliche Wörter und Langformen statt Kurzformen, en: formal words and full forms instead of contractions } }
    - { id: tags, what: { de: Frageanhängsel (question tags) bilden und erkennen, en: forming and spotting question tags } }
    - { id: subjunctive, what: { de: "den Konjunktiv in förmlicher Sprache (If I were ...)", en: "the subjunctive in formal English (If I were ...)" } }
    - { id: choose-register, what: { de: den passenden förmlichen oder lockeren Satz wählen, en: choosing the formal or informal sentence that fits } }
  misconceptions:
    - id: formal-means-long
      what: Thinks formal writing just means long or difficult words, so it is fine to keep slang and contractions in a formal letter
      addressed: l1-f3, l1-s3, l1-n3 and l2-c2 sort or fix contractions and slang in formal sentences
    - id: was-for-subjunctive
      what: Writes "If I was you" in formal writing where the subjunctive "If I were you" is needed
      addressed: l2-f3, l2-s3, l2-n3 and l2-c4; feedback on "was" in l2-f3
    - id: tag-in-formal
      what: Uses question tags (isn't it?) in formal writing
      addressed: l2-f2, l2-s2, l2-s5 and l2-c5 ask which sentence fits formal writing or speech; Learn says tags belong to chat
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Förmliche Wörter, en: Formal words }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which sentence uses Standard English?"
            options: ["We did our homework.", "We done our homework.", "We doed our homework."]
            answer: "We did our homework."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Choose the Standard English verb.\n\nThey _ to the park yesterday."
            say: "Choose the Standard English verb. They ... to the park yesterday."
            options: ["went", "goed", "gone"]
            answer: "went"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Informal: Can you help me find out what's going on?\nFormal: Could you assist me in discovering what is happening?"
            say: "Informal language is how we chat to friends. Formal language is for letters to a head teacher, reports and speeches. Both say the same thing in different ways."
          - text: "ask for → request\nfind out → discover\nget → receive\nbuy → purchase\nhelp → assist\nkids → children"
            say: "Formal writing often uses a single, more precise word instead of a short everyday phrase. Get becomes receive, find out becomes discover."
          - text: "don't → do not\nit's → it is\nwe'll → we will\ncan't → cannot"
            say: "Contractions, the short forms with an apostrophe, are informal. In formal writing, write the full form. Can't becomes cannot, written as one word."
          - text: "Informal: loads of, really cool, Hi!\nFormal: many, excellent, Dear Mrs Shah,"
            say: "Slang and chatty openings are informal too. A formal letter starts with Dear and avoids slang."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which is the formal word for \"find out\"?"
                options: ["discover", "look", "get"]
                answer: "discover"
                hints:
                  - "Which word means to learn something new?"
                  - "Scientists do this in a lab."
                  - "Discover."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Match each informal word to its formal partner."
                say: "Match each informal word to the formal word that means the same."
                pairs:
                  - { left: { text: "buy" }, right: { text: "purchase" } }
                  - { left: { text: "help" }, right: { text: "assist" } }
                  - { left: { text: "get" }, right: { text: "receive" } }
                  - { left: { text: "ask for" }, right: { text: "request" } }
                hints:
                  - "Say each pair in a sentence. Do they mean the same?"
                  - "Buying something in a shop is a purchase."
                  - "buy and purchase, help and assist, get and receive, ask for and request."
              - id: l1-f3
                type: sorting
                text: "Sort the sentences."
                say: "Is each sentence formal or informal?"
                option_audio: false
                bins:
                  - { id: formal, show: { text: "formal" }, say: "Formal." }
                  - { id: informal, show: { text: "informal" }, say: "Informal." }
                options:
                  - { text: "We would be grateful for your reply.", bin: formal }
                  - { text: "Can't wait to see you!", bin: informal }
                  - { text: "The school will close at 2 pm.", bin: formal }
                  - { text: "That trip was well good.", bin: informal }
                hints:
                  - "Look for contractions and slang."
                  - "Can't is a contraction. Well good is slang."
                  - "Grateful and close at 2 pm: formal. Can't wait and well good: informal."
              - id: l1-f4
                type: fill_in_blank
                text: "Change the contraction into its full form."
                say: "Change the contraction into its full form."
                frame: "We _ attend the meeting. (won't)"
                options: ["will not", "willn't", "wont"]
                answer: ["will not"]
                option_audio: false
                hints:
                  - "Won't is short for two words."
                  - "It is the opposite of we will."
                  - "Will not."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the informal words in this letter to the council."
                show: { drawn: letter-card, text: "Dear Sir, loads of kids play in the park." }
                spans: ["loads", "kids"]
                hints:
                  - "Which words would you use with a friend?"
                  - "One means many, one means children."
                  - "Loads and kids."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is the formal word for \"get\"?"
                options: ["receive", "grab", "take"]
                answer: "receive"
                hints: ["You do this when a letter arrives."]
              - id: l1-s2
                type: matching
                text: "Match each informal word to its formal partner."
                say: "Match each informal word to the formal word that means the same."
                pairs:
                  - { left: { text: "find out" }, right: { text: "discover" } }
                  - { left: { text: "kids" }, right: { text: "children" } }
                  - { left: { text: "it's" }, right: { text: "it is" } }
                  - { left: { text: "lots of" }, right: { text: "many" } }
                hints: ["Say each pair in a sentence."]
              - id: l1-s3
                type: sorting
                text: "Sort the sentences."
                say: "Is each sentence formal or informal?"
                option_audio: false
                bins:
                  - { id: formal, show: { text: "formal" }, say: "Formal." }
                  - { id: informal, show: { text: "informal" }, say: "Informal." }
                options:
                  - { text: "Visitors must sign in at reception.", bin: formal }
                  - { text: "Gonna be late, sorry!", bin: informal }
                  - { text: "Please find the form enclosed.", bin: formal }
                  - { text: "It's dead easy.", bin: informal }
                hints: ["Gonna and dead easy are chatty."]
              - id: l1-s4
                type: fill_in_blank
                text: "Change the contraction into its full form."
                say: "Change the contraction into its full form."
                frame: "_ unable to come on Friday. (I'm)"
                options: ["I am", "Im", "I'm"]
                answer: ["I am"]
                option_audio: false
                hints: ["Write both words."]
              - id: l1-s5
                type: multiple_choice
                text: "Which opening fits a letter to a head teacher?"
                options: ["Dear Mr Evans,", "Hiya Mr Evans!", "Yo!"]
                answer: "Dear Mr Evans,"
                option_audio: false
                hints: ["Formal letters start with one word."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is the formal word for \"help\"?"
                options: ["assist", "fix", "join"]
                answer: "assist"
              - id: l1-n2
                type: multiple_choice
                text: "Which sentence is the most formal?"
                options: ["We wish to request a new bench.", "We wanna ask for a new bench.", "Can we get a new bench?"]
                answer: "We wish to request a new bench."
                option_audio: false
              - id: l1-n3
                type: sorting
                text: "Sort the sentences."
                say: "Is each sentence formal or informal?"
                option_audio: false
                bins:
                  - { id: formal, show: { text: "formal" }, say: "Formal." }
                  - { id: informal, show: { text: "informal" }, say: "Informal." }
                options:
                  - { text: "Thank you for your kind invitation.", bin: formal }
                  - { text: "Cheers for asking me!", bin: informal }
                  - { text: "Tickets may be purchased online.", bin: formal }
                  - { text: "We'll grab some snacks.", bin: informal }
              - id: l1-n4
                type: text_input
                text: "Write the formal word for \"buy\"."
                keyboard: letters
                answer: "purchase"
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the contractions in this report."
                show: { drawn: letter-card, text: "The river isn't clean and it's getting worse." }
                spans: ["isn't", "it's"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is the formal word for \"ask for\"?"
            options: ["request", "shout", "want"]
            answer: "request"
          - id: l1-c2
            type: fill_in_blank
            text: "Change the contraction into its full form."
            say: "Change the contraction into its full form."
            frame: "The library _ open on Sundays. (isn't)"
            options: ["is not", "isnt", "is'nt"]
            answer: ["is not"]
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? \"Hiya, how's it going?\" is a formal opening for a letter."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Which sentence is the most formal?"
            options: ["Refreshments may be purchased in the hall.", "You can grab snacks in the hall.", "Snacks are, like, in the hall."]
            answer: "Refreshments may be purchased in the hall."
            option_audio: false
          - id: l1-c5
            type: highlight_in_text
            text: "Tap the informal words in this letter to the head teacher."
            show: { drawn: letter-card, text: "Dear Mrs Ahmed, the new playground is cool and the kids love it." }
            spans: ["cool", "kids"]
          - id: l1-c6
            type: fill_in_blank
            text: "Change the contraction into its full form."
            say: "Change the contraction into its full form."
            frame: "_ essential to book in advance. (It's)"
            options: ["It is", "Its", "It's"]
            answer: ["It is"]
            option_audio: false

  - n: 2
    title: { de: Frageanhängsel und Konjunktiv, en: Question tags and the subjunctive }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which is the formal word for \"kids\"?"
            options: ["children", "babies", "grown-ups"]
            answer: "children"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? Formal writing uses full forms such as \"do not\" instead of \"don't\"."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "It's cold today, isn't it?\nYou like pizza, don't you?"
            say: "A question tag is a short question added to the end of a statement. Isn't it and don't you are question tags. We use them when we chat, so they are informal."
          - text: "She is coming, isn't she?\nThey can't swim, can they?"
            say: "A positive statement takes a negative tag, and a negative statement takes a positive tag. The tag uses the same helping verb: is and isn't, can't and can."
          - text: "Informal: If I was you, I'd ask.\nFormal: If I were you, I would ask."
            say: "The subjunctive is a formal verb form. After if, for something imagined, formal English uses were, even with I, he or she: If I were you, if she were here."
          - text: "It is essential that every pupil be on time."
            say: "The subjunctive also appears after words like essential, insist and request. Every pupil be on time sounds very formal. In chat we would say every pupil needs to be on time."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Choose the question tag.\n\nYou are coming to the party, _?"
                say: "Choose the question tag. You are coming to the party, ...?"
                options: ["aren't you", "are you", "don't you"]
                answer: "aren't you"
                feedback:
                  "are you": "The statement is positive, so the tag is negative: aren't you."
                hints:
                  - "Is the statement positive or negative?"
                  - "It is positive and uses are, so the tag is negative and uses are."
                  - "Aren't you."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which sentence fits a formal letter to the council?"
                options: ["The road outside the school is dangerous.", "The road's dangerous, isn't it?", "That road's well dodgy."]
                answer: "The road outside the school is dangerous."
                option_audio: false
                hints:
                  - "Formal letters avoid tags, contractions and slang."
                  - "Which one has none of them?"
                  - "The road outside the school is dangerous."
              - id: l2-f3
                type: multiple_choice
                text: "Choose the formal verb.\n\nIf I _ the prime minister, I would ban homework."
                say: "Choose the formal verb. If I ... the prime minister, I would ban homework."
                options: ["were", "was", "am"]
                answer: "were"
                feedback:
                  "was": "We often say was when we chat, but formal English uses the subjunctive: If I were."
                hints:
                  - "It is an imagined situation after if."
                  - "Formal English uses the subjunctive here, even with I."
                  - "Were."
              - id: l2-f4
                type: highlight_in_text
                text: "Tap the question tag."
                show: { drawn: letter-card, text: "That was a brilliant film, wasn't it?" }
                spans: ["wasn't", "it"]
                hints:
                  - "A question tag comes at the end."
                  - "It is a short question after the comma."
                  - "Wasn't it."
              - id: l2-f5
                type: true_false
                text: "Is it true? \"If she were taller, she could reach the shelf\" uses the subjunctive."
                answer: true
                hints:
                  - "Look at the verb after if."
                  - "She were, not she was."
                  - "Yes, it uses the subjunctive."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Choose the question tag.\n\nHe can't swim, _?"
                say: "Choose the question tag. He can't swim, ...?"
                options: ["can he", "can't he", "does he"]
                answer: "can he"
                hints: ["A negative statement takes a positive tag with the same verb."]
              - id: l2-s2
                type: multiple_choice
                text: "Which sentence fits a formal report?"
                options: ["The results were surprising.", "The results were mad, weren't they?", "Guess what? The results were surprising!"]
                answer: "The results were surprising."
                option_audio: false
                hints: ["No tags, no chat."]
              - id: l2-s3
                type: multiple_choice
                text: "Choose the formal verb.\n\nIf he _ here, he would know what to do."
                say: "Choose the formal verb. If he ... here, he would know what to do."
                options: ["were", "was", "is"]
                answer: "were"
                hints: ["An imagined situation after if."]
              - id: l2-s4
                type: sorting
                text: "Sort the sentences."
                say: "Is each sentence formal or informal?"
                option_audio: false
                bins:
                  - { id: formal, show: { text: "formal" }, say: "Formal." }
                  - { id: informal, show: { text: "informal" }, say: "Informal." }
                options:
                  - { text: "If I were you, I would apologise.", bin: formal }
                  - { text: "It's freezing, isn't it?", bin: informal }
                  - { text: "We insist that he be informed.", bin: formal }
                  - { text: "You're joking, aren't you?", bin: informal }
                hints: ["Tags are informal; the subjunctive is formal."]
              - id: l2-s5
                type: true_false
                text: "Is it true? Question tags are a good choice in a formal speech to the school governors."
                answer: false
                hints: ["Do tags sound chatty or formal?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Choose the question tag.\n\nThey have finished, _?"
                say: "Choose the question tag. They have finished, ...?"
                options: ["haven't they", "have they", "didn't they"]
                answer: "haven't they"
              - id: l2-n2
                type: multiple_choice
                text: "Which sentence is the most formal?"
                options: ["It is vital that the gate be closed.", "Shut the gate, will you?", "Don't leave the gate open, yeah?"]
                answer: "It is vital that the gate be closed."
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Choose the formal verb."
                say: "Choose the formal verb."
                frame: "If I _ in charge, I would plant more trees."
                options: ["were", "was", "be"]
                answer: ["were"]
              - id: l2-n4
                type: highlight_in_text
                text: "Tap the question tag."
                show: { drawn: letter-card, text: "Mum hasn't seen my bag, has she?" }
                spans: ["has", "she"]
              - id: l2-n5
                type: true_false
                text: "Is it true? \"If I was rich, I'd buy a boat\" is the formal way to say it."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: vocabulary
            type: multiple_choice
            text: "Which is the formal word for \"lots of\"?"
            options: ["many", "loads", "tons"]
            answer: "many"
          - id: l2-c2
            part: vocabulary
            type: fill_in_blank
            text: "Change the contraction into its full form."
            say: "Change the contraction into its full form."
            frame: "We _ accept late entries. (can't)"
            options: ["cannot", "cant", "can'ot"]
            answer: ["cannot"]
            option_audio: false
          - id: l2-c3
            part: tags
            type: multiple_choice
            text: "Choose the question tag.\n\nShe was late again, _?"
            say: "Choose the question tag. She was late again, ...?"
            options: ["wasn't she", "was she", "isn't she"]
            answer: "wasn't she"
          - id: l2-c4
            part: subjunctive
            type: multiple_choice
            text: "Choose the formal verb.\n\nIf the weather _ better, the match would go ahead."
            say: "Choose the formal verb. If the weather ... better, the match would go ahead."
            options: ["were", "was", "is"]
            answer: "were"
          - id: l2-c5
            part: choose-register
            type: multiple_choice
            text: "Which sentence fits a formal letter to a museum?"
            options: ["We would like to request a guided tour.", "Can we get a tour, please?", "A tour would be cool, wouldn't it?"]
            answer: "We would like to request a guided tour."
            option_audio: false
          - id: l2-c6
            part: vocabulary
            type: multiple_choice
            text: "Which sentence uses the formal word for \"get\"?"
            options: ["You will receive a letter next week.", "You will get a letter next week.", "You'll grab a letter next week."]
            answer: "You will receive a letter next week."
            option_audio: false
          - id: l2-c7
            part: vocabulary
            type: text_input
            text: "Write the formal word for \"find out\".\n\nScientists hope to _ how the comet formed."
            say: "Write the formal word for find out. Scientists hope to ... how the comet formed."
            keyboard: letters
            answer: "discover"
          - id: l2-c8
            part: vocabulary
            type: fill_in_blank
            text: "Change the contraction into its full form."
            say: "Change the contraction into its full form."
            frame: "Pupils _ bring mobile phones to school. (mustn't)"
            options: ["must not", "mustnt", "must'nt"]
            answer: ["must not"]
            option_audio: false
          - id: l2-c9
            part: tags
            type: multiple_choice
            text: "Choose the question tag.\n\nWe don't have maths today, _?"
            say: "Choose the question tag. We don't have maths today, ...?"
            options: ["do we", "don't we", "have we"]
            answer: "do we"
          - id: l2-c10
            part: tags
            type: highlight_in_text
            text: "Tap the question tag."
            show: { drawn: letter-card, text: "Sam will write to us, won't he?" }
            spans: ["won't", "he"]
          - id: l2-c11
            part: tags
            type: true_false
            text: "Is it true? \"Ben likes football, doesn't he?\" has the right question tag."
            answer: true
          - id: l2-c12
            part: tags
            type: multiple_choice
            text: "Choose the question tag.\n\nThe bus will be late, _?"
            say: "Choose the question tag. The bus will be late, ...?"
            options: ["won't it", "will it", "isn't it"]
            answer: "won't it"
          - id: l2-c13
            part: subjunctive
            type: highlight_in_text
            text: "This sentence is for a formal speech. Tap the verb that should be in the subjunctive."
            show: { drawn: letter-card, text: "If Tom was the head teacher, he would shorten the school day." }
            spans: ["was"]
          - id: l2-c14
            part: subjunctive
            type: multiple_choice
            text: "Choose the formal verb.\n\nThe coach insists that every player _ on time."
            say: "Choose the formal verb. The coach insists that every player ... on time."
            options: ["be", "is", "are"]
            answer: "be"
          - id: l2-c15
            part: subjunctive
            type: multiple_choice
            text: "Which sentence uses the subjunctive?"
            options: ["If he were older, he could drive.", "He was older than his cousin.", "If he is older, he can drive."]
            answer: "If he were older, he could drive."
            option_audio: false
          - id: l2-c16
            part: subjunctive
            type: text_input
            text: "Write the formal verb.\n\nIf I (was or were) an astronaut, I would visit Mars."
            keyboard: letters
            answer: "were"
          - id: l2-c17
            part: choose-register
            type: sorting
            text: "Sort the sentences about the swimming pool."
            say: "Sort the sentences about the swimming pool. Is each one formal or informal?"
            option_audio: false
            bins:
              - { id: formal, show: { text: "formal" }, say: "Formal." }
              - { id: informal, show: { text: "informal" }, say: "Informal." }
            options:
              - { text: "We regret that the pool is closed.", bin: formal }
              - { text: "Pool's shut, sorry!", bin: informal }
              - { text: "Please contact us with any questions.", bin: formal }
              - { text: "Give us a shout if you need anything.", bin: informal }
          - id: l2-c18
            part: choose-register
            type: multiple_choice
            text: "Which sentence fits a speech to the school governors?"
            options: ["I would like to thank you for your support this year.", "Thanks loads for being so cool this year!", "You've been great, haven't you?"]
            answer: "I would like to thank you for your support this year."
            option_audio: false
          - id: l2-c19
            part: choose-register
            type: multiple_choice
            text: "Which sentence fits a text message to your best friend?"
            options: ["See you at the park later, OK?", "I would be grateful if you could meet me at the park.", "It is essential that you be at the park."]
            answer: "See you at the park later, OK?"
            option_audio: false
          - id: l2-c20
            part: choose-register
            type: multiple_choice
            text: "\"We're dead keen to visit your farm.\"\n\nWhich version fits a formal letter to the farmer?"
            options: ["We are very keen to visit your farm.", "We're well keen to visit your farm.", "We are dead keen to visit your farm."]
            answer: "We are very keen to visit your farm."
            option_audio: false
