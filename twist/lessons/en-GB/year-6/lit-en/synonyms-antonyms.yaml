# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.synonyms-antonyms
skill: lit-en.grammar.synonyms-antonyms
curriculum: en-GB
language: en
title:
  de: Synonyme und Antonyme
  en: Synonyms and antonyms
summary: >
  Synonyms are words with the same or a similar meaning (big, large);
  antonyms are words with opposite meanings (ancient, modern). A synonym
  or antonym is the same word class as the word it pairs with, and many
  antonyms are made with a prefix (happy, unhappy). Lesson 1 sorts and
  matches synonyms and antonyms; lesson 2 makes antonyms with prefixes,
  checks word class and shades of meaning, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-en.grammar.word-classes]
  also_practises: [lit-en.spelling.dictionary-thesaurus]
  vocabulary: { en: [synonym, antonym, opposite, similar, prefix, word class, adjective, verb] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: syn-ant, what: { de: Synonyme und Antonyme erkennen und finden, en: telling and finding synonyms and antonyms } }
    - { id: prefix, what: { de: "Antonyme mit einer Vorsilbe bilden (un, dis, im, in)", en: "making antonyms with a prefix (un, dis, im, in)" } }
    - { id: class-shade, what: { de: gleiche Wortart und Bedeutungsabstufungen, en: the same word class and shades of meaning } }
  misconceptions:
    - id: mixes-up-terms
      what: Mixes up the terms, calling opposites synonyms
      addressed: l1-f1, l1-f3, l1-s3, l1-n3 and l2-c1 sort pairs into synonyms and antonyms; feedback in l1-f1
    - id: related-not-opposite
      what: Picks a related word as the antonym instead of its opposite (hot and summer, rather than hot and cold)
      addressed: l1-f2, l1-s2, l1-n2 and l2-c2; feedback in l1-f2
    - id: wrong-word-class
      what: Gives a synonym from a different word class (quick and quickly)
      addressed: l2-f3, l2-s3, l2-n3 and l2-c4 check that the pair shares a word class
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gleich oder gegensätzlich?", en: "Same or opposite?" }
    goal:
      de: "Finde Wörter mit gleicher Bedeutung, wie big und large, und Wörter mit gegensätzlicher Bedeutung, wie ancient und modern."
      en: "Find synonyms, words that mean the same, like big and large, and antonyms, words that mean the opposite, like ancient and modern."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "\"The kitten jumped.\"\n\nWhat word class is \"jumped\"?"
            options: ["verb", "noun", "adjective"]
            answer: "verb"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Add a suffix to make an adjective.\n\nhope + _ = hopeful"
            options: ["ful", "ness", "ly"]
            answer: "ful"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Synonyms: big, large, huge\nbrave, courageous, bold"
            say: "Synonyms are words with the same or a similar meaning. Big, large and huge are synonyms."
          - text: "Antonyms: hot ↔ cold\nancient ↔ modern\narrive ↔ depart"
            say: "Antonyms are words with opposite meanings. Hot and cold, ancient and modern, arrive and depart."
          - text: "Not opposites: hot and summer, cold and snow"
            say: "Careful. Hot and summer go together, but they are not opposites. An antonym means the exact opposite."
          - text: "Synonym: same. Antonym: anti, against."
            say: "A trick to remember: synonym starts with s, like same. Antonym starts with ant, like anti, which means against."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "\"Ancient\" and \"modern\" are ..."
                options: ["antonyms", "synonyms"]
                answer: "antonyms"
                feedback:
                  "synonyms": "Synonyms mean the same. Ancient means very old and modern means new, so they are opposites: antonyms."
                hints:
                  - "Do they mean the same, or the opposite?"
                  - "Ancient is very old; modern is new."
                  - "Antonyms."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which word is an antonym of \"wet\"?"
                options: ["dry", "rain", "damp"]
                answer: "dry"
                feedback:
                  "rain": "Rain goes with wet, but it is not the opposite. The opposite of wet is dry."
                hints:
                  - "An antonym is the exact opposite."
                  - "What is a towel after it has been in the sun?"
                  - "Dry."
              - id: l1-f3
                type: sorting
                text: "Sort the pairs."
                say: "Is each pair synonyms or antonyms?"
                option_audio: false
                bins:
                  - { id: syn, show: { text: "synonyms" }, say: "Synonyms." }
                  - { id: ant, show: { text: "antonyms" }, say: "Antonyms." }
                options:
                  - { text: "begin, start", bin: syn }
                  - { text: "begin, finish", bin: ant }
                  - { text: "brave, bold", bin: syn }
                  - { text: "brave, cowardly", bin: ant }
                hints:
                  - "Same meaning, or opposite?"
                  - "Start means the same as begin."
                  - "Begin and start, brave and bold: synonyms. Begin and finish, brave and cowardly: antonyms."
              - id: l1-f4
                type: matching
                text: "Match each word to its synonym."
                pairs:
                  - { left: { text: "tiny" }, right: { text: "minute" } }
                  - { left: { text: "angry" }, right: { text: "furious" } }
                  - { left: { text: "quick" }, right: { text: "rapid" } }
                hints:
                  - "Which words mean nearly the same?"
                  - "Minute, said my-newt, means very small."
                  - "tiny and minute, angry and furious, quick and rapid."
              - id: l1-f5
                type: multiple_choice
                text: "Which word is a synonym of \"glad\"?"
                options: ["pleased", "sad", "gloomy"]
                answer: "pleased"
                hints:
                  - "A synonym means the same."
                  - "Glad means happy."
                  - "Pleased."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "\"Arrive\" and \"depart\" are ..."
                options: ["antonyms", "synonyms"]
                answer: "antonyms"
                hints: ["Coming and going."]
              - id: l1-s2
                type: multiple_choice
                text: "Which word is an antonym of \"generous\"?"
                options: ["mean", "gift", "kind"]
                answer: "mean"
                hints: ["Someone who will not share."]
              - id: l1-s3
                type: sorting
                text: "Sort the pairs."
                say: "Is each pair synonyms or antonyms?"
                option_audio: false
                bins:
                  - { id: syn, show: { text: "synonyms" }, say: "Synonyms." }
                  - { id: ant, show: { text: "antonyms" }, say: "Antonyms." }
                options:
                  - { text: "huge, enormous", bin: syn }
                  - { text: "huge, tiny", bin: ant }
                  - { text: "shout, yell", bin: syn }
                  - { text: "shout, whisper", bin: ant }
                hints: ["Same, or opposite?"]
              - id: l1-s4
                type: matching
                text: "Match each word to its antonym."
                pairs:
                  - { left: { text: "loud" }, right: { text: "quiet" } }
                  - { left: { text: "float" }, right: { text: "sink" } }
                  - { left: { text: "victory" }, right: { text: "defeat" } }
                hints: ["Find the opposite of each."]
              - id: l1-s5
                type: multiple_choice
                text: "Which word is a synonym of \"scared\"?"
                options: ["frightened", "brave", "calm"]
                answer: "frightened"
                hints: ["Same meaning."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "\"Courageous\" and \"brave\" are ..."
                options: ["synonyms", "antonyms"]
                answer: "synonyms"
              - id: l1-n2
                type: multiple_choice
                text: "Which word is an antonym of \"ancient\"?"
                options: ["modern", "old", "history"]
                answer: "modern"
              - id: l1-n3
                type: sorting
                text: "Sort the pairs."
                say: "Is each pair synonyms or antonyms?"
                option_audio: false
                bins:
                  - { id: syn, show: { text: "synonyms" }, say: "Synonyms." }
                  - { id: ant, show: { text: "antonyms" }, say: "Antonyms." }
                options:
                  - { text: "permit, allow", bin: syn }
                  - { text: "permit, forbid", bin: ant }
                  - { text: "wealthy, rich", bin: syn }
                  - { text: "wealthy, poor", bin: ant }
              - id: l1-n4
                type: matching
                text: "Match each word to its antonym."
                pairs:
                  - { left: { text: "accept" }, right: { text: "refuse" } }
                  - { left: { text: "include" }, right: { text: "exclude" } }
                  - { left: { text: "rough" }, right: { text: "smooth" } }
              - id: l1-n5
                type: true_false
                text: "Is it true? \"Snow\" is an antonym of \"cold\"."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which word is an antonym of \"strong\"?"
            options: ["weak", "muscle", "powerful"]
            answer: "weak"
          - id: l1-c2
            type: multiple_choice
            text: "Which word is a synonym of \"shut\"?"
            options: ["close", "open", "door"]
            answer: "close"
          - id: l1-c3
            type: multiple_choice
            text: "\"Win\" and \"lose\" are ..."
            options: ["antonyms", "synonyms"]
            answer: "antonyms"
          - id: l1-c4
            type: true_false
            text: "Is it true? \"Rude\" and \"polite\" are synonyms."
            answer: false
          - id: l1-c5
            type: matching
            text: "Match each word to its synonym."
            pairs:
              - { left: { text: "difficult" }, right: { text: "hard" } }
              - { left: { text: "gloomy" }, right: { text: "dark" } }
              - { left: { text: "chuckle" }, right: { text: "laugh" } }
          - id: l1-c6
            type: true_false
            text: "Is it true? \"Ancient\" and \"old\" are synonyms."
            answer: true

  - n: 2
    title: { de: Vorsilben und Wortarten, en: Prefixes and word classes }
    goal:
      de: "Bilde Gegenteile mit einer Vorsilbe, wie impossible aus possible, und achte darauf, dass beide Wörter zur selben Wortart gehören."
      en: "Make antonyms with a prefix, like possible and impossible, and check that both words in a pair are the same word class."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which word is an antonym of \"float\"?"
            options: ["sink", "swim", "boat"]
            answer: "sink"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "\"Rapid\" and \"quick\" are ..."
            options: ["synonyms", "antonyms"]
            answer: "synonyms"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "happy → unhappy\nagree → disagree\npossible → impossible\ncorrect → incorrect"
            say: "Many antonyms are made by adding a prefix: un, dis, im or in. Unhappy is the antonym of happy."
          - text: "polite → impolite\npatient → impatient"
            say: "Im usually goes before words that start with p or m: impossible, impolite, impatient, immature."
          - text: "quick (adjective) → rapid (adjective)\nquickly (adverb) → rapidly (adverb)"
            say: "A synonym or antonym is the same word class as its partner. Quick and rapid are both adjectives. Quickly and rapidly are both adverbs. Quick and rapidly are not a pair."
          - text: "warm, hot, scorching\ncool, cold, freezing"
            say: "Synonyms can have shades of meaning, from mild to strong. Scorching is much hotter than warm."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which prefix makes the antonym of \"honest\"?"
                options: ["dis", "un", "im"]
                answer: "dis"
                hints:
                  - "Try each one aloud."
                  - "Which sounds right: dishonest, unhonest, imhonest?"
                  - "Dis."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Write the antonym of \"possible\" with a prefix."
                keyboard: letters
                answer: "impossible"
                hints:
                  - "Possible starts with p."
                  - "Before p, use im."
                  - "Impossible."
              - id: l2-f3
                type: multiple_choice
                text: "Which word is a synonym of \"silently\"?"
                options: ["quietly", "quiet", "noisy"]
                answer: "quietly"
                hints:
                  - "Silently is an adverb ending in ly."
                  - "The synonym must be an adverb too."
                  - "Quietly."
              - id: l2-f4
                type: ordering
                text: "Put the synonyms in order, from mild to strong."
                options: ["furious", "cross", "angry"]
                slot_count: 3
                answer: ["cross", "angry", "furious"]
                hints:
                  - "Which is only a little angry?"
                  - "Furious is the strongest."
                  - "cross, angry, furious."
              - id: l2-f5
                type: matching
                text: "Match each word to its antonym."
                pairs:
                  - { left: { text: "visible" }, right: { text: "invisible" } }
                  - { left: { text: "appear" }, right: { text: "disappear" } }
                  - { left: { text: "kind" }, right: { text: "unkind" } }
                  - { left: { text: "patient" }, right: { text: "impatient" } }
                hints:
                  - "Each antonym has a prefix."
                  - "in, dis, un and im."
                  - "invisible, disappear, unkind, impatient."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which prefix makes the antonym of \"fair\"?"
                options: ["un", "dis", "im"]
                answer: "un"
                hints: ["Try each aloud."]
              - id: l2-s2
                type: text_input
                text: "Write the antonym of \"polite\" with a prefix."
                keyboard: letters
                answer: "impolite"
                hints: ["Polite starts with p."]
              - id: l2-s3
                type: multiple_choice
                text: "Which word is a synonym of \"enormous\"?"
                options: ["gigantic", "enormously", "tiny"]
                answer: "gigantic"
                hints: ["It must be an adjective too."]
              - id: l2-s4
                type: ordering
                text: "Put the synonyms in order, from mild to strong."
                options: ["terrified", "nervous", "scared"]
                slot_count: 3
                answer: ["nervous", "scared", "terrified"]
                hints: ["Terrified is the strongest."]
              - id: l2-s5
                type: true_false
                text: "Is it true? \"Unlock\" is the antonym of \"lock\"."
                answer: true
                hints: ["Does un make the opposite?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which prefix makes the antonym of \"obey\"?"
                options: ["dis", "un", "in"]
                answer: "dis"
              - id: l2-n2
                type: text_input
                text: "Write the antonym of \"correct\" with a prefix."
                keyboard: letters
                answer: "incorrect"
              - id: l2-n3
                type: multiple_choice
                text: "Which word is a synonym of \"carefully\"?"
                options: ["cautiously", "careful", "carelessly"]
                answer: "cautiously"
              - id: l2-n4
                type: ordering
                text: "Put the synonyms in order, from mild to strong."
                options: ["delighted", "pleased", "ecstatic"]
                slot_count: 3
                answer: ["pleased", "delighted", "ecstatic"]
              - id: l2-n5
                type: true_false
                text: "Is it true? \"Happy\" and \"happily\" are synonyms."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: syn-ant
            type: sorting
            text: "Sort these word pairs into synonyms and antonyms."
            say: "Put each word pair in the right group."
            option_audio: false
            bins:
              - { id: syn, show: { text: "synonyms" }, say: "Synonyms." }
              - { id: ant, show: { text: "antonyms" }, say: "Antonyms." }
            options:
              - { text: "calm, peaceful", bin: syn }
              - { text: "calm, stormy", bin: ant }
              - { text: "ask, enquire", bin: syn }
              - { text: "ask, answer", bin: ant }
          - id: l2-c2
            part: syn-ant
            type: multiple_choice
            text: "Which word is an antonym of \"expand\"?"
            options: ["shrink", "balloon", "grow"]
            answer: "shrink"
          - id: l2-c3
            part: prefix
            type: text_input
            text: "Write the antonym of \"agree\" with a prefix."
            keyboard: letters
            answer: "disagree"
          - id: l2-c4
            part: class-shade
            type: multiple_choice
            text: "Which word is a synonym of \"swiftly\"?"
            options: ["rapidly", "rapid", "slowly"]
            answer: "rapidly"
          - id: l2-c5
            part: class-shade
            type: ordering
            text: "Put the synonyms in order, from mild to strong."
            options: ["boiling", "hot", "warm"]
            slot_count: 3
            answer: ["warm", "hot", "boiling"]
          - id: l2-c6
            part: syn-ant
            type: multiple_choice
            text: "Which word is a synonym of \"fragile\"?"
            options: ["delicate", "strong", "glass"]
            answer: "delicate"
          - id: l2-c7
            part: syn-ant
            type: multiple_choice
            text: "Which word is an antonym of \"shallow\"?"
            options: ["deep", "puddle", "narrow"]
            answer: "deep"
          - id: l2-c8
            part: syn-ant
            type: true_false
            text: "Is it true? \"Vanish\" and \"disappear\" are synonyms."
            answer: true
          - id: l2-c9
            part: syn-ant
            type: matching
            text: "Match each word to its opposite."
            pairs:
              - { left: { text: "maximum" }, right: { text: "minimum" } }
              - { left: { text: "temporary" }, right: { text: "permanent" } }
              - { left: { text: "export" }, right: { text: "import" } }
          - id: l2-c10
            part: syn-ant
            type: highlight_in_text
            text: "Tap the two words in the sentence that are antonyms."
            show: { drawn: letter-card, text: "The old dog and the young puppy played together." }
            spans: ["old", "young"]
          - id: l2-c11
            part: prefix
            type: multiple_choice
            text: "Which prefix makes the antonym of \"perfect\"?"
            options: ["im", "un", "dis"]
            answer: "im"
          - id: l2-c12
            part: prefix
            type: text_input
            text: "Write the antonym of \"complete\" with a prefix."
            keyboard: letters
            answer: "incomplete"
          - id: l2-c13
            part: prefix
            type: text_input
            text: "Write the antonym of \"tidy\" with a prefix."
            keyboard: letters
            answer: "untidy"
          - id: l2-c14
            part: prefix
            type: true_false
            text: "Is it true? \"Unpatient\" is the antonym of \"patient\"."
            answer: false
          - id: l2-c15
            part: prefix
            type: sorting
            text: "Sort the words by the prefix that makes their antonym."
            say: "Which prefix makes the antonym of each word: un, dis or im?"
            option_audio: false
            bins:
              - { id: un, show: { text: "un" }, say: "un" }
              - { id: dis, show: { text: "dis" }, say: "dis" }
              - { id: im, show: { text: "im" }, say: "im" }
            options:
              - { text: "lucky", bin: un }
              - { text: "able", bin: un }
              - { text: "connect", bin: dis }
              - { text: "approve", bin: dis }
              - { text: "mature", bin: im }
              - { text: "proper", bin: im }
          - id: l2-c16
            part: class-shade
            type: multiple_choice
            text: "Which word is a synonym of \"happily\"?"
            options: ["cheerfully", "cheerful", "sadly"]
            answer: "cheerfully"
          - id: l2-c17
            part: class-shade
            type: multiple_choice
            text: "Which word means nearly the same as \"brave\" and is the same word class?"
            options: ["courageous", "courageously", "courage"]
            answer: "courageous"
          - id: l2-c18
            part: class-shade
            type: ordering
            text: "Put the synonyms in order, from mild to strong."
            options: ["adore", "like", "love"]
            slot_count: 3
            answer: ["like", "love", "adore"]
          - id: l2-c19
            part: class-shade
            type: multiple_choice
            text: "Which pair are synonyms of the same word class?"
            options: ["silent, quiet", "silent, quietly", "silence, quiet"]
            answer: "silent, quiet"
            option_audio: false
          - id: l2-c20
            part: class-shade
            type: multiple_choice
            text: "The desert sand was so hot that it burnt our feet.\n\nWhich synonym of \"hot\" fits best?\n\nThe sand was _."
            say: "The desert sand was so hot that it burnt our feet. Which synonym of hot fits best? The sand was ..."
            options: ["scorching", "warm", "cosy"]
            answer: "scorching"
