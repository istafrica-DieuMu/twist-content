# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.compare-books
skill: lit-en.comprehension.compare-books
curriculum: en-GB
language: en
title:
  de: Bücher und Figuren vergleichen
  en: Comparing books and characters
summary: >
  Comparing means saying how things are alike and how they differ, with
  words such as both, similarly, whereas and unlike. Lesson 1 compares two
  characters within one short story; lesson 2 compares the themes and
  characters of two short stories, and ends with the skill check. All
  passages are written for Twist.
metadata:
  year: year-6
  topic: { de: Wie Texte wirken, en: How texts work }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [lit-en.texts.themes-conventions]
  also_practises: [lit-en.comprehension.justify-views]
  vocabulary: { en: [compare, contrast, similarity, difference, theme, both, whereas, similarly, unlike, however] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: only-differences
      what: Lists only differences (or only similarities) when asked to compare
      addressed: l1-f3, l1-s3, l1-n3 and l2-f3 sort similarities and differences; Learn screen 1
    - id: plot-for-theme
      what: Names a plot detail (they go to the beach) instead of the theme the books share (friendship)
      addressed: l2-f1, l2-s1, l2-n1 and l2-c3 offer a plot detail as a distractor; feedback in l2-f1
    - id: wrong-comparison-word
      what: Uses a word for a similarity (similarly) to introduce a difference
      addressed: l1-f4, l1-s4, l1-n4 and l2-c4 choose the linking word; feedback in l1-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Zwei Figuren in einem Buch, en: Two characters in one book }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "A girl and a fox help each other to escape a hunter, and become friends for life.\n\nWhat is the theme?"
            options: ["friendship", "hunting", "foxes"]
            answer: "friendship"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "The hero leaves home, faces a great danger and returns changed.\n\nWhat is this story pattern called?"
            options: ["the hero's journey", "a happy ending", "a fable"]
            answer: "the hero's journey"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Compare: say how they are alike AND how they differ."
            say: "When you compare characters or books, you look for similarities, how they are alike, and differences, how they are not. A good comparison has both."
          - text: "Twins Nell and Jack both live at the lighthouse. Nell climbs the cliffs without a second thought, whereas Jack checks every rope twice. When the storm comes, Jack's careful knots save the boat."
            say: "Listen to this short story about twins. Nell and Jack both live at the lighthouse: a similarity. Nell is daring, whereas Jack is careful: a difference."
          - text: "Similarity: both, also, similarly, like\nDifference: whereas, however, unlike, but"
            say: "These words show your comparison. Both and similarly show something alike. Whereas, however and unlike show a difference."
          - text: "Nell is brave, whereas Jack is careful. However, by the end, both of them are heroes."
            say: "A comparison backs each point with the text. Nell climbs without a second thought; Jack checks every rope twice."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Nell climbs the cliffs without a second thought, whereas Jack checks every rope twice.\n\nHow are Nell and Jack different?"
                options: ["Nell is daring; Jack is careful.", "Nell is careful; Jack is daring.", "They both love climbing."]
                answer: "Nell is daring; Jack is careful."
                option_audio: false
                hints:
                  - "What does each twin do?"
                  - "Who climbs without thinking? Who checks twice?"
                  - "Nell is daring; Jack is careful."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Twins Nell and Jack both live at the lighthouse. Both of them love their grandad's stories.\n\nWhat is one similarity?"
                options: ["They both love Grandad's stories.", "Nell is braver than Jack.", "Jack ties knots."]
                answer: "They both love Grandad's stories."
                option_audio: false
                hints:
                  - "A similarity is something they share."
                  - "Look for the word both."
                  - "They both love Grandad's stories."
              - id: l1-f3
                type: sorting
                text: "Sort the sentences about Nell and Jack."
                say: "Is each sentence a similarity or a difference?"
                option_audio: false
                bins:
                  - { id: same, show: { text: "similarity" }, say: "Similarity." }
                  - { id: diff, show: { text: "difference" }, say: "Difference." }
                options:
                  - { text: "Both live at the lighthouse.", bin: same }
                  - { text: "Nell rushes in, but Jack plans.", bin: diff }
                  - { text: "Both are twelve.", bin: same }
                  - { text: "Unlike Jack, Nell hates knots.", bin: diff }
                hints:
                  - "Both shows something alike."
                  - "But and unlike show a difference."
                  - "Lighthouse and twelve: similarity. Rushes and knots: difference."
              - id: l1-f4
                type: multiple_choice
                text: "Choose the word.\n\nNell loves noise and adventure, _ Jack prefers a quiet book."
                say: "Choose the word. Nell loves noise and adventure, ... Jack prefers a quiet book."
                options: ["whereas", "similarly", "both"]
                answer: "whereas"
                feedback:
                  "similarly": "Similarly shows the two are alike. Here they are different, so you need whereas."
                hints:
                  - "Are the twins alike or different here?"
                  - "Different. Which word shows a difference?"
                  - "Whereas."
              - id: l1-f5
                type: multiple_choice
                text: "When the storm comes, Jack's careful knots save the boat.\n\nWhat does this show about Jack, compared with the start?"
                options: ["His carefulness, which seemed slow, turns out to be a strength.", "He has become as daring as Nell.", "He is scared of the storm."]
                answer: "His carefulness, which seemed slow, turns out to be a strength."
                option_audio: false
                hints:
                  - "At the start, Jack checks every rope twice."
                  - "What do his knots do in the storm?"
                  - "His carefulness turns out to be a strength."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "In \"The Bakery\", Mr Hart shouts at customers. His daughter Rosa greets everyone with a smile.\n\nHow are they different?"
                options: ["Mr Hart is grumpy; Rosa is friendly.", "Mr Hart is friendly; Rosa is grumpy.", "They both shout."]
                answer: "Mr Hart is grumpy; Rosa is friendly."
                option_audio: false
                hints: ["What does each one do with customers?"]
              - id: l1-s2
                type: multiple_choice
                text: "Mr Hart and Rosa both get up at 4 am to bake. Both make the best bread in town.\n\nWhat is one similarity?"
                options: ["They both work hard.", "Rosa smiles more.", "Mr Hart shouts."]
                answer: "They both work hard."
                option_audio: false
                hints: ["Look for both."]
              - id: l1-s3
                type: sorting
                text: "Sort the sentences about Mr Hart and Rosa."
                say: "Is each sentence a similarity or a difference?"
                option_audio: false
                bins:
                  - { id: same, show: { text: "similarity" }, say: "Similarity." }
                  - { id: diff, show: { text: "difference" }, say: "Difference." }
                options:
                  - { text: "Both love baking.", bin: same }
                  - { text: "Rosa smiles, whereas her dad frowns.", bin: diff }
                  - { text: "Both get up early.", bin: same }
                  - { text: "Unlike Rosa, Mr Hart shouts.", bin: diff }
                hints: ["Both, or whereas and unlike?"]
              - id: l1-s4
                type: multiple_choice
                text: "Choose the word.\n\nMr Hart loves baking bread. _, Rosa loves baking cakes."
                say: "Choose the word. Mr Hart loves baking bread. ... Rosa loves baking cakes."
                options: ["Similarly", "Unlike", "Whereas"]
                answer: "Similarly"
                hints: ["Are they alike here?"]
              - id: l1-s5
                type: true_false
                text: "Is it true? A good comparison only lists the differences."
                answer: false
                hints: ["Compare means alike and different."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "In \"Space Camp\", Dev reads every manual. His friend Ava presses every button to see what happens.\n\nHow are they different?"
                options: ["Dev is cautious; Ava is curious and bold.", "Ava is cautious; Dev is bold.", "They both read manuals."]
                answer: "Dev is cautious; Ava is curious and bold."
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Dev and Ava both want to be astronauts. Both win a place at Space Camp.\n\nWhat is one similarity?"
                options: ["They share the same dream.", "Ava presses buttons.", "Dev reads manuals."]
                answer: "They share the same dream."
                option_audio: false
              - id: l1-n3
                type: sorting
                text: "Sort the sentences about Dev and Ava."
                say: "Is each sentence a similarity or a difference?"
                option_audio: false
                bins:
                  - { id: same, show: { text: "similarity" }, say: "Similarity." }
                  - { id: diff, show: { text: "difference" }, say: "Difference." }
                options:
                  - { text: "Both want to go to space.", bin: same }
                  - { text: "Dev plans, but Ava experiments.", bin: diff }
                  - { text: "Both are at Space Camp.", bin: same }
                  - { text: "Unlike Ava, Dev reads manuals.", bin: diff }
              - id: l1-n4
                type: multiple_choice
                text: "Choose the word.\n\n_ Ava, Dev never touches a button without reading about it first."
                say: "Choose the word. ... Ava, Dev never touches a button without reading about it first."
                options: ["Unlike", "Both", "Similarly"]
                answer: "Unlike"
              - id: l1-n5
                type: multiple_choice
                text: "Which sentence is the best comparison of Dev and Ava?"
                options: ["Both dream of space, but Dev plans every step, whereas Ava learns by trying.", "Dev reads manuals.", "Ava is nice."]
                answer: "Both dream of space, but Dev plans every step, whereas Ava learns by trying."
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Choose the word.\n\nMia is shy, _ her sister is loud and chatty."
            say: "Choose the word. Mia is shy, ... her sister is loud and chatty."
            options: ["whereas", "similarly", "also"]
            answer: "whereas"
          - id: l1-c2
            type: multiple_choice
            text: "Both Tom and Raj love football. Tom is the captain, but Raj is the goalkeeper.\n\nWhat is one similarity?"
            options: ["They both love football.", "Tom is the captain.", "Raj is the goalkeeper."]
            answer: "They both love football."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? \"However\" is a word that shows a difference."
            answer: true

  - n: 2
    title: { de: Zwei Bücher vergleichen, en: Comparing two books }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Choose the word.\n\nAnna loves reading. _, her brother reads every night."
            say: "Choose the word. Anna loves reading. ... her brother reads every night."
            options: ["Similarly", "Whereas", "Unlike"]
            answer: "Similarly"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? A comparison should say how things are alike and how they differ."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Book A, \"The Last Bus\": Amir is new at school. Nobody talks to him until Lily shares her umbrella at the bus stop.\nBook B, \"Iceberg\": A polar bear cub drifts away on the ice and is lonely until a seal pup swims beside it."
            say: "Here are two short books. Read them both."
            show: { objects: [umbrella, bear] }
          - text: "Both books: the theme of friendship and loneliness.\nDifferent: one is set in a town, the other in the Arctic; one has people, the other animals."
            say: "Across books, look first at the big ideas, the themes. Both books are about being lonely and finding a friend. Then look at what is different: setting, characters and how the story is told."
          - text: "Both stories show that a small kind act can end loneliness. However, Amir finds a friend in a busy town, whereas the cub finds one in an empty, frozen sea."
            say: "A comparison across books says what they share and how they differ, and gives an example from each."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Book A: Amir is new and lonely until Lily shares her umbrella.\nBook B: A lonely bear cub finds a friend in a seal pup.\n\nWhat theme do both books share?"
                options: ["friendship ending loneliness", "umbrellas", "polar bears"]
                answer: "friendship ending loneliness"
                feedback:
                  "umbrellas": "The umbrella is a detail in one book. A theme is a big idea both books share."
                hints:
                  - "A theme is a big idea, not a detail."
                  - "How do Amir and the cub feel at first, and what changes?"
                  - "Friendship ending loneliness."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Book A is set in a busy town. Book B is set on the frozen Arctic sea.\n\nWhich sentence compares the settings?"
                options: ["Book A is set in a busy town, whereas Book B is set in an empty, icy sea.", "Both books are set in a town.", "Book B has a seal."]
                answer: "Book A is set in a busy town, whereas Book B is set in an empty, icy sea."
                option_audio: false
                hints:
                  - "Name both settings."
                  - "Join them with a word for a difference."
                  - "The sentence with whereas."
              - id: l2-f3
                type: sorting
                text: "Sort the sentences about the two books."
                say: "Is each sentence a similarity or a difference between the books?"
                option_audio: false
                bins:
                  - { id: same, show: { text: "similarity" }, say: "Similarity." }
                  - { id: diff, show: { text: "difference" }, say: "Difference." }
                options:
                  - { text: "Both main characters feel lonely.", bin: same }
                  - { text: "Book A has people; Book B has animals.", bin: diff }
                  - { text: "Both end with a new friend.", bin: same }
                  - { text: "One is set in a town, the other in the Arctic.", bin: diff }
                hints:
                  - "Is it true of both books?"
                  - "Feelings and endings are shared."
                  - "Lonely and new friend: similarity. People or animals, town or Arctic: difference."
              - id: l2-f4
                type: multiple_choice
                text: "Which evidence from Book B matches \"Lily shares her umbrella\" in Book A?"
                options: ["The seal pup swims beside the cub.", "The ice is cold.", "The cub drifts away."]
                answer: "The seal pup swims beside the cub."
                option_audio: false
                hints:
                  - "Lily's umbrella is a small kind act."
                  - "Which act in Book B is kind?"
                  - "The seal pup swims beside the cub."
              - id: l2-f5
                type: true_false
                text: "Is it true? Two books can share a theme even if one is about people and the other is about animals."
                answer: true
                hints:
                  - "Is a theme about the characters or the big idea?"
                  - "Think of friendship in both books."
                  - "Yes, they can."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Book A: A boy lies about breaking a vase, and the lie grows until he owns up.\nBook B: A girl pretends she can swim, and nearly drowns before she tells the truth.\n\nWhat theme do both books share?"
                options: ["honesty", "vases", "swimming"]
                answer: "honesty"
                hints: ["What do both characters learn?"]
              - id: l2-s2
                type: multiple_choice
                text: "In Book A, the boy is found out by his mum. In Book B, the girl owns up herself.\n\nWhich sentence compares them?"
                options: ["The boy is found out, whereas the girl chooses to tell the truth.", "Both are found out by their mums.", "The girl swims."]
                answer: "The boy is found out, whereas the girl chooses to tell the truth."
                option_audio: false
                hints: ["Name both, and use a difference word."]
              - id: l2-s3
                type: sorting
                text: "Sort the sentences about the two books."
                say: "Is each sentence a similarity or a difference between the books?"
                option_audio: false
                bins:
                  - { id: same, show: { text: "similarity" }, say: "Similarity." }
                  - { id: diff, show: { text: "difference" }, say: "Difference." }
                options:
                  - { text: "Both characters tell a lie.", bin: same }
                  - { text: "One lie is about a vase, the other about swimming.", bin: diff }
                  - { text: "Both learn that lies grow.", bin: same }
                  - { text: "One is caught, the other owns up.", bin: diff }
                hints: ["Is it true of both books?"]
              - id: l2-s4
                type: multiple_choice
                text: "Choose the word.\n\n_ books show that a lie gets bigger the longer you keep it."
                say: "Choose the word. ... books show that a lie gets bigger the longer you keep it."
                options: ["Both", "Unlike", "Whereas"]
                answer: "Both"
                hints: ["It is a similarity."]
              - id: l2-s5
                type: true_false
                text: "Is it true? \"The boy breaks a vase\" is a theme of Book A."
                answer: false
                hints: ["Is it a big idea or a plot detail?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Book A: A knight fights a dragon to save his village.\nBook B: A girl stands up to a bully to protect her little brother.\n\nWhat theme do both books share?"
                options: ["courage to protect others", "dragons", "school"]
                answer: "courage to protect others"
              - id: l2-n2
                type: multiple_choice
                text: "Book A is set long ago, with swords. Book B is set in a school today.\n\nWhich sentence compares the books?"
                options: ["Book A is set long ago, whereas Book B takes place in a school today.", "Both are set long ago.", "Book A has a dragon."]
                answer: "Book A is set long ago, whereas Book B takes place in a school today."
                option_audio: false
              - id: l2-n3
                type: sorting
                text: "Sort the sentences about the two books."
                say: "Is each sentence a similarity or a difference between the books?"
                option_audio: false
                bins:
                  - { id: same, show: { text: "similarity" }, say: "Similarity." }
                  - { id: diff, show: { text: "difference" }, say: "Difference." }
                options:
                  - { text: "Both heroes are scared but act anyway.", bin: same }
                  - { text: "One fights a dragon, the other a bully.", bin: diff }
                  - { text: "Both protect someone else.", bin: same }
                  - { text: "One is a knight, the other a schoolgirl.", bin: diff }
              - id: l2-n4
                type: multiple_choice
                text: "Which is the best comparison of the two books?"
                options: ["Both show courage: the knight faces a dragon, whereas the girl faces a bully.", "The knight has a sword.", "I liked Book A more."]
                answer: "Both show courage: the knight faces a dragon, whereas the girl faces a bully."
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Is it true? \"Unlike the knight, the girl has no sword\" is a difference."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "In \"Snow Day\", Kit builds a snowman alone. His sister Bea gathers the whole street for a snowball fight.\n\nHow are they different?"
            options: ["Kit is quiet and likes being alone; Bea is sociable.", "Bea is quiet; Kit is sociable.", "They both build snowmen."]
            answer: "Kit is quiet and likes being alone; Bea is sociable."
            option_audio: false
          - id: l2-c2
            type: sorting
            text: "Sort the sentences about Kit and Bea."
            say: "Is each sentence a similarity or a difference?"
            option_audio: false
            bins:
              - { id: same, show: { text: "similarity" }, say: "Similarity." }
              - { id: diff, show: { text: "difference" }, say: "Difference." }
            options:
              - { text: "Both love snow.", bin: same }
              - { text: "Kit plays alone, but Bea plays with everyone.", bin: diff }
              - { text: "Both live on Mill Lane.", bin: same }
              - { text: "Unlike Bea, Kit hates noise.", bin: diff }
          - id: l2-c3
            type: multiple_choice
            text: "Book A: A girl saves the last tree in her city.\nBook B: A boy cleans a polluted river with his class.\n\nWhat theme do both books share?"
            options: ["caring for the natural world", "trees", "rivers"]
            answer: "caring for the natural world"
          - id: l2-c4
            type: multiple_choice
            text: "Choose the word.\n\nThe girl works alone, _ the boy works with his whole class."
            say: "Choose the word. The girl works alone, ... the boy works with his whole class."
            options: ["whereas", "similarly", "both"]
            answer: "whereas"
          - id: l2-c5
            type: multiple_choice
            text: "Which is the best comparison of the two books?"
            options: ["Both children protect nature. However, the girl works alone, whereas the boy works with his class.", "The girl likes trees.", "Book B has a river."]
            answer: "Both children protect nature. However, the girl works alone, whereas the boy works with his class."
            option_audio: false
