# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.recommend
skill: lit-en.texts.recommend
curriculum: en-GB
language: en
title:
  de: Ein Buch empfehlen
  en: Recommending a book
summary: >
  A good recommendation names the book, says what kind of book it is and
  what it is about without giving the ending away, gives reasons backed by
  something from the book, and says who would enjoy it. Lesson 1 sorts
  strong reasons from weak ones and spots spoilers; lesson 2 matches books
  to readers, builds a recommendation in order and ends with the skill
  check.
metadata:
  year: year-6
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.comprehension.justify-views]
  also_practises: [lit-en.comprehension.justify-views]
  vocabulary: { en: [recommend, recommendation, reason, example, genre, spoiler, reader, blurb, audience] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: reasons, what: { de: Gründe mit einem Beispiel aus dem Buch, en: reasons backed by an example from the book } }
    - { id: no-spoilers, what: { de: "sagen, worum es geht, ohne das Ende zu verraten", en: saying what the book is about without spoilers } }
    - { id: reader, what: { de: das Buch zum Leser passend wählen, en: matching the book to the reader } }
    - { id: structure, what: { de: was in eine Empfehlung gehört und in welcher Reihenfolge, en: what goes in a recommendation and in what order } }
  misconceptions:
    - id: reason-without-example
      what: Gives a reason with nothing from the book to back it up ("It is good because it is good")
      addressed: l1-f1, l1-f3, l1-s1, l2-f2 and l2-c2 set a reason with an example against an empty one; feedback names the missing example
    - id: tells-the-ending
      what: Gives away the ending or the big twist when recommending a book
      addressed: l1-f2, l1-s3, l1-n3 and l2-c3 ask which sentence is a spoiler; Learn says a recommendation stops before the twist
    - id: one-book-for-everyone
      what: Thinks a book you liked suits every reader, whatever they enjoy
      addressed: lesson 2 matches books to readers by what they like (l2-f1, l2-s1, l2-n1, l2-c4)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gute Gründe, keine Spoiler", en: "Good reasons, no spoilers" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "View: Sam is brave.\n\nWhich evidence supports this view?"
            say: "Read the view. Which evidence supports it?"
            options: ["Sam walked into the dark cave alone.", "Sam had a red coat.", "Sam lived near the sea."]
            answer: "Sam walked into the dark cave alone."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? A good answer gives a point, evidence from the text and an explanation."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "I recommend \"The Clockwork Fox\" by Asha Patel. It is an adventure story about a girl called Mia who finds a metal fox in her grandad's shed."
            say: "To recommend a book is to tell someone they should read it. Start with the title, the author, the kind of book, or genre, and what it is about."
          - text: "The chapters are short and nearly every one ends on a cliffhanger, so I could not put it down."
            say: "Give reasons, and back each reason with an example from the book. Saying it is gripping is a weak reason on its own. Saying that every chapter ends on a cliffhanger tells the reader why."
          - text: "I will not tell you what is inside the fox!"
            say: "Never give away the ending or the big surprise. That is called a spoiler. Leave the reader wanting to find out."
          - text: "If you like mysteries and machines, you will love it."
            say: "Finish by saying who would enjoy it. A book suits readers who like that kind of story, not everybody."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which is the strongest reason to read \"The Clockwork Fox\"?"
                options: ["The fox talks in riddles, so you have to solve them with Mia.", "It is a really good book.", "I liked it."]
                answer: "The fox talks in riddles, so you have to solve them with Mia."
                option_audio: false
                feedback:
                  "It is a really good book.": "That tells us you liked it, but not why. Give an example from the book."
                hints:
                  - "A strong reason tells the reader something about the book."
                  - "Which option gives a detail from the story?"
                  - "The one about the riddles."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which sentence is a spoiler?"
                options: ["In the end, the fox turns out to be Mia's lost grandad.", "The story is set in a small seaside town.", "Mia finds the fox on the first page."]
                answer: "In the end, the fox turns out to be Mia's lost grandad."
                option_audio: false
                hints:
                  - "A spoiler gives away a surprise."
                  - "Which sentence tells you how the book ends?"
                  - "In the end, the fox turns out to be Mia's lost grandad."
              - id: l1-f3
                type: sorting
                text: "Sort the reasons."
                say: "Read each reason. Does it give an example from the book, or not?"
                option_audio: false
                bins:
                  - { id: strong, show: { text: "reason with an example" }, say: "Reason with an example." }
                  - { id: weak, show: { text: "no example" }, say: "No example." }
                options:
                  - { text: "The jokes made me laugh, like when the robot tries to eat soup.", bin: strong }
                  - { text: "It is brilliant.", bin: weak }
                  - { text: "The setting feels real: you can almost smell the bakery.", bin: strong }
                  - { text: "Everyone should read it.", bin: weak }
                hints:
                  - "Ask of each one: does it tell me something that happens in the book?"
                  - "The soup and the bakery are details from the book."
                  - "Soup and bakery: with an example. Brilliant and everyone should read it: no example."
              - id: l1-f4
                type: multiple_choice
                text: "What should a recommendation start with?"
                options: ["the title and the author", "the ending", "how many pages it has"]
                answer: "the title and the author"
                hints:
                  - "The reader needs to find the book."
                  - "What would you type into a library search?"
                  - "The title and the author."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the words that tell you who would enjoy the book."
                show: { drawn: letter-card, text: "Readers who love ghost stories will enjoy it." }
                spans: ["ghost", "stories"]
                hints:
                  - "Which readers are named?"
                  - "What kind of story do they love?"
                  - "Ghost stories."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is the strongest reason to read \"Storm Island\"?"
                options: ["The storm scenes are so vivid you can hear the waves.", "It is the best book ever.", "My friend said it was good."]
                answer: "The storm scenes are so vivid you can hear the waves."
                option_audio: false
                hints: ["Which one tells you something about the book itself?"]
              - id: l1-s2
                type: true_false
                text: "Is it true? \"It is good\" is a strong reason on its own."
                answer: false
                hints: ["Does it say why?"]
              - id: l1-s3
                type: multiple_choice
                text: "Which sentence is a spoiler?"
                options: ["The thief was the teacher all along.", "The book has lots of short chapters.", "It is set in a school in Leeds."]
                answer: "The thief was the teacher all along."
                option_audio: false
                hints: ["Which one gives away the mystery?"]
              - id: l1-s4
                type: sorting
                text: "Sort the sentences."
                say: "Which sentences belong in a recommendation, and which give too much away?"
                option_audio: false
                bins:
                  - { id: in, show: { text: "belongs in" }, say: "Belongs in." }
                  - { id: out, show: { text: "gives too much away" }, say: "Gives too much away." }
                options:
                  - { text: "It is a funny story about a boy and his robot.", bin: in }
                  - { text: "On the last page, the robot breaks.", bin: out }
                  - { text: "If you like jokes, you will love it.", bin: in }
                  - { text: "The boy wins the prize at the end.", bin: out }
                hints: ["Endings give too much away."]
              - id: l1-s5
                type: multiple_choice
                text: "What is a genre?"
                options: ["a kind of book, such as mystery or fantasy", "the person who wrote the book", "the last chapter"]
                answer: "a kind of book, such as mystery or fantasy"
                hints: ["Adventure is one."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is the strongest reason to read \"The Silver Kite\"?"
                options: ["Each chapter is told by a different child, so you see the story from all sides.", "It is amazing.", "The cover is nice."]
                answer: "Each chapter is told by a different child, so you see the story from all sides."
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "Is it true? A recommendation should say who would enjoy the book."
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Which sentence is a spoiler?"
                options: ["The dragon dies in the last chapter.", "The dragon lives in a mountain.", "The book is a fantasy story."]
                answer: "The dragon dies in the last chapter."
                option_audio: false
              - id: l1-n4
                type: highlight_in_text
                text: "Tap the example from the book."
                show: { drawn: letter-card, text: "It is funny because Rex keeps stealing socks." }
                spans: ["Rex", "keeps", "stealing", "socks"]
              - id: l1-n5
                type: multiple_choice
                text: "Which sentence would end a recommendation well?"
                options: ["If you like true stories about animals, give it a try.", "The end.", "It has 200 pages."]
                answer: "If you like true stories about animals, give it a try."
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is the strongest reason to read \"Moon Garden\"?"
            options: ["The poems are short and each one paints a picture of the night.", "It is good.", "I read it twice."]
            answer: "The poems are short and each one paints a picture of the night."
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Which sentence is a spoiler?"
            options: ["At the end, the twins find their dad.", "The twins live on a canal boat.", "It is an adventure story."]
            answer: "At the end, the twins find their dad."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Is it true? A spoiler is a good way to end a recommendation."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Which reason gives an example from the book?"
            options: ["The aliens are hilarious, like the one who thinks a hat is a spaceship.", "It is fantastic.", "You should read it."]
            answer: "The aliens are hilarious, like the one who thinks a hat is a spaceship."
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Is it true? \"In the end, the queen was the spy\" is a spoiler."
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which sentence tells you who would enjoy the book?"
            options: ["Anyone who loves dinosaurs will enjoy it.", "It has twelve chapters.", "It came out last year."]
            answer: "Anyone who loves dinosaurs will enjoy it."
            option_audio: false

  - n: 2
    title: { de: Das passende Buch für jeden, en: The right book for the reader }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which sentence is a spoiler?"
            options: ["The cat was the hero all along.", "The story is set in Wales.", "It has pictures on every page."]
            answer: "The cat was the hero all along."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which reason has an example from the book?"
            options: ["The songs in it are silly, like the one about a singing sock.", "It is fun.", "Read it now."]
            answer: "The songs in it are silly, like the one about a singing sock."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Leo loves football and funny stories.\nPriya loves space and facts."
            say: "Before you recommend a book, think about the reader. What do they enjoy?"
          - text: "Leo: \"Goal Machine\", a funny story about a football team.\nPriya: \"Journey to Mars\", a fact book about space."
            say: "Match the book to the reader. A book you loved may not suit everyone."
          - text: "1. Title, author and genre\n2. What it is about, no spoilers\n3. Reasons with examples\n4. Who would enjoy it"
            say: "A recommendation goes in this order. Name the book, say what it is about without the ending, give reasons with examples, and say who would enjoy it."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Amira loves horses and true stories.\n\nWhich book should you recommend to her?"
                options: ["\"Racing Home\", the true story of a rescued horse", "\"Robot Wars\", a science fiction story", "\"Ghost Train\", a scary story"]
                answer: "\"Racing Home\", the true story of a rescued horse"
                option_audio: false
                feedback:
                  "\"Robot Wars\", a science fiction story": "You might enjoy it, but does Amira like robots? Think about what she loves."
                hints:
                  - "What does Amira enjoy?"
                  - "Look for horses and a true story."
                  - "\"Racing Home\"."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ben wrote: \"I recommend 'The Lost Map' because it is good.\"\n\nHow could Ben improve it?"
                options: ["Add an example of what makes it good.", "Tell the ending.", "Make it shorter."]
                answer: "Add an example of what makes it good."
                hints:
                  - "Does Ben say why it is good?"
                  - "A reason needs something from the book."
                  - "Add an example."
              - id: l2-f3
                type: ordering
                text: "Put the recommendation in order."
                say: "Put the sentences of the recommendation in order."
                option_audio: false
                options: ["The descriptions are so vivid that you can feel the heat.", "If you like danger and daring friends, you will love it.", "Two friends must climb a volcano to save their village.", "I recommend \"Fire Mountain\" by Tom Reed, an adventure story."]
                slot_count: 4
                answer: ["I recommend \"Fire Mountain\" by Tom Reed, an adventure story.", "Two friends must climb a volcano to save their village.", "The descriptions are so vivid that you can feel the heat.", "If you like danger and daring friends, you will love it."]
                hints:
                  - "Start with the title and the author."
                  - "Then what it is about, then a reason, then the reader."
                  - "Fire Mountain, the volcano, the heat, then who will love it."
              - id: l2-f4
                type: true_false
                text: "Is it true? You should recommend your favourite book to every reader, whatever they like."
                answer: false
                hints:
                  - "Do all readers like the same things?"
                  - "Think about Leo and Priya."
                  - "No, match the book to the reader."
              - id: l2-f5
                type: multiple_choice
                text: "Which sentence tells the reader what the book is about without a spoiler?"
                options: ["A boy discovers his new neighbour can see the future.", "The neighbour saves the boy in the last chapter.", "It is good."]
                answer: "A boy discovers his new neighbour can see the future."
                option_audio: false
                hints:
                  - "It should give the start, not the end."
                  - "Which one tells you what happens in the last chapter? Leave that out."
                  - "A boy discovers his new neighbour can see the future."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Kai loves jokes and drawing.\n\nWhich book should you recommend to him?"
                options: ["\"Doodle Disaster\", a funny story full of comic strips", "\"The Big Book of Rivers\", a fact book", "\"Night Wolves\", a scary story"]
                answer: "\"Doodle Disaster\", a funny story full of comic strips"
                option_audio: false
                hints: ["Jokes and drawing."]
              - id: l2-s2
                type: multiple_choice
                text: "Ella wrote: \"Read 'Dark Woods'. At the end, the wolf is the hero.\"\n\nWhat is wrong?"
                options: ["It gives away the ending.", "It names the book.", "It is too long."]
                answer: "It gives away the ending."
                hints: ["What does the second sentence tell you?"]
              - id: l2-s3
                type: ordering
                text: "Put the recommendation in order."
                say: "Put the sentences of the recommendation in order."
                option_audio: false
                options: ["Puzzle fans will love it.", "I recommend \"Secret Spy\" by Jo Lake, a mystery.", "Every chapter ends with a clue, so you can guess along.", "A girl becomes a spy for one week."]
                slot_count: 4
                answer: ["I recommend \"Secret Spy\" by Jo Lake, a mystery.", "A girl becomes a spy for one week.", "Every chapter ends with a clue, so you can guess along.", "Puzzle fans will love it."]
                hints: ["Book, what it is about, reason, reader."]
              - id: l2-s4
                type: true_false
                text: "Is it true? \"Fans of space will love it\" tells the reader who would enjoy the book."
                answer: true
                hints: ["Does it name a kind of reader?"]
              - id: l2-s5
                type: multiple_choice
                text: "Which reason would persuade a reader who likes sad stories?"
                options: ["The friendship between the old man and the girl made me cry.", "There is a car chase on every page.", "It has a shiny cover."]
                answer: "The friendship between the old man and the girl made me cry."
                option_audio: false
                hints: ["Think about what this reader enjoys."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Oscar loves history and battles.\n\nWhich book should you recommend to him?"
                options: ["\"Shield Wall\", a story set in Viking times", "\"Baking with Bella\", a cookery book", "\"Pony Club\", a story about horses"]
                answer: "\"Shield Wall\", a story set in Viking times"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Ruby wrote: \"I recommend 'Sky Pirates'. It is the best.\"\n\nHow could Ruby improve it?"
                options: ["Give a reason with an example from the book.", "Say what happens on the last page.", "Leave out the title."]
                answer: "Give a reason with an example from the book."
              - id: l2-n3
                type: ordering
                text: "Put the recommendation in order."
                say: "Put the sentences of the recommendation in order."
                option_audio: false
                options: ["It is all about the creatures of the deep sea.", "Anyone curious about the ocean should read it.", "I recommend \"Deep Blue\" by Sara Okafor, a fact book.", "The photos are amazing, like the fish that glows."]
                slot_count: 4
                answer: ["I recommend \"Deep Blue\" by Sara Okafor, a fact book.", "It is all about the creatures of the deep sea.", "The photos are amazing, like the fish that glows.", "Anyone curious about the ocean should read it."]
              - id: l2-n4
                type: true_false
                text: "Is it true? A recommendation that tells the big twist will make the reader want to read the book more."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Which reason would persuade a reader who likes scary stories?"
                options: ["The creaking house and the whispers at night made me sleep with the light on.", "The main character loves cake.", "The book is very long."]
                answer: "The creaking house and the whispers at night made me sleep with the light on."
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: structure
            type: ordering
            text: "Put the recommendation in order."
            say: "Put the sentences of the recommendation in order."
            option_audio: false
            options: ["The clues are clever, like the map hidden in a poem.", "Three cousins find an old diary on holiday.", "If you like solving puzzles, try it.", "I recommend \"Island of Bones\" by Max Hill, a mystery."]
            slot_count: 4
            answer: ["I recommend \"Island of Bones\" by Max Hill, a mystery.", "Three cousins find an old diary on holiday.", "The clues are clever, like the map hidden in a poem.", "If you like solving puzzles, try it."]
          - id: l2-c2
            part: reasons
            type: multiple_choice
            text: "Which is the strongest reason to read \"The Wild Year\"?"
            options: ["It shows a year on a farm, from lambs in spring to snow in winter.", "It is a great book.", "Everyone likes it."]
            answer: "It shows a year on a farm, from lambs in spring to snow in winter."
            option_audio: false
          - id: l2-c3
            part: no-spoilers
            type: multiple_choice
            text: "Which sentence is a spoiler?"
            options: ["The missing dog was hiding in the school all along.", "The story starts on a rainy Monday.", "It is a funny mystery."]
            answer: "The missing dog was hiding in the school all along."
            option_audio: false
          - id: l2-c4
            part: reader
            type: multiple_choice
            text: "Zara loves poems and nature.\n\nWhich book should you recommend to her?"
            options: ["\"Leaf and Feather\", poems about woods and birds", "\"Speed Kings\", a book about racing cars", "\"Joke Machine\", a joke book"]
            answer: "\"Leaf and Feather\", poems about woods and birds"
            option_audio: false
          - id: l2-c5
            part: structure
            type: true_false
            text: "Is it true? A recommendation should name the title and the author."
            answer: true
          - id: l2-c6
            part: reasons
            type: sorting
            text: "Sort the reasons for reading \"Tiger Trail\"."
            say: "Read each reason. Does it give an example from the book, or not?"
            option_audio: false
            bins:
              - { id: strong, show: { text: "reason with an example" }, say: "Reason with an example." }
              - { id: weak, show: { text: "no example" }, say: "No example." }
            options:
              - { text: "The tiger cubs are drawn so well you want to stroke them.", bin: strong }
              - { text: "It's really cool.", bin: weak }
              - { text: "You learn how rangers track tigers, like reading paw prints in mud.", bin: strong }
              - { text: "I give it ten out of ten.", bin: weak }
          - id: l2-c7
            part: reasons
            type: multiple_choice
            text: "Which reason best backs up \"The book is funny\"?"
            options: ["The parrot keeps repeating the teacher's words at the worst moments.", "It is very, very funny.", "It has a yellow cover."]
            answer: "The parrot keeps repeating the teacher's words at the worst moments."
            option_audio: false
          - id: l2-c8
            part: reasons
            type: true_false
            text: "Is it true? \"The chase through the market is so tense that I read it twice\" gives a reason with an example."
            answer: true
          - id: l2-c9
            part: reasons
            type: highlight_in_text
            text: "Tap the example from the book."
            show: { drawn: letter-card, text: "It is exciting because the train races through a storm." }
            spans: ["the", "train", "races", "through", "a", "storm"]
          - id: l2-c10
            part: no-spoilers
            type: sorting
            text: "Sort the sentences about \"Frozen Lake\"."
            say: "Is each sentence a spoiler, or safe to share?"
            option_audio: false
            bins:
              - { id: spoiler, show: { text: "spoiler" }, say: "Spoiler." }
              - { id: safe, show: { text: "safe to share" }, say: "Safe to share." }
            options:
              - { text: "The ice cracks in the final chapter and Jo falls in.", bin: spoiler }
              - { text: "Jo and her brother live beside a frozen lake.", bin: safe }
              - { text: "It turns out the stranger is their long-lost aunt.", bin: spoiler }
              - { text: "It is an adventure set in the Lake District.", bin: safe }
          - id: l2-c11
            part: no-spoilers
            type: true_false
            text: "Is it true? \"Who sent the letters? You will have to read it to find out!\" gives away the ending."
            answer: false
          - id: l2-c12
            part: no-spoilers
            type: multiple_choice
            text: "Ella's recommendation ends: \"And in the last chapter, Max finally wins the race.\"\n\nWhat should she do?"
            options: ["cut that sentence, because it is a spoiler", "make that sentence longer", "move it to the start"]
            answer: "cut that sentence, because it is a spoiler"
          - id: l2-c13
            part: no-spoilers
            type: multiple_choice
            text: "Which sentence says what the book is about without a spoiler?"
            options: ["A shy girl joins a circus and must learn the trapeze.", "On the final night, the shy girl becomes the star of the circus.", "It is good."]
            answer: "A shy girl joins a circus and must learn the trapeze."
            option_audio: false
          - id: l2-c14
            part: reader
            type: multiple_choice
            text: "Finn loves football and true stories.\n\nWhich book should you recommend to him?"
            options: ["\"Boots of Gold\", the true story of a famous footballer", "\"Fairy Ball\", a fairy tale", "\"Ice Planet\", a science fiction story"]
            answer: "\"Boots of Gold\", the true story of a famous footballer"
            option_audio: false
          - id: l2-c15
            part: reader
            type: matching
            text: "Match each reader to the book they would enjoy."
            pairs:
              - { left: { text: "Sam loves space." }, right: { text: "\"Rocket Girl\", a story about an astronaut" } }
              - { left: { text: "Aisha loves cooking." }, right: { text: "\"Kitchen Chaos\", a funny cookbook" } }
              - { left: { text: "Theo loves ghosts." }, right: { text: "\"The Haunted Pier\", a spooky story" } }
          - id: l2-c16
            part: reader
            type: true_false
