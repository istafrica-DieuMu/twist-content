# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.perform-compositions
skill: lit-en.composition.perform-compositions
curriculum: en-GB
language: en
title:
  de: Eigene Texte vortragen
  en: Performing your own writing
summary: >
  Performing your writing means using your voice and body to make the
  meaning clear: stress on key words, pauses at punctuation and for
  suspense, volume and pace that fit the mood, and a gesture or look that
  matches the words. Lesson 1 plans a performance of a poem (stress,
  pauses, volume); lesson 2 adds pace and movement for a story opening and
  a persuasive speech, and ends with the skill check. Speaking tasks are
  recorded and played back, never marked: the skill check marks the
  choices a performer makes (stress, pauses, volume, pace, gesture), and
  Practise covers performing aloud.
metadata:
  year: year-6
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [lit-en.composition.read-own-writing]
  also_practises: [lit-en.composition.read-own-writing]
  vocabulary: { en: [perform, intonation, stress, pause, volume, pace, gesture, expression, audience, mood] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: stress-pause, what: { de: Schlüsselwörter betonen und Pausen für die Wirkung setzen, en: stressing key words and pausing for effect } }
    - { id: volume-pace, what: { de: Lautstärke und Tempo der Stimmung anpassen, en: matching volume and pace to the mood } }
    - { id: gesture, what: { de: "Gesten, Blick und Mimik, die zu den Worten passen", en: "gestures, eye contact and expression that fit the words" } }
  misconceptions:
    - id: loud-is-good
      what: Thinks a good performance is loud and fast all the way through
      addressed: l1-f3, l1-s3, l1-n3, l2-f2 and l2-c2 match volume and pace to the mood; feedback in l1-f3
    - id: no-pause
      what: Rushes through punctuation and never pauses for effect
      addressed: l1-f2, l1-s2, l1-n2 and l2-c1 find where to pause
    - id: random-gesture
      what: Adds movements that do not match the words, which distract the audience
      addressed: l2-f3, l2-s3, l2-n3 and l2-c4 choose the gesture that fits; feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Betonung, Pausen, Lautstärke", en: "Stress, pauses and volume" }
    goal:
      de: "Trag ein Gedicht vor: Betone die wichtigen Wörter, mach eine Pause vor einer Überraschung und flüstere oder werde lauter, wie es passt."
      en: "Perform a poem by stressing key words, pausing before a surprise, and speaking softly or loudly to fit the mood."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How does your voice usually sound at the end of a question like \"Are you ready?\""
            options: ["it rises", "it falls", "it stops in the middle"]
            answer: "it rises"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? An exclamation mark tells you to read with more feeling."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The house was silent.\nThen ... a creak.\nA step.\nA SCREAM!"
            say: "Listen to this poem, performed. The house was silent. Then. A creak. A step. A scream! To perform is to bring your writing to life for an audience."
          - text: "Stress: say the key word a little stronger.\n\"I said I would NEVER go back.\""
            say: "Stress the key words. Saying never more strongly shows how sure the speaker is."
          - text: "Pause: at full stops and commas, and before a surprise.\n\"Then ... a creak.\""
            say: "Pause at the punctuation, and pause before a surprise to build suspense. The audience leans in."
          - text: "Volume: soft for quiet, secret or sad moments; louder for excitement or danger."
            say: "Change your volume to fit the mood. Whisper the silent house. Raise your voice for the scream. A whole poem at the same loud volume loses its effect."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the word to stress to show how big the wave was."
                show: { drawn: letter-card, text: "The wave was enormous." }
                spans: ["enormous"]
                hints:
                  - "Which word carries the meaning?"
                  - "It tells you the size of the wave."
                  - "Enormous."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tap the word after which you would pause to build suspense."
                show: { drawn: letter-card, text: "I opened the box and inside was a tiny dragon." }
                spans: ["was"]
                hints:
                  - "Where is the surprise?"
                  - "Pause just before the surprise."
                  - "After was."
              - id: l1-f3
                type: multiple_choice
                text: "\"The baby is sleeping. Tiptoe past the door.\"\n\nHow should you say these lines?"
                options: ["softly", "loudly", "shouting"]
                answer: "softly"
                feedback:
                  "loudly": "Loud would wake the baby! Fit the volume to the mood: quiet and careful."
                hints:
                  - "What is the mood of the lines?"
                  - "A sleeping baby: quiet."
                  - "Softly."
              - id: l1-f4
                type: speak
                text: "Perform the line with a pause and a stress:\n\"Then ... a SCREAM!\""
                say: "Pause after then. Say scream loudly. Have a go."
                expected_text: "Then ... a scream!"
                hints:
                  - "Pause after Then."
                  - "Make scream louder."
                  - "Then, pause, a SCREAM!"
              - id: l1-f5
                type: multiple_choice
                text: "Why do performers change their volume?"
                options: ["to show the mood of each part", "to finish faster", "to make every line the same"]
                answer: "to show the mood of each part"
                hints:
                  - "Think about the silent house and the scream."
                  - "Quiet parts and exciting parts sound different."
                  - "To show the mood of each part."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the word to stress to show the speaker is angry."
                show: { drawn: letter-card, text: "I told you not to touch it!" }
                spans: ["not"]
                hints: ["Which word turns the instruction into a ban?"]
              - id: l1-s2
                type: highlight_in_text
                text: "Tap the word after which you would pause before the surprise."
                show: { drawn: letter-card, text: "I turned round and standing there was my grandad." }
                spans: ["was"]
                hints: ["Pause just before the surprise."]
              - id: l1-s3
                type: multiple_choice
                text: "\"Goal! We have won the cup!\"\n\nHow should you say this line?"
                options: ["loudly, with excitement", "in a whisper", "slowly and sadly"]
                answer: "loudly, with excitement"
                hints: ["What is the mood?"]
              - id: l1-s4
                type: speak
                text: "Perform the line softly:\n\"The house was silent.\""
                say: "Say it quietly, so the audience can feel the silence."
                expected_text: "The house was silent."
                hints: ["Quiet and slow."]
              - id: l1-s5
                type: true_false
                text: "Is it true? A pause before a surprise helps build suspense."
                answer: true
                hints: ["Think of Then ... a creak."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the word to stress to show how cold it was."
                show: { drawn: letter-card, text: "The water was freezing." }
                spans: ["freezing"]
              - id: l1-n2
                type: highlight_in_text
                text: "Tap the word after which you would pause before the surprise."
                show: { drawn: letter-card, text: "We dug deeper and at the bottom was gold." }
                spans: ["was"]
              - id: l1-n3
                type: multiple_choice
                text: "\"My old dog Sam is gone. I miss him every day.\"\n\nHow should you say these lines?"
                options: ["softly and slowly", "loudly and fast", "shouting with joy"]
                answer: "softly and slowly"
              - id: l1-n4
                type: speak
                text: "Perform the line with a stress on the key word:\n\"I will NEVER give up.\""
                say: "Say it so the audience knows you mean it."
                expected_text: "I will never give up."
              - id: l1-n5
                type: true_false
                text: "Is it true? A good performance keeps the same loud volume all the way through."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the word to stress to show how quick the cheetah was."
            show: { drawn: letter-card, text: "The cheetah ran at lightning speed." }
            spans: ["lightning"]
          - id: l1-c2
            type: multiple_choice
            text: "\"Shh! The fox is right outside.\"\n\nHow should you say this line?"
            options: ["in a whisper", "loudly", "singing"]
            answer: "in a whisper"
          - id: l1-c3
            type: true_false
            text: "Is it true? You should pause at a full stop."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "\"I baked this cake for Gran.\"\n\nYou want the audience to know the cake was for Gran and nobody else. Which word do you stress?"
            options: ["Gran", "baked", "cake"]
            answer: "Gran"
          - id: l1-c5
            type: multiple_choice
            text: "\"Fire! Everybody out!\"\n\nHow should you say these lines?"
            options: ["loudly", "in a whisper", "sleepily"]
            answer: "loudly"
          - id: l1-c6
            type: multiple_choice
            text: "Why do performers pause just before a surprise?"
            options: ["to build suspense", "to catch their breath", "because they have forgotten the words"]
            answer: "to build suspense"

  - n: 2
    title: { de: Tempo und Bewegung, en: Pace and movement }
    goal:
      de: "Sprich bei einer Verfolgung schneller und bei traurigen Stellen langsamer, und zeig mit einer passenden Geste, was du meinst."
      en: "Speed up for a chase, slow down for a sad moment, and use a gesture that matches your words."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"Hooray! It's snowing!\"\n\nHow should you say this line?"
            options: ["loudly, with excitement", "softly and sadly", "in a flat voice"]
            answer: "loudly, with excitement"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? Stressing a key word helps the audience notice it."
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Pace: faster for action and chases; slower for sad, important or mysterious moments."
            say: "Pace is how fast you speak. Speed up when the action speeds up. Slow down for important or sad moments, so they sink in."
          - text: "Gesture: a movement that matches the words.\n\"Far away\": point into the distance.\n\"I don't know\": shrug.\n\"Come here\": beckon with your hand."
            say: "A gesture is a movement of your hands or body. It should match the words. A random wave or wriggle distracts the audience."
          - text: "Eye contact and expression: look at your audience; let your face show the feeling."
            say: "Look up at your audience, not only at your page. Let your face show the feeling: a frown, a smile, wide eyes."
          - text: "Persuasive speech: \"Do we want a dirty park? NO! We want a park we can be proud of.\""
            say: "In a persuasive speech, pause after a question, stress the answer, and look at your audience. A firm hand gesture shows you mean it."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"She ran, jumped the fence, dodged the dogs and dived through the gate!\"\n\nWhich pace fits?"
                options: ["fast", "very slow", "stopping after every word"]
                answer: "fast"
                hints:
                  - "What is happening in the line?"
                  - "It is a chase: lots of action."
                  - "Fast."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "\"And so, after a hundred years, the old oak tree finally fell.\"\n\nWhich pace fits?"
                options: ["slow", "very fast", "as fast as possible"]
                answer: "slow"
                hints:
                  - "Is this action or an important moment?"
                  - "It is the end of something old and important."
                  - "Slow."
              - id: l2-f3
                type: multiple_choice
                text: "\"The castle stood far away on the hill.\"\n\nWhich gesture fits?"
                options: ["point into the distance", "clap your hands", "jump up and down"]
                answer: "point into the distance"
                feedback:
                  "clap your hands": "Clapping does not match the words. Far away on the hill: point into the distance."
                hints:
                  - "Which words could you show with your hand?"
                  - "Far away."
                  - "Point into the distance."
              - id: l2-f4
                type: speak
                text: "Perform the line fast, like a chase:\n\"Run! Run! They're right behind us!\""
                say: "Speed up and sound urgent. Have a go."
                expected_text: "Run! Run! They're right behind us!"
                hints:
                  - "Quick and urgent."
                  - "Stress run."
                  - "Run! Run! They're right behind us!"
              - id: l2-f5
                type: true_false
                text: "Is it true? You should look at your audience while you perform, not only at your page."
                answer: true
                hints:
                  - "Who are you performing to?"
                  - "Eye contact keeps them with you."
                  - "Yes."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "\"The lion leapt, the zebras scattered and dust flew everywhere!\"\n\nWhich pace fits?"
                options: ["fast", "slow and sleepy"]
                answer: "fast"
                hints: ["Action or calm?"]
              - id: l2-s2
                type: multiple_choice
                text: "\"Slowly, silently, the moon rose over the sleeping town.\"\n\nWhich pace fits?"
                options: ["slow", "fast"]
                answer: "slow"
                hints: ["Look at slowly and silently."]
              - id: l2-s3
                type: multiple_choice
                text: "\"I have no idea where it went.\"\n\nWhich gesture fits?"
                options: ["shrug", "point up", "wave goodbye"]
                answer: "shrug"
                hints: ["What do you do when you do not know?"]
              - id: l2-s4
                type: speak
                text: "Perform the line slowly:\n\"And then, at last, the hero came home.\""
                say: "Slow down. Let the audience feel the moment."
                expected_text: "And then, at last, the hero came home."
                hints: ["Pause at the commas."]
              - id: l2-s5
                type: highlight_in_text
                text: "In this speech, tap the word after which you would pause for effect."
                show: { drawn: letter-card, text: "Do we want a dirty park? No!" }
                spans: ["park"]
                hints: ["Pause after the question."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "\"The car screeched, swerved and smashed into the barrier!\"\n\nWhich pace fits?"
                options: ["fast", "slow"]
                answer: "fast"
              - id: l2-n2
                type: multiple_choice
                text: "\"She looked at the empty chair. Grandad was gone.\"\n\nWhich pace fits?"
                options: ["slow", "fast"]
                answer: "slow"
              - id: l2-n3
                type: multiple_choice
                text: "\"The tower was so tall it touched the clouds.\"\n\nWhich gesture fits?"
                options: ["look and point up high", "point at the floor", "shrug"]
                answer: "look and point up high"
              - id: l2-n4
                type: speak
                text: "Perform the speech line:\n\"We want a park we can be PROUD of.\""
                say: "Look up, stress proud, and use a firm voice."
                expected_text: "We want a park we can be proud of."
              - id: l2-n5
                type: true_false
                text: "Is it true? Any movement is fine, as long as you keep moving."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: stress-pause
            type: highlight_in_text
            text: "Tap the word after which you would pause before the surprise."
            show: { drawn: letter-card, text: "I lifted the lid and staring back at me was a frog." }
            spans: ["was"]
          - id: l2-c2
            part: volume-pace
            type: multiple_choice
            text: "\"Quick! Grab the rope! The bridge is breaking!\"\n\nHow should you say these lines?"
            options: ["loudly and fast", "softly and slowly", "in a whisper"]
            answer: "loudly and fast"
          - id: l2-c3
            part: stress-pause
            type: highlight_in_text
            text: "Tap the word to stress to show how tired the runner was."
            show: { drawn: letter-card, text: "After the race I was exhausted." }
            spans: ["exhausted"]
          - id: l2-c4
            part: gesture
            type: multiple_choice
            text: "\"Come closer, everyone. I have a secret.\"\n\nWhich gesture fits?"
            options: ["beckon with your hand", "jump up and down", "point far away"]
            answer: "beckon with your hand"
          - id: l2-c5
            part: volume-pace
            type: multiple_choice
            text: "\"The last light faded, and the forest fell silent.\"\n\nWhich pace fits?"
            options: ["slow", "fast"]
            answer: "slow"
          - id: l2-c6
            part: stress-pause
            type: multiple_choice
            text: "\"Mia won the race.\"\n\nYou want to show that it was Mia who won, not anyone else. Which word do you stress?"
            options: ["Mia", "won", "race"]
            answer: "Mia"
          - id: l2-c7
            part: stress-pause
            type: multiple_choice
            text: "\"I didn't say she took the money.\"\n\nYou want to show she took something, but not the money. Which word do you stress?"
            options: ["money", "she", "say"]
            answer: "money"
          - id: l2-c8
            part: stress-pause
            type: true_false
            text: "Is it true? In \"Then ... silence.\", the dots tell the performer to pause."
            answer: true
          - id: l2-c9
            part: stress-pause
            type: highlight_in_text
            text: "Tap the word after which you would pause, just before the big reveal."
            show: { drawn: letter-card, text: "The winner of this year's prize is Amira!" }
            spans: ["is"]
          - id: l2-c10
            part: stress-pause
            type: multiple_choice
            text: "\"The door opened slowly, and in walked the queen.\"\n\nWhere should you pause?"
            options: ["after slowly", "after door", "after in"]
            answer: "after slowly"
          - id: l2-c11
            part: volume-pace
            type: multiple_choice
            text: "\"Help! Somebody help me!\"\n\nHow should you say these lines?"
            options: ["loudly and urgently", "softly and slowly", "in a calm, flat voice"]
            answer: "loudly and urgently"
          - id: l2-c12
            part: volume-pace
            type: multiple_choice
            text: "\"Once upon a time, in a quiet village, there lived a gentle old woman.\"\n\nWhich pace fits?"
            options: ["steady and calm", "as fast as you can"]
            answer: "steady and calm"
          - id: l2-c13
            part: volume-pace
            type: sorting
            text: "Sort the lines: fast or slow?"
            say: "Which pace fits each line: fast or slow?"
            option_audio: false
            bins:
              - { id: fast, show: { text: "fast" }, say: "Fast." }
              - { id: slow, show: { text: "slow" }, say: "Slow." }
            options:
              - { text: "Faster! The train is leaving!", bin: fast }
              - { text: "The candle flickered, then went out.", bin: slow }
              - { text: "He grabbed the ball and sprinted for the line!", bin: fast }
              - { text: "We said goodbye for the very last time.", bin: slow }
          - id: l2-c14
            part: volume-pace
            type: true_false
            text: "Is it true? Saying every line loudly and fast makes a performance more exciting."
            answer: false
          - id: l2-c15
            part: volume-pace
            type: multiple_choice
            text: "\"Listen carefully ... the treasure is buried under the old well.\"\n\nHow should you say this line?"
            options: ["quietly, like a secret", "loudly, like a cheer", "fast, like a chase"]
            answer: "quietly, like a secret"
          - id: l2-c16
            part: gesture
            type: multiple_choice
            text: "\"Stop right there!\"\n\nWhich gesture fits?"
            options: ["hold up your hand, palm out", "shrug your shoulders", "wave goodbye"]
            answer: "hold up your hand, palm out"
          - id: l2-c17
            part: gesture
            type: multiple_choice
            text: "\"I was so happy I could have danced.\"\n\nWhich expression fits?"
            options: ["a big smile", "a frown", "a yawn"]
            answer: "a big smile"
          - id: l2-c18
            part: gesture
            type: true_false
            text: "Is it true? Waving your arms all the time helps the audience follow the words."
            answer: false
          - id: l2-c19
            part: gesture
            type: multiple_choice
            text: "\"The fish I caught was this big!\"\n\nWhich gesture fits?"
            options: ["hold your hands wide apart", "point up at the sky", "shrug"]
            answer: "hold your hands wide apart"
          - id: l2-c20
            part: gesture
            type: multiple_choice
            text: "You are performing a sad poem about a friend who has moved away.\n\nWhat should your face show?"
            options: ["sadness, with a still, gentle face", "a big grin", "a silly face to make people laugh"]
            answer: "sadness, with a still, gentle face"
