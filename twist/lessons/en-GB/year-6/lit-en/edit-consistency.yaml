# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.edit-consistency
skill: lit-en.composition.edit-consistency
curriculum: en-GB
language: en
title:
  de: Überarbeiten, Zeitform und Übereinstimmung
  en: Editing for tense and agreement
summary: >
  Editing a draft: keep one tense all the way through, make every verb
  agree with its subject (the dogs bark, each of the pupils has), and
  change words to make the meaning clearer or the effect stronger. Lesson
  1 finds and fixes verbs that slip out of tense; lesson 2 fixes
  agreement, chooses edits for effect and clarity, and ends with the
  skill check.
metadata:
  year: year-6
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.composition.evaluate-improve]
  also_practises: [lit-en.grammar.standard-verb-forms]
  vocabulary: { en: [edit, tense, past tense, present tense, consistent, subject, verb, agree, singular, plural, clarity, effect] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: tense-slip
      what: Slips from past to present in the middle of a story (She ran to the door and opens it)
      addressed: l1-f1, l1-f2, l1-s1, l1-s2, l1-n1, l1-n2 and l2-c1; feedback in l1-f2
    - id: nearest-noun-agreement
      what: Makes the verb agree with the nearest noun instead of the subject (The box of toys are heavy)
      addressed: l2-f2, l2-s2, l2-n2 and l2-c3; feedback in l2-f2
    - id: longer-is-better
      what: Thinks an edit is better if it adds more words, even when it makes the meaning less clear
      addressed: l2-f4, l2-s4, l2-n4 and l2-c5 choose the clearer edit
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die Zeitform durchhalten, en: Keeping the tense }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "\"The cake was nice.\"\n\nWhich edit improves the vocabulary?"
            options: ["The cake was delicious.", "The cake was very nice.", "The cake was nice nice."]
            answer: "The cake was delicious."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? Reading your work aloud helps you find mistakes."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Past: walked, ran, opened\nPresent: walks, runs, opens"
            say: "Most stories are told in the past tense. Some are told in the present tense. Either is fine, but once you choose, keep to it. That is a consistent tense."
          - text: "Draft: Zara ran to the door and opens it.\nEdit: Zara ran to the door and opened it."
            say: "Ran is past, but opens is present. The tense has slipped. Change opens to opened so both verbs are in the past."
          - text: "Draft: The wind howls and the trees shook.\nEdit: The wind howls and the trees shake."
            say: "Here the writer started in the present: howls. So shook must change to shake to stay in the present."
          - text: "Check: find every verb. Is each one in the same tense?"
            say: "When you edit, find every verb and check its tense. Reading aloud helps you hear a slip."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the verb that is in the wrong tense."
                show: { drawn: letter-card, text: "We packed our bags and walk to the station." }
                spans: ["walk"]
                hints:
                  - "Find the two verbs."
                  - "Packed is past. Is the other verb past too?"
                  - "Walk."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Choose the verb that keeps the tense.\n\nThe owl spread its wings and _ into the night."
                options: ["flew", "flies", "fly"]
                answer: "flew"
                feedback:
                  "flies": "Spread is past here, so the second verb must be past too: flew."
                hints:
                  - "What tense is the first part in?"
                  - "Spread here means it already happened: past."
                  - "Flew."
              - id: l1-f3
                type: multiple_choice
                text: "Which sentence keeps the same tense?"
                options: ["Max opens the box and finds a key.", "Max opens the box and found a key.", "Max opened the box and finds a key."]
                answer: "Max opens the box and finds a key."
                option_audio: false
                hints:
                  - "Check both verbs in each sentence."
                  - "Opens and finds are both present."
                  - "Max opens the box and finds a key."
              - id: l1-f4
                type: fill_in_blank
                text: "Edit the sentence so the tense is consistent."
                frame: "The crowd cheered and _ their flags."
                options: ["waved", "wave", "waves"]
                answer: ["waved"]
                hints:
                  - "Cheered is past."
                  - "Put wave in the past tense, like cheered."
                  - "Waved."
              - id: l1-f5
                type: true_false
                text: "Is it true? A story must always be in the past tense."
                answer: false
                hints:
                  - "Can a story be told in the present?"
                  - "Yes, if it stays in the present."
                  - "No, the tense must just be consistent."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the verb that is in the wrong tense."
                show: { drawn: letter-card, text: "The giant stamps his foot and roared." }
                spans: ["roared"]
                hints: ["Stamps is present."]
              - id: l1-s2
                type: multiple_choice
                text: "Choose the verb that keeps the tense.\n\nMum locked the door and _ the keys in her bag."
                options: ["put", "puts", "putting"]
                answer: "put"
                hints: ["Locked is past."]
              - id: l1-s3
                type: multiple_choice
                text: "Which sentence keeps the same tense?"
                options: ["The bell rang and the children ran out.", "The bell rings and the children ran out.", "The bell rang and the children run out."]
                answer: "The bell rang and the children ran out."
                option_audio: false
                hints: ["Both verbs past, or both present."]
              - id: l1-s4
                type: fill_in_blank
                text: "Edit the sentence so the tense is consistent."
                frame: "Lena climbs the tree and _ the view."
                options: ["admires", "admired", "admire"]
                answer: ["admires"]
                hints: ["Climbs is present."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the verb that is in the wrong tense."
                show: { drawn: letter-card, text: "It was dark. The wind howled. A door creaks." }
                spans: ["creaks"]
                hints: ["Was and howled are past."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the verb that is in the wrong tense."
                show: { drawn: letter-card, text: "Sam grabbed his coat and runs outside." }
                spans: ["runs"]
              - id: l1-n2
                type: multiple_choice
                text: "Choose the verb that keeps the tense.\n\nThe pirates found the chest and _ it open."
                options: ["broke", "break", "breaks"]
                answer: "broke"
              - id: l1-n3
                type: multiple_choice
                text: "Which sentence keeps the same tense?"
                options: ["She sings and the audience claps.", "She sings and the audience clapped.", "She sang and the audience claps."]
                answer: "She sings and the audience claps."
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Edit the sentence so the tense is consistent."
                frame: "The rocket shook and _ into the sky."
                options: ["shot", "shoots", "shoot"]
                answer: ["shot"]
              - id: l1-n5
                type: text_input
                text: "Write the verb in the past tense to keep the tense consistent.\n\nThe dog jumped and (catch) the ball."
                keyboard: letters
                answer: "caught"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the verb that is in the wrong tense."
            show: { drawn: letter-card, text: "The baby smiled and claps her hands." }
            spans: ["claps"]
          - id: l1-c2
            type: multiple_choice
            text: "Choose the verb that keeps the tense.\n\nThe river rises and _ the road."
            options: ["floods", "flooded", "flood"]
            answer: "floods"
          - id: l1-c3
            type: true_false
            text: "Is it true? \"He opened the gate and walked in\" keeps the same tense."
            answer: true

  - n: 2
    title: { de: Übereinstimmung und Wirkung, en: Agreement and effect }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap the verb that is in the wrong tense."
            show: { drawn: letter-card, text: "The cat yawned and stretches." }
            spans: ["stretches"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Choose the verb that keeps the tense.\n\nI ate my lunch and _ outside."
            options: ["went", "go", "goes"]
            answer: "went"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "One dog barks.\nTwo dogs bark."
            say: "The verb must agree with its subject. A singular subject, one dog, takes barks. A plural subject, two dogs, takes bark."
          - text: "The box of toys is heavy.\n(subject: the box)"
            say: "Find the real subject. In the box of toys, the subject is the box, not the toys. One box, so is, not are. Do not be fooled by the nearest noun."
          - text: "Each of the pupils has a book.\nEveryone is ready."
            say: "Each, every, everyone and nobody are singular, so they take has and is."
          - text: "Draft: The thing went really fast.\nEdit: The motorbike roared past."
            say: "Editing is also about effect and clarity. Swap a vague word for a precise one. Cut words that add nothing. A shorter, sharper sentence often works best."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Choose the verb that agrees with the subject.\n\nThe birds _ every morning."
                options: ["sing", "sings"]
                answer: "sing"
                hints:
                  - "Is the subject singular or plural?"
                  - "Birds is plural."
                  - "Sing."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Choose the verb that agrees with the subject.\n\nThe bag of apples _ on the table."
                options: ["is", "are"]
                answer: "is"
                feedback:
                  "are": "The subject is the bag, not the apples. One bag is on the table."
                hints:
                  - "What is on the table: the bag or the apples?"
                  - "The subject is the bag: one bag."
                  - "Is."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the verb that does not agree with its subject."
                show: { drawn: letter-card, text: "My brothers plays football on Saturdays." }
                spans: ["plays"]
                hints:
                  - "Who plays? One brother or more?"
                  - "Brothers is plural."
                  - "Plays should be play."
              - id: l2-f4
                type: multiple_choice
                text: "\"The man walked slowly and in a slow way down the road.\"\n\nWhich edit is clearest?"
                options: ["The man trudged down the road.", "The man walked slowly and very slowly down the road.", "The man walked, slowly, in a slow, slow way."]
                answer: "The man trudged down the road."
                option_audio: false
                hints:
                  - "Which words repeat the same idea?"
                  - "One precise verb can say walked slowly."
                  - "The man trudged down the road."
              - id: l2-f5
                type: multiple_choice
                text: "Choose the verb that agrees with the subject.\n\nEach of the players _ a shirt."
                options: ["has", "have"]
                answer: "has"
                hints:
                  - "Each is singular."
                  - "Think: each one has."
                  - "Has."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Choose the verb that agrees with the subject.\n\nMy aunt _ in Cardiff."
                options: ["lives", "live"]
                answer: "lives"
                hints: ["One aunt."]
              - id: l2-s2
                type: multiple_choice
                text: "Choose the verb that agrees with the subject.\n\nThe basket of eggs _ been dropped."
                options: ["has", "have"]
                answer: "has"
                hints: ["The subject is the basket: one basket."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap the verb that does not agree with its subject."
                show: { drawn: letter-card, text: "The children was excited about the trip." }
                spans: ["was"]
                hints: ["Children is plural."]
              - id: l2-s4
                type: multiple_choice
                text: "\"It was a nice day and the sun was nice.\"\n\nWhich edit is clearest and strongest?"
                options: ["The sun blazed in a clear blue sky.", "It was a nice, nice day and the sun was very nice.", "It was a day and the sun was there."]
                answer: "The sun blazed in a clear blue sky."
                option_audio: false
                hints: ["Swap nice for precise words."]
              - id: l2-s5
                type: multiple_choice
                text: "Choose the verb that agrees with the subject.\n\nEveryone _ welcome at the fair."
                options: ["is", "are"]
                answer: "is"
                hints: ["Everyone is singular."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Choose the verb that agrees with the subject.\n\nThe horses _ in the field."
                options: ["gallop", "gallops"]
                answer: "gallop"
              - id: l2-n2
                type: multiple_choice
                text: "Choose the verb that agrees with the subject.\n\nThe list of names _ on the wall."
                options: ["is", "are"]
                answer: "is"
              - id: l2-n3
                type: highlight_in_text
                text: "Tap the verb that does not agree with its subject."
                show: { drawn: letter-card, text: "Nobody know where the treasure is." }
                spans: ["know"]
              - id: l2-n4
                type: multiple_choice
                text: "\"The scary monster was scary and it scared us.\"\n\nWhich edit is clearest and strongest?"
                options: ["The monster's roar froze us to the spot.", "The scary, scary monster was very scary.", "The monster was a monster."]
                answer: "The monster's roar froze us to the spot."
                option_audio: false
              - id: l2-n5
                type: text_input
                text: "Write the verb that agrees with the subject.\n\nThe flowers in the vase (need or needs) water."
                keyboard: letters
                answer: "need"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tap the verb that is in the wrong tense."
            show: { drawn: letter-card, text: "The fox crept closer and sniffs the air." }
            spans: ["sniffs"]
          - id: l2-c2
            type: multiple_choice
            text: "Which sentence keeps the same tense?"
            options: ["The train stopped and the doors opened.", "The train stops and the doors opened.", "The train stopped and the doors open."]
            answer: "The train stopped and the doors opened."
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "Choose the verb that agrees with the subject.\n\nThe pile of books _ falling over."
            options: ["is", "are"]
            answer: "is"
          - id: l2-c4
            type: highlight_in_text
            text: "Tap the verb that does not agree with its subject."
            show: { drawn: letter-card, text: "The puppies loves their new toy." }
            spans: ["loves"]
          - id: l2-c5
            type: multiple_choice
            text: "\"The food was good and tasted good.\"\n\nWhich edit is clearest and strongest?"
            options: ["The spicy curry warmed us up.", "The food was good, good and very good.", "The food was food."]
            answer: "The spicy curry warmed us up."
            option_audio: false
