# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.cohesion
skill: lit-en.composition.cohesion
curriculum: en-GB
language: en
title:
  de: Gedanken verknüpfen
  en: Linking ideas (cohesion)
summary: >
  Cohesive devices tie a text together: pronouns and synonyms refer back
  without repeating a noun, ellipsis leaves out words the reader can fill
  in, adverbials (Later that day, As a result, On the other hand) link
  sentences and paragraphs, and a key word repeated on purpose holds a
  text together. Lesson 1 works within a paragraph; lesson 2 links
  paragraphs, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Texte schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [lit-en.composition.paragraphs, lit-en.grammar.fronted-adverbials]
  also_practises: [lit-en.grammar.fronted-adverbials]
  vocabulary: { en: [cohesion, cohesive device, pronoun, synonym, ellipsis, adverbial, refer back, paragraph] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: pronouns, what: { de: "Pronomen und Synonyme, die klar auf etwas zurückverweisen", en: pronouns and synonyms that clearly refer back } }
    - { id: ellipsis, what: { de: "Ellipse (Wörter weglassen, die der Leser ergänzt)", en: "ellipsis (leaving out words the reader can fill in)" } }
    - { id: adverbials, what: { de: "verbindende Adverbiale für Zeit, Grund, Gegensatz und Ergänzung", en: "linking adverbials for time, cause, contrast and adding" } }
    - { id: refer-back, what: { de: "Wiederholung mit Absicht und Wörter wie these problems, die auf einen ganzen Absatz verweisen", en: "repetition on purpose, and phrases like these problems that refer back to a paragraph" } }
  misconceptions:
    - id: unclear-pronoun
      what: Uses a pronoun when the reader cannot tell who it refers to (Sam told Ben he had won)
      addressed: l1-f3, l1-s3 and l2-c2 ask who a pronoun refers to or which version is clear; feedback in l1-f3
    - id: wrong-adverbial
      what: Picks a linking adverbial with the wrong meaning (As a result for a contrast)
      addressed: l2-f1, l2-f2, l2-s1, l2-s2, l2-n1 and l2-c3; feedback in l2-f2
    - id: all-repetition-bad
      what: Thinks repeating a word is always a mistake, even when it is done on purpose for effect
      addressed: Learn lesson 2 screen 3; l2-f4, l2-n4 and l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Im Absatz verknüpfen, en: Linking within a paragraph }
    goal:
      de: "Verbinde deine Sätze, ohne immer dasselbe Wort zu wiederholen, und sag statt der Fuchs auch mal er oder das hungrige Tier."
      en: "Link your sentences without repeating the same noun, so the fox becomes it or the hungry animal."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Where does the comma go?\n\nAfter lunch we went swimming."
            options: ["After lunch, we went swimming.", "After, lunch we went swimming.", "After lunch we, went swimming."]
            answer: "After lunch, we went swimming."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Is it true? A new paragraph often starts when the time, place or topic changes."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The fox crept into the garden. The fox sniffed the bins. The fox found a crust."
            say: "Listen. The fox, the fox, the fox. The sentences do not flow. Cohesion is how a text sticks together, and this one needs help."
          - text: "The fox crept into the garden. It sniffed the bins. The hungry animal soon found a crust."
            say: "A pronoun, it, and a synonym, the hungry animal, refer back to the fox. The reader knows who we mean, and the text flows."
          - text: "Some pupils walked to school; others cycled.\n(others = other pupils)"
            say: "Ellipsis means leaving out words the reader can fill in. Others means other pupils, so we do not need to repeat pupils."
          - text: "Unclear: Sam told Ben he had won.\nClear: Sam told Ben, \"You have won!\""
            say: "Check every pronoun. In the first sentence, who won? Sam or Ben? If the reader cannot tell, use the name or change the sentence."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Grandma planted roses. Grandma watered the roses every day.\n\nWhich version links the sentences best?"
                options: ["Grandma planted roses. She watered them every day.", "Grandma planted roses. Grandma watered the roses every day.", "Grandma planted roses. It watered her every day."]
                answer: "Grandma planted roses. She watered them every day."
                option_audio: false
                hints:
                  - "Which words are repeated?"
                  - "Use pronouns for Grandma and the roses."
                  - "She watered them every day."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which words refer back to the eagle?\n\nThe eagle spread its wings. _ soared over the valley."
                say: "Choose a synonym that refers back to the eagle."
                options: ["The great bird", "The valley", "They"]
                answer: "The great bird"
                hints:
                  - "What is an eagle?"
                  - "A bird."
                  - "The great bird."
              - id: l1-f3
                type: multiple_choice
                text: "Mia and her mum went to the shop. She bought a cake.\n\nWhy is this unclear?"
                options: ["We cannot tell who bought the cake.", "There is no full stop.", "Shop should have a capital."]
                answer: "We cannot tell who bought the cake."
                feedback:
                  "There is no full stop.": "The punctuation is fine. Look at she: is it Mia or her mum?"
                hints:
                  - "Look at the pronoun she."
                  - "Two people could be she."
                  - "We cannot tell who bought the cake."
              - id: l1-f4
                type: multiple_choice
                text: "Which sentence uses ellipsis?"
                options: ["Leo wanted to stay, but Ella didn't.", "Leo wanted to stay, but Ella didn't want to stay.", "Leo wanted to stay. Ella wanted to go home."]
                answer: "Leo wanted to stay, but Ella didn't."
                option_audio: false
                hints:
                  - "Ellipsis leaves words out."
                  - "Which sentence leaves out words we can fill in?"
                  - "Leo wanted to stay, but Ella didn't."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the words that refer back to \"the dragon\"."
                show: { drawn: letter-card, text: "The dragon woke. It yawned, and the beast stretched." }
                spans: ["It", "beast"]
                hints:
                  - "Look for a pronoun and a synonym."
                  - "One is a pronoun at the start of a sentence."
                  - "It and beast."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "The children built a den. The children used branches.\n\nWhich version links the sentences best?"
                options: ["The children built a den. They used branches.", "The children built a den. The children used branches.", "The children built a den. It used branches."]
                answer: "The children built a den. They used branches."
                option_audio: false
                hints: ["Which pronoun means the children?"]
              - id: l1-s2
                type: multiple_choice
                text: "Which words refer back to the volcano?\n\nThe volcano rumbled for days. Then _ erupted."
                say: "Choose a synonym that refers back to the volcano."
                options: ["the mountain", "the town", "she"]
                answer: "the mountain"
                hints: ["A volcano is a kind of ..."]
              - id: l1-s3
                type: multiple_choice
                text: "Which version is clear?"
                options: ["Tom gave Jack his ball because Jack had lost his own.", "Tom gave Jack his ball because he had lost his.", "He gave him his ball because he lost it."]
                answer: "Tom gave Jack his ball because Jack had lost his own."
                option_audio: false
                hints: ["Can you tell who lost the ball?"]
              - id: l1-s4
                type: multiple_choice
                text: "Which sentence uses ellipsis?"
                options: ["Some ate pizza; others, pasta.", "Some ate pizza; others ate pasta.", "Some ate pizza and some ate pasta."]
                answer: "Some ate pizza; others, pasta."
                option_audio: false
                hints: ["Which one leaves out ate?"]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the words that refer back to \"the knight\"."
                show: { drawn: letter-card, text: "The knight rode on. He was tired, but the brave warrior kept going." }
                spans: ["He", "warrior"]
                hints: ["A pronoun and a synonym."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "The scientists studied the ice. The scientists found ancient bubbles in the ice.\n\nWhich version links the sentences best?"
                options: ["The scientists studied the ice. They found ancient bubbles in it.", "The scientists studied the ice. The scientists found ancient bubbles in the ice.", "The scientists studied the ice. It found bubbles in them."]
                answer: "The scientists studied the ice. They found ancient bubbles in it."
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Which words refer back to the puppy?\n\nThe puppy chewed the slipper. Then _ fell asleep on it."
                say: "Choose the words that refer back to the puppy."
                options: ["the little dog", "the slipper", "they"]
                answer: "the little dog"
              - id: l1-n3
                type: true_false
                text: "Is it true? \"Priya met Zoe after school. She was crying.\" makes clear who was crying."
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Which sentence uses ellipsis?"
                options: ["I can swim, and so can my brother.", "I can swim, and my brother can swim.", "I can swim. My brother can swim too."]
                answer: "I can swim, and so can my brother."
                option_audio: false
              - id: l1-n5
                type: highlight_in_text
                text: "Tap the words that refer back to \"the storm\"."
                show: { drawn: letter-card, text: "The storm arrived at dusk. It raged, and the tempest lasted all night." }
                spans: ["It", "tempest"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The robot beeped. The robot rolled forward.\n\nWhich version links the sentences best?"
            options: ["The robot beeped. It rolled forward.", "The robot beeped. The robot rolled forward.", "The robot beeped. They rolled forward."]
            answer: "The robot beeped. It rolled forward."
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "What is ellipsis?"
            options: ["leaving out words the reader can fill in", "repeating a word", "starting with an adverbial"]
            answer: "leaving out words the reader can fill in"
          - id: l1-c3
            type: multiple_choice
            text: "Which words refer back to the whale?\n\nThe whale surfaced. Then _ dived deep."
            say: "Choose the words that refer back to the whale."
            options: ["the huge creature", "the sea", "we"]
            answer: "the huge creature"
          - id: l1-c4
            type: highlight_in_text
            text: "Tap the pronoun and the noun that refer back to \"the ship\"."
            show: { drawn: letter-card, text: "The ship left the harbour. It sailed north, and soon the vessel vanished in the fog." }
            spans: ["It", "vessel"]
          - id: l1-c5
            type: true_false
            text: "Is it true? \"Some children chose apples; others, bananas.\" uses ellipsis."
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which version is clear?"
            options: ["Mr Hill was nervous when he met the new head teacher.", "Mr Hill met the new head teacher. He was nervous.", "He met him, and he was nervous."]
            answer: "Mr Hill was nervous when he met the new head teacher."
            option_audio: false

  - n: 2
    title: { de: Absätze verbinden, en: Linking paragraphs }
    goal:
      de: "Verbinde einen Absatz mit dem davor, mit Wörtern wie Infolgedessen oder Trotzdem."
      en: "Link one paragraph to the one before, with words like As a result or Despite this."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "The cat climbed the tree. The cat got stuck.\n\nWhich version links the sentences best?"
            options: ["The cat climbed the tree. It got stuck.", "The cat climbed the tree. The cat got stuck.", "The cat climbed the tree. He got the tree."]
            answer: "The cat climbed the tree. It got stuck."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which sentence uses ellipsis?"
            options: ["Dad likes tea; Mum, coffee.", "Dad likes tea; Mum likes coffee.", "Dad likes tea and Mum likes coffee."]
            answer: "Dad likes tea; Mum, coffee."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Time: Later that day, Meanwhile, Eventually\nCause: As a result, Because of this, Therefore\nContrast: However, On the other hand, Despite this\nAdding: Furthermore, In addition, Also"
            say: "Adverbials link paragraphs and sentences. Each one has a job: time, cause, contrast or adding a point. Choose the one whose meaning fits."
          - text: "... the river burst its banks.\n\nAs a result, the village was flooded."
            say: "The adverbial at the start of the new paragraph shows how it links to the one before. As a result tells the reader that the flood was caused by the river."
          - text: "We must protect our parks. Parks give us fresh air. Parks give us space to play. Parks are worth saving."
            say: "Sometimes a writer repeats a key word on purpose. Here, parks is repeated to make a persuasive point stick. That is repetition used as a cohesive device."
          - text: "These problems ... This idea ... Such changes ..."
            say: "Words like this, these and such can refer back to a whole paragraph. These problems sums up what came before and links it to what comes next."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Paragraph 1 ends: \"... the team trained every evening for months.\"\n\nParagraph 2: \"_, they won the cup.\"\n\nWhich adverbial fills the gap?"
                say: "Paragraph 1 ends: the team trained every evening for months. Paragraph 2 starts: ... they won the cup. Which adverbial fills the gap?"
                options: ["As a result", "On the other hand", "Meanwhile"]
                answer: "As a result"
                hints:
                  - "How are the two paragraphs linked: cause, contrast or time?"
                  - "The training caused the win."
                  - "As a result."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Paragraph 1: \"Some people say mobile phones help children stay safe.\"\n\nParagraph 2: \"_, others argue that phones distract pupils in class.\"\n\nWhich adverbial fills the gap?"
                say: "Paragraph 1: Some people say mobile phones help children stay safe. Paragraph 2: ... others argue that phones distract pupils in class. Which adverbial fills the gap?"
                options: ["On the other hand", "As a result", "Furthermore"]
                answer: "On the other hand"
                feedback:
                  "As a result": "As a result shows cause. Here the second paragraph gives the opposite view, so you need a contrast."
                hints:
                  - "Is the second paragraph agreeing or disagreeing?"
                  - "It gives the other side: a contrast."
                  - "On the other hand."
              - id: l2-f3
                type: sorting
                text: "Sort the adverbials by their job."
                say: "Does each adverbial show time or contrast?"
                option_audio: false
                bins:
                  - { id: time, show: { text: "time" }, say: "Time." }
                  - { id: contrast, show: { text: "contrast" }, say: "Contrast." }
                options:
                  - { text: "Later that day", bin: time }
                  - { text: "However", bin: contrast }
                  - { text: "Eventually", bin: time }
                  - { text: "Despite this", bin: contrast }
                hints:
                  - "Does it tell you when, or does it show the opposite?"
                  - "Later and eventually are about when."
                  - "Later that day and eventually: time. However and despite this: contrast."
              - id: l2-f4
                type: true_false
                text: "Is it true? In \"We need trees. Trees clean the air. Trees give shade.\", the writer repeats \"trees\" on purpose to make the point stick."
                answer: true
                hints:
                  - "Is it a mistake, or does it make the message stronger?"
                  - "Persuasive writing often repeats a key word."
                  - "Yes, it is on purpose."
              - id: l2-f5
                type: multiple_choice
                text: "Paragraph 1 describes litter, broken swings and graffiti in the park.\n\nParagraph 2: \"_ could be solved if the council gave us a small grant.\"\n\nWhich words fill the gap?"
                say: "Paragraph 1 describes litter, broken swings and graffiti in the park. Paragraph 2: ... could be solved if the council gave us a small grant. Which words fill the gap?"
                options: ["These problems", "The swings", "It"]
                answer: "These problems"
                hints:
                  - "Paragraph 2 must refer back to everything in paragraph 1."
                  - "Which phrase sums up litter, swings and graffiti?"
                  - "These problems."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Paragraph 1: \"Ravi searched the attic all morning.\"\n\nParagraph 2: \"_, he found the old map under a loose floorboard.\"\n\nWhich adverbial fills the gap?"
                say: "Paragraph 1: Ravi searched the attic all morning. Paragraph 2: ... he found the old map under a loose floorboard. Which adverbial fills the gap?"
                options: ["Eventually", "However", "In addition"]
                answer: "Eventually"
                hints: ["The link is about time."]
              - id: l2-s2
                type: multiple_choice
                text: "Paragraph 1: \"School uniform saves families money.\"\n\nParagraph 2: \"_, uniform helps pupils feel part of a team.\"\n\nWhich adverbial fills the gap?"
                say: "Paragraph 1: School uniform saves families money. Paragraph 2: ... uniform helps pupils feel part of a team. Which adverbial fills the gap?"
                options: ["Furthermore", "However", "Meanwhile"]
                answer: "Furthermore"
                hints: ["The second paragraph adds another reason."]
              - id: l2-s3
                type: sorting
                text: "Sort the adverbials by their job."
                say: "Does each adverbial show cause or add a point?"
                option_audio: false
                bins:
                  - { id: cause, show: { text: "cause" }, say: "Cause." }
                  - { id: add, show: { text: "adding" }, say: "Adding." }
                options:
                  - { text: "As a result", bin: cause }
                  - { text: "In addition", bin: add }
                  - { text: "Therefore", bin: cause }
                  - { text: "Furthermore", bin: add }
                hints: ["Does it explain why, or add more?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which word can refer back to a whole paragraph?"
                options: ["This", "Quickly", "Suddenly"]
                answer: "This"
                hints: ["This idea, this problem."]
              - id: l2-s5
                type: multiple_choice
                text: "Paragraph 1 explains that the bridge was old and cracked.\n\nWhich sentence best starts paragraph 2?"
                options: ["Because of this, the council closed it.", "Meanwhile, the bridge was blue.", "On the other hand, it was cracked."]
                answer: "Because of this, the council closed it."
                option_audio: false
                hints: ["The closure is caused by the cracks."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Paragraph 1: \"The explorers had run out of food.\"\n\nParagraph 2: \"_, they kept walking north.\"\n\nWhich adverbial fills the gap?"
                say: "Paragraph 1: The explorers had run out of food. Paragraph 2: ... they kept walking north. Which adverbial fills the gap?"
                options: ["Despite this", "Therefore", "In addition"]
                answer: "Despite this"
              - id: l2-n2
                type: multiple_choice
                text: "Paragraph 1: \"The heroes crossed the desert.\"\n\nParagraph 2: \"_, back in the castle, the queen waited for news.\"\n\nWhich adverbial fills the gap?"
                say: "Paragraph 1: The heroes crossed the desert. Paragraph 2: ... back in the castle, the queen waited for news. Which adverbial fills the gap?"
                options: ["Meanwhile", "As a result", "Furthermore"]
                answer: "Meanwhile"
              - id: l2-n3
                type: sorting
                text: "Sort the adverbials by their job."
                say: "Does each adverbial show time, cause or contrast?"
                option_audio: false
                bins:
                  - { id: time, show: { text: "time" }, say: "Time." }
                  - { id: cause, show: { text: "cause" }, say: "Cause." }
                  - { id: contrast, show: { text: "contrast" }, say: "Contrast." }
                options:
                  - { text: "Meanwhile", bin: time }
                  - { text: "Therefore", bin: cause }
                  - { text: "On the other hand", bin: contrast }
                  - { text: "Because of this", bin: cause }
                  - { text: "Later that day", bin: time }
                  - { text: "However", bin: contrast }
              - id: l2-n4
                type: true_false
                text: "Is it true? Repeating a word is always a mistake in writing."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Paragraph 1 lists three ways to save energy at home.\n\nWhich phrase best starts paragraph 2?"
                options: ["These simple changes", "The light bulb", "She"]
                answer: "These simple changes"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: adverbials
            type: multiple_choice
            text: "Paragraph 1: \"It rained for a week.\"\n\nParagraph 2: \"_, the sports day was cancelled.\"\n\nWhich adverbial fills the gap?"
            say: "Paragraph 1: It rained for a week. Paragraph 2: ... the sports day was cancelled. Which adverbial fills the gap?"
            options: ["Therefore", "However", "Meanwhile"]
            answer: "Therefore"
          - id: l2-c2
            part: pronouns
            type: multiple_choice
            text: "Which version is clear?"
            options: ["Amy waved at Kate as Kate got on the bus.", "Amy waved at Kate as she got on the bus.", "She waved at her as she got on it."]
            answer: "Amy waved at Kate as Kate got on the bus."
            option_audio: false
          - id: l2-c3
            part: adverbials
            type: multiple_choice
            text: "Paragraph 1: \"Cats make calm, quiet pets.\"\n\nParagraph 2: \"_, dogs need walks and lots of attention.\"\n\nWhich adverbial fills the gap?"
            say: "Paragraph 1: Cats make calm, quiet pets. Paragraph 2: ... dogs need walks and lots of attention. Which adverbial fills the gap?"
            options: ["However", "As a result", "Furthermore"]
            answer: "However"
          - id: l2-c4
            part: ellipsis
            type: multiple_choice
            text: "Which sentence uses ellipsis?"
            options: ["Jo has read the book; Max hasn't yet.", "Jo has read the book; Max hasn't read the book yet.", "Jo has read the book. Max has not read it."]
            answer: "Jo has read the book; Max hasn't yet."
            option_audio: false
          - id: l2-c5
            part: refer-back
            type: multiple_choice
            text: "\"Our river is dying. Our river needs help. Our river needs you.\"\n\nWhy does the writer repeat \"our river\"?"
            options: ["to make the message stronger and link the sentences", "because they forgot a pronoun", "to make it longer"]
            answer: "to make the message stronger and link the sentences"
          - id: l2-c6
            part: pronouns
            type: highlight_in_text
            text: "Tap the pronoun that could mean two different people."
            show: { drawn: letter-card, text: "Leo told Sam that he was in the team." }
            spans: ["he"]
          - id: l2-c7
            part: pronouns
            type: multiple_choice
            text: "The bees left the hive. _ flew to the lavender.\n\nWhich word refers back to the bees?"
            options: ["They", "It", "She"]
            answer: "They"
          - id: l2-c8
            part: pronouns
            type: multiple_choice
            text: "The castle was built in 1250. The castle has thick walls. The castle has a deep moat.\n\nWhich version links the sentences best?"
            options: ["The castle was built in 1250. It has thick walls and a deep moat.", "The castle was built in 1250. The castle has thick walls. The castle has a deep moat.", "The castle was built in 1250. They have thick walls and a deep moat."]
            answer: "The castle was built in 1250. It has thick walls and a deep moat."
            option_audio: false
          - id: l2-c9
            part: pronouns
            type: true_false
            text: "Is it true? In \"The pilot landed the plane. She smiled with relief.\", she refers back to the pilot."
            answer: true
          - id: l2-c10
            part: ellipsis
            type: multiple_choice
            text: "Anna wanted the red coat, but her sister wanted the blue.\n\nWhich word has the writer left out at the end?"
            options: ["coat", "wanted", "sister"]
            answer: "coat"
          - id: l2-c11
            part: ellipsis
            type: true_false
            text: "Is it true? \"Ben finished his lunch, and Ella did too.\" uses ellipsis."
            answer: true
          - id: l2-c12
            part: ellipsis
            type: multiple_choice
            text: "Which sentence uses ellipsis?"
            options: ["I have been to Wales, but my cousin hasn't.", "I have been to Wales, but my cousin hasn't been to Wales.", "I have been to Wales. My cousin has never been there."]
            answer: "I have been to Wales, but my cousin hasn't."
            option_audio: false
          - id: l2-c13
            part: ellipsis
            type: true_false
            text: "Is it true? \"Tom likes football. Tom likes tennis too.\" uses ellipsis."
            answer: false
          - id: l2-c14
            part: adverbials
            type: multiple_choice
            text: "Paragraph 1: \"The children put up their tents by the lake.\"\n\nParagraph 2: \"_, a storm rolled in over the hills.\"\n\nWhich adverbial fills the gap?"
            say: "Paragraph 1: The children put up their tents by the lake. Paragraph 2: ... a storm rolled in over the hills. Which adverbial fills the gap?"
