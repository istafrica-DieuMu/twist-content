# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.dictionary-thesaurus
skill: lit-en.spelling.dictionary-thesaurus
curriculum: en-GB
language: en
title:
  de: Wörterbuch und Thesaurus
  en: Dictionary and thesaurus
summary: >
  Lesson 1 finds words in a dictionary by their first three or four
  letters, uses guide words and picks the meaning that fits a sentence;
  lesson 2 uses a thesaurus to find a better word, choosing the synonym
  whose shade of meaning fits, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Rechtschreibung, en: Spelling }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-en.spelling.dictionary-ks2]
  also_practises: [lit-en.grammar.synonyms-antonyms]
  vocabulary: { en: [dictionary, thesaurus, alphabetical order, guide words, entry, definition, synonym, headword] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: first-letter-only
      what: Orders words by the first letter only, so cannot place words that share their first two or three letters (chain, chair, chalk)
      addressed: l1-f1, l1-s1, l1-n1 and l2-c1 order words that differ at the third or fourth letter; feedback in l1-f2
    - id: first-meaning-only
      what: Takes the first definition in an entry even when the sentence needs another one
      addressed: l1-f4, l1-s4, l1-n4 and l2-c3 give an entry with two meanings and a sentence that needs the second
    - id: any-synonym-fits
      what: Swaps in any synonym from a thesaurus without checking it fits the sentence (He devoured a sip of water)
      addressed: l2-f1, l2-f2, l2-s2, l2-n2 and l2-c4; feedback on the wrong shade in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Im Wörterbuch nachschlagen, en: Using a dictionary }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which word comes first in a dictionary?"
            options: ["bread", "bus", "bike"]
            answer: "bike"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which word comes first in a dictionary?"
            options: ["cat", "cow", "cup"]
            answer: "cat"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "chain\nchair\nchalk"
            say: "These words all start with c h a. To put them in order, look at the fourth letter: i, i and l. Chain and chair still match, so look at the fifth letter: n comes before r. So the order is chain, chair, chalk."
          - text: "Guide words: chess ... chimney"
            say: "At the top of each dictionary page are two guide words: the first and the last word on that page. If your word comes between them in alphabetical order, it is on that page. Chicken is between chess and chimney."
          - text: "bark (noun) 1. the hard outside of a tree 2. the sound a dog makes"
            say: "A dictionary entry gives the meaning, or definition. Many words have more than one meaning. Read them all and choose the one that fits your sentence."
          - text: "Check spelling: Is it \"recieve\" or \"receive\"?\nLook up r e c ...\nFound: receive"
            say: "To check a spelling, look up the first three or four letters and read along until you find the word."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Put the words in dictionary order."
                options: ["stamp", "stack", "stage", "stair"]
                slot_count: 4
                answer: ["stack", "stage", "stair", "stamp"]
                hints:
                  - "They all start with s t a. Look at the fourth letter."
                  - "c, g, i, m: which comes first in the alphabet?"
                  - "stack, stage, stair, stamp."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Which word comes first in a dictionary?"
                options: ["planet", "plant", "plane"]
                answer: "plane"
                feedback:
                  "plant": "Plane, planet and plant share p l a n. Look at the fifth letter: e, e and t. Plant comes last."
                hints:
                  - "They share the first four letters. Look further along."
                  - "Plane and planet both have e fifth. Plane is shorter, so it comes first."
                  - "Plane."
              - id: l1-f3
                type: true_false
                text: "Guide words on a page: brick ... bring\n\nIs it true? \"bright\" is on this page."
                answer: true
                hints:
                  - "Does bright come after brick and before bring?"
                  - "b r i c, b r i g, b r i n: c, g, n."
                  - "Yes, it is on this page."
              - id: l1-f4
                type: multiple_choice
                text: "bat (noun) 1. a small flying animal 2. a piece of wood for hitting a ball\n\nWhich meaning fits?\n\"She hit the ball with her bat.\""
                options: ["meaning 1", "meaning 2"]
                answer: "meaning 2"
                keep_order: true
                hints:
                  - "Read both meanings."
                  - "What do you use to hit a ball?"
                  - "Meaning 2."
              - id: l1-f5
                type: multiple_choice
                text: "You want to check how to spell \"neighbour\". Which letters do you look up first?"
                options: ["n e i g", "n a y", "b o u r"]
                answer: "n e i g"
                hints:
                  - "Start at the beginning of the word."
                  - "Use the first three or four letters."
                  - "n e i g."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Put the words in dictionary order."
                options: ["thorn", "thick", "three", "thank"]
                slot_count: 4
                answer: ["thank", "thick", "thorn", "three"]
                hints: ["They all start with t h. Look at the third letter."]
              - id: l1-s2
                type: multiple_choice
                text: "Which word comes last in a dictionary?"
                options: ["flute", "flood", "floor"]
                answer: "flute"
                hints: ["Look at the third letter first."]
              - id: l1-s3
                type: true_false
                text: "Guide words on a page: garden ... gather\n\nIs it true? \"gaze\" is on this page."
                answer: false
                hints: ["Does gaze come before gather?"]
              - id: l1-s4
                type: multiple_choice
                text: "spring (noun) 1. the season after winter 2. a coiled piece of metal\n\nWhich meaning fits?\n\"The old sofa had a broken spring.\""
                options: ["meaning 1", "meaning 2"]
                answer: "meaning 2"
                keep_order: true
                hints: ["Which is inside a sofa?"]
              - id: l1-s5
                type: multiple_choice
                text: "Guide words on a page: march ... mask\n\nWhich word is on this page?"
                options: ["market", "match", "magic"]
                answer: "market"
                hints: ["It must come after march and before mask."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Put the words in dictionary order."
                options: ["crumb", "crowd", "cross", "crown"]
                slot_count: 4
                answer: ["cross", "crowd", "crown", "crumb"]
              - id: l1-n2
                type: multiple_choice
                text: "Which word comes first in a dictionary?"
                options: ["shelter", "shell", "shelf"]
                answer: "shelf"
              - id: l1-n3
                type: true_false
                text: "Guide words on a page: pirate ... pitch\n\nIs it true? \"pistol\" is on this page."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "match (noun) 1. a small stick that makes a flame 2. a game between two teams\n\nWhich meaning fits?\n\"We won the football match.\""
                options: ["meaning 1", "meaning 2"]
                answer: "meaning 2"
                keep_order: true
              - id: l1-n5
                type: multiple_choice
                text: "Guide words on a page: river ... roast\n\nWhich word is on this page?"
                options: ["roar", "rival", "robin"]
                answer: "roar"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "Put the words in dictionary order."
            options: ["grape", "grass", "grain", "grand"]
            slot_count: 4
            answer: ["grain", "grand", "grape", "grass"]
          - id: l1-c2
            type: multiple_choice
            text: "fair (adjective) 1. treating everyone the same 2. light in colour\n\nWhich meaning fits?\n\"It is not fair that he got two turns.\""
            options: ["meaning 1", "meaning 2"]
            answer: "meaning 1"
            keep_order: true
          - id: l1-c3
            type: true_false
            text: "Guide words on a page: lemon ... level\n\nIs it true? \"lesson\" is on this page."
            answer: true

  - n: 2
    title: { de: Bessere Wörter im Thesaurus, en: Better words with a thesaurus }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which word comes first in a dictionary?"
            options: ["trick", "trial", "tribe"]
            answer: "trial"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is it true? Guide words show the first and last words on a dictionary page."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "big: large, huge, enormous, vast, giant"
            say: "A thesaurus lists synonyms, words with the same or a similar meaning. Look up big and you find large, huge, enormous, vast and giant."
          - text: "warm, hot, boiling\nwalk, stroll, march, stagger"
            say: "Synonyms are not all the same. They have shades of meaning. Boiling is much hotter than warm. A stroll is slow and relaxed; a march is fast and firm; a stagger is unsteady."
          - text: "The tired traveller _ into the inn.\nstrolled, marched, staggered"
            say: "Choose the synonym that fits the sentence. A tired traveller is unsteady, so staggered fits best."
          - text: "Use a thesaurus to:\n1. avoid repeating a word\n2. find a more precise word"
            say: "A thesaurus helps when you have used the same word too often, or when you want a word that says exactly what you mean. Always check it fits."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "said: whispered, shouted, muttered\n\nThe teacher _ across the noisy field.\n\nWhich synonym fits?"
                say: "Choose the synonym of said that fits the sentence."
                options: ["shouted", "whispered", "muttered"]
                answer: "shouted"
                hints:
                  - "How do you speak across a noisy field?"
                  - "You need to be loud."
                  - "Shouted."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "eat: nibble, gobble, devour\n\nThe mouse _ a tiny crumb of cheese.\n\nWhich synonym fits?"
                say: "Choose the synonym of eat that fits the sentence."
                options: ["nibbled", "devoured", "gobbled"]
                answer: "nibbled"
                feedback:
                  "devoured": "Devoured means ate hungrily, all of something big. A tiny crumb is nibbled."
                hints:
                  - "Think about the size of the crumb and the mouse."
                  - "Which word means to eat in tiny bites?"
                  - "Nibbled."
              - id: l2-f3
                type: ordering
                text: "Put the words in order, from a little bit cold to very cold."
                say: "Put the synonyms in order, from a little bit cold to very cold."
                options: ["freezing", "cool", "chilly"]
                slot_count: 3
                answer: ["cool", "chilly", "freezing"]
                hints:
                  - "Which one is only a little cold?"
                  - "Freezing is the coldest."
                  - "cool, chilly, freezing."
              - id: l2-f4
                type: multiple_choice
                text: "The film was good. The actors were good. The music was good.\n\nWhich word could replace the second \"good\"?"
                options: ["talented", "tasty", "tidy"]
                answer: "talented"
                hints:
                  - "Which synonym describes people who act well?"
                  - "Tasty is for food."
                  - "Talented."
              - id: l2-f5
                type: true_false
                text: "Is it true? \"Enormous\" is a synonym for \"tiny\"."
                answer: false
                hints:
                  - "Do they mean the same thing?"
                  - "Enormous means very big."
                  - "No, they are opposites."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "run: jog, sprint, dash\n\nIn the last ten metres of the race, she _ to the finish.\n\nWhich synonym fits?"
                say: "Choose the synonym of run that fits the sentence."
                options: ["sprinted", "jogged", "strolled"]
                answer: "sprinted"
                hints: ["The end of a race is the fastest part."]
              - id: l2-s2
                type: multiple_choice
                text: "happy: content, delighted, overjoyed\n\nWhen she won the cup, she was _.\n\nWhich synonym fits?"
                say: "Choose the synonym of happy that fits the sentence."
                options: ["overjoyed", "content", "calm"]
                answer: "overjoyed"
                hints: ["Winning a cup is a very big feeling."]
              - id: l2-s3
                type: ordering
                text: "Put the words in order, from a little bit wet to very wet."
                say: "Put the synonyms in order, from a little bit wet to very wet."
                options: ["soaked", "damp", "wet"]
                slot_count: 3
                answer: ["damp", "wet", "soaked"]
                hints: ["Soaked is the wettest."]
              - id: l2-s4
                type: multiple_choice
                text: "We walked to the shop. Then we walked to the park. We walked home.\n\nWhich word could replace the last \"walked\"?"
                options: ["trudged", "swam", "flew"]
                answer: "trudged"
                hints: ["It must still be a way of walking."]
              - id: l2-s5
                type: multiple_choice
                text: "What does a thesaurus list?"
                options: ["words with similar meanings", "how to say each word", "the history of each word"]
                answer: "words with similar meanings"
                hints: ["Think of big: large, huge, vast."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "look: glance, stare, peer\n\nHe _ quickly at the clock and carried on.\n\nWhich synonym fits?"
                say: "Choose the synonym of look that fits the sentence."
                options: ["glanced", "stared", "peered"]
                answer: "glanced"
              - id: l2-n2
                type: multiple_choice
                text: "angry: cross, furious, annoyed\n\nThe giant smashed the bridge. He was _.\n\nWhich synonym fits?"
                say: "Choose the synonym of angry that fits the sentence."
                options: ["furious", "annoyed", "puzzled"]
                answer: "furious"
              - id: l2-n3
                type: ordering
                text: "Put the words in order, from a little bit hungry to very hungry."
                say: "Put the synonyms in order, from a little bit hungry to very hungry."
                options: ["starving", "peckish", "hungry"]
                slot_count: 3
                answer: ["peckish", "hungry", "starving"]
              - id: l2-n4
                type: multiple_choice
                text: "The cake was nice. The party was nice. The weather was nice.\n\nWhich word could replace \"nice\" for the weather?"
                options: ["sunny", "delicious", "friendly"]
                answer: "sunny"
              - id: l2-n5
                type: true_false
                text: "Is it true? \"Vast\" and \"huge\" are synonyms."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            text: "Put the words in dictionary order."
            options: ["sprint", "spring", "sprout", "spray"]
            slot_count: 4
            answer: ["spray", "spring", "sprint", "sprout"]
          - id: l2-c2
            type: multiple_choice
            text: "Guide words on a page: candle ... canoe\n\nWhich word is on this page?"
            options: ["cannon", "canal", "canteen"]
            answer: "cannon"
          - id: l2-c3
            type: multiple_choice
            text: "light 1. (noun) what lets us see 2. (adjective) not heavy\n\nWhich meaning fits?\n\"The bag was so light I carried it with one finger.\""
            options: ["meaning 1", "meaning 2"]
            answer: "meaning 2"
            keep_order: true
          - id: l2-c4
            type: multiple_choice
            text: "cold: cool, chilly, icy\n\nThe wind was so _ it froze the puddles.\n\nWhich synonym fits?"
            say: "Choose the synonym of cold that fits the sentence."
            options: ["icy", "cool", "warm"]
            answer: "icy"
          - id: l2-c5
            type: multiple_choice
            text: "Which book would help you find a better word for \"nice\"?"
            options: ["a thesaurus", "an atlas", "a dictionary of dates"]
            answer: "a thesaurus"
