# Lesson set: English, Year 6. Hand-authored draft.
id: en-GB.lit-en.terms-ks2
skill: lit-en.grammar.terms-ks2
curriculum: en-GB
language: en
title:
  de: Grammatische Fachbegriffe (Year 6)
  en: Grammar terms for Key Stage 2
summary: >
  The grammar terms of upper Key Stage 2, used to talk about writing and
  reading: subject and object, modal verb, relative clause and relative
  pronoun, determiner, parenthesis, active and passive, cohesion and
  ellipsis. Lesson 1 names the parts of a sentence and the words in it;
  lesson 2 names punctuation and text features and uses the terms to
  explain an effect, and ends with the skill check.
metadata:
  year: year-6
  topic: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [lit-en.grammar.terms-y3]
  also_practises: [lit-en.grammar.passive, lit-en.composition.cohesion]
  vocabulary: { en: [subject, object, modal verb, relative clause, relative pronoun, determiner, parenthesis, active, passive, cohesion, ellipsis] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: subject-is-first-word
      what: "Thinks the subject is always the first word of the sentence (In the morning, the dog barked: subject \"In\")"
      addressed: l1-f1, l1-s1, l1-n1 and l2-c1 find the subject after a fronted adverbial; the hints in l1-f1 name the adverbial
    - id: subject-object-swap
      what: Swaps subject and object
      addressed: l1-f2, l1-s2, l1-n2 and l2-c2 ask for the object; Learn screen 1
    - id: term-for-the-wrong-thing
      what: Names the wrong feature, such as calling brackets a relative clause or any past sentence passive
      addressed: l2-f1, l2-f3, l2-s1, l2-s3, l2-n1, l2-n3 and l2-c4; feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Satzteile und Wortarten benennen, en: Naming sentence parts and words }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "\"We stayed inside because it was raining.\"\n\nWhat is \"because it was raining\"?"
            options: ["a subordinate clause", "a preposition", "direct speech"]
            answer: "a subordinate clause"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "\"The cat hid under the table.\"\n\nWhat word class is \"under\"?"
            options: ["preposition", "conjunction", "verb"]
            answer: "preposition"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "The fox chased the rabbit.\nsubject: The fox (does the action)\nobject: the rabbit (has the action done to it)"
            say: "The subject is who or what does the action. The object is who or what the action is done to. The fox chased the rabbit. The fox is the subject; the rabbit is the object."
          - text: "In the morning, the dog barked.\nsubject: the dog"
            say: "The subject is not always the first word. In the morning is a fronted adverbial. Ask: who barked? The dog. That is the subject."
          - text: "Modal verbs: can, could, may, might, must, shall, should, will, would\n\"You must be home by six.\""
            say: "A modal verb shows how likely or necessary something is. Must shows it is necessary. Might shows it is possible."
          - text: "Relative clause: The girl who won the race is my cousin.\nRelative pronouns: who, which, that, whose, where, when\nDeterminers: the, a, an, this, those, my, some, every"
            say: "A relative clause adds information about a noun and starts with a relative pronoun such as who or which. A determiner comes before a noun to say which one or how many: the, a, this, my, some."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tap the subject of the sentence."
                show: { drawn: letter-card, text: "After lunch, Grandad fell asleep." }
                spans: ["Grandad"]
                hints:
                  - "Who fell asleep?"
                  - "After lunch tells you when, so it is not the subject."
                  - "Grandad."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "\"Mia kicked the ball.\"\n\nWhat is the object?"
                options: ["the ball", "Mia", "kicked"]
                answer: "the ball"
                hints:
                  - "What has the action done to it?"
                  - "What did Mia kick?"
                  - "The ball."
              - id: l1-f3
                type: highlight_in_text
                text: "Tap the modal verb."
                show: { drawn: letter-card, text: "We should leave before it gets dark." }
                spans: ["should"]
                hints:
                  - "A modal verb shows how likely or necessary something is."
                  - "Look for can, could, should, must ..."
                  - "Should."
              - id: l1-f4
                type: multiple_choice
                text: "\"The book, which was very old, fell apart.\"\n\nWhat is \"which was very old\"?"
                options: ["a relative clause", "a modal verb", "a determiner"]
                answer: "a relative clause"
                hints:
                  - "Which word starts it?"
                  - "Which is a relative pronoun."
                  - "A relative clause."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the determiners."
                show: { drawn: letter-card, text: "My brother ate some grapes." }
                spans: ["My", "some"]
                hints:
                  - "Determiners come before a noun."
                  - "Which words come before brother and grapes?"
                  - "My and some."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tap the subject of the sentence."
                show: { drawn: letter-card, text: "Without a sound, Kai slipped out." }
                spans: ["Kai"]
                hints: ["Who slipped out?"]
              - id: l1-s2
                type: multiple_choice
                text: "\"The teacher praised the class.\"\n\nWhat is the object?"
                options: ["the class", "the teacher", "praised"]
                answer: "the class"
                hints: ["Who was praised?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap the modal verb."
                show: { drawn: letter-card, text: "It might snow tomorrow." }
                spans: ["might"]
                hints: ["How likely?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tap the relative pronoun."
                show: { drawn: letter-card, text: "This is the house where I was born." }
                spans: ["where"]
                hints: ["It starts the relative clause."]
              - id: l1-s5
                type: multiple_choice
                text: "\"Those shoes are mine.\"\n\nWhat word class is \"those\"?"
                options: ["determiner", "modal verb", "relative pronoun"]
                answer: "determiner"
                hints: ["It comes before a noun and says which ones."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tap the subject of the sentence."
                show: { drawn: letter-card, text: "At the end of the day, Priya went home." }
                spans: ["Priya"]
              - id: l1-n2
                type: multiple_choice
                text: "\"The dog buried a bone.\"\n\nWhat is the object?"
                options: ["a bone", "the dog", "buried"]
                answer: "a bone"
              - id: l1-n3
                type: highlight_in_text
                text: "Tap the modal verb."
                show: { drawn: letter-card, text: "You must wear a helmet." }
                spans: ["must"]
              - id: l1-n4
                type: multiple_choice
                text: "\"The boy whose bike was stolen called the police.\"\n\nWhat is \"whose bike was stolen\"?"
                options: ["a relative clause", "a fronted adverbial", "a modal verb"]
                answer: "a relative clause"
              - id: l1-n5
                type: matching
                text: "Match each word to its term."
                pairs:
                  - { left: { text: "could" }, right: { text: "modal verb" } }
                  - { left: { text: "which" }, right: { text: "relative pronoun" } }
                  - { left: { text: "every" }, right: { text: "determiner" } }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tap the subject of the sentence."
            show: { drawn: letter-card, text: "On Saturday, Aunt Jo visited." }
            spans: ["Aunt", "Jo"]
          - id: l1-c2
            type: multiple_choice
            text: "\"Ben will finish his homework.\"\n\nWhat is \"will\"?"
            options: ["a modal verb", "a determiner", "a relative pronoun"]
            answer: "a modal verb"
          - id: l1-c3
            type: multiple_choice
            text: "\"The cake that Gran made was delicious.\"\n\nWhat is \"that Gran made\"?"
            options: ["a relative clause", "parenthesis in brackets", "an object"]
            answer: "a relative clause"

  - n: 2
    title: { de: Zeichen und Textmerkmale benennen, en: Naming punctuation and text features }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "\"The cat caught a mouse.\"\n\nWhat is the subject?"
            options: ["the cat", "a mouse", "caught"]
            answer: "the cat"
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tap the modal verb."
            show: { drawn: letter-card, text: "We can go swimming later." }
            spans: ["can"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Parenthesis: extra information in brackets, commas or dashes.\nMy uncle (a chef) cooked dinner."
            say: "Parenthesis is extra information added to a sentence. It is marked with brackets, commas or dashes. Take it out and the sentence still works."
          - text: "Active: The dog chewed the shoe.\nPassive: The shoe was chewed by the dog."
            say: "In the active voice, the subject does the action. In the passive voice, the subject has the action done to it."
          - text: "Cohesion: how a text links together (pronouns, adverbials, repetition).\nEllipsis: leaving out words the reader can fill in. Some cheered; others didn't."
            say: "Cohesion is how a text sticks together. Ellipsis is leaving out words we can fill in: others didn't cheer."
          - text: "Using terms: \"The writer uses the passive, 'The diamond was stolen', so we do not know who the thief is.\""
            say: "Use the terms to explain an effect. Name the feature, quote it, and say what it does for the reader."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "\"Mr Lee (our head teacher) loves jazz.\"\n\nWhat do the brackets show?"
                options: ["parenthesis", "a relative clause", "ellipsis"]
                answer: "parenthesis"
                hints:
                  - "The brackets add extra information."
                  - "Take it out: Mr Lee loves jazz. Still a sentence."
                  - "Parenthesis."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "\"The trophy was won by our team.\"\n\nActive or passive?"
                options: ["passive", "active"]
                answer: "passive"
                hints:
                  - "Does the subject, the trophy, do the action?"
                  - "Was won: a form of be and a past participle."
                  - "Passive."
              - id: l2-f3
                type: multiple_choice
                text: "\"Sam likes peas; Ella doesn't.\"\n\nWhich feature is used after the semicolon?"
                options: ["ellipsis", "parenthesis", "a modal verb"]
                answer: "ellipsis"
                feedback:
                  "parenthesis": "Parenthesis adds extra information in brackets, commas or dashes. Here words are left out: Ella doesn't like peas. That is ellipsis."
                hints:
                  - "What words are missing at the end?"
                  - "Ella doesn't like peas."
                  - "Ellipsis."
              - id: l2-f4
                type: matching
                text: "Match each term to its example."
                pairs:
                  - { left: { text: "passive" }, right: { text: "The window was broken." } }
                  - { left: { text: "relative clause" }, right: { text: "the man who sings" } }
                  - { left: { text: "parenthesis" }, right: { text: "Zoe (my friend) waved." } }
                  - { left: { text: "modal verb" }, right: { text: "should" } }
                hints:
                  - "Start with the one you are surest of."
                  - "Who sings is a relative clause."
                  - "passive: was broken; relative clause: who sings; parenthesis: brackets; modal verb: should."
              - id: l2-f5
                type: multiple_choice
                text: "\"The castle was stormed at midnight.\"\n\nWhich explanation uses the terms well?"
                options: ["The writer uses the passive, so the focus is on the castle, not on who attacked it.", "The writer uses a modal verb to show it might happen.", "It is a good sentence."]
                answer: "The writer uses the passive, so the focus is on the castle, not on who attacked it."
                option_audio: false
                hints:
                  - "Name the feature and its effect."
                  - "Was stormed is passive."
                  - "The passive one."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "\"The film, which lasted three hours, was boring.\"\n\nWhat is \"which lasted three hours\"?"
                options: ["a relative clause", "a modal verb", "ellipsis"]
                answer: "a relative clause"
                hints: ["It starts with a relative pronoun."]
              - id: l2-s2
                type: multiple_choice
                text: "\"The storm flattened the tent.\"\n\nActive or passive?"
                options: ["active", "passive"]
                answer: "active"
                hints: ["Does the storm do the action?"]
              - id: l2-s3
                type: multiple_choice
                text: "\"The fox crept forward. It sniffed the air.\"\n\nThe pronoun \"it\" links the sentences. What is this called?"
                options: ["cohesion", "parenthesis", "a determiner"]
                answer: "cohesion"
                hints: ["How a text sticks together."]
              - id: l2-s4
                type: matching
                text: "Match each term to its example."
                pairs:
                  - { left: { text: "determiner" }, right: { text: "those" } }
                  - { left: { text: "ellipsis" }, right: { text: "I can swim; Sam can't." } }
                  - { left: { text: "object" }, right: { text: "the ball, in \"Jo threw the ball\"" } }
                hints: ["Ellipsis leaves words out."]
              - id: l2-s5
                type: multiple_choice
                text: "\"You must not open this door.\"\n\nWhich explanation uses the terms well?"
                options: ["The modal verb must shows the rule is strict.", "The relative clause shows who opened it.", "It is in the passive."]
                answer: "The modal verb must shows the rule is strict."
                option_audio: false
                hints: ["Which word shows how necessary it is?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "\"Our dog, a lazy old spaniel, sleeps all day.\"\n\nWhat do the commas mark?"
                options: ["parenthesis", "a list", "ellipsis"]
                answer: "parenthesis"
              - id: l2-n2
                type: multiple_choice
                text: "\"The cakes were sold in ten minutes.\"\n\nActive or passive?"
                options: ["passive", "active"]
                answer: "passive"
              - id: l2-n3
                type: multiple_choice
                text: "\"Later that day, the rain stopped.\"\n\n\"Later that day\" links back to earlier in the text. Which term describes this?"
                options: ["cohesion", "a relative clause", "a modal verb"]
                answer: "cohesion"
              - id: l2-n4
                type: matching
                text: "Match each term to its example."
                pairs:
                  - { left: { text: "subject" }, right: { text: "the bird, in \"the bird sang\"" } }
                  - { left: { text: "relative pronoun" }, right: { text: "whose" } }
                  - { left: { text: "passive" }, right: { text: "The cup was dropped." } }
              - id: l2-n5
                type: multiple_choice
                text: "\"The old man, who had lived alone for years, smiled.\"\n\nWhich explanation uses the terms well?"
                options: ["The relative clause adds information that helps us understand why the smile matters.", "The modal verb shows he must smile.", "The passive hides who smiled."]
                answer: "The relative clause adds information that helps us understand why the smile matters."
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tap the subject of the sentence."
            show: { drawn: letter-card, text: "Before the match, Leo warmed up." }
            spans: ["Leo"]
          - id: l2-c2
            type: multiple_choice
            text: "\"The chef chopped the onions.\"\n\nWhat is the object?"
            options: ["the onions", "the chef", "chopped"]
            answer: "the onions"
          - id: l2-c3
            type: highlight_in_text
            text: "Tap the modal verb."
            show: { drawn: letter-card, text: "Everyone would enjoy a day off." }
            spans: ["would"]
          - id: l2-c4
            type: multiple_choice
            text: "\"Paris (the capital of France) is busy.\"\n\nWhat do the brackets show?"
            options: ["parenthesis", "a relative clause", "a modal verb"]
            answer: "parenthesis"
          - id: l2-c5
            type: multiple_choice
            text: "\"The bridge was closed last night.\"\n\nActive or passive?"
            options: ["passive", "active"]
            answer: "passive"
