# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-school
skill: fl.themes.school
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: In der Schule (Französisch)
  en: At school in French
summary: >
  School things and classroom phrases in French. Lesson 1 brings un
  crayon (a pencil, not a crayon), un stylo, une gomme, une règle, des
  ciseaux, une trousse and un cartable, and what is in a pencil case.
  Lesson 2 brings the phrases a child needs in class: je peux avoir ...,
  s'il vous plaît ?, voilà, je ne comprends pas, répétez, s'il vous plaît
  and j'ai fini !, and ends with the skill check. Instructions are in
  English; the French is heard. Speaking is practised, not marked.
metadata:
  year: ly-1
  topic: { de: Schule, en: School }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.classroom-phrases]
  also_practises: [fl.speaking.name-things, fl.themes.hello]
  vocabulary: { fr: [un crayon, un stylo, une gomme, une règle, des ciseaux, une trousse, un cartable, un livre, "je peux avoir ..., s'il vous plaît ?", voilà, je ne comprends pas, "répétez, s'il vous plaît", "j'ai fini !"] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: things, what: { de: Schulsachen verstehen, en: understanding school things } }
    - { id: asking, what: { de: "um etwas bitten und die Antwort verstehen (je peux avoir ..., voilà)", en: "asking for something and understanding the reply (je peux avoir ..., voilà)" } }
    - { id: phrases, what: { de: "je ne comprends pas, répétez und j'ai fini verstehen", en: "understanding je ne comprends pas, répétez and j'ai fini" } }
  misconceptions:
    - id: crayon-false-friend
      what: Takes un crayon for a wax crayon, when it means a pencil
      addressed: lesson 1 Learn says un crayon is a pencil; l1-f2 gives feedback when the wax crayon is chosen, l1-f1 when the pencil is taken for un stylo, and l1-n5 shows a wax crayon for un crayon
    - id: trousse-cartable
      what: Mixes up une trousse (pencil case) and un cartable (school bag)
      addressed: l1-f6 gives feedback when the pencil case is taken for un cartable; l1-s1, l1-n1 and l2-c1 set the two side by side
    - id: phrase-mix
      what: Mixes up the classroom phrases je ne comprends pas, répétez and j'ai fini
      addressed: l2-f2 gives feedback when j'ai fini is chosen for je ne comprends pas; l2-f5, l2-s1, l2-n1, l2-n5 and l2-c4 ask what a phrase means or when you say it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Dans ma trousse", en: "Dans ma trousse" }
    goal:
      de: "Benenne die Sachen in deinem Mäppchen auf Französisch, zum Beispiel un stylo und une gomme."
      en: "Name the things in your pencil case in French, like un stylo and une gomme."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "What should you do?"
            say: { en: "Listen. What should you do? Tap the picture." }
            audio: { fr: "Levez-vous !" }
            options: [{ object: sit-down }, { object: stand-up }]
            answer: stand-up
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "What should you do?"
            say: { en: "Listen. What should you do? Tap the picture." }
            audio: { fr: "Ouvrez vos livres !" }
            options: [{ object: book-open }, { object: listen }]
            answer: book-open
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Things for school in French. Careful: un crayon is a pencil. Un stylo is a pen.", fr: "Un crayon. Un stylo." }
            show: { object: pencil }
          - say: { en: "Une gomme is a rubber. Une règle is a ruler.", fr: "Une gomme. Une règle." }
            show: { object: rubber }
          - say: { en: "Scissors are des ciseaux. Your pencil case is une trousse, and your school bag is un cartable.", fr: "Des ciseaux. Une trousse. Un cartable." }
            show: { object: pencil-case }
          - say: { en: "Listen to what Léa has in her pencil case.", fr: "Dans ma trousse, j'ai un crayon, un stylo et une gomme." }
            show: { object: pencil-case }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Un stylo." }
                options: [{ object: pencil }, { object: pen }, { object: ruler }]
                answer: pen
                feedback:
                  pencil: "That is un crayon. Un stylo is a pen."
                hints:
                  - "Listen again: un stylo."
                  - "Un stylo writes in ink."
                  - "Tap the pen."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Un crayon." }
                options: [{ object: crayon }, { object: pencil }, { object: pen }]
                answer: pencil
                feedback:
                  crayon: "It sounds like crayon, but in French un crayon is a pencil."
                hints:
                  - "Listen again: un crayon."
                  - "Careful: in French, un crayon is not a wax crayon."
                  - "Un crayon is a pencil. Tap the pencil."
              - id: l1-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Une gomme." }
                show: { object: rubber }
                answer: true
                hints:
                  - "Listen again: une gomme."
                  - "Une gomme rubs out pencil marks."
                  - "Yes. Une gomme is a rubber."
              - id: l1-f4
                type: speak
                say: { en: "Say it in French.", fr: "Une règle." }
                show: { object: ruler }
                expected_text: "une règle"
                hints:
                  - "Listen again: une règle."
                  - "Règle is one beat: say rè, and finish with a quick gl."
                  - "Say it with me: une règle."
              - id: l1-f5
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Des ciseaux." }
                options: [{ object: ruler }, { object: scissors }, { object: schoolbag }]
                answer: scissors
                hints:
                  - "Listen again: des ciseaux."
                  - "Des ciseaux cut paper."
                  - "Tap the scissors."
              - id: l1-f6
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Un cartable." }
                show: { object: pencil-case }
                answer: false
                feedback:
                  "true": "This is une trousse, a pencil case. Un cartable is a school bag."
                hints:
                  - "Listen again: un cartable."
                  - "Un cartable is big: you carry all your books in it."
                  - "No. This is une trousse, a pencil case."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Une trousse." }
                options: [{ object: schoolbag }, { object: pencil-case }, { object: book }]
                answer: pencil-case
                hints: ["Une trousse holds your pencils."]
              - id: l1-s2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Un stylo." }
                show: { object: pen }
                answer: true
                hints: ["Un stylo is a pen."]
              - id: l1-s3
                type: speak
                say: { en: "Say it in French.", fr: "Un crayon." }
                show: { object: pencil }
                expected_text: "un crayon"
                hints: ["Cray-on, with the on through your nose."]
              - id: l1-s4
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Une règle." }
                options: [{ object: rubber }, { object: pencil }, { object: ruler }]
                answer: ruler
                hints: ["Une règle helps you draw straight lines."]
              - id: l1-s5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Une gomme." }
                show: { object: ruler }
                answer: false
                hints: ["Une gomme rubs out pencil marks."]
              - id: l1-s6
                type: audio_choice
                text: "What is in Hugo's pencil case?"
                say: { en: "Listen. What is in Hugo's pencil case?" }
                audio: { fr: "Dans ma trousse, j'ai un stylo et une règle.", speaker: male }
                options: ["a pen and a ruler", "a pencil and a rubber", "scissors and a pen"]
                answer: "a pen and a ruler"
                hints: ["Listen for two things after j'ai."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Un cartable." }
                options: [{ object: pencil-case }, { object: book }, { object: schoolbag }]
                answer: schoolbag
              - id: l1-n2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Des ciseaux." }
                show: { object: scissors }
                answer: true
              - id: l1-n3
                type: speak
                say: { en: "What is it? Say it in French." }
                show: { object: rubber }
                expected_text: "une gomme"
              - id: l1-n4
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Une gomme." }
                options: [{ object: crayon }, { object: rubber }, { object: pencil }]
                answer: rubber
              - id: l1-n5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Un crayon." }
                show: { object: crayon }
                answer: false
              - id: l1-n6
                type: audio_choice
                text: "What is in Léa's pencil case?"
                say: { en: "Listen. What is in Léa's pencil case?" }
                audio: { fr: "Dans ma trousse, j'ai des ciseaux et une gomme.", speaker: female }
                options: ["scissors and a ruler", "scissors and a rubber", "a pen and a rubber"]
                answer: "scissors and a rubber"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Un stylo." }
            options: [{ object: rubber }, { object: pen }, { object: scissors }]
            answer: pen
          - id: l1-c2
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Une trousse." }
            show: { object: pencil-case }
            answer: true
          - id: l1-c3
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Une règle." }
            options: [{ object: ruler }, { object: pen }, { object: schoolbag }]
            answer: ruler
          - id: l1-c4
            type: audio_choice
            text: "You hear two words. Tap the one you hear first."
            say: { en: "Listen. You hear two words. Tap the one you hear first." }
            audio: { turns: [{ fr: "Un crayon." }, { fr: "Une gomme." }] }
            options: [{ object: rubber }, { object: crayon }, { object: pencil }]
            answer: pencil
          - id: l1-c5
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Un cartable." }
            show: { object: schoolbag }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "Hugo says what is in his pencil case. What is not in it? Tap the picture."
            say: { en: "Listen. Hugo says what is in his pencil case. What is not in it? Tap the picture." }
            audio: { fr: "Dans ma trousse, j'ai des ciseaux et un stylo.", speaker: male }
            options: [{ object: scissors }, { object: ruler }, { object: pen }]
            answer: ruler

  - n: 2
    title: { de: "Je peux avoir ...", en: "Je peux avoir ..." }
    goal:
      de: "Bitte im Unterricht auf Französisch um etwas, zum Beispiel je peux avoir une gomme, und sag, wenn du etwas nicht verstehst."
      en: "Ask for things in class in French, like je peux avoir une gomme, and say when you do not understand."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Do you remember? Tap the picture." }
            audio: { fr: "Une gomme." }
            options: [{ object: ruler }, { object: rubber }]
            answer: rubber
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Does the picture match?"
            say: { en: "Do you remember? Does the picture match?", fr: "Un crayon." }
            show: { object: pencil }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "To ask for something in class, say je peux avoir, can I have, then the thing, then s'il vous plaît.", fr: "Je peux avoir une gomme, s'il vous plaît ?" }
            show: { object: rubber }
          - say: { en: "When someone gives it to you, they say voilà, here you are. You say merci.", fr: "Oui, voilà ! Merci !" }
          - say: { en: "If you do not understand, say je ne comprends pas. To hear it again, say répétez, s'il vous plaît.", fr: "Je ne comprends pas. Répétez, s'il vous plaît." }
            show: { object: teacher }
          - say: { en: "When your work is done, say j'ai fini !", fr: "J'ai fini !" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "What does Hugo want?"
                say: { en: "Listen. What does Hugo want? Tap the picture." }
                audio: { fr: "Je peux avoir un stylo, s'il vous plaît ?", speaker: male }
                options: [{ object: pencil }, { object: pen }, { object: scissors }]
                answer: pen
                hints:
                  - "Listen for the thing after je peux avoir."
                  - "Un stylo is a pen."
                  - "Tap the pen."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "What does it mean?"
                say: { en: "Listen. What does it mean?" }
                audio: { fr: "Je ne comprends pas.", speaker: female }
                options: ["I don't understand.", "I have finished.", "Can I have a pencil?"]
                answer: "I don't understand."
                feedback:
                  "I have finished.": "That is j'ai fini. Je ne comprends pas means I don't understand."
                hints:
                  - "Listen for ne ... pas. It means not."
                  - "Comprends sounds a little like comprehend: to understand."
                  - "I don't understand."
              - id: l2-f3
                type: true_false
                text: "Is someone asking for something?"
                say: { en: "Listen. Is someone asking for something?" }
                audio: { fr: "Je peux avoir une règle, s'il vous plaît ?", speaker: male }
                answer: true
                hints:
                  - "Listen to the start: je peux avoir."
                  - "Je peux avoir means can I have."
                  - "Yes. Someone is asking for a ruler."
              - id: l2-f4
                type: speak
                say: { en: "Ask your teacher for a rubber.", fr: "Je peux avoir une gomme, s'il vous plaît ?" }
                show: { object: rubber }
                expected_text: "je peux avoir une gomme s'il vous plaît"
                hints:
                  - "Listen again, then start with je peux avoir."
                  - "Then une gomme, then s'il vous plaît, because she is your teacher."
                  - "Say it with me: Je peux avoir une gomme, s'il vous plaît ?"
              - id: l2-f5
                type: audio_choice
                text: "When do you say it?"
                say: { en: "Listen. When do you say it?" }
                audio: { fr: "J'ai fini !", speaker: male }
                options: ["when your work is done", "when you want something", "when you don't understand"]
                answer: "when your work is done"
                hints:
                  - "Listen again: j'ai fini."
                  - "Fini sounds like finished."
                  - "When your work is done."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "What does it mean?"
                say: { en: "Listen. What does it mean?" }
                audio: { fr: "Répétez, s'il vous plaît." }
                options: ["Say it again, please.", "Sit down, please.", "I have finished."]
                answer: "Say it again, please."
                hints: ["Répétez sounds like repeat."]
              - id: l2-s2
                type: true_false
                text: "Is someone asking for something?"
                say: { en: "Listen. Is someone asking for something?" }
                audio: { fr: "J'ai fini !", speaker: female }
                answer: false
                hints: ["Do you hear je peux avoir?"]
              - id: l2-s3
                type: audio_choice
                text: "What does Léa want?"
                say: { en: "Listen. What does Léa want? Tap the picture." }
                audio: { fr: "Je peux avoir des ciseaux, s'il vous plaît ?", speaker: female }
                options: [{ object: ruler }, { object: schoolbag }, { object: scissors }]
                answer: scissors
                hints: ["Des ciseaux cut paper."]
              - id: l2-s4
                type: speak
                say: { en: "You do not understand. Tell your teacher.", fr: "Je ne comprends pas." }
                show: { object: teacher }
                expected_text: "je ne comprends pas"
                hints: ["Je ne comprends pas: ne and pas go either side of comprends."]
              - id: l2-s5
                type: true_false
                text: "Does the reply fit?"
                say: { en: "Listen to the question and the reply. Does the reply fit?" }
                audio: { turns: [{ fr: "Je peux avoir un crayon ?", speaker: male }, { fr: "Oui, voilà !", speaker: female }] }
                answer: true
                hints: ["Voilà means here you are."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "What does it mean?"
                say: { en: "Listen. What does it mean?" }
                audio: { fr: "J'ai fini !", speaker: female }
                options: ["I don't understand.", "I have finished.", "Can I have a pencil?"]
                answer: "I have finished."
              - id: l2-n2
                type: audio_choice
                text: "What does Tom want?"
                say: { en: "Listen. What does Tom want? Tap the picture." }
                audio: { fr: "Je peux avoir un livre, s'il vous plaît ?", speaker: male }
                options: [{ object: schoolbag }, { object: book }, { object: pen }]
                answer: book
              - id: l2-n3
                type: true_false
                text: "Does the reply fit?"
                say: { en: "Listen to the question and the reply. Does the reply fit?" }
                audio: { turns: [{ fr: "Je peux avoir une règle ?", speaker: female }, { fr: "Bonsoir !", speaker: male }] }
                answer: false
              - id: l2-n4
                type: speak
                say: { en: "Ask your teacher for a pencil in French." }
                show: { object: pencil }
                expected_text: "je peux avoir un crayon s'il vous plaît"
              - id: l2-n5
                type: audio_choice
                text: "When do you say it?"
                say: { en: "Listen. When do you say it?" }
                audio: { fr: "Répétez, s'il vous plaît." }
                options: ["when you want to hear it again", "when your work is done", "when you want something to write with"]
                answer: "when you want to hear it again"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: things
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Voilà ton cartable !" }
            options: [{ object: pencil-case }, { object: schoolbag }, { object: book }]
            answer: schoolbag
          - id: l2-c2
            part: asking
            type: audio_choice
            text: "What does Inès want?"
            say: { en: "Listen. What does Inès want? Tap the picture." }
            audio: { fr: "Je peux avoir une trousse, s'il vous plaît ?", speaker: female }
            options: [{ object: ruler }, { object: pencil-case }, { object: schoolbag }]
            answer: pencil-case
          - id: l2-c3
            part: things
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Un stylo." }
            show: { object: pencil }
            answer: false
          - id: l2-c4
            part: phrases
            type: audio_choice
            text: "What does it mean?"
            say: { en: "Listen. What does it mean?" }
            audio: { fr: "Je ne comprends pas, madame.", speaker: male }
            options: ["Say it again, please.", "Here you are.", "I don't understand."]
            answer: "I don't understand."
          - id: l2-c5
            part: asking
            type: true_false
            text: "Does the reply fit?"
            say: { en: "Listen to the question and the reply. Does the reply fit?" }
            audio: { turns: [{ fr: "Je peux avoir des ciseaux ?", speaker: female }, { fr: "Merci !", speaker: male }] }
            answer: false
          - id: l2-c6
            part: things
            type: audio_choice
            text: "You hear two words. Tap the one you hear second."
            say: { en: "Listen. You hear two words. Tap the one you hear second." }
            audio: { turns: [{ fr: "Une gomme." }, { fr: "Des ciseaux." }] }
            options: [{ object: rubber }, { object: ruler }, { object: scissors }]
            answer: scissors
          - id: l2-c7
            part: things
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Une règle." }
            show: { object: ruler }
            answer: true
          - id: l2-c8
            part: things
            type: audio_choice
            text: "Léa says what is in her pencil case. What is not in it? Tap the picture."
            say: { en: "Listen. Léa says what is in her pencil case. What is not in it? Tap the picture." }
            audio: { fr: "Dans ma trousse, j'ai un crayon et une règle.", speaker: female }
            options: [{ object: pencil }, { object: scissors }, { object: ruler }]
            answer: scissors
          - id: l2-c9
            part: things
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Une trousse." }
            show: { object: schoolbag }
            answer: false
          - id: l2-c10
            part: things
            type: audio_choice
            text: "You hear two words. Which picture is not one of them? Tap it."
            say: { en: "Listen. You hear two words. Which picture is not one of them? Tap it." }
            audio: { turns: [{ fr: "Un stylo." }, { fr: "Un cartable." }] }
            options: [{ object: pen }, { object: pencil-case }, { object: schoolbag }]
            answer: pencil-case
          - id: l2-c11
            part: asking
            type: audio_choice
            text: "Théo asks his teacher for something. What does she give him? Tap the picture."
            say: { en: "Listen. Théo asks his teacher for something. What does she give him? Tap the picture." }
            audio: { turns: [{ fr: "Je peux avoir une gomme, s'il vous plaît ?", speaker: male }, { fr: "Oui, voilà !", speaker: female }] }
            options: [{ object: ruler }, { object: rubber }, { object: pen }]
            answer: rubber
          - id: l2-c12
            part: asking
            type: true_false
            text: "Is Léa asking for a ruler?"
            say: { en: "Listen. Is Léa asking for a ruler?" }
            audio: { fr: "Je peux avoir un stylo, s'il vous plaît ?", speaker: female }
            answer: false
          - id: l2-c13
            part: asking
            type: audio_choice
            text: "Hugo asks for a pencil. What does the teacher mean?"
            say: { en: "Listen. Hugo asks for a pencil. What does the teacher mean?" }
            audio: { turns: [{ fr: "Je peux avoir un crayon, s'il vous plaît ?", speaker: male }, { fr: "Voilà !", speaker: female }] }
            options: ["Here you are.", "Thank you.", "Say it again."]
            answer: "Here you are."
