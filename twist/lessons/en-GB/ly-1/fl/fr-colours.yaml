# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-colours
skill: fl.themes.colours
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Farben (Französisch)
  en: Colours in French
summary: >
  Ten colours in French, heard and said, put on things and used to say a
  favourite colour. Lesson 1 brings rouge, bleu, jaune, vert and orange
  and the answer c'est rouge; lesson 2 adds violet, rose, marron, noir and
  blanc, ma couleur préférée, c'est ... and j'aime le ..., and ends with
  the skill check. Instructions are in English; the French is heard.
  Speaking is practised, not marked.
metadata:
  year: ly-1
  topic: { de: Farben, en: Colours }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.speaking.imitate, fl.speaking.name-things]
  vocabulary: { fr: [rouge, bleu, jaune, vert, orange, violet, rose, marron, noir, blanc, la couleur, "C'est de quelle couleur ?", "c'est ...", "ma couleur préférée, c'est ...", "j'aime le ..."] }
  forms: [audio, picture, drawn]
  drawn: [colour-swatch]
  facets: []
  misconceptions:
    - id: rose-is-red
      what: Hears rose and thinks of red, because an English rose is often a red flower
      addressed: lesson 2 Learn says rose means pink; l2-f1 gives feedback when red is chosen, and l2-s4, l2-n3 and l2-c5 set rose against red and purple
    - id: violet-pink
      what: Mixes up violet and rose, the two new colours that sit next to each other
      addressed: l2-f2 gives feedback when pink is chosen for violet; l2-s2 and l2-n2 ask for violet again with pink beside it
    - id: silent-ending
      what: Says the last letter of vert or blanc, as English would
      addressed: the speak hint in l1-s3 says the t of vert is silent; lesson 2 Learn says blanc and noir aloud, and l1-n3 asks for vert again without a model
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Rouge, bleu, jaune", en: "Rouge, bleu, jaune" }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Colours in French. Listen, then say it after me.", fr: "Rouge. Rouge." }
            show: { object: crayon, colour: red }
          - say: { en: "Blue, and yellow:", fr: "Bleu. Jaune." }
            show: { object: crayon, colour: blue }
          - say: { en: "Green. You do not say the t at the end:", fr: "Vert. Vert." }
            show: { object: crayon, colour: green }
          - say: { en: "Orange looks the same as in English, but it sounds French. To ask the colour, say c'est de quelle couleur ? The answer starts with c'est.", fr: "Orange. C'est de quelle couleur ? C'est orange." }
            show: { object: crayon, colour: orange }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which colour do you hear?"
                say: { en: "Listen. Which colour do you hear?" }
                audio: { fr: "Rouge." }
                options:
                  - { drawn: colour-swatch, colour: red }
                  - { drawn: colour-swatch, colour: blue }
                  - { drawn: colour-swatch, colour: yellow }
                answer: red
                hints:
                  - "Listen again: rouge."
                  - "Rouge is the colour of a strawberry."
                  - "Tap the red colour."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which colour do you hear?"
                say: { en: "Listen. Which colour do you hear?" }
                audio: { fr: "Vert." }
                options:
                  - { drawn: colour-swatch, colour: yellow }
                  - { drawn: colour-swatch, colour: green }
                  - { drawn: colour-swatch, colour: blue }
                answer: green
                feedback:
                  blue: "That is bleu. Vert is the colour of a frog."
                hints:
                  - "Listen again: vert."
                  - "Vert is the colour of grass and frogs."
                  - "Tap the green colour."
              - id: l1-f3
                type: true_false
                text: "Does the colour match?"
                say: { en: "Listen. Does the colour match?", fr: "Jaune." }
                show: { object: crayon, colour: yellow }
                answer: true
                hints:
                  - "Listen again: jaune."
                  - "Jaune is the colour of a banana. What colour is the crayon?"
                  - "Yes. The crayon is yellow: jaune."
              - id: l1-f4
                type: speak
                say: { en: "Say the colour in French.", fr: "Bleu." }
                show: { object: crayon, colour: blue }
                expected_text: "bleu"
                hints:
                  - "Listen again: bleu."
                  - "For the eu, make your lips round, as if to say oo."
                  - "Say it with me: bleu."
              - id: l1-f5
                type: matching
                text: "Match each colour to a picture."
                say: { en: "Tap a colour, then tap the thing that has that colour." }
                pairs:
                  - left: { drawn: colour-swatch, colour: red, say: { fr: "Rouge." } }
                    right: { object: strawberry }
                  - left: { drawn: colour-swatch, colour: yellow, say: { fr: "Jaune." } }
                    right: { object: banana }
                  - left: { drawn: colour-swatch, colour: green, say: { fr: "Vert." } }
                    right: { object: frog }
                  - left: { drawn: colour-swatch, colour: orange, say: { fr: "Orange." } }
                    right: { object: carrot }
                hints:
                  - "Tap a colour to hear it in French."
                  - "Start with the one you are sure of: what colour is a banana?"
                  - "Rouge goes with the strawberry, jaune with the banana, vert with the frog, orange with the carrot."
              - id: l1-f6
                type: audio_choice
                text: "Tap the ball."
                say: { en: "Listen. Which ball is it? Tap it." }
                audio: { fr: "C'est vert." }
                options:
                  - { object: ball, colour: green }
                  - { object: ball, colour: blue }
                  - { object: ball, colour: red }
                answer: green
                hints:
                  - "Listen for the colour after c'est."
                  - "C'est means it is. Vert is the colour."
                  - "Tap the green ball."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which colour do you hear?"
                say: { en: "Listen. Which colour do you hear?" }
                audio: { fr: "Bleu." }
                options:
                  - { drawn: colour-swatch, colour: green }
                  - { drawn: colour-swatch, colour: orange }
                  - { drawn: colour-swatch, colour: blue }
                answer: blue
                hints: ["Bleu sounds a little like blue."]
              - id: l1-s2
                type: true_false
                text: "Does the colour match?"
                say: { en: "Listen. Does the colour match?", fr: "Rouge." }
                show: { object: crayon, colour: orange }
                answer: false
                hints: ["Rouge is the colour of a strawberry. Is this crayon that colour?"]
              - id: l1-s3
                type: speak
                say: { en: "Say the colour in French.", fr: "Vert." }
                show: { object: crayon, colour: green }
                expected_text: "vert"
                hints: ["You do not say the t at the end of vert."]
              - id: l1-s4
                type: audio_choice
                text: "Tap the car."
                say: { en: "Listen. Which car is it? Tap it." }
                audio: { fr: "C'est jaune." }
                options:
                  - { object: car, colour: red }
                  - { object: car, colour: yellow }
                  - { object: car, colour: green }
                answer: yellow
                hints: ["Jaune is the colour of a banana."]
              - id: l1-s5
                type: sorting
                text: "Sort the pictures by colour."
                say: { en: "Put each picture with its colour." }
                bins:
                  - { id: red, show: { drawn: colour-swatch, colour: red }, say: { fr: "Rouge." } }
                  - { id: yellow, show: { drawn: colour-swatch, colour: yellow }, say: { fr: "Jaune." } }
                options:
                  - { object: strawberry, bin: red }
                  - { object: banana, bin: yellow }
                  - { object: tomato, bin: red }
                  - { object: sun, bin: yellow }
                hints: ["Tap a colour to hear it. Rouge is red, jaune is yellow."]
              - id: l1-s6
                type: true_false
                text: "Does the colour match?"
                say: { en: "Listen. Does the colour match?", fr: "Orange." }
                show: { object: crayon, colour: orange }
                answer: true
                hints: ["Orange sounds French, but it is the same colour."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which colour do you hear?"
                say: { en: "Listen. Which colour do you hear?" }
                audio: { fr: "Jaune." }
                options:
                  - { drawn: colour-swatch, colour: yellow }
                  - { drawn: colour-swatch, colour: orange }
                  - { drawn: colour-swatch, colour: green }
                answer: yellow
              - id: l1-n2
                type: audio_choice
                text: "Tap the balloon."
                say: { en: "Listen. Which balloon is it? Tap it." }
                audio: { fr: "C'est orange." }
                options:
                  - { object: balloon, colour: red }
                  - { object: balloon, colour: blue }
                  - { object: balloon, colour: orange }
                answer: orange
              - id: l1-n3
                type: speak
                say: { en: "What colour is the frog? Say it in French." }
                show: { object: frog }
                expected_text: "vert"
              - id: l1-n4
                type: true_false
                text: "Does the colour match?"
                say: { en: "Listen. Does the colour match?", fr: "Vert." }
                show: { object: crayon, colour: blue }
                answer: false
              - id: l1-n5
                type: matching
                text: "Match each colour to a picture."
                say: { en: "Tap a colour, then tap the thing that has that colour." }
                pairs:
                  - left: { drawn: colour-swatch, colour: blue, say: { fr: "Bleu." } }
                    right: { object: bird }
                  - left: { drawn: colour-swatch, colour: red, say: { fr: "Rouge." } }
                    right: { object: tomato }
                  - left: { drawn: colour-swatch, colour: green, say: { fr: "Vert." } }
                    right: { object: leaf, colour: green }
                  - left: { drawn: colour-swatch, colour: yellow, say: { fr: "Jaune." } }
                    right: { object: sun }
              - id: l1-n6
                type: true_false
                text: "Does the colour match?"
                say: { en: "Listen. Does the colour match?", fr: "Bleu." }
                show: { object: bird }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which colour do you hear?"
            say: { en: "Listen. Which colour do you hear?" }
            audio: { fr: "Rouge." }
            options:
              - { drawn: colour-swatch, colour: orange }
              - { drawn: colour-swatch, colour: red }
              - { drawn: colour-swatch, colour: yellow }
            answer: red
          - id: l1-c2
            type: true_false
            text: "Does the colour match?"
            say: { en: "Listen. Does the colour match?", fr: "Jaune." }
            show: { object: crayon, colour: green }
            answer: false
          - id: l1-c3
            type: audio_choice
            text: "Tap the ball."
            say: { en: "Listen. Which ball is it? Tap it." }
            audio: { fr: "C'est bleu." }
            options:
              - { object: ball, colour: green }
              - { object: ball, colour: red }
              - { object: ball, colour: blue }
            answer: blue

  - n: 2
    title: { de: "Rose, violet, noir", en: "Rose, violet, noir" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which colour do you hear?"
            say: { en: "Do you remember? Which colour do you hear?" }
            audio: { fr: "Vert." }
            options:
              - { drawn: colour-swatch, colour: green }
              - { drawn: colour-swatch, colour: red }
              - { drawn: colour-swatch, colour: blue }
            answer: green
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Does the colour match?"
            say: { en: "Do you remember? Does the colour match?", fr: "Rouge." }
            show: { object: strawberry }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "More colours. Purple is violet.", fr: "Violet. Violet." }
            show: { object: crayon, colour: purple }
          - say: { en: "Pink is rose. Careful: rose means pink, not red.", fr: "Rose. Rose." }
            show: { object: crayon, colour: pink }
          - say: { en: "Brown is marron. Black is noir. White is blanc, and you do not say the c.", fr: "Marron. Noir. Blanc." }
            show: { object: crayon, colour: brown }
          - say: { en: "To say your favourite colour: ma couleur préférée, c'est ... Or just: j'aime le ...", fr: "Ma couleur préférée, c'est le vert. J'aime le vert." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which colour do you hear?"
                say: { en: "Listen. Which colour do you hear?" }
                audio: { fr: "Rose." }
                options:
                  - { drawn: colour-swatch, colour: red }
                  - { drawn: colour-swatch, colour: pink }
                  - { drawn: colour-swatch, colour: purple }
                answer: pink
                feedback:
                  red: "Rose means pink. Red is rouge."
                hints:
                  - "Listen again: rose."
                  - "In French, rose is a colour, and it is not red."
                  - "Tap the pink colour."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which colour do you hear?"
                say: { en: "Listen. Which colour do you hear?" }
                audio: { fr: "Violet." }
                options:
                  - { drawn: colour-swatch, colour: pink }
                  - { drawn: colour-swatch, colour: blue }
                  - { drawn: colour-swatch, colour: purple }
                answer: purple
                feedback:
                  pink: "That is rose. Violet means purple."
                hints:
                  - "Listen again: violet."
                  - "A violet is a small purple flower."
                  - "Tap the purple colour."
              - id: l2-f3
                type: true_false
                text: "Does the colour match?"
                say: { en: "Listen. Does the colour match?", fr: "Marron." }
                show: { object: crayon, colour: brown }
                answer: true
                hints:
                  - "Listen again: marron."
                  - "Marron is the colour of chocolate."
                  - "Yes. The crayon is brown: marron."
              - id: l2-f4
                type: audio_choice
                text: "Which colour is the favourite?"
                say: { en: "Listen. Which colour is the favourite?" }
                audio: { fr: "Ma couleur préférée, c'est le noir." }
                options:
                  - { drawn: colour-swatch, colour: white }
                  - { drawn: colour-swatch, colour: black }
                  - { drawn: colour-swatch, colour: brown }
                answer: black
                hints:
                  - "Listen for the colour at the end."
                  - "Noir is the colour of the night sky."
                  - "Tap black."
              - id: l2-f5
                type: speak
                say: { en: "Say your favourite colour in French. You can say it like this:", fr: "Ma couleur préférée, c'est le rose." }
                expected_text: "ma couleur préférée c'est le rose"
                hints:
                  - "Listen again, then start with ma couleur préférée."
                  - "Then say c'est le and your colour."
                  - "Say it with me: Ma couleur préférée, c'est le rose."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Does the colour match?"
                say: { en: "Listen. Does the colour match?", fr: "Noir." }
                show: { drawn: colour-swatch, colour: white }
                answer: false
                hints: ["Noir is the colour of the night sky."]
              - id: l2-s2
                type: audio_choice
                text: "Tap the T-shirt."
                say: { en: "Listen. Which T-shirt is it? Tap it." }
                audio: { fr: "C'est violet." }
                options:
                  - { object: t-shirt, colour: pink }
                  - { object: t-shirt, colour: purple }
                  - { object: t-shirt, colour: blue }
                answer: purple
                hints: ["Violet is purple, not pink."]
              - id: l2-s3
                type: audio_choice
                text: "Which colour is the favourite?"
                say: { en: "Listen. Which colour is the favourite?" }
                audio: { fr: "Ma couleur préférée, c'est le blanc." }
                options:
                  - { drawn: colour-swatch, colour: white }
                  - { drawn: colour-swatch, colour: black }
                  - { drawn: colour-swatch, colour: yellow }
                answer: white
                hints: ["Blanc is the colour of snow."]
              - id: l2-s4
                type: true_false
                text: "Does the colour match?"
                say: { en: "Listen. Does the colour match?", fr: "Rose." }
                show: { object: crayon, colour: red }
                answer: false
                hints: ["Rose means pink. Is this crayon pink?"]
              - id: l2-s5
                type: speak
                say: { en: "Say the colour in French.", fr: "Marron." }
                show: { object: crayon, colour: brown }
                expected_text: "marron"
                hints: ["Ma-ron, with the r at the back of your throat."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which colour do you hear?"
                say: { en: "Listen. Which colour do you hear?" }
                audio: { fr: "Blanc." }
                options:
                  - { drawn: colour-swatch, colour: black }
                  - { drawn: colour-swatch, colour: pink }
                  - { drawn: colour-swatch, colour: white }
                answer: white
              - id: l2-n2
                type: true_false
                text: "Does the colour match?"
                say: { en: "Listen. Does the colour match?", fr: "Violet." }
                show: { object: crayon, colour: purple }
                answer: true
              - id: l2-n3
                type: audio_choice
                text: "Tap the balloon."
                say: { en: "Listen. Which balloon is it? Tap it." }
                audio: { fr: "C'est rose." }
                options:
                  - { object: balloon, colour: red }
                  - { object: balloon, colour: purple }
                  - { object: balloon, colour: pink }
                answer: pink
              - id: l2-n4
                type: audio_choice
                text: "What colour does Hugo like?"
                say: { en: "Listen. What colour does Hugo like?" }
                audio: { fr: "Salut ! Je m'appelle Hugo. J'aime le marron.", speaker: male }
                options:
                  - { drawn: colour-swatch, colour: orange }
                  - { drawn: colour-swatch, colour: brown }
                  - { drawn: colour-swatch, colour: black }
                answer: brown
              - id: l2-n5
                type: speak
                say: { en: "What colour is the crayon? Say it in French." }
                show: { object: crayon, colour: pink }
                expected_text: "rose"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Tap the jumper."
            say: { en: "Listen. Which jumper is it? Tap it." }
            audio: { fr: "C'est rouge." }
            options:
              - { object: jumper, colour: blue }
              - { object: jumper, colour: red }
              - { object: jumper, colour: yellow }
            answer: red
          - id: l2-c2
            type: audio_choice
            text: "Which colour do you hear?"
            say: { en: "Listen. Which colour do you hear?" }
            audio: { fr: "Noir." }
            options:
              - { drawn: colour-swatch, colour: brown }
              - { drawn: colour-swatch, colour: purple }
              - { drawn: colour-swatch, colour: black }
            answer: black
          - id: l2-c3
            type: true_false
            text: "Does the colour match?"
            say: { en: "Listen. Does the colour match?", fr: "Vert." }
            show: { object: leaf, colour: green }
            answer: true
          - id: l2-c4
            type: audio_choice
            text: "Which colour is the favourite?"
            say: { en: "Listen. Which colour is the favourite?" }
            audio: { fr: "Ma couleur préférée, c'est le jaune." }
            options:
              - { drawn: colour-swatch, colour: orange }
              - { drawn: colour-swatch, colour: white }
              - { drawn: colour-swatch, colour: yellow }
            answer: yellow
          - id: l2-c5
            type: true_false
            text: "Does the colour match?"
            say: { en: "Listen. Does the colour match?", fr: "Rose." }
            show: { object: balloon, colour: purple }
            answer: false
