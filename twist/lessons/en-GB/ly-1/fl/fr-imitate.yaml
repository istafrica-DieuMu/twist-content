# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-imitate
skill: fl.speaking.imitate
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Gut zuhören, genau nachsprechen (Französisch)
  en: Listen and say it like me in French
summary: >
  Children hear a French word or short sentence and say it back, with
  attention to the sounds and the stress English does differently. Lesson
  1 is the French u (lips round, tongue forward: la lune, le bus, du jus)
  against ou (le loup, la souris, la bouche). Lesson 2 is the French r at
  the back of the throat (rouge, le renard) and French stress, which keeps
  every part of a word even and lands on the last one (é-lé-phant,
  cro-co-dile); it ends with the skill check. Speaking is practised, not
  marked: the skill check asks the child to hear the sounds and the stress,
  which comes before saying them well.
metadata:
  year: ly-1
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.familiar-words]
  also_practises: [fl.listening.familiar-words]
  vocabulary: { fr: [la lune, le bus, du jus, le loup, la souris, la bouche, rouge, la rose, le renard, l'éléphant, le crocodile, la girafe, la banane] }
  forms: [audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: u-as-oo
      what: Says the French u as English oo, so lune sounds like loon and bus like boose
      addressed: lesson 1 Learn has the child say ee and then round the lips; every stage of lesson 1 asks whether a word has u or ou (l1-f1 with feedback, l1-s1, l1-s4, l1-n1, l1-n4), and the skill check asks it again (l2-c1, l2-c2, l2-c5)
    - id: english-stress
      what: Pushes hard on the first part of a French word, as in English (ELE-phant, CROCO-dile)
      addressed: lesson 2 Learn sets the English and French words side by side; l2-f1 gives feedback when "at the start" is chosen, and l2-f4, l2-s2, l2-n1 and l2-c4 ask where the strong part is
    - id: english-r
      what: Uses the English r in rouge or renard
      addressed: lesson 2 Learn shows the r at the back of the throat; "Do you hear a French r?" tasks in every stage of lesson 2 (l2-f2, l2-s1, l2-s4, l2-n2, l2-c3), and speak hints for rouge and renard
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "U und ou", en: "U and ou" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Le bus." }
            options: [{ object: table }, { object: bus }, { object: banana }]
            answer: bus
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "La banane." }
            options: [{ object: banana }, { object: orange }, { object: carrot }]
            answer: banana
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - say: { en: "French has a sound English does not have. Say ee. Now keep your tongue there and make your lips round, like a kiss. That is the French u.", fr: "Tu. Lune. La lune." }
            show: { object: moon }
          - say: { en: "Ou is a different sound, like the oo in moon. Listen to the two, one after the other.", fr: "La lune. Le loup." }
            show: { object: wolf }
          - say: { en: "Souris and bouche have ou. Bus and jus have the French u.", fr: "La souris. La bouche. Le bus. Du jus." }
            show: { object: mouse }
          - say: { en: "Listen to the whole word first, then say it just like me.", fr: "La lune. Le loup." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which sound do you hear?"
                say: { en: "Listen. Do you hear u, as in lune, or ou, as in loup?" }
                audio: { fr: "Le bus." }
                options: ["u, as in lune", "ou, as in loup"]
                answer: "u, as in lune"
                keep_order: true
                feedback:
                  "ou, as in loup": "Bus has the French u, with round lips and the tongue forward, as in lune."
                hints:
                  - "Listen again: le bus."
                  - "Do your lips stay round with the tongue forward, like for lune?"
                  - "It is u, as in lune."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which word do you hear?"
                say: { en: "Listen. Which word do you hear? Tap the picture." }
                audio: { fr: "Le loup." }
                options: [{ object: moon }, { object: wolf }]
                answer: wolf
                feedback:
                  moon: "La lune has u. Le loup has ou."
                hints:
                  - "Listen again: le loup."
                  - "Is it the round-lips u of lune, or the oo sound?"
                  - "It is le loup, the wolf."
              - id: l1-f3
                type: speak
                say: { en: "Say it just like me. Lips round, tongue forward.", fr: "La lune." }
                show: { object: moon }
                expected_text: "la lune"
                hints:
                  - "Listen again: la lune."
                  - "Say ee, then round your lips without moving your tongue."
                  - "Say it with me: la lune."
              - id: l1-f4
                type: true_false
                text: "Do you hear ou, as in loup?"
                say: { en: "Listen. Do you hear ou, as in loup?", fr: "La souris." }
                show: { object: mouse }
                answer: true
                hints:
                  - "Listen again: la souris."
                  - "Sou-ris. Listen to the first part."
                  - "Yes. Souris has ou."
              - id: l1-f5
                type: speak
                say: { en: "Say it just like me.", fr: "Du jus." }
                show: { object: juice }
                expected_text: "du jus"
                hints:
                  - "Listen again: du jus."
                  - "Both words have the French u: round lips, tongue forward."
                  - "Say it with me: du jus."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which sound do you hear?"
                say: { en: "Listen. Do you hear u, as in lune, or ou, as in loup?" }
                audio: { fr: "La lune." }
                options: ["u, as in lune", "ou, as in loup"]
                answer: "u, as in lune"
                keep_order: true
                hints: ["Round lips, tongue forward: that is u."]
              - id: l1-s2
                type: true_false
                text: "Do you hear ou, as in loup?"
                say: { en: "Listen. Do you hear ou, as in loup?", fr: "Du jus." }
                show: { object: juice }
                answer: false
                hints: ["Jus has the same sound as lune."]
              - id: l1-s3
                type: speak
                say: { en: "Say it just like me.", fr: "Le loup." }
                show: { object: wolf }
                expected_text: "le loup"
                hints: ["Loup has the oo sound, like in moon."]
              - id: l1-s4
                type: audio_choice
                text: "Which sound do you hear?"
                say: { en: "Listen. Do you hear u, as in lune, or ou, as in loup?" }
                audio: { fr: "La bouche." }
                options: ["u, as in lune", "ou, as in loup"]
                answer: "ou, as in loup"
                keep_order: true
                hints: ["Listen to the first part: bou."]
              - id: l1-s5
                type: speak
                say: { en: "Say it just like me.", fr: "Le bus." }
                show: { object: bus }
                expected_text: "le bus"
                hints: ["Bus is said the French way: round lips, and you say the s."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which sound do you hear?"
                say: { en: "Listen. Do you hear u, as in lune, or ou, as in loup?" }
                audio: { fr: "La souris." }
                options: ["u, as in lune", "ou, as in loup"]
                answer: "ou, as in loup"
                keep_order: true
              - id: l1-n2
                type: audio_choice
                text: "Which word do you hear?"
                say: { en: "Listen. Which word do you hear? Tap the picture." }
                audio: { fr: "La lune." }
                options: [{ object: wolf }, { object: moon }]
                answer: moon
              - id: l1-n3
                type: speak
                say: { en: "Say it just like me.", fr: "La bouche." }
                show: { object: mouth }
                expected_text: "la bouche"
              - id: l1-n4
                type: true_false
                text: "Do you hear u, as in lune?"
                say: { en: "Listen. Do you hear u, as in lune?", fr: "Le loup." }
                show: { object: wolf }
                answer: false
              - id: l1-n5
                type: speak
                say: { en: "Now a sentence with both sounds. Say it just like me.", fr: "Une souris dans la lune." }
                expected_text: "une souris dans la lune"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which sound do you hear?"
            say: { en: "Listen. Do you hear u, as in lune, or ou, as in loup?" }
            audio: { fr: "Du jus." }
            options: ["u, as in lune", "ou, as in loup"]
            answer: "u, as in lune"
            keep_order: true
          - id: l1-c2
            type: true_false
            text: "Do you hear ou, as in loup?"
            say: { en: "Listen. Do you hear ou, as in loup?", fr: "La bouche." }
            show: { object: mouth }
            answer: true
          - id: l1-c3
            type: audio_choice
            text: "Which word do you hear?"
            say: { en: "Listen. Which word do you hear? Tap the picture." }
            audio: { fr: "La souris." }
            options: [{ object: moon }, { object: mouse }]
            answer: mouse

  - n: 2
    title: { de: "Das französische r und die Betonung", en: "The French r and stress" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which sound do you hear?"
            say: { en: "Do you remember? Do you hear u, as in lune, or ou, as in loup?" }
            audio: { fr: "Le bus." }
            options: ["u, as in lune", "ou, as in loup"]
            answer: "u, as in lune"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Do you hear ou, as in loup?"
            say: { en: "Do you remember? Do you hear ou, as in loup?", fr: "Le loup." }
            show: { object: wolf }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - say: { en: "The French r is made at the back of your throat, like a very soft gargle. Listen.", fr: "Rouge. La rose. Le renard." }
            show: { object: fox }
          - say: { en: "English pushes hard on one part of a word: elephant, crocodile. French keeps every part even and lands a little on the last one.", fr: "Éléphant. Crocodile." }
            show: { object: elephant }
          - say: { en: "Listen to the end of each word. That is where French lands.", fr: "Girafe. Banane. Chocolat." }
            show: { object: giraffe }
          - say: { en: "Now a whole sentence. Listen first, then say it the same way.", fr: "Le renard est rouge." }
            show: { object: fox }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Where is the strong part of the word?"
                say: { en: "Listen. Where is the strong part of the word?" }
                audio: { fr: "Crocodile." }
                options: ["at the start", "at the end"]
                answer: "at the end"
                keep_order: true
                feedback:
                  "at the start": "That is how English says it. French keeps the parts even and lands on the last one: cro-co-DILE."
                hints:
                  - "Listen again: crocodile. Clap each part: cro, co, dile."
                  - "Which clap is a little longer and stronger?"
                  - "At the end: cro-co-DILE."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Do you hear a French r?"
                say: { en: "Listen. Do you hear a French r?", fr: "Rouge." }
                show: { object: crayon, colour: red }
                answer: true
                hints:
                  - "Listen again: rouge."
                  - "Listen to the very first sound. Is it made at the back of the throat?"
                  - "Yes. Rouge starts with a French r."
              - id: l2-f3
                type: speak
                say: { en: "Say it like me. The r is at the back of your throat.", fr: "Rouge." }
                show: { object: crayon, colour: red }
                expected_text: "rouge"
                hints:
                  - "Listen again: rouge."
                  - "Keep the tip of your tongue down behind your bottom teeth, and make a soft gargle."
                  - "Say it with me: rouge."
              - id: l2-f4
                type: audio_choice
                text: "Where is the strong part of the word?"
                say: { en: "Listen. Where is the strong part of the word?" }
                audio: { fr: "Éléphant." }
                options: ["at the start", "at the end"]
                answer: "at the end"
                keep_order: true
                hints:
                  - "Listen again: éléphant. Clap each part: é, lé, phant."
                  - "French lands on the last part."
                  - "At the end: é-lé-PHANT."
              - id: l2-f5
                type: speak
                say: { en: "Say it like me. Keep each part even, then land on the last one.", fr: "Éléphant." }
                show: { object: elephant }
                expected_text: "éléphant"
                hints:
                  - "Listen again: éléphant."
                  - "Three even parts: é, lé, phant."
                  - "Say it with me: éléphant."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Do you hear a French r?"
                say: { en: "Listen. Do you hear a French r?", fr: "La lune." }
                show: { object: moon }
                answer: false
                hints: ["Listen for the soft gargle at the back of the throat."]
              - id: l2-s2
                type: audio_choice
                text: "Where is the strong part of the word?"
                say: { en: "Listen. Where is the strong part of the word?" }
                audio: { fr: "Girafe." }
                options: ["at the start", "at the end"]
                answer: "at the end"
                keep_order: true
                hints: ["Clap the two parts: gi, rafe. French lands on the last."]
              - id: l2-s3
                type: speak
                say: { en: "Say it like me.", fr: "Le renard." }
                show: { object: fox }
                expected_text: "le renard"
                hints: ["Two French r sounds: re-nard. Both at the back of the throat."]
              - id: l2-s4
                type: true_false
                text: "Do you hear a French r?"
                say: { en: "Listen. Do you hear a French r?", fr: "La rose." }
                show: { object: rose }
                answer: true
                hints: ["Listen to the start of rose."]
              - id: l2-s5
                type: speak
                say: { en: "Say it like me.", fr: "Crocodile." }
                show: { object: crocodile }
                expected_text: "crocodile"
                hints: ["Three even parts, then land on the last: cro-co-dile."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Where is the strong part of the word?"
                say: { en: "Listen. Where is the strong part of the word?" }
                audio: { fr: "Banane." }
                options: ["at the start", "at the end"]
                answer: "at the end"
                keep_order: true
              - id: l2-n2
                type: true_false
                text: "Do you hear a French r?"
                say: { en: "Listen. Do you hear a French r?", fr: "Le bus." }
                show: { object: bus }
                answer: false
              - id: l2-n3
                type: speak
                say: { en: "Say the sentence like me.", fr: "Le renard est rouge." }
                show: { object: fox }
                expected_text: "le renard est rouge"
              - id: l2-n4
                type: audio_choice
                text: "Which sound do you hear?"
                say: { en: "Listen. Do you hear u, as in lune, or ou, as in loup?" }
                audio: { fr: "Tu." }
                options: ["u, as in lune", "ou, as in loup"]
                answer: "u, as in lune"
                keep_order: true
              - id: l2-n5
                type: speak
                say: { en: "Say it like me.", fr: "Une girafe." }
                show: { object: giraffe }
                expected_text: "une girafe"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Which sound do you hear?"
            say: { en: "Listen. Do you hear u, as in lune, or ou, as in loup?" }
            audio: { fr: "Une plume." }
            options: ["u, as in lune", "ou, as in loup"]
            answer: "u, as in lune"
            keep_order: true
          - id: l2-c2
            type: audio_choice
            text: "Which sound do you hear?"
            say: { en: "Listen. Do you hear u, as in lune, or ou, as in loup?" }
            audio: { fr: "Le hibou." }
            options: ["u, as in lune", "ou, as in loup"]
            answer: "ou, as in loup"
            keep_order: true
          - id: l2-c3
            type: true_false
            text: "Do you hear a French r?"
            say: { en: "Listen. Do you hear a French r?", fr: "Le crocodile." }
            show: { object: crocodile }
            answer: true
          - id: l2-c4
            type: audio_choice
            text: "Where is the strong part of the word?"
            say: { en: "Listen. Where is the strong part of the word?" }
            audio: { fr: "Chocolat." }
            options: ["at the start", "at the end"]
            answer: "at the end"
            keep_order: true
          - id: l2-c5
            type: true_false
            text: "Do you hear ou, as in loup?"
            say: { en: "Listen. Do you hear ou, as in loup?", fr: "La lune." }
            show: { object: moon }
            answer: false
