# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-numbers-to-10
skill: fl.themes.numbers-to-10
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Zahlen bis 10 (Französisch)
  en: Numbers to 10 in French
summary: >
  Counting from un to dix in French and saying how many. Lesson 1 brings
  un to cinq with dice dots and the silent last letters of deux and trois;
  lesson 2 adds six to dix, sets six against dix, asks combien ? over
  groups of things, and ends with the skill check. Children hear a number
  and tap the dots, count on, or type the digit. Instructions are in
  English; the French is heard. Speaking is practised, not marked.
metadata:
  year: ly-1
  topic: { de: Zahlen, en: Numbers }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.speaking.imitate, fl.speaking.name-things]
  vocabulary: { fr: [un, deux, trois, quatre, cinq, six, sept, huit, neuf, dix, "combien ?", "combien de ... ?"] }
  forms: [audio, picture, drawn]
  drawn: [dots]
  facets: []
  parts:
    - { id: to-five, what: { de: die Zahlen un bis cinq verstehen, en: understanding the numbers un to cinq } }
    - { id: six-ten, what: { de: die Zahlen six bis dix verstehen, en: understanding the numbers six to dix } }
    - { id: count-on, what: { de: in der richtigen Reihenfolge zählen, en: counting in order } }
    - { id: how-many, what: { de: Anzahlen von Dingen verstehen, en: understanding how many things there are } }
  misconceptions:
    - id: six-dix
      what: Mixes up six and dix, which sound almost the same
      addressed: lesson 2 Learn sets six against dix; l2-f1 gives feedback when 6 is chosen for dix, and l2-s1, l2-n3 and l2-c4 ask for one of the pair with the other beside it
    - id: silent-letters
      what: Says the last letter of deux, trois or sept as English would (deuks, trwahs), or expects to hear it
      addressed: lesson 1 Learn says the last letters of deux and trois are silent; the hints of l1-s3 and l2-s3 point at the silent s and p, and the type-the-number tasks (l1-f6, l1-s4, l2-s3) ask the child to hear the number without them
    - id: count-order
      what: Knows single number words but loses the order when counting on
      addressed: '"What comes next?" tasks after a heard count in l1-f5, l1-s5, l2-w2 and l2-c5'
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Un bis cinq", en: "Un to cinq" }
    goal:
      de: "Zähl auf Französisch von un bis cinq und finde die richtige Zahl von Punkten."
      en: "Count from un to cinq in French and find the right number of dots."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Here is a number in French. Listen. What do you think: is it one or three?", fr: "Trois." }
          - say: { en: "Three! Numbers in French. Listen and count with me.", fr: "Un, deux, trois." }
            show: { drawn: dots, count: 3, layout: dice }
          - say: { en: "Four and five:", fr: "Quatre, cinq." }
            show: { drawn: dots, count: 5, layout: dice }
          - say: { en: "Now from one to five.", fr: "Un, deux, trois, quatre, cinq." }
          - say: { en: "Careful: you do not hear the x of deux or the s of trois. In French the last letter is often silent.", fr: "Deux. Trois." }
            show: { drawn: dots, count: 2, layout: dice }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the right dots."
                say: { en: "Listen. Tap the right dots." }
                audio: { fr: "Trois." }
                options:
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                answer: "3"
                hints:
                  - "Listen again: trois."
                  - "Count with me: un, deux, trois."
                  - "Trois is three. Tap the three dots."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tap the right dots."
                say: { en: "Listen. Tap the right dots." }
                audio: { fr: "Cinq." }
                options:
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                answer: "5"
                feedback:
                  "4": "That is quatre. Cinq is five."
                hints:
                  - "Listen again: cinq."
                  - "Count: un, deux, trois, quatre, cinq. Cinq is the last one."
                  - "Cinq is five. Tap the five dots."
              - id: l1-f3
                type: true_false
                text: "Do the dots match?"
                say: { en: "Listen. Do the dots match?", fr: "Deux." }
                show: { drawn: dots, count: 2, layout: dice }
                answer: true
                hints:
                  - "Listen again: deux."
                  - "Deux is two. How many dots are there?"
                  - "Yes. Two dots: deux."
              - id: l1-f4
                type: speak
                say: { en: "Say the number in French.", fr: "Quatre." }
                show: { drawn: dots, count: 4, layout: dice }
                expected_text: "quatre"
                hints:
                  - "Listen again: quatre."
                  - "It sounds like katr, with a soft r at the end."
                  - "Say it with me: quatre."
              - id: l1-f5
                type: audio_choice
                text: "What comes next?"
                say: { en: "Listen to the count. Which number comes next?" }
                audio: { fr: "Un, deux, trois ..." }
                options:
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                answer: "4"
                hints:
                  - "Listen again: un, deux, trois. Where does it stop?"
                  - "It stops at three. What comes after three?"
                  - "Four comes next: quatre. Tap the four dots."
              - id: l1-f6
                type: text_input
                text: "Write the number you hear."
                say: { en: "Listen and write the number.", fr: "Cinq." }
                answer: "5"
                hints:
                  - "Listen again: cinq."
                  - "Count on your fingers: un, deux, trois, quatre, cinq."
                  - "Cinq is 5."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the right dots."
                say: { en: "Listen. Tap the right dots." }
                audio: { fr: "Un." }
                options:
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                answer: "1"
                hints: ["Un is the first number you say when you count."]
              - id: l1-s2
                type: true_false
                text: "Do the dots match?"
                say: { en: "Listen. Do the dots match?", fr: "Quatre." }
                show: { drawn: dots, count: 3, layout: dice }
                answer: false
                hints: ["Quatre is four. Count the dots."]
              - id: l1-s3
                type: speak
                say: { en: "Say the number in French.", fr: "Trois." }
                show: { drawn: dots, count: 3, layout: dice }
                expected_text: "trois"
                hints: ["Trois sounds like trwah. You do not say the s."]
              - id: l1-s4
                type: text_input
                text: "Write the number you hear."
                say: { en: "Listen and write the number.", fr: "Deux." }
                answer: "2"
                hints: ["Deux comes after un."]
              - id: l1-s5
                type: audio_choice
                text: "What comes next?"
                say: { en: "Listen to the count. Which number comes next?" }
                audio: { fr: "Deux, trois, quatre ..." }
                options:
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                answer: "5"
                hints: ["The count stops at quatre, four."]
              - id: l1-s6
                type: true_false
                text: "Do the dots match?"
                say: { en: "Listen. Do the dots match?", fr: "Cinq." }
                show: { drawn: dots, count: 5, layout: dice }
                answer: true
                hints: ["Cinq is five. Count the dots."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the right dots."
                say: { en: "Listen. Tap the right dots." }
                audio: { fr: "Quatre." }
                options:
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                answer: "4"
              - id: l1-n2
                type: text_input
                text: "Write the number you hear."
                say: { en: "Listen and write the number.", fr: "Trois." }
                answer: "3"
              - id: l1-n3
                type: speak
                say: { en: "How many dots? Say it in French." }
                show: { drawn: dots, count: 2, layout: dice }
                expected_text: "deux"
              - id: l1-n4
                type: true_false
                text: "Do the dots match?"
                say: { en: "Listen. Do the dots match?", fr: "Un." }
                show: { drawn: dots, count: 1, layout: dice }
                answer: true
              - id: l1-n5
                type: audio_choice
                text: "Tap the right picture."
                say: { en: "Listen. Tap the right picture." }
                audio: { fr: "Cinq pommes." }
                options:
                  - { object: apple, count: 4 }
                  - { object: apple, count: 5 }
                  - { object: apple, count: 3 }
                answer: "5"
              - id: l1-n6
                type: true_false
                text: "Do the dots match?"
                say: { en: "Listen. Do the dots match?", fr: "Trois." }
                show: { drawn: dots, count: 2, layout: dice }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the right dots."
            say: { en: "Listen. Tap the right dots." }
            audio: { fr: "Deux." }
            options:
              - { drawn: dots, count: 3, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
              - { drawn: dots, count: 1, layout: dice }
            answer: "2"
          - id: l1-c2
            type: text_input
            text: "Write the number you hear."
            say: { en: "Listen and write the number.", fr: "Quatre." }
            answer: "4"
          - id: l1-c3
            type: true_false
            text: "Do the dots match?"
            say: { en: "Listen. Do the dots match?", fr: "Cinq." }
            show: { drawn: dots, count: 4, layout: dice }
            answer: false
          - id: l1-c4
            type: audio_choice
            text: "You hear two numbers. Tap the bigger one."
            say: { en: "Listen. You hear two numbers. Tap the bigger one." }
            audio: { turns: [{ fr: "Trois." }, { fr: "Un." }] }
            options:
              - { drawn: dots, count: 1, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
              - { drawn: dots, count: 3, layout: dice }
            answer: "3"
          - id: l1-c5
            type: audio_choice
            text: "Listen to the count. One number is missing. Which one?"
            say: { en: "Listen to the count. One number is missing. Which one?" }
            audio: { fr: "Un ... trois, quatre." }
            options:
              - { drawn: dots, count: 5, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
              - { drawn: dots, count: 3, layout: dice }
            answer: "2"
          - id: l1-c6
            type: audio_choice
            text: "Tap the right picture."
            say: { en: "Listen. Tap the right picture." }
            audio: { fr: "Quatre pommes." }
            options:
              - { object: apple, count: 3 }
              - { object: apple, count: 5 }
              - { object: apple, count: 4 }
            answer: "4"

  - n: 2
    title: { de: "Six bis dix", en: "Six to dix" }
    goal:
      de: "Zähl auf Französisch von six bis dix, halte six und dix auseinander und sag mit combien, wie viele es sind."
      en: "Count from six to dix in French, hear six and dix apart, and say how many with combien."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Do the dots match?"
            say: { en: "Do you remember? Do the dots match?", fr: "Quatre." }
            show: { drawn: dots, count: 4, layout: dice }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "What comes next?"
            say: { en: "Do you remember? Which number comes next?" }
            audio: { fr: "Un, deux ..." }
            options:
              - { drawn: dots, count: 3, layout: dice }
              - { drawn: dots, count: 5, layout: dice }
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Listen to this French number. What do you think: is it six or ten?", fr: "Dix." }
          - say: { en: "Ten! Now six to ten. Listen and count with me.", fr: "Six, sept, huit." }
            show: { drawn: dots, count: 8, layout: dice }
          - say: { en: "Nine and ten. Then listen to seven again: you do not hear the p in sept.", fr: "Neuf, dix. Sept. Sept." }
            show: { drawn: dots, count: 10, layout: dice }
          - say: { en: "Six and dix sound nearly the same. Six starts with s, dix starts with d. Listen.", fr: "Six. Dix. Six. Dix." }
          - say: { en: "To ask how many, say combien ? Then count.", fr: "Combien de ballons ? Sept ballons." }
            show: { object: ball, count: 7 }
          - text: "Did you know? In French, neuf means nine, and it also means new."
            say: { en: "Did you know? In French, neuf means nine, and it also means new. A new book is un livre neuf.", fr: "Neuf. Un livre neuf." }
            show: { object: book }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Tap the right dots."
                say: { en: "Listen. Tap the right dots." }
                audio: { fr: "Dix." }
                options:
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                  - { drawn: dots, count: 9, layout: dice }
                answer: "10"
                feedback:
                  "6": "That is six. Dix starts with d, and it is ten."
                hints:
                  - "Listen to the first sound: d or s?"
                  - "Dix starts with d. Dix is ten."
                  - "Tap the ten dots."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "How many?"
                say: { en: "Listen. How many? Tap the right picture." }
                audio: { fr: "Combien de ballons ? Huit ballons." }
                options:
                  - { object: ball, count: 6 }
                  - { object: ball, count: 8 }
                  - { object: ball, count: 10 }
                answer: "8"
                hints:
                  - "Listen for the number after combien de ballons."
                  - "Huit comes after sept."
                  - "Huit is eight. Tap the eight balls."
              - id: l2-f3
                type: true_false
                text: "Do the dots match?"
                say: { en: "Listen. Do the dots match?", fr: "Sept." }
                show: { drawn: dots, count: 7, layout: dice }
                answer: true
                hints:
                  - "Listen again: sept."
                  - "Count on from six: six, sept."
                  - "Yes. Seven dots: sept."
              - id: l2-f4
                type: text_input
                text: "Write the number you hear."
                say: { en: "Listen and write the number.", fr: "Neuf." }
                answer: "9"
                hints:
                  - "Listen again: neuf."
                  - "Neuf comes just before dix."
                  - "Neuf is 9."
              - id: l2-f5
                type: speak
                say: { en: "Say the number in French.", fr: "Six." }
                show: { drawn: dots, count: 6, layout: dice }
                expected_text: "six"
                hints:
                  - "Listen again: six."
                  - "Six sounds like seess, with a clear s at both ends."
                  - "Say it with me: six."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Tap the right dots."
                say: { en: "Listen. Tap the right dots." }
                audio: { fr: "Six." }
                options:
                  - { drawn: dots, count: 7, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                  - { drawn: dots, count: 6, layout: dice }
                answer: "6"
                hints: ["Six starts with s. Dix starts with d."]
              - id: l2-s2
                type: true_false
                text: "Do the dots match?"
                say: { en: "Listen. Do the dots match?", fr: "Huit." }
                show: { drawn: dots, count: 6, layout: dice }
                answer: false
                hints: ["Huit is eight. Count the dots."]
              - id: l2-s3
                type: text_input
                text: "Write the number you hear."
                say: { en: "Listen and write the number.", fr: "Sept." }
                answer: "7"
                hints: ["You do not hear the p in sept. It comes after six."]
              - id: l2-s4
                type: audio_choice
                text: "How many?"
                say: { en: "Listen. How many? Tap the right picture." }
                audio: { fr: "Combien de chats ? Neuf chats." }
                options:
                  - { object: cat, count: 9 }
                  - { object: cat, count: 7 }
                  - { object: cat, count: 10 }
                answer: "9"
                feedback:
                  "10": "That is one cat too many! Neuf is nine, just before dix."
                hints: ["Neuf comes just before dix."]
              - id: l2-s5
                type: speak
                say: { en: "Say the number in French.", fr: "Dix." }
                show: { drawn: dots, count: 10, layout: dice }
                expected_text: "dix"
                hints: ["Dix sounds like deess. Start with a clear d."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Tap the right dots."
                say: { en: "Listen. Tap the right dots." }
                audio: { fr: "Neuf." }
                options:
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 9, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                answer: "9"
              - id: l2-n2
                type: text_input
                text: "Write the number you hear."
                say: { en: "Listen and write the number.", fr: "Dix." }
                answer: "10"
              - id: l2-n3
                type: true_false
                text: "Do the dots match?"
                say: { en: "Listen. Do the dots match?", fr: "Six." }
                show: { drawn: dots, count: 10, layout: dice }
                answer: false
              - id: l2-n4
                type: audio_choice
                text: "How many?"
                say: { en: "Listen. How many? Tap the right picture." }
                audio: { fr: "Combien d'œufs ? Six œufs." }
                options:
                  - { object: egg, count: 8 }
                  - { object: egg, count: 4 }
                  - { object: egg, count: 6 }
                answer: "6"
              - id: l2-n5
                type: speak
                say: { en: "How many apples? Say it in French." }
                show: { object: apple, count: 7 }
                expected_text: "sept"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: to-five
            type: audio_choice
            text: "Tap the right dots."
            say: { en: "Listen. Tap the right dots." }
            audio: { fr: "Quatre points." }
            options:
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 8, layout: dice }
              - { drawn: dots, count: 5, layout: dice }
            answer: "4"
          - id: l2-c2
            part: six-ten
            type: text_input
            text: "Write the number you hear."
            say: { en: "Listen and write the number.", fr: "Huit." }
            answer: "8"
          - id: l2-c3
            part: six-ten
            type: true_false
            text: "Do the dots match?"
            say: { en: "Listen. Do the dots match?", fr: "Neuf." }
            show: { drawn: dots, count: 6, layout: dice }
            answer: false
          - id: l2-c4
            part: how-many
            type: audio_choice
            text: "How many?"
            say: { en: "Listen. How many? Tap the right picture." }
            audio: { fr: "Combien de poissons ? Dix poissons." }
            options:
              - { object: fish, count: 6 }
              - { object: fish, count: 10 }
              - { object: fish, count: 8 }
            answer: "10"
          - id: l2-c5
            part: count-on
            type: audio_choice
            text: "What comes next?"
            say: { en: "Listen to the count. Which number comes next?" }
            audio: { fr: "Six, sept, huit ..." }
            options:
              - { drawn: dots, count: 7, layout: dice }
              - { drawn: dots, count: 10, layout: dice }
              - { drawn: dots, count: 9, layout: dice }
            answer: "9"
          - id: l2-c6
            part: to-five
            type: audio_choice
            text: "You hear two numbers. Tap the bigger one."
            say: { en: "Listen. You hear two numbers. Tap the bigger one." }
            audio: { turns: [{ fr: "Deux." }, { fr: "Cinq." }] }
            options:
              - { drawn: dots, count: 2, layout: dice }
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 5, layout: dice }
            answer: "5"
          - id: l2-c7
            part: to-five
            type: true_false
            text: "Do the dots match?"
            say: { en: "Listen. Do the dots match?", fr: "Trois." }
            show: { drawn: dots, count: 3, layout: dice }
            answer: true
          - id: l2-c8
            part: to-five
            type: text_input
            text: "Write the number you hear."
            say: { en: "Listen and write the number.", fr: "Un." }
            answer: "1"
          - id: l2-c9
            part: to-five
            type: audio_choice
            text: "You hear two numbers. Tap the smaller one."
            say: { en: "Listen. You hear two numbers. Tap the smaller one." }
            audio: { turns: [{ fr: "Quatre." }, { fr: "Trois." }] }
            options:
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 5, layout: dice }
              - { drawn: dots, count: 3, layout: dice }
            answer: "3"
          - id: l2-c10
            part: six-ten
            type: audio_choice
            text: "Tap the right dots."
            say: { en: "Listen. Tap the right dots." }
            audio: { fr: "Sept." }
            options:
              - { drawn: dots, count: 8, layout: dice }
              - { drawn: dots, count: 7, layout: dice }
              - { drawn: dots, count: 6, layout: dice }
            answer: "7"
          - id: l2-c11
            part: six-ten
            type: true_false
            text: "Do the dots match?"
            say: { en: "Listen. Do the dots match?", fr: "Dix." }
            show: { drawn: dots, count: 10, layout: five-structure }
            answer: true
          - id: l2-c12
            part: six-ten
            type: audio_choice
            text: "You hear two numbers. Tap the bigger one."
            say: { en: "Listen. You hear two numbers. Tap the bigger one." }
            audio: { turns: [{ fr: "Dix." }, { fr: "Six." }] }
            options:
              - { drawn: dots, count: 6, layout: dice }
              - { drawn: dots, count: 8, layout: dice }
              - { drawn: dots, count: 10, layout: dice }
            answer: "10"
          - id: l2-c13
            part: count-on
            type: audio_choice
            text: "What comes next?"
            say: { en: "Listen to the count. Which number comes next?" }
            audio: { fr: "Trois, quatre, cinq ..." }
            options:
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 6, layout: dice }
              - { drawn: dots, count: 8, layout: dice }
            answer: "6"
          - id: l2-c14
            part: count-on
            type: audio_choice
            text: "Listen to the count. One number is missing. Which one?"
