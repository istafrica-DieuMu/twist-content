# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-family
skill: fl.themes.family
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Die Familie (Französisch)
  en: My family in French
summary: >
  Family members in French and a short way to introduce them. Lesson 1
  brings la mère (maman), le père (papa), le frère, la sœur and le bébé
  with voici ...; lesson 2 adds la grand-mère (mamie) and le grand-père
  (papi), mon and ma, and j'ai un frère et une sœur, and ends with the
  skill check. Children hear who is meant and tap the picture, choose mon
  or ma, and say who is in a family. Instructions are in English; the
  French is mostly heard, with mon and ma read on chips in lesson 2.
metadata:
  year: ly-1
  topic: { de: Familie, en: Family }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.speaking.imitate, fl.grammar.chunks]
  vocabulary: { fr: [la mère, maman, le père, papa, le frère, la sœur, le bébé, la grand-mère, mamie, le grand-père, papi, voici, mon, ma, "j'ai un frère", "j'ai une sœur", la famille] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: frere-soeur
      what: Mixes up le frère and la sœur
      addressed: l1-f2 gives feedback when the boy is chosen for la sœur; every stage of lesson 1 asks for one with the other beside it (l1-s1, l1-s5, l1-n1), and l2-f3 and l2-c4 ask who is in a family
    - id: mon-ma
      what: Uses mon with every word (mon mère), or picks mon and ma by the person's sex rather than by le and la
      addressed: lesson 2 Learn says le words take mon and la words take ma; a mon-or-ma task in every stage (l2-f2, l2-s1, l2-n1) and in the skill check (l2-c1)
    - id: grand-mere
      what: Hears mère inside grand-mère and taps mum
      addressed: l2-f1 gives feedback when mum is chosen for grand-mère; l2-s3 and l2-n2 set grandparents against parents again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Maman, papa", en: "Maman, papa" }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Your family in French. Mum is la mère, or maman. Dad is le père, or papa.", fr: "La mère. Maman. Le père. Papa." }
            show: { object: mum }
          - say: { en: "Brother and sister:", fr: "Le frère. La sœur." }
            show: { object: boy }
          - say: { en: "And the baby:", fr: "Le bébé." }
            show: { object: baby }
          - say: { en: "To show someone your family, you say voici, here is.", fr: "Voici ma mère. Voici mon frère." }
            show: { object: mum }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Voici ma mère." }
                options: [{ object: dad }, { object: mum }, { object: baby }]
                answer: mum
                hints:
                  - "Listen to the last word: mère."
                  - "La mère is maman, your mum."
                  - "Tap the mum."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "La sœur." }
                options: [{ object: boy }, { object: girl }, { object: baby }]
                answer: girl
                feedback:
                  boy: "That is le frère, the brother. La sœur is the sister."
                hints:
                  - "Listen again: la sœur."
                  - "La sœur is a sister. Le frère is a brother."
                  - "Tap the girl."
              - id: l1-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le père." }
                show: { object: dad }
                answer: true
                hints:
                  - "Listen again: le père."
                  - "Le père is papa, your dad."
                  - "Yes. That is the dad."
              - id: l1-f4
                type: speak
                say: { en: "Say it in French.", fr: "Le frère." }
                show: { object: boy }
                expected_text: "le frère"
                hints:
                  - "Listen again: le frère."
                  - "Frère has two r sounds, both at the back of your throat."
                  - "Say it with me: le frère."
              - id: l1-f5
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Le bébé." }
                options: [{ object: girl }, { object: baby }, { object: mum }]
                answer: baby
                hints:
                  - "Listen again: le bébé."
                  - "Bébé sounds a lot like baby."
                  - "Tap the baby."
              - id: l1-f6
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Voici mon frère." }
                show: { object: girl }
                answer: false
                hints:
                  - "Listen to the last word: frère."
                  - "Le frère is a brother. Is this a boy?"
                  - "No. This is a girl, a sister."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Le frère." }
                options: [{ object: girl }, { object: dad }, { object: boy }]
                answer: boy
                hints: ["Le frère is a brother."]
              - id: l1-s2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Maman." }
                show: { object: mum }
                answer: true
                hints: ["Maman is mum."]
              - id: l1-s3
                type: speak
                say: { en: "Say it in French.", fr: "La sœur." }
                show: { object: girl }
                expected_text: "la sœur"
                hints: ["Sœur: round your lips for the eu, then a soft r."]
              - id: l1-s4
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Voici mon père." }
                options: [{ object: baby }, { object: dad }, { object: boy }]
                answer: dad
                hints: ["Le père is papa."]
              - id: l1-s5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "La sœur." }
                show: { object: boy }
                answer: false
                hints: ["La sœur is a sister."]
              - id: l1-s6
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Papa." }
                options: [{ object: mum }, { object: baby }, { object: dad }]
                answer: dad
                hints: ["Papa sounds like the English word."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Voici ma sœur." }
                options: [{ object: girl }, { object: boy }, { object: mum }]
                answer: girl
              - id: l1-n2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le bébé." }
                show: { object: baby }
                answer: true
              - id: l1-n3
                type: speak
                say: { en: "Who is this? Say it in French." }
                show: { object: mum }
                expected_text: "maman"
              - id: l1-n4
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Le père." }
                options: [{ object: boy }, { object: grandma }, { object: dad }]
                answer: dad
              - id: l1-n5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Voici ma mère." }
                show: { object: dad }
                answer: false
              - id: l1-n6
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Voici le bébé." }
                options: [{ object: boy }, { object: baby }, { object: girl }]
                answer: baby

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Who is it?"
            say: { en: "Listen. Who is it? Tap the picture." }
            audio: { fr: "Mon frère." }
            options: [{ object: baby }, { object: girl }, { object: boy }]
            answer: boy
          - id: l1-c2
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "La mère." }
            show: { object: mum }
            answer: true
          - id: l1-c3
            type: audio_choice
            text: "Who is it?"
            say: { en: "Listen. Who is it? Tap the picture." }
            audio: { fr: "Ma sœur." }
            options: [{ object: mum }, { object: girl }, { object: boy }]
            answer: girl

  - n: 2
    title: { de: "Voici ma famille", en: "Voici ma famille" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Who is it?"
            say: { en: "Do you remember? Who is it?" }
            audio: { fr: "La sœur." }
            options: [{ object: girl }, { object: boy }]
            answer: girl
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Does the picture match?"
            say: { en: "Do you remember? Does the picture match?", fr: "Papa." }
            show: { object: dad }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Grandma is la grand-mère, or mamie. Grandpa is le grand-père, or papi.", fr: "La grand-mère. Mamie. Le grand-père. Papi." }
            show: { object: grandma }
          - say: { en: "My is mon for le words and ma for la words. Le père, so mon père. La mère, so ma mère.", fr: "Mon père. Ma mère. Mon frère. Ma sœur." }
          - say: { en: "To say who is in your family, use j'ai, I have got.", fr: "J'ai un frère et une sœur." }
            show: { object: boy }
          - say: { en: "Listen to Léa talking about her family.", fr: "Voici ma famille. Voici ma mère et mon père. J'ai un frère. Mon frère s'appelle Tom." }
            show: { object: girl }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Voici ma grand-mère." }
                options: [{ object: mum }, { object: grandma }, { object: girl }]
                answer: grandma
                feedback:
                  mum: "Mère on its own is mum. Grand-mère is grandma."
                hints:
                  - "Listen to the whole word: grand-mère."
                  - "Grand comes before mère. Who is your mum's mum?"
                  - "Tap the grandma."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "le père\nMon or ma? Fill the gap."
                say: { en: "Do we say mon or ma? Fill the gap.", fr: "Le père." }
                frame: "_ père"
                options: ["mon", "ma"]
                answer: ["mon"]
                option_audio: false
                hints:
                  - "Look at the little word before père: le or la?"
                  - "It is le père, and le words take mon."
                  - "Mon père."
              - id: l2-f3
                type: audio_choice
                text: "Who is in the family?"
                say: { en: "Listen. Who is in the family?" }
                audio: { fr: "J'ai un frère et une sœur." }
                options: ["a brother and a sister", "two brothers", "a sister and a baby"]
                answer: "a brother and a sister"
                hints:
                  - "Listen for two family words after j'ai."
                  - "Un frère is a brother. Une sœur is a sister."
                  - "A brother and a sister."
              - id: l2-f4
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le grand-père." }
                show: { object: grandpa }
                answer: true
                hints:
                  - "Listen again: le grand-père."
                  - "Le grand-père is papi, your grandpa."
                  - "Yes. That is the grandpa."
              - id: l2-f5
                type: speak
                say: { en: "Say it in French: here is my mum.", fr: "Voici ma mère." }
                show: { object: mum }
                expected_text: "voici ma mère"
                hints:
                  - "Listen again: voici ma mère."
                  - "Voici, then ma, because it is la mère."
                  - "Say it with me: Voici ma mère."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "la sœur\nMon or ma? Fill the gap."
                say: { en: "Do we say mon or ma? Fill the gap.", fr: "La sœur." }
                frame: "_ sœur"
                options: ["mon", "ma"]
                answer: ["ma"]
                option_audio: false
                hints: ["It is la sœur, and la words take ma."]
              - id: l2-s2
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Papi." }
                options: [{ object: dad }, { object: baby }, { object: grandpa }]
                answer: grandpa
                hints: ["Papi is grandpa. Papa is dad."]
              - id: l2-s3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Voici ma grand-mère." }
                show: { object: mum }
                answer: false
                hints: ["Grand-mère is grandma, not mum."]
              - id: l2-s4
                type: audio_choice
                text: "What has Hugo got?"
                say: { en: "Listen. What has Hugo got?" }
                audio: { fr: "Salut ! Je m'appelle Hugo. J'ai une sœur." }
                options: ["a sister", "a brother", "a baby"]
                answer: "a sister"
                hints: ["Listen for the word after j'ai une."]
              - id: l2-s5
                type: speak
                say: { en: "Say it in French: I have got a brother.", fr: "J'ai un frère." }
                expected_text: "j'ai un frère"
                hints: ["J'ai means I have got. Then un frère."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "le frère\nMon or ma? Fill the gap."
                say: { en: "Do we say mon or ma? Fill the gap.", fr: "Le frère." }
                frame: "_ frère"
                options: ["mon", "ma"]
                answer: ["mon"]
                option_audio: false
              - id: l2-n2
                type: audio_choice
                text: "Who is it?"
                say: { en: "Listen. Who is it? Tap the picture." }
                audio: { fr: "Voici mon grand-père." }
                options: [{ object: boy }, { object: grandpa }, { object: dad }]
                answer: grandpa
              - id: l2-n3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Mamie." }
                show: { object: grandma }
                answer: true
              - id: l2-n4
                type: audio_choice
                text: "What has Manon got?"
                say: { en: "Listen. What has Manon got?" }
                audio: { fr: "Bonjour ! Je m'appelle Manon. J'ai deux sœurs." }
                options: ["two sisters", "two brothers", "a sister"]
                answer: "two sisters"
              - id: l2-n5
                type: speak
                say: { en: "Say it in French: here is my dad." }
                show: { object: dad }
                expected_text: "voici mon père"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "la mère\nMon or ma? Fill the gap."
            say: { en: "Do we say mon or ma? Fill the gap.", fr: "La mère." }
            frame: "_ mère"
            options: ["mon", "ma"]
            answer: ["ma"]
            option_audio: false
          - id: l2-c2
            type: audio_choice
            text: "Who is it?"
            say: { en: "Listen. Who is it? Tap the picture." }
            audio: { fr: "C'est mon père." }
            options: [{ object: grandpa }, { object: boy }, { object: dad }]
            answer: dad
          - id: l2-c3
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Le bébé." }
            show: { object: girl }
            answer: false
          - id: l2-c4
            type: audio_choice
            text: "What has Jules got?"
            say: { en: "Listen. What has Jules got?" }
            audio: { fr: "Je m'appelle Jules. J'ai un frère et deux sœurs." }
            options: ["a brother and two sisters", "two brothers and a sister", "a sister and a baby"]
            answer: "a brother and two sisters"
          - id: l2-c5
            type: audio_choice
            text: "Who is it?"
            say: { en: "Listen. Who is it? Tap the picture." }
            audio: { fr: "Voici papi !" }
            options: [{ object: dad }, { object: grandpa }, { object: baby }]
            answer: grandpa
