# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-compare-languages
skill: fl.culture-strategies.compare-languages
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Sprachen vergleichen (Französisch)
  en: French and English words compared
summary: >
  Children compare French words with English ones. Lesson 1 is by ear:
  many French words sound like English ones (le zèbre, le taxi, le
  serpent, la tomate) but are said the French way, others are nothing
  alike (le chien, la pomme), and a word you know helps you understand a
  sentence. Lesson 2 is in writing: small spelling changes (giraffe and
  girafe, lamp and lampe) and false friends that look English but mean
  something else (le pain, la main, un crayon); it ends with the skill
  check. Instructions are in English.
metadata:
  year: ly-1
  topic: { de: Sprachen vergleichen, en: Comparing languages }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.listening.familiar-words, fl.speaking.imitate]
  vocabulary: { fr: [le zèbre, le taxi, le serpent, le train, la lampe, le parc, la tomate, la pizza, le clown, la girafe, le chien, la maison, la pomme, le pain, la main, un crayon] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: all-alike
      what: Expects every French word to be like the English one, and guesses from English when it is not
      addressed: lesson 1 Learn sets alike words against words that are nothing alike; "Does it sound like the English word?" tasks in every stage say no as well as yes (l1-f3 with feedback, l1-s2, l1-n2, l1-c3), and two sorting tasks (l1-f5, l1-n6) split the two kinds
    - id: false-friend
      what: Takes a false friend at its English meaning (le pain is pain, un crayon is a crayon)
      addressed: lesson 2 Learn names le pain, la main and un crayon; l2-f2 gives feedback on pain, and l2-s2, l2-s3, l2-n5, l2-c2 and l2-c5 ask what a false friend means
    - id: english-spelling
      what: Spells a French word the English way (giraffe for girafe, lamp for lampe)
      addressed: lesson 2 Learn shows the spelling changes; l2-f1 gives feedback on giraffe, and a typed spelling task in every stage (l2-f5, l2-s5, l2-n4) and l2-c1 ask for the French spelling
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Das klingt wie Englisch", en: "Does it sound like English?" }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Lots of French words are like English words. Zebra is le zèbre. Taxi is le taxi.", fr: "Le zèbre. Le taxi." }
            show: { object: zebra }
          - say: { en: "They are alike, but French says them its own way. Listen to the end of each word.", fr: "Le train. La lampe. Le parc." }
            show: { object: train }
          - say: { en: "Some French words are nothing like English. You learn those ones by heart.", fr: "Le chien. La maison. La pomme." }
            show: { object: dog }
          - say: { en: "Listen for a word you know in a sentence. It helps you work out the rest.", fr: "Le clown mange une pizza." }
            show: { object: clown }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Le zèbre." }
                options: [{ object: horse }, { object: zebra }, { object: giraffe }]
                answer: zebra
                hints:
                  - "Listen again: le zèbre."
                  - "Which English word does zèbre sound like?"
                  - "Zèbre sounds like zebra. Tap the zebra."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Does the French word sound like the English word?"
                say: { en: "Listen. Does the French word sound like the English word?", fr: "Le taxi." }
                show: { object: taxi }
                answer: true
                hints:
                  - "Listen again: le taxi."
                  - "Say the English word: taxi. Is it close?"
                  - "Yes. Taxi is almost the same in both."
              - id: l1-f3
                type: true_false
                text: "Does the French word sound like the English word?"
                say: { en: "Listen. Does the French word sound like the English word?", fr: "Le chien." }
                show: { object: dog }
                answer: false
                feedback:
                  "true": "Chien sounds nothing like dog. Some words you learn by heart."
                hints:
                  - "Listen again: le chien."
                  - "Say the English word: dog. Does chien sound like dog?"
                  - "No. Chien and dog are not alike."
              - id: l1-f4
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Le serpent." }
                options: [{ object: worm }, { object: crocodile }, { object: snake }]
                answer: snake
                hints:
                  - "Listen again: le serpent."
                  - "A serpent is an old English word for a snake."
                  - "Tap the snake."
              - id: l1-f5
                type: sorting
                text: "Like English or not like English?"
                say: { en: "Tap each picture to hear the French word. Is it like the English word?" }
                bins:
                  - { id: like, show: { text: "like English" }, say: { en: "Like English." } }
                  - { id: unlike, show: { text: "not like English" }, say: { en: "Not like English." } }
                options:
                  - { object: train, bin: like, say: { fr: "Le train." } }
                  - { object: lamp, bin: like, say: { fr: "La lampe." } }
                  - { object: apple, bin: unlike, say: { fr: "La pomme." } }
                  - { object: house, bin: unlike, say: { fr: "La maison." } }
                hints:
                  - "Tap each picture and say the English word to yourself."
                  - "Train and train, lampe and lamp. Pomme and apple?"
                  - "Train and lampe are like English. Pomme and maison are not."
              - id: l1-f6
                type: speak
                say: { en: "Say it the French way. Land on the last part.", fr: "La tomate." }
                show: { object: tomato }
                expected_text: "la tomate"
                hints:
                  - "Listen again: la tomate."
                  - "Not to-MAR-to: to-MAT, landing on the end. You do not say the e."
                  - "Say it with me: la tomate."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "La lampe." }
                options: [{ object: candle }, { object: lamp }, { object: light-bulb }]
                answer: lamp
                hints: ["Lampe sounds like an English word."]
              - id: l1-s2
                type: true_false
                text: "Does the French word sound like the English word?"
                say: { en: "Listen. Does the French word sound like the English word?", fr: "La maison." }
                show: { object: house }
                answer: false
                hints: ["Say the English word: house. Is maison like it?"]
              - id: l1-s3
                type: audio_choice
                text: "What does it mean?"
                say: { en: "Listen. What does it mean?" }
                audio: { fr: "Le parc." }
                options: ["garden", "park", "house"]
                answer: "park"
                hints: ["Which English word sounds like parc?"]
              - id: l1-s4
                type: true_false
                text: "Does the French word sound like the English word?"
                say: { en: "Listen. Does the French word sound like the English word?", fr: "Le train." }
                show: { object: train }
                answer: true
                hints: ["Say the English word: train."]
              - id: l1-s5
                type: speak
                say: { en: "Say it the French way.", fr: "Le train." }
                show: { object: train }
                expected_text: "le train"
                hints: ["French train: the ain goes through your nose."]
              - id: l1-s6
                type: audio_choice
                text: "What is the clown eating?"
                say: { en: "Listen for a word you know. What is the clown eating?" }
                audio: { fr: "Le clown mange une pizza." }
                options: [{ object: cake }, { object: pizza }, { object: apple }]
                answer: pizza
                hints: ["One word at the end sounds just like English."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Le taxi." }
                options: [{ object: bus }, { object: car }, { object: taxi }]
                answer: taxi
              - id: l1-n2
                type: true_false
                text: "Does the French word sound like the English word?"
                say: { en: "Listen. Does the French word sound like the English word?", fr: "La pomme." }
                show: { object: apple }
                answer: false
              - id: l1-n3
                type: audio_choice
                text: "What does it mean?"
                say: { en: "Listen. What does it mean?" }
                audio: { fr: "La tomate." }
                options: ["carrot", "apple", "tomato"]
                answer: "tomato"
              - id: l1-n4
                type: true_false
                text: "Does the French word sound like the English word?"
                say: { en: "Listen. Does the French word sound like the English word?", fr: "Le serpent." }
                show: { object: snake }
                answer: true
              - id: l1-n5
                type: speak
                say: { en: "What is it? Say it the French way." }
                show: { object: zebra }
                expected_text: "le zèbre"
              - id: l1-n6
                type: sorting
                text: "Like English or not like English?"
                say: { en: "Tap each picture to hear the French word. Is it like the English word?" }
                bins:
                  - { id: like, show: { text: "like English" }, say: { en: "Like English." } }
                  - { id: unlike, show: { text: "not like English" }, say: { en: "Not like English." } }
                options:
                  - { object: zebra, bin: like, say: { fr: "Le zèbre." } }
                  - { object: dog, bin: unlike, say: { fr: "Le chien." } }
                  - { object: taxi, bin: like, say: { fr: "Le taxi." } }
                  - { object: bread, bin: unlike, say: { fr: "Le pain." } }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Le train." }
            options: [{ object: bus }, { object: train }, { object: ship }]
            answer: train
          - id: l1-c2
            type: true_false
            text: "Does the French word sound like the English word?"
            say: { en: "Listen. Does the French word sound like the English word?", fr: "Le parc." }
            show: { object: park }
            answer: true
          - id: l1-c3
            type: true_false
            text: "Does the French word sound like the English word?"
            say: { en: "Listen. Does the French word sound like the English word?", fr: "La main." }
            show: { object: hand }
            answer: false

  - n: 2
    title: { de: "Fast gleich geschrieben", en: "Spelt nearly the same" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Do you remember? Tap the picture." }
            audio: { fr: "Le zèbre." }
            options: [{ object: zebra }, { object: horse }]
            answer: zebra
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Does the French word sound like the English word?"
            say: { en: "Do you remember? Does the French word sound like the English word?", fr: "La lampe." }
            show: { object: lamp }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "giraffe → girafe"
            say: { en: "Now look at written words. Many are spelt almost the same. Spot the difference: giraffe has two fs, girafe has one.", fr: "La girafe." }
            show: { object: giraffe }
          - text: "tomato → tomate\nlamp → lampe"
            say: { en: "French words often end in e where English ones do not.", fr: "La tomate. La lampe." }
          - text: "le pain = bread\nla main = a hand"
            say: { en: "Careful with false friends. They look like English words but mean something else. Le pain is bread. La main is a hand.", fr: "Le pain. La main." }
            show: { object: bread }
          - text: "un crayon = a pencil"
            say: { en: "And un crayon is a pencil, not a crayon.", fr: "Un crayon." }
            show: { object: pencil }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which is the French word for giraffe?"
                options: ["giraffe", "girafe", "jiraf"]
                answer: "girafe"
                option_audio: false
                feedback:
                  giraffe: "That is the English spelling. French has one f: girafe."
                hints:
                  - "French and English spell it nearly the same. Look at the f."
                  - "English has two fs. French has one f and an e at the end."
                  - "Girafe."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What does “le pain” mean?"
                say: { en: "What does le pain mean?" }
                options: ["pain", "bread", "a pen"]
                answer: "bread"
                feedback:
                  pain: "Pain looks like an English word, but in French it means bread."
                hints:
                  - "Le pain is a false friend."
                  - "You buy it at the baker's in France and eat it with butter."
                  - "Bread."
              - id: l2-f3
                type: true_false
                text: "“La lampe” means a lamp."
                say: { en: "Is it true? La lampe means a lamp." }
                answer: true
                hints:
                  - "Look at the two words: lampe and lamp."
                  - "Only the e at the end is different."
                  - "Yes. It is true."
              - id: l2-f4
                type: matching
                text: "Match each French word to its picture."
                say: { en: "Tap a French word, then its picture." }
                pairs:
                  - left: { text: "le zèbre", say: { fr: "Le zèbre." } }
                    right: { object: zebra }
                  - left: { text: "la tomate", say: { fr: "La tomate." } }
                    right: { object: tomato }
                  - left: { text: "le pain", say: { fr: "Le pain." } }
                    right: { object: bread }
                  - left: { text: "la main", say: { fr: "La main." } }
                    right: { object: hand }
                hints:
                  - "Start with the words that look like English."
                  - "Le pain and la main are false friends: bread and a hand."
                  - "Zèbre, zebra. Tomate, tomato. Pain, bread. Main, hand."
              - id: l2-f5
                type: text_input
                text: "Write the French word. English: tomato. French: ?"
                say: { en: "Write the French word for tomato." }
                keyboard: letters
                answer: "tomate"
                hints:
                  - "It starts like the English word: toma."
                  - "French has a t and an e at the end, not an o."
                  - "Tomate."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which is the French word for lamp?"
                options: ["lampe", "lamp", "lampa"]
                answer: "lampe"
                option_audio: false
                hints: ["French often adds an e at the end."]
              - id: l2-s2
                type: multiple_choice
                text: "What does “la main” mean?"
                say: { en: "What does la main mean?" }
                options: ["main", "a hand", "a man"]
                answer: "a hand"
                hints: ["La main is a false friend."]
              - id: l2-s3
                type: true_false
                text: "“Un crayon” means a crayon."
                say: { en: "Is it true? Un crayon means a crayon." }
                answer: false
                hints: ["Un crayon is a false friend."]
              - id: l2-s4
                type: matching
                text: "Match each French word to its picture."
                say: { en: "Tap a French word, then its picture." }
                pairs:
                  - left: { text: "le train", say: { fr: "Le train." } }
                    right: { object: train }
                  - left: { text: "la girafe", say: { fr: "La girafe." } }
                    right: { object: giraffe }
                  - left: { text: "un crayon", say: { fr: "Un crayon." } }
                    right: { object: pencil }
                  - left: { text: "la pomme", say: { fr: "La pomme." } }
                    right: { object: apple }
                hints: ["Un crayon is a pencil. La pomme is nothing like English."]
              - id: l2-s5
                type: text_input
                text: "Write the French word. English: giraffe. French: ?"
                say: { en: "Write the French word for giraffe." }
                keyboard: letters
                answer: "girafe"
                hints: ["One f, and an e at the end."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which is the French word for zebra?"
                options: ["zebra", "zèbre", "zébra"]
                answer: "zèbre"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Which French word means bread?"
                options: ["le pain", "la pomme", "le parc"]
                answer: "le pain"
                option_audio: false
              - id: l2-n3
                type: true_false
                text: "“La tomate” means a tomato."
                say: { en: "Is it true? La tomate means a tomato." }
                answer: true
              - id: l2-n4
                type: text_input
                text: "Write the French word. English: lamp. French: ?"
                say: { en: "Write the French word for lamp." }
                keyboard: letters
                answer: "lampe"
              - id: l2-n5
                type: sorting
                text: "Same meaning or false friend?"
                say: { en: "Does the French word mean the same as the English word it looks like? Sort the words." }
                bins:
                  - { id: same, show: { text: "same meaning" }, say: { en: "Same meaning." } }
                  - { id: false-friend, show: { text: "false friend" }, say: { en: "False friend." } }
                options:
                  - { text: "le taxi", bin: same }
                  - { text: "le pain", bin: false-friend }
                  - { text: "la lampe", bin: same }
                  - { text: "la main", bin: false-friend }
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which is the French word for tomato?"
            options: ["tomato", "tomat", "tomate"]
            answer: "tomate"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "What does “un crayon” mean?"
            say: { en: "What does un crayon mean?" }
            options: ["a crayon", "a pencil", "a pen"]
            answer: "a pencil"
          - id: l2-c3
            type: true_false
            text: "Does the French word sound like the English word?"
            say: { en: "Listen. Does the French word sound like the English word?", fr: "Le zèbre." }
            show: { object: zebra }
            answer: true
          - id: l2-c4
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "La girafe." }
            options: [{ object: zebra }, { object: horse }, { object: giraffe }]
            answer: giraffe
          - id: l2-c5
            type: true_false
            text: "“Le pain” means pain."
            say: { en: "Is it true? Le pain means pain." }
            answer: false
