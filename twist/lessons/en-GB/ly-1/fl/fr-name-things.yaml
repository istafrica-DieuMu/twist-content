# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-name-things
skill: fl.speaking.name-things
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Dinge benennen (Französisch)
  en: Naming things in French
summary: >
  Children see a picture and name it in French. Lesson 1 asks qu'est-ce
  que c'est ? and answers c'est un chat, c'est une pomme, with animals,
  fruit and school things, and says why un or une always comes with the
  word. Lesson 2 adds a colour (un ballon rouge, with the colour after the
  thing) and a number (trois chats), and ends with the skill check. Most
  practise tasks are speaking, which is practised and not marked; the
  checks ask whether a name fits a picture and which word order is right.
metadata:
  year: ly-1
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.imitate]
  also_practises: [fl.themes.colours, fl.themes.numbers-to-10, fl.themes.school]
  vocabulary: { fr: ["qu'est-ce que c'est ?", "c'est un ...", "c'est une ...", un chat, un chien, un poisson, une pomme, une banane, un livre, un crayon, une règle, un ballon, rouge, bleu, vert, jaune, noir, violet] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: no-article
      what: Names the thing without un or une (c'est chat), as children often do with single words
      addressed: lesson 1 Learn says un and une always go with the word; every lesson 1 speak task models c'est un or c'est une, and the none-stage speak tasks (l1-n1, l1-n3, l1-n5) expect the article
    - id: colour-order
      what: Puts the colour before the thing, as in English (un rouge ballon)
      addressed: lesson 2 Learn says the colour comes after the thing; l2-f3 gives feedback on the English order, and l2-s1, l2-n2 and l2-c3 ask which order is right
    - id: crayon-false-friend
      what: Takes un crayon for a crayon, when it is a pencil
      addressed: l1-f4 gives feedback when un crayon is accepted for a book; l1-s3 sets the pencil against the wax crayon, and l1-n5 has the child name the pencil
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Qu'est-ce que c'est?", en: "Qu'est-ce que c'est?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which sound do you hear?"
            say: { en: "Listen. Do you hear u, as in lune, or ou, as in loup?" }
            audio: { fr: "La rue." }
            options: ["u, as in lune", "ou, as in loup"]
            answer: "u, as in lune"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Do you hear a French r?"
            say: { en: "Listen. Do you hear a French r?", fr: "Le renard." }
            show: { object: fox }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "To ask what something is, say qu'est-ce que c'est ? The answer starts with c'est, it is.", fr: "Qu'est-ce que c'est ? C'est un chat." }
            show: { object: cat }
          - say: { en: "Un or une always goes in front of the word: un chien, une pomme. Learn them together.", fr: "Un chien. Une pomme." }
            show: { object: dog }
          - say: { en: "School things: un livre, un crayon, une règle. Careful: un crayon is a pencil.", fr: "Un livre. Un crayon. Une règle." }
            show: { object: pencil }
          - say: { en: "When you see something, name it in French with c'est.", fr: "C'est un livre !" }
            show: { object: book }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: speak
                say: { en: "What is it? Say it in French with c'est.", fr: "C'est un chat." }
                show: { object: cat }
                expected_text: "c'est un chat"
                hints:
                  - "Listen again: c'est un chat."
                  - "Start with c'est, then un, then chat. You do not say the t of chat."
                  - "Say it with me: C'est un chat."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Is that the right name for the picture?"
                say: { en: "Listen. Is that the right name for the picture?", fr: "C'est un chien." }
                show: { object: dog }
                answer: true
                hints:
                  - "Listen again: c'est un chien."
                  - "Un chien is a dog."
                  - "Yes. It is a dog: un chien."
              - id: l1-f3
                type: audio_choice
                text: "Which picture is it?"
                say: { en: "Listen. Which picture is it? Tap it." }
                audio: { fr: "C'est une pomme." }
                options: [{ object: banana }, { object: ball }, { object: apple }]
                answer: apple
                hints:
                  - "Listen for the word after c'est une."
                  - "Une pomme is a fruit. It can be red or green."
                  - "Tap the apple."
              - id: l1-f4
                type: true_false
                text: "Is that the right name for the picture?"
                say: { en: "Listen. Is that the right name for the picture?", fr: "C'est un crayon." }
                show: { object: book }
                answer: false
                feedback:
                  "true": "Un crayon is a pencil. This is un livre, a book."
                hints:
                  - "Listen again: c'est un crayon."
                  - "Un crayon is a pencil. Is this a pencil?"
                  - "No. This is a book: un livre."
              - id: l1-f5
                type: speak
                say: { en: "What is it? Say it in French with c'est.", fr: "C'est un livre." }
                show: { object: book }
                expected_text: "c'est un livre"
                hints:
                  - "Listen again: c'est un livre."
                  - "Un livre: the vre at the end is very short."
                  - "Say it with me: C'est un livre."

          - support: some
            tasks:
              - id: l1-s1
                type: speak
                say: { en: "What is it? Say it in French with c'est.", fr: "C'est une règle." }
                show: { object: ruler }
                expected_text: "c'est une règle"
                hints: ["Une règle, not un: learn the une with the word."]
              - id: l1-s2
                type: true_false
                text: "Is that the right name for the picture?"
                say: { en: "Listen. Is that the right name for the picture?", fr: "C'est un livre." }
                show: { object: book }
                answer: true
                hints: ["Un livre is a book."]
              - id: l1-s3
                type: audio_choice
                text: "Which picture is it?"
                say: { en: "Listen. Which picture is it? Tap it." }
                audio: { fr: "Qu'est-ce que c'est ? C'est un crayon." }
                options: [{ object: crayon }, { object: pen }, { object: pencil }]
                answer: pencil
                hints: ["Careful: in French, un crayon is a pencil."]
              - id: l1-s4
                type: speak
                say: { en: "What is it? Say it in French with c'est.", fr: "C'est un poisson." }
                show: { object: fish }
                expected_text: "c'est un poisson"
                hints: ["Poisson has a soft s in the middle, like in kiss."]
              - id: l1-s5
                type: true_false
                text: "Is that the right name for the picture?"
                say: { en: "Listen. Is that the right name for the picture?", fr: "C'est une banane." }
                show: { object: apple }
                answer: false
                hints: ["Une banane is long and yellow."]

          - support: none
            tasks:
              - id: l1-n1
                type: speak
                say: { en: "What is it? Say it in French with c'est." }
                show: { object: dog }
                expected_text: "c'est un chien"
              - id: l1-n2
                type: audio_choice
                text: "Which picture is it?"
                say: { en: "Listen. Which picture is it? Tap it." }
                audio: { fr: "C'est un chien." }
                options: [{ object: cat }, { object: rabbit }, { object: dog }]
                answer: dog
              - id: l1-n3
                type: speak
                say: { en: "What is it? Say it in French with c'est." }
                show: { object: apple }
                expected_text: "c'est une pomme"
              - id: l1-n4
                type: true_false
                text: "Is that the right name for the picture?"
                say: { en: "Listen. Is that the right name for the picture?", fr: "C'est une règle." }
                show: { object: ruler }
                answer: true
              - id: l1-n5
                type: speak
                say: { en: "What is it? Say it in French with c'est." }
                show: { object: pencil }
                expected_text: "c'est un crayon"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: true_false
            text: "Is that the right name for the picture?"
            say: { en: "Listen. Is that the right name for the picture?", fr: "C'est un chat." }
            show: { object: dog }
            answer: false
          - id: l1-c2
            type: audio_choice
            text: "Which picture is it?"
            say: { en: "Listen. Which picture is it? Tap it." }
            audio: { fr: "C'est un livre." }
            options: [{ object: pencil }, { object: book }, { object: ruler }]
            answer: book
          - id: l1-c3
            type: true_false
            text: "Is that the right name for the picture?"
            say: { en: "Listen. Is that the right name for the picture?", fr: "C'est un poisson." }
            show: { object: fish }
            answer: true

  - n: 2
    title: { de: "Un ballon rouge", en: "Un ballon rouge" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which picture is it?"
            say: { en: "Do you remember? Which picture is it?" }
            audio: { fr: "C'est un chat." }
            options: [{ object: cat }, { object: dog }]
            answer: cat
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is that the right name for the picture?"
            say: { en: "Do you remember? Is that the right name for the picture?", fr: "C'est une pomme." }
            show: { object: apple }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "You can say the colour too. In French the colour comes after the thing: un ballon rouge, a ball red.", fr: "Un ballon rouge. Un ballon bleu." }
            show: { object: ball, colour: red }
          - say: { en: "For how many, the number comes first, just like in English.", fr: "Trois chats. Deux livres." }
            show: { object: cat, count: 3 }
          - say: { en: "So you can name a thing, its colour and how many.", fr: "C'est un ballon jaune. Cinq pommes." }
            show: { object: ball, colour: yellow }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Tap the right picture."
                say: { en: "Listen. Tap the right picture." }
                audio: { fr: "Un ballon vert." }
                options:
                  - { object: ball, colour: red }
                  - { object: ball, colour: green }
                  - { object: ball, colour: blue }
                answer: green
                hints:
                  - "Listen for the colour after ballon."
                  - "Vert is the colour of a frog."
                  - "Tap the green ball."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Is that the right name for the picture?"
                say: { en: "Listen. Is that the right name for the picture?", fr: "Deux chats." }
                show: { object: cat, count: 2 }
                answer: true
                hints:
                  - "Listen again: deux chats."
                  - "Deux is two. Count the cats."
                  - "Yes. Two cats: deux chats."
              - id: l2-f3
                type: multiple_choice
                text: "Which one is right in French? A red ball."
                say: { en: "Which one is right in French? A red ball." }
                options: ["un ballon rouge", "un rouge ballon"]
                answer: "un ballon rouge"
                option_audio: false
                feedback:
                  "un rouge ballon": "That is the English order. In French the colour comes after the thing: un ballon rouge."
                hints:
                  - "Where does the colour go in French?"
                  - "In French the thing comes first, then the colour."
                  - "Un ballon rouge."
              - id: l2-f4
                type: speak
                say: { en: "Say it in French with the colour.", fr: "Un ballon bleu." }
                show: { object: ball, colour: blue }
                expected_text: "un ballon bleu"
                hints:
                  - "Listen again: un ballon bleu."
                  - "First un ballon, then the colour, bleu."
                  - "Say it with me: Un ballon bleu."
              - id: l2-f5
                type: audio_choice
                text: "Tap the right picture."
                say: { en: "Listen. Tap the right picture." }
                audio: { fr: "Quatre pommes." }
                options:
                  - { object: apple, count: 3 }
                  - { object: apple, count: 4 }
                  - { object: apple, count: 5 }
                answer: "4"
                hints:
                  - "Listen for the number before pommes."
                  - "Quatre is four."
                  - "Tap the four apples."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which one is right in French? A black cat."
                say: { en: "Which one is right in French? A black cat." }
                options: ["un noir chat", "un chat noir"]
                answer: "un chat noir"
                option_audio: false
                hints: ["The thing first, then the colour."]
              - id: l2-s2
                type: speak
                say: { en: "Say it in French.", fr: "Trois livres." }
                show: { object: book, count: 3 }
                expected_text: "trois livres"
                hints: ["The number first: trois, then livres. You do not hear the s at the end."]
              - id: l2-s3
                type: true_false
                text: "Is that the right name for the picture?"
                say: { en: "Listen. Is that the right name for the picture?", fr: "Un ballon jaune." }
                show: { object: ball, colour: red }
                answer: false
                hints: ["Jaune is the colour of a banana."]
              - id: l2-s4
                type: audio_choice
                text: "Tap the right picture."
                say: { en: "Listen. Tap the right picture." }
                audio: { fr: "Cinq poissons." }
                options:
                  - { object: fish, count: 4 }
                  - { object: fish, count: 6 }
                  - { object: fish, count: 5 }
                answer: "5"
                hints: ["Cinq is five."]
              - id: l2-s5
                type: speak
                say: { en: "Say it in French.", fr: "Deux pommes." }
                show: { object: apple, count: 2 }
                expected_text: "deux pommes"
                hints: ["Deux, then pommes."]

          - support: none
            tasks:
              - id: l2-n1
                type: speak
                say: { en: "Say it in French with the colour." }
                show: { object: ball, colour: yellow }
                expected_text: "un ballon jaune"
              - id: l2-n2
                type: multiple_choice
                text: "Which one is right in French? A green book."
                say: { en: "Which one is right in French? A green book." }
                options: ["un livre vert", "un vert livre"]
                answer: "un livre vert"
                option_audio: false
              - id: l2-n3
                type: audio_choice
                text: "Tap the right picture."
                say: { en: "Listen. Tap the right picture." }
                audio: { fr: "Un ballon violet." }
                options:
                  - { object: ball, colour: blue }
                  - { object: ball, colour: brown }
                  - { object: ball, colour: purple }
                answer: purple
              - id: l2-n4
                type: speak
                say: { en: "How many? Say it in French." }
                show: { object: cat, count: 4 }
                expected_text: "quatre chats"
              - id: l2-n5
                type: true_false
                text: "Is that the right name for the picture?"
                say: { en: "Listen. Is that the right name for the picture?", fr: "Trois poissons." }
                show: { object: fish, count: 3 }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Which picture is it?"
            say: { en: "Listen. Which picture is it? Tap it." }
            audio: { fr: "Qu'est-ce que c'est ? C'est une règle." }
            options: [{ object: ruler }, { object: pencil }, { object: book }]
            answer: ruler
          - id: l2-c2
            type: true_false
            text: "Is that the right name for the picture?"
            say: { en: "Listen. Is that the right name for the picture?", fr: "C'est une pomme." }
            show: { object: banana }
            answer: false
          - id: l2-c3
            type: multiple_choice
            text: "Which one is right in French? A blue pencil."
            say: { en: "Which one is right in French? A blue pencil." }
            options: ["un bleu crayon", "un crayon bleu"]
            answer: "un crayon bleu"
            option_audio: false
          - id: l2-c4
            type: audio_choice
            text: "Tap the right picture."
            say: { en: "Listen. Tap the right picture." }
            audio: { fr: "Six chats." }
            options:
              - { object: cat, count: 5 }
              - { object: cat, count: 6 }
              - { object: cat, count: 8 }
            answer: "6"
          - id: l2-c5
            type: audio_choice
            text: "Tap the right picture."
            say: { en: "Listen. Tap the right picture." }
            audio: { fr: "Un ballon rouge." }
            options:
              - { object: ball, colour: yellow }
              - { object: ball, colour: red }
              - { object: ball, colour: green }
            answer: red
