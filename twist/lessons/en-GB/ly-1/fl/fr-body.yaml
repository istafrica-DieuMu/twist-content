# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-body
skill: fl.themes.body
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Der Körper (Französisch)
  en: The body in French
summary: >
  Parts of the body in French and short instructions to act on. Lesson 1
  brings the head: la tête, le nez, la bouche, l'oreille, un œil and les
  yeux, with touche ... ! Lesson 2 brings le bras, la main, la jambe and
  le pied with lève ... !, sets la main against le pied, and ends with the
  skill check. Children hear a word or an instruction and tap the part of
  the body it names. Instructions are in English; the French is heard.
metadata:
  year: ly-1
  topic: { de: Körper, en: Body }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.listening.classroom-phrases, fl.speaking.imitate]
  vocabulary: { fr: [la tête, le nez, la bouche, l'oreille, les oreilles, un œil, les yeux, le bras, la main, la jambe, le pied, touche, lève] }
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: head, what: { de: Teile des Kopfes verstehen, en: understanding the parts of the head } }
    - { id: limbs, what: { de: "Arm, Hand, Bein und Fuß verstehen", en: "understanding arm, hand, leg and foot" } }
    - { id: instructions, what: { de: auf touche und lève mit dem richtigen Körperteil reagieren, en: acting on touche and lève with the right part of the body } }
  misconceptions:
    - id: yeux-oeil
      what: Expects les yeux to sound like un œil, so does not recognise eyes in the plural
      addressed: lesson 1 Learn sets un œil against les yeux; l1-f5 gives feedback when the ear is chosen for les yeux, and l1-s2, l1-s6, l1-n5 and l2-c5 ask for eyes again in both forms
    - id: main-false-friend
      what: Takes la main for an English word, or mixes up la main and le pied
      addressed: lesson 2 Learn says main means hand; l2-f1 gives feedback when the foot is chosen, and l2-s2, l2-n2 and l2-c2 set hand and foot apart
    - id: leg-foot
      what: Mixes up la jambe and le pied, which sit on the same limb
      addressed: l2-f2 gives feedback when the leg is chosen for le pied; l2-f4, l2-s5 and l2-c4 ask for leg or foot with both shown
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "La tête, le nez", en: "La tête, le nez" }
    goal:
      de: "Lerne die Teile deines Kopfes auf Französisch, zum Beispiel le nez, und finde den Teil, den du hörst."
      en: "Learn the parts of your head in French, like le nez, and find the part you hear."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Parts of the body in French. Head and nose:", fr: "La tête. Le nez." }
            show: { object: head }
          - say: { en: "Mouth and ear:", fr: "La bouche. L'oreille." }
            show: { object: mouth }
          - say: { en: "One eye is un œil. Two eyes are les yeux, a very different word.", fr: "Un œil. Les yeux." }
            show: { object: eye }
          - say: { en: "Touche means touch. Listen, and touch your nose.", fr: "Touche ton nez !" }
            show: { object: nose }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "La tête." }
                options: [{ object: head }, { object: nose }, { object: ear }]
                answer: head
                hints:
                  - "Listen again: la tête."
                  - "La tête is the whole top of you, with your hair on it."
                  - "Tap the head."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What do you touch?"
                say: { en: "Listen. What do you touch? Tap the picture." }
                audio: { fr: "Touche ta bouche !" }
                options: [{ object: nose }, { object: mouth }, { object: eye }]
                answer: mouth
                feedback:
                  nose: "That is le nez. La bouche is your mouth."
                hints:
                  - "Listen for the word after touche ta."
                  - "La bouche is what you eat and talk with."
                  - "Tap the mouth."
              - id: l1-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le nez." }
                show: { object: nose }
                answer: true
                hints:
                  - "Listen again: le nez."
                  - "Le nez is what you smell with."
                  - "Yes. That is the nose."
              - id: l1-f4
                type: speak
                say: { en: "Say it in French.", fr: "L'oreille." }
                show: { object: ear }
                expected_text: "l'oreille"
                hints:
                  - "Listen again: l'oreille."
                  - "The end, ille, sounds like ey: o-rey."
                  - "Say it with me: l'oreille."
              - id: l1-f5
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Les yeux." }
                options: [{ object: ear }, { object: eye }, { object: head }]
                answer: eye
                feedback:
                  ear: "That is l'oreille. Les yeux are the eyes."
                hints:
                  - "Listen again: les yeux."
                  - "One eye is un œil. Two eyes are les yeux."
                  - "Tap the eye."
              - id: l1-f6
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Touche ton oreille !" }
                show: { object: nose }
                answer: false
                hints:
                  - "Listen to the last word: oreille."
                  - "L'oreille is the ear. Is this an ear?"
                  - "No. This is the nose."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Le nez." }
                options: [{ object: mouth }, { object: head }, { object: nose }]
                answer: nose
                hints: ["Le nez is what you smell with."]
              - id: l1-s2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Les yeux." }
                show: { object: eye }
                answer: true
                hints: ["Les yeux are what you see with."]
              - id: l1-s3
                type: speak
                say: { en: "Say it in French.", fr: "La bouche." }
                show: { object: mouth }
                expected_text: "la bouche"
                hints: ["The ou in bouche sounds like the oo in moon."]
              - id: l1-s4
                type: audio_choice
                text: "What do you touch?"
                say: { en: "Listen. What do you touch? Tap the picture." }
                audio: { fr: "Touche ton oreille !" }
                options: [{ object: eye }, { object: ear }, { object: mouth }]
                answer: ear
                hints: ["L'oreille is what you hear with."]
              - id: l1-s5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "La tête." }
                show: { object: mouth }
                answer: false
                hints: ["La tête is the head."]
              - id: l1-s6
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Un œil." }
                options: [{ object: nose }, { object: ear }, { object: eye }]
                answer: eye
                hints: ["Un œil is one eye. Two are les yeux."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "L'oreille." }
                options: [{ object: head }, { object: eye }, { object: ear }]
                answer: ear
              - id: l1-n2
                type: audio_choice
                text: "What do you touch?"
                say: { en: "Listen. What do you touch? Tap the picture." }
                audio: { fr: "Touche ta tête !" }
                options: [{ object: head }, { object: nose }, { object: mouth }]
                answer: head
              - id: l1-n3
                type: speak
                say: { en: "What is this? Say it in French." }
                show: { object: nose }
                expected_text: "le nez"
              - id: l1-n4
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "La bouche." }
                show: { object: mouth }
                answer: true
              - id: l1-n5
                type: audio_choice
                text: "What do you touch?"
                say: { en: "Listen. What do you touch? Tap the picture." }
                audio: { fr: "Touche tes yeux !" }
                options: [{ object: ear }, { object: eye }, { object: head }]
                answer: eye
              - id: l1-n6
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le nez." }
                show: { object: ear }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "La bouche." }
            options: [{ object: nose }, { object: mouth }, { object: ear }]
            answer: mouth
          - id: l1-c2
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Les yeux." }
            show: { object: ear }
            answer: false
          - id: l1-c3
            type: audio_choice
            text: "What do you touch?"
            say: { en: "Listen. What do you touch? Tap the picture." }
            audio: { fr: "Touche ton nez !" }
            options: [{ object: eye }, { object: mouth }, { object: nose }]
            answer: nose
          - id: l1-c4
            type: audio_choice
            text: "You hear two words. Tap the one you hear second."
            say: { en: "Listen. You hear two words. Tap the one you hear second." }
            audio: { turns: [{ fr: "L'oreille." }, { fr: "La tête." }] }
            options: [{ object: ear }, { object: nose }, { object: head }]
            answer: head
          - id: l1-c5
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Un œil." }
            show: { object: eye }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "What do you touch?"
            say: { en: "Listen. What do you touch? Tap the picture." }
            audio: { fr: "Touche ton œil !" }
            options: [{ object: ear }, { object: eye }, { object: mouth }]
            answer: eye

  - n: 2
    title: { de: "La main, le pied", en: "La main, le pied" }
    goal:
      de: "Lerne Arm, Hand, Bein und Fuß auf Französisch und mach, was du hörst, zum Beispiel lève la main."
      en: "Learn arm, hand, leg and foot in French, and do what you hear, like lève la main."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Do you remember? Tap the picture." }
            audio: { fr: "Le nez." }
            options: [{ object: nose }, { object: ear }]
            answer: nose
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Does the picture match?"
            say: { en: "Do you remember? Does the picture match?", fr: "La bouche." }
            show: { object: mouth }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Arm and hand:", fr: "Le bras. La main." }
            show: { object: arm }
          - say: { en: "Leg and foot:", fr: "La jambe. Le pied." }
            show: { object: leg }
          - say: { en: "Main looks like an English word, but in French it means hand. Pied means foot, at the end of your leg.", fr: "La main. Le pied." }
            show: { object: hand }
          - say: { en: "Lève means raise, or lift. Listen and do it.", fr: "Lève la main ! Lève le bras ! Touche ton pied !" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "La main." }
                options: [{ object: foot }, { object: hand }, { object: arm }]
                answer: hand
                feedback:
                  foot: "Le pied is the foot. La main is the hand."
                hints:
                  - "Listen again: la main."
                  - "La main is what you write and wave with."
                  - "Tap the hand."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Le pied." }
                options: [{ object: leg }, { object: hand }, { object: foot }]
                answer: foot
                feedback:
                  leg: "La jambe is the leg. Le pied is the foot, at the end of your leg."
                hints:
                  - "Listen again: le pied."
                  - "Le pied is what you put a shoe on."
                  - "Tap the foot."
              - id: l2-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le bras." }
                show: { object: arm }
                answer: true
                hints:
                  - "Listen again: le bras. You do not hear the s."
                  - "Le bras goes from your shoulder to your hand."
                  - "Yes. That is the arm."
              - id: l2-f4
                type: audio_choice
                text: "What do you touch?"
                say: { en: "Listen. What do you touch? Tap the picture." }
                audio: { fr: "Touche ta jambe !" }
                options: [{ object: arm }, { object: foot }, { object: leg }]
                answer: leg
                hints:
                  - "Listen for the word after touche ta."
                  - "La jambe is what you walk with, from your hip to your foot."
                  - "Tap the leg."
              - id: l2-f5
                type: speak
                say: { en: "Say it in French.", fr: "La jambe." }
                show: { object: leg }
                expected_text: "la jambe"
                hints:
                  - "Listen again: la jambe."
                  - "The am in jambe goes through your nose."
                  - "Say it with me: la jambe."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "What do you raise?"
                say: { en: "Listen. What do you raise? Tap the picture." }
                audio: { fr: "Lève la main !" }
                options: [{ object: head }, { object: hand }, { object: foot }]
                answer: hand
                hints: ["La main is the hand."]
              - id: l2-s2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le pied." }
                show: { object: hand }
                answer: false
                hints: ["Le pied is the foot. Is this a foot?"]
              - id: l2-s3
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Le bras." }
                options: [{ object: leg }, { object: ear }, { object: arm }]
                answer: arm
                hints: ["Le bras goes from your shoulder to your hand."]
              - id: l2-s4
                type: speak
                say: { en: "Say it in French.", fr: "Le pied." }
                show: { object: foot }
                expected_text: "le pied"
                hints: ["Pied sounds like pyay. You do not say the d."]
              - id: l2-s5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "La jambe." }
                show: { object: leg }
                answer: true
                hints: ["La jambe is the leg."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "What do you touch?"
                say: { en: "Listen. What do you touch? Tap the picture." }
                audio: { fr: "Touche ton pied !" }
                options: [{ object: hand }, { object: foot }, { object: nose }]
                answer: foot
              - id: l2-n2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "La main." }
                show: { object: hand }
                answer: true
              - id: l2-n3
                type: audio_choice
                text: "What do you raise?"
                say: { en: "Listen. What do you raise? Tap the picture." }
                audio: { fr: "Lève le bras !" }
                options: [{ object: arm }, { object: leg }, { object: head }]
                answer: arm
              - id: l2-n4
                type: speak
                say: { en: "What is this? Say it in French." }
                show: { object: hand }
                expected_text: "la main"
              - id: l2-n5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le bras." }
                show: { object: foot }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: head
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Les oreilles." }
            options: [{ object: eye }, { object: mouth }, { object: ear }]
            answer: ear
          - id: l2-c2
            part: instructions
            type: audio_choice
            text: "What do you touch?"
            say: { en: "Listen. What do you touch? Tap the picture." }
            audio: { fr: "Touche ta main !" }
            options: [{ object: foot }, { object: hand }, { object: nose }]
            answer: hand
          - id: l2-c3
            part: head
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "La tête." }
            show: { object: head }
            answer: true
          - id: l2-c4
            part: instructions
            type: audio_choice
            text: "What do you raise?"
            say: { en: "Listen. What do you raise? Tap the picture." }
            audio: { fr: "Lève le pied !" }
            options: [{ object: arm }, { object: foot }, { object: leg }]
            answer: foot
          - id: l2-c5
            part: head
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Les yeux." }
            show: { object: mouth }
            answer: false
          - id: l2-c6
            part: head
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "L'oreille." }
            show: { object: ear }
            answer: true
          - id: l2-c7
            part: head
            type: audio_choice
            text: "You hear two words. Tap the one you hear second."
            say: { en: "Listen. You hear two words. Tap the one you hear second." }
            audio: { turns: [{ fr: "Le nez." }, { fr: "La bouche." }] }
            options: [{ object: nose }, { object: eye }, { object: mouth }]
            answer: mouth
          - id: l2-c8
            part: head
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Un œil." }
            show: { object: nose }
            answer: false
          - id: l2-c9
            part: head
            type: audio_choice
            text: "You hear two words. Which picture is not one of them? Tap it."
            say: { en: "Listen. You hear two words. Which picture is not one of them? Tap it." }
            audio: { turns: [{ fr: "La tête." }, { fr: "Les yeux." }] }
            options: [{ object: head }, { object: ear }, { object: eye }]
            answer: ear
          - id: l2-c10
            part: limbs
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "La jambe." }
            options: [{ object: foot }, { object: leg }, { object: arm }]
            answer: leg
          - id: l2-c11
            part: limbs
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "La jambe." }
            show: { object: foot }
            answer: false
          - id: l2-c12
            part: limbs
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Le pied." }
            show: { object: foot }
            answer: true
          - id: l2-c13
            part: limbs
            type: audio_choice
            text: "You hear two words. Tap the one you hear first."
            say: { en: "Listen. You hear two words. Tap the one you hear first." }
            audio: { turns: [{ fr: "Le bras." }, { fr: "La jambe." }] }
            options: [{ object: leg }, { object: arm }, { object: hand }]
            answer: arm
          - id: l2-c14
            part: limbs
            type: audio_choice
            text: "You hear two words. Tap the one you hear second."
            say: { en: "Listen. You hear two words. Tap the one you hear second." }
            audio: { turns: [{ fr: "Le pied." }, { fr: "La main." }] }
            options: [{ object: foot }, { object: hand }, { object: leg }]
            answer: hand
          - id: l2-c15
            part: limbs
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "La main." }
            show: { object: arm }
            answer: false
          - id: l2-c16
            part: limbs
            type: audio_choice
            text: "You hear two words. Which picture is not one of them? Tap it."
            say: { en: "Listen. You hear two words. Which picture is not one of them? Tap it." }
            audio: { turns: [{ fr: "La jambe." }, { fr: "Le bras." }] }
            options: [{ object: leg }, { object: foot }, { object: arm }]
            answer: foot
          - id: l2-c17
            part: instructions
            type: audio_choice
            text: "What do you touch?"
            say: { en: "Listen. What do you touch? Tap the picture." }
            audio: { fr: "Touche ton bras !" }
            options: [{ object: hand }, { object: arm }, { object: leg }]
            answer: arm
          - id: l2-c18
            part: instructions
            type: audio_choice
            text: "What do you raise?"
            say: { en: "Listen. What do you raise? Tap the picture." }
            audio: { fr: "Lève la jambe !" }
            options: [{ object: arm }, { object: head }, { object: leg }]
            answer: leg
          - id: l2-c19
            part: instructions
            type: true_false
            text: "You hear an instruction. Is this the part you touch?"
            say: { en: "Listen. Is this the part you touch?" }
            audio: { fr: "Touche ta bouche !" }
            show: { object: mouth }
            answer: true
          - id: l2-c20
            part: instructions
            type: audio_choice
            text: "You hear two instructions. What do you touch second? Tap the picture."
            say: { en: "Listen. You hear two instructions. What do you touch second? Tap the picture." }
            audio: { fr: "Touche ton nez ! Touche ta bouche !" }
            options: [{ object: nose }, { object: mouth }, { object: ear }]
            answer: mouth
