# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-classroom-phrases
skill: fl.listening.classroom-phrases
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Was sollst du tun? (Französisch)
  en: Classroom instructions in French
summary: >
  The first French lessons in Year 3. Children hear short classroom
  instructions in French (Levez-vous ! Écoutez ! Ouvrez vos livres !) and
  show they understand by tapping the child who does it. Instructions to
  the child are in English; the French is heard. Lesson 1 brings four
  instructions, lesson 2 six more and ends with the skill check over all
  ten.
metadata:
  year: ly-1
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.speaking.imitate]
  vocabulary: { fr: ["Levez-vous !", "Asseyez-vous !", "Écoutez !", "Regardez !", "Tapez dans vos mains !", "Sautez !", "Silence !", "Faites coucou !", "Montrez du doigt !", "Ouvrez vos livres !"] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: move, what: { de: "Aufforderungen zum Bewegen: aufstehen, hinsetzen, springen", en: "instructions to move: stand up, sit down, jump" } }
    - { id: hands, what: { de: "Aufforderungen für die Hände: klatschen, winken, zeigen, Bücher öffnen", en: "instructions for your hands: clap, wave, point, open your books" } }
    - { id: attention, what: { de: "Aufforderungen zum Zuhören, Hinschauen und Leisesein", en: "instructions to listen, look and be quiet" } }
  misconceptions:
    - id: stand-sit
      what: Mixes up Levez-vous and Asseyez-vous, which both end in vous
      addressed: lesson 1 sets them side by side in every stage; hints point at the start of the word (lev, a-ssey)
    - id: spelling-sound
      what: Expects French to sound the way it is spelt in English (Écoutez as "e-cout-ez")
      addressed: the French is only heard, never read, in these lessons
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Aufstehen, hinsetzen", en: "Standing up, sitting down" }
    goal:
      de: "Hör der Lehrerin auf Französisch zu und finde das Kind, das es macht, zum Beispiel bei levez-vous."
      en: "Listen to the teacher in French and find the child who does it, like levez-vous for stand up."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Listen. This is how you say stand up in French.", fr: "Levez-vous ! Levez-vous !" }
            show: { object: stand-up }
          - say: { en: "And this is sit down.", fr: "Asseyez-vous ! Asseyez-vous !" }
            show: { object: sit-down }
          - say: { en: "Listen.", fr: "Écoutez ! Écoutez !" }
            show: { object: listen }
          - say: { en: "Look.", fr: "Regardez ! Regardez !" }
            show: { object: look }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What should you do?"
                say: { en: "Listen. What should you do? Tap the picture." }
                audio: { fr: "Levez-vous !" }
                options: [{ object: stand-up }, { object: sit-down }, { object: listen }]
                answer: stand-up
                feedback:
                  sit-down: "That child is sitting down. Levez-vous means stand up."
                hints:
                  - "Listen again: Levez-vous !"
                  - "It starts with lev, like lift: up you go."
                  - "Tap the child standing up."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What should you do?"
                say: { en: "Listen. What should you do? Tap the picture." }
                audio: { fr: "Asseyez-vous !" }
                options: [{ object: look }, { object: stand-up }, { object: sit-down }]
                answer: sit-down
                feedback:
                  stand-up: "That child is standing up. Asseyez-vous means sit down."
                hints:
                  - "Listen again: Asseyez-vous !"
                  - "It starts with a-ssey, which sounds a bit like seat."
                  - "Tap the child on the chair."
              - id: l1-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Écoutez !" }
                show: { object: listen }
                answer: true
                hints:
                  - "Listen again: Écoutez !"
                  - "Écoutez means listen. What is the child doing?"
                  - "Yes, the child is listening."
              - id: l1-f4
                type: audio_choice
                text: "What should you do?"
                say: { en: "Listen. What should you do? Tap the picture." }
                audio: { fr: "Regardez !" }
                options: [{ object: listen }, { object: look }, { object: sit-down }]
                answer: look
                feedback:
                  listen: "That child is listening. Regardez means look."
                hints:
                  - "Listen again: Regardez !"
                  - "Regardez means look. It's about your eyes."
                  - "Tap the child looking into the distance."
              - id: l1-f5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Levez-vous !" }
                show: { object: sit-down }
                answer: false
                hints:
                  - "Listen again: Levez-vous !"
                  - "Levez-vous means stand up. Is the child standing up?"
                  - "No, the child is sitting down."
              - id: l1-f6
                type: speak
                say: { en: "Say it in French.", fr: "Asseyez-vous !" }
                show: { object: sit-down }
                expected_text: "asseyez-vous"
                hints:
                  - "Listen again: Asseyez-vous !"
                  - "Three parts: a, ssey, ez. Then vous."
                  - "Say it with me: Asseyez-vous !"

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What should you do?"
                say: { en: "Listen. What should you do? Tap the picture." }
                audio: { fr: "Écoutez !" }
                options: [{ object: look }, { object: listen }, { object: stand-up }]
                answer: listen
                hints: ["Écoutez is about your ears."]
              - id: l1-s2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Asseyez-vous !" }
                show: { object: sit-down }
                answer: true
                hints: ["Asseyez-vous starts with a-ssey, which sounds a bit like seat."]
              - id: l1-s3
                type: audio_choice
                text: "What should you do?"
                say: { en: "Listen. What should you do? Tap the picture." }
                audio: { fr: "Levez-vous !" }
                options: [{ object: sit-down }, { object: look }, { object: stand-up }]
                answer: stand-up
                hints: ["Lev, like lift: up you go."]
              - id: l1-s4
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Regardez !" }
                show: { object: listen }
                answer: false
                hints: ["Regardez is about your eyes."]
              - id: l1-s5
                type: audio_choice
                text: "What should you do?"
                say: { en: "Listen. What should you do? Tap the picture." }
                audio: { fr: "Asseyez-vous !" }
                options: [{ object: sit-down }, { object: listen }, { object: look }]
                answer: sit-down
                hints: ["Listen to the start of the word."]
              - id: l1-s6
                type: speak
                say: { en: "Say it in French.", fr: "Écoutez !" }
                show: { object: listen }
                expected_text: "écoutez"
                hints: ["Listen again: Écoutez !"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What should you do?"
                say: { en: "Listen. What should you do? Tap the picture." }
                audio: { fr: "Regardez !" }
                options: [{ object: stand-up }, { object: look }, { object: listen }]
                answer: look
              - id: l1-n2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Levez-vous !" }
                show: { object: stand-up }
                answer: true
              - id: l1-n3
                type: audio_choice
                text: "What should you do?"
                say: { en: "Listen. What should you do? Tap the picture." }
                audio: { fr: "Écoutez !" }
                options: [{ object: listen }, { object: sit-down }, { object: look }]
                answer: listen
              - id: l1-n4
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Asseyez-vous !" }
                show: { object: look }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "What should you do?"
                say: { en: "Listen. What should you do? Tap the picture." }
                audio: { fr: "Levez-vous !" }
                options: [{ object: look }, { object: stand-up }, { object: sit-down }]
                answer: stand-up
              - id: l1-n6
                type: speak
                say: { en: "Say it in French.", fr: "Regardez !" }
                show: { object: look }
                expected_text: "regardez"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "What should you do?"
            say: { en: "Listen. What should you do? Tap the picture." }
            audio: { fr: "Asseyez-vous !" }
            options: [{ object: stand-up }, { object: sit-down }, { object: look }]
            answer: sit-down
          - id: l1-c2
            type: audio_choice
            text: "What should you do?"
            say: { en: "Listen. What should you do? Tap the picture." }
            audio: { fr: "Regardez !" }
            options: [{ object: look }, { object: listen }, { object: stand-up }]
            answer: look
          - id: l1-c3
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Écoutez !" }
            show: { object: look }
            answer: false
          - id: l1-c4
            type: audio_choice
            text: "The teacher says this. Tap the child who does it."
            say: { en: "Listen to the teacher. Tap the child who does it." }
            audio: { fr: "Regardez, les enfants !", speaker: male }
            options: [{ object: look }, { object: stand-up }, { object: sit-down }]
            answer: look
          - id: l1-c5
            type: true_false
            text: "The teacher says this. Is the child doing it?"
            say: { en: "Listen to the teacher. Is the child doing it?" }
            audio: { fr: "Asseyez-vous, les enfants !", speaker: female }
            show: { object: sit-down }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "The teacher says two things. What do you do second? Tap the picture."
            say: { en: "Listen. The teacher says two things. What do you do second? Tap the picture." }
            audio: { fr: "Levez-vous ! Écoutez !", speaker: male }
            options: [{ object: stand-up }, { object: listen }, { object: look }]
            answer: listen

