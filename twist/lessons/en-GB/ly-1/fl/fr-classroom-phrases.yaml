                say: { en: "Listen. Does the picture match?", fr: "Montrez du doigt !" }
                show: { object: wave }
                answer: false
                hints:
                  - "Listen again: Montrez du doigt !"
                  - "Montrez du doigt means point: show with your finger. Is the child pointing?"
                  - "No, the child is waving."

