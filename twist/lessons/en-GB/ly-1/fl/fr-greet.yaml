# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-greet
skill: fl.speaking.greet
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: "Salut, ça va ? (Französisch)"
  en: "Salut, ça va ? in French"
summary: >
  Children greet someone in French and keep the talk going. Lesson 1 asks
  ça va ? and answers ça va bien, merci, comme ci, comme ça or ça ne va
  pas, then asks back with et toi ? Lesson 2 adds tu t'appelles comment ?
  and je m'appelle ..., tu as quel âge ? and j'ai huit ans (with avoir,
  never je suis), puts a whole greeting together from salut to au revoir,
  and ends with the skill check. Speaking is practised, not marked; the
  checks ask whether a reply fits a question.
metadata:
  year: ly-1
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.imitate]
  also_practises: [fl.themes.hello, fl.themes.numbers-to-10]
  vocabulary: { fr: ["ça va ?", "ça va bien, merci", "comme ci, comme ça", ça ne va pas, "et toi ?", "tu t'appelles comment ?", je m'appelle, "tu as quel âge ?", "j'ai huit ans", salut, au revoir] }
  forms: [audio, picture, drawn, text]
  drawn: [dots]
  facets: []
  parts:
    - { id: how, what: { de: "fragen und verstehen, wie es jemandem geht", en: asking how someone is and understanding the answer } }
    - { id: name, what: { de: nach dem Namen fragen und den Namen verstehen, en: asking someone's name and understanding it } }
    - { id: age, what: { de: nach dem Alter fragen und das Alter verstehen, en: asking someone's age and understanding it } }
    - { id: talk, what: { de: "einem kurzen Gespräch von Hallo bis Tschüss folgen", en: following a short talk from hello to goodbye } }
  misconceptions:
    - id: ne-pas
      what: Hears ça va inside ça ne va pas and takes it for I'm fine
      addressed: lesson 1 Learn says ça ne va pas next to ça va bien; l1-f5 gives feedback when the happy child is chosen, and l1-s5 and l2-c3 ask for ça ne va pas again
    - id: wrong-question
      what: Mixes up ça va ?, tu t'appelles comment ? and tu as quel âge ?, and answers one with the reply to another
      addressed: '"Does the answer fit?" tasks in every stage cross the questions (l1-f3 and l2-f3 with feedback, l2-s3, l2-n2, l2-c2, l2-c5); l2-s5, l2-n4 and l2-c4 ask what a heard question means'
    - id: je-suis-age
      what: Says je suis huit for I am eight, copying English
      addressed: lesson 2 Learn says that French uses j'ai ... ans for age, never je suis; l2-f4 has the child say j'ai huit ans, and the age tasks (l2-f2, l2-s1, l2-n1) all model j'ai ... ans
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ça va ?", en: "Ça va ?" }
    goal:
      de: "Frag ein anderes Kind mit ça va, wie es ihm geht, antworte und frag mit et toi zurück."
      en: "Ask a friend how they are with ça va, give an answer, and ask back with et toi."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which sound do you hear?"
            say: { en: "Listen. Do you hear u, as in lune, or ou, as in loup?" }
            audio: { fr: "La souris." }
            options: ["u, as in lune", "ou, as in loup"]
            answer: "ou, as in loup"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Do you hear a French r?"
            say: { en: "Listen. Do you hear a French r?", fr: "Rouge." }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "When you meet a friend, you say salut and ask how they are: ça va ?", fr: "Salut, Léa ! Ça va ?" }
            show: { object: girl }
          - say: { en: "If you are well, you say:", fr: "Ça va bien, merci !" }
            show: { object: happy }
          - say: { en: "So-so is comme ci, comme ça. If you are not well, you say ça ne va pas. Listen for ne and pas.", fr: "Comme ci, comme ça. Ça ne va pas." }
            show: { object: sad }
          - say: { en: "Then ask back: and you? In French that is et toi ?", fr: "Ça va bien, merci. Et toi ?" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Is someone asking how you are?"
                say: { en: "Listen. Is someone asking how you are?", fr: "Ça va ?" }
                answer: true
                hints:
                  - "Listen again: ça va ?"
                  - "Ça va ? is a question. Your voice goes up at the end."
                  - "Yes. Ça va ? means how are you?"
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "How is the child?"
                say: { en: "Listen. How is the child? Tap the picture." }
                audio: { fr: "Ça va bien, merci !", speaker: female }
                options: [{ object: sad }, { object: happy }, { object: tired }]
                answer: happy
                hints:
                  - "Listen for bien."
                  - "Bien means well."
                  - "Tap the happy child."
              - id: l1-f3
                type: true_false
                text: "Does the answer fit the question?"
                say: { en: "Listen to the question and the answer. Does the answer fit?" }
                audio: { turns: [{ fr: "Ça va ?", speaker: female }, { fr: "Je m'appelle Hugo.", speaker: male }] }
                answer: false
                feedback:
                  "true": "Ça va ? asks how you are. Answer with ça va bien, or comme ci, comme ça."
                hints:
                  - "First the question: ça va ? What does it ask?"
                  - "Ça va ? asks how you are. Does Hugo say how he is?"
                  - "No. He says his name, not how he is."
              - id: l1-f4
                type: speak
                say: { en: "You meet your friend. Say hi and ask how they are.", fr: "Salut ! Ça va ?" }
                show: { object: boy }
                expected_text: "salut ça va"
                hints:
                  - "Listen again: Salut ! Ça va ?"
                  - "Let your voice go up on va: it is a question."
                  - "Say it with me: Salut ! Ça va ?"
              - id: l1-f5
                type: audio_choice
                text: "How is the child?"
                say: { en: "Listen. How is the child? Tap the picture." }
                audio: { fr: "Ça ne va pas.", speaker: male }
                options: [{ object: happy }, { object: sad }, { object: angry }]
                answer: sad
                feedback:
                  happy: "Listen for ne and pas. Ça ne va pas means I'm not well."
                hints:
                  - "Listen again: ça ne va pas."
                  - "Ne ... pas means not."
                  - "Tap the sad child."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "How is the child?"
                say: { en: "Listen. How is the child?" }
                audio: { fr: "Comme ci, comme ça.", speaker: female }
                options: ["well", "so-so", "not well"]
                answer: "so-so"
                keep_order: true
                hints: ["Comme ci, comme ça is not good and not bad."]
              - id: l1-s2
                type: true_false
                text: "Does the answer fit the question?"
                say: { en: "Listen to the question and the answer. Does the answer fit?" }
                audio: { turns: [{ fr: "Ça va ?", speaker: male }, { fr: "Ça va bien, merci. Et toi ?", speaker: female }] }
                answer: true
                hints: ["Ça va ? asks how you are. Does the answer say how?"]
              - id: l1-s3
                type: speak
                say: { en: "You are well. Answer, then ask back.", fr: "Ça va bien, merci. Et toi ?" }
                show: { object: happy }
                expected_text: "ça va bien merci et toi"
                hints: ["Ça va bien, merci, then et toi ? with your voice going up."]
              - id: l1-s4
                type: true_false
                text: "Is someone asking how you are?"
                say: { en: "Listen. Is someone asking how you are?", fr: "Au revoir, Léa !" }
                answer: false
                hints: ["Listen for ça va."]
              - id: l1-s5
                type: audio_choice
                text: "How is the child?"
                say: { en: "Listen. How is the child?" }
                audio: { fr: "Ça ne va pas.", speaker: female }
                options: ["well", "so-so", "not well"]
                answer: "not well"
                keep_order: true
                hints: ["Ne ... pas means not."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "How is the child?"
                say: { en: "Listen. How is the child? Tap the picture." }
                audio: { fr: "Ça va bien !", speaker: male }
                options: [{ object: tired }, { object: sad }, { object: happy }]
                answer: happy
              - id: l1-n2
                type: true_false
                text: "Does the answer fit the question?"
                say: { en: "Listen to the question and the answer. Does the answer fit?" }
                audio: { turns: [{ fr: "Ça va ?", speaker: female }, { fr: "Au revoir !", speaker: male }] }
                answer: false
              - id: l1-n3
                type: speak
                say: { en: "Your friend asks how you are, and you answer. Now ask back in French: and you?" }
                expected_text: "et toi"
              - id: l1-n4
                type: audio_choice
                text: "How is the child?"
                say: { en: "Listen. How is the child?" }
                audio: { fr: "Oh, comme ci, comme ça.", speaker: male }
                options: ["well", "so-so", "not well"]
                answer: "so-so"
                keep_order: true
              - id: l1-n5
                type: true_false
                text: "Is someone asking how you are?"
                say: { en: "Listen. Is someone asking how you are?", fr: "Bonjour, Manon ! Ça va ?" }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Does the answer fit the question?"
            say: { en: "Listen to the question and the answer. Does the answer fit?" }
            audio: { turns: [{ fr: "Ça va ?", speaker: male }, { fr: "Comme ci, comme ça.", speaker: female }] }
            answer: true
          - id: l1-c2
            type: audio_choice
            text: "How is the child?"
            say: { en: "Listen. How is the child?" }
            audio: { fr: "Ça va bien, merci.", speaker: male }
            options: ["well", "so-so", "not well"]
            answer: "well"
            keep_order: true
          - id: l1-c3
            type: true_false
            text: "Is someone asking how you are?"
            say: { en: "Listen. Is someone asking how you are?" }
            audio: { fr: "Je m'appelle Théo.", speaker: male }
            answer: false
          - id: l1-c4
            type: audio_choice
            text: "How is Hugo? Tap the picture."
            say: { en: "Listen. How is Hugo? Tap the picture." }
            audio: { turns: [{ fr: "Ça va, Hugo ?", speaker: female }, { fr: "Ça ne va pas.", speaker: male }] }
            options: [{ object: happy }, { object: sad }]
            answer: sad
          - id: l1-c5
            type: true_false
            text: "Léa answers. Does she ask back: and you?"
            say: { en: "Listen. Léa answers. Does she ask back: and you?" }
            audio: { fr: "Ça va bien, merci. Et toi ?", speaker: female }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "How is Manon?"
            say: { en: "Listen. How is Manon?" }
            audio: { turns: [{ fr: "Salut, Manon ! Ça va ?", speaker: male }, { fr: "Comme ci, comme ça. Et toi ?", speaker: female }] }
            options: ["well", "so-so", "not well"]
            answer: "so-so"
            keep_order: true

  - n: 2
    title: { de: "Tu as quel âge ?", en: "Tu as quel âge ?" }
    goal:
      de: "Frag und sag auf Französisch Namen und Alter, zum Beispiel j'ai huit ans, und führ ein ganzes kleines Gespräch."
      en: "Ask and say a name and an age in French, like j'ai huit ans, and have a whole little chat."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "How is the child?"
            say: { en: "Do you remember? How is the child?" }
            audio: { fr: "Ça ne va pas.", speaker: male }
            options: ["well", "not well"]
            answer: "not well"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Is someone asking how you are?"
            say: { en: "Do you remember? Is someone asking how you are?", fr: "Ça va, Hugo ?" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "To ask someone's name, say tu t'appelles comment ? The answer is je m'appelle and the name.", fr: "Tu t'appelles comment ? Je m'appelle Inès." }
            show: { object: girl }
          - say: { en: "To ask someone's age, say tu as quel âge ?", fr: "Tu as quel âge ?" }
            show: { object: boy }
          - say: { en: "In French you say I have eight years: j'ai huit ans. You never say je suis for your age.", fr: "J'ai huit ans. J'ai neuf ans." }
            show: { drawn: dots, count: 8, layout: dice }
          - say: { en: "Now a whole talk, from hello to goodbye.", fr: "Salut ! Ça va ? Ça va bien, merci. Tu t'appelles comment ? Je m'appelle Jules. Tu as quel âge ? J'ai neuf ans. Au revoir, Jules !" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Is someone asking your age?"
                say: { en: "Listen. Is someone asking your age?", fr: "Tu as quel âge ?" }
                answer: true
                hints:
                  - "Listen again: tu as quel âge ?"
                  - "Âge sounds like the English word age."
                  - "Yes. Tu as quel âge ? means how old are you?"
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "How old is the child?"
                say: { en: "Listen. How old is the child? Tap the dots." }
                audio: { fr: "J'ai huit ans.", speaker: female }
                options:
                  - { drawn: dots, count: 7, layout: dice }
                  - { drawn: dots, count: 8, layout: dice }
                  - { drawn: dots, count: 9, layout: dice }
                answer: "8"
                hints:
                  - "Listen for the number between j'ai and ans."
                  - "Huit comes after sept."
                  - "Huit is eight. Tap the eight dots."
              - id: l2-f3
                type: true_false
                text: "Does the answer fit the question?"
                say: { en: "Listen to the question and the answer. Does the answer fit?" }
                audio: { turns: [{ fr: "Tu as quel âge ?", speaker: female }, { fr: "Ça va bien, merci.", speaker: male }] }
                answer: false
                feedback:
                  "true": "Tu as quel âge ? asks your age. The answer is j'ai ... ans."
                hints:
                  - "First the question: what does tu as quel âge ? ask?"
                  - "It asks your age. Does the answer have a number and ans?"
                  - "No. Ça va bien answers ça va ?"
              - id: l2-f4
                type: speak
                say: { en: "Say how old you are in French. You can say it like this:", fr: "J'ai huit ans." }
                expected_text: "j'ai huit ans"
                hints:
                  - "Listen again: j'ai huit ans."
                  - "Start with j'ai, I have, then your number, then ans."
                  - "Say it with me: J'ai huit ans."
              - id: l2-f5
                type: audio_choice
                text: "What is the girl's name?"
                say: { en: "Listen. What is the girl's name?" }
                audio: { turns: [{ fr: "Tu t'appelles comment ?", speaker: male }, { fr: "Je m'appelle Inès.", speaker: female }] }
                options: ["Agnès", "Inès", "Iris"]
                answer: "Inès"
                hints:
                  - "Listen for the name after je m'appelle."
                  - "It starts with i and ends with ès."
                  - "Her name is Inès."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "How old is the child?"
                say: { en: "Listen. How old is the child? Tap the dots." }
                audio: { fr: "J'ai neuf ans.", speaker: male }
                options:
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                  - { drawn: dots, count: 9, layout: dice }
                answer: "9"
                hints: ["Neuf comes just before dix."]
              - id: l2-s2
                type: true_false
                text: "Is someone asking your name?"
                say: { en: "Listen. Is someone asking your name?", fr: "Tu t'appelles comment ?" }
                answer: true
                hints: ["You answer this question with je m'appelle."]
              - id: l2-s3
                type: true_false
                text: "Does the answer fit the question?"
                say: { en: "Listen to the question and the answer. Does the answer fit?" }
                audio: { turns: [{ fr: "Ça va ?", speaker: male }, { fr: "J'ai huit ans.", speaker: female }] }
                answer: false
                hints: ["Ça va ? asks how you are, not how old you are."]
              - id: l2-s4
                type: speak
                say: { en: "Ask someone their name in French.", fr: "Tu t'appelles comment ?" }
                expected_text: "tu t'appelles comment"
                hints: ["Tu t'appelles, then comment, with your voice going up."]
              - id: l2-s5
                type: audio_choice
                text: "What is the question?"
                say: { en: "Listen. What does the question mean?" }
                audio: { fr: "Tu as quel âge ?" }
                options: ["How old are you?", "What's your name?", "How are you?"]
                answer: "How old are you?"
                hints: ["Âge sounds like age."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "How old is the child?"
                say: { en: "Listen. How old is the child? Tap the dots." }
                audio: { fr: "J'ai sept ans.", speaker: female }
                options:
                  - { drawn: dots, count: 8, layout: dice }
                  - { drawn: dots, count: 7, layout: dice }
                  - { drawn: dots, count: 6, layout: dice }
                answer: "7"
              - id: l2-n2
                type: true_false
                text: "Does the answer fit the question?"
                say: { en: "Listen to the question and the answer. Does the answer fit?" }
                audio: { turns: [{ fr: "Tu t'appelles comment ?", speaker: male }, { fr: "Je m'appelle Camille.", speaker: female }] }
                answer: true
              - id: l2-n3
                type: speak
                say: { en: "Ask someone in French how old they are." }
                expected_text: "tu as quel âge"
              - id: l2-n4
                type: audio_choice
                text: "What is the question?"
                say: { en: "Listen. What does the question mean?" }
                audio: { fr: "Tu t'appelles comment ?" }
                options: ["How old are you?", "What's your name?", "How are you?"]
                answer: "What's your name?"
              - id: l2-n5
                type: true_false
                text: "Is someone asking your age?"
                say: { en: "Listen. Is someone asking your age?", fr: "Ça va ?" }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: talk
            type: audio_choice
            text: "What does Hugo tell you?"
            say: { en: "Listen. What does Hugo tell you?" }
            audio: { fr: "Salut ! Je m'appelle Hugo. J'ai dix ans.", speaker: male }
            options: ["his name and his age", "his name and how he is", "how he is and his age"]
            answer: "his name and his age"
          - id: l2-c2
            part: age
            type: true_false
            text: "Does the answer fit the question?"
            say: { en: "Listen to the question and the answer. Does the answer fit?" }
            audio: { turns: [{ fr: "Tu as quel âge ?", speaker: male }, { fr: "J'ai neuf ans.", speaker: female }] }
            answer: true
          - id: l2-c3
            part: how
            type: audio_choice
            text: "How is the child?"
            say: { en: "Listen. How is the child?" }
            audio: { turns: [{ fr: "Ça va ?", speaker: female }, { fr: "Non, ça ne va pas.", speaker: male }] }
            options: ["well", "so-so", "not well"]
            answer: "not well"
            keep_order: true
          - id: l2-c4
            part: how
            type: audio_choice
            text: "What is the question?"
            say: { en: "Listen. What does the question mean?" }
            audio: { fr: "Ça va ?" }
            options: ["How old are you?", "What's your name?", "How are you?"]
            answer: "How are you?"
          - id: l2-c5
            part: name
            type: true_false
            text: "Does the answer fit the question?"
            say: { en: "Listen to the question and the answer. Does the answer fit?" }
            audio: { turns: [{ fr: "Tu t'appelles comment ?", speaker: female }, { fr: "Ça va bien, merci.", speaker: male }] }
            answer: false
          - id: l2-c6
            part: how
            type: audio_choice
            text: "Léa asks Hugo how he is. How is Hugo? Tap the picture."
            say: { en: "Listen. Léa asks Hugo how he is. How is Hugo? Tap the picture." }
            audio: { turns: [{ fr: "Salut, Hugo ! Ça va ?", speaker: female }, { fr: "Oui, ça va bien, merci !", speaker: male }] }
            options: [{ object: happy }, { object: sad }, { object: tired }]
            answer: happy
          - id: l2-c7
            part: how
            type: true_false
            text: "Is Théo well?"
            say: { en: "Listen. Is Théo well?" }
            audio: { turns: [{ fr: "Ça va, Théo ?", speaker: female }, { fr: "Ça ne va pas.", speaker: male }] }
            answer: false
          - id: l2-c8
            part: how
            type: audio_choice
            text: "Léa answers Hugo, then asks him something. What does she want to know?"
            say: { en: "Listen. Léa answers Hugo, then asks him something. What does she want to know?" }
            audio: { turns: [{ fr: "Salut, Léa ! Ça va ?", speaker: male }, { fr: "Ça va bien, merci. Et toi ?", speaker: female }] }
            options: ["how he is", "his name", "his age"]
            answer: "how he is"
          - id: l2-c9
            part: age
            type: audio_choice
            text: "How old is Inès?"
            say: { en: "Listen. How old is Inès?" }
            audio: { turns: [{ fr: "Inès, tu as quel âge ?", speaker: male }, { fr: "J'ai dix ans.", speaker: female }] }
            options: ["8", "9", "10"]
            answer: "10"
          - id: l2-c10
            part: age
            type: true_false
            text: "Is Jules eight?"
            say: { en: "Listen. Is Jules eight?" }
            audio: { fr: "Salut ! Je m'appelle Jules. J'ai neuf ans.", speaker: male }
            answer: false
          - id: l2-c11
            part: age
            type: audio_choice
            text: "Hugo answers a question. What did someone ask him?"
            say: { en: "Listen. Hugo answers a question. What did someone ask him?" }
            audio: { fr: "J'ai sept ans.", speaker: male }
            options: ["how old he is", "what his name is", "how he is"]
            answer: "how old he is"
          - id: l2-c12
            part: age
            type: audio_choice
            text: "Who is older? Tap the picture."
            say: { en: "Listen. Who is older? Tap the picture." }
            audio: { turns: [{ fr: "Je m'appelle Hugo. J'ai sept ans.", speaker: male }, { fr: "Je m'appelle Léa. J'ai neuf ans.", speaker: female }] }
            options: [{ object: boy }, { object: girl }]
            answer: girl
          - id: l2-c13
            part: name
            type: true_false
            text: "Is the girl called Camille?"
            say: { en: "Listen. Is the girl called Camille?" }
            audio: { turns: [{ fr: "Tu t'appelles comment ?", speaker: male }, { fr: "Je m'appelle Chloé.", speaker: female }] }
            answer: false
          - id: l2-c14
            part: name
            type: audio_choice
            text: "What does Inès want to know?"
            say: { en: "Listen. What does Inès want to know?" }
            audio: { fr: "Salut ! Je m'appelle Inès. Et toi, tu t'appelles comment ?", speaker: female }
            options: ["your name", "your age", "how you are"]
            answer: "your name"
