# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-songs-rhymes
skill: fl.listening.songs-rhymes
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Reime und Mitmachverse (Französisch)
  en: French chants and rhymes
summary: >
  Two short chants written for Twist. Lesson 1 is an action chant (Tape,
  tape, tape dans tes mains, saute, saute, saute en l'air, lève-toi,
  assieds-toi, fais coucou et au revoir !): children hear a line and tap
  the movement that goes with it, then say which line comes next. Lesson 2
  is a rhyme chant (Une souris dans un lit, un lapin dans un sapin, une
  abeille dans une bouteille, et un canard dans une gare !): children find
  where each animal is, finish a line with the rhyming word, hear whether
  two words rhyme and speak along, and it ends with the skill check.
  Instructions are in English; the French is heard.
metadata:
  year: ly-1
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.familiar-words]
  also_practises: [fl.speaking.imitate, fl.listening.classroom-phrases]
  vocabulary: { fr: [tape, dans tes mains, saute, en l'air, lève-toi, assieds-toi, fais coucou, au revoir, une souris, un lit, un lapin, un sapin, une abeille, une bouteille, un canard, une gare] }
  forms: [audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: every-word
      what: Gives up on a chant because not every word is understood
      addressed: both Learns say that the pictures and actions help and that not every word has to be understood; every line comes with its picture before the child is asked about it
    - id: rhyme-from-line
      what: Finishes a rhyme line with a word from another line (un lapin dans un lit) instead of the word that rhymes
      addressed: every stage of lesson 2 has a "How does the line end?" task with the other chant words as options (l2-f2 with feedback on lit, l2-s1, l2-n1, l2-c4); a "Do they rhyme?" task in every stage sets rhyming against non-rhyming pairs
    - id: line-order
      what: Knows the actions but not the order of the chant, so cannot join in
      addressed: every stage of lesson 1 asks which line comes next (l1-f2 with feedback, l1-s3, l1-n2, l1-n5), and the skill check asks it again (l2-c1)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Tape dans tes mains", en: "Tape dans tes mains" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "La girafe." }
            options: [{ object: elephant }, { object: giraffe }, { object: lion }]
            answer: giraffe
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Le crocodile." }
            options: [{ object: crocodile }, { object: banana }, { object: bus }]
            answer: crocodile
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - say: { en: "Listen to an action chant. You do not need to understand every word: the pictures and the actions help you.", fr: "Tape, tape, tape dans tes mains, saute, saute, saute en l'air, lève-toi, assieds-toi, fais coucou et au revoir !" }
          - say: { en: "Here you clap your hands:", fr: "Tape, tape, tape dans tes mains." }
            show: { object: clap }
          - say: { en: "Here you jump up high:", fr: "Saute, saute, saute en l'air." }
            show: { object: jump }
          - say: { en: "Stand up, sit down, then wave and say goodbye:", fr: "Lève-toi, assieds-toi, fais coucou et au revoir !" }
            show: { object: wave }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What do you do?"
                say: { en: "Listen. What do you do? Tap the picture." }
                audio: { fr: "Tape, tape, tape dans tes mains." }
                options: [{ object: clap }, { object: jump }, { object: wave }]
                answer: clap
                hints:
                  - "Listen again. Mains means hands."
                  - "What do you do with both hands when you tape?"
                  - "Tap the child clapping."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What comes next?"
                say: { en: "Listen. Which line comes next? Tap the picture." }
                audio: { fr: "Tape, tape, tape dans tes mains ..." }
                options: [{ object: wave }, { object: sit-down }, { object: jump }]
                answer: jump
                feedback:
                  wave: "Coucou comes at the very end. After the clapping comes the jumping."
                hints:
                  - "Say the chant in your head: first you clap. Then?"
                  - "Saute, saute, saute en l'air comes after the clapping."
                  - "Tap the child jumping."
              - id: l1-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Lève-toi !" }
                show: { object: stand-up }
                answer: true
                hints:
                  - "Listen again: lève-toi."
                  - "Lève, like lift: up you get."
                  - "Yes. Lève-toi means stand up."
              - id: l1-f4
                type: speak
                say: { en: "Say this line with me, and clap as you say it.", fr: "Tape, tape, tape dans tes mains." }
                show: { object: clap }
                expected_text: "tape tape tape dans tes mains"
                hints:
                  - "Listen again and clap on each tape."
                  - "Tape three times, then dans tes mains."
                  - "Say it with me: Tape, tape, tape dans tes mains."
              - id: l1-f5
                type: audio_choice
                text: "What do you do?"
                say: { en: "Listen. What do you do? Tap the picture." }
                audio: { fr: "Assieds-toi !" }
                options: [{ object: stand-up }, { object: sit-down }, { object: jump }]
                answer: sit-down
                feedback:
                  stand-up: "Lève-toi is stand up. Assieds-toi is sit down."
                hints:
                  - "Listen again: assieds-toi."
                  - "It comes straight after lève-toi in the chant."
                  - "Tap the child sitting down."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What do you do?"
                say: { en: "Listen. What do you do? Tap the picture." }
                audio: { fr: "Saute, saute, saute en l'air." }
                options: [{ object: sit-down }, { object: jump }, { object: clap }]
                answer: jump
                hints: ["En l'air means up in the air."]
              - id: l1-s2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Fais coucou et au revoir !" }
                show: { object: clap }
                answer: false
                hints: ["Coucou is what you say when you wave."]
              - id: l1-s3
                type: audio_choice
                text: "What comes next?"
                say: { en: "Listen. Which line comes next? Tap the picture." }
                audio: { fr: "Lève-toi ..." }
                options: [{ object: clap }, { object: sit-down }, { object: jump }]
                answer: sit-down
                hints: ["First you stand up. Then?"]
              - id: l1-s4
                type: speak
                say: { en: "Say this line with me, and jump as you say it.", fr: "Saute, saute, saute en l'air." }
                show: { object: jump }
                expected_text: "saute saute saute en l'air"
                hints: ["Saute sounds like soht. Say it three times."]
              - id: l1-s5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Tape, tape, tape dans tes mains." }
                show: { object: clap }
                answer: true
                hints: ["Mains means hands."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What do you do?"
                say: { en: "Listen. What do you do? Tap the picture." }
                audio: { fr: "Fais coucou et au revoir !" }
                options: [{ object: point }, { object: clap }, { object: wave }]
                answer: wave
              - id: l1-n2
                type: audio_choice
                text: "What comes next?"
                say: { en: "Listen. Which line comes next? Tap the picture." }
                audio: { fr: "Saute, saute, saute en l'air ..." }
                options: [{ object: stand-up }, { object: wave }, { object: clap }]
                answer: stand-up
              - id: l1-n3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Assieds-toi !" }
                show: { object: jump }
                answer: false
              - id: l1-n4
                type: speak
                say: { en: "Now say the whole chant with me, and do the actions.", fr: "Tape, tape, tape dans tes mains, saute, saute, saute en l'air, lève-toi, assieds-toi, fais coucou et au revoir !" }
                expected_text: "tape tape tape dans tes mains saute saute saute en l'air lève-toi assieds-toi fais coucou et au revoir"
              - id: l1-n5
                type: audio_choice
                text: "What comes next?"
                say: { en: "Listen. Which line comes next? Tap the picture." }
                audio: { fr: "Lève-toi, assieds-toi ..." }
                options: [{ object: jump }, { object: clap }, { object: wave }]
                answer: wave

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "What do you do?"
            say: { en: "Listen. What do you do? Tap the picture." }
            audio: { fr: "Lève-toi !" }
            options: [{ object: sit-down }, { object: wave }, { object: stand-up }]
            answer: stand-up
          - id: l1-c2
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Saute, saute, saute en l'air." }
            show: { object: jump }
            answer: true
          - id: l1-c3
            type: audio_choice
            text: "What comes next?"
            say: { en: "Listen. Which line comes next? Tap the picture." }
            audio: { fr: "Assieds-toi ..." }
            options: [{ object: wave }, { object: jump }, { object: stand-up }]
            answer: wave

  - n: 2
    title: { de: "Une souris dans un lit", en: "Une souris dans un lit" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "What do you do?"
            say: { en: "Do you remember? What do you do?" }
            audio: { fr: "Tape, tape, tape dans tes mains." }
            options: [{ object: clap }, { object: sit-down }]
            answer: clap
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "What comes next?"
            say: { en: "Do you remember? Which line comes next?" }
            audio: { fr: "Lève-toi ..." }
            options: [{ object: sit-down }, { object: jump }]
            answer: sit-down
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - say: { en: "Today's chant has four animals. The pictures help you. In each line, two words rhyme: they sound the same at the end.", fr: "Une souris dans un lit, un lapin dans un sapin, une abeille dans une bouteille, et un canard dans une gare !" }
          - say: { en: "A mouse in a bed. Souris and lit both end with the same sound, ee.", fr: "Une souris dans un lit." }
            show: { object: mouse }
          - say: { en: "A rabbit in a fir tree, and a bee in a bottle. Lapin, sapin. Abeille, bouteille.", fr: "Un lapin dans un sapin. Une abeille dans une bouteille." }
            show: { object: rabbit }
          - say: { en: "And a duck in a station! Canard, gare.", fr: "Et un canard dans une gare !" }
            show: { object: duck }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Where is the mouse?"
                say: { en: "Listen. Where is the mouse? Tap the picture." }
                audio: { fr: "Une souris dans un lit." }
                options: [{ object: bed }, { object: fir-tree }, { object: bottle }]
                answer: bed
                hints:
                  - "Listen for the word after dans un."
                  - "Un lit is a bed. Souris and lit rhyme."
                  - "Tap the bed."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "How does the line end?"
                say: { en: "Listen. How does the line end? Tap the picture." }
                audio: { fr: "Un lapin dans un ..." }
                options: [{ object: bed }, { object: fir-tree }, { object: station }]
                answer: fir-tree
                feedback:
                  bed: "Lit goes with the mouse. Lapin rhymes with sapin, the fir tree."
                hints:
                  - "Find the word that sounds like lapin at the end."
                  - "Lapin, sapin: both end in the same sound."
                  - "Tap the fir tree: un sapin."
              - id: l2-f3
                type: true_false
                text: "Do the two words rhyme?"
                say: { en: "Listen. Do the two words rhyme?", fr: "Abeille. Bouteille." }
                show: { objects: [bee, bottle] }
                answer: true
                hints:
                  - "Listen to the end of each word."
                  - "Abeille ends with eille. So does bouteille."
                  - "Yes. Abeille and bouteille rhyme."
              - id: l2-f4
                type: speak
                say: { en: "Say this line with me.", fr: "Une souris dans un lit." }
                show: { object: mouse }
                expected_text: "une souris dans un lit"
                hints:
                  - "Listen again: une souris dans un lit."
                  - "Souris and lit end with the same sound, ee."
                  - "Say it with me: Une souris dans un lit."
              - id: l2-f5
                type: audio_choice
                text: "Who is in the station?"
                say: { en: "Listen. Who is in the station? Tap the picture." }
                audio: { fr: "Et un canard dans une gare !" }
                options: [{ object: mouse }, { object: bee }, { object: duck }]
                answer: duck
                hints:
                  - "Listen for the animal at the start of the line."
                  - "Un canard is a duck."
                  - "Tap the duck."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "How does the line end?"
                say: { en: "Listen. How does the line end? Tap the picture." }
                audio: { fr: "Une abeille dans une ..." }
                options: [{ object: station }, { object: bottle }, { object: bed }]
                answer: bottle
                hints: ["Which word sounds like abeille at the end?"]
              - id: l2-s2
                type: true_false
                text: "Do the two words rhyme?"
                say: { en: "Listen. Do the two words rhyme?", fr: "Canard. Lit." }
                show: { objects: [duck, bed] }
                answer: false
                hints: ["Listen to the end of each word: ar and ee."]
              - id: l2-s3
                type: audio_choice
                text: "Where is the rabbit?"
                say: { en: "Listen. Where is the rabbit? Tap the picture." }
                audio: { fr: "Un lapin dans un sapin." }
                options: [{ object: station }, { object: bottle }, { object: fir-tree }]
                answer: fir-tree
                hints: ["Un sapin is a fir tree."]
              - id: l2-s4
                type: speak
                say: { en: "Say this line with me.", fr: "Un lapin dans un sapin." }
                show: { object: rabbit }
                expected_text: "un lapin dans un sapin"
                hints: ["Lapin and sapin end the same way, with the in sound said through your nose."]
              - id: l2-s5
                type: audio_choice
                text: "Which animal comes next?"
                say: { en: "Listen. Which animal comes next? Tap the picture." }
                audio: { fr: "Une souris dans un lit, un lapin dans un sapin ..." }
                options: [{ object: duck }, { object: bee }, { object: mouse }]
                answer: bee
                hints: ["After the rabbit comes the bee in a bottle."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "How does the line end?"
                say: { en: "Listen. How does the line end? Tap the picture." }
                audio: { fr: "Et un canard dans une ..." }
                options: [{ object: fir-tree }, { object: station }, { object: bed }]
                answer: station
              - id: l2-n2
                type: true_false
                text: "Do the two words rhyme?"
                say: { en: "Listen. Do the two words rhyme?", fr: "Lapin. Sapin." }
                show: { objects: [rabbit, fir-tree] }
                answer: true
              - id: l2-n3
                type: audio_choice
                text: "Where is the bee?"
                say: { en: "Listen. Where is the bee? Tap the picture." }
                audio: { fr: "Une abeille dans une bouteille." }
                options: [{ object: bed }, { object: bottle }, { object: station }]
                answer: bottle
              - id: l2-n4
                type: speak
                say: { en: "Now say the whole chant with me.", fr: "Une souris dans un lit, un lapin dans un sapin, une abeille dans une bouteille, et un canard dans une gare !" }
                expected_text: "une souris dans un lit un lapin dans un sapin une abeille dans une bouteille et un canard dans une gare"
              - id: l2-n5
                type: true_false
                text: "Do the two words rhyme?"
                say: { en: "Listen. Do the two words rhyme?", fr: "Souris. Bouteille." }
                show: { objects: [mouse, bottle] }
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "What do you do first?"
            say: { en: "Listen to the whole chant. What do you do first? Tap the picture." }
            audio: { fr: "Tape, tape, tape dans tes mains, saute, saute, saute en l'air, lève-toi, assieds-toi, fais coucou et au revoir !" }
            options: [{ object: jump }, { object: clap }, { object: stand-up }]
            answer: clap
          - id: l2-c2
            type: audio_choice
            text: "Where is the duck?"
            say: { en: "Listen. Where is the duck? Tap the picture." }
            audio: { fr: "Un canard dans une gare." }
            options: [{ object: fir-tree }, { object: bottle }, { object: station }]
            answer: station
          - id: l2-c3
            type: true_false
            text: "Do the two words rhyme?"
            say: { en: "Listen. Do the two words rhyme?", fr: "Souris. Lit." }
            show: { objects: [mouse, bed] }
            answer: true
          - id: l2-c4
            type: audio_choice
            text: "How does the line end?"
            say: { en: "Listen. How does the line end? Tap the picture." }
            audio: { fr: "Une souris dans un ..." }
            options: [{ object: bottle }, { object: bed }, { object: fir-tree }]
            answer: bed
          - id: l2-c5
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Fais coucou et au revoir !" }
            show: { object: sit-down }
            answer: false
