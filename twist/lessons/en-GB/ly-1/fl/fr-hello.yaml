# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-hello
skill: fl.themes.hello
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Hallo und Tschüss (Französisch)
  en: Hello and goodbye in French
summary: >
  Greeting and saying goodbye in French, then saying your name and the
  polite words. Lesson 1 brings bonjour, salut, au revoir and bonsoir,
  and when salut is right (friends) and when bonjour is (a teacher, a
  grown-up). Lesson 2 adds je m'appelle ..., s'il te plaît and s'il vous
  plaît, merci and pardon, and ends with the skill check. Instructions
  are in English; the French is heard. Speaking is practised, not marked.
metadata:
  year: ly-1
  topic: { de: Hallo, en: Hello }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.speaking.greet, fl.speaking.imitate]
  vocabulary: { fr: [bonjour, salut, au revoir, bonsoir, madame, monsieur, je m'appelle, s'il te plaît, s'il vous plaît, merci, merci beaucoup, pardon] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: greet, what: { de: jemanden auf Französisch begrüßen, en: greeting someone in French } }
    - { id: goodbye, what: { de: sich auf Französisch verabschieden, en: saying goodbye in French } }
    - { id: name, what: { de: den Namen mit je m'appelle verstehen, en: understanding a name said with je m'appelle } }
    - { id: polite, what: { de: "bitte, danke und Entschuldigung verstehen", en: "understanding please, thank you and sorry" } }
    - { id: friend-grown-up, what: { de: Wörter für Freunde und für Erwachsene unterscheiden, en: telling the words for friends from the words for grown-ups } }
  misconceptions:
    - id: salut-to-teacher
      what: Says salut or s'il te plaît to a teacher or another grown-up, because English hi and please work for everyone
      addressed: lesson 1 Learn says salut is for friends; l1-f5 (with feedback), l1-s5 and l1-n5 ask who you say it to; lesson 2 sets s'il te plaît against s'il vous plaît in l2-f5 (with feedback), l2-n2 and l2-c5
    - id: hello-goodbye
      what: Takes au revoir for a greeting because it is the longer, more polite-sounding phrase
      addressed: l1-f2 gives feedback when au revoir is taken for a greeting; l1-s6, l1-n6 and l1-c3 cross greeting and goodbye again
    - id: please-thanks
      what: Mixes up s'il te plaît and merci
      addressed: l2-f2 gives feedback when s'il te plaît is taken for thank you; l2-s4, l2-n5 and l2-c4 set the two apart
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bonjour und au revoir", en: "Bonjour and au revoir" }
    goal:
      de: "Sag auf Französisch hallo und tschüss und lerne, wann du salut und wann du bonjour sagst."
      en: "Say hello and goodbye in French, and learn when to say salut and when to say bonjour."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Here is a French word. Listen. What do you think: does it mean hello or goodbye?", fr: "Bonjour !" }
            show: { object: teacher }
          - say: { en: "Hello! When you meet someone in France, you say:", fr: "Bonjour ! Bonjour, madame !" }
            show: { object: teacher }
          - say: { en: "To a friend you can say hi:", fr: "Salut !" }
            show: { object: boy }
          - say: { en: "When you leave, you say:", fr: "Au revoir ! Au revoir, monsieur !" }
            show: { object: house }
          - say: { en: "In the evening, people say good evening:", fr: "Bonsoir !" }
            show: { object: moon }
          - say: { en: "Salut is for friends and family. To your teacher or another grown-up, say bonjour and au revoir.", fr: "Salut, Hugo ! Bonjour, madame !" }
          - text: "Did you know? French friends say salut for hi, and salut for bye too!"
            say: { en: "Did you know? French friends say salut when they meet, and salut again when they go. One word for hi and bye!", fr: "Salut ! ... Salut !" }
            show: { object: wave }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Do you say this when you meet someone?"
                say: { en: "Listen. Do you say this when you meet someone?", fr: "Bonjour !" }
                answer: true
                hints:
                  - "Listen again: Bonjour !"
                  - "Bon means good and jour means day: good day."
                  - "Yes. You say bonjour when you meet someone."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Do you say this when you meet someone?"
                say: { en: "Listen. Do you say this when you meet someone?", fr: "Au revoir !" }
                answer: false
                feedback:
                  "true": "Au revoir is what you say when you leave. When you meet someone, you say bonjour."
                hints:
                  - "Listen again: Au revoir !"
                  - "Au revoir means see you again. Do you say that when you arrive or when you go?"
                  - "No. You say au revoir when you leave."
              - id: l1-f3
                type: audio_choice
                text: "When do you say it?"
                say: { en: "Listen. When do you say it?" }
                audio: { fr: "Au revoir !" }
                options: ["when you meet someone", "when you leave", "when you say thank you"]
                answer: "when you leave"
                feedback:
                  "when you meet someone": "That is bonjour. Au revoir is for when you go."
                hints:
                  - "Listen again: Au revoir !"
                  - "Revoir means to see again. When do you hope to see someone again?"
                  - "When you leave."
              - id: l1-f4
                type: speak
                say: { en: "You meet your teacher in the morning. Say hello to her in French.", fr: "Bonjour, madame !" }
                show: { object: teacher }
                expected_text: "bonjour madame"
                hints:
                  - "Listen again: Bonjour, madame !"
                  - "Bon-jour. The j is soft, like the s in treasure."
                  - "Say it with me: Bonjour, madame !"
              - id: l1-f5
                type: audio_choice
                text: "Who would you say this to?"
                say: { en: "Listen. Who would you say this to? Tap the picture." }
                audio: { fr: "Salut !" }
                options: [{ object: teacher }, { object: boy }]
                answer: boy
                feedback:
                  teacher: "Salut is for friends and family. To your teacher, say bonjour."
                hints:
                  - "Listen again: Salut !"
                  - "Salut is a friendly hi. Who is your friend?"
                  - "Tap the boy. You say salut to a friend."
              - id: l1-f6
                type: true_false
                text: "Do you say this in the evening?"
                say: { en: "Listen. Do you say this in the evening?", fr: "Bonsoir !" }
                answer: true
                hints:
                  - "Listen again: Bonsoir !"
                  - "Soir means evening."
                  - "Yes. Bonsoir means good evening."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Do you say this when you leave?"
                say: { en: "Listen. Do you say this when you leave?", fr: "Au revoir !" }
                answer: true
                hints: ["Au revoir means see you again."]
              - id: l1-s2
                type: audio_choice
                text: "When do you say it?"
                say: { en: "Listen. When do you say it?" }
                audio: { fr: "Bonjour !" }
                options: ["when you meet someone", "when you leave", "when you say thank you"]
                answer: "when you meet someone"
                hints: ["Bonjour means good day."]
              - id: l1-s3
                type: speak
                say: { en: "You are going home. Say goodbye to your teacher in French.", fr: "Au revoir, madame !" }
                show: { object: teacher }
                expected_text: "au revoir madame"
                hints: ["Two parts: au ... revoir. The r comes from the back of your throat."]
              - id: l1-s4
                type: true_false
                text: "Do you say this when you meet someone?"
                say: { en: "Listen. Do you say this when you meet someone?", fr: "Bonsoir !" }
                answer: true
                hints: ["Bonsoir is like bonjour, for the evening."]
              - id: l1-s5
                type: audio_choice
                text: "Who would you say this to?"
                say: { en: "Listen. Who would you say this to? Tap the picture." }
                audio: { fr: "Bonjour, madame !" }
                options: [{ object: teacher }, { object: baby }]
                answer: teacher
                feedback:
                  baby: "A baby can't say bonjour back yet! Madame is how you speak to a woman, like your teacher."
                hints: ["Madame is how you speak to a woman, like your teacher."]
              - id: l1-s6
                type: true_false
                text: "Do you say this when you leave?"
                say: { en: "Listen. Do you say this when you leave?", fr: "Bonjour !" }
                answer: false
                hints: ["Bonjour is for when you arrive."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Do you say this when you meet someone?"
                say: { en: "Listen. Do you say this when you meet someone?", fr: "Salut !" }
                answer: true
              - id: l1-n2
                type: audio_choice
                text: "When do you say it?"
                say: { en: "Listen. When do you say it?" }
                audio: { fr: "Bonsoir !" }
                options: ["in the morning", "in the evening"]
                answer: "in the evening"
                keep_order: true
              - id: l1-n3
                type: speak
                say: { en: "Say hi to your friend in French.", fr: "Salut !" }
                show: { object: boy }
                expected_text: "salut"
              - id: l1-n4
                type: true_false
                text: "Do you say this when you leave?"
                say: { en: "Listen. Do you say this when you leave?", fr: "Au revoir, monsieur !" }
                answer: true
              - id: l1-n5
                type: audio_choice
                text: "Who would you say this to?"
                say: { en: "Listen. Who would you say this to? Tap the picture." }
                audio: { fr: "Salut, Hugo !" }
                options: [{ object: teacher }, { object: boy }]
                answer: boy
              - id: l1-n6
                type: true_false
                text: "Do you say this when you meet someone?"
                say: { en: "Listen. Do you say this when you meet someone?", fr: "Au revoir, Léa !" }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Do you say this when you meet someone?"
            say: { en: "Listen. Do you say this when you meet someone?", fr: "Bonjour, monsieur !" }
            answer: true
          - id: l1-c2
            type: audio_choice
            text: "When do you say it?"
            say: { en: "Listen. When do you say it?" }
            audio: { fr: "Au revoir, madame !" }
            options: ["when you meet someone", "when you leave", "when you say thank you"]
            answer: "when you leave"
          - id: l1-c3
            type: true_false
            text: "Do you say this when you meet someone?"
            say: { en: "Listen. Do you say this when you meet someone?", fr: "Au revoir, Hugo !" }
            answer: false
          - id: l1-c4
            type: true_false
            text: "Léa meets her teacher in the morning. Is this right?"
            say: { en: "Léa meets her teacher in the morning. Listen. Is this right?" }
            audio: { fr: "Salut, madame !", speaker: female }
            show: { object: teacher }
            answer: false
          - id: l1-c5
            type: audio_choice
            text: "Who is Hugo talking to? Tap the picture."
            say: { en: "Listen. Who is Hugo talking to? Tap the picture." }
            audio: { fr: "Bonsoir, madame !", speaker: male }
            options: [{ object: teacher }, { object: boy }]
            answer: teacher
          - id: l1-c6
            type: audio_choice
            text: "When does it happen? Tap the picture."
            say: { en: "Listen. When does it happen? Tap the picture." }
            audio: { turns: [{ fr: "Bonjour, Léa !", speaker: male }, { fr: "Bonjour, Hugo !", speaker: female }] }
            options: [{ object: sun }, { object: moon }]
            answer: sun

  - n: 2
    title: { de: "Je m'appelle ...", en: "Je m'appelle ..." }
    goal:
      de: "Sag deinen Namen mit je m'appelle und benutze freundliche Wörter auf Französisch, zum Beispiel merci und pardon."
      en: "Say your name with je m'appelle, and use kind words in French, like merci and pardon."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Do you say this when you meet someone?"
            say: { en: "Do you remember? Do you say this when you meet someone?", fr: "Salut, Léa !" }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "When do you say it?"
            say: { en: "Do you remember? When do you say it?" }
            audio: { fr: "Au revoir !" }
            options: ["when you meet someone", "when you leave"]
            answer: "when you leave"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Listen to this girl. What do you think she tells you: her name or her age?", fr: "Bonjour ! Je m'appelle Léa." }
            show: { object: girl }
          - say: { en: "Her name! To say your name, you say je m'appelle, then your name.", fr: "Bonjour ! Je m'appelle Léa." }
            show: { object: girl }
          - say: { en: "Please, to a friend, is s'il te plaît. To a grown-up, it is s'il vous plaît.", fr: "Un crayon, s'il te plaît. Un crayon, s'il vous plaît, madame." }
            show: { object: pencil }
          - say: { en: "Thank you is merci. Thank you very much is merci beaucoup.", fr: "Merci ! Merci beaucoup !" }
            show: { object: present }
          - say: { en: "Sorry is pardon. You say it when you bump into someone.", fr: "Oh, pardon !" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "What is the girl's name?"
                say: { en: "Listen. What is the girl's name?" }
                audio: { fr: "Bonjour ! Je m'appelle Manon.", speaker: female }
                options: ["Manon", "Marie", "Léa"]
                answer: "Manon"
                hints:
                  - "Listen for the name after je m'appelle."
                  - "Je m'appelle means my name is. The name comes straight after it."
                  - "Her name is Manon."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Is someone saying thank you?"
                say: { en: "Listen. Is someone saying thank you?", fr: "S'il te plaît !" }
                answer: false
                feedback:
                  "true": "S'il te plaît means please. Thank you is merci."
                hints:
                  - "Listen again: S'il te plaît !"
                  - "Thank you is a short word: mer-ci. Is that what you hear?"
                  - "No. S'il te plaît means please."
              - id: l2-f3
                type: audio_choice
                text: "What does it mean?"
                say: { en: "Listen. What does it mean?" }
                audio: { fr: "Merci beaucoup !" }
                options: ["thank you very much", "please", "sorry"]
                answer: "thank you very much"
                hints:
                  - "Listen to the first word: merci."
                  - "Merci means thank you. Beaucoup makes it bigger."
                  - "Thank you very much."
              - id: l2-f4
                type: speak
                say: { en: "You get a present. Say thank you in French.", fr: "Merci !" }
                show: { object: present }
                expected_text: "merci"
                hints:
                  - "Listen again: Merci !"
                  - "Mer-ci. The r is soft, at the back of your throat."
                  - "Say it with me: Merci !"
              - id: l2-f5
                type: audio_choice
                text: "Is the child talking to a friend or to a grown-up?"
                say: { en: "Listen. Is the child talking to a friend or to a grown-up?" }
                audio: { fr: "Une gomme, s'il vous plaît, madame." }
                options: ["a friend", "a grown-up"]
                answer: "a grown-up"
                keep_order: true
                feedback:
                  "a friend": "S'il vous plaît is for grown-ups. To a friend you say s'il te plaît."
                hints:
                  - "Listen to the please: te or vous?"
                  - "S'il vous plaît, with vous, is for grown-ups. And you hear madame."
                  - "A grown-up."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Is someone saying sorry?"
                say: { en: "Listen. Is someone saying sorry?", fr: "Oh, pardon !" }
                answer: true
                hints: ["Pardon is what you say when you bump into someone."]
              - id: l2-s2
                type: audio_choice
                text: "What is the boy's name?"
                say: { en: "Listen. What is the boy's name?" }
                audio: { fr: "Salut ! Je m'appelle Théo.", speaker: male }
                options: ["Théo", "Hugo", "Tom"]
                answer: "Théo"
                hints: ["The name comes after je m'appelle."]
              - id: l2-s3
                type: speak
                say: { en: "Say your name in French. Start like this, then add your name.", fr: "Je m'appelle ..." }
                expected_text: "je m'appelle"
                hints: ["Je m'appelle: three beats, je, ma, pelle."]
              - id: l2-s4
                type: audio_choice
                text: "What does it mean?"
                say: { en: "Listen. What does it mean?" }
                audio: { fr: "S'il te plaît." }
                options: ["please", "thank you", "sorry"]
                answer: "please"
                hints: ["Thank you is merci. This is something else."]
              - id: l2-s5
                type: true_false
                text: "Is someone saying thank you?"
                say: { en: "Listen. Is someone saying thank you?", fr: "Merci, madame !" }
                answer: true
                hints: ["Listen for merci."]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "Is someone saying please?"
                say: { en: "Listen. Is someone saying please?", fr: "Pardon !" }
                answer: false
              - id: l2-n2
                type: audio_choice
                text: "Is the child talking to a friend or to a grown-up?"
                say: { en: "Listen. Is the child talking to a friend or to a grown-up?" }
                audio: { fr: "Un crayon, s'il te plaît, Léa." }
                options: ["a friend", "a grown-up"]
                answer: "a friend"
                keep_order: true
              - id: l2-n3
                type: speak
                say: { en: "You bump into someone. Say sorry in French.", fr: "Pardon !" }
                expected_text: "pardon"
              - id: l2-n4
                type: audio_choice
                text: "What is the boy's name?"
                say: { en: "Listen. What is the boy's name?" }
                audio: { fr: "Bonjour, madame. Je m'appelle Jules.", speaker: male }
                options: ["Jules", "Julie", "Paul"]
                answer: "Jules"
              - id: l2-n5
                type: true_false
                text: "Is someone saying thank you?"
                say: { en: "Listen. Is someone saying thank you?", fr: "S'il vous plaît, monsieur." }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: goodbye
            type: true_false
            text: "Do you say this when you leave?"
            say: { en: "Listen. Do you say this when you leave?", fr: "Au revoir, Manon !" }
            answer: true
          - id: l2-c2
            part: polite
            type: audio_choice
            text: "What does it mean?"
            say: { en: "Listen. What does it mean?" }
            audio: { fr: "Pardon, madame." }
            options: ["sorry", "please", "thank you"]
            answer: "sorry"
          - id: l2-c3
            part: name
            type: audio_choice
            text: "What is the boy's name?"
            say: { en: "Listen. What is the boy's name?" }
            audio: { fr: "Salut ! Je m'appelle Lucas. Au revoir !", speaker: male }
            options: ["Lucas", "Louis", "Luc"]
            answer: "Lucas"
          - id: l2-c4
            part: polite
            type: true_false
            text: "Is someone saying please?"
            say: { en: "Listen. Is someone saying please?", fr: "Un livre, s'il vous plaît." }
            answer: true
          - id: l2-c5
            part: friend-grown-up
            type: audio_choice
            text: "Is the child talking to a friend or to a grown-up?"
            say: { en: "Listen. Is the child talking to a friend or to a grown-up?" }
            audio: { fr: "Un crayon, s'il vous plaît, monsieur." }
            options: ["a friend", "a grown-up"]
            answer: "a grown-up"
            keep_order: true
          - id: l2-c6
            part: greet
            type: audio_choice
            text: "When does it happen? Tap the picture."
            say: { en: "Listen. When does it happen? Tap the picture." }
            audio: { turns: [{ fr: "Bonsoir, Manon !", speaker: male }, { fr: "Bonsoir, Lucas !", speaker: female }] }
            options: [{ object: sun }, { object: moon }]
            answer: moon
          - id: l2-c7
            part: greet
            type: true_false
            text: "Hugo gets to school and sees his friend Manon. Is this right?"
            say: { en: "Hugo gets to school and sees his friend Manon. Listen. Is this right?" }
            audio: { fr: "Salut, Manon !", speaker: male }
            show: { object: school }
            answer: true
          - id: l2-c8
            part: greet
            type: audio_choice
            text: "Who is arriving? Tap the picture."
            say: { en: "Listen. Who is arriving? Tap the picture." }
            audio: { turns: [{ fr: "Au revoir !", speaker: female }, { fr: "Bonjour !", speaker: male }] }
            options: [{ object: girl }, { object: boy }]
            answer: boy
          - id: l2-c9
            part: greet
            type: audio_choice
            text: "What does the girl say? Tap what it means."
            say: { en: "Listen. What does the girl say? Tap what it means." }
            audio: { fr: "Bonjour, madame !", speaker: female }
            options: ["hello", "goodbye", "thank you"]
            answer: "hello"
          - id: l2-c10
            part: goodbye
            type: true_false
            text: "School is over and Léa is going home. Is this right?"
            say: { en: "School is over and Léa is going home. Listen. Is this right?" }
            audio: { fr: "Bonjour, monsieur !", speaker: female }
            show: { object: house }
            answer: false
          - id: l2-c11
            part: goodbye
            type: audio_choice
            text: "Théo says this. What is he doing?"
            say: { en: "Listen. Théo says this. What is he doing?" }
            audio: { fr: "Au revoir, madame ! Au revoir, Manon !", speaker: male }
            options: ["arriving at school", "going home", "saying thank you"]
            answer: "going home"
          - id: l2-c12
            part: goodbye
            type: true_false
            text: "Hugo is leaving his friend's house. Is he saying goodbye?"
            say: { en: "Hugo is leaving his friend's house. Listen. Is he saying goodbye?" }
            audio: { fr: "Merci beaucoup, Jules !", speaker: male }
            show: { object: house }
            answer: false
          - id: l2-c13
            part: name
            type: true_false
            text: "Is the boy called Hugo?"
            say: { en: "Listen. Is the boy called Hugo?" }
            audio: { fr: "Bonjour ! Je m'appelle Théo.", speaker: male }
            show: { object: boy }
            answer: false
          - id: l2-c14
            part: name
            type: audio_choice
            text: "Two children say their names. What is the second child called?"
            say: { en: "Listen. Two children say their names. What is the second child called?" }
            audio: { turns: [{ fr: "Salut ! Je m'appelle Hugo.", speaker: male }, { fr: "Salut, Hugo ! Je m'appelle Manon.", speaker: female }] }
            options: ["Hugo", "Manon", "Marie"]
            answer: "Manon"
          - id: l2-c15
            part: name
            type: audio_choice
            text: "What does the girl tell you?"
            say: { en: "Listen. What does the girl tell you?" }
            audio: { fr: "Bonjour ! Je m'appelle Julie.", speaker: female }
            options: ["her name", "goodbye", "sorry"]
            answer: "her name"
          - id: l2-c16
            part: polite
            type: audio_choice
            text: "Léa gets a book. What does she say? Tap what it means."
            say: { en: "Léa gets a book. Listen. What does she say? Tap what it means." }
            audio: { fr: "Merci, monsieur !", speaker: female }
            show: { object: book }
            options: ["thank you", "please", "hello"]
            answer: "thank you"
          - id: l2-c17
            part: polite
            type: true_false
