# Lesson set: French, learning year 1 (Year 3). Hand-authored draft.
id: en-GB.fl.fr-animals
skill: fl.themes.outside-animals
curriculum: en-GB
language: en # language of instructions
target_language: fr # language being learnt
title:
  de: Tiere und Natur (Französisch)
  en: Animals and nature in French
summary: >
  Animals and things outside in French, and what an animal can do. Lesson
  1 brings le chien, le chat, le poisson, l'oiseau, la grenouille and le
  lapin, with peut nager, peut voler and peut sauter; children hear a
  sentence and decide whether it is true. Lesson 2 goes outside: l'arbre,
  la fleur, la feuille, le soleil, le nuage and il y a ..., sets la fleur
  against la feuille, and ends with the skill check. Instructions are in
  English; the French is heard. Speaking is practised, not marked.
metadata:
  year: ly-1
  topic: { de: Tiere und Natur, en: Animals and nature }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.speaking.name-things, fl.speaking.imitate]
  vocabulary: { fr: [le chien, le chat, le poisson, l'oiseau, la grenouille, le lapin, peut nager, peut voler, peut sauter, l'arbre, la fleur, la feuille, le soleil, le nuage, le jardin, il y a] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: animals, what: { de: Tiere verstehen, en: understanding animal words } }
    - { id: nature, what: { de: Dinge in der Natur verstehen, en: understanding things in nature } }
    - { id: can-do, what: { de: "verstehen, was ein Tier kann", en: understanding what an animal can do } }
    - { id: il-y-a, what: { de: "verstehen, was es irgendwo gibt (il y a ...)", en: "understanding what there is somewhere (il y a ...)" } }
  misconceptions:
    - id: animal-only
      what: Hears the animal and stops listening, so says yes to le poisson peut voler
      addressed: '"Is it true?" tasks in every stage of lesson 1 pair animals with the wrong action (l1-f5 with feedback, l1-s3, l1-c2) and the right one (l1-n3), and the skill check asks again (l2-c3)'
    - id: fleur-feuille
      what: Mixes up la fleur and la feuille, which sound alike
      addressed: lesson 2 Learn says the two side by side; l2-f1 gives feedback when the flower is chosen for la feuille, and l2-s1, l2-n2 and l2-c4 set them apart again
    - id: voler-sauter
      what: Mixes up the action words nager, voler and sauter
      addressed: '"What can it do?" tasks in every stage of lesson 1 (l1-f2, l1-s2, l1-n2, l1-n6) and the skill check (l2-c2)'
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Le poisson peut nager", en: "Le poisson peut nager" }
    goal:
      de: "Hör, was ein Tier auf Französisch kann, zum Beispiel le poisson peut nager, und sag, ob es stimmt."
      en: "Listen to what an animal can do in French, like le poisson peut nager, and say if it is true."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Animals in French. A dog, a cat and a fish:", fr: "Le chien. Le chat. Le poisson." }
            show: { object: dog }
          - say: { en: "A bird, a frog and a rabbit:", fr: "L'oiseau. La grenouille. Le lapin." }
            show: { object: frog }
          - say: { en: "To say what an animal can do, use peut, it can. Nager is swim, voler is fly.", fr: "Le poisson peut nager. L'oiseau peut voler." }
            show: { object: fish }
          - say: { en: "Sauter is jump.", fr: "La grenouille peut sauter. Le lapin peut sauter." }
            show: { object: rabbit }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the animal."
                say: { en: "Listen. Tap the animal." }
                audio: { fr: "La grenouille." }
                options: [{ object: fish }, { object: frog }, { object: bird }]
                answer: frog
                hints:
                  - "Listen again: la grenouille."
                  - "La grenouille is green and lives near a pond."
                  - "Tap the frog."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What can it do?"
                say: { en: "Listen. What can it do?" }
                audio: { fr: "L'oiseau peut voler." }
                options: ["swim", "fly", "jump"]
                answer: "fly"
                hints:
                  - "Listen for the word after peut."
                  - "Voler: what does a bird do in the sky?"
                  - "Fly. L'oiseau peut voler."
              - id: l1-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le lapin." }
                show: { object: rabbit }
                answer: true
                hints:
                  - "Listen again: le lapin."
                  - "Le lapin has long ears."
                  - "Yes. That is a rabbit."
              - id: l1-f4
                type: speak
                say: { en: "Say it in French.", fr: "L'oiseau." }
                show: { object: bird }
                expected_text: "l'oiseau"
                hints:
                  - "Listen again: l'oiseau."
                  - "It sounds like lwah-zo."
                  - "Say it with me: l'oiseau."
              - id: l1-f5
                type: true_false
                text: "Is it true?"
                say: { en: "Listen. Is it true?", fr: "Le poisson peut voler." }
                show: { object: fish }
                answer: false
                feedback:
                  "true": "Listen to the end too. Voler means fly, and a fish cannot fly. Le poisson peut nager."
                hints:
                  - "Listen to the whole sentence, right to the end."
                  - "Voler means fly. Can a fish fly?"
                  - "No. Le poisson peut nager: a fish can swim."
              - id: l1-f6
                type: audio_choice
                text: "Tap the animal."
                say: { en: "Listen. Tap the animal." }
                audio: { fr: "Le chat." }
                options: [{ object: dog }, { object: rabbit }, { object: cat }]
                answer: cat
                hints:
                  - "Listen again: le chat. You do not hear the t."
                  - "Le chat says miaou."
                  - "Tap the cat."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the animal."
                say: { en: "Listen. Tap the animal." }
                audio: { fr: "Le poisson." }
                options: [{ object: frog }, { object: bird }, { object: fish }]
                answer: fish
                hints: ["Le poisson lives in water."]
              - id: l1-s2
                type: audio_choice
                text: "What can it do?"
                say: { en: "Listen. What can it do?" }
                audio: { fr: "La grenouille peut sauter." }
                options: ["swim", "fly", "jump"]
                answer: "jump"
                hints: ["Sauter is jump."]
              - id: l1-s3
                type: true_false
                text: "Is it true?"
                say: { en: "Listen. Is it true?", fr: "Le chien peut voler." }
                show: { object: dog }
                answer: false
                hints: ["Voler means fly."]
              - id: l1-s4
                type: speak
                say: { en: "Say it in French.", fr: "La grenouille." }
                show: { object: frog }
                expected_text: "la grenouille"
                hints: ["Gre-nouille: the ou sounds like the oo in moon."]
              - id: l1-s5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "L'oiseau." }
                show: { object: bird }
                answer: true
                hints: ["L'oiseau has wings."]
              - id: l1-s6
                type: audio_choice
                text: "Tap the animal."
                say: { en: "Listen. Tap the animal." }
                audio: { fr: "Le chien." }
                options: [{ object: cat }, { object: horse }, { object: dog }]
                answer: dog
                hints: ["Le chien says ouaf."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the animal."
                say: { en: "Listen. Tap the animal." }
                audio: { fr: "L'oiseau." }
                options: [{ object: bird }, { object: fish }, { object: rabbit }]
                answer: bird
              - id: l1-n2
                type: audio_choice
                text: "What can it do?"
                say: { en: "Listen. What can it do?" }
                audio: { fr: "Le poisson peut nager." }
                options: ["swim", "fly", "jump"]
                answer: "swim"
              - id: l1-n3
                type: true_false
                text: "Is it true?"
                say: { en: "Listen. Is it true?", fr: "L'oiseau peut voler." }
                show: { object: bird }
                answer: true
              - id: l1-n4
                type: speak
                say: { en: "Which animal is it? Say it in French." }
                show: { object: rabbit }
                expected_text: "le lapin"
              - id: l1-n5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le chat." }
                show: { object: dog }
                answer: false
              - id: l1-n6
                type: audio_choice
                text: "What can it do?"
                say: { en: "Listen. What can it do?" }
                audio: { fr: "Le lapin peut sauter." }
                options: ["swim", "fly", "jump"]
                answer: "jump"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the animal."
            say: { en: "Listen. Tap the animal." }
            audio: { fr: "Le lapin." }
            options: [{ object: cat }, { object: rabbit }, { object: frog }]
            answer: rabbit
          - id: l1-c2
            type: true_false
            text: "Is it true?"
            say: { en: "Listen. Is it true?", fr: "Le chat peut voler." }
            show: { object: cat }
            answer: false
          - id: l1-c3
            type: audio_choice
            text: "What can it do?"
            say: { en: "Listen. What can it do?" }
            audio: { fr: "Le chien peut sauter." }
            options: ["swim", "fly", "jump"]
            answer: "jump"
          - id: l1-c4
            type: audio_choice
            text: "You hear two animals. Tap the one you hear first."
            say: { en: "Listen. You hear two animals. Tap the one you hear first." }
            audio: { turns: [{ fr: "Le poisson." }, { fr: "L'oiseau." }] }
            options: [{ object: bird }, { object: fish }, { object: frog }]
            answer: fish
          - id: l1-c5
            type: true_false
            text: "Is it true?"
            say: { en: "Listen. Is it true?", fr: "Le poisson peut nager." }
            show: { object: fish }
            answer: true
          - id: l1-c6
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "La grenouille." }
            show: { object: rabbit }
            answer: false

  - n: 2
    title: { de: "Dans le jardin", en: "Dans le jardin" }
    goal:
      de: "Hör, was im Garten ist, zum Beispiel la fleur oder le nuage, und halte fleur und feuille auseinander."
      en: "Hear what is in the garden in French, like la fleur or le nuage, and tell fleur from feuille."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tap the animal."
            say: { en: "Do you remember? Tap the animal." }
            audio: { fr: "Le poisson." }
            options: [{ object: fish }, { object: bird }]
            answer: fish
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "What can it do?"
            say: { en: "Do you remember? What can it do?" }
            audio: { fr: "L'oiseau peut voler." }
            options: ["swim", "fly"]
            answer: "fly"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Outside in French. A tree and a flower:", fr: "L'arbre. La fleur." }
            show: { object: tree }
          - say: { en: "A leaf is la feuille. Fleur and feuille sound alike, so listen carefully.", fr: "La fleur. La feuille. La fleur. La feuille." }
            show: { object: leaf, colour: green }
          - say: { en: "In the sky, the sun and a cloud:", fr: "Le soleil. Le nuage." }
            show: { object: sun }
          - say: { en: "Il y a means there is. Listen to what is in the garden.", fr: "Dans le jardin, il y a un arbre, une fleur et un oiseau." }
            show: { object: garden }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "La feuille." }
                options: [{ object: flower }, { object: leaf, colour: green, key: leaf }, { object: tree }]
                answer: leaf
                feedback:
                  flower: "That is la fleur. La feuille is a leaf."
                hints:
                  - "Listen again: la feuille. Is it fleur or feuille?"
                  - "Feuille ends softly, like fuh-y. Fleur ends with an r."
                  - "Tap the leaf."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Le soleil." }
                options: [{ object: cloud }, { object: sun }, { object: moon }]
                answer: sun
                hints:
                  - "Listen again: le soleil."
                  - "Le soleil is hot and bright in the sky."
                  - "Tap the sun."
              - id: l2-f3
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "L'arbre." }
                show: { object: tree }
                answer: true
                hints:
                  - "Listen again: l'arbre."
                  - "L'arbre is big and has leaves."
                  - "Yes. That is a tree."
              - id: l2-f4
                type: audio_choice
                text: "What is in the garden?"
                say: { en: "Listen. What is in the garden?" }
                audio: { fr: "Dans le jardin, il y a une fleur et un chat." }
                options: ["a flower and a cat", "a tree and a cat", "a flower and a bird"]
                answer: "a flower and a cat"
                hints:
                  - "Listen for two things after il y a."
                  - "Une fleur, then un chat."
                  - "A flower and a cat."
              - id: l2-f5
                type: speak
                say: { en: "Say it in French.", fr: "Le soleil." }
                show: { object: sun }
                expected_text: "le soleil"
                hints:
                  - "Listen again: le soleil."
                  - "It sounds like so-lay."
                  - "Say it with me: le soleil."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "La fleur." }
                options: [{ object: leaf, colour: green, key: leaf }, { object: tree }, { object: flower }]
                answer: flower
                hints: ["Fleur ends with an r. Feuille does not."]
              - id: l2-s2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le nuage." }
                show: { object: sun }
                answer: false
                hints: ["Le nuage can bring rain."]
              - id: l2-s3
                type: audio_choice
                text: "What is in the garden?"
                say: { en: "Listen. What is in the garden?" }
                audio: { fr: "Dans le jardin, il y a un arbre et un oiseau." }
                options: ["a tree and a fish", "a flower and a bird", "a tree and a bird"]
                answer: "a tree and a bird"
                hints: ["Un arbre, then un oiseau."]
              - id: l2-s4
                type: speak
                say: { en: "Say it in French.", fr: "La fleur." }
                show: { object: flower }
                expected_text: "la fleur"
                hints: ["Round your lips for the eu, then a soft r."]
              - id: l2-s5
                type: true_false
                text: "Is it true?"
                say: { en: "Listen. Is it true?", fr: "Le chien peut nager." }
                show: { object: dog }
                answer: true
                hints: ["Nager means swim."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Tap the picture."
                say: { en: "Listen. Tap the picture." }
                audio: { fr: "Le nuage." }
                options: [{ object: sun }, { object: tree }, { object: cloud }]
                answer: cloud
              - id: l2-n2
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "La fleur." }
                show: { object: leaf, colour: green }
                answer: false
              - id: l2-n3
                type: audio_choice
                text: "What is in the garden?"
                say: { en: "Listen. What is in the garden?" }
                audio: { fr: "Dans le jardin, il y a un lapin et une feuille." }
                options: ["a rabbit and a flower", "a rabbit and a leaf", "a frog and a leaf"]
                answer: "a rabbit and a leaf"
              - id: l2-n4
                type: speak
                say: { en: "What is it? Say it in French." }
                show: { object: tree }
                expected_text: "l'arbre"
              - id: l2-n5
                type: true_false
                text: "Does the picture match?"
                say: { en: "Listen. Does the picture match?", fr: "Le soleil." }
                show: { object: sun }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: animals
            type: audio_choice
            text: "Tap the animal."
            say: { en: "Listen. Tap the animal." }
            audio: { fr: "Une grenouille." }
