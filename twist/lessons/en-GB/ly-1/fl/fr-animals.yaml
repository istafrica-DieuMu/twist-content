            type: true_false
            text: "Is it true?"
            say: { en: "Listen. Is it true?", fr: "La grenouille peut voler." }
            show: { object: frog }
            answer: false
          - id: l2-c4
            part: nature
            type: audio_choice
            text: "Tap the picture."
            say: { en: "Listen. Tap the picture." }
            audio: { fr: "Une feuille." }
            options: [{ object: flower }, { object: tree }, { object: leaf, colour: green, key: leaf }]
            answer: leaf
          - id: l2-c5
