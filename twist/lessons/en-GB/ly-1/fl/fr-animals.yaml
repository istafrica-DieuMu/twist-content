            type: audio_choice
            text: "What is in the garden?"
            say: { en: "Listen. What is in the garden?" }
            audio: { fr: "Dans le jardin, il y a un arbre et une fleur." }
            options: ["a tree and a leaf", "a tree and a flower", "a flower and a bird"]
            answer: "a tree and a flower"
          - id: l2-c6
            part: animals
            type: true_false
            text: "Does the picture match?"
            say: { en: "Listen. Does the picture match?", fr: "Le poisson." }
            show: { object: cat }
            answer: false
          - id: l2-c7
            part: animals
            type: audio_choice
            text: "You hear two animals. Tap the one you hear second."
            say: { en: "Listen. You hear two animals. Tap the one you hear second." }
            audio: { turns: [{ fr: "Le chat." }, { fr: "Le chien." }] }
            options: [{ object: cat }, { object: horse }, { object: dog }]
