# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.segment-spell
skill: lit-en.spelling.segment-spell
curriculum: en-GB
language: en
title:
  de: Wörter lautierend schreiben
  en: Spelling by sounds
summary: >
  Spelling a word by saying its sounds and choosing a letter or letters
  for each one. Lesson 1 segments three-sound words with single letters
  (cat, pig, sun) and builds them from letter cards; lesson 2 adds sounds
  written with two letters (fish, duck, ring) and four-sound words (lamp,
  frog) and ends with the skill check. The child counts the sounds, fills
  the missing sound, puts letter cards in order and types short words on
  a letter keyboard. Writing the word by hand waits for a task that reads
  handwriting.
metadata:
  year: reception
  topic: { de: "Rechtschreibung", en: "Spelling" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonological.oral-blending, lit-en.phonics.s-a-t-p]
  also_practises: [lit-en.phonics.ch-sh-th-ng, lit-en.phonics.adjacent-consonants]
  vocabulary: { en: [sound, letter, segment, sound buttons, spell, first, middle, last] }
  forms: [text, picture, audio, drawn]
  drawn: [dots, letter-card]
  sounds: [en.s, en.k, en.a, en.t]
  facets: []
  parts:
    - { id: count-sounds, what: { de: die Laute in einem Wort zählen, en: counting the sounds in a word } }
    - { id: missing-sound, what: { de: "den Buchstaben für einen fehlenden Laut wählen (am Anfang, in der Mitte, am Ende)", en: "choosing the letter for a missing sound (first, middle or last)" } }
    - { id: whole-word, what: { de: ein ganzes Wort aus Buchstaben legen oder tippen, en: building or typing a whole word } }
    - { id: two-letters, what: { de: "einen Laut mit zwei Buchstaben schreiben (sh, ck, ng, ll)", en: "writing a sound with two letters (sh, ck, ng, ll)" } }
  misconceptions:
    - id: misses-middle-vowel
      what: Writes only the consonants it hears clearly and leaves out the vowel (dg for dog)
      addressed: Learn in lesson 1 stretches every sound; the middle sound is the gap in l1-f4, l1-s2, l1-n2, l1-n5, l1-c2, l2-w2, l2-n5 and the skill check task l2-c3; every ordering task needs all the letters
    - id: letters-not-sounds
      what: Counts letters instead of sounds, or writes a two-letter sound with one letter (duk for duck, fis for fish)
      addressed: Learn in lesson 2 puts sh, ck and ng on one sound button; l2-f2 (with feedback), l2-s2, l2-n2, l2-c2 and l2-c14 count sounds in words with a digraph; l2-c17 sets sak and sac beside sack; c, k and n are distractors in l2-f3, l2-f5 and l2-n4
    - id: sounds-out-of-order
      what: Has the right letters but in the wrong order, or turns b and d round (deb for bed)
      addressed: ordering and typing tasks in every stage (l1-f2, l1-s1, l1-n1, l1-n4 typed, l1-c1, l2-f1, l2-f4, l2-s1, l2-s4, l2-n1, l2-n3, l2-c1, l2-c4, l2-c5 typed); b and d share the options in l1-f3 and l1-f5 (with feedback)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "cat, pig, sun", en: "cat, pig, sun" }
    goal:
      de: "Sag ein Wort ganz langsam, Laut für Laut, und nimm für jeden Laut einen Buchstaben, so wie bei pig."
      en: "Say a word slowly, sound by sound, and pick a letter for each sound, like pig."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Push the sounds together. Which picture is it?"
            say: "Listen to the sounds. Push them together. Which picture is it?"
            audio: { sounds: [en.k, en.a, en.t] }
            options: [{ object: cat }, { object: cup }, { object: car }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen. Which letter makes this sound?"
            audio: { sound: en.s }
            options: ["a", "s", "t"]
            answer: "s"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "pig"
            say: "Here is a pig. What do you think: how many sounds are in the word pig? Say it very slowly and have a guess."
            show: { object: pig }
          - text: "pig"
            say: "Let's find out. To spell a word, first say it: pig. Then say it very slowly, one sound at a time, and hold up a finger for each sound. Pig has three sounds."
            show: { object: pig }
          - text: "p i g"
            say: "Now write a letter for each sound. Three sounds, three letters: pig."
            show: { drawn: letter-card, text: "p i g" }
          - text: "s u n"
            say: "Sun. Say it slowly, one sound at a time. The middle sound is the hardest to hear, so listen carefully. It is the sound at the start of up. Three sounds, three letters: sun."
            show: { drawn: letter-card, text: "s u n" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Pig. Say it slowly. How many sounds can you hear?"
                show: { object: pig }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
                hints:
                  - "Hold up a finger for each sound."
                  - "Say pig very slowly and count: the first sound, the middle sound, the last sound."
                  - "Three sounds."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Spell the word."
                say: "Cat. Say the sounds. Put the letters in order to spell cat."
                show: { object: cat }
                options: ["t", "c", "a"]
                slot_count: 3
                answer: ["c", "a", "t"]
                option_audio: false
                hints:
                  - "Say cat slowly. Which sound comes first?"
                  - "Cat starts with the click sound. Then comes the middle sound."
                  - "The click first, then the sound from ant, then the tap of your tongue."
              - id: l1-f3
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Dog. What is the first sound in dog? Tap its letter."
                show: { object: dog }
                frame: "_og"
                options: ["b", "d", "g"]
                answer: ["d"]
                feedback:
                  "b": "Bog? A bog is a muddy, squelchy place, not a dog! Dog starts like duck."
                hints:
                  - "Say dog. Listen to the very start."
                  - "Your tongue taps behind your teeth, like at the start of duck."
                  - "Dog starts like duck. Tap the letter duck starts with."
              - id: l1-f4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Sun. Stretch it out. Which sound is missing in the middle?"
                show: { object: sun }
                frame: "s_n"
                options: ["a", "u", "o"]
                answer: ["u"]
                hints:
                  - "Say sun very slowly."
                  - "Listen for the sound between the first and the last sound."
                  - "The middle sound is the one at the start of up. Tap the letter up starts with."
              - id: l1-f5
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Bed. What is the last sound in bed? Tap its letter."
                show: { object: bed }
                frame: "be_"
                options: ["b", "d", "t"]
                answer: ["d"]
                feedback:
                  "b": "Those two letters look alike. Bed starts with a pop of your lips, and it ends with the sound at the start of dog."
                hints:
                  - "Say bed. Listen to the very end."
                  - "The last sound is the same as the first sound in dog."
                  - "Bed ends like the start of dog. Tap the letter dog starts with."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Spell the word."
                say: "Oink! Pig. Say the sounds. Put the letters in order to spell pig."
                show: { object: pig }
                options: ["g", "i", "p"]
                slot_count: 3
                answer: ["p", "i", "g"]
                option_audio: false
                hints: ["Say pig slowly and put down one letter for each sound."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Hat. Which sound is missing in the middle?"
                show: { object: hat }
                frame: "h_t"
                options: ["e", "a", "u"]
                answer: ["a"]
                hints: ["The middle sound of hat is the first sound of ant."]
              - id: l1-s3
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Bus. Say it slowly. How many sounds can you hear?"
                show: { object: bus }
                options:
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "3"
                hints: ["Say bus very slowly. Count the sounds on your fingers."]
              - id: l1-s4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Cup. What is the last sound in cup?"
                show: { object: cup }
                frame: "cu_"
                options: ["b", "d", "p"]
                answer: ["p"]
                feedback:
                  "b": "Cub? A cub is a baby bear, and you can't drink from a bear! Your lips pop at the end of cup."
                hints: ["Your lips pop at the end of cup."]
              - id: l1-s5
                type: audio_choice
                text: "Which letter makes the first sound?"
                say: "Listen to the word. Which letter makes its first sound?"
                audio: { en: "Ten." }
                options: ["d", "n", "t"]
                answer: "t"
                hints: ["Say ten. What sound does it start with?"]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Spell the word."
                say: "Dog. Put the letters in order to spell dog."
                show: { object: dog }
                options: ["o", "g", "d"]
                slot_count: 3
                answer: ["d", "o", "g"]
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Fox. Which sound is missing in the middle?"
                show: { object: fox }
                frame: "f_x"
                options: ["i", "o", "a"]
                answer: ["o"]
              - id: l1-n3
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Leg. What is the last sound in leg?"
                show: { object: leg }
                frame: "le_"
                options: ["k", "d", "g"]
                answer: ["g"]
              - id: l1-n4
                type: text_input
                keyboard: letters
                text: "Write the word."
                say: "Bin. Say the sounds. Write the word bin."
                show: { object: bin }
                answer: "bin"
              - id: l1-n5
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Mum. Which sound is missing in the middle?"
                show: { object: mum }
                frame: "m_m"
                options: ["a", "o", "u"]
                answer: ["u"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: ordering
            text: "Spell the word."
            say: "Sun. Put the letters in order to spell sun."
            show: { object: sun }
            options: ["u", "n", "s"]
            slot_count: 3
            answer: ["s", "u", "n"]
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Pig. Which sound is missing in the middle?"
            show: { object: pig }
            frame: "p_g"
            options: ["e", "a", "i"]
            answer: ["i"]
          - id: l1-c3
            type: image_multiple_choice
            text: "How many sounds?"
            say: "Egg. How many sounds can you hear?"
            show: { object: egg }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
            answer: "2"
          - id: l1-c4
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Box. What is the first sound in box? Tap its letter."
            show: { object: box }
            frame: "_ox"
            options: ["d", "f", "b"]
            answer: ["b"]
          - id: l1-c5
            type: ordering
            text: "Spell the word."
            say: "Map. Put the letters in order to spell map."
            show: { object: map }
            options: ["p", "a", "m"]
            slot_count: 3
            answer: ["m", "a", "p"]
            option_audio: false
          - id: l1-c6
            type: image_multiple_choice
            text: "How many sounds?"
            say: "Bed. How many sounds can you hear?"
            show: { object: bed }
            options:
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
              - { drawn: dots, count: 4, layout: row }
            answer: "3"

  - n: 2
    title: { de: "fish, duck, lamp", en: "fish, duck, lamp" }
    goal:
      de: "Schreib Wörter wie fish und duck, in denen zwei Buchstaben einen Laut machen."
      en: "Spell words like fish and duck, where two letters make one sound."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            text: "Spell the word."
            say: "Bus. Put the letters in order to spell bus."
            show: { object: bus }
            options: ["s", "u", "b"]
            slot_count: 3
            answer: ["b", "u", "s"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Dog. Which sound is missing in the middle?"
            show: { object: dog }
            frame: "d_g"
            options: ["u", "o", "a"]
            answer: ["o"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "fish"
            say: "Fish has four letters. What do you think: does fish have four sounds too? Say it slowly and have a guess."
            show: { object: fish }
          - text: "f i sh"
            say: "Fish. Say it slowly, one sound at a time. Only three sounds! The last sound is the quiet sound, and it needs two letters on one sound button."
            show: { object: fish }
          - text: "d u ck"
            say: "Duck has three sounds. The click at the end of a short word is written with two letters together. Three sounds, four letters."
            show: { object: duck }
          - text: "l a m p"
            say: "Lamp has four sounds and four letters. At the end, two sounds sit side by side. Listen hard for the hum before the last sound, so you do not miss it."
            show: { drawn: letter-card, text: "l a m p" }
          - text: "Did you know?"
            say: "Did you know? A frog does not drink water with its mouth. It soaks up water through its skin!"
            show: { object: frog }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Spell the word."
                say: "Fish. Say the sounds. Put the cards in order to spell fish."
                show: { object: fish }
                options: ["i", "sh", "f"]
                slot_count: 3
                answer: ["f", "i", "sh"]
                option_audio: false
                hints:
                  - "Say fish slowly. Three sounds, three cards."
                  - "Fish starts with a breath, with your teeth on your lip."
                  - "The breath first, then the sound from insect, then the quiet sound."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Duck. Say it slowly. How many sounds can you hear?"
                show: { object: duck }
                options:
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 5, layout: row }
                answer: "3"
                feedback:
                  "4": "Duck has four letters, but the last two make one sound, the click. So duck has three sounds."
                hints:
                  - "Count the sounds, not the letters."
                  - "The first sound, the middle sound, then the click at the end."
                  - "Three sounds."
              - id: l2-f3
                type: fill_in_blank
                text: "What is missing?"
                say: "Duck. What spells the click at the end of duck?"
                show: { object: duck }
                frame: "du_"
                options: ["c", "ck", "k"]
                answer: ["ck"]
                hints:
                  - "Duck is a short word with a click at the end."
                  - "The click at the end of a short word takes two letters."
                  - "Tap the card with two letters on it."
              - id: l2-f4
                type: ordering
                text: "Spell the word."
                say: "Lamp. Say the sounds. Put the letters in order to spell lamp."
                show: { object: lamp }
                options: ["m", "l", "p", "a"]
                slot_count: 4
                answer: ["l", "a", "m", "p"]
                option_audio: false
                hints:
                  - "Say lamp slowly. Four sounds."
                  - "Lamp starts like lemon, then ant. Then there are two sounds at the end."
                  - "At the end, the hum from milk comes first, then the pop from pig."
              - id: l2-f5
                type: fill_in_blank
                text: "What is missing?"
                say: "Ring. What spells the last sound in ring?"
                show: { object: ring }
                frame: "ri_"
                options: ["n", "ng", "g"]
                answer: ["ng"]
                hints:
                  - "Say ring. Listen to the end."
                  - "The end sound is made at the back of your mouth."
                  - "The end of ring takes two letters on one card. Tap that card."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Spell the word."
                say: "Shop. Put the cards in order to spell shop."
                show: { object: shop }
                options: ["o", "p", "sh"]
                slot_count: 3
                answer: ["sh", "o", "p"]
                option_audio: false
                hints: ["Shop starts with the quiet sound, like shoe."]
              - id: l2-s2
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Shell. Say it slowly. How many sounds can you hear?"
                show: { object: shell }
                options:
                  - { drawn: dots, count: 5, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
                hints: ["Say shell slowly. Count the sounds, not the letters."]
              - id: l2-s3
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Hand. Which sound is missing?"
                show: { object: hand }
                frame: "ha_d"
                options: ["m", "d", "n"]
                answer: ["n"]
                feedback:
                  "d": "Hadd? Say hand slowly. Just before the last sound, your tongue hums behind your teeth."
                hints: ["Say hand very slowly. Which sound comes just before the last one?"]
              - id: l2-s4
                type: ordering
                text: "Spell the word."
                say: "Frog. Put the letters in order to spell frog."
                show: { object: frog }
                options: ["g", "r", "o", "f"]
                slot_count: 4
                answer: ["f", "r", "o", "g"]
                option_audio: false
                hints: ["Frog has two sounds side by side at the start. Say them slowly."]
              - id: l2-s5
                type: fill_in_blank
                text: "What is missing?"
                say: "Bell. What spells the last sound in bell?"
                show: { object: bell }
                frame: "be_"
                options: ["l", "ll", "d"]
                answer: ["ll"]
                hints: ["In a short word like bell, the last sound is often written with two letters the same."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Spell the word."
                say: "Duck. Put the cards in order to spell duck."
                show: { object: duck }
                options: ["ck", "u", "d"]
                slot_count: 3
                answer: ["d", "u", "ck"]
                option_audio: false
              - id: l2-n2
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Fish. How many sounds can you hear?"
                show: { object: fish }
                options:
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                answer: "3"
              - id: l2-n3
                type: ordering
                text: "Spell the word."
                say: "Jump. Put the letters in order to spell jump."
                show: { object: jump }
                options: ["p", "m", "j", "u"]
                slot_count: 4
                answer: ["j", "u", "m", "p"]
                option_audio: false
              - id: l2-n4
                type: fill_in_blank
                text: "What is missing?"
                say: "Sock. What spells the last sound in sock?"
                show: { object: sock }
                frame: "so_"
                options: ["k", "ck", "c"]
                answer: ["ck"]
              - id: l2-n5
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Web. Which sound is missing in the middle?"
                show: { object: web }
                frame: "w_b"
                options: ["i", "a", "e"]
                answer: ["e"]

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: whole-word
            type: ordering
            text: "Spell the word."
            say: "Cup. Put the letters in order to spell cup."
            show: { object: cup }
            options: ["p", "c", "u"]
            slot_count: 3
            answer: ["c", "u", "p"]
            option_audio: false
          - id: l2-c2
            part: count-sounds
            type: image_multiple_choice
            text: "How many sounds?"
            say: "Sock. How many sounds can you hear?"
            show: { object: sock }
            options:
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
              - { drawn: dots, count: 4, layout: row }
            answer: "3"
          - id: l2-c3
            part: missing-sound
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Bus. Which sound is missing in the middle?"
            show: { object: bus }
            frame: "b_s"
            options: ["a", "e", "u"]
            answer: ["u"]
          - id: l2-c4
            part: two-letters
            type: ordering
            text: "Spell the word."
            say: "Shell. Put the cards in order to spell shell."
            show: { object: shell }
            options: ["ll", "e", "sh"]
            slot_count: 3
            answer: ["sh", "e", "ll"]
            option_audio: false
          - id: l2-c5
            part: whole-word
            type: text_input
            keyboard: letters
            text: "Write the word."
            say: "Hen. Write the word hen."
            show: { object: hen }
            answer: "hen"
          - id: l2-c6
            part: count-sounds
            type: image_multiple_choice
            text: "How many sounds?"
            say: "Milk. How many sounds can you hear?"
            show: { object: milk }
            options:
              - { drawn: dots, count: 3, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 4, layout: row }
            answer: "4"
          - id: l2-c7
            part: missing-sound
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Van. What is the first sound in van? Tap its letter."
            show: { object: van }
            frame: "_an"
            options: ["f", "w", "v"]
            answer: ["v"]
          - id: l2-c8
            part: whole-word
            type: ordering
            text: "Spell the word."
            say: "Web. Put the letters in order to spell web."
            show: { object: web }
            options: ["b", "w", "e"]
            slot_count: 3
            answer: ["w", "e", "b"]
            option_audio: false
          - id: l2-c9
            part: two-letters
            type: fill_in_blank
            text: "What is missing?"
            say: "Dish. What spells the last sound in dish?"
            show: { object: dish }
            frame: "di_"
            options: ["s", "ch", "sh"]
            answer: ["sh"]
          - id: l2-c10
            part: count-sounds
            type: image_multiple_choice
            text: "How many sounds?"
            say: "Frog. How many sounds can you hear?"
            show: { object: frog }
            options:
              - { drawn: dots, count: 3, layout: row }
              - { drawn: dots, count: 4, layout: row }
              - { drawn: dots, count: 5, layout: row }
