# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-s-a-t-p
skill: lit-en.phonics.s-a-t-p
curriculum: en-GB
language: en
title:
  de: Die Laute s, a, t, p
  en: The sounds s, a, t, p
summary: >
  The first four letters of phonics and their sounds. Lesson 1 links each
  letter to its sound and to words that start with it; lesson 2 blends the
  sounds into words (at, sat, pat, tap, sap) and ends with the skill check.
  The sounds are recorded once and played from the sound bank, so the
  voice never says a letter name or a bare t or p.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonological.oral-blending, lit-en.phonological.initial-sounds]
  also_practises: []
  vocabulary: { en: [sound, letter, blend, word] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.s, en.a, en.t, en.p]
  facets: []
  misconceptions:
    - id: letter-name
      what: Says the letter name (ess, tee) instead of the sound
      addressed: every letter sound is played from the sound bank, never as a name; hints point to the sound through a word that starts with it (snake, pie) or the letter's shape
    - id: t-p-mixup
      what: Mixes up t and p, two short popping sounds
      addressed: t and p appear in the same option set in every stage of lesson 1, with feedback in l1-f3 and l1-f5
    - id: sound-by-sound
      what: Says the sounds but does not push them together into a word (s, a, t, not sat)
      addressed: lesson 2 Learn plays the sounds one by one and then joins them; the full-stage hints in l2-f1 and l2-f4 say to say the sounds slowly, then fast
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "s, a, t, p", en: "s, a, t, p" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "s"
            say: "This letter makes a sound. Sand, seal and sausage all start with it. Listen."
            show: { drawn: letter-card, text: "s" }
            sound: en.s
          - text: "a"
            say: "This letter makes a sound. Alligator, astronaut and ambulance all start with it. Listen."
            show: { drawn: letter-card, text: "a" }
            sound: en.a
          - text: "t"
            say: "This letter makes a short sound, like a tap of your tongue. Tiger, teddy and tooth all start with it. Listen."
            show: { drawn: letter-card, text: "t" }
            sound: en.t
          - text: "p"
            say: "This letter makes a short sound. Your lips pop. Puppy, penguin and pan all start with it. Listen."
            show: { drawn: letter-card, text: "p" }
            sound: en.p

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.s }
                options: ["s", "a", "t"]
                answer: "s"
                hints:
                  - "Listen again. It is a long hiss, like a snake."
                  - "Sun starts with this sound. Say sun slowly and listen to the start."
                  - "It is the letter that curls like a snake."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "a" }
                options: [{ object: ant }, { object: moon }, { object: sun }]
                answer: ant
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Ant, moon, sun. Which one starts like alligator?"
                  - "Ant starts with this letter. Tap the ant."
                difficulty: easy
              - id: l1-f3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.p }
                options: ["t", "p", "s"]
                answer: "p"
                feedback:
                  "t": "That letter makes the sound at the start of tiger. This one makes your lips pop, like in puppy."
                hints:
                  - "Listen again. Do your lips pop?"
                  - "Puppy starts with this sound."
                  - "It is the letter with a long stick going down and a round head at the top."
              - id: l1-f4
                type: true_false
                text: "Does it start with this letter?"
                say: "Ten. Does ten start with this letter?"
                show: { drawn: letter-card, text: "t" }
                answer: true
                hints:
                  - "Say ten slowly. Listen to the start."
                  - "Ten starts with a short tap of your tongue, like tiger."
                  - "Yes. Ten starts with this letter."
              - id: l1-f5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "p" }
                options: [{ object: tree }, { object: pineapple }, { object: apple }]
                answer: pineapple
                feedback:
                  tree: "Tree starts with a tap of your tongue. Your lips do not pop in tree."
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one makes your lips pop at the start?"
                  - "Pineapple starts with this letter. Tap the pineapple."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.a }
                options: ["p", "s", "a"]
                answer: "a"
                hints: ["Apple starts with this sound."]
              - id: l1-s2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "s" }
                options: [{ object: fish }, { object: snake }, { object: moon }]
                answer: snake
                hints: ["Say each word slowly. Which one starts with a long hiss?"]
              - id: l1-s3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.t }
                options: ["a", "t", "p"]
                answer: "t"
                hints: ["Listen again. Is it a tap of your tongue or a pop of your lips?"]
              - id: l1-s4
                type: true_false
                text: "Does it start with this letter?"
                say: "Pineapple. Does pineapple start with this letter?"
                show: { drawn: letter-card, text: "s" }
                answer: false
                hints: ["Say pineapple slowly. Is the start a hiss?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "t" }
                options: [{ object: pie }, { object: sun }, { object: tree }]
                answer: tree
                hints: ["Which one starts with a short tap of your tongue?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.s }
                options: ["t", "a", "s"]
                answer: "s"
              - id: l1-n2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "a" }
                options: [{ object: egg }, { object: anchor }, { object: pie }]
                answer: anchor
              - id: l1-n3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.p }
                options: ["p", "a", "t"]
                answer: "p"
              - id: l1-n4
                type: true_false
                text: "Does it start with this letter?"
                say: "Sock. Does sock start with this letter?"
                show: { drawn: letter-card, text: "s" }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "p" }
                options: [{ object: pencil }, { object: snake }, { object: egg }]
                answer: pencil

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.t }
            options: ["s", "p", "t"]
            answer: "t"
          - id: l1-c2
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "p" }
            options: [{ object: pie }, { object: sun }, { object: ant }]
            answer: pie
          - id: l1-c3
            type: true_false
            text: "Does it start with this letter?"
            say: "Apple. Does apple start with this letter?"
            show: { drawn: letter-card, text: "a" }
            answer: true

  - n: 2
    title: { de: "at, sat, tap", en: "at, sat, tap" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "a t"
            say: "Now we push sounds together to make a word. Point to the first letter. It makes this sound."
            show: { drawn: letter-card, text: "a t" }
            sound: en.a
          - text: "a t"
            say: "Point to the next letter. It makes this sound."
            show: { drawn: letter-card, text: "a t" }
            sound: en.t
          - text: "a t → at"
            say: "Say the two sounds slowly, then faster and faster. They join up into a word: at."
            show: { drawn: letter-card, text: "at" }
          - text: "s a t → sat"
            say: "Now three letters. The snake sound, then at. Say them slowly, then fast. They join up into sat."
            show: { drawn: letter-card, text: "s a t" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "pat" }
                options: ["pat", "tap", "sat"]
                answer: "pat"
                feedback:
                  "tap": "Tap has the same sounds, but it starts with a tap of your tongue. Pat starts with a pop of your lips."
                hints:
                  - "Listen to the first sound."
                  - "Your lips pop at the start."
                  - "Say the sounds of each word slowly, then fast. The word is pat."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Pat. Which letter is missing in the middle of pat?"
                frame: "p_t"
                options: ["a", "s", "t"]
                answer: ["a"]
                hints:
                  - "Say pat slowly: the first sound, the middle sound, the last sound."
                  - "The middle sound is the one at the start of ant."
                  - "The missing letter is the one ant starts with."
              - id: l2-f3
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Tap. Which letter is missing at the start of tap?"
                frame: "_ap"
                options: ["t", "s", "p"]
                answer: ["t"]
                hints:
                  - "Say tap slowly. What is the first sound?"
                  - "It is a short tap of your tongue, like at the start of ten."
                  - "The missing letter is the one ten starts with."
              - id: l2-f4
                type: true_false
                text: "Is this the word?"
                say: "Pat. Does the card say pat?"
                show: { drawn: letter-card, text: "pat" }
                answer: true
                hints:
                  - "Point to each letter and say its sound."
                  - "Say the sounds slowly, then fast, and push them together."
                  - "Yes, the card says pat."
              - id: l2-f5
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Sap. Which letter is missing at the end of sap?"
                frame: "sa_"
                options: ["p", "t", "s"]
                answer: ["p"]
                hints:
                  - "Say sap slowly. Listen to the end."
                  - "Do your lips pop at the end?"
                  - "The missing letter is the one pie starts with."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "tap" }
                options: ["pat", "sat", "tap"]
                answer: "tap"
                hints: ["Listen to the first sound."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Pat. Which letter is missing at the start of pat?"
                frame: "_at"
                options: ["s", "p", "t"]
                answer: ["p"]
                hints: ["Say pat slowly. Do your lips pop at the start?"]
              - id: l2-s3
                type: true_false
                text: "Is this the word?"
                say: "Tap. Does the card say tap?"
                show: { drawn: letter-card, text: "pat" }
                answer: false
                hints: ["Point to each letter and say its sound. Which sound comes first?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Tap. Which letter is missing in the middle of tap?"
                frame: "t_p"
                options: ["a", "s", "t"]
                answer: ["a"]
                hints: ["The middle sound is the one at the start of apple."]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "sap" }
                options: ["sap", "sat", "tap"]
                answer: "sap"
                hints: ["Listen to the start and to the end."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "pat" }
                options: ["sap", "pat", "sat"]
                answer: "pat"
              - id: l2-n2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Pat. Which letter is missing at the end of pat?"
                frame: "pa_"
                options: ["s", "t", "p"]
                answer: ["t"]
              - id: l2-n3
                type: true_false
                text: "Is this the word?"
                say: "Tap. Does the card say tap?"
                show: { drawn: letter-card, text: "tap" }
                answer: true
              - id: l2-n4
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "sap" }
                options: ["pat", "sap", "tap"]
                answer: "sap"
              - id: l2-n5
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Sap. Which letter is missing at the start of sap?"
                frame: "_ap"
                options: ["a", "p", "s"]
                answer: ["s"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.a }
            options: ["a", "t", "s"]
            answer: "a"
          - id: l2-c2
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "s" }
            options: [{ object: sun }, { object: pie }, { object: tree }]
            answer: sun
          - id: l2-c3
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "sat" }
            options: ["sap", "tap", "sat"]
            answer: "sat"
          - id: l2-c4
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Tap. Which letter is missing at the end of tap?"
            frame: "ta_"
            options: ["t", "p", "s"]
            answer: ["p"]
