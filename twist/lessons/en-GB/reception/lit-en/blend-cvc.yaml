                answer: "pin"
                option_audio: false
                feedback:
                  "pen": "In pen, the middle sound is the one at the start of egg. In pin, it is the middle sound of pig."
                hints:
                  - "Read each word, sound by sound."
                  - "Listen to the middle sound of the word you hear."
