        screens:
          - text: "cat · cot · cut"
            say: "These three words look nearly the same. Only the middle letter changes, so read every sound. Cat. Cot. Cut."
            show: { drawn: letter-card, text: "cat cot cut" }
          - text: "n e ck → neck"
            say: "Some words end with two letters that make one sound. In neck, the last two letters make the click. Neck."
            show: { drawn: letter-card, text: "n e ck" }
          - text: "d o ll → doll"
            say: "In doll, the last two letters make one long sound. Doll."
            show: { drawn: letter-card, text: "d o ll" }

