# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.blend-cvc
skill: lit-en.word-reading.blend-cvc
curriculum: en-GB
language: en
title:
  de: Kurze Wörter lesen
  en: Reading short words
summary: >
  Reading three-letter words by saying each sound and blending them.
  Lesson 1 reads a word on a card and finds its picture; lesson 2 hears a
  word and finds it among words that look alike (cat, cot, cut), reads
  words with ck and the doubled endings, and ends with the skill check.
  The voice never says the word the child has to read.
metadata:
  year: reception
  topic: { de: "Wörter lesen", en: "Reading words" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonics.s-a-t-p]
  also_practises: [lit-en.phonics.h-b-f-l, lit-en.phonics.y-z-qu]
  vocabulary: { en: [read, sound, blend, word] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: read-find, what: { de: ein kurzes Wort lesen und sein Bild finden, en: reading a short word and finding its picture } }
    - { id: middle-sound, what: { de: "Wörter unterscheiden, die nur im mittleren Laut verschieden sind (cat, cot, cut)", en: "telling apart words that differ only in the middle sound (cat, cot, cut)" } }
    - { id: every-sound, what: { de: "Wörter unterscheiden, die im ersten oder letzten Laut verschieden sind (mug, mud, rug)", en: "telling apart words that differ in the first or last sound (mug, mud, rug)" } }
    - { id: two-letters, what: { de: "Wörter lesen, die mit zwei Buchstaben für einen Laut enden (ck, ll)", en: "reading words that end in two letters for one sound (ck, ll)" } }
  misconceptions:
    - id: first-letter-guess
      what: Reads the first letter and guesses (bus as bed)
      addressed: in lesson 1 most picture options share the card's first sound (l1-f1, l1-f2, l1-f3, l1-f5, l1-s1, l1-s2, l1-s5, l1-n1, l1-n2, l1-n3, l1-n5, l1-c1, l1-c2), so only reading the whole word works, with feedback in l1-f1; l1-s4 and l1-c3 set a word against a picture that starts the same (big and bed, hat and hand); the checks do the same in l1-c4, l1-c6, l2-c5, l2-c9 and l2-c17 (pen among pear and pizza, bus among bike and bin, map among monkey and milk, pig among puppy and pencil, sun against a sock)
    - id: middle-vowel
      what: Reads the sounds at the ends but not the vowel in the middle (cut as cat)
      addressed: lesson 2 sets words that differ only in the vowel side by side in every stage, with feedback in l2-f1; the skill check's middle-sound part (l2-c2, l2-c4, l2-c6, l2-c10, l2-c14) tests it in every draw
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Lesen und finden", en: "Read and find" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "p i g"
            say: "Let's read a word. Point to each letter and say its sound. Then push the sounds together, faster and faster. Pig!"
            show: { drawn: letter-card, text: "p i g" }
          - text: "pig"
            say: "When the letters sit close together, it is still the same word. Say the sounds, then blend: pig."
            show: { drawn: letter-card, text: "pig" }
          - text: "ten"
            say: "One more. Say the sounds and blend them. Ten."
            show: { drawn: letter-card, text: "ten" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "bus" }
                options: [{ object: bus }, { object: bed }, { object: ball }]
                answer: bus
                feedback:
                  bed: "Bed starts the same way. Read on to the end of the word."
                hints:
                  - "Say each sound."
                  - "The middle sound is the one at the start of up."
                  - "Push the sounds together. Tap the bus."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "cat" }
                options: [{ object: cup }, { object: car }, { object: cat }]
                answer: cat
                hints:
                  - "Say each sound."
                  - "The middle sound is the one at the start of ant."
                  - "Push the sounds together. Tap the cat."
              - id: l1-f3
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "sun" }
                options: [{ object: sun }, { object: sock }, { object: snail }]
                answer: sun
                hints:
                  - "All three start with a hiss. Read the rest of the word."
                  - "The middle sound is the one at the start of up."
                  - "Push the sounds together. Tap the sun."
              - id: l1-f4
                type: true_false
                text: "fox"
                say: "Read the word at the top. Does it match the picture?"
                show: { object: fox }
                answer: true
                hints:
                  - "Say each sound."
                  - "The last letter makes two sounds, a click and a hiss."
                  - "Yes, it matches."
              - id: l1-f5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "hat" }
                options: [{ object: hedgehog }, { object: hat }, { object: hand }]
                answer: hat
                hints:
                  - "Read past the first sound."
                  - "The middle sound is the one at the start of ant."
                  - "Push the sounds together. Tap the hat."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "dog" }
                options: [{ object: duck }, { object: dog }, { object: dad }]
                answer: dog
                hints: ["Read the middle and the end, not just the start."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "cup" }
                options: [{ object: cat }, { object: cake }, { object: cup }]
                answer: cup
                hints: ["Say all three sounds."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "van" }
                options: [{ object: van }, { object: car }, { object: bus }]
                answer: van
                hints: ["Say each sound, then blend."]
              - id: l1-s4
                type: true_false
                text: "big"
                say: "Read the word at the top. Does it match the picture?"
                show: { object: bed }
                answer: false
                hints: ["Read the middle sound carefully."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "web" }
                options: [{ object: web }, { object: wave }, { object: whale }]
                answer: web
                hints: ["Read to the end of the word."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "box" }
                options: [{ object: book }, { object: box }, { object: boat }]
                answer: box
              - id: l1-n2
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "jug" }
                options: [{ object: jump }, { object: juice }, { object: jug }]
                answer: jug
              - id: l1-n3
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "zip" }
                options: [{ object: zip }, { object: zebra }, { object: fish }]
                answer: zip
              - id: l1-n4
                type: true_false
                text: "bed"
                say: "Read the word at the top. Does it match the picture?"
                show: { object: bed }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "Read the word. Tap the picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "bin" }
                options: [{ object: bed }, { object: bus }, { object: bin }]
                answer: bin

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word. Which picture is it?"
            show: { drawn: letter-card, text: "leg" }
            options: [{ object: lamp }, { object: leg }, { object: leaf }]
            answer: leg
          - id: l1-c2
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word. Which picture is it?"
            show: { drawn: letter-card, text: "fox" }
            options: [{ object: frog }, { object: fox }, { object: fish }]
            answer: fox
          - id: l1-c3
            type: true_false
            text: "hat"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: hand }
            answer: false
          - id: l1-c4
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word. Which picture is it?"
            show: { drawn: letter-card, text: "pen" }
            options: [{ object: pear }, { object: pizza }, { object: pen }]
            answer: pen
          - id: l1-c5
            type: true_false
            text: "dog"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: dog }
            answer: true
          - id: l1-c6
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word. Which picture is it?"
            show: { drawn: letter-card, text: "bus" }
            options: [{ object: bike }, { object: bus }, { object: bin }]
            answer: bus

  - n: 2
    title: { de: "Genau hinsehen", en: "Look carefully" }
