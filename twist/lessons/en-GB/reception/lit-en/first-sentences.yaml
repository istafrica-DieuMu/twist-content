# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.first-sentences
skill: lit-en.word-reading.first-sentences
curriculum: en-GB
language: en
title:
  de: Erste Sätze lesen
  en: Reading first sentences
summary: >
  Reading short sentences made of words the child can sound out and the
  first tricky words. Lesson 1 reads sentences with single-letter sounds
  (The cat is on the bed.); lesson 2 adds words with sh, ch, th and ng
  and the tricky words she, they and are, and ends with the skill check.
  The voice never reads the sentence: the child reads it, then finds its
  picture, says whether it matches, builds it from word cards or finds
  the word that does not make sense.
metadata:
  year: reception
  topic: { de: "Wörter lesen", en: "Reading words" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.word-reading.first-tricky-words, lit-en.phonics.ch-sh-th-ng]
  also_practises: [lit-en.word-reading.first-tricky-words, lit-en.phonics.ch-sh-th-ng]
  vocabulary: { en: [sentence, word, read, tricky word, make sense, full stop] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: read-find, what: { de: einen Satz lesen und sein Bild finden, en: reading a sentence and finding its picture } }
    - { id: match, what: { de: "sagen, ob ein Satz zum Bild passt", en: saying whether a sentence matches the picture } }
    - { id: build, what: { de: einen Satz aus Wortkarten legen, en: building a sentence from word cards } }
    - { id: sense, what: { de: "das Wort finden, das keinen Sinn ergibt", en: finding the word that does not make sense } }
  misconceptions:
    - id: no-sense-check
      what: Reads word by word without asking whether the sentence makes sense
      addressed: Learn in both lessons ends with "Does it make sense?"; the child finds the word that does not fit in l1-f5, l1-s5, l2-f5, l2-s5, l2-n5 and the skill check task l2-c5
    - id: first-letter-guess
      what: Guesses a word from its first letter instead of reading it all (bed for bell, rabbit for ring)
      addressed: picture options share a first sound in l1-n4, l2-f1, l2-s1 and l2-n4, and an end in l2-c4 (fish, dish); true/false tasks show a picture with the same first sound (l2-f2, l2-n2, l2-c2); the hints of l2-f1 and l2-f2 say to read to the end of the word
    - id: sounds-out-tricky-words
      what: Tries to sound out the tricky words (t-h-e-y, a-r-e) and stalls
      addressed: Learn in lesson 2 says they, are and she are known by sight; the word cards in l2-f3, l2-n3 and l2-c3 start the sentence with a tricky word
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Der erste Satz", en: "My first sentences" }
    goal:
      de: "Lies einen Satz Wort für Wort, so wie the cat is on the bed, und prüf, ob er Sinn ergibt."
      en: "Read a sentence word by word, like the cat is on the bed, and check it makes sense."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Which word do you hear?"
            say: "Listen. Which word do you hear?"
            audio: { en: "Shut." }
            options: ["hut", "shut", "chin"]
            answer: "shut"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Which word do you hear?"
            say: "Listen. Which tricky word do you hear?"
            audio: { en: "The." }
            options: ["he", "she", "the"]
            answer: "the"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The cat is on the bed."
            say: "Here is a sentence. I will point to each word as I read it: The cat is on the bed. The first word, the, is a tricky word. Cat, is, on and bed you can sound out."
            show: { object: cat }
          - text: "The dog had a bun."
            say: "Read a sentence one word at a time. Sound out each word, then push the sounds together: dog. When you get to the end, read it all again, a bit faster, so it sounds like talking."
            show: { object: dog }
          - text: "Does it make sense?"
            say: "When you have read a sentence, ask yourself: does it make sense? If it does not, go back and read it again."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "A pig is in the mud."
                say: "Read the sentence. What is it about? Tap the picture."
                options: [{ object: dog }, { object: pig }, { object: cat }]
                answer: pig
                hints:
                  - "Read the words one at a time."
                  - "Sound out the second word, then push the sounds together."
                  - "Pig. Tap the pig."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "It is a cat."
                say: "Read the words. Do they match the picture?"
                show: { object: dog }
                answer: false
                hints:
                  - "Read the last word slowly."
                  - "Sound out the last word. What is in the picture?"
                  - "No. The words say cat, but the picture is a dog."
              - id: l1-f3
                type: ordering
                text: "Put the words in order."
                say: "Put the words in order to make a sentence about the picture. Start with the word that has a capital letter."
                show: { object: fish }
                options: ["is", "fish.", "a", "It"]
                slot_count: 4
                answer: ["It", "is", "a", "fish."]
                option_audio: false
                hints:
                  - "A sentence starts with a capital letter."
                  - "Start with It. What comes next?"
                  - "It is a fish."
              - id: l1-f4
                type: image_multiple_choice
                text: "I got a red hat."
                say: "Read the sentence. What did I get? Tap the picture."
                options: [{ object: bed }, { object: hat }, { object: hand }]
                answer: hat
                hints:
                  - "Read to the end of the sentence."
                  - "Sound out the last word and push the sounds together."
                  - "Hat. Tap the hat."
              - id: l1-f5
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                say: "Read the sentence. One word does not make sense. Tap it."
                show: { drawn: letter-card, text: "I sip milk from a sock." }
                spans: ["sock"]
                hints:
                  - "Read the sentence. Could that really happen?"
                  - "What do you drink milk from?"
                  - "You drink from a cup, not a sock. Tap sock."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "The duck is in the pond."
                say: "Read the sentence. What is it about? Tap the picture."
                options: [{ object: duck }, { object: dog }, { object: sock }]
                answer: duck
                hints: ["Read the second word slowly. The last two letters make one click."]
              - id: l1-s2
                type: true_false
                text: "It is a bus."
                say: "Read the words. Do they match the picture?"
                show: { object: bus }
                answer: true
                hints: ["Sound out the last word."]
              - id: l1-s3
                type: ordering
                text: "Put the words in order."
                say: "Put the words in order to make a sentence about the picture."
                show: { object: dog }
                options: ["a", "I", "dog.", "had"]
                slot_count: 4
                answer: ["I", "had", "a", "dog."]
                option_audio: false
                hints: ["The word with the capital letter comes first."]
              - id: l1-s4
                type: image_multiple_choice
                text: "He got a big box."
                say: "Read the sentence. What did he get? Tap the picture."
                options: [{ object: fox }, { object: bus }, { object: box }]
                answer: box
                hints: ["Read the last word, sound by sound. The last letter makes a click and a hiss."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                say: "Read the sentence. One word does not make sense. Tap it."
                show: { drawn: letter-card, text: "I put my hat on my leg." }
                spans: ["leg"]
                hints: ["Where do you put a hat?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "A fox is in the box."
                say: "Read the sentence. Who is in the box? Tap the picture."
                options: [{ object: box }, { object: fox }, { object: dog }]
                answer: fox
              - id: l1-n2
                type: true_false
                text: "It is a red bus."
                say: "Read the words. Do they match the picture?"
                show: { object: bed }
                answer: false
              - id: l1-n3
                type: ordering
                text: "Put the words in order."
                say: "Put the words in order to make a sentence about the picture."
                show: { object: cat }
                options: ["cat.", "has", "He", "a"]
                slot_count: 4
                answer: ["He", "has", "a", "cat."]
                option_audio: false
              - id: l1-n4
                type: image_multiple_choice
                text: "We got a big bell."
                say: "Read the sentence. What did we get? Tap the picture."
                options: [{ object: ball }, { object: bed }, { object: bell }]
                answer: bell
              - id: l1-n5
                type: true_false
                text: "It is a duck."
                say: "Read the words. Do they match the picture?"
                show: { object: duck }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "The man has a van."
            say: "Read the sentence. What has the man got? Tap the picture."
            options: [{ object: bus }, { object: van }, { object: taxi }]
            answer: van
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "It is a cup."
            say: "Read the words. Do they match the picture?"
            show: { object: cup }
            answer: true
          - id: l1-c3
            type: ordering
            text: "Put the words in order."
            say: "Put the words in order to make a sentence about the picture."
            show: { object: sun }
            options: ["hot.", "It", "is"]
            slot_count: 3
            answer: ["It", "is", "hot."]
            option_audio: false
          - id: l1-c4
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. One word does not make sense. Tap it."
            show: { drawn: letter-card, text: "I sat on the sun." }
            spans: ["sun"]
          - id: l1-c5
            type: true_false
            text: "A big hen sat on ten eggs."
            say: "Read the words. Do they match the picture?"
            show: { object: pig }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "The pen is in the bin."
            say: "Read the sentence. Then tap its picture."
            options: [{ object: pear }, { object: pencil }, { object: pen }]
            answer: pen
            option_audio: false

  - n: 2
    title: { de: "She has a shell.", en: "She has a shell." }
    goal:
      de: "Lies Sätze mit Wörtern wie shell und shop und mit schwierigen Wörtern wie she und they."
      en: "Read sentences with words like shell and shop, and tricky words like she and they."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "The fox is on a log."
            say: "Read the sentence. What is it about? Tap the picture."
            options: [{ object: fox }, { object: dog }, { object: frog }]
            answer: fox
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Put the words in order."
            say: "Put the words in order to make a sentence about the picture."
            show: { object: duck }
            options: ["a", "is", "It", "duck."]
            slot_count: 4
            answer: ["It", "is", "a", "duck."]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "She has a shell."
            say: "Here is a sentence with a tricky word, she, and a word that starts with two letters for one sound: shell. Sound out shell, then push the sounds together. Now I read it all: She has a shell."
            show: { object: shell }
          - text: "They are in the shop."
            say: "They and are are tricky words. You know them by looking, not by sounding out. Shop starts with the same two letters as shell. Now I read it all: They are in the shop."
            show: { object: shop }
          - text: "Does it make sense?"
            say: "Read to the end of every word, not just the first letter. Then ask: does it make sense?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "She has a ring."
                say: "Read the sentence. What has she got? Tap the picture."
                options: [{ object: rain }, { object: ring }, { object: rabbit }]
                answer: ring
                hints:
                  - "All three pictures start with the same sound. Read to the end of the word."
                  - "The two letters at the end make one sound."
                  - "Push the sounds together: ring. Tap the ring."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "It is a shell."
                say: "Read the words. Do they match the picture?"
                show: { object: shoe }
                answer: false
                hints:
                  - "Read to the end of the last word, not just the start."
                  - "Sound out the last word. Is that the picture?"
                  - "No. The words say shell, but the picture is a shoe."
              - id: l2-f3
                type: ordering
                text: "Put the words in order."
                say: "Put the words in order to make a sentence about the picture. Start with the word that has a capital letter."
                show: { object: shop }
                options: ["in", "They", "shop.", "are", "the"]
                slot_count: 5
                answer: ["They", "are", "in", "the", "shop."]
                option_audio: false
                hints:
                  - "Start with the tricky word that has a capital letter."
                  - "They, then the other tricky word."
                  - "They are in the shop."
              - id: l2-f4
                type: image_multiple_choice
                text: "My dog is in the bath."
                say: "Read the sentence. Who is in the bath? Tap the picture."
                options: [{ object: cat }, { object: fish }, { object: dog }]
                answer: dog
                hints:
                  - "Read the sentence one word at a time."
                  - "My is a tricky word. Then sound out the next word."
                  - "Dog. Tap the dog."
              - id: l2-f5
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                say: "Read the sentence. One word does not make sense. Tap it."
                show: { drawn: letter-card, text: "I dig in the sand with a bun." }
                spans: ["bun"]
                hints:
                  - "Read the sentence. Could that really happen?"
                  - "What do you dig with?"
                  - "You eat a bun. You dig with a spade. Tap bun."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "This is my sock."
                say: "Read the sentence. What is it about? Tap the picture."
                options: [{ object: shell }, { object: sock }, { object: sun }]
                answer: sock
                hints: ["Read the whole last word, right to the end."]
              - id: l2-s2
                type: true_false
                text: "It is a fish."
                say: "Read the words. Do they match the picture?"
                show: { object: fish }
                answer: true
                hints: ["Sound out the last word. The two letters at the end make one sound."]
              - id: l2-s3
                type: ordering
                text: "Put the words in order."
                say: "Put the words in order to make a sentence about the picture."
                show: { object: shop }
                options: ["shut.", "The", "is", "shop"]
                slot_count: 4
                answer: ["The", "shop", "is", "shut."]
                option_audio: false
                hints: ["The word with the capital letter comes first. The word with the full stop comes last."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Dad got wet in the bath."
                say: "Read the sentence. Who got wet? Tap the picture."
                options: [{ object: mum }, { object: baby }, { object: dad }]
                answer: dad
                hints: ["Sound out the first word."]
              - id: l2-s5
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                say: "Read the sentence. One word does not make sense. Tap it."
                show: { drawn: letter-card, text: "The duck can swim in the bin." }
                spans: ["bin"]
                hints: ["Where does a duck swim?"]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Mum is at the shop."
                say: "Read the sentence. Who is at the shop? Tap the picture."
                options: [{ object: grandma }, { object: dad }, { object: mum }]
                answer: mum
              - id: l2-n2
                type: true_false
                text: "It is a ring."
                say: "Read the words. Do they match the picture?"
                show: { object: rabbit }
                answer: false
              - id: l2-n3
                type: ordering
                text: "Put the words in order."
                say: "Put the words in order to make a sentence about the picture."
                show: { object: ship }
                options: ["a", "We", "ship.", "on", "are"]
                slot_count: 5
                answer: ["We", "are", "on", "a", "ship."]
                option_audio: false
              - id: l2-n4
                type: image_multiple_choice
                text: "The shell is in the box."
                say: "Read the sentence. What is in the box? Tap the picture."
                options: [{ object: sock }, { object: shell }, { object: shoe }]
                answer: shell
              - id: l2-n5
                type: highlight_in_text
                text: "Tap the word that does not make sense."
                say: "Read the sentence. One word does not make sense. Tap it."
                show: { drawn: letter-card, text: "I can sit in a cup." }
                spans: ["cup"]

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: read-find
            type: image_multiple_choice
            text: "The cat had a nap."
            say: "Read the sentence. Who had a nap? Tap the picture."
            options: [{ object: rabbit }, { object: cat }, { object: dog }]
            answer: cat
            option_audio: false
          - id: l2-c2
            part: match
            type: true_false
            text: "It is a bed."
            say: "Read the words. Do they match the picture?"
            show: { object: bell }
            answer: false
          - id: l2-c3
            part: build
            type: ordering
            text: "Put the words in order."
            say: "Put the words in order to make a sentence about the picture."
            show: { object: bus }
            options: ["the", "She", "bus.", "is", "on"]
            slot_count: 5
            answer: ["She", "is", "on", "the", "bus."]
            option_audio: false
          - id: l2-c4
            part: read-find
            type: image_multiple_choice
            text: "The fish is in the bath."
            say: "Read the sentence. What is in the bath? Tap the picture."
            options: [{ object: dish }, { object: fish }, { object: ship }]
            answer: fish
            option_audio: false
          - id: l2-c5
            part: sense
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. One word does not make sense. Tap it."
            show: { drawn: letter-card, text: "She got in bed with a bus." }
            spans: ["bus"]
          - id: l2-c6
            part: read-find
            type: image_multiple_choice
            text: "The hen is on the shed."
            say: "Read the sentence. Who is on the shed? Tap the picture."
            options: [{ object: horse }, { object: hen }, { object: hedgehog }]
            answer: hen
            option_audio: false
          - id: l2-c7
            part: match
            type: true_false
            text: "I can kick a ball."
            say: "Read the words. Do they match the picture?"
            show: { object: play-football }
            answer: true
          - id: l2-c8
            part: build
            type: ordering
            text: "Put the words in order."
            say: "Put the words in order to make a sentence about the picture."
            show: { object: hen }
            options: ["hen", "has", "an", "The", "egg."]
            slot_count: 5
            answer: ["The", "hen", "has", "an", "egg."]
            option_audio: false
          - id: l2-c9
            part: sense
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. One word does not make sense. Tap it."
            show: { drawn: letter-card, text: "I can kick the ball with my hat." }
            spans: ["hat"]
          - id: l2-c10
            part: read-find
            type: image_multiple_choice
            text: "Mum has a big jug."
            say: "Read the sentence. What has Mum got? Tap the picture."
            options: [{ object: juice }, { object: jumper }, { object: jug }]
            answer: jug
            option_audio: false
          - id: l2-c11
            part: match
            type: true_false
            text: "She is in the bath."
            say: "Read the words. Do they match the picture?"
            show: { object: bed }
            answer: false
          - id: l2-c12
            part: build
            type: ordering
            text: "Put the words in order."
            say: "Put the words in order to make a sentence about the picture."
            show: { object: shell }
            options: ["shell.", "a", "got", "I"]
            slot_count: 4
            answer: ["I", "got", "a", "shell."]
            option_audio: false
          - id: l2-c13
            part: sense
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. One word does not make sense. Tap it."
            show: { drawn: letter-card, text: "Mum cut the bun with a hen." }
            spans: ["hen"]
          - id: l2-c14
            part: read-find
            type: image_multiple_choice
            text: "Sam can zip it up."
            say: "Read the sentence. Then tap its picture."
            options: [{ object: zebra }, { object: zip }, { object: sock }]
            answer: zip
            option_audio: false
          - id: l2-c15
            part: match
            type: true_false
            text: "That is a big ship."
            say: "Read the words. Do they match the picture?"
            show: { object: shell }
            answer: false
          - id: l2-c16
            part: build
            type: ordering
            text: "Put the words in order."
            say: "Put the words in order to make a sentence about the picture."
            show: { object: fish }
            options: ["fish.", "the", "can", "We", "get"]
            slot_count: 5
            answer: ["We", "can", "get", "the", "fish."]
            option_audio: false
          - id: l2-c17
            part: sense
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. One word does not make sense. Tap it."
            show: { drawn: letter-card, text: "I zip up my bed." }
            spans: ["bed"]
          - id: l2-c18
            part: match
            type: true_false
            text: "I can see a fox."
            say: "Read the words. Do they match the picture?"
            show: { object: fox }
            answer: true
          - id: l2-c19
            part: build
            type: ordering
            text: "Put the words in order."
            say: "Put the words in order to make a sentence about the picture."
            show: { object: bath }
            options: ["in", "is", "the", "bath.", "He"]
            slot_count: 5
            answer: ["He", "is", "in", "the", "bath."]
            option_audio: false
          - id: l2-c20
            part: sense
            type: highlight_in_text
            text: "Tap the word that does not make sense."
            say: "Read the sentence. One word does not make sense. Tap it."
            show: { drawn: letter-card, text: "A dog can sit in a shell." }
            spans: ["shell"]
