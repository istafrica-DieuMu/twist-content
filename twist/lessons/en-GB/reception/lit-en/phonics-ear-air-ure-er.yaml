# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-ear-air-ure-er
skill: lit-en.phonics.ear-air-ure-er
curriculum: en-GB
language: en
title:
  de: Die Laute ear, air, ure, er
  en: The sounds ear, air, ure, er
summary: >
  The last sounds of the Reception phonics. Lesson 1 takes the trigraphs
  ear (hear) and air (chair), which look alike; lesson 2 takes ure (sure)
  and er, the soft sound at the end of ladder and farmer, mixes all four
  and ends with the skill check. The voice says every word; the child
  picks the letters for a sound, fills a gap or reads a word and finds its
  picture.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: [lit-en.phonics.ar-or-ur-ow]
  vocabulary: { en: [sound, letters, digraph, trigraph, sound buttons, blend] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.ear, en.air, en.ure, en.er]
  facets: []
  misconceptions:
    - id: ear-air-mixed
      what: Mixes up ear and air, which share two letters (hair written hear)
      addressed: ear and air share the options in l1-f2 (with feedback), l1-f4, l1-f5, l1-s1, l1-s2, l1-s4, l1-n1, l1-n2, l1-n5, l2-w1, l2-w2, the quick check task l1-c1 and the skill check task l2-c5 (stair next to steer)
    - id: trigraph-split
      what: Reads a trigraph as a short vowel and a second sound (ear as e ... ar, ure as u ... r)
      addressed: Learn in both lessons gives ear, air and ure one sound button; l1-f1 (feedback on egg) and l2-f2 (feedback on ur); ur sits next to ure in l2-f2, l2-s2, l2-n2 and l2-c3
    - id: er-as-ur
      what: Writes the soft er at the end of a word as ur or ar (laddur)
      addressed: Learn in lesson 2 says er is the soft sound at the end of a word; l2-f4 hints; ur and ar are distractors next to er in l2-f4, l2-s1 and l2-n1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "ear und air", en: "ear and air" }
    new_content: true
    activities:
      - activity: learn
        mode: new-sound
        screens:
          - text: "ear"
            say: "These three letters make one sound. You hear with your ear! Near and hear have it too. Listen, then say it with me."
            show: { drawn: letter-card, text: "ear" }
            sound: en.ear
          - text: "air"
            say: "These three letters make one sound. Chair and hair have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "air" }
            sound: en.air
          - text: "ch air → chair"
            say: "Chair has two sounds, the sneeze sound and then air. Each one has a sound button. Push them together: chair."
            show: { object: chair }
          - text: "n ear → near"
            say: "Near has two sounds. The last three letters make one sound, ear. Push the sounds together: near. Look closely at the first letter. Ear and air start with different letters."
            show: { drawn: letter-card, text: "n ear" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ear" }
                options: [{ object: egg }, { object: ear }, { object: elephant }]
                answer: ear
                feedback:
                  egg: "Egg starts with a short sound. These three letters make one long sound, just like the word ear."
                hints:
                  - "Tap each picture and listen."
                  - "You hear with this part of your body."
                  - "Ear. Tap the ear."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which letters make the last sound?"
                say: "Listen to the word. Which letters make its last sound?"
                audio: { en: "Chair." }
                options: ["ear", "air", "a"]
                answer: "air"
                feedback:
                  "ear": "Those letters make the sound in near. Chair ends with the sound in hair."
                hints:
                  - "Listen again to the end of chair."
                  - "Is it ear, as in near, or air, as in hair?"
                  - "Chair ends with air."
              - id: l1-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "chair" }
                options: [{ object: cheese }, { object: chalk }, { object: chair }]
                answer: chair
                hints:
                  - "All three start the same way. Read to the end."
                  - "The sneeze sound, then three letters that make one sound."
                  - "The card says chair. Tap the chair."
              - id: l1-f4
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Hear. I can hear a bird. Which letters are missing at the end of hear?"
                frame: "h_"
                options: ["air", "e", "ear"]
                answer: ["ear"]
                hints:
                  - "Say hear slowly. Listen to the end."
                  - "The end is the same as the word ear."
                  - "Hear ends with ear."
              - id: l1-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Fair." }
                options: ["fear", "fair", "fan"]
                answer: "fair"
                hints:
                  - "Listen to the end of the word."
                  - "It ends like chair."
                  - "The word is fair."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.ear }
                options: ["air", "ur", "ear"]
                answer: "ear"
                hints: ["It sounds just like the word ear, the part of you that hears."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Pair. A pair of socks. Which letters are missing at the end of pair?"
                frame: "p_"
                options: ["ear", "air", "a"]
                answer: ["air"]
                hints: ["Pair ends like chair."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "air" }
                options: [{ object: cup }, { object: chair }, { object: cake }]
                answer: chair
                hints: ["Listen for air at the end."]
              - id: l1-s4
                type: true_false
                text: "Does the card say hear?"
                say: "Read the card. Does it say hear?"
                show: { drawn: letter-card, text: "hair" }
                answer: false
                hints: ["Look at the second letter. Is it the letter that ear starts with?"]
              - id: l1-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Year." }
                options: ["yes", "yell", "year"]
                answer: "year"
                hints: ["Listen to the end. Is it ear?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letters make the last sound?"
                say: "Listen to the word. Which letters make its last sound?"
                audio: { en: "Hair." }
                options: ["ear", "or", "air"]
                answer: "air"
              - id: l1-n2
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Dear. Which letters are missing at the end of dear?"
                frame: "d_"
                options: ["ear", "air", "er"]
                answer: ["ear"]
              - id: l1-n3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "ear" }
                options: [{ object: eye }, { object: egg }, { object: ear }]
                answer: ear
              - id: l1-n4
                type: true_false
                text: "Does chair end with air?"
                say: "Chair. Does chair end with the sound air?"
                show: { object: chair }
                answer: true
              - id: l1-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Fear." }
                options: ["fair", "fear", "fur"]
                answer: "fear"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letters make this sound?"
            say: "Listen. Tap the letters for this sound."
            audio: { sound: en.air }
            options: ["ear", "ar", "air"]
            answer: "air"
          - id: l1-c2
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen. Tap the letters for the middle sound."
            audio: { en: "Beard." }
            options: ["air", "ear", "ar"]
            answer: "ear"
          - id: l1-c3
            type: fill_in_blank
            text: "Which letters are missing?"
            say: "Fair. Which letters are missing at the end of fair?"
            frame: "f_"
            options: ["ear", "ur", "air"]
            answer: ["air"]

  - n: 2
    title: { de: "ure und er", en: "ure and er" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which letters make the last sound?"
            say: "Listen to the word. Which letters make its last sound?"
            audio: { en: "Hear." }
            options: ["air", "ear", "er"]
            answer: "ear"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Which letters are missing?"
            say: "Hair. The hair on your head. Which letters are missing at the end of hair?"
            frame: "h_"
            options: ["ear", "a", "air"]
            answer: ["air"]
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "ure"
            say: "These three letters make one sound. Sure and pure end with it. Listen, then say it with me."
            show: { drawn: letter-card, text: "ure" }
            sound: en.ure
          - text: "er"
            say: "These two letters make a soft, short sound at the end of a word. Ladder, letter and farmer end with it. Listen, then say it with me."
            show: { drawn: letter-card, text: "er" }
            sound: en.er
          - text: "l a dd er → ladder"
            say: "Ladder has four sounds. The two letters the same make one sound, and so do the last two letters. Push the sounds together: ladder."
            show: { object: ladder }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which word ends with this sound?"
                say: "Look at the letters. Which word ends with their sound? Tap the picture."
                show: { drawn: letter-card, text: "er" }
                options: [{ object: lamp }, { object: ladder }, { object: leg }]
                answer: ladder
                hints:
                  - "Tap each picture and listen to the end."
                  - "Which word ends with a soft, short sound?"
                  - "Ladder ends with it. Tap the ladder."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which letters make the last sound?"
                say: "Listen to the word. Which letters make its last sound?"
                audio: { en: "Sure." }
                options: ["ur", "ure", "er"]
                answer: "ure"
                feedback:
                  "ur": "Those letters make the sound in fur. Sure ends with three letters that make one sound."
                hints:
                  - "Listen again to the end of sure."
                  - "It needs three letters."
                  - "Sure ends with three letters. Tap the three letters."
              - id: l2-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "farmer" }
                options: [{ object: fox }, { object: farmer }, { object: frog }]
                answer: farmer
                hints:
                  - "Say the sounds on the card, one by one."
                  - "Two letters make the long sound in car, and the last two make a soft sound."
                  - "The card says farmer. Tap the farmer."
              - id: l2-f4
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Ladder. Which letters are missing at the end of ladder?"
                show: { object: ladder }
                frame: "ladd_"
                options: ["ur", "er", "a"]
                answer: ["er"]
                feedback:
                  "ur": "Nearly! Those letters make the long sound in fur. The end of ladder is a soft, short sound."
                hints:
                  - "Say ladder slowly. Listen to the end."
                  - "A soft, short sound at the end of a word is often written like the end of farmer."
                  - "Ladder ends with the same two letters as farmer."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Pure." }
                options: ["pin", "pure", "pot"]
                answer: "pure"
                hints:
                  - "Listen to the end of the word."
                  - "It ends like sure."
                  - "The word is pure."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.er }
                options: ["ar", "er", "ear"]
                answer: "er"
                hints: ["It is soft and short, like the end of ladder."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Cure. A cure makes you well again. Which letters are missing at the end of cure?"
                frame: "c_"
                options: ["ur", "ure", "ear"]
                answer: ["ure"]
                hints: ["Cure ends like sure."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which word ends with this sound?"
                say: "Look at the letters. Which word ends with their sound? Tap the picture."
                show: { drawn: letter-card, text: "er" }
                options: [{ object: sock }, { object: sun }, { object: sticker }]
                answer: sticker
                hints: ["Listen for a soft, short sound at the end."]
              - id: l2-s4
                type: true_false
                text: "Does jumper end with er?"
                say: "Jumper. Does jumper end like ladder?"
                show: { object: jumper }
                answer: true
                hints: ["Say jumper slowly. Is the end soft and short?"]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Summer." }
                options: ["sun", "summer", "sum"]
                answer: "summer"
                hints: ["Listen for a soft sound at the end."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which letters make the last sound?"
                say: "Listen to the word. Which letters make its last sound?"
                audio: { en: "Hammer." }
                options: ["ure", "ar", "er"]
                answer: "er"
              - id: l2-n2
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Sure. Which letters are missing at the end of sure?"
                frame: "s_"
                options: ["er", "ure", "ur"]
                answer: ["ure"]
              - id: l2-n3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "ladder" }
                options: [{ object: lion }, { object: lamp }, { object: ladder }]
                answer: ladder
              - id: l2-n4
                type: true_false
                text: "Does chair end with ure?"
                say: "Chair. Does chair end like sure?"
                show: { object: chair }
                answer: false
              - id: l2-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Better." }
                options: ["bed", "bet", "better"]
                answer: "better"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Which letters make the last sound?"
            say: "Listen. Tap the letters for the last sound."
            audio: { en: "Clear." }
            options: ["ure", "ear", "er"]
            answer: "ear"
          - id: l2-c2
            type: image_multiple_choice
            text: "Which word ends with this sound?"
            say: "Which picture ends with the sound of these letters?"
            show: { drawn: letter-card, text: "er" }
            options: [{ object: tree }, { object: teacher }, { object: table }]
            answer: teacher
          - id: l2-c3
            type: fill_in_blank
            text: "Which letters are missing?"
            say: "Pure. Which letters are missing at the end of pure?"
            frame: "p_"
            options: ["ur", "er", "ure"]
            answer: ["ure"]
          - id: l2-c4
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Then tap its picture."
            show: { drawn: letter-card, text: "sticker" }
            options: [{ object: star }, { object: sticker }, { object: sock }]
            answer: sticker
          - id: l2-c5
            type: audio_choice
            text: "Which word do you hear?"
            say: "Listen. Tap the word you hear."
            audio: { en: "Stair." }
            options: ["steer", "star", "stair"]
            answer: "stair"
