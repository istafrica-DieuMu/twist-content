# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.retell
skill: lit-en.comprehension.retell
curriculum: en-GB
language: en
title:
  de: Eine Geschichte nacherzählen
  en: Retelling a story
summary: >
  Listening to a short story and telling it back in order, in the
  child's own words and with new words from the story. Lesson 1 tells
  Pip and the red ball (new words rolled and kind); lesson 2 tells Sam
  and the snowman (new word melted) and ends with the skill check on a
  short new story. Both stories are written for Twist and read aloud.
  The child picks who the story is about, puts pictures in story order
  and chooses the best retelling; telling it aloud is practised with
  speak tasks and not marked.
metadata:
  year: reception
  topic: { de: "Geschichten verstehen", en: "Understanding stories" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: []
  vocabulary: { en: [story, retell, first, then, next, in the end, rolled, kind, melted] }
  no_reading: true
  forms: [audio, picture, drawn]
  drawn: [colour-swatch]
  facets: []
  parts:
    - { id: who, what: { de: "sagen, von wem eine Geschichte handelt", en: saying who a story is about } }
    - { id: order, what: { de: die Ereignisse einer Geschichte ordnen, en: putting the events of a story in order } }
    - { id: details, what: { de: "wissen, was passiert ist (wo, was, wie sich jemand fühlte)", en: "remembering what happened (where, what, how someone felt)" } }
    - { id: retelling, what: { de: "die Nacherzählung wählen, die die ganze Geschichte mit ihren Wörtern erzählt", en: choosing the retelling that tells the whole story with its own words } }
  misconceptions:
    - id: side-character
      what: Names a character who only comes in briefly, or an object, as the one the story is about
      addressed: l1-f1 (with feedback), l1-c1, l2-f1 (with feedback) and the skill check tasks l2-c2, l2-c6, l2-c10 and l2-c18, where a brief character or an object is an option
    - id: events-out-of-order
      what: Retells the events in a jumble, or starts with the ending
      addressed: Learn in both lessons retells with first, then, next and in the end; ordering tasks l1-f2, l1-n1, l1-c2, l2-w2, l2-f2, l2-s3, l2-n2, l2-c1, l2-c7, l2-c11, l2-c15 and l2-c19
    - id: only-one-part
      what: Tells only one part of the story (often the end) as the whole retelling
      addressed: the child chooses the retelling that covers the whole story in l2-n5, l2-c4, l2-c13 and l2-c17; the speak tasks l1-n4 and l2-n4 retell the whole story
    - id: skips-new-words
      what: Retells without the story's new words, or does not know what they mean
      addressed: Learn explains rolled, kind and melted; l1-s5, l1-n5, l2-f5 (with feedback), the speak task l2-s4 and the skill check tasks l2-c9 and l2-c20
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Pip und der rote Ball", en: "Pip and the red ball" }
    goal:
      de: "Hör die Geschichte von Pip und dem roten Ball und erzähl sie der Reihe nach."
      en: "Listen to the story of Pip and the red ball, then tell it back in order."
    new_content: true
    activities:
      - activity: learn
        mode: model-text
        screens:
          - text: "Pip"
            say: "This is Pip the puppy. Pip has a red ball. What do you think: what could happen to Pip's ball? Have a guess, then listen to find out."
            show: { objects: [puppy, ball] }
          - text: "Listen."
            say: "You are going to hear a story. Sit still, look and listen right to the end. Then you can tell it back in your own words."
            show: { objects: [listen, quiet] }
          - text: "Pip and the red ball"
            say: "Pip the puppy had a red ball. First, Pip kicked the ball across the garden. Then the ball rolled under the fence. Pip was sad. Next, a kind cat pushed the ball back under the fence. In the end, Pip and the cat played together, and Pip was happy again."
            show: { object: puppy }
          - text: "First, then, next, in the end"
            say: "To retell a story, say what happened in order. First, Pip kicked the ball. Then it rolled under the fence. Next, the cat pushed it back. In the end, they played together. Rolled means it went round and round along the ground. Kind means the cat was nice and helpful."
            show: { object: ball }
          - text: "Did you know?"
            say: "Did you know? When puppies are born, their eyes are shut tight. They open them when they are about two weeks old. So a tiny puppy finds its mum by smell and by feeling warm!"
            show: { object: puppy }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Pip the puppy had a red ball. First, Pip kicked the ball across the garden. Then the ball rolled under the fence. Pip was sad. Next, a kind cat pushed the ball back. In the end, Pip and the cat played together. Who is the story about?"
                say: "Listen to the story again. Who is the story about?"
                audio: { en: "Pip the puppy had a red ball. First, Pip kicked the ball across the garden. Then the ball rolled under the fence. Pip was sad. Next, a kind cat pushed the ball back. In the end, Pip and the cat played together." }
                options: [{ object: cat }, { object: puppy }, { object: ball }]
                answer: puppy
                feedback:
                  cat: "The cat comes in near the end. Who is in the story from the start to the end?"
                hints:
                  - "Who is in the story all the way through?"
                  - "The story is about a puppy called Pip."
                  - "Pip is the puppy. Tap the puppy."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "First, Pip kicked the ball. Then it rolled under the fence. Next, the cat helped. Put the pictures in order."
                say: "Think about the story. First Pip kicked the ball. Then it rolled under the fence. Next the cat helped. Put the pictures in order."
                options: [{ object: cat }, { object: fence }, { object: ball }]
                slot_count: 3
                answer: [ball, fence, cat]
                hints:
                  - "What did Pip do first?"
                  - "First the ball, then where it went."
                  - "Ball, fence, cat."
              - id: l1-f3
                type: audio_choice
                text: "First, Pip kicked the ball across the garden. Then the ball rolled under the fence. Where did the ball go?"
                say: "Listen. Where did the ball go?"
                audio: { en: "First, Pip kicked the ball across the garden. Then the ball rolled under the fence." }
                options: [{ object: tree }, { object: house }, { object: fence }]
                answer: fence
                feedback:
                  tree: "A ball up a tree? Not this time! Listen for the word under."
                hints:
                  - "Listen for the word under."
                  - "The ball rolled under the ..."
                  - "The fence."
              - id: l1-f4
                type: speak
                text: "Tell the start of the story."
                say: "Tell the start of the story in your own words. Begin with First. For example: First, Pip kicked his red ball."
                show: { object: puppy }
                expected_text: "First, Pip kicked his red ball."
                hints:
                  - "Start with the word First."
                  - "What did Pip do with his ball?"
                  - "First, Pip kicked his red ball."
              - id: l1-f5
                type: image_multiple_choice
                text: "The ball rolled under the fence. How did Pip feel then?"
                say: "The ball rolled under the fence. How did Pip feel then? Tap the picture."
                options: [{ object: happy }, { object: sad }, { object: angry }]
                answer: sad
                hints:
                  - "Pip had lost his ball."
                  - "The story says how he felt."
                  - "Pip was sad."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Next, a kind cat pushed the ball back under the fence. Who helped Pip?"
                say: "Listen. Who helped Pip?"
                audio: { en: "Next, a kind cat pushed the ball back under the fence." }
                options: [{ object: rabbit }, { object: cat }, { object: dog }]
                answer: cat
                feedback:
                  rabbit: "There was no rabbit in the story. Listen again: who was kind to Pip?"
                hints: ["Listen for the word kind."]
              - id: l1-s2
                type: true_false
                text: "In the story, the ball rolled under the fence."
                say: "In the story, did the ball roll under the fence?"
                show: { object: fence }
                answer: true
                hints: ["Think about where the ball went after Pip kicked it."]
              - id: l1-s3
                type: image_multiple_choice
                text: "In the end, Pip and the cat played together. How did Pip feel?"
                say: "In the end, Pip and the cat played together. How did Pip feel? Tap the picture."
                options: [{ object: scared }, { object: sad }, { object: happy }]
                answer: happy
                hints: ["He had his ball back and a new friend."]
              - id: l1-s4
                type: speak
                text: "Tell the end of the story."
                say: "Tell the end of the story. Begin with In the end. For example: In the end, Pip and the cat played together."
                show: { object: cat }
                expected_text: "In the end, Pip and the cat played together."
                hints: ["Who played together at the end?"]
              - id: l1-s5
                type: multiple_choice
                text: "The ball rolled under the fence. What does rolled mean?"
                say: "The ball rolled under the fence. What does rolled mean?"
                options: ["it went round and round along the ground", "it flew up into the sky", "it sat still"]
                answer: "it went round and round along the ground"
                hints: ["Think of a ball moving along the grass."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Put the pictures in order."
                say: "Think about how Pip felt, and who helped him. Put the pictures in order."
                options: [{ object: happy }, { object: sad }, { object: cat }]
                slot_count: 3
                answer: [sad, cat, happy]
              - id: l1-n2
                type: audio_choice
                text: "Pip the puppy had a red ball. What colour was the ball?"
                say: "Listen. What colour was Pip's ball?"
                audio: { en: "Pip the puppy had a red ball." }
                options:
                  - { drawn: colour-swatch, colour: blue }
                  - { drawn: colour-swatch, colour: red }
                  - { drawn: colour-swatch, colour: yellow }
                answer: red
              - id: l1-n3
                type: true_false
                text: "In the story, the cat was unkind to Pip."
                say: "In the story, was the cat unkind to Pip?"
                show: { object: cat }
                answer: false
              - id: l1-n4
                type: speak
                text: "Tell the whole story."
                say: "Now tell the whole story of Pip and the red ball. Use first, then, next and in the end."
                show: { object: ball }
                expected_text: "First, Pip kicked the ball. Then it rolled under the fence. Next, a kind cat pushed it back. In the end, Pip and the cat played together."
              - id: l1-n5
                type: multiple_choice
                text: "Which word fits?"
                say: "Which word from the story tells us the cat was nice and helpful?"
                options: ["grumpy", "kind", "sleepy"]
                answer: "kind"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Pip the puppy had a red ball. He kicked it, and it rolled under the fence. A cat pushed it back, and they played together. Who is the story about?"
            say: "Listen. Who is the story about?"
            audio: { en: "Pip the puppy had a red ball. He kicked it, and it rolled under the fence. A cat pushed it back, and they played together." }
            options: [{ object: puppy }, { object: fence }, { object: cat }]
            answer: puppy
          - id: l1-c2
            type: ordering
            text: "Put the pictures in order."
            say: "Think about the story of Pip and the red ball. Put the pictures in order."
            options: [{ object: happy }, { object: ball }, { object: cat }]
            slot_count: 3
            answer: [ball, cat, happy]
          - id: l1-c3
            type: true_false
            text: "Pip got the ball back all by himself."
            say: "Did Pip get the ball back all by himself?"
            show: { object: puppy }
            answer: false
          - id: l1-c4
            type: audio_choice
            text: "Pip the puppy had a red ball. What did Pip have?"
            say: "Listen. What did Pip have? Tap the picture."
            audio: { en: "Pip the puppy had a red ball." }
            options: [{ object: kite }, { object: ball }, { object: book }]
            answer: ball
          - id: l1-c5
            type: true_false
            text: "In the end, Pip and the cat played together."
            say: "In the end, did Pip and the cat play together?"
            show: { object: cat }
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Which word from the story tells us how the ball went under the fence?"
            say: "Which word from the story tells us how the ball went under the fence?"
            options: ["flew", "rolled", "jumped"]
            answer: "rolled"

  - n: 2
    title: { de: "Sam und der Schneemann", en: "Sam and the snowman" }
    goal:
      de: "Erzähl die Schneemann-Geschichte der Reihe nach, mit Wörtern aus der Geschichte wie rolled und melted."
      en: "Tell the snowman story in order, with words from the story like rolled and melted."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Next, a kind cat pushed the ball back under the fence. Who helped Pip?"
            say: "Remember the story of Pip. Listen. Who helped Pip get his ball back?"
            audio: { en: "Next, a kind cat pushed the ball back under the fence." }
            options: [{ object: mouse }, { object: rabbit }, { object: cat }]
            answer: cat
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "First, Pip kicked the ball. Then he was sad. In the end, he was happy. Put the pictures in order."
            say: "Remember Pip. First he kicked the ball. Then he was sad. In the end he was happy. Put the pictures in order."
            options: [{ object: happy }, { object: ball }, { object: sad }]
            slot_count: 3
            answer: [ball, sad, happy]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Snow!"
            say: "In the night, lots of snow fell. What do you think: what could you make with lots and lots of snow? Have a guess, then listen to the story."
            show: { object: snow }
          - text: "Sam and the snowman"
            say: "In the night, snow fell. First, Sam put on his wellies and his woolly hat. Then he rolled a big ball of snow. Next, he made a snowman and gave it a carrot for a nose. In the end, the sun came out and the snowman melted away. Sam smiled. He would make another one tomorrow."
            show: { object: snowman }
          - text: "melted"
            say: "Melted means it turned into water because it got warm. The warm sun melted the snowman."
            show: { object: sun }
          - text: "First, then, next, in the end"
            say: "When you retell a story, use the story's own words, like rolled and melted. And tell it in order, right to the end."
            show: { object: snow }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "First, Sam put on his wellies and his woolly hat. Then he rolled a big ball of snow. Next, he made a snowman. In the end, the sun came out and the snowman melted. Who is the story about?"
                say: "Listen. Who is the story about?"
                audio: { en: "First, Sam put on his wellies and his woolly hat. Then he rolled a big ball of snow. Next, he made a snowman. In the end, the sun came out and the snowman melted." }
                options: [{ object: snowman }, { object: boy }, { object: girl }]
                answer: boy
                feedback:
                  snowman: "Sam makes the snowman. Who does all the things in the story?"
                hints:
                  - "Who puts on wellies and rolls the snow?"
                  - "His name is Sam."
                  - "Sam is a boy. Tap the boy."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Sam got dressed, made a snowman, and then the sun came out. Put the pictures in order."
                say: "Think about the story. Sam got dressed, made a snowman, and then the sun came out. Put the pictures in order."
                options: [{ object: sun }, { object: wellies }, { object: snowman }]
                slot_count: 3
                answer: [wellies, snowman, sun]
                hints:
                  - "What did Sam do before he went out?"
                  - "First the wellies. What did he make next?"
                  - "Wellies, snowman, sun."
              - id: l2-f3
                type: audio_choice
                text: "Next, Sam made a snowman and gave it a carrot for a nose. What was the nose?"
                say: "Listen. What did Sam give the snowman for a nose?"
                audio: { en: "Next, he made a snowman and gave it a carrot for a nose." }
                options: [{ object: banana }, { object: carrot }, { object: apple }]
                answer: carrot
                feedback:
                  banana: "A banana nose! That would look very silly. Listen again for the nose."
                hints:
                  - "Listen for the word nose."
                  - "It is orange and long."
                  - "A carrot."
              - id: l2-f4
                type: speak
                text: "Tell what Sam did first."
                say: "Tell what Sam did first. For example: First, Sam put on his wellies and his woolly hat."
                show: { object: wellies }
                expected_text: "First, Sam put on his wellies and his woolly hat."
                hints:
                  - "Start with First."
                  - "What did Sam put on his feet and his head?"
                  - "First, Sam put on his wellies and his woolly hat."
              - id: l2-f5
                type: multiple_choice
                text: "The snowman melted. What does melted mean?"
                say: "The snowman melted. What does melted mean?"
                options: ["it got bigger", "it turned into water", "it fell over"]
                answer: "it turned into water"
                feedback:
                  "it fell over": "Not quite. The sun made the snowman warm, so it turned into water."
                hints:
                  - "What does the sun do to snow?"
                  - "Warm snow changes into something wet."
                  - "It turned into water."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "First, Sam put on his wellies and his woolly hat. What did Sam put on his feet?"
                say: "Listen. What did Sam put on his feet?"
                audio: { en: "First, Sam put on his wellies and his woolly hat." }
                options: [{ object: t-shirt }, { object: wellies }, { object: glasses }]
                answer: wellies
                feedback:
                  glasses: "Glasses on your feet? That would be silly! Listen again: what did he put on his feet?"
                hints: ["You wear them in snow and puddles."]
              - id: l2-s2
                type: true_false
                text: "In the end, the snowman melted."
                say: "In the end, did the snowman melt?"
                show: { object: snowman }
                answer: true
                hints: ["What happened when the sun came out?"]
              - id: l2-s3
                type: ordering
                text: "Snow fell in the night. Sam made a snowman. Then the sun came out. Put the pictures in order."
                say: "Snow fell in the night. Sam made a snowman. Then the sun came out. Put the pictures in order."
                options: [{ object: snowman }, { object: sun }, { object: snow }]
                slot_count: 3
                answer: [snow, snowman, sun]
                hints: ["What happened in the night, before Sam went out?"]
              - id: l2-s4
                type: speak
                text: "Tell the end of the story."
                say: "Tell the end of the story. Use the word melted. For example: In the end, the sun came out and the snowman melted."
                show: { object: sun }
                expected_text: "In the end, the sun came out and the snowman melted."
                hints: ["Start with In the end."]
              - id: l2-s5
                type: image_multiple_choice
                text: "At the end, Sam smiled. How did Sam feel?"
                say: "At the end, Sam smiled. How did Sam feel? Tap the picture."
                options: [{ object: angry }, { object: happy }, { object: scared }]
                answer: happy
                hints: ["People smile when they feel ..."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "In the end, the sun came out and the snowman melted away. What melted the snowman?"
                say: "Listen. What made the snowman melt?"
                audio: { en: "In the end, the sun came out and the snowman melted away." }
                options: [{ object: rain }, { object: sun }, { object: wind }]
                answer: sun
              - id: l2-n2
                type: ordering
                text: "Put the pictures in order."
                say: "Put the four pictures in the order of the story of Sam and the snowman."
                options: [{ object: carrot }, { object: sun }, { object: woolly-hat }, { object: snowman }]
                slot_count: 4
                answer: [woolly-hat, snowman, carrot, sun]
              - id: l2-n3
                type: true_false
                text: "Sam made the snowman before the snow fell."
                say: "Did Sam make the snowman before the snow fell?"
                show: { object: snow }
                answer: false
              - id: l2-n4
                type: speak
                text: "Tell the whole story."
                say: "Now tell the whole story of Sam and the snowman. Use first, then, next and in the end."
                show: { object: snowman }
                expected_text: "First, Sam put on his wellies. Then he rolled a big ball of snow. Next, he made a snowman with a carrot nose. In the end, the sun came out and the snowman melted."
              - id: l2-n5
                type: multiple_choice
                text: "Which is the best retelling?"
                say: "Which one tells the whole story of Sam best?"
                options: ["In the end, the snowman melted.", "Sam put on his wellies, made a snowman, and then the sun melted it.", "Sam likes ice cream."]
                answer: "Sam put on his wellies, made a snowman, and then the sun melted it."

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: order
            type: ordering
            text: "Mia went into the garden and planted a seed. Every day, she gave it water. Soon, a big flower grew. Put the pictures in order."
            say: "Listen to a new story. Mia went into the garden and planted a seed. Every day, she gave it water. Soon, a big flower grew. Put the pictures in order."
            options: [{ object: flower }, { object: water }, { object: garden }]
            slot_count: 3
            answer: [garden, water, flower]
          - id: l2-c2
            part: who
            type: audio_choice
            text: "Grandpa took Leo to the park. They fed the ducks on the pond. Then they had an ice cream on the bench. Who took Leo to the park?"
            say: "Listen to a new story. Who took Leo to the park?"
            audio: { en: "Grandpa took Leo to the park. They fed the ducks on the pond. Then they had an ice cream on the bench." }
            options: [{ object: grandma }, { object: dad }, { object: grandpa }]
            answer: grandpa
          - id: l2-c3
            part: details
            type: audio_choice
            text: "Grandpa took Leo to the park. They fed the ducks on the pond. Then they had an ice cream on the bench. What did they have at the end?"
            say: "Listen to a story. What did Leo and Grandpa have at the end?"
            audio: { en: "Grandpa took Leo to the park. They fed the ducks on the pond. Then they had an ice cream on the bench." }
            options: [{ object: ice-cream }, { object: cake }, { object: pizza }]
            answer: ice-cream
          - id: l2-c4
            part: retelling
            type: multiple_choice
            text: "Tom made a cake with Mum. They put it in the oven. Then they ate it with Grandma. Which is the best retelling?"
            say: "Listen to a new story. Tom made a cake with Mum. They put it in the oven. Then they ate it with Grandma. Which one tells the whole story best?"
            options: ["They ate the cake.", "Tom went to the shop.", "Tom and Mum made a cake, baked it in the oven, then ate it with Grandma."]
            answer: "Tom and Mum made a cake, baked it in the oven, then ate it with Grandma."
          - id: l2-c5
            part: details
            type: true_false
            text: "Kim took her teddy to the beach. The teddy fell in the sea! Mum washed it and dried it in the sun. The teddy fell in the bath."
            say: "Listen to a new story. Kim took her teddy to the beach. The teddy fell in the sea! Mum washed it and dried it in the sun. Did the teddy fall in the bath?"
            show: { object: teddy }
            answer: false
          - id: l2-c6
            part: who
            type: audio_choice
            text: "Ollie the owl could not sleep. He counted the stars. He listened to the wind. At last, the sun came up, and Ollie fell fast asleep. Who is the story about?"
            say: "Listen to a new story. Who is the story about?"
            audio: { en: "Ollie the owl could not sleep. He counted the stars. He listened to the wind. At last, the sun came up, and Ollie fell fast asleep." }
            options: [{ object: star }, { object: owl }, { object: sun }]
            answer: owl
          - id: l2-c7
            part: order
            type: ordering
            text: "Raj got up and put on his jumper. He ate his breakfast. Then he went to school. Put the pictures in order."
            say: "Listen to a new story. Raj got up and put on his jumper. He ate his breakfast. Then he went to school. Put the pictures in order."
            options: [{ object: school }, { object: jumper }, { object: cereal-box }]
            slot_count: 3
            answer: [jumper, cereal-box, school]
          - id: l2-c8
            part: details
            type: audio_choice
            text: "Max and Grandpa went fishing. Max caught a tiny fish. Grandpa caught an old welly! They laughed all the way home. What did Grandpa catch?"
            say: "Listen to a new story. What did Grandpa catch?"
