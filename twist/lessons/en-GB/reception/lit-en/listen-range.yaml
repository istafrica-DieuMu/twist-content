# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.listen-range
skill: lit-en.texts.listen-range
curriculum: en-GB
language: en
title:
  de: Geschichten, Gedichte und Sachbücher hören
  en: Listening to stories, poems and information books
summary: >
  Enjoying stories, poems and information books read aloud, and talking
  about them. Lesson 1 listens to short poems and stories and tells them
  apart; lesson 2 listens to information books about animals, talks
  about new facts and ends with the skill check. All the texts are short
  and written for Twist. The child answers with pictures and spoken
  choices; talking about what they liked runs as speak tasks, practised
  and not marked.
metadata:
  year: reception
  topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: []
  vocabulary: { en: [story, poem, rhyme, information book, fact, once upon a time, favourite] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: text-kinds-mixed
      what: Cannot tell a story, a poem and an information book apart
      addressed: Learn in both lessons says what each kind does (characters and events, rhyme and rhythm, true facts); the child names the kind in l1-f3, l1-s2, l1-n2, l1-c1, l2-w1, l2-s3 and the skill check tasks l2-c1 and l2-c2
    - id: stops-listening
      what: Answers from the first words heard and misses what comes later
      addressed: the answer comes late in the text in l1-s1, l1-n5, l2-f1 (with feedback), l2-n1 and l2-c3
    - id: pretend-as-fact
      what: Thinks an information book can tell made-up things (hedgehogs with fur, cows on the moon)
      addressed: Learn in lesson 2 says information books tell true facts; l2-f2, l2-f5, l2-n2, l2-n5 and l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gedichte und Geschichten", en: "Poems and stories" }
    new_content: true
    activities:
      - activity: learn
        mode: model-text
        screens:
          - text: "Books"
            say: "Books can tell us a story. Some books are full of poems. Some books tell us true facts. Let's listen to some."
            show: { object: book-open }
          - text: "A poem"
            say: "Here is a poem. Listen for words that rhyme. Splish, splash, the rain comes down, on the roofs all over town. Pitter, patter, on the ground, what a lovely, wet sound! Down and town rhyme. Ground and sound rhyme."
            show: { object: rain }
          - text: "A story"
            say: "Here is a story. A story has characters and things that happen. Once upon a time, a little fox got lost in the snow. A kind owl flew down and showed him the way home. The fox said thank you, and they became friends."
            show: { object: fox }
          - text: "Talk about it"
            say: "After you listen, talk about it. What did you like? Who was in it? Did it remind you of anything? I liked the rain poem because the words sound like rain."
            show: { objects: [listen, happy] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What is the poem about?"
                say: "Listen to the poem. What is it about?"
                audio: { en: "Splish, splash, the rain comes down, on the roofs all over town. Pitter, patter, on the ground, what a lovely, wet sound!" }
                options: [{ object: sun }, { object: rain }, { object: snow }]
                answer: rain
                hints:
                  - "Listen to the sounds: splish, splash, pitter, patter."
                  - "What comes down on the roofs?"
                  - "The rain."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Where is the goat?"
                say: "Listen to the poem. Where is the goat?"
                audio: { en: "A goat in a boat sailed down the stream. A bee in a tree had a lovely dream." }
                options: [{ object: bus }, { object: boat }, { object: bed }]
                answer: boat
                hints:
                  - "Listen to the first line."
                  - "The place where the goat is rhymes with goat."
                  - "A goat in a boat."
              - id: l1-f3
                type: multiple_choice
                text: "Story, poem or facts?"
                say: "Listen. Hedgehogs sleep all winter. They eat worms and beetles. Is that from a story, a poem or a book of facts?"
                options: ["a story", "a poem", "a book of facts"]
                answer: "a book of facts"
                keep_order: true
                hints:
                  - "Is it made up, or is it true?"
                  - "It tells us true things about hedgehogs."
                  - "A book of facts."
              - id: l1-f4
                type: speak
                text: "What did you like?"
                say: "What did you like about the rain poem? Say it in a sentence. For example: I liked the splish splash because it sounds like rain."
                show: { object: rain }
                expected_text: "I liked the splish splash because it sounds like rain."
                hints:
                  - "Start with I liked."
                  - "Then say because, and why."
                  - "I liked the splish splash because it sounds like rain."
              - id: l1-f5
                type: image_multiple_choice
                text: "Who was lost?"
                say: "Think about the story. Once upon a time, someone got lost in the snow. Who was it?"
                options: [{ object: dog }, { object: fox }, { object: cat }]
                answer: fox
                hints:
                  - "The story was about a little animal."
                  - "A kind owl showed him the way home."
                  - "The fox."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Where is the bee?"
                say: "Listen to the poem again. Where is the bee?"
                audio: { en: "A goat in a boat sailed down the stream. A bee in a tree had a lovely dream." }
                options: [{ object: house }, { object: tree }, { object: car }]
                answer: tree
                hints: ["Listen to the end. The place where the bee is rhymes with bee."]
              - id: l1-s2
                type: multiple_choice
                text: "Story, poem or facts?"
                say: "Listen. Once upon a time, a girl called Rosa found a magic shell on the beach. When she held it to her ear, it sang a song. Is that from a story, a poem or a book of facts?"
                options: ["a story", "a poem", "a book of facts"]
                answer: "a story"
                keep_order: true
                hints: ["How did it start? Could a shell really sing?"]
              - id: l1-s3
                type: true_false
                text: "Poems often have words that rhyme, like goat and boat."
                say: "Poems often have words that rhyme, like goat and boat. Is that right?"
                show: { object: goat }
                answer: true
                hints: ["Think of the goat in a boat."]
              - id: l1-s4
                type: speak
                text: "Your favourite book"
                say: "Tell me about a book you love. For example: My favourite book is about a dragon."
                show: { object: book-open }
                expected_text: "My favourite book is about a dragon."
                hints: ["Start with My favourite book is about."]
              - id: l1-s5
                type: image_multiple_choice
                text: "What is the poem about?"
                say: "Listen. Up in the sky, so high, so far, shines a little silver star. Which picture goes with the poem?"
                options: [{ object: car }, { object: sun }, { object: star }]
                answer: star
                hints: ["What shines up in the sky in the poem?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What is the poem about?"
                say: "Listen to the poem. What is it about?"
                audio: { en: "My teddy bear is soft and brown. He comes with me all over town. At night he sleeps upon my bed, and snuggles by my sleepy head." }
                options: [{ object: bed }, { object: teddy }, { object: house }]
                answer: teddy
              - id: l1-n2
                type: multiple_choice
                text: "Story, poem or facts?"
                say: "Listen. Cows eat grass. A baby cow is called a calf. Is that from a story, a poem or a book of facts?"
                options: ["a story", "a poem", "a book of facts"]
                answer: "a book of facts"
                keep_order: true
              - id: l1-n3
                type: true_false
                text: "A book of facts always starts with once upon a time."
                say: "A book of facts always starts with once upon a time. Is that right?"
                show: { object: book-open }
                answer: false
              - id: l1-n4
                type: speak
                text: "Join in!"
                say: "Join in with the poem. Say: Splish, splash, the rain comes down."
                show: { object: rain }
                expected_text: "Splish, splash, the rain comes down."
              - id: l1-n5
                type: image_multiple_choice
                text: "What did the shell do?"
                say: "Listen. Rosa found a shell on the beach. She looked at it. Then she held it to her ear, and it sang a song. What did the shell do?"
                options: [{ object: jump }, { object: swim }, { object: sing }]
                answer: sing

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Story, poem or facts?"
            say: "Listen. Pitter, patter, raindrops fall, on the window, on the wall. Is that from a story, a poem or a book of facts?"
            options: ["a story", "a poem", "a book of facts"]
            answer: "a poem"
            keep_order: true
          - id: l1-c2
            type: audio_choice
            text: "Who is in the pen?"
            say: "Listen to the poem. Who is in the pen?"
            audio: { en: "A little brown hen sat in her pen. She counted her eggs, from one up to ten." }
            options: [{ object: cow }, { object: hen }, { object: pig }]
            answer: hen
          - id: l1-c3
            type: true_false
            text: "In the poem, the bee in the tree had a lovely dream."
            say: "In the poem, the bee in the tree had a lovely dream. Is that right?"
            show: { object: bee }
            answer: true

  - n: 2
    title: { de: "Sachbücher über Tiere", en: "Information books about animals" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Story, poem or facts?"
            say: "Listen. Once upon a time, a little mouse wanted to fly. Is that from a story, a poem or a book of facts?"
            options: ["a story", "a poem", "a book of facts"]
            answer: "a story"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "What shines in the sky?"
            say: "Listen to the poem. What shines in the sky?"
            audio: { en: "Up in the sky, so high, so far, shines a little silver star." }
            options: [{ object: star }, { object: car }, { object: sun }]
            answer: star
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "A book of facts"
            say: "Some books tell us true facts about the world. We call them information books. They are not made up, and they often have photos and labels."
            show: { object: book-open }
          - text: "Hedgehogs"
            say: "Hedgehogs. Hedgehogs have prickly spines on their backs. They come out at night to find food. They eat worms, slugs and beetles. In winter, they curl up and sleep for a long time."
            show: { object: hedgehog }
          - text: "Bees"
            say: "Bees. Bees fly from flower to flower. They use the flowers to make honey. A bee has six legs and four wings."
            show: { object: bee }
          - text: "Talk about it"
            say: "After an information book, talk about what you learned. For example: I learned that hedgehogs sleep all winter."
            show: { objects: [hedgehog, bee] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "When do hedgehogs find food?"
                say: "Listen. When do hedgehogs come out to find food?"
                audio: { en: "Hedgehogs sleep in a nest of leaves in the day. They come out at night to find food." }
                options: [{ object: sun }, { object: moon }]
                answer: moon
                feedback:
                  sun: "In the day they sleep. Listen to the end: they come out at night."
                hints:
                  - "Listen right to the end."
                  - "They sleep in the day. Then when do they come out?"
                  - "At night, when the moon is out."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Hedgehogs have soft fur all over their backs."
                say: "Hedgehogs have soft fur all over their backs. Is that true?"
                show: { object: hedgehog }
                answer: false
                hints:
                  - "What did the book say is on their backs?"
                  - "They are prickly."
                  - "No. Hedgehogs have prickly spines."
              - id: l2-f3
                type: audio_choice
                text: "Where do bees fly?"
                say: "Listen. Where do bees fly?"
                audio: { en: "Bees fly from flower to flower. They use the flowers to make honey." }
                options: [{ object: oven }, { object: flower }, { object: car }]
                answer: flower
                hints:
                  - "Listen to the first part."
                  - "Bees fly from ... to ..."
                  - "From flower to flower."
              - id: l2-f4
                type: speak
                text: "What did you learn?"
                say: "Tell a new fact you learned. For example: I learned that hedgehogs sleep all winter."
                show: { object: hedgehog }
                expected_text: "I learned that hedgehogs sleep all winter."
                hints:
                  - "Start with I learned that."
                  - "Think about hedgehogs or bees."
                  - "I learned that hedgehogs sleep all winter."
              - id: l2-f5
                type: multiple_choice
                text: "Which one is a fact?"
                say: "Which one is a true fact about hedgehogs?"
                options: ["Hedgehogs can fly.", "Hedgehogs sleep in winter.", "Hedgehogs wear hats."]
                answer: "Hedgehogs sleep in winter."
                hints:
                  - "A fact is true."
                  - "Could a hedgehog really fly or wear a hat?"
                  - "Hedgehogs sleep in winter."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "What do cows give us?"
                say: "Listen. What do cows give us?"
                audio: { en: "Cows live on farms. They eat grass all day. Cows give us milk." }
                options: [{ object: juice }, { object: water }, { object: milk }]
                answer: milk
                hints: ["Listen to the last part."]
              - id: l2-s2
                type: true_false
                text: "A bee has six legs."
                say: "A bee has six legs. Is that true?"
                show: { object: bee }
                answer: true
                hints: ["What did the book about bees say?"]
              - id: l2-s3
                type: multiple_choice
                text: "Story, poem or facts?"
                say: "Listen. Frogs lay their eggs in ponds. The eggs are called frogspawn. Is that from a story, a poem or a book of facts?"
                options: ["a story", "a poem", "a book of facts"]
                answer: "a book of facts"
                keep_order: true
                hints: ["Is it true, or made up?"]
              - id: l2-s4
                type: speak
                text: "Which do you like best?"
                say: "Which do you like best: stories, poems or books of facts? For example: I like stories best because they are exciting."
                show: { object: book-open }
                expected_text: "I like stories best because they are exciting."
                hints: ["Start with I like, and say because."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Which animal is it?"
                say: "Listen. This animal is very big and grey. It has a long trunk and big flappy ears. Which animal is it?"
                options: [{ object: mouse }, { object: elephant }, { object: giraffe }]
                answer: elephant
                hints: ["Which animal has a trunk?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "What do giraffes eat?"
                say: "Listen. What do giraffes eat?"
                audio: { en: "Giraffes are the tallest animals in the world. They have very long necks, so they can reach the leaves at the top of trees." }
                options: [{ object: fish }, { object: cheese }, { object: leaf }]
                answer: leaf
              - id: l2-n2
                type: true_false
                text: "In winter, hedgehogs go to the beach."
                say: "In winter, hedgehogs go to the beach. Is that true?"
                show: { object: hedgehog }
                answer: false
              - id: l2-n3
                type: image_multiple_choice
                text: "Which animal is it?"
                say: "Listen. This animal lives in the sea. It is the biggest animal in the whole world. Which animal is it?"
                options: [{ object: fish }, { object: octopus }, { object: whale }]
                answer: whale
              - id: l2-n4
                type: speak
                text: "Tell a friend"
                say: "Tell a friend about an animal you learned about today. For example: Bees fly from flower to flower."
                show: { object: bee }
                expected_text: "Bees fly from flower to flower."
              - id: l2-n5
                type: multiple_choice
                text: "Which one is a fact?"
                say: "Which one is a true fact about cows?"
                options: ["Cows live on the moon.", "Cows can sing songs.", "Cows give us milk."]
                answer: "Cows give us milk."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Story, poem or facts?"
            say: "Listen. Snails carry their shells on their backs. They move very slowly. Is that from a story, a poem or a book of facts?"
            options: ["a story", "a poem", "a book of facts"]
            answer: "a book of facts"
            keep_order: true
          - id: l2-c2
            type: multiple_choice
            text: "Story, poem or facts?"
            say: "Listen. Hop, hop, hop, Rabbit will not stop! Hop, hop, hop, all the way to the top! Is that from a story, a poem or a book of facts?"
            options: ["a story", "a poem", "a book of facts"]
            answer: "a poem"
            keep_order: true
          - id: l2-c3
            type: audio_choice
            text: "When do snails come out?"
            say: "Listen. When do snails like to come out?"
            audio: { en: "Snails do not like hot, dry days. They hide under stones. They like to come out after it rains." }
            options: [{ object: sun }, { object: snow }, { object: rain }]
            answer: rain
          - id: l2-c4
            type: audio_choice
            text: "Who helped the crocodile?"
            say: "Listen to the story. Who helped the little crocodile?"
            audio: { en: "Once upon a time, a little crocodile was scared of the water. Her friend the duck swam beside her. In the end, she swam all the way across the river." }
            options: [{ object: frog }, { object: duck }, { object: fish }]
            answer: duck
          - id: l2-c5
            type: true_false
            text: "Information books tell us made-up stories about dragons."
            say: "Information books tell us made-up stories about dragons. Is that right?"
            show: { object: book-open }
            answer: false
