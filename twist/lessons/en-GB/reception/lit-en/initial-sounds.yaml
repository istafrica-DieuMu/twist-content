              - id: l2-s3
                type: image_multiple_choice
                text: "Which one starts differently?"
                say: "Two of these start the same and one doesn't. Which one starts differently?"
                options: [{ object: sock }, { object: shell }, { object: sun }]
                answer: shell
                hints: ["Listen carefully for a hiss and a hush."]
              - id: l2-s4
                type: true_false
                text: "Do they start the same?"
                say: "Goat, giraffe. Do they start with the same sound?"
                show: { objects: [goat, giraffe] }
                answer: false
                hints: ["Giraffe starts like jam. What about goat?"]
              - id: l2-s5
                type: image_multiple_choice
                text: "What starts like rabbit?"
                say: "Rabbit. What starts the same as rabbit?"
                show: { object: rabbit }
                options: [{ object: rose }, { object: leaf }, { object: egg }]
                answer: rose
                hints: ["Rabbit starts with a growly sound, like a dog."]

          - support: none
            tasks:
