                  - "Hat starts with a breath. Which other word does too?"
                  - "Hat, house. Lamp, lion. Table, telephone."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "What starts the same?"
                say: "Tap a picture, then tap the picture that starts with the same sound."
                pairs:
                  - left: { object: moon }
                    right: { object: mouth }
                  - left: { object: dog }
                    right: { object: duck }
