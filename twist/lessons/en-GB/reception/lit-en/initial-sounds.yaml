# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.initial-sounds
skill: lit-en.phonological.initial-sounds
curriculum: en-GB
language: en
title:
  de: Anlaute hören
  en: Hearing first sounds
summary: >
  Children hear the first sound in a word (sun starts with sss) and find
  words that start with the same sound, ready for phonics. No letters yet:
  the sounds are spoken and every picture says its word. Lesson 1 listens
  for one sound at a time; lesson 2 pairs and sorts words by their first
  sound, finds the one that starts differently, and ends with the skill
  check.
metadata:
  year: reception
  topic: { de: Laute hören, en: Hearing sounds }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: [lit-en.phonological.syllables]
  vocabulary: { en: [first sound, start, the same, different] }
  no_reading: true
  forms: [picture, audio]
  drawn: []
  sounds: [en.s, en.m, en.f, en.h, en.p, en.t, en.b, en.d, en.r]
  facets: []
  parts:
    - { id: hear-sound, what: { de: "hören, ob ein Wort mit einem Laut anfängt", en: hearing whether a word starts with a sound } }
    - { id: find-sound, what: { de: "das Bild finden, das mit einem Laut anfängt", en: finding the picture that starts with a sound } }
    - { id: same-start, what: { de: Wörter mit demselben Anfangslaut finden, en: finding words that start with the same sound } }
    - { id: odd-one, what: { de: "das Wort finden, das anders anfängt", en: finding the word that starts differently } }
  misconceptions:
    - id: letter-name
      what: Says the letter name (ess, em) instead of the sound
      addressed: every sound on its own is played from the sound bank, never as a name; hints describe the sound (a hiss like a snake, a hum with closed lips) or link it to a word that starts with it
    - id: s-sh
      what: Mixes up s and sh (sock, shoe)
      addressed: both lessons set s words against sh words
    - id: end-sound
      what: Listens to the end of the word as in rhyming
      addressed: Learn contrasts the two ("For rhymes we listen to the end. Now we listen to the start.")
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Der erste Laut, en: The first sound }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "For rhymes we listen to the end of a word. Now we listen to the start. Sun. Here is its first sound. It hisses like a snake."
            show: { object: sun }
            sound: en.s
          - say: "Moon. Here is its first sound. Your lips stay closed and you hum."
            show: { object: moon }
            sound: en.m
          - say: "Fish. Here is its first sound. Say fish slowly and stretch the first sound, and you will hear it."
            show: { object: fish }
            sound: en.f

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Does it start with this sound?"
                say: "Sock. Does sock start with this sound? Listen."
                audio: { sound: en.s }
                show: { object: sock }
                answer: true
                hints:
                  - "Say the word and stretch the first sound."
                  - "Say sock slowly. Does it start with a hiss, like a snake?"
                  - "Yes, sock starts with this sound."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What starts with this sound?"
                say: "Listen to the sound. What starts with it? Tap the picture."
                audio: { sound: en.m }
                options: [{ object: ball }, { object: mouse }, { object: fish }]
                answer: mouse
                feedback:
                  ball: "Ball starts with a pop of your lips. Listen to the sound again."
                  fish: "Fish starts with a soft blow, like blowing out a candle. Listen to the sound again."
                hints:
                  - "Tap the pictures and listen to the words."
                  - "This sound is a hum, with your lips closed."
                  - "Mouse starts with this sound."
              - id: l1-f3
                type: true_false
                text: "Does it start with this sound?"
                say: "Hat. Does hat start with this sound? Listen."
                audio: { sound: en.f }
                show: { object: hat }
                answer: false
                hints:
                  - "Say the word slowly."
                  - "Hat starts with a breath, like on a cold window."
                  - "No, hat starts with a different sound."
              - id: l1-f4
                type: image_multiple_choice
                text: "What starts like sun?"
                say: "Sun. What starts the same as sun?"
                show: { object: sun }
                options: [{ object: shoe }, { object: snail }, { object: moon }]
                answer: snail
                feedback:
                  shoe: "Shoe starts with a hush, like when we say be quiet. Sun starts with a hiss, like a snake. They sound close, but they are different."
                hints:
                  - "Sun starts with a hiss, like a snake."
                  - "Listen: shoe, snail, moon."
                  - "Snail starts with the same hiss as sun."
              - id: l1-f5
                type: true_false
                text: "Do they start the same?"
                say: "Fish, frog. Do they start with the same sound?"
                show: { objects: [fish, frog] }
                answer: true
                hints:
                  - "Listen only to the first sound."
                  - "Say fish slowly, then frog slowly."
                  - "Yes, both start with the same sound."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Does it start with this sound?"
                say: "Monkey. Does monkey start with this sound? Listen."
                audio: { sound: en.m }
                show: { object: monkey }
                answer: true
                hints: ["Say monkey slowly and stretch the first sound."]
              - id: l1-s2
                type: image_multiple_choice
                text: "What starts with this sound?"
                say: "Listen to the sound. What starts with it? Tap the picture."
                audio: { sound: en.s }
                options: [{ object: shell }, { object: star }, { object: fish }]
                answer: star
                hints: ["Shell starts with a hush, not a hiss. Listen carefully."]
              - id: l1-s3
                type: true_false
                text: "Do they start the same?"
                say: "Ball, bus. Do they start with the same sound?"
                show: { objects: [ball, bus] }
                answer: true
                hints: ["Listen only to the start."]
              - id: l1-s4
                type: image_multiple_choice
                text: "What starts like lion?"
                say: "Lion. What starts the same as lion?"
                show: { object: lion }
                options: [{ object: leaf }, { object: ear }, { object: table }]
                answer: leaf
                hints: ["Say lion slowly. At the start, your tongue touches the top of your mouth."]
              - id: l1-s5
                type: image_multiple_choice
                text: "What starts with this sound?"
                say: "Listen to the sound. What starts with it? Tap the picture."
                audio: { sound: en.h }
                options: [{ object: apple }, { object: hand }, { object: cow }]
                answer: hand
                hints: ["For this sound you breathe out, like on a cold window."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Does it start with this sound?"
                say: "Pig. Does pig start with this sound? Listen."
                audio: { sound: en.p }
                show: { object: pig }
                answer: true
              - id: l1-n2
                type: image_multiple_choice
                text: "What starts with this sound?"
                say: "Listen to the sound. What starts with it? Tap the picture."
                audio: { sound: en.f }
                options: [{ object: hat }, { object: frog }, { object: mouse }]
                answer: frog
              - id: l1-n3
                type: true_false
                text: "Do they start the same?"
                say: "Cat, dog. Do they start with the same sound?"
                show: { objects: [cat, dog] }
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                text: "What starts like moon?"
                say: "Moon. What starts the same as moon?"
                show: { object: moon }
                options: [{ object: house }, { object: mirror }, { object: nose }]
                answer: mirror
              - id: l1-n5
                type: image_multiple_choice
                text: "What starts with this sound?"
                say: "Listen to the sound. What starts with it? Tap the picture."
                audio: { sound: en.t }
                options: [{ object: tree }, { object: rose }, { object: bell }]
                answer: tree

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Does it start with this sound?"
            say: "Sun. Does sun start with this sound? Listen."
            audio: { sound: en.s }
            show: { object: sun }
            answer: true
          - id: l1-c2
            type: image_multiple_choice
            text: "What starts with this sound?"
            say: "Listen to the sound. What starts with it? Tap the picture."
            audio: { sound: en.b }
            options: [{ object: cat }, { object: bed }, { object: egg }]
            answer: bed
          - id: l1-c3
            type: true_false
            text: "Do they start the same?"
            say: "Hat, hand. Do they start with the same sound?"
            show: { objects: [hat, hand] }
            answer: true
          - id: l1-c4
            type: image_multiple_choice
            text: "What starts with this sound?"
            say: "Listen to the sound. What starts with it? Tap the picture."
            audio: { sound: en.f }
            options: [{ object: sock }, { object: cup }, { object: fork }]
            answer: fork
          - id: l1-c5
            type: true_false
            text: "Does it start with this sound?"
            say: "Lamp. Does lamp start with this sound? Listen."
            audio: { sound: en.m }
            show: { object: lamp }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "What starts like pig?"
            say: "Pig. What starts the same as pig?"
            show: { object: pig }
            options: [{ object: bird }, { object: puppy }, { object: egg }]
            answer: puppy

  - n: 2
    title: { de: Gleicher Anfang, en: The same start }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Sun and sock start with the same sound, a hiss like a snake. They go together."
            show: { objects: [sun, sock] }
          - say: "Ball, bus, dog. Ball and bus start with the same sound, a pop of your lips. Dog starts with a different sound."
            show: { objects: [ball, bus, dog] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "What starts the same?"
                say: "Tap a picture, then tap the picture that starts with the same sound."
                pairs:
                  - left: { object: sun }
                    right: { object: sock }
                  - left: { object: fish }
                    right: { object: frog }
                  - left: { object: ball }
                    right: { object: banana }
                hints:
                  - "Tap the pictures and listen to the first sound."
                  - "Sun starts with a hiss. Which other word does?"
                  - "Sun, sock. Fish, frog. Ball, banana."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Which one starts differently?"
                say: "Two of these start the same and one doesn't. Which one starts differently?"
                options: [{ object: mouse }, { object: moon }, { object: house }]
                answer: house
                hints:
                  - "Listen to the first sound of each word."
                  - "Mouse and moon both start with a hum."
                  - "House starts differently, with a breath."
              - id: l2-f3
                type: sorting
                text: "Sort by the first sound."
                say: "Does it start like sun or like ball? Sort the pictures."
                bins:
                  - { id: s, show: { object: sun } }
                  - { id: b, show: { object: ball } }
                options:
                  - { object: sock, bin: s }
                  - { object: bus, bin: b }
                  - { object: star, bin: s }
                  - { object: bed, bin: b }
                hints:
                  - "Tap each picture and listen to the start."
                  - "Sock and star start with a hiss, like sun."
                  - "Bus and bed start with a pop of your lips, like ball."
              - id: l2-f4
                type: true_false
                text: "Do they start the same?"
                say: "Shoe, sun. Do they start with the same sound?"
                show: { objects: [shoe, sun] }
                answer: false
                hints:
