# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.initial-sounds
skill: lit-en.phonological.initial-sounds
curriculum: en-GB
language: en
title:
  de: Anlaute hören
  en: Hearing first sounds
summary: >
  Children hear the first sound in a word (sun starts with sss) and find
  words that start with the same sound, ready for phonics. No letters yet:
  the sounds are spoken and every picture says its word. Lesson 1 listens
  for one sound at a time; lesson 2 pairs and sorts words by their first
  sound, finds the one that starts differently, and ends with the skill
  check.
metadata:
  year: reception
  topic: { de: Laute hören, en: Hearing sounds }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: [lit-en.phonological.syllables]
  vocabulary: { en: [first sound, start, the same, different] }
  no_reading: true
  forms: [picture, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: letter-name
      what: Says the letter name (ess, em) instead of the sound
      addressed: the voice always says the sound (sss, mmm), never the name; hints repeat the sound
    - id: s-sh
      what: Mixes up s and sh (sock, shoe)
      addressed: both lessons set s words against sh words
    - id: end-sound
      what: Listens to the end of the word as in rhyming
      addressed: Learn contrasts the two ("For rhymes we listen to the end. Now we listen to the start.")
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Der erste Laut, en: The first sound }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "For rhymes we listen to the end of a word. Now we listen to the start. Sun. Sss ... un. The first sound is sss."
            show: { object: sun }
          - say: "Moon. Mmm ... oon. The first sound is mmm."
            show: { object: moon }
          - say: "Fish. Fff ... ish. The first sound is fff. Stretch the first sound and you will hear it."
            show: { object: fish }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Does it start with sss?"
                say: "Sock. Does sock start with sss?"
                show: { object: sock }
                answer: true
                hints:
                  - "Say the word and stretch the first sound."
                  - "Sss ... ock."
                  - "Yes, sock starts with sss."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What starts with mmm?"
                say: "What starts with mmm? Tap the picture."
                options: [{ object: ball }, { object: mouse }, { object: fish }]
                answer: mouse
                feedback:
                  ball: "Ball starts with b."
                  fish: "Fish starts with fff."
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Ball ... b. Mouse ... mmm. Fish ... fff."
                  - "Mouse starts with mmm."
              - id: l1-f3
                type: true_false
                text: "Does it start with fff?"
                say: "Hat. Does hat start with fff?"
                show: { object: hat }
                answer: false
                hints:
                  - "Say the word slowly."
                  - "H ... at. It starts with a breath."
                  - "No, hat starts with h."
              - id: l1-f4
                type: image_multiple_choice
                text: "What starts like sun?"
                say: "Sun. What starts the same as sun?"
                show: { object: sun }
                options: [{ object: shoe }, { object: snail }, { object: moon }]
                answer: snail
                feedback:
                  shoe: "Shoe starts with sh, not sss. They sound close, but they are different."
                hints:
                  - "Sun starts with sss."
                  - "Listen: shoe, snail, moon."
                  - "Sss ... nail. Snail starts like sun."
              - id: l1-f5
                type: true_false
                text: "Do they start the same?"
                say: "Fish, frog. Do they start with the same sound?"
                show: { objects: [fish, frog] }
                answer: true
                hints:
                  - "Listen only to the first sound."
                  - "Fff ... ish. Fff ... rog."
                  - "Yes, both start with fff."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Does it start with mmm?"
                say: "Monkey. Does monkey start with mmm?"
                show: { object: monkey }
                answer: true
                hints: ["Stretch the first sound: mmm ... onkey."]
              - id: l1-s2
                type: image_multiple_choice
                text: "What starts with sss?"
                say: "What starts with sss? Tap the picture."
                options: [{ object: shell }, { object: star }, { object: fish }]
                answer: star
                hints: ["Shell starts with sh. Listen carefully."]
              - id: l1-s3
                type: true_false
                text: "Do they start the same?"
                say: "Ball, bus. Do they start with the same sound?"
                show: { objects: [ball, bus] }
                answer: true
                hints: ["Listen only to the start."]
              - id: l1-s4
                type: image_multiple_choice
                text: "What starts like lion?"
                say: "Lion. What starts the same as lion?"
                show: { object: lion }
                options: [{ object: leaf }, { object: ear }, { object: table }]
                answer: leaf
                hints: ["Lion starts with lll."]
              - id: l1-s5
                type: image_multiple_choice
                text: "What starts with h?"
                say: "What starts with h? Tap the picture."
                options: [{ object: apple }, { object: hand }, { object: cow }]
                answer: hand
                hints: ["For h you breathe out, like on a cold window."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Does it start with p?"
                say: "Pig. Does pig start with p?"
                show: { object: pig }
                answer: true
              - id: l1-n2
                type: image_multiple_choice
                text: "What starts with fff?"
                say: "What starts with fff? Tap the picture."
                options: [{ object: hat }, { object: frog }, { object: mouse }]
                answer: frog
              - id: l1-n3
                type: true_false
                text: "Do they start the same?"
                say: "Cat, dog. Do they start with the same sound?"
                show: { objects: [cat, dog] }
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                text: "What starts like moon?"
                say: "Moon. What starts the same as moon?"
                show: { object: moon }
                options: [{ object: house }, { object: mirror }, { object: nose }]
                answer: mirror
              - id: l1-n5
                type: image_multiple_choice
                text: "What starts with t?"
                say: "What starts with t? Tap the picture."
                options: [{ object: tree }, { object: rose }, { object: bell }]
                answer: tree

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: true_false
            text: "Does it start with sss?"
            say: "Sun. Does sun start with sss?"
            show: { object: sun }
            answer: true
          - id: l1-c2
            type: image_multiple_choice
            text: "What starts with b?"
            say: "What starts with b? Tap the picture."
            options: [{ object: cat }, { object: bed }, { object: egg }]
            answer: bed
          - id: l1-c3
            type: true_false
            text: "Do they start the same?"
            say: "Hat, hand. Do they start with the same sound?"
            show: { objects: [hat, hand] }
            answer: true

  - n: 2
    title: { de: Gleicher Anfang, en: The same start }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Sun and sock start the same: sss. They go together."
            show: { objects: [sun, sock] }
          - say: "Ball, bus, dog. Ball and bus start with b. Dog starts differently, with d."
            show: { objects: [ball, bus, dog] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "What starts the same?"
                say: "Tap a picture, then tap the picture that starts with the same sound."
                pairs:
                  - left: { object: sun }
                    right: { object: sock }
                  - left: { object: fish }
                    right: { object: frog }
                  - left: { object: ball }
                    right: { object: banana }
                hints:
                  - "Tap the pictures and listen to the first sound."
                  - "Sun starts with sss. Which other word does?"
                  - "Sun, sock. Fish, frog. Ball, banana."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Which one starts differently?"
                say: "Two of these start the same and one doesn't. Which one starts differently?"
                options: [{ object: mouse }, { object: moon }, { object: house }]
                answer: house
                hints:
                  - "Listen to the first sound of each word."
                  - "Mouse and moon start with mmm."
                  - "House starts differently, with h."
              - id: l2-f3
                type: sorting
                text: "Sort by the first sound."
                say: "Does it start like sun or like ball? Sort the pictures."
                bins:
                  - { id: s, show: { object: sun } }
                  - { id: b, show: { object: ball } }
                options:
                  - { object: sock, bin: s }
                  - { object: bus, bin: b }
                  - { object: star, bin: s }
                  - { object: bed, bin: b }
                hints:
                  - "Tap each picture and listen to the start."
                  - "Sock and star start with sss like sun."
                  - "Bus and bed start with b like ball."
              - id: l2-f4
                type: true_false
                text: "Do they start the same?"
                say: "Shoe, sun. Do they start with the same sound?"
                show: { objects: [shoe, sun] }
                answer: false
                hints:
                  - "Listen carefully: shoe, sun."
                  - "Shoe starts with sh, sun with sss."
                  - "No, they start differently."
              - id: l2-f5
                type: matching
                text: "What starts the same?"
                say: "Tap a picture, then tap the picture that starts with the same sound."
                pairs:
                  - left: { object: hat }
                    right: { object: house }
                  - left: { object: lamp }
                    right: { object: lion }
                  - left: { object: table }
                    right: { object: telephone }
                hints:
                  - "Listen to the first sound."
                  - "Hat starts with h. Which word does too?"
                  - "Hat, house. Lamp, lion. Table, telephone."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "What starts the same?"
                say: "Tap a picture, then tap the picture that starts with the same sound."
                pairs:
                  - left: { object: moon }
                    right: { object: mouth }
                  - left: { object: dog }
                    right: { object: duck }
                  - left: { object: cat }
                    right: { object: cow }
                hints: ["Listen only to the first sound."]
              - id: l2-s2
                type: sorting
                text: "Sort by the first sound."
                say: "Does it start like fish or like hat? Sort the pictures."
                bins:
                  - { id: f, show: { object: fish } }
                  - { id: h, show: { object: hat } }
                options:
                  - { object: frog, bin: f }
                  - { object: hand, bin: h }
                  - { object: hedgehog, bin: h }
                hints: ["Tap each picture and listen to the start."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which one starts differently?"
                say: "Two of these start the same and one doesn't. Which one starts differently?"
                options: [{ object: sock }, { object: shell }, { object: sun }]
                answer: shell
                hints: ["Listen carefully for sss and sh."]
              - id: l2-s4
                type: true_false
                text: "Do they start the same?"
                say: "Goat, giraffe. Do they start with the same sound?"
                show: { objects: [goat, giraffe] }
                answer: false
                hints: ["Giraffe starts with j. What about goat?"]
              - id: l2-s5
                type: image_multiple_choice
                text: "What starts like rabbit?"
                say: "Rabbit. What starts the same as rabbit?"
                show: { object: rabbit }
                options: [{ object: rose }, { object: leaf }, { object: egg }]
                answer: rose
                hints: ["Rabbit starts with rrr."]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "What starts the same?"
                say: "Tap a picture, then tap the picture that starts with the same sound."
                pairs:
                  - left: { object: banana }
                    right: { object: bee }
                  - left: { object: snail }
                    right: { object: spoon }
                  - left: { object: pig }
                    right: { object: pineapple }
              - id: l2-n2
                type: sorting
                text: "Sort by the first sound."
                say: "Does it start like mouse or like cat? Sort the pictures."
                bins:
                  - { id: m, show: { object: mouse } }
                  - { id: k, show: { object: cat } }
                options:
                  - { object: monkey, bin: m }
                  - { object: car, bin: k }
                  - { object: marble, bin: m }
                  - { object: cup, bin: k }
              - id: l2-n3
                type: image_multiple_choice
                text: "Which one starts differently?"
                say: "Two of these start the same and one doesn't. Which one starts differently?"
                options: [{ object: fish }, { object: frog }, { object: bell }]
                answer: bell
              - id: l2-n4
                type: true_false
                text: "Do they start the same?"
                say: "Egg, elephant. Do they start with the same sound?"
                show: { objects: [egg, elephant] }
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "What starts like apple?"
                say: "Apple. What starts the same as apple?"
                show: { object: apple }
                options: [{ object: ear }, { object: anchor }, { object: octopus }]
                answer: anchor

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: true_false
            text: "Does it start with fff?"
            say: "Frog. Does frog start with fff?"
            show: { object: frog }
            answer: true
          - id: l2-c2
            type: image_multiple_choice
            text: "What starts with mmm?"
            say: "What starts with mmm? Tap the picture."
            options: [{ object: nose }, { object: moon }, { object: hand }]
            answer: moon
          - id: l2-c3
            type: image_multiple_choice
            text: "Which one starts differently?"
            say: "Two of these start the same and one doesn't. Which one starts differently?"
            options: [{ object: boat }, { object: bread }, { object: sun }]
            answer: sun
          - id: l2-c4
            type: true_false
            text: "Do they start the same?"
            say: "Sock, shoe. Do they start with the same sound?"
            show: { objects: [sock, shoe] }
            answer: false
