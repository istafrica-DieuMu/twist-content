# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.anticipate
skill: lit-en.comprehension.anticipate
curriculum: en-GB
language: en
title:
  de: Vorhersagen, was als Nächstes passiert
  en: What might happen next?
summary: >
  Saying what might happen next in a story, from clues in the words and
  pictures. Lesson 1 uses clues about what is going on (grey clouds and
  a drip mean rain) and how characters will feel; lesson 2 uses patterns
  that repeat in a story and what we know about a character (Rabbit is
  fast, Snail is slow), and ends with the skill check. Every story is
  short, written for Twist and read aloud; the child taps the picture of
  what might happen and picks the clue that tells us. The skill check
  marks choosing what might happen and why; saying a prediction aloud in
  the child's own words is left to Practise and talk at home.
metadata:
  year: reception
  topic: { de: "Geschichten verstehen", en: "Understanding stories" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.comprehension.retell]
  also_practises: [lit-en.comprehension.retell]
  vocabulary: { en: [next, predict, I think, because, clue, pattern] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: clues, what: { de: "aus Hinweisen in der Geschichte vorhersagen, was passiert", en: predicting what will happen from clues in the story } }
    - { id: feelings, what: { de: "vorhersagen, wie sich eine Figur fühlen wird", en: predicting how a character will feel } }
    - { id: pattern, what: { de: "ein Muster in der Geschichte nutzen, das sich wiederholt", en: using a pattern that repeats in a story } }
    - { id: character, what: { de: "nutzen, was man über eine Figur weiß (Schnecke ist langsam)", en: "using what we know about a character (Snail is slow)" } }
  misconceptions:
    - id: guess-without-clues
      what: Says any idea that comes to mind, not one the story points to
      addressed: Learn in lesson 1 uses the clouds and the drip as clues; options always include something the story does not point to, with feedback in l1-f1; the child picks the clue in l1-f3, l1-s5, l1-n5, l2-f3, l2-s4, l2-n4 and the skill check task l2-c3
    - id: misses-the-pattern
      what: Does not notice that something keeps happening in a story, so cannot use it to predict
      addressed: Learn in lesson 2 points out the pattern; l2-f1, l2-f2, l2-s1, l2-s5, l2-n1, l2-n4, l2-n5 and l2-c2
    - id: ignores-character
      what: Predicts something the character would not do (Snail wins the race, Frog stays out of the water)
      addressed: Learn in lesson 2 says to think about what a character is like; l2-f4, l2-f5, l2-s2, l2-n2, l2-n3 and l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Hinweise finden", en: "Looking for clues" }
    goal:
      de: "Such die Hinweise in einer Geschichte und sag, was als Nächstes passiert, so wie graue Wolken Regen bringen."
      en: "Spot the clues in a story and say what happens next, like grey clouds mean rain."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Put the pictures in order."
            say: "Listen. Then put the pictures in order."
            audio: { en: "First, Zara went to the shop. She bought some apples. In the end, she ate an apple in the park." }
            options: [{ object: park }, { object: shop }, { object: apple }]
            slot_count: 3
            answer: [shop, apple, park]
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Who is the story about?"
            say: "Listen. Who is the story about?"
            audio: { en: "Grandma went to the library. She found a book about a crocodile. She took it home and read it to the baby." }
            options: [{ object: crocodile }, { object: grandma }, { object: baby }]
            answer: grandma
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Ella in the park"
            say: "Ella was in the park. Big grey clouds came over the sky. Ella heard drip, drop. What do you think will happen next? Have a guess."
            show: { object: cloud }
          - text: "What might happen next?"
            say: "Good listeners think about what might happen next in a story. They use clues: things the story tells us, and things in the pictures. Here the clues are the grey clouds and the drip. I think it will rain, because the clouds are grey and I heard a drip."
            show: { object: cloud }
          - text: "It rained!"
            say: "Yes! It started to rain, and Ella put up her hood. The grey clouds and the drip were the clues. When you say what might happen, say why: I think ... because ..."
            show: { object: rain }
          - text: "Did you know?"
            say: "Did you know? Rain clouds look dark grey because they are full of tiny drops of water. The more water a cloud holds, the darker it looks from underneath. So a dark grey cloud is a good clue that rain is coming!"
            show: { object: cloud }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Where will Leo go?"
                say: "Listen. Where do you think Leo will go next?"
                audio: { en: "Leo puts on his swimming things. He packs a towel and his goggles." }
                options: [{ object: library }, { object: swimming-pool }, { object: supermarket }]
                answer: swimming-pool
                feedback:
                  library: "You don't need swimming things at the library. Where can Leo swim?"
                  supermarket: "Swimming in the supermarket? Splash, all over the bananas! Where can Leo really swim?"
                hints:
                  - "What do you do with swimming things?"
                  - "The clue is the towel and the goggles."
                  - "He will go to the swimming pool."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What will Mia make?"
                say: "Listen. What do you think Mia will make?"
                audio: { en: "It is very cold. Snow falls all night. In the morning, Mia puts on her woolly hat and runs outside." }
                options: [{ object: kite }, { object: boat }, { object: snowman }]
                answer: snowman
                hints:
                  - "What is on the ground outside?"
                  - "What can you make with lots of snow?"
                  - "A snowman."
              - id: l1-f3
                type: multiple_choice
                text: "I think Ava is flying a kite. What is my clue?"
                say: "Listen. I think Ava is flying a kite. What is my clue?"
                audio: { en: "Ava holds the string tight. The wind blows and blows." }
                options: ["the string and the wind", "her red shoes", "it is lunchtime"]
                answer: "the string and the wind"
                hints:
                  - "Which words in the story make you think of a kite?"
                  - "A kite has a long string and needs wind."
                  - "The string and the wind."
              - id: l1-f4
                type: image_multiple_choice
                text: "Where will Sam go?"
                say: "Listen. Where do you think Sam will go next?"
                audio: { en: "Sam is very tired. He yawns a big yawn. He puts on his pyjamas and brushes his teeth." }
                options: [{ object: park }, { object: bed }, { object: school }]
                answer: bed
                hints:
                  - "What do you do when you are tired?"
                  - "The clues are the yawn and the pyjamas."
                  - "He will go to bed."
              - id: l1-f5
                type: true_false
                text: "Will the ice cream melt?"
                say: "Listen. Do you think the ice cream will melt?"
                audio: { en: "Ben has a big ice cream. The sun is very hot. Drip, drip goes the ice cream." }
                show: { object: ice-cream }
                answer: true
                hints:
                  - "What does the hot sun do to ice cream?"
                  - "The clue is drip, drip."
                  - "Yes. It will melt."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "What will come out?"
                say: "Listen. What do you think will come out of the oven?"
                audio: { en: "Gran mixes eggs, flour, sugar and butter in a bowl. She pours it into a tin and puts it in the oven." }
                options: [{ object: ice-cream }, { object: banana }, { object: cake }]
                answer: cake
                hints: ["What do we bake with eggs, flour and sugar?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "What will go up?"
                say: "Listen. What do you think will go up?"
                audio: { en: "The wind blows hard. Ava holds the string and runs. Up, up, up goes her ..." }
                options: [{ object: kite }, { object: ball }, { object: boat }]
                answer: kite
                hints: ["What flies on a string?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "How will Mia feel?"
                say: "Listen. How do you think Mia will feel?"
                audio: { en: "Mia drops her ice cream on the floor. Splat!" }
                options: [{ object: happy }, { object: sad }, { object: tired }]
                answer: sad
                hints: ["How would you feel if you dropped your ice cream?"]
              - id: l1-s4
                type: true_false
                text: "Will the cat go to sleep?"
                say: "Listen. Do you think the cat will go to sleep now?"
                audio: { en: "The cat sees a mouse. The cat creeps closer and closer." }
                show: { object: cat }
                answer: false
                hints: ["What is the cat creeping towards?"]
              - id: l1-s5
                type: multiple_choice
                text: "I think a flower will grow. Why do I think that?"
                say: "Listen. I think a flower will grow. Why do I think that?"
                audio: { en: "Grandpa plants a seed and waters it every day." }
                options: ["Grandpa has a hat", "seeds grow when you water them", "flowers are pink"]
                answer: "seeds grow when you water them"
                hints: ["What does the seed need to grow?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "What will grow?"
                say: "Listen. What do you think will grow?"
                audio: { en: "Grandpa plants a seed in a pot. He waters it every day, and the sun shines on it." }
                options: [{ object: flower }, { object: cake }, { object: ball }]
                answer: flower
              - id: l1-n2
                type: image_multiple_choice
                text: "Where will the cat go?"
                say: "Listen. Where do you think the cat will climb to be safe?"
                audio: { en: "A big dog chases the cat. The cat runs fast." }
                options: [{ object: oven }, { object: swimming-pool }, { object: tree }]
                answer: tree
                feedback:
                  swimming-pool: "Most cats don't like getting wet! Where can the cat climb up high, away from the dog?"
              - id: l1-n3
                type: image_multiple_choice
                text: "How will Ben feel?"
                say: "Listen. How do you think Ben will feel?"
                audio: { en: "Ben's friend gives him a present. It is the toy he wanted!" }
                options: [{ object: angry }, { object: happy }, { object: scared }]
                answer: happy
              - id: l1-n4
                type: true_false
                text: "Will the baby go in the bath?"
                say: "Listen. Do you think the baby will go in the bath?"
                audio: { en: "Mum fills the bath with warm water and bubbles. She puts in the baby's yellow duck." }
                show: { object: baby }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "I think Ella will need her umbrella. Why do I think that?"
                say: "Listen. I think Ella will need her umbrella. Why do I think that?"
                audio: { en: "Dark clouds fill the sky." }
                options: ["she is hungry", "it is going to rain", "the sun is hot"]
                answer: "it is going to rain"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "What is in the bottle?"
            say: "Listen. What do you think is in the bottle?"
            audio: { en: "The baby is hungry and cries. Dad warms up a bottle." }
            options: [{ object: milk }, { object: ball }, { object: shoe }]
            answer: milk
          - id: l1-c2
            type: true_false
            text: "Will some leaves blow away?"
            say: "Listen. Do you think some leaves will blow away?"
            audio: { en: "The wind blows and blows. The leaves on the tree shake." }
            show: { object: leaf }
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "How will Leo feel?"
            say: "Listen. How do you think Leo will feel?"
            audio: { en: "Leo cannot find his teddy anywhere." }
            options: [{ object: happy }, { object: sad }, { object: tired }]
            answer: sad
          - id: l1-c4
            type: image_multiple_choice
            text: "Where will Rosie go?"
            say: "Listen. Where do you think Rosie will go?"
            audio: { en: "Rosie puts her reading book and her lunch box in her bag. She kisses Dad goodbye at the gate, where her teacher is waiting." }
            options: [{ object: hospital }, { object: school }, { object: supermarket }]
            answer: school
          - id: l1-c5
            type: true_false
            text: "Will Ollie feel happy?"
            say: "Listen. Do you think Ollie will feel happy?"
            audio: { en: "Ollie builds a tall tower all morning. Then his little brother knocks it down. Crash!" }
            show: { object: bricks }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Where will Kai go next?"
            say: "Listen. Where do you think Kai will go next?"
            audio: { en: "Kai has played in the mud all afternoon. His hands, his knees and even his face are muddy. Mum says, Look at you! Time to get clean." }
            options: [{ object: bath }, { object: park }, { object: bed }]
            answer: bath

  - n: 2
    title: { de: "Muster und Figuren", en: "Patterns and characters" }
    goal:
      de: "Hör, was in einer Geschichte immer wieder passiert, und sag, was als Nächstes kommt."
      en: "Listen for what happens again and again in a story, and guess what comes next."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "What will Zak do?"
            say: "Listen. What do you think Zak will do next?"
            audio: { en: "Zak puts on his helmet and gets his bike out of the shed." }
            options: [{ object: ride-bike }, { object: swim }, { object: sing }]
            answer: ride-bike
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "How will Ella feel?"
            say: "Listen. How do you think Ella will feel?"
            audio: { en: "Ella's best friend comes to play." }
            options: [{ object: sad }, { object: happy }, { object: angry }]
            answer: happy
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Little Mouse and the big cheese"
            say: "Little Mouse found a big cheese. He tried to carry it home, but it was too heavy. Along came Frog. Frog helped him push, but it was still too heavy. Along came Rabbit. Rabbit helped too, but it was still too heavy. Then along came ... What do you think: who came along next? Have a guess."
            show: { object: mouse }
          - text: "A pattern"
            say: "Did you hear the pattern? Each time, a new animal comes along and helps. So I think another animal will come along next. Patterns help us guess what happens next."
            show: { object: rabbit }
          - text: "Along came Elephant!"
            say: "Along came Elephant. He lifted the cheese with his big trunk and carried it home. Little Mouse shared the cheese with all his friends. Think about what a character is like, too: an elephant is big and strong, so he could carry it."
            show: { object: elephant }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "What will the cat eat?"
                say: "Listen to the pattern. What do you think the cat will eat on Wednesday?"
                audio: { en: "On Monday, the cat ate a fish. On Tuesday, the cat ate a fish. On Wednesday, the cat ate a ..." }
                options: [{ object: apple }, { object: fish }, { object: cake }]
                answer: fish
                hints:
                  - "What did the cat eat on Monday and on Tuesday?"
                  - "The same thing happens every day."
                  - "A fish."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "What will the cow do?"
                say: "Listen. What do you think the cow will do?"
                audio: { en: "The goat jumped over the log. The pig jumped over the log. Here comes the cow!" }
                options: [{ object: swim }, { object: jump }, { object: read }]
                answer: jump
                hints:
                  - "What did the goat do? What did the pig do?"
                  - "Each animal did the same thing."
                  - "The cow will jump over the log."
              - id: l2-f3
                type: multiple_choice
                text: "I think the cow will jump too. Why do I think that?"
                say: "Listen. I think the cow will jump too. Why do I think that?"
                audio: { en: "The goat jumped over the log. The pig jumped over the log." }
                options: ["the log is brown", "every animal jumped over the log", "cows give us milk"]
                answer: "every animal jumped over the log"
                hints:
                  - "Think about the pattern."
                  - "What did every animal do?"
                  - "Every animal jumped over the log."
              - id: l2-f4
                type: image_multiple_choice
                text: "What will Rabbit eat?"
                say: "Listen. What do you think Rabbit will eat first?"
                audio: { en: "Rabbit loves carrots more than anything. Rabbit finds a garden full of vegetables." }
                options: [{ object: pizza }, { object: carrot }, { object: fish }]
                answer: carrot
                hints:
                  - "What does Rabbit love?"
                  - "Think about what Rabbit is like."
                  - "A carrot."
              - id: l2-f5
                type: true_false
                text: "Will Frog jump in?"
                say: "Listen. Do you think Frog will jump in?"
                audio: { en: "Frog loves water. On a hot day, Frog sees a cool pond." }
                show: { object: frog }
                answer: true
                hints:
                  - "What does Frog love?"
                  - "The pond is full of water."
                  - "Yes. Frog will jump in."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "How many will float away?"
                say: "Listen to the pattern. How many balloons do you think will float away next?"
                audio: { en: "One balloon floated away. Then two balloons floated away. Then three balloons floated away. Then ..." }
                options:
                  - { object: balloon, count: 1, layout: row }
                  - { object: balloon, count: 4, layout: row }
                  - { object: balloon, count: 3, layout: row }
                answer: "4"
                hints: ["One, two, three ... what comes next?"]
              - id: l2-s2
                type: image_multiple_choice
                text: "Who will win?"
                say: "Listen. Who do you think will get there first?"
                audio: { en: "Snail is very, very slow. Rabbit is very fast. They have a race to the tree." }
                options: [{ object: snail }, { object: rabbit }]
                answer: rabbit
                hints: ["Who is fast?"]
              - id: l2-s3
                type: true_false
                text: "Will the bird forget her nest?"
                say: "Listen. Do you think the bird will forget her nest and never come back?"
                audio: { en: "The bird has babies in a nest. She flies off to find a worm for them." }
                show: { object: bird }
                answer: false
                hints: ["Who is the worm for?"]
              - id: l2-s4
                type: multiple_choice
                text: "I think Rabbit will win. Why do I think that?"
                say: "Listen. I think Rabbit will win. Why do I think that?"
                audio: { en: "Snail and Rabbit have a race." }
                options: ["Rabbit has long ears", "the tree is green", "rabbits are fast and snails are slow"]
                answer: "rabbits are fast and snails are slow"
                hints: ["Think about what each animal is like."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Where will the bee go?"
                say: "Listen. Where do you think the bee will fly next?"
                audio: { en: "The bee flies to a red flower. Then it flies to a yellow flower. Then it flies to a pink flower." }
                options: [{ object: oven }, { object: car }, { object: flower }]
                answer: flower
                hints: ["Where did the bee go each time?"]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Where will Ava be soon?"
                say: "Listen. Where do you think Ava will be soon?"
                audio: { en: "Ava said, I'm not sleepy! Dad read one story. Ava yawned. Dad read two stories. Ava yawned and yawned." }
                options: [{ object: swimming-pool }, { object: park }, { object: bed }]
                answer: bed
              - id: l2-n2
                type: image_multiple_choice
                text: "What will Monkey pick?"
                say: "Listen. What do you think Monkey will pick?"
                audio: { en: "Monkey loves bananas. Monkey sees a tree full of long yellow fruit." }
                options: [{ object: carrot }, { object: banana }, { object: cheese }]
                answer: banana
              - id: l2-n3
                type: true_false
                text: "Will the snowman get bigger?"
                say: "Listen. Do you think the snowman will get bigger?"
                audio: { en: "The snowman is happy in the cold. Then the sun comes out and it gets very hot." }
                show: { object: snowman }
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "I think the goat will eat some cake. Why do I think that?"
                say: "Listen. I think the goat will eat some cake. Why do I think that?"
                audio: { en: "First the pig ate some cake. Then the cow ate some cake. Now the goat comes along." }
                options: ["goats have beards", "each animal ate some cake", "cakes are sweet"]
                answer: "each animal ate some cake"
              - id: l2-n5
                type: audio_choice
                text: "Who is Little Duck's mummy?"
                say: "Listen. Who do you think Little Duck's mummy is?"
                audio: { en: "Little Duck was lost. She asked the cow, Are you my mummy? Moo! No! She asked the pig, Are you my mummy? Oink! No! Then someone by the pond opened her wings wide and said, Quack, quack!" }
                options: [{ object: cow }, { object: duck }, { object: pig }]
                answer: duck

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: clues
            type: image_multiple_choice
            text: "What will Grace do?"
            say: "Listen. What do you think Grace will do next?"
            audio: { en: "Grace puts on her swimming costume and goggles and walks to the edge of the pool." }
            options: [{ object: sing }, { object: swim }, { object: ride-bike }]
            answer: swim
          - id: l2-c2
            part: pattern
            type: audio_choice
            text: "What will the little frog do?"
            say: "Listen. What do you think the little frog will do?"
            audio: { en: "The green frog jumped into the pond. Splash! The big frog jumped into the pond. Splash! Here comes the little frog." }
            options: [{ object: sit-down }, { object: read }, { object: jump }]
            answer: jump
          - id: l2-c3
            part: clues
            type: multiple_choice
            text: "I think Leo will put on his woolly hat. Why do I think that?"
            say: "Listen. I think Leo will put on his woolly hat. Why do I think that?"
            audio: { en: "It is very cold and snowy." }
            options: ["to keep his head warm", "to go swimming", "to keep the sun off"]
            answer: "to keep his head warm"
          - id: l2-c4
            part: character
            type: true_false
            text: "Will Dog jump in the puddle?"
            say: "Listen. Do you think Dog will jump in the puddle?"
            audio: { en: "Dog loves mud more than anything. Dog sees a big muddy puddle." }
            show: { object: dog }
            answer: true
          - id: l2-c5
            part: feelings
            type: image_multiple_choice
            text: "How will Ben feel?"
            say: "Listen. How do you think Ben will feel?"
            audio: { en: "Ben has waited all week for his birthday party. Now the day is here!" }
            options: [{ object: sad }, { object: scared }, { object: happy }]
            answer: happy
          - id: l2-c6
            part: clues
            type: image_multiple_choice
            text: "What will Nana light?"
            say: "Listen. What do you think Nana will light?"
            audio: { en: "It is Amir's birthday. Nana puts a big cake on the table and gets out the matches." }
            options: [{ object: kettle }, { object: candle }, { object: toothbrush }]
            answer: candle
          - id: l2-c7
            part: feelings
            type: image_multiple_choice
            text: "How will Maya feel?"
            say: "Listen. How do you think Maya will feel?"
            audio: { en: "Maya is in bed and the light is off. Suddenly there is a loud bang, bang, bang at the window." }
            options: [{ object: happy }, { object: angry }, { object: scared }]
            answer: scared
          - id: l2-c8
            part: pattern
            type: multiple_choice
            text: "What will the wolf do at the house of bricks?"
            say: "Listen. What do you think the wolf will do at the house of bricks?"
            audio: { en: "The wolf huffed and puffed at the house of straw, and it fell down. He huffed and puffed at the house of sticks, and it fell down. Then he came to the house of bricks." }
            options: ["go to sleep", "huff and puff", "eat a cake"]
            answer: "huff and puff"
          - id: l2-c9
            part: character
            type: multiple_choice
            text: "What will Owl do now?"
            say: "Listen. What do you think Owl will do now?"
            audio: { en: "Owl sleeps all day and wakes up when it gets dark. Now the sun goes down and the moon comes up." }
            options: ["go to sleep", "wake up and fly", "go to school"]
            answer: "wake up and fly"
