    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen to the word. Which letters make its middle sound?"
            audio: { en: "Tail." }
            options: ["ai", "ee", "igh"]
            answer: "ai"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Then tap its picture."
            show: { drawn: letter-card, text: "queen" }
            options: [{ object: cup }, { object: queen }, { object: clown }]
            answer: queen
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "oa"
            say: "These two letters make one long sound, as when you say oh! Boat and goat have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "oa" }
            sound: en.oa
          - text: "oo"
            say: "Two o's together can make a long sound, as in moon and spoon. Listen, then say it with me."
            show: { object: moon }
            sound: "en.oo:"
          - text: "oo"
            say: "Sometimes the same two letters make a short sound, as in book, look and foot. Listen. If the long sound does not make a word, try the short one."
            show: { object: book }
            sound: en.oo
          - text: "g oa t → goat"
            say: "Goat has three sounds. The two letters in the middle make one sound, so they share one sound button. Push the sounds together: goat."
            show: { drawn: letter-card, text: "g oa t" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "oa" }
                options: [{ object: box }, { object: boat }, { object: bus }]
                answer: boat
                feedback:
                  box: "Box has the short sound in the middle of dog. These letters make a long sound, as when you say oh."
                hints:
                  - "Tap each picture and listen for a long sound."
                  - "These letters make a long sound, as when you say oh. Which picture has it in the middle?"
                  - "Boat. Tap the boat."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Moon." }
                options: ["o", "oo", "oa"]
                answer: "oo"
                hints:
                  - "Listen again. Is the middle sound like spoon, or like boat?"
                  - "Moon has the same long sound as spoon."
                  - "Two o's together."
              - id: l2-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "goat" }
                options: [{ object: girl }, { object: ghost }, { object: goat }]
                answer: goat
                hints:
                  - "Say the sounds on the card, one by one."
                  - "The two letters in the middle make one sound."
                  - "Push the sounds together: goat. Tap the goat."
              - id: l2-f4
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Book. Which letters are missing in the middle of book?"
                show: { object: book }
                frame: "b_k"
                options: ["oa", "o", "oo"]
                answer: ["oo"]
                hints:
                  - "Say book slowly and listen to the middle."
                  - "It is the short sound that two o's can make."
                  - "Book has two o's in the middle."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Road." }
                options: ["rod", "road", "rid"]
                answer: "road"
                hints:
                  - "Listen to the middle sound."
                  - "It is long, as in boat."
                  - "Road."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Spoon. Which letters are missing in spoon?"
                show: { object: spoon }
                frame: "sp_n"
                options: ["oo", "oa", "o"]
                answer: ["oo"]
                hints: ["Spoon has the same long sound as moon."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "oo" }
                options: [{ object: mouse }, { object: monkey }, { object: moon }]
                answer: moon
                hints: ["Listen for the long sound in spoon."]
              - id: l2-s3
                type: audio_choice
                text: "Which letters make this sound?"
