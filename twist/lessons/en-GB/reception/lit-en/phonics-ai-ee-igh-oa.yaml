# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-ai-ee-igh-oa
skill: lit-en.phonics.ai-ee-igh-oa
curriculum: en-GB
language: en
title:
  de: Die Laute ai, ee, igh, oa, oo
  en: The sounds ai, ee, igh, oa, oo
summary: >
  Long vowel sounds written with two or three letters. Lesson 1 takes ai
  (rain), ee (tree) and the trigraph igh (night); lesson 2 takes oa (boat)
  and oo with its long sound (moon) and its short sound (book), mixes all
  of them and ends with the skill check. The voice says every word; the
  child picks the letters for a sound, fills a gap or reads a word and
  finds its picture. Writing the graphemes in words is practised in
  Practise (the missing letters) and in segment-spell; the skill check
  marks hearing each sound and reading words with it.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: [lit-en.phonics.ch-sh-th-ng]
  vocabulary: { en: [sound, letters, digraph, trigraph, sound buttons, long sound, short sound] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.ai, en.ee, en.igh, en.oa, "en.oo:", en.oo]
  facets: []
  parts:
    - { id: ai, what: { de: "den Laut von ai kennen und Wörter damit lesen", en: "knowing the sound of ai and reading words with it" } }
    - { id: ee, what: { de: "den Laut von ee kennen und Wörter damit lesen", en: "knowing the sound of ee and reading words with it" } }
    - { id: igh, what: { de: "den Laut von igh kennen und Wörter damit lesen", en: "knowing the sound of igh and reading words with it" } }
    - { id: oa-oo, what: { de: "oa und die beiden Laute von oo lesen (boat, moon, book)", en: "reading oa and both sounds of oo (boat, moon, book)" } }
  misconceptions:
    - id: vowel-letter-by-letter
      what: Sounds each vowel letter on its own (ai as a ... i, oa as o ... a) or writes one vowel for the long sound (ran for rain)
      addressed: single short vowels sit next to the digraph in l1-f2 (with feedback), l1-f5, l1-s2, l1-n1, l1-c1, l2-f1 (with feedback), l2-f2, l2-f5, l2-s3, l2-n1 and the skill check task l2-c1
    - id: igh-as-i
      what: Writes only i for the igh sound (nit for night), or does not see the three letters as one sound
      addressed: Learn in lesson 1 gives night one sound button for igh; the hints of l1-f4 say three letters make one sound; i is a distractor in l1-f4, l1-s1, l1-n5, l1-c3 and l2-c3
    - id: oo-one-sound
      what: Reads every oo with the long sound (book as booook) and gives up when it does not make a word
      addressed: Learn in lesson 2 shows the long oo of moon and the short oo of book and says to try the other sound; l2-f4 (hints), l2-s4, l2-n2 and l2-c5 use short oo words
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "ai, ee, igh", en: "ai, ee, igh" }
    goal:
      de: "Lerne die langen Laute in rain, tree und night und lies Wörter damit."
      en: "Learn the long sounds in rain, tree and night, and read words with them."
    new_content: true
    activities:
      - activity: learn
        mode: new-sound
        screens:
          - text: "ai"
            say: "These two letters make one long sound. Rain and snail have it in the middle. Listen, then say it with me."
            show: { drawn: letter-card, text: "ai" }
            sound: en.ai
          - text: "ee"
            say: "Two e's together make a long sound, like a big smile. Tree and bee have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "ee" }
            sound: en.ee
          - text: "igh"
            say: "These three letters make just one sound. We call three letters for one sound a trigraph. Night and light have it. Listen."
            show: { drawn: letter-card, text: "igh" }
            sound: en.igh
          - text: "n igh t → night"
            say: "Night has three sounds. The three letters in the middle make one sound, so they share one sound button. Push the sounds together: night."
            show: { drawn: letter-card, text: "n igh t" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ai" }
                options: [{ object: rain }, { object: ring }, { object: rabbit }]
                answer: rain
                feedback:
                  rabbit: "Rabbit has the short sound at the start of ant. These letters make the long sound in the middle of snail."
                hints:
                  - "Tap each picture and listen for a long sound."
                  - "These letters make the long sound in snail. Which picture has it in the middle?"
                  - "Rain. Tap the rain."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which letters make the last sound?"
                say: "Listen to the word. Which letters make its last sound?"
                audio: { en: "Tree." }
                options: ["ee", "e", "ai"]
                answer: "ee"
                feedback:
                  "e": "One e makes the short sound in bed. Tree ends with a long sound, like bee, so it needs two e's."
                hints:
                  - "Listen again. Is the last sound short or long?"
                  - "The long smiley sound is two letters."
                  - "Tree ends with two e's."
              - id: l1-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "bee" }
                options: [{ object: bed }, { object: bee }, { object: bell }]
                answer: bee
                hints:
                  - "Say the sounds on the card, one by one."
                  - "The first letter is a pop of your lips. Then the two e's make one long sound."
                  - "Push the sounds together: bee. Tap the bee."
              - id: l1-f4
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Which letters are missing in the middle of this word? Listen."
                audio: { en: "Night." }
                frame: "n_t"
                options: ["i", "igh", "ai"]
                answer: ["igh"]
                hints:
                  - "Say night slowly and listen to the middle."
                  - "The middle sound needs three letters."
                  - "Night has three letters for one sound in the middle. Tap the three letters."
              - id: l1-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Rain." }
                options: ["ran", "rain", "run"]
                answer: "rain"
                hints:
                  - "Listen to the middle sound."
                  - "It is a long sound, not a short one."
                  - "Rain."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.igh }
                options: ["igh", "i", "ee"]
                answer: "igh"
                hints: ["It is the long sound in the middle of night, and three letters make it."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which letters finish the word?"
                say: "Tree. Which letters are missing at the end of tree?"
                show: { object: tree }
                frame: "tr_"
                options: ["e", "ai", "ee"]
                answer: ["ee"]
                hints: ["Tree ends with the long smiley sound."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ai" }
                options: [{ object: sock }, { object: train }, { object: sun }]
                answer: train
                hints: ["Listen for the long sound in rain, in the middle of the word."]
              - id: l1-s4
                type: true_false
                text: "Does the card say fit?"
                say: "Read the card. Does it say fit?"
                show: { drawn: letter-card, text: "feet" }
                answer: false
                hints: ["Look at the middle. One letter or two?"]
              - id: l1-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "High." }
                options: ["hit", "hen", "high"]
                answer: "high"
                hints: ["Listen to the end. Is it a long sound?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Wait." }
                options: ["a", "ai", "ee"]
                answer: "ai"
              - id: l1-n2
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "tree" }
                options: [{ object: table }, { object: teddy }, { object: tree }]
                answer: tree
              - id: l1-n3
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Which letters are missing in the middle of this word? Listen."
                audio: { en: "Seed." }
                frame: "s_d"
                options: ["ee", "e", "igh"]
                answer: ["ee"]
              - id: l1-n4
                type: true_false
                text: "Does bee end with ai?"
                say: "Bee. Does bee end with this sound? Listen."
                audio: { sound: en.ai }
                show: { object: bee }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Night." }
                options: ["nut", "night", "net"]
                answer: "night"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen. Tap the letters for the middle sound."
            audio: { en: "Sheep." }
            options: ["e", "ee", "igh"]
            answer: "ee"
          - id: l1-c2
            type: image_multiple_choice
            text: "Which word has this sound?"
            say: "Which picture has the sound of these letters?"
            show: { drawn: letter-card, text: "ai" }
            options: [{ object: paint }, { object: pig }, { object: pencil }]
            answer: paint
          - id: l1-c3
            type: fill_in_blank
            text: "Which letters are missing?"
            say: "Light. Which letters are missing in the middle of light?"
            show: { object: light-bulb }
            frame: "l_t"
            options: ["igh", "i", "ai"]
            answer: ["igh"]
          - id: l1-c4
            type: audio_choice
            text: "Which letters make the last sound?"
            say: "Listen. Tap the letters for the last sound."
            audio: { en: "High." }
            options: ["i", "igh", "ee"]
            answer: "igh"
          - id: l1-c5
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Which picture is it?"
            show: { drawn: letter-card, text: "train" }
            options: [{ object: tree }, { object: teddy }, { object: train }]
            answer: train
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Does queen have ee in the middle?"
            say: "Queen. Does queen have this sound in the middle? Listen."
            audio: { sound: en.ee }
            show: { object: queen }
            answer: true

  - n: 2
    title: { de: "oa und oo", en: "oa and oo" }
    goal:
