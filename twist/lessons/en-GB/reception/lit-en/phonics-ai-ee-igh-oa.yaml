                audio: { sound: en.oa }
                options: ["oo", "oa", "o"]
                answer: "oa"
                hints: ["It is the long oh sound in the middle of boat."]
              - id: l2-s4
                type: true_false
                text: "Does the card say feet?"
                say: "Read the card. Does it say feet?"
                show: { drawn: letter-card, text: "foot" }
                answer: false
                hints: ["Look at the two letters in the middle."]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Soap." }
                options: ["sock", "sip", "soap"]
                answer: "soap"
                hints: ["Listen to the middle sound. Is it long?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Boat. Which letters are missing in the middle of boat?"
                show: { object: boat }
                frame: "b_t"
                options: ["o", "oo", "oa"]
                answer: ["oa"]
              - id: l2-n2
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Look." }
                options: ["oo", "o", "oa"]
                answer: "oo"
              - id: l2-n3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "moon" }
                options: [{ object: mum }, { object: moon }, { object: mouse }]
                answer: moon
              - id: l2-n4
                type: true_false
                text: "Does goat have oa in the middle?"
                say: "Goat. Does goat have this sound in the middle? Listen."
                audio: { sound: en.oa }
                show: { object: goat }
                answer: true
              - id: l2-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Cool." }
                options: ["coal", "cool", "cot"]
                answer: "cool"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: ee
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen. Tap the letters for the middle sound."
            audio: { en: "Seen." }
            options: ["ai", "ee", "oa"]
            answer: "ee"
          - id: l2-c2
            part: oa-oo
            type: image_multiple_choice
            text: "Which word has this sound?"
            say: "Which picture has the sound of these letters?"
            show: { drawn: letter-card, text: "oa" }
            options: [{ object: goat }, { object: cat }, { object: cup }]
            answer: goat
          - id: l2-c3
            part: igh
            type: multiple_choice
            text: "Which word goes with the picture?"
            say: "Look at the picture. Which word goes with it? Read the words."
            show: { object: light-bulb }
            options: ["lit", "light", "lot"]
            answer: "light"
            option_audio: false
          - id: l2-c4
            part: ai
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Then tap its picture."
