            type: audio_choice
            text: "Which word do you hear?"
            say: "Listen. Tap the word you hear."
            audio: { en: "Book." }
            options: ["back", "book", "boat"]
            answer: "book"
          - id: l2-c6
            part: ai
            type: audio_choice
            text: "Which letters make this sound?"
            say: "Listen to the sound. Tap its letters."
            audio: { sound: en.ai }
            options: ["ai", "a", "ee"]
            answer: "ai"
          - id: l2-c7
            part: ee
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Which picture is it?"
            show: { drawn: letter-card, text: "sheep" }
            options: [{ object: ship }, { object: sheep }, { object: shell }]
            answer: sheep
