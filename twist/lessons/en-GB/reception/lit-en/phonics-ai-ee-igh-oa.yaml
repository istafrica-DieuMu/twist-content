# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-ai-ee-igh-oa
skill: lit-en.phonics.ai-ee-igh-oa
curriculum: en-GB
language: en
title:
  de: Die Laute ai, ee, igh, oa, oo
  en: The sounds ai, ee, igh, oa, oo
summary: >
  Long vowel sounds written with two or three letters. Lesson 1 takes ai
  (rain), ee (tree) and the trigraph igh (night); lesson 2 takes oa (boat)
  and oo with its long sound (moon) and its short sound (book), mixes all
  of them and ends with the skill check. The voice says every word; the
  child picks the letters for a sound, fills a gap or reads a word and
  finds its picture.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: [lit-en.phonics.ch-sh-th-ng]
  vocabulary: { en: [sound, letters, digraph, trigraph, sound buttons, long sound, short sound] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.ai, en.ee, en.igh, en.oa, "en.oo:", en.oo]
  facets: []
  misconceptions:
    - id: vowel-letter-by-letter
      what: Sounds each vowel letter on its own (ai as a ... i, oa as o ... a) or writes one vowel for the long sound (ran for rain)
      addressed: single short vowels sit next to the digraph in l1-f2 (with feedback), l1-f5, l1-s2, l1-n1, l1-c1, l2-f1 (with feedback), l2-f2, l2-f5, l2-s3, l2-n1 and the skill check task l2-c1
    - id: igh-as-i
      what: Writes only i for the igh sound (nit for night), or does not see the three letters as one sound
      addressed: Learn in lesson 1 gives night one sound button for igh; the hints of l1-f4 say three letters make one sound; i is a distractor in l1-f4, l1-s1, l1-n5, l1-c3 and l2-c3
    - id: oo-one-sound
      what: Reads every oo with the long sound (book as booook) and gives up when it does not make a word
      addressed: Learn in lesson 2 shows the long oo of moon and the short oo of book and says to try the other sound; l2-f4 (hints), l2-s4, l2-n2 and l2-c5 use short oo words
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "ai, ee, igh", en: "ai, ee, igh" }
    new_content: true
    activities:
      - activity: learn
        mode: new-sound
        screens:
          - text: "ai"
            say: "These two letters make one long sound. Rain and snail have it in the middle. Listen, then say it with me."
            show: { drawn: letter-card, text: "ai" }
            sound: en.ai
          - text: "ee"
            say: "Two e's together make a long sound, like a big smile. Tree and bee have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "ee" }
            sound: en.ee
          - text: "igh"
            say: "These three letters make just one sound. We call three letters for one sound a trigraph. Night and light have it. Listen."
            show: { drawn: letter-card, text: "igh" }
            sound: en.igh
          - text: "n igh t → night"
            say: "Night has three sounds: n, igh, t. The three letters in the middle share one sound button. Push the sounds together: night."
            show: { drawn: letter-card, text: "n igh t" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ai" }
                options: [{ object: rain }, { object: ring }, { object: rabbit }]
                answer: rain
                feedback:
                  rabbit: "Rabbit has the short a, as in ant. These letters make the long sound ai, as in rain."
                hints:
                  - "Tap each picture and listen for a long sound."
                  - "These letters make ai. Which word has ai in the middle?"
                  - "Rain. Tap the rain."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which letters make the last sound?"
                say: "Listen to the word. Which letters make its last sound?"
                audio: { en: "Tree." }
                options: ["ee", "e", "ai"]
                answer: "ee"
                feedback:
                  "e": "One e makes the short sound in bed. Tree ends with the long sound ee, so it needs two e's."
                hints:
                  - "Listen again. Is the last sound short or long?"
                  - "The long smiley sound is two letters."
                  - "Tree ends with ee."
              - id: l1-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "bee" }
                options: [{ object: bed }, { object: bee }, { object: bell }]
                answer: bee
                hints:
                  - "Say the sounds on the card, one by one."
                  - "b, then the two e's make one long sound."
                  - "b, ee: bee. Tap the bee."
              - id: l1-f4
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Night. Which letters are missing in the middle of night?"
                frame: "n_t"
                options: ["i", "igh", "ai"]
                answer: ["igh"]
                hints:
                  - "Say night slowly: n, igh, t."
                  - "The middle sound needs three letters."
                  - "Night has igh in the middle."
              - id: l1-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Rain." }
                options: ["ran", "rain", "run"]
                answer: "rain"
                hints:
                  - "Listen to the middle sound."
                  - "It is a long sound, not a short one."
                  - "Rain."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.igh }
                options: ["igh", "i", "ee"]
                answer: "igh"
                hints: ["It is the long sound in the middle of night, and three letters make it."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which letters finish the word?"
                say: "Tree. Which letters are missing at the end of tree?"
                show: { object: tree }
                frame: "tr_"
                options: ["e", "ai", "ee"]
                answer: ["ee"]
                hints: ["Tree ends with the long smiley sound."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ai" }
                options: [{ object: sock }, { object: train }, { object: sun }]
                answer: train
                hints: ["Listen for the long sound ai in the middle."]
              - id: l1-s4
                type: true_false
                text: "Does the card say fit?"
                say: "Read the card. Does it say fit?"
                show: { drawn: letter-card, text: "feet" }
                answer: false
                hints: ["Look at the middle. One letter or two?"]
              - id: l1-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "High." }
                options: ["hit", "hen", "high"]
                answer: "high"
                hints: ["Listen to the end. Is it a long sound?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Wait." }
                options: ["a", "ai", "ee"]
                answer: "ai"
              - id: l1-n2
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "tree" }
                options: [{ object: table }, { object: teddy }, { object: tree }]
                answer: tree
              - id: l1-n3
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Seed. Which letters are missing in the middle of seed?"
                frame: "s_d"
                options: ["ee", "e", "igh"]
                answer: ["ee"]
              - id: l1-n4
                type: true_false
                text: "Does bee end with ai?"
                say: "Bee. Does bee end with the sound ai?"
                show: { object: bee }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Night." }
                options: ["nut", "night", "net"]
                answer: "night"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen. Tap the letters for the middle sound."
            audio: { en: "Sheep." }
            options: ["e", "ee", "igh"]
            answer: "ee"
          - id: l1-c2
            type: image_multiple_choice
            text: "Which word has this sound?"
            say: "Which picture has the sound of these letters?"
            show: { drawn: letter-card, text: "ai" }
            options: [{ object: paint }, { object: pig }, { object: pencil }]
            answer: paint
          - id: l1-c3
            type: fill_in_blank
            text: "Which letters are missing?"
            say: "Light. Which letters are missing in the middle of light?"
            show: { object: light-bulb }
            frame: "l_t"
            options: ["igh", "i", "ai"]
            answer: ["igh"]

  - n: 2
    title: { de: "oa und oo", en: "oa and oo" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen to the word. Which letters make its middle sound?"
            audio: { en: "Tail." }
            options: ["ai", "ee", "igh"]
            answer: "ai"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Then tap its picture."
            show: { drawn: letter-card, text: "queen" }
            options: [{ object: cup }, { object: queen }, { object: clown }]
            answer: queen
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "oa"
            say: "These two letters make one long sound, as when you say oh! Boat and goat have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "oa" }
            sound: en.oa
          - text: "oo"
            say: "Two o's together can make a long sound, as in moon and spoon. Listen, then say it with me."
            show: { object: moon }
            sound: "en.oo:"
          - text: "oo"
            say: "Sometimes the same two letters make a short sound, as in book, look and foot. Listen. If the long sound does not make a word, try the short one."
            show: { object: book }
            sound: en.oo
          - text: "g oa t → goat"
            say: "Goat has three sounds: g, oa, t. Push the sounds together: goat."
            show: { drawn: letter-card, text: "g oa t" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "oa" }
                options: [{ object: box }, { object: boat }, { object: bus }]
                answer: boat
                feedback:
                  box: "Box has the short o, as in dog. These letters make the long sound oa, as in boat."
                hints:
                  - "Tap each picture and listen for a long sound."
                  - "These letters make oa. Which word has oa in the middle?"
                  - "Boat. Tap the boat."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Moon." }
                options: ["o", "oo", "oa"]
                answer: "oo"
                hints:
                  - "Listen again. Is the middle sound oo or oa?"
                  - "Moon has the long sound oo."
                  - "Two o's: oo."
              - id: l2-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "goat" }
                options: [{ object: girl }, { object: ghost }, { object: goat }]
                answer: goat
                hints:
                  - "Say the sounds on the card, one by one."
                  - "g, then the two letters oa make one sound, then t."
                  - "g, oa, t: goat. Tap the goat."
              - id: l2-f4
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Book. Which letters are missing in the middle of book?"
                show: { object: book }
                frame: "b_k"
                options: ["oa", "o", "oo"]
                answer: ["oo"]
                hints:
                  - "Say book slowly: b, oo, k."
                  - "It is the short sound that two o's can make."
                  - "Book has oo in the middle."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Road." }
                options: ["rod", "road", "rid"]
                answer: "road"
                hints:
                  - "Listen to the middle sound."
                  - "It is long, as in boat."
                  - "Road."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Spoon. Which letters are missing in spoon?"
                show: { object: spoon }
                frame: "sp_n"
                options: ["oo", "oa", "o"]
                answer: ["oo"]
                hints: ["Spoon has the long sound oo, as in moon."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "oo" }
                options: [{ object: mouse }, { object: monkey }, { object: moon }]
                answer: moon
                hints: ["Listen for the long sound oo."]
              - id: l2-s3
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.oa }
                options: ["oo", "oa", "o"]
                answer: "oa"
                hints: ["It is the long oh sound in the middle of boat."]
              - id: l2-s4
                type: true_false
                text: "Does the card say feet?"
                say: "Read the card. Does it say feet?"
                show: { drawn: letter-card, text: "foot" }
                answer: false
                hints: ["Look at the two letters in the middle."]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Soap." }
                options: ["sock", "sip", "soap"]
                answer: "soap"
                hints: ["Listen to the middle sound. Is it long?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Boat. Which letters are missing in the middle of boat?"
                show: { object: boat }
                frame: "b_t"
                options: ["o", "oo", "oa"]
                answer: ["oa"]
              - id: l2-n2
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Look." }
                options: ["oo", "o", "oa"]
                answer: "oo"
              - id: l2-n3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "moon" }
                options: [{ object: mum }, { object: moon }, { object: mouse }]
                answer: moon
              - id: l2-n4
                type: true_false
                text: "Does goat have oa in the middle?"
                say: "Goat. Does goat have the sound oa in the middle?"
                show: { object: goat }
                answer: true
              - id: l2-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Cool." }
                options: ["coal", "cool", "cot"]
                answer: "cool"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen. Tap the letters for the middle sound."
            audio: { en: "Seen." }
            options: ["ai", "ee", "oa"]
            answer: "ee"
          - id: l2-c2
            type: image_multiple_choice
            text: "Which word has this sound?"
            say: "Which picture has the sound of these letters?"
            show: { drawn: letter-card, text: "oa" }
            options: [{ object: goat }, { object: cat }, { object: cup }]
            answer: goat
          - id: l2-c3
            type: fill_in_blank
            text: "Which letters finish the word?"
            say: "High. Which letters are missing at the end of high?"
            frame: "h_"
            options: ["i", "igh", "ee"]
            answer: ["igh"]
          - id: l2-c4
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Then tap its picture."
            show: { drawn: letter-card, text: "snail" }
            options: [{ object: snake }, { object: sun }, { object: snail }]
            answer: snail
          - id: l2-c5
            type: audio_choice
            text: "Which word do you hear?"
            say: "Listen. Tap the word you hear."
            audio: { en: "Book." }
            options: ["back", "book", "boat"]
            answer: "book"
