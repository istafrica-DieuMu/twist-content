# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-ch-sh-th-ng
skill: lit-en.phonics.ch-sh-th-ng
curriculum: en-GB
language: en
title:
  de: Die Laute ch, sh, th, ng
  en: The sounds ch, sh, th, ng
summary: >
  The first digraphs: two letters that make one sound. Lesson 1 takes ch
  (chip, chop) and sh (shop, fish); lesson 2 takes th (thin, moth) and ng
  (ring, long), mixes all four and ends with the skill check. Every word
  is spoken by the voice; the child picks the digraph that makes a sound,
  finishes a word with it, or reads a word and finds its picture.
  Writing the digraphs in words is practised in Practise (what is
  missing) and in segment-spell; the skill check marks hearing each
  digraph's sound and reading words with it.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: []
  vocabulary: { en: [sound, letters, digraph, sound buttons, blend, word] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.ch, en.sh, en.th, en.ng]
  facets: []
  parts:
    - { id: ch, what: { de: "den Laut von ch kennen und Wörter damit lesen", en: "knowing the sound of ch and reading words with it" } }
    - { id: sh, what: { de: "den Laut von sh kennen und Wörter damit lesen", en: "knowing the sound of sh and reading words with it" } }
    - { id: th, what: { de: "den Laut von th kennen und Wörter damit lesen", en: "knowing the sound of th and reading words with it" } }
    - { id: ng, what: { de: "den Laut von ng kennen und Wörter damit lesen", en: "knowing the sound of ng and reading words with it" } }
  misconceptions:
    - id: digraph-two-sounds
      what: Says one sound for each letter of a digraph (s ... h for sh, n ... g for ng)
      addressed: Learn in both lessons counts fish, chip and ring as three sounds with one sound button under the two letters; the hints of l1-f2 and l2-f3 say two letters make one sound; s, n and g are distractors next to sh and ng in l1-f2 (with feedback), l1-s3, l1-c3, l2-s1, l2-s3, l2-n2 and l2-c4
    - id: ch-sh-mixed
      what: Mixes up ch and sh, which sound alike to young children (chip as ship)
      addressed: ch and sh share the options in l1-f1 (with feedback), l1-f5, l1-s4, l1-n1, l1-n5, l1-c2, l2-n5 and the skill check task l2-c1
    - id: th-as-f
      what: Hears and writes th as f or t (fin for thin, bat for bath)
      addressed: f and t are distractors next to th in l2-f1 (with feedback), l2-f3, l2-n1 and l2-c3; Learn in lesson 2 shows the tongue between the teeth
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "ch und sh", en: "ch and sh" }
    goal:
      de: "Lerne zwei Buchstaben, die zusammen einen Laut machen, so wie in chip und fish."
      en: "Learn two letters that make one sound together, like in chip and fish."
    new_content: true
    activities:
      - activity: learn
        mode: new-sound
        screens:
          - text: "ch"
            say: "These two letters make one sound together, like a little sneeze. Chair and cheese start with it. Listen, then say it with me."
            show: { drawn: letter-card, text: "ch" }
            sound: en.ch
          - text: "sh"
            say: "These two letters make one sound too, the sound we make when a baby is asleep. Shell and ship start with it. Listen, then say it with me."
            show: { drawn: letter-card, text: "sh" }
            sound: en.sh
          - text: "f i sh → fish"
            say: "Fish has three sounds. The last two letters make one sound, so they share one sound button. Push the sounds together: fish."
            show: { drawn: letter-card, text: "f i sh" }
          - text: "ch i p → chip"
            say: "Chip has three sounds too. The first two letters make the sneeze sound. Push the sounds together: chip."
            show: { drawn: letter-card, text: "ch i p" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "What starts with this sound?"
                say: "Look at the letters. What starts with their sound? Tap the picture."
                show: { drawn: letter-card, text: "ch" }
                options: [{ object: cheese }, { object: shell }, { object: cat }]
                answer: cheese
                feedback:
                  shell: "Shell starts with the quiet sound. These letters make the sneeze sound, like in chair."
                hints:
                  - "Tap each picture and listen to the start."
                  - "These letters make the sneeze sound, like in chair."
                  - "Cheese starts with these letters. Tap the cheese."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.sh }
                options: ["sh", "s", "ch"]
                answer: "sh"
                feedback:
                  "s": "That letter makes the snake sound, like in sun. This is the quiet sound at the start of shoe."
                hints:
                  - "Listen again. Is it a snake sound or a quiet sound?"
                  - "Two letters make the quiet sound together, like at the start of shoe."
                  - "It is the two letters at the start of shoe. Tap them."
              - id: l1-f3
                type: true_false
                text: "Does chair start with ch?"
                say: "Chair. Does chair start with the sneeze sound?"
                show: { object: chair }
                answer: true
                hints:
                  - "Say chair slowly. Listen to the start."
                  - "Is the first sound a little sneeze?"
                  - "Yes. Chair starts with the sneeze sound."
              - id: l1-f4
                type: fill_in_blank
                text: "What is missing?"
                say: "Fish. What is missing at the end of fish?"
                show: { object: fish }
                frame: "fi_"
                options: ["sh", "ch", "s"]
                answer: ["sh"]
                hints:
                  - "Say fish slowly. Listen to the end."
                  - "The end is the quiet sound."
                  - "Fish ends with the two letters at the start of shoe."
              - id: l1-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Chop." }
                options: ["chop", "shop", "top"]
                answer: "chop"
                hints:
                  - "Listen to the first sound."
                  - "It starts with the sneeze sound."
                  - "The word is chop."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "What starts with this sound?"
                say: "Look at the letters. What starts with their sound? Tap the picture."
                show: { drawn: letter-card, text: "sh" }
                options: [{ object: shoe }, { object: sock }, { object: cheese }]
                answer: shoe
                hints: ["These letters make the quiet sound, like at the start of shell."]
              - id: l1-s2
                type: audio_choice
                text: "Which letters make the last sound?"
                say: "Listen to the word. Which letters make its last sound?"
                audio: { en: "Much." }
                options: ["ch", "sh", "t"]
                answer: "ch"
                hints: ["Is the last sound a sneeze or a quiet sound?"]
              - id: l1-s3
                type: fill_in_blank
                text: "What is missing?"
                say: "Shop. What is missing at the start of shop?"
                show: { object: shop }
                frame: "_op"
                options: ["s", "sh", "ch"]
                answer: ["sh"]
                hints: ["Shop starts with the quiet sound. Two letters make it."]
              - id: l1-s4
                type: true_false
                text: "Does the card say chip?"
                say: "Read the card. Does it say chip?"
                show: { drawn: letter-card, text: "ship" }
                answer: false
                hints: ["Say the first sound on the card. Is it the sneeze sound or the quiet sound?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which ends with this sound?"
                say: "Look at the letters. Which word ends with their sound? Tap the picture."
                show: { drawn: letter-card, text: "sh" }
                options: [{ object: fish }, { object: frog }, { object: bus }]
                answer: fish
                hints: ["Say each word slowly and listen to the end."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letters make the first sound?"
                say: "Listen to the word. Which letters make its first sound?"
                audio: { en: "Chin." }
                options: ["sh", "c", "ch"]
                answer: "ch"
              - id: l1-n2
                type: fill_in_blank
                text: "What is missing?"
                say: "Dish. What is missing at the end of dish?"
                show: { object: dish }
                frame: "di_"
                options: ["ch", "s", "sh"]
                answer: ["sh"]
              - id: l1-n3
                type: image_multiple_choice
                text: "What starts with this sound?"
                say: "Look at the letters. What starts with their sound? Tap the picture."
                show: { drawn: letter-card, text: "ch" }
                options: [{ object: sun }, { object: chalk }, { object: shoe }]
                answer: chalk
              - id: l1-n4
                type: true_false
                text: "Does shell start with ch?"
                say: "Shell. Does shell start with the sneeze sound?"
                show: { object: shell }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Shed." }
                options: ["shed", "chin", "shop"]
                answer: "shed"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "What starts with this sound?"
            say: "Which picture starts with the sound of these letters?"
            show: { drawn: letter-card, text: "sh" }
            options: [{ object: chair }, { object: shell }, { object: sun }]
            answer: shell
          - id: l1-c2
            type: audio_choice
            text: "Which letters make the first sound?"
            say: "Listen. Tap the letters for the first sound."
            audio: { en: "Chips." }
            options: ["ch", "sh", "s"]
            answer: "ch"
          - id: l1-c3
            type: fill_in_blank
            text: "What is missing?"
            say: "Ship. What is missing at the start of ship?"
            show: { object: ship }
            frame: "_ip"
            options: ["sh", "ch", "s"]
            answer: ["sh"]
          - id: l1-c4
            type: true_false
            text: "Does chair start with sh?"
            say: "Chair. Does chair start with the quiet sound?"
            show: { object: chair }
            answer: false
          - id: l1-c5
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "Shop." }
            options: ["chop", "sock", "shop"]
            answer: "shop"
          - id: l1-c6
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Which picture is it?"
            show: { drawn: letter-card, text: "dish" }
            options: [{ object: duck }, { object: dish }, { object: fish }]
            answer: dish
            option_audio: false

  - n: 2
    title: { de: "th und ng", en: "th and ng" }
    goal:
      de: "Lerne die Laute am Anfang von thin und am Ende von ring und lies Wörter damit."
      en: "Learn the sounds at the start of thin and the end of ring, and read words with them."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "What starts with this sound?"
            say: "Look at the letters. What starts with their sound? Tap the picture."
            show: { drawn: letter-card, text: "ch" }
            options: [{ object: chair }, { object: fish }, { object: sock }]
            answer: chair
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "What is missing?"
            say: "Shell. What is missing at the start of shell?"
            show: { object: shell }
            frame: "_ell"
            options: ["sh", "ch", "s"]
            answer: ["sh"]
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "th"
            say: "These two letters make one sound. Let your tongue peep out between your teeth and blow gently. Thin and thumb start with it. Listen, then say it with me."
            show: { drawn: letter-card, text: "th" }
            sound: en.th
          - text: "mouth"
            say: "Mouth ends with this sound. Listen to the end: mouth. Your tongue peeps out at the end."
            show: { object: mouth }
          - text: "ng"
            say: "These two letters make one sound together, at the back of your mouth. Ring and sing end with it. Listen, then say it with me."
            show: { drawn: letter-card, text: "ng" }
            sound: en.ng
          - text: "r i ng → ring"
            say: "Ring has three sounds. The last two letters make one sound, so they share one sound button. Push the sounds together: ring."
            show: { drawn: letter-card, text: "r i ng" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which letters make the first sound?"
                say: "Listen to the word. Which letters make its first sound?"
                audio: { en: "Thin." }
                options: ["th", "f", "t"]
                answer: "th"
                feedback:
                  "f": "For that letter your teeth touch your lip. At the start of thin, your tongue peeps out."
                hints:
                  - "Listen again. Does your tongue peep out?"
                  - "Two letters make the sound with your tongue between your teeth."
                  - "Thin starts with two letters. Tap the two letters."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Which ends with this sound?"
                say: "Look at the letters. Which word ends with their sound? Tap the picture."
                show: { drawn: letter-card, text: "ng" }
                options: [{ object: sing }, { object: sun }, { object: sock }]
                answer: sing
                hints:
                  - "Tap each picture and listen to the end."
                  - "These letters make the sound at the end of ring."
                  - "Sing ends with these letters. Tap the child singing."
              - id: l2-f3
                type: fill_in_blank
                text: "What is missing?"
                say: "Mouth. What is missing at the end of mouth?"
                show: { object: mouth }
                frame: "mou_"
                options: ["f", "th", "t"]
                answer: ["th"]
                feedback:
                  "f": "Nearly! At the end of mouth your tongue peeps out. Two letters make that one sound."
                hints:
                  - "Say mouth slowly. Feel where your tongue goes at the end."
                  - "Your tongue peeps out, so two letters make the sound."
                  - "Mouth ends with two letters. Tap the two letters."
              - id: l2-f4
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "ring" }
                options: [{ object: ring }, { object: rose }, { object: rabbit }]
                answer: ring
                hints:
                  - "Say the sounds on the card, one by one."
                  - "The first sound, the middle sound, then the two letters at the end make one sound."
                  - "The card says ring. Tap the ring."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Moth." }
                options: ["moth", "mop", "moss"]
                answer: "moth"
                hints:
                  - "Listen to the last sound."
                  - "Your tongue peeps out at the end."
                  - "The word is moth."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.ng }
                options: ["n", "ng", "g"]
                answer: "ng"
                hints: ["The sound is at the back of your mouth, as at the end of ring. Two letters make it."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which ends with this sound?"
                say: "Look at the letters. Which word ends with their sound? Tap the picture."
                show: { drawn: letter-card, text: "th" }
                options: [{ object: mouse }, { object: mouth }, { object: moon }]
                answer: mouth
                hints: ["Say each word. At the end of which one does your tongue peep out?"]
              - id: l2-s3
                type: fill_in_blank
                text: "What is missing?"
                say: "Ring. What is missing at the end of ring?"
                show: { object: ring }
                frame: "ri_"
                options: ["g", "n", "ng"]
                answer: ["ng"]
                hints: ["The end of ring is one sound, made by two letters."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "shell" }
                options: [{ object: sun }, { object: shoe }, { object: shell }]
                answer: shell
                hints: ["The first two letters make the quiet sound. What comes after it?"]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "This." }
                options: ["tin", "this", "his"]
                answer: "this"
                hints: ["Listen to the first sound. Does your tongue peep out?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which letters make the last sound?"
                say: "Listen to the word. Which letters make its last sound?"
                audio: { en: "Bath." }
                options: ["t", "f", "th"]
                answer: "th"
              - id: l2-n2
                type: fill_in_blank
                text: "What is missing?"
                say: "Sing. What is missing at the end of sing?"
                show: { object: sing }
                frame: "si_"
                options: ["ng", "n", "g"]
                answer: ["ng"]
              - id: l2-n3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "fish" }
                options: [{ object: frog }, { object: fish }, { object: fox }]
                answer: fish
              - id: l2-n4
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Thick." }
                options: ["tick", "chick", "thick"]
                answer: "thick"
              - id: l2-n5
                type: fill_in_blank
                text: "What is missing?"
                say: "What is missing at the start of this word? Listen."
                audio: { en: "Chin." }
                frame: "_in"
                options: ["sh", "ch", "th"]
                answer: ["ch"]

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: sh
            type: audio_choice
            text: "Which letters make the first sound?"
            say: "Listen. Tap the letters for the first sound."
            audio: { en: "Shut." }
            options: ["ch", "sh", "th"]
            answer: "sh"
          - id: l2-c2
            part: ch
            type: image_multiple_choice
            text: "What starts with this sound?"
            say: "Which picture starts with the sound of these letters?"
            show: { drawn: letter-card, text: "ch" }
            options: [{ object: sheep }, { object: sun }, { object: church }]
            answer: church
          - id: l2-c3
            part: th
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Which picture is it?"
            show: { drawn: letter-card, text: "bath" }
            options: [{ object: bed }, { object: bath }, { object: ball }]
            answer: bath
            option_audio: false
          - id: l2-c4
            part: ng
            type: audio_choice
            text: "Which letters make the last sound?"
            say: "Listen. Tap the letters for the last sound."
            audio: { en: "King." }
            options: ["ng", "n", "g"]
            answer: "ng"
          - id: l2-c5
            part: ng
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Then tap its picture."
            show: { drawn: letter-card, text: "sing" }
            options: [{ object: swim }, { object: sing }, { object: sit-down }]
            answer: sing
            option_audio: false
          - id: l2-c6
            part: ch
            type: audio_choice
            text: "Which letters make this sound?"
            say: "Listen to the sound. Tap its letters."
            audio: { sound: en.ch }
            options: ["sh", "th", "ch"]
            answer: "ch"
          - id: l2-c7
            part: sh
            type: image_multiple_choice
            text: "What starts with this sound?"
            say: "Which picture starts with the sound of these letters?"
            show: { drawn: letter-card, text: "sh" }
            options: [{ object: chair }, { object: sheep }, { object: sock }]
            answer: sheep
          - id: l2-c8
            part: th
            type: image_multiple_choice
            text: "Which ends with this sound?"
            say: "Which word ends with the sound of these letters? Tap the picture."
            show: { drawn: letter-card, text: "th" }
            options: [{ object: tooth }, { object: moon }, { object: tree }]
            answer: tooth
          - id: l2-c9
            part: ng
            type: audio_choice
            text: "Which letters make this sound?"
            say: "Listen to the sound. Tap its letters."
            audio: { sound: en.ng }
            options: ["ng", "th", "n"]
            answer: "ng"
          - id: l2-c10
            part: ch
            type: true_false
            text: "Does cheese start with sh?"
            say: "Cheese. Does cheese start with the quiet sound?"
            show: { object: cheese }
            answer: false
          - id: l2-c11
            part: sh
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Which picture is it?"
            show: { drawn: letter-card, text: "ship" }
            options: [{ object: shell }, { object: sheep }, { object: ship }]
            answer: ship
            option_audio: false
          - id: l2-c12
            part: th
            type: true_false
            text: "Does mouth end with th?"
            say: "Mouth. Does mouth end with the sound of these letters?"
            show: { object: mouth }
            answer: true
          - id: l2-c13
            part: ng
            type: true_false
            text: "Does swim end with ng?"
            say: "Swim. Does swim end with the sound of these letters?"
            show: { object: swim }
            answer: false
          - id: l2-c14
            part: ch
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "Chat." }
            options: ["that", "chat", "cat"]
            answer: "chat"
          - id: l2-c15
            part: sh
            type: true_false
            text: "shop"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: shop }
            answer: true
          - id: l2-c16
            part: th
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "Then." }
            options: ["ten", "hen", "then"]
            answer: "then"
