# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.pencil-grip
skill: lit-en.handwriting.pencil-grip
curriculum: en-GB
language: en
title:
  de: Gut sitzen und den Stift halten
  en: Sitting well and holding a pencil
summary: >
  Getting ready to write: sitting well at a table and holding a pencil
  with a tripod grip, gently and near the point. Lesson 1 sets out how to
  sit and the three fingers of the grip; lesson 2 shows the pinch and
  flip, the same grip for crayons and chalk and for left-handers, and
  ends with the skill check. The app cannot see how a child sits or
  holds the pencil, so the tasks ask about it in pictures and spoken
  choices, and tracing lets the child try the grip; an adult watching is
  still the real check. The skill check marks what a screen can mark:
  knowing how to sit, which fingers hold the pencil, holding it gently
  near the point, and the same grip for other tools and either hand;
  sitting and holding the pencil themselves are practised in Practise
  (tracing).
metadata:
  year: reception
  topic: { de: "Handschrift", en: "Handwriting" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: []
  vocabulary: { en: [pencil, tripod grip, thumb, pointing finger, middle finger, sit tall, feet flat, gently] }
  no_reading: true
  forms: [picture, audio, drawn]
  drawn: [writing-lines]
  facets: [script]
  parts:
    - { id: sit, what: { de: "wissen, wie man zum Schreiben gut sitzt", en: knowing how to sit well to write } }
    - { id: grip, what: { de: die drei Finger des Dreipunktgriffs kennen, en: knowing the three fingers of the tripod grip } }
    - { id: gentle-near, what: { de: den Stift locker und nah an der Spitze halten, en: holding the pencil gently and near the point } }
    - { id: tools, what: { de: "denselben Griff für Buntstift, Kreide und beide Hände kennen", en: "knowing the same grip for crayons, chalk and either hand" } }
  misconceptions:
    - id: fist-grip
      what: Holds the pencil in a fist or with all the fingers wrapped round it
      addressed: Learn in both lessons names the three fingers; l1-f2 (with feedback), l1-s4, l1-n3, l1-c1 (the tripod and fist pictures), l2-w1, l2-n1, l2-n2 (the fist picture) and the skill check task l2-c2 (the tripod picture)
    - id: grip-too-tight
      what: Squeezes the pencil hard, so the hand tires and the fingers hurt
      addressed: Learn in lesson 1 says hold it gently; l1-s5, l2-s4 and l2-c3
    - id: grip-far-from-point
      what: Holds the pencil at the top end, far from the point, so the lines wobble
      addressed: Learn in lesson 2 pinches near the point; l1-s1, l2-f5 and l2-c5
    - id: slouched-posture
      what: Writes slumped, standing, or far from the table
      addressed: Learn in lesson 1 sets out how to sit; l1-f1, l1-f3, l1-n1, l1-n5, l1-c3, l2-s1 and l2-c1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gut sitzen, drei Finger", en: "Sit well, three fingers" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Before you write, sit well. Bottom at the back of the chair. Back tall. Feet flat on the floor. Pull your chair close to the table."
            show: { object: sit-down }
          - say: "Now the pencil. Pinch it near the point with your thumb and your pointing finger. Let it rest on your middle finger. Three fingers: that is a tripod grip."
            show: { object: grip-tripod }
          - say: "Not like this. When the whole hand holds the pencil in a fist, the pencil wobbles and writing is hard. Use your three fingers."
            show: { object: grip-fist }
          - say: "Hold the pencil gently, not too tight. Your other hand holds the paper still."
            show: { object: hand }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Who is ready to write?"
                say: "Which child is sitting ready to write? Tap the picture."
                options: [{ object: jump }, { object: sit-down }, { object: dance }]
                answer: sit-down
                hints:
                  - "You write sitting at a table."
                  - "Look for the child on a chair."
                  - "The child sitting on the chair is ready. Tap that picture."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many fingers hold the pencil in a tripod grip?"
                say: "How many fingers hold the pencil in a tripod grip?"
                options: ["1", "2", "3"]
                answer: "3"
                feedback:
                  "2": "Nearly! Thumb and pointing finger pinch it, and the middle finger is the third: the pencil rests on it."
                hints:
                  - "Think of the thumb, the pointing finger and the finger the pencil rests on."
                  - "Thumb is one, pointing finger is two, middle finger is ..."
                  - "Three fingers."
              - id: l1-f3
                type: true_false
                text: "Feet flat on the floor is a good way to sit."
                say: "Listen. You sit with your feet flat on the floor. Is that a good way to sit for writing?"
                show: { object: foot }
                answer: true
                hints:
                  - "Think of a tall, steady way to sit."
                  - "Feet on the floor keep you still."
                  - "Yes. Feet flat on the floor."
              - id: l1-f4
                type: image_multiple_choice
                text: "Which one do you write with?"
                say: "Which one do you hold with a tripod grip to write? Tap the picture."
                options: [{ object: scissors }, { object: cup }, { object: pencil }]
                answer: pencil
                hints:
                  - "Which one makes marks on paper?"
                  - "You hold it with three fingers, near the point."
                  - "The pencil. Tap the pencil."
              - id: l1-f5
                type: tracing
                text: "Trace the line."
                say: "Hold your pencil with three fingers. Trace a long line from the top down to the bottom."
                show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }
                char: "l"

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Hold the pencil at the top end, far from the point."
                say: "Listen. You hold the pencil right at the top end, far from the point. Is that right?"
                show: { object: pencil }
                answer: false
                hints: ["Where are your fingers when you pinch the pencil?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Where do you write?"
                say: "Where is the best place to sit and write? Tap the picture."
                options: [{ object: bed }, { object: sofa }, { object: table }]
                answer: table
                hints: ["You need a flat, steady place and a chair."]
              - id: l1-s3
                type: tracing
                text: "Trace the round shape."
                say: "Hold your pencil gently. Trace the round shape. Start at the top and go round to the left."
                show: { drawn: writing-lines, text: "o", mode: trace, arrows: true }
                char: "o"
              - id: l1-s4
                type: multiple_choice
                text: "Which finger does the pencil rest on?"
                say: "In a tripod grip, which finger does the pencil rest on?"
                options: ["the thumb", "the middle finger", "the little finger"]
                answer: "the middle finger"
                hints: ["Thumb and pointing finger pinch. The pencil sits on the next finger."]
              - id: l1-s5
                type: true_false
                text: "Squeeze the pencil as hard as you can."
                say: "Listen. You squeeze the pencil as hard as you can. Is that right?"
                show: { object: hand }
                answer: false
                hints: ["Should your hand feel tight or soft?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Who is ready to write?"
                say: "Which child is sitting ready to write? Tap the picture."
                options: [{ object: ride-bike }, { object: sing }, { object: sit-down }]
                answer: sit-down
              - id: l1-n2
                type: true_false
                text: "Your other hand holds the paper still."
                say: "Listen. Your other hand holds the paper still. Is that right?"
                show: { object: hand }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Which fingers pinch the pencil?"
                say: "Which fingers pinch the pencil?"
                options: ["the thumb and the pointing finger", "the two little fingers", "the whole hand"]
                answer: "the thumb and the pointing finger"
              - id: l1-n4
                type: tracing
                text: "Trace the curve."
                say: "Hold your pencil with three fingers. Trace the curve. Start at the top and go round."
                show: { drawn: writing-lines, text: "c", mode: trace, arrows: true }
                char: "c"
              - id: l1-n5
                type: true_false
                text: "Lean back, far from the table, to write."
                say: "Listen. You lean back on your chair, far from the table. Is that a good way to write?"
                show: { object: chair }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which hand is ready to write?"
            say: "Look at the two hands. Which one holds the pencil well, ready to write? Tap the picture."
            options: [{ object: grip-fist }, { object: grip-tripod }]
            answer: grip-tripod
            option_audio: false
          - id: l1-c2
            type: image_multiple_choice
            text: "Which one do you write with?"
            say: "Which one do you hold to write your name? Tap the picture."
            options: [{ object: pencil }, { object: spoon }, { object: ruler }]
            answer: pencil
          - id: l1-c3
            type: true_false
            text: "Sit with a tall back to write."
            say: "Listen. You sit with a tall back to write. Is that right?"
            show: { object: sit-down }
            answer: true
          - id: l1-c4
            type: true_false
            text: "Sit on the edge of your chair and swing your feet."
            say: "Listen. You sit on the edge of your chair and swing your feet. Is that a good way to sit for writing?"
            show: { object: chair }
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Who is ready to write?"
            say: "Which child is sitting ready to write? Tap the picture."
            options: [{ object: swim }, { object: sit-down }, { object: play-tennis }]
            answer: sit-down
          - id: l1-c6
            type: true_false
            text: "The thumb, the pointing finger and the middle finger hold the pencil."
            say: "Listen. Your thumb, your pointing finger and your middle finger hold the pencil. Is that right?"
            show: { object: grip-tripod }
            answer: true

  - n: 2
    title: { de: "Kneifen und umdrehen", en: "Pinch and flip" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which finger does the pencil rest on?"
            say: "Remember the tripod grip. Which finger does the pencil rest on?"
            options: ["the little finger", "the thumb", "the middle finger"]
            answer: "the middle finger"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "When you write, your feet are flat on the floor."
            say: "Listen. When you write, your feet are flat on the floor. Is that right?"
            show: { object: sit-down }
            answer: true
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - say: "Pinch and flip! Put your pencil on the table, with the point towards you. Pinch it near the point with your thumb and pointing finger. Now flip it back so it rests on your middle finger. Ready to write!"
            show: { object: pencil }
          - say: "Crayons and chalk use the same grip: three fingers, near the end you draw with."
            show: { object: crayon }
          - say: "Some children write with their left hand, some with their right. The grip is the same. Tilt your paper a little so you can see what you write."
            show: { object: hand }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Put the steps of pinch and flip in order."
                say: "Put the steps of pinch and flip in order. Tap each card to hear it."
                options: ["Flip it onto your middle finger.", "Put the pencil down, point towards you.", "Pinch it near the point."]
                slot_count: 3
                answer: ["Put the pencil down, point towards you.", "Pinch it near the point.", "Flip it onto your middle finger."]
                hints:
                  - "What do you do before you pick it up?"
                  - "First the pencil goes on the table. Then you pinch."
                  - "Put it down, pinch it, flip it."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Which one do you hold with a tripod grip too?"
                say: "Which one do you hold with a tripod grip too? Tap the picture."
                options: [{ object: ball }, { object: crayon }, { object: cup }]
                answer: crayon
                hints:
                  - "Which one do you draw with?"
                  - "It makes marks, like a pencil."
                  - "The crayon. Tap the crayon."
              - id: l2-f3
                type: true_false
                text: "Children who write with their left hand need a different grip."
                say: "Listen. Children who write with their left hand need a different grip. Is that right?"
                show: { object: hand }
                answer: false
                hints:
                  - "Think about the three fingers."
                  - "Left hand or right hand, which fingers hold the pencil?"
                  - "No. The grip is the same with either hand."
              - id: l2-f4
                type: tracing
                text: "Trace the letter."
                say: "Pinch and flip your pencil. Trace this letter: a line down, then the dot on top."
                show: { drawn: writing-lines, text: "i", mode: trace, arrows: true }
                char: "i"
              - id: l2-f5
                type: multiple_choice
                text: "Where do you hold the pencil?"
                say: "Where do your fingers hold the pencil?"
                options: ["at the very top", "near the point", "in the middle"]
                answer: "near the point"
                feedback:
                  "at the very top": "Up there the pencil wobbles. Hold it near the point, so you can steer it."
                hints:
                  - "Where did you pinch it?"
                  - "Close to the end that writes."
                  - "Near the point."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Who is ready to write?"
                say: "Which child is sitting ready to write? Tap the picture."
                options: [{ object: play-football }, { object: sit-down }, { object: jump }]
                answer: sit-down
                hints: ["Look for the child sitting still on a chair."]
              - id: l2-s2
                type: true_false
                text: "Your pencil rests on your middle finger."
                say: "Listen. Your pencil rests on your middle finger. Is that right?"
                show: { object: pencil }
                answer: true
                hints: ["Pinch with two fingers. Where does the pencil rest?"]
              - id: l2-s3
                type: tracing
                text: "Trace the letter."
                say: "Hold your pencil gently. Trace this letter: down, round and up, then down again."
                show: { drawn: writing-lines, text: "u", mode: trace, arrows: true }
                char: "u"
              - id: l2-s4
                type: multiple_choice
                text: "Your fingers hurt when you write. What can you do?"
                say: "When you write, your fingers start to hurt. What can you do?"
                options: ["press harder", "hold the pencil more gently", "hold it in your fist"]
                answer: "hold the pencil more gently"
                hints: ["A tight grip makes your hand tired."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Which one also needs a tripod grip?"
                say: "Which one also needs a tripod grip? Tap the picture."
                options: [{ object: apple }, { object: ball }, { object: chalk }]
                answer: chalk
                hints: ["Which one do you write with on a board?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many fingers does a tripod grip use?"
                say: "A tripod has three legs. How many fingers does a tripod grip use?"
                options: ["2", "3", "5"]
                answer: "3"
              - id: l2-n2
                type: true_false
                text: "Holding the pencil in your fist is a tripod grip."
                say: "Look at this hand. It holds the pencil in a fist, like holding an ice cream. Is that a tripod grip?"
                show: { object: grip-fist }
                answer: false
              - id: l2-n3
                type: tracing
                text: "Trace the letter."
                say: "Pinch and flip your pencil. Trace this letter: start at the top, go back and round, then up and straight down."
                show: { drawn: writing-lines, text: "a", mode: trace, arrows: true }
                char: "a"
              - id: l2-n4
                type: image_multiple_choice
                text: "Where do you write?"
                say: "Where is the best place to sit and write? Tap the picture."
                options: [{ object: table }, { object: bed }, { object: swimming-pool }]
                answer: table
              - id: l2-n5
                type: multiple_choice
                text: "What does your other hand do?"
                say: "One hand holds the pencil. What does your other hand do?"
                options: ["it waves in the air", "it holds the paper still", "it holds a crayon too"]
                answer: "it holds the paper still"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: sit
            type: image_multiple_choice
            text: "Who is ready to write?"
            say: "Which child is ready to write? Tap the picture."
            options: [{ object: wave }, { object: dance }, { object: sit-down }]
            answer: sit-down
          - id: l2-c2
            part: grip
            type: true_false
            text: "This hand holds the pencil in a tripod grip."
            say: "Look at this hand. Does it hold the pencil in a tripod grip?"
            show: { object: grip-tripod }
            answer: true
          - id: l2-c3
            part: gentle-near
            type: true_false
            text: "Squeeze the pencil so tight that your fingers go white."
            say: "Listen. You squeeze the pencil so tight that your fingers go white. Is that right?"
            show: { object: pencil }
            answer: false
          - id: l2-c4
            part: tools
            type: image_multiple_choice
            text: "Which one do you hold with a tripod grip?"
            say: "Which one do you hold with a tripod grip? Tap the picture."
            options: [{ object: shoe }, { object: pen }, { object: apple }]
            answer: pen
          - id: l2-c5
            part: gentle-near
            type: multiple_choice
            text: "Your lines are wobbly. Where should your fingers go?"
            say: "Your lines are wobbly. Where should your fingers go on the pencil?"
            options: ["at the top end", "nearer the point", "all round it in a fist"]
            answer: "nearer the point"
          - id: l2-c6
            part: sit
            type: true_false
            text: "Pull your chair close to the table before you write."
            say: "Listen. You pull your chair close to the table before you write. Is that right?"
            show: { object: chair }
            answer: true
          - id: l2-c7
            part: grip
            type: multiple_choice
            text: "What is a tripod grip?"
            say: "What is a tripod grip?"
            options: ["three fingers hold the pencil", "the whole hand holds the pencil", "two hands hold the pencil"]
            answer: "three fingers hold the pencil"
          - id: l2-c8
            part: gentle-near
            type: true_false
            text: "Hold your pencil gently, not too tight."
            say: "Listen. You hold your pencil gently, not too tight. Is that right?"
            show: { object: hand }
            answer: true
          - id: l2-c9
            part: tools
            type: true_false
            text: "You hold a crayon in your fist."
            say: "Listen. You hold a crayon in your fist, with your whole hand round it. Is that right?"
            show: { object: crayon }
            answer: false
          - id: l2-c10
            part: sit
            type: multiple_choice
            text: "Where do your feet go when you write?"
            say: "Where do your feet go when you sit and write?"
            options: ["up on the chair", "flat on the floor", "swinging in the air"]
            answer: "flat on the floor"
          - id: l2-c11
            part: grip
            type: true_false
            text: "In a tripod grip, the pencil rests on your thumb."
            say: "Listen. In a tripod grip, the pencil rests on your thumb. Is that right?"
            show: { object: pencil }
            answer: false
          - id: l2-c12
            part: gentle-near
            type: true_false
            text: "Pinch the pencil near the point."
            say: "Listen. You pinch the pencil near the point. Is that right?"
            show: { object: pencil }
            answer: true
          - id: l2-c13
            part: tools
            type: true_false
            text: "Children who write with their left hand hold the pencil with three fingers too."
            say: "Listen. Children who write with their left hand hold the pencil with three fingers too. Is that right?"
            show: { object: hand }
            answer: true
          - id: l2-c14
            part: sit
            type: true_false
            text: "Stand up when you write at the table."
            say: "Listen. You stand up when you write at the table. Is that right?"
            show: { object: stand-up }
            answer: false
          - id: l2-c15
            part: grip
            type: true_false
            text: "Your thumb and pointing finger pinch the pencil."
            say: "Look at this hand. Your thumb and your pointing finger pinch the pencil. Is that right?"
            show: { object: grip-tripod }
            answer: true
          - id: l2-c16
            part: gentle-near
            type: multiple_choice
            text: "You hold the pencil at the very top. What happens?"
            say: "You hold the pencil right at the very top. What happens to your lines?"
            options: ["the lines wobble", "the lines are neat"]
            answer: "the lines wobble"
          - id: l2-c17
            part: tools
            type: multiple_choice
            text: "You write with your left hand. What helps you see what you write?"
            say: "You write with your left hand. What helps you see what you write?"
            options: ["tilt your paper a little", "hold the pencil in your fist", "write with your eyes shut"]
            answer: "tilt your paper a little"
          - id: l2-c18
            part: sit
            type: multiple_choice
            text: "How do you sit to write?"
            say: "How do you sit when you write?"
            options: ["leaning far back", "with a tall back", "curled up small"]
            answer: "with a tall back"
          - id: l2-c19
            part: grip
            type: multiple_choice
            text: "Which finger does not hold the pencil?"
            say: "In a tripod grip, which finger does not hold the pencil?"
            options: ["the thumb", "the pointing finger", "the little finger"]
            answer: "the little finger"
          - id: l2-c20
            part: tools
            type: image_multiple_choice
            text: "Which one do you hold like a pencil?"
            say: "Which one do you hold with three fingers, like a pencil? Tap the picture."
            options: [{ object: teddy }, { object: chalk }, { object: shoe }]
            answer: chalk
