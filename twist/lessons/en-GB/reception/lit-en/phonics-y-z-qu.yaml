# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-y-z-qu
skill: lit-en.phonics.y-z-qu
curriculum: en-GB
language: en
title:
  de: Die Laute y, z, zz, qu
  en: The sounds y, z, zz, qu
summary: >
  The last letters of the first phonics phase. Lesson 1 links y and z to
  their sounds and shows that q always comes with u to make one sound
  (queen); lesson 2 adds zz at the end of a short word (buzz), blends
  words with all the letters (yes, zip, quiz, fizz), and ends with the
  skill check. The sounds are played from the sound bank, never as letter
  names.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonics.j-v-w-x]
  also_practises: [lit-en.phonics.j-v-w-x]
  vocabulary: { en: [sound, letter, blend, word] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.y, en.z, en.kw, en.s]
  facets: []
  parts:
    - { id: sound-letter, what: { de: einen Laut hören und seinen Buchstaben finden, en: hearing a sound and finding its letter or letters } }
    - { id: sound-in-word, what: { de: "hören, ob ein Wort mit y, z oder qu anfängt", en: "hearing whether a word starts with y, z or qu" } }
    - { id: read-words, what: { de: "Wörter mit y, z, zz und qu lesen (yes, zip, quiz, buzz)", en: "reading words with y, z, zz and qu (yes, zip, quiz, buzz)" } }
    - { id: letter-in-word, what: { de: "y, z, zz oder qu in einem gehörten Wort ergänzen", en: "adding y, z, zz or qu to a word you hear" } }
  misconceptions:
    - id: q-alone
      what: Writes q without u, or reads qu as two separate sounds
      addressed: lesson 1 Learn shows q and u together on one card and says they make one sound; every qu task uses the two letters together, and the lesson 2 spelling tasks offer q alone as a wrong option (l2-f2 with feedback, l2-s2, l2-n2), as does the skill check in l2-c8
    - id: z-s-mixup
      what: Mixes up z and s, which are made the same way except for the buzz
      addressed: z and s share an option set in every stage of lesson 1 (l1-f1 with feedback, l1-s2, l1-s3, l1-n2, l1-n4, l1-c1); lesson 2 sets zip against sip (l2-f1, with feedback), offers s beside z at the start of zap (l2-n4) and puts snake beside zebra in the skill check (l2-c2); the skill check also plays the s sound under a z (l2-c9) and offers s beside z in l2-c12
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "y, z, qu", en: "y, z, qu" }
    goal:
      de: "Lerne neue Laute, so wie das Summen in zoo und den Laut am Anfang von queen."
      en: "Learn new sounds, like the buzz in zoo and the sound at the start of queen."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "y"
            say: "This letter makes a short sound with your tongue. Yellow, yawn and yoghurt all start with it. Listen."
            show: { drawn: letter-card, text: "y" }
            sound: en.y
          - text: "z"
            say: "This letter makes a buzz, like a bee. Zoo, zero and zigzag all start with it. Listen."
            show: { drawn: letter-card, text: "z" }
            sound: en.z
          - text: "qu"
            say: "The first letter never goes anywhere without its friend, the second letter. Together they make one sound, a click and then round lips. Question, quiet and quilt all start with it. Listen."
            show: { drawn: letter-card, text: "qu" }
            sound: en.kw

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.z }
                options: ["z", "s", "y"]
                answer: "z"
                feedback:
                  "s": "That letter hisses like a snake. This one buzzes like a bee."
                hints:
                  - "Listen again. Is it a hiss or a buzz?"
                  - "Zoo starts with this sound."
                  - "It is the zigzag letter."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What starts with these letters?"
                say: "Look at the letters. What starts with their sound? Tap the picture."
                show: { drawn: letter-card, text: "qu" }
                options: [{ object: queen }, { object: cup }, { object: kite }]
                answer: queen
                feedback:
                  kite: "Kite starts with a click only. These two letters make a click and then round lips, like in queen."
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts like quiet?"
                  - "Queen starts with these letters. Tap the queen."
                difficulty: easy
              - id: l1-f3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.y }
                options: ["j", "y", "w"]
                answer: "y"
                hints:
                  - "Listen again. Does your tongue glide?"
                  - "Yellow starts with this sound."
                  - "It is the letter with two arms up and a long tail, and no dot."
              - id: l1-f4
                type: true_false
                text: "Does the word start with this letter?"
                say: "Listen. Does the word start with this letter?"
                audio: { en: "Zebra." }
                show: { drawn: letter-card, text: "z" }
                answer: true
                hints:
                  - "Say zebra slowly. Listen to the start."
                  - "Do you hear a buzz?"
                  - "Yes, zebra starts with this letter."
              - id: l1-f5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "y" }
                options: [{ object: jug }, { object: yo-yo }, { object: egg }]
                answer: yo-yo
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts like yellow?"
                  - "Yo-yo starts with this letter. Tap the yo-yo."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which one makes this sound?"
                say: "Listen. Which one makes this sound?"
                audio: { sound: en.kw }
                options: ["c", "qu", "w"]
                answer: "qu"
                hints: ["Listen again. Is it one sound or a click and round lips?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "z" }
                options: [{ object: sock }, { object: zip }, { object: snail }]
                answer: zip
                hints: ["Which one starts with a buzz?"]
              - id: l1-s3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.z }
                options: ["s", "x", "z"]
                answer: "z"
                hints: ["Listen again. Hiss or buzz?"]
              - id: l1-s4
                type: true_false
                text: "Does the word start with these letters?"
                say: "Listen. Does the word start with these letters?"
                audio: { en: "Kite." }
                show: { drawn: letter-card, text: "qu" }
                answer: false
                hints: ["Say kite slowly. Do your lips go round after the click?"]
              - id: l1-s5
                type: true_false
                text: "Does the word start with this letter?"
                say: "Listen. Does the word start with this letter?"
                audio: { en: "Jug." }
                show: { drawn: letter-card, text: "y" }
                answer: false
                hints: ["Say jug slowly. Does it start like yellow?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.y }
                options: ["y", "v", "j"]
                answer: "y"
              - id: l1-n2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "z" }
                options: [{ object: zebra }, { object: sun }, { object: fox }]
                answer: zebra
              - id: l1-n3
                type: audio_choice
                text: "Which one makes this sound?"
                say: "Listen. Which one makes this sound?"
                audio: { sound: en.kw }
                options: ["qu", "k", "x"]
                answer: "qu"
              - id: l1-n4
                type: true_false
                text: "Does the word start with this letter?"
                say: "Listen. Does the word start with this letter?"
                audio: { en: "Sun." }
                show: { drawn: letter-card, text: "z" }
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                text: "What starts with these letters?"
                say: "Look at the letters. What starts with their sound? Tap the picture."
                show: { drawn: letter-card, text: "qu" }
                options: [{ object: car }, { object: web }, { object: queen }]
                answer: queen

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.z }
            options: ["z", "s", "j"]
            answer: "z"
          - id: l1-c2
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "y" }
            options: [{ object: girl }, { object: yo-yo }, { object: web }]
            answer: yo-yo
          - id: l1-c3
            type: true_false
            text: "Does the word start with these letters?"
            say: "Listen. Does the word start with these letters?"
            audio: { en: "Queen." }
            show: { drawn: letter-card, text: "qu" }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.y }
            options: ["w", "z", "y"]
            answer: "y"
          - id: l1-c5
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "z" }
            options: [{ object: snake }, { object: yo-yo }, { object: zip }]
            answer: zip
          - id: l1-c6
            type: true_false
            text: "Does the word start with these letters?"
            say: "Listen. Does the word start with these letters?"
            audio: { en: "Cat." }
            show: { drawn: letter-card, text: "qu" }
            answer: false

  - n: 2
    title: { de: "yes, zip, quiz, buzz", en: "yes, zip, quiz, buzz" }
    goal:
      de: "Schieb die Laute zusammen und lies kurze Wörter wie yes, zip, quiz und buzz."
      en: "Push the sounds together to read short words like yes, zip, quiz and buzz."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "y e s → yes"
            say: "Point to each letter and say its sound. Then push them together: yes."
            show: { drawn: letter-card, text: "y e s" }
          - text: "qu i z → quiz"
            say: "The first two letters make one sound. Slowly, then fast: quiz."
            show: { drawn: letter-card, text: "qu i z" }
          - text: "b u zz → buzz"
            say: "At the end of some short words, the buzz is written with two letters the same. Buzz."
            show: { drawn: letter-card, text: "b u zz" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "zip" }
                options: ["zip", "sip", "lip"]
                answer: "zip"
                feedback:
                  "sip": "Sip starts with a hiss. Zip starts with a buzz."
                hints:
                  - "Listen to the first sound."
                  - "Is it a hiss or a buzz?"
                  - "The word is zip."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "What is missing?"
                say: "Listen. What is missing at the start?"
                audio: { en: "Quack." }
                frame: "_ack"
                options: ["qu", "q", "k"]
                answer: ["qu"]
                feedback:
                  "q": "This letter never goes alone. It always takes its friend with it, the letter shaped like a cup."
                hints:
                  - "Quack starts with a click and round lips."
                  - "That sound needs two letters."
                  - "It is the two letters at the start of queen."
              - id: l2-f3
                type: true_false
                text: "Does the card say this word?"
                say: "Listen. Does the card say this word?"
                audio: { en: "Yum." }
                show: { drawn: letter-card, text: "yum" }
                answer: true
                hints:
                  - "Point to each letter and say its sound."
                  - "Say the sounds again, faster, and push them together."
                  - "Yes, it says yum."
              - id: l2-f4
                type: fill_in_blank
                text: "What is missing?"
                say: "Listen. What is missing at the end?"
                audio: { en: "Fizz." }
                frame: "fi_"
                options: ["zz", "z", "ss"]
                answer: ["zz"]
                hints:
                  - "Fizz ends with a buzz."
                  - "In fizz, like in buzz, the buzz is written with two letters the same."
                  - "Two zigzag letters."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "yuck" }
                options: ["duck", "yuck", "luck"]
                answer: "yuck"
                hints:
                  - "Listen to the first sound."
                  - "It starts like yellow."
                  - "The word is yuck."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "zap" }
                options: ["tap", "zip", "zap"]
                answer: "zap"
                hints: ["Listen to the start and the middle."]
              - id: l2-s2
                type: fill_in_blank
                text: "What is missing?"
                say: "Listen. What is missing at the start?"
                audio: { en: "Quick." }
                frame: "_ick"
                options: ["k", "qu", "q"]
                answer: ["qu"]
                hints: ["Is there a click and round lips?"]
              - id: l2-s3
                type: true_false
                text: "Does the card say this word?"
                say: "Listen. Does the card say this word?"
                audio: { en: "Yell." }
                show: { drawn: letter-card, text: "bell" }
                answer: false
                hints: ["Look at the first letter."]
              - id: l2-s4
                type: fill_in_blank
                text: "What is missing?"
                say: "Listen. What is missing at the end?"
                audio: { en: "Jazz." }
                frame: "ja_"
                options: ["ss", "zz", "z"]
                answer: ["zz"]
                hints: ["Which sound do you hear at the end, a hiss or a buzz?"]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "quack" }
                options: ["quack", "back", "quick"]
                answer: "quack"
                hints: ["Listen to the start and the middle."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "yum" }
                options: ["yum", "yell", "hum"]
                answer: "yum"
              - id: l2-n2
                type: fill_in_blank
                text: "What is missing?"
                say: "Listen. What is missing at the start?"
                audio: { en: "Quit." }
                frame: "_it"
                options: ["qu", "k", "q"]
                answer: ["qu"]
              - id: l2-n3
                type: true_false
                text: "Does the card say this word?"
                say: "Listen. Does the card say this word?"
                audio: { en: "Zip." }
                show: { drawn: letter-card, text: "zip" }
                answer: true
              - id: l2-n4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Listen. Which letter is missing at the start?"
                audio: { en: "Zap." }
                frame: "_ap"
                options: ["s", "z", "y"]
                answer: ["z"]
              - id: l2-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "fizz" }
                options: ["fix", "fizz", "fin"]
                answer: "fizz"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: sound-letter
            type: audio_choice
            text: "Which one makes this sound?"
            say: "Listen to the sound. Which one makes it?"
            audio: { sound: en.kw }
            options: ["k", "w", "qu"]
            answer: "qu"
          - id: l2-c2
            part: sound-in-word
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "z" }
            options: [{ object: snake }, { object: zebra }, { object: cup }]
            answer: zebra
          - id: l2-c3
            part: read-words
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "yap" }
            options: ["yap", "zap", "map"]
            answer: "yap"
          - id: l2-c4
            part: letter-in-word
            type: fill_in_blank
            text: "What is missing?"
            say: "Listen. What is missing at the end?"
            audio: { en: "Fuzz." }
            frame: "fu_"
            options: ["s", "zz", "z"]
            answer: ["zz"]
          - id: l2-c5
            part: sound-letter
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.y }
            options: ["j", "w", "g", "y"]
            answer: "y"
          - id: l2-c6
            part: sound-in-word
            type: image_multiple_choice
            text: "What starts with these letters?"
            say: "Which picture starts with the sound of these letters?"
            show: { drawn: letter-card, text: "qu" }
            options: [{ object: cow }, { object: queen }, { object: cat }]
            answer: queen
          - id: l2-c7
            part: read-words
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "quiz" }
            options: ["quit", "fizz", "quiz"]
            answer: "quiz"
          - id: l2-c8
            part: letter-in-word
            type: fill_in_blank
            text: "What is missing?"
            say: "Listen. What is missing at the start?"
            audio: { en: "Quiz." }
            frame: "_iz"
            options: ["k", "q", "qu"]
            answer: ["qu"]
          - id: l2-c9
            part: sound-letter
            type: true_false
            text: "Does this letter make this sound?"
            say: "Listen. Does this letter make this sound?"
            audio: { sound: en.s }
            show: { drawn: letter-card, text: "z" }
            answer: false
          - id: l2-c10
            part: sound-in-word
            type: true_false
            text: "Does the word start with this letter?"
            say: "Listen. Does the word start with this letter?"
            audio: { en: "Yes." }
            show: { drawn: letter-card, text: "y" }
            answer: true
          - id: l2-c11
            part: read-words
            type: true_false
            text: "Does the card say this word?"
            say: "Listen. Does the card say this word?"
            audio: { en: "Yet." }
            show: { drawn: letter-card, text: "yes" }
            answer: false
          - id: l2-c12
            part: letter-in-word
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Listen. Which letter is missing at the start?"
            audio: { en: "Zip." }
            frame: "_ip"
            options: ["l", "s", "z"]
            answer: ["z"]
          - id: l2-c13
            part: sound-letter
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.z }
            options: ["v", "z", "y"]
            answer: "z"
          - id: l2-c14
            part: sound-in-word
            type: true_false
            text: "Does the word start with this letter?"
            say: "Listen. Does the word start with this letter?"
            audio: { en: "Zoo." }
            show: { drawn: letter-card, text: "z" }
            answer: true
          - id: l2-c15
            part: read-words
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word. Which picture is it?"
            show: { drawn: letter-card, text: "zip" }
            options: [{ object: zebra }, { object: sock }, { object: zip }]
            answer: zip
            option_audio: false
          - id: l2-c16
            part: letter-in-word
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Listen. Which letter is missing at the start?"
            audio: { en: "Yet." }
            frame: "_et"
            options: ["j", "y", "g"]
            answer: ["y"]
          - id: l2-c17
            part: sound-letter
            type: true_false
            text: "Do these letters make this sound?"
            say: "Listen. Do these letters make this sound?"
            audio: { sound: en.kw }
            show: { drawn: letter-card, text: "qu" }
            answer: true
          - id: l2-c18
            part: sound-in-word
            type: true_false
            text: "Does the word start with these letters?"
            say: "Listen. Does the word start with these letters?"
            audio: { en: "Cup." }
            show: { drawn: letter-card, text: "qu" }
            answer: false
          - id: l2-c19
            part: read-words
            type: highlight_in_text
            text: "Tap every card that says the word you hear."
            say: "Listen. Read the cards and tap every card that says this word."
            audio: { en: "Yell." }
            show: { drawn: letter-card, text: "yell bell yell well" }
            spans: ["yell"]
          - id: l2-c20
            part: letter-in-word
            type: fill_in_blank
            text: "What is missing?"
            say: "Listen. What is missing at the start and at the end?"
            audio: { en: "Fizz." }
            frame: "_i_"
            options: ["zz", "v", "z", "f"]
            answer: ["f", "zz"]
