# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.first-tricky-words
skill: lit-en.word-reading.first-tricky-words
curriculum: en-GB
language: en
title:
  de: Erste Merkwörter
  en: First tricky words
summary: >
  Tricky words that do not follow the sounds taught so far and are
  learned by sight. Lesson 1 takes the, I, to, go, no, he, she, we, me
  and be; lesson 2 takes was, my, you, they, all and are, reads them in
  short sentences, and ends with the skill check. Each tricky word is
  heard first, then found and read; the voice never says the word the
  child has to read in a reading task.
metadata:
  year: reception
  topic: { de: "Wörter lesen", en: "Reading words" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.word-reading.blend-cvc]
  also_practises: [lit-en.word-reading.blend-cvc]
  vocabulary: { en: [tricky word, the, I, to, go, no, he, she, we, me, be, was, my, you, they, all, are] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: sound-out-tricky
      what: Sounds out a tricky word letter by letter (t-h-e, w-a-s with a short a)
      addressed: lesson 1 Learn says tricky words cannot be sounded out and are learned by looking, and lesson 2 Learn says they, all and are do not sound the way they look; was sits beside the decodable lookalikes wax and as (l2-f1, with feedback, and l2-n2), all beside ill (l2-f5), and the beside he (l1-f1, with feedback)
    - id: he-she-me-we
      what: Mixes up the short words that end in e (he, she, we, me, be)
      addressed: these words share option sets in every stage of lesson 1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "the, I, to, go, he, she", en: "the, I, to, go, he, she" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "the"
            say: "Some words are tricky. You cannot sound them out with the sounds you know. You learn them by looking. This word is: the."
            show: { drawn: letter-card, text: "the" }
          - text: "I · to · go · no"
            say: "Here are more tricky words. I. To. Go. No. Look at each one and say it."
            show: { drawn: letter-card, text: "I to go no" }
          - text: "he · she · we · me · be"
            say: "These words all end with the same letter. Here it makes a long sound, like in tree: he, she, we, me, be."
            show: { drawn: letter-card, text: "he she we me be" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "the" }
                options: ["the", "he", "to"]
                answer: "the"
                option_audio: false
                feedback:
                  "he": "He has two letters. The word you heard has three."
                hints:
                  - "It is a tricky word from the start of the lesson."
                  - "It has three letters."
                  - "Tap the word the."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "she" }
                options: ["he", "she", "me"]
                answer: "she"
                hints:
                  - "Listen to the start of the word."
                  - "It starts with a hush, like when we say be quiet."
                  - "Tap she."
              - id: l1-f3
                type: highlight_in_text
                text: "Find the word."
                say: "Listen. Tap the word to in the sentence."
                show: { drawn: letter-card, text: "I go to bed." }
                spans: ["to"]
                hints:
                  - "It is a short tricky word."
                  - "It starts with the sound at the start of tap."
                  - "Tap to."
              - id: l1-f4
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "go" }
                options: ["no", "go", "to"]
                answer: "go"
                hints:
                  - "Listen to the first sound."
                  - "It starts like goat."
                  - "Tap go."
              - id: l1-f5
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "we" }
                options: ["me", "be", "we"]
                answer: "we"
                hints:
                  - "Listen to the first sound."
                  - "Your lips make a circle at the start."
                  - "Tap we."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "no" }
                options: ["go", "to", "no"]
                answer: "no"
                hints: ["Listen to the first sound."]
              - id: l1-s2
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "me" }
                options: ["me", "we", "he"]
                answer: "me"
                hints: ["Are your lips closed at the start?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Find the word."
                say: "Listen. Tap the word I in the sentence."
                show: { drawn: letter-card, text: "Can I sit on the log?" }
                spans: ["I"]
                hints: ["It is just one letter."]
              - id: l1-s4
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "he" }
                options: ["she", "be", "he"]
                answer: "he"
                hints: ["Listen to the first sound."]
              - id: l1-s5
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "be" }
                options: ["be", "me", "we"]
                answer: "be"
                hints: ["Do your lips pop at the start?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "to" }
                options: ["the", "to", "go"]
                answer: "to"
              - id: l1-n2
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "she" }
                options: ["we", "he", "she"]
                answer: "she"
              - id: l1-n3
                type: highlight_in_text
                text: "Find the word."
                say: "Listen. Tap the word the in the sentence."
                show: { drawn: letter-card, text: "A cat sat on the mat." }
                spans: ["the"]
              - id: l1-n4
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "me" }
                options: ["be", "he", "me"]
                answer: "me"
              - id: l1-n5
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "go" }
                options: ["go", "no", "got"]
                answer: "go"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tap the word you hear."
            say: "Which word is it? Listen."
            audio: { en: "the" }
            options: ["to", "the", "she"]
            answer: "the"
          - id: l1-c2
            type: audio_choice
            text: "Tap the word you hear."
            say: "Which word is it? Listen."
            audio: { en: "we" }
            options: ["we", "me", "be"]
            answer: "we"
          - id: l1-c3
            type: highlight_in_text
            text: "Find the word."
            say: "Listen. Tap the word no in the sentence."
            show: { drawn: letter-card, text: "It is no fun." }
            spans: ["no"]

  - n: 2
    title: { de: "was, my, you, they", en: "was, my, you, they" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "was · my · you"
            say: "More tricky words. Was. My. You. Look at each one and say it."
            show: { drawn: letter-card, text: "was my you" }
          - text: "they · all · are"
            say: "They. All. Are. These do not sound the way they look, so look carefully."
            show: { drawn: letter-card, text: "they all are" }
          - text: "My cat was sad."
            say: "Now read a sentence with tricky words in it. Read the tricky words by looking, and sound out the others."
            show: { drawn: letter-card, text: "My cat was sad." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "was" }
                options: ["was", "wax", "as"]
                answer: "was"
                option_audio: false
                feedback:
                  "wax": "Wax sounds the way it looks, with the sound of ant in the middle. The word you heard is a tricky word."
                hints:
                  - "It is a tricky word from today."
                  - "Two of the words start the same way. The word you heard is the tricky one."
                  - "Tap was."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "you" }
                options: ["they", "you", "my"]
                answer: "you"
                hints:
                  - "It is a tricky word from today."
                  - "It starts with the sound at the start of yes."
                  - "Tap you."
              - id: l2-f3
                type: highlight_in_text
                text: "Find the word."
                say: "Listen. Tap the word are in the sentence."
                show: { drawn: letter-card, text: "We are in the van." }
                spans: ["are"]
                hints:
                  - "It is a tricky word."
                  - "It starts with the same letter as ant, but it does not sound like ant."
                  - "Tap are."
              - id: l2-f4
                type: true_false
                text: "Is this the word?"
                say: "Listen. Does the card say they?"
                show: { drawn: letter-card, text: "they" }
                answer: true
                hints:
                  - "Look at the word."
                  - "It starts like the."
                  - "Yes, it says they."
              - id: l2-f5
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "all" }
                options: ["all", "are", "ill"]
                answer: "all"
                hints:
                  - "It is a tricky word."
                  - "It looks like the end of ball."
                  - "Tap all."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "my" }
                options: ["me", "my", "mat"]
                answer: "my"
                hints: ["Look at the last letter."]
              - id: l2-s2
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "they" }
                options: ["the", "they", "he"]
                answer: "they"
                hints: ["Listen to the end of the word."]
              - id: l2-s3
                type: highlight_in_text
                text: "Find the word."
                say: "Listen. Tap the word was in the sentence."
                show: { drawn: letter-card, text: "The bus was red." }
                spans: ["was"]
                hints: ["Look for a tricky word that starts with the round-lips sound."]
              - id: l2-s4
                type: true_false
                text: "Is this the word?"
                say: "Listen. Does the card say you?"
                show: { drawn: letter-card, text: "my" }
                answer: false
                hints: ["Look at the first letter."]
              - id: l2-s5
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "are" }
                options: ["all", "are", "an"]
                answer: "are"
                hints: ["Listen to the end of the word."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "you" }
                options: ["you", "yes", "my"]
                answer: "you"
              - id: l2-n2
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "was" }
                options: ["wag", "was", "as"]
                answer: "was"
              - id: l2-n3
                type: highlight_in_text
                text: "Find the word."
                say: "Listen. Tap the word they in the sentence."
                show: { drawn: letter-card, text: "Can they sit in the sun?" }
                spans: ["they"]
              - id: l2-n4
                type: true_false
                text: "Is this the word?"
                say: "Listen. Does the card say all?"
                show: { drawn: letter-card, text: "all" }
                answer: true
              - id: l2-n5
                type: audio_choice
                text: "Tap the word you hear."
                say: "Listen. Tap the word you hear."
                audio: { en: "my" }
                options: ["my", "me", "we"]
                answer: "my"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Tap the word you hear."
            say: "Which word is it? Listen."
            audio: { en: "they" }
            options: ["she", "they", "the"]
            answer: "they"
          - id: l2-c2
            type: audio_choice
            text: "Tap the word you hear."
            say: "Which word is it? Listen."
            audio: { en: "he" }
            options: ["the", "she", "he"]
            answer: "he"
          - id: l2-c3
            type: highlight_in_text
            text: "Find the word."
            say: "Listen. Tap the word my in the sentence."
            show: { drawn: letter-card, text: "We sit on my bed." }
            spans: ["my"]
          - id: l2-c4
            type: audio_choice
            text: "Tap the word you hear."
            say: "Which word is it? Listen."
            audio: { en: "are" }
            options: ["are", "all", "at"]
            answer: "are"
