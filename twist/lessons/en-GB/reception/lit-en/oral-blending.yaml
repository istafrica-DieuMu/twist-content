# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.oral-blending
skill: lit-en.phonological.oral-blending
curriculum: en-GB
language: en
title:
  de: Laute verbinden
  en: Blending sounds
summary: >
  The step into phonics, still without letters. Children hear a word said
  sound by sound (c ... a ... t) and blend it into the word (cat), then do
  the reverse: split a short word into its sounds and count them. Lesson 1
  blends; lesson 2 splits and ends with the skill check. The voice says
  pure sounds, never letter names.
metadata:
  year: reception
  topic: { de: Laute hören, en: Hearing sounds }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonological.initial-sounds]
  also_practises: [lit-en.phonological.initial-sounds]
  vocabulary: { en: [sound, blend, push the sounds together, split] }
  no_reading: true
  forms: [picture, drawn, audio]
  drawn: [dots]
  sounds: [en.k, en.a, en.t, en.sh, en.b, en.d, en.e, en.f, en.g, en.h, en.i, en.j, en.l, en.m, en.n, en.o, en.p, en.s, en.u, en.z]
  facets: []
  misconceptions:
    - id: first-sound-guess
      what: Hears only the first sound and guesses a word that starts with it (c ... a ... t, car)
      addressed: options always include a word with the same first sound; hints say "Listen to all the sounds."
    - id: letters-not-sounds
      what: Counts letters instead of sounds (sh in fish is one sound)
      addressed: lesson 2 Learn counts f ... i ... sh as three sounds
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Laute verbinden, en: Push the sounds together }
    new_content: true
    activities:
      - activity: learn
        mode: do-it-with-me
        screens:
          - say: "Words are made of sounds. Listen to the first sound."
            show: { object: cat }
            sound: en.k
          - say: "Now the next sound."
            show: { object: cat }
            sound: en.a
          - say: "And the last sound."
            show: { object: cat }
            sound: en.t
          - say: "Say the three sounds slowly, then faster and faster. If we push the sounds together, we get a word: cat!"
            show: { object: cat }
          - say: "Now you try. Listen to the sounds, then push them together to find the word."
            show: { object: listen }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What word is it?"
                say: "Listen to the sounds. What word is it?"
                audio: { sounds: [en.p, en.i, en.g] }
                options: [{ object: pig }, { object: dog }, { object: cup }]
                answer: pig
                hints:
                  - "Listen again and say the sounds with me."
                  - "Say the sounds faster and faster, until they join up."
                  - "The sounds make pig."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What word is it?"
                say: "Listen to the sounds. What word is it?"
                audio: { sounds: [en.k, en.a, en.t] }
                options: [{ object: car }, { object: cat }, { object: cup }]
                answer: cat
                feedback:
                  car: "Car starts with the same sound. Listen again, right to the last sound."
                hints:
                  - "Listen to all the sounds, not just the first one."
                  - "Listen to the last sound. Does car end like that?"
                  - "The sounds make cat."
              - id: l1-f3
                type: true_false
                text: "Is this the word?"
                say: "Listen to the sounds. Do they make bed?"
                audio: { sounds: [en.b, en.e, en.d] }
                show: { object: bed }
                answer: true
                hints:
                  - "Listen again and say the sounds with me."
                  - "Push them together, faster and faster."
                  - "Yes, the sounds make bed."
              - id: l1-f4
                type: audio_choice
                text: "What word is it?"
                say: "Listen to the sounds. What word is it?"
                audio: { sounds: [en.s, en.o, en.k] }
                options: [{ object: sun }, { object: shoe }, { object: sock }]
                answer: sock
                hints:
                  - "Listen to all three sounds."
                  - "Sun and shoe do not end with a click. Which one does?"
                  - "The sounds make sock."
              - id: l1-f5
                type: true_false
                text: "Is this the word?"
                say: "Listen to the sounds. Do they make hand?"
                audio: { sounds: [en.h, en.a, en.t] }
                show: { object: hand }
                answer: false
                hints:
                  - "Listen again and say the sounds with me."
                  - "Push them together, faster and faster."
                  - "No, the sounds make hat."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What word is it?"
                say: "Listen to the sounds. What word is it?"
                audio: { sounds: [en.b, en.u, en.s] }
                options: [{ object: bus }, { object: ball }, { object: bed }]
                answer: bus
                hints: ["Push all the sounds together."]
              - id: l1-s2
                type: audio_choice
                text: "What word is it?"
                say: "Listen to the sounds. What word is it?"
                audio: { sounds: [en.k, en.u, en.p] }
                options: [{ object: cat }, { object: cup }, { object: duck }]
                answer: cup
                hints: ["Cat starts the same. Listen to the middle sound."]
              - id: l1-s3
                type: true_false
                text: "Is this the word?"
                say: "Listen to the sounds. Do they make leg?"
                audio: { sounds: [en.l, en.e, en.g] }
                show: { object: leg }
                answer: true
                hints: ["Say the sounds and push them together."]
              - id: l1-s4
                type: audio_choice
                text: "What word is it?"
                say: "Listen to the sounds. What word is it?"
                audio: { sounds: [en.f, en.i, en.sh] }
                options: [{ object: frog }, { object: fish }, { object: shell }]
                answer: fish
                hints: ["Listen to the last sound. It is a hush, like when we say be quiet."]
              - id: l1-s5
                type: audio_choice
                text: "What word is it?"
                say: "Listen to the sounds. What word is it?"
                audio: { sounds: [en.d, en.u, en.k] }
                options: [{ object: duck }, { object: dog }, { object: cup }]
                answer: duck
                hints: ["Listen to the middle sound. Then push all the sounds together."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What word is it?"
                say: "Listen to the sounds. What word is it?"
                audio: { sounds: [en.s, en.u, en.n] }
                options: [{ object: sock }, { object: sun }, { object: snail }]
                answer: sun
              - id: l1-n2
                type: true_false
                text: "Is this the word?"
                say: "Listen to the sounds. Do they make mum?"
                audio: { sounds: [en.m, en.u, en.m] }
                show: { object: mum }
                answer: true
              - id: l1-n3
                type: audio_choice
                text: "What word is it?"
                say: "Listen to the sounds. What word is it?"
                audio: { sounds: [en.b, en.e, en.l] }
                options: [{ object: bed }, { object: ball }, { object: bell }]
                answer: bell
              - id: l1-n4
                type: true_false
                text: "Is this the word?"
                say: "Listen to the sounds. Do they make duck?"
                audio: { sounds: [en.d, en.o, en.g] }
                show: { object: duck }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "What word is it?"
                say: "Listen to the sounds. What word is it?"
                audio: { sounds: [en.j, en.u, en.g] }
                options: [{ object: jug }, { object: cup }, { object: bus }]
                answer: jug

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "What word is it?"
            say: "Listen to the sounds. What word is it?"
            audio: { sounds: [en.d, en.o, en.g] }
            options: [{ object: duck }, { object: dog }, { object: frog }]
            answer: dog
          - id: l1-c2
            type: audio_choice
            text: "What word is it?"
            say: "Listen to the sounds. What word is it?"
            audio: { sounds: [en.h, en.a, en.t] }
            options: [{ object: hand }, { object: cat }, { object: hat }]
            answer: hat
          - id: l1-c3
            type: true_false
            text: "Is this the word?"
            say: "Listen to the sounds. Do they make pig?"
            audio: { sounds: [en.p, en.i, en.g] }
            show: { object: pig }
            answer: true

  - n: 2
    title: { de: Wörter in Laute zerlegen, en: Splitting words into sounds }
    new_content: true
    activities:
      - activity: learn
        mode: do-it-with-me
        screens:
          - say: "Now we do it the other way round. Sun. Say it very slowly and stretch it out. Hold up a finger for each sound. Sun has three sounds."
            show: { object: sun }
          - say: "Each sound is a dot. Three sounds, three dots."
            show: { drawn: dots, count: 3, layout: row }
          - say: "Fish. Listen to its last sound. It is a hush, like when we say be quiet. It is just one sound, so fish has three sounds too."
            show: { object: fish }
            sound: en.sh

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Cat. Stretch the word out. How many sounds can you hear?"
                show: { object: cat }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
                hints:
                  - "Say it slowly and count each sound."
                  - "Hold up a finger for each sound you say."
                  - "Three sounds."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "What is the first sound?"
                say: "Bus. What is the first sound in bus?"
                audio: { en: "Bus." }
                options: [{ object: ball }, { object: sun }, { object: cup }]
                answer: ball
                hints:
                  - "Say bus slowly and listen to the start."
                  - "Bus starts with a pop of your lips."
                  - "Ball starts with the same pop."
              - id: l2-f3
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Egg. Stretch the word out. How many sounds can you hear?"
                show: { object: egg }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "2"
                hints:
                  - "Say it slowly."
                  - "Hold up a finger for each sound you hear."
                  - "Two sounds."
              - id: l2-f4
                type: true_false
                text: "Three sounds?"
                say: "Duck. Does duck have three sounds?"
                show: { object: duck }
                answer: true
                hints:
                  - "Stretch it out."
                  - "Count the sounds on your fingers."
                  - "Yes, three sounds."
              - id: l2-f5
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Frog. Stretch the word out. How many sounds can you hear?"
                show: { object: frog }
                options:
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                answer: "4"
                hints:
                  - "Say it very slowly: there are two sounds at the start."
                  - "Count each sound on a finger, even the two at the start."
                  - "Four sounds."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Pig. Stretch the word out. How many sounds can you hear?"
                show: { object: pig }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
                hints: ["Count each sound as you say it."]
              - id: l2-s2
                type: audio_choice
                text: "What is the first sound?"
                say: "Moon. What is the first sound in moon?"
                audio: { en: "Moon." }
                options: [{ object: sun }, { object: mouse }, { object: nose }]
                answer: mouse
                hints: ["Say moon slowly. At the start, your lips stay closed and you hum."]
              - id: l2-s3
                type: true_false
                text: "Four sounds?"
                say: "Cup. Does cup have four sounds?"
                show: { object: cup }
                answer: false
                hints: ["Count the sounds on your fingers. Do you need four?"]
              - id: l2-s4
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Shell. Stretch the word out. How many sounds can you hear?"
                show: { object: shell }
                options:
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 5, layout: row }
                answer: "3"
                hints: ["The hush at the start is just one sound."]
              - id: l2-s5
                type: audio_choice
                text: "What is the last sound?"
                say: "Bed. What is the last sound in bed?"
                audio: { en: "Bed." }
                options: [{ object: dog }, { object: bus }, { object: hat }]
                answer: dog
                hints: ["Say bed slowly and listen to the very end. Which word starts with that sound?"]
                difficulty: stretch

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Leg. Stretch the word out. How many sounds can you hear?"
                show: { object: leg }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
              - id: l2-n2
                type: audio_choice
                text: "What is the first sound?"
                say: "Fish. What is the first sound in fish?"
                audio: { en: "Fish." }
                options: [{ object: frog }, { object: shell }, { object: hat }]
                answer: frog
              - id: l2-n3
                type: true_false
                text: "Three sounds?"
                say: "Sock. Does sock have three sounds?"
                show: { object: sock }
                answer: true
              - id: l2-n4
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Ant. Stretch the word out. How many sounds can you hear?"
                show: { object: ant }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
              - id: l2-n5
                type: audio_choice
                text: "What is the first sound?"
                say: "Hat. What is the first sound in hat?"
                audio: { en: "Hat." }
                options: [{ object: hand }, { object: cat }, { object: apple }]
                answer: hand

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "What word is it?"
            say: "Listen to the sounds. What word is it?"
            audio: { sounds: [en.b, en.e, en.d] }
            options: [{ object: bell }, { object: bed }, { object: bus }]
            answer: bed
          - id: l2-c2
            type: audio_choice
            text: "What word is it?"
            say: "Listen to the sounds. What word is it?"
            audio: { sounds: [en.z, en.i, en.p] }
            options: [{ object: zebra }, { object: zip }, { object: pig }]
            answer: zip
          - id: l2-c3
            type: image_multiple_choice
            text: "How many sounds?"
            say: "Bus. Stretch the word out. How many sounds can you hear?"
            show: { object: bus }
            options:
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
              - { drawn: dots, count: 4, layout: row }
            answer: "3"
          - id: l2-c4
            type: audio_choice
            text: "What is the first sound?"
            say: "Sun. What is the first sound in sun?"
            audio: { en: "Sun." }
            options: [{ object: sock }, { object: shoe }, { object: moon }]
            answer: sock
