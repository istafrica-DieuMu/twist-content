# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-ck-e-u-r
skill: lit-en.phonics.ck-e-u-r
curriculum: en-GB
language: en
title:
  de: Die Laute ck, e, u, r
  en: The sounds ck, e, u, r
summary: >
  The fourth set of phonics letters. Lesson 1 links e, u and r to their
  sounds and shows ck, two letters for the click sound at the end of a
  word (duck, sock); lesson 2 blends words with them (red, sun, neck,
  rock) and ends with the skill check. The sounds are played from the
  sound bank, never as letter names.
  Writing the letters in words is practised in Practise (what is missing)
  and in segment-spell; the skill check marks the sounds and reading the
  words.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonics.g-o-c-k]
  also_practises: [lit-en.phonics.g-o-c-k]
  vocabulary: { en: [sound, letter, blend, word] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.e, en.u, en.r, en.k]
  facets: []
  parts:
    - { id: e, what: { de: "den Laut von e kennen und von i unterscheiden (pen, pin)", en: "knowing the sound of e and telling it from i (pen, pin)" } }
    - { id: u, what: { de: "den Laut von u kennen und von o unterscheiden (cut, cot)", en: "knowing the sound of u and telling it from o (cut, cot)" } }
    - { id: r, what: { de: den Laut von r kennen, en: knowing the sound of r } }
    - { id: ck, what: { de: "Wörter mit ck am Ende lesen (duck, sock)", en: "reading words that end in ck (duck, sock)" } }
  misconceptions:
    - id: ck-two-sounds
      what: Says two click sounds for ck, one for each letter
      addressed: lesson 1 Learn plays one sound for ck and lesson 2 Learn counts neck as three sounds; the ck card sits in every stage of lesson 1 (l1-f4, l1-s4, l1-n4) and ck words in every stage of lesson 2; the full-stage hints in l1-f4 and l2-f2 say two letters make the one click sound
    - id: e-i-vowel
      what: Mixes up the short e and i (pen as pin)
      addressed: e and i share an option set in the full and some stages of lesson 1 (l1-f1 and l1-f5 with feedback, l1-s3) and in the quick check (l1-c2); lesson 2 sets pen against pin in l2-f1 (with feedback), ten against tin in l2-s4, and pet against pit in the skill check
    - id: u-o-vowel
      what: Mixes up the short u and o (cup as cop)
      addressed: u and o share an option set in every stage of lesson 1 (l1-f3 with feedback, l1-s2, l1-n1); lesson 2 offers o as a distractor for mud in l2-f4 and sets nut against not in l2-s1, cut against cot in l2-n4 and duck against dock in l2-n5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "e, u, r, ck", en: "e, u, r, ck" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "e"
            say: "This letter makes a short sound. Elbow, empty and engine all start with it. Listen."
            show: { drawn: letter-card, text: "e" }
            sound: en.e
          - text: "u"
            say: "This letter makes a short sound. Umbrella, under and uncle all start with it. Listen."
            show: { drawn: letter-card, text: "u" }
            sound: en.u
          - text: "r"
            say: "This letter makes a long growly sound, like a tiger. Robot, river and rainbow all start with it. Listen."
            show: { drawn: letter-card, text: "r" }
            sound: en.r
          - text: "ck"
            say: "These two letters make one sound together, the click sound. You find them at the end of words, like back and lick. Listen."
            show: { drawn: letter-card, text: "ck" }
            sound: en.k

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.e }
                options: ["e", "i", "a"]
                answer: "e"
                feedback:
                  "i": "That letter makes the sound in the middle of pig. This one is the sound at the start of egg."
                hints:
                  - "Listen again. It is the sound at the start of egg."
                  - "Elbow starts with this sound."
                  - "It is the round letter with a line across its middle."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "r" }
                options: [{ object: rabbit }, { object: moon }, { object: goat }]
                answer: rabbit
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts like robot?"
                  - "Rabbit starts with this letter. Tap the rabbit."
                difficulty: easy
              - id: l1-f3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.u }
                options: ["o", "u", "a"]
                answer: "u"
                feedback:
                  "o": "That letter makes the sound in the middle of dog. This one is the sound at the start of up."
                hints:
                  - "Listen again. It is the sound at the start of up."
                  - "Umbrella starts with this sound."
                  - "It is the letter shaped like a cup."
              - id: l1-f4
                type: true_false
                text: "Does it end with ck?"
                say: "Duck. Does duck end with these two letters?"
                show: { object: duck }
                answer: true
                hints:
                  - "Say duck slowly. Listen to the end."
                  - "It ends with the click sound. Two letters make it."
                  - "Yes, duck ends with these letters."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which has this sound in the middle?"
                say: "Look at the letter. Which word has its sound in the middle? Tap the picture."
                show: { drawn: letter-card, text: "e" }
                options: [{ object: bed }, { object: pig }, { object: cat }]
                answer: bed
                feedback:
                  pig: "Pig has the sound in the middle of pin. Bed has the sound at the start of egg in its middle."
                hints:
                  - "Say each word slowly and listen to the middle."
                  - "Which one has the sound at the start of egg in its middle?"
                  - "Bed. Tap the bed."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.r }
                options: ["n", "r", "m"]
                answer: "r"
                hints: ["Listen again. Does it growl?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Which has this sound in the middle?"
                say: "Look at the letter. Which word has its sound in the middle? Tap the picture."
                show: { drawn: letter-card, text: "u" }
                options: [{ object: dog }, { object: cup }, { object: cat }]
                answer: cup
                hints: ["Say each word slowly and listen to the middle."]
              - id: l1-s3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.e }
                options: ["a", "i", "e"]
                answer: "e"
                hints: ["Which word starts with this sound: egg or ant?"]
              - id: l1-s4
                type: true_false
                text: "Does it end with ck?"
                say: "Sock. Does sock end with these two letters?"
                show: { object: sock }
                answer: true
                hints: ["Say sock slowly. Is the end a click?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "e" }
                options: [{ object: ant }, { object: egg }, { object: octopus }]
                answer: egg
                hints: ["Which one starts like elbow?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.u }
                options: ["u", "a", "o"]
                answer: "u"
              - id: l1-n2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "r" }
                options: [{ object: lion }, { object: rose }, { object: dog }]
                answer: rose
              - id: l1-n3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.r }
                options: ["d", "m", "r"]
                answer: "r"
              - id: l1-n4
                type: true_false
                text: "Does it end with ck?"
                say: "Sun. Does sun end with these two letters?"
                show: { object: sun }
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                text: "Which has this sound in the middle?"
                say: "Look at the letter. Which word has its sound in the middle? Tap the picture."
                show: { drawn: letter-card, text: "u" }
                options: [{ object: bus }, { object: fish }, { object: car }]
                answer: bus

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.r }
            options: ["r", "n", "u"]
            answer: "r"
          - id: l1-c2
            type: image_multiple_choice
            text: "Which has this sound in the middle?"
            say: "Which word has the sound of this letter in the middle? Tap the picture."
            show: { drawn: letter-card, text: "e" }
            options: [{ object: sun }, { object: bell }, { object: pig }]
            answer: bell
          - id: l1-c3
            type: true_false
            text: "Does it end with ck?"
            say: "Clock. Does clock end with these two letters?"
            show: { object: clock }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.u }
            options: ["a", "u", "i"]
            answer: "u"
          - id: l1-c5
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "r" }
            options: [{ object: moon }, { object: pig }, { object: rubber }]
            answer: rubber
          - id: l1-c6
            type: true_false
            text: "Does it end with ck?"
            say: "Cup. Does cup end with these two letters?"
            show: { object: cup }
            answer: false

  - n: 2
    title: { de: "red, sun, neck", en: "red, sun, neck" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "r e d → red"
            say: "Point to each letter and say its sound. Then push them together: red."
            show: { drawn: letter-card, text: "r e d" }
          - text: "s u n → sun"
            say: "Slowly, then fast: sun."
            show: { drawn: letter-card, text: "s u n" }
          - text: "n e ck → neck"
            say: "The last two letters make one sound, the click, so this word has three sounds. Slowly, then fast: neck."
            show: { drawn: letter-card, text: "n e ck" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "pen" }
                options: ["pen", "pin", "pan"]
                answer: "pen"
                feedback:
                  "pin": "Pin has the middle sound of pig. Pen has the sound at the start of egg in its middle."
                hints:
                  - "Listen to the middle sound."
                  - "It is the sound at the start of egg."
                  - "The word is pen."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "What is missing?"
                say: "What is missing at the end of this word? Listen."
                audio: { en: "Rock." }
                frame: "ro_"
                options: ["ck", "c", "g"]
                answer: ["ck"]
                hints:
                  - "Rock ends with the click sound."
                  - "At the end of a short word, two letters make the click."
                  - "It is the two letters at the end of duck and sock."
              - id: l2-f3
                type: true_false
                text: "Does the card say the word you hear?"
                say: "Does the card say this word? Listen."
                audio: { en: "Run." }
                show: { drawn: letter-card, text: "run" }
                answer: true
                hints:
                  - "Point to each letter and say its sound."
                  - "Say the sounds again, faster, and push them together."
                  - "Yes, it says run."
              - id: l2-f4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing in the middle of this word? Listen."
                audio: { en: "Mud." }
                frame: "m_d"
                options: ["u", "o", "a"]
                answer: ["u"]
                hints:
                  - "Say mud slowly. Listen to the middle."
                  - "It is the sound at the start of up."
                  - "It is the letter shaped like a cup."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "kick" }
                options: ["kick", "kit", "tick"]
                answer: "kick"
                hints:
                  - "Listen to the start and to the end."
                  - "It starts and ends with the click sound."
                  - "The word is kick."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "nut" }
                options: ["net", "not", "nut"]
                answer: "nut"
                hints: ["Listen to the middle sound."]
              - id: l2-s2
                type: fill_in_blank
                text: "What is missing?"
                say: "What is missing at the end of this word? Listen."
                audio: { en: "Pick." }
                frame: "pi_"
                options: ["k", "ck", "g"]
                answer: ["ck"]
                hints: ["How do we write the click at the end of a short word?"]
              - id: l2-s3
                type: true_false
                text: "Does the card say the word you hear?"
                say: "Does the card say this word? Listen."
                audio: { en: "Rug." }
                show: { drawn: letter-card, text: "rag" }
                answer: false
                hints: ["Look at the middle letter."]
              - id: l2-s4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing in the middle of this word? Listen."
                audio: { en: "Ten." }
                frame: "t_n"
                options: ["i", "e", "a"]
                answer: ["e"]
                hints: ["Say ten slowly. Listen to the middle."]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "rat" }
                options: ["mat", "rat", "ran"]
                answer: "rat"
                hints: ["Listen to the start, then the middle."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "get" }
                options: ["got", "get", "net"]
                answer: "get"
              - id: l2-n2
                type: fill_in_blank
                text: "What is missing?"
                say: "Sock. What is missing at the end of sock?"
                show: { object: sock }
                frame: "so_"
                options: ["g", "ck", "c"]
                answer: ["ck"]
              - id: l2-n3
                type: true_false
                text: "Does the card say the word you hear?"
                say: "Does the card say this word? Listen."
                audio: { en: "Peg." }
                show: { drawn: letter-card, text: "peg" }
                answer: true
              - id: l2-n4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing in the middle of this word? Listen."
                audio: { en: "Cut." }
                frame: "c_t"
                options: ["a", "o", "u"]
                answer: ["u"]
              - id: l2-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "duck" }
                options: ["dock", "duck", "deck"]
                answer: "duck"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: u
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.u }
            options: ["e", "o", "u"]
            answer: "u"
          - id: l2-c2
            part: r
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "r" }
            options: [{ object: ruler }, { object: lion }, { object: nose }]
            answer: ruler
          - id: l2-c3
            part: e
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "pet" }
            options: ["pot", "pet", "pit"]
            answer: "pet"
          - id: l2-c4
            part: ck
            type: true_false
            text: "sack"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: sack }
            answer: true
          - id: l2-c5
            part: u
            type: image_multiple_choice
            text: "Which has this sound in the middle?"
            say: "Look at the letter. Which word has its sound in the middle? Tap the picture."
            show: { drawn: letter-card, text: "u" }
            options: [{ object: sock }, { object: bed }, { object: sun }]
            answer: sun
          - id: l2-c6
            part: r
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.r }
            options: ["t", "r", "u"]
            answer: "r"
          - id: l2-c7
            part: e
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.e }
            options: ["u", "i", "e"]
            answer: "e"
          - id: l2-c8
            part: ck
            type: true_false
            text: "rock"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: sock }
            answer: false
          - id: l2-c9
            part: u
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "cut" }
            options: ["cot", "cat", "cut"]
            answer: "cut"
          - id: l2-c10
            part: r
            type: true_false
            text: "Does it start with r?"
            say: "Ring. Does ring start with this sound? Listen."
            audio: { sound: en.r }
            show: { object: ring }
            answer: true
          - id: l2-c11
            part: e
            type: image_multiple_choice
            text: "Which has this sound in the middle?"
            say: "Look at the letter. Which word has its sound in the middle? Tap the picture."
            show: { drawn: letter-card, text: "e" }
            options: [{ object: cup }, { object: web }, { object: fish }]
            answer: web
          - id: l2-c12
            part: ck
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "rock" }
            options: ["sock", "rock", "rod"]
            answer: "rock"
          - id: l2-c13
            part: u
            type: true_false
            text: "Do you hear u in the middle?"
            say: "Dog. Do you hear this sound in the middle of dog? Listen."
            audio: { sound: en.u }
            show: { object: dog }
            answer: false
          - id: l2-c14
            part: r
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "rip" }
            options: ["nip", "rip", "rid"]
            answer: "rip"
          - id: l2-c15
            part: e
            type: true_false
            text: "pin"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: pen }
            answer: false
          - id: l2-c16
            part: ck
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word. Which picture is it?"
            show: { drawn: letter-card, text: "duck" }
            options: [{ object: duck }, { object: cup }, { object: dog }]
            answer: duck
            option_audio: false
          - id: l2-c17
            part: u
            type: true_false
            text: "cup"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: cup }
            answer: true
          - id: l2-c18
            part: r
            type: audio_choice
            text: "What starts with this sound?"
            say: "Listen to the sound. Which picture starts with it?"
            audio: { sound: en.r }
            options: [{ object: nose }, { object: rope }, { object: lamp }]
            answer: rope
          - id: l2-c19
            part: e
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "set" }
            options: ["sit", "set", "sat"]
            answer: "set"
          - id: l2-c20
            part: ck
            type: multiple_choice
            text: "Which word goes with the picture?"
            say: "Look at the picture. Which word goes with it? Read the words."
            show: { object: sock }
            options: ["sack", "sock", "sick"]
            answer: "sock"
            option_audio: false
