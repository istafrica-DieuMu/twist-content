# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.finger-spaces
skill: lit-en.grammar.finger-spaces
curriculum: en-GB
language: en
title:
  de: Wortabstände (Fingerabstand)
  en: Finger spaces
summary: >
  Leaving a space between words, the width of a finger, so that a
  sentence can be read. Lesson 1 spots sentences with and without finger
  spaces, counts the words and copies short phrases with a space; lesson
  2 finds the squashed words in a sentence and ends with the skill check.
  The sentences use words the child can read. Copying runs as tracing
  with any ink accepted, so whether the child's own writing has its
  spaces is not marked yet.
metadata:
  year: reception
  topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.handwriting.lowercase]
  also_practises: [lit-en.word-reading.first-sentences]
  vocabulary: { en: [word, sentence, finger space, capital letter, full stop] }
  forms: [text, drawn, audio]
  drawn: [letter-card, writing-lines]
  facets: [script]
  misconceptions:
    - id: words-run-together
      what: Writes the words of a sentence with no gaps (Icanhop), so nobody can read it
      addressed: Learn in lesson 1 shows the same sentence with and without spaces; the child chooses the sentence with all its spaces in l1-f1 (with feedback), l1-s1, l1-n1, l1-c1, l2-w1, l2-f2, l2-s2, l2-n2 and the skill check task l2-c1; true/false cards with no spaces in l1-f2 and l1-n2
    - id: space-only-sometimes
      what: Leaves spaces after some words but squashes two short words together (Mum hasa hat)
      addressed: options with one missing space in l1-f1 (feedback), l1-s1, l1-c1 and l2-s2; the child finds the squashed pair in l2-f3, l2-s1, l2-n1 and l2-c2; true/false cards l2-f5 and l2-c4
    - id: word-boundaries
      what: Is not sure where one word ends and the next begins, so cannot place the spaces
      addressed: counting the words in l1-f3, l1-s3, l1-n3, l1-c3, l2-w2, l2-f1, l2-n3 and l2-c3; building a sentence from word cards in every stage (l1-f5, l1-s5, l1-n5, l2-f4, l2-s4, l2-n5, l2-c5)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Platz zwischen Wörtern", en: "A space after each word" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tracing
            text: "Trace the c."
            say: "Trace the c. Start at the top, go round to the left and stop at the bottom."
            show: { drawn: writing-lines, text: "c", mode: trace, arrows: true }
            char: "c"
            difficulty: easy
          - id: l1-w2
            type: tracing
            text: "Trace the a."
            say: "Trace the a. Start like a c, go round, then up and straight down."
            show: { drawn: writing-lines, text: "a", mode: trace, arrows: true }
            char: "a"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "I can hop."
            say: "When we write, we leave a space after each word. Put a finger down after a word, then start the next word on the other side. That is a finger space."
            show: { drawn: letter-card, text: "I can hop." }
          - text: "Icanhop."
            say: "Here the words are squashed together. It is very hard to read! The finger spaces are missing."
            show: { drawn: letter-card, text: "Icanhop." }
          - text: "I can hop. (3 words)"
            say: "Count the words: I, can, hop. Three words. Between them sit two finger spaces."
            show: { drawn: letter-card, text: "I can hop." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which one has finger spaces?"
                say: "Look carefully. Which sentence has a space after each word?"
                options: ["Icanhop.", "Ican hop.", "I can hop."]
                answer: "I can hop."
                option_audio: false
                feedback:
                  "Ican hop.": "Nearly! There is a space after can, but I and can are squashed together."
                hints:
                  - "Look for a gap after every word."
                  - "There are three words. You need two gaps."
                  - "I can hop. has a gap after I and after can."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "This sentence has finger spaces."
                say: "Look at the card. Does this sentence have finger spaces?"
                show: { drawn: letter-card, text: "Thecatsat." }
                answer: false
                hints:
                  - "Look for gaps between the words."
                  - "Can you see where cat starts?"
                  - "No. The words are squashed together."
              - id: l1-f3
                type: multiple_choice
                text: "How many words?"
                say: "Look at the sentence. How many words does it have?"
                show: { drawn: letter-card, text: "I see a dog." }
                options: ["3", "4", "5"]
                answer: "4"
                hints:
                  - "Point to each word. The spaces show where a word ends."
                  - "I, see, then two more."
                  - "I, see, a, dog. Four words."
              - id: l1-f4
                type: tracing
                text: "Copy the words."
                say: "Copy the words a cat. Leave a finger space between a and cat."
                show: { drawn: writing-lines, text: "a cat", mode: copy, arrows: false }
                char: "a cat"
              - id: l1-f5
                type: ordering
                text: "Put the words in order."
                say: "Put the word cards in order to make a sentence. Each card is one word."
                options: ["can", "run.", "I"]
                slot_count: 3
                answer: ["I", "can", "run."]
                option_audio: false
                hints:
                  - "A sentence starts with a capital letter."
                  - "Start with I."
                  - "I can run."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which one has finger spaces?"
                say: "Look carefully. Which sentence has a space after each word?"
                options: ["Mumhas a hat.", "Mum has a hat.", "Mum hasa hat."]
                answer: "Mum has a hat."
                option_audio: false
                hints: ["Check for a gap after every single word."]
              - id: l1-s2
                type: true_false
                text: "This sentence has finger spaces."
                say: "Look at the card. Does this sentence have finger spaces?"
                show: { drawn: letter-card, text: "We got a dog." }
                answer: true
                hints: ["Look between each word. Is there a gap?"]
              - id: l1-s3
                type: multiple_choice
                text: "How many words?"
                say: "Look at the sentence. How many words does it have?"
                show: { drawn: letter-card, text: "A cat sat." }
                options: ["2", "3", "4"]
                answer: "3"
                hints: ["Point to each word and count."]
              - id: l1-s4
                type: tracing
                text: "Copy the words."
                say: "Copy the words my dog. Leave a finger space between my and dog."
                show: { drawn: writing-lines, text: "my dog", mode: copy, arrows: false }
                char: "my dog"
              - id: l1-s5
                type: ordering
                text: "Put the words in order."
                say: "Put the word cards in order to make a sentence."
                options: ["a", "has", "Sam", "cat."]
                slot_count: 4
                answer: ["Sam", "has", "a", "cat."]
                option_audio: false
                hints: ["The name with a capital letter comes first."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which one has finger spaces?"
                say: "Which sentence has a space after each word?"
                options: ["Thedog ran.", "The dogran.", "The dog ran."]
                answer: "The dog ran."
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "This sentence has finger spaces."
                say: "Look at the card. Does this sentence have finger spaces?"
                show: { drawn: letter-card, text: "Igotabun." }
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "How many words?"
                say: "Look at the sentence. How many words does it have?"
                show: { drawn: letter-card, text: "I can see a big pig." }
                options: ["5", "6", "7"]
                answer: "6"
              - id: l1-n4
                type: tracing
                text: "Copy the words."
                say: "Copy the words a big hat. Leave a finger space after each word."
                show: { drawn: writing-lines, text: "a big hat", mode: copy, arrows: false }
                char: "a big hat"
              - id: l1-n5
                type: ordering
                text: "Put the words in order."
                say: "Put the word cards in order to make a sentence."
                options: ["is", "The", "hot.", "sun"]
                slot_count: 4
                answer: ["The", "sun", "is", "hot."]
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which one has finger spaces?"
            say: "Which sentence has a space after each word?"
            options: ["Pip hasabag.", "Piphas a bag.", "Pip has a bag."]
            answer: "Pip has a bag."
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "This sentence has finger spaces."
            say: "Does this sentence have finger spaces?"
            show: { drawn: letter-card, text: "Dad is in the van." }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "How many words?"
            say: "How many words does this sentence have?"
            show: { drawn: letter-card, text: "We can hop." }
            options: ["2", "3", "4"]
            answer: "3"

  - n: 2
    title: { de: "Zusammengequetschte Wörter", en: "Squashed words" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which one has finger spaces?"
            say: "Which sentence has a space after each word?"
            options: ["Ilike jam.", "I like jam.", "I likejam."]
            answer: "I like jam."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "How many words?"
            say: "Look at the sentence. How many words does it have?"
            show: { drawn: letter-card, text: "The cat is big." }
            options: ["3", "4", "5"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Mum hasa hat."
            say: "Look closely. Two words are squashed together: has and a. When you read your writing back, check for a space after every word."
            show: { drawn: letter-card, text: "Mum hasa hat." }
          - text: "Mum has a hat."
            say: "Now there is a finger space after has. Mum, has, a, hat. Four words, easy to read."
            show: { drawn: letter-card, text: "Mum has a hat." }
          - text: "I can run."
            say: "The full stop sits right after the last word, with no space before it. The capital letter starts the first word."
            show: { drawn: letter-card, text: "I can run." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many words?"
                say: "Look at the sentence. How many words does it have?"
                show: { drawn: letter-card, text: "Ben sat on a log." }
                options: ["4", "5", "6"]
                answer: "5"
                hints:
                  - "Point to each word. Each space ends a word."
                  - "Ben, sat, on, then two more."
                  - "Ben, sat, on, a, log. Five words."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which one has finger spaces?"
                say: "Which sentence has a space after each word?"
                options: ["The sunis hot.", "The sun is hot.", "Thesun is hot."]
                answer: "The sun is hot."
                option_audio: false
                hints:
                  - "Check every gap, one by one."
                  - "Look after sun and after The."
                  - "The sun is hot. has all its spaces."
              - id: l2-f3
                type: highlight_in_text
                text: "Tap the squashed words."
                say: "Two words are squashed together on this card. Tap them."
                show: { drawn: letter-card, text: "Mum got abig bun." }
                spans: ["abig"]
                hints:
                  - "Read each card. Is it one word or two?"
                  - "Look for a card that says two words with no space."
                  - "a and big are squashed together. Tap abig."
              - id: l2-f4
                type: ordering
                text: "Put the words in order."
                say: "Put the word cards in order to make a sentence."
                options: ["bed.", "in", "I", "am"]
                slot_count: 4
                answer: ["I", "am", "in", "bed."]
                option_audio: false
                hints:
                  - "Start with the capital letter."
                  - "I, then am."
                  - "I am in bed."
              - id: l2-f5
                type: true_false
                text: "This sentence has all its finger spaces."
                say: "Look at the card. Does this sentence have all its finger spaces?"
                show: { drawn: letter-card, text: "Sam hasa red hat." }
                answer: false
                hints:
                  - "Check the gap after every word."
                  - "Look at has and a."
                  - "No. has and a are squashed together."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tap the squashed words."
                say: "Two words are squashed together on this card. Tap them."
                show: { drawn: letter-card, text: "The pig isin the mud." }
                spans: ["isin"]
                hints: ["Find the card with two little words in it."]
              - id: l2-s2
                type: multiple_choice
                text: "Which one has finger spaces?"
                say: "Which sentence has a space after each word?"
                options: ["I gota cap.", "Igot a cap.", "I got a cap."]
                answer: "I got a cap."
                option_audio: false
                hints: ["Check the gaps after I and after got."]
              - id: l2-s3
                type: tracing
                text: "Copy the sentence."
                say: "Copy the sentence I can hop. Leave a finger space after each word."
                show: { drawn: writing-lines, text: "I can hop", mode: copy, arrows: false }
                char: "I can hop"
              - id: l2-s4
                type: ordering
                text: "Put the words in order."
                say: "Put the word cards in order to make a sentence."
                options: ["red.", "is", "bus", "The"]
                slot_count: 4
                answer: ["The", "bus", "is", "red."]
                option_audio: false
                hints: ["The word with the full stop comes last."]
              - id: l2-s5
                type: true_false
                text: "This sentence has all its finger spaces."
                say: "Look at the card. Does this sentence have all its finger spaces?"
                show: { drawn: letter-card, text: "We had a nap." }
                answer: true
                hints: ["Look for a gap after every word."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tap the squashed words."
                say: "Two words are squashed together on this card. Tap them."
                show: { drawn: letter-card, text: "I seea big fish." }
                spans: ["seea"]
              - id: l2-n2
                type: multiple_choice
                text: "Which one has finger spaces?"
                say: "Which sentence has a space after each word?"
                options: ["The foxran.", "Thefox ran.", "The fox ran."]
                answer: "The fox ran."
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "How many words?"
                say: "How many words does this sentence have?"
                show: { drawn: letter-card, text: "Dad has a red van." }
                options: ["4", "5", "6"]
                answer: "5"
              - id: l2-n4
                type: tracing
                text: "Copy the words."
                say: "Copy the words a red bus. Leave a finger space after each word."
                show: { drawn: writing-lines, text: "a red bus", mode: copy, arrows: false }
                char: "a red bus"
              - id: l2-n5
                type: ordering
                text: "Put the words in order."
                say: "Put the word cards in order to make a sentence."
                options: ["sat", "cat", "The", "down."]
                slot_count: 4
                answer: ["The", "cat", "sat", "down."]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which one has finger spaces?"
            say: "Which sentence has a space after each word?"
            options: ["It isa pig.", "It is a pig.", "Itis a pig."]
            answer: "It is a pig."
            option_audio: false
          - id: l2-c2
            type: highlight_in_text
            text: "Tap the squashed words."
            say: "Two words are squashed together. Tap them."
            show: { drawn: letter-card, text: "We sat onthe mat." }
            spans: ["onthe"]
          - id: l2-c3
            type: multiple_choice
            text: "How many words?"
            say: "How many words does this sentence have?"
            show: { drawn: letter-card, text: "The hen is in the shed." }
            options: ["5", "6", "7"]
            answer: "6"
          - id: l2-c4
            type: true_false
            text: "This sentence has all its finger spaces."
            say: "Does this sentence have all its finger spaces?"
            show: { drawn: letter-card, text: "Ican run." }
            answer: false
          - id: l2-c5
            type: ordering
            text: "Put the words in order."
            say: "Put the word cards in order to make a sentence."
            options: ["hat.", "has", "a", "Tom"]
            slot_count: 4
            answer: ["Tom", "has", "a", "hat."]
            option_audio: false
