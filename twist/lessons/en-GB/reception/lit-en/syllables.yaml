# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.syllables
skill: lit-en.phonological.syllables
curriculum: en-GB
language: en
title:
  de: Silben klatschen
  en: Clapping syllables
summary: >
  Children clap the syllables in a word: cat is one clap, rab-bit two,
  ba-na-na three. Each clap is a dot, so no reading is needed. Lesson 1
  claps and counts; lesson 2 sorts words by their claps and ends with the
  skill check.
metadata:
  year: reception
  topic: { de: Laute hören, en: Hearing sounds }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: [lit-en.phonological.rhymes]
  vocabulary: { en: [clap, syllable, beat, slowly] }
  no_reading: true
  forms: [picture, drawn, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: count-claps, what: { de: die Silben eines Wortes klatschen und zählen, en: clapping and counting the syllables in a word } }
    - { id: n-claps, what: { de: "ein Wort mit 1, 2 oder 3 Silben finden", en: "finding a word with 1, 2 or 3 claps" } }
    - { id: sort-claps, what: { de: Wörter nach ihren Silben ordnen, en: sorting words by their claps } }
  misconceptions:
    - id: sounds-not-syllables
      what: Claps every sound (c-a-t) instead of every syllable
      addressed: Learn claps whole word parts; hints say each part as it is clapped ("ba ... na ... na")
    - id: word-length
      what: Thinks a big animal has a long word (cow is big, so lots of claps)
      addressed: tasks set a big animal with a short word (cow) against a small one with a long word (butterfly); the skill check counts horse (l2-c11) and puts a whale beside teddy and octopus (l2-c9)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Wörter klatschen, en: Clapping words }
    new_content: true
    activities:
      - activity: learn
        mode: do-it-with-me
        screens:
          - say: "Let's clap some words. Cat. One clap: cat. Cat has one beat."
            show: { object: cat }
          - say: "Rabbit. Clap with me: rab ... bit. Two claps. Rabbit has two beats."
            show: { object: rabbit }
          - say: "Banana. Clap with me: ba ... na ... na. Three claps. Banana has three beats."
            show: { object: banana }
          - say: "Each clap is a dot. Three dots mean three claps."
            show: { drawn: dots, count: 3, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "How many claps?"
                say: "Apple. Clap the word. How many claps?"
                show: { object: apple }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "2"
                hints:
                  - "Say the word slowly and clap each part."
                  - "Ap ... ple."
                  - "Two claps: apple has two beats."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "How many claps?"
                say: "Dog. Clap the word. How many claps?"
                show: { object: dog }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "1"
                hints:
                  - "Say the word and clap."
                  - "Dog. Just one part."
                  - "One clap: dog has one beat."
                difficulty: easy
              - id: l1-f3
                type: image_multiple_choice
                text: "How many claps?"
                say: "Elephant. Clap the word. How many claps?"
                show: { object: elephant }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "3"
                hints:
                  - "Say it very slowly."
                  - "El ... e ... phant."
                  - "Three claps: elephant has three beats."
              - id: l1-f4
                type: true_false
                text: "Two claps?"
                say: "Monkey. Do you clap twice for monkey?"
                show: { object: monkey }
                answer: true
                hints:
                  - "Clap along."
                  - "Mon ... key."
                  - "Yes, two claps."
              - id: l1-f5
                type: image_multiple_choice
                text: "How many claps?"
                say: "Cow. Clap the word. How many claps?"
                show: { object: cow }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "1"
                feedback:
                  "3": "A cow is big, but the word is short: cow. Just one clap."
                hints:
                  - "Listen to the word, not how big the animal is."
                  - "Cow. Just one part."
                  - "One clap: cow has one beat."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "How many claps?"
                say: "Table. Clap the word. How many claps?"
                show: { object: table }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "2"
                hints: ["Say it slowly and clap each part."]
              - id: l1-s2
                type: image_multiple_choice
                text: "How many claps?"
                say: "Fish. Clap the word. How many claps?"
                show: { object: fish }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "1"
                hints: ["Does the word have more than one part?"]
              - id: l1-s3
                type: true_false
                text: "Three claps?"
                say: "Carrot. Do you clap three times for carrot?"
                show: { object: carrot }
                answer: false
                hints: ["Clap along: car ... and then?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "How many claps?"
                say: "Butterfly. Clap the word. How many claps?"
                show: { object: butterfly }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "3"
                hints: ["But ... and then?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which word has 3 claps?"
                say: "Which word do you clap three times?"
                options: [{ object: sun }, { object: crocodile }, { object: rabbit }]
                answer: crocodile
                hints: ["Tap each picture and clap the word."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "How many claps?"
                say: "Tree. Clap the word. How many claps?"
                show: { object: tree }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "1"
              - id: l1-n2
                type: image_multiple_choice
                text: "How many claps?"
                say: "Octopus. Clap the word. How many claps?"
                show: { object: octopus }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "3"
              - id: l1-n3
                type: true_false
                text: "One clap?"
                say: "Duck. Do you clap once for duck?"
                show: { object: duck }
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Which word has 1 clap?"
                say: "Which word do you clap only once?"
                options: [{ object: telephone }, { object: mirror }, { object: bee }]
                answer: bee
              - id: l1-n5
                type: image_multiple_choice
                text: "How many claps?"
                say: "Lion. Clap the word. How many claps?"
                show: { object: lion }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "2"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "How many claps?"
            say: "Sun. Clap the word. How many claps?"
            show: { object: sun }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
            answer: "1"
          - id: l1-c2
            type: image_multiple_choice
            text: "How many claps?"
            say: "Telephone. Clap the word. How many claps?"
            show: { object: telephone }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
            answer: "3"
          - id: l1-c3
            type: image_multiple_choice
            text: "How many claps?"
            say: "Rabbit. Clap the word. How many claps?"
            show: { object: rabbit }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
            answer: "2"
          - id: l1-c4
            type: image_multiple_choice
            text: "How many claps?"
            say: "Candle. Clap the word. How many claps?"
            show: { object: candle }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
            answer: "2"
          - id: l1-c5
            type: true_false
            text: "Three claps?"
            say: "Lorry. Do you clap three times for lorry?"
            show: { object: lorry }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Which word has 1 clap?"
            say: "Which word do you clap only once?"
            options: [{ object: bucket }, { object: hen }, { object: umbrella }]
            answer: hen

  - n: 2
    title: { de: Silben sortieren, en: Sorting by claps }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Now we sort. One dot means one clap, two dots two claps, three dots three claps. Hat: one clap. Hat goes with one dot."
            show: { object: hat }
          - say: "Crocodile: croc ... o ... dile. Three claps. The crocodile goes with three dots."
            show: { object: crocodile }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Sort by claps."
                say: "Clap each word. One clap or two? Sort the pictures."
                bins:
                  - { id: "1", show: { drawn: dots, count: 1, layout: row }, say: { en: "One clap." } }
                  - { id: "2", show: { drawn: dots, count: 2, layout: row }, say: { en: "Two claps." } }
                options:
                  - { object: ball, bin: "1" }
                  - { object: rabbit, bin: "2" }
                  - { object: cup, bin: "1" }
                  - { object: ladder, bin: "2" }
                hints:
                  - "Tap a picture, listen to the word and clap it."
                  - "Ball: one clap. Rabbit: rab ... bit, two claps."
                  - "Ball and cup one clap, rabbit and ladder two claps."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "What goes together?"
                say: "Tap a picture, then tap the right number of claps."
                pairs:
                  - left: { object: hand }
                    right: { drawn: dots, count: 1, layout: row }
                  - left: { object: mirror }
                    right: { drawn: dots, count: 2, layout: row }
                  - left: { object: pineapple }
                    right: { drawn: dots, count: 3, layout: row }
                hints:
                  - "Tap a picture and clap the word."
                  - "Hand: one clap. Mirror: two."
                  - "Pineapple: pine ... ap ... ple, three claps."
              - id: l2-f3
                type: image_multiple_choice
                text: "Which word has 2 claps?"
                say: "Which word do you clap twice?"
                options: [{ object: cow }, { object: hedgehog }, { object: elephant }]
                answer: hedgehog
                hints:
                  - "Clap each word."
                  - "Cow one clap, elephant three."
                  - "Hedge ... hog: two claps."
              - id: l2-f4
                type: sorting
                text: "Sort by claps."
                say: "Clap each word. Two claps or three? Sort the pictures."
                bins:
                  - { id: "2", show: { drawn: dots, count: 2, layout: row }, say: { en: "Two claps." } }
                  - { id: "3", show: { drawn: dots, count: 3, layout: row }, say: { en: "Three claps." } }
                options:
                  - { object: banana, bin: "3" }
                  - { object: apple, bin: "2" }
                  - { object: strawberry, bin: "3" }
                  - { object: table, bin: "2" }
                hints:
                  - "Clap each word slowly."
                  - "Ba ... na ... na: three. Ap ... ple: two."
                  - "Banana and strawberry three, apple and table two."
              - id: l2-f5
                type: true_false
                text: "Three claps?"
                say: "Crocodile. Do you clap three times for crocodile?"
                show: { object: crocodile }
                answer: true
                hints:
                  - "Clap along."
                  - "Croc ... o ... dile."
                  - "Yes, three claps."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Sort by claps."
                say: "Clap each word. One, two or three claps? Sort the pictures."
                bins:
                  - { id: "1", show: { drawn: dots, count: 1, layout: row }, say: { en: "One clap." } }
                  - { id: "2", show: { drawn: dots, count: 2, layout: row }, say: { en: "Two claps." } }
                  - { id: "3", show: { drawn: dots, count: 3, layout: row }, say: { en: "Three claps." } }
                options:
                  - { object: moon, bin: "1" }
                  - { object: monkey, bin: "2" }
                  - { object: butterfly, bin: "3" }
                  - { object: star, bin: "1" }
                  - { object: lion, bin: "2" }
                hints: ["Tap each picture and clap the word."]
              - id: l2-s2
                type: matching
                text: "What goes together?"
                say: "Tap a picture, then tap the right number of claps."
                pairs:
                  - left: { object: octopus }
                    right: { drawn: dots, count: 3, layout: row }
                  - left: { object: bread }
                    right: { drawn: dots, count: 1, layout: row }
                  - left: { object: anchor }
                    right: { drawn: dots, count: 2, layout: row }
                hints: ["Clap each word."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which word has 1 clap?"
                say: "Which word do you clap only once?"
                options: [{ object: hat }, { object: telephone }, { object: rabbit }]
                answer: hat
                hints: ["Just one part, just one clap."]
              - id: l2-s4
                type: true_false
                text: "Two claps?"
                say: "Goat. Do you clap twice for goat?"
                show: { object: goat }
                answer: false
                hints: ["Goat is a short word."]
              - id: l2-s5
                type: image_multiple_choice
                text: "How many claps?"
                say: "Balloon. Clap the word. How many claps?"
                show: { object: balloon }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "2"
                hints: ["Bal ... and then?"]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Sort by claps."
                say: "Clap each word. One, two or three claps? Sort the pictures."
                bins:
                  - { id: "1", show: { drawn: dots, count: 1, layout: row }, say: { en: "One clap." } }
                  - { id: "2", show: { drawn: dots, count: 2, layout: row }, say: { en: "Two claps." } }
                  - { id: "3", show: { drawn: dots, count: 3, layout: row }, say: { en: "Three claps." } }
                options:
                  - { object: bus, bin: "1" }
                  - { object: elephant, bin: "3" }
                  - { object: giraffe, bin: "2" }
                  - { object: shoe, bin: "1" }
                  - { object: pineapple, bin: "3" }
              - id: l2-n2
                type: image_multiple_choice
                text: "How many claps?"
                say: "Crayon. Clap the word. How many claps?"
                show: { object: crayon }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "2"
              - id: l2-n3
                type: matching
                text: "What goes together?"
                say: "Tap a picture, then tap the right number of claps."
                pairs:
                  - left: { object: banana }
                    right: { drawn: dots, count: 3, layout: row }
                  - left: { object: frog }
                    right: { drawn: dots, count: 1, layout: row }
                  - left: { object: carrot }
                    right: { drawn: dots, count: 2, layout: row }
              - id: l2-n4
                type: true_false
                text: "One clap?"
                say: "Clock. Do you clap once for clock?"
                show: { object: clock }
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "Which word has 2 claps?"
                say: "Which word do you clap twice?"
                options: [{ object: telephone }, { object: marble }, { object: fish }]
                answer: marble

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: count-claps
            type: image_multiple_choice
            text: "How many claps?"
            say: "Mirror. Clap the word. How many claps?"
            show: { object: mirror }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
            answer: "2"
          - id: l2-c2
            part: count-claps
            type: image_multiple_choice
            text: "How many claps?"
            say: "Strawberry. Clap the word. How many claps?"
            show: { object: strawberry }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
            answer: "3"
          - id: l2-c3
            part: n-claps
            type: image_multiple_choice
            text: "Which word has 1 clap?"
            say: "Which word do you clap only once?"
            options: [{ object: snail }, { object: hedgehog }, { object: elephant }]
            answer: snail
          - id: l2-c4
            part: sort-claps
            type: sorting
            text: "Sort by claps."
            say: "Leg, monkey, mouse, llama. Clap each word. One clap or two? Sort the pictures."
            bins:
              - { id: "1", show: { drawn: dots, count: 1, layout: row }, say: { en: "One clap." } }
              - { id: "2", show: { drawn: dots, count: 2, layout: row }, say: { en: "Two claps." } }
            options:
              - { object: leg, bin: "1" }
              - { object: monkey, bin: "2" }
              - { object: mouse, bin: "1" }
              - { object: llama, bin: "2" }
          - id: l2-c5
            part: count-claps
            type: image_multiple_choice
            text: "How many claps?"
            say: "Umbrella. Clap the word. How many claps?"
            show: { object: umbrella }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
            answer: "3"
          - id: l2-c6
            part: n-claps
            type: image_multiple_choice
            text: "Which word has 3 claps?"
            say: "Which word do you clap three times?"
            options: [{ object: ladder }, { object: sheep }, { object: tomato }]
            answer: tomato
          - id: l2-c7
            part: sort-claps
            type: matching
            text: "Bed, jacket, honeycomb: how many claps?"
            say: "Bed, jacket, honeycomb. Clap each word, then match it to its claps."
            pairs:
              - left: { object: bed }
                right: { drawn: dots, count: 1, layout: row }
              - left: { object: jacket }
