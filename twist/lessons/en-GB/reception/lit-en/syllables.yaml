              - left: { object: honeycomb }
                right: { drawn: dots, count: 3, layout: row }
          - id: l2-c8
            part: count-claps
            type: image_multiple_choice
            text: "How many claps?"
            say: "Zebra. Clap the word. How many claps?"
            show: { object: zebra }
            options:
