            say: "A new story. Ben ate an apple. Crunch, crunch, yum! Ben ate a carrot. Crunch, crunch, yum! Did the words Crunch, crunch, yum! come only once?"
            show: { object: carrot }
            answer: false
          - id: l2-c14
            part: sound-cue
            type: true_false
            text: "Who's in the garden? Ribbit, ribbit, ribbit! The sounds tell us it is Duck."
