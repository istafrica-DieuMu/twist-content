            type: multiple_choice
            text: "Mouse ran up the clock. Tick, tock, tick! Cat ran up the clock. Tick, tock, tick! Dog ran up the clock. Tick, tock, tick! Which words come again and again?"
            say: "Listen to a new story. Mouse ran up the clock. Tick, tock, tick! Cat ran up the clock. Tick, tock, tick! Dog ran up the clock. Tick, tock, tick! Which words come again and again?"
            options: ["Mouse ran up the clock.", "Tick, tock, tick!", "Dog ran up the clock."]
            answer: "Tick, tock, tick!"
