# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.predictable-phrases
skill: lit-en.texts.predictable-phrases
curriculum: en-GB
language: en
title:
  de: Bei wiederkehrenden Sätzen mitsprechen
  en: Joining in with repeated phrases
summary: >
  Joining in with the words that come back again and again in stories
  and rhymes. Lesson 1 tells The big red bus, where everyone who gets on
  is followed by "Beep, beep! Off we go!"; lesson 2 tells Who's in the
  garden?, where the question repeats and three sounds tell us who it
  is, adds an action rhyme and ends with the skill check. Story and
  rhymes are written for Twist and read aloud. The child picks the words
  that come next and says when they come; joining in aloud runs as speak
  tasks, practised and not marked.
metadata:
  year: reception
  topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.texts.listen-range]
  also_practises: [lit-en.texts.listen-range]
  vocabulary: { en: [join in, repeat, again and again, rhyme, refrain] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: misses-the-repeat
      what: Does not notice that some words come back, so does not join in
      addressed: Learn in both lessons names the repeated words and says them together; l1-f4, l1-s3, l2-w2, l2-f3 (with feedback), l2-n3 and the skill check task l2-c3
    - id: wrong-moment
      what: Knows the phrase but not when it comes, or says it at the wrong point
      addressed: Learn in lesson 1 says the phrase comes each time someone gets on; l1-s4 and l1-n5 ask when it comes
    - id: mixes-refrains
      what: Mixes up the repeated words of different stories (Ready, steady, go! in the bus story)
      addressed: the words of another story are an option in l1-n1, l1-n5 and l2-c1
    - id: sound-cue-ignored
      what: Joins in with the question but does not use the sounds to say who comes next
      addressed: l2-f1, l2-f4, l2-s1, l2-s5, l2-n1, l2-n5, l2-c2 and l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Der große rote Bus", en: "The big red bus" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Story, poem or facts?"
            say: "Listen. Ducks have webbed feet to help them swim. Is that from a story, a poem or a book of facts?"
            options: ["a story", "a poem", "a book of facts"]
            answer: "a book of facts"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "What is the poem about?"
            say: "Listen to the poem. What is it about?"
            audio: { en: "Round and white and shining bright, it lights the sky all through the night." }
            options: [{ object: sun }, { object: moon }, { object: lamp }]
            answer: moon
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The big red bus"
            say: "Grandma got on the big red bus. Beep, beep! Off we go! Then Dad got on. Beep, beep! Off we go! Then the baby got on. Beep, beep! Off we go! Then a dog got on! Woof! Beep, beep! Off we go!"
            show: { object: bus }
          - text: "Beep, beep! Off we go!"
            say: "Some words come again and again in a story: Beep, beep! Off we go! When you know them, you can join in. Say it with me: Beep, beep! Off we go!"
            show: { object: bus }
          - text: "When does it come?"
            say: "Listen for when the words come. Every time someone gets on the bus, we say: Beep, beep! Off we go!"
            show: { objects: [grandma, dad] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What comes next?"
                say: "Grandma got on the big red bus. Beep, beep! What comes next?"
                options: ["Good night!", "Off we go!", "Splash, splash!"]
                answer: "Off we go!"
                hints:
                  - "Think of the words that come again and again."
                  - "Beep, beep! Off we ..."
                  - "Off we go!"
                difficulty: easy
              - id: l1-f2
                type: speak
                text: "Join in!"
                say: "Join in with the bus. Say: Beep, beep! Off we go!"
                show: { object: bus }
                expected_text: "Beep, beep! Off we go!"
                hints:
                  - "Say it nice and loud."
                  - "Start with Beep, beep."
                  - "Beep, beep! Off we go!"
              - id: l1-f3
                type: ordering
                text: "Who got on?"
                say: "Who got on the bus? Put the pictures in order: first, next, then."
                options: [{ object: dad }, { object: baby }, { object: grandma }]
                slot_count: 3
                answer: [grandma, dad, baby]
                hints:
                  - "Who got on first?"
                  - "Grandma first. Then who?"
                  - "Grandma, Dad, the baby."
              - id: l1-f4
                type: true_false
                text: "Every time someone got on the bus, we said: Beep, beep! Off we go!"
                say: "Every time someone got on the bus, we said Beep, beep! Off we go! Is that right?"
                show: { object: bus }
                answer: true
                hints:
                  - "Think of Grandma, Dad and the baby."
                  - "What did we say after each one?"
                  - "Yes. Every time."
              - id: l1-f5
                type: image_multiple_choice
                text: "Who said woof?"
                say: "Who got on the bus last and said Woof?"
                options: [{ object: cow }, { object: cat }, { object: dog }]
                answer: dog
                hints:
                  - "Which animal says woof?"
                  - "It got on at the very end."
                  - "The dog."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What comes next?"
                say: "Then the baby got on. Beep, beep! What comes next?"
                options: ["Here we are!", "Off we go!", "Off to bed!"]
                answer: "Off we go!"
                hints: ["Beep, beep! Off we ..."]
              - id: l1-s2
                type: speak
                text: "Join in!"
                say: "Join in with the end of the story. Say: Woof! Beep, beep! Off we go!"
                show: { object: dog }
                expected_text: "Woof! Beep, beep! Off we go!"
                hints: ["The dog says woof, then everyone says the bus words."]
              - id: l1-s3
                type: true_false
                text: "In the story, we said Beep, beep! Off we go! only once."
                say: "In the story, we said Beep, beep! Off we go! only once. Is that right?"
                show: { object: bus }
                answer: false
                hints: ["How many people got on the bus?"]
              - id: l1-s4
                type: multiple_choice
                text: "When do we say it?"
                say: "When do we say Beep, beep! Off we go?"
                options: ["when it rains", "when someone gets on the bus", "when we eat lunch"]
                answer: "when someone gets on the bus"
                hints: ["Think about what happens just before."]
              - id: l1-s5
                type: image_multiple_choice
                text: "What is the story about?"
                say: "Think about the story with Beep, beep! Off we go! What is it about?"
                options: [{ object: boat }, { object: bike }, { object: bus }]
                answer: bus
                hints: ["What did everyone get on?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What comes next?"
                say: "Here is a new story. Ted put on his hat. Ready, steady, go! Ted put on his shoes. Ready, steady, what comes next?"
                options: ["stop!", "go!", "Off we go!"]
                answer: "go!"
              - id: l1-n2
                type: speak
                text: "Join in!"
                say: "Join in with Ted's story. Say: Ready, steady, go!"
                show: { object: shoe }
                expected_text: "Ready, steady, go!"
              - id: l1-n3
                type: ordering
                text: "Who got on?"
                say: "Who got on the big red bus? Put all four pictures in order."
                options: [{ object: dog }, { object: baby }, { object: grandma }, { object: dad }]
                slot_count: 4
                answer: [grandma, dad, baby, dog]
              - id: l1-n4
                type: true_false
                text: "In Ted's story, the words that came again and again were: Ready, steady, go!"
                say: "In Ted's story, the words that came again and again were Ready, steady, go! Is that right?"
                show: { object: hat }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "What comes next?"
                say: "Then a cat got on the big red bus. Miaow! What would we say next?"
                options: ["Once upon a time.", "Ready, steady, go!", "Beep, beep! Off we go!"]
                answer: "Beep, beep! Off we go!"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What comes next?"
            say: "Dad got on the big red bus. Beep, beep! What comes next?"
            options: ["Good morning!", "Off we go!", "Look out!"]
            answer: "Off we go!"
          - id: l1-c2
            type: image_multiple_choice
            text: "Who got on first?"
            say: "Who got on the big red bus first?"
            options: [{ object: baby }, { object: dad }, { object: grandma }]
            answer: grandma
          - id: l1-c3
            type: true_false
            text: "In the story, the bus said: Toot, toot!"
            say: "In the story, the bus said Toot, toot! Is that right?"
            show: { object: bus }
            answer: false

  - n: 2
    title: { de: "Wer ist im Garten?", en: "Who's in the garden?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "What comes next?"
            say: "Then Grandpa got on the big red bus. Beep, beep! What comes next?"
            options: ["Night, night!", "Off we go!", "Splish, splash!"]
            answer: "Off we go!"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "In the bus story, we said Beep, beep! Off we go! again and again."
            say: "In the bus story, we said Beep, beep! Off we go! again and again. Is that right?"
            show: { object: bus }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Who's in the garden?"
            say: "Who's in the garden? Hop, hop, hop! It's Rabbit! Who's in the garden? Buzz, buzz, buzz! It's Bee! Who's in the garden? Quack, quack, quack! It's Duck! Who's in the garden? Snore, snore, snore! It's Grandpa, fast asleep!"
            show: { object: garden }
          - text: "Join in"
            say: "The question comes again and again: Who's in the garden? Each time, three sounds tell us who it is. Join in with the question: Who's in the garden?"
            show: { objects: [rabbit, bee] }
          - text: "Stamp your feet"
            say: "Rhymes have repeated words too. Stamp and join in: Stamp your feet, stamp your feet, stamp them on the floor! Stamp your feet, stamp your feet, then stamp them some more!"
            show: { object: foot }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Who is it?"
                say: "Who's in the garden? Buzz, buzz, buzz! It's ... Tap the picture."
                options: [{ object: duck }, { object: bee }, { object: rabbit }]
                answer: bee
                hints:
                  - "Listen to the sound: buzz, buzz, buzz."
                  - "Which one buzzes?"
                  - "It's Bee!"
                difficulty: easy
              - id: l2-f2
                type: speak
                text: "Join in!"
                say: "Join in with the question. Say: Who's in the garden?"
                show: { object: garden }
                expected_text: "Who's in the garden?"
                hints:
                  - "It is a question, so let your voice go up."
                  - "Start with Who's."
                  - "Who's in the garden?"
              - id: l2-f3
                type: multiple_choice
                text: "Which words come again?"
                say: "Which words come again and again in Who's in the garden?"
                options: ["It's Grandpa, fast asleep!", "Who's in the garden?", "Snore, snore, snore!"]
                answer: "Who's in the garden?"
                feedback:
                  "It's Grandpa, fast asleep!": "That comes only once, at the very end. Which words did we say every time?"
                hints:
                  - "Which words did we say before every animal?"
                  - "It is a question."
                  - "Who's in the garden?"
              - id: l2-f4
                type: audio_choice
                text: "Who is it?"
                say: "Listen. Who is it? Tap the picture."
                audio: { en: "Who's in the garden? Quack, quack, quack!" }
                options: [{ object: cow }, { object: pig }, { object: duck }]
                answer: duck
                hints:
                  - "Listen to the sound."
                  - "Which animal says quack?"
                  - "It's Duck!"
              - id: l2-f5
                type: speak
                text: "Join in!"
                say: "Join in with the rhyme. Say: Stamp your feet, stamp your feet, stamp them on the floor!"
                show: { object: foot }
                expected_text: "Stamp your feet, stamp your feet, stamp them on the floor!"
                hints:
                  - "Stamp as you say it."
                  - "Say stamp your feet two times."
                  - "Stamp your feet, stamp your feet, stamp them on the floor!"

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Who is it?"
                say: "Who's in the garden? Hop, hop, hop! It's ... Tap the picture."
                options: [{ object: snail }, { object: rabbit }, { object: fish }]
                answer: rabbit
                hints: ["Which one hops?"]
              - id: l2-s2
                type: true_false
                text: "At the end of the story, it was a dog in the garden."
                say: "At the end of the story, it was a dog in the garden. Is that right?"
                show: { object: garden }
                answer: false
                hints: ["Who was snoring at the end?"]
              - id: l2-s3
                type: multiple_choice
                text: "What comes next?"
                say: "Stamp your feet, stamp your feet, stamp them on the ... What comes next?"
                options: ["moon!", "floor!", "cake!"]
                answer: "floor!"
                hints: ["Where do your feet stamp?"]
              - id: l2-s4
                type: speak
                text: "Make your own!"
                say: "Make up a new part. Say: Who's in the garden? Moo, moo, moo! It's Cow!"
                show: { object: cow }
                expected_text: "Who's in the garden? Moo, moo, moo! It's Cow!"
                hints: ["Start with the question, then the sounds."]
              - id: l2-s5
                type: audio_choice
                text: "Who is it?"
                say: "Listen. Who is it? Tap the picture."
                audio: { en: "Who's in the garden? Snore, snore, snore!" }
                options: [{ object: grandpa }, { object: dog }, { object: baby }]
                answer: grandpa
                hints: ["Who was fast asleep at the end of the story?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Who is it?"
                say: "Listen. Who is it? Tap the picture."
                audio: { en: "Who's in the garden? Woof, woof, woof!" }
                options: [{ object: bird }, { object: dog }, { object: cat }]
                answer: dog
              - id: l2-n2
                type: multiple_choice
                text: "What comes next?"
                say: "A new rhyme. Wave your hands, wave your hands, wave them in the air! Wave your hands, wave your hands, wave them ... What comes next?"
                options: ["in the bath!", "everywhere!", "to the shop!"]
                answer: "everywhere!"
              - id: l2-n3
                type: true_false
                text: "Every time, the story asked: Who's in the garden?"
                say: "Every time, the story asked: Who's in the garden? Is that right?"
                show: { object: garden }
                answer: true
              - id: l2-n4
                type: speak
                text: "Join in!"
                say: "Join in with the new rhyme. Say: Wave your hands, wave your hands, wave them in the air!"
                show: { object: wave }
                expected_text: "Wave your hands, wave your hands, wave them in the air!"
              - id: l2-n5
                type: image_multiple_choice
                text: "Who is it?"
                say: "Who's in the garden? Hiss, hiss, hiss! It's ... Tap the picture."
                options: [{ object: cat }, { object: bee }, { object: snake }]
                answer: snake

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "What comes next?"
            say: "Then a cow got on the big red bus! Moo! Beep, beep! What comes next?"
            options: ["Ready, steady, go!", "Good night!", "Off we go!"]
            answer: "Off we go!"
          - id: l2-c2
            type: image_multiple_choice
            text: "Who is it?"
            say: "Who's in the garden? Miaow, miaow, miaow! It's ... Tap the picture."
            options: [{ object: duck }, { object: cat }, { object: dog }]
            answer: cat
          - id: l2-c3
            type: multiple_choice
            text: "Which words come again?"
            say: "Which words come again and again in the big red bus story?"
            options: ["Grandma got on.", "A dog got on.", "Beep, beep! Off we go!"]
            answer: "Beep, beep! Off we go!"
          - id: l2-c4
            type: multiple_choice
            text: "What comes next?"
            say: "Stamp your feet, stamp your feet, stamp them on the floor! Stamp your feet, stamp your feet, then stamp them some ... What comes next?"
            options: ["more!", "cake!", "moon!"]
            answer: "more!"
          - id: l2-c5
            type: true_false
            text: "Who's in the garden? Oink, oink, oink! The sounds tell us it is Pig."
            say: "Who's in the garden? Oink, oink, oink! Do the sounds tell us it is Pig?"
            show: { object: pig }
            answer: true
