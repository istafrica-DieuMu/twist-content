# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.adjacent-consonants
skill: lit-en.phonics.adjacent-consonants
curriculum: en-GB
language: en
title:
  de: Wörter mit Konsonantenhäufung
  en: Words with consonants next to each other
summary: >
  Words where two consonants sit side by side and both are heard. Lesson
  1 takes them at the end of a word (lamp, milk, hand, jump); lesson 2
  takes them at the start (frog, clap, stop) and in words like stamp
  with two at each end, and ends with the skill check. The child counts
  the sounds, fills in the consonant that is easy to miss, picks the word
  it hears and reads words to find their pictures.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: [lit-en.phonics.ch-sh-th-ng]
  vocabulary: { en: [sound, letter, sound buttons, blend, segment, next to each other] }
  forms: [text, picture, audio, drawn]
  drawn: [dots, letter-card]
  facets: []
  parts:
    - { id: count-sounds, what: { de: "jeden Laut hören, auch wenn zwei Konsonanten nebeneinanderstehen (jump hat vier Laute)", en: "hearing every sound when two consonants sit side by side (jump has four sounds)" } }
    - { id: missing-letter, what: { de: "den Konsonanten schreiben, den man leicht überhört", en: writing the consonant that is easy to miss } }
    - { id: hear-word, what: { de: "das gehörte Wort unter ähnlichen Wörtern finden (pin, spin, skin)", en: "finding the word you hear among words that look alike (pin, spin, skin)" } }
    - { id: read-find, what: { de: ein Wort mit zwei Konsonanten nebeneinander lesen und sein Bild finden, en: reading a word with two consonants side by side and finding its picture } }
  misconceptions:
    - id: drops-a-consonant
      what: Leaves out one of the two consonants when reading or spelling (lap for lamp, fog for frog)
      addressed: the missing consonant is the gap in l1-f2, l1-s2, l1-n2, l1-c2, l2-f2, l2-s2, l2-n2, l2-c2 and l2-c5; the shorter word is an option in l1-f4, l1-s4, l1-n4, l2-f4 (with feedback), l2-s4, l2-n4 and l2-c3; true/false cards l1-f5, l1-n5 and l2-s5 drop one consonant
    - id: cluster-one-sound
      what: Counts two consonants side by side as one sound (frog as three sounds)
      addressed: Learn in both lessons gives each consonant its own sound button; how-many-sounds tasks l1-f1 (with feedback), l1-s1, l1-n1, l2-f1 (with feedback), l2-s1, l2-n1 and l2-c1
    - id: extra-vowel
      what: Puts a vowel between the two consonants when blending (fu-rog for frog)
      addressed: Learn in lesson 2 says the two sounds together with no sound between them; hints of l2-f2 and l2-f3 say to slide straight from one sound to the next
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "lamp, milk, hand", en: "lamp, milk, hand" }
    goal:
      de: "Sprich jeden Laut in Wörtern wie lamp und milk, auch die zwei Laute am Ende."
      en: "Say every sound in words like lamp and milk, even the two sounds at the end."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "l a m p → lamp"
            say: "Lamp has four sounds. Touch each sound button and say its sound. The last two sounds sit next to each other, so say them both. Then push the sounds together: lamp."
            show: { drawn: letter-card, text: "l a m p" }
          - text: "lamp"
            say: "Lamp. Four sounds, four sound buttons."
            show: { object: lamp }
          - text: "m i l k → milk"
            say: "Milk has four sounds too. The sound just before the end is quiet, so listen hard for it. Milk."
            show: { drawn: letter-card, text: "m i l k" }
          - text: "h a n d → hand"
            say: "Hand has four sounds. Point to each sound button as you say it, then push the sounds together: hand."
            show: { drawn: letter-card, text: "h a n d" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Lamp. Say it slowly. How many sounds can you hear?"
                show: { object: lamp }
                options:
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 5, layout: row }
                answer: "4"
                feedback:
                  "3": "Nearly! Lamp has two sounds at the end, one after the other. That makes four sounds."
                hints:
                  - "Say lamp slowly and hold up a finger for each sound."
                  - "Listen to the end. There are two sounds there, not one."
                  - "Lamp has four sounds."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Milk. Say it slowly. Which letter is missing?"
                show: { object: milk }
                frame: "mi_k"
                options: ["l", "n", "c"]
                answer: ["l"]
                hints:
                  - "Say milk very slowly."
                  - "Listen just before the end. There is a quiet sound there."
                  - "The missing sound is the one at the start of leg. Tap that letter."
              - id: l1-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "hand" }
                options: [{ object: hat }, { object: hand }, { object: head }]
                answer: hand
                hints:
                  - "Say each sound on the card."
                  - "There are two sounds at the end of the word."
                  - "Push the sounds together: hand. Tap the hand."
              - id: l1-f4
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Tent." }
                options: ["ten", "tent", "test"]
                answer: "tent"
                hints:
                  - "Listen to the end of the word."
                  - "There are two sounds at the end."
                  - "Tent."
              - id: l1-f5
                type: true_false
                text: "Does the card say bet?"
                say: "Read the card. Does it say bet?"
                show: { drawn: letter-card, text: "best" }
                answer: false
                hints:
                  - "Point to each letter and say its sound."
                  - "Look just before the last letter. Is there one more letter?"
                  - "No. The card says best. There is a hissing sound before the last one."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Hand. Say it slowly. How many sounds can you hear?"
                show: { object: hand }
                options:
                  - { drawn: dots, count: 5, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "4"
                hints: ["Hold up a finger for each sound. Listen for two at the end."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Jump. Say it slowly. Which letter is missing?"
                show: { object: jump }
                frame: "ju_p"
                options: ["n", "m", "b"]
                answer: ["m"]
                hints: ["Listen for the humming sound just before the last sound."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "milk" }
                options: [{ object: mouse }, { object: mum }, { object: milk }]
                answer: milk
                hints: ["Say every sound on the card, then push them together."]
              - id: l1-s4
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Belt." }
                options: ["bet", "bell", "belt"]
                answer: "belt"
                hints: ["Listen to the end. How many sounds are there after e?"]
              - id: l1-s5
                type: true_false
                text: "Does jump end with two sounds?"
                say: "Jump. Does jump end with two sounds, a hum and then a pop of your lips?"
                show: { object: jump }
                answer: true
                hints: ["Say jump slowly. Listen to the last two sounds."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Milk. Say it slowly. How many sounds can you hear?"
                show: { object: milk }
                options:
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                answer: "4"
              - id: l1-n2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Nest. Say it slowly. Which letter is missing?"
                frame: "ne_t"
                options: ["t", "s", "n"]
                answer: ["s"]
              - id: l1-n3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "lamp" }
                options: [{ object: leg }, { object: lamp }, { object: ladder }]
                answer: lamp
              - id: l1-n4
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Pond." }
                options: ["pond", "pod", "pong"]
                answer: "pond"
              - id: l1-n5
                type: true_false
                text: "Does the card say ten?"
                say: "Read the card. Does it say ten?"
                show: { drawn: letter-card, text: "tent" }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which word do you hear?"
            say: "Listen. Tap the word you hear."
            audio: { en: "Desk." }
            options: ["deck", "desk", "dusk"]
            answer: "desk"
          - id: l1-c2
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Hand. Which letter is missing?"
            show: { object: hand }
            frame: "ha_d"
            options: ["m", "d", "n"]
            answer: ["n"]
          - id: l1-c3
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Then tap its picture."
            show: { drawn: letter-card, text: "jump" }
            options: [{ object: juice }, { object: jacket }, { object: jump }]
            answer: jump
            option_audio: false
          - id: l1-c4
            type: image_multiple_choice
            text: "How many sounds?"
            say: "Ant. How many sounds can you hear?"
            show: { object: ant }
            options:
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
              - { drawn: dots, count: 4, layout: row }
            answer: "3"
          - id: l1-c5
            type: true_false
            text: "bench"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: bench }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "Which word do you hear?"
            say: "Listen. Tap the word you hear."
            audio: { en: "Pink." }
            options: ["pin", "pink", "pick"]
            answer: "pink"

  - n: 2
