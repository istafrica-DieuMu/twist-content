                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Crab." }
                options: ["cab", "crab", "grab"]
                answer: "crab"
                hints: ["Listen to the first two sounds."]
              - id: l2-s5
                type: true_false
                text: "Does the card say pot?"
                say: "Read the card. Does it say pot?"
                show: { drawn: letter-card, text: "spot" }
                answer: false
                hints: ["Look at the first letter."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Dress. Say it slowly. How many sounds can you hear?"
                show: { object: dress }
