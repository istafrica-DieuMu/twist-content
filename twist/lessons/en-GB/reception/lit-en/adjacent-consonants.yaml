            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Milk. Which letter is missing?"
            frame: "mi_k"
            options: ["s", "l", "n"]
            answer: ["l"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "f r o g → frog"
            say: "Frog has four sounds. The first two sit next to each other. Slide straight from the first sound to the second, with no sound in between. Then push all the sounds together: frog."
            show: { object: frog }
          - text: "c l a p → clap"
            say: "Clap has two sounds at the start too. Say them both, then push the sounds together: clap."
            show: { drawn: letter-card, text: "c l a p" }
          - text: "s t a m p → stamp"
            say: "Stamp has two sounds at the start and two at the end. That is five sounds, and five sound buttons. Stamp."
            show: { drawn: letter-card, text: "s t a m p" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Frog. Say it slowly. How many sounds can you hear?"
                show: { object: frog }
                options:
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 5, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "4"
                feedback:
                  "3": "Nearly! Frog starts with two sounds, one after the other. That makes four sounds."
                hints:
                  - "Say frog slowly and hold up a finger for each sound."
                  - "Two sounds at the start, then two more."
                  - "Frog has four sounds."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Frog. Say it slowly. Which letter is missing?"
                show: { object: frog }
                frame: "f_og"
                options: ["l", "r", "w"]
                answer: ["r"]
                hints:
                  - "Slide from the first sound straight to the next one."
                  - "After the first sound comes a growly sound, like a dog."
                  - "The missing sound is the one at the start of red. Tap that letter."
              - id: l2-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "clap" }
                options: [{ object: clock }, { object: clap }, { object: clown }]
                answer: clap
                hints:
                  - "All three start the same way. Read every letter."
                  - "Slide the first two sounds together, then read the rest."
                  - "Push the sounds together: clap. Tap the child clapping."
              - id: l2-f4
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Stop." }
                options: ["top", "stop", "step"]
                answer: "stop"
                feedback:
                  "top": "Top has no hiss at the start. Stop starts with two sounds: a hiss, then the first sound of top."
                hints:
                  - "Listen to the start of the word."
                  - "There are two sounds at the start, one after the other."
                  - "Stop."
              - id: l2-f5
                type: true_false
                text: "Does dress start with two sounds?"
                say: "Dress. Does dress start with two sounds, one after the other?"
                show: { object: dress }
                answer: true
                hints:
                  - "Say dress slowly. Listen to the start."
                  - "First the sound at the start of dog, then a growly sound."
                  - "Yes. Dress starts with two sounds."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "How many sounds?"
                say: "Clock. Say it slowly. How many sounds can you hear?"
                show: { object: clock }
                options:
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 5, layout: row }
                answer: "4"
                hints: ["Two sounds at the start. At the end, two letters make one click."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Swim. Say it slowly. Which letter is missing?"
                show: { object: swim }
                frame: "s_im"
                options: ["n", "w", "l"]
                answer: ["w"]
                hints: ["After the hiss, your lips make a round shape."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "frog" }
                options: [{ object: fish }, { object: fox }, { object: frog }]
                answer: frog
                hints: ["Read past the first letter. What sound comes next?"]
              - id: l2-s4
