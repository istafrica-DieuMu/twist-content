# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.listen-respond
skill: lit-en.speaking.listen-respond
curriculum: en-GB
language: en
title:
  de: Zuhören und antworten
  en: Listening and responding
summary: >
  Listening carefully and answering what we hear with an action, a
  comment or a question. Lesson 1 listens to requests and questions and
  answers with actions and short answers; lesson 2 chooses a kind
  comment or a question that finds out more, asks again when something
  was not heard, and ends with the skill check. Everything is spoken;
  the child answers with pictures and spoken choices. Answering aloud
  and asking real questions run as speak tasks, practised and not
  marked.
metadata:
  year: reception
  topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: []
  vocabulary: { en: [listen, look, keep still, answer, comment, question, who, what, where] }
  no_reading: true
  forms: [audio, picture, drawn]
  drawn: [colour-swatch]
  facets: []
  parts:
    - { id: action, what: { de: "tun oder beantworten, worum jemand bittet", en: doing or answering what someone asks } }
    - { id: comment, what: { de: "einen freundlichen Kommentar wählen, der passt", en: choosing a kind comment that follows on } }
    - { id: question, what: { de: "eine Frage wählen, die mehr herausfindet", en: choosing a question that finds out more } }
    - { id: listening-well, what: { de: "wissen, wie gutes Zuhören aussieht, und nachfragen", en: "knowing what good listening looks like, and asking again" } }
  misconceptions:
    - id: looks-away
      what: Thinks listening only means being quiet, and looks away or fidgets while someone talks
      addressed: Learn in lesson 1 says look, keep still and listen to every word; l1-f3, l1-s3, l1-n3, l1-c3, l2-w2, l2-s3 and the skill check task l2-c4
    - id: off-topic-reply
      what: Answers with something about themselves that does not follow on (I like pizza, after a friend's news)
      addressed: Learn in lesson 2 shows a comment and a question that follow on; an off-topic reply is an option in l2-f1, l2-f2 (with feedback), l2-s1, l2-s2, l2-n1, l2-c2 and l2-c3
    - id: unkind-reply
      what: Gives a reply that does not fit how the speaker feels (laughs at bad news)
      addressed: l2-s1, l2-n5 and the comment options in l2-f1 and l2-c2
    - id: guesses-instead-of-asking
      what: Guesses or does nothing when they did not hear, instead of asking again
      addressed: Learn in lesson 2 gives "Can you say that again, please?"; l2-f5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gut zuhören", en: "Good listening" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "Good listening"
            say: "Good listening means three things. Look at the person who is talking. Keep your body still. Listen to every word, right to the end."
            show: { objects: [listen, look] }
          - text: "Answer with an action"
            say: "Sometimes we answer with an action. Mrs Patel says: Please stand up. So we stand up!"
            show: { object: stand-up }
          - text: "Answer with words"
            say: "Sometimes we answer with words. If someone asks you what your favourite fruit is, you can say: My favourite fruit is apples."
            show: { object: apple }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What should you do?"
                say: "Listen to Mrs Patel. What should you do? Tap the picture."
                audio: { en: "Please clap your hands.", speaker: female }
                options: [{ object: wave }, { object: clap }, { object: jump }]
                answer: clap
                hints:
                  - "Listen again to the last words."
                  - "What does Mrs Patel want you to do with your hands?"
                  - "Clap your hands. Tap the child clapping."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "What should you get?"
                say: "Listen. What should you get? Tap the picture."
                audio: { en: "Please get your book and sit on the carpet." }
                options: [{ object: ball }, { object: book-open }, { object: cup }]
                answer: book-open
                hints:
                  - "Listen for the thing you need to get."
                  - "Please get your ..."
                  - "Your book."
              - id: l1-f3
                type: image_multiple_choice
                text: "Mrs Patel is reading a story. Which child is listening well?"
                say: "Mrs Patel is reading a story. Which child is listening well? Tap the picture."
                options: [{ object: jump }, { object: sing }, { object: listen }]
                answer: listen
                hints:
                  - "A good listener keeps still and quiet."
                  - "Look for the child with a hand by the ear."
                  - "This child is listening well."
              - id: l1-f4
                type: audio_choice
                text: "Answer the question."
                say: "Listen to the question. Tap the answer."
                audio: { en: "What colour is the sky on a sunny day?" }
                options:
                  - { drawn: colour-swatch, colour: green }
                  - { drawn: colour-swatch, colour: blue }
                  - { drawn: colour-swatch, colour: red }
                answer: blue
                hints:
                  - "Think of a sunny day. Look up."
                  - "It is not the colour of grass."
                  - "Blue."
              - id: l1-f5
                type: speak
                text: "What is your favourite fruit? Answer in a sentence."
                say: "Listen and answer in a sentence. What is your favourite fruit? For example: My favourite fruit is apples."
                show: { object: apple }
                expected_text: "My favourite fruit is apples."
                hints:
                  - "Start with My favourite fruit is."
                  - "Then say the fruit you like best."
                  - "My favourite fruit is apples."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What should you do?"
                say: "Listen. What should you do? Tap the picture."
                audio: { en: "It's home time. Please wave goodbye." }
                options: [{ object: point }, { object: clap }, { object: wave }]
                answer: wave
                hints: ["What do you do with your hand when you say goodbye?"]
              - id: l1-s2
                type: audio_choice
                text: "What does Grandad want?"
                say: "Listen to Grandad. What does he want? Tap the picture."
                audio: { en: "I'm making soup. Can you pass me the spoon, please?", speaker: male }
                options: [{ object: knife }, { object: cup }, { object: spoon }]
                answer: spoon
                hints: ["Listen to the end: can you pass me the ..."]
              - id: l1-s3
                type: true_false
                text: "Ellie looks out of the window while her teacher is talking. Is Ellie listening well?"
                say: "Ellie looks out of the window while her teacher is talking. Is Ellie listening well?"
                show: { object: window }
                answer: false
                hints: ["Where should Ellie look when her teacher talks?"]
              - id: l1-s4
                type: audio_choice
                text: "What should you get?"
                say: "Listen to Mum. What should you get? Tap the picture."
                audio: { en: "We're going to the park. Go and get your shoes, please.", speaker: female }
                options: [{ object: shoe }, { object: sock }, { object: hat }]
                answer: shoe
                hints: ["Listen for the word after get your."]
              - id: l1-s5
                type: speak
                text: "What do you like to play? Answer in a sentence."
                say: "Listen and answer in a sentence. What do you like to play? For example: I like to play football."
                show: { object: play-football }
                expected_text: "I like to play football."
                hints: ["Start with I like to play."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What should you do?"
                say: "Listen. What should you do? Tap the picture."
                audio: { en: "Story time! Please sit down." }
                options: [{ object: stand-up }, { object: jump }, { object: sit-down }]
                answer: sit-down
              - id: l1-n2
                type: audio_choice
                text: "What should you point to?"
                say: "Listen. What should you point to? Tap the picture."
                audio: { en: "Can you point to the door, please?" }
                options: [{ object: window }, { object: door }, { object: table }]
                answer: door
              - id: l1-n3
                type: image_multiple_choice
                text: "Mr Okafor wants to tell the class something. Which child is ready to listen?"
                say: "Mr Okafor wants to tell the class something. Which child is ready to listen? Tap the picture."
                options: [{ object: dance }, { object: play-football }, { object: quiet }]
                answer: quiet
              - id: l1-n4
                type: audio_choice
                text: "Answer the question."
                say: "Listen to the question. Tap the answer."
                audio: { en: "It is cold outside. What do you wear on your head?" }
                options: [{ object: sock }, { object: woolly-hat }, { object: t-shirt }]
                answer: woolly-hat
              - id: l1-n5
                type: speak
                text: "How are you today? Answer in a sentence."
                say: "Listen and answer in a sentence. How are you today? For example: I am happy today."
                show: { object: happy }
                expected_text: "I am happy today."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "What should you do?"
            say: "Listen. What should you do?"
            audio: { en: "Please jump up high!" }
            options: [{ object: jump }, { object: sit-down }, { object: wave }]
            answer: jump
          - id: l1-c2
            type: audio_choice
            text: "What should you pass?"
            say: "Listen. What should you pass?"
            audio: { en: "Can you pass me the scissors, please?" }
            options: [{ object: pencil }, { object: scissors }, { object: ruler }]
            answer: scissors
          - id: l1-c3
            type: true_false
            text: "Sam keeps still and looks at the person who is talking. Is Sam listening well?"
            say: "Sam keeps still and looks at the person who is talking. Is Sam listening well?"
            show: { object: listen }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Answer the question."
            say: "Listen to the question. Tap the answer."
            audio: { en: "What colour is the grass?" }
            options:
              - { drawn: colour-swatch, colour: yellow }
              - { drawn: colour-swatch, colour: red }
              - { drawn: colour-swatch, colour: green }
            answer: green
          - id: l1-c5
            type: audio_choice
            text: "What should you get?"
            say: "Listen. What should you get?"
            audio: { en: "We're going outside. Please get your water bottle." }
            options: [{ object: cup }, { object: bottle }, { object: spoon }]
            answer: bottle
          - id: l1-c6
            type: true_false
            text: "Leo talks to his friend while the teacher is reading a story. Is Leo listening well?"
            say: "Leo talks to his friend while the teacher is reading a story. Is Leo listening well?"
            show: { object: teacher }
            answer: false

  - n: 2
    title: { de: "Kommentieren und fragen", en: "Comments and questions" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "What should you do?"
            say: "Listen. What should you do? Tap the picture."
            audio: { en: "Please stand up and push in your chair." }
            options: [{ object: sit-down }, { object: stand-up }, { object: clap }]
            answer: stand-up
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Who is listening?"
            say: "Which child is listening? Tap the picture."
            options: [{ object: ride-bike }, { object: listen }, { object: dance }]
            answer: listen
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A comment"
            say: "When a friend tells you something, you can make a comment about it. Ben says: I went to the park. You can say: That sounds fun!"
            show: { object: park }
          - text: "A question"
            say: "Or you can ask a question to find out more. Ben says: I went to the park. You can ask: What did you do at the park? Questions often start with who, what or where."
            show: { object: boy }
          - text: "Say it again, please"
            say: "If you did not hear or did not understand, don't guess. Ask: Can you say that again, please?"
            show: { object: listen }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Mia says: I got a new puppy! What could you say?"
                say: "Listen to Mia. What could you say?"
                audio: { en: "I got a new puppy!", speaker: female }
                options: ["I like pizza.", "Wow, that's exciting!", "Go away."]
                answer: "Wow, that's exciting!"
                hints:
                  - "Your answer should be about Mia's news."
                  - "How does Mia feel? Happy and excited."
                  - "Wow, that's exciting!"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Leo says: I went to the seaside. Which question finds out more?"
                say: "Listen to Leo. Which question could you ask to find out more?"
                audio: { en: "I went to the seaside.", speaker: male }
                options: ["I went to school.", "My shoes are red.", "What did you do there?"]
                answer: "What did you do there?"
                feedback:
                  "I went to school.": "That is about you, and it is not a question. Ask Leo something about the seaside."
                hints:
                  - "A question asks something."
                  - "It should be about the seaside."
                  - "What did you do there?"
              - id: l2-f3
                type: audio_choice
                text: "What should you do?"
                say: "Listen to the teacher. What should you do? Tap the picture."
                audio: { en: "Put on your aprons, everyone. We are going to paint!" }
                options: [{ object: sing }, { object: paint }, { object: swim }]
                answer: paint
                hints:
                  - "Listen to the end."
                  - "We are going to ..."
                  - "Paint."
              - id: l2-f4
                type: speak
                text: "Your friend says: I made a cake. Ask a question to find out more."
                say: "Your friend says: I made a cake. Ask a question to find out more. For example: What kind of cake did you make?"
                show: { object: cake }
                expected_text: "What kind of cake did you make?"
                hints:
                  - "Start with What."
                  - "Ask about the cake."
                  - "What kind of cake did you make?"
              - id: l2-f5
                type: true_false
                text: "You did not hear your teacher, so you ask: Can you say that again, please? Is that a good thing to do?"
                say: "You did not hear what your teacher said. You ask: Can you say that again, please? Is that a good thing to do?"
                show: { object: teacher }
                answer: true
                hints:
                  - "Is it better to guess, or to ask?"
                  - "Asking again helps you get it right."
                  - "Yes. It is good to ask."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Zara says: I fell over and hurt my knee. What could you say?"
                say: "Listen to Zara. What could you say?"
                audio: { en: "I fell over and hurt my knee.", speaker: female }
                options: ["Oh no! Are you all right?", "Ha ha!", "I have a cat."]
                answer: "Oh no! Are you all right?"
                hints: ["How does Zara feel? Say something kind."]
              - id: l2-s2
                type: multiple_choice
                text: "Dad says: I've got a surprise for you. Which question could you ask?"
                say: "Listen to Dad. Which question could you ask?"
                audio: { en: "I've got a surprise for you.", speaker: male }
                options: ["I am four.", "What is it?", "Bye!"]
                answer: "What is it?"
                hints: ["You want to find out what the surprise is."]
              - id: l2-s3
                type: true_false
                text: "Your friend tells you about her holiday. You start talking about your new toy. Is that good listening?"
                say: "Your friend is telling you about her holiday. You start talking about your new toy. Is that good listening?"
                show: { object: girl }
                answer: false
                hints: ["Who should you be thinking about while she talks?"]
              - id: l2-s4
                type: speak
                text: "Your friend says: I can ride a bike now! Make a comment."
                say: "Your friend says: I can ride a bike now! Make a comment. For example: Well done! That's brilliant!"
                show: { object: ride-bike }
                expected_text: "Well done! That's brilliant!"
                hints: ["Say something kind about the news."]
              - id: l2-s5
                type: audio_choice
                text: "Which animal?"
                say: "Listen. Which animal should you find? Tap the picture."
                audio: { en: "Can you find the animal that says moo?" }
                options: [{ object: duck }, { object: pig }, { object: cow }]
                answer: cow
                hints: ["Which animal says moo?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Grandma says: I baked some biscuits. What could you say?"
                say: "Listen to Grandma. What could you say?"
                audio: { en: "I baked some biscuits.", speaker: female }
                options: ["My bike is blue.", "Yum! They smell lovely!", "No."]
                answer: "Yum! They smell lovely!"
              - id: l2-n2
                type: multiple_choice
                text: "You want to know where your friend went at the weekend. Which question do you ask?"
                say: "You want to know where your friend went at the weekend. Which question do you ask?"
                options: ["Who are you?", "What is that?", "Where did you go?"]
                answer: "Where did you go?"
              - id: l2-n3
                type: audio_choice
                text: "What should you get?"
                say: "Listen. What should you get? Tap the picture."
                audio: { en: "It's raining and it's home time. Please get your jacket." }
                options: [{ object: dress }, { object: jacket }, { object: sock }]
                answer: jacket
              - id: l2-n4
                type: speak
                text: "Your teacher says: We are going on a trip tomorrow! Ask a question."
                say: "Your teacher says: We are going on a trip tomorrow! Ask a question. For example: Where are we going?"
                show: { object: bus }
                expected_text: "Where are we going?"
              - id: l2-n5
                type: true_false
                text: "Your friend says: I'm sad, my balloon popped. You say: Ha ha! Is that a kind comment?"
                say: "Your friend says: I'm sad, my balloon popped. You say: Ha ha! Is that a kind comment?"
                show: { object: balloon }
                answer: false

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: action
            type: audio_choice
            text: "What should you do?"
            say: "Listen. What should you do?"
            audio: { en: "Let's sing a song together." }
            options: [{ object: swim }, { object: read }, { object: sing }]
            answer: sing
          - id: l2-c2
            part: comment
            type: multiple_choice
            text: "Ben says: It's my birthday today! What could you say?"
            say: "Listen to Ben. What could you say?"
            audio: { en: "It's my birthday today!", speaker: male }
            options: ["I don't like cake.", "Where is the bus?", "Happy birthday, Ben!"]
            answer: "Happy birthday, Ben!"
          - id: l2-c3
            part: question
            type: multiple_choice
            text: "Your friend says: I saw something amazing in the garden! Which question could you ask?"
            say: "Listen to your friend. Which question could you ask?"
            audio: { en: "I saw something amazing in the garden!", speaker: female }
            options: ["What did you see?", "I am hungry.", "My dog is big."]
            answer: "What did you see?"
          - id: l2-c4
            part: listening-well
            type: true_false
            text: "While Mum is talking, Kai jumps up and down and sings. Is Kai listening well?"
            say: "While Mum is talking, Kai jumps up and down and sings. Is Kai listening well?"
            show: { object: mum }
            answer: false
          - id: l2-c5
            part: action
            type: audio_choice
            text: "What should you bring?"
            say: "Listen. What should you bring?"
            audio: { en: "Can you bring me the ball, please?" }
            options: [{ object: balloon }, { object: ball }, { object: book-open }]
            answer: ball
          - id: l2-c6
            part: action
            type: audio_choice
            text: "What should you do?"
            say: "Listen. What should you do?"
            audio: { en: "Everyone, please be quiet now." }
            options: [{ object: sing }, { object: quiet }, { object: dance }]
            answer: quiet
          - id: l2-c7
            part: comment
            type: multiple_choice
            text: "Omar says: My tooth fell out! What could you say?"
            say: "Listen to Omar. What could you say?"
            audio: { en: "My tooth fell out!", speaker: male }
            options: ["My coat is green.", "Wow! Let me see the gap!", "Go away."]
            answer: "Wow! Let me see the gap!"
          - id: l2-c8
            part: question
            type: multiple_choice
            text: "Isla says: I've got a new pet! Which question could you ask?"
            say: "Listen to Isla. Which question could you ask?"
            audio: { en: "I've got a new pet!", speaker: female }
            options: ["I am five.", "My hat is red.", "What kind of pet is it?"]
            answer: "What kind of pet is it?"
          - id: l2-c9
            part: listening-well
            type: true_false
            text: "Grandad is telling a story. Priya looks at him and keeps still. Is Priya listening well?"
            say: "Grandad is telling a story. Priya looks at him and keeps still. Is Priya listening well?"
            show: { object: grandpa }
            answer: true
          - id: l2-c10
            part: action
            type: audio_choice
            text: "What does Mum want?"
            say: "Listen to Mum. What does she want?"
            audio: { en: "It's bedtime. Can you pass me your toothbrush, please?", speaker: female }
            options: [{ object: spoon }, { object: pencil }, { object: toothbrush }]
            answer: toothbrush
          - id: l2-c11
            part: comment
            type: multiple_choice
            text: "Ruby says: I lost my favourite teddy. What could you say?"
            say: "Listen to Ruby. What could you say?"
            audio: { en: "I lost my favourite teddy.", speaker: female }
            options: ["Yay!", "Oh no! I'll help you look.", "I had chips for tea."]
            answer: "Oh no! I'll help you look."
          - id: l2-c12
            part: question
            type: multiple_choice
            text: "You want to know who is coming to the party. Which question do you ask?"
            say: "You want to know who is coming to the party. Which question do you ask?"
            options: ["Where is it?", "Who is coming?", "What is that?"]
            answer: "Who is coming?"
          - id: l2-c13
            part: listening-well
            type: multiple_choice
            text: "You did not hear what the teacher said. What should you do?"
            say: "You did not hear what the teacher said. What should you do?"
            options: ["Guess.", "Do nothing.", "Ask: Can you say that again, please?"]
            answer: "Ask: Can you say that again, please?"
          - id: l2-c14
            part: listening-well
            type: multiple_choice
            text: "Mrs Patel is reading a story. What does good listening look like?"
            say: "Mrs Patel is reading a story. What does good listening look like?"
            options: ["talking to a friend", "looking at her and keeping still", "playing with a toy"]
            answer: "looking at her and keeping still"
          - id: l2-c15
            part: comment
            type: true_false
            text: "Your friend says: I drew a rainbow! You say: That's lovely, I like the colours. Is that a good comment?"
            say: "Your friend says: I drew a rainbow! You say: That's lovely, I like the colours. Is that a good comment?"
            show: { object: crayon }
            answer: true
          - id: l2-c16
            part: question
            type: true_false
            text: "Your teacher says: We have a new class pet. You ask: What is its name? Is that a good question?"
            say: "Your teacher says: We have a new class pet. You ask: What is its name? Is that a good question?"
            show: { object: teacher }
            answer: true
          - id: l2-c17
            part: listening-well
            type: image_multiple_choice
            text: "Dad is talking to you. Where should you look?"
            say: "Dad is talking to you. Where should you look? Tap the picture."
            options: [{ object: window }, { object: dad }, { object: mobile-phone }]
            answer: dad
          - id: l2-c18
            part: action
            type: audio_choice
            text: "Who should you feed?"
            say: "Listen. Who should you feed?"
            audio: { en: "Can you give the dog his dinner, please?" }
            options: [{ object: cat }, { object: fish }, { object: dog }]
            answer: dog
          - id: l2-c19
            part: comment
            type: true_false
            text: "Your friend says: I'm going to see my nan. You say: I like ice cream. Is that about what your friend said?"
            say: "Your friend says: I'm going to see my nan. You say: I like ice cream. Is that about what your friend said?"
            show: { object: grandma }
            answer: false
          - id: l2-c20
            part: question
            type: multiple_choice
            text: "Jack says: I went to the zoo yesterday. Which question finds out more?"
            say: "Listen to Jack. Which question finds out more?"
            audio: { en: "I went to the zoo yesterday.", speaker: male }
            options: ["I went to the shop.", "Which animals did you see?", "Bye, Jack!"]
            answer: "Which animals did you see?"
