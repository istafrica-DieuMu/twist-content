# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.lowercase-letters
skill: lit-en.handwriting.lowercase
curriculum: en-GB
language: en
title:
  de: Kleinbuchstaben richtig schreiben
  en: Forming lower-case letters
summary: >
  Forming lower-case letters in the right direction, in the letter
  families English schools use. Lesson 1 takes the long ladder letters
  (l, i, t, u) and the curly caterpillar letters (c, a, d, o), which all
  start at the top; lesson 2 takes the one-armed robot letters (n, m, r,
  h, b, p) and the zigzag letters (v, w, z), sets b against d, and ends
  with the skill check. Tracing and copying carry the writing; short
  choice tasks ask where a letter starts and which way it goes. The
  tracing accepts any ink for now, so stroke order is taught but not yet
  marked. The skill check marks what a screen can mark: where a letter
  starts, which way it goes, its family and telling b from d; forming the
  letters is practised in Practise (tracing and copying).
metadata:
  year: reception
  topic: { de: "Handschrift", en: "Handwriting" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.handwriting.pencil-grip]
  also_practises: [lit-en.handwriting.pencil-grip]
  vocabulary: { en: [letter, lower case, start at the top, long ladder, curly caterpillar, one-armed robot, zigzag] }
  forms: [drawn, audio, text]
  drawn: [writing-lines, letter-card]
  sounds: [en.a, en.d, en.k, en.o, en.b, en.p]
  facets: [script]
  parts:
    - { id: start, what: { de: "wissen, wo ein Buchstabe beginnt", en: knowing where a letter starts } }
    - { id: direction, what: { de: "wissen, in welche Richtung ein Buchstabe geht", en: knowing which way a letter goes } }
    - { id: families, what: { de: die Buchstabenfamilien kennen, en: knowing the letter families } }
    - { id: b-d, what: { de: b und d unterscheiden, en: telling b from d } }
  misconceptions:
    - id: start-at-bottom
      what: Starts letters at the bottom line and pushes the pencil upwards
      addressed: Learn in both lessons starts every family at the top; l1-f2 (with feedback), l1-s4, l1-c1, l2-s2 and the skill check task l2-c1
    - id: b-d-reversal
      what: Mixes up b and d (and p and q), because they are mirror shapes
      addressed: Learn in lesson 2 sets b (tall line first) against d (round first); l1-n4, l2-f2 (with feedback), l2-f4, l2-s4, l2-n4, l2-c2 and l2-c3
    - id: c-wrong-way
      what: Goes round c, a and o in the wrong direction, so a and d cannot join on later
      addressed: Learn in lesson 1 says curly caterpillar letters go back and round; l1-f4 (with feedback), l1-n2 and l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Leiter und Raupe", en: "Long ladders and curly caterpillars" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many fingers hold the pencil?"
            say: "Get your pencil ready. How many fingers hold it in a tripod grip?"
            options: ["1", "3", "5"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Before you write, your feet go flat on the floor."
            say: "Before you write, your feet go flat on the floor. Is that right?"
            show: { object: sit-down }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "l i t u"
            say: "These are long ladder letters. Start each one at the top and climb straight down the ladder."
            show: { drawn: letter-card, text: "l i t u" }
          - text: "l"
            say: "Watch this letter. Start at the green dot at the top. Go straight down and stop on the line."
            show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }
          - text: "c a d o"
            say: "These are curly caterpillar letters. They all start the same way: at the top, then back and round, like a caterpillar curling up."
            show: { drawn: letter-card, text: "c a d o" }
          - text: "a"
            say: "Watch this letter. Start at the top, go back and round, then up to the top and straight down."
            show: { drawn: writing-lines, text: "a", mode: trace, arrows: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tracing
                text: "Trace the l."
                say: "Trace this letter. Start at the green dot and go straight down the ladder."
                show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }
                char: "l"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Where does t start?"
                say: "Look at this letter. Where do you start it?"
                show: { drawn: letter-card, text: "t" }
                options: ["at the top", "at the bottom"]
                answer: "at the top"
                keep_order: true
                feedback:
                  "at the bottom": "We start nearly every letter at the top and go down. This one starts at the top too."
                hints:
                  - "This is a long ladder letter."
                  - "Ladder letters start high and climb down."
                  - "At the top."
              - id: l1-f3
                type: tracing
                text: "Trace the c."
                say: "Trace this letter. Start at the top, go back and round, and stop at the bottom."
                show: { drawn: writing-lines, text: "c", mode: trace, arrows: true }
                char: "c"
              - id: l1-f4
                type: multiple_choice
                text: "Which way does c go?"
                say: "You start this letter at the top. Which way do you go?"
                show: { drawn: letter-card, text: "c" }
                options: ["back and round to the left", "round to the right"]
                answer: "back and round to the left"
                keep_order: true
                feedback:
                  "round to the right": "That way the letter faces the wrong way. Go back and round to the left, like a curly caterpillar."
                hints:
                  - "This letter opens on the right side."
                  - "Your pencil goes back towards the start of the line first."
                  - "Back and round to the left."
              - id: l1-f5
                type: tracing
                text: "Trace the a."
                say: "Trace this letter. Back and round, up to the top, then straight down."
                show: { drawn: writing-lines, text: "a", mode: trace, arrows: true }
                char: "a"

          - support: some
            tasks:
              - id: l1-s1
                type: tracing
                text: "Trace the i."
                say: "Trace this letter. Down the ladder, then put the dot on top."
                show: { drawn: writing-lines, text: "i", mode: trace, arrows: true }
                char: "i"
              - id: l1-s2
                type: highlight_in_text
                text: "Tap every a."
                say: "Look at the letters. Listen to the sound, then tap every letter that makes it."
                audio: { sound: en.a }
                show: { drawn: letter-card, text: "a d a o a" }
                spans: ["a"]
                hints: ["This letter is round like a curly caterpillar, with a short line down, not a tall one."]
              - id: l1-s3
                type: tracing
                text: "Trace the d."
                say: "Trace this letter. Back and round, then up high to the top, and straight down."
                show: { drawn: writing-lines, text: "d", mode: trace, arrows: true }
                char: "d"
              - id: l1-s4
                type: true_false
                text: "o starts at the bottom."
                say: "Look at this letter. Does it start at the bottom?"
                show: { drawn: letter-card, text: "o" }
                answer: false
                hints: ["This is a curly caterpillar letter. Where do they start?"]
              - id: l1-s5
                type: tracing
                text: "Copy the t."
                say: "Now write this letter on your own. Down the ladder, then a short line across."
                show: { drawn: writing-lines, text: "t", mode: copy, arrows: false }
                char: "t"

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Trace the u."
                say: "Trace this letter. Down, round at the bottom, up, then down again."
                show: { drawn: writing-lines, text: "u", mode: trace, arrows: true }
                char: "u"
              - id: l1-n2
                type: multiple_choice
                text: "Which family is d in?"
                say: "Look at this letter. It starts at the top, then goes back and round. Which family is it in?"
                show: { drawn: letter-card, text: "d" }
                options: ["the long ladders", "the curly caterpillars"]
                answer: "the curly caterpillars"
              - id: l1-n3
                type: tracing
                text: "Copy the o."
                say: "Now write this letter on your own. Start at the top, back and round, and join up."
                show: { drawn: writing-lines, text: "o", mode: copy, arrows: false }
                char: "o"
              - id: l1-n4
                type: highlight_in_text
                text: "Tap every d."
                say: "Look at the letters. Listen to the sound, then tap every letter that makes it."
                audio: { sound: en.d }
                show: { drawn: letter-card, text: "d b d p d" }
                spans: ["d"]
              - id: l1-n5
                type: tracing
                text: "Copy the a."
                say: "Now write this letter on your own."
                show: { drawn: writing-lines, text: "a", mode: copy, arrows: false }
                char: "a"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Where does i start?"
            say: "Look at this letter. Where do you start it?"
            show: { drawn: letter-card, text: "i" }
            options: ["at the top", "at the bottom"]
            answer: "at the top"
            keep_order: true
          - id: l1-c2
            type: highlight_in_text
            text: "Tap every c."
            say: "Listen to the sound, then tap every letter that makes it."
            audio: { sound: en.k }
            show: { drawn: letter-card, text: "c e c o c" }
            spans: ["c"]
          - id: l1-c3
            type: tracing
            text: "Copy the d."
            say: "Write this letter on your own. Round first, then the tall line."
            show: { drawn: writing-lines, text: "d", mode: copy, arrows: false }
            char: "d"
          - id: l1-c4
            type: multiple_choice
            text: "Which family is t in?"
            say: "Look at this letter. Which family is it in?"
            show: { drawn: letter-card, text: "t" }
            options: ["the long ladders", "the curly caterpillars"]
            answer: "the long ladders"
          - id: l1-c5
            type: true_false
            text: "You start l at the top."
            say: "Look at this letter. Do you start it at the top?"
            show: { drawn: letter-card, text: "l" }
            answer: true
          - id: l1-c6
            type: highlight_in_text
            text: "Tap every a."
            say: "Listen to the sound, then tap every letter that makes it."
            audio: { sound: en.a }
            show: { drawn: letter-card, text: "o a c a d" }
            spans: ["a"]

  - n: 2
    title: { de: "Roboter und Zickzack", en: "One-armed robots and zigzags" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap every o."
            say: "Look at the letters. Listen to the sound, then tap every letter that makes it."
            audio: { sound: en.o }
            show: { drawn: letter-card, text: "o a o c o" }
            spans: ["o"]
            difficulty: easy
          - id: l2-w2
            type: tracing
            text: "Copy the c."
            say: "Write this letter on your own. Start at the top, back and round."
            show: { drawn: writing-lines, text: "c", mode: copy, arrows: false }
            char: "c"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "n m r h b p"
            say: "These are one-armed robot letters. Start at the top, go down, then back up the same line and over, like a robot's arm."
            show: { drawn: letter-card, text: "n m r h b p" }
          - text: "n"
            say: "Watch this letter. Down, back up the same line, over the hill and down."
            show: { drawn: writing-lines, text: "n", mode: trace, arrows: true }
          - text: "b d"
            say: "These two letters look alike! The first one is a robot: the tall line down comes first, then the round part. The second one is a caterpillar: back and round first, then the tall line."
            show: { drawn: letter-card, text: "b d" }
          - text: "v w z"
            say: "These are zigzag letters. Start at the top and go zig, zag."
            show: { drawn: letter-card, text: "v w z" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tracing
                text: "Trace the n."
                say: "Trace this letter. Down, back up, over the hill and down."
                show: { drawn: writing-lines, text: "n", mode: trace, arrows: true }
                char: "n"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What comes first in b?"
                say: "Look at this letter. What do you write first?"
                show: { drawn: letter-card, text: "b" }
                options: ["the tall line down", "the round part"]
                answer: "the tall line down"
                keep_order: true
                feedback:
                  "the round part": "That is how its curly caterpillar lookalike starts! This letter is a robot: the tall line comes first."
                hints:
                  - "This is a one-armed robot letter."
                  - "Robot letters start with a line down."
                  - "The tall line down."
              - id: l2-f3
                type: tracing
                text: "Trace the b."
                say: "Trace this letter. Start at the top, down the tall line, back up and round."
                show: { drawn: writing-lines, text: "b", mode: trace, arrows: true }
                char: "b"
              - id: l2-f4
                type: highlight_in_text
                text: "Tap every b."
                say: "Look carefully. Listen to the sound, then tap every letter that makes it."
                audio: { sound: en.b }
                show: { drawn: letter-card, text: "d b p b d" }
                spans: ["b"]
                hints:
                  - "The letter for this sound is a robot: tall line first, round part on the right."
                  - "Its lookalike has the round part on the left."
                  - "There are two of them. Tap the tall letters with the round part on the right."
              - id: l2-f5
                type: tracing
                text: "Trace the v."
                say: "Trace this letter. Start at the top, zig down, zag up."
                show: { drawn: writing-lines, text: "v", mode: trace, arrows: true }
                char: "v"

          - support: some
            tasks:
              - id: l2-s1
                type: tracing
                text: "Trace the m."
                say: "Trace this letter. Down, back up and over one hill, then back up and over another."
                show: { drawn: writing-lines, text: "m", mode: trace, arrows: true }
                char: "m"
              - id: l2-s2
                type: multiple_choice
                text: "Where does r start?"
                say: "Look at this letter. Where do you start it?"
                show: { drawn: letter-card, text: "r" }
                options: ["at the top", "at the bottom"]
                answer: "at the top"
                keep_order: true
                hints: ["Robot letters start with a line down."]
              - id: l2-s3
                type: tracing
                text: "Copy the h."
                say: "Write this letter on your own. Tall line down, back up, over and down."
                show: { drawn: writing-lines, text: "h", mode: copy, arrows: false }
                char: "h"
              - id: l2-s4
                type: true_false
                text: "d starts with the tall line."
                say: "Look at this letter. Does it start with the tall line down?"
                show: { drawn: letter-card, text: "d" }
                answer: false
                hints: ["Is this letter a robot or a curly caterpillar?"]
              - id: l2-s5
                type: tracing
                text: "Trace the z."
                say: "Trace this letter. Across the top, zig down to the left, then across the bottom."
                show: { drawn: writing-lines, text: "z", mode: trace, arrows: true }
                char: "z"

          - support: none
            tasks:
              - id: l2-n1
                type: tracing
                text: "Trace the p."
                say: "Trace this letter. Down below the line, back up, and round."
                show: { drawn: writing-lines, text: "p", mode: trace, arrows: true }
                char: "p"
              - id: l2-n2
                type: multiple_choice
                text: "Which family is n in?"
                say: "Look at this letter. Which family is it in?"
                show: { drawn: letter-card, text: "n" }
                options: ["the zigzags", "the one-armed robots", "the curly caterpillars"]
                answer: "the one-armed robots"
              - id: l2-n3
                type: tracing
                text: "Copy the w."
                say: "Write this letter on your own. Zig, zag, zig, zag."
                show: { drawn: writing-lines, text: "w", mode: copy, arrows: false }
                char: "w"
              - id: l2-n4
                type: highlight_in_text
                text: "Tap every p."
                say: "Look carefully. Listen to the sound, then tap every letter that makes it."
                audio: { sound: en.p }
                show: { drawn: letter-card, text: "p q p b p" }
                spans: ["p"]
              - id: l2-n5
                type: tracing
                text: "Copy the b."
                say: "Write this letter on your own. Tall line first."
                show: { drawn: writing-lines, text: "b", mode: copy, arrows: false }
                char: "b"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: start
            type: multiple_choice
            text: "Where does m start?"
            say: "Look at this letter. Where do you start it?"
            show: { drawn: letter-card, text: "m" }
            options: ["at the top", "at the bottom"]
            answer: "at the top"
            keep_order: true
          - id: l2-c2
            part: b-d
            type: highlight_in_text
            text: "Tap every d."
            say: "Listen to the sound, then tap every letter that makes it."
            audio: { sound: en.d }
            show: { drawn: letter-card, text: "b d b d p" }
            spans: ["d"]
          - id: l2-c3
            part: b-d
            type: multiple_choice
            text: "What comes first in d?"
            say: "Look at this letter. What do you write first?"
            show: { drawn: letter-card, text: "d" }
            options: ["the tall line down", "the round part"]
            answer: "the round part"
            keep_order: true
          - id: l2-c4
            part: direction
            type: true_false
            text: "c goes round to the right."
            say: "You start this letter at the top. Does it go round to the right?"
            show: { drawn: letter-card, text: "c" }
            answer: false
          - id: l2-c5
            part: families
            type: multiple_choice
            text: "Which family is a in?"
            say: "Look at this letter. Which family is it in?"
            show: { drawn: letter-card, text: "a" }
            options: ["the one-armed robots", "the curly caterpillars", "the long ladders"]
            answer: "the curly caterpillars"
          - id: l2-c6
            part: start
            type: multiple_choice
            text: "Where do you start h?"
            say: "Look at this letter. Where do you start it?"
            show: { drawn: letter-card, text: "h" }
            options: ["at the top of the tall line", "at the bottom of the tall line", "in the middle"]
            answer: "at the top of the tall line"
          - id: l2-c7
            part: direction
            type: true_false
            text: "o goes back and round, like c."
            say: "Look at this letter. Does it go back and round, like c?"
            show: { drawn: letter-card, text: "o" }
            answer: true
          - id: l2-c8
            part: families
            type: multiple_choice
            text: "Which family is v in?"
            say: "Look at this letter. Which family is it in?"
            show: { drawn: letter-card, text: "v" }
            options: ["the long ladders", "the zigzags", "the one-armed robots"]
            answer: "the zigzags"
          - id: l2-c9
            part: b-d
            type: highlight_in_text
            text: "Tap every b."
            say: "Listen to the sound, then tap every letter that makes it."
            audio: { sound: en.b }
            show: { drawn: letter-card, text: "p b d b q" }
            spans: ["b"]
          - id: l2-c10
            part: start
            type: true_false
            text: "You start v at the top."
            say: "Look at this letter. Do you start it at the top?"
            show: { drawn: letter-card, text: "v" }
            answer: true
          - id: l2-c11
            part: direction
            type: multiple_choice
            text: "How does n go?"
            say: "Look at this letter. How does your pencil go?"
            show: { drawn: letter-card, text: "n" }
            options: ["down, back up and over", "over, then down", "up, then down"]
            answer: "down, back up and over"
          - id: l2-c12
            part: families
            type: highlight_in_text
            text: "Tap every curly caterpillar letter."
            say: "Tap every curly caterpillar letter."
            show: { drawn: letter-card, text: "c l o t a" }
            spans: ["c", "o", "a"]
          - id: l2-c13
            part: b-d
            type: multiple_choice
            text: "Which letter starts with the tall line down?"
            say: "Look at the two letters. Which one starts with the tall line down?"
            options: ["d", "b"]
            answer: "b"
            option_audio: false
          - id: l2-c14
            part: start
            type: multiple_choice
            text: "Where does p start?"
            say: "Look at this letter. Where do you start it?"
            show: { drawn: letter-card, text: "p" }
            options: ["at the top, then down below the line", "at the bottom, then up"]
            answer: "at the top, then down below the line"
            keep_order: true
          - id: l2-c15
            part: direction
            type: multiple_choice
            text: "How does v go?"
            say: "Look at this letter. How does your pencil go?"
            show: { drawn: letter-card, text: "v" }
            options: ["round and round", "zig down, then zag up", "down, then across"]
            answer: "zig down, then zag up"
          - id: l2-c16
            part: families
            type: true_false
            text: "r is a one-armed robot letter."
            say: "Look at this letter. Is it a one-armed robot letter?"
            show: { drawn: letter-card, text: "r" }
            answer: true
          - id: l2-c17
            part: b-d
            type: true_false
            text: "Does this letter make this sound?"
            say: "Look at this letter. Does it make this sound? Listen."
            audio: { sound: en.b }
            show: { drawn: letter-card, text: "d" }
            answer: false
          - id: l2-c18
            part: start
            type: true_false
            text: "You start a at the bottom and go up."
            say: "Look at this letter. Do you start it at the bottom and go up?"
            show: { drawn: letter-card, text: "a" }
            answer: false
          - id: l2-c19
            part: direction
            type: true_false
            text: "For u, you go down, round at the bottom, up, then down again."
            say: "Look at this letter. Do you go down, round at the bottom, up, then down again?"
            show: { drawn: letter-card, text: "u" }
            answer: true
          - id: l2-c20
            part: families
            type: multiple_choice
            text: "Which family is l in?"
            say: "Look at this letter. Which family is it in?"
            show: { drawn: letter-card, text: "l" }
            options: ["the curly caterpillars", "the long ladders", "the zigzags"]
            answer: "the long ladders"
