# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.lowercase-letters
skill: lit-en.handwriting.lowercase
curriculum: en-GB
language: en
title:
  de: Kleinbuchstaben richtig schreiben
  en: Forming lower-case letters
summary: >
  Forming lower-case letters in the right direction, in the letter
  families English schools use. Lesson 1 takes the long ladder letters
  (l, i, t, u) and the curly caterpillar letters (c, a, d, o), which all
  start at the top; lesson 2 takes the one-armed robot letters (n, m, r,
  h, b, p) and the zigzag letters (v, w, z), sets b against d, and ends
  with the skill check. Tracing and copying carry the writing; short
  choice tasks ask where a letter starts and which way it goes. The
  tracing accepts any ink for now, so stroke order is taught but not yet
  marked.
metadata:
  year: reception
  topic: { de: "Handschrift", en: "Handwriting" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.handwriting.pencil-grip]
  also_practises: [lit-en.handwriting.pencil-grip]
  vocabulary: { en: [letter, lower case, start at the top, long ladder, curly caterpillar, one-armed robot, zigzag] }
  forms: [drawn, audio, text]
  drawn: [writing-lines, letter-card]
  facets: [script]
  misconceptions:
    - id: start-at-bottom
      what: Starts letters at the bottom line and pushes the pencil upwards
      addressed: Learn in both lessons starts every family at the top; l1-f2 (with feedback), l1-s4, l1-c1, l2-s2 and the skill check task l2-c1
    - id: b-d-reversal
      what: Mixes up b and d (and p and q), because they are mirror shapes
      addressed: Learn in lesson 2 sets b (tall line first) against d (round first); l1-n4, l2-f2 (with feedback), l2-f4, l2-s4, l2-n4, l2-c2 and l2-c3
    - id: c-wrong-way
      what: Goes round c, a and o in the wrong direction, so a and d cannot join on later
      addressed: Learn in lesson 1 says curly caterpillar letters go back and round; l1-f4 (with feedback), l1-n2 and l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Leiter und Raupe", en: "Long ladders and curly caterpillars" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "How many fingers hold the pencil?"
            say: "Get your pencil ready. How many fingers hold it in a tripod grip?"
            options: ["1", "3", "5"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Before you write, your feet go flat on the floor."
            say: "Before you write, your feet go flat on the floor. Is that right?"
            show: { object: sit-down }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "l i t u"
            say: "These are long ladder letters. Start at the top and climb straight down the ladder: l, i, t, u."
            show: { drawn: letter-card, text: "l i t u" }
          - text: "l"
            say: "Watch the l. Start at the green dot at the top. Go straight down and stop on the line."
            show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }
          - text: "c a d o"
            say: "These are curly caterpillar letters. They start like a c: at the top, then back and round. c, a, d, o."
            show: { drawn: letter-card, text: "c a d o" }
          - text: "a"
            say: "Watch the a. Start at the top, back and round like a c, then up to the top and straight down."
            show: { drawn: writing-lines, text: "a", mode: trace, arrows: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tracing
                text: "Trace the l."
                say: "Trace the l. Start at the green dot and go straight down the ladder."
                show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }
                char: "l"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Where does t start?"
                say: "Look at the t. Where do you start it?"
                show: { drawn: letter-card, text: "t" }
                options: ["at the top", "at the bottom"]
                answer: "at the top"
                keep_order: true
                feedback:
                  "at the bottom": "We start nearly every letter at the top and go down. t starts at the top."
                hints:
                  - "t is a long ladder letter."
                  - "Ladder letters start high and climb down."
                  - "At the top."
              - id: l1-f3
                type: tracing
                text: "Trace the c."
                say: "Trace the c. Start at the top, go back and round, and stop at the bottom."
                show: { drawn: writing-lines, text: "c", mode: trace, arrows: true }
                char: "c"
              - id: l1-f4
                type: multiple_choice
                text: "Which way does c go?"
                say: "You start c at the top. Which way do you go?"
                show: { drawn: letter-card, text: "c" }
                options: ["back and round to the left", "round to the right"]
                answer: "back and round to the left"
                keep_order: true
                feedback:
                  "round to the right": "That way the c faces the wrong way. Go back and round to the left, like a curly caterpillar."
                hints:
                  - "c opens on the right side."
                  - "Your pencil goes back towards the start of the line first."
                  - "Back and round to the left."
              - id: l1-f5
                type: tracing
                text: "Trace the a."
                say: "Trace the a. Round like a c, back up to the top, then straight down."
                show: { drawn: writing-lines, text: "a", mode: trace, arrows: true }
                char: "a"

          - support: some
            tasks:
              - id: l1-s1
                type: tracing
                text: "Trace the i."
                say: "Trace the i. Down the ladder, then put the dot on top."
                show: { drawn: writing-lines, text: "i", mode: trace, arrows: true }
                char: "i"
              - id: l1-s2
                type: highlight_in_text
                text: "Tap every a."
                say: "Look at the letters. Tap every a."
                show: { drawn: letter-card, text: "a d a o a" }
                spans: ["a"]
                hints: ["a is round like a c, with a short line down."]
              - id: l1-s3
                type: tracing
                text: "Trace the d."
                say: "Trace the d. Round like a c, then up high to the top, and straight down."
                show: { drawn: writing-lines, text: "d", mode: trace, arrows: true }
                char: "d"
              - id: l1-s4
                type: true_false
                text: "o starts at the bottom."
                say: "Does o start at the bottom?"
                show: { drawn: letter-card, text: "o" }
                answer: false
                hints: ["o is a curly caterpillar letter. Where do they start?"]
              - id: l1-s5
                type: tracing
                text: "Copy the t."
                say: "Now write a t on your own. Down the ladder, then a short line across."
                show: { drawn: writing-lines, text: "t", mode: copy, arrows: false }
                char: "t"

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Trace the u."
                say: "Trace the u. Down, round at the bottom, up, then down again."
                show: { drawn: writing-lines, text: "u", mode: trace, arrows: true }
                char: "u"
              - id: l1-n2
                type: multiple_choice
                text: "Which family is d in?"
                say: "d starts round like a c. Which family is it in?"
                options: ["the long ladders", "the curly caterpillars"]
                answer: "the curly caterpillars"
              - id: l1-n3
                type: tracing
                text: "Copy the o."
                say: "Now write an o on your own. Start at the top, back and round, and join up."
                show: { drawn: writing-lines, text: "o", mode: copy, arrows: false }
                char: "o"
              - id: l1-n4
                type: highlight_in_text
                text: "Tap every d."
                say: "Look at the letters. Tap every d."
                show: { drawn: letter-card, text: "d b d p d" }
                spans: ["d"]
              - id: l1-n5
                type: tracing
                text: "Copy the a."
                say: "Now write an a on your own."
                show: { drawn: writing-lines, text: "a", mode: copy, arrows: false }
                char: "a"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Where does i start?"
            say: "Where do you start the i?"
            show: { drawn: letter-card, text: "i" }
            options: ["at the top", "at the bottom"]
            answer: "at the top"
            keep_order: true
          - id: l1-c2
            type: highlight_in_text
            text: "Tap every c."
            say: "Tap every c."
            show: { drawn: letter-card, text: "c e c o c" }
            spans: ["c"]
          - id: l1-c3
            type: tracing
            text: "Copy the d."
            say: "Write a d on your own. Round first, then the tall line."
            show: { drawn: writing-lines, text: "d", mode: copy, arrows: false }
            char: "d"

  - n: 2
    title: { de: "Roboter und Zickzack", en: "One-armed robots and zigzags" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tap every o."
            say: "Look at the letters. Tap every o."
            show: { drawn: letter-card, text: "o a o c o" }
            spans: ["o"]
            difficulty: easy
          - id: l2-w2
            type: tracing
            text: "Copy the c."
            say: "Write a c on your own. Start at the top, back and round."
            show: { drawn: writing-lines, text: "c", mode: copy, arrows: false }
            char: "c"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "n m r h b p"
            say: "These are one-armed robot letters. Start at the top, go down, then back up the same line and over, like a robot's arm: n, m, r, h, b, p."
            show: { drawn: letter-card, text: "n m r h b p" }
          - text: "n"
            say: "Watch the n. Down, back up the same line, over the hill and down."
            show: { drawn: writing-lines, text: "n", mode: trace, arrows: true }
          - text: "b d"
            say: "b and d look alike! b is a robot: the tall line down comes first, then the round part. d is a caterpillar: round like a c first, then the tall line."
            show: { drawn: letter-card, text: "b d" }
          - text: "v w z"
            say: "These are zigzag letters. Start at the top and zig, zag: v, w, z."
            show: { drawn: letter-card, text: "v w z" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tracing
                text: "Trace the n."
                say: "Trace the n. Down, back up, over the hill and down."
                show: { drawn: writing-lines, text: "n", mode: trace, arrows: true }
                char: "n"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What comes first in b?"
                say: "Look at the b. What do you write first?"
                show: { drawn: letter-card, text: "b" }
                options: ["the tall line down", "the round part"]
                answer: "the tall line down"
                keep_order: true
                feedback:
                  "the round part": "That is how d starts! d is round like a c first. b is a robot: the tall line comes first."
                hints:
                  - "b is a one-armed robot letter."
                  - "Robot letters start with a line down."
                  - "The tall line down."
              - id: l2-f3
                type: tracing
                text: "Trace the b."
                say: "Trace the b. Start at the top, down the tall line, back up and round."
                show: { drawn: writing-lines, text: "b", mode: trace, arrows: true }
                char: "b"
              - id: l2-f4
                type: highlight_in_text
                text: "Tap every b."
                say: "Look carefully. Tap every b."
                show: { drawn: letter-card, text: "d b p b d" }
                spans: ["b"]
                hints:
                  - "b has its tall line first and its round part on the right."
                  - "d has its round part on the left."
                  - "There are two b's. Tap the letters with the round part on the right."
              - id: l2-f5
                type: tracing
                text: "Trace the v."
                say: "Trace the v. Start at the top, zig down, zag up."
                show: { drawn: writing-lines, text: "v", mode: trace, arrows: true }
                char: "v"

          - support: some
            tasks:
              - id: l2-s1
                type: tracing
                text: "Trace the m."
                say: "Trace the m. Down, back up and over one hill, then back up and over another."
                show: { drawn: writing-lines, text: "m", mode: trace, arrows: true }
                char: "m"
              - id: l2-s2
                type: multiple_choice
                text: "Where does r start?"
                say: "Where do you start the r?"
                show: { drawn: letter-card, text: "r" }
                options: ["at the top", "at the bottom"]
                answer: "at the top"
                keep_order: true
                hints: ["Robot letters start with a line down."]
              - id: l2-s3
                type: tracing
                text: "Copy the h."
                say: "Write an h on your own. Tall line down, back up, over and down."
                show: { drawn: writing-lines, text: "h", mode: copy, arrows: false }
                char: "h"
              - id: l2-s4
                type: true_false
                text: "d starts with the tall line."
                say: "Does d start with the tall line down?"
                show: { drawn: letter-card, text: "d" }
                answer: false
                hints: ["Is d a robot or a curly caterpillar?"]
              - id: l2-s5
                type: tracing
                text: "Trace the z."
                say: "Trace the z. Across the top, zig down to the left, then across the bottom."
                show: { drawn: writing-lines, text: "z", mode: trace, arrows: true }
                char: "z"

          - support: none
            tasks:
              - id: l2-n1
                type: tracing
                text: "Trace the p."
                say: "Trace the p. Down below the line, back up, and round."
                show: { drawn: writing-lines, text: "p", mode: trace, arrows: true }
                char: "p"
              - id: l2-n2
                type: multiple_choice
                text: "Which family is n in?"
                say: "Which family is n in?"
                options: ["the zigzags", "the one-armed robots", "the curly caterpillars"]
                answer: "the one-armed robots"
              - id: l2-n3
                type: tracing
                text: "Copy the w."
                say: "Write a w on your own. Zig, zag, zig, zag."
                show: { drawn: writing-lines, text: "w", mode: copy, arrows: false }
                char: "w"
              - id: l2-n4
                type: highlight_in_text
                text: "Tap every p."
                say: "Look carefully. Tap every p."
                show: { drawn: letter-card, text: "p q p b p" }
                spans: ["p"]
              - id: l2-n5
                type: tracing
                text: "Copy the b."
                say: "Write a b on your own. Tall line first."
                show: { drawn: writing-lines, text: "b", mode: copy, arrows: false }
                char: "b"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Where does m start?"
            say: "Where do you start the m?"
            show: { drawn: letter-card, text: "m" }
            options: ["at the top", "at the bottom"]
            answer: "at the top"
            keep_order: true
          - id: l2-c2
            type: highlight_in_text
            text: "Tap every d."
            say: "Tap every d."
            show: { drawn: letter-card, text: "b d b d p" }
            spans: ["d"]
          - id: l2-c3
            type: multiple_choice
            text: "What comes first in d?"
            say: "What do you write first in d?"
            show: { drawn: letter-card, text: "d" }
            options: ["the tall line down", "the round part"]
            answer: "the round part"
            keep_order: true
          - id: l2-c4
            type: true_false
            text: "c goes round to the right."
            say: "You start c at the top. Does it go round to the right?"
            show: { drawn: letter-card, text: "c" }
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Which family is a in?"
            say: "Which family is a in?"
            options: ["the one-armed robots", "the curly caterpillars", "the long ladders"]
            answer: "the curly caterpillars"
