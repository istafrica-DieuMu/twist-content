            part: reason
            type: multiple_choice
            text: "Gran left the butter next to the hot oven. It melted. Why?"
            say: "Gran left the butter next to the hot oven. It melted. Why?"
            options: ["because it was yellow", "because it got cold", "because it got warm"]
            answer: "because it got warm"
          - id: l2-c4
            part: new-words
            type: image_multiple_choice
            text: "Which one will float on the pond?"
            say: "Which one will float on the pond? Tap the picture."
            options: [{ object: stone }, { object: beach-ball }, { object: knife }]
            answer: beach-ball
          - id: l2-c5
            part: new-words
            type: true_false
            text: "Owls sleep in the day and hunt for food at night. Are owls nocturnal?"
            say: "Owls sleep in the day and hunt for food at night. Are owls nocturnal?"
            show: { object: owl }
            answer: true
          - id: l2-c6
            part: reason
            type: multiple_choice
            text: "Sami's tummy is rumbling. He had no breakfast. Why is his tummy rumbling?"
            say: "Sami's tummy is rumbling. He had no breakfast. Why is his tummy rumbling?"
            options: ["because he is tall", "because he is hungry", "because it is sunny"]
            answer: "because he is hungry"
          - id: l2-c7
            part: cause-picture
            type: image_multiple_choice
            text: "Mum's washing is flapping about on the line. Why?"
            say: "Mum's washing is flapping about on the line. Why? Tap the picture."
