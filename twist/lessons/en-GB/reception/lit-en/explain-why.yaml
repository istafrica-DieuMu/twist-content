# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.explain-why
skill: lit-en.speaking.explain-why
curriculum: en-GB
language: en
title:
  de: Erklären, warum etwas passiert
  en: Explaining why
summary: >
  Explaining why things happen, with because and with new words from
  stories and information books. Lesson 1 explains everyday things
  (the snowman melted because the sun was warm) and learns melt and
  shelter; lesson 2 explains facts about animals and things in water and
  learns hibernate, nocturnal and float, and ends with the skill check.
  Every question is spoken; the child chooses the reason that explains
  it, the picture that shows the cause, or the right new word.
  Explaining aloud runs as speak tasks, practised and not marked.
metadata:
  year: reception
  topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.speaking.full-sentences]
  also_practises: [lit-en.speaking.full-sentences]
  vocabulary: { en: [why, because, melt, shelter, hibernate, nocturnal, float, sink] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: reason-does-not-explain
      what: Gives a reason that is true or silly but does not explain what happened (it melted because it was Monday)
      addressed: Learn in lesson 1 says the words after because must tell why; every why task has an off-topic reason as an option, with feedback in l1-f1 and l2-f1
    - id: cause-backwards
      what: Gets the cause the wrong way round (the ice melted because it was cold)
      addressed: l1-s3, l1-n3, l1-c3 and l2-s3 ask whether an explanation makes sense
    - id: new-words-unknown
      what: Does not know or use the new words from the story or information book
      addressed: Learn explains melt, shelter, hibernate, nocturnal and float; l1-f5, l1-s5, l1-n5, l2-w2, l2-f2, l2-s2, l2-n2 and the skill check tasks l2-c2 and l2-c5; the speak tasks l1-n4, l2-f4 and l2-s4 use them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Warum? Weil ...", en: "Why? Because ..." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Which ending makes sense?"
            say: "I am drinking some water because ... Which ending makes sense?"
            options: ["I am thirsty.", "the car is red.", "it is Monday."]
            answer: "I am thirsty."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which sentence is right?"
            say: "Which sentence is right?"
            options: ["Yesterday, I will go to the zoo.", "Yesterday, I went to the zoo.", "Yesterday, I go to the zoo."]
            answer: "Yesterday, I went to the zoo."
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Why did it melt?"
            say: "We can explain why things happen. Why did the ice cream melt? Because the sun was hot. Melt means to go soft and runny when it gets warm."
            show: { object: ice-cream }
          - text: "because"
            say: "Why are there puddles on the ground? Because it rained. When you explain, use because, and make sure the words after it really say why."
            show: { object: rain }
          - text: "shelter"
            say: "Why did the children stand under the big tree? To keep dry in the rain. The tree was a shelter: a place that keeps you safe from rain or wind."
            show: { object: tree }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Why did it melt?"
                say: "The snowman melted. Why?"
                options: ["because it was a Monday", "because the sun was warm", "because it was dark"]
                answer: "because the sun was warm"
                feedback:
                  "because it was a Monday": "Snowmen don't melt because of the day. What makes snow turn into water?"
                hints:
                  - "What makes snow turn into water?"
                  - "Think about warm and cold."
                  - "Because the sun was warm."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Why is the ground wet?"
                say: "In the morning, the ground is wet and there are puddles. Why? Tap the picture."
                options: [{ object: sun }, { object: rain }, { object: moon }]
                answer: rain
                hints:
                  - "What makes puddles?"
                  - "It falls from the clouds."
                  - "Because it rained."
              - id: l1-f3
                type: multiple_choice
                text: "Why did it grow?"
                say: "Grandpa's flower grew tall. Why?"
                options: ["because he sang to it", "because he watered it and it had sun", "because it was blue"]
                answer: "because he watered it and it had sun"
                hints:
                  - "What does a plant need to grow?"
                  - "Plants need water and sunshine."
                  - "Because he watered it and it had sun."
              - id: l1-f4
                type: speak
                text: "Explain why."
                say: "Explain why you wear a coat in winter. For example: I wear a coat in winter because it is cold."
                show: { object: jacket }
                expected_text: "I wear a coat in winter because it is cold."
                hints:
                  - "Start with I wear a coat in winter."
                  - "Then say because, and why."
                  - "I wear a coat in winter because it is cold."
              - id: l1-f5
                type: multiple_choice
                text: "Which word?"
                say: "The rabbit hid under a bush to keep dry. What is the word for a place that keeps you safe from the rain?"
                options: ["a puddle", "a shelter", "a pond"]
                answer: "a shelter"
                hints:
                  - "It keeps you safe from rain or wind."
                  - "The tree was one for the children."
                  - "A shelter."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Why did it drip?"
                say: "Leo's ice lolly dripped all over his hand. Why?"
                options: ["because he was sad", "because it was melting in the sun", "because it was cold"]
                answer: "because it was melting in the sun"
                hints: ["What does the sun do to an ice lolly?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Why the sun hat?"
                say: "Ava put on her sun hat and sun cream. Why? Tap the picture."
                options: [{ object: snow }, { object: sun }, { object: rain }]
                answer: sun
                hints: ["When do we need sun cream?"]
              - id: l1-s3
                type: true_false
                text: "The puddles dried up because the sun came out. Does that make sense?"
                say: "The puddles dried up because the sun came out. Does that make sense?"
                show: { object: sun }
                answer: true
                hints: ["What does warm sunshine do to water?"]
              - id: l1-s4
                type: speak
                text: "Explain why."
                say: "Explain why we wash our hands before we eat. For example: We wash our hands because it gets rid of germs."
                show: { object: hand }
                expected_text: "We wash our hands because it gets rid of germs."
                hints: ["Start with We wash our hands because."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which is a shelter?"
                say: "It starts to pour with rain. Which one is a good shelter? Tap the picture."
                options: [{ object: park }, { object: house }, { object: swimming-pool }]
                answer: house
                hints: ["A shelter keeps you dry."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Why did it droop?"
                say: "Mia forgot to water her plant for two weeks. It drooped and went brown. Why?"
                options: ["because it was happy", "because it had no water", "because it liked the dark"]
                answer: "because it had no water"
              - id: l1-n2
                type: image_multiple_choice
                text: "Why go inside?"
                say: "Big dark clouds came and there was a rumble of thunder. The children went inside. Why? Tap the picture."
                options: [{ object: star }, { object: sun }, { object: rain }]
                answer: rain
              - id: l1-n3
                type: true_false
                text: "The ice melted because it was very cold. Does that make sense?"
                say: "The ice melted because it was very cold. Does that make sense?"
                show: { object: snow }
                answer: false
              - id: l1-n4
                type: speak
                text: "Explain why."
                say: "Explain why the snowman melted. Use the word melted. For example: The snowman melted because the sun was warm."
                show: { object: snowman }
                expected_text: "The snowman melted because the sun was warm."
              - id: l1-n5
                type: multiple_choice
                text: "What does melt mean?"
                say: "What does melt mean?"
                options: ["get bigger", "go to sleep", "go soft and runny when it gets warm"]
                answer: "go soft and runny when it gets warm"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Why the umbrella?"
            say: "Dad put up his umbrella. Why?"
            options: ["because he was hungry", "because it was raining", "because the car was red"]
            answer: "because it was raining"
          - id: l1-c2
            type: image_multiple_choice
            text: "Why is Ben shivering?"
            say: "Ben is shivering and his fingers are cold. Why? Tap the picture."
            options: [{ object: oven }, { object: sun }, { object: snow }]
            answer: snow
          - id: l1-c3
            type: true_false
            text: "The birds hid in the hedge because it was a shelter from the wind. Does that make sense?"
            say: "The birds hid in the hedge because it was a shelter from the wind. Does that make sense?"
            show: { object: bird }
            answer: true

  - n: 2
    title: { de: "Neue Wörter aus Sachbüchern", en: "New words from information books" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Why did it melt?"
            say: "Ella left her chocolate in the hot sun. It melted. Why?"
            options: ["because it got cold", "because it got warm", "because she was tired"]
            answer: "because it got warm"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "What is a shelter?"
            say: "What is a shelter?"
            options: ["a kind of food", "a place that keeps you safe from rain or wind", "a big puddle"]
            answer: "a place that keeps you safe from rain or wind"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "hibernate"
            say: "From an information book: In winter, hedgehogs hibernate. That means they go into a very deep sleep until spring. Why? Because in winter there are not many bugs for them to eat."
            show: { object: hedgehog }
          - text: "nocturnal"
            say: "Some animals come out at night, like owls and hedgehogs. They are nocturnal. Why do they come out at night? Because it is quiet and dark, and they can find their food."
            show: { object: owl }
          - text: "float and sink"
            say: "A boat floats: it stays on top of the water. A stone sinks: it goes down to the bottom. Why does the boat float? Because it is light and full of air."
            show: { object: boat }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Why do hedgehogs hibernate?"
                say: "Why do hedgehogs hibernate in winter?"
                options: ["because they like snow", "because there is not much food in winter", "because they are scared of cats"]
                answer: "because there is not much food in winter"
                feedback:
                  "because they like snow": "Hedgehogs don't sleep because of snow. What is hard to find in winter?"
                hints:
                  - "Think about what hedgehogs eat."
                  - "In winter there are not many bugs."
                  - "Because there is not much food in winter."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What does hibernate mean?"
                say: "What does hibernate mean?"
                options: ["swim in a pond", "sleep all winter", "fly far away"]
                answer: "sleep all winter"
                hints:
                  - "Think about hedgehogs in winter."
                  - "They go into a very deep ..."
                  - "Sleep all winter."
              - id: l2-f3
                type: image_multiple_choice
                text: "Which one floats?"
                say: "Which one will float on the water? Tap the picture."
                options: [{ object: scissors }, { object: boat }, { object: bell }]
                answer: boat
                hints:
                  - "Float means it stays on top of the water."
                  - "Which one is light and full of air?"
                  - "The boat."
              - id: l2-f4
                type: speak
                text: "Explain why."
                say: "Explain why hedgehogs come out at night. Use a new word. For example: Hedgehogs are nocturnal, so they come out at night to find food."
                show: { object: hedgehog }
                expected_text: "Hedgehogs are nocturnal, so they come out at night to find food."
                hints:
                  - "Use the word nocturnal."
                  - "Say what they do at night."
                  - "Hedgehogs are nocturnal, so they come out at night to find food."
              - id: l2-f5
                type: true_false
                text: "A stone sinks because it is heavy. Does that make sense?"
                say: "A stone sinks because it is heavy. Does that make sense?"
                show: { object: stone }
                answer: true
                hints:
                  - "Does a stone stay on top or go down?"
                  - "Heavy things often sink."
                  - "Yes. It makes sense."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Why at night?"
                say: "Why do owls come out at night?"
                show: { object: owl }
                options: ["because they love the sun", "because they are cold", "because they find their food in the dark"]
                answer: "because they find their food in the dark"
                hints: ["What do animals look for when they come out?"]
              - id: l2-s2
                type: multiple_choice
                text: "Which word?"
                say: "Animals that come out at night are called ... Which word?"
                options: ["nocturnal", "hungry", "heavy"]
                answer: "nocturnal"
                hints: ["It was a new word from the information book."]
              - id: l2-s3
                type: true_false
                text: "The hedgehog hibernates because summer is very hot. Does that make sense?"
                say: "The hedgehog hibernates because summer is very hot. Does that make sense?"
                show: { object: hedgehog }
                answer: false
                hints: ["When do hedgehogs hibernate?"]
              - id: l2-s4
                type: speak
                text: "Explain why."
                say: "Explain why the boat floats. Use the word floats. For example: The boat floats because it is light."
                show: { object: boat }
                expected_text: "The boat floats because it is light."
                hints: ["Start with The boat floats because."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Why did the river get so full?"
                say: "Mole's house by the river was flooded. The river was too full after days and days of ... what? Tap the picture."
                options: [{ object: rain }, { object: sun }, { object: wind }]
                answer: rain
                hints: ["What fills up a river?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Why do bees visit flowers?"
                say: "Why do bees fly from flower to flower?"
                options: ["to have a sleep", "to collect food to make honey", "to hide from the sun"]
                answer: "to collect food to make honey"
              - id: l2-n2
                type: multiple_choice
                text: "What does float mean?"
                say: "What does float mean?"
                options: ["go down to the bottom", "melt in the sun", "stay on top of the water"]
                answer: "stay on top of the water"
              - id: l2-n3
                type: image_multiple_choice
                text: "Which one sinks?"
                say: "Which one will sink to the bottom of the bath? Tap the picture."
                options: [{ object: duck }, { object: stone }, { object: ball }]
                answer: stone
              - id: l2-n4
                type: speak
                text: "Explain why."
                say: "Explain why we wear wellies when it rains. For example: We wear wellies because they keep our feet dry."
                show: { object: wellies }
                expected_text: "We wear wellies because they keep our feet dry."
              - id: l2-n5
                type: true_false
                text: "Hedgehogs come out at night because it is quiet and they can find food. Does that make sense?"
                say: "Hedgehogs come out at night because it is quiet and they can find food. Does that make sense?"
                show: { object: moon }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Why did it dry up?"
            say: "In the morning there was a puddle. In the afternoon it was gone. Why?"
            options: ["because the sun was warm", "because it was night", "because a cat sat in it"]
            answer: "because the sun was warm"
          - id: l2-c2
            type: multiple_choice
            text: "Which word?"
            say: "In winter, the hedgehog went into a very deep sleep until spring. Which word means that?"
            options: ["float", "hibernate", "melt"]
            answer: "hibernate"
          - id: l2-c3
            type: multiple_choice
            text: "Why did it melt?"
            say: "Gran left the butter next to the hot oven. It melted. Why?"
            options: ["because it was yellow", "because it got cold", "because it got warm"]
            answer: "because it got warm"
          - id: l2-c4
            type: image_multiple_choice
            text: "Which one floats?"
            say: "Which one will float on the pond? Tap the picture."
            options: [{ object: stone }, { object: beach-ball }, { object: knife }]
            answer: beach-ball
          - id: l2-c5
            type: true_false
            text: "Owls sleep in the day and hunt at night. Are owls nocturnal?"
            say: "Owls sleep in the day and hunt for food at night. Are owls nocturnal?"
            show: { object: owl }
            answer: true
