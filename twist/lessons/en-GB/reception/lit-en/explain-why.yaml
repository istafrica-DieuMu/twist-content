            answer: "because the sun was warm"
          - id: l2-c2
            part: new-words
            type: multiple_choice
            text: "In winter, the hedgehog went into a very deep sleep until spring. Which word means that?"
            say: "In winter, the hedgehog went into a very deep sleep until spring. Which word means that?"
            options: ["float", "hibernate", "melt"]
            answer: "hibernate"
