# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-ar-or-ur-ow
skill: lit-en.phonics.ar-or-ur-ow
curriculum: en-GB
language: en
title:
  de: Die Laute ar, or, ur, ow, oi
  en: The sounds ar, or, ur, ow, oi
summary: >
  More digraphs for long vowel sounds. Lesson 1 takes ar (car), or (fork)
  and ur (fur), three sounds that are easy to mix up; lesson 2 takes ow
  (cow) and oi (coin), mixes all five and ends with the skill check. The
  voice says every word; the child picks the digraph for a sound, fills a
  gap or reads a word and finds its picture.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: [lit-en.phonics.ai-ee-igh-oa]
  vocabulary: { en: [sound, letters, digraph, sound buttons, long sound, blend] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.ar, en.or, en.ur, en.ow, en.oi]
  facets: []
  misconceptions:
    - id: vowel-then-r
      what: Sounds ar, or and ur letter by letter (c ... a ... r for car) or writes only the vowel (cat for cart)
      addressed: Learn in lesson 1 gives car and fork one sound button for the digraph; feedback in l1-f1 and l1-f2 sets the short vowel against the long sound; single vowels are distractors in l1-f2, l1-f4, l1-s2, l1-n1 and l1-n2
    - id: ar-or-ur-mixed
      what: Mixes up which digraph writes which sound (corn, card, curl)
      addressed: ar, or and ur share the options in l1-f5, l1-s1, l1-s4, l1-n5, l1-c2, l1-c3, l2-w1, l2-w2, l2-n4 and the skill check tasks l2-c1 and l2-c4
    - id: ow-oi-mixed
      what: Mixes up ow and oi, both written with o and a second letter
      addressed: ow and oi share the options in l2-f2 (with feedback), l2-f5, l2-s1, l2-s2, l2-s4, l2-n1, l2-n5 and l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "ar, or, ur", en: "ar, or, ur" }
    new_content: true
    activities:
      - activity: learn
        mode: new-sound
        screens:
          - text: "ar"
            say: "These two letters make one sound, as when the doctor says open wide. Car and star have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "ar" }
            sound: en.ar
          - text: "or"
            say: "These two letters make one sound. Fork and horn have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "or" }
            sound: en.or
          - text: "ur"
            say: "These two letters make one sound. Fur and turn have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "ur" }
            sound: en.ur
          - text: "f or k → fork"
            say: "Fork has three sounds: f, or, k. The two letters in the middle share one sound button. Push the sounds together: fork."
            show: { drawn: letter-card, text: "f or k" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ar" }
                options: [{ object: cat }, { object: car }, { object: cup }]
                answer: car
                feedback:
                  cat: "Cat has the short a, as in ant. These letters make the long sound ar, as in car."
                hints:
                  - "Tap each picture and listen for a long sound."
                  - "These letters make ar. Which word ends with ar?"
                  - "Car. Tap the car."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Fork." }
                options: ["o", "or", "ar"]
                answer: "or"
                feedback:
                  "o": "One o makes the short sound in dog. Fork has the long sound or, written with two letters."
                hints:
                  - "Listen again. Is the middle sound short or long?"
                  - "The long sound in fork is the same as in corn."
                  - "Fork has or in the middle."
              - id: l1-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "car" }
                options: [{ object: cow }, { object: cup }, { object: car }]
                answer: car
                hints:
                  - "Say the sounds on the card, one by one."
                  - "c, then the two letters ar make one sound."
                  - "c, ar: car. Tap the car."
              - id: l1-f4
                type: fill_in_blank
                text: "Which letters finish the word?"
                say: "Fur. Which letters are missing at the end of fur?"
                frame: "f_"
                options: ["u", "ur", "or"]
                answer: ["ur"]
                hints:
                  - "Say fur slowly: f, ur."
                  - "The end is a long sound, so it needs two letters."
                  - "Fur ends with ur."
              - id: l1-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Corn." }
                options: ["card", "corn", "curl"]
                answer: "corn"
                hints:
                  - "Listen to the middle sound."
                  - "It is the or sound of fork."
                  - "Corn."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.ur }
                options: ["ar", "ur", "or"]
                answer: "ur"
                hints: ["It is the sound at the end of fur."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which letters finish the word?"
                say: "Star. Which letters are missing at the end of star?"
                show: { object: star }
                frame: "st_"
                options: ["a", "or", "ar"]
                answer: ["ar"]
                hints: ["Star ends like car."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ar" }
                options: [{ object: pencil }, { object: park }, { object: pig }]
                answer: park
                hints: ["Listen for the long sound ar."]
              - id: l1-s4
                type: true_false
                text: "Does the card say torn?"
                say: "Read the card. Does it say torn?"
                show: { drawn: letter-card, text: "turn" }
                answer: false
                hints: ["Look at the two letters in the middle. Are they or?"]
              - id: l1-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Short." }
                options: ["shut", "short", "shark"]
                answer: "short"
                hints: ["Listen to the middle sound. Is it the ar of car, the or of fork or the short u of cup?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Hard." }
                options: ["a", "ar", "ur"]
                answer: "ar"
              - id: l1-n2
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Burn. Which letters are missing in the middle of burn?"
                frame: "b_n"
                options: ["ar", "u", "ur"]
                answer: ["ur"]
              - id: l1-n3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "star" }
                options: [{ object: snake }, { object: star }, { object: sun }]
                answer: star
              - id: l1-n4
                type: true_false
                text: "Does car end with or?"
                say: "Car. Does car end with the sound or?"
                show: { object: car }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Sort." }
                options: ["sat", "surf", "sort"]
                answer: "sort"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which word has this sound?"
            say: "Which picture has the sound of these letters?"
            show: { drawn: letter-card, text: "ar" }
            options: [{ object: fish }, { object: farmer }, { object: fox }]
            answer: farmer
          - id: l1-c2
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen. Tap the letters for the middle sound."
            audio: { en: "Torch." }
            options: ["or", "ar", "ur"]
            answer: "or"
          - id: l1-c3
            type: fill_in_blank
            text: "Which letters are missing?"
            say: "Curl. Which letters are missing in the middle of curl?"
            frame: "c_l"
            options: ["or", "ur", "u"]
            answer: ["ur"]

  - n: 2
    title: { de: "ow und oi", en: "ow and oi" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen to the word. Which letters make its middle sound?"
            audio: { en: "Park." }
            options: ["or", "ur", "ar"]
            answer: "ar"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Which letters are missing?"
            say: "Fork. Which letters are missing in the middle of fork?"
            show: { object: fork }
            frame: "f_k"
            options: ["or", "o", "ar"]
            answer: ["or"]
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "ow"
            say: "These two letters make one sound, as when you bump your knee. Cow and town have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "ow" }
            sound: en.ow
          - text: "cow"
            say: "Cow. c, ow. Two sounds: cow."
            show: { object: cow }
          - text: "oi"
            say: "These two letters make one sound. Coin and oil have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "oi" }
            sound: en.oi
          - text: "c oi n → coin"
            say: "Coin has three sounds: c, oi, n. Push the sounds together: coin."
            show: { drawn: letter-card, text: "c oi n" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ow" }
                options: [{ object: car }, { object: cat }, { object: cow }]
                answer: cow
                feedback:
                  car: "Car has the sound ar. These letters make ow, as in cow."
                hints:
                  - "Tap each picture and listen to the end."
                  - "These letters make ow, as when you bump your knee."
                  - "Cow. Tap the cow."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Coin." }
                options: ["oi", "o", "ow"]
                answer: "oi"
                feedback:
                  "ow": "Ow is the sound in cow. Coin has oi in the middle."
                hints:
                  - "Listen again to the middle of coin."
                  - "It is the same sound as in oil."
                  - "Coin has oi."
              - id: l2-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "clown" }
                options: [{ object: cloud }, { object: clock }, { object: clown }]
                answer: clown
                hints:
                  - "All three start the same way. Read to the end of the card."
                  - "c, l, then ow, then n."
                  - "Clown. Tap the clown."
              - id: l2-f4
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Town. Which letters are missing in the middle of town?"
                frame: "t_n"
                options: ["o", "ow", "oi"]
                answer: ["ow"]
                hints:
                  - "Say town slowly: t, ow, n."
                  - "The middle is the sound in cow."
                  - "Town has ow in the middle."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Oil." }
                options: ["owl", "oil", "ill"]
                answer: "oil"
                hints:
                  - "Listen to the first sound."
                  - "It is the sound in coin."
                  - "Oil."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.ow }
                options: ["oi", "ow", "or"]
                answer: "ow"
                hints: ["It is the sound at the end of cow."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Join. Which letters are missing in the middle of join?"
                frame: "j_n"
                options: ["ow", "o", "oi"]
                answer: ["oi"]
                hints: ["Join has the sound of coin in the middle."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ow" }
                options: [{ object: cake }, { object: clown }, { object: cheese }]
                answer: clown
                hints: ["Listen for ow, as in cow."]
              - id: l2-s4
                type: true_false
                text: "Does the card say cow?"
                say: "Read the card. Does it say cow?"
                show: { drawn: letter-card, text: "coin" }
                answer: false
                hints: ["Look at the letters after the c. Are they ow or oi?"]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Now." }
                options: ["not", "now", "nor"]
                answer: "now"
                hints: ["Listen to the end. Is it the sound in cow?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Soil." }
                options: ["ow", "ur", "oi"]
                answer: "oi"
              - id: l2-n2
                type: fill_in_blank
                text: "Which letters finish the word?"
                say: "Cow. Which letters are missing at the end of cow?"
                show: { object: cow }
                frame: "c_"
                options: ["oi", "ow", "or"]
                answer: ["ow"]
              - id: l2-n3
                type: true_false
                text: "Does clown have ow in it?"
                say: "Clown. Does clown have the sound ow in it?"
                show: { object: clown }
                answer: true
              - id: l2-n4
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Turn." }
                options: ["torn", "town", "turn"]
                answer: "turn"
              - id: l2-n5
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Point. Which letters are missing in point?"
                show: { object: point }
                frame: "p_nt"
                options: ["oi", "ow", "or"]
                answer: ["oi"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen. Tap the letters for the middle sound."
            audio: { en: "Card." }
            options: ["ur", "ar", "or"]
            answer: "ar"
          - id: l2-c2
            type: image_multiple_choice
            text: "Which word has this sound?"
            say: "Which picture has the sound of these letters?"
            show: { drawn: letter-card, text: "ow" }
            options: [{ object: cup }, { object: owl }, { object: cat }]
            answer: owl
          - id: l2-c3
            type: fill_in_blank
            text: "Which letters are missing?"
            say: "Boil. Which letters are missing in the middle of boil?"
            frame: "b_l"
            options: ["ow", "or", "oi"]
            answer: ["oi"]
          - id: l2-c4
            type: fill_in_blank
            text: "Which letters are missing?"
            say: "Church. Which letters are missing in the middle of church?"
            show: { object: church }
            frame: "ch_ch"
            options: ["ar", "ur", "or"]
            answer: ["ur"]
          - id: l2-c5
            type: image_multiple_choice
            text: "Read the word. Tap its picture."
            say: "Read the word on the card. Then tap its picture."
            show: { drawn: letter-card, text: "horn" }
            options: [{ object: hen }, { object: heart }, { object: horn }]
            answer: horn
