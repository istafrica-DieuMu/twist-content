# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-ar-or-ur-ow
skill: lit-en.phonics.ar-or-ur-ow
curriculum: en-GB
language: en
title:
  de: Die Laute ar, or, ur, ow, oi
  en: The sounds ar, or, ur, ow, oi
summary: >
  More digraphs for long vowel sounds. Lesson 1 takes ar (car), or (fork)
  and ur (fur), three sounds that are easy to mix up; lesson 2 takes ow
  (cow) and oi (coin), mixes all five and ends with the skill check. The
  voice says every word; the child picks the digraph for a sound, fills a
  gap or reads a word and finds its picture. Writing the digraphs in
  words is practised in Practise (the missing letters) and in
  segment-spell; the skill check marks hearing each sound and reading
  words with it.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: [lit-en.phonics.ai-ee-igh-oa]
  vocabulary: { en: [sound, letters, digraph, sound buttons, long sound, blend] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.ar, en.or, en.ur, en.ow, en.oi]
  facets: []
  parts:
    - { id: ar, what: { de: "den Laut von ar kennen und Wörter damit lesen", en: "knowing the sound of ar and reading words with it" } }
    - { id: or, what: { de: "den Laut von or kennen und Wörter damit lesen", en: "knowing the sound of or and reading words with it" } }
    - { id: ur, what: { de: "den Laut von ur kennen und Wörter damit lesen", en: "knowing the sound of ur and reading words with it" } }
    - { id: ow-oi, what: { de: "ow und oi kennen und unterscheiden (cow, coin)", en: "knowing ow and oi and telling them apart (cow, coin)" } }
  misconceptions:
    - id: vowel-then-r
      what: Sounds ar, or and ur letter by letter (c ... a ... r for car) or writes only the vowel (cat for cart)
      addressed: Learn in lesson 1 gives car and fork one sound button for the digraph; feedback in l1-f1 and l1-f2 sets the short vowel against the long sound; single vowels are distractors in l1-f2, l1-f4, l1-s2, l1-n1 and l1-n2
    - id: ar-or-ur-mixed
      what: Mixes up which digraph writes which sound (corn, card, curl)
      addressed: ar, or and ur share the options in l1-f5, l1-s1, l1-s4, l1-n5, l1-c2, l1-c3, l2-w1, l2-w2, l2-n4 and the skill check tasks l2-c1 and l2-c4
    - id: ow-oi-mixed
      what: Mixes up ow and oi, both written with o and a second letter
      addressed: ow and oi share the options in l2-f2 (with feedback), l2-f5, l2-s1, l2-s2, l2-s4, l2-n1, l2-n5 and l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "ar, or, ur", en: "ar, or, ur" }
    new_content: true
    activities:
      - activity: learn
        mode: new-sound
        screens:
          - text: "ar"
            say: "These two letters make one sound, as when the doctor says open wide. Car and star have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "ar" }
            sound: en.ar
          - text: "or"
            say: "These two letters make one sound. Fork and horn have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "or" }
            sound: en.or
          - text: "ur"
            say: "These two letters make one sound. Fur and turn have it. Listen, then say it with me."
            show: { drawn: letter-card, text: "ur" }
            sound: en.ur
          - text: "f or k → fork"
            say: "Fork has three sounds. The two letters in the middle make one sound, so they share one sound button. Push the sounds together: fork."
            show: { drawn: letter-card, text: "f or k" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ar" }
                options: [{ object: cat }, { object: car }, { object: cup }]
                answer: car
                feedback:
                  cat: "Cat has the short sound from the start of ant. These letters make the long sound in car."
                hints:
                  - "Tap each picture and listen for a long sound."
                  - "These letters make the sound you say when the doctor says open wide. Which word ends with it?"
                  - "Car ends with it. Tap the car."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Fork." }
                options: ["o", "or", "ar"]
                answer: "or"
                feedback:
                  "o": "That one letter makes the short sound in dog. Fork has a long sound, written with two letters."
                hints:
                  - "Listen again. Is the middle sound short or long?"
                  - "The long sound in fork is the same as in corn."
                  - "Fork has the same two letters as corn in the middle."
              - id: l1-f3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "car" }
                options: [{ object: cow }, { object: cup }, { object: car }]
                answer: car
                hints:
                  - "Say the sounds on the card, one by one."
                  - "The first sound, then the two letters that make one long sound."
                  - "The card says car. Tap the car."
              - id: l1-f4
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Which letters are missing at the end of this word? Listen."
                audio: { en: "Fur." }
                frame: "f_"
                options: ["u", "ur", "or"]
                answer: ["ur"]
                hints:
                  - "Say fur slowly. Listen to the end."
                  - "The end is a long sound, so it needs two letters."
                  - "Fur ends with the same two letters as turn."
              - id: l1-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Corn." }
                options: ["card", "corn", "curl"]
                answer: "corn"
                hints:
                  - "Listen to the middle sound."
                  - "It is the long sound in fork."
                  - "The word is corn."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letters make this sound?"
                say: "Listen. Which letters make this sound?"
                audio: { sound: en.ur }
                options: ["ar", "ur", "or"]
                answer: "ur"
                hints: ["It is the sound at the end of fur."]
              - id: l1-s2
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Star. Which letters are missing at the end of star?"
                show: { object: star }
                frame: "st_"
                options: ["a", "or", "ar"]
                answer: ["ar"]
                hints: ["Star ends like car."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which word has this sound?"
                say: "Look at the letters. Which word has their sound? Tap the picture."
                show: { drawn: letter-card, text: "ar" }
                options: [{ object: pencil }, { object: park }, { object: pig }]
                answer: park
                hints: ["Listen for the long sound in car."]
              - id: l1-s4
                type: true_false
                text: "Does the card say torn?"
                say: "Read the card. Does it say torn?"
                show: { drawn: letter-card, text: "turn" }
                answer: false
                hints: ["Look at the two letters in the middle. Are they the ones in fork?"]
              - id: l1-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Short." }
                options: ["shut", "short", "shark"]
                answer: "short"
                hints: ["Listen to the middle sound. Is it the sound in car, in fork or in cup?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letters make the middle sound?"
                say: "Listen to the word. Which letters make its middle sound?"
                audio: { en: "Hard." }
                options: ["a", "ar", "ur"]
                answer: "ar"
              - id: l1-n2
                type: fill_in_blank
                text: "Which letters are missing?"
                say: "Which letters are missing in the middle of this word? Listen."
                audio: { en: "Burn." }
                frame: "b_n"
                options: ["ar", "u", "ur"]
                answer: ["ur"]
              - id: l1-n3
                type: image_multiple_choice
                text: "Read the word. Tap its picture."
                say: "Read the word on the card. Then tap its picture."
                show: { drawn: letter-card, text: "star" }
                options: [{ object: snake }, { object: star }, { object: sun }]
                answer: star
              - id: l1-n4
                type: true_false
                text: "Does car end with or?"
                say: "Car. Does car end with the sound in fork?"
                show: { object: car }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "Sort." }
                options: ["sat", "surf", "sort"]
                answer: "sort"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which word has this sound?"
            say: "Which picture has the sound of these letters?"
            show: { drawn: letter-card, text: "ar" }
            options: [{ object: fish }, { object: farmer }, { object: fox }]
            answer: farmer
          - id: l1-c2
            type: audio_choice
            text: "Which letters make the middle sound?"
            say: "Listen. Tap the letters for the middle sound."
            audio: { en: "Torch." }
            options: ["or", "ar", "ur"]
            answer: "or"
          - id: l1-c3
            type: fill_in_blank
            text: "Which letters are missing?"
            say: "Which letters are missing in the middle of this word? Listen."
            audio: { en: "Curl." }
            frame: "c_l"
            options: ["or", "ur", "u"]
            answer: ["ur"]
          - id: l1-c4
            type: true_false
            text: "Does horn have ur in the middle?"
            say: "Horn. Does horn have this sound in the middle? Listen."
            audio: { sound: en.ur }
            show: { object: horn }
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Which word has this sound?"
            say: "Which picture has the sound of these letters?"
            show: { drawn: letter-card, text: "ur" }
            options: [{ object: chair }, { object: church }, { object: cheese }]
            answer: church
          - id: l1-c6
            type: audio_choice
            text: "Which word do you hear?"
            say: "Listen. Tap the word you hear."
            audio: { en: "Barn." }
            options: ["born", "barn", "burn"]
            answer: "barn"

