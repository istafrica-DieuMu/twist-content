# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phrases-sentences
skill: lit-en.composition.phrases-sentences
curriculum: en-GB
language: en
title:
  de: Wortgruppen und Sätze schreiben
  en: Writing phrases and sentences
summary: >
  Writing a few words about a picture so that someone else can read
  them. Lesson 1 writes phrases (a red hat, my big dog): choosing the
  word that fits, sounding out each word and copying the phrase with
  finger spaces; lesson 2 writes whole sentences with a capital letter
  and a full stop (The dog can run.) and ends with the skill check.
  Copying runs as tracing with any ink; the child's own free writing is
  not marked yet. The skill check marks what a screen can: the word that
  fits, the word order, the capital letter and full stop, and a word
  written by its sounds; writing a whole phrase or sentence by hand is
  covered by Practise.
metadata:
  year: reception
  topic: { de: "Texte schreiben", en: "Writing" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.spelling.segment-spell, lit-en.handwriting.lowercase]
  also_practises: [lit-en.grammar.finger-spaces, lit-en.word-reading.first-sentences]
  vocabulary: { en: [word, phrase, sentence, capital letter, full stop, finger space, sound out, read it back] }
  forms: [text, picture, drawn, audio]
  drawn: [writing-lines, letter-card]
  facets: [script]
  parts:
    - { id: word-fits, what: { de: "das Wort wählen, das zum Bild passt", en: choosing the word that fits the picture } }
    - { id: word-order, what: { de: Wörter zu einer Wortgruppe oder einem Satz ordnen, en: putting words in order to make a phrase or sentence } }
    - { id: capital-full-stop, what: { de: Großbuchstabe am Anfang und Punkt am Ende, en: a capital letter at the start and a full stop at the end } }
    - { id: sound-out, what: { de: ein Wort nach seinen Lauten schreiben, en: writing a word by its sounds } }
  misconceptions:
    - id: no-capital-or-full-stop
      what: Writes a sentence with no capital letter at the start or no full stop at the end
      addressed: Learn in lesson 2 shows the same sentence with and without them; l2-f1 (with feedback), l2-f5, l2-s1, l2-s5, l2-n1, l2-n5 and the skill check tasks l2-c1, l2-c5, l2-c8, l2-c12, l2-c16 and l2-c20
    - id: words-out-of-order
      what: Writes the words in the order they come to mind (big my dog), so the phrase does not read
      addressed: ordering tasks in every stage (l1-f5, l1-s5, l1-n5, l1-c3, l2-w2, l2-f2, l2-s2, l2-n2, l2-c2, l2-c7, l2-c11, l2-c15, l2-c19)
    - id: missing-sounds
      what: Leaves sounds out of a word while writing (bs for bus), so others cannot read it
      addressed: Learn in lesson 1 sounds out each word; the vowel is the gap in l1-f2, l1-s2, l1-n2, l2-s3 and the checks l2-c9 and l2-c17; the child types a whole word in l2-c4 and l2-c13
    - id: lookalike-word
      what: Picks a word that looks or sounds close but does not match the picture (cap for cat)
      addressed: lookalike options in l1-f1, l1-f3 (with feedback), l1-s3, l1-n1, l1-n3, l1-c2, l2-f3, l2-n3 and the checks l2-c3, l2-c6, l2-c10, l2-c14 and l2-c18
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ein paar Wörter zum Bild", en: "Words about a picture" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Spell the word."
            say: "Pig. Put the letters in order to spell pig."
            show: { object: pig }
            options: ["g", "p", "i"]
            slot_count: 3
            answer: ["p", "i", "g"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: tracing
            text: "Copy the d."
            say: "Write a d. Round like a c first, then the tall line."
            show: { drawn: writing-lines, text: "d", mode: copy, arrows: false }
            char: "d"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "a red hat"
            say: "We can write about a picture. Here are three words that go together: a red hat. Words that go together like this are a phrase."
            show: { object: hat }
          - text: "my big dog"
            say: "First say your words out loud: my big dog. Then write one word at a time. Sound out each word. Big has three sounds: say them, then write them. Leave a finger space before the next word."
            show: { object: dog }
          - text: "a red hat"
            say: "When you have finished, read it back. Could someone else read it? Check every word has all its sounds."
            show: { drawn: letter-card, text: "a red hat" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Finish the words."
                say: "Look at the picture. Choose the word that finishes the phrase."
                show: { object: cat }
                frame: "a big _"
                options: ["cap", "cat", "dog"]
                answer: ["cat"]
                hints:
                  - "What is in the picture?"
                  - "Read each word. Which one says cat?"
                  - "The words say a big cat."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Look at the picture. Which letter is missing in the last word?"
                show: { object: bus }
                frame: "a red b_s"
                options: ["a", "u", "o"]
                answer: ["u"]
                hints:
                  - "Say bus slowly."
                  - "Bus has three sounds. Listen to the middle one."
                  - "The middle sound is the one at the start of up. Tap the letter up starts with."
              - id: l1-f3
                type: multiple_choice
                text: "Which words go with the picture?"
                say: "Look at the picture. Read the words. Which words go with it?"
                show: { object: sun }
                options: ["a hot bun", "a hot sun", "a red sock"]
                answer: "a hot sun"
                option_audio: false
                feedback:
                  "a hot bun": "Nearly! Read the last word again. It says bun, but the picture is the sun."
                hints:
                  - "What is in the picture?"
                  - "Read the last word of each one."
                  - "The words say a hot sun."
              - id: l1-f4
                type: tracing
                text: "Copy the words."
                say: "Copy the words a red hat. Leave a finger space after each word."
                show: { drawn: writing-lines, text: "a red hat", mode: copy, arrows: false }
                char: "a red hat"
              - id: l1-f5
                type: ordering
                text: "Put the words in order."
                say: "Put the word cards in order to make words about the picture."
                show: { object: dog }
                options: ["dog", "big", "my"]
                slot_count: 3
                answer: ["my", "big", "dog"]
                option_audio: false
                hints:
                  - "Say it out loud: my big dog."
                  - "Which word comes first?"
                  - "my, big, dog."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Finish the words."
                say: "Which word tells us more about the fish?"
                show: { object: fish }
                frame: "a _ fish"
                options: ["run", "big", "the"]
                answer: ["big"]
                hints: ["Say each one out loud. Which one makes sense?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing in pig?"
                show: { object: pig }
                frame: "a p_g in the mud"
                options: ["e", "i", "u"]
                answer: ["i"]
                hints: ["Say pig slowly. Listen to the middle."]
              - id: l1-s3
                type: multiple_choice
                text: "Which words go with the picture?"
                say: "Read the words. Which words go with the picture?"
                show: { object: cup }
                options: ["my red cap", "my red cup", "my red cat"]
                answer: "my red cup"
                option_audio: false
                hints: ["Read the last word of each one."]
              - id: l1-s4
                type: tracing
                text: "Copy the words."
                say: "Copy the words my dog. Leave a finger space."
                show: { drawn: writing-lines, text: "my dog", mode: copy, arrows: false }
                char: "my dog"
              - id: l1-s5
                type: ordering
                text: "Put the words in order."
                say: "Put the word cards in order to make words about the picture."
                show: { object: hat }
                options: ["hat", "red", "a"]
                slot_count: 3
                answer: ["a", "red", "hat"]
                option_audio: false
                hints: ["Say it out loud first."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Finish the words."
                say: "Look at the picture. Choose the word that finishes the phrase."
                show: { object: duck }
                frame: "a little _"
                options: ["sock", "dock", "duck"]
                answer: ["duck"]
              - id: l1-n2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing in bed?"
                show: { object: bed }
                frame: "my b_d"
                options: ["a", "i", "e"]
                answer: ["e"]
              - id: l1-n3
                type: multiple_choice
                text: "Which words go with the picture?"
                say: "Read the words. Which words go with the picture?"
                show: { object: box }
                options: ["a big fox", "a bag box", "a big box"]
                answer: "a big box"
                option_audio: false
              - id: l1-n4
                type: tracing
                text: "Copy the words."
                say: "Copy the words a big pig."
                show: { drawn: writing-lines, text: "a big pig", mode: copy, arrows: false }
                char: "a big pig"
              - id: l1-n5
                type: ordering
                text: "Put the words in order."
                say: "Put the word cards in order to make words about the picture."
                show: { object: bell }
                options: ["red", "bell", "my"]
                slot_count: 3
                answer: ["my", "red", "bell"]
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Finish the words."
            say: "Which word tells us more about the dog?"
            show: { object: dog }
            frame: "a _ dog"
            options: ["sit", "big", "is"]
            answer: ["big"]
          - id: l1-c2
            type: multiple_choice
            text: "Which words go with the picture?"
            say: "Which words go with the picture?"
            show: { object: hat }
            options: ["a red hot", "a red bat", "a red hat"]
            answer: "a red hat"
            option_audio: false
          - id: l1-c3
            type: ordering
            text: "Put the words in order."
            say: "Put the word cards in order."
            show: { object: cat }
            options: ["cat", "my", "pet"]
            slot_count: 3
            answer: ["my", "pet", "cat"]
            option_audio: false
          - id: l1-c4
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Which letter is missing in sun?"
            show: { object: sun }
            frame: "a hot s_n"
            options: ["a", "u", "i"]
            answer: ["u"]
          - id: l1-c5
            type: multiple_choice
            text: "Which words go with the picture?"
            say: "Which words go with the picture?"
            show: { object: fox }
            options: ["a red box", "a rod fox", "a red fox"]
            answer: "a red fox"
            option_audio: false
          - id: l1-c6
            type: ordering
            text: "Put the words in order."
            say: "Put the word cards in order."
            show: { object: duck }
            options: ["little", "duck", "my"]
            slot_count: 3
            answer: ["my", "little", "duck"]
            option_audio: false

  - n: 2
    title: { de: "Ein ganzer Satz", en: "A whole sentence" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Finish the words."
            say: "Look at the picture. Choose the word that finishes the phrase."
            show: { object: fish }
            frame: "a big _"
            options: ["dish", "fox", "fish"]
            answer: ["fish"]
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Put the words in order."
            say: "Put the word cards in order to make words about the picture."
            show: { object: bus }
            options: ["bus", "a", "red"]
            slot_count: 3
            answer: ["a", "red", "bus"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The dog can run."
            say: "A sentence tells us a whole idea. It starts with a capital letter and ends with a full stop: The dog can run."
            show: { object: dog }
          - text: "the dog can run"
            say: "Here the capital letter and the full stop are missing. We cannot see where the sentence starts and stops."
            show: { drawn: letter-card, text: "the dog can run" }
          - text: "I can see a cat."
            say: "Say your sentence out loud. Count the words on your fingers: I, can, see, a, cat. Write one word at a time with finger spaces. Read it back."
            show: { object: cat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which sentence is written correctly?"
                say: "Look carefully. Which sentence has a capital letter and a full stop?"
                options: ["the cat sat.", "The cat sat", "The cat sat."]
                answer: "The cat sat."
                option_audio: false
                feedback:
                  "the cat sat.": "Nearly! It has a full stop, but a sentence starts with a capital letter: The."
                hints:
                  - "Look at the start and at the end."
                  - "You need a capital T at the start and a full stop at the end."
                  - "Find the one with a capital T and a full stop. Tap it."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Make the sentence."
                say: "Put the word cards in order to make a sentence about the picture."
                show: { object: dog }
                options: ["run.", "can", "The", "dog"]
                slot_count: 4
                answer: ["The", "dog", "can", "run."]
                option_audio: false
                hints:
                  - "The capital letter starts the sentence."
                  - "The full stop ends it."
                  - "The dog can run."
              - id: l2-f3
                type: fill_in_blank
                text: "Finish the sentence."
                say: "Look at the picture. Choose the word that finishes the sentence."
                show: { object: sun }
                frame: "The sun is _."
                options: ["hen", "hat", "hot"]
                answer: ["hot"]
                hints:
                  - "Read each word."
                  - "What is the sun like?"
                  - "The sun is hot."
              - id: l2-f4
                type: tracing
                text: "Copy the sentence."
                say: "Copy the sentence I can hop. Start with a capital letter and end with a full stop."
                show: { drawn: writing-lines, text: "I can hop.", mode: copy, arrows: false }
                char: "I can hop."
              - id: l2-f5
                type: true_false
                text: "Capital letter and full stop?"
                say: "Look at the card. Does this sentence start with a capital letter and end with a full stop?"
                show: { drawn: letter-card, text: "the pig is big" }
                answer: false
                hints:
                  - "Look at the first letter."
                  - "Then look at the very end."
                  - "No. It needs a capital T and a full stop."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which sentence is written correctly?"
                say: "Which sentence has a capital letter and a full stop?"
                options: ["I got a dog", "i got a dog.", "I got a dog."]
                answer: "I got a dog."
                option_audio: false
                hints: ["Check the start and the end of each one."]
              - id: l2-s2
                type: ordering
                text: "Make the sentence."
                say: "Put the word cards in order to make a sentence about the picture."
                show: { object: duck }
                options: ["swim.", "duck", "A", "can"]
                slot_count: 4
                answer: ["A", "duck", "can", "swim."]
                option_audio: false
                hints: ["The card with the capital letter comes first."]
              - id: l2-s3
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing in cat?"
                show: { object: cat }
                frame: "I can see a c_t."
                options: ["u", "a", "o"]
                answer: ["a"]
                hints: ["Say cat slowly. Listen to the middle."]
              - id: l2-s4
                type: tracing
                text: "Copy the sentence."
                say: "Copy the sentence The dog ran. Capital letter at the start, full stop at the end."
                show: { drawn: writing-lines, text: "The dog ran.", mode: copy, arrows: false }
                char: "The dog ran."
              - id: l2-s5
                type: true_false
                text: "Capital letter and full stop?"
                say: "Does this sentence start with a capital letter and end with a full stop?"
                show: { drawn: letter-card, text: "Mum has a hat." }
                answer: true
                hints: ["Look at the first letter and the very end."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which sentence is written correctly?"
                say: "Which sentence has a capital letter and a full stop?"
                options: ["The bus is red.", "the bus is red.", "The bus is red"]
                answer: "The bus is red."
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Make the sentence."
                say: "Put the word cards in order to make a sentence about the picture."
                show: { object: fish }
                options: ["can", "fish", "swim.", "A"]
                slot_count: 4
                answer: ["A", "fish", "can", "swim."]
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Finish the sentence."
                say: "Look at the picture. Choose the word that finishes the sentence."
                show: { object: bed }
                frame: "I am in _."
                options: ["red", "bad", "bed"]
                answer: ["bed"]
              - id: l2-n4
                type: tracing
                text: "Copy the sentence."
                say: "Copy the sentence I see a cat."
                show: { drawn: writing-lines, text: "I see a cat.", mode: copy, arrows: false }
                char: "I see a cat."
              - id: l2-n5
                type: true_false
                text: "Capital letter and full stop?"
                say: "Does this sentence start with a capital letter and end with a full stop?"
                show: { drawn: letter-card, text: "we had fun" }
                answer: false

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: capital-full-stop
            type: multiple_choice
            text: "Which sentence is written correctly?"
            say: "Which sentence has a capital letter and a full stop?"
            options: ["Dad is sad", "dad is sad.", "Dad is sad."]
            answer: "Dad is sad."
            option_audio: false
          - id: l2-c2
            part: word-order
            type: ordering
            text: "Make the sentence."
            say: "Put the word cards in order to make a sentence about the picture."
            show: { object: cat }
            options: ["sat", "The", "down.", "cat"]
            slot_count: 4
            answer: ["The", "cat", "sat", "down."]
            option_audio: false
          - id: l2-c3
            part: word-fits
            type: fill_in_blank
            text: "Finish the sentence."
            say: "Look at the picture. Choose the word that finishes the sentence."
            show: { object: hat }
            frame: "I got a red _."
            options: ["hut", "hat", "hot"]
            answer: ["hat"]
          - id: l2-c4
            part: sound-out
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nThe dog can ___."
            say: "Listen: The dog can dig. Write the missing word."
            show: { object: dog }
            answer: "dig"
          - id: l2-c5
            part: capital-full-stop
            type: true_false
            text: "Capital letter and full stop?"
            say: "Does this sentence start with a capital letter and end with a full stop?"
            show: { drawn: letter-card, text: "the cup is hot." }
            answer: false
          - id: l2-c6
            part: word-fits
            type: fill_in_blank
            text: "Finish the words."
            say: "Look at the picture. Choose the word that finishes the phrase."
            show: { object: bus }
            frame: "a big red _"
            options: ["bun", "box", "bus"]
            answer: ["bus"]
          - id: l2-c7
            part: word-order
            type: ordering
            text: "Put the words in order."
            say: "Put the word cards in order to make words about the picture."
            show: { object: box }
            options: ["box", "big", "a", "red"]
            slot_count: 4
            answer: ["a", "big", "red", "box"]
            option_audio: false
          - id: l2-c8
            part: capital-full-stop
            type: true_false
            text: "Capital letter and full stop?"
            say: "Does this sentence start with a capital letter and end with a full stop?"
            show: { drawn: letter-card, text: "The van is red." }
            answer: true
          - id: l2-c9
            part: sound-out
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Which letter is missing in sock?"
            show: { object: sock }
            frame: "My s_ck is red."
            options: ["u", "o", "a"]
            answer: ["o"]
          - id: l2-c10
            part: word-fits
            type: fill_in_blank
            text: "Finish the sentence."
            say: "Look at the picture. Choose the word that finishes the sentence."
            show: { object: van }
            frame: "I can see a _."
            options: ["fan", "van", "vet"]
            answer: ["van"]
          - id: l2-c11
            part: word-order
            type: ordering
            text: "Make the sentence."
            say: "Put the word cards in order to make a sentence about the picture."
            show: { object: hen }
            options: ["is", "big.", "hen", "The"]
            slot_count: 4
            answer: ["The", "hen", "is", "big."]
            option_audio: false
          - id: l2-c12
            part: capital-full-stop
            type: multiple_choice
            text: "Which sentence is written correctly?"
            say: "Which sentence has a capital letter and a full stop?"
            options: ["we can run", "We can run", "We can run.", "we can run."]
            answer: "We can run."
            option_audio: false
          - id: l2-c13
            part: sound-out
            type: text_input
            keyboard: letters
            text: "Write the missing word.\nI have a red ___."
            say: "Listen: I have a red cup. Write the missing word."
            show: { object: cup }
            answer: "cup"
          - id: l2-c14
            part: word-fits
            type: multiple_choice
            text: "Which words go with the picture?"
            say: "Read the words. Which words go with the picture?"
            show: { object: pig }
            options: ["a pink pen", "a big peg", "a pink pig"]
            answer: "a pink pig"
            option_audio: false
          - id: l2-c15
            part: word-order
            type: ordering
            text: "Make the sentence."
            say: "Put the word cards in order to make a sentence about the picture."
            show: { object: fox }
            options: ["see", "fox.", "I", "a", "can"]
            slot_count: 5
            answer: ["I", "can", "see", "a", "fox."]
            option_audio: false
          - id: l2-c16
            part: capital-full-stop
            type: fill_in_blank
            text: "Fill the gaps to make a sentence."
            say: "Fill the gaps. Make it a sentence with a capital letter and a full stop."
            frame: "_he cat is fat_"
            options: ["T", "t", "."]
            answer: ["T", "."]
            option_audio: false
          - id: l2-c17
            part: sound-out
            type: fill_in_blank
            text: "Which letter is missing?"
            say: "Which letter is missing in pen?"
            show: { object: pen }
            frame: "a big p_n"
            options: ["i", "a", "e"]
            answer: ["e"]
          - id: l2-c18
            part: word-fits
            type: fill_in_blank
            text: "Finish the sentence."
            say: "Look at the picture. Choose the word that finishes the sentence."
            show: { object: jug }
            frame: "The _ is big."
            options: ["jog", "bug", "jug"]
            answer: ["jug"]
          - id: l2-c19
            part: word-order
            type: ordering
            text: "Make the sentence."
            say: "Put the word cards in order to make a sentence about the picture."
            show: { object: pig }
            options: ["mud.", "in", "pig", "The", "is", "the"]
