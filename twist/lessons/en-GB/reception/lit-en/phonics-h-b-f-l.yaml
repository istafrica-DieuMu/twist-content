            text: "What starts with this sound?"
            say: "Listen to the sound. Which picture starts with it?"
            audio: { sound: en.h }
            options: [{ object: egg }, { object: hen }, { object: ant }]
            answer: hen
          - id: l2-c7
            part: words
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word. Which picture is it?"
            show: { drawn: letter-card, text: "hat" }
            options: [{ object: hen }, { object: horse }, { object: hat }]
            answer: hat
            option_audio: false
          - id: l2-c8
            part: doubled
