# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-h-b-f-l
skill: lit-en.phonics.h-b-f-l
curriculum: en-GB
language: en
title:
  de: Die Laute h, b, f, l und ff, ll, ss
  en: The sounds h, b, f, l and ff, ll, ss
summary: >
  The last single letters of the first phonics phase, and three doubled
  endings. Lesson 1 links h, b, f and l to their sounds; lesson 2 shows
  that ff, ll and ss at the end of a short word make one sound (puff,
  doll, miss), blends words with all the letters so far, and ends with the
  skill check. The sounds are played from the sound bank, never as letter
  names. Writing the letters in words is practised in Practise (what is
  missing) and in segment-spell; the skill check marks the sounds and
  reading the words.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonics.ck-e-u-r]
  also_practises: [lit-en.phonics.ck-e-u-r]
  vocabulary: { en: [sound, letter, blend, word, double] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.h, en.b, en.f, en.l, en.d]
  facets: []
  parts:
    - { id: h-f-l, what: { de: "die Laute von h, f und l kennen", en: "knowing the sounds of h, f and l" } }
    - { id: b-d, what: { de: b und d unterscheiden, en: telling b from d } }
    - { id: doubled, what: { de: "Wörter mit ff, ll oder ss am Ende lesen (huff, tell, mess)", en: "reading words that end in ff, ll or ss (huff, tell, mess)" } }
    - { id: words, what: { de: "Wörter mit h, b, f und l lesen (hen, lot, bus)", en: "reading words with h, b, f and l (hen, lot, bus)" } }
  misconceptions:
    - id: b-d-reversal
      what: Mixes up b and d, which look like mirror images
      addressed: b and d share an option set in the full and some stages of lesson 1 (l1-f1 with feedback, l1-f5 with feedback, l1-s3), the none stage asks whether duck starts with b (l1-n4), and the quick check offers dog beside bee (l1-c2); lesson 2 sets big against dig (l2-f1, with feedback) and bad against dad (l2-s1)
    - id: double-two-sounds
      what: Says the doubled letters twice (dol-l)
      addressed: lesson 2 Learn says the two letters make one sound; ff, ll and ss words sit in every stage of lesson 2
    - id: h-dropping
      what: Drops the h at the start (at for hat)
      addressed: l1-s4 asks whether egg starts with h and l1-n2 sets hedgehog against egg and ant; l2-f5 sets hat against at, with feedback
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "h, b, f, l", en: "h, b, f, l" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "h"
            say: "This letter makes a little breath, like when you fog up a window. Horse, hippo and helicopter all start with it. Listen."
            show: { drawn: letter-card, text: "h" }
            sound: en.h
          - text: "b"
            say: "This letter makes a short pop with your lips and your voice. Button, bucket and beetle all start with it. Listen."
            show: { drawn: letter-card, text: "b" }
            sound: en.b
          - text: "f"
            say: "This letter makes a long sound. Your top teeth touch your bottom lip. Feather, fire and fork all start with it. Listen."
            show: { drawn: letter-card, text: "f" }
            sound: en.f
          - text: "l"
            say: "This letter makes a long sound with your tongue behind your top teeth. Lemon, lorry and lolly all start with it. Listen."
            show: { drawn: letter-card, text: "l" }
            sound: en.l

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.b }
                options: ["b", "d", "h"]
                answer: "b"
                feedback:
                  "d": "That letter makes the sound at the start of dog. They look alike, but this one has its tummy on the other side."
                hints:
                  - "Listen again. Your lips pop."
                  - "Button starts with this sound."
                  - "It is the letter with a tall stick first and then its round tummy, like a bat and then a ball."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "f" }
                options: [{ object: fish }, { object: sun }, { object: pig }]
                answer: fish
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts like feather?"
                  - "Fish starts with this letter. Tap the fish."
                difficulty: easy
              - id: l1-f3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.l }
                options: ["n", "l", "f"]
                answer: "l"
                hints:
                  - "Listen again. Where is your tongue?"
                  - "Lemon starts with this sound."
                  - "It is the letter that is just one tall stick."
              - id: l1-f4
                type: true_false
                text: "Does it start with h?"
                say: "Hat. Does hat start with this sound? Listen."
                audio: { sound: en.h }
                show: { object: hat }
                answer: true
                hints:
                  - "Say hat slowly. Listen to the start."
                  - "Do you hear a little breath at the start?"
                  - "Yes, hat starts with this letter."
              - id: l1-f5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "b" }
                options: [{ object: dog }, { object: bus }, { object: moon }]
                answer: bus
                feedback:
                  dog: "Dog starts with the letter that looks the other way round. Listen: bus pops with your lips."
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts with a pop of your lips?"
                  - "Bus starts with this letter. Tap the bus."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.h }
                options: ["h", "f", "n"]
                answer: "h"
                hints: ["Listen again. Is it a quick breath, like the start of horse?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "l" }
                options: [{ object: nose }, { object: lion }, { object: rabbit }]
                answer: lion
                hints: ["Which one starts like lemon?"]
              - id: l1-s3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.b }
                options: ["d", "p", "b"]
                answer: "b"
                hints: ["Listen again. Is your voice on?"]
              - id: l1-s4
                type: true_false
                text: "Does it start with h?"
                say: "Egg. Does egg start with this sound? Listen."
                audio: { sound: en.h }
                show: { object: egg }
                answer: false
                hints: ["Say egg slowly. Is there a breath at the start?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "f" }
                options: [{ object: sock }, { object: dog }, { object: frog }]
                answer: frog
                hints: ["Which one starts like feather?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.f }
                options: ["s", "f", "h"]
                answer: "f"
              - id: l1-n2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "h" }
                options: [{ object: hedgehog }, { object: egg }, { object: ant }]
                answer: hedgehog
              - id: l1-n3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.l }
                options: ["l", "r", "n"]
                answer: "l"
              - id: l1-n4
                type: true_false
                text: "Does it start with b?"
                say: "Duck. Does duck start with this sound? Listen."
                audio: { sound: en.b }
                show: { object: duck }
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "l" }
                options: [{ object: leaf }, { object: moon }, { object: tree }]
                answer: leaf

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.h }
            options: ["b", "l", "h"]
            answer: "h"
          - id: l1-c2
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "b" }
            options: [{ object: bee }, { object: dog }, { object: fish }]
            answer: bee
          - id: l1-c3
            type: true_false
            text: "Does it start with f?"
            say: "Foot. Does foot start with this sound? Listen."
            audio: { sound: en.f }
            show: { object: foot }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "What starts with this sound?"
            say: "Listen to the sound. Which picture starts with it?"
            audio: { sound: en.f }
            options: [{ object: sock }, { object: fox }, { object: moon }]
            answer: fox
          - id: l1-c5
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "h" }
            options: [{ object: egg }, { object: bus }, { object: house }]
            answer: house
          - id: l1-c6
            type: true_false
            text: "Does it start with l?"
            say: "Nose. Does nose start with this sound? Listen."
            audio: { sound: en.l }
            show: { object: nose }
            answer: false

  - n: 2
    title: { de: "hot, bed, puff, doll", en: "hot, bed, puff, doll" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "h o t → hot"
            say: "Point to each letter and say its sound. Then push them together: hot."
            show: { drawn: letter-card, text: "h o t" }
          - text: "o ff → off · b e ll → bell · k i ss → kiss"
            say: "Look at the end of these short words. The last sound is written with two letters the same. Off. Bell. Kiss. Two letters, but you say the sound once."
            show: { drawn: letter-card, text: "off bell kiss" }
          - text: "f u n → fun"
            say: "Slowly, then fast: fun."
            show: { drawn: letter-card, text: "f u n" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "big" }
                options: ["big", "dig", "bag"]
                answer: "big"
                feedback:
                  "dig": "Dig starts with the sound of dog. Big starts with a pop of your lips."
                hints:
                  - "Listen to the first sound."
                  - "Do your lips pop at the start?"
                  - "The word is big."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "What is missing?"
                say: "What is missing at the end of this word? Listen."
                audio: { en: "Doll." }
                frame: "do_"
                options: ["ll", "l", "ff"]
                answer: ["ll"]
                hints:
                  - "Doll is a short word. It ends with the long sound at the start of lemon."
                  - "In doll, that sound is written with two letters the same, like in bell."
                  - "Two tall sticks, like at the end of bell."
              - id: l2-f3
                type: true_false
                text: "Does the card say the word you hear?"
                say: "Does the card say this word? Listen."
                audio: { en: "Leg." }
                show: { drawn: letter-card, text: "leg" }
                answer: true
                hints:
                  - "Point to each letter and say its sound."
                  - "Say the sounds again, faster, and push them together."
                  - "Yes, it says leg."
              - id: l2-f4
                type: fill_in_blank
                text: "What is missing?"
                say: "What is missing at the end of this word? Listen."
                audio: { en: "Miss." }
                frame: "mi_"
                options: ["ss", "s", "ll"]
                answer: ["ss"]
                hints:
                  - "Miss is a short word that ends with a hiss."
                  - "In miss, the hiss is written with two letters the same, like in kiss."
                  - "Two snake letters."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "hat" }
                options: ["at", "hat", "hot"]
                answer: "hat"
                feedback:
                  "at": "Listen again. There is a little breath before the sound of ant."
                hints:
                  - "Listen to the start, then the middle."
                  - "Is there a breath at the start?"
                  - "The word is hat."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "bad" }
                options: ["dad", "bad", "bed"]
                answer: "bad"
                hints: ["Listen to the first sound and the middle sound."]
              - id: l2-s2
                type: fill_in_blank
                text: "What is missing?"
                say: "What is missing at the end of this word? Listen."
                audio: { en: "Puff." }
                frame: "pu_"
                options: ["f", "ff", "ss"]
                answer: ["ff"]
                hints: ["Say puff slowly. Does it end like off, bell or kiss?"]
              - id: l2-s3
                type: true_false
                text: "Does the card say the word you hear?"
                say: "Does the card say this word? Listen."
                audio: { en: "Hug." }
                show: { drawn: letter-card, text: "bug" }
                answer: false
                hints: ["Look at the first letter."]
              - id: l2-s4
                type: fill_in_blank
                text: "What is missing?"
                say: "What is missing at the end of this word? Listen."
                audio: { en: "Hill." }
                frame: "hi_"
                options: ["ss", "l", "ll"]
                answer: ["ll"]
                hints: ["Say hill slowly. Does it end like bell or like kiss?"]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "fig" }
                options: ["fog", "fig", "big"]
                answer: "fig"
                hints: ["Listen to the start and to the middle."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "lid" }
                options: ["lid", "lad", "kid"]
                answer: "lid"
              - id: l2-n2
                type: fill_in_blank
                text: "What is missing?"
                say: "What is missing at the end of this word? Listen."
                audio: { en: "Fell." }
                frame: "fe_"
                options: ["ll", "ss", "l"]
                answer: ["ll"]
              - id: l2-n3
                type: true_false
                text: "Does the card say the word you hear?"
                say: "Does the card say this word? Listen."
                audio: { en: "Bus." }
                show: { drawn: letter-card, text: "bus" }
                answer: true
              - id: l2-n4
                type: fill_in_blank
                text: "What is missing?"
                say: "What is missing at the end of this word? Listen."
                audio: { en: "Hiss." }
                frame: "hi_"
                options: ["s", "ff", "ss"]
                answer: ["ss"]
              - id: l2-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "hut" }
                options: ["hat", "hut", "but"]
                answer: "hut"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: h-f-l
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.f }
            options: ["h", "l", "f"]
            answer: "f"
          - id: l2-c2
            part: h-f-l
