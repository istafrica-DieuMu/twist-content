# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-j-v-w-x
skill: lit-en.phonics.j-v-w-x
curriculum: en-GB
language: en
title:
  de: Die Laute j, v, w, x
  en: The sounds j, v, w, x
summary: >
  Four more letters. Lesson 1 links j, v and w to the sound at the start
  of a word and x to the sound at the end (fox, box); lesson 2 blends
  words with them (jam, van, web, six) and ends with the skill check.
  The sounds are played from the sound bank, never as letter names.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonics.h-b-f-l]
  also_practises: [lit-en.phonics.h-b-f-l]
  vocabulary: { en: [sound, letter, blend, word] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.j, en.v, en.w, en.ks, en.f]
  facets: []
  parts:
    - { id: sound-letter, what: { de: einen Laut hören und seinen Buchstaben finden, en: hearing a sound and finding its letter } }
    - { id: sound-in-word, what: { de: "den Laut eines Buchstabens in einem Wort hören (j, v, w am Anfang, x am Ende)", en: "hearing a letter's sound in a word (j, v and w at the start, x at the end)" } }
    - { id: read-words, what: { de: "Wörter mit j, v, w und x lesen (jam, van, six)", en: "reading words with j, v, w and x (jam, van, six)" } }
    - { id: letter-in-word, what: { de: den fehlenden Buchstaben in einem gehörten Wort finden, en: finding the missing letter in a word you hear } }
  misconceptions:
    - id: v-f-mixup
      what: Mixes up v and f, made with the same lips and teeth (van as fan)
      addressed: v and f share an option set in every stage of lesson 1 (l1-f1 and l1-f5 with feedback, l1-s1, l1-n5); lesson 2 sets van against fan (l2-f1, with feedback) and asks for v or f at the start of van (l2-c4); the skill check plays the f sound under a v (l2-c9) and offers f beside v in l2-c8
    - id: x-at-start
      what: Listens for x at the start of words, where it hardly ever comes
      addressed: lesson 1 Learn says x usually comes at the end; the x word tasks in every stage of lesson 1 ask about the end of the word (l1-f4, l1-s4, l1-n4, l1-c3), and every x word in lesson 2 has x at the end (l2-f2, l2-f5, l2-s2, l2-n2, l2-n5)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "j, v, w, x", en: "j, v, w, x" }
    goal:
      de: "Lerne vier neue Laute, so wie das Summen in violin und das Klicken mit Zischen am Ende von six."
      en: "Learn four new sounds, like the buzz in violin and the click and hiss at the end of six."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "j"
            say: "Here is a new letter. Jelly wobbles on the plate! Say jelly slowly. What do you think: does jelly start like jam, or like ham? Have a guess."
            show: { drawn: letter-card, text: "j" }
          - text: "j"
            say: "Like jam! This letter makes a short sound. Jelly, jam, jungle and jacket all start with it. Listen."
            show: { drawn: letter-card, text: "j" }
            sound: en.j
          - text: "Did you know?"
            say: "Did you know? Jellyfish starts with this letter. A jellyfish has no brain and no bones. It is mostly water!"
            show: { object: jellyfish }
          - text: "v"
            say: "This letter makes a buzzing sound. Your top teeth touch your bottom lip. Violin, volcano and vase all start with it. Listen."
            show: { drawn: letter-card, text: "v" }
            sound: en.v
          - text: "w"
            say: "For this letter your lips make a little circle. Window, worm and wolf all start with it. Listen."
            show: { drawn: letter-card, text: "w" }
            sound: en.w
          - text: "x"
            say: "This letter usually comes at the end of a word. It makes two sounds together, a click and a hiss. Six, taxi and axe have it. Listen."
            show: { drawn: letter-card, text: "x" }
            sound: en.ks

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.v }
                options: ["v", "f", "w"]
                answer: "v"
                feedback:
                  "f": "That letter makes a breath, like in fish. This one buzzes, like in violin."
                hints:
                  - "Listen again. Does it buzz?"
                  - "Violin starts with this sound."
                  - "It is the letter shaped like a pointy cup."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "j" }
                options: [{ object: jug }, { object: goat }, { object: sun }]
                answer: jug
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts like jelly?"
                  - "Jug starts with this letter. Tap the jug."
                difficulty: easy
              - id: l1-f3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.w }
                options: ["w", "v", "u"]
                answer: "w"
                hints:
                  - "Listen again. Do your lips make a circle?"
                  - "Window starts with this sound."
                  - "It is the letter that looks like two pointy cups."
              - id: l1-f4
                type: true_false
                text: "Does the word end with this letter?"
                say: "Listen. Does the word end with this letter?"
                audio: { en: "Fox." }
                show: { drawn: letter-card, text: "x" }
                answer: true
                hints:
                  - "Say fox slowly. Listen to the end."
                  - "Do you hear a click and a hiss at the end?"
                  - "Yes, fox ends with this letter."
              - id: l1-f5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "v" }
                options: [{ object: fish }, { object: van }, { object: bus }]
                answer: van
                feedback:
                  fish: "Fish starts with a breath, like feather. This letter buzzes, like the start of van."
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts with a buzz?"
                  - "Van starts with this letter. Tap the van."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.v }
                options: ["f", "v", "b"]
                answer: "v"
                hints: ["Listen again. Is it a breath, a buzz or a pop?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "w" }
                options: [{ object: web }, { object: van }, { object: egg }]
                answer: web
                hints: ["Which one starts like window?"]
              - id: l1-s3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.ks }
                options: ["s", "x", "k"]
                answer: "x"
                hints: ["Listen again. Is it one sound or two together?"]
              - id: l1-s4
                type: true_false
                text: "Does the word end with this letter?"
                say: "Listen. Does the word end with this letter?"
                audio: { en: "Bus." }
                show: { drawn: letter-card, text: "x" }
                answer: false
                hints: ["Say bus slowly. Is there a click before the hiss?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "j" }
                options: [{ object: dog }, { object: jump }, { object: frog }]
                answer: jump
                hints: ["Which one starts like jelly?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.v }
                options: ["w", "v", "b"]
                answer: "v"
              - id: l1-n2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "w" }
                options: [{ object: wave }, { object: fox }, { object: bee }]
                answer: wave
                feedback:
                  bee: "Buzz buzz! Bee starts with a pop of your lips. For this letter your lips make a little circle, like in window."
              - id: l1-n3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.j }
                options: ["j", "d", "c"]
                answer: "j"
              - id: l1-n4
                type: true_false
                text: "Does the word end with this letter?"
                say: "Listen. Does the word end with this letter?"
                audio: { en: "Box." }
                show: { drawn: letter-card, text: "x" }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "v" }
                options: [{ object: van }, { object: web }, { object: fish }]
                answer: van

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.w }
            options: ["v", "u", "w"]
            answer: "w"
          - id: l1-c2
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "j" }
            options: [{ object: jumper }, { object: girl }, { object: yo-yo }]
            answer: jumper
          - id: l1-c3
            type: true_false
            text: "Does the word end with this letter?"
            say: "Listen. Does the word end with this letter?"
            audio: { en: "Fix." }
            show: { drawn: letter-card, text: "x" }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.j }
            options: ["v", "w", "j"]
            answer: "j"
          - id: l1-c5
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "w" }
            options: [{ object: van }, { object: witch }, { object: jug }]
            answer: witch
          - id: l1-c6
            type: true_false
            text: "Does the word start with this letter?"
            say: "Listen. Does the word start with this letter?"
            audio: { en: "Fish." }
            show: { drawn: letter-card, text: "v" }
            answer: false

  - n: 2
    title: { de: "jam, van, web, six", en: "jam, van, web, six" }
    goal:
      de: "Sag jeden Laut und schieb die Laute zusammen, so liest du jam, van, web und six."
      en: "Say each sound and push them together to read jam, van, web and six."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "j a m"
            say: "This word is something sticky and sweet that you spread on toast. What do you think it says? Say the sound of each letter and have a guess."
            show: { drawn: letter-card, text: "j a m" }
          - text: "j a m → jam"
            say: "Point to each letter and say its sound. Then push them together: jam."
            show: { drawn: letter-card, text: "j a m" }
          - text: "w e t → wet"
            say: "Slowly, then fast: wet."
            show: { drawn: letter-card, text: "w e t" }
          - text: "s i x → six"
            say: "The last letter makes two sounds together, a click and a hiss. Slowly, then fast: six."
            show: { drawn: letter-card, text: "s i x" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "van" }
                options: ["van", "fan", "man"]
                answer: "van"
                feedback:
                  "fan": "Fan starts with a breath. Van starts with a buzz."
                hints:
                  - "Listen to the first sound."
                  - "Does it buzz or breathe?"
                  - "The word is van."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Listen. Which letter is missing at the end?"
                audio: { en: "Box." }
                frame: "bo_"
                options: ["x", "s", "k"]
                answer: ["x"]
                hints:
                  - "Say box slowly. Listen to the end."
                  - "Is it a click and a hiss together?"
                  - "It is the letter that looks like a cross."
              - id: l2-f3
                type: true_false
                text: "Does the card say this word?"
                say: "Listen. Does the card say this word?"
                audio: { en: "Jet." }
                show: { drawn: letter-card, text: "jet" }
                answer: true
                hints:
                  - "Point to each letter and say its sound."
                  - "Say the sounds again, faster, and push them together."
                  - "Yes, it says jet."
              - id: l2-f4
                type: fill_in_blank
                text: "Which letter starts the word?"
                say: "Listen. Which letter is missing at the start?"
                audio: { en: "Web." }
                frame: "_eb"
                options: ["w", "v", "u"]
                answer: ["w"]
                hints:
                  - "Say web slowly. What is the first sound?"
                  - "Your lips make a little circle."
                  - "It is the letter that looks like two pointy cups."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "fox" }
                options: ["fog", "fox", "fix"]
                answer: "fox"
                hints:
                  - "Listen to the middle and the end."
                  - "Is there a click and a hiss at the end?"
                  - "The word is fox."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "jug" }
                options: ["jog", "jug", "bug"]
                answer: "jug"
                hints: ["Listen to the start and the middle."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Listen. Which letter is missing at the end?"
                audio: { en: "Mix." }
                frame: "mi_"
                options: ["s", "x", "ck"]
                answer: ["x"]
                hints: ["Do you hear one sound or two at the end?"]
              - id: l2-s3
                type: true_false
                text: "Does the card say this word?"
                say: "Listen. Does the card say this word?"
                audio: { en: "Vet." }
                show: { drawn: letter-card, text: "net" }
                answer: false
                hints: ["Look at the first letter. Does it buzz?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Which letter starts the word?"
                say: "Listen. Which letter is missing at the start?"
                audio: { en: "Win." }
                frame: "_in"
                options: ["v", "w", "f"]
                answer: ["w"]
                hints: ["Do your lips make a circle at the start?"]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "wig" }
                options: ["wig", "big", "wag"]
                answer: "wig"
                hints: ["Listen to the start and the middle."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "vet" }
                options: ["van", "vet", "net"]
                answer: "vet"
              - id: l2-n2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Listen. Which letter is missing at the end?"
                audio: { en: "Fix." }
                frame: "fi_"
                options: ["x", "ck", "s"]
                answer: ["x"]
              - id: l2-n3
                type: true_false
                text: "Does the card say this word?"
                say: "Listen. Does the card say this word?"
                audio: { en: "Jog." }
                show: { drawn: letter-card, text: "jog" }
                answer: true
              - id: l2-n4
                type: fill_in_blank
                text: "Which letter starts the word?"
                say: "Listen. Which letter is missing at the start?"
                audio: { en: "Jug." }
                frame: "_ug"
                options: ["d", "j", "h"]
                answer: ["j"]
              - id: l2-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "box" }
                options: ["fox", "bus", "box"]
                answer: "box"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: sound-letter
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.ks }
            options: ["s", "ck", "x"]
            answer: "x"
          - id: l2-c2
            part: sound-in-word
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "w" }
            options: [{ object: jumper }, { object: web }, { object: fox }]
            answer: web
          - id: l2-c3
            part: read-words
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "jet" }
            options: ["get", "jet", "net"]
            answer: "jet"
          - id: l2-c4
            part: letter-in-word
            type: fill_in_blank
            text: "Which letter starts the word?"
            say: "Listen. Which letter is missing at the start?"
            audio: { en: "Van." }
            frame: "_an"
            options: ["f", "v", "w"]
            answer: ["v"]
          - id: l2-c5
            part: sound-letter
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.j }
            options: ["g", "j", "w"]
            answer: "j"
          - id: l2-c6
            part: sound-in-word
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "v" }
            options: [{ object: fox }, { object: web }, { object: vase }]
            answer: vase
          - id: l2-c7
            part: read-words
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "wax" }
            options: ["wag", "wax", "wig"]
            answer: "wax"
          - id: l2-c8
            part: letter-in-word
            type: fill_in_blank
            text: "Which letter starts the word?"
            say: "Listen. Which letter is missing at the start?"
            audio: { en: "Vet." }
            frame: "_et"
            options: ["w", "f", "v"]
            answer: ["v"]
          - id: l2-c9
            part: sound-letter
            type: true_false
            text: "Does this letter make this sound?"
            say: "Listen. Does this letter make this sound?"
            audio: { sound: en.f }
            show: { drawn: letter-card, text: "v" }
            answer: false
          - id: l2-c10
            part: sound-in-word
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "w" }
            options: [{ object: van }, { object: worm }, { object: fish }]
            answer: worm
          - id: l2-c11
            part: read-words
            type: true_false
            text: "Does the card say this word?"
            say: "Listen. Does the card say this word?"
            audio: { en: "Jam." }
            show: { drawn: letter-card, text: "jam" }
            answer: true
          - id: l2-c12
            part: letter-in-word
            type: fill_in_blank
            text: "What is missing?"
            say: "Listen. What is missing at the start and at the end?"
            audio: { en: "Six." }
            frame: "_i_"
            options: ["x", "f", "ck", "s"]
            answer: ["s", "x"]
          - id: l2-c13
            part: sound-letter
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.w }
            options: ["v", "x", "j", "w"]
            answer: "w"
          - id: l2-c14
            part: sound-in-word
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "j" }
            options: [{ object: goat }, { object: jacket }, { object: duck }]
            answer: jacket
          - id: l2-c15
            part: read-words
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word. Which picture is it?"
            show: { drawn: letter-card, text: "jug" }
            options: [{ object: juice }, { object: jumper }, { object: jug }]
            answer: jug
            option_audio: false
          - id: l2-c16
            part: letter-in-word
            type: fill_in_blank
            text: "Which letter starts the word?"
            say: "Listen. Which letter is missing at the start?"
            audio: { en: "Jam." }
            frame: "_am"
            options: ["g", "j", "d"]
            answer: ["j"]
          - id: l2-c17
            part: sound-letter
            type: true_false
            text: "Does this letter make this sound?"
            say: "Listen. Does this letter make this sound?"
            audio: { sound: en.ks }
            show: { drawn: letter-card, text: "x" }
            answer: true
          - id: l2-c18
            part: sound-in-word
            type: true_false
            text: "Does the word end with this letter?"
            say: "Listen. Does the word end with this letter?"
            audio: { en: "Sock." }
            show: { drawn: letter-card, text: "x" }
            answer: false
          - id: l2-c19
            part: read-words
            type: highlight_in_text
            text: "Tap every card that says the word you hear."
            say: "Listen. Read the cards and tap every card that says this word."
            audio: { en: "Fix." }
            show: { drawn: letter-card, text: "fix fox six fix mix" }
            spans: ["fix"]
          - id: l2-c20
            part: letter-in-word
            type: fill_in_blank
            text: "Which letter starts the word?"
            say: "Listen. Which letter is missing at the start?"
            audio: { en: "Wig." }
            frame: "_ig"
            options: ["v", "w", "b"]
            answer: ["w"]
