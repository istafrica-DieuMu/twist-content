# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.follow-instructions
skill: lit-en.speaking.follow-instructions
curriculum: en-GB
language: en
title:
  de: Anweisungen mit mehreren Schritten folgen
  en: Following instructions with several steps
summary: >
  Following spoken instructions with more than one idea or action.
  Lesson 1 listens for the two words that matter (the blue ball, not the
  blue crayon) and for two steps in a row (stand up, then clap); lesson
  2 follows three steps with first, then and last, works out the order
  when an instruction says before or after, and ends with the skill
  check. Every instruction is spoken; the child answers by tapping the
  right thing or putting action pictures in order. Saying the steps back
  aloud runs as speak tasks, practised and not marked.
metadata:
  year: reception
  topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.speaking.listen-respond]
  also_practises: [lit-en.speaking.listen-respond]
  vocabulary: { en: [instruction, step, first, then, last, before, after] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: two-words, what: { de: "auf zwei wichtige Wörter hören (der blaue Ball)", en: "listening for two important words (the blue ball)" } }
    - { id: steps-order, what: { de: zwei oder drei Schritte in der richtigen Reihenfolge machen, en: doing two or three steps in the right order } }
    - { id: before-after, what: { de: "mit before und after die Reihenfolge herausfinden", en: working out the order when an instruction says before or after } }
    - { id: every-step, what: { de: "an jeden Schritt denken (wie viele Schritte, welcher fehlt)", en: "keeping every step in mind (how many steps, which one is missing)" } }
  misconceptions:
    - id: one-detail
      what: Acts on the first word that sounds right (blue) and misses the second (ball)
      addressed: Learn in lesson 1 names both words; every colour task offers a thing that matches only the colour or only the object (l1-f1 with feedback, l1-f3, l1-s1, l1-s4, l1-n1, l1-n5, l1-c1, l2-w1, l2-s5, l2-n5 and the skill check task l2-c1)
    - id: first-step-only
      what: Does the first step and forgets the rest
      addressed: Learn in both lessons counts the steps on fingers; how-many-steps tasks l1-f5, l1-n3, l1-c3, l2-f3 and l2-c4; true/false stories where a step is missed (l1-s3, l2-f5)
    - id: order-as-heard
      what: "With before or after, does the steps in the order the words were heard (Before you sit down, wave: sits first)"
      addressed: Learn in lesson 2 turns before and after into first and then; l2-f2, l2-s1, l2-s3, l2-n2, l2-n4 and l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zwei Dinge, zwei Schritte", en: "Two words, two steps" }
    goal:
      de: "Hör dir die ganze Anweisung an und mach zwei Dinge nacheinander, so wie aufstehen und dann klatschen."
      en: "Listen to the whole instruction, then do two things in order, like stand up, then clap."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "What should you do?"
            say: "Listen. What should you do? Tap the picture."
            audio: { en: "Please wave hello." }
            options: [{ object: clap }, { object: wave }, { object: jump }]
            answer: wave
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Which question?"
            say: "Listen to your friend. Which question could you ask?"
            audio: { en: "I've got a new kite!", speaker: female }
            options: ["I am five.", "What colour is it?", "Bye!"]
            answer: "What colour is it?"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Two important words"
            say: "Some instructions have two important words. Get the blue ball: blue, and ball. Not the red ball. Not the blue crayon. The blue ball."
            show: { object: ball, colour: blue }
          - text: "Two steps"
            say: "Some instructions have two steps. Stand up, then clap. Count the steps on your fingers: one, stand up. Two, clap."
            show: { objects: [stand-up, clap] }
          - text: "Wait for the end"
            say: "Listen to the whole instruction before you start. Then do the steps in order."
            show: { object: listen }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "What should you get?"
                say: "Listen. What should you get? Tap it."
                audio: { en: "Get the blue ball, please." }
                options:
                  - { object: ball, colour: red, key: ball-red }
                  - { object: crayon, colour: blue, key: crayon-blue }
                  - { object: ball, colour: blue, key: ball-blue }
                answer: ball-blue
                feedback:
                  crayon-blue: "That is blue, but it is a crayon. Listen for both words: blue, and ball."
                hints:
                  - "Listen for two important words."
                  - "The colour is blue. What is the thing?"
                  - "The blue ball."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "Stand up, then clap." }
                options: [{ object: clap }, { object: stand-up }]
                slot_count: 2
                answer: [stand-up, clap]
                hints:
                  - "What do you do first?"
                  - "First stand up."
                  - "Stand up, then clap."
              - id: l1-f3
                type: audio_choice
                text: "What should you get?"
                say: "Listen. What should you get? Tap it."
                audio: { en: "Please get the red balloon." }
                options:
                  - { object: balloon, colour: green, key: balloon-green }
                  - { object: balloon, colour: red, key: balloon-red }
                  - { object: ball, colour: red, key: ball-red }
                answer: balloon-red
                hints:
                  - "Listen for the colour and the thing."
                  - "Red, and a balloon."
                  - "The red balloon."
              - id: l1-f4
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "Sit down, then wave." }
                options: [{ object: wave }, { object: sit-down }]
                slot_count: 2
                answer: [sit-down, wave]
                hints:
                  - "Which step did you hear first?"
                  - "First sit down."
                  - "Sit down, then wave."
              - id: l1-f5
                type: multiple_choice
                text: "How many steps?"
                say: "Listen. How many steps is that?"
                audio: { en: "Touch your nose, then jump." }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Count on your fingers as you listen."
                  - "Touch your nose is one."
                  - "Touch your nose, jump: 2 steps."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "What should you find?"
                say: "Listen. What should you find? Tap it."
                audio: { en: "Find the yellow car." }
                options:
                  - { object: car, colour: blue, key: car-blue }
                  - { object: ball, colour: yellow, key: ball-yellow }
                  - { object: car, colour: yellow, key: car-yellow }
                answer: car-yellow
                hints: ["Listen for the colour and the thing."]
              - id: l1-s2
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "Clap, then point to the door." }
                options: [{ object: point }, { object: clap }]
                slot_count: 2
                answer: [clap, point]
                hints: ["Which step comes first?"]
              - id: l1-s3
                type: true_false
                text: "Get your shoes, then line up. Tom lines up but forgets his shoes. Did Tom do it?"
                say: "Mrs Patel says: Get your shoes, then line up. Tom lines up, but forgets his shoes. Did Tom follow the instruction?"
                show: { object: shoe }
                answer: false
                hints: ["How many steps were there? Did Tom do both?"]
              - id: l1-s4
                type: audio_choice
                text: "What should you get?"
                say: "Listen. What should you get? Tap it."
                audio: { en: "Please get the green crayon." }
                options:
                  - { object: crayon, colour: red, key: crayon-red }
                  - { object: crayon, colour: green, key: crayon-green }
                  - { object: ball, colour: green, key: ball-green }
                answer: crayon-green
                hints: ["Green, and which thing?"]
              - id: l1-s5
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "Jump, then sit down." }
                options: [{ object: sit-down }, { object: jump }]
                slot_count: 2
                answer: [jump, sit-down]
                hints: ["Which step did you hear first?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "What should you pick up?"
                say: "Listen. What should you pick up? Tap it."
                audio: { en: "Pick up the purple ball." }
                options:
                  - { object: balloon, colour: purple, key: balloon-purple }
                  - { object: ball, colour: purple, key: ball-purple }
                  - { object: ball, colour: blue, key: ball-blue }
                answer: ball-purple
              - id: l1-n2
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "Wave, then clap." }
                options: [{ object: clap }, { object: wave }]
                slot_count: 2
                answer: [wave, clap]
              - id: l1-n3
                type: multiple_choice
                text: "How many steps?"
                say: "Listen. How many steps is that?"
                audio: { en: "Get your coat, put on your hat, then line up." }
                options: ["1", "2", "3"]
                answer: "3"
              - id: l1-n4
                type: true_false
                text: "Wash your hands, then sit at the table. Ava washes her hands, then sits at the table. Did Ava do it?"
                say: "Dad says: Wash your hands, then sit at the table. Ava washes her hands, then sits at the table. Did Ava follow the instruction?"
                show: { object: table }
                answer: true
              - id: l1-n5
                type: audio_choice
                text: "What should you find?"
                say: "Listen. What should you find? Tap it."
                audio: { en: "Find the red car." }
                options:
                  - { object: balloon, colour: red, key: balloon-red }
                  - { object: car, colour: green, key: car-green }
                  - { object: car, colour: red, key: car-red }
                answer: car-red

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "What should you get?"
            say: "Listen. What should you get?"
            audio: { en: "Get the blue balloon." }
            options:
              - { object: ball, colour: blue, key: ball-blue }
              - { object: balloon, colour: blue, key: balloon-blue }
              - { object: balloon, colour: pink, key: balloon-pink }
            answer: balloon-blue
          - id: l1-c2
            type: ordering
            text: "Put the steps in order."
            say: "Listen. Then put the pictures in order."
            audio: { en: "Stand up, then jump." }
            options: [{ object: jump }, { object: stand-up }]
            slot_count: 2
            answer: [stand-up, jump]
          - id: l1-c3
            type: multiple_choice
            text: "How many steps?"
            say: "Listen. How many steps is that?"
            audio: { en: "Point to the window, then sit down." }
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c4
            type: audio_choice
            text: "What should you find?"
            say: "Listen. What should you find?"
            audio: { en: "Find the yellow jumper." }
            options:
              - { object: dress, colour: yellow, key: dress-yellow }
              - { object: jumper, colour: red, key: jumper-red }
              - { object: jumper, colour: yellow, key: jumper-yellow }
            answer: jumper-yellow
          - id: l1-c5
            type: true_false
            text: "Put your cup in the sink, then sit down. Zoe sits down first, then puts her cup in the sink. Did Zoe do it?"
            say: "Mum says: Put your cup in the sink, then sit down. Zoe sits down first, then puts her cup in the sink. Did Zoe follow the instruction?"
            show: { object: cup }
            answer: false
          - id: l1-c6
            type: ordering
            text: "Put the steps in order."
            say: "Listen. Then put the pictures in order."
            audio: { en: "Look at me, then wave." }
            options: [{ object: wave }, { object: look }]
            slot_count: 2
            answer: [look, wave]

  - n: 2
    title: { de: "Zuerst, dann, zuletzt", en: "First, then, last" }
    goal:
      de: "Mach drei Schritte der Reihe nach, so wie zuerst aufstehen, dann klatschen und zuletzt hinsetzen."
      en: "Do three steps in the right order, like first stand up, then clap, last sit down."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "What should you get?"
            say: "Listen. What should you get? Tap it."
            audio: { en: "Get the green ball, please." }
            options:
              - { object: ball, colour: green, key: ball-green }
              - { object: crayon, colour: green, key: crayon-green }
              - { object: ball, colour: yellow, key: ball-yellow }
            answer: ball-green
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Put the steps in order."
            say: "Listen. Then put the pictures in order."
            audio: { en: "Clap, then wave." }
            options: [{ object: wave }, { object: clap }]
            slot_count: 2
            answer: [clap, wave]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "First, then, last"
            say: "Some instructions have three steps. First, stand up. Then, clap. Last, sit down. Count them on your fingers: one, two, three."
            show: { objects: [stand-up, sit-down] }
          - text: "Before and after"
            say: "Listen out for before and after. Before you sit down, wave: so first you wave, then you sit down. After you jump, clap: so first you jump, then you clap."
            show: { objects: [jump, clap] }
          - text: "Say it back"
            say: "To remember the steps, say them back quietly to yourself. If you forget, ask: Can you say it again, please?"
            show: { object: listen }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "First stand up, then clap, last sit down." }
                options: [{ object: sit-down }, { object: clap }, { object: stand-up }]
                slot_count: 3
                answer: [stand-up, clap, sit-down]
                hints:
                  - "Listen for first, then and last."
                  - "First stand up. What then?"
                  - "Stand up, clap, sit down."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "Before you sit down, wave." }
                options: [{ object: sit-down }, { object: wave }]
                slot_count: 2
                answer: [wave, sit-down]
                hints:
                  - "Before you sit down, something else comes first."
                  - "What do you do before you sit?"
                  - "Wave first, then sit down."
              - id: l2-f3
                type: multiple_choice
                text: "How many steps?"
                say: "Listen. How many steps is that?"
                audio: { en: "Wash your hands, dry them, then sit down for lunch." }
                options: ["2", "3", "4"]
                answer: "3"
                hints:
                  - "Count on your fingers."
                  - "Wash is one, dry is two."
                  - "Wash, dry, sit down: 3 steps."
              - id: l2-f4
                type: speak
                text: "Say the steps back: first jump, then clap, last sit down."
                say: "Say the steps back to help you remember. Say: First jump, then clap, last sit down."
                show: { objects: [jump, clap] }
                expected_text: "First jump, then clap, last sit down."
                hints:
                  - "Start with First."
                  - "Next, say what comes then, and what comes last."
                  - "First jump, then clap, last sit down."
              - id: l2-f5
                type: true_false
                text: "Get your book, sit on the carpet, then listen. Mia sits and listens, but forgets her book. Did Mia do all the steps?"
                say: "The teacher says: Get your book, sit on the carpet, then listen. Mia sits on the carpet and listens, but forgets her book. Did Mia do all the steps?"
                show: { object: book-open }
                answer: false
                hints:
                  - "How many steps were there?"
                  - "What did Mia forget?"
                  - "No. She forgot her book."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "After you clap, jump." }
                options: [{ object: jump }, { object: clap }]
                slot_count: 2
                answer: [clap, jump]
                hints: ["After you clap means clap comes first."]
              - id: l2-s2
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "First wave, then point, last clap." }
                options: [{ object: clap }, { object: wave }, { object: point }]
                slot_count: 3
                answer: [wave, point, clap]
                hints: ["Listen for first, then and last."]
              - id: l2-s3
                type: multiple_choice
                text: "What do you do first?"
                say: "Listen. What do you do first?"
                audio: { en: "Before you go outside, put on your wellies." }
                options: ["go outside", "put on your wellies"]
                answer: "put on your wellies"
                hints: ["Before you go outside means something else comes first."]
              - id: l2-s4
                type: speak
                text: "Say the steps back: first get my coat, then line up at the door."
                say: "Say the steps back. Say: First get my coat, then line up at the door."
                show: { object: jacket }
                expected_text: "First get my coat, then line up at the door."
                hints: ["Start with First."]
              - id: l2-s5
                type: audio_choice
                text: "What should you get?"
                say: "Listen. What should you get? Tap it."
                audio: { en: "Please get the brown ball." }
                options:
                  - { object: ball, colour: yellow, key: ball-yellow }
                  - { object: car, colour: brown, key: car-brown }
                  - { object: ball, colour: brown, key: ball-brown }
                answer: ball-brown
                hints: ["Brown, and which thing?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "First jump, then wave, last sit down." }
                options: [{ object: wave }, { object: sit-down }, { object: jump }]
                slot_count: 3
                answer: [jump, wave, sit-down]
              - id: l2-n2
                type: ordering
                text: "Put the steps in order."
                say: "Listen. Then put the pictures in order."
                audio: { en: "Before you clap, stand up." }
                options: [{ object: clap }, { object: stand-up }]
                slot_count: 2
                answer: [stand-up, clap]
              - id: l2-n3
                type: multiple_choice
                text: "Which step is last?"
                say: "Listen. Which step is last?"
                audio: { en: "First touch your toes, then clap, last wave." }
                options: ["touch your toes", "clap", "wave"]
                answer: "wave"
              - id: l2-n4
                type: true_false
                text: "Before you eat, wash your hands. Leo eats, then washes his hands. Did Leo do it?"
                say: "Mum says: Before you eat, wash your hands. Leo eats, then washes his hands. Did Leo follow the instruction?"
                show: { object: hand }
                answer: false
              - id: l2-n5
                type: audio_choice
                text: "What should you get?"
                say: "Listen. What should you get? Tap it."
                audio: { en: "Get the pink balloon, please." }
                options:
                  - { object: crayon, colour: pink, key: crayon-pink }
                  - { object: balloon, colour: pink, key: balloon-pink }
                  - { object: balloon, colour: purple, key: balloon-purple }
                answer: balloon-pink

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: two-words
            type: audio_choice
            text: "What should you get?"
            say: "Listen. What should you get?"
            audio: { en: "Get the green balloon." }
            options:
              - { object: balloon, colour: red, key: balloon-red }
              - { object: ball, colour: green, key: ball-green }
              - { object: balloon, colour: green, key: balloon-green }
            answer: balloon-green
          - id: l2-c2
            part: steps-order
            type: ordering
            text: "Put the steps in order."
            say: "Listen. Then put the pictures in order."
            audio: { en: "First clap, then jump, last wave." }
            options: [{ object: jump }, { object: wave }, { object: clap }]
            slot_count: 3
            answer: [clap, jump, wave]
          - id: l2-c3
            part: before-after
            type: ordering
            text: "Put the steps in order."
            say: "Listen. Then put the pictures in order."
            audio: { en: "After you stand up, wave." }
            options: [{ object: wave }, { object: stand-up }]
            slot_count: 2
            answer: [stand-up, wave]
          - id: l2-c4
            part: every-step
            type: multiple_choice
            text: "How many steps?"
            say: "Listen. How many steps is that?"
            audio: { en: "Get your plate, put it by the sink, then wash your hands." }
            options: ["2", "3", "4"]
            answer: "3"
          - id: l2-c5
            part: every-step
            type: true_false
            text: "First get your bag, then put on your coat. Sam gets his bag, then puts on his coat. Did Sam do it?"
            say: "Dad says: First get your bag, then put on your coat. Sam gets his bag, then puts on his coat. Did Sam follow the instruction?"
            show: { object: schoolbag }
            answer: true
          - id: l2-c6
            part: two-words
            type: audio_choice
            text: "What should you find?"
            say: "Listen. What should you find?"
            audio: { en: "Find the red skirt." }
            options:
              - { object: skirt, colour: blue, key: skirt-blue }
              - { object: skirt, colour: red, key: skirt-red }
              - { object: dress, colour: red, key: dress-red }
            answer: skirt-red
          - id: l2-c7
            part: steps-order
            type: ordering
            text: "Put the steps in order."
            say: "Listen. Then put the pictures in order."
            audio: { en: "First look, then listen, last clap." }
            options: [{ object: clap }, { object: listen }, { object: look }]
            slot_count: 3
            answer: [look, listen, clap]
          - id: l2-c8
            part: before-after
            type: ordering
            text: "Put the steps in order."
            say: "Listen. Then put the pictures in order."
            audio: { en: "Before you jump, clap." }
            options: [{ object: jump }, { object: clap }]
            slot_count: 2
            answer: [clap, jump]
          - id: l2-c9
            part: every-step
            type: multiple_choice
            text: "How many steps?"
            say: "Listen. How many steps is that?"
            audio: { en: "Get your cup, then drink your milk." }
            options: ["2", "3", "4"]
            answer: "2"
          - id: l2-c10
            part: two-words
            type: audio_choice
            text: "What should you get?"
            say: "Listen. What should you get?"
            audio: { en: "Please get the green jacket." }
            options:
              - { object: jumper, colour: green, key: jumper-green }
              - { object: jacket, colour: green, key: jacket-green }
              - { object: jacket, colour: yellow, key: jacket-yellow }
            answer: jacket-green
          - id: l2-c11
            part: steps-order
            type: ordering
            text: "Put the steps in order."
            say: "Listen. Then put the pictures in order."
            audio: { en: "Point to the door, then sit down." }
            options: [{ object: sit-down }, { object: point }]
            slot_count: 2
            answer: [point, sit-down]
          - id: l2-c12
            part: before-after
            type: multiple_choice
            text: "What do you do first?"
