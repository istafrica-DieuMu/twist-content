# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.rhymes
skill: lit-en.phonological.rhymes
curriculum: en-GB
language: en
title:
  de: Reime hören
  en: Hearing rhymes
summary: >
  Before phonics, children tune their ears. They hear whether two words
  rhyme (cat, hat) and find rhyming words. Lesson 1 judges pairs; lesson 2
  finds the rhyme, pairs rhyming pictures, spots the word that does not
  rhyme, and ends with the skill check. Nothing to read: every prompt is
  spoken and every picture says its word.
metadata:
  year: reception
  topic: { de: Laute hören, en: Hearing sounds }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: []
  vocabulary: { en: [rhyme, the end of the word, the same, different] }
  no_reading: true
  forms: [picture, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: same-start
      what: Takes words that start the same (cat, car) for rhymes
      addressed: Learn says rhymes sound the same at the end; options put a same-start word next to the rhyme
    - id: meaning
      what: Pairs words by meaning (sock, shoe) instead of sound
      addressed: options put a meaning partner next to the rhyme; hints say "Listen to the end of the word."
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Reimt sich das?", en: "Does it rhyme?" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Cat and hat. Listen: cat, hat. They sound the same at the end: at. Cat and hat rhyme."
            show: { objects: [cat, hat] }
          - say: "Moon and spoon. Moon, spoon. They both end with oon. They rhyme too."
            show: { objects: [moon, spoon] }
          - say: "Cat and dog. Cat, dog. The ends sound different. Cat and dog do not rhyme."
            show: { objects: [cat, dog] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Do they rhyme?"
                say: "Dog, frog. Do they rhyme?"
                show: { objects: [dog, frog] }
                answer: true
                hints:
                  - "Say both words slowly."
                  - "Listen to the end: dog, frog."
                  - "They both end with og. Yes, they rhyme."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Do they rhyme?"
                say: "Sun, ball. Do they rhyme?"
                show: { objects: [sun, ball] }
                answer: false
                hints:
                  - "Say both words slowly."
                  - "Listen to the end: sun, ball."
                  - "The ends sound different. No, they don't rhyme."
              - id: l1-f3
                type: image_multiple_choice
                text: "What rhymes with mouse?"
                say: "Mouse. What rhymes with mouse?"
                show: { object: mouse }
                options: [{ object: house }, { object: cat }, { object: moon }]
                answer: house
                feedback:
                  cat: "Cat and mouse are both animals, but they don't rhyme. Listen to the end."
                  moon: "Moon starts like mouse, but the end is different."
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Mouse ends with ouse. Which word ends the same way?"
                  - "Mouse, house. House rhymes."
              - id: l1-f4
                type: true_false
                text: "Do they rhyme?"
                say: "Rose, nose. Do they rhyme?"
                show: { objects: [rose, nose] }
                answer: true
                hints:
                  - "Say both words."
                  - "Listen to the end: rose, nose."
                  - "They both end with ose. Yes, they rhyme."
              - id: l1-f5
                type: image_multiple_choice
                text: "What rhymes with car?"
                say: "Car. What rhymes with car?"
                show: { object: car }
                options: [{ object: cat }, { object: star }, { object: bus }]
                answer: star
                hints:
                  - "Listen to each word."
                  - "Car ends with ar."
                  - "Car, star. Star rhymes."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Do they rhyme?"
                say: "Leg, egg. Do they rhyme?"
                show: { objects: [leg, egg] }
                answer: true
                hints: ["Listen to the end: leg, egg."]
              - id: l1-s2
                type: true_false
                text: "Do they rhyme?"
                say: "Sock, shoe. Do they rhyme?"
                show: { objects: [sock, shoe] }
                answer: false
                hints: ["They go together, but do the ends sound the same?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "What rhymes with tree?"
                say: "Tree. What rhymes with tree?"
                show: { object: tree }
                options: [{ object: leaf }, { object: bee }, { object: table }]
                answer: bee
                hints: ["Tree ends with ee."]
              - id: l1-s4
                type: true_false
                text: "Do they rhyme?"
                say: "Boat, goat. Do they rhyme?"
                show: { objects: [boat, goat] }
                answer: true
                hints: ["Say both words slowly."]
              - id: l1-s5
                type: image_multiple_choice
                text: "What rhymes with bell?"
                say: "Bell. What rhymes with bell?"
                show: { object: bell }
                options: [{ object: shell }, { object: ball }, { object: bed }]
                answer: shell
                hints: ["Bell ends with ell."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Do they rhyme?"
                say: "Bread, bed. Do they rhyme?"
                show: { objects: [bread, bed] }
                answer: true
              - id: l1-n2
                type: true_false
                text: "Do they rhyme?"
                say: "Duck, cup. Do they rhyme?"
                show: { objects: [duck, cup] }
                answer: false
              - id: l1-n3
                type: image_multiple_choice
                text: "What rhymes with sock?"
                say: "Sock. What rhymes with sock?"
                show: { object: sock }
                options: [{ object: shoe }, { object: clock }, { object: sun }]
                answer: clock
              - id: l1-n4
                type: true_false
                text: "Do they rhyme?"
                say: "Moon, spoon. Do they rhyme?"
                show: { objects: [spoon, moon] }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "What rhymes with frog?"
                say: "Frog. What rhymes with frog?"
                show: { object: frog }
                options: [{ object: fish }, { object: dog }, { object: duck }]
                answer: dog

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: true_false
            text: "Do they rhyme?"
            say: "Cat, hat. Do they rhyme?"
            show: { objects: [hat, cat] }
            answer: true
          - id: l1-c2
            type: image_multiple_choice
            text: "What rhymes with nose?"
            say: "Nose. What rhymes with nose?"
            show: { object: nose }
            options: [{ object: ear }, { object: rose }, { object: hand }]
            answer: rose
          - id: l1-c3
            type: true_false
            text: "Do they rhyme?"
            say: "Car, cat. Do they rhyme?"
            show: { objects: [car, cat] }
            answer: false

  - n: 2
    title: { de: Reimwörter finden, en: Finding rhymes }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Rhymes come in pairs. Cat and hat go together. So do moon and spoon."
            show: { objects: [moon, spoon] }
          - say: "Now there are three words: dog, frog, sun. Two of them rhyme and one does not. Dog and frog rhyme. Sun is the odd one out."
            show: { objects: [dog, frog, sun] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "What rhymes?"
                say: "Tap a picture, then tap the picture that rhymes with it."
                pairs:
                  - left: { object: cat }
                    right: { object: hat }
                  - left: { object: mouse }
                    right: { object: house }
                  - left: { object: leg }
                    right: { object: egg }
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Cat and hat end the same. What about mouse?"
                  - "Cat, hat. Mouse, house. Leg, egg."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Which one doesn't rhyme?"
                say: "Two of these rhyme and one doesn't. Which one doesn't rhyme?"
                options: [{ object: car }, { object: star }, { object: bus }]
                answer: bus
                hints:
                  - "Listen to all three words."
                  - "Car and star end the same."
                  - "Bus is the odd one out."
              - id: l2-f3
                type: image_multiple_choice
                text: "What rhymes with goat?"
                say: "Goat. What rhymes with goat?"
                show: { object: goat }
                options: [{ object: cow }, { object: boat }, { object: bed }]
                answer: boat
                hints:
                  - "Listen to each word."
                  - "Goat ends with oat."
                  - "Goat, boat."
              - id: l2-f4
                type: matching
                text: "What rhymes?"
                say: "Tap a picture, then tap the picture that rhymes with it."
                pairs:
                  - left: { object: tree }
                    right: { object: bee }
                  - left: { object: bell }
                    right: { object: shell }
                  - left: { object: sock }
                    right: { object: clock }
                hints:
                  - "Start with one picture and listen to the end."
                  - "Tree ends with ee. Which word does too?"
                  - "Tree, bee. Bell, shell. Sock, clock."
              - id: l2-f5
                type: image_multiple_choice
                text: "Which one doesn't rhyme?"
                say: "Two of these rhyme and one doesn't. Which one doesn't rhyme?"
                options: [{ object: rose }, { object: hand }, { object: nose }]
                answer: hand
                hints:
                  - "Listen to all three words."
                  - "Rose and nose end the same."
                  - "Hand is the odd one out."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "What rhymes?"
                say: "Tap a picture, then tap the picture that rhymes with it."
                pairs:
                  - left: { object: dog }
                    right: { object: frog }
                  - left: { object: bread }
                    right: { object: bed }
                  - left: { object: car }
                    right: { object: star }
                hints: ["Listen to the end of each word."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which one doesn't rhyme?"
                say: "Two of these rhyme and one doesn't. Which one doesn't rhyme?"
                options: [{ object: moon }, { object: spoon }, { object: mouse }]
                answer: mouse
                hints: ["Mouse starts like moon. But how does it end?"]
              - id: l2-s3
                type: image_multiple_choice
                text: "What rhymes with hat?"
                say: "Hat. What rhymes with hat?"
                show: { object: hat }
                options: [{ object: cat }, { object: hand }, { object: sun }]
                answer: cat
                hints: ["Hat ends with at."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Which one doesn't rhyme?"
                say: "Two of these rhyme and one doesn't. Which one doesn't rhyme?"
                options: [{ object: egg }, { object: leg }, { object: cup }]
                answer: cup
                hints: ["Leg and egg end the same."]
              - id: l2-s5
                type: image_multiple_choice
                text: "What rhymes with bed?"
                say: "Bed. What rhymes with bed?"
                show: { object: bed }
                options: [{ object: bread }, { object: ball }, { object: bee }]
                answer: bread
                hints: ["Bed ends with ed."]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "What rhymes?"
                say: "Tap a picture, then tap the picture that rhymes with it."
                pairs:
                  - left: { object: house }
                    right: { object: mouse }
                  - left: { object: goat }
                    right: { object: boat }
                  - left: { object: nose }
                    right: { object: rose }
              - id: l2-n2
                type: image_multiple_choice
                text: "Which one doesn't rhyme?"
                say: "Two of these rhyme and one doesn't. Which one doesn't rhyme?"
                options: [{ object: clock }, { object: sock }, { object: shoe }]
                answer: shoe
              - id: l2-n3
                type: image_multiple_choice
                text: "What rhymes with star?"
                say: "Star. What rhymes with star?"
                show: { object: star }
                options: [{ object: sun }, { object: moon }, { object: car }]
                answer: car
              - id: l2-n4
                type: image_multiple_choice
                text: "Which one doesn't rhyme?"
                say: "Two of these rhyme and one doesn't. Which one doesn't rhyme?"
                options: [{ object: bee }, { object: duck }, { object: tree }]
                answer: duck
              - id: l2-n5
                type: matching
                text: "What rhymes?"
                say: "Tap a picture, then tap the picture that rhymes with it."
                pairs:
                  - left: { object: shell }
                    right: { object: bell }
                  - left: { object: spoon }
                    right: { object: moon }
                  - left: { object: hat }
                    right: { object: cat }

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: true_false
            text: "Do they rhyme?"
            say: "Goat, boat. Do they rhyme?"
            show: { objects: [goat, boat] }
            answer: true
          - id: l2-c2
            type: true_false
            text: "Do they rhyme?"
            say: "Bed, bus. Do they rhyme?"
            show: { objects: [bed, bus] }
            answer: false
          - id: l2-c3
            type: image_multiple_choice
            text: "What rhymes with egg?"
            say: "Egg. What rhymes with egg?"
            show: { object: egg }
            options: [{ object: apple }, { object: leg }, { object: duck }]
            answer: leg
          - id: l2-c4
            type: image_multiple_choice
            text: "Which one doesn't rhyme?"
            say: "Two of these rhyme and one doesn't. Which one doesn't rhyme?"
            options: [{ object: frog }, { object: dog }, { object: fish }]
            answer: fish
