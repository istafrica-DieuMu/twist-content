# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.full-sentences
skill: lit-en.speaking.full-sentences
curriculum: en-GB
language: en
title:
  de: In ganzen Sätzen sprechen
  en: Talking in full sentences
summary: >
  Talking about ideas and feelings in full sentences, saying why with
  because, and using yesterday, today and tomorrow. Lesson 1 builds full
  sentences about pictures and feelings and finishes because sentences;
  lesson 2 talks about what happened, what is happening and what will
  happen, and ends with the skill check. Every sentence is spoken; the
  child chooses the sentence that is full, makes sense or fits the time.
  Saying their own sentences runs as speak tasks, practised and not
  marked.
metadata:
  year: reception
  topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: []
  vocabulary: { en: [full sentence, because, feel, yesterday, today, tomorrow, will] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: one-word-answers
      what: Answers with one word or a few words (Dog. Happy.) instead of a full sentence
      addressed: Learn in lesson 1 turns "happy" into "I feel happy"; the child picks the full sentence in l1-f1, l1-s1, l1-n1, l1-c1, l2-w2 and the skill check task l2-c1, judges a sentence in l1-s5 and l1-n5, and picks the sentence that says why in l2-s5
    - id: because-does-not-fit
      what: Joins two ideas with because when the second does not give the reason (I wear my coat because I like cake)
      addressed: Learn in lesson 1 says the words after because tell us why; l1-f3, l1-f5, l1-s3, l1-n3, l1-c3, l2-w1 and l2-c4
    - id: time-and-verb
      what: Uses the wrong form for the time (Yesterday I will go, Tomorrow I went)
      addressed: Learn in lesson 2 sets yesterday, today and tomorrow side by side; l2-f1 (with feedback), l2-f2, l2-f5, l2-s2, l2-n1, l2-n3, l2-c2 and l2-c3; the child hears the verb and says when in l2-f3, l2-s1 and l2-n2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ganze Sätze mit weil", en: "Full sentences with because" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "A full sentence"
            say: "When we talk, we can use full sentences. Instead of just saying happy, we say: I feel happy. A full sentence tells the whole idea."
            show: { object: happy }
          - text: "because"
            say: "We can say why with the word because. I feel happy because it is sunny. The words after because tell us why."
            show: { object: sun }
          - text: "Your turn"
            say: "Try it. Say how you feel. Then say because, and say why. I feel sleepy because I went to bed late."
            show: { object: tired }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Which is a full sentence?"
                say: "Look at the picture. Which one is a full sentence about it?"
                show: { object: dog }
                options: ["Dog.", "The dog is sitting down.", "Sitting dog down."]
                answer: "The dog is sitting down."
                hints:
                  - "A full sentence tells the whole idea."
                  - "Which one tells us who it is and what it is doing?"
                  - "The dog is sitting down."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "How does Tom feel?"
                say: "Listen. Tom says: I feel sad because my ice cream fell on the floor. How does Tom feel?"
                options: [{ object: happy }, { object: sad }, { object: angry }]
                answer: sad
                hints:
                  - "Listen for the word after I feel."
                  - "His ice cream fell on the floor."
                  - "Tom feels sad."
              - id: l1-f3
                type: multiple_choice
                text: "Which ending makes sense?"
                say: "I am wearing my coat because ... Which ending makes sense?"
                options: ["I like cake.", "it is cold.", "the cat is black."]
                answer: "it is cold."
                feedback:
                  "I like cake.": "That doesn't tell us why you wear a coat. The words after because say why."
                hints:
                  - "Why do people wear coats?"
                  - "Think about the weather."
                  - "Because it is cold."
              - id: l1-f4
                type: speak
                text: "How do you feel?"
                say: "Say a full sentence about how you feel today, and why. For example: I feel happy because I am playing."
                show: { object: happy }
                expected_text: "I feel happy because I am playing."
                hints:
                  - "Start with I feel."
                  - "Then say because, and why."
                  - "I feel happy because I am playing."
              - id: l1-f5
                type: multiple_choice
                text: "Why is Zara happy?"
                say: "Listen. Zara says: I am happy because my grandma is coming to visit. Why is Zara happy?"
                options: ["her grandma is coming", "it is raining", "she is tired"]
                answer: "her grandma is coming"
                hints:
                  - "Listen for the words after because."
                  - "Who is coming to visit?"
                  - "Her grandma is coming."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Which is a full sentence?"
                say: "Look at the picture. Which one is a full sentence about it?"
                show: { object: cat }
                options: ["Cat orange.", "Orange.", "The cat is orange."]
                answer: "The cat is orange."
                hints: ["Which one tells the whole idea?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "How does Mia feel?"
                say: "Listen. Mia says: I feel scared because there is a big storm. How does Mia feel?"
                options: [{ object: tired }, { object: happy }, { object: scared }]
                answer: scared
                hints: ["Listen for the word after I feel."]
              - id: l1-s3
                type: multiple_choice
                text: "Which ending makes sense?"
                say: "I am eating my lunch because ... Which ending makes sense?"
                options: ["I am hungry.", "the sky is blue.", "my shoes are red."]
                answer: "I am hungry."
                hints: ["Why do we eat?"]
              - id: l1-s4
                type: speak
                text: "Your favourite toy"
                say: "Tell me about your favourite toy in a full sentence. Say why. For example: My favourite toy is my teddy because he is soft."
                show: { object: teddy }
                expected_text: "My favourite toy is my teddy because he is soft."
                hints: ["Start with My favourite toy is."]
              - id: l1-s5
                type: true_false
                text: "Big red. Is that a full sentence?"
                say: "Listen. Big red. Is that a full sentence?"
                show: { object: car }
                answer: false
                hints: ["Does it tell us the whole idea? Who or what is big and red?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Which is a full sentence?"
                say: "Look at the picture. Which one is a full sentence about it?"
                show: { object: bird }
                options: ["Bird blue.", "Is the.", "The bird is blue."]
                answer: "The bird is blue."
              - id: l1-n2
                type: image_multiple_choice
                text: "How does Leo feel?"
                say: "Listen. Leo says: I feel angry because my tower fell down. How does Leo feel?"
                options: [{ object: angry }, { object: happy }, { object: tired }]
                answer: angry
              - id: l1-n3
                type: multiple_choice
                text: "Which ending makes sense?"
                say: "I put on my sun hat because ... Which ending makes sense?"
                options: ["it is bedtime.", "it is sunny.", "I have a cat."]
                answer: "it is sunny."
              - id: l1-n4
                type: speak
                text: "Someone in your family"
                say: "Say how someone in your family feels, and why. For example: My mum feels tired because she worked all day."
                show: { object: mum }
                expected_text: "My mum feels tired because she worked all day."
              - id: l1-n5
                type: true_false
                text: "I feel sleepy because it is late. Is that a full sentence?"
                say: "Listen. I feel sleepy because it is late. Is that a full sentence?"
                show: { object: tired }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Which is a full sentence?"
            say: "Which one is a full sentence about the picture?"
            show: { object: car }
            options: ["Car fast.", "The car is fast.", "Fast."]
            answer: "The car is fast."
          - id: l1-c2
            type: image_multiple_choice
            text: "How does Ava feel?"
            say: "Listen. Ava says: I feel happy because I won the race. How does Ava feel?"
            options: [{ object: sad }, { object: scared }, { object: happy }]
            answer: happy
          - id: l1-c3
            type: multiple_choice
            text: "Which ending makes sense?"
            say: "I am sleepy because ... Which ending makes sense?"
            options: ["it is very late.", "the grass is green.", "I like apples."]
            answer: "it is very late."

  - n: 2
    title: { de: "Gestern, heute, morgen", en: "Yesterday, today, tomorrow" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Which ending makes sense?"
            say: "I have got my umbrella because ... Which ending makes sense?"
            options: ["it is raining.", "I am happy.", "the cat is big."]
            answer: "it is raining."
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Which is a full sentence?"
            say: "Which one is a full sentence about the picture?"
            show: { object: fish }
            options: ["Fish water.", "The fish is swimming.", "Swimming."]
            answer: "The fish is swimming."
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Yesterday"
            say: "Yesterday has already happened. We say: Yesterday, I went to the park. I played on the swings."
            show: { object: park }
          - text: "Today"
            say: "Today is now. We say: Today, I am at school. I am painting."
            show: { object: paint }
          - text: "Tomorrow"
            say: "Tomorrow has not happened yet. We say: Tomorrow, I will go swimming."
            show: { object: swimming-pool }
          - text: "Clue words"
            say: "Listen for the clue words: yesterday, today, tomorrow. They tell you how to say the rest of the sentence. Yesterday, I went. Today, I am going. Tomorrow, I will go."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which sentence is right?"
                say: "Which sentence is right?"
                options: ["Yesterday, I will go to the park.", "Yesterday, I went to the park.", "Yesterday, I go to the park."]
                answer: "Yesterday, I went to the park."
                feedback:
                  "Yesterday, I will go to the park.": "Will go is for tomorrow. Yesterday has already happened, so we say went."
                hints:
                  - "Yesterday has already happened."
                  - "Listen for the word that tells us it is over."
                  - "Yesterday, I went to the park."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which sentence is right?"
                say: "Which sentence is right?"
                options: ["Tomorrow, I went swimming.", "Tomorrow, I will go swimming.", "Tomorrow, I swimmed."]
                answer: "Tomorrow, I will go swimming."
                hints:
                  - "Tomorrow has not happened yet."
                  - "For tomorrow we use will."
                  - "Tomorrow, I will go swimming."
              - id: l2-f3
                type: multiple_choice
                text: "When did it happen?"
                say: "Listen. I played football with Dad. When did it happen: yesterday, or tomorrow?"
                options: ["yesterday", "tomorrow"]
                answer: "yesterday"
                keep_order: true
                hints:
                  - "Listen to the word played."
                  - "Played means it has already happened."
                  - "Yesterday."
              - id: l2-f4
                type: speak
                text: "What did you do yesterday?"
                say: "Tell me something you did yesterday, in a full sentence. For example: Yesterday, I played with my friend."
                show: { object: park }
                expected_text: "Yesterday, I played with my friend."
                hints:
                  - "Start with Yesterday."
                  - "Say what you did: I played, I went, I saw."
                  - "Yesterday, I played with my friend."
              - id: l2-f5
                type: multiple_choice
                text: "Which sentence is right?"
                say: "Which sentence is right?"
                options: ["Today, I am painting.", "Today, I will painted.", "Today, I painting."]
                answer: "Today, I am painting."
                hints:
                  - "Today is now."
                  - "Now we say I am ..."
                  - "Today, I am painting."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "When will it happen?"
                say: "Listen. I will see Grandma. When will it happen: yesterday, or tomorrow?"
                options: ["yesterday", "tomorrow"]
                answer: "tomorrow"
                keep_order: true
                hints: ["Listen for the word will."]
              - id: l2-s2
                type: multiple_choice
                text: "Which sentence is right?"
                say: "Which sentence is right?"
                options: ["Last night, I will have pizza.", "Last night, I has pizza.", "Last night, I had pizza."]
                answer: "Last night, I had pizza."
                hints: ["Last night has already happened."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Where did Mia go?"
                say: "Listen. Mia says: Yesterday, I went swimming with my brother. Where did Mia go?"
                options: [{ object: library }, { object: swimming-pool }, { object: shop }]
                answer: swimming-pool
                hints: ["What did Mia do yesterday?"]
              - id: l2-s4
                type: speak
                text: "What will you do tomorrow?"
                say: "Tell me something you will do tomorrow, in a full sentence. For example: Tomorrow, I will play in the garden."
                show: { object: garden }
                expected_text: "Tomorrow, I will play in the garden."
                hints: ["Start with Tomorrow, I will."]
              - id: l2-s5
                type: multiple_choice
                text: "Which one says why?"
                say: "Which sentence says why?"
                options: ["I was happy.", "Birthday.", "I was happy because it was my birthday."]
                answer: "I was happy because it was my birthday."
                hints: ["Listen for the word because."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which sentence is right?"
                say: "Which sentence is right?"
                options: ["Tomorrow, I rode my bike.", "Tomorrow, I will ride my bike.", "Tomorrow, I riding my bike."]
                answer: "Tomorrow, I will ride my bike."
              - id: l2-n2
                type: multiple_choice
                text: "When is it happening?"
                say: "Listen. I am eating my breakfast. When is it happening?"
                options: ["right now", "yesterday", "tomorrow"]
                answer: "right now"
                keep_order: true
              - id: l2-n3
                type: multiple_choice
                text: "Which sentence is right?"
                say: "Which sentence is right?"
                options: ["Yesterday, I see a big dog.", "Yesterday, I will see a big dog.", "Yesterday, I saw a big dog."]
                answer: "Yesterday, I saw a big dog."
              - id: l2-n4
                type: speak
                text: "Today, and why"
                say: "Tell me about today, and say why. For example: Today, I am happy because I am going to the park."
                show: { object: happy }
                expected_text: "Today, I am happy because I am going to the park."
              - id: l2-n5
                type: image_multiple_choice
                text: "Where will Leo go?"
                say: "Listen. Leo says: Tomorrow, I will go to the library with Grandad. Where will Leo go?"
                options: [{ object: park }, { object: hospital }, { object: library }]
                answer: library

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Which is a full sentence?"
            say: "Which one is a full sentence about the picture?"
            show: { object: bus }
            options: ["Bus big.", "The bus is big and red.", "Red."]
            answer: "The bus is big and red."
          - id: l2-c2
            type: multiple_choice
            text: "Which sentence is right?"
            say: "Which sentence is right?"
            options: ["Yesterday, I make a cake.", "Yesterday, I made a cake.", "Yesterday, I will make a cake."]
            answer: "Yesterday, I made a cake."
          - id: l2-c3
            type: multiple_choice
            text: "Which sentence is right?"
            say: "Which sentence is right?"
            options: ["Tomorrow, I will visit Grandad.", "Tomorrow, I visited Grandad.", "Tomorrow, I visiting Grandad."]
            answer: "Tomorrow, I will visit Grandad."
          - id: l2-c4
            type: multiple_choice
            text: "Which ending makes sense?"
            say: "I am wearing my wellies because ... Which ending makes sense?"
            options: ["I like pizza.", "it is muddy outside.", "the moon is round."]
            answer: "it is muddy outside."
          - id: l2-c5
            type: image_multiple_choice
            text: "How does Ben feel?"
            say: "Listen. Ben says: I feel sad because my friend has gone home. How does Ben feel?"
            options: [{ object: happy }, { object: scared }, { object: sad }]
            answer: sad
