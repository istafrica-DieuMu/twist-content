# Lesson set: English, Reception (EYFS). Hand-authored draft.
id: en-GB.lit-en.phonics-i-n-m-d
skill: lit-en.phonics.i-n-m-d
curriculum: en-GB
language: en
title:
  de: Die Laute i, n, m, d
  en: The sounds i, n, m, d
summary: >
  The second set of phonics letters. Lesson 1 links i, n, m and d to their
  sounds and to words that start with them; lesson 2 blends them with s,
  a, t and p into words (in, man, dip, pin) and ends with the skill check.
  The sounds are played from the sound bank, never as letter names.
  Writing the letters in words is practised in Practise (the missing
  letter) and in segment-spell; the skill check marks the sounds and
  reading the words.
metadata:
  year: reception
  topic: { de: "Laute und Buchstaben", en: "Phonics" }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [lit-en.phonics.s-a-t-p]
  also_practises: [lit-en.phonics.s-a-t-p]
  vocabulary: { en: [sound, letter, blend, word] }
  forms: [text, picture, audio, drawn]
  drawn: [letter-card]
  sounds: [en.i, en.n, en.m, en.d, en.a]
  facets: []
  parts:
    - { id: i-d, what: { de: die Laute von i und d kennen, en: knowing the sounds of i and d } }
    - { id: m-n, what: { de: m und n unterscheiden, en: telling m from n } }
    - { id: vowel, what: { de: "i und a in der Mitte eines Wortes unterscheiden (pin, pan)", en: "telling i from a in the middle of a word (pin, pan)" } }
    - { id: words, what: { de: "Wörter mit i, n, m und d lesen (tin, mad, sip)", en: "reading words with i, n, m and d (tin, mad, sip)" } }
  misconceptions:
    - id: m-n-mixup
      what: Mixes up m and n, two humming sounds
      addressed: m and n share an option set in every stage of lesson 1, with feedback in l1-f1 and l1-f5; lesson 2 sets map and nap side by side in l2-f5 and l2-s3, and mat against n in l2-n4
    - id: i-a-vowel
      what: Hears the middle vowel wrong (pin as pan)
      addressed: lesson 2 sets words that differ only in the middle sound side by side in every stage (pin and pan in l2-f1, tap and tip in l2-s5, tan and tin in l2-n1)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "i, n, m, d", en: "i, n, m, d" }
    goal:
      de: "Lerne vier neue Laute, so wie das Summen mit geschlossenen Lippen am Anfang von milk."
      en: "Learn four new sounds, like the hum with closed lips at the start of milk."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "i"
            say: "Here is a new letter. Listen to three words: insect, igloo, ink. What do you think: do they all start with the same sound? Have a guess."
            show: { drawn: letter-card, text: "i" }
          - text: "i"
            say: "Yes! This letter makes a short sound. Insect, igloo and ink all start with it. Listen."
            show: { drawn: letter-card, text: "i" }
            sound: en.i
          - text: "Did you know?"
            say: "Did you know? The little dot on top of this letter has its own name. It is called a tittle. Tittle!"
            show: { drawn: letter-card, text: "i" }
          - text: "n"
            say: "This letter makes a humming sound. Your tongue is up behind your teeth and your lips are open. Net, nut and nest all start with it. Listen."
            show: { drawn: letter-card, text: "n" }
            sound: en.n
          - text: "m"
            say: "This letter makes a humming sound too, but your lips are closed. Milk, monster and mop all start with it. Listen."
            show: { drawn: letter-card, text: "m" }
            sound: en.m
          - text: "d"
            say: "This letter makes a short sound. Duck, door and dinosaur all start with it. Listen."
            show: { drawn: letter-card, text: "d" }
            sound: en.d

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.m }
                options: ["n", "m", "d"]
                answer: "m"
                feedback:
                  "n": "That letter hums too, but with your lips open. For this sound your lips are closed, like in milk."
                hints:
                  - "Listen again. Are your lips closed?"
                  - "Mouse starts with this sound. Say mouse slowly and feel your lips."
                  - "It is the letter with two humps."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "d" }
                options: [{ object: dog }, { object: lamp }, { object: sun }]
                answer: dog
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Dog, lamp, sun. Which one starts like duck?"
                  - "Dog starts with this letter. Tap the dog."
                difficulty: easy
              - id: l1-f3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.i }
                options: ["i", "a", "s"]
                answer: "i"
                hints:
                  - "Listen again. It is short, and it is not the sound in ant."
                  - "Insect starts with this sound. You hear it in the middle of fish, too."
                  - "It is the letter with a dot on top."
              - id: l1-f4
                type: true_false
                text: "Does it start with n?"
                say: "Nose. Does nose start with this sound? Listen."
                audio: { sound: en.n }
                show: { object: nose }
                answer: true
                hints:
                  - "Say nose slowly. Listen to the start."
                  - "Nose starts with a hum, and your lips stay open, like net."
                  - "Yes, nose starts with this letter."
              - id: l1-f5
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "m" }
                options: [{ object: nose }, { object: mouse }, { object: dog }]
                answer: mouse
                feedback:
                  nose: "Nose starts like net. Your lips stay open in nose."
                hints:
                  - "Tap the pictures and listen to the words."
                  - "Which one starts with closed lips?"
                  - "Mouse starts with this letter. Tap the mouse."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.n }
                options: ["m", "d", "n"]
                answer: "n"
                hints: ["Listen again. Are your lips open or closed?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "d" }
                options: [{ object: baby }, { object: dad }, { object: moon }]
                answer: dad
                feedback:
                  baby: "Waaah! Baby starts with a pop of your lips. Listen for the short sound at the start of duck."
                hints: ["Tap the pictures and listen. Which one starts like duck?"]
              - id: l1-s3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.d }
                options: ["d", "t", "n"]
                answer: "d"
                hints: ["Dog starts with this sound."]
              - id: l1-s4
                type: true_false
                text: "Does it start with n?"
                say: "Monkey. Does monkey start with this sound? Listen."
                audio: { sound: en.n }
                show: { object: monkey }
                answer: false
                hints: ["Say monkey slowly. Listen to the very first sound."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which has this sound in the middle?"
                say: "Look at the letter. Which word has its sound in the middle? Tap the picture."
                show: { drawn: letter-card, text: "i" }
                options: [{ object: dog }, { object: fish }, { object: sun }]
                answer: fish
                hints: ["Say each word slowly and listen to the middle."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.m }
                options: ["d", "n", "m"]
                answer: "m"
              - id: l1-n2
                type: image_multiple_choice
                text: "What starts with this letter?"
                say: "Look at the letter. What starts with its sound? Tap the picture."
                show: { drawn: letter-card, text: "m" }
                options: [{ object: moon }, { object: nose }, { object: dog }]
                answer: moon
              - id: l1-n3
                type: audio_choice
                text: "Which letter makes this sound?"
                say: "Listen. Which letter makes this sound?"
                audio: { sound: en.n }
                options: ["n", "i", "m"]
                answer: "n"
              - id: l1-n4
                type: true_false
                text: "Does it start with d?"
                say: "Dad is dancing in the kitchen! Dad. Does dad start with this sound? Listen."
                audio: { sound: en.d }
                show: { object: dad }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "Which has this sound in the middle?"
                say: "Look at the letter. Which word has its sound in the middle? Tap the picture."
                show: { drawn: letter-card, text: "i" }
                options: [{ object: car }, { object: swim }, { object: cake }]
                answer: swim

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.d }
            options: ["m", "d", "i"]
            answer: "d"
          - id: l1-c2
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "n" }
            options: [{ object: mouse }, { object: dad }, { object: nose }]
            answer: nose
          - id: l1-c3
            type: true_false
            text: "Does it start with m?"
            say: "Mum. Does mum start with this sound? Listen."
            audio: { sound: en.m }
            show: { object: mum }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Which letter is it? Listen."
            audio: { sound: en.i }
            options: ["d", "m", "i"]
            answer: "i"
          - id: l1-c5
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "What starts with the sound of this letter? Tap the picture."
            show: { drawn: letter-card, text: "d" }
            options: [{ object: nose }, { object: ant }, { object: duck }]
            answer: duck
          - id: l1-c6
            type: true_false
            text: "Does it start with d?"
            say: "Sun. Does sun start with this sound? Listen."
            audio: { sound: en.d }
            show: { object: sun }
            answer: false

  - n: 2
    title: { de: "in, man, dip", en: "in, man, dip" }
    goal:
      de: "Schieb die Laute zusammen und lies kurze Wörter wie in, man und dip."
      en: "Push the sounds together to read short words like in, man and dip."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "i n"
            say: "Look at these two letters. You know both of their sounds. What do you think: what little word do they make when you push the sounds together? Have a guess."
            show: { drawn: letter-card, text: "i n" }
          - text: "i n → in"
            say: "Two letters. Say the two sounds slowly, then push them together: in. The cat is in the box."
            show: { drawn: letter-card, text: "i n" }
          - text: "m a n → man"
            say: "Point to each letter and say its sound. The hum with closed lips, then the sound at the start of ant, then the hum with open lips. Slowly, then fast: man."
            show: { drawn: letter-card, text: "m a n" }
          - text: "d i p → dip"
            say: "Now the sound in the middle is the one at the start of insect. Point to each letter and say its sound, slowly, then fast: dip."
            show: { drawn: letter-card, text: "d i p" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "pin" }
                options: ["pin", "pan", "tin"]
                answer: "pin"
                feedback:
                  "pan": "Pan has the sound from the start of ant in the middle. Listen again: pin."
                hints:
                  - "Listen to the middle sound."
                  - "It is the sound in the middle of fish."
                  - "The word is pin."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Map. Which letter is missing at the start of map?"
                show: { object: map }
                frame: "_ap"
                options: ["m", "n", "d"]
                answer: ["m"]
                hints:
                  - "Say map slowly. What is the first sound?"
                  - "Your lips are closed at the start, like milk."
                  - "Map starts like milk. Tap the letter milk starts with."
              - id: l2-f3
                type: true_false
                text: "Does the card say the word you hear?"
                say: "Does the card say this word? Listen."
                audio: { en: "It." }
                show: { drawn: letter-card, text: "it" }
                answer: true
                hints:
                  - "Point to each letter and say its sound."
                  - "Say the two sounds slowly, then fast, and push them together."
                  - "Yes, the card says it."
              - id: l2-f4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing in the middle of this word? Listen."
                audio: { en: "Sit." }
                frame: "s_t"
                options: ["i", "a", "n"]
                answer: ["i"]
                hints:
                  - "Say sit slowly. Listen to the middle."
                  - "It is the sound in the middle of fish."
                  - "The missing letter is the one insect starts with."
              - id: l2-f5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "nap" }
                options: ["map", "nap", "tap"]
                answer: "nap"
                feedback:
                  "map": "Map starts with closed lips. Nap starts with your lips open."
                hints:
                  - "Listen to the first sound."
                  - "Are your lips open or closed at the start?"
                  - "The word is nap."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "dad" }
                options: ["sad", "dad", "mad"]
                answer: "dad"
                hints: ["Listen to the first sound."]
              - id: l2-s2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing at the end of this word? Listen."
                audio: { en: "Tin." }
                frame: "ti_"
                options: ["m", "d", "n"]
                answer: ["n"]
                hints: ["Say tin slowly. Listen to the last sound. Are your lips open or closed?"]
              - id: l2-s3
                type: true_false
                text: "Does the card say the word you hear?"
                say: "Does the card say this word? Listen."
                audio: { en: "Nap." }
                show: { drawn: letter-card, text: "map" }
                answer: false
                hints: ["Point to each letter and say its sound. Listen to the first one."]
              - id: l2-s4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing in the middle of this word? Listen."
                audio: { en: "Pan." }
                frame: "p_n"
                options: ["a", "i", "m"]
                answer: ["a"]
                hints: ["Say pan slowly. Listen to the middle sound."]
              - id: l2-s5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "tip" }
                options: ["tap", "tip", "dip"]
                answer: "tip"
                hints: ["Listen to the start and to the middle."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "tin" }
                options: ["tan", "tin", "pin"]
                answer: "tin"
              - id: l2-n2
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing at the end of this word? Listen."
                audio: { en: "Did." }
                frame: "di_"
                options: ["d", "t", "n"]
                answer: ["d"]
              - id: l2-n3
                type: true_false
                text: "Does the card say the word you hear?"
                say: "Does the card say this word? Listen."
                audio: { en: "Sad." }
                show: { drawn: letter-card, text: "sad" }
                answer: true
              - id: l2-n4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: "Which letter is missing at the start of this word? Listen."
                audio: { en: "Mat." }
                frame: "_at"
                options: ["n", "m", "d"]
                answer: ["m"]
              - id: l2-n5
                type: audio_choice
                text: "Which word do you hear?"
                say: "Listen. Which word do you hear?"
                audio: { en: "sip" }
                options: ["sit", "tip", "sip"]
                answer: "sip"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: i-d
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.i }
            options: ["a", "i", "n"]
            answer: "i"
          - id: l2-c2
            part: i-d
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "d" }
            options: [{ object: mouse }, { object: nose }, { object: dog }]
            answer: dog
          - id: l2-c3
            part: vowel
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "pan" }
            options: ["pin", "pan", "nap"]
            answer: "pan"
          - id: l2-c4
            part: words
            type: multiple_choice
            text: "Which word goes with the picture?"
            say: "Look at the picture. Which word goes with it? Read the words."
            show: { object: sad }
            options: ["sat", "sad", "mad"]
            answer: "sad"
            option_audio: false
          - id: l2-c5
            part: i-d
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.d }
            options: ["a", "t", "d"]
            answer: "d"
          - id: l2-c6
            part: m-n
            type: audio_choice
            text: "Which letter makes this sound?"
            say: "Listen to the sound. Tap its letter."
            audio: { sound: en.n }
            options: ["n", "m", "t"]
            answer: "n"
          - id: l2-c7
            part: vowel
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "sit" }
            options: ["sat", "sit", "sip"]
            answer: "sit"
          - id: l2-c8
            part: words
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word. Which picture is it?"
            show: { drawn: letter-card, text: "map" }
            options: [{ object: mouse }, { object: milk }, { object: map }]
            answer: map
            option_audio: false
          - id: l2-c9
            part: i-d
            type: true_false
            text: "Does it end with d?"
            say: "Bed. Does bed end with this sound? Listen."
            audio: { sound: en.d }
            show: { object: bed }
            answer: true
          - id: l2-c10
            part: m-n
            type: image_multiple_choice
            text: "What starts with this letter?"
            say: "Which picture starts with the sound of this letter?"
            show: { drawn: letter-card, text: "m" }
            options: [{ object: nose }, { object: milk }, { object: bed }]
            answer: milk
          - id: l2-c11
            part: vowel
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "pat" }
            options: ["pit", "tap", "pat"]
            answer: "pat"
          - id: l2-c12
            part: words
            type: image_multiple_choice
            text: "Read the word. Tap the picture."
            say: "Read the word. Which picture is it?"
            show: { drawn: letter-card, text: "ant" }
            options: [{ object: apple }, { object: ant }, { object: anchor }]
            answer: ant
            option_audio: false
          - id: l2-c13
            part: vowel
            type: true_false
            text: "Do you hear a in the middle?"
            say: "Cat. Do you hear this sound in the middle of cat? Listen."
            audio: { sound: en.a }
            show: { object: cat }
            answer: true
          - id: l2-c14
            part: m-n
            type: true_false
            text: "Does it start with m?"
            say: "Nose. Does nose start with this sound? Listen."
            audio: { sound: en.m }
            show: { object: nose }
            answer: false
          - id: l2-c15
            part: words
            type: true_false
            text: "dad"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: dad }
            answer: true
          - id: l2-c16
            part: i-d
            type: image_multiple_choice
            text: "Which has this sound in the middle?"
            say: "Look at the letter. Which word has its sound in the middle? Tap the picture."
            show: { drawn: letter-card, text: "i" }
            options: [{ object: sock }, { object: cup }, { object: pig }]
            answer: pig
          - id: l2-c17
            part: m-n
            type: true_false
            text: "nap"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: map }
            answer: false
          - id: l2-c18
            part: m-n
            type: audio_choice
            text: "Which word do you hear?"
            say: "Which word is it? Listen."
            audio: { en: "map" }
            options: ["nap", "map", "mat"]
            answer: "map"
          - id: l2-c19
            part: vowel
            type: true_false
            text: "Do you hear i in the middle?"
            say: "Hat. Do you hear this sound in the middle of hat? Listen."
            audio: { sound: en.i }
            show: { object: hat }
            answer: false
          - id: l2-c20
            part: words
            type: true_false
            text: "tin"
            say: "Read the word at the top. Does it match the picture?"
            show: { object: bin }
            answer: false
