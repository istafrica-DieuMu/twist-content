# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.compare-to-10
skill: math.numbers-to-20.compare-to-10
curriculum: en-GB
language: en
title:
  de: Vergleichen bis 10
  en: Comparing to 10
summary: >
  Children compare amounts to 10 with the words more, fewer and the same,
  as the EYFS asks. Lesson 1 compares groups, lined up so the pairs can be
  seen; lesson 2 compares numbers out loud ("Which number is bigger,
  six or four?") and ends with the skill check. The signs < > = come in Year 1.
metadata:
  year: reception
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.count-to-10]
  also_practises: [math.numbers-to-20.subitize-to-10]
  vocabulary: { en: [more, fewer, the same, most, fewest, bigger, smaller] }
  no_reading: true
  forms: [picture, drawn, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: more-fewer, what: { de: "die Gruppe mit mehr oder weniger finden, auch wenn sie anders aussieht", en: "finding the group with more or fewer, even when it looks bigger or smaller" } }
    - { id: same, what: { de: "erkennen, ob zwei Gruppen gleich viele sind", en: telling whether two groups are the same } }
    - { id: numbers, what: { de: "sagen, welche von zwei Zahlen größer oder kleiner ist", en: saying which of two numbers is bigger or smaller } }
    - { id: order, what: { de: "drei Anzahlen oder Zahlen ordnen, die größte oder kleinste finden", en: "putting three amounts or numbers in order, or finding the biggest or smallest" } }
  misconceptions:
    - id: bigger-picture
      what: Thinks the group that takes up more space has more
      addressed: lesson 1 puts a spread-out group next to a closer one that has more; hints say "Count both groups."
    - id: fewer-less
      what: Does not know the word fewer
      addressed: Learn uses fewer for things you can count; tasks ask for both more and fewer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Mehr, weniger, gleich viele", en: "More, fewer, the same" }
    goal:
      de: "Finde heraus, welche Gruppe mehr hat, welche weniger, oder ob es gleich viele sind."
      en: "Find which group has more, which has fewer, or if they are the same."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "There are five red dots and three blue dots. Five is more than three."
            show: { drawn: dots, groups: [5, 3], layout: row }
          - say: "Three is fewer than five. If every red dot gets a blue partner, two red dots are left over."
            show: { drawn: dots, groups: [5, 3], layout: row }
          - say: "Four red and four blue. Every dot has a partner and none are left over. They are the same."
            show: { drawn: dots, groups: [4, 4], layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Which has more?"
                say: "Which picture has more strawberries?"
                options:
                  - { object: strawberry, count: 3, layout: row }
                  - { object: strawberry, count: 5, layout: row }
                answer: "5"
                hints:
                  - "Count the strawberries in both pictures."
                  - "One has three, the other has five."
                  - "Five is more than three."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Which has fewer?"
                say: "Which picture has fewer fish?"
                options:
                  - { object: fish, count: 7, layout: scattered }
                  - { object: fish, count: 4, layout: scattered }
                answer: "4"
                hints:
                  - "Fewer means not as many."
                  - "Count both groups: seven and four."
                  - "Four is fewer than seven."
              - id: l1-f3
                type: true_false
                text: "Are they the same?"
                say: "Are there the same number of red and blue dots?"
                show: { drawn: dots, groups: [5, 5], layout: row }
                answer: true
                hints:
                  - "Give every red dot a blue partner."
                  - "Five red, five blue."
                  - "Yes, they are the same."
              - id: l1-f4
                type: image_multiple_choice
                text: "Which has more?"
                say: "Which picture has more marbles? Be careful and count!"
                options:
                  - { object: marble, count: 4, layout: scattered }
                  - { object: marble, count: 6, layout: row }
                answer: "6"
                feedback:
                  "4": "These marbles are spread out, but there are only four. Count both groups."
                hints:
                  - "Don't be tricked: count both groups."
                  - "One group has four, the other has six."
                  - "Six is more than four."
              - id: l1-f5
                type: true_false
                text: "Are they the same?"
                say: "Are there the same number of red and blue dots?"
                show: { drawn: dots, groups: [4, 3], layout: row }
                answer: false
                hints:
                  - "Give every red dot a blue partner."
                  - "One red dot has no partner."
                  - "No, there are more red dots."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Which has more?"
                say: "Which picture has more carrots?"
                options:
                  - { object: carrot, count: 8, layout: row }
                  - { object: carrot, count: 6, layout: row }
                answer: "8"
                hints: ["Count both groups."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Which has fewer?"
                say: "Which picture has fewer eggs?"
                options:
                  - { object: egg, count: 9, layout: scattered }
                  - { object: egg, count: 5, layout: row }
                answer: "5"
                hints: ["Fewer means not as many."]
              - id: l1-s3
                type: true_false
                text: "Are they the same?"
                say: "Are there the same number of red and blue dots?"
                show: { drawn: dots, groups: [3, 3], layout: row }
                answer: true
                hints: ["Does every red dot have a blue partner?"]
              - id: l1-s4
                type: ordering
                text: "Put them in order, fewest first."
                say: "Put the dice in order. Start with the fewest dots."
                options:
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                slot_count: 3
                answer: ["2", "4", "6"]
                hints: ["Which dice has the fewest dots?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which has more?"
                say: "Which picture has more ants?"
                options:
                  - { object: ant, count: 2, layout: scattered }
                  - { object: ant, count: 3, layout: scattered }
                answer: "3"
                hints: ["Count, even when there are only a few."]
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Which has more?"
                say: "Which picture has more balloons?"
                options:
                  - { object: balloon, count: 7, layout: row }
                  - { object: balloon, count: 5, layout: scattered }
                answer: "7"
              - id: l1-n2
                type: true_false
                text: "Are they the same?"
                say: "Are there the same number of red and blue dots?"
                show: { drawn: dots, groups: [5, 4], layout: row }
                answer: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Which has fewer?"
                say: "Which picture has fewer apples?"
                options:
                  - { object: apple, count: 3, layout: row }
                  - { object: apple, count: 6, layout: scattered }
                answer: "3"
              - id: l1-n4
                type: ordering
                text: "Put them in order, fewest first."
                say: "Put the dice in order. Start with the fewest dots."
                options:
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                slot_count: 3
                answer: ["1", "3", "5"]
              - id: l1-n5
                type: true_false
                text: "Are they the same?"
                say: "Are there the same number of red and blue dots?"
                show: { drawn: dots, groups: [2, 2], layout: row }
                answer: true
                difficulty: easy

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Which has more frogs?"
            say: "Which picture has more frogs?"
            options:
              - { object: frog, count: 4, layout: row }
              - { object: frog, count: 7, layout: scattered }
            answer: "7"
          - id: l1-c2
            type: image_multiple_choice
            text: "Which has fewer bananas?"
            say: "Which picture has fewer bananas?"
            options:
              - { object: banana, count: 2, layout: row }
              - { object: banana, count: 6, layout: row }
            answer: "2"
          - id: l1-c3
            type: true_false
            text: "Are there the same number of red and blue dots?"
            say: "Are there the same number of red and blue dots?"
            show: { drawn: dots, groups: [6, 3], layout: row }
            answer: false
          - id: l1-c4
            type: image_multiple_choice
            text: "Which has fewer cars?"
            say: "Which picture has fewer cars?"
            options:
              - { object: car, count: 9, layout: scattered }
              - { object: car, count: 7, layout: row }
            answer: "7"
          - id: l1-c5
            type: true_false
            text: "Are there the same number of red and blue dots?"
            say: "Are there the same number of red and blue dots?"
            show: { drawn: dots, groups: [6, 6], layout: row }
            answer: true
          - id: l1-c6
            type: ordering
            text: "Put them in order, fewest first."
            say: "Put the dice in order. Start with the fewest dots."
            options:
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 6, layout: dice }
              - { drawn: dots, count: 3, layout: dice }
            slot_count: 3
            answer: ["3", "4", "6"]

  - n: 2
    title: { de: Zahlen vergleichen, en: Comparing numbers }
    goal:
      de: "Sag, welche von zwei Zahlen größer ist, so wie 6 ist größer als 4."
      en: "Say which of two numbers is bigger, like 6 is bigger than 4."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Six dots are more than four dots. So six is a bigger number than four. Six comes later when we count."
            show: { drawn: dots, groups: [6, 4], layout: dice }
          - say: "Two dots are fewer than five dots. So two is a smaller number than five. Two comes earlier when we count."
            show: { drawn: dots, groups: [2, 5], layout: dice }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Which number is bigger?"
                say: "Which number is bigger, three or seven?"
                show: { drawn: dots, groups: [3, 7], layout: row }
                options: ["3", "7"]
                answer: "7"
                hints:
                  - "Which number comes later when you count?"
                  - "One, two, three, ... seven. Seven comes later."
                  - "Seven is bigger than three."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Which number is smaller?"
                say: "Which number is smaller, eight or five?"
                options: ["8", "5"]
                answer: "5"
                hints:
                  - "Which number comes earlier when you count?"
                  - "Five comes before eight."
                  - "Five is smaller than eight."
              - id: l2-f3
                type: true_false
                text: "Is 6 bigger than 4?"
                say: "Is six bigger than four?"
                answer: true
                hints:
                  - "Count: four, five, six."
                  - "Six comes after four."
                  - "Yes, six is bigger than four."
              - id: l2-f4
                type: true_false
                text: "Is 2 bigger than 9?"
                say: "Is two bigger than nine?"
                answer: false
                hints:
                  - "Does two come before or after nine?"
                  - "Two comes much earlier."
                  - "No, two is smaller than nine."
              - id: l2-f5
                type: multiple_choice
                text: "Which number is the biggest?"
                say: "Which number is the biggest: four, nine or six?"
                options: ["4", "9", "6"]
                answer: "9"
                hints:
                  - "Which number comes last when you count?"
                  - "Four, six, nine."
                  - "Nine is the biggest."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Which number is bigger?"
                say: "Which number is bigger, five or two?"
                options: ["5", "2"]
                answer: "5"
                hints: ["Which comes later when you count?"]
              - id: l2-s2
                type: true_false
                text: "Is 7 smaller than 3?"
                say: "Is seven smaller than three?"
                answer: false
                hints: ["Does seven come before three?"]
              - id: l2-s3
                type: multiple_choice
                text: "Which number is smaller?"
                say: "Which number is smaller, six or ten?"
                options: ["6", "10"]
                answer: "6"
                hints: ["Which comes earlier when you count?"]
              - id: l2-s4
                type: multiple_choice
                text: "Which number is the smallest?"
                say: "Which number is the smallest: eight, three or five?"
                options: ["8", "3", "5"]
                answer: "3"
                hints: ["Which comes first when you count?"]
              - id: l2-s5
                type: true_false
                text: "Are 4 and 4 the same?"
                say: "Are four and four the same?"
                answer: true
                hints: ["Listen: are the numbers the same?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Which number is bigger?"
                say: "Which number is bigger, nine or eight?"
                options: ["8", "9"]
                answer: "9"
              - id: l2-n2
                type: true_false
                text: "Is 5 smaller than 7?"
                say: "Is five smaller than seven?"
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Which number is smaller?"
                say: "Which number is smaller, one or four?"
                options: ["4", "1"]
                answer: "1"
              - id: l2-n4
                type: multiple_choice
                text: "Which number is the biggest?"
                say: "Which number is the biggest: seven, two or ten?"
                options: ["7", "2", "10"]
                answer: "10"
              - id: l2-n5
                type: true_false
                text: "Is 6 bigger than 8?"
                say: "Is six bigger than eight?"
                answer: false

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: more-fewer
            type: image_multiple_choice
            text: "Which has more balls?"
            say: "Which picture has more balls?"
            options:
              - { object: ball, count: 5, layout: scattered }
              - { object: ball, count: 8, layout: row }
            answer: "8"
          - id: l2-c2
            part: numbers
            type: multiple_choice
            text: "Which number is smaller, 7 or 4?"
            say: "Which number is smaller, seven or four?"
            options: ["7", "4"]
            answer: "4"
          - id: l2-c3
            part: same
            type: true_false
            text: "Are there the same number of red and blue dots?"
            say: "Are there the same number of red and blue dots?"
            show: { drawn: dots, groups: [9, 9], layout: row }
            answer: true
          - id: l2-c4
            part: numbers
            type: multiple_choice
            text: "Which number is bigger, 10 or 6?"
            say: "Which number is bigger, ten or six?"
            options: ["6", "10"]
            answer: "10"
          - id: l2-c5
            part: more-fewer
            type: image_multiple_choice
            text: "Which has fewer pencils?"
            say: "Which picture has fewer pencils?"
            options:
              - { object: pencil, count: 5, layout: scattered }
              - { object: pencil, count: 7, layout: row }
            answer: "5"
          - id: l2-c6
            part: same
            type: true_false
            text: "Are there the same number of red and blue dots?"
            say: "Are there the same number of red and blue dots?"
            show: { drawn: dots, groups: [6, 5], layout: row }
            answer: false
          - id: l2-c7
            part: numbers
            type: multiple_choice
            text: "Which number is bigger, 5 or 8?"
            say: "Which number is bigger, five or eight?"
            options: ["5", "8"]
            answer: "8"
          - id: l2-c8
            part: order
            type: ordering
            text: "Put them in order, fewest first."
            say: "Put the dice in order. Start with the fewest dots."
            options:
              - { drawn: dots, count: 5, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
              - { drawn: dots, count: 6, layout: dice }
            slot_count: 3
            answer: ["2", "5", "6"]
          - id: l2-c9
            part: more-fewer
            type: image_multiple_choice
            text: "Which has more stars?"
            say: "Which picture has more stars?"
            options:
              - { object: star, count: 7, layout: scattered }
              - { object: star, count: 9, layout: row }
            answer: "9"
          - id: l2-c10
            part: same
            type: true_false
            text: "Are there the same number of red and blue dots?"
            say: "Are there the same number of red and blue dots?"
            show: { drawn: dots, groups: [7, 7], layout: row }
            answer: true
          - id: l2-c11
            part: numbers
            type: true_false
            text: "Is 3 smaller than 6?"
            say: "Is three smaller than six?"
            answer: true
          - id: l2-c12
            part: order
            type: multiple_choice
            text: "Which number is the biggest: 5, 3 or 8?"
            say: "Which number is the biggest: five, three or eight?"
            options: ["5", "3", "8"]
            answer: "8"
          - id: l2-c13
            part: more-fewer
            type: image_multiple_choice
            text: "Which has more cups?"
            say: "Which picture has more cups?"
            options:
              - { object: cup, count: 2, layout: row }
              - { object: cup, count: 3, layout: scattered }
            answer: "3"
          - id: l2-c14
            part: same
            type: true_false
            text: "Are there the same number of red and blue dots?"
            say: "Are there the same number of red and blue dots?"
            show: { drawn: dots, groups: [3, 4], layout: row }
            answer: false
          - id: l2-c15
            part: numbers
            type: true_false
            text: "Is 9 smaller than 4?"
            say: "Is nine smaller than four?"
            answer: false
          - id: l2-c16
            part: order
            type: multiple_choice
            text: "Which number is the smallest: 6, 9 or 4?"
            say: "Which number is the smallest: six, nine or four?"
            options: ["6", "9", "4"]
            answer: "4"
          - id: l2-c17
            part: more-fewer
            type: image_multiple_choice
            text: "Which has fewer shells?"
            say: "Which picture has fewer shells?"
            options:
              - { object: shell, count: 10, layout: scattered }
              - { object: shell, count: 8, layout: row }
            answer: "8"
          - id: l2-c18
            part: same
            type: true_false
            text: "Are there the same number of red and blue dots?"
            say: "Are there the same number of red and blue dots?"
            show: { drawn: dots, groups: [8, 8], layout: row }
            answer: true
          - id: l2-c19
            part: numbers
            type: multiple_choice
            text: "Which number is smaller, 3 or 2?"
            say: "Which number is smaller, three or two?"
            options: ["3", "2"]
            answer: "2"
          - id: l2-c20
            part: order
            type: ordering
            text: "Put them in order, most first."
            say: "Put the dice in order. Start with the most dots."
            options:
              - { drawn: dots, count: 3, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
              - { drawn: dots, count: 5, layout: dice }
            slot_count: 3
            answer: ["5", "3", "2"]
