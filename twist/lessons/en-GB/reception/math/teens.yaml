# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.teens
skill: math.numbers-to-20.teens
curriculum: en-GB
language: en
title:
  de: Die Zahlen von 11 bis 20
  en: Numbers to 20
summary: >
  Counting beyond ten: a full ten frame is ten, and the numbers to 20 are
  ten and some more. Lesson 1 counts on from a full ten frame to say the
  number; lesson 2 makes teen numbers as ten and some more and finds them
  among other numbers, and ends with the skill check. Spoken questions;
  numbers say themselves.
metadata:
  year: reception
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.partition-to-10]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { en: [ten, full, and some more, eleven, twelve, teen, twenty] }
  no_reading: true
  forms: [drawn, audio]
  drawn: [ten-frame, zwanzigerfeld]
  facets: []
  parts:
    - { id: count-on, what: { de: "Zählen, wie viele es sind: ein volles Zehnerfeld und noch ein paar", en: "saying how many there are on a full ten frame and some more" } }
    - { id: ten-and, what: { de: die Zahl für zehn und noch ein paar nennen, en: naming the number for ten and some more } }
    - { id: find, what: { de: das Bild zu einer Zahl von 11 bis 20 finden, en: finding the picture that shows a number from 11 to 20 } }
  misconceptions:
    - id: count-all-again
      what: Counts every counter from one instead of starting at ten
      addressed: Learn says "A full ten frame is ten" and "Say ten, then count on"; hints repeat it
    - id: teen-as-ten-and-word
      what: Hears "fourteen" and makes 10 and 40, or 4
      addressed: lesson 2 Learn makes fourteen as ten and four more; options include the ones alone (6 for sixteen), with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Weiter als zehn, en: Counting on from ten }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "This ten frame is full. A full ten frame is ten. You don't need to count it."
            show: { drawn: ten-frame, filled: 10 }
          - say: "Here is a full ten frame and two more. Say ten, then count on: eleven, twelve. That is twelve."
            show: { drawn: zwanzigerfeld, filled: [10, 2] }
          - say: "Two full ten frames make twenty."
            show: { drawn: zwanzigerfeld, filled: [10, 10] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many counters?"
                say: "One full ten frame and one more. How many counters?"
                show: { drawn: zwanzigerfeld, filled: [10, 1] }
                options: ["11", "10", "1"]
                answer: "11"
                feedback:
                  "1": "There is a full ten frame too. Say ten, then count on: eleven."
                hints:
                  - "The full frame is ten."
                  - "Say ten, then count on one."
                  - "Eleven."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many counters?"
                say: "A full ten frame and three more. How many counters?"
                show: { drawn: zwanzigerfeld, filled: [10, 3] }
                options: ["12", "13", "3"]
                answer: "13"
                hints:
                  - "Start at ten."
                  - "Eleven, twelve, thirteen."
                  - "Thirteen."
              - id: l1-f3
                type: true_false
                text: "Are there 15?"
                say: "A full ten frame and five more. Are there fifteen counters?"
                show: { drawn: zwanzigerfeld, filled: [10, 5] }
                answer: true
                hints:
                  - "Start at ten."
                  - "Count on five: eleven, twelve, thirteen, fourteen, fifteen."
                  - "Yes."
              - id: l1-f4
                type: image_multiple_choice
                text: "Which shows 20?"
                say: "Which one shows twenty?"
                options: [{ drawn: zwanzigerfeld, filled: [10, 10] }, { drawn: zwanzigerfeld, filled: [10, 1] }, { drawn: zwanzigerfeld, filled: [10, 9] }]
                answer: "20"
                feedback:
                  "11": "That is ten and one more: eleven. Twenty is two full ten frames."
                hints:
                  - "Each full ten frame is ten."
                  - "Twenty is ten and ten more."
                  - "Find the one with two full ten frames."
              - id: l1-f5
                type: multiple_choice
                text: "How many counters?"
                say: "A full ten frame and four more. How many counters?"
                show: { drawn: zwanzigerfeld, filled: [10, 4] }
                options: ["14", "4", "15"]
                answer: "14"
                hints:
                  - "Start at ten."
                  - "Count on four."
                  - "Fourteen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many counters?"
                say: "How many counters are there?"
                show: { drawn: zwanzigerfeld, filled: [10, 8] }
                options: ["18", "8", "19"]
                answer: "18"
                hints: ["Say ten, then count on."]
              - id: l1-s2
                type: true_false
                text: "Are there 16?"
                say: "Are there sixteen counters?"
                show: { drawn: zwanzigerfeld, filled: [10, 7] }
                answer: false
                hints: ["Start at ten and count on."]
              - id: l1-s3
                type: multiple_choice
                text: "How many counters?"
                say: "How many counters are there?"
                show: { drawn: zwanzigerfeld, filled: [10, 6] }
                options: ["16", "6", "17"]
                answer: "16"
                hints: ["The full frame is ten."]
              - id: l1-s4
                type: multiple_choice
                text: "How many counters?"
                say: "How many counters are there?"
                show: { drawn: zwanzigerfeld, filled: [10, 9] }
                options: ["19", "18", "9"]
                answer: "19"
                hints: ["Start at ten."]
              - id: l1-s5
                type: true_false
                text: "Are there 14?"
                say: "Are there fourteen counters?"
                show: { drawn: zwanzigerfeld, filled: [10, 4] }
                answer: true
                hints: ["Say ten, then count on."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many counters?"
                say: "How many counters are there?"
                show: { drawn: zwanzigerfeld, filled: [10, 8] }
                options: ["18", "8", "17"]
                answer: "18"
              - id: l1-n2
                type: true_false
                text: "Are there 11?"
                say: "Are there eleven counters?"
                show: { drawn: zwanzigerfeld, filled: [10, 1] }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "How many counters?"
                say: "How many counters are there?"
                show: { drawn: zwanzigerfeld, filled: [10, 7] }
                options: ["17", "7", "16"]
                answer: "17"
              - id: l1-n4
                type: multiple_choice
                text: "How many counters?"
                say: "How many counters are there?"
                show: { drawn: zwanzigerfeld, filled: [10, 6] }
                options: ["16", "6", "15"]
                answer: "16"
              - id: l1-n5
                type: true_false
                text: "Are there 19?"
                say: "Are there nineteen counters?"
                show: { drawn: zwanzigerfeld, filled: [10, 6] }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many counters?"
            say: "How many counters are there?"
            show: { drawn: zwanzigerfeld, filled: [10, 5] }
            options: ["15", "5", "14"]
            answer: "15"
          - id: l1-c2
            type: true_false
            text: "Are there 17?"
            say: "Are there seventeen counters?"
            show: { drawn: zwanzigerfeld, filled: [10, 8] }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "How many counters?"
            say: "How many counters are there?"
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
            options: ["13", "3", "12"]
            answer: "13"
          - id: l1-c4
            type: multiple_choice
            text: "How many counters?"
            say: "How many counters are there?"
            show: { drawn: zwanzigerfeld, filled: [10, 6] }
            options: ["16", "15", "17"]
            answer: "16"
          - id: l1-c5
            type: true_false
            text: "Are there 18?"
            say: "Are there eighteen counters?"
            show: { drawn: zwanzigerfeld, filled: [10, 9] }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Tap the one that shows 16."
            say: "Tap the one that shows sixteen."
            options: [{ drawn: zwanzigerfeld, filled: [10, 5] }, { drawn: ten-frame, filled: 6 }, { drawn: zwanzigerfeld, filled: [10, 6] }]
            answer: "16"

  - n: 2
    title: { de: Zehn und noch ein paar, en: Ten and some more }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Fourteen is ten and four more. Fill one ten frame, then add four more."
            show: { drawn: zwanzigerfeld, filled: [10, 4] }
          - say: "Seventeen is ten and seven more. The teen numbers are all ten and some more."
            show: { drawn: zwanzigerfeld, filled: [10, 7] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Which shows 12?"
                say: "Which one shows twelve? Ten and two more."
                options: [{ drawn: zwanzigerfeld, filled: [10, 2] }, { drawn: zwanzigerfeld, filled: [10, 5] }, { drawn: ten-frame, filled: 2 }]
                answer: "12"
                hints:
                  - "Twelve is ten and two more."
                  - "Look for a full ten frame and two more."
                  - "The full frame and two more."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "10 and 6 more. What number is that?"
                say: "Ten and six more. What number is that?"
                options: ["16", "6", "10"]
                answer: "16"
                feedback:
                  "6": "Don't forget the ten. Ten and six more is sixteen."
                hints:
                  - "Start at ten."
                  - "Count on six."
                  - "Sixteen."
              - id: l2-f3
                type: true_false
                text: "Is this 18?"
                say: "Is this eighteen?"
                show: { drawn: zwanzigerfeld, filled: [10, 8] }
                answer: true
                hints:
                  - "Ten and eight more."
                  - "Count on from ten."
                  - "Yes."
              - id: l2-f4
                type: image_multiple_choice
                text: "Which shows 15?"
                say: "Which one shows fifteen?"
                options: [{ drawn: zwanzigerfeld, filled: [10, 4] }, { drawn: zwanzigerfeld, filled: [10, 5] }, { drawn: zwanzigerfeld, filled: [10, 6] }]
                answer: "15"
                hints:
                  - "Fifteen is ten and five more."
                  - "Count the counters in the second ten frame."
                  - "Ten and five."
              - id: l2-f5
                type: multiple_choice
                text: "10 and 9 more. What number is that?"
                say: "Ten and nine more. What number is that?"
                options: ["19", "9", "20"]
                answer: "19"
                hints:
                  - "Start at ten."
                  - "Count on nine."
                  - "Nineteen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "10 and 3 more. What number is that?"
                say: "Ten and three more. What number is that?"
                options: ["13", "3", "30"]
                answer: "13"
                hints: ["Start at ten and count on."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which shows 19?"
                say: "Which one shows nineteen?"
                options: [{ drawn: zwanzigerfeld, filled: [10, 9] }, { drawn: ten-frame, filled: 9 }, { drawn: zwanzigerfeld, filled: [10, 10] }]
                answer: "19"
                hints: ["Nineteen is ten and nine more."]
              - id: l2-s3
                type: true_false
                text: "Is this 14?"
                say: "Is this fourteen?"
                show: { drawn: zwanzigerfeld, filled: [10, 3] }
                answer: false
                hints: ["Count on from ten."]
              - id: l2-s4
                type: multiple_choice
                text: "10 and 10 more. What number is that?"
                say: "Ten and ten more. What number is that?"
                options: ["20", "11", "10"]
                answer: "20"
                hints: ["Start at ten and count on ten more."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Which shows 11?"
                say: "Which one shows eleven?"
                options: [{ drawn: zwanzigerfeld, filled: [10, 1] }, { drawn: ten-frame, filled: 1 }, { drawn: zwanzigerfeld, filled: [10, 2] }]
                answer: "11"
                hints: ["Eleven is ten and one more."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "10 and 1 more. What number is that?"
                say: "Ten and one more. What number is that?"
                options: ["11", "1", "12"]
                answer: "11"
              - id: l2-n2
                type: image_multiple_choice
                text: "Which shows 16?"
                say: "Which one shows sixteen?"
                options: [{ drawn: zwanzigerfeld, filled: [10, 6] }, { drawn: zwanzigerfeld, filled: [10, 7] }, { drawn: ten-frame, filled: 6 }]
                answer: "16"
              - id: l2-n3
                type: true_false
                text: "Is this 12?"
                say: "Is this twelve?"
                show: { drawn: zwanzigerfeld, filled: [10, 2] }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "10 and 5 more. What number is that?"
                say: "Ten and five more. What number is that?"
                options: ["15", "5", "14"]
                answer: "15"
              - id: l2-n5
                type: true_false
                text: "Is this 17?"
                say: "Is this seventeen?"
                show: { drawn: zwanzigerfeld, filled: [10, 8] }
                answer: false

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: ten-and
            type: true_false
            text: "10 and 9 more. Is that 19?"
            say: "Ten and nine more. Is that nineteen?"
            answer: true
          - id: l2-c2
            part: find
            type: image_multiple_choice
            text: "Which shows 13?"
            say: "Which one shows thirteen?"
            options: [{ drawn: zwanzigerfeld, filled: [10, 3] }, { drawn: ten-frame, filled: 3 }, { drawn: zwanzigerfeld, filled: [10, 8] }]
            answer: "13"
          - id: l2-c3
            part: count-on
            type: multiple_choice
            text: "How many counters?"
            say: "How many counters are there?"
            show: { drawn: zwanzigerfeld, filled: [10, 5] }
            options: ["15", "5", "16"]
            answer: "15"
          - id: l2-c4
            part: count-on
            type: true_false
            text: "Is this 19?"
            say: "Is this nineteen?"
            show: { drawn: zwanzigerfeld, filled: [10, 9] }
            answer: true
          - id: l2-c5
            part: count-on
            type: multiple_choice
            text: "How many counters?"
            say: "How many counters are there?"
            show: { drawn: zwanzigerfeld, filled: [10, 1] }
            options: ["11", "1", "12"]
            answer: "11"
          - id: l2-c6
            part: ten-and
            type: multiple_choice
            text: "10 and 8 more. What number is that?"
            say: "Ten and eight more. What number is that?"
            options: ["18", "8", "17"]
            answer: "18"
          - id: l2-c7
            part: find
            type: image_multiple_choice
            text: "Tap the one that shows 15."
            say: "Tap the one that shows fifteen."
            options: [{ drawn: zwanzigerfeld, filled: [10, 5] }, { drawn: ten-frame, filled: 5 }, { drawn: zwanzigerfeld, filled: [10, 6] }]
            answer: "15"
          - id: l2-c8
            part: find
            type: image_multiple_choice
            text: "Tap the one that shows 18."
            say: "Tap the one that shows eighteen."
            options: [{ drawn: zwanzigerfeld, filled: [10, 7] }, { drawn: zwanzigerfeld, filled: [10, 8] }, { drawn: zwanzigerfeld, filled: [10, 10] }]
            answer: "18"
          - id: l2-c9
            part: count-on
            type: true_false
            text: "Are there 16?"
            say: "Are there sixteen counters?"
            show: { drawn: zwanzigerfeld, filled: [10, 6] }
            answer: true
          - id: l2-c10
            part: ten-and
            type: true_false
            text: "10 and 5 more. Is that 16?"
            say: "Ten and five more. Is that sixteen?"
            answer: false
          - id: l2-c11
            part: count-on
            type: true_false
            text: "Are there 13?"
            say: "Are there thirteen counters?"
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
            answer: true
          - id: l2-c12
            part: find
            type: image_multiple_choice
            text: "Tap the one that shows 19."
            say: "Tap the one that shows nineteen."
            options: [{ drawn: zwanzigerfeld, filled: [10, 8] }, { drawn: zwanzigerfeld, filled: [10, 9] }, { drawn: ten-frame, filled: 9 }]
