            text: "Are there 17?"
            say: "Are there seventeen counters?"
            show: { drawn: zwanzigerfeld, filled: [10, 6] }
            answer: false
          - id: l2-c18
            part: ten-and
            type: true_false
            text: "10 and 6 more. Is that 16?"
            say: "Ten and six more. Is that sixteen?"
            answer: true
          - id: l2-c19
