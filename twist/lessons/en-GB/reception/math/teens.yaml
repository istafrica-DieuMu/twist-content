            say: "Are there fifteen counters?"
            show: { drawn: zwanzigerfeld, filled: [10, 8] }
            answer: false
          - id: l2-c14
            part: ten-and
            type: true_false
            text: "10 and 1 more. Is that 11?"
            say: "Ten and one more. Is that eleven?"
            answer: true
          - id: l2-c15
            part: find
            type: image_multiple_choice
            text: "Tap the one that shows 16."
            say: "Tap the one that shows sixteen."
            options: [{ drawn: zwanzigerfeld, filled: [10, 6] }, { drawn: zwanzigerfeld, filled: [10, 1] }, { drawn: ten-frame, filled: 6 }]
            answer: "16"
          - id: l2-c16
            part: find
            type: image_multiple_choice
            text: "Tap the one that shows 11."
            say: "Tap the one that shows eleven."
            options: [{ drawn: ten-frame, filled: 1 }, { drawn: zwanzigerfeld, filled: [10, 10] }, { drawn: zwanzigerfeld, filled: [10, 1] }]
