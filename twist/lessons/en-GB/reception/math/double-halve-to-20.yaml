# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.double-halve-to-20
skill: math.numbers-to-20.double-halve-to-20
curriculum: en-GB
language: en
title:
  de: Verdoppeln und Halbieren bis 20
  en: Doubles and sharing
summary: >
  Double facts to 10 (the Early Learning Goal) and sharing fairly into two
  equal groups. Lesson 1 makes doubles with dots, the same number twice;
  lesson 2 shares fairly between two and links halves to doubles, and
  ends with the skill check. Spoken questions; numbers say themselves.
metadata:
  year: reception
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.partition-to-10]
  also_practises: [math.numbers-to-20.subitize-to-10]
  vocabulary: { en: [double, the same, share, fair, equal, half] }
  no_reading: true
  forms: [drawn, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: double, what: { de: das Doppelte einer Zahl bis 5 nennen, en: saying the double of a number to 5 } }
    - { id: spot-double, what: { de: "eine Verdopplung erkennen (zweimal die gleiche Zahl)", en: "spotting a double (the same number twice)" } }
    - { id: share, what: { de: "fair zwischen zwei teilen und sagen, wie viele jeder bekommt", en: sharing fairly between two and saying how many each gets } }
    - { id: fair, what: { de: "erkennen, ob zwischen zwei fair geteilt ist", en: telling whether a share between two is fair } }
  misconceptions:
    - id: double-as-one-more
      what: Thinks double three is four
      addressed: Learn says a double is the same number twice; options include one more, with feedback in the full stage
    - id: unfair-share
      what: Calls an unequal share fair
      addressed: lesson 2 shares one each in turn; true/false tasks show unequal shares in each stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Verdoppeln, en: Doubles }
    goal:
      de: "Verdopple Zahlen, nimm also die gleiche Zahl zweimal, so wie 3 und 3 sind 6."
      en: "Make a double with the same number twice, like 3 and 3 make 6."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Here are three spots on one side."
            show: { drawn: dots, count: 3, layout: dice }
          - say: "And three spots on the other side, the same. Three and three make six. That is double three."
            show: { drawn: dots, groups: [3, 3], layout: dice }
          - say: "A double is the same number twice. Double four is four and four: eight."
            show: { drawn: dots, groups: [4, 4], layout: dice }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Double 2"
                say: "Two and two, the same. What is double two?"
                show: { drawn: dots, groups: [2, 2], layout: dice }
                options: ["4", "3", "2"]
                answer: "4"
                feedback:
                  "3": "Double two is two and two. That makes four."
                hints:
                  - "Two on one side, two on the other."
                  - "Count them all."
                  - "Four."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Double 5"
                say: "What is double five?"
                show: { drawn: dots, groups: [5, 5], layout: dice }
                options: ["10", "6", "5"]
                answer: "10"
                hints:
                  - "Five and five."
                  - "Hold up both hands. How many fingers?"
                  - "Ten."
              - id: l1-f3
                type: true_false
                text: "Is this a double?"
                say: "Two spots and two spots. Is this a double?"
                show: { drawn: dots, groups: [2, 2], layout: dice }
                answer: true
                hints:
                  - "Are both sides the same?"
                  - "Two and two."
                  - "Yes."
              - id: l1-f4
                type: image_multiple_choice
                text: "Which is a double?"
                say: "Which one is a double? A double has the same on both sides."
                options: [{ drawn: dots, groups: [4, 4], layout: dice }, { drawn: dots, groups: [4, 2], layout: dice }, { drawn: dots, groups: [5, 3], layout: dice }]
                answer: "4+4"
                hints:
                  - "Look for two sides that match."
                  - "Four and four match."
                  - "The one with four and four."
              - id: l1-f5
                type: multiple_choice
                text: "Double 1"
                say: "What is double one?"
                show: { drawn: dots, groups: [1, 1], layout: dice }
                options: ["2", "1", "3"]
                answer: "2"
                hints:
                  - "One and one."
                  - "Count them."
                  - "Two."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Double 3"
                say: "What is double three?"
                options: ["6", "4", "5"]
                answer: "6"
                hints: ["Three and three."]
              - id: l1-s2
                type: true_false
                text: "Is this a double?"
                say: "Four spots and two spots. Is this a double?"
                show: { drawn: dots, groups: [4, 2], layout: dice }
                answer: false
                hints: ["Are both sides the same?"]
              - id: l1-s3
                type: multiple_choice
                text: "Double 4"
                say: "What is double four?"
                options: ["8", "5", "6"]
                answer: "8"
                hints: ["Four and four."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Which is a double?"
                say: "Which one is a double?"
                options: [{ drawn: dots, groups: [2, 3], layout: dice }, { drawn: dots, groups: [5, 5], layout: dice }, { drawn: dots, groups: [1, 4], layout: dice }]
                answer: "5+5"
                hints: ["Look for matching sides."]
              - id: l1-s5
                type: true_false
                text: "Does double 2 make 4?"
                say: "Does double two make four?"
                answer: true
                hints: ["Two and two."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Double 5"
                say: "What is double five?"
                options: ["10", "6", "11"]
                answer: "10"
              - id: l1-n2
                type: true_false
                text: "Is this a double?"
                say: "Five spots and five spots. Is this a double?"
                show: { drawn: dots, groups: [5, 5], layout: dice }
                answer: true
              - id: l1-n3
                type: true_false
                text: "Does double 3 make 6?"
                say: "Does double three make six?"
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Which is a double?"
                say: "Which one is a double?"
                options: [{ drawn: dots, groups: [3, 1], layout: dice }, { drawn: dots, groups: [2, 2], layout: dice }, { drawn: dots, groups: [4, 3], layout: dice }]
                answer: "2+2"
              - id: l1-n5
                type: true_false
                text: "Does double 4 make 5?"
                say: "Does double four make five?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Double 5"
            say: "What is double five?"
            show: { drawn: dots, groups: [5, 5], layout: row }
            options: ["10", "9", "5"]
            answer: "10"
          - id: l1-c2
            type: true_false
            text: "3 spots and 2 spots. Is this a double?"
            say: "Three spots and two spots. Is this a double?"
            show: { drawn: dots, groups: [3, 2], layout: dice }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Double 2"
            say: "What is double two?"
            options: ["4", "3", "2"]
            answer: "4"
          - id: l1-c4
            type: true_false
            text: "1 spot and 1 spot. Is this a double?"
            say: "One spot and one spot. Is this a double?"
            show: { drawn: dots, groups: [1, 1], layout: dice }
            answer: true
          - id: l1-c5
            type: image_multiple_choice
            text: "Which is a double?"
            say: "Which one is a double?"
            options: [{ drawn: dots, groups: [2, 4], layout: dice }, { drawn: dots, groups: [2, 2], layout: dice }, { drawn: dots, groups: [5, 1], layout: dice }]
            answer: "2+2"
          - id: l1-c6
            type: true_false
            text: "Does double 5 make 10?"
            say: "Does double five make ten?"
            answer: true

  - n: 2
    title: { de: Gerecht teilen, en: Sharing fairly }
    goal:
      de: "Teile gerecht zwischen zwei Freunden, so wie 6 Kekse, 3 für jeden."
      en: "Share fairly between two friends, like 6 biscuits make 3 each."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Two friends share six biscuits fairly. One for you, one for me, until they are all gone. Each friend has three."
            show: { drawn: dots, groups: [3, 3], layout: row }
          - say: "Fair means both get the same. Six shared fairly between two is three each. Double three is six, so half of six is three."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "2 friends share 4 apples fairly. How many each?"
                say: "Two friends share four apples fairly. How many apples does each friend get?"
                show: { drawn: dots, count: 4, layout: row }
                options: ["2", "4", "1"]
                answer: "2"
                hints:
                  - "One for you, one for me."
                  - "Each gets the same."
                  - "Two each."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "2 friends share 8 sweets. One gets 5, one gets 3. Is it fair?"
                say: "Two friends share eight sweets. One gets five, one gets three. Is it fair?"
                show: { drawn: dots, groups: [5, 3], layout: row }
                answer: false
                feedback:
                  "true": "Five and three are not the same. Fair would be four each."
                hints:
                  - "Do they both get the same?"
                  - "Five is more than three."
                  - "No, it is not fair."
              - id: l2-f3
                type: multiple_choice
                text: "2 friends share 10 stickers fairly. How many each?"
                say: "Two friends share ten stickers fairly. How many does each friend get?"
                show: { drawn: dots, count: 10, layout: row }
                options: ["5", "10", "4"]
                answer: "5"
                hints:
                  - "Share one at a time."
                  - "Double five is ten."
                  - "Five each."
              - id: l2-f4
                type: true_false
                text: "2 friends share 8 crayons. Each gets 4. Is it fair?"
                say: "Two friends share eight crayons. Each gets four. Is it fair?"
                show: { drawn: dots, groups: [4, 4], layout: row }
                answer: true
                hints:
                  - "Do they both get the same?"
                  - "Four and four."
                  - "Yes."
              - id: l2-f5
                type: multiple_choice
                text: "2 friends share 2 bananas fairly. How many each?"
                say: "Two friends share two bananas fairly. How many does each friend get?"
                show: { object: banana, count: 2, layout: row }
                options: ["1", "2", "0"]
                answer: "1"
                hints:
                  - "One for you, one for me."
                  - "Then there are none left."
                  - "One each."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "2 friends share 8 marbles fairly. How many each?"
                say: "Two friends share eight marbles fairly. How many does each friend get?"
                show: { drawn: dots, count: 8, layout: row }
                options: ["4", "8", "3"]
                answer: "4"
                hints: ["Each gets the same."]
              - id: l2-s2
                type: true_false
                text: "2 friends share 4 cakes. One gets 3, one gets 1. Is it fair?"
                say: "Two friends share four cakes. One gets three, one gets one. Is it fair?"
                show: { drawn: dots, groups: [3, 1], layout: row }
                answer: false
                hints: ["Are the two groups the same?"]
              - id: l2-s3
                type: multiple_choice
                text: "2 friends share 10 strawberries fairly. How many each?"
                say: "Two friends share ten strawberries fairly. How many does each friend get?"
                show: { object: strawberry, count: 10, layout: row }
                options: ["5", "10", "4"]
                answer: "5"
                hints: ["Share them one at a time."]
              - id: l2-s4
                type: true_false
                text: "2 friends share 10 balls. Each gets 5. Is it fair?"
                say: "Two friends share ten balls. Each gets five. Is it fair?"
                show: { drawn: dots, groups: [5, 5], layout: row }
                answer: true
                hints: ["Do they get the same?"]
              - id: l2-s5
                type: multiple_choice
                text: "2 friends share 4 carrots fairly. How many each?"
                say: "Two friends share four carrots fairly. How many does each friend get?"
                show: { object: carrot, count: 4, layout: row }
                options: ["2", "3", "4"]
                answer: "2"
                hints: ["One for you, one for me."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "2 friends share 10 cubes fairly. How many each?"
                say: "Two friends share ten cubes fairly. How many does each friend get?"
                show: { object: cube, count: 10, layout: row }
                options: ["5", "10", "6"]
                answer: "5"
              - id: l2-n2
                type: true_false
                text: "2 friends share 6 cars. One gets 4, one gets 2. Is it fair?"
                say: "Two friends share six cars. One gets four, one gets two. Is it fair?"
                show: { drawn: dots, groups: [4, 2], layout: row }
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "2 friends share 8 shells fairly. How many each?"
                say: "Two friends share eight shells fairly. How many does each friend get?"
                show: { object: shell, count: 8, layout: row }
                options: ["4", "2", "8"]
                answer: "4"
              - id: l2-n4
                type: true_false
                text: "2 friends share 2 hats. Each gets 1. Is it fair?"
                say: "Two friends share two hats. Each gets one. Is it fair?"
                show: { drawn: dots, groups: [1, 1], layout: row }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Double 5"
                say: "What is double five?"
                options: ["10", "5", "6"]
                answer: "10"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: double
            type: true_false
            text: "Does double 1 make 2?"
            say: "Does double one make two?"
            answer: true
          - id: l2-c2
            part: share
            type: multiple_choice
            text: "2 friends share 2 pears fairly. How many each?"
            say: "Two friends share two pears fairly. How many does each friend get?"
            show: { object: pear, count: 2, layout: row }
            options: ["1", "2", "3"]
            answer: "1"
          - id: l2-c3
            part: fair
            type: true_false
            text: "2 friends share 8 pencils. One gets 6, one gets 2. Is it fair?"
            say: "Two friends share eight pencils. One gets six, one gets two. Is it fair?"
            show: { drawn: dots, groups: [6, 2], layout: row }
            answer: false
          - id: l2-c4
            part: spot-double
            type: image_multiple_choice
            text: "Which is double 5?"
            say: "Which one is double five?"
            options: [{ drawn: dots, groups: [5, 5], layout: dice }, { drawn: dots, groups: [4, 5], layout: dice }, { drawn: dots, groups: [5, 6], layout: dice }]
            answer: "5+5"
          - id: l2-c5
            part: double
            type: multiple_choice
            text: "Double 2"
            say: "What is double two?"
            show: { drawn: dots, groups: [2, 2], layout: dice }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l2-c6
            part: spot-double
            type: true_false
            text: "6 spots and 6 spots. Is this a double?"
            say: "Six spots and six spots. Is this a double?"
            show: { drawn: dots, groups: [6, 6], layout: dice }
            answer: true
          - id: l2-c7
            part: share
            type: multiple_choice
            text: "2 friends share 8 apples fairly. How many each?"
            say: "Two friends share eight apples fairly. How many apples does each friend get?"
            show: { drawn: dots, count: 8, layout: row }
            options: ["2", "4", "8"]
            answer: "4"
          - id: l2-c8
            part: fair
            type: true_false
            text: "2 friends share 7 books. One gets 4, one gets 3. Is it fair?"
            say: "Two friends share seven books. One gets four, one gets three. Is it fair?"
            show: { drawn: dots, groups: [4, 3], layout: row }
            answer: false
          - id: l2-c9
            part: double
            type: multiple_choice
            text: "Double 5"
            say: "What is double five?"
            show: { drawn: dots, groups: [5, 5], layout: row }
            options: ["9", "10", "11"]
            answer: "10"
          - id: l2-c10
            part: spot-double
            type: image_multiple_choice
            text: "Which is double 2?"
            say: "Which one is double two?"
            options: [{ drawn: dots, groups: [2, 3], layout: dice }, { drawn: dots, groups: [1, 1], layout: dice }, { drawn: dots, groups: [2, 2], layout: dice }]
            answer: "2+2"
          - id: l2-c11
            part: share
            type: multiple_choice
            text: "2 friends share 4 balloons fairly. How many each?"
            say: "Two friends share four balloons fairly. How many balloons does each friend get?"
            show: { drawn: dots, count: 4, layout: row }
            options: ["1", "2", "3"]
            answer: "2"
          - id: l2-c12
            part: fair
            type: true_false
            text: "2 friends share 10 shells. One gets 6, one gets 4. Is it fair?"
            say: "Two friends share ten shells. One gets six, one gets four. Is it fair?"
            show: { drawn: dots, groups: [6, 4], layout: row }
            answer: false
          - id: l2-c13
            part: double
            type: true_false
            text: "Does double 2 make 3?"
            say: "Does double two make three?"
            answer: false
          - id: l2-c14
            part: spot-double
            type: true_false
            text: "5 spots and 4 spots. Is this a double?"
            say: "Five spots and four spots. Is this a double?"
            show: { drawn: dots, groups: [5, 4], layout: dice }
            answer: false
          - id: l2-c15
            part: share
            type: multiple_choice
            text: "2 friends share 10 cakes fairly. How many each?"
            say: "Two friends share ten cakes fairly. How many cakes does each friend get?"
            show: { drawn: dots, count: 10, layout: row }
            options: ["4", "5", "6"]
            answer: "5"
          - id: l2-c16
            part: fair
            type: true_false
            text: "2 friends share 4 cups. Each gets 2. Is it fair?"
            say: "Two friends share four cups. Each gets two. Is it fair?"
            show: { drawn: dots, groups: [2, 2], layout: row }
            answer: true
          - id: l2-c17
            part: double
            type: true_false
            text: "Does double 5 make 6?"
            say: "Does double five make six?"
            answer: false
          - id: l2-c18
            part: spot-double
            type: image_multiple_choice
            text: "Which is a double?"
            say: "Which one is a double?"
            options: [{ drawn: dots, groups: [2, 1], layout: dice }, { drawn: dots, groups: [1, 1], layout: dice }, { drawn: dots, groups: [1, 3], layout: dice }]
            answer: "1+1"
          - id: l2-c19
            part: share
            type: true_false
            text: "2 friends share 10 stickers fairly. Does each get 4?"
            say: "Two friends share ten stickers fairly. Does each friend get four?"
            show: { drawn: dots, count: 10, layout: row }
            answer: false
          - id: l2-c20
            part: fair
            type: image_multiple_choice
            text: "2 friends share 10 sweets. Which is fair?"
            say: "Two friends share ten sweets. Which picture shows a fair share?"
            options: [{ drawn: dots, groups: [7, 3], layout: row }, { drawn: dots, groups: [5, 5], layout: row }, { drawn: dots, groups: [9, 1], layout: row }]
            answer: "5+5"
