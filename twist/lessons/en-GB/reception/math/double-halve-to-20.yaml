# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.double-halve-to-20
skill: math.numbers-to-20.double-halve-to-20
curriculum: en-GB
language: en
title:
  de: Verdoppeln und Halbieren bis 20
  en: Doubles and sharing
summary: >
  Double facts to 10 (the Early Learning Goal) and sharing fairly into two
  equal groups. Lesson 1 makes doubles with dots, the same number twice;
  lesson 2 shares fairly between two and links halves to doubles, and
  ends with the skill check. Spoken questions; numbers say themselves.
metadata:
  year: reception
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.partition-to-10]
  also_practises: [math.numbers-to-20.subitize-to-10]
  vocabulary: { en: [double, the same, share, fair, equal, half] }
  no_reading: true
  forms: [drawn, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: double-as-one-more
      what: Thinks double three is four
      addressed: Learn says a double is the same number twice; options include one more, with feedback in the full stage
    - id: unfair-share
      what: Calls an unequal share fair
      addressed: lesson 2 shares one each in turn; true/false tasks show unequal shares in each stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Verdoppeln, en: Doubles }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Here are three spots on one side."
            show: { drawn: dots, count: 3, layout: dice }
          - say: "And three spots on the other side, the same. Three and three make six. That is double three."
            show: { drawn: dots, groups: [3, 3], layout: dice }
          - say: "A double is the same number twice. Double four is four and four: eight."
            show: { drawn: dots, groups: [4, 4], layout: dice }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Double 2"
                say: "Two and two, the same. What is double two?"
                show: { drawn: dots, groups: [2, 2], layout: dice }
                options: ["4", "3", "2"]
                answer: "4"
                feedback:
                  "3": "Double two is two and two. That makes four."
                hints:
                  - "Two on one side, two on the other."
                  - "Count them all."
                  - "Four."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Double 5"
                say: "What is double five?"
                show: { drawn: dots, groups: [5, 5], layout: dice }
                options: ["10", "6", "5"]
                answer: "10"
                hints:
                  - "Five and five."
                  - "Hold up both hands. How many fingers?"
                  - "Ten."
              - id: l1-f3
                type: true_false
                text: "Is this a double?"
                say: "Two spots and two spots. Is this a double?"
                show: { drawn: dots, groups: [2, 2], layout: dice }
                answer: true
                hints:
                  - "Are both sides the same?"
                  - "Two and two."
                  - "Yes."
              - id: l1-f4
                type: image_multiple_choice
                text: "Which is a double?"
                say: "Which one is a double? A double has the same on both sides."
                options: [{ drawn: dots, groups: [4, 4], layout: dice }, { drawn: dots, groups: [4, 2], layout: dice }, { drawn: dots, groups: [5, 3], layout: dice }]
                answer: "4+4"
                hints:
                  - "Look for two sides that match."
                  - "Four and four match."
                  - "The one with four and four."
              - id: l1-f5
                type: multiple_choice
                text: "Double 1"
                say: "What is double one?"
                show: { drawn: dots, groups: [1, 1], layout: dice }
                options: ["2", "1", "3"]
                answer: "2"
                hints:
                  - "One and one."
                  - "Count them."
                  - "Two."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Double 3"
                say: "What is double three?"
                options: ["6", "4", "5"]
                answer: "6"
                hints: ["Three and three."]
              - id: l1-s2
                type: true_false
                text: "Is this a double?"
                say: "Four spots and two spots. Is this a double?"
                show: { drawn: dots, groups: [4, 2], layout: dice }
                answer: false
                hints: ["Are both sides the same?"]
              - id: l1-s3
                type: multiple_choice
                text: "Double 4"
                say: "What is double four?"
                options: ["8", "5", "6"]
                answer: "8"
                hints: ["Four and four."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Which is a double?"
                say: "Which one is a double?"
                options: [{ drawn: dots, groups: [2, 3], layout: dice }, { drawn: dots, groups: [5, 5], layout: dice }, { drawn: dots, groups: [1, 4], layout: dice }]
                answer: "5+5"
                hints: ["Look for matching sides."]
              - id: l1-s5
                type: true_false
                text: "Does double 2 make 4?"
                say: "Does double two make four?"
                answer: true
                hints: ["Two and two."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Double 5"
                say: "What is double five?"
                options: ["10", "6", "11"]
                answer: "10"
              - id: l1-n2
                type: true_false
                text: "Is this a double?"
                say: "Five spots and five spots. Is this a double?"
                show: { drawn: dots, groups: [5, 5], layout: dice }
                answer: true
              - id: l1-n3
                type: true_false
                text: "Does double 3 make 6?"
                say: "Does double three make six?"
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Which is a double?"
                say: "Which one is a double?"
                options: [{ drawn: dots, groups: [3, 1], layout: dice }, { drawn: dots, groups: [2, 2], layout: dice }, { drawn: dots, groups: [4, 3], layout: dice }]
                answer: "2+2"
              - id: l1-n5
                type: true_false
                text: "Does double 4 make 5?"
                say: "Does double four make five?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Double 4"
            say: "What is double four?"
            show: { drawn: dots, groups: [4, 4], layout: dice }
            options: ["8", "4", "5"]
            answer: "8"
          - id: l1-c2
            type: true_false
            text: "Is this a double?"
            say: "Three spots and two spots. Is this a double?"
            show: { drawn: dots, groups: [3, 2], layout: dice }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Double 2"
            say: "What is double two?"
            options: ["4", "3", "2"]
            answer: "4"

  - n: 2
    title: { de: Gerecht teilen, en: Sharing fairly }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Two friends share six biscuits fairly. One for you, one for me, until they are all gone. Each friend has three."
            show: { drawn: dots, groups: [3, 3], layout: row }
          - say: "Fair means both get the same. Six shared fairly between two is three each. Double three is six, so half of six is three."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many each?"
                say: "Two friends share four apples fairly. How many apples does each friend get?"
                show: { drawn: dots, count: 4, layout: row }
                options: ["2", "4", "1"]
                answer: "2"
                hints:
                  - "One for you, one for me."
                  - "Each gets the same."
                  - "Two each."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Is it fair?"
                say: "Two friends share eight sweets. One gets five, one gets three. Is it fair?"
                show: { drawn: dots, groups: [5, 3], layout: row }
                answer: false
                feedback:
                  "true": "Five and three are not the same. Fair would be four each."
                hints:
                  - "Do they both get the same?"
                  - "Five is more than three."
                  - "No, it is not fair."
              - id: l2-f3
                type: multiple_choice
                text: "How many each?"
                say: "Two friends share ten stickers fairly. How many does each friend get?"
                show: { drawn: dots, count: 10, layout: row }
                options: ["5", "10", "4"]
                answer: "5"
                hints:
                  - "Share one at a time."
                  - "Double five is ten."
                  - "Five each."
              - id: l2-f4
                type: true_false
                text: "Is it fair?"
                say: "Two friends share eight crayons. Each gets four. Is it fair?"
                show: { drawn: dots, groups: [4, 4], layout: row }
                answer: true
                hints:
                  - "Do they both get the same?"
                  - "Four and four."
                  - "Yes."
              - id: l2-f5
                type: multiple_choice
                text: "How many each?"
                say: "Two friends share two bananas fairly. How many does each friend get?"
                options: ["1", "2", "0"]
                answer: "1"
                hints:
                  - "One for you, one for me."
                  - "Then there are none left."
                  - "One each."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many each?"
                say: "Two friends share eight marbles fairly. How many does each friend get?"
                show: { drawn: dots, count: 8, layout: row }
                options: ["4", "8", "3"]
                answer: "4"
                hints: ["Each gets the same."]
              - id: l2-s2
                type: true_false
                text: "Is it fair?"
                say: "Two friends share four cakes. One gets three, one gets one. Is it fair?"
                show: { drawn: dots, groups: [3, 1], layout: row }
                answer: false
                hints: ["Are the two groups the same?"]
              - id: l2-s3
                type: multiple_choice
                text: "How many each?"
                say: "Two friends share ten grapes fairly. How many does each friend get?"
                options: ["5", "10", "4"]
                answer: "5"
                hints: ["Share them one at a time."]
              - id: l2-s4
                type: true_false
                text: "Is it fair?"
                say: "Two friends share ten balls. Each gets five. Is it fair?"
                show: { drawn: dots, groups: [5, 5], layout: row }
                answer: true
                hints: ["Do they get the same?"]
              - id: l2-s5
                type: multiple_choice
                text: "How many each?"
                say: "Two friends share four carrots fairly. How many does each friend get?"
                options: ["2", "3", "4"]
                answer: "2"
                hints: ["One for you, one for me."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many each?"
                say: "Two friends share ten blocks fairly. How many does each friend get?"
                options: ["5", "10", "6"]
                answer: "5"
              - id: l2-n2
                type: true_false
                text: "Is it fair?"
                say: "Two friends share six cars. One gets four, one gets two. Is it fair?"
                show: { drawn: dots, groups: [4, 2], layout: row }
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "How many each?"
                say: "Two friends share eight shells fairly. How many does each friend get?"
                options: ["4", "2", "8"]
                answer: "4"
              - id: l2-n4
                type: true_false
                text: "Is it fair?"
                say: "Two friends share two hats. Each gets one. Is it fair?"
                show: { drawn: dots, groups: [1, 1], layout: row }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Double 5"
                say: "What is double five?"
                options: ["10", "5", "6"]
                answer: "10"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Double 1"
            say: "What is double one?"
            options: ["2", "1", "3"]
            answer: "2"
          - id: l2-c2
            type: multiple_choice
            text: "How many each?"
            say: "Two friends share six cherries fairly. How many does each friend get?"
            show: { drawn: dots, count: 6, layout: row }
            options: ["3", "6", "4"]
            answer: "3"
          - id: l2-c3
            type: true_false
            text: "Is it fair?"
            say: "Two friends share eight pencils. One gets six, one gets two. Is it fair?"
            show: { drawn: dots, groups: [6, 2], layout: row }
            answer: false
          - id: l2-c4
            type: image_multiple_choice
            text: "Which is a double?"
            say: "Which one is a double?"
            options: [{ drawn: dots, groups: [3, 3], layout: dice }, { drawn: dots, groups: [3, 4], layout: dice }, { drawn: dots, groups: [2, 5], layout: dice }]
            answer: "3+3"
