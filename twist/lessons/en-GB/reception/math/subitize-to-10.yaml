            say: "Look carefully. How many dots?"
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1], flash: 1 }
            options: ["6", "8", "7"]
            answer: "6"
          - id: l2-c19
            part: find
            type: image_multiple_choice
            text: "Tap the dice with 2 dots."
