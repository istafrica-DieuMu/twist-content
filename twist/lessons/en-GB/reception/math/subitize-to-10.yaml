# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.subitize-to-10
skill: math.numbers-to-20.subitize-to-10
curriculum: en-GB
language: en
title:
  de: Anzahlen auf einen Blick
  en: Seeing amounts at a glance
summary: >
  Children see how many without counting one by one (subitising). Lesson 1
  uses dice patterns to 5, shown for two seconds, as the EYFS goal asks.
  Lesson 2 goes on to "five and a bit": a full row of a ten frame is five,
  and seven is five and two. It ends with the skill check.
metadata:
  year: reception
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.count-to-5]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { en: [dice, dots, at a glance, ten frame, full, five and a bit] }
  no_reading: true
  forms: [drawn, audio]
  drawn: [dots, ten-frame]
  facets: []
  parts:
    - { id: small, what: { de: "bis zu 5 Punkte auf einen Blick erkennen, als Würfelbild oder verstreut", en: "seeing up to 5 dots at a glance, as a dice pattern or spread out" } }
    - { id: five-and-bit, what: { de: "6 bis 10 im Zehnerfeld als fünf und noch ein paar sehen", en: seeing 6 to 10 on a ten frame as five and a bit } }
    - { id: find, what: { de: das Würfelbild oder Zehnerfeld mit einer genannten Anzahl finden, en: finding the dice or ten frame that shows a given number } }
  misconceptions:
    - id: count-each
      what: Counts every dot instead of seeing the pattern, and runs out of time
      addressed: dots are shown for two seconds only; full-stage hints describe the pattern ("like the corners of a square")
    - id: five-unseen
      what: Does not use the full row of five and counts the whole ten frame from one
      addressed: lesson 2 Learn names a full row as five; hints start with "Is the top row full? Then that's five."
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Würfelbilder, en: Dice patterns }
    goal:
      de: "Schau auf einen Würfel und sag sofort, wie viele Punkte es sind, ohne zu zählen."
      en: "Look at a dice and say how many dots straight away, without counting."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "On a dice you don't need to count. You can see it straight away. Four dots are like the four corners of a square."
            show: { drawn: dots, count: 4, layout: dice }
          - say: "Five is like four, with one dot in the middle."
            show: { drawn: dots, count: 5, layout: dice }
          - say: "Three dots make a line from corner to corner. Soon you will only see the dots for a moment. Look carefully!"
            show: { drawn: dots, count: 3, layout: dice }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 4, layout: dice, flash: 2 }
                options: ["3", "4", "5"]
                answer: "4"
                hints:
                  - "Think of the picture on the dice."
                  - "The dots were like the corners of a square."
                  - "There are 4 dots."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Which dice has 5 dots?"
                say: "Which dice has five dots? Tap it."
                options:
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                answer: "5"
                hints:
                  - "Five is like four, with one more."
                  - "Find the dice with a dot in the middle."
                  - "It is the one with four corners and a dot in the middle."
              - id: l1-f3
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 2, layout: dice, flash: 2 }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Were there lots of dots or just a few?"
                  - "One dot at the top, one at the bottom."
                  - "There are 2 dots."
                difficulty: easy
              - id: l1-f4
                type: true_false
                text: "Are there 3 dots?"
                say: "Look carefully. Are there three dots?"
                show: { drawn: dots, count: 3, layout: dice, flash: 2 }
                answer: true
                hints:
                  - "How were the dots lined up?"
                  - "They made a line from corner to corner."
                  - "Yes, there are 3 dots."
              - id: l1-f5
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 5, layout: dice, flash: 2 }
                options: ["4", "5", "3"]
                answer: "5"
                feedback:
                  "4": "Four is just the corners. This one had a dot in the middle too."
                hints:
                  - "Was there a dot in the middle?"
                  - "Four corners and one in the middle."
                  - "There are 5 dots."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 3, layout: dice, flash: 1.5 }
                options: ["2", "3", "4"]
                answer: "3"
                hints: ["Did the dots make a line from corner to corner?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Which dice has 4 dots?"
                say: "Which dice has four dots? Tap it."
                options:
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                answer: "4"
                hints: ["Four dots are like the corners of a square."]
              - id: l1-s3
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 3, layout: scattered, flash: 2 }
                options: ["2", "3", "4"]
                answer: "3"
                hints: ["These dots are spread out. Were there more than two?"]
              - id: l1-s4
                type: true_false
                text: "Are there 4 dots?"
                say: "Look carefully. Are there four dots?"
                show: { drawn: dots, count: 5, layout: dice, flash: 2 }
                answer: false
                hints: ["Was there a dot in the middle?"]
              - id: l1-s5
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 1, layout: dice, flash: 1.5 }
                options: ["1", "2", "3"]
                answer: "1"
                hints: ["How many dots were in the middle?"]
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 4, layout: dice, flash: 1.5 }
                options: ["5", "4", "3"]
                answer: "4"
              - id: l1-n2
                type: image_multiple_choice
                text: "Which dice has 2 dots?"
                say: "Which dice has two dots? Tap it."
                options:
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                answer: "2"
              - id: l1-n3
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 4, layout: scattered, flash: 2 }
                options: ["3", "4", "5"]
                answer: "4"
              - id: l1-n4
                type: true_false
                text: "Are there 5 dots?"
                say: "Look carefully. Are there five dots?"
                show: { drawn: dots, count: 5, layout: dice, flash: 1.5 }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 2, layout: scattered, flash: 1 }
                options: ["1", "2", "3"]
                answer: "2"
                difficulty: stretch

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many dots?"
            say: "Look carefully. How many dots?"
            show: { drawn: dots, count: 5, layout: dice, flash: 2 }
            options: ["5", "3", "4"]
            answer: "5"
          - id: l1-c2
            type: image_multiple_choice
            text: "Which dice has 3 dots?"
            say: "Which dice has three dots? Tap it."
            options:
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 3, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
            answer: "3"
          - id: l1-c3
            type: multiple_choice
            text: "How many dots?"
            say: "Look carefully. How many dots?"
            show: { drawn: dots, count: 1, layout: scattered, flash: 2 }
            options: ["1", "2", "3"]
            answer: "1"
          - id: l1-c4
            type: multiple_choice
            text: "How many dots?"
            say: "Look carefully. How many dots?"
            show: { drawn: dots, count: 5, layout: scattered, flash: 2 }
            options: ["4", "5", "6"]
            answer: "5"
          - id: l1-c5
            type: true_false
            text: "Are there 2 dots?"
            say: "Look carefully. Are there two dots?"
            show: { drawn: dots, count: 3, layout: dice, flash: 2 }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Which dice has 1 dot?"
            say: "Which dice has one dot? Tap it."
            options:
              - { drawn: dots, count: 2, layout: dice }
              - { drawn: dots, count: 3, layout: dice }
              - { drawn: dots, count: 1, layout: dice }
            answer: "1"

  - n: 2
    title: { de: Die Kraft der 5, en: Five and a bit }
    goal:
      de: "Erkenne die volle Fünferreihe im Zehnerfeld und sieh so, dass 5 und 2 zusammen 7 sind."
      en: "Spot a full row of five in the ten frame, and see that 5 and 2 make 7."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "This is a ten frame. When the top row is full, that's five. You don't need to count it."
            show: { drawn: ten-frame, filled: 5 }
          - say: "The top row is full: five. There are two more underneath. Five and two make seven."
            show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
          - say: "When both rows are full, that's ten."
            show: { drawn: ten-frame, filled: 10 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: ten-frame, filled: 6, colour_split: [5, 1], flash: 2 }
                options: ["5", "6", "7"]
                answer: "6"
                hints:
                  - "Is the top row full? Then that's five."
                  - "Five on top, one underneath."
                  - "Five and one make 6."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Which ten frame has 7 dots?"
                say: "Which ten frame has seven dots? Tap it."
                options:
                  - { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
                  - { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                  - { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                answer: "7"
                hints:
                  - "Seven is five and a bit."
                  - "Five and two make seven."
                  - "Find the frame with two underneath the full row."
              - id: l2-f3
                type: true_false
                text: "Are there 10 dots?"
                say: "Look carefully. Are there ten dots?"
                show: { drawn: ten-frame, filled: 10, flash: 2 }
                answer: true
                hints:
                  - "Were both rows full?"
                  - "Two full rows are five and five."
                  - "Yes, there are 10 dots."
              - id: l2-f4
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: ten-frame, filled: 8, colour_split: [5, 3], flash: 2 }
                options: ["7", "8", "9"]
                answer: "8"
                hints:
                  - "Is the top row full?"
                  - "Five on top, three underneath."
                  - "Five and three make 8."
              - id: l2-f5
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: ten-frame, filled: 5, flash: 2 }
                options: ["4", "5", "6"]
                answer: "5"
                hints:
                  - "Was there anything in the bottom row?"
                  - "Only the top row was full."
                  - "A full row is 5."
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2], flash: 2 }
                options: ["6", "7", "8"]
                answer: "7"
                hints: ["Five on top. How many underneath?"]
              - id: l2-s2
                type: image_multiple_choice
                text: "Which ten frame has 9 dots?"
                say: "Which ten frame has nine dots? Tap it."
                options:
                  - { drawn: ten-frame, filled: 10 }
                  - { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                  - { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                answer: "9"
                hints: ["Nine is just one less than a full frame."]
              - id: l2-s3
                type: true_false
                text: "Are there 6 dots?"
                say: "Look carefully. Are there six dots?"
                show: { drawn: ten-frame, filled: 8, colour_split: [5, 3], flash: 2 }
                answer: false
                hints: ["How many were underneath the full row?"]
              - id: l2-s4
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 4, layout: dice, flash: 1.5 }
                options: ["3", "4", "5"]
                answer: "4"
                hints: ["Think of the corners of a square."]
              - id: l2-s5
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: ten-frame, filled: 9, colour_split: [5, 4], flash: 2 }
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["Was one space empty?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: ten-frame, filled: 6, colour_split: [5, 1], flash: 1.5 }
                options: ["7", "5", "6"]
                answer: "6"
              - id: l2-n2
                type: image_multiple_choice
                text: "Which ten frame has 10 dots?"
                say: "Which ten frame has ten dots? Tap it."
                options:
                  - { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                  - { drawn: ten-frame, filled: 10 }
                  - { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                answer: "10"
              - id: l2-n3
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: ten-frame, filled: 8, colour_split: [5, 3], flash: 1.5 }
                options: ["8", "9", "7"]
                answer: "8"
              - id: l2-n4
                type: true_false
                text: "Are there 7 dots?"
                say: "Look carefully. Are there seven dots?"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2], flash: 1.5 }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "How many dots?"
                say: "Look carefully. How many dots?"
                show: { drawn: dots, count: 5, layout: dice, flash: 1 }
                options: ["4", "5", "6"]
                answer: "5"
                difficulty: stretch

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: small
            type: multiple_choice
            text: "How many dots?"
            say: "Look carefully. How many dots?"
            show: { drawn: dots, count: 5, layout: dice, flash: 1.5 }
            options: ["6", "5", "7"]
            answer: "5"
          - id: l2-c2
            part: five-and-bit
            type: multiple_choice
            text: "How many dots?"
            say: "Look carefully. How many dots?"
            show: { drawn: ten-frame, filled: 9, colour_split: [5, 4], flash: 1.5 }
            options: ["9", "7", "8"]
            answer: "9"
          - id: l2-c3
            part: find
            type: image_multiple_choice
            text: "Which ten frame has 8 dots?"
            say: "Which ten frame has eight dots? Tap it."
            options:
              - { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
              - { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
              - { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
            answer: "8"
          - id: l2-c4
            part: small
            type: multiple_choice
            text: "How many dots?"
            say: "Look carefully. How many dots?"
            show: { drawn: dots, count: 3, layout: scattered, flash: 1.5 }
            options: ["1", "3", "2"]
            answer: "3"
          - id: l2-c5
            part: small
            type: multiple_choice
            text: "How many dots?"
            say: "Look carefully. How many dots?"
            show: { drawn: dots, count: 3, layout: dice, flash: 1 }
            options: ["5", "3", "4"]
            answer: "3"
          - id: l2-c6
            part: five-and-bit
            type: multiple_choice
            text: "How many dots?"
            say: "Look carefully. How many dots?"
            show: { drawn: ten-frame, filled: 7, colour_split: [5, 2], flash: 1.5 }
            options: ["9", "7", "8"]
            answer: "7"
          - id: l2-c7
            part: find
            type: image_multiple_choice
            text: "Tap the dice with 4 dots."
            say: "Find the dice with four dots and tap it."
            options:
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 5, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
            answer: "4"
          - id: l2-c8
            part: find
            type: image_multiple_choice
            text: "Which ten frame has 6 dots?"
            say: "Which ten frame has six dots? Tap it."
            options:
              - { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
              - { drawn: ten-frame, filled: 5 }
              - { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
            answer: "6"
          - id: l2-c9
            part: small
            type: true_false
            text: "Are there 4 dots?"
            say: "Look carefully. Are there four dots?"
            show: { drawn: dots, count: 4, layout: dice, flash: 1.5 }
            answer: true
          - id: l2-c10
            part: five-and-bit
            type: multiple_choice
            text: "How many dots?"
            say: "Look carefully. How many dots?"
            show: { drawn: ten-frame, filled: 10, flash: 1.5 }
            options: ["8", "9", "10"]
            answer: "10"
          - id: l2-c11
            part: five-and-bit
            type: true_false
            text: "Are there 6 dots?"
            say: "Look carefully. Are there six dots?"
