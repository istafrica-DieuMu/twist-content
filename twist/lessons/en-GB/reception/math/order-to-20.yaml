# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.order-to-20
skill: math.numbers-to-20.order-to-20
curriculum: en-GB
language: en
title:
  de: Zahlen bis 20 ordnen
  en: Counting and ordering to 20
summary: >
  Counting forwards and backwards to 20 and finding numbers on a number
  line. Lesson 1 says the number after and before, across ten; lesson 2
  puts numbers in order and finds missing numbers in a count, and ends
  with the skill check. Spoken questions; numbers say themselves.
metadata:
  year: reception
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.teens, math.numbers-to-20.order-to-10]
  also_practises: [math.numbers-to-20.teens]
  vocabulary: { en: [after, before, next, count on, count back, number line] }
  no_reading: true
  forms: [drawn, audio]
  drawn: [number-line]
  facets: []
  parts:
    - { id: before-after, what: { de: die Zahl vor und nach einer Zahl bis 20 nennen, en: naming the number before and after a number to 20 } }
    - { id: number-line, what: { de: Zahlen bis 20 am Zahlenstrahl finden, en: finding numbers to 20 on a number line } }
    - { id: order, what: { de: "Zahlen bis 20 ordnen, vorwärts und rückwärts", en: "putting numbers to 20 in order, forwards and backwards" } }
    - { id: missing, what: { de: die fehlende Zahl beim Vorwärts- und Rückwärtszählen finden, en: finding the missing number when counting on or back } }
  misconceptions:
    - id: stuck-at-ten
      what: Counting on, goes from nine to "ten-one", or counting back skips ten
      addressed: Learn counts across ten both ways; tasks across ten in every stage, with feedback in the full stage
    - id: before-after-mixed
      what: Gives the number after when asked for the number before
      addressed: Learn says before is one less, after is one more, with hops on the number line
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Davor und danach, en: Before and after }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Let's count on the number line: eight, nine, ten, eleven, twelve. After ten comes eleven."
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[8, 1], [9, 1], [10, 1], [11, 1]] }
          - say: "The number after is one more. After fourteen comes fifteen."
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[14, 1]] }
          - say: "The number before is one less. Before fourteen comes thirteen."
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[14, -1]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What comes after 9?"
                say: "Count with me: seven, eight, nine. What number comes after nine?"
                options: ["10", "8", "11"]
                answer: "10"
                hints:
                  - "After means one more."
                  - "Nine, then ..."
                  - "Ten."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What comes before 12?"
                say: "What number comes before twelve?"
                show: { drawn: number-line, from: 0, to: 20, labels: all }
                options: ["11", "13", "10"]
                answer: "11"
                feedback:
                  "13": "Thirteen comes after twelve. Before means one less: eleven."
                hints:
                  - "Before means one less."
                  - "Count back one from twelve."
                  - "Eleven."
              - id: l1-f3
                type: point_on_line
                text: "Where is 15?"
                say: "Find fifteen on the number line. Tap it."
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 15
                hints:
                  - "Find the ten in the middle."
                  - "Count on five from ten."
                  - "Tap the fifth mark after ten."
              - id: l1-f4
                type: true_false
                text: "Is 17 after 16?"
                say: "Does seventeen come after sixteen?"
                answer: true
                hints:
                  - "Count: sixteen, seventeen."
                  - "Seventeen is one more."
                  - "Yes."
              - id: l1-f5
                type: multiple_choice
                text: "What comes before 10?"
                say: "Count back: twelve, eleven, ten. What number comes before ten?"
                options: ["9", "11", "1"]
                answer: "9"
                hints:
                  - "Count back one from ten."
                  - "Ten, then ..."
                  - "Nine."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What comes after 15?"
                say: "What number comes after fifteen?"
                options: ["16", "14", "51"]
                answer: "16"
                hints: ["After means one more."]
              - id: l1-s2
                type: multiple_choice
                text: "What comes before 19?"
                say: "What number comes before nineteen?"
                show: { drawn: number-line, from: 0, to: 20, labels: all }
                options: ["18", "20", "9"]
                answer: "18"
                hints: ["Before means one less."]
              - id: l1-s3
                type: point_on_line
                text: "Where is 12?"
                say: "Find twelve on the number line. Tap it."
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 12
                hints: ["Start at ten."]
              - id: l1-s4
                type: true_false
                text: "Is 13 before 12?"
                say: "Does thirteen come before twelve?"
                answer: false
                hints: ["Count: eleven, twelve, thirteen."]
              - id: l1-s5
                type: multiple_choice
                text: "What comes after 19?"
                say: "What number comes after nineteen?"
                options: ["20", "18", "10"]
                answer: "20"
                hints: ["One more than nineteen."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What comes after 13?"
                say: "What number comes after thirteen?"
                options: ["14", "12", "31"]
                answer: "14"
              - id: l1-n2
                type: multiple_choice
                text: "What comes before 11?"
                say: "What number comes before eleven?"
                options: ["10", "12", "1"]
                answer: "10"
              - id: l1-n3
                type: point_on_line
                text: "Where is 18?"
                say: "Find eighteen on the number line. Tap it."
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 18
              - id: l1-n4
                type: true_false
                text: "Is 20 after 19?"
                say: "Does twenty come after nineteen?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "What comes before 16?"
                say: "What number comes before sixteen?"
                options: ["15", "17", "6"]
                answer: "15"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What comes after 11?"
            say: "What number comes after eleven?"
            options: ["12", "10", "21"]
            answer: "12"
          - id: l1-c2
            type: multiple_choice
            text: "What comes before 17?"
            say: "What number comes before seventeen?"
            options: ["16", "18", "7"]
            answer: "16"
          - id: l1-c3
            type: point_on_line
            text: "Where is 17?"
            say: "Find seventeen on the number line. Tap it."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 17
          - id: l1-c4
            type: multiple_choice
            text: "What comes after 17?"
            say: "What number comes after seventeen?"
            options: ["18", "16", "71"]
            answer: "18"
          - id: l1-c5
            type: point_on_line
            text: "Where is 13?"
            say: "Find thirteen on the number line. Tap it."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 13
          - id: l1-c6
            type: true_false
            text: "Is 19 before 18?"
            say: "Does nineteen come before eighteen?"
            answer: false

  - n: 2
    title: { de: In der richtigen Reihenfolge, en: In order }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Counting back crosses ten too: thirteen, twelve, eleven, ten, nine. Don't forget ten!"
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[13, -1], [12, -1], [11, -1], [10, -1]] }
          - say: "To put numbers in order, start with the smallest. Eleven, twelve, thirteen, fourteen: each one is one more."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Put them in order."
                say: "Put the numbers in order. Smallest first."
                options: ["12", "10", "13", "11"]
                slot_count: 4
                answer: ["10", "11", "12", "13"]
                hints:
                  - "Which number is smallest?"
                  - "Ten, then eleven."
                  - "Ten, eleven, twelve, thirteen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is missing? 9, 10, _, 12"
                say: "Nine, ten, then a gap, then twelve. Which number goes in the gap?"
                options: ["11", "13", "8"]
                answer: "11"
                hints:
                  - "What comes after ten?"
                  - "Ten, eleven, twelve."
                  - "Eleven."
              - id: l2-f3
                type: true_false
                text: "Is this right? 12, 11, 9, 8"
                say: "Someone counts back: twelve, eleven, nine, eight. Is that right?"
                answer: false
                feedback:
                  "true": "Ten is missing. Count back: twelve, eleven, ten, nine."
                hints:
                  - "Count back from twelve yourself."
                  - "Twelve, eleven, ..."
                  - "No, ten is missing."
              - id: l2-f4
                type: ordering
                text: "Count back."
                say: "Count back. Biggest number first."
                options: ["18", "20", "17", "19"]
                slot_count: 4
                answer: ["20", "19", "18", "17"]
                hints:
                  - "Which number is biggest?"
                  - "Twenty, then nineteen."
                  - "Twenty, nineteen, eighteen, seventeen."
              - id: l2-f5
                type: multiple_choice
                text: "What is missing? 15, 16, _, 18"
                say: "Fifteen, sixteen, then a gap, then eighteen. Which number goes in the gap?"
                options: ["17", "19", "14"]
                answer: "17"
                hints:
                  - "What comes after sixteen?"
                  - "Sixteen, seventeen."
                  - "Seventeen."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Put them in order."
                say: "Put the numbers in order. Smallest first."
                options: ["16", "18", "15", "17"]
                slot_count: 4
                answer: ["15", "16", "17", "18"]
                hints: ["Start with the smallest."]
              - id: l2-s2
                type: multiple_choice
                text: "What is missing? 11, 10, _, 8"
                say: "Count back: eleven, ten, then a gap, then eight. Which number goes in the gap?"
                options: ["9", "12", "7"]
                answer: "9"
                hints: ["What comes before ten?"]
              - id: l2-s3
                type: true_false
                text: "Is this right? 17, 18, 19, 20"
                say: "Someone counts on: seventeen, eighteen, nineteen, twenty. Is that right?"
                answer: true
                hints: ["Is each number one more?"]
              - id: l2-s4
                type: ordering
                text: "Count back."
                say: "Count back. Biggest number first."
                options: ["9", "11", "8", "10"]
                slot_count: 4
                answer: ["11", "10", "9", "8"]
                hints: ["Start with the biggest."]
              - id: l2-s5
                type: multiple_choice
                text: "What is missing? 18, _, 20"
                say: "Eighteen, then a gap, then twenty. Which number goes in the gap?"
                options: ["19", "17", "21"]
                answer: "19"
                hints: ["One more than eighteen."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Put them in order."
                say: "Put the numbers in order. Smallest first."
                options: ["10", "8", "9", "11"]
                slot_count: 4
                answer: ["8", "9", "10", "11"]
              - id: l2-n2
                type: multiple_choice
                text: "What is missing? 13, 14, _, 16"
                say: "Thirteen, fourteen, then a gap, then sixteen. Which number goes in the gap?"
                options: ["15", "17", "12"]
                answer: "15"
              - id: l2-n3
                type: true_false
                text: "Is this right? 14, 13, 12, 11"
                say: "Someone counts back: fourteen, thirteen, twelve, eleven. Is that right?"
                answer: true
              - id: l2-n4
                type: ordering
                text: "Count back."
                say: "Count back. Biggest number first."
                options: ["14", "16", "13", "15"]
                slot_count: 4
                answer: ["16", "15", "14", "13"]
              - id: l2-n5
                type: multiple_choice
                text: "What is missing? 11, _, 9"
                say: "Count back: eleven, then a gap, then nine. Which number goes in the gap?"
                options: ["10", "12", "8"]
                answer: "10"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: order
            type: ordering
            text: "Put them in order."
            say: "Put the numbers in order. Smallest first."
            options: ["11", "9", "12", "10"]
            slot_count: 4
            answer: ["9", "10", "11", "12"]
          - id: l2-c2
            part: before-after
            type: multiple_choice
            text: "What comes before 18?"
            say: "What number comes before eighteen?"
            options: ["17", "19", "8"]
            answer: "17"
          - id: l2-c3
            part: missing
            type: multiple_choice
            text: "What is missing? 10, 11, _, 13"
            say: "Ten, eleven, then a gap, then thirteen. Which number goes in the gap?"
            options: ["12", "14", "9"]
            answer: "12"
          - id: l2-c4
            part: number-line
            type: point_on_line
            text: "Where is 14?"
            say: "Find fourteen on the number line. Tap it."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 14
          - id: l2-c5
            part: before-after
            type: multiple_choice
            text: "What comes after 10?"
            say: "What number comes after ten?"
            options: ["9", "11", "12"]
            answer: "11"
          - id: l2-c6
            part: number-line
            type: point_on_line
            text: "Where is 11?"
            say: "Find eleven on the number line. Tap it."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 11
          - id: l2-c7
            part: order
            type: ordering
            text: "Put them in order."
            say: "Put the numbers in order. Smallest first."
            options: ["19", "17", "20", "18"]
            slot_count: 4
            answer: ["17", "18", "19", "20"]
          - id: l2-c8
            part: missing
            type: multiple_choice
            text: "What is missing? 8, 9, _, 11"
            say: "Eight, nine, then a gap, then eleven. Which number goes in the gap?"
            options: ["10", "12", "7"]
            answer: "10"
          - id: l2-c9
            part: before-after
            type: multiple_choice
            text: "What comes before 20?"
            say: "What number comes before twenty?"
            options: ["19", "21", "10"]
            answer: "19"
          - id: l2-c10
            part: number-line
            type: point_on_line
            text: "Where is 19?"
            say: "Find nineteen on the number line. Tap it."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 19
          - id: l2-c11
            part: order
            type: ordering
            text: "Count back."
            say: "Count back. Biggest number first."
            options: ["12", "10", "13", "11"]
            slot_count: 4
            answer: ["13", "12", "11", "10"]
          - id: l2-c12
            part: missing
            type: multiple_choice
            text: "What is missing? 14, 13, _, 11"
            say: "Count back: fourteen, thirteen, then a gap, then eleven. Which number goes in the gap?"
            options: ["12", "15", "10"]
            answer: "12"
          - id: l2-c13
            part: before-after
            type: true_false
            text: "Is 12 after 11?"
            say: "Does twelve come after eleven?"
            answer: true
          - id: l2-c14
            part: number-line
            type: point_on_line
            text: "Where is 16?"
            say: "Find sixteen on the number line. Tap it."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 16
          - id: l2-c15
            part: order
            type: ordering
            text: "Put them in order."
            say: "Put the numbers in order. Smallest first."
            options: ["15", "13", "16", "14"]
            slot_count: 4
            answer: ["13", "14", "15", "16"]
          - id: l2-c16
            part: missing
            type: true_false
            text: "What is missing? 16, 17, _, 19. Is it 18?"
            say: "Sixteen, seventeen, then a gap, then nineteen. Is eighteen the missing number?"
            answer: true
          - id: l2-c17
            part: before-after
            type: true_false
            text: "Is 15 before 14?"
            say: "Does fifteen come before fourteen?"
            answer: false
          - id: l2-c18
            part: number-line
            type: point_on_line
            text: "Tap the number that comes before 13."
            say: "Find the number that comes before thirteen on the number line. Tap it."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 12
          - id: l2-c19
            part: order
            type: ordering
            text: "Count back."
            say: "Count back. Biggest number first."
            options: ["17", "15", "18", "16"]
            slot_count: 4
            answer: ["18", "17", "16", "15"]
          - id: l2-c20
            part: missing
            type: true_false
            text: "Is this right? 16, 15, 13, 12"
            say: "Someone counts back: sixteen, fifteen, thirteen, twelve. Is that right?"
            answer: false
