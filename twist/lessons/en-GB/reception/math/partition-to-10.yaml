# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.partition-to-10
skill: math.numbers-to-20.partition-to-10
curriculum: en-GB
language: en
title:
  de: Zahlen zerlegen bis 10
  en: Number bonds to 10
summary: >
  Children split numbers into two parts and see that the parts make the
  whole again, using the part-whole model taught in England. Lesson 1
  takes the parts of 5 with counters and the part-whole model; lesson 2
  takes the parts of 10 on the ten frame and ends with the skill check. The
  EYFS goal is number bonds to 5 and some to 10. No written sums: the model
  and spoken questions carry it.
metadata:
  year: reception
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.subitize-to-10]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { en: [part, whole, make, number bond, part-whole model] }
  no_reading: true
  forms: [drawn, audio]
  drawn: [dots, ten-frame, part-whole]
  facets: []
  parts:
    - { id: colours, what: { de: "die zwei Teile in einer Gruppe sehen (wie viele rot, wie viele blau)", en: "seeing the two parts in a group of counters (how many red, how many blue)" } }
    - { id: part-whole, what: { de: im Teile-Ganzes-Modell einen fehlenden Teil oder das Ganze finden, en: finding a missing part or the whole in the part-whole model } }
    - { id: bonds-10, what: { de: die Zerlegungen der 10 am Zehnerfeld finden, en: finding the number bonds to 10 on a ten frame } }
  misconceptions:
    - id: parts-new-number
      what: Thinks the two parts are a new amount, not the same amount split
      addressed: lesson 1 Learn splits the same five counters into two colours; true or false asks whether three and two still make five
    - id: one-bond
      what: Knows one bond for a number (2 and 3 make 5) and thinks it is the only one
      addressed: both lessons show several bonds of the same whole
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Die Teile der 5, en: Parts of 5 }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Here are five counters. Some are red and some are blue. Two red and three blue. Two and three make five."
            show: { drawn: dots, count: 5, layout: row, colour_split: [2, 3] }
          - say: "This is a part-whole model. The whole, five, is at the top. The two parts, two and three, are underneath."
            show: { drawn: part-whole, whole: 5, parts: [2, 3] }
          - say: "Five can be split another way too: four and one. Four and one make five."
            show: { drawn: part-whole, whole: 5, parts: [4, 1] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many are blue?"
                say: "There are five counters. Three are red. How many are blue?"
                show: { drawn: dots, count: 5, layout: row, colour_split: [3, 2] }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Count only the blue counters."
                  - "Five is three red and some blue."
                  - "There are 2 blue counters."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is five. One part is four. What is the other part?"
                show: { drawn: part-whole, whole: 5, parts: [4, null] }
                options: ["1", "2", "3"]
                answer: "1"
                hints:
                  - "The two parts together make the whole."
                  - "Four and how many make five? Count on from four to five."
                  - "Four and one make five."
              - id: l1-f3
                type: true_false
                text: "Do 3 and 2 make 5?"
                say: "Here are three red counters and two blue counters. Do three and two make five?"
                show: { drawn: dots, count: 5, layout: row, colour_split: [3, 2] }
                answer: true
                hints:
                  - "Count all the counters together."
                  - "Three and two."
                  - "Yes, three and two make five."
              - id: l1-f4
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is four. One part is two. What is the other part?"
                show: { drawn: part-whole, whole: 4, parts: [2, null] }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "The two parts make the whole, four."
                  - "Two and how many make four?"
                  - "Two and two make four."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which one shows 5?"
                say: "Which picture has five counters altogether?"
                options:
                  - { drawn: dots, count: 4, layout: row, colour_split: [1, 3] }
                  - { drawn: dots, count: 5, layout: row, colour_split: [1, 4] }
                  - { drawn: dots, count: 3, layout: row, colour_split: [1, 2] }
                answer: "5"
                hints:
                  - "Count all the counters in each picture."
                  - "One has four, one has three."
                  - "The one with five counters: one and four."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many are red?"
                say: "There are five counters. One is blue. How many are red?"
                show: { drawn: dots, count: 5, layout: row, colour_split: [4, 1] }
                options: ["3", "4", "5"]
                answer: "4"
                hints: ["Count only the red counters."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is five. One part is two. What is the other part?"
                show: { drawn: part-whole, whole: 5, parts: [2, null] }
                options: ["2", "3", "4"]
                answer: "3"
                hints: ["Two and how many make five?"]
              - id: l1-s3
                type: true_false
                text: "Do 1 and 3 make 5?"
                say: "Do one and three make five?"
                show: { drawn: dots, count: 4, layout: row, colour_split: [1, 3] }
                answer: false
                hints: ["Count all the counters. Is it five?"]
              - id: l1-s4
                type: multiple_choice
                text: "What is the whole?"
                say: "The parts are three and one. What is the whole?"
                show: { drawn: part-whole, whole: null, parts: [3, 1] }
                options: ["3", "4", "5"]
                answer: "4"
                hints: ["Put the parts together: three and one."]
              - id: l1-s5
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is three. One part is one. What is the other part?"
                show: { drawn: part-whole, whole: 3, parts: [1, null] }
                options: ["1", "2", "3"]
                answer: "2"
                hints: ["One and how many make three?"]
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many are blue?"
                say: "There are four counters. One is red. How many are blue?"
                show: { drawn: dots, count: 4, layout: row, colour_split: [1, 3] }
                options: ["2", "3", "4"]
                answer: "3"
              - id: l1-n2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is five. One part is three. What is the other part?"
                show: { drawn: part-whole, whole: 5, parts: [null, 3] }
                options: ["1", "2", "3"]
                answer: "2"
              - id: l1-n3
                type: true_false
                text: "Do 2 and 2 make 4?"
                say: "Do two and two make four?"
                show: { drawn: dots, count: 4, layout: row, colour_split: [2, 2] }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "What is the whole?"
                say: "The parts are two and three. What is the whole?"
                show: { drawn: part-whole, whole: null, parts: [2, 3] }
                options: ["4", "5", "6"]
                answer: "5"
              - id: l1-n5
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is five. One part is five. What is the other part?"
                show: { drawn: part-whole, whole: 5, parts: [5, null] }
                options: ["0", "1", "5"]
                answer: "0"
                difficulty: stretch

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "The whole is 5. One part is 1. What is the other part?"
            say: "The whole is five. One part is one. What is the other part?"
            show: { drawn: part-whole, whole: 5, parts: [1, null] }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l1-c2
            type: multiple_choice
            text: "3 counters. 2 are blue. How many are red?"
            say: "There are three counters. Two are blue. How many are red?"
            show: { drawn: dots, count: 3, layout: row, colour_split: [1, 2] }
            options: ["1", "2", "3"]
            answer: "1"
          - id: l1-c3
            type: true_false
            text: "Do 3 and 1 make 4?"
            say: "Do three and one make four?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "5 counters. 4 are red. How many are blue?"
            say: "There are five counters. Four are red. How many are blue?"
            show: { drawn: dots, count: 5, layout: row, colour_split: [4, 1] }
            options: ["1", "2", "3"]
            answer: "1"
          - id: l1-c5
            type: multiple_choice
            text: "The parts are 2 and 2. What is the whole?"
            say: "The parts are two and two. What is the whole?"
            show: { drawn: part-whole, whole: null, parts: [2, 2] }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l1-c6
            type: true_false
            text: "Do 2 and 2 make 5?"
            say: "Here are two red counters and two blue counters. Do two and two make five?"
            show: { drawn: dots, count: 4, layout: row, colour_split: [2, 2] }
            answer: false

  - n: 2
    title: { de: Die Teile der 10, en: Parts of 10 }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "A full ten frame has ten counters. Here, seven are red and three are blue. Seven and three make ten."
            show: { drawn: ten-frame, filled: 10, colour_split: [7, 3] }
          - say: "In the part-whole model, ten is the whole. Seven and three are the parts."
            show: { drawn: part-whole, whole: 10, parts: [7, 3] }
          - say: "Five and five make ten too: one full row of red, one full row of blue."
            show: { drawn: ten-frame, filled: 10, colour_split: [5, 5] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many are blue?"
                say: "The ten frame is full. Eight are red. How many are blue?"
                show: { drawn: ten-frame, filled: 10, colour_split: [8, 2] }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Count only the blue counters."
                  - "They are at the end of the bottom row."
                  - "There are 2 blue counters."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is ten. One part is six. What is the other part?"
                show: { drawn: part-whole, whole: 10, parts: [6, null] }
                options: ["3", "4", "5"]
                answer: "4"
                hints:
                  - "Six and how many make ten?"
                  - "Think of a ten frame: six filled, how many empty?"
                  - "Six and four make ten."
              - id: l2-f3
                type: true_false
                text: "Do 5 and 5 make 10?"
                say: "Do five and five make ten?"
                show: { drawn: ten-frame, filled: 10, colour_split: [5, 5] }
                answer: true
                hints:
                  - "Two full rows."
                  - "Five and five."
                  - "Yes, five and five make ten."
              - id: l2-f4
                type: multiple_choice
                text: "How many more to make 10?"
                say: "There are seven counters in the ten frame. How many more do you need to make ten?"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                options: ["2", "3", "4"]
                answer: "3"
                hints:
                  - "Count the empty spaces."
                  - "Each empty space needs one more counter."
                  - "There are 3 empty spaces."
              - id: l2-f5
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is ten. One part is nine. What is the other part?"
                show: { drawn: part-whole, whole: 10, parts: [9, null] }
                options: ["1", "2", "3"]
                answer: "1"
                hints:
                  - "Nine and how many make ten?"
                  - "Nine is just one less than ten."
                  - "Nine and one make ten."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many are red?"
                say: "The ten frame is full. Four are blue. How many are red?"
                show: { drawn: ten-frame, filled: 10, colour_split: [6, 4] }
                options: ["5", "6", "7"]
                answer: "6"
                hints: ["The top row is all red. How many more red are there?"]
              - id: l2-s2
                type: multiple_choice
                text: "How many more to make 10?"
                say: "There are eight counters. How many more do you need to make ten?"
                show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                options: ["1", "2", "3"]
                answer: "2"
                hints: ["Count the empty spaces."]
              - id: l2-s3
                type: true_false
                text: "Do 6 and 3 make 10?"
                say: "Do six and three make ten?"
                show: { drawn: ten-frame, filled: 9, colour_split: [6, 3] }
                answer: false
                hints: ["Is the ten frame full?"]
              - id: l2-s4
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is ten. One part is two. What is the other part?"
                show: { drawn: part-whole, whole: 10, parts: [2, null] }
                options: ["7", "8", "9"]
                answer: "8"
                hints: ["Two and how many make ten? Think of the empty spaces."]
              - id: l2-s5
                type: multiple_choice
                text: "What is the whole?"
                say: "The parts are five and four. What is the whole?"
                show: { drawn: part-whole, whole: null, parts: [5, 4] }
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["Five and four: a full row and four more."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many more to make 10?"
                say: "There are five counters. How many more do you need to make ten?"
                show: { drawn: ten-frame, filled: 5 }
                options: ["4", "5", "6"]
                answer: "5"
              - id: l2-n2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is ten. One part is three. What is the other part?"
                show: { drawn: part-whole, whole: 10, parts: [null, 3] }
                options: ["6", "7", "8"]
                answer: "7"
              - id: l2-n3
                type: true_false
                text: "Do 8 and 2 make 10?"
                say: "Do eight and two make ten?"
                show: { drawn: ten-frame, filled: 10, colour_split: [8, 2] }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "How many are blue?"
                say: "The ten frame is full. One is red. How many are blue?"
                show: { drawn: ten-frame, filled: 10, colour_split: [1, 9] }
                options: ["8", "9", "10"]
                answer: "9"
              - id: l2-n5
                type: multiple_choice
                text: "What is the whole?"
                say: "The parts are three and three. What is the whole?"
                show: { drawn: part-whole, whole: null, parts: [3, 3] }
                options: ["5", "6", "7"]
                answer: "6"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: part-whole
            type: multiple_choice
            text: "The whole is 9. One part is 6. What is the other part?"
            say: "The whole is nine. One part is six. What is the other part?"
            show: { drawn: part-whole, whole: 9, parts: [null, 6] }
            options: ["2", "3", "4"]
            answer: "3"
          - id: l2-c2
            part: bonds-10
            type: multiple_choice
            text: "6 counters. How many more to make 10?"
            say: "There are six counters. How many more do you need to make ten?"
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l2-c3
            part: bonds-10
            type: true_false
            text: "Do 9 and 1 make 10?"
            say: "Do nine and one make ten?"
            answer: true
          - id: l2-c4
            part: part-whole
            type: multiple_choice
            text: "The parts are 3 and 4. What is the whole?"
            say: "The parts are three and four. What is the whole?"
            show: { drawn: part-whole, whole: null, parts: [3, 4] }
            options: ["6", "7", "8"]
            answer: "7"
          - id: l2-c5
            part: colours
            type: multiple_choice
            text: "6 counters. 2 are red. How many are blue?"
            say: "There are six counters. Two are red. How many are blue?"
            show: { drawn: dots, count: 6, layout: row, colour_split: [2, 4] }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l2-c6
            part: part-whole
            type: multiple_choice
            text: "The whole is 4. One part is 1. What is the other part?"
            say: "The whole is four. One part is one. What is the other part?"
            show: { drawn: part-whole, whole: 4, parts: [1, null] }
            options: ["2", "3", "4"]
            answer: "3"
          - id: l2-c7
            part: bonds-10
            type: multiple_choice
            text: "4 counters. How many more to make 10?"
            say: "There are four counters. How many more do you need to make ten?"
            show: { drawn: ten-frame, filled: 4 }
            options: ["5", "6", "7"]
            answer: "6"
          - id: l2-c8
            part: bonds-10
            type: true_false
            text: "Do 6 and 4 make 10?"
            say: "Six red counters and four blue counters. Do six and four make ten?"
            show: { drawn: ten-frame, filled: 10, colour_split: [6, 4] }
            answer: true
          - id: l2-c9
            part: colours
            type: multiple_choice
            text: "4 counters. 3 are blue. How many are red?"
            say: "There are four counters. Three are blue. How many are red?"
            show: { drawn: dots, count: 4, layout: row, colour_split: [1, 3] }
            options: ["1", "2", "3"]
            answer: "1"
          - id: l2-c10
            part: part-whole
            type: multiple_choice
            text: "The whole is 10. One part is 4. What is the other part?"
            say: "The whole is ten. One part is four. What is the other part?"
            show: { drawn: part-whole, whole: 10, parts: [4, null] }
            options: ["5", "6", "7"]
            answer: "6"
          - id: l2-c11
            part: colours
            type: image_multiple_choice
            text: "Which one shows 4?"
            say: "Which picture has four counters altogether?"
            options:
              - { drawn: dots, count: 5, layout: row, colour_split: [3, 2] }
              - { drawn: dots, count: 3, layout: row, colour_split: [2, 1] }
              - { drawn: dots, count: 4, layout: row, colour_split: [3, 1] }
            answer: "4"
          - id: l2-c12
            part: bonds-10
            type: multiple_choice
            text: "9 counters. How many more to make 10?"
            say: "There are nine counters. How many more do you need to make ten?"
            show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
            options: ["1", "2", "3"]
            answer: "1"
          - id: l2-c13
            part: colours
            type: multiple_choice
            text: "The ten frame is full. 2 are red. How many are blue?"
            say: "The ten frame is full. Two are red. How many are blue?"
            show: { drawn: ten-frame, filled: 10, colour_split: [2, 8] }
            options: ["7", "8", "9"]
            answer: "8"
          - id: l2-c14
            part: part-whole
            type: multiple_choice
            text: "The parts are 6 and 2. What is the whole?"
            say: "The parts are six and two. What is the whole?"
            show: { drawn: part-whole, whole: null, parts: [6, 2] }
            options: ["7", "8", "9"]
            answer: "8"
          - id: l2-c15
            part: bonds-10
            type: true_false
            text: "Do 5 and 4 make 10?"
            say: "Five red counters and four blue counters. Do five and four make ten?"
            show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
            answer: false
          - id: l2-c16
            part: bonds-10
            type: multiple_choice
            text: "2 counters. How many more to make 10?"
            say: "There are two counters. How many more do you need to make ten?"
            show: { drawn: ten-frame, filled: 2 }
            options: ["7", "8", "9"]
            answer: "8"
          - id: l2-c17
            part: colours
            type: multiple_choice
            text: "The ten frame is full. 6 are blue. How many are red?"
            say: "The ten frame is full. Six are blue. How many are red?"
            show: { drawn: ten-frame, filled: 10, colour_split: [4, 6] }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l2-c18
            part: part-whole
            type: multiple_choice
            text: "The whole is 8. One part is 3. What is the other part?"
            say: "The whole is eight. One part is three. What is the other part?"
            show: { drawn: part-whole, whole: 8, parts: [3, null] }
            options: ["4", "5", "6"]
            answer: "5"
          - id: l2-c19
            part: part-whole
            type: true_false
            text: "The whole is 6. The parts are 4 and 2. Is that right?"
            say: "The whole is six. The parts are four and two. Is that right?"
            show: { drawn: part-whole, whole: 6, parts: [4, 2] }
            answer: true
          - id: l2-c20
            part: colours
            type: true_false
            text: "Do 1 and 5 make 7?"
            say: "One red counter and five blue counters. Do one and five make seven?"
            show: { drawn: dots, count: 6, layout: row, colour_split: [1, 5] }
            answer: false
