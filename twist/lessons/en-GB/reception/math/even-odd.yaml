            text: "Which has one left over?"
            say: "Which group has one left on its own?"
            options: [{ drawn: dots, count: 10, layout: dice }, { drawn: dots, count: 7, layout: dice }, { drawn: dots, count: 4, layout: dice }]
            answer: "7"
          - id: l2-c14
            part: odd-even
            type: true_false
            text: "Is 6 odd?"
            say: "Is six an odd number?"
            show: { drawn: dots, count: 6, layout: dice }
            answer: false
          - id: l2-c15
            part: find
            type: image_multiple_choice
            text: "Which number is odd?"
            say: "Which group shows an odd number?"
            options: [{ drawn: dots, count: 8, layout: dice }, { drawn: dots, count: 3, layout: dice }, { drawn: dots, count: 10, layout: dice }]
            answer: "3"
          - id: l2-c16
            part: find
            type: image_multiple_choice
            text: "Which number is even?"
            say: "Which group shows an even number?"
            options: [{ drawn: dots, count: 9, layout: dice }, { drawn: dots, count: 8, layout: dice }, { drawn: dots, count: 5, layout: dice }]
            answer: "8"
          - id: l2-c17
            part: pairs
            type: true_false
            text: "4 children make pairs. Is one left over?"
            say: "Four children make pairs. Is one child left on their own?"
            show: { drawn: dots, count: 4, layout: dice }
            answer: false
          - id: l2-c18
