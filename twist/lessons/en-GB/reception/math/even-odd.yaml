# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.even-odd
skill: math.numbers-to-20.even-odd
curriculum: en-GB
language: en
title:
  de: Gerade und ungerade Zahlen
  en: Odd and even
summary: >
  Odd and even numbers within 10 (the Early Learning Goal): even numbers
  make pairs with none left over, odd numbers have one left on its own.
  Lesson 1 makes pairs with dots; lesson 2 says whether a number is odd
  or even, and ends with the skill check. Spoken questions; numbers say
  themselves.
metadata:
  year: reception
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.double-halve-to-20]
  also_practises: [math.numbers-to-20.subitize-to-10]
  vocabulary: { en: [pair, odd, even, left over, on its own] }
  no_reading: true
  forms: [drawn, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: pairs, what: { de: "Paare bilden und sehen, ob eins übrig bleibt", en: making pairs and seeing whether one is left over } }
    - { id: odd-even, what: { de: "sagen, ob eine Zahl bis 10 gerade oder ungerade ist", en: saying whether a number to 10 is odd or even } }
    - { id: find, what: { de: unter mehreren Gruppen die gerade oder ungerade Anzahl finden, en: finding the odd or the even amount among several groups } }
  misconceptions:
    - id: odd-means-strange
      what: Thinks "odd" means the number looks strange or is big
      addressed: Learn says odd means one is left on its own when you make pairs; every task makes pairs first
    - id: pairs-miscounted
      what: Loses track when pairing and calls 8 odd
      addressed: dice-pattern dots show pairs side by side; hints say "Look for the one on its own"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Paare bilden, en: Making pairs }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Four children hold hands in pairs. Two pairs, and nobody is left over. Four is even."
            show: { drawn: dots, count: 4, layout: dice }
          - say: "Five children make pairs. Two pairs, and one child is on their own. Five is odd."
            show: { drawn: dots, count: 5, layout: dice }
          - say: "Even: everyone has a partner. Odd: one is left on its own."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Is one left over?"
                say: "Six children make pairs. Is one child left on their own?"
                show: { drawn: dots, count: 6, layout: dice }
                answer: false
                hints:
                  - "Look for pairs."
                  - "Three pairs."
                  - "No, nobody is left over."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Is one left over?"
                say: "Three children make pairs. Is one child left on their own?"
                show: { drawn: dots, count: 3, layout: dice }
                answer: true
                hints:
                  - "Look for pairs."
                  - "One pair and one more."
                  - "Yes, one is left over."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which has one left over?"
                say: "Which group has one left on its own when you make pairs?"
                options: [{ drawn: dots, count: 4, layout: dice }, { drawn: dots, count: 7, layout: dice }, { drawn: dots, count: 2, layout: dice }]
                answer: "7"
                hints:
                  - "Make pairs in each group."
                  - "Seven is three pairs and one more."
                  - "The group of seven."
              - id: l1-f4
                type: true_false
                text: "Is one left over?"
                say: "Eight children make pairs. Is one child left on their own?"
                show: { drawn: dots, count: 8, layout: dice }
                answer: false
                hints:
                  - "Count the pairs."
                  - "Four pairs."
                  - "No."
              - id: l1-f5
                type: image_multiple_choice
                text: "Which makes pairs with none left?"
                say: "Which group makes pairs with none left over?"
                options: [{ drawn: dots, count: 5, layout: dice }, { drawn: dots, count: 9, layout: dice }, { drawn: dots, count: 10, layout: dice }]
                answer: "10"
                hints:
                  - "Look for the one on its own."
                  - "Ten is five pairs."
                  - "The group of ten."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Is one left over?"
                say: "Two children make pairs. Is one child left on their own?"
                show: { drawn: dots, count: 2, layout: dice }
                answer: false
                hints: ["Look for the one on its own."]
              - id: l1-s2
                type: true_false
                text: "Is one left over?"
                say: "Nine children make pairs. Is one child left on their own?"
                show: { drawn: dots, count: 9, layout: dice }
                answer: true
                hints: ["Make pairs and look for one on its own."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Which has one left over?"
                say: "Which group has one left on its own?"
                options: [{ drawn: dots, count: 6, layout: dice }, { drawn: dots, count: 3, layout: dice }, { drawn: dots, count: 8, layout: dice }]
                answer: "3"
                hints: ["Make pairs in each group."]
              - id: l1-s4
                type: true_false
                text: "Is one left over?"
                say: "Seven children make pairs. Is one child left on their own?"
                show: { drawn: dots, count: 7, layout: dice }
                answer: true
                hints: ["Count the pairs, then look."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Which makes pairs with none left?"
                say: "Which group makes pairs with none left over?"
                options: [{ drawn: dots, count: 1, layout: dice }, { drawn: dots, count: 4, layout: dice }, { drawn: dots, count: 5, layout: dice }]
                answer: "4"
                hints: ["Look for the one on its own."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Is one left over?"
                say: "Ten children make pairs. Is one child left on their own?"
                show: { drawn: dots, count: 10, layout: dice }
                answer: false
              - id: l1-n2
                type: true_false
                text: "Is one left over?"
                say: "Three children make pairs. Is one child left on their own?"
                show: { drawn: dots, count: 3, layout: row }
                answer: true
              - id: l1-n3
                type: image_multiple_choice
                text: "Which has one left over?"
                say: "Which group has one left on its own?"
                options: [{ drawn: dots, count: 9, layout: dice }, { drawn: dots, count: 2, layout: dice }, { drawn: dots, count: 6, layout: dice }]
                answer: "9"
              - id: l1-n4
                type: true_false
                text: "Is one left over?"
                say: "Eight children make pairs. Is one child left on their own?"
                show: { drawn: dots, count: 8, layout: row }
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                text: "Which makes pairs with none left?"
                say: "Which group makes pairs with none left over?"
                options: [{ drawn: dots, count: 7, layout: dice }, { drawn: dots, count: 8, layout: dice }, { drawn: dots, count: 3, layout: dice }]
                answer: "8"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "1 child. Is one left over?"
            say: "There is only one child. Is one child left on their own?"
            show: { drawn: dots, count: 1, layout: dice }
            answer: true
          - id: l1-c2
            type: image_multiple_choice
            text: "Which has one left over?"
            say: "Which group has one left on its own?"
            options: [{ drawn: dots, count: 2, layout: dice }, { drawn: dots, count: 5, layout: dice }, { drawn: dots, count: 10, layout: dice }]
            answer: "5"
          - id: l1-c3
            type: true_false
            text: "6 children make pairs. Is one left over?"
            say: "Six children make pairs. Is one child left on their own?"
            show: { drawn: dots, count: 6, layout: row }
            answer: false
          - id: l1-c4
            type: true_false
            text: "4 children make pairs. Is one left over?"
            say: "Four children make pairs. Is one child left on their own?"
            show: { drawn: dots, count: 4, layout: row }
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Which makes pairs with none left?"
            say: "Which group makes pairs with none left over?"
            options: [{ drawn: dots, count: 3, layout: dice }, { drawn: dots, count: 9, layout: dice }, { drawn: dots, count: 6, layout: dice }]
            answer: "6"
          - id: l1-c6
            type: true_false
            text: "5 children make pairs. Is one left over?"
            say: "Five children make pairs. Is one child left on their own?"
            show: { drawn: dots, count: 5, layout: row }
            answer: true

  - n: 2
    title: { de: "Gerade oder ungerade?", en: "Odd or even?" }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Even numbers make pairs with none left over: two, four, six, eight, ten."
          - say: "Odd numbers always have one on its own: one, three, five, seven, nine. Make pairs, then look."
            show: { drawn: dots, count: 9, layout: dice }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Odd or even?"
                say: "Here are four spots. Is four odd or even?"
                show: { drawn: dots, count: 4, layout: dice }
                options: ["even number", "odd number"]
                answer: "even number"
                hints:
                  - "Make pairs."
                  - "Two pairs, none left over."
                  - "Even."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Odd or even?"
                say: "Here are seven spots. Is seven odd or even?"
                show: { drawn: dots, count: 7, layout: dice }
                options: ["even number", "odd number"]
                answer: "odd number"
                feedback:
                  "even number": "Make pairs: three pairs and one on its own. Seven is odd."
                hints:
                  - "Make pairs."
                  - "Is one on its own?"
                  - "Odd."
              - id: l2-f3
                type: image_multiple_choice
                text: "Which number is even?"
                say: "Which group shows an even number?"
                options: [{ drawn: dots, count: 6, layout: dice }, { drawn: dots, count: 3, layout: dice }, { drawn: dots, count: 9, layout: dice }]
                answer: "6"
                hints:
                  - "Even means none left over."
                  - "Six is three pairs."
                  - "The group of six."
              - id: l2-f4
                type: multiple_choice
                text: "Odd or even?"
                say: "Here are ten spots. Is ten odd or even?"
                show: { drawn: dots, count: 10, layout: dice }
                options: ["even number", "odd number"]
                answer: "even number"
                hints:
                  - "Make pairs."
                  - "Five pairs, none left over."
                  - "Even."
              - id: l2-f5
                type: multiple_choice
                text: "Odd or even?"
                say: "Here are three spots. Is three odd or even?"
                show: { drawn: dots, count: 3, layout: dice }
                options: ["even number", "odd number"]
                answer: "odd number"
                hints:
                  - "Make pairs."
                  - "One pair and one on its own."
                  - "Odd."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Odd or even?"
                say: "Here are eight spots. Is eight odd or even?"
                show: { drawn: dots, count: 8, layout: dice }
                options: ["even number", "odd number"]
                answer: "even number"
                hints: ["Is one on its own?"]
              - id: l2-s2
                type: multiple_choice
                text: "Odd or even?"
                say: "Here are five spots. Is five odd or even?"
                show: { drawn: dots, count: 5, layout: dice }
                options: ["even number", "odd number"]
                answer: "odd number"
                hints: ["Make pairs and look."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which number is odd?"
                say: "Which group shows an odd number?"
                options: [{ drawn: dots, count: 4, layout: dice }, { drawn: dots, count: 1, layout: dice }, { drawn: dots, count: 8, layout: dice }]
                answer: "1"
                hints: ["Odd means one on its own."]
              - id: l2-s4
                type: true_false
                text: "Is two even?"
                say: "Is two an even number?"
                show: { drawn: dots, count: 2, layout: dice }
                answer: true
                hints: ["Two spots make one pair."]
              - id: l2-s5
                type: multiple_choice
                text: "Odd or even?"
                say: "Here are six spots. Is six odd or even?"
                show: { drawn: dots, count: 6, layout: row }
                options: ["even number", "odd number"]
                answer: "even number"
                hints: ["Make pairs and look for one on its own."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Odd or even?"
                say: "Here are ten spots. Is ten odd or even?"
                show: { drawn: dots, count: 10, layout: row }
                options: ["even number", "odd number"]
                answer: "even number"
              - id: l2-n2
                type: multiple_choice
                text: "Odd or even?"
                say: "Here is one spot. Is one odd or even?"
                show: { drawn: dots, count: 1, layout: dice }
                options: ["even number", "odd number"]
                answer: "odd number"
              - id: l2-n3
                type: image_multiple_choice
                text: "Which number is even?"
                say: "Which group shows an even number?"
                options: [{ drawn: dots, count: 7, layout: dice }, { drawn: dots, count: 5, layout: dice }, { drawn: dots, count: 2, layout: dice }]
                answer: "2"
              - id: l2-n4
                type: true_false
                text: "Is eight odd?"
                say: "Is eight an odd number?"
                show: { drawn: dots, count: 8, layout: row }
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Odd or even?"
                say: "Here are five spots. Is five odd or even?"
                show: { drawn: dots, count: 5, layout: row }
                options: ["even number", "odd number"]
                answer: "odd number"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: odd-even
            type: true_false
            text: "Is 9 even?"
            say: "Is nine an even number?"
            show: { drawn: dots, count: 9, layout: row }
            answer: false
          - id: l2-c2
            part: odd-even
            type: multiple_choice
            text: "Is 7 odd or even?"
            say: "Is seven odd or even?"
            show: { drawn: dots, count: 7, layout: row }
            options: ["even number", "odd number"]
            answer: "odd number"
          - id: l2-c3
            part: find
            type: image_multiple_choice
            text: "Which number is odd?"
            say: "Which group shows an odd number?"
            options: [{ drawn: dots, count: 6, layout: dice }, { drawn: dots, count: 10, layout: dice }, { drawn: dots, count: 5, layout: dice }]
            answer: "5"
          - id: l2-c4
            part: odd-even
            type: true_false
            text: "Is 4 even?"
            say: "Is four an even number?"
            show: { drawn: dots, count: 4, layout: row }
            answer: true
          - id: l2-c5
            part: pairs
            type: true_false
            text: "7 children make pairs. Is one left over?"
            say: "Seven children make pairs. Is one child left on their own?"
            show: { drawn: dots, count: 7, layout: row }
            answer: true
          - id: l2-c6
            part: odd-even
            type: multiple_choice
            text: "Is 3 odd or even?"
            say: "Is three odd or even?"
            show: { drawn: dots, count: 3, layout: row }
            options: ["even number", "odd number"]
            answer: "odd number"
          - id: l2-c7
            part: find
            type: image_multiple_choice
            text: "Which number is even?"
            say: "Which group shows an even number?"
            options: [{ drawn: dots, count: 3, layout: dice }, { drawn: dots, count: 10, layout: dice }, { drawn: dots, count: 7, layout: dice }]
            answer: "10"
          - id: l2-c8
            part: find
            type: image_multiple_choice
            text: "Which number is odd?"
            say: "Which group shows an odd number?"
            options: [{ drawn: dots, count: 2, layout: dice }, { drawn: dots, count: 9, layout: dice }, { drawn: dots, count: 6, layout: dice }]
            answer: "9"
          - id: l2-c9
            part: pairs
            type: true_false
            text: "10 children make pairs. Is one left over?"
            say: "Ten children make pairs. Is one child left on their own?"
            show: { drawn: dots, count: 10, layout: row }
            answer: false
          - id: l2-c10
            part: odd-even
            type: multiple_choice
            text: "Is 8 odd or even?"
            say: "Is eight odd or even?"
            show: { drawn: dots, count: 8, layout: row }
            options: ["even number", "odd number"]
            answer: "even number"
          - id: l2-c11
            part: odd-even
            type: true_false
            text: "Is 5 odd?"
            say: "Is five an odd number?"
            show: { drawn: dots, count: 5, layout: dice }
            answer: true
          - id: l2-c12
