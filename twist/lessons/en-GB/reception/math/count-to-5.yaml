# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.count-to-5
skill: math.numbers-to-20.count-to-5
curriculum: en-GB
language: en
title:
  de: Zählen bis 5
  en: Counting to 5
summary: >
  The first maths lessons of Reception. Children count up to five things by
  touching each one once, and learn that the last number they say tells
  them how many there are. Lesson 1 counts to 3, lesson 2 to 5, including
  things that are spread out, and ends with the skill check. Everything is
  spoken; number options say themselves when tapped.
metadata:
  year: reception
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: []
  vocabulary: { en: [count, how many, one, two, three, four, five] }
  no_reading: true
  forms: [picture, audio]
  drawn: []
  facets: []
  parts:
    - { id: count, what: { de: "bis zu 5 Dinge abzählen und sagen, wie viele es sind", en: counting up to 5 things and saying how many } }
    - { id: last-number, what: { de: "wissen, dass die letzte Zahl sagt, wie viele es sind", en: knowing that the last number said tells how many there are } }
    - { id: find, what: { de: die Gruppe mit einer genannten Anzahl bis 5 finden, en: finding the group with a given number up to 5 } }
  misconceptions:
    - id: count-twice
      what: Counts one thing twice or misses one out
      addressed: tapping marks each picture with its number; the first hint of every counting task is "Touch them one at a time."
    - id: last-number
      what: Counts correctly but cannot say how many, or counts again when asked
      addressed: lesson 1 Learn says "The last number you say tells you how many"; true or false tasks ask "Are there 3?" after counting
    - id: arrangement
      what: Thinks things spread out are more than the same number in a row
      addressed: lesson 2 Learn shows the same five fish in a row and spread out
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zählen bis 3, en: Counting to 3 }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Let's count the apples. We touch each apple once: one, two, three."
            show: { object: apple, count: 3, layout: row }
          - say: "The last number we say tells us how many there are. There are three apples."
            show: { object: apple, count: 3, layout: row }
          - say: "Here are some balls. One, two. There are two balls."
            show: { object: ball, count: 2, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tap_to_count
                text: "Tap each apple once. How many are there?"
                say: "Tap each apple once. How many apples are there?"
                show: { object: apple, count: 2, layout: row }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Touch them one at a time."
                  - "Count as you tap: one, two."
                  - "There are 2 apples."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many balls?"
                say: "How many balls are there?"
                show: { object: ball, count: 3, layout: row }
                options: ["1", "2", "3"]
                answer: "3"
                feedback:
                  "2": "Did you miss one? Touch each ball once."
                hints:
                  - "Point to each ball."
                  - "One, two, three. What was the last number?"
                  - "There are 3 balls."
              - id: l1-f3
                type: image_multiple_choice
                text: "Which picture has 2 bananas?"
                say: "Which picture has two bananas? Tap it."
                options:
                  - { object: banana, count: 1, layout: row }
                  - { object: banana, count: 3, layout: row }
                  - { object: banana, count: 2, layout: row }
                answer: "2"
                hints:
                  - "Count the bananas in each picture."
                  - "One picture has one banana, one has three."
                  - "Find the picture where you count one, two."
              - id: l1-f4
                type: true_false
                text: "Are there 3 fish?"
                say: "Count the fish. Are there three fish?"
                show: { object: fish, count: 3, layout: row }
                answer: true
                hints:
                  - "Count the fish one at a time."
                  - "One, two, three."
                  - "Yes, there are 3 fish."
              - id: l1-f5
                type: tap_to_count
                text: "Tap each car once. How many are there?"
                say: "Tap each car once. How many cars are there?"
                show: { object: car, count: 1, layout: row }
                options: ["1", "2", "3"]
                answer: "1"
                hints:
                  - "How many cars can you see?"
                  - "There is just one."
                  - "There is 1 car."
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: tap_to_count
                text: "Tap each strawberry once. How many are there?"
                say: "Tap each strawberry once. How many strawberries are there?"
                show: { object: strawberry, count: 3, layout: row }
                options: ["1", "2", "3"]
                answer: "3"
                hints: ["Tap them one at a time and count as you go."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Which picture has 1 ball?"
                say: "Which picture has one ball? Tap it."
                options:
                  - { object: ball, count: 2, layout: row }
                  - { object: ball, count: 1, layout: row }
                  - { object: ball, count: 3, layout: row }
                answer: "1"
                hints: ["Find the picture with just one ball."]
                difficulty: easy
              - id: l1-s3
                type: true_false
                text: "Are there 2 frogs?"
                say: "Count the frogs. Are there two frogs?"
                show: { object: frog, count: 3, layout: row }
                answer: false
                hints: ["Count carefully: one, two, and then?"]
              - id: l1-s4
                type: multiple_choice
                text: "How many eggs?"
                say: "How many eggs are there?"
                show: { object: egg, count: 2, layout: row }
                options: ["1", "2", "3"]
                answer: "2"
                hints: ["What number do you say at the last egg?"]
              - id: l1-s5
                type: tap_to_count
                text: "Tap each balloon once. How many are there?"
                say: "The balloons are all over the place. Tap each one once. How many balloons are there?"
                show: { object: balloon, count: 3, layout: scattered }
                options: ["1", "2", "3"]
                answer: "3"
                hints: ["Tap each balloon only once."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many leaves?"
                say: "How many leaves are there?"
                show: { object: leaf, count: 3, layout: row }
                options: ["1", "2", "3"]
                answer: "3"
              - id: l1-n2
                type: tap_to_count
                text: "Tap each ant once. How many are there?"
                say: "Tap each ant once. How many ants are there?"
                show: { object: ant, count: 2, layout: scattered }
                options: ["1", "2", "3"]
                answer: "2"
              - id: l1-n3
                type: true_false
                text: "Is there 1 mouse?"
                say: "Look at the picture. Is there one mouse?"
                show: { object: mouse, count: 1, layout: row }
                answer: true
                difficulty: easy
              - id: l1-n4
                type: image_multiple_choice
                text: "Which picture has 3 carrots?"
                say: "Which picture has three carrots? Tap it."
                options:
                  - { object: carrot, count: 3, layout: row }
                  - { object: carrot, count: 2, layout: row }
                  - { object: carrot, count: 1, layout: row }
                answer: "3"
              - id: l1-n5
                type: multiple_choice
                text: "How many stickers?"
                say: "How many stickers are there?"
                show: { object: sticker, count: 2, layout: scattered }
                options: ["1", "2", "3"]
                answer: "2"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many apples?"
            say: "How many apples are there?"
            show: { object: apple, count: 3, layout: scattered }
            options: ["1", "2", "3"]
            answer: "3"
          - id: l1-c2
            type: image_multiple_choice
            text: "Which picture has 2 balls?"
            say: "Which picture has two balls? Tap it."
            options:
              - { object: ball, count: 3, layout: row }
              - { object: ball, count: 2, layout: row }
              - { object: ball, count: 1, layout: row }
            answer: "2"
          - id: l1-c3
            type: tap_to_count
            text: "Tap each crayon once. How many are there?"
            say: "Tap each crayon once. How many crayons are there?"
            show: { object: crayon, count: 2, layout: row }
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c4
            type: true_false
            text: "Are there 3 ducks?"
            say: "Count the ducks. Are there three ducks?"
            show: { object: duck, count: 2, layout: row }
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "How many cups?"
            say: "How many cups are there?"
            show: { object: cup, count: 3, layout: row }
            options: ["1", "2", "3"]
            answer: "3"
          - id: l1-c6
            type: image_multiple_choice
            text: "Which picture has 1 star?"
            say: "Which picture has one star? Tap it."
