# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.count-to-5
skill: math.numbers-to-20.count-to-5
curriculum: en-GB
language: en
title:
  de: Zählen bis 5
  en: Counting to 5
summary: >
  The first maths lessons of Reception. Children count up to five things by
  touching each one once, and learn that the last number they say tells
  them how many there are. Lesson 1 counts to 3, lesson 2 to 5, including
  things that are spread out, and ends with the skill check. Everything is
  spoken; number options say themselves when tapped.
metadata:
  year: reception
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: []
  also_practises: []
  vocabulary: { en: [count, how many, one, two, three, four, five] }
  no_reading: true
  forms: [picture, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: count-twice
      what: Counts one thing twice or misses one out
      addressed: tapping marks each picture with its number; the first hint of every counting task is "Touch them one at a time."
    - id: last-number
      what: Counts correctly but cannot say how many, or counts again when asked
      addressed: lesson 1 Learn says "The last number you say tells you how many"; true or false tasks ask "Are there 3?" after counting
    - id: arrangement
      what: Thinks things spread out are more than the same number in a row
      addressed: lesson 2 Learn shows the same five fish in a row and spread out
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zählen bis 3, en: Counting to 3 }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Let's count the apples. We touch each apple once: one, two, three."
            show: { object: apple, count: 3, layout: row }
          - say: "The last number we say tells us how many there are. There are three apples."
            show: { object: apple, count: 3, layout: row }
          - say: "Here are some balls. One, two. There are two balls."
            show: { object: ball, count: 2, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tap_to_count
                text: "Tap each apple once. How many are there?"
                say: "Tap each apple once. How many apples are there?"
                show: { object: apple, count: 2, layout: row }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Touch them one at a time."
                  - "Count as you tap: one, two."
                  - "There are 2 apples."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "How many balls?"
                say: "How many balls are there?"
                show: { object: ball, count: 3, layout: row }
                options: ["1", "2", "3"]
                answer: "3"
                feedback:
                  "2": "Did you miss one? Touch each ball once."
                hints:
                  - "Point to each ball."
                  - "One, two, three. What was the last number?"
                  - "There are 3 balls."
              - id: l1-f3
                type: image_multiple_choice
                text: "Where are 2 bananas?"
                say: "Where are two bananas? Tap the picture."
                options:
                  - { object: banana, count: 1, layout: row }
                  - { object: banana, count: 3, layout: row }
                  - { object: banana, count: 2, layout: row }
                answer: "2"
                hints:
                  - "Count the bananas in each picture."
                  - "One picture has one banana, one has three."
                  - "Find the picture with one, two bananas."
              - id: l1-f4
                type: true_false
                text: "Are there 3 fish?"
                say: "Count the fish. Are there three fish?"
                show: { object: fish, count: 3, layout: row }
                answer: true
                hints:
                  - "Count the fish one at a time."
                  - "One, two, three."
                  - "Yes, there are 3 fish."
              - id: l1-f5
                type: tap_to_count
                text: "Tap each car once. How many are there?"
                say: "Tap each car once. How many cars are there?"
                show: { object: car, count: 1, layout: row }
                options: ["1", "2", "3"]
                answer: "1"
                hints:
                  - "How many cars can you see?"
                  - "There is just one."
                  - "There is 1 car."
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: tap_to_count
                text: "Tap each strawberry once. How many are there?"
                say: "Tap each strawberry once. How many strawberries are there?"
                show: { object: strawberry, count: 3, layout: row }
                options: ["1", "2", "3"]
                answer: "3"
                hints: ["Tap them one at a time and count as you go."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Where is 1 ball?"
                say: "Where is one ball? Tap the picture."
                options:
                  - { object: ball, count: 2, layout: row }
                  - { object: ball, count: 1, layout: row }
                  - { object: ball, count: 3, layout: row }
                answer: "1"
                hints: ["Find the picture with just one ball."]
                difficulty: easy
              - id: l1-s3
                type: true_false
                text: "Are there 2 frogs?"
                say: "Count the frogs. Are there two frogs?"
                show: { object: frog, count: 3, layout: row }
                answer: false
                hints: ["Count carefully: one, two, and then?"]
              - id: l1-s4
                type: multiple_choice
                text: "How many eggs?"
                say: "How many eggs are there?"
                show: { object: egg, count: 2, layout: row }
                options: ["1", "2", "3"]
                answer: "2"
                hints: ["What number do you say at the last egg?"]
              - id: l1-s5
                type: tap_to_count
                text: "Tap each balloon once. How many are there?"
                say: "The balloons are all over the place. Tap each one once. How many balloons are there?"
                show: { object: balloon, count: 3, layout: scattered }
                options: ["1", "2", "3"]
                answer: "3"
                hints: ["Tap each balloon only once."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many leaves?"
                say: "How many leaves are there?"
                show: { object: leaf, count: 3, layout: row }
                options: ["1", "2", "3"]
                answer: "3"
              - id: l1-n2
                type: tap_to_count
                text: "Tap each ant once. How many are there?"
                say: "Tap each ant once. How many ants are there?"
                show: { object: ant, count: 2, layout: scattered }
                options: ["1", "2", "3"]
                answer: "2"
              - id: l1-n3
                type: true_false
                text: "Is there 1 mouse?"
                say: "Count the mice. Is there one mouse?"
                show: { object: mouse, count: 1, layout: row }
                answer: true
                difficulty: easy
              - id: l1-n4
                type: image_multiple_choice
                text: "Where are 3 carrots?"
                say: "Where are three carrots? Tap the picture."
                options:
                  - { object: carrot, count: 3, layout: row }
                  - { object: carrot, count: 2, layout: row }
                  - { object: carrot, count: 1, layout: row }
                answer: "3"
              - id: l1-n5
                type: multiple_choice
                text: "How many stickers?"
                say: "How many stickers are there?"
                show: { object: sticker, count: 2, layout: scattered }
                options: ["1", "2", "3"]
                answer: "2"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many apples?"
            say: "How many apples are there?"
            show: { object: apple, count: 3, layout: scattered }
            options: ["1", "2", "3"]
            answer: "3"
          - id: l1-c2
            type: image_multiple_choice
            text: "Where are 2 balls?"
            say: "Where are two balls? Tap the picture."
            options:
              - { object: ball, count: 3, layout: row }
              - { object: ball, count: 2, layout: row }
              - { object: ball, count: 1, layout: row }
            answer: "2"
          - id: l1-c3
            type: tap_to_count
            text: "Tap each crayon once. How many are there?"
            say: "Tap each crayon once. How many crayons are there?"
            show: { object: crayon, count: 2, layout: row }
            options: ["1", "2", "3"]
            answer: "2"

  - n: 2
    title: { de: Zählen bis 5, en: Counting to 5 }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Now we count on. One, two, three, four. There are four strawberries."
            show: { object: strawberry, count: 4, layout: row }
          - say: "One, two, three, four, five. The last number is five, so there are five fish."
            show: { object: fish, count: 5, layout: row }
          - say: "Now the fish are swimming all over the place. There are still five. Wherever you start, touch each fish once."
            show: { object: fish, count: 5, layout: scattered }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tap_to_count
                text: "Tap each balloon once. How many are there?"
                say: "Tap each balloon once. How many balloons are there?"
                show: { object: balloon, count: 4, layout: row }
                options: ["3", "4", "5"]
                answer: "4"
                hints:
                  - "Start at one end and tap them one at a time."
                  - "Count as you tap: one, two, three, four."
                  - "There are 4 balloons."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "How many apples?"
                say: "How many apples are there?"
                show: { object: apple, count: 5, layout: row }
                options: ["3", "4", "5"]
                answer: "5"
                feedback:
                  "4": "Nearly. Count again right to the last apple."
                hints:
                  - "Touch each apple once."
                  - "One, two, three, four, five."
                  - "There are 5 apples."
              - id: l2-f3
                type: image_multiple_choice
                text: "Where are 4 marbles?"
                say: "Where are four marbles? Tap the picture."
                options:
                  - { object: marble, count: 3, layout: row }
                  - { object: marble, count: 4, layout: row }
                  - { object: marble, count: 5, layout: row }
                answer: "4"
                hints:
                  - "Count the marbles in each picture."
                  - "One picture has three, one has five."
                  - "Find the picture where you stop at four."
              - id: l2-f4
                type: true_false
                text: "Are there 5 cars?"
                say: "Count the cars. Are there five cars?"
                show: { object: car, count: 4, layout: row }
                answer: false
                hints:
                  - "Count the cars one at a time."
                  - "One, two, three, four. There are none left."
                  - "No, there are 4 cars, not 5."
              - id: l2-f5
                type: tap_to_count
                text: "Tap each egg once. How many are there?"
                say: "The eggs are all over the place. Tap each one once. How many eggs are there?"
                show: { object: egg, count: 5, layout: scattered }
                options: ["3", "4", "5"]
                answer: "5"
                hints:
                  - "Tap each egg only once."
                  - "An egg you have tapped gets a number. Tap the ones with no number."
                  - "There are 5 eggs."

          - support: some
            tasks:
              - id: l2-s1
                type: tap_to_count
                text: "Tap each strawberry once. How many are there?"
                say: "Tap each strawberry once. How many strawberries are there?"
                show: { object: strawberry, count: 5, layout: row }
                options: ["3", "4", "5"]
                answer: "5"
                hints: ["Keep tapping until every strawberry has a number."]
              - id: l2-s2
                type: multiple_choice
                text: "How many ants?"
                say: "How many ants are there?"
                show: { object: ant, count: 4, layout: scattered }
                options: ["3", "4", "5"]
                answer: "4"
                hints: ["Start with one ant and remember which ones you have counted."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Where are 5 balls?"
                say: "Where are five balls? Tap the picture."
                options:
                  - { object: ball, count: 4, layout: row }
                  - { object: ball, count: 3, layout: row }
                  - { object: ball, count: 5, layout: row }
                answer: "5"
                hints: ["Count each picture. In which one do you get to five?"]
              - id: l2-s4
                type: true_false
                text: "Are there 4 bananas?"
                say: "Count the bananas. Are there four bananas?"
                show: { object: banana, count: 4, layout: row }
                answer: true
                hints: ["Count to the last banana. What number do you say?"]
              - id: l2-s5
                type: multiple_choice
                text: "How many stickers?"
                say: "How many stickers are there?"
                show: { object: sticker, count: 5, layout: scattered }
                options: ["3", "4", "5"]
                answer: "5"
                hints: ["Touch each sticker once."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many carrots?"
                say: "How many carrots are there?"
                show: { object: carrot, count: 4, layout: row }
                options: ["3", "4", "5"]
                answer: "4"
              - id: l2-n2
                type: tap_to_count
                text: "Tap each fish once. How many are there?"
                say: "Tap each fish once. How many fish are there?"
                show: { object: fish, count: 5, layout: scattered }
                options: ["3", "4", "5"]
                answer: "5"
              - id: l2-n3
                type: image_multiple_choice
                text: "Where are 3 frogs?"
                say: "Where are three frogs? Tap the picture."
                options:
                  - { object: frog, count: 4, layout: scattered }
                  - { object: frog, count: 3, layout: scattered }
                  - { object: frog, count: 5, layout: scattered }
                answer: "3"
              - id: l2-n4
                type: true_false
                text: "Are there 5 apples?"
                say: "Count the apples. Are there five apples?"
                show: { object: apple, count: 5, layout: scattered }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "How many mice?"
                say: "How many mice are there?"
                show: { object: mouse, count: 2, layout: row }
                options: ["2", "3", "4"]
                answer: "2"
                difficulty: easy

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "How many apples?"
            say: "How many apples are there?"
            show: { object: apple, count: 4, layout: row }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l2-c2
            type: tap_to_count
            text: "Tap each ball once. How many are there?"
            say: "Tap each ball once. How many balls are there?"
            show: { object: ball, count: 5, layout: scattered }
            options: ["3", "4", "5"]
            answer: "5"
          - id: l2-c3
            type: image_multiple_choice
            text: "Where are 4 eggs?"
            say: "Where are four eggs? Tap the picture."
            options:
              - { object: egg, count: 5, layout: row }
              - { object: egg, count: 4, layout: row }
              - { object: egg, count: 3, layout: row }
            answer: "4"
          - id: l2-c4
            type: true_false
            text: "Are there 3 frogs?"
            say: "Count the frogs. Are there three frogs?"
            show: { object: frog, count: 3, layout: scattered }
            answer: true
