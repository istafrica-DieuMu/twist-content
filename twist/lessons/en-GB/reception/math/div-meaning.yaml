# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.div-meaning
skill: math.mult-div.div-meaning
curriculum: en-GB
language: en
title:
  de: Fair teilen und Gruppen bilden
  en: Sharing and grouping
summary: >
  The first division, with real things and small numbers to 10. Lesson 1
  shares fairly (six strawberries between two children: how many each?)
  and asks whether a share is fair; lesson 2 makes equal groups (eight
  socks in pairs: how many pairs?), mixes the two and ends with the skill
  check. EYFS words: share fairly, equal, each, groups of, pairs. No
  division sign: the pictures and the spoken story carry it.
metadata:
  year: reception
  topic: { de: Geteiltaufgaben, en: Division }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.count-to-10]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { en: [share, fair, equal, each, groups of, pairs, how many groups] }
  no_reading: true
  forms: [drawn, picture, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: fair, what: { de: "erkennen, ob fair geteilt ist (jeder bekommt gleich viele)", en: "telling whether a share is fair (each gets the same)" } }
    - { id: share, what: { de: "fair teilen und sagen, wie viele jeder bekommt", en: sharing fairly and saying how many each gets } }
    - { id: group, what: { de: "gleich große Gruppen bilden und sagen, wie viele Gruppen es sind", en: making equal groups and saying how many groups there are } }
  misconceptions:
    - id: unequal-share
      what: Accepts any split as sharing, even when one child gets more (four and two)
      addressed: Learn in lesson 1 shows a fair and an unfair share; the child picks the fair picture in l1-f1 (with feedback), l1-f5, l1-s3, l1-n3, l1-c1, l2-s5 and the skill check task l2-c1, and judges a share in l1-f3, l1-s2, l1-n2, l1-c3, l2-w2, l2-n3 and l2-c4
    - id: answers-the-total
      what: Gives the number of things there are instead of how many each child gets (4 for four apples shared by two)
      addressed: the total is an option in nearly every sharing task, with feedback in l1-f2
    - id: groups-or-size
      what: Gives how many are in each group when the question asks how many groups (5 for ten eggs, five in each box)
      addressed: Learn in lesson 2 sets "how many each?" against "how many groups?"; the group size is an option in l2-f1, l2-f2 (with feedback), l2-s2, l2-s4, l2-n1, l2-n2, l2-c3 and l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Fair teilen, en: Sharing fairly }
    goal:
      de: "Teile gerecht, damit jedes Kind gleich viel bekommt, so wie 6 Erdbeeren, 3 für jedes Kind."
      en: "Share things fairly so each child gets the same, like 6 strawberries, 3 each."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tap_to_count
            text: "How many apples?"
            say: "Tap each apple once. How many apples are there?"
            show: { object: apple, count: 6, layout: row }
            options: ["5", "6", "7"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: tap_to_count
            text: "How many strawberries?"
            say: "Tap each strawberry once. How many strawberries are there?"
            show: { object: strawberry, count: 8, layout: scattered }
            options: ["7", "8", "9"]
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: "Here are six strawberries. Two children want to share them fairly. How many do you think each child will get? Have a guess."
            show: { object: strawberry, count: 6, layout: row }
          - say: "Let's find out. Fair means each child gets the same."
            show: { object: strawberry, count: 6, layout: row }
          - say: "One for you, one for me. One for you, one for me. One for you, one for me. Each child gets three. Three and three: that is fair."
            show: { drawn: dots, groups: [3, 3], layout: dice }
          - say: "Four and two is not fair. One child has more than the other."
            show: { drawn: dots, groups: [4, 2], layout: dice }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "2 children share 6 cakes. Which is fair?"
                say: "Two children share six cakes. Which picture shows a fair share?"
                options:
                  - { drawn: dots, groups: [4, 2], layout: dice }
                  - { drawn: dots, groups: [3, 3], layout: dice }
                  - { drawn: dots, groups: [5, 1], layout: dice }
                answer: "3+3"
                feedback:
                  "4+2": "Four and two are not the same. Fair means each child gets the same."
                hints:
                  - "Fair means both sides have the same."
                  - "Count each side. Which picture has two sides that match?"
                  - "Three and three. Tap that picture."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "4 apples shared fairly between 2 children. How many each?"
                say: "Four apples are shared fairly between two children. How many apples does each child get?"
                show: { object: apple, count: 4, layout: row }
                options: ["1", "2", "4"]
                answer: "2"
                feedback:
                  "4": "Four is all the apples. Share them out: one for you, one for me. Each child gets two."
                hints:
                  - "Give one apple to each child. Are there any left?"
                  - "One for you, one for me, one for you, one for me."
                  - "Each child gets 2."
              - id: l1-f3
                type: true_false
                text: "5 on one plate, 3 on the other. Is it fair?"
                say: "Five on one plate and three on the other. Is that a fair share?"
                show: { drawn: dots, groups: [5, 3], layout: dice }
                answer: false
                hints:
                  - "Count each plate."
                  - "Are five and three the same?"
                  - "No. One plate has more, so it is not fair."
              - id: l1-f4
                type: multiple_choice
                text: "8 bananas shared fairly between 2 monkeys. How many each?"
                say: "Eight bananas are shared fairly between two monkeys. How many bananas does each monkey get?"
                show: { object: banana, count: 8, layout: row }
                options: ["2", "4", "8"]
                answer: "4"
                hints:
                  - "Give one to each monkey, then one more to each, until none are left."
                  - "Two each, three each, four each."
                  - "Each monkey gets 4."
              - id: l1-f5
                type: image_multiple_choice
                text: "2 children share 10 stickers. Which is fair?"
                say: "Two children share ten stickers. Which picture shows a fair share?"
                options:
                  - { drawn: dots, groups: [6, 4], layout: dice }
                  - { drawn: dots, groups: [7, 3], layout: dice }
                  - { drawn: dots, groups: [5, 5], layout: dice }
                answer: "5+5"
                hints:
                  - "Look for two sides that match."
                  - "Count each side."
                  - "Five and five. Tap that picture."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "6 cakes shared fairly between 2 children. How many each?"
                say: "Six cakes are shared fairly between two children. How many cakes does each child get?"
                show: { object: cake, count: 6, layout: row }
                options: ["2", "3", "6"]
                answer: "3"
                hints: ["One for you, one for me, until all the cakes are gone."]
              - id: l1-s2
                type: true_false
                text: "4 on one plate, 4 on the other. Is it fair?"
                say: "Four on one plate and four on the other. Is that a fair share?"
                show: { drawn: dots, groups: [4, 4], layout: dice }
                answer: true
                hints: ["Count each plate. Are they the same?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "2 children share 8 grapes. Which is fair?"
                say: "Two children share eight grapes. Which picture shows a fair share?"
                options:
                  - { drawn: dots, groups: [4, 4], layout: dice }
                  - { drawn: dots, groups: [5, 3], layout: dice }
                  - { drawn: dots, groups: [6, 2], layout: dice }
                answer: "4+4"
                hints: ["Fair means both sides are the same."]
              - id: l1-s4
                type: multiple_choice
                text: "2 eggs shared fairly between 2 children. How many each?"
                say: "Two eggs are shared fairly between two children. How many eggs does each child get?"
                show: { object: egg, count: 2, layout: row }
                options: ["1", "2", "3"]
                answer: "1"
                hints: ["One for you, one for me."]
              - id: l1-s5
                type: multiple_choice
                text: "6 sweets shared fairly between 3 children. How many each?"
                say: "Six sweets are shared fairly between three children. Each row is one child. How many sweets does each child get?"
                show: { drawn: dots, array: [3, 2] }
                options: ["2", "3", "6"]
                answer: "2"
                hints: ["Count the sweets in one row."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "10 strawberries shared fairly between 2 children. How many each?"
                say: "Ten strawberries are shared fairly between two children. How many strawberries does each child get?"
                show: { object: strawberry, count: 10, layout: row }
                options: ["4", "5", "10"]
                answer: "5"
              - id: l1-n2
                type: true_false
                text: "3 on one plate, 2 on the other. Is it fair?"
                say: "Three on one plate and two on the other. Is that a fair share?"
                show: { drawn: dots, groups: [3, 2], layout: dice }
                answer: false
              - id: l1-n3
                type: image_multiple_choice
                text: "2 children share 4 biscuits. Which is fair?"
                say: "Two children share four biscuits. Which picture shows a fair share?"
                options:
                  - { drawn: dots, groups: [3, 1], layout: dice }
                  - { drawn: dots, groups: [2, 2], layout: dice }
                  - { drawn: dots, groups: [1, 3], layout: dice }
                answer: "2+2"
              - id: l1-n4
                type: multiple_choice
                text: "9 grapes shared fairly between 3 children. How many each?"
                say: "Nine grapes are shared fairly between three children. Each row is one child. How many grapes does each child get?"
                show: { drawn: dots, array: [3, 3] }
                options: ["2", "3", "9"]
                answer: "3"
              - id: l1-n5
                type: multiple_choice
                text: "Mum shares 8 stickers fairly between Ben and Sam. How many does Ben get?"
                say: "Mum has eight stickers for Ben and Sam. She shares them fairly. How many stickers does Ben get?"
                show: { object: sticker, count: 8, layout: row }
                options: ["2", "4", "8"]
                answer: "4"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "3 children share 9 grapes. Which is fair?"
            say: "Three children share nine grapes. Which picture shows a fair share?"
            options:
              - { drawn: dots, groups: [4, 3, 2], layout: dice }
              - { drawn: dots, groups: [5, 2, 2], layout: dice }
              - { drawn: dots, groups: [3, 3, 3], layout: dice }
            answer: "3+3+3"
          - id: l1-c2
            type: multiple_choice
            text: "4 eggs shared fairly between 2 children. How many each?"
            say: "Four eggs are shared fairly between two children. How many eggs does each child get?"
            show: { object: egg, count: 4, layout: row }
            options: ["2", "3", "4"]
            answer: "2"
          - id: l1-c3
            type: true_false
            text: "5 on one plate, 5 on the other. Is it fair?"
            say: "Five on one plate and five on the other. Is that a fair share?"
            show: { drawn: dots, groups: [5, 5], layout: dice }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "10 pencils shared fairly between 2 children. How many each?"
            say: "Ten pencils are shared fairly between two children. How many pencils does each child get?"
            show: { object: pencil, count: 10, layout: row }
            options: ["2", "5", "10"]
            answer: "5"
          - id: l1-c5
            type: true_false
            text: "4 on one plate, 3 on the other. Is it fair?"
            say: "Four on one plate and three on the other. Is that a fair share?"
            show: { drawn: dots, groups: [4, 3], layout: dice }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "2 children share 10 shells. Which is fair?"
            say: "Two children share ten shells. Which picture shows a fair share?"
            options:
              - { drawn: dots, groups: [4, 6], layout: dice }
              - { drawn: dots, groups: [5, 5], layout: dice }
              - { drawn: dots, groups: [8, 2], layout: dice }
            answer: "5+5"

  - n: 2
    title: { de: Gleich große Gruppen, en: Equal groups }
    goal:
      de: "Leg Dinge in gleich große Gruppen und zähl die Gruppen, so wie 8 Socken sind 4 Paare."
      en: "Put things in equal groups and count the groups, like 8 socks make 4 pairs."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "8 cakes shared fairly between 2 children. How many each?"
            say: "Eight cakes are shared fairly between two children. How many cakes does each child get?"
            show: { object: cake, count: 8, layout: row }
            options: ["2", "4", "8"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "2 on one plate, 4 on the other. Is it fair?"
            say: "Two on one plate and four on the other. Is that a fair share?"
            show: { drawn: dots, groups: [2, 4], layout: dice }
            answer: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: "Here are eight socks. Socks go in pairs: two in each pair. How many pairs do you think we can make? Have a guess."
            show: { object: sock, count: 8, layout: row }
          - say: "Let's find out. Put them in twos. Each row is one pair: one pair, two pairs, three pairs, four pairs. Eight socks make four pairs."
            show: { drawn: dots, array: [4, 2] }
          - say: "Ten eggs, five in each box. Each row is one box: one box, two boxes. Sharing asks how many each. Grouping asks how many groups."
            show: { drawn: dots, array: [2, 5] }
          - text: "Did you know?"
            say: "Did you know? Some groups of animals have funny names. A group of owls is called a parliament. And a group of lions is called a pride!"
            show: { object: owl, count: 3, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "6 shoes. 2 shoes make a pair. How many pairs?"
                say: "Six shoes. Two shoes make a pair. How many pairs?"
                show: { object: shoe, count: 6, layout: row }
                options: ["2", "3", "6"]
                answer: "3"
                hints:
                  - "Put the shoes in twos. Count the pairs, not the shoes."
                  - "One pair, two pairs ..."
                  - "There are 3 pairs."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "10 eggs, 5 in each box. How many boxes?"
                say: "Ten eggs, five in each box. Each row is one box. How many boxes?"
                show: { drawn: dots, array: [2, 5] }
                options: ["2", "5", "10"]
                answer: "2"
                feedback:
                  "5": "Five is how many eggs go in each box. Count the boxes: there are two."
                hints:
                  - "The question asks how many boxes."
                  - "Count the rows."
                  - "There are 2 boxes."
              - id: l2-f3
                type: image_multiple_choice
                text: "8 children stand in pairs, 2 in each row. Which picture shows them?"
                say: "Eight children stand in pairs, two in each row. Which picture shows them?"
                options:
                  - { drawn: dots, array: [2, 4] }
                  - { drawn: dots, array: [4, 2] }
                  - { drawn: dots, array: [1, 8] }
                answer: "4x2"
                hints:
                  - "In a pair there are two."
                  - "Look for rows with two in each."
                  - "Four rows of two. Tap that picture."
              - id: l2-f4
                type: multiple_choice
                text: "4 children, 2 on each seesaw. How many seesaws?"
                say: "Four children go on the seesaws. Two children on each seesaw. Each row is one seesaw. How many seesaws do they need?"
                show: { drawn: dots, array: [2, 2] }
                options: ["1", "2", "4"]
                answer: "2"
                feedback:
                  "1": "One seesaw for four children? That would be a very squashed seesaw! Two on each: two seesaws."
                hints:
                  - "Put the children in twos."
                  - "Two children, then two more children."
                  - "They need 2 seesaws."
              - id: l2-f5
                type: true_false
                text: "10 wellies in pairs. Are there 5 pairs?"
                say: "Ten wellies, in pairs. Each row is one pair. Are there five pairs?"
                show: { drawn: dots, array: [5, 2] }
                answer: true
                hints:
                  - "Count the rows."
                  - "One, two, three, four, five rows."
                  - "Yes. Ten wellies make five pairs."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "4 gloves. 2 gloves make a pair. How many pairs?"
                say: "Four gloves. Two gloves make a pair. Each row is one pair. How many pairs?"
                show: { drawn: dots, array: [2, 2] }
                options: ["1", "2", "4"]
                answer: "2"
                hints: ["Count the rows."]
              - id: l2-s2
                type: multiple_choice
                text: "6 cakes, 3 on each plate. How many plates?"
                say: "Six cakes, three on each plate. Each row is one plate. How many plates?"
                show: { drawn: dots, array: [2, 3] }
                options: ["2", "3", "6"]
                answer: "2"
                hints: ["The question asks how many plates. Count the rows."]
              - id: l2-s3
                type: true_false
                text: "8 socks in pairs. Are there 2 pairs?"
                say: "Eight socks, in pairs. Each row is one pair. Are there two pairs?"
                show: { drawn: dots, array: [4, 2] }
                answer: false
                hints: ["Count the rows, one by one."]
              - id: l2-s4
                type: multiple_choice
                text: "10 marbles, 5 in each bag. How many bags?"
                say: "Ten marbles. Five marbles go in each bag. How many bags?"
                show: { object: marble, count: 10, layout: row }
                options: ["2", "5", "10"]
                answer: "2"
                hints: ["Count out five marbles for one bag, then five for the next."]
              - id: l2-s5
                type: image_multiple_choice
                text: "2 children share 8 cars. Which is fair?"
                say: "Two children share eight cars. Which picture shows a fair share?"
                options:
                  - { drawn: dots, groups: [5, 3], layout: dice }
                  - { drawn: dots, groups: [4, 4], layout: dice }
                  - { drawn: dots, groups: [2, 6], layout: dice }
                answer: "4+4"
                hints: ["Fair means both sides are the same."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "10 wellies. 2 wellies make a pair. How many pairs?"
                say: "Ten wellies. Two wellies make a pair. Each row is one pair. How many pairs?"
                show: { drawn: dots, array: [5, 2] }
                options: ["2", "5", "10"]
                answer: "5"
              - id: l2-n2
                type: multiple_choice
                text: "6 apples, 2 in each bag. How many bags?"
                say: "Six apples, two in each bag. Each row is one bag. How many bags?"
                show: { drawn: dots, array: [3, 2] }
                options: ["2", "3", "6"]
                answer: "3"
              - id: l2-n3
                type: true_false
                text: "Ben gets 3 toy cars and Sam gets 3. Is it fair?"
                say: "Ben gets three toy cars and Sam gets three toy cars. Is that a fair share?"
                show: { drawn: dots, groups: [3, 3], layout: dice }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "8 children, 2 in each car. How many cars?"
                say: "Eight children go on a ride. Two children sit in each car. How many cars do they need?"
                show: { object: child, count: 8, layout: row }
                options: ["2", "4", "8"]
                answer: "4"
              - id: l2-n5
                type: multiple_choice
                text: "6 cakes shared fairly between 3 friends. How many each?"
                say: "Six cakes are shared fairly between three friends. How many cakes does each friend get?"
                show: { object: cake, count: 6, layout: row }
                options: ["2", "3", "6"]
                answer: "2"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: fair
            type: image_multiple_choice
            text: "2 children share 8 biscuits. Which is fair?"
            say: "Two children share eight biscuits. Which picture shows a fair share?"
            options:
              - { drawn: dots, groups: [6, 2], layout: dice }
              - { drawn: dots, groups: [3, 5], layout: dice }
              - { drawn: dots, groups: [4, 4], layout: dice }
            answer: "4+4"
          - id: l2-c2
            part: share
            type: multiple_choice
            text: "4 pears shared fairly between 4 children. How many each?"
            say: "Four pears are shared fairly between four children. How many pears does each child get?"
            show: { object: pear, count: 4, layout: row }
            options: ["1", "2", "4"]
            answer: "1"
          - id: l2-c3
            part: group
            type: multiple_choice
            text: "8 cakes, 4 on each plate. How many plates?"
            say: "Eight cakes, four on each plate. Each row is one plate. How many plates?"
            show: { drawn: dots, array: [2, 4] }
            options: ["2", "4", "8"]
            answer: "2"
          - id: l2-c4
            part: fair
            type: true_false
            text: "Mia gets 2 sweets and Leo gets 3. Is it fair?"
            say: "Mia gets two sweets and Leo gets three. Is that a fair share?"
            show: { drawn: dots, groups: [2, 3], layout: dice }
            answer: false
          - id: l2-c5
            part: group
            type: multiple_choice
            text: "6 pencils, 2 in each pot. How many pots?"
            say: "Six pencils, two in each pot. How many pots?"
            show: { object: pencil, count: 6, layout: row }
            options: ["2", "3", "4"]
            answer: "3"
          - id: l2-c6
            part: fair
            type: true_false
            text: "Ben gets 2 grapes and Sam gets 2. Is it fair?"
            say: "Ben gets two grapes and Sam gets two grapes. Is that a fair share?"
            show: { drawn: dots, groups: [2, 2], layout: dice }
            answer: true
          - id: l2-c7
            part: share
            type: multiple_choice
            text: "8 strawberries shared fairly between 2 children. How many each?"
            say: "Eight strawberries are shared fairly between two children. How many strawberries does each child get?"
            show: { object: strawberry, count: 8, layout: row }
            options: ["2", "4", "8"]
            answer: "4"
          - id: l2-c8
            part: group
            type: multiple_choice
            text: "6 children, 3 on each bench. How many benches?"
            say: "Six children sit down, three children on each bench. Each row is one bench. How many benches?"
            show: { drawn: dots, array: [2, 3] }
            options: ["1", "2", "3"]
            answer: "2"
          - id: l2-c9
            part: fair
            type: image_multiple_choice
            text: "2 children share 10 cakes. Which is fair?"
            say: "Two children share ten cakes. Which picture shows a fair share?"
            options:
              - { drawn: dots, groups: [3, 7], layout: dice }
              - { drawn: dots, groups: [9, 1], layout: dice }
              - { drawn: dots, groups: [5, 5], layout: dice }
            answer: "5+5"
          - id: l2-c10
            part: share
            type: true_false
            text: "6 cakes shared fairly between 3 children. Does each child get 3?"
            say: "Six cakes are shared fairly between three children. Each row is one child. Does each child get three cakes?"
            show: { drawn: dots, array: [3, 2] }
            answer: false
          - id: l2-c11
            part: group
            type: multiple_choice
            text: "9 eggs, 3 in each box. How many boxes?"
            say: "Nine eggs, three in each box. Each row is one box. How many boxes?"
            show: { drawn: dots, array: [3, 3] }
            options: ["2", "3", "9"]
            answer: "3"
          - id: l2-c12
            part: fair
            type: true_false
            text: "6 on one plate, 4 on the other. Is it fair?"
            say: "Six on one plate and four on the other. Is that a fair share?"
            show: { drawn: dots, groups: [6, 4], layout: dice }
            answer: false
          - id: l2-c13
            part: share
            type: multiple_choice
