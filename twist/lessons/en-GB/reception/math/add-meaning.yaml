# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.add-meaning
skill: math.add-sub-to-20.add-meaning
curriculum: en-GB
language: en
title:
  de: Was bedeutet plus?
  en: Adding more
summary: >
  The first adding: more things come along, or two groups are put
  together. EYFS children tell it as a First, Then, Now story (first
  there were 3 ducks, then 2 more came, now there are 5). Lesson 1 adds
  one or two more; lesson 2 puts two groups together and ends with the
  skill check. No written sums: the pictures and the spoken story carry
  it.
metadata:
  year: reception
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.partition-to-10]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { en: [more, altogether, first, then, now, add, make] }
  no_reading: true
  forms: [drawn, picture, audio]
  drawn: [ten-frame, part-whole]
  facets: []
  parts:
    - { id: more, what: { de: "sagen, wie viele es sind, wenn noch mehr dazukommen", en: "saying how many there are now when more come along" } }
    - { id: together, what: { de: "zwei Gruppen zusammenlegen und sagen, wie viele es zusammen sind", en: putting two groups together and saying how many altogether } }
    - { id: whole, what: { de: im Teile-Ganzes-Modell das Ganze aus zwei Teilen finden, en: finding the whole from two parts in a part-whole model } }
  misconceptions:
    - id: count-all-from-one
      what: Counts everything from one after more arrive
      addressed: lesson 1 Learn counts on from the first group; hints say "Start with three and count on."
    - id: forgets-first-group
      what: Gives the number that arrived as the answer (2 for 3 and 2 more)
      addressed: the number that arrived is an option in most story tasks; feedback on the first ones says to count the ones already there too
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Es kommen noch mehr, en: More are coming }
    goal:
      de: "Wenn noch mehr dazukommen, zähl weiter, so wie 3 Enten und 2 mehr sind 5."
      en: "When more come along, count on to find how many, like 3 ducks and 2 more make 5."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Three ducks are on the pond. Two more ducks are flying in. How many ducks do you think there will be? Have a guess."
            show: { object: duck, count: 3, layout: row }
          - say: "Let's find out. First, there were three ducks on the pond."
            show: { object: duck, count: 3, layout: row }
          - say: "Then, two more ducks came. Keep three in your head and count on: four, five."
            show: { drawn: ten-frame, filled: 5, colour_split: [3, 2] }
          - say: "Now, there are five ducks. Three and two more make five."
            show: { object: duck, count: 5, layout: row }
          - text: "Did you know?"
            say: "Did you know? A queen bee can lay more than a thousand eggs in one day. So every day, more and more bees join the hive!"
            show: { object: bee, count: 1, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many now?"
                say: "First, there were two red counters. Then, we added one blue counter. How many are there now?"
                show: { drawn: ten-frame, filled: 3, colour_split: [2, 1] }
                options: ["1", "3", "4"]
                answer: "3"
                feedback:
                  "1": "One is the counter we added. Count them all: there are three."
                hints:
                  - "Start with two and count on."
                  - "Two, then one more: three."
                  - "There are 3."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "First 4 apples. Then 1 more. How many now?"
                say: "First, there were four apples. Then, one more apple came. How many apples are there now?"
                show: { object: apple, groups: [4, 1] }
                options: ["4", "5", "6"]
                answer: "5"
                hints:
                  - "Start with four."
                  - "One more than four."
                  - "There are 5."
              - id: l1-f3
                type: image_multiple_choice
                text: "First 3 stars. Then 2 more. Which picture shows how many now?"
                say: "First, there were three stars. Then, two more came. Which picture shows how many there are now?"
                show: { object: star, groups: [3, 2] }
                options:
                  - { object: star, count: 2, layout: row }
                  - { object: star, count: 5, layout: row }
                  - { object: star, count: 3, layout: row }
                answer: "5"
                hints:
                  - "Three and two more."
                  - "Count on from three: four, five."
                  - "The picture with five stars."
              - id: l1-f4
                type: true_false
                text: "First 4 cars. Then 1 more. Is it 5 now?"
                say: "First, there were four cars. Then, one more car came. Are there five cars now?"
                show: { object: car, groups: [4, 1] }
                answer: true
                hints:
                  - "Four and one more."
                  - "One more than four is five."
                  - "Yes."
              - id: l1-f5
                type: multiple_choice
                text: "How many now?"
                say: "First, there were five red counters. Then, we added two blue counters. How many are there now?"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                options: ["2", "6", "7"]
                answer: "7"
                hints:
                  - "A full row is five."
                  - "Five, then six, seven."
                  - "There are 7."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "First 1 bee. Then 2 more. How many now?"
                say: "First, there was one bee. Then, two more bees came. How many bees are there now?"
                show: { object: bee, groups: [1, 2] }
                options: ["2", "3", "4"]
                answer: "3"
                hints: ["Start with one and count on two."]
              - id: l1-s2
                type: multiple_choice
                text: "How many now?"
                say: "First, there were three red counters. Then, we added three blue counters. How many are there now?"
                show: { drawn: ten-frame, filled: 6, colour_split: [3, 3] }
                options: ["3", "5", "6"]
                answer: "6"
                hints: ["Count them all."]
              - id: l1-s3
                type: image_multiple_choice
                text: "First 2 balls. Then 2 more. Which picture shows how many now?"
                say: "First, there were two balls. Then, two more came. Which picture shows how many there are now?"
                show: { object: ball, groups: [2, 2] }
                options:
                  - { object: ball, count: 4, layout: row }
                  - { object: ball, count: 2, layout: row }
                  - { object: ball, count: 3, layout: row }
                answer: "4"
                hints: ["Two and two more."]
              - id: l1-s4
                type: true_false
                text: "First 3 fish. Then 1 more. Is it 3 now?"
                say: "First, there were three fish. Then, one more fish came. Are there three fish now?"
                show: { object: fish, groups: [3, 1] }
                answer: false
                hints: ["One more came."]
              - id: l1-s5
                type: multiple_choice
                text: "First 6 children on the bus. Then 1 more gets on. How many now?"
                say: "First, there were six children on the bus. Then, one more got on. How many are on the bus now?"
                show: { object: child, groups: [6, 1] }
                options: ["6", "7", "8"]
                answer: "7"
                hints: ["One more than six."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many now?"
                say: "First, there were four red counters. Then, we added one blue counter. How many are there now?"
                show: { drawn: ten-frame, filled: 5, colour_split: [4, 1] }
                options: ["1", "5", "6"]
                answer: "5"
              - id: l1-n2
                type: multiple_choice
                text: "First 2 cups. Then 3 more. How many now?"
                say: "First, there were two cups. Then, three more cups came. How many cups are there now?"
                show: { object: cup, groups: [2, 3] }
                options: ["4", "5", "6"]
                answer: "5"
              - id: l1-n3
                type: image_multiple_choice
                text: "First 1 duck. Then 3 more. Which picture shows how many now?"
                say: "First, there was one duck. Then, three more came. Which picture shows how many there are now?"
                show: { object: duck, groups: [1, 3] }
                options:
                  - { object: duck, count: 3, layout: row }
                  - { object: duck, count: 4, layout: row }
                  - { object: duck, count: 1, layout: row }
                answer: "4"
              - id: l1-n4
                type: true_false
                text: "First 7 red counters. Then 1 more. Is it 8 now?"
                say: "First, there were seven red counters. Then, we added one more. Are there eight now?"
                show: { drawn: ten-frame, filled: 8, colour_split: [7, 1] }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "First 5 hats. Then 2 more. How many now?"
                say: "First, there were five hats. Then, two more hats came. How many hats are there now?"
                show: { object: hat, groups: [5, 2] }
                options: ["6", "7", "8"]
                answer: "7"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "First 7 red counters. Then 2 blue. How many now?"
            say: "First, there were seven red counters. Then, we added two blue counters. How many are there now?"
            show: { drawn: ten-frame, filled: 9, colour_split: [7, 2] }
            options: ["2", "8", "9"]
            answer: "9"
          - id: l1-c2
            type: multiple_choice
            text: "First 2 shells. Then 1 more. How many now?"
            say: "First, there were two shells. Then, one more shell came. How many shells are there now?"
            show: { object: shell, groups: [2, 1] }
            options: ["2", "3", "4"]
            answer: "3"
          - id: l1-c3
            type: true_false
            text: "First 5 stars. Then 1 more. Is it 6 now?"
            say: "First, there were five stars. Then, one more star came. Are there six stars now?"
            show: { object: star, groups: [5, 1] }
            answer: true
          - id: l1-c4
            type: image_multiple_choice
            text: "First 1 car. Then 2 more. Which picture shows how many now?"
            say: "First, there was one car. Then, two more cars came. Which picture shows how many there are now?"
            show: { object: car, groups: [1, 2] }
            options:
              - { object: car, count: 2, layout: row }
              - { object: car, count: 1, layout: row }
              - { object: car, count: 3, layout: row }
            answer: "3"
          - id: l1-c5
            type: multiple_choice
            text: "First 6 red counters. Then 1 blue. How many now?"
            say: "First, there were six red counters. Then, we added one blue counter. How many are there now?"
            show: { drawn: ten-frame, filled: 7, colour_split: [6, 1] }
            options: ["1", "6", "7"]
            answer: "7"
          - id: l1-c6
            type: true_false
            text: "First 4 bees. Then 3 more. Is it 6 now?"
            say: "First, there were four bees. Then, three more bees came. Are there six bees now?"
            show: { object: bee, groups: [4, 3] }
            answer: false

  - n: 2
    title: { de: Zusammen, en: Altogether }
    goal:
      de: "Leg zwei Gruppen zusammen und finde heraus, wie viele es zusammen sind, so wie 4 und 2 sind 6."
      en: "Put two groups together and find how many altogether, like 4 and 2 make 6."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Here are two groups: four red counters and two blue counters. Do you think there are more than five altogether? Have a guess."
            show: { drawn: ten-frame, filled: 6, colour_split: [4, 2] }
          - say: "Let's put them together. How many altogether? Four, then five, six. Six altogether, so yes, more than five!"
            show: { drawn: part-whole, whole: 6, parts: [4, 2] }
          - say: "In the part-whole model, the two groups are the parts. Altogether is the whole: four and two make six."
            show: { drawn: part-whole, whole: 6, parts: [4, 2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many altogether?"
                say: "Two red counters and three blue counters. How many altogether?"
                show: { drawn: ten-frame, filled: 5, colour_split: [2, 3] }
                options: ["3", "4", "5"]
                answer: "5"
                feedback:
                  "3": "Three is the blue ones. Count the red ones too."
                hints:
                  - "Count the red, then keep counting the blue."
                  - "Two, then three, four, five."
                  - "5 altogether."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What is the whole?"
                say: "The parts are three and one. What is the whole?"
                show: { drawn: part-whole, whole: null, parts: [3, 1] }
                options: ["2", "4", "5"]
                answer: "4"
                hints:
                  - "The whole is both parts together."
                  - "Three and one more."
                  - "The whole is 4."
              - id: l2-f3
                type: multiple_choice
                text: "Sam has 2 apples. Mia has 2 apples. How many altogether?"
                say: "Sam has two apples. Mia has two apples. How many apples altogether?"
                show: { object: apple, groups: [2, 2] }
                options: ["2", "3", "4"]
                answer: "4"
                hints:
                  - "Put both groups together."
                  - "Two and two."
                  - "4 altogether."
              - id: l2-f4
                type: true_false
                text: "5 red and 2 blue. Is it 7 altogether?"
                say: "Five red counters and two blue counters. Are there seven altogether?"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                answer: true
                hints:
                  - "A full row is five."
                  - "Five, then six, seven."
                  - "Yes."
              - id: l2-f5
                type: multiple_choice
                text: "What is the whole?"
                say: "The parts are four and four. What is the whole?"
                show: { drawn: part-whole, whole: null, parts: [4, 4] }
                options: ["4", "7", "8"]
                answer: "8"
                hints:
                  - "Both parts together."
                  - "Start at four and count on four."
                  - "The whole is 8."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many altogether?"
                say: "One red counter and four blue counters. How many altogether?"
                show: { drawn: ten-frame, filled: 5, colour_split: [1, 4] }
                options: ["4", "5", "6"]
                answer: "5"
                hints: ["Start with four and count on one."]
              - id: l2-s2
                type: multiple_choice
                text: "What is the whole?"
                say: "The parts are two and five. What is the whole?"
                show: { drawn: part-whole, whole: null, parts: [2, 5] }
                options: ["5", "7", "8"]
                answer: "7"
                hints: ["Start with the bigger part, five."]
              - id: l2-s3
                type: image_multiple_choice
                text: "3 cats on the wall and 3 cats on the mat. Which picture shows all the cats?"
                say: "Three cats are on the wall and three cats are on the mat. Which picture shows all the cats together?"
                show: { object: cat, groups: [3, 3] }
                options:
                  - { object: cat, count: 3, layout: row }
                  - { object: mouse, count: 1, layout: row }
                  - { object: cat, count: 6, layout: row }
                answer: "6"
                feedback:
                  "1": "That's a mouse! It's hiding from all those cats."
                hints: ["Three and three."]
              - id: l2-s4
                type: true_false
                text: "3 red and 3 blue. Is it 5 altogether?"
                say: "Three red counters and three blue counters. Are there five altogether?"
                show: { drawn: ten-frame, filled: 6, colour_split: [3, 3] }
                answer: false
                hints: ["Count them all."]
              - id: l2-s5
                type: multiple_choice
                text: "What is the whole?"
                say: "The parts are six and two. What is the whole?"
                show: { drawn: part-whole, whole: null, parts: [6, 2] }
                options: ["7", "8", "9"]
                answer: "8"
                hints: ["Six, then seven, eight."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many altogether?"
                say: "Four red counters and three blue counters. How many altogether?"
                show: { drawn: ten-frame, filled: 7, colour_split: [4, 3] }
                options: ["6", "7", "8"]
                answer: "7"
              - id: l2-n2
                type: multiple_choice
                text: "What is the whole?"
                say: "The parts are five and five. What is the whole?"
                show: { drawn: part-whole, whole: null, parts: [5, 5] }
                options: ["5", "9", "10"]
                answer: "10"
              - id: l2-n3
                type: image_multiple_choice
                text: "Tom has 2 balloons. Ava has 4 balloons. Which picture shows all the balloons?"
                say: "Tom has two balloons. Ava has four balloons. Which picture shows all the balloons together?"
                show: { object: balloon, groups: [2, 4] }
                options:
                  - { object: balloon, count: 6, layout: row }
                  - { object: balloon, count: 4, layout: row }
                  - { object: balloon, count: 5, layout: row }
                answer: "6"
              - id: l2-n4
                type: true_false
                text: "5 red and 4 blue. Is it 9 altogether?"
                say: "Five red counters and four blue counters. Are there nine altogether?"
                show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "What is the whole?"
                say: "The parts are one and seven. What is the whole?"
                show: { drawn: part-whole, whole: null, parts: [1, 7] }
                options: ["7", "8", "9"]
                answer: "8"

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: more
            type: multiple_choice
            text: "First 5 ducks. Then 2 more. How many now?"
            say: "First, there were five ducks. Then, two more ducks came. How many ducks are there now?"
            show: { object: duck, groups: [5, 2] }
            options: ["2", "6", "7"]
            answer: "7"
          - id: l2-c2
            part: together
            type: multiple_choice
            text: "3 red and 4 blue. How many altogether?"
            say: "Three red counters and four blue counters. How many altogether?"
            show: { drawn: ten-frame, filled: 7, colour_split: [3, 4] }
            options: ["4", "6", "7"]
            answer: "7"
          - id: l2-c3
            part: whole
            type: multiple_choice
            text: "The parts are 2 and 7. What is the whole?"
            say: "The parts are two and seven. What is the whole?"
            show: { drawn: part-whole, whole: null, parts: [2, 7] }
            options: ["7", "8", "9"]
            answer: "9"
          - id: l2-c4
            part: more
            type: true_false
            text: "First 3 bees. Then 1 more. Is it 4 now?"
            say: "First, there were three bees. Then, one more bee came. Are there four bees now?"
            show: { object: bee, groups: [3, 1] }
            answer: true
          - id: l2-c5
            part: more
            type: image_multiple_choice
            text: "First 3 fish. Then 3 more. Which picture shows how many now?"
            say: "First, there were three fish. Then, three more fish came. Which picture shows how many there are now?"
            show: { object: fish, groups: [3, 3] }
            options:
              - { object: fish, count: 3, layout: row }
              - { object: fish, count: 6, layout: row }
              - { object: fish, count: 5, layout: row }
            answer: "6"
          - id: l2-c6
            part: together
            type: multiple_choice
            text: "2 red and 6 blue. How many altogether?"
            say: "Two red counters and six blue counters. How many altogether?"
            show: { drawn: ten-frame, filled: 8, colour_split: [2, 6] }
            options: ["6", "8", "9"]
            answer: "8"
          - id: l2-c7
            part: whole
            type: multiple_choice
            text: "The parts are 3 and 3. What is the whole?"
            say: "The parts are three and three. What is the whole?"
            show: { drawn: part-whole, whole: null, parts: [3, 3] }
            options: ["3", "5", "6"]
            answer: "6"
          - id: l2-c8
            part: whole
            type: multiple_choice
            text: "The parts are 5 and 4. What is the whole?"
            say: "The parts are five and four. What is the whole?"
            show: { drawn: part-whole, whole: null, parts: [5, 4] }
            options: ["4", "8", "9"]
            answer: "9"
          - id: l2-c9
            part: more
            type: multiple_choice
            text: "First 5 children on the bus. Then 3 more get on. How many now?"
            say: "First, there were five children on the bus. Then, three more got on. How many are on the bus now?"
