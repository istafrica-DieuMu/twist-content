# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.add-to-10
skill: math.add-sub-to-20.add-to-10
curriculum: en-GB
language: en
title:
  de: Plusaufgaben bis 10
  en: Adding to 10
summary: >
  Adding two small numbers to 10 by counting on from the bigger one, and
  by seeing the five in a ten frame. Lesson 1 adds to 5 by counting on;
  lesson 2 adds to 10 using a full row of five, and ends with the skill
  check. Spoken questions; numbers say themselves.
metadata:
  year: reception
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.add-sub-to-20.add-meaning]
  also_practises: [math.numbers-to-20.subitize-to-10]
  vocabulary: { en: [add, and, make, count on, altogether] }
  no_reading: true
  forms: [drawn, audio]
  drawn: [ten-frame, number-line]
  facets: []
  misconceptions:
    - id: count-from-one
      what: Counts both groups from one every time
      addressed: Learn counts on from the first number; hints say "Start at the bigger number."
    - id: counts-start-twice
      what: "Counts the start number again when counting on (3 and 2 counted as three, four)"
      addressed: Learn hops on the number line; the first hop lands on the next number
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Weiterzählen, en: Counting on }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Three and two. You don't need to count every counter. Keep three in your head."
            show: { drawn: ten-frame, filled: 5, colour_split: [3, 2] }
          - say: "Then count on two more: four, five. Two hops on the number line."
            show: { drawn: number-line, from: 0, to: 10, labels: all, jumps: [[3, 1], [4, 1]] }
          - say: "Three and two make five. Start at the bigger number and count on."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "How many altogether?"
                say: "Two and one. How many altogether?"
                show: { drawn: ten-frame, filled: 3, colour_split: [2, 1] }
                options: ["2", "3", "4"]
                answer: "3"
                hints:
                  - "Start at two."
                  - "Count on one: three."
                  - "Two and one make 3."
                difficulty: easy
              - id: l1-f2
                type: point_on_line
                text: "Where do you land?"
                say: "Start at two. Hop on three more. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 5
                hints:
                  - "Start at two."
                  - "Three hops: three, four, five."
                  - "You land on 5."
              - id: l1-f3
                type: multiple_choice
                text: "How many altogether?"
                say: "Four and one. How many altogether?"
                options: ["4", "5", "6"]
                answer: "5"
                hints:
                  - "Start at four."
                  - "One more."
                  - "Four and one make 5."
              - id: l1-f4
                type: true_false
                text: "Do two and two make four?"
                say: "Two red counters and two blue counters. Do two and two make four?"
                show: { drawn: ten-frame, filled: 4, colour_split: [2, 2] }
                answer: true
                hints:
                  - "Start at two."
                  - "Count on two: three, four."
                  - "Yes."
              - id: l1-f5
                type: multiple_choice
                text: "How many altogether?"
                say: "One and three. Start at the bigger number. How many altogether?"
                options: ["3", "4", "5"]
                answer: "4"
                hints:
                  - "The bigger number is three."
                  - "Start at three, count on one."
                  - "One and three make 4."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "How many altogether?"
                say: "Three and one. How many altogether?"
                show: { drawn: ten-frame, filled: 4, colour_split: [3, 1] }
                options: ["3", "4", "5"]
                answer: "4"
                hints: ["Start at three."]
              - id: l1-s2
                type: point_on_line
                text: "Where do you land?"
                say: "Start at one. Hop on four more. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 5
                hints: ["Count on four hops from one."]
              - id: l1-s3
                type: multiple_choice
                text: "How many altogether?"
                say: "Two and three. How many altogether?"
                options: ["4", "5", "6"]
                answer: "5"
                hints: ["Start at three."]
              - id: l1-s4
                type: true_false
                text: "Do three and one make five?"
                say: "Do three and one make five?"
                answer: false
                hints: ["Start at three, one more."]
              - id: l1-s5
                type: multiple_choice
                text: "How many altogether?"
                say: "One and one. How many altogether?"
                options: ["1", "2", "3"]
                answer: "2"
                hints: ["One more than one."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "How many altogether?"
                say: "Four and one. How many altogether?"
                show: { drawn: ten-frame, filled: 5, colour_split: [4, 1] }
                options: ["4", "5", "6"]
                answer: "5"
              - id: l1-n2
                type: point_on_line
                text: "Where do you land?"
                say: "Start at three. Hop on two more. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 5
              - id: l1-n3
                type: multiple_choice
                text: "How many altogether?"
                say: "Two and two. How many altogether?"
                options: ["3", "4", "5"]
                answer: "4"
              - id: l1-n4
                type: true_false
                text: "Do four and one make five?"
                say: "Do four and one make five?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "How many altogether?"
                say: "One and two. How many altogether?"
                options: ["2", "3", "4"]
                answer: "3"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "How many altogether?"
            say: "Three and two. How many altogether?"
            options: ["4", "5", "6"]
            answer: "5"
          - id: l1-c2
            type: point_on_line
            text: "Where do you land?"
            say: "Start at two. Hop on two more. Where do you land?"
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            answer: 4
          - id: l1-c3
            type: true_false
            text: "Do one and three make four?"
            say: "Do one and three make four?"
            answer: true

  - n: 2
    title: { de: Plus bis 10, en: Adding to 10 }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - say: "Five and three. The top row of the ten frame is full: that is five. Three more are underneath."
            show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
          - say: "You can see five without counting. Then count on three: six, seven, eight. Five and three make eight."
            show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
          - say: "Two and six? Start at the bigger number, six, and count on two: seven, eight."
            show: { drawn: number-line, from: 0, to: 10, labels: all, jumps: [[6, 1], [7, 1]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "How many altogether?"
                say: "Five and two. How many altogether?"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                options: ["6", "7", "8"]
                answer: "7"
                hints:
                  - "The top row is five."
                  - "Count on two: six, seven."
                  - "Five and two make 7."
                difficulty: easy
              - id: l2-f2
                type: point_on_line
                text: "Where do you land?"
                say: "Start at six. Hop on three more. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 9
                hints:
                  - "Start at six."
                  - "Seven, eight, nine."
                  - "You land on 9."
              - id: l2-f3
                type: multiple_choice
                text: "How many altogether?"
                say: "Two and seven. Start at the bigger number. How many altogether?"
                options: ["8", "9", "10"]
                answer: "9"
                hints:
                  - "Start at seven."
                  - "Count on two: eight, nine."
                  - "Two and seven make 9."
              - id: l2-f4
                type: true_false
                text: "Do five and five make ten?"
                say: "Do five and five make ten?"
                show: { drawn: ten-frame, filled: 10, colour_split: [5, 5] }
                answer: true
                hints:
                  - "Two full rows."
                  - "A full ten frame is ten."
                  - "Yes."
              - id: l2-f5
                type: multiple_choice
                text: "How many altogether?"
                say: "Four and four. How many altogether?"
                options: ["7", "8", "9"]
                answer: "8"
                hints:
                  - "Start at four."
                  - "Five, six, seven, eight."
                  - "Four and four make 8."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "How many altogether?"
                say: "Five and four. How many altogether?"
                show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["The top row is five."]
              - id: l2-s2
                type: point_on_line
                text: "Where do you land?"
                say: "Start at seven. Hop on three more. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 10
                hints: ["Count on three hops from seven."]
              - id: l2-s3
                type: multiple_choice
                text: "How many altogether?"
                say: "One and eight. How many altogether?"
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["Start at eight."]
              - id: l2-s4
                type: true_false
                text: "Do six and two make nine?"
                say: "Do six and two make nine?"
                answer: false
                hints: ["Start at six, count on two."]
              - id: l2-s5
                type: multiple_choice
                text: "How many altogether?"
                say: "Three and four. How many altogether?"
                options: ["6", "7", "8"]
                answer: "7"
                hints: ["Start at four."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "How many altogether?"
                say: "Five and three. How many altogether?"
                show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                options: ["7", "8", "9"]
                answer: "8"
              - id: l2-n2
                type: point_on_line
                text: "Where do you land?"
                say: "Start at four. Hop on five more. Where do you land?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 9
              - id: l2-n3
                type: multiple_choice
                text: "How many altogether?"
                say: "Two and eight. How many altogether?"
                options: ["9", "10", "6"]
                answer: "10"
              - id: l2-n4
                type: true_false
                text: "Do seven and two make nine?"
                say: "Do seven and two make nine?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "How many altogether?"
                say: "Six and three. How many altogether?"
                options: ["8", "9", "10"]
                answer: "9"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "How many altogether?"
            say: "Six and one. How many altogether?"
            options: ["8", "6", "7"]
            answer: "7"
          - id: l2-c2
            type: multiple_choice
            text: "How many altogether?"
            say: "Five and one. How many altogether?"
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
            options: ["5", "6", "7"]
            answer: "6"
          - id: l2-c3
            type: point_on_line
            text: "Where do you land?"
            say: "Start at eight. Hop on two more. Where do you land?"
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            answer: 10
          - id: l2-c4
            type: true_false
            text: "Do three and five make nine?"
            say: "Do three and five make nine?"
            answer: false
