# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.order-to-10
skill: math.numbers-to-20.order-to-10
curriculum: en-GB
language: en
title:
  de: Zahlen ordnen bis 10
  en: Numbers in order to 10
summary: >
  Children learn the order of the numbers to 10 by counting forwards and
  backwards, putting amounts in order from fewest to most, and finding one
  more and one less, as in the EYFS. Written numerals come in Year 1, so
  everything is spoken or shown as an amount; number options say
  themselves. Lesson 1 is the order, lesson 2 is one more and one less and
  ends with the skill check.
metadata:
  year: reception
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.numbers-to-20.count-to-10]
  also_practises: [math.numbers-to-20.subitize-to-10]
  vocabulary: { en: [count on, count back, before, after, one more, one less, fewest, most] }
  no_reading: true
  forms: [drawn, picture, audio]
  drawn: [dots, ten-frame]
  facets: []
  parts:
    - { id: before-after, what: { de: die Zahl vor und nach einer Zahl bis 10 nennen, en: naming the number before and after a number to 10 } }
    - { id: count-back, what: { de: von 10 rückwärts zählen, en: counting back from 10 } }
    - { id: amounts, what: { de: "Anzahlen ordnen, von wenig nach viel", en: putting amounts in order from fewest to most } }
    - { id: more-less, what: { de: eins mehr und eins weniger finden, en: finding one more and one less } }
  misconceptions:
    - id: backwards-hard
      what: Can count forwards but loses the order counting back
      addressed: lesson 1 counts back like a rocket in every stage
    - id: one-more-count-all
      what: Counts everything again to find one more, instead of saying the next number
      addressed: lesson 2 Learn says "One more is the next number when you count"; hints say the next number
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Der Reihe nach, en: In order }
    goal:
      de: "Zähl bis 10 und wieder zurück, wie eine Rakete, zehn, neun, acht."
      en: "Count up to 10 and back down again, like a rocket, ten, nine, eight."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "What do you think: can we say the numbers backwards, starting at ten? Have a guess. First, here they are forwards: one, two, three, four, five, six, seven, eight, nine, ten. Each number is one more than the one before."
            show: { drawn: dots, count: 10, layout: five-structure, colour_split: [5, 5] }
          - say: "Yes, we can! We count back like a rocket: ten, nine, eight, seven, six, five, four, three, two, one, blast off!"
            show: { drawn: ten-frame, filled: 10 }
          - say: "Small amounts come first, big amounts last. Two dots, then four dots, then six dots."
            show: { drawn: dots, count: 6, layout: dice }
          - text: "Did you know?"
            say: "Did you know? Before a real space rocket takes off, people count back out loud, all the way down to zero. Then the rocket lifts off into space!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "What comes after 5?"
                say: "Count with me: three, four, five. What comes after five?"
                options: ["4", "6", "8"]
                answer: "6"
                feedback:
                  "4": "Four comes before five. We want the number after."
                hints:
                  - "Count on from five."
                  - "Five, ..."
                  - "After 5 comes 6."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Put them in order, fewest first."
                say: "Put the dice in order. Start with the one with the fewest dots."
                options:
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                slot_count: 3
                answer: ["1", "3", "4"]
                hints:
                  - "Which dice has the fewest dots?"
                  - "One dot, then three dots, then four."
                  - "The order is one, three, four."
              - id: l1-f3
                type: multiple_choice
                text: "What comes before 3?"
                say: "Count with me: one, two, three. What comes before three?"
                options: ["2", "4", "1"]
                answer: "2"
                feedback:
                  "4": "Four comes after three. We want the number before."
                hints:
                  - "Before means just in front."
                  - "One, two, three. What did you say just before three?"
                  - "Before 3 comes 2."
              - id: l1-f4
                type: true_false
                text: "Does 7 come after 6?"
                say: "Does seven come after six?"
                answer: true
                hints:
                  - "Count from five: five, six, ..."
                  - "Six, seven."
                  - "Yes, 7 comes after 6."
              - id: l1-f5
                type: multiple_choice
                text: "Count back: 10, 9, 8. What comes next?"
                say: "Count back like a rocket: ten, nine, eight. What comes next?"
                options: ["9", "7", "6", "blast off!"]
                answer: "7"
                feedback:
                  "blast off!": "Not yet! The rocket only blasts off after one. Ten, nine, eight, ..."
                hints:
                  - "Counting back, the numbers get smaller."
                  - "Ten, nine, eight, ..."
                  - "Next is 7."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "What comes after 8?"
                say: "What comes after eight?"
                options: ["7", "9", "10"]
                answer: "9"
                hints: ["Count on from eight."]
              - id: l1-s2
                type: ordering
                text: "Put them in order, fewest first."
                say: "Put the ten frames in order. Start with the fewest counters."
                options:
                  - { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                  - { drawn: ten-frame, filled: 5 }
                  - { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
                slot_count: 3
                answer: ["5", "6", "8"]
                hints: ["A full top row is five. Look at the bottom row."]
              - id: l1-s3
                type: true_false
                text: "Does 4 come before 3?"
                say: "Does four come before three?"
                answer: false
                hints: ["Count: one, two, three, four. Which came first?"]
              - id: l1-s4
                type: multiple_choice
                text: "Count back: 6, 5, 4. What comes next?"
                say: "Count back: six, five, four. What comes next?"
                options: ["3", "5", "2"]
                answer: "3"
                hints: ["When we count back, each number is one less."]
              - id: l1-s5
                type: multiple_choice
                text: "What comes before 10?"
                say: "What comes before ten?"
                options: ["11", "9", "8"]
                answer: "9"
                hints: ["Count: eight, nine, ten."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "What comes after 3?"
                say: "What comes after three?"
                options: ["2", "4", "5"]
                answer: "4"
              - id: l1-n2
                type: ordering
                text: "Put them in order, fewest first."
                say: "Put the dice in order. Start with the one with the fewest dots."
                options:
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 6, layout: dice }
                slot_count: 3
                answer: ["2", "5", "6"]
              - id: l1-n3
                type: multiple_choice
                text: "What comes before 7?"
                say: "What comes before seven?"
                options: ["8", "6", "5"]
                answer: "6"
              - id: l1-n4
                type: true_false
                text: "Does 10 come after 9?"
                say: "Does ten come after nine?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Count back: 4, 3, 2. What comes next?"
                say: "Count back: four, three, two. What comes next?"
                options: ["1", "3", "0"]
                answer: "1"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What comes after 6?"
            say: "What comes after six?"
            options: ["5", "7", "8"]
            answer: "7"
          - id: l1-c2
            type: ordering
            text: "Put them in order, fewest first."
            say: "Put the dice in order. Start with the one with the fewest dots."
            options:
              - { drawn: dots, count: 3, layout: dice }
              - { drawn: dots, count: 5, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
            slot_count: 3
            answer: ["2", "3", "5"]
          - id: l1-c3
            type: multiple_choice
            text: "What comes before 5?"
            say: "What comes before five?"
            options: ["4", "6", "3"]
            answer: "4"
          - id: l1-c4
            type: multiple_choice
            text: "Count back: 7, 6, 5. What comes next?"
            say: "Count back: seven, six, five. What comes next?"
            options: ["4", "6", "3"]
            answer: "4"
          - id: l1-c5
            type: true_false
            text: "Does 2 come after 3?"
            say: "Does two come after three?"
            answer: false
          - id: l1-c6
            type: ordering
            text: "Put them in order, fewest first."
            say: "Put the ten frames in order. Start with the fewest counters."
            options:
              - { drawn: ten-frame, filled: 4 }
              - { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
              - { drawn: ten-frame, filled: 2 }
            slot_count: 3
            answer: ["2", "4", "9"]

  - n: 2
    title: { de: "Eins mehr, eins weniger", en: "One more, one less" }
    goal:
      de: "Finde eins mehr und eins weniger, so wie 4 Äpfel und einer mehr sind 5."
      en: "Find one more and one less, like 4 apples and one more make 5."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Here are four apples. One more apple is coming. How many apples do you think there will be? Have a guess."
            show: { object: apple, count: 4, layout: row }
          - say: "One more apple joins them. Now there are five. One more is the next number when you count."
            show: { object: apple, count: 5, layout: row }
          - say: "Here are five balls. One rolls away. Now there are four. One less is the number just before."
            show: { object: ball, count: 4, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "3 apples. 1 more comes. How many now?"
                say: "Here are three apples. One more apple comes along. How many apples are there now?"
                show: { object: apple, groups: [3, 1] }
                options: ["2", "3", "4"]
                answer: "4"
                feedback:
                  "2": "That would be one less. One more is the next number."
                hints:
                  - "One more is the next number when you count."
                  - "Three, ..."
                  - "One more than 3 is 4."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "6 fish. 1 swims away. How many now?"
                say: "Here are six fish. One fish swims away. How many fish are there now?"
                show: { object: fish, count: 6, gone: 1, layout: row }
                options: ["5", "6", "7"]
                answer: "5"
                feedback:
                  "7": "That would be one more. One fish swam away, so there is one less."
                hints:
                  - "One less is the number just before."
                  - "Count: four, five, six. What comes before six?"
                  - "One less than 6 is 5."
              - id: l2-f3
                type: image_multiple_choice
                text: "Which one has one more?"
                say: "Here are four dots. Which dice has one more?"
                show: { drawn: dots, count: 4, layout: dice }
                options:
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 6, layout: dice }
                answer: "5"
                hints:
                  - "One more than four. What comes after four?"
                  - "Four, five."
                  - "The dice with 5 dots."
              - id: l2-f4
                type: true_false
                text: "Is 8 one more than 7?"
                say: "Is eight one more than seven?"
                answer: true
                hints:
                  - "What comes after seven?"
                  - "Seven, eight."
                  - "Yes, 8 is one more than 7."
              - id: l2-f5
                type: multiple_choice
                text: "10 counters. 1 is taken away. How many now?"
                say: "The ten frame is full: ten counters. One counter is taken away. How many counters are there now?"
                show: { drawn: ten-frame, filled: 10, cross: 1 }
                options: ["9", "10", "11"]
                answer: "9"
                hints:
                  - "One less than ten."
                  - "Count back: ten, ..."
                  - "One less than 10 is 9."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "5 cars. 1 more comes. How many now?"
                say: "Here are five cars. One more car comes along. How many cars are there now?"
                show: { object: car, groups: [5, 1] }
                options: ["4", "6", "7"]
                answer: "6"
                hints: ["One more is the next number."]
              - id: l2-s2
                type: multiple_choice
                text: "3 balloons. 1 flies away. How many now?"
                say: "Here are three balloons. One balloon flies away. How many balloons are there now?"
                show: { object: balloon, count: 3, gone: 1, layout: row }
                options: ["2", "3", "4"]
                answer: "2"
                hints: ["One less is the number just before."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Which one has one less?"
                say: "Here are seven counters. Which ten frame has one less?"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                options:
                  - { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                  - { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
                  - { drawn: ten-frame, filled: 5 }
                answer: "6"
                hints: ["One less than seven is the number just before seven."]
              - id: l2-s4
                type: true_false
                text: "Is 4 one less than 5?"
                say: "Is four one less than five?"
                answer: true
                hints: ["What comes just before five?"]
              - id: l2-s5
                type: multiple_choice
                text: "9 eggs. 1 more is laid. How many now?"
                say: "Here are nine eggs. One more egg is laid. How many eggs are there now?"
                show: { object: egg, groups: [9, 1] }
                options: ["8", "9", "10"]
                answer: "10"
                hints: ["What comes after nine?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "8 frogs. 1 hops away. How many now?"
                say: "Here are eight frogs. One frog hops away. How many frogs are there now?"
                show: { object: frog, count: 8, gone: 1, layout: row }
                options: ["7", "8", "9"]
                answer: "7"
              - id: l2-n2
                type: multiple_choice
                text: "2 mice. 1 more comes. How many now?"
                say: "Here are two mice. One more mouse comes along. How many mice are there now?"
                show: { object: mouse, groups: [2, 1] }
                options: ["1", "3", "4"]
                answer: "3"
              - id: l2-n3
                type: image_multiple_choice
                text: "Which one has one more?"
                say: "Here are five dots. Which ten frame has one more?"
                show: { drawn: dots, count: 5, layout: dice }
                options:
                  - { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
                  - { drawn: ten-frame, filled: 4 }
                  - { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                answer: "6"
              - id: l2-n4
                type: true_false
                text: "Is 6 one more than 4?"
                say: "Is six one more than four?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "1 strawberry. Someone eats it. How many now?"
                say: "Here is one strawberry. Someone eats it. How many strawberries are there now?"
                show: { object: strawberry, count: 1, gone: 1, layout: row }
                options: ["0", "1", "2"]
                answer: "0"
                difficulty: stretch

      - activity: check
        size: skill
        draw: 4
        tasks:
          - id: l2-c1
            part: more-less
            type: multiple_choice
            text: "6 bananas. 1 more comes. How many now?"
            say: "Here are six bananas. One more banana comes along. How many bananas are there now?"
            show: { object: banana, groups: [6, 1] }
            options: ["5", "7", "8"]
            answer: "7"
          - id: l2-c2
            part: more-less
            type: multiple_choice
            text: "7 leaves. 1 blows away. How many now?"
            say: "Here are seven leaves. One leaf blows away. How many leaves are there now?"
            show: { object: leaf, count: 7, gone: 1, layout: row }
            options: ["6", "7", "8"]
            answer: "6"
          - id: l2-c3
            part: amounts
            type: ordering
            text: "Put them in order, fewest first."
            say: "Put the ten frames in order. Start with the fewest counters."
            options:
              - { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
              - { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
              - { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
            slot_count: 3
            answer: ["6", "7", "9"]
          - id: l2-c4
            part: before-after
            type: multiple_choice
            text: "What comes after 9?"
            say: "What comes after nine?"
            options: ["8", "10", "7"]
            answer: "10"
          - id: l2-c5
            part: before-after
            type: multiple_choice
            text: "What comes before 4?"
            say: "What comes before four?"
            options: ["3", "5", "2"]
            answer: "3"
          - id: l2-c6
            part: count-back
            type: multiple_choice
            text: "Count back: 9, 8, 7. What comes next?"
            say: "Count back: nine, eight, seven. What comes next?"
            options: ["6", "8", "5"]
            answer: "6"
          - id: l2-c7
            part: amounts
            type: ordering
            text: "Put them in order, fewest first."
            say: "Put the dice in order. Start with the one with the fewest dots."
            options:
              - { drawn: dots, count: 6, layout: dice }
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 1, layout: dice }
            slot_count: 3
            answer: ["1", "4", "6"]
          - id: l2-c8
            part: more-less
            type: image_multiple_choice
            text: "3 dots. Which one has one more?"
            say: "Here are three dots. Which dice has one more?"
            show: { drawn: dots, count: 3, layout: dice }
            options:
              - { drawn: dots, count: 2, layout: dice }
              - { drawn: dots, count: 5, layout: dice }
              - { drawn: dots, count: 4, layout: dice }
            answer: "4"
          - id: l2-c9
            part: before-after
            type: multiple_choice
            text: "What comes after 1?"
            say: "What comes after one?"
            options: ["1", "2", "3"]
            answer: "2"
          - id: l2-c10
            part: count-back
            type: multiple_choice
            text: "Count back: 5, 4, 3. What comes next?"
            say: "Count back: five, four, three. What comes next?"
            options: ["2", "4", "1"]
            answer: "2"
          - id: l2-c11
            part: amounts
            type: ordering
            text: "Put them in order, most first."
            say: "Put the dice in order. Start with the one with the most dots."
            options:
              - { drawn: dots, count: 3, layout: dice }
              - { drawn: dots, count: 6, layout: dice }
              - { drawn: dots, count: 5, layout: dice }
            slot_count: 3
            answer: ["6", "5", "3"]
          - id: l2-c12
            part: more-less
            type: multiple_choice
            text: "8 cups. 1 more comes. How many now?"
            say: "Here are eight cups. One more cup comes along. How many cups are there now?"
            show: { object: cup, groups: [8, 1] }
            options: ["7", "9", "10"]
            answer: "9"
          - id: l2-c13
            part: before-after
            type: true_false
            text: "Does 9 come before 8?"
            say: "Does nine come before eight?"
            answer: false
          - id: l2-c14
            part: count-back
            type: true_false
            text: "Count back: 8, 7, 6. Is 7 next?"
            say: "Count back: eight, seven, six. Is seven next?"
            answer: false
          - id: l2-c15
            part: amounts
            type: ordering
            text: "Put them in order, fewest first."
            say: "Put the ten frames in order. Start with the fewest counters."
            options:
              - { drawn: ten-frame, filled: 10, colour_split: [5, 5] }
              - { drawn: ten-frame, filled: 3 }
              - { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
            slot_count: 3
            answer: ["3", "8", "10"]
          - id: l2-c16
            part: more-less
            type: true_false
            text: "Is 3 one less than 4?"
            say: "Is three one less than four?"
            answer: true
          - id: l2-c17
            part: before-after
            type: multiple_choice
            text: "What comes before 8?"
            say: "What comes before eight?"
            options: ["7", "9", "6"]
            answer: "7"
          - id: l2-c18
            part: count-back
            type: ordering
            text: "Count back. Put the numbers in order, biggest first."
            say: "Count back. Put the numbers in order. Start with the biggest."
            options: ["7", "9", "6", "8"]
            slot_count: 4
            answer: ["9", "8", "7", "6"]
          - id: l2-c19
            part: amounts
            type: ordering
            text: "Put them in order, fewest first."
            say: "Put the dice in order. Start with the one with the fewest dots."
            options:
              - { drawn: dots, count: 5, layout: dice }
              - { drawn: dots, count: 1, layout: dice }
              - { drawn: dots, count: 3, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
            slot_count: 4
            answer: ["1", "2", "3", "5"]
          - id: l2-c20
            part: count-back
            type: multiple_choice
            text: "Count back: 10, 9. What comes next?"
            say: "Count back: ten, nine. What comes next?"
            options: ["7", "8", "10"]
            answer: "8"
