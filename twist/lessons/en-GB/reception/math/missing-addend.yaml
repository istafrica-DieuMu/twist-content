# Lesson set: Maths, Reception (EYFS). Hand-authored draft.
id: en-GB.math.missing-addend
skill: math.add-sub-to-20.missing-addend
curriculum: en-GB
language: en
title:
  de: Ergänzen bis 10
  en: How many more?
summary: >
  How many more are needed to make a number? Lesson 1 fills a ten frame
  up to a number and finds the missing part in the part-whole model;
  lesson 2 finds the number bonds to 10 (how many more make ten) by
  counting the empty spaces, and ends with the skill check. Spoken
  questions; numbers say themselves.
metadata:
  year: reception
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [4-5]
  lesson_minutes: 8
  builds_on: [math.add-sub-to-20.add-to-10]
  also_practises: [math.numbers-to-20.partition-to-10]
  vocabulary: { en: [how many more, make, missing, part, whole, empty spaces] }
  no_reading: true
  forms: [drawn, audio]
  drawn: [ten-frame, part-whole]
  facets: []
  parts:
    - { id: more-to, what: { de: "sagen, wie viele noch fehlen bis zu einer Zahl bis 10", en: saying how many more make a number up to 10 } }
    - { id: missing-part, what: { de: im Teile-Ganzes-Modell den fehlenden Teil finden, en: finding the missing part in a part-whole model } }
    - { id: bonds-10, what: { de: "die Zehnerfreunde finden (wie viele fehlen bis 10)", en: "finding the number bonds to 10 (how many more make ten)" } }
  misconceptions:
    - id: gives-the-whole
      what: Answers with the whole instead of how many more (6 for "three and how many make six")
      addressed: the whole is an option in most tasks, with feedback on the first; Learn counts only the new ones
    - id: counts-full-spaces
      what: Counts the counters instead of the empty spaces for bonds to 10
      addressed: lesson 2 Learn points at the empty spaces; hints say "Count the empty spaces."
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wie viele fehlen?", en: "How many more?" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "There are three counters. We want to make five. How many more do we need?"
            show: { drawn: ten-frame, filled: 3 }
          - say: "Count on from three to five: four, five. That is two more."
            show: { drawn: ten-frame, filled: 5, colour_split: [3, 2] }
          - say: "In the part-whole model, the whole is five. One part is three. The missing part is two."
            show: { drawn: part-whole, whole: 5, parts: [3, 2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "4 counters. How many more make 5?"
                say: "There are four counters. How many more make five?"
                show: { drawn: ten-frame, filled: 4 }
                options: ["1", "2", "5"]
                answer: "1"
                feedback:
                  "5": "Five is how many we want. We need just one more."
                hints:
                  - "Count on from four to five."
                  - "Four, then five. That is one more."
                  - "1 more."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is six. One part is four. What is the missing part?"
                show: { drawn: part-whole, whole: 6, parts: [4, null] }
                options: ["2", "4", "6"]
                answer: "2"
                hints:
                  - "Count on from four to six."
                  - "Five, six. That is two more."
                  - "The missing part is 2."
              - id: l1-f3
                type: multiple_choice
                text: "2 counters. How many more make 5?"
                say: "There are two counters. How many more make five?"
                show: { drawn: ten-frame, filled: 2 }
                options: ["2", "3", "5"]
                answer: "3"
                hints:
                  - "Count on from two to five."
                  - "Three, four, five."
                  - "3 more."
              - id: l1-f4
                type: true_false
                text: "5 counters. We want 7. Do we need 2 more?"
                say: "There are five counters. We want seven. Do we need two more?"
                show: { drawn: ten-frame, filled: 5 }
                answer: true
                hints:
                  - "Count on from five to seven."
                  - "Six, seven."
                  - "Yes, two more."
              - id: l1-f5
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is four. One part is one. What is the missing part?"
                show: { drawn: part-whole, whole: 4, parts: [1, null] }
                options: ["3", "4", "5"]
                answer: "3"
                hints:
                  - "Count on from one to four."
                  - "Two, three, four."
                  - "The missing part is 3."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "3 counters. How many more make 6?"
                say: "There are three counters. How many more make six?"
                show: { drawn: ten-frame, filled: 3 }
                options: ["3", "4", "6"]
                answer: "3"
                hints: ["Count on from three to six."]
              - id: l1-s2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is five. One part is two. What is the missing part?"
                show: { drawn: part-whole, whole: 5, parts: [2, null] }
                options: ["2", "3", "5"]
                answer: "3"
                hints: ["Count on from two."]
              - id: l1-s3
                type: true_false
                text: "4 counters. We want 6. Do we need 1 more?"
                say: "There are four counters. We want six. Do we need one more?"
                show: { drawn: ten-frame, filled: 4 }
                answer: false
                hints: ["Count on from four to six."]
              - id: l1-s4
                type: multiple_choice
                text: "1 counter. How many more make 4?"
                say: "There is one counter. How many more make four?"
                show: { drawn: ten-frame, filled: 1 }
                options: ["3", "4", "5"]
                answer: "3"
                hints: ["Two, three, four."]
              - id: l1-s5
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is seven. One part is five. What is the missing part?"
                show: { drawn: part-whole, whole: 7, parts: [5, null] }
                options: ["2", "5", "7"]
                answer: "2"
                hints: ["Six, seven."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "5 counters. How many more make 8?"
                say: "There are five counters. How many more make eight?"
                show: { drawn: ten-frame, filled: 5 }
                options: ["3", "5", "8"]
                answer: "3"
              - id: l1-n2
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is three. One part is two. What is the missing part?"
                show: { drawn: part-whole, whole: 3, parts: [2, null] }
                options: ["1", "2", "3"]
                answer: "1"
              - id: l1-n3
                type: true_false
                text: "2 counters. We want 5. Do we need 3 more?"
                say: "There are two counters. We want five. Do we need three more?"
                show: { drawn: ten-frame, filled: 2 }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "6 counters. How many more make 7?"
                say: "There are six counters. How many more make seven?"
                show: { drawn: ten-frame, filled: 6 }
                options: ["1", "2", "7"]
                answer: "1"
              - id: l1-n5
                type: multiple_choice
                text: "What is the missing part?"
                say: "The whole is six. One part is three. What is the missing part?"
                show: { drawn: part-whole, whole: 6, parts: [3, null] }
                options: ["2", "3", "6"]
                answer: "3"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "1 counter. How many more make 3?"
            say: "There is one counter. How many more make three?"
            show: { drawn: ten-frame, filled: 1 }
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c2
            type: multiple_choice
            text: "The whole is 4. One part is 2. What is the missing part?"
            say: "The whole is four. One part is two. What is the missing part?"
            show: { drawn: part-whole, whole: 4, parts: [2, null] }
            options: ["1", "2", "4"]
            answer: "2"
          - id: l1-c3
            type: true_false
            text: "5 counters. We want 6. Do we need 1 more?"
            say: "There are five counters. We want six. Do we need one more?"
            show: { drawn: ten-frame, filled: 5 }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "4 counters. How many more make 7?"
            say: "There are four counters. How many more make seven?"
            show: { drawn: ten-frame, filled: 4 }
