        screens:
          - say: "This ten frame has seven counters. Look at the empty spaces: there are three."
            show: { drawn: ten-frame, filled: 7 }
          - say: "Seven and three make ten. The empty spaces tell you how many more make ten."
            show: { drawn: ten-frame, filled: 10, colour_split: [7, 3] }
          - say: "These pairs all make ten: one and nine, two and eight, three and seven, four and six, five and five."

      - activity: practise
