            answer: "3"
          - id: l1-c5
            type: multiple_choice
            text: "The whole is 5. One part is 1. What is the missing part?"
            say: "The whole is five. One part is one. What is the missing part?"
            show: { drawn: part-whole, whole: 5, parts: [1, null] }
