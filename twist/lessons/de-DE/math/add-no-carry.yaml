                answer: "780"
                hints: ["Null plus null ist null."]
              - id: l1-s3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["521", "362"], op: "+", result: "873" }
                answer: false
                hints: ["Prüf jede Stelle."]
              - id: l1-s4
                type: multiple_choice
                text: "Was rechnest du bei den Zehnern?"
                say: "Siebenhundertvierundzwanzig plus hundertdreiundfünfzig. Was rechnest du bei den Zehnern?"
                show: { drawn: written-calc, rows: ["724", "153"], op: "+" }
                options: ["2 + 5", "7 + 1", "4 + 3"]
                answer: "2 + 5"
                hints: ["Die Zehner stehen in der Mitte."]
              - id: l1-s5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertsechs plus achthundertdreiundachtzig."
                show: { drawn: written-calc, rows: ["106", "883"], op: "+" }
                answer: "989"
                hints: ["Fang bei den Einern an."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Rechne schriftlich. Fang bei den Einern an."
                show: { drawn: written-calc, rows: ["205", "613"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["8", "1", "7", "9"]
                answer: ["8", "1", "8"]
              - id: l1-n2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: fünfhundertzweiundvierzig plus dreihundertfünfundfünfzig."
                show: { drawn: written-calc, rows: ["542", "355"], op: "+" }
                answer: "897"
              - id: l1-n3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["640", "238"], op: "+", result: "878" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Was rechnest du bei den Hundertern?"
                say: "Dreihundertzwölf plus fünfhundertsechsundsiebzig. Was rechnest du bei den Hundertern?"
                show: { drawn: written-calc, rows: ["312", "576"], op: "+" }
                options: ["3 + 5", "2 + 6", "1 + 7"]
                answer: "3 + 5"
              - id: l1-n5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: vierhundertdreißig plus hundertneunundfünfzig."
                show: { drawn: written-calc, rows: ["430", "159"], op: "+" }
                answer: "589"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: zweihundertdreiundzwanzig plus sechshundertvierundsechzig."
            show: { drawn: written-calc, rows: ["223", "664"], op: "+" }
            answer: "887"
          - id: l1-c2
            type: true_false
            text: "Stimmt die Rechnung?"
            say: "Prüf die Rechnung. Stimmt sie?"
            show: { drawn: written-calc, rows: ["351", "426"], op: "+", result: "787" }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was rechnest du zuerst?"
            say: "Vierhundertzweiundsechzig plus dreihundertfünfzehn. Was rechnest du zuerst?"
            show: { drawn: written-calc, rows: ["462", "315"], op: "+" }
            options: ["2 + 5", "4 + 3", "6 + 1"]
            answer: "2 + 5"

  - n: 2
    title: { de: Verschieden lange Zahlen, en: Numbers of different lengths }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: dreihundertvierzehn plus zweihundertzweiundachtzig."
            show: { drawn: written-calc, rows: ["314", "282"], op: "+" }
            answer: "596"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ungefähr wie viel?"
            say: "Ungefähr wie viel ist vierhundertzehn plus hundertachtzig?"
            options: ["600", "500", "300"]
            answer: "600"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "352 + 24"
            say: "Ist eine Zahl kürzer, schreibst du sie trotzdem Einer unter Einer. Die Vier steht unter der Zwei, die Zwei unter der Fünf. Vor der Vierundzwanzig bleibt bei den Hundertern eine Lücke."
            show: { drawn: written-calc, rows: ["352", "24"], op: "+", result: "376" }
          - text: "So nicht: 352 + 24"
            say: "So ist es falsch: Hier steht die Vierundzwanzig links unter den Hundertern und Zehnern. Dann rechnest du Zehner plus Hunderter, das passt nicht."
            show: { drawn: written-calc, rows: ["352", "24 "], op: "+" }
          - text: "Überschlag: 350 + 20 = 370"
            say: "Mach vorher einen Überschlag. Dreihundertfünfzig plus zwanzig ist ungefähr dreihundertsiebzig. Das Ergebnis dreihundertsechsundsiebzig passt dazu."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Welche Rechnung ist richtig untereinander?"
                say: "Hier soll fünfhundertdreizehn plus zweiundsechzig stehen. Welche Rechnung ist richtig untereinander geschrieben?"
                options: [{ drawn: written-calc, rows: ["513", "62"], op: "+" }, { drawn: written-calc, rows: ["513", "62 "], op: "+" }]
                answer: "513|62"
                feedback:
                  "513|62 ": "Hier steht die Zwei unter der Eins, also bei den Zehnern. Die Einer müssen unter den Einern stehen."
                hints:
                  - "Wo stehen die Einer von fünfhundertdreizehn?"
                  - "Die Zwei muss unter der Drei stehen."
                  - "Die Rechnung, bei der 62 ganz rechts steht."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: fünfhundertdreizehn plus zweiundsechzig."
                show: { drawn: written-calc, rows: ["513", "62"], op: "+" }
                answer: "575"
                hints:
                  - "Einer: drei plus zwei."
                  - "Zehner: eins plus sechs. Bei den Hundertern kommt nichts dazu."
                  - "575."
              - id: l2-f3
                type: true_false
                text: "418 + 70 = 488 · Überschlag: 420 + 70 = 490. Passt das?"
                say: "Ein Kind hat vierhundertachtzehn plus siebzig gleich vierhundertachtundachtzig gerechnet. Der Überschlag ist vierhundertzwanzig plus siebzig, ungefähr vierhundertneunzig. Passt das?"
                answer: true
                hints:
                  - "Vergleiche 488 mit 490."
                  - "Die Zahlen liegen nah beieinander."
                  - "Ja."
              - id: l2-f4
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Rechne schriftlich. Fang bei den Einern an."
                show: { drawn: written-calc, rows: ["731", "48"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["9", "7", "1", "8"]
                answer: ["9", "7", "7"]
                hints:
                  - "Einer: eins plus acht."
                  - "Zehner: drei plus vier. Bei den Hundertern bleibt die Sieben."
                  - "E: 9, Z: 7, H: 7. Das ist 779."
              - id: l2-f5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: vierhundertzweiundzwanzig plus sechs."
                show: { drawn: written-calc, rows: ["422", "6"], op: "+" }
                answer: "428"
                hints:
                  - "Die Sechs steht unter den Einern."
                  - "Zwei plus sechs."
                  - "428."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Welche Rechnung ist richtig untereinander?"
                say: "Hier soll sechshundertvierzig plus fünfunddreißig stehen. Welche Rechnung ist richtig untereinander geschrieben?"
                options: [{ drawn: written-calc, rows: ["640", "35 "], op: "+" }, { drawn: written-calc, rows: ["640", "35"], op: "+" }]
                answer: "640|35"
                hints: ["Einer unter Einer."]
              - id: l2-s2
                type: text_input
