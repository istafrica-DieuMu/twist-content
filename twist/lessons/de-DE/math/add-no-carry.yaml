                say: "Rechne schriftlich: sechshundertvierzig plus fünfunddreißig."
                show: { drawn: written-calc, rows: ["640", "35"], op: "+" }
                answer: "675"
                hints: ["Fang bei den Einern an."]
              - id: l2-s3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["254", "13"], op: "+", result: "267" }
                answer: true
