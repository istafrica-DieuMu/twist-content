                answer: "248"
              - id: l2-n3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["532", "45"], op: "+", result: "982" }
                answer: false
              - id: l2-n4
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Rechne schriftlich. Fang bei den Einern an."
                show: { drawn: written-calc, rows: ["815", "73"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["8", "1", "7", "9"]
                answer: ["8", "8", "8"]
              - id: l2-n5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertdreißig plus sechsundfünfzig."
                show: { drawn: written-calc, rows: ["130", "56"], op: "+" }
                answer: "186"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: dreihundertsiebenundzwanzig plus vierhunderteinundsechzig."
            show: { drawn: written-calc, rows: ["327", "461"], op: "+" }
            answer: "788"
          - id: l2-c2
            type: image_multiple_choice
            text: "Welche Rechnung ist richtig untereinander?"
            say: "Hier soll siebenhundertzwölf plus vierundachtzig stehen. Welche Rechnung ist richtig untereinander geschrieben?"
            options: [{ drawn: written-calc, rows: ["712", "84 "], op: "+" }, { drawn: written-calc, rows: ["712", "84"], op: "+" }]
            answer: "712|84"
          - id: l2-c3
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: siebenhundertzwölf plus vierundachtzig."
            show: { drawn: written-calc, rows: ["712", "84"], op: "+" }
            answer: "796"
          - id: l2-c4
            type: true_false
            text: "Stimmt die Rechnung?"
            say: "Prüf die Rechnung. Stimmt sie?"
