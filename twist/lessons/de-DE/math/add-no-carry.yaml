                say: "Hier soll zweihunderteins plus siebenundvierzig stehen. Welche Rechnung ist richtig untereinander geschrieben?"
                options: [{ drawn: written-calc, rows: ["201", "47"], op: "+" }, { drawn: written-calc, rows: ["201", "47 "], op: "+" }]
                answer: "201|47"
              - id: l2-n2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihunderteins plus siebenundvierzig."
