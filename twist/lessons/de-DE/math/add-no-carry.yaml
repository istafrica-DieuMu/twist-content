# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.add-no-carry
skill: math.written-add-sub.add-no-carry
curriculum: de-DE
language: de
title:
  de: Schriftlich addieren ohne Übertrag
  en: Column addition without carrying
summary: >
  Writing numbers under each other by place value and adding them in
  columns, starting with the Einer. Lesson 1 places the numbers correctly
  (Einer under Einer) and adds three-digit numbers with no carrying;
  lesson 2 adds numbers with different numbers of digits, checks with an
  Überschlag, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value, math.add-sub-to-1000.semi-written]
  also_practises: [math.add-sub-to-1000.estimate]
  vocabulary: { de: [schriftlich addieren, stellengerecht, untereinander, Einer, Zehner, Hunderter, Ergebnisstrich] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  misconceptions:
    - id: left-aligned
      what: Writes a shorter number under the left digits (352 + 24 with the 2 under the 3)
      addressed: Learn says Einer unter Einer; a task in each stage of lesson 2 shows a wrongly placed number, with feedback in the full stage
    - id: start-on-the-left
      what: Starts adding at the Hunderter
      addressed: Learn says "Man fängt immer bei den Einern an"; frames fill the result from the right, Einer first
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Stellengerecht untereinander, en: Lining up the places }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "300 + 200 = _"
            say: "Dreihundert plus zweihundert."
            answer: "500"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Zehner hat 452?"
            say: "Wie viele Zehner hat die Zahl vierhundertzweiundfünfzig?"
            options: ["5", "4", "2"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "243 + 125"
            say: "Beim schriftlichen Addieren schreibst du die Zahlen untereinander: Einer unter Einer, Zehner unter Zehner, Hunderter unter Hunderter. Darunter kommt der Ergebnisstrich."
            show: { drawn: written-calc, rows: ["243", "125"], op: "+" }
          - text: "3 + 5 = 8"
            say: "Man fängt immer bei den Einern an, ganz rechts: drei plus fünf ist acht. Die Acht schreibst du unter die Einer."
            show: { drawn: written-calc, rows: ["243", "125"], op: "+", result: "__8" }
          - text: "4 + 2 = 6 · 2 + 1 = 3"
            say: "Dann die Zehner: vier plus zwei ist sechs. Dann die Hunderter: zwei plus eins ist drei. Das Ergebnis ist dreihundertachtundsechzig."
            show: { drawn: written-calc, rows: ["243", "125"], op: "+", result: "368" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Rechne schriftlich. Fang bei den Einern an."
                show: { drawn: written-calc, rows: ["312", "456"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["8", "6", "7", "5"]
                answer: ["8", "6", "7"]
                hints:
                  - "Einer: zwei plus sechs."
                  - "Zehner: eins plus fünf. Hunderter: drei plus vier."
                  - "E: 8, Z: 6, H: 7. Das ist 768."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wo fängst du an?"
                say: "Bei welcher Stelle fängst du beim schriftlichen Addieren an?"
                options: ["bei den Einern", "bei den Hundertern", "bei den Zehnern"]
                answer: "bei den Einern"
                hints:
                  - "Du rechnest von rechts nach links."
                  - "Ganz rechts stehen die Einer."
                  - "Bei den Einern."
              - id: l1-f3
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihunderteinundvierzig plus fünfhundertsieben."
                show: { drawn: written-calc, rows: ["241", "507"], op: "+" }
                answer: "748"
                hints:
                  - "Einer: eins plus sieben."
                  - "Zehner: vier plus null. Hunderter: zwei plus fünf."
                  - "748."
              - id: l1-f4
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["432", "314"], op: "+", result: "746" }
                answer: true
                hints:
                  - "Rechne jede Stelle nach."
                  - "Zwei plus vier, drei plus eins, vier plus drei."
                  - "Ja, 746."
              - id: l1-f5
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Rechne schriftlich. Fang bei den Einern an."
                show: { drawn: written-calc, rows: ["625", "273"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["8", "9", "7", "6"]
                answer: ["8", "9", "8"]
                hints:
                  - "Einer: fünf plus drei."
                  - "Zehner: zwei plus sieben. Hunderter: sechs plus zwei."
                  - "E: 8, Z: 9, H: 8. Das ist 898."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Rechne schriftlich. Fang bei den Einern an."
                show: { drawn: written-calc, rows: ["134", "423"], op: "+", result: "___" }
