                options: ["7", "5", "6", "8"]
                answer: ["7", "5", "5"]
                hints: ["Rechne Stelle für Stelle von rechts."]
              - id: l1-s2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: dreihundertsechzig plus vierhundertzwanzig."
