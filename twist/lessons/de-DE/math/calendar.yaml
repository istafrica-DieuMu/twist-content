# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.calendar
skill: math.time.calendar
curriculum: de-DE
language: de
title:
  de: Datum und Kalender
  en: Dates and the calendar
summary: >
  Lesson 1 reads and writes a date (der 14. März, 14.03.) and finds the
  day before and after; lesson 2 counts days and weeks between two dates
  in one month (vom 3. bis zum 10. sind es 7 Tage, eine Woche) and works
  out which weekday a date falls on, and ends with the skill check. The
  month sheet to tap waits for the calendar component, so dates come as
  text.
metadata:
  year: klasse-2
  topic: { de: Kalender, en: Calendar }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.time.sequence-of-day, math.numbers-to-20.order-to-20]
  also_practises: [math.time.sequence-of-day]
  vocabulary: { de: [Datum, Kalender, Monat, Woche, Tag, Geburtstag, der Erste, der Zehnte] }
  forms: [text, audio]
  drawn: []
  facets: [date-format]
  misconceptions:
    - id: date-number-month-order
      what: Reads 05.03. as the 3rd of May, swapping day and month
      addressed: lesson 1 Learn says the day comes first, then the month; l1-f3, l1-s3 and l1-n3 offer the swapped date, with feedback in l1-f3
    - id: counts-both-ends
      what: Counts both the start and the end day when asked how many days lie between (vom 3. bis zum 10. sind es 8 Tage)
      addressed: lesson 2 Learn counts the jumps from day to day; l2-f2, l2-s2 and l2-n2 offer the count with both ends, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Das Datum", en: "The date" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Monat kommt nach Februar?"
            say: "Welcher Monat kommt nach Februar?"
            options: ["März", "Januar", "April"]
            answer: "März"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Tag kommt nach Montag?"
            say: "Welcher Tag kommt nach Montag?"
            options: ["Dienstag", "Sonntag", "Mittwoch"]
            answer: "Dienstag"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "der 14. März"
            say: "Das Datum sagt, welcher Tag im Jahr es ist. Der vierzehnte März heißt: Es ist der vierzehnte Tag im Monat März."
          - text: "14.03."
            say: "Kurz schreibst du: vierzehn Punkt null drei Punkt. Zuerst kommt der Tag, dann der Monat. Der März ist der dritte Monat, darum steht dort die Drei."
          - text: "der 13. März · der 14. März · der 15. März"
            say: "Der Tag davor ist der dreizehnte März, der Tag danach der fünfzehnte März."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Lena hat am 9. Mai Geburtstag. In welchem Monat ist das?"
                say: "Lena hat am neunten Mai Geburtstag. In welchem Monat ist das?"
                options: ["im Mai", "im September", "im März"]
                answer: "im Mai"
                hints:
                  - "Im Datum stehen der Tag und der Monat."
                  - "Der Tag ist der 9., der Monat steht dahinter."
                  - "im Mai."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Tag kommt nach dem 20. Juni?"
                say: "Welcher Tag kommt nach dem zwanzigsten Juni?"
                options: ["der 21. Juni", "der 19. Juni", "der 20. Juli"]
                answer: "der 21. Juni"
                hints:
                  - "Der Monat bleibt gleich."
                  - "Nach 20 kommt 21."
                  - "der 21. Juni."
              - id: l1-f3
                type: multiple_choice
                text: "Was bedeutet 05.03.?"
                say: "Auf einem Zettel steht: null fünf Punkt null drei Punkt. Welches Datum ist das?"
                options: ["der 5. März", "der 3. Mai", "der 5. Mai"]
                answer: "der 5. März"
                feedback:
                  "der 3. Mai": "Zuerst steht der Tag, dann der Monat. Der Tag ist der 5."
                  "der 5. Mai": "Der Monat ist die 03. Der dritte Monat ist der März."
                hints:
                  - "Zuerst steht der Tag, dann der Monat."
                  - "Der Tag ist 5, der Monat 3. Der dritte Monat ist der März."
                  - "der 5. März."
              - id: l1-f4
                type: true_false
                text: "Der 1. Januar ist der erste Tag im Jahr."
                say: "Stimmt das? Der erste Januar ist der erste Tag im Jahr."
                answer: true
                hints:
                  - "Mit welchem Monat fängt das Jahr an?"
                  - "Mit Januar, und dort mit dem ersten Tag."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Wie schreibst du den 12. Oktober kurz?"
                say: "Wie schreibst du den zwölften Oktober kurz?"
                options: ["12.10.", "10.12.", "12.11."]
                answer: "12.10."
                hints:
                  - "Zuerst der Tag, dann der Monat."
                  - "Oktober ist der zehnte Monat."
                  - "12.10."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ben hat am 23. August Geburtstag. Welcher Tag im Monat ist das?"
                say: "Ben hat am dreiundzwanzigsten August Geburtstag. Welcher Tag im Monat ist das?"
                options: ["der 23.", "der 8.", "der 32."]
                answer: "der 23."
                hints: ["Die Zahl vor dem Monat ist der Tag."]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Tag kommt vor dem 10. April?"
                say: "Welcher Tag kommt vor dem zehnten April?"
                options: ["der 9. April", "der 11. April", "der 10. März"]
                answer: "der 9. April"
                hints: ["Vor heißt: der Tag davor."]
              - id: l1-s3
                type: multiple_choice
                text: "Was bedeutet 02.06.?"
                say: "Auf einer Einladung steht: null zwei Punkt null sechs Punkt. Welches Datum ist das?"
                options: ["der 2. Juni", "der 6. Februar", "der 2. Juli"]
                answer: "der 2. Juni"
                hints: ["Zuerst der Tag, dann der Monat."]
              - id: l1-s4
                type: true_false
                text: "Der 31. Dezember ist der letzte Tag im Jahr."
                say: "Stimmt das? Der einunddreißigste Dezember ist der letzte Tag im Jahr."
                answer: true
                hints: ["Dezember ist der letzte Monat."]
              - id: l1-s5
                type: multiple_choice
                text: "Wie schreibst du den 4. Juli kurz?"
                say: "Wie schreibst du den vierten Juli kurz?"
                options: ["04.07.", "07.04.", "04.06."]
                answer: "04.07."
                hints: ["Juli ist der siebte Monat."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Das Sommerfest ist am 18. Juli. In welchem Monat ist es?"
                say: "Das Sommerfest ist am achtzehnten Juli. In welchem Monat ist es?"
                options: ["im Juli", "im Juni", "im August"]
                answer: "im Juli"
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Tag kommt nach dem 29. September?"
                say: "Welcher Tag kommt nach dem neunundzwanzigsten September?"
                options: ["der 30. September", "der 28. September", "der 29. Oktober"]
                answer: "der 30. September"
              - id: l1-n3
                type: multiple_choice
                text: "Was bedeutet 11.04.?"
                say: "Auf dem Plan steht: elf Punkt null vier Punkt. Welches Datum ist das?"
                options: ["der 11. April", "der 4. November", "der 11. Mai"]
                answer: "der 11. April"
              - id: l1-n4
                type: true_false
                text: "Im Datum 08.12. ist der Monat August."
                say: "Stimmt das? Im Datum null acht Punkt zwölf Punkt ist der Monat August."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Wie schreibst du den 25. Dezember kurz?"
                say: "Wie schreibst du den fünfundzwanzigsten Dezember kurz?"
                options: ["25.12.", "12.25.", "25.11."]
                answer: "25.12."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was bedeutet 07.05.?"
            say: "Auf einer Karte steht: null sieben Punkt null fünf Punkt. Welches Datum ist das?"
            options: ["der 7. Mai", "der 5. Juli", "der 7. Juni"]
            answer: "der 7. Mai"
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Tag kommt nach dem 15. März?"
            say: "Welcher Tag kommt nach dem fünfzehnten März?"
            options: ["der 16. März", "der 14. März", "der 15. April"]
            answer: "der 16. März"
          - id: l1-c3
            type: multiple_choice
            text: "Wie schreibst du den 3. September kurz?"
            say: "Wie schreibst du den dritten September kurz?"
            options: ["03.09.", "09.03.", "03.08."]
            answer: "03.09."

  - n: 2
    title: { de: "Tage und Wochen zählen", en: "Counting days and weeks" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was bedeutet 10.06.?"
            say: "Welches Datum ist zehn Punkt null sechs Punkt?"
            options: ["der 10. Juni", "der 6. Oktober"]
            answer: "der 10. Juni"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "10 − 3 = _"
            say: "Zehn minus drei."
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "vom 3. bis zum 10. Mai: 10 − 3 = 7 Tage"
            say: "Heute ist der dritte Mai. Am zehnten Mai ist Lenas Geburtstag. Wie viele Tage dauert es noch? Du springst von Tag zu Tag: vom dritten zum vierten, zum fünften, und so weiter bis zum zehnten. Das sind sieben Sprünge, also sieben Tage. Du kannst auch rechnen: zehn minus drei."
          - text: "7 Tage = 1 Woche"
            say: "Sieben Tage sind eine Woche. Ist der dritte Mai ein Montag, dann ist der zehnte Mai auch ein Montag."
          - text: "14 Tage = 2 Wochen"
            say: "Vierzehn Tage sind zwei Wochen. Nach zwei Wochen ist wieder der gleiche Wochentag."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Tage hat eine Woche?"
                say: "Wie viele Tage hat eine Woche?"
                options: ["7", "5", "10"]
                answer: "7"
                hints:
                  - "Zähl von Montag bis Sonntag."
                  - "Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag."
                  - "7."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Heute ist der 4. Juni. Am 9. Juni ist das Schulfest. Wie viele Tage dauert es noch?"
                say: "Heute ist der vierte Juni. Am neunten Juni ist das Schulfest. Wie viele Tage dauert es noch?"
                options: ["5", "6", "4"]
                answer: "5"
                feedback:
                  "6": "Du hast den heutigen Tag mitgezählt. Zähl die Sprünge: vom 4. zum 5. ist der erste."
                hints:
                  - "Spring von Tag zu Tag, vom 4. bis zum 9."
                  - "Oder rechne 9 − 4."
                  - "5 Tage."
              - id: l2-f3
                type: multiple_choice
                text: "Der 1. März ist ein Montag. Welcher Wochentag ist der 8. März?"
                say: "Der erste März ist ein Montag. Welcher Wochentag ist der achte März?"
                options: ["Montag", "Dienstag", "Sonntag"]
                answer: "Montag"
                hints:
                  - "Vom 1. bis zum 8. sind es 7 Tage."
                  - "7 Tage sind eine Woche, dann ist wieder der gleiche Tag."
                  - "Montag."
              - id: l2-f4
                type: true_false
                text: "14 Tage sind 2 Wochen."
                say: "Stimmt das? Vierzehn Tage sind zwei Wochen."
                answer: true
                hints:
                  - "Eine Woche hat 7 Tage."
                  - "7 + 7 = 14."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Der 5. Mai ist ein Dienstag. Welcher Wochentag ist der 6. Mai?"
                say: "Der fünfte Mai ist ein Dienstag. Welcher Wochentag ist der sechste Mai?"
                options: ["Mittwoch", "Montag", "Dienstag"]
                answer: "Mittwoch"
                hints:
                  - "Der 6. ist der Tag danach."
                  - "Nach Dienstag kommt ..."
                  - "Mittwoch."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Tage sind 2 Wochen?"
                say: "Wie viele Tage sind zwei Wochen?"
                options: ["14", "7", "12"]
                answer: "14"
                hints: ["Eine Woche hat 7 Tage."]
              - id: l2-s2
                type: multiple_choice
                text: "Heute ist der 12. Juli. Am 20. Juli fahren wir in den Urlaub. Wie viele Tage dauert es noch?"
                say: "Heute ist der zwölfte Juli. Am zwanzigsten Juli fahren wir in den Urlaub. Wie viele Tage dauert es noch?"
                options: ["8", "9", "7"]
                answer: "8"
                hints: ["Rechne 20 − 12."]
              - id: l2-s3
                type: multiple_choice
                text: "Der 2. Oktober ist ein Freitag. Welcher Wochentag ist der 9. Oktober?"
                say: "Der zweite Oktober ist ein Freitag. Welcher Wochentag ist der neunte Oktober?"
                options: ["Freitag", "Samstag", "Donnerstag"]
                answer: "Freitag"
                hints: ["Vom 2. bis zum 9. ist eine Woche."]
              - id: l2-s4
                type: true_false
                text: "Vom 10. bis zum 17. April ist genau eine Woche."
                say: "Stimmt das? Vom zehnten bis zum siebzehnten April ist genau eine Woche."
                answer: true
                hints: ["17 − 10 = ?"]
              - id: l2-s5
                type: multiple_choice
                text: "Der 15. Juni ist ein Sonntag. Welcher Wochentag ist der 14. Juni?"
                say: "Der fünfzehnte Juni ist ein Sonntag. Welcher Wochentag ist der vierzehnte Juni?"
                options: ["Samstag", "Montag", "Sonntag"]
                answer: "Samstag"
                hints: ["Der 14. ist der Tag davor."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele Wochen sind 21 Tage?"
                say: "Wie viele Wochen sind einundzwanzig Tage?"
                options: ["3", "2", "21"]
                answer: "3"
              - id: l2-n2
                type: multiple_choice
                text: "Heute ist der 6. Dezember. Am 24. Dezember ist Heiligabend. Wie viele Tage dauert es noch?"
                say: "Heute ist der sechste Dezember, Nikolaus. Am vierundzwanzigsten Dezember ist Heiligabend. Wie viele Tage dauert es noch?"
                options: ["18", "19", "17"]
                answer: "18"
              - id: l2-n3
                type: multiple_choice
                text: "Der 4. Mai ist ein Mittwoch. Welcher Wochentag ist der 11. Mai?"
                say: "Der vierte Mai ist ein Mittwoch. Welcher Wochentag ist der elfte Mai?"
                options: ["Mittwoch", "Donnerstag", "Dienstag"]
                answer: "Mittwoch"
              - id: l2-n4
                type: true_false
                text: "Vom 3. bis zum 10. März sind es 8 Tage."
                say: "Stimmt das? Vom dritten bis zum zehnten März sind es acht Tage."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Der 20. August ist ein Donnerstag. Welcher Wochentag ist der 21. August?"
                say: "Der zwanzigste August ist ein Donnerstag. Welcher Wochentag ist der einundzwanzigste August?"
                options: ["Freitag", "Mittwoch", "Donnerstag"]
                answer: "Freitag"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Was bedeutet 09.11.?"
            say: "Welches Datum ist null neun Punkt elf Punkt?"
            options: ["der 9. November", "der 11. September", "der 9. Oktober"]
            answer: "der 9. November"
          - id: l2-c2
            type: multiple_choice
            text: "Wie schreibst du den 6. Februar kurz?"
            say: "Wie schreibst du den sechsten Februar kurz?"
            options: ["06.02.", "02.06.", "06.03."]
            answer: "06.02."
          - id: l2-c3
            type: multiple_choice
            text: "Heute ist der 11. März. Am 18. März hat Lisa Geburtstag. Wie viele Tage dauert es noch?"
            say: "Heute ist der elfte März. Am achtzehnten März hat Lisa Geburtstag. Wie viele Tage dauert es noch?"
            options: ["7", "8", "6"]
            answer: "7"
          - id: l2-c4
            type: multiple_choice
            text: "Der 7. Juni ist ein Samstag. Welcher Wochentag ist der 14. Juni?"
            say: "Der siebte Juni ist ein Samstag. Welcher Wochentag ist der vierzehnte Juni?"
            options: ["Samstag", "Sonntag", "Freitag"]
            answer: "Samstag"
          - id: l2-c5
            type: true_false
            text: "Vom 5. bis zum 19. Mai sind es 2 Wochen."
            say: "Stimmt das? Vom fünften bis zum neunzehnten Mai sind es zwei Wochen."
            answer: true
