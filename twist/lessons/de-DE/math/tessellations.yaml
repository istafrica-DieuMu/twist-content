# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.tessellations
skill: math.shapes.tessellations
curriculum: de-DE
language: de
title:
  de: Bandornamente und Parkette
  en: Friezes and tessellations
summary: >
  Lesson 1 continues Bandornamente from their Grundmuster, with shapes and
  with letters, and says whether the Grundmuster is verschoben or
  gespiegelt (b b b b, b d b d, b p b p); lesson 2 learns what a Parkett
  is (keine Lücken, nichts liegt übereinander), finds which shapes tile
  (Quadrat, Rechteck, Dreieck, Sechseck) and which do not (Kreis), counts
  the shapes that meet at a corner, and ends with the skill check.
  Inventing and drawing one's own frieze or tessellation waits for a
  drawing task.
metadata:
  year: klasse-4
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.patterns.repeating, math.shapes.more-shapes]
  also_practises: [math.patterns.repeating]
  vocabulary: { de: [Bandornament, Grundmuster, verschieben, spiegeln, Parkett, lückenlos, Fliese, Wabe] }
  forms: [text, audio, drawn]
  drawn: [letter-card, shape]
  facets: []
  misconceptions:
    - id: copies-last-item
      what: Continues a frieze by repeating the last item or by alternating two items, without finding the whole Grundmuster
      addressed: lesson 1 Learn names the Grundmuster Kreis, Dreieck, Dreieck; l1-f1, l1-f4, l1-n1, l1-c2 and l2-c2 have a three-part Grundmuster, with feedback in l1-f1, l2-c1 a four-part one
    - id: every-shape-tiles
      what: Thinks any shape of the same size, circles too, can cover a floor without gaps
      addressed: lesson 2 Learn shows the gaps between circles; l2-f2, l2-s3, l2-n1 and l2-n3 ask about circles, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bandornamente", en: "Friezes" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was kommt als Nächstes?"
            say: "Welche Form kommt als Nächstes?"
            show: { drawn: shape, row: [circle, square, circle, square, "?"], colours: blue }
            options: ["Kreis", "Quadrat", "Dreieck"]
            answer: "Kreis"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Farbe hat das nächste Dreieck?"
            say: "Welche Farbe hat das nächste Dreieck?"
            show: { drawn: shape, row: [triangle, triangle, triangle, triangle, "?"], colours: [red, blue, red, blue, null] }
            options: ["rot", "blau", "grün"]
            answer: "rot"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Bandornament: Das Grundmuster wiederholt sich."
            say: "Ein Bandornament ist ein Muster auf einem langen Streifen. Ein Grundmuster wiederholt sich immer wieder. Hier ist das Grundmuster: Kreis, Dreieck, Dreieck."
            show: { drawn: shape, row: [circle, triangle, triangle, circle, triangle, triangle], colours: green }
          - text: "verschieben"
            say: "Hier wird das b immer ein Stück weitergeschoben. Es sieht jedes Mal gleich aus. Das Grundmuster wird verschoben."
            show: { drawn: letter-card, text: "b b b b" }
          - text: "spiegeln"
            say: "Hier steht zwischen zwei Buchstaben ein Spiegel. Aus dem b wird ein d, dann wieder ein b. Das Grundmuster wird gespiegelt."
            show: { drawn: letter-card, text: "b d b d" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Finde das Grundmuster. Welche Form kommt als Nächstes?"
                show: { drawn: shape, row: [square, circle, circle, square, circle, circle, "?"], colours: orange }
                options: ["Quadrat", "Kreis", "Dreieck"]
                answer: "Quadrat"
                feedback:
                  "Kreis": "Das Grundmuster ist Quadrat, Kreis, Kreis. Nach zwei Kreisen kommt wieder ein Quadrat."
                hints:
                  - "Welche Formen wiederholen sich immer zusammen?"
                  - "Das Grundmuster ist Quadrat, Kreis, Kreis. Es ist gerade zu Ende."
                  - "Quadrat."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Buchstabe kommt als Nächstes?"
                say: "Welcher Buchstabe kommt als Nächstes?"
                show: { drawn: letter-card, text: "b d b d b ?" }
                options: ["d", "b", "p"]
                answer: "d"
                option_audio: false
                hints:
                  - "Was folgt immer auf das b?"
                  - "Auf b folgt sein Spiegelbild."
                  - "d."
              - id: l1-f3
                type: multiple_choice
                text: "Wie entsteht dieses Bandornament?"
                say: "Wie entsteht dieses Bandornament?"
                show: { drawn: letter-card, text: "b b b b" }
                options: ["Das b wird verschoben.", "Das b wird gespiegelt.", "Das b wird gedreht."]
                answer: "Das b wird verschoben."
                hints:
                  - "Sieht jedes b gleich aus?"
                  - "Alle Buchstaben zeigen in dieselbe Richtung."
                  - "Das b wird verschoben."
              - id: l1-f4
                type: multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Finde das Grundmuster. Welche Form kommt als Nächstes?"
                show: { drawn: shape, row: [triangle, triangle, square, triangle, triangle, square, triangle, "?"], colours: purple }
                options: ["Dreieck", "Quadrat", "Kreis"]
                answer: "Dreieck"
                hints:
                  - "Das Grundmuster hat drei Formen."
                  - "Dreieck, Dreieck, Quadrat. Nach dem letzten Quadrat kam erst ein Dreieck."
                  - "Dreieck."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viele Formen hat das Grundmuster?"
                say: "Wie viele Formen hat das Grundmuster?"
                show: { drawn: shape, row: [circle, square, triangle, circle, square, triangle], colours: red }
                options: ["3", "6", "2"]
                answer: "3"
                hints:
                  - "Wann fängt das Muster von vorn an?"
                  - "Nach Kreis, Quadrat, Dreieck kommt wieder ein Kreis."
                  - "3."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Buchstabe kommt als Nächstes?"
                say: "Welcher Buchstabe kommt als Nächstes?"
                show: { drawn: letter-card, text: "p q p q p ?" }
                options: ["q", "p", "d"]
                answer: "q"
                option_audio: false
                hints: ["Auf p folgt immer sein Spiegelbild."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie entsteht dieses Bandornament?"
                say: "Wie entsteht dieses Bandornament?"
                show: { drawn: letter-card, text: "b d b d" }
                options: ["Das b wird gespiegelt.", "Das b wird verschoben.", "Das b wird gedreht."]
                answer: "Das b wird gespiegelt."
                hints: ["Zeigen alle Buchstaben in dieselbe Richtung?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Farbe hat der nächste Kreis?"
                say: "Welche Farbe hat der nächste Kreis?"
                show: { drawn: shape, row: [circle, circle, circle, circle, circle, circle, circle, circle, "?"], colours: [red, red, blue, red, red, blue, red, red, null] }
                options: ["blau", "rot", "grün"]
                answer: "blau"
                hints: ["Das Grundmuster ist rot, rot, blau."]
              - id: l1-s4
                type: true_false
                text: "Hier wird das b an einer waagerechten Linie gespiegelt."
                say: "Stimmt das? In diesem Bandornament wird das b an einer waagerechten Linie gespiegelt, also oben und unten."
                show: { drawn: letter-card, text: "b p b p" }
                answer: true
                hints: ["Klapp das b nach unten. Was entsteht?"]
                difficulty: stretch
              - id: l1-s5
                type: multiple_choice
                text: "Quadrat, Kreis, Quadrat, Kreis, Quadrat, Kreis: Was ist das Grundmuster?"
                say: "Quadrat, Kreis, Quadrat, Kreis, Quadrat, Kreis. Was ist das Grundmuster?"
                options: ["Quadrat, Kreis", "Quadrat, Kreis, Quadrat", "Kreis"]
                answer: "Quadrat, Kreis"
                hints: ["Das Grundmuster ist das kürzeste Stück, das sich wiederholt."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Welche Form kommt als Nächstes?"
                show: { drawn: shape, row: [hexagon, hexagon, circle, hexagon, hexagon, circle, "?"], colours: blue }
                options: ["Sechseck", "Kreis", "Quadrat"]
                answer: "Sechseck"
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Buchstabe kommt als Nächstes?"
                say: "Welcher Buchstabe kommt als Nächstes?"
                show: { drawn: letter-card, text: "d b d b d ?" }
                options: ["b", "d", "q"]
                answer: "b"
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Wie entsteht dieses Bandornament?"
                say: "Wie entsteht dieses Bandornament?"
                show: { drawn: letter-card, text: "q q q q" }
                options: ["Das q wird verschoben.", "Das q wird gespiegelt.", "Das q wird gedreht."]
                answer: "Das q wird verschoben."
              - id: l1-n4
                type: multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Welche Form kommt als Nächstes?"
                show: { drawn: shape, row: [circle, triangle, square, circle, triangle, "?"], colours: green }
                options: ["Quadrat", "Kreis", "Dreieck"]
                answer: "Quadrat"
              - id: l1-n5
                type: true_false
                text: "In diesem Bandornament wird das b nur verschoben."
                say: "Stimmt das? In diesem Bandornament wird das b nur verschoben."
                show: { drawn: letter-card, text: "b d b d" }
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welcher Buchstabe kommt als Nächstes?"
            say: "Welcher Buchstabe kommt als Nächstes?"
            show: { drawn: letter-card, text: "q p q p q ?" }
            options: ["p", "q", "b"]
            answer: "p"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Was kommt als Nächstes?"
            say: "Welche Form kommt als Nächstes?"
            show: { drawn: shape, row: [square, square, triangle, square, square, triangle, square, "?"], colours: red }
            options: ["Quadrat", "Dreieck", "Kreis"]
            answer: "Quadrat"
          - id: l1-c3
            type: multiple_choice
            text: "Was ist ein Bandornament?"
            say: "Was ist ein Bandornament?"
            options: ["ein Muster auf einem Streifen, in dem sich ein Grundmuster wiederholt", "ein einzelnes Bild auf einem Streifen", "ein Muster ohne Regel"]
            answer: "ein Muster auf einem Streifen, in dem sich ein Grundmuster wiederholt"

  - n: 2
    title: { de: "Parkette ohne Lücken", en: "Tessellations without gaps" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Buchstabe kommt als Nächstes?"
            say: "Welcher Buchstabe kommt als Nächstes?"
            show: { drawn: letter-card, text: "p q p ?" }
            options: ["q", "p"]
            answer: "q"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie entsteht dieses Bandornament?"
            say: "Wie entsteht dieses Bandornament?"
            show: { drawn: letter-card, text: "d d d d" }
            options: ["Das d wird verschoben.", "Das d wird gespiegelt."]
            answer: "Das d wird verschoben."
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Parkett: keine Lücken, nichts liegt übereinander"
            say: "Ein Parkett bedeckt eine Fläche ganz mit Formen. Es gibt keine Lücken, und keine Form liegt über einer anderen. Fliesen im Bad sind oft ein Parkett aus Quadraten. An jeder Ecke treffen sich vier Quadrate."
            show: { drawn: shape, kind: square, colour: blue }
          - text: "Sechsecke passen lückenlos aneinander."
            say: "Auch gleich große Sechsecke passen lückenlos aneinander. An jeder Ecke treffen sich drei Sechsecke. So bauen Bienen ihre Waben."
            show: { drawn: shape, kind: hexagon, colour: yellow }
          - text: "Kreise lassen Lücken."
            say: "Kreise kannst du nicht lückenlos legen. Zwischen den Kreisen bleiben immer kleine Lücken, egal wie du sie schiebst. Mit Kreisen allein gibt es kein Parkett."
            show: { drawn: shape, kind: circle, colour: red }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Mit gleich großen Quadraten kannst du eine Fläche ohne Lücken auslegen."
                say: "Stimmt das? Mit gleich großen Quadraten kannst du eine Fläche ohne Lücken auslegen."
                show: { drawn: shape, kind: square, colour: green }
                answer: true
                hints:
                  - "Denk an die Fliesen im Bad."
                  - "Die geraden Seiten passen genau aneinander."
                  - "Ja, das stimmt."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Mit welcher Form kannst du keine Fläche ohne Lücken auslegen?"
                say: "Mit welcher Form kannst du keine Fläche ohne Lücken auslegen?"
                options:
                  - { drawn: shape, kind: square, colour: orange }
                  - { drawn: shape, kind: hexagon, colour: orange }
                  - { drawn: shape, kind: circle, colour: orange }
                answer: circle
                option_audio: false
                feedback:
                  square: "Quadrate passen genau aneinander, wie Fliesen. Gesucht ist die Form, die Lücken lässt."
                  hexagon: "Sechsecke passen genau aneinander, wie bei einer Bienenwabe. Gesucht ist die Form, die Lücken lässt."
                hints:
                  - "Welche Form hat keine geraden Seiten?"
                  - "Runde Formen berühren sich nur an einer Stelle."
                  - "Der Kreis."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele Quadrate treffen sich in einem Parkett an einer Ecke?"
                say: "In einem Parkett aus gleich großen Quadraten: Wie viele Quadrate treffen sich an einer Ecke?"
                options: ["4", "3", "6"]
                answer: "4"
                hints:
                  - "Denk an ein Schachbrett."
                  - "Ein Quadrat oben links, oben rechts, unten links, unten rechts."
                  - "4."
              - id: l2-f4
                type: true_false
                text: "Bei einem Parkett dürfen Formen übereinander liegen."
                say: "Stimmt das? Bei einem Parkett dürfen Formen übereinander liegen."
                answer: false
                hints:
                  - "Denk an die zwei Regeln für ein Parkett."
                  - "Keine Lücken, und nichts liegt über etwas anderem."
                  - "Nein, das stimmt nicht."
              - id: l2-f5
                type: multiple_choice
                text: "Wo findest du ein Parkett aus Sechsecken?"
                say: "Wo findest du ein Parkett aus Sechsecken?"
                options: ["in einer Bienenwabe", "auf einem Schachbrett", "auf einer Zielscheibe"]
                answer: "in einer Bienenwabe"
                hints:
                  - "Ein Schachbrett hat Quadrate, eine Zielscheibe Kreise."
                  - "Bienen bauen ihre Zellen mit sechs Seiten."
                  - "In einer Bienenwabe."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Mit gleich großen Dreiecken wie diesem kannst du eine Fläche ohne Lücken auslegen."
                say: "Stimmt das? Mit gleich großen Dreiecken wie diesem kannst du eine Fläche ohne Lücken auslegen."
                show: { drawn: shape, kind: triangle, colour: purple }
                answer: true
                hints: ["Leg ein Dreieck mit der Spitze nach oben und eins mit der Spitze nach unten nebeneinander."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie viele Sechsecke treffen sich in einer Bienenwabe an einer Ecke?"
                say: "Wie viele Sechsecke treffen sich in einer Bienenwabe an einer Ecke?"
                options: ["3", "4", "6"]
                answer: "3"
                hints: ["Denk an die Erklärung zu den Bienenwaben."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Welche Form passt ohne Lücken aneinander?"
                say: "Welche Form passt ohne Lücken aneinander?"
                options:
                  - { drawn: shape, kind: circle, colour: green }
                  - { drawn: shape, kind: rectangle, colour: green }
                answer: rectangle
                option_audio: false
                hints: ["Gerade Seiten kann man genau aneinanderlegen."]
              - id: l2-s4
                type: true_false
                text: "Ein Schachbrett ist ein Parkett aus Quadraten."
                say: "Stimmt das? Ein Schachbrett ist ein Parkett aus Quadraten."
                answer: true
                hints: ["Gibt es auf einem Schachbrett Lücken?"]
              - id: l2-s5
                type: multiple_choice
                text: "Was darf es bei einem Parkett nicht geben?"
                say: "Was darf es bei einem Parkett nicht geben?"
                options: ["Lücken zwischen den Formen", "verschiedene Farben", "kleine Formen"]
                answer: "Lücken zwischen den Formen"
                hints: ["Ein Parkett bedeckt die ganze Fläche."]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "Mit gleich großen Kreisen kannst du eine Fläche ohne Lücken auslegen."
                say: "Stimmt das? Mit gleich großen Kreisen kannst du eine Fläche ohne Lücken auslegen."
                show: { drawn: shape, kind: circle, colour: blue }
                answer: false
              - id: l2-n2
                type: multiple_choice
                text: "Wie viele Dreiecke wie dieses treffen sich in einem Parkett an einer Ecke?"
                say: "Ein Parkett ist aus gleich großen Dreiecken wie diesem. Wie viele Dreiecke treffen sich an einer Ecke?"
                show: { drawn: shape, kind: triangle, colour: yellow }
                options: ["6", "3", "4"]
                answer: "6"
                difficulty: stretch
              - id: l2-n3
                type: multiple_choice
                text: "Welcher Boden ist kein Parkett?"
                say: "Welcher Boden ist kein Parkett?"
                options: ["ein Boden aus runden Fliesen", "ein Boden aus quadratischen Fliesen", "ein Boden aus rechteckigen Holzbrettern"]
                answer: "ein Boden aus runden Fliesen"
              - id: l2-n4
                type: image_multiple_choice
                text: "Aus welcher Form ist eine Bienenwabe gebaut?"
                say: "Aus welcher Form ist eine Bienenwabe gebaut?"
                options:
                  - { drawn: shape, kind: hexagon, colour: yellow }
                  - { drawn: shape, kind: square, colour: yellow }
                  - { drawn: shape, kind: triangle, colour: yellow }
                answer: hexagon
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Mit gleich großen Rechtecken kannst du eine Fläche ohne Lücken auslegen."
                say: "Stimmt das? Mit gleich großen Rechtecken kannst du eine Fläche ohne Lücken auslegen."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welcher Buchstabe kommt als Nächstes?"
            say: "Finde das Grundmuster. Welcher Buchstabe kommt als Nächstes?"
            show: { drawn: letter-card, text: "p p q q p p q ?" }
            options: ["q", "p", "d"]
            answer: "q"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Was kommt als Nächstes?"
            say: "Finde das Grundmuster. Welche Form kommt als Nächstes?"
            show: { drawn: shape, row: [triangle, circle, circle, triangle, circle, circle, triangle, "?"], colours: blue }
            options: ["Kreis", "Dreieck", "Quadrat"]
            answer: "Kreis"
          - id: l2-c3
            type: multiple_choice
            text: "Wie entsteht dieses Bandornament?"
            say: "Wie entsteht dieses Bandornament?"
            show: { drawn: letter-card, text: "d b d b" }
            options: ["Das d wird gespiegelt.", "Das d wird verschoben.", "Das d wird gedreht."]
            answer: "Das d wird gespiegelt."
          - id: l2-c4
            type: image_multiple_choice
            text: "Lea will den Boden lückenlos mit gleichen Fliesen auslegen. Welche Form kann sie nehmen?"
            say: "Lea will den Boden lückenlos mit gleichen Fliesen auslegen. Welche Form kann sie nehmen?"
            options:
              - { drawn: shape, kind: circle, colour: purple }
              - { drawn: shape, kind: hexagon, colour: purple }
            answer: hexagon
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Zwischen gleich großen Sechsecken bleiben im Parkett kleine Lücken."
            say: "Stimmt das? Zwischen gleich großen Sechsecken bleiben im Parkett kleine Lücken."
            answer: false
