# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.data-critical
skill: math.data.critical
curriculum: de-DE
language: de
title:
  de: Diagramme kritisch lesen
  en: Reading charts critically
summary: >
  Lesson 1 looks at charts whose Skala does not start at 0: the bars
  are drawn with a cut-off Skala (bar-chart `from`; Skala
  beginnt bei 90: 98 looks twice as long as 94), so the child checks
  where the Skala starts, reads the real numbers and works out the real
  difference, and compares with the honest Säulendiagramm from 0.
  Lesson 2 adds other tricks: steps of different sizes on the Skala, a
  Skala with no numbers, pictures drawn bigger, too few or the wrong
  people asked, and a claim that says more than the data; it ends with
  the skill check.
metadata:
  year: klasse-4
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.data.read-charts]
  also_practises: [math.data.read-charts, math.data.plan-survey]
  vocabulary: { de: [Diagramm, Skala, abgeschnitten, beginnt bei, Unterschied, irreführend, ehrlich, Umfrage, befragt] }
  forms: [text, audio, drawn]
  drawn: [bar-chart]
  facets: []
  misconceptions:
    - id: bar-length-is-value
      what: Compares the length of the bars instead of the numbers when the Skala does not start at 0 (a bar twice as long means twice as much)
      addressed: lesson 1 Learn puts a cut chart next to the honest one; l1-f2 (with feedback), l1-f4, l1-s4, l1-n5, l2-w1 and l2-c1 ask whether twice as long is twice as much
    - id: ignores-scale-steps
      what: Reads a Skala without checking that its steps are equal or that it has numbers at all
      addressed: lesson 2 Learn shows a Skala 0, 10, 20, 50, 100; l2-f1 (with feedback), l2-f2, l2-s1, l2-s2, l2-n1 and l2-c3 ask what is wrong with the Skala
    - id: trusts-any-survey
      what: Accepts a claim about everyone from a survey of three people or of the wrong group
      addressed: lesson 2 Learn compares 3 children asked with a whole school; l2-f4 (with feedback), l2-f5, l2-s4, l2-s5, l2-n4, l2-n5 and l2-c4 ask whether the claim holds
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wo beginnt die Skala?", en: "Where does the scale start?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Kilogramm Altpapier hat die 4b gesammelt?"
            say: "Das Säulendiagramm zeigt, wie viel Altpapier die Klassen gesammelt haben. Wie viele Kilogramm hat die vier b gesammelt?"
            show: { drawn: bar-chart, step: 10, rows: [["4a", 60], ["4b", 80], ["4c", 50]] }
            options: ["80", "8", "70"]
            answer: "80"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viel mehr hat die 4b gesammelt als die 4c?"
            say: "Wie viele Kilogramm mehr hat die vier b gesammelt als die vier c?"
            show: { drawn: bar-chart, step: 10, rows: [["4a", 60], ["4b", 80], ["4c", 50]] }
            options: ["30", "130", "3"]
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Altpapier in kg\n4a: 98\n4b: 94"
            say: "Die vier a hat achtundneunzig Kilogramm Altpapier gesammelt, die vier b vierundneunzig. In diesem Säulendiagramm beginnt die Skala bei null. Die Säulen sind fast gleich hoch. So ist es auch: Der Unterschied ist klein."
            show: { drawn: bar-chart, step: 10, rows: [["4a", 98], ["4b", 94]] }
          - text: "Altpapier in kg\nDie Skala beginnt bei 90."
            say: "Jetzt dieselben Zahlen noch einmal. Aber hier beginnt die Skala nicht bei null, sondern bei neunzig. Die Säulen zeigen nur den Teil über neunzig. Jetzt sieht die Säule der vier a doppelt so lang aus wie die der vier b."
            show: { drawn: bar-chart, from: 90, step: 1, rows: [["4a", 98], ["4b", 94]] }
          - text: "98 − 94 = 4\nNur 4 kg mehr, nicht doppelt so viel."
            say: "Hat die vier a doppelt so viel gesammelt? Nein. Achtundneunzig minus vierundneunzig ist vier. Es sind nur vier Kilogramm mehr. Das Diagramm führt in die Irre."
          - text: "1. Wo beginnt die Skala?\n2. Lies die Zahlen ab.\n3. Rechne den Unterschied aus."
            say: "Schau bei jedem Diagramm zuerst: Wo beginnt die Skala? Beginnt sie nicht bei null, dann vergleiche nicht die Längen. Lies die Zahlen ab und rechne den Unterschied aus."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Gelesene Bücher\nWo beginnt die Skala?"
                show: { drawn: bar-chart, from: 40, step: 1, rows: [["Lina", 46], ["Jonas", 42]] }
                say: "Das Diagramm zeigt, wie viele Bücher Lina und Jonas in einem Jahr gelesen haben. Wo beginnt die Skala?"
                options: ["bei 40", "bei 0", "bei 46"]
                answer: "bei 40"
                hints:
                  - "Schau auf die Zahlen links an der Skala."
                  - "Lies die unterste Zahl an der Skala ab."
                  - "Bei 40."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Gelesene Bücher\nHat Lina dreimal so viele Bücher gelesen wie Jonas?"
                show: { drawn: bar-chart, from: 40, step: 1, rows: [["Lina", 46], ["Jonas", 42]] }
                say: "Linas Säule ist dreimal so lang wie die von Jonas. Hat Lina dreimal so viele Bücher gelesen wie Jonas?"
                answer: false
                feedback:
                  "true": "Die Skala beginnt bei 40. Lina hat 46 gelesen, Jonas 42. Das sind nur 4 mehr, nicht dreimal so viele."
                hints:
                  - "Vergleiche nicht die Längen. Lies die Zahlen an der Skala ab."
                  - "Lina 46, Jonas 42."
                  - "Nein. 46 ist nicht dreimal so viel wie 42."
              - id: l1-f3
                type: multiple_choice
                text: "Gelesene Bücher\nWie viele Bücher hat Lina mehr gelesen?"
                show: { drawn: bar-chart, from: 40, step: 1, rows: [["Lina", 46], ["Jonas", 42]] }
                say: "Wie viele Bücher hat Lina wirklich mehr gelesen als Jonas?"
                options: ["4", "6", "2"]
                answer: "4"
                feedback:
                  "6": "6 ist Linas Säule über der 40. Gelesen hat sie 46. Rechne 46 − 42."
                hints:
                  - "Lies die beiden Zahlen ab."
                  - "Rechne 46 − 42."
                  - "4 Bücher."
              - id: l1-f4
                type: multiple_choice
                text: "Warum sieht der Unterschied so groß aus?"
                say: "Warum sieht der Unterschied zwischen Lina und Jonas so groß aus?"
                show: { drawn: bar-chart, from: 40, step: 1, rows: [["Lina", 46], ["Jonas", 42]] }
                options: ["Die Skala beginnt nicht bei 0.", "Lina hat viel mehr gelesen.", "Jonas liest nicht gern."]
                answer: "Die Skala beginnt nicht bei 0."
                hints:
                  - "Denk an das Diagramm mit Skala ab 40."
                  - "Unter 40 ist alles abgeschnitten."
                  - "Die Skala beginnt nicht bei 0."
              - id: l1-f5
                type: image_multiple_choice
                text: "Lina 46, Jonas 42. Welches Diagramm zeigt den Unterschied ehrlich?"
                say: "Lina hat sechsundvierzig Bücher gelesen, Jonas zweiundvierzig. Welches Säulendiagramm mit Skala ab null passt?"
                options:
                  - { drawn: bar-chart, step: 10, rows: [["Lina", 46], ["Jonas", 42]], key: "46-42" }
                  - { drawn: bar-chart, step: 10, rows: [["Lina", 46], ["Jonas", 16]], key: "46-16" }
                  - { drawn: bar-chart, step: 10, rows: [["Lina", 42], ["Jonas", 46]], key: "42-46" }
                answer: "46-42"
                hints:
                  - "Bei Skala ab 0 sind die Säulen fast gleich hoch."
                  - "Linas Säule ist ein bisschen höher."
                  - "Das Diagramm mit Lina 46 und Jonas 42."
              - id: l1-f6
                type: multiple_choice
                text: "Werbung: Saft A hat viel mehr Vitamine!\nVitamine in mg\nWie viel mehr Vitamine hat Saft A?"
                show: { drawn: bar-chart, from: 48, step: 1, rows: [["A", 52], ["B", 50]] }
                say: "Eine Werbung sagt: Saft A hat viel mehr Vitamine! Die Skala beginnt bei achtundvierzig. Wie viel mehr hat Saft A wirklich?"
                options: ["2", "4", "doppelt so viel"]
                answer: "2"
                keep_order: true
                hints:
                  - "Lies an der Skala ab, wie hoch die Säulen sind."
                  - "Saft A 52, Saft B 50."
                  - "52 − 50 = 2. Nur 2 mehr."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Besucher im Kino\nWo beginnt die Skala?"
                show: { drawn: bar-chart, from: 200, step: 10, rows: [["Samstag", 250], ["Sonntag", 210]] }
                say: "Das Diagramm zeigt die Besucher im Kino. Wo beginnt die Skala?"
                options: ["bei 200", "bei 0", "bei 250"]
                answer: "bei 200"
                hints: ["Lies die unterste Zahl an der Skala ab."]
              - id: l1-s2
                type: true_false
                text: "Besucher im Kino\nKamen am Samstag mehr Besucher als am Sonntag?"
                show: { drawn: bar-chart, from: 200, step: 10, rows: [["Samstag", 250], ["Sonntag", 210]] }
                say: "Die Säule für Samstag ist länger als die für Sonntag. Kamen am Samstag mehr Besucher als am Sonntag?"
                answer: true
                hints: ["Vergleiche die Zahlen: 250 und 210."]
              - id: l1-s3
                type: text_input
                text: "Besucher im Kino\nWie viele Besucher kamen am Samstag mehr?"
                show: { drawn: bar-chart, from: 200, step: 10, rows: [["Samstag", 250], ["Sonntag", 210]] }
                say: "Wie viele Besucher kamen am Samstag mehr als am Sonntag? Tippe die Zahl ein."
                answer: "40"
                hints: ["Rechne 250 − 210."]
              - id: l1-s4
                type: multiple_choice
                text: "Was ist an diesem Diagramm irreführend?"
                say: "Was ist an dem Diagramm vom Kino irreführend?"
                show: { drawn: bar-chart, from: 200, step: 10, rows: [["Samstag", 250], ["Sonntag", 210]] }
                options: ["Die Skala beginnt bei 200, nicht bei 0.", "Es gibt nur zwei Säulen.", "Die Säulen sind bunt."]
                answer: "Die Skala beginnt bei 200, nicht bei 0."
                hints: ["Wo beginnt die Skala bei einem ehrlichen Säulendiagramm?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Samstag 250, Sonntag 210. Welches Diagramm zeigt es ehrlich?"
                say: "Samstag zweihundertfünfzig, Sonntag zweihundertzehn. Welches Säulendiagramm mit Skala ab null passt?"
                options:
                  - { drawn: bar-chart, step: 50, rows: [["Sa", 250], ["So", 50]], key: "250-50" }
                  - { drawn: bar-chart, step: 50, rows: [["Sa", 250], ["So", 210]], key: "250-210" }
                  - { drawn: bar-chart, step: 50, rows: [["Sa", 210], ["So", 250]], key: "210-250" }
                answer: "250-210"
                hints: ["Mit Skala ab 0 sind die beiden Säulen fast gleich hoch."]
              - id: l1-s6
                type: multiple_choice
                text: "Werbung: Unsere Batterie hält viel länger!\nLaufzeit in Stunden\nWas stimmt?"
                show: { drawn: bar-chart, from: 10, step: 1, rows: [["X", 13], ["Y", 11]] }
                say: "Eine Werbung zeigt dieses Diagramm. Was stimmt wirklich?"
                options: ["Batterie X hält 2 Stunden länger.", "Batterie X hält dreimal so lange.", "Batterie Y hält länger."]
                answer: "Batterie X hält 2 Stunden länger."
                hints: ["Lies die Zahlen ab: 13 und 11."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Tore in der Saison\nWo beginnt die Skala?"
                show: { drawn: bar-chart, from: 30, step: 1, rows: [["Nord", 36], ["Süd", 33]] }
                say: "Das Diagramm zeigt die Tore von zwei Fußballteams. Wo beginnt die Skala?"
                options: ["bei 30", "bei 0", "bei 36"]
                answer: "bei 30"
              - id: l1-n2
                type: true_false
                text: "Tore in der Saison\nTeam Nord hat 36 Tore geschossen."
                show: { drawn: bar-chart, from: 30, step: 1, rows: [["Nord", 36], ["Süd", 33]] }
                say: "Stimmt das? Team Nord hat sechsunddreißig Tore geschossen."
                answer: true
              - id: l1-n3
                type: text_input
                text: "Tore in der Saison\nWie viele Tore hat Team Nord mehr geschossen?"
                show: { drawn: bar-chart, from: 30, step: 1, rows: [["Nord", 36], ["Süd", 33]] }
                say: "Wie viele Tore hat Team Nord mehr geschossen als Team Süd? Tippe die Zahl ein."
                answer: "3"
              - id: l1-n4
                type: image_multiple_choice
                text: "Nord 36, Süd 33. Welches Diagramm zeigt es ehrlich?"
                say: "Team Nord sechsunddreißig Tore, Team Süd dreiunddreißig. Welches Säulendiagramm mit Skala ab null passt?"
                options:
                  - { drawn: bar-chart, step: 10, rows: [["Nord", 36], ["Süd", 33]], key: "36-33" }
                  - { drawn: bar-chart, step: 10, rows: [["Nord", 36], ["Süd", 18]], key: "36-18" }
                  - { drawn: bar-chart, step: 10, rows: [["Nord", 6], ["Süd", 3]], key: "6-3" }
                answer: "36-33"
              - id: l1-n5
                type: multiple_choice
                text: "Gemüse im Schulgarten in kg\nWelcher Satz stimmt?"
                show: { drawn: bar-chart, from: 20, step: 1, rows: [["Kartoffeln", 28], ["Möhren", 22]] }
                say: "Das Diagramm zeigt die Ernte im Schulgarten. Welcher Satz stimmt?"
                options: ["Es gab 6 kg mehr Kartoffeln als Möhren.", "Es gab viermal so viele Kartoffeln wie Möhren.", "Es gab 8 kg Kartoffeln."]
                answer: "Es gab 6 kg mehr Kartoffeln als Möhren."
              - id: l1-n6
                type: multiple_choice
                text: "Was prüfst du bei einem Diagramm zuerst?"
                say: "Du siehst ein Diagramm in der Zeitung. Was prüfst du zuerst?"
                options: ["Wo die Skala beginnt", "Welche Farbe die Säulen haben", "Wie lang die längste Säule ist"]
                answer: "Wo die Skala beginnt"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: true_false
            text: "Geerntete Äpfel in kg\nBaum 1 hat doppelt so viele Äpfel getragen."
            show: { drawn: bar-chart, from: 60, step: 1, rows: [["Baum 1", 64], ["Baum 2", 62]] }
            say: "Stimmt das? Baum eins hat doppelt so viele Äpfel getragen wie Baum zwei."
            answer: false
          - id: l1-c2
            type: multiple_choice
            text: "Geerntete Äpfel in kg\nWie viel mehr hat Baum 1 getragen?"
            show: { drawn: bar-chart, from: 60, step: 1, rows: [["Baum 1", 64], ["Baum 2", 62]] }
            say: "Wie viele Kilogramm mehr hat Baum eins wirklich getragen?"
            options: ["2 kg", "4 kg", "doppelt so viel"]
            answer: "2 kg"
            keep_order: true
          - id: l1-c3
            type: multiple_choice
            text: "Warum sieht der Unterschied so groß aus?"
            say: "Warum sieht der Unterschied zwischen den beiden Bäumen so groß aus?"
            show: { drawn: bar-chart, from: 60, step: 1, rows: [["Baum 1", 64], ["Baum 2", 62]] }
            options: ["Die Skala beginnt bei 60, nicht bei 0.", "Baum 1 ist größer.", "Es gibt nur zwei Bäume."]
            answer: "Die Skala beginnt bei 60, nicht bei 0."

  - n: 2
    title: { de: "Weitere Tricks erkennen", en: "Spotting other tricks" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Punkte im Quiz\nGruppe A hat doppelt so viele Punkte."
            show: { drawn: bar-chart, from: 70, step: 1, rows: [["A", 76], ["B", 73]] }
            say: "Stimmt das? Gruppe A hat doppelt so viele Punkte wie Gruppe B."
            answer: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Punkte im Quiz\nWie viele Punkte hat Gruppe A mehr?"
            show: { drawn: bar-chart, from: 70, step: 1, rows: [["A", 76], ["B", 73]] }
            say: "Wie viele Punkte hat Gruppe A wirklich mehr als Gruppe B?"
            options: ["3", "6", "73"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Skala: 0, 10, 20, 50, 100"
            say: "Schau dir die Schritte der Skala an. Von null bis zwanzig geht es in Zehnerschritten. Dann kommt fünfzig und dann hundert. Die Linien stehen gleich weit auseinander, aber die Zahlen springen plötzlich viel weiter. So sehen große Zahlen kleiner aus, als sie sind. Bei einer ehrlichen Skala sind alle Schritte gleich groß."
          - text: "Skala ohne Zahlen"
            say: "Manchmal hat ein Diagramm gar keine Zahlen an der Skala. Dann kannst du nichts ablesen. Du weißt nur, welche Säule länger ist, aber nicht, um wie viel."
          - text: "Lieblingstier\nHund: ein kleines Bild\nKatze: ein riesiges Bild"
            say: "In einem Bilddiagramm muss jedes Bild gleich groß sein. Wenn ein Bild riesig gemalt ist, sieht es nach viel mehr aus, auch wenn es nur für ein Kind steht."
          - text: "3 Kinder gefragt: 2 mögen Spinat.\nAlso mögen die meisten Kinder Spinat?"
            say: "Achte auch darauf, wer befragt wurde. Drei Kinder sind viel zu wenige, um etwas über alle Kinder zu sagen. Und wer nur im Fußballverein fragt, findet natürlich viele Fußballfans."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Skala: 0, 10, 20, 50, 100\nWas ist falsch an dieser Skala?"
                say: "Die Skala eines Diagramms geht so: null, zehn, zwanzig, fünfzig, hundert. Was ist daran falsch?"
                options: ["Die Schritte sind nicht gleich groß.", "Sie beginnt bei 0.", "Sie geht bis 100."]
                answer: "Die Schritte sind nicht gleich groß."
                feedback:
                  "Sie beginnt bei 0.": "Bei 0 zu beginnen ist richtig. Schau dir die Schritte an: 10, 10, dann 30, dann 50."
                hints:
                  - "Rechne aus, wie groß jeder Schritt ist."
                  - "Von 0 bis 20 sind es Zehnerschritte. Und dann?"
                  - "Die Schritte sind nicht gleich groß."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Skala ist ehrlich?"
                say: "Welche Skala ist ehrlich?"
                options: ["0, 20, 40, 60, 80", "0, 20, 30, 60, 100", "0, 5, 20, 40, 80"]
                answer: "0, 20, 40, 60, 80"
                hints:
                  - "Bei einer ehrlichen Skala sind alle Schritte gleich groß."
                  - "Prüf bei jeder Skala, ob sie immer um dieselbe Zahl wächst."
                  - "0, 20, 40, 60, 80: immer plus 20."
              - id: l2-f3
                type: true_false
                text: "Ein Diagramm zeigt Sportarten, hat aber keine Zahlen an der Skala. Kannst du trotzdem sehen, welchen Sport die meisten Kinder mögen?"
                say: "Ein Säulendiagramm zeigt Sportarten, hat aber keine Zahlen an der Skala. Kannst du trotzdem sehen, welchen Sport die meisten Kinder mögen?"
                answer: true
                hints:
                  - "Zahlen kannst du nicht ablesen. Was siehst du trotzdem?"
                  - "Du siehst, welche Säule am längsten ist."
                  - "Ja. Die längste Säule zeigt den beliebtesten Sport."
              - id: l2-f4
                type: true_false
                text: "Ole hat 3 Kinder gefragt. 2 mögen Spinat.\nOle sagt: Die meisten Kinder in Deutschland mögen Spinat.\nDarf Ole das sagen?"
                say: "Ole hat drei Kinder gefragt. Zwei mögen Spinat. Ole sagt: Die meisten Kinder in Deutschland mögen Spinat. Darf Ole das sagen?"
                answer: false
                feedback:
                  "true": "3 Kinder sind viel zu wenige. Über alle Kinder in Deutschland weiß Ole damit nichts."
                hints:
                  - "Wie viele Kinder hat Ole gefragt?"
                  - "Und über wie viele Kinder spricht er?"
                  - "Nein. 3 Kinder sind viel zu wenige."
              - id: l2-f5
                type: multiple_choice
                text: "Umfrage im Reitverein: 18 von 20 Kindern lieben Pferde.\nWas ist das Problem?"
                say: "Eine Umfrage im Reitverein ergibt: Achtzehn von zwanzig Kindern lieben Pferde. Die Zeitung schreibt: Fast alle Kinder lieben Pferde. Was ist das Problem?"
                options: ["Im Reitverein sind vor allem Pferdefans.", "20 Kinder sind zu viele.", "18 ist eine gerade Zahl."]
                answer: "Im Reitverein sind vor allem Pferdefans."
                hints:
                  - "Wer geht in einen Reitverein?"
                  - "Die befragten Kinder sind nicht wie alle Kinder."
                  - "Im Reitverein sind vor allem Pferdefans."
              - id: l2-f6
                type: multiple_choice
                text: "Im Bilddiagramm ist das Bild für Katze viel größer gemalt. Was stimmt?"
                say: "In einem Bilddiagramm haben Hund und Katze je ein Bild. Das Bild für Katze ist aber viermal so groß gemalt. Was stimmt?"
                options: ["Beide stehen für gleich viele Kinder.", "Katze steht für viermal so viele Kinder.", "Hund steht für mehr Kinder."]
                answer: "Beide stehen für gleich viele Kinder."
                hints:
                  - "Was zählt im Bilddiagramm: die Größe oder die Anzahl der Bilder?"
                  - "Jedes Tier hat genau ein Bild."
                  - "Beide stehen für gleich viele."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Skala: 0, 100, 200, 500, 1000\nWas ist falsch an dieser Skala?"
                say: "Die Skala geht so: null, hundert, zweihundert, fünfhundert, tausend. Was ist daran falsch?"
                options: ["Die Schritte sind nicht gleich groß.", "Sie geht bis 1000.", "Sie hat zu wenige Zahlen."]
                answer: "Die Schritte sind nicht gleich groß."
                hints: ["Rechne die Schritte aus: 100, 100, dann?"]
              - id: l2-s2
                type: multiple_choice
                text: "Welche Skala ist ehrlich?"
                say: "Welche Skala ist ehrlich?"
                options: ["0, 50, 100, 200, 400", "0, 50, 100, 150, 200", "0, 10, 50, 100, 150"]
                answer: "0, 50, 100, 150, 200"
                hints: ["Ehrlich: Jeder Schritt ist gleich groß."]
              - id: l2-s3
                type: multiple_choice
                text: "Ein Diagramm zeigt drei Säulen. An der Skala stehen keine Zahlen. Was fehlt?"
                say: "Ein Diagramm zeigt drei Säulen. An der Skala stehen keine Zahlen. Was fehlt?"
                options: ["die Zahlen an der Skala", "eine vierte Säule", "eine andere Farbe"]
                answer: "die Zahlen an der Skala"
                hints: ["Womit liest du ab, wie hoch eine Säule ist?"]
              - id: l2-s4
