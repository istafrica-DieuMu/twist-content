# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.symmetry-environment
skill: math.symmetry.in-environment
curriculum: de-DE
language: de
title:
  de: Symmetrie um uns herum
  en: Symmetry around us
summary: >
  Lesson 1 finds symmetry in nature and in things (Schmetterling, Tanne,
  Tisch von vorn; nicht die Tasse mit Henkel), in flags, and in
  reflections on water, where the Symmetrieachse is the waagerechtes
  Ufer; lesson 2 finds symmetry in words (OTTO und UHU senkrecht, KOCH und
  BOX waagerecht), Spiegelschrift on an ambulance, stars, snowflakes,
  Mandalas and Klecksbilder, and ends with the skill check. Taking photos
  of symmetry around the child or making a picture waits for a camera or
  drawing task.
metadata:
  year: klasse-4
  topic: { de: Symmetrie, en: Symmetry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.symmetry.identify]
  also_practises: [math.symmetry.several-axes]
  vocabulary: { de: [symmetrisch, Symmetrieachse, Spiegelbild, Spiegelung, Spiegelschrift, waagerecht, senkrecht, Mandala] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: reflection-axis-upright
      what: Thinks the Symmetrieachse of a reflection in water runs senkrecht through the object, not waagerecht along the shore
      addressed: lesson 1 Learn puts the axis on the shore; l1-f2, l1-s3, l1-n2, l1-c2 and l2-c2 ask where the axis or the mirror image is, with feedback in l1-f2
    - id: symmetric-letters-make-symmetric-word
      what: Thinks a word is symmetric about a senkrechte axis as soon as all its letters are, without checking that it reads the same backwards (MAMA)
      addressed: lesson 2 Learn says OTTO reads the same from the back; l2-f2 offers MAMA with feedback, l2-s4 asks about MAMA, l2-s3, l2-n4 and l2-c3 offer words of symmetric letters that are not palindromes
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Symmetrie in Natur und Alltag", en: "Symmetry in nature and everyday things" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Ist das M symmetrisch?"
            say: "Falte das M in Gedanken in der Mitte. Ist es symmetrisch?"
            show: { drawn: letter-card, text: "M" }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Buchstabe ist nicht symmetrisch?"
            say: "Welcher Buchstabe ist nicht symmetrisch?"
            options: ["R", "A", "U"]
            answer: "R"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Symmetrie in der Natur"
            say: "In der Natur findest du viel Symmetrie. Der Schmetterling hat links und rechts gleiche Flügel. Auch viele Blätter, Blüten und Gesichter sind symmetrisch."
            show: { object: butterfly }
          - text: "fast genau gleich"
            say: "In der Natur sind die beiden Hälften nie ganz genau gleich. Ein Gesicht ist links und rechts nur fast gleich. Passen die Hälften fast genau aufeinander, nennen wir es trotzdem symmetrisch."
          - text: "Spiegelung im See: Die Achse ist das Ufer."
            say: "Ein Haus am See spiegelt sich im Wasser. Das Spiegelbild liegt unter dem Haus und steht auf dem Kopf. Die Symmetrieachse ist das Ufer. Sie liegt waagerecht."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was ist symmetrisch?"
                say: "Was ist symmetrisch?"
                options:
                  - { object: butterfly }
                  - { object: snail }
                  - { object: cup }
                answer: butterfly
                feedback:
                  cup: "Die Tasse hat den Henkel nur auf einer Seite. Die Hälften passen nicht aufeinander."
                  snail: "Die Schnecke ist von der Seite gezeichnet. Vorn ist der Kopf, hinten das Haus."
                hints:
                  - "Stell dir bei jedem Bild eine Linie durch die Mitte vor."
                  - "Bei welchem Bild sind links und rechts gleich?"
                  - "Der Schmetterling."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ein Baum spiegelt sich im See. Wie liegt die Symmetrieachse?"
                say: "Ein Baum steht am Ufer und spiegelt sich im See. Wie liegt die Symmetrieachse?"
                options: ["waagerecht", "senkrecht", "schräg"]
                answer: "waagerecht"
                feedback:
                  "senkrecht": "Das Spiegelbild liegt im Wasser unter dem Baum und steht auf dem Kopf. Die Achse ist das Ufer, und das liegt waagerecht."
                hints:
                  - "Wo siehst du das Spiegelbild: neben dem Baum oder darunter?"
                  - "Das Spiegelbild ist unter dem Baum. Die Achse liegt dazwischen, am Ufer."
                  - "Waagerecht."
              - id: l1-f3
                type: true_false
                text: "Die Flagge von Deutschland hat eine senkrechte Symmetrieachse."
                say: "Die Flagge von Deutschland hat drei Streifen übereinander: schwarz, rot und gold. Stimmt das? Sie hat eine senkrechte Symmetrieachse."
                answer: true
                hints:
                  - "Falte die Flagge in Gedanken von oben nach unten durch die Mitte."
                  - "Jeder Streifen geht von links nach rechts durch. Links und rechts sind gleich."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: multiple_choice
                text: "Was ist nicht symmetrisch?"
                say: "Was ist nicht symmetrisch?"
                options: ["ein Fußabdruck", "ein Fußballtor von vorn", "eine Brille von vorn"]
                answer: "ein Fußabdruck"
                hints:
                  - "Stell dir bei jedem eine senkrechte Linie durch die Mitte vor."
                  - "Beim Fuß ist der große Zeh nur auf einer Seite."
                  - "Ein Fußabdruck."
              - id: l1-f5
                type: image_multiple_choice
                text: "Was ist symmetrisch?"
                say: "Was ist symmetrisch?"
                options:
                  - { object: fir-tree }
                  - { object: bike }
                  - { object: giraffe }
                answer: fir-tree
                hints:
                  - "Fahrrad und Giraffe sind von der Seite gezeichnet."
                  - "Vorn und hinten sind beim Fahrrad und bei der Giraffe verschieden."
                  - "Die Tanne."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Die Symmetrieachse des Schmetterlings geht senkrecht durch seinen Körper."
                say: "Stimmt das? Die Symmetrieachse des Schmetterlings geht senkrecht durch seinen Körper."
                show: { object: butterfly }
                answer: true
                hints: ["Wo trennt sich der linke Flügel vom rechten?"]
              - id: l1-s2
                type: multiple_choice
                text: "Was ist symmetrisch?"
                say: "Was ist symmetrisch?"
                options: ["ein Blatt vom Baum", "eine Schnecke von der Seite", "die Zahl 2"]
                answer: "ein Blatt vom Baum"
                hints: ["Bei welchem passen zwei Hälften fast genau aufeinander?"]
              - id: l1-s3
                type: multiple_choice
                text: "Ein Haus spiegelt sich in einer Pfütze. Wie sieht das Spiegelbild aus?"
                say: "Ein Haus spiegelt sich in einer Pfütze vor der Tür. Wie sieht das Spiegelbild aus?"
                options: ["Das Haus steht auf dem Kopf.", "Das Haus steht richtig herum.", "Das Haus liegt auf der Seite."]
                answer: "Das Haus steht auf dem Kopf."
                hints: ["Die Achse liegt waagerecht am Rand der Pfütze."]
              - id: l1-s4
                type: true_false
                text: "Die Flagge von Deutschland hat eine waagerechte Symmetrieachse."
                say: "Die Flagge von Deutschland ist oben schwarz, in der Mitte rot und unten gold. Stimmt das? Sie hat eine waagerechte Symmetrieachse."
                answer: false
                hints: ["Welche Farbe ist oben, welche unten?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Was ist nicht symmetrisch?"
                say: "Was ist nicht symmetrisch?"
                options:
                  - { object: trousers }
                  - { object: table }
                  - { object: snail }
                answer: snail
                hints: ["Welches Bild ist von der Seite gezeichnet?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Was ist symmetrisch?"
                say: "Was ist symmetrisch?"
                options:
                  - { object: table }
                  - { object: elephant }
                  - { object: cup }
                answer: table
              - id: l1-n2
                type: multiple_choice
                text: "Ein Berg spiegelt sich im See. Wo liegt die Symmetrieachse?"
                say: "Ein Berg spiegelt sich im See. Wo liegt die Symmetrieachse?"
                options: ["am Ufer, waagerecht", "mitten durch den Berg, senkrecht", "Es gibt keine."]
                answer: "am Ufer, waagerecht"
              - id: l1-n3
                type: true_false
                text: "Ein Gesicht von vorn ist fast genau symmetrisch."
                say: "Stimmt das? Ein Gesicht von vorn ist fast genau symmetrisch."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Was ist nicht symmetrisch?"
                say: "Was ist nicht symmetrisch?"
                options: ["eine Hand", "ein Herz", "ein Fahrrad von vorn"]
                answer: "eine Hand"
              - id: l1-n5
                type: multiple_choice
                text: "Die Flagge von Frankreich hat drei Streifen nebeneinander: blau, weiß, rot. Wie liegt ihre Symmetrieachse?"
                say: "Die Flagge von Frankreich hat drei Streifen nebeneinander: links blau, in der Mitte weiß, rechts rot. Wie liegt ihre Symmetrieachse?"
                options: ["waagerecht", "senkrecht", "Sie hat keine."]
                answer: "waagerecht"
                difficulty: stretch

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was ist symmetrisch?"
            say: "Was ist symmetrisch?"
            options:
              - { object: jumper }
              - { object: giraffe }
              - { object: snail }
            answer: jumper
          - id: l1-c2
            type: multiple_choice
            text: "Ein Schwan spiegelt sich im Teich. Wie liegt die Symmetrieachse?"
            say: "Ein Schwan schwimmt auf dem Teich und spiegelt sich im Wasser. Wie liegt die Symmetrieachse?"
            options: ["waagerecht", "senkrecht", "schräg"]
            answer: "waagerecht"
          - id: l1-c3
            type: true_false
            text: "Eine Tasse mit Henkel ist von der Seite gesehen symmetrisch."
            say: "Stimmt das? Eine Tasse mit Henkel ist von der Seite gesehen symmetrisch."
            answer: false

  - n: 2
    title: { de: "Symmetrie in Schrift und Kunst", en: "Symmetry in writing and art" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was ist symmetrisch?"
            say: "Was ist symmetrisch?"
            options:
              - { object: butterfly }
              - { object: bike }
            answer: butterfly
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ein Haus spiegelt sich im See. Wie liegt die Symmetrieachse?"
            say: "Ein Haus spiegelt sich im See. Wie liegt die Symmetrieachse?"
            options: ["waagerecht", "senkrecht"]
            answer: "waagerecht"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "OTTO: senkrechte Achse"
            say: "Auch Wörter können symmetrisch sein. Bei OTTO ist jeder Buchstabe senkrecht symmetrisch, und das Wort heißt von hinten gelesen genauso. Darum passt eine senkrechte Achse genau durch die Mitte."
            show: { drawn: letter-card, text: "OTTO" }
          - text: "KOCH: waagerechte Achse"
            say: "Bei KOCH hat jeder Buchstabe eine waagerechte Achse. Darum kannst du das ganze Wort waagerecht falten. Oben passt auf unten."
            show: { drawn: letter-card, text: "KOCH" }
          - text: "Spiegelschrift"
            say: "Vorn auf manchen Krankenwagen steht ein Wort in Spiegelschrift. Wer im Auto davor fährt, sieht es im Rückspiegel als Spiegelbild und kann es richtig lesen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Das Wort UHU hat eine senkrechte Symmetrieachse."
                say: "Stimmt das? Das Wort UHU hat eine senkrechte Symmetrieachse."
                show: { drawn: letter-card, text: "UHU" }
                answer: true
                hints:
                  - "Ist jeder Buchstabe senkrecht symmetrisch? Und heißt das Wort von hinten gleich?"
                  - "U, H und U sind senkrecht symmetrisch. Von hinten gelesen heißt es auch UHU."
                  - "Ja, das stimmt."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welches Wort hat eine senkrechte Symmetrieachse?"
                say: "Welches Wort hat eine senkrechte Symmetrieachse?"
                options: ["TOT", "MAMA", "OMA"]
                answer: "TOT"
                option_audio: false
                feedback:
                  "MAMA": "Jeder Buchstabe ist symmetrisch, aber von hinten gelesen heißt es AMAM. Links und rechts passen nicht aufeinander."
                  "OMA": "Von hinten gelesen heißt es AMO. Links und rechts passen nicht aufeinander."
                hints:
                  - "Prüfe zwei Dinge: Ist jeder Buchstabe symmetrisch? Heißt das Wort von hinten gleich?"
                  - "Nur ein Wort heißt von hinten gelesen genauso."
                  - "TOT."
              - id: l2-f3
                type: multiple_choice
                text: "Welches Wort kannst du waagerecht falten, so dass oben auf unten passt?"
                say: "Welches Wort kannst du waagerecht falten, so dass oben auf unten passt?"
                options: ["BOX", "BUS", "HUT"]
                answer: "BOX"
                option_audio: false
                hints:
                  - "Jeder Buchstabe braucht eine waagerechte Achse."
                  - "Beim U ist oben offen und unten rund. Das passt nicht."
                  - "BOX."
              - id: l2-f4
                type: multiple_choice
                text: "Warum steht vorn auf dem Krankenwagen ein Wort in Spiegelschrift?"
                say: "Warum steht vorn auf dem Krankenwagen ein Wort in Spiegelschrift?"
                options: ["damit Autofahrer davor es im Rückspiegel richtig lesen", "weil es so schöner aussieht", "damit nur Ärzte es lesen können"]
                answer: "damit Autofahrer davor es im Rückspiegel richtig lesen"
                hints:
                  - "Was macht ein Spiegel mit Spiegelschrift?"
                  - "Im Spiegel wird das Spiegelbild wieder richtig herum."
                  - "Damit Autofahrer davor es im Rückspiegel richtig lesen."
              - id: l2-f5
                type: multiple_choice
                text: "Wie viele Symmetrieachsen hat der Stern mit fünf Zacken?"
                say: "Wie viele Symmetrieachsen hat der Stern mit fünf Zacken?"
                show: { object: star }
                options: ["5", "2", "10"]
                answer: "5"
                hints:
                  - "Jede Achse geht durch eine Zacke und die Mitte."
                  - "Der Stern hat fünf Zacken. Durch jede geht eine Achse."
                  - "5."
                difficulty: stretch

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Das Wort DECKE hat eine waagerechte Symmetrieachse."
                say: "Stimmt das? Das Wort DECKE hat eine waagerechte Symmetrieachse."
                show: { drawn: letter-card, text: "DECKE" }
                answer: true
                hints: ["Hat jeder Buchstabe eine waagerechte Achse?"]
              - id: l2-s2
                type: multiple_choice
                text: "Eine Schneeflocke hat sechs gleiche Zacken. Wie viele Symmetrieachsen hat sie?"
                say: "Eine Schneeflocke hat sechs gleiche Zacken. Wie viele Symmetrieachsen hat sie?"
                options: ["6", "3", "2"]
                answer: "6"
                hints: ["Denk an das Sechseck mit gleich langen Seiten."]
              - id: l2-s3
                type: multiple_choice
                text: "Welches Wort hat eine senkrechte Symmetrieachse?"
                say: "Welches Wort hat eine senkrechte Symmetrieachse?"
                options: ["AHA", "OMA", "HAT"]
                answer: "AHA"
                option_audio: false
                hints: ["Lies jedes Wort auch von hinten."]
              - id: l2-s4
                type: true_false
                text: "Das Wort MAMA hat eine senkrechte Symmetrieachse."
                say: "Stimmt das? Das Wort MAMA hat eine senkrechte Symmetrieachse."
                show: { drawn: letter-card, text: "MAMA" }
                answer: false
                hints: ["Lies das Wort von hinten."]
              - id: l2-s5
                type: multiple_choice
                text: "Ein Mandala ist ein rundes Bild aus vielen gleichen Teilen. Was hat es meistens?"
                say: "Ein Mandala ist ein rundes Bild aus vielen gleichen Teilen. Was hat es meistens?"
                options: ["viele Symmetrieachsen", "keine Symmetrieachse", "genau eine Symmetrieachse"]
                answer: "viele Symmetrieachsen"
                hints: ["Die gleichen Teile wiederholen sich rundherum."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welches Wort kannst du waagerecht falten, so dass oben auf unten passt?"
                say: "Welches Wort kannst du waagerecht falten, so dass oben auf unten passt?"
                options: ["ECHO", "OMA", "TEE"]
                answer: "ECHO"
                option_audio: false
              - id: l2-n2
                type: true_false
                text: "Das Wort OXO hat zwei Symmetrieachsen."
                say: "Stimmt das? Das Wort OXO hat zwei Symmetrieachsen, eine senkrechte und eine waagerechte."
                show: { drawn: letter-card, text: "OXO" }
                answer: true
                difficulty: stretch
              - id: l2-n3
                type: multiple_choice
                text: "Lena tropft Farbe auf eine Hälfte eines Blattes, faltet es und drückt es zusammen. Was entsteht?"
                say: "Lena tropft Farbe auf eine Hälfte eines Blattes. Dann faltet sie es und drückt es fest zusammen. Was entsteht?"
                options: ["ein symmetrisches Klecksbild", "ein Bild ohne Symmetrie", "zwei ganz verschiedene Hälften"]
                answer: "ein symmetrisches Klecksbild"
              - id: l2-n4
                type: multiple_choice
                text: "Welches Wort hat eine senkrechte Symmetrieachse?"
                say: "Welches Wort hat eine senkrechte Symmetrieachse?"
                options: ["OTTO", "ANNA", "EMMA"]
                answer: "OTTO"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Jede Symmetrieachse des Sterns geht durch eine Zacke und durch die Mitte."
                say: "Stimmt das? Jede Symmetrieachse des Sterns geht durch eine Zacke und durch die Mitte."
                show: { object: star }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Was ist nicht symmetrisch?"
            say: "Was ist nicht symmetrisch?"
            options:
              - { object: butterfly }
              - { object: fir-tree }
              - { object: giraffe }
            answer: giraffe
          - id: l2-c2
            type: multiple_choice
            text: "Ein Baum steht am Fluss und spiegelt sich im Wasser. Wo ist sein Spiegelbild?"
            say: "Ein Baum steht am Fluss und spiegelt sich im Wasser. Wo ist sein Spiegelbild?"
            options: ["unter dem Ufer, auf dem Kopf", "neben dem Baum, richtig herum", "über dem Baum, auf dem Kopf"]
            answer: "unter dem Ufer, auf dem Kopf"
          - id: l2-c3
            type: multiple_choice
            text: "Welches Wort hat eine senkrechte Symmetrieachse?"
            say: "Welches Wort hat eine senkrechte Symmetrieachse?"
            options: ["TAT", "TAL", "MAX"]
            answer: "TAT"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Welches Wort kannst du waagerecht falten, so dass oben auf unten passt?"
            say: "Bei welchem Wort passt oben auf unten, wenn du es waagerecht faltest?"
            options: ["DICK", "DACH", "DOSE"]
            answer: "DICK"
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Was hat mehr Symmetrieachsen?"
            say: "Was hat mehr Symmetrieachsen: eine Schneeflocke mit sechs gleichen Zacken oder ein Schmetterling?"
            options: ["die Schneeflocke", "der Schmetterling", "beide gleich viele"]
            answer: "die Schneeflocke"
