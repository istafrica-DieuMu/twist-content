# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.fractions-measures
skill: math.fractions.everyday-measures
curriculum: de-DE
language: de
title:
  de: Brüche bei Größen
  en: Fractions of measures
summary: >
  Lesson 1 turns halbe, Viertel- and Dreiviertelstunden into minutes and
  halbe, Viertel- and Dreiviertelmeter into centimetres: first the whole in
  the smaller unit (1 h = 60 min, 1 m = 100 cm), then divide by 4 for a
  quarter and take three of them for three quarters, with a pie and a bar
  as the model; lesson 2 does the same for Liter and Kilogramm (Viertelliter,
  Pfund, Dreiviertelkilo), adds anderthalb, and ends with the skill check.
  Each unit keeps its own whole, so ½ h is 30 min and not 50.
metadata:
  year: klasse-4
  topic: { de: Brüche, en: Fractions }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.fractions.halves-quarters, math.time.quarter-hours, math.length.cm-m]
  also_practises: [math.time.quarter-hours, math.mass-capacity.l-ml, math.mass-capacity.g-kg]
  vocabulary: { de: [halbe Stunde, Viertelstunde, Dreiviertelstunde, halber Meter, Viertelliter, Dreiviertelliter, Pfund, Viertelkilo, Dreiviertelkilo, anderthalb] }
  forms: [text, audio, drawn]
  drawn: [fraction, clock]
  facets: []
  misconceptions:
    - id: denominator-as-amount
      what: Takes the number under the fraction line as the amount (¼ h = 4 min, ½ m = 2 cm, ¼ l = 4 ml)
      addressed: lesson 1 Learn divides the whole by 4; l1-f2 and l1-f3 (with feedback), l1-c3, l2-s2 (with feedback) and l2-w2 offer the Nenner as the amount
    - id: one-whole-for-all
      what: Uses 100 as the whole for every unit, so ½ h becomes 50 min, ¼ h 25 min and ½ l 50 ml
      addressed: lesson 1 Learn screen 3 sets 1 h = 60 min against 1 m = 100 cm; l1-f1, l1-f2, l1-s4, l2-f1, l2-f2 and l2-f4 have feedback on it, l1-s3 and l2-c5 ask it as true or false
    - id: three-quarters
      what: Reads ¾ as one quarter or as 3 and 4 written side by side (¾ kg = 340 g)
      addressed: lesson 1 Learn and lesson 2 Learn build ¾ as three quarters; l1-f4, l2-f3 and l2-f4 (with feedback) take three quarters step by step, l2-n2 offers 340 g, l2-c4 compares ¾ kg with 800 g
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Stunden und Meter", en: "Hours and metres" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 4, minute: 15 }
            options: ["Viertel nach 4", "Viertel vor 4", "halb 5"]
            answer: "Viertel nach 4"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "1 m = _ cm"
            say: "Ein Meter sind wie viele Zentimeter?"
            answer: "100"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 h = 60 min\n½ h = 30 min\n¼ h = 15 min\n¾ h = 45 min"
            say: "Eine Stunde hat sechzig Minuten. Eine halbe Stunde ist die Hälfte davon: dreißig Minuten. Für eine Viertelstunde teilst du durch vier: sechzig geteilt durch vier sind fünfzehn Minuten. Eine Dreiviertelstunde sind drei Viertelstunden: fünfzehn und fünfzehn und fünfzehn, also fünfundvierzig Minuten."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
          - text: "1 m = 100 cm\n½ m = 50 cm\n¼ m = 25 cm\n¾ m = 75 cm"
            say: "Ein Meter hat hundert Zentimeter. Ein halber Meter sind fünfzig Zentimeter. Ein Viertelmeter ist hundert geteilt durch vier: fünfundzwanzig Zentimeter. Drei Viertel Meter sind dreimal fünfundzwanzig, also fünfundsiebzig Zentimeter."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 1 }
          - text: "Jede Größe hat ihr eigenes Ganzes.\n1 h = 60 min, also ½ h = 30 min\n1 m = 100 cm, also ½ m = 50 cm"
            say: "Pass auf: Jede Größe hat ihr eigenes Ganzes. Eine Stunde hat sechzig Minuten, ein Meter hundert Zentimeter. Darum ist eine halbe Stunde dreißig Minuten, ein halber Meter aber fünfzig Zentimeter. Frag dich immer zuerst: Wie viel ist das Ganze?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "½ h = ?"
                say: "Wie viele Minuten sind eine halbe Stunde?"
                options: ["30 min", "50 min", "20 min"]
                answer: "30 min"
                feedback:
                  "50 min": "50 ist die Hälfte von 100. Eine Stunde hat aber 60 Minuten."
                hints:
                  - "Wie viele Minuten hat eine ganze Stunde?"
                  - "Eine Stunde hat 60 Minuten. Du brauchst die Hälfte davon."
                  - "Die Hälfte von 60 ist 30."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "¼ h = ?"
                say: "Wie viele Minuten sind eine Viertelstunde?"
                options: ["15 min", "25 min", "4 min"]
                answer: "15 min"
                feedback:
                  "25 min": "25 ist ein Viertel von 100. Eine Stunde hat aber 60 Minuten."
                  "4 min": "Ein Viertel heißt: durch 4 teilen. Rechne 60 : 4."
                hints:
                  - "Ein Viertel heißt: Teile das Ganze in 4 gleich große Teile."
                  - "Eine Stunde hat 60 Minuten. Rechne 60 : 4."
                  - "60 : 4 = 15."
              - id: l1-f3
                type: multiple_choice
                text: "Der ganze Streifen ist 1 m lang. Wie lang ist der rote Teil?"
                say: "Der ganze Streifen ist einen Meter lang. Wie lang ist der rote Teil?"
                show: { drawn: fraction, kind: bar, parts: 2, shaded: 1 }
                options: ["50 cm", "2 cm", "20 cm"]
                answer: "50 cm"
                feedback:
                  "2 cm": "Der Streifen ist in 2 Teile geteilt. Ein Teil ist aber viel länger als 2 cm."
                hints:
                  - "Der Streifen ist in 2 gleich große Teile geteilt. Rot ist die Hälfte."
                  - "1 m sind 100 cm. Wie viel ist die Hälfte davon?"
                  - "Die Hälfte von 100 cm sind 50 cm."
              - id: l1-f4
                type: text_input
                text: "¾ h = _ min"
                say: "Wie viele Minuten sind eine Dreiviertelstunde?"
                answer: "45"
                hints:
                  - "Rechne zuerst eine Viertelstunde aus."
                  - "Eine Viertelstunde sind 15 Minuten. Du brauchst drei davon."
                  - "15 + 15 + 15 = 45."
              - id: l1-f5
                type: text_input
                text: "¼ m = _ cm"
                say: "Wie viele Zentimeter sind ein Viertelmeter?"
                answer: "25"
                hints:
                  - "Ein Meter hat 100 Zentimeter."
                  - "Ein Viertel heißt: durch 4 teilen. Rechne 100 : 4."
                  - "100 : 4 = 25."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "¾ m = _ cm"
                say: "Wie viele Zentimeter sind drei Viertel Meter?"
                answer: "75"
                hints: ["Ein Viertelmeter sind 25 cm. Du brauchst drei davon."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Es ist 3 Uhr. Wie spät ist es eine Dreiviertelstunde später?"
                say: "Es ist drei Uhr. Wie spät ist es eine Dreiviertelstunde später?"
                show: { drawn: clock, hour: 3, minute: 0 }
                options:
                  - { drawn: clock, hour: 3, minute: 45 }
                  - { drawn: clock, hour: 3, minute: 30 }
                  - { drawn: clock, hour: 3, minute: 15 }
                answer: "3:45"
                hints: ["Eine Dreiviertelstunde sind 45 Minuten. Der große Zeiger läuft bis zur 9."]
              - id: l1-s3
                type: true_false
                text: "Eine halbe Stunde hat 50 Minuten."
                say: "Stimmt das? Eine halbe Stunde hat fünfzig Minuten."
                answer: false
                hints: ["Eine ganze Stunde hat 60 Minuten, nicht 100."]
              - id: l1-s4
                type: multiple_choice
                text: "Der ganze Kreis steht für 1 Stunde. Wie viele Minuten zeigt der rote Teil?"
                say: "Der ganze Kreis steht für eine Stunde. Wie viele Minuten zeigt der rote Teil?"
                show: { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
                options: ["45 min", "30 min", "75 min"]
                answer: "45 min"
                feedback:
                  "75 min": "75 cm wären drei Viertel Meter. Eine Stunde hat aber nur 60 Minuten."
                hints: ["Jedes Viertel ist eine Viertelstunde, also 15 Minuten."]
              - id: l1-s5
                type: multiple_choice
                text: "Was ist länger: ¾ m oder 70 cm?"
                say: "Was ist länger: drei Viertel Meter oder siebzig Zentimeter?"
                options: ["¾ m", "70 cm", "beide gleich lang"]
                answer: "¾ m"
                keep_order: true
                option_audio: false
                hints: ["Rechne ¾ m in Zentimeter um."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: text_input
                text: "Das Fußballtraining dauert eine halbe Stunde. Wie viele Minuten sind das?"
                say: "Das Fußballtraining dauert eine halbe Stunde. Wie viele Minuten sind das?"
                answer: "30"
              - id: l1-n2
                type: multiple_choice
                text: "Lina fährt um 14:00 Uhr mit dem Rad los. Sie fährt eine Dreiviertelstunde zu Oma. Wann kommt sie an?"
                say: "Lina fährt um vierzehn Uhr mit dem Rad los. Sie fährt eine Dreiviertelstunde zu Oma. Wann kommt sie an?"
                options: ["14:45 Uhr", "14:30 Uhr", "15:15 Uhr"]
                answer: "14:45 Uhr"
              - id: l1-n3
                type: text_input
                text: "Ein Regalbrett ist ¼ m breit. Wie viele Zentimeter sind das?"
                say: "Ein Regalbrett ist einen Viertelmeter breit. Wie viele Zentimeter sind das?"
                answer: "25"
              - id: l1-n4
                type: true_false
                text: "Ole sagt: „Eine Viertelstunde ist länger als 20 Minuten.“"
                say: "Ole sagt: Eine Viertelstunde ist länger als zwanzig Minuten. Hat Ole recht?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "Mia übt eine Dreiviertelstunde Klavier. Jonas übt eine halbe Stunde. Wie viele Minuten übt Mia länger?"
                say: "Mia übt eine Dreiviertelstunde Klavier. Jonas übt eine halbe Stunde. Wie viele Minuten übt Mia länger?"
                answer: "15"
                difficulty: stretch

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "½ h = _ min"
            say: "Wie viele Minuten sind eine halbe Stunde?"
            answer: "30"
          - id: l1-c2
            type: text_input
            text: "½ m = _ cm"
            say: "Wie viele Zentimeter sind ein halber Meter?"
            answer: "50"
          - id: l1-c3
            type: multiple_choice
            text: "¼ h = ?"
            say: "Wie viele Minuten sind eine Viertelstunde?"
            options: ["15 min", "25 min", "4 min"]
            answer: "15 min"

  - n: 2
    title: { de: "Liter und Kilogramm", en: "Litres and kilograms" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "¾ h = _ min"
            say: "Wie viele Minuten sind eine Dreiviertelstunde?"
            answer: "45"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "¼ m = ?"
            say: "Wie viele Zentimeter sind ein Viertelmeter?"
            options: ["25 cm", "4 cm", "40 cm"]
            answer: "25 cm"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 l = 1000 ml\n½ l = 500 ml\n¼ l = 250 ml\n¾ l = 750 ml"
            say: "Ein Liter hat tausend Milliliter. Ein halber Liter sind fünfhundert Milliliter. Für einen Viertelliter teilst du tausend durch vier: zweihundertfünfzig Milliliter. Ein Dreiviertelliter sind drei Viertelliter, also siebenhundertfünfzig Milliliter."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 1, colour: blue }
          - text: "1 kg = 1000 g\n½ kg = 500 g (ein Pfund)\n¼ kg = 250 g\n¾ kg = 750 g"
            say: "Beim Kilogramm geht es genauso. Ein Kilogramm hat tausend Gramm. Ein halbes Kilo sind fünfhundert Gramm, das nennt man auch ein Pfund. Ein Viertelkilo sind zweihundertfünfzig Gramm, ein Dreiviertelkilo siebenhundertfünfzig Gramm."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 3, colour: green }
          - text: "1 ½ h = 60 min + 30 min = 90 min\n1 ½ l = 1000 ml + 500 ml = 1500 ml"
            say: "Anderthalb Stunden sind eine ganze und eine halbe Stunde: sechzig plus dreißig, also neunzig Minuten. Anderthalb Liter sind tausend plus fünfhundert, also tausendfünfhundert Milliliter."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "½ l = ?"
                say: "Wie viele Milliliter sind ein halber Liter?"
                options: ["500 ml", "50 ml", "200 ml"]
                answer: "500 ml"
                feedback:
                  "50 ml": "50 ist die Hälfte von 100. Ein Liter hat aber 1000 ml."
                hints:
                  - "Wie viele Milliliter hat ein ganzer Liter?"
                  - "Ein Liter hat 1000 ml. Du brauchst die Hälfte davon."
                  - "Die Hälfte von 1000 ist 500."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "¼ kg = ?"
                say: "Wie viele Gramm sind ein Viertelkilo?"
                options: ["250 g", "25 g", "400 g"]
                answer: "250 g"
                feedback:
                  "25 g": "25 ist ein Viertel von 100. Ein Kilogramm hat aber 1000 g."
                hints:
                  - "Ein Kilogramm hat 1000 g."
                  - "Ein Viertel heißt: durch 4 teilen. Rechne 1000 : 4."
                  - "Die Hälfte von 1000 ist 500, die Hälfte von 500 ist 250."
              - id: l2-f3
                type: text_input
                text: "¾ l = _ ml"
                say: "Wie viele Milliliter sind ein Dreiviertelliter?"
                answer: "750"
                hints:
                  - "Rechne zuerst einen Viertelliter aus."
                  - "Ein Viertelliter sind 250 ml. Du brauchst drei davon."
                  - "250 + 250 + 250 = 750."
              - id: l2-f4
                type: multiple_choice
                text: "Der ganze Streifen steht für 1 kg. Wie viele Gramm zeigt der grüne Teil?"
                say: "Der ganze Streifen steht für ein Kilogramm. Wie viele Gramm zeigt der grüne Teil?"
                show: { drawn: fraction, kind: bar, parts: 4, shaded: 3, colour: green }
                options: ["750 g", "300 g", "75 g"]
                answer: "750 g"
                feedback:
                  "75 g": "75 wäre richtig beim Meter mit 100 cm. Ein Kilogramm hat aber 1000 g."
                  "300 g": "3 Teile sind grün. Jeder Teil ist aber 250 g schwer."
                hints:
                  - "Der Streifen hat 4 gleich große Teile. Wie schwer ist ein Teil?"
                  - "Ein Teil ist ein Viertelkilo: 250 g. Grün sind 3 Teile."
                  - "250 g + 250 g + 250 g = 750 g."
              - id: l2-f5
                type: text_input
                text: "1 ½ h = _ min"
                say: "Wie viele Minuten sind anderthalb Stunden?"
                answer: "90"
                hints:
                  - "Anderthalb Stunden sind eine ganze und eine halbe Stunde."
                  - "Eine Stunde hat 60 Minuten, eine halbe Stunde 30."
                  - "60 + 30 = 90."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "½ kg = _ g"
                say: "Wie viele Gramm sind ein halbes Kilogramm?"
                answer: "500"
                hints: ["Ein Kilogramm hat 1000 g. Nimm die Hälfte."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie viel ist ein Viertelliter?"
                say: "Wie viel ist ein Viertelliter?"
                options: ["250 ml", "25 ml", "4 ml"]
                answer: "250 ml"
                feedback:
                  "4 ml": "Viertel heißt: durch 4 teilen. Rechne 1000 ml : 4."
                hints: ["Ein Liter hat 1000 ml. Rechne 1000 : 4."]
              - id: l2-s3
                type: true_false
                text: "¾ kg ist mehr als 700 g."
                say: "Stimmt das? Ein Dreiviertelkilo ist mehr als siebenhundert Gramm."
                answer: true
                hints: ["Ein Dreiviertelkilo sind 750 g."]
              - id: l2-s4
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jeden Bruch mit der gleichen Größe in der kleineren Einheit."
                pairs:
                  - { left: { text: "½ h" }, right: { text: "30 min" } }
                  - { left: { text: "¼ m" }, right: { text: "25 cm" } }
                  - { left: { text: "¾ l" }, right: { text: "750 ml" } }
                  - { left: { text: "¼ kg" }, right: { text: "250 g" } }
                option_audio: false
                hints: ["Frag dich bei jeder Größe zuerst: Wie viel ist das Ganze?"]
              - id: l2-s5
                type: multiple_choice
                text: "Was ist schwerer: ½ kg oder 400 g?"
                say: "Was ist schwerer: ein halbes Kilogramm oder vierhundert Gramm?"
                options: ["½ kg", "400 g", "beide gleich schwer"]
                answer: "½ kg"
                keep_order: true
                option_audio: false
                hints: ["Ein halbes Kilogramm sind 500 g."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "Für einen Kuchen braucht Paula ¼ l Milch. Wie viele Milliliter sind das?"
                say: "Für einen Kuchen braucht Paula einen Viertelliter Milch. Wie viele Milliliter sind das?"
                answer: "250"
              - id: l2-n2
                type: multiple_choice
                text: "Herr Yilmaz kauft ein Dreiviertelkilo Kirschen. Wie viel Gramm sind das?"
                say: "Herr Yilmaz kauft ein Dreiviertelkilo Kirschen. Wie viel Gramm sind das?"
                options: ["750 g", "340 g", "75 g"]
                answer: "750 g"
              - id: l2-n3
                type: text_input
                text: "In einer Flasche sind 1 ½ l Saft. Wie viele Milliliter sind das?"
                say: "In einer Flasche sind anderthalb Liter Saft. Wie viele Milliliter sind das?"
                answer: "1500"
              - id: l2-n4
                type: true_false
                text: "Emil trinkt zwei Gläser mit je ¼ l Wasser. Er hat ½ l getrunken."
                say: "Emil trinkt zwei Gläser mit je einem Viertelliter Wasser. Stimmt das? Er hat einen halben Liter getrunken."
                answer: true
              - id: l2-n5
                type: text_input
                text: "Ein Film dauert 1 ¾ h. Wie viele Minuten sind das?"
                say: "Ein Film dauert eindreiviertel Stunden. Wie viele Minuten sind das?"
                answer: "105"
                difficulty: stretch

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Der Bus fährt um 9 Uhr los. Die Fahrt zum Zoo dauert eine Dreiviertelstunde. Wann kommt der Bus an?"
            say: "Der Bus fährt um neun Uhr los. Die Fahrt zum Zoo dauert eine Dreiviertelstunde. Wann kommt der Bus an?"
            show: { drawn: clock, hour: 9, minute: 0 }
            options:
              - { drawn: clock, hour: 9, minute: 45 }
              - { drawn: clock, hour: 9, minute: 30 }
              - { drawn: clock, hour: 10, minute: 15 }
            answer: "9:45"
          - id: l2-c2
            type: text_input
            text: "Ein Geschenkband ist ½ m lang. Wie viele Zentimeter sind das?"
            say: "Ein Geschenkband ist einen halben Meter lang. Wie viele Zentimeter sind das?"
            answer: "50"
          - id: l2-c3
            type: text_input
            text: "¼ l = _ ml"
            say: "Wie viele Milliliter sind ein Viertelliter?"
            answer: "250"
          - id: l2-c4
            type: multiple_choice
            text: "Was ist schwerer: ¾ kg oder 800 g?"
            say: "Was ist schwerer: ein Dreiviertelkilo oder achthundert Gramm?"
            options: ["¾ kg", "800 g", "beide gleich schwer"]
            answer: "800 g"
            keep_order: true
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Eine Viertelstunde ist so lang wie 25 Minuten."
            say: "Stimmt das? Eine Viertelstunde ist so lang wie fünfundzwanzig Minuten."
            answer: false
