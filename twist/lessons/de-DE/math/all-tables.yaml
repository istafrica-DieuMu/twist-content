# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.all-tables
skill: math.mult-div.all-tables
curriculum: de-DE
language: de
title:
  de: Das kleine Einmaleins gemischt
  en: All the times tables, mixed
summary: >
  All facts of the kleines Einmaleins in mixed order. Lesson 1 picks a
  way for each fact (from fünf mal, from zehn mal, by doubling, by
  swapping); lesson 2 finds the facts behind a number, drills the facts
  children find hardest (6 · 7, 6 · 8, 7 · 8) and missing factors, and
  ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Einmaleins, en: Times tables }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.table-2-4-8, math.mult-div.table-5-10, math.mult-div.table-3-6-9, math.mult-div.table-7]
  also_practises: [math.mult-div.derive-facts, math.mult-div.commutative]
  vocabulary: { de: [Malaufgabe, Tauschaufgabe, Ergebnis, Einmaleins] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: add-one-not-factor
      what: Going on from a known fact, adds 1 instead of the other factor (8 · 6 = 8 · 5 + 1)
      addressed: l1-f1 offers "8 · 5 + 1" with feedback, l1-s1 offers "10 · 7 − 1" with feedback, l1-n1 offers "4 · 10 − 1", l1-n2 has 1 as a chip, l1-c2 offers "5 · 7 + 1", and l2-w2 offers "6 · 10 − 1" with feedback
    - id: hard-facts
      what: Gets the facts with no quick way wrong (6 · 7, 6 · 8, 7 · 8, 6 · 9)
      addressed: lesson 2 Learn names 6 · 7, 7 · 8 and 6 · 8; they come in every stage of lesson 2 (f2, f4, s3, n1, n4) and in the skill check
    - id: swap-changes-result
      what: Thinks a Tauschaufgabe has a different result
      addressed: l1-f5, l1-s5, l1-n5, l2-w1 and l2-c1 fill a fact and its Tauschaufgabe with the same chip
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Jede Aufgabe hat einen Weg", en: "A way for every fact" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Zähle in der Achterreihe. Welche Zahl fehlt?"
            frame: "40, 48, _, 64"
            options: ["56", "54", "58"]
            answer: ["56"]
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "5 · 7 = _"
            say: "Fünf mal sieben."
            answer: "35"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "6 · 8 = 5 · 8 + 8 = 48"
            say: "Für jede Malaufgabe gibt es einen Weg. Bei sechs mal acht hilft fünf mal acht: vierzig plus acht ist achtundvierzig."
          - text: "9 · 6 = 10 · 6 − 6 = 54"
            say: "Bei neun mal sechs hilft zehn mal sechs: sechzig minus sechs ist vierundfünfzig."
          - text: "4 · 7 = 2 · 7 + 2 · 7 = 28"
            say: "Bei vier mal sieben hilft das Verdoppeln: Zwei mal sieben ist vierzehn, das Doppelte ist achtundzwanzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "8 · 6: Welcher Weg hilft?"
                say: "Acht mal sechs. Welcher Weg hilft dir?"
                options: ["5 · 6 + 3 · 6", "8 + 6", "8 · 5 + 1"]
                answer: "5 · 6 + 3 · 6"
                feedback:
                  "8 + 6": "Das ist eine Plusaufgabe. Hier rechnest du mal."
                  "8 · 5 + 1": "Acht mal sechs ist acht mal fünf und noch eine Acht, nicht nur eins."
                hints:
                  - "Zerlege die Acht in fünf und drei."
                  - "Fünf mal sechs und drei mal sechs."
                  - "5 · 6 + 3 · 6."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fünf mal acht hilft."
                say: "Sieben mal acht. Fünf mal acht ist vierzig. Wie viel kommt dazu?"
                frame: "7 · 8 = 40 + _ = _"
                options: ["16", "8", "56", "48"]
                answer: ["16", "56"]
                hints:
                  - "Zerlege die Sieben in fünf und zwei."
                  - "Fünf mal acht ist vierzig. Zwei mal acht ist sechzehn."
                  - "16 und 56."
              - id: l1-f3
                type: text_input
                text: "4 · 8 = _"
                say: "Vier mal acht."
                answer: "32"
                hints:
                  - "Verdopple zwei mal acht."
                  - "Zwei mal acht ist sechzehn. Sechzehn plus sechzehn."
                  - "32."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 6 · 9 = 56"
                say: "Sechs mal neun ist sechsundfünfzig. Stimmt das?"
                answer: false
                hints:
                  - "Zehn mal sechs ist sechzig."
                  - "Sechzig minus sechs."
                  - "Nein. 6 · 9 = 54."
              - id: l1-f5
                type: fill_in_blank
                text: "Rechne beide Aufgaben."
                say: "Rechne drei mal sieben und sieben mal drei."
                frame: "3 · 7 = _ | 7 · 3 = _"
                options: ["21", "24", "18"]
                answer: ["21", "21"]
                hints:
                  - "Tauschaufgaben haben das gleiche Ergebnis."
                  - "Drei mal sieben ist einundzwanzig."
                  - "21 und 21."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "9 · 7: Welcher Weg hilft?"
                say: "Neun mal sieben. Welcher Weg hilft dir?"
                options: ["10 · 7 − 7", "10 · 7 − 1", "9 + 7"]
                answer: "10 · 7 − 7"
                feedback:
                  "10 · 7 − 1": "Neun mal sieben ist eine Sieben weniger als zehn mal sieben, nicht eins weniger."
                hints: ["Neun ist eins weniger als zehn."]
              - id: l1-s2
                type: text_input
                text: "8 · 4 = _"
                say: "Acht mal vier."
                answer: "32"
                hints: ["Verdopple vier mal vier."]
              - id: l1-s3
                type: fill_in_blank
                text: "Fünf mal sechs hilft."
                say: "Sieben mal sechs. Fünf mal sechs ist dreißig. Wie viel kommt dazu?"
                frame: "7 · 6 = 30 + _ = _"
                options: ["12", "6", "42", "36"]
                answer: ["12", "42"]
                hints: ["Sieben mal sechs ist fünf mal sechs und zwei mal sechs."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 9 · 9 = 81"
                say: "Neun mal neun ist einundachtzig. Stimmt das?"
                answer: true
                hints: ["Zehn mal neun, dann eine Neun weg."]
              - id: l1-s5
                type: fill_in_blank
                text: "Rechne beide Aufgaben."
                say: "Rechne neun mal drei und drei mal neun."
                frame: "9 · 3 = _ | 3 · 9 = _"
                options: ["27", "24", "30"]
                answer: ["27", "27"]
                hints: ["Tauschaufgaben haben das gleiche Ergebnis."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "4 · 9: Welcher Weg hilft?"
                say: "Vier mal neun. Welcher Weg hilft dir?"
                options: ["2 · 9 + 2 · 9", "4 + 9", "4 · 10 − 1"]
                answer: "2 · 9 + 2 · 9"
              - id: l1-n2
                type: fill_in_blank
                text: "Zehn mal acht hilft."
                say: "Neun mal acht. Zehn mal acht ist achtzig. Wie viel nimmst du weg?"
                frame: "9 · 8 = 80 − _ = _"
                options: ["8", "1", "72", "79"]
                answer: ["8", "72"]
              - id: l1-n3
                type: text_input
                text: "3 · 6 = _"
                say: "Drei mal sechs."
                answer: "18"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 7 · 4 = 24"
                say: "Sieben mal vier ist vierundzwanzig. Stimmt das?"
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Rechne beide Aufgaben."
                say: "Rechne acht mal sieben und sieben mal acht."
                frame: "8 · 7 = _ | 7 · 8 = _"
                options: ["56", "54", "63"]
                answer: ["56", "56"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "In einer Packung sind 6 Eier. Wie viele Eier sind in 4 Packungen?"
            say: "In einer Packung sind sechs Eier. Wie viele Eier sind in vier Packungen?"
            answer: "24"
          - id: l1-c2
            type: multiple_choice
            text: "6 · 7: Welcher Weg hilft?"
            say: "Sechs mal sieben. Welcher Weg hilft dir?"
            options: ["5 · 7 + 7", "5 · 7 + 1", "6 + 7"]
            answer: "5 · 7 + 7"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 4 · 6 = 26"
            say: "Vier mal sechs ist sechsundzwanzig. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Schnell und sicher", en: "Quick and sure" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Rechne beide Aufgaben."
            say: "Rechne vier mal neun und neun mal vier."
            frame: "4 · 9 = _ | 9 · 4 = _"
            options: ["36", "32", "45"]
            answer: ["36", "36"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "6 · 9: Welcher Weg hilft?"
            say: "Sechs mal neun. Welcher Weg hilft dir?"
            options: ["6 · 10 − 6", "6 · 10 − 1", "6 + 9"]
            answer: "6 · 10 − 6"
            feedback:
              "6 · 10 − 1": "Sechs mal neun ist eine Sechs weniger als sechs mal zehn, nicht eins weniger."
              "6 + 9": "Das ist eine Plusaufgabe. Hier rechnest du mal."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "24 = 3 · 8 = 4 · 6 = 6 · 4 = 8 · 3"
            say: "Manche Zahlen stehen in mehreren Reihen. Vierundzwanzig ist drei mal acht und vier mal sechs. Mit den Tauschaufgaben sind es vier Malaufgaben."
          - text: "6 · 7 = 42 | 7 · 8 = 56 | 6 · 8 = 48"
            say: "Diese drei Aufgaben sind für viele Kinder schwierig. Sechs mal sieben ist zweiundvierzig, sieben mal acht ist sechsundfünfzig, sechs mal acht ist achtundvierzig. Übe sie besonders gut."
          - text: "_ · 7 = 35"
            say: "Manchmal fehlt eine Zahl in der Malaufgabe. Wie oft passt die Sieben in fünfunddreißig? Fünf mal. Also fünf mal sieben ist fünfunddreißig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Malaufgabe hat das Ergebnis 24?"
                say: "Welche Malaufgabe hat das Ergebnis vierundzwanzig?"
                options: ["4 · 6", "4 · 7", "5 · 5"]
                answer: "4 · 6"
                hints:
                  - "Rechne jede Aufgabe aus."
                  - "Vier mal sechs."
                  - "4 · 6 = 24."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Malaufgabe mit ihrem Ergebnis."
                pairs:
                  - { left: { text: "6 · 7" }, right: { text: "42" } }
                  - { left: { text: "7 · 8" }, right: { text: "56" } }
                  - { left: { text: "6 · 8" }, right: { text: "48" } }
                  - { left: { text: "4 · 9" }, right: { text: "36" } }
                hints:
                  - "Rechne jede Aufgabe aus."
                  - "Denk an fünf, sechs, sieben, acht."
                  - "42, 56, 48 und 36."
              - id: l2-f3
                type: text_input
                text: "Ein Käfer hat 6 Beine. Wie viele Beine haben 9 Käfer?"
                say: "Ein Käfer hat sechs Beine. Wie viele Beine haben neun Käfer?"
                answer: "54"
                hints:
                  - "Rechne neun mal sechs. Zehn mal sechs hilft."
                  - "Zehn mal sechs ist sechzig. Nimm eine Sechs weg."
                  - "54."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 6 · 8 = 46"
                say: "Sechs mal acht ist sechsundvierzig. Stimmt das?"
                answer: false
                hints:
                  - "Fünf mal acht ist vierzig."
                  - "Dazu kommt noch eine Acht."
                  - "Nein. 6 · 8 = 48."
              - id: l2-f5
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Welche Zahl fehlt in der Malaufgabe?"
                frame: "_ · 9 = 27"
                options: ["3", "4", "2"]
                answer: ["3"]
                hints:
                  - "Wie oft passt die Neun in siebenundzwanzig?"
                  - "Zähle in Neunerschritten: neun, achtzehn, siebenundzwanzig."
                  - "3."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Malaufgabe hat das Ergebnis 36?"
                say: "Welche Malaufgabe hat das Ergebnis sechsunddreißig?"
                options: ["4 · 8", "6 · 6", "5 · 7"]
                answer: "6 · 6"
                hints: ["Rechne jede Aufgabe aus."]
              - id: l2-s2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Malaufgabe mit ihrem Ergebnis."
                pairs:
                  - { left: { text: "3 · 9" }, right: { text: "27" } }
                  - { left: { text: "8 · 4" }, right: { text: "32" } }
                  - { left: { text: "7 · 7" }, right: { text: "49" } }
                  - { left: { text: "9 · 6" }, right: { text: "54" } }
                hints: ["Rechne jede Aufgabe aus."]
              - id: l2-s3
                type: text_input
                text: "Eine Spinne hat 8 Beine. Wie viele Beine haben 7 Spinnen?"
                say: "Eine Spinne hat acht Beine. Wie viele Beine haben sieben Spinnen?"
                answer: "56"
                hints: ["Rechne sieben mal acht. Denk an fünf, sechs, sieben, acht."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 9 · 7 = 63"
                say: "Neun mal sieben ist dreiundsechzig. Stimmt das?"
                answer: true
                hints: ["Zehn mal sieben, dann eine Sieben weg."]
              - id: l2-s5
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Welche Zahl fehlt in der Malaufgabe?"
                frame: "_ · 6 = 42"
                options: ["6", "7", "8"]
                answer: ["7"]
                hints: ["Wie oft passt die Sechs in zweiundvierzig?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Malaufgabe hat das Ergebnis 42?"
                say: "Welche Malaufgabe hat das Ergebnis zweiundvierzig?"
                options: ["6 · 7", "5 · 8", "6 · 8"]
                answer: "6 · 7"
              - id: l2-n2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Malaufgabe mit ihrem Ergebnis."
                pairs:
                  - { left: { text: "8 · 8" }, right: { text: "64" } }
                  - { left: { text: "6 · 4" }, right: { text: "24" } }
                  - { left: { text: "3 · 7" }, right: { text: "21" } }
                  - { left: { text: "9 · 9" }, right: { text: "81" } }
              - id: l2-n3
                type: text_input
                text: "Ein Auto hat 4 Räder. Wie viele Räder haben 8 Autos?"
                say: "Ein Auto hat vier Räder. Wie viele Räder haben acht Autos?"
                answer: "32"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 7 · 6 = 48"
                say: "Sieben mal sechs ist achtundvierzig. Stimmt das?"
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Welche Zahl fehlt in der Malaufgabe?"
                frame: "_ · 9 = 72"
                options: ["7", "8", "9"]
                answer: ["8"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Rechne beide Aufgaben."
            say: "Rechne acht mal sechs und sechs mal acht."
            frame: "8 · 6 = _ | 6 · 8 = _"
            options: ["48", "46", "54"]
            answer: ["48", "48"]
          - id: l2-c2
            type: text_input
            text: "8 · 9 = _"
            say: "Acht mal neun."
            answer: "72"
          - id: l2-c3
            type: multiple_choice
            text: "Welche Malaufgabe hat das Ergebnis 56?"
            say: "Welche Malaufgabe hat das Ergebnis sechsundfünfzig?"
            options: ["7 · 8", "6 · 9", "8 · 6"]
            answer: "7 · 8"
          - id: l2-c4
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Welche Zahl fehlt in der Malaufgabe?"
            frame: "_ · 6 = 54"
            options: ["8", "9", "7"]
            answer: ["9"]
          - id: l2-c5
            type: true_false
            text: "Stimmt das? 4 · 9 = 32"
            say: "Vier mal neun ist zweiunddreißig. Stimmt das?"
            answer: false
