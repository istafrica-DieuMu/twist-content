# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.length-mm-km
skill: math.length.mm-km
curriculum: de-DE
language: de
title:
  de: Millimeter und Kilometer
  en: Millimetres and kilometres
summary: >
  Lesson 1 reads strips on the ruler in cm and mm (4 cm 5 mm = 45 mm),
  changes between cm and mm and picks mm for very small things; lesson 2
  learns 1 km = 1000 m, changes between km and m (1 km 200 m = 1200 m),
  picks the unit that fits and estimates a walk (1 km dauert etwa eine
  Viertelstunde), and ends with the skill check. Drawing a line of a given
  length waits for a drawing task.
metadata:
  year: klasse-3
  topic: { de: Längen, en: Length }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.length.estimate, math.numbers-to-1000.place-value]
  also_practises: [math.length.cm-m]
  vocabulary: { de: [Millimeter, mm, Kilometer, km, Zentimeter, Meter, umrechnen, ungefähr] }
  forms: [text, audio, drawn]
  drawn: [ruler]
  facets: [units]
  misconceptions:
    - id: cm-mm-joined
      what: Adds or swaps the cm and mm digits (5 cm 2 mm read as 7 mm or 25 mm), or thinks 1 cm = 100 mm
      addressed: lesson 1 Learn builds 45 mm from 40 mm and 5 mm; l1-f3 has feedback on adding the digits, l1-f1, l1-s1 and l1-c1 offer the swapped reading, l1-f4 says 1 cm = 100 mm
    - id: km-as-hundred
      what: Thinks 1 km = 100 m, or writes 1 km 200 m as 120 m or 1020 m
      addressed: lesson 2 Learn builds 2500 m from 2000 m and 500 m; l2-f3 has feedback on 120 m and 1020 m, l2-s2, l2-n2 and l2-c4 offer the same mistakes, l2-s4 compares 500 m with 1 km
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Millimeter", en: "Millimetres" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1 m = _ cm"
            say: "Wie viele Zentimeter hat ein Meter?"
            options: ["100", "10", "1000"]
            answer: "100"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie lang ist ein Bleistift ungefähr?"
            say: "Wie lang ist ein neuer Bleistift ungefähr?"
            options: ["etwa 17 cm", "etwa 17 m", "etwa 2 cm"]
            answer: "etwa 17 cm"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1 cm = 10 mm"
            say: "Zwischen zwei Zahlen am Lineal sind kleine Striche. Sie teilen einen Zentimeter in zehn gleiche Teile. Jeder Teil ist ein Millimeter. Ein Zentimeter hat zehn Millimeter."
            show: { drawn: ruler, to: 10, length: 1 }
          - text: "4 cm 5 mm = 40 mm + 5 mm = 45 mm"
            say: "Dieser Streifen geht bis vier Zentimeter und dann noch fünf kleine Striche weiter. Er ist vier Zentimeter und fünf Millimeter lang. Das sind vierzig Millimeter und fünf Millimeter, zusammen fünfundvierzig Millimeter."
            show: { drawn: ruler, to: 10, length: 4.5, colour: blue }
          - text: "Eine Ameise ist etwa 5 mm lang."
            say: "Millimeter brauchst du für sehr kleine Dinge oder wenn du ganz genau messen willst. Eine Ameise ist etwa fünf Millimeter lang, ein Reiskorn etwa sieben Millimeter."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Der Streifen fängt bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 10, length: 3.6 }
                options: ["3 cm 6 mm", "6 cm 3 mm", "3 cm"]
                answer: "3 cm 6 mm"
                hints:
                  - "Lies zuerst die ganzen Zentimeter ab."
                  - "Er geht bis 3 cm und dann noch 6 kleine Striche."
                  - "3 cm 6 mm."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "2 cm = _ mm"
                say: "Wie viele Millimeter sind zwei Zentimeter?"
                answer: "20"
                hints:
                  - "1 cm = 10 mm."
                  - "Zweimal 10 mm."
                  - "20."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viele mm ist der Streifen lang?"
                say: "Der Streifen fängt bei null an. Wie viele Millimeter ist er lang?"
                show: { drawn: ruler, to: 10, length: 5.2, colour: blue }
                options: ["52 mm", "25 mm", "7 mm"]
                answer: "52 mm"
                feedback:
                  "7 mm": "Du hast 5 und 2 zusammengezählt. 5 cm sind aber schon 50 mm."
                  "25 mm": "Du hast die Ziffern vertauscht. Es sind 5 ganze cm, also 50 mm, und dann 2 mm."
                hints:
                  - "5 cm sind 50 mm."
                  - "50 mm + 2 mm."
                  - "52 mm."
              - id: l1-f4
                type: true_false
                text: "1 cm = 100 mm"
                say: "Stimmt das? Ein Zentimeter hat hundert Millimeter."
                show: { drawn: ruler, to: 10, length: 1, colour: green }
                answer: false
                hints:
                  - "Zähl die kleinen Abstände zwischen 0 und 1."
                  - "Es sind 10 kleine Abstände."
                  - "Nein. 1 cm = 10 mm."
              - id: l1-f5
                type: multiple_choice
                text: "Was misst du in Millimetern?"
                say: "Was misst du am besten in Millimetern?"
                options: ["wie dick eine Münze ist", "wie lang ein Tisch ist", "wie hoch eine Tür ist"]
                answer: "wie dick eine Münze ist"
                hints:
                  - "Millimeter sind für sehr kleine Längen."
                  - "Eine Münze ist sehr dünn."
                  - "Wie dick eine Münze ist."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Der Streifen fängt bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 10, length: 7.4, colour: green }
                options: ["7 cm 4 mm", "4 cm 7 mm", "8 cm 4 mm"]
                answer: "7 cm 4 mm"
                hints: ["Lies zuerst die ganzen Zentimeter ab."]
              - id: l1-s2
                type: text_input
                text: "6 cm = _ mm"
                say: "Wie viele Millimeter sind sechs Zentimeter?"
                answer: "60"
                hints: ["Jeder Zentimeter hat 10 mm."]
              - id: l1-s3
                type: multiple_choice
                text: "80 mm = _"
                say: "Wie viele Zentimeter sind achtzig Millimeter?"
                options: ["8 cm", "80 cm", "800 cm"]
                answer: "8 cm"
                hints: ["10 mm sind 1 cm."]
              - id: l1-s4
                type: true_false
                text: "Der Streifen ist 35 mm lang."
                say: "Der Streifen fängt bei zwei an. Stimmt das: Er ist fünfunddreißig Millimeter lang?"
                show: { drawn: ruler, to: 10, start: 2, length: 3.5 }
                answer: true
                hints: ["Er geht von 2 cm bis 5 cm 5 mm."]
              - id: l1-s5
                type: text_input
                text: "3 cm 8 mm = _ mm"
                say: "Wie viele Millimeter sind drei Zentimeter und acht Millimeter?"
                answer: "38"
                hints: ["3 cm sind 30 mm."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Der Streifen fängt bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 10, length: 6.3, colour: blue }
                options: ["6 cm 3 mm", "3 cm 6 mm", "6 cm"]
                answer: "6 cm 3 mm"
              - id: l1-n2
                type: text_input
                text: "9 cm = _ mm"
                say: "Wie viele Millimeter sind neun Zentimeter?"
                answer: "90"
              - id: l1-n3
                type: multiple_choice
                text: "Wie viele mm ist der Streifen lang?"
                say: "Der Streifen fängt bei null an. Wie viele Millimeter ist er lang?"
                show: { drawn: ruler, to: 10, length: 2.7 }
                options: ["27 mm", "9 mm", "72 mm"]
                answer: "27 mm"
              - id: l1-n4
                type: true_false
                text: "45 mm = 4 cm 5 mm"
                say: "Stimmt das? Fünfundvierzig Millimeter sind vier Zentimeter und fünf Millimeter."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Wie lang ist ein Marienkäfer ungefähr?"
                say: "Wie lang ist ein Marienkäfer ungefähr?"
                options: ["7 mm", "7 cm", "70 cm"]
                answer: "7 mm"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Der Streifen fängt bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 10, length: 8.5, colour: green }
            options: ["8 cm 5 mm", "5 cm 8 mm", "9 cm 5 mm"]
            answer: "8 cm 5 mm"
          - id: l1-c2
            type: text_input
            text: "4 cm 2 mm = _ mm"
            say: "Wie viele Millimeter sind vier Zentimeter und zwei Millimeter?"
            answer: "42"
          - id: l1-c3
            type: true_false
            text: "50 mm = 5 cm"
            say: "Stimmt das? Fünfzig Millimeter sind fünf Zentimeter."
            answer: true

  - n: 2
    title: { de: "Kilometer", en: "Kilometres" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "7 cm = _ mm"
            say: "Wie viele Millimeter sind sieben Zentimeter?"
            answer: "70"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viele mm ist der Streifen lang?"
            say: "Der Streifen fängt bei null an. Wie viele Millimeter ist er lang?"
            show: { drawn: ruler, to: 10, length: 4.8, colour: blue }
            options: ["48 mm", "84 mm", "12 mm"]
            answer: "48 mm"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 km = 1000 m"
            say: "Für sehr lange Wege gibt es den Kilometer. Ein Kilometer hat tausend Meter. Wenn du einen Kilometer zu Fuß gehst, brauchst du ungefähr eine Viertelstunde."
          - text: "3 km = 3000 m\n2 km 500 m = 2000 m + 500 m = 2500 m"
            say: "Drei Kilometer sind dreitausend Meter. Zwei Kilometer und fünfhundert Meter sind zweitausend Meter und fünfhundert Meter, zusammen zweitausendfünfhundert Meter."
          - text: "1 cm = 10 mm\n1 m = 100 cm\n1 km = 1000 m"
            say: "Jetzt kennst du vier Längenmaße. Millimeter für ganz kleine Dinge, Zentimeter für kleine Dinge, Meter für große Dinge und Kilometer für lange Wege. Ein Zentimeter hat zehn Millimeter, ein Meter hundert Zentimeter und ein Kilometer tausend Meter."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "1 km = _ m"
                say: "Wie viele Meter hat ein Kilometer?"
                options: ["1000", "100", "10"]
                answer: "1000"
                hints:
                  - "Kilo heißt tausend."
                  - "Ein Kilometer hat tausend Meter."
                  - "1000."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "4 km = _ m"
                say: "Wie viele Meter sind vier Kilometer?"
                answer: "4000"
                hints:
                  - "1 km = 1000 m."
                  - "Viermal 1000 m."
                  - "4000."
              - id: l2-f3
                type: multiple_choice
                text: "Der Weg zum Bäcker ist 1 km 200 m lang. Wie viele Meter sind das?"
                say: "Der Weg zum Bäcker ist ein Kilometer und zweihundert Meter lang. Wie viele Meter sind das?"
                options: ["1200 m", "1020 m", "120 m"]
                answer: "1200 m"
                feedback:
                  "120 m": "1 km sind 1000 m, nicht 100 m."
                  "1020 m": "Zu den 1000 m kommen 200 m dazu, nicht 20 m."
                hints:
                  - "1 km = 1000 m."
                  - "1000 m + 200 m."
                  - "1200 m."
              - id: l2-f4
                type: multiple_choice
                text: "Linas Schulweg ist 2 _ lang. Sie läuft eine halbe Stunde."
                say: "Lina läuft eine halbe Stunde bis zur Schule. Welche Einheit passt? Ihr Schulweg ist zwei ... lang."
                options: ["km", "cm", "mm"]
                answer: "km"
                hints:
                  - "Eine halbe Stunde zu Fuß ist ein langer Weg."
                  - "Für lange Wege nimmst du die größte Einheit."
                  - "km."
              - id: l2-f5
                type: true_false
                text: "Für 1 km zu Fuß brauchst du etwa eine Viertelstunde."
                say: "Stimmt das? Für einen Kilometer zu Fuß brauchst du etwa eine Viertelstunde."
                answer: true
                hints:
                  - "Denk an einen Spaziergang."
                  - "Ein Kilometer ist ungefähr so weit wie zehn Fußballfelder hintereinander."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "6000 m = _ km"
                say: "Wie viele Kilometer sind sechstausend Meter?"
                answer: "6"
                hints: ["1000 m sind 1 km."]
              - id: l2-s2
                type: multiple_choice
                text: "Die Radtour ist 2 km 50 m lang. Wie viele Meter sind das?"
                say: "Die Radtour ist zwei Kilometer und fünfzig Meter lang. Wie viele Meter sind das?"
                options: ["2050 m", "2500 m", "250 m"]
                answer: "2050 m"
                hints: ["2 km sind 2000 m."]
              - id: l2-s3
                type: multiple_choice
                text: "Ein Radiergummi ist etwa 4 _ lang."
                say: "Welche Einheit passt? Ein Radiergummi ist etwa vier ... lang."
                options: ["cm", "km", "m"]
                answer: "cm"
                hints: ["Ein Radiergummi passt in deine Hand."]
              - id: l2-s4
                type: true_false
                text: "500 m sind mehr als 1 km."
                say: "Stimmt das? Fünfhundert Meter sind mehr als ein Kilometer."
                answer: false
                hints: ["1 km = 1000 m."]
              - id: l2-s5
                type: multiple_choice
                text: "Tom geht 3 km zu Fuß. Wie lange braucht er ungefähr?"
                say: "Tom geht drei Kilometer zu Fuß. Wie lange braucht er ungefähr?"
                options: ["etwa 45 Minuten", "etwa 3 Minuten", "etwa 3 Stunden"]
                answer: "etwa 45 Minuten"
                hints: ["Für 1 km braucht man etwa eine Viertelstunde."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "7 km = _ m"
                say: "Wie viele Meter sind sieben Kilometer?"
                answer: "7000"
              - id: l2-n2
                type: multiple_choice
                text: "1500 m = _"
                say: "Tausendfünfhundert Meter: Wie schreibst du das mit Kilometern und Metern?"
                options: ["1 km 500 m", "15 km", "1 km 50 m"]
                answer: "1 km 500 m"
              - id: l2-n3
                type: multiple_choice
                text: "Ein Fußballfeld ist etwa 100 _ lang."
                say: "Welche Einheit passt? Ein Fußballfeld ist etwa hundert ... lang."
                options: ["m", "km", "cm"]
                answer: "m"
              - id: l2-n4
                type: true_false
                text: "1 m = 1000 mm"
                say: "Stimmt das? Ein Meter hat tausend Millimeter."
                answer: true
                difficulty: stretch
              - id: l2-n5
                type: text_input
                text: "Der Weg zum See ist 1 km 800 m lang. Wie viele Meter sind das?"
                say: "Der Weg zum See ist ein Kilometer und achthundert Meter lang. Wie viele Meter sind das?"
                answer: "1800"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Der Streifen fängt bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 10, length: 5.7 }
            options: ["5 cm 7 mm", "7 cm 5 mm", "6 cm 7 mm"]
            answer: "5 cm 7 mm"
          - id: l2-c2
            type: text_input
            text: "3 cm 4 mm = _ mm"
            say: "Wie viele Millimeter sind drei Zentimeter und vier Millimeter?"
            answer: "34"
          - id: l2-c3
            type: text_input
            text: "5 km = _ m"
            say: "Wie viele Meter sind fünf Kilometer?"
            answer: "5000"
          - id: l2-c4
            type: multiple_choice
            text: "Der Wanderweg ist 3 km 400 m lang. Wie viele Meter sind das?"
            say: "Der Wanderweg ist drei Kilometer und vierhundert Meter lang. Wie viele Meter sind das?"
            options: ["3400 m", "3040 m", "340 m"]
            answer: "3400 m"
          - id: l2-c5
            type: multiple_choice
            text: "Eine Stecknadel ist etwa 25 _ lang."
            say: "Welche Einheit passt? Eine Stecknadel ist etwa fünfundzwanzig ... lang."
            options: ["mm", "cm", "m"]
            answer: "mm"
