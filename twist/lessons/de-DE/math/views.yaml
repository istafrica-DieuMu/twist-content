# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.views
skill: math.space.views
curriculum: de-DE
language: de
title:
  de: Ansichten von vorne, von der Seite und von oben
  en: Views from the front, the side and above
summary: >
  Lesson 1 matches things around us (Dose, Ball, Partyhut, Pyramide) to
  how they look from the front, the side and above, and does the same for
  cube buildings in one row: von vorne you see every tower, von oben only
  one square per tower, von rechts only the highest tower; lesson 2 takes
  buildings with two rows, where a higher tower behind looks over a lower
  one in front and the front row is on the left when you look from the
  right, matches a building to its views and a view to its building, and
  ends with the skill check. Walking round a real building waits for a
  turnable 3D view.
metadata:
  year: klasse-3
  topic: { de: Orientierung, en: Position and direction }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.solids.cube-buildings]
  also_practises: [math.solids.more-solids]
  vocabulary: { de: [Ansicht, von vorne, von der Seite, von rechts, von oben, Würfelgebäude, Bauplan, Turm, Reihe, vorne, hinten, verdeckt] }
  forms: [text, audio, drawn]
  drawn: [shape, cubes]
  facets: []
  misconceptions:
    - id: front-view-front-row
      what: Thinks the view from the front shows only the front row, so a higher tower behind is left out
      addressed: lesson 2 Learn shows a tower of three behind a single cube; l2-f1 and l2-f3 have feedback on the front row, l2-s1, l2-s3, l2-n1 and l2-c1 offer the front row alone
    - id: side-view-reversed
      what: Draws the view from the right with the front row on the right, as if looking from the left
      addressed: lesson 2 Learn walks round to the right and says the front row is now on the left; l2-f4 has feedback on the reversed view, l2-s4, l2-n4 and l2-c3 offer it
    - id: top-view-shows-height
      what: Thinks the view from above shows how high the towers are, or counts every cube instead of one square per tower
      addressed: lesson 1 Learn says the view from above shows no heights; l1-f3 has feedback on counting all cubes, l1-s3, l1-n4 and l1-c3 ask about it; l2-f2 has feedback on an empty field
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Von vorne, von der Seite, von oben", en: "From the front, the side and above" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Würfel brauchst du für dieses Gebäude?"
            say: "Hier ist ein Bauplan. Wie viele Würfel brauchst du für das ganze Gebäude?"
            show: { drawn: cubes, plan: [[2, 1], [1, 3]], mode: plan, colour: orange }
            options: ["7", "4", "6"]
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Würfel stehen hinten rechts?"
            say: "Schau auf den Bauplan. Wie viele Würfel stehen hinten rechts?"
            show: { drawn: cubes, plan: [[2, 1], [1, 3]], mode: plan, colour: orange }
            options: ["1", "3", "2"]
            answer: "1"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Eine Dose: von vorne ein Rechteck, von oben ein Kreis"
            say: "Schau dir eine Dose an. Von vorne sieht sie aus wie ein Rechteck. Von oben siehst du nur den runden Deckel, also einen Kreis. Je nachdem, von wo du schaust, sieht ein Körper anders aus. Das nennt man eine Ansicht."
            show: { drawn: shape, kind: cylinder, colour: red }
          - text: "Ein Würfelgebäude"
            say: "Hier stehen drei Türme in einer Reihe: links ein Würfel, in der Mitte zwei, rechts drei."
            show: { drawn: cubes, plan: [[1, 2, 3]], mode: building, colour: blue }
          - text: "Ansicht von vorne"
            say: "So sieht das Gebäude von vorne aus, wie auf einem Foto. Du siehst nur Quadrate: links eins, in der Mitte zwei, rechts drei übereinander."
            show: { drawn: cubes, plan: [[1, 2, 3]], mode: front, colour: blue }
          - text: "Ansicht von oben"
            say: "Von oben siehst du auf jedem Turm nur den obersten Würfel: drei Quadrate in einer Reihe. Wie hoch die Türme sind, siehst du von oben nicht."
            show: { drawn: cubes, plan: [[1, 2, 3]], mode: top, colour: blue }
          - text: "Ansicht von der Seite, von rechts"
            say: "Jetzt schaust du von rechts auf das Gebäude. Du siehst nur den Turm mit drei Würfeln. Die kleineren Türme stehen dahinter und sind verdeckt."
            show: { drawn: cubes, plan: [[1, 2, 3]], mode: side, colour: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Wie sieht eine Dose von oben aus?"
                say: "Du schaust von oben auf eine Dose. Was siehst du?"
                show: { drawn: shape, kind: cylinder, colour: green }
                options:
                  - { drawn: shape, kind: circle, colour: green }
                  - { drawn: shape, kind: rectangle, colour: green }
                  - { drawn: shape, kind: square, colour: green }
                answer: circle
                option_audio: false
                feedback:
                  rectangle: "So sieht die Dose von vorne aus. Von oben siehst du den Deckel."
                hints:
                  - "Stell dir vor, die Dose steht auf dem Tisch und du schaust von oben hinein."
                  - "Der Deckel ist rund."
                  - "Ein Kreis."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Welche Ansicht von vorne passt?"
                say: "Wie sieht das Gebäude von vorne aus? Welches Bild passt?"
                show: { drawn: cubes, plan: [[2, 1, 3]], mode: building, colour: orange }
                options:
                  - { drawn: cubes, plan: [[3, 1, 2]], mode: front, colour: orange, key: gedreht }
                  - { drawn: cubes, plan: [[2, 1, 3]], mode: front, colour: orange, key: vorne }
                  - { drawn: cubes, plan: [[2, 1, 3]], mode: top, colour: orange, key: oben }
                answer: vorne
                feedback:
                  gedreht: "Hier sind links und rechts vertauscht. Von vorne steht der Turm mit 2 Würfeln links."
                  oben: "Das ist die Ansicht von oben. Von vorne siehst du, wie hoch jeder Turm ist."
                hints:
                  - "Zähl die Würfel in jedem Turm, von links nach rechts."
                  - "Links 2, in der Mitte 1, rechts 3."
                  - "Such das Bild mit 2, 1 und 3 Quadraten übereinander."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viele Quadrate siehst du von oben?"
                say: "Du schaust von oben auf dieses Gebäude. Wie viele Quadrate siehst du?"
                show: { drawn: cubes, plan: [[1, 3, 2]], mode: building, colour: green }
                options: ["3", "6", "2"]
                answer: "3"
                feedback:
                  "6": "6 ist die Zahl aller Würfel. Von oben siehst du auf jedem Turm nur den obersten Würfel."
                hints:
                  - "Von oben siehst du jeden Turm nur einmal."
                  - "Wie viele Türme stehen da?"
                  - "3 Türme, also 3 Quadrate."
              - id: l1-f4
                type: true_false
                text: "Von rechts siehst du nur einen Turm mit 3 Würfeln."
                say: "Stimmt das? Wenn du von rechts auf das Gebäude schaust, siehst du nur einen Turm mit drei Würfeln."
                show: { drawn: cubes, plan: [[3, 1, 1]], mode: building, colour: purple }
                answer: true
                hints:
                  - "Von rechts stehen alle Türme hintereinander."
                  - "Der höchste Turm verdeckt die kleineren."
                  - "Ja, du siehst nur den Turm mit 3 Würfeln."
              - id: l1-f5
                type: image_multiple_choice
                text: "Wie sieht eine Pyramide von oben aus?"
                say: "Du schaust von oben auf eine Pyramide. Welche Form hat ihr Rand?"
                show: { drawn: shape, kind: pyramid, colour: yellow }
                options:
                  - { drawn: shape, kind: triangle, colour: yellow }
                  - { drawn: shape, kind: square, colour: yellow }
                  - { drawn: shape, kind: circle, colour: yellow }
                answer: square
                option_audio: false
                feedback:
                  triangle: "So sieht die Pyramide von vorne aus. Von oben siehst du ihre quadratische Grundfläche."
                hints:
                  - "Auf welcher Fläche steht die Pyramide?"
                  - "Sie steht auf einem Quadrat."
                  - "Von oben siehst du ein Quadrat."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Ein Partyhut ist ein Kegel. Wie sieht er von der Seite aus?"
                say: "Ein Partyhut hat die Form eines Kegels. Wie sieht er von der Seite aus?"
                show: { drawn: shape, kind: cone, colour: pink }
                options:
                  - { drawn: shape, kind: circle, colour: pink }
                  - { drawn: shape, kind: triangle, colour: pink }
                  - { drawn: shape, kind: square, colour: pink }
                answer: triangle
                option_audio: false
                hints: ["Von der Seite siehst du die Spitze oben und den geraden Rand unten."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welche Ansicht von oben passt?"
                say: "Wie sieht das Gebäude von oben aus? Welches Bild passt?"
                show: { drawn: cubes, plan: [[2, 0, 1]], mode: building, colour: red }
                options:
                  - { drawn: cubes, plan: [[2, 0, 1]], mode: front, colour: red, key: vorne }
                  - { drawn: cubes, plan: [[1, 1, 1]], mode: top, colour: red, key: voll }
                  - { drawn: cubes, plan: [[2, 0, 1]], mode: top, colour: red, key: oben }
                answer: oben
                feedback:
                  voll: "In der Mitte steht kein Würfel. Dort bleibt von oben ein Feld leer."
                hints: ["Von oben siehst du für jeden Turm ein Quadrat. Wo steht kein Turm?"]
              - id: l1-s3
                type: true_false
                text: "Von oben siehst du hier 3 Quadrate."
                say: "Stimmt das? Von oben siehst du bei diesem Gebäude drei Quadrate."
                show: { drawn: cubes, plan: [[1, 2]], mode: building, colour: blue }
                answer: false
                hints: ["Zähl die Türme, nicht die Würfel."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Welche Ansicht von rechts passt?"
                say: "Du schaust von rechts auf das Gebäude. Welches Bild passt?"
                show: { drawn: cubes, plan: [[1, 3, 2]], mode: building, colour: green }
                options:
                  - { drawn: cubes, plan: [[1, 3, 2]], mode: front, colour: green, key: vorne }
                  - { drawn: cubes, plan: [[1, 3, 2]], mode: side, colour: green, key: seite }
                  - { drawn: cubes, plan: [[2]], mode: side, colour: green, key: niedrig }
                answer: seite
                hints: ["Von rechts stehen alle Türme hintereinander. Welcher ist am höchsten?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Wie sieht eine Dose von der Seite aus?"
                say: "Du schaust von der Seite auf eine Dose. Was siehst du?"
                show: { drawn: shape, kind: cylinder, colour: blue }
                options:
                  - { drawn: shape, kind: circle, colour: blue }
                  - { drawn: shape, kind: triangle, colour: blue }
                  - { drawn: shape, kind: rectangle, colour: blue }
                answer: rectangle
                option_audio: false
                hints: ["Von der Seite siehst du die Dose so hoch, wie sie ist, und unten und oben einen geraden Rand."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Welche Ansicht von vorne passt?"
                say: "Wie sieht das Gebäude von vorne aus? Welches Bild passt?"
                show: { drawn: cubes, plan: [[3, 2, 1]], mode: building, colour: purple }
                options:
                  - { drawn: cubes, plan: [[3, 2, 1]], mode: front, colour: purple, key: vorne }
                  - { drawn: cubes, plan: [[3, 2, 1]], mode: top, colour: purple, key: oben }
                  - { drawn: cubes, plan: [[1, 2, 3]], mode: front, colour: purple, key: gedreht }
                answer: vorne
              - id: l1-n2
                type: multiple_choice
                text: "Wie viele Quadrate siehst du von vorne?"
                say: "Du schaust von vorne auf dieses Gebäude. Wie viele Quadrate siehst du?"
                show: { drawn: cubes, plan: [[2, 3, 1]], mode: building, colour: orange }
                options: ["6", "3", "9"]
                answer: "6"
              - id: l1-n3
                type: image_multiple_choice
                text: "Was siehst du, wenn du von oben auf einen Ball schaust?"
                say: "Was siehst du, wenn du von oben auf einen Ball schaust?"
                show: { drawn: shape, kind: sphere, colour: red }
                options:
                  - { drawn: shape, kind: square, colour: red }
                  - { drawn: shape, kind: circle, colour: red }
                  - { drawn: shape, kind: triangle, colour: red }
                answer: circle
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Von oben siehst du, wie hoch die Türme sind."
                say: "Stimmt das? Von oben siehst du, wie hoch die Türme sind."
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                text: "Welche Ansicht von rechts passt?"
                say: "Du schaust von rechts auf das Gebäude. Welches Bild passt?"
                show: { drawn: cubes, plan: [[2, 1, 1]], mode: building, colour: yellow }
                options:
                  - { drawn: cubes, plan: [[2, 1, 1]], mode: front, colour: yellow, key: vorne }
                  - { drawn: cubes, plan: [[3]], mode: side, colour: yellow, key: hoch }
                  - { drawn: cubes, plan: [[2, 1, 1]], mode: side, colour: yellow, key: seite }
                answer: seite

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welche Ansicht von vorne passt?"
            say: "Wie sieht das Gebäude von vorne aus? Welches Bild passt?"
            show: { drawn: cubes, plan: [[1, 1, 3]], mode: building, colour: green }
            options:
              - { drawn: cubes, plan: [[3, 1, 1]], mode: front, colour: green, key: gedreht }
              - { drawn: cubes, plan: [[1, 1, 3]], mode: front, colour: green, key: vorne }
              - { drawn: cubes, plan: [[1, 1, 3]], mode: side, colour: green, key: seite }
            answer: vorne
          - id: l1-c2
            type: image_multiple_choice
            text: "Wie sieht eine Dose von oben aus?"
            say: "Du schaust von oben auf eine Dose. Was siehst du?"
            options:
              - { drawn: shape, kind: rectangle, colour: purple }
              - { drawn: shape, kind: triangle, colour: purple }
              - { drawn: shape, kind: circle, colour: purple }
            answer: circle
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "Wie viele Quadrate siehst du von oben?"
            say: "Du schaust von oben auf dieses Gebäude. Wie viele Quadrate siehst du?"
            show: { drawn: cubes, plan: [[3, 2]], mode: building, colour: red }
            options: ["2", "5", "3"]
            answer: "2"

  - n: 2
    title: { de: "Gebäude mit zwei Reihen", en: "Buildings with two rows" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Welche Ansicht von vorne passt?"
            say: "Wie sieht das Gebäude von vorne aus? Welches Bild passt?"
            show: { drawn: cubes, plan: [[1, 2, 1]], mode: building, colour: blue }
            options:
              - { drawn: cubes, plan: [[1, 2, 1]], mode: front, colour: blue, key: vorne }
              - { drawn: cubes, plan: [[1, 2, 1]], mode: top, colour: blue, key: oben }
            answer: vorne
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viele Quadrate siehst du von oben?"
            say: "Du schaust von oben auf dieses Gebäude. Wie viele Quadrate siehst du?"
            show: { drawn: cubes, plan: [[2, 2, 1]], mode: building, colour: blue }
            options: ["3", "5"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ein Gebäude mit zwei Reihen"
            say: "Dieses Gebäude hat zwei Reihen. Hinten links steht ein Turm aus drei Würfeln, hinten rechts ein Würfel. Vorne links steht ein Würfel, vorne rechts nichts."
            show: { drawn: cubes, plan: [[3, 1], [1, 0]], mode: building, colour: orange }
          - text: "Bauplan: hinten 3 1, vorne 1"
            say: "Das ist sein Bauplan. Die obere Reihe ist hinten, die untere vorne."
            show: { drawn: cubes, plan: [[3, 1], [1, 0]], mode: plan, colour: orange }
          - text: "Von vorne: in jeder Spalte der höchste Turm"
            say: "Von vorne siehst du links drei Quadrate übereinander. Der Würfel vorne links verdeckt nur den unteren Teil vom hohen Turm dahinter. In jeder Spalte siehst du den höchsten Turm."
            show: { drawn: cubes, plan: [[3, 1], [1, 0]], mode: front, colour: orange }
          - text: "Von rechts: vorne ist jetzt links"
            say: "Jetzt gehst du nach rechts um das Gebäude herum. Die vordere Reihe ist jetzt links, die hintere rechts. Vorne ist der höchste Turm einen Würfel hoch, hinten drei."
            show: { drawn: cubes, plan: [[3, 1], [1, 0]], mode: side, colour: orange }
          - text: "Von oben: ein Quadrat für jeden Turm"
            say: "Von oben siehst du drei Quadrate: hinten zwei und vorne links eins. Vorne rechts steht kein Würfel, das Feld bleibt leer."
            show: { drawn: cubes, plan: [[3, 1], [1, 0]], mode: top, colour: orange }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Welche Ansicht von vorne passt?"
                say: "Wie sieht das Gebäude von vorne aus? Welches Bild passt?"
                show: { drawn: cubes, plan: [[2, 1], [1, 1]], mode: building, colour: green }
                options:
                  - { drawn: cubes, plan: [[1, 1]], mode: front, colour: green, key: vorderreihe }
                  - { drawn: cubes, plan: [[2, 1], [1, 1]], mode: front, colour: green, key: vorne }
                  - { drawn: cubes, plan: [[1, 2]], mode: front, colour: green, key: gedreht }
                answer: vorne
                feedback:
                  vorderreihe: "Hinten links steht ein höherer Turm. Er schaut von vorne über den vorderen Würfel hinaus."
                  gedreht: "Hier sind links und rechts vertauscht. Der hohe Turm steht links."
                hints:
                  - "Schau in jeder Spalte, welcher Turm am höchsten ist."
                  - "Links: hinten 2, vorne 1. Rechts: hinten 1, vorne 1."
                  - "Links 2 Quadrate, rechts 1."
              - id: l2-f2
                type: image_multiple_choice
                text: "Welche Ansicht von oben passt?"
                say: "Wie sieht das Gebäude von oben aus? Welches Bild passt?"
                show: { drawn: cubes, plan: [[0, 1], [2, 1]], mode: building, colour: blue }
                options:
                  - { drawn: cubes, plan: [[0, 1], [2, 1]], mode: top, colour: blue, key: oben }
                  - { drawn: cubes, plan: [[1, 1], [1, 1]], mode: top, colour: blue, key: voll }
                  - { drawn: cubes, plan: [[1, 0], [1, 1]], mode: top, colour: blue, key: gespiegelt }
                answer: oben
                feedback:
                  voll: "Hinten links steht kein Würfel. Dort bleibt von oben ein Feld leer."
                  gespiegelt: "Hier ist hinten rechts leer. Im Gebäude ist hinten links leer."
                hints:
                  - "Von oben siehst du ein Quadrat für jeden Turm."
                  - "Wo steht kein Würfel: hinten links oder hinten rechts?"
                  - "Hinten links ist leer, die anderen drei Felder sind voll."
              - id: l2-f3
                type: multiple_choice
                text: "Du schaust von vorne. Wie viele Quadrate siehst du links übereinander?"
                say: "Hier ist der Bauplan. Du schaust von vorne auf das Gebäude. Wie viele Quadrate siehst du links übereinander?"
                show: { drawn: cubes, plan: [[3, 1], [2, 2]], mode: plan, colour: purple }
                options: ["3", "2", "5"]
                answer: "3"
                feedback:
                  "2": "Vorne links stehen 2 Würfel. Aber hinten links steht ein Turm mit 3, der darüber hinausschaut."
                  "5": "Die beiden Türme stehen hintereinander, nicht übereinander. Von vorne siehst du nur den höheren."
                hints:
                  - "Schau auf die linke Spalte im Bauplan: hinten und vorne."
                  - "Hinten links 3, vorne links 2. Welcher ist höher?"
                  - "3 Quadrate hoch."
              - id: l2-f4
                type: image_multiple_choice
                text: "Welche Ansicht von rechts passt?"
                say: "Du gehst um das Gebäude herum und schaust von rechts. Welches Bild passt?"
                show: { drawn: cubes, plan: [[2, 2], [1, 1]], mode: building, colour: red }
                options:
                  - { drawn: cubes, plan: [[2, 2], [1, 1]], mode: side, colour: red, key: seite }
                  - { drawn: cubes, plan: [[1, 1], [2, 2]], mode: side, colour: red, key: gedreht }
                  - { drawn: cubes, plan: [[2, 2], [1, 1]], mode: front, colour: red, key: vorne }
                answer: seite
                feedback:
                  gedreht: "Von rechts gesehen ist die vordere Reihe links. Vorne sind die Türme nur einen Würfel hoch."
                  vorne: "Das ist die Ansicht von vorne. Von rechts siehst du die vordere und die hintere Reihe."
                hints:
                  - "Von rechts siehst du die vordere Reihe links und die hintere Reihe rechts."
                  - "Vorne ist es 1 Würfel hoch, hinten 2."
                  - "Links 1 Quadrat, rechts 2."
              - id: l2-f5
                type: true_false
                text: "Von oben siehst du 4 Quadrate."
                say: "Hier ist der Bauplan. Stimmt das? Von oben siehst du vier Quadrate."
                show: { drawn: cubes, plan: [[1, 2], [1, 1]], mode: plan, colour: yellow }
                answer: true
                hints:
                  - "Jedes Feld mit einer Zahl ist ein Turm."
                  - "Wie viele Felder haben eine Zahl?"
                  - "Ja, 4 Felder, also 4 Quadrate."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Welche Ansicht von vorne passt?"
                say: "Wie sieht das Gebäude von vorne aus? Welches Bild passt?"
                show: { drawn: cubes, plan: [[1, 3], [2, 1]], mode: building, colour: orange }
                options:
                  - { drawn: cubes, plan: [[2, 1]], mode: front, colour: orange, key: vorderreihe }
                  - { drawn: cubes, plan: [[1, 3]], mode: front, colour: orange, key: hinterreihe }
                  - { drawn: cubes, plan: [[1, 3], [2, 1]], mode: front, colour: orange, key: vorne }
                answer: vorne
                feedback:
                  vorderreihe: "Hinten rechts steht ein Turm mit 3 Würfeln. Er schaut über den vorderen hinaus."
                hints: ["In jeder Spalte siehst du von vorne den höchsten Turm."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Welche Ansicht von oben passt?"
                say: "Wie sieht das Gebäude von oben aus? Welches Bild passt?"
                show: { drawn: cubes, plan: [[1, 2], [0, 1]], mode: building, colour: green }
                options:
                  - { drawn: cubes, plan: [[1, 1], [1, 0]], mode: top, colour: green, key: gespiegelt }
                  - { drawn: cubes, plan: [[1, 2], [0, 1]], mode: top, colour: green, key: oben }
                  - { drawn: cubes, plan: [[1, 1], [1, 1]], mode: top, colour: green, key: voll }
                answer: oben
                hints: ["Welches Feld ist leer: vorne links oder vorne rechts?"]
