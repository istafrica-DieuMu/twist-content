# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.semi-written-mult
skill: math.mult-div-larger.semi-written-mult
curriculum: de-DE
language: de
title:
  de: Halbschriftlich malnehmen
  en: Multiplying in steps
summary: >
  Multiplying by a one-digit number with the steps written down. Lesson
  1 splits a two-digit number into Zehner and Einer (7 · 46 = 280 + 42)
  and shows the Malkreuz; lesson 2 does the same with three-digit numbers
  (3 · 124 = 300 + 60 + 12), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.tens]
  also_practises: [math.mult-div-larger.distributive, math.mult-div-larger.tens]
  vocabulary: { de: [halbschriftlich, Rechenweg, Malkreuz, Teilergebnis, zerlegen] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: lose-a-part
      what: Forgets one of the partial products, usually the Einer (5 · 38 = 150 + 8)
      addressed: lesson 1 Learn writes every Teilergebnis; every step frame offers a chip that adds a part of the number without multiplying it (158, 207, 167, 274, 249, 246, 651, 483)
    - id: add-instead
      what: Adds the partial results wrongly at the end (3 · 64 = 182)
      addressed: l1-f4, l1-n4 and l2-n4 are wrong in the last addition
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Zweistellig mal einstellig", en: "Two digits times one digit" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 · 30 = _"
            say: "Sechs mal dreißig."
            answer: "180"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie zerlegst du 46?"
            say: "Sechsundvierzig. Wie zerlegst du die Zahl in Zehner und Einer?"
            options: ["40 + 6", "4 + 6", "46 + 0"]
            answer: "40 + 6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "7 · 46 = 7 · 40 + 7 · 6"
            say: "Beim halbschriftlichen Rechnen schreibst du deinen Rechenweg auf. Zerlege sechsundvierzig in vierzig und sechs."
          - text: "7 · 40 = 280 | 7 · 6 = 42 | 280 + 42 = 322"
            say: "Sieben mal vierzig ist zweihundertachtzig. Sieben mal sechs ist zweiundvierzig. Zusammen sind das dreihundertzweiundzwanzig."
          - text: "Malkreuz:\n· | 40 | 6\n7 | 280 | 42"
            say: "Im Malkreuz schreibst du die Zehner und die Einer oben hin und die andere Zahl links davor. In die Felder kommen die Teilergebnisse. Dann zählst du sie zusammen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Fünf mal achtunddreißig. Rechne Schritt für Schritt."
                frame: "5 · 30 = _ | 5 · 8 = _ | 5 · 38 = _"
                options: ["150", "40", "190", "158"]
                answer: ["150", "40", "190"]
                hints:
                  - "Zuerst die Zehner, dann die Einer."
                  - "Fünf mal drei Zehner sind fünfzehn Zehner. Dann fünf mal acht, und am Ende zählst du beides zusammen."
                  - "150, 40 und 190."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Vier mal siebenundfünfzig. Rechne die Teilergebnisse und zähle sie zusammen."
                frame: "4 · 50 = _ | 4 · 7 = _ | 4 · 57 = _"
                options: ["200", "28", "228", "207"]
                answer: ["200", "28", "228"]
                hints:
                  - "Vier mal fünfzig und vier mal sieben."
                  - "Vier mal fünf Zehner sind zwanzig Zehner. Dann vier mal sieben, und zum Schluss zählst du beides zusammen."
                  - "200, 28 und 228."
              - id: l1-f3
                type: text_input
                text: "6 · 43 = _"
                say: "Sechs mal dreiundvierzig."
                answer: "258"
                hints:
                  - "Zerlege dreiundvierzig in vierzig und drei."
                  - "Sechs mal vierzig ist zweihundertvierzig, sechs mal drei ist achtzehn."
                  - "258."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 3 · 64 = 182"
                say: "Drei mal vierundsechzig ist hundertzweiundachtzig. Stimmt das?"
                answer: false
                hints:
                  - "Rechne die Teilergebnisse: drei mal sechzig und drei mal vier."
                  - "Hundertachtzig und zwölf. Zähle sie genau zusammen."
                  - "Nein. 3 · 64 = 192."
              - id: l1-f5
                type: text_input
                text: "Eine Klasse hat 26 Kinder. Wie viele Kinder sind in 4 Klassen?"
                say: "Eine Klasse hat sechsundzwanzig Kinder. Wie viele Kinder sind in vier Klassen?"
                answer: "104"
                hints:
                  - "Welche Malaufgabe passt?"
                  - "Vier mal sechsundzwanzig: achtzig und vierundzwanzig."
                  - "104 Kinder."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Acht mal siebenundzwanzig. Rechne Schritt für Schritt."
                frame: "8 · 20 = _ | 8 · 7 = _ | 8 · 27 = _"
                options: ["160", "56", "216", "167"]
                answer: ["160", "56", "216"]
                hints: ["Zuerst die Zehner, dann die Einer."]
              - id: l1-s2
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Neun mal vierunddreißig. Rechne die Teilergebnisse und zähle sie zusammen."
                frame: "9 · 30 = _ | 9 · 4 = _ | 9 · 34 = _"
                options: ["270", "36", "306", "274"]
                answer: ["270", "36", "306"]
                hints: ["Zweihundertsiebzig und sechsunddreißig."]
              - id: l1-s3
                type: text_input
                text: "7 · 58 = _"
                say: "Sieben mal achtundfünfzig."
                answer: "406"
                hints: ["Sieben mal fünfzig und sieben mal acht."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 6 · 75 = 450"
                say: "Sechs mal fünfundsiebzig ist vierhundertfünfzig. Stimmt das?"
                answer: true
                hints: ["Sechs mal siebzig und sechs mal fünf."]
              - id: l1-s5
                type: text_input
                text: "Ein Buch kostet 18 €. Wie viel Euro kosten 7 Bücher?"
                say: "Ein Buch kostet achtzehn Euro. Wie viel Euro kosten sieben Bücher?"
                answer: "126"
                hints: ["Sieben mal zehn und sieben mal acht."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Drei mal neunundachtzig. Rechne Schritt für Schritt."
                frame: "3 · 80 = _ | 3 · 9 = _ | 3 · 89 = _"
                options: ["240", "27", "267", "249"]
                answer: ["240", "27", "267"]
              - id: l1-n2
                type: text_input
                text: "5 · 67 = _"
                say: "Fünf mal siebenundsechzig."
                answer: "335"
              - id: l1-n3
                type: text_input
                text: "8 · 46 = _"
                say: "Acht mal sechsundvierzig."
                answer: "368"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 9 · 52 = 458"
                say: "Neun mal zweiundfünfzig ist vierhundertachtundfünfzig. Stimmt das?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "Ein Bus fährt jeden Tag 75 km. Wie viele Kilometer fährt er in 4 Tagen?"
                say: "Ein Bus fährt jeden Tag fünfundsiebzig Kilometer. Wie viele Kilometer fährt er in vier Tagen?"
                answer: "300"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "4 · 63 = _"
            say: "Vier mal dreiundsechzig."
            answer: "252"
          - id: l1-c2
            type: text_input
            text: "7 · 35 = _"
            say: "Sieben mal fünfunddreißig."
            answer: "245"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 6 · 47 = 282"
            say: "Sechs mal siebenundvierzig ist zweihundertzweiundachtzig. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Dreistellig mal einstellig", en: "Three digits times one digit" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "6 · 24 = _"
            say: "Sechs mal vierundzwanzig."
            answer: "144"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "4 · 200 = _"
            say: "Vier mal zweihundert."
            answer: "800"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 · 124 = 3 · 100 + 3 · 20 + 3 · 4"
            say: "Auch eine dreistellige Zahl kannst du zerlegen: hundertvierundzwanzig in hundert, zwanzig und vier."
          - text: "300 + 60 + 12 = 372"
            say: "Drei mal hundert ist dreihundert, drei mal zwanzig ist sechzig, drei mal vier ist zwölf. Zusammen sind das dreihundertzweiundsiebzig."
          - text: "Malkreuz:\n· | 200 | 10 | 5\n4 | 800 | 40 | 20"
            say: "Im Malkreuz bekommt jede Stelle ein eigenes Feld. Vier mal zweihundertfünfzehn ist achthundert plus vierzig plus zwanzig, also achthundertsechzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Zwei mal hundertdreiundvierzig. Rechne Schritt für Schritt."
                frame: "2 · 100 = _ | 2 · 40 = _ | 2 · 3 = _ | 2 · 143 = _"
                options: ["200", "80", "6", "286", "246"]
                answer: ["200", "80", "6", "286"]
                hints:
                  - "Hunderter, Zehner und Einer, jeweils mal zwei."
                  - "Zwei mal hundert, zwei mal vierzig, zwei mal drei. Zum Schluss zählst du alles zusammen."
                  - "200, 80, 6 und 286."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Zähle die Teilergebnisse zusammen."
                say: "Vier mal hundertzweiunddreißig. Die Teilergebnisse sind vierhundert, hundertzwanzig und acht. Zähle sie zusammen."
                frame: "4 · 132 = 400 + 120 + 8 = _"
                options: ["528", "436", "538"]
                answer: ["528"]
                hints:
                  - "Vierhundert und hundertzwanzig."
                  - "Fünfhundertzwanzig und acht."
                  - "528."
              - id: l2-f3
                type: text_input
                text: "3 · 213 = _"
                say: "Drei mal zweihundertdreizehn."
                answer: "639"
                hints:
                  - "Zerlege in zweihundert, zehn und drei."
                  - "Sechshundert, dreißig und neun."
                  - "639."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 5 · 120 = 510"
                say: "Fünf mal hundertzwanzig ist fünfhundertzehn. Stimmt das?"
                answer: false
                hints:
                  - "Fünf mal hundert und fünf mal zwanzig."
                  - "Fünfhundert und hundert."
                  - "Nein. 5 · 120 = 600."
              - id: l2-f5
                type: text_input
                text: "Ein Fahrrad kostet 245 €. Wie viel Euro kosten 3 Fahrräder?"
                say: "Ein Fahrrad kostet zweihundertfünfundvierzig Euro. Wie viel Euro kosten drei Fahrräder?"
                answer: "735"
                hints:
                  - "Welche Malaufgabe passt?"
                  - "Sechshundert, hundertzwanzig und fünfzehn."
                  - "735 Euro."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Drei mal zweihunderteinundfünfzig. Rechne Schritt für Schritt."
                frame: "3 · 200 = _ | 3 · 50 = _ | 3 · 1 = _ | 3 · 251 = _"
                options: ["600", "150", "3", "753", "651"]
                answer: ["600", "150", "3", "753"]
                hints: ["Hunderter, Zehner und Einer, jeweils mal drei."]
              - id: l2-s2
                type: text_input
                text: "2 · 348 = _"
                say: "Zwei mal dreihundertachtundvierzig."
                answer: "696"
                hints: ["Sechshundert, achtzig und sechzehn."]
              - id: l2-s3
                type: text_input
                text: "4 · 125 = _"
                say: "Vier mal hundertfünfundzwanzig."
                answer: "500"
                hints: ["Vierhundert und vier mal fünfundzwanzig."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 6 · 111 = 666"
                say: "Sechs mal hundertelf ist sechshundertsechsundsechzig. Stimmt das?"
                answer: true
                hints: ["Sechs mal hundert, sechs mal zehn, sechs mal eins."]
              - id: l2-s5
                type: text_input
                text: "Ein Zug hat 4 Wagen mit je 112 Plätzen. Wie viele Plätze sind es?"
                say: "Ein Zug hat vier Wagen. In jedem Wagen sind hundertzwölf Plätze. Wie viele Plätze sind es zusammen?"
                answer: "448"
                hints: ["Vier mal hundertzwölf."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "5 · 160 = _"
                say: "Fünf mal hundertsechzig."
                answer: "800"
              - id: l2-n2
                type: text_input
                text: "3 · 326 = _"
                say: "Drei mal dreihundertsechsundzwanzig."
                answer: "978"
              - id: l2-n3
                type: text_input
                text: "7 · 142 = _"
                say: "Sieben mal hundertzweiundvierzig."
                answer: "994"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 4 · 236 = 924"
                say: "Vier mal zweihundertsechsunddreißig ist neunhundertvierundzwanzig. Stimmt das?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "Ein Paket wiegt 215 g. Wie viel Gramm wiegen 3 Pakete?"
                say: "Ein Paket wiegt zweihundertfünfzehn Gramm. Wie viele Gramm wiegen drei Pakete?"
                answer: "645"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "6 · 54 = _"
            say: "Sechs mal vierundfünfzig."
            answer: "324"
          - id: l2-c2
            type: text_input
            text: "3 · 241 = _"
            say: "Drei mal zweihunderteinundvierzig."
            answer: "723"
          - id: l2-c3
            type: fill_in_blank
            text: "Rechne Schritt für Schritt."
            say: "Acht mal dreiundsechzig. Rechne Schritt für Schritt."
            frame: "8 · 60 = _ | 8 · 3 = _ | 8 · 63 = _"
            options: ["480", "24", "504", "483"]
            answer: ["480", "24", "504"]
          - id: l2-c4
            type: true_false
            text: "Stimmt das? 2 · 375 = 750"
            say: "Zwei mal dreihundertfünfundsiebzig ist siebenhundertfünfzig. Stimmt das?"
            answer: true
          - id: l2-c5
            type: text_input
            text: "Lea läuft jeden Tag 450 m zur Schule. Wie viele Meter sind das in 2 Tagen?"
            say: "Lea läuft jeden Tag vierhundertfünfzig Meter zur Schule. Wie viele Meter sind das in zwei Tagen?"
            answer: "900"
