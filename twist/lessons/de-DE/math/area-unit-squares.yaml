# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.area-unit-squares
skill: math.area-volume.area-unit-squares
curriculum: de-DE
language: de
title:
  de: Flächeninhalt in Kästchen
  en: Area in unit squares
summary: >
  Lesson 1 finds the Flächeninhalt of figures on Karopapier by counting
  the Kästchen they cover, splits harder figures (L, T, U, a cross) into
  rectangles and adds the parts, and counts two half Kästchen as one.
  Lesson 2 finds the Flächeninhalt of a rectangle with a Malaufgabe (rows
  times Kästchen in a row, read from a filled rectangle or an outline),
  sees that different rectangles can have the same Flächeninhalt, splits
  figures into two rectangles, and ends with the skill check. Drawing a
  figure on the grid waits for a draw task.
metadata:
  year: klasse-3
  topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.area-volume.compare-area, math.mult-div.arrays]
  also_practises: [math.mult-div.arrays, math.mult-div.core-facts]
  vocabulary: { de: [Flächeninhalt, Kästchen, Karopapier, zerlegen, Rechteck, Quadrat, halbes Kästchen, lang, breit] }
  forms: [text, audio, drawn]
  drawn: [grid, dots]
  facets: []
  misconceptions:
    - id: counts-border
      what: Counts the Kästchen around the edge, or the edge itself, instead of the Kästchen inside
      addressed: l1-f1 offers the edge count 12 with feedback; l2-f3 offers the Umfang 18 with feedback
    - id: adds-sides
      what: Adds length and width of a rectangle instead of multiplying them (3 + 4 for 3 rows of 4)
      addressed: lesson 2 Learn screens 1 and 2; l2-f1 and l2-f3 (with feedback), l2-s2 and l2-c4 offer the sum
    - id: half-as-whole
      what: Counts a half Kästchen as a whole one
      addressed: lesson 1 Learn screen 3; l1-f3 (with feedback), l1-s3, l1-n3, l1-c3 and l2-c2
    - id: longer-is-bigger
      what: Thinks the longer figure has the bigger Flächeninhalt without counting
      addressed: l1-n2, l1-n4 and l2-n2 set a longer figure against a bigger one
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Kästchen zählen und zerlegen", en: "Counting and splitting" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Fläche ist größer?\nA:\n■ ■ ■ ■ ■ ■\nB:\n■ ■ ■ ■\n■ ■ ■ ■"
            say: "Welche Fläche ist größer, A oder B? Oder sind beide gleich groß?"
            options: ["A", "B", "beide gleich groß"]
            answer: "B"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Malaufgabe passt zum Punktefeld?"
            say: "Welche Malaufgabe passt zum Punktefeld?"
            show: { drawn: dots, array: [3, 5] }
            options: ["3 · 5", "3 + 5", "5 + 5"]
            answer: "3 · 5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Diese Figur bedeckt 6 Kästchen.\nIhr Flächeninhalt ist 6 Kästchen."
            say: "Der Flächeninhalt sagt, wie groß eine Fläche ist. Auf Karopapier zählst du die Kästchen, die eine Figur bedeckt. Diese Figur bedeckt sechs Kästchen. Ihr Flächeninhalt ist sechs Kästchen."
            show:
              drawn: grid
              cols: 5
              rows: 4
              cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue]]
          - text: "Zerlegen:\nblau 4 Kästchen, rot 3 Kästchen\n4 + 3 = 7 Kästchen"
            say: "Bei schwierigen Figuren hilft Zerlegen. Teile die Figur in Rechtecke und zähl jedes Teil. Der blaue Teil hat vier Kästchen, der rote drei. Zusammen sind es sieben Kästchen."
            show:
              drawn: grid
              cols: 6
              rows: 5
              cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [1, 2, red], [1, 3, red], [1, 4, red]]
          - text: "2 halbe Kästchen = 1 ganzes Kästchen\n2 ganze + 2 halbe = 3 Kästchen"
            say: "Manchmal ist ein Kästchen nur zur Hälfte bedeckt. Zwei halbe Kästchen sind zusammen ein ganzes. Diese Figur hat zwei ganze und zwei halbe Kästchen. Ihr Flächeninhalt ist drei Kästchen."
            show:
              drawn: grid
              cols: 6
              rows: 3
              cells: [[2, 1, green], [3, 1, green]]
              halves: [[1, 1, br, green], [4, 1, bl, green]]

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie groß ist der Flächeninhalt?"
                say: "Wie groß ist der Flächeninhalt der Figur in Kästchen?"
                show:
                  drawn: grid
                  cols: 6
                  rows: 4
                  cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue]]
                options: ["8 Kästchen", "12 Kästchen", "6 Kästchen"]
                answer: "8 Kästchen"
                feedback:
                  "12 Kästchen": "12 Kästchenseiten liegen am Rand. Zähl die Kästchen, die die Figur bedeckt."
                hints:
                  - "Zähl Reihe für Reihe."
                  - "Jede Reihe hat 4 Kästchen. Es sind 2 Reihen."
                  - "4 + 4 = 8 Kästchen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie groß ist der Flächeninhalt?"
                say: "Wie groß ist der Flächeninhalt der Figur in Kästchen?"
                show:
                  drawn: grid
                  cols: 5
                  rows: 5
                  cells: [[1, 1, blue], [1, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue]]
                options: ["5 Kästchen", "6 Kästchen", "4 Kästchen"]
                answer: "5 Kästchen"
                feedback:
                  "6 Kästchen": "Das Eckkästchen gehört zu beiden Teilen. Zähl es nur einmal."
                hints:
                  - "Zerlege die Figur in zwei Rechtecke."
                  - "Links stehen 3 Kästchen übereinander. Unten rechts kommen noch 2 dazu."
                  - "3 + 2 = 5 Kästchen."
              - id: l1-f3
                type: multiple_choice
                text: "Wie groß ist der Flächeninhalt?"
                say: "Wie groß ist der Flächeninhalt des Hauses in Kästchen?"
                show:
                  drawn: grid
                  cols: 4
                  rows: 4
                  cells: [[1, 2, orange], [2, 2, orange]]
                  halves: [[1, 1, br, red], [2, 1, bl, red]]
                options: ["3 Kästchen", "4 Kästchen", "2 Kästchen"]
                answer: "3 Kästchen"
                feedback:
                  "4 Kästchen": "Die Dachkästchen sind nur halb bedeckt. Zwei halbe sind ein ganzes."
                  "2 Kästchen": "Das Dach zählt mit. Zwei halbe Kästchen sind ein ganzes."
                hints:
                  - "Zähl die ganzen Kästchen. Dann die halben."
                  - "Unten sind 2 ganze Kästchen. Das Dach sind 2 halbe."
                  - "2 + 1 = 3 Kästchen."
              - id: l1-f4
                type: true_false
                text: "Die blaue und die rote Figur haben den gleichen Flächeninhalt."
                say: "Stimmt das? Die blaue und die rote Figur haben den gleichen Flächeninhalt."
                show:
                  drawn: grid
                  cols: 9
                  rows: 4
                  cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [6, 0, red], [7, 0, red], [6, 1, red], [7, 1, red], [6, 2, red], [7, 2, red]]
                answer: true
                hints:
                  - "Zähl die Kästchen jeder Figur."
                  - "Blau hat 2 Reihen mit 3. Rot hat 3 Reihen mit 2."
                  - "Beide haben 6 Kästchen. Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Wie groß ist der Flächeninhalt?"
                say: "Wie groß ist der Flächeninhalt der Figur in Kästchen?"
                show:
                  drawn: grid
                  cols: 7
                  rows: 5
                  cells: [[1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green], [5, 1, green], [3, 2, green], [3, 3, green]]
                options: ["7 Kästchen", "9 Kästchen", "5 Kästchen"]
                answer: "7 Kästchen"
                hints:
                  - "Zerlege die Figur: oben ein Balken, darunter ein Stiel."
                  - "Oben sind 5 Kästchen, darunter noch 2."
                  - "5 + 2 = 7 Kästchen."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Flächeninhalt = _ Kästchen"
                say: "Wie groß ist der Flächeninhalt in Kästchen?"
                show:
                  drawn: grid
                  cols: 5
                  rows: 5
                  cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue]]
                answer: "9"
                hints: ["Zähl Reihe für Reihe: 3 Reihen mit je 3 Kästchen."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welche Figur hat einen Flächeninhalt von 6 Kästchen?"
                say: "Welche Figur hat einen Flächeninhalt von sechs Kästchen?"
                options:
                  - { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, red], [0, 1, red], [0, 2, red], [1, 2, red], [2, 2, red], [3, 2, red]], key: "6" }
                  - { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [0, 1, red], [1, 1, red]], key: "5" }
                  - { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red]], key: "8" }
                answer: "6"
                hints: ["Zähl in jeder Figur die Kästchen."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie groß ist der Flächeninhalt?"
                say: "Wie groß ist der Flächeninhalt der Figur in Kästchen?"
                show:
                  drawn: grid
                  cols: 4
                  rows: 4
                  cells: [[1, 2, purple]]
                  halves: [[1, 1, bl, purple], [2, 2, bl, purple]]
                options: ["2 Kästchen", "3 Kästchen", "1 Kästchen"]
                answer: "2 Kästchen"
                hints: ["Zwei halbe Kästchen sind zusammen ein ganzes."]
              - id: l1-s4
                type: true_false
                text: "Die Figur hat einen Flächeninhalt von 10 Kästchen."
                say: "Stimmt das? Die Figur hat einen Flächeninhalt von zehn Kästchen."
                show:
                  drawn: grid
                  cols: 6
                  rows: 5
                  cells: [[1, 1, orange], [4, 1, orange], [1, 2, orange], [4, 2, orange], [1, 3, orange], [2, 3, orange], [3, 3, orange], [4, 3, orange]]
                answer: false
                hints: ["Zerlege die Figur: zwei Türme und unten ein Balken."]
              - id: l1-s5
                type: multiple_choice
                text: "Zerlege die Figur in zwei Rechtecke. Welche Rechnung passt?"
                say: "Zerlege die Figur in zwei Rechtecke. Welche Rechnung passt?"
                show:
                  drawn: grid
                  cols: 7
                  rows: 5
                  cells: [[1, 1, blue], [2, 1, blue], [1, 2, blue], [2, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue], [4, 3, blue], [5, 3, blue]]
                options: ["4 + 5 = 9", "2 + 5 = 7", "4 + 4 = 8"]
                answer: "4 + 5 = 9"
                hints: ["Oben ist ein Quadrat aus 4 Kästchen, unten eine Reihe."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: text_input
                text: "Tim legt im Garten einen Sitzplatz mit Platten aus. Jedes Kästchen ist eine Platte. Wie viele Platten braucht er?"
                say: "Tim legt im Garten einen Sitzplatz mit Platten aus. Jedes Kästchen ist eine Platte. Wie viele Platten braucht er?"
                show:
                  drawn: grid
                  cols: 6
                  rows: 5
                  cells: [[1, 1, brown], [2, 1, brown], [3, 1, brown], [4, 1, brown], [1, 2, brown], [2, 2, brown], [3, 2, brown], [4, 2, brown], [1, 3, brown], [2, 3, brown]]
                answer: "10"
              - id: l1-n2
                type: multiple_choice
                text: "Das ist der Plan von zwei Zimmern. Welches Zimmer ist größer?"
                say: "Das ist der Plan von zwei Zimmern. Welches Zimmer hat den größeren Flächeninhalt, A oder B? Oder sind beide gleich groß?"
                show:
                  drawn: grid
                  cols: 10
                  rows: 5
                  cells: [[0, 1, blue], [1, 1, blue], [2, 1, blue], [0, 2, blue], [1, 2, blue], [2, 2, blue], [0, 3, blue], [1, 3, blue], [2, 3, blue], [0, 4, blue], [1, 4, blue], [2, 4, blue], [5, 1, red], [6, 1, red], [7, 1, red], [8, 1, red], [9, 1, red], [5, 2, red], [6, 2, red], [7, 2, red], [8, 2, red], [9, 2, red]]
                  labels: [[1, 2, A], [7, 1, B]]
                options: ["A", "B", "beide gleich groß"]
                answer: "A"
                keep_order: true
              - id: l1-n3
                type: multiple_choice
                text: "Ben malt eine Fahne. Wie groß ist ihr Flächeninhalt?"
                say: "Ben malt eine Fahne. Wie groß ist ihr Flächeninhalt in Kästchen?"
                show:
                  drawn: grid
                  cols: 6
                  rows: 3
                  cells: [[2, 1, yellow], [3, 1, yellow]]
                  halves: [[1, 1, br, yellow], [4, 1, tl, yellow]]
                options: ["3 Kästchen", "4 Kästchen", "2 Kästchen"]
                answer: "3 Kästchen"
              - id: l1-n4
                type: true_false
                text: "Mia sagt: „Die längere Figur hat immer den größeren Flächeninhalt.“"
                say: "Mia sagt: Die längere Figur hat immer den größeren Flächeninhalt. Hat Mia recht?"
                show:
                  drawn: grid
                  cols: 11
                  rows: 3
                  cells: [[0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red], [4, 1, red], [5, 1, red], [6, 1, red], [8, 0, blue], [9, 0, blue], [10, 0, blue], [8, 1, blue], [9, 1, blue], [10, 1, blue], [8, 2, blue], [9, 2, blue], [10, 2, blue]]
                answer: false
              - id: l1-n5
                type: text_input
                text: "Ein Teppich hat diese Form. Wie viele Kästchen bedeckt er?"
                say: "Ein Teppich hat diese Form. Wie viele Kästchen bedeckt er?"
                show:
                  drawn: grid
                  cols: 6
                  rows: 6
                  cells: [[2, 1, purple], [3, 1, purple], [1, 2, purple], [2, 2, purple], [3, 2, purple], [4, 2, purple], [1, 3, purple], [2, 3, purple], [3, 3, purple], [4, 3, purple], [2, 4, purple], [3, 4, purple]]
                answer: "12"
                difficulty: stretch

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Flächeninhalt = _ Kästchen"
            say: "Wie groß ist der Flächeninhalt in Kästchen?"
            show:
              drawn: grid
              cols: 7
              rows: 4
              cells: [[1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green], [5, 1, green], [1, 2, green], [2, 2, green], [3, 2, green], [4, 2, green], [5, 2, green]]
            answer: "10"
          - id: l1-c2
            type: multiple_choice
            text: "Wie groß ist der Flächeninhalt?"
            say: "Wie groß ist der Flächeninhalt der Figur in Kästchen?"
            show:
              drawn: grid
              cols: 6
              rows: 5
              cells: [[1, 1, blue], [1, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue], [4, 3, blue]]
            options: ["6 Kästchen", "7 Kästchen", "5 Kästchen"]
            answer: "6 Kästchen"
          - id: l1-c3
            type: multiple_choice
            text: "Wie groß ist der Flächeninhalt?"
            say: "Wie groß ist der Flächeninhalt der Figur in Kästchen?"
            show:
              drawn: grid
              cols: 6
              rows: 4
              cells: [[1, 1, red], [2, 1, red], [1, 2, red], [2, 2, red]]
              halves: [[3, 1, bl, red], [3, 2, tl, red]]
            options: ["5 Kästchen", "6 Kästchen", "4 Kästchen"]
            answer: "5 Kästchen"

  - n: 2
    title: { de: "Rechtecke mit Malaufgaben", en: "Rectangles by multiplying" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Flächeninhalt = _ Kästchen"
            say: "Wie groß ist der Flächeninhalt in Kästchen?"
            show:
              drawn: grid
              cols: 5
              rows: 5
              cells: [[1, 1, orange], [2, 1, orange], [1, 2, orange], [2, 2, orange], [1, 3, orange]]
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Zwei halbe Kästchen sind zusammen ein ganzes Kästchen."
            say: "Stimmt das? Zwei halbe Kästchen sind zusammen ein ganzes Kästchen."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 Reihen mit je 5 Kästchen\n3 · 5 = 15\nFlächeninhalt: 15 Kästchen"
            say: "Bei einem Rechteck musst du nicht jedes Kästchen einzeln zählen. Dieses Rechteck hat drei Reihen mit je fünf Kästchen. Drei mal fünf ist fünfzehn. Der Flächeninhalt ist fünfzehn Kästchen."
            show:
              drawn: grid
              cols: 7
              rows: 5
              cells: [[1, 1, blue], [2, 1, blue], [3, 1, blue], [4, 1, blue], [5, 1, blue], [1, 2, blue], [2, 2, blue], [3, 2, blue], [4, 2, blue], [5, 2, blue], [1, 3, blue], [2, 3, blue], [3, 3, blue], [4, 3, blue], [5, 3, blue]]
          - text: "6 Kästchen lang, 2 Kästchen breit\n2 · 6 = 12\nFlächeninhalt: 12 Kästchen"
            say: "Du kannst die Zahlen auch an den Seiten ablesen. Dieses Rechteck ist sechs Kästchen lang und zwei Kästchen breit. Also hat es zwei Reihen mit je sechs Kästchen. Zwei mal sechs ist zwölf."
            show:
              drawn: grid
              cols: 8
              rows: 4
              lines: [[1, 1, 7, 1], [7, 1, 7, 3], [7, 3, 1, 3], [1, 3, 1, 1]]
          - text: "1 · 12 = 12\n2 · 6 = 12\n3 · 4 = 12\nVerschiedene Rechtecke, gleicher Flächeninhalt"
            say: "Verschiedene Rechtecke können gleich groß sein. Eine lange Reihe mit zwölf Kästchen, zwei Reihen mit je sechs und drei Reihen mit je vier: Alle drei Rechtecke haben einen Flächeninhalt von zwölf Kästchen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Malaufgabe passt zum Rechteck?"
                say: "Welche Malaufgabe passt zum Rechteck?"
                show:
                  drawn: grid
                  cols: 6
                  rows: 5
                  cells: [[1, 1, green], [2, 1, green], [3, 1, green], [4, 1, green], [1, 2, green], [2, 2, green], [3, 2, green], [4, 2, green], [1, 3, green], [2, 3, green], [3, 3, green], [4, 3, green]]
                options: ["3 · 4", "3 + 4", "4 · 4"]
                answer: "3 · 4"
                feedback:
                  "3 + 4": "Bei 3 + 4 zählst du nur die Kästchen an zwei Seiten. Es sind 3 Reihen mit je 4 Kästchen."
                hints:
                  - "Zähl die Reihen. Zähl dann die Kästchen in einer Reihe."
                  - "Es sind 3 Reihen, in jeder Reihe 4 Kästchen."
                  - "3 · 4."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Flächeninhalt = _ Kästchen"
                say: "Wie groß ist der Flächeninhalt des Rechtecks in Kästchen?"
                show:
                  drawn: grid
                  cols: 7
                  rows: 6
                  lines: [[1, 1, 6, 1], [6, 1, 6, 5], [6, 5, 1, 5], [1, 5, 1, 1]]
                answer: "20"
                hints:
                  - "Lies ab: Wie lang und wie breit ist das Rechteck?"
                  - "Es ist 5 Kästchen lang und 4 Kästchen breit."
                  - "4 · 5 = 20 Kästchen."
              - id: l2-f3
                type: multiple_choice
                text: "Ein Rechteck ist 7 Kästchen lang und 2 Kästchen breit. Wie groß ist sein Flächeninhalt?"
                say: "Ein Rechteck ist sieben Kästchen lang und zwei Kästchen breit. Wie groß ist sein Flächeninhalt?"
                options: ["14 Kästchen", "9 Kästchen", "18 Kästchen"]
                answer: "14 Kästchen"
                feedback:
                  "9 Kästchen": "Bei 7 + 2 zählst du nur die Kästchen an zwei Seiten. Rechne 2 · 7."
                  "18 Kästchen": "18 Kästchenseiten liegen am Rand. Für den Flächeninhalt zählst du die Kästchen innen."
                hints:
                  - "Stell dir 2 Reihen vor."
                  - "Jede Reihe hat 7 Kästchen. Rechne 2 · 7."
                  - "2 · 7 = 14 Kästchen."
              - id: l2-f4
                type: image_multiple_choice
                text: "Welches Rechteck hat einen Flächeninhalt von 12 Kästchen?"
                say: "Welches Rechteck hat einen Flächeninhalt von zwölf Kästchen?"
                options:
                  - { drawn: grid, cols: 6, rows: 5, lines: [[1, 1, 5, 1], [5, 1, 5, 4], [5, 4, 1, 4], [1, 4, 1, 1]], key: "12" }
                  - { drawn: grid, cols: 6, rows: 5, lines: [[1, 1, 4, 1], [4, 1, 4, 4], [4, 4, 1, 4], [1, 4, 1, 1]], key: "9" }
                  - { drawn: grid, cols: 6, rows: 5, lines: [[0, 1, 5, 1], [5, 1, 5, 3], [5, 3, 0, 3], [0, 3, 0, 1]], key: "10" }
                answer: "12"
                hints:
                  - "Lies bei jedem Rechteck ab, wie lang und wie breit es ist."
                  - "Rechne bei jedem Rechteck die Malaufgabe."
                  - "3 · 4 = 12. Such das Rechteck mit 3 Reihen zu je 4 Kästchen."
              - id: l2-f5
                type: true_false
                text: "Das blaue und das rote Rechteck sind gleich groß."
                say: "Stimmt das? Das blaue und das rote Rechteck haben den gleichen Flächeninhalt."
                show:
                  drawn: grid
