# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.order-compare-to-100
skill: math.numbers-to-100.order-compare
curriculum: de-DE
language: de
title:
  de: Ordnen und vergleichen bis 100
  en: Ordering and comparing to 100
summary: >
  Comparing two-digit numbers by looking at the tens first, then the
  ones. Lesson 1 compares and orders numbers with <, > and =; lesson 2
  finds Nachbarzahlen and Nachbarzehner (the tens before and after a
  number), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.number-line]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { de: [größer als, kleiner als, gleich, Nachbarzahl, Nachbarzehner, Vorgänger, Nachfolger] }
  forms: [drawn, text, audio]
  drawn: [base-ten, number-line]
  facets: [operation-signs]
  misconceptions:
    - id: ones-first
      what: Compares the ones digit first (thinks 29 > 41 because 9 > 1)
      addressed: Learn compares with base-ten blocks, tens first; feedback on 29 > 41 names the tens
    - id: sign-direction
      what: Writes the sign the wrong way round
      addressed: Learn says "Die offene Seite zeigt zur größeren Zahl"; the voice reads each sign as größer als or kleiner als
    - id: neighbour-ten-is-number
      what: Gives 47 and 49 as the Nachbarzehner of 48
      addressed: lesson 2 uses the number line with only tens labelled and says "Nachbarzehner sind Zehnerzahlen"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehner zuerst vergleichen, en: Compare the tens first }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "7 _ 4"
            say: "Welches Zeichen passt zwischen sieben und vier?"
            frame: "7 _ 4"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Zehner hat 63?"
            options: ["3", "6", "63"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "41 und 29"
            say: "Welche Zahl ist größer, einundvierzig oder neunundzwanzig? Schau zuerst auf die Zehner."
            show: { drawn: base-ten, tens: 4, ones: 1 }
          - text: "41 > 29"
            say: "Hier ist neunundzwanzig. Einundvierzig hatte vier Zehner, neunundzwanzig hat nur zwei. Vier Zehner sind mehr. Also ist einundvierzig größer, auch wenn neun mehr Einer sind als eins."
            show: { drawn: base-ten, tens: 2, ones: 9 }
          - text: "56 < 58"
            say: "Sind die Zehner gleich, schauen wir auf die Einer. Sechsundfünfzig und achtundfünfzig haben beide fünf Zehner. Sechs ist kleiner als acht. Die offene Seite des Zeichens zeigt zur größeren Zahl."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Zahl ist größer?"
                say: "Welche Zahl ist größer, zweiunddreißig oder dreiundzwanzig?"
                options: ["32", "23"]
                answer: "32"
                option_audio: false
                hints:
                  - "Schau zuerst auf die Zehner."
                  - "32 hat 3 Zehner, 23 hat 2 Zehner."
                  - "32 ist größer."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "29 _ 41"
                say: "Welches Zeichen passt zwischen neunundzwanzig und einundvierzig?"
                frame: "29 _ 41"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "Die 9 Einer sind viele, aber 41 hat mehr Zehner. Schau zuerst auf die Zehner."
                hints:
                  - "Wer hat mehr Zehner?"
                  - "41 hat 4 Zehner, 29 nur 2. 29 ist kleiner."
                  - "29 < 41"
              - id: l1-f3
                type: fill_in_blank
                text: "67 _ 64"
                say: "Welches Zeichen passt zwischen siebenundsechzig und vierundsechzig?"
                frame: "67 _ 64"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Die Zehner sind gleich. Schau auf die Einer."
                  - "7 ist mehr als 4."
                  - "67 > 64"
              - id: l1-f4
                type: ordering
                text: "Ordne die Zahlen. Die kleinste zuerst."
                options: ["45", "18", "81", "54"]
                slot_count: 4
                answer: ["18", "45", "54", "81"]
                hints:
                  - "Welche Zahl hat die wenigsten Zehner?"
                  - "18 hat nur einen Zehner. Dann kommt 45."
                  - "18, 45, 54, 81."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 70 > 69"
                say: "Siebzig ist größer als neunundsechzig. Stimmt das?"
                answer: true
                hints:
                  - "Vergleiche die Zehner."
                  - "70 hat 7 Zehner, 69 hat 6 Zehner."
                  - "Ja, 70 ist größer."
              - id: l1-f6
                type: multiple_choice
                text: "Welche Zahl ist am größten?"
                say: "Welche Zahl ist am größten?"
                options: ["39", "93", "88"]
                answer: "93"
                hints:
                  - "Wer hat die meisten Zehner?"
                  - "93 hat 9 Zehner."
                  - "93 ist am größten."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "38 _ 52"
                say: "Welches Zeichen passt zwischen achtunddreißig und zweiundfünfzig?"
                frame: "38 _ 52"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Zehner zuerst."]
              - id: l1-s2
                type: fill_in_blank
                text: "75 _ 75"
                say: "Welches Zeichen passt zwischen fünfundsiebzig und fünfundsiebzig?"
                frame: "75 _ 75"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Schau genau: Sind es dieselben Zahlen?"]
              - id: l1-s3
                type: ordering
                text: "Ordne die Zahlen. Die größte zuerst."
                options: ["26", "62", "60", "29"]
                slot_count: 4
                answer: ["62", "60", "29", "26"]
                hints: ["Bei gleichen Zehnern entscheiden die Einer."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 47 < 44"
                say: "Siebenundvierzig ist kleiner als vierundvierzig. Stimmt das?"
                answer: false
                hints: ["Gleiche Zehner. Wer hat mehr Einer?"]
              - id: l1-s5
                type: fill_in_blank
                text: "_ > 85"
                say: "Welche Zahl passt? Sie soll größer als fünfundachtzig sein."
                frame: "_ > 85"
                options: ["58", "80", "91"]
                answer: ["91"]
                hints: ["Mehr Zehner oder gleiche Zehner und mehr Einer."]
              - id: l1-s6
                type: multiple_choice
                text: "Welche Zahl ist am kleinsten?"
                options: ["71", "17", "70"]
                answer: "17"
                hints: ["Wer hat die wenigsten Zehner?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "83 _ 38"
                say: "Welches Zeichen passt zwischen dreiundachtzig und achtunddreißig?"
                frame: "83 _ 38"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
              - id: l1-n2
                type: ordering
                text: "Ordne die Zahlen. Die kleinste zuerst."
                options: ["99", "9", "90", "19"]
                slot_count: 4
                answer: ["9", "19", "90", "99"]
              - id: l1-n3
                type: fill_in_blank
                text: "51 _ 59"
                say: "Welches Zeichen passt zwischen einundfünfzig und neunundfünfzig?"
                frame: "51 _ 59"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 100 > 99"
                say: "Hundert ist größer als neunundneunzig. Stimmt das?"
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "_ < 42"
                say: "Welche Zahl passt? Sie soll kleiner als zweiundvierzig sein."
                frame: "_ < 42"
                options: ["24", "46", "52"]
                answer: ["24"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "64 _ 46"
            say: "Welches Zeichen passt zwischen vierundsechzig und sechsundvierzig?"
            frame: "64 _ 46"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l1-c2
            type: ordering
            text: "Ordne die Zahlen. Die kleinste zuerst."
            options: ["57", "75", "50", "70"]
            slot_count: 4
            answer: ["50", "57", "70", "75"]
          - id: l1-c3
            type: fill_in_blank
            text: "33 _ 36"
            say: "Welches Zeichen passt zwischen dreiunddreißig und sechsunddreißig?"
            frame: "33 _ 36"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false

  - n: 2
    title: { de: Nachbarzahlen und Nachbarzehner, en: Neighbouring numbers and tens }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "48 _ 84"
            say: "Welches Zeichen passt zwischen achtundvierzig und vierundachtzig?"
            frame: "48 _ 84"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Zahl ist größer?"
            say: "Welche Zahl ist größer, sechzig oder sechsundfünfzig?"
            options: ["60", "56"]
            answer: "60"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "47, 48, 49"
            say: "Die Nachbarzahlen von achtundvierzig sind die Zahlen direkt davor und danach: siebenundvierzig und neunundvierzig."
            show: { drawn: number-line, from: 40, to: 50, labels: ends, mark: 48 }
          - text: "40, 48, 50"
            say: "Die Nachbarzehner sind die Zehnerzahlen davor und danach. Achtundvierzig liegt zwischen vierzig und fünfzig. Vierzig und fünfzig sind die Nachbarzehner."
            show: { drawn: number-line, from: 40, to: 50, labels: ends, mark: 48 }
          - text: "50"
            say: "Welcher Nachbarzehner ist näher? Von achtundvierzig bis fünfzig sind es nur zwei Schritte. Fünfzig ist näher."
            show: { drawn: number-line, from: 40, to: 50, labels: ends, mark: 48 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "_ , 63, _"
                say: "Welche Zahlen sind die Nachbarzahlen von dreiundsechzig?"
                frame: "_ , 63, _"
                options: ["53", "62", "64", "73"]
                answer: ["62", "64"]
                hints:
                  - "Nachbarzahlen sind eins davor und eins danach."
                  - "63 minus 1, 63 plus 1."
                  - "62 und 64."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Nachbarzehner: _ , 27, _"
                say: "Welche Zahlen sind die Nachbarzehner von siebenundzwanzig?"
                show: { drawn: number-line, from: 20, to: 30, labels: ends, mark: 27 }
                frame: "_ , 27, _"
                options: ["20", "26", "28", "30"]
                answer: ["20", "30"]
                feedback:
                  "26": "26 ist eine Nachbarzahl. Nachbarzehner sind Zehnerzahlen."
                hints:
                  - "Nachbarzehner sind Zehnerzahlen."
                  - "Welche Zehnerzahl kommt vor 27, welche danach?"
                  - "20 und 30."
              - id: l2-f3
                type: fill_in_blank
                text: "_ , 70, _"
                say: "Welche Zahlen sind die Nachbarzahlen von siebzig?"
                frame: "_ , 70, _"
                options: ["60", "69", "71", "80"]
                answer: ["69", "71"]
                hints:
                  - "Eins davor und eins danach."
                  - "Vor 70 kommt 69."
                  - "69 und 71."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Zehner ist näher an 52?"
                say: "Zweiundfünfzig liegt zwischen fünfzig und sechzig. Welcher Zehner ist näher?"
                show: { drawn: number-line, from: 50, to: 60, labels: ends, mark: 52 }
                options: ["50", "60"]
                answer: "50"
                hints:
                  - "Zähl die Schritte zu jedem Zehner."
                  - "Bis 50 sind es 2, bis 60 sind es 8."
                  - "50 ist näher."
              - id: l2-f5
                type: fill_in_blank
                text: "Nachbarzehner: _ , 84, _"
                say: "Welche Zahlen sind die Nachbarzehner von vierundachtzig?"
                frame: "_ , 84, _"
                options: ["70", "80", "85", "90"]
                answer: ["80", "90"]
                hints:
                  - "Nachbarzehner sind Zehnerzahlen."
                  - "84 liegt zwischen 80 und 90."
                  - "80 und 90."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? Die Nachbarzahlen von 40 sind 30 und 50."
                say: "Die Nachbarzahlen von vierzig sind dreißig und fünfzig. Stimmt das?"
                answer: false
                hints:
                  - "Nachbarzahlen sind eins davor und eins danach."
                  - "Vor 40 kommt 39."
                  - "Nein, die Nachbarzahlen sind 39 und 41."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "_ , 39, _"
                say: "Welche Zahlen sind die Nachbarzahlen von neununddreißig?"
                frame: "_ , 39, _"
                options: ["29", "38", "40", "49"]
                answer: ["38", "40"]
                hints: ["Nach 39 kommt eine Zehnerzahl."]
              - id: l2-s2
                type: fill_in_blank
                text: "Nachbarzehner: _ , 56, _"
                say: "Welche Zahlen sind die Nachbarzehner von sechsundfünfzig?"
                frame: "_ , 56, _"
                options: ["50", "55", "57", "60"]
                answer: ["50", "60"]
                hints: ["Zehnerzahlen davor und danach."]
              - id: l2-s3
                type: multiple_choice
                text: "Welcher Zehner ist näher an 78?"
                say: "Achtundsiebzig liegt zwischen siebzig und achtzig. Welcher Zehner ist näher?"
                show: { drawn: number-line, from: 70, to: 80, labels: ends, mark: 78 }
                options: ["70", "80"]
                answer: "80"
                hints: ["Zähl die Schritte."]
              - id: l2-s4
                type: fill_in_blank
                text: "_ , 91, _"
                say: "Welche Zahlen sind die Nachbarzahlen von einundneunzig?"
                frame: "_ , 91, _"
                options: ["81", "90", "92", "100"]
                answer: ["90", "92"]
                hints: ["Eins davor, eins danach."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? Die Nachbarzehner von 13 sind 10 und 20."
                say: "Die Nachbarzehner von dreizehn sind zehn und zwanzig. Stimmt das?"
                answer: true
                hints: ["13 liegt zwischen welchen Zehnerzahlen?"]
              - id: l2-s6
                type: multiple_choice
                text: "Welcher Zehner ist näher an 34?"
                say: "Vierunddreißig liegt zwischen dreißig und vierzig. Welcher Zehner ist näher?"
                options: ["30", "40"]
                answer: "30"
                hints: ["Bis 30 sind es 4 Schritte."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "_ , 50, _"
                say: "Welche Zahlen sind die Nachbarzahlen von fünfzig?"
                frame: "_ , 50, _"
                options: ["40", "49", "51", "60"]
                answer: ["49", "51"]
              - id: l2-n2
                type: fill_in_blank
                text: "Nachbarzehner: _ , 42, _"
                say: "Welche Zahlen sind die Nachbarzehner von zweiundvierzig?"
                frame: "_ , 42, _"
                options: ["30", "40", "50", "41"]
                answer: ["40", "50"]
              - id: l2-n3
                type: multiple_choice
                text: "Welcher Zehner ist näher an 69?"
                say: "Neunundsechzig liegt zwischen sechzig und siebzig. Welcher Zehner ist näher?"
                options: ["60", "70"]
                answer: "70"
              - id: l2-n4
                type: fill_in_blank
                text: "Nachbarzehner: _ , 95, _"
                say: "Welche Zahlen sind die Nachbarzehner von fünfundneunzig?"
                frame: "_ , 95, _"
                options: ["80", "90", "96", "100"]
                answer: ["90", "100"]
              - id: l2-n5
                type: fill_in_blank
                text: "_ , 18, _"
                say: "Welche Zahlen sind die Nachbarzahlen von achtzehn?"
                frame: "_ , 18, _"
                options: ["8", "17", "19", "28"]
                answer: ["17", "19"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "59 _ 61"
            say: "Welches Zeichen passt zwischen neunundfünfzig und einundsechzig?"
            frame: "59 _ 61"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c2
            type: ordering
            text: "Ordne die Zahlen. Die größte zuerst."
            options: ["34", "43", "40", "30"]
            slot_count: 4
            answer: ["43", "40", "34", "30"]
          - id: l2-c3
            type: fill_in_blank
            text: "_ , 80, _"
            say: "Welche Zahlen sind die Nachbarzahlen von achtzig?"
            frame: "_ , 80, _"
            options: ["70", "79", "81", "90"]
            answer: ["79", "81"]
          - id: l2-c4
            type: fill_in_blank
            text: "Nachbarzehner: _ , 66, _"
            say: "Welche Zahlen sind die Nachbarzehner von sechsundsechzig?"
            frame: "_ , 66, _"
            options: ["50", "60", "65", "70"]
            answer: ["60", "70"]
          - id: l2-c5
            type: multiple_choice
            text: "Welcher Zehner ist näher an 23?"
            say: "Dreiundzwanzig liegt zwischen zwanzig und dreißig. Welcher Zehner ist näher?"
            options: ["20", "30"]
            answer: "20"
