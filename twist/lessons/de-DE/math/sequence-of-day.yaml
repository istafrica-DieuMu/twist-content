# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.sequence-of-day
skill: math.time.sequence-of-day
curriculum: de-DE
language: de
title:
  de: Tagesablauf, Wochentage und Monate
  en: The day, the days of the week and the months
summary: >
  Lesson 1 puts the events of a day in order (morgens, mittags, abends,
  nachts) and says what comes before and after; lesson 2 names the seven
  days of the week in order with gestern, heute and morgen; lesson 3
  names the twelve months in order and the seasons they belong to, and
  ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Zeit, en: Time }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [morgens, mittags, nachmittags, abends, nachts, vorher, nachher, gestern, heute, morgen, Woche, Wochentag, Monat, Jahreszeit] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: week-starts-sunday
      what: Starts the week on Sonntag or thinks Sonntag comes before Montag in the same week, as on some calendars
      addressed: lesson 2 Learn says the German week starts on Montag and ends on Sonntag; l2-f3 and l2-s3 ask which day comes after Sonntag
    - id: morgen-morning-tomorrow
      what: Mixes up morgen (tomorrow) and der Morgen (the morning)
      addressed: lesson 2 Learn says both meanings; l2-f4, l2-s4 and l2-n4 ask which day morgen is, with feedback in l2-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mein Tag", en: "My day" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "morgens · mittags · abends · nachts"
            say: "Ein Tag hat verschiedene Zeiten. Morgens stehst du auf. Mittags isst du zu Mittag. Abends wird es dunkel. Nachts schläfst du."
          - text: "aufstehen → frühstücken → zur Schule gehen"
            say: "Morgens passiert vieles nacheinander. Zuerst stehst du auf. Dann frühstückst du. Danach gehst du zur Schule."
          - text: "vorher · nachher"
            say: "Das Frühstück kommt vor der Schule. Die Schule kommt nach dem Frühstück. Vorher und nachher sagen dir die Reihenfolge."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Was kommt zuerst? Ordne."
                say: "Was machst du morgens? Bring es in die richtige Reihenfolge: frühstücken, zur Schule gehen, aufstehen."
                options: ["frühstücken", "zur Schule gehen", "aufstehen"]
                slot_count: 3
                answer: ["aufstehen", "frühstücken", "zur Schule gehen"]
                hints:
                  - "Was machst du ganz am Anfang?"
                  - "Zuerst stehst du auf, dann frühstückst du."
                  - "aufstehen, frühstücken, zur Schule gehen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wann schläfst du?"
                say: "Wann schläfst du?"
                options: ["nachts", "mittags", "morgens"]
                answer: "nachts"
                hints:
                  - "Wann ist es dunkel?"
                  - "Nach dem Abend kommt die Nacht."
                  - "nachts."
              - id: l1-f3
                type: multiple_choice
                text: "Was machst du vor dem Schlafengehen?"
                say: "Was machst du vor dem Schlafengehen?"
                options: ["Zähne putzen", "frühstücken", "zur Schule gehen"]
                answer: "Zähne putzen"
                hints:
                  - "Vor dem Schlafengehen ist es Abend."
                  - "Frühstück gibt es am Morgen."
                  - "Zähne putzen."
              - id: l1-f4
                type: true_false
                text: "Das Mittagessen kommt nach dem Frühstück."
                say: "Stimmt das? Das Mittagessen kommt nach dem Frühstück."
                answer: true
                hints:
                  - "Wann frühstückst du? Wann isst du zu Mittag?"
                  - "Morgens frühstückst du, mittags isst du zu Mittag."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: ordering
                text: "Ordne den Tag."
                say: "Ordne die Tageszeiten: abends, morgens, mittags."
                options: ["abends", "morgens", "mittags"]
                slot_count: 3
                answer: ["morgens", "mittags", "abends"]
                hints:
                  - "Womit fängt der Tag an?"
                  - "Morgens, dann mittags."
                  - "morgens, mittags, abends."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Was kommt zuerst? Ordne."
                say: "Was machst du abends? Bring es in die richtige Reihenfolge: einschlafen, zu Abend essen, ins Bett gehen."
                options: ["einschlafen", "zu Abend essen", "ins Bett gehen"]
                slot_count: 3
                answer: ["zu Abend essen", "ins Bett gehen", "einschlafen"]
                hints: ["Was machst du ganz zum Schluss?"]
              - id: l1-s2
                type: multiple_choice
                text: "Wann frühstückst du?"
                say: "Wann frühstückst du?"
                options: ["morgens", "abends", "nachts"]
                answer: "morgens"
                hints: ["Frühstück ist die erste Mahlzeit am Tag."]
              - id: l1-s3
                type: multiple_choice
                text: "Was machst du nach der Schule?"
                say: "Was machst du nach der Schule?"
                options: ["Hausaufgaben machen", "aufstehen", "frühstücken"]
                answer: "Hausaufgaben machen"
                hints: ["Aufstehen und frühstücken machst du vor der Schule."]
              - id: l1-s4
                type: true_false
                text: "Du gehst morgens ins Bett."
                say: "Stimmt das? Du gehst morgens ins Bett."
                answer: false
                hints: ["Wann gehst du schlafen?"]
              - id: l1-s5
                type: ordering
                text: "Ordne den Tag."
                say: "Ordne die Tageszeiten: nachts, mittags, morgens."
                options: ["nachts", "mittags", "morgens"]
                slot_count: 3
                answer: ["morgens", "mittags", "nachts"]
                hints: ["Der Tag fängt morgens an."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Was kommt zuerst? Ordne."
                say: "Bring es in die richtige Reihenfolge: anziehen, aufwachen, aus dem Haus gehen."
                options: ["anziehen", "aufwachen", "aus dem Haus gehen"]
                slot_count: 3
                answer: ["aufwachen", "anziehen", "aus dem Haus gehen"]
              - id: l1-n2
                type: multiple_choice
                text: "Wann isst du zu Mittag?"
                say: "Wann isst du zu Mittag?"
                options: ["mittags", "nachts", "morgens"]
                answer: "mittags"
              - id: l1-n3
                type: multiple_choice
                text: "Was machst du am Morgen vor dem Frühstück?"
                say: "Was machst du am Morgen vor dem Frühstück?"
                options: ["aufstehen", "zu Abend essen", "schlafen gehen"]
                answer: "aufstehen"
              - id: l1-n4
                type: true_false
                text: "Abends wird es dunkel."
                say: "Stimmt das? Abends wird es dunkel."
                answer: true
              - id: l1-n5
                type: ordering
                text: "Ordne den Tag."
                say: "Ordne die Tageszeiten: nachts, abends, morgens, mittags."
                options: ["nachts", "abends", "morgens", "mittags"]
                slot_count: 4
                answer: ["morgens", "mittags", "abends", "nachts"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "Was kommt zuerst? Ordne."
            say: "Bring es in die richtige Reihenfolge: Zähne putzen, ins Bett gehen, zu Abend essen."
            options: ["ins Bett gehen", "zu Abend essen", "Zähne putzen"]
            slot_count: 3
            answer: ["zu Abend essen", "Zähne putzen", "ins Bett gehen"]
          - id: l1-c2
            type: multiple_choice
            text: "Wann gehst du zur Schule?"
            say: "Wann gehst du zur Schule?"
            options: ["morgens", "abends", "nachts"]
            answer: "morgens"
          - id: l1-c3
            type: true_false
            text: "Am selben Tag kommt das Abendessen vor dem Frühstück."
            say: "Stimmt das? Am selben Tag kommt das Abendessen vor dem Frühstück."
            answer: false

  - n: 2
    title: { de: "Die Wochentage", en: "The days of the week" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wann schläfst du?"
            say: "Wann schläfst du?"
            options: ["nachts", "mittags"]
            answer: "nachts"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was kommt nach 6?"
            say: "Welche Zahl kommt nach sechs?"
            options: ["7", "5", "8"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag"
            say: "Eine Woche hat sieben Tage. Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag. Bei uns fängt die Woche am Montag an. Nach dem Sonntag kommt wieder Montag."
          - text: "gestern · heute · morgen"
            say: "Heute ist Mittwoch. Gestern war der Tag davor: Dienstag. Morgen ist der Tag danach: Donnerstag."
          - text: "morgen = der nächste Tag · der Morgen = früh am Tag"
            say: "Aufgepasst: Morgen heißt der nächste Tag. Der Morgen ist die Zeit früh am Tag. Morgen früh heißt: am nächsten Tag am Morgen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Tag kommt nach Dienstag?"
                say: "Welcher Tag kommt nach Dienstag?"
                options: ["Mittwoch", "Montag", "Donnerstag"]
                answer: "Mittwoch"
                hints:
                  - "Sag die Tage auf: Montag, Dienstag ..."
                  - "Nach Dienstag kommt die Mitte der Woche."
                  - "Mittwoch."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Ordne die Tage."
                say: "Ordne die Tage: Freitag, Mittwoch, Donnerstag."
                options: ["Freitag", "Mittwoch", "Donnerstag"]
                slot_count: 3
                answer: ["Mittwoch", "Donnerstag", "Freitag"]
                hints:
                  - "Welcher Tag ist die Mitte der Woche?"
                  - "Nach Mittwoch kommt Donnerstag."
                  - "Mittwoch, Donnerstag, Freitag."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Tag kommt nach Sonntag?"
                say: "Welcher Tag kommt nach Sonntag?"
                options: ["Montag", "Samstag", "Dienstag"]
                answer: "Montag"
                hints:
                  - "Sonntag ist der letzte Tag der Woche."
                  - "Dann fängt eine neue Woche an."
                  - "Montag."
              - id: l2-f4
                type: multiple_choice
                text: "Heute ist Montag. Welcher Tag ist morgen?"
                say: "Heute ist Montag. Welcher Tag ist morgen?"
                options: ["Dienstag", "Sonntag", "Montag früh"]
                answer: "Dienstag"
                feedback:
                  "Sonntag": "Sonntag war gestern. Morgen ist der Tag danach."
                  "Montag früh": "Das ist der Morgen von heute. Morgen ist der nächste Tag."
                hints:
                  - "Morgen ist der Tag nach heute."
                  - "Nach Montag kommt ..."
                  - "Dienstag."
              - id: l2-f5
                type: true_false
                text: "Eine Woche hat 7 Tage."
                say: "Stimmt das? Eine Woche hat sieben Tage."
                answer: true
                hints:
                  - "Zähl die Tage von Montag bis Sonntag."
                  - "Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag."
                  - "Ja, sieben Tage."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Tag kommt vor Freitag?"
                say: "Welcher Tag kommt vor Freitag?"
                options: ["Donnerstag", "Samstag", "Mittwoch"]
                answer: "Donnerstag"
                hints: ["Vor heißt: der Tag davor."]
              - id: l2-s2
                type: ordering
                text: "Ordne die Tage."
                say: "Ordne die Tage: Dienstag, Sonntag, Samstag."
                options: ["Dienstag", "Sonntag", "Samstag"]
                slot_count: 3
                answer: ["Dienstag", "Samstag", "Sonntag"]
                hints: ["Das Wochenende kommt am Ende der Woche."]
              - id: l2-s3
                type: true_false
                text: "Nach Sonntag kommt Samstag."
                say: "Stimmt das? Nach Sonntag kommt Samstag."
                answer: false
                hints: ["Nach Sonntag fängt eine neue Woche an."]
              - id: l2-s4
                type: multiple_choice
                text: "Heute ist Donnerstag. Welcher Tag ist morgen?"
                say: "Heute ist Donnerstag. Welcher Tag ist morgen?"
                options: ["Freitag", "Mittwoch", "Donnerstag früh"]
                answer: "Freitag"
                hints: ["Morgen ist der Tag nach heute."]
              - id: l2-s5
                type: multiple_choice
                text: "Heute ist Mittwoch. Welcher Tag war gestern?"
                say: "Heute ist Mittwoch. Welcher Tag war gestern?"
                options: ["Dienstag", "Donnerstag", "Montag"]
                answer: "Dienstag"
                hints: ["Gestern ist der Tag vor heute."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Tag kommt nach Freitag?"
                say: "Welcher Tag kommt nach Freitag?"
                options: ["Samstag", "Donnerstag", "Sonntag"]
                answer: "Samstag"
              - id: l2-n2
                type: ordering
                text: "Ordne die Tage."
                say: "Ordne die Tage: Donnerstag, Montag, Dienstag, Mittwoch."
                options: ["Donnerstag", "Montag", "Dienstag", "Mittwoch"]
                slot_count: 4
                answer: ["Montag", "Dienstag", "Mittwoch", "Donnerstag"]
              - id: l2-n3
                type: multiple_choice
                text: "Mit welchem Tag fängt die Woche an?"
                say: "Mit welchem Tag fängt bei uns die Woche an?"
                options: ["Montag", "Sonntag", "Samstag"]
                answer: "Montag"
              - id: l2-n4
                type: multiple_choice
                text: "Heute ist Samstag. Welcher Tag ist morgen?"
                say: "Heute ist Samstag. Welcher Tag ist morgen?"
                options: ["Sonntag", "Freitag", "Montag"]
                answer: "Sonntag"
              - id: l2-n5
                type: multiple_choice
                text: "Heute ist Montag. Welcher Tag war gestern?"
                say: "Heute ist Montag. Welcher Tag war gestern?"
                options: ["Sonntag", "Dienstag", "Samstag"]
                answer: "Sonntag"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welcher Tag kommt nach Mittwoch?"
            say: "Welcher Tag kommt nach Mittwoch?"
            options: ["Donnerstag", "Dienstag", "Freitag"]
            answer: "Donnerstag"
          - id: l2-c2
            type: multiple_choice
            text: "Heute ist Dienstag. Welcher Tag ist morgen?"
            say: "Heute ist Dienstag. Welcher Tag ist morgen?"
            options: ["Mittwoch", "Montag", "Donnerstag"]
            answer: "Mittwoch"
          - id: l2-c3
            type: true_false
            text: "Samstag und Sonntag sind das Wochenende."
            say: "Stimmt das? Samstag und Sonntag sind das Wochenende."
            answer: true

  - n: 3
    title: { de: "Die Monate", en: "The months" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Welcher Tag kommt nach Donnerstag?"
            say: "Welcher Tag kommt nach Donnerstag?"
            options: ["Freitag", "Mittwoch"]
            answer: "Freitag"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "Heute ist Freitag. Welcher Tag ist morgen?"
            say: "Heute ist Freitag. Welcher Tag ist morgen?"
            options: ["Samstag", "Donnerstag"]
            answer: "Samstag"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Januar, Februar, März, April, Mai, Juni"
            say: "Ein Jahr hat zwölf Monate. Die ersten sechs: Januar, Februar, März, April, Mai, Juni."
          - text: "Juli, August, September, Oktober, November, Dezember"
            say: "Dann kommen Juli, August, September, Oktober, November und Dezember. Nach Dezember fängt ein neues Jahr an, wieder mit Januar."
          - text: "Frühling · Sommer · Herbst · Winter"
            say: "Ein Jahr hat vier Jahreszeiten. Im Frühling blühen die Blumen, zum Beispiel im April. Im Sommer ist es warm, zum Beispiel im Juli. Im Herbst fallen die Blätter, zum Beispiel im Oktober. Im Winter ist es kalt, zum Beispiel im Januar."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Welcher Monat kommt nach März?"
                say: "Welcher Monat kommt nach März?"
                options: ["April", "Februar", "Mai"]
                answer: "April"
                hints:
                  - "Sag die Monate auf: Januar, Februar, März ..."
                  - "Nach März kommt der vierte Monat."
                  - "April."
                difficulty: easy
              - id: l3-f2
                type: ordering
                text: "Ordne die Monate."
                say: "Ordne die Monate: Juni, April, Mai."
                options: ["Juni", "April", "Mai"]
                slot_count: 3
                answer: ["April", "Mai", "Juni"]
                hints:
                  - "Welcher kommt im Jahr zuerst?"
                  - "April, dann Mai."
                  - "April, Mai, Juni."
              - id: l3-f3
                type: multiple_choice
                text: "Welcher Monat kommt nach Dezember?"
                say: "Welcher Monat kommt nach Dezember?"
                options: ["Januar", "November", "Februar"]
                answer: "Januar"
                hints:
                  - "Dezember ist der letzte Monat."
                  - "Dann fängt ein neues Jahr an."
                  - "Januar."
              - id: l3-f4
                type: true_false
                text: "Ein Jahr hat 12 Monate."
                say: "Stimmt das? Ein Jahr hat zwölf Monate."
                answer: true
                hints:
                  - "Zähl von Januar bis Dezember."
                  - "Erst sechs Monate bis Juni, dann noch sechs."
                  - "Ja, zwölf Monate."
              - id: l3-f5
                type: multiple_choice
                text: "In welcher Jahreszeit ist der Juli?"
                say: "In welcher Jahreszeit ist der Juli?"
                options: ["im Sommer", "im Winter", "im Herbst"]
                answer: "im Sommer"
                hints:
                  - "Im Juli sind oft Sommerferien."
                  - "Dann ist es warm."
                  - "im Sommer."

          - support: some
            tasks:
              - id: l3-s1
                type: multiple_choice
                text: "Welcher Monat kommt vor August?"
                say: "Welcher Monat kommt vor August?"
                options: ["Juli", "September", "Juni"]
                answer: "Juli"
                hints: ["Vor heißt: der Monat davor."]
              - id: l3-s2
                type: ordering
                text: "Ordne die Monate."
                say: "Ordne die Monate: November, September, Oktober."
                options: ["November", "September", "Oktober"]
                slot_count: 3
                answer: ["September", "Oktober", "November"]
                hints: ["Welcher Monat kommt nach dem August?"]
              - id: l3-s3
                type: multiple_choice
                text: "Mit welchem Monat fängt das Jahr an?"
                say: "Mit welchem Monat fängt das Jahr an?"
                options: ["Januar", "Dezember", "März"]
                answer: "Januar"
                hints: ["An Silvester endet das Jahr."]
              - id: l3-s4
                type: true_false
                text: "Der Januar ist im Sommer."
                say: "Stimmt das? Der Januar ist im Sommer."
                answer: false
                hints: ["Im Januar ist es bei uns kalt."]
              - id: l3-s5
                type: multiple_choice
                text: "In welcher Jahreszeit ist der Oktober?"
                say: "In welcher Jahreszeit ist der Oktober?"
                options: ["im Herbst", "im Frühling", "im Sommer"]
                answer: "im Herbst"
                hints: ["Im Oktober fallen die bunten Blätter."]

          - support: none
            tasks:
              - id: l3-n1
                type: multiple_choice
                text: "Welcher Monat kommt nach Mai?"
                say: "Welcher Monat kommt nach Mai?"
                options: ["Juni", "April", "Juli"]
                answer: "Juni"
              - id: l3-n2
                type: ordering
                text: "Ordne die Monate."
                say: "Ordne die Monate: März, Januar, April, Februar."
                options: ["März", "Januar", "April", "Februar"]
                slot_count: 4
                answer: ["Januar", "Februar", "März", "April"]
              - id: l3-n3
                type: multiple_choice
                text: "Welcher Monat ist der letzte im Jahr?"
                say: "Welcher Monat ist der letzte im Jahr?"
                options: ["Dezember", "November", "Januar"]
                answer: "Dezember"
              - id: l3-n4
                type: true_false
                text: "Im April ist Frühling."
                say: "Stimmt das? Im April ist Frühling."
                answer: true
              - id: l3-n5
                type: multiple_choice
                text: "In welcher Jahreszeit ist der Februar?"
                say: "In welcher Jahreszeit ist der Februar?"
                options: ["im Winter", "im Sommer", "im Herbst"]
                answer: "im Winter"

      - activity: check
        size: skill
        tasks:
          - id: l3-c1
            type: ordering
            text: "Ordne die Mahlzeiten."
            say: "Ordne die Mahlzeiten am Tag: zu Abend essen, frühstücken, zu Mittag essen."
            options: ["zu Abend essen", "frühstücken", "zu Mittag essen"]
            slot_count: 3
            answer: ["frühstücken", "zu Mittag essen", "zu Abend essen"]
          - id: l3-c2
            type: multiple_choice
            text: "Welcher Tag kommt nach Samstag?"
            say: "Welcher Tag kommt nach Samstag?"
            options: ["Sonntag", "Freitag", "Montag"]
            answer: "Sonntag"
          - id: l3-c3
            type: multiple_choice
            text: "Heute ist Sonntag. Welcher Tag ist morgen?"
            say: "Heute ist Sonntag. Welcher Tag ist morgen?"
            options: ["Montag", "Samstag", "Dienstag"]
            answer: "Montag"
          - id: l3-c4
            type: ordering
            text: "Ordne die Monate."
            say: "Ordne die Monate: August, Juli, September."
            options: ["August", "Juli", "September"]
            slot_count: 3
            answer: ["Juli", "August", "September"]
          - id: l3-c5
            type: multiple_choice
            text: "Welcher Monat kommt vor Juni?"
            say: "Welcher Monat kommt vor Juni?"
            options: ["Mai", "Juli", "April"]
            answer: "Mai"
