# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.compare-to-10
skill: math.numbers-to-20.compare-to-10
curriculum: de-DE
language: de
title:
  de: Vergleichen bis 10
  en: Comparing to 10
summary: >
  Children compare amounts and numbers to 10. Lesson 1 compares groups:
  more, fewer, the same. Lesson 2 brings the signs <, > and =, with one
  rule to remember: the open side faces the bigger number. Lesson 3 uses
  the signs with numbers and with pictures, and ends with the skill check.
  Sign tasks have no option audio, because hearing "kleiner als" on a sign
  would give the answer.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.count-to-10, math.numbers-to-20.write-numerals-to-10]
  also_practises: [math.numbers-to-20.subitize-to-10]
  vocabulary: { de: [mehr, weniger, gleich viele, größer, kleiner, gleich, "<", ">", "="] }
  forms: [picture, drawn, text, audio]
  drawn: [dots, letter-card]
  facets: []
  misconceptions:
    - id: bigger-picture
      what: Thinks the group that takes up more space has more, even when it has fewer things
      addressed: lesson 1 sets a spread-out group against a closer one with more; hints say "Zähl beide Gruppen."
    - id: sign-direction
      what: Writes < and > the wrong way round
      addressed: lesson 2 Learn gives one rule ("Die offene Seite zeigt zur größeren Zahl"); feedback on the wrong sign repeats it
    - id: equal-sign
      what: Uses = only for "the answer comes next", not for "the same"
      addressed: lesson 1 Learn shows equal groups as gleich viele, lesson 2 Learn writes 4 = 4; true_false tasks ask whether 5 = 5 and 6 = 6, and gap tasks need = for 3 _ 3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Mehr, weniger, gleich viele", en: "More, fewer, the same" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Äpfel sind es?"
            show: { object: apple, count: 6, layout: row }
            options: ["5", "6", "7"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: tap_to_count
            text: "Tippe jeden Ball einmal an. Wie viele sind es?"
            show: { object: ball, count: 4, layout: scattered }
            options: ["3", "4", "5"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "mehr"
            say: "Oben sind fünf rote Punkte, unten drei blaue. Fünf sind mehr als drei."
            show: { drawn: dots, groups: [5, 3], layout: row }
          - text: "weniger"
            say: "Drei sind weniger als fünf. Gibst du jedem roten Punkt einen blauen Partner, bleiben zwei rote übrig."
            show: { drawn: dots, groups: [5, 3], layout: row }
          - text: "gleich viele"
            say: "Vier rote und vier blaue: Jeder hat einen Partner, keiner bleibt übrig. Das sind gleich viele."
            show: { drawn: dots, groups: [4, 4], layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Wo sind mehr?"
                options:
                  - { object: strawberry, count: 3, layout: row }
                  - { object: strawberry, count: 5, layout: row }
                answer: "5"
                hints:
                  - "Zähl die Erdbeeren in beiden Bildern."
                  - "In einem Bild sind drei, im anderen fünf."
                  - "Fünf sind mehr als drei."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Wo sind weniger?"
                options:
                  - { object: fish, count: 7, layout: scattered }
                  - { object: fish, count: 4, layout: scattered }
                answer: "4"
                hints:
                  - "Weniger heißt: nicht so viele."
                  - "Zähl beide Gruppen: sieben und vier."
                  - "Vier sind weniger als sieben."
              - id: l1-f3
                type: true_false
                text: "Sind es gleich viele?"
                say: "Sind es gleich viele rote und blaue Punkte?"
                show: { drawn: dots, groups: [5, 5], layout: row }
                answer: true
                hints:
                  - "Zähl die roten und die blauen."
                  - "Fünf rote, fünf blaue."
                  - "Ja, es sind gleich viele."
              - id: l1-f4
                type: image_multiple_choice
                text: "Wo sind mehr?"
                say: "Wo sind mehr Murmeln? Pass auf, zähl genau!"
                options:
                  - { object: marble, count: 4, layout: scattered }
                  - { object: marble, count: 6, layout: row }
                answer: "6"
                feedback:
                  "4": "Die Murmeln liegen weit auseinander, aber es sind nur vier. Zähl beide Gruppen."
                hints:
                  - "Lass dich nicht täuschen: Zähl beide Gruppen."
                  - "Hier sind vier, dort sind sechs."
                  - "Sechs sind mehr als vier."
              - id: l1-f5
                type: ordering
                text: "Ordne die Bilder. Die wenigsten Punkte kommen zuerst."
                options:
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                slot_count: 3
                answer: ["2", "4", "6"]
                hints:
                  - "Welches Würfelbild hat die wenigsten Punkte?"
                  - "Zwei, dann vier, dann sechs."
                  - "Die Reihe ist zwei, vier, sechs Punkte."
              - id: l1-f6
                type: true_false
                text: "Sind es gleich viele?"
                say: "Sind es gleich viele rote und blaue?"
                show: { drawn: dots, groups: [4, 3], layout: row }
                answer: false
                hints:
                  - "Zähl die roten und die blauen."
                  - "Vier rote, drei blaue."
                  - "Nein, es sind nicht gleich viele."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wo sind mehr?"
                options:
                  - { object: carrot, count: 8, layout: row }
                  - { object: carrot, count: 6, layout: row }
                answer: "8"
                hints: ["Zähl beide Gruppen."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Wo sind weniger?"
                options:
                  - { object: egg, count: 5, layout: row }
                  - { object: egg, count: 9, layout: scattered }
                answer: "5"
                hints: ["Weniger heißt: nicht so viele."]
              - id: l1-s3
                type: true_false
                text: "Sind es gleich viele?"
                say: "Sind es gleich viele rote und blaue?"
                show: { drawn: dots, groups: [3, 3], layout: row }
                answer: true
                hints: ["Gib jedem roten Punkt einen blauen Partner."]
              - id: l1-s4
                type: ordering
                text: "Ordne die Bilder. Die wenigsten Punkte kommen zuerst."
                options:
                  - { drawn: dots, count: 9, layout: five-structure, colour_split: [5, 4] }
                  - { drawn: dots, count: 5, layout: five-structure }
                  - { drawn: dots, count: 7, layout: five-structure, colour_split: [5, 2] }
                slot_count: 3
                answer: ["5", "7", "9"]
                hints: ["Eine volle Reihe ist fünf. Schau, wie viele darunter liegen."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Wo sind mehr?"
                options:
                  - { object: ant, count: 3, layout: scattered }
                  - { object: ant, count: 2, layout: scattered }
                answer: "3"
                hints: ["Zähl, auch wenn es wenige sind."]
                difficulty: easy
              - id: l1-s6
                type: image_multiple_choice
                text: "Wo sind weniger?"
                options:
                  - { object: leaf, count: 10, layout: scattered }
                  - { object: leaf, count: 8, layout: scattered }
                answer: "8"
                hints: ["Zähl genau, in beiden Bildern sind viele."]
                difficulty: stretch

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Wo sind mehr?"
                options:
                  - { object: balloon, count: 5, layout: scattered }
                  - { object: balloon, count: 7, layout: row }
                answer: "7"
              - id: l1-n2
                type: true_false
                text: "Sind es gleich viele?"
                say: "Sind es gleich viele rote und blaue?"
                show: { drawn: dots, groups: [5, 4], layout: row }
                answer: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Wo sind weniger?"
                options:
                  - { object: apple, count: 6, layout: scattered }
                  - { object: apple, count: 3, layout: row }
                answer: "3"
              - id: l1-n4
                type: ordering
                text: "Ordne die Bilder. Die wenigsten Punkte kommen zuerst."
                options:
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                slot_count: 3
                answer: ["1", "3", "5"]
              - id: l1-n5
                type: true_false
                text: "Sind es gleich viele?"
                say: "Sind es gleich viele rote und blaue?"
                show: { drawn: dots, groups: [2, 2], layout: row }
                answer: true
                difficulty: easy

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wo sind mehr?"
            options:
              - { object: frog, count: 4, layout: row }
              - { object: frog, count: 6, layout: scattered }
            answer: "6"
          - id: l1-c2
            type: image_multiple_choice
            text: "Wo sind weniger?"
            options:
              - { object: banana, count: 5, layout: row }
              - { object: banana, count: 2, layout: row }
            answer: "2"
          - id: l1-c3
            type: true_false
            text: "Sind es gleich viele?"
            say: "Sind es gleich viele rote und blaue?"
            show: { drawn: dots, groups: [5, 3], layout: row }
            answer: false

  - n: 2
    title: { de: "Die Zeichen <, > und =", en: "The signs <, > and =" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Wo sind mehr?"
            options:
              - { object: ball, count: 6, layout: row }
              - { object: ball, count: 4, layout: row }
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Sind es gleich viele?"
            say: "Sind es gleich viele rote und blaue?"
            show: { drawn: dots, groups: [3, 3], layout: row }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5 > 3"
            say: "Für größer und kleiner gibt es Zeichen. Fünf ist größer als drei. Die offene Seite zeigt zur größeren Zahl, zur Fünf."
            show: { drawn: letter-card, text: "5 > 3" }
          - text: "2 < 6"
            say: "Zwei ist kleiner als sechs. Die Spitze zeigt zur kleineren Zahl, zur Zwei. Die offene Seite zeigt wieder zur größeren."
            show: { drawn: letter-card, text: "2 < 6" }
          - text: "4 = 4"
            say: "Sind beide gleich, schreibst du das Gleichheitszeichen: vier ist gleich vier."
            show: { drawn: letter-card, text: "4 = 4" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen sieben und vier?"
                frame: "7 _ 4"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Welche Zahl ist größer, sieben oder vier?"
                  - "Sieben ist größer. Die offene Seite zeigt zur Sieben."
                  - "7 > 4"
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen zwei und fünf?"
                frame: "2 _ 5"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Welche Zahl ist größer?"
                  - "Fünf ist größer. Die offene Seite zeigt nach rechts zur Fünf."
                  - "2 < 5"
              - id: l2-f3
                type: true_false
                text: "Stimmt das? 6 > 3"
                say: "Stimmt das? Sechs ist größer als drei."
                answer: true
                hints:
                  - "Ist sechs größer als drei?"
                  - "Sechs kommt nach drei, also ist sechs größer."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen drei und drei?"
                frame: "3 _ 3"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints:
                  - "Schau beide Zahlen genau an."
                  - "Beide sind drei."
                  - "Gleiche Zahlen: 3 = 3"
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 8 < 5"
                say: "Stimmt das? Acht ist kleiner als fünf."
                answer: false
                hints:
                  - "Ist acht kleiner als fünf?"
                  - "Acht ist mehr als fünf."
                  - "Nein, richtig ist 8 > 5."
              - id: l2-f6
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen neun und zehn?"
                frame: "9 _ 10"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "Neun ist kleiner als zehn. Die offene Seite zeigt zur größeren Zahl, zur 10."
                hints:
                  - "Zehn kommt nach neun."
                  - "Die offene Seite zeigt zur Zehn."
                  - "9 < 10"

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen vier und eins?"
                frame: "4 _ 1"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Die offene Seite zeigt zur größeren Zahl."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? 5 = 5"
                say: "Stimmt das? Fünf ist gleich fünf."
                answer: true
                hints: ["Sind beide Zahlen gleich?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen sechs und acht?"
                frame: "6 _ 8"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Welche Zahl ist größer? Dorthin zeigt die offene Seite."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 2 > 7"
                say: "Stimmt das? Zwei ist größer als sieben."
                answer: false
                hints: ["Ist zwei mehr als sieben?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen zehn und null?"
                frame: "10 _ 0"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Null ist gar nichts."]
              - id: l2-s6
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen sieben und sieben?"
                frame: "7 _ 7"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Schau, ob die Zahlen gleich sind."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen drei und neun?"
                frame: "3 _ 9"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n2
                type: true_false
                text: "Stimmt das? 4 < 6"
                say: "Stimmt das? Vier ist kleiner als sechs."
                answer: true
              - id: l2-n3
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen acht und zwei?"
                frame: "8 _ 2"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 9 = 6"
                say: "Stimmt das? Neun ist gleich sechs."
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen eins und eins?"
                frame: "1 _ 1"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen fünf und zwei?"
            frame: "5 _ 2"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c2
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen vier und sieben?"
            frame: "4 _ 7"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c3
            type: true_false
            text: "Stimmt das? 6 = 6"
            say: "Stimmt das? Sechs ist gleich sechs."
            answer: true

  - n: 3
    title: { de: Vergleichen mit Zeichen, en: Comparing with the signs }
    new_content: false
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen neun und drei?"
            frame: "9 _ 3"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l3-w2
            type: true_false
            text: "Stimmt das? 2 < 8"
            say: "Stimmt das? Zwei ist kleiner als acht."
            answer: true
            difficulty: easy

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Zähl die Punkte. Links sind sechs, rechts sind vier. Welches Zeichen passt?"
                show: { drawn: dots, groups: [6, 4], layout: dice }
                frame: "6 _ 4"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Der linke Würfel zeigt mehr Punkte."
                  - "Sechs ist größer als vier."
                  - "6 > 4"
              - id: l3-f2
                type: multiple_choice
                text: "Was stimmt?"
                options: ["3 < 5", "5 < 3", "3 = 5"]
                answer: "3 < 5"
                hints:
                  - "Lies jede Antwort genau. Ist drei kleiner als fünf?"
                  - "Die offene Seite muss zur größeren Zahl zeigen, zur 5."
                  - "3 < 5 stimmt."
              - id: l3-f3
                type: fill_in_blank
                text: "Welche Zahl passt?"
                say: "Welche Zahl ist größer als sechs?"
                frame: "_ > 6"
                options: ["4", "6", "8"]
                answer: ["8"]
                hints:
                  - "Gesucht ist eine Zahl, die größer ist als sechs."
                  - "Vier und sechs sind nicht größer als sechs."
                  - "8 > 6"
              - id: l3-f4
                type: true_false
                text: "Stimmt das? 7 > 7"
                say: "Stimmt das? Sieben ist größer als sieben."
                answer: false
                hints:
                  - "Sind beide Zahlen gleich?"
                  - "Eine Zahl ist nicht größer als sie selbst."
                  - "Nein, richtig ist 7 = 7."
              - id: l3-f5
                type: multiple_choice
                text: "Was stimmt?"
                options: ["9 < 4", "4 > 9", "9 > 4"]
                answer: "9 > 4"
                hints:
                  - "Welche Zahl ist größer, neun oder vier?"
                  - "Neun ist größer. Dorthin zeigt die offene Seite."
                  - "9 > 4 stimmt."
              - id: l3-f6
                type: fill_in_blank
                text: "Welche Zahl passt?"
                say: "Welche Zahl ist kleiner als drei?"
                frame: "_ < 3"
                options: ["1", "3", "5"]
                answer: ["1"]
                hints:
                  - "Gesucht ist eine Zahl, die kleiner ist als drei."
                  - "Drei ist nicht kleiner als drei."
                  - "1 < 3"

          - support: some
            tasks:
              - id: l3-s1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Zähl die Punkte. Links sind zwei, rechts sind fünf. Welches Zeichen passt?"
                show: { drawn: dots, groups: [2, 5], layout: dice }
                frame: "2 _ 5"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Wo sind mehr Punkte? Dorthin zeigt die offene Seite."]
              - id: l3-s2
                type: multiple_choice
                text: "Was stimmt?"
                options: ["6 = 8", "6 < 8", "8 < 6"]
                answer: "6 < 8"
                hints: ["Ist sechs kleiner oder größer als acht?"]
              - id: l3-s3
                type: fill_in_blank
                text: "Welche Zahl passt?"
                say: "Welche Zahl ist gleich fünf?"
                frame: "5 = _"
                options: ["4", "5", "6"]
                answer: ["5"]
                hints: ["Gleich heißt: genau gleich viel."]
              - id: l3-s4
                type: true_false
                text: "Stimmt das? 0 < 1"
                say: "Stimmt das? Null ist kleiner als eins."
                answer: true
                hints: ["Null ist gar nichts. Ist das weniger als eins?"]
              - id: l3-s5
                type: fill_in_blank
                text: "Welche Zahl passt?"
                say: "Welche Zahl ist größer als neun?"
                frame: "_ > 9"
                options: ["8", "9", "10"]
                answer: ["10"]
                hints: ["Nur eine Zahl ist größer als neun."]
              - id: l3-s6
                type: multiple_choice
                text: "Was stimmt?"
                options: ["2 > 7", "7 > 2", "7 = 2"]
                answer: "7 > 2"
                hints: ["Die offene Seite zeigt zur größeren Zahl."]

          - support: none
            tasks:
              - id: l3-n1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen acht und acht?"
                frame: "8 _ 8"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
              - id: l3-n2
                type: multiple_choice
                text: "Was stimmt?"
                options: ["5 < 1", "1 < 5", "1 = 5"]
                answer: "1 < 5"
              - id: l3-n3
