# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.complex-buildings
skill: math.solids.complex-buildings
curriculum: de-DE
language: de
title:
  de: Große Würfelgebäude
  en: Larger cube buildings
summary: >
  Lesson 1 reads Baupläne with three rows and up to three columns, counts
  every cube from the plan (also the ones the Schrägbild hides), matches
  a Bauplan to its Schrägbild and back, where front and back or left and
  right are easily swapped, and works out how many cubes a Quader still
  needs; lesson 2 finds the view from the front, from the right and from
  above of these buildings straight from the plan (in each column, or in
  each row, the largest number), finds the building for a given view and
  ends with the skill check. Building with real cubes waits for a
  hands-on task.
metadata:
  year: klasse-4
  topic: { de: Körper, en: 3D shapes }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.solids.cube-buildings, math.space.views]
  also_practises: []
  vocabulary: { de: [Würfelgebäude, Bauplan, Schrägbild, Ansicht, von vorne, von rechts, von oben, Reihe, Spalte, verdeckt, Quader] }
  forms: [text, audio, drawn]
  drawn: [cubes]
  facets: []
  misconceptions:
    - id: counts-only-visible
      what: Counts only the cubes visible in the Schrägbild and forgets the hidden ones, or counts the fields of the Bauplan instead of adding the numbers
      addressed: lesson 1 Learn counts from the plan and says the Schrägbild hides cubes; l1-f1 and l1-f3 have feedback, l1-s3, l1-c3 and l2-c1 ask again
    - id: plan-rows-swapped
      what: Reads the upper row of the Bauplan as the front, or swaps left and right when matching a plan to its Schrägbild
      addressed: lesson 1 Learn names the rows hinten, Mitte, vorne; l1-f2 and l1-f5 have feedback on both swaps, l1-s2, l1-n2, l1-n4, l1-c2 and l2-c2 offer them
    - id: view-adds-numbers
      what: Adds the numbers of a column for the view from the front instead of taking the largest, or takes only the front row
      addressed: lesson 2 Learn takes the largest number per column and per row; l2-f1, l2-f2 and l2-f4 have feedback on adding and on the front row, l2-s1, l2-n5 and l2-c3 offer both
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Baupläne und Schrägbilder", en: "Plans and slanted drawings" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Würfel brauchst du für dieses Gebäude?"
            say: "Hier ist ein Bauplan. Wie viele Würfel brauchst du für das ganze Gebäude?"
            show: { drawn: cubes, plan: [[3, 1], [2, 2]], mode: plan, colour: blue }
            options: ["8", "4", "7"]
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Welche Ansicht von vorne passt?"
            say: "Wie sieht das Gebäude von vorne aus? Welches Bild passt?"
            show: { drawn: cubes, plan: [[3, 1], [1, 2]], mode: building, colour: blue }
            options:
              - { drawn: cubes, plan: [[1, 2]], mode: front, colour: blue, key: vorderreihe }
              - { drawn: cubes, plan: [[3, 1], [1, 2]], mode: front, colour: blue, key: vorne }
            answer: vorne
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ein Bauplan mit drei Reihen"
            say: "Dieser Bauplan hat drei Reihen: oben die hintere Reihe, dann die mittlere, unten die vordere. In jedem Feld steht, wie viele Würfel dort übereinander stehen. Leere Felder bleiben frei."
            show: { drawn: cubes, plan: [[2, 1, 1], [3, 1, 0], [1, 0, 0]], mode: plan, colour: orange }
          - text: "Das Schrägbild"
            say: "So sieht das Gebäude schräg von vorne aus. Das nennt man ein Schrägbild. Hinter den vorderen Türmen sind manche Würfel verdeckt."
            show: { drawn: cubes, plan: [[2, 1, 1], [3, 1, 0], [1, 0, 0]], mode: building, colour: orange }
          - text: "2 + 1 + 1 + 3 + 1 + 1 = 9 Würfel"
            say: "Wie viele Würfel sind es? Im Schrägbild vergisst du leicht die verdeckten. Im Bauplan stehen alle. Du rechnest: hinten zwei plus eins plus eins, in der Mitte drei plus eins, vorne eins. Das sind neun Würfel."
          - text: "Bauplan und Schrägbild vergleichen"
            say: "Vergleichst du ein Schrägbild mit einem Bauplan, prüfst du zwei Dinge. Ist hinten wirklich hinten, also oben im Plan? Und ist links wirklich links? Am besten suchst du zuerst den höchsten Turm."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Würfel brauchst du für dieses Gebäude?"
                say: "Hier ist ein Bauplan mit drei Reihen. Wie viele Würfel brauchst du für das ganze Gebäude?"
                show: { drawn: cubes, plan: [[1, 2, 1], [2, 1, 0], [1, 0, 1]], mode: plan, colour: green }
                options: ["9", "7", "3"]
                answer: "9"
                feedback:
                  "7": "7 ist die Zahl der Felder mit einer Zahl. Zähl die Zahlen in den Feldern zusammen."
                hints:
                  - "Rechne Reihe für Reihe."
                  - "Hinten 1 + 2 + 1 = 4, in der Mitte 2 + 1 = 3, vorne 1 + 1 = 2."
                  - "4 + 3 + 2 = 9."
              - id: l1-f2
                type: image_multiple_choice
                text: "Welches Schrägbild passt zum Bauplan?"
                say: "Hier ist der Bauplan. Welches Schrägbild passt dazu?"
                show: { drawn: cubes, plan: [[2, 1], [1, 3]], mode: plan, colour: red }
                options:
                  - { drawn: cubes, plan: [[1, 3], [2, 1]], mode: building, colour: red, key: vertauscht }
                  - { drawn: cubes, plan: [[2, 1], [1, 3]], mode: building, colour: red, key: richtig }
                  - { drawn: cubes, plan: [[1, 2], [3, 1]], mode: building, colour: red, key: gespiegelt }
                answer: richtig
                feedback:
                  vertauscht: "Hier sind vorne und hinten vertauscht. Im Bauplan ist die obere Reihe hinten."
                  gespiegelt: "Hier sind links und rechts vertauscht. Der hohe Turm steht vorne rechts."
                hints:
                  - "Such zuerst den höchsten Turm im Bauplan."
                  - "Die 3 steht in der unteren Reihe rechts, also vorne rechts."
                  - "Such das Schrägbild mit dem hohen Turm vorne rechts."
              - id: l1-f3
                type: multiple_choice
                text: "Jeder Turm ist 2 Würfel hoch. Wie viele Würfel hat das Gebäude?"
                say: "Jeder Turm in diesem Gebäude ist zwei Würfel hoch. Wie viele Würfel hat das Gebäude?"
                show: { drawn: cubes, plan: [[2, 2], [2, 2]], mode: building, colour: yellow }
                options: ["8", "6", "4"]
                answer: "8"
                feedback:
                  "6": "Hinten sind Würfel verdeckt. Es stehen 4 Türme mit je 2 Würfeln."
                hints:
                  - "Wie viele Türme stehen da: vorne und hinten?"
                  - "Es sind 4 Türme. Jeder hat 2 Würfel."
                  - "4 · 2 = 8."
              - id: l1-f4
                type: true_false
                text: "Der höchste Turm steht hinten links."
                say: "Hier ist der Bauplan. Stimmt das? Der höchste Turm steht hinten links."
                show: { drawn: cubes, plan: [[3, 0, 1], [1, 2, 1]], mode: plan, colour: purple }
                answer: true
                hints:
                  - "Such die größte Zahl."
                  - "Die 3 steht oben links. Oben ist hinten."
                  - "Ja, hinten links."
              - id: l1-f5
                type: image_multiple_choice
                text: "Welcher Bauplan passt zum Schrägbild?"
                say: "Hier ist das Schrägbild. Welcher Bauplan passt dazu?"
                show: { drawn: cubes, plan: [[1, 2], [3, 1]], mode: building, colour: blue }
                options:
                  - { drawn: cubes, plan: [[1, 2], [3, 1]], mode: plan, colour: blue, key: richtig }
                  - { drawn: cubes, plan: [[3, 1], [1, 2]], mode: plan, colour: blue, key: vertauscht }
                  - { drawn: cubes, plan: [[2, 1], [1, 3]], mode: plan, colour: blue, key: gespiegelt }
                answer: richtig
                feedback:
                  vertauscht: "In diesem Plan steht die 3 oben, also hinten. Im Schrägbild steht der hohe Turm vorne."
                  gespiegelt: "In diesem Plan steht die 3 rechts. Im Schrägbild steht der hohe Turm links."
                hints:
                  - "Wo steht im Schrägbild der höchste Turm?"
                  - "Er steht vorne links. Vorne ist im Plan die untere Reihe."
                  - "Such den Plan mit der 3 unten links."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Würfel brauchst du für dieses Gebäude?"
                say: "Hier ist ein Bauplan. Wie viele Würfel brauchst du für das ganze Gebäude?"
                show: { drawn: cubes, plan: [[1, 1, 3], [0, 2, 2], [0, 0, 1]], mode: plan, colour: orange }
                options: ["10", "6", "9"]
                answer: "10"
                hints: ["Rechne Reihe für Reihe und zähl dann zusammen."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welches Schrägbild passt zum Bauplan?"
                say: "Hier ist der Bauplan. Welches Schrägbild passt dazu?"
                show: { drawn: cubes, plan: [[1, 0, 2], [2, 1, 1]], mode: plan, colour: green }
                options:
                  - { drawn: cubes, plan: [[2, 0, 1], [1, 1, 2]], mode: building, colour: green, key: gespiegelt }
                  - { drawn: cubes, plan: [[2, 1, 1], [1, 0, 2]], mode: building, colour: green, key: vertauscht }
                  - { drawn: cubes, plan: [[1, 0, 2], [2, 1, 1]], mode: building, colour: green, key: richtig }
                answer: richtig
                hints: ["Wo ist im Bauplan das leere Feld: hinten oder vorne, links, in der Mitte oder rechts?"]
              - id: l1-s3
                type: multiple_choice
                text: "Wie viele Würfel hat das Gebäude?"
                say: "Hinten sind alle Türme zwei Würfel hoch, vorne einen. Wie viele Würfel hat das Gebäude?"
                show: { drawn: cubes, plan: [[2, 2, 2], [1, 1, 1]], mode: building, colour: red }
                options: ["9", "6", "7"]
                answer: "9"
                hints: ["Denk auch an die verdeckten Würfel hinten unten."]
              - id: l1-s4
                type: multiple_choice
                text: "Wie viele Würfel stehen in der mittleren Reihe?"
                say: "Schau auf den Bauplan. Wie viele Würfel stehen in der mittleren Reihe?"
                show: { drawn: cubes, plan: [[2, 1, 1], [3, 1, 0], [1, 0, 0]], mode: plan, colour: purple }
                options: ["4", "3", "9"]
                answer: "4"
                hints: ["Die mittlere Reihe ist die zweite von oben."]
              - id: l1-s5
                type: multiple_choice
                text: "Lea will einen Quader bauen, überall 2 Würfel hoch. Wie viele Würfel fehlen noch?"
                say: "Lea will einen Quader bauen, überall zwei Würfel hoch. Wie viele Würfel fehlen noch?"
                show: { drawn: cubes, plan: [[2, 2], [2, 1]], mode: building, colour: yellow }
                options: ["1", "2", "7"]
                answer: "1"
                hints: ["Welcher Turm ist noch nicht 2 Würfel hoch?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ole baut nach diesem Plan. Wie viele Würfel braucht er?"
                say: "Ole baut nach diesem Bauplan. Wie viele Würfel braucht er?"
                show: { drawn: cubes, plan: [[3, 1, 2], [2, 0, 1], [1, 1, 1]], mode: plan, colour: blue }
                options: ["12", "8", "9"]
                answer: "12"
              - id: l1-n2
                type: image_multiple_choice
                text: "Sina hat nach diesem Plan gebaut. Welches Schrägbild zeigt ihr Gebäude?"
                say: "Sina hat nach diesem Bauplan gebaut. Welches Schrägbild zeigt ihr Gebäude?"
                show: { drawn: cubes, plan: [[3, 1], [1, 1], [0, 2]], mode: plan, colour: orange }
                options:
                  - { drawn: cubes, plan: [[3, 1], [1, 1], [0, 2]], mode: building, colour: orange, key: richtig }
                  - { drawn: cubes, plan: [[0, 2], [1, 1], [3, 1]], mode: building, colour: orange, key: vertauscht }
                  - { drawn: cubes, plan: [[1, 3], [1, 1], [2, 0]], mode: building, colour: orange, key: gespiegelt }
                answer: richtig
              - id: l1-n3
                type: true_false
                text: "Im Schrägbild siehst du immer alle Würfel."
                say: "Stimmt das? Im Schrägbild siehst du immer alle Würfel."
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                text: "Kemal zeichnet den Bauplan zu seinem Gebäude. Welcher stimmt?"
                say: "Kemal hat dieses Gebäude gebaut und zeichnet den Bauplan dazu. Welcher Bauplan stimmt?"
                show: { drawn: cubes, plan: [[1, 1, 2], [0, 3, 1]], mode: building, colour: green }
                options:
                  - { drawn: cubes, plan: [[2, 1, 1], [1, 3, 0]], mode: plan, colour: green, key: gespiegelt }
                  - { drawn: cubes, plan: [[1, 1, 2], [0, 3, 1]], mode: plan, colour: green, key: richtig }
                  - { drawn: cubes, plan: [[0, 3, 1], [1, 1, 2]], mode: plan, colour: green, key: vertauscht }
                answer: richtig
              - id: l1-n5
                type: multiple_choice
                text: "Tim will einen Quader bauen, überall 2 Würfel hoch. Wie viele Würfel fehlen noch?"
                say: "Tim will einen Quader bauen, überall zwei Würfel hoch. Wie viele Würfel fehlen noch?"
                show: { drawn: cubes, plan: [[2, 2, 2], [1, 2, 1]], mode: building, colour: purple }
                options: ["2", "1", "10"]
                answer: "2"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Würfel brauchst du für dieses Gebäude?"
            say: "Hier ist ein Bauplan. Wie viele Würfel brauchst du für das ganze Gebäude?"
            show: { drawn: cubes, plan: [[2, 1, 1], [1, 2, 0]], mode: plan, colour: red }
            options: ["7", "5", "6"]
            answer: "7"
          - id: l1-c2
            type: image_multiple_choice
            text: "Welches Schrägbild passt zum Bauplan?"
            say: "Hier ist der Bauplan. Welches Schrägbild passt dazu?"
            show: { drawn: cubes, plan: [[1, 3], [2, 1]], mode: plan, colour: blue }
            options:
              - { drawn: cubes, plan: [[3, 1], [1, 2]], mode: building, colour: blue, key: gespiegelt }
              - { drawn: cubes, plan: [[2, 1], [1, 3]], mode: building, colour: blue, key: vertauscht }
              - { drawn: cubes, plan: [[1, 3], [2, 1]], mode: building, colour: blue, key: richtig }
            answer: richtig
          - id: l1-c3
            type: multiple_choice
            text: "Jeder Turm hinten ist 2 Würfel hoch, vorne 1. Wie viele Würfel hat das Gebäude?"
            say: "Hinten ist jeder Turm zwei Würfel hoch, vorne einen. Wie viele Würfel hat das Gebäude?"
            show: { drawn: cubes, plan: [[2, 2], [1, 1]], mode: building, colour: green }
            options: ["6", "4", "5"]
            answer: "6"

  - n: 2
    title: { de: "Ansichten großer Gebäude", en: "Views of larger buildings" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Würfel brauchst du für dieses Gebäude?"
            say: "Hier ist ein Bauplan. Wie viele Würfel brauchst du für das ganze Gebäude?"
            show: { drawn: cubes, plan: [[1, 2, 0], [2, 1, 1], [1, 0, 1]], mode: plan, colour: yellow }
            options: ["9", "7"]
            answer: "9"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Welches Schrägbild passt zum Bauplan?"
            say: "Hier ist der Bauplan. Welches Schrägbild passt dazu?"
            show: { drawn: cubes, plan: [[3, 1], [1, 1]], mode: plan, colour: yellow }
            options:
              - { drawn: cubes, plan: [[3, 1], [1, 1]], mode: building, colour: yellow, key: richtig }
              - { drawn: cubes, plan: [[1, 1], [3, 1]], mode: building, colour: yellow, key: vertauscht }
            answer: richtig
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Von vorne: in jeder Spalte der höchste Turm"
            say: "Das ist das Gebäude aus der letzten Lektion, hier von vorne gesehen. In jeder Spalte siehst du den höchsten Turm, egal ob er vorne, in der Mitte oder hinten steht. Links ist es der Turm mit drei Würfeln aus der Mitte."
            show: { drawn: cubes, plan: [[2, 1, 1], [3, 1, 0], [1, 0, 0]], mode: front, colour: orange }
          - text: "Von rechts: vorne ist links"
            say: "Jetzt von rechts. Die vordere Reihe ist links, die hintere rechts. Für jede Reihe zählt der höchste Turm: vorne eins, in der Mitte drei, hinten zwei."
            show: { drawn: cubes, plan: [[2, 1, 1], [3, 1, 0], [1, 0, 0]], mode: side, colour: orange }
          - text: "Von oben: ein Quadrat für jedes volle Feld"
            say: "Von oben siehst du ein Quadrat für jedes Feld, auf dem etwas steht. Leere Felder bleiben frei. Die Höhe siehst du nicht."
            show: { drawn: cubes, plan: [[2, 1, 1], [3, 1, 0], [1, 0, 0]], mode: top, colour: orange }
          - text: "Aus dem Bauplan: die größte Zahl"
            say: "Mit dem Bauplan geht es ohne Schrägbild. Für die Ansicht von vorne nimmst du in jeder Spalte die größte Zahl. Für die Ansicht von rechts nimmst du in jeder Reihe die größte Zahl. Zusammenzählen darfst du hier nicht."
            show: { drawn: cubes, plan: [[2, 1, 1], [3, 1, 0], [1, 0, 0]], mode: plan, colour: orange }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Welche Ansicht von vorne gehört zum Bauplan?"
                say: "Hier ist der Bauplan. Welche Ansicht von vorne gehört dazu?"
                show: { drawn: cubes, plan: [[1, 2, 1], [3, 1, 0], [1, 1, 2]], mode: plan, colour: green }
                options:
                  - { drawn: cubes, plan: [[1, 1, 2]], mode: front, colour: green, key: vorderreihe }
                  - { drawn: cubes, plan: [[5, 4, 3]], mode: front, colour: green, key: summe }
                  - { drawn: cubes, plan: [[3, 2, 2]], mode: front, colour: green, key: vorne }
                answer: vorne
                feedback:
                  vorderreihe: "Das ist nur die vordere Reihe. Dahinter stehen höhere Türme, die du von vorne auch siehst."
                  summe: "Hier sind die Zahlen jeder Spalte zusammengezählt. Von vorne siehst du nur den höchsten Turm."
                hints:
                  - "Nimm in jeder Spalte die größte Zahl."
                  - "Links: 1, 3, 1. In der Mitte: 2, 1, 1. Rechts: 1, 0, 2."
                  - "3, 2 und 2 Quadrate hoch."
              - id: l2-f2
                type: image_multiple_choice
                text: "Welche Ansicht von rechts gehört zum Bauplan?"
                say: "Hier ist der Bauplan. Welche Ansicht von rechts gehört dazu?"
                show: { drawn: cubes, plan: [[2, 1, 1], [1, 3, 1], [0, 1, 1]], mode: plan, colour: red }
                options:
                  - { drawn: cubes, plan: [[2, 1, 1], [1, 3, 1], [0, 1, 1]], mode: side, colour: red, key: seite }
                  - { drawn: cubes, plan: [[0, 1, 1], [1, 3, 1], [2, 1, 1]], mode: side, colour: red, key: gedreht }
                  - { drawn: cubes, plan: [[4], [5], [2]], mode: side, colour: red, key: summe }
                answer: seite
                feedback:
                  gedreht: "Von rechts ist die vordere Reihe links. Vorne ist der höchste Turm nur 1 Würfel hoch."
                  summe: "Hier sind die Zahlen jeder Reihe zusammengezählt. Von rechts siehst du nur den höchsten Turm der Reihe."
                hints:
                  - "Nimm in jeder Reihe die größte Zahl. Fang vorne an, das ist links im Bild."
                  - "Vorne 1, in der Mitte 3, hinten 2."
                  - "1, 3 und 2 Quadrate hoch."
              - id: l2-f3
                type: image_multiple_choice
                text: "Welche Ansicht von oben passt?"
                say: "Wie sieht das Gebäude von oben aus? Welches Bild passt?"
                show: { drawn: cubes, plan: [[2, 0, 1], [1, 1, 0], [0, 3, 1]], mode: building, colour: blue }
                options:
                  - { drawn: cubes, plan: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], mode: top, colour: blue, key: voll }
                  - { drawn: cubes, plan: [[2, 0, 1], [1, 1, 0], [0, 3, 1]], mode: top, colour: blue, key: oben }
                  - { drawn: cubes, plan: [[1, 0, 2], [0, 1, 1], [1, 3, 0]], mode: top, colour: blue, key: gespiegelt }
                answer: oben
                feedback:
                  voll: "Im Gebäude sind drei Felder leer. Von oben bleiben sie frei."
                  gespiegelt: "Hier sind links und rechts vertauscht. Im Gebäude ist vorne links leer, nicht vorne rechts."
                hints:
                  - "Such die leeren Felder im Gebäude."
                  - "Leer sind: hinten in der Mitte, in der Mitte rechts, vorne links."
                  - "Such das Bild mit diesen drei Lücken."
              - id: l2-f4
                type: multiple_choice
                text: "Wie viele Quadrate siehst du von vorne?"
                say: "Hier ist der Bauplan. Wie viele Quadrate siehst du, wenn du das Gebäude von vorne anschaust?"
                show: { drawn: cubes, plan: [[1, 2, 1], [3, 1, 0], [1, 1, 2]], mode: plan, colour: purple }
                options: ["7", "12", "4"]
                answer: "7"
                feedback:
                  "12": "12 sind alle Würfel. Von vorne siehst du in jeder Spalte nur den höchsten Turm."
                  "4": "4 sind die Würfel der vorderen Reihe. Dahinter schauen höhere Türme hervor."
                hints:
                  - "Nimm in jeder Spalte die größte Zahl."
                  - "Links 3, in der Mitte 2, rechts 2."
                  - "3 + 2 + 2 = 7."
              - id: l2-f5
                type: true_false
                text: "Von vorne und von rechts sieht dieses Gebäude gleich aus."
                say: "Stimmt das? Von vorne und von rechts sieht dieses Gebäude gleich aus."
                show: { drawn: cubes, plan: [[1, 1, 3], [0, 2, 2], [0, 0, 1]], mode: plan, colour: orange }
                answer: true
                hints:
                  - "Bestimme beide Ansichten aus dem Plan."
                  - "Von vorne: in jeder Spalte die größte Zahl. Von rechts: in jeder Reihe, vorne zuerst."
                  - "Beide Male 1, 2, 3. Ja, gleich."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Welche Ansicht von vorne passt?"
                say: "Wie sieht das Gebäude von vorne aus? Welches Bild passt?"
                show: { drawn: cubes, plan: [[3, 2], [2, 1], [1, 1]], mode: building, colour: yellow }
                options:
                  - { drawn: cubes, plan: [[3, 2]], mode: front, colour: yellow, key: vorne }
