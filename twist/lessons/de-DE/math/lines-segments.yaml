# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.lines-segments
skill: math.shapes.lines-segments
curriculum: de-DE
language: de
title:
  de: Gerade, Strecke, Linie
  en: Straight lines, line segments and curves
summary: >
  Lesson 1 tells a Linie (gerade oder krumm), a Strecke (gerade, mit zwei
  Endpunkten) and a Gerade (gerade, ohne Ende) apart, in words and in
  things around us; lesson 2 measures Strecken exactly on the ruler in cm
  and mm, also when the ruler does not start at 0, compares Strecken in
  cm and mm and ends with the skill check. Drawing a Strecke of a given
  length, and pictures of lines to pick from, wait for a drawing task and
  a line component.
metadata:
  year: klasse-3
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.draw-freehand-ruler, math.length.cm-m]
  also_practises: [math.length.mm-km]
  vocabulary: { de: [Linie, Strecke, Gerade, Endpunkt, krumm, gerade, messen] }
  forms: [text, audio, drawn]
  drawn: [ruler]
  facets: []
  misconceptions:
    - id: gerade-strecke-mixed
      what: Thinks a Gerade has two ends and can be measured, or that a Strecke can be curved
      addressed: lesson 1 Learn sets Linie, Strecke and Gerade side by side; l1-f2 has feedback on measuring, l1-f3 and l1-n5 call a curved line a Strecke, l1-s4 and l1-n2 give a Gerade ends, l1-n4 sorts the properties
    - id: end-not-length
      what: Reads the number at the end when the Strecke does not start at 0, or calls 58 mm longer than 6 cm because 58 is the bigger number
      addressed: lesson 2 Learn measures a Strecke from 3 cm; l2-f3 has feedback on the end number, l2-s3, l2-n2 and l2-c3 start off zero; l2-f5 has feedback on comparing the numbers, l2-s5 and l2-c5 compare cm with mm
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Linien, Strecken und Geraden", en: "Lines, segments and straight lines" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Der Streifen fängt bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 10, length: 6 }
            options: ["6 cm", "7 cm", "5 cm"]
            answer: "6 cm"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Womit ziehst du einen geraden Strich?"
            say: "Womit ziehst du einen geraden Strich?"
            options: ["mit dem Lineal", "mit dem Radiergummi", "mit der Schere"]
            answer: "mit dem Lineal"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Eine Linie kann gerade oder krumm sein."
            say: "Jeder Strich, den du zeichnest, ist eine Linie. Eine Linie kann krumm sein, wie eine Schlangenlinie, oder gerade, wie ein Strich mit dem Lineal."
          - text: "Eine Strecke ist gerade und hat zwei Endpunkte, zum Beispiel A und B."
            say: "Eine Strecke ist ein gerades Stück zwischen zwei Punkten. Die Punkte heißen Endpunkte, zum Beispiel A und B. Wir sagen kurz: die Strecke AB. Eine Strecke kannst du mit dem Lineal messen. Diese ist fünf Zentimeter lang."
            show: { drawn: ruler, to: 10, length: 5, colour: blue }
          - text: "Eine Gerade ist gerade und hat kein Ende."
            say: "Eine Gerade ist auch gerade, aber sie hat keine Endpunkte. Sie geht nach beiden Seiten immer weiter. Darum kannst du eine Gerade nicht messen. Auf dem Papier zeichnest du immer nur ein Stück davon."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Eine gerade Linie mit zwei Endpunkten heißt _."
                say: "Wie heißt eine gerade Linie mit zwei Endpunkten?"
                options: ["Strecke", "Gerade", "Kurve"]
                answer: "Strecke"
                hints:
                  - "Sie hat einen Anfang und ein Ende."
                  - "Eine Gerade hat keine Endpunkte."
                  - "Strecke."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Linie kannst du nicht messen?"
                say: "Welche Linie kannst du nicht messen?"
                options: ["eine Gerade", "eine Strecke"]
                answer: "eine Gerade"
                feedback:
                  "eine Strecke": "Eine Strecke hat zwei Endpunkte. Du kannst von A bis B messen."
                hints:
                  - "Messen geht nur von einem Ende bis zum anderen."
                  - "Welche Linie hat kein Ende?"
                  - "Eine Gerade."
              - id: l1-f3
                type: true_false
                text: "Eine Schlangenlinie ist eine Strecke."
                say: "Stimmt das? Eine Schlangenlinie ist eine Strecke."
                answer: false
                hints:
                  - "Eine Strecke ist immer gerade."
                  - "Eine Schlangenlinie ist krumm."
                  - "Nein. Sie ist eine Linie, aber keine Strecke."
              - id: l1-f4
                type: multiple_choice
                text: "Wie viele Endpunkte hat eine Strecke?"
                say: "Wie viele Endpunkte hat eine Strecke?"
                options: ["2", "1", "0"]
                answer: "2"
                hints:
                  - "Denk an die Strecke AB."
                  - "Ein Endpunkt heißt A, der andere B."
                  - "2."
              - id: l1-f5
                type: multiple_choice
                text: "Was sieht aus wie eine Strecke?"
                say: "Was sieht aus wie eine Strecke?"
                options: ["die Kante von einem Lineal", "ein Gartenschlauch auf dem Rasen", "der Rand von einem Teller"]
                answer: "die Kante von einem Lineal"
                hints:
                  - "Eine Strecke ist gerade und hat zwei Enden."
                  - "Ein Schlauch auf dem Rasen liegt krumm, ein Tellerrand ist rund."
                  - "Die Kante von einem Lineal."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Eine gerade Linie ohne Endpunkte heißt _."
                say: "Wie heißt eine gerade Linie ohne Endpunkte?"
                options: ["Gerade", "Strecke", "Kurve"]
                answer: "Gerade"
                hints: ["Sie geht nach beiden Seiten immer weiter."]
              - id: l1-s2
                type: true_false
                text: "Jede Strecke ist auch eine Linie."
                say: "Stimmt das? Jede Strecke ist auch eine Linie."
                answer: true
                hints: ["Jeder Strich ist eine Linie."]
              - id: l1-s3
                type: multiple_choice
                text: "Lena verbindet die Punkte A und B mit dem Lineal. Was hat sie gezeichnet?"
                say: "Lena verbindet die Punkte A und B mit dem Lineal. Was hat sie gezeichnet?"
                options: ["die Strecke AB", "eine Gerade ohne Ende", "eine Schlangenlinie"]
                answer: "die Strecke AB"
                hints: ["Der Strich ist gerade und hört bei A und bei B auf."]
              - id: l1-s4
                type: true_false
                text: "Eine Gerade kannst du mit dem Lineal genau messen."
                say: "Stimmt das? Eine Gerade kannst du mit dem Lineal genau messen."
                answer: false
                hints: ["Wo hört eine Gerade auf?"]
              - id: l1-s5
                type: multiple_choice
                text: "Was ist eine krumme Linie?"
                say: "Was ist eine krumme Linie?"
                options: ["die Spur einer Schnecke im Sand", "die Kante vom Tisch", "ein straff gespanntes Seil"]
                answer: "die Spur einer Schnecke im Sand"
                hints: ["Was ist nicht gerade?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Linie ist immer gerade und hat einen Anfang und ein Ende?"
                say: "Welche Linie ist immer gerade und hat einen Anfang und ein Ende?"
                options: ["Strecke", "Gerade", "Schlangenlinie"]
                answer: "Strecke"
              - id: l1-n2
                type: true_false
                text: "Eine Gerade hat zwei Endpunkte."
                say: "Stimmt das? Eine Gerade hat zwei Endpunkte."
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Was kannst du mit dem Lineal messen?"
                say: "Was kannst du mit dem Lineal messen?"
                options: ["eine Strecke", "eine Gerade", "beides"]
                answer: "eine Strecke"
              - id: l1-n4
                type: sorting
                text: "Gehört das zur Strecke oder zur Geraden?"
                say: "Lies die Karten. Gehört das zur Strecke oder zur Geraden?"
                bins:
                  - { id: strecke, show: { text: "Strecke" }, say: "Strecke" }
                  - { id: gerade, show: { text: "Gerade" }, say: "Gerade" }
                options:
                  - { text: "hat zwei Endpunkte", bin: strecke }
                  - { text: "kann man messen", bin: strecke }
                  - { text: "hat kein Ende", bin: gerade }
                  - { text: "geht nach beiden Seiten immer weiter", bin: gerade }
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Eine Strecke kann auch krumm sein."
                say: "Stimmt das? Eine Strecke kann auch krumm sein."
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ein gerader Strich geht von Punkt P bis Punkt Q. Wie heißt er?"
            say: "Ein gerader Strich geht von Punkt P bis Punkt Q. Wie heißt er?"
            options: ["eine Strecke", "eine Kurve"]
            answer: "eine Strecke"
          - id: l1-c2
            type: true_false
            text: "Eine Gerade geht nach beiden Seiten immer weiter."
            say: "Stimmt das? Eine Gerade geht nach beiden Seiten immer weiter."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was ist keine Strecke?"
            say: "Was ist keine Strecke?"
            options: ["ein Kreis", "die Kante eines Buches", "ein gerader Strich von A nach B"]
            answer: "ein Kreis"

  - n: 2
    title: { de: "Strecken genau messen", en: "Measuring segments exactly" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was kannst du messen?"
            say: "Was kannst du mit dem Lineal messen: eine Strecke oder eine Gerade?"
            options: ["eine Strecke", "eine Gerade"]
            answer: "eine Strecke"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "3 cm = _ mm"
            say: "Drei Zentimeter sind wie viele Millimeter?"
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Die Strecke AB ist 7 cm lang."
            say: "Leg die Null vom Lineal genau an den Punkt A. Lies dann am Punkt B ab. Diese Strecke ist sieben Zentimeter lang."
            show: { drawn: ruler, to: 10, length: 7 }
          - text: "6 cm 4 mm = 64 mm"
            say: "Oft hört eine Strecke zwischen zwei Zentimetern auf. Dann zählst du die Millimeter dazu. Diese Strecke ist sechs Zentimeter und vier Millimeter lang, also vierundsechzig Millimeter."
            show: { drawn: ruler, to: 10, length: 6.4, colour: blue }
          - text: "von 3 cm bis 7 cm 5 mm: 4 cm 5 mm"
            say: "Fängt die Strecke nicht bei null an, rechnest du vom Anfang bis zum Ende. Von drei Zentimetern bis sieben Zentimeter fünf Millimeter sind es vier Zentimeter und fünf Millimeter."
            show: { drawn: ruler, to: 10, start: 3, length: 4.5, colour: green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie lang ist die Strecke?"
                say: "Die Strecke fängt bei null an. Wie lang ist sie?"
                show: { drawn: ruler, to: 10, length: 9 }
                options: ["9 cm", "10 cm", "8 cm"]
                answer: "9 cm"
                hints:
                  - "Schau, wo die Strecke aufhört."
                  - "Sie hört genau an einer Zahl auf."
                  - "9 cm."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie lang ist die Strecke?"
                say: "Die Strecke fängt bei null an. Wie lang ist sie?"
                show: { drawn: ruler, to: 10, length: 5.8, colour: blue }
                options: ["5 cm 8 mm", "8 cm 5 mm", "6 cm"]
                answer: "5 cm 8 mm"
                hints:
                  - "Lies zuerst die ganzen Zentimeter ab."
                  - "Nach der 5 kommen noch 8 kleine Striche."
                  - "5 cm 8 mm."
              - id: l2-f3
                type: multiple_choice
                text: "Wie lang ist die Strecke?"
                say: "Diese Strecke fängt nicht bei null an. Wie lang ist sie?"
                show: { drawn: ruler, to: 10, start: 2, length: 6, colour: green }
                options: ["6 cm", "8 cm", "2 cm"]
                answer: "6 cm"
                feedback:
                  "8 cm": "8 ist das Ende. Die Strecke fängt aber bei 2 an. Rechne 8 − 2."
                  "2 cm": "2 ist der Anfang. Miss bis zum Ende."
                hints:
                  - "Wo fängt sie an, wo hört sie auf?"
                  - "Von 2 bis 8."
                  - "6 cm."
              - id: l2-f4
                type: text_input
                text: "Wie viele mm ist die Strecke lang?"
                say: "Die Strecke fängt bei null an. Wie viele Millimeter ist sie lang?"
                show: { drawn: ruler, to: 10, length: 3.3 }
                answer: "33"
                hints:
                  - "Sie ist 3 cm und noch ein paar mm lang."
                  - "3 cm sind 30 mm. Dazu kommen 3 mm."
                  - "33."
              - id: l2-f5
                type: multiple_choice
                text: "Die Strecke AB ist 6 cm lang, die Strecke CD 58 mm. Welche ist länger?"
                say: "Die Strecke AB ist sechs Zentimeter lang, die Strecke CD achtundfünfzig Millimeter. Welche ist länger?"
                options: ["AB", "CD", "beide gleich lang"]
                answer: "AB"
                feedback:
                  "CD": "58 ist die größere Zahl, aber 6 cm sind 60 mm."
                hints:
                  - "Schreib beide Längen in mm."
                  - "6 cm = 60 mm."
                  - "AB."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie lang ist die Strecke?"
                say: "Die Strecke fängt bei null an. Wie lang ist sie?"
                show: { drawn: ruler, to: 15, length: 12, colour: blue }
                options: ["12 cm", "13 cm", "15 cm"]
                answer: "12 cm"
                hints: ["Sie hört 2 cm nach der 10 auf."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie lang ist die Strecke?"
                say: "Die Strecke fängt bei null an. Wie lang ist sie?"
                show: { drawn: ruler, to: 10, length: 2.6, colour: green }
                options: ["2 cm 6 mm", "6 cm 2 mm", "3 cm 6 mm"]
                answer: "2 cm 6 mm"
                hints: ["Lies zuerst die ganzen Zentimeter ab."]
              - id: l2-s3
                type: true_false
                text: "Die Strecke ist 8 cm 5 mm lang."
                say: "Die Strecke fängt bei eins an. Stimmt das: Sie ist acht Zentimeter und fünf Millimeter lang?"
                show: { drawn: ruler, to: 10, start: 1, length: 7.5 }
                answer: false
                hints: ["Sie geht von 1 cm bis 8 cm 5 mm."]
              - id: l2-s4
                type: text_input
                text: "Die Strecke AB ist 4 cm 7 mm lang. Wie viele mm sind das?"
                say: "Die Strecke AB ist vier Zentimeter und sieben Millimeter lang. Wie viele Millimeter sind das?"
                answer: "47"
                hints: ["4 cm sind 40 mm."]
              - id: l2-s5
                type: multiple_choice
                text: "Die Strecke EF ist 9 cm lang, die Strecke GH 95 mm. Welche ist länger?"
                say: "Die Strecke EF ist neun Zentimeter lang, die Strecke GH fünfundneunzig Millimeter. Welche ist länger?"
                options: ["GH", "EF", "beide gleich lang"]
                answer: "GH"
                hints: ["9 cm = 90 mm."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie lang ist die Strecke?"
                say: "Die Strecke fängt bei null an. Wie lang ist sie?"
                show: { drawn: ruler, to: 10, length: 4.1, colour: green }
                options: ["4 cm 1 mm", "1 cm 4 mm", "5 cm 1 mm"]
                answer: "4 cm 1 mm"
              - id: l2-n2
                type: multiple_choice
                text: "Wie lang ist die Strecke?"
                say: "Diese Strecke fängt nicht bei null an. Wie lang ist sie?"
                show: { drawn: ruler, to: 10, start: 4, length: 5 }
                options: ["5 cm", "9 cm", "4 cm"]
                answer: "5 cm"
              - id: l2-n3
                type: text_input
                text: "Wie viele mm ist die Strecke lang?"
                say: "Die Strecke fängt bei null an. Wie viele Millimeter ist sie lang?"
                show: { drawn: ruler, to: 10, length: 8.2, colour: blue }
                answer: "82"
              - id: l2-n4
                type: true_false
                text: "Die Strecke AB ist 7 cm lang, die Strecke CD 70 mm. Beide sind gleich lang."
                say: "Die Strecke AB ist sieben Zentimeter lang, die Strecke CD siebzig Millimeter. Stimmt das: Beide sind gleich lang?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "Eine Strecke ist 12 cm lang. Lisa zeichnet eine doppelt so lange Strecke. Wie viele cm ist sie lang?"
                say: "Eine Strecke ist zwölf Zentimeter lang. Lisa zeichnet eine doppelt so lange Strecke. Wie viele Zentimeter ist sie lang?"
                answer: "24"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Ole verbindet die Punkte P und Q mit dem Lineal. Was ist entstanden?"
            say: "Ole verbindet die Punkte P und Q mit dem Lineal. Was ist entstanden?"
            options: ["eine Strecke", "eine Gerade", "eine krumme Linie"]
            answer: "eine Strecke"
          - id: l2-c2
            type: multiple_choice
            text: "Wie lang ist die Strecke?"
            say: "Die Strecke fängt bei null an. Wie lang ist sie?"
            show: { drawn: ruler, to: 10, length: 7.6 }
            options: ["7 cm 6 mm", "6 cm 7 mm", "8 cm 6 mm"]
            answer: "7 cm 6 mm"
          - id: l2-c3
            type: multiple_choice
            text: "Wie lang ist die Strecke?"
            say: "Diese Strecke fängt nicht bei null an. Wie lang ist sie?"
            show: { drawn: ruler, to: 10, start: 3, length: 6.5, colour: blue }
            options: ["6 cm 5 mm", "9 cm 5 mm", "3 cm"]
            answer: "6 cm 5 mm"
          - id: l2-c4
            type: true_false
            text: "Eine Gerade hat keinen Anfang und kein Ende."
            say: "Stimmt das? Eine Gerade hat keinen Anfang und kein Ende."
            answer: true
          - id: l2-c5
            type: multiple_choice
            text: "Die Strecke AB ist 5 cm 2 mm lang, die Strecke CD 48 mm. Welche ist länger?"
            say: "Die Strecke AB ist fünf Zentimeter und zwei Millimeter lang, die Strecke CD achtundvierzig Millimeter. Welche ist länger?"
            options: ["AB", "CD", "beide gleich lang"]
            answer: "AB"
