# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.hundred-square
skill: math.numbers-to-100.hundred-square
curriculum: de-DE
language: de
title:
  de: Die Hundertertafel
  en: The hundred square
summary: >
  Finding the way on the Hundertertafel: one step right is one more, one
  row down is ten more. Lesson 1 finds hidden numbers next to and under a
  number; lesson 2 follows moves and spots column patterns (every number
  in a column ends with the same digit), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.read-write]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { de: [Hundertertafel, Zeile, Spalte, rechts, links, oben, unten] }
  forms: [drawn, text, audio]
  drawn: [hundred-square]
  facets: []
  misconceptions:
    - id: down-is-one
      what: Thinks the number under 34 is 35
      addressed: Learn shows that each row starts ten further on; hints say "eine Zeile tiefer ist zehn mehr"
    - id: row-end
      what: Thinks the number after 40 is on the same row
      addressed: tasks ask for the number after 30, 60 and 90, which start the next row
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Nachbarn auf der Tafel, en: Neighbours on the square }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Hör zu und schreib die Zahl."
            say: "Dreiundvierzig. Schreib die Zahl."
            answer: "43"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "_ , 27, _"
            say: "Welche Zahlen sind die Nachbarn von siebenundzwanzig?"
            frame: "_ , 27, _"
            options: ["26", "28", "17", "37"]
            answer: ["26", "28"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 bis 100"
            say: "Das ist die Hundertertafel. Jede Zeile hat zehn Zahlen. Oben links steht eins, unten rechts steht hundert."
            show: { drawn: hundred-square }
          - text: "34 → 35"
            say: "Ein Schritt nach rechts ist eins mehr. Rechts neben vierunddreißig steht fünfunddreißig."
            show: { drawn: hundred-square, highlight: [34, 35] }
          - text: "34 → 44"
            say: "Eine Zeile tiefer ist zehn mehr. Unter vierunddreißig steht vierundvierzig. Die Einer bleiben gleich, die Zehner werden eins mehr."
            show: { drawn: hundred-square, highlight: [34, 44] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                show: { drawn: hundred-square, hide: [23] }
                options: ["22", "23", "33"]
                answer: "23"
                hints:
                  - "Schau links und rechts daneben."
                  - "Links steht 22, rechts steht 24."
                  - "Dazwischen ist 23."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                say: "Die versteckte Zahl ist unter sechsundvierzig. Welche ist es?"
                show: { drawn: hundred-square, highlight: [46], hide: [56] }
                options: ["47", "56", "66"]
                answer: "56"
                feedback:
                  "47": "47 steht rechts daneben. Eine Zeile tiefer ist zehn mehr."
                hints:
                  - "Eine Zeile tiefer ist zehn mehr."
                  - "Die Einer bleiben 6. Die Zehner werden 5."
                  - "Unter 46 steht 56."
              - id: l1-f3
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                say: "Die versteckte Zahl ist über zweiundsiebzig. Welche ist es?"
                show: { drawn: hundred-square, highlight: [72], hide: [62] }
                options: ["62", "71", "82"]
                answer: "62"
                hints:
                  - "Eine Zeile höher ist zehn weniger."
                  - "Die Einer bleiben 2. Die Zehner werden 6."
                  - "Über 72 steht 62."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Nach 30 kommt 31 in derselben Zeile."
                say: "Nach dreißig kommt einunddreißig. Steht einunddreißig in derselben Zeile wie dreißig?"
                show: { drawn: hundred-square, highlight: [30, 31] }
                answer: false
                hints:
                  - "Wo steht die 30? Ganz rechts."
                  - "Nach dem rechten Rand geht es in der nächsten Zeile weiter."
                  - "Nein, 31 steht vorne in der nächsten Zeile."
              - id: l1-f5
                type: fill_in_blank
                text: "Was steht links und rechts?"
                say: "Welche Zahlen stehen links und rechts neben achtundfünfzig?"
                show: { drawn: hundred-square, highlight: [58], hide: [57, 59] }
                frame: "_ , 58, _"
                options: ["48", "57", "59", "68"]
                answer: ["57", "59"]
                hints:
                  - "Links ist eins weniger, rechts eins mehr."
                  - "58 weniger 1, 58 mehr 1."
                  - "57 und 59."
              - id: l1-f6
                type: fill_in_blank
                text: "Was steht oben und unten?"
                say: "Welche Zahlen stehen über und unter fünfunddreißig?"
                show: { drawn: hundred-square, highlight: [35], hide: [25, 45] }
                frame: "oben _ , unten _"
                options: ["25", "34", "36", "45"]
                answer: ["25", "45"]
                hints:
                  - "Oben ist zehn weniger, unten zehn mehr."
                  - "Die Einer bleiben 5."
                  - "Oben 25, unten 45."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                show: { drawn: hundred-square, hide: [67] }
                options: ["67", "76", "57"]
                answer: "67"
                hints: ["Schau links und rechts daneben."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                say: "Die versteckte Zahl ist unter neunzehn. Welche ist es?"
                show: { drawn: hundred-square, highlight: [19], hide: [29] }
                options: ["20", "29", "91"]
                answer: "29"
                hints: ["Eine Zeile tiefer ist zehn mehr."]
              - id: l1-s3
                type: fill_in_blank
                text: "Was steht oben und unten?"
                say: "Welche Zahlen stehen über und unter dreiundsechzig?"
                show: { drawn: hundred-square, highlight: [63], hide: [53, 73] }
                frame: "oben _ , unten _"
                options: ["53", "62", "64", "73"]
                answer: ["53", "73"]
                hints: ["Die Einer bleiben gleich."]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Zahl kommt nach 60?"
                say: "Welche Zahl kommt nach sechzig? Sie steht vorne in der nächsten Zeile."
                show: { drawn: hundred-square, highlight: [60], hide: [61] }
                options: ["61", "70", "51"]
                answer: "61"
                hints: ["Eins mehr als 60."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                say: "Die versteckte Zahl ist über achtundachtzig. Welche ist es?"
                show: { drawn: hundred-square, highlight: [88], hide: [78] }
                options: ["78", "87", "98"]
                answer: "78"
                hints: ["Eine Zeile höher ist zehn weniger."]
              - id: l1-s6
                type: fill_in_blank
                text: "Was steht links und rechts?"
                say: "Welche Zahlen stehen links und rechts neben einundvierzig?"
                show: { drawn: hundred-square, highlight: [41], hide: [40, 42] }
                frame: "_ , 41, _"
                options: ["31", "40", "42", "51"]
                answer: ["40", "42"]
                hints: ["Links eins weniger. Die 40 steht am Ende der Zeile darüber."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                show: { drawn: hundred-square, hide: [84] }
                options: ["48", "84", "74"]
                answer: "84"
              - id: l1-n2
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                say: "Die versteckte Zahl ist unter zweiundfünfzig. Welche ist es?"
                show: { drawn: hundred-square, highlight: [52], hide: [62] }
                options: ["53", "62", "42"]
                answer: "62"
              - id: l1-n3
                type: fill_in_blank
                text: "Was steht oben und unten?"
                say: "Welche Zahlen stehen über und unter siebenundsiebzig?"
                show: { drawn: hundred-square, highlight: [77], hide: [67, 87] }
                frame: "oben _ , unten _"
                options: ["67", "76", "78", "87"]
                answer: ["67", "87"]
              - id: l1-n4
                type: true_false
                text: "Stimmt das? Unter 15 steht 16."
                say: "Unter fünfzehn steht sechzehn. Stimmt das?"
                show: { drawn: hundred-square, highlight: [15] }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Welche Zahl kommt nach 90?"
                say: "Welche Zahl kommt nach neunzig?"
                show: { drawn: hundred-square, highlight: [90], hide: [91] }
                options: ["91", "100", "80"]
                answer: "91"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Zahl ist versteckt?"
            say: "Die versteckte Zahl ist unter achtunddreißig. Welche ist es?"
            show: { drawn: hundred-square, highlight: [38], hide: [48] }
            options: ["39", "48", "28"]
            answer: "48"
          - id: l1-c2
            type: fill_in_blank
            text: "Was steht links und rechts?"
            say: "Welche Zahlen stehen links und rechts neben fünfundsiebzig?"
            show: { drawn: hundred-square, highlight: [75], hide: [74, 76] }
            frame: "_ , 75, _"
            options: ["65", "74", "76", "85"]
            answer: ["74", "76"]
          - id: l1-c3
            type: multiple_choice
            text: "Welche Zahl ist versteckt?"
            show: { drawn: hundred-square, hide: [49] }
            options: ["49", "94", "59"]
            answer: "49"

  - n: 2
    title: { de: Wege und Muster, en: Moves and patterns }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Zahl ist versteckt?"
            say: "Die versteckte Zahl ist unter vierundzwanzig. Welche ist es?"
            show: { drawn: hundred-square, highlight: [24], hide: [34] }
            options: ["25", "34", "14"]
            answer: "34"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Zahl ist versteckt?"
            show: { drawn: hundred-square, hide: [56] }
            options: ["56", "65", "46"]
            answer: "56"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3, 13, 23, 33"
            say: "Schau dir eine Spalte an: drei, dreizehn, dreiundzwanzig, dreiunddreißig. Alle enden mit drei. In einer Spalte bleiben die Einer gleich."
            show: { drawn: hundred-square, highlight: [3, 13, 23, 33, 43, 53, 63, 73, 83, 93] }
          - text: "22 → 2 nach unten → 42"
            say: "Ein Weg: Start bei zweiundzwanzig, zwei Zeilen nach unten. Das ist zehn und noch zehn mehr. Wir kommen bei zweiundvierzig an."
            show: { drawn: hundred-square, highlight: [22, 32, 42] }
          - text: "42 → 3 nach rechts → 45"
            say: "Dann drei Schritte nach rechts: dreiundvierzig, vierundvierzig, fünfundvierzig. Wir sind bei fünfundvierzig."
            show: { drawn: hundred-square, highlight: [42, 43, 44, 45] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Start 14, 2 Zeilen nach unten. Wo bist du?"
                say: "Start bei vierzehn. Geh zwei Zeilen nach unten. Wo bist du?"
                show: { drawn: hundred-square, highlight: [14] }
                options: ["16", "34", "24"]
                answer: "34"
                feedback:
                  "16": "Zwei Schritte nach rechts wären 16. Nach unten ist jedes Mal zehn mehr."
                hints:
                  - "Eine Zeile nach unten ist zehn mehr."
                  - "14, dann 24, dann noch eine Zeile."
                  - "Du bist bei 34."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Start 51, 4 nach rechts. Wo bist du?"
                say: "Start bei einundfünfzig. Geh vier Schritte nach rechts. Wo bist du?"
                show: { drawn: hundred-square, highlight: [51] }
                options: ["55", "91", "54"]
                answer: "55"
                hints:
                  - "Ein Schritt nach rechts ist eins mehr."
                  - "52, 53, 54, und noch einer."
                  - "Du bist bei 55."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Zahl gehört in diese Spalte?"
                say: "Die gelben Zahlen sind eine Spalte. Welche Zahl gehört auch dazu?"
                show: { drawn: hundred-square, highlight: [7, 17, 27, 37] }
                options: ["47", "38", "70"]
                answer: "47"
                hints:
                  - "Womit enden alle gelben Zahlen?"
                  - "Alle enden mit 7."
                  - "47 endet auch mit 7."
              - id: l2-f4
                type: multiple_choice
                text: "Start 68, 1 Zeile nach oben. Wo bist du?"
                say: "Start bei achtundsechzig. Geh eine Zeile nach oben. Wo bist du?"
                show: { drawn: hundred-square, highlight: [68] }
                options: ["58", "67", "78"]
                answer: "58"
                hints:
                  - "Nach oben ist zehn weniger."
                  - "Die Einer bleiben 8."
                  - "Du bist bei 58."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 9, 19, 29, 39 stehen in einer Spalte."
                say: "Neun, neunzehn, neunundzwanzig, neununddreißig. Stehen die in einer Spalte untereinander?"
                show: { drawn: hundred-square, highlight: [9, 19, 29, 39] }
                answer: true
                hints:
                  - "Womit enden die Zahlen?"
                  - "Alle enden mit 9, jede ist zehn mehr."
                  - "Ja, sie stehen untereinander."
              - id: l2-f6
                type: text_input
                text: "Start 33, 1 nach unten und 2 nach rechts."
                say: "Start bei dreiunddreißig. Eine Zeile nach unten, dann zwei Schritte nach rechts. Wo bist du?"
                show: { drawn: hundred-square, highlight: [33] }
                answer: "45"
                hints:
                  - "Zuerst nach unten: zehn mehr."
                  - "33, unten 43. Dann zwei nach rechts."
                  - "43, 44, 45."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Start 26, 3 Zeilen nach unten. Wo bist du?"
                say: "Start bei sechsundzwanzig. Geh drei Zeilen nach unten. Wo bist du?"
                show: { drawn: hundred-square, highlight: [26] }
                options: ["29", "56", "46"]
                answer: "56"
                hints: ["Jede Zeile nach unten ist zehn mehr."]
              - id: l2-s2
                type: multiple_choice
                text: "Welche Zahl gehört in diese Spalte?"
                say: "Die gelben Zahlen sind eine Spalte. Welche Zahl gehört auch dazu?"
                show: { drawn: hundred-square, highlight: [12, 22, 32, 42] }
                options: ["43", "52", "21"]
                answer: "52"
                hints: ["Alle enden gleich."]
              - id: l2-s3
                type: multiple_choice
                text: "Start 87, 2 nach links. Wo bist du?"
                say: "Start bei siebenundachtzig. Geh zwei Schritte nach links. Wo bist du?"
                show: { drawn: hundred-square, highlight: [87] }
                options: ["85", "89", "67"]
                answer: "85"
                hints: ["Nach links ist eins weniger."]
              - id: l2-s4
                type: text_input
                text: "Start 71, 2 nach oben und 3 nach rechts."
                say: "Start bei einundsiebzig. Zwei Zeilen nach oben, dann drei Schritte nach rechts. Wo bist du?"
                show: { drawn: hundred-square, highlight: [71] }
                answer: "54"
                hints: ["Nach oben: 61, 51."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? 40, 50, 60 stehen in einer Zeile."
                say: "Vierzig, fünfzig, sechzig. Stehen die nebeneinander in einer Zeile?"
                show: { drawn: hundred-square, highlight: [40, 50, 60] }
                answer: false
                hints: ["Wo stehen die Zehnerzahlen?"]
              - id: l2-s6
                type: multiple_choice
                text: "Start 95, 1 Zeile nach oben. Wo bist du?"
                say: "Start bei fünfundneunzig. Geh eine Zeile nach oben. Wo bist du?"
                show: { drawn: hundred-square, highlight: [95] }
                options: ["85", "94", "96"]
                answer: "85"
                hints: ["Zehn weniger."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Start 42, 4 Zeilen nach unten. Wo bist du?"
                say: "Start bei zweiundvierzig. Geh vier Zeilen nach unten. Wo bist du?"
                show: { drawn: hundred-square, highlight: [42] }
                options: ["46", "82", "72"]
                answer: "82"
              - id: l2-n2
                type: multiple_choice
                text: "Welche Zahl gehört in diese Spalte?"
                say: "Die gelben Zahlen sind eine Spalte. Welche Zahl gehört auch dazu?"
                show: { drawn: hundred-square, highlight: [5, 15, 25, 35] }
                options: ["36", "45", "50"]
                answer: "45"
              - id: l2-n3
                type: text_input
                text: "Start 18, 3 nach unten und 1 nach links."
                say: "Start bei achtzehn. Drei Zeilen nach unten, dann einen Schritt nach links. Wo bist du?"
                show: { drawn: hundred-square, highlight: [18] }
                answer: "47"
              - id: l2-n4
                type: multiple_choice
                text: "Start 64, 3 nach rechts. Wo bist du?"
                say: "Start bei vierundsechzig. Geh drei Schritte nach rechts. Wo bist du?"
                show: { drawn: hundred-square, highlight: [64] }
                options: ["94", "67", "61"]
                answer: "67"
              - id: l2-n5
                type: text_input
                text: "Start 99, 5 Zeilen nach oben."
                say: "Start bei neunundneunzig. Geh fünf Zeilen nach oben. Wo bist du?"
                show: { drawn: hundred-square, highlight: [99] }
                answer: "49"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welche Zahl ist versteckt?"
            say: "Die versteckte Zahl ist über sechsundfünfzig. Welche ist es?"
            show: { drawn: hundred-square, highlight: [56], hide: [46] }
            options: ["46", "55", "66"]
            answer: "46"
          - id: l2-c2
            type: fill_in_blank
            text: "Was steht oben und unten?"
            say: "Welche Zahlen stehen über und unter zweiundachtzig?"
            show: { drawn: hundred-square, highlight: [82], hide: [72, 92] }
            frame: "oben _ , unten _"
            options: ["72", "81", "83", "92"]
            answer: ["72", "92"]
          - id: l2-c3
            type: multiple_choice
            text: "Start 37, 2 Zeilen nach unten. Wo bist du?"
            say: "Start bei siebenunddreißig. Geh zwei Zeilen nach unten. Wo bist du?"
            show: { drawn: hundred-square, highlight: [37] }
            options: ["39", "57", "47"]
            answer: "57"
          - id: l2-c4
            type: multiple_choice
            text: "Welche Zahl gehört in diese Spalte?"
            say: "Die gelben Zahlen sind eine Spalte. Welche Zahl gehört auch dazu?"
            show: { drawn: hundred-square, highlight: [4, 14, 24, 34] }
            options: ["35", "44", "40"]
            answer: "44"
          - id: l2-c5
            type: text_input
            text: "Start 23, 1 nach unten und 4 nach rechts."
            say: "Start bei dreiundzwanzig. Eine Zeile nach unten, dann vier Schritte nach rechts. Wo bist du?"
            show: { drawn: hundred-square, highlight: [23] }
            answer: "37"
