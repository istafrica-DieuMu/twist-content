                text: "16 Einer: Wie viele Zehner, wie viele Einer?"
                say: "Sechzehn Einerwürfel. Bündle zehn davon. Wie viele Zehner, wie viele Einer sind es?"
                show: { drawn: base-ten, tens: 0, ones: 16 }
