                options: ["7", "70", "17"]
                answer: "7"
                hints:
                  - "Bei Z steht eine Null. Es gibt keine Zehner."
                  - "Nur sieben Einer."
                  - "Das ist 7."
              - id: l2-f4
                type: multiple_choice
                text: "Wie viele sind es?"
                say: "Zwei Zehnerstangen und dreizehn Einerwürfel. Wie viele sind es zusammen?"
                show: { drawn: base-ten, tens: 2, ones: 13 }
                options: ["33", "213", "15"]
                answer: "33"
                feedback:
                  "213": "Bei E darf nicht dreizehn stehen. Zehn Einer werden ein Zehner."
                hints:
                  - "Aus zehn Einerwürfeln wird eine Stange."
                  - "Dann sind es drei Stangen und drei Würfel."
                  - "3 Zehner und 3 Einer sind 33."
              - id: l2-f5
                type: fill_in_blank
                text: "15 Einer: Wie viele Zehner, wie viele Einer?"
                say: "Fünfzehn Einerwürfel. Bündle zehn davon. Wie viele Zehner, wie viele Einer sind es?"
                show: { drawn: base-ten, tens: 0, ones: 15 }
                frame: "Z: _  E: _"
                options: ["0", "1", "5", "15"]
                answer: ["1", "5"]
                hints:
                  - "Zehn Würfel werden eine Stange."
                  - "Es bleiben fünf Würfel übrig."
                  - "Z: 1, E: 5."
              - id: l2-f6
                type: true_false
                text: "Das ist 90. Stimmt das?"
                say: "Neunzig. In der Stellentafel steht: Z neun, E null. Stimmt das?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [9, 0] }
                answer: true
                hints:
                  - "Wie viele Zehner hat neunzig?"
                  - "Neun Zehner und keine Einer."
                  - "Ja, das stimmt."

