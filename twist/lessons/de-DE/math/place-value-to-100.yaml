# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.place-value-to-100
skill: math.numbers-to-100.place-value
curriculum: de-DE
language: de
title:
  de: Die Stellentafel
  en: The place-value chart
summary: >
  Two-digit numbers in the Stellentafel (Z, E) and with Zehnerstangen and
  Einerwürfel. Lesson 1 moves between blocks and the chart; lesson 2 adds
  zero in a column, more than nine ones (12 Einer are 1 Zehner und 2
  Einer) and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.bundle-tens]
  also_practises: []
  vocabulary: { de: [Stellentafel, Zehner, Einer, Stelle, Ziffer] }
  forms: [drawn, text, audio]
  drawn: [base-ten, place-value-chart]
  facets: []
  misconceptions:
    - id: digit-swap
      what: Writes the ones in the Z column (34 as 4 | 3), because German says the ones first
      addressed: Learn says "Zehner zuerst, links" every time; feedback on a swapped chart names the columns
    - id: zero-dropped
      what: Leaves the ones column empty for 40, or writes 4 for 4 Zehner und 0 Einer
      addressed: lesson 2 practises 0 in a column and says that the 0 holds the place
    - id: ten-ones-stay
      what: Writes 12 in the E column instead of bundling into a ten
      addressed: lesson 2 shows 12 Einerwürfel turning into 1 Zehner and 2 Einer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Zehner links, Einer rechts", en: "Tens left, ones right" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, tens: 3, ones: 5 }
            options: ["35", "53", "8"]
            answer: "35"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Zehner hat 70?"
            say: "Siebzig. Wie viele Zehner sind das?"
            options: ["7", "70", "17"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Z | E"
            say: "Das ist eine Stellentafel. Links stehen die Zehner, Z. Rechts stehen die Einer, E."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [null, null] }
          - text: "3 Zehner, 4 Einer"
            say: "Drei Zehnerstangen und vier Einerwürfel. Die Drei kommt zu den Zehnern, die Vier zu den Einern."
            show: { drawn: base-ten, tens: 3, ones: 4 }
          - text: "34"
            say: "In der Stellentafel steht drei bei Z und vier bei E. Das ist die Zahl vierunddreißig. Wir sagen die Einer zuerst, aber wir schreiben die Zehner zuerst, links."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [3, 4] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [2, 6] }
                options: ["26", "62", "8"]
                answer: "26"
                feedback:
                  "62": "Die 2 steht bei Z. Sie gibt die Zehner an und kommt nach links."
                hints:
                  - "Z heißt Zehner, E heißt Einer."
                  - "2 Zehner sind zwanzig. Dazu 6 Einer."
                  - "Das ist 26."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Trag die Zahl ein."
                say: "Schau dir die Stangen und Würfel an. Wie viele Zehner, wie viele Einer kommen in die Stellentafel?"
                show: { drawn: base-ten, tens: 4, ones: 7 }
                frame: "Z: _  E: _"
                options: ["4", "7", "11", "47"]
                answer: ["4", "7"]
                hints:
                  - "Die Stangen sind die Zehner."
                  - "Zähl die Stangen. Dann zähl die Würfel."
                  - "4 Zehner und 7 Einer."
              - id: l1-f3
                type: image_multiple_choice
                text: "Welche Stellentafel zeigt 53?"
                say: "Dreiundfünfzig. Welche Stellentafel zeigt diese Zahl?"
                options:
                  - { drawn: place-value-chart, columns: [tens, ones], values: [3, 5] }
                  - { drawn: place-value-chart, columns: [tens, ones], values: [5, 3] }
                  - { drawn: place-value-chart, columns: [tens, ones], values: [5, 0] }
                answer: "53"
                hints:
                  - "Die Zehner stehen links."
                  - "Wir hören die Drei zuerst, aber dreiundfünfzig hat fünf Zehner."
                  - "Z: 5, E: 3."
              - id: l1-f4
                type: true_false
                text: "6 Zehner und 2 Einer. Stimmt die Stellentafel?"
                say: "Hier sind sechs Zehner und zwei Einer. In der Stellentafel steht: Z zwei, E sechs. Stimmt das?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [2, 6] }
                answer: false
                hints:
                  - "Wie viele Zehner sollen es sein?"
                  - "Sechs Zehner gehören zu Z, links."
                  - "Nein, Z und E sind vertauscht."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viele Zehner hat 85?"
                options: ["5", "8", "85"]
                answer: "8"
                hints:
                  - "Die linke Ziffer gibt die Zehner an."
                  - "Bei 85 steht links die 8."
                  - "85 hat 8 Zehner."
              - id: l1-f6
                type: multiple_choice
                text: "Wie viele Einer hat 39?"
                options: ["3", "9", "39"]
                answer: "9"
                hints:
                  - "Die rechte Ziffer gibt die Einer an."
                  - "Bei 39 steht rechts die 9."
                  - "39 hat 9 Einer."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [7, 1] }
                options: ["17", "71", "8"]
                answer: "71"
                hints: ["Z steht links und heißt Zehner."]
              - id: l1-s2
                type: fill_in_blank
                text: "Trag die Zahl ein."
                say: "Schau dir die Stangen und Würfel an. Wie viele Zehner, wie viele Einer kommen in die Stellentafel?"
                show: { drawn: base-ten, tens: 5, ones: 8 }
                frame: "Z: _  E: _"
                options: ["5", "8", "13", "58"]
                answer: ["5", "8"]
                hints: ["Stangen sind Zehner."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Welche Stellentafel zeigt 64?"
                say: "Vierundsechzig. Welche Stellentafel zeigt diese Zahl?"
                options:
                  - { drawn: place-value-chart, columns: [tens, ones], values: [6, 4] }
                  - { drawn: place-value-chart, columns: [tens, ones], values: [4, 6] }
                  - { drawn: place-value-chart, columns: [tens, ones], values: [6, 0] }
                answer: "64"
                hints: ["Die Zehner sind sechs."]
              - id: l1-s4
                type: multiple_choice
                text: "Wie viele Zehner hat 92?"
                options: ["2", "9", "92"]
                answer: "9"
                hints: ["Die linke Ziffer."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Welches Bild zeigt 25?"
                options:
                  - { drawn: base-ten, tens: 5, ones: 2 }
                  - { drawn: base-ten, tens: 2, ones: 5 }
                  - { drawn: base-ten, tens: 2, ones: 2 }
                answer: "25"
                hints: ["Bei 25 sind es 2 Stangen."]
              - id: l1-s6
                type: multiple_choice
                text: "Wie viele Einer hat 76?"
                options: ["6", "7", "13"]
                answer: "6"
                hints: ["Die rechte Ziffer."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [4, 9] }
                options: ["49", "94", "13"]
                answer: "49"
              - id: l1-n2
                type: fill_in_blank
                text: "Trag die Zahl ein."
                say: "Schau dir die Stangen und Würfel an. Wie viele Zehner, wie viele Einer kommen in die Stellentafel?"
                show: { drawn: base-ten, tens: 8, ones: 3 }
                frame: "Z: _  E: _"
                options: ["3", "8", "11", "83"]
                answer: ["8", "3"]
              - id: l1-n3
                type: image_multiple_choice
                text: "Welche Stellentafel zeigt 18?"
                say: "Achtzehn. Welche Stellentafel zeigt diese Zahl?"
                options:
                  - { drawn: place-value-chart, columns: [tens, ones], values: [8, 1] }
                  - { drawn: place-value-chart, columns: [tens, ones], values: [1, 8] }
                  - { drawn: place-value-chart, columns: [tens, ones], values: [1, 0] }
                answer: "18"
              - id: l1-n4
                type: true_false
                text: "3 Zehner und 9 Einer. Stimmt die Stellentafel?"
                say: "Drei Zehner und neun Einer. In der Stellentafel steht: Z drei, E neun. Stimmt das?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [3, 9] }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele Zehner hat 57?"
                options: ["5", "7", "57"]
                answer: "5"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Zahl steht in der Stellentafel?"
            show: { drawn: place-value-chart, columns: [tens, ones], values: [6, 8] }
