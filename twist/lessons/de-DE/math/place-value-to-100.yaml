                answer: "80"
                feedback:
                  "8": "Die 8 steht bei Z. Das sind acht Zehner, also achtzig."
                hints:
                  - "Die 8 steht bei den Zehnern."
                  - "Acht Zehner sind achtzig."
                  - "Das ist 80."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
