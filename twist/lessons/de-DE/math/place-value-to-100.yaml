            text: "Trag die Zahl ein."
            say: "Schau dir die Stangen und Würfel an. Wie viele Zehner, wie viele Einer kommen in die Stellentafel?"
            show: { drawn: base-ten, tens: 2, ones: 4 }
            frame: "Z: _  E: _"
            options: ["2", "4", "6", "24"]
            answer: ["2", "4"]
          - id: l1-c3
            type: image_multiple_choice
            text: "Welche Stellentafel zeigt 31?"
            say: "Einunddreißig. Welche Stellentafel zeigt diese Zahl?"
            options:
              - { drawn: place-value-chart, columns: [tens, ones], values: [1, 3] }
              - { drawn: place-value-chart, columns: [tens, ones], values: [3, 1] }
            answer: "31"

  - n: 2
    title: { de: Null und zu viele Einer, en: Zero and too many ones }
