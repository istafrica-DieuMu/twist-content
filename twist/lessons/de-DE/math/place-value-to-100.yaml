            answer: "52"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viele Einer hat 43?"
            options: ["3", "4", "43"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "40"
            say: "Vier Zehnerstangen und kein Einerwürfel. Bei E schreiben wir eine Null. Die Null hält den Platz frei. Ohne sie stünde da nur eine Vier."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [4, 0] }
          - text: "12 Einer"
            say: "Hier sind zwölf Einerwürfel. Das sind mehr als neun. Zehn davon stecken wir zu einer Stange zusammen."
            show: { drawn: base-ten, tens: 0, ones: 12 }
          - text: "1 Zehner und 2 Einer"
            say: "Jetzt ist es eine Zehnerstange und zwei Einer. In der Stellentafel: Z eins, E zwei. Das ist zwölf. Bei E steht nie mehr als neun."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [1, 2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Trag die Zahl ein."
                say: "Sechs Zehnerstangen und kein Einer. Was kommt in die Stellentafel?"
                show: { drawn: base-ten, tens: 6, ones: 0 }
                frame: "Z: _  E: _"
                options: ["0", "6", "60"]
                answer: ["6", "0"]
                hints:
                  - "Es gibt keine Einerwürfel."
                  - "Keine Einer schreiben wir als 0."
                  - "Z: 6, E: 0."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
