# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.derive-facts
skill: math.mult-div.derive-facts
curriculum: de-DE
language: de
title:
  de: Schwierige Aufgaben ableiten
  en: Working out hard facts from easy ones
summary: >
  Hard Einmaleins facts worked out from the Kernaufgaben. Lesson 1 uses
  the Nachbaraufgabe (9 · 6 is 10 · 6 minus one 6; 6 · 4 is 5 · 4 plus
  one 4) and verdoppeln (4 · 7 is double 2 · 7); lesson 2 splits a fact
  into two Kernaufgaben (7 · 6 = 5 · 6 + 2 · 6) on a Punktefeld, and
  ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Einmaleins, en: Times tables }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.core-facts, math.numbers-to-100.double-halve]
  also_practises: [math.mult-div.core-facts]
  vocabulary: { de: [Kernaufgabe, Nachbaraufgabe, verdoppeln, zerlegen, ableiten] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: neighbour-minus-one
      what: Takes away 1 instead of one whole row (9 · 6 = 60 − 1)
      addressed: lesson 1 Learn takes one row of six away on the Punktefeld; a Nachbaraufgabe task in every stage of lesson 1, a minus-one option with feedback in l1-f1; l1-s5 and l2-c5 ask whether one more or one less is enough
    - id: split-only-one-part
      what: Splits a fact but adds only one part (7 · 6 = 5 · 6 = 30)
      addressed: lesson 2 frames ask for both parts and then the whole result, in every stage; l2-s3, l2-s5, l2-n3 and l2-c5 offer a split whose second part is not multiplied
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Nachbaraufgaben und Verdoppeln, en: Neighbour facts and doubling }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "10 · 7 = _"
            say: "Zehn mal sieben."
            answer: "70"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "5 · 8 = _"
            say: "Fünf mal acht."
            answer: "40"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "9 · 6 = 10 · 6 − 6"
            say: "Neun mal sechs ist schwer. Die Kernaufgabe daneben ist leicht: Zehn mal sechs ist sechzig. Neun mal sechs ist ein Sechser weniger: sechzig minus sechs ist vierundfünfzig."
            show: { drawn: dots, array: [10, 6], split_rows: 9 }
          - text: "6 · 4 = 5 · 4 + 4"
            say: "Sechs mal vier liegt neben fünf mal vier. Es ist ein Vierer mehr: zwanzig plus vier ist vierundzwanzig. Solche Aufgaben heißen Nachbaraufgaben."
          - text: "4 · 7 = 2 · 7 + 2 · 7"
            say: "Vier mal sieben ist das Doppelte von zwei mal sieben. Zwei mal sieben ist vierzehn, das Doppelte ist achtundzwanzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Nutze die Kernaufgabe daneben."
                say: "Rechne zuerst zehn mal vier, dann neun mal vier."
                frame: "10 · 4 = _ | 9 · 4 = 10 · 4 − 4 = _"
                options: ["40", "36", "39", "44"]
                answer: ["40", "36"]
                feedback:
                  "39": "Neun mal vier ist ein ganzer Vierer weniger, also vierzig minus vier, nicht minus eins."
                hints:
                  - "Zehn mal vier sind vier Zehner."
                  - "Nimm einen ganzen Vierer weg."
                  - "40 und 36."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Nutze die Kernaufgabe daneben."
                say: "Rechne zuerst fünf mal sieben, dann sechs mal sieben."
                frame: "5 · 7 = _ | 6 · 7 = 5 · 7 + 7 = _"
                options: ["35", "42", "36", "40"]
                answer: ["35", "42"]
                hints:
                  - "Fünf mal sieben ist die Hälfte von siebzig."
                  - "Sechs mal sieben ist ein Siebener mehr."
                  - "35 und 42."
              - id: l1-f3
                type: fill_in_blank
                text: "Verdopple."
                say: "Rechne zuerst zwei mal sechs, dann vier mal sechs."
                frame: "2 · 6 = _ | 4 · 6 = _"
                options: ["12", "24", "18", "36"]
                answer: ["12", "24"]
                hints:
                  - "Zwei mal sechs ist zwölf."
                  - "Vier mal ist das Doppelte."
                  - "12 und 24."
              - id: l1-f4
                type: multiple_choice
                text: "Welche Kernaufgabe hilft bei 9 · 8?"
                say: "Welche Kernaufgabe hilft dir bei neun mal acht?"
                options: ["10 · 8", "2 · 8", "9 · 1"]
                answer: "10 · 8"
                hints:
                  - "Neun liegt direkt neben zehn."
                  - "Zehn mal acht, dann einen Achter weg."
                  - "10 · 8."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 9 · 7 = 70 − 7"
                say: "Neun mal sieben ist siebzig minus sieben. Stimmt das?"
                answer: true
                hints:
                  - "Zehn mal sieben ist siebzig."
                  - "Neun mal sieben ist ein Siebener weniger."
                  - "Ja, das stimmt: 63."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Nutze die Kernaufgabe daneben."
                say: "Rechne zuerst zehn mal drei, dann neun mal drei."
                frame: "10 · 3 = _ | 9 · 3 = 10 · 3 − 3 = _"
                options: ["30", "27", "29", "33"]
                answer: ["30", "27"]
                hints: ["Nimm einen ganzen Dreier weg."]
              - id: l1-s2
                type: fill_in_blank
                text: "Nutze die Kernaufgabe daneben."
                say: "Rechne zuerst fünf mal neun, dann sechs mal neun."
                frame: "5 · 9 = _ | 6 · 9 = 5 · 9 + 9 = _"
                options: ["45", "54", "46", "50"]
                answer: ["45", "54"]
                hints: ["Sechs mal neun ist ein Neuner mehr."]
              - id: l1-s3
                type: fill_in_blank
                text: "Verdopple."
                say: "Rechne zuerst zwei mal acht, dann vier mal acht."
                frame: "2 · 8 = _ | 4 · 8 = _"
                options: ["16", "32", "24", "18"]
                answer: ["16", "32"]
                hints: ["Vier mal ist das Doppelte von zwei mal."]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Kernaufgabe hilft bei 6 · 3?"
                say: "Welche Kernaufgabe hilft dir bei sechs mal drei?"
                options: ["10 · 3", "5 · 3", "1 · 6"]
                answer: "5 · 3"
                hints: ["Welche Kernaufgabe liegt direkt neben sechs mal drei?"]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? 9 · 5 = 50 − 1"
                say: "Neun mal fünf ist fünfzig minus eins. Stimmt das?"
                answer: false
                hints: ["Wie viel weniger ist neun mal fünf als zehn mal fünf?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Nutze die Kernaufgabe daneben."
                say: "Rechne zuerst zehn mal neun, dann neun mal neun."
                frame: "10 · 9 = _ | 9 · 9 = 10 · 9 − 9 = _"
                options: ["90", "81", "89", "99"]
                answer: ["90", "81"]
              - id: l1-n2
                type: fill_in_blank
                text: "Nutze die Kernaufgabe daneben."
                say: "Rechne zuerst fünf mal drei, dann sechs mal drei."
                frame: "5 · 3 = _ | 6 · 3 = 5 · 3 + 3 = _"
                options: ["15", "18", "16", "21"]
                answer: ["15", "18"]
              - id: l1-n3
                type: fill_in_blank
                text: "Verdopple."
                say: "Rechne zuerst zwei mal neun, dann vier mal neun."
                frame: "2 · 9 = _ | 4 · 9 = _"
                options: ["18", "36", "27", "45"]
                answer: ["18", "36"]
              - id: l1-n4
                type: multiple_choice
                text: "Welche Kernaufgabe hilft bei 4 · 6?"
                say: "Welche Kernaufgabe hilft dir bei vier mal sechs?"
                options: ["2 · 6", "10 · 6", "4 · 1"]
                answer: "2 · 6"
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 6 · 8 = 40 + 8"
                say: "Sechs mal acht ist vierzig plus acht. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "9 · 8 = _"
            say: "Neun mal acht."
            answer: "72"
          - id: l1-c2
            type: text_input
            text: "6 · 5 = _"
            say: "Sechs mal fünf."
            answer: "30"
          - id: l1-c3
            type: text_input
            text: "4 · 3 = _"
            say: "Vier mal drei."
            answer: "12"

  - n: 2
    title: { de: Zerlegen in Kernaufgaben, en: Splitting into core facts }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "9 · 2 = _"
            say: "Neun mal zwei."
            answer: "18"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "4 · 5 = _"
            say: "Vier mal fünf."
            answer: "20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 · 6 = 5 · 6 + 2 · 6"
            say: "Sieben mal sechs zerlegst du in fünf mal sechs und zwei mal sechs. Im Punktefeld siehst du oben fünf Reihen und unten zwei Reihen."
            show: { drawn: dots, array: [7, 6], split_rows: 5 }
          - text: "30 + 12 = 42"
            say: "Fünf mal sechs ist dreißig, zwei mal sechs ist zwölf. Zusammen sind es zweiundvierzig."
          - text: "8 · 4 = 10 · 4 − 2 · 4"
            say: "Such dir immer die Kernaufgaben, die du sicher kannst. Acht mal vier geht als zehn mal vier minus zwei mal vier: vierzig minus acht ist zweiunddreißig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Zerlege: 7 · 4"
                say: "Zerlege sieben mal vier in fünf mal vier und zwei mal vier."
                show: { drawn: dots, array: [7, 4], split_rows: 5 }
                frame: "5 · 4 = _ | 2 · 4 = _ | 7 · 4 = _"
                options: ["20", "8", "28", "24"]
                answer: ["20", "8", "28"]
                hints:
                  - "Fünf mal vier ist die Hälfte von vierzig."
                  - "Zwei mal vier ist acht."
                  - "20, 8 und 28."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Zerlege: 7 · 8"
                say: "Zerlege sieben mal acht in fünf mal acht und zwei mal acht."
                frame: "5 · 8 = _ | 2 · 8 = _ | 7 · 8 = _"
                options: ["40", "16", "56", "54"]
                answer: ["40", "16", "56"]
                hints:
                  - "Fünf mal acht ist die Hälfte von achtzig."
                  - "Zwei mal acht ist das Doppelte von acht."
                  - "40, 16 und 56."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Zerlegung passt zu 7 · 3?"
                say: "Welche Zerlegung passt zu sieben mal drei?"
                options: ["5 · 3 + 2 · 3", "5 · 3 + 3", "7 · 1 + 3"]
                answer: "5 · 3 + 2 · 3"
                hints:
                  - "Sieben ist fünf und zwei."
                  - "Beide Teile werden mal drei genommen."
                  - "5 · 3 + 2 · 3."
              - id: l2-f4
                type: text_input
                text: "7 · 9 = _"
                say: "Sieben mal neun. Zerlege in Kernaufgaben."
                answer: "63"
                hints:
                  - "Fünf mal neun und zwei mal neun."
                  - "45 + 18."
                  - "63."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 8 · 6 = 10 · 6 − 2 · 6"
                say: "Acht mal sechs ist zehn mal sechs minus zwei mal sechs. Stimmt das?"
                answer: true
                hints:
                  - "Acht ist zwei weniger als zehn."
                  - "60 − 12."
                  - "Ja, das stimmt: 48."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Zerlege: 7 · 7"
                say: "Zerlege sieben mal sieben in fünf mal sieben und zwei mal sieben."
                frame: "5 · 7 = _ | 2 · 7 = _ | 7 · 7 = _"
                options: ["35", "14", "49", "47"]
                answer: ["35", "14", "49"]
                hints: ["Rechne beide Kernaufgaben, dann rechne plus."]
              - id: l2-s2
                type: fill_in_blank
                text: "Zerlege: 8 · 3"
                say: "Rechne acht mal drei als zehn mal drei minus zwei mal drei."
                frame: "10 · 3 = _ | 2 · 3 = _ | 8 · 3 = _"
                options: ["30", "6", "24", "27"]
                answer: ["30", "6", "24"]
                hints: ["Rechne beide Kernaufgaben, dann rechne minus."]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Zerlegung passt zu 6 · 7?"
                say: "Welche Zerlegung passt zu sechs mal sieben?"
                options: ["5 · 7 + 1 · 7", "5 · 7 + 1", "6 · 5 + 7"]
                answer: "5 · 7 + 1 · 7"
                hints: ["Sechs ist fünf und eins."]
              - id: l2-s4
                type: text_input
                text: "8 · 7 = _"
                say: "Acht mal sieben. Zerlege in Kernaufgaben."
                answer: "56"
                hints: ["Zum Beispiel zehn mal sieben minus zwei mal sieben."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? 7 · 5 = 5 · 5 + 2"
                say: "Sieben mal fünf ist fünf mal fünf plus zwei. Stimmt das?"
                answer: false
                hints: ["Wird der zweite Teil auch mal fünf genommen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Zerlege: 7 · 2"
                say: "Zerlege sieben mal zwei in fünf mal zwei und zwei mal zwei."
                frame: "5 · 2 = _ | 2 · 2 = _ | 7 · 2 = _"
                options: ["10", "4", "14", "12"]
                answer: ["10", "4", "14"]
              - id: l2-n2
                type: fill_in_blank
                text: "Zerlege: 8 · 9"
                say: "Rechne acht mal neun als zehn mal neun minus zwei mal neun."
                frame: "10 · 9 = _ | 2 · 9 = _ | 8 · 9 = _"
                options: ["90", "18", "72", "81"]
                answer: ["90", "18", "72"]
              - id: l2-n3
                type: multiple_choice
                text: "Welche Zerlegung passt zu 8 · 5?"
                say: "Welche Zerlegung passt zu acht mal fünf?"
                options: ["10 · 5 − 2", "10 · 5 − 2 · 5", "8 · 1 + 5"]
                answer: "10 · 5 − 2 · 5"
              - id: l2-n4
                type: text_input
                text: "8 · 6 = _"
                say: "Acht mal sechs."
                answer: "48"
              - id: l2-n5
                type: true_false
                text: "Stimmt das? 6 · 9 = 5 · 9 + 9"
                say: "Sechs mal neun ist fünf mal neun plus neun. Stimmt das?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "6 · 6 = _"
            say: "Sechs mal sechs."
            answer: "36"
          - id: l2-c2
            type: text_input
            text: "4 · 4 = _"
            say: "Vier mal vier."
            answer: "16"
          - id: l2-c3
            type: text_input
            text: "8 · 8 = _"
            say: "Acht mal acht."
            answer: "64"
          - id: l2-c4
            type: multiple_choice
            text: "Welche Kernaufgabe hilft bei 9 · 3?"
            say: "Welche Kernaufgabe hilft dir bei neun mal drei?"
            options: ["2 · 3", "10 · 3", "9 · 1"]
            answer: "10 · 3"
          - id: l2-c5
            type: true_false
            text: "Stimmt das? 6 · 7 = 5 · 7 + 1"
            say: "Sechs mal sieben ist fünf mal sieben plus eins. Stimmt das?"
            answer: false
