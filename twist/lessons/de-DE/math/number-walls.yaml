# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.number-walls
skill: math.add-sub-to-20.number-walls
curriculum: de-DE
language: de
title:
  de: Zahlenmauern und Rechenketten
  en: Number walls and number chains
summary: >
  Zahlenmauern (each stone is the two stones under it added together) and
  Rechenketten to 20. Lesson 1 fills a wall upwards and finds a missing
  stone at the bottom by subtracting; lesson 2 follows Rechenketten with
  plus and minus, looks at what changes when a bottom stone changes, and
  ends with the skill check. Rechentabellen are not in this set yet.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.inverse]
  also_practises: [math.add-sub-to-20.missing-addend]
  vocabulary: { de: [Zahlenmauer, Stein, Rechenkette, plus, minus, Muster] }
  forms: [drawn, text, audio]
  drawn: [number-wall]
  facets: []
  misconceptions:
    - id: add-for-bottom-gap
      what: Adds the two stones it can see when the gap is at the bottom (oben 12, unten 5, writes 17)
      addressed: Learn screen 3 finds a bottom gap by subtracting from the stone above; feedback on the sum in the full stage
    - id: chain-from-start
      what: Applies every step of a Rechenkette to the first number instead of the last result
      addressed: lesson 2 Learn carries each result to the next arrow; feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zahlenmauern, en: Number walls }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 + 7 = _"
            say: "Sechs plus sieben."
            answer: "13"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Wie viel fehlt?"
            say: "Fünf plus wie viel ist zwölf?"
            frame: "5 + _ = 12"
            options: ["7", "12", "17"]
            answer: ["7"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 + 5 = 8"
            say: "Das ist eine Zahlenmauer. In jedem Stein steht, was die zwei Steine darunter zusammen ergeben. Drei plus fünf ist acht."
            show: { drawn: number-wall, rows: [[3, 5], [8]] }
          - text: "4 + 2 = 6 | 2 + 5 = 7 | 6 + 7 = 13"
            say: "Eine Mauer mit drei Steinen unten. Vier plus zwei ist sechs. Zwei plus fünf ist sieben. Oben steht sechs plus sieben, also dreizehn."
            show: { drawn: number-wall, rows: [[4, 2, 5], [6, 7], [13]] }
          - text: "12 − 5 = 7"
            say: "Manchmal fehlt unten ein Stein. Oben steht zwölf, unten fünf. Fünf plus wie viel ist zwölf? Rechne minus: zwölf minus fünf ist sieben."
            show: { drawn: number-wall, rows: [[5, null], [12]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Füll den oberen Stein."
                say: "Welche Zahl gehört in den oberen Stein?"
                show: { drawn: number-wall, rows: [[6, 4], [null]] }
                frame: "_"
                options: ["2", "10", "64"]
                answer: ["10"]
                hints:
                  - "Rechne die zwei Steine darunter zusammen."
                  - "Sechs plus vier."
                  - "10."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Füll die Mitte, dann oben."
                say: "Füll die zwei Steine in der Mitte, dann den oberen Stein."
                show: { drawn: number-wall, rows: [[2, 3, 4], [null, null], [null]] }
                frame: "_ | _ | _"
                options: ["5", "6", "7", "11", "12"]
                answer: ["5", "7", "12"]
                hints:
                  - "Zwei plus drei, dann drei plus vier."
                  - "In der Mitte stehen 5 und 7."
                  - "5 + 7 = 12 oben."
              - id: l1-f3
                type: fill_in_blank
                text: "Finde den Stein unten."
                say: "Oben steht fünfzehn, unten neun. Welcher Stein fehlt?"
                show: { drawn: number-wall, rows: [[9, null], [15]] }
                frame: "_"
                options: ["6", "15", "24"]
                answer: ["6"]
                feedback:
                  "24": "Du hast neun und fünfzehn zusammengerechnet. Unten fehlt ein Stein: Neun plus wie viel ist fünfzehn?"
                hints:
                  - "Neun plus wie viel ist fünfzehn?"
                  - "Rechne minus: fünfzehn minus neun."
                  - "6."
              - id: l1-f4
                type: true_false
                text: "Stimmt die Mauer?"
                say: "Schau dir die Mauer an. Stimmt sie?"
                show: { drawn: number-wall, rows: [[7, 5], [13]] }
                answer: false
                hints:
                  - "Rechne die zwei unteren Steine zusammen."
                  - "Sieben plus fünf ist zwölf."
                  - "Nein, oben muss 12 stehen."
              - id: l1-f5
                type: fill_in_blank
                text: "Finde den Stein unten."
                say: "Oben steht elf, unten drei. Welcher Stein fehlt?"
                show: { drawn: number-wall, rows: [[null, 3], [11]] }
                frame: "_"
                options: ["8", "11", "14"]
                answer: ["8"]
                hints:
                  - "Wie viel plus drei ist elf?"
                  - "Elf minus drei."
                  - "8."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Füll den oberen Stein."
                say: "Welche Zahl gehört in den oberen Stein?"
                show: { drawn: number-wall, rows: [[8, 7], [null]] }
                frame: "_"
                options: ["1", "15", "16"]
                answer: ["15"]
                hints: ["Rechne die zwei Steine darunter zusammen."]
              - id: l1-s2
                type: fill_in_blank
                text: "Füll die Mitte, dann oben."
                say: "Füll die zwei Steine in der Mitte, dann den oberen Stein."
                show: { drawn: number-wall, rows: [[1, 5, 3], [null, null], [null]] }
                frame: "_ | _ | _"
                options: ["6", "8", "9", "14", "15"]
                answer: ["6", "8", "14"]
                hints: ["Arbeite Reihe für Reihe nach oben."]
              - id: l1-s3
                type: fill_in_blank
                text: "Finde den Stein unten."
                say: "Oben steht siebzehn, unten acht. Welcher Stein fehlt?"
                show: { drawn: number-wall, rows: [[8, null], [17]] }
                frame: "_"
                options: ["9", "17", "25"]
                answer: ["9"]
                hints: ["Rechne vom oberen Stein aus minus."]
              - id: l1-s4
                type: true_false
                text: "Stimmt die Mauer?"
                say: "Schau dir die Mauer an. Stimmt sie?"
                show: { drawn: number-wall, rows: [[3, 4, 2], [7, 6], [13]] }
                answer: true
                hints: ["Prüf jeden Stein mit den zwei darunter."]
              - id: l1-s5
                type: fill_in_blank
                text: "Finde den Stein unten."
                say: "Oben steht zwanzig, unten zwölf. Welcher Stein fehlt?"
                show: { drawn: number-wall, rows: [[null, 12], [20]] }
                frame: "_"
                options: ["8", "12", "32"]
                answer: ["8"]
                hints: ["Wie viel plus zwölf ist zwanzig?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Füll den oberen Stein."
                say: "Welche Zahl gehört in den oberen Stein?"
                show: { drawn: number-wall, rows: [[9, 5], [null]] }
                frame: "_"
                options: ["4", "14", "15"]
                answer: ["14"]
              - id: l1-n2
                type: fill_in_blank
                text: "Füll die Mitte, dann oben."
                say: "Füll die zwei Steine in der Mitte, dann den oberen Stein."
                show: { drawn: number-wall, rows: [[3, 3, 6], [null, null], [null]] }
                frame: "_ | _ | _"
                options: ["6", "9", "12", "15"]
                answer: ["6", "9", "15"]
              - id: l1-n3
                type: fill_in_blank
                text: "Finde den Stein unten."
                say: "Oben steht vierzehn, unten sechs. Welcher Stein fehlt?"
                show: { drawn: number-wall, rows: [[6, null], [14]] }
                frame: "_"
                options: ["8", "14", "20"]
                answer: ["8"]
              - id: l1-n4
                type: true_false
                text: "Stimmt die Mauer?"
                say: "Schau dir die Mauer an. Stimmt sie?"
                show: { drawn: number-wall, rows: [[5, 4, 4], [9, 8], [18]] }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Finde den Stein unten."
                say: "Oben steht sechzehn, unten sieben. Welcher Stein fehlt?"
                show: { drawn: number-wall, rows: [[null, 7], [16]] }
                frame: "_"
                options: ["9", "16", "23"]
                answer: ["9"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Füll den oberen Stein."
            say: "Welche Zahl gehört in den oberen Stein?"
            show: { drawn: number-wall, rows: [[7, 6], [null]] }
            frame: "_"
            options: ["1", "13", "14"]
            answer: ["13"]
          - id: l1-c2
            type: fill_in_blank
            text: "Finde den Stein unten."
            say: "Oben steht dreizehn, unten vier. Welcher Stein fehlt?"
            show: { drawn: number-wall, rows: [[4, null], [13]] }
            frame: "_"
            options: ["9", "13", "17"]
            answer: ["9"]
          - id: l1-c3
            type: true_false
            text: "Stimmt die Mauer?"
            say: "Schau dir die Mauer an. Stimmt sie?"
            show: { drawn: number-wall, rows: [[2, 6], [8]] }
            answer: true

  - n: 2
    title: { de: Rechenketten, en: Number chains }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Füll den oberen Stein."
            say: "Welche Zahl gehört in den oberen Stein?"
            show: { drawn: number-wall, rows: [[5, 8], [null]] }
            frame: "_"
            options: ["3", "13", "14"]
            answer: ["13"]
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "15 − 7 = _"
            say: "Fünfzehn minus sieben."
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4 → +3 → 7 → +5 → 12"
            say: "Das ist eine Rechenkette. Fang bei vier an. Plus drei: sieben. Dann rechnest du mit der Sieben weiter: plus fünf ist zwölf. Jeder Schritt fängt bei der Zahl an, die du gerade bekommen hast."
          - text: "15 → −6 → 9 → +4 → 13"
            say: "In einer Rechenkette gibt es auch minus. Fünfzehn minus sechs ist neun. Neun plus vier ist dreizehn."
          - text: "3 + 4 = 7"
            say: "Zurück zur Mauer. Unten stehen drei und vier, oben sieben."
            show: { drawn: number-wall, rows: [[3, 4], [7]] }
          - text: "3 + 5 = 8"
            say: "Jetzt wird die Vier zur Fünf, eins mehr. Dann wird auch oben eins mehr: acht. Wird ein Stein unten zwei größer, wird oben zwei größer. Wird er eins kleiner, wird oben eins kleiner."
            show: { drawn: number-wall, rows: [[3, 5], [8]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "5 → +4 → _ → +6 → _"
                say: "Fang bei fünf an. Rechne plus vier, dann plus sechs."
                frame: "5 → +4 → _ → +6 → _"
                options: ["9", "11", "15", "16"]
                answer: ["9", "15"]
                feedback:
                  "11": "Plus sechs rechnest du mit der Neun, nicht mit der Fünf: neun plus sechs."
                hints:
                  - "Zuerst fünf plus vier."
                  - "Dann rechnest du mit der Neun weiter."
                  - "9, dann 15."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "14 → −5 → _ → +3 → _"
                say: "Fang bei vierzehn an. Rechne minus fünf, dann plus drei."
                frame: "14 → −5 → _ → +3 → _"
                options: ["9", "12", "17", "19"]
                answer: ["9", "12"]
                hints:
                  - "Zuerst vierzehn minus fünf."
                  - "Dann neun plus drei."
                  - "9, dann 12."
              - id: l2-f3
                type: multiple_choice
                text: "Die 4 wird zur 5. Was steht jetzt oben?"
                say: "In der Mauer stehen unten vier und neun, oben dreizehn. Die Vier wird zur Fünf. Was steht jetzt oben?"
                show: { drawn: number-wall, rows: [[4, 9], [13]] }
                options: ["14", "13", "15"]
                answer: "14"
                hints:
                  - "Ein unterer Stein wird eins größer."
                  - "Dann wird auch oben eins größer."
                  - "14."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 8 → +7 → 15 → −9 → 6"
                say: "Acht plus sieben ist fünfzehn, fünfzehn minus neun ist sechs. Stimmt die Kette?"
                answer: true
                hints:
                  - "Acht plus sieben ist fünfzehn."
                  - "Fünfzehn minus neun ist sechs."
                  - "Ja."
              - id: l2-f5
                type: fill_in_blank
                text: "Füll die Mitte, dann oben."
                say: "Füll die zwei Steine in der Mitte, dann den oberen Stein."
                show: { drawn: number-wall, rows: [[6, 2, 7], [null, null], [null]] }
                frame: "_ | _ | _"
                options: ["8", "9", "16", "17"]
                answer: ["8", "9", "17"]
                hints:
                  - "Sechs plus zwei, dann zwei plus sieben."
                  - "8 und 9."
                  - "8 + 9 = 17."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "7 → +6 → _ → −4 → _"
                say: "Fang bei sieben an. Rechne plus sechs, dann minus vier."
                frame: "7 → +6 → _ → −4 → _"
                options: ["9", "13", "3", "17"]
                answer: ["13", "9"]
                hints: ["Rechne mit der Zahl weiter, die du gerade bekommen hast."]
              - id: l2-s2
                type: fill_in_blank
                text: "20 → −8 → _ → −5 → _"
                say: "Fang bei zwanzig an. Rechne minus acht, dann minus fünf."
                frame: "20 → −8 → _ → −5 → _"
                options: ["7", "12", "15", "13"]
                answer: ["12", "7"]
                hints: ["Ein Schritt nach dem anderen."]
              - id: l2-s3
                type: multiple_choice
                text: "Unten stehen 3 und 6. Die 6 wird zur 8. Was passiert oben?"
                say: "In einer Mauer stehen unten drei und sechs. Die Sechs wird zur Acht. Was passiert oben?"
                options: ["Es wird 2 mehr.", "Es wird 1 mehr.", "Es bleibt gleich."]
                answer: "Es wird 2 mehr."
                hints: ["Wie viel größer ist acht als sechs?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 6 → +9 → 15 → −7 → 9"
                say: "Sechs plus neun ist fünfzehn, fünfzehn minus sieben ist neun. Stimmt die Kette?"
                answer: false
                hints: ["Prüf jeden Schritt."]
              - id: l2-s5
                type: fill_in_blank
                text: "Finde den Stein unten."
                say: "Oben steht achtzehn, unten zehn. Welcher Stein fehlt?"
                show: { drawn: number-wall, rows: [[10, null], [18]] }
                frame: "_"
                options: ["8", "18", "28"]
                answer: ["8"]
                hints: ["Rechne vom oberen Stein aus minus."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "9 → +8 → _ → −6 → _"
                say: "Fang bei neun an. Rechne plus acht, dann minus sechs."
                frame: "9 → +8 → _ → −6 → _"
                options: ["11", "17", "3", "15"]
                answer: ["17", "11"]
              - id: l2-n2
                type: fill_in_blank
                text: "12 → −4 → _ → +9 → _"
                say: "Fang bei zwölf an. Rechne minus vier, dann plus neun."
                frame: "12 → −4 → _ → +9 → _"
                options: ["8", "17", "16", "21"]
                answer: ["8", "17"]
              - id: l2-n3
                type: multiple_choice
                text: "Die 7 wird zur 6. Was steht jetzt oben?"
                say: "In der Mauer stehen unten sieben und sechs, oben dreizehn. Die Sieben wird zur Sechs. Was steht jetzt oben?"
                show: { drawn: number-wall, rows: [[7, 6], [13]] }
                options: ["12", "13", "11"]
                answer: "12"
              - id: l2-n4
                type: true_false
                text: "Stimmt die Mauer?"
                say: "Schau dir die Mauer an. Stimmt sie?"
                show: { drawn: number-wall, rows: [[4, 4, 5], [8, 9], [17]] }
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Füll die Mitte, dann oben."
                say: "Füll die zwei Steine in der Mitte, dann den oberen Stein."
                show: { drawn: number-wall, rows: [[5, 1, 8], [null, null], [null]] }
                frame: "_ | _ | _"
                options: ["6", "9", "14", "15"]
                answer: ["6", "9", "15"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Füll die Mitte, dann oben."
            say: "Füll die zwei Steine in der Mitte, dann den oberen Stein."
            show: { drawn: number-wall, rows: [[2, 7, 3], [null, null], [null]] }
            frame: "_ | _ | _"
            options: ["9", "10", "19", "20"]
            answer: ["9", "10", "19"]
          - id: l2-c2
            type: fill_in_blank
            text: "Finde den Stein unten."
            say: "Oben steht neunzehn, unten elf. Welcher Stein fehlt?"
            show: { drawn: number-wall, rows: [[null, 11], [19]] }
            frame: "_"
            options: ["8", "19", "30"]
            answer: ["8"]
          - id: l2-c3
            type: fill_in_blank
            text: "6 → +7 → _ → −8 → _"
            say: "Fang bei sechs an. Rechne plus sieben, dann minus acht."
            frame: "6 → +7 → _ → −8 → _"
            options: ["5", "13", "2", "14"]
            answer: ["13", "5"]
          - id: l2-c4
            type: true_false
            text: "Stimmt die Mauer?"
            say: "Schau dir die Mauer an. Stimmt sie?"
            show: { drawn: number-wall, rows: [[6, 9], [16]] }
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Unten stehen 5 und 7. Die 5 wird zur 4. Was passiert oben?"
            say: "In einer Mauer stehen unten fünf und sieben. Die Fünf wird zur Vier. Was passiert oben?"
            options: ["Es wird 1 weniger.", "Es wird 1 mehr.", "Es bleibt gleich."]
            answer: "Es wird 1 weniger."
