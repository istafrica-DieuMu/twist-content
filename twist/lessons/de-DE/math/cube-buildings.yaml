# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.cube-buildings
skill: math.solids.cube-buildings
curriculum: de-DE
language: de
title:
  de: Würfelgebäude und Baupläne
  en: Cube buildings and plans
summary: >
  Lesson 1 reads a Bauplan in one row: each field says how many Würfel
  stand on top of each other there, the whole building needs the sum of
  all numbers (Bauplan 3 1 2: 6 Würfel), and the plan starts on the
  left; lesson 2 reads and writes plans with two rows (hinten and
  vorne), finds the highest tower, and ends with the skill check.
  Building with real cubes and drawing a building from a plan wait for a
  hands-on task and a 3D view of a whole building.
metadata:
  year: klasse-2
  topic: { de: Körper, en: 3D shapes }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.solids.cube-cuboid-sphere, math.numbers-to-20.count-to-10]
  also_practises: [math.add-sub-to-20.add-bridge-10]
  vocabulary: { de: [Würfel, Turm, Würfelgebäude, Bauplan, Feld, vorne, hinten, links, rechts, übereinander] }
  forms: [picture, text, audio, drawn]
  drawn: [shape]
  facets: []
  misconceptions:
    - id: counts-fields
      what: Counts the fields of the Bauplan instead of adding the numbers in them
      addressed: lesson 1 Learn adds the numbers, not the fields; the count questions in every stage offer the number of fields, with feedback in l1-f2 and l2-f1
    - id: plan-order-swapped
      what: Writes the towers into the Bauplan in the wrong order (links and rechts, or vorne and hinten, swapped)
      addressed: lesson 1 Learn says the plan starts on the left; l1-f5 (with feedback) and l2-c4 offer the swapped plan; lesson 2 Learn says the upper row is hinten, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Türme und Baupläne", en: "Towers and plans" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Wo ist der Würfel?"
            say: "Wo ist der Würfel?"
            options:
              - { drawn: shape, kind: sphere, colour: red }
              - { drawn: shape, kind: cuboid, colour: red }
              - { drawn: shape, kind: cube, colour: red }
            answer: cube
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Würfel sind es?"
            say: "Wie viele Würfel sind es?"
            show: { object: cube, count: 7, layout: scattered }
            options: ["6", "7", "8"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ein Turm aus 3 Würfeln"
            say: "Das ist ein Turm. Drei Würfel stehen übereinander."
            show: { drawn: shape, column: [cube, cube, cube], colours: red }
          - text: "Bauplan: 3 1 2"
            say: "Ein Bauplan zeigt ein Würfelgebäude von oben. In jedem Feld steht, wie viele Würfel dort übereinander stehen. Der Bauplan fängt links an: links drei, in der Mitte einer, rechts zwei."
          - text: "3 + 1 + 2 = 6"
            say: "Wie viele Würfel brauchst du für das ganze Gebäude? Zähl nicht die Felder. Zähl die Zahlen zusammen: drei plus eins plus zwei. Das sind sechs Würfel."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Würfel hat der Turm?"
                say: "Wie viele Würfel hat dieser Turm?"
                show: { drawn: shape, column: [cube, cube, cube, cube], colours: blue }
                options: ["4", "3", "5"]
                answer: "4"
                hints:
                  - "Zähl von unten nach oben."
                  - "Zeig auf jeden Würfel: eins, zwei, ..."
                  - "4 Würfel."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Bauplan: 2 3 1\nWie viele Würfel brauchst du?"
                say: "Hier ist ein Bauplan. Wie viele Würfel brauchst du für das ganze Gebäude?"
                options: ["6", "3", "5"]
                answer: "6"
                feedback:
                  "3": "3 ist die Zahl der Felder. Zähl die Zahlen zusammen: 2 + 3 + 1."
                hints:
                  - "Jede Zahl sagt, wie viele Würfel in diesem Feld stehen."
                  - "Rechne 2 + 3 + 1."
                  - "6 Würfel."
              - id: l1-f3
                type: multiple_choice
                text: "Bauplan: 1 4 2\nWo steht der höchste Turm?"
                say: "Wo steht der höchste Turm?"
                options: ["links", "in der Mitte", "rechts"]
                answer: "in der Mitte"
                keep_order: true
                hints:
                  - "Der höchste Turm hat die meisten Würfel."
                  - "Welche Zahl ist am größten?"
                  - "Die 4 steht in der Mitte."
              - id: l1-f4
                type: true_false
                text: "Bauplan: 2 2 2\nDu brauchst 6 Würfel."
                say: "Stimmt das? Für diesen Bauplan brauchst du sechs Würfel."
                answer: true
                hints:
                  - "Zähl alle Zahlen zusammen."
                  - "2 + 2 + 2."
                  - "Ja, das sind 6 Würfel."
              - id: l1-f5
                type: multiple_choice
                text: "Links: 1 Würfel. Mitte: 3 Würfel. Rechts: 2 Würfel.\nWelcher Bauplan passt?"
                say: "Links steht ein Turm aus einem Würfel, in der Mitte einer aus drei Würfeln, rechts einer aus zwei. Welcher Bauplan passt?"
                options: ["1 3 2", "2 3 1", "6"]
                answer: "1 3 2"
                option_audio: false
                feedback:
                  "2 3 1": "Links und rechts sind vertauscht. Der Bauplan fängt links an."
                  "6": "6 ist die Zahl aller Würfel. Im Bauplan steht für jedes Feld eine Zahl."
                hints:
                  - "Der Bauplan fängt links an."
                  - "Zuerst links: 1. Dann die Mitte, dann rechts."
                  - "1 3 2."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Welcher Turm hat 3 Würfel?"
                say: "Welcher Turm hat drei Würfel?"
                options:
                  - { drawn: shape, column: [cube, cube], colours: green, key: "2" }
                  - { drawn: shape, column: [cube, cube, cube], colours: green, key: "3" }
                  - { drawn: shape, column: [cube, cube, cube, cube, cube], colours: green, key: "5" }
                answer: "3"
                hints: ["Zähl bei jedem Turm die Würfel von unten nach oben."]
              - id: l1-s2
                type: multiple_choice
                text: "Bauplan: 3 1 1\nWie viele Würfel brauchst du?"
                say: "Wie viele Würfel brauchst du für das ganze Gebäude?"
                options: ["5", "3", "4"]
                answer: "5"
                hints: ["Rechne 3 + 1 + 1."]
              - id: l1-s3
                type: multiple_choice
                text: "Bauplan: 2 1 3\nWo steht der höchste Turm?"
                say: "Wo steht der höchste Turm?"
                options: ["links", "in der Mitte", "rechts"]
                answer: "rechts"
                keep_order: true
                hints: ["Such die größte Zahl."]
              - id: l1-s4
                type: true_false
                text: "Bauplan: 1 2 3\nDu brauchst 3 Würfel."
                say: "Stimmt das? Für diesen Bauplan brauchst du drei Würfel."
                answer: false
                hints: ["Drei Felder heißt nicht drei Würfel. Zähl die Zahlen zusammen."]
              - id: l1-s5
                type: fill_in_blank
                text: "Links: 2 Würfel. Mitte: 1 Würfel. Rechts: 4 Würfel.\nSchreib den Bauplan."
                say: "Links stehen zwei Würfel, in der Mitte einer, rechts vier. Schreib den Bauplan."
                frame: "Bauplan: _ _ _"
                options: ["1", "2", "3", "4"]
                answer: ["2", "1", "4"]
                option_audio: false
                hints: ["Fang links an."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Würfel hat der Turm?"
                say: "Wie viele Würfel hat dieser Turm?"
                show: { drawn: shape, column: [cube, cube, cube, cube, cube], colours: orange }
                options: ["5", "4", "6"]
                answer: "5"
              - id: l1-n2
                type: multiple_choice
                text: "Bauplan: 4 2 3\nWie viele Würfel brauchst du?"
                say: "Wie viele Würfel brauchst du für das ganze Gebäude?"
                options: ["9", "3", "8"]
                answer: "9"
              - id: l1-n3
                type: multiple_choice
                text: "Bauplan: 3 2 2\nWo steht der höchste Turm?"
                say: "Wo steht der höchste Turm?"
                options: ["links", "in der Mitte", "rechts"]
                answer: "links"
                keep_order: true
              - id: l1-n4
                type: true_false
                text: "Bauplan: 4 1\nDu brauchst 5 Würfel."
                say: "Stimmt das? Für diesen Bauplan brauchst du fünf Würfel."
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Links: 3 Würfel. Mitte: 3 Würfel. Rechts: 1 Würfel.\nSchreib den Bauplan."
                say: "Links stehen drei Würfel, in der Mitte auch drei, rechts einer. Schreib den Bauplan."
                frame: "Bauplan: _ _ _"
                options: ["1", "2", "3"]
                answer: ["3", "3", "1"]
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Bauplan: 2 4 1\nWie viele Würfel brauchst du?"
            say: "Wie viele Würfel brauchst du für das ganze Gebäude?"
            options: ["7", "3", "6"]
            answer: "7"
          - id: l1-c2
            type: multiple_choice
            text: "Bauplan: 1 1 4\nWo steht der höchste Turm?"
            say: "Wo steht der höchste Turm?"
            options: ["links", "in der Mitte", "rechts"]
            answer: "rechts"
            keep_order: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Welcher Turm hat 4 Würfel?"
            say: "Welcher Turm hat vier Würfel?"
            options:
              - { drawn: shape, column: [cube, cube, cube], colours: purple, key: "3" }
              - { drawn: shape, column: [cube, cube, cube, cube], colours: purple, key: "4" }
              - { drawn: shape, column: [cube, cube], colours: purple, key: "2" }
            answer: "4"

  - n: 2
    title: { de: "Baupläne mit zwei Reihen", en: "Plans with two rows" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Bauplan: 3 2\nWie viele Würfel brauchst du?"
            say: "Wie viele Würfel brauchst du für das ganze Gebäude?"
            options: ["5", "2", "6"]
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viele Würfel hat der Turm?"
            say: "Wie viele Würfel hat dieser Turm?"
            show: { drawn: shape, column: [cube, cube, cube], colours: green }
            options: ["3", "2", "4"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "hinten: 1 2\nvorne: 3 1"
            say: "Dieser Bauplan hat zwei Reihen. Die obere Reihe ist hinten, die untere Reihe ist vorne, so wie du von oben auf den Tisch schaust. Vorne links stehen drei Würfel, vorne rechts einer. Hinten links steht einer, hinten rechts stehen zwei."
          - text: "3 + 1 + 1 + 2 = 7"
            say: "Für das ganze Gebäude zählst du alle Zahlen zusammen: drei plus eins plus eins plus zwei. Das sind sieben Würfel."
          - text: "Tim baut: hinten links 1, hinten rechts 3, vorne links 2, vorne rechts 2.\nhinten: 1 3\nvorne: 2 2"
            say: "Tim schreibt zu seinem Gebäude den Bauplan. Oben die hintere Reihe: links eins, rechts drei. Unten die vordere Reihe: links zwei, rechts zwei."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "hinten: 2 1\nvorne: 1 3\nWie viele Würfel brauchst du?"
                say: "Wie viele Würfel brauchst du für das ganze Gebäude?"
                options: ["7", "4", "6"]
                answer: "7"
                feedback:
                  "4": "4 ist die Zahl der Felder. Zähl alle Zahlen zusammen: 2 + 1 + 1 + 3."
                hints:
                  - "Zähl alle vier Zahlen zusammen."
                  - "Hinten 2 + 1 = 3, vorne 1 + 3 = 4."
                  - "3 + 4 = 7 Würfel."
              - id: l2-f2
                type: multiple_choice
                text: "hinten: 2 1\nvorne: 1 3\nWie viele Würfel stehen vorne rechts?"
                say: "Wie viele Würfel stehen vorne rechts?"
                options: ["3", "1", "2"]
                answer: "3"
                hints:
                  - "Vorne ist die untere Reihe."
                  - "Schau in der unteren Reihe auf das rechte Feld."
                  - "3 Würfel."
                difficulty: easy
              - id: l2-f3
                type: multiple_choice
                text: "hinten: 4 1\nvorne: 2 2\nWo steht der höchste Turm?"
                say: "Wo steht der höchste Turm?"
                options: ["hinten links", "hinten rechts", "vorne links"]
                answer: "hinten links"
                feedback:
                  "vorne links": "Vorne ist die untere Reihe. Die 4 steht oben, also hinten."
                hints:
                  - "Such die größte Zahl."
                  - "Die 4 steht in der oberen Reihe, links."
                  - "Hinten links."
              - id: l2-f4
                type: true_false
                text: "hinten: 3 2\nvorne: 1 1\nDu brauchst 7 Würfel."
                say: "Stimmt das? Für diesen Bauplan brauchst du sieben Würfel."
                answer: true
                hints:
                  - "Zähl alle Zahlen zusammen."
                  - "3 + 2 + 1 + 1."
                  - "Ja, das sind 7 Würfel."
              - id: l2-f5
                type: fill_in_blank
                text: "Ida baut: hinten links 2, hinten rechts 3, vorne links 1, vorne rechts 1.\nSchreib den Bauplan."
                say: "Ida baut hinten links zwei Würfel, hinten rechts drei, vorne links einen und vorne rechts einen. Schreib den Bauplan."
                frame: "hinten: _ _ · vorne: _ _"
                options: ["1", "2", "3"]
                answer: ["2", "3", "1", "1"]
                option_audio: false
                hints:
                  - "Fang mit der hinteren Reihe an, links."
                  - "Hinten: 2 und 3."
                  - "hinten 2 3, vorne 1 1."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "hinten: 1 1\nvorne: 2 4\nWie viele Würfel brauchst du?"
                say: "Wie viele Würfel brauchst du für das ganze Gebäude?"
                options: ["8", "4", "7"]
                answer: "8"
                hints: ["Zähl alle vier Zahlen zusammen."]
              - id: l2-s2
                type: multiple_choice
                text: "hinten: 3 1\nvorne: 2 2\nWie viele Würfel stehen hinten links?"
                say: "Wie viele Würfel stehen hinten links?"
                options: ["3", "2", "1"]
                answer: "3"
                hints: ["Hinten ist die obere Reihe."]
              - id: l2-s3
                type: multiple_choice
                text: "hinten: 1 2\nvorne: 1 4\nWo steht der höchste Turm?"
                say: "Wo steht der höchste Turm?"
                options: ["vorne rechts", "hinten rechts", "vorne links"]
                answer: "vorne rechts"
                hints: ["Such die größte Zahl. Steht sie oben oder unten?"]
              - id: l2-s4
                type: true_false
                text: "hinten: 2 2\nvorne: 2 2\nDu brauchst 4 Würfel."
                say: "Stimmt das? Für diesen Bauplan brauchst du vier Würfel."
                answer: false
                hints: ["In jedem Feld stehen 2 Würfel. Zähl alle zusammen."]
              - id: l2-s5
                type: fill_in_blank
                text: "Ben baut: hinten links 1, hinten rechts 4, vorne links 3, vorne rechts 2.\nSchreib den Bauplan."
                say: "Ben baut hinten links einen Würfel, hinten rechts vier, vorne links drei und vorne rechts zwei. Schreib den Bauplan."
                frame: "hinten: _ _ · vorne: _ _"
                options: ["1", "2", "3", "4"]
                answer: ["1", "4", "3", "2"]
                option_audio: false
                hints: ["Hinten ist die obere Reihe. Fang dort links an."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "hinten: 2 3\nvorne: 1 3\nWie viele Würfel brauchst du?"
                say: "Wie viele Würfel brauchst du für das ganze Gebäude?"
                options: ["9", "4", "8"]
                answer: "9"
              - id: l2-n2
                type: multiple_choice
                text: "hinten: 2 3\nvorne: 1 3\nWie viele Würfel stehen vorne links?"
                say: "Wie viele Würfel stehen vorne links?"
                options: ["1", "2", "3"]
                answer: "1"
              - id: l2-n3
                type: multiple_choice
                text: "hinten: 4 2\nvorne: 1 3\nWelcher Turm ist höher: hinten links oder vorne rechts?"
                say: "Welcher Turm ist höher: hinten links oder vorne rechts?"
                options: ["hinten links", "vorne rechts", "beide gleich hoch"]
                answer: "hinten links"
              - id: l2-n4
                type: true_false
                text: "hinten: 1 3\nvorne: 2 1\nDu brauchst 7 Würfel."
                say: "Stimmt das? Für diesen Bauplan brauchst du sieben Würfel."
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Mia baut: hinten links 3, hinten rechts 1, vorne links 2, vorne rechts 4.\nSchreib den Bauplan."
                say: "Mia baut hinten links drei Würfel, hinten rechts einen, vorne links zwei und vorne rechts vier. Schreib den Bauplan."
                frame: "hinten: _ _ · vorne: _ _"
                options: ["1", "2", "3", "4"]
                answer: ["3", "1", "2", "4"]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Bauplan: 3 2 4\nWie viele Würfel brauchst du?"
            say: "Wie viele Würfel brauchst du für das ganze Gebäude?"
            options: ["9", "3", "8"]
            answer: "9"
          - id: l2-c2
            type: multiple_choice
            text: "hinten: 2 4\nvorne: 3 1\nWie viele Würfel brauchst du?"
            say: "Wie viele Würfel brauchst du für das ganze Gebäude?"
            options: ["10", "4", "9"]
            answer: "10"
          - id: l2-c3
            type: multiple_choice
            text: "hinten: 2 4\nvorne: 3 1\nWo steht der höchste Turm?"
            say: "Wo steht der höchste Turm?"
            options: ["hinten rechts", "vorne links", "hinten links"]
            answer: "hinten rechts"
          - id: l2-c4
            type: multiple_choice
            text: "Links: 2 Würfel. Mitte: 4 Würfel. Rechts: 1 Würfel.\nWelcher Bauplan passt?"
            say: "Links stehen zwei Würfel, in der Mitte vier, rechts einer. Welcher Bauplan passt?"
            options: ["2 4 1", "1 4 2", "7"]
            answer: "2 4 1"
            option_audio: false
          - id: l2-c5
            type: fill_in_blank
            text: "Lars baut: hinten links 2, hinten rechts 2, vorne links 4, vorne rechts 3.\nSchreib den Bauplan."
            say: "Lars baut hinten links zwei Würfel, hinten rechts zwei, vorne links vier und vorne rechts drei. Schreib den Bauplan."
            frame: "hinten: _ _ · vorne: _ _"
            options: ["1", "2", "3", "4"]
            answer: ["2", "2", "4", "3"]
            option_audio: false
