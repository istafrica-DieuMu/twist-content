# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.perimeter
skill: math.area-volume.perimeter
curriculum: de-DE
language: de
title:
  de: Der Umfang
  en: Perimeter
summary: >
  Lesson 1 learns that the Umfang is the length of the edge all the way
  round and calculates it for rectangles, squares, triangles and figures
  of 1 cm Kästchen (4 cm und 3 cm: 4 + 3 + 4 + 3 = 14 cm), keeping it
  apart from the number of Kästchen; lesson 2 uses it in Sachaufgaben
  (Zaun, Rahmen, eine Runde um den Platz), works back from the Umfang to
  a side, decides whether a task asks for Umfang or Flächeninhalt, and
  ends with the skill check. Measuring the sides of a drawn figure with a
  ruler waits for a measuring task on a drawn figure.
metadata:
  year: klasse-4
  topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.length.calculate, math.shapes.properties]
  also_practises: [math.length.calculate]
  vocabulary: { de: [Umfang, Flächeninhalt, Seite, Seitenlänge, Rand, ringsherum, Kästchen, Zaun] }
  forms: [text, audio, drawn]
  drawn: [dots, shape]
  facets: [units]
  misconceptions:
    - id: adds-two-sides
      what: Adds one length and one width (5 + 2 = 7) instead of all four sides, or multiplies them
      addressed: lesson 1 Learn adds all four sides; l1-f1 offers 7 and 10 with feedback, l1-c1, l2-f1 and l2-c1 offer one length plus one width, l2-f2 offers half the Umfang for a square side
    - id: area-for-perimeter
      what: Counts the Kästchen (the Flächeninhalt) when asked for the Umfang, or the other way round
      addressed: lesson 1 Learn counts 12 Kästchen and a 14 cm edge on the same rectangle; l1-f2, l1-f3, l1-s2, l1-n4 and l2-c2 offer the number of Kästchen, with feedback in l1-f3; l2-f3, l2-s2, l2-n2, l2-n4 and l2-c5 ask whether Umfang or Flächeninhalt is wanted
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Einmal ringsherum", en: "All the way round" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Wie viele Zentimeter sind 2 m?"
            say: "Wie viele Zentimeter sind zwei Meter?"
            answer: "200"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Seiten sind im Rechteck gleich lang?"
            say: "Welche Seiten sind im Rechteck gleich lang?"
            options: ["die gegenüberliegenden Seiten", "alle vier Seiten", "keine Seiten"]
            answer: "die gegenüberliegenden Seiten"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Umfang: einmal ringsherum"
            say: "Der Umfang einer Figur ist die Länge ihres Randes, einmal ganz ringsherum. Stell dir eine Ameise vor, die einmal um die Figur herumläuft. Ihr Weg ist der Umfang."
            show: { drawn: shape, kind: rectangle, colour: blue }
          - text: "4 cm + 3 cm + 4 cm + 3 cm = 14 cm"
            say: "Ein Rechteck ist vier Zentimeter lang und drei Zentimeter breit. Es hat zwei lange und zwei kurze Seiten. Wir addieren alle vier: vier plus drei plus vier plus drei sind vierzehn Zentimeter."
          - text: "12 Kästchen innen, 14 cm Rand"
            say: "Jeder Punkt steht für ein Kästchen mit einem Zentimeter Seitenlänge. Das Rechteck hat zwölf Kästchen. Das ist sein Flächeninhalt. Der Rand ist vier plus drei plus vier plus drei Zentimeter lang, also vierzehn Zentimeter. Das ist sein Umfang."
            show: { drawn: dots, array: [3, 4] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ein Rechteck ist 5 cm lang und 2 cm breit. Wie groß ist der Umfang?"
                say: "Ein Rechteck ist fünf Zentimeter lang und zwei Zentimeter breit. Wie groß ist sein Umfang?"
                options: ["14 cm", "7 cm", "10 cm"]
                answer: "14 cm"
                feedback:
                  "7 cm": "Du hast nur eine lange und eine kurze Seite gezählt. Das Rechteck hat vier Seiten: 5 + 2 + 5 + 2."
                  "10 cm": "10 ist 5 · 2. Für den Umfang addierst du alle vier Seiten."
                hints:
                  - "Wie viele Seiten hat ein Rechteck?"
                  - "Zwei Seiten sind 5 cm lang, zwei Seiten 2 cm. 5 + 2 + 5 + 2 = ?"
                  - "14 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ein Quadrat hat 3 cm lange Seiten. Wie groß ist der Umfang?"
                say: "Ein Quadrat hat Seiten, die drei Zentimeter lang sind. Wie groß ist sein Umfang?"
                options: ["12 cm", "9 cm", "6 cm"]
                answer: "12 cm"
                hints:
                  - "Ein Quadrat hat vier gleich lange Seiten."
                  - "3 + 3 + 3 + 3 = 4 · 3."
                  - "12 cm."
              - id: l1-f3
                type: multiple_choice
                text: "Jedes Kästchen hat 1 cm Seitenlänge. Wie groß ist der Umfang?"
                say: "Jeder Punkt ist ein Kästchen mit einem Zentimeter Seitenlänge. Das Rechteck ist zwei Kästchen hoch und drei breit. Wie groß ist sein Umfang?"
                show: { drawn: dots, array: [2, 3] }
                options: ["10 cm", "6 cm", "5 cm"]
                answer: "10 cm"
                feedback:
                  "6 cm": "6 ist die Zahl der Kästchen. Das ist der Flächeninhalt. Für den Umfang gehst du am Rand entlang: 2 + 3 + 2 + 3."
                  "5 cm": "Du hast nur zwei Seiten gezählt. Geh einmal ganz herum: 2 + 3 + 2 + 3."
                hints:
                  - "Geh in Gedanken am Rand entlang, einmal ganz herum."
                  - "Die Seiten sind 2 cm, 3 cm, 2 cm und 3 cm lang."
                  - "10 cm."
              - id: l1-f4
                type: multiple_choice
                text: "Ein Dreieck hat die Seiten 3 cm, 4 cm und 5 cm. Wie groß ist der Umfang?"
                say: "Ein Dreieck hat die Seiten drei Zentimeter, vier Zentimeter und fünf Zentimeter. Wie groß ist sein Umfang?"
                options: ["12 cm", "60 cm", "9 cm"]
                answer: "12 cm"
                hints:
                  - "Ein Dreieck hat drei Seiten. Addiere alle."
                  - "3 + 4 + 5 = ?"
                  - "12 cm."
              - id: l1-f5
                type: true_false
                text: "Der Umfang ist die Länge des Randes einmal ringsherum."
                say: "Stimmt das? Der Umfang ist die Länge des Randes, einmal ringsherum."
                answer: true
                hints:
                  - "Denk an die Ameise, die um die Figur läuft."
                  - "Ihr Weg geht genau am Rand entlang."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Ein Rechteck ist 6 cm lang und 4 cm breit. Wie viele cm ist sein Umfang?"
                say: "Ein Rechteck ist sechs Zentimeter lang und vier Zentimeter breit. Wie viele Zentimeter ist sein Umfang?"
                answer: "20"
                hints: ["Addiere alle vier Seiten: 6 + 4 + 6 + 4."]
              - id: l1-s2
                type: multiple_choice
                text: "Jedes Kästchen hat 1 cm Seitenlänge. Wie groß ist der Umfang?"
                say: "Jeder Punkt ist ein Kästchen mit einem Zentimeter Seitenlänge. Das Quadrat ist drei Kästchen hoch und drei breit. Wie groß ist sein Umfang?"
                show: { drawn: dots, array: [3, 3] }
                options: ["12 cm", "9 cm", "6 cm"]
                answer: "12 cm"
                hints: ["Zähl am Rand entlang, nicht die Kästchen innen."]
              - id: l1-s3
                type: multiple_choice
                text: "Ein Quadrat hat 7 cm lange Seiten. Wie groß ist der Umfang?"
                say: "Ein Quadrat hat Seiten, die sieben Zentimeter lang sind. Wie groß ist sein Umfang?"
                options: ["28 cm", "14 cm", "49 cm"]
                answer: "28 cm"
                hints: ["Vier gleich lange Seiten: 4 · 7."]
              - id: l1-s4
                type: multiple_choice
                text: "Was misst du beim Umfang?"
                say: "Was misst du beim Umfang?"
                options: ["den Rand ringsherum", "die Fläche innen", "nur die längste Seite"]
                answer: "den Rand ringsherum"
                hints: ["Denk an den Weg der Ameise."]
              - id: l1-s5
                type: text_input
                text: "Ein Dreieck hat drei gleich lange Seiten von je 6 cm. Wie viele cm ist sein Umfang?"
                say: "Ein Dreieck hat drei gleich lange Seiten. Jede ist sechs Zentimeter lang. Wie viele Zentimeter ist sein Umfang?"
                answer: "18"
                hints: ["3 · 6."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Ein Rechteck ist 8 cm lang und 3 cm breit. Wie viele cm ist sein Umfang?"
                say: "Ein Rechteck ist acht Zentimeter lang und drei Zentimeter breit. Wie viele Zentimeter ist sein Umfang?"
                answer: "22"
              - id: l1-n2
                type: multiple_choice
                text: "Jedes Kästchen hat 1 cm Seitenlänge. Wie groß ist der Umfang?"
                say: "Jeder Punkt ist ein Kästchen mit einem Zentimeter Seitenlänge. Das Rechteck ist ein Kästchen hoch und fünf breit. Wie groß ist sein Umfang?"
                show: { drawn: dots, array: [1, 5] }
                options: ["12 cm", "5 cm", "6 cm"]
                answer: "12 cm"
              - id: l1-n3
                type: text_input
                text: "Ein Quadrat hat 9 cm lange Seiten. Wie viele cm ist sein Umfang?"
                say: "Ein Quadrat hat Seiten, die neun Zentimeter lang sind. Wie viele Zentimeter ist sein Umfang?"
                answer: "36"
              - id: l1-n4
                type: true_false
                text: "Das Rechteck hat 8 Kästchen. Also ist sein Umfang 8 cm."
                say: "Jedes Kästchen hat einen Zentimeter Seitenlänge. Das Rechteck hat acht Kästchen. Stimmt das? Dann ist sein Umfang acht Zentimeter."
                show: { drawn: dots, array: [2, 4] }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Ein Sechseck hat sechs gleich lange Seiten von je 2 cm. Wie groß ist der Umfang?"
                say: "Ein Sechseck hat sechs gleich lange Seiten. Jede ist zwei Zentimeter lang. Wie groß ist sein Umfang?"
                show: { drawn: shape, kind: hexagon, colour: green }
                options: ["12 cm", "8 cm", "6 cm"]
                answer: "12 cm"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ein Rechteck ist 7 cm lang und 3 cm breit. Wie groß ist der Umfang?"
            say: "Ein Rechteck ist sieben Zentimeter lang und drei Zentimeter breit. Wie groß ist sein Umfang?"
            options: ["20 cm", "10 cm", "21 cm"]
            answer: "20 cm"
          - id: l1-c2
            type: multiple_choice
            text: "Jedes Kästchen hat 1 cm Seitenlänge. Wie groß ist der Umfang?"
            say: "Jeder Punkt ist ein Kästchen mit einem Zentimeter Seitenlänge. Das Rechteck ist zwei Kästchen hoch und fünf breit. Wie groß ist sein Umfang?"
            show: { drawn: dots, array: [2, 5] }
            options: ["14 cm", "10 cm", "7 cm"]
            answer: "14 cm"
          - id: l1-c3
            type: text_input
            text: "Ein Quadrat hat 4 cm lange Seiten. Wie viele cm ist sein Umfang?"
            say: "Ein Quadrat hat Seiten, die vier Zentimeter lang sind. Wie viele Zentimeter ist sein Umfang?"
            answer: "16"

  - n: 2
    title: { de: "Umfang im Alltag", en: "Perimeter in everyday life" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ein Rechteck ist 3 cm lang und 2 cm breit. Wie groß ist der Umfang?"
            say: "Ein Rechteck ist drei Zentimeter lang und zwei Zentimeter breit. Wie groß ist sein Umfang?"
            options: ["10 cm", "5 cm"]
            answer: "10 cm"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Den Umfang findest du, wenn du alle Seiten addierst."
            say: "Stimmt das? Den Umfang findest du, wenn du alle Seiten addierst."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Zaun: 10 m + 6 m + 10 m + 6 m = 32 m"
            say: "Ein Garten ist zehn Meter lang und sechs Meter breit. Wie viel Zaun braucht man ringsherum? Das ist der Umfang: zehn plus sechs plus zehn plus sechs sind zweiunddreißig Meter."
          - text: "Umfang 20 cm, Quadrat: 20 : 4 = 5 cm"
            say: "Ein Quadrat hat zwanzig Zentimeter Umfang. Es hat vier gleich lange Seiten. Zwanzig geteilt durch vier sind fünf. Jede Seite ist also fünf Zentimeter lang."
          - text: "Umfang oder Flächeninhalt?"
            say: "Geht es um den Rand, zum Beispiel einen Zaun, ein Band oder eine Runde um den Platz, suchst du den Umfang. Geht es um die Fläche innen, zum Beispiel Teppich, Fliesen oder Farbe für eine Wand, suchst du den Flächeninhalt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ein Beet ist 4 m lang und 2 m breit. Wie viel Zaun braucht man ringsherum?"
                say: "Ein Beet ist vier Meter lang und zwei Meter breit. Wie viel Zaun braucht man ringsherum?"
                options: ["12 m", "6 m", "8 m"]
                answer: "12 m"
                feedback:
                  "6 m": "Der Zaun geht um alle vier Seiten: 4 + 2 + 4 + 2."
                  "8 m": "8 ist 4 · 2. Der Zaun geht am Rand entlang, also addierst du alle vier Seiten."
                hints:
                  - "Der Zaun geht einmal ringsherum."
                  - "4 m + 2 m + 4 m + 2 m."
                  - "12 m."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ein Quadrat hat 24 cm Umfang. Wie lang ist eine Seite?"
                say: "Ein Quadrat hat vierundzwanzig Zentimeter Umfang. Wie lang ist eine Seite?"
                options: ["6 cm", "12 cm", "8 cm"]
                answer: "6 cm"
                feedback:
                  "12 cm": "12 ist die Hälfte von 24. Das Quadrat hat aber vier gleich lange Seiten: 24 : 4."
                  "8 cm": "8 cm passt zu einer Figur mit drei Seiten. Das Quadrat hat vier: 24 : 4."
                hints:
                  - "Wie viele gleich lange Seiten hat ein Quadrat?"
                  - "Teile den Umfang durch 4."
                  - "6 cm."
              - id: l2-f3
                type: multiple_choice
                text: "Tim will um ein Bild ringsherum ein Band kleben. Was braucht er: den Umfang oder den Flächeninhalt?"
                say: "Tim will um sein Bild ringsherum ein buntes Band kleben. Was muss er wissen: den Umfang oder den Flächeninhalt?"
                options: ["den Umfang", "den Flächeninhalt"]
                answer: "den Umfang"
                keep_order: true
                hints:
                  - "Wo klebt das Band: am Rand oder auf der Fläche?"
                  - "Das Band geht am Rand entlang."
                  - "Den Umfang."
              - id: l2-f4
                type: text_input
                text: "Ein Fußballfeld ist 100 m lang und 60 m breit. Lisa läuft einmal ringsherum. Wie viele Meter läuft sie?"
                say: "Ein Fußballfeld ist hundert Meter lang und sechzig Meter breit. Lisa läuft einmal ringsherum. Wie viele Meter läuft sie?"
                answer: "320"
                hints:
                  - "Eine Runde ist der Umfang."
                  - "100 + 60 + 100 + 60."
                  - "320."
              - id: l2-f5
                type: multiple_choice
                text: "Ein Rechteck hat 16 cm Umfang. Es ist 5 cm lang. Wie breit ist es?"
                say: "Ein Rechteck hat sechzehn Zentimeter Umfang. Es ist fünf Zentimeter lang. Wie breit ist es?"
                options: ["3 cm", "11 cm", "6 cm"]
                answer: "3 cm"
                hints:
                  - "Zieh zuerst die zwei langen Seiten vom Umfang ab."
                  - "16 − 5 − 5 = 6. Das sind die beiden kurzen Seiten zusammen."
                  - "3 cm."
                difficulty: stretch

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ein Bilderrahmen ist 30 cm lang und 20 cm breit. Wie lang ist der Rahmen ringsherum?"
                say: "Ein Bilderrahmen ist dreißig Zentimeter lang und zwanzig Zentimeter breit. Wie lang ist der Rahmen ringsherum?"
                options: ["100 cm", "50 cm", "600 cm"]
                answer: "100 cm"
                hints: ["30 + 20 + 30 + 20."]
              - id: l2-s2
                type: multiple_choice
                text: "Mia will den Boden ihres Zimmers mit Teppich auslegen. Was braucht sie: den Umfang oder den Flächeninhalt?"
                say: "Mia will den ganzen Boden ihres Zimmers mit Teppich auslegen. Was muss sie wissen: den Umfang oder den Flächeninhalt?"
                options: ["den Umfang", "den Flächeninhalt"]
                answer: "den Flächeninhalt"
                keep_order: true
                hints: ["Liegt der Teppich am Rand oder auf der ganzen Fläche?"]
              - id: l2-s3
                type: text_input
                text: "Ein Quadrat hat 36 cm Umfang. Wie viele cm ist eine Seite lang?"
                say: "Ein Quadrat hat sechsunddreißig Zentimeter Umfang. Wie viele Zentimeter ist eine Seite lang?"
                answer: "9"
                hints: ["Teile durch 4."]
              - id: l2-s4
                type: true_false
                text: "4 Kästchen in einer Reihe haben einen größeren Umfang als 4 Kästchen als Quadrat."
                say: "Jedes Kästchen hat einen Zentimeter Seitenlänge. Stimmt das? Vier Kästchen in einer Reihe haben einen größeren Umfang als vier Kästchen, die ein Quadrat bilden."
                show: { drawn: dots, array: [1, 4] }
                answer: true
                hints: ["Rechne beide aus: 1 + 4 + 1 + 4 und 2 + 2 + 2 + 2."]
                difficulty: stretch
              - id: l2-s5
                type: multiple_choice
                text: "Ein quadratischer Spielplatz hat 15 m lange Seiten. Wie lang ist der Zaun ringsherum?"
                say: "Ein Spielplatz ist quadratisch. Jede Seite ist fünfzehn Meter lang. Wie lang ist der Zaun ringsherum?"
                options: ["60 m", "30 m", "225 m"]
                answer: "60 m"
                hints: ["4 · 15."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Eine Wiese ist 50 m lang und 20 m breit. Wie viele Meter Zaun braucht man ringsherum?"
                say: "Eine Wiese ist fünfzig Meter lang und zwanzig Meter breit. Wie viele Meter Zaun braucht man ringsherum?"
                answer: "140"
              - id: l2-n2
                type: multiple_choice
                text: "Opa streicht eine Wand. Was braucht er: den Umfang oder den Flächeninhalt?"
                say: "Opa streicht eine Wand mit Farbe. Was muss er wissen, um genug Farbe zu kaufen: den Umfang oder den Flächeninhalt?"
                options: ["den Umfang", "den Flächeninhalt"]
                answer: "den Flächeninhalt"
                keep_order: true
              - id: l2-n3
                type: multiple_choice
                text: "Ein Rechteck hat 20 cm Umfang und ist 6 cm lang. Wie breit ist es?"
                say: "Ein Rechteck hat zwanzig Zentimeter Umfang und ist sechs Zentimeter lang. Wie breit ist es?"
                options: ["4 cm", "14 cm", "8 cm"]
                answer: "4 cm"
              - id: l2-n4
                type: multiple_choice
                text: "Um eine Tischdecke soll ringsherum eine Borte genäht werden. Was braucht man: den Umfang oder den Flächeninhalt?"
                say: "Um eine Tischdecke soll ringsherum eine Borte genäht werden. Was muss man wissen: den Umfang oder den Flächeninhalt?"
                options: ["den Umfang", "den Flächeninhalt"]
                answer: "den Umfang"
                keep_order: true
              - id: l2-n5
                type: true_false
                text: "Zwei Rechtecke mit gleich vielen Kästchen haben immer den gleichen Umfang."
                say: "Stimmt das? Zwei Rechtecke mit gleich vielen Kästchen haben immer den gleichen Umfang."
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Ein Rechteck ist 9 cm lang und 4 cm breit. Wie groß ist der Umfang?"
            say: "Ein Rechteck ist neun Zentimeter lang und vier Zentimeter breit. Wie groß ist sein Umfang?"
            options: ["26 cm", "13 cm", "36 cm"]
            answer: "26 cm"
          - id: l2-c2
            type: multiple_choice
            text: "Jedes Kästchen hat 1 cm Seitenlänge. Wie groß ist der Umfang?"
            say: "Jeder Punkt ist ein Kästchen mit einem Zentimeter Seitenlänge. Das Rechteck ist drei Kästchen hoch und vier breit. Wie groß ist sein Umfang?"
            show: { drawn: dots, array: [3, 4] }
            options: ["14 cm", "12 cm", "7 cm"]
            answer: "14 cm"
          - id: l2-c3
            type: text_input
            text: "Ein Schwimmbecken ist 25 m lang und 10 m breit. Tom geht einmal um das Becken herum. Wie viele Meter geht er?"
            say: "Ein Schwimmbecken ist fünfundzwanzig Meter lang und zehn Meter breit. Tom geht einmal um das Becken herum. Wie viele Meter geht er?"
            answer: "70"
          - id: l2-c4
            type: multiple_choice
            text: "Ein Quadrat hat 32 cm Umfang. Wie lang ist eine Seite?"
            say: "Ein Quadrat hat zweiunddreißig Zentimeter Umfang. Wie lang ist eine Seite?"
            options: ["8 cm", "16 cm", "4 cm"]
            answer: "8 cm"
          - id: l2-c5
            type: multiple_choice
            text: "Lea will wissen, wie viele Fliesen auf den Küchenboden passen. Was braucht sie: den Umfang oder den Flächeninhalt?"
            say: "Lea will wissen, wie viele Fliesen auf den Küchenboden passen. Was muss sie wissen: den Umfang oder den Flächeninhalt?"
            options: ["den Umfang", "den Flächeninhalt"]
            answer: "den Flächeninhalt"
            keep_order: true
