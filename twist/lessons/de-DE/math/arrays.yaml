# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.arrays
skill: math.mult-div.arrays
curriculum: de-DE
language: de
title:
  de: Malaufgaben im Punktefeld
  en: Multiplication arrays
summary: >
  The Punktefeld as a picture of a Malaufgabe: rows of equal length, read
  as Reihen mal Punkte in jeder Reihe. Lesson 1 reads and finds
  Punktefelder; lesson 2 finds the Malaufgabe for pictures and short
  stories (egg boxes, rows of chairs, packs of juice), and ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Malaufgaben, en: Multiplication }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.mult-meaning]
  also_practises: [math.mult-div.mult-meaning]
  vocabulary: { de: [Punktefeld, Reihe, je, mal, Malaufgabe] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: count-one-by-one
      what: Counts every dot instead of using rows
      addressed: Learn counts in row steps (4, 8, 12); hints say "Zähl in Reihenschritten"
    - id: rows-and-columns-swapped-means-wrong
      what: Thinks a 4 by 3 field cannot show 3 · 4
      addressed: kept for the Tauschaufgaben skill; tasks here always read rows first and say so, so only one order is asked for
    - id: story-to-plus
      what: Writes a plus sum for a multiplication story (3 boxes of 6 eggs as 3 + 6)
      addressed: lesson 2 has story tasks in every stage; options include the plus sum, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Punktefelder lesen, en: Reading arrays }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Malaufgabe passt?"
            say: "Drei plus drei plus drei plus drei. Welche Malaufgabe passt?"
            options: ["4 · 3", "3 · 3", "4 + 3"]
            answer: "4 · 3"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "2 · 5 = _"
            say: "Zwei mal fünf."
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 · 4"
            say: "Das ist ein Punktefeld. Es hat drei Reihen. In jeder Reihe sind vier Punkte. Wir lesen es als drei mal vier."
            show: { drawn: dots, array: [3, 4] }
          - text: "4, 8, 12"
            say: "Du musst nicht jeden Punkt zählen. Zähl in Reihenschritten: vier, acht, zwölf. Drei mal vier ist zwölf."
            show: { drawn: dots, array: [3, 4] }
          - text: "Reihen mal Punkte in jeder Reihe"
            say: "Wir lesen ein Punktefeld hier immer so: zuerst die Reihen, von oben nach unten, dann die Punkte in einer Reihe."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Malaufgabe zeigt das Feld?"
                say: "Lies zuerst die Reihen, dann die Punkte in einer Reihe. Welche Malaufgabe zeigt das Feld?"
                show: { drawn: dots, array: [2, 6] }
                options: ["2 · 6", "2 · 5", "2 + 6"]
                answer: "2 · 6"
                hints:
                  - "Zähl die Reihen."
                  - "Zwei Reihen, sechs Punkte in jeder."
                  - "2 · 6."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte hat das Feld? Zähl in Reihenschritten."
                show: { drawn: dots, array: [4, 5] }
                answer: "20"
                hints:
                  - "Jede Reihe hat fünf."
                  - "Fünf, zehn, fünfzehn, zwanzig."
                  - "20."
              - id: l1-f3
                type: image_multiple_choice
                text: "Welches Feld zeigt 3 · 5?"
                say: "Drei Reihen mit je fünf Punkten. Welches Feld ist das?"
                options: [{ drawn: dots, array: [3, 5] }, { drawn: dots, array: [3, 4] }, { drawn: dots, array: [2, 5] }]
                answer: "3x5"
                hints:
                  - "Such drei Reihen."
                  - "Jede Reihe muss fünf Punkte haben."
                  - "Das Feld mit drei Fünferreihen."
              - id: l1-f4
                type: true_false
                text: "Zeigt das Feld 4 · 2?"
                say: "Zeigt das Feld vier mal zwei?"
                show: { drawn: dots, array: [4, 2] }
                answer: true
                hints:
                  - "Zähl die Reihen."
                  - "Vier Reihen, zwei in jeder."
                  - "Ja."
              - id: l1-f5
                type: fill_in_blank
                text: "Schreib die Malaufgabe zum Feld."
                say: "Schreib die Malaufgabe: zuerst die Reihen, dann die Punkte in einer Reihe, dann das Ergebnis."
                show: { drawn: dots, array: [5, 3] }
                frame: "_ · _ = _"
                options: ["5", "3", "15", "8"]
                answer: ["5", "3", "15"]
                hints:
                  - "Fünf Reihen."
                  - "Drei in jeder Reihe: drei, sechs, neun, zwölf, fünfzehn."
                  - "5 · 3 = 15."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Malaufgabe zeigt das Feld?"
                say: "Lies zuerst die Reihen. Welche Malaufgabe zeigt das Feld?"
                show: { drawn: dots, array: [4, 4] }
                options: ["4 · 4", "4 · 3", "4 + 4"]
                answer: "4 · 4"
                hints: ["Zähl Reihen und Punkte in einer Reihe."]
              - id: l1-s2
                type: text_input
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte hat das Feld?"
                show: { drawn: dots, array: [3, 10] }
                answer: "30"
                hints: ["Zähl in Reihenschritten."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Welches Feld zeigt 2 · 4?"
                say: "Zwei Reihen mit je vier Punkten. Welches Feld ist das?"
                options: [{ drawn: dots, array: [2, 3] }, { drawn: dots, array: [2, 4] }, { drawn: dots, array: [3, 4] }]
                answer: "2x4"
                hints: ["Erst die Reihen, dann die Punkte in einer Reihe."]
              - id: l1-s4
                type: true_false
                text: "Zeigt das Feld 3 · 6?"
                say: "Zeigt das Feld drei mal sechs?"
                show: { drawn: dots, array: [3, 7] }
                answer: false
                hints: ["Zähl die Punkte in einer Reihe."]
              - id: l1-s5
                type: fill_in_blank
                text: "Schreib die Malaufgabe zum Feld."
                say: "Schreib die Malaufgabe: Reihen, Punkte in einer Reihe, Ergebnis."
                show: { drawn: dots, array: [2, 8] }
                frame: "_ · _ = _"
                options: ["2", "8", "16", "10"]
                answer: ["2", "8", "16"]
                hints: ["Erst die Reihen, dann die Punkte in einer Reihe."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Malaufgabe zeigt das Feld?"
                say: "Lies zuerst die Reihen. Welche Malaufgabe zeigt das Feld?"
                show: { drawn: dots, array: [5, 5] }
                options: ["5 · 5", "5 · 4", "5 + 5"]
                answer: "5 · 5"
              - id: l1-n2
                type: text_input
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte hat das Feld?"
                show: { drawn: dots, array: [2, 7] }
                answer: "14"
              - id: l1-n3
                type: image_multiple_choice
                text: "Welches Feld zeigt 4 · 3?"
                say: "Welches Feld zeigt vier mal drei?"
                options: [{ drawn: dots, array: [4, 3] }, { drawn: dots, array: [4, 2] }, { drawn: dots, array: [5, 3] }]
                answer: "4x3"
              - id: l1-n4
                type: true_false
                text: "Zeigt das Feld 2 · 9?"
                say: "Zeigt das Feld zwei mal neun?"
                show: { drawn: dots, array: [2, 9] }
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Schreib die Malaufgabe zum Feld."
                say: "Schreib die Malaufgabe: Reihen, Punkte in einer Reihe, Ergebnis."
                show: { drawn: dots, array: [3, 6] }
                frame: "_ · _ = _"
                options: ["3", "6", "18", "9"]
                answer: ["3", "6", "18"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Malaufgabe zeigt das Feld?"
            say: "Lies zuerst die Reihen. Welche Malaufgabe zeigt das Feld?"
            show: { drawn: dots, array: [3, 2] }
            options: ["3 · 2", "3 · 3", "3 + 2"]
            answer: "3 · 2"
          - id: l1-c2
            type: text_input
            text: "Wie viele Punkte?"
            say: "Wie viele Punkte hat das Feld?"
            show: { drawn: dots, array: [4, 10] }
            answer: "40"
          - id: l1-c3
            type: image_multiple_choice
            text: "Welches Feld zeigt 5 · 2?"
            say: "Welches Feld zeigt fünf mal zwei?"
            options: [{ drawn: dots, array: [5, 2] }, { drawn: dots, array: [4, 2] }, { drawn: dots, array: [5, 3] }]
            answer: "5x2"

  - n: 2
    title: { de: Malaufgaben im Alltag, en: Arrays around us }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Wie viele Punkte?"
            say: "Wie viele Punkte hat das Feld?"
            show: { drawn: dots, array: [2, 5] }
            answer: "10"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Malaufgabe zeigt das Feld?"
            say: "Lies zuerst die Reihen. Welche Malaufgabe zeigt das Feld?"
            show: { drawn: dots, array: [4, 5] }
            options: ["4 · 5", "4 · 4", "4 + 5"]
            answer: "4 · 5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2 · 5 = 10"
            say: "Ein Eierkarton hat zwei Reihen mit je fünf Eiern. Das ist ein Punktefeld: zwei mal fünf. Zehn Eier."
            show: { drawn: dots, array: [2, 5] }
          - text: "3 Kartons mit je 6 Eiern: 3 · 6"
            say: "Drei Kartons mit je sechs Eiern: Die Zahl der Kartons kommt zuerst, die Eier in einem Karton danach. Drei mal sechs."
          - text: "3 · 6 = 18, nicht 3 + 6"
            say: "Es sind drei Sechser, also achtzehn. Drei plus sechs wären nur neun."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Malaufgabe passt?"
                say: "Im Kino stehen vier Reihen mit je sechs Stühlen. Welche Malaufgabe passt?"
                options: ["4 · 6", "4 + 6", "6 · 6"]
                answer: "4 · 6"
                feedback:
                  "4 + 6": "Es sind vier Reihen mit je sechs Stühlen, also viermal die Sechs: 4 · 6."
                hints:
                  - "Wie viele Reihen? Wie viele Stühle in jeder?"
                  - "Vier Reihen, je sechs."
                  - "4 · 6."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Wie viele Saftpäckchen?"
                say: "Drei Packungen mit je vier Saftpäckchen. Wie viele Saftpäckchen sind das?"
                answer: "12"
                hints:
                  - "Drei mal vier."
                  - "Vier, acht, zwölf."
                  - "12."
              - id: l2-f3
                type: fill_in_blank
                text: "Schreib die Malaufgabe."
                say: "Fünf Kinder haben je zwei Handschuhe. Schreib die Malaufgabe."
                frame: "_ · _ = _"
                options: ["5", "2", "10", "7"]
                answer: ["5", "2", "10"]
                hints:
                  - "Zuerst die Zahl der Kinder."
                  - "Fünf mal zwei."
                  - "5 · 2 = 10."
              - id: l2-f4
                type: true_false
                text: "Passt 2 · 10?"
                say: "Zwei Hände mit je fünf Fingern. Passt zwei mal zehn?"
                answer: false
                hints:
                  - "Wie viele Finger hat eine Hand?"
                  - "Fünf."
                  - "Nein, zwei mal fünf."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Malaufgabe passt?"
                say: "Ein Blech mit drei Reihen zu je fünf Plätzchen. Welche Malaufgabe passt?"
                show: { drawn: dots, array: [3, 5] }
                options: ["3 · 5", "3 + 5", "5 + 5"]
                answer: "3 · 5"
                hints:
                  - "Drei Reihen."
                  - "Fünf in jeder Reihe."
                  - "3 · 5."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Malaufgabe passt?"
                say: "Im Bus gibt es fünf Reihen mit je vier Sitzen. Welche Malaufgabe passt?"
                options: ["5 · 4", "5 + 4", "4 · 4"]
                answer: "5 · 4"
                hints: ["Wie viele Reihen, wie viele in jeder?"]
              - id: l2-s2
                type: text_input
                text: "Wie viele Räder?"
                say: "Vier Fahrräder mit je zwei Rädern. Wie viele Räder sind das?"
                answer: "8"
                hints: ["Zähl in Zweierschritten."]
              - id: l2-s3
                type: fill_in_blank
                text: "Schreib die Malaufgabe."
                say: "Zwei Tüten mit je zehn Bonbons. Schreib die Malaufgabe."
                frame: "_ · _ = _"
                options: ["2", "10", "20", "12"]
                answer: ["2", "10", "20"]
                hints: ["Zuerst die Zahl der Tüten."]
              - id: l2-s4
                type: true_false
                text: "Passt 3 · 3?"
                say: "Drei Kleeblätter mit je drei Blättern. Passt drei mal drei?"
                answer: true
                hints: ["Wie viele Gruppen, wie viele in jeder?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Malaufgabe passt?"
                say: "Eine Schokolade hat zwei Reihen mit je sechs Stücken. Welche Malaufgabe passt?"
                show: { drawn: dots, array: [2, 6] }
                options: ["2 · 6", "2 + 6", "6 + 6 + 6"]
                answer: "2 · 6"
                hints: ["Zuerst die Reihen."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Malaufgabe passt?"
                say: "Im Regal stehen drei Reihen mit je zehn Büchern. Welche Malaufgabe passt?"
                options: ["3 · 10", "3 + 10", "10 · 10"]
                answer: "3 · 10"
              - id: l2-n2
                type: text_input
                text: "Wie viele Beine?"
                say: "Fünf Hunde mit je vier Beinen. Wie viele Beine sind das?"
                answer: "20"
              - id: l2-n3
                type: fill_in_blank
                text: "Schreib die Malaufgabe."
                say: "Vier Teller mit je drei Keksen. Schreib die Malaufgabe."
                frame: "_ · _ = _"
                options: ["4", "3", "12", "7"]
                answer: ["4", "3", "12"]
              - id: l2-n4
                type: true_false
                text: "Passt 2 · 4?"
                say: "Zwei Tische mit je vier Stühlen. Passt zwei mal vier?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welche Malaufgabe passt?"
                say: "Ein Eierkarton hat zwei Reihen mit je drei Eiern. Welche Malaufgabe passt?"
                show: { drawn: dots, array: [2, 3] }
                options: ["2 · 3", "2 + 3", "3 + 3 + 3"]
                answer: "2 · 3"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welche Malaufgabe zeigt das Feld?"
            say: "Lies zuerst die Reihen. Welche Malaufgabe zeigt das Feld?"
            show: { drawn: dots, array: [4, 7] }
            options: ["4 · 7", "4 · 6", "4 + 7"]
            answer: "4 · 7"
          - id: l2-c2
            type: text_input
            text: "Wie viele Punkte?"
            say: "Wie viele Punkte hat das Feld?"
            show: { drawn: dots, array: [3, 8] }
            answer: "24"
          - id: l2-c3
            type: fill_in_blank
            text: "Schreib die Malaufgabe."
            say: "Sechs Kinder haben je zwei Murmeln. Schreib die Malaufgabe."
            frame: "_ · _ = _"
            options: ["6", "2", "12", "8"]
            answer: ["6", "2", "12"]
          - id: l2-c4
            type: image_multiple_choice
            text: "Welches Feld zeigt 5 · 6?"
            say: "Welches Feld zeigt fünf mal sechs?"
            options: [{ drawn: dots, array: [5, 6] }, { drawn: dots, array: [5, 5] }, { drawn: dots, array: [4, 6] }]
            answer: "5x6"
          - id: l2-c5
            type: true_false
            text: "Passt 4 + 2?"
            say: "Vier Kinder haben je zwei Ballons. Passt vier plus zwei?"
            answer: false
