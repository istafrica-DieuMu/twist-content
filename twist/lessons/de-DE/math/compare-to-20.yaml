# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.compare-to-20
skill: math.numbers-to-20.compare-to-20
curriculum: de-DE
language: de
title:
  de: Zahlen bis 20 vergleichen
  en: Comparing numbers to 20
summary: >
  Comparing numbers to 20 and saying how much bigger or smaller one is.
  Lesson 1 compares with <, > and = by looking at the Zehner and then the
  Einer; lesson 2 finds the difference on the Zwanzigerfeld and the
  Zahlenstrahl (14 is 3 more than 11), and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.teens, math.numbers-to-20.compare-to-10]
  also_practises: [math.numbers-to-20.order-to-20]
  vocabulary: { de: [größer, kleiner, gleich, mehr, weniger, um wie viel] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld, number-line]
  facets: []
  misconceptions:
    - id: bigger-ones-digit
      what: Thinks 9 is bigger than 12 because 9 is bigger than 2
      addressed: lesson 1 Learn says to look at the Zehner first; tasks pair a single-digit number with a teen in every stage, with feedback in the full stage
    - id: difference-as-total
      what: Answers how much more with one of the numbers or the sum
      addressed: lesson 2 Learn counts only the extra counters on the Zwanzigerfeld; options include the bigger number, with feedback
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Größer oder kleiner, en: Bigger or smaller }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen sieben und vier?"
            frame: "7 _ 4"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Punkte?"
            say: "Wie viele Punkte sind es zusammen?"
            show: { drawn: zwanzigerfeld, filled: [10, 4] }
            options: ["14", "4", "41"]
            answer: "14"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "16 > 13"
            say: "Sechzehn und dreizehn haben beide einen Zehner. Dann schaust du auf die Einer: sechs ist mehr als drei. Also ist sechzehn größer als dreizehn."
            show: { drawn: zwanzigerfeld, filled: [10, 6] }
          - text: "12 > 9"
            say: "Zwölf und neun: Zwölf hat einen Zehner, neun hat keinen. Wer einen Zehner hat, ist größer. Zwölf ist größer als neun, auch wenn die Neun mehr Einer hat."
          - text: "< · >"
            say: "Die Spitze des Zeichens zeigt immer auf die kleinere Zahl. Die offene Seite zeigt zur größeren."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen vierzehn und siebzehn?"
                frame: "14 _ 17"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Beide haben einen Zehner. Schau auf die Einer."
                  - "Vier ist weniger als sieben."
                  - "14 < 17."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Zahl ist größer?"
                say: "Welche Zahl ist größer: elf oder acht?"
                options: ["11", "8"]
                answer: "11"
                option_audio: false
                feedback:
                  "8": "Acht hat keinen Zehner, elf hat einen. Elf ist größer."
                hints:
                  - "Welche Zahl hat einen Zehner?"
                  - "Elf hat einen Zehner."
                  - "11 ist größer."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? 19 > 15"
                say: "Neunzehn ist größer als fünfzehn. Stimmt das?"
                answer: true
                hints:
                  - "Beide haben einen Zehner."
                  - "Neun Einer sind mehr als fünf."
                  - "Ja."
              - id: l1-f4
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen neun und zwölf?"
                frame: "9 _ 12"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Hat neun einen Zehner?"
                  - "Zwölf hat einen Zehner, also ist zwölf größer."
                  - "9 < 12."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Zahl ist die kleinste?"
                say: "Welche Zahl ist die kleinste?"
                options: ["18", "13", "20"]
                answer: "13"
                option_audio: false
                hints:
                  - "Schau zuerst auf die Zehner."
                  - "Zwanzig hat zwei Zehner. Bei achtzehn und dreizehn schaust du auf die Einer."
                  - "13."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen sechzehn und elf?"
                frame: "16 _ 11"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Vergleiche die Einer."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Zahl ist größer?"
                say: "Welche Zahl ist größer: sieben oder fünfzehn?"
                options: ["7", "15"]
                answer: "15"
                option_audio: false
                hints: ["Welche Zahl hat einen Zehner?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? 13 < 10"
                say: "Dreizehn ist kleiner als zehn. Stimmt das?"
                answer: false
                hints: ["Wo steht dreizehn auf dem Zahlenstrahl?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen achtzehn und achtzehn?"
                frame: "18 _ 18"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Sind die Zahlen verschieden?"]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Zahl ist die größte?"
                say: "Welche Zahl ist die größte?"
                options: ["19", "9", "17"]
                answer: "19"
                option_audio: false
                hints: ["Zuerst die Zehner, dann die Einer."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen zwanzig und neunzehn?"
                frame: "20 _ 19"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Welche Zahl ist kleiner?"
                say: "Welche Zahl ist kleiner: zwölf oder zehn?"
                options: ["12", "10"]
                answer: "10"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Stimmt das? 8 > 14"
                say: "Acht ist größer als vierzehn. Stimmt das?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen elf und dreizehn?"
                frame: "11 _ 13"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Welche Zahl ist die kleinste?"
                say: "Welche Zahl ist die kleinste?"
                options: ["16", "12", "14"]
                answer: "12"
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen fünfzehn und zwölf?"
            frame: "15 _ 12"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Welche Zahl ist größer?"
            say: "Welche Zahl ist größer: neun oder dreizehn?"
            options: ["9", "13"]
            answer: "13"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 17 < 20"
            say: "Siebzehn ist kleiner als zwanzig. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Um wie viel mehr?", en: "How many more?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen zehn und vierzehn?"
            frame: "10 _ 14"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Zahl ist größer?"
            say: "Welche Zahl ist größer: sechzehn oder neunzehn?"
            options: ["16", "19"]
            answer: "19"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "14 und 11"
            say: "Mia hat vierzehn Murmeln, Ben hat elf. Wer hat mehr, und um wie viel?"
            show: { drawn: zwanzigerfeld, filled: [10, 4] }
          - text: "14 − 11 = 3"
            say: "Bis elf haben beide gleich viele. Mia hat noch zwölf, dreizehn, vierzehn: drei mehr. Vierzehn ist um drei größer als elf."
            show: { drawn: number-line, from: 0, to: 20, labels: tens, jumps: [[11, 1], [12, 1], [13, 1]] }
          - text: "um wie viel → nur die Schritte zählen"
            say: "Bei um wie viel zählst du nur die Schritte von der kleineren zur größeren Zahl. Das Ergebnis ist nicht vierzehn und nicht elf, sondern drei."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Um wie viel ist 15 größer als 12?"
                say: "Um wie viel ist fünfzehn größer als zwölf?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                options: ["3", "15", "27"]
                answer: "3"
                feedback:
                  "15": "Fünfzehn ist die größere Zahl. Gefragt ist, wie viele Schritte es von zwölf bis fünfzehn sind."
                hints:
                  - "Fang bei zwölf an."
                  - "Zähl die Schritte bis fünfzehn: dreizehn, vierzehn, fünfzehn."
                  - "Drei Schritte: 3."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Um wie viel mehr?"
                say: "Tim hat siebzehn Sticker, Lea hat dreizehn. Um wie viel mehr hat Tim?"
                frame: "Tim hat _ mehr."
                options: ["4", "13", "17", "30"]
                answer: ["4"]
                hints:
                  - "Fang bei dreizehn an."
                  - "Vierzehn, fünfzehn, sechzehn, siebzehn."
                  - "4 mehr."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? 18 ist um 2 größer als 16."
                say: "Achtzehn ist um zwei größer als sechzehn. Stimmt das?"
                answer: true
                hints:
                  - "Fang bei sechzehn an."
                  - "Siebzehn, achtzehn."
                  - "Ja, zwei Schritte."
              - id: l2-f4
                type: multiple_choice
                text: "Um wie viel ist 9 kleiner als 13?"
                say: "Um wie viel ist neun kleiner als dreizehn?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                options: ["4", "9", "3"]
                answer: "4"
                hints:
                  - "Zähl von neun bis dreizehn."
                  - "Zehn, elf, zwölf, dreizehn."
                  - "4."
              - id: l2-f5
                type: multiple_choice
                text: "Wer hat mehr?"
                say: "Ali hat zwölf Murmeln, Sara hat zehn. Wer hat mehr, und um wie viel?"
                options: ["Ali, 2 mehr", "Sara, 2 mehr", "Ali, 12 mehr"]
                answer: "Ali, 2 mehr"
                option_audio: false
                hints:
                  - "Zwölf ist größer als zehn."
                  - "Von zehn bis zwölf sind es zwei Schritte."
                  - "Ali hat 2 mehr."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Um wie viel ist 19 größer als 14?"
                say: "Um wie viel ist neunzehn größer als vierzehn?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                options: ["5", "19", "4"]
                answer: "5"
                hints: ["Zähl die Schritte von vierzehn bis neunzehn."]
              - id: l2-s2
                type: fill_in_blank
                text: "Um wie viel mehr?"
                say: "Opa hat sechzehn Äpfel gepflückt, Oma elf. Um wie viel mehr hat Opa?"
                frame: "Opa hat _ mehr."
                options: ["5", "11", "16", "27"]
                answer: ["5"]
                hints: ["Fang bei der kleineren Zahl an."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? 20 ist um 10 größer als 10."
                say: "Zwanzig ist um zehn größer als zehn. Stimmt das?"
                answer: true
                hints: ["Wie viele Zehner haben die beiden Zahlen?"]
              - id: l2-s4
                type: multiple_choice
                text: "Um wie viel ist 8 kleiner als 11?"
                say: "Um wie viel ist acht kleiner als elf?"
                options: ["3", "8", "2"]
                answer: "3"
                hints: ["Zähl von acht bis elf."]
              - id: l2-s5
                type: multiple_choice
                text: "Wer hat mehr?"
                say: "Emma hat dreizehn Perlen, Paul hat achtzehn. Wer hat mehr, und um wie viel?"
                options: ["Paul, 5 mehr", "Emma, 5 mehr", "Paul, 18 mehr"]
                answer: "Paul, 5 mehr"
                option_audio: false
                hints: ["Wer hat die größere Zahl?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Um wie viel ist 17 größer als 15?"
                say: "Um wie viel ist siebzehn größer als fünfzehn?"
                options: ["2", "17", "3"]
                answer: "2"
              - id: l2-n2
                type: fill_in_blank
                text: "Um wie viel mehr?"
                say: "Im Bus sitzen vierzehn Kinder, im Auto vier. Um wie viel mehr sitzen im Bus?"
                frame: "Im Bus sitzen _ mehr."
                options: ["10", "4", "14", "18"]
                answer: ["10"]
              - id: l2-n3
                type: true_false
                text: "Stimmt das? 12 ist um 3 größer als 10."
                say: "Zwölf ist um drei größer als zehn. Stimmt das?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Um wie viel ist 16 kleiner als 20?"
                say: "Um wie viel ist sechzehn kleiner als zwanzig?"
                options: ["4", "16", "6"]
                answer: "4"
              - id: l2-n5
                type: multiple_choice
                text: "Wer hat mehr?"
                say: "Lina hat neunzehn Karten, Max hat fünfzehn. Wer hat mehr, und um wie viel?"
                options: ["Lina, 4 mehr", "Max, 4 mehr", "Lina, 19 mehr"]
                answer: "Lina, 4 mehr"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen dreizehn und acht?"
            frame: "13 _ 8"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Welche Zahl ist die größte?"
            say: "Welche Zahl ist die größte?"
            options: ["14", "18", "11"]
            answer: "18"
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "Um wie viel ist 20 größer als 17?"
            say: "Um wie viel ist zwanzig größer als siebzehn?"
            options: ["3", "20", "37"]
            answer: "3"
          - id: l2-c4
            type: fill_in_blank
            text: "Um wie viel mehr?"
            say: "Jonas hat fünfzehn Bonbons, Ella hat neun. Um wie viel mehr hat Jonas?"
            frame: "Jonas hat _ mehr."
            options: ["6", "9", "15", "24"]
            answer: ["6"]
          - id: l2-c5
            type: true_false
            text: "Stimmt das? 11 > 19"
            say: "Elf ist größer als neunzehn. Stimmt das?"
            answer: false
