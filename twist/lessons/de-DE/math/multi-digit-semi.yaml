# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.multi-digit-semi
skill: math.mult-div-larger.multi-digit-semi
curriculum: de-DE
language: de
title:
  de: Halbschriftlich malnehmen und teilen
  en: Informal written multiplication and division
summary: >
  Multiplying two two-digit numbers and dividing by a two-digit number
  halbschriftlich. Lesson 1 splits one factor into tens and ones
  (23 · 45 = 20 · 45 + 3 · 45) and adds the parts; lesson 2 divides in
  steps by taking away easy multiples (864 : 24: first 720 : 24 = 30,
  then 144 : 24 = 6) when it works out exactly, checks with the Probe,
  and ends with the skill check. Typed answers are plain digits.
metadata:
  year: klasse-4
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.large-mental]
  also_practises: [math.mult-div-larger.large-mental]
  vocabulary: { de: [halbschriftlich, zerlegen, Teilaufgabe, Probe] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: tens-times-tens-only
      what: Multiplies only tens with tens and ones with ones (23 · 45 = 20 · 40 + 3 · 5)
      addressed: lesson 1 Learn multiplies the whole second factor with each part; a "Wo ist der Fehler?" task with that slip in every stage of lesson 1, with feedback in l1-f3
    - id: forget-a-part
      what: Forgets one part when adding the partial results
      addressed: lesson 1 frames ask for each part and then the total; lesson 2 frames ask for each step and the sum of the step results
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
