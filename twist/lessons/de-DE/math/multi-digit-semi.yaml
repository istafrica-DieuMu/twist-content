            say: "Es bleiben hundertvierundvierzig übrig. Hundertvierundvierzig geteilt durch vierundzwanzig ist sechs, denn sechs mal vierundzwanzig ist hundertvierundvierzig."
          - text: "30 + 6 = 36 | Probe: 36 · 24 = 864"
            say: "Zusammen sind es dreißig und sechs, also sechsunddreißig. Mit der Probe prüfst du: sechsunddreißig mal vierundzwanzig ist achthundertvierundsechzig."

