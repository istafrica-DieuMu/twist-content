# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.picture-stories
skill: math.word-problems.picture-stories
curriculum: de-DE
language: de
title:
  de: Rechengeschichten
  en: Number stories
summary: >
  A picture or a short story asks a question, and the child finds the sum,
  works it out and says the answer. Lesson 1 finds what the story asks and
  the sum for it; lesson 2 adds the answer sentence and mixes plus and minus
  stories, and ends with the skill check. Stories are spoken; sums and
  short questions are on screen.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.sub-to-10]
  also_practises: [math.add-sub-to-20.add-to-10, math.add-sub-to-20.sub-meaning]
  vocabulary: { de: [Rechengeschichte, Frage, Aufgabe, Antwort, Antwortsatz, dazu, weg] }
  forms: [drawn, picture, text, audio]
  drawn: [ten-frame]
  facets: []
  misconceptions:
    - id: wrong-start
      what: Starts the minus sum with the number taken away (2 − 6 for "6 Vögel, 2 fliegen weg")
      addressed: Learn says the first number is how many there were at the start; options always include the swapped sum
    - id: answer-without-thing
      what: Gives a bare number as the answer and loses what it counts
      addressed: lesson 2 chooses the answer sentence; the wrong options put the right number on the wrong thing
    - id: keyword-only
      what: Picks plus or minus from one word without picturing the story
      addressed: the word noch appears in both plus and minus stories, and some plus stories have no signal word (Oma legt vier hinein); hints ask whether there are more or fewer at the end
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was will die Geschichte wissen?", en: "What does the story ask?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l1-w1
            type: text_input
            text: "7 − 3 = _"
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "2 + 5 = _"
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: "Fünf Vögel sitzen auf dem Baum. Zwei fliegen weg. Wie viele Vögel sitzen noch auf dem Baum?"
            show: { object: bird, count: 5 }
          - say: "Die Geschichte will wissen: Wie viele sitzen noch da? Am Anfang sind es fünf. Zwei fliegen weg, also sind es am Ende weniger. Das ist eine Minusaufgabe: fünf minus zwei."
            show: { drawn: ten-frame, filled: 5, cross: 2 }
          - say: "Fünf minus zwei ist drei. Drei Vögel sitzen noch auf dem Baum."
            text: "5 − 2 = 3"
          - say: "So gehst du vor: Hör die Geschichte. Was will sie wissen? Werden es mehr oder weniger? Dann rechnest du."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Vier Äpfel liegen im Korb. Mama legt zwei dazu. Wie viele Äpfel sind jetzt im Korb? Welche Aufgabe passt?"
                show: { object: apple, count: 4 }
                options: ["4 + 2", "4 − 2", "2 − 4"]
                answer: "4 + 2"
                hints:
                  - "Werden es mehr oder weniger Äpfel?"
                  - "Zwei kommen dazu, also mehr: plus."
                  - "Vier und zwei dazu: 4 + 2."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was sollst du herausfinden?"
                say: "Sechs Kinder spielen Fußball. Zwei gehen nach Hause. Was sollst du herausfinden?"
                show: { object: child, count: 6 }
                options: ["Wie viele spielen noch?", "Wie heißt das Spiel?", "Wo ist der Ball?"]
                answer: "Wie viele spielen noch?"
                hints:
                  - "Bei einer Rechengeschichte geht es um eine Zahl."
                  - "Welche Frage hat eine Zahl als Antwort?"
                  - "Wie viele spielen noch?"
                difficulty: easy
              - id: l1-f3
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Sieben Ballons sind am Stand. Drei fliegen weg. Wie viele Ballons sind noch da? Welche Aufgabe passt?"
                show: { drawn: ten-frame, filled: 7, cross: 3 }
                options: ["3 − 7", "7 + 3", "7 − 3"]
                answer: "7 − 3"
                hints:
                  - "Am Anfang sind es sieben."
                  - "Drei fliegen weg, also weniger: minus."
                  - "7 − 3."
              - id: l1-f4
                type: text_input
                text: "7 − 3 = _"
                say: "Und wie viele Ballons sind noch da? Rechne sieben minus drei."
                answer: "4"
                hints:
                  - "Nimm drei von sieben weg."
                  - "Sieben, sechs, fünf, vier."
                  - "4 Ballons."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Auf dem Teller liegen drei Erdbeeren. Ben legt noch fünf dazu. Wie viele Erdbeeren sind es jetzt?"
                show: { object: strawberry, count: 3 }
                options: ["5 − 3", "3 + 5", "3 − 5"]
                answer: "3 + 5"
                hints:
                  - "Noch fünf dazu: Werden es mehr oder weniger?"
                  - "Mehr, also plus."
                  - "3 + 5."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Neun Ameisen laufen über den Weg. Vier krabbeln unter einen Stein. Wie viele sind noch auf dem Weg?"
                show: { object: ant, count: 9 }
                options: ["9 − 4", "9 + 4", "4 − 9"]
                answer: "9 − 4"
                hints: ["Werden es auf dem Weg mehr oder weniger?"]
              - id: l1-s2
                type: text_input
                text: "9 − 4 = _"
                say: "Wie viele Ameisen sind noch auf dem Weg?"
                answer: "5"
                hints: ["Zähl von neun vier zurück."]
              - id: l1-s3
                type: multiple_choice
                text: "Was sollst du herausfinden?"
                say: "Lena hat zwei Sticker. Sie bekommt noch drei. Was sollst du herausfinden?"
                show: { object: sticker, count: 2 }
                options: ["Wie viele Sticker hat sie jetzt?", "Wer gibt ihr die Sticker?", "Welche Farbe haben sie?"]
                answer: "Wie viele Sticker hat sie jetzt?"
                hints: ["Die Antwort ist eine Zahl."]
              - id: l1-s4
                type: true_false
                text: "Passt 6 + 2?"
                say: "Sechs Frösche sitzen am Teich. Zwei springen ins Wasser. Wie viele sitzen noch am Teich? Passt sechs plus zwei?"
                show: { object: frog, count: 6 }
                answer: false
                hints: ["Am Teich werden es weniger."]
              - id: l1-s5
                type: text_input
                text: "1 + 4 = _"
                say: "Im Stall steht ein Lama. Vier kommen von der Wiese dazu. Wie viele Lamas sind jetzt im Stall?"
                show: { object: llama, count: 1 }
                answer: "5"
                hints: ["Eins und vier dazu."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Acht Fische schwimmen im Glas. Mia setzt zwei Fische in ein anderes Glas. Wie viele sind noch im ersten Glas?"
                show: { object: fish, count: 8 }
                options: ["2 − 8", "8 − 2", "8 + 2"]
                answer: "8 − 2"
              - id: l1-n2
                type: text_input
                text: "8 − 2 = _"
                say: "Wie viele Fische sind noch im ersten Glas?"
                answer: "6"
              - id: l1-n3
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Vier Autos stehen auf dem Parkplatz. Noch drei fahren dazu. Wie viele Autos stehen jetzt da?"
                show: { object: car, count: 4 }
                options: ["4 + 3", "4 − 3", "3 − 4"]
                answer: "4 + 3"
              - id: l1-n4
                type: text_input
                text: "4 + 3 = _"
                say: "Wie viele Autos stehen jetzt auf dem Parkplatz?"
                answer: "7"
              - id: l1-n5
                type: multiple_choice
                text: "Was sollst du herausfinden?"
                say: "Zehn Blätter hängen am Baum. Der Wind weht drei weg. Was sollst du herausfinden?"
                show: { object: leaf, count: 10 }
                options: ["Woher kommt der Wind?", "Wie viele hängen noch am Baum?", "Was für ein Baum ist das?"]
                answer: "Wie viele hängen noch am Baum?"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Aufgabe passt?"
            say: "Fünf Mäuse sitzen im Loch. Noch zwei kommen dazu. Wie viele Mäuse sind jetzt im Loch?"
            show: { object: mouse, count: 5 }
            options: ["5 − 2", "2 − 5", "5 + 2"]
            answer: "5 + 2"
          - id: l1-c2
            type: fill_in_blank
            text: "Schreib die Rechnung."
            say: "Sechs Bananen liegen auf dem Tisch. Die Kinder essen vier. Wie viele Bananen liegen noch da?"
            show: { object: banana, count: 6 }
            frame: "_ _ _ = _"
            options: ["2", "4", "6", "10", "+", "−"]
            answer: ["6", "−", "4", "2"]
          - id: l1-c3
            type: true_false
            text: "Passt 3 − 9?"
            say: "Neun Kinder sind im Bus. Drei steigen aus. Passt drei minus neun?"
            answer: false

  - n: 2
    title: { de: "Frage, Rechnung, Antwort", en: "Question, sum, answer" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Aufgabe passt?"
            say: "Zwei Hunde spielen im Garten. Drei kommen dazu. Welche Aufgabe passt?"
            options: ["2 + 3", "3 − 2", "2 − 3"]
            answer: "2 + 3"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "8 − 5 = _"
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: "In der Schublade liegen sieben Löffel. Papa nimmt drei für den Tisch. Wie viele Löffel liegen noch in der Schublade?"
            show: { object: spoon, count: 7 }
          - say: "Die Frage: Wie viele Löffel liegen noch in der Schublade? Die Rechnung: sieben minus drei ist vier."
            text: "7 − 3 = 4"
          - say: "Die Antwort sagst du in einem ganzen Satz, mit der Zahl und mit dem, was du gezählt hast: In der Schublade liegen noch vier Löffel."
            text: "In der Schublade liegen noch 4 Löffel."
          - say: "Pass auf: Das Wort noch steht in Plusgeschichten und in Minusgeschichten. Frag dich immer: Sind es am Ende mehr oder weniger?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Antwortsatz passt?"
                say: "Drei Kinder sitzen auf der Bank. Zwei setzen sich dazu. Drei plus zwei ist fünf. Welcher Antwortsatz passt?"
                options: ["Jetzt sitzen 5 Kinder auf der Bank.", "Jetzt sitzen 2 Kinder auf der Bank.", "Jetzt sind 5 Bänke da."]
                answer: "Jetzt sitzen 5 Kinder auf der Bank."
                hints:
                  - "Die Rechnung sagt fünf."
                  - "Gezählt hast du Kinder, keine Bänke."
                  - "Jetzt sitzen 5 Kinder auf der Bank."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Auf dem Teller liegen noch acht Kekse. Tim isst fünf. Wie viele Kekse liegen dann noch auf dem Teller?"
                options: ["8 + 5", "8 − 5", "5 − 8"]
                answer: "8 − 5"
                hints:
                  - "Hier kommt das Wort noch vor. Werden es trotzdem mehr oder weniger?"
                  - "Tim isst Kekse, also weniger."
                  - "8 − 5."
              - id: l2-f3
                type: text_input
                text: "8 − 5 = _"
                say: "Wie viele Kekse liegen noch auf dem Teller?"
                answer: "3"
                hints:
                  - "Nimm fünf von acht weg."
                  - "Sieben, sechs, fünf, vier, drei."
                  - "3 Kekse."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Antwortsatz passt?"
                say: "Wie viele Kekse liegen noch auf dem Teller? Welcher Antwortsatz passt?"
                options: ["Auf dem Teller liegen noch 3 Teller.", "Auf dem Teller liegen noch 3 Kekse.", "Auf dem Teller liegen noch 5 Kekse."]
                answer: "Auf dem Teller liegen noch 3 Kekse."
                hints:
                  - "Du hast drei gerechnet."
                  - "Was hast du gezählt?"
                  - "Auf dem Teller liegen noch 3 Kekse."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "In der Schachtel sind zwei Murmeln. Oma legt vier hinein. Wie viele Murmeln sind jetzt in der Schachtel?"
                show: { object: marble, count: 2 }
                options: ["4 − 2", "2 − 4", "2 + 4"]
                answer: "2 + 4"
                hints:
                  - "Mehr oder weniger Murmeln?"
                  - "Oma legt welche hinein: mehr."
                  - "2 + 4."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "10 − 4 = _"
                say: "Zehn Buntstifte sind in der Dose. Ali verleiht vier. Wie viele Buntstifte sind noch in der Dose?"
                show: { object: crayon, count: 10 }
                answer: "6"
                hints: ["Zehn, davon vier weg."]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Antwortsatz passt?"
                say: "Wie viele Buntstifte sind noch in der Dose?"
                options: ["In der Dose sind noch 4 Buntstifte.", "In der Dose sind noch 6 Buntstifte.", "Ali hat 6 Dosen."]
                answer: "In der Dose sind noch 6 Buntstifte."
                hints: ["Wie viel ist zehn minus vier?"]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Am Morgen sind fünf Eier im Nest. Bis zum Mittag legt die Henne noch zwei dazu. Wie viele Eier sind jetzt im Nest?"
                show: { object: egg, count: 5 }
                options: ["5 + 2", "5 − 2", "2 − 5"]
                answer: "5 + 2"
                hints: ["Mehr oder weniger Eier am Mittag?"]
              - id: l2-s4
                type: true_false
                text: "Passt 4 + 5?"
                say: "Vier Kinder sind auf dem Spielplatz. Fünf kommen dazu. Wie viele Kinder sind jetzt da? Passt vier plus fünf?"
                answer: true
                hints: ["Es kommen Kinder dazu."]
              - id: l2-s5
                type: text_input
                text: "4 + 5 = _"
                say: "Wie viele Kinder sind jetzt auf dem Spielplatz?"
                answer: "9"
                hints: ["Fang bei fünf an und zähl vier weiter."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "An der Leine hängen neun T-Shirts. Papa nimmt sechs ab. Wie viele hängen noch an der Leine?"
                show: { object: t-shirt, count: 9 }
                options: ["6 − 9", "9 + 6", "9 − 6"]
                answer: "9 − 6"
              - id: l2-n2
                type: text_input
                text: "9 − 6 = _"
                say: "Wie viele T-Shirts hängen noch an der Leine?"
                answer: "3"
              - id: l2-n3
                type: multiple_choice
                text: "Welcher Antwortsatz passt?"
                say: "Wie viele T-Shirts hängen noch an der Leine?"
                options: ["An der Leine hängen noch 3 T-Shirts.", "Papa hat 3 Leinen.", "An der Leine hängen noch 6 T-Shirts."]
                answer: "An der Leine hängen noch 3 T-Shirts."
              - id: l2-n4
                type: text_input
                text: "3 + 3 = _"
                say: "Drei Kinder malen ein Bild. Noch drei malen mit. Wie viele Kinder malen jetzt?"
                answer: "6"
              - id: l2-n5
                type: multiple_choice
                text: "Was sollst du herausfinden?"
                say: "Im Bus sitzen sieben Leute. An der Haltestelle steigen zwei aus. Was sollst du herausfinden?"
                options: ["Wie viele sitzen noch im Bus?", "Wie heißt die Haltestelle?", "Wohin fährt der Bus?"]
                answer: "Wie viele sitzen noch im Bus?"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welche Aufgabe passt?"
            say: "Sechs Affen sitzen im Baum. Einer klettert hinunter. Wie viele Affen sitzen noch im Baum?"
            show: { object: monkey, count: 6 }
            options: ["6 + 1", "6 − 1", "1 − 6"]
            answer: "6 − 1"
          - id: l2-c2
            type: fill_in_blank
            text: "Schreib die Rechnung."
            say: "Im Garten stehen zwei Bäume. Opa pflanzt sechs neue Bäume. Wie viele Bäume stehen jetzt im Garten?"
            show: { object: tree, count: 2 }
            frame: "2 _ _ = _"
            options: ["2", "6", "8", "4", "+", "−"]
            answer: ["+", "6", "8"]
          - id: l2-c3
            type: multiple_choice
            text: "Welcher Antwortsatz passt?"
            say: "Acht Kinder warten auf den Bus. Vier steigen in den ersten Bus. Acht minus vier ist vier. Welcher Antwortsatz passt?"
            options: ["Es warten noch 4 Busse.", "Es warten noch 4 Kinder.", "Es warten noch 8 Kinder."]
            answer: "Es warten noch 4 Kinder."
          - id: l2-c4
            type: fill_in_blank
            text: "Schreib die Rechnung."
            say: "Zehn Kerzen brennen auf dem Kuchen. Lea pustet sieben aus. Wie viele brennen noch?"
            frame: "_ _ _ = _"
            options: ["3", "7", "10", "5", "+", "−"]
            answer: ["10", "−", "7", "3"]
          - id: l2-c5
            type: multiple_choice
            text: "Was sollst du herausfinden?"
            say: "Lisa hat fünf Bücher. Sie leiht sich in der Bücherei noch drei aus. Was sollst du herausfinden?"
            show: { object: book, count: 5 }
            options: ["Wie viele Bücher hat sie jetzt?", "Wie heißt die Bücherei?", "Welches Buch ist das schönste?"]
            answer: "Wie viele Bücher hat sie jetzt?"
