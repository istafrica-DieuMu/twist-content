# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.subitize-to-10
skill: math.numbers-to-20.subitize-to-10
curriculum: de-DE
language: de
title:
  de: Anzahlen auf einen Blick
  en: Seeing amounts at a glance
summary: >
  Children learn to see how many without counting one by one. Lesson 1
  uses dice patterns to 6, shown for two seconds so counting is not
  possible. Lesson 2 uses the Kraft der 5: rows of five and the ten-frame,
  where a full row is five and the rest is added on (seven is five and
  two). It ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-20.count-to-5]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { de: [Würfel, Punkte, auf einen Blick, Fünferreihe, Zehnerfeld, voll] }
  forms: [drawn, text, audio]
  drawn: [dots, ten-frame]
  facets: []
  misconceptions:
    - id: count-each
      what: Counts every dot one by one instead of seeing the pattern, and runs out of time
      addressed: tasks show the dots for two seconds only (`flash`); full-stage hints describe the pattern ("wie die Ecken eines Quadrats")
    - id: five-unseen
      what: Does not use the full row of five, counts the whole ten-frame from 1
      addressed: lesson 2 Learn names a full row as five; hints start with "Ist die obere Reihe voll? Dann sind es schon fünf."
    - id: dice-only
      what: Recognises only the dice pattern, not the same amount in another arrangement
      addressed: both lessons mix dice with scattered dots and rows of five
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Würfelbilder, en: Dice patterns }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tap_to_count
            text: "Tippe jede Murmel einmal an. Wie viele sind es?"
            show: { object: marble, count: 4, layout: scattered }
            options: ["3", "4", "5"]
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Äpfel sind es?"
            show: { object: apple, count: 3, layout: row }
            options: ["2", "3", "4"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4"
            say: "Auf einem Würfel musst du nicht zählen. Du siehst es auf einen Blick: Vier Punkte sind wie die vier Ecken eines Quadrats."
            show: { drawn: dots, count: 4, layout: dice }
          - text: "5"
            say: "Fünf ist wie vier, mit einem Punkt in der Mitte."
            show: { drawn: dots, count: 5, layout: dice }
          - text: "6"
            say: "Sechs sind zwei Reihen mit je drei Punkten."
            show: { drawn: dots, count: 6, layout: dice }
          - text: "3"
            say: "Drei Punkte liegen schräg in einer Linie. Gleich siehst du die Punkte nur kurz. Schau genau hin!"
            show: { drawn: dots, count: 3, layout: dice }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 4, layout: dice, flash: 2 }
                options: ["3", "4", "5"]
                answer: "4"
                hints:
                  - "Denk an das Bild auf dem Würfel."
                  - "Die Punkte waren wie die Ecken eines Quadrats."
                  - "Es sind 4 Punkte."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Wo sind 5 Punkte?"
                options:
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                answer: "5"
                hints:
                  - "Fünf ist wie vier, mit einem Punkt mehr."
                  - "Such das Würfelbild mit einem Punkt in der Mitte."
                  - "Es ist das Bild mit vier Ecken und einem Punkt in der Mitte."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 6, layout: dice, flash: 2 }
                options: ["4", "5", "6"]
                answer: "6"
                feedback:
                  "5": "Fünf hat einen Punkt in der Mitte. Hier waren zwei Reihen ohne Mitte."
                hints:
                  - "Wie lagen die Punkte? In der Mitte oder in Reihen?"
                  - "Es waren zwei Reihen mit je drei Punkten."
                  - "Es sind 6 Punkte."
              - id: l1-f4
                type: true_false
                text: "Sind das 3 Punkte?"
                say: "Schau genau. Sind das drei Punkte?"
                show: { drawn: dots, count: 3, layout: dice, flash: 2 }
                answer: true
                hints:
                  - "Wie lagen die Punkte?"
                  - "Sie lagen schräg in einer Linie."
                  - "Ja, das sind 3 Punkte."
              - id: l1-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Tippe auf eine Zahl und dann auf das passende Würfelbild."
                pairs:
                  - left: { text: "2" }
                    right: { drawn: dots, count: 2, layout: dice }
                  - left: { text: "5" }
                    right: { drawn: dots, count: 5, layout: dice }
                  - left: { text: "3" }
                    right: { drawn: dots, count: 3, layout: dice }
                hints:
                  - "Fang mit der kleinsten Zahl an."
                  - "Zwei Punkte liegen in zwei Ecken. Drei Punkte liegen in einer Linie."
                  - "Fünf ist das Bild mit dem Punkt in der Mitte."
              - id: l1-f6
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 2, layout: dice, flash: 2 }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Waren es viele oder wenige Punkte?"
                  - "Ein Punkt oben, ein Punkt unten."
                  - "Es sind 2 Punkte."
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 5, layout: dice, flash: 1.5 }
                options: ["4", "5", "6"]
                answer: "5"
                hints: ["War ein Punkt in der Mitte?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Wo sind 4 Punkte?"
                options:
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                answer: "4"
                hints: ["Vier Punkte sind wie die Ecken eines Quadrats."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 3, layout: scattered, flash: 2 }
                options: ["2", "3", "4"]
                answer: "3"
                hints: ["Die Punkte liegen durcheinander. Waren es mehr als zwei?"]
              - id: l1-s4
                type: true_false
                text: "Sind das 6 Punkte?"
                say: "Schau genau. Sind das sechs Punkte?"
                show: { drawn: dots, count: 5, layout: dice, flash: 2 }
                answer: false
                hints: ["Sechs sind zwei Reihen. Was hast du gesehen?"]
              - id: l1-s5
                type: matching
                text: "Was passt zusammen?"
                say: "Tippe auf eine Zahl und dann auf das passende Würfelbild."
                pairs:
                  - left: { text: "4" }
                    right: { drawn: dots, count: 4, layout: dice }
                  - left: { text: "6" }
                    right: { drawn: dots, count: 6, layout: dice }
                  - left: { text: "1" }
                    right: { drawn: dots, count: 1, layout: dice }
                hints: ["Vier sind die Ecken, sechs sind zwei Reihen."]
              - id: l1-s6
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 1, layout: dice, flash: 1.5 }
                options: ["1", "2", "3"]
                answer: "1"
                hints: ["Wie viele Punkte waren in der Mitte?"]
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 6, layout: dice, flash: 1.5 }
                options: ["5", "6", "4"]
                answer: "6"
              - id: l1-n2
                type: image_multiple_choice
                text: "Wo sind 2 Punkte?"
                options:
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                answer: "2"
              - id: l1-n3
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 4, layout: scattered, flash: 2 }
                options: ["3", "4", "5"]
                answer: "4"
              - id: l1-n4
                type: true_false
                text: "Sind das 4 Punkte?"
                say: "Schau genau. Sind das vier Punkte?"
                show: { drawn: dots, count: 4, layout: dice, flash: 1.5 }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 3, layout: dice, flash: 1 }
                options: ["2", "3", "4"]
                answer: "3"
                difficulty: stretch

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Punkte? Schau genau!"
            show: { drawn: dots, count: 5, layout: dice, flash: 2 }
            options: ["5", "4", "6"]
            answer: "5"
          - id: l1-c2
            type: image_multiple_choice
            text: "Wo sind 6 Punkte?"
            options:
              - { drawn: dots, count: 5, layout: dice }
              - { drawn: dots, count: 6, layout: dice }
              - { drawn: dots, count: 4, layout: dice }
            answer: "6"
          - id: l1-c3
            type: multiple_choice
            text: "Wie viele Punkte? Schau genau!"
            show: { drawn: dots, count: 2, layout: scattered, flash: 2 }
            options: ["1", "2", "3"]
            answer: "2"

  - n: 2
    title: { de: Die Kraft der 5, en: The power of five }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Punkte? Schau genau!"
            show: { drawn: dots, count: 4, layout: dice, flash: 2 }
            options: ["4", "5", "3"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Wo sind 3 Punkte?"
            options:
              - { drawn: dots, count: 3, layout: dice }
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5"
            say: "Hier sind fünf Punkte in einer Reihe. Eine volle Reihe ist immer fünf. Das musst du nicht zählen."
            show: { drawn: dots, count: 5, layout: five-structure }
          - text: "5 und 2 sind 7"
            say: "Eine volle Reihe ist fünf. Darunter liegen noch zwei. Fünf und zwei sind sieben."
            show: { drawn: dots, count: 7, layout: five-structure, colour_split: [5, 2] }
          - text: "5 und 3 sind 8"
            say: "Im Zehnerfeld ist es genauso. Oben ist die Reihe voll: fünf. Unten sind drei. Fünf und drei sind acht."
            show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
          - text: "10"
            say: "Sind beide Reihen voll, sind es zehn. Gleich siehst du die Punkte wieder nur kurz."
            show: { drawn: ten-frame, filled: 10 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2], flash: 2 }
                options: ["6", "7", "8"]
                answer: "7"
                hints:
                  - "Ist die obere Reihe voll? Dann sind es schon fünf."
                  - "Oben fünf, unten zwei."
                  - "Fünf und zwei sind 7."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Wo sind 6 Punkte?"
                options:
                  - { drawn: dots, count: 5, layout: five-structure }
                  - { drawn: dots, count: 7, layout: five-structure, colour_split: [5, 2] }
                  - { drawn: dots, count: 6, layout: five-structure, colour_split: [5, 1] }
                answer: "6"
                hints:
                  - "Sechs ist eine volle Reihe und noch etwas."
                  - "Fünf und eins sind sechs."
                  - "Such das Bild mit einer vollen Reihe und einem Punkt darunter."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 9, layout: five-structure, colour_split: [5, 4], flash: 2 }
                options: ["8", "9", "10"]
                answer: "9"
                feedback:
                  "10": "Bei zehn sind beide Reihen voll. Unten hat einer gefehlt."
                hints:
                  - "Oben war die Reihe voll. Unten auch?"
                  - "Unten hat nur ein Punkt gefehlt."
                  - "Fünf und vier sind 9."
              - id: l2-f4
                type: true_false
                text: "Sind das 10 Punkte?"
                say: "Schau genau. Sind das zehn Punkte?"
                show: { drawn: ten-frame, filled: 10, flash: 2 }
                answer: true
                hints:
                  - "Waren beide Reihen voll?"
                  - "Zwei volle Reihen sind fünf und fünf."
                  - "Ja, das sind 10 Punkte."
              - id: l2-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Tippe auf eine Zahl und dann auf das passende Zehnerfeld."
                pairs:
                  - left: { text: "6" }
                    right: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
                  - left: { text: "8" }
                    right: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                  - left: { text: "10" }
                    right: { drawn: ten-frame, filled: 10 }
                hints:
                  - "Bei allen ist oben die Reihe voll. Schau auf die untere Reihe."
                  - "Unten einer: sechs. Unten drei: acht."
                  - "Zehn ist das Zehnerfeld, das ganz voll ist."
              - id: l2-f6
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 7, layout: dice, flash: 2 }
                options: ["6", "7", "8"]
                answer: "7"
                hints:
                  - "Es waren zwei Würfel."
                  - "Ein Würfel zeigte fünf, der andere zwei."
                  - "Fünf und zwei sind 7."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: ten-frame, filled: 6, colour_split: [5, 1], flash: 2 }
                options: ["5", "6", "7"]
                answer: "6"
                hints: ["Oben fünf. Und unten?"]
              - id: l2-s2
                type: image_multiple_choice
                text: "Wo sind 9 Punkte?"
                options:
                  - { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                  - { drawn: ten-frame, filled: 10 }
                  - { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                answer: "9"
                hints: ["Bei neun fehlt nur ein Punkt bis zum vollen Zehnerfeld."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 8, layout: five-structure, colour_split: [5, 3], flash: 2 }
                options: ["7", "8", "9"]
                answer: "8"
                hints: ["Eine volle Reihe und noch drei."]
              - id: l2-s4
                type: true_false
                text: "Sind das 8 Punkte?"
                say: "Schau genau. Sind das acht Punkte?"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2], flash: 2 }
                answer: false
                hints: ["Wie viele waren unten? Fünf und so viele sind ..."]
              - id: l2-s5
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 8, layout: dice, flash: 2 }
                options: ["7", "8", "9"]
                answer: "8"
                hints: ["Ein Würfel zeigte fünf. Und der andere?"]
              - id: l2-s6
                type: matching
                text: "Was passt zusammen?"
                say: "Tippe auf eine Zahl und dann auf das passende Bild."
                pairs:
                  - left: { text: "5" }
                    right: { drawn: dots, count: 5, layout: five-structure }
                  - left: { text: "7" }
                    right: { drawn: dots, count: 7, layout: five-structure, colour_split: [5, 2] }
                  - left: { text: "9" }
                    right: { drawn: dots, count: 9, layout: five-structure, colour_split: [5, 4] }
                hints: ["Schau, wie viele unter der vollen Reihe liegen."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: ten-frame, filled: 9, colour_split: [5, 4], flash: 1.5 }
                options: ["8", "9", "10"]
                answer: "9"
              - id: l2-n2
                type: image_multiple_choice
                text: "Wo sind 7 Punkte?"
                options:
                  - { drawn: dots, count: 6, layout: five-structure, colour_split: [5, 1] }
                  - { drawn: dots, count: 7, layout: five-structure, colour_split: [5, 2] }
                  - { drawn: dots, count: 8, layout: five-structure, colour_split: [5, 3] }
                answer: "7"
              - id: l2-n3
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: dots, count: 10, layout: dice, flash: 2 }
                options: ["9", "10", "8"]
                answer: "10"
              - id: l2-n4
                type: true_false
                text: "Sind das 6 Punkte?"
                say: "Schau genau. Sind das sechs Punkte?"
                show: { drawn: dots, count: 6, layout: five-structure, colour_split: [5, 1], flash: 1.5 }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Wie viele Punkte? Schau genau!"
                show: { drawn: ten-frame, filled: 5, flash: 1.5 }
                options: ["4", "5", "6"]
                answer: "5"
                difficulty: easy

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie viele Punkte? Schau genau!"
            show: { drawn: ten-frame, filled: 8, colour_split: [5, 3], flash: 2 }
            options: ["8", "7", "9"]
            answer: "8"
          - id: l2-c2
            type: multiple_choice
            text: "Wie viele Punkte? Schau genau!"
            show: { drawn: dots, count: 4, layout: dice, flash: 1.5 }
            options: ["3", "5", "4"]
            answer: "4"
          - id: l2-c3
            type: image_multiple_choice
            text: "Wo sind 10 Punkte?"
            options:
              - { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
              - { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
              - { drawn: ten-frame, filled: 10 }
            answer: "10"
          - id: l2-c4
            type: multiple_choice
            text: "Wie viele Punkte? Schau genau!"
            show: { drawn: dots, count: 7, layout: five-structure, colour_split: [5, 2], flash: 2 }
            options: ["6", "8", "7"]
            answer: "7"
          - id: l2-c5
            type: multiple_choice
            text: "Wie viele Punkte? Schau genau!"
            show: { drawn: dots, count: 6, layout: dice, flash: 1.5 }
            options: ["6", "5", "4"]
            answer: "6"
