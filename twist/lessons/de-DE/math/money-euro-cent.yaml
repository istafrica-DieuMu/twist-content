# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.money-euro-cent
skill: math.money.euro-cent
curriculum: de-DE
language: de
title:
  de: Euro und Cent
  en: Euros and cents
summary: >
  Lesson 1 learns that 1 Euro is 100 Cent and turns whole Euro into Cent
  and back (3 € = 300 ct); lesson 2 writes mixed amounts in Euro and Cent
  (145 ct = 1 € 45 ct), compares them, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.money.amounts-to-100]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { de: [Euro, Cent, umrechnen, Betrag] }
  forms: [text, audio, drawn]
  drawn: [coins]
  facets: [currency]
  misconceptions:
    - id: ten-cent-euro
      what: Thinks 1 Euro is 10 Cent (3 € = 30 ct)
      addressed: lesson 1 Learn counts 100 Cent; every stage of lesson 1 offers the tens answer, with feedback in l1-f1
    - id: cent-digits-wrong
      what: Splits a Cent amount at the wrong place (145 ct = 14 € 5 ct)
      addressed: lesson 2 Learn takes off the last two digits; every stage of lesson 2 offers the wrong split
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "1 Euro hat 100 Cent", en: "One euro is a hundred cents" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "50 + 50 = _"
            say: "Fünfzig plus fünfzig."
            answer: "100"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "100 + 100 + 100 = _"
            say: "Hundert plus hundert plus hundert."
            answer: "300"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 € = 100 ct"
            say: "Ein Euro hat hundert Cent. Zwei Fünfzigcentmünzen sind zusammen ein Euro, zehn Zehncentmünzen auch."
            show: { drawn: coins, values: [50, 50] }
          - text: "3 € = 300 ct"
            say: "Drei Euro sind dreimal hundert Cent, also dreihundert Cent."
          - text: "500 ct = 5 €"
            say: "Andersherum: Fünfhundert Cent sind fünf Euro. Immer hundert Cent sind ein Euro."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Cent sind 2 €?"
                say: "Wie viele Cent sind zwei Euro?"
                options: ["200 ct", "20 ct", "2 ct"]
                answer: "200 ct"
                feedback:
                  "20 ct": "Ein Euro hat hundert Cent, nicht zehn."
                hints:
                  - "Ein Euro hat hundert Cent."
                  - "Zwei Euro sind zweimal hundert Cent."
                  - "200 ct."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "6 € = _ ct"
                say: "Wie viele Cent sind sechs Euro?"
                answer: "600"
                hints:
                  - "Für jeden Euro hundert Cent."
                  - "Sechsmal hundert."
                  - "600 ct."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viele Euro sind 400 ct?"
                say: "Wie viele Euro sind vierhundert Cent?"
                options: ["4 €", "40 €", "400 €"]
                answer: "4 €"
                hints:
                  - "Hundert Cent sind ein Euro."
                  - "Wie oft passt hundert in vierhundert?"
                  - "4 €."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 1 € = 100 ct"
                say: "Ein Euro sind hundert Cent. Stimmt das?"
                answer: true
                hints:
                  - "Wie viele Cent hat ein Euro?"
                  - "Zwei Fünfzigcentmünzen sind ein Euro."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: text_input
                text: "Wie viele 50-ct-Münzen sind 1 €?"
                say: "Wie viele Fünfzigcentmünzen sind ein Euro?"
                answer: "2"
                hints:
                  - "Ein Euro hat hundert Cent."
                  - "Fünfzig plus fünfzig."
                  - "2 Münzen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Cent sind 5 €?"
                say: "Wie viele Cent sind fünf Euro?"
                options: ["500 ct", "50 ct", "5 ct"]
                answer: "500 ct"
                hints: ["Für jeden Euro hundert Cent."]
              - id: l1-s2
                type: text_input
                text: "9 € = _ ct"
                say: "Wie viele Cent sind neun Euro?"
                answer: "900"
                hints: ["Neunmal hundert."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie viele Euro sind 700 ct?"
                say: "Wie viele Euro sind siebenhundert Cent?"
                options: ["7 €", "70 €", "700 €"]
                answer: "7 €"
                hints: ["Hundert Cent sind ein Euro."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 3 € = 30 ct"
                say: "Drei Euro sind dreißig Cent. Stimmt das?"
                answer: false
                hints: ["Wie viele Cent hat ein Euro?"]
              - id: l1-s5
                type: text_input
                text: "Wie viele 10-ct-Münzen sind 1 €?"
                say: "Wie viele Zehncentmünzen sind ein Euro?"
                answer: "10"
                hints: ["Zähle in Zehnerschritten bis hundert."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Cent sind 8 €?"
                say: "Wie viele Cent sind acht Euro?"
                options: ["800 ct", "80 ct", "8 ct"]
                answer: "800 ct"
              - id: l1-n2
                type: text_input
                text: "4 € = _ ct"
                say: "Wie viele Cent sind vier Euro?"
                answer: "400"
              - id: l1-n3
                type: multiple_choice
                text: "Wie viele Euro sind 1000 ct?"
                say: "Wie viele Euro sind tausend Cent?"
                options: ["10 €", "100 €", "1 €"]
                answer: "10 €"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 200 ct = 2 €"
                say: "Zweihundert Cent sind zwei Euro. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "Wie viele 20-ct-Münzen sind 1 €?"
                say: "Wie viele Zwanzigcentmünzen sind ein Euro?"
                answer: "5"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "7 € = _ ct"
            say: "Wie viele Cent sind sieben Euro?"
            answer: "700"
          - id: l1-c2
            type: multiple_choice
            text: "Wie viele Euro sind 300 ct?"
            say: "Wie viele Euro sind dreihundert Cent?"
            options: ["3 €", "30 €", "300 €"]
            answer: "3 €"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 6 € = 60 ct"
            say: "Sechs Euro sind sechzig Cent. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Euro und Cent zusammen", en: "Euros and cents together" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "2 € = _ ct"
            say: "Wie viele Cent sind zwei Euro?"
            answer: "200"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "100 + 45 = _"
            say: "Hundert plus fünfundvierzig."
            answer: "145"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "145 ct = 1 € 45 ct"
            say: "Hundertfünfundvierzig Cent: Hundert Cent sind ein Euro, dazu kommen fünfundvierzig Cent. Das sind ein Euro und fünfundvierzig Cent."
          - text: "3 € 20 ct = 320 ct"
            say: "Andersherum: Drei Euro und zwanzig Cent sind dreihundert Cent und zwanzig Cent, also dreihundertzwanzig Cent."
          - text: "2 € 5 ct = 205 ct"
            say: "Pass bei kleinen Centbeträgen auf: Zwei Euro und fünf Cent sind zweihundertfünf Cent."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie schreibst du 260 ct in Euro und Cent?"
                say: "Wie schreibst du zweihundertsechzig Cent in Euro und Cent?"
                options: ["2 € 60 ct", "26 € 0 ct", "260 €"]
                answer: "2 € 60 ct"
                feedback:
                  "26 € 0 ct": "Nur hundert Cent sind ein Euro. Zweihundert Cent sind zwei Euro."
                hints:
                  - "Wie viele ganze Hunderter stecken in zweihundertsechzig?"
                  - "Zweihundert Cent sind zwei Euro. Was bleibt?"
                  - "2 € 60 ct."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "4 € 30 ct = _ ct"
                say: "Wie viele Cent sind vier Euro und dreißig Cent?"
                answer: "430"
                hints:
                  - "Vier Euro sind vierhundert Cent."
                  - "Dazu kommen dreißig Cent."
                  - "430 ct."
              - id: l2-f3
                type: multiple_choice
                text: "Was ist mehr?"
                say: "Was ist mehr: zwei Euro oder hundertneunzig Cent?"
                options: ["2 €", "190 ct"]
                answer: "2 €"
                hints:
                  - "Rechne beides in Cent."
                  - "Zwei Euro sind zweihundert Cent."
                  - "2 €."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 1 € 5 ct = 150 ct"
                say: "Ein Euro und fünf Cent sind hundertfünfzig Cent. Stimmt das?"
                answer: false
                hints:
                  - "Ein Euro sind hundert Cent. Dazu kommen fünf Cent, nicht fünfzig."
                  - "Hundert plus fünf."
                  - "Nein. 1 € 5 ct = 105 ct."
              - id: l2-f5
                type: text_input
                text: "Eine Kugel Eis kostet 1 € 20 ct. Wie viele Cent sind das?"
                say: "Eine Kugel Eis kostet einen Euro und zwanzig Cent. Wie viele Cent sind das?"
                answer: "120"
                hints:
                  - "Ein Euro sind hundert Cent."
                  - "Hundert plus zwanzig."
                  - "120 ct."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie schreibst du 375 ct in Euro und Cent?"
                say: "Wie schreibst du dreihundertfünfundsiebzig Cent in Euro und Cent?"
                options: ["3 € 75 ct", "37 € 5 ct", "375 €"]
                answer: "3 € 75 ct"
                hints: ["Wie viele ganze Hunderter stecken darin?"]
              - id: l2-s2
                type: text_input
                text: "6 € 15 ct = _ ct"
                say: "Wie viele Cent sind sechs Euro und fünfzehn Cent?"
                answer: "615"
                hints: ["Sechshundert plus fünfzehn."]
              - id: l2-s3
                type: multiple_choice
                text: "Was ist mehr?"
                say: "Was ist mehr: drei Euro zehn Cent oder dreihundertfünf Cent?"
                options: ["3 € 10 ct", "305 ct"]
                answer: "3 € 10 ct"
                hints: ["Rechne beides in Cent."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 208 ct = 2 € 8 ct"
                say: "Zweihundertacht Cent sind zwei Euro und acht Cent. Stimmt das?"
                answer: true
                hints: ["Zweihundert Cent sind zwei Euro."]
              - id: l2-s5
                type: text_input
                text: "Ein Heft kostet 2 € 50 ct. Wie viele Cent sind das?"
                say: "Ein Heft kostet zwei Euro und fünfzig Cent. Wie viele Cent sind das?"
                answer: "250"
                hints: ["Zweihundert plus fünfzig."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie schreibst du 509 ct in Euro und Cent?"
                say: "Wie schreibst du fünfhundertneun Cent in Euro und Cent?"
                options: ["5 € 9 ct", "50 € 9 ct", "5 € 90 ct"]
                answer: "5 € 9 ct"
              - id: l2-n2
                type: text_input
                text: "8 € 40 ct = _ ct"
                say: "Wie viele Cent sind acht Euro und vierzig Cent?"
                answer: "840"
              - id: l2-n3
                type: multiple_choice
                text: "Was ist weniger?"
                say: "Was ist weniger: vier Euro oder vierhundertzehn Cent?"
                options: ["4 €", "410 ct"]
                answer: "4 €"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 7 € 7 ct = 770 ct"
                say: "Sieben Euro und sieben Cent sind siebenhundertsiebzig Cent. Stimmt das?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "Ein Ball kostet 9 € 99 ct. Wie viele Cent sind das?"
                say: "Ein Ball kostet neun Euro und neunundneunzig Cent. Wie viele Cent sind das?"
                answer: "999"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "800 ct = _ €"
            say: "Wie viele Euro sind achthundert Cent?"
            answer: "8"
          - id: l2-c2
            type: multiple_choice
            text: "Wie schreibst du 430 ct in Euro und Cent?"
            say: "Wie schreibst du vierhundertdreißig Cent in Euro und Cent?"
            options: ["4 € 30 ct", "43 € 0 ct", "4 € 3 ct"]
            answer: "4 € 30 ct"
          - id: l2-c3
            type: text_input
            text: "2 € 75 ct = _ ct"
            say: "Wie viele Cent sind zwei Euro und fünfundsiebzig Cent?"
            answer: "275"
          - id: l2-c4
            type: multiple_choice
            text: "Was ist mehr?"
            say: "Was ist mehr: ein Euro fünfzig oder hundertvierzig Cent?"
            options: ["1 € 50 ct", "140 ct"]
            answer: "1 € 50 ct"
          - id: l2-c5
            type: true_false
            text: "Stimmt das? 600 ct = 6 €"
            say: "Sechshundert Cent sind sechs Euro. Stimmt das?"
            answer: true
