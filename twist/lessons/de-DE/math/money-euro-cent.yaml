# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.money-euro-cent
skill: math.money.euro-cent
curriculum: de-DE
language: de
title:
  de: Euro und Cent
  en: Euros and cents
summary: >
  Lesson 1 learns that 1 Euro is 100 Cent: which coins make 1 €, how
  many Cent are missing to 1 € (70 ct + 30 ct = 1 €), and whether an
  amount in Cent is more or less than 1 €. Lesson 2 reads and writes
  mixed amounts in Euro and Cent from coins (2 € 50 ct), tells 5 ct
  from 50 ct, compares amounts, and ends with the skill check. Cent
  amounts stay within 100 ct and Euro amounts within 100 €, as Klasse 2
  asks; Cent amounts above 100 ct come with the decimal notation later.
metadata:
  year: klasse-2
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.money.amounts-to-100]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { de: [Euro, Cent, umrechnen, Betrag] }
  forms: [text, audio, drawn]
  drawn: [coins]
  facets: [currency]
  misconceptions:
    - id: ten-cent-euro
      what: Thinks 1 Euro is 10 Cent
      addressed: lesson 1 Learn counts 100 Cent with ten 10-ct coins; every stage of lesson 1 asks how many Cent a Euro has or how many coins make 1 €, with feedback in l1-f1
    - id: cent-digits-wrong
      what: Mixes up a one-digit and a two-digit Cent part (2 € 5 ct read or written as 2 € 50 ct)
      addressed: lesson 2 Learn sets 2 € 5 ct beside 2 € 50 ct; every stage of lesson 2 compares or reads such a pair, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "1 Euro hat 100 Cent", en: "One euro is a hundred cents" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "50 + 50 = _"
            say: "Fünfzig plus fünfzig."
            answer: "100"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "50 ct + 20 ct + 10 ct = _ ct"
            say: "Eine Fünfzigcentmünze, eine Zwanzigcentmünze und eine Zehncentmünze. Wie viel Geld ist das?"
            answer: "80"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 € = 100 ct"
            say: "Ein Euro hat hundert Cent. Zwei Fünfzigcentmünzen sind zusammen hundert Cent, also ein Euro."
            show: { drawn: coins, values: [50, 50] }
          - text: "10 ct, 20 ct, 30 ct … 100 ct = 1 €"
            say: "Zehn Zehncentmünzen sind auch hundert Cent. Zähl mit: zehn, zwanzig, dreißig, und so weiter bis hundert. Das ist ein Euro."
            show: { drawn: coins, values: [10, 10, 10, 10, 10, 10, 10, 10, 10, 10] }
          - text: "70 ct + 30 ct = 1 €"
            say: "Wie viel fehlt bis zu einem Euro? Bei siebzig Cent fehlen noch dreißig Cent bis hundert Cent."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Cent sind 1 €?"
                say: "Wie viele Cent sind ein Euro?"
                options: ["100 ct", "10 ct", "1 ct"]
                answer: "100 ct"
                feedback:
                  "10 ct": "Ein Euro hat hundert Cent, nicht zehn. Zehn Zehncentmünzen sind ein Euro."
                hints:
                  - "Denk an die zwei Fünfzigcentmünzen."
                  - "Fünfzig plus fünfzig ist hundert."
                  - "100 ct."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Wie viele 50-ct-Münzen sind 1 €?"
                say: "Wie viele Fünfzigcentmünzen sind ein Euro?"
                answer: "2"
                hints:
                  - "Ein Euro hat hundert Cent."
                  - "Fünfzig plus fünfzig."
                  - "2 Münzen."
                difficulty: easy
              - id: l1-f3
                type: text_input
                text: "60 ct + _ ct = 1 €"
                say: "Sechzig Cent. Wie viele Cent fehlen bis zu einem Euro?"
                answer: "40"
                hints:
                  - "Ein Euro sind hundert Cent."
                  - "Zähl in Zehnern von sechzig bis hundert: siebzig, achtzig, neunzig, hundert."
                  - "40 ct."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 1 € = 100 ct"
                say: "Ein Euro sind hundert Cent. Stimmt das?"
                answer: true
                hints:
                  - "Wie viele Cent hat ein Euro?"
                  - "Zwei Fünfzigcentmünzen sind ein Euro."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Was ist mehr: 1 € oder 90 ct?"
                say: "Was ist mehr: ein Euro oder neunzig Cent?"
                options: ["1 €", "90 ct"]
                answer: "1 €"
                feedback:
                  "90 ct": "Ein Euro sind hundert Cent, und hundert ist mehr als neunzig."
                hints:
                  - "Denk dir den Euro in Cent."
                  - "Ein Euro sind hundert Cent. Ist hundert mehr als neunzig?"
                  - "1 €."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viel Geld ist das?"
                say: "Wie viel Geld ist das?"
                show: { drawn: coins, values: [50, 20, 20, 10] }
                options: ["1 €", "90 ct", "4 ct"]
                answer: "1 €"
                feedback:
                  "4 ct": "Vier ist die Zahl der Münzen. Zähle ihren Wert zusammen."
                hints: ["Zähle zusammen: fünfzig, siebzig, neunzig, und dann?"]
              - id: l1-s2
                type: text_input
                text: "Wie viele 10-ct-Münzen sind 1 €?"
                say: "Wie viele Zehncentmünzen sind ein Euro?"
                answer: "10"
                hints: ["Zähle in Zehnerschritten bis hundert."]
              - id: l1-s3
                type: text_input
                text: "25 ct + _ ct = 1 €"
                say: "Fünfundzwanzig Cent. Wie viele Cent fehlen bis zu einem Euro?"
                answer: "75"
                hints: ["Von fünfundzwanzig bis hundert: erst bis dreißig, dann bis hundert."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 1 € = 10 ct"
                say: "Ein Euro sind zehn Cent. Stimmt das?"
                answer: false
                hints: ["Wie viele Zehncentmünzen braucht man für einen Euro?"]
              - id: l1-s5
                type: multiple_choice
                text: "Was ist weniger: 1 € oder 95 ct?"
                say: "Was ist weniger: ein Euro oder fünfundneunzig Cent?"
                options: ["1 €", "95 ct"]
                answer: "95 ct"
                hints: ["Ein Euro sind hundert Cent."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Wie viele 20-ct-Münzen sind 1 €?"
                say: "Wie viele Zwanzigcentmünzen sind ein Euro?"
                answer: "5"
              - id: l1-n2
                type: text_input
                text: "45 ct + _ ct = 1 €"
                say: "Fünfundvierzig Cent. Wie viele Cent fehlen bis zu einem Euro?"
                answer: "55"
              - id: l1-n3
                type: image_multiple_choice
                text: "Wo ist genau 1 €?"
                say: "Wo ist genau ein Euro?"
                options:
                  - { drawn: coins, values: [20, 20, 20, 20] }
                  - { drawn: coins, values: [50, 20, 20, 10] }
                  - { drawn: coins, values: [50, 10, 10, 10, 10] }
                answer: "100"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 30 ct + 70 ct = 1 €"
                say: "Dreißig Cent und siebzig Cent sind zusammen ein Euro. Stimmt das?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Was ist mehr: 80 ct oder 1 €?"
                say: "Was ist mehr: achtzig Cent oder ein Euro?"
                options: ["80 ct", "1 €"]
                answer: "1 €"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "35 ct + _ ct = 1 €"
            say: "Fünfunddreißig Cent. Wie viele Cent fehlen bis zu einem Euro?"
            answer: "65"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Zwei 50-ct-Münzen sind 1 €."
            say: "Zwei Fünfzigcentmünzen sind ein Euro. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was ist mehr: 1 € oder 99 ct?"
            say: "Was ist mehr: ein Euro oder neunundneunzig Cent?"
            options: ["1 €", "99 ct"]
            answer: "1 €"

  - n: 2
    title: { de: "Euro und Cent zusammen", en: "Euros and cents together" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "1 € = _ ct"
            say: "Wie viele Cent sind ein Euro?"
            answer: "100"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "80 ct + _ ct = 1 €"
            say: "Achtzig Cent. Wie viele Cent fehlen bis zu einem Euro?"
            answer: "20"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "2 € 50 ct"
            say: "Hier liegen eine Zweieuromünze und eine Fünfzigcentmünze. Zähle zuerst die Euro, dann die Cent: zwei Euro und fünfzig Cent."
            show: { drawn: coins, values: [200, 50] }
          - text: "2 € 5 ct"
            say: "Pass gut auf: Hier liegt nur eine Fünfcentmünze. Das sind zwei Euro und fünf Cent, nicht fünfzig Cent."
            show: { drawn: coins, values: [200, 5] }
          - text: "50 ct + 50 ct + 20 ct = 1 € 20 ct"
            say: "Zwei Fünfzigcentmünzen sind zusammen ein Euro. Dazu kommen zwanzig Cent. Das sind ein Euro und zwanzig Cent."
            show: { drawn: coins, values: [50, 50, 20] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viel Geld ist das?"
                say: "Wie viel Geld ist das?"
                show: { drawn: coins, values: [100, 20, 10] }
                options: ["1 € 30 ct", "1 € 3 ct", "3 €"]
                answer: "1 € 30 ct"
                feedback:
                  "1 € 3 ct": "Zwanzig Cent und zehn Cent sind dreißig Cent, nicht drei."
                  "3 €": "Nur eine Münze ist ein Euro. Die anderen sind Cent."
                hints:
                  - "Zähle zuerst die Euro, dann die Cent."
                  - "Eine Euromünze, dann zwanzig und zehn Cent."
                  - "1 € 30 ct."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Wie viel Geld ist das?"
                say: "Wie viel Geld ist das? Schreib die Euro und die Cent."
                show: { drawn: coins, values: [200, 100, 50, 5] }
                frame: "_ € _ ct"
                options: ["3", "55", "5", "4"]
                answer: ["3", "55"]
                hints:
                  - "Zähle zuerst die Euromünzen."
                  - "Zwei Euro und ein Euro sind drei Euro. Fünfzig Cent und fünf Cent?"
                  - "3 € 55 ct."
              - id: l2-f3
                type: multiple_choice
                text: "Was ist mehr: 2 € 5 ct oder 2 € 50 ct?"
                say: "Was ist mehr: zwei Euro fünf Cent oder zwei Euro fünfzig Cent?"
                options: ["2 € 5 ct", "2 € 50 ct"]
                answer: "2 € 50 ct"
                option_audio: false
                feedback:
                  "2 € 5 ct": "Die Euro sind gleich. Fünf Cent sind aber weniger als fünfzig Cent."
                hints:
                  - "Die Euro sind gleich. Vergleiche die Cent."
                  - "Fünf Cent oder fünfzig Cent: Was ist mehr?"
                  - "2 € 50 ct."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Das sind 1 € 20 ct."
                say: "Zwei Fünfzigcentmünzen und eine Zwanzigcentmünze. Sind das ein Euro und zwanzig Cent?"
                show: { drawn: coins, values: [50, 50, 20] }
                answer: true
                hints:
                  - "Zwei Fünfzigcentmünzen sind zusammen ein Euro."
                  - "Ein Euro, und dazu zwanzig Cent."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: text_input
                text: "Lena hat 1 € 60 ct. Wie viele Cent fehlen ihr bis 2 €?"
                say: "Lena hat einen Euro und sechzig Cent. Wie viele Cent fehlen ihr bis zwei Euro?"
                answer: "40"
                hints:
                  - "Bis zum nächsten Euro fehlen nur Cent."
                  - "Von sechzig Cent bis hundert Cent."
                  - "40 ct."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viel Geld ist das?"
                say: "Wie viel Geld ist das?"
                show: { drawn: coins, values: [200, 200, 10, 5] }
                options: ["4 € 15 ct", "4 € 51 ct", "2 € 15 ct"]
                answer: "4 € 15 ct"
                hints: ["Zähle zuerst die Euro, dann die Cent."]
              - id: l2-s2
                type: fill_in_blank
                text: "Wie viel Geld ist das?"
                say: "Wie viel Geld ist das? Schreib die Euro und die Cent."
                show: { drawn: coins, values: [500, 100, 20, 20] }
                frame: "_ € _ ct"
                options: ["6", "40", "5", "20"]
                answer: ["6", "40"]
                hints: ["Der Schein ist fünf Euro wert."]
              - id: l2-s3
                type: multiple_choice
                text: "Was ist weniger: 3 € 90 ct oder 4 €?"
                say: "Was ist weniger: drei Euro neunzig Cent oder vier Euro?"
                options: ["3 € 90 ct", "4 €"]
                answer: "3 € 90 ct"
                hints: ["Vergleiche zuerst die Euro."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 7 € 8 ct = 7 € 80 ct"
                say: "Sieben Euro acht Cent sind so viel wie sieben Euro achtzig Cent. Stimmt das?"
                answer: false
                hints: ["Sind acht Cent so viel wie achtzig Cent?"]
              - id: l2-s5
                type: text_input
                text: "Ein Heft kostet 2 € 50 ct. Tim hat 2 €. Wie viele Cent fehlen ihm?"
                say: "Ein Heft kostet zwei Euro und fünfzig Cent. Tim hat zwei Euro. Wie viele Cent fehlen ihm?"
                answer: "50"
                hints: ["Die Euro hat Tim schon. Es fehlen nur die Cent."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viel Geld ist das?"
                say: "Wie viel Geld ist das?"
                show: { drawn: coins, values: [1000, 200, 50, 20, 5] }
                options: ["12 € 75 ct", "12 € 57 ct", "10 € 75 ct"]
                answer: "12 € 75 ct"
              - id: l2-n2
                type: fill_in_blank
                text: "Wie viel Geld ist das?"
                say: "Wie viel Geld ist das? Schreib die Euro und die Cent."
                show: { drawn: coins, values: [200, 100, 5, 2] }
                frame: "_ € _ ct"
                options: ["3", "7", "70", "2"]
                answer: ["3", "7"]
              - id: l2-n3
                type: multiple_choice
                text: "Was ist mehr: 6 € 95 ct oder 7 €?"
                say: "Was ist mehr: sechs Euro fünfundneunzig Cent oder sieben Euro?"
                options: ["6 € 95 ct", "7 €"]
                answer: "7 €"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? Das sind 1 € 30 ct."
                say: "Zwei Fünfzigcentmünzen, eine Zwanzigcentmünze und eine Zehncentmünze. Sind das ein Euro und dreißig Cent?"
                show: { drawn: coins, values: [50, 50, 20, 10] }
                answer: true
              - id: l2-n5
                type: text_input
                text: "Ein Ball kostet 9 € 99 ct. Wie viele Cent fehlen bis 10 €?"
                say: "Ein Ball kostet neun Euro und neunundneunzig Cent. Wie viele Cent fehlen bis zehn Euro?"
                answer: "1"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "70 ct + _ ct = 1 €"
            say: "Siebzig Cent. Wie viele Cent fehlen bis zu einem Euro?"
            answer: "30"
          - id: l2-c2
            type: multiple_choice
            text: "Wie viel Geld ist das?"
            say: "Wie viel Geld ist das?"
            show: { drawn: coins, values: [200, 50, 10, 2] }
            options: ["2 € 62 ct", "2 € 26 ct", "2 € 6 ct"]
            answer: "2 € 62 ct"
          - id: l2-c3
            type: multiple_choice
            text: "Was ist mehr: 4 € 5 ct oder 4 € 50 ct?"
            say: "Was ist mehr: vier Euro fünf Cent oder vier Euro fünfzig Cent?"
            options: ["4 € 5 ct", "4 € 50 ct"]
            answer: "4 € 50 ct"
            option_audio: false
          - id: l2-c4
            type: true_false
            text: "Stimmt das? 100 ct = 1 €"
            say: "Hundert Cent sind ein Euro. Stimmt das?"
            answer: true
          - id: l2-c5
            type: text_input
            text: "Mia hat 3 € 40 ct. Wie viele Cent fehlen ihr bis 4 €?"
            say: "Mia hat drei Euro und vierzig Cent. Wie viele Cent fehlen ihr bis vier Euro?"
            answer: "60"
