# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.order-to-million
skill: math.large-numbers.order-to-million
curriculum: de-DE
language: de
title:
  de: Ordnen, vergleichen und runden bis 1 000 000
  en: Ordering, comparing and rounding to 1 000 000
summary: >
  Numbers to a million on the Zahlenstrahl, compared from the left and
  rounded sensibly. Lesson 1 finds and reads numbers on the line to a
  million in Hunderttausendern and on a cut-out in Tausendern; lesson 2
  compares and orders six-digit numbers; lesson 3 rounds to Tausender,
  Zehntausender and Hunderttausender and chooses a sensible rounding for
  real numbers, and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Große Zahlen, en: Large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.to-million, math.large-numbers.order-to-10000]
  also_practises: [math.large-numbers.to-million]
  vocabulary: { de: [Zahlenstrahl, Ausschnitt, Schritt, größer als, kleiner als, runden, Nachbarzehntausender, ungefähr] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: [operation-signs]
  misconceptions:
    - id: step-size
      what: Reads each tick on the line to a million as ten thousand, or each tick on a cut-out as a hundred thousand
      addressed: lesson 1 Learn asks for the step of every line before reading it; full-stage feedback names the step
    - id: digit-count
      what: Compares 99 999 and 100 000 by the first digit
      addressed: lesson 2 Learn says that a number with more digits is greater; tasks set a five-digit number with large digits against a six-digit one
    - id: rounding-digit
      what: Uses the wrong digit to decide when rounding to Zehntausender
      addressed: lesson 3 Learn names the deciding digit for each kind of rounding; tasks round one number three ways
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Der Zahlenstrahl bis 1 000 000, en: The number line to 1 000 000 }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Zahl zeigt der Pfeil?"
            say: "Der Zahlenstrahl geht bis zehntausend. Welche Zahl zeigt der Pfeil?"
            show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends, mark: 6000 }
            options: ["6000", "600", "60 000"]
            answer: "6000"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Tausender sind 1 000 000?"
            say: "Wie viele Tausender sind eine Million?"
            options: ["100", "1000", "10 000"]
            answer: "1000"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "0 bis 1 000 000"
            say: "Der Zahlenstrahl bis zu einer Million. Zehn Schritte, also ist ein Schritt hunderttausend: hunderttausend, zweihunderttausend, und so weiter."
            show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends }
          - text: "340 000 bis 350 000"
            say: "Ein Ausschnitt von dreihundertvierzigtausend bis dreihundertfünfzigtausend. Hier ist ein Schritt nur tausend: dreihunderteinundvierzigtausend, dreihundertzweiundvierzigtausend, und so weiter."
            show: { drawn: number-line, from: 340000, to: 350000, step: 1000, labels: ends }
          - text: "346 000"
            say: "Der Pfeil zeigt sechs Schritte nach dreihundertvierzigtausend: dreihundertsechsundvierzigtausend. Frag immer zuerst: Wo fängt der Strahl an, und wie groß ist ein Schritt?"
            show: { drawn: number-line, from: 340000, to: 350000, step: 1000, labels: ends, mark: 346000 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: point_on_line
                text: "Tippe auf 700 000."
                say: "Tippe auf siebenhunderttausend."
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends }
                answer: 700000
                hints:
                  - "Ein Schritt ist hunderttausend."
                  - "Zähl sieben Schritte von null."
                  - "Der siebte Strich nach der Null."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Zahl zeigt der Pfeil?"
                say: "Der Strahl geht von fünfhundertzwanzigtausend bis fünfhundertdreißigtausend. Welche Zahl zeigt der Pfeil?"
                show: { drawn: number-line, from: 520000, to: 530000, step: 1000, labels: ends, mark: 524000 }
                options: ["524 000", "560 000", "520 400"]
                answer: "524 000"
                option_audio: false
                feedback:
                  "560 000": "Auf diesem Ausschnitt ist ein Schritt nur tausend, nicht zehntausend."
                hints:
                  - "Wie groß ist ein Schritt auf diesem Ausschnitt?"
                  - "Ein Schritt ist tausend. Der Pfeil steht vier Schritte nach 520 000."
                  - "524 000."
              - id: l1-f3
                type: point_on_line
                text: "Tippe auf 263 000."
                say: "Tippe auf zweihundertdreiundsechzigtausend."
                show: { drawn: number-line, from: 260000, to: 270000, step: 1000, labels: ends }
                answer: 263000
                hints:
                  - "Der Strahl fängt bei 260 000 an."
                  - "Ein Schritt ist tausend. Zähl drei Schritte."
                  - "Der dritte Strich nach 260 000."
              - id: l1-f4
                type: multiple_choice
                text: "Welche Zahl zeigt der Pfeil?"
                say: "Der Strahl geht bis zu einer Million. Welche Zahl zeigt der Pfeil?"
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 400000 }
                options: ["400 000", "40 000", "4000"]
                answer: "400 000"
                option_audio: false
                hints:
                  - "Ein Schritt ist hunderttausend."
                  - "Der Pfeil steht beim vierten Strich nach der Null."
                  - "400 000."
              - id: l1-f5
                type: multiple_choice
                text: "Ungefähr welche Zahl zeigt der Pfeil?"
                say: "Der Pfeil steht zwischen zwei Strichen. Ungefähr welche Zahl zeigt er?"
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 650000 }
                options: ["650 000", "600 000", "750 000"]
                answer: "650 000"
                option_audio: false
                hints:
                  - "Zwischen welchen Strichen steht der Pfeil?"
                  - "Zwischen 600 000 und 700 000, genau in der Mitte."
                  - "650 000."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? Auf dem Strahl von 0 bis 1 000 000 ist ein Schritt 10 000."
                say: "Der Strahl von null bis zu einer Million hat zehn Schritte. Ein Schritt ist zehntausend. Stimmt das?"
                answer: false
                hints:
                  - "Wie viele Schritte hat der Strahl?"
                  - "Zehn Schritte bis eine Million."
                  - "Nein, ein Schritt ist hunderttausend."

          - support: some
            tasks:
              - id: l1-s1
                type: point_on_line
                text: "Tippe auf 300 000."
                say: "Tippe auf dreihunderttausend."
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends }
                answer: 300000
                hints: ["Wie groß ist ein Schritt?"]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Zahl zeigt der Pfeil?"
                say: "Der Strahl geht von achthundertzehntausend bis achthundertzwanzigtausend. Welche Zahl zeigt der Pfeil?"
                show: { drawn: number-line, from: 810000, to: 820000, step: 1000, labels: ends, mark: 817000 }
                options: ["817 000", "870 000", "810 700"]
                answer: "817 000"
                option_audio: false
                hints: ["Wo fängt der Strahl an, und wie groß ist ein Schritt?"]
              - id: l1-s3
                type: point_on_line
                text: "Tippe auf 95 000."
                say: "Tippe auf fünfundneunzigtausend."
                show: { drawn: number-line, from: 90000, to: 100000, step: 1000, labels: ends }
                answer: 95000
                hints: ["Der Strahl fängt bei 90 000 an."]
              - id: l1-s4
                type: multiple_choice
                text: "Ungefähr welche Zahl zeigt der Pfeil?"
                say: "Der Pfeil steht zwischen zwei Strichen. Ungefähr welche Zahl zeigt er?"
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 250000 }
                options: ["250 000", "350 000", "200 000"]
                answer: "250 000"
                option_audio: false
                hints: ["Zwischen welchen beiden Strichen steht er?"]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Zwischen 400 000 und 500 000 liegt 450 000."
                say: "Zwischen vierhunderttausend und fünfhunderttausend liegt vierhundertfünfzigtausend. Stimmt das?"
                answer: true
                hints: ["Vergleiche die Hunderttausender."]

          - support: none
            tasks:
              - id: l1-n1
                type: point_on_line
                text: "Tippe auf 900 000."
                say: "Tippe auf neunhunderttausend."
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends }
                answer: 900000
              - id: l1-n2
                type: multiple_choice
                text: "Welche Zahl zeigt der Pfeil?"
                say: "Der Strahl geht von sechzigtausend bis siebzigtausend. Welche Zahl zeigt der Pfeil?"
                show: { drawn: number-line, from: 60000, to: 70000, step: 1000, labels: ends, mark: 68000 }
                options: ["68 000", "600 800", "80 000"]
                answer: "68 000"
                option_audio: false
              - id: l1-n3
                type: point_on_line
                text: "Tippe auf 432 000."
                say: "Tippe auf vierhundertzweiunddreißigtausend."
                show: { drawn: number-line, from: 430000, to: 440000, step: 1000, labels: ends }
                answer: 432000
              - id: l1-n4
                type: multiple_choice
                text: "Ungefähr welche Zahl zeigt der Pfeil?"
                say: "Der Pfeil steht zwischen zwei Strichen. Ungefähr welche Zahl zeigt er?"
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 850000 }
                options: ["850 000", "800 000", "950 000"]
                answer: "850 000"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 1 000 000 liegt rechts von 999 000."
                say: "Eine Million liegt auf dem Zahlenstrahl rechts von neunhundertneunundneunzigtausend. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: point_on_line
            text: "Tippe auf 200 000."
            say: "Tippe auf zweihunderttausend."
            show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends }
            answer: 200000
          - id: l1-c2
            type: multiple_choice
            text: "Welche Zahl zeigt der Pfeil?"
            say: "Der Strahl geht von siebenhundertvierzigtausend bis siebenhundertfünfzigtausend. Welche Zahl zeigt der Pfeil?"
            show: { drawn: number-line, from: 740000, to: 750000, step: 1000, labels: ends, mark: 742000 }
            options: ["742 000", "720 000", "740 200"]
            answer: "742 000"
            option_audio: false
          - id: l1-c3
            type: point_on_line
            text: "Tippe auf 509 000."
            say: "Tippe auf fünfhundertneuntausend."
            show: { drawn: number-line, from: 500000, to: 510000, step: 1000, labels: ends }
            answer: 509000

  - n: 2
    title: { de: Vergleichen und ordnen, en: Comparing and ordering }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen die Zahlen?"
            frame: "7284 _ 7248"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viel ist die 3 in 534 000 wert?"
            say: "Wie viel ist die Drei in fünfhundertvierunddreißigtausend wert?"
            options: ["3000", "30 000", "300 000"]
            answer: "30 000"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "99 999 < 100 000"
            say: "Eine Zahl mit mehr Stellen ist größer. Neunundneunzigtausendneunhundertneunundneunzig hat nur fünf Stellen, hunderttausend hat sechs. Also ist hunderttausend größer, auch wenn es lauter Nullen hat."
          - text: "435 162 und 453 126"
            say: "Haben beide Zahlen gleich viele Stellen, vergleichen wir von links, Spalte für Spalte. Bei den Hunderttausendern steht bei beiden eine Vier. Bei den Zehntausendern: drei und fünf. Fünf ist mehr."
          - text: "435 162 < 453 126"
            say: "Also ist vierhundertfünfunddreißigtausend und so weiter kleiner als vierhundertdreiundfünfzigtausend und so weiter. Was rechts davon kommt, zählt nicht mehr."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen die Zahlen?"
                frame: "98 765 _ 102 345"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "98 765 hat große Ziffern, aber nur fünf Stellen. 102 345 hat sechs Stellen und ist größer."
                hints:
                  - "Wie viele Stellen hat jede Zahl?"
                  - "98 765 hat fünf Stellen, 102 345 hat sechs."
                  - "98 765 ist kleiner als 102 345."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen die Zahlen?"
                frame: "618 300 _ 681 300"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Bei den Hunderttausendern sind beide gleich."
                  - "Vergleiche die Zehntausender: 1 und 8."
                  - "618 300 ist kleiner als 681 300."
              - id: l2-f3
                type: ordering
                text: "Ordne die Zahlen. Die kleinste zuerst."
                say: "Ordne die Zahlen. Die kleinste zuerst."
                options: ["250 500", "205 500", "250 050", "52 500"]
                slot_count: 4
                answer: ["52 500", "205 500", "250 050", "250 500"]
                hints:
                  - "Welche Zahl hat nur fünf Stellen?"
                  - "Dann vergleiche 205 500, 250 050 und 250 500 von links."
                  - "52 500, 205 500, 250 050, 250 500."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 370 090 > 370 900"
                say: "Dreihundertsiebzigtausendneunzig ist größer als dreihundertsiebzigtausendneunhundert. Stimmt das?"
                answer: false
                hints:
                  - "Die linke Dreiergruppe ist bei beiden 370."
                  - "Rechts: 090 und 900. Vergleiche die Hunderter."
                  - "Nein, 370 090 ist kleiner."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Zahl ist am größten?"
                say: "Welche Zahl ist am größten?"
                options: ["899 999", "908 000", "980 000"]
                answer: "980 000"
                option_audio: false
                hints:
                  - "Wer hat die meisten Hunderttausender?"
                  - "908 000 und 980 000: Vergleiche die Zehntausender."
                  - "980 000 ist am größten."
              - id: l2-f6
                type: fill_in_blank
                text: "Welche Zahl passt?"
                say: "Welche Zahl passt in die Lücke?"
                frame: "_ < 500 000"
                options: ["500 001", "499 999", "510 000"]
                answer: ["499 999"]
                hints:
                  - "Die Zahl muss kleiner sein als 500 000."
                  - "Weniger als 5 Hunderttausender."
                  - "499 999."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen die Zahlen?"
                frame: "724 815 _ 724 158"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Such die erste Spalte, in der sich die Zahlen unterscheiden."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen die Zahlen?"
                frame: "300 000 + 40 000 _ 340 000"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Rechne zuerst links."]
              - id: l2-s3
                type: ordering
                text: "Ordne die Zahlen. Die größte zuerst."
                say: "Ordne die Zahlen. Die größte zuerst."
                options: ["161 000", "610 000", "601 100", "116 000"]
                slot_count: 4
                answer: ["610 000", "601 100", "161 000", "116 000"]
                hints: ["Vergleiche zuerst die Hunderttausender."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 1 000 000 > 999 999"
                say: "Eine Million ist größer als neunhundertneunundneunzigtausendneunhundertneunundneunzig. Stimmt das?"
                answer: true
                hints: ["Zähl die Stellen."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Zahl ist am kleinsten?"
                say: "Welche Zahl ist am kleinsten?"
                options: ["404 040", "440 400", "404 400"]
                answer: "404 040"
                option_audio: false
                hints: ["Vergleiche Spalte für Spalte von links."]
              - id: l2-s6
                type: fill_in_blank
                text: "Welche Zahl passt?"
                say: "Welche Zahl passt in die Lücke?"
                frame: "_ > 800 000"
                options: ["799 999", "80 000", "800 100"]
                answer: ["800 100"]
                hints: ["Die Zahl muss größer sein als 800 000."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen die Zahlen?"
                frame: "56 700 _ 506 700"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen die Zahlen?"
                frame: "932 410 _ 923 410"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
              - id: l2-n3
                type: ordering
                text: "Ordne die Zahlen. Die kleinste zuerst."
                say: "Ordne die Zahlen. Die kleinste zuerst."
                options: ["707 070", "77 700", "770 007", "700 770"]
                slot_count: 4
                answer: ["77 700", "700 770", "707 070", "770 007"]
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 345 678 < 345 687"
                say: "Dreihundertfünfundvierzigtausendsechshundertachtundsiebzig ist kleiner als dreihundertfünfundvierzigtausendsechshundertsiebenundachtzig. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welche Zahl ist am größten?"
                say: "Welche Zahl ist am größten?"
                options: ["199 900", "201 000", "200 990"]
                answer: "201 000"
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen die Zahlen?"
            frame: "460 125 _ 460 512"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c2
            type: ordering
            text: "Ordne die Zahlen. Die kleinste zuerst."
            say: "Ordne die Zahlen. Die kleinste zuerst."
            options: ["830 000", "380 000", "83 000", "308 000"]
            slot_count: 4
            answer: ["83 000", "308 000", "380 000", "830 000"]
          - id: l2-c3
            type: multiple_choice
            text: "Welche Zahl ist am kleinsten?"
            say: "Welche Zahl ist am kleinsten?"
            options: ["90 999", "100 000", "99 090"]
            answer: "90 999"
            option_audio: false

  - n: 3
    title: { de: Sinnvoll runden, en: Rounding sensibly }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Runde 6480 auf Tausender."
            say: "Runde sechstausendvierhundertachtzig auf Tausender."
            options: ["6000", "7000", "6500"]
            answer: "6000"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "Runde 3750 auf Hunderter."
            say: "Runde dreitausendsiebenhundertfünfzig auf Hunderter."
            options: ["3700", "3800", "4000"]
            answer: "3800"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "347 000 ≈ 350 000"
            say: "Auf Zehntausender runden: Dreihundertsiebenundvierzigtausend liegt zwischen den Nachbarzehntausendern dreihundertvierzigtausend und dreihundertfünfzigtausend, näher an dreihundertfünfzigtausend."
            show: { drawn: number-line, from: 340000, to: 350000, step: 1000, labels: ends, mark: 347000 }
          - text: "Die Tausenderziffer entscheidet"
            say: "Beim Runden auf Zehntausender entscheidet die Tausenderziffer: null bis vier abrunden, fünf bis neun aufrunden. Beim Runden auf Hunderttausender entscheidet die Zehntausenderziffer."
          - text: "628 450: 628 000, 630 000, 600 000"
            say: "Eine Zahl, dreimal gerundet: auf Tausender sechshundertachtundzwanzigtausend. Auf Zehntausender sechshundertdreißigtausend. Auf Hunderttausender sechshunderttausend. Immer entscheidet die Ziffer rechts von der Stelle, auf die du rundest."
          - text: "48 213 Zuschauer ≈ 48 000"
            say: "Sinnvoll runden heißt: so runden, wie es zur Sache passt. Im Stadion waren achtundvierzigtausendzweihundertdreizehn Zuschauer. In der Zeitung steht: ungefähr achtundvierzigtausend. Das kann man sich merken, und es ist nah genug."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Runde 732 000 auf Hunderttausender."
                say: "Runde siebenhundertzweiunddreißigtausend auf Hunderttausender."
                show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 732000 }
                options: ["700 000", "800 000", "730 000"]
                answer: "700 000"
                option_audio: false
                feedback:
                  "730 000": "Das ist auf Zehntausender gerundet. Auf Hunderttausender gibt es nur 700 000 oder 800 000."
                hints:
                  - "Welche Hunderttausender liegen neben 732 000?"
                  - "700 000 und 800 000. Die Zehntausenderziffer ist 3."
                  - "732 000 gerundet ist 700 000."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "Runde 265 400 auf Zehntausender."
                say: "Runde zweihundertfünfundsechzigtausendvierhundert auf Zehntausender."
                options: ["260 000", "270 000", "265 000"]
                answer: "270 000"
                option_audio: false
