          - text: "841 − 403 = 838 − 400 = 438"
            say: "Es geht auch nach unten: Nimm von beiden drei weg. Achthundertachtunddreißig minus vierhundert ist vierhundertachtunddreißig."
          - text: "fast ein voller Hunderter: Hilfsaufgabe oder gleichsinnig verändern · nah beieinander: ergänzen · sonst: schrittweise oder stellenweise"
            say: "Welcher Weg passt? Ist eine Zahl fast ein voller Hunderter, hilft eine Hilfsaufgabe. Bei minus kannst du stattdessen beide Zahlen gleichsinnig verändern, bis die zweite Zahl ein voller Hunderter ist. Liegen die Zahlen bei minus nah beieinander, ergänzt du. Sonst rechnest du schrittweise oder stellenweise."

