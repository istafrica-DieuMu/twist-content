# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.clever-to-1000
skill: math.add-sub-to-1000.clever
curriculum: de-DE
language: de
title:
  de: Geschickt rechnen bis 1000
  en: Calculating cleverly to 1000
summary: >
  Clever ways within 1000 and choosing a way that suits. Lesson 1 uses a
  Hilfsaufgabe with a full hundred (458 + 199 = 458 + 200 − 1,
  734 − 298 = 734 − 300 + 2) and puts the result right; lesson 2 changes
  both numbers of a minus sum by the same amount (gleichsinniges
  Verändern: 523 − 197 = 526 − 200), says which way suits which sum, and
  ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-1000.semi-written, math.add-sub-to-100.clever]
  also_practises: [math.add-sub-to-1000.bridging]
  vocabulary: { de: [Hilfsaufgabe, gleichsinniges Verändern, vorteilhaft, Rechenweg] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich]
  facets: []
  misconceptions:
    - id: correct-wrong-way
      what: Puts a minus Hilfsaufgabe right the wrong way (734 − 298 = 734 − 300 − 2)
      addressed: Learn says what to do after plus and after minus; "Was musst du tun?" tasks in each stage, with plus and minus mixed; feedback in the full stage
    - id: change-one-number
      what: Changes only one number when making a minus sum easier, or changes them in opposite directions (523 − 197 = 520 − 200)
      addressed: lesson 2 Learn says both numbers change by the same amount; true/false tasks with a wrong change in the some stage
    - id: one-way-for-all
      what: Uses the same way for every sum
      addressed: lesson 2 asks which way suits, and the right way differs from sum to sum (Hilfsaufgabe, ergänzen, stellenweise)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Mit Hilfsaufgabe, en: Using an easier sum }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "45 + 19 = _"
            say: "Fünfundvierzig plus neunzehn."
            answer: "64"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "640 + 300 = _"
            say: "Sechshundertvierzig plus dreihundert."
            answer: "940"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "458 + 199 = 458 + 200 − 1 = 657"
            say: "Vierhundertachtundfünfzig plus hundertneunundneunzig. Hundertneunundneunzig ist fast zweihundert. Rechne mit der Hilfsaufgabe vierhundertachtundfünfzig plus zweihundert: sechshundertachtundfünfzig. Du hast eins zu viel dazugerechnet, also nimm eins wieder weg: sechshundertsiebenundfünfzig."
          - text: "734 − 298 = 734 − 300 + 2 = 436"
            say: "Siebenhundertvierunddreißig minus zweihundertachtundneunzig. Rechne minus dreihundert: vierhundertvierunddreißig. Du hast zwei zu viel weggenommen, also leg zwei wieder dazu: vierhundertsechsunddreißig."
            show: { drawn: rechenstrich, start: 734, jumps: [-300, 2] }
          - text: "plus: wieder wegnehmen · minus: wieder dazulegen"
            say: "Nach einer Plus-Hilfsaufgabe nimmst du das Zuviel wieder weg. Nach einer Minus-Hilfsaufgabe legst du es wieder dazu."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne mit Hilfsaufgabe."
                say: "Dreihundertsiebenundsechzig plus zweihundertneunundneunzig. Rechne mit Hilfsaufgabe."
                frame: "367 + 299 = 367 + 300 − _ = _"
                options: ["1", "2", "666", "668"]
                answer: ["1", "666"]
                hints:
                  - "299 ist eins weniger als 300."
                  - "367 + 300 = 667."
                  - "667 − 1 = 666."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "625 − 199: 625 − 200 = 425. Was musst du tun?"
                say: "Sechshundertfünfundzwanzig minus hundertneunundneunzig. Du hast minus zweihundert gerechnet und vierhundertfünfundzwanzig bekommen. Was musst du jetzt tun?"
                options: ["eins dazulegen", "eins wegnehmen"]
                answer: "eins dazulegen"
                feedback:
                  "eins wegnehmen": "Du hast eins zu viel weggenommen. Das musst du wieder dazulegen: 426."
                hints:
                  - "Hast du zu viel oder zu wenig weggenommen?"
                  - "Eins zu viel weggenommen."
                  - "Eins wieder dazulegen: 426."
              - id: l1-f3
                type: text_input
                text: "542 + 198 = _"
                say: "Fünfhundertzweiundvierzig plus hundertachtundneunzig."
                answer: "740"
                hints:
                  - "198 ist zwei weniger als 200."
                  - "542 + 200 = 742."
                  - "742 − 2 = 740."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 813 − 397 = 813 − 400 − 3"
                say: "Achthundertdreizehn minus dreihundertsiebenundneunzig ist dasselbe wie achthundertdreizehn minus vierhundert minus drei. Stimmt das?"
                answer: false
                feedback:
                  "true": "Bei minus vierhundert hast du drei zu viel weggenommen. Die legst du wieder dazu: 813 − 400 + 3 = 416."
                hints:
                  - "Hast du bei minus 400 zu viel oder zu wenig weggenommen?"
                  - "Drei zu viel, also wieder dazulegen."
                  - "Nein, richtig ist 813 − 400 + 3."
              - id: l1-f5
