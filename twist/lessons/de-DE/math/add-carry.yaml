                say: "Rechne schriftlich: sechshundertachtundfünfzig plus zweihundertvierunddreißig."
                show: { drawn: written-calc, rows: ["658", "234"], op: "+" }
                answer: "892"
                hints: ["Einer zuerst."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
