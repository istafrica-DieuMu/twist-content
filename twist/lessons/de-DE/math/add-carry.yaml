          - text: "3 + 2 + 1 = 6 → 643"
            say: "Hunderter: drei plus zwei plus eins ist sechs. Das Ergebnis ist sechshundertdreiundvierzig. Der Übertrag bedeutet immer: Zehn an einer Stelle sind eins an der nächsten Stelle."
