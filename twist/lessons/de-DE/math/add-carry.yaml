            show: { drawn: written-calc, rows: ["368", "275"], op: "+", carry: " 1 ", result: "__3" }
          - text: "6 + 7 + 1 = 14"
            say: "Zehner: sechs plus sieben plus eins ist vierzehn. Vierzehn Zehner sind ein Hunderter und vier Zehner. Vier an, eins weiter zu den Hundertern."
