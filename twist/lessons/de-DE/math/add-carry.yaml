# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.add-carry
skill: math.written-add-sub.add-carry
curriculum: de-DE
language: de
title:
  de: Schriftlich addieren mit Übertrag
  en: Column addition with carrying
summary: >
  When a column makes ten or more, the ten moves to the next column as a
  small Übertrag. Lesson 1 carries from the Einer to the Zehner (347 +
  238); lesson 2 carries in two columns and explains what the Übertrag
  means (ten Einer are one Zehner), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.add-no-carry]
  also_practises: [math.add-sub-to-1000.estimate]
  vocabulary: { de: [Übertrag, übertragen, Einer, Zehner, Hunderter, schriftlich addieren] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  misconceptions:
    - id: write-both-digits
      what: Writes 15 under the Einer instead of 5 and carrying 1
      addressed: Learn shows the 5 written and the 1 carried; "Was schreibst du bei den Einern?" offers the two-digit answer (13, 14) in every stage of lesson 1, with feedback in the full stage
    - id: forget-carry
      what: Forgets to add the carried 1 in the next column (347 + 238 = 575)
      addressed: Learn adds the Übertrag aloud; a "Wo ist der Fehler?" task with a forgotten carry in each stage of lesson 2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Übertrag zu den Zehnern, en: Carrying to the tens }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l1-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: dreihundertzwölf plus hundertsechsundsiebzig."
            show: { drawn: written-calc, rows: ["312", "176"], op: "+" }
            answer: "488"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "10 Einer sind …"
            say: "Zehn Einer sind wie viele Zehner?"
            options: ["1 Zehner", "10 Zehner", "100 Zehner"]
            answer: "1 Zehner"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "347 + 238"
            say: "Dreihundertsiebenundvierzig plus zweihundertachtunddreißig. Fang bei den Einern an: sieben plus acht ist fünfzehn."
            show: { drawn: written-calc, rows: ["347", "238"], op: "+" }
          - text: "5 an, 1 weiter"
            say: "Fünfzehn ist ein Zehner und fünf Einer. Die Fünf schreibst du unter die Einer. Den einen Zehner schreibst du klein zu den Zehnern: Das ist der Übertrag."
            show: { drawn: written-calc, rows: ["347", "238"], op: "+", carry: " 1 ", result: "__5" }
          - text: "4 + 3 + 1 = 8 · 3 + 2 = 5"
            say: "Bei den Zehnern rechnest du den Übertrag mit: vier plus drei plus eins ist acht. Bei den Hundertern: drei plus zwei ist fünf. Das Ergebnis ist fünfhundertfünfundachtzig."
            show: { drawn: written-calc, rows: ["347", "238"], op: "+", carry: " 1 ", result: "585" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an. Denk an den Übertrag."
                show: { drawn: written-calc, rows: ["256", "317"], op: "+", carry: " 1 ", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["3", "7", "5", "6"]
                answer: ["3", "7", "5"]
                hints:
                  - "Einer: sechs plus sieben ist dreizehn. Schreib drei, eins weiter."
                  - "Zehner: fünf plus eins plus eins."
                  - "E: 3, Z: 7, H: 5. Das ist 573."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was schreibst du bei den Einern?"
                say: "Bei den Einern rechnest du neun plus vier. Was schreibst du unter die Einer, und was überträgst du?"
                show: { drawn: written-calc, rows: ["429", "134"], op: "+" }
                options: ["3, Übertrag 1", "13", "4, Übertrag 1"]
                answer: "3, Übertrag 1"
                feedback:
                  "13": "Unter eine Stelle passt nur eine Ziffer. Dreizehn ist drei Einer und ein Zehner: Die Eins wird übertragen."
                hints:
                  - "Neun plus vier ist dreizehn."
                  - "Dreizehn: ein Zehner und drei Einer."
                  - "3 an, 1 weiter."
              - id: l1-f3
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: vierhundertneunundzwanzig plus hundertvierunddreißig."
                show: { drawn: written-calc, rows: ["429", "134"], op: "+" }
                answer: "563"
                hints:
                  - "Einer: neun plus vier ist dreizehn, drei an, eins weiter."
                  - "Zehner: zwei plus drei plus eins."
                  - "563."
              - id: l1-f4
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["168", "225"], op: "+", carry: " 1 ", result: "393" }
                answer: true
                hints:
                  - "Einer: acht plus fünf ist dreizehn."
                  - "Zehner: sechs plus zwei plus eins ist neun."
                  - "Ja, 393."
