# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.sub-to-10
skill: math.add-sub-to-20.sub-to-10
curriculum: de-DE
language: de
title:
  de: Minusaufgaben bis 10
  en: Subtracting to 10
summary: >
  Solving minus sums to 10 by taking away in the ten-frame and by counting
  back on the number line. Lesson 1 takes away and counts back to 5;
  lesson 2 works to 10, takes away a whole row of five at once, and ends
  with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.sub-meaning]
  also_practises: [math.add-sub-to-20.add-to-10]
  vocabulary: { de: [minus, gleich, rückwärts zählen, wegnehmen, übrig] }
  forms: [drawn, text, audio]
  drawn: [ten-frame, number-line]
  facets: []
  misconceptions:
    - id: count-back-includes-start
      what: Counts the start number when counting back (5 − 2 as 5, 4 = 4)
      addressed: Learn says the first step goes to the number before; jumps on the number line show it
    - id: subtract-smaller-from-larger
      what: Takes the smaller from the larger whatever the order (2 − 5 = 3)
      addressed: kept for later; all sums here start with the bigger number, and Learn says the first number is what you start with
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Wegnehmen und rückwärts zählen, en: Taking away and counting back }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele bleiben übrig?"
            show: { drawn: ten-frame, filled: 5, cross: 1 }
            options: ["3", "4", "5"]
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was kommt vor 4?"
            say: "Welche Zahl kommt vor vier?"
            options: ["3", "5", "2"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5 − 2 = ?"
            say: "Fünf minus zwei. Im Zehnerfeld streichen wir zwei Punkte weg. Drei bleiben."
            show: { drawn: ten-frame, filled: 5, cross: 2 }
          - text: "5 … 4, 3"
            say: "Oder auf dem Zahlenstrahl: Fang bei fünf an, zwei Schritte zurück. Vier, drei."
            show: { drawn: number-line, from: 0, to: 10, labels: all, jumps: [[5, -1], [4, -1]] }
          - text: "5 − 2 = 3"
            say: "Fünf minus zwei gleich drei. Beim Rückwärtszählen geht der erste Schritt zur Zahl davor."
          - text: "4 − 0 = 4"
            say: "Und minus null? Dann geht nichts weg. Vier minus null ist vier."
            show: { drawn: ten-frame, filled: 4 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "4 − 1 = ?"
                show: { drawn: ten-frame, filled: 4, cross: 1 }
                options: ["2", "3", "4"]
                answer: "3"
                hints:
                  - "Zähl die Punkte ohne Kreuz."
                  - "Vier, einer weg."
                  - "4 − 1 = 3."
                difficulty: easy
              - id: l1-f2
                type: point_on_line
                text: "Wo landest du? 5 − 3"
                say: "Fang bei fünf an, drei Schritte zurück. Wo landest du?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 2
                feedback:
                  "3": "Der erste Schritt zurück geht zur Vier. Vier, drei, zwei."
                hints:
                  - "Der erste Schritt geht zur Vier."
                  - "Vier, drei, zwei."
                  - "Du landest bei 2."
              - id: l1-f3
                type: text_input
                text: "3 − 1 = _"
                answer: "2"
                hints:
                  - "Fang bei 3 an."
                  - "Einen zurück."
                  - "2."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 5 − 1 = 4"
                answer: true
                hints:
                  - "Einen zurück von 5."
                  - "Vier."
                  - "Ja."
              - id: l1-f5
                type: multiple_choice
                text: "5 − 4 = ?"
                show: { drawn: ten-frame, filled: 5, cross: 4 }
                options: ["1", "2", "4"]
                answer: "1"
                hints:
                  - "Vier sind weg."
                  - "Zähl, was übrig bleibt."
                  - "1."
              - id: l1-f6
                type: text_input
                text: "4 − 2 = _"
                answer: "2"
                hints:
                  - "Zwei zurück von 4."
                  - "Drei, zwei."
                  - "2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "3 − 2 = ?"
                show: { drawn: ten-frame, filled: 3, cross: 2 }
                options: ["1", "2", "3"]
                answer: "1"
                hints: ["Ohne Kreuz zählen."]
              - id: l1-s2
                type: point_on_line
                text: "Wo landest du? 4 − 3"
                say: "Fang bei vier an, drei Schritte zurück. Wo landest du?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 1
                hints: ["Zähl von vier aus drei Schritte zurück."]
              - id: l1-s3
                type: text_input
                text: "5 − 2 = _"
                answer: "3"
                hints: ["Zwei zurück."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 4 − 1 = 5"
                answer: false
                hints: ["Bei minus wird es weniger."]
              - id: l1-s5
                type: multiple_choice
                text: "5 − 5 = ?"
                options: ["0", "1", "5"]
                answer: "0"
                hints: ["Alle sind weg."]
              - id: l1-s6
                type: text_input
                text: "2 − 1 = _"
                answer: "1"
                hints: ["Einen zurück."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "4 − 3 = ?"
                show: { drawn: ten-frame, filled: 4, cross: 3 }
                options: ["1", "2", "3"]
                answer: "1"
              - id: l1-n2
                type: point_on_line
                text: "Wo landest du? 5 − 2"
                say: "Fang bei fünf an, zwei Schritte zurück. Wo landest du?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 3
              - id: l1-n3
                type: text_input
                text: "3 − 3 = _"
                answer: "0"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 5 − 3 = 2"
                answer: true
              - id: l1-n5
                type: text_input
                text: "4 − 0 = _"
                answer: "4"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "5 − 1 = _"
            answer: "4"
          - id: l1-c2
            type: multiple_choice
            text: "4 − 2 = ?"
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c3
            type: point_on_line
            text: "Wo landest du? 3 − 2"
            say: "Fang bei drei an, zwei Schritte zurück. Wo landest du?"
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            answer: 1

  - n: 2
    title: { de: Minus bis 10, en: Subtracting to 10 }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "5 − 2 = _"
            say: "Fünf minus zwei. Schreib das Ergebnis."
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "4 − 1 = ?"
            options: ["3", "4", "5"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 − 5 = ?"
            say: "Acht minus fünf. Die obere Reihe ist fünf. Wir nehmen die ganze Reihe auf einmal weg."
            show: { drawn: ten-frame, filled: 8, cross: 5, cross_from: start }
          - text: "8 − 5 = 3"
            say: "Unten bleiben drei. Acht minus fünf gleich drei. Die Kraft der Fünf hilft auch beim Wegnehmen."
          - text: "9 − 2: 8, 7"
            say: "Nimmst du nur wenig weg, zählst du einfach zurück: neun minus zwei, acht, sieben."
            show: { drawn: number-line, from: 0, to: 10, labels: all, jumps: [[9, -1], [8, -1]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "7 − 5 = ?"
                show: { drawn: ten-frame, filled: 7, cross: 5, cross_from: start }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Die ganze obere Reihe ist weg."
                  - "Unten bleiben die anderen."
                  - "7 − 5 = 2."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "9 − 2 = _"
                answer: "7"
                hints:
                  - "Zwei zurück von 9."
                  - "Acht, sieben."
                  - "7."
              - id: l2-f3
                type: point_on_line
                text: "Wo landest du? 10 − 3"
                say: "Fang bei zehn an, drei Schritte zurück. Wo landest du?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 7
                hints:
                  - "Der erste Schritt geht zur Neun."
                  - "Neun, acht, sieben."
                  - "Du landest bei 7."
              - id: l2-f4
                type: multiple_choice
                text: "10 − 5 = ?"
                show: { drawn: ten-frame, filled: 10, cross: 5, cross_from: start }
                options: ["4", "5", "6"]
                answer: "5"
                hints:
                  - "Eine volle Reihe ist weg."
                  - "Eine volle Reihe bleibt."
                  - "5."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 8 − 1 = 7"
                answer: true
                hints:
                  - "Einen zurück von 8."
                  - "Sieben."
                  - "Ja."
              - id: l2-f6
                type: text_input
                text: "6 − 3 = _"
                answer: "3"
                hints:
                  - "Drei zurück von 6."
                  - "Fünf, vier, drei."
                  - "3."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "9 − 5 = ?"
                show: { drawn: ten-frame, filled: 9, cross: 5, cross_from: start }
                options: ["3", "4", "5"]
                answer: "4"
                hints: ["Die obere Reihe ist weg."]
              - id: l2-s2
                type: text_input
                text: "8 − 2 = _"
                answer: "6"
                hints: ["Zwei zurück."]
              - id: l2-s3
                type: point_on_line
                text: "Wo landest du? 7 − 4"
                say: "Fang bei sieben an, vier Schritte zurück. Wo landest du?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 3
                hints: ["Zähl von sieben aus vier Schritte zurück."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 10 − 2 = 7"
                answer: false
                hints: ["Zähl von zehn aus zwei zurück."]
              - id: l2-s5
                type: multiple_choice
                text: "6 − 5 = ?"
                show: { drawn: ten-frame, filled: 6, cross: 5, cross_from: start }
                options: ["0", "1", "2"]
                answer: "1"
                hints: ["Fünf sind weg."]
              - id: l2-s6
                type: text_input
                text: "9 − 3 = _"
                answer: "6"
                hints: ["Drei zurück."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "8 − 5 = ?"
                show: { drawn: ten-frame, filled: 8, cross: 5, cross_from: start }
                options: ["2", "3", "4"]
                answer: "3"
              - id: l2-n2
                type: text_input
                text: "10 − 4 = _"
                answer: "6"
              - id: l2-n3
                type: point_on_line
                text: "Wo landest du? 9 − 6"
                say: "Fang bei neun an, sechs Schritte zurück. Wo landest du?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 3
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 7 − 2 = 5"
                answer: true
              - id: l2-n5
                type: text_input
                text: "6 − 6 = _"
                answer: "0"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "5 − 3 = _"
            say: "Fünf minus drei. Schreib das Ergebnis."
            answer: "2"
          - id: l2-c2
            type: multiple_choice
            text: "9 − 4 = ?"
            say: "Neun minus vier. Wie viel ist das?"
            options: ["6", "4", "5"]
            answer: "5"
          - id: l2-c3
            type: text_input
            text: "8 − 3 = _"
            say: "Acht minus drei. Schreib das Ergebnis."
            answer: "5"
          - id: l2-c4
            type: point_on_line
            text: "Wo landest du? 10 − 6"
            say: "Fang bei zehn an, sechs Schritte zurück. Wo landest du?"
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            answer: 4
          - id: l2-c5
            type: multiple_choice
            text: "7 − 1 = ?"
            options: ["5", "6", "8"]
            answer: "6"
