                  "389 100": "Der Schritt ist tausend, nicht hundert. Zehn Tausender sind ein Zehntausender: Nach 389 000 kommt 390 000."
                  "380 000": "Die Zahlen werden größer, nicht kleiner. Tausend mehr als 389 000 ist 390 000."
                hints:
                  - "Der Schritt ist tausend."
                  - "389 000 und 1000: Die neun Tausender werden zehn, also ein Zehntausender mehr."
                  - "390 000."
                difficulty: easy
              - id: l2-f2
