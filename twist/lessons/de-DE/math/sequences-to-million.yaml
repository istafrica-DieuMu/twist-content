            type: fill_in_blank
            text: "Wie geht es weiter?"
            say: "Wie geht es weiter? 580 000, 590 000, 600 000."
            frame: "580 000, 590 000, 600 000, _ , _"
            options: ["610 000", "620 000", "700 000", "601 000"]
            answer: ["610 000", "620 000"]
          - id: l2-c3
            type: fill_in_blank
