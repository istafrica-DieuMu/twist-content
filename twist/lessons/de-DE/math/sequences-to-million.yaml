                text: "Wie geht es weiter?"
                say: "Wie geht es weiter? 670 000, 680 000, 690 000."
                frame: "670 000, 680 000, 690 000, _ , _"
                options: ["700 000", "710 000", "600 000", "691 000"]
                answer: ["700 000", "710 000"]
                hints:
                  - "Der Schritt ist zehntausend."
                  - "Nach 690 000 kommt der nächste Hunderttausender."
