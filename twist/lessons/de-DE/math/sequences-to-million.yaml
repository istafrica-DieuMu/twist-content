# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.sequences-to-million
skill: math.large-numbers.sequences
curriculum: de-DE
language: de
title:
  de: Zahlenfolgen bis 1 000 000
  en: Number sequences to 1 000 000
summary: >
  Counting in large steps (1000, 5000, 10 000, 25 000, 50 000, 100 000)
  and continuing sequences up to a million. Lesson 1 counts forwards and
  backwards in Tausendern, Zehntausendern and Hunderttausendern; lesson 2
  counts across a Zehntausender, a Hunderttausender and up to a million and
  fills gaps; lesson 3 finds and checks the rule of a sequence, and ends
  with the skill check.
metadata:
  year: klasse-4
  topic: { de: Große Zahlen, en: Large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.to-10000]
  also_practises: [math.large-numbers.to-million]
  vocabulary: { de: [Zahlenfolge, Schritt, Regel, vorwärts, rückwärts, Zehntausender, Hunderttausender, Million] }
  forms: [drawn, text, audio]
  drawn: [number-line, place-value-chart]
  facets: []
  misconceptions:
    - id: column-step
      what: Reads the step from the digit that changes but names the wrong column (calls 30 000, 40 000, 50 000 steps of 1000)
      addressed: lesson 1 Learn shows which column changes in the Stellentafel; full-stage feedback names the column
    - id: boundary-crossing
      what: Continues 388 000, 389 000 with 380 000 or 389 100 instead of 390 000, losing the step at the boundary
      addressed: lesson 2 Learn shows the step across the Zehntausender and the Hunderttausender; full-stage feedback says that ten Tausender make a Zehntausender
    - id: rule-from-two
      what: Reads the rule from the first two numbers only
      addressed: lesson 3 Learn checks the rule on every step, and one sequence in each stage breaks it late
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: In großen Schritten zählen, en: Counting in big steps }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "4000, 5000, 6000, _"
            say: "Wie geht es weiter? 4000, 5000, 6000."
            options: ["7000", "6100", "6001"]
            answer: "7000"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Zehntausender sind 100 000?"
            say: "Wie viele Zehntausender sind hunderttausend?"
            options: ["10", "100", "1000"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "30 000, 40 000, 50 000"
            say: "Bei 30 000, 40 000, 50 000 ändert sich nur eine Ziffer: die bei den Zehntausendern. Der Schritt ist also zehntausend."
            show: { drawn: place-value-chart, columns: [ten-thousands, thousands, hundreds, tens, ones], values: [5, 0, 0, 0, 0] }
          - text: "247 000, 248 000, 249 000"
            say: "Hier ändert sich die Ziffer bei den Tausendern: Der Schritt ist tausend. Die anderen Ziffern bleiben einfach stehen."
          - text: "600 000, 500 000, 400 000"
            say: "Rückwärts in Hunderttausendern: Die Ziffer bei den Hunderttausendern wird immer eins kleiner. Frag immer: Welche Spalte ändert sich, und um wie viel?"
            show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 400000 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "60 000, 70 000, 80 000, _"
                say: "Wie geht es weiter? 60 000, 70 000, 80 000."
                options: ["90 000", "81 000", "80 100"]
                answer: "90 000"
                option_audio: false
                feedback:
                  "81 000": "Die Ziffer bei den Zehntausendern ändert sich, nicht bei den Tausendern. Der Schritt ist zehntausend."
                hints:
                  - "Welche Spalte ändert sich?"
                  - "Die Zehntausender: Der Schritt ist 10 000."
                  - "80 000 und 10 000 sind 90 000."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Wie geht es weiter?"
                say: "Wie geht es weiter? 315 000, 316 000, 317 000."
                frame: "315 000, 316 000, 317 000, _ , _"
                options: ["318 000", "319 000", "327 000", "418 000"]
                answer: ["318 000", "319 000"]
                hints:
                  - "Welche Ziffer ändert sich?"
                  - "Die Ziffer bei den Tausendern: immer tausend mehr."
                  - "318 000, 319 000."
              - id: l1-f3
                type: multiple_choice
                text: "800 000, 700 000, 600 000, _"
                say: "Wie geht es weiter? 800 000, 700 000, 600 000."
                options: ["500 000", "590 000", "610 000"]
                answer: "500 000"
                option_audio: false
                hints:
                  - "Werden die Zahlen größer oder kleiner?"
                  - "Immer hunderttausend weniger."
                  - "500 000."
              - id: l1-f4
                type: multiple_choice
                text: "Wie groß ist der Schritt? 452 000, 462 000, 472 000"
                say: "Wie groß ist der Schritt in dieser Folge? 452 000, 462 000, 472 000."
                options: ["10 000", "1000", "100 000"]
                answer: "10 000"
                option_audio: false
                feedback:
                  "1000": "Schau genau: Die Ziffer bei den Zehntausendern ändert sich von 5 zu 6 zu 7. Die Ziffer bei den Tausendern bleibt 2."
                hints:
                  - "Welche Spalte ändert sich?"
                  - "Die zweite Ziffer von links: die Zehntausender."
                  - "Der Schritt ist 10 000."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 95 000, 96 000, 97 000 geht in Tausenderschritten."
                say: "Die Folge 95 000, 96 000, 97 000 geht in Tausenderschritten. Stimmt das?"
                answer: true
                hints:
                  - "Welche Ziffer ändert sich?"
                  - "Die Ziffer bei den Tausendern."
                  - "Ja."
              - id: l1-f6
