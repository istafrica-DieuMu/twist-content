            frame: "225 000, 250 000, 275 000, _"
            options: ["300 000", "285 000", "280 000"]
            answer: ["300 000"]

  - n: 3
    title: { de: Regeln finden und prüfen, en: Finding and checking rules }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "297 000, 298 000, 299 000, _"
            say: "Wie geht es weiter? 297 000, 298 000, 299 000."
            options: ["300 000", "299 100", "290 000"]
            answer: "300 000"
            option_audio: false
            difficulty: easy
          - id: l3-w2
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Welche Zahl fehlt in der Folge?"
            frame: "30 000, 40 000, _ , 60 000"
            options: ["50 000", "45 000", "41 000"]
            answer: ["50 000"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "120 000, 145 000, 170 000, 195 000"
            say: "Wie heißt die Regel? Von 120 000 zu 145 000 sind es 25 000 mehr."
          - text: "+25 000"
            say: "Prüfe jeden Schritt: 145 000 und 25 000 sind 170 000. 170 000 und 25 000 sind 195 000. Erst wenn die Regel bei allen Schritten stimmt, ist sie richtig."
          - text: "800 000, 700 000, 600 000, 550 000"
            say: "Hier passt die Regel nicht überall. Die ersten Schritte sind 100 000 weniger, der letzte nur 50 000. Statt 550 000 müsste 500 000 kommen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Wie heißt die Regel? 240 000, 340 000, 440 000, 540 000"
                say: "Wie heißt die Regel dieser Folge? 240 000, 340 000, 440 000, 540 000."
                options: ["+100 000", "+10 000", "−100 000"]
                answer: "+100 000"
                option_audio: false
                feedback:
                  "+10 000": "Die Ziffer, die sich ändert, steht bei den Hunderttausendern. Der Schritt ist hunderttausend."
                hints:
                  - "Welche Ziffer ändert sich?"
                  - "Die Ziffer bei den Hunderttausendern wird immer eins mehr."
                  - "Die Regel ist plus 100 000."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "Wie heißt die Regel? 900 000, 850 000, 800 000, 750 000"
                say: "Wie heißt die Regel dieser Folge? 900 000, 850 000, 800 000, 750 000."
                options: ["−50 000", "+50 000", "−100 000"]
                answer: "−50 000"
                option_audio: false
                hints:
                  - "Werden die Zahlen größer oder kleiner?"
                  - "Die Zahlen werden kleiner: von 900 000 zu 850 000."
                  - "Die Regel ist minus 50 000."
              - id: l3-f3
                type: multiple_choice
                text: "Welche Zahl passt nicht? 15 000, 21 000, 25 000, 30 000, 35 000"
                say: "Welche Zahl passt nicht in die Folge? 15 000, 21 000, 25 000, 30 000, 35 000."
                options: ["21 000", "25 000", "35 000"]
                answer: "21 000"
                option_audio: false
                hints:
                  - "Wie groß sind die Schritte am Ende?"
                  - "Immer 5000 mehr. Nach 15 000 müsste 20 000 kommen."
                  - "21 000 passt nicht."
              - id: l3-f4
                type: multiple_choice
                text: "Welche Regel erklärt die Folge? 975 000, 950 000, 925 000, 900 000"
                say: "Welche Regel erklärt die Folge? 975 000, 950 000, 925 000, 900 000."
                options: ["immer 25 000 weniger", "immer 25 000 mehr", "immer 50 000 weniger"]
                answer: "immer 25 000 weniger"
                option_audio: false
                hints:
                  - "Werden die Zahlen größer oder kleiner?"
                  - "Von 975 000 zu 950 000 sind es 25 000 weniger."
                  - "Immer 25 000 weniger."
              - id: l3-f5
                type: true_false
                text: "Stimmt die Regel +200 000? 100 000, 300 000, 500 000, 800 000"
                say: "Die Regel ist plus zweihunderttausend. Stimmt sie bei allen Schritten? 100 000, 300 000, 500 000, 800 000."
                answer: false
                feedback:
                  "true": "Die ersten Schritte stimmen. Aber von 500 000 zu 800 000 sind es 300 000."
                hints:
                  - "Prüfe jeden Schritt, auch den letzten."
                  - "500 000 und 200 000 sind 700 000."
                  - "Nein, der letzte Schritt stimmt nicht."
              - id: l3-f6
                type: fill_in_blank
                text: "Setze die Folge fort."
                say: "Die Regel ist plus 250 000. Setze die Folge fort."
                frame: "0, 250 000, _ , _"
                options: ["500 000", "750 000", "450 000", "1 000 000"]
                answer: ["500 000", "750 000"]
                option_audio: false
