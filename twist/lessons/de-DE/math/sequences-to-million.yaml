      - activity: learn
        mode: worked-examples
        screens:
          - text: "97 000, 98 000, 99 000, 100 000"
            say: "Nach 99 000 kommt mit tausend mehr: hunderttausend. Zehn Tausender werden ein Zehntausender, und zehn Zehntausender werden ein Hunderttausender. Die Zahl bekommt eine Stelle mehr."
            show: { drawn: number-line, from: 90000, to: 100000, step: 1000, labels: ends, mark: 100000 }
          - text: "280 000, 290 000, 300 000, 310 000"
            say: "In Zehntausenderschritten über den Hunderttausender: Nach 290 000 kommt 300 000. Die Ziffer bei den Zehntausendern springt auf null, und bei den Hunderttausendern wird es eins mehr."
          - text: "850 000, 900 000, 950 000, 1 000 000"
            say: "In Fünfzigtausenderschritten bis zur Million: 850 000, 900 000, 950 000, und dann eine Million."
            show: { drawn: number-line, from: 0, to: 1000000, step: 100000, labels: ends, mark: 950000 }

