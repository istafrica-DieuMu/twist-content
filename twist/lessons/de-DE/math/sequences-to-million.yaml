                options: ["175 000", "160 000", "170 000"]
                answer: ["175 000"]
                hints:
                  - "Wie groß ist der Schritt von 125 000 zu 150 000?"
                  - "Immer 25 000 mehr."
                  - "150 000 und 25 000 sind 175 000."
              - id: l2-f4
                type: multiple_choice
                text: "Was kommt nach 999 000 in Tausenderschritten?"
                say: "Wir zählen in Tausenderschritten. Was kommt nach 999 000?"
                options: ["1 000 000", "990 000", "999 100"]
                answer: "1 000 000"
                option_audio: false
                hints:
                  - "Tausend mehr als 999 000."
                  - "Alle Spalten sind voll: Es wird eine Stelle mehr."
                  - "Eine Million."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 410 000, 405 000, 400 000, 395 000"
                say: "Die Folge geht in Fünftausenderschritten rückwärts: 410 000, 405 000, 400 000, 395 000. Stimmt das?"
                answer: true
                hints:
                  - "Prüfe jeden Schritt."
                  - "400 000 minus 5000 ist 395 000."
                  - "Ja."

