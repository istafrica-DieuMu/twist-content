                say: "Wir zählen in Tausenderschritten rückwärts. Was kommt nach 100 000?"
                options: ["99 000", "90 000", "999 000"]
                answer: "99 000"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Stimmt das? 940 000, 960 000, 990 000, 1 000 000"
                say: "Die Folge geht in Zwanzigtausenderschritten: 940 000, 960 000, 990 000, eine Million. Stimmt das?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "48 000, 49 000, 50 000, _"
            say: "Wie geht es weiter? 48 000, 49 000, 50 000."
            options: ["51 000", "60 000", "500 000"]
            answer: "51 000"
