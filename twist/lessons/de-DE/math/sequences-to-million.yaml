                text: "57 000, 58 000, 59 000, _"
                say: "Wie geht es weiter? 57 000, 58 000, 59 000."
                options: ["60 000", "59 100", "50 000"]
                answer: "60 000"
                option_audio: false
                hints: ["Zehn Tausender sind ein Zehntausender."]
              - id: l2-s2
                type: fill_in_blank
                text: "Wie geht es weiter?"
                say: "Wie geht es weiter? 320 000, 310 000, 300 000."
                frame: "320 000, 310 000, 300 000, _ , _"
                options: ["290 000", "280 000", "200 000", "390 000"]
                answer: ["290 000", "280 000"]
                hints: ["Rückwärts über den Hunderttausender."]
