                say: "Die Folge 610 000, 620 000, 630 000 geht in Tausenderschritten. Stimmt das?"
                answer: false
                hints: ["In welcher Spalte steht die Ziffer, die sich ändert?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "35 000, 45 000, 55 000, _"
                say: "Wie geht es weiter? 35 000, 45 000, 55 000."
                options: ["65 000", "56 000", "155 000"]
                answer: "65 000"
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Wie geht es weiter?"
                say: "Wie geht es weiter? 702 000, 703 000, 704 000."
                frame: "702 000, 703 000, 704 000, _ , _"
                options: ["705 000", "706 000", "714 000", "804 000"]
                answer: ["705 000", "706 000"]
              - id: l1-n3
                type: multiple_choice
                text: "Wie groß ist der Schritt? 125 000, 225 000, 325 000"
                say: "Wie groß ist der Schritt in dieser Folge? 125 000, 225 000, 325 000."
                options: ["100 000", "10 000", "1000"]
                answer: "100 000"
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Wie geht es weiter?"
                say: "Wie geht es weiter? 900 000, 800 000, 700 000."
                frame: "900 000, 800 000, 700 000, _ , _"
                options: ["600 000", "500 000", "690 000", "800 000"]
                answer: ["600 000", "500 000"]
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 81 000, 82 000, 83 000 geht in Tausenderschritten."
                say: "Die Folge 81 000, 82 000, 83 000 geht in Tausenderschritten. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "500 000, 600 000, 700 000, _"
            say: "Wie geht es weiter? 500 000, 600 000, 700 000."
