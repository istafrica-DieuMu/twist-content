            say: "Dreihundertsiebenundvierzig mal sechs. Einer: sieben mal sechs ist zweiundvierzig. Zwei an, vier weiter: Die Zwei schreibst du unter die Einer, die Vier schreibst du als Übertrag klein zu den Zehnern."
          - text: "Z: 4 · 6 + 4 = 28, 8 an, 2 weiter"
            say: "Zehner: vier mal sechs ist vierundzwanzig, plus der Übertrag vier sind achtundzwanzig. Acht an, zwei weiter."
          - text: "H: 3 · 6 + 2 = 20 | 347 · 6 = 2082"
            say: "Hunderter: drei mal sechs ist achtzehn, plus der Übertrag zwei sind zwanzig. Es kommt keine Stelle mehr, also schreibst du die ganze Zwanzig hin. Das Ergebnis ist zweitausendzweiundachtzig."

