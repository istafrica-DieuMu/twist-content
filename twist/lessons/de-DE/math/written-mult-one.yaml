# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.written-mult-one
skill: math.written-mult-div.mult-one-digit
curriculum: de-DE
language: de
title:
  de: Schriftlich malnehmen mit einer einstelligen Zahl
  en: Written multiplication by a one-digit number
summary: >
  Multiplying a multi-digit number by a one-digit number in writing,
  starting with the ones. Lesson 1 multiplies without Übertrag (231 · 3)
  and checks the size with an Überschlag; lesson 2 carries the Übertrag
  to the next place (347 · 6 = 2082), finds the step where an Übertrag
  was forgotten, and ends with the skill check. Typed answers are plain
  digits.
metadata:
  year: klasse-4
  topic: { de: Schriftlich malnehmen, en: Written multiplication }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.semi-written-mult, math.written-add-sub.add-carry]
  also_practises: [math.mult-div-larger.large-mental]
  vocabulary: { de: [schriftlich multiplizieren, Übertrag, Einer, Zehner, Hunderter, Überschlag] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: forget-carry
      what: Writes the Übertrag but does not add it at the next place
      addressed: lesson 2 Learn adds each Übertrag aloud; a "Wo ist der Fehler?" task with a forgotten Übertrag in the full and some stages of lesson 2 (feedback in l2-f3), a correct one to judge in the none stage, and a true/false task with a forgotten Übertrag in the some stage and the skill check
    - id: start-left
      what: Starts with the hundreds instead of the ones
      addressed: both Learn parts start with the ones; the step frames always go Einer, Zehner, Hunderter
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Ohne Übertrag, en: Without carrying }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "7 · 8 = _"
            say: "Sieben mal acht."
            answer: "56"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "30 · 4 = _"
            say: "Dreißig mal vier."
            answer: "120"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "312 · 3 | E: 2 · 3 = 6"
            say: "Dreihundertzwölf mal drei, schriftlich. Du fängst bei den Einern an: zwei mal drei ist sechs. Die Sechs schreibst du unter die Einer."
          - text: "Z: 1 · 3 = 3 | H: 3 · 3 = 9 | 312 · 3 = 936"
            say: "Dann die Zehner: eins mal drei ist drei. Dann die Hunderter: drei mal drei ist neun. Das Ergebnis ist neunhundertsechsunddreißig."
          - text: "Überschlag: 300 · 3 = 900"
            say: "Mit dem Überschlag prüfst du, ob das Ergebnis ungefähr stimmt: dreihundert mal drei ist neunhundert. Neunhundertsechsunddreißig liegt nah daran."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne schriftlich: 231 · 3"
                say: "Zweihunderteinunddreißig mal drei. Fang bei den Einern an."
                frame: "E: 1 · 3 = _ | Z: 3 · 3 = _ | H: 2 · 3 = _"
                options: ["3", "9", "6", "5"]
                answer: ["3", "9", "6"]
                hints:
                  - "Einer: eins mal drei."
                  - "Zehner: drei mal drei. Hunderter: zwei mal drei."
                  - "3, 9 und 6. Das Ergebnis ist 693."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "423 · 2 = _"
                say: "Vierhundertdreiundzwanzig mal zwei. Rechne schriftlich."
                answer: "846"
                hints:
                  - "Einer: drei mal zwei."
                  - "Zehner: zwei mal zwei, Hunderter: vier mal zwei."
                  - "846."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? 214 · 4 = 856"
                say: "Zweihundertvierzehn mal vier ist achthundertsechsundfünfzig. Stimmt das?"
                answer: true
                hints:
                  - "Rechne Stelle für Stelle nach."
                  - "Vier mal vier, eins mal vier, zwei mal vier."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: text_input
                text: "1302 · 3 = _"
                say: "Tausenddreihundertzwei mal drei. Rechne schriftlich."
                answer: "3906"
                hints:
                  - "Auch die Null wird malgenommen: null mal drei ist null."
                  - "Einer, Zehner, Hunderter, Tausender."
                  - "3906."
              - id: l1-f5
                type: multiple_choice
                text: "Überschlag: 298 · 3 ≈ ?"
                say: "Mach den Überschlag für zweihundertachtundneunzig mal drei."
                options: ["900", "600", "9000"]
                answer: "900"
                hints:
                  - "Runde 298 auf Hunderter."
                  - "300 mal 3."
                  - "900."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne schriftlich: 132 · 3"
