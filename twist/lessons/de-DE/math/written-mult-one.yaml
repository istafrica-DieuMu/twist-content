            say: "Zweihundertdreizehn mal drei. Rechne schriftlich."
            answer: "639"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? 432 · 2 = 864"
            say: "Vierhundertzweiunddreißig mal zwei ist achthundertvierundsechzig. Stimmt das?"
            answer: true
          - id: l1-c3
            type: fill_in_blank
            text: "Rechne schriftlich: 221 · 4"
            say: "Zweihunderteinundzwanzig mal vier. Fang bei den Einern an."
            frame: "E: 1 · 4 = _ | Z: 2 · 4 = _ | H: 2 · 4 = _"
            options: ["4", "8", "6", "2"]
