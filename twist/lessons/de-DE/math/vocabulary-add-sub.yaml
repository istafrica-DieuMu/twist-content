# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.vocabulary-add-sub
skill: math.add-sub-to-1000.vocabulary
curriculum: de-DE
language: de
title:
  de: Summe und Differenz
  en: Sum and difference
summary: >
  The words for plus and minus calculations. Lesson 1 names the parts of a
  plus sum (Summand, Summe) and works out "die Summe von"; lesson 2 names
  the parts of a minus sum (Minuend, Subtrahend, Differenz), mixes plus
  and minus words, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-1000.semi-written]
  also_practises: [math.add-sub-to-1000.hundreds]
  vocabulary: { de: [Summe, Summand, addieren, Differenz, Minuend, Subtrahend, subtrahieren] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: sum-for-any-result
      what: Calls every result a Summe, also of a minus sum
      addressed: tasks ask for the calculation with a given Summe or Differenz, with a minus sum of the same result as a wrong option; feedback says a minus result is a Differenz
    - id: minuend-subtrahend-mixed
      what: Mixes up Minuend and Subtrahend
      addressed: lesson 2 Learn says which is which (the Minuend comes first, the Subtrahend is taken away); both are asked in every stage
    - id: difference-order
      what: Writes the Differenz of 500 and 180 as 180 − 500
      addressed: lesson 2 Learn says the Differenz of two numbers starts with the bigger one; an option in the full and none stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Summand und Summe, en: Addends and the sum }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "260 + 300 = _"
            say: "Zweihundertsechzig plus dreihundert."
            answer: "560"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "800 − 350 = _"
            say: "Achthundert minus dreihundertfünfzig."
            answer: "450"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "345 + 200 = 545"
            say: "Bei einer Plusaufgabe heißen die Zahlen, die du zusammenrechnest, Summanden. Dreihundertfünfundvierzig und zweihundert sind die Summanden."
          - text: "545 ist die Summe."
            say: "Das Ergebnis heißt Summe. Fünfhundertfünfundvierzig ist die Summe von dreihundertfünfundvierzig und zweihundert. Plus rechnen heißt auch addieren."
          - text: "die Summe von 300 und 400: 300 + 400 = 700"
            say: "Heißt es: Bilde die Summe von dreihundert und vierhundert, dann rechnest du dreihundert plus vierhundert. Die Summe ist siebenhundert."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißt 587 in 362 + 225 = 587?"
                say: "In dreihundertzweiundsechzig plus zweihundertfünfundzwanzig gleich fünfhundertsiebenundachtzig: Wie heißt fünfhundertsiebenundachtzig?"
                options: ["Summe", "Summand", "Differenz"]
                answer: "Summe"
                feedback:
                  "Summand": "Summanden sind die Zahlen, die du addierst: 362 und 225. Das Ergebnis heißt Summe."
                  "Differenz": "Differenz gehört zu minus. Das Ergebnis einer Plusaufgabe heißt Summe."
                hints:
                  - "Ist 587 das Ergebnis oder eine Zahl, die du addierst?"
                  - "Es ist das Ergebnis."
                  - "Das Ergebnis einer Plusaufgabe heißt Summe."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Bilde die Summe von 250 und 130."
                say: "Bilde die Summe von zweihundertfünfzig und hundertdreißig."
                answer: "380"
                hints:
                  - "Summe heißt: plus rechnen."
                  - "250 + 130."
                  - "380."
              - id: l1-f3
                type: multiple_choice
                text: "Welche Zahlen sind die Summanden? 418 + 73 = 491"
                say: "Vierhundertachtzehn plus dreiundsiebzig gleich vierhunderteinundneunzig. Welche Zahlen sind die Summanden?"
                options: ["418 und 73", "491", "418 und 491"]
                answer: "418 und 73"
                hints:
                  - "Summanden sind die Zahlen, die du addierst."
                  - "Sie stehen vor dem Gleichheitszeichen."
                  - "418 und 73."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Addieren heißt plus rechnen."
                say: "Addieren heißt plus rechnen. Stimmt das?"
                answer: true
                hints:
                  - "Denk an die Summe."
                  - "Beim Addieren rechnest du zusammen."
                  - "Ja."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Aufgabe hat die Summe 600?"
                say: "Welche Aufgabe hat die Summe sechshundert?"
                options: ["250 + 350", "650 − 50", "300 + 200"]
                answer: "250 + 350"
                feedback:
                  "650 − 50": "Das Ergebnis ist 600, aber bei minus heißt das Ergebnis Differenz, nicht Summe."
                  "300 + 200": "300 + 200 ist eine Plusaufgabe, aber ihre Summe ist 500."
                hints:
                  - "Eine Summe gehört zu einer Plusaufgabe."
                  - "Welche Plusaufgabe ergibt 600?"
                  - "250 + 350 = 600."
              - id: l1-f6
                type: fill_in_blank
                text: "Die Summanden sind 240 und 315. Wie groß ist die Summe?"
                say: "Die Summanden sind zweihundertvierzig und dreihundertfünfzehn. Wie groß ist die Summe?"
                frame: "240 + 315 = _"
                options: ["555", "75", "545"]
                answer: ["555"]
                hints:
                  - "Summe heißt: Summanden addieren."
                  - "240 + 300 = 540, dann noch 15."
                  - "555."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie heißt 156 in 156 + 300 = 456?"
                say: "In hundertsechsundfünfzig plus dreihundert gleich vierhundertsechsundfünfzig: Wie heißt hundertsechsundfünfzig?"
                options: ["Summand", "Summe", "Differenz"]
                answer: "Summand"
                hints: ["Ist 156 das Ergebnis oder eine der Zahlen, die du addierst?"]
              - id: l1-s2
                type: text_input
                text: "Bilde die Summe von 405 und 270."
                say: "Bilde die Summe von vierhundertfünf und zweihundertsiebzig."
                answer: "675"
                hints: ["Was rechnest du bei einer Summe?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? In 520 + 180 = 700 ist 700 ein Summand."
                say: "In fünfhundertzwanzig plus hundertachtzig gleich siebenhundert ist siebenhundert ein Summand. Stimmt das?"
                answer: false
                hints: ["Wie heißt das Ergebnis einer Plusaufgabe?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Aufgabe hat die Summe 900?"
                say: "Welche Aufgabe hat die Summe neunhundert?"
                options: ["450 + 450", "950 − 50", "400 + 400"]
                answer: "450 + 450"
                hints: ["Zu welcher Rechenart gehört eine Summe?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Die Summe ist 800, ein Summand ist 350. Wie heißt der andere Summand?"
                say: "Die Summe ist achthundert, ein Summand ist dreihundertfünfzig. Wie heißt der andere Summand?"
                frame: "350 + _ = 800"
                options: ["450", "1150", "550"]
                answer: ["450"]
                hints: ["Ergänze bis zur Summe."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie heißt 920 in 610 + 310 = 920?"
                say: "In sechshundertzehn plus dreihundertzehn gleich neunhundertzwanzig: Wie heißt neunhundertzwanzig?"
                options: ["Summe", "Summand", "Differenz"]
                answer: "Summe"
              - id: l1-n2
                type: text_input
                text: "Bilde die Summe von 128 und 600."
                say: "Bilde die Summe von hundertachtundzwanzig und sechshundert."
                answer: "728"
              - id: l1-n3
                type: true_false
                text: "Stimmt das? 330 und 470 sind die Summanden von 330 + 470 = 800."
                say: "Dreihundertdreißig und vierhundertsiebzig sind die Summanden von dreihundertdreißig plus vierhundertsiebzig gleich achthundert. Stimmt das?"
                answer: true
              - id: l1-n4
                type: fill_in_blank
                text: "Die Summe ist 1000, ein Summand ist 625. Wie heißt der andere Summand?"
                say: "Die Summe ist tausend, ein Summand ist sechshundertfünfundzwanzig. Wie heißt der andere Summand?"
                frame: "625 + _ = 1000"
                options: ["375", "475", "1625"]
                answer: ["375"]
              - id: l1-n5
                type: multiple_choice
                text: "Welche Zahlen sind die Summanden? 507 + 88 = 595"
                say: "Fünfhundertsieben plus achtundachtzig gleich fünfhundertfünfundneunzig. Welche Zahlen sind die Summanden?"
                options: ["507 und 88", "595", "88 und 595"]
                answer: "507 und 88"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie heißt 333 in 333 + 444 = 777?"
            say: "In dreihundertdreiunddreißig plus vierhundertvierundvierzig gleich siebenhundertsiebenundsiebzig: Wie heißt dreihundertdreiunddreißig?"
            options: ["Summand", "Summe", "Differenz"]
            answer: "Summand"
          - id: l1-c2
            type: text_input
            text: "Bilde die Summe von 290 und 360."
            say: "Bilde die Summe von zweihundertneunzig und dreihundertsechzig."
            answer: "650"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Die Summe von 400 und 150 ist 550."
            say: "Die Summe von vierhundert und hundertfünfzig ist fünfhundertfünfzig. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Minuend, Subtrahend und Differenz", en: "Minuend, subtrahend and difference" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie heißt 650 in 400 + 250 = 650?"
            say: "In vierhundert plus zweihundertfünfzig gleich sechshundertfünfzig: Wie heißt sechshundertfünfzig?"
            options: ["Summe", "Summand", "Differenz"]
            answer: "Summe"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Bilde die Summe von 330 und 220."
            say: "Bilde die Summe von dreihundertdreißig und zweihundertzwanzig."
            answer: "550"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "735 − 210 = 525"
            say: "Bei einer Minusaufgabe heißt das Ergebnis Differenz. Fünfhundertfünfundzwanzig ist die Differenz von siebenhundertfünfunddreißig und zweihundertzehn. Minus rechnen heißt auch subtrahieren."
          - text: "Minuend 735 · Subtrahend 210 · Differenz 525"
            say: "Die erste Zahl, von der du wegnimmst, heißt Minuend: siebenhundertfünfunddreißig. Die Zahl, die du wegnimmst, heißt Subtrahend: zweihundertzehn."
          - text: "die Differenz von 900 und 300: 900 − 300 = 600"
            say: "Heißt es: Bilde die Differenz von neunhundert und dreihundert, dann rechnest du neunhundert minus dreihundert. Die erste Zahl ist der Minuend. Die Differenz ist sechshundert."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie heißt 470 in 820 − 350 = 470?"
                say: "In achthundertzwanzig minus dreihundertfünfzig gleich vierhundertsiebzig: Wie heißt vierhundertsiebzig?"
                options: ["Differenz", "Summe", "Subtrahend"]
                answer: "Differenz"
                feedback:
                  "Summe": "Summe gehört zu plus. Das Ergebnis einer Minusaufgabe heißt Differenz."
                  "Subtrahend": "Der Subtrahend ist die Zahl, die du wegnimmst: 350."
                hints:
                  - "Ist 470 das Ergebnis?"
                  - "Ja. Es ist eine Minusaufgabe."
                  - "Das Ergebnis einer Minusaufgabe heißt Differenz."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Bilde die Differenz von 640 und 220."
                say: "Bilde die Differenz von sechshundertvierzig und zweihundertzwanzig."
                answer: "420"
                hints:
                  - "Differenz heißt: minus rechnen."
                  - "640 − 220."
                  - "420."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Zahl ist der Subtrahend? 905 − 380 = 525"
                say: "Neunhundertfünf minus dreihundertachtzig gleich fünfhundertfünfundzwanzig. Welche Zahl ist der Subtrahend?"
                options: ["380", "905", "525"]
                answer: "380"
                feedback:
                  "905": "905 ist der Minuend, die Zahl, von der du wegnimmst."
                  "525": "525 ist das Ergebnis, die Differenz."
                hints:
                  - "Der Subtrahend ist die Zahl, die du wegnimmst."
                  - "Sie steht nach dem Minuszeichen."
                  - "380."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Subtrahieren heißt minus rechnen."
                say: "Subtrahieren heißt minus rechnen. Stimmt das?"
                answer: true
                hints:
                  - "Denk an den Subtrahenden."
                  - "Beim Subtrahieren nimmst du weg."
                  - "Ja."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Zahl ist der Minuend? 760 − 125 = 635"
                say: "Siebenhundertsechzig minus hundertfünfundzwanzig gleich sechshundertfünfunddreißig. Welche Zahl ist der Minuend?"
                options: ["760", "125", "635"]
                answer: "760"
                hints:
                  - "Der Minuend ist die Zahl, von der du wegnimmst."
                  - "Er steht ganz vorne."
                  - "760."
              - id: l2-f6
                type: multiple_choice
                text: "Bilde die Differenz von 500 und 180. Was rechnest du?"
                say: "Bilde die Differenz von fünfhundert und hundertachtzig. Was rechnest du?"
                options: ["500 − 180", "500 + 180", "180 − 500"]
                answer: "500 − 180"
                feedback:
                  "500 + 180": "Differenz heißt minus rechnen, nicht plus."
                  "180 − 500": "Die erste genannte Zahl ist der Minuend: 500 − 180."
                hints:
                  - "Differenz heißt minus."
                  - "Die erste Zahl ist der Minuend."
                  - "500 − 180."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie heißt 290 in 290 + 410 = 700?"
                say: "In zweihundertneunzig plus vierhundertzehn gleich siebenhundert: Wie heißt zweihundertneunzig?"
                options: ["Summand", "Differenz", "Subtrahend"]
                answer: "Summand"
                hints: ["Ist das eine Plus- oder eine Minusaufgabe?"]
              - id: l2-s2
                type: text_input
                text: "Bilde die Differenz von 875 und 430."
                say: "Bilde die Differenz von achthundertfünfundsiebzig und vierhundertdreißig."
                answer: "445"
                hints: ["Was rechnest du bei einer Differenz?"]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Zahl ist der Subtrahend? 612 − 208 = 404"
                say: "Sechshundertzwölf minus zweihundertacht gleich vierhundertvier. Welche Zahl ist der Subtrahend?"
                options: ["208", "612", "404"]
                answer: "208"
                hints: ["Welche Zahl wird weggenommen?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? In 760 − 340 = 420 ist 340 der Minuend."
                say: "In siebenhundertsechzig minus dreihundertvierzig gleich vierhundertzwanzig ist dreihundertvierzig der Minuend. Stimmt das?"
                answer: false
                hints: ["Von welcher Zahl wird weggenommen?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Aufgabe hat die Differenz 250?"
                say: "Welche Aufgabe hat die Differenz zweihundertfünfzig?"
                options: ["700 − 450", "100 + 150", "500 − 350"]
                answer: "700 − 450"
                hints: ["Zu welcher Rechenart gehört eine Differenz?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie heißt 365 in 365 − 120 = 245?"
                say: "In dreihundertfünfundsechzig minus hundertzwanzig gleich zweihundertfünfundvierzig: Wie heißt dreihundertfünfundsechzig?"
                options: ["Minuend", "Subtrahend", "Differenz"]
                answer: "Minuend"
              - id: l2-n2
                type: text_input
                text: "Bilde die Differenz von 1000 und 650."
                say: "Bilde die Differenz von tausend und sechshundertfünfzig."
                answer: "350"
              - id: l2-n3
                type: multiple_choice
                text: "Bilde die Differenz von 430 und 270. Was rechnest du?"
                say: "Bilde die Differenz von vierhundertdreißig und zweihundertsiebzig. Was rechnest du?"
                options: ["430 − 270", "270 − 430", "430 + 270"]
                answer: "430 − 270"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? Die Differenz von 800 und 350 ist 450."
                say: "Die Differenz von achthundert und dreihundertfünfzig ist vierhundertfünfzig. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welche Zahl ist der Subtrahend? 940 − 515 = 425"
                say: "Neunhundertvierzig minus fünfhundertfünfzehn gleich vierhundertfünfundzwanzig. Welche Zahl ist der Subtrahend?"
                options: ["425", "515", "940"]
                answer: "515"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie heißt 214 in 586 + 214 = 800?"
            say: "In fünfhundertsechsundachtzig plus zweihundertvierzehn gleich achthundert: Wie heißt zweihundertvierzehn?"
            options: ["Summand", "Summe", "Minuend"]
            answer: "Summand"
          - id: l2-c2
            type: text_input
            text: "Bilde die Differenz von 730 und 290."
            say: "Bilde die Differenz von siebenhundertdreißig und zweihundertneunzig."
            answer: "440"
          - id: l2-c3
            type: multiple_choice
            text: "Welche Zahl ist der Minuend? 815 − 460 = 355"
            say: "Achthundertfünfzehn minus vierhundertsechzig gleich dreihundertfünfundfünfzig. Welche Zahl ist der Minuend?"
            options: ["815", "460", "355"]
            answer: "815"
          - id: l2-c4
            type: text_input
            text: "Bilde die Summe von 455 und 345."
            say: "Bilde die Summe von vierhundertfünfundfünfzig und dreihundertfünfundvierzig."
            answer: "800"
          - id: l2-c5
            type: true_false
            text: "Stimmt das? In 600 − 240 = 360 ist 240 der Subtrahend."
            say: "In sechshundert minus zweihundertvierzig gleich dreihundertsechzig ist zweihundertvierzig der Subtrahend. Stimmt das?"
            answer: true
