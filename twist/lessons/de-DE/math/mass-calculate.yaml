# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.mass-calculate
skill: math.mass-capacity.calculate-mass
curriculum: de-DE
language: de
title:
  de: Mit Gewichten rechnen
  en: Calculating with mass
summary: >
  Lesson 1 writes masses in different ways, with three places after the
  comma for the gram (1,5 kg = 1 kg 500 g = 1500 g, 2,05 kg = 2050 g) and
  meets the Tonne (2,5 t = 2500 kg); lesson 2 adds, subtracts and
  multiplies masses in shopping, parcel and lift stories, always in one
  unit first, and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Gewichte, en: Mass }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mass-capacity.estimate-mass, math.length.notation]
  also_practises: [math.mass-capacity.g-kg, math.length.notation]
  vocabulary: { de: [Gramm, Kilogramm, Tonne, Kommaschreibweise, schwerer, leichter, höchstens] }
  forms: [text, audio]
  drawn: []
  facets: [number-format, units]
  misconceptions:
    - id: grams-after-comma
      what: Reads the digits after the comma as grams as they stand (2,5 kg = 2005 g, 1,3 kg = 1 kg 3 g)
      addressed: lesson 1 Learn writes 1,5 kg as 1,500 kg; every stage of lesson 1 offers the misread mass, with feedback in l1-f1
    - id: mixed-units-added
      what: Adds kg and g as they stand (1,2 kg + 800 g = 801,2 g), or turns 800 g into 0,08 kg
      addressed: lesson 2 Learn changes everything to grams first; l2-f1, l2-s4 and l2-n1 offer the unconverted sum, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gewichte mit Komma", en: "Masses with decimals" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was wiegt ungefähr 1 kg?"
            say: "Was wiegt ungefähr ein Kilogramm?"
            options: ["eine Packung Mehl", "ein Apfel", "ein Fahrrad"]
            answer: "eine Packung Mehl"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "1 kg = _ g"
            say: "Ein Kilogramm sind wie viele Gramm?"
            options: ["1000", "100", "10"]
            answer: "1000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1,5 kg = 1,500 kg = 1 kg 500 g = 1500 g"
            say: "Gewichte kannst du mit Komma schreiben, so wie Längen in Kilometern. Ein Kilogramm hat tausend Gramm. Darum stehen nach dem Komma drei Stellen für die Gramm. Eins Komma fünf Kilogramm sind ein Kilogramm und fünfhundert Gramm."
          - text: "0,25 kg = 250 g\n2,05 kg = 2050 g\n2,005 kg = 2005 g"
            say: "Ein Stück Butter wiegt zweihundertfünfzig Gramm, also kein ganzes Kilogramm. Darum steht vor dem Komma eine Null. Achte auch auf die Nullen nach dem Komma. Zwei Kilogramm und fünfzig Gramm sind zweitausendfünfzig Gramm. Dann steht hinter dem Komma zuerst eine Null. Zwei Kilogramm und fünf Gramm sind zweitausendfünf Gramm. Dann stehen zwei Nullen vor der Fünf."
          - text: "1 t = 1000 kg\n2,5 t = 2500 kg"
            say: "Für sehr schwere Dinge gibt es die Tonne. Eine Tonne hat tausend Kilogramm. Ein kleines Auto wiegt ungefähr eine Tonne. Auch hier stehen nach dem Komma drei Stellen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "2,5 kg = _"
                say: "Zwei Komma fünf Kilogramm sind wie viele Gramm?"
                options: ["2500 g", "2005 g", "250 g"]
                answer: "2500 g"
                feedback:
                  "2005 g": "2,5 kg sind 2,500 kg. Nach dem Komma stehen 500 Gramm, nicht 5."
                hints:
                  - "Nach dem Komma stehen drei Stellen für die Gramm."
                  - "2,5 kg = 2,500 kg = 2 kg 500 g."
                  - "2500 g."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Schreib mit Komma."
                say: "Ein Kilogramm und siebenhundertfünfzig Gramm. Schreib das Gewicht mit Komma."
                frame: "1 kg 750 g = _ kg"
                options: ["1,75", "1,075", "17,5"]
                answer: ["1,75"]
                hints:
                  - "Vor das Komma kommen die Kilogramm."
                  - "750 g sind 0,750 kg. Die Null am Ende kannst du weglassen."
                  - "1,75 kg."
              - id: l1-f3
                type: multiple_choice
                text: "0,5 kg = _"
                say: "Null Komma fünf Kilogramm sind wie viele Gramm?"
                options: ["500 g", "5 g", "50 g"]
                answer: "500 g"
                hints:
                  - "0,5 kg ist ein halbes Kilogramm."
                  - "Die Hälfte von 1000 g."
                  - "500 g."
              - id: l1-f4
                type: matching
                text: "Was ist gleich schwer?"
                say: "Verbinde die Gewichte, die gleich schwer sind."
                pairs:
                  - { left: { text: "3,2 kg" }, right: { text: "3200 g" } }
                  - { left: { text: "3,02 kg" }, right: { text: "3020 g" } }
                  - { left: { text: "3,002 kg" }, right: { text: "3002 g" } }
                hints:
                  - "Schreib jedes Gewicht mit drei Stellen nach dem Komma."
                  - "3,2 kg = 3,200 kg. 3,02 kg = 3,020 kg."
                  - "3,2 kg und 3200 g, 3,02 kg und 3020 g, 3,002 kg und 3002 g."
              - id: l1-f5
                type: multiple_choice
                text: "Ein Elefant wiegt 4500 kg. Wie viele Tonnen sind das?"
                say: "Ein Elefant wiegt viertausendfünfhundert Kilogramm. Wie viele Tonnen sind das?"
                options: ["4,5 t", "45 t", "4,05 t"]
                answer: "4,5 t"
                hints:
                  - "1000 kg sind 1 t."
                  - "4500 kg = 4 t 500 kg."
                  - "4,5 t."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "4,25 kg = _"
                say: "Wie viele Gramm sind das?"
                options: ["4250 g", "4025 g", "425 g"]
                answer: "4250 g"
                hints: ["4,25 kg = 4,250 kg."]
              - id: l1-s2
                type: fill_in_blank
                text: "3600 g = _ kg _ g"
                say: "Dreitausendsechshundert Gramm. Wie viele Kilogramm und Gramm sind das?"
                frame: "3600 g = _ kg _ g"
                options: ["3", "600", "36", "60"]
                answer: ["3", "600"]
                hints: ["3000 g sind 3 kg."]
              - id: l1-s3
                type: multiple_choice
                text: "Was ist schwerer: 1,2 kg oder 1150 g?"
                say: "Was ist schwerer: eins Komma zwei Kilogramm oder tausendhundertfünfzig Gramm?"
                options: ["1,2 kg", "1150 g", "Beide sind gleich schwer."]
                answer: "1,2 kg"
                hints: ["Rechne 1,2 kg in Gramm um."]
              - id: l1-s4
                type: true_false
                text: "0,1 kg = 100 g. Stimmt das?"
                say: "Null Komma eins Kilogramm sind hundert Gramm. Stimmt das?"
                answer: true
                hints: ["0,1 kg = 0,100 kg."]
              - id: l1-s5
                type: multiple_choice
                text: "Ein Lkw wiegt 7,5 t. Wie viele Kilogramm sind das?"
                say: "Ein Lastwagen wiegt sieben Komma fünf Tonnen. Wie viele Kilogramm sind das?"
                options: ["7500 kg", "7005 kg", "750 kg"]
                answer: "7500 kg"
                hints: ["7,5 t = 7,500 t."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "6,8 kg = _"
                say: "Sechs Komma acht Kilogramm sind wie viele Gramm?"
                options: ["6800 g", "6008 g", "680 g"]
                answer: "6800 g"
              - id: l1-n2
                type: fill_in_blank
                text: "Schreib mit Komma."
                say: "Zweitausendvierzig Gramm. Schreib das Gewicht in Kilogramm mit Komma."
                frame: "2040 g = _ kg"
                options: ["2,04", "2,4", "20,4"]
                answer: ["2,04"]
              - id: l1-n3
                type: multiple_choice
                text: "Welches Gewicht ist am leichtesten?"
                say: "Welches Gewicht ist am leichtesten?"
                options: ["0,8 kg", "850 g", "1,1 kg"]
                answer: "0,8 kg"
              - id: l1-n4
                type: true_false
                text: "1,3 kg = 1 kg 3 g. Stimmt das?"
                say: "Eins Komma drei Kilogramm sind ein Kilogramm und drei Gramm. Stimmt das?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Ein Stück Butter wiegt ..."
                say: "Wie viel wiegt ein Stück Butter? Welches Gewicht passt?"
                options: ["0,25 kg", "2,5 kg", "25 kg"]
                answer: "0,25 kg"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "3,75 kg = _"
            say: "Wie viele Gramm sind das?"
            options: ["3750 g", "3075 g", "375 g"]
            answer: "3750 g"
          - id: l1-c2
            type: fill_in_blank
            text: "Schreib mit Komma."
            say: "Fünf Kilogramm und achtzig Gramm. Schreib das Gewicht mit Komma."
            frame: "5 kg 80 g = _ kg"
            options: ["5,08", "5,8", "5,008"]
            answer: ["5,08"]
          - id: l1-c3
            type: true_false
            text: "2 t = 2000 kg. Stimmt das?"
            say: "Zwei Tonnen sind zweitausend Kilogramm. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Sachaufgaben mit Gewichten", en: "Mass word problems" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "1,5 kg = _"
            say: "Eins Komma fünf Kilogramm sind wie viele Gramm?"
            options: ["1500 g", "1005 g", "150 g"]
            answer: "1500 g"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "750 g + 250 g = _"
            say: "Siebenhundertfünfzig Gramm plus zweihundertfünfzig Gramm."
            options: ["1 kg", "1000 kg", "10 kg"]
            answer: "1 kg"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mama kauft 2,5 kg Kartoffeln und 750 g Äpfel.\n2500 g + 750 g = 3250 g = 3,25 kg"
            say: "Mama kauft zwei Komma fünf Kilogramm Kartoffeln und siebenhundertfünfzig Gramm Äpfel. Wie schwer ist ihre Tasche? Zuerst rechnest du beides in Gramm: zweitausendfünfhundert plus siebenhundertfünfzig sind dreitausendzweihundertfünfzig Gramm. Das sind drei Kilogramm und zweihundertfünfzig Gramm."
          - text: "Ein Paket darf höchstens 5 kg wiegen.\n3,4 kg Bücher + 1800 g Spiele\n3400 g + 1800 g = 5200 g\nZu schwer!"
            say: "Ein Paket darf höchstens fünf Kilogramm wiegen. Darin sind Bücher mit drei Komma vier Kilogramm und Spiele mit tausendachthundert Gramm. Zusammen sind das fünftausendzweihundert Gramm. Das ist mehr als fünftausend Gramm. Das Paket ist zu schwer."
          - text: "1. Alles in eine Einheit\n2. Rechnen\n3. Antwort mit der passenden Einheit"
            say: "So gehst du vor: Bring alle Gewichte in dieselbe Einheit. Dann rechnest du. Zum Schluss gibst du die Antwort in einer Einheit, die gut passt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ein Brot wiegt 1,2 kg. Mama kauft noch 800 g Käse. Wie schwer ist der Einkauf?"
                say: "Ein Brot wiegt eins Komma zwei Kilogramm. Mama kauft noch achthundert Gramm Käse. Wie schwer ist der Einkauf zusammen?"
                options: ["2 kg", "801,2 g", "1,28 kg"]
                answer: "2 kg"
                feedback:
                  "801,2 g": "Du hast Kilogramm und Gramm einfach zusammengezählt. Rechne zuerst 1,2 kg in Gramm um: 1200 g."
                  "1,28 kg": "800 g sind 0,8 kg, nicht 0,08 kg."
                hints:
                  - "Bring beide Gewichte in Gramm."
                  - "1200 g + 800 g = 2000 g."
                  - "2 kg."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ein Sack Mehl wiegt 5 kg. Der Bäcker nimmt 1,75 kg heraus. Wie viel Mehl bleibt im Sack?"
                say: "Ein Sack Mehl wiegt fünf Kilogramm. Der Bäcker nimmt ein Kilogramm und siebenhundertfünfzig Gramm heraus. Wie viel Mehl bleibt im Sack?"
                options: ["3,25 kg", "3,75 kg", "4,25 kg"]
                answer: "3,25 kg"
                hints:
                  - "Rechne in Gramm: 5000 g − 1750 g."
                  - "5000 − 1000 = 4000, dann noch 750 weg."
                  - "3250 g = 3,25 kg."
              - id: l2-f3
                type: true_false
                text: "Ein Koffer darf 20 kg wiegen. Darin sind 12,5 kg Kleidung und 6800 g Schuhe. Ist er zu schwer?"
                say: "Ein Koffer darf zwanzig Kilogramm wiegen. Darin sind zwölf Komma fünf Kilogramm Kleidung und sechstausendachthundert Gramm Schuhe. Ist er zu schwer?"
                answer: false
                hints:
                  - "Rechne beides in Gramm um."
                  - "12 500 g + 6800 g = 19 300 g."
                  - "Nein, er wiegt 19,3 kg."
              - id: l2-f4
                type: multiple_choice
                text: "Eine Dose Mais wiegt 340 g. Wie schwer sind 5 Dosen?"
                say: "Eine Dose Mais wiegt dreihundertvierzig Gramm. Wie schwer sind fünf Dosen?"
                options: ["1,7 kg", "1,07 kg", "17 kg"]
                answer: "1,7 kg"
                hints:
                  - "Rechne zuerst in Gramm: 5 · 340 g."
                  - "5 · 340 g = 1700 g."
                  - "1,7 kg."
              - id: l2-f5
                type: multiple_choice
                text: "Ein Pferd wiegt 600 kg. Ein Anhänger trägt höchstens 1,5 t. Wie viele Pferde dürfen höchstens hinein?"
                say: "Ein Pferd wiegt sechshundert Kilogramm. Ein Anhänger trägt höchstens eins Komma fünf Tonnen. Wie viele Pferde dürfen höchstens hinein?"
                options: ["2", "3", "25"]
                answer: "2"
                hints:
                  - "Rechne 1,5 t in Kilogramm um."
                  - "1500 kg. 2 Pferde wiegen 1200 kg, 3 Pferde 1800 kg."
                  - "2 Pferde."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Eine Melone wiegt 2,4 kg, eine Ananas 1,3 kg. Wie viel schwerer ist die Melone?"
                say: "Eine Melone wiegt zwei Komma vier Kilogramm, eine Ananas eins Komma drei Kilogramm. Wie viel schwerer ist die Melone?"
                options: ["1,1 kg", "3,7 kg", "1,01 kg"]
                answer: "1,1 kg"
                hints: ["2400 g − 1300 g."]
              - id: l2-s2
                type: multiple_choice
                text: "Für einen Kuchen braucht Opa 375 g Mehl. Er hat 1 kg Mehl. Wie viel bleibt übrig?"
                say: "Für einen Kuchen braucht Opa dreihundertfünfundsiebzig Gramm Mehl. Er hat ein Kilogramm Mehl. Wie viel bleibt übrig?"
                options: ["625 g", "735 g", "1375 g"]
                answer: "625 g"
                hints: ["1 kg sind 1000 g."]
              - id: l2-s3
                type: true_false
                text: "4 Tüten Zucker zu je 500 g wiegen zusammen 2 kg. Stimmt das?"
                say: "Vier Tüten Zucker zu je fünfhundert Gramm wiegen zusammen zwei Kilogramm. Stimmt das?"
                answer: true
                hints: ["4 · 500 g = 2000 g."]
              - id: l2-s4
                type: multiple_choice
                text: "Ein Hund wiegt 18,5 kg. Er nimmt 1500 g zu. Wie schwer ist er dann?"
                say: "Ein Hund wiegt achtzehn Komma fünf Kilogramm. Er nimmt tausendfünfhundert Gramm zu. Wie schwer ist er dann?"
                options: ["20 kg", "1518,5 kg", "18,65 kg"]
                answer: "20 kg"
                hints: ["1500 g sind 1,5 kg."]
              - id: l2-s5
                type: multiple_choice
                text: "Ein Aufzug trägt 1 t. 12 Leute wiegen je ungefähr 75 kg. Dürfen alle hinein?"
                say: "Ein Aufzug trägt eine Tonne. Zwölf Leute wiegen je ungefähr fünfundsiebzig Kilogramm. Dürfen alle hinein?"
                options: ["Ja, es sind ungefähr 900 kg.", "Nein, es sind ungefähr 1,2 t.", "Ja, es sind ungefähr 87 kg."]
                answer: "Ja, es sind ungefähr 900 kg."
                hints: ["12 · 75 kg. 1 t sind 1000 kg."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ein Paket wiegt 2,75 kg, ein zweites 1500 g. Wie schwer sind beide zusammen?"
                say: "Ein Paket wiegt zwei Kilogramm und siebenhundertfünfzig Gramm, ein zweites tausendfünfhundert Gramm. Wie schwer sind beide zusammen?"
                options: ["4,25 kg", "2,9 kg", "1502,75 g"]
                answer: "4,25 kg"
              - id: l2-n2
                type: multiple_choice
                text: "Ein Glas Honig wiegt 500 g. Wie viele Gläser wiegen zusammen 3 kg?"
                say: "Ein Glas Honig wiegt fünfhundert Gramm. Wie viele Gläser wiegen zusammen drei Kilogramm?"
                options: ["6", "15", "60"]
                answer: "6"
              - id: l2-n3
                type: true_false
                text: "Papa kauft 3 kg Äpfel. Für einen Kuchen braucht er 1,8 kg. Bleiben 1,2 kg übrig?"
                say: "Papa kauft drei Kilogramm Äpfel. Für einen Kuchen braucht er eins Komma acht Kilogramm. Bleiben eins Komma zwei Kilogramm übrig?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Ein Lkw hat 3,2 t Sand geladen. Er kippt 1800 kg ab. Wie viel Sand ist noch darauf?"
                say: "Ein Lastwagen hat drei Komma zwei Tonnen Sand geladen. Er kippt tausendachthundert Kilogramm ab. Wie viel Sand ist noch darauf?"
                options: ["1,4 t", "1,8 t", "5 t"]
                answer: "1,4 t"
              - id: l2-n5
                type: multiple_choice
                text: "Eine Tafel Schokolade wiegt 100 g. Wie viele Tafeln wiegen zusammen 1,5 kg?"
                say: "Eine Tafel Schokolade wiegt hundert Gramm. Wie viele Tafeln wiegen zusammen eins Komma fünf Kilogramm?"
                options: ["15", "150", "5"]
                answer: "15"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "4,6 kg = _"
            say: "Vier Komma sechs Kilogramm sind wie viele Gramm?"
            options: ["4600 g", "4006 g", "460 g"]
            answer: "4600 g"
          - id: l2-c2
            type: multiple_choice
            text: "Ein Korb mit Pilzen wiegt 1,3 kg. Der leere Korb wiegt 450 g. Wie schwer sind die Pilze?"
            say: "Ein Korb mit Pilzen wiegt eins Komma drei Kilogramm. Der leere Korb wiegt vierhundertfünfzig Gramm. Wie schwer sind die Pilze?"
            options: ["850 g", "1,75 kg", "950 g"]
            answer: "850 g"
          - id: l2-c3
            type: fill_in_blank
            text: "Schreib mit Komma."
            say: "Zwei Kilogramm und fünf Gramm. Schreib das Gewicht mit Komma."
            frame: "2 kg 5 g = _ kg"
            options: ["2,005", "2,05", "2,5"]
            answer: ["2,005"]
          - id: l2-c4
            type: true_false
            text: "Ein Paket darf 10 kg wiegen. Darin sind 4,5 kg und 5600 g. Ist es zu schwer?"
            say: "Ein Paket darf zehn Kilogramm wiegen. Darin sind vier Komma fünf Kilogramm und fünftausendsechshundert Gramm. Ist es zu schwer?"
            answer: true
          - id: l2-c5
            type: multiple_choice
            text: "Eine Packung Nudeln wiegt 250 g. Wie schwer sind 8 Packungen?"
            say: "Eine Packung Nudeln wiegt zweihundertfünfzig Gramm. Wie schwer sind acht Packungen?"
            options: ["2 kg", "20 kg", "0,2 kg"]
            answer: "2 kg"
