# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.mass-estimate
skill: math.mass-capacity.estimate-mass
curriculum: de-DE
language: de
title:
  de: Gewichte schätzen
  en: Estimating mass
summary: >
  Lesson 1 learns benchmarks to compare with (eine Büroklammer etwa 1 g,
  eine Packung Nudeln 500 g, eine Packung Mehl 1 kg) and estimates fruit,
  eggs, pets and a school bag with them; lesson 2 learns 1 t = 1000 kg
  with a small car as the benchmark, picks g, kg or t for a thing,
  changes between t and kg, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Gewichte, en: Mass }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mass-capacity.g-kg]
  also_practises: [math.mass-capacity.g-kg]
  vocabulary: { de: [schätzen, ungefähr, etwa, Gramm, Kilogramm, Tonne, t] }
  forms: [text, audio]
  drawn: []
  facets: [units]
  misconceptions:
    - id: no-feel-for-units
      what: Estimates with the wrong unit because the size of a gram or a kilogram is not felt (a child of 30 g, an elephant of 5 kg)
      addressed: lesson 1 Learn sets the benchmarks 1 g, 500 g and 1 kg; l1-f3 has feedback on 30 g for a child, l1-f4, l1-n4 and l1-c3 give claims in the wrong unit, l2-f3 has feedback on a lorry in kg, l2-f5 claims an elephant of 5 kg
    - id: t-as-hundred
      what: Thinks 1 t = 100 kg, or writes 1 t 200 kg as 120 kg or 1020 kg
      addressed: lesson 2 Learn builds 1500 kg from 1000 kg and 500 kg; l2-f4 has feedback on 120 kg and 1020 kg, l2-s4, l2-n5 and l2-c4 change mixed t and kg
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit Stützpunkten schätzen", en: "Estimating with benchmarks" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "2 kg = _ g"
            say: "Wie viele Gramm sind zwei Kilogramm?"
            answer: "2000"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "1 kg 500 g = _ g"
            say: "Wie viele Gramm sind ein Kilogramm und fünfhundert Gramm?"
            options: ["1500 g", "1050 g", "150 g"]
            answer: "1500 g"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "etwa 1 g: eine Büroklammer"
            say: "Merk dir ein paar Gewichte, mit denen du vergleichen kannst. Eine Büroklammer wiegt etwa ein Gramm. Ein Gummibärchen wiegt etwa zwei Gramm."
          - text: "500 g: eine Packung Nudeln\n1 kg: eine Packung Mehl"
            say: "Eine Packung Nudeln wiegt fünfhundert Gramm, also ein halbes Kilogramm. Eine Packung Mehl wiegt ein Kilogramm."
          - text: "Ein Apfel wiegt etwa 150 g."
            say: "So schätzt du: Ein Apfel ist viel schwerer als eine Büroklammer, aber leichter als eine Packung Nudeln. Er wiegt etwa hundertfünfzig Gramm. Drei Äpfel wiegen ungefähr ein halbes Kilogramm."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie schwer ist eine Banane ungefähr?"
                say: "Wie schwer ist eine Banane ungefähr?"
                options: ["etwa 150 g", "etwa 15 kg", "etwa 1 g"]
                answer: "etwa 150 g"
                hints:
                  - "Vergleiche mit einer Packung Nudeln. Sie wiegt 500 g."
                  - "Eine Banane ist leichter als die Nudeln, aber viel schwerer als eine Büroklammer."
                  - "Etwa 150 g."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was wiegt etwa 1 kg?"
                say: "Was wiegt etwa ein Kilogramm?"
                options: ["eine Packung Zucker", "ein Radiergummi", "ein Fahrrad"]
                answer: "eine Packung Zucker"
                hints:
                  - "1 kg wiegt eine Packung Mehl."
                  - "Was ist ungefähr so schwer wie eine Packung Mehl?"
                  - "Eine Packung Zucker."
              - id: l1-f3
                type: multiple_choice
                text: "Wie schwer ist ein Kind in der 3. Klasse ungefähr?"
                say: "Wie schwer ist ein Kind in der dritten Klasse ungefähr?"
                options: ["etwa 30 kg", "etwa 30 g", "etwa 300 kg"]
                answer: "etwa 30 kg"
                feedback:
                  "etwa 30 g": "30 g wiegen etwa 30 Büroklammern. Ein Kind ist viel schwerer."
                  "etwa 300 kg": "300 kg wären so schwer wie 300 Packungen Mehl. Das ist viel zu schwer."
                hints:
                  - "Ein Kind ist viel schwerer als eine Packung Mehl."
                  - "Es wiegt so viel wie viele Packungen Mehl zusammen."
                  - "Etwa 30 kg."
              - id: l1-f4
                type: true_false
                text: "Ein Gummibärchen wiegt etwa 2 kg."
                say: "Stimmt das? Ein Gummibärchen wiegt etwa zwei Kilogramm."
                answer: false
                hints:
                  - "2 kg sind so schwer wie zwei Packungen Mehl."
                  - "Ein Gummibärchen ist so leicht wie zwei Büroklammern."
                  - "Nein. Es wiegt etwa 2 g."
              - id: l1-f5
                type: text_input
                text: "Eine Packung Nudeln wiegt 500 g. Wie viele Packungen wiegen zusammen 1 kg?"
                say: "Eine Packung Nudeln wiegt fünfhundert Gramm. Wie viele Packungen wiegen zusammen ein Kilogramm?"
                answer: "2"
                hints:
                  - "1 kg = 1000 g."
                  - "500 g + 500 g = 1000 g."
                  - "2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie schwer ist ein Ei ungefähr?"
                say: "Wie schwer ist ein Hühnerei ungefähr?"
                options: ["etwa 60 g", "etwa 6 kg", "etwa 600 g"]
                answer: "etwa 60 g"
                hints: ["Ein Ei ist leichter als ein Apfel."]
              - id: l1-s2
                type: multiple_choice
                text: "Was wiegt etwa so viel wie eine Packung Mehl?"
                say: "Was wiegt etwa so viel wie eine Packung Mehl?"
                options: ["eine Tüte Milch (1 Liter)", "eine Feder", "ein Auto"]
                answer: "eine Tüte Milch (1 Liter)"
                hints: ["Eine Packung Mehl wiegt 1 kg."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie schwer ist eine Katze ungefähr?"
                say: "Wie schwer ist eine Katze ungefähr?"
                options: ["etwa 4 kg", "etwa 4 g", "etwa 400 kg"]
                answer: "etwa 4 kg"
                hints: ["Eine Katze ist so schwer wie ein paar Packungen Mehl."]
              - id: l1-s4
                type: true_false
                text: "Ein Schulranzen mit Büchern wiegt etwa 4 kg."
                say: "Stimmt das? Ein Schulranzen mit Büchern wiegt etwa vier Kilogramm."
                answer: true
                hints: ["Stell dir vier Packungen Mehl im Ranzen vor."]
              - id: l1-s5
                type: multiple_choice
                text: "Ein Fußball wiegt etwa 400 _."
                say: "Welche Einheit passt? Ein Fußball wiegt etwa vierhundert ..."
                options: ["g", "kg"]
                answer: "g"
                hints: ["Ein Fußball ist leichter als eine Packung Nudeln."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie schwer ist eine Tafel Schokolade ungefähr?"
                say: "Wie schwer ist eine Tafel Schokolade ungefähr?"
                options: ["etwa 100 g", "etwa 100 kg", "etwa 10 g"]
                answer: "etwa 100 g"
              - id: l1-n2
                type: multiple_choice
                text: "Ein Hund wiegt etwa 20 _."
                say: "Welche Einheit passt? Ein Hund wiegt etwa zwanzig ..."
                options: ["kg", "g"]
                answer: "kg"
              - id: l1-n3
                type: text_input
                text: "Ein Ei wiegt etwa 60 g. Wie viel Gramm wiegen 10 Eier ungefähr?"
                say: "Ein Ei wiegt etwa sechzig Gramm. Wie viel Gramm wiegen zehn Eier ungefähr?"
                answer: "600"
              - id: l1-n4
                type: true_false
                text: "Eine Erdbeere wiegt etwa 1 kg."
                say: "Stimmt das? Eine Erdbeere wiegt etwa ein Kilogramm."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Ein Stück Butter wiegt 250 g. Wie viele Stück Butter wiegen 1 kg?"
                say: "Ein Stück Butter wiegt zweihundertfünfzig Gramm. Wie viele Stück Butter wiegen zusammen ein Kilogramm?"
                options: ["4", "2", "10"]
                answer: "4"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie schwer ist ein Apfel ungefähr?"
            say: "Wie schwer ist ein Apfel ungefähr?"
            options: ["etwa 150 g", "etwa 15 kg", "etwa 1 g"]
            answer: "etwa 150 g"
          - id: l1-c2
            type: multiple_choice
            text: "Ein Buch wiegt etwa 500 _."
            say: "Welche Einheit passt? Ein Buch wiegt etwa fünfhundert ..."
            options: ["g", "kg"]
            answer: "g"
          - id: l1-c3
            type: true_false
            text: "Ein Kind in der 3. Klasse wiegt etwa 3 kg."
            say: "Stimmt das? Ein Kind in der dritten Klasse wiegt etwa drei Kilogramm."
            answer: false

  - n: 2
    title: { de: "Die Tonne", en: "The tonne" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie schwer ist eine Packung Mehl?"
            say: "Wie schwer ist eine Packung Mehl?"
            options: ["1 kg", "1 g", "100 g"]
            answer: "1 kg"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ein Radiergummi wiegt etwa 20 _."
            say: "Welche Einheit passt? Ein Radiergummi wiegt etwa zwanzig ..."
            options: ["g", "kg"]
            answer: "g"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 t = 1000 kg"
            say: "Für sehr schwere Dinge gibt es die Tonne. Eine Tonne hat tausend Kilogramm. Ein kleines Auto wiegt etwa eine Tonne."
          - text: "2 t = 2000 kg\n1 t 500 kg = 1000 kg + 500 kg = 1500 kg"
            say: "Zwei Tonnen sind zweitausend Kilogramm. Eine Tonne und fünfhundert Kilogramm sind tausend Kilogramm und fünfhundert Kilogramm, zusammen tausendfünfhundert Kilogramm."
          - text: "g: leichte Dinge\nkg: schwere Dinge\nt: sehr schwere Dinge"
            say: "Leichte Dinge wie einen Brief wiegst du in Gramm. Schwere Dinge wie ein Kind wiegst du in Kilogramm. Sehr schwere Dinge wie einen Elefanten oder einen Lastwagen wiegst du in Tonnen. Ein Elefant wiegt etwa fünf Tonnen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "1 t = _ kg"
                say: "Wie viele Kilogramm hat eine Tonne?"
                options: ["1000", "100", "10"]
                answer: "1000"
                hints:
                  - "Wie bei 1 kg = 1000 g."
                  - "Eine Tonne hat tausend Kilogramm."
                  - "1000."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "3 t = _ kg"
                say: "Wie viele Kilogramm sind drei Tonnen?"
                answer: "3000"
                hints:
                  - "1 t = 1000 kg."
                  - "Dreimal 1000 kg."
                  - "3000."
              - id: l2-f3
                type: multiple_choice
                text: "Ein Lastwagen wiegt etwa 10 _."
                say: "Welche Einheit passt? Ein Lastwagen wiegt etwa zehn ..."
                options: ["t", "kg", "g"]
                answer: "t"
                feedback:
                  "kg": "10 kg wiegt etwa ein voller Eimer Wasser. Ein Lastwagen ist viel schwerer."
                hints:
                  - "Ein Lastwagen ist sehr schwer."
                  - "Er wiegt viel mehr als ein Auto. Ein Auto wiegt etwa 1 t."
                  - "t."
              - id: l2-f4
                type: multiple_choice
                text: "Ein Auto wiegt 1 t 200 kg. Wie viele kg sind das?"
                say: "Ein Auto wiegt eine Tonne und zweihundert Kilogramm. Wie viele Kilogramm sind das?"
                options: ["1200 kg", "1020 kg", "120 kg"]
                answer: "1200 kg"
                feedback:
                  "120 kg": "1 t sind 1000 kg, nicht 100 kg."
                  "1020 kg": "Zu den 1000 kg kommen 200 kg dazu, nicht 20 kg."
                hints:
                  - "1 t = 1000 kg."
                  - "1000 kg + 200 kg."
                  - "1200 kg."
              - id: l2-f5
                type: true_false
                text: "Ein Elefant wiegt etwa 5 kg."
                say: "Stimmt das? Ein Elefant wiegt etwa fünf Kilogramm."
                answer: false
                hints:
                  - "5 kg sind so schwer wie fünf Packungen Mehl."
                  - "Ein Elefant ist viel schwerer als ein Auto."
                  - "Nein. Er wiegt etwa 5 t."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "4000 kg = _ t"
                say: "Wie viele Tonnen sind viertausend Kilogramm?"
                answer: "4"
                hints: ["1000 kg sind 1 t."]
              - id: l2-s2
                type: multiple_choice
                text: "Ein Brief wiegt etwa 20 _."
                say: "Welche Einheit passt? Ein Brief wiegt etwa zwanzig ..."
                options: ["g", "kg", "t"]
                answer: "g"
                hints: ["Ein Brief ist sehr leicht."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie schwer ist ein Pferd ungefähr?"
                say: "Wie schwer ist ein Pferd ungefähr?"
                options: ["etwa 500 kg", "etwa 5 kg", "etwa 50 t"]
                answer: "etwa 500 kg"
                hints: ["Ein Pferd ist leichter als ein Auto, aber viel schwerer als ein Mensch."]
              - id: l2-s4
                type: true_false
                text: "2 t 500 kg = 2500 kg"
                say: "Stimmt das? Zwei Tonnen und fünfhundert Kilogramm sind zweitausendfünfhundert Kilogramm."
                answer: true
                hints: ["2 t sind 2000 kg."]
              - id: l2-s5
                type: multiple_choice
                text: "Was wiegt etwa 1 t?"
                say: "Was wiegt etwa eine Tonne?"
                options: ["ein kleines Auto", "ein Fahrrad", "ein Kühlschrank"]
                answer: "ein kleines Auto"
                hints: ["1 t = 1000 kg."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "6 t = _ kg"
                say: "Wie viele Kilogramm sind sechs Tonnen?"
                answer: "6000"
              - id: l2-n2
                type: multiple_choice
                text: "Ein Linienbus wiegt etwa 12 _."
                say: "Welche Einheit passt? Ein Linienbus wiegt etwa zwölf ..."
                options: ["t", "kg", "g"]
                answer: "t"
              - id: l2-n3
                type: multiple_choice
                text: "Wie schwer ist ein Fahrrad ungefähr?"
                say: "Wie schwer ist ein Fahrrad ungefähr?"
                options: ["etwa 15 kg", "etwa 15 g", "etwa 15 t"]
                answer: "etwa 15 kg"
              - id: l2-n4
                type: true_false
                text: "1 t ist schwerer als 900 kg."
                say: "Stimmt das? Eine Tonne ist schwerer als neunhundert Kilogramm."
                answer: true
              - id: l2-n5
                type: text_input
                text: "Ein Lastwagen hat 2 t Sand geladen. Dann kommen noch 500 kg dazu. Wie viele kg Sand hat er jetzt?"
                say: "Ein Lastwagen hat zwei Tonnen Sand geladen. Dann kommen noch fünfhundert Kilogramm dazu. Wie viele Kilogramm Sand hat er jetzt?"
                answer: "2500"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie schwer ist ein Kaninchen ungefähr?"
            say: "Wie schwer ist ein Kaninchen ungefähr?"
            options: ["etwa 2 kg", "etwa 2 g", "etwa 200 kg"]
            answer: "etwa 2 kg"
          - id: l2-c2
            type: text_input
            text: "5 t = _ kg"
            say: "Wie viele Kilogramm sind fünf Tonnen?"
            answer: "5000"
          - id: l2-c3
            type: multiple_choice
            text: "Ein Stück Seife wiegt etwa 100 _."
            say: "Welche Einheit passt? Ein Stück Seife wiegt etwa hundert ..."
            options: ["g", "kg", "t"]
            answer: "g"
          - id: l2-c4
            type: multiple_choice
            text: "Ein Traktor wiegt 3 t 400 kg. Wie viele kg sind das?"
            say: "Ein Traktor wiegt drei Tonnen und vierhundert Kilogramm. Wie viele Kilogramm sind das?"
            options: ["3400 kg", "3040 kg", "340 kg"]
            answer: "3400 kg"
          - id: l2-c5
            type: true_false
            text: "Ein Liter Wasser wiegt etwa so viel wie eine Packung Mehl."
            say: "Stimmt das? Ein Liter Wasser wiegt etwa so viel wie eine Packung Mehl."
            answer: true
