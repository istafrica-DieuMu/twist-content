# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.table-3-6-9
skill: math.mult-div.table-3-6-9
curriculum: de-DE
language: de
title:
  de: Die Dreier-, Sechser- und Neunerreihe
  en: The 3, 6 and 9 times tables
summary: >
  The Einmaleinsreihen of 3, 6 and 9. Lesson 1 takes the Dreierreihe and
  the Sechserreihe as its double (4 · 6 is double 4 · 3); lesson 2 takes
  the Neunerreihe from the Zehnerreihe (7 · 9 is 7 · 10 minus 7), and
  ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Einmaleins, en: Times tables }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.derive-facts]
  also_practises: [math.mult-div.derive-facts, math.mult-div.table-5-10]
  vocabulary: { de: [Dreierreihe, Sechserreihe, Neunerreihe, verdoppeln, Zehnerreihe] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: nine-minus-one
      what: Takes away 1 instead of the factor when using the Zehnerreihe (7 · 9 = 70 − 1)
      addressed: lesson 2 Learn takes one dot from each of the seven rows of ten, seven in all; a "Die Zehnerreihe hilft" frame in every stage of lesson 2 has a minus-one option (59, 49, 79), with feedback in l2-f1; l2-s4 asks whether 9 · 9 is 89
    - id: three-skip
      what: Loses the step when counting in threes past 10 (3, 6, 9, 13)
      addressed: every stage of lesson 1 has a "Welche Zahl fehlt?" task in the Dreier- or Sechserreihe, and l2-c3 has one in the Dreierreihe
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Dreier und Sechser", en: "Threes and sixes" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "3 + 3 + 3 = _"
            say: "Drei plus drei plus drei."
            answer: "9"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "12 + 12 = _"
            say: "Zwölf plus zwölf."
            answer: "24"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3, 6, 9, 12, 15, 18, 21, 24, 27, 30"
            say: "Das ist die Dreierreihe. Du zählst immer drei weiter: drei, sechs, neun, zwölf und so weiter bis dreißig."
          - text: "6, 12, 18, 24, 30, 36, 42, 48, 54, 60"
            say: "Das ist die Sechserreihe. Sechs ist das Doppelte von drei. Darum ist jede Zahl der Sechserreihe doppelt so groß wie die Zahl an der gleichen Stelle in der Dreierreihe."
          - text: "4 · 3 = 12 → 4 · 6 = 24"
            say: "Vier mal drei ist zwölf. Vier mal sechs ist das Doppelte davon: zwölf plus zwölf ist vierundzwanzig."
            show: { drawn: dots, array: [4, 6] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle in der Dreierreihe. Welche Zahl fehlt?"
                frame: "9, 12, _, 18"
                options: ["15", "14", "13"]
                answer: ["15"]
                hints:
                  - "Immer drei weiter."
                  - "Zwölf und drei."
                  - "15."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Verdopple."
                say: "Rechne zuerst drei mal drei, dann drei mal sechs."
                frame: "3 · 3 = _ | 3 · 6 = _"
                options: ["9", "18", "12", "6"]
                answer: ["9", "18"]
                hints:
                  - "Drei mal drei ist neun."
                  - "Drei mal sechs ist das Doppelte davon."
                  - "9 und 18."
              - id: l1-f3
                type: text_input
                text: "7 · 3 = _"
                say: "Sieben mal drei."
                answer: "21"
                hints:
                  - "Fünf mal drei und zwei mal drei."
                  - "15 + 6."
                  - "21."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 5 · 6 = 30"
                say: "Fünf mal sechs ist dreißig. Stimmt das?"
                answer: true
                hints:
                  - "Zehn mal sechs ist sechzig."
                  - "Fünf mal sechs ist die Hälfte davon."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Zahl gehört zur Sechserreihe?"
                say: "Welche Zahl gehört zur Sechserreihe?"
                options: ["42", "44", "46"]
                answer: "42"
                hints:
                  - "Zähle in Sechserschritten."
                  - "Sieben mal sechs."
                  - "42."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle in der Dreierreihe. Welche Zahl fehlt?"
                frame: "18, _, 24, 27"
                options: ["20", "21", "22"]
                answer: ["21"]
                hints: ["Wie viel kommt jedes Mal dazu?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Verdopple."
                say: "Rechne zuerst acht mal drei, dann acht mal sechs."
                frame: "8 · 3 = _ | 8 · 6 = _"
                options: ["24", "48", "28", "42"]
                answer: ["24", "48"]
                hints: ["Mal sechs ist das Doppelte von mal drei."]
              - id: l1-s3
                type: text_input
                text: "9 · 3 = _"
                say: "Neun mal drei."
                answer: "27"
                hints: ["Zehn mal drei, dann einen Dreier weg."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 6 · 6 = 32"
                say: "Sechs mal sechs ist zweiunddreißig. Stimmt das?"
                answer: false
                hints: ["Verdopple sechs mal drei."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Zahl gehört zur Dreierreihe?"
                say: "Welche Zahl gehört zur Dreierreihe?"
                options: ["16", "20", "24"]
                answer: "24"
                hints: ["Zähle in Dreierschritten."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle in der Sechserreihe. Welche Zahl fehlt?"
                frame: "30, 36, _, 48"
                options: ["40", "42", "44"]
                answer: ["42"]
              - id: l1-n2
                type: fill_in_blank
                text: "Verdopple."
                say: "Rechne zuerst sieben mal drei, dann sieben mal sechs."
                frame: "7 · 3 = _ | 7 · 6 = _"
                options: ["21", "42", "24", "36"]
                answer: ["21", "42"]
              - id: l1-n3
                type: text_input
                text: "6 · 3 = _"
                say: "Sechs mal drei."
                answer: "18"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 9 · 6 = 54"
                say: "Neun mal sechs ist vierundfünfzig. Stimmt das?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Welche Zahl gehört zur Sechserreihe?"
                say: "Welche Zahl gehört zur Sechserreihe?"
                options: ["26", "33", "36"]
                answer: "36"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "8 · 3 = _"
            say: "Acht mal drei."
            answer: "24"
          - id: l1-c2
            type: text_input
            text: "7 · 6 = _"
            say: "Sieben mal sechs."
            answer: "42"
          - id: l1-c3
            type: true_false
            text: "Gehört 25 zur Dreierreihe?"
            say: "Gehört fünfundzwanzig zur Dreierreihe?"
            answer: false

  - n: 2
    title: { de: "Die Neunerreihe", en: "The 9 times table" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Zähle in der Sechserreihe. Welche Zahl fehlt?"
            frame: "24, 30, _, 42"
            options: ["36", "34", "38"]
            answer: ["36"]
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "7 · 10 = _"
            say: "Sieben mal zehn."
            answer: "70"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "9, 18, 27, 36, 45, 54, 63, 72, 81, 90"
            say: "Das ist die Neunerreihe. Neun ist eins weniger als zehn. Darum hilft dir die Zehnerreihe."
          - text: "7 · 9 = 7 · 10 − 7 = 63"
            say: "Sieben mal neun: Rechne zuerst sieben mal zehn, das ist siebzig. Jede Reihe hat einen Punkt zu viel. Nimm also sieben weg: siebzig minus sieben ist dreiundsechzig."
            show: { drawn: dots, array: [7, 10] }
          - text: "18 → 1 + 8 = 9 | 27 → 2 + 7 = 9 | 36 → 3 + 6 = 9"
            say: "Ein Trick für die Neunerreihe bis neunzig: Zählst du die beiden Ziffern zusammen, kommt immer neun heraus. Bei achtzehn ist es eins plus acht, bei siebenundzwanzig zwei plus sieben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Die Zehnerreihe hilft."
                say: "Rechne zuerst sechs mal zehn, dann sechs mal neun."
                frame: "6 · 10 = _ | 6 · 9 = 6 · 10 − 6 = _"
                options: ["60", "54", "59", "66"]
                answer: ["60", "54"]
                feedback:
                  "59": "Sechs mal neun ist sechs mal zehn minus sechs, nicht minus eins."
                hints:
                  - "Sechs mal zehn ist sechzig."
                  - "Nimm aus jedem Zehner eins weg, also sechs."
                  - "60 und 54."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "4 · 9 = _"
                say: "Vier mal neun."
                answer: "36"
                hints:
                  - "Vier mal zehn, dann vier weg."
                  - "40 − 4."
                  - "36."
              - id: l2-f3
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle in der Neunerreihe. Welche Zahl fehlt?"
                frame: "27, 36, _, 54"
                options: ["45", "44", "46"]
                answer: ["45"]
                hints:
                  - "Immer neun weiter."
                  - "Sechsunddreißig und neun."
                  - "45."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 2 · 9 = 18"
                say: "Zwei mal neun ist achtzehn. Stimmt das?"
                answer: true
                hints:
                  - "Zwei mal zehn ist zwanzig."
                  - "Zwanzig minus zwei."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Zahl gehört zur Neunerreihe?"
                say: "Welche Zahl gehört zur Neunerreihe?"
                options: ["72", "74", "76"]
                answer: "72"
                hints:
                  - "Zähle die beiden Ziffern zusammen."
                  - "Sieben plus zwei ist neun."
                  - "72."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Die Zehnerreihe hilft."
                say: "Rechne zuerst fünf mal zehn, dann fünf mal neun."
                frame: "5 · 10 = _ | 5 · 9 = 5 · 10 − 5 = _"
                options: ["50", "45", "49", "55"]
                answer: ["50", "45"]
                hints: ["Nimm aus jedem Zehner eins weg."]
              - id: l2-s2
                type: text_input
                text: "3 · 9 = _"
                say: "Drei mal neun."
                answer: "27"
                hints: ["Drei mal zehn, dann drei weg."]
              - id: l2-s3
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle in der Neunerreihe. Welche Zahl fehlt?"
                frame: "9, _, 27, 36"
                options: ["17", "18", "19"]
                answer: ["18"]
                hints: ["Wie viel kommt jedes Mal dazu?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 9 · 9 = 89"
                say: "Neun mal neun ist neunundachtzig. Stimmt das?"
                answer: false
                hints: ["Neun mal zehn, dann neun weg."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Zahl gehört zur Neunerreihe?"
                say: "Welche Zahl gehört zur Neunerreihe?"
                options: ["35", "36", "37"]
                answer: "36"
                hints: ["Zähle die beiden Ziffern zusammen."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Die Zehnerreihe hilft."
                say: "Rechne zuerst acht mal zehn, dann acht mal neun."
                frame: "8 · 10 = _ | 8 · 9 = 8 · 10 − 8 = _"
                options: ["80", "72", "79", "88"]
                answer: ["80", "72"]
              - id: l2-n2
                type: text_input
                text: "6 · 9 = _"
                say: "Sechs mal neun."
                answer: "54"
              - id: l2-n3
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle in der Neunerreihe. Welche Zahl fehlt?"
                frame: "63, 72, _, 90"
                options: ["80", "81", "82"]
                answer: ["81"]
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 5 · 9 = 54"
                say: "Fünf mal neun ist vierundfünfzig. Stimmt das?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Welche Zahl gehört zur Neunerreihe?"
                say: "Welche Zahl gehört zur Neunerreihe?"
                options: ["28", "27", "29"]
                answer: "27"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "9 · 9 = _"
            say: "Neun mal neun."
            answer: "81"
          - id: l2-c2
            type: text_input
            text: "9 · 6 = _"
            say: "Neun mal sechs."
            answer: "54"
          - id: l2-c3
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Zähle in der Dreierreihe. Welche Zahl fehlt?"
            frame: "21, 24, _, 30"
            options: ["26", "27", "28"]
            answer: ["27"]
          - id: l2-c4
            type: multiple_choice
            text: "Welche Zahl gehört zur Dreierreihe?"
            say: "Welche Zahl gehört zur Dreierreihe?"
            options: ["29", "30", "31"]
            answer: "30"
          - id: l2-c5
            type: true_false
            text: "Stimmt das? 3 · 6 = 16"
            say: "Drei mal sechs ist sechzehn. Stimmt das?"
            answer: false
