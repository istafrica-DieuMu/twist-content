              - id: l2-s3
                type: text_input
                text: "70 000 − 1 = _"
                say: "Siebzigtausend minus eins. Siehst du den Trick?"
                answer: "69999"
                hints: ["Welche Zahl kommt direkt vor 70 000?"]
              - id: l2-s4
                type: multiple_choice
                text: "Wie rechnest du 19 999 + 1 am besten?"
                say: "Neunzehntausendneunhundertneunundneunzig plus eins. Wie rechnest du am besten?"
                options: ["schriftlich", "halbschriftlich", "im Kopf"]
                answer: "im Kopf"
                hints: ["Welche Zahl kommt nach 19 999?"]
              - id: l2-s5
                type: true_false
                text: "Ali sagt: „Ich rechne 50 000 + 20 000 schriftlich, weil die Zahlen groß sind.“ Ist das ein guter Grund?"
                say: "Ali sagt: Ich rechne fünfzigtausend plus zwanzigtausend schriftlich, weil die Zahlen groß sind. Ist das ein guter Grund?"
                answer: false
                hints: ["Sind die Zahlen rund?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Warum rechnest du 15 000 − 6000 im Kopf?"
                say: "Warum rechnest du fünfzehntausend minus sechstausend am besten im Kopf?"
                options: ["weil fünfzehn minus sechs hilft", "weil die Zahlen groß sind", "weil es minus ist"]
                answer: "weil fünfzehn minus sechs hilft"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Warum rechnest du 86 479 + 7856 schriftlich?"
                say: "Warum rechnest du sechsundachtzigtausendvierhundertneunundsiebzig plus siebentausendachthundertsechsundfünfzig am besten schriftlich?"
                options: ["weil die Zahlen rund sind", "weil es viele Überträge gibt", "weil die zweite Zahl kürzer ist"]
                answer: "weil es viele Überträge gibt"
                option_audio: false
              - id: l2-n3
                type: text_input
                text: "89 999 + 1 = _"
                say: "Neunundachtzigtausendneunhundertneunundneunzig plus eins."
                answer: "90000"
              - id: l2-n4
                type: multiple_choice
                text: "Wie rechnest du 100 000 − 1 am besten?"
                say: "Hunderttausend minus eins. Wie rechnest du am besten?"
                options: ["halbschriftlich", "im Kopf", "schriftlich"]
                answer: "im Kopf"
              - id: l2-n5
                type: true_false
                text: "Sara sagt: „Ich rechne 92 376 − 45 589 schriftlich, weil ich oft entbündeln muss.“ Ist das ein guter Grund?"
                say: "Sara sagt: Ich rechne zweiundneunzigtausenddreihundertsechsundsiebzig minus fünfundvierzigtausendfünfhundertneunundachtzig schriftlich, weil ich oft entbündeln muss. Ist das ein guter Grund?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "90 000 − 60 000: Wie rechnest du am besten?"
            say: "Neunzigtausend minus sechzigtausend. Wie rechnest du am besten?"
            options: ["halbschriftlich", "schriftlich", "im Kopf"]
            answer: "im Kopf"
          - id: l2-c2
            type: multiple_choice
            text: "Warum rechnest du 57 268 + 34 795 schriftlich?"
            say: "Warum rechnest du siebenundfünfzigtausendzweihundertachtundsechzig plus vierunddreißigtausendsiebenhundertfünfundneunzig am besten schriftlich?"
            options: ["weil es plus ist", "weil die Zahlen rund sind", "weil es viele Überträge gibt"]
