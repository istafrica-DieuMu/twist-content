            say: "Neununddreißigtausendneunhundertneunundneunzig plus eins."
            answer: "40000"
          - id: l2-c4
            type: multiple_choice
            text: "8650 − 3280: Wie rechnest du am besten?"
            say: "Achttausendsechshundertfünfzig minus dreitausendzweihundertachtzig. Wie rechnest du am besten?"
            options: ["schriftlich", "halbschriftlich", "im Kopf"]
            answer: "halbschriftlich"
          - id: l2-c5
            type: true_false
            text: "Paul sagt: „Ich rechne 20 000 + 70 000 im Kopf, weil zwei plus sieben neun ist.“ Ist das ein guter Grund?"
            say: "Paul sagt: Ich rechne zwanzigtausend plus siebzigtausend im Kopf, weil zwei plus sieben neun ist. Ist das ein guter Grund?"
