# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.choose-method
skill: math.written-add-sub.choose-method
curriculum: de-DE
language: de
title:
  de: Im Kopf, halbschriftlich oder schriftlich?
  en: Mental, informal or column method?
summary: >
  Choosing how to calculate and saying why. Lesson 1 sorts tasks into
  im Kopf (round numbers, 8000 + 5000), halbschriftlich (a few steps,
  6280 + 3450) and schriftlich (many digits, many Überträge); lesson 2
  gives the reason for a choice, spots a clever shortcut (29 999 + 1),
  and ends with the skill check. More than one way can be right; the
  tasks ask for the way that suits best and say why in the feedback.
metadata:
  year: klasse-4
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.large, math.add-sub-to-1000.large-semi-written]
  also_practises: [math.add-sub-to-1000.large-mental, math.written-add-sub.large]
  vocabulary: { de: [im Kopf, halbschriftlich, schriftlich, Rechenweg, begründen] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: always-written
      what: Writes every task in columns, even 10 000 + 5000
      addressed: lesson 1 Learn shows a round task solved in one step; every stage has a task where im Kopf is the best choice, with feedback in l1-f1
    - id: no-reason
      what: Chooses a way but cannot say why
      addressed: lesson 2 asks for the reason in every stage ("Warum rechnest du … im Kopf?", "… schriftlich?"), with the reasons as options
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Welcher Weg passt?", en: "Which way suits?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "9000 + 4000 = _"
            say: "Neuntausend plus viertausend."
            answer: "13000"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "5300 + 2400 = _"
            say: "Fünftausenddreihundert plus zweitausendvierhundert. Rechne schrittweise."
            answer: "7700"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "30 000 + 40 000 → im Kopf"
            say: "Bei runden Zahlen rechnest du im Kopf: drei plus vier ist sieben, also siebzigtausend. Dafür brauchst du kein Papier."
          - text: "6280 + 3450 → halbschriftlich"
            say: "Sechstausendzweihundertachtzig plus dreitausendvierhundertfünfzig. Hier reichen ein paar Schritte, also rechnest du halbschriftlich: erst die Tausender, dann die Hunderter, dann die Zehner. Die Zwischenergebnisse schreibst du auf."
          - text: "47 386 + 28 759 → schriftlich"
            say: "Bei vielen Ziffern und vielen Überträgen rechnest du schriftlich, untereinander. So verlierst du keine Stelle."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "20 000 + 50 000: Wie rechnest du am besten?"
                say: "Zwanzigtausend plus fünfzigtausend. Wie rechnest du am besten?"
                options: ["im Kopf", "halbschriftlich", "schriftlich"]
                answer: "im Kopf"
                feedback:
                  "schriftlich": "Das geht auch, ist aber viel zu umständlich. Zwei plus fünf ist sieben, also 70 000."
                hints:
                  - "Sind die Zahlen rund?"
                  - "Zwei plus fünf hilft dir."
                  - "Im Kopf."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "58 947 + 26 385: Wie rechnest du am besten?"
                say: "Achtundfünfzigtausendneunhundertsiebenundvierzig plus sechsundzwanzigtausenddreihundertfünfundachtzig. Wie rechnest du am besten?"
                options: ["im Kopf", "halbschriftlich", "schriftlich"]
                answer: "schriftlich"
                hints:
                  - "Wie viele Ziffern haben die Zahlen?"
                  - "Hier gibt es viele Überträge."
                  - "Schriftlich."
              - id: l1-f3
                type: multiple_choice
                text: "4380 + 2450: Wie rechnest du am besten?"
                say: "Viertausenddreihundertachtzig plus zweitausendvierhundertfünfzig. Wie rechnest du am besten?"
                options: ["im Kopf", "halbschriftlich", "schriftlich"]
                answer: "halbschriftlich"
                feedback:
                  "schriftlich": "Das geht auch, aber hier reichen drei kurze Schritte: 4380 + 2000, dann + 400, dann + 50."
                  "im Kopf": "Achtzig plus fünfzig geht über den Hunderter. Schreib dir die Zwischenergebnisse lieber auf."
                hints:
                  - "Wie viele Schritte brauchst du?"
                  - "Erst die Tausender, dann die Hunderter, dann die Zehner."
                  - "Halbschriftlich."
              - id: l1-f4
                type: sorting
                text: "Im Kopf oder schriftlich?"
                say: "Sortiere die Aufgaben: Rechnest du sie besser im Kopf oder schriftlich?"
                bins:
                  - { id: head, show: { text: "im Kopf" }, say: "im Kopf" }
                  - { id: written, show: { text: "schriftlich" }, say: "schriftlich" }
                options:
                  - { text: "60 000 − 20 000", bin: head }
                  - { text: "73 418 − 29 657", bin: written }
                  - { text: "8000 + 7000", bin: head }
                  - { text: "45 896 + 37 279", bin: written }
                option_audio: false
                hints:
                  - "Schau, ob die Zahlen rund sind."
                  - "Viele verschiedene Ziffern: schriftlich."
                  - "Die runden Aufgaben im Kopf, die anderen schriftlich."
              - id: l1-f5
                type: true_false
                text: "Lena rechnet 40 000 − 10 000 schriftlich. Ist das der beste Weg?"
                say: "Lena rechnet vierzigtausend minus zehntausend schriftlich. Ist das der beste Weg?"
                answer: false
                hints:
                  - "Sind die Zahlen rund?"
                  - "Vier minus eins hilft."
                  - "Nein. Das geht schneller im Kopf: 30 000."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "500 000 + 300 000: Wie rechnest du am besten?"
                say: "Fünfhunderttausend plus dreihunderttausend. Wie rechnest du am besten?"
                options: ["schriftlich", "im Kopf", "halbschriftlich"]
                answer: "im Kopf"
                hints: ["Welche kleine Aufgabe steckt darin?"]
              - id: l1-s2
                type: multiple_choice
                text: "63 487 − 28 659: Wie rechnest du am besten?"
                say: "Dreiundsechzigtausendvierhundertsiebenundachtzig minus achtundzwanzigtausendsechshundertneunundfünfzig. Wie rechnest du am besten?"
                options: ["halbschriftlich", "schriftlich", "im Kopf"]
                answer: "schriftlich"
                hints: ["Wie oft musst du entbündeln?"]
              - id: l1-s3
                type: multiple_choice
                text: "7830 − 2460: Wie rechnest du am besten?"
                say: "Siebentausendachthundertdreißig minus zweitausendvierhundertsechzig. Wie rechnest du am besten?"
                options: ["schriftlich", "halbschriftlich", "im Kopf"]
                answer: "halbschriftlich"
                hints: ["Reichen ein paar kurze Schritte?"]
              - id: l1-s4
                type: sorting
                text: "Im Kopf oder schriftlich?"
                say: "Sortiere die Aufgaben: Rechnest du sie besser im Kopf oder schriftlich?"
                bins:
                  - { id: head, show: { text: "im Kopf" }, say: "im Kopf" }
                  - { id: written, show: { text: "schriftlich" }, say: "schriftlich" }
                options:
                  - { text: "36 574 + 48 769", bin: written }
                  - { text: "90 000 − 50 000", bin: head }
                  - { text: "82 315 − 47 628", bin: written }
                  - { text: "12 000 + 6000", bin: head }
                option_audio: false
                hints: ["Schau bei jeder Aufgabe auf die Ziffern."]
              - id: l1-s5
                type: true_false
                text: "Max rechnet 67 843 + 25 978 schriftlich. Ist das der beste Weg?"
                say: "Max rechnet siebenundsechzigtausendachthundertdreiundvierzig plus fünfundzwanzigtausendneunhundertachtundsiebzig schriftlich. Ist das der beste Weg?"
                answer: true
                hints: ["Wie viele Überträge gibt es?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "70 000 − 30 000: Wie rechnest du am besten?"
                say: "Siebzigtausend minus dreißigtausend. Wie rechnest du am besten?"
                options: ["halbschriftlich", "im Kopf", "schriftlich"]
                answer: "im Kopf"
              - id: l1-n2
                type: multiple_choice
                text: "84 576 − 39 698: Wie rechnest du am besten?"
                say: "Vierundachtzigtausendfünfhundertsechsundsiebzig minus neununddreißigtausendsechshundertachtundneunzig. Wie rechnest du am besten?"
                options: ["im Kopf", "schriftlich", "halbschriftlich"]
                answer: "schriftlich"
              - id: l1-n3
                type: multiple_choice
                text: "5470 + 3260: Wie rechnest du am besten?"
                say: "Fünftausendvierhundertsiebzig plus dreitausendzweihundertsechzig. Wie rechnest du am besten?"
                options: ["halbschriftlich", "schriftlich", "im Kopf"]
                answer: "halbschriftlich"
              - id: l1-n4
                type: sorting
                text: "Im Kopf oder schriftlich?"
                say: "Sortiere die Aufgaben: Rechnest du sie besser im Kopf oder schriftlich?"
                bins:
                  - { id: head, show: { text: "im Kopf" }, say: "im Kopf" }
                  - { id: written, show: { text: "schriftlich" }, say: "schriftlich" }
                options:
                  - { text: "300 000 + 400 000", bin: head }
                  - { text: "57 286 + 36 947", bin: written }
                  - { text: "15 000 − 7000", bin: head }
                  - { text: "91 403 − 56 879", bin: written }
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Ben rechnet 80 000 + 20 000 schriftlich. Ist das der beste Weg?"
                say: "Ben rechnet achtzigtausend plus zwanzigtausend schriftlich. Ist das der beste Weg?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "60 000 + 30 000: Wie rechnest du am besten?"
            say: "Sechzigtausend plus dreißigtausend. Wie rechnest du am besten?"
            options: ["schriftlich", "halbschriftlich", "im Kopf"]
            answer: "im Kopf"
          - id: l1-c2
            type: multiple_choice
            text: "48 735 + 37 896: Wie rechnest du am besten?"
            say: "Achtundvierzigtausendsiebenhundertfünfunddreißig plus siebenunddreißigtausendachthundertsechsundneunzig. Wie rechnest du am besten?"
            options: ["im Kopf", "halbschriftlich", "schriftlich"]
            answer: "schriftlich"
          - id: l1-c3
            type: true_false
            text: "Mia rechnet 6270 + 2850 halbschriftlich. Ist das ein guter Weg?"
            say: "Mia rechnet sechstausendzweihundertsiebzig plus zweitausendachthundertfünfzig halbschriftlich. Ist das ein guter Weg?"
            answer: true

  - n: 2
    title: { de: "Warum dieser Weg?", en: "Why this way?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "40 000 + 20 000: Wie rechnest du am besten?"
            say: "Vierzigtausend plus zwanzigtausend. Wie rechnest du am besten?"
            options: ["im Kopf", "halbschriftlich", "schriftlich"]
            answer: "im Kopf"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "76 548 − 38 769: Wie rechnest du am besten?"
            say: "Sechsundsiebzigtausendfünfhundertachtundvierzig minus achtunddreißigtausendsiebenhundertneunundsechzig. Wie rechnest du am besten?"
            options: ["schriftlich", "im Kopf", "halbschriftlich"]
            answer: "schriftlich"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "50 000 + 30 000 im Kopf, weil die Zahlen rund sind."
            say: "Wenn du einen Weg wählst, kannst du ihn begründen: Ich rechne im Kopf, weil die Zahlen rund sind."
          - text: "29 999 + 1 = 30 000"
            say: "Manchmal gibt es einen Trick: Neunundzwanzigtausendneunhundertneunundneunzig plus eins ist dreißigtausend. Das siehst du sofort, ganz ohne Rechnen untereinander."
          - text: "53 284 − 26 597 schriftlich, weil du oft entbündeln musst."
            say: "Dreiundfünfzigtausendzweihundertvierundachtzig minus sechsundzwanzigtausendfünfhundertsiebenundneunzig. Ich rechne schriftlich, weil ich an vielen Stellen entbündeln muss."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum rechnest du 80 000 − 40 000 im Kopf?"
                say: "Warum rechnest du achtzigtausend minus vierzigtausend am besten im Kopf?"
                options: ["weil die Zahlen rund sind", "weil die Zahlen groß sind", "weil es minus ist"]
                answer: "weil die Zahlen rund sind"
                option_audio: false
                feedback:
                  "weil die Zahlen groß sind": "Große Zahlen allein sind kein Grund. Hier hilft, dass die Zahlen rund sind: acht minus vier."
                hints:
                  - "Was macht die Aufgabe leicht?"
                  - "Acht minus vier hilft dir."
                  - "Weil die Zahlen rund sind."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Warum rechnest du 64 397 + 28 865 schriftlich?"
                say: "Warum rechnest du vierundsechzigtausenddreihundertsiebenundneunzig plus achtundzwanzigtausendachthundertfünfundsechzig am besten schriftlich?"
                options: ["weil es viele Überträge gibt", "weil die Zahlen rund sind", "weil es plus ist"]
                answer: "weil es viele Überträge gibt"
                option_audio: false
                hints:
                  - "Was macht die Aufgabe schwer?"
                  - "Sieben plus fünf, neun plus sechs, …"
                  - "Weil es viele Überträge gibt."
              - id: l2-f3
                type: text_input
                text: "49 999 + 1 = _"
                say: "Neunundvierzigtausendneunhundertneunundneunzig plus eins. Siehst du den Trick?"
                answer: "50000"
                hints:
                  - "Was kommt nach 49 999?"
                  - "Die nächste runde Zahl."
                  - "50 000. Tippe 50000."
              - id: l2-f4
                type: multiple_choice
                text: "Wie rechnest du 60 000 − 1 am besten?"
                say: "Sechzigtausend minus eins. Wie rechnest du am besten?"
                options: ["im Kopf", "schriftlich", "halbschriftlich"]
                answer: "im Kopf"
                feedback:
                  "schriftlich": "Das geht, aber dann musst du viermal entbündeln. Einfacher: die Zahl vor 60 000 ist 59 999."
                hints:
                  - "Welche Zahl kommt direkt vor 60 000?"
                  - "Du brauchst nur einen Schritt rückwärts."
                  - "Im Kopf: 59 999."
              - id: l2-f5
                type: true_false
                text: "Tim sagt: „Ich rechne 5260 + 3480 halbschriftlich, weil ein paar kurze Schritte reichen.“ Ist das ein guter Grund?"
                say: "Tim sagt: Ich rechne fünftausendzweihundertsechzig plus dreitausendvierhundertachtzig halbschriftlich, weil ein paar kurze Schritte reichen. Ist das ein guter Grund?"
                answer: true
                hints:
                  - "Wie viele Schritte brauchst du?"
                  - "Erst 5260 + 3000, dann + 400, dann + 80."
                  - "Ja, das ist ein guter Grund."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Warum rechnest du 300 000 + 600 000 im Kopf?"
                say: "Warum rechnest du dreihunderttausend plus sechshunderttausend am besten im Kopf?"
                options: ["weil es plus ist", "weil die Zahlen rund sind", "weil die Zahlen sechsstellig sind"]
                answer: "weil die Zahlen rund sind"
                option_audio: false
                hints: ["Was macht die Aufgabe leicht?"]
              - id: l2-s2
                type: multiple_choice
                text: "Warum rechnest du 71 254 − 38 687 schriftlich?"
                say: "Warum rechnest du einundsiebzigtausendzweihundertvierundfünfzig minus achtunddreißigtausendsechshundertsiebenundachtzig am besten schriftlich?"
                options: ["weil du oft entbündeln musst", "weil die Zahlen rund sind", "weil es minus ist"]
                answer: "weil du oft entbündeln musst"
                option_audio: false
