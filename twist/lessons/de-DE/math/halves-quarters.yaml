# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.halves-quarters
skill: math.fractions.halves-quarters
curriculum: de-DE
language: de
title:
  de: Hälften und Viertel
  en: Halves and quarters
summary: >
  Lesson 1 splits a whole into two equal parts (die Hälfte), finds half of
  an amount on a Punktefeld with one row red and one blue, and checks
  whether two pieces really are halves; lesson 2 splits into four equal
  parts (ein Viertel), finds a quarter of an amount, learns that two
  quarters make a half and that a quarter is smaller than a half, and
  ends with the skill check. Folding or colouring a drawn shape waits for
  a shape-parts component; pieces of a pizza or a cake are told in words.
metadata:
  year: klasse-3
  topic: { de: Brüche, en: Fractions }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-20.double-halve-to-20]
  also_practises: [math.numbers-to-20.double-halve-to-20]
  vocabulary: { de: [Hälfte, halbieren, Viertel, Ganzes, gleich groß, gerecht teilen] }
  forms: [text, audio, drawn]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: unequal-parts
      what: Calls any two pieces halves or any four pieces quarters, even when the pieces are not the same size
      addressed: lesson 1 Learn shows a big and a small piece that are no halves; l1-f3, l1-n2, l1-c3, l2-s5 and l2-c5 give unequal pieces
    - id: more-parts-bigger
      what: Thinks a quarter is more than a half because 4 is more than 2, or reads one red row of four as the half
      addressed: lesson 2 Learn halves a half to get a quarter; l2-f1 has feedback on calling one row of four the half, l2-s3 claims a quarter is more, l2-n2 shows two of four rows red, l2-n4 compares a quarter and a half of 12
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die Hälfte", en: "Halves" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Die Hälfte von 14 = _"
            say: "Was ist die Hälfte von vierzehn?"
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Das Doppelte von 8 = _"
            say: "Was ist das Doppelte von acht?"
            options: ["16", "4", "10"]
            answer: "16"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "2 gleich große Teile: 2 Hälften"
            say: "Teilst du ein Ganzes in zwei gleich große Teile, heißt jeder Teil eine Hälfte. Zwei Hälften sind zusammen wieder das Ganze."
          - text: "Die Hälfte von 8 Punkten sind 4 Punkte."
            say: "Hier sind acht Punkte. Die obere Reihe ist rot, die untere blau. Beide Reihen sind gleich groß. Die roten Punkte sind die Hälfte: vier Punkte."
            show: { drawn: dots, array: [2, 4], split_rows: 1 }
          - text: "Ein großes und ein kleines Stück sind keine Hälften."
            say: "Ben schneidet einen Apfel in ein großes und ein kleines Stück. Das sind zwei Teile, aber keine Hälften. Hälften sind immer gleich groß."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Teil der Punkte ist rot?"
                say: "Welcher Teil der Punkte ist rot?"
                show: { drawn: dots, array: [2, 5], split_rows: 1 }
                options: ["die Hälfte", "ein Viertel", "alle"]
                answer: "die Hälfte"
                hints:
                  - "Zähl die roten und die blauen Punkte."
                  - "5 rote und 5 blaue: gleich viele."
                  - "die Hälfte."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Die Hälfte von 18 Äpfeln = _"
                say: "Was ist die Hälfte von achtzehn Äpfeln?"
                answer: "9"
                hints:
                  - "Teile in 2 gleich große Teile."
                  - "Welche Zahl und die gleiche Zahl ergeben 18?"
                  - "9, denn 9 + 9 = 18."
              - id: l1-f3
                type: true_false
                text: "Mia bricht eine Tafel Schokolade in 2 Stücke. Ein Stück hat 10 Stückchen, das andere 14. Hat sie die Tafel halbiert?"
                say: "Mia bricht eine Tafel Schokolade in zwei Stücke. Ein Stück hat zehn Stückchen, das andere vierzehn. Hat sie die Tafel halbiert?"
                answer: false
                hints:
                  - "Hälften sind gleich groß."
                  - "Sind 10 und 14 gleich viel?"
                  - "Nein. Die Stücke sind nicht gleich groß."
              - id: l1-f4
                type: image_multiple_choice
                text: "Wo ist die Hälfte rot?"
                say: "Bei welchem Punktefeld ist genau die Hälfte rot?"
                options:
                  - { drawn: dots, array: [2, 3], split_rows: 1 }
                  - { drawn: dots, array: [3, 3], split_rows: 1 }
                  - { drawn: dots, array: [4, 3], split_rows: 1 }
                answer: "2x3"
                feedback:
                  "3x3": "Hier sind 3 rote und 6 blaue Punkte. Das ist nicht die Hälfte."
                hints:
                  - "Bei der Hälfte sind rote und blaue Punkte gleich viele."
                  - "Zähl in jedem Bild die roten und die blauen Punkte."
                  - "Das Bild mit 3 roten und 3 blauen Punkten."
              - id: l1-f5
                type: multiple_choice
                text: "Lena und Tom teilen 12 Murmeln gerecht. Wie viele bekommt jeder?"
                say: "Lena und Tom teilen zwölf Murmeln gerecht. Wie viele bekommt jeder?"
                options: ["6", "12", "4"]
                answer: "6"
                feedback:
                  "12": "12 sind alle Murmeln. Jeder bekommt nur die Hälfte."
                hints:
                  - "Gerecht teilen heißt: Jeder bekommt gleich viel."
                  - "Jeder bekommt die Hälfte von 12."
                  - "6."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Die Hälfte von 16 = _"
                say: "Was ist die Hälfte von sechzehn?"
                answer: "8"
                hints: ["Welche Zahl und die gleiche Zahl ergeben 16?"]
              - id: l1-s2
                type: true_false
                text: "Die roten Punkte sind die Hälfte."
                say: "Stimmt das? Die roten Punkte sind die Hälfte."
                show: { drawn: dots, array: [2, 6], split_rows: 1 }
                answer: true
                hints: ["Zähl rot und blau."]
              - id: l1-s3
                type: multiple_choice
                text: "Ein Brot wird in 2 gleich große Teile geschnitten. Wie heißt ein Teil?"
                say: "Ein Brot wird in zwei gleich große Teile geschnitten. Wie heißt ein Teil?"
                options: ["eine Hälfte", "ein Viertel", "ein Ganzes"]
                answer: "eine Hälfte"
                hints: ["Zwei gleich große Teile."]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Teil der Punkte ist rot?"
                say: "Welcher Teil der Punkte ist rot?"
                show: { drawn: dots, array: [4, 2], split_rows: 2 }
                options: ["die Hälfte", "ein Viertel", "alle"]
                answer: "die Hälfte"
                hints: ["Zähl die roten und die blauen Punkte."]
              - id: l1-s5
                type: true_false
                text: "Zwei Hälften sind zusammen ein Ganzes."
                say: "Stimmt das? Zwei Hälften sind zusammen ein Ganzes."
                answer: true
                hints: ["Leg die beiden Hälften wieder zusammen."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Die Hälfte von 20 = _"
                say: "Was ist die Hälfte von zwanzig?"
                answer: "10"
              - id: l1-n2
                type: multiple_choice
                text: "Paul schneidet eine Pizza in ein großes und ein kleines Stück. Sind das Hälften?"
                say: "Paul schneidet eine Pizza in ein großes und ein kleines Stück. Sind das Hälften?"
                options: ["Nein, die Stücke sind nicht gleich groß.", "Ja, es sind zwei Stücke."]
                answer: "Nein, die Stücke sind nicht gleich groß."
              - id: l1-n3
                type: image_multiple_choice
                text: "Wo ist die Hälfte rot?"
                say: "Bei welchem Punktefeld ist genau die Hälfte rot?"
                options:
                  - { drawn: dots, array: [2, 4], split_rows: 1 }
                  - { drawn: dots, array: [4, 4], split_rows: 1 }
                  - { drawn: dots, array: [3, 2], split_rows: 1 }
                answer: "2x4"
              - id: l1-n4
                type: text_input
                text: "Die Hälfte von 30 ct = _ ct"
                say: "Was ist die Hälfte von dreißig Cent?"
                answer: "15"
              - id: l1-n5
                type: true_false
                text: "Wenn du ein Ganzes halbierst, sind beide Teile gleich groß."
                say: "Stimmt das? Wenn du ein Ganzes halbierst, sind beide Teile gleich groß."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Die Hälfte von 12 = _"
            say: "Was ist die Hälfte von zwölf?"
            answer: "6"
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Teil der Punkte ist rot?"
            say: "Welcher Teil der Punkte ist rot?"
            show: { drawn: dots, array: [2, 3], split_rows: 1 }
            options: ["die Hälfte", "ein Viertel", "alle"]
            answer: "die Hälfte"
          - id: l1-c3
            type: true_false
            text: "Lisa teilt einen Kuchen in 2 Stücke. Ein Stück ist viel größer. Das sind Hälften."
            say: "Lisa teilt einen Kuchen in zwei Stücke. Ein Stück ist viel größer als das andere. Stimmt das: Das sind Hälften?"
            answer: false

  - n: 2
    title: { de: "Viertel", en: "Quarters" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Die Hälfte von 8 = _"
            say: "Was ist die Hälfte von acht?"
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Die roten Punkte sind die Hälfte."
            say: "Stimmt das? Die roten Punkte sind die Hälfte."
            show: { drawn: dots, array: [2, 4], split_rows: 1 }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4 gleich große Teile: 4 Viertel"
            say: "Teilst du ein Ganzes in vier gleich große Teile, heißt jeder Teil ein Viertel. Vier Viertel sind zusammen das Ganze. Schneidest du eine Pizza in vier gleich große Stücke, ist jedes Stück ein Viertel."
          - text: "Ein Viertel von 12 Punkten sind 3 Punkte.\n12 : 4 = 3"
            say: "Hier sind zwölf Punkte in vier gleichen Reihen. Eine Reihe ist rot. Das ist ein Viertel: drei Punkte. Du rechnest zwölf geteilt durch vier, das ist drei."
            show: { drawn: dots, array: [4, 3], split_rows: 1 }
          - text: "Die Hälfte von der Hälfte ist ein Viertel.\n2 Viertel = 1 Hälfte"
            say: "Halbierst du eine Hälfte noch einmal, bekommst du ein Viertel. Ein Viertel ist also kleiner als eine Hälfte. Zwei Viertel sind so viel wie eine Hälfte."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Teil der Punkte ist rot?"
                say: "Welcher Teil der Punkte ist rot?"
                show: { drawn: dots, array: [4, 2], split_rows: 1 }
                options: ["ein Viertel", "die Hälfte", "alle"]
                answer: "ein Viertel"
                feedback:
                  "die Hälfte": "Bei der Hälfte wären rote und blaue Punkte gleich viele. Hier ist nur 1 von 4 Reihen rot."
                hints:
                  - "Zähl die Reihen."
                  - "Es sind 4 gleiche Reihen, eine davon ist rot."
                  - "ein Viertel."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Ein Viertel von 20 = _"
                say: "Was ist ein Viertel von zwanzig?"
                answer: "5"
                hints:
                  - "Teile in 4 gleich große Teile."
                  - "Rechne 20 : 4."
                  - "5."
              - id: l2-f3
                type: true_false
                text: "Eine Pizza wird in 4 gleich große Stücke geschnitten. Jedes Stück ist ein Viertel."
                say: "Stimmt das? Eine Pizza wird in vier gleich große Stücke geschnitten. Jedes Stück ist ein Viertel."
                answer: true
                hints:
                  - "Wie viele Stücke sind es?"
                  - "4 gleich große Teile heißen Viertel."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: multiple_choice
                text: "Wie viele Viertel sind so viel wie eine Hälfte?"
                say: "Wie viele Viertel sind so viel wie eine Hälfte?"
                options: ["2", "4", "1"]
                answer: "2"
                hints:
                  - "Ein Viertel ist die Hälfte von einer Hälfte."
                  - "Eine Hälfte teilst du in 2 Viertel."
                  - "2."
              - id: l2-f5
                type: multiple_choice
                text: "Wie viele Minuten sind eine Viertelstunde?"
                say: "Wie viele Minuten sind eine Viertelstunde?"
                options: ["15 Minuten", "25 Minuten", "4 Minuten"]
                answer: "15 Minuten"
                feedback:
                  "4 Minuten": "Ein Viertel heißt: durch 4 teilen. Rechne 60 Minuten : 4."
                hints:
                  - "Eine Stunde hat 60 Minuten."
                  - "Rechne 60 : 4."
                  - "15 Minuten."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "Ein Viertel von 16 = _"
                say: "Was ist ein Viertel von sechzehn?"
                answer: "4"
                hints: ["Rechne 16 : 4."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Wo ist ein Viertel rot?"
                say: "Bei welchem Punktefeld ist genau ein Viertel rot?"
                options:
                  - { drawn: dots, array: [4, 3], split_rows: 1 }
                  - { drawn: dots, array: [2, 3], split_rows: 1 }
                  - { drawn: dots, array: [3, 3], split_rows: 1 }
                answer: "4x3"
                hints: ["Bei einem Viertel ist eine von 4 gleichen Reihen rot."]
              - id: l2-s3
                type: true_false
                text: "Ein Viertel ist mehr als eine Hälfte."
                say: "Stimmt das? Ein Viertel ist mehr als eine Hälfte."
                answer: false
                hints: ["Je mehr Teile, desto kleiner ist jeder Teil."]
              - id: l2-s4
                type: multiple_choice
                text: "Vier Kinder teilen 24 Kirschen gerecht. Wie viele bekommt jedes Kind?"
                say: "Vier Kinder teilen vierundzwanzig Kirschen gerecht. Wie viele bekommt jedes Kind?"
                options: ["6", "12", "4"]
                answer: "6"
                hints: ["Rechne 24 : 4."]
              - id: l2-s5
                type: multiple_choice
                text: "Max schneidet ein Brot in 4 Stücke. Zwei sind dick, zwei sind dünn. Sind das Viertel?"
                say: "Max schneidet ein Brot in vier Stücke. Zwei sind dick, zwei sind dünn. Sind das Viertel?"
                options: ["Nein, die Stücke sind nicht gleich groß.", "Ja, es sind 4 Stücke."]
                answer: "Nein, die Stücke sind nicht gleich groß."
                hints: ["Viertel sind alle gleich groß."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Ein Viertel von 40 = _"
                say: "Was ist ein Viertel von vierzig?"
                answer: "10"
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Teil der Punkte ist rot?"
                say: "Welcher Teil der Punkte ist rot?"
                show: { drawn: dots, array: [4, 5], split_rows: 2 }
                options: ["die Hälfte", "ein Viertel", "alle"]
                answer: "die Hälfte"
              - id: l2-n3
                type: true_false
                text: "Drei Viertel und ein Viertel sind zusammen ein Ganzes."
                say: "Stimmt das? Drei Viertel und ein Viertel sind zusammen ein Ganzes."
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Was ist mehr: ein Viertel von 12 oder die Hälfte von 12?"
                say: "Was ist mehr: ein Viertel von zwölf oder die Hälfte von zwölf?"
                options: ["die Hälfte von 12", "ein Viertel von 12", "beides gleich viel"]
                answer: "die Hälfte von 12"
              - id: l2-n5
                type: text_input
                text: "Ein Viertel von 100 = _"
                say: "Was ist ein Viertel von hundert?"
                answer: "25"
                difficulty: stretch

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "Die Hälfte von 24 = _"
            say: "Was ist die Hälfte von vierundzwanzig?"
            answer: "12"
          - id: l2-c2
            type: text_input
            text: "Ein Viertel von 12 = _"
            say: "Was ist ein Viertel von zwölf?"
            answer: "3"
          - id: l2-c3
            type: image_multiple_choice
            text: "Wo ist die Hälfte rot?"
            say: "Bei welchem Punktefeld ist genau die Hälfte rot?"
            options:
              - { drawn: dots, array: [2, 5], split_rows: 1 }
              - { drawn: dots, array: [4, 5], split_rows: 1 }
              - { drawn: dots, array: [5, 2], split_rows: 1 }
            answer: "2x5"
          - id: l2-c4
            type: multiple_choice
            text: "Welcher Teil der Punkte ist rot?"
            say: "Welcher Teil der Punkte ist rot?"
            show: { drawn: dots, array: [4, 4], split_rows: 1 }
            options: ["ein Viertel", "die Hälfte", "alle"]
            answer: "ein Viertel"
          - id: l2-c5
            type: true_false
            text: "Tim teilt einen Apfel in 4 Stücke. Ein Stück ist viel größer als die anderen. Jedes Stück ist ein Viertel."
            say: "Tim teilt einen Apfel in vier Stücke. Ein Stück ist viel größer als die anderen. Stimmt das: Jedes Stück ist ein Viertel?"
            answer: false
