# Model lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.add-bridge-10
skill: math.add-sub-to-20.add-bridge-10
curriculum: de-DE
language: de
title:
  de: Plusaufgaben mit Zehnerübergang
  en: Adding across ten
summary: >
  Children add a one-digit number that crosses ten by filling up to ten
  first and adding the rest (8 + 5 = 8 + 2 + 3). Lesson 1 shows it on the
  Zwanzigerfeld, lesson 2 writes the split down and shows it on the
  Rechenstrich, lesson 3 uses it in short stories and ends with the skill
  check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 8
  builds_on: [math.add-sub-to-20.missing-addend, math.numbers-to-20.partition-to-10, math.add-sub-to-20.analog-to-20]
  also_practises: [math.word-problems.question-calc-answer]
  vocabulary: { de: [Zehnerübergang, bis zur 10 ergänzen, zerlegen, Zwanzigerfeld, Rechenstrich] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld, ten-frame, equation, rechenstrich, number-house, number-line]
  facets: [operation-signs]
  misconceptions:
    - id: count-all
      what: Counts every counter from 1 instead of using the ten
      addressed: lesson 1 Learn shows the full ten at a glance; hints say "Die erste Reihe ist voll. Das sind 10."
    - id: forget-rest
      what: Fills up to 10 and stops (8 + 5 = 10)
      addressed: feedback on the answer 10 in every lesson
    - id: wrong-split
      what: Splits the second number into the wrong parts (5 = 1 + 4 for 8 + 5)
      addressed: lesson 2 practises the split on its own before the sum
    - id: count-pictures
      what: Counts the pictures in a story task instead of calculating
      addressed: lesson 3 story tasks show one picture of the object, not the whole amount
    - id: count-on-start
      what: Counts on and includes the start number (8, 9, 10, 11, 12 for 8 + 5)
      addressed: hints point to the Rechenstrich jumps instead of counting
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-12

lessons:
  - n: 1
    title: { de: Erst bis zur 10, en: First make ten }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "8 + _ = 10"
            say: "Wie viele fehlen von 8 bis 10?"
            show: { drawn: ten-frame, filled: 8 }
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "5 = 2 + _"
            say: "Zerlege die 5. Zwei und wie viel?"
            show: { drawn: number-house, roof: 5, rows: [[2, null]] }
            options: ["2", "3", "4"]
            answer: "3"
            difficulty: easy
          - id: l1-w3
            type: multiple_choice
            text: "10 + 3 = _"
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
            options: ["12", "13", "14"]
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "8 + 5"
            say: "Wir rechnen 8 plus 5. Im ersten Zehnerfeld liegen 8 Plättchen, im zweiten 5."
            show: { drawn: zwanzigerfeld, filled: [8, 5] }
            character: pip-point
          - text: "8 + 2 = 10"
            say: "Zuerst machen wir die erste Reihe voll. Bis zur 10 fehlen 2. Wir schieben 2 Plättchen nach oben."
            show: { drawn: zwanzigerfeld, filled: [8, 5], move: 2 }
          - text: "10 + 3 = 13"
            say: "Jetzt ist oben die 10 voll. Unten liegen noch 3. 10 und 3 sind 13. Also ist 8 plus 5 gleich 13."
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
          - text: "9 + 4 = 13"
            say: "Noch einmal: 9 plus 4. Bis zur 10 fehlt 1. Von der 4 bleiben 3. 10 und 3 sind 13."
            show: { drawn: zwanzigerfeld, filled: [9, 4], move: 1 }
            character: pip-point

      - activity: practise
        support: full
        setting: plain
        tasks:
          - id: l1-p1
            type: drag_and_drop_count
            text: "Mach die 10 voll. Wie viele Plättchen schiebst du nach oben?"
            show: { drawn: zwanzigerfeld, filled: [7, 5] }
            total_items: 5
            answer: 3
            hints:
              - "Zähle die leeren Felder in der oberen Reihe."
              - "Oben liegen 7. 7 und wie viel sind 10?"
              - "Schiebe 3 Plättchen nach oben."
            difficulty: easy
          - id: l1-p2
            type: multiple_choice
            text: "7 + 5 = _"
            show: { drawn: zwanzigerfeld, filled: [10, 2] }
            options: ["11", "12", "13"]
            answer: "12"
            feedback: { "11": "Unten liegen noch 2. 10 und 2 sind 12.", "13": "Zähle unten nach: Es sind 2 Plättchen." }
            hints:
              - "Die obere Reihe ist voll. Das sind 10."
              - "Unten liegen noch 2 Plättchen."
              - "10 + 2 = ?"
            difficulty: easy
          - id: l1-p3
            type: multiple_choice
            text: "9 + 3 = _"
            show: { drawn: zwanzigerfeld, filled: [9, 3] }
            options: ["10", "11", "12"]
            answer: "12"
            feedback: { "10": "Bis zur 10 war richtig. Von der 3 sind noch 2 übrig.", "11": "Von der 3 gibst du 1 nach oben. Wie viele bleiben unten?" }
            hints:
              - "Wie viele fehlen von 9 bis 10?"
              - "1 Plättchen geht nach oben. Von der 3 bleiben 2."
              - "10 + 2 = ?"
            difficulty: core
          - id: l1-p4
            type: multiple_choice
            text: "8 + 6 = _"
            show: { drawn: zwanzigerfeld, filled: [8, 6] }
            options: ["13", "14", "15"]
            answer: "14"
            feedback: { "13": "Von der 6 gibst du 2 nach oben. Es bleiben 4.", "15": "Zähle nicht weiter. Es bleiben 4 übrig." }
            hints:
              - "Mach zuerst die 10 voll."
              - "8 und 2 sind 10. Von der 6 bleiben 4."
              - "10 + 4 = ?"
            difficulty: core
          - id: l1-p5
            type: multiple_choice
            text: "6 + 5 = _"
            show: { drawn: zwanzigerfeld, filled: [6, 5] }
            options: ["10", "11", "12"]
            answer: "11"
            feedback: { "10": "Die 10 ist voll, aber von der 5 ist noch 1 übrig.", "12": "Von der 5 gehen 4 nach oben. Es bleibt 1." }
            hints:
              - "Wie viele fehlen von 6 bis 10?"
              - "6 und 4 sind 10. Von der 5 bleibt 1."
              - "10 + 1 = ?"
            difficulty: core
          - id: l1-p6
            type: multiple_choice
            text: "9 + 6 = _"
            show: { drawn: zwanzigerfeld, filled: [9, 6] }
            options: ["14", "15", "16"]
            answer: "15"
            hints:
              - "Wie viele fehlen von 9 bis 10?"
              - "9 und 1 sind 10. Von der 6 bleiben 5."
              - "10 + 5 = ?"
            difficulty: core

      - activity: check
        size: quick
        tasks:
          - { id: l1-c1, type: multiple_choice, text: "8 + 4 = _", show: { drawn: zwanzigerfeld, filled: [8, 4] }, options: ["11", "12", "13"], answer: "12", difficulty: core }
          - { id: l1-c2, type: multiple_choice, text: "9 + 5 = _", show: { drawn: zwanzigerfeld, filled: [9, 5] }, options: ["13", "14", "15"], answer: "14", difficulty: core }
          - { id: l1-c3, type: multiple_choice, text: "7 + 4 = _", show: { drawn: zwanzigerfeld, filled: [7, 4] }, options: ["10", "11", "12"], answer: "11", difficulty: core }

  - n: 2
    title: { de: Zerlegen und weiterrechnen, en: Split and carry on }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - { id: l2-w1, type: multiple_choice, text: "8 + 3 = _", show: { drawn: zwanzigerfeld, filled: [8, 3] }, options: ["10", "11", "12"], answer: "11", difficulty: easy }
          - { id: l2-w2, type: multiple_choice, text: "9 + 2 = _", show: { drawn: zwanzigerfeld, filled: [9, 2] }, options: ["10", "11", "12"], answer: "11", difficulty: easy }

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 + 5 = 8 + 2 + 3"
            say: "Wir zerlegen die 5 in 2 und 3. Die 2 macht die 10 voll, die 3 kommt danach."
            show: { drawn: equation, text: "8 + 5 = _", split: "5 = 2 + 3" }
            character: pip-point
          - text: "8 → 10 → 13"
            say: "Auf dem Rechenstrich springen wir von 8 mit 2 bis zur 10 und dann mit 3 bis zur 13."
            show: { drawn: rechenstrich, start: 8, jumps: [2, 3] }
          - text: "7 + 6 = 7 + 3 + 3"
            say: "Bei 7 plus 6 fehlen bis zur 10 drei. Von der 6 bleiben auch 3. 10 und 3 sind 13."
            show: { drawn: rechenstrich, start: 7, jumps: [3, 3] }

      - activity: practise
        support: some
        setting: plain
        tasks:
          - id: l2-p1
            type: fill_in_blank
            text: "Zerlege die 6 so, dass die 10 voll wird."
            frame: "8 + 6 = 8 + _ + _"
            options: ["1", "2", "3", "4", "5"]
            answer: ["2", "4"]
            hints: ["Wie viele fehlen von 8 bis 10? Das ist die erste Zahl."]
            difficulty: core
          - id: l2-p2
            type: fill_in_blank
            text: "Zerlege die 5 so, dass die 10 voll wird."
            frame: "7 + 5 = 7 + _ + _"
            options: ["1", "2", "3", "4"]
            answer: ["3", "2"]
            hints: ["7 und wie viel sind 10?"]
            difficulty: core
          - id: l2-p3
            type: multiple_choice
            text: "Welcher Sprung kommt zuerst?"
            say: "Wir rechnen 9 plus 4. Mit welchem Sprung kommst du genau zur 10?"
            show: { drawn: rechenstrich, start: 9, jumps: [] }
            options: ["1", "3", "4"]
            answer: "1"
            hints: ["Von 9 bis 10 ist es nicht weit."]
            difficulty: easy
          - id: l2-p4
            type: point_on_line
            text: "Wo landest du? 9 + 4"
            show: { drawn: number-line, from: 0, to: 20, labels: tens, jumps: [[9, 1], [10, 3]] }
            answer: 13
            hints: ["Der erste Sprung endet bei 10. Dann noch 3 weiter."]
            difficulty: core
          - id: l2-p5
            type: multiple_choice
            text: "6 + 7 = _"
            show: { drawn: rechenstrich, start: 6, jumps: [4, 3] }
            options: ["12", "13", "14"]
            answer: "13"
            feedback: { "12": "Von der 7 gibst du 4 bis zur 10. Es bleiben 3, nicht 2.", "14": "Zähle die Sprünge: 4 und 3, das sind 7." }
            hints: ["Erst bis zur 10, dann den Rest."]
            difficulty: core
          - id: l2-p6
            type: true_false
            text: "Stimmt das? 8 + 5 = 8 + 1 + 4"
            say: "Ist das ein guter Weg über die 10? 8 plus 5 gleich 8 plus 1 plus 4."
            answer: false
            feedback: { "true": "8 + 1 ist 9, nicht 10. Mit 2 wird die 10 voll." }
            hints: ["Rechne 8 + 1. Ist das schon 10?"]
            difficulty: stretch

      - activity: practise
        support: none
        setting: plain
        tasks:
          - { id: l2-q1, type: text_input, text: "9 + 7 = _", answer: "16", difficulty: core }
          - { id: l2-q2, type: text_input, text: "8 + 8 = _", answer: "16", difficulty: core }
          - { id: l2-q3, type: text_input, text: "7 + 7 = _", answer: "14", difficulty: core }
          - { id: l2-q4, type: text_input, text: "6 + 6 = _", answer: "12", difficulty: core }

      - activity: check
        size: quick
        tasks:
          - { id: l2-c1, type: multiple_choice, text: "7 + 8 = _", options: ["14", "15", "16"], answer: "15", difficulty: core }
          - { id: l2-c2, type: fill_in_blank, text: "Zerlege die 4 so, dass die 10 voll wird.", frame: "9 + 4 = 9 + _ + _", options: ["1", "2", "3"], answer: ["1", "3"], difficulty: core }
          - { id: l2-c3, type: text_input, text: "6 + 9 = _", answer: "15", difficulty: stretch }

  - n: 3
    title: { de: Rechengeschichten, en: Number stories }
    new_content: false
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - { id: l3-w1, type: text_input, text: "8 + 7 = _", answer: "15", difficulty: core }
          - { id: l3-w2, type: fill_in_blank, text: "Zerlege die 6 so, dass die 10 voll wird.", frame: "7 + 6 = 7 + _ + _", options: ["2", "3", "4"], answer: ["3", "3"], difficulty: core }

      - activity: practise
        support: none
        setting: in-context
        tasks:
          - id: l3-p1
            type: multiple_choice
            text: "Lena hat 8 Murmeln. Sie bekommt 5 dazu. Wie viele Murmeln hat sie jetzt?"
            show: { object: marble }
            options: ["12", "13", "14"]
            answer: "13"
            difficulty: core
          - id: l3-p2
            type: multiple_choice
            text: "Im Bus sitzen 9 Kinder. An der Haltestelle steigen 4 Kinder ein. Wie viele Kinder sind jetzt im Bus?"
            show: { object: child }
            options: ["12", "13", "14"]
            answer: "13"
            difficulty: core
          - id: l3-p3
            type: multiple_choice
            text: "Welche Aufgabe passt? Tom hat 7 Sticker. Er bekommt 6 neue."
            options: ["7 + 6", "7 − 6", "6 + 6"]
            answer: "7 + 6"
            difficulty: core
          - id: l3-p4
            type: text_input
            text: "Mia pflückt 6 Äpfel. Ihr Bruder pflückt 7 Äpfel. Wie viele Äpfel sind es zusammen?"
            show: { object: apple }
            answer: "13"
            difficulty: stretch

      - activity: check
        size: skill
        tasks:
          - { id: l3-c1, type: multiple_choice, text: "8 + 6 = _", options: ["13", "14", "15"], answer: "14", difficulty: core }
          - { id: l3-c2, type: multiple_choice, text: "9 + 8 = _", options: ["16", "17", "18"], answer: "17", difficulty: core }
          - { id: l3-c3, type: fill_in_blank, text: "Zerlege die 7 so, dass die 10 voll wird.", frame: "5 + 7 = 5 + _ + _", options: ["2", "3", "4", "5"], answer: ["5", "2"], difficulty: core }
          - { id: l3-c4, type: text_input, text: "7 + 5 = _", answer: "12", difficulty: core }
          - { id: l3-c5, type: multiple_choice, text: "Paul hat 9 Bälle. Er bekommt 3 dazu. Wie viele Bälle hat er jetzt?", show: { object: ball }, options: ["11", "12", "13"], answer: "12", difficulty: core }
