# Model lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.add-bridge-10
skill: math.add-sub-to-20.add-bridge-10
curriculum: de-DE
language: de
title:
  de: Plusaufgaben mit Zehnerübergang
  en: Adding across ten
summary: >
  Children add a one-digit number that crosses ten by filling up to ten
  first and adding the rest (8 + 5 = 8 + 2 + 3). Lesson 1 shows it on the
  Zwanzigerfeld, lesson 2 writes the split down and shows it on the
  Rechenstrich, lesson 3 uses it in short stories and ends with the skill
  check. Every lesson practises in three stages: full hints, one hint, no
  hints.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 12
  builds_on:
    [
      math.add-sub-to-20.missing-addend,
      math.numbers-to-20.partition-to-10,
      math.add-sub-to-20.analog-to-20,
    ]
  also_practises: [math.word-problems.question-calc-answer]
  vocabulary:
    {
      de:
        [
          Zehnerübergang,
          bis zur 10 ergänzen,
          zerlegen,
          Zwanzigerfeld,
          Rechenstrich,
        ],
    }
  forms: [drawn, text, audio, picture]
  drawn:
    [
      zwanzigerfeld,
      ten-frame,
      equation,
      rechenstrich,
      number-house,
      number-line,
    ]
  facets: [operation-signs]
  misconceptions:
    - id: count-all
      what: Counts every counter from 1 instead of using the ten
      addressed: lesson 1 Learn shows the full ten at a glance; full-hint tasks start with "Mach zuerst die 10 voll."
    - id: forget-rest
      what: Fills up to 10 and stops (8 + 5 = 10)
      addressed: the answer 10 is an option with its own feedback in lessons 1 and 2
    - id: wrong-split
      what: Splits the second number into the wrong parts (5 = 1 + 4 for 8 + 5)
      addressed: lesson 2 practises the split on its own before the sum, and asks once whether a wrong split works
    - id: count-pictures
      what: Counts the pictures in a story task instead of calculating
      addressed: lesson 3 story tasks show one picture of the object, not the whole amount
    - id: count-on-start
      what: Counts on and includes the start number (8, 9, 10, 11, 12 for 8 + 5)
      addressed: hints point to the Rechenstrich jumps instead of counting
  twist_reuse: []
  status: draft
  version: 2
  authored: 2026-10-12

lessons:
  - n: 1
    title: { de: Erst bis zur 10, en: First make ten }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "8 + _ = 10"
            say: "Wie viele fehlen von 8 bis 10?"
            show: { drawn: ten-frame, filled: 8 }
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "5 = 2 + _"
            say: "Zerlege die 5. Zwei und wie viel?"
            show: { drawn: number-house, roof: 5, rows: [[2, null]] }
            options: ["2", "3", "4"]
            answer: "3"
            difficulty: easy
          - id: l1-w3
            type: multiple_choice
            text: "10 + 3 = _"
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
            options: ["12", "13", "14"]
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "8 + 5"
            say: "Wir rechnen 8 plus 5. Im ersten Zehnerfeld liegen 8 Plättchen, im zweiten 5."
            show: { drawn: zwanzigerfeld, filled: [8, 5] }
          - text: "8 + 2 = 10"
            say: "Zuerst machen wir die erste Reihe voll. Bis zur 10 fehlen 2. Wir schieben 2 Plättchen nach oben."
            show: { drawn: zwanzigerfeld, filled: [8, 5], move: 2 }
          - text: "10 + 3 = 13"
            say: "Jetzt ist oben die 10 voll. Unten liegen noch 3. 10 und 3 sind 13. Also ist 8 plus 5 gleich 13."
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
          - text: "9 + 4 = 13"
            say: "Noch einmal: 9 plus 4. Bis zur 10 fehlt 1. Von der 4 bleiben 3. 10 und 3 sind 13."
            show: { drawn: zwanzigerfeld, filled: [9, 4], move: 1 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: drag_and_drop_count
                text: "Mach die 10 voll. Wie viele Plättchen schiebst du nach oben?"
                show: { drawn: zwanzigerfeld, filled: [7, 5] }
                total_items: 5
                answer: 3
                hints:
                  - "Zähle die leeren Felder in der oberen Reihe."
                  - "Oben liegen 7. 7 und wie viel sind 10?"
                  - "Schiebe 3 Plättchen nach oben."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "7 + 5 = _"
                show: { drawn: zwanzigerfeld, filled: [7, 5] }
                options: ["10", "12", "13"]
                answer: "12"
                feedback:
                  "10": "Die 10 ist voll. Unten liegen aber noch 2 Plättchen."
                  "13": "Zähle unten nach: Es sind 2 Plättchen, nicht 3."
                hints:
                  - "Mach zuerst die 10 voll."
                  - "7 und 3 sind 10. Von der 5 bleiben unten 2."
                  - "10 + 2 = ?"
                difficulty: easy
              - id: l1-f3
                type: multiple_choice
                text: "9 + 3 = _"
                show: { drawn: zwanzigerfeld, filled: [9, 3] }
                options: ["10", "11", "12"]
                answer: "12"
                feedback:
                  "10": "Bis zur 10 war richtig. Von der 3 sind noch 2 übrig."
                  "11": "Von der 3 gibst du nur 1 nach oben. Wie viele bleiben unten?"
                hints:
                  - "Oben fehlt nur ein Plättchen."
                  - "9 und 1 sind 10. Von der 3 bleiben 2."
                  - "10 + 2 = ?"
              - id: l1-f4
                type: multiple_choice
                text: "8 + 6 = _"
                show: { drawn: zwanzigerfeld, filled: [8, 6] }
                options: ["13", "14", "15"]
                answer: "14"
                feedback:
                  "13": "Von der 6 gibst du 2 nach oben. Es bleiben 4, nicht 3."
                  "15": "Hast du die 8 mitgezählt? Oben ist die 10, unten bleiben 4."
                hints:
                  - "Wie viele Plättchen musst du nach oben schieben?"
                  - "8 und 2 sind 10. Von der 6 bleiben 4."
                  - "10 + 4 = ?"
              - id: l1-f5
                type: multiple_choice
                text: "6 + 5 = _"
                show: { drawn: zwanzigerfeld, filled: [6, 5] }
                options: ["10", "11", "12"]
                answer: "11"
                feedback:
                  "10": "Die 10 ist voll, aber von der 5 ist noch 1 übrig."
                  "12": "Oben fehlen 4. Von der 5 bleibt dann nur 1."
                hints:
                  - "Oben liegen 6. Wie viele Felder sind noch frei?"
                  - "6 und 4 sind 10. Von der 5 bleibt 1."
                  - "10 + 1 = ?"
              - id: l1-f6
                type: multiple_choice
                text: "9 + 6 = _"
                show: { drawn: zwanzigerfeld, filled: [9, 6] }
                options: ["14", "15", "16"]
                answer: "15"
                hints:
                  - "Mach die erste Reihe voll."
                  - "Ein Plättchen nach oben. Unten bleiben 5."
                  - "10 + 5 = ?"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "8 + 3 = _"
                show: { drawn: zwanzigerfeld, filled: [8, 3] }
                options: ["10", "11", "12"]
                answer: "11"
                hints: ["Wie viele fehlen von 8 bis 10?"]
              - id: l1-s2
                type: multiple_choice
                text: "7 + 6 = _"
                show: { drawn: zwanzigerfeld, filled: [7, 6] }
                options: ["12", "13", "14"]
                answer: "13"
                hints: ["Schiebe zuerst 3 Plättchen nach oben."]
              - id: l1-s3
                type: multiple_choice
                text: "9 + 5 = _"
                show: { drawn: zwanzigerfeld, filled: [9, 5] }
                options: ["13", "14", "15"]
                answer: "14"
                hints: ["Oben fehlt nur eins."]
              - id: l1-s4
                type: drag_and_drop_count
                text: "Mach die 10 voll. Wie viele Plättchen schiebst du nach oben?"
                show: { drawn: zwanzigerfeld, filled: [6, 6] }
                total_items: 6
                answer: 4
                hints: ["Zähle die leeren Felder oben."]
              - id: l1-s5
                type: multiple_choice
                text: "6 + 6 = _"
                show: { drawn: zwanzigerfeld, filled: [6, 6] }
                options: ["11", "12", "13"]
                answer: "12"
                hints: ["Du hast eben 4 nach oben geschoben. Wie viele bleiben unten?"]
              - id: l1-s6
                type: multiple_choice
                text: "8 + 7 = _"
                show: { drawn: zwanzigerfeld, filled: [8, 7] }
                options: ["14", "15", "16"]
                answer: "15"
                hints: ["8 und 2 sind 10."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "9 + 2 = _"
                show: { drawn: zwanzigerfeld, filled: [9, 2] }
                options: ["10", "11", "12"]
                answer: "11"
                difficulty: easy
              - id: l1-n2
                type: multiple_choice
                text: "7 + 7 = _"
                show: { drawn: zwanzigerfeld, filled: [7, 7] }
                options: ["13", "14", "15"]
                answer: "14"
              - id: l1-n3
                type: multiple_choice
                text: "8 + 5 = _"
                show: { drawn: zwanzigerfeld, filled: [8, 5] }
                options: ["12", "13", "14"]
                answer: "13"
              - id: l1-n4
                type: multiple_choice
                text: "6 + 7 = _"
                show: { drawn: zwanzigerfeld, filled: [6, 7] }
                options: ["12", "13", "14"]
                answer: "13"
              - id: l1-n5
                type: multiple_choice
                text: "5 + 6 = _"
                options: ["10", "11", "12"]
                answer: "11"
                difficulty: stretch

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "8 + 4 = _"
            show: { drawn: zwanzigerfeld, filled: [8, 4] }
            options: ["11", "12", "13"]
            answer: "12"
          - id: l1-c2
            type: multiple_choice
            text: "9 + 7 = _"
            show: { drawn: zwanzigerfeld, filled: [9, 7] }
            options: ["15", "16", "17"]
            answer: "16"
          - id: l1-c3
            type: multiple_choice
            text: "7 + 4 = _"
            options: ["10", "11", "12"]
            answer: "11"

  - n: 2
    title: { de: Zerlegen und weiterrechnen, en: Split and carry on }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "8 + 4 = _"
            show: { drawn: zwanzigerfeld, filled: [8, 4] }
            options: ["11", "12", "13"]
            answer: "12"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "9 + 3 = _"
            show: { drawn: zwanzigerfeld, filled: [9, 3] }
            options: ["11", "12", "13"]
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 + 5 = 8 + 2 + 3"
            say: "Wir zerlegen die 5 in 2 und 3. Die 2 macht die 10 voll, die 3 kommt danach."
            show: { drawn: equation, text: "8 + 5 = _", split: "5 = 2 + 3" }
          - text: "8 → 10 → 13"
            say: "Auf dem Rechenstrich springen wir von 8 mit 2 bis zur 10 und dann mit 3 bis zur 13."
            show: { drawn: rechenstrich, start: 8, jumps: [2, 3] }
          - text: "7 + 6 = 7 + 3 + 3"
            say: "Bei 7 plus 6 fehlen bis zur 10 drei. Von der 6 bleiben auch 3. 10 und 3 sind 13."
            show: { drawn: rechenstrich, start: 7, jumps: [3, 3] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Zerlege die 6 so, dass die 10 voll wird."
                frame: "8 + 6 = 8 + _ + _"
                options: ["1", "2", "3", "4", "5"]
                answer: ["2", "4"]
                hints:
                  - "Wie viele fehlen von 8 bis 10? Das ist die erste Zahl."
                  - "8 und 2 sind 10. Von der 6 bleiben 4."
                  - "8 + 6 = 8 + 2 + 4"
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Zerlege die 5 so, dass die 10 voll wird."
                frame: "7 + 5 = 7 + _ + _"
                options: ["1", "2", "3", "4"]
                answer: ["3", "2"]
                hints:
                  - "Fang bei der 7 an. Wie weit ist es bis zur 10?"
                  - "7 und 3 sind 10. Die 5 hat dann noch 2."
                  - "7 + 5 = 7 + 3 + 2"
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Sprung kommt zuerst?"
                say: "Wir rechnen 9 plus 4. Mit welchem Sprung kommst du genau zur 10?"
                show: { drawn: rechenstrich, start: 9, jumps: [] }
                options: ["1", "3", "4"]
                answer: "1"
                feedback:
                  "4": "Mit 4 springst du über die 10 hinaus. Der erste Sprung endet genau bei 10."
                hints:
                  - "Der erste Sprung endet genau bei 10."
                  - "Von 9 bis 10 ist es nur ein kleiner Schritt."
                  - "Springe 1."
                difficulty: easy
              - id: l2-f4
                type: point_on_line
                text: "Wo landest du? 9 + 4"
                show: { drawn: number-line, from: 0, to: 20, labels: tens, jumps: [[9, 1], [10, 3]] }
                answer: 13
                hints:
                  - "Erst bis zur 10, dann den Rest."
                  - "Von 9 springst du 1 bis zur 10. Dann noch 3."
                  - "Du landest 3 hinter der 10."
              - id: l2-f5
                type: multiple_choice
                text: "6 + 7 = _"
                show: { drawn: rechenstrich, start: 6, jumps: [4, 3] }
                options: ["12", "13", "14"]
                answer: "13"
                feedback:
                  "12": "Von der 7 gibst du 4 bis zur 10. Es bleiben 3, nicht 2."
                  "14": "Schau auf die Sprünge: 4 und 3, das sind zusammen 7."
                hints:
                  - "Schau auf die zwei Sprünge."
                  - "6 und 4 sind 10. Dann springst du noch 3."
                  - "10 + 3 = ?"
              - id: l2-f6
                type: fill_in_blank
                text: "Zerlege die 8 so, dass die 10 voll wird."
                frame: "9 + 8 = 9 + _ + _"
                options: ["1", "2", "6", "7"]
                answer: ["1", "7"]
                hints:
                  - "Bei der 9 fehlt nicht mehr viel bis zur 10."
                  - "9 und 1 sind 10. Von der 8 bleiben 7."
                  - "9 + 8 = 9 + 1 + 7"

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Zerlege die 5 so, dass die 10 voll wird."
                frame: "9 + 5 = 9 + _ + _"
                options: ["1", "2", "3", "4"]
                answer: ["1", "4"]
                hints: ["9 und wie viel sind 10?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Zerlege die 8 so, dass die 10 voll wird."
                frame: "6 + 8 = 6 + _ + _"
                options: ["2", "3", "4", "5"]
                answer: ["4", "4"]
                hints: ["Von 6 bis 10 sind es 4."]
              - id: l2-s3
                type: multiple_choice
                text: "Welcher Sprung kommt zuerst?"
                say: "Wir rechnen 7 plus 6. Mit welchem Sprung kommst du genau zur 10?"
                show: { drawn: rechenstrich, start: 7, jumps: [] }
                options: ["2", "3", "6"]
                answer: "3"
                hints: ["Zähle von 7 bis 10."]
              - id: l2-s4
                type: point_on_line
                text: "Wo landest du? 8 + 5"
                show: { drawn: number-line, from: 0, to: 20, labels: tens, jumps: [[8, 2], [10, 3]] }
                answer: 13
                hints: ["Der erste Sprung endet bei 10."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? 8 + 5 = 8 + 1 + 4"
                say: "Ist das ein guter Weg über die 10? 8 plus 5 gleich 8 plus 1 plus 4."
                answer: false
                hints: ["Rechne 8 + 1. Bist du dann schon bei 10?"]
                difficulty: stretch
              - id: l2-s6
                type: multiple_choice
                text: "7 + 8 = _"
                show: { drawn: rechenstrich, start: 7, jumps: [3, 5] }
                options: ["14", "15", "16"]
                answer: "15"
                hints: ["Der erste Sprung ist 3. Wie groß ist der zweite?"]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "9 + 7 = _"
                answer: "16"
              - id: l2-n2
                type: text_input
                text: "8 + 8 = _"
                answer: "16"
              - id: l2-n3
                type: fill_in_blank
                text: "Zerlege die 7 so, dass die 10 voll wird."
                frame: "8 + 7 = 8 + _ + _"
                options: ["2", "3", "4", "5"]
                answer: ["2", "5"]
              - id: l2-n4
                type: text_input
                text: "7 + 7 = _"
                answer: "14"
              - id: l2-n5
                type: text_input
                text: "6 + 6 = _"
                answer: "12"
              - id: l2-n6
                type: point_on_line
                text: "Wo landest du? 6 + 9"
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 15
                difficulty: stretch

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "7 + 9 = _"
            options: ["15", "16", "17"]
            answer: "16"
          - id: l2-c2
            type: fill_in_blank
            text: "Zerlege die 4 so, dass die 10 voll wird."
            frame: "9 + 4 = 9 + _ + _"
            options: ["1", "2", "3"]
            answer: ["1", "3"]
          - id: l2-c3
            type: text_input
            text: "6 + 9 = _"
            answer: "15"
            difficulty: stretch

  - n: 3
    title: { de: Rechengeschichten, en: Number stories }
    new_content: false
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: text_input
            text: "8 + 7 = _"
            answer: "15"
          - id: l3-w2
            type: fill_in_blank
            text: "Zerlege die 6 so, dass die 10 voll wird."
            frame: "7 + 6 = 7 + _ + _"
            options: ["2", "3", "4"]
            answer: ["3", "3"]

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Lena hat 8 Murmeln. Sie bekommt 5 dazu. Wie viele Murmeln hat sie jetzt?"
                show: { object: marble }
                options: ["12", "13", "14"]
                answer: "13"
                hints:
                  - "Was weißt du? Lena hat 8 und bekommt 5 dazu."
                  - "Dazu bekommen heißt plus: 8 + 5. Mach zuerst die 10 voll."
                  - "8 + 2 = 10, dann noch 3."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "Im Bus sitzen 9 Kinder. An der Haltestelle steigen 4 Kinder ein. Wie viele Kinder sind jetzt im Bus?"
                show: { object: child }
                options: ["12", "13", "14"]
                answer: "13"
                hints:
                  - "Steigen Kinder ein oder aus?"
                  - "Sie steigen ein, also kommen welche dazu: 9 + 4."
                  - "9 + 1 = 10, dann noch 3."
              - id: l3-f3
                type: multiple_choice
                text: "Welche Aufgabe passt? Tom hat 7 Sticker. Er bekommt 6 neue."
                options: ["7 + 6", "7 − 6", "6 + 6"]
                answer: "7 + 6"
                feedback:
                  "7 − 6": "Tom gibt keine Sticker weg. Er bekommt welche dazu."
                  "6 + 6": "Tom hat am Anfang 7 Sticker, nicht 6."
                hints:
                  - "Bekommt Tom Sticker dazu oder gibt er welche weg?"
                  - "Er bekommt welche dazu. Also rechnest du plus."
                  - "Er hat 7 und bekommt 6."
              - id: l3-f4
                type: multiple_choice
                text: "Ben hat 6 Äpfel im Korb. Er pflückt noch 6. Wie viele Äpfel hat er jetzt?"
                show: { object: apple }
                options: ["11", "12", "13"]
                answer: "12"
                hints:
                  - "Welche Zahlen kommen in der Geschichte vor?"
                  - "6 + 6. Von 6 bis 10 fehlen 4."
                  - "Von der zweiten 6 bleiben 2. 10 + 2 = ?"
              - id: l3-f5
                type: multiple_choice
                text: "Im Karton liegen 9 Eier. Papa legt 3 dazu. Wie viele Eier sind jetzt im Karton?"
                show: { object: egg }
                options: ["11", "12", "13"]
                answer: "12"
                hints:
                  - "Wie viele Eier waren zuerst im Karton?"
                  - "9 + 3. Mit 1 ist die 10 voll."
                  - "Von der 3 bleiben 2. 10 + 2 = ?"

          - support: some
            tasks:
              - id: l3-s1
                type: text_input
                text: "Mia pflückt 6 Äpfel. Ihr Bruder pflückt 7 Äpfel. Wie viele Äpfel sind es zusammen?"
                show: { object: apple }
                answer: "13"
                hints: ["Zusammen heißt plus. Mach zuerst die 10 voll."]
              - id: l3-s2
                type: multiple_choice
                text: "Auf dem Spielplatz spielen 8 Kinder. 6 Kinder kommen dazu. Wie viele Kinder spielen jetzt?"
                show: { object: child }
                options: ["13", "14", "15"]
                answer: "14"
                hints: ["8 und 2 sind 10."]
              - id: l3-s3
                type: multiple_choice
                text: "Welche Aufgabe passt? Anna hat 9 Bücher. Sie leiht sich 5 dazu."
                options: ["9 + 5", "9 − 5", "5 + 5"]
                answer: "9 + 5"
                hints: ["Hat Anna danach mehr oder weniger Bücher?"]
              - id: l3-s4
                type: multiple_choice
                text: "Lukas hat 7 Luftballons. Zum Geburtstag bekommt er 5 dazu. Wie viele Luftballons hat er jetzt?"
                show: { object: balloon }
                options: ["11", "12", "13"]
                answer: "12"
                hints: ["7 und 3 sind 10."]
              - id: l3-s5
                type: multiple_choice
                text: "Ein Hase frisst am Morgen 8 Möhren und am Abend 4. Wie viele Möhren frisst er an diesem Tag?"
                show: { object: carrot }
                options: ["11", "12", "13"]
                answer: "12"
                hints: ["Morgen und Abend zusammen: 8 + 4."]

          - support: none
            tasks:
              - id: l3-n1
                type: text_input
                text: "In einer Kiste sind 9 Bälle. Die Lehrerin legt 6 Bälle dazu. Wie viele Bälle sind jetzt in der Kiste?"
                show: { object: ball }
                answer: "15"
              - id: l3-n2
                type: multiple_choice
                text: "Sara hat 8 Sticker. Ihre Freundin schenkt ihr 8. Wie viele Sticker hat Sara jetzt?"
                show: { object: sticker }
                options: ["15", "16", "17"]
                answer: "16"
              - id: l3-n3
