# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.time-durations
skill: math.time.durations
curriculum: de-DE
language: de
title:
  de: Zeitpunkt und Zeitspanne
  en: Points in time and durations
summary: >
  Lesson 1 tells a Zeitpunkt (um 8:15) from a Zeitspanne (45 Minuten) and
  works out how long something lasts by jumping to the next full hour
  (8:15 bis 9:00 sind 45 Minuten); lesson 2 works out when something ends
  or starts from its length, over the full hour too, and ends with the
  skill check.
metadata:
  year: klasse-3
  topic: { de: Uhrzeit, en: Time }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.time.five-minutes, math.add-sub-to-100.complement]
  also_practises: [math.time.minutes, math.add-sub-to-100.complement]
  vocabulary: { de: [Zeitpunkt, Zeitspanne, dauern, beginnen, enden, volle Stunde] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: []
  misconceptions:
    - id: hundred-minute-hour
      what: Subtracts times like numbers (9:10 − 8:50 = 60 Minuten, as if 910 − 850)
      addressed: lesson 1 Learn jumps to the full hour; l1-f4, l1-n4 and l2-s4 take the number subtraction as a wrong claim
    - id: point-span-mixup
      what: Answers a Zeitpunkt when asked for a Zeitspanne, or the other way round
      addressed: lesson 1 Learn sorts both kinds; "Zeitpunkt oder Zeitspanne?" in every stage of lesson 1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wie lange dauert es?", en: "How long does it take?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "15 + _ = 60"
            say: "Fünfzehn plus wie viel ist sechzig?"
            answer: "45"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 8, minute: 15, digital: true }
            options: ["Viertel nach 8", "Viertel vor 8", "halb 9"]
            answer: "Viertel nach 8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Zeitpunkt: um 8:15 | Zeitspanne: 45 Minuten"
            say: "Ein Zeitpunkt sagt, wann etwas ist: Die Schule beginnt um acht Uhr fünfzehn. Eine Zeitspanne sagt, wie lange etwas dauert: Die Schulstunde dauert fünfundvierzig Minuten."
          - text: "8:15 bis 9:00 | 45 Minuten"
            say: "Wie lange ist es von acht Uhr fünfzehn bis neun Uhr? Bis zur vollen Stunde fehlen fünfundvierzig Minuten."
            show: { drawn: clock, hour: 8, minute: 15 }
          - text: "8:40 bis 9:10 | 20 Minuten + 10 Minuten = 30 Minuten"
            say: "Geht es über die volle Stunde, springst du zuerst bis zur vollen Stunde: Von acht Uhr vierzig bis neun Uhr sind zwanzig Minuten. Dann noch zehn Minuten bis neun Uhr zehn. Zusammen sind es dreißig Minuten."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Der Bus fährt um 7:30 ab. Zeitpunkt oder Zeitspanne?"
                say: "Der Bus fährt um sieben Uhr dreißig ab. Ist das ein Zeitpunkt oder eine Zeitspanne?"
                options: ["Zeitpunkt", "Zeitspanne"]
                keep_order: true
                answer: "Zeitpunkt"
                hints:
                  - "Sagt die Zeit, wann etwas passiert, oder wie lange es dauert?"
                  - "Um sieben Uhr dreißig: Das sagt, wann."
                  - "Zeitpunkt."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Von 10:20 bis 11:00. Wie viele Minuten sind das?"
                say: "Von zehn Uhr zwanzig bis elf Uhr. Wie viele Minuten sind das?"
                answer: "40"
                hints:
                  - "Wie viele Minuten fehlen bis zur vollen Stunde?"
                  - "Zwanzig plus wie viel ist sechzig?"
                  - "40 Minuten."
              - id: l1-f3
                type: text_input
                text: "Von 2:50 bis 3:15. Wie viele Minuten sind das?"
                say: "Von zwei Uhr fünfzig bis drei Uhr fünfzehn. Wie viele Minuten sind das?"
                answer: "25"
                hints:
                  - "Spring zuerst bis zur vollen Stunde."
                  - "Bis drei Uhr sind es zehn Minuten, dann noch fünfzehn."
                  - "25 Minuten."
              - id: l1-f4
                type: true_false
                text: "Von 9:50 bis 10:10 sind es 60 Minuten. Stimmt das?"
                say: "Von neun Uhr fünfzig bis zehn Uhr zehn sind es sechzig Minuten. Stimmt das?"
                answer: false
                hints:
                  - "Eine Stunde hat nur sechzig Minuten. Spring zur vollen Stunde."
                  - "Zehn Minuten bis zehn Uhr, dann noch zehn."
                  - "Nein. Es sind 20 Minuten."
              - id: l1-f5
                type: multiple_choice
                text: "Das Training dauert von 16:00 bis 17:30. Wie lange ist das?"
                say: "Das Training dauert von sechzehn Uhr bis siebzehn Uhr dreißig. Wie lange ist das?"
                options: ["1 Stunde 30 Minuten", "30 Minuten", "1 Stunde 70 Minuten"]
                answer: "1 Stunde 30 Minuten"
                hints:
                  - "Von sechzehn bis siebzehn Uhr ist eine Stunde."
                  - "Dann noch dreißig Minuten."
                  - "1 Stunde 30 Minuten."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Der Film dauert 90 Minuten. Zeitpunkt oder Zeitspanne?"
                say: "Der Film dauert neunzig Minuten. Ist das ein Zeitpunkt oder eine Zeitspanne?"
                options: ["Zeitpunkt", "Zeitspanne"]
                keep_order: true
                answer: "Zeitspanne"
                hints: ["Sagt die Zeit, wann oder wie lange?"]
              - id: l1-s2
                type: text_input
                text: "Von 6:35 bis 7:00. Wie viele Minuten sind das?"
                say: "Von sechs Uhr fünfunddreißig bis sieben Uhr. Wie viele Minuten sind das?"
                answer: "25"
                hints: ["Fünfunddreißig plus wie viel ist sechzig?"]
              - id: l1-s3
                type: text_input
                text: "Von 11:45 bis 12:20. Wie viele Minuten sind das?"
                say: "Von elf Uhr fünfundvierzig bis zwölf Uhr zwanzig. Wie viele Minuten sind das?"
                answer: "35"
                hints: ["Fünfzehn Minuten bis zwölf Uhr, dann noch zwanzig."]
              - id: l1-s4
                type: true_false
                text: "Von 13:40 bis 14:00 sind es 20 Minuten. Stimmt das?"
                say: "Von dreizehn Uhr vierzig bis vierzehn Uhr sind es zwanzig Minuten. Stimmt das?"
                answer: true
                hints: ["Wie viele Minuten fehlen bis zur vollen Stunde?"]
              - id: l1-s5
                type: multiple_choice
                text: "Der Ausflug dauert von 9:00 bis 11:15. Wie lange ist das?"
                say: "Der Ausflug dauert von neun Uhr bis elf Uhr fünfzehn. Wie lange ist das?"
                options: ["2 Stunden 15 Minuten", "2 Stunden", "1 Stunde 15 Minuten"]
                answer: "2 Stunden 15 Minuten"
                hints: ["Zähle zuerst die ganzen Stunden."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Das Konzert beginnt um 19 Uhr. Zeitpunkt oder Zeitspanne?"
                say: "Das Konzert beginnt um neunzehn Uhr. Ist das ein Zeitpunkt oder eine Zeitspanne?"
                options: ["Zeitpunkt", "Zeitspanne"]
                keep_order: true
                answer: "Zeitpunkt"
              - id: l1-n2
                type: text_input
                text: "Von 4:05 bis 5:00. Wie viele Minuten sind das?"
                say: "Von vier Uhr fünf bis fünf Uhr. Wie viele Minuten sind das?"
                answer: "55"
              - id: l1-n3
                type: text_input
                text: "Von 7:55 bis 8:30. Wie viele Minuten sind das?"
                say: "Von sieben Uhr fünfundfünfzig bis acht Uhr dreißig. Wie viele Minuten sind das?"
                answer: "35"
              - id: l1-n4
                type: true_false
                text: "Von 10:45 bis 11:05 sind es 60 Minuten. Stimmt das?"
                say: "Von zehn Uhr fünfundvierzig bis elf Uhr fünf sind es sechzig Minuten. Stimmt das?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Die Fahrt dauert von 14:30 bis 16:00. Wie lange ist das?"
                say: "Die Fahrt dauert von vierzehn Uhr dreißig bis sechzehn Uhr. Wie lange ist das?"
                options: ["1 Stunde 30 Minuten", "2 Stunden 30 Minuten", "1 Stunde 70 Minuten"]
                answer: "1 Stunde 30 Minuten"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Von 3:25 bis 4:00. Wie viele Minuten sind das?"
            say: "Von drei Uhr fünfundzwanzig bis vier Uhr. Wie viele Minuten sind das?"
            answer: "35"
          - id: l1-c2
            type: text_input
            text: "Von 8:50 bis 9:30. Wie viele Minuten sind das?"
            say: "Von acht Uhr fünfzig bis neun Uhr dreißig. Wie viele Minuten sind das?"
            answer: "40"
          - id: l1-c3
            type: multiple_choice
            text: "Die Pause dauert 20 Minuten. Zeitpunkt oder Zeitspanne?"
            say: "Die Pause dauert zwanzig Minuten. Ist das ein Zeitpunkt oder eine Zeitspanne?"
            options: ["Zeitpunkt", "Zeitspanne"]
            keep_order: true
            answer: "Zeitspanne"

  - n: 2
    title: { de: "Wann endet es?", en: "When does it end?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Von 5:40 bis 6:00. Wie viele Minuten sind das?"
            say: "Von fünf Uhr vierzig bis sechs Uhr. Wie viele Minuten sind das?"
            answer: "20"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "40 + 35 = _"
            say: "Vierzig plus fünfunddreißig."
            answer: "75"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Beginn 10:20 | Dauer 25 Minuten | Ende 10:45"
            say: "Ein Spiel beginnt um zehn Uhr zwanzig und dauert fünfundzwanzig Minuten. Zwanzig plus fünfundzwanzig sind fünfundvierzig. Es endet um zehn Uhr fünfundvierzig."
          - text: "Beginn 9:40 | Dauer 35 Minuten | 9:40 + 20 = 10:00 | 10:00 + 15 = 10:15"
            say: "Geht es über die volle Stunde, zerlegst du die Zeitspanne: Bis zehn Uhr sind es zwanzig Minuten. Von den fünfunddreißig bleiben fünfzehn. Es endet um zehn Uhr fünfzehn."
          - text: "Ende 12:00 | Dauer 45 Minuten | Beginn 11:15"
            say: "Andersherum: Etwas endet um zwölf Uhr und hat fünfundvierzig Minuten gedauert. Dann hat es um elf Uhr fünfzehn begonnen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Der Kuchen kommt um 15:10 in den Ofen und backt 40 Minuten. Wann ist er fertig?"
                say: "Der Kuchen kommt um fünfzehn Uhr zehn in den Ofen und backt vierzig Minuten. Wann ist er fertig?"
                options: ["15:50", "15:40", "16:10"]
                answer: "15:50"
                hints:
                  - "Zähle die vierzig Minuten zu den zehn Minuten dazu."
                  - "Zehn plus vierzig sind fünfzig."
                  - "15:50."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Die Sportstunde beginnt um 9:50 und dauert 45 Minuten. Wann endet sie?"
                say: "Die Sportstunde beginnt um neun Uhr fünfzig und dauert fünfundvierzig Minuten. Wann endet sie?"
                options: ["10:35", "10:45", "9:95"]
                answer: "10:35"
                hints:
                  - "Spring zuerst bis zur vollen Stunde."
                  - "Bis zehn Uhr sind es zehn Minuten. Wie viele bleiben übrig?"
                  - "10:35."
              - id: l2-f3
                type: multiple_choice
                text: "Der Film endet um 18:00 und hat 90 Minuten gedauert. Wann hat er begonnen?"
                say: "Der Film endet um achtzehn Uhr und hat neunzig Minuten gedauert. Wann hat er begonnen?"
                options: ["16:30", "17:30", "17:10"]
                answer: "16:30"
                hints:
                  - "Neunzig Minuten sind eine Stunde und dreißig Minuten."
                  - "Eine Stunde vor achtzehn Uhr ist siebzehn Uhr. Dann noch dreißig Minuten zurück."
                  - "16:30."
              - id: l2-f4
                type: true_false
                text: "Tim läuft um 7:45 los und ist 20 Minuten unterwegs. Er kommt um 8:05 an. Stimmt das?"
                say: "Tim läuft um sieben Uhr fünfundvierzig los und ist zwanzig Minuten unterwegs. Er kommt um acht Uhr fünf an. Stimmt das?"
                answer: true
                hints:
                  - "Bis acht Uhr sind es fünfzehn Minuten."
                  - "Dann noch fünf Minuten."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Die Fahrt beginnt um 13:35 und dauert 1 Stunde 40 Minuten. Wann ist sie zu Ende?"
                say: "Die Fahrt beginnt um dreizehn Uhr fünfunddreißig und dauert eine Stunde und vierzig Minuten. Wann ist sie zu Ende?"
                options: ["15:15", "14:75", "15:25"]
                answer: "15:15"
                hints:
                  - "Zähle zuerst die ganze Stunde dazu: vierzehn Uhr fünfunddreißig."
                  - "Dann vierzig Minuten: fünfundzwanzig bis fünfzehn Uhr, dann noch fünfzehn."
                  - "15:15."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Die Pause beginnt um 11:20 und dauert 20 Minuten. Wann endet sie?"
                say: "Die Pause beginnt um elf Uhr zwanzig und dauert zwanzig Minuten. Wann endet sie?"
                options: ["11:40", "11:20", "12:00"]
                answer: "11:40"
                hints: ["Zwanzig plus zwanzig."]
              - id: l2-s2
                type: multiple_choice
                text: "Das Spiel beginnt um 16:45 und dauert 30 Minuten. Wann endet es?"
                say: "Das Spiel beginnt um sechzehn Uhr fünfundvierzig und dauert dreißig Minuten. Wann endet es?"
                options: ["17:15", "16:75", "17:45"]
                answer: "17:15"
                hints: ["Spring zuerst bis siebzehn Uhr."]
              - id: l2-s3
                type: multiple_choice
                text: "Der Unterricht endet um 13:00 und hat 5 Stunden gedauert. Wann hat er begonnen?"
                say: "Der Unterricht endet um dreizehn Uhr und hat fünf Stunden gedauert. Wann hat er begonnen?"
                options: ["8:00", "9:00", "18:00"]
                answer: "8:00"
                hints: ["Rechne fünf Stunden zurück."]
              - id: l2-s4
                type: true_false
                text: "Lea liest von 19:40 bis 20:10. Sie liest 70 Minuten. Stimmt das?"
                say: "Lea liest von neunzehn Uhr vierzig bis zwanzig Uhr zehn. Sie liest siebzig Minuten. Stimmt das?"
                answer: false
                hints: ["Zwanzig Minuten bis zwanzig Uhr, dann noch zehn."]
              - id: l2-s5
                type: multiple_choice
                text: "Die Wanderung beginnt um 10:15 und dauert 2 Stunden 50 Minuten. Wann ist sie zu Ende?"
                say: "Die Wanderung beginnt um zehn Uhr fünfzehn und dauert zwei Stunden und fünfzig Minuten. Wann ist sie zu Ende?"
                options: ["13:05", "12:65", "13:15"]
                answer: "13:05"
                hints: ["Zuerst zwei Stunden dazu, dann fünfzig Minuten."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Das Brot kommt um 8:05 in den Ofen und backt 35 Minuten. Wann ist es fertig?"
                say: "Das Brot kommt um acht Uhr fünf in den Ofen und backt fünfunddreißig Minuten. Wann ist es fertig?"
                options: ["8:40", "8:30", "9:05"]
                answer: "8:40"
              - id: l2-n2
                type: multiple_choice
                text: "Der Zug fährt um 14:50 ab und ist 25 Minuten unterwegs. Wann kommt er an?"
                say: "Der Zug fährt um vierzehn Uhr fünfzig ab und ist fünfundzwanzig Minuten unterwegs. Wann kommt er an?"
                options: ["15:15", "14:75", "15:25"]
                answer: "15:15"
              - id: l2-n3
                type: multiple_choice
                text: "Das Fest endet um 17:00 und hat 2 Stunden 30 Minuten gedauert. Wann hat es begonnen?"
                say: "Das Fest endet um siebzehn Uhr und hat zwei Stunden und dreißig Minuten gedauert. Wann hat es begonnen?"
                options: ["14:30", "15:30", "14:70"]
                answer: "14:30"
              - id: l2-n4
                type: true_false
                text: "Die Chorprobe beginnt um 18:55 und dauert 15 Minuten. Sie endet um 19:10. Stimmt das?"
                say: "Die Chorprobe beginnt um achtzehn Uhr fünfundfünfzig und dauert fünfzehn Minuten. Sie endet um neunzehn Uhr zehn. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Der Flug startet um 9:25 und dauert 1 Stunde 50 Minuten. Wann landet er?"
                say: "Der Flug startet um neun Uhr fünfundzwanzig und dauert eine Stunde und fünfzig Minuten. Wann landet er?"
                options: ["11:15", "10:75", "11:25"]
                answer: "11:15"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "Von 12:35 bis 13:00. Wie viele Minuten sind das?"
            say: "Von zwölf Uhr fünfunddreißig bis dreizehn Uhr. Wie viele Minuten sind das?"
            answer: "25"
          - id: l2-c2
            type: multiple_choice
            text: "Der Film beginnt um 17:40 und dauert 45 Minuten. Wann endet er?"
            say: "Der Film beginnt um siebzehn Uhr vierzig und dauert fünfundvierzig Minuten. Wann endet er?"
            options: ["18:25", "17:85", "18:35"]
            answer: "18:25"
          - id: l2-c3
            type: multiple_choice
            text: "Das Turnier endet um 16:00 und hat 3 Stunden 15 Minuten gedauert. Wann hat es begonnen?"
            say: "Das Turnier endet um sechzehn Uhr und hat drei Stunden und fünfzehn Minuten gedauert. Wann hat es begonnen?"
            options: ["12:45", "13:15", "12:15"]
            answer: "12:45"
          - id: l2-c4
            type: true_false
            text: "Von 6:50 bis 7:20 sind es 70 Minuten. Stimmt das?"
            say: "Von sechs Uhr fünfzig bis sieben Uhr zwanzig sind es siebzig Minuten. Stimmt das?"
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Der Ausflug geht um 8:30 los und endet um 12:00. Wie lange dauert er?"
            say: "Der Ausflug geht um acht Uhr dreißig los und endet um zwölf Uhr. Wie lange dauert er?"
            options: ["3 Stunden 30 Minuten", "4 Stunden 30 Minuten", "3 Stunden 70 Minuten"]
            answer: "3 Stunden 30 Minuten"
