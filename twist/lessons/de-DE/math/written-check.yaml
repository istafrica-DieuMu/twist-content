# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.written-check
skill: math.written-add-sub.check
curriculum: de-DE
language: de
title:
  de: Schriftliche Rechnungen prüfen
  en: Checking column calculations
summary: >
  Checking a written addition or subtraction. Lesson 1 makes a Überschlag
  with Hunderter and sees whether a result can be right; lesson 2 checks
  exactly with the Umkehraufgabe and names typical mistakes (a forgotten
  Übertrag, columns out of line), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.sub-regroup, math.add-sub-to-1000.estimate]
  also_practises: [math.written-add-sub.add-carry, math.add-sub-to-1000.estimate]
  vocabulary: { de: [Überschlag, runden, Umkehraufgabe, Probe, Übertrag, Fehler] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  misconceptions:
    - id: estimate-is-exact
      what: Thinks a result is wrong because it is not exactly the Überschlag
      addressed: lesson 1 Learn says the Überschlag gives only roughly the result; l1-f2, l1-s2, l1-n2 and l1-c2 are right results that differ from the Überschlag
    - id: forgotten-carry
      what: Forgets the Übertrag and does not notice
      addressed: lesson 2 Learn shows a forgotten Übertrag; l2-f3, l2-s5, l2-n3, l2-c4 and l2-c5 show one to find
    - id: wrong-inverse
      what: Checks with the wrong numbers or the same operation (642 − 315 with 642 + 315)
      addressed: "\"Mit welcher Umkehraufgabe prüfst du …?\" in every stage of lesson 2 offers both wrong choices"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Der Überschlag", en: "Estimating" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "400 + 300 = _"
            say: "Vierhundert plus dreihundert."
            answer: "700"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Runde 386 auf Hunderter."
            say: "Runde dreihundertsechsundachtzig auf Hunderter."
            options: ["400", "300", "390"]
            answer: "400"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Überschlag: 400 + 200 = 600"
            say: "Mit einem Überschlag prüfst du, ob dein Ergebnis stimmen kann. Du rundest auf Hunderter: Dreihundertsechsundachtzig wird vierhundert, zweihundertsiebenundvierzig wird zweihundert. Das Ergebnis muss ungefähr sechshundert sein."
            show: { drawn: written-calc, rows: ["386", "247"], op: "+", carry: "11 ", result: "633" }
          - text: "523 ist zu weit weg von 600."
            say: "Steht hier fünfhundertdreiundzwanzig, ist das zu weit weg von sechshundert. Dann rechnest du noch einmal."
            show: { drawn: written-calc, rows: ["386", "247"], op: "+", result: "523" }
          - text: "Große Fehler fallen beim Überschlag auf."
            say: "Der Überschlag sagt dir nicht das genaue Ergebnis. Aber große Fehler fallen dir damit auf."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Überschlag passt zu 412 + 289?"
                say: "Vierhundertzwölf plus zweihundertneunundachtzig. Welcher Überschlag passt?"
                options: ["400 + 300", "400 + 200", "500 + 300"]
                answer: "400 + 300"
                hints:
                  - "Runde beide Zahlen auf Hunderter."
                  - "Ist zweihundertneunundachtzig näher an zweihundert oder an dreihundert?"
                  - "400 + 300."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Passt das Ergebnis zum Überschlag?"
                say: "Vierhundertzwölf plus zweihundertneunundachtzig ist siebenhunderteins. Passt das zum Überschlag?"
                show: { drawn: written-calc, rows: ["412", "289"], op: "+", carry: "11 ", result: "701" }
                answer: true
                hints:
                  - "Der Überschlag ist vierhundert plus dreihundert."
                  - "Siebenhunderteins ist ganz nah an siebenhundert."
                  - "Ja, es passt."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Ergebnis kann zu 538 + 367 stimmen?"
                say: "Fünfhundertachtunddreißig plus dreihundertsiebenundsechzig. Welches Ergebnis kann stimmen?"
                options: ["905", "605", "1205"]
                answer: "905"
                hints:
                  - "Mach zuerst einen Überschlag."
                  - "Fünfhundert plus vierhundert ist neunhundert."
                  - "905."
              - id: l1-f4
                type: true_false
                text: "Passt das Ergebnis zum Überschlag?"
                say: "Siebenhundertfünfunddreißig minus zweihundertachtzehn ist neunhundertdreiundfünfzig. Passt das zum Überschlag?"
                show: { drawn: written-calc, rows: ["735", "218"], op: "-", result: "953" }
                answer: false
                hints:
                  - "Mach einen Überschlag: siebenhundert minus zweihundert."
                  - "Das sind fünfhundert. Neunhundertdreiundfünfzig ist viel zu groß."
                  - "Nein. Hier wurde plus statt minus gerechnet."
              - id: l1-f5
                type: text_input
                text: "Mach einen Überschlag: 297 + 404 ≈ _"
                say: "Mach einen Überschlag: zweihundertsiebenundneunzig plus vierhundertvier. Ungefähr wie viel?"
                answer: "700"
                hints:
                  - "Runde beide Zahlen auf Hunderter."
                  - "Dreihundert plus vierhundert."
                  - "700."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Überschlag passt zu 589 − 312?"
                say: "Fünfhundertneunundachtzig minus dreihundertzwölf. Welcher Überschlag passt?"
                options: ["600 − 300", "500 − 300", "600 − 400"]
                answer: "600 − 300"
                hints: ["Runde beide Zahlen auf Hunderter."]
              - id: l1-s2
                type: true_false
                text: "Passt das Ergebnis zum Überschlag?"
                say: "Zweihundertvierundsechzig plus dreihundertachtunddreißig ist sechshundertzwei. Passt das zum Überschlag?"
                show: { drawn: written-calc, rows: ["264", "338"], op: "+", carry: "11 ", result: "602" }
                answer: true
                hints: ["Der Überschlag ist dreihundert plus dreihundert."]
              - id: l1-s3
                type: multiple_choice
                text: "Welches Ergebnis kann zu 812 − 395 stimmen?"
                say: "Achthundertzwölf minus dreihundertfünfundneunzig. Welches Ergebnis kann stimmen?"
                options: ["417", "217", "617"]
                answer: "417"
                hints: ["Achthundert minus vierhundert."]
              - id: l1-s4
                type: true_false
                text: "Passt das Ergebnis zum Überschlag?"
                say: "Vierhundertsechsundsiebzig plus dreihundertfünfundachtzig ist siebenhunderteinundfünfzig. Passt das zum Überschlag?"
                show: { drawn: written-calc, rows: ["476", "385"], op: "+", result: "751" }
                answer: false
                hints: ["Der Überschlag ist fünfhundert plus vierhundert."]
              - id: l1-s5
                type: text_input
                text: "Mach einen Überschlag: 703 − 298 ≈ _"
                say: "Mach einen Überschlag: siebenhundertdrei minus zweihundertachtundneunzig. Ungefähr wie viel?"
                answer: "400"
                hints: ["Siebenhundert minus dreihundert."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welcher Überschlag passt zu 651 + 248?"
                say: "Sechshunderteinundfünfzig plus zweihundertachtundvierzig. Welcher Überschlag passt?"
                options: ["700 + 200", "600 + 200", "700 + 300"]
                answer: "700 + 200"
              - id: l1-n2
                type: true_false
                text: "Passt das Ergebnis zum Überschlag?"
                say: "Neunhundertfünf minus vierhundertsiebenundachtzig ist vierhundertachtzehn. Passt das zum Überschlag?"
                show: { drawn: written-calc, rows: ["905", "487"], op: "-", result: "418" }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Welches Ergebnis kann zu 396 + 407 stimmen?"
                say: "Dreihundertsechsundneunzig plus vierhundertsieben. Welches Ergebnis kann stimmen?"
                options: ["803", "603", "1003"]
                answer: "803"
              - id: l1-n4
                type: true_false
                text: "Passt das Ergebnis zum Überschlag?"
                say: "Sechshundertdreiundzwanzig plus zweihundertneunundsiebzig ist siebenhundertzwei. Passt das zum Überschlag?"
                show: { drawn: written-calc, rows: ["623", "279"], op: "+", result: "702" }
                answer: false
              - id: l1-n5
                type: text_input
                text: "Mach einen Überschlag: 488 + 312 ≈ _"
                say: "Mach einen Überschlag: vierhundertachtundachtzig plus dreihundertzwölf. Ungefähr wie viel?"
                answer: "800"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welcher Überschlag passt zu 734 − 286?"
            say: "Siebenhundertvierunddreißig minus zweihundertsechsundachtzig. Welcher Überschlag passt?"
            options: ["700 − 300", "800 − 300", "700 − 200"]
            answer: "700 − 300"
          - id: l1-c2
            type: true_false
            text: "Passt das Ergebnis zum Überschlag?"
            say: "Fünfhundertsiebenundvierzig plus dreihundertachtundsechzig ist neunhundertfünfzehn. Passt das zum Überschlag?"
            show: { drawn: written-calc, rows: ["547", "368"], op: "+", carry: "11 ", result: "915" }
            answer: true
          - id: l1-c3
            type: text_input
            text: "Mach einen Überschlag: 612 + 189 ≈ _"
            say: "Mach einen Überschlag: sechshundertzwölf plus hundertneunundachtzig. Ungefähr wie viel?"
            answer: "800"

  - n: 2
    title: { de: "Probe und typische Fehler", en: "Checking and common mistakes" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Überschlag passt zu 498 + 207?"
            say: "Vierhundertachtundneunzig plus zweihundertsieben. Welcher Überschlag passt?"
            options: ["500 + 200", "400 + 200", "500 + 300"]
            answer: "500 + 200"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Mach einen Überschlag: 815 − 391 ≈ _"
            say: "Mach einen Überschlag: achthundertfünfzehn minus dreihunderteinundneunzig. Ungefähr wie viel?"
            answer: "400"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "735 − 218 = 517 | Probe: 517 + 218 = 735"
            say: "Genauer prüfst du mit der Umkehraufgabe, der Probe. Hast du minus gerechnet, rechnest du jetzt plus: fünfhundertsiebzehn plus zweihundertachtzehn. Kommt die erste Zahl heraus, stimmt dein Ergebnis."
            show: { drawn: written-calc, rows: ["517", "218"], op: "+", carry: " 1 ", result: "735" }
          - text: "Fehler: Übertrag vergessen"
            say: "Ein typischer Fehler: Der Übertrag wurde vergessen. Sechs plus sieben ist dreizehn. Die Eins muss als Übertrag zu den Zehnern."
            show: { drawn: written-calc, rows: ["386", "247"], op: "+", result: "523" }
          - text: "456 + 32 = 776"
            say: "Ein anderer Fehler: Die Zahlen stehen nicht richtig untereinander. Hier wurde die Zweiunddreißig unter die Hunderter und Zehner geschrieben. Richtig ist vierhundertachtundachtzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Mit welcher Umkehraufgabe prüfst du 642 − 315 = 327?"
                say: "Sechshundertzweiundvierzig minus dreihundertfünfzehn ist dreihundertsiebenundzwanzig. Mit welcher Umkehraufgabe prüfst du das?"
                options: ["327 + 315", "642 + 315", "327 − 315"]
                answer: "327 + 315"
                feedback:
                  "642 + 315": "Bei der Probe rechnest du mit dem Ergebnis weiter: Ergebnis plus die abgezogene Zahl."
                hints:
                  - "Bei der Probe rechnest du umgekehrt: plus statt minus."
                  - "Nimm das Ergebnis und zähle die Zahl dazu, die du abgezogen hast."
                  - "327 + 315."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Die Probe ergibt 642. Stimmt 642 − 315 = 327?"
                say: "Die Probe dreihundertsiebenundzwanzig plus dreihundertfünfzehn ergibt sechshundertzweiundvierzig. Stimmt die Minusaufgabe?"
                show: { drawn: written-calc, rows: ["327", "315"], op: "+", carry: " 1 ", result: "642" }
                answer: true
                hints:
                  - "Welche Zahl muss bei der Probe herauskommen?"
                  - "Die erste Zahl der Minusaufgabe: sechshundertzweiundvierzig."
                  - "Ja, die Rechnung stimmt."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Fehler ist passiert?"
                say: "Vierhundertachtundfünfzig plus zweihundertsechsundsiebzig ist sechshundertvierundzwanzig. Welcher Fehler ist passiert?"
                show: { drawn: written-calc, rows: ["458", "276"], op: "+", result: "624" }
                options: ["Der Übertrag wurde vergessen.", "Die Stellen sind verrutscht.", "Es wurde minus gerechnet."]
                answer: "Der Übertrag wurde vergessen."
                hints:
                  - "Rechne die Einer: acht plus sechs."
                  - "Das ist vierzehn. Wo ist die Eins geblieben?"
                  - "Der Übertrag wurde vergessen."
              - id: l2-f4
                type: text_input
                text: "Probe für 518 − 243 = 275: 275 + 243 = _"
                say: "Rechne die Probe für fünfhundertachtzehn minus zweihundertdreiundvierzig gleich zweihundertfünfundsiebzig. Zweihundertfünfundsiebzig plus zweihundertdreiundvierzig ist …"
                answer: "518"
                hints:
                  - "Rechne schriftlich: fünf plus drei, sieben plus vier, zwei plus zwei."
                  - "Bei den Zehnern gibt es einen Übertrag."
                  - "518."
              - id: l2-f5
                type: true_false
                text: "Bei 534 + 23 = 764 sind die Stellen verrutscht. Stimmt das?"
                say: "Fünfhundertvierunddreißig plus dreiundzwanzig ist siebenhundertvierundsechzig. Sind hier die Stellen verrutscht?"
                answer: true
                hints:
                  - "Mach einen Überschlag."
                  - "Zu fünfhundertvierunddreißig kommen nur dreiundzwanzig dazu, das wird nicht siebenhundert."
                  - "Ja. Die 23 stand unter den Hundertern und Zehnern."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Mit welcher Umkehraufgabe prüfst du 487 + 326 = 813?"
                say: "Vierhundertsiebenundachtzig plus dreihundertsechsundzwanzig ist achthundertdreizehn. Mit welcher Umkehraufgabe prüfst du das?"
                options: ["813 − 326", "487 − 326", "813 + 326"]
                answer: "813 − 326"
                hints: ["Hast du plus gerechnet, rechnest du bei der Probe minus."]
              - id: l2-s2
                type: true_false
                text: "Die Probe ergibt 652. Stimmt 652 − 187 = 465?"
                say: "Die Probe vierhundertfünfundsechzig plus hundertsiebenundachtzig ergibt sechshundertzweiundfünfzig. Stimmt die Minusaufgabe?"
                show: { drawn: written-calc, rows: ["465", "187"], op: "+", carry: "11 ", result: "652" }
                answer: true
                hints: ["Kommt die erste Zahl der Minusaufgabe heraus?"]
              - id: l2-s3
                type: multiple_choice
                text: "325 + 41 = 735. Welcher Fehler ist passiert?"
                say: "Dreihundertfünfundzwanzig plus einundvierzig ist siebenhundertfünfunddreißig. Welcher Fehler ist passiert?"
                options: ["Die Stellen sind verrutscht.", "Der Übertrag wurde vergessen.", "Es wurde minus gerechnet."]
                answer: "Die Stellen sind verrutscht."
                hints: ["Unter welcher Stelle stand die Eins von einundvierzig?"]
              - id: l2-s4
                type: text_input
                text: "Probe für 704 − 358 = 346: 346 + 358 = _"
                say: "Rechne die Probe für siebenhundertvier minus dreihundertachtundfünfzig gleich dreihundertsechsundvierzig. Dreihundertsechsundvierzig plus dreihundertachtundfünfzig ist …"
                answer: "704"
                hints: ["Rechne schriftlich mit den Überträgen."]
              - id: l2-s5
                type: true_false
                text: "Ist richtig gerechnet?"
                say: "Sechshundertneununddreißig plus zweihundertvierundsiebzig ist achthundertdrei. Ist das richtig gerechnet?"
                show: { drawn: written-calc, rows: ["639", "274"], op: "+", result: "803" }
                answer: false
                hints: ["Rechne die Einer und die Zehner noch einmal mit Übertrag."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mit welcher Umkehraufgabe prüfst du 900 − 456 = 444?"
                say: "Neunhundert minus vierhundertsechsundfünfzig ist vierhundertvierundvierzig. Mit welcher Umkehraufgabe prüfst du das?"
                options: ["444 + 456", "900 + 456", "444 − 456"]
                answer: "444 + 456"
              - id: l2-n2
                type: true_false
                text: "Die Probe ergibt 900. Stimmt 900 − 456 = 444?"
                say: "Die Probe vierhundertvierundvierzig plus vierhundertsechsundfünfzig ergibt neunhundert. Stimmt die Minusaufgabe?"
                show: { drawn: written-calc, rows: ["444", "456"], op: "+", carry: "11 ", result: "900" }
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Welcher Fehler ist passiert?"
                say: "Zweihundertsiebenundsechzig plus hundertfünfundachtzig ist dreihundertzweiundvierzig. Welcher Fehler ist passiert?"
                show: { drawn: written-calc, rows: ["267", "185"], op: "+", result: "342" }
                options: ["Der Übertrag wurde vergessen.", "Die Stellen sind verrutscht.", "Es wurde minus gerechnet."]
                answer: "Der Übertrag wurde vergessen."
              - id: l2-n4
                type: text_input
                text: "Probe für 831 − 476 = 355: 355 + 476 = _"
                say: "Rechne die Probe für achthunderteinunddreißig minus vierhundertsechsundsiebzig gleich dreihundertfünfundfünfzig. Dreihundertfünfundfünfzig plus vierhundertsechsundsiebzig ist …"
                answer: "831"
              - id: l2-n5
                type: true_false
                text: "Ist 512 + 37 = 882 richtig gerechnet?"
                say: "Fünfhundertzwölf plus siebenunddreißig ist achthundertzweiundachtzig. Ist das richtig gerechnet?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welcher Überschlag passt zu 391 + 518?"
            say: "Dreihunderteinundneunzig plus fünfhundertachtzehn. Welcher Überschlag passt?"
            options: ["400 + 500", "300 + 500", "400 + 600"]
            answer: "400 + 500"
          - id: l2-c2
            type: multiple_choice
            text: "Mit welcher Umkehraufgabe prüfst du 763 − 285 = 478?"
            say: "Siebenhundertdreiundsechzig minus zweihundertfünfundachtzig ist vierhundertachtundsiebzig. Mit welcher Umkehraufgabe prüfst du das?"
            options: ["478 + 285", "763 + 285", "478 − 285"]
            answer: "478 + 285"
          - id: l2-c3
            type: text_input
            text: "Probe für 625 − 348 = 277: 277 + 348 = _"
            say: "Rechne die Probe für sechshundertfünfundzwanzig minus dreihundertachtundvierzig gleich zweihundertsiebenundsiebzig. Zweihundertsiebenundsiebzig plus dreihundertachtundvierzig ist …"
            answer: "625"
          - id: l2-c4
            type: true_false
            text: "Ist richtig gerechnet?"
            say: "Dreihundertsechsundfünfzig plus zweihundertachtundsiebzig ist fünfhundertvierunddreißig. Ist das richtig gerechnet?"
            show: { drawn: written-calc, rows: ["356", "278"], op: "+", result: "534" }
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Welcher Fehler ist passiert?"
            say: "Dreihundertvierundachtzig plus zweihundertneunundfünfzig ist fünfhundertdreiunddreißig. Welcher Fehler ist passiert?"
            show: { drawn: written-calc, rows: ["384", "259"], op: "+", result: "533" }
            options: ["Der Übertrag wurde vergessen.", "Die Stellen sind verrutscht.", "Es wurde minus gerechnet."]
            answer: "Der Übertrag wurde vergessen."
