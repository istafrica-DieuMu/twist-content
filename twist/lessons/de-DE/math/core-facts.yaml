# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.core-facts
skill: math.mult-div.core-facts
curriculum: de-DE
language: de
title:
  de: Die Kernaufgaben
  en: The core facts
summary: >
  The Kernaufgaben of the Einmaleins, known by heart: 1 mal, 2 mal,
  10 mal and 5 mal a number. Lesson 1 takes 1 mal (the number stays the
  same), 2 mal (verdoppeln) and 10 mal (so many Zehner); lesson 2 takes
  5 mal as half of 10 mal, mixes all four, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Einmaleins, en: Times tables }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.commutative]
  also_practises: [math.mult-div.commutative]
  vocabulary: { de: [Kernaufgabe, Einmaleins, mal, verdoppeln, halbieren] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: times-one-plus-one
      what: Thinks 1 · 7 is 8, as if mal 1 were plus 1
      addressed: lesson 1 Learn shows one row of seven; a mal-1 task in every stage of lesson 1, with feedback in l1-f1
    - id: times-ten-two-zeros
      what: Writes too many zeros for mal 10 (6 · 10 = 600)
      addressed: lesson 1 Learn reads 10 · 7 as sieben Zehner; an extra-zero option in every stage, with feedback in l1-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Einmal, zweimal, zehnmal", en: "1 times, 2 times, 10 times" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist die Tauschaufgabe von 3 · 5?"
            say: "Was ist die Tauschaufgabe von drei mal fünf?"
            options: ["5 · 3", "3 + 5", "3 · 3"]
            answer: "5 · 3"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "6 + 6 = _"
            say: "Sechs plus sechs."
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 · 7 = 7"
            say: "Eins mal sieben ist eine Reihe mit sieben Punkten, also sieben. Bei eins mal bleibt die Zahl gleich."
            show: { drawn: dots, array: [1, 7] }
          - text: "2 · 7 = 14"
            say: "Zwei mal sieben sind zwei Reihen mit je sieben Punkten. Das ist das Doppelte von sieben: Sieben plus sieben ist vierzehn."
            show: { drawn: dots, array: [2, 7] }
          - text: "10 · 7 = 70"
            say: "Zehn mal sieben sind zehn Siebener. Das sind genauso viele wie sieben Zehner, also siebzig. Eins mal, zwei mal und zehn mal sind leichte Aufgaben. Sie heißen Kernaufgaben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1 · 9 = ?"
                say: "Eins mal neun. Wie viel ist das?"
                options: ["9", "10", "1"]
                answer: "9"
                feedback:
                  "10": "Eins mal neun heißt: einmal die Neun. Es kommt nichts dazu, also 9."
                hints:
                  - "Eine Reihe mit neun Punkten."
                  - "Bei eins mal bleibt die Zahl gleich."
                  - "9."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "2 · 6 = _"
                say: "Zwei mal sechs."
                show: { drawn: dots, array: [2, 6] }
                answer: "12"
                hints:
                  - "Zwei mal heißt verdoppeln."
                  - "Sechs plus sechs."
                  - "12."
              - id: l1-f3
                type: multiple_choice
                text: "10 · 4 = ?"
                say: "Zehn mal vier. Wie viel ist das?"
                options: ["40", "14", "400"]
                answer: "40"
                feedback:
                  "400": "Zehn Vierer sind vier Zehner, also 40. Nur eine Null."
                  "14": "Das wäre zehn plus vier. Zehn mal vier sind vier Zehner: 40."
                hints:
                  - "Zehn Vierer sind vier Zehner."
                  - "Vier Zehner sind …"
                  - "40."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 2 · 8 = 16"
                say: "Zwei mal acht ist sechzehn. Stimmt das?"
                answer: true
                hints:
                  - "Verdopple die Acht."
                  - "Acht plus acht."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: fill_in_blank
                text: "Ergänze die Kernaufgaben."
                say: "Ergänze: eins mal fünf, zwei mal fünf, zehn mal fünf."
                frame: "1 · 5 = _ | 2 · 5 = _ | 10 · 5 = _"
                options: ["5", "10", "50", "6"]
                answer: ["5", "10", "50"]
                hints:
                  - "Eins mal bleibt gleich, zwei mal heißt verdoppeln."
                  - "Zehn mal fünf sind fünf Zehner."
                  - "5, 10 und 50."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "1 · 4 = ?"
                say: "Eins mal vier. Wie viel ist das?"
                options: ["5", "4", "1"]
                answer: "4"
                hints: ["Bei eins mal bleibt die Zahl gleich."]
              - id: l1-s2
                type: text_input
                text: "2 · 9 = _"
                say: "Zwei mal neun."
                answer: "18"
                hints: ["Verdopple."]
              - id: l1-s3
                type: multiple_choice
                text: "10 · 8 = ?"
                say: "Zehn mal acht. Wie viel ist das?"
                options: ["18", "800", "80"]
                answer: "80"
                hints: ["Wie viele Zehner sind das?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 1 · 6 = 7"
                say: "Eins mal sechs ist sieben. Stimmt das?"
                answer: false
                hints: ["Was passiert mit einer Zahl, wenn du sie nur einmal nimmst?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Ergänze die Kernaufgaben."
                say: "Ergänze: eins mal drei, zwei mal drei, zehn mal drei."
                frame: "1 · 3 = _ | 2 · 3 = _ | 10 · 3 = _"
                options: ["3", "6", "30", "4"]
                answer: ["3", "6", "30"]
                hints: ["Gleich lassen, verdoppeln, so viele Zehner."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "1 · 10 = ?"
                say: "Eins mal zehn. Wie viel ist das?"
                options: ["11", "10", "100"]
                answer: "10"
              - id: l1-n2
                type: text_input
                text: "2 · 8 = _"
                say: "Zwei mal acht."
                answer: "16"
              - id: l1-n3
                type: multiple_choice
                text: "10 · 9 = ?"
                say: "Zehn mal neun. Wie viel ist das?"
                options: ["90", "900", "19"]
                answer: "90"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 10 · 6 = 60"
                say: "Zehn mal sechs ist sechzig. Stimmt das?"
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Ergänze die Kernaufgaben."
                say: "Ergänze: eins mal vier, zwei mal vier, zehn mal vier."
                frame: "1 · 4 = _ | 2 · 4 = _ | 10 · 4 = _"
                options: ["4", "8", "40", "5"]
                answer: ["4", "8", "40"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "2 · 4 = _"
            say: "Zwei mal vier."
            answer: "8"
          - id: l1-c2
            type: multiple_choice
            text: "10 · 3 = ?"
            say: "Zehn mal drei. Wie viel ist das?"
            options: ["13", "30", "300"]
            answer: "30"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 1 · 2 = 3"
            say: "Eins mal zwei ist drei. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Fünfmal: die Hälfte von zehnmal", en: "5 times: half of 10 times" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "10 · 6 = _"
            say: "Zehn mal sechs."
            answer: "60"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "2 · 5 = _"
            say: "Zwei mal fünf."
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "10 · 4 = 40 → 5 · 4 = 20"
            say: "Fünf ist die Hälfte von zehn. Also ist fünf mal vier die Hälfte von zehn mal vier. Zehn mal vier ist vierzig, die Hälfte ist zwanzig."
            show: { drawn: dots, array: [10, 4], split_rows: 5 }
          - text: "5 · 8 = 40"
            say: "Fünf mal acht: Zehn mal acht ist achtzig, die Hälfte ist vierzig."
          - text: "Kernaufgaben: 1 mal, 2 mal, 5 mal, 10 mal"
            say: "Eins mal, zwei mal, fünf mal und zehn mal: Das sind die Kernaufgaben. Die lernst du auswendig. Mit ihnen findest du später alle anderen Aufgaben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Erst zehn mal, dann die Hälfte."
                say: "Rechne zuerst zehn mal sechs, dann fünf mal sechs."
                frame: "10 · 6 = _ | 5 · 6 = _"
                options: ["60", "30", "11", "50"]
                answer: ["60", "30"]
                hints:
                  - "Zehn mal sechs sind sechs Zehner."
                  - "Fünf mal sechs ist die Hälfte davon."
                  - "60 und 30."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "5 · 2 = ?"
                say: "Fünf mal zwei. Wie viel ist das?"
                options: ["7", "10", "20"]
                answer: "10"
                hints:
                  - "Zehn mal zwei ist zwanzig."
                  - "Die Hälfte davon."
                  - "10."
              - id: l2-f3
                type: text_input
                text: "5 · 9 = _"
                say: "Fünf mal neun."
                answer: "45"
                hints:
                  - "Zehn mal neun ist neunzig."
                  - "Die Hälfte von neunzig."
                  - "45."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 5 · 7 = 35"
                say: "Fünf mal sieben ist fünfunddreißig. Stimmt das?"
                answer: true
                hints:
                  - "Zehn mal sieben ist siebzig."
                  - "Die Hälfte von siebzig."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Aufgabe mit ihrem Ergebnis."
                pairs:
                  - { left: { text: "1 · 3" }, right: { text: "3" } }
                  - { left: { text: "5 · 5" }, right: { text: "25" } }
                  - { left: { text: "10 · 2" }, right: { text: "20" } }
                hints:
                  - "Fang mit der leichtesten Aufgabe an."
                  - "Fünf mal fünf ist die Hälfte von zehn mal fünf."
                  - "1 · 3 = 3, 5 · 5 = 25, 10 · 2 = 20."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Erst zehn mal, dann die Hälfte."
                say: "Rechne zuerst zehn mal neun, dann fünf mal neun."
                frame: "10 · 9 = _ | 5 · 9 = _"
                options: ["90", "45", "19", "14"]
                answer: ["90", "45"]
                hints: ["Fünf mal ist die Hälfte von zehn mal."]
              - id: l2-s2
                type: multiple_choice
                text: "5 · 6 = ?"
                say: "Fünf mal sechs. Wie viel ist das?"
                options: ["30", "11", "60"]
                answer: "30"
                hints: ["Denk an zehn mal sechs."]
              - id: l2-s3
                type: text_input
                text: "5 · 3 = _"
                say: "Fünf mal drei."
                answer: "15"
                hints: ["Halbiere zehn mal drei."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 5 · 7 = 30"
                say: "Fünf mal sieben ist dreißig. Stimmt das?"
                answer: false
                hints: ["Halbiere zehn mal sieben."]
              - id: l2-s5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Aufgabe mit ihrem Ergebnis."
                pairs:
                  - { left: { text: "2 · 9" }, right: { text: "18" } }
                  - { left: { text: "5 · 2" }, right: { text: "10" } }
                  - { left: { text: "10 · 3" }, right: { text: "30" } }
                hints: ["Welche Kernaufgabe ist es jeweils?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Erst zehn mal, dann die Hälfte."
                say: "Rechne zuerst zehn mal zwei, dann fünf mal zwei."
                frame: "10 · 2 = _ | 5 · 2 = _"
                options: ["20", "10", "12", "7"]
                answer: ["20", "10"]
              - id: l2-n2
                type: multiple_choice
                text: "5 · 10 = ?"
                say: "Fünf mal zehn. Wie viel ist das?"
                options: ["15", "500", "50"]
                answer: "50"
              - id: l2-n3
                type: text_input
                text: "5 · 6 = _"
                say: "Fünf mal sechs."
                answer: "30"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 5 · 9 = 45"
                say: "Fünf mal neun ist fünfundvierzig. Stimmt das?"
                answer: true
              - id: l2-n5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Aufgabe mit ihrem Ergebnis."
                pairs:
                  - { left: { text: "5 · 7" }, right: { text: "35" } }
                  - { left: { text: "1 · 8" }, right: { text: "8" } }
                  - { left: { text: "2 · 6" }, right: { text: "12" } }

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "1 · 5 = _"
            say: "Eins mal fünf."
            answer: "5"
          - id: l2-c2
            type: text_input
            text: "2 · 3 = _"
            say: "Zwei mal drei."
            answer: "6"
          - id: l2-c3
            type: multiple_choice
            text: "10 · 10 = ?"
            say: "Zehn mal zehn. Wie viel ist das?"
            options: ["1000", "100", "20"]
            answer: "100"
          - id: l2-c4
            type: text_input
            text: "5 · 8 = _"
            say: "Fünf mal acht."
            answer: "40"
          - id: l2-c5
            type: true_false
            text: "Stimmt das? 5 · 6 = 35"
            say: "Fünf mal sechs ist fünfunddreißig. Stimmt das?"
            answer: false
