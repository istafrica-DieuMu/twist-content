# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.ones-no-bridge
skill: math.add-sub-to-100.ones-no-bridge
curriculum: de-DE
language: de
title:
  de: Einer dazu und weg
  en: Adding and taking away ones
summary: >
  Adding and taking away ones without crossing a ten (34 + 5, 47 − 3).
  Only the ones change; the tens stay. Lesson 1 adds ones with base-ten
  blocks and the small sum that helps (4 + 5 helps with 34 + 5); lesson 2
  takes ones away, mixes plus and minus, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.place-value, math.add-sub-to-20.analog-to-20]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { de: [Zehner, Einer, dazu, weg, Analogieaufgabe, kleine Aufgabe] }
  forms: [drawn, text, audio]
  drawn: [base-ten]
  facets: []
  misconceptions:
    - id: add-to-tens
      what: Adds the ones to the tens digit (34 + 5 = 84)
      addressed: Learn shows the new cubes joining the ones; "Which part changes" tasks in both lessons, and the wrong-place answer is an option with feedback in l1-f2 and l1-f5
    - id: digits-joined
      what: Writes the digits side by side (34 + 5 = 345)
      addressed: hints read answers back as Zehner and Einer; l1-s5 asks whether 43 + 5 = 435, and its hint asks whether five more can make it so much bigger
    - id: tens-lost
      what: Drops the tens and answers with the small sum (34 + 5 = 9)
      addressed: the small sum and its partner sum sit side by side in the Analogieaufgabe frames; the bare small sum is an option with feedback in l1-f2 and l1-f5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Einer dazu, en: Adding ones }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "4 + 5 = ?"
            say: "Vier plus fünf."
            options: ["8", "9", "10"]
            answer: "9"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "34: Wie viele Zehner?"
            say: "Wie viele Zehner hat vierunddreißig?"
            show: { drawn: base-ten, tens: 3, ones: 4 }
            options: ["3", "4", "7"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "34"
            say: "Hier sind vierunddreißig: drei Zehner und vier Einer."
            show: { drawn: base-ten, tens: 3, ones: 4 }
          - text: "34 + 5"
            say: "Fünf Einer kommen dazu. Sie kommen zu den anderen Einern. Die Zehnerstangen bleiben, wie sie sind."
            show: { drawn: base-ten, tens: 3, ones: 9 }
          - text: "34 + 5 = 39"
            say: "Drei Zehner und neun Einer: neununddreißig. Nur die Einer haben sich geändert."
          - text: "4 + 5 = 9 · 34 + 5 = 39"
            say: "Die kleine Aufgabe hilft: Vier plus fünf ist neun. Dann ist vierunddreißig plus fünf neununddreißig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "24 + 5: Was ändert sich?"
                say: "Vierundzwanzig plus fünf. Was ändert sich?"
                options: ["die Einer", "die Zehner", "beide"]
                answer: "die Einer"
                feedback:
                  "die Zehner": "Die fünf sind Einer. Sie kommen zu den Einern."
                hints:
                  - "Sind fünf Einer oder Zehner?"
                  - "Fünf Einer kommen zu den vier Einern."
                  - "Nur die Einer ändern sich."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "52 + 3 = ?"
                say: "Zweiundfünfzig plus drei."
                show: { drawn: base-ten, tens: 5, ones: 2 }
                options: ["55", "82", "5"]
                answer: "55"
                feedback:
                  "82": "Die drei sind Einer, keine Zehner. Die Zehner bleiben fünf."
                  "5": "Die fünf Zehner sind noch da. Zwei plus drei sind fünf Einer, und dazu die fünf Zehner."
                hints:
                  - "Die Zehner bleiben: fünf Zehner."
                  - "Zwei Einer und drei Einer sind fünf Einer."
                  - "Fünf Zehner und fünf Einer: 55."
              - id: l1-f3
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst die kleine Aufgabe, dann die große."
                frame: "3 + 4 = _ · 63 + 4 = _"
                options: ["7", "67", "103", "17"]
                answer: ["7", "67"]
                hints:
                  - "Drei plus vier."
                  - "Die sechs Zehner bleiben."
                  - "7, und dann 67."
              - id: l1-f4
                type: text_input
                text: "21 + 6 = _"
                say: "Einundzwanzig plus sechs."
                show: { drawn: base-ten, tens: 2, ones: 1 }
                answer: "27"
                hints:
                  - "Zwei Zehner bleiben."
                  - "Ein Einer und sechs Einer sind sieben Einer."
                  - "27."
              - id: l1-f5
                type: multiple_choice
                text: "14 + 5 = ?"
                say: "Vierzehn plus fünf. Welches Ergebnis stimmt?"
                options: ["19", "64", "9"]
                answer: "19"
                feedback:
                  "64": "Du hast die Fünf zu den Zehnern gerechnet. Sie gehört zu den Einern."
                  "9": "Der Zehner fehlt. Vierzehn hat einen Zehner."
                hints:
                  - "Vier plus fünf ist neun."
                  - "Der eine Zehner bleibt."
                  - "19."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? 72 + 5 = 77"
                say: "Zweiundsiebzig plus fünf gleich siebenundsiebzig. Stimmt das?"
                answer: true
                hints:
                  - "Zwei plus fünf ist sieben."
                  - "Die sieben Zehner bleiben."
                  - "Ja, 77."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "45 + 3 = _"
                say: "Fünfundvierzig plus drei."
                answer: "48"
                hints: ["Rechne erst die Einer: fünf plus drei."]
              - id: l1-s2
                type: multiple_choice
                text: "81 + 7: Was ändert sich?"
                say: "Einundachtzig plus sieben. Was ändert sich?"
                options: ["die Einer", "die Zehner", "beide"]
                answer: "die Einer"
                hints: ["Sind sieben Einer oder Zehner?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Erst die kleine Aufgabe, dann die große."
                frame: "2 + 6 = _ · 42 + 6 = _"
                options: ["8", "48", "102", "46"]
                answer: ["8", "48"]
                hints: ["Die Zehner der großen Aufgabe bleiben."]
              - id: l1-s4
                type: text_input
                text: "13 + 5 = _"
                say: "Dreizehn plus fünf."
                show: { drawn: base-ten, tens: 1, ones: 3 }
                answer: "18"
                hints: ["Leg die fünf Einer zu den drei Einern."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? 43 + 5 = 435"
                say: "Dreiundvierzig plus fünf gleich vierhundertfünfunddreißig. Stimmt das?"
                answer: false
                hints: ["Kann das Ergebnis so viel größer sein, wenn nur fünf dazukommen?"]
              - id: l1-s6
                type: text_input
                text: "66 + 2 = _"
                say: "Sechsundsechzig plus zwei."
                answer: "68"
                hints: ["Die sechs Zehner bleiben."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "53 + 4 = _"
                say: "Dreiundfünfzig plus vier."
                answer: "57"
              - id: l1-n2
                type: multiple_choice
                text: "92 + 6 = ?"
                say: "Zweiundneunzig plus sechs."
                options: ["98", "152", "8"]
                answer: "98"
              - id: l1-n3
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Erst die kleine Aufgabe, dann die große."
                frame: "1 + 8 = _ · 31 + 8 = _"
                options: ["9", "39", "111", "38"]
                answer: ["9", "39"]
              - id: l1-n4
                type: text_input
                text: "70 + 6 = _"
                say: "Siebzig plus sechs."
                answer: "76"
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 24 + 3 = 54"
                say: "Vierundzwanzig plus drei gleich vierundfünfzig. Stimmt das?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "62 + 5 = _"
            say: "Zweiundsechzig plus fünf."
            answer: "67"
          - id: l1-c2
            type: multiple_choice
            text: "44 + 4 = ?"
            say: "Vierundvierzig plus vier."
            options: ["48", "84", "8"]
            answer: "48"
          - id: l1-c3
            type: fill_in_blank
            text: "Die kleine Aufgabe hilft."
            say: "Erst die kleine Aufgabe, dann die große."
            frame: "5 + 2 = _ · 85 + 2 = _"
            options: ["7", "87", "105", "77"]
            answer: ["7", "87"]

  - n: 2
    title: { de: "Einer weg, Einer dazu", en: "Taking away and adding ones" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "41 + 5 = _"
            say: "Einundvierzig plus fünf."
            answer: "46"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "7 − 3 = ?"
            say: "Sieben minus drei."
            options: ["3", "4", "10"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "47 − 3"
            say: "Siebenundvierzig minus drei. Wir nehmen drei Einer weg. Die vier Zehner bleiben liegen."
            show: { drawn: base-ten, tens: 4, ones: 7 }
          - text: "47 − 3 = 44"
            say: "Vier Zehner und vier Einer: vierundvierzig."
            show: { drawn: base-ten, tens: 4, ones: 4 }
          - text: "7 − 3 = 4 · 47 − 3 = 44"
            say: "Auch beim Minus hilft die kleine Aufgabe: Sieben minus drei ist vier, also ist siebenundvierzig minus drei vierundvierzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "58 − 6 = ?"
                say: "Achtundfünfzig minus sechs."
                show: { drawn: base-ten, tens: 5, ones: 8 }
                options: ["52", "2", "58"]
                answer: "52"
                feedback:
                  "2": "Die fünf Zehner bleiben liegen. Du nimmst nur Einer weg."
                hints:
                  - "Nimm sechs Einer weg."
                  - "Acht minus sechs ist zwei."
                  - "Fünf Zehner und zwei Einer: 52."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Erst die kleine Aufgabe, dann die große."
                frame: "9 − 4 = _ · 69 − 4 = _"
                options: ["5", "65", "29", "13"]
                answer: ["5", "65"]
                hints:
                  - "Neun minus vier."
                  - "Die sechs Zehner bleiben."
                  - "5, und dann 65."
              - id: l2-f3
                type: multiple_choice
                text: "86 − 5: Was ändert sich?"
                say: "Sechsundachtzig minus fünf. Was ändert sich?"
                options: ["die Einer", "die Zehner", "beide"]
                answer: "die Einer"
                feedback:
                  "die Zehner": "Du nimmst fünf Einer weg, keine Zehner."
                hints:
                  - "Sind fünf Einer oder Zehner?"
                  - "Sechs Einer, fünf davon weg."
                  - "Nur die Einer."
              - id: l2-f4
                type: text_input
                text: "39 − 7 = _"
                say: "Neununddreißig minus sieben."
                answer: "32"
                hints:
                  - "Neun Einer, sieben weg."
                  - "Zwei Einer bleiben, und die drei Zehner."
                  - "32."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 75 − 4 = 35"
                say: "Fünfundsiebzig minus vier gleich fünfunddreißig. Stimmt das?"
                answer: false
                hints:
                  - "Die vier sind Einer."
                  - "Fünf minus vier ist eins. Die sieben Zehner bleiben."
                  - "Nein, es ist 71."
              - id: l2-f6
                type: multiple_choice
                text: "Welche Aufgabe war das?"
                say: "Auf dem Regal stehen sechsundzwanzig Bücher. Lea stellt drei dazu. Jetzt sind es neunundzwanzig. Welche Aufgabe war das?"
                options: ["26 + 3 = 29", "26 − 3 = 23", "29 − 3 = 26"]
                answer: "26 + 3 = 29"
                hints:
                  - "Werden es mehr oder weniger Bücher?"
                  - "Lea stellt welche dazu: mehr."
                  - "26 + 3 = 29."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "48 − 5 = _"
                say: "Achtundvierzig minus fünf."
                answer: "43"
                hints: ["Rechne erst acht minus fünf."]
              - id: l2-s2
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Erst die kleine Aufgabe, dann die große."
                frame: "6 − 2 = _ · 96 − 2 = _"
                options: ["4", "94", "76", "8"]
                answer: ["4", "94"]
                hints: ["Die neun Zehner bleiben."]
              - id: l2-s3
                type: text_input
                text: "17 − 6 = _"
                say: "Siebzehn minus sechs."
                show: { drawn: base-ten, tens: 1, ones: 7 }
                answer: "11"
                hints: ["Nimm sechs von den Einern weg."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 64 − 3 = 61"
                say: "Vierundsechzig minus drei gleich einundsechzig. Stimmt das?"
                answer: true
                hints: ["Rechne vier minus drei."]
              - id: l2-s5
                type: text_input
                text: "33 + 6 = _"
                say: "Dreiunddreißig plus sechs."
                answer: "39"
                hints: ["Plus oder minus? Schau aufs Zeichen."]
              - id: l2-s6
                type: multiple_choice
                text: "55 − 5 = ?"
                say: "Fünfundfünfzig minus fünf."
                options: ["50", "0", "5"]
                answer: "50"
                hints: ["Alle Einer sind weg. Was bleibt?"]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "77 − 4 = _"
                say: "Siebenundsiebzig minus vier."
                answer: "73"
              - id: l2-n2
                type: text_input
                text: "82 + 7 = _"
                say: "Zweiundachtzig plus sieben."
                answer: "89"
              - id: l2-n3
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Erst die kleine Aufgabe, dann die große."
                frame: "8 − 7 = _ · 28 − 7 = _"
                options: ["1", "21", "15", "11"]
                answer: ["1", "21"]
              - id: l2-n4
                type: multiple_choice
                text: "49 − 9 = ?"
                say: "Neunundvierzig minus neun."
                options: ["40", "9", "30"]
                answer: "40"
              - id: l2-n5
                type: true_false
                text: "Stimmt das? 36 − 2 = 16"
                say: "Sechsunddreißig minus zwei gleich sechzehn. Stimmt das?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "54 + 4 = _"
            say: "Vierundfünfzig plus vier."
            answer: "58"
          - id: l2-c2
            type: text_input
            text: "68 − 3 = _"
            say: "Achtundsechzig minus drei."
            answer: "65"
          - id: l2-c3
            type: multiple_choice
            text: "93 + 5: Was ändert sich?"
            say: "Dreiundneunzig plus fünf. Was ändert sich?"
            options: ["die Einer", "die Zehner", "beide"]
            answer: "die Einer"
          - id: l2-c4
            type: fill_in_blank
            text: "Die kleine Aufgabe hilft."
            say: "Erst die kleine Aufgabe, dann die große."
            frame: "7 − 5 = _ · 47 − 5 = _"
            options: ["2", "42", "12", "52"]
            answer: ["2", "42"]
          - id: l2-c5
            type: true_false
            text: "Stimmt das? 23 + 6 = 83"
            say: "Dreiundzwanzig plus sechs gleich dreiundachtzig. Stimmt das?"
            answer: false
