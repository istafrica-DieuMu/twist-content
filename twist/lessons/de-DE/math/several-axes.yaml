# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.several-axes
skill: math.symmetry.several-axes
curriculum: de-DE
language: de
title:
  de: Mehrere Symmetrieachsen
  en: Several lines of symmetry
summary: >
  Lesson 1 counts the Symmetrieachsen of flat shapes (Rechteck 2, Quadrat
  4, gleichseitiges Dreieck 3, regelmäßiges Sechseck 6, Kreis unendlich
  viele) and shows that the line from corner to corner is an axis of the
  square but not of the rectangle; lesson 2 counts the axes of capital
  letters, sorts letters by their number of axes, mirrors an arrow at a
  schräge Achse in the head, and ends with the skill check. Drawing the
  mirror image at a diagonal axis waits for a grid drawing task.
metadata:
  year: klasse-4
  topic: { de: Symmetrie, en: Symmetry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.symmetry.complete, math.shapes.more-shapes]
  also_practises: [math.symmetry.identify]
  vocabulary: { de: [Symmetrieachse, senkrecht, waagerecht, schräg, von Ecke zu Ecke, spiegeln, Spiegelbild, unendlich viele] }
  forms: [text, audio, drawn]
  drawn: [letter-card, shape]
  facets: []
  misconceptions:
    - id: rectangle-diagonal-axis
      what: Thinks the line from corner to corner is a Symmetrieachse of every rectangle, so gives the rectangle four axes
      addressed: lesson 1 Learn folds the rectangle from corner to corner and a corner sticks out; l1-f1 offers 4 with feedback, l1-f3, l1-n2, l1-c3 and l2-c1 ask about the corner-to-corner line or four axes
    - id: only-upright-axes
      what: Looks only for senkrechte and waagerechte axes and misses the schräge ones, so gives the square 2 axes
      addressed: lesson 1 Learn adds the two corner-to-corner axes of the square; l1-f2 offers 2 with feedback, l1-s2, l1-c1 and l1-n5 ask about schräge axes; lesson 2 Learn and l2-f4, l2-s3, l2-n3 and l2-c4 mirror at a schräge Achse
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wie viele Achsen hat die Figur?", en: "How many lines of symmetry?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Ist das A symmetrisch?"
            say: "Falte das A in Gedanken in der Mitte. Ist es symmetrisch?"
            show: { drawn: letter-card, text: "A" }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Ecken hat das Sechseck?"
            say: "Wie viele Ecken hat das Sechseck?"
            show: { drawn: shape, kind: hexagon, colour: green }
            options: ["6", "5", "8"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Rechteck: 2 Symmetrieachsen"
            say: "Das Rechteck kannst du senkrecht durch die Mitte falten und auch waagerecht. Beide Male passen die Hälften genau aufeinander. Es hat zwei Symmetrieachsen."
            show: { drawn: shape, kind: rectangle, colour: blue }
          - text: "Quadrat: 4 Symmetrieachsen"
            say: "Das Quadrat kannst du genauso falten. Du kannst es aber auch schräg von Ecke zu Ecke falten, dann liegen zwei Ecken genau aufeinander. Diese zwei schrägen Achsen kommen dazu. Das Quadrat hat vier Symmetrieachsen."
            show: { drawn: shape, kind: square, colour: orange }
          - text: "Rechteck von Ecke zu Ecke: Die Hälften passen nicht."
            say: "Faltest du ein Rechteck von Ecke zu Ecke, steht an zwei Stellen ein Zipfel über. Die Hälften passen nicht genau aufeinander. Beim Rechteck ist die Linie von Ecke zu Ecke keine Symmetrieachse."
            show: { drawn: shape, kind: rectangle, colour: purple }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Symmetrieachsen hat das Rechteck?"
                say: "Wie viele Symmetrieachsen hat das Rechteck?"
                show: { drawn: shape, kind: rectangle, colour: green }
                options: ["2", "4", "1"]
                answer: "2"
                feedback:
                  "4": "Von Ecke zu Ecke gefaltet passen die Hälften beim Rechteck nicht. Es bleiben die senkrechte und die waagerechte Achse."
                  "1": "Du kannst das Rechteck senkrecht falten und auch waagerecht."
                hints:
                  - "Falte senkrecht, waagerecht und von Ecke zu Ecke."
                  - "Senkrecht und waagerecht passt es. Von Ecke zu Ecke steht ein Zipfel über."
                  - "2."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Symmetrieachsen hat das Quadrat?"
                say: "Wie viele Symmetrieachsen hat das Quadrat?"
                show: { drawn: shape, kind: square, colour: blue }
                options: ["4", "2", "1"]
                answer: "4"
                feedback:
                  "2": "Senkrecht und waagerecht sind zwei. Beim Quadrat passen die Hälften auch von Ecke zu Ecke. Das sind noch zwei schräge Achsen."
                hints:
                  - "Vergiss die schrägen Achsen nicht."
                  - "Senkrecht, waagerecht und zweimal von Ecke zu Ecke."
                  - "4."
              - id: l1-f3
                type: true_false
                text: "Beim Rechteck ist die Linie von Ecke zu Ecke eine Symmetrieachse."
                say: "Stimmt das? Beim Rechteck ist die Linie von Ecke zu Ecke eine Symmetrieachse."
                show: { drawn: shape, kind: rectangle, colour: red }
                answer: false
                hints:
                  - "Falte das Rechteck in Gedanken von Ecke zu Ecke."
                  - "Die lange Seite landet nicht auf der kurzen. Ein Zipfel steht über."
                  - "Nein, das stimmt nicht."
              - id: l1-f4
                type: multiple_choice
                text: "Alle Seiten dieses Dreiecks sind gleich lang. Wie viele Symmetrieachsen hat es?"
                say: "Alle Seiten dieses Dreiecks sind gleich lang. Wie viele Symmetrieachsen hat es?"
                show: { drawn: shape, kind: triangle, colour: yellow }
                options: ["3", "1", "0"]
                answer: "3"
                hints:
                  - "Jede Achse geht von einer Ecke zur Mitte der Seite gegenüber."
                  - "Das Dreieck hat drei Ecken, und bei jeder klappt es."
                  - "3."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viele Symmetrieachsen hat der Kreis?"
                say: "Wie viele Symmetrieachsen hat der Kreis?"
                show: { drawn: shape, kind: circle, colour: red }
                options: ["unendlich viele", "2", "4"]
                answer: "unendlich viele"
                hints:
                  - "Falte den Kreis durch den Mittelpunkt. Dann dreh die Faltlinie ein Stück und falte wieder."
                  - "Jede Linie durch den Mittelpunkt teilt den Kreis in zwei gleiche Hälften."
                  - "Unendlich viele."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Alle Seiten dieses Sechsecks sind gleich lang. Wie viele Symmetrieachsen hat es?"
                say: "Alle Seiten dieses Sechsecks sind gleich lang. Wie viele Symmetrieachsen hat es?"
                show: { drawn: shape, kind: hexagon, colour: purple }
                options: ["6", "3", "2"]
                answer: "6"
                hints: ["Es gibt Achsen von Ecke zu Ecke und Achsen von Seitenmitte zu Seitenmitte."]
                difficulty: stretch
              - id: l1-s2
                type: true_false
                text: "Beim Quadrat ist die Linie von Ecke zu Ecke eine Symmetrieachse."
                say: "Stimmt das? Beim Quadrat ist die Linie von Ecke zu Ecke eine Symmetrieachse."
                show: { drawn: shape, kind: square, colour: green }
                answer: true
                hints: ["Falte in Gedanken. Liegen zwei Ecken dann genau aufeinander?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Welche Figur hat genau zwei Symmetrieachsen?"
                say: "Welche Figur hat genau zwei Symmetrieachsen?"
                options:
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: rectangle, colour: blue }
                  - { drawn: shape, kind: circle, colour: blue }
                answer: rectangle
                option_audio: false
                hints: ["Bei welcher Figur klappt es von Ecke zu Ecke nicht?"]
              - id: l1-s4
                type: multiple_choice
                text: "Wodurch geht jede Symmetrieachse des Kreises?"
                say: "Wodurch geht jede Symmetrieachse des Kreises?"
                options: ["durch den Mittelpunkt", "an der Kreislinie vorbei", "durch eine Ecke"]
                answer: "durch den Mittelpunkt"
                hints: ["Die Achse teilt den Kreis in zwei gleiche Hälften."]
              - id: l1-s5
                type: true_false
                text: "Das Dreieck mit drei gleich langen Seiten hat nur eine Symmetrieachse."
                say: "Stimmt das? Das Dreieck mit drei gleich langen Seiten hat nur eine Symmetrieachse."
                show: { drawn: shape, kind: triangle, colour: orange }
                answer: false
                hints: ["Probiere es von jeder Ecke aus."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Welche Figur hat vier Symmetrieachsen?"
                say: "Welche Figur hat vier Symmetrieachsen?"
                options:
                  - { drawn: shape, kind: rectangle, colour: green }
                  - { drawn: shape, kind: square, colour: green }
                  - { drawn: shape, kind: triangle, colour: green }
                answer: square
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Wie viele schräge Symmetrieachsen hat ein Rechteck, das kein Quadrat ist?"
                say: "Wie viele schräge Symmetrieachsen hat ein Rechteck, das kein Quadrat ist?"
                options: ["0", "2", "1"]
                answer: "0"
              - id: l1-n3
                type: image_multiple_choice
                text: "Welche Figur hat die meisten Symmetrieachsen?"
                say: "Welche Figur hat die meisten Symmetrieachsen?"
                options:
                  - { drawn: shape, kind: square, colour: red }
                  - { drawn: shape, kind: hexagon, colour: red }
                  - { drawn: shape, kind: circle, colour: red }
                answer: circle
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Ein Quadrat hat doppelt so viele Symmetrieachsen wie ein Rechteck."
                say: "Stimmt das? Ein Quadrat hat doppelt so viele Symmetrieachsen wie ein Rechteck, das kein Quadrat ist."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele Symmetrieachsen gehen beim Sechseck von Ecke zu Ecke?"
                say: "Alle Seiten des Sechsecks sind gleich lang. Wie viele seiner Symmetrieachsen gehen von Ecke zu Ecke?"
                show: { drawn: shape, kind: hexagon, colour: blue }
                options: ["3", "6", "2"]
                answer: "3"
                difficulty: stretch

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Symmetrieachsen des Quadrats gehen schräg von Ecke zu Ecke?"
            say: "Wie viele Symmetrieachsen des Quadrats gehen schräg von Ecke zu Ecke?"
            show: { drawn: shape, kind: square, colour: purple }
            options: ["2", "4", "0"]
            answer: "2"
          - id: l1-c2
            type: image_multiple_choice
            text: "Welche Figur hat genau drei Symmetrieachsen?"
            say: "Welche Figur hat genau drei Symmetrieachsen?"
            options:
              - { drawn: shape, kind: triangle, colour: orange }
              - { drawn: shape, kind: rectangle, colour: orange }
              - { drawn: shape, kind: square, colour: orange }
            answer: triangle
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Ein Rechteck, das kein Quadrat ist, hat vier Symmetrieachsen."
            say: "Stimmt das? Ein Rechteck, das kein Quadrat ist, hat vier Symmetrieachsen."
            answer: false

  - n: 2
    title: { de: "Buchstaben und schräge Achsen", en: "Letters and diagonal lines" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Symmetrieachsen hat ein Quadrat?"
            say: "Wie viele Symmetrieachsen hat ein Quadrat?"
            options: ["4", "2"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Beim Rechteck ist die Linie von Ecke zu Ecke keine Symmetrieachse."
            say: "Stimmt das? Beim Rechteck ist die Linie von Ecke zu Ecke keine Symmetrieachse."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "H: 2 Symmetrieachsen"
            say: "Das H kannst du senkrecht falten und auch waagerecht. Beide Male passen die Hälften. Das H hat zwei Symmetrieachsen."
            show: { drawn: letter-card, text: "H" }
          - text: "A: 1 Achse. F: keine Achse."
            say: "Das A hat nur eine senkrechte Achse. Das F hat gar keine, egal wie du es faltest."
            show: { drawn: letter-card, text: "A F" }
          - text: "Schräge Achse: Aus waagerecht wird senkrecht."
            say: "Eine Achse kann auch schräg liegen, zum Beispiel von links unten nach rechts oben. Beim Spiegeln an dieser Achse wird aus einer waagerechten Linie eine senkrechte. Ein Pfeil, der nach rechts zeigt, zeigt im Spiegelbild nach oben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Symmetrieachsen hat das H?"
                say: "Wie viele Symmetrieachsen hat das H?"
                show: { drawn: letter-card, text: "H" }
                options: ["2", "1", "4"]
                answer: "2"
                feedback:
                  "1": "Senkrecht passt es. Probiere auch waagerecht: Der obere Teil passt auf den unteren."
                hints:
                  - "Falte senkrecht und waagerecht."
                  - "Links passt auf rechts, und oben passt auf unten."
                  - "2."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie viele Symmetrieachsen hat das T?"
                say: "Wie viele Symmetrieachsen hat das T?"
                show: { drawn: letter-card, text: "T" }
                options: ["1", "2", "0"]
                answer: "1"
                hints:
                  - "Falte senkrecht und waagerecht."
                  - "Senkrecht passt es. Waagerecht ist oben der Balken und unten nur ein Strich."
                  - "1."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Buchstabe hat zwei Symmetrieachsen?"
                say: "Welcher Buchstabe hat zwei Symmetrieachsen?"
                options: ["I", "E", "A"]
                answer: "I"
                option_audio: false
                feedback:
                  "E": "Das E hat nur eine waagerechte Achse. Links und rechts passen nicht."
                  "A": "Das A hat nur eine senkrechte Achse. Oben und unten passen nicht."
                hints:
                  - "Probiere bei jedem Buchstaben senkrecht und waagerecht."
                  - "Ein Buchstabe ist nur ein gerader Strich."
                  - "I."
              - id: l2-f4
                type: multiple_choice
                text: "Ein Pfeil zeigt nach rechts. Du spiegelst ihn an der schrägen Achse von links unten nach rechts oben. Wohin zeigt er dann?"
                say: "Ein Pfeil zeigt nach rechts. Du spiegelst ihn an einer schrägen Achse, die von links unten nach rechts oben geht. Wohin zeigt der Pfeil dann?"
                options: ["nach oben", "nach links", "nach unten"]
                answer: "nach oben"
                feedback:
                  "nach links": "So wäre es bei einer senkrechten Achse. An der schrägen Achse wird aus waagerecht senkrecht."
                hints:
                  - "An dieser schrägen Achse wird aus einer waagerechten Linie eine senkrechte."
                  - "Stell dir vor, du faltest das Blatt an der Achse. Die Spitze rechts unten klappt nach links oben."
                  - "Nach oben."
              - id: l2-f5
                type: multiple_choice
                text: "Wie viele Symmetrieachsen hat das X?"
                say: "Wie viele Symmetrieachsen hat das X?"
                show: { drawn: letter-card, text: "X" }
                options: ["2", "1", "0"]
                answer: "2"
                hints:
                  - "Falte senkrecht und waagerecht."
                  - "Beide Male passen die Hälften."
                  - "2."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Symmetrieachsen hat das E?"
                say: "Wie viele Symmetrieachsen hat das E?"
                show: { drawn: letter-card, text: "E" }
                options: ["1", "2", "0"]
                answer: "1"
                hints: ["Oben und unten passen. Und links und rechts?"]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Buchstabe hat keine Symmetrieachse?"
                say: "Welcher Buchstabe hat keine Symmetrieachse?"
                options: ["S", "H", "D"]
                answer: "S"
                option_audio: false
                hints: ["Beim S zeigen die Bögen in verschiedene Richtungen."]
              - id: l2-s3
                type: multiple_choice
                text: "Ein Pfeil zeigt nach oben. Du spiegelst ihn an der schrägen Achse von links unten nach rechts oben. Wohin zeigt er dann?"
                say: "Ein Pfeil zeigt nach oben. Du spiegelst ihn an der schrägen Achse von links unten nach rechts oben. Wohin zeigt er dann?"
                options: ["nach rechts", "nach unten", "nach links"]
                answer: "nach rechts"
                hints: ["Aus senkrecht wird waagerecht. Oben links klappt nach unten rechts."]
              - id: l2-s4
                type: true_false
                text: "Das O hat mehr als eine Symmetrieachse."
                say: "Stimmt das? Das O hat mehr als eine Symmetrieachse."
                show: { drawn: letter-card, text: "O" }
                answer: true
                hints: ["Falte senkrecht und waagerecht."]
              - id: l2-s5
                type: sorting
                text: "Wie viele Symmetrieachsen hat jeder Buchstabe?"
                say: "Sortiere die Buchstaben: keine Symmetrieachse, eine oder zwei?"
                bins:
                  - { id: zero, show: { text: "keine Achse" }, say: "keine Achse" }
                  - { id: one, show: { text: "1 Achse" }, say: "eine Achse" }
                  - { id: two, show: { text: "2 Achsen" }, say: "zwei Achsen" }
                options:
                  - { text: "H", bin: two }
                  - { text: "A", bin: one }
                  - { text: "F", bin: zero }
                  - { text: "I", bin: two }
                  - { text: "B", bin: one }
                  - { text: "L", bin: zero }
                option_audio: false
                hints: ["Falte jeden Buchstaben in Gedanken senkrecht und waagerecht."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele Symmetrieachsen hat das D?"
                say: "Wie viele Symmetrieachsen hat das D?"
                show: { drawn: letter-card, text: "D" }
                options: ["1", "2", "0"]
                answer: "1"
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Buchstabe hat genau zwei Symmetrieachsen?"
                say: "Welcher Buchstabe hat genau zwei Symmetrieachsen?"
                options: ["X", "Y", "K"]
                answer: "X"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Ein Pfeil zeigt nach links. Du spiegelst ihn an der schrägen Achse von links unten nach rechts oben. Wohin zeigt er dann?"
                say: "Ein Pfeil zeigt nach links. Du spiegelst ihn an der schrägen Achse von links unten nach rechts oben. Wohin zeigt er dann?"
                options: ["nach unten", "nach oben", "nach rechts"]
                answer: "nach unten"
                difficulty: stretch
              - id: l2-n4
                type: true_false
                text: "Das N hat eine Symmetrieachse."
                say: "Stimmt das? Das N hat eine Symmetrieachse."
                show: { drawn: letter-card, text: "N" }
                answer: false
              - id: l2-n5
                type: sorting
                text: "Wie viele Symmetrieachsen hat jeder Buchstabe?"
                say: "Sortiere die Buchstaben: keine Symmetrieachse, eine oder zwei?"
                bins:
                  - { id: zero, show: { text: "keine Achse" }, say: "keine Achse" }
                  - { id: one, show: { text: "1 Achse" }, say: "eine Achse" }
                  - { id: two, show: { text: "2 Achsen" }, say: "zwei Achsen" }
                options:
                  - { text: "T", bin: one }
                  - { text: "X", bin: two }
                  - { text: "Z", bin: zero }
                  - { text: "U", bin: one }
                  - { text: "O", bin: two }
                  - { text: "G", bin: zero }
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: true_false
            text: "Tim faltet ein Rechteck von Ecke zu Ecke. Die Hälften passen genau aufeinander."
            say: "Stimmt das? Tim faltet ein Rechteck, das kein Quadrat ist, von Ecke zu Ecke. Die Hälften passen genau aufeinander."
            answer: false
          - id: l2-c2
            type: multiple_choice
            text: "Wie viele Symmetrieachsen hat ein Quadrat mehr als ein Rechteck?"
            say: "Wie viele Symmetrieachsen hat ein Quadrat mehr als ein Rechteck, das kein Quadrat ist?"
            options: ["2", "4", "0"]
            answer: "2"
          - id: l2-c3
            type: multiple_choice
            text: "Wie viele Symmetrieachsen hat das I?"
            say: "Wie viele Symmetrieachsen hat das I?"
            show: { drawn: letter-card, text: "I" }
            options: ["2", "1", "0"]
            answer: "2"
          - id: l2-c4
            type: multiple_choice
            text: "Ein Pfeil zeigt nach unten. Du spiegelst ihn an der schrägen Achse von links unten nach rechts oben. Wohin zeigt er dann?"
            say: "Ein Pfeil zeigt nach unten. Du spiegelst ihn an der schrägen Achse von links unten nach rechts oben. Wohin zeigt er dann?"
            options: ["nach links", "nach oben", "nach rechts"]
            answer: "nach links"
          - id: l2-c5
            type: multiple_choice
            text: "Welche Figur hat unendlich viele Symmetrieachsen?"
            say: "Welche Figur hat unendlich viele Symmetrieachsen?"
            options: ["der Kreis", "das Quadrat", "das Sechseck"]
            answer: "der Kreis"
