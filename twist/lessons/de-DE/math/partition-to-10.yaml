# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.partition-to-10
skill: math.numbers-to-20.partition-to-10
curriculum: de-DE
language: de
title:
  de: Zahlen zerlegen bis 10
  en: Splitting numbers to 10
summary: >
  Children split every number to 10 into two parts in different ways.
  Lesson 1 splits counters into red and blue (5 is 2 and 3). Lesson 2
  writes the splits in the Zahlenhaus. Lesson 3 finds all the splits of a
  number in order, so none is missing, and ends with the skill check.
  These splits are what later addition and subtraction rest on.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.subitize-to-10]
  also_practises: [math.numbers-to-20.write-numerals-to-10]
  vocabulary: { de: [zerlegen, Teil, Zahlenhaus, Dach, Stockwerk, und] }
  forms: [drawn, text, audio]
  drawn: [dots, ten-frame, number-house]
  facets: [operation-signs]
  misconceptions:
    - id: parts-not-whole
      what: Thinks the parts make a new number instead of the same amount, split
      addressed: lesson 1 Learn moves the same counters into two colours; true_false asks whether 4 and 2 are still 6
    - id: one-split
      what: Knows one split of a number (5 = 2 + 3) and thinks it is the only one
      addressed: lesson 3 finds all splits in order (0 + 6, 1 + 5, 2 + 4 ...)
    - id: house-order
      what: Reads the Zahlenhaus without knowing that both rooms together make the roof
      addressed: lesson 2 Learn says "Die zwei Zahlen zusammen sind so viel wie das Dach"; the first hint of l2-f1 repeats it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zerlegen mit Plättchen, en: Splitting with counters }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Punkte? Schau genau!"
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1], flash: 2 }
            options: ["5", "6", "7"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Punkte? Schau genau!"
            show: { drawn: dots, count: 4, layout: dice, flash: 2 }
            options: ["3", "4", "5"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5"
            say: "Hier liegen fünf Plättchen."
            show: { drawn: dots, count: 5, layout: row }
          - text: "5 = 2 + 3"
            say: "Jetzt sind zwei rot und drei blau. Es sind immer noch fünf. Man sagt: Fünf ist zwei und drei."
            show: { drawn: dots, count: 5, layout: row, colour_split: [2, 3] }
          - text: "5 = 4 + 1"
            say: "Man kann die Fünf auch anders zerlegen: vier rote und ein blaues. Fünf ist vier und eins."
            show: { drawn: dots, count: 5, layout: row, colour_split: [4, 1] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele sind blau?"
                say: "Hier sind sechs Plättchen. Vier sind rot. Wie viele sind blau?"
                show: { drawn: dots, count: 6, layout: row, colour_split: [4, 2] }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Zähl nur die blauen Plättchen."
                  - "Sechs sind vier rote und ein paar blaue."
                  - "Es sind 2 blaue."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Wie wird die 5 zerlegt?"
                say: "Fünf ist ... und ... Wie viele rote, wie viele blaue?"
                show: { drawn: dots, count: 5, layout: row, colour_split: [3, 2] }
                frame: "5 = _ + _"
                options: ["1", "2", "3", "4"]
                answer: ["3", "2"]
                hints:
                  - "Zähl zuerst die roten, dann die blauen."
                  - "Drei rote, zwei blaue."
                  - "5 = 3 + 2"
              - id: l1-f3
                type: true_false
                text: "Stimmt das? 6 = 4 + 2"
                say: "Hier sind vier rote und zwei blaue. Sind das zusammen sechs?"
                show: { drawn: dots, count: 6, layout: row, colour_split: [4, 2] }
                answer: true
                hints:
                  - "Zähl alle Plättchen zusammen."
                  - "Vier und zwei."
                  - "Ja, vier und zwei sind sechs."
              - id: l1-f4
                type: fill_in_blank
                text: "Wie viele fehlen?"
                say: "Sieben ist vier und wie viel?"
                show: { drawn: ten-frame, filled: 7, colour_split: [4, 3] }
                frame: "7 = 4 + _"
                options: ["2", "3", "4"]
                answer: ["3"]
                hints:
                  - "Die roten sind vier. Zähl die blauen."
                  - "Unten liegen noch blaue."
                  - "7 = 4 + 3"
              - id: l1-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Tippe auf eine Zerlegung und dann auf das passende Bild."
                pairs:
                  - left: { text: "2 + 2" }
                    right: { drawn: dots, count: 4, layout: row, colour_split: [2, 2] }
                  - left: { text: "1 + 4" }
                    right: { drawn: dots, count: 5, layout: row, colour_split: [1, 4] }
                  - left: { text: "3 + 3" }
                    right: { drawn: dots, count: 6, layout: row, colour_split: [3, 3] }
                hints:
                  - "Die erste Zahl sagt, wie viele rot sind."
                  - "Zähl in jedem Bild die roten und die blauen."
                  - "Ein rotes und vier blaue: Das ist 1 + 4."
              - id: l1-f6
                type: multiple_choice
                text: "Wie viele sind rot?"
                say: "Hier sind acht Plättchen. Drei sind blau. Wie viele sind rot?"
                show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                options: ["4", "5", "6"]
                answer: "5"
                hints:
                  - "Zähl nur die roten."
                  - "Die rote Reihe oben ist voll."
                  - "Eine volle Reihe ist 5."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Wie wird die 6 zerlegt?"
                say: "Sechs ist ... und ... Wie viele rote, wie viele blaue?"
                show: { drawn: dots, count: 6, layout: row, colour_split: [1, 5] }
                frame: "6 = _ + _"
                options: ["1", "4", "5", "6"]
                answer: ["1", "5"]
                hints: ["Zuerst die roten, dann die blauen."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie viele sind blau?"
                say: "Hier sind neun Plättchen. Fünf sind rot. Wie viele sind blau?"
                show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                options: ["3", "4", "5"]
                answer: "4"
                hints: ["Zähl die blauen in der unteren Reihe."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? 7 = 5 + 1"
                say: "Hier sind fünf rote und zwei blaue. Stimmt das: Sieben ist fünf und eins?"
                show: { drawn: dots, count: 7, layout: row, colour_split: [5, 2] }
                answer: false
                hints: ["Zähl die blauen genau."]
              - id: l1-s4
                type: fill_in_blank
                text: "Wie viele fehlen?"
                say: "Vier ist eins und wie viel?"
                show: { drawn: dots, count: 4, layout: row, colour_split: [1, 3] }
                frame: "4 = 1 + _"
                options: ["2", "3", "4"]
                answer: ["3"]
                hints: ["Zähl die blauen."]
              - id: l1-s5
                type: matching
                text: "Was passt zusammen?"
                say: "Tippe auf eine Zerlegung und dann auf das passende Bild."
                pairs:
                  - left: { text: "5 + 2" }
                    right: { drawn: dots, count: 7, layout: row, colour_split: [5, 2] }
                  - left: { text: "2 + 5" }
                    right: { drawn: dots, count: 7, layout: row, colour_split: [2, 5] }
                  - left: { text: "4 + 3" }
                    right: { drawn: dots, count: 7, layout: row, colour_split: [4, 3] }
                hints: ["Es sind sieben Plättchen. Zähl die roten vorne."]
                difficulty: stretch
              - id: l1-s6
                type: multiple_choice
                text: "Wie viele sind rot?"
                say: "Hier sind zehn Plättchen. Zwei sind blau. Wie viele sind rot?"
                show: { drawn: ten-frame, filled: 10, colour_split: [8, 2] }
                options: ["7", "8", "9"]
                answer: "8"
                hints: ["Oben fünf rote, unten noch ein paar rote."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Wie wird die 8 zerlegt?"
                say: "Acht ist ... und ... Wie viele rote, wie viele blaue?"
                show: { drawn: ten-frame, filled: 8, colour_split: [6, 2] }
                frame: "8 = _ + _"
                options: ["2", "5", "6", "3"]
                answer: ["6", "2"]
              - id: l1-n2
                type: multiple_choice
                text: "Wie viele sind blau?"
                say: "Hier sind fünf Plättchen. Eins ist rot. Wie viele sind blau?"
                show: { drawn: dots, count: 5, layout: row, colour_split: [1, 4] }
                options: ["3", "4", "5"]
                answer: "4"
              - id: l1-n3
                type: true_false
                text: "Stimmt das? 9 = 4 + 5"
                say: "Hier sind vier rote und fünf blaue. Stimmt das: Neun ist vier und fünf?"
                show: { drawn: dots, count: 9, layout: row, colour_split: [4, 5] }
                answer: true
              - id: l1-n4
                type: fill_in_blank
                text: "Wie viele fehlen?"
                say: "Zehn ist sieben und wie viel?"
                show: { drawn: ten-frame, filled: 10, colour_split: [7, 3] }
                frame: "10 = 7 + _"
                options: ["2", "3", "4"]
                answer: ["3"]
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele sind rot?"
                say: "Hier sind drei Plättchen. Zwei sind blau. Wie viele sind rot?"
                show: { drawn: dots, count: 3, layout: row, colour_split: [1, 2] }
                options: ["1", "2", "3"]
                answer: "1"
                difficulty: easy

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Wie wird die 7 zerlegt?"
            say: "Sieben ist ... und ... Wie viele rote, wie viele blaue?"
            show: { drawn: dots, count: 7, layout: row, colour_split: [3, 4] }
            frame: "7 = _ + _"
            options: ["3", "4", "5", "2"]
            answer: ["3", "4"]
          - id: l1-c2
            type: multiple_choice
            text: "Wie viele sind blau?"
            say: "Hier sind sechs Plättchen. Fünf sind rot. Wie viele sind blau?"
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
            options: ["1", "2", "0"]
            answer: "1"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 8 = 4 + 4"
            say: "Hier sind vier rote und vier blaue. Sind das zusammen acht?"
            show: { drawn: dots, count: 8, layout: row, colour_split: [4, 4] }
            answer: true

  - n: 2
    title: { de: Das Zahlenhaus, en: The number house }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Wie viele fehlen?"
            say: "Sechs ist zwei und wie viel?"
            show: { drawn: dots, count: 6, layout: row, colour_split: [2, 4] }
            frame: "6 = 2 + _"
            options: ["3", "4", "5"]
            answer: ["4"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viele sind blau?"
            say: "Hier sind sieben Plättchen. Sechs sind rot. Wie viele sind blau?"
            show: { drawn: dots, count: 7, layout: row, colour_split: [6, 1] }
            options: ["1", "2", "3"]
            answer: "1"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Zahlenhaus 6"
            say: "Das ist ein Zahlenhaus. Oben im Dach steht die Zahl, die wir zerlegen: sechs."
            show: { drawn: number-house, roof: 6, rows: [[4, 2]] }
          - text: "4 + 2 = 6"
            say: "In jedem Stockwerk wohnen zwei Zahlen. Die zwei Zahlen zusammen sind so viel wie das Dach: vier und zwei sind sechs."
            show: { drawn: number-house, roof: 6, rows: [[4, 2], [5, 1]] }
          - text: "3 + ? = 6"
            say: "Fehlt eine Zahl, fragst du: Drei und wie viel sind sechs? Drei und drei sind sechs."
            show: { drawn: number-house, roof: 6, rows: [[4, 2], [5, 1], [3, null]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist fünf. Im Stockwerk wohnt die Drei. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 5, rows: [[3, null]] }
                frame: "3 + _ = 5"
                options: ["1", "2", "3"]
                answer: ["2"]
                hints:
                  - "Beide Zahlen zusammen sind so viel wie das Dach."
                  - "Drei und wie viel sind fünf? Zähl von drei weiter bis fünf."
                  - "3 + 2 = 5"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist sieben. Im Stockwerk wohnt die Fünf. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 7, rows: [[5, null]] }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Fünf und wie viel sind sieben?"
                  - "Zähl von fünf weiter bis sieben: sechs, sieben."
                  - "5 + 2 = 7"
              - id: l2-f3
                type: true_false
                text: "Stimmt das Stockwerk?"
                say: "Das Dach ist acht. Im Stockwerk wohnen vier und vier. Stimmt das?"
                show: { drawn: number-house, roof: 8, rows: [[4, 4]] }
                answer: true
                hints:
                  - "Rechne: vier und vier."
                  - "Vier und vier sind acht."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: fill_in_blank
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist sechs. Im Stockwerk wohnt rechts die Eins. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 6, rows: [[null, 1]] }
                frame: "_ + 1 = 6"
                options: ["4", "5", "6"]
                answer: ["5"]
                hints:
                  - "Hier fehlt die linke Zahl."
                  - "Wie viel und eins sind sechs?"
                  - "5 + 1 = 6"
              - id: l2-f5
                type: true_false
                text: "Stimmt das Stockwerk?"
                say: "Das Dach ist neun. Im Stockwerk wohnen sechs und zwei. Stimmt das?"
                show: { drawn: number-house, roof: 9, rows: [[6, 2]] }
                answer: false
                feedback:
                  "true": "Sechs und zwei sind acht, nicht neun."
                hints:
                  - "Rechne: sechs und zwei."
                  - "Sechs, sieben, acht."
                  - "Nein, sechs und zwei sind 8."
              - id: l2-f6
                type: multiple_choice
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist zehn. Im Stockwerk wohnt die Sieben. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 10, rows: [[7, null]] }
                options: ["2", "3", "4"]
                answer: "3"
                hints:
                  - "Sieben und wie viel sind zehn?"
                  - "Zähl von sieben weiter bis zehn: acht, neun, zehn."
                  - "7 + 3 = 10"

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist vier. Im Stockwerk wohnt die Eins. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 4, rows: [[1, null]] }
                frame: "1 + _ = 4"
                options: ["2", "3", "4"]
                answer: ["3"]
                hints: ["Eins und wie viel sind vier?"]
              - id: l2-s2
                type: multiple_choice
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist acht. Im Stockwerk wohnt die Sechs. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 8, rows: [[6, null]] }
                options: ["1", "2", "3"]
                answer: "2"
                hints: ["Zähl von sechs weiter bis acht."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das Stockwerk?"
                say: "Das Dach ist sieben. Im Stockwerk wohnen drei und vier. Stimmt das?"
                show: { drawn: number-house, roof: 7, rows: [[3, 4]] }
                answer: true
                hints: ["Rechne: drei und vier."]
              - id: l2-s4
                type: fill_in_blank
                text: "Welche Zahlen fehlen im Zahlenhaus?"
                say: "Das Dach ist neun. In zwei Stockwerken fehlt eine Zahl. Welche?"
                show: { drawn: number-house, roof: 9, rows: [[5, null], [null, 1]] }
                frame: "5 + _ = 9 und _ + 1 = 9"
                options: ["3", "4", "8", "9"]
                answer: ["4", "8"]
                hints: ["Mach ein Stockwerk nach dem anderen."]
                difficulty: stretch
              - id: l2-s5
                type: multiple_choice
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist fünf. Im Stockwerk wohnt die Null. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 5, rows: [[0, null]] }
                options: ["0", "4", "5"]
                answer: "5"
                hints: ["Null ist gar nichts. Wie viel brauchst du dann noch bis fünf?"]
              - id: l2-s6
                type: fill_in_blank
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist zehn. Im Stockwerk wohnt rechts die Fünf. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 10, rows: [[null, 5]] }
                frame: "_ + 5 = 10"
                options: ["4", "5", "6"]
                answer: ["5"]
                hints: ["Zwei volle Fünferreihen sind zehn."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist sieben. Im Stockwerk wohnt die Eins. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 7, rows: [[1, null]] }
                frame: "1 + _ = 7"
                options: ["5", "6", "7"]
                answer: ["6"]
              - id: l2-n2
                type: multiple_choice
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist neun. Im Stockwerk wohnt die Drei. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 9, rows: [[3, null]] }
                options: ["5", "6", "7"]
                answer: "6"
              - id: l2-n3
                type: true_false
                text: "Stimmt das Stockwerk?"
                say: "Das Dach ist sechs. Im Stockwerk wohnen zwei und drei. Stimmt das?"
                show: { drawn: number-house, roof: 6, rows: [[2, 3]] }
                answer: false
              - id: l2-n4
                type: fill_in_blank
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist acht. Im Stockwerk wohnt rechts die Drei. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 8, rows: [[null, 3]] }
                frame: "_ + 3 = 8"
                options: ["4", "5", "6"]
                answer: ["5"]
              - id: l2-n5
                type: multiple_choice
                text: "Welche Zahl fehlt im Zahlenhaus?"
                say: "Das Dach ist drei. Im Stockwerk wohnt die Zwei. Welche Zahl fehlt?"
                show: { drawn: number-house, roof: 3, rows: [[2, null]] }
                options: ["1", "2", "3"]
                answer: "1"
                difficulty: easy

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Welche Zahl fehlt im Zahlenhaus?"
            say: "Das Dach ist sechs. Im Stockwerk wohnt die Vier. Welche Zahl fehlt?"
            show: { drawn: number-house, roof: 6, rows: [[4, null]] }
            frame: "4 + _ = 6"
            options: ["1", "2", "3"]
            answer: ["2"]
          - id: l2-c2
            type: multiple_choice
            text: "Welche Zahl fehlt im Zahlenhaus?"
            say: "Das Dach ist zehn. Im Stockwerk wohnt die Zwei. Welche Zahl fehlt?"
            show: { drawn: number-house, roof: 10, rows: [[2, null]] }
            options: ["7", "8", "9"]
            answer: "8"
          - id: l2-c3
            type: true_false
            text: "Stimmt das Stockwerk?"
            say: "Das Dach ist fünf. Im Stockwerk wohnen eins und vier. Stimmt das?"
            show: { drawn: number-house, roof: 5, rows: [[1, 4]] }
            answer: true

  - n: 3
    title: { de: Alle Zerlegungen finden, en: Finding every split }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Welche Zahl fehlt im Zahlenhaus?"
            say: "Das Dach ist sieben. Im Stockwerk wohnt die Vier. Welche Zahl fehlt?"
            show: { drawn: number-house, roof: 7, rows: [[4, null]] }
            options: ["2", "3", "4"]
            answer: "3"
            difficulty: easy
          - id: l3-w2
            type: fill_in_blank
            text: "Wie wird die 5 zerlegt?"
            say: "Fünf ist ... und ... Wie viele rote, wie viele blaue?"
            show: { drawn: dots, count: 5, layout: row, colour_split: [4, 1] }
            frame: "5 = _ + _"
            options: ["1", "3", "4"]
            answer: ["4", "1"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "0 + 4, 1 + 3, 2 + 2, 3 + 1, 4 + 0"
            say: "Die Vier kann man auf viele Arten zerlegen. Damit keine fehlt, gehst du der Reihe nach: links null, eins, zwei, drei, vier. Rechts wird es immer eins weniger."
            show: { drawn: number-house, roof: 4, rows: [[0, 4], [1, 3], [2, 2], [3, 1], [4, 0]] }
          - text: "6"
            say: "Bei der Sechs genauso: null und sechs, eins und fünf, zwei und vier, drei und drei, und so weiter. Die Sechs hat sieben Stockwerke."
            show: { drawn: number-house, roof: 6, rows: [[0, 6], [1, 5], [2, 4], [3, 3], [4, 2], [5, 1], [6, 0]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
