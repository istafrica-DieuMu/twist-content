# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.length-notation
skill: math.length.notation
curriculum: de-DE
language: de
title:
  de: Längen mit Komma
  en: Lengths with decimals
summary: >
  Lesson 1 writes metres and centimetres with a comma like euros and
  cent (1,25 m = 1 m 25 cm = 125 cm, 1,5 m = 150 cm) and centimetres and
  millimetres on a ruler (4,5 cm = 45 mm); lesson 2 does the same for
  kilometres, with three places after the comma (2,5 km = 2 km 500 m =
  2500 m, 1,05 km = 1050 m), and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Längen, en: Length }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.length.mm-km, math.money.decimal-notation]
  also_practises: [math.length.mm-km, math.money.decimal-notation]
  vocabulary: { de: [Kommaschreibweise, Kilometer, Meter, Zentimeter, Millimeter, Stelle] }
  forms: [drawn, text, audio]
  drawn: [ruler]
  facets: [number-format, units]
  misconceptions:
    - id: digits-after-comma-as-unit
      what: Reads the digits after the comma as the smaller unit as they stand (1,5 m = 1 m 5 cm, 3,5 km = 3005 m)
      addressed: lesson 1 Learn compares 1,5 m with 1,50 €, lesson 2 Learn writes 2,5 km as 2,500 km; every stage offers the misread length, with feedback in l1-f2 and l2-f1
    - id: zeros-lost
      what: Drops or moves the zeros that hold a place (2 m 8 cm = 2,8 m, 1,05 km = 1500 m)
      addressed: l1-f3, l1-s3, l1-c3, l2-f3, l2-f4, l2-n2, l2-n3 and l2-c3 have a zero inside the number, and lesson 2 Learn sets 1,05 km beside 1,005 km
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Meter, Zentimeter, Millimeter", en: "Metres, centimetres, millimetres" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1 m = _ cm"
            say: "Ein Meter sind wie viele Zentimeter?"
            options: ["100", "10", "1000"]
            answer: "100"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "3,45 € = _ ct"
            say: "Drei Euro fünfundvierzig sind wie viele Cent?"
            options: ["345", "3045", "34"]
            answer: "345"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1,25 m = 1 m 25 cm = 125 cm"
            say: "Längen kannst du mit Komma schreiben, so wie Geld. Vor dem Komma stehen die Meter, nach dem Komma die Zentimeter. Eins Komma zwei fünf Meter sind ein Meter und fünfundzwanzig Zentimeter, also hundertfünfundzwanzig Zentimeter."
          - text: "1,5 m = 1,50 m = 1 m 50 cm = 150 cm\n1,05 m = 1 m 5 cm = 105 cm"
            say: "Ein Meter hat hundert Zentimeter. Darum stehen nach dem Komma zwei Stellen für die Zentimeter. Eins Komma fünf Meter ist wie ein Euro fünfzig: ein Meter fünfzig. Für fünf Zentimeter schreibst du eins Komma null fünf Meter."
          - text: "4,5 cm = 4 cm 5 mm = 45 mm"
            say: "Bei Zentimetern und Millimetern gibt es nach dem Komma eine Stelle, denn ein Zentimeter hat zehn Millimeter. Der Streifen ist vier Komma fünf Zentimeter lang, also vier Zentimeter und fünf Millimeter."
            show: { drawn: ruler, to: 10, length: 4.5 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1,35 m = _"
                say: "Eins Komma drei fünf Meter sind wie viele Zentimeter?"
                options: ["135 cm", "1035 cm", "35 cm"]
                answer: "135 cm"
                hints:
                  - "Vor dem Komma stehen die Meter, danach die Zentimeter."
                  - "1 m 35 cm. 1 m sind 100 cm."
                  - "135 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "1,5 m = _"
                say: "Eins Komma fünf Meter sind wie viele Zentimeter?"
                options: ["150 cm", "105 cm", "15 cm"]
                answer: "150 cm"
                feedback:
                  "105 cm": "1,5 m ist wie 1,50 €. Nach dem Komma stehen 50 Zentimeter, nicht 5."
                hints:
                  - "Denk an Geld: 1,5 € ist 1,50 €."
                  - "1,5 m = 1,50 m = 1 m 50 cm."
                  - "150 cm."
              - id: l1-f3
                type: fill_in_blank
                text: "Schreib mit Komma."
                say: "Zwei Meter und acht Zentimeter. Schreib die Länge mit Komma."
                frame: "2 m 8 cm = _ m"
                options: ["2,08", "2,8", "2,80"]
                answer: ["2,08"]
                hints:
                  - "Nach dem Komma stehen zwei Stellen für die Zentimeter."
                  - "8 cm schreibst du als 08."
                  - "2,08 m."
              - id: l1-f4
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Lies am Lineal ab. Wie lang ist der Streifen?"
                show: { drawn: ruler, to: 10, length: 6.5 }
                options: ["6,5 cm", "65 cm", "6,05 cm"]
                answer: "6,5 cm"
                hints:
                  - "Zähle zuerst die ganzen Zentimeter."
                  - "6 ganze Zentimeter und noch 5 Millimeter."
                  - "6,5 cm."
              - id: l1-f5
                type: matching
                text: "Was ist gleich lang?"
                say: "Verbinde die Längen, die gleich lang sind."
                pairs:
                  - { left: { text: "1,20 m" }, right: { text: "120 cm" } }
                  - { left: { text: "1,02 m" }, right: { text: "102 cm" } }
                  - { left: { text: "1,12 m" }, right: { text: "112 cm" } }
                hints:
                  - "Nach dem Komma stehen die Zentimeter."
                  - "1,02 m sind 1 m und 2 cm."
                  - "1,20 m und 120 cm, 1,02 m und 102 cm, 1,12 m und 112 cm."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "3,40 m = _"
                say: "Drei Komma vier null Meter sind wie viele Zentimeter?"
                options: ["340 cm", "304 cm", "34 cm"]
                answer: "340 cm"
                hints: ["3 m 40 cm."]
              - id: l1-s2
                type: fill_in_blank
                text: "Wie viele Meter und Zentimeter sind das?"
                say: "Hundertfünfundachtzig Zentimeter. Wie viele Meter und Zentimeter sind das?"
                frame: "185 cm = _ m _ cm"
                options: ["1", "85", "18", "5"]
                answer: ["1", "85"]
                hints: ["100 cm sind 1 m."]
              - id: l1-s3
                type: multiple_choice
                text: "Was ist gleich lang wie 2,05 m?"
                say: "Welche Länge ist gleich lang wie zwei Komma null fünf Meter?"
                options: ["205 cm", "250 cm", "25 cm"]
                answer: "205 cm"
                hints: ["2,05 m sind 2 m und 5 cm."]
              - id: l1-s4
                type: multiple_choice
                text: "Wie viele Millimeter ist der Streifen lang?"
                say: "Lies am Lineal ab. Wie viele Millimeter ist der Streifen lang?"
                show: { drawn: ruler, to: 10, length: 3.8 }
                options: ["38 mm", "3,8 mm", "308 mm"]
                answer: "38 mm"
                hints: ["1 cm sind 10 mm."]
              - id: l1-s5
                type: true_false
                text: "0,75 m = 75 cm. Stimmt das?"
                say: "Null Komma sieben fünf Meter sind fünfundsiebzig Zentimeter. Stimmt das?"
                answer: true
                hints: ["0 m und 75 cm."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "4,60 m = _"
                say: "Vier Komma sechs null Meter sind wie viele Zentimeter?"
                options: ["460 cm", "406 cm", "46 cm"]
                answer: "460 cm"
              - id: l1-n2
                type: fill_in_blank
                text: "Schreib mit Komma."
                say: "Sieben Zentimeter und drei Millimeter. Schreib die Länge mit Komma."
                frame: "7 cm 3 mm = _ cm"
                options: ["7,3", "73", "7,03"]
                answer: ["7,3"]
              - id: l1-n3
                type: multiple_choice
                text: "Welche Länge ist am längsten?"
                say: "Welche Länge ist am längsten?"
                options: ["1,8 m", "1,08 m", "170 cm"]
                answer: "1,8 m"
              - id: l1-n4
                type: true_false
                text: "2,5 m = 2 m 5 cm. Stimmt das?"
                say: "Zwei Komma fünf Meter sind zwei Meter und fünf Zentimeter. Stimmt das?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "0,9 m = _"
                say: "Null Komma neun Meter sind wie viele Zentimeter?"
                options: ["90 cm", "9 cm", "900 cm"]
                answer: "90 cm"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "2,45 m = _"
            say: "Zwei Komma vier fünf Meter sind wie viele Zentimeter?"
            options: ["245 cm", "2045 cm", "24,5 cm"]
            answer: "245 cm"
          - id: l1-c2
            type: multiple_choice
            text: "3,7 m = _"
            say: "Drei Komma sieben Meter sind wie viele Zentimeter?"
            options: ["370 cm", "307 cm", "37 cm"]
            answer: "370 cm"
          - id: l1-c3
            type: fill_in_blank
            text: "Schreib mit Komma."
            say: "Ein Meter und sechs Zentimeter. Schreib die Länge mit Komma."
            frame: "1 m 6 cm = _ m"
            options: ["1,06", "1,6", "1,60"]
            answer: ["1,06"]

  - n: 2
    title: { de: "Kilometer und Meter", en: "Kilometres and metres" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "2,30 m = _"
            say: "Zwei Komma drei null Meter sind wie viele Zentimeter?"
            options: ["230 cm", "203 cm", "23 cm"]
            answer: "230 cm"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "1 km = _ m"
            say: "Ein Kilometer sind wie viele Meter?"
            options: ["1000", "100", "10 000"]
            answer: "1000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2,5 km = 2,500 km = 2 km 500 m = 2500 m"
            say: "Ein Kilometer hat tausend Meter. Darum stehen nach dem Komma drei Stellen für die Meter. Zwei Komma fünf Kilometer sind zwei Komma fünf null null Kilometer, also zwei Kilometer und fünfhundert Meter."
          - text: "1,25 km = 1,250 km = 1250 m\n1,05 km = 1,050 km = 1050 m\n1,005 km = 1005 m"
            say: "Achte auf die Nullen. Eins Komma null fünf Kilometer sind tausendfünfzig Meter. Eins Komma null null fünf Kilometer sind nur tausendfünf Meter. Die Null hält den Platz frei."
          - text: "3600 m = 3 km 600 m = 3,6 km"
            say: "Umgekehrt geht es auch. Von dreitausendsechshundert Metern sind dreitausend Meter drei Kilometer. Die schreibst du vor das Komma. Die sechshundert Meter kommen dahinter: drei Komma sechs Kilometer."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "3,5 km = _"
                say: "Drei Komma fünf Kilometer sind wie viele Meter?"
                options: ["3500 m", "3005 m", "350 m"]
                answer: "3500 m"
                feedback:
                  "3005 m": "3,5 km ist 3,500 km. Nach dem Komma stehen 500 Meter, nicht 5."
                hints:
                  - "Nach dem Komma stehen bei Kilometern drei Stellen."
                  - "3,5 km = 3,500 km = 3 km 500 m."
                  - "3500 m."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Schreib mit Komma."
                say: "Vier Kilometer und zweihundertfünfzig Meter. Schreib die Länge mit Komma."
                frame: "4 km 250 m = _ km"
                options: ["4,25", "4,025", "42,5"]
                answer: ["4,25"]
                hints:
                  - "Vor das Komma kommen die Kilometer."
                  - "250 m sind 0,250 km. Die Null am Ende kannst du weglassen."
                  - "4,25 km."
              - id: l2-f3
                type: multiple_choice
                text: "1,05 km = _"
                say: "Eins Komma null fünf Kilometer sind wie viele Meter?"
                options: ["1050 m", "1500 m", "1005 m"]
                answer: "1050 m"
                hints:
                  - "Schreib drei Stellen nach dem Komma."
                  - "1,05 km = 1,050 km."
                  - "1050 m."
              - id: l2-f4
                type: matching
                text: "Was ist gleich lang?"
                say: "Verbinde die Längen, die gleich lang sind."
                pairs:
                  - { left: { text: "2,5 km" }, right: { text: "2500 m" } }
                  - { left: { text: "2,05 km" }, right: { text: "2050 m" } }
                  - { left: { text: "2,005 km" }, right: { text: "2005 m" } }
                hints:
                  - "Schreib jede Länge mit drei Stellen nach dem Komma."
                  - "2,5 km = 2,500 km. 2,05 km = 2,050 km."
                  - "2,5 km und 2500 m, 2,05 km und 2050 m, 2,005 km und 2005 m."
              - id: l2-f5
                type: multiple_choice
                text: "Der Weg zum See ist 1800 m lang. Wie schreibst du das mit Komma?"
                say: "Der Weg zum See ist tausendachthundert Meter lang. Wie schreibst du das in Kilometern mit Komma?"
                options: ["1,8 km", "18 km", "1,08 km"]
                answer: "1,8 km"
                hints:
                  - "1000 m sind 1 km."
                  - "1800 m = 1 km 800 m."
                  - "1,8 km."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "6,2 km = _"
                say: "Sechs Komma zwei Kilometer sind wie viele Meter?"
                options: ["6200 m", "6020 m", "620 m"]
                answer: "6200 m"
                hints: ["6,2 km = 6,200 km."]
              - id: l2-s2
                type: fill_in_blank
                text: "Wie viele Kilometer und Meter sind das?"
                say: "Zweitausendsiebenhundertfünfzig Meter. Wie viele Kilometer und Meter sind das?"
                frame: "2750 m = _ km _ m"
                options: ["2", "750", "27", "50"]
                answer: ["2", "750"]
                hints: ["2000 m sind 2 km."]
              - id: l2-s3
                type: multiple_choice
                text: "Was ist länger: 1,3 km oder 1250 m?"
                say: "Was ist länger: eins Komma drei Kilometer oder tausendzweihundertfünfzig Meter?"
                options: ["1,3 km", "1250 m", "Beide sind gleich lang."]
                answer: "1,3 km"
                hints: ["Rechne 1,3 km in Meter um."]
              - id: l2-s4
                type: true_false
                text: "0,5 km = 500 m. Stimmt das?"
                say: "Null Komma fünf Kilometer sind fünfhundert Meter. Stimmt das?"
                answer: true
                hints: ["0,5 km = 0,500 km."]
              - id: l2-s5
                type: multiple_choice
                text: "Ein Marathon ist 42 km 195 m lang. Wie schreibst du das mit Komma?"
                say: "Ein Marathon ist zweiundvierzig Kilometer und hundertfünfundneunzig Meter lang. Wie schreibst du das mit Komma?"
                options: ["42,195 km", "42,95 km", "421,95 km"]
                answer: "42,195 km"
                hints: ["Die Meter stehen in drei Stellen nach dem Komma."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "7,25 km = _"
                say: "Sieben Komma zwei fünf Kilometer sind wie viele Meter?"
                options: ["7250 m", "7025 m", "725 m"]
                answer: "7250 m"
              - id: l2-n2
                type: fill_in_blank
                text: "Schreib mit Komma."
                say: "Dreitausendvierzig Meter. Schreib die Länge in Kilometern mit Komma."
                frame: "3040 m = _ km"
                options: ["3,04", "3,4", "30,4"]
                answer: ["3,04"]
              - id: l2-n3
                type: multiple_choice
                text: "Was ist gleich lang wie 5,08 km?"
                say: "Welche Länge ist gleich lang wie fünf Komma null acht Kilometer?"
                options: ["5080 m", "5800 m", "5008 m"]
                answer: "5080 m"
              - id: l2-n4
                type: true_false
                text: "1,2 km = 1 km 2 m. Stimmt das?"
                say: "Eins Komma zwei Kilometer sind ein Kilometer und zwei Meter. Stimmt das?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Welche Strecke ist am kürzesten?"
                say: "Welche Strecke ist am kürzesten?"
                options: ["0,9 km", "1,1 km", "950 m"]
                answer: "0,9 km"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "4,8 km = _"
            say: "Vier Komma acht Kilometer sind wie viele Meter?"
            options: ["4800 m", "4008 m", "480 m"]
            answer: "4800 m"
          - id: l2-c2
            type: multiple_choice
            text: "1,75 m = _"
            say: "Eins Komma sieben fünf Meter sind wie viele Zentimeter?"
            options: ["175 cm", "1075 cm", "17,5 cm"]
            answer: "175 cm"
          - id: l2-c3
            type: fill_in_blank
            text: "Schreib mit Komma."
            say: "Fünf Kilometer und sechzig Meter. Schreib die Länge mit Komma."
            frame: "5 km 60 m = _ km"
            options: ["5,06", "5,6", "5,006"]
            answer: ["5,06"]
          - id: l2-c4
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Lies am Lineal ab. Wie lang ist der Streifen?"
            show: { drawn: ruler, to: 10, length: 8.3 }
            options: ["8,3 cm", "83 cm", "8,03 cm"]
            answer: "8,3 cm"
          - id: l2-c5
            type: true_false
            text: "2,3 km = 2 km 300 m. Stimmt das?"
            say: "Zwei Komma drei Kilometer sind zwei Kilometer und dreihundert Meter. Stimmt das?"
            answer: true
