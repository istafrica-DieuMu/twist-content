# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.volume-cubes
skill: math.area-volume.volume-cubes
curriculum: de-DE
language: de
title:
  de: Rauminhalt mit Würfeln
  en: Volume with cubes
summary: >
  Lesson 1 measures the Rauminhalt of a Quader in Einheitswürfeln, layer
  by layer (eine Schicht 3 · 4 = 12 Würfel, zwei Schichten 24), with one
  layer shown from above as a Punktefeld and the hidden cubes inside
  counted too; lesson 2 counts Würfelgebäude from a Bauplan written as
  numbers, compares Rauminhalte (Turm und Reihe aus 6 Würfeln sind gleich
  groß), finds the cubes missing to complete a Quader, and ends with the
  skill check. Counting cubes from an oblique drawing of a building waits
  for a cube-building drawn component.
metadata:
  year: klasse-4
  topic: { de: Rauminhalt, en: Volume }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.solids.cube-buildings, math.mult-div.arrays]
  also_practises: [math.mult-div.arrays]
  vocabulary: { de: [Rauminhalt, Einheitswürfel, Quader, Schicht, Würfelgebäude, Bauplan, vergleichen] }
  forms: [text, audio, drawn]
  drawn: [dots, shape]
  facets: []
  misconceptions:
    - id: counts-one-layer
      what: Counts only one layer or only the cubes that can be seen, and forgets the layers and the hidden cubes
      addressed: lesson 1 Learn stacks a second layer and says the hidden cubes count; l1-f2, l1-f3, l1-s2, l1-c2 and l2-c1 offer the count of one layer, with feedback in l1-f2; l1-f5 asks about the hidden cubes
    - id: adds-dimensions
      what: Adds length, width and height (4 + 2 + 3 = 9) instead of multiplying, or counts the fields of a Bauplan instead of adding its numbers
      addressed: l1-f4, l1-n3, l1-n4 and l2-f1 offer or state the sum of the edges or the number of fields, with feedback in l1-f4 and l2-f1; lesson 2 Learn adds the numbers of a Bauplan
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Schicht für Schicht", en: "Layer by layer" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Malaufgabe passt?"
            say: "Welche Malaufgabe passt zu dem Punktefeld?"
            show: { drawn: dots, array: [3, 4] }
            options: ["3 · 4", "3 + 4", "4 · 4"]
            answer: "3 · 4"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Auf dem Bauplan stehen 2, 1 und 3. Wie viele Würfel brauchst du?"
            say: "Auf einem Bauplan stehen die Zahlen zwei, eins und drei. Jede Zahl sagt, wie viele Würfel auf diesem Feld übereinander stehen. Wie viele Würfel brauchst du?"
            options: ["6", "3", "5"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Rauminhalt: Wie viele Würfel sind es?"
            say: "Der Rauminhalt sagt, wie viel Platz ein Körper einnimmt. Wir messen ihn mit lauter gleich großen kleinen Würfeln, den Einheitswürfeln. Dann zählen wir, wie viele es sind."
            show: { drawn: shape, kind: cube, colour: orange }
          - text: "Eine Schicht: 3 · 4 = 12 Würfel"
            say: "Lege eine Schicht Würfel: drei Reihen mit je vier Würfeln. Jeder Punkt ist hier ein Würfel, von oben gesehen. Drei mal vier sind zwölf Würfel."
            show: { drawn: dots, array: [3, 4] }
          - text: "Zwei Schichten: 2 · 12 = 24 Würfel"
            say: "Legst du eine zweite Schicht darauf, ist der Quader zwei Würfel hoch. Zwei mal zwölf sind vierundzwanzig Würfel. Die Würfel innen siehst du nicht, aber sie zählen mit."
            show: { drawn: shape, kind: cuboid, colour: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Das ist eine Schicht Würfel von oben. Wie viele Würfel sind es?"
                say: "Das ist eine Schicht Würfel, von oben gesehen. Wie viele Würfel sind es?"
                show: { drawn: dots, array: [2, 3] }
                options: ["6", "5", "9"]
                answer: "6"
                hints:
                  - "Zähl die Reihen und die Würfel in jeder Reihe."
                  - "2 Reihen mit je 3 Würfeln: 2 · 3."
                  - "6."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ein Quader hat 2 Schichten. In jeder Schicht liegen 6 Würfel. Wie viele Würfel sind es?"
                say: "Ein Quader hat zwei Schichten. In jeder Schicht liegen sechs Würfel. Wie viele Würfel sind es zusammen?"
                options: ["12", "8", "6"]
                answer: "12"
                feedback:
                  "6": "6 Würfel sind nur eine Schicht. Der Quader hat zwei Schichten."
                  "8": "Du hast 6 + 2 gerechnet. Es sind 2 Schichten mit je 6 Würfeln: 2 · 6."
                hints:
                  - "Jede Schicht hat gleich viele Würfel."
                  - "2 Schichten mit je 6 Würfeln: 2 · 6."
                  - "12."
              - id: l1-f3
                type: multiple_choice
                text: "Der Quader hat 3 Schichten wie diese. Wie viele Würfel sind es?"
                say: "Das ist eine Schicht von oben. Der Quader hat drei solche Schichten übereinander. Wie viele Würfel sind es?"
                show: { drawn: dots, array: [3, 3] }
                options: ["27", "9", "12"]
                answer: "27"
                hints:
                  - "Wie viele Würfel hat eine Schicht?"
                  - "Eine Schicht hat 3 · 3 = 9 Würfel. Es sind 3 Schichten."
                  - "27."
              - id: l1-f4
                type: multiple_choice
                text: "Ein Quader ist 4 Würfel lang, 2 Würfel breit und 3 Würfel hoch. Wie viele Würfel sind es?"
                say: "Ein Quader ist vier Würfel lang, zwei Würfel breit und drei Würfel hoch. Wie viele Würfel sind es?"
                options: ["24", "9", "8"]
                answer: "24"
                feedback:
                  "9": "Du hast 4 + 2 + 3 addiert. Rechne erst eine Schicht aus: 4 · 2 = 8. Dann mal 3 Schichten."
                  "8": "8 Würfel sind eine Schicht. Der Quader ist 3 Würfel hoch, er hat also 3 Schichten."
                hints:
                  - "Rechne zuerst eine Schicht aus: lang mal breit."
                  - "Eine Schicht hat 4 · 2 = 8 Würfel. Dann 3 Schichten: 3 · 8."
                  - "24."
              - id: l1-f5
                type: true_false
                text: "Bei einem Quader zählen auch die Würfel innen mit, die du nicht sehen kannst."
                say: "Stimmt das? Bei einem Quader zählen auch die Würfel innen mit, die du nicht sehen kannst."
                answer: true
                hints:
                  - "Was ist innen in einem Quader aus Würfeln?"
                  - "Innen sind auch Würfel, sonst wäre der Quader hohl."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Das ist eine Schicht Würfel von oben. Wie viele Würfel sind es?"
                say: "Das ist eine Schicht Würfel, von oben gesehen. Wie viele Würfel sind es?"
                show: { drawn: dots, array: [2, 5] }
                options: ["10", "7", "12"]
                answer: "10"
                hints: ["Reihen mal Würfel in einer Reihe."]
              - id: l1-s2
                type: multiple_choice
                text: "Ein Quader hat 4 Schichten mit je 5 Würfeln. Wie viele Würfel sind es?"
                say: "Ein Quader hat vier Schichten mit je fünf Würfeln. Wie viele Würfel sind es?"
                options: ["20", "9", "5"]
                answer: "20"
                hints: ["4 Schichten mit je 5: 4 · 5."]
              - id: l1-s3
                type: text_input
                text: "Ein Quader ist 3 Würfel lang, 3 breit und 2 hoch. Wie viele Würfel sind es?"
                say: "Ein Quader ist drei Würfel lang, drei Würfel breit und zwei Würfel hoch. Wie viele Würfel sind es?"
                answer: "18"
                hints: ["Eine Schicht hat 3 · 3 Würfel. Wie viele Schichten gibt es?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Quader hat den größeren Rauminhalt?"
                say: "Welcher Quader hat den größeren Rauminhalt?"
                options: ["2 Schichten zu je 8 Würfeln", "3 Schichten zu je 5 Würfeln", "beide gleich viel"]
                answer: "2 Schichten zu je 8 Würfeln"
                hints: ["Rechne beide aus: 2 · 8 und 3 · 5."]
              - id: l1-s5
                type: true_false
                text: "Ein großer Würfel aus 2 Schichten wie dieser hat 8 kleine Würfel."
                say: "Das ist eine Schicht von oben. Stimmt das? Ein großer Würfel aus zwei solchen Schichten hat acht kleine Würfel."
                show: { drawn: dots, array: [2, 2] }
                answer: true
                hints: ["Eine Schicht hat 2 · 2 Würfel."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Das ist eine Schicht Würfel von oben. Wie viele Würfel sind es?"
                say: "Das ist eine Schicht Würfel, von oben gesehen. Wie viele Würfel sind es?"
                show: { drawn: dots, array: [4, 4] }
                options: ["16", "8", "12"]
                answer: "16"
              - id: l1-n2
                type: text_input
                text: "Ein Quader hat 5 Schichten mit je 6 Würfeln. Wie viele Würfel sind es?"
                say: "Ein Quader hat fünf Schichten mit je sechs Würfeln. Wie viele Würfel sind es?"
                answer: "30"
              - id: l1-n3
                type: multiple_choice
                text: "Ein Quader ist 5 Würfel lang, 2 breit und 2 hoch. Wie viele Würfel sind es?"
                say: "Ein Quader ist fünf Würfel lang, zwei Würfel breit und zwei Würfel hoch. Wie viele Würfel sind es?"
                options: ["20", "9", "10"]
                answer: "20"
              - id: l1-n4
                type: true_false
                text: "Ein Quader, 3 Würfel lang, 2 breit und 2 hoch, besteht aus 7 Würfeln."
                say: "Stimmt das? Ein Quader, der drei Würfel lang, zwei breit und zwei hoch ist, besteht aus sieben Würfeln."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Ein großer Würfel ist 3 kleine Würfel lang, 3 breit und 3 hoch. Wie viele kleine Würfel sind es?"
                say: "Ein großer Würfel ist drei kleine Würfel lang, drei breit und drei hoch. Wie viele kleine Würfel sind es?"
                options: ["27", "9", "18"]
                answer: "27"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Das ist eine Schicht Würfel von oben. Wie viele Würfel sind es?"
            say: "Das ist eine Schicht Würfel, von oben gesehen. Wie viele Würfel sind es?"
            show: { drawn: dots, array: [3, 5] }
            options: ["15", "8", "16"]
            answer: "15"
          - id: l1-c2
            type: multiple_choice
            text: "Ein Quader hat 3 Schichten mit je 4 Würfeln. Wie viele Würfel sind es?"
            say: "Ein Quader hat drei Schichten mit je vier Würfeln. Wie viele Würfel sind es?"
            options: ["12", "7", "4"]
            answer: "12"
          - id: l1-c3
            type: text_input
            text: "Ein Quader ist 5 Würfel lang, 3 breit und 2 hoch. Wie viele Würfel sind es?"
            say: "Ein Quader ist fünf Würfel lang, drei Würfel breit und zwei Würfel hoch. Wie viele Würfel sind es?"
            answer: "30"

  - n: 2
    title: { de: "Würfelgebäude vergleichen", en: "Comparing cube buildings" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ein Quader hat 2 Schichten mit je 9 Würfeln. Wie viele Würfel sind es?"
            say: "Ein Quader hat zwei Schichten mit je neun Würfeln. Wie viele Würfel sind es?"
            options: ["18", "11"]
            answer: "18"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Würfel in einer Schicht mal Zahl der Schichten: So findest du die Würfel im Quader."
            say: "Stimmt das? Du rechnest die Würfel in einer Schicht mal die Zahl der Schichten. So findest du, wie viele Würfel der Quader hat."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Bauplan 3, 2, 1, 2: 3 + 2 + 1 + 2 = 8 Würfel"
            say: "Ein Würfelgebäude muss kein Quader sein. Der Bauplan zeigt es von oben. Auf jedem Feld steht, wie viele Würfel dort übereinander stehen. Bei den Zahlen drei, zwei, eins und zwei sind es drei plus zwei plus eins plus zwei, also acht Würfel."
          - text: "Gleich viele Würfel: gleicher Rauminhalt"
            say: "Zwei Gebäude können ganz verschieden aussehen und trotzdem gleich viele Würfel haben. Dann ist ihr Rauminhalt gleich. Ein hoher Turm aus sechs Würfeln ist so groß wie eine flache Reihe aus sechs Würfeln."
          - text: "Es fehlen 12 − 7 = 5 Würfel."
            say: "Ein Gebäude hat sieben Würfel. Du willst daraus einen Quader aus zwölf Würfeln bauen. Dir fehlen zwölf minus sieben, also fünf Würfel."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Bauplan: 2, 3, 1, 1. Wie viele Würfel hat das Gebäude?"
                say: "Auf dem Bauplan stehen die Zahlen zwei, drei, eins und eins. Wie viele Würfel hat das Gebäude?"
                options: ["7", "4", "3"]
                answer: "7"
                feedback:
                  "4": "4 ist die Zahl der Felder. Auf jedem Feld stehen so viele Würfel, wie die Zahl sagt."
                  "3": "3 ist der höchste Turm. Zähl alle Felder zusammen."
                hints:
                  - "Jede Zahl sagt, wie viele Würfel auf dem Feld stehen."
                  - "Addiere alle Zahlen: 2 + 3 + 1 + 1."
                  - "7."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Ein Turm aus 6 Würfeln hat denselben Rauminhalt wie eine Reihe aus 6 Würfeln."
                say: "Stimmt das? Ein Turm aus sechs Würfeln hat denselben Rauminhalt wie eine flache Reihe aus sechs Würfeln."
                answer: true
                hints:
                  - "Zähl die Würfel, nicht die Höhe."
                  - "Beide haben 6 Würfel."
                  - "Ja, das stimmt."
              - id: l2-f3
                type: multiple_choice
                text: "Welches Gebäude hat den größten Rauminhalt?"
                say: "Welches Gebäude hat den größten Rauminhalt?"
                options: ["Bauplan 3, 3, 2", "Bauplan 4, 1, 1, 1", "Bauplan 2, 2, 2"]
                answer: "Bauplan 3, 3, 2"
                hints:
                  - "Rechne für jedes Gebäude die Würfel aus."
                  - "3 + 3 + 2 = 8, 4 + 1 + 1 + 1 = 7, 2 + 2 + 2 = 6."
                  - "Bauplan 3, 3, 2."
              - id: l2-f4
                type: multiple_choice
                text: "Ein Gebäude hat 9 Würfel. Du willst einen Quader aus 12 Würfeln bauen. Wie viele Würfel fehlen?"
                say: "Ein Gebäude hat neun Würfel. Du willst daraus einen Quader aus zwölf Würfeln bauen. Wie viele Würfel fehlen?"
                options: ["3", "21", "9"]
                answer: "3"
                hints:
                  - "Wie viele Würfel brauchst du, wie viele hast du?"
                  - "12 − 9 = ?"
                  - "3."
              - id: l2-f5
                type: multiple_choice
                text: "Quader A hat 3 Schichten zu je 4 Würfeln, Quader B 2 Schichten zu je 6 Würfeln. Was stimmt?"
                say: "Quader A hat drei Schichten mit je vier Würfeln. Quader B hat zwei Schichten mit je sechs Würfeln. Was stimmt?"
                options: ["Beide haben gleich viele Würfel.", "A hat mehr Würfel.", "B hat mehr Würfel."]
                answer: "Beide haben gleich viele Würfel."
                hints:
                  - "Rechne beide aus."
                  - "3 · 4 = 12 und 2 · 6 = 12."
                  - "Beide haben gleich viele Würfel."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "Bauplan: 1, 2, 2, 3. Wie viele Würfel hat das Gebäude?"
                say: "Auf dem Bauplan stehen die Zahlen eins, zwei, zwei und drei. Wie viele Würfel hat das Gebäude?"
                answer: "8"
                hints: ["Addiere alle Zahlen."]
              - id: l2-s2
                type: multiple_choice
                text: "Lina baut nach dem Bauplan 3, 1, 2. Tim baut nach dem Bauplan 2, 2, 2. Wer braucht mehr Würfel?"
                say: "Lina baut nach dem Bauplan drei, eins, zwei. Tim baut nach dem Bauplan zwei, zwei, zwei. Wer braucht mehr Würfel?"
                options: ["beide gleich viele", "Lina", "Tim"]
                answer: "beide gleich viele"
                hints: ["3 + 1 + 2 und 2 + 2 + 2."]
              - id: l2-s3
                type: multiple_choice
                text: "Ein Quader hat 2 Schichten zu je 6 Würfeln. Du nimmst 5 Würfel weg. Wie viele bleiben?"
                say: "Ein Quader hat zwei Schichten mit je sechs Würfeln. Du nimmst fünf Würfel weg. Wie viele Würfel bleiben?"
                options: ["7", "17", "1"]
                answer: "7"
                hints: ["Rechne zuerst die Würfel im Quader aus."]
              - id: l2-s4
                type: true_false
                text: "Ein Gebäude, das höher ist, hat immer mehr Würfel."
                say: "Stimmt das? Ein Gebäude, das höher ist, hat immer mehr Würfel."
                answer: false
                hints: ["Denk an den Turm und die Reihe aus 6 Würfeln."]
              - id: l2-s5
                type: multiple_choice
                text: "Ein Gebäude hat 10 Würfel. Du willst einen Quader aus 3 Schichten zu je 6 Würfeln bauen. Wie viele Würfel fehlen?"
                say: "Ein Gebäude hat zehn Würfel. Du willst einen Quader aus drei Schichten mit je sechs Würfeln bauen. Wie viele Würfel fehlen?"
                options: ["8", "18", "9"]
                answer: "8"
                hints: ["Der Quader braucht 3 · 6 Würfel."]
                difficulty: stretch

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Bauplan: 3, 3, 1, 2, 1. Wie viele Würfel hat das Gebäude?"
                say: "Auf dem Bauplan stehen die Zahlen drei, drei, eins, zwei und eins. Wie viele Würfel hat das Gebäude?"
                answer: "10"
              - id: l2-n2
                type: multiple_choice
                text: "Welches Gebäude hat den kleinsten Rauminhalt?"
                say: "Welches Gebäude hat den kleinsten Rauminhalt?"
                options: ["Bauplan 2, 2, 1", "Bauplan 3, 3", "Bauplan 1, 1, 1, 1, 1, 1"]
                answer: "Bauplan 2, 2, 1"
              - id: l2-n3
                type: multiple_choice
                text: "Ein Gebäude hat 14 Würfel. Ein Quader soll 4 Schichten zu je 4 Würfeln haben. Wie viele Würfel fehlen?"
                say: "Ein Gebäude hat vierzehn Würfel. Daraus soll ein Quader mit vier Schichten zu je vier Würfeln werden. Wie viele Würfel fehlen?"
                options: ["2", "4", "30"]
                answer: "2"
              - id: l2-n4
                type: true_false
                text: "Die Gebäude nach Bauplan 5, 1 und nach Bauplan 3, 3 haben gleich viele Würfel."
                say: "Stimmt das? Die Gebäude nach dem Bauplan fünf, eins und nach dem Bauplan drei, drei haben gleich viele Würfel."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Ein Quader soll 4 Würfel lang, 4 breit und 2 hoch werden. Lukas hat die unterste Schicht gebaut. Wie viele Würfel fehlen noch?"
                say: "Ein Quader soll vier Würfel lang, vier breit und zwei hoch werden. Lukas hat die unterste Schicht schon gebaut. Wie viele Würfel fehlen noch?"
                options: ["16", "32", "8"]
                answer: "16"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Der Quader hat 3 Schichten wie diese. Wie viele Würfel sind es?"
            say: "Das ist eine Schicht von oben. Der Quader hat drei solche Schichten übereinander. Wie viele Würfel sind es?"
            show: { drawn: dots, array: [2, 4] }
            options: ["24", "8", "11"]
            answer: "24"
          - id: l2-c2
            type: text_input
            text: "Ein Quader ist 6 Würfel lang, 2 breit und 3 hoch. Wie viele Würfel sind es?"
            say: "Ein Quader ist sechs Würfel lang, zwei Würfel breit und drei Würfel hoch. Wie viele Würfel sind es?"
            answer: "36"
          - id: l2-c3
            type: multiple_choice
            text: "Bauplan: 2, 4, 1, 3. Wie viele Würfel hat das Gebäude?"
            say: "Auf dem Bauplan stehen die Zahlen zwei, vier, eins und drei. Wie viele Würfel hat das Gebäude?"
            options: ["10", "4", "24"]
            answer: "10"
          - id: l2-c4
            type: multiple_choice
            text: "Welcher Quader besteht aus mehr Würfeln?"
            say: "Welcher Quader besteht aus mehr Würfeln?"
            options: ["4 Schichten zu je 3 Würfeln", "2 Schichten zu je 5 Würfeln", "beide gleich viele"]
            answer: "4 Schichten zu je 3 Würfeln"
          - id: l2-c5
            type: multiple_choice
            text: "Ein Gebäude hat 11 Würfel. Daraus soll ein Quader mit 2 Schichten zu je 8 Würfeln werden. Wie viele Würfel fehlen?"
            say: "Ein Gebäude hat elf Würfel. Daraus soll ein Quader mit zwei Schichten zu je acht Würfeln werden. Wie viele Würfel fehlen?"
            options: ["5", "16", "27"]
            answer: "5"
