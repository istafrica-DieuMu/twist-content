# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.timetables
skill: math.time.timetables
curriculum: de-DE
language: de
title:
  de: Fahrpläne und Zeitpläne
  en: Timetables and schedules
summary: >
  Lesson 1 reads a bus or train timetable (Zeile Haltestelle, Spalte
  Fahrt), works out how long a ride takes and picks the ride that arrives
  in time; lesson 2 reads schedules for a Sportfest, a Kinderkino and a
  Ausflug, works out how long each part lasts, also over the full hour
  (14:30 bis 16:10 sind 1 Stunde 40 Minuten), and ends with the skill
  check.
metadata:
  year: klasse-3
  topic: { de: Zeitpunkt und Zeitdauer, en: Time and duration }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.time.units, math.data.read-tables]
  also_practises: [math.time.durations]
  vocabulary: { de: [Fahrplan, Zeitplan, Haltestelle, Abfahrt, Ankunft, Fahrzeit, rechtzeitig] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: wrong-row-or-column
      what: Reads the time from the wrong row or column of the timetable (the departure at the first stop instead of the stop asked for)
      addressed: lesson 1 Learn follows one Fahrt down its column; l1-f1 has feedback on the time from the first row; l1-f5, l1-s1, l1-c1 and l2-c1 ask for a stop further down a column
    - id: hundred-minute-hour
      what: Subtracts clock times like numbers (16:10 − 14:30 as 1 Stunde 80 Minuten), or picks a ride that arrives too late
      addressed: lesson 2 Learn goes through the full hour; l2-f4 has feedback on 1 Stunde 80 Minuten, l2-s3, l2-n3 and l2-c4 offer the number subtraction; l1-f3 has feedback on the ride that comes too late
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Fahrpläne lesen", en: "Reading timetables" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Minuten hat eine Stunde?"
            say: "Wie viele Minuten hat eine Stunde?"
            options: ["60", "100", "30"]
            answer: "60"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Von 7:10 bis 7:25. Wie viele Minuten sind das?"
            say: "Von sieben Uhr zehn bis sieben Uhr fünfundzwanzig. Wie viele Minuten sind das?"
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Bus 7 | Fahrt 1 | Fahrt 2 | Fahrt 3\nBahnhof | 7:10 | 7:40 | 8:10\nMarktplatz | 7:18 | 7:48 | 8:18\nSchule | 7:25 | 7:55 | 8:25"
            say: "Das ist ein Fahrplan für die Buslinie sieben. Links stehen die Haltestellen. In jeder Spalte steht eine Fahrt. Die erste Fahrt fährt um sieben Uhr zehn am Bahnhof ab und ist um sieben Uhr fünfundzwanzig an der Schule."
          - text: "Bahnhof 7:10, Schule 7:25\n7:10 bis 7:25 = 15 Minuten"
            say: "Wie lange fährt der Bus vom Bahnhof bis zur Schule? Von sieben Uhr zehn bis sieben Uhr fünfundzwanzig sind es fünfzehn Minuten. Bei jeder Fahrt ist das gleich lang."
          - text: "Der Unterricht beginnt um 8:00 Uhr.\nFahrt 2 ist um 7:55 Uhr an der Schule.\nFahrt 3 ist um 8:25 Uhr an der Schule."
            say: "Der Unterricht beginnt um acht Uhr. Welchen Bus nimmst du? Fahrt drei kommt erst um acht Uhr fünfundzwanzig an. Das ist zu spät. Fahrt zwei kommt um sieben Uhr fünfundfünfzig an. Die nimmst du."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wann fährt Fahrt 2 am Marktplatz ab?\nBus 7 | Fahrt 1 | Fahrt 2 | Fahrt 3\nBahnhof | 7:10 | 7:40 | 8:10\nMarktplatz | 7:18 | 7:48 | 8:18\nSchule | 7:25 | 7:55 | 8:25"
                say: "Schau in den Fahrplan. Wann fährt Fahrt zwei am Marktplatz ab?"
                options: ["7:48", "7:40", "7:18"]
                answer: "7:48"
                feedback:
                  "7:40": "Um 7:40 fährt Fahrt 2 am Bahnhof ab. Schau in die Zeile Marktplatz."
                  "7:18": "7:18 steht bei Fahrt 1. Geh in die Spalte Fahrt 2."
                hints:
                  - "Such die Zeile Marktplatz."
                  - "Geh in der Zeile Marktplatz bis zur Spalte Fahrt 2."
                  - "7:48."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Wie viele Minuten fährt der Zug vom Dorf bis zur Stadt?\nZug | Fahrt 1 | Fahrt 2 | Fahrt 3\nDorf | 9:05 | 10:05 | 11:05\nSee | 9:20 | 10:20 | 11:20\nStadt | 9:45 | 10:45 | 11:45"
                say: "Schau in den Fahrplan. Wie viele Minuten fährt der Zug vom Dorf bis zur Stadt?"
                answer: "40"
                hints:
                  - "Nimm eine Fahrt: Abfahrt im Dorf, Ankunft in der Stadt."
                  - "Bei Fahrt 1 ist das von 9:05 bis 9:45."
                  - "40."
              - id: l1-f3
                type: multiple_choice
                text: "Lea muss um 14:15 Uhr am Park sein. Welche Fahrt kommt gerade noch rechtzeitig?\nBus 3 | Fahrt 1 | Fahrt 2 | Fahrt 3\nSchwimmbad | 13:30 | 14:00 | 14:30\nPark | 13:42 | 14:12 | 14:42\nRathaus | 13:50 | 14:20 | 14:50"
                say: "Lea muss um vierzehn Uhr fünfzehn am Park sein. Welche Fahrt kommt gerade noch rechtzeitig?"
                options: ["Fahrt 2", "Fahrt 1", "Fahrt 3"]
                answer: "Fahrt 2"
                feedback:
                  "Fahrt 3": "Fahrt 3 ist erst um 14:42 Uhr am Park. Das ist zu spät."
                  "Fahrt 1": "Mit Fahrt 1 ist Lea viel zu früh da. Eine spätere Fahrt reicht auch."
                hints:
                  - "Schau in die Zeile Park."
                  - "Welche Zeit ist kurz vor 14:15?"
                  - "Fahrt 2, sie ist um 14:12 Uhr am Park."
              - id: l1-f4
                type: true_false
                text: "Die Straßenbahn fährt alle 20 Minuten am Zoo ab.\nStraßenbahn | Fahrt 1 | Fahrt 2 | Fahrt 3\nZoo | 15:15 | 15:35 | 15:55\nMuseum | 15:24 | 15:44 | 16:04\nHafen | 15:33 | 15:53 | 16:13"
                say: "Stimmt das? Die Straßenbahn fährt alle zwanzig Minuten am Zoo ab."
                answer: true
                hints:
                  - "Schau die Zeile Zoo an."
                  - "15:15, 15:35, 15:55: Wie viele Minuten liegen dazwischen?"
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Ben steigt am Marktplatz in Fahrt 1 ein. Wann ist er an der Schule?\nBus 7 | Fahrt 1 | Fahrt 2 | Fahrt 3\nBahnhof | 7:10 | 7:40 | 8:10\nMarktplatz | 7:18 | 7:48 | 8:18\nSchule | 7:25 | 7:55 | 8:25"
                say: "Ben steigt am Marktplatz in Fahrt eins ein. Wann ist er an der Schule?"
                options: ["7:25", "7:18", "7:55"]
                answer: "7:25"
                hints:
                  - "Fahrt 1 ist die erste Spalte."
                  - "Geh in der Spalte Fahrt 1 nach unten bis zur Schule."
                  - "7:25."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wann kommt Fahrt 3 am See an?\nZug | Fahrt 1 | Fahrt 2 | Fahrt 3\nDorf | 9:05 | 10:05 | 11:05\nSee | 9:20 | 10:20 | 11:20\nStadt | 9:45 | 10:45 | 11:45"
                say: "Wann kommt Fahrt drei am See an?"
                options: ["11:20", "11:05", "10:20"]
                answer: "11:20"
                hints: ["Zeile See, Spalte Fahrt 3."]
              - id: l1-s2
                type: text_input
                text: "Wie viele Minuten fährt der Bus vom Park bis zum Rathaus?\nBus 3 | Fahrt 1 | Fahrt 2 | Fahrt 3\nSchwimmbad | 13:30 | 14:00 | 14:30\nPark | 13:42 | 14:12 | 14:42\nRathaus | 13:50 | 14:20 | 14:50"
                say: "Wie viele Minuten fährt der Bus vom Park bis zum Rathaus?"
                answer: "8"
                hints: ["Bei Fahrt 1: von 13:42 bis 13:50."]
              - id: l1-s3
                type: multiple_choice
                text: "Tom ist um 15:40 Uhr am Zoo. Wann fährt die nächste Straßenbahn?\nStraßenbahn | Fahrt 1 | Fahrt 2 | Fahrt 3\nZoo | 15:15 | 15:35 | 15:55\nMuseum | 15:24 | 15:44 | 16:04\nHafen | 15:33 | 15:53 | 16:13"
                say: "Tom ist um fünfzehn Uhr vierzig am Zoo. Wann fährt die nächste Straßenbahn?"
                options: ["15:55", "15:35", "15:44"]
                answer: "15:55"
                hints: ["Die Bahn um 15:35 Uhr ist schon weg."]
              - id: l1-s4
                type: true_false
                text: "Vom See bis zur Stadt fährt der Zug 25 Minuten.\nZug | Fahrt 1 | Fahrt 2 | Fahrt 3\nDorf | 9:05 | 10:05 | 11:05\nSee | 9:20 | 10:20 | 11:20\nStadt | 9:45 | 10:45 | 11:45"
                say: "Stimmt das? Vom See bis zur Stadt fährt der Zug fünfundzwanzig Minuten."
                answer: true
                hints: ["Rechne bei Fahrt 1 von 9:20 bis 9:45."]
              - id: l1-s5
                type: multiple_choice
                text: "Mila muss um 8:30 Uhr an der Schule sein. Welche Fahrt kommt gerade noch rechtzeitig?\nBus 7 | Fahrt 1 | Fahrt 2 | Fahrt 3\nBahnhof | 7:10 | 7:40 | 8:10\nMarktplatz | 7:18 | 7:48 | 8:18\nSchule | 7:25 | 7:55 | 8:25"
                say: "Mila muss um acht Uhr dreißig an der Schule sein. Welche Fahrt kommt gerade noch rechtzeitig?"
                options: ["Fahrt 3", "Fahrt 2", "Fahrt 1"]
                answer: "Fahrt 3"
                hints: ["Schau in die Zeile Schule: Welche Zeit ist kurz vor 8:30?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wann fährt Fahrt 1 am Schwimmbad ab?\nBus 3 | Fahrt 1 | Fahrt 2 | Fahrt 3\nSchwimmbad | 13:30 | 14:00 | 14:30\nPark | 13:42 | 14:12 | 14:42\nRathaus | 13:50 | 14:20 | 14:50"
                say: "Wann fährt Fahrt eins am Schwimmbad ab?"
                options: ["13:30", "13:50", "14:00"]
                answer: "13:30"
              - id: l1-n2
                type: text_input
                text: "Wie viele Minuten fährt die Straßenbahn vom Zoo bis zum Hafen?\nStraßenbahn | Fahrt 1 | Fahrt 2 | Fahrt 3\nZoo | 15:15 | 15:35 | 15:55\nMuseum | 15:24 | 15:44 | 16:04\nHafen | 15:33 | 15:53 | 16:13"
                say: "Wie viele Minuten fährt die Straßenbahn vom Zoo bis zum Hafen?"
                answer: "18"
              - id: l1-n3
                type: multiple_choice
                text: "Paul muss um 10:30 Uhr in der Stadt sein. Welche Fahrt kommt gerade noch rechtzeitig?\nZug | Fahrt 1 | Fahrt 2 | Fahrt 3\nDorf | 9:05 | 10:05 | 11:05\nSee | 9:20 | 10:20 | 11:20\nStadt | 9:45 | 10:45 | 11:45"
                say: "Paul muss um zehn Uhr dreißig in der Stadt sein. Welche Fahrt kommt gerade noch rechtzeitig?"
                options: ["Fahrt 1", "Fahrt 2", "Fahrt 3"]
                answer: "Fahrt 1"
              - id: l1-n4
                type: true_false
                text: "Fahrt 3 ist um 8:18 Uhr an der Schule.\nBus 7 | Fahrt 1 | Fahrt 2 | Fahrt 3\nBahnhof | 7:10 | 7:40 | 8:10\nMarktplatz | 7:18 | 7:48 | 8:18\nSchule | 7:25 | 7:55 | 8:25"
                say: "Stimmt das? Fahrt drei ist um acht Uhr achtzehn an der Schule."
                answer: false
              - id: l1-n5
                type: text_input
                text: "Jana ist um 13:55 Uhr am Schwimmbad. Wie viele Minuten wartet sie auf den nächsten Bus?\nBus 3 | Fahrt 1 | Fahrt 2 | Fahrt 3\nSchwimmbad | 13:30 | 14:00 | 14:30\nPark | 13:42 | 14:12 | 14:42\nRathaus | 13:50 | 14:20 | 14:50"
                say: "Jana ist um dreizehn Uhr fünfundfünfzig am Schwimmbad. Wie viele Minuten wartet sie auf den nächsten Bus?"
                answer: "5"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wann ist Fahrt 2 am Museum?\nStraßenbahn | Fahrt 1 | Fahrt 2 | Fahrt 3\nZoo | 15:15 | 15:35 | 15:55\nMuseum | 15:24 | 15:44 | 16:04\nHafen | 15:33 | 15:53 | 16:13"
            say: "Wann ist Fahrt zwei am Museum?"
            options: ["15:44", "15:35", "15:53"]
            answer: "15:44"
          - id: l1-c2
            type: text_input
            text: "Wie viele Minuten fährt der Zug vom Dorf bis zum See?\nZug | Fahrt 1 | Fahrt 2 | Fahrt 3\nDorf | 9:05 | 10:05 | 11:05\nSee | 9:20 | 10:20 | 11:20\nStadt | 9:45 | 10:45 | 11:45"
            say: "Wie viele Minuten fährt der Zug vom Dorf bis zum See?"
            answer: "15"
          - id: l1-c3
            type: multiple_choice
            text: "Ole muss um 14:45 Uhr am Rathaus sein. Welche Fahrt kommt gerade noch rechtzeitig?\nBus 3 | Fahrt 1 | Fahrt 2 | Fahrt 3\nSchwimmbad | 13:30 | 14:00 | 14:30\nPark | 13:42 | 14:12 | 14:42\nRathaus | 13:50 | 14:20 | 14:50"
            say: "Ole muss um vierzehn Uhr fünfundvierzig am Rathaus sein. Welche Fahrt kommt gerade noch rechtzeitig?"
            options: ["Fahrt 2", "Fahrt 3", "Fahrt 1"]
            answer: "Fahrt 2"

  - n: 2
    title: { de: "Zeitpläne", en: "Schedules" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wann fährt Fahrt 3 am Bahnhof ab?\nBus 7 | Fahrt 1 | Fahrt 2 | Fahrt 3\nBahnhof | 7:10 | 7:40 | 8:10\nMarktplatz | 7:18 | 7:48 | 8:18\nSchule | 7:25 | 7:55 | 8:25"
            say: "Wann fährt Fahrt drei am Bahnhof ab?"
            options: ["8:10", "7:40", "8:25"]
            answer: "8:10"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Wie viele Minuten fährt die Straßenbahn vom Zoo bis zum Museum?\nStraßenbahn | Fahrt 1 | Fahrt 2 | Fahrt 3\nZoo | 15:15 | 15:35 | 15:55\nMuseum | 15:24 | 15:44 | 16:04\nHafen | 15:33 | 15:53 | 16:13"
            say: "Wie viele Minuten fährt die Straßenbahn vom Zoo bis zum Museum?"
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Sportfest\n9:00 Begrüßung\n9:15 Sprint\n10:00 Weitsprung\n10:45 Pause\n11:00 Staffellauf"
            say: "Das ist der Zeitplan für das Sportfest. Neben jeder Uhrzeit steht, was dann beginnt. Jeder Programmpunkt dauert, bis der nächste beginnt."
          - text: "Weitsprung: 10:00 bis 10:45\nDer Weitsprung dauert 45 Minuten."
            say: "Wie lange dauert der Weitsprung? Er beginnt um zehn Uhr. Um zehn Uhr fünfundvierzig beginnt die Pause. Der Weitsprung dauert also fünfundvierzig Minuten."
          - text: "Film: 16:40 bis 18:10\n16:40 bis 17:00 = 20 Minuten\n17:00 bis 18:00 = 1 Stunde\n18:00 bis 18:10 = 10 Minuten\nzusammen 1 Stunde 30 Minuten"
            say: "Ein Film läuft von sechzehn Uhr vierzig bis achtzehn Uhr zehn. Rechne zuerst bis zur vollen Stunde: zwanzig Minuten. Dann bis achtzehn Uhr: eine Stunde. Dann noch zehn Minuten. Zusammen sind das eine Stunde und dreißig Minuten. Eine Stunde hat sechzig Minuten, nicht hundert."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wann beginnt der Staffellauf?\nSportfest\n9:00 Begrüßung\n9:15 Sprint\n10:00 Weitsprung\n10:45 Pause\n11:00 Staffellauf"
                say: "Schau in den Zeitplan. Wann beginnt der Staffellauf?"
                options: ["11:00", "10:45", "10:00"]
                answer: "11:00"
                hints:
                  - "Such den Staffellauf im Plan."
                  - "Die Uhrzeit steht links daneben."
                  - "11:00."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Wie viele Minuten dauert die Pause?\nSportfest\n9:00 Begrüßung\n9:15 Sprint\n10:00 Weitsprung\n10:45 Pause\n11:00 Staffellauf"
                say: "Wie viele Minuten dauert die Pause beim Sportfest?"
                answer: "15"
                hints:
                  - "Die Pause dauert, bis der nächste Punkt beginnt."
                  - "Von 10:45 bis 11:00."
                  - "15."
              - id: l2-f3
                type: multiple_choice
                text: "Wie lange dauert die große Pause?\nMontag\n8:00 Deutsch\n8:45 Mathe\n9:30 große Pause\n9:50 Sachunterricht\n10:35 Sport\n12:05 Schulschluss"
                say: "Das ist der Stundenplan für Montag. Wie lange dauert die große Pause?"
                options: ["20 Minuten", "30 Minuten", "50 Minuten"]
                answer: "20 Minuten"
                hints:
                  - "Die große Pause dauert bis zum Sachunterricht."
                  - "Von 9:30 bis 9:50."
                  - "20 Minuten."
              - id: l2-f4
                type: multiple_choice
                text: "Wie lange dauert Film 1?\nKinderkino\n14:30 Film 1\n16:10 Pause\n16:30 Film 2\n18:00 Ende"
                say: "Das ist der Zeitplan vom Kinderkino. Wie lange dauert Film eins?"
                options: ["1 Stunde 40 Minuten", "1 Stunde 80 Minuten", "2 Stunden 20 Minuten"]
                answer: "1 Stunde 40 Minuten"
                feedback:
                  "1 Stunde 80 Minuten": "Eine Stunde hat 60 Minuten, nicht 100. Rechne zuerst bis zur vollen Stunde: 14:30 bis 15:00."
                hints:
                  - "Rechne zuerst bis zur vollen Stunde."
                  - "14:30 bis 15:00 sind 30 Minuten, 15:00 bis 16:00 eine Stunde, 16:00 bis 16:10 noch 10 Minuten."
                  - "1 Stunde 40 Minuten."
              - id: l2-f5
                type: true_false
                text: "Die Busfahrt zum Zoo dauert 45 Minuten.\nAusflug in den Zoo\n8:30 Abfahrt mit dem Bus\n9:15 Ankunft am Zoo\n9:30 Führung\n11:00 Mittagessen\n11:45 freie Zeit\n13:20 Rückfahrt"
                say: "Stimmt das? Die Busfahrt zum Zoo dauert fünfundvierzig Minuten."
                answer: true
                hints:
                  - "Die Fahrt geht von 8:30 bis 9:15."
                  - "Von 8:30 bis 9:00 sind es 30 Minuten, dann noch 15 Minuten."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was beginnt um 10:35 Uhr?\nMontag\n8:00 Deutsch\n8:45 Mathe\n9:30 große Pause\n9:50 Sachunterricht\n10:35 Sport\n12:05 Schulschluss"
                say: "Was beginnt am Montag um zehn Uhr fünfunddreißig?"
                options: ["Sport", "Sachunterricht", "Schulschluss"]
                answer: "Sport"
                hints: ["Such 10:35 im Plan."]
              - id: l2-s2
                type: text_input
                text: "Wie viele Minuten dauert das Mittagessen?\nAusflug in den Zoo\n8:30 Abfahrt mit dem Bus\n9:15 Ankunft am Zoo\n9:30 Führung\n11:00 Mittagessen\n11:45 freie Zeit\n13:20 Rückfahrt"
                say: "Wie viele Minuten dauert das Mittagessen beim Ausflug?"
                answer: "45"
                hints: ["Das Mittagessen dauert bis zur freien Zeit."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie lange dauert Film 2?\nKinderkino\n14:30 Film 1\n16:10 Pause\n16:30 Film 2\n18:00 Ende"
                say: "Wie lange dauert Film zwei im Kinderkino?"
                options: ["1 Stunde 30 Minuten", "1 Stunde 70 Minuten", "2 Stunden 30 Minuten"]
                answer: "1 Stunde 30 Minuten"
                hints: ["Rechne von 16:30 bis 17:00, dann bis 18:00."]
              - id: l2-s4
                type: true_false
                text: "Der Sprint dauert länger als der Weitsprung.\nSportfest\n9:00 Begrüßung\n9:15 Sprint\n10:00 Weitsprung\n10:45 Pause\n11:00 Staffellauf"
                say: "Stimmt das? Der Sprint dauert länger als der Weitsprung."
                answer: false
                hints: ["Rechne aus, wie lange beide dauern."]
              - id: l2-s5
                type: text_input
                text: "Wie viele Minuten dauert der Sportunterricht?\nMontag\n8:00 Deutsch\n8:45 Mathe\n9:30 große Pause\n9:50 Sachunterricht\n10:35 Sport\n12:05 Schulschluss"
                say: "Der Sportunterricht dauert bis zum Schulschluss. Wie viele Minuten dauert er?"
                answer: "90"
                hints: ["Rechne von 10:35 bis 11:00, dann weiter bis 12:05."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wann beginnt die Rückfahrt?\nAusflug in den Zoo\n8:30 Abfahrt mit dem Bus\n9:15 Ankunft am Zoo\n9:30 Führung\n11:00 Mittagessen\n11:45 freie Zeit\n13:20 Rückfahrt"
                say: "Wann beginnt die Rückfahrt vom Zoo?"
                options: ["13:20", "11:45", "9:15"]
                answer: "13:20"
              - id: l2-n2
                type: text_input
                text: "Wie viele Minuten dauert die Begrüßung?\nSportfest\n9:00 Begrüßung\n9:15 Sprint\n10:00 Weitsprung\n10:45 Pause\n11:00 Staffellauf"
                say: "Wie viele Minuten dauert die Begrüßung beim Sportfest?"
                answer: "15"
              - id: l2-n3
                type: multiple_choice
                text: "Wie lange dauert die Führung?\nAusflug in den Zoo\n8:30 Abfahrt mit dem Bus\n9:15 Ankunft am Zoo\n9:30 Führung\n11:00 Mittagessen\n11:45 freie Zeit\n13:20 Rückfahrt"
                say: "Wie lange dauert die Führung durch den Zoo?"
                options: ["1 Stunde 30 Minuten", "1 Stunde 70 Minuten", "2 Stunden"]
                answer: "1 Stunde 30 Minuten"
              - id: l2-n4
                type: true_false
                text: "Die Pause im Kinderkino dauert 20 Minuten.\nKinderkino\n14:30 Film 1\n16:10 Pause\n16:30 Film 2\n18:00 Ende"
                say: "Stimmt das? Die Pause im Kinderkino dauert zwanzig Minuten."
                answer: true
              - id: l2-n5
