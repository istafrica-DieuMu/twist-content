# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.ask-questions
skill: math.word-problems.ask-questions
curriculum: de-DE
language: de
title:
  de: Fragen zu Sachaufgaben stellen
  en: Asking questions about a situation
summary: >
  Lesson 1 finds questions that fit a situation and the calculation that
  answers each one (Wie viele sind es zusammen? Wie viele mehr?); lesson 2
  tells questions the story can answer from ones it cannot, finds the
  missing fact, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.word-problems.question-calc-answer]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit]
  vocabulary: { de: [Frage, Sachaufgabe, Angabe, beantworten, zusammen, mehr, weniger] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: any-question-works
      what: Thinks every question about the story can be answered, also when a fact is missing (Wie alt ist der Busfahrer?)
      addressed: lesson 2 Learn shows a question with no fact to answer it; every stage of lesson 2 sorts or picks questions that cannot be answered, with feedback in l2-f1
    - id: question-not-calculation
      what: Asks a question whose answer is already in the story (Wie viele rote Ballons hat Mia?)
      addressed: lesson 1 Learn says a good question asks for something new; l1-f2 and l1-s2 offer a question the story already answers, with feedback in l1-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Passende Fragen finden", en: "Finding questions that fit" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Satz ist die Frage? Tim hat 12 Murmeln. Er gewinnt 6 dazu. Wie viele Murmeln hat er jetzt?"
            say: "Tim hat zwölf Murmeln. Er gewinnt sechs dazu. Wie viele Murmeln hat er jetzt? Welcher Satz ist die Frage?"
            options: ["Wie viele Murmeln hat er jetzt?", "Tim hat 12 Murmeln.", "Er gewinnt 6 dazu."]
            answer: "Wie viele Murmeln hat er jetzt?"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "35 + 20 = _"
            say: "Fünfunddreißig plus zwanzig."
            answer: "55"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Mia hat 14 rote und 9 blaue Ballons."
            say: "Mia hat vierzehn rote und neun blaue Ballons. Hier steht noch keine Frage. Du kannst selbst eine stellen."
          - text: "Wie viele Ballons hat Mia zusammen? 14 + 9 = 23"
            say: "Eine Frage: Wie viele Ballons hat Mia zusammen? Dazu rechnest du vierzehn plus neun. Das sind dreiundzwanzig."
          - text: "Wie viele rote Ballons hat sie mehr als blaue? 14 − 9 = 5"
            say: "Noch eine Frage: Wie viele rote Ballons hat sie mehr als blaue? Dazu rechnest du vierzehn minus neun. Eine gute Frage fragt nach etwas Neuem. Wie viele rote Ballons Mia hat, steht ja schon da."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Im Bus sitzen 25 Kinder. An der Schule steigen 8 aus. Welche Frage passt?"
                say: "Im Bus sitzen fünfundzwanzig Kinder. An der Schule steigen acht aus. Welche Frage passt zu dieser Geschichte?"
                options: ["Wie viele Kinder sitzen noch im Bus?", "Wie alt sind die Kinder?", "Wie heißt der Busfahrer?"]
                answer: "Wie viele Kinder sitzen noch im Bus?"
                hints:
                  - "Die Frage soll man mit den Zahlen aus der Geschichte beantworten können."
                  - "Du weißt, wie viele im Bus sind und wie viele aussteigen."
                  - "Wie viele Kinder sitzen noch im Bus?"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ben hat 30 Sticker. Lea hat 18 Sticker. Welche Frage fragt nach etwas Neuem?"
                say: "Ben hat dreißig Sticker. Lea hat achtzehn Sticker. Welche Frage fragt nach etwas Neuem?"
                options: ["Wie viele Sticker haben beide zusammen?", "Wie viele Sticker hat Ben?", "Wie viele Sticker hat Lea?"]
                answer: "Wie viele Sticker haben beide zusammen?"
                feedback:
                  "Wie viele Sticker hat Ben?": "Das steht schon in der Geschichte: 30. Eine gute Frage fragt nach etwas Neuem."
                  "Wie viele Sticker hat Lea?": "Das steht schon in der Geschichte: 18. Eine gute Frage fragt nach etwas Neuem."
                hints:
                  - "Welche Antwort steht noch nicht da?"
                  - "Für die neue Antwort musst du rechnen."
                  - "Wie viele Sticker haben beide zusammen?"
              - id: l1-f3
                type: multiple_choice
                text: "Frage: Wie viele Sticker haben beide zusammen? Welche Rechnung passt?"
                say: "Ben hat dreißig Sticker, Lea hat achtzehn. Wie viele Sticker haben beide zusammen? Welche Rechnung passt?"
                options: ["30 + 18", "30 − 18", "18 − 30"]
                answer: "30 + 18"
                hints:
                  - "Zusammen heißt: Du legst beide Mengen zusammen."
                  - "Das ist eine Plusaufgabe."
                  - "30 + 18."
              - id: l1-f4
                type: matching
                text: "Welche Rechnung passt zu welcher Frage? Ben hat 30 Sticker, Lea hat 18."
                say: "Ben hat dreißig Sticker, Lea hat achtzehn. Verbinde jede Frage mit ihrer Rechnung."
                pairs:
                  - { left: { text: "Wie viele zusammen?" }, right: { text: "30 + 18" } }
                  - { left: { text: "Wie viele hat Ben mehr?" }, right: { text: "30 − 18" } }
                option_audio: false
                hints:
                  - "Zusammen ist plus."
                  - "Wie viele mehr: Du vergleichst und ziehst ab."
                  - "Zusammen: 30 + 18. Wie viele mehr: 30 − 18."
              - id: l1-f5
                type: true_false
                text: "Im Regal stehen 40 Bücher. 15 Bücher werden ausgeliehen. Passt die Frage: Wie viele Bücher stehen noch im Regal?"
                say: "Im Regal stehen vierzig Bücher. Fünfzehn Bücher werden ausgeliehen. Passt die Frage: Wie viele Bücher stehen noch im Regal?"
                answer: true
                hints:
                  - "Kannst du die Frage mit den Zahlen beantworten?"
                  - "Vierzig minus fünfzehn."
                  - "Ja, die Frage passt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Auf dem Spielplatz spielen 16 Mädchen und 12 Jungen. Welche Frage passt?"
                say: "Auf dem Spielplatz spielen sechzehn Mädchen und zwölf Jungen. Welche Frage passt?"
                options: ["Wie viele Kinder spielen dort?", "Wie groß ist der Spielplatz?", "Wann gehen die Kinder nach Hause?"]
                answer: "Wie viele Kinder spielen dort?"
                hints: ["Die Antwort muss man mit den Zahlen ausrechnen können."]
              - id: l1-s2
                type: multiple_choice
                text: "Oma backt 24 Kekse. Die Kinder essen 9. Welche Frage fragt nach etwas Neuem?"
                say: "Oma backt vierundzwanzig Kekse. Die Kinder essen neun. Welche Frage fragt nach etwas Neuem?"
                options: ["Wie viele Kekse sind noch übrig?", "Wie viele Kekse backt Oma?", "Wie viele Kekse essen die Kinder?"]
                answer: "Wie viele Kekse sind noch übrig?"
                hints: ["Zwei Antworten stehen schon in der Geschichte."]
              - id: l1-s3
                type: multiple_choice
                text: "Frage: Wie viele Kekse sind noch übrig? Welche Rechnung passt?"
                say: "Oma backt vierundzwanzig Kekse. Die Kinder essen neun. Wie viele Kekse sind noch übrig? Welche Rechnung passt?"
                options: ["24 − 9", "24 + 9", "9 − 24"]
                answer: "24 − 9"
                hints: ["Es werden weniger Kekse."]
              - id: l1-s4
                type: matching
                text: "Welche Rechnung passt? Im Korb liegen 20 Äpfel und 7 Birnen."
                say: "Im Korb liegen zwanzig Äpfel und sieben Birnen. Verbinde jede Frage mit ihrer Rechnung."
                pairs:
                  - { left: { text: "Wie viel Obst zusammen?" }, right: { text: "20 + 7" } }
                  - { left: { text: "Wie viele Äpfel mehr als Birnen?" }, right: { text: "20 − 7" } }
                option_audio: false
                hints: ["Mehr als: Du vergleichst."]
              - id: l1-s5
                type: true_false
                text: "Lena hat 50 Cent. Ein Lolli kostet 20 Cent. Passt die Frage: Welche Farbe hat der Lolli?"
                say: "Lena hat fünfzig Cent. Ein Lolli kostet zwanzig Cent. Passt die Frage: Welche Farbe hat der Lolli?"
                answer: false
                hints: ["Kannst du die Farbe aus den Zahlen ausrechnen?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Im Zoo sind 45 Kinder. 20 gehen zu den Affen, die anderen zu den Löwen. Welche Frage passt?"
                say: "Im Zoo sind fünfundvierzig Kinder. Zwanzig gehen zu den Affen, die anderen zu den Löwen. Welche Frage passt?"
                options: ["Wie viele Kinder gehen zu den Löwen?", "Wie viele Affen gibt es?", "Wie heißt der Zoo?"]
                answer: "Wie viele Kinder gehen zu den Löwen?"
              - id: l1-n2
                type: multiple_choice
                text: "Frage: Wie viele Kinder gehen zu den Löwen? Welche Rechnung passt?"
                say: "Im Zoo sind fünfundvierzig Kinder. Zwanzig gehen zu den Affen. Wie viele Kinder gehen zu den Löwen? Welche Rechnung passt?"
                options: ["45 − 20", "45 + 20", "20 − 45"]
                answer: "45 − 20"
              - id: l1-n3
                type: matching
                text: "Welche Rechnung passt? Paul hat 32 Karten, Ali hat 25."
                say: "Paul hat zweiunddreißig Karten, Ali hat fünfundzwanzig. Verbinde jede Frage mit ihrer Rechnung."
                pairs:
                  - { left: { text: "Wie viele Karten zusammen?" }, right: { text: "32 + 25" } }
                  - { left: { text: "Wie viele hat Paul mehr?" }, right: { text: "32 − 25" } }
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Im Garten blühen 18 Tulpen und 11 Rosen. Passt die Frage: Wie viele Blumen blühen im Garten?"
                say: "Im Garten blühen achtzehn Tulpen und elf Rosen. Passt die Frage: Wie viele Blumen blühen im Garten?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "Wie viele Blumen blühen im Garten? 18 Tulpen und 11 Rosen."
                say: "Im Garten blühen achtzehn Tulpen und elf Rosen. Wie viele Blumen blühen im Garten?"
                answer: "29"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ein Zug hat 60 Plätze. 38 sind besetzt. Welche Frage kannst du mit einer Rechnung beantworten?"
            say: "Ein Zug hat sechzig Plätze. Achtunddreißig Plätze sind besetzt. Welche Frage kannst du mit einer Rechnung beantworten?"
            options: ["Wie viele Plätze sind noch frei?", "Wohin fährt der Zug?", "Wie viele Plätze hat der Zug?"]
            answer: "Wie viele Plätze sind noch frei?"
          - id: l1-c2
            type: multiple_choice
            text: "Frage: Wie viele Plätze sind noch frei? Welche Rechnung passt?"
            say: "Ein Zug hat sechzig Plätze. Achtunddreißig sind besetzt. Wie viele Plätze sind noch frei? Welche Rechnung passt?"
            options: ["60 − 38", "60 + 38", "38 − 60"]
            answer: "60 − 38"
          - id: l1-c3
            type: true_false
            text: "Mila hat 13 Perlen. Sie kauft 10 dazu. Passt die Frage: Wie viele Perlen hat Mila jetzt?"
            say: "Mila hat dreizehn Perlen. Sie kauft zehn dazu. Passt die Frage: Wie viele Perlen hat Mila jetzt?"
            answer: true

  - n: 2
    title: { de: "Kann ich das beantworten?", en: "Can I answer it?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Lisa hat 22 Muscheln, Max hat 15. Welche Rechnung passt zu: Wie viele hat Lisa mehr?"
            say: "Lisa hat zweiundzwanzig Muscheln, Max hat fünfzehn. Welche Rechnung passt zu der Frage: Wie viele Muscheln hat Lisa mehr?"
            options: ["22 − 15", "22 + 15", "15 − 22"]
            answer: "22 − 15"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "22 − 15 = _"
            say: "Zweiundzwanzig minus fünfzehn."
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Im Bus sitzen 20 Kinder. 6 steigen ein."
            say: "Im Bus sitzen zwanzig Kinder. Sechs steigen ein. Welche Fragen kannst du beantworten?"
          - text: "Wie viele Kinder sitzen jetzt im Bus? Ja: 20 + 6 = 26"
            say: "Wie viele Kinder sitzen jetzt im Bus? Die kannst du beantworten: zwanzig plus sechs sind sechsundzwanzig."
          - text: "Wie alt ist der Busfahrer? Nein: keine Angabe"
            say: "Wie alt ist der Busfahrer? Die kannst du nicht beantworten. In der Geschichte steht nichts über sein Alter. Es fehlt eine Angabe."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ein Kuchen hat 12 Stücke. Die Familie isst 5 Stücke. Welche Frage kannst du nicht beantworten?"
                say: "Ein Kuchen hat zwölf Stücke. Die Familie isst fünf Stücke. Welche Frage kannst du nicht beantworten?"
                options: ["Wie viele Leute sind in der Familie?", "Wie viele Stücke sind übrig?", "Wie viele Stücke hatte der Kuchen?"]
                answer: "Wie viele Leute sind in der Familie?"
                feedback:
                  "Wie viele Stücke sind übrig?": "Die kannst du beantworten: zwölf minus fünf."
                  "Wie viele Stücke hatte der Kuchen?": "Das steht in der Geschichte: zwölf."
                hints:
                  - "Für welche Frage steht keine Zahl in der Geschichte?"
                  - "Über die Familie weißt du nur, wie viel sie isst."
                  - "Wie viele Leute sind in der Familie?"
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Im Schwimmbad sind 34 Kinder. 12 springen vom Brett. Welche Fragen kannst du beantworten?"
                say: "Im Schwimmbad sind vierunddreißig Kinder. Zwölf springen vom Brett. Sortiere die Fragen: Kannst du sie beantworten oder nicht?"
                bins:
                  - { id: yes, show: { text: "kann ich beantworten" }, say: "kann ich beantworten" }
                  - { id: no, show: { text: "kann ich nicht beantworten" }, say: "kann ich nicht beantworten" }
                options:
                  - { text: "Wie viele springen nicht?", bin: yes }
                  - { text: "Wie tief ist das Becken?", bin: no }
                  - { text: "Wie viele Kinder sind da?", bin: yes }
                  - { text: "Wie warm ist das Wasser?", bin: no }
                hints:
                  - "Steht für die Antwort eine Zahl in der Geschichte, oder kannst du sie ausrechnen?"
                  - "Über das Becken und das Wasser steht nichts da."
                  - "Beantworten: Wie viele springen nicht, Wie viele Kinder sind da. Nicht: Becken, Wasser."
              - id: l2-f3
                type: multiple_choice
                text: "Tom kauft 3 Hefte. Wie viel muss er bezahlen? Welche Angabe fehlt?"
                say: "Tom kauft drei Hefte. Wie viel muss er bezahlen? Um das auszurechnen, fehlt dir etwas. Welche Angabe fehlt?"
                options: ["was ein Heft kostet", "wie viele Hefte er kauft", "wie Tom heißt"]
                answer: "was ein Heft kostet"
                hints:
                  - "Was weißt du schon?"
                  - "Du weißt, dass er drei Hefte kauft. Den Preis weißt du nicht."
                  - "was ein Heft kostet."
              - id: l2-f4
                type: true_false
                text: "Auf dem Parkplatz stehen 28 Autos. 9 fahren weg. Kannst du beantworten: Wie viele Autos sind rot?"
                say: "Auf dem Parkplatz stehen achtundzwanzig Autos. Neun fahren weg. Kannst du die Frage beantworten: Wie viele Autos sind rot?"
                answer: false
                hints:
                  - "Steht etwas über die Farben in der Geschichte?"
                  - "Es steht nur, wie viele Autos da sind und wie viele wegfahren."
                  - "Nein, das kannst du nicht beantworten."
              - id: l2-f5
                type: multiple_choice
                text: "Lea liest jeden Tag in ihrem Buch. Wie viele Seiten liest sie in 5 Tagen? Welche Angabe fehlt?"
                say: "Lea liest jeden Tag in ihrem Buch. Wie viele Seiten liest sie in fünf Tagen? Welche Angabe fehlt?"
                options: ["wie viele Seiten sie an einem Tag liest", "wie viele Tage sie liest", "wie das Buch heißt"]
                answer: "wie viele Seiten sie an einem Tag liest"
                hints:
                  - "Die Tage kennst du: fünf."
                  - "Wie viele Seiten sind es an einem Tag?"
                  - "wie viele Seiten sie an einem Tag liest."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "In der Klasse sind 24 Kinder. 11 sind Mädchen. Welche Frage kannst du nicht beantworten?"
                say: "In der Klasse sind vierundzwanzig Kinder. Elf sind Mädchen. Welche Frage kannst du nicht beantworten?"
                options: ["Wie viele Kinder haben eine Brille?", "Wie viele Jungen sind in der Klasse?", "Wie viele Kinder sind in der Klasse?"]
                answer: "Wie viele Kinder haben eine Brille?"
                hints: ["Über Brillen steht nichts in der Geschichte."]
              - id: l2-s2
                type: sorting
                text: "Ein Bäcker backt 50 Brötchen. Bis Mittag verkauft er 35. Welche Fragen kannst du beantworten?"
                say: "Ein Bäcker backt fünfzig Brötchen. Bis Mittag verkauft er fünfunddreißig. Sortiere die Fragen: Kannst du sie beantworten oder nicht?"
                bins:
                  - { id: yes, show: { text: "kann ich beantworten" }, say: "kann ich beantworten" }
                  - { id: no, show: { text: "kann ich nicht beantworten" }, say: "kann ich nicht beantworten" }
                options:
                  - { text: "Wie viele Brötchen sind noch da?", bin: yes }
                  - { text: "Was kostet ein Brötchen?", bin: no }
                  - { text: "Wie viele hat er verkauft?", bin: yes }
                  - { text: "Wann öffnet die Bäckerei?", bin: no }
                hints: ["Über Preise und Uhrzeiten steht nichts da."]
              - id: l2-s3
                type: multiple_choice
                text: "Ein Eis kostet 1 Euro. Mia kauft ein Eis. Wie viel Geld bekommt Mia zurück? Welche Angabe fehlt?"
                say: "Ein Eis kostet einen Euro. Mia kauft ein Eis. Wie viel Geld bekommt sie zurück? Welche Angabe fehlt?"
                options: ["wie viel Geld Mia der Verkäuferin gibt", "was das Eis kostet", "welche Sorte Mia nimmt"]
                answer: "wie viel Geld Mia der Verkäuferin gibt"
                hints: ["Für das Rückgeld musst du wissen, womit sie bezahlt."]
              - id: l2-s4
                type: true_false
                text: "Im Glas sind 40 Gummibärchen. Jan isst 13. Kannst du beantworten: Wie viele Gummibärchen sind noch im Glas?"
                say: "Im Glas sind vierzig Gummibärchen. Jan isst dreizehn. Kannst du die Frage beantworten: Wie viele Gummibärchen sind noch im Glas?"
                answer: true
                hints: ["Vierzig minus dreizehn."]
              - id: l2-s5
                type: text_input
                text: "Wie viele Gummibärchen sind noch im Glas? 40 im Glas, Jan isst 13."
                say: "Im Glas sind vierzig Gummibärchen. Jan isst dreizehn. Wie viele sind noch im Glas?"
                answer: "27"
                hints: ["Rechne erst 40 − 10, dann noch 3 weg."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Im Stall sind 8 Kühe und 15 Hühner. Welche Frage kannst du nicht beantworten?"
                say: "Im Stall sind acht Kühe und fünfzehn Hühner. Welche Frage kannst du nicht beantworten?"
                options: ["Wie viele Eier legen die Hühner?", "Wie viele Tiere sind im Stall?", "Wie viele Hühner mehr als Kühe?"]
                answer: "Wie viele Eier legen die Hühner?"
              - id: l2-n2
                type: sorting
                text: "Jonas hat 60 Murmeln. Er schenkt Ali 25. Welche Fragen kannst du beantworten?"
                say: "Jonas hat sechzig Murmeln. Er schenkt Ali fünfundzwanzig. Sortiere die Fragen: Kannst du sie beantworten oder nicht?"
                bins:
                  - { id: yes, show: { text: "kann ich beantworten" }, say: "kann ich beantworten" }
                  - { id: no, show: { text: "kann ich nicht beantworten" }, say: "kann ich nicht beantworten" }
                options:
                  - { text: "Wie viele behält Jonas?", bin: yes }
                  - { text: "Wo wohnt Ali?", bin: no }
                  - { text: "Wie viele schenkt Jonas?", bin: yes }
                  - { text: "Wie alt ist Ali?", bin: no }
              - id: l2-n3
                type: multiple_choice
                text: "Im Kino gibt es Reihen mit je 10 Plätzen. Wie viele Plätze hat das Kino? Welche Angabe fehlt?"
                say: "Im Kino gibt es Reihen mit je zehn Plätzen. Wie viele Plätze hat das Kino? Welche Angabe fehlt?"
                options: ["wie viele Reihen es gibt", "wie viele Plätze in einer Reihe sind", "welcher Film läuft"]
                answer: "wie viele Reihen es gibt"
              - id: l2-n4
                type: true_false
                text: "Ein Weg ist 80 Meter lang. Lina ist schon 50 Meter gelaufen. Kannst du beantworten: Wie viele Meter fehlen noch?"
                say: "Ein Weg ist achtzig Meter lang. Lina ist schon fünfzig Meter gelaufen. Kannst du die Frage beantworten: Wie viele Meter fehlen noch?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "Wie viele Meter fehlen noch? Der Weg ist 80 m lang, Lina ist 50 m gelaufen."
                say: "Ein Weg ist achtzig Meter lang. Lina ist schon fünfzig Meter gelaufen. Wie viele Meter fehlen noch?"
                answer: "30"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Im Regal stehen 36 Gläser. 14 sind leer. Welche Frage kannst du mit einer Rechnung beantworten?"
            say: "Im Regal stehen sechsunddreißig Gläser. Vierzehn sind leer. Welche Frage kannst du mit einer Rechnung beantworten?"
            options: ["Wie viele Gläser sind voll?", "Wie viele Gläser stehen im Regal?", "Wie hoch ist das Regal?"]
            answer: "Wie viele Gläser sind voll?"
          - id: l2-c2
            type: multiple_choice
            text: "Frage: Wie viele Gläser sind voll? Welche Rechnung passt?"
            say: "Im Regal stehen sechsunddreißig Gläser. Vierzehn sind leer. Wie viele Gläser sind voll? Welche Rechnung passt?"
            options: ["36 − 14", "36 + 14", "14 − 36"]
            answer: "36 − 14"
          - id: l2-c3
            type: sorting
            text: "In der Kiste sind 27 Bälle. 9 sind kaputt. Welche Fragen kannst du beantworten?"
