# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.fair-games
skill: math.chance.fair-games
curriculum: de-DE
language: de
title:
  de: Ist das Spiel fair?
  en: Is the game fair?
summary: >
  Lesson 1 calls a game fair when every player has the same number of
  ways to win, counted on one Würfel or one Glücksrad (Anna 1, 2, 3 and
  Ben 4, 5, 6: 3 zu 3, fair; one colour each on a wheel with three red
  fields and one blue: not fair), and changes a rule to make a game
  fair. Lesson 2 counts the ways with two Münzen (KK, KZ, ZK, ZZ: mixed
  happens two ways) and two Würfel (Augensumme 7 six ways, 12 one way,
  3 + 4 and 4 + 3 counted apart), decides and explains whether games
  with them are fair, and ends with the skill check. Playing the games
  in the app waits for an experiment task.
metadata:
  year: klasse-4
  topic: { de: Wahrscheinlichkeit, en: Chance }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.chance.compare-chances, math.chance.combinations]
  also_practises: [math.chance.compare-chances, math.chance.combinations]
  vocabulary: { de: [fair, unfair, Gewinnchance, Möglichkeit, Augensumme, Pasch, Kopf, Zahl, gerade, ungerade] }
  forms: [text, audio, drawn]
  drawn: [spinner, dots]
  facets: []
  misconceptions:
    - id: one-each-is-fair
      what: Calls a game fair because each player has one colour or one rule, without counting how many ways each has
      addressed: lesson 1 Learn shows a wheel with one colour each that is not fair; l1-f3 (with feedback), l1-s3, l1-n2 and l2-c1 give each player one colour on an uneven wheel
    - id: mixed-counts-once
      what: Counts mixed outcomes once (two Münzen give three results, Augensumme 7 only 3 + 4, 2 + 5, 1 + 6)
      addressed: lesson 2 Learn lists KZ and ZK and a red and a blue Würfel; l2-f1 (with feedback), l2-f3 (with feedback), l2-s1, l2-s3, l2-n2 and l2-c3 offer the count with mixed results counted once
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gleiche Chancen für alle", en: "The same chance for everyone" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Du würfelst einmal. Was ist wahrscheinlicher?"
            say: "Du würfelst einmal. Was ist wahrscheinlicher?"
            options: ["eine 1 oder eine 2", "eine 5", "beides gleich"]
            answer: "eine 1 oder eine 2"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Jana hat 2 Mützen und 3 Schals. Wie viele Möglichkeiten hat sie, eine Mütze und einen Schal zu kombinieren?"
            say: "Jana hat zwei Mützen und drei Schals. Wie viele Möglichkeiten hat sie, eine Mütze und einen Schal zu kombinieren?"
            options: ["6", "5", "3"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Anna gewinnt bei 1, 2, 3.\nBen gewinnt bei 4, 5, 6.\n3 zu 3: fair"
            say: "Ein Spiel ist fair, wenn jeder die gleiche Chance hat zu gewinnen. Zähl für jeden die Möglichkeiten. Anna gewinnt bei eins, zwei oder drei. Das sind drei Möglichkeiten. Ben gewinnt bei vier, fünf oder sechs. Auch drei. Drei zu drei: Das Spiel ist fair."
          - text: "Anna gewinnt bei 1, 2.\nBen gewinnt bei 3, 4, 5, 6.\n2 zu 4: nicht fair"
            say: "Jetzt gewinnt Anna nur bei eins oder zwei. Ben gewinnt bei drei, vier, fünf oder sechs. Zwei zu vier. Ben hat mehr Möglichkeiten. Das Spiel ist nicht fair."
          - text: "Lea: Rot, 3 Felder\nMax: Blau, 1 Feld\n3 zu 1: nicht fair"
            say: "Lea gewinnt bei Rot, Max gewinnt bei Blau. Jeder hat eine Farbe. Klingt fair, ist es aber nicht. Rot hat drei Felder, Blau nur eins. Zähl immer die Felder, nicht die Farben."
            show: { drawn: spinner, sectors: [red, red, blue, red] }
          - text: "Fair machen: Max bekommt Blau und Gelb."
            say: "Du kannst ein Spiel fair machen. Hier hat Rot zwei Felder, Blau und Gelb haben je eins. Wenn Max bei Blau und bei Gelb gewinnt, steht es zwei zu zwei. Jetzt ist es fair."
            show: { drawn: spinner, sectors: [red, blue, red, yellow] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Tim gewinnt bei 1, 3, 5. Ela gewinnt bei 2, 4, 6. Ist das Spiel fair?"
                say: "Tim und Ela würfeln. Tim gewinnt bei eins, drei oder fünf. Ela gewinnt bei zwei, vier oder sechs. Ist das Spiel fair?"
                options: ["fair", "nicht fair"]
                answer: "fair"
                keep_order: true
                hints:
                  - "Zähl für jedes Kind die Zahlen, bei denen es gewinnt."
                  - "Tim hat 3 Zahlen. Ela hat auch 3 Zahlen."
                  - "3 zu 3: Das ist fair."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Paul gewinnt bei 1, 2, 3, 4. Nora gewinnt bei 5, 6."
                say: "Paul gewinnt bei eins, zwei, drei oder vier. Nora gewinnt bei fünf oder sechs. Wie viele Möglichkeiten hat jedes Kind?"
                frame: "Paul: _  Nora: _"
                options: ["2", "3", "4", "6"]
                answer: ["4", "2"]
                hints:
                  - "Zähl die Zahlen für Paul, dann für Nora."
                  - "Paul: 1, 2, 3, 4. Nora: 5, 6."
                  - "Paul 4, Nora 2."
              - id: l1-f3
                type: multiple_choice
                text: "Ida gewinnt bei Gelb, Jakob bei Grün. Ist das Spiel fair?"
                say: "Ida gewinnt bei Gelb, Jakob gewinnt bei Grün. Jeder hat eine Farbe. Ist das Spiel fair?"
                show: { drawn: spinner, sectors: [yellow, green, green, green] }
                options: ["fair", "nicht fair"]
                answer: "nicht fair"
                keep_order: true
                feedback:
                  "fair": "Jeder hat eine Farbe, aber Grün hat 3 Felder und Gelb nur 1. Zähl die Felder."
                hints:
                  - "Zähl nicht die Farben. Zähl die Felder."
                  - "Gelb hat 1 Feld, Grün hat 3 Felder."
                  - "1 zu 3: nicht fair."
              - id: l1-f4
                type: multiple_choice
                text: "Lina gewinnt bei Rot, Mehmet bei Blau. Wer hat die bessere Chance?"
                say: "Lina gewinnt bei Rot. Mehmet gewinnt bei Blau. Wer hat die bessere Chance?"
                show: { drawn: spinner, sectors: [red, blue, red, blue, red, red] }
                options: ["Lina", "Mehmet", "beide gleich"]
                answer: "Lina"
                keep_order: true
                hints:
                  - "Zähl die roten und die blauen Felder."
                  - "Rot hat 4 Felder, Blau hat 2."
                  - "Lina hat die bessere Chance."
              - id: l1-f5
                type: multiple_choice
                text: "Max gewinnt bei 1 und 2. Welche Regel für Sophie macht das Spiel fair?"
                say: "Max und Sophie würfeln. Max gewinnt bei eins oder zwei. Welche Regel für Sophie macht das Spiel fair?"
                options: ["Sophie gewinnt bei 3 und 4.", "Sophie gewinnt bei 3, 4, 5 und 6.", "Sophie gewinnt bei 6."]
                answer: "Sophie gewinnt bei 3 und 4."
                hints:
                  - "Wie viele Möglichkeiten hat Max?"
                  - "Max hat 2 Zahlen. Sophie braucht auch 2."
                  - "Sophie gewinnt bei 3 und 4."
              - id: l1-f6
                type: image_multiple_choice
                text: "Drei Kinder spielen. Eins gewinnt bei Rot, eins bei Blau, eins bei Gelb. Welches Glücksrad ist fair?"
                say: "Drei Kinder spielen. Eins gewinnt bei Rot, eins bei Blau, eins bei Gelb. Welches Glücksrad ist fair?"
                options:
                  - { drawn: spinner, sectors: [red, blue, yellow, red], key: "rot-doppelt" }
                  - { drawn: spinner, sectors: [red, blue, yellow, red, blue, yellow], key: "je-zwei" }
                  - { drawn: spinner, sectors: [red, blue, blue, yellow, blue, yellow], key: "blau-drei" }
                answer: "je-zwei"
                hints:
                  - "Fair heißt: Jede Farbe hat gleich viele Felder."
                  - "Zähl bei jedem Rad die Felder für Rot, Blau und Gelb."
                  - "Das Rad, bei dem jede Farbe 2 Felder hat."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Lars gewinnt bei 6. Emma gewinnt bei 1. Sonst würfeln sie noch einmal. Ist das Spiel fair?"
                say: "Lars gewinnt bei einer Sechs. Emma gewinnt bei einer Eins. Bei allen anderen Zahlen würfeln sie noch einmal. Ist das Spiel fair?"
                options: ["fair", "nicht fair"]
                answer: "fair"
                keep_order: true
                hints: ["Wie oft gibt es die 6 auf dem Würfel, wie oft die 1?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Mia gewinnt bei Rot, Leon bei Blau."
                say: "Mia gewinnt bei Rot, Leon gewinnt bei Blau. Wie viele Felder hat jedes Kind?"
                show: { drawn: spinner, sectors: [red, blue, blue, red, blue, blue] }
                frame: "Mia: _  Leon: _"
                options: ["1", "2", "3", "4"]
                answer: ["2", "4"]
                hints: ["Zähl die roten Felder, dann die blauen."]
              - id: l1-s3
                type: true_false
                text: "Ole: Rot. Kim: Grün. Ole sagt: „Jeder hat eine Farbe, also ist das Spiel fair.“ Stimmt das?"
                say: "Ole gewinnt bei Rot, Kim gewinnt bei Grün. Ole sagt: Jeder hat eine Farbe, also ist das Spiel fair. Stimmt das?"
                show: { drawn: spinner, sectors: [red, red, green, red, red, green] }
                answer: false
                hints: ["Zähl die Felder für jede Farbe."]
              - id: l1-s4
                type: multiple_choice
                text: "Jonas gewinnt bei einer Zahl kleiner als 3, Helin bei einer Zahl größer als 3. Wer gewinnt wahrscheinlich öfter?"
                say: "Jonas gewinnt bei einer Zahl kleiner als drei. Helin gewinnt bei einer Zahl größer als drei. Wer gewinnt wahrscheinlich öfter?"
                options: ["Jonas", "Helin", "beide gleich oft"]
                answer: "Helin"
                keep_order: true
                hints: ["Kleiner als 3: 1, 2. Größer als 3: Welche Zahlen?"]
              - id: l1-s5
                type: multiple_choice
                text: "Lea gewinnt bei Rot. Bei welcher Regel für Max ist das Spiel fair?"
                say: "Rot hat vier Felder, Blau und Gelb haben je eins. Lea gewinnt bei Rot. Was muss für Max gelten, damit das Spiel fair ist?"
                show: { drawn: spinner, sectors: [red, blue, red, red, yellow, red] }
                options: ["Max gewinnt bei Blau.", "Max gewinnt bei Blau und Gelb.", "Das geht mit diesem Rad nicht."]
                answer: "Das geht mit diesem Rad nicht."
                hints: ["Max kann höchstens 2 Felder bekommen. Wie viele hat Lea?"]
                difficulty: stretch
              - id: l1-s6
                type: multiple_choice
                text: "Ali gewinnt bei einer geraden Zahl, Lotte bei einer ungeraden. Ist das Spiel fair?"
                say: "Ali gewinnt bei einer geraden Zahl. Lotte gewinnt bei einer ungeraden Zahl. Ist das Spiel fair?"
                options: ["fair", "nicht fair"]
                answer: "fair"
                keep_order: true
                hints: ["Gerade: 2, 4, 6. Ungerade: 1, 3, 5."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ben gewinnt bei 5 und 6. Clara gewinnt bei 1, 2 und 3. Bei 4 würfeln sie noch einmal. Ist das Spiel fair?"
                say: "Ben gewinnt bei fünf oder sechs. Clara gewinnt bei eins, zwei oder drei. Bei vier würfeln sie noch einmal. Ist das Spiel fair?"
                options: ["fair", "nicht fair"]
                answer: "nicht fair"
                keep_order: true
              - id: l1-n2
                type: multiple_choice
                text: "Hanna gewinnt bei Blau, Erik bei Gelb. Ist das Spiel fair?"
                say: "Hanna gewinnt bei Blau, Erik gewinnt bei Gelb. Ist das Spiel fair?"
                show: { drawn: spinner, sectors: [blue, yellow, blue, blue, blue, yellow] }
                options: ["fair", "nicht fair"]
                answer: "nicht fair"
                keep_order: true
              - id: l1-n3
                type: fill_in_blank
                text: "Malte gewinnt bei einer Zahl größer als 2. Selin gewinnt bei 1 und 2."
                say: "Malte gewinnt bei einer Zahl größer als zwei. Selin gewinnt bei eins oder zwei. Wie viele Möglichkeiten hat jedes Kind?"
                frame: "Malte: _  Selin: _"
                options: ["2", "3", "4", "5"]
                answer: ["4", "2"]
              - id: l1-n4
                type: image_multiple_choice
                text: "Grün gegen Rot. Welches Glücksrad ist fair?"
                say: "Ein Kind gewinnt bei Grün, das andere bei Rot. Welches Glücksrad ist fair?"
                options:
                  - { drawn: spinner, sectors: [green, red, green, green], key: "3-zu-1" }
                  - { drawn: spinner, sectors: [green, red, red, green, red, green], key: "3-zu-3" }
                  - { drawn: spinner, sectors: [green, red, red, red, red, green], key: "2-zu-4" }
                answer: "3-zu-3"
              - id: l1-n5
                type: multiple_choice
                text: "Lukas gewinnt bei 1, 2 und 3. Welche Regel für Pia macht das Spiel fair?"
                say: "Lukas gewinnt bei eins, zwei oder drei. Welche Regel für Pia macht das Spiel fair?"
                options: ["Pia gewinnt bei 4 und 5.", "Pia gewinnt bei 4, 5 und 6.", "Pia gewinnt bei 6."]
                answer: "Pia gewinnt bei 4, 5 und 6."
              - id: l1-n6
                type: multiple_choice
                text: "Tom gewinnt bei Rot, Nele bei Blau. Warum ist das Spiel nicht fair?"
                say: "Tom gewinnt bei Rot, Nele gewinnt bei Blau. Warum ist das Spiel nicht fair?"
                show: { drawn: spinner, sectors: [red, blue, red, red] }
                options: ["Rot hat 3 Felder, Blau nur 1.", "Rot ist eine schönere Farbe.", "Tom hat angefangen."]
                answer: "Rot hat 3 Felder, Blau nur 1."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Noah gewinnt bei 1, 2, 3. Lia gewinnt bei 4, 5. Bei 6 würfeln sie noch einmal. Ist das Spiel fair?"
            say: "Noah gewinnt bei eins, zwei oder drei. Lia gewinnt bei vier oder fünf. Bei sechs würfeln sie noch einmal. Ist das Spiel fair?"
            options: ["fair", "nicht fair"]
            answer: "nicht fair"
            keep_order: true
          - id: l1-c2
            type: multiple_choice
            text: "Eda gewinnt bei Gelb, Finn bei Grün. Ist das Spiel fair?"
            say: "Eda gewinnt bei Gelb, Finn gewinnt bei Grün. Ist das Spiel fair?"
            show: { drawn: spinner, sectors: [yellow, green, green, yellow] }
            options: ["fair", "nicht fair"]
            answer: "fair"
            keep_order: true
          - id: l1-c3
            type: multiple_choice
            text: "Sara gewinnt bei einer Zahl größer als 4, Ben bei einer Zahl kleiner als 4. Wer hat die bessere Chance?"
            say: "Sara gewinnt bei einer Zahl größer als vier. Ben gewinnt bei einer Zahl kleiner als vier. Wer hat die bessere Chance?"
            options: ["Sara", "Ben", "beide gleich"]
            answer: "Ben"
            keep_order: true

  - n: 2
    title: { de: "Zwei Münzen, zwei Würfel", en: "Two coins, two dice" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Tarek gewinnt bei Rot, Mira bei Blau. Ist das Spiel fair?"
            say: "Tarek gewinnt bei Rot, Mira gewinnt bei Blau. Ist das Spiel fair?"
            show: { drawn: spinner, sectors: [red, blue, blue, blue] }
            options: ["fair", "nicht fair"]
            answer: "nicht fair"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Anton gewinnt bei 2, 4, 6. Welche Regel für Ina macht das Spiel fair?"
            say: "Anton gewinnt bei zwei, vier oder sechs. Welche Regel für Ina macht das Spiel fair?"
            options: ["Ina gewinnt bei 1, 3, 5.", "Ina gewinnt bei 1 und 3.", "Ina gewinnt bei 5."]
            answer: "Ina gewinnt bei 1, 3, 5."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Zwei Münzen:\nKopf, Kopf (KK)\nKopf, Zahl (KZ)\nZahl, Kopf (ZK)\nZahl, Zahl (ZZ)"
            say: "Du wirfst zwei Münzen, eine nach der anderen. Geh der Reihe nach vor. Erste Münze Kopf: dann Kopf oder Zahl. Erste Münze Zahl: dann Kopf oder Zahl. Das sind vier Möglichkeiten."
          - text: "gleich: KK, ZZ → 2\nverschieden: KZ, ZK → 2\n2 zu 2: fair"
            say: "Lisa gewinnt, wenn beide Münzen gleich sind. Tom gewinnt, wenn sie verschieden sind. Viele denken, verschieden ist nur eine Möglichkeit. Aber es geht zweimal: erst Kopf, dann Zahl, oder erst Zahl, dann Kopf. Zwei zu zwei: Das Spiel ist fair."
          - text: "rot 3, blau 4 → 7\nrot 4, blau 3 → 7"
            say: "Jetzt zwei Würfel, ein roter und ein blauer. Die Augensumme bekommst du, wenn du die Augen beider Würfel zusammenzählst. Drei auf dem roten und vier auf dem blauen ergibt sieben. Vier auf dem roten und drei auf dem blauen ergibt auch sieben. Das sind zwei verschiedene Möglichkeiten."
            show: { drawn: dots, groups: [3, 4], layout: dice }
          - text: "Summe 7: 1+6, 2+5, 3+4, 4+3, 5+2, 6+1 → 6\nSumme 12: 6+6 → 1"
            say: "Für die Summe sieben gibt es sechs Möglichkeiten. Für die Summe zwölf gibt es nur eine: sechs und sechs. Ein Spiel, bei dem einer bei sieben und der andere bei zwölf gewinnt, ist also nicht fair."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Möglichkeiten gibt es mit zwei Münzen?"
                say: "Du wirfst zwei Münzen nacheinander. Wie viele Möglichkeiten gibt es?"
                options: ["4", "3", "2"]
                answer: "4"
                feedback:
                  "3": "Einmal Kopf und einmal Zahl geht auf zwei Arten: KZ und ZK."
                hints:
                  - "Fang mit der ersten Münze an: Kopf. Was kann die zweite zeigen?"
                  - "KK, KZ, und dann mit Zahl vorne: ZK, ZZ."
                  - "4 Möglichkeiten."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Zwei Münzen: Jan gewinnt bei KK, Eva bei einmal Kopf und einmal Zahl. Ist das Spiel fair?"
                say: "Zwei Münzen. Jan gewinnt bei zweimal Kopf. Eva gewinnt bei einmal Kopf und einmal Zahl. Ist das Spiel fair?"
                options: ["fair", "nicht fair"]
                answer: "nicht fair"
                keep_order: true
                hints:
                  - "Zähl die Möglichkeiten für Jan und für Eva."
                  - "Jan: KK. Eva: KZ und ZK."
                  - "1 zu 2: nicht fair."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele Möglichkeiten gibt es für die Augensumme 4?"
                say: "Ein roter und ein blauer Würfel. Wie viele Möglichkeiten gibt es für die Augensumme vier?"
                show: { drawn: dots, groups: [1, 3], layout: dice }
                options: ["3", "2", "4"]
                answer: "3"
                feedback:
                  "2": "1 + 3 und 3 + 1 sind zwei verschiedene Möglichkeiten. Und 2 + 2 gibt es auch."
                hints:
                  - "Fang beim roten Würfel mit 1 an."
                  - "1 + 3, 2 + 2, 3 + 1."
                  - "3 Möglichkeiten."
              - id: l2-f4
                type: true_false
                text: "Rot 2, Blau 5 und Rot 5, Blau 2 sind verschiedene Möglichkeiten."
                say: "Zwei auf dem roten und fünf auf dem blauen Würfel ist eine andere Möglichkeit als fünf auf dem roten und zwei auf dem blauen. Stimmt das?"
                show: { drawn: dots, groups: [2, 5], layout: dice }
                answer: true
                hints:
                  - "Schau, welcher Würfel welche Zahl zeigt."
                  - "Einmal hat der rote Würfel die 2, einmal die 5."
                  - "Ja, das sind zwei verschiedene Möglichkeiten."
              - id: l2-f5
                type: multiple_choice
                text: "Zwei Würfel: Oskar gewinnt bei der Augensumme 7, Frieda bei der Augensumme 2. Wer hat die bessere Chance?"
                say: "Zwei Würfel. Oskar gewinnt bei der Augensumme sieben. Frieda gewinnt bei der Augensumme zwei. Wer hat die bessere Chance?"
                options: ["Oskar", "Frieda", "beide gleich"]
                answer: "Oskar"
                keep_order: true
                hints:
                  - "Zähl die Möglichkeiten für 7 und für 2."
                  - "Summe 2 geht nur mit 1 + 1. Summe 7 geht sechsmal."
                  - "Oskar hat die bessere Chance."
              - id: l2-f6
                type: multiple_choice
                text: "Zwei Münzen: Paul gewinnt bei KK oder ZZ. Welche Regel für Marie macht das Spiel fair?"
                say: "Zwei Münzen. Paul gewinnt bei zweimal Kopf oder zweimal Zahl. Welche Regel für Marie macht das Spiel fair?"
                options: ["Marie gewinnt bei einmal Kopf und einmal Zahl.", "Marie gewinnt bei zweimal Zahl.", "Marie gewinnt bei Kopf zuerst und Zahl danach."]
                answer: "Marie gewinnt bei einmal Kopf und einmal Zahl."
                hints:
                  - "Paul hat KK und ZZ. Das sind 2 Möglichkeiten."
                  - "Welche Möglichkeiten sind noch übrig?"
                  - "KZ und ZK: einmal Kopf und einmal Zahl."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Möglichkeiten gibt es für die Augensumme 3?"
                say: "Ein roter und ein blauer Würfel. Wie viele Möglichkeiten gibt es für die Augensumme drei?"
                options: ["2", "1", "3"]
                answer: "2"
                feedback:
                  "1": "1 + 2 und 2 + 1 sind zwei Möglichkeiten: Der rote Würfel zeigt einmal 1 und einmal 2."
                hints: ["Der rote Würfel kann 1 oder 2 zeigen."]
              - id: l2-s2
                type: multiple_choice
                text: "Zwei Münzen: Kai gewinnt bei ZZ, Lara bei KK. Sonst werfen sie noch einmal. Ist das Spiel fair?"
                say: "Zwei Münzen. Kai gewinnt bei zweimal Zahl. Lara gewinnt bei zweimal Kopf. Sonst werfen sie noch einmal. Ist das Spiel fair?"
                options: ["fair", "nicht fair"]
                answer: "fair"
                keep_order: true
                hints: ["Wie viele Möglichkeiten hat jedes Kind?"]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viele Möglichkeiten gibt es für die Augensumme 11?"
                say: "Ein roter und ein blauer Würfel. Wie viele Möglichkeiten gibt es für die Augensumme elf?"
                show: { drawn: dots, groups: [5, 6], layout: dice }
                options: ["2", "1", "5"]
                answer: "2"
                hints: ["Rot 5 und Blau 6. Geht es auch andersherum?"]
              - id: l2-s4
                type: multiple_choice
                text: "Du würfelst mit zwei Würfeln. Welche Augensumme ist am wahrscheinlichsten?"
                say: "Du würfelst mit zwei Würfeln. Welche Augensumme ist am wahrscheinlichsten?"
                options: ["2", "7", "12"]
                answer: "7"
                hints: ["Für welche Summe gibt es die meisten Möglichkeiten?"]
              - id: l2-s5
                type: true_false
                text: "Zwei Würfel: Rosa gewinnt bei der Augensumme 6, Henri bei 8. Das Spiel ist fair."
