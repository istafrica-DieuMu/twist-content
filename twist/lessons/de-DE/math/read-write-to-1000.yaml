          - id: l2-c2
            type: multiple_choice
            text: "achthundertsiebenundvierzig"
            say: "Lies das Zahlwort. Welche Zahl ist das?"
            options: ["874", "847", "8047"]
            answer: "847"
            option_audio: false
          - id: l2-c3
            type: text_input
            text: "dreihundertzwei"
            say: "Lies das Zahlwort und schreib die Zahl."
            answer: "302"
          - id: l2-c4
            type: multiple_choice
            text: "Welches Zahlwort passt zu 460?"
            say: "Welches Zahlwort passt zu der Zahl? Lies die Wörter selbst."
            options: ["vierhundertsechs", "vierhundertsechzig", "vierhundertsechzehn"]
            answer: "vierhundertsechzig"
            option_audio: false
          - id: l2-c5
            type: text_input
            text: "Hör zu und schreib die Zahl."
            say: "Zweihundertachtzehn. Schreib die Zahl."
            answer: "218"
