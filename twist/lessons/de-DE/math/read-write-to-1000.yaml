# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.read-write-to-1000
skill: math.numbers-to-1000.read-write
curriculum: de-DE
language: de
title:
  de: Zahlen bis 1000 lesen und schreiben
  en: Reading and writing numbers to 1000
summary: >
  A three-digit number word in German says the hundreds first and then
  the two-digit part with its ones first (dreihundertachtundvierzig is
  348). Lesson 1 hears numbers and writes them in digits; lesson 2 reads
  and writes number words, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value]
  also_practises: [math.numbers-to-100.read-write]
  vocabulary: { de: [Zahlwort, Ziffer, hundert, tausend, Stelle] }
  forms: [text, audio, drawn]
  drawn: [place-value-chart]
  facets: []
  misconceptions:
    - id: swap-tens-ones
      what: Swaps the tens and ones after the hundreds (dreihundertachtundvierzig as 384)
      addressed: Learn writes the hundreds, then the tens it hears at the end, then the ones; the swapped number is an option in most choice tasks, with feedback in the full stage
    - id: write-as-heard
      what: Writes the parts as heard (dreihundertvier as 3004 or 34)
      addressed: Learn uses the chart so each digit has one column; tasks with 0 tens are in every stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Hören und schreiben, en: Hear and write }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viel ist die 6 in 465 wert?"
            options: ["6", "60", "600"]
            answer: "60"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Hör zu und schreib die Zahl."
            say: "Siebenundfünfzig. Schreib die Zahl."
            answer: "57"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "dreihundertachtundvierzig"
            say: "Hör gut zu: dreihundertachtundvierzig. Zuerst hörst du die Hunderter: dreihundert. Die Drei kommt zu den Hundertern."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, null, null] }
          - text: "348"
            say: "Dann kommt achtundvierzig. Wie bei den Zahlen bis hundert: Die Zehner stehen am Ende, vierzig. Die Vier kommt zu den Zehnern, die Acht zu den Einern."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 4, 8] }
          - text: "304"
            say: "Bei dreihundertvier hörst du keine Zehner. Dann steht bei den Zehnern eine Null. Die Ziffern sind drei, null und vier."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 0, 4] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Hör zu. Welche Zahl ist das?"
                say: "Zweihundertsechsunddreißig. Welche Zahl ist das?"
                options: ["236", "263", "2036"]
                answer: "236"
                option_audio: false
                feedback:
                  "263": "Nach den Hundertern kommt sechsunddreißig: Die Zehner stehen am Ende, dreißig."
                  "2036": "Für zweihundert schreibst du nur eine 2 bei H."
                hints:
                  - "Zuerst die Hunderter: zweihundert."
                  - "Dann sechsunddreißig: 3 Zehner, 6 Einer."
                  - "Die Zahl ist 236."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Fünfhundertzweiundsiebzig. Schreib die Zahl."
                answer: "572"
                hints:
                  - "Fünfhundert: 5 bei H."
                  - "Zweiundsiebzig: 7 Zehner, 2 Einer."
                  - "572."
              - id: l1-f3
                type: multiple_choice
                text: "Hör zu. Welche Zahl ist das?"
                say: "Siebenhundertneun. Welche Zahl ist das?"
                options: ["79", "709", "790"]
                answer: "709"
                option_audio: false
                hints:
                  - "Hörst du Zehner?"
                  - "Keine Zehner: bei Z steht 0."
                  - "Die Zahl ist 709."
              - id: l1-f4
                type: fill_in_blank
                text: "Hör zu und trag die Zahl ein."
                say: "Achthundertfünfundsechzig. Trag die Zahl in die Stellentafel ein."
                frame: "H: _  Z: _  E: _"
                options: ["5", "6", "8", "65"]
                answer: ["8", "6", "5"]
                option_audio: false
                hints:
                  - "Achthundert: 8 bei H."
                  - "Fünfundsechzig: 6 Zehner, 5 Einer."
                  - "H: 8, Z: 6, E: 5."
              - id: l1-f5
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Vierhundertzwanzig. Schreib die Zahl."
                answer: "420"
                hints:
                  - "Vierhundert und zwanzig."
                  - "Zwanzig sind 2 Zehner, keine Einer."
                  - "420."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? Lena schreibt für neunhundertdreizehn: 931."
                say: "Lena hört neunhundertdreizehn und schreibt die Ziffern neun, drei und eins. Stimmt das?"
                answer: false
                hints:
                  - "Dreizehn ist zehn und drei."
                  - "Ein Zehner und drei Einer."
                  - "Nein, richtig ist 913."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Hör zu. Welche Zahl ist das?"
                say: "Hundertvierundachtzig. Welche Zahl ist das?"
                options: ["148", "184", "1084"]
                answer: "184"
                option_audio: false
                hints: ["Hundert heißt: 1 bei H."]
              - id: l1-s2
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Sechshundertdrei. Schreib die Zahl."
                answer: "603"
                hints: ["Keine Zehner."]
              - id: l1-s3
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Dreihundertsiebenundneunzig. Schreib die Zahl."
                answer: "397"
                hints: ["Die Zehner stehen am Ende des Wortes."]
              - id: l1-s4
                type: fill_in_blank
                text: "Hör zu und trag die Zahl ein."
                say: "Zweihundertfünfzig. Trag die Zahl in die Stellentafel ein."
                frame: "H: _  Z: _  E: _"
                options: ["0", "2", "5", "25"]
                answer: ["2", "5", "0"]
                option_audio: false
                hints: ["Fünfzig: 5 Zehner, keine Einer."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Ali schreibt für siebenhundertvierzig: 740."
                say: "Ali hört siebenhundertvierzig und schreibt die Ziffern sieben, vier und null. Stimmt das?"
                answer: true
                hints: ["Vierzig: 4 Zehner, 0 Einer."]
              - id: l1-s6
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Tausend. Schreib die Zahl."
                answer: "1000"
                hints: ["Zehn Hunderter: eine 1 und drei Nullen."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Vierhundertachtundfünfzig. Schreib die Zahl."
                answer: "458"
              - id: l1-n2
                type: multiple_choice
                text: "Hör zu. Welche Zahl ist das?"
                say: "Neunhundertsechzehn. Welche Zahl ist das?"
                options: ["916", "961", "960"]
                answer: "916"
                option_audio: false
              - id: l1-n3
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Fünfhundertacht. Schreib die Zahl."
                answer: "508"
              - id: l1-n4
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Achthundertdreiundzwanzig. Schreib die Zahl."
                answer: "823"
              - id: l1-n5
                type: fill_in_blank
                text: "Hör zu und trag die Zahl ein."
                say: "Hundertneun. Trag die Zahl in die Stellentafel ein."
                frame: "H: _  Z: _  E: _"
                options: ["0", "1", "9", "19"]
                answer: ["1", "0", "9"]
                option_audio: false
              - id: l1-n6
                type: true_false
                text: "Stimmt das? Ben schreibt für dreihundertzwölf: 3012."
                say: "Ben hört dreihundertzwölf und schreibt die Ziffern drei, null, eins und zwei. Stimmt das?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Hör zu und schreib die Zahl."
            say: "Sechshundertzweiundvierzig. Schreib die Zahl."
            answer: "642"
          - id: l1-c2
            type: multiple_choice
            text: "Hör zu. Welche Zahl ist das?"
            say: "Zweihundertsieben. Welche Zahl ist das?"
            options: ["27", "207", "270"]
            answer: "207"
            option_audio: false
          - id: l1-c3
            type: text_input
            text: "Hör zu und schreib die Zahl."
            say: "Siebenhundertneunundachtzig. Schreib die Zahl."
            answer: "789"

  - n: 2
    title: { de: Zahlwörter bis 1000, en: Number words to 1000 }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Hör zu und schreib die Zahl."
            say: "Dreihundertfünfundsiebzig. Schreib die Zahl."
            answer: "375"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Hör zu. Welche Zahl ist das?"
            say: "Vierhundertsechs. Welche Zahl ist das?"
            options: ["46", "406", "460"]
            answer: "406"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "fünfhundertdreiundsechzig"
            say: "Lies das Zahlwort in Teilen: fünfhundert, dann dreiundsechzig. Fünfhundert gibt die Fünf bei den Hundertern."
          - text: "fünfhundert | drei | und | sechzig"
            say: "Im zweiten Teil, dreiundsechzig, gibt das Ende die Zehner an: sechzig, also sechs Zehner. Vorne steht drei, das sind die Einer. Die Zahl hat die Ziffern fünf, sechs und drei."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [5, 6, 3] }
          - text: "427 → vierhundertsiebenundzwanzig"
            say: "Andersherum schreiben wir zuerst die Hunderter: vierhundert. Dann die Einer, sieben, dann und, dann die Zehner, zwanzig: siebenundzwanzig. Zusammen ist es ein langes Wort."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "zweihundertvierundachtzig"
                say: "Lies das Zahlwort. Welche Zahl ist das?"
                options: ["248", "284", "2084"]
                answer: "284"
                option_audio: false
                feedback:
                  "248": "Achtzig steht am Ende des Wortes. Das sind die Zehner: 8 bei Z."
                hints:
                  - "Teile das Wort: zweihundert und vierundachtzig."
                  - "Vierundachtzig: 8 Zehner, 4 Einer."
                  - "Die Zahl ist 284."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welches Zahlwort passt zu 615?"
                say: "Welches Zahlwort passt zu der Zahl? Lies die Wörter selbst."
                options: ["sechshundertfünfzehn", "sechshundertfünfzig", "sechshunderteinundfünfzig"]
                answer: "sechshundertfünfzehn"
                option_audio: false
                hints:
                  - "615: 6 Hunderter, dann 15."
                  - "15 sagt man fünfzehn."
                  - "Sechshundertfünfzehn."
              - id: l2-f3
                type: text_input
                text: "neunhundertdreißig"
                say: "Lies das Zahlwort und schreib die Zahl."
                answer: "930"
                hints:
                  - "Neunhundert: 9 bei H."
                  - "Dreißig: 3 Zehner, 0 Einer."
                  - "930."
              - id: l2-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrem Zahlwort."
                option_audio: false
                pairs:
                  - { left: { text: "702" }, right: { text: "siebenhundertzwei" } }
                  - { left: { text: "720" }, right: { text: "siebenhundertzwanzig" } }
                  - { left: { text: "272" }, right: { text: "zweihundertzweiundsiebzig" } }
                hints:
                  - "Lies zuerst die Hunderter."
                  - "702 hat keine Zehner, 720 hat keine Einer."
                  - "272 beginnt mit zweihundert."
              - id: l2-f5
                type: true_false
                text: "achthundertneunzehn = 891"
                say: "Lies das Zahlwort und die Zahl. Stimmt das?"
                answer: false
                hints:
                  - "Neunzehn ist zehn und neun."
                  - "1 Zehner, 9 Einer."
                  - "Nein, richtig ist 819."
              - id: l2-f6
                type: multiple_choice
                text: "Welches Zahlwort passt zu 350?"
                say: "Welches Zahlwort passt zu der Zahl? Lies die Wörter selbst."
                options: ["dreihundertfünf", "dreihundertfünfzig", "dreihundertfünfzehn"]
                answer: "dreihundertfünfzig"
                option_audio: false
                hints:
                  - "350: 5 Zehner, keine Einer."
                  - "Fünf Zehner sind fünfzig."
                  - "Dreihundertfünfzig."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "vierhundertsiebenundneunzig"
                say: "Lies das Zahlwort. Welche Zahl ist das?"
                options: ["479", "497", "4097"]
                answer: "497"
                option_audio: false
                hints: ["Neunzig steht am Ende."]
              - id: l2-s2
                type: text_input
                text: "hundertsechzig"
                say: "Lies das Zahlwort und schreib die Zahl."
                answer: "160"
                hints: ["Hundert: 1 bei H."]
              - id: l2-s3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrem Zahlwort."
                option_audio: false
                pairs:
                  - { left: { text: "530" }, right: { text: "fünfhundertdreißig" } }
                  - { left: { text: "503" }, right: { text: "fünfhundertdrei" } }
                  - { left: { text: "513" }, right: { text: "fünfhundertdreizehn" } }
                hints: ["Zehn oder zig?"]
              - id: l2-s4
                type: true_false
                text: "sechshundertvierundvierzig = 644"
                say: "Lies das Zahlwort und die Zahl. Stimmt das?"
                answer: true
                hints: ["Vierundvierzig: 4 Zehner, 4 Einer."]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Zahlwort passt zu 808?"
                say: "Welches Zahlwort passt zu der Zahl? Lies die Wörter selbst."
                options: ["achthundertachtzig", "achthundertacht", "achtundachtzig"]
                answer: "achthundertacht"
                option_audio: false
                hints: ["Keine Zehner."]
              - id: l2-s6
                type: text_input
                text: "zweihunderteinundfünfzig"
                say: "Lies das Zahlwort und schreib die Zahl."
                answer: "251"
                hints: ["Fünfzig am Ende."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "dreihundertzweiundsechzig"
                say: "Lies das Zahlwort. Welche Zahl ist das?"
                options: ["326", "362", "3062"]
                answer: "362"
                option_audio: false
              - id: l2-n2
                type: text_input
                text: "siebenhundertvierzehn"
                say: "Lies das Zahlwort und schreib die Zahl."
                answer: "714"
              - id: l2-n3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrem Zahlwort."
                option_audio: false
                pairs:
                  - { left: { text: "960" }, right: { text: "neunhundertsechzig" } }
                  - { left: { text: "906" }, right: { text: "neunhundertsechs" } }
                  - { left: { text: "916" }, right: { text: "neunhundertsechzehn" } }
              - id: l2-n4
                type: true_false
                text: "vierhundertachtunddreißig = 483"
                say: "Lies das Zahlwort und die Zahl. Stimmt das?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "sechshundertneun"
                say: "Lies das Zahlwort und schreib die Zahl."
                answer: "609"
              - id: l2-n6
                type: multiple_choice
                text: "Welches Zahlwort passt zu 175?"
                say: "Welches Zahlwort passt zu der Zahl? Lies die Wörter selbst."
                options: ["hundertfünfundsiebzig", "hundertsiebenundfünfzig", "hundertsiebzig"]
                answer: "hundertfünfundsiebzig"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "Hör zu und schreib die Zahl."
            say: "Fünfhunderteinundneunzig. Schreib die Zahl."
