# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.scale
skill: math.shapes.scale
curriculum: de-DE
language: de
title:
  de: Vergrößern, verkleinern, Maßstab
  en: Enlarging, reducing and scale
summary: >
  Lesson 1 enlarges and reduces rectangles and squares on Kästchenpapier
  by multiplying or dividing every side (2 und 3 Kästchen doppelt so groß:
  4 und 6), shown as Punktefelder with one dot per Kästchen, against the
  mistake of adding the same number to every side; lesson 2 reads simple
  scales on plans (1 : 100, 1 cm sind 500 m), from plan to reality and
  back, and ends with the skill check. Drawing an enlarged figure on
  squared paper waits for a grid drawing task.
metadata:
  year: klasse-4
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.grid-drawing, math.mult-div.all-tables]
  also_practises: [math.length.cm-m]
  vocabulary: { de: [vergrößern, verkleinern, doppelt so groß, halb so groß, Maßstab, Plan, in Wirklichkeit, Kästchen] }
  forms: [text, audio, drawn]
  drawn: [dots, ruler]
  facets: [units]
  misconceptions:
    - id: adds-instead-of-multiplies
      what: Enlarges by adding the same number of Kästchen to every side (2 und 3 become 4 und 5) instead of multiplying every side
      addressed: lesson 1 Learn shows the 4 by 5 rectangle that comes from adding; l1-f1, l1-f2, l1-f4, l1-s2, l1-n2, l1-c1 and l2-c1 offer the added sizes, with feedback in l1-f1; l1-f5 and l1-c3 ask about an added enlargement
    - id: plan-length-is-real-length
      what: "Keeps the plan length as the real length or mixes up the direction of a scale (thinks a plan at 1 : 100 is bigger than reality)"
      addressed: lesson 2 Learn turns 4 cm on the plan into 4 m; l2-f1, l2-s1, l2-n1 and l2-c3 offer the plan length in cm, with feedback in l2-f1; l2-f2 and l2-n4 ask which way the scale goes
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Doppelt so groß, halb so groß", en: "Twice as big, half as big" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "7 · 8 = _"
            say: "Sieben mal acht."
            answer: "56"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viel ist das Dreifache von 4?"
            say: "Wie viel ist das Dreifache von vier?"
            options: ["12", "7", "16"]
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2 Kästchen hoch, 3 Kästchen breit"
            say: "Jeder Punkt steht hier für ein Kästchen auf dem Kästchenpapier. Dieses Rechteck ist zwei Kästchen hoch und drei Kästchen breit."
            show: { drawn: dots, array: [2, 3] }
          - text: "Doppelt so groß: 2 · 2 = 4 hoch, 3 · 2 = 6 breit"
            say: "Wir vergrößern das Rechteck auf das Doppelte. Jede Seite wird doppelt so lang. Zwei mal zwei ist vier, drei mal zwei ist sechs. Das große Rechteck ist vier Kästchen hoch und sechs breit."
            show: { drawn: dots, array: [4, 6] }
          - text: "Jede Seite mal 2"
            say: "Zählst du zu jeder Seite nur zwei Kästchen dazu, wird das Rechteck vier hoch und fünf breit. Dann hat es eine andere Form. Beim Vergrößern nimmst du jede Seite mal zwei. Beim Verkleinern auf die Hälfte teilst du jede Seite durch zwei."
            show: { drawn: dots, array: [4, 5] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Das Rechteck wird doppelt so groß. Wie breit ist es dann?"
                say: "Das Rechteck ist zwei Kästchen hoch und vier breit. Es wird doppelt so groß. Wie breit ist es dann?"
                show: { drawn: dots, array: [2, 4] }
                options: ["8 Kästchen", "6 Kästchen", "4 Kästchen"]
                answer: "8 Kästchen"
                feedback:
                  "6 Kästchen": "Du hast 2 Kästchen dazugezählt. Beim Vergrößern auf das Doppelte rechnest du mal 2: 4 · 2 = 8."
                hints:
                  - "Doppelt so groß heißt: jede Seite mal 2."
                  - "Das Rechteck ist 4 Kästchen breit. 4 · 2 = ?"
                  - "8 Kästchen."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Welches Rechteck ist doppelt so groß?"
                say: "Das Rechteck ist ein Kästchen hoch und drei breit. Welches Rechteck ist doppelt so groß?"
                show: { drawn: dots, array: [1, 3] }
                options:
                  - { drawn: dots, array: [2, 6] }
                  - { drawn: dots, array: [3, 5] }
                  - { drawn: dots, array: [2, 4] }
                answer: "2x6"
                hints:
                  - "Nimm jede Seite mal 2."
                  - "1 · 2 = 2 hoch und 3 · 2 = 6 breit."
                  - "Das Rechteck mit 2 Reihen zu je 6 Punkten."
              - id: l1-f3
                type: multiple_choice
                text: "Ein Quadrat hat 3 Kästchen lange Seiten. Es wird dreimal so groß. Wie lang ist jede Seite?"
                say: "Ein Quadrat hat Seiten, die drei Kästchen lang sind. Es wird dreimal so groß. Wie lang ist jetzt jede Seite?"
                options: ["9 Kästchen", "6 Kästchen", "12 Kästchen"]
                answer: "9 Kästchen"
                hints:
                  - "Dreimal so groß heißt: jede Seite mal 3."
                  - "3 · 3 = ?"
                  - "9 Kästchen."
              - id: l1-f4
                type: multiple_choice
                text: "Ein Rechteck ist 6 Kästchen breit und 4 hoch. Du verkleinerst es auf die Hälfte. Wie groß ist es dann?"
                say: "Ein Rechteck ist sechs Kästchen breit und vier Kästchen hoch. Du verkleinerst es auf die Hälfte. Wie groß ist es dann?"
                options: ["3 breit, 2 hoch", "4 breit, 2 hoch", "12 breit, 8 hoch"]
                answer: "3 breit, 2 hoch"
                hints:
                  - "Auf die Hälfte heißt: jede Seite durch 2."
                  - "6 : 2 = 3 und 4 : 2 = 2."
                  - "3 breit, 2 hoch."
              - id: l1-f5
                type: true_false
                text: "Lukas vergrößert ein Rechteck mit 2 und 5 Kästchen. Sein Rechteck hat 4 und 7 Kästchen. Ist es doppelt so groß?"
                say: "Lukas vergrößert ein Rechteck mit zwei und fünf Kästchen. Sein neues Rechteck hat vier und sieben Kästchen. Ist es doppelt so groß?"
                answer: false
                hints:
                  - "Rechne jede Seite mal 2."
                  - "2 · 2 = 4 passt. Aber 5 · 2 = ?"
                  - "Nein, es müsste 4 und 10 Kästchen haben."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Das Rechteck wird doppelt so groß. Wie hoch ist es dann?"
                say: "Das Rechteck ist drei Kästchen hoch und zwei breit. Es wird doppelt so groß. Wie hoch ist es dann?"
                show: { drawn: dots, array: [3, 2] }
                options: ["6 Kästchen", "5 Kästchen", "4 Kästchen"]
                answer: "6 Kästchen"
                hints: ["Nimm die Höhe mal 2."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Jede Seite wird dreimal so lang. Welches Quadrat passt?"
                say: "Das Quadrat ist zwei Kästchen hoch und zwei breit. Jede Seite wird dreimal so lang. Welches Quadrat passt?"
                show: { drawn: dots, array: [2, 2] }
                options:
                  - { drawn: dots, array: [6, 6] }
                  - { drawn: dots, array: [5, 5] }
                  - { drawn: dots, array: [4, 4] }
                answer: "6x6"
                hints: ["2 · 3 = ?"]
              - id: l1-s3
                type: text_input
                text: "Ein Rechteck ist 8 Kästchen breit. Du verkleinerst es auf die Hälfte. Wie viele Kästchen ist es dann breit?"
                say: "Ein Rechteck ist acht Kästchen breit. Du verkleinerst es auf die Hälfte. Wie viele Kästchen ist es dann breit?"
                answer: "4"
                hints: ["Teile durch 2."]
              - id: l1-s4
                type: true_false
                text: "Beim Vergrößern auf das Doppelte nimmst du jede Seite mal 2."
                say: "Stimmt das? Beim Vergrößern auf das Doppelte nimmst du jede Seite mal zwei."
                answer: true
                hints: ["Denk an das Rechteck mit 2 und 3 Kästchen."]
              - id: l1-s5
                type: multiple_choice
                text: "Ein Dreieck hat eine Seite, die 5 Kästchen lang ist. Es wird doppelt so groß. Wie lang wird diese Seite?"
                say: "Ein Dreieck hat eine Seite, die fünf Kästchen lang ist. Es wird doppelt so groß. Wie lang wird diese Seite?"
                options: ["10 Kästchen", "7 Kästchen", "25 Kästchen"]
                answer: "10 Kästchen"
                hints: ["Auch beim Dreieck gilt: jede Seite mal 2."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Das Rechteck wird doppelt so groß. Wie breit ist es dann?"
                say: "Das Rechteck ist zwei Kästchen hoch und fünf breit. Es wird doppelt so groß. Wie breit ist es dann?"
                show: { drawn: dots, array: [2, 5] }
                options: ["10 Kästchen", "7 Kästchen", "4 Kästchen"]
                answer: "10 Kästchen"
              - id: l1-n2
                type: image_multiple_choice
                text: "Welches Rechteck ist halb so groß?"
                say: "Das Rechteck ist vier Kästchen hoch und zwei breit. Welches Rechteck ist halb so groß?"
                show: { drawn: dots, array: [4, 2] }
                options:
                  - { drawn: dots, array: [2, 1] }
                  - { drawn: dots, array: [3, 1] }
                  - { drawn: dots, array: [2, 2] }
                answer: "2x1"
              - id: l1-n3
                type: text_input
                text: "Ein Quadrat hat 4 Kästchen lange Seiten. Es wird dreimal so groß. Wie viele Kästchen ist eine Seite dann lang?"
                say: "Ein Quadrat hat Seiten, die vier Kästchen lang sind. Es wird dreimal so groß. Wie viele Kästchen ist eine Seite dann lang?"
                answer: "12"
              - id: l1-n4
                type: true_false
                text: "Mia verkleinert ein Rechteck mit 10 und 6 Kästchen auf die Hälfte. Ihr Rechteck hat 5 und 3 Kästchen."
                say: "Stimmt das? Mia verkleinert ein Rechteck mit zehn und sechs Kästchen auf die Hälfte. Ihr Rechteck hat fünf und drei Kästchen."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Aus einem Rechteck mit 3 und 4 Kästchen wird eins mit 6 und 8 Kästchen. Wie wurde es vergrößert?"
                say: "Aus einem Rechteck mit drei und vier Kästchen wird ein Rechteck mit sechs und acht Kästchen. Wie wurde es vergrößert?"
                options: ["auf das Doppelte", "auf das Dreifache", "um 3 Kästchen"]
                answer: "auf das Doppelte"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ein Rechteck ist 3 Kästchen hoch und 7 breit. Es wird doppelt so groß. Wie groß ist es dann?"
            say: "Ein Rechteck ist drei Kästchen hoch und sieben breit. Es wird doppelt so groß. Wie groß ist es dann?"
            options: ["6 hoch, 14 breit", "5 hoch, 9 breit", "6 hoch, 7 breit"]
            answer: "6 hoch, 14 breit"
          - id: l1-c2
            type: text_input
            text: "Ein Rechteck ist 12 Kästchen breit. Du teilst jede Seite durch 3. Wie viele Kästchen ist es dann breit?"
            say: "Ein Rechteck ist zwölf Kästchen breit. Du verkleinerst es und teilst dabei jede Seite durch drei. Wie viele Kästchen ist es dann breit?"
            answer: "4"
          - id: l1-c3
            type: true_false
            text: "Vergrößern heißt: Zu jeder Seite zählst du gleich viele Kästchen dazu."
            say: "Stimmt das? Vergrößern heißt: Zu jeder Seite zählst du gleich viele Kästchen dazu."
            answer: false

  - n: 2
    title: { de: "Der Maßstab auf Plänen", en: "Scale on plans" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ein Rechteck mit 2 und 3 Kästchen wird doppelt so groß. Wie groß wird es?"
            say: "Ein Rechteck mit zwei und drei Kästchen wird doppelt so groß. Wie groß wird es?"
            options: ["4 und 6 Kästchen", "4 und 5 Kästchen"]
            answer: "4 und 6 Kästchen"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Wie viele Zentimeter hat ein Meter?"
            say: "Wie viele Zentimeter hat ein Meter?"
            answer: "100"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Maßstab 1 : 100"
            say: "Auf einem Plan ist alles viel kleiner als in Wirklichkeit. Der Maßstab sagt, wie viel kleiner. Eins zu hundert heißt: Ein Zentimeter auf dem Plan sind hundert Zentimeter in Wirklichkeit, also ein Meter."
          - text: "Auf dem Plan 4 cm, in Wirklichkeit 4 m"
            say: "Auf dem Plan ist das Zimmer vier Zentimeter lang. Im Maßstab eins zu hundert ist jeder Zentimeter ein Meter. Das Zimmer ist also in Wirklichkeit vier Meter lang."
            show: { drawn: ruler, to: 10, length: 4, colour: blue }
          - text: "1 cm entspricht 500 m: 3 cm entsprechen 3 · 500 m = 1500 m"
            say: "Auf einem Wanderplan steht: Ein Zentimeter entspricht fünfhundert Metern. Der Weg zur Hütte ist auf dem Plan drei Zentimeter lang. Drei mal fünfhundert Meter sind tausendfünfhundert Meter."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Maßstab 1 : 100. Auf dem Plan ist die Küche so lang wie der Streifen. Wie lang ist sie wirklich?"
                say: "Der Plan hat den Maßstab eins zu hundert. Auf dem Plan ist die Küche so lang wie der Streifen. Wie lang ist sie in Wirklichkeit?"
                show: { drawn: ruler, to: 10, length: 5 }
                options: ["5 m", "5 cm", "50 m"]
                answer: "5 m"
                feedback:
                  "5 cm": "5 cm ist die Länge auf dem Plan. In Wirklichkeit ist jeder Zentimeter ein Meter."
                  "50 m": "Bei 1 : 100 ist 1 cm auf dem Plan 1 m in Wirklichkeit. 5 cm sind also 5 m."
                hints:
                  - "Lies zuerst ab, wie lang der Streifen ist."
                  - "Er ist 5 cm lang. Jeder Zentimeter ist in Wirklichkeit ein Meter."
                  - "5 m."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was bedeutet der Maßstab 1 : 100?"
                say: "Was bedeutet der Maßstab eins zu hundert?"
                options: ["1 cm auf dem Plan sind 100 cm in Wirklichkeit.", "100 cm auf dem Plan sind 1 cm in Wirklichkeit.", "Der Plan ist 100 cm lang."]
                answer: "1 cm auf dem Plan sind 100 cm in Wirklichkeit."
                hints:
                  - "Ist der Plan größer oder kleiner als die Wirklichkeit?"
                  - "Auf dem Plan ist alles kleiner. Die kleine Zahl gehört zum Plan."
                  - "1 cm auf dem Plan sind 100 cm in Wirklichkeit."
              - id: l2-f3
                type: multiple_choice
                text: "Auf dem Wanderplan entspricht 1 cm 500 m. Der Weg ist 3 cm lang. Wie lang ist er wirklich?"
                say: "Auf dem Wanderplan entspricht ein Zentimeter fünfhundert Metern. Der Weg zum Aussichtsturm ist auf dem Plan drei Zentimeter lang. Wie lang ist er wirklich?"
                options: ["1500 m", "503 m", "150 m"]
                answer: "1500 m"
                hints:
                  - "Jeder Zentimeter sind 500 m."
                  - "3 cm sind 3 · 500 m."
                  - "1500 m."
              - id: l2-f4
                type: text_input
                text: "Maßstab 1 : 100. Das Klassenzimmer ist wirklich 8 m lang. Wie viele cm lang wird es auf dem Plan?"
                say: "Der Plan hat den Maßstab eins zu hundert. Das Klassenzimmer ist in Wirklichkeit acht Meter lang. Wie viele Zentimeter lang zeichnest du es auf den Plan?"
                answer: "8"
                hints:
                  - "Jetzt rechnest du von der Wirklichkeit zum Plan."
                  - "Jeder Meter wird auf dem Plan ein Zentimeter."
                  - "8 cm."
              - id: l2-f5
                type: multiple_choice
                text: "Auf einem Plan entspricht 1 cm 10 m. Der Schulhof ist auf dem Plan 6 cm lang. Wie lang ist er wirklich?"
                say: "Auf einem Plan entspricht ein Zentimeter zehn Metern. Der Schulhof ist auf dem Plan sechs Zentimeter lang. Wie lang ist er wirklich?"
                options: ["60 m", "16 m", "6 m"]
                answer: "60 m"
                hints:
                  - "Jeder Zentimeter sind 10 m."
                  - "6 · 10 m = ?"
                  - "60 m."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Maßstab 1 : 100. Auf dem Plan ist der Flur so lang wie der Streifen. Wie lang ist er wirklich?"
                say: "Der Plan hat den Maßstab eins zu hundert. Auf dem Plan ist der Flur so lang wie der Streifen. Wie lang ist er in Wirklichkeit?"
                show: { drawn: ruler, to: 10, length: 7, colour: blue }
                options: ["7 m", "70 m", "7 cm"]
                answer: "7 m"
                hints: ["Jeder Zentimeter auf dem Plan ist ein Meter."]
              - id: l2-s2
                type: true_false
                text: "Im Maßstab 1 : 100 ist ein 2 m langes Bett auf dem Plan 2 cm lang."
                say: "Stimmt das? Im Maßstab eins zu hundert ist ein zwei Meter langes Bett auf dem Plan zwei Zentimeter lang."
                answer: true
                hints: ["Ein Meter wird auf dem Plan ein Zentimeter."]
              - id: l2-s3
                type: multiple_choice
                text: "Auf dem Stadtplan entspricht 1 cm 200 m. Bis zur Schule sind es auf dem Plan 4 cm. Wie weit ist es wirklich?"
                say: "Auf dem Stadtplan entspricht ein Zentimeter zweihundert Metern. Bis zur Schule sind es auf dem Plan vier Zentimeter. Wie weit ist es wirklich?"
                options: ["800 m", "204 m", "80 m"]
                answer: "800 m"
                hints: ["4 · 200 m = ?"]
              - id: l2-s4
                type: text_input
                text: "Auf dem Plan entspricht 1 cm 10 m. Der Sportplatz ist wirklich 90 m lang. Wie viele cm ist er auf dem Plan lang?"
                say: "Auf dem Plan entspricht ein Zentimeter zehn Metern. Der Sportplatz ist in Wirklichkeit neunzig Meter lang. Wie viele Zentimeter ist er auf dem Plan lang?"
                answer: "9"
                hints: ["Wie oft passen 10 m in 90 m?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Maßstab passt? 1 cm auf dem Plan sind 1 m in Wirklichkeit."
                say: "Ein Zentimeter auf dem Plan sind ein Meter in Wirklichkeit. Welcher Maßstab passt?"
                options: ["1 : 100", "1 : 10", "1 : 1000"]
                answer: "1 : 100"
                hints: ["Wie viele Zentimeter hat ein Meter?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Maßstab 1 : 100. Auf dem Plan ist der Garten so lang wie der Streifen. Wie lang ist er wirklich?"
                say: "Der Plan hat den Maßstab eins zu hundert. Auf dem Plan ist der Garten so lang wie der Streifen. Wie lang ist er in Wirklichkeit?"
                show: { drawn: ruler, to: 15, length: 12, colour: green }
                options: ["12 m", "12 cm", "120 m"]
                answer: "12 m"
              - id: l2-n2
                type: multiple_choice
                text: "Auf der Wanderkarte entspricht 1 cm 500 m. Der Weg zum See ist 4 cm lang. Wie weit ist es?"
                say: "Auf der Wanderkarte entspricht ein Zentimeter fünfhundert Metern. Der Weg zum See ist auf der Karte vier Zentimeter lang. Wie weit ist es?"
                options: ["2000 m", "504 m", "200 m"]
                answer: "2000 m"
              - id: l2-n3
                type: text_input
                text: "Maßstab 1 : 100. Ein Zimmer ist wirklich 5 m breit. Wie viele cm breit ist es auf dem Plan?"
                say: "Der Plan hat den Maßstab eins zu hundert. Ein Zimmer ist in Wirklichkeit fünf Meter breit. Wie viele Zentimeter breit ist es auf dem Plan?"
                answer: "5"
              - id: l2-n4
                type: true_false
                text: "Im Maßstab 1 : 100 ist auf dem Plan alles größer als in Wirklichkeit."
                say: "Stimmt das? Im Maßstab eins zu hundert ist auf dem Plan alles größer als in Wirklichkeit."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Ein Plan hat den Maßstab 1 : 1000. Wie viel ist 1 cm auf dem Plan in Wirklichkeit?"
                say: "Ein Plan hat den Maßstab eins zu tausend. Wie viel ist ein Zentimeter auf dem Plan in Wirklichkeit?"
                options: ["10 m", "1 m", "100 m"]
                answer: "10 m"
                difficulty: stretch

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Das Rechteck wird dreimal so groß. Wie groß ist es dann?"
            say: "Das Rechteck ist drei Kästchen hoch und ein Kästchen breit. Es wird dreimal so groß. Wie groß ist es dann?"
            show: { drawn: dots, array: [3, 1] }
            options: ["9 hoch, 3 breit", "6 hoch, 4 breit", "9 hoch, 1 breit"]
            answer: "9 hoch, 3 breit"
          - id: l2-c2
            type: true_false
            text: "Ein Rechteck hat 6 und 9 Kästchen. Du teilst jede Seite durch 3. Dann hat es 2 und 3 Kästchen."
            say: "Stimmt das? Ein Rechteck hat sechs und neun Kästchen. Du teilst jede Seite durch drei. Dann hat es zwei und drei Kästchen."
            answer: true
          - id: l2-c3
            type: multiple_choice
            text: "Auf dem Plan ist das Wohnzimmer so lang wie der Streifen. Maßstab 1 : 100. Wie lang ist es wirklich?"
            say: "Auf dem Plan ist das Wohnzimmer so lang wie der Streifen. Der Maßstab ist eins zu hundert. Wie lang ist das Wohnzimmer wirklich?"
            show: { drawn: ruler, to: 10, length: 6, colour: green }
            options: ["6 m", "6 cm", "60 m"]
            answer: "6 m"
          - id: l2-c4
            type: text_input
            text: "Auf dem Stadtplan entspricht 1 cm 100 m. Der Weg zum Bäcker ist 7 cm lang. Wie viele Meter ist er wirklich?"
            say: "Auf dem Stadtplan entspricht ein Zentimeter hundert Metern. Der Weg zum Bäcker ist auf dem Plan sieben Zentimeter lang. Wie viele Meter ist er wirklich?"
            answer: "700"
          - id: l2-c5
            type: multiple_choice
            text: "Auf einem Plan entspricht 1 cm 2 m. Ein Beet ist wirklich 10 m lang. Wie lang ist es auf dem Plan?"
            say: "Auf einem Plan entspricht ein Zentimeter zwei Metern. Ein Beet ist in Wirklichkeit zehn Meter lang. Wie lang ist es auf dem Plan?"
            options: ["5 cm", "20 cm", "8 cm"]
            answer: "5 cm"
