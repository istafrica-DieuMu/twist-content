# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.distributive
skill: math.mult-div-larger.distributive
curriculum: de-DE
language: de
title:
  de: Malaufgaben zerlegen
  en: Splitting multiplications
summary: >
  Splitting one factor to multiply bigger numbers. Lesson 1 splits a
  two-digit number into Zehner and Einer (6 · 14 = 6 · 10 + 6 · 4) and
  shows it on a Punktefeld; lesson 2 splits cleverly, also by taking away
  (7 · 19 = 7 · 20 − 7 · 1), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.tens, math.mult-div.derive-facts]
  also_practises: [math.mult-div-larger.tens, math.mult-div.all-tables]
  vocabulary: { de: [zerlegen, Zehner, Einer, Teilaufgabe, Punktefeld] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: multiply-one-part
      what: Multiplies only the Zehner or only the Einer (6 · 14 = 60 + 4)
      addressed: lesson 1 Learn splits the Punktefeld into two parts that are both multiplied; every stage of lesson 1 offers the one-part result as a chip or a true_false
    - id: take-away-one
      what: Takes away 1 instead of the whole row (7 · 19 = 140 − 1)
      addressed: lesson 2 Learn takes away a whole 7, not 1; l2-f2 and l2-c4 give the minus-one result, and the frames l2-f1, l2-s1 and l2-n1 offer it as a chip (149, 159, 299)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Zehner und Einer", en: "Tens and ones" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 · 10 = _"
            say: "Sechs mal zehn."
            answer: "60"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "9 · 30 = _"
            say: "Neun mal dreißig."
            answer: "270"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6 · 14 = 6 · 10 + 6 · 4"
            say: "Sechs mal vierzehn ist schwer. Zerlege die Vierzehn in zehn und vier. Im Punktefeld sind das sechs Reihen mit zehn und sechs Reihen mit vier Punkten."
            show: { drawn: dots, array: [6, 14] }
          - text: "6 · 10 = 60 | 6 · 4 = 24 | 60 + 24 = 84"
            say: "Sechs mal zehn ist sechzig. Sechs mal vier ist vierundzwanzig. Zusammen sind das vierundachtzig."
          - text: "3 · 25 = 3 · 20 + 3 · 5 = 60 + 15 = 75"
            say: "So geht es bei jeder Zahl: Drei mal fünfundzwanzig ist drei mal zwanzig plus drei mal fünf, also sechzig plus fünfzehn, fünfundsiebzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Zerlege in Zehner und Einer."
                say: "Vier mal sechzehn. Rechne vier mal zehn und vier mal sechs, dann zusammen."
                frame: "4 · 10 = _ | 4 · 6 = _ | 4 · 16 = _"
                options: ["40", "24", "64", "46"]
                answer: ["40", "24", "64"]
                hints:
                  - "Zerlege sechzehn in zehn und sechs."
                  - "Vier mal zehn kennst du sofort, vier mal sechs steht in der Viererreihe. Am Ende zählst du beides zusammen."
                  - "40, 24 und 64."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie zerlegst du 5 · 13?"
                say: "Fünf mal dreizehn. Wie zerlegst du die Aufgabe?"
                options: ["5 · 10 + 5 · 3", "5 · 10 + 3", "5 + 10 + 3"]
                answer: "5 · 10 + 5 · 3"
                feedback:
                  "5 · 10 + 3": "Auch die Drei musst du mal fünf nehmen."
                hints:
                  - "Zerlege die Dreizehn in zehn und drei."
                  - "Beide Teile werden mal fünf genommen."
                  - "5 · 10 + 5 · 3."
              - id: l1-f3
                type: text_input
                text: "3 · 17 = _"
                say: "Drei mal siebzehn."
                answer: "51"
                hints:
                  - "Zerlege siebzehn in zehn und sieben."
                  - "Drei mal zehn ist dreißig, drei mal sieben ist einundzwanzig."
                  - "51."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 6 · 12 = 60 + 2"
                say: "Sechs mal zwölf ist sechzig plus zwei. Stimmt das?"
                answer: false
                hints:
                  - "Zerlege zwölf in zehn und zwei."
                  - "Auch die Zwei wird mal sechs genommen."
                  - "Nein. 6 · 12 = 60 + 12 = 72."
              - id: l1-f5
                type: text_input
                text: "In einer Packung sind 24 Buntstifte. Wie viele Buntstifte sind in 4 Packungen?"
                say: "In einer Packung sind vierundzwanzig Buntstifte. Wie viele Buntstifte sind in vier Packungen?"
                answer: "96"
                hints:
                  - "Welche Malaufgabe passt?"
                  - "Vier mal vierundzwanzig. Ich rechne vier mal zwanzig plus vier mal vier."
                  - "96 Buntstifte."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Zerlege in Zehner und Einer."
                say: "Sieben mal dreizehn. Rechne sieben mal zehn und sieben mal drei, dann zusammen."
                frame: "7 · 10 = _ | 7 · 3 = _ | 7 · 13 = _"
                options: ["70", "21", "91", "73"]
                answer: ["70", "21", "91"]
                hints: ["Zähle die beiden Teile zusammen."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie zerlegst du 8 · 15?"
                say: "Acht mal fünfzehn. Wie zerlegst du die Aufgabe?"
                options: ["8 · 10 + 8 · 5", "8 · 10 + 5", "8 · 15 + 10"]
                answer: "8 · 10 + 8 · 5"
                hints: ["Beide Teile werden mal acht genommen."]
              - id: l1-s3
                type: text_input
                text: "4 · 23 = _"
                say: "Vier mal dreiundzwanzig."
                answer: "92"
                hints: ["Vier mal zwanzig und vier mal drei."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 9 · 12 = 90 + 18"
                say: "Neun mal zwölf ist neunzig plus achtzehn. Stimmt das?"
                answer: true
                hints: ["Neun mal zehn und neun mal zwei."]
              - id: l1-s5
                type: text_input
                text: "Im Kino hat jede Reihe 18 Plätze. Wie viele Plätze haben 5 Reihen?"
                say: "Im Kino hat jede Reihe achtzehn Plätze. Wie viele Plätze haben fünf Reihen zusammen?"
                answer: "90"
                hints: ["Fünf mal zehn plus fünf mal acht."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Zerlege in Zehner und Einer."
                say: "Sechs mal siebzehn. Rechne sechs mal zehn und sechs mal sieben, dann zusammen."
                frame: "6 · 10 = _ | 6 · 7 = _ | 6 · 17 = _"
                options: ["60", "42", "102", "67"]
                answer: ["60", "42", "102"]
              - id: l1-n2
                type: multiple_choice
                text: "Wie zerlegst du 3 · 36?"
                say: "Drei mal sechsunddreißig. Wie zerlegst du die Aufgabe?"
                options: ["3 · 30 + 3 · 6", "3 · 30 + 6", "3 · 3 + 3 · 6"]
                answer: "3 · 30 + 3 · 6"
              - id: l1-n3
                type: text_input
                text: "7 · 14 = _"
                say: "Sieben mal vierzehn."
                answer: "98"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 5 · 16 = 50 + 6"
                say: "Fünf mal sechzehn ist fünfzig plus sechs. Stimmt das?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "Eine Schule hat 8 Klassen mit je 26 Kindern. Wie viele Kinder sind es?"
                say: "Eine Schule hat acht Klassen. In jeder Klasse sind sechsundzwanzig Kinder. Wie viele Kinder sind es zusammen?"
                answer: "208"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "4 · 18 = _"
            say: "Vier mal achtzehn."
            answer: "72"
          - id: l1-c2
            type: text_input
            text: "6 · 21 = _"
            say: "Sechs mal einundzwanzig."
            answer: "126"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 3 · 14 = 30 + 12"
            say: "Drei mal vierzehn ist dreißig plus zwölf. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Geschickt zerlegen", en: "Splitting cleverly" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "5 · 14 = _"
            say: "Fünf mal vierzehn."
            answer: "70"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "7 · 20 = _"
            say: "Sieben mal zwanzig."
            answer: "140"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 · 19 = 7 · 20 − 7 · 1 = 140 − 7 = 133"
            say: "Neunzehn ist eins weniger als zwanzig. Rechne sieben mal zwanzig, das ist hundertvierzig. Das ist einmal sieben zu viel. Nimm die ganze Sieben wieder weg: hundertvierzig minus sieben ist hundertdreiunddreißig."
          - text: "2 · 25 = 50 | 4 · 25 = 100"
            say: "Manchmal hilft eine Aufgabe, die du schon kennst. Zwei mal fünfundzwanzig ist fünfzig. Vier mal fünfundzwanzig ist das Doppelte, hundert."
          - text: "7 · 16 | 7 · 29 | 7 · 25"
            say: "Frag dich bei jeder Aufgabe: Zerlege ich in Zehner und Einer, oder rechne ich mit einer runden Zahl und nehme etwas weg?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne mit der runden Zahl."
                say: "Fünf mal neunundzwanzig. Rechne fünf mal dreißig und nimm fünf weg."
                frame: "5 · 30 = _ | 5 · 29 = _"
                options: ["150", "145", "149", "155"]
                answer: ["150", "145"]
                hints:
                  - "Neunundzwanzig ist eins weniger als dreißig."
                  - "Ich rechne erst fünf mal dreißig. Damit habe ich einmal fünf zu viel, das nehme ich wieder weg."
                  - "150 und 145."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? 6 · 19 = 120 − 1"
                say: "Sechs mal neunzehn ist hundertzwanzig minus eins. Stimmt das?"
                answer: false
                hints:
                  - "Wie viel hast du bei sechs mal zwanzig zu viel?"
                  - "Sechs mal zwanzig ist einmal sechs mehr als sechs mal neunzehn, nicht nur eins mehr."
                  - "Nein. 6 · 19 = 120 − 6 = 114."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Weg ist bei 9 · 21 geschickt?"
                say: "Neun mal einundzwanzig. Welcher Weg ist geschickt?"
                options: ["9 · 20 + 9", "9 · 10 + 21", "9 + 21"]
                answer: "9 · 20 + 9"
                hints:
                  - "Einundzwanzig ist eins mehr als zwanzig."
                  - "Neun mal zwanzig ist leicht. Wie viel fehlt dann noch bis neun mal einundzwanzig?"
                  - "9 · 20 + 9."
              - id: l2-f4
                type: text_input
                text: "8 · 25 = _"
                say: "Acht mal fünfundzwanzig."
                answer: "200"
                hints:
                  - "Welche Aufgabe mit fünfundzwanzig kennst du?"
                  - "Vier mal fünfundzwanzig ist hundert."
                  - "200."
              - id: l2-f5
                type: text_input
                text: "4 · 39 = _"
                say: "Vier mal neununddreißig."
                answer: "156"
                hints:
                  - "Neununddreißig ist eins weniger als vierzig."
                  - "Vier mal vierzig ist hundertsechzig. Nimm vier weg."
                  - "156."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne mit der runden Zahl."
                say: "Acht mal neunzehn. Rechne acht mal zwanzig und nimm acht weg."
                frame: "8 · 20 = _ | 8 · 19 = _"
                options: ["160", "152", "159"]
                answer: ["160", "152"]
                hints: ["Nimm eine ganze Acht weg."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? 3 · 49 = 150 − 3"
                say: "Drei mal neunundvierzig ist hundertfünfzig minus drei. Stimmt das?"
                answer: true
                hints: ["Drei mal fünfzig und eine Drei weg."]
              - id: l2-s3
                type: multiple_choice
                text: "Welcher Weg ist bei 7 · 31 geschickt?"
                say: "Sieben mal einunddreißig. Welcher Weg ist geschickt?"
                options: ["7 · 30 + 7", "7 · 30 + 1", "7 + 31"]
                answer: "7 · 30 + 7"
                hints: ["Einunddreißig ist eins mehr als dreißig."]
              - id: l2-s4
                type: text_input
                text: "6 · 25 = _"
                say: "Sechs mal fünfundzwanzig."
                answer: "150"
                hints: ["Zwei mal fünfundzwanzig ist fünfzig."]
              - id: l2-s5
                type: text_input
                text: "5 · 18 = _"
                say: "Fünf mal achtzehn."
                answer: "90"
                hints: ["Rechne fünf mal zwanzig und nimm zweimal fünf weg."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Rechne mit der runden Zahl."
                say: "Sechs mal neunundvierzig. Rechne sechs mal fünfzig und nimm sechs weg."
                frame: "6 · 50 = _ | 6 · 49 = _"
                options: ["300", "294", "299"]
                answer: ["300", "294"]
              - id: l2-n2
                type: true_false
                text: "Stimmt das? 9 · 29 = 270 − 9"
                say: "Neun mal neunundzwanzig ist zweihundertsiebzig minus neun. Stimmt das?"
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Welcher Weg ist bei 4 · 51 geschickt?"
                say: "Vier mal einundfünfzig. Welcher Weg ist geschickt?"
                options: ["4 · 50 + 4", "4 · 50 + 1", "4 · 5 + 1"]
                answer: "4 · 50 + 4"
              - id: l2-n4
                type: text_input
                text: "7 · 39 = _"
                say: "Sieben mal neununddreißig."
                answer: "273"
              - id: l2-n5
                type: text_input
                text: "Ein Fußball kostet 19 €. Wie viel Euro kosten 5 Fußbälle?"
                say: "Ein Fußball kostet neunzehn Euro. Der Sportverein kauft fünf Fußbälle. Wie viel Euro kosten sie zusammen?"
                answer: "95"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "8 · 13 = _"
            say: "Acht mal dreizehn."
            answer: "104"
          - id: l2-c2
            type: text_input
            text: "3 · 29 = _"
            say: "Drei mal neunundzwanzig."
            answer: "87"
          - id: l2-c3
            type: multiple_choice
            text: "Wie zerlegst du 6 · 15?"
            say: "Sechs mal fünfzehn. Wie zerlegst du die Aufgabe?"
            options: ["6 · 10 + 6 · 5", "6 · 10 + 5", "6 + 15"]
            answer: "6 · 10 + 6 · 5"
          - id: l2-c4
            type: true_false
            text: "Stimmt das? 4 · 19 = 80 − 1"
            say: "Vier mal neunzehn ist achtzig minus eins. Stimmt das?"
            answer: false
          - id: l2-c5
            type: text_input
            text: "5 · 26 = _"
            say: "Fünf mal sechsundzwanzig."
            answer: "130"
