# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.written-mult-multi
skill: math.written-mult-div.mult-multi-digit
curriculum: de-DE
language: de
title:
  de: Schriftlich mit zweistelligen Zahlen malnehmen
  en: Written multiplication by two-digit numbers
summary: >
  Written multiplication with a two-digit second factor. Lesson 1 works
  out the two Teilprodukte (23 · 10 and 23 · 4), writes the first one
  shifted a place to the left and adds them stellengerecht; lesson 2 does
  the same with three-digit numbers and a Überschlag, and ends with the
  skill check.
metadata:
  year: klasse-4
  topic: { de: Schriftlich malnehmen, en: Written multiplication }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-mult-div.mult-one-digit, math.mult-div-larger.large-mental]
  also_practises: [math.written-mult-div.mult-one-digit, math.mult-div-larger.estimate]
  vocabulary: { de: [Teilprodukt, stellengerecht, Faktor, Überschlag, verschieben] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: no-shift
      what: Writes the Zehner product without the shift and adds as if it were Einer (24 · 12 = 24 + 48)
      addressed: lesson 1 Learn shifts 23 · 1 a place to the left; every step frame offers the unshifted sum as a chip; l1-f4 and l1-c3 show the mistake
    - id: one-partial-product
      what: Multiplies only by one digit of the second factor
      addressed: "the full-stage frames in both lessons name both Teilprodukte; \"Welche Teilprodukte brauchst du?\" in the some and none stages of lesson 1 and in the skill check"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zweistellig mal zweistellig", en: "Two digits times two digits" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "34 · 3 = _"
            say: "Vierunddreißig mal drei."
            answer: "102"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "45 · 10 = _"
            say: "Fünfundvierzig mal zehn."
            answer: "450"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "23 · 14"
            say: "Dreiundzwanzig mal vierzehn. Du rechnest zuerst mal den Zehner, dann mal den Einer."
          - text: "23 · 10 = 230 | 23 · 4 = 92"
            say: "Dreiundzwanzig mal zehn ist zweihundertdreißig. Schriftlich rechnest du dafür dreiundzwanzig mal eins und schreibst das Ergebnis eine Stelle nach links verschoben. Dann dreiundzwanzig mal vier ist zweiundneunzig."
          - text: "230 + 92 = 322"
            say: "Zum Schluss zählst du die Teilprodukte stellengerecht zusammen: Zweihundertdreißig plus zweiundneunzig ist dreihundertzweiundzwanzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne mit Teilprodukten."
                say: "Zweiunddreißig mal dreizehn. Rechne die Teilprodukte und zähle sie zusammen."
                frame: "32 · 10 = _ | 32 · 3 = _ | 32 · 13 = _"
                options: ["320", "96", "416", "128"]
                answer: ["320", "96", "416"]
                hints:
                  - "Zuerst mal zehn, dann mal drei."
                  - "Dreihundertzwanzig und sechsundneunzig. Zähle sie zusammen."
                  - "320, 96 und 416."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Warum steht das Teilprodukt mit dem Zehner eine Stelle weiter links?"
                say: "Warum schreibst du das Teilprodukt mit dem Zehner eine Stelle weiter links?"
                options: ["Weil du eigentlich mal zehn rechnest.", "Weil es schöner aussieht.", "Weil es die größere Zahl ist."]
                answer: "Weil du eigentlich mal zehn rechnest."
                hints:
                  - "Denk an 23 · 14. Wofür steht die Eins in vierzehn?"
                  - "Die Eins steht für einen Zehner."
                  - "Weil du eigentlich mal zehn rechnest."
              - id: l1-f3
                type: text_input
                text: "21 · 15 = _"
                say: "Einundzwanzig mal fünfzehn."
                answer: "315"
                hints:
                  - "Rechne einundzwanzig mal zehn und einundzwanzig mal fünf."
                  - "Zweihundertzehn und hundertfünf."
                  - "315."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 24 · 12 = 24 + 48 = 72"
                say: "Vierundzwanzig mal zwölf ist vierundzwanzig plus achtundvierzig, also zweiundsiebzig. Stimmt das?"
                answer: false
                hints:
                  - "Was bedeutet die Eins in zwölf?"
                  - "Vierundzwanzig mal zehn ist zweihundertvierzig, nicht vierundzwanzig."
                  - "Nein. 24 · 12 = 240 + 48 = 288."
              - id: l1-f5
                type: text_input
                text: "Ein Kino hat 18 Reihen mit je 25 Plätzen. Wie viele Plätze sind es?"
                say: "Ein Kino hat achtzehn Reihen. In jeder Reihe sind fünfundzwanzig Plätze. Wie viele Plätze sind es zusammen?"
                answer: "450"
                hints:
                  - "Welche Malaufgabe passt?"
                  - "Fünfundzwanzig mal zehn plus fünfundzwanzig mal acht."
                  - "450 Plätze."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne mit Teilprodukten."
                say: "Einundvierzig mal zweiundzwanzig. Rechne die Teilprodukte und zähle sie zusammen."
                frame: "41 · 20 = _ | 41 · 2 = _ | 41 · 22 = _"
                options: ["820", "82", "902", "123"]
                answer: ["820", "82", "902"]
                hints: ["Zuerst mal zwanzig, dann mal zwei."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Teilprodukte brauchst du für 36 · 24?"
                say: "Sechsunddreißig mal vierundzwanzig. Welche Teilprodukte brauchst du?"
                options: ["36 · 20 und 36 · 4", "36 · 2 und 36 · 4", "30 · 24 und 6"]
                answer: "36 · 20 und 36 · 4"
                hints: ["Die Zwei in vierundzwanzig steht für zwei Zehner."]
              - id: l1-s3
                type: text_input
                text: "43 · 12 = _"
                say: "Dreiundvierzig mal zwölf."
                answer: "516"
                hints: ["Vierhundertdreißig und sechsundachtzig."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 15 · 15 = 225"
                say: "Fünfzehn mal fünfzehn ist zweihundertfünfundzwanzig. Stimmt das?"
                answer: true
                hints: ["Hundertfünfzig plus fünfundsiebzig."]
              - id: l1-s5
                type: text_input
                text: "Ein Schulbus fährt jeden Tag 34 km. Wie viele km fährt er in 21 Tagen?"
                say: "Ein Schulbus fährt jeden Tag vierunddreißig Kilometer. Wie viele Kilometer fährt er in einundzwanzig Tagen?"
                answer: "714"
                hints: ["Vierunddreißig mal zwanzig plus vierunddreißig mal eins."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne mit Teilprodukten."
                say: "Zweiundfünfzig mal vierunddreißig. Rechne die Teilprodukte und zähle sie zusammen."
                frame: "52 · 30 = _ | 52 · 4 = _ | 52 · 34 = _"
                options: ["1560", "208", "1768", "364"]
                answer: ["1560", "208", "1768"]
              - id: l1-n2
                type: multiple_choice
                text: "Welche Teilprodukte brauchst du für 47 · 35?"
                say: "Siebenundvierzig mal fünfunddreißig. Welche Teilprodukte brauchst du?"
                options: ["47 · 30 und 47 · 5", "47 · 3 und 47 · 5", "40 · 35 und 7"]
                answer: "47 · 30 und 47 · 5"
              - id: l1-n3
                type: text_input
                text: "26 · 31 = _"
                say: "Sechsundzwanzig mal einunddreißig."
                answer: "806"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 33 · 21 = 693"
                say: "Dreiunddreißig mal einundzwanzig ist sechshundertdreiundneunzig. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "In einer Kiste sind 24 Flaschen. Wie viele Flaschen sind in 15 Kisten?"
                say: "In einer Kiste sind vierundzwanzig Flaschen. Wie viele Flaschen sind in fünfzehn Kisten?"
                answer: "360"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "34 · 12 = _"
            say: "Vierunddreißig mal zwölf."
            answer: "408"
          - id: l1-c2
            type: text_input
            text: "25 · 16 = _"
            say: "Fünfundzwanzig mal sechzehn."
            answer: "400"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 42 · 13 = 42 + 126 = 168"
            say: "Zweiundvierzig mal dreizehn ist zweiundvierzig plus hundertsechsundzwanzig, also hundertachtundsechzig. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Dreistellig mal zweistellig", en: "Three digits times two digits" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "31 · 14 = _"
            say: "Einunddreißig mal vierzehn."
            answer: "434"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "143 · 2 = _"
            say: "Hundertdreiundvierzig mal zwei."
            answer: "286"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "124 · 23"
            say: "Hundertvierundzwanzig mal dreiundzwanzig. Auch hier rechnest du erst mal den Zehner, dann mal den Einer."
          - text: "124 · 20 = 2480 | 124 · 3 = 372"
            say: "Hundertvierundzwanzig mal zwanzig ist zweitausendvierhundertachtzig. Hundertvierundzwanzig mal drei ist dreihundertzweiundsiebzig."
          - text: "2480 + 372 = 2852"
            say: "Zusammen sind das zweitausendachthundertzweiundfünfzig. Ein Überschlag hilft beim Prüfen: Hundert mal zwanzig ist zweitausend, das Ergebnis muss also etwas größer sein."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne mit Teilprodukten."
                say: "Zweihundertdreizehn mal zwölf. Rechne die Teilprodukte und zähle sie zusammen."
                frame: "213 · 10 = _ | 213 · 2 = _ | 213 · 12 = _"
                options: ["2130", "426", "2556", "639"]
                answer: ["2130", "426", "2556"]
                hints:
                  - "Zuerst mal zehn, dann mal zwei."
                  - "Zweitausendeinhundertdreißig und vierhundertsechsundzwanzig. Zähle sie zusammen."
                  - "2130, 426 und 2556."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welcher Überschlag passt zu 198 · 21?"
                say: "Hundertachtundneunzig mal einundzwanzig. Welcher Überschlag passt?"
                options: ["200 · 20", "100 · 20", "200 · 30"]
                answer: "200 · 20"
                hints:
                  - "Runde beide Zahlen."
                  - "Hundertachtundneunzig ist fast zweihundert, einundzwanzig fast zwanzig."
                  - "200 · 20."
              - id: l2-f3
                type: text_input
                text: "142 · 21 = _"
                say: "Hundertzweiundvierzig mal einundzwanzig."
                answer: "2982"
                hints:
                  - "Rechne hundertzweiundvierzig mal zwanzig und hundertzweiundvierzig mal eins."
                  - "Zweitausendachthundertvierzig und hundertzweiundvierzig."
                  - "2982."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 305 · 12 = 3660"
                say: "Dreihundertfünf mal zwölf ist dreitausendsechshundertsechzig. Stimmt das?"
                answer: true
                hints:
                  - "Rechne die Teilprodukte: dreihundertfünf mal zehn und dreihundertfünf mal zwei."
                  - "Dreitausendfünfzig und sechshundertzehn."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: text_input
                text: "Ein Flugzeug hat 186 Plätze. Wie viele Plätze haben 12 Flugzeuge?"
                say: "Ein Flugzeug hat hundertsechsundachtzig Plätze. Wie viele Plätze haben zwölf Flugzeuge zusammen?"
                answer: "2232"
                hints:
                  - "Welche Malaufgabe passt?"
                  - "Hundertsechsundachtzig mal zehn plus hundertsechsundachtzig mal zwei."
                  - "2232 Plätze."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne mit Teilprodukten."
                say: "Dreihunderteinundzwanzig mal dreiundzwanzig. Rechne die Teilprodukte und zähle sie zusammen."
                frame: "321 · 20 = _ | 321 · 3 = _ | 321 · 23 = _"
                options: ["6420", "963", "7383", "1605"]
                answer: ["6420", "963", "7383"]
                hints: ["Zuerst mal zwanzig, dann mal drei."]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Überschlag passt zu 412 · 19?"
                say: "Vierhundertzwölf mal neunzehn. Welcher Überschlag passt?"
                options: ["400 · 20", "400 · 10", "500 · 20"]
                answer: "400 · 20"
                hints: ["Runde beide Zahlen."]
              - id: l2-s3
                type: text_input
                text: "231 · 13 = _"
                say: "Zweihunderteinunddreißig mal dreizehn."
                answer: "3003"
                hints: ["Zweitausenddreihundertzehn und sechshundertdreiundneunzig."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 150 · 24 = 3500"
                say: "Hundertfünfzig mal vierundzwanzig ist dreitausendfünfhundert. Stimmt das?"
                answer: false
                hints: ["Dreitausend und sechshundert."]
              - id: l2-s5
                type: text_input
                text: "Ein Buch hat 248 Seiten. Wie viele Seiten haben 15 Bücher?"
                say: "Ein Buch hat zweihundertachtundvierzig Seiten. Wie viele Seiten haben fünfzehn solche Bücher?"
                answer: "3720"
                hints: ["Zweihundertachtundvierzig mal zehn und mal fünf."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Rechne mit Teilprodukten."
                say: "Vierhundertfünf mal zweiunddreißig. Rechne die Teilprodukte und zähle sie zusammen."
                frame: "405 · 30 = _ | 405 · 2 = _ | 405 · 32 = _"
                options: ["12150", "810", "12960", "2025"]
                answer: ["12150", "810", "12960"]
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Überschlag passt zu 589 · 31?"
                say: "Fünfhundertneunundachtzig mal einunddreißig. Welcher Überschlag passt?"
                options: ["600 · 30", "500 · 30", "600 · 40"]
                answer: "600 · 30"
              - id: l2-n3
                type: text_input
                text: "123 · 45 = _"
                say: "Hundertdreiundzwanzig mal fünfundvierzig."
                answer: "5535"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 214 · 22 = 4708"
                say: "Zweihundertvierzehn mal zweiundzwanzig ist viertausendsiebenhundertacht. Stimmt das?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "Eine Schule kauft 36 Stühle zu je 125 €. Wie viel Euro kostet das?"
                say: "Eine Schule kauft sechsunddreißig Stühle. Jeder kostet hundertfünfundzwanzig Euro. Wie viel Euro kostet das zusammen?"
                answer: "4500"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "27 · 14 = _"
            say: "Siebenundzwanzig mal vierzehn."
            answer: "378"
          - id: l2-c2
            type: text_input
            text: "132 · 24 = _"
            say: "Hundertzweiunddreißig mal vierundzwanzig."
            answer: "3168"
          - id: l2-c3
            type: multiple_choice
            text: "Welche Teilprodukte brauchst du für 58 · 43?"
            say: "Achtundfünfzig mal dreiundvierzig. Welche Teilprodukte brauchst du?"
