            text: "Stimmt das? 216 · 15 = 3240"
            say: "Zweihundertsechzehn mal fünfzehn ist dreitausendzweihundertvierzig. Stimmt das?"
            answer: true
          - id: l2-c5
            type: text_input
            text: "Ein Hofladen verkauft jede Woche 115 kg Kartoffeln. Wie viele kg sind das in 24 Wochen?"
            say: "Ein Hofladen verkauft jede Woche hundertfünfzehn Kilogramm Kartoffeln. Wie viele Kilogramm sind das in vierundzwanzig Wochen?"
            answer: "2760"
