# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.hundreds
skill: math.numbers-to-1000.hundreds
curriculum: de-DE
language: de
title:
  de: Hunderter bündeln
  en: Bundling hundreds
summary: >
  The first lesson of Klasse 3 opens the Tausenderraum: ten tens make a
  hundred, as ten ones made a ten. Lesson 1 bundles tens into hundreds and
  counts hundreds; lesson 2 shows three-digit numbers with Hunderter,
  Zehner and Einer, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-100.place-value]
  also_practises: [math.numbers-to-100.bundle-tens]
  vocabulary: { de: [Hunderter, Hunderterplatte, Zehnerstange, Einerwürfel, bündeln, tausend] }
  forms: [drawn, text, audio]
  drawn: [base-ten]
  facets: []
  misconceptions:
    - id: flat-is-ten
      what: Counts a hundred flat as ten, or as one
      addressed: Learn builds a flat from ten rods; feedback on such answers says "Eine Platte sind zehn Zehner, also hundert"
    - id: ten-hundreds
      what: Does not see that ten hundreds make a thousand
      addressed: lesson 1 ends at 1000 with ten flats
    - id: zero-tens
      what: Writes 305 as 35 when there are no tens
      addressed: lesson 2 sets blocks without rods and asks for the number
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehn Zehner sind ein Hunderter, en: Ten tens make a hundred }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, tens: 4, ones: 6 }
            options: ["46", "64", "10"]
            answer: "46"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Einer sind ein Zehner?"
            options: ["1", "10", "100"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "10 Zehner"
            say: "Zehn Einerwürfel sind eine Zehnerstange. Jetzt legen wir zehn Zehnerstangen nebeneinander: zehn, zwanzig, dreißig, bis hundert."
            show: { drawn: base-ten, tens: 10, ones: 0 }
          - text: "1 Hunderter = 100"
            say: "Zehn Zehner bündeln wir zu einer Hunderterplatte. Eine Platte ist hundert."
            show: { drawn: base-ten, hundreds: 1, tens: 0, ones: 0 }
          - text: "100, 200, 300 ... 1000"
            say: "Jetzt zählen wir in Hundertern: hundert, zweihundert, dreihundert, bis neunhundert."
            show: { drawn: base-ten, hundreds: 3, tens: 0, ones: 0 }
          - text: "10 Hunderter = 1000"
            say: "Zehn Hunderterplatten sind tausend."
            show: { drawn: base-ten, hundreds: 10, tens: 0, ones: 0 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, hundreds: 2, tens: 0, ones: 0 }
                options: ["2", "20", "200"]
                answer: "200"
                feedback:
                  "20": "Eine Platte sind zehn Zehner, also hundert, nicht zehn."
                  "2": "Jede Platte ist hundert. Zähl in Hundertern."
                hints:
                  - "Jede Platte ist hundert."
                  - "Zähl: hundert, zweihundert."
                  - "Es sind 200."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Zehner sind ein Hunderter?"
                options: ["10", "100", "1"]
                answer: "10"
                hints:
                  - "Zehn, zwanzig, ... Wie oft bis hundert?"
                  - "Zähl die Zehnerstangen in einer Platte."
                  - "Zehn Zehner sind ein Hunderter."
              - id: l1-f3
                type: multiple_choice
                text: "100, 200, 300, _"
                say: "Zähl in Hundertern weiter: hundert, zweihundert, dreihundert. Was kommt dann?"
                options: ["301", "310", "400"]
                answer: "400"
                hints:
                  - "Jeder Schritt ist hundert."
                  - "Nach drei Hundertern kommen vier Hunderter."
                  - "Das ist 400."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 10 Zehnerstangen sind so viel wie 1 Hunderterplatte."
                answer: true
                hints:
                  - "Wie viel ist eine Zehnerstange?"
                  - "Zehn mal zehn Würfel."
                  - "Ja, beides ist hundert."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, hundreds: 5, tens: 0, ones: 0 }
                options: ["5", "50", "500"]
                answer: "500"
                hints:
                  - "Zähl die Platten."
                  - "Hundert, zweihundert, ... fünfhundert."
                  - "Es sind 500."
              - id: l1-f6
                type: multiple_choice
                text: "Wie viele Hunderter sind 1000?"
                options: ["10", "100", "1"]
                answer: "10"
                hints:
                  - "Zähl in Hundertern bis tausend."
                  - "Hundert, zweihundert, ... neunhundert, tausend."
                  - "Zehn Hunderter sind 1000."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, hundreds: 4, tens: 0, ones: 0 }
                options: ["40", "400", "4"]
                answer: "400"
                hints: ["Jede Platte ist hundert."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie viele Zehner sind 300?"
                options: ["3", "30", "300"]
                answer: "30"
                hints: ["Ein Hunderter sind zehn Zehner."]
              - id: l1-s3
                type: multiple_choice
                text: "900, 800, 700, _"
                say: "Zähl rückwärts in Hundertern: neunhundert, achthundert, siebenhundert. Was kommt dann?"
                options: ["600", "690", "699"]
                answer: "600"
                hints: ["Immer hundert weniger."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Wo sind 300?"
                options:
                  - { drawn: base-ten, hundreds: 0, tens: 3, ones: 0 }
                  - { drawn: base-ten, hundreds: 3, tens: 0, ones: 0 }
                  - { drawn: base-ten, hundreds: 0, tens: 0, ones: 3 }
                answer: "300"
                hints: ["300 sind drei Hunderter."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? 20 Zehner sind 2000."
                answer: false
                hints: ["Zehn Zehner sind hundert."]
              - id: l1-s6
                type: text_input
                text: "Wie viel sind 7 Hunderter?"
                answer: "700"
                hints: ["Zähl in Hundertern."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, hundreds: 6, tens: 0, ones: 0 }
                options: ["6", "60", "600"]
                answer: "600"
              - id: l1-n2
                type: multiple_choice
                text: "Wie viele Zehner sind 500?"
                options: ["5", "50", "500"]
                answer: "50"
              - id: l1-n3
                type: multiple_choice
                text: "500, 600, 700, _"
                say: "Zähl in Hundertern weiter: fünfhundert, sechshundert, siebenhundert. Was kommt dann?"
                options: ["701", "800", "710"]
                answer: "800"
              - id: l1-n4
                type: text_input
                text: "Wie viel sind 9 Hunderter?"
                answer: "900"
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 10 Hunderter sind 1000."
                answer: true
              - id: l1-n6
                type: image_multiple_choice
                text: "Wo sind 200?"
                options:
                  - { drawn: base-ten, hundreds: 2, tens: 0, ones: 0 }
                  - { drawn: base-ten, hundreds: 0, tens: 2, ones: 0 }
                  - { drawn: base-ten, hundreds: 1, tens: 2, ones: 0 }
                answer: "200"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, hundreds: 3, tens: 0, ones: 0 }
            options: ["3", "30", "300"]
            answer: "300"
          - id: l1-c2
            type: multiple_choice
            text: "Wie viele Zehner sind 200?"
            options: ["2", "20", "200"]
            answer: "20"
          - id: l1-c3
            type: text_input
            text: "Wie viel sind 8 Hunderter?"
            answer: "800"

  - n: 2
    title: { de: "Hunderter, Zehner und Einer", en: "Hundreds, tens and ones" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, hundreds: 4, tens: 0, ones: 0 }
            options: ["4", "40", "400"]
            answer: "400"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viele Zehner sind ein Hunderter?"
            say: "Wie viele Zehnerstangen brauchst du für eine Hunderterplatte?"
            options: ["1", "10", "100"]
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2 H, 3 Z, 5 E"
            say: "Zwei Hunderterplatten, drei Zehnerstangen und fünf Einerwürfel. Wir zählen zuerst die Hunderter, dann die Zehner, dann die Einer."
            show: { drawn: base-ten, hundreds: 2, tens: 3, ones: 5 }
          - text: "200 + 30 + 5 = 235"
            say: "Zweihundert, zweihundertzehn, zweihundertzwanzig, zweihundertdreißig, und fünf Einer: zweihundertfünfunddreißig."
            show: { drawn: base-ten, hundreds: 2, tens: 3, ones: 5 }
          - text: "305"
            say: "Hier gibt es keine Zehnerstangen: drei Hunderter und fünf Einer. Das ist dreihundertfünf. Bei den Zehnern schreiben wir eine Null."
            show: { drawn: base-ten, hundreds: 3, tens: 0, ones: 5 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, hundreds: 1, tens: 4, ones: 2 }
                options: ["142", "124", "7"]
                answer: "142"
                feedback:
                  "7": "Platten, Stangen und Würfel sind verschieden viel wert. Zähl Hunderter, Zehner und Einer."
                hints:
                  - "Zähl zuerst die Hunderter."
                  - "Ein Hunderter, vier Zehner, zwei Einer."
                  - "100 + 40 + 2 = 142."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Wie viele Hunderter, Zehner und Einer?"
                show: { drawn: base-ten, hundreds: 3, tens: 2, ones: 6 }
                frame: "_ H, _ Z, _ E"
                options: ["2", "3", "6", "326"]
                answer: ["3", "2", "6"]
                hints:
                  - "Platten sind Hunderter, Stangen Zehner, Würfel Einer."
                  - "Zähl jede Sorte."
                  - "3 H, 2 Z, 6 E."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, hundreds: 4, tens: 0, ones: 7 }
                options: ["47", "407", "470"]
                answer: "407"
                feedback:
                  "47": "Es gibt vier Hunderter. Bei den Zehnern steht eine Null."
                  "470": "Die Würfel sind Einer, keine Zehner."
                hints:
                  - "Gibt es Zehnerstangen?"
                  - "Vier Hunderter, keine Zehner, sieben Einer."
                  - "Das ist 407."
              - id: l2-f4
                type: image_multiple_choice
                text: "Wo sind 251?"
                options:
                  - { drawn: base-ten, hundreds: 2, tens: 1, ones: 5 }
                  - { drawn: base-ten, hundreds: 2, tens: 5, ones: 1 }
                  - { drawn: base-ten, hundreds: 1, tens: 5, ones: 2 }
                answer: "251"
                hints:
                  - "251: 2 Hunderter, 5 Zehner, 1 Einer."
                  - "Such zwei Platten und fünf Stangen."
                  - "Zwei Platten, fünf Stangen, ein Würfel."
              - id: l2-f5
                type: text_input
                text: "500 + 60 + 3 = _"
                answer: "563"
                hints:
                  - "Hunderter, Zehner, Einer nebeneinander."
                  - "5 Hunderter, 6 Zehner, 3 Einer."
                  - "Das ist 563."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? 6 Hunderter und 4 Einer sind 64."
                answer: false
                hints:
                  - "Sechs Hunderter sind sechshundert."
                  - "Es gibt keine Zehner. Dort steht eine Null."
                  - "Nein, es sind 604."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, hundreds: 2, tens: 6, ones: 0 }
                options: ["26", "206", "260"]
                answer: "260"
                hints: ["Keine Einer: dort steht 0."]
              - id: l2-s2
                type: fill_in_blank
                text: "Wie viele Hunderter, Zehner und Einer?"
                show: { drawn: base-ten, hundreds: 5, tens: 1, ones: 8 }
                frame: "_ H, _ Z, _ E"
                options: ["1", "5", "8", "518"]
                answer: ["5", "1", "8"]
                hints: ["Platten, Stangen, Würfel."]
              - id: l2-s3
                type: text_input
                text: "700 + 20 + 9 = _"
                answer: "729"
                hints: ["7 H, 2 Z, 9 E."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Wo sind 308?"
                options:
                  - { drawn: base-ten, hundreds: 3, tens: 8, ones: 0 }
                  - { drawn: base-ten, hundreds: 3, tens: 0, ones: 8 }
                  - { drawn: base-ten, hundreds: 0, tens: 3, ones: 8 }
                answer: "308"
                hints: ["308 hat keine Zehner."]
              - id: l2-s5
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, hundreds: 6, tens: 3, ones: 3 }
                options: ["633", "336", "12"]
                answer: "633"
                hints: ["Erst die Platten."]
              - id: l2-s6
                type: true_false
                text: "Stimmt das? 800 + 10 + 5 = 815"
                answer: true
                hints: ["8 H, 1 Z, 5 E."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, hundreds: 3, tens: 7, ones: 4 }
                options: ["374", "473", "14"]
                answer: "374"
              - id: l2-n2
                type: fill_in_blank
                text: "Wie viele Hunderter, Zehner und Einer?"
                show: { drawn: base-ten, hundreds: 4, tens: 0, ones: 2 }
                frame: "_ H, _ Z, _ E"
                options: ["0", "2", "4", "42"]
                answer: ["4", "0", "2"]
              - id: l2-n3
                type: text_input
                text: "900 + 40 + 1 = _"
                answer: "941"
              - id: l2-n4
                type: image_multiple_choice
                text: "Wo sind 160?"
                options:
                  - { drawn: base-ten, hundreds: 1, tens: 6, ones: 0 }
                  - { drawn: base-ten, hundreds: 1, tens: 0, ones: 6 }
                  - { drawn: base-ten, hundreds: 6, tens: 1, ones: 0 }
                answer: "160"
              - id: l2-n5
                type: text_input
                text: "300 + 5 = _"
                answer: "305"
              - id: l2-n6
                type: true_false
                text: "Stimmt das? 2 Hunderter, 9 Zehner und 9 Einer sind 299."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, hundreds: 2, tens: 8, ones: 1 }
            options: ["281", "182", "11"]
            answer: "281"
          - id: l2-c2
            type: fill_in_blank
            text: "Wie viele Hunderter, Zehner und Einer?"
            show: { drawn: base-ten, hundreds: 6, tens: 4, ones: 0 }
            frame: "_ H, _ Z, _ E"
            options: ["0", "4", "6", "64"]
            answer: ["6", "4", "0"]
          - id: l2-c3
            type: text_input
            text: "400 + 30 + 8 = _"
            answer: "438"
          - id: l2-c4
            type: image_multiple_choice
            text: "Wo sind 503?"
            options:
              - { drawn: base-ten, hundreds: 5, tens: 3, ones: 0 }
              - { drawn: base-ten, hundreds: 5, tens: 0, ones: 3 }
              - { drawn: base-ten, hundreds: 3, tens: 0, ones: 5 }
            answer: "503"
          - id: l2-c5
            type: multiple_choice
            text: "Wie viele Zehner sind 600?"
            options: ["6", "60", "600"]
            answer: "60"
