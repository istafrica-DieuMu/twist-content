# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.neighbour-facts
skill: math.add-sub-to-20.neighbour-facts
curriculum: de-DE
language: de
title:
  de: Verdopplungs- und Nachbaraufgaben
  en: Doubles and near doubles
summary: >
  Working out a harder sum from an easy one you know. Lesson 1 uses the
  Verdopplungsaufgaben: 6 + 7 is one more than 6 + 6. Lesson 2 uses
  Nachbaraufgaben one more or one less in both directions (7 + 8 from
  8 + 8, 5 + 9 from 5 + 10), and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.add-to-10, math.numbers-to-20.double-halve-to-20]
  also_practises: [math.add-sub-to-20.commutative]
  vocabulary: { de: [verdoppeln, Verdopplungsaufgabe, Nachbaraufgabe, eins mehr, eins weniger] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld]
  facets: []
  misconceptions:
    - id: adjust-wrong-way
      what: Uses the double but corrects the wrong way (7 + 8 from 8 + 8, then adds one)
      addressed: lesson 2 Learn shows eins weniger (7 + 8 from 8 + 8) and eins mehr (9 + 8 from 8 + 8) on the Zwanzigerfeld; feedback names the direction in the full stage
    - id: double-two-away
      what: Takes a double two away (5 + 5 for 6 + 7)
      addressed: hints say to double one of the two numbers; options include a double two away, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Fast verdoppeln, en: Near doubles }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 + 6 = _"
            say: "Verdopple sechs."
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "8 + 8 = _"
            say: "Verdopple acht."
            answer: "16"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6 + 6 = 12"
            say: "Die Verdopplungsaufgaben kennst du. Sechs plus sechs ist zwölf."
            show: { drawn: zwanzigerfeld, filled: [6, 6] }
          - text: "6 + 7 = 13"
            say: "Bei sechs plus sieben ist unten nur ein Punkt mehr. Also ist es eins mehr als sechs plus sechs: dreizehn."
            show: { drawn: zwanzigerfeld, filled: [6, 7] }
          - text: "6 + 7 = 6 + 6 + 1"
            say: "Liegen zwei Zahlen nebeneinander, verdopple die kleinere und rechne eins dazu. Die Verdopplungsaufgabe hilft bei der Nachbaraufgabe."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Verdopplung hilft bei 5 + 6?"
                say: "Fünf plus sechs. Welche Verdopplungsaufgabe hilft dir?"
                options: ["5 + 5", "4 + 4", "8 + 8"]
                answer: "5 + 5"
                feedback:
                  "4 + 4": "Vier kommt in der Aufgabe nicht vor. Verdopple die kleinere Zahl, die Fünf."
                hints:
                  - "Fünf und sechs liegen nebeneinander."
                  - "Verdopple die kleinere Zahl."
                  - "5 + 5."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Nimm die Verdopplung."
                say: "Sieben plus acht. Nimm sieben plus sieben."
                frame: "7 + 8 = 7 + 7 + _ = _"
                options: ["1", "2", "14", "15"]
                answer: ["1", "15"]
                hints:
                  - "Acht ist eins mehr als sieben."
                  - "Sieben plus sieben ist vierzehn."
                  - "14 + 1 = 15."
              - id: l1-f3
                type: text_input
                text: "4 + 5 = _"
                say: "Vier plus fünf. Denk an vier plus vier."
                answer: "9"
                hints:
                  - "Vier plus vier ist acht."
                  - "Fünf ist eins mehr als vier."
                  - "8 + 1 = 9."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 8 + 9 ist eins mehr als 8 + 8."
                say: "Acht plus neun ist eins mehr als acht plus acht. Stimmt das?"
                answer: true
                hints:
                  - "Neun ist eins mehr als acht."
                  - "Dann ist auch das Ergebnis eins mehr."
                  - "Ja."
              - id: l1-f5
                type: multiple_choice
                text: "3 + 3 = 6. Was ist 3 + 4?"
                say: "Drei plus drei ist sechs. Was ist drei plus vier?"
                options: ["5", "7", "8"]
                answer: "7"
                feedback:
                  "5": "Vier ist eins mehr als drei. Das Ergebnis wird eins mehr, nicht weniger."
                hints:
                  - "Vier ist eins mehr als drei."
                  - "Eins mehr als sechs."
                  - "7."
              - id: l1-f6
                type: text_input
                text: "9 + 10 = _"
                say: "Neun plus zehn. Nimm eine Verdopplung."
                answer: "19"
                hints:
                  - "Neun plus neun ist achtzehn."
                  - "Zehn ist eins mehr als neun."
                  - "19."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Verdopplung hilft bei 8 + 9?"
                say: "Acht plus neun. Welche Verdopplungsaufgabe hilft dir?"
                options: ["8 + 8", "7 + 7", "10 + 10"]
                answer: "8 + 8"
                hints: ["Verdopple die kleinere Zahl."]
              - id: l1-s2
                type: fill_in_blank
                text: "Nimm die Verdopplung."
                say: "Vier plus fünf. Nimm vier plus vier."
                frame: "4 + 5 = 4 + 4 + _ = _"
                options: ["1", "2", "8", "9"]
                answer: ["1", "9"]
                hints: ["Um wie viel ist fünf größer als vier?"]
              - id: l1-s3
                type: text_input
                text: "5 + 6 = _"
                say: "Fünf plus sechs."
                answer: "11"
                hints: ["Fang mit fünf plus fünf an."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 7 + 8 = 16"
                say: "Sieben plus acht ist sechzehn. Stimmt das?"
                answer: false
                hints: ["Rechne mit sieben plus sieben."]
              - id: l1-s5
                type: multiple_choice
                text: "2 + 2 = 4. Was ist 2 + 3?"
                say: "Zwei plus zwei ist vier. Was ist zwei plus drei?"
                options: ["3", "5", "6"]
                answer: "5"
                hints: ["Ist drei eins mehr oder eins weniger als zwei?"]
              - id: l1-s6
                type: text_input
                text: "10 + 9 = _"
                say: "Zehn plus neun."
                answer: "19"
                hints: ["Nimm neun plus neun."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Verdopplung hilft bei 3 + 4?"
                say: "Drei plus vier. Welche Verdopplungsaufgabe hilft dir?"
                options: ["3 + 3", "2 + 2", "5 + 5"]
                answer: "3 + 3"
              - id: l1-n2
                type: fill_in_blank
                text: "Nimm die Verdopplung."
                say: "Acht plus neun. Nimm acht plus acht."
                frame: "8 + 9 = 8 + 8 + _ = _"
                options: ["1", "2", "16", "17"]
                answer: ["1", "17"]
              - id: l1-n3
                type: text_input
                text: "4 + 3 = _"
                say: "Vier plus drei."
                answer: "7"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 9 + 10 = 19"
                say: "Neun plus zehn ist neunzehn. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "7 + 8 = _"
                say: "Sieben plus acht."
                answer: "15"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Verdopplung hilft bei 9 + 10?"
            say: "Neun plus zehn. Welche Verdopplungsaufgabe hilft dir?"
            options: ["9 + 9", "8 + 8", "5 + 5"]
            answer: "9 + 9"
          - id: l1-c2
            type: text_input
            text: "3 + 4 = _"
            say: "Drei plus vier."
            answer: "7"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 6 + 7 = 12"
            say: "Sechs plus sieben ist zwölf. Stimmt das?"
            answer: false

  - n: 2
    title: { de: Eins mehr oder eins weniger, en: One more or one less }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "7 + 8 = _"
            say: "Sieben plus acht. Nimm sieben plus sieben."
            answer: "15"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "5 + 10 = _"
            say: "Fünf plus zehn."
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 + 8 = 8 + 8 − 1 = 15"
            say: "Sieben plus acht geht auch von acht plus acht aus. Sieben ist eins weniger als acht, also ist das Ergebnis eins weniger als sechzehn: fünfzehn."
            show: { drawn: zwanzigerfeld, filled: [7, 8] }
          - text: "9 + 8 = 8 + 8 + 1 = 17"
            say: "Und andersherum: neun plus acht. Neun ist eins mehr als acht, also ist das Ergebnis eins mehr als sechzehn: siebzehn."
            show: { drawn: zwanzigerfeld, filled: [9, 8] }
          - text: "5 + 9 = 5 + 10 − 1 = 14"
            say: "Plus zehn ist leicht. Fünf plus neun ist eins weniger als fünf plus zehn. Fünf plus zehn ist fünfzehn, also ist fünf plus neun vierzehn."
            show: { drawn: zwanzigerfeld, filled: [5, 9] }
          - text: "eine Zahl eins mehr → Ergebnis eins mehr"
            say: "Prüf immer die Richtung: Ist eine Zahl eins größer als in der leichten Aufgabe, ist das Ergebnis eins größer. Ist sie eins kleiner, nimmst du eins weg."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Nimm die Aufgabe mit 10."
                say: "Sechs plus neun. Nimm sechs plus zehn."
                frame: "6 + 9 = 6 + 10 − _ = _"
                options: ["1", "2", "15", "16"]
                answer: ["1", "15"]
                hints:
                  - "Neun ist eins weniger als zehn."
                  - "Sechs plus zehn ist sechzehn."
                  - "16 − 1 = 15."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "9 + 9 = 18. Was ist 8 + 9?"
                say: "Neun plus neun ist achtzehn. Was ist acht plus neun?"
                options: ["17", "19", "16"]
                answer: "17"
                feedback:
                  "19": "Acht ist eins weniger als neun. Also ist das Ergebnis eins weniger: Nimm eins weg."
                hints:
                  - "Ist acht eins mehr oder eins weniger als neun?"
                  - "Eins weniger, also nimm eins weg."
                  - "18 − 1 = 17."
              - id: l2-f3
                type: text_input
                text: "4 + 9 = _"
                say: "Vier plus neun. Denk an vier plus zehn."
                answer: "13"
                hints:
                  - "Vier plus zehn ist vierzehn."
                  - "Neun ist eins weniger als zehn."
                  - "13."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 6 + 7 = 7 + 7 − 1"
                say: "Sechs plus sieben ist sieben plus sieben minus eins. Stimmt das?"
                answer: true
                hints:
                  - "Sechs ist eins weniger als sieben."
                  - "Sieben plus sieben, dann eins weg."
                  - "Ja."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Aufgabe hilft am meisten bei 8 + 9?"
                say: "Acht plus neun. Welche leichte Aufgabe hilft am meisten?"
                options: ["8 + 8 = 16", "4 + 4 = 8", "5 + 5 = 10"]
                answer: "8 + 8 = 16"
                hints:
                  - "Such eine Verdopplung mit einer der beiden Zahlen."
                  - "Acht und neun liegen nebeneinander."
                  - "8 + 8 = 16, dann eins mehr."
              - id: l2-f6
                type: text_input
                text: "7 + 9 = _"
                say: "Sieben plus neun."
                answer: "16"
                hints:
                  - "Nimm sieben plus zehn."
                  - "Siebzehn, dann eins weniger."
                  - "16."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Nimm die Aufgabe mit 10."
                say: "Drei plus neun. Nimm drei plus zehn."
                frame: "3 + 9 = 3 + 10 − _ = _"
                options: ["1", "2", "12", "13"]
                answer: ["1", "12"]
                hints: ["Um wie viel ist neun kleiner als zehn?"]
              - id: l2-s2
                type: multiple_choice
                text: "10 + 10 = 20. Was ist 9 + 10?"
                say: "Zehn plus zehn ist zwanzig. Was ist neun plus zehn?"
                options: ["19", "21", "18"]
                answer: "19"
                hints: ["Ist neun eins mehr oder eins weniger als zehn?"]
              - id: l2-s3
                type: text_input
                text: "8 + 9 = _"
                say: "Acht plus neun."
                answer: "17"
                hints: ["Nimm eine Verdopplung, die daneben liegt."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 9 + 3 = 10 + 3 + 1"
                say: "Neun plus drei ist zehn plus drei plus eins. Stimmt das?"
                answer: false
                hints: ["Ist neun eins mehr oder eins weniger als zehn?"]
              - id: l2-s5
                type: text_input
                text: "2 + 9 = _"
                say: "Zwei plus neun."
                answer: "11"
                hints: ["Denk an zwei plus zehn."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Nimm die Aufgabe mit 10."
                say: "Acht plus neun. Nimm acht plus zehn."
                frame: "8 + 9 = 8 + 10 − _ = _"
                options: ["1", "2", "17", "18"]
                answer: ["1", "17"]
              - id: l2-n2
                type: multiple_choice
                text: "6 + 6 = 12. Was ist 5 + 6?"
                say: "Sechs plus sechs ist zwölf. Was ist fünf plus sechs?"
                options: ["11", "13", "10"]
                answer: "11"
              - id: l2-n3
                type: text_input
                text: "9 + 7 = _"
                say: "Neun plus sieben."
                answer: "16"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 9 + 8 = 9 + 9 − 1"
                say: "Neun plus acht ist neun plus neun minus eins. Stimmt das?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "6 + 9 = _"
                say: "Sechs plus neun."
                answer: "15"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welche Verdopplung hilft bei 2 + 3?"
            say: "Zwei plus drei. Welche Verdopplungsaufgabe hilft dir?"
            options: ["2 + 2", "4 + 4", "1 + 1"]
            answer: "2 + 2"
          - id: l2-c2
            type: fill_in_blank
            text: "Nimm die Aufgabe mit 10."
            say: "Neun plus zwei. Füll die Lücken."
            frame: "9 + 2 = 10 + 2 − _ = _"
            options: ["1", "2", "11", "12"]
            answer: ["1", "11"]
          - id: l2-c3
            type: multiple_choice
            text: "6 + 6 = 12. Was ist 7 + 6?"
            say: "Sechs plus sechs ist zwölf. Was ist sieben plus sechs?"
            options: ["13", "11", "14"]
            answer: "13"
          - id: l2-c4
            type: text_input
            text: "9 + 4 = _"
            say: "Neun plus vier."
            answer: "13"
          - id: l2-c5
            type: true_false
            text: "Stimmt das? 6 + 5 = 5 + 5 + 1"
            say: "Sechs plus fünf ist fünf plus fünf plus eins. Stimmt das?"
            answer: true
