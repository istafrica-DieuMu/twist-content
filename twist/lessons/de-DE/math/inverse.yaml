# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.inverse
skill: math.add-sub-to-20.inverse
curriculum: de-DE
language: de
title:
  de: Umkehraufgaben und Aufgabenfamilien
  en: Inverse sums and fact families
summary: >
  Plus and minus undo each other: 3 + 5 = 8, so 8 − 5 = 3. Lesson 1 finds
  the Umkehraufgabe of a plus sum in the ten-frame and uses it to check a
  minus result; lesson 2 builds the whole family of four sums from three
  numbers (3 + 5, 5 + 3, 8 − 5, 8 − 3) and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.commutative, math.add-sub-to-20.sub-to-10]
  also_practises: [math.add-sub-to-20.missing-addend]
  vocabulary: { de: [Umkehraufgabe, Aufgabenfamilie, umkehren, prüfen] }
  forms: [drawn, text, audio]
  drawn: [ten-frame, number-house]
  facets: []
  misconceptions:
    - id: inverse-is-swap
      what: Thinks the Umkehraufgabe of 3 + 5 is 5 + 3
      addressed: Learn sets the Tauschaufgabe and the Umkehraufgabe side by side; feedback on 5 + 3 says it is the Tauschaufgabe
    - id: start-with-part
      what: Starts the minus sum of the family with a part (3 − 8)
      addressed: Learn says the minus sums start with the biggest number, the whole
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Plus und minus gehören zusammen, en: Plus and minus belong together }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist die Tauschaufgabe von 2 + 4?"
            options: ["4 + 2", "2 + 2", "4 − 2"]
            answer: "4 + 2"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "7 − 3 = _"
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 + 5 = 8"
            say: "Drei rote Punkte, fünf blaue kommen dazu. Drei plus fünf gleich acht."
            show: { drawn: ten-frame, filled: 8, colour_split: [3, 5] }
          - text: "8 − 5 = 3"
            say: "Jetzt nehmen wir die fünf blauen wieder weg. Acht minus fünf gleich drei. Das ist die Umkehraufgabe: Minus macht das Plus wieder rückgängig."
            show: { drawn: ten-frame, filled: 8, cross: 5 }
          - text: "5 + 3: Tauschaufgabe · 8 − 5: Umkehraufgabe"
            say: "Nicht verwechseln: Fünf plus drei ist die Tauschaufgabe. Acht minus fünf ist die Umkehraufgabe."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was ist die Umkehraufgabe von 2 + 4 = 6?"
                options: ["6 − 4 = 2", "4 + 2 = 6", "6 + 4 = 10"]
                answer: "6 − 4 = 2"
                feedback:
                  "4 + 2 = 6": "Das ist die Tauschaufgabe. Die Umkehraufgabe ist eine Minusaufgabe."
                hints:
                  - "Die Umkehraufgabe ist eine Minusaufgabe."
                  - "Nimm die 4 wieder weg: sechs minus vier."
                  - "6 − 4 = 2."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "5 + 2 = 7. Schreib die Umkehraufgabe."
                say: "Fünf plus zwei gleich sieben. Nimm die Zwei wieder weg: Schreib die Umkehraufgabe."
                show: { drawn: ten-frame, filled: 7, cross: 2 }
                frame: "7 − _ = _"
                options: ["2", "5", "9"]
                answer: ["2", "5"]
                hints:
                  - "Nimm die Zwei wieder weg."
                  - "Sieben minus zwei."
                  - "7 − 2 = 5."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Die Umkehraufgabe von 3 + 4 = 7 ist 7 − 4 = 3."
                answer: true
                hints:
                  - "Minus macht das Plus rückgängig."
                  - "Sieben minus vier ist drei."
                  - "Ja."
              - id: l1-f4
                type: multiple_choice
                text: "9 − 6 = 3. Prüfe mit Plus."
                say: "Neun minus sechs gleich drei. Mit welcher Plusaufgabe kannst du das prüfen?"
                options: ["3 + 6 = 9", "9 + 6 = 15", "3 + 3 = 6"]
                answer: "3 + 6 = 9"
                hints:
                  - "Das Ergebnis plus die weggenommene Zahl."
                  - "Drei plus sechs."
                  - "3 + 6 = 9."
              - id: l1-f5
                type: fill_in_blank
                text: "1 + 8 = 9. Schreib die Umkehraufgabe."
                say: "Eins plus acht gleich neun. Nimm die Acht wieder weg: Schreib die Umkehraufgabe."
                frame: "9 − _ = _"
                options: ["1", "8", "9"]
                answer: ["8", "1"]
                hints:
                  - "Nimm die Acht wieder weg."
                  - "Neun minus acht."
                  - "9 − 8 = 1."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? 6 − 2 = 4, denn 4 + 2 = 6."
                answer: true
                hints:
                  - "Prüfe mit Plus."
                  - "Vier plus zwei ist sechs."
                  - "Ja."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was ist die Umkehraufgabe von 4 + 5 = 9?"
                options: ["9 − 5 = 4", "5 + 4 = 9", "9 + 5 = 14"]
                answer: "9 − 5 = 4"
                hints: ["Eine Minusaufgabe."]
              - id: l1-s2
                type: fill_in_blank
                text: "3 + 3 = 6. Schreib die Umkehraufgabe."
                say: "Drei plus drei gleich sechs. Nimm die Drei wieder weg: Schreib die Umkehraufgabe."
                frame: "6 − _ = _"
                options: ["3", "6", "9"]
                answer: ["3", "3"]
                hints: ["Nimm drei weg."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Die Umkehraufgabe von 2 + 5 = 7 ist 5 + 2 = 7."
                answer: false
                hints: ["Die Umkehraufgabe macht das Plus wieder rückgängig."]
              - id: l1-s4
                type: multiple_choice
                text: "8 − 3 = 5. Prüfe mit Plus."
                say: "Acht minus drei gleich fünf. Mit welcher Plusaufgabe kannst du das prüfen?"
                options: ["5 + 3 = 8", "8 + 3 = 11", "5 + 5 = 10"]
                answer: "5 + 3 = 8"
                hints: ["Ergebnis plus weggenommene Zahl."]
              - id: l1-s5
                type: fill_in_blank
                text: "6 + 4 = 10. Schreib die Umkehraufgabe."
                say: "Sechs plus vier gleich zehn. Nimm die Vier wieder weg: Schreib die Umkehraufgabe."
                frame: "10 − _ = _"
                options: ["4", "6", "14"]
                answer: ["4", "6"]
                hints: ["Nimm vier weg."]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? 7 − 5 = 3, denn 3 + 5 = 7."
                answer: false
                hints: ["Rechne drei plus fünf nach."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was ist die Umkehraufgabe von 1 + 6 = 7?"
                options: ["7 − 6 = 1", "6 + 1 = 7", "7 + 6 = 13"]
                answer: "7 − 6 = 1"
              - id: l1-n2
                type: fill_in_blank
                text: "4 + 4 = 8. Schreib die Umkehraufgabe."
                say: "Vier plus vier gleich acht. Nimm die Vier wieder weg: Schreib die Umkehraufgabe."
                frame: "8 − _ = _"
                options: ["4", "8", "12"]
                answer: ["4", "4"]
              - id: l1-n3
                type: multiple_choice
                text: "10 − 7 = 3. Prüfe mit Plus."
                say: "Zehn minus sieben gleich drei. Mit welcher Plusaufgabe kannst du das prüfen?"
                options: ["3 + 7 = 10", "10 + 7 = 17", "3 + 3 = 6"]
                answer: "3 + 7 = 10"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? Die Umkehraufgabe von 2 + 3 = 5 ist 5 − 3 = 2."
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "2 + 7 = 9. Schreib die Umkehraufgabe."
                say: "Zwei plus sieben gleich neun. Nimm die Sieben wieder weg: Schreib die Umkehraufgabe."
                frame: "9 − _ = _"
                options: ["2", "7", "16"]
                answer: ["7", "2"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist die Umkehraufgabe von 3 + 6 = 9?"
            options: ["9 − 6 = 3", "6 + 3 = 9", "9 + 6 = 15"]
            answer: "9 − 6 = 3"
          - id: l1-c2
            type: fill_in_blank
            text: "5 + 3 = 8. Schreib die Umkehraufgabe."
            say: "Fünf plus drei gleich acht. Nimm die Drei wieder weg: Schreib die Umkehraufgabe."
            frame: "8 − _ = _"
            options: ["3", "5", "11"]
            answer: ["3", "5"]
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 6 − 1 = 5, denn 5 + 1 = 6."
            answer: true

  - n: 2
    title: { de: Aufgabenfamilien, en: Fact families }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist die Umkehraufgabe von 4 + 2 = 6?"
            options: ["6 − 2 = 4", "2 + 4 = 6", "6 + 2 = 8"]
            answer: "6 − 2 = 4"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "7 + 2 = 9. Schreib die Umkehraufgabe."
            say: "Sieben plus zwei gleich neun. Nimm die Zwei wieder weg: Schreib die Umkehraufgabe."
            frame: "9 − _ = _"
            options: ["2", "7", "11"]
            answer: ["2", "7"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3, 5, 8"
            say: "Mit den drei Zahlen drei, fünf und acht gibt es vier Aufgaben. Sie bilden eine Aufgabenfamilie."
            show: { drawn: number-house, roof: 8, rows: [[3, 5]] }
          - text: "3 + 5 = 8 · 5 + 3 = 8"
            say: "Zwei Plusaufgaben: drei plus fünf und die Tauschaufgabe fünf plus drei. Beide ergeben acht."
          - text: "8 − 5 = 3 · 8 − 3 = 5"
            say: "Zwei Minusaufgaben: acht minus fünf und acht minus drei. Die Minusaufgaben fangen immer mit der größten Zahl an, dem Dach."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Aufgabe gehört zur Familie 2, 4, 6?"
                show: { drawn: number-house, roof: 6, rows: [[2, 4]] }
                options: ["6 − 2 = 4", "4 − 2 = 2", "6 + 2 = 8"]
                answer: "6 − 2 = 4"
                hints:
                  - "Es dürfen nur 2, 4 und 6 vorkommen."
                  - "Minusaufgaben fangen mit 6 an."
                  - "6 − 2 = 4."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Ergänze die Familie."
                say: "Die Familie hat die Zahlen eins, sieben und acht. Ergänze die vier Aufgaben."
                show: { drawn: number-house, roof: 8, rows: [[1, 7]] }
                frame: "1 + 7 = 8 · 7 + 1 = _ · 8 − 7 = _ · 8 − 1 = _"
                options: ["1", "7", "8"]
                answer: ["8", "1", "7"]
                hints:
                  - "Die Tauschaufgabe hat dasselbe Ergebnis."
                  - "Acht minus sieben, acht minus eins."
                  - "8, 1, 7."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? 5 − 9 = 4 gehört zur Familie 4, 5, 9."
                answer: false
                feedback:
                  "true": "Die Minusaufgabe fängt mit der größten Zahl an: 9 − 5 = 4."
                hints:
                  - "Womit fangen Minusaufgaben an?"
                  - "Mit der größten Zahl, der 9."
                  - "Nein, richtig ist 9 − 5 = 4."
              - id: l2-f4
                type: multiple_choice
                text: "Wie viele Aufgaben hat die Familie 3, 4, 7?"
                options: ["2", "3", "4"]
                answer: "4"
                hints:
                  - "Zwei Plusaufgaben und zwei Minusaufgaben."
                  - "3 + 4, 4 + 3, 7 − 4, 7 − 3."
                  - "4."
              - id: l2-f5
                type: fill_in_blank
                text: "Ergänze die Minusaufgaben."
                say: "Familie zwei, drei, fünf. Ergänze die beiden Minusaufgaben."
                show: { drawn: number-house, roof: 5, rows: [[2, 3]] }
                frame: "5 − 2 = _ · 5 − 3 = _"
                options: ["2", "3", "5"]
                answer: ["3", "2"]
                hints:
                  - "Fünf minus zwei."
                  - "Fünf minus drei."
                  - "3 und 2."
              - id: l2-f6
                type: multiple_choice
                text: "Welche Aufgabe gehört nicht zur Familie 1, 9, 10?"
                options: ["9 + 1 = 10", "10 − 9 = 1", "9 − 1 = 8"]
                answer: "9 − 1 = 8"
                hints:
                  - "Kommt eine Zahl vor, die nicht 1, 9 oder 10 ist?"
                  - "Die 8."
                  - "9 − 1 = 8 gehört nicht dazu."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Aufgabe gehört zur Familie 3, 6, 9?"
                show: { drawn: number-house, roof: 9, rows: [[3, 6]] }
                options: ["9 − 3 = 6", "6 − 3 = 3", "9 + 3 = 12"]
                answer: "9 − 3 = 6"
                hints: ["Nur 3, 6 und 9."]
              - id: l2-s2
                type: fill_in_blank
                text: "Ergänze die Familie."
                say: "Die Familie hat die Zahlen zwei, fünf und sieben. Ergänze die vier Aufgaben."
                show: { drawn: number-house, roof: 7, rows: [[2, 5]] }
                frame: "2 + 5 = 7 · 5 + 2 = _ · 7 − 5 = _ · 7 − 2 = _"
                options: ["2", "5", "7"]
                answer: ["7", "2", "5"]
                hints: ["Tausch- und Umkehraufgaben."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? 6 − 4 = 2 gehört zur Familie 2, 4, 6."
                answer: true
                hints: ["Nur 2, 4 und 6."]
              - id: l2-s4
                type: fill_in_blank
                text: "Ergänze die Minusaufgaben."
                say: "Familie vier, sechs, zehn. Ergänze die beiden Minusaufgaben."
                show: { drawn: number-house, roof: 10, rows: [[4, 6]] }
                frame: "10 − 4 = _ · 10 − 6 = _"
                options: ["4", "6", "10"]
                answer: ["6", "4"]
                hints: ["Zehn minus vier, zehn minus sechs."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Aufgabe gehört nicht zur Familie 2, 6, 8?"
                options: ["6 + 2 = 8", "8 − 2 = 6", "6 − 2 = 4"]
                answer: "6 − 2 = 4"
                hints: ["Kommt eine fremde Zahl vor?"]
              - id: l2-s6
                type: multiple_choice
                text: "Wie viele Aufgaben hat die Familie 1, 5, 6?"
                options: ["2", "4", "6"]
                answer: "4"
                hints: ["Zwei plus, zwei minus."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Aufgabe gehört zur Familie 4, 5, 9?"
                show: { drawn: number-house, roof: 9, rows: [[4, 5]] }
                options: ["9 − 4 = 5", "5 − 4 = 1", "9 + 4 = 13"]
                answer: "9 − 4 = 5"
              - id: l2-n2
                type: fill_in_blank
                text: "Ergänze die Familie."
                say: "Die Familie hat die Zahlen drei, sieben und zehn. Ergänze die vier Aufgaben."
                show: { drawn: number-house, roof: 10, rows: [[3, 7]] }
                frame: "3 + 7 = 10 · 7 + 3 = _ · 10 − 7 = _ · 10 − 3 = _"
                options: ["3", "7", "10"]
                answer: ["10", "3", "7"]
              - id: l2-n3
                type: true_false
                text: "Stimmt das? 3 − 8 = 5 gehört zur Familie 3, 5, 8."
                answer: false
              - id: l2-n4
                type: fill_in_blank
                text: "Ergänze die Minusaufgaben."
                say: "Familie eins, sechs, sieben. Ergänze die beiden Minusaufgaben."
                show: { drawn: number-house, roof: 7, rows: [[1, 6]] }
                frame: "7 − 1 = _ · 7 − 6 = _"
                options: ["1", "6", "7"]
                answer: ["6", "1"]
              - id: l2-n5
                type: multiple_choice
                text: "Welche Aufgabe gehört nicht zur Familie 2, 7, 9?"
                options: ["9 − 7 = 2", "9 + 2 = 11", "2 + 7 = 9"]
                answer: "9 + 2 = 11"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Was ist die Umkehraufgabe von 5 + 4 = 9?"
            options: ["9 − 4 = 5", "4 + 5 = 9", "9 + 4 = 13"]
            answer: "9 − 4 = 5"
          - id: l2-c2
            type: fill_in_blank
            text: "2 + 6 = 8. Schreib die Umkehraufgabe."
            say: "Zwei plus sechs gleich acht. Nimm die Sechs wieder weg: Schreib die Umkehraufgabe."
            frame: "8 − _ = _"
            options: ["2", "6", "14"]
            answer: ["6", "2"]
          - id: l2-c3
            type: multiple_choice
            text: "Welche Aufgabe gehört zur Familie 1, 4, 5?"
            show: { drawn: number-house, roof: 5, rows: [[1, 4]] }
            options: ["5 − 1 = 4", "4 − 1 = 3", "5 + 1 = 6"]
            answer: "5 − 1 = 4"
          - id: l2-c4
            type: true_false
            text: "Stimmt das? 7 − 2 = 5, denn 5 + 2 = 7."
            answer: true
          - id: l2-c5
            type: fill_in_blank
            text: "Ergänze die Minusaufgaben."
            say: "Familie drei, sechs, neun. Ergänze die beiden Minusaufgaben."
            show: { drawn: number-house, roof: 9, rows: [[3, 6]] }
            frame: "9 − 3 = _ · 9 − 6 = _"
            options: ["3", "6", "9"]
            answer: ["6", "3"]
