                feedback:
                  "568 + 6 = 574": "Dieser Schritt ist richtig gerechnet. Der Fehler ist schon vorher passiert."
                hints:
                  - "Mit welcher Zahl fängt jeder Schritt an?"
                  - "Der zweite Schritt fängt wieder mit 528 an, nicht mit 728."
                  - "Richtig ist 728 + 40 = 768."
              - id: l1-f4
