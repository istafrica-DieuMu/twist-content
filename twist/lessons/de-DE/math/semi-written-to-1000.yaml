                options: ["700", "70", "12", "782", "772"]
                answer: ["700", "70", "12", "782"]
                hints:
                  - "Rechne jede Stelle für sich."
                  - "Zum Schluss: 700 + 70 + 12."
                  - "700 + 70 + 12 = 782."
              - id: l1-f3
                type: multiple_choice
                text: "Wo ist der Fehler? 528 + 200 = 728 · 528 + 40 = 568 · 568 + 6 = 574"
                say: "Ben hat fünfhundertachtundzwanzig plus zweihundertsechsundvierzig schrittweise gerechnet. In welchem Schritt ist der Fehler?"
