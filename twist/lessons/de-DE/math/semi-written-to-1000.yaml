# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.semi-written-to-1000
skill: math.add-sub-to-1000.semi-written
curriculum: de-DE
language: de
title:
  de: Halbschriftlich rechnen bis 1000
  en: Informal written methods to 1000
summary: >
  Adding and subtracting three-digit numbers halbschriftlich, writing each
  step down, with the ways from Klasse 2. Lesson 1 adds schrittweise
  (hundreds, then tens, then ones) and stellenweise; lesson 2 subtracts
  schrittweise and by ergänzen when the numbers are close together, and
  ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-1000.bridging, math.add-sub-to-100.sub-two-digit]
  also_practises: [math.add-sub-to-1000.bridging]
  vocabulary: { de: [halbschriftlich, Zwischenschritt, schrittweise, stellenweise, ergänzen] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich]
  facets: []
  misconceptions:
    - id: lost-step
      what: Starts the next step from the first number instead of the last result (528 + 200 = 728, then 528 + 40)
      addressed: Learn writes each result into the next step; "Wo ist der Fehler?" tasks show a step restarted from the first number (l1-f3, l1-n6), with feedback in the full stage
    - id: forget-partial
      what: Stellenweise, leaves out one of the partial results when adding them up
      addressed: stellenweise frames ask for each partial result and then the total of all three
    - id: subtract-far-by-ergaenzen
      what: Ergänzt also when the numbers are far apart, with many jumps
      addressed: lesson 2 Learn says when each way suits (far apart, abziehen; close together, ergänzen); ergänzen tasks use close numbers only
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
