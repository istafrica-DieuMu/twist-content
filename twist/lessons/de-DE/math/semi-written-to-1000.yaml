            type: text_input
            text: "476 + 8 = _"
            say: "Vierhundertsechsundsiebzig plus acht."
            answer: "484"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "350 + 70 = _"
            say: "Dreihundertfünfzig plus siebzig."
            answer: "420"
