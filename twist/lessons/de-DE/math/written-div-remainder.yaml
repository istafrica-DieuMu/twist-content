# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.written-div-remainder
skill: math.written-mult-div.div-remainder-zeros
curriculum: de-DE
language: de
title:
  de: Schriftlich teilen mit Rest und Null
  en: Written division with remainders and zeros
summary: >
  Written division that does not come out evenly at every step. Lesson 1
  carries the Rest of one place to the next (857 : 4 = 214 Rest 1) and
  checks with the Probe; lesson 2 writes the Null when a place goes
  nullmal (624 : 3 = 208, not 28), and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Schriftlich teilen, en: Written division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-mult-div.div-one-digit]
  also_practises: [math.mult-div.remainder, math.mult-div-larger.estimate]
  vocabulary: { de: [schriftlich teilen, Rest, Stelle, nullmal, Probe, Überschlag] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: drop-rest
      what: "Forgets to carry the Rest of a place into the next place (5 Zehner : 4 = 1, then divides only the 7 Einer)"
      addressed: lesson 1 Learn turns the Rest-Zehner into Einer; "Welche Zahl teilst du als Nächstes?" in every stage of lesson 1
    - id: skip-zero
      what: "Leaves out the Null in the result (624 : 3 = 28)"
      addressed: lesson 2 Learn shows 208 against 28 and uses the Überschlag; every stage of lesson 2 asks what goes in the Zehnerstelle and has a true_false with the zero left out
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Der Rest wandert weiter", en: "Carrying the remainder" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "848 : 4 = _"
            say: "Achthundertachtundvierzig geteilt durch vier."
            answer: "212"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Rechne mit Rest."
            say: "Siebzehn geteilt durch vier, mit Rest."
            frame: "17 : 4 = _ Rest _"
            options: ["4", "1", "3"]
            answer: ["4", "1"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "857 : 4"
            say: "Achthundertsiebenundfünfzig geteilt durch vier. Du teilst Stelle für Stelle und fängst bei den Hundertern an."
          - text: "H: 8 : 4 = 2 | Z: 5 : 4 = 1 Rest 1 | E: 17 : 4 = 4 Rest 1"
            say: "Acht Hunderter geteilt durch vier sind zwei. Fünf Zehner geteilt durch vier ist eins, Rest eins. Der übrige Zehner wird zu zehn Einern: Zehn plus sieben sind siebzehn. Siebzehn geteilt durch vier ist vier, Rest eins."
          - text: "857 : 4 = 214 Rest 1 | Probe: 214 · 4 + 1 = 857"
            say: "Das Ergebnis ist zweihundertvierzehn Rest eins. Die Probe: Zweihundertvierzehn mal vier ist achthundertsechsundfünfzig, plus eins ist achthundertsiebenundfünfzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Siebenhundertneununddreißig geteilt durch drei. Rechne Stelle für Stelle."
                frame: "739 : 3 = _ Rest _"
                options: ["246", "1", "245", "2"]
                answer: ["246", "1"]
                hints:
                  - "Fang bei den Hundertern an: sieben geteilt durch drei."
                  - "Zwei Rest eins. Der Rest-Hunderter wird zu Zehnern: dreizehn Zehner geteilt durch drei."
                  - "246 Rest 1."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "653 : 5. Du rechnest 6 : 5 = 1 Rest 1. Welche Zahl teilst du als Nächstes?"
                say: "Sechshundertdreiundfünfzig geteilt durch fünf. Du rechnest sechs geteilt durch fünf gleich eins Rest eins. Welche Zahl teilst du als Nächstes?"
                options: ["15", "5", "11"]
                answer: "15"
                feedback:
                  "5": "Vergiss den Rest nicht. Der übrige Hunderter wird zu zehn Zehnern."
                hints:
                  - "Was passiert mit dem Rest?"
                  - "Der übrige Hunderter wird zu zehn Zehnern. Dazu kommen die fünf Zehner."
                  - "15."
              - id: l1-f3
                type: text_input
                text: "Probe für 529 : 4 = 132 Rest 1: 132 · 4 + 1 = _"
                say: "Rechne die Probe für fünfhundertneunundzwanzig geteilt durch vier gleich hundertzweiunddreißig Rest eins. Hundertzweiunddreißig mal vier plus eins ist …"
                answer: "529"
                hints:
                  - "Rechne zuerst hundertzweiunddreißig mal vier."
                  - "Das ist fünfhundertachtundzwanzig. Dazu kommt der Rest."
                  - "529."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 467 : 2 = 233 Rest 1"
                say: "Vierhundertsiebenundsechzig geteilt durch zwei ist zweihundertdreiunddreißig Rest eins. Stimmt das?"
                answer: true
                hints:
                  - "Mach die Probe."
                  - "Zweihundertdreiunddreißig mal zwei ist vierhundertsechsundsechzig. Plus eins?"
                  - "Ja, das stimmt."
              - id: l1-f5
                type: fill_in_blank
                text: "950 Brötchen, immer 6 in eine Tüte."
                say: "Ein Bäcker packt neunhundertfünfzig Brötchen in Tüten. In jede Tüte kommen sechs Brötchen. Wie viele Tüten werden voll, und wie viele Brötchen bleiben übrig?"
                frame: "950 : 6 = _ Rest _"
                options: ["158", "2", "157", "8"]
                answer: ["158", "2"]
                hints:
                  - "Rechne schriftlich Stelle für Stelle."
                  - "Neun geteilt durch sechs ist eins Rest drei. Dann fünfunddreißig Zehner geteilt durch sechs."
                  - "158 Rest 2."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fünfhundertsechsundachtzig geteilt durch vier. Rechne Stelle für Stelle."
                frame: "586 : 4 = _ Rest _"
                options: ["146", "2", "145", "6"]
                answer: ["146", "2"]
                hints: ["Der Rest wandert zur nächsten Stelle."]
              - id: l1-s2
                type: multiple_choice
                text: "734 : 6. Du rechnest 7 : 6 = 1 Rest 1. Welche Zahl teilst du als Nächstes?"
                say: "Siebenhundertvierunddreißig geteilt durch sechs. Du rechnest sieben geteilt durch sechs gleich eins Rest eins. Welche Zahl teilst du als Nächstes?"
                options: ["13", "3", "10"]
                answer: "13"
                hints: ["Der übrige Hunderter wird zu zehn Zehnern."]
              - id: l1-s3
                type: text_input
                text: "Probe für 815 : 3 = 271 Rest 2: 271 · 3 + 2 = _"
                say: "Rechne die Probe für achthundertfünfzehn geteilt durch drei gleich zweihunderteinundsiebzig Rest zwei. Zweihunderteinundsiebzig mal drei plus zwei ist …"
                answer: "815"
                hints: ["Zuerst mal drei, dann plus den Rest."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 958 : 4 = 239 Rest 3"
                say: "Neunhundertachtundfünfzig geteilt durch vier ist zweihundertneununddreißig Rest drei. Stimmt das?"
                answer: false
                hints: ["Mach die Probe."]
              - id: l1-s5
                type: fill_in_blank
                text: "418 Bonbons für 5 Kinder."
                say: "Vierhundertachtzehn Bonbons werden gerecht an fünf Kinder verteilt. Wie viele bekommt jedes Kind, und wie viele bleiben übrig?"
                frame: "418 : 5 = _ Rest _"
                options: ["83", "3", "84", "2"]
                answer: ["83", "3"]
                hints: ["Vier Hunderter geteilt durch fünf geht nullmal. Fang mit einundvierzig Zehnern an."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Neunhundertsiebenundvierzig geteilt durch acht. Rechne Stelle für Stelle."
                frame: "947 : 8 = _ Rest _"
                options: ["118", "3", "117", "11"]
                answer: ["118", "3"]
              - id: l1-n2
                type: multiple_choice
                text: "917 : 7. Du rechnest 9 : 7 = 1 Rest 2. Welche Zahl teilst du als Nächstes?"
                say: "Neunhundertsiebzehn geteilt durch sieben. Du rechnest neun geteilt durch sieben gleich eins Rest zwei. Welche Zahl teilst du als Nächstes?"
                options: ["21", "1", "12"]
                answer: "21"
              - id: l1-n3
                type: text_input
                text: "Probe für 683 : 6 = 113 Rest 5: 113 · 6 + 5 = _"
                say: "Rechne die Probe für sechshundertdreiundachtzig geteilt durch sechs gleich hundertdreizehn Rest fünf. Hundertdreizehn mal sechs plus fünf ist …"
                answer: "683"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 795 : 9 = 88 Rest 3"
                say: "Siebenhundertfünfundneunzig geteilt durch neun ist achtundachtzig Rest drei. Stimmt das?"
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "763 Hefte für 3 Klassen."
                say: "Eine Schule verteilt siebenhundertdreiundsechzig Hefte gleichmäßig an drei Klassen. Wie viele Hefte bekommt jede Klasse, und wie viele bleiben übrig?"
                frame: "763 : 3 = _ Rest _"
                options: ["254", "1", "253", "4"]
                answer: ["254", "1"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Rechne schriftlich."
            say: "Achthundertfünfundsiebzig geteilt durch sechs. Rechne Stelle für Stelle."
            frame: "875 : 6 = _ Rest _"
            options: ["145", "5", "146", "1"]
            answer: ["145", "5"]
          - id: l1-c2
            type: true_false
            text: "Stimmt das? 638 : 5 = 127 Rest 3"
            say: "Sechshundertachtunddreißig geteilt durch fünf ist hundertsiebenundzwanzig Rest drei. Stimmt das?"
            answer: true
          - id: l1-c3
            type: text_input
            text: "Probe für 455 : 4 = 113 Rest 3: 113 · 4 + 3 = _"
            say: "Rechne die Probe für vierhundertfünfundfünfzig geteilt durch vier gleich hundertdreizehn Rest drei. Hundertdreizehn mal vier plus drei ist …"
            answer: "455"

  - n: 2
    title: { de: "Die Null im Ergebnis", en: "A zero in the result" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Rechne schriftlich."
            say: "Sechshundertvierundneunzig geteilt durch fünf. Rechne Stelle für Stelle."
            frame: "694 : 5 = _ Rest _"
            options: ["138", "4", "139", "1"]
            answer: ["138", "4"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie oft passt die 3 in die 2?"
            say: "Wie oft passt die Drei in die Zwei?"
            options: ["nullmal", "einmal", "zweimal"]
            answer: "nullmal"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "624 : 3"
            say: "Sechshundertvierundzwanzig geteilt durch drei."
          - text: "H: 6 : 3 = 2 | Z: 2 : 3 = 0 Rest 2 | E: 24 : 3 = 8"
            say: "Sechs Hunderter geteilt durch drei sind zwei. Zwei Zehner geteilt durch drei geht nullmal, Rest zwei. Die Null musst du ins Ergebnis schreiben. Dann vierundzwanzig Einer geteilt durch drei sind acht."
          - text: "624 : 3 = 208, nicht 28"
            say: "Das Ergebnis ist zweihundertacht. Vergisst du die Null, steht dort achtundzwanzig. Der Überschlag hilft: Sechshundert geteilt durch drei ist zweihundert."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Sechshundertachtzehn geteilt durch drei. Rechne Stelle für Stelle."
                frame: "618 : 3 = _"
                options: ["206", "26", "216"]
                answer: ["206"]
                feedback:
                  "26": "Denk an die Null: Ein Zehner geteilt durch drei geht nullmal."
                hints:
                  - "Wie oft passt die Drei in den einen Zehner?"
                  - "Nullmal. Schreib die Null und nimm den Zehner mit zu den Einern: achtzehn."
                  - "206."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was schreibst du bei 836 : 4 an die Zehnerstelle?"
                say: "Achthundertsechsunddreißig geteilt durch vier. Was schreibst du im Ergebnis an die Zehnerstelle?"
                options: ["0", "3", "9"]
                answer: "0"
                hints:
                  - "Wie oft passt die Vier in drei Zehner?"
                  - "Sie passt nullmal hinein."
                  - "0."
              - id: l2-f3
                type: text_input
                text: "927 : 9 = _"
                say: "Neunhundertsiebenundzwanzig geteilt durch neun."
                answer: "103"
                hints:
                  - "Mach zuerst einen Überschlag: neunhundert geteilt durch neun."
                  - "Bei den Zehnern geht die Neun nullmal in die Zwei."
                  - "103."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 545 : 5 = 19"
                say: "Fünfhundertfünfundvierzig geteilt durch fünf ist neunzehn. Stimmt das?"
                answer: false
                hints:
                  - "Mach einen Überschlag."
                  - "Fünfhundert geteilt durch fünf ist hundert. Neunzehn ist viel zu klein."
                  - "Nein. 545 : 5 = 109."
              - id: l2-f5
                type: text_input
                text: "Ein Bauer legt 612 Eier in Kartons zu 6 Stück. Wie viele Kartons füllt er?"
                say: "Ein Bauer legt sechshundertzwölf Eier in Kartons. In jeden Karton passen sechs Eier. Wie viele Kartons füllt er?"
                answer: "102"
                hints:
                  - "Welche Geteiltaufgabe passt?"
                  - "Sechshundertzwölf geteilt durch sechs. Ein Zehner geteilt durch sechs geht nullmal."
                  - "102 Kartons."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Siebenhundertvierzehn geteilt durch sieben. Rechne Stelle für Stelle."
                frame: "714 : 7 = _"
                options: ["102", "12", "112"]
                answer: ["102"]
                hints: ["Ein Zehner geteilt durch sieben geht nullmal."]
              - id: l2-s2
                type: multiple_choice
                text: "Was schreibst du bei 654 : 6 an die Zehnerstelle?"
                say: "Sechshundertvierundfünfzig geteilt durch sechs. Was schreibst du im Ergebnis an die Zehnerstelle?"
                options: ["0", "5", "9"]
                answer: "0"
                hints: ["Wie oft passt die Sechs in fünf Zehner?"]
              - id: l2-s3
                type: text_input
                text: "832 : 8 = _"
                say: "Achthundertzweiunddreißig geteilt durch acht."
                answer: "104"
                hints: ["Mach einen Überschlag: achthundert geteilt durch acht."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 721 : 7 = 13"
                say: "Siebenhunderteinundzwanzig geteilt durch sieben ist dreizehn. Stimmt das?"
                answer: false
                hints: ["Mach einen Überschlag: siebenhundert geteilt durch sieben."]
              - id: l2-s5
                type: text_input
                text: "520 : 5 = _"
                say: "Fünfhundertzwanzig geteilt durch fünf."
                answer: "104"
                hints: ["Zwei Zehner geteilt durch fünf geht nullmal."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Achthundertsechzehn geteilt durch vier. Rechne Stelle für Stelle."
                frame: "816 : 4 = _"
                options: ["204", "24", "214"]
                answer: ["204"]
              - id: l2-n2
                type: multiple_choice
                text: "Was schreibst du bei 742 : 7 an die Zehnerstelle?"
                say: "Siebenhundertzweiundvierzig geteilt durch sieben. Was schreibst du im Ergebnis an die Zehnerstelle?"
                options: ["0", "4", "6"]
                answer: "0"
              - id: l2-n3
                type: text_input
                text: "936 : 9 = _"
                say: "Neunhundertsechsunddreißig geteilt durch neun."
                answer: "104"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 856 : 8 = 17"
                say: "Achthundertsechsundfünfzig geteilt durch acht ist siebzehn. Stimmt das?"
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Rechne mit Rest."
                say: "Achthundertdreiundzwanzig geteilt durch vier. Rechne Stelle für Stelle."
                frame: "823 : 4 = _ Rest _"
                options: ["205", "3", "25", "1"]
                answer: ["205", "3"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Rechne mit Rest."
            say: "Neunhundertfünfundachtzig geteilt durch sieben. Rechne Stelle für Stelle."
            frame: "985 : 7 = _ Rest _"
            options: ["140", "5", "14", "3"]
            answer: ["140", "5"]
          - id: l2-c2
            type: text_input
            text: "618 : 6 = _"
            say: "Sechshundertachtzehn geteilt durch sechs."
            answer: "103"
          - id: l2-c3
            type: true_false
            text: "Stimmt das? 728 : 7 = 14"
            say: "Siebenhundertachtundzwanzig geteilt durch sieben ist vierzehn. Stimmt das?"
            answer: false
          - id: l2-c4
            type: text_input
            text: "Probe für 923 : 3 = 307 Rest 2: 307 · 3 + 2 = _"
            say: "Rechne die Probe für neunhundertdreiundzwanzig geteilt durch drei gleich dreihundertsieben Rest zwei. Dreihundertsieben mal drei plus zwei ist …"
            answer: "923"
          - id: l2-c5
            type: multiple_choice
            text: "Was schreibst du bei 945 : 9 an die Zehnerstelle?"
            say: "Neunhundertfünfundvierzig geteilt durch neun. Was schreibst du im Ergebnis an die Zehnerstelle?"
            options: ["0", "4", "5"]
            answer: "0"
