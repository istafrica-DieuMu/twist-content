# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.length-estimate
skill: math.length.estimate
curriculum: de-DE
language: de
title:
  de: Längen schätzen
  en: Estimating lengths
summary: >
  Lesson 1 learns benchmarks (1 cm ist so breit wie dein Finger, 1 m ist
  ein großer Schritt, eine Tür ist etwa 2 m hoch) and picks the length
  that fits a thing; lesson 2 estimates with a benchmark (Der Tisch ist
  etwa 2 Schritte lang, also etwa 2 m), spots estimates in the wrong unit,
  and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Längen, en: Length }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.length.cm-m]
  also_practises: [math.length.cm-m]
  vocabulary: { de: [schätzen, ungefähr, etwa, Zentimeter, Meter, Fingerbreite, Schritt] }
  forms: [text, audio]
  drawn: []
  facets: [units]
  misconceptions:
    - id: right-number-wrong-unit
      what: Picks a sensible number with the wrong unit (ein Stift ist 15 m lang)
      addressed: lesson 1 Learn sets 15 cm against 15 m; every stage offers the same number in the other unit, with feedback in l1-f2
    - id: estimate-must-be-exact
      what: Thinks an estimate is wrong if it is not exactly the measured length
      addressed: lesson 2 Learn says an estimate is ungefähr; l2-f4 and l2-s4 ask whether a close estimate is a good one
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "So lang ist 1 cm, so lang ist 1 m", en: "How long 1 cm and 1 m are" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1 m = _ cm"
            say: "Wie viele Zentimeter hat ein Meter?"
            options: ["100", "10"]
            answer: "100"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was misst du in Metern?"
            say: "Was misst du in Metern: einen Flur oder einen Radiergummi?"
            options: ["einen Flur", "einen Radiergummi"]
            answer: "einen Flur"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 cm: so breit wie dein kleiner Finger"
            say: "Ein Zentimeter ist ungefähr so breit wie dein kleiner Finger. Ein Bleistift ist ungefähr fünfzehn Zentimeter lang."
          - text: "1 m: ein großer Schritt"
            say: "Ein Meter ist ungefähr ein großer Schritt. Eine Tür ist ungefähr zwei Meter hoch. Du bist vielleicht ein Meter zwanzig groß."
          - text: "Ein Stift: 15 cm, nicht 15 m!"
            say: "Achte auf die Einheit. Ein Stift ist fünfzehn Zentimeter lang. Fünfzehn Meter wären länger als ein Bus."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie lang ist ein Bleistift ungefähr?"
                say: "Wie lang ist ein Bleistift ungefähr?"
                options: ["15 cm", "15 m", "1 cm"]
                answer: "15 cm"
                hints:
                  - "Ein Bleistift passt in deine Federmappe."
                  - "Er ist so lang wie etwa fünfzehn Fingerbreiten."
                  - "15 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie hoch ist eine Tür ungefähr?"
                say: "Wie hoch ist eine Tür ungefähr?"
                options: ["2 m", "2 cm", "20 m"]
                answer: "2 m"
                feedback:
                  "2 cm": "2 cm sind nur zwei Fingerbreiten. Eine Tür ist höher als ein Erwachsener."
                  "20 m": "20 m wären so hoch wie ein großes Haus."
                hints:
                  - "Eine Tür ist etwas höher als ein Erwachsener."
                  - "Das sind ungefähr zwei große Schritte."
                  - "2 m."
              - id: l1-f3
                type: multiple_choice
                text: "Wie breit ist dein Daumen ungefähr?"
                say: "Wie breit ist dein Daumen ungefähr?"
                options: ["1 cm", "1 m", "10 cm"]
                answer: "1 cm"
                hints:
                  - "Dein Daumen ist schmal."
                  - "Ein Zentimeter ist ungefähr eine Fingerbreite."
                  - "1 cm."
              - id: l1-f4
                type: true_false
                text: "Ein Klassenzimmer ist ungefähr 8 cm lang."
                say: "Stimmt das? Ein Klassenzimmer ist ungefähr acht Zentimeter lang."
                answer: false
                hints:
                  - "Acht Zentimeter sind kürzer als ein Stift."
                  - "Ein Klassenzimmer misst man in Metern."
                  - "Nein, es ist ungefähr 8 m lang."
              - id: l1-f5
                type: multiple_choice
                text: "Wie lang ist ein Schulbus ungefähr?"
                say: "Wie lang ist ein Schulbus ungefähr?"
                options: ["12 m", "12 cm", "120 m"]
                answer: "12 m"
                hints:
                  - "Ein Bus ist viel länger als ein Auto."
                  - "Ungefähr zwölf große Schritte."
                  - "12 m."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie lang ist ein Löffel ungefähr?"
                say: "Wie lang ist ein Löffel ungefähr?"
                options: ["15 cm", "15 m", "150 cm"]
                answer: "15 cm"
                hints: ["Ein Löffel ist ungefähr so lang wie ein Stift."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie lang ist ein Bett ungefähr?"
                say: "Wie lang ist ein Bett ungefähr?"
                options: ["2 m", "2 cm", "20 m"]
                answer: "2 m"
                hints: ["Ein Erwachsener passt hinein."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie lang ist eine Ameise ungefähr?"
                say: "Wie lang ist eine Ameise ungefähr?"
                options: ["1 cm", "1 m", "10 cm"]
                answer: "1 cm"
                hints: ["Eine Ameise ist winzig."]
              - id: l1-s4
                type: true_false
                text: "Ein großes Heft ist ungefähr 30 cm lang."
                say: "Stimmt das? Ein großes Heft ist ungefähr dreißig Zentimeter lang."
                answer: true
                hints: ["Ein großes Heft ist ungefähr so lang wie zwei Stifte."]
              - id: l1-s5
                type: multiple_choice
                text: "Wie hoch ist ein Haus mit 3 Stockwerken ungefähr?"
                say: "Wie hoch ist ein Haus mit drei Stockwerken ungefähr?"
                options: ["10 m", "10 cm", "100 m"]
                answer: "10 m"
                hints: ["Ein Stockwerk ist ungefähr drei Meter hoch."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie lang ist ein Radiergummi ungefähr?"
                say: "Wie lang ist ein Radiergummi ungefähr?"
                options: ["4 cm", "4 m", "40 cm"]
                answer: "4 cm"
              - id: l1-n2
                type: multiple_choice
                text: "Wie lang ist ein Auto ungefähr?"
                say: "Wie lang ist ein Auto ungefähr?"
                options: ["4 m", "4 cm", "40 m"]
                answer: "4 m"
              - id: l1-n3
                type: multiple_choice
                text: "Wie hoch ist ein Tisch ungefähr?"
                say: "Wie hoch ist ein Tisch ungefähr?"
                options: ["75 cm", "75 m", "7 cm"]
                answer: "75 cm"
              - id: l1-n4
                type: true_false
                text: "Ein Fußballfeld ist ungefähr 100 m lang."
                say: "Stimmt das? Ein Fußballfeld ist ungefähr hundert Meter lang."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Wie lang ist dein Schuh ungefähr?"
                say: "Wie lang ist dein Schuh ungefähr?"
                options: ["20 cm", "20 m", "2 cm"]
                answer: "20 cm"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie lang ist eine Gabel ungefähr?"
            say: "Wie lang ist eine Gabel ungefähr?"
            options: ["20 cm", "20 m", "2 m"]
            answer: "20 cm"
          - id: l1-c2
            type: multiple_choice
            text: "Wie lang ist ein Sofa ungefähr?"
            say: "Wie lang ist ein Sofa ungefähr?"
            options: ["2 m", "2 cm", "20 m"]
            answer: "2 m"
          - id: l1-c3
            type: true_false
            text: "Ein Fingernagel ist ungefähr 1 m breit."
            say: "Stimmt das? Ein Fingernagel ist ungefähr einen Meter breit."
            answer: false

  - n: 2
    title: { de: "Mit Stützpunkten schätzen", en: "Estimating with benchmarks" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie lang ist ein Stift ungefähr?"
            say: "Wie lang ist ein Stift ungefähr?"
            options: ["15 cm", "15 m"]
            answer: "15 cm"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist ungefähr 1 m?"
            say: "Was ist ungefähr einen Meter lang?"
            options: ["ein großer Schritt", "eine Fingerbreite"]
            answer: "ein großer Schritt"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Tafel: etwa 3 große Schritte = etwa 3 m"
            say: "Zum Schätzen nimmst du etwas, das du kennst. Die Tafel ist etwa drei große Schritte lang. Ein großer Schritt ist etwa ein Meter. Also ist die Tafel etwa drei Meter lang."
          - text: "Buch: etwa 2 Stifte = etwa 30 cm"
            say: "Das Buch ist etwa so lang wie zwei Stifte. Ein Stift ist etwa fünfzehn Zentimeter. Also ist das Buch etwa dreißig Zentimeter lang."
          - text: "geschätzt 30 cm · gemessen 28 cm: gut geschätzt!"
            say: "Danach misst du nach: achtundzwanzig Zentimeter. Das ist nah dran. Eine Schätzung muss nicht genau stimmen. Sie soll ungefähr passen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Der Flur ist etwa 10 große Schritte lang. Wie lang ist er ungefähr?"
                say: "Der Flur ist etwa zehn große Schritte lang. Wie lang ist er ungefähr?"
                options: ["10 m", "10 cm", "100 m"]
                answer: "10 m"
                hints:
                  - "Ein großer Schritt ist etwa 1 m."
                  - "Zehn Schritte sind etwa zehn Meter."
                  - "10 m."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Das Lineal ist etwa so lang wie 2 Stifte. Wie lang ist es ungefähr?"
                say: "Das Lineal ist etwa so lang wie zwei Stifte. Ein Stift ist etwa fünfzehn Zentimeter. Wie lang ist das Lineal ungefähr?"
                options: ["30 cm", "30 m", "15 cm"]
                answer: "30 cm"
                hints:
                  - "Ein Stift ist etwa 15 cm."
                  - "15 cm und noch einmal 15 cm."
                  - "30 cm."
              - id: l2-f3
                type: multiple_choice
                text: "Der Käfer ist etwa 2 Fingerbreiten lang. Wie lang ist er ungefähr?"
                say: "Der Käfer ist etwa zwei Fingerbreiten lang. Wie lang ist er ungefähr?"
                options: ["2 cm", "2 m", "20 cm"]
                answer: "2 cm"
                hints:
                  - "Eine Fingerbreite ist etwa 1 cm."
                  - "Zwei Fingerbreiten sind etwa 2 cm."
                  - "2 cm."
              - id: l2-f4
                type: true_false
                text: "Lena schätzt den Tisch auf 1 m. Sie misst 96 cm. Hat sie gut geschätzt?"
                say: "Lena schätzt, dass der Tisch einen Meter lang ist. Dann misst sie: sechsundneunzig Zentimeter. Hat sie gut geschätzt?"
                answer: true
                hints:
                  - "Ein Meter sind 100 cm."
                  - "96 cm ist ganz nah an 100 cm."
                  - "Ja, gut geschätzt."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Schätzung passt nicht?"
                say: "Ben schätzt drei Dinge. Welche Schätzung passt nicht?"
                options: ["Mein Heft ist 30 m lang.", "Mein Stift ist 15 cm lang.", "Die Tür ist 2 m hoch."]
                answer: "Mein Heft ist 30 m lang."
                hints:
                  - "Achte auf die Einheit."
                  - "30 m wären länger als zwei Busse."
                  - "Mein Heft ist 30 m lang."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Der Teppich ist etwa 3 große Schritte lang. Wie lang ist er ungefähr?"
                say: "Der Teppich ist etwa drei große Schritte lang. Wie lang ist er ungefähr?"
                options: ["3 m", "3 cm", "30 m"]
                answer: "3 m"
                hints: ["Ein großer Schritt ist etwa 1 m."]
              - id: l2-s2
                type: multiple_choice
                text: "Die Schachtel ist etwa 5 Fingerbreiten lang. Wie lang ist sie ungefähr?"
                say: "Die Schachtel ist etwa fünf Fingerbreiten lang. Wie lang ist sie ungefähr?"
                options: ["5 cm", "5 m", "50 cm"]
                answer: "5 cm"
                hints: ["Eine Fingerbreite ist etwa 1 cm."]
              - id: l2-s3
                type: multiple_choice
                text: "Das Regal ist etwa so hoch wie 2 Türen übereinander. Wie hoch ist es ungefähr?"
                say: "Das große Regal in der Bibliothek ist etwa so hoch wie zwei Türen übereinander. Eine Tür ist etwa zwei Meter hoch. Wie hoch ist das Regal ungefähr?"
                options: ["4 m", "4 cm", "40 m"]
                answer: "4 m"
                hints: ["Zweimal 2 m."]
              - id: l2-s4
                type: true_false
                text: "Tim schätzt seinen Stift auf 15 cm. Er misst 14 cm. Hat er gut geschätzt?"
                say: "Tim schätzt, dass sein Stift fünfzehn Zentimeter lang ist. Er misst vierzehn Zentimeter. Hat er gut geschätzt?"
                answer: true
                hints: ["Eine Schätzung muss nur ungefähr passen."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Schätzung passt nicht?"
                say: "Mia schätzt drei Dinge. Welche Schätzung passt nicht?"
                options: ["Das Auto ist 4 cm lang.", "Das Bett ist 2 m lang.", "Der Löffel ist 15 cm lang."]
                answer: "Das Auto ist 4 cm lang."
                hints: ["Achte auf die Einheit."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Der Gartenzaun ist etwa 20 große Schritte lang. Wie lang ist er ungefähr?"
                say: "Der Gartenzaun ist etwa zwanzig große Schritte lang. Wie lang ist er ungefähr?"
                options: ["20 m", "20 cm", "200 m"]
                answer: "20 m"
              - id: l2-n2
                type: multiple_choice
                text: "Die Kerze ist etwa so lang wie 1 Stift. Wie lang ist sie ungefähr?"
                say: "Die Kerze ist etwa so lang wie ein Stift. Wie lang ist sie ungefähr?"
                options: ["15 cm", "15 m", "1 cm"]
                answer: "15 cm"
              - id: l2-n3
                type: multiple_choice
                text: "Der Wurm ist etwa 8 Fingerbreiten lang. Wie lang ist er ungefähr?"
                say: "Der Regenwurm ist etwa acht Fingerbreiten lang. Wie lang ist er ungefähr?"
                options: ["8 cm", "8 m", "80 cm"]
                answer: "8 cm"
              - id: l2-n4
                type: true_false
                text: "Ali schätzt das Zimmer auf 5 m. Er misst 5 m 10 cm. Hat er gut geschätzt?"
                say: "Ali schätzt, dass sein Zimmer fünf Meter lang ist. Er misst fünf Meter zehn. Hat er gut geschätzt?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welche Schätzung passt nicht?"
                say: "Paul schätzt drei Dinge. Welche Schätzung passt nicht?"
                options: ["Der Bus ist 12 cm lang.", "Die Tafel ist 3 m lang.", "Das Buch ist 30 cm lang."]
                answer: "Der Bus ist 12 cm lang."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie lang ist ein Fahrrad ungefähr?"
            say: "Wie lang ist ein Fahrrad ungefähr?"
            options: ["2 m", "2 cm", "20 m"]
            answer: "2 m"
          - id: l2-c2
            type: multiple_choice
            text: "Wie breit ist ein Fingernagel ungefähr?"
            say: "Wie breit ist der Nagel an deinem kleinen Finger ungefähr?"
            options: ["1 cm", "1 m", "10 cm"]
            answer: "1 cm"
          - id: l2-c3
            type: multiple_choice
            text: "Die Bank ist etwa 2 große Schritte lang. Wie lang ist sie ungefähr?"
            say: "Die Bank im Park ist etwa zwei große Schritte lang. Wie lang ist sie ungefähr?"
            options: ["2 m", "2 cm", "20 m"]
            answer: "2 m"
          - id: l2-c4
            type: multiple_choice
            text: "Welche Schätzung passt nicht?"
            say: "Lisa schätzt drei Dinge. Welche Schätzung passt nicht?"
            options: ["Die Ameise ist 1 m lang.", "Die Tür ist 2 m hoch.", "Der Stift ist 15 cm lang."]
            answer: "Die Ameise ist 1 m lang."
          - id: l2-c5
            type: true_false
            text: "Eine Schätzung muss genau stimmen."
            say: "Stimmt das? Eine Schätzung muss ganz genau stimmen."
            answer: false
