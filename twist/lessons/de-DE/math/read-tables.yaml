# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.read-tables
skill: math.data.read-tables
curriculum: de-DE
language: de
title:
  de: Tabellen lesen
  en: Reading tables
summary: >
  Lesson 1 reads a table with two columns (Eissorte und Kinder, Bücher in
  den Ferien, Tiere auf dem Bauernhof): find the row, read across, and
  answer questions about the most, the fewest, how many more and how
  many together; lesson 2 reads tables with rows and columns, where the
  answer stands where a row and a column meet (Runden an drei Tagen, ein
  Stundenplan, ein Wochenkalender), and ends with the skill check.
  Filling in a table yourself waits for a table task.
metadata:
  year: klasse-2
  topic: { de: Daten, en: Data }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.data.tally]
  also_practises: [math.add-sub-to-100.add-two-digit, math.data.tally]
  vocabulary: { de: [Tabelle, Zeile, Spalte, ablesen, Stundenplan, Kalender, am meisten, am wenigsten, insgesamt] }
  forms: [text, audio, drawn]
  drawn: [bar-chart]
  facets: []
  misconceptions:
    - id: neighbour-row
      what: Reads the number from the row above or below the one asked for
      addressed: lesson 1 Learn finds the row first and reads across; l1-f1 (with feedback), l1-s1 and l1-n1 offer the numbers of the neighbouring rows
    - id: row-column-mixed
      what: In a table with rows and columns reads along the wrong line (the other child's number, or the wrong day)
      addressed: lesson 2 Learn finds the cell where a row and a column meet; l2-f1 (with feedback), l2-s4, l2-n1 and l2-c1 offer the number from the other row or column
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Eine Tabelle lesen", en: "Reading a table" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Striche sind es?"
            say: "Wie viele Striche sind es?"
            show: { drawn: bar-chart, tally: true, rows: [["", 7]] }
            options: ["7", "2", "8"]
            answer: "7"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Farbe mögen die meisten?"
            say: "Welche Farbe mögen die meisten Kinder?"
            show: { drawn: bar-chart, tally: true, rows: [["Rot", 4], ["Blau", 6], ["Gelb", 3]] }
            options: ["Blau", "Rot", "Gelb"]
            answer: "Blau"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Eissorte | Kinder\nSchoko | 8\nErdbeere | 6\nVanille | 5"
            say: "Das ist eine Tabelle. In der obersten Zeile steht, was in den Spalten steht: links die Eissorte, rechts wie viele Kinder sie mögen."
          - text: "Eissorte | Kinder\nSchoko | 8\nErdbeere | 6\nVanille | 5"
            say: "Wie viele Kinder mögen Erdbeere? Such zuerst die Zeile mit Erdbeere. Dann geh in dieser Zeile nach rechts: sechs Kinder."
          - text: "Schoko 8, Vanille 5\n8 − 5 = 3"
            say: "Wie viele Kinder mehr mögen Schoko als Vanille? Lies beide Zahlen ab: acht und fünf. Acht minus fünf ist drei. Drei Kinder mehr."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Bücher in den Ferien\nKind | Bücher\nLea | 7\nTim | 4\nMia | 9\nBen | 5\nWie viele Bücher hat Mia gelesen?"
                say: "Die Tabelle zeigt, wie viele Bücher die Kinder in den Ferien gelesen haben. Wie viele Bücher hat Mia gelesen?"
                options: ["9", "5", "4"]
                answer: "9"
                feedback:
                  "5": "5 steht in der Zeile darunter, bei Ben. Bleib in Mias Zeile."
                  "4": "4 steht in der Zeile darüber, bei Tim. Bleib in Mias Zeile."
                hints:
                  - "Such zuerst die Zeile mit Mia."
                  - "Geh in Mias Zeile nach rechts."
                  - "9 Bücher."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Bücher in den Ferien\nKind | Bücher\nLea | 7\nTim | 4\nMia | 9\nBen | 5\nWer hat die meisten Bücher gelesen?"
                say: "Wer hat die meisten Bücher gelesen?"
                options: ["Mia", "Lea", "Ben"]
                answer: "Mia"
                hints:
                  - "Die meisten heißt: die größte Zahl."
                  - "Vergleiche 7, 4, 9 und 5."
                  - "Mia hat 9 Bücher gelesen."
              - id: l1-f3
                type: multiple_choice
                text: "Bücher in den Ferien\nKind | Bücher\nLea | 7\nTim | 4\nMia | 9\nBen | 5\nWie viele Bücher hat Lea mehr gelesen als Tim?"
                say: "Wie viele Bücher hat Lea mehr gelesen als Tim?"
                options: ["3", "11", "4"]
                answer: "3"
                hints:
                  - "Lies die Zahlen von Lea und von Tim ab."
                  - "Lea 7, Tim 4. Rechne 7 − 4."
                  - "3 Bücher mehr."
              - id: l1-f4
                type: true_false
                text: "Bücher in den Ferien\nKind | Bücher\nLea | 7\nTim | 4\nMia | 9\nBen | 5\nBen hat 5 Bücher gelesen."
                say: "Stimmt das? Ben hat fünf Bücher gelesen."
                answer: true
                hints:
                  - "Such die Zeile mit Ben."
                  - "Was steht bei Ben rechts?"
                  - "Ja, Ben hat 5 Bücher gelesen."
              - id: l1-f5
                type: multiple_choice
                text: "Bücher in den Ferien\nKind | Bücher\nLea | 7\nTim | 4\nMia | 9\nBen | 5\nWie viele Bücher haben Lea und Tim zusammen gelesen?"
                say: "Wie viele Bücher haben Lea und Tim zusammen gelesen?"
                options: ["11", "3", "7"]
                answer: "11"
                hints:
                  - "Zusammen heißt: plus."
                  - "7 + 4."
                  - "11 Bücher."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Tiere auf dem Bauernhof\nTier | Anzahl\nHühner | 12\nKühe | 8\nSchafe | 15\nPferde | 3\nWie viele Kühe gibt es?"
                say: "Die Tabelle zeigt die Tiere auf einem Bauernhof. Wie viele Kühe gibt es?"
                options: ["8", "12", "15"]
                answer: "8"
                hints: ["Such die Zeile mit den Kühen und bleib in dieser Zeile."]
              - id: l1-s2
                type: multiple_choice
                text: "Tiere auf dem Bauernhof\nTier | Anzahl\nHühner | 12\nKühe | 8\nSchafe | 15\nPferde | 3\nVon welchem Tier gibt es am wenigsten?"
                say: "Von welchem Tier gibt es am wenigsten?"
                options: ["Pferde", "Kühe", "Schafe"]
                answer: "Pferde"
                hints: ["Am wenigsten heißt: die kleinste Zahl."]
              - id: l1-s3
                type: multiple_choice
                text: "Tiere auf dem Bauernhof\nTier | Anzahl\nHühner | 12\nKühe | 8\nSchafe | 15\nPferde | 3\nWie viele Schafe gibt es mehr als Hühner?"
                say: "Wie viele Schafe gibt es mehr als Hühner?"
                options: ["3", "27", "4"]
                answer: "3"
                hints: ["Rechne 15 − 12."]
              - id: l1-s4
                type: true_false
                text: "Tiere auf dem Bauernhof\nTier | Anzahl\nHühner | 12\nKühe | 8\nSchafe | 15\nPferde | 3\nEs gibt 15 Hühner."
                say: "Stimmt das? Es gibt fünfzehn Hühner."
                answer: false
                hints: ["Such die Zeile mit den Hühnern."]
              - id: l1-s5
                type: multiple_choice
                text: "Tiere auf dem Bauernhof\nTier | Anzahl\nHühner | 12\nKühe | 8\nSchafe | 15\nPferde | 3\nWie viele Kühe und Pferde sind es zusammen?"
                say: "Wie viele Kühe und Pferde sind es zusammen?"
                options: ["11", "5", "9"]
                answer: "11"
                hints: ["Rechne 8 + 3."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Sport nach der Schule\nSport | Kinder\nFußball | 14\nSchwimmen | 9\nTurnen | 6\nTanzen | 11\nWie viele Kinder turnen?"
                say: "Die Tabelle zeigt, welchen Sport die Kinder nach der Schule machen. Wie viele Kinder turnen?"
                options: ["6", "9", "11"]
                answer: "6"
              - id: l1-n2
                type: multiple_choice
                text: "Sport nach der Schule\nSport | Kinder\nFußball | 14\nSchwimmen | 9\nTurnen | 6\nTanzen | 11\nWelchen Sport machen die meisten Kinder?"
                say: "Welchen Sport machen die meisten Kinder?"
                options: ["Fußball", "Tanzen", "Schwimmen"]
                answer: "Fußball"
              - id: l1-n3
                type: multiple_choice
                text: "Sport nach der Schule\nSport | Kinder\nFußball | 14\nSchwimmen | 9\nTurnen | 6\nTanzen | 11\nWie viele Kinder mehr spielen Fußball als tanzen?"
                say: "Wie viele Kinder mehr spielen Fußball als tanzen?"
                options: ["3", "25", "5"]
                answer: "3"
              - id: l1-n4
                type: true_false
                text: "Sport nach der Schule\nSport | Kinder\nFußball | 14\nSchwimmen | 9\nTurnen | 6\nTanzen | 11\n9 Kinder schwimmen."
                say: "Stimmt das? Neun Kinder schwimmen."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Sport nach der Schule\nSport | Kinder\nFußball | 14\nSchwimmen | 9\nTurnen | 6\nTanzen | 11\nWie viele Kinder schwimmen oder turnen?"
                say: "Wie viele Kinder schwimmen oder turnen, zusammen?"
                options: ["15", "3", "14"]
                answer: "15"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Klasse | Kinder\n2a | 24\n2b | 22\n2c | 25\nWie viele Kinder sind in der 2b?"
            say: "Die Tabelle zeigt, wie viele Kinder in jeder Klasse sind. Wie viele Kinder sind in der zwei b?"
            options: ["22", "24", "25"]
            answer: "22"
          - id: l1-c2
            type: multiple_choice
            text: "Klasse | Kinder\n2a | 24\n2b | 22\n2c | 25\nWelche Klasse hat die meisten Kinder?"
            say: "Welche Klasse hat die meisten Kinder?"
            options: ["2c", "2a", "2b"]
            answer: "2c"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Klasse | Kinder\n2a | 24\n2b | 22\n2c | 25\nIn der 2a sind 2 Kinder mehr als in der 2b."
            say: "Stimmt das? In der zwei a sind zwei Kinder mehr als in der zwei b."
            answer: true

  - n: 2
    title: { de: "Zeilen und Spalten", en: "Rows and columns" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Bücher in den Ferien\nKind | Bücher\nLea | 7\nTim | 4\nMia | 9\nBen | 5\nWie viele Bücher hat Tim gelesen?"
            say: "Wie viele Bücher hat Tim gelesen?"
            options: ["4", "7", "9"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Tiere auf dem Bauernhof\nTier | Anzahl\nHühner | 12\nKühe | 8\nSchafe | 15\nPferde | 3\nVon welchem Tier gibt es die meisten?"
            say: "Von welchem Tier gibt es die meisten?"
            options: ["Schafe", "Hühner", "Kühe"]
            answer: "Schafe"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Gelesene Seiten\nKind | Mo | Di | Mi\nLea | 3 | 5 | 2\nTim | 4 | 1 | 6"
            say: "Diese Tabelle hat Zeilen und Spalten. In jeder Zeile steht ein Kind, in jeder Spalte ein Tag: Montag, Dienstag, Mittwoch. Die Zahlen sagen, wie viele Seiten das Kind an diesem Tag gelesen hat."
          - text: "Gelesene Seiten\nKind | Mo | Di | Mi\nLea | 3 | 5 | 2\nTim | 4 | 1 | 6"
            say: "Wie viele Seiten hat Tim am Dienstag gelesen? Geh in Tims Zeile. Dann such die Spalte Di. Wo sich Zeile und Spalte treffen, steht die Antwort: eine Seite."
          - text: "Stundenplan\nTag | 1. Stunde | 2. Stunde\nMontag | Deutsch | Mathe\nDienstag | Sport | Deutsch"
            say: "Auch ein Stundenplan ist eine Tabelle. Was hast du am Dienstag in der ersten Stunde? Zeile Dienstag, Spalte erste Stunde: Sport."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Gelaufene Runden\nKind | Mo | Di | Mi\nEmil | 4 | 6 | 5\nNora | 7 | 3 | 8\nWie viele Runden ist Nora am Dienstag gelaufen?"
                say: "Die Tabelle zeigt, wie viele Runden Emil und Nora auf dem Sportplatz gelaufen sind. Wie viele Runden ist Nora am Dienstag gelaufen?"
                options: ["3", "6", "7"]
                answer: "3"
                feedback:
                  "6": "6 steht bei Emil. Bleib in Noras Zeile und geh bis zur Spalte Di."
                  "7": "7 steht bei Montag. Geh in Noras Zeile weiter bis zur Spalte Di."
                hints:
                  - "Such zuerst Noras Zeile, dann die Spalte Di."
                  - "Wo treffen sich Noras Zeile und die Spalte Di?"
                  - "3 Runden."
              - id: l2-f2
                type: multiple_choice
                text: "Gelaufene Runden\nKind | Mo | Di | Mi\nEmil | 4 | 6 | 5\nNora | 7 | 3 | 8\nAn welchem Tag ist Emil die meisten Runden gelaufen?"
                say: "An welchem Tag ist Emil die meisten Runden gelaufen?"
                options: ["Montag", "Dienstag", "Mittwoch"]
                answer: "Dienstag"
                keep_order: true
                hints:
                  - "Bleib in Emils Zeile."
                  - "Emil: 4, 6 und 5. Welche Zahl ist am größten?"
                  - "Am Dienstag, 6 Runden."
              - id: l2-f3
                type: multiple_choice
                text: "Gelaufene Runden\nKind | Mo | Di | Mi\nEmil | 4 | 6 | 5\nNora | 7 | 3 | 8\nWie viele Runden ist Nora insgesamt gelaufen?"
                say: "Wie viele Runden ist Nora an allen drei Tagen zusammen gelaufen?"
                options: ["18", "8", "15"]
                answer: "18"
                hints:
                  - "Zähl alle Zahlen in Noras Zeile zusammen."
                  - "7 + 3 + 8."
                  - "18 Runden."
              - id: l2-f4
                type: true_false
                text: "Gelaufene Runden\nKind | Mo | Di | Mi\nEmil | 4 | 6 | 5\nNora | 7 | 3 | 8\nAm Mittwoch ist Nora mehr Runden gelaufen als Emil."
                say: "Stimmt das? Am Mittwoch ist Nora mehr Runden gelaufen als Emil."
                answer: true
                hints:
                  - "Schau nur in die Spalte Mi."
                  - "Emil 5, Nora 8."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Stundenplan\nTag | 1. Stunde | 2. Stunde\nMontag | Deutsch | Mathe\nDienstag | Sport | Deutsch\nMittwoch | Mathe | Kunst\nWas hat die Klasse am Mittwoch in der 2. Stunde?"
                say: "Das ist der Stundenplan der Klasse. Was hat die Klasse am Mittwoch in der zweiten Stunde?"
                options: ["Kunst", "Mathe", "Deutsch"]
                answer: "Kunst"
                hints:
                  - "Such die Zeile Mittwoch und die Spalte 2. Stunde."
                  - "Am Mittwoch: zuerst Mathe, dann ..."
                  - "Kunst."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Stundenplan\nTag | 1. Stunde | 2. Stunde\nMontag | Deutsch | Mathe\nDienstag | Sport | Deutsch\nMittwoch | Mathe | Kunst\nWas hat die Klasse am Montag in der 1. Stunde?"
                say: "Was hat die Klasse am Montag in der ersten Stunde?"
                options: ["Deutsch", "Mathe", "Sport"]
                answer: "Deutsch"
                hints: ["Zeile Montag, Spalte 1. Stunde."]
              - id: l2-s2
                type: multiple_choice
                text: "Stundenplan\nTag | 1. Stunde | 2. Stunde\nMontag | Deutsch | Mathe\nDienstag | Sport | Deutsch\nMittwoch | Mathe | Kunst\nAn welchem Tag hat die Klasse Sport?"
                say: "An welchem Tag hat die Klasse Sport?"
                options: ["Montag", "Dienstag", "Mittwoch"]
                answer: "Dienstag"
                keep_order: true
                hints: ["Such das Wort Sport. In welcher Zeile steht es?"]
              - id: l2-s3
                type: true_false
                text: "Stundenplan\nTag | 1. Stunde | 2. Stunde\nMontag | Deutsch | Mathe\nDienstag | Sport | Deutsch\nMittwoch | Mathe | Kunst\nAm Mittwoch hat die Klasse in der 1. Stunde Mathe."
                say: "Stimmt das? Am Mittwoch hat die Klasse in der ersten Stunde Mathe."
                answer: true
                hints: ["Zeile Mittwoch, Spalte 1. Stunde."]
              - id: l2-s4
                type: multiple_choice
                text: "Gesammelte Kastanien\nKind | Mo | Di | Mi\nIda | 12 | 9 | 15\nJonas | 10 | 14 | 8\nWie viele Kastanien hat Jonas am Montag gesammelt?"
                say: "Die Tabelle zeigt, wie viele Kastanien Ida und Jonas gesammelt haben. Wie viele Kastanien hat Jonas am Montag gesammelt?"
                options: ["10", "12", "14"]
                answer: "10"
                hints: ["Jonas' Zeile, Spalte Mo."]
              - id: l2-s5
                type: multiple_choice
                text: "Gesammelte Kastanien\nKind | Mo | Di | Mi\nIda | 12 | 9 | 15\nJonas | 10 | 14 | 8\nWer hat am Dienstag mehr Kastanien gesammelt?"
                say: "Wer hat am Dienstag mehr Kastanien gesammelt?"
                options: ["Jonas", "Ida"]
                answer: "Jonas"
                hints: ["Schau nur in die Spalte Di."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Gesammelte Kastanien\nKind | Mo | Di | Mi\nIda | 12 | 9 | 15\nJonas | 10 | 14 | 8\nWie viele Kastanien hat Ida am Mittwoch gesammelt?"
                say: "Wie viele Kastanien hat Ida am Mittwoch gesammelt?"
                options: ["15", "8", "9"]
                answer: "15"
              - id: l2-n2
                type: multiple_choice
                text: "Gesammelte Kastanien\nKind | Mo | Di | Mi\nIda | 12 | 9 | 15\nJonas | 10 | 14 | 8\nWie viele Kastanien hat Jonas insgesamt gesammelt?"
                say: "Wie viele Kastanien hat Jonas an allen drei Tagen zusammen gesammelt?"
                options: ["32", "14", "30"]
                answer: "32"
              - id: l2-n3
                type: true_false
                text: "Gesammelte Kastanien\nKind | Mo | Di | Mi\nIda | 12 | 9 | 15\nJonas | 10 | 14 | 8\nAm Montag hat Ida 2 Kastanien mehr gesammelt als Jonas."
                say: "Stimmt das? Am Montag hat Ida zwei Kastanien mehr gesammelt als Jonas."
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Paulas Woche\nTag | Termin\nMontag | Schwimmen\nMittwoch | Flöte\nFreitag | Fußball\nWann geht Paula zum Fußball?"
                say: "Das ist Paulas Wochenkalender. Wann geht Paula zum Fußball?"
                options: ["am Freitag", "am Mittwoch", "am Montag"]
                answer: "am Freitag"
              - id: l2-n5
                type: multiple_choice
                text: "Paulas Woche\nTag | Termin\nMontag | Schwimmen\nMittwoch | Flöte\nFreitag | Fußball\nWas macht Paula am Mittwoch?"
                say: "Was macht Paula am Mittwoch?"
                options: ["Flöte", "Schwimmen", "Fußball"]
                answer: "Flöte"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Gelesene Seiten\nKind | Mo | Di | Mi\nLea | 3 | 5 | 2\nTim | 4 | 1 | 6\nWie viele Seiten hat Lea am Mittwoch gelesen?"
            say: "Wie viele Seiten hat Lea am Mittwoch gelesen?"
            options: ["2", "6", "5"]
            answer: "2"
          - id: l2-c2
            type: multiple_choice
            text: "Gelesene Seiten\nKind | Mo | Di | Mi\nLea | 3 | 5 | 2\nTim | 4 | 1 | 6\nAn welchem Tag hat Tim die meisten Seiten gelesen?"
            say: "An welchem Tag hat Tim die meisten Seiten gelesen?"
            options: ["Montag", "Dienstag", "Mittwoch"]
            answer: "Mittwoch"
            keep_order: true
          - id: l2-c3
            type: multiple_choice
            text: "Gelesene Seiten\nKind | Mo | Di | Mi\nLea | 3 | 5 | 2\nTim | 4 | 1 | 6\nWie viele Seiten hat Tim insgesamt gelesen?"
            say: "Wie viele Seiten hat Tim an allen drei Tagen zusammen gelesen?"
            options: ["11", "6", "10"]
            answer: "11"
          - id: l2-c4
            type: multiple_choice
            text: "Lieblingsobst\nObst | Kinder\nApfel | 9\nBanane | 7\nTrauben | 12\nWie viele Kinder mehr mögen Trauben als Bananen?"
            say: "Wie viele Kinder mehr mögen Trauben als Bananen?"
            options: ["5", "19", "3"]
            answer: "5"
          - id: l2-c5
            type: multiple_choice
            text: "Stundenplan\nTag | 1. Stunde | 2. Stunde\nDonnerstag | Musik | Mathe\nFreitag | Deutsch | Sport\nWas hat die Klasse am Freitag in der 2. Stunde?"
            say: "Was hat die Klasse am Freitag in der zweiten Stunde?"
            options: ["Sport", "Deutsch", "Mathe"]
            answer: "Sport"
