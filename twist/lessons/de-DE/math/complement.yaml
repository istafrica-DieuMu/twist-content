# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.complement
skill: math.add-sub-to-100.complement
curriculum: de-DE
language: de
title:
  de: Ergänzen bis zum Zehner und bis 100
  en: Making the next ten and 100
summary: >
  Finding what to add to reach the next ten and to reach 100
  (37 + _ = 40, 64 + _ = 100). Lesson 1 fills up to the next ten with the
  Zehnerfreunde of the ones; lesson 2 fills up to 100 in two jumps, first
  to the next ten, then the tens, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.ones-bridge]
  also_practises: [math.add-sub-to-20.missing-addend, math.numbers-to-100.hundred-field]
  vocabulary: { de: [ergänzen, nächster Zehner, Zehnerfreunde, bis 100] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich, hundred-field]
  facets: []
  misconceptions:
    - id: gives-the-total
      what: Answers with the ten or with 100 instead of the missing part (37 + _ = 40 answered 40)
      addressed: Learn asks "Wie viel fehlt?"; the target is an option with feedback in l1-f1 and l2-f1
    - id: tens-to-100-off-by-ten
      what: Makes both the tens and the ones up to ten (64 + _ = 100 answered 46, from 6 + 4 and 4 + 6), which gives 110
      addressed: lesson 2 Learn makes the jump to 70 first, then 30; the both-up-to-ten answer (52 for 58) is an option with feedback in l2-f2
    - id: ones-not-complemented
      what: Gives the ones digit instead of its Zehnerfreund (37 + _ = 40 answered 7)
      addressed: hints name the Zehnerfreund of the ones; 7 is an option with feedback in l1-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Bis zum nächsten Zehner, en: Up to the next ten }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "7 + _ = 10"
            say: "Sieben plus wie viel gleich zehn?"
            options: ["3", "7", "10"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "36 + 4 = _"
            say: "Sechsunddreißig plus vier."
            answer: "40"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "37 + _ = 40"
            say: "Siebenunddreißig plus wie viel gleich vierzig? Wie viel fehlt bis zum nächsten Zehner?"
          - text: "7 + 3 = 10"
            say: "Schau auf die Einer: sieben. Der Zehnerfreund von sieben ist drei. Sieben und drei sind zehn."
          - text: "37 + 3 = 40"
            say: "Also fehlen drei. Siebenunddreißig plus drei gleich vierzig."
            show: { drawn: rechenstrich, start: 37, jumps: [3] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "27 + _ = 30"
                say: "Siebenundzwanzig plus wie viel gleich dreißig?"
                options: ["3", "7", "30"]
                answer: "3"
                feedback:
                  "7": "7 sind die Einer von 27. Gesucht ist der Zehnerfreund der 7."
                  "30": "Dreißig ist das Ziel. Gesucht ist, wie viel bis dahin fehlt."
                hints:
                  - "Schau auf die Einer: sieben."
                  - "Sieben und wie viel sind zehn?"
                  - "Drei."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "54 + _ = 60"
                say: "Vierundfünfzig plus wie viel gleich sechzig?"
                answer: "6"
                hints:
                  - "Die Einer sind vier."
                  - "Der Zehnerfreund von vier ist sechs."
                  - "6."
              - id: l1-f3
                type: multiple_choice
                text: "81: Wie viel fehlt bis zum nächsten Zehner?"
                say: "Einundachtzig. Wie viel fehlt bis zum nächsten Zehner?"
                show: { drawn: rechenstrich, start: 81, jumps: [] }
                options: ["9", "1", "19"]
                answer: "9"
                hints:
                  - "Der nächste Zehner nach 81 ist 90."
                  - "Eins und wie viel sind zehn?"
                  - "9."
              - id: l1-f4
                type: fill_in_blank
                text: "Ergänze bis zum nächsten Zehner."
                say: "Ergänze dreiundzwanzig bis zum nächsten Zehner."
                frame: "23 + _ = _"
                options: ["7", "30", "3", "20"]
                answer: ["7", "30"]
                hints:
                  - "Der nächste Zehner ist 30."
                  - "Drei und sieben sind zehn."
                  - "23 + 7 = 30."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 68 + 2 = 70"
                say: "Achtundsechzig plus zwei gleich siebzig. Stimmt das?"
                answer: true
                hints:
                  - "Acht und zwei sind Zehnerfreunde."
                  - "Aus 68 wird der volle Zehner 70."
                  - "Ja."
              - id: l1-f6
                type: text_input
                text: "15 + _ = 20"
                say: "Fünfzehn plus wie viel gleich zwanzig?"
                answer: "5"
                hints:
                  - "Die Einer sind fünf."
                  - "Fünf und fünf sind zehn."
                  - "5."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "42 + _ = 50"
                say: "Zweiundvierzig plus wie viel gleich fünfzig?"
                answer: "8"
                hints: ["Welcher Zehnerfreund gehört zu den Einern?"]
              - id: l1-s2
                type: multiple_choice
                text: "76 + _ = 80"
                say: "Sechsundsiebzig plus wie viel gleich achtzig?"
                options: ["4", "6", "14"]
                answer: "4"
                hints: ["Schau nur auf die Einer."]
              - id: l1-s3
                type: fill_in_blank
                text: "Ergänze bis zum nächsten Zehner."
                say: "Ergänze neunundfünfzig bis zum nächsten Zehner."
                frame: "59 + _ = _"
                options: ["1", "60", "9", "50"]
                answer: ["1", "60"]
                hints: ["Welcher Zehner kommt nach 59?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 33 + 3 = 40"
                say: "Dreiunddreißig plus drei gleich vierzig. Stimmt das?"
                answer: false
                hints: ["Sind drei und drei Zehnerfreunde?"]
              - id: l1-s5
                type: text_input
                text: "88 + _ = 90"
                say: "Achtundachtzig plus wie viel gleich neunzig?"
                answer: "2"
                hints: ["Welcher Zehnerfreund gehört zu acht?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "61 + _ = 70"
                say: "Einundsechzig plus wie viel gleich siebzig?"
                answer: "9"
              - id: l1-n2
                type: multiple_choice
                text: "45: Wie viel fehlt bis zum nächsten Zehner?"
                say: "Fünfundvierzig. Wie viel fehlt bis zum nächsten Zehner?"
                options: ["5", "15", "50"]
                answer: "5"
              - id: l1-n3
                type: fill_in_blank
                text: "Ergänze bis zum nächsten Zehner."
                say: "Ergänze siebenundneunzig bis zum nächsten Zehner."
                frame: "97 + _ = _"
                options: ["3", "100", "7", "90"]
                answer: ["3", "100"]
              - id: l1-n4
                type: text_input
                text: "26 + _ = 30"
                say: "Sechsundzwanzig plus wie viel gleich dreißig?"
                answer: "4"
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 52 + 8 = 60"
                say: "Zweiundfünfzig plus acht gleich sechzig. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "73 + _ = 80"
            say: "Dreiundsiebzig plus wie viel gleich achtzig?"
            answer: "7"
          - id: l1-c2
            type: multiple_choice
            text: "39 + _ = 40"
            say: "Neununddreißig plus wie viel gleich vierzig?"
            options: ["1", "9", "40"]
            answer: "1"
          - id: l1-c3
            type: fill_in_blank
            text: "Ergänze bis zum nächsten Zehner."
            say: "Ergänze vierundachtzig bis zum nächsten Zehner."
            frame: "84 + _ = _"
            options: ["6", "90", "4", "80"]
            answer: ["6", "90"]

  - n: 2
    title: { de: Bis 100, en: Up to 100 }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "47 + _ = 50"
            say: "Siebenundvierzig plus wie viel gleich fünfzig?"
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "70 + _ = 100"
            say: "Siebzig plus wie viel gleich hundert?"
            options: ["30", "3", "40"]
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "64 + _ = 100"
            say: "Vierundsechzig plus wie viel gleich hundert? Im Hunderterfeld sind vierundsechzig Punkte. Wie viele fehlen?"
            show: { drawn: hundred-field, filled: 64 }
          - text: "64 + 6 = 70 | 70 + 30 = 100"
            say: "Erst bis zum nächsten Zehner: plus sechs, das ist siebzig. Dann die Zehner bis hundert: plus dreißig."
            show: { drawn: rechenstrich, start: 64, jumps: [6, 30] }
          - text: "6 + 30 = 36"
            say: "Zusammen sind das sechs und dreißig: sechsunddreißig. Vierundsechzig plus sechsunddreißig gleich hundert."
          - text: "64 + 36 = 100"
            say: "So prüfst du: Vier Einer und sechs Einer sind zehn Einer, also ein Zehner. Sechs Zehner und drei Zehner sind neun Zehner. Neun Zehner und ein Zehner sind hundert."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "80 + _ = 100"
                say: "Achtzig plus wie viel gleich hundert?"
                show: { drawn: hundred-field, filled: 80 }
                options: ["20", "2", "100"]
                answer: "20"
                feedback:
                  "100": "Hundert ist das Ziel. Gesucht ist, wie viel bis dahin fehlt."
                  "2": "Es fehlen zwei Reihen. Jede Reihe hat zehn."
                hints:
                  - "Zähl die leeren Reihen."
                  - "Zwei Reihen fehlen, das sind zwei Zehner."
                  - "20."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "58 + _ = 100"
                say: "Achtundfünfzig plus wie viel gleich hundert? Welches Ergebnis stimmt?"
                options: ["42", "52", "50"]
                answer: "42"
                feedback:
                  "52": "Mit 52 kommst du auf 110. Bis 60 fehlen zwei, dann noch vier Zehner."
                  "50": "Mit 50 kommst du auf 108. Erst zwei bis 60, dann vierzig."
                hints:
                  - "Erst bis zum nächsten Zehner: 60."
                  - "58 + 2 = 60, 60 + 40 = 100."
                  - "2 und 40: 42."
              - id: l2-f3
                type: fill_in_blank
                text: "Ergänze in zwei Sprüngen."
                say: "Ergänze dreiundfünfzig bis hundert. Erst bis zum nächsten Zehner, dann die Zehner."
                frame: "53 + _ = 60 | 60 + _ = 100 | 53 + _ = 100"
                options: ["7", "40", "47", "57"]
                answer: ["7", "40", "47"]
                hints:
                  - "Drei und sieben sind zehn."
                  - "Von 60 bis 100 sind vier Zehner."
                  - "7 und 40: 47."
              - id: l2-f4
                type: text_input
                text: "28 + _ = 100"
                say: "Achtundzwanzig plus wie viel gleich hundert?"
                show: { drawn: rechenstrich, start: 28, jumps: [2, 70] }
                answer: "72"
                hints:
                  - "Erst zwei bis 30."
                  - "Dann siebzig bis 100."
                  - "72."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 45 + 55 = 100"
                say: "Fünfundvierzig plus fünfundfünfzig gleich hundert. Stimmt das?"
                answer: true
                hints:
                  - "Fünf Einer und fünf Einer sind ein Zehner."
                  - "Vier Zehner, fünf Zehner und dieser Zehner sind zehn Zehner."
                  - "Ja."
              - id: l2-f6
                type: text_input
                text: "90 + _ = 100"
                say: "Neunzig plus wie viel gleich hundert?"
                answer: "10"
                hints:
                  - "Neunzig ist schon ein voller Zehner."
                  - "Ein Zehner fehlt."
                  - "10."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "71 + _ = 100"
                say: "Einundsiebzig plus wie viel gleich hundert?"
                answer: "29"
                hints: ["Erst bis zum nächsten Zehner, dann die Zehner bis hundert."]
              - id: l2-s2
                type: fill_in_blank
                text: "Ergänze in zwei Sprüngen."
                say: "Ergänze sechsunddreißig bis hundert. Erst bis zum nächsten Zehner, dann die Zehner."
                frame: "36 + _ = 40 | 40 + _ = 100 | 36 + _ = 100"
                options: ["4", "60", "64", "74"]
                answer: ["4", "60", "64"]
                hints: ["Welcher Zehnerfreund gehört zu sechs?"]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Aufgabe ergibt 100?"
                say: "Welche Aufgabe ergibt hundert?"
                options: ["82 + 18", "82 + 28", "82 + 8"]
                answer: "82 + 18"
                hints: ["Ergeben die Einer zehn?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 57 + 53 = 100"
                say: "Siebenundfünfzig plus dreiundfünfzig gleich hundert. Stimmt das?"
                answer: false
                hints: ["Zähl die Zehner: Sind es mit dem neuen Zehner aus den Einern genau zehn?"]
              - id: l2-s5
                type: text_input
                text: "40 + _ = 100"
                say: "Vierzig plus wie viel gleich hundert?"
                show: { drawn: hundred-field, filled: 40 }
                answer: "60"
                hints: ["Zähl die leeren Reihen."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "65 + _ = 100"
                say: "Fünfundsechzig plus wie viel gleich hundert?"
                answer: "35"
              - id: l2-n2
                type: fill_in_blank
                text: "Ergänze in zwei Sprüngen."
                say: "Ergänze neunzehn bis hundert. Erst bis zum nächsten Zehner, dann die Zehner."
                frame: "19 + _ = 20 | 20 + _ = 100 | 19 + _ = 100"
                options: ["1", "80", "81", "91"]
                answer: ["1", "80", "81"]
              - id: l2-n3
                type: multiple_choice
                text: "Welche Aufgabe ergibt 100?"
                say: "Welche Aufgabe ergibt hundert?"
                options: ["33 + 77", "33 + 67", "33 + 70"]
                answer: "33 + 67"
              - id: l2-n4
                type: text_input
                text: "94 + _ = 100"
                say: "Vierundneunzig plus wie viel gleich hundert?"
                answer: "6"
              - id: l2-n5
                type: true_false
                text: "Stimmt das? 12 + 88 = 100"
                say: "Zwölf plus achtundachtzig gleich hundert. Stimmt das?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "48 + _ = 50"
            say: "Achtundvierzig plus wie viel gleich fünfzig?"
            answer: "2"
          - id: l2-c2
            type: text_input
            text: "37 + _ = 100"
            say: "Siebenunddreißig plus wie viel gleich hundert?"
            answer: "63"
          - id: l2-c3
            type: fill_in_blank
            text: "Ergänze in zwei Sprüngen."
            say: "Ergänze vierundsiebzig bis hundert. Erst bis zum nächsten Zehner, dann die Zehner."
            frame: "74 + _ = 80 | 80 + _ = 100 | 74 + _ = 100"
            options: ["6", "20", "26", "36"]
            answer: ["6", "20", "26"]
          - id: l2-c4
            type: multiple_choice
            text: "Welche Aufgabe ergibt 100?"
            say: "Welche Aufgabe ergibt hundert?"
            options: ["51 + 49", "51 + 59", "51 + 40"]
            answer: "51 + 49"
          - id: l2-c5
            type: multiple_choice
            text: "62: Wie viel fehlt bis zum nächsten Zehner?"
            say: "Zweiundsechzig. Wie viel fehlt bis zum nächsten Zehner?"
            options: ["8", "2", "38"]
            answer: "8"
