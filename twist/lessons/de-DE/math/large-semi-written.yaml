# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.large-semi-written
skill: math.add-sub-to-1000.large-semi-written
curriculum: de-DE
language: de
title:
  de: Große Zahlen halbschriftlich
  en: Informal written methods with large numbers
summary: >
  Adding and subtracting four-digit numbers halbschriftlich, with an
  Überschlag first. Lesson 1 rounds both numbers to thousands for the
  Überschlag and adds schrittweise (4 600 + 2 350: first the thousands,
  then the hundreds, then the tens); lesson 2 subtracts schrittweise,
  compares the result with the Überschlag to catch mistakes, and ends
  with the skill check. Numbers on screen are written with a space
  (4 600); typed answers are plain digits.
metadata:
  year: klasse-4
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-1000.large-mental, math.add-sub-to-1000.estimate]
  also_practises: [math.add-sub-to-1000.large-mental]
  vocabulary: { de: [halbschriftlich, schrittweise, Überschlag, ungefähr, runden] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: lost-step
      what: Starts the next step from the first number instead of the last result
      addressed: Learn writes each result into the next step; a "Wo ist der Fehler?" task in every stage of lesson 1, with feedback in l1-f3
    - id: skip-estimate
      what: Does not compare the result with the Überschlag, so a big mistake (a lost step, plus instead of minus) goes unnoticed
      addressed: lesson 2 Learn catches a lost step with the Überschlag; a "Passt das zum Überschlag?" task in every stage of both lessons, each wrong result far from its Überschlag
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Überschlagen und schrittweise addieren, en: "Estimate, then add in steps" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 000 + 7 000 = _"
            say: "Sechstausend plus siebentausend."
            answer: "13000"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Runde 4 380 auf Tausender."
            say: "Runde viertausenddreihundertachtzig auf Tausender."
            options: ["4 000", "5 000", "4 400"]
            answer: "4 000"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4 600 + 2 350 ≈ 5 000 + 2 000 = 7 000"
            say: "Bevor du rechnest, überschlägst du: Runde beide Zahlen auf Tausender. Viertausendsechshundert ist ungefähr fünftausend, zweitausenddreihundertfünfzig ist ungefähr zweitausend. Fünftausend plus zweitausend ist siebentausend. Das Ergebnis liegt also ungefähr bei siebentausend."
          - text: "4 600 + 2 000 = 6 600 · 6 600 + 300 = 6 900 · 6 900 + 50 = 6 950"
            say: "Jetzt schrittweise: Erst die Tausender dazu, dann die Hunderter, dann die Zehner. Jedes Ergebnis ist der Anfang vom nächsten Schritt."
          - text: "6 950 ≈ 7 000 ✓"
            say: "Sechstausendneunhundertfünfzig liegt nah bei siebentausend. Das Ergebnis passt zum Überschlag."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Überschlag: 3 800 + 5 100 ≈ ?"
                say: "Mach den Überschlag für dreitausendachthundert plus fünftausendeinhundert. Runde auf Tausender."
                options: ["9 000", "8 000", "90 000"]
                answer: "9 000"
                hints:
                  - "Runde 3 800 und 5 100 auf Tausender."
                  - "4 000 + 5 000."
                  - "9 000."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Rechne schrittweise: 5 200 + 3 450"
                say: "Fünftausendzweihundert plus dreitausendvierhundertfünfzig. Rechne schrittweise."
                frame: "5 200 + 3 000 = _ · 8 200 + 400 = _ · 8 600 + 50 = _"
                options: ["8 200", "8 600", "8 650", "8 250"]
                answer: ["8 200", "8 600", "8 650"]
                hints:
                  - "Erst die Tausender, dann die Hunderter, dann die Zehner."
                  - "5 200 + 3 000 = 8 200."
                  - "8 200, 8 600, 8 650."
              - id: l1-f3
                type: multiple_choice
                text: "Wo ist der Fehler? 2 700 + 4 000 = 6 700 · 2 700 + 600 = 3 300 · 3 300 + 20 = 3 320"
                say: "Mia hat zweitausendsiebenhundert plus viertausendsechshundertzwanzig schrittweise gerechnet. In welchem Schritt ist der Fehler?"
                options: ["2 700 + 4 000 = 6 700", "2 700 + 600 = 3 300", "3 300 + 20 = 3 320"]
                answer: "2 700 + 600 = 3 300"
                feedback:
                  "3 300 + 20 = 3 320": "Dieser Schritt ist richtig gerechnet. Der Fehler passiert vorher: Der zweite Schritt fängt wieder mit 2 700 an."
                hints:
                  - "Mit welcher Zahl fängt jeder Schritt an?"
                  - "Der zweite Schritt muss mit 6 700 anfangen."
                  - "Richtig ist 6 700 + 600 = 7 300."
              - id: l1-f4
                type: text_input
                text: "4 300 + 2 500 = _"
                say: "Viertausenddreihundert plus zweitausendfünfhundert. Rechne schrittweise."
                answer: "6800"
                hints:
                  - "Erst 4 300 + 2 000."
                  - "Dann noch 500 dazu."
                  - "6 800. Tippe 6800."
              - id: l1-f5
                type: true_false
                text: "Passt das zum Überschlag? 6 100 + 2 800 = 8 900"
                say: "Sechstausendeinhundert plus zweitausendachthundert ist achttausendneunhundert. Passt das zum Überschlag?"
                answer: true
                hints:
                  - "Überschlag: 6 000 + 3 000."
                  - "Das sind 9 000. Liegt 8 900 nah daran?"
                  - "Ja, das passt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Überschlag: 6 900 + 2 200 ≈ ?"
                say: "Mach den Überschlag für sechstausendneunhundert plus zweitausendzweihundert. Runde auf Tausender."
                options: ["8 000", "9 000", "10 000"]
                answer: "9 000"
                hints: ["Runde beide Zahlen auf Tausender."]
              - id: l1-s2
                type: fill_in_blank
                text: "Rechne schrittweise: 3 600 + 4 270"
                say: "Dreitausendsechshundert plus viertausendzweihundertsiebzig. Rechne schrittweise."
                frame: "3 600 + 4 000 = _ · 7 600 + 200 = _ · 7 800 + 70 = _"
                options: ["7 600", "7 800", "7 870", "7 670"]
                answer: ["7 600", "7 800", "7 870"]
                hints: ["Jedes Ergebnis ist der Anfang vom nächsten Schritt."]
              - id: l1-s3
                type: multiple_choice
                text: "Wo ist der Fehler? 5 400 + 2 000 = 7 400 · 7 400 + 300 = 7 700 · 7 400 + 60 = 7 460"
                say: "Tom hat fünftausendvierhundert plus zweitausenddreihundertsechzig schrittweise gerechnet. In welchem Schritt ist der Fehler?"
                options: ["5 400 + 2 000 = 7 400", "7 400 + 300 = 7 700", "7 400 + 60 = 7 460"]
                answer: "7 400 + 60 = 7 460"
                hints: ["Prüf bei jedem Schritt die erste Zahl."]
              - id: l1-s4
                type: text_input
                text: "2 450 + 3 300 = _"
                say: "Zweitausendvierhundertfünfzig plus dreitausenddreihundert. Rechne schrittweise."
                answer: "5750"
                hints: ["Erst die Tausender, dann die Hunderter."]
              - id: l1-s5
                type: true_false
                text: "Passt das zum Überschlag? 3 900 + 4 200 = 4 100"
                say: "Dreitausendneunhundert plus viertausendzweihundert ist viertausendeinhundert. Passt das zum Überschlag?"
                answer: false
                hints: ["Wie groß ist der Überschlag?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Überschlag: 7 200 + 1 900 ≈ ?"
                say: "Mach den Überschlag für siebentausendzweihundert plus tausendneunhundert. Runde auf Tausender."
                options: ["9 000", "8 000", "11 000"]
                answer: "9 000"
              - id: l1-n2
                type: fill_in_blank
                text: "Rechne schrittweise: 6 300 + 2 540"
                say: "Sechstausenddreihundert plus zweitausendfünfhundertvierzig. Rechne schrittweise."
                frame: "6 300 + 2 000 = _ · 8 300 + 500 = _ · 8 800 + 40 = _"
                options: ["8 300", "8 800", "8 840", "8 340"]
                answer: ["8 300", "8 800", "8 840"]
              - id: l1-n3
                type: multiple_choice
                text: "Wo ist der Fehler? 1 800 + 5 000 = 6 800 · 6 800 + 100 = 6 900 · 6 900 + 30 = 6 930"
                say: "Lea hat tausendachthundert plus fünftausendeinhundertdreißig schrittweise gerechnet. Ist ein Schritt falsch?"
                options: ["kein Fehler", "1 800 + 5 000 = 6 800", "6 900 + 30 = 6 930"]
                answer: "kein Fehler"
              - id: l1-n4
                type: text_input
                text: "5 600 + 3 350 = _"
                say: "Fünftausendsechshundert plus dreitausenddreihundertfünfzig. Rechne schrittweise."
                answer: "8950"
              - id: l1-n5
                type: true_false
                text: "Passt das zum Überschlag? 4 800 + 3 100 = 7 900"
                say: "Viertausendachthundert plus dreitausendeinhundert ist siebentausendneunhundert. Passt das zum Überschlag?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Überschlag: 2 800 + 6 300 ≈ ?"
            say: "Mach den Überschlag für zweitausendachthundert plus sechstausenddreihundert. Runde auf Tausender."
            options: ["9 000", "8 000", "10 000"]
            answer: "9 000"
          - id: l1-c2
            type: fill_in_blank
            text: "Rechne schrittweise: 4 100 + 3 680"
            say: "Viertausendeinhundert plus dreitausendsechshundertachtzig. Rechne schrittweise."
            frame: "4 100 + 3 000 = _ · 7 100 + 600 = _ · 7 700 + 80 = _"
            options: ["7 100", "7 700", "7 780", "7 180"]
            answer: ["7 100", "7 700", "7 780"]
          - id: l1-c3
            type: text_input
            text: "3 200 + 5 400 = _"
            say: "Dreitausendzweihundert plus fünftausendvierhundert. Rechne schrittweise."
            answer: "8600"

  - n: 2
    title: { de: Schrittweise subtrahieren und prüfen, en: Subtract in steps and check }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Überschlag: 5 900 + 3 200 ≈ ?"
            say: "Mach den Überschlag für fünftausendneunhundert plus dreitausendzweihundert. Runde auf Tausender."
            options: ["9 000", "8 000", "10 000"]
            answer: "9 000"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "2 300 + 4 600 = _"
            say: "Zweitausenddreihundert plus viertausendsechshundert. Rechne schrittweise."
            answer: "6900"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 950 − 3 100 ≈ 9 000 − 3 000 = 6 000"
            say: "Achttausendneunhundertfünfzig minus dreitausendeinhundert. Auch beim Minusrechnen überschlägst du zuerst: neuntausend minus dreitausend ist sechstausend."
          - text: "8 950 − 3 000 = 5 950 · 5 950 − 100 = 5 850"
            say: "Dann schrittweise: Erst die Tausender weg, dann die Hunderter. Fünftausendachthundertfünfzig liegt nah bei sechstausend. Das passt zum Überschlag."
          - text: "Ben: 8 400 − 3 000 = 5 400 · 8 400 − 200 = 8 200 · Überschlag: 8 000 − 3 000 = 5 000 ✗"
            say: "Ben rechnet achttausendvierhundert minus dreitausendzweihundert und hat achttausendzweihundert heraus. Der Überschlag ist fünftausend. Achttausendzweihundert ist weit weg davon, das passt nicht. Ben hat im zweiten Schritt wieder mit achttausendvierhundert angefangen. Richtig ist fünftausendzweihundert."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne schrittweise: 9 480 − 4 200"
                say: "Neuntausendvierhundertachtzig minus viertausendzweihundert. Rechne schrittweise."
                frame: "9 480 − 4 000 = _ · 5 480 − 200 = _"
                options: ["5 480", "5 280", "5 680", "13 480"]
                answer: ["5 480", "5 280"]
                hints:
                  - "Erst die Tausender weg, dann die Hunderter."
                  - "9 480 − 4 000 = 5 480."
                  - "5 480, dann 5 280."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Passt das zum Überschlag? 6 800 − 2 100 = 8 900"
                say: "Sechstausendachthundert minus zweitausendeinhundert ist achttausendneunhundert. Passt das zum Überschlag?"
                answer: false
                hints:
                  - "Überschlag: 7 000 − 2 000."
                  - "Das sind 5 000. Liegt 8 900 nah daran?"
                  - "Nein, das passt nicht. 8 900 wäre plus gerechnet. Richtig ist 4 700."
              - id: l2-f3
                type: multiple_choice
                text: "Überschlag: 9 200 − 3 900 ≈ ?"
                say: "Mach den Überschlag für neuntausendzweihundert minus dreitausendneunhundert. Runde auf Tausender."
                options: ["5 000", "6 000", "13 000"]
                answer: "5 000"
                hints:
                  - "Runde beide Zahlen auf Tausender."
                  - "9 000 − 4 000."
                  - "5 000."
              - id: l2-f4
                type: text_input
                text: "7 650 − 2 300 = _"
                say: "Siebentausendsechshundertfünfzig minus zweitausenddreihundert. Rechne schrittweise."
                answer: "5350"
                hints:
                  - "Erst 7 650 − 2 000."
                  - "Dann noch 300 weg."
                  - "5 350. Tippe 5350."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Ergebnis passt zum Überschlag? 8 400 − 5 100"
                say: "Achttausendvierhundert minus fünftausendeinhundert. Welches Ergebnis passt zum Überschlag?"
                options: ["3 300", "13 500", "330"]
                answer: "3 300"
                hints:
                  - "Überschlag: 8 000 − 5 000."
                  - "Das sind 3 000."
                  - "3 300."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne schrittweise: 6 590 − 3 400"
                say: "Sechstausendfünfhundertneunzig minus dreitausendvierhundert. Rechne schrittweise."
                frame: "6 590 − 3 000 = _ · 3 590 − 400 = _"
                options: ["3 590", "3 190", "3 990", "9 590"]
                answer: ["3 590", "3 190"]
                hints: ["Jedes Ergebnis ist der Anfang vom nächsten Schritt."]
              - id: l2-s2
                type: true_false
                text: "Passt das zum Überschlag? 9 100 − 4 800 = 4 300"
                say: "Neuntausendeinhundert minus viertausendachthundert ist viertausenddreihundert. Passt das zum Überschlag?"
                answer: true
                hints: ["Wie groß ist der Überschlag?"]
              - id: l2-s3
                type: multiple_choice
                text: "Überschlag: 7 800 − 2 100 ≈ ?"
                say: "Mach den Überschlag für siebentausendachthundert minus zweitausendeinhundert. Runde auf Tausender."
                options: ["5 000", "6 000", "10 000"]
                answer: "6 000"
                hints: ["Runde beide Zahlen auf Tausender."]
              - id: l2-s4
                type: text_input
                text: "5 870 − 1 500 = _"
                say: "Fünftausendachthundertsiebzig minus tausendfünfhundert. Rechne schrittweise."
                answer: "4370"
                hints: ["Erst die Tausender, dann die Hunderter."]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Ergebnis passt zum Überschlag? 6 300 − 2 900"
                say: "Sechstausenddreihundert minus zweitausendneunhundert. Welches Ergebnis passt zum Überschlag?"
                options: ["9 200", "3 400", "340"]
                answer: "3 400"
                hints: ["Mach zuerst den Überschlag."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Rechne schrittweise: 8 260 − 5 100"
                say: "Achttausendzweihundertsechzig minus fünftausendeinhundert. Rechne schrittweise."
                frame: "8 260 − 5 000 = _ · 3 260 − 100 = _"
                options: ["3 260", "3 160", "3 360", "13 260"]
                answer: ["3 260", "3 160"]
              - id: l2-n2
                type: true_false
                text: "Passt das zum Überschlag? 7 300 − 3 200 = 7 100"
                say: "Siebentausenddreihundert minus dreitausendzweihundert ist siebentausendeinhundert. Passt das zum Überschlag?"
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Überschlag: 8 900 − 6 200 ≈ ?"
                say: "Mach den Überschlag für achttausendneunhundert minus sechstausendzweihundert. Runde auf Tausender."
                options: ["3 000", "2 000", "15 000"]
                answer: "3 000"
              - id: l2-n4
                type: text_input
                text: "9 750 − 4 300 = _"
                say: "Neuntausendsiebenhundertfünfzig minus viertausenddreihundert. Rechne schrittweise."
                answer: "5450"
              - id: l2-n5
                type: multiple_choice
                text: "Welches Ergebnis passt zum Überschlag? 5 600 − 1 800"
                say: "Fünftausendsechshundert minus tausendachthundert. Welches Ergebnis passt zum Überschlag?"
                options: ["380", "7 400", "3 800"]
                answer: "3 800"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Überschlag: 4 900 + 3 800 ≈ ?"
            say: "Mach den Überschlag für viertausendneunhundert plus dreitausendachthundert. Runde auf Tausender."
            options: ["9 000", "8 000", "7 000"]
            answer: "9 000"
          - id: l2-c2
            type: fill_in_blank
            text: "Rechne schrittweise: 3 400 + 5 270"
            say: "Dreitausendvierhundert plus fünftausendzweihundertsiebzig. Rechne schrittweise."
            frame: "3 400 + 5 000 = _ · 8 400 + 200 = _ · 8 600 + 70 = _"
            options: ["8 400", "8 600", "8 670", "8 470"]
            answer: ["8 400", "8 600", "8 670"]
          - id: l2-c3
            type: text_input
            text: "8 640 − 3 200 = _"
            say: "Achttausendsechshundertvierzig minus dreitausendzweihundert. Rechne schrittweise."
            answer: "5440"
          - id: l2-c4
            type: true_false
            text: "Passt das zum Überschlag? 9 300 − 2 800 = 8 500"
            say: "Neuntausenddreihundert minus zweitausendachthundert ist achttausendfünfhundert. Passt das zum Überschlag?"
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Welches Ergebnis passt zum Überschlag? 7 100 − 3 900"
            say: "Siebentausendeinhundert minus dreitausendneunhundert. Welches Ergebnis passt zum Überschlag?"
            options: ["3 200", "11 000", "320"]
            answer: "3 200"
