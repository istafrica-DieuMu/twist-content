# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.circles-compass
skill: math.shapes.circles-compass
curriculum: de-DE
language: de
title:
  de: Kreise mit dem Zirkel
  en: Circles with compasses
summary: >
  Lesson 1 names Mittelpunkt, Kreislinie and Radius (jeder Punkt der
  Kreislinie ist gleich weit vom Mittelpunkt entfernt) and finds that a
  circle is twice as wide as its radius; lesson 2 opens the Zirkel on the
  Lineal to the radius, draws circles and Kreisbögen in words, works with
  circles around one Mittelpunkt, and ends with the skill check. Drawing a
  circle with the compass waits for a drawing task.
metadata:
  year: klasse-4
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.lines-segments]
  also_practises: [math.length.cm-m]
  vocabulary: { de: [Kreis, Mittelpunkt, Kreislinie, Radius, Zirkel, Spitze, Mine, Kreisbogen] }
  forms: [text, audio, drawn]
  drawn: [ruler, shape]
  facets: [units]
  misconceptions:
    - id: radius-is-whole-width
      what: Takes the radius for the whole width of the circle, so opens the compass to the width it wants the circle to have
      addressed: lesson 1 Learn says a circle with 3 cm radius is 6 cm wide; l1-f3 and l2-f1 offer the doubled length with feedback, l2-f3, l2-s3 and l2-n3 ask how far to open the compass for a given width, with feedback in l2-f3
    - id: radius-changes-with-direction
      what: Thinks points on the Kreislinie can be different distances from the Mittelpunkt, or that the compass may open further while drawing
      addressed: lesson 1 Learn says every point of the Kreislinie is the same distance away; l1-f2, l1-s2 and l2-f4 ask about it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mittelpunkt und Radius", en: "Centre and radius" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie heißt diese Form?"
            say: "Wie heißt diese Form?"
            show: { drawn: shape, kind: circle, colour: blue }
            options: ["Kreis", "Kugel", "Rechteck"]
            answer: "Kreis"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie lang ist die Strecke?"
            say: "Die Strecke fängt bei null an. Wie lang ist sie?"
            show: { drawn: ruler, to: 10, length: 4 }
            options: ["4 cm", "5 cm", "3 cm"]
            answer: "4 cm"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Mittelpunkt und Kreislinie"
            say: "Jeder Kreis hat einen Mittelpunkt. Die runde Linie heißt Kreislinie. Jeder Punkt der Kreislinie ist gleich weit vom Mittelpunkt entfernt."
            show: { drawn: shape, kind: circle, colour: green }
          - text: "Der Radius ist hier 3 cm lang."
            say: "Die Strecke vom Mittelpunkt bis zur Kreislinie heißt Radius. Bei diesem Kreis ist der Radius drei Zentimeter lang. In jede Richtung ist es derselbe Abstand."
            show: { drawn: ruler, to: 10, length: 3, colour: blue }
          - text: "3 cm Radius: Der Kreis ist 6 cm breit."
            say: "Quer durch den ganzen Kreis ist es doppelt so weit. Von der Kreislinie zum Mittelpunkt sind es drei Zentimeter, und vom Mittelpunkt zur anderen Seite noch einmal drei. Ein Kreis mit drei Zentimetern Radius ist also sechs Zentimeter breit."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißt die Strecke vom Mittelpunkt bis zur Kreislinie?"
                say: "Wie heißt die Strecke vom Mittelpunkt bis zur Kreislinie?"
                options: ["Radius", "Kreislinie", "Mittelpunkt"]
                answer: "Radius"
                hints:
                  - "Die Kreislinie ist die runde Linie, der Mittelpunkt ein Punkt."
                  - "Gesucht ist eine gerade Strecke von innen nach außen."
                  - "Radius."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Alle Punkte der Kreislinie sind gleich weit vom Mittelpunkt entfernt."
                say: "Stimmt das? Alle Punkte der Kreislinie sind gleich weit vom Mittelpunkt entfernt."
                answer: true
                hints:
                  - "Denk daran, wie ein Kreis aussieht. Gibt es Stellen, die weiter weg sind?"
                  - "Ein Kreis ist überall gleich rund."
                  - "Ja, das stimmt."
              - id: l1-f3
                type: multiple_choice
                text: "Ein Kreis hat 4 cm Radius. Wie weit ist ein Punkt der Kreislinie vom Mittelpunkt entfernt?"
                say: "Ein Kreis hat einen Radius von vier Zentimetern. Wie weit ist ein Punkt der Kreislinie vom Mittelpunkt entfernt?"
                options: ["4 cm", "8 cm", "2 cm"]
                answer: "4 cm"
                feedback:
                  "8 cm": "8 cm ist der Weg quer durch den ganzen Kreis. Vom Mittelpunkt bis zur Kreislinie sind es nur 4 cm."
                  "2 cm": "Der Radius geht vom Mittelpunkt bis zur Kreislinie. Er ist hier 4 cm lang."
                hints:
                  - "Was ist der Radius?"
                  - "Der Radius ist genau der Weg vom Mittelpunkt bis zur Kreislinie."
                  - "4 cm."
              - id: l1-f4
                type: multiple_choice
                text: "Der Streifen geht vom Mittelpunkt bis zur Kreislinie. Wie lang ist der Radius?"
                say: "Der Streifen geht vom Mittelpunkt bis zur Kreislinie. Wie lang ist der Radius?"
                show: { drawn: ruler, to: 10, length: 5 }
                options: ["5 cm", "10 cm", "6 cm"]
                answer: "5 cm"
                hints:
                  - "Lies ab, wo der Streifen aufhört."
                  - "Er fängt bei 0 an und hört bei 5 auf."
                  - "5 cm."
              - id: l1-f5
                type: multiple_choice
                text: "Ein Kreis hat 2 cm Radius. Wie breit ist er quer durch den Mittelpunkt?"
                say: "Ein Kreis hat einen Radius von zwei Zentimetern. Wie breit ist er quer durch den Mittelpunkt?"
                options: ["4 cm", "2 cm", "3 cm"]
                answer: "4 cm"
                hints:
                  - "Quer durch den Kreis gehst du zweimal den Radius."
                  - "2 cm bis zum Mittelpunkt und 2 cm weiter."
                  - "4 cm."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wo liegt der Mittelpunkt?"
                say: "Wo liegt der Mittelpunkt eines Kreises?"
                options: ["genau in der Mitte des Kreises", "auf der Kreislinie", "außerhalb des Kreises"]
                answer: "genau in der Mitte des Kreises"
                hints: ["Der Name sagt es schon."]
              - id: l1-s2
                type: true_false
                text: "Misst du den Radius in eine andere Richtung, ist er länger."
                say: "Stimmt das? Misst du den Radius in eine andere Richtung, ist er länger."
                answer: false
                hints: ["Jeder Punkt der Kreislinie ist gleich weit vom Mittelpunkt entfernt."]
              - id: l1-s3
                type: multiple_choice
                text: "Der Streifen geht vom Mittelpunkt bis zur Kreislinie. Wie lang ist der Radius?"
                say: "Der Streifen geht vom Mittelpunkt bis zur Kreislinie. Wie lang ist der Radius?"
                show: { drawn: ruler, to: 10, length: 6, colour: green }
                options: ["6 cm", "12 cm", "3 cm"]
                answer: "6 cm"
                hints: ["Der Streifen zeigt genau den Radius."]
              - id: l1-s4
                type: multiple_choice
                text: "Ein Kreis ist quer durch den Mittelpunkt 10 cm breit. Wie lang ist sein Radius?"
                say: "Ein Kreis ist quer durch den Mittelpunkt zehn Zentimeter breit. Wie lang ist sein Radius?"
                options: ["5 cm", "10 cm", "20 cm"]
                answer: "5 cm"
                hints: ["Der Radius ist die Hälfte der Breite."]
              - id: l1-s5
                type: multiple_choice
                text: "Welcher Kreis ist größer?"
                say: "Welcher Kreis ist größer?"
                options: ["der Kreis mit 5 cm Radius", "der Kreis mit 3 cm Radius", "beide gleich groß"]
                answer: "der Kreis mit 5 cm Radius"
                hints: ["Je länger der Radius, desto weiter geht die Kreislinie nach außen."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ein Kreis hat 7 cm Radius. Wie weit ist die Kreislinie vom Mittelpunkt entfernt?"
                say: "Ein Kreis hat einen Radius von sieben Zentimetern. Wie weit ist die Kreislinie vom Mittelpunkt entfernt?"
                options: ["7 cm", "14 cm", "0 cm"]
                answer: "7 cm"
              - id: l1-n2
                type: true_false
                text: "Der Mittelpunkt liegt auf der Kreislinie."
                say: "Stimmt das? Der Mittelpunkt liegt auf der Kreislinie."
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Der Streifen geht vom Mittelpunkt bis zur Kreislinie. Er fängt bei 2 an. Wie lang ist der Radius?"
                say: "Der Streifen geht vom Mittelpunkt bis zur Kreislinie. Er fängt am Lineal bei zwei an. Wie lang ist der Radius?"
                show: { drawn: ruler, to: 10, start: 2, length: 4, colour: blue }
                options: ["4 cm", "6 cm", "2 cm"]
                answer: "4 cm"
              - id: l1-n4
                type: text_input
                text: "Ein Kreis hat 6 cm Radius. Wie viele cm ist er quer durch den Mittelpunkt breit?"
                say: "Ein Kreis hat einen Radius von sechs Zentimetern. Wie viele Zentimeter ist er quer durch den Mittelpunkt breit?"
                answer: "12"
              - id: l1-n5
                type: multiple_choice
                text: "Eine runde Pizza hat 15 cm Radius. Wie breit ist sie?"
                say: "Eine runde Pizza hat einen Radius von fünfzehn Zentimetern. Wie breit ist sie?"
                options: ["30 cm", "15 cm", "45 cm"]
                answer: "30 cm"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist der Radius?"
            say: "Was ist der Radius?"
            options: ["die Strecke vom Mittelpunkt bis zur Kreislinie", "die Strecke quer durch den ganzen Kreis", "die runde Linie"]
            answer: "die Strecke vom Mittelpunkt bis zur Kreislinie"
          - id: l1-c2
            type: multiple_choice
            text: "Ein Kreis hat 9 cm Radius. Wie weit ist jeder Punkt der Kreislinie vom Mittelpunkt entfernt?"
            say: "Ein Kreis hat einen Radius von neun Zentimetern. Wie weit ist jeder Punkt der Kreislinie vom Mittelpunkt entfernt?"
            options: ["9 cm", "18 cm", "4 cm"]
            answer: "9 cm"
          - id: l1-c3
            type: text_input
            text: "Ein Kreis ist quer durch den Mittelpunkt 8 cm breit. Wie viele cm ist sein Radius lang?"
            say: "Ein Kreis ist quer durch den Mittelpunkt acht Zentimeter breit. Wie viele Zentimeter ist sein Radius lang?"
            answer: "4"

  - n: 2
    title: { de: "Mit dem Zirkel zeichnen", en: "Drawing with compasses" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie heißt der Punkt in der Mitte des Kreises?"
            say: "Wie heißt der Punkt in der Mitte des Kreises?"
            options: ["Mittelpunkt", "Radius", "Kreislinie"]
            answer: "Mittelpunkt"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Ein Kreis hat 3 cm Radius. Wie viele cm ist er quer durch den Mittelpunkt breit?"
            say: "Ein Kreis hat einen Radius von drei Zentimetern. Wie viele Zentimeter ist er quer durch den Mittelpunkt breit?"
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Den Zirkel auf 4 cm öffnen"
            say: "Du willst einen Kreis mit vier Zentimetern Radius zeichnen. Stell die Spitze des Zirkels auf die Null am Lineal. Öffne ihn, bis die Mine auf der Vier steht. Jetzt ist der Zirkel vier Zentimeter weit offen."
            show: { drawn: ruler, to: 10, length: 4 }
          - text: "Spitze in den Mittelpunkt, dann einmal herumdrehen"
            say: "Stich die Spitze in den Mittelpunkt. Halte den Zirkel oben am Griff und dreh ihn einmal ganz herum. Die Mine zeichnet die Kreislinie. Die Spitze bleibt im Mittelpunkt, und der Zirkel bleibt gleich weit offen."
          - text: "Kreisbogen und Zielscheibe"
            say: "Drehst du den Zirkel nur ein Stück weit, entsteht ein Kreisbogen. Zeichnest du um denselben Mittelpunkt Kreise mit verschiedenen Radien, sieht es aus wie eine Zielscheibe."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Der Zirkel ist so weit offen wie der Streifen. Welchen Radius hat der Kreis?"
                say: "Der Zirkel ist so weit geöffnet wie der Streifen. Welchen Radius hat der Kreis, den du damit zeichnest?"
                show: { drawn: ruler, to: 10, length: 3, colour: green }
                options: ["3 cm", "6 cm", "4 cm"]
                answer: "3 cm"
                feedback:
                  "6 cm": "6 cm ist der Kreis breit. Die Öffnung des Zirkels ist der Radius, also 3 cm."
                hints:
                  - "Die Spitze kommt in den Mittelpunkt, die Mine zeichnet die Kreislinie."
                  - "Die Öffnung des Zirkels ist genau der Weg vom Mittelpunkt bis zur Kreislinie."
                  - "3 cm."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wohin stichst du die Spitze des Zirkels?"
                say: "Du zeichnest einen Kreis. Wohin stichst du die Spitze des Zirkels?"
                options: ["in den Mittelpunkt", "auf die Kreislinie", "irgendwo neben den Kreis"]
                answer: "in den Mittelpunkt"
                hints:
                  - "Die Mine dreht sich um die Spitze herum."
                  - "Die Spitze bleibt in der Mitte stehen."
                  - "In den Mittelpunkt."
              - id: l2-f3
                type: multiple_choice
                text: "Der Kreis soll 10 cm breit sein. Wie weit öffnest du den Zirkel?"
                say: "Du willst einen Kreis zeichnen, der zehn Zentimeter breit ist. Wie weit öffnest du den Zirkel?"
                options: ["5 cm", "10 cm", "20 cm"]
                answer: "5 cm"
                feedback:
                  "10 cm": "Mit 10 cm Öffnung wird der Radius 10 cm. Dann ist der Kreis 20 cm breit. Du brauchst die Hälfte."
                  "20 cm": "Der Zirkel wird so weit geöffnet wie der Radius. Der Radius ist die Hälfte der Breite."
                hints:
                  - "Die Öffnung des Zirkels ist der Radius."
                  - "Der Radius ist die Hälfte der Breite. Die Hälfte von 10 ist 5."
                  - "5 cm."
              - id: l2-f4
                type: true_false
                text: "Während du zeichnest, darf sich der Zirkel weiter öffnen."
                say: "Stimmt das? Während du den Kreis zeichnest, darf sich der Zirkel weiter öffnen."
                answer: false
                hints:
                  - "Was passiert mit dem Abstand zum Mittelpunkt, wenn er sich öffnet?"
                  - "Dann wäre die Kreislinie an einer Stelle weiter weg. Das ist dann kein Kreis mehr."
                  - "Nein, der Zirkel bleibt gleich weit offen."
              - id: l2-f5
                type: multiple_choice
                text: "Du drehst den Zirkel nur ein Stück weit. Was entsteht?"
                say: "Du drehst den Zirkel nicht ganz herum, sondern nur ein Stück weit. Was entsteht?"
                options: ["ein Kreisbogen", "ein ganzer Kreis", "eine gerade Strecke"]
                answer: "ein Kreisbogen"
                hints:
                  - "Die Mine zeichnet nur einen Teil der Kreislinie."
                  - "Ein Teil der Kreislinie ist gebogen."
                  - "Ein Kreisbogen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Der Zirkel ist so weit offen wie der Streifen. Welchen Radius hat der Kreis?"
                say: "Der Zirkel ist so weit geöffnet wie der Streifen. Welchen Radius hat der Kreis?"
                show: { drawn: ruler, to: 10, length: 7, colour: blue }
                options: ["7 cm", "14 cm", "8 cm"]
                answer: "7 cm"
                hints: ["Die Öffnung ist der Radius."]
              - id: l2-s2
                type: true_false
                text: "Bei einer Zielscheibe haben alle Kreise denselben Mittelpunkt."
                say: "Stimmt das? Bei einer Zielscheibe haben alle Kreise denselben Mittelpunkt."
                answer: true
                hints: ["Wo ist bei jedem Kreis die Mitte?"]
              - id: l2-s3
                type: multiple_choice
                text: "Der Kreis soll 4 cm breit sein. Wie weit öffnest du den Zirkel?"
                say: "Ein Kreis soll vier Zentimeter breit sein. Wie weit öffnest du den Zirkel?"
                options: ["2 cm", "4 cm", "8 cm"]
                answer: "2 cm"
                hints: ["Du brauchst die Hälfte der Breite."]
              - id: l2-s4
                type: multiple_choice
                text: "Zwei Kreise haben denselben Mittelpunkt. Ihre Radien sind 2 cm und 5 cm. Wie weit liegen die Kreislinien auseinander?"
                say: "Zwei Kreise haben denselben Mittelpunkt. Der eine hat zwei Zentimeter Radius, der andere fünf. Wie weit liegen die beiden Kreislinien auseinander?"
                options: ["3 cm", "7 cm", "5 cm"]
                answer: "3 cm"
                hints: ["Beide fangen im selben Mittelpunkt an. Wie viel länger ist der große Radius?"]
                difficulty: stretch
              - id: l2-s5
                type: multiple_choice
                text: "Was zeichnet die Mine des Zirkels?"
                say: "Was zeichnet die Mine des Zirkels?"
                options: ["die Kreislinie", "den Mittelpunkt", "den Radius"]
                answer: "die Kreislinie"
                hints: ["Die Mine dreht sich außen herum."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Der Zirkel ist so weit offen wie der Streifen. Welchen Radius hat der Kreis?"
                say: "Der Zirkel ist so weit geöffnet wie der Streifen. Welchen Radius hat der Kreis?"
                show: { drawn: ruler, to: 15, length: 9 }
                options: ["9 cm", "18 cm", "10 cm"]
                answer: "9 cm"
              - id: l2-n2
                type: true_false
                text: "Die Spitze des Zirkels bleibt beim Zeichnen im Mittelpunkt."
                say: "Stimmt das? Die Spitze des Zirkels bleibt beim Zeichnen im Mittelpunkt."
                answer: true
              - id: l2-n3
                type: text_input
                text: "Ein Kreis soll 14 cm breit sein. Wie viele cm weit öffnest du den Zirkel?"
                say: "Ein Kreis soll vierzehn Zentimeter breit sein. Wie viele Zentimeter weit öffnest du den Zirkel?"
                answer: "7"
              - id: l2-n4
                type: multiple_choice
                text: "Du öffnest den Zirkel weiter. Was passiert mit dem Kreis?"
                say: "Du öffnest den Zirkel weiter. Was passiert mit dem Kreis?"
                options: ["Er wird größer.", "Er wird kleiner.", "Er bleibt gleich groß."]
                answer: "Er wird größer."
                keep_order: true
              - id: l2-n5
                type: multiple_choice
                text: "Drei Kreise haben denselben Mittelpunkt. Ihre Radien sind 1 cm, 2 cm und 3 cm. Wie breit ist der größte Kreis?"
                say: "Drei Kreise haben denselben Mittelpunkt. Ihre Radien sind ein, zwei und drei Zentimeter. Wie breit ist der größte Kreis?"
                options: ["6 cm", "3 cm", "9 cm"]
                answer: "6 cm"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Die Spitze steht bei 1, die Mine bei 6. Welchen Radius hat der Kreis?"
            say: "Die Spitze des Zirkels steht am Lineal bei eins, die Mine bei sechs. Welchen Radius hat der Kreis?"
            show: { drawn: ruler, to: 10, start: 1, length: 5, colour: green }
            options: ["5 cm", "6 cm", "10 cm"]
            answer: "5 cm"
          - id: l2-c2
            type: multiple_choice
            text: "Was ist der Mittelpunkt eines Kreises?"
            say: "Was ist der Mittelpunkt eines Kreises?"
            options: ["der Punkt, der von allen Punkten der Kreislinie gleich weit entfernt ist", "der oberste Punkt der Kreislinie", "ein Punkt außerhalb des Kreises"]
            answer: "der Punkt, der von allen Punkten der Kreislinie gleich weit entfernt ist"
          - id: l2-c3
            type: text_input
            text: "Ein runder Teller ist 24 cm breit. Wie viele cm ist sein Radius lang?"
            say: "Ein runder Teller ist vierundzwanzig Zentimeter breit. Wie viele Zentimeter ist sein Radius lang?"
            answer: "12"
          - id: l2-c4
            type: true_false
            text: "Ein Kreis mit 5 cm Radius ist breiter als ein Kreis, der 8 cm breit ist."
            say: "Stimmt das? Ein Kreis mit fünf Zentimetern Radius ist breiter als ein Kreis, der acht Zentimeter breit ist."
            answer: true
          - id: l2-c5
            type: multiple_choice
            text: "Lina zeichnet um denselben Mittelpunkt einen Kreis mit 3 cm und einen mit 6 cm Radius. Wie viel breiter ist der große Kreis?"
            say: "Lina zeichnet um denselben Mittelpunkt einen Kreis mit drei Zentimetern Radius und einen mit sechs Zentimetern Radius. Wie viel breiter ist der große Kreis?"
            options: ["6 cm", "3 cm", "12 cm"]
            answer: "6 cm"
