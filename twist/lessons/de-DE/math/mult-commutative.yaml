# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.mult-commutative
skill: math.mult-div.commutative
curriculum: de-DE
language: de
title:
  de: Tauschaufgaben beim Malnehmen
  en: Turnaround facts in multiplication
summary: >
  A Punktefeld turned round shows the Tauschaufgabe: 3 · 7 and 7 · 3 have
  the same result. Lesson 1 reads one field both ways; lesson 2 uses the
  Tauschaufgabe to work out a hard fact from an easy one (9 · 2 from
  2 · 9), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Malaufgaben, en: Multiplication }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.arrays]
  also_practises: [math.mult-div.arrays]
  vocabulary: { de: [Tauschaufgabe, Malaufgabe, Reihe, Punktefeld, drehen] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: turned-field-is-new
      what: Works out 7 · 3 from scratch after 3 · 7, not seeing they are the same
      addressed: Learn turns the same field round; tasks give one result and ask for the Tauschaufgabe's
    - id: swap-means-plus
      what: Thinks the Tauschaufgabe of 3 · 7 is 3 + 7 or 7 + 3
      addressed: options include the plus sum, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Das Feld drehen, en: Turning the array }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Malaufgabe zeigt das Feld?"
            say: "Lies zuerst die Reihen. Welche Malaufgabe zeigt das Feld?"
            show: { drawn: dots, array: [2, 4] }
            options: ["2 · 4", "2 · 3", "2 + 4"]
            answer: "2 · 4"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "5 · 2 = _"
            say: "Fünf mal zwei."
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 · 7 = 21"
            say: "Dieses Feld hat drei Reihen mit je sieben Punkten: drei mal sieben, einundzwanzig."
            show: { drawn: dots, array: [3, 7] }
          - text: "7 · 3 = 21"
            say: "Jetzt drehen wir das Feld. Es hat sieben Reihen mit je drei Punkten: sieben mal drei. Es sind dieselben Punkte, also wieder einundzwanzig."
            show: { drawn: dots, array: [7, 3] }
          - text: "3 · 7 = 7 · 3"
            say: "Drei mal sieben und sieben mal drei haben dasselbe Ergebnis. Sie sind Tauschaufgaben, so wie bei Plusaufgaben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißt die Tauschaufgabe zu 2 · 6?"
                say: "Wie heißt die Tauschaufgabe zu zwei mal sechs?"
                options: ["6 · 2", "2 + 6", "2 · 2"]
                answer: "6 · 2"
                feedback:
                  "2 + 6": "Die Tauschaufgabe ist wieder eine Malaufgabe. Nur die Zahlen wechseln den Platz."
                hints:
                  - "Die Zahlen wechseln den Platz."
                  - "Die Sechs nach vorne."
                  - "6 · 2."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Lies das Feld auf beide Arten."
                say: "Lies das Feld zuerst nach Reihen, dann gedreht."
                show: { drawn: dots, array: [4, 2] }
                frame: "4 · 2 = _ · 4"
                options: ["2", "4", "8"]
                answer: ["2"]
                hints:
                  - "Gedreht hat das Feld zwei Reihen."
                  - "Mit je vier Punkten."
                  - "2 · 4."
              - id: l1-f3
                type: multiple_choice
                text: "5 · 3 = 15. Was ist 3 · 5?"
                say: "Fünf mal drei ist fünfzehn. Was ist drei mal fünf?"
                options: ["15", "8", "53"]
                answer: "15"
                hints:
                  - "Es ist die Tauschaufgabe."
                  - "Tauschaufgaben haben dasselbe Ergebnis."
                  - "15."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 6 · 4 = 4 · 6"
                say: "Sechs mal vier ist gleich vier mal sechs. Stimmt das?"
                answer: true
                hints:
                  - "Es sind dieselben Zahlen."
                  - "Dreh das Feld im Kopf."
                  - "Ja."
              - id: l1-f5
                type: image_multiple_choice
                text: "Welches Feld zeigt die Tauschaufgabe von 2 · 5?"
                say: "Hier ist zwei mal fünf. Welches Feld zeigt die Tauschaufgabe, fünf mal zwei?"
                show: { drawn: dots, array: [2, 5] }
                options: [{ drawn: dots, array: [5, 2] }, { drawn: dots, array: [2, 5] }, { drawn: dots, array: [5, 3] }]
                answer: "5x2"
                hints:
                  - "Fünf mal zwei: fünf Reihen."
                  - "Mit je zwei Punkten."
                  - "Das Feld mit fünf Zweierreihen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie heißt die Tauschaufgabe zu 3 · 8?"
                say: "Wie heißt die Tauschaufgabe zu drei mal acht?"
                options: ["8 · 3", "3 + 8", "3 · 3"]
                answer: "8 · 3"
                hints: ["Die Zahlen wechseln den Platz."]
              - id: l1-s2
                type: fill_in_blank
                text: "Lies das Feld auf beide Arten."
                say: "Lies das Feld zuerst nach Reihen, dann gedreht."
                show: { drawn: dots, array: [3, 6] }
                frame: "3 · 6 = _ · 3"
                options: ["6", "3", "18"]
                answer: ["6"]
                hints: ["Wie viele Reihen hat das gedrehte Feld?"]
              - id: l1-s3
                type: multiple_choice
                text: "4 · 5 = 20. Was ist 5 · 4?"
                say: "Vier mal fünf ist zwanzig. Was ist fünf mal vier?"
                options: ["20", "9", "45"]
                answer: "20"
                hints: ["Was weißt du über Tauschaufgaben?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 2 · 9 = 9 · 3"
                say: "Zwei mal neun ist gleich neun mal drei. Stimmt das?"
                answer: false
                hints: ["Sind es dieselben Zahlen?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Welches Feld zeigt die Tauschaufgabe von 4 · 3?"
                say: "Hier ist vier mal drei. Welches Feld zeigt die Tauschaufgabe?"
                show: { drawn: dots, array: [4, 3] }
                options: [{ drawn: dots, array: [3, 4] }, { drawn: dots, array: [4, 3] }, { drawn: dots, array: [3, 3] }]
                answer: "3x4"
                hints: ["Dreh das Feld im Kopf. Wie viele Reihen hat es dann?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie heißt die Tauschaufgabe zu 5 · 7?"
                say: "Wie heißt die Tauschaufgabe zu fünf mal sieben?"
                options: ["7 · 5", "5 + 7", "5 · 5"]
                answer: "7 · 5"
              - id: l1-n2
                type: fill_in_blank
                text: "Lies das Feld auf beide Arten."
                say: "Lies das Feld zuerst nach Reihen, dann gedreht."
                show: { drawn: dots, array: [2, 7] }
                frame: "2 · 7 = _ · 2"
                options: ["7", "2", "14"]
                answer: ["7"]
              - id: l1-n3
                type: multiple_choice
                text: "10 · 3 = 30. Was ist 3 · 10?"
                say: "Zehn mal drei ist dreißig. Was ist drei mal zehn?"
                options: ["30", "13", "103"]
                answer: "30"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 8 · 2 = 2 · 8"
                say: "Acht mal zwei ist gleich zwei mal acht. Stimmt das?"
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "Welches Feld zeigt die Tauschaufgabe von 3 · 5?"
                say: "Hier ist drei mal fünf. Welches Feld zeigt die Tauschaufgabe?"
                show: { drawn: dots, array: [3, 5] }
                options: [{ drawn: dots, array: [5, 3] }, { drawn: dots, array: [3, 5] }, { drawn: dots, array: [5, 4] }]
                answer: "5x3"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie heißt die Tauschaufgabe zu 4 · 9?"
            say: "Wie heißt die Tauschaufgabe zu vier mal neun?"
            options: ["9 · 4", "4 + 9", "4 · 4"]
            answer: "9 · 4"
          - id: l1-c2
            type: multiple_choice
            text: "6 · 2 = 12. Was ist 2 · 6?"
            say: "Sechs mal zwei ist zwölf. Was ist zwei mal sechs?"
            options: ["12", "8", "62"]
            answer: "12"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 3 · 4 = 4 · 3"
            say: "Drei mal vier ist gleich vier mal drei. Stimmt das?"
            answer: true

  - n: 2
    title: { de: Tauschen macht es leichter, en: Turning it round makes it easier }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie heißt die Tauschaufgabe zu 7 · 2?"
            say: "Wie heißt die Tauschaufgabe zu sieben mal zwei?"
            options: ["2 · 7", "7 + 2", "7 · 7"]
            answer: "2 · 7"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "3 · 5 = _"
            say: "Drei mal fünf."
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "9 · 2 → 2 · 9"
            say: "Neun mal zwei: Neun Zweier zu zählen dauert lange. Tausch die Zahlen: zwei mal neun, das sind zwei Neuner, neun und neun, achtzehn."
          - text: "10 · 4 → 4 · 10"
            say: "Zehn mal vier: Zehn Vierer zu zählen dauert lange. Tausch die Zahlen: vier mal zehn, das sind vier Zehner: zehn, zwanzig, dreißig, vierzig."
          - text: "Nimm die Aufgabe, die du leichter rechnen kannst."
            say: "Wenn eine Malaufgabe schwer ist, schau, ob die Tauschaufgabe leichter ist. Das Ergebnis ist dasselbe."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Aufgabe ist leichter?"
                say: "Zehn mal drei oder drei mal zehn: Welche kannst du leichter rechnen?"
                options: ["3 · 10", "10 · 3"]
                answer: "3 · 10"
                option_audio: false
                feedback:
                  "10 · 3": "Zehn Dreier zu zählen geht auch, aber drei Zehner gehen schneller: zehn, zwanzig, dreißig."
                hints:
                  - "Zehnerschritte sind leicht."
                  - "Drei Zehner: zehn, zwanzig, dreißig."
                  - "3 · 10."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "8 · 2 = _"
                say: "Acht mal zwei. Tausch, wenn es hilft."
                answer: "16"
                hints:
                  - "Zwei mal acht: zwei Achter."
                  - "Acht und acht."
                  - "16."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? 7 · 5 = 35, also ist 5 · 7 = 35."
                say: "Sieben mal fünf ist fünfunddreißig, also ist fünf mal sieben auch fünfunddreißig. Stimmt das?"
                answer: true
                hints:
                  - "Es ist die Tauschaufgabe."
                  - "Dasselbe Ergebnis."
                  - "Ja."
              - id: l2-f4
                type: text_input
                text: "10 · 6 = _"
                say: "Zehn mal sechs. Tausch, wenn es hilft."
                answer: "60"
                hints:
                  - "Sechs mal zehn: sechs Zehner."
                  - "Zehn, zwanzig, dreißig, vierzig, fünfzig, sechzig."
                  - "60."
              - id: l2-f5
                type: text_input
                text: "7 · 2 = _"
                say: "Sieben mal zwei. Tausch, wenn es hilft."
                answer: "14"
                hints:
                  - "Zwei mal sieben ist das Doppelte von sieben."
                  - "Sieben und sieben."
                  - "14."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Aufgabe ist leichter?"
                say: "Zehn mal sieben oder sieben mal zehn: Welche kannst du leichter rechnen?"
                options: ["7 · 10", "10 · 7"]
                answer: "7 · 10"
                option_audio: false
                hints: ["Welche Schritte kannst du schneller zählen?"]
              - id: l2-s2
                type: text_input
                text: "6 · 2 = _"
                say: "Sechs mal zwei."
                answer: "12"
                hints: ["Tausch die Zahlen."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? 6 · 5 = 30, also ist 5 · 6 = 25."
                say: "Sechs mal fünf ist dreißig, also ist fünf mal sechs fünfundzwanzig. Stimmt das?"
                answer: false
                hints: ["Was weißt du über Tauschaufgaben?"]
              - id: l2-s4
                type: text_input
                text: "10 · 5 = _"
                say: "Zehn mal fünf."
                answer: "50"
                hints: ["Welche Schritte kannst du schneller zählen?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Aufgabe ist leichter?"
                say: "Zehn mal acht oder acht mal zehn: Welche kannst du leichter rechnen?"
                options: ["8 · 10", "10 · 8"]
                answer: "8 · 10"
                option_audio: false
                hints: ["Welche Schritte kannst du schneller zählen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "8 · 5 = _"
                say: "Acht mal fünf."
                answer: "40"
              - id: l2-n2
                type: text_input
                text: "3 · 2 = _"
                say: "Drei mal zwei."
                answer: "6"
              - id: l2-n3
                type: true_false
                text: "Stimmt das? 9 · 5 = 45, also ist 5 · 9 = 45."
                say: "Neun mal fünf ist fünfundvierzig, also ist fünf mal neun auch fünfundvierzig. Stimmt das?"
                answer: true
              - id: l2-n4
                type: text_input
                text: "4 · 2 = _"
                say: "Vier mal zwei."
                answer: "8"
              - id: l2-n5
                type: multiple_choice
                text: "Welche Aufgabe ist leichter?"
                say: "Zehn mal zwei oder zwei mal zehn: Welche kannst du leichter rechnen?"
                options: ["2 · 10", "10 · 2"]
                answer: "2 · 10"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie heißt die Tauschaufgabe zu 6 · 3?"
            say: "Wie heißt die Tauschaufgabe zu sechs mal drei?"
            options: ["3 · 6", "6 + 3", "6 · 6"]
            answer: "3 · 6"
          - id: l2-c2
            type: fill_in_blank
            text: "Lies das Feld auf beide Arten."
            say: "Lies das Feld zuerst nach Reihen, dann gedreht."
            show: { drawn: dots, array: [5, 4] }
            frame: "5 · 4 = _ · 5"
            options: ["4", "5", "20"]
            answer: ["4"]
          - id: l2-c3
            type: text_input
            text: "10 · 9 = _"
            say: "Zehn mal neun."
            answer: "90"
          - id: l2-c4
            type: true_false
            text: "Stimmt das? 7 · 4 = 4 · 6"
            say: "Sieben mal vier ist gleich vier mal sechs. Stimmt das?"
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "3 · 9 = 27. Was ist 9 · 3?"
            say: "Drei mal neun ist siebenundzwanzig. Was ist neun mal drei?"
            options: ["27", "12", "39"]
            answer: "27"
