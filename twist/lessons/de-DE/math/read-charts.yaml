# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.read-charts
skill: math.data.read-charts
curriculum: de-DE
language: de
title:
  de: Diagramme mit großen Zahlen lesen
  en: Reading charts with larger numbers
summary: >
  Lesson 1 reads Säulendiagramme whose Skala goes in fives, tens,
  twenties, fifties and hundreds: first read the steps, then the number
  at the end of the bar (not the number of lines), and a bar that ends
  halfway between two lines (between 400 and 500: 450). Lesson 2
  compares the values (how many more, together, doppelt so viele),
  orders them, decides which statements the chart supports and which it
  cannot tell (the chart shows that most came on Wednesday, not why),
  and ends with the skill check. Drawing a chart with a scale waits for
  a drawing task.
metadata:
  year: klasse-3
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.data.pictograms-bar-charts, math.numbers-to-1000.number-line]
  also_practises: [math.numbers-to-1000.number-line, math.add-sub-to-1000.hundreds]
  vocabulary: { de: [Säulendiagramm, Skala, Zehnerschritte, Hunderterschritte, ablesen, vergleichen, doppelt so viele, insgesamt] }
  forms: [text, audio, drawn]
  drawn: [bar-chart, number-line]
  facets: []
  misconceptions:
    - id: counts-lines
      what: Counts the lines up to the end of the bar instead of reading the scale, so a scale in tens or hundreds gives 5 for 50 or 7 for 700
      addressed: lesson 1 Learn reads the steps first; l1-f2 and l1-f3 (with feedback), l1-s2, l1-s3, l1-c1 and l2-c1 offer the number of lines
    - id: between-lines
      what: Reads a bar that ends between two lines as the line below or above
      addressed: lesson 1 Learn reads a bar halfway between 40 and 50 as 45; l1-f4 (with feedback), l1-f5, l1-s4, l1-n3, l1-c2 and l2-c2 end between two lines
    - id: reads-in-the-why
      what: Takes a reason or a rule from the chart that it does not show (it was hot, it is always like this)
      addressed: lesson 2 Learn separates what the chart shows from why; l2-f6 (with feedback), l2-s6, l2-n6 and l2-c5 ask which sentence the chart supports
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Skalen lesen", en: "Reading scales" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Kinder mögen Blau am liebsten?"
            say: "Die Skala geht in Zweierschritten. Wie viele Kinder mögen Blau am liebsten?"
            show: { drawn: bar-chart, rows: [["Rot", 8], ["Blau", 14]] }
            options: ["14", "7", "12"]
            answer: "14"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Zahl zeigt der Pfeil?"
            say: "Welche Zahl zeigt der Pfeil?"
            show: { drawn: number-line, from: 200, to: 300, labels: ends, step: 10, mark: 250 }
            options: ["250", "205", "260"]
            answer: "250"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ausgeliehene Bücher"
            say: "Das Säulendiagramm zeigt, wie viele Bücher in der Schulbücherei ausgeliehen wurden. Lies zuerst die Skala: null, zehn, zwanzig, dreißig. Sie geht in Zehnerschritten. Die Säule für Dienstag geht bis fünfzig. Am Dienstag wurden fünfzig Bücher ausgeliehen."
            show: { drawn: bar-chart, step: 10, rows: [["Mo", 30], ["Di", 50], ["Mi", 20]] }
          - text: "Besucher im Freibad"
            say: "Hier geht die Skala in Hunderterschritten. Zähl nicht die Linien. Die Säule für Samstag geht bis zur Linie mit der Achthundert. Am Samstag kamen achthundert Besucher."
            show: { drawn: bar-chart, step: 100, rows: [["Fr", 500], ["Sa", 800], ["So", 700]] }
          - text: "Gelaufene Runden"
            say: "Manchmal endet eine Säule zwischen zwei Linien. Die Säule der drei a endet genau in der Mitte zwischen vierzig und fünfzig. In der Mitte liegt fünfundvierzig. Die drei a ist fünfundvierzig Runden gelaufen."
            show: { drawn: bar-chart, step: 10, rows: [["3a", 45], ["3b", 30], ["3c", 60]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "In welchen Schritten geht die Skala?"
                say: "Das Diagramm zeigt die ausgeliehenen Bücher. In welchen Schritten geht die Skala?"
                show: { drawn: bar-chart, step: 10, rows: [["Mo", 30], ["Di", 50], ["Mi", 20], ["Do", 40]] }
                options: ["in Zehnerschritten", "in Einerschritten", "in Fünferschritten"]
                answer: "in Zehnerschritten"
                hints:
                  - "Lies die Zahlen an der Skala von unten nach oben."
                  - "0, 10, 20, 30 ..."
                  - "In Zehnerschritten."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Bücher wurden am Dienstag ausgeliehen?"
                say: "Wie viele Bücher wurden am Dienstag ausgeliehen?"
                show: { drawn: bar-chart, step: 10, rows: [["Mo", 30], ["Di", 50], ["Mi", 20], ["Do", 40]] }
                options: ["50", "5", "40"]
                answer: "50"
                feedback:
                  "5": "Du hast die Linien gezählt. Die Skala geht in Zehnerschritten. Lies die Zahl an der Skala ab."
                hints:
                  - "Geh vom oberen Ende der Säule waagerecht zur Skala."
                  - "Dort steht eine Zahl. Die Skala geht in Zehnerschritten."
                  - "50 Bücher."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viele Besucher kamen am Mittwoch ins Freibad?"
                say: "Das Diagramm zeigt die Besucher im Freibad. Wie viele Besucher kamen am Mittwoch?"
                show: { drawn: bar-chart, step: 100, rows: [["Mo", 300], ["Di", 500], ["Mi", 700]] }
                options: ["700", "7", "70"]
                answer: "700"
                feedback:
                  "7": "Die Säule geht bis zur 7. Linie, aber die Skala geht in Hunderterschritten. Lies die Zahl ab."
                hints:
                  - "In welchen Schritten geht die Skala?"
                  - "Die Skala geht in Hunderterschritten: 100, 200, 300 ..."
                  - "700 Besucher."
              - id: l1-f4
                type: multiple_choice
                text: "Wie viele Runden ist die 3a gelaufen?"
                say: "Beim Sponsorenlauf sind die Klassen Runden gelaufen. Wie viele Runden ist die drei a gelaufen?"
                show: { drawn: bar-chart, step: 10, rows: [["3a", 55], ["3b", 30], ["3c", 40]] }
                options: ["55", "50", "60"]
                answer: "55"
                feedback:
                  "50": "Die Säule geht über die 50 hinaus, bis zur Mitte zwischen 50 und 60."
                  "60": "Die Säule erreicht die 60 nicht. Sie endet in der Mitte zwischen 50 und 60."
                hints:
                  - "Die Säule endet zwischen zwei Linien. Zwischen welchen?"
                  - "Sie endet genau in der Mitte zwischen 50 und 60."
                  - "In der Mitte liegt 55."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viele Besucher kamen am Dienstag?"
                say: "Wie viele Besucher kamen am Dienstag ins Freibad?"
                show: { drawn: bar-chart, step: 100, rows: [["Mo", 300], ["Di", 450], ["Mi", 600]] }
                options: ["450", "400", "500"]
                answer: "450"
                hints:
                  - "Die Säule endet zwischen zwei Linien."
                  - "Zwischen 400 und 500, genau in der Mitte."
                  - "450 Besucher."
              - id: l1-f6
                type: multiple_choice
                text: "An welchem Tag kamen die meisten Besucher?"
                say: "An welchem Tag kamen die meisten Besucher ins Freibad?"
                show: { drawn: bar-chart, step: 100, rows: [["Mo", 300], ["Di", 450], ["Mi", 600]] }
                options: ["Montag", "Dienstag", "Mittwoch"]
                answer: "Mittwoch"
                keep_order: true
                hints:
                  - "Die meisten: die höchste Säule."
                  - "Welche Säule geht am weitesten nach oben?"
                  - "Mittwoch."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "In welchen Schritten geht die Skala?"
                say: "Das Diagramm zeigt, wie viele Pfandflaschen die Klassen gesammelt haben. In welchen Schritten geht die Skala?"
                show: { drawn: bar-chart, step: 20, rows: [["3a", 120], ["3b", 80], ["3c", 160]] }
                options: ["in Zwanzigerschritten", "in Zehnerschritten", "in Hunderterschritten"]
                answer: "in Zwanzigerschritten"
                hints: ["Lies die ersten Zahlen an der Skala: 0, 20, ..."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie viele Flaschen hat die 3c gesammelt?"
                say: "Wie viele Pfandflaschen hat die drei c gesammelt?"
                show: { drawn: bar-chart, step: 20, rows: [["3a", 120], ["3b", 80], ["3c", 160]] }
                options: ["160", "8", "150"]
                answer: "160"
                hints: ["Lies die Zahl an der Skala ab. Zähl nicht die Linien."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie viele Lose hat Stand 2 verkauft?"
                say: "Beim Schulfest haben drei Stände Lose verkauft. Wie viele Lose hat Stand zwei verkauft?"
                show: { drawn: bar-chart, step: 50, rows: [["Stand 1", 150], ["Stand 2", 250], ["Stand 3", 100]] }
                options: ["250", "5", "200"]
                answer: "250"
                hints: ["Die Skala geht in Fünfzigerschritten: 0, 50, 100 ..."]
              - id: l1-s4
                type: multiple_choice
                text: "Wie viele Runden ist die 3c gelaufen?"
                say: "Wie viele Runden ist die drei c beim Sponsorenlauf gelaufen?"
                show: { drawn: bar-chart, step: 10, rows: [["3a", 50], ["3b", 60], ["3c", 35]] }
                options: ["35", "30", "40"]
                answer: "35"
                hints: ["Die Säule endet in der Mitte zwischen 30 und 40."]
              - id: l1-s5
                type: true_false
                text: "Am Dienstag kamen 350 Besucher."
                say: "Stimmt das? Am Dienstag kamen dreihundertfünfzig Besucher ins Freibad."
                show: { drawn: bar-chart, step: 100, rows: [["Mo", 200], ["Di", 350], ["Mi", 500]] }
                answer: true
                hints: ["Die Säule für Dienstag endet zwischen 300 und 400."]
              - id: l1-s6
                type: multiple_choice
                text: "Welche Klasse hat die wenigsten Flaschen gesammelt?"
                say: "Welche Klasse hat die wenigsten Pfandflaschen gesammelt?"
                show: { drawn: bar-chart, step: 20, rows: [["3a", 120], ["3b", 80], ["3c", 160]] }
                options: ["3a", "3b", "3c"]
                answer: "3b"
                keep_order: true
                hints: ["Die wenigsten: die niedrigste Säule."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Punkte hat Team Grün?"
                say: "Beim Sportfest haben drei Teams Punkte gesammelt. Wie viele Punkte hat Team Grün?"
                show: { drawn: bar-chart, step: 5, rows: [["Rot", 25], ["Blau", 40], ["Grün", 35]] }
                options: ["35", "7", "30"]
                answer: "35"
              - id: l1-n2
                type: text_input
                text: "Wie viele Besucher kamen am Sonntag ins Museum?"
                say: "Das Diagramm zeigt die Besucher im Museum. Wie viele Besucher kamen am Sonntag? Tippe die Zahl ein."
                show: { drawn: bar-chart, step: 100, rows: [["Fr", 400], ["Sa", 900], ["So", 750]] }
                answer: "750"
              - id: l1-n3
                type: multiple_choice
                text: "Wie viele Kastanien hat Ida gesammelt?"
                say: "Drei Kinder haben Kastanien gesammelt. Wie viele hat Ida gesammelt?"
                show: { drawn: bar-chart, step: 20, rows: [["Ole", 60], ["Ida", 90], ["Tom", 140]] }
                options: ["90", "80", "100"]
                answer: "90"
              - id: l1-n4
                type: true_false
                text: "Am Samstag kamen 900 Besucher ins Museum."
                say: "Stimmt das? Am Samstag kamen neunhundert Besucher ins Museum."
                show: { drawn: bar-chart, step: 100, rows: [["Fr", 400], ["Sa", 900], ["So", 750]] }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "In welchen Schritten geht die Skala?"
                say: "In welchen Schritten geht die Skala?"
                show: { drawn: bar-chart, step: 50, rows: [["Stand 1", 200], ["Stand 2", 300], ["Stand 3", 150]] }
                options: ["in Fünfzigerschritten", "in Fünferschritten", "in Hunderterschritten"]
                answer: "in Fünfzigerschritten"
              - id: l1-n6
                type: text_input
                text: "Wie viele Kastanien hat Tom gesammelt?"
                say: "Wie viele Kastanien hat Tom gesammelt? Tippe die Zahl ein."
                show: { drawn: bar-chart, step: 20, rows: [["Ole", 60], ["Ida", 90], ["Tom", 140]] }
                answer: "140"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Bücher wurden am Montag ausgeliehen?"
            say: "Wie viele Bücher wurden am Montag ausgeliehen?"
            show: { drawn: bar-chart, step: 10, rows: [["Mo", 60], ["Di", 80], ["Mi", 70]] }
            options: ["60", "6", "70"]
            answer: "60"
          - id: l1-c2
            type: multiple_choice
            text: "Wie viele Besucher kamen am Freitag?"
            say: "Wie viele Besucher kamen am Freitag ins Freibad?"
            show: { drawn: bar-chart, step: 100, rows: [["Fr", 350], ["Sa", 600], ["So", 500]] }
            options: ["350", "300", "400"]
            answer: "350"
          - id: l1-c3
            type: multiple_choice
            text: "Wie viele Flaschen hat die 3a gesammelt?"
            say: "Wie viele Pfandflaschen hat die drei a gesammelt?"
            show: { drawn: bar-chart, step: 20, rows: [["3a", 100], ["3b", 140], ["3c", 60]] }
            options: ["100", "5", "120"]
            answer: "100"

  - n: 2
    title: { de: "Vergleichen und Schlüsse ziehen", en: "Comparing and drawing conclusions" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Runden ist die 3b gelaufen?"
            say: "Wie viele Runden ist die drei b gelaufen?"
            show: { drawn: bar-chart, step: 10, rows: [["3a", 40], ["3b", 70], ["3c", 50]] }
            options: ["70", "7", "60"]
            answer: "70"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viele Besucher kamen am Montag?"
            say: "Wie viele Besucher kamen am Montag ins Museum?"
            show: { drawn: bar-chart, step: 100, rows: [["Mo", 250], ["Di", 400]] }
            options: ["250", "200", "300"]
            answer: "250"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mittwoch 600, Montag 300\n600 − 300 = 300"
            say: "Am Montag kamen dreihundert Besucher ins Freibad, am Mittwoch sechshundert. Wie viele mehr am Mittwoch? Sechshundert minus dreihundert ist dreihundert. Am Mittwoch kamen dreihundert mehr. Das sind doppelt so viele wie am Montag."
            show: { drawn: bar-chart, step: 100, rows: [["Mo", 300], ["Di", 450], ["Mi", 600]] }
          - text: "Zusammen: 200 + 350 + 400 = 950"
            say: "Du kannst auch zusammenrechnen. An den drei Tagen kamen zweihundert, dreihundertfünfzig und vierhundert Besucher. Zusammen sind das neunhundertfünfzig."
            show: { drawn: bar-chart, step: 100, rows: [["Fr", 200], ["Sa", 350], ["So", 400]] }
          - text: "Das zeigt das Diagramm: Am Mittwoch kamen die meisten.\nDas zeigt es nicht: warum."
            say: "Was kannst du aus dem Diagramm schließen? Am Mittwoch kamen die meisten Besucher. Das zeigt das Diagramm. Warum es so war, zeigt es nicht. Vielleicht war es heiß, vielleicht waren Ferien. Das steht nicht im Diagramm."
            show: { drawn: bar-chart, step: 100, rows: [["Mo", 300], ["Di", 450], ["Mi", 600]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Bücher wurden am Donnerstag mehr ausgeliehen als am Montag?"
                say: "Wie viele Bücher wurden am Donnerstag mehr ausgeliehen als am Montag?"
                show: { drawn: bar-chart, step: 10, rows: [["Mo", 30], ["Di", 50], ["Mi", 20], ["Do", 70]] }
                options: ["40", "100", "4"]
                answer: "40"
                hints:
                  - "Lies beide Säulen ab."
                  - "Donnerstag 70, Montag 30."
                  - "70 − 30 = 40."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie viele Flaschen haben alle drei Klassen zusammen gesammelt?"
                say: "Wie viele Pfandflaschen haben alle drei Klassen zusammen gesammelt?"
                show: { drawn: bar-chart, step: 20, rows: [["3a", 120], ["3b", 80], ["3c", 160]] }
                options: ["360", "340", "160"]
                answer: "360"
                hints:
                  - "Lies alle drei Säulen ab."
                  - "120 + 80 + 160."
                  - "120 + 80 = 200, 200 + 160 = 360."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Klasse hat doppelt so viele Flaschen gesammelt wie die 3b?"
                say: "Welche Klasse hat doppelt so viele Pfandflaschen gesammelt wie die drei b?"
                show: { drawn: bar-chart, step: 20, rows: [["3a", 120], ["3b", 80], ["3c", 160]] }
                options: ["3a", "3c", "keine"]
                answer: "3c"
                keep_order: true
                hints:
                  - "Wie viele hat die 3b gesammelt?"
                  - "Die 3b hat 80. Das Doppelte von 80 ist?"
                  - "160: die 3c."
              - id: l2-f4
                type: ordering
                text: "Ordne die Tage. Fang mit den meisten Besuchern an."
                say: "Ordne die Tage. Fang mit dem Tag an, an dem die meisten Besucher kamen."
                show: { drawn: bar-chart, step: 100, rows: [["Mo", 300], ["Di", 450], ["Mi", 600], ["Do", 250]] }
                options: ["Montag", "Dienstag", "Mittwoch", "Donnerstag"]
                slot_count: 4
                answer: ["Mittwoch", "Dienstag", "Montag", "Donnerstag"]
                hints:
                  - "Die höchste Säule kommt zuerst."
                  - "Mittwoch 600, Dienstag 450, Montag 300, Donnerstag 250."
                  - "Mittwoch, Dienstag, Montag, Donnerstag."
              - id: l2-f5
                type: true_false
                text: "Team Blau hat 15 Punkte mehr als Team Rot."
                say: "Stimmt das? Team Blau hat fünfzehn Punkte mehr als Team Rot."
                show: { drawn: bar-chart, step: 5, rows: [["Rot", 25], ["Blau", 40], ["Grün", 35]] }
                answer: true
                hints:
                  - "Lies beide Säulen ab."
                  - "Blau 40, Rot 25."
                  - "40 − 25 = 15. Ja, das stimmt."
              - id: l2-f6
                type: multiple_choice
                text: "Was zeigt das Diagramm?"
                say: "Das Diagramm zeigt die Besucher im Freibad. Welchen Satz kannst du aus dem Diagramm ablesen?"
                show: { drawn: bar-chart, step: 100, rows: [["Mo", 300], ["Di", 450], ["Mi", 600]] }
                options: ["Am Mittwoch kamen mehr Besucher als am Montag.", "Am Mittwoch war es am heißesten.", "Am Mittwoch kommen immer die meisten Besucher."]
                answer: "Am Mittwoch kamen mehr Besucher als am Montag."
                feedback:
                  "Am Mittwoch war es am heißesten.": "Das Wetter steht nicht im Diagramm. Es zeigt nur, wie viele Besucher kamen."
                  "Am Mittwoch kommen immer die meisten Besucher.": "Das Diagramm zeigt nur diese eine Woche. Ob es immer so ist, weißt du nicht."
                hints:
                  - "Das Diagramm zeigt nur Zahlen: wie viele Besucher an welchem Tag."
                  - "Steht im Diagramm etwas über das Wetter oder über andere Wochen?"
                  - "Nur der Vergleich der Besucher steht im Diagramm."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Lose hat Stand 2 mehr verkauft als Stand 3?"
                say: "Wie viele Lose hat Stand zwei mehr verkauft als Stand drei?"
                show: { drawn: bar-chart, step: 50, rows: [["Stand 1", 150], ["Stand 2", 250], ["Stand 3", 100]] }
                options: ["150", "350", "100"]
                answer: "150"
                hints: ["Stand 2: 250, Stand 3: 100."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie viele Besucher kamen an allen drei Tagen zusammen?"
                say: "Wie viele Besucher kamen an allen drei Tagen zusammen ins Museum?"
                show: { drawn: bar-chart, step: 100, rows: [["Fr", 400], ["Sa", 300], ["So", 200]] }
                options: ["900", "700", "300"]
                answer: "900"
                hints: ["Rechne 400 + 300 + 200."]
              - id: l2-s3
                type: true_false
                text: "Stand 1 hat halb so viele Lose verkauft wie Stand 3."
                say: "Stimmt das? Stand eins hat halb so viele Lose verkauft wie Stand drei."
                show: { drawn: bar-chart, step: 50, rows: [["Stand 1", 100], ["Stand 2", 150], ["Stand 3", 200]] }
                answer: true
                hints: ["Stand 1: 100, Stand 3: 200. Was ist die Hälfte von 200?"]
              - id: l2-s4
                type: ordering
                text: "Ordne die Kinder. Fang mit den wenigsten Kastanien an."
                say: "Ordne die Kinder. Fang mit dem Kind an, das die wenigsten Kastanien gesammelt hat."
                show: { drawn: bar-chart, step: 20, rows: [["Ole", 100], ["Ida", 60], ["Tom", 140], ["Lea", 80]] }
                options: ["Ole", "Ida", "Tom", "Lea"]
                slot_count: 4
                answer: ["Ida", "Lea", "Ole", "Tom"]
                hints: ["Die niedrigste Säule kommt zuerst."]
              - id: l2-s5
                type: multiple_choice
                text: "Wie viele Punkte fehlen Team Rot, bis es so viele hat wie Team Grün?"
                say: "Wie viele Punkte fehlen Team Rot, um so viele zu haben wie Team Grün?"
                show: { drawn: bar-chart, step: 5, rows: [["Rot", 25], ["Blau", 40], ["Grün", 35]] }
                options: ["10", "60", "5"]
                answer: "10"
                hints: ["Rot 25, Grün 35. Wie viel fehlt von 25 bis 35?"]
              - id: l2-s6
                type: multiple_choice
                text: "Was zeigt das Diagramm?"
                say: "Das Diagramm zeigt die Pfandflaschen der drei Klassen. Welchen Satz kannst du aus dem Diagramm ablesen?"
                show: { drawn: bar-chart, step: 20, rows: [["3a", 120], ["3b", 80], ["3c", 160]] }
                options: ["Die 3c hat die meisten Flaschen gesammelt.", "Die 3c hat die fleißigsten Kinder.", "Die 3b sammelt nie gern."]
                answer: "Die 3c hat die meisten Flaschen gesammelt."
                hints: ["Das Diagramm zeigt nur, wie viele Flaschen jede Klasse gesammelt hat."]

          - support: none
            tasks:
              - id: l2-n1
