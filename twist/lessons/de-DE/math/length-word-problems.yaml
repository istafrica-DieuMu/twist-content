# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.length-word-problems
skill: math.length.word-problems
curriculum: de-DE
language: de
title:
  de: Sachaufgaben mit Längen
  en: Length word problems
summary: >
  Lesson 1 brings both lengths into one unit before calculating (1,20 m +
  85 cm = 120 cm + 85 cm = 205 cm, 1,5 km + 700 m = 2200 m); lesson 2
  solves stories in two steps (cut 6 pieces of 70 cm from 5 m), checks
  whether the result and its unit can be true (a Schulweg of 1200 km?)
  and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Längen, en: Length }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.length.notation, math.word-problems.multi-step]
  also_practises: [math.length.notation, math.word-problems.check-plausible]
  vocabulary: { de: [Einheit, umrechnen, zusammen, Rest, übrig, Strecke] }
  forms: [text, audio]
  drawn: []
  facets: [units]
  misconceptions:
    - id: mixed-units-added
      what: Adds or subtracts lengths in different units as they stand (2 m + 60 cm = 62 cm)
      addressed: lesson 1 Learn changes both lengths to cm or m first; every stage of lesson 1 mixes two units and offers the unconverted result, with feedback in l1-f2
    - id: unit-not-checked
      what: Accepts a result whose size or unit cannot be true (8 tables in a row 120 m long, a room 42 cm long)
      addressed: lesson 2 Learn checks the result against the real world; l2-f3, l2-f5, l2-s4, l2-n2, l2-n5, l2-c3 and l2-c4 ask whether a length can be true
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Erst in eine Einheit", en: "One unit first" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1,20 m = _"
            say: "Eins Komma zwei null Meter sind wie viele Zentimeter?"
            options: ["120 cm", "102 cm", "12 cm"]
            answer: "120 cm"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "2,5 km = _"
            say: "Zwei Komma fünf Kilometer sind wie viele Meter?"
            options: ["2500 m", "2005 m", "250 m"]
            answer: "2500 m"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ein Brett ist 1,20 m lang, ein anderes 85 cm.\nWie lang sind beide zusammen?"
            say: "Papa legt zwei Bretter hintereinander. Eins ist eins Komma zwei null Meter lang, das andere fünfundachtzig Zentimeter. Wie lang sind beide zusammen? Die Längen haben verschiedene Einheiten. Bevor du rechnest, bringst du sie in dieselbe Einheit."
          - text: "1,20 m = 120 cm\n120 cm + 85 cm = 205 cm = 2,05 m"
            say: "Eins Komma zwei null Meter sind hundertzwanzig Zentimeter. Hundertzwanzig plus fünfundachtzig sind zweihundertfünf Zentimeter, also zwei Komma null fünf Meter."
          - text: "Lena läuft 2,5 km und dann noch 800 m.\n2500 m + 800 m = 3300 m = 3,3 km"
            say: "Bei Kilometern und Metern geht es genauso. Zwei Komma fünf Kilometer sind zweitausendfünfhundert Meter. Mit achthundert Metern sind es dreitausenddreihundert Meter, also drei Komma drei Kilometer."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ein Brett ist 1,40 m lang. Opa sägt 35 cm ab. Wie lang ist der Rest?"
                say: "Ein Brett ist eins Komma vier null Meter lang. Opa sägt fünfunddreißig Zentimeter ab. Wie lang ist der Rest?"
                options: ["105 cm", "175 cm", "65 cm"]
                answer: "105 cm"
                feedback:
                  "175 cm": "Opa sägt etwas ab. Das Brett wird kürzer. Rechne minus."
                hints:
                  - "Rechne 1,40 m zuerst in Zentimeter um."
                  - "140 cm − 35 cm."
                  - "105 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ein Seil ist 2 m lang, ein anderes 60 cm. Wie lang sind beide zusammen?"
                say: "Ein Seil ist zwei Meter lang, ein anderes sechzig Zentimeter. Wie lang sind beide zusammen?"
                options: ["2,60 m", "62 cm", "62 m"]
                answer: "2,60 m"
                feedback:
                  "62 cm": "Du hast 2 und 60 zusammengezählt. Rechne zuerst 2 m in Zentimeter um: 200 cm."
                  "62 m": "Du hast 2 und 60 zusammengezählt. 60 cm sind weniger als ein Meter."
                hints:
                  - "Bring beide Längen in dieselbe Einheit."
                  - "200 cm + 60 cm = 260 cm."
                  - "2,60 m."
              - id: l1-f3
                type: fill_in_blank
                text: "Lena läuft 1,5 km zur Schule und dann 700 m weiter zur Bücherei. Wie weit läuft sie?"
                say: "Lena läuft eins Komma fünf Kilometer zur Schule und dann siebenhundert Meter weiter zur Bücherei. Wie weit läuft sie zusammen?"
                frame: "1500 m + 700 m = _ m = _ km"
                options: ["2200", "2,2", "2,7", "1570"]
                answer: ["2200", "2,2"]
                hints:
                  - "Beide Strecken stehen schon in Metern da."
                  - "1500 + 700 = 2200. 2000 m sind 2 km."
                  - "2200 m = 2,2 km."
              - id: l1-f4
                type: multiple_choice
                text: "Ein Schrank ist 1,80 m hoch. Darauf soll eine Kiste, 25 cm hoch. Das Zimmer ist 2,10 m hoch. Passt die Kiste darauf?"
                say: "Ein Schrank ist eins Komma acht null Meter hoch. Darauf soll eine Kiste, fünfundzwanzig Zentimeter hoch. Das Zimmer ist zwei Komma eins null Meter hoch. Passt die Kiste darauf?"
                options: ["Ja, es bleiben 5 cm Platz.", "Nein, es fehlen 5 cm.", "Ja, es bleiben 50 cm Platz."]
                answer: "Ja, es bleiben 5 cm Platz."
                hints:
                  - "Rechne alles in Zentimeter um."
                  - "180 cm + 25 cm = 205 cm. Das Zimmer ist 210 cm hoch."
                  - "Ja, es bleiben 5 cm Platz."
              - id: l1-f5
                type: true_false
                text: "Mama joggt 3 Runden um den Park. Eine Runde ist 800 m lang. Mia sagt: Mama ist 2,4 km gelaufen. Stimmt das?"
                say: "Mama joggt drei Runden um den Park. Eine Runde ist achthundert Meter lang. Mia sagt: Mama ist zwei Komma vier Kilometer gelaufen. Stimmt das?"
                answer: true
                hints:
                  - "Rechne zuerst in Metern."
                  - "3 · 800 m = 2400 m."
                  - "Ja, 2400 m sind 2,4 km."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Tim springt 2,35 m weit, Ali 1,98 m. Wie viel weiter springt Tim?"
                say: "Tim springt zwei Komma drei fünf Meter weit, Ali eins Komma neun acht Meter. Wie viel weiter springt Tim?"
                options: ["37 cm", "43 cm", "4,33 m"]
                answer: "37 cm"
                hints: ["235 cm − 198 cm."]
              - id: l1-s2
                type: multiple_choice
                text: "Ein Geschenkband ist 3 m lang. Lea schneidet 4 Stücke zu je 45 cm ab. Wie viel bleibt übrig?"
                say: "Ein Geschenkband ist drei Meter lang. Lea schneidet vier Stücke zu je fünfundvierzig Zentimeter ab. Wie viel bleibt übrig?"
                options: ["1,20 m", "1,80 m", "2,55 m"]
                answer: "1,20 m"
                hints: ["4 · 45 cm = 180 cm. 3 m sind 300 cm."]
              - id: l1-s3
                type: fill_in_blank
                text: "Familie Fuchs fährt 12,5 km mit dem Zug. Dann geht sie 1,8 km zu Fuß. Wie weit ist das zusammen?"
                say: "Familie Fuchs fährt zwölf Komma fünf Kilometer mit dem Zug. Dann geht sie eins Komma acht Kilometer zu Fuß. Wie weit ist das zusammen?"
                frame: "_ km"
                options: ["14,3", "13,3", "12,68"]
                answer: ["14,3"]
                hints: ["12 500 m + 1800 m."]
              - id: l1-s4
                type: true_false
                text: "Das Klassenzimmer ist 8,50 m lang. Ben rechnet: Das sind 850 m. Passt das?"
                say: "Das Klassenzimmer ist acht Komma fünf null Meter lang. Ben rechnet: Das sind achthundertfünfzig Meter. Passt das?"
                answer: false
                hints: ["8,50 m sind 8 m 50 cm. In welche Einheit hat Ben umgerechnet?"]
              - id: l1-s5
                type: multiple_choice
                text: "Ein Zaun hat 6 Felder. Jedes Feld ist 2,50 m lang. Wie lang ist der Zaun?"
                say: "Ein Zaun hat sechs Felder. Jedes Feld ist zwei Komma fünf null Meter lang. Wie lang ist der Zaun?"
                options: ["15 m", "12,30 m", "1,50 m"]
                answer: "15 m"
                hints: ["Zwei Felder sind 5 m lang."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Paul hat 1,60 m Schnur. Er braucht 2 m. Wie viel fehlt ihm?"
                say: "Paul hat eins Komma sechs null Meter Schnur. Er braucht zwei Meter. Wie viel fehlt ihm?"
                options: ["40 cm", "60 cm", "1,40 m"]
                answer: "40 cm"
              - id: l1-n2
                type: multiple_choice
                text: "Der Weg zum Bäcker ist 450 m lang. Max geht hin und zurück. Wie weit geht er?"
                say: "Der Weg zum Bäcker ist vierhundertfünfzig Meter lang. Max geht hin und zurück. Wie weit geht er?"
                options: ["900 m", "9 km", "450 m"]
                answer: "900 m"
              - id: l1-n3
                type: fill_in_blank
                text: "Ein Wanderweg ist 5 km lang. Nach 3,2 km macht die Klasse Pause. Wie weit ist es noch?"
                say: "Ein Wanderweg ist fünf Kilometer lang. Nach drei Komma zwei Kilometern macht die Klasse Pause. Wie weit ist es noch?"
                frame: "_ km"
                options: ["1,8", "2,8", "2,2"]
                answer: ["1,8"]
              - id: l1-n4
                type: true_false
                text: "Ein Bleistift ist 17 cm lang. Lina sagt: 10 Bleistifte hintereinander sind 1,70 m lang. Stimmt das?"
                say: "Ein Bleistift ist siebzehn Zentimeter lang. Lina sagt: Zehn Bleistifte hintereinander sind eins Komma sieben null Meter lang. Stimmt das?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Eine Runde auf der Radbahn ist 2,5 km lang. Kim fährt 4 Runden. Wie weit fährt sie?"
                say: "Eine Runde auf der Radbahn ist zwei Komma fünf Kilometer lang. Kim fährt vier Runden. Wie weit fährt sie?"
                options: ["10 km", "8,5 km", "100 km"]
                answer: "10 km"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ein Tisch ist 1,60 m lang, ein zweiter 90 cm. Wie lang sind beide zusammen?"
            say: "Ein Tisch ist eins Komma sechs null Meter lang, ein zweiter neunzig Zentimeter. Wie lang sind beide zusammen?"
            options: ["2,50 m", "91,60 m", "1,70 m"]
            answer: "2,50 m"
          - id: l1-c2
            type: multiple_choice
            text: "Oma wohnt 3 km weit weg. Lukas ist schon 1,2 km gefahren. Wie weit ist es noch?"
            say: "Oma wohnt drei Kilometer weit weg. Lukas ist schon eins Komma zwei Kilometer gefahren. Wie weit ist es noch?"
            options: ["1,8 km", "2,2 km", "1,2 km"]
            answer: "1,8 km"
          - id: l1-c3
            type: true_false
            text: "Ein Turnseil ist 4 m lang. Es wird halbiert. Ist jedes Stück 200 cm lang?"
            say: "Ein Turnseil ist vier Meter lang. Es wird in der Mitte durchgeschnitten. Ist jedes Stück zweihundert Zentimeter lang?"
            answer: true

  - n: 2
    title: { de: "In Schritten rechnen und prüfen", en: "Steps and checks" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "1,50 m + 70 cm = _"
            say: "Eins Komma fünf null Meter plus siebzig Zentimeter."
            options: ["2,20 m", "71,50 m", "1,57 m"]
            answer: "2,20 m"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "3 km − 400 m = _"
            say: "Drei Kilometer minus vierhundert Meter."
            options: ["2,6 km", "2,4 km", "2,96 km"]
            answer: "2,6 km"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ein Band ist 5 m lang.\nMia schneidet 6 Stücke zu je 70 cm ab.\nWie viel bleibt übrig?"
            say: "Ein Band ist fünf Meter lang. Mia schneidet sechs Stücke zu je siebzig Zentimeter ab. Wie viel bleibt übrig? Das geht in zwei Schritten."
          - text: "1. 6 · 70 cm = 420 cm\n2. 500 cm − 420 cm = 80 cm"
            say: "Zuerst rechnest du, wie viel Band Mia abschneidet: vierhundertzwanzig Zentimeter. Dann ziehst du das von fünfhundert Zentimetern ab. Es bleiben achtzig Zentimeter übrig."
          - text: "Prüfen: Kann das stimmen?\nÜberschlag: 6 · 70 cm sind etwa 4 m. Es bleibt etwa 1 m.\n80 cm passt."
            say: "Zum Schluss prüfst du. Sechs Stücke zu siebzig Zentimetern sind ungefähr vier Meter. Dann bleibt ungefähr ein Meter. Achtzig Zentimeter passt dazu. Prüfe auch die Einheit: Kann die Länge in Wirklichkeit so groß sein?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Oma hat 4 m Stoff. Sie näht 5 Kissen und braucht für jedes 60 cm. Wie viel Stoff bleibt übrig?"
                say: "Oma hat vier Meter Stoff. Sie näht fünf Kissen und braucht für jedes sechzig Zentimeter. Wie viel Stoff bleibt übrig?"
                options: ["1 m", "3 m", "3,40 m"]
                answer: "1 m"
                feedback:
                  "3 m": "3 m braucht Oma für die Kissen. Gefragt ist, wie viel übrig bleibt."
                  "3,40 m": "Das bleibt nach einem Kissen übrig. Oma näht 5 Kissen."
                hints:
                  - "Rechne zuerst, wie viel Stoff alle Kissen brauchen."
                  - "5 · 60 cm = 300 cm. 4 m sind 400 cm."
                  - "1 m."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Jonas wohnt 2,4 km von der Schule. Er fährt jeden Tag hin und zurück, 5 Tage lang. Wie weit fährt er in dieser Woche?"
                say: "Jonas wohnt zwei Komma vier Kilometer von der Schule entfernt. Er fährt jeden Tag hin und zurück, fünf Tage lang. Wie weit fährt er in dieser Woche?"
                options: ["24 km", "12 km", "4,8 km"]
                answer: "24 km"
                hints:
                  - "Rechne zuerst einen Tag: hin und zurück."
                  - "2 · 2,4 km = 4,8 km. Dann mal 5."
                  - "24 km."
              - id: l2-f3
                type: true_false
                text: "Ein Tisch ist 1,50 m lang. Ben rechnet aus: 8 Tische hintereinander sind 120 m lang. Passt das?"
                say: "Ein Tisch ist eins Komma fünf null Meter lang. Ben rechnet aus: Acht Tische hintereinander sind hundertzwanzig Meter lang. Passt das?"
                answer: false
                hints:
                  - "Mach einen Überschlag: 8 Tische, je ungefähr 1,5 m."
                  - "8 · 150 cm = 1200 cm. Das sind 12 m."
                  - "Nein. Ben hat sich in der Einheit vertan."
              - id: l2-f4
                type: multiple_choice
                text: "Ein Beet ist 3,50 m lang und 1,50 m breit. Papa legt einmal eine Schnur ganz herum. Wie lang ist die Schnur?"
                say: "Ein Beet ist drei Komma fünf null Meter lang und eins Komma fünf null Meter breit. Papa legt einmal eine Schnur ganz um das Beet herum. Wie lang ist die Schnur?"
                options: ["10 m", "5 m", "6,50 m"]
                answer: "10 m"
                hints:
                  - "Das Beet hat zwei lange und zwei kurze Seiten."
                  - "3,50 m + 1,50 m sind 5 m. Das ist erst die halbe Runde."
                  - "10 m."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Länge kann stimmen? Der Weg von der Schule zum Sportplatz ist ... lang."
                say: "Welche Länge kann stimmen? Der Weg von der Schule zum Sportplatz ist wie lang?"
                options: ["900 m", "900 cm", "900 km"]
                answer: "900 m"
                hints:
                  - "Stell dir jede Länge vor."
                  - "900 cm sind 9 m, 900 km sind weiter als von Hamburg nach München."
                  - "900 m."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ein Zug hat eine Lok, 19 m lang, und 8 Wagen zu je 25 m. Wie lang ist der Zug?"
                say: "Ein Zug hat eine Lok, neunzehn Meter lang, und acht Wagen zu je fünfundzwanzig Meter. Wie lang ist der ganze Zug?"
                options: ["219 m", "200 m", "52 m"]
                answer: "219 m"
                hints: ["Erst die 8 Wagen, dann die Lok dazu."]
              - id: l2-s2
                type: multiple_choice
                text: "Lisa hat 3 m Band. Für eine Schleife braucht sie 45 cm. Wie viele Schleifen kann sie machen?"
                say: "Lisa hat drei Meter Band. Für eine Schleife braucht sie fünfundvierzig Zentimeter. Wie viele Schleifen kann sie machen?"
                options: ["6", "7", "45"]
                answer: "6"
                hints: ["300 cm : 45 cm = 6 Rest 30. Reicht der Rest für eine Schleife?"]
              - id: l2-s3
                type: true_false
                text: "Eine Wanderung ist 12 km lang. Am Vormittag schafft die Klasse 7,5 km. Bleiben noch 4,5 km?"
                say: "Eine Wanderung ist zwölf Kilometer lang. Am Vormittag schafft die Klasse sieben Komma fünf Kilometer. Bleiben noch vier Komma fünf Kilometer?"
                answer: true
                hints: ["12 000 m − 7500 m."]
              - id: l2-s4
                type: multiple_choice
                text: "Welche Länge kann stimmen? Ein Fußballtor ist ... breit."
                say: "Welche Länge kann stimmen? Ein Fußballtor ist wie breit?"
                options: ["7,32 m", "7,32 cm", "7,32 km"]
                answer: "7,32 m"
                hints: ["Ein Torwart muss sich weit strecken, aber das Tor ist kleiner als ein Haus."]
              - id: l2-s5
                type: multiple_choice
                text: "Tom wirft den Ball 18,50 m weit. Eva wirft 3,20 m weiter als Tom. Wie weit werfen beide zusammen?"
                say: "Tom wirft den Ball achtzehn Komma fünf null Meter weit. Eva wirft drei Komma zwei null Meter weiter als Tom. Wie weit werfen beide zusammen?"
                options: ["40,20 m", "21,70 m", "37 m"]
                answer: "40,20 m"
                hints: ["Rechne zuerst, wie weit Eva wirft."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Für ein Regal braucht Papa 4 Bretter zu je 85 cm. Im Baumarkt gibt es Bretter von 2 m, die er zersägen kann. Wie viele 2-m-Bretter braucht er?"
                say: "Für ein Regal braucht Papa vier Bretter zu je fünfundachtzig Zentimeter. Im Baumarkt gibt es Bretter von zwei Metern, die er zersägen kann. Wie viele Zwei-Meter-Bretter braucht er?"
                options: ["2", "1", "4"]
                answer: "2"
              - id: l2-n2
                type: true_false
                text: "Ein Kinderzimmer ist 4,20 m lang. Ida rechnet: Das sind 42 cm. Passt das?"
                say: "Ein Kinderzimmer ist vier Komma zwei null Meter lang. Ida rechnet: Das sind zweiundvierzig Zentimeter. Passt das?"
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Die Laufbahn ist 400 m lang. Nils läuft 6 Runden. Wie viele Kilometer sind das?"
                say: "Die Laufbahn ist vierhundert Meter lang. Nils läuft sechs Runden. Wie viele Kilometer sind das?"
                options: ["2,4 km", "24 km", "2,04 km"]
                answer: "2,4 km"
              - id: l2-n4
                type: multiple_choice
                text: "Eine Leiter ist 3,50 m lang. Papa zieht sie um 1,25 m aus. Wie lang ist sie dann?"
                say: "Eine Leiter ist drei Komma fünf null Meter lang. Papa zieht sie um eins Komma zwei fünf Meter aus. Wie lang ist sie dann?"
                options: ["4,75 m", "2,25 m", "3,75 m"]
                answer: "4,75 m"
              - id: l2-n5
                type: multiple_choice
                text: "Welche Länge kann stimmen? Ein Lineal ist ... lang."
                say: "Welche Länge kann stimmen? Ein Lineal ist wie lang?"
                options: ["30 cm", "30 m", "30 mm"]
                answer: "30 cm"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Ein Seil ist 5 m lang. Kai schneidet 3 Stücke zu je 1,20 m ab. Wie viel bleibt übrig?"
            say: "Ein Seil ist fünf Meter lang. Kai schneidet drei Stücke zu je eins Komma zwei null Meter ab. Wie viel bleibt übrig?"
            options: ["1,40 m", "3,80 m", "3,60 m"]
            answer: "1,40 m"
          - id: l2-c2
            type: multiple_choice
            text: "Mira geht 1,2 km zur Oma und dann 650 m weiter zum Spielplatz. Wie weit geht sie?"
            say: "Mira geht eins Komma zwei Kilometer zur Oma und dann sechshundertfünfzig Meter weiter zum Spielplatz. Wie weit geht sie?"
            options: ["1850 m", "1265 m", "662 m"]
            answer: "1850 m"
          - id: l2-c3
            type: true_false
            text: "Ein Bus ist 12 m lang. Ali sagt: 3 Busse hintereinander sind 36 km lang. Passt das?"
            say: "Ein Bus ist zwölf Meter lang. Ali sagt: Drei Busse hintereinander sind sechsunddreißig Kilometer lang. Passt das?"
            answer: false
          - id: l2-c4
            type: multiple_choice
            text: "Welche Länge kann stimmen? Ein Fahrrad ist ... lang."
            say: "Welche Länge kann stimmen? Ein Fahrrad ist wie lang?"
            options: ["1,70 m", "17 m", "1,70 km"]
            answer: "1,70 m"
          - id: l2-c5
            type: multiple_choice
            text: "Ein Weg ist 2,4 km lang. Er wird in 3 gleich lange Abschnitte geteilt. Wie lang ist ein Abschnitt?"
            say: "Ein Weg ist zwei Komma vier Kilometer lang. Er wird in drei gleich lange Abschnitte geteilt. Wie lang ist ein Abschnitt?"
            options: ["800 m", "80 m", "8 km"]
            answer: "800 m"
