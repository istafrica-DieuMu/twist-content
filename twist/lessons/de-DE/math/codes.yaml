# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.codes
skill: math.patterns.codes
curriculum: de-DE
language: de
title:
  de: Geheimschriften und Codes
  en: Secret codes
summary: >
  Lesson 1 uses the Zahlencode A = 1 to Z = 26 to decode and encode
  words, one number for each letter; lesson 2 adds a rule (jede Zahl
  plus 3, jede Zahl verdoppelt), decodes by working the rule backwards,
  judges whether an invented code works (no two letters may share a
  number), cracks Zahlenschloss riddles and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Muster, en: Patterns }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.patterns.number-patterns]
  also_practises: [math.mult-div.core-facts, math.add-sub-to-100.add-two-digit]
  vocabulary: { de: [Code, Geheimschrift, verschlüsseln, entschlüsseln, Regel, rückwärts] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: digits-as-letters
      what: Reads a two-digit number as two letters (12 as A and B instead of L)
      addressed: lesson 1 Learn says each number is one letter; l1-f5 and l1-s5 name the mistake, and every decoding task has numbers above 9
    - id: rule-not-reversed
      what: Decodes by applying the rule again instead of working it backwards (adds 2 again instead of taking 2 away)
      addressed: lesson 2 Learn turns plus into minus and mal into geteilt; l2-f1, l2-f3, l2-s4, l2-n4 and l2-c3 offer the letters from the wrong direction or from no rule, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Der Zahlencode", en: "The number code" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Setze die Folge fort."
            say: "Wie geht die Zahlenfolge weiter?"
            frame: "3, 6, 9, 12, _"
            options: ["15", "14", "18"]
            answer: ["15"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Regel hat die Folge 5, 10, 15, 20?"
            say: "Welche Regel hat die Folge fünf, zehn, fünfzehn, zwanzig?"
            options: ["+5", "+10", "· 2"]
            answer: "+5"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26"
            say: "Das ist der Zahlencode. Jeder Buchstabe steht für eine Zahl. A ist eins, B ist zwei, und so geht es weiter bis Z. Z ist sechsundzwanzig."
          - text: "8 1 21 19\nH A U S"
            say: "Eine Geheimbotschaft: acht, eins, einundzwanzig, neunzehn. Du suchst jede Zahl in der Tabelle. Acht ist H, eins ist A, einundzwanzig ist U, neunzehn ist S. Das Wort heißt Haus. Jede Zahl ist genau ein Buchstabe, auch die einundzwanzig."
          - text: "B A L L\n2 1 12 12"
            say: "Umgekehrt verschlüsselst du ein Wort. Für jeden Buchstaben schreibst du seine Zahl auf, mit Abstand dazwischen. Ball heißt zwei, eins, zwölf, zwölf. Die zwölf ist das L, nicht A und B."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\n13 1 21 19"
                say: "Entschlüssle die Botschaft mit dem Zahlencode. Welches Wort ist das?"
                options: ["MAUS", "HAUS", "LAUS"]
                answer: "MAUS"
                hints:
                  - "Such jede Zahl in der Tabelle."
                  - "1 ist A, 21 ist U, 19 ist S. Welcher Buchstabe ist 13?"
                  - "MAUS."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nWie heißt KATZE im Zahlencode?"
                say: "Verschlüssle das Wort Katze mit dem Zahlencode."
                options: ["11 1 20 26 5", "11 1 20 25 5", "10 1 20 26 5"]
                answer: "11 1 20 26 5"
                option_audio: false
                hints:
                  - "Such jeden Buchstaben in der Tabelle: K, A, T, Z, E."
                  - "K ist 11 und Z ist 26."
                  - "11 1 20 26 5."
              - id: l1-f3
                type: fill_in_blank
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\n2 1 21 13"
                say: "Entschlüssle die Botschaft. Setze die Buchstaben ein."
                frame: "_ _ _ _"
                options: ["B", "A", "U", "M", "N", "V"]
                answer: ["B", "A", "U", "M"]
                hints:
                  - "Eine Zahl, ein Buchstabe."
                  - "2 ist B, 1 ist A. Dann 21 und 13."
                  - "B A U M."
              - id: l1-f4
                type: true_false
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nTim schreibt SONNE so: 19 15 14 14 5. Stimmt das?"
                say: "Tim hat das Wort Sonne verschlüsselt. Hat er richtig verschlüsselt?"
                answer: true
                hints:
                  - "Prüfe jeden Buchstaben einzeln."
                  - "S ist 19, O ist 15, N ist 14, E ist 5."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Ole entschlüsselt 12 1 21 19 so: A B A U S. Was ist passiert?"
                say: "Ole entschlüsselt die Botschaft zwölf, eins, einundzwanzig, neunzehn. Er schreibt A, B, A, U, S. Was ist passiert?"
                options: ["Er hat 12 als 1 und 2 gelesen. 12 ist L: LAUS.", "Nichts, ABAUS stimmt.", "Er hat 21 falsch gelesen."]
                answer: "Er hat 12 als 1 und 2 gelesen. 12 ist L: LAUS."
                hints:
                  - "Zwischen den Zahlen steht ein Abstand. Jede Zahl ist ein Buchstabe."
                  - "Die 12 ist eine Zahl, also ein Buchstabe."
                  - "Er hat 12 als 1 und 2 gelesen. 12 ist L: LAUS."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\n6 9 19 3 8"
                say: "Entschlüssle die Botschaft. Welches Wort ist das?"
                options: ["FISCH", "FIRCH", "GISCH"]
                answer: "FISCH"
                hints: ["6 ist F. Such die anderen Zahlen."]
              - id: l1-s2
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nWie heißt HUND im Zahlencode?"
                say: "Verschlüssle das Wort Hund."
                options: ["8 21 14 4", "8 20 14 4", "8 21 13 4"]
                answer: "8 21 14 4"
                option_audio: false
                hints: ["U ist 21, N ist 14."]
              - id: l1-s3
                type: fill_in_blank
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\n23 15 12 6"
                say: "Entschlüssle die Botschaft. Setze die Buchstaben ein."
                frame: "_ _ _ _"
                options: ["W", "O", "L", "F", "V", "P"]
                answer: ["W", "O", "L", "F"]
                hints: ["23 ist W."]
              - id: l1-s4
                type: true_false
                text: "Im Zahlencode ist A + B + C = 6. Stimmt das?"
                say: "Du zählst die Zahlen von A, B und C zusammen. Kommt sechs heraus?"
                answer: true
                hints: ["A ist 1, B ist 2, C ist 3."]
              - id: l1-s5
                type: true_false
                text: "Mia liest die 15 im Zahlencode als A und E. Stimmt das?"
                say: "Mia liest die fünfzehn im Zahlencode als zwei Buchstaben, A und E. Stimmt das?"
                answer: false
                hints: ["Jede Zahl ist genau ein Buchstabe."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\n16 9 26 26 1"
                say: "Entschlüssle die Botschaft. Welches Wort ist das?"
                options: ["PIZZA", "PIYYA", "OIZZA"]
                answer: "PIZZA"
              - id: l1-n2
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nWie heißt BUCH im Zahlencode?"
                say: "Verschlüssle das Wort Buch."
                options: ["2 21 3 8", "2 20 3 8", "2 21 3 9"]
                answer: "2 21 3 8"
                option_audio: false
              - id: l1-n3
                type: fill_in_blank
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\n12 9 5 2 5"
                say: "Entschlüssle die Botschaft. Setze die Buchstaben ein."
                frame: "_ _ _ _ _"
                options: ["L", "I", "E", "B", "K", "P"]
                answer: ["L", "I", "E", "B", "E"]
              - id: l1-n4
                type: true_false
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\n15 13 1 heißt OMA. Stimmt das?"
                say: "Heißt die Botschaft fünfzehn, dreizehn, eins wirklich Oma?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nWelcher Buchstabe steht für 20?"
                say: "Welcher Buchstabe steht im Zahlencode für zwanzig?"
                options: ["T", "S", "U"]
                answer: "T"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\n18 5 7 5 14"
            say: "Entschlüssle die Botschaft. Welches Wort ist das?"
            options: ["REGEN", "SEGEN", "REHEN"]
            answer: "REGEN"
          - id: l1-c2
            type: multiple_choice
            text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nWie heißt MILCH im Zahlencode?"
            say: "Verschlüssle das Wort Milch."
            options: ["13 9 12 3 8", "13 9 11 3 8", "14 9 12 3 8"]
            answer: "13 9 12 3 8"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Im Zahlencode steht 26 für Z. Stimmt das?"
            say: "Steht im Zahlencode die sechsundzwanzig für Z?"
            answer: true

  - n: 2
    title: { de: "Codes mit Regeln", en: "Codes with rules" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\n19 20 5 18 14"
            say: "Entschlüssle die Botschaft mit dem Zahlencode."
            options: ["STERN", "STEAN", "SPERN"]
            answer: "STERN"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nWie heißt EIS im Zahlencode?"
            say: "Verschlüssle das Wort Eis."
            options: ["5 9 19", "5 9 18", "5 8 19"]
            answer: "5 9 19"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Regel: Jede Zahl ist verdoppelt.\n16 2 42 38\nHalbieren: 8 1 21 19\nH A U S"
            say: "Ein Code kann eine Rechenregel haben. Hier wurde jede Zahl aus dem Zahlencode verdoppelt. Zum Entschlüsseln rechnest du rückwärts: Du halbierst jede Zahl. Dann suchst du die Buchstaben. Das Wort heißt wieder Haus."
          - text: "Regel: Jede Zahl plus 3.\nO M A\n15 13 1\n18 16 4"
            say: "Zum Verschlüsseln rechnest du die Regel vorwärts. Oma ist fünfzehn, dreizehn, eins. Plus drei ergibt achtzehn, sechzehn, vier. Wer die Botschaft liest, rechnet rückwärts: minus drei. Aus plus wird minus, aus mal wird geteilt."
          - text: "Ein guter Code: Jeder Buchstabe hat seine eigene Zahl."
            say: "Wenn du einen eigenen Code erfindest, achte darauf: Zwei Buchstaben dürfen nie dieselbe Zahl haben. Sonst kann niemand sicher lesen, was gemeint ist."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nRegel: Jede Zahl plus 2.\n10 3 23 21"
                say: "Diese Botschaft wurde mit der Regel jede Zahl plus zwei verschlüsselt. Welches Wort ist das?"
                options: ["HAUS", "LEYW", "JCWU"]
                answer: "HAUS"
                feedback:
                  "LEYW": "Du hast noch einmal plus 2 gerechnet. Zum Entschlüsseln rechnest du rückwärts: minus 2."
                  "JCWU": "Du hast die Regel vergessen. Rechne zuerst bei jeder Zahl minus 2."
                hints:
                  - "Rechne die Regel rückwärts."
                  - "Minus 2: 10 wird 8, 3 wird 1, 23 wird 21, 21 wird 19."
                  - "HAUS."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Regel: Jede Zahl mal 2.\nWie verschlüsselst du ABC?"
                say: "Die Regel heißt: jede Zahl mal zwei. Wie verschlüsselst du A, B, C?"
                options: ["2 4 6", "1 2 3", "3 4 5"]
                answer: "2 4 6"
                option_audio: false
                hints:
                  - "Schreib zuerst die Zahlen von A, B und C auf."
                  - "1 2 3. Jetzt jede Zahl mal 2."
                  - "2 4 6."
              - id: l2-f3
                type: fill_in_blank
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nRegel: Jede Zahl plus 1.\n21 16 19"
                say: "Diese Botschaft wurde mit der Regel jede Zahl plus eins verschlüsselt. Setze die Buchstaben ein."
                frame: "_ _ _"
                options: ["T", "O", "R", "U", "P", "S"]
                answer: ["T", "O", "R"]
                hints:
                  - "Rechne zuerst bei jeder Zahl minus 1."
                  - "20 15 18."
                  - "T O R."
              - id: l2-f4
                type: multiple_choice
                text: "Kinder erfinden Codes. Welcher Code funktioniert?"
                say: "Drei Kinder erfinden einen Code. Welcher Code funktioniert?"
                options: ["Jeder Buchstabe bekommt seine Zahl mal 3.", "Jeder Vokal bekommt die 1, jeder andere Buchstabe die 2.", "Jeder Buchstabe bekommt die Zahl 5."]
                answer: "Jeder Buchstabe bekommt seine Zahl mal 3."
                hints:
                  - "Hat bei jedem Code jeder Buchstabe seine eigene Zahl?"
                  - "Bei der 1 und der 2 weißt du nicht, welcher Buchstabe gemeint ist."
                  - "Jeder Buchstabe bekommt seine Zahl mal 3."
              - id: l2-f5
                type: true_false
                text: "Lea verschlüsselt mit der Regel plus 4. Ihre Freundin entschlüsselt mit minus 4. Stimmt das so?"
                say: "Lea verschlüsselt mit der Regel plus vier. Ihre Freundin entschlüsselt mit minus vier. Stimmt das so?"
                answer: true
                hints:
                  - "Zum Entschlüsseln rechnest du rückwärts."
                  - "Rückwärts wird aus plus minus."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nRegel: Jede Zahl verdoppelt.\n30 26 2"
                say: "Diese Botschaft wurde mit der Regel jede Zahl verdoppelt verschlüsselt. Welches Wort ist das?"
                options: ["OMA", "OPA", "EMU"]
                answer: "OMA"
                hints: ["Halbiere jede Zahl."]
              - id: l2-s2
                type: multiple_choice
                text: "Regel: Jede Zahl plus 3.\nWie verschlüsselst du EI?"
                say: "Die Regel heißt: jede Zahl plus drei. Wie verschlüsselst du das Wort Ei?"
                options: ["8 12", "5 9", "2 6"]
                answer: "8 12"
                option_audio: false
                hints: ["E ist 5, I ist 9."]
              - id: l2-s3
                type: true_false
                text: "Max erfindet einen Code: A = 1, B = 1, C = 2, D = 2 und so weiter. Ist das ein guter Code?"
                say: "Max erfindet einen Code. A und B bekommen die eins, C und D die zwei, und so weiter. Ist das ein guter Code?"
                answer: false
                hints: ["Welcher Buchstabe ist gemeint, wenn eine 1 dasteht?"]
              - id: l2-s4
                type: fill_in_blank
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nRegel: Jede Zahl minus 2.\n24 13 13"
                say: "Diese Botschaft wurde mit der Regel jede Zahl minus zwei verschlüsselt. Setze die Buchstaben ein."
                frame: "_ _ _"
                options: ["Z", "O", "X", "M", "Y", "N"]
                answer: ["Z", "O", "O"]
                hints: ["Rückwärts wird aus minus plus."]
              - id: l2-s5
                type: multiple_choice
                text: "Zahlenschloss: Die Zahl hat drei Ziffern. Jede Ziffer ist um 2 größer als die davor. Die erste Ziffer ist 3. Wie heißt die Zahl?"
                say: "Ein Zahlenschloss: Die Zahl hat drei Ziffern. Jede Ziffer ist um zwei größer als die davor. Die erste Ziffer ist drei. Wie heißt die Zahl?"
                options: ["357", "345", "579"]
                answer: "357"
                option_audio: false
                hints: ["3, dann 3 + 2, dann noch einmal + 2."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nRegel: Jede Zahl plus 1.\n3 2 5"
                say: "Diese Botschaft wurde mit der Regel jede Zahl plus eins verschlüsselt. Welches Wort ist das?"
                options: ["BAD", "CBE", "ABC"]
                answer: "BAD"
              - id: l2-n2
                type: multiple_choice
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nRegel: Jede Zahl mal 2.\nWie verschlüsselst du HUT?"
                say: "Die Regel heißt: jede Zahl mal zwei. Wie verschlüsselst du das Wort Hut?"
                options: ["16 42 40", "8 21 20", "10 23 22"]
                answer: "16 42 40"
                option_audio: false
              - id: l2-n3
                type: true_false
                text: "Funktioniert ein Code mit der Regel: Jede Zahl mal 10?"
                say: "Funktioniert ein Code mit der Regel: jede Zahl mal zehn?"
                answer: true
              - id: l2-n4
                type: fill_in_blank
                text: "A=1 B=2 C=3 D=4 E=5 F=6 G=7\nH=8 I=9 J=10 K=11 L=12 M=13 N=14\nO=15 P=16 Q=17 R=18 S=19 T=20 U=21\nV=22 W=23 X=24 Y=25 Z=26\n\nRegel: Jede Zahl plus 5.\n19 6 24 10"
