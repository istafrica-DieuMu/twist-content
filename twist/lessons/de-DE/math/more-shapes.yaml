# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.more-shapes
skill: math.shapes.more-shapes
curriculum: de-DE
language: de
title:
  de: Sechseck, Achteck, Parallelogramm
  en: Hexagons, octagons and parallelograms
summary: >
  Lesson 1 names Vielecke by their corners (Fünfeck, Sechseck, Achteck),
  learns that a shape with straight sides has as many corners as sides,
  and finds them in things around us (Stoppschild, Bienenwabe); lesson 2
  meets the Parallelogramm as a slanted Viereck, uses the terms Ecke,
  Seite, parallel and rechter Winkel to tell Quadrat, Rechteck and
  Parallelogramm apart, and ends with the skill check. Every shape the
  lesson names is shown with the shape component.
metadata:
  year: klasse-3
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.properties]
  also_practises: [math.shapes.properties]
  vocabulary: { de: [Fünfeck, Sechseck, Achteck, Viereck, Parallelogramm, parallel, rechter Winkel, Ecke, Seite] }
  forms: [text, audio, drawn]
  drawn: [shape]
  facets: []
  misconceptions:
    - id: name-by-look
      what: Names a shape by how round or big it looks (calls an Achteck a Kreis) instead of counting corners, or thinks corners and sides can differ in number
      addressed: lesson 1 Learn names each shape by its corners; l1-f4 has feedback on calling the Stoppschild a Kreis, l1-f5 claims a Fünfeck has 6 sides, l1-s4 calls a Sechseck an Achteck, l2-c2 gives eight sides
    - id: slanted-not-viereck
      what: Thinks only squares and rectangles are Vierecke, so a slanted Parallelogramm is no Viereck
      addressed: lesson 2 Learn pushes a rectangle into a Parallelogramm and calls all three Vierecke; l2-f2, l2-s5 and l2-n2 ask what makes a Viereck, l2-f3 has feedback on the Parallelogramm
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Fünfeck, Sechseck, Achteck", en: "Pentagons, hexagons and octagons" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Ecken hat diese Form?"
            say: "Wie viele Ecken hat diese Form?"
            show: { drawn: shape, kind: triangle, colour: blue }
            options: ["3", "4", "5"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Beim Quadrat sind alle Seiten gleich lang."
            say: "Stimmt das? Beim Quadrat sind alle Seiten gleich lang."
            show: { drawn: shape, kind: square, colour: yellow }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "das Sechseck: 6 Ecken, 6 Seiten"
            say: "Das ist ein Sechseck. Es hat sechs Ecken und sechs gerade Seiten. Die Waben im Bienenstock haben diese Form."
            show: { drawn: shape, kind: hexagon, colour: yellow }
          - text: "das Fünfeck: 5 Ecken, 5 Seiten"
            say: "Den Namen einer Figur mit geraden Seiten findest du über die Ecken. Das ist ein Fünfeck. Es hat fünf Ecken."
            show: { drawn: shape, kind: pentagon, colour: green }
          - text: "das Achteck: 8 Ecken, 8 Seiten"
            say: "Das ist ein Achteck. Es hat acht Ecken. Ein Stoppschild ist ein Achteck. Es sieht fast rund aus, hat aber acht gerade Seiten."
            show: { drawn: shape, kind: octagon, colour: red }
          - text: "Ecken und Seiten sind gleich viele."
            say: "Zähl Ecken und Seiten: Bei jeder Figur mit geraden Seiten sind es gleich viele. Ein Dreieck hat drei Ecken und drei Seiten, ein Sechseck sechs Ecken und sechs Seiten."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißt diese Figur?"
                say: "Wie heißt diese Figur?"
                show: { drawn: shape, kind: hexagon, colour: green }
                options: ["Sechseck", "Achteck", "Fünfeck"]
                answer: "Sechseck"
                hints:
                  - "Zähl die Ecken."
                  - "Es sind 6 Ecken."
                  - "Sechseck."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Ecken hat ein Achteck?"
                say: "Wie viele Ecken hat ein Achteck?"
                options: ["8", "6", "4"]
                answer: "8"
                hints:
                  - "Der Name sagt es dir."
                  - "Acht-eck."
                  - "8."
              - id: l1-f3
                type: image_multiple_choice
                text: "Wo ist das Sechseck?"
                say: "Wo ist das Sechseck?"
                options:
                  - { drawn: shape, kind: hexagon, colour: red }
                  - { drawn: shape, kind: pentagon, colour: red }
                  - { drawn: shape, kind: rectangle, colour: red }
                answer: hexagon
                option_audio: false
                hints:
                  - "Ein Sechseck hat 6 Ecken."
                  - "Zähl bei jeder Form die Ecken."
                  - "Es ist die Form mit 6 Ecken."
              - id: l1-f4
                type: multiple_choice
                text: "Ein Stoppschild hat 8 gerade Seiten. Welche Form hat es?"
                say: "Ein Stoppschild hat acht gerade Seiten. Welche Form hat es?"
                show: { drawn: shape, kind: octagon, colour: red }
                options: ["Achteck", "Sechseck", "Kreis"]
                answer: "Achteck"
                feedback:
                  "Kreis": "Ein Stoppschild sieht fast rund aus, aber es hat 8 gerade Seiten und 8 Ecken."
                hints:
                  - "Seiten und Ecken sind gleich viele."
                  - "8 Seiten heißt 8 Ecken."
                  - "Achteck."
              - id: l1-f5
                type: true_false
                text: "Ein Fünfeck hat 5 Ecken und 6 Seiten."
                say: "Stimmt das? Ein Fünfeck hat fünf Ecken und sechs Seiten."
                answer: false
                hints:
                  - "Ecken und Seiten sind gleich viele."
                  - "5 Ecken heißt 5 Seiten."
                  - "Nein. Es hat 5 Ecken und 5 Seiten."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Seiten hat ein Sechseck?"
                say: "Wie viele Seiten hat ein Sechseck?"
                options: ["6", "5", "8"]
                answer: "6"
                hints: ["Ecken und Seiten sind gleich viele."]
              - id: l1-s2
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jede Form mit ihren Ecken."
                pairs:
                  - { left: { drawn: shape, kind: triangle, colour: blue }, right: { text: "3 Ecken" } }
                  - { left: { drawn: shape, kind: pentagon, colour: blue }, right: { text: "5 Ecken" } }
                  - { left: { drawn: shape, kind: hexagon, colour: blue }, right: { text: "6 Ecken" } }
                  - { left: { drawn: shape, kind: octagon, colour: blue }, right: { text: "8 Ecken" } }
                hints: ["Zähl bei jeder Form die Ecken."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie heißt diese Figur?"
                say: "Wie heißt diese Figur?"
                show: { drawn: shape, kind: pentagon, colour: orange }
                options: ["Fünfeck", "Sechseck", "Viereck"]
                answer: "Fünfeck"
                hints: ["Der Name sagt, wie viele Ecken es sind."]
              - id: l1-s4
                type: true_false
                text: "Das ist ein Achteck."
                say: "Stimmt das? Das ist ein Achteck."
                show: { drawn: shape, kind: hexagon, colour: red }
                answer: false
                hints: ["Zähl die Ecken."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Figur hat die meisten Ecken?"
                say: "Welche Figur hat die meisten Ecken?"
                options: ["Achteck", "Sechseck", "Fünfeck"]
                answer: "Achteck"
                hints: ["Der Name sagt, wie viele Ecken es sind."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Eine Figur hat 8 Seiten. Wie heißt sie?"
                say: "Eine Figur hat acht Seiten. Wie heißt sie?"
                options: ["Achteck", "Sechseck", "Viereck"]
                answer: "Achteck"
              - id: l1-n2
                type: image_multiple_choice
                text: "Wo sind 6 Ecken?"
                say: "Welche Form hat sechs Ecken?"
                options:
                  - { drawn: shape, kind: hexagon, colour: yellow }
                  - { drawn: shape, kind: pentagon, colour: yellow }
                  - { drawn: shape, kind: octagon, colour: yellow }
                answer: hexagon
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Ein Viereck hat 4 Ecken und 4 Seiten."
                say: "Stimmt das? Ein Viereck hat vier Ecken und vier Seiten."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Die Waben im Bienenstock haben 6 Ecken. Welche Form haben sie?"
                say: "Die Waben im Bienenstock haben sechs Ecken. Welche Form haben sie?"
                options: ["Sechseck", "Achteck", "Fünfeck"]
                answer: "Sechseck"
              - id: l1-n5
                type: text_input
                text: "Wie viele Ecken haben ein Dreieck und ein Achteck zusammen?"
                say: "Wie viele Ecken haben ein Dreieck und ein Achteck zusammen?"
                answer: "11"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie heißt diese Figur?"
            say: "Wie heißt diese Figur?"
            show: { drawn: shape, kind: octagon, colour: blue }
            options: ["Sechseck", "Fünfeck", "Achteck"]
            answer: "Achteck"
          - id: l1-c2
            type: multiple_choice
            text: "Wie viele Ecken hat ein Fünfeck?"
            say: "Wie viele Ecken hat ein Fünfeck?"
            options: ["5", "4", "6"]
            answer: "5"
          - id: l1-c3
            type: true_false
            text: "Ein Achteck hat 8 Seiten."
            say: "Stimmt das? Ein Achteck hat acht Seiten."
            answer: true

  - n: 2
    title: { de: "Vierecke und das Parallelogramm", en: "Quadrilaterals and the parallelogram" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Ecken hat ein Sechseck?"
            say: "Wie viele Ecken hat ein Sechseck?"
            options: ["6", "8", "5"]
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Figur hat 5 Ecken?"
            say: "Welche Figur hat fünf Ecken?"
            options: ["Fünfeck", "Sechseck", "Achteck"]
            answer: "Fünfeck"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Viereck: 4 Ecken, 4 Seiten"
            say: "Alle Figuren mit vier Ecken sind Vierecke. Das Rechteck kennst du: Gegenüberliegende Seiten sind gleich lang, und alle vier Ecken sind rechte Winkel."
            show: { drawn: shape, kind: rectangle, colour: blue }
          - text: "das Parallelogramm: ein schiefes Viereck"
            say: "Schiebst du ein Rechteck oben zur Seite, wird es schief. Das ist ein Parallelogramm. Die gegenüberliegenden Seiten sind immer noch gleich lang und parallel. Parallel heißt: Sie laufen nebeneinander her und treffen sich nie. Die Ecken müssen aber keine rechten Winkel sein."
            show: { drawn: shape, kind: parallelogram, colour: blue }
          - text: "Quadrat, Rechteck, Parallelogramm: alles Vierecke"
            say: "Beim Quadrat sind alle vier Seiten gleich lang und alle Ecken rechte Winkel. Beim Rechteck sind alle Ecken rechte Winkel. Beim Parallelogramm sind die gegenüberliegenden Seiten parallel. Alle drei haben vier Ecken. Alle drei sind Vierecke."
            show: { drawn: shape, row: [square, rectangle, parallelogram], colours: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Ecken hat ein Parallelogramm?"
                say: "Wie viele Ecken hat ein Parallelogramm?"
                options: ["4", "6", "3"]
                answer: "4"
                hints:
                  - "Denk an das Rechteck, das zur Seite geschoben wird."
                  - "Es ist ein Viereck."
                  - "4."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Welche Figur ist ein Viereck?"
                say: "Welche Figur ist ein Viereck?"
                options:
                  - { drawn: shape, kind: parallelogram, colour: green }
                  - { drawn: shape, kind: pentagon, colour: green }
                  - { drawn: shape, kind: triangle, colour: green }
                answer: parallelogram
                option_audio: false
                feedback:
                  "pentagon": "Das ist ein Fünfeck mit 5 Ecken. Ein Viereck hat 4 Ecken."
                hints:
                  - "Ein Viereck hat 4 Ecken."
                  - "Auch eine schiefe Figur mit 4 Ecken ist ein Viereck."
                  - "Es ist das Parallelogramm, die schiefe Figur."
              - id: l2-f3
                type: multiple_choice
                text: "Ein Viereck hat 4 gleich lange Seiten und 4 rechte Winkel. Wie heißt es genau?"
                say: "Ein Viereck hat vier gleich lange Seiten und vier rechte Winkel. Wie heißt es genau?"
                options: ["Quadrat", "Parallelogramm", "Sechseck"]
                answer: "Quadrat"
                feedback:
                  "Parallelogramm": "Ein Parallelogramm ist meistens schief. Hat ein Viereck 4 gleich lange Seiten und 4 rechte Winkel, sagst du genauer: Quadrat."
                hints:
                  - "Alle Seiten sind gleich lang."
                  - "Die Ecken sind rechte Winkel, es ist also nicht schief."
                  - "Quadrat."
              - id: l2-f4
                type: true_false
                text: "Beim Parallelogramm sind die gegenüberliegenden Seiten parallel."
                say: "Stimmt das? Beim Parallelogramm sind die gegenüberliegenden Seiten parallel."
                answer: true
                hints:
                  - "Der Name sagt es dir schon."
                  - "Die Seiten oben und unten laufen nebeneinander her."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Was heißt parallel?"
                say: "Was heißt parallel?"
                options: ["Die Linien laufen nebeneinander und treffen sich nie.", "Die Linien treffen sich in einer Ecke.", "Die Linien sind krumm."]
                answer: "Die Linien laufen nebeneinander und treffen sich nie."
                hints:
                  - "Denk an die zwei Schienen von einem Zug."
                  - "Die Schienen haben immer den gleichen Abstand."
                  - "Die Linien laufen nebeneinander und treffen sich nie."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jede Form mit ihrem Namen."
                pairs:
                  - { left: { drawn: shape, kind: square, colour: green }, right: { text: "Quadrat" } }
                  - { left: { drawn: shape, kind: rectangle, colour: green }, right: { text: "Rechteck" } }
                  - { left: { drawn: shape, kind: hexagon, colour: green }, right: { text: "Sechseck" } }
                  - { left: { drawn: shape, kind: triangle, colour: green }, right: { text: "Dreieck" } }
                  - { left: { drawn: shape, kind: parallelogram, colour: green }, right: { text: "Parallelogramm" } }
                option_audio: false
                hints: ["Zähl die Ecken. Beim Quadrat sind alle Seiten gleich lang."]
              - id: l2-s2
                type: true_false
                text: "Jedes Quadrat ist auch ein Viereck."
                say: "Stimmt das? Jedes Quadrat ist auch ein Viereck."
                answer: true
                hints: ["Wie viele Ecken hat ein Quadrat?"]
              - id: l2-s3
                type: multiple_choice
                text: "Ein Viereck ist schief. Die gegenüberliegenden Seiten sind parallel und gleich lang. Wie heißt es?"
                say: "Ein Viereck ist schief. Die gegenüberliegenden Seiten sind parallel und gleich lang. Wie heißt es?"
                show: { drawn: shape, kind: parallelogram, colour: orange }
                options: ["Parallelogramm", "Quadrat", "Achteck"]
                answer: "Parallelogramm"
                hints: ["Das Viereck ist schief."]
              - id: l2-s4
                type: multiple_choice
                text: "Wie viele rechte Winkel hat ein Rechteck?"
                say: "Wie viele rechte Winkel hat ein Rechteck?"
                show: { drawn: shape, kind: rectangle, colour: yellow }
                options: ["4", "2", "0"]
                answer: "4"
                hints: ["Schau in jede Ecke."]
              - id: l2-s5
                type: sorting
                text: "Viereck oder kein Viereck?"
                say: "Sortiere die Namen: Viereck oder kein Viereck?"
                bins:
                  - { id: viereck, show: { text: "Viereck" }, say: "Viereck" }
                  - { id: kein, show: { text: "kein Viereck" }, say: "kein Viereck" }
                options:
                  - { text: "Quadrat", bin: viereck }
                  - { text: "Parallelogramm", bin: viereck }
                  - { text: "Rechteck", bin: viereck }
                  - { text: "Sechseck", bin: kein }
                  - { text: "Dreieck", bin: kein }
                  - { text: "Achteck", bin: kein }
                hints: ["Ein Viereck hat 4 Ecken, auch wenn es schief ist."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Figur hat 6 Ecken?"
                say: "Welche Figur hat sechs Ecken?"
                options: ["Sechseck", "Parallelogramm", "Fünfeck"]
                answer: "Sechseck"
              - id: l2-n2
                type: true_false
                text: "Ein Parallelogramm hat 5 Seiten."
                say: "Stimmt das? Ein Parallelogramm hat fünf Seiten."
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Bei welchem Viereck sind immer alle Seiten gleich lang?"
                say: "Bei welchem Viereck sind immer alle Seiten gleich lang?"
                options: ["beim Quadrat", "beim Rechteck", "bei jedem Viereck"]
                answer: "beim Quadrat"
              - id: l2-n4
                type: multiple_choice
                text: "Wie heißt die Stelle, an der zwei Seiten zusammentreffen?"
                say: "Wie heißt die Stelle, an der zwei Seiten einer Figur zusammentreffen?"
                options: ["Ecke", "Seite", "Mitte"]
                answer: "Ecke"
              - id: l2-n5
                type: text_input
                text: "Wie viele Ecken haben ein Parallelogramm und ein Sechseck zusammen?"
                say: "Wie viele Ecken haben ein Parallelogramm und ein Sechseck zusammen?"
                answer: "10"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie viele Seiten hat diese Figur?"
            say: "Wie viele Seiten hat diese Figur?"
            show: { drawn: shape, kind: hexagon, colour: orange }
            options: ["6", "5", "8"]
            answer: "6"
          - id: l2-c2
            type: multiple_choice
            text: "Ein Verkehrsschild sieht fast rund aus. Es hat 8 gerade Seiten. Welche Form hat es?"
            say: "Ein Verkehrsschild sieht fast rund aus. Es hat acht gerade Seiten. Welche Form hat es?"
            options: ["Achteck", "Kreis", "Fünfeck"]
            answer: "Achteck"
          - id: l2-c3
            type: multiple_choice
            text: "Ein schiefes Viereck mit parallelen gegenüberliegenden Seiten heißt _."
            say: "Wie heißt ein schiefes Viereck, bei dem die gegenüberliegenden Seiten parallel sind?"
            options: ["Parallelogramm", "Rechteck", "Sechseck"]
            answer: "Parallelogramm"
          - id: l2-c4
            type: true_false
            text: "Ein Fünfeck hat 5 Seiten."
            say: "Stimmt das? Ein Fünfeck hat fünf Seiten."
            answer: true
          - id: l2-c5
            type: image_multiple_choice
            text: "Wo sind alle 4 Seiten gleich lang?"
            say: "Bei welchem Viereck sind alle vier Seiten gleich lang?"
            options:
              - { drawn: shape, kind: square, colour: purple }
              - { drawn: shape, kind: rectangle, colour: purple }
              - { drawn: shape, kind: parallelogram, colour: purple }
            answer: square
            option_audio: false
