# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.mult-meaning
skill: math.mult-div.mult-meaning
curriculum: de-DE
language: de
title:
  de: Was bedeutet mal?
  en: What does times mean?
summary: >
  Equal groups and the Malaufgabe: 4 + 4 + 4 is three times four, 3 · 4.
  Lesson 1 sees equal groups and writes the repeated plus sum; lesson 2
  writes it as a Malaufgabe with the Malpunkt, reads 3 · 4 as drei mal
  vier, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Malaufgaben, en: Multiplication }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.sequences, math.add-sub-to-20.fluency-to-20]
  also_practises: [math.numbers-to-100.sequences]
  vocabulary: { de: [gleich große Gruppen, Reihe, je, mal, Malaufgabe, Malpunkt] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: unequal-groups
      what: Writes a Malaufgabe for groups that are not equal (3 + 4 + 4 as 3 · 4)
      addressed: lesson 1 asks whether groups are equal in every stage; true/false tasks with one group different
    - id: mal-as-plus
      what: Reads 3 · 4 as 3 + 4
      addressed: lesson 2 Learn sets 3 · 5 = 15 beside 3 + 5 = 8; l2-f3 offers 7 for 2 · 5 with feedback, and the Malaufgabe tasks in every stage offer the plus sum
    - id: factors-mixed-up
      what: Cannot say which number counts the groups
      addressed: Learn says the first number is how many groups, the second how many in each; tasks ask for the number of groups and the number in each
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Gleich große Gruppen, en: Equal groups }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "5 + 5 + 5 = _"
            say: "Fünf plus fünf plus fünf."
            answer: "15"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Zähl in Zweierschritten."
            say: "Zähl in Zweierschritten weiter."
            frame: "2, 4, 6, _ , _"
            options: ["7", "8", "10", "9"]
            answer: ["8", "10"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 Reihen mit je 4"
            say: "Hier sind drei Reihen. In jeder Reihe sind vier Punkte. Alle Reihen sind gleich groß."
            show: { drawn: dots, array: [3, 4] }
          - text: "4 + 4 + 4 = 12"
            say: "Wir können sie zusammenzählen: vier plus vier plus vier ist zwölf."
            show: { drawn: dots, array: [3, 4] }
          - text: "3, 4, 4: nicht gleich groß"
            say: "Aufpassen: Drei, vier und vier sind nicht gleich viele. Diese Gruppen sind nicht gleich groß. Bei gleich großen Gruppen ist in jeder Gruppe gleich viel."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Plusaufgabe passt?"
                say: "Zwei Reihen mit je fünf Punkten. Welche Plusaufgabe passt?"
                show: { drawn: dots, array: [2, 5] }
                options: ["5 + 5", "2 + 5", "5 + 5 + 5"]
                answer: "5 + 5"
                feedback:
                  "2 + 5": "Es sind zwei Reihen. Jede Reihe hat fünf. Also fünf plus fünf."
                hints:
                  - "Wie viele Reihen sind es?"
                  - "Zwei Reihen mit je fünf."
                  - "5 + 5."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Sind die Gruppen gleich groß?"
                say: "Auf drei Tellern liegen vier, vier und drei Kekse. Sind die Gruppen gleich groß?"
                answer: false
                hints:
                  - "Vergleiche die Zahlen."
                  - "Ein Teller hat nur drei."
                  - "Nein."
              - id: l1-f3
                type: fill_in_blank
                text: "Wie viele Reihen, wie viele in jeder?"
                say: "Wie viele Reihen sind es, und wie viele Punkte sind in jeder Reihe?"
                show: { drawn: dots, array: [4, 3] }
                frame: "_ Reihen mit je _ Punkten"
                options: ["3", "4", "12", "7"]
                answer: ["4", "3"]
                hints:
                  - "Zähl die Reihen von oben nach unten."
                  - "Vier Reihen. Zähl die Punkte in einer Reihe."
                  - "4 Reihen mit je 3 Punkten."
              - id: l1-f4
                type: text_input
                text: "2 + 2 + 2 + 2 = _"
                say: "Vier Kinder haben je zwei Äpfel. Wie viele Äpfel sind das? Zwei plus zwei plus zwei plus zwei."
                answer: "8"
                hints:
                  - "Zähl in Zweierschritten."
                  - "Zwei, vier, sechs, acht."
                  - "8."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Plusaufgabe passt?"
                say: "Drei Reihen mit je zwei Punkten. Welche Plusaufgabe passt?"
                show: { drawn: dots, array: [3, 2] }
                options: ["2 + 2 + 2", "3 + 3 + 3", "3 + 2"]
                answer: "2 + 2 + 2"
                hints:
                  - "Wie viele Punkte hat jede Reihe?"
                  - "Zwei, und das dreimal."
                  - "2 + 2 + 2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Plusaufgabe passt?"
                say: "Schau dir die Punkte an. Welche Plusaufgabe passt?"
                show: { drawn: dots, array: [4, 5] }
                options: ["5 + 5 + 5 + 5", "4 + 4 + 4 + 4", "4 + 5"]
                answer: "5 + 5 + 5 + 5"
                hints: ["Wie viele Punkte hat eine Reihe, und wie viele Reihen gibt es?"]
              - id: l1-s2
                type: true_false
                text: "Sind die Gruppen gleich groß?"
                say: "In drei Vasen stehen je fünf Blumen. Sind die Gruppen gleich groß?"
                answer: true
                hints: ["Stehen in jeder Vase gleich viele?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Wie viele Reihen, wie viele in jeder?"
                say: "Wie viele Reihen sind es, und wie viele Punkte sind in jeder Reihe?"
                show: { drawn: dots, array: [2, 6] }
                frame: "_ Reihen mit je _ Punkten"
                options: ["2", "6", "12", "8"]
                answer: ["2", "6"]
                hints: ["Erst die Reihen zählen."]
              - id: l1-s4
                type: text_input
                text: "10 + 10 + 10 = _"
                say: "Drei Kinder haben je zehn Murmeln. Zehn plus zehn plus zehn."
                answer: "30"
                hints: ["Zähl in Zehnerschritten."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Plusaufgabe passt?"
                say: "Schau dir die Punkte an. Welche Plusaufgabe passt?"
                show: { drawn: dots, array: [5, 2] }
                options: ["2 + 2 + 2 + 2 + 2", "2 + 2 + 2 + 2", "5 + 2"]
                answer: "2 + 2 + 2 + 2 + 2"
                hints: ["Jede Reihe hat zwei."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Plusaufgabe passt?"
                say: "Schau dir die Punkte an. Welche Plusaufgabe passt?"
                show: { drawn: dots, array: [3, 3] }
                options: ["3 + 3 + 3", "3 + 3", "3 + 9"]
                answer: "3 + 3 + 3"
              - id: l1-n2
                type: true_false
                text: "Sind die Gruppen gleich groß?"
                say: "Vier Kinder haben zwei, zwei, zwei und vier Sticker. Sind die Gruppen gleich groß?"
                answer: false
              - id: l1-n3
                type: fill_in_blank
                text: "Wie viele Reihen, wie viele in jeder?"
                say: "Wie viele Reihen sind es, und wie viele Punkte sind in jeder Reihe?"
                show: { drawn: dots, array: [5, 4] }
                frame: "_ Reihen mit je _ Punkten"
                options: ["5", "4", "20", "9"]
                answer: ["5", "4"]
              - id: l1-n4
                type: text_input
                text: "5 + 5 + 5 + 5 = _"
                say: "Vier Hände mit je fünf Fingern. Fünf plus fünf plus fünf plus fünf."
                answer: "20"
              - id: l1-n5
                type: multiple_choice
                text: "Welche Plusaufgabe passt?"
                say: "Schau dir die Punkte an. Welche Plusaufgabe passt?"
                show: { drawn: dots, array: [2, 3] }
                options: ["3 + 3", "2 + 2", "2 + 3"]
                answer: "3 + 3"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Plusaufgabe passt?"
            say: "Schau dir die Punkte an. Welche Plusaufgabe passt?"
            show: { drawn: dots, array: [4, 2] }
            options: ["2 + 2 + 2 + 2", "4 + 4 + 4 + 4", "4 + 2"]
            answer: "2 + 2 + 2 + 2"
          - id: l1-c2
            type: true_false
            text: "Sind die Gruppen gleich groß?"
            say: "Auf zwei Tellern liegen je sechs Erdbeeren. Sind die Gruppen gleich groß?"
            answer: true
          - id: l1-c3
            type: text_input
            text: "3 + 3 + 3 + 3 = _"
            say: "Drei plus drei plus drei plus drei."
            answer: "12"

  - n: 2
    title: { de: Die Malaufgabe, en: The times sum }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "4 + 4 + 4 = _"
            say: "Vier plus vier plus vier."
            answer: "12"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Sind die Gruppen gleich groß?"
            say: "Drei Kinder haben je fünf Stifte. Sind die Gruppen gleich groß?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5 + 5 + 5 = 3 · 5"
            say: "Fünf plus fünf plus fünf ist dreimal die Fünf. Das schreibt man kürzer als Malaufgabe: drei mal fünf. Der Punkt heißt Malpunkt."
            show: { drawn: dots, array: [3, 5] }
          - text: "3 · 5: 3 Gruppen, je 5"
            say: "Die erste Zahl sagt, wie viele Gruppen es sind: drei. Die zweite Zahl sagt, wie viele in jeder Gruppe sind: fünf. Drei mal fünf ist fünfzehn."
          - text: "3 · 5 = 15, aber 3 + 5 = 8"
            say: "Mal ist nicht plus. Drei plus fünf ist acht. Drei mal fünf sind drei Fünfer, das ist fünfzehn."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Malaufgabe passt?"
                say: "Zwei plus zwei plus zwei plus zwei. Welche Malaufgabe passt?"
                options: ["4 · 2", "2 · 2", "4 + 2"]
                answer: "4 · 2"
                hints:
                  - "Wie oft steht die Zwei da?"
                  - "Viermal die Zwei."
                  - "4 · 2."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Schreib die Malaufgabe."
                say: "Vier Reihen mit je drei Punkten. Schreib die Malaufgabe."
                show: { drawn: dots, array: [4, 3] }
                frame: "_ · _ = _"
                options: ["4", "3", "12", "7"]
                answer: ["4", "3", "12"]
                hints:
                  - "Erst die Zahl der Reihen, dann wie viele in jeder."
                  - "Vier mal drei."
                  - "4 · 3 = 12."
              - id: l2-f3
                type: multiple_choice
                text: "2 · 5 = ?"
                say: "Zwei mal fünf."
                show: { drawn: dots, array: [2, 5] }
                options: ["10", "7", "25"]
                answer: "10"
                feedback:
                  "7": "Das ist zwei plus fünf. Zwei mal fünf sind zwei Fünfer: fünf plus fünf."
                hints:
                  - "Zwei mal fünf sind zwei Fünfer."
                  - "Fünf plus fünf."
                  - "10."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 3 + 3 + 3 + 3 + 3 = 5 · 3"
                say: "Drei plus drei plus drei plus drei plus drei ist fünf mal drei. Stimmt das?"
                answer: true
                hints:
                  - "Wie oft steht die Drei da?"
                  - "Fünfmal."
                  - "Ja."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Plusaufgabe gehört zu 2 · 4?"
                say: "Welche Plusaufgabe gehört zu zwei mal vier?"
                options: ["4 + 4", "2 + 4", "2 + 2"]
                answer: "4 + 4"
                feedback:
                  "2 + 2": "Das ist zweimal die Zwei. Zwei mal vier sind zwei Vierer."
                hints:
                  - "Die erste Zahl sagt, wie viele Gruppen. Die zweite sagt, wie viele in jeder."
                  - "Zwei Gruppen mit je vier."
                  - "4 + 4."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Malaufgabe passt?"
                say: "Zehn plus zehn plus zehn. Welche Malaufgabe passt?"
                options: ["3 · 10", "10 · 10", "3 + 10"]
                answer: "3 · 10"
                hints: ["Wie oft steht die Zehn da?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Schreib die Malaufgabe."
                say: "Schau dir die Punkte an. Schreib die Malaufgabe."
                show: { drawn: dots, array: [2, 6] }
                frame: "_ · _ = _"
                options: ["2", "6", "12", "8"]
                answer: ["2", "6", "12"]
                hints: ["Erst die Reihen."]
              - id: l2-s3
                type: multiple_choice
                text: "4 · 5 = ?"
                say: "Vier mal fünf."
                options: ["20", "9", "45"]
                answer: "20"
                hints: ["Vier Fünfer."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 4 + 4 + 4 = 4 · 4"
                say: "Vier plus vier plus vier ist vier mal vier. Stimmt das?"
                answer: false
                hints: ["Wie viele Gruppen sind es, und wie viele in jeder?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Plusaufgabe gehört zu 2 · 6?"
                say: "Welche Plusaufgabe gehört zu zwei mal sechs?"
                options: ["6 + 6", "2 + 6", "6 + 6 + 6"]
                answer: "6 + 6"
                hints: ["Die erste Zahl sagt, wie viele Gruppen es sind."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Malaufgabe passt?"
                say: "Fünf plus fünf plus fünf plus fünf. Welche Malaufgabe passt?"
                options: ["4 · 5", "5 · 5", "4 + 5"]
                answer: "4 · 5"
              - id: l2-n2
                type: fill_in_blank
                text: "Schreib die Malaufgabe."
                say: "Schau dir die Punkte an. Schreib die Malaufgabe."
                show: { drawn: dots, array: [5, 2] }
                frame: "_ · _ = _"
                options: ["5", "2", "10", "7"]
                answer: ["5", "2", "10"]
              - id: l2-n3
                type: multiple_choice
                text: "3 · 2 = ?"
                say: "Drei mal zwei."
                options: ["6", "5", "32"]
                answer: "6"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 10 + 10 = 2 · 10"
                say: "Zehn plus zehn ist zwei mal zehn. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welche Plusaufgabe gehört zu 5 · 3?"
                say: "Welche Plusaufgabe gehört zu fünf mal drei?"
                options: ["3 + 3 + 3 + 3 + 3", "5 + 3", "5 + 5 + 5 + 5 + 5"]
                answer: "3 + 3 + 3 + 3 + 3"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Schreib die Malaufgabe."
            say: "Schau dir die Punkte an. Schreib die Malaufgabe."
            show: { drawn: dots, array: [3, 6] }
            frame: "_ · _ = _"
            options: ["3", "6", "18", "9"]
            answer: ["3", "6", "18"]
          - id: l2-c2
            type: multiple_choice
            text: "Welche Malaufgabe passt?"
            say: "Vier plus vier plus vier plus vier plus vier. Welche Malaufgabe passt?"
            options: ["5 · 4", "4 · 4", "5 + 4"]
            answer: "5 · 4"
          - id: l2-c3
            type: multiple_choice
            text: "2 · 10 = ?"
            say: "Zwei mal zehn."
            options: ["20", "12", "210"]
            answer: "20"
          - id: l2-c4
            type: true_false
            text: "Sind die Gruppen gleich groß?"
            say: "In vier Körben liegen fünf, fünf, fünf und sechs Eier. Sind die Gruppen gleich groß?"
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Welche Plusaufgabe gehört zu 4 · 6?"
            say: "Welche Plusaufgabe gehört zu vier mal sechs?"
            options: ["6 + 6 + 6 + 6", "4 + 6", "6 + 6 + 6"]
            answer: "6 + 6 + 6 + 6"
