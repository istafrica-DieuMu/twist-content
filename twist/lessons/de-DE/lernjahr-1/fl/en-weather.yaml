# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-weather
skill: fl.themes.weather
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Das Wetter auf Englisch
  en: The weather in English
summary: >
  Describing the weather and understanding a short weather report.
  Lesson 1 brings "It's sunny / cloudy / windy." and "It's raining." and
  "It's snowing.";
  lesson 2 adds hot and cold, asks "What's the weather like?", picks out
  the weather in a short report for two days, and ends with the skill
  check. Instructions are in German; the English is spoken and shown in
  short form.
metadata:
  year: lernjahr-1
  topic: { de: Wetter, en: Weather }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.outside-animals]
  also_practises: []
  vocabulary: { en: [sunny, cloudy, windy, "It's raining.", "It's snowing.", hot, cold, "It's …", "What's the weather like?", today, tomorrow] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: hear, what: { de: Wetterwörter beim Hören verstehen, en: understanding weather words when heard } }
    - { id: describe, what: { de: das Wetter auf Englisch beschreiben, en: describing the weather in English } }
    - { id: report, what: { de: einen kurzen Wetterbericht für heute und morgen verstehen, en: understanding a short weather report for today and tomorrow } }
  misconceptions:
    - id: noun-for-adjective
      what: Says "It's sun." or "It's rain." instead of "It's sunny." and "It's raining."
      addressed: lesson 1 Learn sets sun against sunny and rain against raining; a "Wie sagst du" or "Welcher Satz" task in every stage of lesson 1 offers the noun form (l1-f3, l1-s3, l1-n3), with feedback in l1-f3
    - id: cloudy-rainy
      what: Mixes up "It's cloudy." and "It's raining.", both shown with a grey cloud
      addressed: when "It's raining." is heard, the cloud and the rain pictures share an option set in every stage of lesson 1 (l1-f2, l1-s2, l1-n2), with feedback in l1-f2; "It's cloudy." is never set against the rain or snow picture, which also show a cloud
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "It's sunny.", en: "It's sunny." }
    goal:
      de: "Sag auf Englisch, wie das Wetter ist, zum Beispiel It's sunny oder It's raining."
      en: "Say what the weather is like in English, like It's sunny or It's raining."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "A cloud." }
            options: [{ object: cloud }, { object: tree }, { object: star }]
            answer: cloud
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "The sun." }
            options: [{ object: sun }, { object: moon }, { object: star }]
            answer: sun
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "sun → ?"
            say: { de: "Heute geht es ums Wetter. Die Sonne heißt auf Englisch „sun“. Was glaubst du: Wie sagst du, dass die Sonne scheint?", en: "Sun." }
            show: { object: sun }
          - text: "the sun → It's sunny."
            say: { de: "So sagst du, wie das Wetter ist. Aus „sun“ wird „sunny“. Hör zu und sprich nach.", en: "It's sunny." }
            show: { object: sun }
          - say: { de: "Wenn es regnet, sagst du „It's raining.“", en: "It's raining." }
            show: { object: rain }
          - say: { en: "It's cloudy." }
            show: { object: cloud }
          - say: { de: "Wenn es schneit, sagst du „It's snowing.“", en: "It's snowing." }
            show: { object: snow }
          - say: { en: "It's windy." }
            show: { object: wind }
          - text: "Wusstest du? Ein Blitz ist heißer als die Oberfläche der Sonne."
            say: { de: "Wusstest du? Ein Blitz ist für einen ganz kurzen Moment heißer als die Oberfläche der Sonne. Die Luft um ihn herum wird so schnell heiß, dass es knallt. Das ist der Donner!" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Wetter." }
                audio: { en: "It's snowing." }
                options: [{ object: snow }, { object: rain }, { object: sun }]
                answer: snow
                feedback:
                  sun: "Die Sonne schneit doch nicht! Hör noch einmal: snowing."
                hints:
                  - "Hör noch einmal: snowing."
                  - "„Snow“ ist Schnee."
                  - "Tippe auf den Schnee."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Wetter." }
                audio: { en: "It's raining." }
                options: [{ object: cloud }, { object: rain }, { object: wind }]
                answer: rain
                feedback:
                  cloud: "Das sind nur Wolken, „cloudy“. Bei „raining“ fallen Tropfen."
                hints:
                  - "Hör noch einmal: raining."
                  - "„Rain“ ist Regen."
                  - "Tippe auf die Wolke mit den Tropfen."
              - id: l1-f3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Es ist sonnig“?"
                say: "Wie sagst du auf Englisch: Es ist sonnig?"
                options: ["It's sunny.", "It's sun.", "It sunny."]
                answer: "It's sunny."
                option_audio: false
                feedback:
                  "It's sun.": "„Sun“ ist die Sonne. Für das Wetter sagst du „sunny“: It's sunny."
                hints:
                  - "Für das Wetter hängst du etwas an das Wort an."
                  - "Aus „sun“ wird „sunny“."
                  - "It's sunny."
              - id: l1-f4
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "It's windy." }
                show: { object: wind }
                expected_text: "It's windy."
                hints:
                  - "Hör noch einmal zu: It's windy."
                  - "Zuerst „It's“, dann „windy“."
                  - "Sag mit mir: It's windy."
              - id: l1-f5
                type: true_false
                text: "Passt der Satz zum Bild?"
                say: { de: "Hör zu. Passt der Satz zum Bild?" }
                audio: { en: "It's cloudy." }
                show: { object: cloud }
                answer: true
                hints:
                  - "Hör noch einmal: cloudy."
                  - "„Cloud“ ist die Wolke."
                  - "Ja, das passt."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Wetter." }
                audio: { en: "It's windy." }
                options: [{ object: snow }, { object: wind }, { object: cloud }]
                answer: wind
                hints: ["„Wind“ ist der Wind, „windy“ heißt windig."]
              - id: l1-s2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Wetter." }
                audio: { en: "It's raining." }
                options: [{ object: cloud }, { object: sun }, { object: rain }]
                answer: rain
                hints: ["Hör noch einmal genau hin. Welches deutsche Wort klingt ähnlich?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Schau dir das Bild an. Welcher Satz passt?"
                show: { object: rain }
                options: ["It's rain.", "It's raining.", "It raining."]
                answer: "It's raining."
                option_audio: false
                hints: ["Wenn es regnet, hängst du „ing“ an „rain“ an."]
              - id: l1-s4
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "It's snowing." }
                show: { object: snow }
                expected_text: "It's snowing."
                hints: ["Zuerst „It's“."]
              - id: l1-s5
                type: true_false
                text: "Passt der Satz zum Bild?"
                say: { de: "Hör zu. Passt der Satz zum Bild?" }
                audio: { en: "It's sunny." }
                show: { object: rain }
                answer: false
                hints: ["Was siehst du auf dem Bild?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Wetter." }
                audio: { en: "It's sunny." }
                options: [{ object: cloud }, { object: wind }, { object: sun }]
                answer: sun
              - id: l1-n2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Wetter." }
                audio: { en: "It's raining." }
                options: [{ object: rain }, { object: snow }, { object: cloud }]
                answer: rain
              - id: l1-n3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Es ist windig“?"
                say: "Wie sagst du auf Englisch: Es ist windig?"
                options: ["It windy.", "It's wind.", "It's windy."]
                answer: "It's windy."
                option_audio: false
              - id: l1-n4
                type: speak
                text: "Wie ist das Wetter? Sag es auf Englisch."
                say: { de: "Wie ist das Wetter? Sag es auf Englisch." }
                show: { object: cloud }
                expected_text: "It's cloudy."
              - id: l1-n5
                type: true_false
                text: "Passt der Satz zum Bild?"
                say: { de: "Hör zu. Passt der Satz zum Bild?" }
                audio: { en: "It's snowing." }
                show: { object: snow }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Welches Wetter ist es?"
            say: { de: "Hör zu. Welches Wetter ist es?" }
            audio: { en: "It's windy." }
            options: [{ object: wind }, { object: rain }, { object: sun }]
            answer: wind
          - id: l1-c2
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Es ist bewölkt“?"
            say: "Wie sagst du auf Englisch: Es ist bewölkt?"
            options: ["It's cloud.", "It's cloudy.", "It cloudy."]
            answer: "It's cloudy."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Passt der Satz zum Bild?"
            say: { de: "Hör zu. Passt der Satz zum Bild?" }
            audio: { en: "It's raining." }
            show: { object: sun }
            answer: false
          - id: l1-c4
            type: audio_choice
            text: "Welches Wetter ist es?"
            say: { de: "Hör zu. Welches Wetter ist es?" }
            audio: { en: "It's snowing." }
            options: ["Es regnet.", "Es schneit.", "Es ist windig."]
            answer: "Es schneit."
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Bild an. Welcher Satz passt?"
            show: { object: sun }
            options: ["It's sun.", "It's windy.", "It's sunny."]
            answer: "It's sunny."
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Passt der Satz zum Bild?"
            say: { de: "Hör zu. Passt der Satz zum Bild?" }
            audio: { en: "It's cloudy." }
            show: { object: wind }
            answer: false

  - n: 2
    title: { de: "What's the weather like?", en: "What's the weather like?" }
    goal:
      de: "Frag What's the weather like, sag, ob es hot oder cold ist, und hör einen kleinen Wetterbericht."
      en: "Ask What's the weather like, say if it is hot or cold, and listen to a little weather report."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das passende Wetter." }
            audio: { en: "It's snowing." }
            options: [{ object: cloud }, { object: snow }, { object: wind }]
            answer: snow
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Bild an. Welcher Satz passt?"
            show: { object: snow }
            options: ["It snowing.", "It's snowing.", "It's snow."]
            answer: "It's snowing."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Wetter = weather"
            say: { de: "Wetter heißt auf Englisch „weather“. Was glaubst du: Wie fragst du ein Kind in England, wie das Wetter ist?", en: "Weather." }
          - text: "What's the weather like? It's sunny and hot."
            say: { de: "So fragst du nach dem Wetter:", en: "What's the weather like? It's sunny and hot." }
            show: { object: sun }
          - text: "It's snowing and it's cold."
            say: { de: "Heiß heißt „hot“, kalt heißt „cold“.", en: "It's snowing and it's cold." }
            show: { object: snowman }
          - text: "Today it's raining. Tomorrow it will be sunny."
            say: { de: "Im Wetterbericht hörst du heute, „today“, und morgen, „tomorrow“. Für morgen sagt man „it will be“: Es wird sonnig.", en: "Today it's raining. Tomorrow it will be sunny." }
            show: { objects: [rain, sun] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Wie ist das Wetter?"
                say: { de: "Hör zu. Wie ist das Wetter?" }
                audio: { en: "What's the weather like? It's windy." }
                options: [{ object: wind }, { object: snow }, { object: sun }]
                answer: wind
                hints:
                  - "Hör auf das letzte Wort."
                  - "„Windy“ ist windig."
                  - "Tippe auf den Wind."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Hör dir den Wetterbericht an. Wie wird das Wetter morgen?"
                say: { de: "Hör dir den Wetterbericht an. Wie wird das Wetter morgen?" }
                audio: { en: "Today it's cloudy. Tomorrow it will snow." }
                options: [{ object: cloud }, { object: snow }, { object: rain }]
                answer: snow
                feedback:
                  cloud: "Wolken gibt es heute, „today“. Morgen, „tomorrow“, schneit es."
                hints:
                  - "Hör auf das Wort „tomorrow“."
                  - "Was kommt nach „tomorrow“?"
                  - "Tippe auf den Schnee."
              - id: l2-f3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Es ist kalt“?"
                say: "Wie sagst du auf Englisch: Es ist kalt?"
                options: ["It's cold.", "It's hot.", "It's cloudy."]
                answer: "It's cold."
                option_audio: false
                hints:
                  - "„Hot“ heißt heiß."
                  - "Kalt klingt fast wie das englische Wort."
                  - "It's cold."
              - id: l2-f4
                type: ordering
                text: "Bau die Frage: Wie ist das Wetter?"
                say: "Bau die Frage auf Englisch: Wie ist das Wetter?"
                options: ["like?", "What's", "weather", "the"]
                slot_count: 4
                answer: ["What's", "the", "weather", "like?"]
                option_audio: false
                hints:
                  - "Die Frage fängt mit „What's“ an."
                  - "Am Ende steht „like?“."
                  - "What's the weather like?"
              - id: l2-f5
                type: speak
                text: "Draußen scheint die Sonne und es ist heiß. Sag es auf Englisch."
                say: { de: "Draußen scheint die Sonne und es ist heiß. Sag es auf Englisch.", en: "It's sunny and hot." }
                show: { object: sun }
                expected_text: "It's sunny and hot."
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "„sunny“ und „hot“ mit „and“ dazwischen."
                  - "Sag mit mir: It's sunny and hot."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Wie ist das Wetter?"
                say: { de: "Hör zu. Wie ist das Wetter?" }
                audio: { en: "What's the weather like? It's raining." }
                options: [{ object: sun }, { object: rain }, { object: wind }]
                answer: rain
                hints: ["Hör auf das letzte Wort."]
              - id: l2-s2
                type: audio_choice
                text: "Hör dir den Wetterbericht an. Wie ist das Wetter heute?"
                say: { de: "Hör dir den Wetterbericht an. Wie ist das Wetter heute?" }
                audio: { en: "Today it's windy. Tomorrow it will be cloudy." }
                options: [{ object: cloud }, { object: sun }, { object: wind }]
                answer: wind
                hints: ["Hör auf das Wort „today“."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Es ist heiß“?"
                say: "Wie sagst du auf Englisch: Es ist heiß?"
                options: ["It's cold.", "It's hot.", "It's sunny."]
                answer: "It's hot."
                option_audio: false
                hints: ["Gefragt ist, wie warm es ist, nicht wie der Himmel aussieht."]
              - id: l2-s4
                type: ordering
                text: "Bau den Satz: Es ist kalt und es schneit."
                say: "Bau den Satz auf Englisch: Es ist kalt und es schneit."
                options: ["snowing.", "It's", "and", "cold", "it's"]
                slot_count: 5
                answer: ["It's", "cold", "and", "it's", "snowing."]
                option_audio: false
                hints: ["Der Satz fängt mit „It's“ an."]
              - id: l2-s5
                type: speak
                text: "Es schneit und es ist kalt. Sag es auf Englisch."
                say: { de: "Es schneit und es ist kalt. Sag es auf Englisch.", en: "It's snowing and it's cold." }
                show: { object: snow }
                expected_text: "It's snowing and it's cold."
                hints: ["Verbinde die zwei Sätze mit „and“."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Wie ist das Wetter?"
                say: { de: "Hör zu. Wie ist das Wetter?" }
                audio: { en: "What's the weather like? It's cloudy." }
                options: [{ object: cloud }, { object: sun }, { object: wind }]
                answer: cloud
              - id: l2-n2
                type: audio_choice
                text: "Hör dir den Wetterbericht an. Wie wird das Wetter morgen?"
                say: { de: "Hör dir den Wetterbericht an. Wie wird das Wetter morgen?" }
                audio: { en: "Today it's sunny. Tomorrow it will rain." }
                options: [{ object: sun }, { object: wind }, { object: rain }]
                answer: rain
              - id: l2-n3
                type: multiple_choice
                text: "Wie fragst du: Wie ist das Wetter?"
                say: "Wie fragst du auf Englisch: Wie ist das Wetter?"
                options: ["What's the weather like?", "How old is the weather?", "Where is the weather?"]
                answer: "What's the weather like?"
                option_audio: false
              - id: l2-n4
                type: ordering
                text: "Bau den Satz: Es ist windig und kalt."
                say: "Bau den Satz auf Englisch: Es ist windig und kalt."
                options: ["cold.", "and", "windy", "It's"]
                slot_count: 4
                answer: ["It's", "windy", "and", "cold."]
                option_audio: false
              - id: l2-n5
                type: speak
                text: "Wie ist das Wetter auf dem Bild? Sag es auf Englisch."
                say: { de: "Wie ist das Wetter auf dem Bild? Sag es auf Englisch." }
                show: { object: rain }
                expected_text: "It's raining."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: hear
            type: audio_choice
            text: "Welches Wetter passt?"
            say: { de: "Hör zu. Welches Wetter passt?" }
            audio: { en: "It's snowing and it's cold." }
            options: [{ object: sun }, { object: snow }, { object: rain }]
            answer: snow
          - id: l2-c2
            part: report
            type: audio_choice
            text: "Hör dir den Wetterbericht an. Wie ist das Wetter heute?"
            say: { de: "Hör dir den Wetterbericht an. Wie ist das Wetter heute?" }
            audio: { en: "Today it's raining. Tomorrow it will be windy." }
            options: [{ object: wind }, { object: rain }, { object: sun }]
            answer: rain
          - id: l2-c3
            part: describe
            type: multiple_choice
            text: "Wie ist das Wetter?"
            say: "Schau dir das Bild an. Welcher Satz passt?"
            show: { object: wind }
            options: ["It's wind.", "It's snowing.", "It's windy."]
            answer: "It's windy."
            option_audio: false
          - id: l2-c4
            part: report
            type: audio_choice
            text: "Hör dir den Wetterbericht an. Wie wird das Wetter morgen?"
            say: { de: "Hör dir den Wetterbericht an. Wie wird das Wetter morgen?" }
            audio: { en: "Today it's cold. Tomorrow it will be hot." }
            options: ["heiß", "kalt", "windig"]
            answer: "heiß"
            option_audio: false
          - id: l2-c5
            part: describe
            type: multiple_choice
            text: "„It's sunny.“ Was hast du gefragt?"
            say: { de: "Dein Freund antwortet dir. Was hast du ihn gefragt?", en: "It's sunny." }
            options: ["What's your name?", "What's the weather like?", "How old are you?"]
            answer: "What's the weather like?"
            option_audio: false
          - id: l2-c6
            part: hear
            type: true_false
            text: "Passt der Satz zum Bild?"
            say: { de: "Hör zu. Passt der Satz zum Bild?" }
            audio: { en: "It's cloudy and cold." }
            show: { object: cloud }
            answer: true
          - id: l2-c7
            part: hear
            type: audio_choice
            text: "Ist es heiß oder kalt?"
            say: { de: "Hör zu. Ist es heiß oder kalt?" }
            audio: { en: "It's hot today." }
            options: ["heiß", "kalt"]
            answer: "heiß"
            keep_order: true
          - id: l2-c8
            part: hear
            type: audio_choice
            text: "Wie ist das Wetter?"
            say: { de: "Hör zu. Wie ist das Wetter?" }
            audio: { turns: [{ en: "What's the weather like?", speaker: female }, { en: "It's sunny and cold.", speaker: male }] }
            options: ["sonnig und heiß", "sonnig und kalt", "bewölkt und kalt"]
            answer: "sonnig und kalt"
          - id: l2-c9
            part: describe
            type: matching
            option_audio: false
            text: "Welches Wort passt zu welchem Bild?"
            say: { de: "Lies die Wörter. Welches Wort passt zu welchem Bild? Verbinde sie." }
            pairs:
              - left: { text: "sunny" }
                right: { object: sun }
              - left: { text: "windy" }
                right: { object: wind }
              - left: { text: "snowing" }
                right: { object: snow }
          - id: l2-c10
            part: hear
            type: true_false
            text: "Passt der Satz zum Bild?"
            say: { de: "Hör zu. Passt der Satz zum Bild?" }
            audio: { en: "It's raining." }
            show: { object: cloud }
            answer: false
          - id: l2-c11
            part: describe
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Bild an. Welcher Satz passt?"
            show: { object: cloud }
            options: ["It's cloud.", "It's raining.", "It's cloudy."]
            answer: "It's cloudy."
            option_audio: false
          - id: l2-c12
            part: describe
            type: ordering
            text: "Bau den Satz: Heute ist es sonnig."
            say: "Bau den Satz auf Englisch: Heute ist es sonnig."
