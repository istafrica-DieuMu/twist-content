# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-where-spoken
skill: fl.culture-strategies.where-spoken
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Wo man Englisch spricht
  en: Where English is spoken
summary: >
  Where English comes from and where it is spoken today. Lesson 1 names
  the countries: England, Scotland, Wales and Northern Ireland, then
  Ireland, the USA, Canada, Australia and New Zealand, and the child hears
  children say where they are from. Lesson 2 visits London and brings a
  few places and things from there (the red bus, Big Ben, fish and chips,
  a cup of tea, the pound, driving on the left), and ends with the skill
  check. Questions and answers are in German; the English is spoken.
metadata:
  year: lernjahr-1
  topic: { de: Die Welt der Sprache, en: Where the language is spoken }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.listening.short-dialogues]
  vocabulary: { en: ["I'm from …", England, Scotland, Wales, Ireland, the USA, Canada, Australia, New Zealand, London, bus, fish and chips, tea] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: countries, what: { de: "wissen, in welchen Ländern man Englisch spricht", en: knowing which countries speak English } }
    - { id: from, what: { de: "verstehen, woher ein Kind kommt", en: understanding where a child is from } }
    - { id: london, what: { de: Orte und Dinge aus London und England kennen, en: knowing places and things from London and England } }
  misconceptions:
    - id: language-per-country
      what: Thinks every country has its own language named after it (Amerikanisch, Australisch, Neuseeländisch)
      addressed: lesson 1 Learn says that the people in all these countries speak English; feedback in l1-s5, l1-n1 and the skill check offers Australisch, Amerikanisch and Neuseeländisch as wrong options with feedback
    - id: england-only
      what: Thinks English is spoken only in England
      addressed: lesson 1 Learn lists the other countries; every stage of lesson 1 has a child from Scotland, Ireland, the USA, Canada, Australia or Wales, and the sorting tasks put countries far from England into the English bin
    - id: euro-everywhere
      what: Expects to pay with euros in England
      addressed: lesson 2 Learn names the pound; l2-f4 and l2-s3 give feedback on Euro
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wo spricht man Englisch?", en: "Where do people speak English?" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "England"
            say: { de: "Die englische Sprache kommt aus England. Darum heißt sie Englisch. Hör mal, so begrüßt dich ein Kind aus England.", en: "Hello! I'm Jack. I'm from England." }
          - text: "England, Schottland, Wales, Nordirland"
            say: { de: "England, Schottland, Wales und Nordirland gehören zusammen zu einem Land. Es heißt das Vereinigte Königreich. Viele sagen dazu einfach Großbritannien. Überall dort spricht man Englisch." }
          - text: "Irland, USA, Kanada, Australien, Neuseeland"
            say: { de: "Auch in Irland, in den USA, in Kanada, in Australien und in Neuseeland sprechen die Menschen Englisch. Sie sagen nicht Amerikanisch oder Australisch. Ihre Sprache ist Englisch. Hör mal, ein Mädchen aus Australien:", en: "Hi! I'm Ava. I'm from Australia." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Aus welchem Land kommt die englische Sprache?"
                say: { de: "Aus welchem Land kommt die englische Sprache?" }
                options: ["aus England", "aus Frankreich", "aus Spanien"]
                answer: "aus England"
                feedback:
                  "aus Frankreich": "In Frankreich spricht man Französisch."
                  "aus Spanien": "In Spanien spricht man Spanisch."
                hints:
                  - "Hör auf den Namen der Sprache: Englisch."
                  - "Englisch und England klingen fast gleich."
                  - "Die Sprache kommt aus England."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Woher kommt Jack?"
                say: { de: "Hör zu. Woher kommt Jack?" }
                audio: { en: "Hi! I'm Jack. I'm from London, in England.", speaker: male }
                options: ["aus England", "aus Australien", "aus Kanada"]
                answer: "aus England"
                hints:
                  - "Hör auf das Ende: I'm from …"
                  - "Jack sagt: in England."
                  - "Jack kommt aus England."
              - id: l1-f3
                type: true_false
                text: "Spricht man in Australien Englisch?"
                say: { de: "Spricht man in Australien Englisch?" }
                answer: true
                hints:
                  - "Denk an Ava aus dem Beispiel."
                  - "Ava kommt aus Australien und spricht Englisch."
                  - "Ja, in Australien spricht man Englisch."
              - id: l1-f4
                type: multiple_choice
                text: "In welchem Land spricht man kein Englisch?"
                say: { de: "In welchem Land spricht man kein Englisch?" }
                options: ["in Italien", "in Irland", "in Australien"]
                answer: "in Italien"
                feedback:
                  "in Irland": "In Irland spricht man Englisch. Irland liegt ganz nah bei England."
                  "in Australien": "In Australien spricht man Englisch, auch wenn es weit weg ist."
                hints:
                  - "Zwei Länder kennst du schon aus dem Beispiel."
                  - "In Irland und in Australien spricht man Englisch."
                  - "In Italien spricht man Italienisch."
              - id: l1-f5
                type: audio_choice
                text: "Woher kommt Ella?"
                say: { de: "Hör zu. Woher kommt Ella?" }
                audio: { en: "Hello! My name is Ella. I'm from Scotland.", speaker: female }
                options: ["aus Schottland", "aus Spanien", "aus den USA"]
                answer: "aus Schottland"
                feedback:
                  "aus Spanien": "Spanien heißt auf Englisch „Spain“. Ella sagt „Scotland“, das ist Schottland."
                hints:
                  - "Hör auf das letzte Wort."
                  - "Ella sagt: „Scotland“."
                  - "„Scotland“ heißt Schottland."
              - id: l1-f6
                type: sorting
                text: "Wo spricht man Englisch?"
                say: { de: "Sortiere die Länder. Spricht man dort Englisch oder nicht?" }
                bins:
                  - { id: english, show: { text: "Hier spricht man Englisch." } }
                  - { id: other, show: { text: "Hier spricht man kein Englisch." } }
                options:
                  - { text: "England", bin: english }
                  - { text: "Irland", bin: english }
                  - { text: "Australien", bin: english }
                  - { text: "Frankreich", bin: other }
                  - { text: "Italien", bin: other }
                  - { text: "Polen", bin: other }
                hints:
                  - "Fang mit dem Land an, das du sicher weißt."
                  - "Englisch kommt aus England. In Irland und Australien spricht man es auch."
                  - "England, Irland und Australien kommen zu Englisch. Frankreich, Italien und Polen nicht."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Woher kommt Noah?"
                say: { de: "Hör zu. Woher kommt Noah?" }
                audio: { en: "Hi! I'm Noah. I'm from New York, in the USA.", speaker: male }
                options: ["aus den USA", "aus England", "aus Irland"]
                answer: "aus den USA"
                hints: ["New York ist eine große Stadt in den USA."]
              - id: l1-s2
                type: true_false
                text: "Spricht man in Spanien Englisch?"
                say: { de: "Spricht man in Spanien Englisch?" }
                answer: false
                hints: ["In Spanien spricht man Spanisch."]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Länder gehören zum Vereinigten Königreich?"
                say: { de: "Welche Länder gehören zum Vereinigten Königreich?" }
                options: ["England, Schottland, Wales und Nordirland", "England und Frankreich", "England und Australien"]
                answer: "England, Schottland, Wales und Nordirland"
                feedback:
                  "England und Australien": "In Australien spricht man auch Englisch. Aber Australien ist ein eigenes Land, ganz weit weg."
                hints: ["Es sind vier Teile, und alle liegen nah beieinander."]
              - id: l1-s4
                type: audio_choice
                text: "Woher kommt Liam?"
                say: { de: "Hör zu. Woher kommt Liam?" }
                audio: { en: "Hello! I'm Liam. I'm from Ireland.", speaker: male }
                options: ["aus Irland", "aus Island", "aus Italien"]
                answer: "aus Irland"
                hints: ["„Ireland“ heißt Irland."]
              - id: l1-s5
                type: multiple_choice
                text: "Ava kommt aus Australien. Welche Sprache spricht sie?"
                say: { de: "Ava kommt aus Australien. Welche Sprache spricht sie?" }
                options: ["Englisch", "Australisch", "Französisch"]
                answer: "Englisch"
                feedback:
                  "Australisch": "Eine Sprache Australisch gibt es nicht. In Australien spricht man Englisch."
                hints: ["In Australien spricht man dieselbe Sprache wie in England."]
              - id: l1-s6
                type: audio_choice
                text: "Woher kommt Chloe?"
                say: { de: "Hör zu. Woher kommt Chloe?" }
                audio: { en: "Hi! I'm Chloe. I'm from Toronto, in Canada.", speaker: female }
                options: ["aus Kanada", "aus England", "aus Australien"]
                answer: "aus Kanada"
                hints: ["„Canada“ heißt Kanada."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "In den USA spricht man …"
                say: { de: "Welche Sprache spricht man in den USA?" }
                options: ["Englisch", "Amerikanisch", "Deutsch"]
                answer: "Englisch"
                feedback:
                  "Amerikanisch": "Viele sagen amerikanisches Englisch. Die Sprache ist aber Englisch."
              - id: l1-n2
                type: audio_choice
                text: "Woher kommt Oliver?"
                say: { de: "Hör zu. Woher kommt Oliver?" }
                audio: { en: "Hello! I'm Oliver. I'm from Wales.", speaker: male }
                options: ["aus Wales", "aus Polen", "aus Kanada"]
                answer: "aus Wales"
              - id: l1-n3
                type: true_false
                text: "Spricht man in Neuseeland Englisch?"
                say: { de: "Spricht man in Neuseeland Englisch?" }
                answer: true
              - id: l1-n4
                type: sorting
                text: "Wo spricht man Englisch?"
                say: { de: "Sortiere die Länder. Spricht man dort Englisch oder nicht?" }
                bins:
                  - { id: english, show: { text: "Hier spricht man Englisch." } }
                  - { id: other, show: { text: "Hier spricht man kein Englisch." } }
                options:
                  - { text: "Schottland", bin: english }
                  - { text: "Kanada", bin: english }
                  - { text: "USA", bin: english }
                  - { text: "Spanien", bin: other }
                  - { text: "Türkei", bin: other }
                  - { text: "Österreich", bin: other }
              - id: l1-n5
                type: audio_choice
                text: "Woher kommt Mia?"
                say: { de: "Hör zu. Woher kommt Mia?" }
                audio: { en: "Hi, I'm Mia. I'm from Dublin, in Ireland.", speaker: female }
                options: ["aus Irland", "aus den USA", "aus Schottland"]
                answer: "aus Irland"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Woher kommt Harry?"
            say: { de: "Hör zu. Woher kommt Harry?" }
            audio: { en: "Hello! I'm Harry. I'm from England.", speaker: male }
            options: ["aus England", "aus Kanada", "aus Irland"]
            answer: "aus England"
          - id: l1-c2
            type: true_false
            text: "Spricht man in Italien Englisch?"
            say: { de: "Spricht man in Italien Englisch?" }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Wo spricht man Englisch?"
            say: { de: "Wo spricht man Englisch?" }
            options: ["in Australien", "in Polen", "in Italien"]
            answer: "in Australien"
          - id: l1-c4
            type: audio_choice
            text: "Woher kommt Jacob?"
            say: { de: "Hör zu. Woher kommt Jacob?" }
            audio: { en: "Hi! I'm Jacob. I'm from Canada.", speaker: male }
            options: ["aus England", "aus Kanada", "aus Irland"]
            answer: "aus Kanada"
          - id: l1-c5
            type: true_false
            text: "Spricht man in Wales Englisch?"
            say: { de: "Spricht man in Wales Englisch?" }
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Welches Land gehört zum Vereinigten Königreich?"
            say: { de: "Welches Land gehört zum Vereinigten Königreich?" }
            options: ["Kanada", "Irland", "Schottland"]
            answer: "Schottland"

  - n: 2
    title: { de: Zu Besuch in London, en: A visit to London }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Woher kommt Sophie?"
            say: { de: "Hör zu. Woher kommt Sophie?" }
            audio: { en: "Hi! I'm Sophie. I'm from Australia.", speaker: female }
            options: ["aus Australien", "aus England", "aus Kanada"]
            answer: "aus Australien"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Spricht man in Irland Englisch?"
            say: { de: "Spricht man in Irland Englisch?" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "London"
            say: { de: "London ist die Hauptstadt von England und vom ganzen Vereinigten Königreich. Dort fahren rote Busse mit zwei Stockwerken.", en: "Look! A big red bus!" }
            show: { object: bus }
          - text: "Big Ben"
            say: { de: "Big Ben ist eine riesige Glocke. Sie hängt in einem hohen Uhrturm in London. Man hört sie weit durch die Stadt.", en: "Listen! That's Big Ben." }
            show: { object: bell }
          - text: "fish and chips, a cup of tea"
            say: { de: "Viele Menschen in England essen gern „fish and chips“, also Fisch mit Pommes. Und sie trinken gern eine Tasse Tee, oft mit Milch.", en: "Fish and chips, please! And a cup of tea." }
            show: { objects: [fish, cup] }
          - text: "£"
            say: { de: "In England bezahlt man mit Pfund. Das Zeichen dafür siehst du hier. Und noch etwas ist anders: Die Autos fahren auf der linken Straßenseite." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Was sieht Tom in London?"
                say: { de: "Hör zu. Was sieht Tom in London?" }
                audio: { en: "I'm in London. Look! A big red bus!", speaker: male }
                options: [{ object: bus }, { object: boat }, { object: bike }]
                answer: bus
                hints:
                  - "Hör auf das letzte Wort."
                  - "Tom sagt: „a big red bus“."
                  - "„Bus“ klingt wie Bus. Tippe auf den roten Bus."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was ist Big Ben?"
                say: { de: "Was ist Big Ben?" }
                options: ["eine große Glocke in London", "ein großer Bär", "ein Fluss in London"]
                answer: "eine große Glocke in London"
                feedback:
                  "ein großer Bär": "Ben klingt wie ein Name. Big Ben ist aber eine Glocke in einem Uhrturm."
                hints:
                  - "Denk an das Bild aus dem Beispiel."
                  - "Du hast eine Glocke gesehen."
                  - "Big Ben ist eine große Glocke in London."
              - id: l2-f3
                type: multiple_choice
                text: "Was ist „fish and chips“?"
                say: { de: "Was ist „fish and chips“?" }
                options: ["Fisch mit Pommes", "Fische im Meer", "Kartoffelchips"]
                answer: "Fisch mit Pommes"
                feedback:
                  "Kartoffelchips": "Kartoffelchips heißen in England „crisps“. „Chips“ sind in England Pommes."
                hints:
                  - "„Fish“ kennst du schon."
                  - "Es ist ein Essen mit Fisch."
                  - "„Fish and chips“ ist Fisch mit Pommes."
              - id: l2-f4
                type: true_false
                text: "Bezahlt man in England mit Euro?"
                say: { de: "Bezahlt man in England mit Euro?" }
                answer: false
                feedback:
                  "true": "In England bezahlt man mit Pfund."
                hints:
                  - "Denk an das Zeichen aus dem Beispiel."
                  - "Das Geld in England hat einen eigenen Namen."
                  - "Nein, in England bezahlt man mit Pfund."
              - id: l2-f5
                type: multiple_choice
                text: "Wie heißt die Hauptstadt von England?"
                say: { de: "Wie heißt die Hauptstadt von England?" }
                options: ["London", "New York", "Sydney"]
                answer: "London"
                hints:
                  - "Wo fahren die roten Busse?"
                  - "New York liegt in den USA, Sydney in Australien."
                  - "Die Hauptstadt ist London."
              - id: l2-f6
                type: audio_choice
                text: "Was möchte das Kind essen?"
                say: { de: "Hör zu. Was möchte das Kind essen?" }
                audio: { en: "Can I have fish and chips, please?", speaker: female }
                options: [{ object: fish }, { object: pizza }, { object: cake }]
                answer: fish
                hints:
                  - "Hör auf das Essen."
                  - "Das Kind sagt: „fish and chips“."
                  - "„Fish“ ist Fisch."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Fahren die Autos in England auf der linken Straßenseite?"
                say: { de: "Fahren die Autos in England auf der linken Straßenseite?" }
                answer: true
                hints: ["Bei uns fahren sie rechts. In England ist das anders."]
              - id: l2-s2
                type: audio_choice
                text: "Wo ist Ella?"
                say: { de: "Hör zu. Wo ist Ella?" }
                audio: { en: "Hello from London! I can see Big Ben.", speaker: female }
                options: ["in London", "in Sydney", "in New York"]
                answer: "in London"
                hints: ["Ella sagt: „Hello from London!“"]
              - id: l2-s3
                type: multiple_choice
                text: "Womit bezahlt man in England?"
                say: { de: "Womit bezahlt man in England?" }
                options: ["mit Pfund", "mit Euro", "mit Dollar"]
                answer: "mit Pfund"
                feedback:
                  "mit Euro": "Mit Euro bezahlt man bei uns. In England bezahlt man mit Pfund."
                  "mit Dollar": "Mit Dollar bezahlt man zum Beispiel in den USA."
                hints: ["Denk an das Zeichen £."]
              - id: l2-s4
                type: matching
                text: "Welche Stadt liegt in welchem Land?"
                say: { de: "Verbinde jede Stadt mit ihrem Land." }
                pairs:
                  - { left: { text: "London" }, right: { text: "England" } }
                  - { left: { text: "New York" }, right: { text: "USA" } }
                  - { left: { text: "Sydney" }, right: { text: "Australien" } }
                  - { left: { text: "Dublin" }, right: { text: "Irland" } }
                hints: ["Fang mit London an. Noah kommt aus New York in den USA, Mia aus Dublin in Irland."]
              - id: l2-s5
                type: multiple_choice
                text: "In welcher Stadt hängt die Glocke Big Ben?"
                say: { de: "In welcher Stadt hängt die Glocke Big Ben?" }
                options: ["in London", "in Sydney", "in Dublin"]
                answer: "in London"
                hints: ["Big Ben hängt in einem Uhrturm in der Hauptstadt von England."]
              - id: l2-s6
                type: audio_choice
                text: "Was möchte Oma in London?"
                say: { de: "Hör zu. Was möchte Oma in London?" }
                audio: { en: "A cup of tea, please.", speaker: female }
                options: [{ object: cup }, { object: juice }, { object: ice-cream }]
                answer: cup
                hints: ["„A cup of tea“ ist eine Tasse Tee."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Was mag Harry?"
                say: { de: "Hör zu. Was mag Harry?" }
                audio: { en: "Hi, I'm Harry. I live in London. I love the big red buses!", speaker: male }
                options: [{ object: bus }, { object: bike }, { object: boat }]
                answer: bus
              - id: l2-n2
                type: multiple_choice
                text: "Paula fährt nach London. Welches Geld braucht sie dort?"
                say: { de: "Paula fährt nach London. Welches Geld braucht sie dort?" }
                options: ["Pfund", "Euro", "Franken"]
                answer: "Pfund"
              - id: l2-n3
                type: true_false
                text: "Paula steht vor Big Ben. Ist sie in New York?"
                say: { de: "Paula steht vor Big Ben. Ist sie in New York?" }
                answer: false
              - id: l2-n4
                type: matching
                text: "Was bestellt Paula?"
                say: { de: "Paula bestellt in London etwas zu essen und zu trinken. Verbinde Englisch und Deutsch." }
                pairs:
                  - { left: { text: "fish and chips" }, right: { text: "Fisch mit Pommes" } }
                  - { left: { text: "a cup of tea" }, right: { text: "eine Tasse Tee" } }
                  - { left: { text: "an ice cream" }, right: { text: "ein Eis" } }
              - id: l2-n5
                type: audio_choice
                text: "Woher kommt Jake?"
                say: { de: "Hör zu. Woher kommt Jake?" }
                audio: { en: "Hi! I'm Jake. I'm from Sydney. It's hot and sunny here.", speaker: male }
                options: ["aus Australien", "aus England", "aus Kanada"]
                answer: "aus Australien"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: from
            type: audio_choice
            text: "Woher kommt Grace?"
            say: { de: "Hör zu. Woher kommt Grace?" }
            audio: { en: "Hello! I'm Grace. I'm from Edinburgh, in Scotland.", speaker: female }
            options: ["aus Schottland", "aus Spanien", "aus Irland"]
            answer: "aus Schottland"
          - id: l2-c2
            part: countries
            type: multiple_choice
            text: "Wo spricht man kein Englisch?"
            say: { de: "Wo spricht man kein Englisch?" }
            options: ["in Polen", "in Neuseeland", "in Kanada"]
            answer: "in Polen"
          - id: l2-c3
            part: countries
            type: multiple_choice
            text: "Welche Sprache spricht man in Neuseeland?"
            say: { de: "Welche Sprache spricht man in Neuseeland?" }
            options: ["Englisch", "Neuseeländisch", "Französisch"]
            answer: "Englisch"
            feedback:
              "Neuseeländisch": "Eine Sprache Neuseeländisch gibt es nicht. In Neuseeland spricht man Englisch."
          - id: l2-c4
            part: london
            type: true_false
            text: "Ist London die Hauptstadt von England?"
            say: { de: "Ist London die Hauptstadt von England?" }
            answer: true
          - id: l2-c5
            part: london
            type: multiple_choice
            text: "Du möchtest in London Fisch mit Pommes. Was sagst du?"
            say: { de: "Du möchtest in London Fisch mit Pommes. Was sagst du?" }
            options: ["Fish and chips, please.", "Fish and milk, please.", "A cup of tea, please."]
            answer: "Fish and chips, please."
            option_audio: false
          - id: l2-c6
            part: countries
            type: true_false
            text: "Spricht man in den USA Englisch?"
            say: { de: "Spricht man in den USA Englisch?" }
            answer: true
          - id: l2-c7
            part: countries
            type: true_false
            text: "Spricht man in Frankreich Englisch?"
            say: { de: "Spricht man in Frankreich Englisch?" }
            answer: false
          - id: l2-c8
            part: countries
            type: sorting
            text: "Englisch oder nicht? Sortiere die Länder."
            say: { de: "In welchen Ländern spricht man Englisch? Sortiere sie." }
            bins:
              - { id: english, show: { text: "Hier spricht man Englisch." } }
              - { id: other, show: { text: "Hier spricht man kein Englisch." } }
