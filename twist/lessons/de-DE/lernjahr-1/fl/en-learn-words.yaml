# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-learn-words
skill: fl.culture-strategies.learn-words
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Wörter lernen und behalten
  en: Learning and remembering words
summary: >
  Ways to remember new English words. Lesson 1 brings picture cards
  (picture on the front, word on the back), saying the word aloud with a
  movement (jump, clap, wave), and a few words each day instead of many at
  once. Lesson 2 brings the word notebook (English on the left, German on
  the right), sorting words by topic, and finding words in a picture
  dictionary by topic and by ABC, and ends with the skill check.
  Instructions are in German; the English words are read and heard.
metadata:
  year: lernjahr-1
  topic: { de: Lernstrategien, en: Learning strategies }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.word-picture]
  also_practises: [fl.reading.word-picture, fl.speaking.imitate]
  vocabulary: { en: [duck, bee, sun, moon, star, cloud, "Clap your hands!", "Wave!", "Stand up!", cat, cow, cup, cake, pencil, ruler, rubber, jumper, skirt] }
  forms: [picture, text, audio, drawn]
  drawn: [word-card, table]
  facets: []
  parts:
    - { id: cards, what: { de: mit Bildkarten lernen, en: learning with picture cards } }
    - { id: tips, what: { de: "Wege zum Merken kennen (laut sagen, bewegen, wiederholen)", en: "knowing ways to remember words (saying them aloud, moving, repeating)" } }
    - { id: notebook, what: { de: ein Wörterheft führen und Wörter nach Themen ordnen, en: keeping a word notebook and sorting words by topic } }
    - { id: dictionary, what: { de: im Bildwörterbuch nach Thema und ABC suchen, en: looking up words in a picture dictionary by topic and by ABC } }
  misconceptions:
    - id: look-once
      what: Thinks looking at a word once is enough to keep it
      addressed: lesson 1 Learn shows saying, checking and repeating; l1-f2, l1-s5 and the skill check offer reading once as a wrong option, with feedback in l1-f2
    - id: cram
      what: Tries to learn a long list in one go and never repeats it
      addressed: lesson 1 Learn says a few words each day and again the next day; l1-s3, l1-s6 and l2-n5 ask about it, with feedback in l1-f2
    - id: search-everything
      what: Leafs through the whole picture dictionary instead of looking in the right topic or at the right letter
      addressed: lesson 2 Learn shows the topics and the ABC; every stage of lesson 2 asks in which part a word is found and puts words in ABC order
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Bildkarten und Bewegungen, en: Picture cards and movement }
    goal:
      de: "Merk dir neue Wörter mit Bildkarten und mit Bewegungen, so wie du bei jump hochspringst."
      en: "Remember new words with picture cards and movements, like jumping up when you say jump."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Lies das Wort. Welches Bild passt?"
            say: { de: "Lies das Wort. Welches Bild passt?" }
            show: { drawn: word-card, text: "dog" }
            options: [{ object: dog }, { object: duck }, { object: frog }]
            answer: dog
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            option_audio: false
            text: "Lies das Wort. Welches Bild passt?"
            say: { de: "Lies das Wort. Welches Bild passt?" }
            show: { drawn: word-card, text: "cake" }
            options: [{ object: cake }, { object: cat }, { object: car }]
            answer: cake
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Bildkarte: vorne das Bild"
            say: { de: "So kannst du dir neue Wörter gut merken. Mach dir Bildkarten. Vorne malst du ein Bild. Hinten schreibst du das englische Wort.", en: "Duck." }
            show: { object: duck }
          - text: "hinten das Wort"
            say: { de: "Schau dir das Bild an und sag das Wort laut. Dann drehst du die Karte um und prüfst: Stimmt es?", en: "Duck." }
            show: { drawn: word-card, text: "duck" }
          - text: "jump"
            say: { de: "Mit einer Bewegung merkst du dir ein Wort noch besser. Sag „jump“ und spring dabei hoch.", en: "Jump!" }
            show: { object: jump }
          - text: "Jeden Tag ein paar Wörter"
            say: { de: "Lern lieber jeden Tag ein paar Wörter als ganz viele auf einmal. Und schau sie dir am nächsten Tag noch einmal an." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                option_audio: false
                text: "Hinten auf deiner Bildkarte steht dieses Wort. Was malst du vorne hin?"
                say: { de: "Hinten auf deiner Bildkarte steht dieses Wort. Was malst du vorne hin?" }
                show: { drawn: word-card, text: "bee" }
                options: [{ object: bee }, { object: bed }, { object: bird }]
                answer: bee
                feedback:
                  bed: "„Bed“ hat am Ende ein d. Auf der Karte steht „bee“, mit zwei e."
                hints:
                  - "Alle drei Wörter fangen mit b an. Schau auf das Ende."
                  - "Auf der Karte stehen b, e, e."
                  - "„Bee“ ist die Biene."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Tipp hilft dir, neue Wörter zu behalten?"
                say: { de: "Welcher Tipp hilft dir, neue Wörter zu behalten?" }
                options: ["Ich sage das Wort laut und mache eine Bewegung dazu.", "Ich lese das Wort einmal ganz schnell.", "Ich lerne fünfzig Wörter an einem Tag."]
                answer: "Ich sage das Wort laut und mache eine Bewegung dazu."
                feedback:
                  "Ich lese das Wort einmal ganz schnell.": "Einmal schnell lesen reicht meistens nicht. Sag das Wort laut und wiederhole es."
                  "Ich lerne fünfzig Wörter an einem Tag.": "Das sind zu viele auf einmal. Lern lieber jeden Tag ein paar."
                hints:
                  - "Ein Wort bleibt besser im Kopf, wenn du es sagst und dazu etwas tust."
                  - "Was hast du bei „jump“ gemacht?"
                  - "Laut sagen und dabei bewegen hilft."
              - id: l1-f3
                type: speak
                text: "Sag es und mach mit!"
                say: { de: "Sag es auf Englisch und klatsch dabei in die Hände.", en: "Clap your hands!" }
                show: { object: clap }
                expected_text: "Clap your hands!"
                hints:
                  - "Hör noch einmal zu und klatsch mit."
                  - "„Clap“ heißt klatschen, „hands“ sind die Hände."
                  - "Sag mit mir: Clap your hands!"
              - id: l1-f4
                type: matching
                text: "Welches Bild gehört zu welcher Karte?"
                say: { de: "Lies das Wort auf der Karte und verbinde es mit dem passenden Bild." }
                pairs:
                  - { left: { text: "sun" }, right: { object: sun } }
                  - { left: { text: "moon" }, right: { object: moon } }
                  - { left: { text: "star" }, right: { object: star } }
                  - { left: { text: "cloud" }, right: { object: cloud } }
                hints:
                  - "Fang mit dem Wort an, das du sicher lesen kannst."
                  - "„Sun“ ist die Sonne, „moon“ ist der Mond."
                  - "„Star“ ist der Stern, „cloud“ ist die Wolke."
              - id: l1-f5
                type: true_false
                text: "Lena schaut auf das Bild, sagt das Wort laut und dreht dann die Karte um. Ist das ein guter Weg zum Wörterlernen?"
                say: { de: "Lena schaut auf das Bild, sagt das Wort laut und dreht dann die Karte um. Ist das ein guter Weg zum Wörterlernen?" }
                answer: true
                hints:
                  - "Was macht Lena zuerst, und was macht sie danach?"
                  - "Lena sagt das Wort laut und prüft es auf der Rückseite."
                  - "Ja, genau so lernt man mit Bildkarten."
              - id: l1-f6
                type: multiple_choice
                text: "Tom will sich „swim“ merken. Welche Bewegung passt?"
                say: { de: "Tom will sich das Wort „swim“ merken. Welche Bewegung passt dazu?" }
                options: ["Er macht Schwimmbewegungen mit den Armen.", "Er klatscht in die Hände.", "Er setzt sich hin."]
                answer: "Er macht Schwimmbewegungen mit den Armen."
                hints:
                  - "Was heißt „swim“?"
                  - "„Swim“ heißt schwimmen."
                  - "Die Bewegung zeigt, was das Wort heißt: schwimmen."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                option_audio: false
                text: "Hinten auf deiner Bildkarte steht dieses Wort. Was malst du vorne hin?"
                say: { de: "Hinten auf deiner Bildkarte steht dieses Wort. Was malst du vorne hin?" }
                show: { drawn: word-card, text: "snake" }
                options: [{ object: snake }, { object: snail }, { object: star }]
                answer: snake
                hints: ["„Snake“ und „snail“ fangen gleich an. Schau auf das Ende."]
              - id: l1-s2
                type: speak
                text: "Sag es und mach mit!"
                say: { de: "Sag es auf Englisch und wink dabei.", en: "Wave!" }
                show: { object: wave }
                expected_text: "Wave!"
                hints: ["Hör noch einmal zu, wink und sprich mit."]
              - id: l1-s3
                type: multiple_choice
                text: "Wann wiederholst du deine neuen Wörter am besten?"
                say: { de: "Wann wiederholst du deine neuen Wörter am besten?" }
                options: ["morgen und in ein paar Tagen noch einmal", "nie, einmal reicht", "erst in den Sommerferien"]
                answer: "morgen und in ein paar Tagen noch einmal"
                hints: ["Ein Wort bleibt besser im Kopf, wenn es bald wiederkommt."]
              - id: l1-s4
                type: matching
                text: "Welches Bild gehört zu welcher Karte?"
                say: { de: "Lies das Wort auf der Karte und verbinde es mit dem passenden Bild." }
                pairs:
                  - { left: { text: "cat" }, right: { object: cat } }
                  - { left: { text: "cow" }, right: { object: cow } }
                  - { left: { text: "cup" }, right: { object: cup } }
                  - { left: { text: "cake" }, right: { object: cake } }
                hints: ["Alle fangen mit c an. Lies jedes Wort bis zum Ende."]
              - id: l1-s5
                type: multiple_choice
                text: "Ben vergisst immer das Wort „ladder“. Was kann er tun?"
                say: { de: "Ben vergisst immer das Wort „ladder“. Was kann er tun?" }
                options: ["Er macht sich eine Bildkarte mit einer Leiter.", "Er liest das Wort einmal und legt es weg.", "Er lässt das Wort einfach weg."]
                answer: "Er macht sich eine Bildkarte mit einer Leiter."
                hints: ["Mit einem Bild vorne auf der Karte merkst du dir ein Wort besser."]
              - id: l1-s6
                type: true_false
                text: "Ist es gut, ganz viele Wörter auf einmal zu lernen?"
                say: { de: "Ist es gut, an einem Tag ganz viele Wörter auf einmal zu lernen?" }
                answer: false
                hints: ["Wie viele Wörter solltest du jeden Tag lernen?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                option_audio: false
                text: "Hinten auf deiner Bildkarte steht dieses Wort. Was malst du vorne hin?"
                say: { de: "Hinten auf deiner Bildkarte steht dieses Wort. Was malst du vorne hin?" }
                show: { drawn: word-card, text: "shell" }
                options: [{ object: shell }, { object: shoe }, { object: snail }]
                answer: shell
              - id: l1-n2
                type: speak
                text: "Sag es und mach mit!"
                say: { de: "Sag es auf Englisch und steh dabei auf.", en: "Stand up!" }
                show: { object: stand-up }
                expected_text: "Stand up!"
              - id: l1-n3
                type: true_false
                text: "Ich spiele das Wort vor. Bei „jump“ springe ich hoch. Ist das ein guter Tipp?"
                say: { de: "Ich spiele das Wort vor. Bei „jump“ springe ich hoch. Ist das ein guter Tipp?" }
                answer: true
              - id: l1-n4
                type: matching
                text: "Welches Bild gehört zu welcher Karte?"
                say: { de: "Lies das Wort auf der Karte und verbinde es mit dem passenden Bild." }
                pairs:
                  - { left: { text: "book" }, right: { object: book } }
                  - { left: { text: "ball" }, right: { object: ball } }
                  - { left: { text: "bike" }, right: { object: bike } }
                  - { left: { text: "bus" }, right: { object: bus } }
              - id: l1-n5
                type: multiple_choice
                text: "Was ist kein guter Tipp zum Wörterlernen?"
                say: { de: "Was ist kein guter Tipp zum Wörterlernen?" }
                options: ["Ich lese das Wort nur still und sage es nie laut.", "Ich sage das Wort laut.", "Ich male ein Bild dazu."]
                answer: "Ich lese das Wort nur still und sage es nie laut."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            option_audio: false
            text: "Hinten auf deiner Bildkarte steht dieses Wort. Was malst du vorne hin?"
            say: { de: "Hinten auf deiner Bildkarte steht dieses Wort. Was malst du vorne hin?" }
            show: { drawn: word-card, text: "fox" }
            options: [{ object: fox }, { object: frog }, { object: fish }]
            answer: fox
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Tipp hilft beim Wörterlernen?"
            say: { de: "Welcher Tipp hilft beim Wörterlernen?" }
            options: ["Ich mache mir Bildkarten.", "Ich lerne nur in den Ferien.", "Ich schaue das Wort einmal an."]
            answer: "Ich mache mir Bildkarten."
          - id: l1-c3
            type: true_false
            text: "Hilft dir eine Bewegung beim Merken?"
            say: { de: "Hilft dir eine Bewegung beim Merken?" }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Was malst du vorne auf eine Bildkarte?"
            say: { de: "Was malst du vorne auf eine Bildkarte?" }
            options: ["das englische Wort", "ein Bild zum Wort", "eine Zahl"]
            answer: "ein Bild zum Wort"
          - id: l1-c5
            type: true_false
            text: "Paul lernt alle Wörter für das ganze Schuljahr an einem einzigen Tag. Ist das ein guter Weg?"
            say: { de: "Paul lernt alle Wörter für das ganze Schuljahr an einem einzigen Tag. Ist das ein guter Weg?" }
            answer: false
          - id: l1-c6
            type: multiple_choice
            option_audio: false
            text: "Vorne auf der Bildkarte ist dieses Bild. Welches Wort steht hinten?"
            say: { de: "Vorne auf der Bildkarte ist dieses Bild. Welches Wort steht hinten?" }
            show: { object: sun }
            options: ["star", "sun", "moon"]
            answer: "sun"

  - n: 2
    title: { de: Wörterheft und Bildwörterbuch, en: Word notebook and picture dictionary }
    goal:
      de: "Ordne neue Wörter in deinem Wörterheft und such sie im Bildwörterbuch nach Thema oder Alphabet."
      en: "Sort new words in your word notebook and find them in a picture dictionary by topic or alphabet."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            option_audio: false
            text: "Lies das Wort. Welches Bild passt?"
            say: { de: "Lies das Wort. Welches Bild passt?" }
            show: { drawn: word-card, text: "duck" }
            options: [{ object: duck }, { object: dog }, { object: bird }]
            answer: duck
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Merkst du dir Wörter besser, wenn du sie oft wiederholst?"
            say: { de: "Merkst du dir Wörter besser, wenn du sie oft wiederholst?" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Mein Wörterheft"
            say: { de: "Viele Kinder haben ein Wörterheft. Links steht das englische Wort, rechts das deutsche. Daneben kannst du ein kleines Bild malen." }
            show: { drawn: table, rows: [[English, Deutsch], [cat, die Katze], [dog, der Hund], [bird, der Vogel]] }
          - text: "Tiere: cat, dog, bird\nEssen: apple, bread, cheese"
            say: { de: "Ordne deine Wörter nach Themen: Tiere zu Tieren, Essen zu Essen. Dann findest du sie schneller wieder, und du merkst sie dir besser." }
          - text: "Bildwörterbuch"
            say: { de: "In einem Bildwörterbuch stehen Wörter mit Bildern. Oft sind sie nach Themen geordnet, zum Beispiel Tiere, Schule oder Essen. Du schaust also gleich beim richtigen Thema nach." }
            show: { object: book-open }
          - text: "apple, bird, cat"
            say: { de: "Manche Wörterbücher ordnen die Wörter nach dem ABC. „Apple“ fängt mit a an, „bird“ mit b, „cat“ mit c. Also kommt „apple“ zuerst, dann „bird“, dann „cat“." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Ordne die Wörter nach Themen."
                say: { de: "Ordne die Wörter für dein Wörterheft nach Themen: Tiere oder Essen." }
                bins:
                  - { id: animals, show: { text: "Tiere" } }
                  - { id: food, show: { text: "Essen" } }
                options:
                  - { text: "cat", bin: animals }
                  - { text: "frog", bin: animals }
                  - { text: "cow", bin: animals }
                  - { text: "apple", bin: food }
                  - { text: "bread", bin: food }
                  - { text: "cheese", bin: food }
                hints:
                  - "Lies jedes Wort. Ist es ein Tier oder kann man es essen?"
                  - "„Cat“, „frog“ und „cow“ sind Tiere."
                  - "„Apple“, „bread“ und „cheese“ kommen zu Essen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "In deinem Wörterheft fehlt ein deutsches Wort. Was schreibst du in die Lücke?"
                say: { de: "In deinem Wörterheft fehlt ein deutsches Wort. Was schreibst du in die Lücke?" }
                show: { drawn: table, rows: [[English, Deutsch], [dog, "?"]] }
                options: ["der Hund", "die Katze", "der Hut"]
                answer: "der Hund"
                hints:
                  - "Lies das englische Wort links."
                  - "„Dog“ ist ein Tier."
                  - "„Dog“ heißt der Hund."
              - id: l2-f3
                type: multiple_choice
                text: "Bei welchem Thema findest du „cow“ im Bildwörterbuch?"
                say: { de: "Bei welchem Thema findest du „cow“ im Bildwörterbuch?" }
                options: ["Tiere", "Schule", "Kleidung"]
                answer: "Tiere"
                hints:
                  - "Was heißt „cow“?"
                  - "„Cow“ ist die Kuh."
                  - "Eine Kuh ist ein Tier."
              - id: l2-f4
                type: ordering
                text: "Ordne die Wörter nach dem ABC."
                say: { de: "Ordne die Wörter nach dem ABC, so wie im Wörterbuch." }
                options: ["cat", "apple", "bird"]
                slot_count: 3
                answer: ["apple", "bird", "cat"]
                hints:
                  - "Schau nur auf den ersten Buchstaben."
                  - "A kommt vor b, b kommt vor c."
                  - "Zuerst „apple“, dann „bird“, dann „cat“."
              - id: l2-f5
                type: multiple_choice
                text: "Bei welchem Thema findest du „pencil“?"
                say: { de: "Bei welchem Thema findest du „pencil“ im Bildwörterbuch?" }
                options: ["Schule", "Tiere", "Essen"]
                answer: "Schule"
                hints:
                  - "Was heißt „pencil“?"
                  - "„Pencil“ ist der Bleistift."
                  - "Einen Bleistift brauchst du in der Schule."
              - id: l2-f6
                type: matching
                text: "Was gehört zusammen?"
                say: { de: "Du schreibst Schulsachen in dein Wörterheft. Verbinde das englische Wort mit dem deutschen." }
                pairs:
                  - { left: { text: "pencil" }, right: { text: "der Bleistift" } }
                  - { left: { text: "ruler" }, right: { text: "das Lineal" } }
                  - { left: { text: "rubber" }, right: { text: "der Radiergummi" } }
                hints:
                  - "Fang mit dem Wort an, das du schon kennst."
                  - "„Pencil“ ist der Bleistift."
                  - "„Ruler“ ist das Lineal, „rubber“ ist der Radiergummi."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Ordne die Wörter nach Themen."
                say: { de: "Ordne die Wörter nach Themen: Schule oder Kleidung." }
                bins:
                  - { id: school, show: { text: "Schule" } }
                  - { id: clothes, show: { text: "Kleidung" } }
                options:
                  - { text: "pencil", bin: school }
                  - { text: "ruler", bin: school }
                  - { text: "schoolbag", bin: school }
                  - { text: "jumper", bin: clothes }
                  - { text: "skirt", bin: clothes }
                  - { text: "sock", bin: clothes }
                hints: ["Kann man es anziehen? Dann kommt es zu Kleidung."]
              - id: l2-s2
                type: ordering
                text: "Ordne die Wörter nach dem ABC."
                say: { de: "Ordne die Wörter nach dem ABC." }
                options: ["dog", "egg", "cow"]
                slot_count: 3
                answer: ["cow", "dog", "egg"]
                hints: ["Sag das ABC auf: a, b, c, d, e. Welcher Buchstabe kommt zuerst?"]
              - id: l2-s3
                type: multiple_choice
                text: "Wo sucht Lena im Bildwörterbuch nach „bread“?"
                say: { de: "Lena sucht das Wort „bread“ im Bildwörterbuch. Wo schaut sie nach?" }
                options: ["beim Thema Essen", "beim Thema Tiere", "beim Thema Wetter"]
                answer: "beim Thema Essen"
                hints: ["„Bread“ ist das Brot."]
              - id: l2-s4
                type: multiple_choice
                text: "In Pauls Wörterheft ist ein Fehler. Wo?"
                say: { de: "In Pauls Wörterheft ist ein Fehler. Wo ist er?" }
                show: { drawn: table, rows: [[English, Deutsch], [cat, die Katze], [frog, der Fisch], [cow, die Kuh]] }
                options: ["frog, der Fisch", "cat, die Katze", "cow, die Kuh"]
                answer: "frog, der Fisch"
                hints: ["„Frog“ ist ein Tier, das hüpft und quakt."]
              - id: l2-s5
                type: speak
                text: "Lies das Wort laut vor."
                say: { de: "Das Wort steht in deinem Wörterheft. Lies es laut vor.", en: "Rabbit." }
                show: { drawn: word-card, text: "rabbit" }
                expected_text: "rabbit"
                hints: ["Hör zu und sprich nach: rab, bit."]
              - id: l2-s6
                type: true_false
                text: "Kommt „bus“ im ABC vor „apple“?"
                say: { de: "Kommt „bus“ im ABC vor „apple“?" }
                answer: false
                hints: ["Welcher Buchstabe kommt zuerst, a oder b?"]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Ordne die Wörter nach Themen."
                say: { de: "Ordne die Wörter nach Themen: Tiere, Essen oder Kleidung." }
                bins:
