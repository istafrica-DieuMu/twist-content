# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-likes
skill: fl.speaking.likes
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Was ich mag und nicht mag
  en: What I like and don't like
summary: >
  Saying what you like and do not like, and asking others. Lesson 1 brings
  I like ... and I don't like ... with food and animals, heard, read and
  built from word cards; lesson 2 asks Do you like ...?, answers with
  Yes, I do. and No, I don't., adds My favourite ... is ..., and ends with
  the skill check. Speaking tasks are practice only, so Practise covers
  saying it aloud; the skill check marks understanding, choosing and
  building the sentences.
metadata:
  year: lernjahr-1
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.name-things, fl.grammar.chunks]
  also_practises: [fl.themes.food, fl.grammar.questions]
  vocabulary: { en: [I like, I don't like, "Do you like ...?", "Yes, I do.", "No, I don't.", my favourite, food, animal] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: likes, what: { de: "sagen und verstehen, was jemand mag und nicht mag", en: saying and understanding what someone likes and does not like } }
    - { id: ask, what: { de: "fragen, ob jemand etwas mag (Do you like …?)", en: "asking whether someone likes something (Do you like …?)" } }
    - { id: answer, what: { de: "kurz antworten (Yes, I do. No, I don't.)", en: "giving a short answer (Yes, I do. No, I don't.)" } }
    - { id: favourite, what: { de: "sagen, was man am liebsten mag (My favourite … is …)", en: "saying what your favourite is (My favourite … is …)" } }
  misconceptions:
    - id: hears-like
      what: Hears like in I don't like and takes it for liking
      addressed: lesson 1 Learn puts don't before like; l1-f2 (with feedback), l1-s1 and l1-n1 put a don't like and a like in one sentence, and the check asks for what the child does not like
    - id: yes-i-like
      what: Answers Do you like ...? with Yes, I like. instead of Yes, I do.
      addressed: lesson 2 Learn shows the short answers; l2-f1 gives feedback on Yes, I like., and l2-s1, l2-n3 and l2-c3 keep the wrong short answer among the options
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "I like ... und I don't like ...", en: "I like ... and I don't like ..." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Pizza." }
            options: [{ object: pizza }, { object: cheese }, { object: cake }]
            answer: pizza
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Ice cream." }
            options: [{ object: milk }, { object: ice-cream }, { object: apple }]
            answer: ice-cream
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "I like apples."
            say: { de: "Mit „I like“ sagst du, was du magst. „I like apples“ heißt: Ich mag Äpfel.", en: "I like apples." }
            show: { object: apple }
          - text: "I don't like cheese."
            say: { de: "Mit „I don't like“ sagst du, was du nicht magst. Das „don't“ steht vor „like“. Hör gut hin, sonst klingt es wie „I like“.", en: "I don't like cheese." }
            show: { object: cheese }
          - text: "I like cats. I don't like snakes."
            say: { de: "Bei Tieren und vielen Sachen zum Essen sagst du die Mehrzahl: „I like cats“, „I like apples“.", en: "I like cats. I don't like snakes." }
            show: { object: cat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Was mag das Kind?"
                say: { de: "Hör zu. Was mag das Kind?" }
                audio: { en: "I like bananas.", speaker: female }
                options: [{ object: banana }, { object: apple }, { object: cheese }]
                answer: banana
                hints:
                  - "Hör auf das Wort nach „I like“."
                  - "„Bananas“ klingt fast wie das deutsche Wort."
                  - "Tippe auf die Banane."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Mag das Kind Käse?"
                say: { de: "Hör zu. Mag das Kind Käse?" }
                audio: { en: "I don't like cheese.", speaker: male }
                options: ["Ja, es mag Käse.", "Nein, es mag keinen Käse."]
                answer: "Nein, es mag keinen Käse."
                feedback:
                  "Ja, es mag Käse.": "Hör genau hin: „I don't like“ heißt: Ich mag nicht."
                hints:
                  - "Hörst du ein „don't“?"
                  - "I don't like cheese."
                  - "„Don't like“ heißt: mag nicht. Das Kind mag keinen Käse."
              - id: l1-f3
                type: ordering
                option_audio: false
                text: "Bau den Satz: Ich mag Hunde."
                say: { de: "Bau den Satz: Ich mag Hunde." }
                options: ["dogs", "like", "I"]
                slot_count: 3
                answer: ["I", "like", "dogs"]
                hints:
                  - "Der Satz fängt mit „I“ an."
                  - "Nach „I“ kommt „like“."
                  - "I like dogs."
              - id: l1-f4
                type: true_false
                text: "„I like pizza.“ Mag das Kind Pizza?"
                say: { de: "Lies den Satz. Mag das Kind Pizza?" }
                show: { object: pizza }
                answer: true
                hints:
                  - "Steht im Satz ein „don't“?"
                  - "Nein, da steht nur „I like“."
                  - "Ja, das Kind mag Pizza."
              - id: l1-f5
                type: speak
                say: { de: "Sag auf Englisch, dass du Eis magst.", en: "I like ice cream." }
                show: { object: ice-cream }
                expected_text: "I like ice cream"
                hints:
                  - "Fang mit „I like“ an."
                  - "Eis heißt „ice cream“."
                  - "Sag mit mir: I like ice cream."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Was mag das Kind nicht?"
                say: { de: "Hör zu. Was mag das Kind nicht?" }
                audio: { en: "I like milk. I don't like juice.", speaker: female }
                options: [{ object: milk }, { object: juice }, { object: water }]
                answer: juice
                hints: ["Hör auf das Wort nach „don't like“."]
              - id: l1-s2
                type: fill_in_blank
                option_audio: false
                text: "Das Kind mag keine Karotten. Ergänze den Satz."
                say: { de: "Das Kind mag keine Karotten. Ergänze den Satz." }
                show: { object: carrot }
                frame: "I _ like carrots."
                options: ["don't", "do", "am"]
                answer: ["don't"]
                hints: ["„Nicht mögen“ heißt „don't like“."]
              - id: l1-s3
                type: image_multiple_choice
                option_audio: false
                text: "„I like frogs.“ Welches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: frog }, { object: dog }, { object: fish }]
                answer: frog
                hints: ["„Frog“ ist ein Tier, das quakt."]
              - id: l1-s4
                type: ordering
                option_audio: false
                text: "Bau den Satz: Ich mag keine Schlangen."
                say: { de: "Bau den Satz: Ich mag keine Schlangen." }
                options: ["snakes", "like", "don't", "I"]
                slot_count: 4
                answer: ["I", "don't", "like", "snakes"]
                hints: ["„Don't“ steht vor „like“."]
              - id: l1-s5
                type: speak
                say: { de: "Sag auf Englisch, dass du keinen Käse magst.", en: "I don't like cheese." }
                show: { object: cheese }
                expected_text: "I don't like cheese"
                hints: ["Sag mit mir: I don't like cheese."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Was mag das Kind?"
                say: { de: "Hör zu. Was mag das Kind?" }
                audio: { en: "I don't like apples. I like oranges.", speaker: male }
                options: [{ object: apple }, { object: orange }, { object: banana }]
                answer: orange
              - id: l1-n2
                type: true_false
                text: "„I don't like cats.“ Mag das Kind Katzen?"
                say: { de: "Lies den Satz. Mag das Kind Katzen?" }
                answer: false
              - id: l1-n3
                type: fill_in_blank
                option_audio: false
                text: "Das Kind mag Erdbeeren. Ergänze den Satz."
                say: { de: "Das Kind mag Erdbeeren. Ergänze den Satz." }
                show: { object: strawberry }
                frame: "I _ strawberries."
                options: ["like", "don't like", "am"]
                answer: ["like"]
              - id: l1-n4
                type: ordering
                option_audio: false
                text: "Bau den Satz: Ich mag Katzen."
                say: { de: "Bau den Satz: Ich mag Katzen." }
                options: ["cats", "I", "like"]
                slot_count: 3
                answer: ["I", "like", "cats"]
              - id: l1-n5
                type: audio_choice
                text: "Was mag Ben?"
                say: { de: "Hör zu. Was mag Ben?" }
                audio: { en: "I'm Ben. I like pizza, but I don't like carrots.", speaker: male }
                options: [{ object: pizza }, { object: carrot }, { object: cake }]
                answer: pizza

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Was mag das Kind nicht?"
            say: { de: "Hör zu. Was mag das Kind nicht?" }
            audio: { en: "I don't like milk.", speaker: male }
            options: [{ object: milk }, { object: juice }, { object: water }]
            answer: milk
          - id: l1-c2
            type: image_multiple_choice
            option_audio: false
            text: "„I like dogs.“ Welches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: dog }, { object: cat }, { object: duck }]
            answer: dog
          - id: l1-c3
            type: true_false
            text: "„I like cake.“ Mag das Kind Kuchen?"
            say: { de: "Lies den Satz. Mag das Kind Kuchen?" }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Was mag das Kind?"
            say: { de: "Hör zu. Was mag das Kind?" }
            audio: { en: "I like dogs. I don't like cats.", speaker: male }
            options: [{ object: cat }, { object: fish }, { object: dog }]
            answer: dog
          - id: l1-c5
            type: multiple_choice
            option_audio: false
            text: "Du magst keine Schlangen. Was sagst du?"
            say: { de: "Du magst keine Schlangen. Was sagst du auf Englisch?" }
            options: ["I like snakes.", "I don't snakes.", "I don't like snakes."]
            answer: "I don't like snakes."
          - id: l1-c6
            type: image_multiple_choice
            option_audio: false
            text: "„I don't like cats. I like rabbits.“ Welches Tier mag das Kind?"
            say: { de: "Lies die Sätze. Welches Tier mag das Kind?" }
            options: [{ object: cat }, { object: rabbit }, { object: dog }]
            answer: rabbit

  - n: 2
    title: { de: "Do you like ...?", en: "Do you like ...?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Was mag das Kind?"
            say: { de: "Hör zu. Was mag das Kind?" }
            audio: { en: "I like strawberries.", speaker: female }
            options: [{ object: strawberry }, { object: apple }, { object: banana }]
            answer: strawberry
            difficulty: easy
          - id: l2-w2
            type: ordering
            option_audio: false
            text: "Bau den Satz: Ich mag keine Bananen."
            say: { de: "Bau den Satz: Ich mag keine Bananen." }
            options: ["bananas", "don't", "I", "like"]
            slot_count: 4
            answer: ["I", "don't", "like", "bananas"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Do you like apples?"
            say: { de: "So fragst du, ob jemand etwas mag. Die Frage fängt mit „Do you like“ an.", en: "Do you like apples?" }
            show: { object: apple }
          - text: "Yes, I do. No, I don't."
            say: { de: "Die kurze Antwort ist „Yes, I do“ oder „No, I don't“. Du sagst nicht „Yes, I like“.", en: "Do you like apples? Yes, I do. Do you like cheese? No, I don't." }
          - text: "My favourite food is pizza."
            say: { de: "Was du am allerliebsten magst, ist dein „favourite“. „My favourite food is pizza“ heißt: Mein Lieblingsessen ist Pizza.", en: "My favourite food is pizza." }
            show: { object: pizza }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Du magst Bananen. Welche Antwort passt?"
                say: { de: "Du magst Bananen. Hör die Frage. Welche Antwort passt?" }
                audio: { en: "Do you like bananas?", speaker: male }
                options: ["Yes, I do.", "Yes, I like.", "Yes, I am."]
                answer: "Yes, I do."
                feedback:
                  "Yes, I like.": "Auf „Do you like …?“ antwortest du kurz mit „do“: „Yes, I do.“"
                hints:
                  - "Die Frage fängt mit „Do“ an. Die Antwort auch."
                  - "Du magst Bananen, also sagst du „Yes“."
                  - "Yes, I do."
              - id: l2-f2
                type: ordering
                option_audio: false
                text: "Bau die Frage: Magst du Katzen?"
                say: { de: "Bau die Frage: Magst du Katzen?" }
                options: ["like", "Do", "cats?", "you"]
                slot_count: 4
                answer: ["Do", "you", "like", "cats?"]
                hints:
                  - "Die Frage fängt mit dem Wort an, das großgeschrieben ist."
                  - "Do you ..."
                  - "Do you like cats?"
              - id: l2-f3
                type: audio_choice
                text: "Mag Lily Hunde?"
                say: { de: "Hör zu. Mag Lily Hunde?" }
                audio: { turns: [{ en: "Lily, do you like dogs?", speaker: male }, { en: "No, I don't. I like cats.", speaker: female }] }
                options: ["Ja, Lily mag Hunde.", "Nein, Lily mag keine Hunde."]
                answer: "Nein, Lily mag keine Hunde."
                hints:
                  - "Hör auf Lilys Antwort."
                  - "Sie sagt: No, I don't."
                  - "Lily mag keine Hunde, sie mag Katzen."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Du willst wissen, ob dein Freund Pizza mag. Was fragst du?"
                say: { de: "Du willst wissen, ob dein Freund Pizza mag. Was fragst du?" }
                options: ["Do you like pizza?", "You like pizza?", "I like pizza."]
                answer: "Do you like pizza?"
                feedback:
                  "You like pizza?": "Im Englischen fängt die Frage mit „Do“ an: „Do you like pizza?“"
                hints:
                  - "Du stellst eine Frage. Welcher Satz ist eine Frage mit „Do“?"
                  - "„I like pizza“ sagt, was du selbst magst."
                  - "Do you like pizza?"
              - id: l2-f5
                type: speak
                say: { de: "Frag auf Englisch: Magst du Eis?", en: "Do you like ice cream?" }
                show: { object: ice-cream }
                expected_text: "Do you like ice cream?"
                hints:
                  - "Fang mit „Do you like“ an."
                  - "Eis heißt „ice cream“."
                  - "Sag mit mir: Do you like ice cream?"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Du magst keinen Käse. Welche Antwort passt?"
                say: { de: "Du magst keinen Käse. Hör die Frage. Welche Antwort passt?" }
                audio: { en: "Do you like cheese?", speaker: female }
                options: ["No, I don't.", "No, I not.", "Yes, I do."]
                answer: "No, I don't."
                hints: ["Du magst keinen Käse. Die Antwort fängt mit „No“ an und hat „don't“."]
              - id: l2-s2
                type: audio_choice
                text: "Was isst Tom am liebsten?"
                say: { de: "Hör zu. Was isst Tom am liebsten?" }
                audio: { turns: [{ en: "Tom, what's your favourite food?", speaker: female }, { en: "My favourite food is cake.", speaker: male }] }
                options: [{ object: pizza }, { object: cake }, { object: cheese }]
                answer: cake
                hints: ["Hör auf das Ende: My favourite food is ..."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Bau die Frage: Magst du Milch?"
                say: { de: "Bau die Frage: Magst du Milch?" }
                options: ["milk?", "you", "like", "Do"]
                slot_count: 4
                answer: ["Do", "you", "like", "milk?"]
                hints: ["Die Frage fängt mit „Do“ an."]
              - id: l2-s4
                type: fill_in_blank
                option_audio: false
                text: "Du magst Äpfel. Ergänze die Antwort."
                say: { de: "Du magst Äpfel. Ergänze die Antwort." }
                frame: "Do you like apples? Yes, I _."
                options: ["do", "like", "am"]
                answer: ["do"]
                hints: ["Die Frage hat „Do“. Die Antwort auch."]
              - id: l2-s5
                type: speak
                say: { de: "Sag auf Englisch, welches Tier du am liebsten magst. Zum Beispiel so:", en: "My favourite animal is the dog." }
                show: { object: dog }
                expected_text: "My favourite animal is the dog"
                hints: ["Fang mit „My favourite animal is“ an."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Was mag Sam nicht?"
                say: { de: "Hör zu. Was mag Sam nicht?" }
                audio: { turns: [{ en: "Sam, do you like carrots?", speaker: female }, { en: "No, I don't.", speaker: male }, { en: "Do you like apples?", speaker: female }, { en: "Yes, I do.", speaker: male }] }
                options: [{ object: carrot }, { object: apple }, { object: banana }]
                answer: carrot
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "Du willst wissen, ob deine Freundin Fische mag. Was fragst du?"
                say: { de: "Du willst wissen, ob deine Freundin Fische mag. Was fragst du?" }
                options: ["Do you like fish?", "You like fish?", "Do you fish?"]
                answer: "Do you like fish?"
              - id: l2-n3
                type: audio_choice
                text: "Du magst Erdbeeren. Welche Antwort passt?"
                say: { de: "Du magst Erdbeeren. Hör die Frage. Welche Antwort passt?" }
                audio: { en: "Do you like strawberries?", speaker: male }
                options: ["Yes, I do.", "No, I don't.", "Yes, I like."]
                answer: "Yes, I do."
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Bau den Satz: Mein Lieblingsessen ist Pizza."
                say: { de: "Bau den Satz: Mein Lieblingsessen ist Pizza." }
                options: ["pizza.", "food", "My", "is", "favourite"]
                slot_count: 5
                answer: ["My", "favourite", "food", "is", "pizza."]
              - id: l2-n5
                type: true_false
                text: "Mag Mia Bananen?"
                say: { de: "Hör zu. Mag Mia Bananen?" }
                audio: { turns: [{ en: "Mia, do you like bananas?", speaker: male }, { en: "Yes, I do.", speaker: female }] }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: likes
            type: audio_choice
            text: "Was mag das Kind?"
            say: { de: "Hör zu. Was mag das Kind?" }
            audio: { en: "I don't like milk. I like juice.", speaker: female }
            options: [{ object: milk }, { object: juice }, { object: water }]
            answer: juice
          - id: l2-c2
            part: likes
            type: ordering
            option_audio: false
            text: "Bau den Satz: Ich mag keine Frösche."
            say: { de: "Bau den Satz: Ich mag keine Frösche." }
            options: ["frogs", "I", "like", "don't"]
            slot_count: 4
            answer: ["I", "don't", "like", "frogs"]
          - id: l2-c3
            part: answer
            type: audio_choice
            text: "Du magst keine Karotten. Welche Antwort passt?"
            say: { de: "Du magst keine Karotten. Hör die Frage. Welche Antwort passt?" }
            audio: { en: "Do you like carrots?", speaker: female }
            options: ["No, I don't.", "Yes, I do.", "No, I like."]
            answer: "No, I don't."
          - id: l2-c4
            part: ask
            type: multiple_choice
            option_audio: false
            text: "Du willst wissen, ob dein Freund Hunde mag. Was fragst du?"
            say: { de: "Du willst wissen, ob dein Freund Hunde mag. Was fragst du?" }
            options: ["Do you like dogs?", "Like you dogs?", "I don't like dogs."]
            answer: "Do you like dogs?"
          - id: l2-c5
            part: favourite
            type: image_multiple_choice
            option_audio: false
            text: "„My favourite animal is the elephant.“ Welches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: elephant }, { object: giraffe }, { object: lion }]
            answer: elephant
          - id: l2-c6
            part: likes
            type: true_false
            text: "Mag Paul Schlangen?"
            say: { de: "Hör zu. Mag Paul Schlangen?" }
            audio: { en: "I'm Paul. I like frogs, but I don't like snakes.", speaker: male }
            answer: false
          - id: l2-c7
            part: likes
            type: multiple_choice
            option_audio: false
            text: "Wie sagst du auf Englisch: „Ich mag keine Äpfel“?"
            say: { de: "Wie sagst du auf Englisch: Ich mag keine Äpfel?" }
            options: ["I not like apples.", "I like apples.", "I don't like apples."]
            answer: "I don't like apples."
          - id: l2-c8
            part: likes
            type: audio_choice
            text: "Was mag Emma?"
            say: { de: "Hör zu. Was mag Emma?" }
            audio: { en: "I don't like pizza and I don't like cake. I like apples!", speaker: female }
            options: [{ object: pizza }, { object: apple }, { object: cake }]
            answer: apple
          - id: l2-c9
            part: ask
            type: fill_in_blank
            option_audio: false
            text: "Ergänze die Frage: Magst du Kuchen?"
            say: { de: "Ergänze die Frage: Magst du Kuchen?" }
            frame: "_ you like cake?"
            options: ["Are", "Do", "Can"]
            answer: ["Do"]
          - id: l2-c10
            part: ask
            type: audio_choice
            text: "Was fragt das Kind?"
            say: { de: "Hör zu. Was fragt das Kind?" }
            audio: { en: "Do you like frogs?", speaker: female }
            options: ["Hast du Frösche?", "Ich mag Frösche.", "Magst du Frösche?"]
            answer: "Magst du Frösche?"
          - id: l2-c11
            part: ask
            type: true_false
            text: "„Like you cats?“ Ist das eine richtige englische Frage?"
            say: { de: "Lies die Frage. Ist das eine richtige englische Frage?" }
            answer: false
          - id: l2-c12
            part: ask
            type: ordering
            option_audio: false
            text: "Bau die Frage: Tom, magst du Pizza?"
            say: { de: "Bau die Frage: Tom, magst du Pizza?" }
            options: ["like", "do", "pizza?", "Tom,", "you"]
            slot_count: 5
            answer: ["Tom,", "do", "you", "like", "pizza?"]
          - id: l2-c13
            part: answer
            type: fill_in_blank
            option_audio: false
            text: "Du magst keine Schlangen. Ergänze die Antwort."
            say: { de: "Du magst keine Schlangen. Ergänze die Antwort." }
