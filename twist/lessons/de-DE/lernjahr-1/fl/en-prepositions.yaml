# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-prepositions
skill: fl.grammar.prepositions
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: "Wo ist es? in, on, under, next to, behind"
  en: "Where is it? in, on, under, next to, behind"
summary: >
  Saying where something is. Lesson 1 brings in, on and under (on means
  auf, not an); lesson 2 adds next to and behind, answers Where is ...?
  with It's ..., and ends with the skill check. Children hear where things
  are and choose the German meaning, fill the gap, build the sentence and
  say it. A picture of a scene (a cat under a table) needs a scene
  component the bank does not have yet, so the tasks work with words and
  sentences.
metadata:
  year: lernjahr-1
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.questions, fl.themes.home]
  also_practises: [fl.themes.home, fl.speaking.ask-answer]
  vocabulary: { en: [in, on, under, next to, behind, "Where is ...?", "It's ..."] }
  forms: [audio, text, picture]
  drawn: []
  facets: []
  parts:
    - { id: in-on-under, what: { de: "in, on und under verstehen", en: "understanding in, on and under" } }
    - { id: next-behind, what: { de: next to und behind verstehen, en: understanding next to and behind } }
    - { id: say-where, what: { de: "auf Englisch sagen, wo etwas ist", en: saying in English where something is } }
  misconceptions:
    - id: on-an
      what: Takes on for German an because they sound alike
      addressed: lesson 1 Learn says on means auf, not an; l1-f2 gives feedback on an dem Tisch, and l2-c2 keeps am Stuhl among the options
    - id: next-without-to
      what: Says next for neben and leaves out to (next the door)
      addressed: lesson 2 Learn says next to is two words; l2-f4 gives feedback on next, and l2-n3 keeps next the lamp among the options
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "in, on, under", en: "in, on, under" }
    goal:
      de: "Sag mit in, on und under, wo etwas ist, zum Beispiel on the table."
      en: "Use in, on and under to say where something is, like on the table."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Zimmer." }
            audio: { en: "Kitchen." }
            options: [{ object: kitchen }, { object: bathroom }, { object: bedroom }]
            answer: kitchen
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Table." }
            options: [{ object: table }, { object: chair }, { object: box }]
            answer: table
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The cat is in the box."
            say: { de: "„In“ heißt in. „The cat is in the box“ heißt: Die Katze ist in der Kiste.", en: "The cat is in the box." }
            show: { objects: [cat, box] }
          - text: "The book is on the table."
            say: { de: "„On“ heißt auf, nicht an! „The book is on the table“ heißt: Das Buch ist auf dem Tisch.", en: "The book is on the table." }
            show: { objects: [book, table] }
          - text: "The ball is under the chair."
            say: { de: "„Under“ heißt unter. „The ball is under the chair“ heißt: Der Ball ist unter dem Stuhl.", en: "The ball is under the chair." }
            show: { objects: [ball, chair] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Wo ist die Katze?"
                say: { de: "Hör zu. Wo ist die Katze?" }
                audio: { en: "The cat is in the box." }
                options: ["in der Kiste", "auf der Kiste", "unter der Kiste"]
                answer: "in der Kiste"
                hints:
                  - "Hör auf das kleine Wort vor „the box“."
                  - "The cat is in the box."
                  - "„In“ heißt in."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Wo ist das Buch?"
                say: { de: "Hör zu. Wo ist das Buch?" }
                audio: { en: "The book is on the table." }
                options: ["auf dem Tisch", "an dem Tisch", "unter dem Tisch"]
                answer: "auf dem Tisch"
                feedback:
                  "an dem Tisch": "„On“ klingt wie an, heißt aber auf."
                hints:
                  - "Hör auf das kleine Wort vor „the table“."
                  - "The book is on the table."
                  - "„On“ heißt auf."
              - id: l1-f3
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Was heißt das auf Deutsch? Tippe auf ein englisches Wort und dann auf das deutsche." }
                pairs:
                  - left: { text: "in" }
                    right: { text: "in" }
                  - left: { text: "on" }
                    right: { text: "auf" }
                  - left: { text: "under" }
                    right: { text: "unter" }
                hints:
                  - "„Under“ und unter klingen fast gleich."
                  - "„In“ heißt auch auf Deutsch in."
                  - "„On“ heißt auf."
              - id: l1-f4
                type: fill_in_blank
                option_audio: false
                text: "Der Ball ist unter dem Stuhl. Ergänze den Satz."
                say: { de: "Der Ball ist unter dem Stuhl. Ergänze den Satz." }
                frame: "The ball is _ the chair."
                options: ["under", "on", "in"]
                answer: ["under"]
                hints:
                  - "Wo ist der Ball? Unter dem Stuhl."
                  - "Unter klingt auf Englisch fast gleich: „under“."
                  - "The ball is under the chair."
              - id: l1-f5
                type: speak
                text: "Sag auf Englisch: Die Katze ist auf dem Bett."
                say: { de: "Sag auf Englisch: Die Katze ist auf dem Bett.", en: "The cat is on the bed." }
                show: { object: cat }
                expected_text: "The cat is on the bed."
                hints:
                  - "Fang mit „The cat is“ an."
                  - "Auf heißt „on“."
                  - "Sag mit mir: The cat is on the bed."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Wo ist der Bleistift?"
                say: { de: "Hör zu. Wo ist der Bleistift?" }
                audio: { turns: [{ en: "Where's my pencil?", speaker: male }, { en: "It's under the book.", speaker: female }] }
                options: ["unter dem Buch", "im Buch", "auf dem Buch"]
                answer: "unter dem Buch"
                hints: ["Hör auf das Wort vor „the book“."]
              - id: l1-s2
                type: fill_in_blank
                option_audio: false
                text: "Der Apfel ist in der Tasche. Ergänze den Satz."
                say: { de: "Der Apfel ist in der Tasche. Ergänze den Satz." }
                frame: "The apple is _ the bag."
                options: ["in", "on", "under"]
                answer: ["in"]
                hints: ["„In“ heißt auf Englisch auch in."]
              - id: l1-s3
                type: true_false
                text: "The dog is on the bed.\n\nHeißt das: Der Hund ist auf dem Bett?"
                say: { de: "Lies den Satz. Heißt das: Der Hund ist auf dem Bett?" }
                answer: true
                hints: ["„On“ heißt auf."]
              - id: l1-s4
                type: ordering
                option_audio: false
                text: "Bau den Satz: Die Maus ist unter dem Tisch."
                say: { de: "Bau den Satz: Die Maus ist unter dem Tisch." }
                options: ["under", "The mouse", "the table.", "is"]
                slot_count: 4
                answer: ["The mouse", "is", "under", "the table."]
                hints: ["Der Satz fängt mit „The mouse is“ an."]
              - id: l1-s5
                type: speak
                text: "Sag auf Englisch: Der Ball ist in der Kiste."
                say: { de: "Sag auf Englisch: Der Ball ist in der Kiste.", en: "The ball is in the box." }
                show: { object: ball }
                expected_text: "The ball is in the box."
                hints: ["Sag mit mir: The ball is in the box."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Wo sind die Schuhe?"
                say: { de: "Hör zu. Wo sind die Schuhe?" }
                audio: { en: "The shoes are under the bed." }
                options: ["unter dem Bett", "auf dem Bett", "im Bett"]
                answer: "unter dem Bett"
              - id: l1-n2
                type: fill_in_blank
                option_audio: false
                text: "Die Tasse ist auf dem Tisch. Ergänze den Satz."
                say: { de: "Die Tasse ist auf dem Tisch. Ergänze den Satz." }
                frame: "The cup is _ the table."
                options: ["on", "in", "under"]
                answer: ["on"]
              - id: l1-n3
                type: true_false
                text: "The cat is in the box.\n\nHeißt das: Die Katze ist auf der Kiste?"
                say: { de: "Lies den Satz. Heißt das: Die Katze ist auf der Kiste?" }
                answer: false
              - id: l1-n4
                type: ordering
                option_audio: false
                text: "Bau den Satz: Das Buch ist auf dem Stuhl."
                say: { de: "Bau den Satz: Das Buch ist auf dem Stuhl." }
                options: ["on", "is", "The book", "the chair."]
                slot_count: 4
                answer: ["The book", "is", "on", "the chair."]
              - id: l1-n5
                type: multiple_choice
                option_audio: false
                text: "Wie sagst du: Der Frosch ist im Wasser?"
                say: { de: "Wie sagst du auf Englisch: Der Frosch ist im Wasser?" }
                options: ["The frog is in the water.", "The frog is on the water.", "The frog is under the water."]
                answer: "The frog is in the water."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Wo ist der Ball?"
            say: { de: "Hör zu. Wo ist der Ball?" }
            audio: { en: "The ball is on the box." }
            options: ["auf der Kiste", "in der Kiste", "unter der Kiste"]
            answer: "auf der Kiste"
          - id: l1-c2
            type: fill_in_blank
            option_audio: false
            text: "Die Katze ist unter dem Stuhl. Ergänze den Satz."
            say: { de: "Die Katze ist unter dem Stuhl. Ergänze den Satz." }
            frame: "The cat is _ the chair."
            options: ["under", "on", "in"]
            answer: ["under"]
          - id: l1-c3
            type: true_false
            text: "The pencil is in the pencil case.\n\nHeißt das: Der Bleistift ist im Mäppchen?"
            say: { de: "Lies den Satz. Heißt das: Der Bleistift ist im Mäppchen?" }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Wo ist die Katze?"
            say: { de: "Hör zu. Wo ist die Katze?" }
            audio: { en: "The cat is under the table." }
            options: ["auf dem Tisch", "unter dem Tisch", "am Tisch"]
            answer: "unter dem Tisch"
          - id: l1-c5
            type: multiple_choice
            option_audio: false
            text: "Was heißt „on“ auf Deutsch?"
            say: { de: "Was heißt dieses Wort auf Deutsch?", en: "on" }
            options: ["an", "auf", "unter"]
            answer: "auf"
          - id: l1-c6
            type: multiple_choice
            option_audio: false
            text: "Wie sagst du auf Englisch: Die Maus ist auf dem Bett?"
            say: { de: "Wie sagst du auf Englisch: Die Maus ist auf dem Bett?" }
            options: ["The mouse is in the bed.", "The mouse is under the bed.", "The mouse is on the bed."]
            answer: "The mouse is on the bed."

  - n: 2
    title: { de: "next to und behind", en: "next to and behind" }
    goal:
      de: "Sag, was neben oder hinter etwas ist, und antworte so wie It's next to the dog."
      en: "Say what is next to or behind something, and answer like It's next to the dog."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Wo ist das Buch?"
            say: { de: "Hör zu. Wo ist das Buch?" }
            audio: { en: "The book is under the bed." }
            options: ["unter dem Bett", "auf dem Bett", "im Bett"]
            answer: "unter dem Bett"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            option_audio: false
            text: "Der Hund ist im Garten. Ergänze den Satz."
            say: { de: "Der Hund ist im Garten. Ergänze den Satz." }
            frame: "The dog is _ the garden."
            options: ["in", "on", "under"]
            answer: ["in"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "The cat is next to the dog."
            say: { de: "„Next to“ heißt neben. Das sind zwei Wörter: „next to“. „The cat is next to the dog“ heißt: Die Katze ist neben dem Hund.", en: "The cat is next to the dog." }
            show: { objects: [cat, dog] }
          - text: "The ball is behind the tree."
            say: { de: "„Behind“ heißt hinter. „The ball is behind the tree“ heißt: Der Ball ist hinter dem Baum.", en: "The ball is behind the tree." }
            show: { objects: [ball, tree] }
          - text: "Where is the cat? It's next to the dog."
            say: { de: "Auf die Frage „Where is …?“ antwortest du mit „It's“ und dem Ort.", en: "Where is the cat? It's next to the dog." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Wo ist Bens Tasche?"
                say: { de: "Ben sucht seine Sachen. Hör zu. Wo ist Bens Tasche?" }
                audio: { turns: [{ en: "Ben, where's your bag?", speaker: female }, { en: "It's next to the bed.", speaker: male }] }
                options: ["neben dem Bett", "hinter dem Bett", "unter dem Bett"]
                answer: "neben dem Bett"
                hints:
                  - "Hör auf die Wörter vor „the bed“."
                  - "It's next to the bed."
                  - "„Next to“ heißt neben."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Wo ist die Katze?"
                say: { de: "Hör zu. Wo ist die Katze?" }
                audio: { en: "Where's the cat? It's behind the sofa." }
                options: ["hinter dem Sofa", "neben dem Sofa", "auf dem Sofa"]
                answer: "hinter dem Sofa"
                hints:
                  - "Hör auf das Wort vor „the sofa“."
                  - "It's behind the sofa."
                  - "„Behind“ heißt hinter."
              - id: l2-f3
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Was heißt das auf Deutsch? Tippe auf ein englisches Wort und dann auf das deutsche." }
                pairs:
                  - left: { text: "next to" }
                    right: { text: "neben" }
                  - left: { text: "behind" }
                    right: { text: "hinter" }
                  - left: { text: "under" }
                    right: { text: "unter" }
                  - left: { text: "on" }
                    right: { text: "auf" }
                hints:
                  - "Fang mit den Wörtern an, die du sicher kennst: „under“ und „on“."
                  - "„Next to“ sind zwei Wörter für ein deutsches Wort."
                  - "„Next to“ heißt neben, „behind“ heißt hinter."
              - id: l2-f4
                type: fill_in_blank
                option_audio: false
                text: "Der Hund ist neben der Tür. Ergänze den Satz."
                say: { de: "Der Hund ist neben der Tür. Ergänze den Satz." }
                show: { objects: [dog, door] }
                frame: "The dog is _ the door."
                options: ["next to", "next", "behind"]
                answer: ["next to"]
                feedback:
                  "next": "Für neben brauchst du im Englischen zwei Wörter: „next to“."
                hints:
                  - "Der Hund ist neben der Tür."
                  - "Neben heißt „next to“."
                  - "The dog is next to the door."
              - id: l2-f5
                type: speak
                text: "Sag auf Englisch: Der Ball ist hinter dem Baum."
                say: { de: "Sag auf Englisch: Der Ball ist hinter dem Baum.", en: "The ball is behind the tree." }
                show: { objects: [ball, tree] }
                expected_text: "The ball is behind the tree."
                hints:
                  - "Fang mit „The ball is“ an."
                  - "Hinter heißt „behind“."
                  - "Sag mit mir: The ball is behind the tree."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Wo sind die Schuhe?"
                say: { de: "Hör zu. Wo sind die Schuhe?" }
                audio: { turns: [{ en: "Where are my shoes?", speaker: female }, { en: "They're behind the door.", speaker: male }] }
                options: ["hinter der Tür", "neben der Tür", "an der Tür"]
                answer: "hinter der Tür"
                hints: ["Hör auf das Wort vor „the door“."]
              - id: l2-s2
                type: fill_in_blank
                option_audio: false
                text: "Die Lampe ist neben dem Bett. Ergänze den Satz."
                say: { de: "Die Lampe ist neben dem Bett. Ergänze den Satz." }
                frame: "The lamp is _ the bed."
                options: ["next to", "on", "behind"]
                answer: ["next to"]
                hints: ["Neben heißt „next to“."]
              - id: l2-s3
                type: multiple_choice
                option_audio: false
                text: "Ben fragt: „Where's my ball?“ Sag ihm: Er ist unter dem Stuhl."
                say: { de: "Ben fragt: Where's my ball? Sag ihm: Er ist unter dem Stuhl. Welche Antwort passt?" }
                options: ["It's under the chair.", "It's on the chair.", "It's behind the chair."]
                answer: "It's under the chair."
                hints: ["Unter heißt „under“."]
              - id: l2-s4
                type: ordering
                option_audio: false
                text: "Bau den Satz: Die Katze ist hinter dem Baum."
                say: { de: "Bau den Satz: Die Katze ist hinter dem Baum." }
                options: ["behind", "is", "the tree.", "The cat"]
                slot_count: 4
                answer: ["The cat", "is", "behind", "the tree."]
                hints: ["Der Satz fängt mit „The cat is“ an."]
              - id: l2-s5
                type: true_false
                text: "The bag is next to the chair.\n\nHeißt das: Die Tasche ist hinter dem Stuhl?"
                say: { de: "Lies den Satz. Heißt das: Die Tasche ist hinter dem Stuhl?" }
                answer: false
                hints: ["„Next to“ heißt neben."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Wo ist das Buch?"
                say: { de: "Hör zu. Wo ist das Buch?" }
                audio: { turns: [{ en: "Mum, where's my book?", speaker: male }, { en: "It's on your bed.", speaker: female }] }
                options: ["auf dem Bett", "im Bett", "neben dem Bett"]
                answer: "auf dem Bett"
              - id: l2-n2
                type: fill_in_blank
                option_audio: false
                text: "Das Fahrrad ist hinter dem Haus. Ergänze den Satz."
                say: { de: "Das Fahrrad ist hinter dem Haus. Ergänze den Satz." }
                frame: "The bike is _ the house."
                options: ["behind", "next to", "in"]
                answer: ["behind"]
              - id: l2-n3
                type: multiple_choice
                option_audio: false
                text: "Wie sagst du: Die Uhr ist neben der Lampe?"
                say: { de: "Wie sagst du auf Englisch: Die Uhr ist neben der Lampe?" }
                options: ["The clock is next to the lamp.", "The clock is behind the lamp.", "The clock is next the lamp."]
                answer: "The clock is next to the lamp."
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Bau den Satz: Der Hund ist neben dem Jungen."
                say: { de: "Bau den Satz: Der Hund ist neben dem Jungen." }
                options: ["next to", "The dog", "the boy.", "is"]
                slot_count: 4
                answer: ["The dog", "is", "next to", "the boy."]
              - id: l2-n5
                type: true_false
                text: "The car is behind the house.\n\nHeißt das: Das Auto ist hinter dem Haus?"
                say: { de: "Lies den Satz. Heißt das: Das Auto ist hinter dem Haus?" }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: in-on-under
            type: audio_choice
            text: "Wo ist die Maus?"
            say: { de: "Hör zu. Wo ist die Maus?" }
            audio: { en: "Where's the mouse? It's under the bed." }
            options: ["unter dem Bett", "neben dem Bett", "auf dem Bett"]
            answer: "unter dem Bett"
          - id: l2-c2
            part: in-on-under
            type: audio_choice
            text: "Wo ist die Jacke?"
            say: { de: "Hör zu. Wo ist die Jacke?" }
            audio: { turns: [{ en: "Where's my jacket?", speaker: female }, { en: "It's on the chair.", speaker: male }] }
            options: ["auf dem Stuhl", "am Stuhl", "hinter dem Stuhl"]
            answer: "auf dem Stuhl"
          - id: l2-c3
            part: next-behind
            type: fill_in_blank
            option_audio: false
            text: "Der Ball ist neben der Kiste. Ergänze den Satz."
            say: { de: "Der Ball ist neben der Kiste. Ergänze den Satz." }
            frame: "The ball is _ the box."
            options: ["next to", "behind", "in"]
            answer: ["next to"]
          - id: l2-c4
            part: say-where
            type: ordering
            option_audio: false
            text: "Bau den Satz: Die Katze ist hinter der Tür."
            say: { de: "Bau den Satz: Die Katze ist hinter der Tür." }
            options: ["The cat", "next to", "behind", "is", "the door."]
            slot_count: 4
            answer: ["The cat", "is", "behind", "the door."]
          - id: l2-c5
            part: say-where
            type: multiple_choice
            option_audio: false
            text: "Wie sagst du: Der Apfel ist in der Schultasche?"
            say: { de: "Wie sagst du auf Englisch: Der Apfel ist in der Schultasche?" }
            options: ["The apple is in the school bag.", "The apple is on the school bag.", "The apple is next to the school bag."]
            answer: "The apple is in the school bag."
          - id: l2-c6
            part: in-on-under
            type: audio_choice
            text: "Wo ist das Buch?"
            say: { de: "Hör zu. Wo ist das Buch?" }
            audio: { turns: [{ en: "Where's my book?", speaker: female }, { en: "It's in the bag.", speaker: male }] }
            options: ["auf der Tasche", "unter der Tasche", "in der Tasche"]
            answer: "in der Tasche"
          - id: l2-c7
            part: in-on-under
            type: matching
            option_audio: false
            text: "Was passt zusammen?"
            say: { de: "Was heißt das auf Deutsch? Tippe auf einen englischen Satz und dann auf den deutschen." }
            pairs:
              - left: { text: "The book is in the bag." }
                right: { text: "Das Buch ist in der Tasche." }
              - left: { text: "The book is on the bag." }
                right: { text: "Das Buch ist auf der Tasche." }
              - left: { text: "The book is under the bag." }
                right: { text: "Das Buch ist unter der Tasche." }
          - id: l2-c8
            part: in-on-under
            type: multiple_choice
            option_audio: false
            text: "The dog is under the table.\n\nWo ist der Hund?"
            say: { de: "Lies den Satz. Wo ist der Hund?" }
            options: ["auf dem Tisch", "unter dem Tisch", "neben dem Tisch"]
            answer: "unter dem Tisch"
          - id: l2-c9
            part: in-on-under
            type: audio_choice
