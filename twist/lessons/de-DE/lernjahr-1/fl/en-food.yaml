# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-food
skill: fl.themes.food
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Essen und Trinken auf Englisch
  en: Food and drink in English
summary: >
  Food and drink words, saying what you like and do not like, and asking
  politely for something. Lesson 1 brings bread, cheese, pizza and ice
  cream with "I like …" and "I don't like …"; lesson 2 adds milk, juice
  and water, "Can I have …, please?" and "Do you like …? Yes, I do. / No,
  I don't.", and ends with the skill check. Instructions are in German;
  the English is spoken and shown in short form.
metadata:
  year: lernjahr-1
  topic: { de: Essen und Trinken, en: Food and drink }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks, fl.listening.familiar-words]
  also_practises: [fl.grammar.chunks, fl.speaking.imitate]
  vocabulary: { en: [bread, cheese, pizza, ice cream, milk, juice, water, "I like …", "I don't like …", "Can I have …, please?", "Do you like …?", "Yes, I do.", "No, I don't."] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: not-like
      what: Says "I not like" after the German "ich mag nicht"
      addressed: lesson 1 Learn models "I don't like"; the "Wie sagst du auf Englisch" tasks in every stage of lesson 1 offer "I not like …", with feedback in l1-f3
    - id: yes-i-like
      what: Answers "Do you like …?" with "Yes, I like." instead of "Yes, I do."
      addressed: lesson 2 Learn models the short answers; every stage of lesson 2 has a short-answer task with a wrong form among the options, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "I like pizza", en: "I like pizza" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "A banana." }
            options: [{ object: banana }, { object: apple }, { object: carrot }]
            answer: banana
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Ich mag Fußball."
            say: "Wie sagst du auf Englisch: Ich mag Fußball?"
            options: ["I like football.", "I can football.", "I am football."]
            answer: "I like football."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Heute geht es ums Essen. Hör zu und sprich nach.", en: "Bread." }
            show: { object: bread }
          - say: { en: "Cheese." }
            show: { object: cheese }
          - say: { en: "Pizza." }
            show: { object: pizza }
          - say: { en: "Ice cream." }
            show: { object: ice-cream }
          - text: "I like pizza. I don't like cheese."
            say: { de: "So sagst du, was du magst und was du nicht magst:", en: "I like pizza. I don't like cheese." }
            show: { objects: [pizza, cheese] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Cheese." }
                options: [{ object: cheese }, { object: bread }, { object: egg }]
                answer: cheese
                hints:
                  - "Hör noch einmal: cheese."
                  - "„Cheese“ ist gelb und hat Löcher."
                  - "Tippe auf den Käse."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Was mag das Kind?" }
                audio: { en: "I like carrots." }
                options: [{ object: carrot }, { object: cake }, { object: banana }]
                answer: carrot
                hints:
                  - "Hör auf das Wort nach „I like“."
                  - "„Carrots“ sind Karotten."
                  - "Tippe auf die Karotte."
              - id: l1-f3
                type: multiple_choice
                text: "Ich mag keinen Käse."
                say: "Wie sagst du auf Englisch: Ich mag keinen Käse?"
                options: ["I don't like cheese.", "I like cheese.", "I not like cheese."]
                answer: "I don't like cheese."
                option_audio: false
                feedback:
                  "I not like cheese.": "Im Englischen sagst du nicht „I not like“, sondern „I don't like“: I don't like cheese."
                hints:
                  - "Hier magst du etwas nicht. Welcher Satz sagt das?"
                  - "Vor „like“ kommt „don't“."
                  - "Tippe auf „I don't like cheese.“"
              - id: l1-f4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Ice cream." }
                show: { object: ice-cream }
                expected_text: ice cream
                hints:
                  - "Hör noch einmal zu: ice cream."
                  - "Zwei Wörter: „ice“ klingt wie Eis, danach kommt „cream“."
                  - "Sag mit mir: ice cream."
              - id: l1-f5
                type: audio_choice
                say: { de: "Hör zu. Mag das Kind Eier?" }
                audio: { en: "I don't like eggs." }
                options: ["Ja, es mag Eier.", "Nein, es mag keine Eier."]
                answer: "Nein, es mag keine Eier."
                option_audio: false
                hints:
                  - "Hör noch einmal genau hin."
                  - "Hörst du „don't“?"
                  - "„I don't like eggs“ heißt: Ich mag keine Eier. Tippe auf Nein."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Bread." }
                options: [{ object: cake }, { object: bread }, { object: pie }]
                answer: bread
                hints: ["Hör noch einmal hin. Das Wort klingt ähnlich wie ein deutsches Wort."]
              - id: l1-s2
                type: audio_choice
                say: { de: "Hör zu. Was mag das Kind?" }
                audio: { en: "I like strawberries." }
                options: [{ object: apple }, { object: orange }, { object: strawberry }]
                answer: strawberry
                hints: ["Hör auf das Wort nach „I like“."]
              - id: l1-s3
                type: multiple_choice
                text: "Ich mag Pizza."
                say: "Wie sagst du auf Englisch: Ich mag Pizza?"
                options: ["I don't like pizza.", "I like pizza.", "I not like pizza."]
                answer: "I like pizza."
                option_audio: false
                hints: ["Hier magst du Pizza. Brauchst du dann „don't“?"]
              - id: l1-s4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Pizza." }
                show: { object: pizza }
                expected_text: pizza
                hints: ["Hör noch einmal: pizza. Es klingt fast wie auf Deutsch."]
              - id: l1-s5
                type: audio_choice
                say: { de: "Hör zu. Mag das Kind Äpfel?" }
                audio: { en: "I don't like apples." }
                options: ["Ja, es mag Äpfel.", "Nein, es mag keine Äpfel."]
                answer: "Nein, es mag keine Äpfel."
                option_audio: false
                hints: ["Hör genau hin: Kommt „don't“ vor?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Ice cream." }
                options: [{ object: cake }, { object: ice-cream }, { object: pizza }]
                answer: ice-cream
              - id: l1-n2
                type: audio_choice
                say: { de: "Hör zu. Was mag das Kind?" }
                audio: { en: "I like cake." }
                options: [{ object: pizza }, { object: carrot }, { object: cake }]
                answer: cake
              - id: l1-n3
                type: multiple_choice
                text: "Ich mag keine Bananen."
                say: "Wie sagst du auf Englisch: Ich mag keine Bananen?"
                options: ["I not like bananas.", "I don't like bananas.", "I like bananas."]
                answer: "I don't like bananas."
                option_audio: false
              - id: l1-n4
                type: speak
                say: { de: "Was ist das? Sag es auf Englisch." }
                show: { object: cheese }
                expected_text: cheese
              - id: l1-n5
                type: audio_choice
                say: { de: "Hör zu. Mag das Kind Orangen?" }
                audio: { en: "I like oranges." }
                options: ["Ja, es mag Orangen.", "Nein, es mag keine Orangen."]
                answer: "Ja, es mag Orangen."
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "Pizza." }
            options: [{ object: pie }, { object: pizza }, { object: cake }]
            answer: pizza
          - id: l1-c2
            type: audio_choice
            say: { de: "Hör zu. Was mag das Kind?" }
            audio: { en: "I like apples." }
            options: [{ object: egg }, { object: bread }, { object: apple }]
            answer: apple
          - id: l1-c3
            type: multiple_choice
            text: "Ich mag keine Karotten."
            say: "Wie sagst du auf Englisch: Ich mag keine Karotten?"
            options: ["I don't like carrots.", "I not like carrots.", "I like carrots."]
            answer: "I don't like carrots."
            option_audio: false

  - n: 2
    title: { de: "Can I have some juice, please?", en: "Can I have some juice, please?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Ice cream." }
            options: [{ object: ice-cream }, { object: cheese }, { object: bread }]
            answer: ice-cream
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ich mag kein Brot."
            say: "Wie sagst du auf Englisch: Ich mag kein Brot?"
            options: ["I don't like bread.", "I like bread.", "I not like bread."]
            answer: "I don't like bread."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Jetzt kommen die Getränke. Hör zu und sprich nach.", en: "Milk." }
            show: { object: milk }
          - say: { en: "Juice." }
            show: { object: juice }
          - say: { en: "Water." }
            show: { object: water }
          - text: "Can I have some milk, please?"
            say: { de: "So bittest du höflich um etwas:", en: "Can I have some milk, please? Here you are. Thank you!" }
            show: { object: milk }
          - text: "Do you like pizza? Yes, I do. / No, I don't."
            say: { de: "So fragst du, ob jemand etwas mag, und so antwortest du:", en: "Do you like pizza? Yes, I do. Do you like cheese? No, I don't." }
            show: { objects: [pizza, cheese] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Water." }
                options: [{ object: milk }, { object: water }, { object: juice }]
                answer: water
                hints:
                  - "Hör noch einmal: water."
                  - "„Water“ klingt fast wie Wasser."
                  - "Tippe auf das Wasser."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { de: "Hör zu. Was möchte das Kind?" }
                audio: { en: "Can I have an orange juice, please?" }
                options: [{ object: milk }, { object: juice }, { object: water }]
                answer: juice
                hints:
                  - "Hör auf das Wort vor „please“."
                  - "„Juice“ ist Saft."
                  - "Tippe auf den Orangensaft."
              - id: l2-f3
                type: multiple_choice
                text: "„Do you like milk?“ Du magst Milch. Was antwortest du?"
                say: { de: "Du magst Milch. Was antwortest du auf diese Frage?", en: "Do you like milk?" }
                options: ["Yes, I do.", "Yes, I like.", "No, I don't."]
                answer: "Yes, I do."
                option_audio: false
                feedback:
                  "Yes, I like.": "Auf „Do you like …?“ antwortest du kurz mit „do“: Yes, I do."
                hints:
                  - "Du magst Milch, also „Yes“."
                  - "Die Frage beginnt mit „Do“, die Antwort endet mit „do“."
                  - "Tippe auf „Yes, I do.“"
              - id: l2-f4
                type: speak
                say: { de: "Du möchtest Wasser. Frag höflich auf Englisch.", en: "Can I have some water, please?" }
                show: { object: water }
                expected_text: "Can I have some water, please?"
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „Can I have some“, dann „water“ und am Ende „please“."
                  - "Sag mit mir: Can I have some water, please?"
              - id: l2-f5
                type: ordering
                text: "Bau den Satz: Kann ich bitte eine Pizza haben?"
                say: "Bau den Satz: Kann ich bitte eine Pizza haben?"
                options: ["have", "Can", "a pizza, please?", "I"]
                slot_count: 4
                answer: ["Can", "I", "have", "a pizza, please?"]
                option_audio: false
                hints:
                  - "Die Frage fängt mit „Can“ an."
                  - "Dann kommt „I have“."
                  - "Can I have a pizza, please?"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Milk." }
                options: [{ object: juice }, { object: water }, { object: milk }]
                answer: milk
                hints: ["Hör noch einmal hin. Klingt es wie ein deutsches Wort?"]
              - id: l2-s2
                type: audio_choice
                say: { de: "Hör zu. Was möchte das Kind?" }
                audio: { en: "Can I have an ice cream, please?" }
                options: [{ object: cake }, { object: ice-cream }, { object: cheese }]
                answer: ice-cream
                hints: ["Hör auf das Wort vor „please“."]
              - id: l2-s3
                type: multiple_choice
                text: "„Do you like cheese?“ Du magst keinen Käse. Was antwortest du?"
                say: { de: "Du magst keinen Käse. Was antwortest du auf diese Frage?", en: "Do you like cheese?" }
                options: ["No, I not.", "No, I don't.", "Yes, I do."]
                answer: "No, I don't."
                option_audio: false
                hints: ["Du magst keinen Käse. Also fängt die Antwort mit „No“ an."]
              - id: l2-s4
                type: speak
                say: { de: "Du möchtest Saft. Frag höflich auf Englisch.", en: "Can I have some juice, please?" }
                show: { object: juice }
                expected_text: "Can I have some juice, please?"
                hints: ["Fang mit „Can I have“ an. Am Ende kommt „please“."]
              - id: l2-s5
                type: ordering
                text: "Bau den Satz: Ich mag keine Milch."
                say: "Bau den Satz: Ich mag keine Milch."
                options: ["like", "I", "milk.", "don't"]
                slot_count: 4
                answer: ["I", "don't", "like", "milk."]
                option_audio: false
                hints: ["Überleg: Wo steht „don't“ im Satz?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Juice." }
                options: [{ object: water }, { object: juice }, { object: milk }]
                answer: juice
              - id: l2-n2
                type: audio_choice
                say: { de: "Hör zu. Was möchte das Kind?" }
                audio: { en: "Can I have some bread, please?" }
                options: [{ object: pie }, { object: egg }, { object: bread }]
                answer: bread
              - id: l2-n3
                type: multiple_choice
                text: "„Do you like ice cream?“ Du magst Eis. Was antwortest du?"
                say: { de: "Du magst Eis. Was antwortest du auf diese Frage?", en: "Do you like ice cream?" }
                options: ["Yes, I am.", "No, I don't.", "Yes, I do."]
                answer: "Yes, I do."
                option_audio: false
              - id: l2-n4
                type: speak
                say: { de: "Du möchtest Milch. Frag höflich auf Englisch." }
                show: { object: milk }
                expected_text: "Can I have some milk, please?"
              - id: l2-n5
                type: ordering
                text: "Bau den Satz: Magst du Pizza?"
                say: "Bau den Satz: Magst du Pizza?"
                options: ["you", "Do", "pizza?", "like"]
                slot_count: 4
                answer: ["Do", "you", "like", "pizza?"]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Was möchte das Kind trinken?" }
            audio: { en: "Some water, please." }
            options: [{ object: juice }, { object: milk }, { object: water }]
            answer: water
          - id: l2-c2
            type: audio_choice
            say: { de: "Hör zu. Was möchte das Kind?" }
            audio: { en: "Can I have some cheese, please?" }
            options: [{ object: pizza }, { object: cake }, { object: cheese }]
            answer: cheese
          - id: l2-c3
            type: multiple_choice
            text: "„Do you like juice?“ Du magst keinen Saft. Was antwortest du?"
            say: { de: "Du magst keinen Saft. Was antwortest du auf diese Frage?", en: "Do you like juice?" }
            options: ["Yes, I do.", "No, I don't.", "No, I like."]
            answer: "No, I don't."
            option_audio: false
          - id: l2-c4
            type: audio_choice
            say: { de: "Hör zu. Mag das Kind Käse?" }
            audio: { en: "I don't like cheese." }
            options: ["Ja, es mag Käse.", "Nein, es mag keinen Käse."]
            answer: "Nein, es mag keinen Käse."
            option_audio: false
          - id: l2-c5
            type: ordering
            text: "Bau den Satz: Ich mag Erdbeeren."
            say: "Bau den Satz: Ich mag Erdbeeren."
            options: ["strawberries.", "I", "like"]
            slot_count: 3
            answer: ["I", "like", "strawberries."]
            option_audio: false
