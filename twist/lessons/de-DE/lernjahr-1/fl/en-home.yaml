# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-home
skill: fl.themes.home
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Zu Hause
  en: At home
summary: >
  Rooms and furniture. Lesson 1 learns the furniture and things in a house
  by ear and picture (bed, table, chair, lamp, mirror, clock, telephone,
  oven); lesson 2 learns the rooms (kitchen, bathroom, bedroom, living
  room, garden), says which room something is in (The oven is in the
  kitchen.), and ends with the skill check. The rooms and the garden are
  shown as pictures. Speaking tasks are practice only.
metadata:
  year: lernjahr-1
  topic: { de: Zu Hause, en: At home }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.familiar-words]
  also_practises: [fl.grammar.questions, fl.speaking.name-things]
  vocabulary: { en: [house, bed, table, chair, lamp, mirror, clock, telephone, oven, kitchen, bathroom, bedroom, living room, garden] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: things, what: { de: Möbel und Dinge im Haus verstehen und benennen, en: understanding and naming furniture and things at home } }
    - { id: rooms, what: { de: die Zimmer verstehen und benennen, en: understanding and naming the rooms } }
    - { id: where, what: { de: "sagen und verstehen, in welchem Zimmer etwas ist", en: saying and understanding which room something is in } }
  misconceptions:
    - id: bedroom-bathroom
      what: Mixes up bedroom and bathroom because they sound alike
      addressed: lesson 2 Learn sets bedroom (bed) against bathroom (bath); l2-f2 gives feedback when the bed is put in the bathroom, and l2-c1 asks for bedroom with the bathroom picture among the options
    - id: chair-table
      what: Mixes up chair and table
      addressed: l1-f2 gives feedback when table is tapped for chair; chair and table appear together in lesson 1 tasks
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Möbel und Sachen im Haus", en: "Furniture and things at home" }
    goal:
      de: "Hör zu und finde die Sachen im Haus, zum Beispiel bed, lamp oder clock."
      en: "Listen and find the things in a house, like bed, lamp or clock."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "House." }
            options: [{ object: house }, { object: mouse }, { object: car }]
            answer: house
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Telephone." }
            options: [{ object: shoe }, { object: telephone }, { object: boat }]
            answer: telephone
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Was glaubst du: Heißt das Bett auf Englisch ganz anders, oder klingt es fast wie Bett?" }
            show: { object: bed }
          - say: { de: "Fast wie Bett: bed! Das sind Möbel im Haus. Hör zu:", en: "Bed. Table. Chair." }
            show: { object: bed }
          - say: { de: "Noch mehr Sachen im Haus:", en: "Lamp. Mirror. Clock." }
            show: { object: lamp }
          - say: { de: "Und das hier: das Telefon und der Ofen in der Küche.", en: "Telephone. Oven." }
            show: { object: oven }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Table." }
                options: [{ object: table }, { object: chair }, { object: bed }]
                answer: table
                hints:
                  - "Hör noch einmal: „table“."
                  - "Daran sitzt ihr beim Essen."
                  - "„Table“ ist der Tisch."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Chair." }
                options: [{ object: chair }, { object: table }, { object: lamp }]
                answer: chair
                feedback:
                  table: "Das ist der Tisch, „table“. „Chair“ ist der Stuhl, darauf sitzt du."
                hints:
                  - "Hör noch einmal: „chair“."
                  - "Darauf sitzt du."
                  - "„Chair“ ist der Stuhl."
              - id: l1-f3
                type: true_false
                text: "Passt das Bild zum Wort?"
                say: { de: "Hör zu. Passt das Bild?", en: "Mirror." }
                show: { object: mirror }
                answer: true
                hints:
                  - "Hör noch einmal: „mirror“."
                  - "Darin siehst du dich selbst."
                  - "Ja, „mirror“ ist der Spiegel."
              - id: l1-f4
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Lamp." }
                options: [{ object: lamp }, { object: clock }, { object: mirror }]
                answer: lamp
                hints:
                  - "Das Wort klingt fast wie im Deutschen."
                  - "„Lamp“ ist die Lampe."
                  - "Tippe auf die Lampe."
              - id: l1-f5
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Bed." }
                show: { object: bed }
                expected_text: "bed"
                hints:
                  - "Hör noch einmal: „bed“."
                  - "Es klingt fast wie Bett."
                  - "Sag mit mir: „bed“."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Oven." }
                options: [{ object: oven }, { object: telephone }, { object: table }]
                answer: oven
                hints: ["„Oven“ ist der Ofen in der Küche."]
              - id: l1-s2
                type: true_false
                text: "Passt das Bild zum Wort?"
                say: { de: "Hör zu. Passt das Bild?", en: "Clock." }
                show: { object: telephone }
                answer: false
                hints: ["„Clock“ ist die Uhr."]
              - id: l1-s3
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Lies die Wörter. Tippe auf ein Wort und dann auf das Bild." }
                pairs:
                  - left: { text: "bed" }
                    right: { object: bed }
                  - left: { text: "chair" }
                    right: { object: chair }
                  - left: { text: "lamp" }
                    right: { object: lamp }
                hints: ["„Chair“ ist der Stuhl."]
              - id: l1-s4
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Telephone." }
                options: [{ object: telephone }, { object: clock }, { object: lamp }]
                answer: telephone
                hints: ["„Telephone“ klingt fast wie Telefon."]
              - id: l1-s5
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Chair." }
                show: { object: chair }
                expected_text: "chair"
                hints: ["Sag mit mir: „chair“. Am Anfang klingt es wie tsch."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Mirror." }
                options: [{ object: mirror }, { object: lamp }, { object: oven }]
                answer: mirror
              - id: l1-n2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Bed." }
                options: [{ object: bed }, { object: table }, { object: box }]
                answer: bed
              - id: l1-n3
                type: true_false
                text: "Passt das Bild zum Wort?"
                say: { de: "Hör zu. Passt das Bild?", en: "Table." }
                show: { object: table }
                answer: true
              - id: l1-n4
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Lies die Wörter. Tippe auf ein Wort und dann auf das Bild." }
                pairs:
                  - left: { text: "table" }
                    right: { object: table }
                  - left: { text: "clock" }
                    right: { object: clock }
                  - left: { text: "oven" }
                    right: { object: oven }
              - id: l1-n5
                type: speak
                say: { de: "Sag es auf Englisch." }
                show: { object: lamp }
                expected_text: "lamp"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Clock." }
            options: [{ object: clock }, { object: telephone }, { object: mirror }]
            answer: clock
          - id: l1-c2
            type: true_false
            text: "Passt das Bild zum Wort?"
            say: { de: "Hör zu. Passt das Bild?", en: "Oven." }
            show: { object: bed }
            answer: false
          - id: l1-c3
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Chair." }
            options: [{ object: chair }, { object: bed }, { object: oven }]
            answer: chair
          - id: l1-c4
            type: multiple_choice
            option_audio: false
            text: "Wie heißt das auf Englisch?"
            say: { de: "Wie heißt das auf Englisch?" }
            show: { object: mirror }
            options: ["lamp", "mirror", "clock"]
            answer: "mirror"
          - id: l1-c5
            type: true_false
            text: "Schläfst du darin?"
            say: { de: "Hör zu. Schläfst du darin?" }
            audio: { en: "Table." }
            answer: false
          - id: l1-c6
            type: audio_choice
            text: "Was heißt das auf Deutsch?"
            say: { de: "Hör zu. Was heißt das auf Deutsch?" }
            audio: { en: "Mirror." }
            options: ["die Uhr", "das Bett", "der Spiegel"]
            answer: "der Spiegel"

  - n: 2
    title: { de: "Die Zimmer", en: "The rooms" }
    goal:
      de: "Lern die Zimmer und sag, wo etwas ist, so wie The oven is in the kitchen."
      en: "Learn the rooms and say where something is, like The oven is in the kitchen."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Telephone." }
            options: [{ object: telephone }, { object: oven }, { object: chair }]
            answer: telephone
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Passt das Bild zum Wort?"
            say: { de: "Hör zu. Passt das Bild?", en: "Bed." }
            show: { object: bed }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "bedroom"
            say: { de: "In „bedroom“ steckt „bed“, das Bett. Was glaubst du: Welches Zimmer ist das wohl?" }
            show: { object: house }
          - text: "kitchen, bathroom, bedroom, living room, garden"
            say: { de: "Das Schlafzimmer! Das sind die Zimmer. „Kitchen“ ist die Küche, „bathroom“ das Badezimmer, „bedroom“ das Schlafzimmer, „living room“ das Wohnzimmer. Draußen ist der „garden“, der Garten.", en: "Kitchen. Bathroom. Bedroom. Living room. Garden." }
            show: { object: house }
          - text: "kitchen, living room"
            say: { de: "Links die Küche, „kitchen“. Rechts das Wohnzimmer, „living room“.", en: "Kitchen. Living room." }
            show: { objects: [kitchen, living-room] }
          - text: "bedroom, bathroom"
            say: { de: "Hör genau hin, die zwei klingen ähnlich. In „bedroom“ steckt „bed“, das Bett: Das ist das Schlafzimmer. In „bathroom“ steckt „bath“, die Badewanne: Das ist das Badezimmer.", en: "Bedroom. Bathroom." }
            show: { objects: [bedroom, bathroom] }
          - text: "The oven is in the kitchen."
            say: { de: "So sagst du, wo etwas ist: „The oven is in the kitchen.“ Vor dem Zimmer steht immer „the“.", en: "The oven is in the kitchen." }
            show: { object: kitchen }
          - text: "Wusstest du? Buckingham Palace in London hat 775 Zimmer, davon 78 Badezimmer."
            say: { de: "Wusstest du? Im Buckingham Palace in London wohnt und arbeitet der britische König. Der Palast hat siebenhundertfünfundsiebzig Zimmer. Achtundsiebzig davon sind Badezimmer!", en: "Buckingham Palace." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Zimmer." }
                audio: { en: "Kitchen." }
                options: [{ object: kitchen }, { object: bathroom }, { object: bedroom }]
                answer: kitchen
                hints:
                  - "Hör noch einmal: „kitchen“."
                  - "In diesem Zimmer steht der Ofen."
                  - "„Kitchen“ ist die Küche."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Wo ist das Bett?"
                say: { de: "Hör zu. Wo ist das Bett?" }
                audio: { turns: [{ en: "Where's the bed?", speaker: female }, { en: "It's in the bedroom.", speaker: male }] }
                options: [{ object: bedroom }, { object: bathroom }, { object: kitchen }]
                answer: bedroom
                feedback:
                  bathroom: "„Bedroom“ ist das Schlafzimmer, dort steht das Bett. Das Badezimmer heißt „bathroom“."
                hints:
                  - "Hör auf das letzte Wort."
                  - "„Bedroom“: Darin steckt „bed“."
                  - "Das Bett steht im Schlafzimmer."
              - id: l2-f3
                type: ordering
                option_audio: false
                text: "Bau den Satz: Der Tisch ist in der Küche."
                say: { de: "Bau den Satz: Der Tisch ist in der Küche." }
                options: ["is", "The table", "the kitchen.", "in"]
                slot_count: 4
                answer: ["The table", "is", "in", "the kitchen."]
                hints:
                  - "Der Satz fängt mit „The table“ an."
                  - "The table is …"
                  - "The table is in the kitchen."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Wo schläfst du?"
                say: { de: "Wo schläfst du? Lies die Antworten." }
                options: ["in the bedroom", "in the kitchen", "in the garden"]
                answer: "in the bedroom"
                feedback:
                  "in the garden": "Im Garten schlafen? Nur beim Zelten! Dein Bett steht im Schlafzimmer."
                hints:
                  - "Wo steht dein Bett?"
                  - "Im Schlafzimmer."
                  - "Schlafzimmer heißt „bedroom“."
              - id: l2-f5
                type: speak
                say: { de: "Sag auf Englisch: Der Ofen ist in der Küche.", en: "The oven is in the kitchen." }
                show: { object: oven }
                expected_text: "The oven is in the kitchen."
                hints:
                  - "Fang mit „The oven“ an."
                  - "Küche heißt „kitchen“."
                  - "Sag mit mir: The oven is in the kitchen."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Zimmer." }
                audio: { en: "Living room." }
                options: [{ object: living-room }, { object: kitchen }, { object: bedroom }]
                answer: living-room
                hints: ["„Living“ kommt von „live“, wohnen."]
              - id: l2-s2
                type: true_false
                text: "„The oven is in the bathroom.“ Stimmt das?"
                say: { de: "Lies den Satz. Stimmt das?" }
                answer: false
                hints: ["Wo steht ein Ofen zum Kochen?"]
              - id: l2-s3
                type: audio_choice
                text: "Wo ist das Telefon?"
                say: { de: "Hör zu. Wo ist das Telefon?" }
                audio: { turns: [{ en: "Mum, where's the telephone?", speaker: male }, { en: "It's in the living room.", speaker: female }] }
                options: [{ object: living-room }, { object: kitchen }, { object: garden }]
                answer: living-room
                hints: ["Hör auf Mamas Antwort."]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Wo kochst du?"
                say: { de: "Wo kochst du? Lies die Antworten." }
                options: ["in the kitchen", "in the bathroom", "in the bedroom"]
                answer: "in the kitchen"
                hints: ["Küche heißt „kitchen“."]
              - id: l2-s5
                type: ordering
                option_audio: false
                text: "Bau den Satz: Das Bett ist im Schlafzimmer."
                say: { de: "Bau den Satz: Das Bett ist im Schlafzimmer." }
                options: ["in", "the bedroom.", "The bed", "is"]
                slot_count: 4
                answer: ["The bed", "is", "in", "the bedroom."]
                hints: ["Der Satz fängt mit „The bed“ an."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Zimmer." }
                audio: { en: "Bathroom." }
                options: [{ object: bathroom }, { object: bedroom }, { object: living-room }]
                answer: bathroom
              - id: l2-n2
                type: audio_choice
                text: "Wo ist der Ball?"
                say: { de: "Hör zu. Wo ist der Ball?" }
                audio: { turns: [{ en: "Where's my ball?", speaker: male }, { en: "It's in the garden.", speaker: female }] }
                options: [{ object: garden }, { object: living-room }, { object: kitchen }]
                answer: garden
              - id: l2-n3
                type: multiple_choice
                option_audio: false
                text: "Wo putzt du dir die Zähne?"
                say: { de: "Wo putzt du dir die Zähne? Lies die Antworten." }
                options: ["in the bathroom", "in the bedroom", "in the living room"]
                answer: "in the bathroom"
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Bau den Satz: Die Lampe ist im Wohnzimmer."
                say: { de: "Bau den Satz: Die Lampe ist im Wohnzimmer." }
                options: ["the living room.", "is", "The lamp", "in"]
                slot_count: 4
                answer: ["The lamp", "is", "in", "the living room."]
              - id: l2-n5
                type: true_false
                text: "„The bed is in the bedroom.“ Stimmt das?"
                say: { de: "Lies den Satz. Stimmt das?" }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: rooms
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Zimmer." }
            audio: { en: "Bedroom." }
            options: [{ object: bedroom }, { object: bathroom }, { object: kitchen }]
            answer: bedroom
          - id: l2-c2
            part: where
            type: audio_choice
            text: "Wo ist die Katze?"
            say: { de: "Hör zu. Wo ist die Katze?" }
            audio: { turns: [{ en: "Where's the cat?", speaker: male }, { en: "She's in the kitchen.", speaker: female }] }
            options: [{ object: kitchen }, { object: bathroom }, { object: garden }]
            answer: kitchen
          - id: l2-c3
            part: where
            type: ordering
            option_audio: false
            text: "Bau den Satz: Der Spiegel ist im Badezimmer."
            say: { de: "Bau den Satz: Der Spiegel ist im Badezimmer." }
            options: ["The mirror", "in", "the bathroom.", "is"]
            slot_count: 4
            answer: ["The mirror", "is", "in", "the bathroom."]
          - id: l2-c4
            part: rooms
            type: multiple_choice
            option_audio: false
            text: "Wo badest du?"
            say: { de: "Wo badest du? Lies die Antworten." }
            options: ["in the bathroom", "in the bedroom", "in the kitchen"]
            answer: "in the bathroom"
          - id: l2-c5
            part: things
            type: true_false
            text: "Passt das Bild zum Wort?"
            say: { de: "Hör zu. Passt das Bild?", en: "Lamp." }
            show: { object: lamp }
            answer: true
          - id: l2-c6
            part: things
            type: matching
            text: "Welches deutsche Wort gehört zu welchem englischen?"
            say: { de: "Verbinde jedes englische Wort mit dem deutschen." }
            option_audio: false
            pairs:
              - { left: { text: "mirror" }, right: { text: "der Spiegel" } }
              - { left: { text: "clock" }, right: { text: "die Uhr" } }
              - { left: { text: "oven" }, right: { text: "der Ofen" } }
              - { left: { text: "chair" }, right: { text: "der Stuhl" } }
          - id: l2-c7
            part: things
            type: audio_choice
            text: "Was heißt das auf Deutsch?"
            say: { de: "Hör zu. Was heißt das auf Deutsch?" }
            audio: { en: "Clock." }
            options: ["die Lampe", "die Uhr", "der Spiegel"]
            answer: "die Uhr"
          - id: l2-c8
            part: things
            type: multiple_choice
            option_audio: false
            text: "Wie heißt das auf Englisch?"
            say: { de: "Wie heißt das auf Englisch?" }
            show: { object: telephone }
            options: ["clock", "table", "telephone"]
            answer: "telephone"
          - id: l2-c9
            part: things
            type: true_false
            text: "Sitzt du darauf?"
            say: { de: "Hör zu. Sitzt du darauf?" }
            audio: { en: "Chair." }
            answer: true
          - id: l2-c10
            part: things
            type: audio_choice
            text: "Welches Bild passt?"
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "Oven." }
            options: [{ object: cupboard }, { object: table }, { object: oven }]
            answer: oven
          - id: l2-c11
            part: things
            type: multiple_choice
            option_audio: false
            text: "Woran siehst du, wie spät es ist?"
            say: { de: "Woran siehst du, wie spät es ist?" }
            options: ["mirror", "clock", "bed"]
            answer: "clock"
          - id: l2-c12
            part: rooms
            type: matching
            text: "Welches Wort passt zu welchem Zimmer?"
            say: { de: "Lies die Wörter. Verbinde jedes Wort mit seinem Zimmer." }
            option_audio: false
            pairs:
              - left: { text: "kitchen" }
                right: { object: kitchen }
              - left: { text: "bathroom" }
                right: { object: bathroom }
              - left: { text: "bedroom" }
                right: { object: bedroom }
              - left: { text: "living room" }
                right: { object: living-room }
          - id: l2-c13
            part: rooms
            type: multiple_choice
            option_audio: false
            text: "Welches Zimmer ist das?"
            say: { de: "Welches Zimmer ist das?" }
            show: { object: bathroom }
            options: ["bedroom", "bathroom", "kitchen"]
            answer: "bathroom"
          - id: l2-c14
            part: rooms
            type: true_false
            text: "Passt das Wort zum Zimmer?"
            say: { de: "Hör zu. Passt das Wort zum Zimmer?" }
            audio: { en: "Kitchen." }
            show: { object: living-room }
            answer: false
          - id: l2-c15
            part: rooms
            type: multiple_choice
            option_audio: false
            text: "Wo spielst du draußen Fußball?"
            say: { de: "Wo spielst du draußen Fußball? Lies die Antworten." }
            options: ["in the kitchen", "in the garden", "in the bathroom"]
            answer: "in the garden"
          - id: l2-c16
            part: where
            type: audio_choice
            text: "Wo ist die Lampe?"
            say: { de: "Hör zu. Wo ist die Lampe?" }
            audio: { turns: [{ en: "Is the lamp in the kitchen?", speaker: male }, { en: "No, it's in the bedroom.", speaker: female }] }
            options: [{ object: kitchen }, { object: bedroom }, { object: garden }]
            answer: bedroom
          - id: l2-c17
            part: where
            type: audio_choice
