# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-mediate
skill: fl.culture-strategies.mediate
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Für Oma auf Deutsch sagen
  en: Telling Grandma in German
summary: >
  Sprachmittlung: telling someone in German what a short English sign or
  sentence means. The Becker family is on holiday in London and Grandma
  speaks no English. Lesson 1 explains signs (OPEN, CLOSED, PUSH, PULL,
  TOILETS, NO DOGS, WAY OUT) by saying what they mean rather than word for
  word. Lesson 2 passes on short spoken and written sentences (a waiter, a
  bus driver, a card from a friend), turning "I" into the person who said
  it, and ends with the skill check. The English is read or heard; the
  answers are in German.
metadata:
  year: lernjahr-1
  topic: { de: Sprachmittlung, en: Mediation }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.sentences]
  also_practises: [fl.reading.sentences, fl.listening.short-dialogues]
  vocabulary: { en: [open, closed, push, pull, toilets, exit, way in, way out, no dogs, bus stop, shop, "Would you like …?", "Do you want …?", "I've got …"] }
  forms: [text, audio, drawn, picture]
  drawn: [word-card]
  facets: []
  parts:
    - { id: signs, what: { de: "auf Deutsch sagen, was ein englisches Schild bedeutet", en: saying in German what an English sign means } }
    - { id: spoken, what: { de: "einen kurzen gehörten Satz auf Deutsch weitersagen", en: passing on a short spoken sentence in German } }
    - { id: written, what: { de: "einen kurzen geschriebenen Satz weitersagen und dabei sagen, wer es geschrieben hat", en: passing on a short written sentence and saying who wrote it } }
    - { id: meaning, what: { de: "sagen, was gemeint ist, statt Wort für Wort zu übersetzen", en: saying what is meant instead of translating word for word } }
  misconceptions:
    - id: word-for-word
      what: Translates a sign or sentence word for word, so it sounds odd in German (WAY IN as "Weg rein", BUS STOP as "Bus stopp")
      addressed: lesson 1 Learn shows WAY OUT as "Hier geht es raus"; l1-f6 and l1-n1 offer the word-for-word version with feedback in l1-f6; l2-f6 and the skill check ask what matters when passing something on
    - id: keeps-i
      what: Keeps "I" or "my" when passing on what someone else wrote ("Meine Katze ist krank" for Lily's cat)
      addressed: lesson 2 Learn turns "I've got a new dog" into "Lily hat einen neuen Hund"; every stage of lesson 2 has a card from a friend with the ich version as an option, with feedback in l2-f2 and l2-f4
    - id: push-pull
      what: Mixes up push and pull on doors
      addressed: l1-f4 gives feedback on ziehen; l1-s2 and the skill check ask for pull
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was steht auf dem Schild?", en: "What does the sign say?" }
    goal:
      de: "Hilf Oma in London und sag ihr auf Deutsch, was ein Schild bedeutet, so wie open."
      en: "Help Grandma in London and tell her in German what a sign means, like open."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Lies den Satz. Welches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            show: { drawn: word-card, text: "The dog is in the car." }
            options: [{ object: dog }, { object: cat }, { object: duck }]
            answer: dog
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Lies den Satz. Was heißt das?"
            say: { de: "Lies den Satz. Was heißt das?" }
            show: { drawn: word-card, text: "I like apples." }
            options: ["Ich mag Äpfel.", "Ich habe Äpfel.", "Ich esse Bananen."]
            answer: "Ich mag Äpfel."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Familie Becker ist in London."
            say: { de: "Familie Becker macht Urlaub in London. Oma kann kein Englisch, und dein kleiner Bruder Max kann noch nicht lesen. Du hilfst ihnen. Du sagst auf Deutsch, was gemeint ist. Was glaubst du: Was steht auf dem Schild an der Tür, wenn ein Laden offen ist?" }
            show: { object: bus }
          - text: "Oma fragt: Was steht da?"
            say: { de: "Oma fragt: Was steht da an der Tür? Du liest „open“ und sagst: Der Laden ist offen. Wir können rein." }
            show: { drawn: word-card, text: "OPEN" }
          - text: "Hier geht es raus."
            say: { de: "Hier hilft es nicht, Wort für Wort zu übersetzen. „Weg raus“ klingt komisch. Du sagst einfach: Hier geht es raus. Das ist der Ausgang." }
            show: { drawn: word-card, text: "WAY OUT" }
          - text: "Wusstest du? In der U-Bahn in London hörst du: „Mind the gap!“"
            say: { de: "Wusstest du? London hat die älteste U-Bahn der Welt. Sie fährt schon seit über hundertsechzig Jahren. Dort hörst du immer wieder: Mind the gap! Das heißt: Pass auf die Lücke zwischen Zug und Bahnsteig auf.", en: "Mind the gap!" }
            show: { drawn: word-card, text: "MIND THE GAP" }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Oma fragt: Was steht da?"
                say: { de: "Oma fragt: Was steht da? Was sagst du ihr?" }
                show: { drawn: word-card, text: "CLOSED" }
                options: ["Der Laden ist zu.", "Der Laden ist offen.", "Der Laden ist kaputt."]
                answer: "Der Laden ist zu."
                feedback:
                  "Der Laden ist offen.": "Offen heißt „open“. „Closed“ ist das Gegenteil: zu."
                hints:
                  - "„Open“ kennst du schon. „Closed“ ist das Gegenteil."
                  - "„Closed“ heißt geschlossen."
                  - "Sag Oma: Der Laden ist zu."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Max muss mal. Was sagst du ihm?"
                say: { de: "Max muss mal aufs Klo. Er sieht dieses Schild. Was sagst du ihm?" }
                show: { drawn: word-card, text: "TOILETS" }
                options: ["Da sind die Toiletten.", "Da ist der Ausgang.", "Da ist ein Café."]
                answer: "Da sind die Toiletten."
                feedback:
                  "Da ist ein Café.": "Ein Café hilft Max jetzt gar nicht! „Toilets“ klingt wie Toiletten."
                hints:
                  - "Lies das Wort langsam. Welches deutsche Wort klingt ähnlich?"
                  - "„Toilets“ klingt wie Toiletten."
                  - "Sag Max: Da sind die Toiletten."
              - id: l1-f3
                type: true_false
                text: "Oma hat ihren Hund Bello dabei. Sie fragt: Darf Bello hier mit rein?"
                say: { de: "Oma hat ihren Hund Bello dabei. Sie sieht dieses Schild und fragt: Darf Bello hier mit rein?" }
                show: { drawn: word-card, text: "NO DOGS" }
                answer: false
                hints:
                  - "„Dogs“ sind Hunde. Was heißt „no“?"
                  - "„No“ heißt hier: nicht erlaubt."
                  - "Nein. Sag Oma: Hunde dürfen hier nicht rein."
              - id: l1-f4
                type: multiple_choice
                text: "Oma will die Tür aufmachen. Was sagst du?"
                say: { de: "Oma will die Tür aufmachen. Was sagst du ihr?" }
                show: { drawn: word-card, text: "PUSH" }
                options: ["Du musst drücken.", "Du musst ziehen.", "Die Tür ist zu."]
                answer: "Du musst drücken."
                feedback:
                  "Du musst ziehen.": "Ziehen heißt „pull“. „Push“ heißt drücken."
                hints:
                  - "Auf Türen steht „push“ oder „pull“."
                  - "„Push“ heißt drücken, „pull“ heißt ziehen."
                  - "Sag Oma: Du musst drücken."
              - id: l1-f5
                type: matching
                text: "Was bedeuten die Schilder?"
                say: { de: "Verbinde jedes Schild mit dem, was du Oma sagst." }
                pairs:
                  - { left: { text: "EXIT" }, right: { text: "Ausgang" } }
                  - { left: { text: "BUS STOP" }, right: { text: "Bushaltestelle" } }
                  - { left: { text: "SHOP" }, right: { text: "Laden" } }
                hints:
                  - "Fang mit dem Schild an, das du sicher kennst."
                  - "„Bus“ kennst du. Dort hält der Bus."
                  - "„Exit“ ist der Ausgang, „shop“ ist der Laden."
              - id: l1-f6
                type: multiple_choice
                text: "Wie sagst du es Oma am besten?"
                say: { de: "Wie sagst du es Oma am besten?" }
                show: { drawn: word-card, text: "WAY IN" }
                options: ["Hier geht es rein.", "Weg rein.", "Hier ist ein Weg."]
                answer: "Hier geht es rein."
                feedback:
                  "Weg rein.": "So spricht bei uns niemand. Sag, was gemeint ist: Hier geht es rein."
                hints:
                  - "Sag nicht jedes Wort einzeln. Sag, was das Schild meint."
                  - "„Way out“ heißt: Hier geht es raus. Was ist dann „way in“?"
                  - "Sag Oma: Hier geht es rein."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Max will ein Eis. Was sagst du ihm?"
                say: { de: "Max will ein Eis. Was sagst du ihm?" }
                show: { drawn: word-card, text: "ICE CREAM £2" }
                options: ["Ein Eis kostet zwei Pfund.", "Es gibt zwei Sorten Eis.", "Zwei Eis gibt es umsonst."]
                answer: "Ein Eis kostet zwei Pfund."
                hints: ["£ ist das Zeichen für Pfund. So heißt das Geld in England."]
              - id: l1-s2
                type: multiple_choice
                text: "Oma fragt: Was muss ich machen?"
                say: { de: "Oma steht vor der Tür und fragt: Was muss ich machen?" }
                show: { drawn: word-card, text: "PULL" }
                options: ["Ziehen.", "Drücken.", "Klingeln."]
                answer: "Ziehen."
                hints: ["„Push“ heißt drücken. „Pull“ ist das Gegenteil."]
              - id: l1-s3
                type: true_false
                text: "Max sagt: „Hier dürfen wir schwimmen.“ Hat er recht?"
                say: { de: "Ihr seid an einem See. Max sagt: Hier dürfen wir schwimmen. Hat er recht?" }
                show: { drawn: word-card, text: "NO SWIMMING" }
                answer: false
                hints: ["Denk an „no dogs“. Was heißt „no“ auf einem Schild?"]
              - id: l1-s4
                type: matching
                text: "Was bedeuten die Schilder?"
                say: { de: "Verbinde jedes Schild mit dem, was du Oma sagst." }
                pairs:
                  - { left: { text: "OPEN" }, right: { text: "geöffnet" } }
                  - { left: { text: "CLOSED" }, right: { text: "geschlossen" } }
                  - { left: { text: "TOILETS" }, right: { text: "Toiletten" } }
                  - { left: { text: "WAY OUT" }, right: { text: "Ausgang" } }
                hints: ["„Open“ und „closed“ sind Gegenteile."]
              - id: l1-s5
                type: multiple_choice
                text: "Ihr seid in einer Bücherei. Was sagst du Max?"
                say: { de: "Ihr seid in einer Bücherei. Was sagst du Max?" }
                show: { drawn: word-card, text: "PLEASE BE QUIET" }
                options: ["Wir sollen leise sein.", "Wir sollen schnell sein.", "Wir sollen bitte lesen."]
                answer: "Wir sollen leise sein."
                hints: ["„Be quiet“ kennst du aus der Schule."]
              - id: l1-s6
                type: image_multiple_choice
                option_audio: false
                text: "Oma sucht den Ausgang. Welches Schild zeigt ihr den Weg?"
                say: { de: "Oma sucht den Ausgang. Welches Schild zeigt ihr den Weg?" }
                options:
                  - { drawn: word-card, text: "WAY OUT" }
                  - { drawn: word-card, text: "WAY IN" }
                  - { drawn: word-card, text: "TOILETS" }
                answer: "WAY OUT"
                hints: ["„Way in“ heißt: Hier geht es rein."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Oma fragt: Was steht da?"
                say: { de: "Oma fragt: Was steht da?" }
                show: { drawn: word-card, text: "BUS STOP" }
                options: ["Hier hält der Bus.", "Bus stopp! Hier darf kein Bus fahren.", "Hier ist kein Bus."]
                answer: "Hier hält der Bus."
              - id: l1-n2
                type: multiple_choice
                text: "Oma will ein Foto machen. Was sagst du?"
                say: { de: "Oma will ein Foto machen. Was sagst du ihr?" }
                show: { drawn: word-card, text: "NO PHOTOS" }
                options: ["Hier darf man nicht fotografieren.", "Hier kann man Fotos kaufen.", "Hier soll man Fotos machen."]
                answer: "Hier darf man nicht fotografieren."
              - id: l1-n3
                type: true_false
                text: "Kann Oma hier einkaufen?"
                say: { de: "Oma will Tee kaufen. Kann sie hier einkaufen?" }
                show: { drawn: word-card, text: "SHOP CLOSED" }
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                option_audio: false
                text: "Max muss mal. Welches Schild hilft ihm?"
                say: { de: "Max muss mal aufs Klo. Welches Schild hilft ihm?" }
                options:
                  - { drawn: word-card, text: "TOILETS" }
                  - { drawn: word-card, text: "EXIT" }
                  - { drawn: word-card, text: "SHOP" }
                answer: "TOILETS"
              - id: l1-n5
                type: multiple_choice
                text: "Darf Bello mit ins Café?"
                say: { de: "Oma steht mit Bello vor einem Café. Was sagst du ihr?" }
                show: { drawn: word-card, text: "DOGS WELCOME" }
                options: ["Hunde dürfen mit rein.", "Hunde dürfen nicht rein.", "Hier kann man Hunde kaufen."]
                answer: "Hunde dürfen mit rein."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Oma fragt: Was steht da?"
            say: { de: "Oma fragt: Was steht da?" }
            show: { drawn: word-card, text: "EXIT" }
            options: ["Ausgang", "Eingang", "Ende"]
            answer: "Ausgang"
          - id: l1-c2
            type: multiple_choice
            text: "Max fragt: Was muss ich machen?"
            say: { de: "Max steht vor der Tür und fragt: Was muss ich machen?" }
            show: { drawn: word-card, text: "PUSH" }
            options: ["Drücken.", "Ziehen.", "Warten."]
            answer: "Drücken."
          - id: l1-c3
            type: multiple_choice
            text: "Max hat sein Fahrrad dabei. Was sagst du ihm?"
            say: { de: "Max hat sein Fahrrad dabei. Was sagst du ihm?" }
            show: { drawn: word-card, text: "NO BIKES" }
            options: ["Fahrräder sind hier verboten.", "Hier gibt es Fahrräder.", "Hier kann man Fahrräder leihen."]
            answer: "Fahrräder sind hier verboten."
          - id: l1-c4
            type: true_false
            text: "Oma fragt: „Ist hier der Eingang?“ Schau auf das Schild. Ist das der Eingang?"
            say: { de: "Oma fragt: Ist hier der Eingang? Schau auf das Schild. Ist das der Eingang?" }
            show: { drawn: word-card, text: "WAY IN" }
            answer: true
          - id: l1-c5
            type: image_multiple_choice
            option_audio: false
            text: "Oma will hinaus. Welches Schild zeigt den Ausgang?"
            say: { de: "Oma will hinaus. Welches Schild zeigt den Ausgang?" }
            options:
              - { drawn: word-card, text: "SHOP" }
              - { drawn: word-card, text: "WAY IN" }
              - { drawn: word-card, text: "EXIT" }
            answer: "EXIT"
          - id: l1-c6
            type: multiple_choice
            text: "Oma steht vor der Tür. Wie sagst du es ihr am besten?"
            say: { de: "Oma steht vor der Tür. Wie sagst du es ihr am besten?" }
            show: { drawn: word-card, text: "PULL" }
            options: ["Ziehen Tür.", "Du musst ziehen.", "Die Tür ist offen."]
            answer: "Du musst ziehen."

  - n: 2
    title: { de: Kurze Sätze weitersagen, en: Passing on short sentences }
    goal:
      de: "Sag Oma auf Deutsch, was jemand auf Englisch gesagt oder geschrieben hat."
      en: "Tell Grandma in German what someone said or wrote in English."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Max fragt: Können wir rein?"
            say: { de: "Max fragt: Können wir in den Laden rein? Was sagst du ihm?" }
            show: { drawn: word-card, text: "CLOSED" }
            options: ["Nein, er ist zu.", "Ja, er ist offen."]
            answer: "Nein, er ist zu."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Oma sucht eine Toilette. Hilft ihr dieses Schild?"
            say: { de: "Oma sucht eine Toilette. Hilft ihr dieses Schild?" }
            show: { drawn: word-card, text: "TOILETS" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Would you like milk in your tea?"
            say: { de: "Jetzt sagst du ganze Sätze weiter. Ihr sitzt in einem Café. Der Kellner fragt Oma etwas. Zwei Wörter kennst du sicher. Was glaubst du: Was möchte er wissen?", en: "Would you like milk in your tea?" }
            show: { objects: [milk, cup] }
          - text: "Er fragt, ob du Milch in den Tee möchtest."
            say: { de: "Du musst nicht jedes Wort übersetzen. Sag Oma, was der Kellner wissen will: Er fragt, ob du Milch in den Tee möchtest." }
          - text: "I've got a new dog.\nLily hat einen neuen Hund."
            say: { de: "Deine Freundin Lily schreibt dir: „I've got a new dog.“ Wenn du es Oma erzählst, sagst du nicht „ich“. Du sagst: Lily hat einen neuen Hund.", en: "I've got a new dog." }
            show: { object: dog }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Der Busfahrer sagt etwas. Was sagst du Oma?"
                say: { de: "Der Busfahrer sagt etwas. Was sagst du Oma?" }
                audio: { en: "This bus goes to the zoo.", speaker: male }
                options: ["Der Bus fährt zum Zoo.", "Der Bus ist kaputt.", "Im Bus sind Tiere."]
                answer: "Der Bus fährt zum Zoo."
                hints:
                  - "Welche Wörter kennst du?"
                  - "„Bus“ und „zoo“ kennst du."
                  - "Sag Oma: Der Bus fährt zum Zoo."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Lily schreibt dir. Was erzählst du Oma?"
                say: { de: "Lily schreibt dir eine Karte. Was erzählst du Oma?" }
                show: { drawn: word-card, text: "My cat is ill." }
                options: ["Lilys Katze ist krank.", "Meine Katze ist krank.", "Lily ist krank."]
                answer: "Lilys Katze ist krank."
                feedback:
                  "Meine Katze ist krank.": "Das ist Lilys Katze, nicht deine. Sag Oma: Lilys Katze ist krank."
                  "Lily ist krank.": "Lies noch einmal: „My cat“. Die Katze ist krank, nicht Lily."
                hints:
                  - "Wer hat die Katze?"
                  - "Lily schreibt „my cat“. Das ist ihre Katze. „Ill“ heißt krank."
                  - "Sag Oma: Lilys Katze ist krank."
              - id: l2-f3
                type: audio_choice
                text: "Die Frau am Eiswagen fragt Max etwas. Was sagst du ihm?"
                say: { de: "Die Frau am Eiswagen fragt Max etwas. Was sagst du ihm?" }
                audio: { en: "Do you want a big ice cream or a small one?", speaker: female }
                options: ["Sie fragt, ob du ein großes oder ein kleines Eis willst.", "Sie sagt, das Eis ist alle.", "Sie fragt, wie alt du bist."]
                answer: "Sie fragt, ob du ein großes oder ein kleines Eis willst."
                hints:
                  - "Hör auf die Wörter, die du kennst."
                  - "„Big“ heißt groß, „small“ heißt klein."
                  - "Sie will wissen: groß oder klein?"
              - id: l2-f4
                type: multiple_choice
                text: "Tom schreibt dir. Was erzählst du Oma?"
                say: { de: "Dein Freund Tom schreibt dir eine Karte. Was erzählst du Oma?" }
                show: { drawn: word-card, text: "I'm nine today!" }
                options: ["Tom wird heute neun.", "Ich bin heute neun.", "Tom hat neun Karten."]
                answer: "Tom wird heute neun."
                feedback:
                  "Ich bin heute neun.": "Tom hat das geschrieben, nicht du. Sag Oma: Tom wird heute neun."
                hints:
                  - "Wer hat die Karte geschrieben?"
                  - "Tom schreibt „I'm“. Das heißt: Tom ist."
                  - "Sag Oma: Tom wird heute neun."
              - id: l2-f5
                type: true_false
                text: "Max sagt Oma: „Das Museum ist heute zu.“ Hat er richtig weitergesagt, was die Frau an der Kasse sagt?"
                say: { de: "Max sagt Oma: Das Museum ist heute zu. Hör, was die Frau an der Kasse sagt. Hat Max es richtig weitergesagt?" }
                audio: { en: "Sorry, the museum is closed today.", speaker: female }
                answer: true
                hints:
                  - "Welches Wort kennst du vom Schild?"
                  - "„Closed“ heißt geschlossen, zu."
                  - "Ja, Max hat es richtig gesagt."
              - id: l2-f6
                type: multiple_choice
                text: "Was ist beim Weitersagen wichtig?"
                say: { de: "Du erklärst Oma einen englischen Satz. Was ist dabei wichtig?" }
                options: ["Ich sage, was gemeint ist.", "Ich übersetze jedes Wort ganz genau.", "Ich sage nur das erste Wort."]
                answer: "Ich sage, was gemeint ist."
                feedback:
                  "Ich übersetze jedes Wort ganz genau.": "Wort für Wort klingt es oft komisch. Sag einfach, was gemeint ist."
                hints:
                  - "Muss Oma jedes englische Wort kennen?"
                  - "Beim Kellner hast du Oma nicht jedes Wort gesagt, nur was er wissen will."
                  - "Wichtig ist, was gemeint ist."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Der Kellner fragt Oma etwas. Was sagst du ihr?"
                say: { de: "Der Kellner fragt Oma etwas. Was sagst du ihr?" }
                audio: { en: "Would you like a cup of tea?", speaker: male }
                options: ["Er fragt, ob du eine Tasse Tee möchtest.", "Er fragt, ob du Kaffee magst.", "Er sagt, der Tee ist heiß."]
                answer: "Er fragt, ob du eine Tasse Tee möchtest."
                hints: ["„A cup of tea“ kennst du."]
              - id: l2-s2
                type: multiple_choice
                text: "Lily schreibt dir. Was erzählst du Oma?"
                say: { de: "Lily schreibt dir wieder. Was erzählst du Oma?" }
                show: { drawn: word-card, text: "I can swim now!" }
                options: ["Lily kann jetzt schwimmen.", "Ich kann jetzt schwimmen.", "Lily geht jetzt Eis essen."]
                answer: "Lily kann jetzt schwimmen."
                hints: ["Wer hat das geschrieben?"]
              - id: l2-s3
