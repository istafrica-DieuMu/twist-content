# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-sentences
skill: fl.reading.sentences
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Kurze Sätze lesen
  en: Reading short sentences
summary: >
  Reading short English sentences made of familiar words and matching
  them to pictures. Lesson 1 reads a sentence and finds its picture, where
  every word counts (a red ball, not a red car); lesson 2 goes the other
  way, from a picture to its sentence, reads sentences with not, isn't and
  can't, and ends with the skill check. The voice never reads the sentence
  to be understood.
metadata:
  year: lernjahr-1
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.word-picture]
  also_practises: [fl.themes.weather, fl.themes.feelings, fl.themes.jobs]
  vocabulary: { en: ["I've got", "I can", "I can't", "I'm", "I'm not", "It's", "It isn't", "He is", "She is", raining, snowing, windy, sunny] }
  forms: [picture, text, drawn]
  drawn: [word-card]
  facets: []
  parts:
    - { id: to-picture, what: { de: einen Satz lesen und das passende Bild finden, en: reading a sentence and finding its picture } }
    - { id: to-sentence, what: { de: zu einem Bild den passenden Satz finden, en: finding the sentence for a picture } }
    - { id: negative, what: { de: "Sätze mit not, isn't und can't verstehen", en: "understanding sentences with not, isn't and can't" } }
  misconceptions:
    - id: one-word
      what: Reads one familiar word and picks the picture for it (red car for I've got a red ball)
      addressed: lesson 1 Learn says to read every word; the picture options share a word with the sentence, and l1-f1 and l2-f4 give feedback when only one word was read
    - id: misses-not
      what: Overlooks not, isn't or can't and takes the sentence as positive
      addressed: lesson 2 Learn brings can't, isn't and not; l2-f5 gives feedback when happy is picked for I'm not happy, and every stage of lesson 2 and the skill check has a negative sentence
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Satz lesen, Bild finden", en: "Read the sentence, find the picture" }
    goal:
      de: "Lies einen kurzen englischen Satz ganz genau und finde das passende Bild, so wie bei a red ball."
      en: "Read a short English sentence carefully and find the picture that fits, like a red ball."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Lies das Wort. Welches Bild passt?"
            say: { de: "Lies das Wort. Welches Bild passt?" }
            show: { drawn: word-card, text: "car" }
            options: [{ object: car }, { object: cat }, { object: cake }]
            answer: car
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "Welches Wort passt zum Bild?"
            say: { de: "Welches Wort passt zum Bild?" }
            show: { object: snow }
            options: ["snow", "sun", "rain"]
            answer: "snow"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "I've got a red ball."
            say: { de: "Jetzt liest du ganze Sätze. Lies diesen Satz. Was glaubst du: Was ist auf dem Bild dazu? Ein roter Ball oder ein rotes Auto?" }
          - text: "I've got a red ball."
            say: { de: "Ein roter Ball! Lies jedes Wort. Hier geht es um einen Ball, und er ist rot.", en: "I've got a red ball." }
            show: { object: ball, colour: red }
          - text: "The frog is green."
            say: { de: "Ein Wort sagt dir, was es ist, ein anderes, wie es ist. „Frog“ ist der Frosch, „green“ heißt grün.", en: "The frog is green." }
            show: { object: frog }
          - text: "It's raining."
            say: { de: "Manche Sätze kennst du schon als Ganzes. „It's raining“ heißt: Es regnet.", en: "It's raining." }
            show: { object: rain }
          - text: "Wusstest du? In „The quick brown fox jumps over the lazy dog.“ steckt jeder Buchstabe von A bis Z."
            say: { de: "Wusstest du? In diesem englischen Satz steckt jeder Buchstabe von A bis Z. Er heißt: Der schnelle braune Fuchs springt über den faulen Hund. Darum tippen Leute ihn, wenn sie eine neue Tastatur oder Schrift ausprobieren.", en: "The quick brown fox jumps over the lazy dog." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                option_audio: false
                text: "I've got a red ball.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: ball, colour: red, key: red-ball }, { object: ball, colour: blue, key: blue-ball }, { object: car, colour: red, key: red-car }]
                answer: red-ball
                feedback:
                  red-car: "Lies jedes Wort. Die Farbe stimmt, aber da steht „ball“, nicht „car“."
                hints:
                  - "Was ist es, und welche Farbe hat es?"
                  - "„Ball“ ist der Ball, „red“ heißt rot."
                  - "Tippe auf den roten Ball."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                option_audio: false
                text: "It's snowing.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: snow }, { object: rain }, { object: sun }]
                answer: snow
                feedback:
                  sun: "Bei so viel Sonne schmilzt jeder Schneemann! „Snowing“ kommt von „snow“, der Schnee."
                hints:
                  - "Der Satz sagt, wie das Wetter ist."
                  - "„Snowing“ kommt von „snow“."
                  - "Es schneit."
              - id: l1-f3
                type: image_multiple_choice
                option_audio: false
                text: "She is a teacher.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: teacher }, { object: doctor }, { object: cook }]
                answer: teacher
                hints:
                  - "Der Satz sagt, was sie von Beruf ist."
                  - "Sie arbeitet in der Schule."
                  - "„Teacher“ heißt Lehrerin."
              - id: l1-f5
                type: true_false
                text: "It's windy.\n\nPasst der Satz zum Bild?"
                say: { de: "Lies den Satz. Passt er zum Bild?" }
                show: { object: wind }
                answer: true
                hints:
                  - "Wie ist das Wetter auf dem Bild?"
                  - "„Windy“ kommt von „wind“, der Wind."
                  - "Ja, es ist windig."
              - id: l1-f4
                type: image_multiple_choice
                option_audio: false
                text: "I can swim.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: swim }, { object: dance }, { object: read }]
                answer: swim
                hints:
                  - "Lies das letzte Wort."
                  - "„Swim“ klingt fast wie schwimmen."
                  - "Tippe auf das Kind im Wasser."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                option_audio: false
                text: "I've got a green jumper.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: jumper, colour: green, key: green-jumper }, { object: jumper, colour: yellow, key: yellow-jumper }, { object: jacket, colour: green, key: green-jacket }]
                answer: green-jumper
                hints: ["„Jumper“ ist der Pullover. Welche Farbe hat er?"]
              - id: l1-s2
                type: image_multiple_choice
                option_audio: false
                text: "He is a farmer.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: farmer }, { object: firefighter }, { object: police-officer }]
                answer: farmer
                hints: ["„Farmer“ heißt Bauer. Er arbeitet auf dem Bauernhof."]
              - id: l1-s3
                type: true_false
                text: "It's sunny.\n\nPasst der Satz zum Bild?"
                say: { de: "Lies den Satz. Passt er zum Bild?" }
                show: { object: rain }
                answer: false
                hints: ["„Sunny“ kommt von „sun“, die Sonne."]
              - id: l1-s4
                type: image_multiple_choice
                option_audio: false
                text: "I like apples.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: apple }, { object: banana }, { object: orange }]
                answer: apple
                hints: ["Lies das letzte Wort."]
              - id: l1-s5
                type: image_multiple_choice
                option_audio: false
                text: "I'm tired.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: tired }, { object: happy }, { object: angry }]
                answer: tired
                hints: ["„Tired“ heißt müde."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                option_audio: false
                text: "I've got a blue car.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: car, colour: blue, key: blue-car }, { object: car, colour: yellow, key: yellow-car }, { object: ball, colour: blue, key: blue-ball }]
                answer: blue-car
              - id: l1-n2
                type: image_multiple_choice
                option_audio: false
                text: "I can dance.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: dance }, { object: sing }, { object: paint }]
                answer: dance
              - id: l1-n3
                type: true_false
                text: "He is a doctor.\n\nPasst der Satz zum Bild?"
                say: { de: "Lies den Satz. Passt er zum Bild?" }
                show: { object: cook }
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                option_audio: false
                text: "I'm happy.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: happy }, { object: sad }, { object: scared }]
                answer: happy
              - id: l1-n5
                type: image_multiple_choice
                option_audio: false
                text: "Look at my yellow dress.\n\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: dress, colour: yellow, key: yellow-dress }, { object: skirt, colour: yellow, key: yellow-skirt }, { object: dress, colour: red, key: red-dress }]
                answer: yellow-dress

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            option_audio: false
            text: "It's raining.\n\nWelches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: rain }, { object: snow }, { object: wind }]
            answer: rain
          - id: l1-c2
            type: image_multiple_choice
            option_audio: false
            text: "She is a cook.\n\nWelches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: cook }, { object: teacher }, { object: farmer }]
            answer: cook
          - id: l1-c3
            type: true_false
            text: "I can read.\n\nPasst der Satz zum Bild?"
            say: { de: "Lies den Satz. Passt er zum Bild?" }
            show: { object: read }
            answer: true
          - id: l1-c4
            type: image_multiple_choice
            option_audio: false
            text: "I've got a red skirt.\n\nWelches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: dress, colour: red, key: red-dress }, { object: skirt, colour: red, key: red-skirt }, { object: skirt, colour: blue, key: blue-skirt }]
            answer: red-skirt
          - id: l1-c5
            type: image_multiple_choice
            option_audio: false
            text: "He is a police officer.\n\nWelches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: firefighter }, { object: farmer }, { object: police-officer }]
            answer: police-officer
          - id: l1-c6
            type: true_false
            text: "I'm scared.\n\nPasst der Satz zum Bild?"
            say: { de: "Lies den Satz. Passt er zum Bild?" }
            show: { object: tired }
            answer: false

  - n: 2
    title: { de: "Bild ansehen, Satz finden", en: "Look at the picture, find the sentence" }
    goal:
      de: "Schau dir ein Bild an, finde den passenden Satz und achte auf kleine Wörter wie can't."
      en: "Look at a picture, find the sentence that fits, and watch out for little words like can't."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            option_audio: false
            text: "It's sunny.\n\nWelches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: sun }, { object: rain }, { object: snow }]
            answer: sun
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "I can sing.\n\nPasst der Satz zum Bild?"
            say: { de: "Lies den Satz. Passt er zum Bild?" }
            show: { object: sing }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "I can't swim."
            say: { de: "Lies diesen Satz. Was glaubst du: Kann das Kind schwimmen, ja oder nein?" }
          - text: "I can't swim."
            say: { de: "Nein! Achte auf kleine Wörter. „Can't“ heißt: kann nicht. „I can't swim“ heißt: Ich kann nicht schwimmen.", en: "I can't swim." }
            show: { object: swim }
          - text: "It isn't sunny. It's raining."
            say: { de: "„Isn't“ heißt: ist nicht. „It isn't sunny“ heißt: Es ist nicht sonnig. Es regnet.", en: "It isn't sunny. It's raining." }
            show: { object: rain }
          - text: "I'm not happy. I'm sad."
            say: { de: "„Not“ heißt nicht. Lies deshalb immer den ganzen Satz bis zum Punkt. Erst dann suchst du das Bild.", en: "I'm not happy. I'm sad." }
            show: { object: sad }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz passt zum Bild?"
                say: { de: "Schau dir das Bild an. Welcher Satz passt?" }
                show: { object: snow }
                options: ["It's snowing.", "It's raining.", "It's sunny."]
                answer: "It's snowing."
                hints:
                  - "Wie ist das Wetter auf dem Bild?"
                  - "Auf dem Bild schneit es."
                  - "It's snowing."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "It isn't windy.\n\nPasst der Satz zum Bild?"
                say: { de: "Lies den Satz. Passt er zum Bild?" }
                show: { object: wind }
                answer: false
                hints:
                  - "Achte auf „isn't“."
                  - "„It isn't windy“ heißt: Es ist nicht windig."
                  - "Auf dem Bild ist es windig. Der Satz passt nicht."
              - id: l2-f3
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Lies die Sätze. Tippe auf einen Satz und dann auf das passende Bild." }
                pairs:
                  - left: { text: "I can sing." }
                    right: { object: sing }
                  - left: { text: "I can paint." }
                    right: { object: paint }
                  - left: { text: "I can read." }
                    right: { object: read }
                hints:
                  - "Alle Sätze fangen mit „I can“ an. Lies das letzte Wort."
                  - "„Paint“ heißt malen."
                  - "„Sing“ ist singen, „paint“ ist malen, „read“ ist lesen."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz passt zum Bild?"
                say: { de: "Schau dir das Bild an. Welcher Satz passt?" }
                show: { object: jacket, colour: red }
                options: ["I've got a red jacket.", "I've got a red jumper.", "I've got a blue jacket."]
                answer: "I've got a red jacket."
                feedback:
                  "I've got a red jumper.": "Die Farbe stimmt. Aber ein „jumper“ ist ein Pullover. Auf dem Bild ist eine Jacke."
                hints:
                  - "Was ist auf dem Bild, und welche Farbe hat es?"
                  - "Es ist eine rote Jacke."
                  - "„Jacket“ ist die Jacke: I've got a red jacket."
              - id: l2-f5
                type: image_multiple_choice
                option_audio: false
                text: "I'm not happy. I'm angry.\n\nWelches Bild passt?"
                say: { de: "Lies die Sätze. Welches Bild passt?" }
                options: [{ object: angry }, { object: happy }, { object: sad }]
                answer: angry
                feedback:
                  happy: "Lies genau: „I'm not happy.“ Das Kind ist nicht froh. Lies weiter."
                hints:
                  - "Achte auf das kleine Wort „not“."
                  - "Lies den zweiten Satz: „I'm angry.“"
                  - "„Angry“ heißt wütend."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz passt zum Bild?"
                say: { de: "Schau dir das Bild an. Welcher Satz passt?" }
                show: { object: firefighter }
                options: ["I'm a firefighter.", "I'm a farmer.", "I'm a doctor."]
                answer: "I'm a firefighter."
                hints: ["Wer löscht Feuer?"]
              - id: l2-s2
                type: true_false
                text: "It isn't raining.\n\nPasst der Satz zum Bild?"
                say: { de: "Lies den Satz. Passt er zum Bild?" }
                show: { object: sun }
                answer: true
                hints: ["„It isn't raining“ heißt: Es regnet nicht."]
              - id: l2-s3
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Lies die Sätze. Tippe auf einen Satz und dann auf das passende Bild." }
                pairs:
                  - left: { text: "It's sunny." }
                    right: { object: sun }
                  - left: { text: "It's snowing." }
                    right: { object: snow }
                  - left: { text: "It's windy." }
                    right: { object: wind }
                hints: ["„Sunny“ kommt von „sun“, „snowing“ von „snow“, „windy“ von „wind“."]
              - id: l2-s4
                type: image_multiple_choice
                option_audio: false
                text: "I can't swim. I can ride a bike.\n\nWas kann das Kind?"
                say: { de: "Lies die Sätze. Was kann das Kind?" }
                options: [{ object: swim }, { object: ride-bike }, { object: dance }]
                answer: ride-bike
                hints: ["„Can't“ heißt: kann nicht. Lies den zweiten Satz."]
              - id: l2-s5
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz passt zum Bild?"
                say: { de: "Schau dir das Bild an. Welcher Satz passt?" }
                show: { object: skirt, colour: blue }
                options: ["I've got a blue skirt.", "I've got a blue dress.", "I've got a green skirt."]
                answer: "I've got a blue skirt."
                hints: ["„Skirt“ ist der Rock, „dress“ das Kleid."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz passt zum Bild?"
                say: { de: "Schau dir das Bild an. Welcher Satz passt?" }
                show: { object: scared }
                options: ["I'm scared.", "I'm sad.", "I'm happy."]
                answer: "I'm scared."
              - id: l2-n2
                type: true_false
                text: "I can't read.\n\nPasst der Satz zum Bild?"
                say: { de: "Lies den Satz. Passt er zum Bild?" }
                show: { object: read }
                answer: false
              - id: l2-n3
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Lies die Sätze. Tippe auf einen Satz und dann auf das passende Bild." }
                pairs:
                  - left: { text: "I'm a teacher." }
                    right: { object: teacher }
                  - left: { text: "I'm a cook." }
                    right: { object: cook }
                  - left: { text: "I'm a farmer." }
                    right: { object: farmer }
              - id: l2-n4
                type: image_multiple_choice
                option_audio: false
                text: "It isn't sunny. It's snowing.\n\nWelches Bild passt?"
                say: { de: "Lies die Sätze. Welches Bild passt?" }
                options: [{ object: sun }, { object: snow }, { object: rain }]
                answer: snow
              - id: l2-n5
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz passt zum Bild?"
                say: { de: "Schau dir das Bild an. Welcher Satz passt?" }
                show: { object: ball, colour: green }
                options: ["I've got a green ball.", "I've got a green balloon.", "I've got a yellow ball."]
                answer: "I've got a green ball."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: to-picture
            type: image_multiple_choice
            option_audio: false
            text: "I've got a pink T-shirt.\n\nWelches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: t-shirt, colour: pink, key: pink-t-shirt }, { object: t-shirt, colour: purple, key: purple-t-shirt }, { object: balloon, colour: pink, key: pink-balloon }]
            answer: pink-t-shirt
          - id: l2-c2
            part: negative
            type: true_false
            text: "It isn't snowing.\n\nPasst der Satz zum Bild?"
            say: { de: "Lies den Satz. Passt er zum Bild?" }
            show: { object: snow }
            answer: false
          - id: l2-c3
            part: to-sentence
            type: multiple_choice
            option_audio: false
            text: "Welcher Satz passt zum Bild?"
            say: { de: "Schau dir das Bild an. Welcher Satz passt?" }
            show: { object: play-tennis }
            options: ["I can play tennis.", "I can play football.", "I can't play tennis."]
            answer: "I can play tennis."
          - id: l2-c4
            part: to-picture
            type: matching
            option_audio: false
            text: "Wie geht es den Kindern? Was passt zusammen?"
            say: { de: "Lies, wie es den Kindern geht. Tippe auf einen Satz und dann auf das passende Bild." }
            pairs:
              - left: { text: "I'm happy." }
                right: { object: happy }
              - left: { text: "I'm tired." }
                right: { object: tired }
              - left: { text: "I'm angry." }
                right: { object: angry }
          - id: l2-c5
            part: negative
            type: image_multiple_choice
            option_audio: false
            text: "I'm not a doctor. I'm a police officer.\n\nWelches Bild passt?"
            say: { de: "Lies die Sätze. Welches Bild passt?" }
            options: [{ object: police-officer }, { object: doctor }, { object: firefighter }]
            answer: police-officer
          - id: l2-c6
            part: to-picture
            type: image_multiple_choice
            option_audio: false
            text: "I've got a green balloon.\n\nWelches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: ball, colour: green, key: green-ball }, { object: balloon, colour: green, key: green-balloon }, { object: balloon, colour: red, key: red-balloon }]
            answer: green-balloon
          - id: l2-c7
