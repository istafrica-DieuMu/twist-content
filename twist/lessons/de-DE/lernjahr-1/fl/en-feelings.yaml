# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-feelings
skill: fl.themes.feelings
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Gefühle auf Englisch
  en: Feelings in English
summary: >
  Saying how you feel and asking others. Lesson 1 brings happy, sad,
  angry, tired and scared with "I'm …"; lesson 2 asks "Are you …?" with
  the short answers "Yes, I am." and "No, I'm not.", and ends with the
  skill check. Instructions are in German; the English is spoken and
  shown in short form.
metadata:
  year: lernjahr-1
  topic: { de: Gefühle, en: Feelings }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks, fl.speaking.greet]
  also_practises: [fl.grammar.chunks, fl.grammar.questions]
  vocabulary: { en: [happy, sad, angry, tired, scared, "I'm …", "Are you …?", "Yes, I am.", "No, I'm not."] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: words, what: { de: Gefühlswörter auf Englisch verstehen, en: understanding feelings words in English } }
    - { id: say, what: { de: "sagen, wie ich mich fühle (I'm …)", en: "saying how I feel (I'm …)" } }
    - { id: ask, what: { de: "fragen, wie sich jemand fühlt (Are you …?)", en: "asking how someone feels (Are you …?)" } }
    - { id: answer, what: { de: "kurz mit Ja oder Nein antworten (Yes, I am. No, I'm not.)", en: "giving a short yes or no answer (Yes, I am. No, I'm not.)" } }
  misconceptions:
    - id: i-have-feeling
      what: Says "I have tired" after the German "ich habe Angst" or with the wrong verb
      addressed: lesson 1 Learn uses "I'm" for every feeling; a "Wie sagst du" task in every stage of lesson 1 offers "I have …", with feedback in l1-f3
    - id: short-answer
      what: Answers "Are you …?" with "Yes, I do." or "Yes, I'm."
      addressed: lesson 2 Learn models "Yes, I am." and "No, I'm not."; a short-answer task in every stage of lesson 2 offers "Yes, I do." or "Yes, I'm.", with feedback in l2-f1 and l2-s1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "I'm happy.", en: "I'm happy." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Ich bin neun“?"
            say: "Wie sagst du auf Englisch: Ich bin neun?"
            options: ["I'm nine.", "I have nine.", "I can nine."]
            answer: "I'm nine."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie fragst du auf Englisch: „Wie geht es dir?“"
            say: "Wie fragst du auf Englisch: Wie geht es dir?"
            options: ["How are you?", "How old are you?", "Who are you?"]
            answer: "How are you?"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "So sagst du, wie du dich fühlst. Hör zu und sprich nach.", en: "I'm happy." }
            show: { object: happy }
          - say: { en: "I'm sad." }
            show: { object: sad }
          - say: { en: "I'm angry." }
            show: { object: angry }
          - say: { en: "I'm tired." }
            show: { object: tired }
          - say: { de: "Und wenn du Angst hast, sagst du:", en: "I'm scared." }
            show: { object: scared }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Wie fühlt sich das Kind?"
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm tired.", speaker: male }
                options: [{ object: tired }, { object: sad }, { object: happy }]
                answer: tired
                hints:
                  - "Hör noch einmal: tired."
                  - "„Tired“ heißt müde."
                  - "Tippe auf das gähnende Kind."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Wie fühlt sich das Kind?"
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm angry.", speaker: female }
                options: [{ object: happy }, { object: scared }, { object: angry }]
                answer: angry
                hints:
                  - "Hör noch einmal: angry."
                  - "„Angry“ heißt wütend."
                  - "Tippe auf das wütende Kind."
              - id: l1-f3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Ich habe Angst“?"
                say: "Wie sagst du auf Englisch: Ich habe Angst?"
                options: ["I'm scared.", "I have scared.", "I scared."]
                answer: "I'm scared."
                option_audio: false
                feedback:
                  "I have scared.": "Auf Englisch sagst du hier „I'm“, also ich bin: I'm scared."
                hints:
                  - "Auf Englisch sagst du nicht „habe“, sondern „bin“."
                  - "„I'm“ heißt ich bin."
                  - "I'm scared."
              - id: l1-f4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "I'm happy." }
                show: { object: happy }
                expected_text: "I'm happy."
                hints:
                  - "Hör noch einmal zu: I'm happy."
                  - "Zuerst „I'm“, dann „happy“."
                  - "Sag mit mir: I'm happy."
              - id: l1-f5
                type: true_false
                text: "Passt der Satz zum Bild?"
                say: { de: "Hör zu. Passt der Satz zum Bild?" }
                audio: { en: "I'm sad.", speaker: female }
                show: { object: sad }
                answer: true
                hints:
                  - "Hör noch einmal: sad."
                  - "„Sad“ heißt traurig."
                  - "Ja, das passt."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Wie fühlt sich das Kind?"
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm scared.", speaker: male }
                options: [{ object: tired }, { object: scared }, { object: angry }]
                answer: scared
                hints: ["„Scared“ heißt: Angst haben."]
              - id: l1-s2
                type: audio_choice
                text: "Wie fühlt sich das Kind?"
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm happy.", speaker: female }
                options: [{ object: sad }, { object: angry }, { object: happy }]
                answer: happy
                hints: ["„Happy“ heißt fröhlich."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Ich bin müde“?"
                say: "Wie sagst du auf Englisch: Ich bin müde?"
                options: ["I have tired.", "I'm tired.", "I tired."]
                answer: "I'm tired."
                option_audio: false
                hints: ["Mit welchem Wort fängt der Satz an?"]
              - id: l1-s4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "I'm angry." }
                show: { object: angry }
                expected_text: "I'm angry."
                hints: ["Zuerst „I'm“."]
              - id: l1-s5
                type: true_false
                text: "Passt der Satz zum Bild?"
                say: { de: "Hör zu. Passt der Satz zum Bild?" }
                audio: { en: "I'm happy.", speaker: male }
                show: { object: tired }
                answer: false
                hints: ["Wie sieht das Kind aus?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Wie fühlt sich das Kind?"
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm sad.", speaker: male }
                options: [{ object: happy }, { object: sad }, { object: scared }]
                answer: sad
              - id: l1-n2
                type: audio_choice
                text: "Wie fühlt sich das Kind?"
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm angry.", speaker: male }
                options: [{ object: angry }, { object: tired }, { object: sad }]
                answer: angry
              - id: l1-n3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Ich bin traurig“?"
                say: "Wie sagst du auf Englisch: Ich bin traurig?"
                options: ["I sad.", "I have sad.", "I'm sad."]
                answer: "I'm sad."
                option_audio: false
              - id: l1-n4
                type: speak
                say: { de: "Wie fühlt sich das Kind? Sag es auf Englisch mit „I'm“." }
                show: { object: scared }
                expected_text: "I'm scared."
              - id: l1-n5
                type: true_false
                text: "Passt der Satz zum Bild?"
                say: { de: "Hör zu. Passt der Satz zum Bild?" }
                audio: { en: "I'm tired.", speaker: female }
                show: { object: tired }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Welches Bild passt?"
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "I'm scared.", speaker: female }
            options: [{ object: happy }, { object: scared }, { object: tired }]
            answer: scared
          - id: l1-c2
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Ich bin fröhlich“?"
            say: "Wie sagst du auf Englisch: Ich bin fröhlich?"
            options: ["I'm happy.", "I have happy.", "I'm sad."]
            answer: "I'm happy."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Passt der Satz zum Bild?"
            say: { de: "Hör zu. Passt der Satz zum Bild?" }
            audio: { en: "I'm angry.", speaker: male }
            show: { object: sad }
            answer: false
          - id: l1-c4
            type: matching
            text: "Was passt zusammen?"
            say: "Verbinde jedes englische Wort mit dem deutschen."
            pairs:
              - { left: { text: "tired" }, right: { text: "müde" } }
              - { left: { text: "sad" }, right: { text: "traurig" } }
              - { left: { text: "angry" }, right: { text: "wütend" } }
          - id: l1-c5
            type: true_false
            text: "Ist das Kind müde?"
            say: { de: "Hör zu. Ist das Kind müde?" }
            audio: { en: "I'm tired.", speaker: female }
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Was sagt das Kind?"
            say: "Schau dir das Kind an. Was sagt es auf Englisch?"
            show: { object: tired }
            options: ["I'm angry.", "I have tired.", "I'm tired."]
            answer: "I'm tired."
            option_audio: false

  - n: 2
    title: { de: "Are you tired?", en: "Are you tired?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Wie fühlt sich das Kind?"
            say: { de: "Hör zu. Wie fühlt sich das Kind?" }
            audio: { en: "I'm happy.", speaker: male }
            options: [{ object: happy }, { object: angry }, { object: scared }]
            answer: happy
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Ich bin wütend“?"
            say: "Wie sagst du auf Englisch: Ich bin wütend?"
            options: ["I'm angry.", "I'm tired.", "I have angry."]
            answer: "I'm angry."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Are you happy? Yes, I am."
            say: { de: "So fragst du, wie sich jemand fühlt, und so antwortest du mit Ja:", en: "Are you happy? Yes, I am." }
            show: { object: happy }
          - text: "Are you sad? No, I'm not."
            say: { de: "Und so antwortest du mit Nein:", en: "Are you sad? No, I'm not." }
            show: { object: happy }
          - text: "Are you …? → Yes, I am. / No, I'm not."
            say: { de: "Die Frage beginnt mit „Are you“. In der Antwort sagst du „I am“ oder „I'm not“." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "„Are you tired?“ Du bist müde. Was antwortest du?"
                say: { de: "Du bist müde. Was antwortest du auf diese Frage?", en: "Are you tired?" }
                show: { object: tired }
                options: ["Yes, I am.", "Yes, I do.", "No, I'm not."]
                answer: "Yes, I am."
                option_audio: false
                feedback:
                  "Yes, I do.": "Die Frage beginnt mit „Are you“. Dann antwortest du mit „I am“: Yes, I am."
                hints:
                  - "Du bist müde, also „Yes“."
                  - "Die Antwort hat „am“."
                  - "Yes, I am."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Was fragt das Kind?"
                say: { de: "Hör zu. Was fragt das Kind?" }
                audio: { en: "Are you scared?", speaker: female }
                options: ["Hast du Angst?", "Bist du müde?", "Bist du traurig?"]
                answer: "Hast du Angst?"
                option_audio: false
                hints:
                  - "Hör auf das letzte Wort."
                  - "„Scared“ heißt Angst haben."
                  - "Hast du Angst?"
              - id: l2-f3
                type: ordering
                text: "Bau die Frage: Bist du fröhlich?"
                say: "Bau die Frage auf Englisch: Bist du fröhlich?"
                options: ["happy?", "Are", "you"]
                slot_count: 3
                answer: ["Are", "you", "happy?"]
                option_audio: false
                hints:
                  - "Die Frage beginnt mit „Are“."
                  - "Dann kommt „you“."
                  - "Are you happy?"
              - id: l2-f4
                type: multiple_choice
                text: "„Are you angry?“ Du bist nicht wütend. Was antwortest du?"
                say: { de: "Du bist nicht wütend. Was antwortest du auf diese Frage?", en: "Are you angry?" }
                show: { object: happy }
                options: ["No, I'm not.", "Yes, I am.", "No, I don't."]
                answer: "No, I'm not."
                option_audio: false
                hints:
                  - "Du bist nicht wütend, also „No“."
                  - "Nach „No“ kommt „I'm not“."
                  - "No, I'm not."
              - id: l2-f5
                type: speak
                say: { de: "Frag auf Englisch: Bist du müde?", en: "Are you tired?" }
                show: { object: tired }
                expected_text: "Are you tired?"
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „Are you“, dann „tired“."
                  - "Sag mit mir: Are you tired?"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "„Are you sad?“ Du bist traurig. Was antwortest du?"
                say: { de: "Du bist traurig. Was antwortest du auf diese Frage?", en: "Are you sad?" }
                show: { object: sad }
                options: ["Yes, I'm.", "Yes, I am.", "No, I'm not."]
                answer: "Yes, I am."
                option_audio: false
                feedback:
                  "Yes, I'm.": "Am Ende der kurzen Antwort sagst du „I am“, nicht „I'm“: Yes, I am."
                hints: ["Ja oder Nein? Dann schau dir das Ende der Antworten genau an."]
              - id: l2-s2
                type: audio_choice
                text: "Was fragt das Kind?"
                say: { de: "Hör zu. Was fragt das Kind?" }
                audio: { en: "Are you happy?", speaker: male }
                options: ["Bist du wütend?", "Bist du fröhlich?", "Hast du Angst?"]
                answer: "Bist du fröhlich?"
                option_audio: false
                hints: ["Hör auf das letzte Wort."]
              - id: l2-s3
                type: ordering
                text: "Bau die Frage: Bist du traurig?"
                say: "Bau die Frage auf Englisch: Bist du traurig?"
                options: ["you", "sad?", "Are"]
                slot_count: 3
                answer: ["Are", "you", "sad?"]
                option_audio: false
                hints: ["Mit welchem Wort fängt die Frage an?"]
              - id: l2-s4
                type: multiple_choice
                text: "„Are you scared?“ Du hast keine Angst. Was antwortest du?"
                say: { de: "Du hast keine Angst. Was antwortest du auf diese Frage?", en: "Are you scared?" }
                show: { object: happy }
                options: ["Yes, I am.", "No, I'm not.", "No, I can't."]
                answer: "No, I'm not."
                option_audio: false
                hints: ["Ja oder Nein?"]
              - id: l2-s5
                type: speak
                say: { de: "Frag auf Englisch: Bist du wütend?", en: "Are you angry?" }
                show: { object: angry }
                expected_text: "Are you angry?"
                hints: ["Die Frage beginnt mit „Are you“."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "„Are you happy?“ Du bist fröhlich. Was antwortest du?"
                say: { de: "Du bist fröhlich. Was antwortest du auf diese Frage?", en: "Are you happy?" }
                show: { object: happy }
                options: ["Yes, I do.", "No, I'm not.", "Yes, I am."]
                answer: "Yes, I am."
                option_audio: false
              - id: l2-n2
                type: audio_choice
                text: "Was fragt das Kind?"
                say: { de: "Hör zu. Was fragt das Kind?" }
                audio: { en: "Are you angry?", speaker: female }
                options: ["Bist du wütend?", "Bist du müde?", "Bist du traurig?"]
                answer: "Bist du wütend?"
                option_audio: false
              - id: l2-n3
                type: ordering
                text: "Bau die Frage: Hast du Angst?"
                say: "Bau die Frage auf Englisch: Hast du Angst?"
                options: ["scared?", "you", "Are"]
                slot_count: 3
                answer: ["Are", "you", "scared?"]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "„Are you tired?“ Du bist nicht müde. Was antwortest du?"
                say: { de: "Du bist nicht müde. Was antwortest du auf diese Frage?", en: "Are you tired?" }
                show: { object: happy }
                options: ["No, I'm not.", "No, I don't.", "Yes, I am."]
                answer: "No, I'm not."
                option_audio: false
              - id: l2-n5
                type: speak
                say: { de: "Frag ein anderes Kind auf Englisch, ob es traurig ist." }
                show: { object: sad }
                expected_text: "Are you sad?"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: words
            type: audio_choice
            text: "Wie fühlt sich das Kind?"
            say: { de: "Hör zu. Wie fühlt sich das Kind?" }
            audio: { turns: [{ en: "Are you happy?", speaker: female }, { en: "No, I'm not. I'm tired.", speaker: male }] }
            options: [{ object: happy }, { object: tired }, { object: angry }]
            answer: tired
          - id: l2-c2
            part: say
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Kind an. Was sagt es auf Englisch?"
            show: { object: scared }
            options: ["I'm sad.", "I'm tired.", "I'm scared."]
            answer: "I'm scared."
            option_audio: false
          - id: l2-c3
            part: answer
            type: multiple_choice
            text: "„Are you sad?“ Du bist nicht traurig. Was antwortest du?"
            say: { de: "Du bist nicht traurig. Was antwortest du?", en: "Are you sad?" }
            show: { object: happy }
            options: ["No, I'm not.", "Yes, I am.", "No, I am."]
            answer: "No, I'm not."
            option_audio: false
          - id: l2-c4
            part: ask
            type: audio_choice
            text: "Was fragt das Kind?"
            say: { de: "Hör zu. Was fragt das Kind?" }
            audio: { en: "Are you tired?", speaker: male }
            options: ["Bist du fröhlich?", "Bist du müde?", "Hast du Angst?"]
            answer: "Bist du müde?"
            option_audio: false
          - id: l2-c6
            part: words
            type: matching
            text: "Welches Wort passt zu welchem Bild?"
            say: "Verbinde jedes Bild mit dem englischen Wort."
            pairs:
              - { left: { object: happy }, right: { text: "happy" } }
              - { left: { object: sad }, right: { text: "sad" } }
              - { left: { object: angry }, right: { text: "angry" } }
              - { left: { object: scared }, right: { text: "scared" } }
          - id: l2-c7
            part: words
            type: audio_choice
            text: "Was heißt das auf Deutsch?"
            say: { de: "Hör zu. Was heißt das auf Deutsch?" }
            audio: { en: "Tired." }
            options: ["traurig", "müde", "wütend"]
            answer: "müde"
          - id: l2-c8
            part: words
            type: true_false
            text: "Ist Tom fröhlich?"
            say: { de: "Hör zu. Ist Tom fröhlich?" }
            audio: { en: "Hi, I'm Tom. I'm happy today.", speaker: male }
            answer: true
          - id: l2-c9
            part: words
            type: multiple_choice
            text: "Wie fühlt sich das Kind? Tippe auf das englische Wort."
            say: "Wie fühlt sich das Kind? Tippe auf das englische Wort."
            show: { object: angry }
            options: ["tired", "happy", "angry"]
            answer: "angry"
            option_audio: false
          - id: l2-c10
            part: say
            type: ordering
            text: "Bau den Satz: Ich bin nicht traurig."
            say: "Bau den Satz auf Englisch: Ich bin nicht traurig."
            options: ["sad.", "I'm", "not"]
            slot_count: 3
            answer: ["I'm", "not", "sad."]
            option_audio: false
          - id: l2-c11
            part: say
            type: multiple_choice
            text: "Ben hat Geburtstag und freut sich. Was sagt er?"
            say: "Ben hat Geburtstag und freut sich. Was sagt er?"
            options: ["I'm sad.", "I have happy.", "I'm happy."]
            answer: "I'm happy."
            option_audio: false
          - id: l2-c12
            part: say
            type: fill_in_blank
            text: "Ergänze den Satz: Ich bin müde."
            say: "Ergänze den Satz: Ich bin müde."
            frame: "_ tired."
            options: ["I'm", "I have", "I"]
            answer: ["I'm"]
            option_audio: false
          - id: l2-c13
            part: say
            type: multiple_choice
            text: "Du hast im Dunkeln Angst. Was sagst du?"
            say: "Du hast im Dunkeln Angst. Was sagst du?"
            options: ["I'm tired.", "I scared.", "I'm scared."]
            answer: "I'm scared."
            option_audio: false
          - id: l2-c14
            part: ask
            type: multiple_choice
            text: "Du willst wissen, ob deine Freundin müde ist. Was fragst du?"
            say: "Du willst wissen, ob deine Freundin müde ist. Was fragst du?"
            options: ["Is you tired?", "Are you tired?", "Do you tired?"]
            answer: "Are you tired?"
            option_audio: false
          - id: l2-c15
            part: ask
            type: fill_in_blank
            text: "Ergänze die Frage: Bist du traurig?"
            say: "Ergänze die Frage: Bist du traurig?"
            frame: "_ you sad?"
            options: ["Is", "Do", "Are"]
            answer: ["Are"]
            option_audio: false
          - id: l2-c16
            part: ask
            type: true_false
