# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-town
skill: fl.themes.town
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: In der Stadt
  en: In town
summary: >
  Places in town and simple directions. Lesson 1 learns the places
  (school, park, shop, library, station, swimming pool, bus stop) and what
  you do there; lesson 2 understands turn left, turn right and go straight
  on, follows a short way to a place, and ends with the skill check. The
  places are shown as pictures (the bus stop as its sign). Directions are shown as arrows. Following a way on a map waits for a map
  component.
metadata:
  year: lernjahr-1
  topic: { de: In der Stadt, en: In town }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.questions]
  also_practises: [fl.listening.details, fl.listening.short-dialogues]
  vocabulary: { en: [school, park, shop, library, station, swimming pool, bus stop, turn left, turn right, go straight on, "Excuse me, where's ...?"] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: left-right
      what: Mixes up left and right
      addressed: lesson 2 Learn links left with links (both start with l); l2-f2 gives feedback when the left arrow is tapped for turn right, and every stage of lesson 2 and the skill check asks for both
    - id: shop-stop
      what: Hears shop and bus stop as the same word
      addressed: lesson 1 Learn says shop and stop sound alike; l1-f3 gives feedback when the bus stop sign is chosen for shop, and l1-c1 asks for bus stop with the shop among the options
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Orte in der Stadt", en: "Places in town" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Was wird gefragt?" }
            audio: { en: "Where's the bus?" }
            options: ["Wo ist der Bus?", "Was ist das?", "Wie alt bist du?"]
            answer: "Wo ist der Bus?"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Wo ist der Hund?" }
            audio: { en: "Where's the dog? He's in the garden." }
            options: [{ object: garden }, { object: kitchen }, { object: bedroom }]
            answer: garden
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "school, park, shop"
            say: { de: "Das sind Orte in der Stadt. „School“ ist die Schule, „park“ der Park, „shop“ der Laden.", en: "School. Park. Shop." }
            show: { objects: [school, park, shop] }
          - text: "library, station, swimming pool"
            say: { de: "„Library“ ist die Bücherei, „station“ der Bahnhof, „swimming pool“ das Schwimmbad.", en: "Library. Station. Swimming pool." }
            show: { objects: [library, station, swimming-pool] }
          - text: "bus stop, shop"
            say: { de: "„Bus stop“ ist die Bushaltestelle. Dort wartest du auf den Bus. Hör genau hin: „stop“ und „shop“ klingen ähnlich.", en: "Bus stop. Shop." }
            show: { objects: [sign-bus-stop, shop] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Welcher Ort ist das?" }
                audio: { en: "School." }
                options: [{ object: school }, { object: park }, { object: shop }]
                answer: school
                hints:
                  - "Hör noch einmal: „school“."
                  - "„School“ klingt fast wie Schule."
                  - "„School“ ist die Schule."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Welcher Ort ist das?" }
                audio: { en: "Library." }
                options: [{ object: library }, { object: station }, { object: school }]
                answer: library
                hints:
                  - "Dort gibt es viele Bücher zum Ausleihen."
                  - "„Library“ ist ein neues Wort. Es klingt nicht wie ein deutsches."
                  - "„Library“ ist die Bücherei."
              - id: l1-f3
                type: audio_choice
                say: { de: "Hör zu. Welcher Ort ist das?" }
                audio: { en: "Shop." }
                options: [{ object: shop }, { object: sign-bus-stop }, { object: park }]
                answer: shop
                feedback:
                  sign-bus-stop: "Du hast shop gehört, mit sch am Anfang. Die Bushaltestelle heißt bus stop."
                hints:
                  - "Hör auf den Anfang: sch oder st?"
                  - "Es war „shop“, mit sch."
                  - "„Shop“ ist der Laden."
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "Wo kannst du schwimmen?"
                say: { de: "Wo kannst du schwimmen? Lies die Antworten." }
                options: ["at the swimming pool", "at the library", "at the station"]
                answer: "at the swimming pool"
                hints:
                  - "In welchem Wort steckt „swim“?"
                  - "„Swimming“ kommt von „swim“."
                  - "„At the swimming pool“ heißt: im Schwimmbad."
              - id: l1-f5
                type: speak
                say: { de: "Sag auf Englisch: der Park.", en: "Park." }
                show: { object: park }
                expected_text: "park"
                hints:
                  - "Es klingt fast wie im Deutschen."
                  - "Das a ist lang: paak."
                  - "Sag mit mir: park."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Welcher Ort ist das?" }
                audio: { en: "Station." }
                options: [{ object: station }, { object: library }, { object: school }]
                answer: station
                hints: ["An diesem Ort hält der Zug."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Wo leihst du Bücher aus?"
                say: { de: "Wo leihst du Bücher aus? Lies die Antworten." }
                options: ["at the library", "at the park", "at the bus stop"]
                answer: "at the library"
                hints: ["Bücherei heißt „library“."]
              - id: l1-s3
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Lies die Wörter. Tippe auf ein Wort und dann auf das Bild." }
                pairs:
                  - left: { text: "school" }
                    right: { object: school }
                  - left: { text: "park" }
                    right: { object: park }
                  - left: { text: "station" }
                    right: { object: station }
                hints: ["„School“ und „park“ klingen fast wie im Deutschen."]
              - id: l1-s4
                type: audio_choice
                say: { de: "Hör zu. Wo ist Tom?" }
                audio: { en: "Where's Tom? He's at the park." }
                options: [{ object: park }, { object: school }, { object: station }]
                answer: park
                hints: ["Hör auf das letzte Wort."]
              - id: l1-s5
                type: speak
                say: { de: "Sag auf Englisch: die Schule.", en: "School." }
                show: { object: school }
                expected_text: "school"
                hints: ["Sag mit mir: „school“. Es fängt mit sk an."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Welcher Ort ist das?" }
                audio: { en: "Swimming pool." }
                options: [{ object: swimming-pool }, { object: park }, { object: station }]
                answer: swimming-pool
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Wo kaufst du Brot und Milch?"
                say: { de: "Wo kaufst du Brot und Milch? Lies die Antworten." }
                options: ["at the shop", "at the school", "at the library"]
                answer: "at the shop"
              - id: l1-n3
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Lies die Wörter. Tippe auf ein Wort und dann auf das Bild." }
                pairs:
                  - left: { text: "shop" }
                    right: { object: shop }
                  - left: { text: "library" }
                    right: { object: library }
                  - left: { text: "bus stop" }
                    right: { object: sign-bus-stop }
              - id: l1-n4
                type: audio_choice
                say: { de: "Hör zu. Wo ist Mama?" }
                audio: { en: "Where's Mum? She's at the station." }
                options: [{ object: station }, { object: shop }, { object: library }]
                answer: station
              - id: l1-n5
                type: true_false
                text: "You can read books at the library."
                say: { de: "Lies den Satz. Stimmt das?" }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Welcher Ort ist das?" }
            audio: { en: "Bus stop." }
            options: [{ object: sign-bus-stop }, { object: shop }, { object: station }]
            answer: sign-bus-stop
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Wo lernst du lesen und schreiben?"
            say: { de: "Wo lernst du lesen und schreiben? Lies die Antworten." }
            options: ["at school", "at the park", "at the station"]
            answer: "at school"
          - id: l1-c3
            type: true_false
            text: "You can swim at the library."
            say: { de: "Lies den Satz. Stimmt das?" }
            answer: false

  - n: 2
    title: { de: "Nach dem Weg fragen", en: "Asking the way" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Welcher Ort ist das?" }
            audio: { en: "Park." }
            options: [{ object: park }, { object: shop }, { object: school }]
            answer: park
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "Wo wartest du auf den Bus?"
            say: { de: "Wo wartest du auf den Bus? Lies die Antworten." }
            options: ["at the bus stop", "at the shop", "at the swimming pool"]
            answer: "at the bus stop"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "turn left ←"
            say: { de: "So zeigt man den Weg. „Turn left“ heißt: links abbiegen. „Left“ und links fangen beide mit l an.", en: "Turn left." }
          - text: "turn right →"
            say: { de: "„Turn right“ heißt: rechts abbiegen.", en: "Turn right." }
          - text: "go straight on ↑"
            say: { de: "„Go straight on“ heißt: geradeaus gehen. Nach dem Weg fragst du mit „Excuse me, where's …?“", en: "Excuse me, where's the park? Go straight on, then turn left." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Emma fragt nach dem Weg. Hör zu. Welcher Pfeil passt?" }
                audio: { en: "Turn left." }
                options: ["←", "→", "↑"]
                answer: "←"
                hints:
                  - "„Left“ und links fangen gleich an."
                  - "„Turn left“ heißt links abbiegen."
                  - "Tippe auf den Pfeil nach links."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { de: "Hör zu. Welcher Pfeil passt?" }
                audio: { en: "Turn right." }
                options: ["→", "←", "↑"]
                answer: "→"
                feedback:
                  "←": "Das ist links, „left“. „Right“ heißt rechts."
                hints:
                  - "Hör genau: „left“ oder „right“?"
                  - "Es war „right“."
                  - "„Right“ heißt rechts. Tippe auf den Pfeil nach rechts."
              - id: l2-f3
                type: audio_choice
                say: { de: "Hör zu. Welcher Pfeil passt?" }
                audio: { en: "Go straight on." }
                options: ["↑", "←", "→"]
                answer: "↑"
                hints:
                  - "Hier biegst du nicht ab."
                  - "„Straight on“ heißt geradeaus."
                  - "Tippe auf den Pfeil nach oben."
              - id: l2-f4
                type: audio_choice
                say: { de: "Hör zu. Wie kommt Emma zur Bücherei?" }
                audio: { en: "Excuse me, where's the library? Go straight on, then turn left." }
                options: ["geradeaus, dann links", "geradeaus, dann rechts", "links, dann geradeaus"]
                answer: "geradeaus, dann links"
                hints:
                  - "Hör auf zwei Schritte: Was kommt zuerst, was danach?"
                  - "Zuerst „go straight on“, dann „turn left“."
                  - "Geradeaus, dann links."
              - id: l2-f5
                type: speak
                say: { de: "Sag auf Englisch: Bieg rechts ab.", en: "Turn right." }
                expected_text: "Turn right."
                hints:
                  - "Abbiegen heißt „turn“."
                  - "Rechts heißt „right“."
                  - "Sag mit mir: Turn right."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Wo biegt Emma links ab?" }
                audio: { en: "Go straight on, and turn left at the park." }
                options: [{ object: park }, { object: school }, { object: station }]
                answer: park
                hints: ["Hör auf das Ende: at the ..."]
              - id: l2-s2
                type: multiple_choice
                option_audio: false
                text: "→"
                say: { de: "Was sagst du zu diesem Pfeil?" }
                options: ["Turn right.", "Turn left.", "Go straight on."]
                answer: "Turn right."
                hints: ["Der Pfeil zeigt nach rechts."]
              - id: l2-s3
                type: audio_choice
                say: { de: "Hör zu. Wie kommt Emma zum Bahnhof?" }
                audio: { en: "The station? Turn right, then go straight on." }
                options: ["rechts, dann geradeaus", "links, dann geradeaus", "geradeaus, dann rechts"]
                answer: "rechts, dann geradeaus"
                hints: ["Was kommt zuerst: „turn right“ oder „go straight on“?"]
              - id: l2-s4
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Weg: Geh geradeaus, dann bieg links ab." }
                options: ["then", "turn left.", "Go straight on,"]
                slot_count: 3
                answer: ["Go straight on,", "then", "turn left."]
                hints: ["Zuerst geht es geradeaus."]
              - id: l2-s5
                type: true_false
                text: "→"
                say: { de: "Hör zu. Passt der Pfeil?", en: "Turn left." }
                answer: false
                hints: ["„Left“ heißt links."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Welcher Pfeil passt?" }
                audio: { en: "Turn right at the bus stop." }
                options: ["↑", "→", "←"]
                answer: "→"
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "←"
                say: { de: "Was sagst du zu diesem Pfeil?" }
                options: ["Turn left.", "Turn right.", "Go straight on."]
                answer: "Turn left."
              - id: l2-n3
                type: audio_choice
                say: { de: "Hör zu. Wie kommt Ben zum Schwimmbad?" }
                audio: { en: "Where's the swimming pool? Turn left, then turn right." }
                options: ["links, dann rechts", "rechts, dann links", "geradeaus, dann rechts"]
                answer: "links, dann rechts"
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Weg: Bieg rechts ab, dann geh geradeaus." }
                options: ["go straight on.", "then", "Turn right,"]
                slot_count: 3
                answer: ["Turn right,", "then", "go straight on."]
              - id: l2-n5
                type: true_false
                text: "↑"
                say: { de: "Hör zu. Passt der Pfeil?", en: "Go straight on." }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Wie kommt Mia zum Laden?" }
            audio: { en: "Excuse me, where's the shop? Turn right." }
            options: ["rechts", "links", "geradeaus"]
            answer: "rechts"
          - id: l2-c2
            type: multiple_choice
            option_audio: false
            text: "↑"
            say: { de: "Was sagst du zu diesem Pfeil?" }
            options: ["Go straight on.", "Turn left.", "Turn right."]
            answer: "Go straight on."
          - id: l2-c3
            type: audio_choice
            say: { de: "Hör zu. Wie kommt Tom zur Bücherei?" }
            audio: { en: "The library is next to the park. Go straight on, then turn right." }
            options: ["geradeaus, dann rechts", "geradeaus, dann links", "rechts, dann geradeaus"]
            answer: "geradeaus, dann rechts"
          - id: l2-c4
            type: audio_choice
            say: { de: "Hör zu. Wo ist Mia?" }
            audio: { en: "Where's Mia? She's at the library." }
            options: [{ object: library }, { object: shop }, { object: station }]
            answer: library
          - id: l2-c5
            type: true_false
            text: "←"
            say: { de: "Hör zu. Passt der Pfeil?", en: "Turn right." }
            answer: false
