# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-copy-words
skill: fl.writing.copy-words
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Wörter abschreiben
  en: Copying words
summary: >
  Copying familiar English words exactly and labelling pictures. Lesson 1
  copies short words on writing lines, lays them with letter cards, fills
  missing letters from a model and spots copying mistakes; lesson 2 labels
  pictures for a picture dictionary with longer words and double letters
  (rabbit, yellow, giraffe) and ends with the skill check. The model word is
  always on screen. Writing is traced with a finger; the app accepts any
  ink for now, so the skill check uses the card and choice tasks only.
metadata:
  year: lernjahr-1
  topic: { de: Schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.word-picture]
  also_practises: [fl.reading.sound-spelling]
  vocabulary: { en: [cat, sun, book, milk, frog, fish, duck, shoe, tree, apple, rabbit, yellow, school, pencil, jacket, orange, monkey, giraffe] }
  forms: [picture, text, drawn]
  drawn: [writing-lines, word-card]
  facets: []
  misconceptions:
    - id: writes-as-heard
      what: Writes the word the way it sounds in German (schu for shoe, scool for school) instead of copying it
      addressed: lesson 1 Learn says to copy what is written, not what is heard, with shoe as the example; l2-s1 and l2-n2 set sound spellings (schul, doktor) among the options
    - id: drops-letters
      what: Leaves out, adds or swaps letters, especially double letters (tre, forg, rabit)
      addressed: lesson 2 Learn counts double letters; l1-f2 (with feedback on forg), l2-f2 (with feedback on rabit), the true_false copy checks and the skill check all show copies with one letter wrong
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Genau abschreiben", en: "Copying exactly" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Lies das Wort. Welches Bild passt?"
            say: { de: "Lies das Wort. Welches Bild passt?" }
            show: { drawn: word-card, text: "cat" }
            options: [{ object: cat }, { object: car }, { object: cake }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "Welches Wort passt zum Bild?"
            say: { de: "Welches Wort passt zum Bild?" }
            show: { object: bus }
            options: ["bus", "bee", "bed"]
            answer: "bus"
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "Schau, schreib, vergleiche."
            say: { de: "So schreibst du ein Wort ab. Schau dir das Wort genau an. Schreib es Buchstabe für Buchstabe ab. Dann vergleichst du: Ist jeder Buchstabe da?" }
            show: { drawn: writing-lines, text: "dog", mode: copy, arrows: false }
          - text: "shoe"
            say: { de: "Englisch schreibt man oft anders, als man es spricht. Du hörst „schu“, aber du schreibst s, h, o, e. Schreib also ab, was da steht, nicht was du hörst.", en: "Shoe." }
            show: { object: shoe }
          - text: "tree: t r e e"
            say: { de: "Zähl die Buchstaben. „Tree“ hat vier Buchstaben, am Ende stehen zwei e." }
            show: { object: tree }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tracing
                text: "Schreib das Wort ab."
                say: { de: "Schreib das Wort ab." }
                show: { drawn: writing-lines, text: "cat", mode: copy, arrows: false }
                char: "cat"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Welches Wort ist richtig abgeschrieben?"
                say: { de: "Oben steht das Wort. Welches Wort ist richtig abgeschrieben?" }
                show: { drawn: word-card, text: "frog" }
                options: ["frog", "forg", "frg"]
                answer: "frog"
                feedback:
                  "forg": "Schau genau: Nach dem f kommt das r, dann das o."
                hints:
                  - "Vergleiche Buchstabe für Buchstabe mit dem Wort oben."
                  - "„Frog“ hat vier Buchstaben: f, r, o, g."
                  - "„Frog“ ist richtig."
              - id: l1-f3
                type: ordering
                option_audio: false
                text: "Leg das Wort mit den Buchstaben nach."
                say: { de: "Leg das Wort mit den Buchstaben nach." }
                show: { drawn: word-card, text: "fish" }
                options: ["s", "f", "h", "i"]
                slot_count: 4
                answer: ["f", "i", "s", "h"]
                hints:
                  - "Fang mit dem ersten Buchstaben des Wortes an."
                  - "Das Wort fängt mit f, i an."
                  - "f, i, s, h."
              - id: l1-f4
                type: fill_in_blank
                option_audio: false
                text: "Welche Buchstaben fehlen?"
                say: { de: "Oben steht das Wort. Welche Buchstaben fehlen?" }
                show: { drawn: word-card, text: "shoe" }
                frame: "s_o_"
                options: ["h", "e", "u", "c"]
                answer: ["h", "e"]
                hints:
                  - "Vergleiche mit dem Wort oben."
                  - "Nach dem s kommt ein h. Am Ende steht ein e."
                  - "s, h, o, e."
              - id: l1-f5
                type: tracing
                text: "Schreib das Wort ab."
                say: { de: "Schreib das Wort ab." }
                show: { drawn: writing-lines, text: "sun", mode: copy, arrows: false }
                char: "sun"

          - support: some
            tasks:
              - id: l1-s1
                type: tracing
                text: "Schreib das Wort ab."
                say: { de: "Schreib das Wort ab." }
                show: { drawn: writing-lines, text: "book", mode: copy, arrows: false }
                char: "book"
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Welches Wort ist richtig abgeschrieben?"
                say: { de: "Oben steht das Wort. Welches Wort ist richtig abgeschrieben?" }
                show: { drawn: word-card, text: "tree" }
                options: ["tree", "tre", "trea"]
                answer: "tree"
                hints: ["Zähl die e am Ende."]
              - id: l1-s3
                type: ordering
                option_audio: false
                text: "Leg das Wort mit den Buchstaben nach."
                say: { de: "Leg das Wort mit den Buchstaben nach." }
                show: { drawn: word-card, text: "duck" }
                options: ["k", "d", "c", "u"]
                slot_count: 4
                answer: ["d", "u", "c", "k"]
                hints: ["Am Ende stehen c und k zusammen."]
              - id: l1-s4
                type: fill_in_blank
                option_audio: false
                text: "Welche Buchstaben fehlen?"
                say: { de: "Oben steht das Wort. Welche Buchstaben fehlen?" }
                show: { drawn: word-card, text: "ball" }
                frame: "ba__"
                options: ["l", "o", "e"]
                answer: ["l", "l"]
                hints: ["Ball endet mit zwei gleichen Buchstaben."]
              - id: l1-s5
                type: true_false
                text: "bed  →  bet"
                say: { de: "Tom hat das Wort links abgeschrieben. Rechts steht seine Abschrift. Hat er richtig abgeschrieben?" }
                answer: false
                hints: ["Vergleiche den letzten Buchstaben."]

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Schreib das Wort ab."
                say: { de: "Schreib das Wort ab." }
                show: { drawn: writing-lines, text: "milk", mode: copy, arrows: false }
                char: "milk"
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Welches Wort ist richtig abgeschrieben?"
                say: { de: "Oben steht das Wort. Welches Wort ist richtig abgeschrieben?" }
                show: { drawn: word-card, text: "house" }
                options: ["house", "hous", "haus"]
                answer: "house"
              - id: l1-n3
                type: ordering
                option_audio: false
                text: "Leg das Wort mit den Buchstaben nach."
                say: { de: "Leg das Wort mit den Buchstaben nach." }
                show: { drawn: word-card, text: "frog" }
                options: ["g", "r", "o", "f"]
                slot_count: 4
                answer: ["f", "r", "o", "g"]
              - id: l1-n4
                type: fill_in_blank
                option_audio: false
                text: "Welche Buchstaben fehlen?"
                say: { de: "Oben steht das Wort. Welche Buchstaben fehlen?" }
                show: { drawn: word-card, text: "egg" }
                frame: "e__"
                options: ["g", "k", "e"]
                answer: ["g", "g"]
              - id: l1-n5
                type: true_false
                text: "cup  →  cup"
                say: { de: "Tom hat das Wort links abgeschrieben. Rechts steht seine Abschrift. Hat er richtig abgeschrieben?" }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            option_audio: false
            text: "Welches Wort ist richtig abgeschrieben?"
            say: { de: "Oben steht das Wort. Welches Wort ist richtig abgeschrieben?" }
            show: { drawn: word-card, text: "hat" }
            options: ["hat", "hta", "het"]
            answer: "hat"
          - id: l1-c2
            type: ordering
            option_audio: false
            text: "Leg das Wort mit den Buchstaben nach."
            say: { de: "Leg das Wort mit den Buchstaben nach." }
            show: { drawn: word-card, text: "pig" }
            options: ["i", "g", "p"]
            slot_count: 3
            answer: ["p", "i", "g"]
          - id: l1-c3
            type: true_false
            text: "sock  →  sok"
            say: { de: "Tom hat das Wort links abgeschrieben. Rechts steht seine Abschrift. Hat er richtig abgeschrieben?" }
            answer: false

  - n: 2
    title: { de: "Bilder beschriften", en: "Labelling pictures" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: tracing
            text: "Schreib das Wort ab."
            say: { de: "Schreib das Wort ab." }
            show: { drawn: writing-lines, text: "dog", mode: copy, arrows: false }
            char: "dog"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "Welches Wort ist richtig abgeschrieben?"
            say: { de: "Oben steht das Wort. Welches Wort ist richtig abgeschrieben?" }
            show: { drawn: word-card, text: "bee" }
            options: ["bee", "be", "bea"]
            answer: "bee"
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "apple"
            say: { de: "Wir machen ein Bildwörterbuch. Unter jedes Bild schreibst du das englische Wort. Schau dir das Wort genau an: „apple“ hat zwei p.", en: "Apple." }
            show: { object: apple }
          - text: "rabbit, yellow"
            say: { de: "Viele englische Wörter haben doppelte Buchstaben: „rabbit“ mit zwei b, „yellow“ mit zwei l. Zähl beim Abschreiben mit." }
            show: { object: rabbit }
          - text: "a p p l e"
            say: { de: "Wenn du fertig bist, vergleiche noch einmal Buchstabe für Buchstabe mit der Vorlage. So findest du jeden Fehler." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tracing
                text: "Beschrifte das Bild für das Bildwörterbuch: Schreib „apple“ ab."
                say: { de: "Beschrifte das Bild für das Bildwörterbuch. Schreib das Wort ab." }
                show: { drawn: writing-lines, text: "apple", mode: copy, arrows: false }
                char: "apple"
              - id: l2-f2
                type: multiple_choice
                option_audio: false
                text: "Lina hat das Bild beschriftet. Welches Wort ist richtig abgeschrieben?"
                say: { de: "Lina hat das Kaninchen beschriftet. Welches Wort ist richtig abgeschrieben?" }
                show: { drawn: word-card, text: "rabbit" }
                options: ["rabbit", "rabit", "rebbit"]
                answer: "rabbit"
                feedback:
                  "rabit": "Zähl die b. „Rabbit“ hat zwei b in der Mitte."
                hints:
                  - "Vergleiche jedes Wort mit der Vorlage."
                  - "Schau auf die Mitte des Wortes."
                  - "„Rabbit“ mit a und zwei b ist richtig."
              - id: l2-f3
                type: ordering
                option_audio: false
                text: "Leg das Wort mit den Buchstaben nach."
                say: { de: "Beschrifte die Jacke. Leg das Wort mit den Buchstaben nach." }
                show: { drawn: word-card, text: "jacket" }
                options: ["k", "a", "t", "j", "e", "c"]
                slot_count: 6
                answer: ["j", "a", "c", "k", "e", "t"]
                hints:
                  - "Leg immer den nächsten Buchstaben der Vorlage."
                  - "Nach j und a kommen c und k."
                  - "j, a, c, k, e, t."
              - id: l2-f4
                type: fill_in_blank
                option_audio: false
                text: "Welche Buchstaben fehlen?"
                say: { de: "Oben steht das Wort. Welche Buchstaben fehlen?" }
                show: { drawn: word-card, text: "yellow" }
                frame: "ye__ow"
                options: ["l", "w", "e"]
                answer: ["l", "l"]
                hints:
                  - "Vergleiche mit dem Wort oben."
                  - "In der Mitte steht zweimal derselbe Buchstabe."
                  - "Zweimal l: „yellow“."
              - id: l2-f5
                type: tracing
                text: "Beschrifte das Bild: Schreib „rabbit“ ab."
                say: { de: "Beschrifte das Bild. Schreib das Wort ab." }
                show: { drawn: writing-lines, text: "rabbit", mode: copy, arrows: false }
                char: "rabbit"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Welches Wort ist richtig abgeschrieben?"
                say: { de: "Ben hat die Schule beschriftet. Welches Wort ist richtig abgeschrieben?" }
                show: { drawn: word-card, text: "school" }
                options: ["school", "scool", "schul"]
                answer: "school"
                hints: ["Nach sc kommt ein h, dann zwei o."]
              - id: l2-s2
                type: tracing
                text: "Beschrifte das Bild: Schreib „yellow“ ab."
                say: { de: "Beschrifte das Bild. Schreib das Wort ab." }
                show: { drawn: writing-lines, text: "yellow", mode: copy, arrows: false }
                char: "yellow"
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Leg das Wort mit den Buchstaben nach."
                say: { de: "Beschrifte die Orange. Leg das Wort mit den Buchstaben nach." }
                show: { drawn: word-card, text: "orange" }
                options: ["n", "o", "g", "r", "e", "a"]
                slot_count: 6
                answer: ["o", "r", "a", "n", "g", "e"]
                hints: ["Das Wort fängt mit o, r an."]
              - id: l2-s4
                type: fill_in_blank
                option_audio: false
                text: "Welche Buchstaben fehlen?"
                say: { de: "Oben steht das Wort. Welche Buchstaben fehlen?" }
                show: { drawn: word-card, text: "teacher" }
                frame: "tea__er"
                options: ["c", "h", "s"]
                answer: ["c", "h"]
                hints: ["Nach tea kommen c und h."]
              - id: l2-s5
                type: true_false
                text: "pencil  →  pensil"
                say: { de: "Lina hat das Wort links abgeschrieben. Rechts steht ihre Abschrift. Hat sie richtig abgeschrieben?" }
                answer: false
                hints: ["Vergleiche die Mitte: c oder s?"]

          - support: none
            tasks:
              - id: l2-n1
                type: tracing
                text: "Beschrifte das Bild: Schreib „pencil“ ab."
                say: { de: "Beschrifte das Bild. Schreib das Wort ab." }
                show: { drawn: writing-lines, text: "pencil", mode: copy, arrows: false }
                char: "pencil"
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "Welches Wort ist richtig abgeschrieben?"
                say: { de: "Ben hat ein Bild beschriftet. Welches Wort ist richtig abgeschrieben?" }
                show: { drawn: word-card, text: "doctor" }
                options: ["doctor", "docter", "doktor"]
                answer: "doctor"
              - id: l2-n3
                type: ordering
                option_audio: false
                text: "Leg das Wort mit den Buchstaben nach."
                say: { de: "Beschrifte den Affen. Leg das Wort mit den Buchstaben nach." }
                show: { drawn: word-card, text: "monkey" }
                options: ["k", "m", "e", "o", "y", "n"]
                slot_count: 6
                answer: ["m", "o", "n", "k", "e", "y"]
              - id: l2-n4
                type: fill_in_blank
                option_audio: false
                text: "Welche Buchstaben fehlen?"
                say: { de: "Oben steht das Wort. Welche Buchstaben fehlen?" }
                show: { drawn: word-card, text: "giraffe" }
                frame: "gira__e"
                options: ["f", "p", "e"]
                answer: ["f", "f"]
              - id: l2-n5
                type: true_false
                text: "banana  →  banana"
                say: { de: "Lina hat das Wort links abgeschrieben. Rechts steht ihre Abschrift. Hat sie richtig abgeschrieben?" }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            option_audio: false
            text: "Welches Wort ist richtig abgeschrieben?"
            say: { de: "Oben steht das Wort. Welches Wort ist richtig abgeschrieben?" }
            show: { drawn: word-card, text: "elephant" }
            options: ["elephant", "elefant", "elephent"]
            answer: "elephant"
          - id: l2-c2
            type: ordering
            option_audio: false
            text: "Leg das Wort mit den Buchstaben nach."
            say: { de: "Beschrifte das Zebra. Leg das Wort mit den Buchstaben nach." }
            show: { drawn: word-card, text: "zebra" }
            options: ["r", "z", "a", "e", "b"]
            slot_count: 5
            answer: ["z", "e", "b", "r", "a"]
          - id: l2-c3
            type: fill_in_blank
            option_audio: false
            text: "Welcher Buchstabe fehlt?"
            say: { de: "Oben steht das Wort. Welcher Buchstabe fehlt?" }
            show: { drawn: word-card, text: "hedgehog" }
            frame: "he_gehog"
            options: ["d", "t", "g"]
            answer: ["d"]
          - id: l2-c4
            type: true_false
            text: "butterfly  →  buterfly"
            say: { de: "Ben hat das Wort links abgeschrieben. Rechts steht seine Abschrift. Hat er richtig abgeschrieben?" }
            answer: false
          - id: l2-c5
            type: multiple_choice
            option_audio: false
            text: "Welches Wort ist richtig abgeschrieben?"
            say: { de: "Oben steht das Wort. Welches Wort ist richtig abgeschrieben?" }
            show: { drawn: word-card, text: "strawberry" }
            options: ["strawberry", "strawbery", "strowberry"]
            answer: "strawberry"
