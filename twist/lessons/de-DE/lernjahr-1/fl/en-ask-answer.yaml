# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-ask-answer
skill: fl.speaking.ask-answer
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Fragen stellen und beantworten
  en: Asking and answering
summary: >
  Asking simple questions and giving the answer that fits. Lesson 1 asks
  Have you got ...?, What's this? and What colour is it? and answers them
  (Yes, I have. It's a book. It's green.); lesson 2 asks Where is ...? and
  How many ...?, matches each question with the kind of answer it wants (a
  place, a number), and ends with the skill check. Speaking tasks are
  practice only.
metadata:
  year: lernjahr-1
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.likes, fl.grammar.questions]
  also_practises: [fl.themes.school, fl.themes.colours, fl.themes.numbers-to-10]
  vocabulary: { en: ["Have you got ...?", "Yes, I have.", "No, I haven't.", "What's this?", "It's a ...", "What colour is it?", "Where is ...?", "How many ...?", "I can see ..."] }
  forms: [audio, picture, text, drawn]
  drawn: [colour-swatch]
  facets: []
  parts:
    - { id: have-got, what: { de: "fragen, ob jemand etwas hat, und kurz antworten (Have you got …?)", en: "asking whether someone has got something and giving a short answer (Have you got …?)" } }
    - { id: what, what: { de: "nach einem Ding und seiner Farbe fragen und antworten", en: asking and answering about a thing and its colour } }
    - { id: where, what: { de: "fragen und sagen, wo etwas ist (Where is …?)", en: "asking and saying where something is (Where is …?)" } }
    - { id: how-many, what: { de: "fragen und sagen, wie viele es sind (How many …?)", en: "asking and saying how many there are (How many …?)" } }
  misconceptions:
    - id: do-for-have
      what: Answers Have you got ...? with Yes, I do. (from Do you like ...?)
      addressed: lesson 1 Learn gives Yes, I have. and No, I haven't.; l1-f1 gives feedback on the do answer, and l1-s1, l1-n3 and l2-c3 keep a do answer among the options
    - id: answer-kind
      what: Gives an answer that does not fit the question word (a place for How many, a thing for What colour)
      addressed: lesson 2 Learn pairs How many with a number and Where with a place; l2-f1 gives feedback on a place answer to How many; the what-was-the-question tasks (l1-f4, l1-c2, l2-c5) and l1-n5 test the pairing
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Have you got ...? What's this?", en: "Have you got ...? What's this?" }
    goal:
      de: "Stell kleine Fragen und finde die Antwort, die passt, so wie What's this? It's a pencil."
      en: "Ask little questions and find the answer that fits, like What's this? It's a pencil."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Was fragt das Kind?"
            say: { de: "Hör zu. Was fragt das Kind?" }
            audio: { en: "What's your name?", speaker: female }
            options: ["Wie heißt du?", "Wie alt bist du?", "Wie geht es dir?"]
            answer: "Wie heißt du?"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Du magst Katzen. Welche Antwort passt?"
            say: { de: "Du magst Katzen. Hör die Frage. Welche Antwort passt?" }
            audio: { en: "Do you like cats?", speaker: male }
            options: ["Yes, I do.", "No, I don't."]
            answer: "Yes, I do."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Hast du ein Haustier? = ?"
            say: { de: "Was glaubst du: Wie fragst du ein englisches Kind, ob es ein Haustier hat? Ein Tipp: Haustier heißt pet. Hör gleich zu." }
            show: { object: dog }
          - text: "Have you got a pet? Yes, I have. No, I haven't."
            say: { de: "Mit „Have you got …?“ fragst du, ob jemand etwas hat. Die kurze Antwort ist „Yes, I have“ oder „No, I haven't“.", en: "Have you got a pet? Yes, I have. I've got a dog." }
            show: { object: dog }
          - text: "What's this? It's a pencil."
            say: { de: "Mit „What's this?“ fragst du: Was ist das? Die Antwort fängt mit „It's a“ an.", en: "What's this? It's a pencil." }
            show: { object: pencil }
          - text: "What colour is it? It's red."
            say: { de: "Mit „What colour is it?“ fragst du nach der Farbe. Die Antwort ist eine Farbe.", en: "What colour is it? It's red." }
            show: { object: strawberry }
          - text: "Wusstest du? In England schreibt man colour, in Amerika color."
            say: { de: "Wusstest du? Das Wort für Farbe schreibt man in England mit u: c, o, l, o, u, r. In Amerika lässt man das u weg: color. Gesprochen klingt beides gleich.", en: "What colour is it?" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Du hast eine Katze. Welche Antwort passt?"
                say: { de: "Du hast eine Katze. Hör die Frage. Welche Antwort passt?" }
                audio: { en: "Have you got a pet?", speaker: female }
                options: ["Yes, I have. I've got a cat.", "Yes, I do. I like cats.", "No, I haven't."]
                answer: "Yes, I have. I've got a cat."
                feedback:
                  "Yes, I do. I like cats.": "Auf „Have you got …?“ antwortest du mit „have“: „Yes, I have.“"
                hints:
                  - "Die Frage fängt mit „Have“ an. Die Antwort auch."
                  - "Du hast eine Katze, also sagst du „Yes“."
                  - "Yes, I have. I've got a cat."
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "What's this?"
                say: { de: "Hör die Frage. Welche Antwort passt?", en: "What's this?" }
                show: { object: rubber }
                options: ["It's a rubber.", "It's a ruler.", "It's red."]
                answer: "It's a rubber."
                hints:
                  - "Die Frage ist: Was ist das?"
                  - "Das ist ein Radiergummi."
                  - "Radiergummi heißt „rubber“."
                difficulty: easy
              - id: l1-f3
                type: ordering
                option_audio: false
                text: "Bau die Frage: Hast du einen Hund?"
                say: { de: "Bau die Frage: Hast du einen Hund?" }
                options: ["got", "Have", "a dog?", "you"]
                slot_count: 4
                answer: ["Have", "you", "got", "a dog?"]
                hints:
                  - "Die Frage fängt mit dem Wort an, das großgeschrieben ist."
                  - "Have you ..."
                  - "Have you got a dog?"
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "Die Antwort ist: „It's blue.“ Was war die Frage?"
                say: { de: "Die Antwort ist: It's blue. Was war die Frage?" }
                options: ["What colour is it?", "What's this?", "Have you got a pet?"]
                answer: "What colour is it?"
                hints:
                  - "„Blue“ ist eine Farbe."
                  - "Welche Frage fragt nach der Farbe?"
                  - "What colour is it?"
              - id: l1-f5
                type: speak
                text: "Frag auf Englisch: Hast du ein Haustier?"
                say: { de: "Frag auf Englisch: Hast du ein Haustier?", en: "Have you got a pet?" }
                expected_text: "Have you got a pet?"
                hints:
                  - "Fang mit „Have you got“ an."
                  - "Haustier heißt „pet“."
                  - "Sag mit mir: Have you got a pet?"

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Du hast kein Fahrrad. Welche Antwort passt?"
                say: { de: "Du hast kein Fahrrad. Hör die Frage. Welche Antwort passt?" }
                audio: { en: "Have you got a bike?", speaker: male }
                options: ["No, I haven't.", "No, I don't.", "Yes, I have."]
                answer: "No, I haven't."
                hints: ["Die Frage hat „have“. Die Antwort auch."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "What's this?"
                say: { de: "Hör die Frage. Welche Antwort passt?", en: "What's this?" }
                show: { object: book }
                options: ["It's a book.", "It's a bag.", "It's blue."]
                answer: "It's a book."
                hints: ["Buch heißt „book“."]
              - id: l1-s3
                type: audio_choice
                text: "Welche Farbe hat der Ball?"
                say: { de: "Hör zu. Welche Farbe hat der Ball?" }
                audio: { turns: [{ en: "What colour is your ball?", speaker: female }, { en: "It's green.", speaker: male }] }
                options: [{ drawn: colour-swatch, colour: green }, { drawn: colour-swatch, colour: blue }, { drawn: colour-swatch, colour: yellow }]
                answer: green
                hints: ["Hör auf die Antwort: It's ..."]
              - id: l1-s4
                type: ordering
                option_audio: false
                text: "Bau die Frage: Welche Farbe hat es?"
                say: { de: "Bau die Frage: Welche Farbe hat es?" }
                options: ["is", "What", "it?", "colour"]
                slot_count: 4
                answer: ["What", "colour", "is", "it?"]
                hints: ["Die Frage fängt mit „What colour“ an."]
              - id: l1-s5
                type: speak
                text: "„Have you got a pet?“ Antworte: Ja, ich habe einen Hund."
                say: { de: "Jemand fragt: Have you got a pet? Antworte: Ja, ich habe einen Hund.", en: "Yes, I have. I've got a dog." }
                show: { object: dog }
                expected_text: "Yes, I have. I've got a dog."
                hints: ["Fang mit „Yes, I have“ an."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Was hat Tom?"
                say: { de: "Hör zu. Was hat Tom?" }
                audio: { turns: [{ en: "Tom, have you got a pet?", speaker: female }, { en: "Yes, I have. I've got a fish.", speaker: male }] }
                options: [{ object: fish }, { object: cat }, { object: rabbit }]
                answer: fish
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Du zeigst auf etwas und willst wissen, was es ist. Was fragst du?"
                say: { de: "Du zeigst auf etwas und willst wissen, was es ist. Was fragst du?" }
                options: ["What's this?", "What colour is it?", "Have you got this?"]
                answer: "What's this?"
              - id: l1-n3
                type: audio_choice
                text: "Du hast eine Schwester. Welche Antwort passt?"
                say: { de: "Du hast eine Schwester. Hör die Frage. Welche Antwort passt?" }
                audio: { en: "Have you got a sister?", speaker: female }
                options: ["Yes, I have.", "Yes, I do.", "No, I haven't."]
                answer: "Yes, I have."
              - id: l1-n4
                type: ordering
                option_audio: false
                text: "Bau die Antwort: Das ist ein Lineal."
                say: { de: "Bau die Antwort: Das ist ein Lineal." }
                options: ["a", "It's", "ruler."]
                slot_count: 3
                answer: ["It's", "a", "ruler."]
              - id: l1-n5
                type: true_false
                text: "Frage: „What colour is it?“ Antwort: „It's a pencil.“ Passt die Antwort zur Frage?"
                say: { de: "Hör zu. Passt die Antwort zur Frage?" }
                audio: { turns: [{ en: "What colour is it?", speaker: male }, { en: "It's a pencil.", speaker: female }] }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Du hast keine Katze. Welche Antwort passt?"
            say: { de: "Du hast keine Katze. Hör die Frage. Welche Antwort passt?" }
            audio: { en: "Have you got a cat?", speaker: male }
            options: ["No, I haven't.", "No, I don't.", "Yes, I have."]
            answer: "No, I haven't."
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Die Antwort ist: „It's a chair.“ Was war die Frage?"
            say: { de: "Die Antwort ist: It's a chair. Was war die Frage?" }
            options: ["What's this?", "What colour is it?", "Have you got a pet?"]
            answer: "What's this?"
          - id: l1-c3
            type: audio_choice
            text: "Welches Tier hat Lily?"
            say: { de: "Hör zu. Welches Tier hat Lily?" }
            audio: { turns: [{ en: "Lily, have you got a pet?", speaker: male }, { en: "Yes, I have. I've got a rabbit.", speaker: female }] }
            options: [{ object: rabbit }, { object: mouse }, { object: dog }]
            answer: rabbit
          - id: l1-c4
            type: multiple_choice
            option_audio: false
            text: "Die Antwort ist: „Yes, I have.“ Was war die Frage?"
            say: { de: "Die Antwort ist: Yes, I have. Was war die Frage?" }
            options: ["Do you like cats?", "Have you got a ruler?", "What's this?"]
            answer: "Have you got a ruler?"
          - id: l1-c5
            type: audio_choice
            text: "Was hat Max?"
            say: { de: "Hör zu. Was hat Max?" }
            audio: { turns: [{ en: "Max, have you got a pencil?", speaker: female }, { en: "No, I haven't. I've got a crayon.", speaker: male }] }
            options: [{ object: pencil }, { object: ruler }, { object: crayon }]
            answer: crayon
          - id: l1-c6
            type: multiple_choice
            option_audio: false
            text: "What colour is it?"
            say: { de: "Hör die Frage. Welche Antwort passt?", en: "What colour is it?" }
            show: { object: frog }
            options: ["It's a frog.", "It's green.", "Yes, I have."]
            answer: "It's green."

  - n: 2
    title: { de: "Where is ...? How many ...?", en: "Where is ...? How many ...?" }
    goal:
      de: "Frag mit Where und How many und antworte mit einem Ort oder einer Zahl."
      en: "Ask with Where and How many, and answer with a place or a number."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            option_audio: false
            text: "What's this?"
            say: { de: "Hör die Frage. Welche Antwort passt?", en: "What's this?" }
            show: { object: pencil-case }
            options: ["It's a pencil case.", "It's a pencil.", "It's yellow."]
            answer: "It's a pencil case."
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Du hast einen Hund. Welche Antwort passt?"
            say: { de: "Du hast einen Hund. Hör die Frage. Welche Antwort passt?" }
            audio: { en: "Have you got a dog?", speaker: female }
            options: ["Yes, I have.", "No, I haven't."]
            answer: "Yes, I have."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Wie viele? = ?"
            say: { de: "Was glaubst du: Wie fragst du auf Englisch: Wie viele? Ein Tipp: Diesmal fängt die Frage nicht mit w an." }
            show: { object: apple, count: 3, layout: row }
          - text: "How many apples can you see? I can see three."
            say: { de: "Mit „How many“ fragst du: Wie viele? Die Antwort ist eine Zahl.", en: "How many apples can you see? I can see three." }
            show: { object: apple, count: 3, layout: row }
          - text: "Where is the cat? It's in the box."
            say: { de: "Mit „Where“ fragst du: Wo? Pass auf: „where“ heißt wo, nicht wer. Die Antwort ist ein Ort.", en: "Where is the cat? It's in the box." }
            show: { objects: [cat, box] }
          - text: "How many? Three. Where? In the box."
            say: { de: "Frage und Antwort gehören zusammen. Auf „How many“ antwortest du mit einer Zahl, auf „Where“ mit einem Ort." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "How many bananas can you see?"
                say: { de: "Hör die Frage. Welche Antwort passt?", en: "How many bananas can you see?" }
                show: { object: banana, count: 4, layout: row }
                options: ["I can see four.", "I can see five.", "They're in the bag."]
                answer: "I can see four."
                feedback:
                  "They're in the bag.": "Die Bananen liegen doch vor dir und nicht in einer Tasche! „How many“ fragt nach einer Zahl, nicht nach einem Ort."
                hints:
                  - "„How many“ heißt: Wie viele? Zähl die Bananen."
                  - "Es sind vier Bananen."
                  - "I can see four."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Wo ist die Katze?"
                say: { de: "Hör zu. Wo ist die Katze?" }
                audio: { turns: [{ en: "Where's the cat?", speaker: male }, { en: "It's in the box.", speaker: female }] }
                options: ["in der Kiste", "im Haus", "im Bett"]
                answer: "in der Kiste"
                hints:
                  - "Hör auf die Antwort nach der Frage."
                  - "It's in the box."
                  - "„Box“ heißt Kiste."
              - id: l2-f3
                type: ordering
                option_audio: false
                text: "Bau die Frage: Wo ist mein Ball?"
                say: { de: "Bau die Frage: Wo ist mein Ball?" }
                options: ["my", "Where", "ball?", "is"]
                slot_count: 4
                answer: ["Where", "is", "my", "ball?"]
                hints:
                  - "Das Fragewort steht vorne."
                  - "Where is ..."
                  - "Where is my ball?"
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Du willst wissen, wie viele Katzen dein Freund hat. Was fragst du?"
                say: { de: "Du willst wissen, wie viele Katzen dein Freund hat. Was fragst du?" }
                options: ["How many cats have you got?", "Where is your cat?", "Have you got a cat?"]
                answer: "How many cats have you got?"
                hints:
                  - "Du willst eine Zahl wissen."
                  - "„Wie viele“ heißt „How many“."
                  - "How many cats have you got?"
              - id: l2-f5
                type: speak
                text: "Frag auf Englisch: Wo ist meine Schultasche?"
                say: { de: "Frag auf Englisch: Wo ist meine Schultasche?", en: "Where is my school bag?" }
                show: { object: schoolbag }
                expected_text: "Where is my school bag?"
                hints:
                  - "Fang mit „Where is“ an."
                  - "Schultasche heißt „school bag“."
                  - "Sag mit mir: Where is my school bag?"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "How many ducks can you see?"
                say: { de: "Hör die Frage. Welche Antwort passt?", en: "How many ducks can you see?" }
                show: { object: duck, count: 3, layout: row }
                options: ["I can see three.", "I can see two.", "They're on the lake."]
                answer: "I can see three."
                hints: ["Zähl die Enten. Die Antwort ist eine Zahl."]
              - id: l2-s2
                type: audio_choice
                text: "Wo ist der Hund?"
                say: { de: "Hör zu. Wo ist der Hund?" }
                audio: { turns: [{ en: "Mum, where's the dog?", speaker: male }, { en: "He's in the garden.", speaker: female }] }
                options: ["im Garten", "im Haus", "im Auto"]
                answer: "im Garten"
                hints: ["Hör auf Mamas Antwort."]
              - id: l2-s3
                type: audio_choice
                text: "Wie viele Kaninchen hat Ben?"
                say: { de: "Hör zu. Wie viele Kaninchen hat Ben?" }
                audio: { turns: [{ en: "Ben, how many rabbits have you got?", speaker: female }, { en: "I've got two rabbits.", speaker: male }] }
                options: [{ object: rabbit, count: 1, layout: row }, { object: rabbit, count: 2, layout: row }, { object: rabbit, count: 3, layout: row }]
                answer: "2"
                hints: ["Hör auf die Zahl in Bens Antwort."]
              - id: l2-s4
                type: fill_in_blank
                option_audio: false
                text: "Du willst wissen, wo das Buch ist. Ergänze die Frage."
                say: { de: "Du willst wissen, wo das Buch ist. Ergänze die Frage." }
                frame: "_ is the book?"
                options: ["Where", "What", "Who"]
                answer: ["Where"]
                hints: ["„Wo“ heißt „where“."]
              - id: l2-s5
                type: speak
                text: "„How many stars can you see?“ Antworte: Ich sehe fünf."
                say: { de: "Jemand fragt: How many stars can you see? Antworte: Ich sehe fünf.", en: "I can see five." }
                show: { object: star, count: 5, layout: row }
                expected_text: "I can see five."
                hints: ["Fang mit „I can see“ an."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Wo ist der Bleistift?"
                say: { de: "Hör zu. Wo ist der Bleistift?" }
                audio: { turns: [{ en: "Where's my pencil?", speaker: female }, { en: "It's in your school bag.", speaker: male }] }
                options: ["in der Schultasche", "im Mäppchen", "auf dem Tisch"]
                answer: "in der Schultasche"
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "How many eggs can you see?"
                say: { de: "Hör die Frage. Welche Antwort passt?", en: "How many eggs can you see?" }
                show: { object: egg, count: 6, layout: row }
                options: ["I can see six.", "I can see five.", "They're in the box."]
                answer: "I can see six."
              - id: l2-n3
                type: fill_in_blank
                option_audio: false
                text: "Du willst wissen, wie viele Äpfel es sind. Ergänze die Frage."
                say: { de: "Du willst wissen, wie viele Äpfel es sind. Ergänze die Frage." }
                frame: "How _ apples are there?"
                options: ["many", "much", "where"]
                answer: ["many"]
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Bau die Frage: Wie viele Hunde hast du?"
                say: { de: "Bau die Frage: Wie viele Hunde hast du?" }
                options: ["dogs", "have", "How many", "got?", "you"]
                slot_count: 5
                answer: ["How many", "dogs", "have", "you", "got?"]
              - id: l2-n5
                type: true_false
                text: "Frage: „Where is the ball?“ Antwort: „It's under the chair.“ Passt die Antwort zur Frage?"
                say: { de: "Hör zu. Passt die Antwort zur Frage?" }
                audio: { turns: [{ en: "Where is the ball?", speaker: female }, { en: "It's under the chair.", speaker: male }] }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: how-many
            type: multiple_choice
            option_audio: false
            text: "How many cars can you see?"
            say: { de: "Hör die Frage. Welche Antwort passt?", en: "How many cars can you see?" }
            show: { object: car, count: 2, layout: row }
            options: ["I can see two.", "I can see three.", "They're in the street."]
            answer: "I can see two."
          - id: l2-c2
            part: where
            type: audio_choice
            text: "Wo ist die Maus?"
            say: { de: "Hör zu. Wo ist die Maus?" }
            audio: { turns: [{ en: "Where's the mouse?", speaker: female }, { en: "It's in the shoe!", speaker: male }] }
            options: ["im Schuh", "in der Socke", "im Haus"]
            answer: "im Schuh"
          - id: l2-c3
            part: have-got
            type: audio_choice
            text: "Du hast einen Bruder. Welche Antwort passt?"
            say: { de: "Du hast einen Bruder. Hör die Frage. Welche Antwort passt?" }
            audio: { en: "Have you got a brother?", speaker: male }
            options: ["Yes, I have.", "Yes, I do.", "No, I haven't."]
