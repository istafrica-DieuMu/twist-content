# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-sound-spelling
skill: fl.reading.sound-spelling
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: So spricht man, so schreibt man
  en: Sounds and spellings
summary: >
  English is not written the way it sounds. Lesson 1 links ee with a long
  German i (tree, bee) and oo with a German u (moon, book); lesson 2 links
  sh with sch, ch with tsch and th with a sound German does not have
  (three, mouth), and ends with the skill check. Children hear words and
  choose the spelling, sort pictures by the spelling of their word, fill
  the missing letters and find words with a spelling.
metadata:
  year: lernjahr-1
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.word-picture]
  also_practises: [fl.speaking.imitate, fl.culture-strategies.compare-languages]
  vocabulary: { en: [tree, bee, cheese, queen, moon, spoon, book, foot, fish, shoe, shell, chair, teacher, three, mouth] }
  forms: [audio, picture, text, drawn]
  drawn: [word-card, letter-card]
  facets: []
  parts:
    - { id: ee-oo, what: { de: ee und oo in Wörtern erkennen, en: recognising ee and oo in words } }
    - { id: sh-ch-th, what: { de: "sh, ch und th in Wörtern erkennen", en: "recognising sh, ch and th in words" } }
    - { id: sound, what: { de: "wissen, wie eine Schreibung klingt", en: knowing how a spelling sounds } }
  misconceptions:
    - id: german-letters
      what: Reads and writes ee and oo with German sounds and spellings (tree as tre-e, moon written mun)
      addressed: lesson 1 Learn sets ee against a long German i and oo against u; l1-f1 gives feedback on the German-style spelling trii, and every hear-and-spell task keeps a German-style spelling among the options
    - id: sch-th
      what: Writes sch for sh, and says or writes t or s for th (tree for three)
      addressed: lesson 2 Learn compares sh with sch and shows the tongue for th; l2-f1 gives feedback on schoe, and the skill check asks for three with tree among the options
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "ee und oo", en: "ee and oo" }
    goal:
      de: "Entdecke, wie man englische Wörter wie tree und moon schreibt, obwohl sie anders klingen."
      en: "Find out how English words like tree and moon are written, even though they sound different."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "Lies das Wort. Welches Bild passt?"
            say: { de: "Lies das Wort. Welches Bild passt?" }
            show: { drawn: word-card, text: "bee" }
            options: [{ object: bee }, { object: bed }, { object: bell }]
            answer: bee
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "Welches Wort passt zum Bild?"
            say: { de: "Welches Wort passt zum Bild?" }
            show: { object: moon }
            options: ["moon", "mouse", "milk"]
            answer: "moon"
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "bee"
            say: { de: "Hier steht ein englisches Wort für ein Tier. Was glaubst du: Klingt es wie das deutsche Be-e, oder ganz anders? Gleich hörst du es." }
            show: { object: bee }
          - text: "ee: tree, bee"
            say: { de: "Im Englischen schreibt man oft anders, als man spricht. Zwei e, also ee, klingen wie ein langes i im Deutschen.", en: "Tree. Bee." }
            show: { object: tree }
          - text: "oo: moon, spoon"
            say: { de: "Zwei o, also oo, klingen wie ein langes u.", en: "Moon. Spoon." }
            show: { object: moon }
          - text: "oo: book, foot"
            say: { de: "Manchmal ist das oo kurz, wie in „book“ und „foot“. Aber es klingt fast immer wie ein u, nicht wie ein o.", en: "Book. Foot." }
            show: { object: book }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Wie schreibt man das Wort?"
                say: { de: "Hör zu. Wie schreibt man das Wort?" }
                audio: { en: "Tree." }
                options: ["tree", "trii", "tre"]
                answer: "tree"
                feedback:
                  "trii": "So würde man es im Deutschen schreiben. Im Englischen schreibt man das lange i oft mit ee."
                hints:
                  - "Du hörst ein langes i. Wie schreibt man das im Englischen?"
                  - "Das lange i schreibt man oft mit zwei e."
                  - "„Tree“ schreibt man t, r, e, e."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "ee oder oo?"
                say: { de: "Tippe auf ein Bild und hör das Wort. Schreibt man es mit ee oder mit oo? Sortiere die Bilder." }
                bins:
                  - { id: ee, show: { text: "ee" } }
                  - { id: oo, show: { text: "oo" } }
                options:
                  - { object: bee, bin: ee, say: { en: "Bee." } }
                  - { object: moon, bin: oo, say: { en: "Moon." } }
                  - { object: cheese, bin: ee, say: { en: "Cheese." } }
                  - { object: spoon, bin: oo, say: { en: "Spoon." } }
                hints:
                  - "Hör auf den Laut in der Mitte des Wortes."
                  - "Klingt er wie i, kommt das Bild zum ee. Klingt er wie u, zum oo."
                  - "„Bee“ und „cheese“ kommen zum ee, „moon“ und „spoon“ zum oo."
              - id: l1-f3
                type: fill_in_blank
                option_audio: false
                text: "Das ist ein Buch. Welche Buchstaben fehlen?"
                say: { de: "Das ist ein Buch. Welche Buchstaben fehlen?" }
                show: { object: book }
                frame: "b_k"
                options: ["oo", "u", "ee"]
                answer: ["oo"]
                hints:
                  - "„Book“ klingt fast wie buk."
                  - "Das kurze u schreibt man hier mit zwei o."
                  - "b, o, o, k."
              - id: l1-f4
                type: multiple_choice
                text: "Wie klingt das ee in „bee“?"
                say: { de: "Wie klingt das ee in „bee“?" }
                options: ["wie ein langes i", "wie ein langes e", "wie ein ü"]
                answer: "wie ein langes i"
                hints:
                  - "Denk an „tree“ und „bee“."
                  - "„Bee“ klingt fast wie das deutsche Wort Biene am Anfang."
                  - "Das ee klingt wie ein langes i."
              - id: l1-f5
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "spoon" }
                options: [{ object: spoon }, { object: knife }, { object: cup }]
                answer: spoon
                hints:
                  - "Das oo klingt wie u."
                  - "Lies: sp, dann ein langes u, dann n."
                  - "„Spoon“ ist der Löffel."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Wie schreibt man das Wort?"
                say: { de: "Hör zu. Wie schreibt man das Wort?" }
                audio: { en: "Moon." }
                options: ["moon", "mun", "muun"]
                answer: "moon"
                hints: ["Das lange u schreibt man hier mit zwei o."]
              - id: l1-s2
                type: sorting
                text: "ee oder oo?"
                say: { de: "Tippe auf ein Bild und hör das Wort. Schreibt man es mit ee oder mit oo? Sortiere die Bilder." }
                bins:
                  - { id: ee, show: { text: "ee" } }
                  - { id: oo, show: { text: "oo" } }
                options:
                  - { object: queen, bin: ee, say: { en: "Queen." } }
                  - { object: foot, bin: oo, say: { en: "Foot." } }
                  - { object: tree, bin: ee, say: { en: "Tree." } }
                  - { object: book, bin: oo, say: { en: "Book." } }
                hints: ["Klingt es wie i, kommt es zum ee. Klingt es wie u, zum oo."]
              - id: l1-s3
                type: fill_in_blank
                option_audio: false
                text: "Das ist ein Baum. Welche Buchstaben fehlen?"
                say: { de: "Das ist ein Baum. Welche Buchstaben fehlen?" }
                show: { object: tree }
                frame: "tr_"
                options: ["ee", "i", "ie"]
                answer: ["ee"]
                hints: ["Das lange i schreibt man hier mit zwei e."]
              - id: l1-s4
                type: true_false
                text: "Klingt das oo in „moon“ wie ein u?"
                say: { de: "Klingt das oo in „moon“ wie ein u?" }
                answer: true
                hints: ["Hör noch einmal: „moon“."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tippe auf alle Wörter mit ee."
                say: { de: "Tippe auf alle Wörter mit ee. Dann tippe auf Prüfen." }
                show: { drawn: letter-card, text: "tree moon bee book cheese" }
                spans: ["tree", "bee", "cheese"]
                hints: ["Es sind drei Wörter."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Wie schreibt man das Wort?"
                say: { de: "Hör zu. Wie schreibt man das Wort?" }
                audio: { en: "Bee." }
                options: ["bee", "bii", "be"]
                answer: "bee"
              - id: l1-n2
                type: fill_in_blank
                option_audio: false
                text: "Das ist ein Fuß. Welche Buchstaben fehlen?"
                say: { de: "Das ist ein Fuß. Welche Buchstaben fehlen?" }
                show: { object: foot }
                frame: "f_t"
                options: ["oo", "u", "o"]
                answer: ["oo"]
              - id: l1-n3
                type: multiple_choice
                text: "Wie klingt das oo in „spoon“?"
                say: { de: "Wie klingt das oo in „spoon“?" }
                options: ["wie ein langes u", "wie ein langes o", "wie ein ö"]
                answer: "wie ein langes u"
              - id: l1-n4
                type: sorting
                text: "ee oder oo?"
                say: { de: "Tippe auf ein Bild und hör das Wort. Schreibt man es mit ee oder mit oo? Sortiere die Bilder." }
                bins:
                  - { id: ee, show: { text: "ee" } }
                  - { id: oo, show: { text: "oo" } }
                options:
                  - { object: bee, bin: ee, say: { en: "Bee." } }
                  - { object: book, bin: oo, say: { en: "Book." } }
                  - { object: tree, bin: ee, say: { en: "Tree." } }
                  - { object: moon, bin: oo, say: { en: "Moon." } }
              - id: l1-n5
                type: audio_choice
                text: "Wie schreibt man das Wort?"
                say: { de: "Hör zu. Wie schreibt man das Wort?" }
                audio: { en: "Cheese." }
                options: ["cheese", "chiis", "cheez"]
                answer: "cheese"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Wie schreibt man das Wort?"
            say: { de: "Hör zu. Wie schreibt man das Wort?" }
            audio: { en: "Spoon." }
            options: ["spoon", "spun", "spoun"]
            answer: "spoon"
          - id: l1-c2
            type: fill_in_blank
            option_audio: false
            text: "Das ist eine Königin. Welche Buchstaben fehlen?"
            say: { de: "Das ist eine Königin. Welche Buchstaben fehlen?" }
            show: { object: queen }
            frame: "qu_n"
            options: ["ee", "i", "ie"]
            answer: ["ee"]
          - id: l1-c3
            type: true_false
            text: "Klingt das ee in „tree“ wie ein langes e?"
            say: { de: "Klingt das ee in „tree“ wie ein langes e?" }
            answer: false
          - id: l1-c4
            type: audio_choice
            text: "Wie schreibt man das Wort?"
            say: { de: "Hör zu. Wie schreibt man das Wort?" }
            audio: { en: "Queen." }
            options: ["quien", "queen", "quiin"]
            answer: "queen"
          - id: l1-c5
            type: sorting
            text: "Sortiere die Bilder: ee oder oo?"
            say: { de: "Tippe auf ein Bild und hör das Wort. Kommt es zum ee oder zum oo?" }
            bins:
              - { id: ee, show: { text: "ee" } }
              - { id: oo, show: { text: "oo" } }
            options:
              - { object: cheese, bin: ee, say: { en: "Cheese." } }
              - { object: foot, bin: oo, say: { en: "Foot." } }
              - { object: tree, bin: ee, say: { en: "Tree." } }
              - { object: spoon, bin: oo, say: { en: "Spoon." } }
          - id: l1-c6
            type: multiple_choice
            option_audio: false
            text: "Lies die Wörter. In welchem Wort klingt die Mitte wie ein u?"
            say: { de: "Lies die Wörter. In welchem Wort klingt die Mitte wie ein u?" }
            options: ["bee", "moon", "tree"]
            answer: "moon"

  - n: 2
    title: { de: "sh, ch und th", en: "sh, ch and th" }
    goal:
      de: "Hör auf neue Laute und finde, wie man sie schreibt, so wie in fish, chair und three."
      en: "Listen for new sounds and find how they are written, like in fish, chair and three."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Wie schreibt man das Wort?"
            say: { de: "Hör zu. Wie schreibt man das Wort?" }
            audio: { en: "Book." }
            options: ["book", "buk", "bok"]
            answer: "book"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            option_audio: false
            text: "Das ist der Mond. Welche Buchstaben fehlen?"
            say: { de: "Das ist der Mond. Welche Buchstaben fehlen?" }
            show: { object: moon }
            frame: "m_n"
            options: ["oo", "u", "o"]
            answer: ["oo"]
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - say: { de: "Hör zu. Der Fisch heißt auf Englisch fast wie bei uns. Auf Deutsch schreibst du sch, drei Buchstaben. Was glaubst du: Wie viele Buchstaben braucht das Englische dafür?", en: "Fish." }
            show: { object: fish }
          - text: "sh: fish, shoe"
            say: { de: "sh klingt wie das deutsche sch. Im Englischen schreibst du aber nur s und h.", en: "Fish. Shoe." }
            show: { object: fish }
          - text: "ch: chair, cheese"
            say: { de: "ch klingt wie tsch, wie am Anfang von Tschüss.", en: "Chair. Cheese." }
            show: { object: chair }
          - text: "Wusstest du? Say cheese!"
            say: { de: "Wusstest du? Wenn in England jemand ein Foto macht, ruft er oft: Say cheese! Das heißt: Sag Käse! Beim langen ee am Ende ziehst du die Mundwinkel auseinander, und schon lächelst du. Probier es aus!", en: "Say cheese!" }
            show: { object: cheese }
          - text: "th: three, mouth"
            say: { de: "th gibt es im Deutschen nicht. Leg die Zungenspitze zwischen die Zähne und blas leise Luft heraus.", en: "Three. Mouth." }
            show: { object: mouth }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Wie schreibt man das Wort?"
                say: { de: "Hör zu. Wie schreibt man das Wort?" }
                audio: { en: "Shoe." }
                options: ["shoe", "schoe", "choe"]
                answer: "shoe"
                feedback:
                  "schoe": "Da hat der Schuh einen Buchstaben zu viel an! Das sch schreibt man im Englischen nur mit s und h."
                hints:
                  - "Du hörst sch. Wie schreibt man das im Englischen?"
                  - "Im Englischen sind es nur zwei Buchstaben: sh."
                  - "„Shoe“ schreibt man s, h, o, e."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "sh oder ch?"
                say: { de: "Tippe auf ein Bild und hör das Wort. Schreibt man es mit sh oder mit ch? Sortiere die Bilder." }
                bins:
                  - { id: sh, show: { text: "sh" } }
                  - { id: ch, show: { text: "ch" } }
                options:
                  - { object: fish, bin: sh, say: { en: "Fish." } }
                  - { object: chair, bin: ch, say: { en: "Chair." } }
                  - { object: shell, bin: sh, say: { en: "Shell." } }
                  - { object: cheese, bin: ch, say: { en: "Cheese." } }
                hints:
                  - "Hör genau: sch oder tsch?"
                  - "Klingt es wie sch, kommt es zum sh. Klingt es wie tsch, zum ch."
                  - "„Fish“ und „shell“ kommen zum sh, „chair“ und „cheese“ zum ch."
              - id: l2-f3
                type: fill_in_blank
                option_audio: false
                text: "Das ist ein Mund. Welche Buchstaben fehlen?"
                say: { de: "Das ist ein Mund. Welche Buchstaben fehlen?" }
                show: { object: mouth }
                frame: "mou_"
                options: ["th", "s", "f"]
                answer: ["th"]
                hints:
                  - "Am Ende sprichst du mit der Zunge zwischen den Zähnen."
                  - "Diesen Laut schreibt man mit zwei Buchstaben."
                  - "„Mouth“ endet mit th."
              - id: l2-f4
                type: multiple_choice
                text: "Wie klingt das ch in „chair“?"
                say: { de: "Wie klingt das ch in „chair“?" }
                options: ["wie tsch in Tschüss", "wie ch in Buch", "wie sch in Schule"]
                answer: "wie tsch in Tschüss"
                feedback:
                  "wie ch in Buch": "Das englische ch klingt fast nie wie in Buch. „Chair“ fängt mit tsch an."
                hints:
                  - "Denk an „chair“ und „cheese“."
                  - "„Chair“ klingt am Anfang wie Tschüss."
                  - "Wie tsch in Tschüss."
              - id: l2-f5
                type: true_false
                text: "Sprichst du dieses Wort mit der Zunge zwischen den Zähnen?"
                say: { de: "Hör zu. Sprichst du dieses Wort mit der Zunge zwischen den Zähnen?", en: "Three." }
                answer: true
                hints:
                  - "Hör auf den Anfang."
                  - "„Three“ fängt mit th an."
                  - "Ja, bei th liegt die Zunge zwischen den Zähnen."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Wie schreibt man das Wort?"
                say: { de: "Hör zu. Wie schreibt man das Wort?" }
                audio: { en: "Fish." }
                options: ["fish", "fisch", "fich"]
                answer: "fish"
                hints: ["Das sch am Ende schreibt man mit sh."]
              - id: l2-s2
                type: fill_in_blank
                option_audio: false
                text: "Das ist ein Stuhl. Welche Buchstaben fehlen?"
                say: { de: "Das ist ein Stuhl. Welche Buchstaben fehlen?" }
                show: { object: chair }
                frame: "_air"
                options: ["ch", "sh", "tsch"]
                answer: ["ch"]
                hints: ["Das tsch schreibt man im Englischen mit zwei Buchstaben."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf alle Wörter mit sh."
                say: { de: "Tippe auf alle Wörter mit sh. Dann tippe auf Prüfen." }
                show: { drawn: letter-card, text: "fish chair shoe cheese shell" }
                spans: ["fish", "shoe", "shell"]
                hints: ["Es sind drei Wörter."]
              - id: l2-s4
                type: sorting
                text: "sh, ch oder th?"
                say: { de: "Tippe auf ein Bild und hör das Wort. Schreibt man es mit sh, ch oder th? Sortiere die Bilder." }
                bins:
                  - { id: sh, show: { text: "sh" } }
                  - { id: ch, show: { text: "ch" } }
                  - { id: th, show: { text: "th" } }
                options:
                  - { object: shoe, bin: sh, say: { en: "Shoe." } }
                  - { object: cheese, bin: ch, say: { en: "Cheese." } }
                  - { object: mouth, bin: th, say: { en: "Mouth." } }
                hints: ["Bei th liegt die Zunge zwischen den Zähnen."]
              - id: l2-s5
                type: audio_choice
                text: "Wie schreibt man das Wort?"
                say: { de: "Hör zu. Wie schreibt man das Wort?" }
                audio: { en: "Teacher." }
                options: ["teacher", "teasher", "teatcher"]
                answer: "teacher"
                hints: ["In der Mitte hörst du tsch. Das schreibt man mit ch."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Wie schreibt man das Wort?"
                say: { de: "Hör zu. Wie schreibt man das Wort?" }
                audio: { en: "Chair." }
                options: ["chair", "shair", "tschair"]
                answer: "chair"
              - id: l2-n2
                type: fill_in_blank
                option_audio: false
                text: "Das ist eine Muschel. Welche Buchstaben fehlen?"
                say: { de: "Das ist eine Muschel. Welche Buchstaben fehlen?" }
                show: { object: shell }
                frame: "_ell"
                options: ["sh", "ch", "s"]
                answer: ["sh"]
              - id: l2-n3
                type: multiple_choice
                text: "Wie klingt das sh in „fish“?"
                say: { de: "Wie klingt das sh in „fish“?" }
                options: ["wie sch", "wie s", "wie tsch"]
                answer: "wie sch"
              - id: l2-n4
                type: sorting
                text: "sh oder ch?"
                say: { de: "Tippe auf ein Bild und hör das Wort. Schreibt man es mit sh oder mit ch? Sortiere die Bilder." }
                bins:
                  - { id: sh, show: { text: "sh" } }
                  - { id: ch, show: { text: "ch" } }
                options:
                  - { object: shoe, bin: sh, say: { en: "Shoe." } }
                  - { object: teacher, bin: ch, say: { en: "Teacher." } }
                  - { object: fish, bin: sh, say: { en: "Fish." } }
                  - { object: cheese, bin: ch, say: { en: "Cheese." } }
              - id: l2-n5
                type: audio_choice
                text: "Wie schreibt man das Wort?"
                say: { de: "Hör zu. Wie schreibt man das Wort?" }
                audio: { en: "Mouth." }
                options: ["mouth", "maus", "mouf"]
                answer: "mouth"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: sh-ch-th
            type: audio_choice
            text: "Welches Wort hörst du?"
            say: { de: "Hör zu. Welches Wort hörst du?" }
            audio: { en: "Three." }
            options: ["three", "tree", "sree"]
            answer: "three"
          - id: l2-c2
            part: ee-oo
            type: fill_in_blank
            option_audio: false
            text: "Das ist ein Löffel. Welche Buchstaben fehlen?"
            say: { de: "Das ist ein Löffel. Welche Buchstaben fehlen?" }
            show: { object: spoon }
            frame: "sp_n"
            options: ["oo", "u", "o"]
            answer: ["oo"]
          - id: l2-c3
            part: ee-oo
