# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-calendar
skill: fl.themes.calendar
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Tage, Monate, Geburtstag
  en: Days, months and birthdays
summary: >
  Lesson 1 brings the days of the week, in order, and "What day is it
  today? It's Monday.", with the weekend and the days that are easy to mix
  up (Tuesday and Thursday). Lesson 2 brings the twelve months, the four
  seasons and "When's your birthday? It's in May.", and ends with the skill
  check. Instructions are in German; the English is spoken and shown, and
  a table shows the days and months in order.
metadata:
  year: lernjahr-1
  topic: { de: Kalender, en: Calendar }
  ages: [8-10]
  lesson_minutes: 11
  builds_on: [fl.themes.numbers-to-20]
  also_practises: [fl.speaking.imitate]
  vocabulary: { en: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, weekend, "What day is it today?", "It's Monday.", January, February, March, April, May, June, July, August, September, October, November, December, spring, summer, autumn, winter, "When's your birthday?", "My birthday is in May."] }
  forms: [audio, text, picture, drawn]
  drawn: [table]
  facets: []
  parts:
    - { id: days, what: { de: die Wochentage auf Englisch verstehen und in Reihenfolge kennen, en: understanding the days of the week in English and knowing their order } }
    - { id: months, what: { de: die Monate auf Englisch verstehen und in Reihenfolge kennen, en: understanding the months in English and knowing their order } }
    - { id: seasons, what: { de: die Jahreszeiten auf Englisch nennen, en: naming the seasons in English } }
    - { id: birthday, what: { de: "fragen und sagen, wann jemand Geburtstag hat", en: asking and saying when someone's birthday is } }
  misconceptions:
    - id: tuesday-thursday
      what: Mixes up Tuesday and Thursday, which both start with T
      addressed: lesson 1 Learn says Thursday starts with th like three and Tuesday like Dienstag starts with a plain t; l1-f5, l1-s1 and l1-n3 set the two against each other, with feedback in l1-f5 and l1-s1
    - id: june-july
      what: Mixes up June and July, as with Juni and Juli
      addressed: lesson 2 Learn says July ends with ai like Juli ends with i; l2-f1 and l2-n1 set the two against each other, with feedback in l2-f1
    - id: march-may
      what: Hears May as März or March as Mai
      addressed: l2-s1 and l2-n3 set March against May, with feedback in l2-s1
    - id: lowercase-days
      what: Writes days and months with small letters, as German children might expect for words that are not nouns
      addressed: lesson 1 Learn says days and months always start with a capital letter in English; every text option shows them capitalised
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Monday, Tuesday", en: "Monday, Tuesday" }
    goal:
      de: "Lern die sieben Wochentage der Reihe nach und sag, welcher Tag heute ist, so wie It's Monday."
      en: "Learn the seven days in order and say what day it is today, like It's Monday."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Welche Zahl ist das?"
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Seventeen." }
            options: ["7", "17", "16"]
            answer: "17"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welche Zahl ist das?"
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Twelve." }
            options: ["20", "2", "12"]
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Sonntag = ?"
            say: { de: "Heute lernst du die Tage der Woche auf Englisch. Was glaubst du: Wie heißt Sonntag auf Englisch?" }
          - text: "Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday"
            say: { de: "Sonntag heißt Sunday. Das sind alle sieben Tage der Woche auf Englisch. Hör zu:", en: "Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday." }
            show: { drawn: table, rows: [[Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]], header: false }
          - text: "Monday = Montag\nSunday = Sonntag\nFriday = Freitag"
            say: { de: "Manche Tage klingen fast wie im Deutschen: Montag, Sonntag, Freitag.", en: "Monday. Sunday. Friday." }
          - text: "Tuesday = Dienstag\nThursday = Donnerstag"
            say: { de: "Pass bei diesen beiden auf. Tuesday ist Dienstag, mit einem einfachen t am Anfang. Thursday ist Donnerstag. Es fängt mit th an wie three.", en: "Tuesday. Thursday." }
          - text: "Wednesday = Mittwoch"
            say: { de: "Wednesday ist Mittwoch. Das d in der Mitte hörst du nicht.", en: "Wednesday." }
          - text: "Saturday, Sunday = weekend"
            say: { de: "Samstag und Sonntag sind das Wochenende. Tage schreibst du im Englischen immer mit großem Anfangsbuchstaben.", en: "Saturday and Sunday. It's the weekend!" }
          - text: "What day is it today?\nIt's Monday."
            say: { de: "So fragst du, welcher Tag heute ist, und so antwortest du:", en: "What day is it today? It's Monday." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Welcher Tag ist das?"
                say: { de: "Hör zu. Welcher Tag ist das?" }
                audio: { en: "Monday." }
                options: ["Montag", "Mittwoch", "Sonntag"]
                answer: "Montag"
                hints:
                  - "Hör noch einmal: Monday."
                  - "Das Wort klingt fast wie ein deutscher Tag."
                  - "„Monday“ ist Montag."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Tag fehlt? Monday, Tuesday, _ , Thursday"
                say: "Welcher Tag fehlt?"
                show: { drawn: table, rows: [[Monday, Tuesday, "?", Thursday]], header: false }
                options: ["Wednesday", "Friday", "Sunday"]
                answer: "Wednesday"
                option_audio: false
                feedback:
                  "Sunday": "Schon Sonntag? Dann wäre die Woche aber kurz! Nach Tuesday kommt Wednesday."
                hints:
                  - "Sag die Tage auf Deutsch: Montag, Dienstag, …"
                  - "Nach Dienstag kommt Mittwoch."
                  - "Mittwoch heißt „Wednesday“."
              - id: l1-f3
                type: speak
                text: "Monday, Tuesday, Wednesday, Thursday, Friday"
                say: { de: "Sag die Tage von Montag bis Freitag.", en: "Monday, Tuesday, Wednesday, Thursday, Friday." }
                expected_text: "Monday, Tuesday, Wednesday, Thursday, Friday."
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Bei „Wednesday“ hörst du das d nicht: Wensday."
                  - "Sprich mit mir: Monday, Tuesday, Wednesday, Thursday, Friday."
              - id: l1-f4
                type: true_false
                text: "Heißt das Samstag?"
                say: { de: "Hör zu. Heißt das Samstag?", en: "Saturday." }
                answer: true
                hints:
                  - "Hör noch einmal: Saturday."
                  - "Es ist ein Tag am Wochenende."
                  - "Ja. „Saturday“ ist Samstag."
              - id: l1-f5
                type: multiple_choice
                text: "Donnerstag heißt auf Englisch …"
                options: ["Tuesday", "Thursday", "Wednesday"]
                answer: "Thursday"
                option_audio: false
                feedback:
                  "Tuesday": "„Tuesday“ ist Dienstag. Donnerstag fängt mit th an wie three: Thursday."
                hints:
                  - "Zwei Tage fangen mit T an. Welcher ist Donnerstag?"
                  - "Donnerstag fängt mit th an, wie three."
                  - "Donnerstag heißt „Thursday“."
              - id: l1-f6
                type: ordering
                text: "Bring die Tage in die richtige Reihenfolge."
                options: ["Friday", "Wednesday", "Thursday"]
                slot_count: 3
                answer: ["Wednesday", "Thursday", "Friday"]
                option_audio: false
                hints:
                  - "Welcher Tag kommt in der Woche zuerst?"
                  - "Auf Deutsch: Mittwoch, Donnerstag, Freitag."
                  - "Wednesday, Thursday, Friday."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Welcher Tag ist das?"
                say: { de: "Hör zu. Welcher Tag ist das?" }
                audio: { en: "Thursday." }
                options: ["Dienstag", "Donnerstag", "Freitag"]
                answer: "Donnerstag"
                feedback:
                  "Dienstag": "Dienstag ist „Tuesday“. Du hast „Thursday“ gehört, mit th am Anfang. Das ist Donnerstag."
                hints: ["Hörst du am Anfang ein th wie bei three?"]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Tag fehlt? Friday, _ , Sunday"
                say: "Welcher Tag fehlt?"
                show: { drawn: table, rows: [[Friday, "?", Sunday]], header: false }
                options: ["Monday", "Saturday", "Thursday"]
                answer: "Saturday"
                option_audio: false
                hints: ["Zwischen Freitag und Sonntag liegt der Samstag."]
              - id: l1-s3
                type: speak
                text: "Heute ist Freitag."
                say: { de: "Heute ist Freitag. Sag es auf Englisch.", en: "It's Friday." }
                expected_text: "It's Friday."
                hints: ["Erst „It's“, dann der Tag."]
              - id: l1-s4
                type: true_false
                text: "Heißt das Montag?"
                say: { de: "Hör zu. Heißt das Montag?", en: "Sunday." }
                answer: false
                hints: ["Klingt das Wort wie Montag oder wie Sonntag?"]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Tage sind das Wochenende?"
                options: ["Friday and Saturday", "Saturday and Sunday", "Monday and Tuesday"]
                answer: "Saturday and Sunday"
                option_audio: false
                hints: ["An welchen zwei Tagen hast du keine Schule? Such sie auf Englisch."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Welcher Tag ist heute?"
                say: { de: "Hör zu. Welcher Tag ist heute?" }
                audio: { turns: [{ en: "What day is it today?", speaker: female }, { en: "It's Tuesday.", speaker: male }] }
                options: ["Donnerstag", "Dienstag", "Mittwoch"]
                answer: "Dienstag"
              - id: l1-n2
                type: ordering
                text: "Bring die Tage in die richtige Reihenfolge. Fang mit Freitag an."
                options: ["Sunday", "Saturday", "Monday", "Friday"]
                slot_count: 4
                answer: ["Friday", "Saturday", "Sunday", "Monday"]
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Dienstag heißt auf Englisch …"
                options: ["Thursday", "Wednesday", "Tuesday"]
                answer: "Tuesday"
                option_audio: false
              - id: l1-n4
                type: speak
                text: "Heute ist Mittwoch."
                say: { de: "Heute ist Mittwoch. Sag es auf Englisch." }
                expected_text: "It's Wednesday."
              - id: l1-n5
                type: true_false
                text: "Heißt das Mittwoch?"
                say: { de: "Hör zu. Heißt das Mittwoch?", en: "Wednesday." }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Welcher Tag ist das?"
            say: { de: "Hör zu. Welcher Tag ist das?" }
            audio: { en: "Friday." }
            options: ["Freitag", "Samstag", "Montag"]
            answer: "Freitag"
          - id: l1-c2
            type: multiple_choice
            text: "Sonntag heißt auf Englisch …"
            options: ["Sunday", "Saturday", "Monday"]
            answer: "Sunday"
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "Welcher Tag fehlt? Tuesday, _ , Thursday"
            say: "Welcher Tag fehlt?"
            show: { drawn: table, rows: [[Tuesday, "?", Thursday]], header: false }
            options: ["Wednesday", "Monday", "Friday"]
            answer: "Wednesday"
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Ist heute Wochenende?"
            say: { de: "Hör zu. Ist heute Wochenende?" }
            audio: { turns: [{ en: "What day is it today?", speaker: male }, { en: "It's Saturday!", speaker: female }] }
            answer: true
          - id: l1-c5
            type: audio_choice
            text: "Welchen Tag hörst du?"
            say: { de: "Hör zu. Welchen Tag hörst du?" }
            audio: { en: "Tuesday." }
            options: ["Thursday", "Tuesday", "Wednesday"]
            answer: "Tuesday"
          - id: l1-c6
            type: multiple_choice
            text: "An welchem Tag hast du Schule?"
            say: "An welchem Tag hast du Schule?"
            options: ["Sunday", "Saturday", "Monday"]
            answer: "Monday"
            option_audio: false

  - n: 2
    title: { de: "When's your birthday?", en: "When's your birthday?" }
    goal:
      de: "Lern die Monate und die Jahreszeiten und sag, wann du Geburtstag hast, so wie It's in May."
      en: "Learn the months and the seasons and say when your birthday is, like It's in May."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Welcher Tag ist das?"
            say: { de: "Weißt du noch? Welcher Tag ist das?" }
            audio: { en: "Wednesday." }
            options: ["Mittwoch", "Montag", "Donnerstag"]
            answer: "Mittwoch"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Weißt du noch? Welche Tage sind das Wochenende?"
            options: ["Saturday and Sunday", "Sunday and Monday", "Thursday and Friday"]
            answer: "Saturday and Sunday"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Mai = ?"
            say: { de: "Jetzt kommen die Monate. Was glaubst du: Wie heißt der Mai auf Englisch?" }
          - text: "January, February, March, April, May, June, July, August, September, October, November, December"
            say: { de: "Der Mai heißt May. Das Jahr hat zwölf Monate. Hör zu:", en: "January, February, March, April, May, June, July, August, September, October, November, December." }
            show: { drawn: table, rows: [[January, February, March, April], [May, June, July, August], [September, October, November, December]], header: false }
          - text: "March = März\nMay = Mai"
            say: { de: "Viele Monate klingen fast wie im Deutschen. Pass bei März und Mai auf. März heißt March, Mai heißt May.", en: "March. May." }
          - text: "June = Juni\nJuly = Juli"
            say: { de: "Auch Juni und Juli klingen ähnlich. Bei July hörst du am Ende ein ai. Juli endet ja auch mit i.", en: "June. July." }
          - text: "Wusstest du? September heißt eigentlich: der siebte Monat."
            say: { de: "Wusstest du? Im September steckt das alte römische Wort „septem“. Es heißt sieben. Bei den alten Römern fing das Jahr früher im März an. Da war der September der siebte Monat. Heute ist er der neunte!", en: "September." }
          - text: "spring, summer, autumn, winter"
            say: { de: "Das sind die vier Jahreszeiten: Frühling, Sommer, Herbst und Winter. In England ist Winter im Dezember, Januar und Februar, Sommer im Juni, Juli und August.", en: "Spring. Summer. Autumn. Winter." }
            show: { objects: [sun, snowman] }
          - text: "autumn = Herbst"
            say: { de: "Im Herbst fallen die bunten Blätter. Herbst heißt autumn.", en: "Autumn." }
            show: { object: leaf, colour: red }
          - text: "When's your birthday?\nMy birthday is in May."
            say: { de: "So fragst du, wann jemand Geburtstag hat, und so antwortest du. Vor dem Monat steht „in“:", en: "When's your birthday? My birthday is in May. It's in May." }
            show: { object: cake }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Welcher Monat ist das?"
                say: { de: "Hör zu. Welcher Monat ist das?" }
                audio: { en: "July." }
                options: ["Juni", "Juli", "Januar"]
                answer: "Juli"
                feedback:
                  "Juni": "Juni ist „June“. Du hast „July“ gehört, mit ai am Ende. Das ist Juli."
                hints:
                  - "Hör auf das Ende des Wortes."
                  - "Hörst du am Ende ein ai? Dann ist es der Monat, der mit i endet."
                  - "„July“ ist Juli."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welcher Monat fehlt? March, April, _ , June"
                say: "Welcher Monat fehlt?"
                show: { drawn: table, rows: [[March, April, "?", June]], header: false }
                options: ["July", "May", "August"]
                answer: "May"
                option_audio: false
                hints:
                  - "Sag die Monate auf Deutsch: März, April, …"
                  - "Nach April kommt Mai."
                  - "Mai heißt „May“."
              - id: l2-f3
                type: audio_choice
                text: "Wann hat das Kind Geburtstag?"
                say: { de: "Hör zu. Wann hat das Kind Geburtstag?" }
                audio: { turns: [{ en: "When's your birthday?", speaker: female }, { en: "It's in October.", speaker: male }] }
                options: ["im August", "im Oktober", "im Dezember"]
                answer: "im Oktober"
                hints:
                  - "Hör auf den Monat am Ende."
                  - "Das Kind sagt: It's in October."
                  - "„October“ ist Oktober."
              - id: l2-f4
                type: speak
                text: "My birthday is in May."
                say: { de: "Sag, wann du Geburtstag hast. Zum Beispiel so:", en: "My birthday is in May." }
                show: { object: cake }
                expected_text: "My birthday is in May."
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Vor dem Monat steht „in“."
                  - "Sag mit mir: My birthday is in May. Oder sag deinen eigenen Monat."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Jahreszeit ist das?"
                show: { object: leaf, colour: red }
                options: ["spring", "autumn", "winter"]
                answer: "autumn"
                option_audio: false
                feedback:
                  "spring": "„Spring“ ist der Frühling. Wenn die bunten Blätter fallen, ist Herbst: autumn."
                hints:
                  - "Wann fallen die bunten Blätter?"
                  - "Im Herbst."
                  - "Herbst heißt „autumn“."
              - id: l2-f6
                type: true_false
                text: "December, January, February: Ist das in England Sommer?"
                say: { de: "Hör zu. Ist das in England Sommer?", en: "December, January and February." }
                answer: false
                hints:
                  - "Welche Monate sind das auf Deutsch?"
                  - "Dezember, Januar, Februar. Ist es da warm oder kalt?"
                  - "Nein, das ist Winter."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Welcher Monat ist das?"
                say: { de: "Hör zu. Welcher Monat ist das?" }
                audio: { en: "March." }
                options: ["Mai", "März", "Montag"]
                answer: "März"
                feedback:
                  "Mai": "Mai heißt „May“. Du hast „March“ gehört. Das ist März."
                hints: ["Hörst du am Ende ein tsch? Dann ist es März."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie fragst du, wann jemand Geburtstag hat?"
                options: ["When's your birthday?", "How old are you?", "What day is it today?"]
                answer: "When's your birthday?"
                option_audio: false
                hints: ["„Birthday“ heißt Geburtstag."]
              - id: l2-s3
                type: speak
                text: "Frag nach dem Geburtstag."
                say: { de: "Frag deine Freundin, wann sie Geburtstag hat.", en: "When's your birthday?" }
                expected_text: "When's your birthday?"
                hints: ["Fang mit „When's“ an: Wann ist …?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welche Jahreszeit ist das?"
                show: { object: snowman }
                options: ["summer", "winter", "autumn"]
                answer: "winter"
                option_audio: false
                hints: ["Wann baust du einen Schneemann?"]
              - id: l2-s5
                type: ordering
                text: "Bring die Monate in die richtige Reihenfolge."
                options: ["December", "October", "November"]
                slot_count: 3
                answer: ["October", "November", "December"]
                option_audio: false
                hints: ["Auf Deutsch: Oktober, November, Dezember."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Wann hat das Kind Geburtstag?"
                say: { de: "Hör zu. Wann hat das Kind Geburtstag?" }
                audio: { en: "My birthday is in June.", speaker: female }
                options: ["im Juli", "im Januar", "im Juni"]
                answer: "im Juni"
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Monat fehlt? _ , February, March"
                say: "Welcher Monat fehlt?"
                show: { drawn: table, rows: [["?", February, March]], header: false }
                options: ["January", "June", "April"]
                answer: "January"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Mai heißt auf Englisch …"
                options: ["March", "May", "Monday"]
                answer: "May"
                option_audio: false
              - id: l2-n4
                type: speak
                text: "Mein Geburtstag ist im Juli."
                say: { de: "Sag auf Englisch: Mein Geburtstag ist im Juli." }
                expected_text: "My birthday is in July."
              - id: l2-n5
                type: true_false
                text: "Heißt das Frühling?"
                say: { de: "Hör zu. Heißt das Frühling?", en: "Spring." }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: days
            type: audio_choice
            text: "Welcher Tag ist heute?"
            say: { de: "Hör gut zu. Welcher Tag ist heute?" }
            audio: { en: "It's Thursday today." }
            options: ["Dienstag", "Donnerstag", "Freitag"]
            answer: "Donnerstag"
          - id: l2-c2
            part: days
            type: multiple_choice
            text: "Welcher Tag fehlt? Saturday, _ , Monday"
            say: "Welcher Tag fehlt?"
            show: { drawn: table, rows: [[Saturday, "?", Monday]], header: false }
            options: ["Friday", "Tuesday", "Sunday"]
            answer: "Sunday"
            option_audio: false
          - id: l2-c3
            part: birthday
            type: audio_choice
            text: "Wann hat Tom Geburtstag?"
            say: { de: "Hör gut zu. Wann hat Tom Geburtstag?" }
            audio: { en: "Hi, I'm Tom. I'm nine. My birthday is in August.", speaker: male }
            options: ["im April", "im August", "im Oktober"]
            answer: "im August"
          - id: l2-c4
            part: seasons
            type: multiple_choice
            text: "June, July, August: Welche Jahreszeit ist das in England?"
            options: ["spring", "winter", "summer"]
            answer: "summer"
            option_audio: false
          - id: l2-c5
            part: months
            type: ordering
            text: "Bring die Monate in die richtige Reihenfolge."
            options: ["April", "February", "March", "January"]
            slot_count: 4
            answer: ["January", "February", "March", "April"]
            option_audio: false
          - id: l2-c6
            part: days
            type: true_false
            text: "Ist heute Dienstag?"
            say: { de: "Hör zu. Ist heute Dienstag?" }
            audio: { turns: [{ en: "What day is it today?", speaker: female }, { en: "It's Thursday.", speaker: male }] }
            answer: false
          - id: l2-c7
            part: days
            type: matching
            text: "Was passt zusammen?"
