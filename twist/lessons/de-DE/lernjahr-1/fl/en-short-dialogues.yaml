# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-short-dialogues
skill: fl.listening.short-dialogues
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Kurze Gespräche verstehen
  en: Understanding short conversations
summary: >
  Lernjahr 1 starts by listening to short, slow conversations on familiar
  topics: meeting someone, pets, food, how someone feels. Lesson 1 finds
  what a conversation is about and who says what; lesson 2 picks out one
  detail (a name, an animal, a colour) and ends with the skill check. The
  conversations are spoken in English; questions and answers are in German
  or pictures, so the task tests listening, not reading.
metadata:
  year: lernjahr-1
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.familiar-words]
  also_practises: [fl.listening.classroom-phrases]
  vocabulary: { en: [hello, name, how old, pet, dog, cat, rabbit, hungry, apple, banana, happy, sad, red, blue, green, yellow] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: every-word
      what: Gives up because not every word is understood
      addressed: Learn says "Du musst nicht jedes Wort verstehen. Hör auf die Wörter, die du kennst."
    - id: first-word
      what: Picks the first familiar word heard instead of the answer to the question
      addressed: lesson 2 sets a wrong word early in the conversation; feedback says to listen to the end
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Worum geht es?", en: "What is it about?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Rabbit." }
            options: [{ object: rabbit }, { object: dog }, { object: cat }]
            answer: rabbit
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Banana." }
            options: [{ object: apple }, { object: banana }, { object: bread }]
            answer: banana
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: { de: "Du hörst jetzt ein kurzes Gespräch. Du musst nicht jedes Wort verstehen. Hör auf die Wörter, die du kennst.", en: "Hello! I'm Sam. What's your name? Hi, Sam. My name is Lily." }
          - text: "Sam, Lily"
            say: { de: "Hast du die Namen gehört? Sam und Lily. Die beiden sagen „hello“ und nennen ihre Namen. Sie lernen sich kennen." }
          - say: { de: "Noch ein Gespräch. Hör auf das Tier.", en: "Have you got a pet? Yes, I've got a dog. His name is Max." }
            show: { object: dog }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Worum geht es?" }
                audio: { en: "I'm hungry. Can I have an apple, please? Here you are." }
                options: ["ums Essen", "um Tiere", "um Farben"]
                answer: "ums Essen"
                hints:
                  - "Hör noch einmal. Welches Wort kennst du?"
                  - "„Apple“ heißt Apfel."
                  - "Es geht ums Essen."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Welches Tier hat das Kind?" }
                audio: { en: "Have you got a pet? Yes, I've got a cat." }
                options: [{ object: dog }, { object: cat }, { object: fish }]
                answer: cat
                hints:
                  - "Hör auf das Tier am Ende."
                  - "Das Kind sagt: I've got a cat."
                  - "„Cat“ heißt Katze."
              - id: l1-f3
                type: audio_choice
                say: { de: "Hör zu. Worum geht es?" }
                audio: { en: "Hello! How are you? I'm fine, thank you." }
                options: ["Zwei Kinder begrüßen sich.", "Zwei Kinder essen.", "Zwei Kinder malen."]
                answer: "Zwei Kinder begrüßen sich."
                hints:
                  - "„Hello“ kennst du."
                  - "„How are you?“ heißt: Wie geht es dir?"
                  - "Sie begrüßen sich."
              - id: l1-f4
                type: true_false
                say: { de: "Hör zu. Geht es um ein Tier?", en: "My favourite colour is blue. What's yours? I like red." }
                answer: false
                hints:
                  - "Hörst du „blue“ und „red“?"
                  - "Das sind Farben."
                  - "Nein, es geht um Farben."
              - id: l1-f5
                type: audio_choice
                say: { de: "Hör zu. Wie geht es dem Kind?" }
                audio: { en: "How are you today? I'm sad. I've lost my ball." }
                options: ["gut", "traurig", "müde"]
                answer: "traurig"
                hints:
                  - "Hör auf das Gefühl."
                  - "Das Kind sagt: I'm sad."
                  - "„Sad“ heißt traurig."
              - id: l1-f6
                type: audio_choice
                say: { de: "Hör zu. Wie heißt das Mädchen?" }
                audio: { turns: [{ en: "Hi! I'm Tom. What's your name?", speaker: male }, { en: "My name is Emma.", speaker: female }] }
                options: ["Tom", "Emma", "Lily"]
                answer: "Emma"
                feedback:
                  "Tom": "Tom ist der Junge. Er fragt nach dem Namen, das Mädchen antwortet."
                hints:
                  - "Wer sagt „My name is …“?"
                  - "Hör auf das Ende."
                  - "Das Mädchen heißt Emma."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Worum geht es?" }
                audio: { en: "Look! A big elephant! And there's a giraffe!" }
                options: ["um Tiere", "ums Essen", "um die Schule"]
                answer: "um Tiere"
                hints: ["„Elephant“ und „giraffe“ kennst du."]
              - id: l1-s2
                type: audio_choice
                say: { de: "Hör zu. Was möchte das Kind?" }
                audio: { en: "Can I have a banana, please? Yes, here you are." }
                options: [{ object: apple }, { object: banana }, { object: strawberry }]
                answer: banana
                hints: ["Hör auf das Essen."]
              - id: l1-s3
                type: true_false
                say: { de: "Hör zu. Stellt sich jemand vor?", en: "Hello! I'm Ben. I'm eight. Nice to meet you!" }
                answer: true
                hints: ["„I'm Ben“ heißt: Ich bin Ben."]
              - id: l1-s4
                type: audio_choice
                say: { de: "Hör zu. Wie geht es dem Kind?" }
                audio: { en: "Are you OK? Yes! I'm happy. It's my birthday!" }
                options: ["glücklich", "traurig", "krank"]
                answer: "glücklich"
                hints: ["„Happy“ heißt glücklich."]
              - id: l1-s5
                type: audio_choice
                say: { de: "Hör zu. Welches Tier ist es?" }
                audio: { en: "What's that? It's a frog. It's green." }
                options: [{ object: frog }, { object: fish }, { object: duck }]
                answer: frog
                hints: ["„Frog“ heißt Frosch."]
              - id: l1-s6
                type: audio_choice
                say: { de: "Hör zu. Worum geht es?" }
                audio: { en: "What colour is your bag? It's yellow. And yours? Mine is green." }
                options: ["um Farben", "um Zahlen", "um Tiere"]
                answer: "um Farben"
                hints: ["Hörst du „yellow“ und „green“?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Worum geht es?" }
                audio: { en: "I'm thirsty. Can I have some water, please? Of course." }
                options: ["ums Trinken", "um Farben", "um Tiere"]
                answer: "ums Trinken"
              - id: l1-n2
                type: audio_choice
                say: { de: "Hör zu. Welches Tier hat das Kind?" }
                audio: { en: "Have you got a pet? Yes, I've got a rabbit. It's white." }
                options: [{ object: rabbit }, { object: mouse }, { object: dog }]
                answer: rabbit
              - id: l1-n3
                type: true_false
                say: { de: "Hör zu. Geht es um Essen?", en: "Do you like pizza? Yes, I love pizza!" }
                answer: true
              - id: l1-n4
                type: audio_choice
                say: { de: "Hör zu. Wie heißt der Junge?" }
                audio: { turns: [{ en: "Hello, what's your name?", speaker: female }, { en: "I'm Leo. And you?", speaker: male }, { en: "I'm Mia.", speaker: female }] }
                options: ["Leo", "Mia", "Ben"]
                answer: "Leo"
              - id: l1-n5
                type: audio_choice
                say: { de: "Hör zu. Wie geht es dem Kind?" }
                audio: { en: "How are you? I'm tired. I want to sleep." }
                options: ["müde", "glücklich", "hungrig"]
                answer: "müde"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Worum geht es?" }
            audio: { en: "Good morning! How are you? Fine, thanks!" }
            options: ["Zwei Kinder begrüßen sich.", "Zwei Kinder spielen Fußball.", "Zwei Kinder essen."]
            answer: "Zwei Kinder begrüßen sich."
          - id: l1-c2
            type: audio_choice
            say: { de: "Hör zu. Welches Tier hat das Kind?" }
            audio: { en: "I've got a dog. He's brown." }
            options: [{ object: cat }, { object: dog }, { object: rabbit }]
            answer: dog
          - id: l1-c3
            type: audio_choice
            say: { de: "Hör zu. Was möchte das Kind?" }
            audio: { en: "Can I have an apple, please?" }
            options: [{ object: apple }, { object: banana }, { object: bread }]
            answer: apple

  - n: 2
    title: { de: Genau hinhören, en: Listening for details }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Worum geht es?" }
            audio: { en: "Have you got a pet? Yes, a cat." }
            options: ["um Tiere", "um Farben", "ums Essen"]
            answer: "um Tiere"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            say: { de: "Hör zu. Wie geht es dem Kind?" }
            audio: { en: "I'm happy!" }
            options: ["glücklich", "traurig", "müde"]
            answer: "glücklich"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: { de: "Jetzt hörst du genau hin. Die Frage ist: Welche Farbe hat der Ball? Hör bis zum Ende.", en: "Is your ball red? No, it isn't. It's blue." }
          - text: "red → blue"
            say: { de: "Zuerst hörst du „red“, also rot. Aber dann: „No, it isn't. It's blue.“ Der Ball ist blau. Hör immer bis zum Ende." }
          - say: { de: "Noch ein Beispiel. Wie alt ist Sam?", en: "How old are you, Sam? I'm nine." }
            text: "nine = 9"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Welche Farbe hat die Tasche?" }
                audio: { en: "Is your bag green? No, it's yellow." }
                options: ["grün", "gelb", "rot"]
                answer: "gelb"
                feedback:
                  "grün": "„Green“ kommt zuerst, aber dann hörst du: „No, it's yellow.“"
                hints:
                  - "Hör bis zum Ende."
                  - "„No“ heißt nein."
                  - "„Yellow“ heißt gelb."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { de: "Hör zu. Wie alt ist Lily?" }
                audio: { en: "How old are you, Lily? I'm eight." }
                options: ["7", "8", "9"]
                answer: "8"
                hints:
                  - "Hör auf die Zahl."
                  - "Lily sagt: I'm eight."
                  - "„Eight“ heißt acht."
              - id: l2-f3
                type: audio_choice
                say: { de: "Hör zu. Welches Tier mag das Kind am liebsten?" }
                audio: { en: "Do you like cats? They're OK. But I love dogs!" }
                options: [{ object: cat }, { object: dog }, { object: mouse }]
                answer: dog
                feedback:
                  cat: "Zuerst geht es um Katzen, aber die findet das Kind nur okay. Dann sagt es: „I love dogs!“"
                hints:
                  - "Hör auf „love“."
                  - "I love dogs."
                  - "Das Kind mag Hunde am liebsten."
              - id: l2-f4
                type: audio_choice
                say: { de: "Hör zu. Was isst das Kind?" }
                audio: { en: "What's for lunch? A sandwich and an apple." }
                options: ["ein Brot und einen Apfel", "eine Banane", "Pizza"]
                answer: "ein Brot und einen Apfel"
                hints:
                  - "Das Kind nennt zwei Sachen."
                  - "„Sandwich“ und „apple“."
                  - "Ein Brot und einen Apfel."
              - id: l2-f5
                type: true_false
                say: { de: "Hör zu. Heißt der Hund Max?", en: "What's your dog's name? His name is Rex." }
                answer: false
                hints:
                  - "Hör auf den Namen."
                  - "His name is Rex."
                  - "Nein, er heißt Rex."
              - id: l2-f6
                type: audio_choice
                say: { de: "Hör zu. Welche Farbe mag das Kind?" }
                audio: { en: "What's your favourite colour? Red? No, I like blue." }
                options: ["rot", "blau", "grün"]
                answer: "blau"
                hints:
                  - "Hör bis zum Ende."
                  - "No, I like blue."
                  - "Das Kind mag Blau."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Wie alt ist Tom?" }
                audio: { en: "Tom, how old are you? I'm ten." }
                options: ["8", "9", "10"]
                answer: "10"
                hints: ["„Ten“ heißt zehn."]
              - id: l2-s2
                type: audio_choice
                say: { de: "Hör zu. Welches Tier sieht das Kind?" }
                audio: { en: "Is that a duck? No, it's a goat!" }
                options: [{ object: duck }, { object: goat }, { object: cow }]
                answer: goat
                hints: ["Hör bis zum Ende."]
              - id: l2-s3
                type: audio_choice
                say: { de: "Hör zu. Welche Farbe hat der Hut?" }
                audio: { en: "I like your hat. Thank you, it's green." }
                options: ["grün", "blau", "gelb"]
                answer: "grün"
                hints: ["„Green“ heißt grün."]
              - id: l2-s4
                type: true_false
                say: { de: "Hör zu. Ist Ben neun?", en: "Are you nine, Ben? Yes, I am." }
                answer: true
                hints: ["Ben antwortet: Yes, I am. Das heißt: Ja, bin ich."]
              - id: l2-s5
                type: audio_choice
                say: { de: "Hör zu. Was trinkt das Kind?" }
                audio: { en: "Orange juice or milk? Milk, please." }
                options: ["Orangensaft", "Milch", "Wasser"]
                answer: "Milch"
                hints: ["Hör auf die Antwort am Ende."]
              - id: l2-s6
                type: audio_choice
                say: { de: "Hör zu. Wie heißt die Katze?" }
                audio: { en: "My cat is called Luna. She's black." }
                options: ["Lily", "Luna", "Lena"]
                answer: "Luna"
                hints: ["Hör genau auf den Namen."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Welche Farbe hat das Fahrrad?" }
                audio: { en: "Is your bike blue? No, it's red." }
                options: ["blau", "rot", "gelb"]
                answer: "rot"
              - id: l2-n2
                type: audio_choice
                say: { de: "Hör zu. Wie alt ist Emma?" }
                audio: { en: "How old are you, Emma? I'm seven." }
                options: ["7", "8", "11"]
                answer: "7"
              - id: l2-n3
                type: audio_choice
                say: { de: "Hör zu. Welches Tier mag das Kind am liebsten?" }
                audio: { en: "I like fish. But I love horses." }
                options: ["Fische", "Pferde", "Katzen"]
                answer: "Pferde"
              - id: l2-n4
                type: true_false
                say: { de: "Hör zu. Isst das Kind eine Banane?", en: "Do you want a banana? No, thanks. An apple, please." }
                answer: false
              - id: l2-n5
                type: audio_choice
                say: { de: "Hör zu. Wie heißt der Hund?" }
                audio: { en: "This is my dog. His name is Bobby." }
                options: ["Bobby", "Ben", "Max"]
                answer: "Bobby"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Worum geht es?" }
            audio: { en: "Look at the monkey! It's funny. And the lion is big!" }
            options: ["um Tiere", "ums Essen", "um Farben"]
            answer: "um Tiere"
          - id: l2-c2
            type: audio_choice
            say: { de: "Hör zu. Welche Farbe hat die Jacke?" }
            audio: { en: "Is your jacket black? No, it's blue." }
            options: ["schwarz", "blau", "rot"]
            answer: "blau"
          - id: l2-c3
            type: audio_choice
            say: { de: "Hör zu. Wie alt ist Mia?" }
            audio: { en: "Mia, how old are you? I'm eleven." }
            options: ["10", "11", "12"]
            answer: "11"
          - id: l2-c4
            type: audio_choice
            say: { de: "Hör zu. Welches Tier hat das Kind?" }
            audio: { en: "Have you got a pet? Yes, I've got a fish." }
            options: [{ object: fish }, { object: cat }, { object: dog }]
            answer: fish
          - id: l2-c5
            type: audio_choice
            say: { de: "Hör zu. Wie geht es dem Kind?" }
            audio: { en: "How are you? Not good. I'm sad." }
            options: ["glücklich", "traurig", "müde"]
            answer: "traurig"
