# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-short-dialogues
skill: fl.listening.short-dialogues
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Kurze Gespräche verstehen
  en: Understanding short conversations
summary: >
  Lernjahr 1 starts by listening to short, slow conversations on familiar
  topics: meeting someone, pets, food, how someone feels. Lesson 1 finds
  what a conversation is about and who says what; lesson 2 picks out one
  detail (a name, an animal, a colour) and ends with the skill check. The
  conversations are spoken in English; questions and answers are in German
  or pictures, so the task tests listening, not reading.
metadata:
  year: lernjahr-1
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.familiar-words]
  also_practises: [fl.listening.classroom-phrases]
  vocabulary: { en: [hello, name, how old, pet, dog, cat, rabbit, hungry, apple, banana, happy, sad, red, blue, green, yellow] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: topic, what: { de: "sagen, worum es im Gespräch geht", en: saying what a conversation is about } }
    - { id: who, what: { de: "verstehen, wer etwas sagt oder hat", en: understanding who says or has something } }
    - { id: detail, what: { de: "eine Einzelheit heraushören (Farbe, Alter, Tier, Gefühl)", en: "picking out a detail (a colour, an age, an animal, a feeling)" } }
  misconceptions:
    - id: every-word
      what: Gives up because not every word is understood
      addressed: Learn says "Du musst nicht jedes Wort verstehen. Hör auf die Wörter, die du kennst."
    - id: first-word
      what: Picks the first familiar word heard instead of the answer to the question
      addressed: lesson 2 sets a wrong word early in the conversation; feedback says to listen to the end
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Worum geht es?", en: "What is it about?" }
    goal:
      de: "Hör ein kurzes Gespräch auf Englisch und find heraus, worum es geht, zum Beispiel um ein Haustier."
      en: "Listen to a short chat in English and find out what it is about, like a pet."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Rabbit." }
            options: [{ object: rabbit }, { object: dog }, { object: cat }]
            answer: rabbit
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Banana." }
            options: [{ object: apple }, { object: banana }, { object: bread }]
            answer: banana
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: { de: "Du hörst jetzt ein kurzes Gespräch. Du musst nicht jedes Wort verstehen. Hör auf die Wörter, die du kennst. Was glaubst du: Wie heißen die beiden Kinder?", en: "Hello! I'm Sam. What's your name? Hi, Sam. My name is Lily." }
          - text: "Sam, Lily"
            say: { de: "Hast du die Namen gehört? Sam und Lily. Die beiden sagen „hello“ und nennen ihre Namen. Sie lernen sich kennen." }
          - say: { de: "Noch ein Gespräch. Hör auf das Tier.", en: "Have you got a pet? Yes, I've got a dog. His name is Max." }
            show: { object: dog }
          - text: "Wusstest du? Auf Englisch sagt man zu allen „you“."
            say: { de: "Wusstest du? Im Englischen gibt es kein du und kein Sie. Man sagt zu allen „you“: zu deinem Freund, zu deiner Lehrerin und sogar zum König." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Worum geht es?"
                say: { de: "Hör zu. Worum geht es?" }
                audio: { turns: [{ en: "I'm hungry. Can I have an apple, please?", speaker: male }, { en: "Here you are.", speaker: female }] }
                options: ["ums Essen", "um Tiere", "um Farben"]
                answer: "ums Essen"
                hints:
                  - "Hör noch einmal. Welches Wort kennst du?"
                  - "„Apple“ heißt Apfel."
                  - "Es geht ums Essen."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Welches Tier hat das Kind?"
                say: { de: "Hör zu. Welches Tier hat das Kind?" }
                audio: { turns: [{ en: "Have you got a pet?", speaker: female }, { en: "Yes, I've got a cat.", speaker: male }] }
                options: [{ object: dog }, { object: cat }, { object: fish }]
                answer: cat
                hints:
                  - "Hör auf das Tier am Ende."
                  - "Das Kind sagt: I've got a cat."
                  - "„Cat“ heißt Katze."
              - id: l1-f3
                type: audio_choice
                text: "Worum geht es?"
                say: { de: "Hör zu. Worum geht es?" }
                audio: { turns: [{ en: "Hello! How are you?", speaker: female }, { en: "I'm fine, thank you.", speaker: male }] }
                options: ["Zwei Kinder begrüßen sich.", "Zwei Kinder essen.", "Zwei Kinder malen."]
                answer: "Zwei Kinder begrüßen sich."
                hints:
                  - "„Hello“ kennst du."
                  - "„How are you?“ heißt: Wie geht es dir?"
                  - "Sie begrüßen sich."
              - id: l1-f4
                type: true_false
                text: "Geht es um ein Tier?"
                say: { de: "Hör zu. Geht es um ein Tier?" }
                audio: { turns: [{ en: "My favourite colour is blue. What's yours?", speaker: male }, { en: "I like red.", speaker: female }] }
                answer: false
                hints:
                  - "Hörst du „blue“ und „red“?"
                  - "Das sind Farben."
                  - "Nein, es geht um Farben."
              - id: l1-f5
                type: audio_choice
                text: "Wie geht es dem Kind?"
                say: { de: "Hör zu. Wie geht es dem Kind?" }
                audio: { turns: [{ en: "How are you today?", speaker: female }, { en: "I'm sad. I've lost my ball.", speaker: male }] }
                options: ["gut", "traurig", "müde"]
                answer: "traurig"
                hints:
                  - "Hör auf das Gefühl."
                  - "Das Kind sagt: I'm sad."
                  - "„Sad“ heißt traurig."
              - id: l1-f6
                type: audio_choice
                text: "Wie heißt das Mädchen?"
                say: { de: "Hör zu. Wie heißt das Mädchen?" }
                audio: { turns: [{ en: "Hi! I'm Tom. What's your name?", speaker: male }, { en: "My name is Emma.", speaker: female }] }
                options: ["Tom", "Emma", "Lily"]
                answer: "Emma"
                feedback:
                  "Tom": "Tom ist der Junge. Er fragt nach dem Namen, das Mädchen antwortet."
                hints:
                  - "Wer sagt „My name is …“?"
                  - "Hör auf das Ende."
                  - "Das Mädchen heißt Emma."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Worum geht es?"
                say: { de: "Hör zu. Worum geht es?" }
                audio: { en: "Look! A big elephant! And there's a giraffe!" }
                options: ["um Tiere", "ums Essen", "um die Schule"]
                answer: "um Tiere"
                hints: ["„Elephant“ und „giraffe“ kennst du."]
              - id: l1-s2
                type: audio_choice
                text: "Was möchte das Kind?"
                say: { de: "Hör zu. Was möchte das Kind?" }
                audio: { turns: [{ en: "Can I have a banana, please?", speaker: female }, { en: "Yes, here you are.", speaker: male }] }
                options: [{ object: apple }, { object: banana }, { object: strawberry }]
                answer: banana
                hints: ["Hör auf das Essen."]
              - id: l1-s3
                type: true_false
                text: "Stellt sich jemand vor?"
                say: { de: "Hör zu. Stellt sich jemand vor?" }
                audio: { en: "Hello! I'm Ben. I'm eight. Nice to meet you!", speaker: male }
                answer: true
                hints: ["„I'm Ben“ heißt: Ich bin Ben."]
              - id: l1-s4
                type: audio_choice
                text: "Wie geht es dem Kind?"
                say: { de: "Hör zu. Wie geht es dem Kind?" }
                audio: { turns: [{ en: "Are you OK?", speaker: male }, { en: "Yes! I'm happy. It's my birthday!", speaker: female }] }
                options: ["glücklich", "traurig", "krank"]
                answer: "glücklich"
                hints: ["„Happy“ heißt glücklich."]
              - id: l1-s5
                type: audio_choice
                text: "Welches Tier ist es?"
                say: { de: "Hör zu. Welches Tier ist es?" }
                audio: { turns: [{ en: "What's that?", speaker: male }, { en: "It's a frog. It's green.", speaker: female }] }
                options: [{ object: frog }, { object: fish }, { object: duck }]
                answer: frog
                hints: ["„Frog“ heißt Frosch."]
              - id: l1-s6
                type: audio_choice
                text: "Worum geht es?"
                say: { de: "Hör zu. Worum geht es?" }
                audio: { turns: [{ en: "What colour is your bag?", speaker: female }, { en: "It's yellow. And yours?", speaker: male }, { en: "Mine is green.", speaker: female }] }
                options: ["um Farben", "um Zahlen", "um Tiere"]
                answer: "um Farben"
                hints: ["Hörst du „yellow“ und „green“?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Worum geht es?"
                say: { de: "Hör zu. Worum geht es?" }
                audio: { turns: [{ en: "I'm thirsty. Can I have some water, please?", speaker: female }, { en: "Of course.", speaker: male }] }
                options: ["ums Trinken", "um Farben", "um Tiere"]
                answer: "ums Trinken"
              - id: l1-n2
                type: audio_choice
                text: "Welches Tier hat das Kind?"
                say: { de: "Hör zu. Welches Tier hat das Kind?" }
                audio: { turns: [{ en: "Have you got a pet?", speaker: male }, { en: "Yes, I've got a rabbit. It's white.", speaker: female }] }
                options: [{ object: rabbit }, { object: mouse }, { object: dog }]
                answer: rabbit
              - id: l1-n3
                type: true_false
                text: "Geht es um Essen?"
                say: { de: "Hör zu. Geht es um Essen?" }
                audio: { turns: [{ en: "Do you like pizza?", speaker: female }, { en: "Yes, I love pizza!", speaker: male }] }
                answer: true
              - id: l1-n4
                type: audio_choice
                text: "Wie heißt der Junge?"
                say: { de: "Hör zu. Wie heißt der Junge?" }
                audio: { turns: [{ en: "Hello, what's your name?", speaker: female }, { en: "I'm Leo. And you?", speaker: male }, { en: "I'm Mia.", speaker: female }] }
                options: ["Leo", "Mia", "Ben"]
                answer: "Leo"
              - id: l1-n5
                type: audio_choice
                text: "Wie geht es dem Kind?"
                say: { de: "Hör zu. Wie geht es dem Kind?" }
                audio: { turns: [{ en: "How are you?", speaker: male }, { en: "I'm tired. I want to sleep.", speaker: female }] }
                options: ["müde", "glücklich", "hungrig"]
                answer: "müde"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Worum geht es?"
            say: { de: "Hör zu. Worum geht es?" }
            audio: { turns: [{ en: "Good morning! How are you?", speaker: female }, { en: "Fine, thanks!", speaker: male }] }
            options: ["Zwei Kinder begrüßen sich.", "Zwei Kinder spielen Fußball.", "Zwei Kinder essen."]
            answer: "Zwei Kinder begrüßen sich."
          - id: l1-c2
            type: audio_choice
            text: "Welches Tier hat das Kind?"
            say: { de: "Hör zu. Welches Tier hat das Kind?" }
            audio: { en: "I've got a dog. He's brown.", speaker: female }
            options: [{ object: cat }, { object: dog }, { object: rabbit }]
            answer: dog
          - id: l1-c3
            type: audio_choice
            text: "Was möchte das Kind?"
            say: { de: "Hör zu. Was möchte das Kind?" }
            audio: { en: "Can I have an apple, please?", speaker: male }
            options: [{ object: apple }, { object: banana }, { object: bread }]
            answer: apple
          - id: l1-c6
            type: true_false
            text: "Geht es um Tiere?"
            say: { de: "Hör zu. Geht es um Tiere?" }
            audio: { turns: [{ en: "Look! A dog!", speaker: female }, { en: "And a cat!", speaker: male }] }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Worum geht es?"
            say: { de: "Hör zu. Worum geht es?" }
            audio: { turns: [{ en: "Do you like bananas?", speaker: male }, { en: "Yes! And I like apples.", speaker: female }] }
            options: ["um Farben", "um Tiere", "ums Essen"]
            answer: "ums Essen"
          - id: l1-c5
            type: audio_choice
            text: "Wie heißt der Junge?"
            say: { de: "Hör zu. Wie heißt der Junge?" }
            audio: { turns: [{ en: "Hello! I'm Sophie. Are you Tom?", speaker: female }, { en: "No, I'm Jonas.", speaker: male }] }
            options: ["Tom", "Sophie", "Jonas"]
            answer: "Jonas"

  - n: 2
    title: { de: Genau hinhören, en: Listening for details }
    goal:
      de: "Hör bis zum Ende zu und merk dir eine Kleinigkeit, zum Beispiel die Farbe vom Ball."
      en: "Listen right to the end and catch one small detail, like the colour of the ball."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Worum geht es?"
            say: { de: "Hör zu. Worum geht es?" }
            audio: { turns: [{ en: "Have you got a pet?", speaker: female }, { en: "Yes, a cat.", speaker: male }] }
            options: ["um Tiere", "um Farben", "ums Essen"]
            answer: "um Tiere"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Wie geht es dem Kind?"
            say: { de: "Hör zu. Wie geht es dem Kind?" }
            audio: { en: "I'm happy!", speaker: female }
            options: ["glücklich", "traurig", "müde"]
            answer: "glücklich"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: { de: "Jetzt hörst du genau hin. Was glaubst du: Welche Farbe hat der Ball? Hör bis zum Ende.", en: "Is your ball red? No, it isn't. It's blue." }
          - text: "red → blue"
            say: { de: "Zuerst hörst du „red“, also rot. Aber dann: „No, it isn't. It's blue.“ Der Ball ist blau. Hör immer bis zum Ende." }
          - say: { de: "Noch ein Beispiel. Wie alt ist Sam?", en: "How old are you, Sam? I'm nine." }
            text: "nine = 9"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Welche Farbe hat die Tasche?"
                say: { de: "Hör zu. Welche Farbe hat die Tasche?" }
                audio: { turns: [{ en: "Is your bag green?", speaker: male }, { en: "No, it's yellow.", speaker: female }] }
                options: ["grün", "gelb", "rot"]
                answer: "gelb"
                feedback:
                  "grün": "„Green“ kommt zuerst, aber dann hörst du: „No, it's yellow.“"
                hints:
                  - "Hör bis zum Ende."
                  - "„No“ heißt nein."
                  - "„Yellow“ heißt gelb."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Wie alt ist Lily?"
                say: { de: "Hör zu. Wie alt ist Lily?" }
                audio: { turns: [{ en: "How old are you, Lily?", speaker: male }, { en: "I'm eight.", speaker: female }] }
                options: ["7", "8", "9"]
                answer: "8"
                hints:
                  - "Hör auf die Zahl."
                  - "Lily sagt: I'm eight."
                  - "„Eight“ heißt acht."
              - id: l2-f3
                type: audio_choice
                text: "Welches Tier mag das Kind am liebsten?"
                say: { de: "Hör zu. Welches Tier mag das Kind am liebsten?" }
                audio: { turns: [{ en: "Do you like cats?", speaker: female }, { en: "They're OK. But I love dogs!", speaker: male }] }
                options: [{ object: cat }, { object: dog }, { object: mouse }]
                answer: dog
                feedback:
                  cat: "Zuerst geht es um Katzen, aber die findet das Kind nur okay. Dann sagt es: „I love dogs!“"
                hints:
                  - "Hör auf „love“."
                  - "I love dogs."
                  - "Das Kind mag Hunde am liebsten."
              - id: l2-f5
                type: true_false
                text: "Heißt der Hund Max?"
                say: { de: "Hör zu. Heißt der Hund Max?" }
                audio: { turns: [{ en: "What's your dog's name?", speaker: female }, { en: "His name is Rex.", speaker: male }] }
                answer: false
                hints:
                  - "Hör auf den Namen."
                  - "His name is Rex."
                  - "Nein, er heißt Rex."
              - id: l2-f4
                type: audio_choice
                text: "Was isst das Kind?"
                say: { de: "Hör zu. Was isst das Kind?" }
                audio: { turns: [{ en: "What's for lunch?", speaker: male }, { en: "A sandwich and an apple.", speaker: female }] }
                options: ["ein Brot und einen Apfel", "eine Banane", "Pizza"]
                answer: "ein Brot und einen Apfel"
                hints:
                  - "Das Kind nennt zwei Sachen."
                  - "„Sandwich“ und „apple“."
                  - "Ein Brot und einen Apfel."
              - id: l2-f6
                type: audio_choice
                text: "Welche Farbe mag das Kind?"
                say: { de: "Hör zu. Welche Farbe mag das Kind?" }
                audio: { turns: [{ en: "What's your favourite colour? Red?", speaker: male }, { en: "No, I like blue.", speaker: female }] }
                options: ["rot", "blau", "grün"]
                answer: "blau"
                hints:
                  - "Hör bis zum Ende."
                  - "No, I like blue."
                  - "Das Kind mag Blau."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Wie alt ist Tom?"
                say: { de: "Hör zu. Wie alt ist Tom?" }
                audio: { turns: [{ en: "Tom, how old are you?", speaker: female }, { en: "I'm ten.", speaker: male }] }
                options: ["8", "9", "10"]
                answer: "10"
                hints: ["„Ten“ heißt zehn."]
              - id: l2-s2
                type: audio_choice
                text: "Welches Tier sieht das Kind?"
                say: { de: "Hör zu. Welches Tier sieht das Kind?" }
                audio: { turns: [{ en: "Is that a duck?", speaker: female }, { en: "No, it's a goat!", speaker: male }] }
                options: [{ object: duck }, { object: goat }, { object: cow }]
                answer: goat
                hints: ["Hör bis zum Ende."]
              - id: l2-s3
                type: audio_choice
                text: "Welche Farbe hat der Hut?"
                say: { de: "Hör zu. Welche Farbe hat der Hut?" }
                audio: { turns: [{ en: "I like your hat.", speaker: female }, { en: "Thank you, it's green.", speaker: male }] }
                options: ["grün", "blau", "gelb"]
                answer: "grün"
                hints: ["„Green“ heißt grün."]
              - id: l2-s4
                type: true_false
                text: "Ist Ben neun?"
                say: { de: "Hör zu. Ist Ben neun?" }
                audio: { turns: [{ en: "Are you nine, Ben?", speaker: female }, { en: "Yes, I am.", speaker: male }] }
                answer: true
                hints: ["Ben antwortet: Yes, I am. Das heißt: Ja, bin ich."]
              - id: l2-s5
                type: audio_choice
                text: "Was trinkt das Kind?"
                say: { de: "Hör zu. Was trinkt das Kind?" }
                audio: { turns: [{ en: "Orange juice or milk?", speaker: male }, { en: "Milk, please.", speaker: female }] }
                options: ["Orangensaft", "Milch", "Wasser"]
                answer: "Milch"
                hints: ["Hör auf die Antwort am Ende."]
              - id: l2-s6
                type: audio_choice
                text: "Wie heißt die Katze?"
                say: { de: "Hör zu. Wie heißt die Katze?" }
                audio: { en: "My cat is called Luna. She's black.", speaker: female }
                options: ["Lily", "Luna", "Lena"]
                answer: "Luna"
                hints: ["Hör genau auf den Namen."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Welche Farbe hat das Fahrrad?"
                say: { de: "Hör zu. Welche Farbe hat das Fahrrad?" }
                audio: { turns: [{ en: "Is your bike blue?", speaker: female }, { en: "No, it's red.", speaker: male }] }
                options: ["blau", "rot", "gelb"]
                answer: "rot"
              - id: l2-n2
                type: audio_choice
                text: "Wie alt ist Emma?"
                say: { de: "Hör zu. Wie alt ist Emma?" }
                audio: { turns: [{ en: "How old are you, Emma?", speaker: male }, { en: "I'm seven.", speaker: female }] }
                options: ["7", "8", "11"]
                answer: "7"
              - id: l2-n3
                type: audio_choice
                text: "Welches Tier mag das Kind am liebsten?"
                say: { de: "Hör zu. Welches Tier mag das Kind am liebsten?" }
                audio: { en: "I like fish. But I love horses.", speaker: male }
                options: ["Fische", "Pferde", "Katzen"]
                answer: "Pferde"
              - id: l2-n4
                type: true_false
                text: "Isst das Kind eine Banane?"
                say: { de: "Hör zu. Isst das Kind eine Banane?" }
                audio: { turns: [{ en: "Do you want a banana?", speaker: female }, { en: "No, thanks. An apple, please.", speaker: male }] }
                answer: false
              - id: l2-n5
                type: audio_choice
                text: "Wie heißt der Hund?"
                say: { de: "Hör zu. Wie heißt der Hund?" }
                audio: { en: "This is my dog. His name is Bobby.", speaker: male }
                options: ["Bobby", "Ben", "Max"]
                answer: "Bobby"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: topic
            type: audio_choice
            text: "Worum geht es?"
            say: { de: "Hör zu. Worum geht es?" }
            audio: { en: "Look at the monkey! It's funny. And the lion is big!" }
            options: ["um Tiere", "ums Essen", "um Farben"]
            answer: "um Tiere"
          - id: l2-c2
            part: detail
            type: audio_choice
            text: "Welche Farbe hat die Jacke?"
            say: { de: "Hör zu. Welche Farbe hat die Jacke?" }
            audio: { turns: [{ en: "Is your jacket black?", speaker: male }, { en: "No, it's blue.", speaker: female }] }
            options: ["schwarz", "blau", "rot"]
            answer: "blau"
          - id: l2-c3
            part: detail
            type: audio_choice
            text: "Wie alt ist Mia?"
            say: { de: "Hör zu. Wie alt ist Mia?" }
            audio: { turns: [{ en: "Mia, how old are you?", speaker: male }, { en: "I'm eleven.", speaker: female }] }
            options: ["10", "11", "12"]
            answer: "11"
          - id: l2-c7
            part: topic
            type: true_false
            text: "Geht es um Farben?"
            say: { de: "Hör zu. Geht es um Farben?" }
            audio: { turns: [{ en: "Is your T-shirt green?", speaker: male }, { en: "Yes, and my shoes are green, too.", speaker: female }] }
            answer: true
          - id: l2-c4
            part: detail
            type: audio_choice
