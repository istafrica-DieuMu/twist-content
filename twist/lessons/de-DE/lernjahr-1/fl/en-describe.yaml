# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-describe
skill: fl.speaking.describe
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Tiere beschreiben
  en: Describing animals
summary: >
  Describing an animal in a few sentences: It's big and grey. It has got
  big ears. Lesson 1 understands animal riddles, heard and read, and finds
  the animal; lesson 2 builds descriptions with It's ... and It has got
  ..., plural body parts (four legs, two ears) and My cat is ..., and ends
  with the skill check. Speaking tasks are practice only, so Practise
  covers saying a description aloud; the skill check asks for the building
  blocks of a description and for understanding one.
metadata:
  year: lernjahr-1
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.ask-answer]
  also_practises: [fl.themes.outside-animals, fl.themes.body, fl.themes.colours]
  vocabulary: { en: [big, small, tall, long, short, grey, "It's ...", "It has got ...", ears, nose, neck, legs, tail, wings, shell, can fly, can jump] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: understand, what: { de: eine Tierbeschreibung verstehen und das Tier finden, en: understanding a description of an animal and finding the animal } }
    - { id: is-has, what: { de: "sagen, wie ein Tier ist und was es hat (It's … It has got …)", en: "saying what an animal is like and what it has got (It's … It has got …)" } }
    - { id: body, what: { de: "Körperteile in Einzahl und Mehrzahl nennen (a tail, four legs)", en: "naming body parts in the singular and plural (a tail, four legs)" } }
    - { id: build, what: { de: Sätze für eine Beschreibung wählen und bauen, en: choosing and building the sentences of a description } }
  misconceptions:
    - id: is-has
      what: Mixes up It's and It has got (It is a long tail, It has small)
      addressed: lesson 1 Learn says It's tells how it is and It has got tells what it has; the gap tasks in every stage of lesson 2 and the skill check ask for is or has
    - id: plural-s
      what: Leaves the plural -s off body parts (four leg, two ear)
      addressed: lesson 1 and 2 Learn bring legs and ears with -s; l2-f4 gives feedback on leg, and l2-n4 and l2-c5 keep the singular among the options
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Tierrätsel", en: "Animal riddles" }
    goal:
      de: "Hör dir ein Tierrätsel an und finde das Tier, so wie bei It's big and grey."
      en: "Listen to an animal riddle and find the animal, like It's big and grey."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Giraffe." }
            options: [{ object: giraffe }, { object: zebra }, { object: lion }]
            answer: giraffe
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Was hat das Kind?"
            say: { de: "Hör zu. Was hat das Kind?" }
            audio: { turns: [{ en: "Have you got a pet?", speaker: female }, { en: "Yes, I have. I've got a mouse.", speaker: male }] }
            options: [{ object: mouse }, { object: rabbit }, { object: cat }]
            answer: mouse
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "It's big. It's grey."
            say: { de: "So beschreibst du ein Tier. Mit „It's“ sagst du, wie es ist: groß, klein, grau.", en: "It's big. It's grey." }
          - text: "It has got big ears and a long nose."
            say: { de: "Mit „It has got“ sagst du, was es hat. Bei mehreren Ohren oder Beinen hängst du ein s an: „ears“, „legs“.", en: "It has got big ears and a long nose." }
          - text: "It's big and grey. It has got big ears and a long nose."
            say: { de: "Zusammen ist es ein Rätsel. Die Lösung: ein Elefant!", en: "It's big and grey. It has got big ears and a long nose. It's an elephant!" }
            show: { object: elephant }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                option_audio: false
                text: "It's small and grey. It has got a long tail.\nWelches Tier ist das?"
                say: { de: "Lies das Rätsel. Welches Tier ist das?" }
                options: [{ object: mouse }, { object: elephant }, { object: rabbit }]
                answer: mouse
                hints:
                  - "„Small“ heißt klein."
                  - "Welches kleine Tier hat einen langen Schwanz?"
                  - "Die Maus ist klein und grau und hat einen langen Schwanz."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Welches Tier ist das?"
                say: { de: "Hör das Rätsel. Welches Tier ist das?" }
                audio: { en: "It's tall. It's yellow and brown. It has got a long neck." }
                options: [{ object: giraffe }, { object: zebra }, { object: lion }]
                answer: giraffe
                hints:
                  - "„Tall“ heißt groß, hoch."
                  - "Hör auf das Ende: „a long neck“, ein langer Hals."
                  - "Die Giraffe hat einen langen Hals."
              - id: l1-f3
                type: audio_choice
                text: "Welches Tier ist das?"
                say: { de: "Hör das Rätsel. Welches Tier ist das?" }
                audio: { en: "It's long and green. It has got a big mouth and short legs." }
                options: [{ object: crocodile }, { object: snake }, { object: frog }]
                answer: crocodile
                feedback:
                  snake: "Eine Schlange hat keine Beine. Hör noch einmal: short legs."
                hints:
                  - "„Long“ heißt lang. Welche Tiere sind lang?"
                  - "Es hat einen großen Mund und kurze Beine."
                  - "Das Krokodil."
              - id: l1-f4
                type: true_false
                text: "It has got two legs and two wings. It can fly.\nPasst das Rätsel zum Bild?"
                say: { de: "Lies das Rätsel. Passt es zum Bild?" }
                show: { object: bird }
                answer: true
                hints:
                  - "„Wings“ sind Flügel."
                  - "„It can fly“ heißt: Es kann fliegen."
                  - "Ja, das ist ein Vogel."
              - id: l1-f5
                type: image_multiple_choice
                option_audio: false
                text: "It's black and white. It has got four legs.\nWelches Tier ist das?"
                say: { de: "Lies das Rätsel. Welches Tier ist das?" }
                options: [{ object: zebra }, { object: elephant }, { object: frog }]
                answer: zebra
                hints:
                  - "„Black and white“ heißt schwarz und weiß."
                  - "Welches Tier hat Streifen?"
                  - "Das Zebra."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Welches Tier ist das?"
                say: { de: "Hör das Rätsel. Welches Tier ist das?" }
                audio: { en: "It's small. It has got long ears and a short tail." }
                options: [{ object: rabbit }, { object: mouse }, { object: monkey }]
                answer: rabbit
                hints: ["„Long ears“ heißt lange Ohren."]
              - id: l1-s2
                type: image_multiple_choice
                option_audio: false
                text: "It's long. It hasn't got legs.\nWelches Tier ist das?"
                say: { de: "Lies das Rätsel. Welches Tier ist das?" }
                options: [{ object: snake }, { object: crocodile }, { object: giraffe }]
                answer: snake
                hints: ["„It hasn't got legs“ heißt: Es hat keine Beine."]
              - id: l1-s3
                type: true_false
                text: "It's small and slow. It has got a shell.\nPasst das Rätsel zum Bild?"
                say: { de: "Lies das Rätsel. Passt es zum Bild?" }
                show: { object: snail }
                answer: true
                hints: ["„Shell“ ist das Schneckenhaus."]
              - id: l1-s4
                type: audio_choice
                text: "Welches Tier ist das?"
                say: { de: "Hör das Rätsel. Welches Tier ist das?" }
                audio: { en: "It's very big. It lives in the sea." }
                options: [{ object: whale }, { object: elephant }, { object: fish }]
                answer: whale
                hints: ["„Sea“ heißt Meer."]
              - id: l1-s5
                type: image_multiple_choice
                option_audio: false
                text: "It's yellow and black. It's small, and it can fly.\nWelches Tier ist das?"
                say: { de: "Lies das Rätsel. Welches Tier ist das?" }
                options: [{ object: bee }, { object: frog }, { object: duck }]
                answer: bee
                hints: ["Welches kleine gelb-schwarze Tier fliegt?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Welches Tier ist das?"
                say: { de: "Hör das Rätsel. Welches Tier ist das?" }
                audio: { en: "It's small and brown. It has got lots of spikes." }
                options: [{ object: hedgehog }, { object: mouse }, { object: snail }]
                answer: hedgehog
              - id: l1-n2
                type: image_multiple_choice
                option_audio: false
                text: "It's small and green. It can jump. It lives near water.\nWelches Tier ist das?"
                say: { de: "Lies das Rätsel. Welches Tier ist das?" }
                options: [{ object: frog }, { object: crocodile }, { object: snake }]
                answer: frog
              - id: l1-n3
                type: true_false
                text: "It has got a long nose and big ears.\nPasst das Rätsel zum Bild?"
                say: { de: "Lies das Rätsel. Passt es zum Bild?" }
                show: { object: giraffe }
                answer: false
              - id: l1-n4
                type: audio_choice
                text: "Welches Tier ist das?"
                say: { de: "Hör das Rätsel. Welches Tier ist das?" }
                audio: { en: "It has got a long tail. It likes bananas." }
                options: [{ object: monkey }, { object: mouse }, { object: lion }]
                answer: monkey
              - id: l1-n5
                type: image_multiple_choice
                option_audio: false
                text: "It lives in the water. It hasn't got legs. It's small.\nWelches Tier ist das?"
                say: { de: "Lies das Rätsel. Welches Tier ist das?" }
                options: [{ object: fish }, { object: whale }, { object: duck }]
                answer: fish

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Welches Tier ist das?"
            say: { de: "Hör das Rätsel. Welches Tier ist das?" }
            audio: { en: "It's grey and very big. It has got a long nose." }
            options: [{ object: elephant }, { object: mouse }, { object: rabbit }]
            answer: elephant
          - id: l1-c2
            type: image_multiple_choice
            option_audio: false
            text: "It's tall. It has got a long neck and long legs.\nWelches Tier ist das?"
            say: { de: "Lies das Rätsel. Welches Tier ist das?" }
            options: [{ object: giraffe }, { object: zebra }, { object: cow }]
            answer: giraffe
          - id: l1-c3
            type: true_false
            text: "It's white. It has got four legs and a short tail.\nPasst das Rätsel zum Bild?"
            say: { de: "Lies das Rätsel. Passt es zum Bild?" }
            show: { object: sheep }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Welches Tier ist das?"
            say: { de: "Hör das Rätsel. Welches Tier ist das?" }
            audio: { en: "It's small and red. It has got six legs. It can fly." }
            options: [{ object: ant }, { object: ladybird }, { object: bee }]
            answer: ladybird
          - id: l1-c5
            type: image_multiple_choice
            option_audio: false
            text: "It's pink. It has got four short legs and a short tail.\nWelches Tier ist das?"
            say: { de: "Lies das Rätsel. Welches Tier ist das?" }
            options: [{ object: cow }, { object: pig }, { object: sheep }]
            answer: pig
          - id: l1-c6
            type: true_false
            text: "It's small. It has got a long nose.\nPasst das Rätsel zum Bild?"
            say: { de: "Lies das Rätsel. Passt es zum Bild?" }
            show: { object: elephant }
            answer: false

  - n: 2
    title: { de: "Selbst beschreiben", en: "Describing it yourself" }
    goal:
      de: "Beschreib ein Tier selbst mit It's und It has got, so wie It has got four legs."
      en: "Describe an animal yourself with It's and It has got, like It has got four legs."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Welches Tier ist das?"
            say: { de: "Hör das Rätsel. Welches Tier ist das?" }
            audio: { en: "It's small. It has got a shell." }
            options: [{ object: snail }, { object: frog }, { object: bee }]
            answer: snail
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            option_audio: false
            text: "It has got big ears and a long nose.\nWelches Tier ist das?"
            say: { de: "Lies das Rätsel. Welches Tier ist das?" }
            options: [{ object: elephant }, { object: giraffe }, { object: zebra }]
            answer: elephant
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "It's small. It has got a long tail."
            say: { de: "Jetzt beschreibst du selbst. Erst sagst du mit „It's“, wie es ist. Dann sagst du mit „It has got“, was es hat.", en: "It's small. It has got a long tail." }
            show: { object: mouse }
          - text: "four legs, two ears, a long tail"
            say: { de: "Hat es mehrere davon, hängst du ein s an: „four legs“, „two ears“. Hat es nur eins, sagst du „a“: „a tail“, „a nose“.", en: "Four legs. Two ears. A long tail." }
          - text: "My cat is small and orange. She has got a long tail."
            say: { de: "Bei deinem eigenen Tier sagst du „My cat is …“ und „He has got …“ oder „She has got …“.", en: "My cat is small and orange. She has got a long tail." }
            show: { object: cat }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz beschreibt das Tier?"
                say: { de: "Ihr spielt Tierrätsel. Welcher Satz beschreibt das Tier?" }
                show: { object: elephant }
                options: ["It has got big ears.", "It has got a long neck.", "It has got a shell."]
                answer: "It has got big ears."
                hints:
                  - "Schau dir das Tier genau an."
                  - "Was ist am Elefanten besonders groß?"
                  - "It has got big ears."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                option_audio: false
                text: "Ergänze die Beschreibung."
                say: { de: "Ergänze die Beschreibung der Maus." }
                show: { object: mouse }
                frame: "It _ small. It _ got a long tail."
                options: ["is", "has", "have"]
                answer: ["is", "has"]
                hints:
                  - "Wie ist die Maus? Und was hat sie?"
                  - "Wie sie ist: „It is“. Was sie hat: „It has got“."
                  - "It is small. It has got a long tail."
              - id: l2-f3
                type: ordering
                option_audio: false
                text: "Bau den Satz: Es hat einen langen Hals."
                say: { de: "Bau den Satz: Es hat einen langen Hals." }
                options: ["a long neck.", "has got", "It"]
                slot_count: 3
                answer: ["It", "has got", "a long neck."]
                hints:
                  - "Der Satz fängt mit „It“ an."
                  - "Danach kommt „has got“."
                  - "It has got a long neck."
              - id: l2-f4
                type: fill_in_blank
                option_audio: false
                text: "Ergänze die Beschreibung."
                say: { de: "Ergänze die Beschreibung des Zebras." }
                show: { object: zebra }
                frame: "It has got four _."
                options: ["legs", "leg", "ears"]
                answer: ["legs"]
                feedback:
                  "leg": "Es sind vier Beine, also mehrere. Dann hängst du ein s an: legs."
                hints:
                  - "Wie viele Beine hat das Zebra?"
                  - "Bei mehreren hängst du ein s an."
                  - "It has got four legs."
              - id: l2-f5
                type: speak
                say: { de: "Beschreibe das Kaninchen. Zum Beispiel so:", en: "It's small. It has got long ears." }
                show: { object: rabbit }
                expected_text: "It's small. It has got long ears."
                hints:
                  - "Fang mit „It's small“ an."
                  - "Dann sag, was es hat: „long ears“."
                  - "Sag mit mir: It's small. It has got long ears."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz beschreibt das Tier?"
                say: { de: "Ihr spielt Tierrätsel. Welcher Satz beschreibt das Tier?" }
                show: { object: snail }
                options: ["It has got a shell.", "It has got long ears.", "It has got four legs."]
                answer: "It has got a shell."
                hints: ["Was trägt die Schnecke auf dem Rücken?"]
              - id: l2-s2
                type: fill_in_blank
                option_audio: false
                text: "Ergänze die Beschreibung."
                say: { de: "Ergänze die Beschreibung der Giraffe." }
                show: { object: giraffe }
                frame: "It _ tall."
                options: ["is", "has", "got"]
                answer: ["is"]
                hints: ["Wie ist die Giraffe? Dann sagst du „It is“."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Bau den Satz: Meine Katze hat grüne Augen."
                say: { de: "Bau den Satz: Meine Katze hat grüne Augen." }
                options: ["green eyes.", "My cat", "has got"]
                slot_count: 3
                answer: ["My cat", "has got", "green eyes."]
                hints: ["Der Satz fängt mit „My cat“ an."]
              - id: l2-s4
                type: fill_in_blank
                option_audio: false
                text: "Ergänze die Beschreibung."
                say: { de: "Ergänze die Beschreibung des Vogels." }
                show: { object: bird }
                frame: "It has got two _."
                options: ["wings", "wing", "arms"]
                answer: ["wings"]
                hints: ["Es sind zwei, also mit s."]
              - id: l2-s5
                type: speak
                say: { de: "Beschreibe den Frosch. Zum Beispiel so:", en: "It's small and green. It can jump." }
                show: { object: frog }
                expected_text: "It's small and green. It can jump."
                hints: ["Fang mit „It's small“ an."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz beschreibt das Tier?"
                say: { de: "Ihr spielt Tierrätsel. Welcher Satz beschreibt das Tier?" }
                show: { object: crocodile }
                options: ["It has got a big mouth.", "It has got a long neck.", "It has got wings."]
                answer: "It has got a big mouth."
              - id: l2-n2
                type: fill_in_blank
                option_audio: false
                text: "Ergänze die Beschreibung."
                say: { de: "Ergänze die Beschreibung des Igels." }
                show: { object: hedgehog }
                frame: "It _ brown. It _ got lots of spikes."
                options: ["is", "has", "are"]
                answer: ["is", "has"]
              - id: l2-n3
                type: ordering
                option_audio: false
                text: "Bau den Satz: Mein Hund ist groß und braun."
                say: { de: "Bau den Satz: Mein Hund ist groß und braun." }
                options: ["big and brown.", "My dog", "is"]
                slot_count: 3
                answer: ["My dog", "is", "big and brown."]
              - id: l2-n4
                type: fill_in_blank
                option_audio: false
                text: "Ergänze die Beschreibung."
                say: { de: "Ergänze die Beschreibung des Elefanten." }
                show: { object: elephant }
                frame: "It has got two big _."
                options: ["ears", "ear", "legs"]
                answer: ["ears"]
              - id: l2-n5
                type: speak
                say: { de: "Beschreibe den Affen. Zum Beispiel so:", en: "It has got a long tail. It likes bananas." }
                show: { object: monkey }
                expected_text: "It has got a long tail. It likes bananas."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: build
            type: multiple_choice
            option_audio: false
            text: "Welcher Satz beschreibt das Tier?"
            say: { de: "Ihr spielt Tierrätsel. Welcher Satz beschreibt das Tier?" }
            show: { object: giraffe }
            options: ["It has got a long neck.", "It has got a shell.", "It has got big ears."]
            answer: "It has got a long neck."
          - id: l2-c2
            part: is-has
            type: fill_in_blank
            option_audio: false
            text: "Ergänze die Beschreibung."
            say: { de: "Ergänze die Beschreibung der Schlange." }
            show: { object: snake }
            frame: "It _ long."
            options: ["is", "has", "have"]
            answer: ["is"]
          - id: l2-c3
            part: build
            type: ordering
            option_audio: false
            text: "Bau den Satz: Es hat vier kurze Beine."
            say: { de: "Bau den Satz: Es hat vier kurze Beine." }
            options: ["four short legs.", "It", "has got"]
            slot_count: 3
            answer: ["It", "has got", "four short legs."]
          - id: l2-c4
            part: understand
            type: audio_choice
            text: "Welches Tier ist das?"
            say: { de: "Hör das Rätsel. Welches Tier ist das?" }
            audio: { en: "It's black and white. It gives us milk." }
            options: [{ object: cow }, { object: zebra }, { object: cat }]
            answer: cow
          - id: l2-c5
            part: body
            type: fill_in_blank
            option_audio: false
            text: "Ergänze die Beschreibung."
            say: { de: "Ergänze die Beschreibung der Ente." }
            show: { object: duck }
            frame: "It has got two _."
            options: ["legs", "leg", "ears"]
            answer: ["legs"]
          - id: l2-c6
            part: understand
            type: image_multiple_choice
            option_audio: false
            text: "It's small and white. It has got long ears. It can jump.\nWelches Tier ist das?"
            say: { de: "Lies das Rätsel. Welches Tier ist das?" }
            options: [{ object: mouse }, { object: frog }, { object: rabbit }]
            answer: rabbit
          - id: l2-c7
            part: understand
            type: audio_choice
            text: "Welches Tier ist das?"
            say: { de: "Hör das Rätsel. Welches Tier ist das?" }
            audio: { en: "It has got four short legs and a shell. It's slow." }
            options: [{ object: snail }, { object: tortoise }, { object: hedgehog }]
            answer: tortoise
          - id: l2-c8
            part: understand
            type: true_false
            text: "It's black and white. It has got two wings.\nPasst das Rätsel zum Bild?"
            say: { de: "Lies das Rätsel. Passt es zum Bild?" }
            show: { object: zebra }
            answer: false
          - id: l2-c9
            part: understand
            type: audio_choice
            text: "Welches Tier ist das?"
            say: { de: "Hör das Rätsel. Welches Tier ist das?" }
            audio: { en: "It's small and black. It has got eight legs." }
            options: [{ object: ant }, { object: bee }, { object: spider }]
            answer: spider
          - id: l2-c10
            part: is-has
            type: fill_in_blank
            option_audio: false
            text: "Ergänze die Beschreibung."
            say: { de: "Ergänze die Beschreibung des Elefanten." }
            show: { object: elephant }
            frame: "It _ got big ears. It _ grey."
            options: ["is", "has", "are"]
            answer: ["has", "is"]
