# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-details
skill: fl.listening.details
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Genau hinhören
  en: Listening for details
summary: >
  Picking one detail out of a short recording. Lesson 1 listens for numbers
  (an age, how many, a bus number) and colours; lesson 2 listens for names
  and times on the hour (at four o'clock), and ends with the skill check.
  Every recording holds a second number, colour or name, so the child must
  listen for the one the question asks about.
metadata:
  year: lernjahr-1
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.short-dialogues, fl.themes.numbers-to-20]
  also_practises: [fl.themes.colours, fl.themes.numbers-to-20]
  vocabulary: { en: [how old, years old, how many, number, colour, name, "o'clock", at] }
  forms: [audio, text, drawn]
  drawn: [colour-swatch, clock]
  facets: []
  parts:
    - { id: numbers, what: { de: "Zahlen heraushören (Alter, wie viele, Nummern)", en: "picking out numbers (an age, how many, a number)" } }
    - { id: colours, what: { de: Farben heraushören, en: picking out colours } }
    - { id: times, what: { de: volle Uhrzeiten heraushören, en: picking out times on the hour } }
    - { id: names, what: { de: "Namen heraushören und wissen, wer was hat oder macht", en: picking out names and who has or does what } }
  misconceptions:
    - id: first-detail
      what: Picks the first number, colour or name heard instead of the one the question asks about
      addressed: lesson 1 Learn plays Sam saying two before his age; every recording holds a second detail, and l1-f2 and l2-f1 give feedback when the other detail is chosen
    - id: teen-numbers
      what: Hears thirteen as three or thirty, seventeen as seven
      addressed: l1-f4, l1-s4, l1-n5 and l2-c5 set the teen number against the small number and the ty number
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zahlen und Farben heraushören", en: "Listening for numbers and colours" }
    goal:
      de: "Lies zuerst die Frage und hör dann genau hin, welche Zahl oder Farbe gemeint ist."
      en: "Read the question first, then listen closely for the number or colour it asks about."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Welche Zahl ist das?"
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Twelve." }
            options: ["12", "20", "2"]
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Worum geht es?"
            say: { de: "Hör zu. Worum geht es?" }
            audio: { turns: [{ en: "What's your favourite colour?", speaker: female }, { en: "Blue!", speaker: male }] }
            options: ["um Farben", "ums Essen", "um Tiere"]
            answer: "um Farben"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Wie alt ist Sam?"
            say: { de: "Manchmal musst du nur eine Sache heraushören: eine Zahl, eine Farbe, einen Namen. Lies zuerst die Frage. Dann weißt du, worauf du achten musst." }
          - text: "Wie alt ist Sam?"
            say: { de: "Hör zu. Achte nur auf das Alter.", en: "Hi, I'm Sam. I've got two sisters. I'm nine years old." }
          - text: "Sam ist 9."
            say: { de: "Sam sagt auch „two“, aber das sind seine Schwestern. Das Alter erkennst du an „years old“: I'm nine years old. Sam ist neun." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Wie alt ist Lily?"
                say: { de: "Hör zu. Wie alt ist Lily?" }
                audio: { en: "Hello, I'm Lily. I'm eight years old.", speaker: female }
                options: ["8", "6", "18"]
                answer: "8"
                hints:
                  - "Hör auf die Zahl vor „years old“."
                  - "I'm eight years old."
                  - "„Eight“ ist acht."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Wie viele Katzen hat Tom?"
                say: { de: "Hör zu. Wie viele Katzen hat Tom?" }
                audio: { en: "I'm Tom. I'm ten. I've got three cats and one dog.", speaker: male }
                options: ["3", "10", "1"]
                answer: "3"
                feedback:
                  "10": "„Ten“ ist Toms Alter. Hör auf die Zahl vor „cats“."
                hints:
                  - "Hör auf das Wort „cats“. Welche Zahl steht davor?"
                  - "I've got three cats."
                  - "„Three“ ist drei."
              - id: l1-f3
                type: audio_choice
                text: "Welche Farbe hat Emmas Fahrrad?"
                say: { de: "Hör zu. Welche Farbe hat Emmas Fahrrad?" }
                audio: { en: "I'm Emma. This is my bike. It's red. My brother's bike is blue.", speaker: female }
                options: [{ drawn: colour-swatch, colour: red }, { drawn: colour-swatch, colour: blue }, { drawn: colour-swatch, colour: green }]
                answer: red
                hints:
                  - "Emma spricht zuerst über ihr Fahrrad, dann über das Fahrrad ihres Bruders."
                  - "This is my bike. It's red."
                  - "„Red“ ist rot."
              - id: l1-f4
                type: audio_choice
                text: "Welche Nummer hat der Bus?"
                say: { de: "Hör zu. Welche Nummer hat der Bus?" }
                audio: { en: "Look, here comes the bus. It's number thirteen." }
                options: ["13", "3", "30"]
                answer: "13"
                hints:
                  - "Hör auf das Ende der Zahl."
                  - "„Thirteen“ endet mit „teen“, wie dreizehn mit zehn."
                  - "„Thirteen“ ist dreizehn."
              - id: l1-f5
                type: true_false
                text: "Hat Ben zwei Brüder?"
                say: { de: "Hör zu. Hat Ben zwei Brüder?" }
                audio: { en: "I'm Ben. I've got two sisters and one brother.", speaker: male }
                answer: false
                hints:
                  - "Hör auf „sisters“ und „brother“."
                  - "Two sisters, one brother."
                  - "Ben hat zwei Schwestern und einen Bruder."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Wie viele Äpfel möchte Mama?"
                say: { de: "Hör zu. Wie viele Äpfel möchte Mama?" }
                audio: { en: "Can I have six apples and two bananas, please?", speaker: female }
                options: ["6", "2", "8"]
                answer: "6"
                hints: ["Hör auf die Zahl vor „apples“."]
              - id: l1-s2
                type: audio_choice
                text: "Welche Farbe mag Mia am liebsten?"
                say: { de: "Hör zu. Welche Farbe mag Mia am liebsten?" }
                audio: { en: "My name's Mia. I like red and pink, but my favourite colour is purple.", speaker: female }
                options: [{ drawn: colour-swatch, colour: purple }, { drawn: colour-swatch, colour: red }, { drawn: colour-swatch, colour: pink }]
                answer: purple
                hints: ["Hör auf „favourite colour“."]
              - id: l1-s3
                type: audio_choice
                text: "Wie alt ist Leos Schwester?"
                say: { de: "Hör zu. Wie alt ist Leos Schwester?" }
                audio: { en: "I'm Leo. I'm eleven. My sister is fifteen.", speaker: male }
                options: ["15", "11", "50"]
                answer: "15"
                hints: ["Hör auf das, was nach „sister“ kommt."]
              - id: l1-s4
                type: audio_choice
                text: "Welche Hausnummer hat Anna?"
                say: { de: "Hör zu. Welche Hausnummer hat Anna?" }
                audio: { turns: [{ en: "Where do you live, Anna?", speaker: male }, { en: "I live at number seventeen, Park Road.", speaker: female }] }
                options: ["17", "7", "70"]
                answer: "17"
                hints: ["„Seventeen“ endet mit „teen“."]
              - id: l1-s5
                type: true_false
                text: "Ist Toms Hund braun?"
                say: { de: "Hör zu. Ist Toms Hund braun?" }
                audio: { en: "I'm Tom. This is my dog, Rex. He's black and white.", speaker: male }
                answer: false
                hints: ["Hör auf die Farben am Ende."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Wie viele Kinder sind in der Mannschaft?"
                say: { de: "Hör zu. Wie viele Kinder sind in der Mannschaft?" }
                audio: { en: "Our football team has got eleven children and two teachers.", speaker: male }
                options: ["11", "2", "12"]
                answer: "11"
              - id: l1-n2
                type: audio_choice
                text: "Welche Farbe hat die Tasche des Kindes?"
                say: { de: "Hör zu. Welche Farbe hat die Tasche des Kindes?" }
                audio: { turns: [{ en: "Is this your bag? The green one?", speaker: female }, { en: "No, my bag is yellow.", speaker: male }] }
                options: [{ drawn: colour-swatch, colour: yellow }, { drawn: colour-swatch, colour: green }, { drawn: colour-swatch, colour: blue }]
                answer: yellow
              - id: l1-n3
                type: audio_choice
                text: "Wie alt ist Max?"
                say: { de: "Hör zu. Wie alt ist Max?" }
                audio: { turns: [{ en: "Max, how old are you?", speaker: female }, { en: "I'm seven. And my brother is twelve.", speaker: male }] }
                options: ["7", "12", "17"]
                answer: "7"
              - id: l1-n4
                type: true_false
                text: "Kauft Sam vier Eier?"
                say: { de: "Sam ist im Laden. Hör zu. Kauft Sam vier Eier?" }
                audio: { en: "Four eggs, please. And some milk.", speaker: male }
                answer: true
              - id: l1-n5
                type: audio_choice
                text: "Wie viele Bleistifte hat Lea?"
                say: { de: "Hör zu. Wie viele Bleistifte hat Lea?" }
                audio: { turns: [{ en: "How many pencils have you got, Lea?", speaker: male }, { en: "I've got fourteen. And five crayons.", speaker: female }] }
                options: ["14", "5", "40"]
                answer: "14"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Wie viele Kaninchen hat Ella?"
            say: { de: "Hör zu. Wie viele Kaninchen hat Ella?" }
            audio: { en: "I'm Ella. I'm nine, and I've got two rabbits.", speaker: female }
            options: ["2", "9", "12"]
            answer: "2"
          - id: l1-c2
            type: audio_choice
            text: "Welche Farbe hat die Jacke?"
            say: { de: "Hör zu. Welche Farbe hat die Jacke?" }
            audio: { en: "My jacket is blue, and my hat is red.", speaker: female }
            options: [{ drawn: colour-swatch, colour: blue }, { drawn: colour-swatch, colour: red }, { drawn: colour-swatch, colour: yellow }]
            answer: blue
          - id: l1-c3
            type: true_false
            text: "Ist Ben zwölf Jahre alt?"
            say: { de: "Hör zu. Ist Ben zwölf Jahre alt?" }
            audio: { en: "Hi, I'm Ben. I'm twelve.", speaker: male }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Wie viele Brüder hat Paul?"
            say: { de: "Hör zu. Wie viele Brüder hat Paul?" }
            audio: { en: "I'm Paul. I've got one sister and two brothers.", speaker: male }
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c5
            type: audio_choice
            text: "Welche Farbe hat Lenas Ball?"
            say: { de: "Hör zu. Welche Farbe hat Lenas Ball?" }
            audio: { turns: [{ en: "Lena, is this your ball? The red one?", speaker: male }, { en: "No, my ball is orange.", speaker: female }] }
            options: [{ drawn: colour-swatch, colour: red }, { drawn: colour-swatch, colour: yellow }, { drawn: colour-swatch, colour: orange }]
            answer: orange
          - id: l1-c6
            type: true_false
            text: "Hat Jonas elf Murmeln?"
            say: { de: "Hör zu. Hat Jonas elf Murmeln?" }
            audio: { en: "I'm Jonas. I've got eleven marbles and seven stickers.", speaker: male }
            answer: true

  - n: 2
    title: { de: "Namen und Uhrzeiten heraushören", en: "Listening for names and times" }
    goal:
      de: "Hör genau hin, wer etwas hat und um wie viel Uhr etwas passiert, so wie at four o'clock."
      en: "Listen closely for who has something and what time things happen, like at four o'clock."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Wie alt ist Kim?"
            say: { de: "Hör zu. Wie alt ist Kim?" }
            audio: { en: "I'm Kim, and I'm ten years old.", speaker: female }
            options: ["10", "2", "12"]
            answer: "10"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Welche Farbe hat die Katze?"
            say: { de: "Hör zu. Welche Farbe hat die Katze?" }
            audio: { en: "This is my cat. She's black.", speaker: female }
            options: [{ drawn: colour-swatch, colour: black }, { drawn: colour-swatch, colour: white }, { drawn: colour-swatch, colour: brown }]
            answer: black
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Wer hat einen Hund?"
            say: { de: "Fragt jemand „Wer?“, dann achtest du auf die Namen. Merk dir, wer was hat oder macht.", en: "Hi, I'm Jack. This is my friend Ruby. Ruby has got a dog." }
          - text: "three o'clock"
            say: { de: "Volle Uhrzeiten hörst du so: „three o'clock“ heißt drei Uhr.", en: "It's three o'clock." }
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "at four o'clock"
            say: { de: "Hör auf „at“. „At four o'clock“ heißt: um vier Uhr.", en: "The party is at four o'clock." }
            show: { drawn: clock, hour: 4, minute: 0 }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Wer hat einen Hund?"
                say: { de: "Hör zu. Wer hat einen Hund?" }
                audio: { en: "Hi, I'm Jack. This is my friend Ruby. Ruby has got a dog. I've got a cat.", speaker: male }
                options: ["Jack", "Ruby", "Sam"]
                answer: "Ruby"
                feedback:
                  "Jack": "Jack hat eine Katze. Hör noch einmal: Ruby has got a dog."
                hints:
                  - "Hör auf das Wort „dog“. Welcher Name steht davor?"
                  - "Ruby has got a dog."
                  - "Ruby hat einen Hund."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Um wie viel Uhr ist die Party?"
                say: { de: "Hör zu. Um wie viel Uhr ist die Party?" }
                audio: { en: "Come to my party on Saturday! It's at four o'clock.", speaker: female }
                options: [{ drawn: clock, hour: 4, minute: 0 }, { drawn: clock, hour: 2, minute: 0 }, { drawn: clock, hour: 5, minute: 0 }]
                answer: "4:00"
                hints:
                  - "Hör auf die Zahl vor „o'clock“."
                  - "At four o'clock."
                  - "„Four“ ist vier. Die Party ist um vier Uhr."
              - id: l2-f3
                type: audio_choice
                text: "Wie heißt der neue Lehrer?"
                say: { de: "Hör zu. Wie heißt der neue Lehrer?" }
                audio: { en: "Good morning, children. My name is Mr Brown. I'm your new teacher.", speaker: male }
                options: ["Mr Brown", "Mr Green", "Mrs Brown"]
                answer: "Mr Brown"
                hints:
                  - "Hör auf „My name is …“."
                  - "„Mr“ sagt man zu einem Mann, „Mrs“ zu einer Frau."
                  - "Er heißt Mr Brown."
              - id: l2-f4
                type: true_false
                text: "Fängt die Schule um acht Uhr an?"
                say: { de: "Hör zu. Fängt die Schule um acht Uhr an?", en: "School starts at eight o'clock." }
                answer: true
                hints:
                  - "Hör auf die Zahl vor „o'clock“."
                  - "At eight o'clock."
                  - "Ja, „eight“ ist acht."
              - id: l2-f5
                type: audio_choice
                text: "Wann geht Tom ins Bett?"
                say: { de: "Hör zu. Wann geht Tom ins Bett?" }
                audio: { en: "I'm Tom. I go to bed at eight o'clock. My sister goes to bed at nine o'clock.", speaker: male }
                options: [{ drawn: clock, hour: 8, minute: 0 }, { drawn: clock, hour: 9, minute: 0 }, { drawn: clock, hour: 7, minute: 0 }]
                answer: "8:00"
                hints:
                  - "Tom spricht über sich und über seine Schwester."
                  - "I go to bed at eight o'clock."
                  - "Tom geht um acht Uhr ins Bett."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Wie heißt Olivers Schwester?"
                say: { de: "Hör zu. Wie heißt Olivers Schwester?" }
                audio: { en: "Hello, I'm Oliver, and this is my sister Grace. Grace is six.", speaker: male }
                options: ["Grace", "Oliver", "Rose"]
                answer: "Grace"
                hints: ["Hör auf „my sister …“."]
              - id: l2-s2
                type: audio_choice
                text: "Wann fängt der Film an?"
                say: { de: "Hör zu. Wann fängt der Film an?" }
                audio: { en: "Hurry up! The film starts at six o'clock.", speaker: female }
                options: [{ drawn: clock, hour: 6, minute: 0 }, { drawn: clock, hour: 7, minute: 0 }, { drawn: clock, hour: 10, minute: 0 }]
                answer: "6:00"
                hints: ["„Six“ ist sechs."]
              - id: l2-s3
                type: audio_choice
                text: "Wer hat den Bleistift?"
                say: { de: "Hör zu. Wer hat den Bleistift?" }
                audio: { turns: [{ en: "Who's got my pencil? Is it Amy?", speaker: female }, { en: "No, it's Harry.", speaker: male }] }
                options: ["Harry", "Amy", "Mia"]
                answer: "Harry"
                hints: ["Hör bis zum Ende."]
              - id: l2-s4
                type: true_false
                text: "Kommt der Bus um zehn Uhr?"
                say: { de: "Hör zu. Kommt der Bus um zehn Uhr?", en: "The bus comes at eleven o'clock." }
                answer: false
                hints: ["„Eleven“ ist nicht zehn."]
              - id: l2-s5
                type: audio_choice
                text: "Wie heißt der Hund?"
                say: { de: "Hör zu. Wie heißt der Hund?" }
                audio: { en: "Hi! My name's Zoe. My dog's name is Biscuit.", speaker: female }
                options: ["Biscuit", "Zoe", "Max"]
                answer: "Biscuit"
                hints: ["Zoe ist das Mädchen. Hör auf „my dog's name“."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Wann gibt es Mittagessen?"
                say: { de: "Hör zu. Wann gibt es Mittagessen?" }
                audio: { en: "Lunch is at twelve o'clock." }
                options: [{ drawn: clock, hour: 12, minute: 0 }, { drawn: clock, hour: 2, minute: 0 }, { drawn: clock, hour: 10, minute: 0 }]
                answer: "12:00"
              - id: l2-n2
                type: audio_choice
                text: "Wie heißt der Papa?"
                say: { de: "Hör zu. Wie heißt der Papa?" }
                audio: { en: "This is my family. My mum is Kate, and my dad is Tom.", speaker: female }
                options: ["Tom", "Kate", "Ben"]
                answer: "Tom"
              - id: l2-n3
                type: audio_choice
                text: "Um wie viel Uhr gehen die Kinder schwimmen?"
                say: { de: "Hör zu. Um wie viel Uhr gehen die Kinder schwimmen?" }
                audio: { en: "On Monday we go swimming at two o'clock.", speaker: male }
                options: [{ drawn: clock, hour: 2, minute: 0 }, { drawn: clock, hour: 3, minute: 0 }, { drawn: clock, hour: 10, minute: 0 }]
                answer: "2:00"
              - id: l2-n4
                type: true_false
                text: "Heißt die Katze Luna?"
                say: { de: "Hör zu. Heißt die Katze Luna?" }
                audio: { en: "Our cat's name is Luna. She's black.", speaker: female }
                answer: true
              - id: l2-n5
                type: audio_choice
                text: "Wer ist Ellas bester Freund?"
                say: { de: "Hör zu. Wer ist Ellas bester Freund?" }
                audio: { en: "I'm Ella. My best friend is Noah. My brother's best friend is Leo.", speaker: female }
                options: ["Noah", "Leo", "Ella"]
                answer: "Noah"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: numbers
            type: audio_choice
            text: "Wie viele Fische hat Chloe?"
            say: { de: "Hör zu. Wie viele Fische hat Chloe?" }
            audio: { en: "I'm Chloe. I'm nine, and I've got four fish.", speaker: female }
            options: ["4", "9", "14"]
            answer: "4"
          - id: l2-c2
            part: colours
            type: audio_choice
            text: "Welche Farbe hat Finns Fahrrad?"
            say: { de: "Hör zu. Welche Farbe hat Finns Fahrrad?" }
            audio: { en: "I'm Finn. My bike is green. Dad's bike is black.", speaker: male }
            options: [{ drawn: colour-swatch, colour: green }, { drawn: colour-swatch, colour: black }, { drawn: colour-swatch, colour: blue }]
            answer: green
          - id: l2-c3
            part: times
            type: audio_choice
            text: "Um wie viel Uhr ist das Schulfest?"
            say: { de: "Hör zu. Um wie viel Uhr ist das Schulfest?" }
            audio: { en: "The school fair is at three o'clock." }
            options: [{ drawn: clock, hour: 3, minute: 0 }, { drawn: clock, hour: 5, minute: 0 }, { drawn: clock, hour: 1, minute: 0 }]
            answer: "3:00"
          - id: l2-c4
            part: names
            type: audio_choice
            text: "Wer hat ein Kaninchen?"
            say: { de: "Hör zu. Wer hat ein Kaninchen?" }
            audio: { en: "Hi, I'm Lucy, and this is Jack. I've got a cat. Jack has got a rabbit.", speaker: female }
            options: ["Jack", "Lucy", "Ruby"]
            answer: "Jack"
          - id: l2-c5
            part: numbers
            type: audio_choice
            text: "Wie viele Sticker möchte das Kind?"
            say: { de: "Hör zu. Wie viele Sticker möchte das Kind?" }
            audio: { en: "Can I have sixteen stickers, please?", speaker: male }
            options: ["16", "6", "60"]
            answer: "16"
          - id: l2-c6
            part: numbers
            type: true_false
            text: "Ist Noahs Bruder vierzehn?"
            say: { de: "Hör zu. Ist Noahs Bruder vierzehn?" }
            audio: { en: "I'm Noah. I'm nine. My brother is four.", speaker: male }
            answer: false
          - id: l2-c7
            part: numbers
            type: audio_choice
            text: "Wie viele Kinder sind in der Klasse?"
            say: { de: "Hör zu. Wie viele Kinder sind in der Klasse?" }
            audio: { en: "There are nineteen children in my class. Nine are girls.", speaker: female }
            options: ["9", "19", "90"]
            answer: "19"
          - id: l2-c8
            part: numbers
            type: audio_choice
            text: "Wie viele Bücher hat Mia?"
            say: { de: "Hör zu. Wie viele Bücher hat Mia?" }
            audio: { en: "I'm Mia. I've got twelve books and twenty crayons.", speaker: female }
            options: ["20", "2", "12"]
            answer: "12"
          - id: l2-c9
            part: colours
            type: audio_choice
            text: "Welche Farbe hat Bens Mütze?"
