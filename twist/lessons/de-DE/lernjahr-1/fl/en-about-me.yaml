# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-about-me
skill: fl.grammar.chunks
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Über mich sprechen
  en: Talking about me
summary: >
  Fixed sentence patterns for talking about yourself: I am …, I have got
  …, I can …, I like …. Lesson 1 hears and matches I am, I have got and
  I can with pictures and numbers (I am eight. I have got a dog.); lesson
  2 adds I like, chooses the right pattern for what you want to say and
  puts the words of a sentence in order, and ends with the skill check. Instructions are in
  German; the sentences are spoken in English and shown in short form.
metadata:
  year: lernjahr-1
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.numbers-to-10, fl.listening.familiar-words]
  also_practises: [fl.listening.familiar-words, fl.speaking.imitate]
  vocabulary: { en: [I am, I have got, I can, I like, years old, dog, fish, football, swim, sing] }
  forms: [audio, picture, text]
  drawn: [dots]
  facets: []
  parts:
    - { id: am, what: { de: "sagen, wie alt ich bin (I am …)", en: "saying how old I am (I am …)" } }
    - { id: have-got, what: { de: "sagen, was ich habe (I have got …)", en: "saying what I have got (I have got …)" } }
    - { id: can, what: { de: "sagen, was ich kann (I can …)", en: "saying what I can do (I can …)" } }
    - { id: like, what: { de: "sagen, was ich mag (I like …)", en: "saying what I like (I like …)" } }
    - { id: order, what: { de: die Wörter eines Satzes in die englische Reihenfolge bringen, en: putting the words of a sentence in English order } }
  misconceptions:
    - id: german-word-order
      what: Builds English sentences in German order ("I have a dog got", "Football I like")
      addressed: every stage of lesson 2 has a word-order task and a "Welcher Satz ist richtig?" task with the German order as an option; l2-f4 gives feedback on "Football I like."
    - id: have-for-age
      what: Picks the wrong pattern for an age ("I have nine.", "I can nine.") while the four patterns are new
      addressed: lesson 1 Learn says an age takes I am; l1-f3, l2-w1 and l2-n4 offer "I have …" next to "I am …", with feedback in l1-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "I am, I have got, I can", en: "I am, I have got, I can" }
    goal:
      de: "Hör gut zu und erzähl etwas über dich mit I am, I have got oder I can, so wie I can swim."
      en: "Listen carefully and tell something about you with I am, I have got or I can, like I can swim."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf die passenden Punkte." }
            audio: { en: "Eight." }
            options:
              - { drawn: dots, count: 8, layout: dice }
              - { drawn: dots, count: 6, layout: dice }
              - { drawn: dots, count: 9, layout: dice }
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "A fish." }
            options: [{ object: dog }, { object: fish }, { object: ball }]
            answer: fish
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "I am eight."
            say: { de: "So sagst du, wie alt du bist. „I am“ heißt ich bin.", en: "I am eight. I am eight years old." }
          - text: "I have got a dog."
            say: { de: "So sagst du, was du hast:", en: "I have got a dog." }
            show: { object: dog }
          - text: "I can swim."
            say: { de: "So sagst du, was du kannst:", en: "I can swim." }
            show: { object: swim }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Wie alt ist das Kind?"
                say: { de: "Hör zu. Wie alt ist das Kind?" }
                audio: { en: "Hello! I am seven.", speaker: female }
                options:
                  - { drawn: dots, count: 7, layout: dice }
                  - { drawn: dots, count: 9, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                answer: "7"
                hints:
                  - "Hör auf die Zahl nach „I am“."
                  - "„Seven“ ist sieben."
                  - "Tippe auf die sieben Punkte."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Was hat das Kind?"
                say: { de: "Hör zu. Was hat das Kind?" }
                audio: { en: "I have got a fish.", speaker: male }
                options: [{ object: dog }, { object: fish }, { object: ball }]
                answer: fish
                hints:
                  - "Hör auf das Wort am Ende."
                  - "„Fish“ ist der Fisch."
                  - "Tippe auf den Fisch."
              - id: l1-f3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Ich bin neun“?"
                say: "Wie sagst du auf Englisch: Ich bin neun?"
                options: ["I am nine.", "I have nine.", "I can nine."]
                answer: "I am nine."
                option_audio: false
                feedback:
                  "I have nine.": "„I have“ heißt ich habe. Wie alt du bist, sagst du mit „I am“: I am nine."
                hints:
                  - "Wie alt du bist, sagst du mit „I am“."
                  - "„I am“ heißt ich bin."
                  - "Tippe auf „I am nine.“"
              - id: l1-f4
                type: audio_choice
                text: "Was kann das Kind?"
                say: { de: "Hör zu. Was kann das Kind?" }
                audio: { en: "I can sing.", speaker: female }
                options: [{ object: sing }, { object: swim }, { object: play-football }]
                answer: sing
                hints:
                  - "Hör auf das Wort nach „I can“."
                  - "„Sing“ ist singen."
                  - "Tippe auf das singende Kind."
              - id: l1-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden englischen Satzanfang mit dem deutschen."
                pairs:
                  - { left: { text: "I am" }, right: { text: "Ich bin" } }
                  - { left: { text: "I have got" }, right: { text: "Ich habe" } }
                  - { left: { text: "I can" }, right: { text: "Ich kann" } }
                hints:
                  - "Fang mit dem leichtesten Paar an: „I can“ klingt fast wie ich kann."
                  - "„I am“ heißt ich bin."
                  - "„I am“ ist ich bin, „I have got“ ist ich habe, „I can“ ist ich kann."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Wie alt ist Ben?"
                say: { de: "Hör zu. Wie alt ist Ben?" }
                audio: { en: "Hello! My name is Ben. I am nine years old.", speaker: male }
                options:
                  - { drawn: dots, count: 9, layout: dice }
                  - { drawn: dots, count: 8, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                answer: "9"
                hints: ["Hör auf die Zahl vor „years old“."]
              - id: l1-s2
                type: audio_choice
                text: "Was hat das Kind?"
                say: { de: "Hör zu. Was hat das Kind?" }
                audio: { en: "I have got a ball.", speaker: female }
                options: [{ object: ball }, { object: dog }, { object: book }]
                answer: ball
                hints: ["Hör auf das Ende des Satzes."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Ich kann lesen“?"
                say: "Wie sagst du auf Englisch: Ich kann lesen?"
                options: ["I can read.", "I am read.", "I have got read."]
                answer: "I can read."
                option_audio: false
                hints: ["Welcher Satzanfang heißt ich kann?"]
              - id: l1-s4
                type: audio_choice
                text: "Was kann das Kind?"
                say: { de: "Hör zu. Was kann das Kind?" }
                audio: { en: "I can dance.", speaker: male }
                options: [{ object: sing }, { object: dance }, { object: paint }]
                answer: dance
                hints: ["Hör auf das Wort nach „I can“."]
              - id: l1-s5
                type: true_false
                text: "„I have got a fish.“ Heißt das: Ich habe einen Hund?"
                say: { de: "Hör zu. Heißt der Satz: Ich habe einen Hund?" }
                audio: { en: "I have got a fish.", speaker: female }
                answer: false
                hints: ["Hör auf das letzte Wort."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Wie alt ist das Kind?"
                say: { de: "Hör zu. Wie alt ist das Kind?" }
                audio: { en: "I am ten.", speaker: male }
                options:
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                  - { drawn: dots, count: 8, layout: dice }
                answer: "10"
              - id: l1-n2
                type: audio_choice
                text: "Was hat das Kind?"
                say: { de: "Hör zu. Was hat das Kind?" }
                audio: { en: "I have got a bike.", speaker: female }
                options: [{ object: ball }, { object: bike }, { object: book }]
                answer: bike
              - id: l1-n3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Ich habe ein Buch“?"
                say: "Wie sagst du auf Englisch: Ich habe ein Buch?"
                options: ["I have got a book.", "I am a book.", "I can a book."]
                answer: "I have got a book."
                option_audio: false
              - id: l1-n4
                type: audio_choice
                text: "Was kann das Kind?"
                say: { de: "Hör zu. Was kann das Kind?" }
                audio: { en: "I can paint.", speaker: female }
                options: [{ object: paint }, { object: read }, { object: swim }]
                answer: paint
              - id: l1-n5
                type: true_false
                text: "„I can dance.“ Sagt das Kind, wie alt es ist?"
                say: { de: "Hör zu. Sagt das Kind, wie alt es ist?" }
                audio: { en: "I can dance.", speaker: male }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Wie alt ist das Kind?"
            say: { de: "Hör zu. Wie alt ist das Kind?" }
            audio: { en: "I am six.", speaker: male }
            options:
              - { drawn: dots, count: 6, layout: dice }
              - { drawn: dots, count: 7, layout: dice }
              - { drawn: dots, count: 9, layout: dice }
            answer: "6"
          - id: l1-c2
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Ich kann singen“?"
            say: "Wie sagst du auf Englisch: Ich kann singen?"
            options: ["I can sing.", "I am sing.", "I have got sing."]
            answer: "I can sing."
            option_audio: false
          - id: l1-c3
            type: audio_choice
            text: "Was hat das Kind?"
            say: { de: "Hör zu. Was hat das Kind?" }
            audio: { en: "I have got a cake.", speaker: female }
            options: [{ object: apple }, { object: banana }, { object: cake }]
            answer: cake
          - id: l1-c4
            type: true_false
            text: "Ist das Kind zehn Jahre alt?"
            say: { de: "Hör zu. Ist das Kind zehn Jahre alt?" }
            audio: { en: "Hi! I am nine.", speaker: female }
            answer: false
          - id: l1-c5
            type: audio_choice
            text: "Was hat das Kind?"
            say: { de: "Hör zu. Was hat das Kind?" }
            audio: { en: "I have got a dog and a ball.", speaker: male }
            options: ["einen Hund und einen Ball", "einen Hund und ein Buch", "einen Fisch und einen Ball"]
            answer: "einen Hund und einen Ball"
          - id: l1-c6
            type: multiple_choice
            text: "Lukas kann gut tanzen. Was sagt er?"
            say: "Lukas kann gut tanzen. Was sagt er?"
            options: ["I can dance.", "I am dance.", "I have got dance."]
            answer: "I can dance."
            option_audio: false

  - n: 2
    title: { de: "Ein Satz über mich", en: "A sentence about me" }
    goal:
      de: "Bau einen Satz über dich und wähl den passenden Anfang, zum Beispiel I like apples."
      en: "Build a sentence about you and pick the right start, like I like apples."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Ich bin acht“?"
            say: "Wie sagst du auf Englisch: Ich bin acht?"
            options: ["I am eight.", "I have eight.", "I can eight."]
            answer: "I am eight."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Was kann das Kind?"
            say: { de: "Hör zu. Was kann das Kind?" }
            audio: { en: "I can swim.", speaker: male }
            options: [{ object: swim }, { object: sing }, { object: read }]
            answer: swim
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I like apples."
            say: { de: "Mit „I like“ sagst du, was du magst.", en: "I like apples." }
            show: { object: apple }
          - text: "I · have got · a dog"
            say: { de: "Im Englischen bleibt „have got“ zusammen: erst „I“, dann „have got“, dann das, was du hast.", en: "I have got a dog." }
          - text: "I am … · I have got … · I can … · I like …"
            say: { de: "Mit diesen vier Satzanfängen kannst du viel über dich sagen. Überleg zuerst: Willst du sagen, wie alt du bist, was du hast, was du kannst oder was du magst?" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Bau den Satz: Ich habe einen Fisch."
                say: "Bau den Satz: Ich habe einen Fisch."
                options: ["got", "a fish", "I", "have"]
                slot_count: 4
                answer: ["I", "have", "got", "a fish"]
                hints:
                  - "Der Satz fängt mit „I“ an."
                  - "Dann kommt „have got“."
                  - "I have got a fish."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was passt? Du willst sagen, was du magst."
                say: "Du willst sagen, was du magst. Welcher Satzanfang passt?"
                options: ["I like …", "I am …", "I can …"]
                answer: "I like …"
                option_audio: false
                hints:
                  - "Welcher Satzanfang heißt ich mag?"
                  - "Mögen heißt „like“."
                  - "Tippe auf „I like …“."
              - id: l2-f3
                type: fill_in_blank
                text: "Ergänze den Satz: Ich kann tanzen."
                say: "Ergänze den Satz: Ich kann tanzen."
                frame: "I _ dance."
                options: ["can", "am", "have"]
                answer: ["can"]
                hints:
                  - "Welches englische Wort heißt kann?"
                  - "„I can“ klingt fast wie ich kann."
                  - "Tippe auf „can“."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Welcher Satz ist richtig?"
                options: ["I like football.", "Football I like.", "I football like."]
                answer: "I like football."
                option_audio: false
                feedback:
                  "Football I like.": "Im Englischen steht „I like“ vorne, dann das, was du magst."
                hints:
                  - "Fang mit „I like“ an."
                  - "Dann kommt das, was du magst."
                  - "Tippe auf „I like football.“"
              - id: l2-f5
                type: audio_choice
                text: "Was mag das Kind?"
                say: { de: "Hör zu. Was mag das Kind?" }
                audio: { en: "I like tennis.", speaker: female }
                options: [{ object: play-tennis }, { object: play-football }, { object: ride-bike }]
                answer: play-tennis
                hints:
                  - "Hör auf das Wort nach „I like“."
                  - "„Tennis“ klingt wie im Deutschen."
                  - "Tippe auf das Kind mit dem Tennisschläger."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Bau den Satz: Ich bin neun."
                say: "Bau den Satz: Ich bin neun."
                options: ["nine", "am", "I"]
                slot_count: 3
                answer: ["I", "am", "nine"]
                hints: ["Fang mit „I“ an."]
              - id: l2-s2
                type: multiple_choice
                text: "Was passt? Du willst sagen, was du hast."
                say: "Du willst sagen, was du hast. Welcher Satzanfang passt?"
                options: ["I have got …", "I can …", "I like …"]
                answer: "I have got …"
                option_audio: false
                hints: ["Welcher Satzanfang heißt ich habe?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Ergänze den Satz: Ich mag Hunde."
                say: "Ergänze den Satz: Ich mag Hunde."
                frame: "I _ dogs."
                options: ["like", "am", "can"]
                answer: ["like"]
                hints: ["Welches englische Wort heißt mögen?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Welcher Satz ist richtig?"
                options: ["I have got a cat.", "I have a cat got.", "A cat I have got."]
                answer: "I have got a cat."
                option_audio: false
                hints: ["„Have got“ bleibt zusammen."]
              - id: l2-s5
                type: audio_choice
                text: "Was mag das Kind?"
                say: { de: "Hör zu. Was mag das Kind?" }
                audio: { en: "I like books.", speaker: male }
                options: [{ object: book }, { object: ball }, { object: bike }]
                answer: book
                hints: ["Hör auf das Wort nach „I like“."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Bau den Satz: Ich kann singen."
                say: "Bau den Satz: Ich kann singen."
                options: ["sing", "I", "can"]
                slot_count: 3
                answer: ["I", "can", "sing"]
              - id: l2-n2
                type: multiple_choice
                text: "Was passt? Du willst sagen, wie alt du bist."
                say: "Du willst sagen, wie alt du bist. Welcher Satzanfang passt?"
                options: ["I am …", "I have got …", "I like …"]
                answer: "I am …"
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Ergänze den Satz: Ich habe einen Ball."
                say: "Ergänze den Satz: Ich habe einen Ball."
                frame: "I have _ a ball."
                options: ["got", "am", "can"]
                answer: ["got"]
              - id: l2-n4
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Welcher Satz ist richtig?"
                options: ["I am ten.", "I have ten.", "I ten am."]
                answer: "I am ten."
                option_audio: false
              - id: l2-n5
                type: audio_choice
                text: "Was mag das Kind?"
                say: { de: "Hör zu. Was mag das Kind?" }
                audio: { en: "I like cake.", speaker: female }
                options: [{ object: banana }, { object: cake }, { object: apple }]
                answer: cake

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: order
            type: ordering
            text: "Bau den Satz: Ich habe ein Fahrrad."
            say: "Bau den Satz: Ich habe ein Fahrrad."
            options: ["a bike", "got", "have", "I"]
            slot_count: 4
            answer: ["I", "have", "got", "a bike"]
          - id: l2-c2
            part: am
            type: fill_in_blank
            text: "Ergänze den Satz: Ich bin sieben."
            say: "Ergänze den Satz: Ich bin sieben."
            frame: "I _ seven."
            options: ["am", "have", "can"]
            answer: ["am"]
          - id: l2-c3
            part: can
            type: audio_choice
            text: "Was kann das Kind?"
            say: { de: "Hör zu. Was kann das Kind?" }
            audio: { en: "I can ride a bike.", speaker: male }
            options: [{ object: ride-bike }, { object: swim }, { object: dance }]
            answer: ride-bike
          - id: l2-c4
            part: can
            type: multiple_choice
            text: "Was passt? Du willst sagen, was du kannst."
            say: "Du willst sagen, was du kannst. Welcher Satzanfang passt?"
            options: ["I can …", "I am …", "I like …"]
            answer: "I can …"
            option_audio: false
          - id: l2-c5
            part: order
            type: multiple_choice
            text: "Welcher Satz ist richtig?"
            say: "Welcher Satz ist richtig?"
            options: ["I like bananas.", "Bananas I like.", "I bananas like."]
            answer: "I like bananas."
            option_audio: false
          - id: l2-c6
            part: am
            type: true_false
            text: "Ist Mia acht Jahre alt?"
            say: { de: "Hör zu. Ist Mia acht Jahre alt?" }
            audio: { en: "Hello! My name is Mia. I am eight years old.", speaker: female }
            answer: true
          - id: l2-c7
            part: am
            type: ordering
            text: "Bau den Satz: Ich bin zehn Jahre alt."
            say: "Bau den Satz: Ich bin zehn Jahre alt."
            options: ["years old.", "ten", "I", "am"]
            slot_count: 4
            answer: ["I", "am", "ten", "years old."]
            option_audio: false
          - id: l2-c8
            part: am
            type: multiple_choice
            text: "Welcher Satz sagt, wie alt jemand ist?"
            say: "Welcher Satz sagt, wie alt jemand ist?"
            options: ["I can swim.", "I am seven.", "I have got a cat."]
            answer: "I am seven."
            option_audio: false
          - id: l2-c9
            part: have-got
            type: audio_choice
            text: "Was hat das Kind?"
            say: { de: "Hör zu. Was hat das Kind?" }
            audio: { en: "I have got a ball. I have got a book, too.", speaker: male }
            options: ["einen Ball und ein Buch", "einen Ball und einen Hund", "ein Buch und ein Fahrrad"]
            answer: "einen Ball und ein Buch"
          - id: l2-c10
            part: have-got
            type: multiple_choice
            text: "Du hast ein Fahrrad. Was sagst du?"
            say: "Du hast ein Fahrrad. Was sagst du?"
            show: { object: bike }
            options: ["I am a bike.", "I have got a bike.", "I have a bike got."]
            answer: "I have got a bike."
            option_audio: false
          - id: l2-c11
            part: have-got
            type: fill_in_blank
            text: "Ergänze den Satz: Ich habe einen Kuchen."
            say: "Ergänze den Satz: Ich habe einen Kuchen."
            frame: "I _ _ a cake."
            options: ["have", "got", "am", "can"]
            answer: ["have", "got"]
          - id: l2-c12
            part: have-got
            type: true_false
            text: "Hat das Kind eine Katze?"
            say: { de: "Hör zu. Hat das Kind eine Katze?" }
            audio: { en: "I have got a dog and a fish.", speaker: female }
            answer: false
          - id: l2-c13
            part: can
            type: audio_choice
            text: "Was kann das Kind?"
            say: { de: "Hör zu. Was kann das Kind?" }
            audio: { en: "I can sing and I can dance.", speaker: female }
            options: ["singen und tanzen", "singen und malen", "schwimmen und tanzen"]
            answer: "singen und tanzen"
          - id: l2-c14
            part: can
            type: multiple_choice
            text: "Du kannst gut malen. Was sagst du?"
            say: "Du kannst gut malen. Was sagst du?"
            show: { object: paint }
            options: ["I am paint.", "Paint I can.", "I can paint."]
            answer: "I can paint."
            option_audio: false
