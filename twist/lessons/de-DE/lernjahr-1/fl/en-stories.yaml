# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-stories
skill: fl.listening.stories
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Geschichten hören
  en: Listening to stories
summary: >
  Short picture stories read aloud in English: a hungry mouse, a snowman,
  a kite in a tree, a birthday. Lesson 1 listens for the gist: who is in
  the story, what it is about and how it ends. Lesson 2 listens for the
  order of events with first, then and in the end, puts the pictures in
  order, and ends with the skill check. Questions are in German, so the
  task tests listening, not reading.
metadata:
  year: lernjahr-1
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.short-dialogues]
  also_practises: [fl.culture-strategies.guess-meaning, fl.themes.food]
  vocabulary: { en: [first, then, in the end, hungry, happy, sad, story] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: gist, what: { de: "verstehen, worum es in der Geschichte geht", en: understanding what the story is about } }
    - { id: detail, what: { de: "heraushören, wer etwas tut und was passiert", en: picking out who does something and what happens } }
    - { id: end, what: { de: "verstehen, wie die Geschichte endet", en: understanding how the story ends } }
    - { id: order, what: { de: die Bilder in die richtige Reihenfolge bringen, en: putting the pictures in order } }
  misconceptions:
    - id: every-word
      what: Gives up because not every word of the story is understood
      addressed: lesson 1 Learn says the child need not understand every word and should listen for the words it knows; the gist tasks ask only for those
    - id: first-mentioned
      what: Takes the first thing heard as the answer, even when the question asks how the story ends
      addressed: l1-f4 gives feedback when Mia's sad moment is taken for the ending; lesson 2 Learn brings first, then, in the end, and l2-f3 gives feedback when the last activity is taken for the first
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Worum geht es in der Geschichte?", en: "What is the story about?" }
    goal:
      de: "Hör eine kurze Geschichte, wie die von der hungrigen Maus, und find heraus, worum es geht."
      en: "Listen to a short story, like the one about the hungry mouse, and find out what it is about."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Welches Tier hat das Kind?"
            say: { de: "Hör zu. Welches Tier hat das Kind?" }
            audio: { turns: [{ en: "Have you got a pet?", speaker: female }, { en: "Yes, I've got a rabbit.", speaker: male }] }
            options: [{ object: rabbit }, { object: dog }, { object: cat }]
            answer: rabbit
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Worum geht es?"
            say: { de: "Hör zu. Worum geht es?" }
            audio: { turns: [{ en: "Can I have a banana, please?", speaker: male }, { en: "Here you are.", speaker: female }, { en: "Thank you!", speaker: male }] }
            options: ["ums Essen", "um Farben", "um Tiere"]
            answer: "ums Essen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: { de: "Du hörst jetzt eine Geschichte. Du musst nicht jedes Wort verstehen. Was glaubst du: Welche Tiere kommen darin vor? Hör auf die Wörter, die du kennst.", en: "Here is a little mouse. The mouse is hungry. It finds some cheese. Yum! But then a big cat comes. The mouse runs into its little house." }
            show: { objects: [mouse, cheese] }
          - say: { de: "Hast du die Tiere gehört? „Mouse“ und „cat“, die Maus und die Katze. Die Maus findet Käse. Dann kommt die Katze, und die Maus läuft schnell in ihr Haus." }
            show: { objects: [mouse, cat] }
          - text: "mouse, cheese, cat, house"
            say: { de: "Diese vier Wörter kennst du schon. Sie erzählen dir fast die ganze Geschichte." }
          - text: "Wusstest du? Es war einmal … heißt auf Englisch: Once upon a time …"
            say: { de: "Wusstest du? Bei uns fangen Märchen oft mit Es war einmal an. In England fangen sie oft so an: Once upon a time. Hörst du diese Wörter, weißt du gleich: Jetzt kommt eine Geschichte!", en: "Once upon a time." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Wer ist in der Geschichte?"
                say: { de: "Hör die Geschichte. Wer ist in der Geschichte?" }
                audio: { en: "It's winter and it's snowing. Ben makes a snowman. He puts his woolly hat on the snowman's head. Then the sun comes out. Oh no! The snowman is gone. But Ben has still got his hat." }
                options: [{ object: snowman }, { object: cat }, { object: dog }]
                answer: snowman
                hints:
                  - "Hör auf die Wörter, die du kennst."
                  - "„Snowman“ klingt fast wie Schneemann."
                  - "Ben baut einen Schneemann."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Worum geht es?"
                say: { de: "Hör die Geschichte. Worum geht es?" }
                audio: { en: "This is Max. Max is a dog, and he is very hungry. First he eats some bread. Then he drinks some milk. In the end he is very tired, and he goes to sleep in Dad's bed." }
                options: ["Ein Hund hat Hunger.", "Ein Hund spielt Ball.", "Ein Hund fährt Skateboard."]
                answer: "Ein Hund hat Hunger."
                hints:
                  - "Was macht Max in der Geschichte?"
                  - "Er frisst Brot und trinkt Milch."
                  - "„Hungry“ heißt hungrig. Max hat Hunger."
              - id: l1-f3
                type: true_false
                text: "Ist die Maus am Ende in ihrem Haus?"
                say: { de: "Hör die Geschichte. Ist die Maus am Ende in ihrem Haus?", en: "Here is a little mouse. The mouse is hungry. It finds some cheese. Yum! But then a big cat comes. The mouse runs into its little house." }
                answer: true
                hints:
                  - "Hör auf den letzten Satz."
                  - "The mouse runs into its little house."
                  - "Ja, die Maus läuft in ihr Haus."
              - id: l1-f4
                type: audio_choice
                text: "Wie fühlt sich Mia am Ende?"
                say: { de: "Hör die Geschichte. Wie fühlt sich Mia am Ende?" }
                audio: { en: "It's windy today. Mia has got a new kite. The kite flies up, up, up, into a tree! Mia is sad. Then Grandpa comes with a ladder. Now Mia is happy." }
                options: [{ object: happy }, { object: sad }, { object: angry }]
                answer: happy
                feedback:
                  sad: "Zuerst ist Mia traurig. Hör bis zum Ende: „Now Mia is happy.“"
                hints:
                  - "Hör bis zum letzten Satz."
                  - "Opa holt den Drachen mit der Leiter."
                  - "Now Mia is happy. Mia ist froh."
              - id: l1-f5
                type: audio_choice
                text: "Wo landet der Drachen?"
                say: { de: "Hör die Geschichte. Wo landet der Drachen?" }
                audio: { en: "It's windy today. Mia has got a new kite. The kite flies up, up, up, into a tree! Mia is sad. Then Grandpa comes with a ladder. Now Mia is happy." }
                options: [{ object: tree }, { object: house }, { object: boat }]
                answer: tree
                hints:
                  - "Hör auf „into a ...“."
                  - "Into a tree."
                  - "„Tree“ heißt Baum."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Wer hat Geburtstag?"
                say: { de: "Hör die Geschichte. Wer hat Geburtstag?" }
                audio: { en: "It's Lily's birthday. Mum makes a big cake. Lily's friends come with balloons. First they eat the cake. Then they play with a ball in the garden." }
                options: ["Lily", "Mama", "Ben"]
                answer: "Lily"
                hints: ["Hör auf den ersten Satz: It's ... birthday."]
              - id: l1-s2
                type: audio_choice
                text: "Was macht Mama?"
                say: { de: "Hör die Geschichte. Was macht Mama?" }
                audio: { en: "It's Lily's birthday. Mum makes a big cake. Lily's friends come with balloons. First they eat the cake. Then they play with a ball in the garden." }
                options: [{ object: cake }, { object: balloon }, { object: ball }]
                answer: cake
                hints: ["Hör auf „Mum makes ...“."]
              - id: l1-s3
                type: true_false
                text: "Ist der Schneemann am Ende noch da?"
                say: { de: "Hör die Geschichte. Ist der Schneemann am Ende noch da?", en: "It's winter and it's snowing. Ben makes a snowman. He puts his woolly hat on the snowman's head. Then the sun comes out. Oh no! The snowman is gone. But Ben has still got his hat." }
                answer: false
                hints: ["Die Sonne kommt. Was passiert mit Schnee in der Sonne?"]
              - id: l1-s4
                type: audio_choice
                text: "Was trinkt Max?"
                say: { de: "Hör die Geschichte. Was trinkt Max?" }
                audio: { en: "This is Max. Max is a dog, and he is very hungry. First he eats some bread. Then he drinks some milk. In the end he is very tired, and he goes to sleep in Dad's bed." }
                options: [{ object: milk }, { object: juice }, { object: water }]
                answer: milk
                hints: ["Hör auf „he drinks ...“."]
              - id: l1-s5
                type: audio_choice
                text: "Welches Tier sehen Tom und Oma?"
                say: { de: "Hör die Geschichte. Welches Tier sehen Tom und Oma?" }
                audio: { en: "Tom and his grandma go to the lake. They see a duck. The duck swims to their boat. Tom gives the duck some bread. Then it starts to rain, and they go home." }
                options: [{ object: duck }, { object: frog }, { object: fish }]
                answer: duck
                hints: ["Hör auf „They see a ...“."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Worum geht es?"
                say: { de: "Hör die Geschichte. Worum geht es?" }
                audio: { en: "Tom and his grandma go to the lake. They see a duck. The duck swims to their boat. Tom gives the duck some bread. Then it starts to rain, and they go home." }
                options: ["Ein Ausflug an den See", "Ein Geburtstag", "Ein Tag im Schnee"]
                answer: "Ein Ausflug an den See"
              - id: l1-n2
                type: audio_choice
                text: "Wer hilft Mia?"
                say: { de: "Hör die Geschichte. Wer hilft Mia?" }
                audio: { en: "It's windy today. Mia has got a new kite. The kite flies up, up, up, into a tree! Mia is sad. Then Grandpa comes with a ladder. Now Mia is happy." }
                options: [{ object: grandpa }, { object: dad }, { object: mum }]
                answer: grandpa
              - id: l1-n3
                type: true_false
                text: "Schläft Max am Ende?"
                say: { de: "Hör die Geschichte. Schläft Max am Ende?", en: "This is Max. Max is a dog, and he is very hungry. First he eats some bread. Then he drinks some milk. In the end he is very tired, and he goes to sleep in Dad's bed." }
                answer: true
              - id: l1-n4
                type: audio_choice
                text: "Vor wem hat die Biene Angst?"
                say: { de: "Hör die Geschichte. Vor wem hat die Biene Angst?" }
                audio: { en: "A little bee flies to a rose. Then it flies to a big tree. In the tree it sees a bird! The bee is scared, and it flies home very fast." }
                options: [{ object: bird }, { object: cat }, { object: frog }]
                answer: bird
              - id: l1-n5
                type: audio_choice
                text: "Was findet die Maus?"
                say: { de: "Hör die Geschichte. Was findet die Maus?" }
                audio: { en: "Here is a little mouse. The mouse is hungry. It finds some cheese. Yum! But then a big cat comes. The mouse runs into its little house." }
                options: [{ object: cheese }, { object: bread }, { object: apple }]
                answer: cheese

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Wo schläft Max?"
            say: { de: "Hör die Geschichte. Wo schläft Max?" }
            audio: { en: "This is Max. Max is a dog, and he is very hungry. First he eats some bread. Then he drinks some milk. In the end he is very tired, and he goes to sleep in Dad's bed." }
            options: [{ object: bed }, { object: chair }, { object: table }]
            answer: bed
          - id: l1-c2
            type: audio_choice
            text: "Wer kommt zur Maus?"
            say: { de: "Hör die Geschichte. Wer kommt zur Maus?" }
            audio: { en: "Here is a little mouse. The mouse is hungry. It finds some cheese. Yum! But then a big cat comes. The mouse runs into its little house." }
            options: [{ object: cat }, { object: dog }, { object: fox }]
            answer: cat
          - id: l1-c3
            type: true_false
            text: "Fliegt die Biene zu einer Rose?"
            say: { de: "Hör die Geschichte. Fliegt die Biene zu einer Rose?", en: "A little bee flies to a rose. Then it flies to a big tree. In the tree it sees a bird! The bee is scared, and it flies home very fast." }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Worum geht es?"
            say: { de: "Hör die Geschichte. Worum geht es?" }
            audio: { en: "Hannah has got a new puppy. The puppy is small and brown. Hannah plays with the puppy in the garden. In the evening the puppy sleeps in a box." }
            options: ["Hannahs Geburtstag", "Hannah und ihr kleiner Hund", "Ein Tag im Schnee"]
            answer: "Hannah und ihr kleiner Hund"
          - id: l1-c5
            type: audio_choice
            text: "Wie fühlt sich Finn am Ende?"
            say: { de: "Hör die Geschichte. Wie fühlt sich Finn am Ende?" }
            audio: { en: "Finn plays football all day. First he plays with Tom. Then he plays with his dad. In the end he is very tired." }
            options: [{ object: happy }, { object: angry }, { object: tired }]
            answer: tired
          - id: l1-c6
            type: true_false
            text: "Kommt in der Geschichte ein Hund vor?"
            say: { de: "Hör die Geschichte. Kommt in der Geschichte ein Hund vor?" }
            audio: { en: "A little bird sits in a tree. It sings a song. Then a cat comes, but the bird flies away." }
            answer: false

  - n: 2
    title: { de: "First, then, in the end", en: "First, then, in the end" }
    goal:
      de: "Achte auf first, then und in the end und leg die Bilder der Geschichte in die richtige Reihenfolge."
      en: "Listen for first, then and in the end, and put the story pictures in the right order."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Wohin läuft die Maus?"
            say: { de: "Hör die Geschichte. Wohin läuft die Maus?" }
            audio: { en: "Here is a little mouse. The mouse is hungry. It finds some cheese. Yum! But then a big cat comes. The mouse runs into its little house." }
            options: [{ object: house }, { object: tree }, { object: boat }]
            answer: house
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Was baut Ben?"
            say: { de: "Hör die Geschichte. Was baut Ben?" }
            audio: { en: "It's winter and it's snowing. Ben makes a snowman. He puts his woolly hat on the snowman's head. Then the sun comes out. Oh no! The snowman is gone. But Ben has still got his hat." }
            options: [{ object: snowman }, { object: cake }, { object: kite }]
            answer: snowman
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "zuerst = ?"
            say: { de: "Was glaubst du: Wie heißt zuerst auf Englisch? Ein Tipp: Es klingt ein bisschen wie das deutsche Wort Fürst." }
          - text: "first, then, in the end"
            say: { de: "Diese Wörter sagen dir, was nacheinander passiert. „First“ heißt zuerst, „then“ heißt dann, „in the end“ heißt am Ende.", en: "First. Then. In the end." }
          - say: { de: "Hör noch einmal die Geschichte von Max. Achte auf „first“, „then“ und „in the end“.", en: "This is Max. Max is a dog, and he is very hungry. First he eats some bread. Then he drinks some milk. In the end he is very tired, and he goes to sleep in Dad's bed." }
            show: { object: dog }
          - text: "bread, milk, bed"
            say: { de: "Zuerst frisst Max Brot, dann trinkt er Milch, am Ende schläft er im Bett. So legst du die Bilder: Brot, Milch, Bett." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                option_audio: false
                text: "Bring die Bilder in die richtige Reihenfolge."
                say: { de: "Hör die Geschichte. Bring die Bilder in die richtige Reihenfolge.", en: "This is Max. Max is a dog, and he is very hungry. First he eats some bread. Then he drinks some milk. In the end he is very tired, and he goes to sleep in Dad's bed." }
                options: [{ object: milk }, { object: bed }, { object: bread }]
                slot_count: 3
                answer: [bread, milk, bed]
                hints:
                  - "Hör auf „first“. Was frisst Max zuerst?"
                  - "First bread, then milk."
                  - "Brot, Milch, Bett."
                difficulty: easy
              - id: l2-f2
                type: ordering
                option_audio: false
                text: "Bring die Bilder in die richtige Reihenfolge."
                say: { de: "Hör die Geschichte. Bring die Bilder in die richtige Reihenfolge.", en: "Here is a little mouse. The mouse is hungry. It finds some cheese. Yum! But then a big cat comes. The mouse runs into its little house." }
                options: [{ object: house }, { object: cheese }, { object: cat }]
                slot_count: 3
                answer: [cheese, cat, house]
                hints:
                  - "Was findet die Maus zuerst?"
                  - "Erst der Käse, dann kommt die Katze."
                  - "Käse, Katze, Haus."
              - id: l2-f3
                type: audio_choice
                text: "Was machen die Kinder zuerst?"
                say: { de: "Hör die Geschichte. Was machen die Kinder zuerst?" }
                audio: { en: "It's Lily's birthday. Mum makes a big cake. Lily's friends come with balloons. First they eat the cake. Then they play with a ball in the garden." }
                options: [{ object: cake }, { object: ball }]
                answer: cake
                feedback:
                  ball: "Ball spielen sie danach. Hör auf „first“: First they eat the cake."
                hints:
                  - "Hör auf „first“."
                  - "First they eat the cake."
                  - "Zuerst essen sie den Kuchen."
              - id: l2-f4
                type: ordering
                option_audio: false
                text: "Bring die Bilder in die richtige Reihenfolge."
                say: { de: "Hör die Geschichte. Bring die Bilder in die richtige Reihenfolge.", en: "It's windy today. Mia has got a new kite. The kite flies up, up, up, into a tree! Mia is sad. Then Grandpa comes with a ladder. Now Mia is happy." }
                options: [{ object: ladder }, { object: kite }, { object: tree }]
                slot_count: 3
                answer: [kite, tree, ladder]
                hints:
                  - "Was hat Mia am Anfang?"
                  - "Der Drachen fliegt in den Baum. Dann kommt Opa."
                  - "Drachen, Baum, Leiter."
              - id: l2-f5
                type: audio_choice
                text: "Was passiert am Ende?"
                say: { de: "Hör die Geschichte. Was passiert am Ende?" }
                audio: { en: "Tom and his grandma go to the lake. They see a duck. The duck swims to their boat. Tom gives the duck some bread. Then it starts to rain, and they go home." }
                options: [{ object: rain }, { object: duck }, { object: bread }]
                answer: rain
                hints:
                  - "Hör auf den letzten Satz."
                  - "Then it starts to rain."
                  - "Am Ende regnet es."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                option_audio: false
                text: "Bring die Bilder in die richtige Reihenfolge."
                say: { de: "Hör die Geschichte. Bring die Bilder in die richtige Reihenfolge.", en: "It's winter and it's snowing. Ben makes a snowman. He puts his woolly hat on the snowman's head. Then the sun comes out. Oh no! The snowman is gone. But Ben has still got his hat." }
                options: [{ object: sun }, { object: snow }, { object: snowman }]
                slot_count: 3
                answer: [snow, snowman, sun]
                hints: ["Ohne Schnee gibt es keinen Schneemann."]
              - id: l2-s2
                type: ordering
                option_audio: false
                text: "Bring die Bilder in die richtige Reihenfolge."
                say: { de: "Hör die Geschichte. Bring die Bilder in die richtige Reihenfolge.", en: "A little bee flies to a rose. Then it flies to a big tree. In the tree it sees a bird! The bee is scared, and it flies home very fast." }
                options: [{ object: bird }, { object: rose }, { object: tree }]
                slot_count: 3
                answer: [rose, tree, bird]
                hints: ["Hör auf „then“: Then it flies to a big tree."]
              - id: l2-s3
                type: audio_choice
                text: "Was sehen Tom und Oma zuerst?"
                say: { de: "Hör die Geschichte. Was sehen Tom und Oma zuerst?" }
                audio: { en: "Tom and his grandma go to the lake. They see a duck. The duck swims to their boat. Tom gives the duck some bread. Then it starts to rain, and they go home." }
                options: [{ object: duck }, { object: rain }, { object: bread }]
                answer: duck
                hints: ["Hör auf den zweiten Satz: They see a ..."]
              - id: l2-s4
                type: ordering
                option_audio: false
                text: "Bring die Bilder in die richtige Reihenfolge."
                say: { de: "Hör die Geschichte. Bring die Bilder in die richtige Reihenfolge.", en: "It's Lily's birthday. Mum makes a big cake. Lily's friends come with balloons. First they eat the cake. Then they play with a ball in the garden." }
                options: [{ object: ball }, { object: balloon }, { object: cake }]
                slot_count: 3
                answer: [cake, balloon, ball]
                hints: ["Mama backt zuerst den Kuchen. Dann kommen die Freunde mit Luftballons."]
              - id: l2-s5
                type: ordering
                option_audio: false
