                say: { de: "Hör die Geschichte. Bring die Bilder in die richtige Reihenfolge.", en: "Tom and his grandma go to the lake. They see a duck. The duck swims to their boat. Tom gives the duck some bread. Then it starts to rain, and they go home." }
                options: [{ object: bread }, { object: rain }, { object: duck }]
                slot_count: 3
                answer: [duck, bread, rain]
                hints: ["Erst sehen sie die Ente, dann bekommt sie Brot."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                option_audio: false
                text: "Bring die Bilder in die richtige Reihenfolge."
                say: { de: "Hör die Geschichte. Bring die Bilder in die richtige Reihenfolge.", en: "It's Monday. Anna packs her school bag. First she puts in her book. Then she puts in her pencil case. In the end she puts in an apple for break time." }
                options: [{ object: apple }, { object: book }, { object: pencil-case }]
                slot_count: 3
                answer: [book, pencil-case, apple]
              - id: l2-n2
