# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-role-play
skill: fl.speaking.role-play
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Kleine Rollenspiele
  en: Little role plays
summary: >
  Two short everyday scenes with fixed phrases. Lesson 1 is in a shop:
  Finn buys fruit from Mrs Hill (Can I help you? Can I have …, please?
  Here you are. How much is it? One pound, please.). Lesson 2 is on a
  playground in England, where Paula meets Jack (What's your name? Nice to
  meet you. How old are you? Have you got a pet? Do you want to play?), and
  it ends with the skill check. The child picks the reply that fits, puts
  a scene's lines in order and speaks one part. Speaking is practised, not
  marked; the checks ask for the fitting reply, the order and details
  heard in a scene.
metadata:
  year: lernjahr-1
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 11
  builds_on: [fl.speaking.ask-answer, fl.themes.food]
  also_practises: [fl.speaking.greet, fl.listening.short-dialogues]
  vocabulary: { en: ["Can I help you?", "Can I have …, please?", "Here you are.", "How much is it?", "One pound, please.", "Thank you.", goodbye, "What's your name?", "I'm …", "Nice to meet you.", "How old are you?", "Have you got a pet?", "No, I haven't.", "Do you want to play?", "Yes, please!"] }
  forms: [audio, text, picture]
  drawn: []
  facets: []
  parts:
    - { id: reply, what: { de: im Gespräch die passende Antwort wählen, en: choosing the reply that fits in a conversation } }
    - { id: phrase, what: { de: "wissen, was man in einer Lage sagt", en: knowing what to say in a situation } }
    - { id: order, what: { de: ein Gespräch in die richtige Reihenfolge bringen, en: putting a conversation in order } }
    - { id: listen, what: { de: ein kurzes Alltagsgespräch verstehen, en: understanding a short everyday conversation } }
  misconceptions:
    - id: please-thank-you
      what: Says thank you when asking and please when receiving, as with bitte and danke in German
      addressed: lesson 1 Learn explains Here you are; l1-s4 offers "Can I have some juice, thank you?" with feedback, and l1-s1 asks for the reply when something is handed over
    - id: question-mixup
      what: Answers a question with the reply to a different one (How old are you? I'm fine.; Can I help you? I'm fine, thank you.)
      addressed: every stage has a "Was antwortest du?" task with a reply to another question among the options, with feedback in l1-f1, l2-f1 and l2-s1; a "Passt die Antwort?" task in the some stages sets a wrong reply
    - id: have-got-answer
      what: Answers Have you got …? with Yes, I do or No, I don't
      addressed: lesson 2 Learn models No, I haven't; l2-s4 offers No, I don't, with feedback
    - id: line-order
      what: Knows the phrases but not who says what when, so the scene does not work
      addressed: every stage has an ordering task with the lines of a scene (l1-f5, l1-s5, l1-n4, l2-f5, l2-s5, l2-n4), and the skill check has one (l2-c3)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Im Laden", en: "In the shop" }
    goal:
      de: "Kauf im Laden auf Englisch ein, mit Sätzen wie Can I have two bananas, please."
      en: "Go shopping in English with sentences like Can I have two bananas, please."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Du möchtest Brot. Wie fragst du?"
            say: "Du möchtest Brot. Wie fragst du auf Englisch?"
            options: ["Can I have some bread, please?", "I don't like bread.", "What colour is it?"]
            answer: "Can I have some bread, please?"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Mag das Kind Käse?"
            say: { de: "Hör zu. Mag das Kind Käse?" }
            audio: { turns: [{ en: "Do you like cheese?", speaker: female }, { en: "No, I don't.", speaker: male }] }
            options: ["Ja, es mag Käse.", "Nein, es mag keinen Käse."]
            answer: "Nein, es mag keinen Käse."
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Finn möchte zwei Bananen."
            say: { de: "Finn ist in einem Laden in England. Er möchte zwei Bananen. Was glaubst du: Welches Wort sagt er, damit seine Bitte höflich ist?" }
            show: { object: banana }
          - text: "Mrs Hill: Hello! Can I help you?\nFinn: Yes, please. Can I have two bananas, please?"
            say: { de: "Finn kauft bei Mrs Hill ein. Hör zu. Hörst du das höfliche Wort? Es heißt „please“.", en: "Hello! Can I help you? Yes, please. Can I have two bananas, please?" }
            show: { object: banana }
          - text: "Mrs Hill: Here you are.\nFinn: How much is it?\nMrs Hill: One pound, please."
            say: { de: "Mrs Hill gibt ihm die Bananen. Finn fragt, was sie kosten. In England bezahlt man mit Pfund.", en: "Here you are. How much is it? One pound, please." }
          - text: "Wusstest du? Das Zeichen £ ist ein großes L."
            say: { de: "Wusstest du? Das Zeichen für Pfund ist eigentlich ein großes L mit einem Strich. Das L kommt von „libra“. So hieß das Pfund bei den alten Römern.", en: "One pound." }
          - text: "Finn: Here you are. Thank you. Goodbye!\nMrs Hill: Goodbye!"
            say: { de: "Finn bezahlt, bedankt sich und verabschiedet sich.", en: "Here you are. Thank you. Goodbye! Goodbye!" }
          - text: "Here you are. = Bitte schön.\nThank you. = Danke."
            say: { de: "„Here you are“ sagst du, wenn du jemandem etwas gibst. Wenn du etwas bekommst, sagst du „thank you“. Und wenn du um etwas bittest, sagst du „please“." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Mrs Hill: Hello! Can I help you?\nWas antwortest du?"
                say: { de: "Mrs Hill fragt dich etwas. Was antwortest du?" }
                audio: { en: "Hello! Can I help you?", speaker: female }
                options: ["Yes, please. Can I have an apple, please?", "I'm fine, thank you.", "Goodbye!"]
                answer: "Yes, please. Can I have an apple, please?"
                option_audio: false
                feedback:
                  "I'm fine, thank you.": "„Can I help you?“ heißt: Kann ich dir helfen? Mrs Hill fragt nicht, wie es dir geht."
                  "Goodbye!": "Schon tschüss? Dann gehst du ohne Apfel nach Hause! Mrs Hill fragt, ob sie dir helfen kann."
                hints:
                  - "„Help“ heißt helfen."
                  - "Mrs Hill fragt: Kann ich dir helfen? Was möchtest du kaufen?"
                  - "Tippe auf „Yes, please. Can I have an apple, please?“"
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Was kauft das Kind?"
                say: { de: "Hör zu. Was kauft das Kind?" }
                audio: { turns: [{ en: "Can I have three oranges, please?", speaker: male }, { en: "Here you are.", speaker: female }] }
                options: [{ object: apple }, { object: orange }, { object: banana }]
                answer: orange
                hints:
                  - "Hör auf das Wort nach „Can I have three“."
                  - "Das Kind möchte drei Stück davon."
                  - "„Oranges“ sind Orangen."
              - id: l1-f3
                type: multiple_choice
                text: "Du gibst Mrs Hill das Geld. Was sagst du?"
                options: ["Here you are.", "How much is it?", "Can I help you?"]
                answer: "Here you are."
                option_audio: false
                feedback:
                  "Can I help you?": "Das fragt die Verkäuferin. Wenn du etwas gibst, sagst du „Here you are“."
                hints:
                  - "Was sagst du, wenn du jemandem etwas gibst?"
                  - "Das hat Mrs Hill auch gesagt, als sie Finn die Bananen gegeben hat."
                  - "Tippe auf „Here you are.“"
              - id: l1-f4
                type: speak
                text: "Jetzt bist du dran. Frag Mrs Hill nach einer Pizza."
                say: { de: "Jetzt bist du dran. Frag Mrs Hill nach einer Pizza.", en: "Can I have a pizza, please?" }
                show: { object: pizza }
                expected_text: "Can I have a pizza, please?"
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Fang mit „Can I have“ an und hör mit „please“ auf."
                  - "Sag mit mir: Can I have a pizza, please?"
              - id: l1-f5
                type: ordering
                text: "Bring das Gespräch im Laden in die richtige Reihenfolge."
                options: ["Here you are.", "Can I have a cake, please?", "Thank you. Goodbye!"]
                slot_count: 3
                answer: ["Can I have a cake, please?", "Here you are.", "Thank you. Goodbye!"]
                option_audio: false
                hints:
                  - "Was sagt Finn zuerst?"
                  - "Erst bittet er um etwas, dann bekommt er es."
                  - "Can I have a cake, please? Here you are. Thank you. Goodbye!"
              - id: l1-f6
                type: true_false
                text: "Fragt das Kind, was es kostet?"
                say: { de: "Hör zu. Fragt das Kind, was es kostet?" }
                audio: { en: "How much is it?", speaker: male }
                answer: true
                hints:
                  - "Hör noch einmal: How much is it?"
                  - "„How much“ heißt: wie viel."
                  - "Ja. „How much is it?“ heißt: Was kostet das?"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Mrs Hill gibt dir die Äpfel: „Here you are.“\nWas antwortest du?"
                say: { de: "Mrs Hill gibt dir die Äpfel. Was antwortest du?", en: "Here you are." }
                options: ["Thank you.", "Hello!", "Yes, I do."]
                answer: "Thank you."
                option_audio: false
                hints: ["Du bekommst etwas. Was sagst du dann?"]
              - id: l1-s2
                type: audio_choice
                text: "Was kostet die Milch?"
                say: { de: "Hör zu. Was kostet die Milch?" }
                audio: { turns: [{ en: "Can I have some milk, please?", speaker: female }, { en: "Here you are.", speaker: male }, { en: "How much is it?", speaker: female }, { en: "Two pounds, please.", speaker: male }] }
                options: ["1 Pfund", "2 Pfund", "3 Pfund"]
                answer: "2 Pfund"
                hints: ["Hör auf das Ende: … pounds, please."]
              - id: l1-s3
                type: speak
                text: "Frag Mrs Hill, was es kostet."
                say: { de: "Frag Mrs Hill, was es kostet.", en: "How much is it?" }
                expected_text: "How much is it?"
                hints: ["Vier kurze Wörter: How … much … is … it?"]
              - id: l1-s4
                type: multiple_choice
                text: "Du möchtest Saft. Was sagst du?"
                options: ["Can I have some juice, please?", "Can I have some juice, thank you?", "I have some juice, please."]
                answer: "Can I have some juice, please?"
                option_audio: false
                feedback:
                  "Can I have some juice, thank you?": "„Thank you“ sagst du, wenn du etwas bekommst. Wenn du um etwas bittest, sagst du „please“."
                hints: ["Du bittest um etwas. Welches Wort brauchst du?"]
              - id: l1-s5
                type: ordering
                text: "Bring das Gespräch im Laden in die richtige Reihenfolge."
                options: ["Here you are.", "Thank you. Goodbye!", "Hello! Can I help you?", "Yes, please. Can I have some bread, please?"]
                slot_count: 4
                answer: ["Hello! Can I help you?", "Yes, please. Can I have some bread, please?", "Here you are.", "Thank you. Goodbye!"]
                option_audio: false
                hints: ["Wer spricht zuerst, der Kunde oder Mrs Hill?"]
              - id: l1-s6
                type: true_false
                text: "Passt die Antwort?"
                say: { de: "Hör zu. Passt die Antwort?" }
                audio: { turns: [{ en: "How much is it?", speaker: female }, { en: "Yes, please.", speaker: male }] }
                answer: false
                hints: ["Auf „How much is it?“ hörst du einen Preis."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Im Eiscafé fragt die Bedienung: „Can I help you?“\nWas antwortest du?"
                say: { de: "Im Eiscafé fragt dich die Bedienung etwas. Was antwortest du?" }
                audio: { en: "Can I help you?", speaker: female }
                options: ["Can I have an ice cream, please?", "How old are you?", "Here you are."]
                answer: "Can I have an ice cream, please?"
                option_audio: false
              - id: l1-n2
                type: audio_choice
                text: "Was kauft das Kind?"
                say: { de: "Hör zu. Was kauft das Kind?" }
                audio: { turns: [{ en: "Hello! Can I have some cheese, please?", speaker: male }, { en: "Of course. Here you are.", speaker: female }] }
                options: [{ object: bread }, { object: milk }, { object: cheese }]
                answer: cheese
              - id: l1-n3
                type: speak
                text: "Mrs Hill gibt dir das Brot. Bedank dich und verabschiede dich."
                say: { de: "Mrs Hill gibt dir das Brot. Bedank dich und verabschiede dich." }
                expected_text: "Thank you. Goodbye!"
              - id: l1-n4
                type: ordering
                text: "Bring das Gespräch in die richtige Reihenfolge."
                options: ["One pound, please.", "Here you are. Thank you!", "How much is it?"]
                slot_count: 3
                answer: ["How much is it?", "One pound, please.", "Here you are. Thank you!"]
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Finn: Can I have a pizza, please?\nWas antwortet Mrs Hill?"
                options: ["Here you are.", "Yes, I do.", "My name is Anna."]
                answer: "Here you are."
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Du bekommst deine Bananen. Was sagst du?"
            options: ["Thank you.", "Can I help you?", "How much is it?"]
            answer: "Thank you."
            option_audio: false
          - id: l1-c2
            type: audio_choice
            text: "Was kauft das Kind?"
            say: { de: "Hör zu. Was kauft das Kind?" }
            audio: { turns: [{ en: "Can I have two apples, please?", speaker: female }, { en: "Here you are.", speaker: male }] }
            options: [{ object: apple }, { object: pineapple }, { object: strawberry }]
            answer: apple
          - id: l1-c3
            type: multiple_choice
            text: "Du willst wissen, was die Pizza kostet. Was fragst du?"
            options: ["How much is it?", "How old are you?", "Can I help you?"]
            answer: "How much is it?"
            option_audio: false
          - id: l1-c4
            type: audio_choice
            text: "Was kostet das Brot?"
            say: { de: "Hör zu. Was kostet das Brot?" }
            audio: { turns: [{ en: "How much is the bread?", speaker: male }, { en: "One pound, please.", speaker: female }] }
            options: ["2 Pfund", "1 Pfund", "10 Pfund"]
            answer: "1 Pfund"
          - id: l1-c5
            type: ordering
            text: "Bring das Gespräch in die richtige Reihenfolge."
            options: ["Here you are.", "Yes, please. Can I have a pizza, please?", "Can I help you?"]
            slot_count: 3
            answer: ["Can I help you?", "Yes, please. Can I have a pizza, please?", "Here you are."]
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Mrs Hill gibt dir die Milch. Du sagst: „Please.“ Passt das?"
            say: { de: "Mrs Hill gibt dir die Milch. Du sagst: Please. Passt das?" }
            answer: false

  - n: 2
    title: { de: "Auf dem Spielplatz", en: "In the playground" }
    goal:
      de: "Lern auf dem Spielplatz ein Kind kennen und frag zum Beispiel What's your name."
      en: "Meet a new child in the playground and ask things like What's your name."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Mrs Hill gibt dir dein Brot: „Here you are.“\nWas sagst du?"
            say: { de: "Weißt du noch? Mrs Hill gibt dir dein Brot. Was sagst du?", en: "Here you are." }
            options: ["Thank you.", "Please.", "Can I help you?"]
            answer: "Thank you."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Was kostet der Kuchen?"
            say: { de: "Weißt du noch? Hör zu. Was kostet der Kuchen?" }
            audio: { turns: [{ en: "How much is the cake?", speaker: female }, { en: "Four pounds, please.", speaker: male }] }
            options: ["4 Pfund", "14 Pfund", "2 Pfund"]
            answer: "4 Pfund"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Paula trifft Jack."
            say: { de: "Paula macht Urlaub in England. Auf dem Spielplatz trifft sie einen Jungen. Was glaubst du: Was sagt er zuerst zu ihr?" }
            show: { objects: [boy, girl] }
          - text: "Jack: Hi! I'm Jack. What's your name?\nPaula: Hello, Jack. I'm Paula."
            say: { de: "Hör zu. Er sagt „Hi!“ und seinen Namen: Jack. Dann fragt er nach ihrem Namen.", en: "Hi! I'm Jack. What's your name? Hello, Jack. I'm Paula." }
            show: { objects: [boy, girl] }
          - text: "Jack: Nice to meet you, Paula. How old are you?\nPaula: I'm nine. And you?\nJack: I'm nine, too!"
            say: { de: "„Nice to meet you“ heißt: Schön, dich kennenzulernen. Dann fragen sie sich, wie alt sie sind.", en: "Nice to meet you, Paula. How old are you? I'm nine. And you? I'm nine, too!" }
          - text: "Jack: Have you got a pet?\nPaula: Yes, I've got a cat. Have you got a pet?\nJack: No, I haven't."
            say: { de: "Jack fragt nach einem Haustier. Paula hat eine Katze, Jack hat keins.", en: "Have you got a pet? Yes, I've got a cat. Have you got a pet? No, I haven't." }
            show: { object: cat }
          - text: "Jack: Do you want to play?\nPaula: Yes, please!"
            say: { de: "Zum Schluss fragt Jack, ob Paula mitspielen will.", en: "Do you want to play? Yes, please!" }
            show: { object: ball }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Jack: Hi! I'm Jack. What's your name?\nWas antwortest du Jack?"
                say: { de: "Was antwortest du Jack?" }
                audio: { en: "Hi! I'm Jack. What's your name?", speaker: male }
                options: ["Hello, Jack. I'm Paula.", "I'm nine.", "Yes, I have."]
                answer: "Hello, Jack. I'm Paula."
                option_audio: false
                feedback:
                  "I'm nine.": "Jack fragt nach deinem Namen, nicht nach deinem Alter."
                hints:
                  - "„Name“ klingt fast wie Name."
                  - "Jack will wissen, wie du heißt."
                  - "Tippe auf „Hello, Jack. I'm Paula.“"
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Wie alt ist das Kind?"
                say: { de: "Hör zu. Wie alt ist das Kind?" }
                audio: { turns: [{ en: "How old are you?", speaker: female }, { en: "I'm ten.", speaker: male }] }
                options: ["12", "10", "2"]
                answer: "10"
                feedback:
                  "12": "Zwölf wäre „twelve“. Das Kind sagt „ten“, also zehn."
                hints:
                  - "Hör auf die Zahl am Ende."
                  - "Das Kind sagt: I'm ten."
                  - "„Ten“ heißt zehn."
              - id: l2-f3
                type: speak
                text: "Jack hat dir seinen Namen gesagt. Sag ihm: Schön, dich kennenzulernen."
                say: { de: "Jack hat dir seinen Namen gesagt. Sag ihm: Schön, dich kennenzulernen.", en: "Nice to meet you." }
                expected_text: "Nice to meet you."
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Vier Wörter: nice … to … meet … you."
                  - "Sag mit mir: Nice to meet you."
              - id: l2-f4
                type: multiple_choice
                text: "Du willst wissen, ob Jack ein Haustier hat. Was fragst du?"
                options: ["Have you got a pet?", "Can I have a pet, please?", "What colour is it?"]
                answer: "Have you got a pet?"
                option_audio: false
                feedback:
                  "Can I have a pet, please?": "So bittest du im Laden um etwas. Du willst aber wissen, ob Jack ein Haustier hat."
                hints:
                  - "„Pet“ heißt Haustier."
                  - "Frag mit „Have you got …?“: Hast du …?"
                  - "Tippe auf „Have you got a pet?“"
              - id: l2-f5
                type: ordering
                text: "Bring das Gespräch in die richtige Reihenfolge."
                options: ["I'm Paula.", "Nice to meet you, Paula.", "What's your name?"]
                slot_count: 3
                answer: ["What's your name?", "I'm Paula.", "Nice to meet you, Paula."]
                option_audio: false
                hints:
                  - "Am Anfang steht eine Frage."
                  - "Erst die Frage nach dem Namen, dann der Name."
                  - "What's your name? I'm Paula. Nice to meet you, Paula."
              - id: l2-f6
                type: true_false
                text: "Passt die Antwort?"
                say: { de: "Hör zu. Passt die Antwort?" }
                audio: { turns: [{ en: "Do you want to play?", speaker: male }, { en: "Yes, please!", speaker: female }] }
                answer: true
                hints:
                  - "„Play“ heißt spielen."
                  - "Jack fragt: Willst du mitspielen? Paula sagt: Ja, gern!"
                  - "Ja, das passt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Jack: How old are you?\nWas antwortest du Jack?"
                say: { de: "Was antwortest du Jack?", en: "How old are you?" }
                options: ["I'm fine, thank you.", "I'm nine.", "I'm Paula."]
                answer: "I'm nine."
                option_audio: false
                feedback:
                  "I'm fine, thank you.": "Das sagst du auf „How are you?“. Jack fragt „How old are you?“, also: Wie alt bist du?"
                hints: ["„Old“ heißt alt."]
              - id: l2-s2
                type: audio_choice
                text: "Welches Haustier hat das Kind?"
                say: { de: "Hör zu. Welches Haustier hat das Kind?" }
                audio: { turns: [{ en: "Have you got a pet?", speaker: male }, { en: "Yes, I've got a rabbit.", speaker: female }] }
                options: [{ object: cat }, { object: dog }, { object: rabbit }]
                answer: rabbit
                hints: ["Hör auf das Tier am Ende."]
              - id: l2-s3
                type: speak
                text: "Frag Jack, ob er mitspielen will."
                say: { de: "Frag Jack, ob er mitspielen will.", en: "Do you want to play?" }
                show: { object: ball }
                expected_text: "Do you want to play?"
                hints: ["Fang mit „Do you want“ an."]
              - id: l2-s4
                type: multiple_choice
                text: "Jack: Have you got a pet?\nDu hast kein Haustier. Was sagst du?"
                options: ["No, I haven't.", "No, I don't.", "Yes, I have."]
                answer: "No, I haven't."
                option_audio: false
                feedback:
                  "No, I don't.": "Auf „Have you got …?“ antwortest du mit „have“: No, I haven't."
                hints: ["Jack fragt mit „have“. Welche Antwort hat auch „have“?"]
              - id: l2-s5
                type: ordering
                text: "Bring das Gespräch in die richtige Reihenfolge."
                options: ["Do you want to play?", "Hi! I'm Jack.", "Yes, please!", "Hello, Jack. I'm Paula."]
                slot_count: 4
                answer: ["Hi! I'm Jack.", "Hello, Jack. I'm Paula.", "Do you want to play?", "Yes, please!"]
                option_audio: false
                hints: ["Erst begrüßen sich die beiden, dann geht es ums Spielen."]
              - id: l2-s6
                type: true_false
                text: "Passt die Antwort?"
                say: { de: "Hör zu. Passt die Antwort?" }
