# Lesson set: DaZ (German as a second language), DaZ Start. Hand-authored draft.
id: de-DE.daz.de-hello
skill: fl.themes.hello
curriculum: de-DE
track: daz
language: en # language of instructions
target_language: de # language being learnt
title:
  de: Hallo und Tschüss
  en: Hello and goodbye in German
summary: >
  The first German a child new to a German school needs: saying hello and
  goodbye, the greetings for the time of day, saying your name and asking
  someone else's, and bitte, danke and Entschuldigung. Lesson 1 brings
  Hallo, Guten Morgen, Guten Tag, Guten Abend, Gute Nacht, Tschüss and Auf
  Wiedersehen; lesson 2 adds Ich heiße ..., Wie heißt du?, the polite words,
  and ends with the skill check. Instructions are spoken in English; the
  German is heard. Oral only: the answers are pictures, so a child who does
  not read yet, or reads another script, can do every task. Speaking is
  practised, not marked.
metadata:
  year: daz-start
  topic: { de: Hallo, en: Hello }
  ages: [6-7, 8-10]
  lesson_minutes: 9
  builds_on: []
  also_practises: [fl.speaking.greet, fl.speaking.imitate]
  vocabulary: { de: [Hallo, Guten Morgen, Guten Tag, Guten Abend, Gute Nacht, Tschüss, Auf Wiedersehen, Ich heiße, "Wie heißt du?", bitte, danke, danke schön, Entschuldigung] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: greet, what: { de: jemanden auf Deutsch begrüßen, en: greeting someone in German } }
    - { id: goodbye, what: { de: sich auf Deutsch verabschieden, en: saying goodbye in German } }
    - { id: name, what: { de: "nach dem Namen fragen und den eigenen Namen sagen", en: asking someone's name and saying your own } }
    - { id: polite, what: { de: "bitte, danke und Entschuldigung verstehen", en: "understanding please, thank you and sorry" } }
  misconceptions:
    - id: hello-goodbye
      what: Takes Tschüss or Auf Wiedersehen for a greeting, or Hallo for a goodbye
      addressed: l1-f2 gives feedback when Tschüss is taken for a greeting; l1-f5, l1-s5, l1-n5 and l1-n6 set coming against going; the skill check asks both ways (l2-c3, l2-c4, l2-c7, l2-c10)
    - id: gute-nacht-greeting
      what: Says Gute Nacht to greet someone in the evening, as a match for Guten Morgen and Guten Abend
      addressed: lesson 1 Learn says Gute Nacht is for bedtime, when you go; l1-s4 gives feedback when it is taken for a greeting; l1-n2, l1-c4 and l2-c9 tie it to bed
    - id: please-thanks
      what: Mixes up bitte and danke, all the more because bitte is also the answer to danke
      addressed: lesson 2 Learn sets bitte against danke and shows bitte as the answer to danke; l2-f2 gives feedback when bitte is taken for thank you; l2-s4, l2-n1, l2-c18 and l2-c19 set the two apart
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-26

lessons:
  - n: 1
    title: { de: "Hallo und Tschüss", en: "Hallo and Tschüss" }
    goal:
      de: "Sag auf Deutsch hallo und tschüss und lerne, was man am Morgen, am Abend und vor dem Schlafen sagt."
      en: "Say hello and goodbye in German, and learn what to say in the morning, in the evening and at bedtime."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Listen. A girl says this at school. What do you think: is she arriving, or going home?", de: "Hallo!" }
            show: { objects: [school, house] }
          - say: { en: "She is arriving! Hallo means hello. In the morning, you can also say good morning:", de: "Hallo! Guten Morgen!" }
            show: { object: sun }
          - say: { en: "In the day, grown-ups often say good day:", de: "Guten Tag!" }
            show: { object: teacher }
          - say: { en: "When you go, you say bye:", de: "Tschüss!" }
            show: { object: wave }
          - say: { en: "A more polite goodbye, for a shop or the doctor, is:", de: "Auf Wiedersehen!" }
            show: { object: house }
          - say: { en: "In the evening, you say good evening:", de: "Guten Abend!" }
            show: { object: moon }
          - say: { en: "At bedtime, you say good night. You say it when you go to sleep, not when you meet someone.", de: "Gute Nacht!" }
            show: { object: bed }
          - text: "Did you know?"
            say: { en: "Did you know? In the north of Germany, many people just say Moin to say hello. They say it in the morning, and even in the evening!", de: "Moin!" }
            show: { object: wave }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Do you say this when you meet someone?"
                say: { en: "Listen. Do you say this when you meet someone?", de: "Hallo!" }
                answer: true
                hints:
                  - "Listen again: Hallo!"
                  - "Hallo sounds a lot like hello."
                  - "Yes. You say Hallo when you meet someone."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Do you say this when you meet someone?"
                say: { en: "Listen. Do you say this when you meet someone?", de: "Tschüss!" }
                answer: false
                feedback:
                  "true": "Tschüss is what you say when you go. When you meet someone, you say Hallo."
                hints:
                  - "Listen again: Tschüss!"
                  - "Tschüss is a short, quick word. Do you say it when you come, or when you go?"
                  - "No. You say Tschüss when you go."
              - id: l1-f3
                type: audio_choice
                text: "When do you say it? Tap the picture."
                say: { en: "Listen. When do you say it? Tap the picture." }
                audio: { de: "Guten Morgen!" }
                options: [{ object: sun }, { object: moon }]
                answer: sun
                hints:
                  - "Listen again: Guten Morgen!"
                  - "Morgen sounds like morning."
                  - "Tap the sun. You say Guten Morgen in the morning."
              - id: l1-f4
                type: speak
                say: { en: "You meet your friend at school. Say hello in German.", de: "Hallo!" }
                show: { object: boy }
                expected_text: "hallo"
                hints:
                  - "Listen again: Hallo!"
                  - "Ha-llo. Two beats, the first one strong."
                  - "Say it with me: Hallo!"
              - id: l1-f5
                type: audio_choice
                text: "Is the girl coming to school or going home? Tap the picture."
                say: { en: "Listen. Is the girl coming to school, or going home? Tap the picture." }
                audio: { de: "Tschüss!", speaker: female }
                options: [{ object: school }, { object: house }]
                answer: house
                feedback:
                  school: "Tschüss is for going. Coming to school, she would say Hallo."
                hints:
                  - "Listen again: Tschüss!"
                  - "Tschüss means bye. Is she coming, or going?"
                  - "Tap the house. She is going home."
              - id: l1-f6
                type: true_false
                text: "Do you say this when you go to bed?"
                say: { en: "Listen. Do you say this when you go to bed?", de: "Gute Nacht!" }
                show: { object: bed }
                answer: true
                hints:
                  - "Listen again: Gute Nacht!"
                  - "Nacht sounds like night."
                  - "Yes. Gute Nacht means good night."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Do you say this when you go?"
                say: { en: "Listen. Do you say this when you go?", de: "Auf Wiedersehen!" }
                answer: true
                hints: ["Auf Wiedersehen is the polite goodbye."]
              - id: l1-s2
                type: audio_choice
                text: "When do you say it? Tap the picture."
                say: { en: "Listen. When do you say it? Tap the picture." }
                audio: { de: "Guten Abend!" }
                options: [{ object: sun }, { object: moon }]
                answer: moon
                hints: ["Abend means evening."]
              - id: l1-s3
                type: speak
                say: { en: "You go home after school. Say bye to your friend in German.", de: "Tschüss!" }
                show: { object: wave }
                expected_text: "tschüss"
                hints: ["Start with a soft tsch, like a train: tsch-üss."]
              - id: l1-s4
                type: true_false
                text: "Do you say this when you meet someone?"
                say: { en: "Listen. Do you say this when you meet someone?", de: "Gute Nacht!" }
                answer: false
                feedback:
                  "true": "Gute Nacht is for bedtime, when you go to sleep. In the evening, you meet someone with Guten Abend."
                hints: ["Gute Nacht means good night. When do you say it?"]
              - id: l1-s5
                type: audio_choice
                text: "Is the boy coming to school or going home? Tap the picture."
                say: { en: "Listen. Is the boy coming to school, or going home? Tap the picture." }
                audio: { de: "Guten Morgen, Frau Weber!", speaker: male }
                options: [{ object: school }, { object: house }]
                answer: school
                hints: ["Guten Morgen is a hello for the morning."]
              - id: l1-s6
                type: true_false
                text: "Do you say this when you go?"
                say: { en: "Listen. Do you say this when you go?", de: "Guten Tag!" }
                answer: false
                hints: ["Guten Tag means good day. Is that hello or bye?"]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Do you say this when you meet someone?"
                say: { en: "Listen. Do you say this when you meet someone?", de: "Guten Tag!" }
                answer: true
              - id: l1-n2
                type: audio_choice
                text: "When do you say it? Tap the picture."
                say: { en: "Listen. When do you say it? Tap the picture." }
                audio: { de: "Gute Nacht!" }
                options: [{ object: school }, { object: bed }]
                answer: bed
              - id: l1-n3
                type: speak
                say: { en: "Say good morning to your teacher in German.", de: "Guten Morgen!" }
                show: { object: teacher }
                expected_text: "guten morgen"
              - id: l1-n4
                type: true_false
                text: "Do you say this when you go?"
                say: { en: "Listen. Do you say this when you go?", de: "Tschüss, Mama!" }
                answer: true
              - id: l1-n5
                type: audio_choice
                text: "Is the girl coming to school or going home? Tap the picture."
                say: { en: "Listen. Is the girl coming to school, or going home? Tap the picture." }
                audio: { de: "Auf Wiedersehen, Herr Kaya!", speaker: female }
                options: [{ object: school }, { object: house }]
                answer: house
              - id: l1-n6
                type: true_false
                text: "Do you say this when you meet someone?"
                say: { en: "Listen. Do you say this when you meet someone?", de: "Auf Wiedersehen!" }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Do you say this when you meet someone?"
            say: { en: "Listen. Do you say this when you meet someone?", de: "Hallo, Herr Kaya!" }
            answer: true
          - id: l1-c2
            type: audio_choice
            text: "When do you say it? Tap the picture."
            say: { en: "Listen. When do you say it? Tap the picture." }
            audio: { de: "Guten Abend, Oma!" }
            options: [{ object: moon }, { object: sun }]
            answer: moon
          - id: l1-c3
            type: true_false
            text: "Do you say this when you go?"
            say: { en: "Listen. Do you say this when you go?", de: "Hallo, Lena!" }
            answer: false
          - id: l1-c4
            type: audio_choice
            text: "Where is the girl going? Tap the picture."
            say: { en: "Listen. Where is the girl going? Tap the picture." }
            audio: { de: "Gute Nacht, Papa!", speaker: female }
            options: [{ object: bed }, { object: school }]
            answer: bed
          - id: l1-c5
            type: true_false
            text: "Do you say this in the morning?"
            say: { en: "Listen. Do you say this in the morning?", de: "Guten Morgen, Frau Weber!" }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "Is the boy coming to school or going home? Tap the picture."
            say: { en: "Listen. Is the boy coming to school, or going home? Tap the picture." }
            audio: { de: "Tschüss, Frau Weber!", speaker: male }
            options: [{ object: school }, { object: house }]
            answer: house

  - n: 2
    title: { de: "Ich heiße ...", en: "Ich heiße ..." }
    goal:
      de: "Sag deinen Namen mit ich heiße, frag nach dem Namen und benutze bitte, danke und Entschuldigung."
      en: "Say your name with ich heiße, ask someone's name, and use bitte, danke and Entschuldigung."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Do you say this when you meet someone?"
            say: { en: "Do you remember? Do you say this when you meet someone?", de: "Hallo, Ali!" }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "When do you say it? Tap the picture."
            say: { en: "Do you remember? When do you say it? Tap the picture." }
            audio: { de: "Gute Nacht!" }
            options: [{ object: sun }, { object: bed }]
            answer: bed
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { en: "Listen to this girl. What do you think she tells you: her name, or how old she is?", de: "Hallo! Ich heiße Lena." }
            show: { object: girl }
          - say: { en: "Her name! To say your name, you say ich heiße, then your name.", de: "Ich heiße Lena." }
            show: { object: girl }
          - say: { en: "To ask someone's name, you say:", de: "Wie heißt du?" }
            show: { object: boy }
          - say: { en: "Please is bitte. Thank you is danke, or danke schön.", de: "Einen Stift, bitte. Danke! Danke schön!" }
            show: { object: pencil }
          - say: { en: "When someone says danke to you, you can say bitte back. Then bitte means you're welcome.", de: "Danke! Bitte!" }
            show: { object: present }
          - say: { en: "Sorry is Entschuldigung. You say it when you bump into someone.", de: "Oh, Entschuldigung!" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Who is called Lena? Tap the picture."
                say: { en: "Listen. Two children say their names. Who is called Lena? Tap the picture." }
                audio: { turns: [{ de: "Ich heiße Ali.", speaker: male }, { de: "Ich heiße Lena.", speaker: female }] }
                options: [{ object: boy }, { object: girl }]
                answer: girl
                hints:
                  - "Listen for the name after ich heiße."
                  - "The boy speaks first, then the girl. Who says Lena?"
                  - "Tap the girl. She is called Lena."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Is someone saying thank you?"
                say: { en: "Listen. Is someone saying thank you?", de: "Bitte!" }
                answer: false
                feedback:
                  "true": "Bitte means please. Thank you is danke."
                hints:
                  - "Listen again: Bitte!"
                  - "Thank you is a short word: dan-ke. Is that what you hear?"
                  - "No. Bitte means please."
              - id: l2-f3
                type: true_false
                text: "Is someone saying thank you?"
                say: { en: "Listen. Is someone saying thank you?", de: "Danke schön!" }
                answer: true
                hints:
                  - "Listen to the first word."
                  - "Danke means thank you. Schön makes it a big thank you."
                  - "Yes. Danke schön means thank you very much."
              - id: l2-f4
                type: speak
                say: { en: "You get a present. Say thank you in German.", de: "Danke!" }
                show: { object: present }
                expected_text: "danke"
                hints:
                  - "Listen again: Danke!"
                  - "Dan-ke. Two beats, the first one strong."
                  - "Say it with me: Danke!"
              - id: l2-f5
                type: true_false
                text: "Is the boy asking your name?"
                say: { en: "Listen. Is the boy asking your name?" }
                audio: { de: "Hallo! Wie heißt du?", speaker: male }
                show: { object: boy }
                answer: true
                hints:
                  - "Listen again. Does his voice go up at the end, like a question?"
                  - "Wie heißt du? asks for a name."
                  - "Yes. He wants to know your name."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Is someone saying sorry?"
                say: { en: "Listen. Is someone saying sorry?", de: "Oh, Entschuldigung!" }
                answer: true
                hints: ["You say Entschuldigung when you bump into someone."]
              - id: l2-s2
                type: audio_choice
                text: "Who is called Ali? Tap the picture."
                say: { en: "Listen. Two children say their names. Who is called Ali? Tap the picture." }
                audio: { turns: [{ de: "Hallo, ich heiße Mia.", speaker: female }, { de: "Und ich heiße Ali.", speaker: male }] }
                options: [{ object: girl }, { object: boy }]
                answer: boy
                hints: ["The name comes after ich heiße."]
              - id: l2-s3
                type: speak
                say: { en: "Say your name in German. Start like this, then add your name.", de: "Ich heiße ..." }
                expected_text: "ich heiße"
                hints: ["Ich hei-ße: three beats, then your name."]
              - id: l2-s4
                type: true_false
                text: "Lena asks for a pencil. Does she say please?"
                say: { en: "Lena asks for a pencil. Listen. Does she say please?" }
                audio: { de: "Einen Stift, bitte.", speaker: female }
                show: { object: pencil }
                answer: true
                hints: ["Please is bitte. Can you hear it?"]
              - id: l2-s5
                type: true_false
                text: "Is someone saying thank you?"
                say: { en: "Listen. Is someone saying thank you?", de: "Entschuldigung!" }
                answer: false
                hints: ["Thank you is danke. Is that what you hear?"]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "Is someone saying please?"
                say: { en: "Listen. Is someone saying please?", de: "Danke!" }
                answer: false
              - id: l2-n2
                type: audio_choice
                text: "Who is called Jonas? Tap the picture."
                say: { en: "Listen. Two children say their names. Who is called Jonas? Tap the picture." }
                audio: { turns: [{ de: "Ich heiße Jonas.", speaker: male }, { de: "Ich heiße Emma.", speaker: female }] }
                options: [{ object: girl }, { object: boy }]
                answer: boy
              - id: l2-n3
                type: speak
                say: { en: "You bump into someone. Say sorry in German.", de: "Entschuldigung!" }
                expected_text: "entschuldigung"
              - id: l2-n4
                type: true_false
                text: "Is the girl telling you her name?"
                say: { en: "Listen. Is the girl telling you her name?" }
                audio: { de: "Hallo! Ich heiße Sara.", speaker: female }
                show: { object: girl }
                answer: true
              - id: l2-n5
                type: true_false
                text: "Is the girl asking your name?"
                say: { en: "Listen. Is the girl asking your name?" }
                audio: { de: "Danke, Ali!", speaker: female }
                show: { object: girl }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: greet
            type: true_false
            text: "Do you say this when you meet someone?"
            say: { en: "Listen. Do you say this when you meet someone?", de: "Hallo, Mia!" }
            answer: true
          - id: l2-c2
            part: greet
            type: audio_choice
            text: "When do you say it? Tap the picture."
            say: { en: "Listen. When do you say it? Tap the picture." }
            audio: { de: "Guten Morgen, Ali!" }
            options: [{ object: moon }, { object: sun }]
            answer: sun
          - id: l2-c3
            part: greet
            type: true_false
            text: "Ali comes to school in the morning. Is this right?"
            say: { en: "Ali comes to school in the morning. Listen. Is this right?" }
            audio: { de: "Gute Nacht, Frau Weber!", speaker: male }
            show: { object: school }
            answer: false
          - id: l2-c4
            part: greet
            type: audio_choice
            text: "Who is arriving? Tap the picture."
            say: { en: "Listen. Who is arriving? Tap the picture." }
            audio: { turns: [{ de: "Tschüss!", speaker: female }, { de: "Hallo!", speaker: male }] }
            options: [{ object: girl }, { object: boy }]
            answer: boy
          - id: l2-c5
            part: greet
            type: true_false
            text: "Do you say this when you meet someone?"
            say: { en: "Listen. Do you say this when you meet someone?", de: "Guten Tag, Herr Kaya!" }
            answer: true
          - id: l2-c6
            part: goodbye
            type: true_false
            text: "Do you say this when you go?"
            say: { en: "Listen. Do you say this when you go?", de: "Tschüss, Jonas!" }
            answer: true
          - id: l2-c7
            part: goodbye
            type: audio_choice
            text: "Is the girl coming to school or going home? Tap the picture."
            say: { en: "Listen. Is the girl coming to school, or going home? Tap the picture." }
            audio: { de: "Tschüss, Ali! Tschüss, Frau Weber!", speaker: female }
            options: [{ object: school }, { object: house }]
            answer: house
          - id: l2-c8
            part: goodbye
            type: true_false
            text: "School is over and Lena goes home. Is this right?"
            say: { en: "School is over and Lena goes home. Listen. Is this right?" }
            audio: { de: "Guten Morgen!", speaker: female }
            show: { object: house }
            answer: false
          - id: l2-c9
