# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-hobbies
skill: fl.themes.hobbies
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Hobbys und Sport
  en: Hobbies and sport
summary: >
  Lernjahr 2 opens with hobbies and sports: the words (football, swim,
  dance, paint, read, tennis, guitar, ride a bike, sing) and two chunks to
  talk about them, I can ... and I like ... . Lesson 1 learns the words by
  ear and picture; lesson 2 reads and builds short sentences about what
  someone can do and likes, and ends with the skill check. Speaking tasks
  are practice only.
metadata:
  year: lernjahr-2
  topic: { de: Hobbys und Sport, en: Hobbies and sport }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks, fl.listening.familiar-words]
  also_practises: [fl.grammar.chunks, fl.speaking.likes]
  vocabulary: { en: [football, swim, dance, paint, read, tennis, guitar, ride a bike, sing, I can, I like, I can't, I don't like] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: words, what: { de: Hobbys und Sportarten auf Englisch verstehen und benennen, en: understanding and naming hobbies and sports in English } }
    - { id: play, what: { de: "play vor Fußball, Tennis und Gitarre", en: "play before football, tennis and the guitar" } }
    - { id: can, what: { de: "sagen, was man kann und nicht kann", en: saying what you can and cannot do } }
    - { id: like, what: { de: "sagen, was man gern macht und nicht gern macht", en: saying what you like and do not like doing } }
  misconceptions:
    - id: play-everything
      what: Says play with every hobby (I play swim)
      addressed: lesson 1 Learn sorts play football, play tennis, play the guitar from swim, dance, read; lesson 2 builds the sentences
    - id: german-word-order
      what: Puts the not at the end as in German (I like tennis not, from Ich mag Tennis nicht)
      addressed: lesson 2 Learn puts don't and can't before the verb; a word-card task builds I don't like tennis
    - id: like-plus-verb
      what: Says I like swim instead of I like swimming
      addressed: lesson 2 Learn shows like with -ing
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was machst du gern?", en: "What do you like doing?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Ball." }
            options: [{ object: ball }, { object: book }, { object: bike }]
            answer: ball
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Ich habe einen Hund“?"
            say: "Wie sagst du auf Englisch: Ich habe einen Hund?"
            options: ["I have got a dog.", "I am a dog.", "I can a dog."]
            answer: "I have got a dog."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hobbys auf Englisch. Hör zu:", en: "Play football. Swim. Dance." }
            show: { object: play-football }
          - say: { de: "Noch mehr:", en: "Paint. Read. Sing. Ride a bike." }
            show: { object: paint }
          - say: { de: "Bei manchen Hobbys sagst du „play“ davor: „play football“, „play tennis“, „play the guitar“. Bei anderen nicht: „swim“, „dance“, „read“.", en: "Play tennis. Play the guitar." }
            show: { object: play-guitar }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Swim." }
                options: [{ object: swim }, { object: sing }, { object: dance }]
                answer: swim
                hints:
                  - "Hör noch einmal: swim."
                  - "„Swim“ klingt fast wie schwimmen."
                  - "Tippe auf das Kind im Wasser."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Play the guitar." }
                options: [{ object: play-tennis }, { object: play-guitar }, { object: play-football }]
                answer: play-guitar
                feedback:
                  play-tennis: "Hör auf das letzte Wort: „guitar“, nicht „tennis“."
                hints:
                  - "Alle drei fangen mit „play“ an. Hör auf das Ende."
                  - "„Guitar“ klingt fast wie Gitarre."
                  - "Tippe auf die Gitarre."
              - id: l1-f3
                type: true_false
                text: "Passt das Bild?"
                say: { de: "Hör zu. Passt das Bild?", en: "Dance." }
                show: { object: dance }
                answer: true
                hints:
                  - "Hör noch einmal: dance."
                  - "„Dance“ heißt tanzen."
                  - "Ja, das Kind tanzt."
              - id: l1-f4
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Ride a bike." }
                options: [{ object: ride-bike }, { object: read }, { object: swim }]
                answer: ride-bike
                hints:
                  - "Hör auf das letzte Wort."
                  - "„Bike“ ist das Fahrrad."
                  - "Tippe auf das Kind auf dem Fahrrad."
              - id: l1-f5
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Paint." }
                show: { object: paint }
                expected_text: "paint"
                hints:
                  - "Hör noch einmal: paint."
                  - "Es klingt wie peint."
                  - "Sag mit mir: paint."
              - id: l1-f6
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Read." }
                options: [{ object: read }, { object: paint }, { object: sing }]
                answer: read
                hints:
                  - "Hör noch einmal: read."
                  - "„Read“ heißt lesen."
                  - "Tippe auf das Kind mit dem Buch."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Sing." }
                options: [{ object: swim }, { object: sing }, { object: dance }]
                answer: sing
                hints: ["„Sing“ heißt singen."]
              - id: l1-s2
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Play tennis." }
                options: [{ object: play-football }, { object: play-tennis }, { object: play-guitar }]
                answer: play-tennis
                hints: ["Hör auf das Ende."]
              - id: l1-s3
                type: true_false
                text: "Passt das Bild?"
                say: { de: "Hör zu. Passt das Bild?", en: "Swim." }
                show: { object: ride-bike }
                answer: false
                hints: ["„Swim“ heißt schwimmen."]
              - id: l1-s4
                type: sorting
                text: "Mit „play“ oder ohne?"
                say: { de: "Kommt „play“ davor oder nicht? Sortiere die Bilder." }
                bins:
                  - { id: play, show: { text: "play ..." }, say: { en: "Play." } }
                  - { id: no-play, show: { text: "ohne „play“" }, say: { de: "Ohne „play“." } }
                options:
                  - { object: play-football, bin: play }
                  - { object: swim, bin: no-play }
                  - { object: play-guitar, bin: play }
                  - { object: dance, bin: no-play }
                hints: ["Bei Ballspielen und Instrumenten sagst du „play“."]
              - id: l1-s5
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Play football." }
                show: { object: play-football }
                expected_text: "play football"
                hints: ["Sag mit mir: play football."]
              - id: l1-s6
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Paint." }
                options: [{ object: read }, { object: paint }, { object: play-guitar }]
                answer: paint
                hints: ["„Paint“ heißt malen."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Dance." }
                options: [{ object: dance }, { object: sing }, { object: swim }]
                answer: dance
              - id: l1-n2
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Play football." }
                options: [{ object: play-tennis }, { object: play-football }, { object: ride-bike }]
                answer: play-football
              - id: l1-n3
                type: true_false
                text: "Passt das Bild?"
                say: { de: "Hör zu. Passt das Bild?", en: "Read." }
                show: { object: read }
                answer: true
              - id: l1-n4
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Ride a bike." }
                options: [{ object: swim }, { object: ride-bike }, { object: play-tennis }]
                answer: ride-bike
              - id: l1-n5
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Swim." }
                show: { object: swim }
                expected_text: "swim"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Sing." }
            options: [{ object: sing }, { object: read }, { object: dance }]
            answer: sing
          - id: l1-c2
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Play the guitar." }
            options: [{ object: play-guitar }, { object: play-football }, { object: paint }]
            answer: play-guitar
          - id: l1-c3
            type: true_false
            text: "Passt das Bild?"
            say: { de: "Hör zu. Passt das Bild?", en: "Play tennis." }
            show: { object: play-football }
            answer: false
          - id: l1-c4
            type: multiple_choice
            option_audio: false
            text: "Wie heißt das auf Englisch?"
            say: "Wie heißt das auf Englisch?"
            show: { object: play-tennis }
            options: ["play tennis", "play football", "tennis play"]
            answer: "play tennis"
          - id: l1-c5
            type: true_false
            text: "Passt das Bild?"
            say: { de: "Hör zu. Passt das Bild?", en: "Ride a bike." }
            show: { object: ride-bike }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "Was heißt das auf Deutsch?"
            say: { de: "Hör zu. Was heißt das auf Deutsch?" }
            audio: { en: "Dance." }
            options: ["tanzen", "malen", "lesen"]
            answer: "tanzen"

  - n: 2
    title: { de: "I can ... und I like ...", en: "I can ... and I like ..." }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Swim." }
            options: [{ object: swim }, { object: dance }, { object: read }]
            answer: swim
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Play football." }
            options: [{ object: play-football }, { object: play-tennis }, { object: sing }]
            answer: play-football
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "I can swim."
            say: { de: "Mit „I can“ sagst du, was du kannst. „I can swim“ heißt: Ich kann schwimmen.", en: "I can swim." }
            show: { object: swim }
          - text: "I like football. I like swimming."
            say: { de: "Mit „I like“ sagst du, was du magst. Wenn du etwas gern tust, hängst du -ing an das Verb: „I like swimming“, nicht „I like swim“.", en: "I like football. I like swimming." }
            show: { object: swim }
          - text: "I can't sing. I don't like tennis."
            say: { de: "So sagst du, was du nicht kannst oder nicht magst. Anders als im Deutschen steht das „nicht“ vor dem Verb: „I can't sing“, „I don't like tennis“.", en: "I can't sing. I don't like tennis." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                option_audio: false
                text: "I can ride a bike.\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: ride-bike }, { object: swim }, { object: read }]
                answer: ride-bike
                hints:
                  - "Lies das Ende: „ride a bike“."
                  - "„Bike“ ist das Fahrrad."
                  - "Tippe auf das Kind auf dem Fahrrad."
                difficulty: easy
              - id: l2-f2
                type: ordering
                option_audio: false
                text: "Bau den Satz: Ich mag Fußball."
                say: { de: "Bau den Satz: Ich mag Fußball." }
                options: ["football", "I", "like"]
                slot_count: 3
                answer: ["I", "like", "football"]
                hints:
                  - "Der Satz fängt mit „I“ an."
                  - "Danach kommt „like“."
                  - "I like football."
              - id: l2-f3
                type: audio_choice
                text: "Was kann Tom?"
                say: { de: "Hör zu. Was kann Tom?" }
                audio: { en: "Hi, I'm Tom. I can swim, but I can't dance.", speaker: male }
                options: [{ object: swim }, { object: dance }, { object: sing }]
                answer: swim
                hints:
                  - "Hör auf „I can“."
                  - "I can swim. I can't dance."
                  - "Tom kann schwimmen."
              - id: l2-f4
                type: fill_in_blank
                option_audio: false
                text: "Das Kind kann Gitarre spielen. Ergänze den Satz."
                say: { de: "Das Kind kann Gitarre spielen. Ergänze den Satz." }
                show: { object: play-guitar }
                frame: "I _ play the guitar."
                options: ["can", "like", "am"]
                answer: ["can"]
                hints:
                  - "Es geht darum, was das Kind kann."
                  - "„Ich kann“ heißt „I can“."
                  - "I can play the guitar."
              - id: l2-f5
                type: true_false
                text: "I don't like tennis.\nMag das Kind Tennis?"
                say: { de: "Lies den Satz. Mag das Kind Tennis?" }
                answer: false
                hints:
                  - "„Don't“ heißt hier: nicht."
                  - "„I don't like tennis“ heißt: Ich mag Tennis nicht."
                  - "Nein, das Kind mag kein Tennis."
              - id: l2-f6
                type: audio_choice
                text: "Was mag Lily?"
                say: { de: "Hör zu. Was mag Lily?" }
                audio: { en: "I'm Lily. I don't like football. I like painting.", speaker: female }
                options: [{ object: play-football }, { object: paint }, { object: read }]
                answer: paint
                feedback:
                  play-football: "„Football“ hörst du zuerst, aber Lily sagt: „I don't like football.“"
                hints:
                  - "Hör bis zum Ende."
                  - "I like painting."
                  - "Lily malt gern."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                option_audio: false
                text: "I like dancing.\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: sing }, { object: dance }, { object: swim }]
                answer: dance
                hints: ["„Dancing“ kommt von „dance“."]
              - id: l2-s2
                type: ordering
                option_audio: false
                text: "Bau den Satz: Ich kann singen."
                say: { de: "Bau den Satz: Ich kann singen." }
                options: ["sing", "can", "I"]
                slot_count: 3
                answer: ["I", "can", "sing"]
                hints: ["„I“ kommt zuerst."]
              - id: l2-s3
                type: audio_choice
                text: "Was kann Ben nicht?"
                say: { de: "Hör zu. Was kann Ben nicht?" }
                audio: { en: "I'm Ben. I can play tennis. I can't swim.", speaker: male }
                options: [{ object: play-tennis }, { object: swim }, { object: ride-bike }]
                answer: swim
                hints: ["Hör auf „can't“."]
              - id: l2-s4
                type: fill_in_blank
                option_audio: false
                text: "Das Kind liest gern. Ergänze den Satz."
                say: { de: "Das Kind liest gern. Ergänze den Satz." }
                show: { object: read }
                frame: "I _ reading."
                options: ["like", "can", "don't"]
                answer: ["like"]
                hints: ["„Ich mag“ heißt „I like“."]
              - id: l2-s5
                type: true_false
                text: "I can ride a bike.\nKann das Kind Rad fahren?"
                say: { de: "Lies den Satz. Kann das Kind Rad fahren?" }
                answer: true
                hints: ["„I can“ heißt: Ich kann."]
              - id: l2-s6
                type: speak
                text: "Sag auf Englisch, dass du schwimmen kannst."
                say: { de: "Sag auf Englisch, dass du schwimmen kannst.", en: "I can swim." }
                show: { object: swim }
                expected_text: "I can swim"
                hints: ["Sag mit mir: I can swim."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                option_audio: false
                text: "I can play the guitar.\nWelches Bild passt?"
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: play-guitar }, { object: sing }, { object: play-tennis }]
                answer: play-guitar
              - id: l2-n2
                type: ordering
                option_audio: false
                text: "Bau den Satz: Ich mag Tennis nicht."
                say: { de: "Bau den Satz: Ich mag Tennis nicht." }
                options: ["tennis", "don't", "I", "like"]
                slot_count: 4
                answer: ["I", "don't", "like", "tennis"]
              - id: l2-n3
                type: audio_choice
                text: "Was mag Mia?"
                say: { de: "Hör zu. Was mag Mia?" }
                audio: { en: "Hello, I'm Mia. I like reading and I like singing.", speaker: female }
                options: ["Lesen und Singen", "Lesen und Tanzen", "Schwimmen und Singen"]
                answer: "Lesen und Singen"
              - id: l2-n4
                type: fill_in_blank
                option_audio: false
                text: "Das Kind kann nicht tanzen. Ergänze den Satz."
                say: { de: "Das Kind kann nicht tanzen. Ergänze den Satz." }
                show: { object: dance }
                frame: "I _ dance."
                options: ["can't", "can", "like"]
                answer: ["can't"]
              - id: l2-n5
                type: true_false
                text: "I like football.\nMag das Kind Fußball?"
                say: { de: "Lies den Satz. Mag das Kind Fußball?" }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: like
            type: audio_choice
            text: "Was macht das Kind gern?"
            say: { de: "Hör zu. Was macht das Kind gern?" }
            audio: { en: "I like dancing.", speaker: female }
            options: [{ object: sing }, { object: dance }, { object: paint }]
            answer: dance
          - id: l2-c2
            part: like
            type: image_multiple_choice
            option_audio: false
            text: "I don't like swimming. I like reading.\nWas macht das Kind gern?"
            say: { de: "Lies die Sätze. Was macht das Kind gern?" }
            options: [{ object: swim }, { object: read }, { object: paint }]
            answer: read
          - id: l2-c3
            part: can
            type: ordering
            option_audio: false
            text: "Bau den Satz: Ich kann nicht Rad fahren."
            say: { de: "Bau den Satz: Ich kann nicht Rad fahren." }
            options: ["a bike", "ride", "can't", "I"]
            slot_count: 4
            answer: ["I", "can't", "ride", "a bike"]
          - id: l2-c4
            part: can
            type: audio_choice
            text: "Was kann Sam?"
            say: { de: "Hör zu. Was kann Sam?" }
            audio: { en: "I'm Sam. I can't sing, but I can play football.", speaker: male }
            options: [{ object: sing }, { object: play-football }, { object: play-guitar }]
            answer: play-football
          - id: l2-c5
            part: like
            type: fill_in_blank
            option_audio: false
            text: "Das Kind malt nicht gern. Ergänze den Satz."
            say: { de: "Das Kind malt nicht gern. Ergänze den Satz." }
            show: { object: paint }
            frame: "I _ like painting."
            options: ["can't", "don't", "am"]
            answer: ["don't"]
          - id: l2-c6
            part: words
            type: multiple_choice
            option_audio: false
            text: "Wie heißt das auf Englisch?"
            say: "Wie heißt das auf Englisch?"
            show: { object: read }
            options: ["read", "ride", "sing"]
            answer: "read"
          - id: l2-c7
            part: words
            type: audio_choice
            text: "Was heißt das auf Deutsch?"
            say: { de: "Hör zu. Was heißt das auf Deutsch?" }
            audio: { en: "Sing." }
            options: ["singen", "schwimmen", "tanzen"]
            answer: "singen"
          - id: l2-c8
            part: words
            type: matching
            option_audio: false
            text: "Lies die Wörter. Was passt zusammen?"
            say: { de: "Lies die Wörter und verbinde jedes Wort mit seinem Bild." }
            pairs:
              - { left: { text: "swim" }, right: { object: swim } }
              - { left: { text: "paint" }, right: { object: paint } }
              - { left: { text: "dance" }, right: { object: dance } }
          - id: l2-c9
            part: words
            type: image_multiple_choice
            option_audio: false
            text: "ride a bike\nWelches Bild passt?"
            say: { de: "Lies die Wörter. Welches Bild passt?" }
            options: [{ object: play-tennis }, { object: swim }, { object: ride-bike }]
            answer: ride-bike
          - id: l2-c10
            part: words
            type: multiple_choice
            option_audio: false
            text: "Welches Wort ist eine Sportart?"
            say: "Welches Wort ist eine Sportart?"
            options: ["tennis", "paint", "read"]
            answer: "tennis"
          - id: l2-c11
            part: play
            type: multiple_choice
            option_audio: false
            text: "Bei welchem Hobby sagst du „play“ davor?"
            say: "Bei welchem Hobby sagst du play davor?"
            options: ["the guitar", "swim", "read"]
            answer: "the guitar"
          - id: l2-c12
            part: play
            type: fill_in_blank
            option_audio: false
            text: "Das Kind spielt gern Tennis. Ergänze den Satz."
            say: { de: "Das Kind spielt gern Tennis. Ergänze den Satz." }
            show: { object: play-tennis }
            frame: "I like _ tennis."
            options: ["playing", "play", "swimming"]
            answer: ["playing"]
