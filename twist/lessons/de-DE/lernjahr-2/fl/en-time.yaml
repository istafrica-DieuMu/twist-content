              - id: l2-n5
                type: true_false
                text: "Passt die Uhr?"
                say: { de: "Hör zu. Passt die Uhr?", en: "It's half past nine." }
                show: { drawn: clock, hour: 9, minute: 0 }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: oclock
            type: audio_choice
            text: "Welche Uhr passt?"
            say: { de: "Hör zu. Welche Uhr passt?" }
            audio: { en: "It's four o'clock." }
            options:
              - { drawn: clock, hour: 4, minute: 30 }
