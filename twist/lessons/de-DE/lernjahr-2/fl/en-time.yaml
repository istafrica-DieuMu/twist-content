# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-time
skill: fl.themes.time
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Die Uhrzeit auf Englisch
  en: Telling the time in English
summary: >
  Asking for the time and saying full and half hours. Lesson 1 brings
  "What time is it? It's three o'clock."; lesson 2 adds half past (half
  past four is halb fünf in German: English names the hour that has
  passed, German the hour that is coming), and ends with the
  skill check. Instructions are in German; the English is spoken and
  shown in short form.
metadata:
  year: lernjahr-2
  topic: { de: Uhrzeit, en: Time }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.numbers-to-20]
  also_practises: [fl.themes.numbers-to-20]
  vocabulary: { en: ["What time is it?", "It's … o'clock.", half past] }
  forms: [audio, text, drawn]
  drawn: [clock]
  facets: [time-format]
  parts:
    - { id: ask, what: { de: "nach der Uhrzeit fragen und antworten: What time is it? It's …", en: "asking and answering: What time is it? It's …" } }
    - { id: oclock, what: { de: volle Stunden verstehen und angeben, en: understanding and giving o'clock times } }
    - { id: half, what: { de: "halbe Stunden verstehen und angeben: half past", en: "understanding and giving half past" } }
  misconceptions:
    - id: half-past-halb
      what: Reads "half past four" as halb vier, or says half past three for halb vier
      addressed: lesson 2 Learn sets half past four against halb fünf; every stage of lesson 2 has a half-past clock task with the clock an hour too early among the options (l2-f1, l2-s1, l2-n1) and a "halb …" task offering the hour that is coming (l2-f3, l2-s3, l2-n3), with feedback in l2-f1 and l2-f3
    - id: oclock-hours
      what: Says "It's three hours." from the German drei Uhr instead of "It's three o'clock."
      addressed: lesson 1 Learn models o'clock; a "Wie sagst du" task in every stage of lesson 1 offers "hours", with feedback in l1-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "It's three o'clock.", en: "It's three o'clock." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Welche Zahl ist das?"
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Eleven." }
            options: ["11", "7", "12"]
            answer: "11"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welche Zahl ist das?"
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Eight." }
            options: ["3", "8", "18"]
            answer: "8"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "What time is it?"
            say: { de: "So fragst du nach der Uhrzeit:", en: "What time is it?" }
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "It's three o'clock."
            say: { de: "Zeigt der große Zeiger nach oben, ist es eine volle Stunde. Der kleine Zeiger zeigt auf die Stunde. Dann sagst du die Zahl und „o'clock“:", en: "It's three o'clock." }
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "It's twelve o'clock."
            say: { de: "Um zwölf Uhr zeigen beide Zeiger nach oben.", en: "It's twelve o'clock." }
            show: { drawn: clock, hour: 12, minute: 0 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tippe auf die passende Uhr."
                say: { de: "Hör zu. Tippe auf die passende Uhr." }
                audio: { en: "It's seven o'clock." }
                options:
                  - { drawn: clock, hour: 7, minute: 0 }
                  - { drawn: clock, hour: 11, minute: 0 }
                  - { drawn: clock, hour: 5, minute: 0 }
                answer: "7:00"
                hints:
                  - "Hör auf die Zahl."
                  - "„Seven“ ist sieben."
                  - "Tippe auf die Uhr, deren kleiner Zeiger auf die 7 zeigt."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "What time is it?"
                say: { de: "Wie spät ist es? Tippe auf den passenden Satz.", en: "What time is it?" }
                show: { drawn: clock, hour: 9, minute: 0 }
                options: ["It's nine o'clock.", "It's six o'clock.", "It's ten o'clock."]
                answer: "It's nine o'clock."
                option_audio: false
                hints:
                  - "Wohin zeigt der kleine Zeiger?"
                  - "Der kleine Zeiger zeigt auf die 9. Neun heißt „nine“."
                  - "Tippe auf „It's nine o'clock.“"
              - id: l1-f3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Es ist zwei Uhr“?"
                say: "Wie sagst du auf Englisch: Es ist zwei Uhr?"
                options: ["It's two o'clock.", "It's two hours.", "It's o'clock two."]
                answer: "It's two o'clock."
                option_audio: false
                feedback:
                  "It's two hours.": "„Hours“ heißt Stunden. Die Uhrzeit sagst du mit „o'clock“: It's two o'clock."
                hints:
                  - "Was kommt nach der Zahl?"
                  - "Zuerst die Zahl, dann „o'clock“."
                  - "Tippe auf „It's two o'clock.“"
              - id: l1-f4
                type: speak
                text: "Wie spät ist es? Sag es auf Englisch."
                say: { de: "Wie spät ist es? Sag es auf Englisch.", en: "It's four o'clock." }
                show: { drawn: clock, hour: 4, minute: 0 }
                expected_text: "It's four o'clock."
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „It's“, dann „four“, dann „o'clock“."
                  - "Sag mit mir: It's four o'clock."
              - id: l1-f5
                type: true_false
                text: "Passt die Uhr?"
                say: { de: "Hör zu. Passt die Uhr?", en: "It's eleven o'clock." }
                show: { drawn: clock, hour: 11, minute: 0 }
                answer: true
                hints:
                  - "Wohin zeigt der kleine Zeiger?"
                  - "„Eleven“ ist elf. Zeigt der kleine Zeiger auf die 11?"
                  - "Ja, das passt. Tippe auf Ja."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tippe auf die passende Uhr."
                say: { de: "Hör zu. Tippe auf die passende Uhr." }
                audio: { en: "It's ten o'clock." }
                options:
                  - { drawn: clock, hour: 2, minute: 0 }
                  - { drawn: clock, hour: 10, minute: 0 }
                  - { drawn: clock, hour: 12, minute: 0 }
                answer: "10:00"
                hints: ["Auf welche Zahl zeigt der kleine Zeiger?"]
              - id: l1-s2
                type: multiple_choice
                text: "What time is it?"
                say: { de: "Wie spät ist es? Tippe auf den passenden Satz.", en: "What time is it?" }
                show: { drawn: clock, hour: 6, minute: 0 }
                options: ["It's twelve o'clock.", "It's six o'clock.", "It's nine o'clock."]
                answer: "It's six o'clock."
                option_audio: false
                hints: ["Der große Zeiger zeigt auf die 12. Und der kleine?"]
              - id: l1-s3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Es ist acht Uhr“?"
                say: "Wie sagst du auf Englisch: Es ist acht Uhr?"
                options: ["It's eight hours.", "It's eight o'clock.", "It's eighteen o'clock."]
                answer: "It's eight o'clock."
                option_audio: false
                hints: ["Was sagst du bei einer vollen Stunde nach der Zahl?"]
              - id: l1-s4
                type: speak
                text: "Wie spät ist es? Sag es auf Englisch."
                say: { de: "Wie spät ist es? Sag es auf Englisch.", en: "It's one o'clock." }
                show: { drawn: clock, hour: 1, minute: 0 }
                expected_text: "It's one o'clock."
                hints: ["Zuerst „It's“."]
              - id: l1-s5
                type: true_false
                text: "Passt die Uhr?"
                say: { de: "Hör zu. Passt die Uhr?", en: "It's five o'clock." }
                show: { drawn: clock, hour: 3, minute: 0 }
                answer: false
                hints: ["Wohin zeigt der kleine Zeiger?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tippe auf die passende Uhr."
                say: { de: "Hör zu. Tippe auf die passende Uhr." }
                audio: { en: "It's two o'clock." }
                options:
                  - { drawn: clock, hour: 12, minute: 0 }
                  - { drawn: clock, hour: 8, minute: 0 }
                  - { drawn: clock, hour: 2, minute: 0 }
                answer: "2:00"
              - id: l1-n2
                type: multiple_choice
                text: "What time is it?"
                say: { de: "Wie spät ist es? Tippe auf den passenden Satz.", en: "What time is it?" }
                show: { drawn: clock, hour: 5, minute: 0 }
                options: ["It's five o'clock.", "It's one o'clock.", "It's four o'clock."]
                answer: "It's five o'clock."
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Es ist sechs Uhr“?"
                say: "Wie sagst du auf Englisch: Es ist sechs Uhr?"
                options: ["It's o'clock six.", "It's six hours.", "It's six o'clock."]
                answer: "It's six o'clock."
                option_audio: false
              - id: l1-n4
                type: speak
                text: "Wie spät ist es? Sag es auf Englisch."
                say: { de: "Wie spät ist es? Sag es auf Englisch." }
                show: { drawn: clock, hour: 8, minute: 0 }
                expected_text: "It's eight o'clock."
              - id: l1-n5
                type: true_false
                text: "Passt die Uhr?"
                say: { de: "Hör zu. Passt die Uhr?", en: "It's twelve o'clock." }
                show: { drawn: clock, hour: 12, minute: 0 }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Welche Uhr passt?"
            say: { de: "Hör zu. Welche Uhr passt?" }
            audio: { en: "It's nine o'clock." }
            options:
              - { drawn: clock, hour: 9, minute: 0 }
              - { drawn: clock, hour: 3, minute: 0 }
              - { drawn: clock, hour: 6, minute: 0 }
            answer: "9:00"
          - id: l1-c2
            type: multiple_choice
            text: "What time is it?"
            say: { de: "Wie spät ist es? Tippe auf den passenden Satz.", en: "What time is it?" }
            show: { drawn: clock, hour: 10, minute: 0 }
            options: ["It's two o'clock.", "It's ten o'clock.", "It's twelve o'clock."]
            answer: "It's ten o'clock."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Passt die Uhr?"
            say: { de: "Hör zu. Passt die Uhr?", en: "It's seven o'clock." }
            show: { drawn: clock, hour: 1, minute: 0 }
            answer: false
          - id: l1-c4
            type: image_multiple_choice
            option_audio: false
            text: "It's eight o'clock.\nWelche Uhr passt?"
            say: { de: "Lies den Satz. Welche Uhr passt?" }
            options:
              - { drawn: clock, hour: 4, minute: 0 }
              - { drawn: clock, hour: 8, minute: 0 }
              - { drawn: clock, hour: 10, minute: 0 }
            answer: "8:00"
          - id: l1-c5
            type: fill_in_blank
            option_audio: false
            text: "Wie spät ist es? Ergänze den Satz."
            say: { de: "Wie spät ist es? Ergänze den Satz." }
            show: { drawn: clock, hour: 6, minute: 0 }
            frame: "It's _ o'clock."
            options: ["seven", "six", "nine"]
            answer: ["six"]
          - id: l1-c6
            type: audio_choice
            text: "Wie spät ist es?"
            say: { de: "Hör zu. Wie spät ist es?" }
            audio: { turns: [{ en: "What time is it?", speaker: male }, { en: "It's twelve o'clock.", speaker: female }] }
            options: ["2 Uhr", "12 Uhr", "halb eins"]
            answer: "12 Uhr"

  - n: 2
    title: { de: "Half past four", en: "Half past four" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Tippe auf die passende Uhr."
            say: { de: "Hör zu. Tippe auf die passende Uhr." }
            audio: { en: "It's eleven o'clock." }
            options:
              - { drawn: clock, hour: 7, minute: 0 }
              - { drawn: clock, hour: 11, minute: 0 }
              - { drawn: clock, hour: 1, minute: 0 }
            answer: "11:00"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Es ist drei Uhr“?"
            say: "Wie sagst du auf Englisch: Es ist drei Uhr?"
            options: ["It's three o'clock.", "It's three hours.", "It's thirteen o'clock."]
            answer: "It's three o'clock."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "It's half past four."
            say: { de: "Zeigt der große Zeiger nach unten, ist es halb. Auf Englisch sagst du „half past“ und die Stunde, die vorbei ist:", en: "It's half past four." }
            show: { drawn: clock, hour: 4, minute: 30 }
          - text: "half past four = halb fünf"
            say: { de: "Pass auf: Im Deutschen sagst du halb fünf. Im Englischen nennst du die Stunde, die schon vorbei ist, also die Vier:", en: "Half past four." }
            show: { drawn: clock, hour: 4, minute: 30, digital: true }
          - text: "It's half past seven."
            say: { en: "What time is it? It's half past seven." }
            show: { drawn: clock, hour: 7, minute: 30 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Tippe auf die passende Uhr."
                say: { de: "Hör zu. Tippe auf die passende Uhr." }
                audio: { en: "It's half past two." }
                options:
                  - { drawn: clock, hour: 2, minute: 30 }
                  - { drawn: clock, hour: 1, minute: 30 }
                  - { drawn: clock, hour: 2, minute: 0 }
                answer: "2:30"
                feedback:
                  "1:30": "Das ist halb zwei, auf Englisch „half past one“. „Half past two“ ist halb drei."
                hints:
                  - "Bei „half past“ zeigt der große Zeiger nach unten."
                  - "„Two“ ist die Stunde, die schon vorbei ist. Der kleine Zeiger steht also zwischen 2 und 3."
                  - "Tippe auf die Uhr, bei der der kleine Zeiger zwischen 2 und 3 steht."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "What time is it?"
                say: { de: "Wie spät ist es? Tippe auf den passenden Satz.", en: "What time is it?" }
                show: { drawn: clock, hour: 9, minute: 30 }
                options: ["It's half past nine.", "It's half past ten.", "It's nine o'clock."]
                answer: "It's half past nine."
                option_audio: false
                hints:
                  - "Der große Zeiger zeigt nach unten."
                  - "Der kleine Zeiger steht zwischen 9 und 10. Die 9 ist schon vorbei."
                  - "Tippe auf „It's half past nine.“"
              - id: l2-f3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Es ist halb sechs“?"
                say: "Wie sagst du auf Englisch: Es ist halb sechs?"
                options: ["It's half past six.", "It's half past five.", "It's six o'clock."]
                answer: "It's half past five."
                option_audio: false
                feedback:
                  "It's half past six.": "Halb sechs ist eine halbe Stunde nach fünf Uhr. Im Englischen nennst du die Fünf: It's half past five."
                hints:
                  - "Halb sechs ist eine halbe Stunde nach fünf Uhr."
                  - "Im Englischen nennst du die Stunde, die schon vorbei ist."
                  - "Tippe auf „It's half past five.“"
              - id: l2-f4
                type: speak
                text: "Wie spät ist es? Sag es auf Englisch."
                say: { de: "Wie spät ist es? Sag es auf Englisch.", en: "It's half past one." }
                show: { drawn: clock, hour: 1, minute: 30 }
                expected_text: "It's half past one."
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „It's half past“, dann „one“."
                  - "Sag mit mir: It's half past one."
              - id: l2-f5
                type: true_false
                text: "Passt die Uhr?"
                say: { de: "Hör zu. Passt die Uhr?", en: "It's half past eleven." }
                show: { drawn: clock, hour: 11, minute: 30 }
                answer: true
                hints:
                  - "Zeigt der große Zeiger nach unten?"
                  - "Steht der kleine Zeiger zwischen 11 und 12? Dann ist elf Uhr schon vorbei."
                  - "Ja, das passt. Tippe auf Ja."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Tippe auf die passende Uhr."
                say: { de: "Hör zu. Tippe auf die passende Uhr." }
                audio: { en: "It's half past eight." }
                options:
                  - { drawn: clock, hour: 7, minute: 30 }
                  - { drawn: clock, hour: 8, minute: 0 }
                  - { drawn: clock, hour: 8, minute: 30 }
                answer: "8:30"
                hints: ["Welche Stunde ist schon vorbei?"]
              - id: l2-s2
                type: multiple_choice
                text: "What time is it?"
                say: { de: "Wie spät ist es? Tippe auf den passenden Satz.", en: "What time is it?" }
                show: { drawn: clock, hour: 3, minute: 30 }
                options: ["It's half past four.", "It's three o'clock.", "It's half past three."]
                answer: "It's half past three."
                option_audio: false
                hints: ["Zwischen welchen Zahlen steht der kleine Zeiger?"]
              - id: l2-s3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Es ist halb elf“?"
                say: "Wie sagst du auf Englisch: Es ist halb elf?"
                options: ["It's half past eleven.", "It's half past ten.", "It's ten o'clock."]
                answer: "It's half past ten."
                option_audio: false
                hints: ["Welche volle Stunde ist schon vorbei?"]
              - id: l2-s4
                type: speak
                text: "Wie spät ist es? Sag es auf Englisch."
                say: { de: "Wie spät ist es? Sag es auf Englisch.", en: "It's half past six." }
                show: { drawn: clock, hour: 6, minute: 30 }
                expected_text: "It's half past six."
                hints: ["Zuerst „It's half past“."]
              - id: l2-s5
                type: true_false
                text: "Passt die Uhr?"
                say: { de: "Hör zu. Passt die Uhr?", en: "It's half past twelve." }
                show: { drawn: clock, hour: 11, minute: 30 }
                answer: false
                hints: ["Welche Stunde ist hier vorbei?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Tippe auf die passende Uhr."
                say: { de: "Hör zu. Tippe auf die passende Uhr." }
                audio: { en: "It's half past five." }
                options:
                  - { drawn: clock, hour: 5, minute: 0 }
                  - { drawn: clock, hour: 5, minute: 30 }
                  - { drawn: clock, hour: 4, minute: 30 }
                answer: "5:30"
              - id: l2-n2
                type: multiple_choice
                text: "What time is it?"
                say: { de: "Wie spät ist es? Tippe auf den passenden Satz.", en: "What time is it?" }
                show: { drawn: clock, hour: 10, minute: 30 }
                options: ["It's half past eleven.", "It's half past ten.", "It's ten o'clock."]
                answer: "It's half past ten."
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Es ist halb drei“?"
                say: "Wie sagst du auf Englisch: Es ist halb drei?"
                options: ["It's half past two.", "It's half past three.", "It's three o'clock."]
                answer: "It's half past two."
                option_audio: false
              - id: l2-n4
                type: speak
                text: "Wie spät ist es? Sag es auf Englisch."
                say: { de: "Wie spät ist es? Sag es auf Englisch." }
