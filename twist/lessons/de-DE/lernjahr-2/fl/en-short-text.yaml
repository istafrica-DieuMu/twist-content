# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-short-text
skill: fl.writing.short-text
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Einen kurzen Text schreiben
  en: Writing a short text
summary: >
  Writing a short English text about oneself from a model: an About me
  profile and a holiday postcard. Lesson 1 takes an About me text apart
  (name, age, family, pets, likes, can) and builds a new one for a given
  child; lesson 2 learns the parts of a postcard (Dear ..., where you are,
  the weather, what you do, Love, ...) and puts one together, and ends with
  the skill check. The child writes by choosing, ordering and filling gaps;
  free writing is not marked.
metadata:
  year: lernjahr-2
  topic: { de: Schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.writing.complete-sentences, fl.reading.short-texts]
  also_practises: [fl.themes.family, fl.themes.hobbies, fl.themes.weather, fl.speaking.about-me]
  vocabulary: { en: [About me, "My name is ...", "I am ...", "I have got ...", "I like ...", "I can ...", Dear, Love, holiday, "It's sunny", "It's raining", every day, see you soon] }
  forms: [text, picture, audio]
  drawn: []
  facets: []
  parts:
    - { id: profile, what: { de: "einen Text über sich nach Muster schreiben: About me", en: "writing a text about yourself from a model: About me" } }
    - { id: content, what: { de: passende Sätze für den Text wählen, en: choosing sentences that fit the text } }
    - { id: postcard, what: { de: "Anfang und Ende einer Postkarte: Dear und Love", en: "the start and end of a postcard: Dear and Love" } }
    - { id: order, what: { de: die Teile eines Textes ordnen, en: putting the parts of a text in order } }
  misconceptions:
    - id: love-at-start
      what: Starts a postcard with Love, from the German Liebe Oma
      addressed: lesson 2 Learn says that Liebe Oma becomes Dear Grandma and Love comes at the end before your name; l2-f1 and l2-s1 give feedback on Love at the start
    - id: off-topic
      what: Puts a sentence into the text that does not fit the person or the topic
      addressed: l1-f5 and l2-f5 ask which sentence does not belong; feedback names what the text is about
    - id: copy-model
      what: Copies the model text word for word instead of changing the details for the new person
      addressed: lesson 1 Learn shows the model and a changed text side by side; l1-f2 and l1-s2 give feedback when the model's detail is kept
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Ein Text über mich, en: About me }
    goal:
      de: "Nimm die Satzanfänge aus dem Mustertext und schreib einen Text über ein Kind, so wie I am nine."
      en: "Use the sentence starts from the model text to write about a child, like I am nine."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            option_audio: false
            text: "Das Kind kann schwimmen. Ergänze den Satz."
            say: { de: "Das Kind kann schwimmen. Ergänze den Satz." }
            show: { object: swim }
            frame: "I _ swim."
            options: ["can", "am", "have"]
            answer: ["can"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "Dear Sam,\nI'm at the seaside.\nLove, Nina\n\nWer schreibt?"
            say: { de: "Lies die Postkarte. Wer schreibt?" }
            options: ["Nina", "Sam"]
            answer: "Nina"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "About me\n\nWas glaubst du: Was gehört in einen Text über dich?"
            say: { de: "Du schreibst gleich einen kurzen Text über dich, auf Englisch. Was glaubst du: Was gehört da alles hinein?" }
            show: { objects: [girl, cat] }
          - text: "About me\nMy name is Ella. I am nine. I have got a brother and a cat. I like swimming. I can play the guitar."
            say: { de: "Schau, was Ella geschrieben hat. Das ist ein Mustertext über Ella. Jeder Satz sagt etwas anderes: den Namen, das Alter, die Familie und das Haustier, was Ella mag und was sie kann." }
            show: { objects: [girl, cat] }
          - text: "My name is ...\nI am ...\nI have got ...\nI like ...\nI can ..."
            say: { de: "Das sind die Satzanfänge. Sie bleiben gleich. Für deinen eigenen Text tauschst du nur das Ende aus." }
          - text: "Ella: My name is Ella. I am nine.\nJonas: My name is Jonas. I am ten."
            say: { de: "Hier schreibt Jonas mit demselben Muster über sich. Er schreibt nicht ab, was bei Ella steht. Er setzt seinen Namen und sein Alter ein." }
            show: { object: boy }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                option_audio: false
                text: "About me\nMy name is Tom. I am _ .\n\nTom ist acht Jahre alt. Ergänze seinen Text."
                say: { de: "Tom ist acht Jahre alt. Ergänze seinen Text." }
                frame: "I am _ ."
                options: ["eight", "nine", "Tom"]
                answer: ["eight"]
                hints:
                  - "Nach „I am“ kommt hier das Alter."
                  - "Acht heißt „eight“."
                  - "I am eight."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                option_audio: false
                text: "Muster: I have got a brother and a cat.\nNoah hat eine Schwester und einen Hund."
                say: { de: "Schreib Noahs Satz nach dem Muster." }
                frame: "I have got a _ and a _ ."
                options: ["sister", "dog", "brother", "cat"]
                answer: ["sister", "dog"]
                feedback:
                  "brother": "„Brother“ steht im Muster. Noah hat eine Schwester: „sister“."
                  "cat": "„Cat“ steht im Muster. Noah hat einen Hund: „dog“."
                hints:
                  - "Der Satzanfang bleibt. Tausch nur die Familie und das Tier aus."
                  - "Schwester heißt „sister“, Hund heißt „dog“."
                  - "I have got a sister and a dog."
              - id: l1-f3
                type: ordering
                option_audio: false
                text: "Bring die Sätze in eine gute Reihenfolge."
                say: { de: "Bau Mias Text. Was kommt zuerst?" }
                options: ["I am nine.", "I like painting.", "My name is Mia."]
                slot_count: 3
                answer: ["My name is Mia.", "I am nine.", "I like painting."]
                hints:
                  - "Zuerst sagst du, wie du heißt."
                  - "Dann kommt das Alter."
                  - "My name is Mia. I am nine. I like painting."
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "About me\nMy name is Leo. I am ten. ___\n\nLeo spielt gern Fußball. Welcher Satz passt?"
                say: { de: "Leo spielt gern Fußball. Welcher Satz passt in seinen Text?" }
                options: ["I like football.", "I am football.", "My name is football."]
                answer: "I like football."
                hints:
                  - "Welcher Satzanfang sagt, was man mag?"
                  - "„I like“ heißt „ich mag“."
                  - "I like football."
              - id: l1-f5
                type: multiple_choice
                option_audio: false
                text: "About me\nMy name is Sara. I am nine. I have got a rabbit. The bus is red. I like reading.\n\nWelcher Satz passt nicht?"
                say: { de: "Lies Saras Text. Welcher Satz passt nicht hinein?" }
                options: ["The bus is red.", "I have got a rabbit.", "I like reading."]
                answer: "The bus is red."
                feedback:
                  "I have got a rabbit.": "Das passt: Sara erzählt von ihrem Haustier. Such den Satz, der nichts über Sara sagt."
                  "I like reading.": "Das passt: Sara sagt, was sie mag. Such den Satz, der nichts über Sara sagt."
                hints:
                  - "Der Text heißt „About me“. Jeder Satz sagt etwas über Sara."
                  - "Prüf jeden Satz: Erzählt er etwas über Sara, über ihre Familie, was sie mag oder kann?"
                  - "„The bus is red“ sagt nichts über Sara."
              - id: l1-f6
                type: fill_in_blank
                option_audio: false
                text: "About me\nMy name is Ben. I am nine. I _ ride a bike.\n\nBen kann Fahrrad fahren. Ergänze seinen Text."
                say: { de: "Ben kann Fahrrad fahren. Ergänze seinen Text." }
                show: { object: ride-bike }
                frame: "I _ ride a bike."
                options: ["can", "am", "like"]
                answer: ["can"]
                hints:
                  - "Es geht darum, was Ben kann."
                  - "„Ich kann“ heißt „I can“."
                  - "I can ride a bike."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                option_audio: false
                text: "About me\nMy _ is Anna. I am eleven."
                say: { de: "Ergänze Annas Text." }
                frame: "My _ is Anna."
                options: ["name", "am", "like"]
                answer: ["name"]
                hints: ["„My name is“ heißt: Ich heiße."]
              - id: l1-s2
                type: fill_in_blank
                option_audio: false
                text: "Muster: I like swimming. I can play the guitar.\nFinn malt gern und kann singen."
                say: { de: "Schreib Finns Sätze nach dem Muster." }
                frame: "I like _ . I can _ ."
                options: ["painting", "sing", "swimming", "play the guitar"]
                answer: ["painting", "sing"]
                feedback:
                  "swimming": "„Swimming“ steht im Muster. Finn malt gern: „painting“."
                hints: ["Tausch nur das Ende jedes Satzes aus."]
              - id: l1-s3
                type: ordering
                option_audio: false
                text: "Bring die Sätze in eine gute Reihenfolge."
                say: { de: "Bau Omars Text. Was kommt zuerst?" }
                options: ["I can swim.", "My name is Omar.", "I am eight."]
                slot_count: 3
                answer: ["My name is Omar.", "I am eight.", "I can swim."]
                hints: ["Zuerst der Name, dann das Alter."]
              - id: l1-s4
                type: multiple_choice
                option_audio: false
                text: "About me\nMy name is Lucy. I am nine. ___\n\nLucy hat einen Hund. Welcher Satz passt?"
                say: { de: "Lucy hat einen Hund. Welcher Satz passt in ihren Text?" }
                options: ["I have got a dog.", "I am a dog.", "I can a dog."]
                answer: "I have got a dog."
                hints: ["„Ich habe“ heißt „I have got“."]
              - id: l1-s5
                type: multiple_choice
                option_audio: false
                text: "About me\nMy name is Max. I am ten. I like pizza. Pizza is from Italy. I can play tennis.\n\nWelcher Satz passt nicht?"
                say: { de: "Lies Max' Text. Welcher Satz passt nicht hinein?" }
                options: ["Pizza is from Italy.", "I like pizza.", "I can play tennis."]
                answer: "Pizza is from Italy."
                hints: ["Welcher Satz sagt nichts über Max?"]
              - id: l1-s6
                type: fill_in_blank
                option_audio: false
                text: "About me\nMy name is Kim. I am eight. I have got _ .\n\nKim hat einen kleinen Bruder. Ergänze ihren Text."
                say: { de: "Kim hat einen kleinen Bruder. Ergänze ihren Text." }
                frame: "I have got _ ."
                options: ["a brother", "brother", "a sister"]
                answer: ["a brother"]
                feedback:
                  "brother": "Vor „brother“ fehlt „a“."
                hints: ["Bruder heißt „brother“. Davor steht „a“."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                option_audio: false
                text: "About me\nMy name is Jack. I am _ .\n\nJack ist elf Jahre alt. Ergänze seinen Text."
                say: { de: "Jack ist elf Jahre alt. Ergänze seinen Text." }
                frame: "I am _ ."
                options: ["eleven", "seven", "Jack"]
                answer: ["eleven"]
              - id: l1-n2
                type: ordering
                option_audio: false
                text: "Bring die Sätze in eine gute Reihenfolge."
                say: { de: "Bau Lenas Text. Was kommt zuerst?" }
                options: ["I have got a cat.", "I am ten.", "My name is Lena.", "I like dancing."]
                slot_count: 4
                answer: ["My name is Lena.", "I am ten.", "I have got a cat.", "I like dancing."]
              - id: l1-n3
                type: fill_in_blank
                option_audio: false
                text: "Muster: I have got a brother and a cat.\nZoe hat einen Bruder und einen Fisch."
                say: { de: "Schreib Zoes Satz nach dem Muster." }
                frame: "I have got a brother and a _ ."
                options: ["fish", "cat", "dog"]
                answer: ["fish"]
              - id: l1-n4
                type: multiple_choice
                option_audio: false
                text: "About me\nMy name is Paul. I am nine. ___\n\nPaul kann Gitarre spielen. Welcher Satz passt?"
                say: { de: "Paul kann Gitarre spielen. Welcher Satz passt in seinen Text?" }
                options: ["I can play the guitar.", "I have got play the guitar.", "I am the guitar."]
                answer: "I can play the guitar."
              - id: l1-n5
                type: multiple_choice
                option_audio: false
                text: "About me\nMy name is Ida. I am eight. It's cold today. I have got a sister. I like apples.\n\nWelcher Satz passt nicht?"
                say: { de: "Lies Idas Text. Welcher Satz passt nicht hinein?" }
                options: ["It's cold today.", "I have got a sister.", "I like apples."]
                answer: "It's cold today."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            option_audio: false
            text: "About me\nMy name is Sam. I am _ .\n\nSam ist neun Jahre alt. Ergänze seinen Text."
            say: { de: "Sam ist neun Jahre alt. Ergänze seinen Text." }
            frame: "I am _ ."
            options: ["nine", "five", "Sam"]
            answer: ["nine"]
          - id: l1-c2
            type: ordering
            option_audio: false
            text: "Bring die Sätze in eine gute Reihenfolge."
            say: { de: "Bau Emils Text. Was kommt zuerst?" }
            options: ["I like reading.", "My name is Emil.", "I am ten."]
            slot_count: 3
            answer: ["My name is Emil.", "I am ten.", "I like reading."]
          - id: l1-c3
            type: multiple_choice
            option_audio: false
            text: "About me\nMy name is Nora. I am nine. ___\n\nNora mag Katzen. Welcher Satz passt?"
            say: { de: "Nora mag Katzen. Welcher Satz passt in ihren Text?" }
            options: ["I like cats.", "I am cats.", "I can cats."]
            answer: "I like cats."
          - id: l1-c4
            type: fill_in_blank
            option_audio: false
            text: "Muster: I like swimming.\nHanna liest gern. Schreib ihren Satz."
            say: { de: "Hanna liest gern. Schreib ihren Satz nach dem Muster." }
            frame: "I like _ ."
            options: ["swimming", "reading", "read"]
            answer: ["reading"]
          - id: l1-c5
            type: multiple_choice
            option_audio: false
            text: "About me\nMy name is Oli. I am nine. I have got a fish. Fish live in water. I can sing.\n\nWelcher Satz passt nicht?"
            say: { de: "Lies Olis Text. Welcher Satz passt nicht hinein?" }
            options: ["I have got a fish.", "Fish live in water.", "I can sing."]
            answer: "Fish live in water."
          - id: l1-c6
            type: multiple_choice
            option_audio: false
            text: "About me\nMy name is Rita. ___\n\nRita ist acht. Welcher Satz passt?"
            say: { de: "Rita ist acht Jahre alt. Welcher Satz passt in ihren Text?" }
            options: ["I have eight.", "I am eight.", "My name is eight."]
            answer: "I am eight."

  - n: 2
    title: { de: Eine Postkarte schreiben, en: Writing a postcard }
    goal:
      de: "Bau eine Postkarte in der richtigen Reihenfolge, von Dear Grandma bis Love und deinem Namen."
      en: "Put a postcard together in the right order, from Dear Grandma to Love and your name."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            option_audio: false
            text: "About me\nMy _ is Rosa."
            say: { de: "Ergänze Rosas Text." }
            frame: "My _ is Rosa."
            options: ["name", "am"]
            answer: ["name"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "About me\nMy name is Ali. I am nine. ___\n\nAli kann schwimmen. Welcher Satz passt?"
            say: { de: "Ali kann schwimmen. Welcher Satz passt in seinen Text?" }
            options: ["I can swim.", "I am swim."]
            answer: "I can swim."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Liebe Oma, ...\n\nWas glaubst du: Wie fängt Emma ihre Postkarte auf Englisch an?"
            say: { de: "Emma ist am Meer und schreibt ihrer Oma eine Postkarte. Auf Deutsch fängt sie an mit: Liebe Oma. Was glaubst du: Wie fängt sie auf Englisch an?" }
            show: { objects: [sun, shell] }
          - text: "Dear Grandma,\nI'm on holiday at the seaside. It's sunny and hot. Every day I swim and play on the beach.\nSee you soon!\nLove, Emma"
            say: { de: "Mit Dear Grandma! Das ist eine Postkarte. Sie hat feste Teile: Oben steht, an wen sie geht. Dann schreibst du, wo du bist, wie das Wetter ist und was du machst. Am Ende stehen ein Gruß und dein Name." }
            show: { objects: [sun, shell] }
          - text: "Liebe Oma, → Dear Grandma,\nDeine Emma → Love, Emma"
            say: { de: "Pass auf: „Liebe Oma“ heißt auf Englisch „Dear Grandma“. „Love“ kommt erst ganz am Ende, vor deinem Namen." }
          - text: "1. Dear ...,\n2. Where? I'm at ...\n3. Weather? It's ...\n4. What? Every day I ...\n5. Love, ..."
            say: { de: "Das ist der Plan für deine Postkarte. Fünf Teile in dieser Reihenfolge. So kannst du jede Postkarte schreiben." }
          - text: "Wusstest du? Die erste Briefmarke der Welt kam aus England: die Penny Black, 1840."
            say: { de: "Wusstest du? Die erste Briefmarke der Welt gab es in England, im Jahr achtzehnhundertvierzig. Sie war schwarz, kostete einen Penny und hieß darum Penny Black. Darauf war die junge Königin Victoria.", en: "The Penny Black." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "___\nI'm at the zoo with my class. It's great!\nLove, Finn\n\nFinn schreibt an Opa. Wie fängt die Karte an?"
                say: { de: "Finn schreibt an Opa. Wie fängt die Karte an?" }
                options: ["Dear Grandpa,", "Love Grandpa,", "Grandpa is,"]
                answer: "Dear Grandpa,"
                feedback:
                  "Love Grandpa,": "„Lieber“ oder „Liebe“ am Anfang heißt auf Englisch „Dear“. „Love“ kommt am Ende vor deinem Namen."
                hints:
                  - "Am Anfang steht, an wen die Karte geht."
                  - "„Lieber Opa“ heißt auf Englisch „Dear Grandpa“."
                  - "Dear Grandpa,"
                difficulty: easy
              - id: l2-f2
                type: ordering
                option_audio: false
                text: "Bring die Teile der Postkarte in die richtige Reihenfolge."
                say: { de: "Bau die Postkarte von Lilly. Was kommt zuerst?" }
                options: ["Love, Lilly", "Dear Mum,", "I'm at the lake."]
                slot_count: 3
                answer: ["Dear Mum,", "I'm at the lake.", "Love, Lilly"]
                hints:
                  - "Oben steht, an wen die Karte geht."
                  - "In der Mitte steht, wo Lilly ist."
                  - "Dear Mum, I'm at the lake. Love, Lilly."
              - id: l2-f3
                type: fill_in_blank
                option_audio: false
                text: "Dear Dad,\nI'm at the seaside. It's _ and hot.\nLove, Ben\n\nDie Sonne scheint. Ergänze Bens Karte."
                say: { de: "Die Sonne scheint. Ergänze Bens Karte." }
                show: { object: sun }
                frame: "It's _ and hot."
                options: ["sunny", "raining", "snowing"]
                answer: ["sunny"]
                hints:
                  - "Schau auf das Bild."
                  - "Sonnig heißt „sunny“."
                  - "It's sunny and hot."
              - id: l2-f4
                type: fill_in_blank
                option_audio: false
                text: "Dear Grandma,\nI'm in the _ . There's lots of snow.\nLove, Nick\n\nNick ist in den Bergen. Ergänze seine Karte."
                say: { de: "Nick ist in den Bergen. Ergänze seine Karte." }
                frame: "I'm in the _ ."
                options: ["mountains", "sea", "zoo"]
                answer: ["mountains"]
                hints:
                  - "Wo gibt es viel Schnee?"
                  - "Berge heißt „mountains“."
                  - "I'm in the mountains."
              - id: l2-f5
                type: multiple_choice
                option_audio: false
                text: "Dear Tom,\nI'm on holiday in Spain. It's very hot. My cat is at home. Every day I swim in the sea.\nLove, Lara\n\nWelcher Satz passt am wenigsten in die Urlaubskarte?"
                say: { de: "Lies Laras Karte. Welcher Satz passt am wenigsten hinein?" }
                options: ["My cat is at home.", "It's very hot.", "Every day I swim in the sea."]
                answer: "My cat is at home."
                feedback:
                  "It's very hot.": "Das Wetter gehört in eine Urlaubskarte."
                  "Every day I swim in the sea.": "Was du im Urlaub machst, gehört in die Karte."
                hints:
                  - "Eine Urlaubskarte erzählt, wo du bist, wie das Wetter ist und was du machst."
                  - "Welcher Satz erzählt nichts vom Urlaub?"
                  - "„My cat is at home“ erzählt nichts vom Urlaub."
              - id: l2-f6
                type: fill_in_blank
                option_audio: false
                text: "Dear Ella,\nI'm on a farm. Every day I _ the horses.\n_ , Mia\n\nMia füttert jeden Tag die Pferde. Ergänze ihre Karte."
                say: { de: "Mia füttert jeden Tag die Pferde. Ergänze ihre Karte." }
                frame: "Every day I _ the horses. _ , Mia"
                options: ["feed", "Love", "Dear", "am"]
                answer: ["feed", "Love"]
                hints:
                  - "Füttern heißt „feed“."
                  - "Was steht am Ende vor dem Namen?"
                  - "Every day I feed the horses. Love, Mia."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Dear Anna,\nI'm at the seaside. It's windy.\n___\n\nWie endet Pauls Karte?"
                say: { de: "Paul schreibt an Anna. Wie endet seine Karte?" }
                options: ["Love, Paul", "Dear Paul", "Paul is love"]
                answer: "Love, Paul"
                feedback:
                  "Dear Paul": "„Dear“ steht am Anfang, vor dem Namen der Person, die die Karte bekommt. Am Ende steht „Love“."
                hints: ["Am Ende steht ein Gruß und dein eigener Name."]
              - id: l2-s2
                type: ordering
                option_audio: false
                text: "Bring die Teile der Postkarte in die richtige Reihenfolge."
                say: { de: "Bau die Postkarte von Jan. Was kommt zuerst?" }
                options: ["It's raining.", "Love, Jan", "Dear Grandma,", "I'm in London."]
                slot_count: 4
                answer: ["Dear Grandma,", "I'm in London.", "It's raining.", "Love, Jan"]
                hints: ["Denk an den Plan: an wen, wo, Wetter, Gruß."]
              - id: l2-s3
                type: fill_in_blank
                option_audio: false
                text: "Dear Leo,\nI'm in Scotland. It's _ and cold.\nLove, Hanna\n\nEs regnet. Ergänze Hannas Karte."
                say: { de: "Es regnet. Ergänze Hannas Karte." }
