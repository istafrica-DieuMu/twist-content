# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-short-texts
skill: fl.reading.short-texts
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Kurze Texte lesen
  en: Reading short texts
summary: >
  Reading short English texts with pictures and understanding the main
  points: a profile, a postcard from the seaside, a picture-book page about
  a lost cat, a small comic. Lesson 1 reads profiles and postcards and
  finds who writes, where they are and what they do; lesson 2 reads short
  stories and comics, finds who is in them and what happens, puts the
  events in order, and ends with the skill check. The voice gives the
  instructions in German and does not read the English text, so the task
  tests reading.
metadata:
  year: lernjahr-2
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.sentences, fl.reading.sound-spelling]
  also_practises: [fl.culture-strategies.guess-meaning, fl.themes.family, fl.themes.weather, fl.themes.hobbies]
  vocabulary: { en: [Dear, Love, name, age, from, pet, holiday, sea, sunny, swim, friend, one day, looks, under, finds, box, raining] }
  forms: [text, picture, audio]
  drawn: []
  facets: []
  parts:
    - { id: who, what: { de: "herausfinden, wer schreibt, wer spricht oder wer vorkommt", en: "finding who writes, who speaks or who is in the text" } }
    - { id: facts, what: { de: "Angaben finden: woher, wie alt, was jemand hat und mag", en: "finding facts: where from, how old, what someone has and likes" } }
    - { id: events, what: { de: "verstehen, was passiert und wie es ausgeht", en: understanding what happens and how it ends } }
    - { id: order, what: { de: die Ereignisse in die richtige Reihenfolge bringen, en: putting the events in order } }
  misconceptions:
    - id: every-word
      what: Stops at the first unknown word and thinks the text cannot be read
      addressed: lesson 1 Learn says "Du musst nicht jedes Wort kennen. Lies weiter und such die Wörter, die du kennst."
    - id: dear-love
      what: Takes the name after Dear for the writer of a postcard
      addressed: lesson 1 Learn shows that Dear names the reader and Love names the writer; l1-f2 and l1-s3 give feedback on the Dear name
    - id: word-not-text
      what: Picks an option because a word from the text appears in it, not because the text says it
      addressed: l2-f2 and l2-s4 offer options with words from the story in the wrong place; feedback sends the child back to the sentence
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Steckbriefe und Postkarten, en: Profiles and postcards }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            option_audio: false
            text: "The cat is under the table.\nWelches Bild passt?"
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: cat }, { object: dog }, { object: mouse }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "It's sunny today.\nScheint heute die Sonne?"
            say: { de: "Lies den Satz. Scheint heute die Sonne?" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Name: Jack\nAge: 9\nFrom: Bristol\nPet: a rabbit\nI like: football and pizza"
            say: { de: "Das ist ein Steckbrief. Links steht immer, worum es geht: „Name“, „Age“ heißt Alter, „From“ heißt woher, „Pet“ heißt Haustier. Rechts steht die Antwort. Jack ist neun, kommt aus Bristol und hat ein Kaninchen." }
            show: { object: rabbit }
          - text: "Dear Grandma,\nI'm on holiday at the seaside. It's sunny and hot. Every day I swim in the sea.\nLove, Emma"
            say: { de: "Das ist eine Postkarte. Nach „Dear“ steht, an wen sie geht: an Oma. Nach „Love“ steht, wer schreibt: Emma. Emma ist am Meer im Urlaub und schwimmt jeden Tag." }
            show: { object: sun }
          - text: "Dear = an wen?\nLove = von wem?"
            say: { de: "Du musst nicht jedes Wort kennen. Lies weiter und such die Wörter, die du kennst: „sea“, „sunny“, „swim“. Dann weißt du schon, worum es geht." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                option_audio: false
                text: "Name: Amira\nAge: 10\nFrom: Leeds\nPet: a cat\nI like: dancing and books\n\nWie alt ist Amira?"
                say: { de: "Lies den Steckbrief. Wie alt ist Amira?" }
                options: ["9", "10", "11"]
                answer: "10"
                hints:
                  - "Such die Zeile, in der es um das Alter geht."
                  - "„Age“ heißt Alter."
                  - "Age: 10. Amira ist zehn."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Dear Max,\nI'm at my grandpa's farm. There are cows and pigs. I help Grandpa every day.\nLove, Finn\n\nWer hat die Karte geschrieben?"
                say: { de: "Lies die Postkarte. Wer hat sie geschrieben?" }
                options: ["Max", "Finn", "Grandpa"]
                answer: "Finn"
                feedback:
                  "Max": "Nach „Dear“ steht, an wen die Karte geht. Wer schreibt, steht nach „Love“."
                  "Grandpa": "Opa kommt in der Karte vor, aber er schreibt sie nicht. Schau, was nach „Love“ steht."
                hints:
                  - "Schau auf das Ende der Karte."
                  - "Nach „Love“ steht, wer schreibt."
                  - "Love, Finn. Finn hat die Karte geschrieben."
              - id: l1-f3
                type: multiple_choice
                option_audio: false
                text: "Dear Max,\nI'm at my grandpa's farm. There are cows and pigs. I help Grandpa every day.\nLove, Finn\n\nWo ist Finn?"
                say: { de: "Lies die Postkarte noch einmal. Wo ist Finn?" }
                options: ["auf dem Bauernhof", "am Meer", "in der Schule"]
                answer: "auf dem Bauernhof"
                hints:
                  - "Lies den ersten Satz nach „Dear Max“."
                  - "„Farm“ kennst du. Und es gibt Kühe und Schweine."
                  - "Finn ist auf Opas Bauernhof."
              - id: l1-f4
                type: image_multiple_choice
                option_audio: false
                text: "Name: Oscar\nAge: 8\nFrom: York\nPet: a dog\nI like: swimming\n\nWelches Haustier hat Oscar?"
                say: { de: "Lies den Steckbrief. Welches Haustier hat Oscar?" }
                options: [{ object: dog }, { object: cat }, { object: rabbit }]
                answer: dog
                hints:
                  - "„Pet“ heißt Haustier."
                  - "Such die Zeile mit „Pet“."
                  - "Pet: a dog. Oscar hat einen Hund."
              - id: l1-f5
                type: true_false
                text: "Dear Mum and Dad,\nI'm on a school trip. It's rainy and cold, but it's fun. We sing every evening.\nLove, Lucy\n\nIst das Wetter schön?"
                say: { de: "Lies die Postkarte. Ist das Wetter schön?" }
                answer: false
                hints:
                  - "Such die Wörter zum Wetter."
                  - "Lucy schreibt: „It's rainy and cold.“"
                  - "Nein, es ist regnerisch und kalt."
              - id: l1-f6
                type: multiple_choice
                option_audio: false
                text: "Name: Amira\nAge: 10\nFrom: Leeds\nPet: a cat\nI like: dancing and books\n\nWas macht Amira gern?"
                say: { de: "Lies den Steckbrief noch einmal. Was macht Amira gern?" }
                options: ["tanzen und lesen", "schwimmen und lesen", "tanzen und malen"]
                answer: "tanzen und lesen"
                hints:
                  - "Such die Zeile mit „I like“."
                  - "„Dancing“ kommt von „dance“, tanzen. „Books“ sind Bücher."
                  - "Amira tanzt und liest gern."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                option_audio: false
                text: "Name: Harry\nAge: 11\nFrom: London\nPet: a fish\nI like: tennis and the guitar\n\nWoher kommt Harry?"
                say: { de: "Lies den Steckbrief. Woher kommt Harry?" }
                options: ["aus London", "aus Leeds", "aus York"]
                answer: "aus London"
                hints: ["„From“ heißt woher."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Dear Ella,\nI'm in the mountains with my family. There's lots of snow. Today I made a big snowman!\nLove, Noah\n\nWas hat Noah heute gemacht?"
                say: { de: "Lies die Postkarte. Was hat Noah heute gemacht?" }
                options: ["einen Schneemann gebaut", "im Meer geschwommen", "Fußball gespielt"]
                answer: "einen Schneemann gebaut"
                hints: ["Lies den Satz mit „Today“."]
              - id: l1-s3
                type: multiple_choice
                option_audio: false
                text: "Dear Ella,\nI'm in the mountains with my family. There's lots of snow. Today I made a big snowman!\nLove, Noah\n\nAn wen geht die Karte?"
                say: { de: "Lies die Postkarte noch einmal. An wen geht die Karte?" }
                options: ["an Ella", "an Noah", "an die Familie"]
                answer: "an Ella"
                feedback:
                  "an Noah": "Noah steht nach „Love“. Er schreibt die Karte. Sie geht an den Namen nach „Dear“."
                hints: ["Nach „Dear“ steht, an wen die Karte geht."]
              - id: l1-s4
                type: true_false
                text: "Name: Harry\nAge: 11\nFrom: London\nPet: a fish\nI like: tennis and the guitar\n\nSpielt Harry gern Gitarre?"
                say: { de: "Lies den Steckbrief noch einmal. Spielt Harry gern Gitarre?" }
                answer: true
                hints: ["Lies die Zeile mit „I like“."]
              - id: l1-s5
                type: image_multiple_choice
                option_audio: false
                text: "Dear Grandpa,\nWe're at the zoo today. I love the giraffes. They've got very long necks!\nLove, Mia\n\nWelches Tier mag Mia?"
                say: { de: "Lies die Postkarte. Welches Tier mag Mia?" }
                options: [{ object: giraffe }, { object: elephant }, { object: lion }]
                answer: giraffe
                hints: ["Such den Satz mit „I love“."]
              - id: l1-s6
                type: multiple_choice
                option_audio: false
                text: "Dear Mum and Dad,\nI'm on a school trip. It's rainy and cold, but it's fun. We sing every evening.\nLove, Lucy\n\nWas machen die Kinder jeden Abend?"
                say: { de: "Lies die Postkarte. Was machen die Kinder jeden Abend?" }
                options: ["Sie singen.", "Sie schwimmen.", "Sie malen."]
                answer: "Sie singen."
                hints: ["„Every evening“ heißt jeden Abend."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                option_audio: false
                text: "Name: Ruby\nAge: 9\nFrom: Cardiff\nPet: two rabbits\nI like: painting\n\nWie viele Haustiere hat Ruby?"
                say: { de: "Lies den Steckbrief. Wie viele Haustiere hat Ruby?" }
                options: ["1", "2", "3"]
                answer: "2"
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Dear Sam,\nI'm on holiday in Spain. It's very hot. Every day I have an ice cream!\nLove, Ben\n\nWer hat die Karte geschrieben?"
                say: { de: "Lies die Postkarte. Wer hat die Karte geschrieben?" }
                options: ["Ben", "Sam", "Spain"]
                answer: "Ben"
              - id: l1-n3
                type: image_multiple_choice
                option_audio: false
                text: "Dear Sam,\nI'm on holiday in Spain. It's very hot. Every day I have an ice cream!\nLove, Ben\n\nWas isst Ben jeden Tag?"
                say: { de: "Lies die Postkarte noch einmal. Was isst Ben jeden Tag?" }
                options: [{ object: ice-cream }, { object: pizza }, { object: cake }]
                answer: ice-cream
              - id: l1-n4
                type: true_false
                text: "Name: Ruby\nAge: 9\nFrom: Cardiff\nPet: two rabbits\nI like: painting\n\nMalt Ruby gern?"
                say: { de: "Lies den Steckbrief noch einmal. Malt Ruby gern?" }
                answer: true
              - id: l1-n5
                type: multiple_choice
                option_audio: false
                text: "Dear Grandma,\nI'm at the seaside with Dad. It's windy, so we fly my new kite.\nLove, Jack\n\nWas machen Jack und Papa?"
                say: { de: "Lies die Postkarte. Was machen Jack und Papa?" }
                options: ["Sie lassen einen Drachen steigen.", "Sie schwimmen im Meer.", "Sie essen ein Eis."]
                answer: "Sie lassen einen Drachen steigen."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            option_audio: false
            text: "Name: Theo\nAge: 10\nFrom: Bath\nPet: a hamster\nI like: football\n\nWoher kommt Theo?"
            say: { de: "Lies den Steckbrief. Woher kommt Theo?" }
            options: ["aus Bath", "aus London", "aus York"]
            answer: "aus Bath"
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Dear Lily,\nI'm at the lake with my family. We've got a little boat.\nLove, Grace\n\nWer hat die Karte geschrieben?"
            say: { de: "Lies die Postkarte. Wer hat die Karte geschrieben?" }
            options: ["Grace", "Lily", "die Familie"]
            answer: "Grace"
          - id: l1-c3
            type: true_false
            text: "Dear Nick,\nWe're on holiday at a big lake. It's warm, and every day we go out in a boat.\nLove, Ivy\n\nMacht Ivy Urlaub am See?"
            say: { de: "Lies die Postkarte. Macht Ivy Urlaub am See?" }
            answer: true
          - id: l1-c4
            type: multiple_choice
            option_audio: false
            text: "Name: Tilly\nAge: 8\nFrom: Hull\nPet: a pony\nI like: riding and drawing\n\nWelches Haustier hat Tilly?"
            say: { de: "Lies den Steckbrief. Welches Haustier hat Tilly?" }
            options: ["einen Hund", "ein Pony", "eine Katze"]
            answer: "ein Pony"
          - id: l1-c5
            type: multiple_choice
            option_audio: false
            text: "Dear Ollie,\nI'm in London with Grandma. Today we saw the big clock, Big Ben!\nLove, Rosa\n\nWo ist Rosa?"
            say: { de: "Lies die Postkarte. Wo ist Rosa?" }
            options: ["am Meer", "bei Ollie", "in London"]
            answer: "in London"
          - id: l1-c6
            type: true_false
            text: "Dear Mum,\nI'm at the lake. It's sunny and warm. I swim every day.\nLove, Jonah\n\nIst das Wetter schlecht?"
            say: { de: "Lies die Postkarte. Ist das Wetter schlecht?" }
            answer: false

  - n: 2
    title: { de: Geschichten und Comics, en: Stories and comics }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            option_audio: false
            text: "Name: Zoe\nAge: 8\nPet: a dog\n\nWie alt ist Zoe?"
            say: { de: "Lies den Steckbrief. Wie alt ist Zoe?" }
            options: ["8", "9", "10"]
            answer: "8"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "Dear Tom,\nI'm at the seaside.\nLove, Anna\n\nWer schreibt?"
            say: { de: "Lies die Postkarte. Wer schreibt?" }
            options: ["Anna", "Tom"]
            answer: "Anna"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Leo has got a little cat. Her name is Mimi. One day Mimi is not in the house. Leo looks in the garden. He looks under the bed. Then he hears “Miaow!” Mimi is in a box!"
            say: { de: "Das ist eine Seite aus einem Bilderbuch. Lies sie in Ruhe. Wer ist in der Geschichte? Leo und seine Katze Mimi." }
            show: { objects: [cat, box] }
          - text: "One day = eines Tages\nThen = dann\nlooks = sucht, schaut"
            say: { de: "„One day“ zeigt: Jetzt passiert etwas. Mimi ist weg. Leo sucht sie. „Then“ zeigt, was danach kommt. Am Ende findet er Mimi in einer Kiste." }
          - text: "Ben: Can I play football, Mum?\nMum: No, sorry. It's raining.\nBen: OK. Then I can read a book."
            say: { de: "Das ist ein Comic. Vor dem Doppelpunkt steht, wer spricht. Ben will Fußball spielen, aber es regnet. Also liest er ein Buch." }
            show: { objects: [rain, book] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "Leo has got a little cat. Her name is Mimi. One day Mimi is not in the house. Leo looks in the garden. He looks under the bed. Then he hears “Miaow!” Mimi is in a box!\n\nWorum geht es?"
                say: { de: "Lies die Geschichte. Worum geht es?" }
                options: ["Leo sucht seine Katze.", "Leo kauft eine Katze.", "Leo spielt im Garten."]
                answer: "Leo sucht seine Katze."
                hints:
                  - "Was passiert nach „One day“?"
                  - "Mimi ist nicht im Haus. Leo schaut im Garten und unter dem Bett."
                  - "Leo sucht Mimi, seine Katze."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                option_audio: false
                text: "Leo has got a little cat. Her name is Mimi. One day Mimi is not in the house. Leo looks in the garden. He looks under the bed. Then he hears “Miaow!” Mimi is in a box!\n\nWo ist Mimi am Ende?"
                say: { de: "Lies die Geschichte noch einmal. Wo ist Mimi am Ende?" }
                options: ["in einer Kiste", "unter dem Bett", "im Garten"]
                answer: "in einer Kiste"
                feedback:
                  "unter dem Bett": "Unter dem Bett sucht Leo, aber da ist Mimi nicht. Lies den letzten Satz."
                  "im Garten": "Im Garten sucht Leo zuerst. Lies den letzten Satz."
                hints:
                  - "Lies den letzten Satz."
                  - "„Mimi is in a box!“"
                  - "„Box“ heißt Kiste. Mimi ist in einer Kiste."
              - id: l2-f3
                type: true_false
                text: "Ben: Can I play football, Mum?\nMum: No, sorry. It's raining.\nBen: OK. Then I can read a book.\n\nDarf Ben Fußball spielen?"
                say: { de: "Lies den Comic. Darf Ben Fußball spielen?" }
                show: { objects: [rain, book] }
                answer: false
                hints:
                  - "Lies, was Mama sagt."
                  - "Mama sagt: „No, sorry. It's raining.“"
                  - "Nein, es regnet. Ben liest ein Buch."
              - id: l2-f4
                type: ordering
                option_audio: false
                text: "Leo has got a little cat. Her name is Mimi. One day Mimi is not in the house. Leo looks in the garden. He looks under the bed. Then he hears “Miaow!” Mimi is in a box!\n\nBring die Sätze in die richtige Reihenfolge."
                say: { de: "Lies die Geschichte von Leo und Mimi noch einmal. Bring die Sätze in die richtige Reihenfolge." }
                options: ["Leo hears “Miaow!”", "Mimi is not in the house.", "Leo looks under the bed."]
                slot_count: 3
                answer: ["Mimi is not in the house.", "Leo looks under the bed.", "Leo hears “Miaow!”"]
                hints:
                  - "Was passiert zuerst? Mimi ist weg."
                  - "Dann sucht Leo."
                  - "Mimi ist weg, Leo sucht unter dem Bett, dann hört er „Miaow!“."
              - id: l2-f5
                type: multiple_choice
                option_audio: false
                text: "Granny has got a red hat. One day the wind takes the hat. It flies over the house and into a tree. A little bird sits in the hat. “Look, Granny! It's a nest now!” says Tim.\n\nWer sitzt am Ende im Hut?"
                say: { de: "Lies die Geschichte. Wer sitzt am Ende im Hut?" }
                options: ["ein Vogel", "Tim", "Oma"]
                answer: "ein Vogel"
                hints:
                  - "Lies die Sätze am Ende."
                  - "„A little bird sits in the hat.“"
                  - "„Bird“ heißt Vogel."
              - id: l2-f6
                type: image_multiple_choice
                option_audio: false
                text: "Granny has got a red hat. One day the wind takes the hat. It flies over the house and into a tree. A little bird sits in the hat. “Look, Granny! It's a nest now!” says Tim.\n\nWohin fliegt der Hut?"
                say: { de: "Lies die Geschichte noch einmal. Wohin fliegt der Hut?" }
                options: [{ object: tree }, { object: house }, { object: car }]
                answer: tree
                feedback:
                  house: "Der Hut fliegt über das Haus, aber er landet woanders. Lies weiter: „and into a ...“."
                hints:
                  - "Such „into“."
                  - "„It flies over the house and into a tree.“"
                  - "„Tree“ heißt Baum."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Mia: I'm so hungry!\nDad: Here's a sandwich.\nMia: Thanks, Dad! Can I have some juice too?\n\nWas möchte Mia noch?"
                say: { de: "Lies den Comic. Was möchte Mia noch?" }
                options: ["Saft", "ein Brot", "Milch"]
                answer: "Saft"
                feedback:
                  "ein Brot": "Das Brot gibt Papa ihr schon. Lies, worum sie danach bittet."
                hints: ["Lies den letzten Satz von Mia."]
              - id: l2-s2
                type: ordering
                option_audio: false
                text: "Granny has got a red hat. One day the wind takes the hat. It flies over the house and into a tree. A little bird sits in the hat. “Look, Granny! It's a nest now!” says Tim.\n\nBring die Sätze in die richtige Reihenfolge."
                say: { de: "Lies die Geschichte von Omas Hut noch einmal. Bring die Sätze in die richtige Reihenfolge." }
                options: ["A bird sits in the hat.", "The wind takes the hat.", "The hat flies into a tree."]
                slot_count: 3
                answer: ["The wind takes the hat.", "The hat flies into a tree.", "A bird sits in the hat."]
                hints: ["Was passiert zuerst mit dem Hut?"]
              - id: l2-s3
                type: true_false
                text: "Sam has got a new bike. It's blue. Every morning he rides his bike to school. Today he can't. The bike has got a flat tyre!\n\nFährt Sam heute mit dem Rad zur Schule?"
                say: { de: "Lies die Geschichte. Fährt Sam heute mit dem Rad zur Schule?" }
                answer: false
                hints: ["Lies den Satz mit „Today“."]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Sam has got a new bike. It's blue. Every morning he rides his bike to school. Today he can't. The bike has got a flat tyre!\n\nWelche Farbe hat Sams Fahrrad?"
                say: { de: "Lies die Geschichte noch einmal. Welche Farbe hat Sams Fahrrad?" }
                options: ["blau", "rot", "neu"]
                answer: "blau"
                feedback:
                  "neu": "„New“ steht im Text, aber das ist keine Farbe. Lies den zweiten Satz."
                hints: ["Lies den Satz nach „new bike“."]
              - id: l2-s5
                type: multiple_choice
                option_audio: false
                text: "Lily: Look, a snowman!\nJoe: He's got my woolly hat!\nLily: Ha ha! And Dad's carrot!\n\nWem gehört die Mütze?"
                say: { de: "Lies den Comic. Wem gehört die Mütze?" }
                options: ["Joe", "Lily", "Papa"]
                answer: "Joe"
                hints: ["Wer sagt „my woolly hat“?"]
              - id: l2-s6
                type: image_multiple_choice
                option_audio: false
                text: "Tom and Grandpa go to the lake. Grandpa has got some bread. A duck comes. Tom gives the bread to the duck.\n\nWelches Tier bekommt das Brot?"
                say: { de: "Lies die Geschichte. Welches Tier bekommt das Brot?" }
                options: [{ object: duck }, { object: fish }, { object: frog }]
                answer: duck
                hints: ["Lies den Satz mit „comes“."]

          - support: none
