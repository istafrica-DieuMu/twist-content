# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-now-and-routine
skill: fl.grammar.now-and-routine
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Gerade jetzt und jeden Tag
  en: Right now and every day
summary: >
  English has two forms where German has one: She is reading (gerade
  jetzt) and She reads every day (immer wieder). Lesson 1 says what
  someone is doing right now with is …-ing, to pictures; lesson 2 sets
  routines with every day, on Saturdays and the -s for he and she against
  right now, and ends with the skill check.
metadata:
  year: lernjahr-2
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 11
  builds_on: [fl.themes.hobbies]
  also_practises: [fl.grammar.chunks]
  vocabulary: { en: [is reading, is swimming, is singing, is dancing, is painting, every day, on Saturdays, now, reads, plays, swims] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: now, what: { de: "sagen, was jemand gerade tut: is und -ing", en: "saying what someone is doing now: is and -ing" } }
    - { id: routine, what: { de: "sagen, was jemand immer wieder tut, mit -s bei he und she", en: "saying what someone does every day, with -s for he and she" } }
    - { id: choose, what: { de: an der Zeitangabe die passende Form wählen, en: choosing the form from the time word } }
  misconceptions:
    - id: one-present-like-german
      what: Uses one form for both, as in German (She reads now, She is reading every day)
      addressed: lesson 2 Learn sets now against every day; each stage of lesson 2 has a task where the Zeitangabe decides, with feedback in l2-f1
    - id: missing-s
      what: Leaves out the -s for he and she (He play football)
      addressed: lesson 2 Learn marks the -s; every stage offers the form without -s, with feedback in l2-f2
    - id: missing-is
      what: Leaves out is in the -ing form (She reading)
      addressed: lesson 1 Learn says is must not be left out; every stage of lesson 1 offers the form without is, with feedback in l1-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was macht sie gerade?", en: "What is she doing?" }
    goal:
      de: "Schau auf das Bild und sag, was jemand gerade tut, so wie She is reading."
      en: "Look at the picture and say what someone is doing right now, like She is reading."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Swim." }
            options: [{ object: swim }, { object: sing }, { object: read }]
            answer: swim
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Paint." }
            options: [{ object: dance }, { object: paint }, { object: play-football }]
            answer: paint
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "She is reading."
            say: { de: "Was jemand gerade jetzt tut, sagst du mit „is“ und einem Verb mit -ing am Ende.", en: "Look! She is reading." }
            show: { object: read }
          - text: "He is swimming."
            say: { de: "Bei einem Jungen oder einem Mann sagst du „he“.", en: "He is swimming." }
            show: { object: swim }
          - text: "is + -ing"
            say: { de: "Das „is“ darf nicht fehlen. „She reading“ ist falsch, richtig ist „She is reading“." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Was macht das Kind gerade?"
                say: { de: "Hör zu. Was macht das Kind gerade?" }
                audio: { en: "She is singing." }
                options: [{ object: sing }, { object: dance }, { object: paint }]
                answer: sing
                hints:
                  - "Hör auf das Wort mit -ing."
                  - "„Singing“ kommt von singen."
                  - "Tippe auf das singende Kind."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Schau dir das Bild an. Welcher Satz passt?"
                show: { object: dance }
                options: ["She is dancing.", "She dancing.", "She is dance."]
                answer: "She is dancing."
                option_audio: false
                feedback:
                  "She dancing.": "Hier fehlt das „is“. Richtig ist „She is dancing.“"
                hints:
                  - "Gerade jetzt: Du brauchst „is“ und -ing."
                  - "Welcher Satz hat beides, „is“ und „dancing“?"
                  - "Tippe auf „She is dancing.“"
              - id: l1-f3
                type: fill_in_blank
                text: "Ergänze den Satz."
                say: "Ergänze den Satz zum Bild."
                show: { object: paint }
                frame: "He _ painting."
                options: ["is", "am", "are"]
                answer: ["is"]
                hints:
                  - "Der Satz fängt mit „He“ an. Welches Wort passt zu „he“?"
                  - "Bei „he“ und „she“ heißt es „is“."
                  - "Tippe auf „is“."
              - id: l1-f4
                type: audio_choice
                text: "Was macht das Kind gerade?"
                say: { de: "Hör zu. Was macht das Kind gerade?" }
                audio: { en: "He is riding his bike." }
                options: [{ object: ride-bike }, { object: swim }, { object: play-tennis }]
                answer: ride-bike
                hints:
                  - "Hör auf das Wort nach „is“."
                  - "„Riding his bike“ heißt Fahrrad fahren."
                  - "Tippe auf das Fahrrad."
              - id: l1-f5
                type: true_false
                text: "She is playing tennis.\nPasst der Satz zum Bild?"
                say: { de: "Hör zu. Passt der Satz zum Bild?", en: "She is playing tennis." }
                show: { object: play-football }
                answer: false
                hints:
                  - "Was zeigt das Bild?"
                  - "„Playing tennis“ heißt Tennis spielen. Siehst du einen Tennisschläger?"
                  - "Tippe auf Nein. Auf dem Bild spielt das Kind Fußball."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Was macht das Kind gerade?"
                say: { de: "Hör zu. Was macht das Kind gerade?" }
                audio: { en: "He is reading." }
                options: [{ object: read }, { object: paint }, { object: sing }]
                answer: read
                hints: ["Hör auf das Wort mit -ing."]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Schau dir das Bild an. Welcher Satz passt?"
                show: { object: play-tennis }
                options: ["He is playing tennis.", "He playing tennis.", "He is play tennis."]
                answer: "He is playing tennis."
                option_audio: false
                hints: ["„Is“ und -ing."]
              - id: l1-s3
                type: fill_in_blank
                text: "Ergänze den Satz."
                say: "Ergänze den Satz zum Bild."
                show: { object: sing }
                frame: "She is _."
                options: ["singing", "sing", "sings"]
                answer: ["singing"]
                hints: ["Nach „is“ kommt die -ing-Form."]
              - id: l1-s4
                type: true_false
                text: "He is playing the guitar.\nPasst der Satz zum Bild?"
                say: { de: "Hör zu. Passt der Satz zum Bild?", en: "He is playing the guitar." }
                show: { object: play-guitar }
                answer: true
                hints: ["Was zeigt das Bild?"]
              - id: l1-s5
                type: audio_choice
                text: "Was macht das Kind gerade?"
                say: { de: "Hör zu. Was macht das Kind gerade?" }
                audio: { en: "She is playing football." }
                options: [{ object: play-tennis }, { object: play-football }, { object: dance }]
                answer: play-football
                hints: ["Hör auf das Wort nach „playing“."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Was macht das Kind gerade?"
                say: { de: "Hör zu. Was macht das Kind gerade?" }
                audio: { en: "He is dancing." }
                options: [{ object: sing }, { object: dance }, { object: read }]
                answer: dance
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Schau dir das Bild an. Welcher Satz passt?"
                show: { object: sing }
                options: ["She is singing.", "She singing.", "She is sing."]
                answer: "She is singing."
                option_audio: false
              - id: l1-n3
                type: fill_in_blank
                text: "Ergänze den Satz."
                say: "Ergänze den Satz zum Bild."
                show: { object: ride-bike }
                frame: "He _ riding his bike."
                options: ["is", "are", "am"]
                answer: ["is"]
              - id: l1-n4
                type: true_false
                text: "She is swimming.\nPasst der Satz zum Bild?"
                say: { de: "Hör zu. Passt der Satz zum Bild?", en: "She is swimming." }
                show: { object: paint }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "Was macht das Kind gerade?"
                say: { de: "Hör zu. Was macht das Kind gerade?" }
                audio: { en: "She is painting." }
                options: [{ object: paint }, { object: swim }, { object: play-guitar }]
                answer: paint

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Was macht das Kind gerade?"
            say: { de: "Hör zu. Was macht das Kind gerade?" }
            audio: { en: "He is playing tennis." }
            options: [{ object: play-tennis }, { object: ride-bike }, { object: sing }]
            answer: play-tennis
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Bild an. Welcher Satz passt?"
            show: { object: play-guitar }
            options: ["He is playing the guitar.", "He playing the guitar.", "He is play the guitar."]
            answer: "He is playing the guitar."
            option_audio: false
          - id: l1-c3
            type: fill_in_blank
            text: "Ergänze den Satz."
            say: "Ergänze den Satz zum Bild."
            show: { object: dance }
            frame: "She is _."
            options: ["dancing", "dance", "dances"]
            answer: ["dancing"]
          - id: l1-c4
            type: audio_choice
            text: "Was macht Lily gerade?"
            say: { de: "Hör zu. Was macht Lily gerade?" }
            audio: { en: "Look! Lily is reading a book." }
            options: [{ object: paint }, { object: read }, { object: swim }]
            answer: read
          - id: l1-c5
            type: multiple_choice
            text: "Welcher Satz ist richtig?"
            say: "Welcher Satz ist richtig?"
            options: ["She swimming.", "She is swim.", "She is swimming."]
            answer: "She is swimming."
            option_audio: false
          - id: l1-c6
            type: ordering
            text: "Bau den Satz: Er fährt gerade Rad."
            say: "Bau den Satz auf Englisch: Er fährt gerade Rad."
            options: ["riding", "He", "his bike.", "is"]
            slot_count: 4
            answer: ["He", "is", "riding", "his bike."]
            option_audio: false

  - n: 2
    title: { de: "Jetzt oder jeden Tag?", en: "Now or every day?" }
    goal:
      de: "Entscheide, ob etwas gerade jetzt passiert oder jeden Tag, so wie She draws every day."
      en: "Decide if something is happening right now or every day, like She draws every day."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Bild an. Welcher Satz passt?"
            show: { object: swim }
            options: ["He is swimming.", "He swimming.", "He is swim."]
            answer: "He is swimming."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Was macht das Kind gerade?"
            say: { de: "Hör zu. Was macht das Kind gerade?" }
            audio: { en: "She is dancing." }
            options: [{ object: swim }, { object: read }, { object: dance }]
            answer: dance
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "He plays football every Saturday."
            say: { de: "Was jemand immer wieder tut, sagst du ohne „is“ und ohne -ing. Oft steht eine Zeitangabe dabei wie „every Saturday“, jeden Samstag.", en: "He plays football every Saturday." }
            show: { object: play-football }
          - text: "I play · he plays · she plays"
            say: { de: "Pass auf: Bei „he“ und „she“ kommt ein -s an das Verb. „I play“, aber „he plays“ und „she plays“." }
          - text: "now → is …-ing · every day → -s"
            say: { de: "So entscheidest du. Steht „now“ oder „Look!“ da, passiert es gerade jetzt: „She is drawing now.“ Steht „every day“ oder „on Saturdays“ da, passiert es immer wieder: „She draws every day.“" }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Look! He _ football now.\nWelche Form passt in die Lücke?"
                say: "Lies den Satz. Welche Form passt in die Lücke?"
                options: ["is playing", "plays", "play"]
                answer: "is playing"
                option_audio: false
                feedback:
                  "plays": "„Now“ heißt gerade jetzt. Dann brauchst du „is playing“."
                hints:
                  - "Achte auf das Wort „now“."
                  - "„Now“ heißt gerade jetzt. Dann brauchst du „is“ und -ing."
                  - "Tippe auf „is playing“."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "She _ every day.\nWelche Form passt in die Lücke?"
                say: "Lies den Satz. Welche Form passt in die Lücke?"
                options: ["reads", "is reading", "read"]
                answer: "reads"
                option_audio: false
                feedback:
                  "read": "Bei „she“ kommt ein -s an das Verb: „she reads“."
                hints:
                  - "„Every day“ heißt jeden Tag, also immer wieder."
                  - "Immer wieder: kein „is“, aber bei „she“ ein -s am Verb."
                  - "Tippe auf „reads“."
              - id: l2-f3
                type: fill_in_blank
                text: "Ergänze den Satz. Tom schwimmt jeden Samstag."
                say: "Ergänze den Satz. Tom schwimmt jeden Samstag."
                frame: "Tom _ on Saturdays."
                options: ["swims", "swim", "is swimming"]
                answer: ["swims"]
                hints:
                  - "„On Saturdays“ heißt samstags, also immer wieder."
                  - "Tom ist „he“, also bekommt das Verb ein -s."
                  - "Tippe auf „swims“."
              - id: l2-f4
                type: sorting
                text: "Jetzt oder immer wieder?"
                say: "Sortiere die Sätze: Passiert es gerade jetzt oder immer wieder?"
                option_audio: false
                bins:
                  - { id: now, show: { text: "gerade jetzt" }, say: "gerade jetzt" }
                  - { id: often, show: { text: "immer wieder" }, say: "immer wieder" }
                options:
                  - { text: "She is singing now.", bin: now }
                  - { text: "He plays tennis every day.", bin: often }
                  - { text: "Look! He is dancing.", bin: now }
                  - { text: "I read on Sundays.", bin: often }
                hints:
                  - "Achte auf „now“, „Look!“, „every day“ und „on Sundays“."
                  - "„Is“ mit -ing heißt gerade jetzt."
                  - "Gerade jetzt: „She is singing now.“ und „Look! He is dancing.“ Die anderen passieren immer wieder."
              - id: l2-f5
                type: true_false
                text: "He ride his bike every day.\nIst der Satz richtig?"
                say: { de: "Lies den Satz. Ist er richtig?" }
                answer: false
                hints:
                  - "Wie ist das bei „he“?"
                  - "Bei „he“ kommt ein -s an das Verb."
                  - "Tippe auf Nein. Richtig ist „He rides his bike every day.“"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Look! She _ now.\nWelche Form passt in die Lücke?"
                say: "Lies den Satz. Welche Form passt in die Lücke?"
                options: ["is painting", "paints", "paint"]
                answer: "is painting"
                option_audio: false
                hints: ["Achte auf „now“."]
              - id: l2-s2
                type: multiple_choice
                text: "He _ to school every day.\nWelche Form passt in die Lücke?"
                say: "Lies den Satz. Welche Form passt in die Lücke?"
                options: ["walks", "is walking", "walk"]
                answer: "walks"
                option_audio: false
                hints: ["„Every day“: immer wieder."]
              - id: l2-s3
                type: fill_in_blank
                text: "Ergänze den Satz. Anna singt jeden Morgen."
                say: "Ergänze den Satz. Anna singt jeden Morgen."
                frame: "Anna _ every morning."
                options: ["sings", "sing", "is singing"]
                answer: ["sings"]
                hints: ["Anna ist „she“."]
              - id: l2-s4
                type: sorting
                text: "Jetzt oder immer wieder?"
                say: "Sortiere die Sätze: Passiert es gerade jetzt oder immer wieder?"
                option_audio: false
                bins:
                  - { id: now, show: { text: "gerade jetzt" }, say: "gerade jetzt" }
                  - { id: often, show: { text: "immer wieder" }, say: "immer wieder" }
                options:
                  - { text: "I swim on Mondays.", bin: often }
                  - { text: "He is reading now.", bin: now }
                  - { text: "She rides her bike every day.", bin: often }
                  - { text: "Look! She is playing.", bin: now }
                hints: ["Achte auf die Zeitangaben."]
              - id: l2-s5
                type: true_false
                text: "Look! He plays football.\nIst der Satz richtig?"
                say: { de: "Lies den Satz. Ist er richtig?" }
                answer: false
                hints: ["„Look!“ heißt: Es passiert gerade jetzt. Passt dazu „plays“?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Look! He _ now.\nWelche Form passt in die Lücke?"
                say: "Lies den Satz. Welche Form passt in die Lücke?"
                options: ["is dancing", "dances", "dance"]
                answer: "is dancing"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "She _ the guitar on Fridays.\nWelche Form passt in die Lücke?"
                say: "Lies den Satz. Welche Form passt in die Lücke?"
                options: ["plays", "is playing", "play"]
                answer: "plays"
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Ergänze den Satz. Max liest gerade."
                say: "Ergänze den Satz. Max liest gerade."
                frame: "Max _ reading now."
                options: ["is", "reads", "are"]
                answer: ["is"]
              - id: l2-n4
                type: sorting
                text: "Jetzt oder immer wieder?"
                say: "Sortiere die Sätze: Passiert es gerade jetzt oder immer wieder?"
                option_audio: false
                bins:
                  - { id: now, show: { text: "gerade jetzt" }, say: "gerade jetzt" }
                  - { id: often, show: { text: "immer wieder" }, say: "immer wieder" }
                options:
                  - { text: "Look! She is swimming.", bin: now }
                  - { text: "We sing every Friday.", bin: often }
                  - { text: "He is painting now.", bin: now }
                  - { text: "Tom reads every evening.", bin: often }
              - id: l2-n5
                type: true_false
                text: "Look! He is riding his bike.\nIst der Satz richtig?"
                say: { de: "Lies den Satz. Ist er richtig?" }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: choose
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Sie schwimmt gerade“?"
            say: "Wie sagst du auf Englisch: Sie schwimmt gerade?"
            options: ["She swims now.", "She is swimming now.", "She swimming now."]
            answer: "She is swimming now."
            option_audio: false
          - id: l2-c2
            part: choose
            type: multiple_choice
            text: "He _ every Saturday.\nWelche Form passt in die Lücke?"
            say: "Lies den Satz. Welche Form passt in die Lücke?"
            options: ["is dancing", "dance", "dances"]
            answer: "dances"
            option_audio: false
          - id: l2-c3
            part: now
            type: true_false
            text: "He is painting now.\nPasst der Satz zum Bild?"
            say: { de: "Lies den Satz. Passt er zum Bild?" }
            show: { object: sing }
            answer: false
          - id: l2-c4
            part: routine
            type: true_false
            text: "She dance every day.\nIst der Satz richtig?"
            say: { de: "Lies den Satz. Ist er richtig?" }
            answer: false
          - id: l2-c5
            part: now
            type: audio_choice
            text: "Was macht das Kind gerade?"
            say: { de: "Hör zu. Was macht das Kind gerade?" }
            audio: { en: "Look! He is playing the guitar." }
            options: [{ object: play-guitar }, { object: play-football }, { object: sing }]
            answer: play-guitar
          - id: l2-c6
            part: now
            type: audio_choice
            text: "Was macht Tom gerade?"
            say: { de: "Hör zu. Was macht Tom gerade?" }
            audio: { turns: [{ en: "Where is Tom?", speaker: female }, { en: "He is in the garden. He is playing football.", speaker: male }] }
            options: [{ object: read }, { object: play-football }, { object: sing }]
            answer: play-football
          - id: l2-c7
            part: now
            type: fill_in_blank
            text: "Was macht das Mädchen gerade? Ergänze den Satz zum Bild."
            say: "Was macht das Mädchen gerade? Ergänze den Satz zum Bild."
            show: { object: read }
            frame: "She _ _ ."
            options: ["is", "reading", "reads", "are"]
            answer: ["is", "reading"]
            option_audio: false
          - id: l2-c8
            part: now
            type: ordering
            text: "Bau den Satz: Er schwimmt gerade."
            say: "Bau den Satz auf Englisch: Er schwimmt gerade."
            options: ["swimming", "now.", "He", "swims", "is"]
            slot_count: 4
            answer: ["He", "is", "swimming", "now."]
            option_audio: false
          - id: l2-c9
            part: now
            type: image_multiple_choice
            option_audio: false
            text: "Look! She is singing.\nWelches Bild passt?"
            say: "Lies den Satz. Welches Bild passt?"
            options: [{ object: dance }, { object: play-guitar }, { object: sing }]
            answer: sing
          - id: l2-c10
            part: routine
            type: fill_in_blank
            text: "Lena spielt jeden Freitag Tennis. Ergänze den Satz."
            say: "Lena spielt jeden Freitag Tennis. Ergänze den Satz."
            frame: "Lena _ tennis every Friday."
            options: ["plays", "play", "is playing"]
            answer: ["plays"]
            option_audio: false
          - id: l2-c11
            part: routine
            type: true_false
            text: "He reads every day.\nIst der Satz richtig?"
            say: "Lies den Satz. Ist er richtig?"
            answer: true
          - id: l2-c12
            part: routine
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Ich spiele jeden Samstag Fußball“?"
            say: "Wie sagst du auf Englisch: Ich spiele jeden Samstag Fußball?"
            options: ["I am playing football every Saturday.", "I play football every Saturday.", "I plays football every Saturday."]
            answer: "I play football every Saturday."
            option_audio: false
          - id: l2-c13
