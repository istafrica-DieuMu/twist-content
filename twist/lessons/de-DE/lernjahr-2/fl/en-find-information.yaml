# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-find-information
skill: fl.reading.find-information
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Informationen finden
  en: Finding information
summary: >
  Finding one piece of information in an everyday English text without
  reading every word: a café menu, a school timetable, a party invitation,
  a poster for a school fun day. Lesson 1 reads menus and timetables, drawn
  as tables, and finds a price, a day or a lesson by row and column; lesson
  2 reads invitations and posters and finds when, where and what to bring,
  and ends with the skill check. The voice asks in German and does not
  read the English text.
metadata:
  year: lernjahr-2
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.reading.short-texts]
  also_practises: [fl.themes.food, fl.themes.school, fl.themes.time, fl.themes.calendar]
  vocabulary: { en: [menu, price, pizza, sandwich, ice cream, juice, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Maths, English, Art, PE, Music, party, when, where, bring, from, tickets] }
  forms: [drawn, text, audio]
  drawn: [table]
  facets: []
  parts:
    - { id: price, what: { de: einen Preis auf einer Speisekarte finden, en: finding a price on a menu } }
    - { id: timetable, what: { de: Tag und Uhrzeit in einem Stundenplan oder Fahrplan finden, en: finding a day and time in a timetable } }
    - { id: when, what: { de: Tag und Uhrzeit in einer Einladung oder auf einem Plakat finden, en: finding the day and time on an invitation or poster } }
    - { id: where-what, what: { de: "in einer Einladung oder auf einem Plakat finden, wo etwas ist, wer einlädt und was es gibt", en: "finding where, who and what on an invitation or poster" } }
  misconceptions:
    - id: read-everything
      what: Reads the whole text from the top instead of looking for the one thing the question asks for
      addressed: lesson 1 Learn says to think first what you are looking for, then look only for that; the full-stage hints name the word to look for
    - id: wrong-row
      what: Reads the right column but slips to the row above or below in a table
      addressed: lesson 1 Learn follows the row with a finger and marks the cell; l1-f2 and l1-s2 give feedback on the neighbouring row
    - id: date-time
      what: Mixes up the day or date with the time on an invitation or poster
      addressed: lesson 2 Learn separates When (day and time) from Where; l2-f2 gives feedback when the day is picked for the time
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Speisekarten und Stundenpläne, en: Menus and timetables }
    goal:
      de: "Such auf der Speisekarte oder im Stundenplan nur das, was du wissen willst, zum Beispiel einen Preis."
      en: "Find just what you want to know on a menu or a timetable, like a price."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            option_audio: false
            text: "Name: Kai\nAge: 9\nPet: a fish\n\nWelches Haustier hat Kai?"
            say: { de: "Lies den Steckbrief. Welches Haustier hat Kai?" }
            options: ["einen Fisch", "eine Katze", "einen Hund"]
            answer: "einen Fisch"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "Dear Ava,\nI'm at the seaside.\nLove, Rosie\n\nWer schreibt?"
            say: { de: "Lies die Postkarte. Wer schreibt?" }
            options: ["Rosie", "Ava"]
            answer: "Rosie"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was kostet das Sandwich?"
            show: { drawn: table, rows: [["Café Menu", "Price"], ["pizza", "£3"], ["sandwich", "£2"], ["ice cream", "£1"]] }
            say: { de: "Das ist eine Speisekarte aus einem Café. Du musst nicht alles lesen. Überleg zuerst: Was suche ich? Hier den Preis für „sandwich“." }
          - text: "sandwich → £2"
            show: { drawn: table, rows: [["Café Menu", "Price"], ["pizza", "£3"], ["sandwich", "£2"], ["ice cream", "£1"]], mark: [[2, 0], [2, 1]] }
            say: { de: "Such „sandwich“ in der linken Spalte. Fahr mit dem Finger in derselben Zeile nach rechts. Da steht der Preis: zwei Pfund." }
          - text: "Was hat die Klasse am Dienstag um 10 Uhr?"
            show: { drawn: table, rows: [["", "Monday", "Tuesday"], ["9:00", "Maths", "English"], ["10:00", "Art", "Music"]], mark: [[2, 2]] }
            say: { de: "Ein Stundenplan funktioniert genauso. Oben stehen die Tage, links die Uhrzeiten. „Tuesday“ ist Dienstag. Wo sich die Spalte und die Zeile mit zehn Uhr treffen, steht „Music“, also Musik." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                option_audio: false
                text: "Was kostet die Pizza?"
                show: { drawn: table, rows: [["Café Menu", "Price"], ["pizza", "£4"], ["sandwich", "£2"], ["orange juice", "£1"]] }
                say: { de: "Lies die Speisekarte. Was kostet die Pizza?" }
                options: ["£4", "£2", "£1"]
                answer: "£4"
                hints:
                  - "Such zuerst das Wort „pizza“."
                  - "Fahr in der Zeile von „pizza“ nach rechts."
                  - "Neben „pizza“ steht £4."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Was hat die Klasse am Montag um 10 Uhr?"
                show: { drawn: table, rows: [["", "Monday", "Tuesday"], ["9:00", "English", "Maths"], ["10:00", "PE", "Art"], ["11:00", "Music", "English"]] }
                say: { de: "Lies den Stundenplan. Was hat die Klasse am Montag um zehn Uhr?" }
                options: ["PE", "English", "Music"]
                answer: "PE"
                feedback:
                  "English": "„English“ ist um neun Uhr, eine Zeile zu hoch. Such die Zeile mit 10:00."
                  "Music": "„Music“ ist um elf Uhr, eine Zeile zu tief. Such die Zeile mit 10:00."
                hints:
                  - "„Monday“ ist Montag. Such die Spalte."
                  - "Such dann links die Zeile mit 10:00."
                  - "Montag um zehn: PE, also Sport."
              - id: l1-f3
                type: true_false
                text: "Kostet ein Eis £1?"
                show: { drawn: table, rows: [["Café Menu", "Price"], ["pizza", "£4"], ["ice cream", "£1"], ["milk", "£1"]] }
                say: { de: "Lies die Speisekarte. Kostet ein Eis ein Pfund?" }
                answer: true
                hints:
                  - "„Ice cream“ heißt Eis."
                  - "Such die Zeile mit „ice cream“."
                  - "Ja, daneben steht £1."
              - id: l1-f4
                type: multiple_choice
                option_audio: false
                text: "An welchem Tag hat die Klasse Kunst?"
                show: { drawn: table, rows: [["", "Wednesday", "Thursday", "Friday"], ["9:00", "Maths", "English", "Maths"], ["10:00", "Music", "Art", "PE"]] }
                say: { de: "Lies den Stundenplan. An welchem Tag hat die Klasse Kunst?" }
                options: ["Thursday", "Wednesday", "Friday"]
                answer: "Thursday"
                hints:
                  - "„Art“ heißt Kunst. Such das Wort im Stundenplan."
                  - "Fahr von „Art“ nach oben zum Tag."
                  - "Über „Art“ steht „Thursday“, Donnerstag."
              - id: l1-f5
                type: multiple_choice
                option_audio: false
                text: "Was ist am billigsten?"
                show: { drawn: table, rows: [["Café Menu", "Price"], ["pizza", "£4"], ["sandwich", "£3"], ["apple", "50p"]] }
                say: { de: "Lies die Speisekarte. Was ist am billigsten?" }
                options: ["apple", "sandwich", "pizza"]
                answer: "apple"
                hints:
                  - "Schau nur auf die Preise."
                  - "50p sind 50 Pence, weniger als ein Pfund."
                  - "Der Apfel kostet 50p. Er ist am billigsten."
              - id: l1-f6
                type: multiple_choice
                option_audio: false
                text: "Wann fährt der Bus nach Oxford?"
                show: { drawn: table, rows: [["Bus to", "Time"], ["London", "8:15"], ["Oxford", "9:30"], ["Bath", "10:45"]] }
                say: { de: "Lies den Busfahrplan. Wann fährt der Bus nach Oxford?" }
                options: ["9:30", "8:15", "10:45"]
                answer: "9:30"
                hints:
                  - "Such zuerst „Oxford“."
                  - "Fahr in der Zeile nach rechts zur Uhrzeit."
                  - "Neben „Oxford“ steht 9:30."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                option_audio: false
                text: "Was kostet der Saft?"
                show: { drawn: table, rows: [["Snack Bar", "Price"], ["cake", "£2"], ["juice", "£1"], ["water", "50p"]] }
                say: { de: "Lies die Speisekarte. Was kostet der Saft?" }
                options: ["£1", "£2", "50p"]
                answer: "£1"
                hints: ["„Juice“ heißt Saft."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Was hat die Klasse am Dienstag um 11 Uhr?"
                show: { drawn: table, rows: [["", "Monday", "Tuesday"], ["10:00", "Art", "Maths"], ["11:00", "English", "Music"], ["12:00", "PE", "Art"]] }
                say: { de: "Lies den Stundenplan. Was hat die Klasse am Dienstag um elf Uhr?" }
                options: ["Music", "Maths", "English"]
                answer: "Music"
                feedback:
                  "Maths": "„Maths“ ist um zehn, eine Zeile zu hoch."
                  "English": "„English“ ist am Montag. Such die Spalte „Tuesday“."
                hints: ["Spalte „Tuesday“, Zeile 11:00."]
              - id: l1-s3
                type: true_false
                text: "Fährt der Bus nach Bath um 8:15?"
                show: { drawn: table, rows: [["Bus to", "Time"], ["London", "8:15"], ["Oxford", "9:30"], ["Bath", "10:45"]] }
                say: { de: "Lies den Busfahrplan. Fährt der Bus nach Bath um acht Uhr fünfzehn?" }
                answer: false
                hints: ["Such die Zeile mit „Bath“."]
              - id: l1-s4
                type: multiple_choice
                option_audio: false
                text: "Was gibt es für £3?"
                show: { drawn: table, rows: [["Café Menu", "Price"], ["pizza", "£5"], ["pancakes", "£3"], ["ice cream", "£2"]] }
                say: { de: "Lies die Speisekarte. Was bekommst du für drei Pfund?" }
                options: ["pancakes", "pizza", "ice cream"]
                answer: "pancakes"
                hints: ["Such diesmal zuerst den Preis, dann fahr nach links."]
              - id: l1-s5
                type: multiple_choice
                option_audio: false
                text: "Wann hat die Klasse Sport?"
                show: { drawn: table, rows: [["", "Wednesday", "Thursday"], ["9:00", "English", "PE"], ["10:00", "Maths", "Art"]] }
                say: { de: "Lies den Stundenplan. Wann hat die Klasse Sport?" }
                options: ["Thursday, 9:00", "Wednesday, 9:00", "Thursday, 10:00"]
                answer: "Thursday, 9:00"
                hints: ["Sport heißt „PE“. Such es, dann lies Tag und Uhrzeit."]
              - id: l1-s6
                type: multiple_choice
                option_audio: false
                text: "Wohin fährt der Bus um 10:45?"
                show: { drawn: table, rows: [["Bus to", "Time"], ["Bristol", "9:00"], ["York", "10:45"], ["Leeds", "12:15"]] }
                say: { de: "Lies den Busfahrplan. Wohin fährt der Bus um zehn Uhr fünfundvierzig?" }
                options: ["York", "Bristol", "Leeds"]
                answer: "York"
                hints: ["Such die Uhrzeit, dann fahr nach links."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                option_audio: false
                text: "Was kostet das Sandwich?"
                show: { drawn: table, rows: [["Snack Bar", "Price"], ["sandwich", "£3"], ["apple", "50p"], ["milk", "£1"]] }
                say: { de: "Lies die Speisekarte. Was kostet das Sandwich?" }
                options: ["£3", "£1", "50p"]
                answer: "£3"
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Was hat die Klasse am Freitag um 9 Uhr?"
                show: { drawn: table, rows: [["", "Thursday", "Friday"], ["9:00", "Maths", "Music"], ["10:00", "English", "Art"]] }
                say: { de: "Lies den Stundenplan. Was hat die Klasse am Freitag um neun Uhr?" }
                options: ["Music", "Maths", "Art"]
                answer: "Music"
              - id: l1-n3
                type: true_false
                text: "Kostet die Pizza mehr als der Kuchen?"
                show: { drawn: table, rows: [["Café Menu", "Price"], ["pizza", "£4"], ["cake", "£2"], ["juice", "£1"]] }
                say: { de: "Lies die Speisekarte. Kostet die Pizza mehr als der Kuchen?" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                option_audio: false
                text: "Wann fährt der Bus nach London?"
                show: { drawn: table, rows: [["Bus to", "Time"], ["Oxford", "7:45"], ["London", "11:30"], ["Bath", "14:00"]] }
                say: { de: "Lies den Busfahrplan. Wann fährt der Bus nach London?" }
                options: ["11:30", "7:45", "14:00"]
                answer: "11:30"
              - id: l1-n5
                type: multiple_choice
                option_audio: false
                text: "An welchem Tag hat die Klasse Musik?"
                show: { drawn: table, rows: [["", "Monday", "Tuesday", "Wednesday"], ["9:00", "Art", "English", "Music"], ["10:00", "Maths", "PE", "English"]] }
                say: { de: "Lies den Stundenplan. An welchem Tag hat die Klasse Musik?" }
                options: ["Wednesday", "Monday", "Tuesday"]
                answer: "Wednesday"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            option_audio: false
            text: "Was kostet das Wasser?"
            show: { drawn: table, rows: [["Snack Bar", "Price"], ["cake", "£2"], ["water", "£1"], ["banana", "50p"]] }
            say: { de: "Lies die Speisekarte. Was kostet das Wasser?" }
            options: ["£1", "£2", "50p"]
            answer: "£1"
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Was hat die Klasse am Montag um 9 Uhr?"
            show: { drawn: table, rows: [["", "Monday", "Tuesday"], ["9:00", "Maths", "Art"], ["10:00", "Music", "PE"]] }
            say: { de: "Lies den Stundenplan. Was hat die Klasse am Montag um neun Uhr?" }
            options: ["Maths", "Art", "Music"]
            answer: "Maths"
          - id: l1-c3
            type: true_false
            text: "Fährt der Bus nach York um 9:00?"
            show: { drawn: table, rows: [["Bus to", "Time"], ["York", "9:00"], ["Leeds", "10:30"]] }
            say: { de: "Lies den Busfahrplan. Fährt der Bus nach York um neun Uhr?" }
            answer: true
          - id: l1-c4
            type: multiple_choice
            option_audio: false
            text: "Was kostet die Milch?"
            show: { drawn: table, rows: [["Café Menu", "Price"], ["pizza", "£4"], ["milk", "£1"], ["pancakes", "£3"]] }
            say: { de: "Lies die Speisekarte. Was kostet die Milch?" }
            options: ["£1", "£4", "£3"]
            answer: "£1"
          - id: l1-c5
            type: multiple_choice
            option_audio: false
            text: "Wann hat die Klasse Kunst?"
            show: { drawn: table, rows: [["", "Monday", "Tuesday"], ["9:00", "PE", "Music"], ["10:00", "English", "Art"]] }
            say: { de: "Lies den Stundenplan. Wann hat die Klasse Kunst?" }
            options: ["Tuesday, 10:00", "Monday, 10:00", "Tuesday, 9:00"]
            answer: "Tuesday, 10:00"
          - id: l1-c6
            type: true_false
            text: "Fährt der Bus nach Bath um 12:30?"
            show: { drawn: table, rows: [["Bus to", "Time"], ["Oxford", "12:30"], ["Bath", "13:15"]] }
            say: { de: "Lies den Busfahrplan. Fährt der Bus nach Bath um zwölf Uhr dreißig?" }
            answer: false

  - n: 2
    title: { de: Einladungen und Plakate, en: Invitations and posters }
    goal:
      de: "Lies Einladungen und Plakate und finde, wann und wo etwas ist und was du mitbringen sollst."
      en: "Read invitations and posters and find when and where something is and what to bring."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            option_audio: false
            text: "Was kostet die Pizza?"
            show: { drawn: table, rows: [["Café Menu", "Price"], ["pizza", "£5"], ["juice", "£1"]] }
            say: { de: "Lies die Speisekarte. Was kostet die Pizza?" }
            options: ["£5", "£1"]
            answer: "£5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "Was hat die Klasse am Dienstag um 9 Uhr?"
            show: { drawn: table, rows: [["", "Monday", "Tuesday"], ["9:00", "English", "PE"]] }
            say: { de: "Lies den Stundenplan. Was hat die Klasse am Dienstag um neun Uhr?" }
            options: ["PE", "English"]
            answer: "PE"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Come to my party!\nWhen: Saturday, 3 o'clock\nWhere: 12 Park Road\nBring: your swimming things\nFrom: Lucy"
            say: { de: "Das ist eine Einladung. Sie hat Stichwörter wie ein Steckbrief. „When“ heißt wann, „Where“ heißt wo, „Bring“ heißt mitbringen." }
          - text: "When: Saturday, 3 o'clock\n= Samstag, um 3 Uhr nachmittags"
            say: { de: "Bei „When“ stehen zwei Dinge: der Tag, „Saturday“, und die Uhrzeit, „3 o'clock“. Pass auf: Wenn jemand fragt, um wie viel Uhr, suchst du die Zahl mit „o'clock“, nicht den Tag." }
          - text: "SCHOOL FUN DAY\nFriday 14th June\n10 o'clock to 2 o'clock\nGames, music and cakes!\nTickets: £1"
            say: { de: "Das ist ein Plakat für ein Schulfest. Oben steht, worum es geht. Darunter stehen Tag, Uhrzeit und was es gibt. Auch hier suchst du nur das, was du wissen willst." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "Come to my party!\nWhen: Sunday, 2 o'clock\nWhere: 5 Mill Lane\nBring: a ball\nFrom: Jake\n\nWo ist die Party?"
                say: { de: "Lies die Einladung. Wo ist die Party?" }
                options: ["5 Mill Lane", "Sunday", "a ball"]
                answer: "5 Mill Lane"
                hints:
                  - "„Where“ heißt wo."
                  - "Such die Zeile mit „Where“."
                  - "Where: 5 Mill Lane."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                option_audio: false
                text: "Come to my party!\nWhen: Sunday, 2 o'clock\nWhere: 5 Mill Lane\nBring: a ball\nFrom: Jake\n\nUm wie viel Uhr ist die Party?"
                say: { de: "Lies die Einladung noch einmal. Um wie viel Uhr ist die Party?" }
                options: ["um 2 Uhr", "am Sonntag", "um 5 Uhr"]
                answer: "um 2 Uhr"
                feedback:
                  "am Sonntag": "Sonntag ist der Tag. Gefragt ist die Uhrzeit: Such „o'clock“."
                  "um 5 Uhr": "Die 5 gehört zur Adresse bei „Where“. Die Uhrzeit steht bei „When“."
                hints:
                  - "Die Uhrzeit steht bei „When“."
                  - "Such die Zahl vor „o'clock“."
                  - "2 o'clock. Die Party ist um zwei Uhr."
              - id: l2-f3
                type: image_multiple_choice
                option_audio: false
                text: "Come to my party!\nWhen: Sunday, 2 o'clock\nWhere: 5 Mill Lane\nBring: a ball\nFrom: Jake\n\nWas sollst du mitbringen?"
                say: { de: "Lies die Einladung noch einmal. Was sollst du mitbringen?" }
                options: [{ object: ball }, { object: cake }, { object: book }]
                answer: ball
                hints:
                  - "„Bring“ heißt mitbringen."
                  - "Such die Zeile mit „Bring“."
                  - "Bring: a ball. Du bringst einen Ball mit."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "SCHOOL FUN DAY\nFriday 14th June\n10 o'clock to 2 o'clock\nGames, music and cakes!\nTickets: £1\n\nAn welchem Tag ist das Schulfest?"
                say: { de: "Lies das Plakat. An welchem Tag ist das Schulfest?" }
                options: ["am Freitag", "am Samstag", "am Montag"]
                answer: "am Freitag"
                hints:
                  - "Der Tag steht unter der Überschrift."
                  - "Dort steht: „Friday 14th June“."
                  - "„Friday“ heißt Freitag."
              - id: l2-f5
                type: true_false
                text: "SCHOOL FUN DAY\nFriday 14th June\n10 o'clock to 2 o'clock\nGames, music and cakes!\nTickets: £1\n\nKostet eine Karte ein Pfund?"
                say: { de: "Lies das Plakat noch einmal. Kostet eine Karte ein Pfund?" }
                answer: true
                hints:
                  - "„Tickets“ heißt Karten."
                  - "Such die Zeile mit „Tickets“."
                  - "Tickets: £1. Ja, ein Pfund."
              - id: l2-f6
                type: multiple_choice
                option_audio: false
                text: "Come to my party!\nWhen: Sunday, 2 o'clock\nWhere: 5 Mill Lane\nBring: a ball\nFrom: Jake\n\nWer lädt ein?"
                say: { de: "Lies die Einladung noch einmal. Wer lädt ein?" }
                options: ["Jake", "Mill", "Sunday"]
                answer: "Jake"
                hints:
                  - "Such die letzte Zeile."
                  - "„From“ heißt von."
                  - "From: Jake. Jake lädt ein."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Pyjama Party!\nWhen: Friday, 6 o'clock\nWhere: Emma's house\nBring: your pyjamas and a teddy\n\nAn welchem Tag ist die Party?"
                say: { de: "Lies die Einladung. An welchem Tag ist die Party?" }
                options: ["am Freitag", "um 6 Uhr", "am Samstag"]
                answer: "am Freitag"
                feedback:
                  "um 6 Uhr": "Das ist die Uhrzeit. Gefragt ist der Tag."
                hints: ["Der Tag steht bei „When“."]
              - id: l2-s2
                type: multiple_choice
                option_audio: false
                text: "Pyjama Party!\nWhen: Friday, 6 o'clock\nWhere: Emma's house\nBring: your pyjamas and a teddy\n\nWo ist die Party?"
                say: { de: "Lies die Einladung noch einmal. Wo ist die Party?" }
                options: ["bei Emma zu Hause", "in der Schule", "im Park"]
                answer: "bei Emma zu Hause"
                hints: ["Such „Where“."]
              - id: l2-s3
                type: multiple_choice
                option_audio: false
                text: "SUMMER CONCERT\nWednesday 2nd July\n6 o'clock\nin the school hall\nSongs by Class 4!\n\nWo ist das Konzert?"
                say: { de: "Lies das Plakat. Wo ist das Konzert?" }
                options: ["in der Aula", "im Park", "in Klasse 4"]
                answer: "in der Aula"
                feedback:
                  "in Klasse 4": "Klasse 4 singt die Lieder. Der Ort steht in der Zeile mit „in the ...“."
                hints: ["„School hall“ ist die Aula der Schule."]
              - id: l2-s4
