# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-present
skill: fl.speaking.present
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Etwas kurz vorstellen
  en: Giving a short presentation
summary: >
  Giving a short prepared talk in English: my pet, my favourite animal, my
  hobby, a show-and-tell object. Lesson 1 listens to children presenting
  their pets and learns the three parts of a talk (a start, three or four
  facts, an end), then presents a pet or a favourite animal; lesson 2
  presents a hobby or a favourite thing, with This is my ... and I like it
  because ..., and ends with the skill check. Speaking tasks are practice
  only; the skill check asks for the parts of a talk by listening,
  choosing and ordering.
metadata:
  year: lernjahr-2
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.about-me]
  also_practises: [fl.speaking.describe, fl.grammar.he-she-it, fl.themes.hobbies, fl.themes.outside-animals]
  vocabulary: { en: ["Hello, everyone!", "Today I want to tell you about ...", "This is my ...", "He's / She's ...", "He likes ...", "I like it because ...", "Thank you for listening!", pet, favourite, hobby, every day] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: listen, what: { de: einen kurzen Vortrag verstehen, en: understanding a short talk } }
    - { id: structure, what: { de: "einen Vortrag aufbauen: Anfang, Mitte, Ende", en: "building a talk: start, middle, end" } }
    - { id: pronoun, what: { de: "he, she oder it für ein Tier wählen", en: "choosing he, she or it for an animal" } }
    - { id: because, what: { de: "mit because sagen, warum man etwas mag", en: saying why you like something with because } }
  misconceptions:
    - id: no-start-end
      what: Starts straight with a fact and stops without an end, so the listeners do not know when the talk begins and ends
      addressed: lesson 1 Learn names the three parts (start, facts, end); l1-f3, l1-s5 and l2-n2 order a whole talk; l1-f2 and l1-s2 ask for a good start and end, and the skill check orders a whole talk (l2-c3)
    - id: he-she-pet
      what: Mixes he and she for a named pet, or says it after giving the pet a name
      addressed: lesson 1 Learn says a pet with a name is he or she; l1-f4 and l1-s3 give feedback on the wrong pronoun
    - id: because-order
      what: Leaves out because or puts the reason first in German order (I like it, because it fun is)
      addressed: lesson 2 Learn models I like it because it's fun; l2-f4 builds the because sentence from cards
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Mein Haustier, en: My pet }
    goal:
      de: "Stell ein Haustier in einem kurzen Vortrag vor, mit Anfang, Mitte und Ende."
      en: "Present a pet in a short talk with a start, a middle and an end."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Was macht Noah gern?"
            say: { de: "Hör zu. Was macht Noah gern?" }
            audio: { en: "I'm Noah. I like reading and I like singing.", speaker: male }
            options: ["lesen und singen", "lesen und malen", "tanzen und singen"]
            answer: "lesen und singen"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            option_audio: false
            text: "Ich mag Katzen. Ich mag auch Hunde.\nI like cats. I like dogs, ___ .\nWelches Wort passt?"
            say: { de: "Welches Wort passt? Ich mag Katzen. Ich mag auch Hunde." }
            options: ["too", "but"]
            answer: "too"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - say: { de: "Hör zu. Jakob stellt seiner Klasse sein Haustier vor.", en: "Hello, everyone! Today I want to tell you about my pet. This is Bruno. He's my dog. He's brown and he's got big ears. He likes playing with his ball. Thank you for listening!" }
            show: { objects: [dog, ball] }
          - text: "1. Anfang: Hello, everyone! Today I want to tell you about my pet.\n2. Was du erzählst: This is Bruno. He's brown. He likes ...\n3. Ende: Thank you for listening!"
            say: { de: "Ein kurzer Vortrag hat drei Teile. Am Anfang sagst du, worüber du sprichst. In der Mitte erzählst du drei oder vier Dinge. Am Ende bedankst du dich fürs Zuhören. So wissen alle, wann du anfängst und wann du fertig bist." }
          - text: "Bruno → he\nLuna → she\nthe giraffe → it"
            say: { de: "Hat dein Tier einen Namen, sagst du „he“ für ein Männchen und „she“ für ein Weibchen. Bruno ist ein Männchen: „He's brown.“ Luna ist ein Weibchen: „She's small.“ Ein Tier ohne Namen, wie die Giraffe, ist „it“.", en: "He's brown. She's small. It's tall." }
            show: { objects: [dog, cat] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Hör dir Lilys Vortrag an. Welches Haustier hat sie?"
                say: { de: "Hör dir Lilys Vortrag an. Welches Haustier hat sie?" }
                audio: { en: "Hello, everyone! Today I want to tell you about my pet. This is Luna. She's my rabbit. She's white and she's got long ears. She likes carrots. Thank you for listening!", speaker: female }
                options: [{ object: rabbit }, { object: cat }, { object: mouse }]
                answer: rabbit
                hints:
                  - "Hör auf „She's my ...“."
                  - "Lange Ohren und Karotten: Welches Tier ist das?"
                  - "„Rabbit“ heißt Kaninchen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Wie fängst du deinen Vortrag an?"
                say: { de: "Du willst deiner Klasse dein Haustier vorstellen. Welcher Satz ist ein guter Anfang?" }
                options: ["Hello, everyone! Today I want to tell you about my pet.", "Thank you for listening!", "He likes his ball."]
                answer: "Hello, everyone! Today I want to tell you about my pet."
                feedback:
                  "Thank you for listening!": "Damit hörst du auf. Am Anfang sagst du, worüber du sprichst."
                  "He likes his ball.": "Das gehört in die Mitte. Am Anfang begrüßt du alle und sagst dein Thema."
                hints:
                  - "Am Anfang begrüßt du die Klasse."
                  - "Dann sagst du, worüber du sprichst."
                  - "Hello, everyone! Today I want to tell you about my pet."
              - id: l1-f3
                type: ordering
                option_audio: false
                text: "Bring die Sätze in die richtige Reihenfolge."
                say: { de: "Bau Jakobs Vortrag. Was kommt zuerst?" }
                options: ["Thank you for listening!", "This is Bruno. He's my dog.", "Hello, everyone!"]
                slot_count: 3
                answer: ["Hello, everyone!", "This is Bruno. He's my dog.", "Thank you for listening!"]
                hints:
                  - "Zuerst begrüßt du alle."
                  - "Am Ende bedankst du dich."
                  - "Hello, everyone! This is Bruno. He's my dog. Thank you for listening!"
              - id: l1-f4
                type: fill_in_blank
                option_audio: false
                text: "This is Max. He's my hamster. _ is very small."
                say: { de: "Der Hamster Max ist ein Männchen. Welches Wort passt?" }
                frame: "_ is very small."
                options: ["He", "She", "I"]
                answer: ["He"]
                feedback:
                  "She": "„She“ sagst du für ein Weibchen. Max ist ein Männchen."
                hints:
                  - "Max ist ein Männchen."
                  - "Für ein Männchen sagst du „he“."
                  - "He is very small."
              - id: l1-f5
                type: speak
                text: "Fang deinen Vortrag an."
                say: { de: "Fang deinen Vortrag an. Zum Beispiel so:", en: "Hello, everyone! Today I want to tell you about my pet." }
                expected_text: "Hello, everyone! Today I want to tell you about my pet."
                hints:
                  - "Begrüße zuerst alle: „Hello, everyone!“"
                  - "Dann: „Today I want to tell you about my pet.“"
                  - "Sag mit mir: Hello, everyone! Today I want to tell you about my pet."
              - id: l1-f6
                type: speak
                text: "Erzähl zwei Dinge über das Tier."
                say: { de: "Erzähl zwei Dinge über das Tier. Zum Beispiel so:", en: "This is Luna. She's my cat. She's black and white." }
                show: { object: cat }
                expected_text: "This is Luna. She's my cat. She's black and white."
                hints:
                  - "Fang mit „This is“ und dem Namen an."
                  - "Dann: „She's my cat.“ und wie sie aussieht."
                  - "Sag mit mir: This is Luna. She's my cat. She's black and white."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Hör dir Toms Vortrag an. Was mag sein Hund?"
                say: { de: "Hör dir Toms Vortrag an. Was mag sein Hund?" }
                audio: { en: "Hello, everyone! This is my dog, Rocky. He's big and black. He likes swimming in the lake. Thank you for listening!", speaker: male }
                options: [{ object: swim }, { object: ball }, { object: sing }]
                answer: swim
                hints: ["Hör auf „He likes“."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Wie hörst du mit deinem Vortrag auf?"
                say: { de: "Dein Vortrag ist fertig. Welcher Satz ist ein gutes Ende?" }
                options: ["Thank you for listening!", "Hello, everyone!", "This is my cat."]
                answer: "Thank you for listening!"
                hints: ["Am Ende bedankst du dich fürs Zuhören."]
              - id: l1-s3
                type: fill_in_blank
                option_audio: false
                text: "This is Bella. She's my fish. _ is orange."
                say: { de: "Der Fisch Bella ist ein Weibchen. Welches Wort passt?" }
                frame: "_ is orange."
                options: ["She", "He", "I"]
                answer: ["She"]
                feedback:
                  "He": "„He“ sagst du für ein Männchen. Bella ist ein Weibchen."
                hints: ["Für ein Weibchen sagst du „she“."]
              - id: l1-s4
                type: speak
                text: "Erzähl, was dein Tier gern macht."
                say: { de: "Erzähl, was dein Tier gern macht. Zum Beispiel so:", en: "He likes playing with his ball." }
                show: { objects: [dog, ball] }
                expected_text: "He likes playing with his ball."
                hints: ["Fang mit „He likes“ an."]
              - id: l1-s5
                type: ordering
                option_audio: false
                text: "Bring die Sätze in die richtige Reihenfolge."
                say: { de: "Bau Mias Vortrag über ihr Lieblingstier. Was kommt zuerst?" }
                options: ["It's got a long neck.", "Thank you for listening!", "My favourite animal is the giraffe.", "Hello, everyone!"]
                slot_count: 4
                answer: ["Hello, everyone!", "My favourite animal is the giraffe.", "It's got a long neck.", "Thank you for listening!"]
                hints: ["Anfang, Thema, was du erzählst, Ende."]
              - id: l1-s6
                type: speak
                text: "Beende deinen Vortrag."
                say: { de: "Beende deinen Vortrag. Zum Beispiel so:", en: "Thank you for listening!" }
                expected_text: "Thank you for listening!"
                hints: ["Sag mit mir: Thank you for listening!"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Hör dir Ellas Vortrag an. Wie heißt ihre Katze?"
                say: { de: "Hör dir Ellas Vortrag an. Wie heißt ihre Katze?" }
                audio: { en: "Hello, everyone! Today I want to tell you about my cat. Her name is Daisy. She's grey and she likes sleeping. Thank you for listening!", speaker: female }
                options: ["Daisy", "Ella", "Luna"]
                answer: "Daisy"
              - id: l1-n2
                type: fill_in_blank
                option_audio: false
                text: "This is Rex. He's my tortoise. _ likes salad."
                say: { de: "Die Schildkröte Rex ist ein Männchen. Welches Wort passt?" }
                frame: "_ likes salad."
                options: ["He", "She", "It"]
                answer: ["He"]
              - id: l1-n3
                type: speak
                text: "Stell dein Lieblingstier vor."
                say: { de: "Stell dein Lieblingstier vor. Zum Beispiel so:", en: "My favourite animal is the elephant. It's big and grey." }
                show: { object: elephant }
                expected_text: "My favourite animal is the elephant. It's big and grey."
              - id: l1-n4
                type: audio_choice
                text: "Hör dir Leos Vortrag an. Was ist sein Lieblingstier?"
                say: { de: "Hör dir Leos Vortrag an. Was ist sein Lieblingstier?" }
                audio: { en: "Hello, everyone! My favourite animal is the lion. It's big and strong. It lives in Africa. Thank you for listening!", speaker: male }
                options: [{ object: lion }, { object: elephant }, { object: monkey }]
                answer: lion
              - id: l1-n5
                type: speak
                text: "Halte einen kleinen Vortrag über ein Haustier."
                say: { de: "Halte einen kleinen Vortrag über ein Haustier. Zum Beispiel so:", en: "Hello, everyone! This is Coco. She's my rabbit. She likes carrots. Thank you for listening!" }
                show: { objects: [rabbit, carrot] }
                expected_text: "Hello, everyone! This is Coco. She's my rabbit. She likes carrots. Thank you for listening!"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Hör dir Bens Vortrag an. Welches Haustier hat er?"
            say: { de: "Hör dir Bens Vortrag an. Welches Haustier hat er?" }
            audio: { en: "Hello, everyone! This is Pip. He's my bird. He's yellow and he can sing. Thank you for listening!", speaker: male }
            options: [{ object: bird }, { object: fish }, { object: cat }]
            answer: bird
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Welcher Satz ist ein guter Anfang?"
            say: { de: "Welcher Satz ist ein guter Anfang für deinen Vortrag?" }
            options: ["Hello, everyone! Today I want to tell you about my pet.", "Thank you for listening!", "She likes carrots."]
            answer: "Hello, everyone! Today I want to tell you about my pet."
          - id: l1-c3
            type: fill_in_blank
            option_audio: false
            text: "This is Rosie. She's my cat. _ is black."
            say: { de: "Die Katze Rosie ist ein Weibchen. Welches Wort passt?" }
            frame: "_ is black."
            options: ["She", "He"]
            answer: ["She"]
          - id: l1-c4
            type: audio_choice
            text: "Hör dir Pauls Vortrag an. Was mag sein Hase?"
            say: { de: "Hör dir Pauls Vortrag an. Was mag sein Hase?" }
            audio: { en: "Hello, everyone! This is Hoppy. He's my rabbit. He likes carrots. Thank you for listening!", speaker: male }
            options: [{ object: apple }, { object: carrot }, { object: cheese }]
            answer: carrot
          - id: l1-c5
            type: multiple_choice
            option_audio: false
            text: "Was sagst du nach „Hello, everyone!“?"
            say: { de: "Dein Vortrag fängt mit Hello, everyone! an. Was sagst du danach?" }
            options: ["Thank you for listening!", "Today I want to tell you about my pet.", "Goodbye!"]
            answer: "Today I want to tell you about my pet."
          - id: l1-c6
            type: fill_in_blank
            option_audio: false
            text: "My favourite animal is the crocodile. _ is green."
            say: { de: "Das Krokodil hat keinen Namen. Welches Wort passt?" }
            frame: "_ is green."
            options: ["It", "She", "I"]
            answer: ["It"]

  - n: 2
    title: { de: "Mein Hobby, mein Lieblingsding", en: "My hobby, my favourite thing" }
    goal:
      de: "Erzähl in einem kurzen Vortrag von deinem Hobby und sag, warum du es magst, so wie because it's fun."
      en: "Give a short talk about your hobby and say why you like it, like because it's fun."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            option_audio: false
            text: "Welcher Satz ist ein gutes Ende?"
            say: { de: "Welcher Satz ist ein gutes Ende für deinen Vortrag?" }
            options: ["Thank you for listening!", "Hello, everyone!"]
            answer: "Thank you for listening!"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Welches Tier ist es?"
            say: { de: "Hör zu. Welches Tier ist es?" }
            audio: { en: "This is Goldie. She's my fish. She's orange.", speaker: female }
            options: [{ object: fish }, { object: bird }]
            answer: fish
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - say: { de: "Hör zu. Sofia stellt ihr Hobby vor.", en: "Hello, everyone! Today I want to tell you about my hobby. My hobby is dancing. I dance every Monday and Thursday. I like it because it's fun. Thank you for listening!" }
            show: { object: dance }
            text: "My hobby is dancing.\nI dance every Monday and Thursday.\nI like it because it's fun."
          - text: "I like it because it's fun.\nI like it because it's exciting.\nI like it because I can play with my friends."
            say: { de: "Mit „because“ sagst du, warum du etwas magst. „Because“ heißt weil. Danach kommt ein ganz normaler Satz: „it's fun“, „it's exciting“.", en: "I like it because it's fun." }
          - say: { de: "Bei „Show and Tell“ bringst du etwas mit und zeigst es. Hör zu.", en: "Hello, everyone! This is my favourite toy. It's a yo-yo. It's red and blue. My grandpa gave it to me. Thank you for listening!" }
            show: { object: yo-yo }
            text: "This is my favourite toy. It's a yo-yo."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Hör dir Sams Vortrag an. Was ist sein Hobby?"
                say: { de: "Hör dir Sams Vortrag an. Was ist sein Hobby?" }
                audio: { en: "Hello, everyone! Today I want to tell you about my hobby. My hobby is playing football. I play every Saturday with my team. I like it because it's exciting. Thank you for listening!", speaker: male }
                options: [{ object: play-football }, { object: play-tennis }, { object: swim }]
                answer: play-football
                hints:
                  - "Hör auf „My hobby is“."
                  - "„Football“ klingt fast wie das deutsche Wort."
                  - "Sams Hobby ist Fußball."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Hör dir Sams Vortrag noch einmal an. Wann spielt er?"
                say: { de: "Hör dir Sams Vortrag noch einmal an. Wann spielt er?" }
                audio: { en: "My hobby is playing football. I play every Saturday with my team. I like it because it's exciting.", speaker: male }
                options: ["jeden Samstag", "jeden Montag", "jeden Tag"]
                answer: "jeden Samstag"
                hints:
                  - "Hör auf „every“."
                  - "„Saturday“ ist ein Wochentag."
                  - "Every Saturday: jeden Samstag."
              - id: l2-f3
                type: multiple_choice
                option_audio: false
                text: "Ida malt gern. Sie findet es entspannend.\nMy hobby is painting. ___\nWelcher Satz passt?"
                say: { de: "Ida malt gern. Sie findet es entspannend. Welcher Satz passt?" }
                options: ["I like it because it's relaxing.", "I like it but it's relaxing.", "Because I like it relaxing."]
                answer: "I like it because it's relaxing."
                hints:
                  - "„Weil“ heißt „because“."
                  - "Zuerst „I like it“, dann „because“ und der Grund."
                  - "I like it because it's relaxing."
              - id: l2-f4
                type: ordering
                option_audio: false
                text: "Bau den Satz: Ich mag es, weil es Spaß macht."
                say: { de: "Bau den Satz: Ich mag es, weil es Spaß macht." }
                options: ["it's fun.", "because", "I like it"]
                slot_count: 3
                answer: ["I like it", "because", "it's fun."]
                hints:
                  - "Zuerst sagst du, dass du es magst."
                  - "Dann kommt „because“."
                  - "I like it because it's fun."
              - id: l2-f5
                type: speak
                text: "Sag, was dein Hobby ist."
                say: { de: "Sag, was dein Hobby ist. Zum Beispiel so:", en: "My hobby is swimming. I swim every Tuesday." }
                show: { object: swim }
                expected_text: "My hobby is swimming. I swim every Tuesday."
                hints:
                  - "Fang mit „My hobby is“ an."
                  - "Dann sag, wann du es machst: „every“ und ein Wochentag."
                  - "Sag mit mir: My hobby is swimming. I swim every Tuesday."
              - id: l2-f6
                type: speak
                text: "Sag, warum du dein Hobby magst."
                say: { de: "Sag, warum du dein Hobby magst. Zum Beispiel so:", en: "I like it because it's fun." }
                expected_text: "I like it because it's fun."
                hints:
                  - "Fang mit „I like it“ an."
                  - "Dann kommt „because“."
                  - "Sag mit mir: I like it because it's fun."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Hör dir Amirs Vortrag an. Was hat er mitgebracht?"
                say: { de: "Hör dir Amirs Vortrag an. Was hat er mitgebracht?" }
                audio: { en: "Hello, everyone! This is my favourite thing. It's a kite. It's green and yellow. I fly it with my dad. Thank you for listening!", speaker: male }
                options: [{ object: kite }, { object: ball }, { object: yo-yo }]
                answer: kite
                hints: ["Hör auf „It's a ...“."]
              - id: l2-s2
                type: audio_choice
                text: "Hör dir Hannahs Vortrag an. Warum mag sie Gitarre spielen?"
                say: { de: "Hör dir Hannahs Vortrag an. Warum mag sie Gitarre spielen?" }
                audio: { en: "My hobby is playing the guitar. I like it because I can play songs for my family.", speaker: female }
                options: ["weil sie für ihre Familie spielen kann", "weil es leicht ist", "weil ihre Freundin spielt"]
                answer: "weil sie für ihre Familie spielen kann"
                hints: ["Hör auf das, was nach „because“ kommt."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Bring die Sätze in die richtige Reihenfolge."
                say: { de: "Bau Pauls Vortrag. Was kommt zuerst?" }
                options: ["My hobby is reading.", "Thank you for listening!", "Hello, everyone!", "I like it because it's exciting."]
                slot_count: 4
                answer: ["Hello, everyone!", "My hobby is reading.", "I like it because it's exciting.", "Thank you for listening!"]
                hints: ["Anfang, Hobby, warum, Ende."]
              - id: l2-s4
                type: speak
                text: "Zeig deinen Lieblingsgegenstand."
                say: { de: "Zeig deinen Lieblingsgegenstand. Zum Beispiel so:", en: "This is my favourite toy. It's a ball. It's red." }
                show: { object: ball }
                expected_text: "This is my favourite toy. It's a ball. It's red."
                hints: ["Fang mit „This is my favourite toy“ an."]
              - id: l2-s5
                type: multiple_choice
                option_audio: false
                text: "Wann tanzt Sofia?\nI dance every Monday and Thursday."
                say: { de: "Lies Sofias Satz. Wann tanzt sie?" }
                options: ["montags und donnerstags", "jeden Tag", "nur am Montag"]
                answer: "montags und donnerstags"
                feedback:
                  "nur am Montag": "Lies weiter: „and Thursday“. Sofia tanzt an zwei Tagen."
                hints: ["„Thursday“ ist Donnerstag."]
              - id: l2-s6
                type: speak
                text: "Sag, warum du dein Lieblingsding magst."
                say: { de: "Sag, warum du dein Lieblingsding magst. Zum Beispiel so:", en: "I like it because my grandma gave it to me." }
                expected_text: "I like it because my grandma gave it to me."
                hints: ["Fang mit „I like it because“ an."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Hör dir Zoes Vortrag an. Was ist ihr Hobby?"
