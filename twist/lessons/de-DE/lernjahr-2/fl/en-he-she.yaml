# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-he-she
skill: fl.grammar.he-she-it
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Über andere sprechen
  en: Talking about others
summary: >
  Talking about other people with he and she, and the verb changes that
  go with it. Lesson 1 sets I like against she likes and I can swim
  against he can swim (no s after can); lesson 2 sets I have got against
  he has got and I am against she is, and ends with the skill check.
  Instructions are in German; the English is spoken and shown in short
  form.
metadata:
  year: lernjahr-2
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks, fl.themes.family]
  also_practises: [fl.themes.hobbies, fl.themes.family]
  vocabulary: { en: [he, she, likes, plays, has got, is, can] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: he-she, what: { de: he oder she wählen, en: choosing he or she } }
    - { id: verb-s, what: { de: das s am Verb nach he und she, en: the s on the verb after he and she } }
    - { id: can, what: { de: can ohne s und das Verb danach ohne s, en: can with no s and no s on the verb after it } }
    - { id: has-is, what: { de: has und is statt have und am, en: has and is instead of have and am } }
  misconceptions:
    - id: no-third-s
      what: Leaves out the s after he or she (She like cats.)
      addressed: lesson 1 Learn sets I like against she likes; the option without s is offered in every stage of lesson 1, with feedback in l1-f1
    - id: s-after-can
      what: Adds an s after can (He cans swim.)
      addressed: lesson 1 Learn says can never changes; a can task in every stage of lesson 1 offers "cans" and the verb with s, with feedback in l1-f3
    - id: have-is
      what: Keeps have and am with he and she (She have got a dog. He am nine.)
      addressed: lesson 2 Learn sets have against has and am against is; each stage of lesson 2 offers the I-form, with feedback in l2-f1 and l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "She likes, he plays", en: "She likes, he plays" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Wer ist das?"
            say: { de: "Hör zu. Wer ist das?" }
            audio: { en: "This is my sister.", speaker: male }
            options: [{ object: girl }, { object: boy }, { object: dad }]
            answer: girl
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Ich mag Katzen“?"
            say: "Wie sagst du auf Englisch: Ich mag Katzen?"
            options: ["I like cats.", "I likes cats.", "I am cats."]
            answer: "I like cats."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "I like cats. · She likes cats."
            say: { de: "Sprichst du über ein Mädchen, sagst du „she“, bei einem Jungen „he“. Dann bekommt das Verb ein s:", en: "I like cats. She likes cats." }
            show: { object: girl }
          - text: "I play football. · He plays football."
            say: { en: "I play football. He plays football." }
            show: { object: boy }
          - text: "I can swim. · He can swim."
            say: { de: "Nur „can“ bekommt kein s, und das Verb danach auch nicht:", en: "I can swim. He can swim." }
            show: { object: swim }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Sie mag Hunde“?"
                say: "Wie sagst du auf Englisch: Sie mag Hunde?"
                show: { object: girl }
                options: ["She likes dogs.", "She like dogs.", "He likes dogs."]
                answer: "She likes dogs."
                option_audio: false
                feedback:
                  "She like dogs.": "Nach „she“ bekommt das Verb ein s: She likes dogs."
                  "He likes dogs.": "„He“ ist er. Für ein Mädchen sagst du „she“."
                hints:
                  - "Es geht um ein Mädchen, also „she“."
                  - "Nach „she“ bekommt das Verb ein s."
                  - "She likes dogs."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Über wen wird gesprochen?"
                say: { de: "Hör zu. Über wen wird gesprochen?" }
                audio: { en: "He plays the guitar." }
                options: [{ object: boy }, { object: girl }]
                answer: boy
                hints:
                  - "Hör auf das erste Wort."
                  - "„He“ heißt er."
                  - "Tippe auf den Jungen."
              - id: l1-f3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Er kann tanzen“?"
                say: "Wie sagst du auf Englisch: Er kann tanzen?"
                show: { object: boy }
                options: ["He cans dance.", "He can dance.", "He can dances."]
                answer: "He can dance."
                option_audio: false
                feedback:
                  "He cans dance.": "„Can“ bekommt nie ein s: He can dance."
                  "He can dances.": "Nach „can“ bekommt auch das Verb kein s: He can dance."
                hints:
                  - "„Can“ ändert sich nie."
                  - "Auch das Verb danach bleibt ohne s."
                  - "He can dance."
              - id: l1-f4
                type: ordering
                text: "Bau den Satz: Sie spielt Tennis."
                say: "Bau den Satz auf Englisch: Sie spielt Tennis."
                options: ["tennis.", "She", "plays"]
                slot_count: 3
                answer: ["She", "plays", "tennis."]
                option_audio: false
                hints:
                  - "Der Satz fängt mit „She“ an."
                  - "Das Verb hat ein s."
                  - "She plays tennis."
              - id: l1-f5
                type: true_false
                text: "He like pizza.\nIst der Satz richtig?"
                say: { de: "Lies den Satz. Ist er richtig?" }
                answer: false
                hints:
                  - "Schau dir das Verb nach „he“ an."
                  - "Fehlt da ein s?"
                  - "Nein. Richtig ist: He likes pizza."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Er mag Äpfel“?"
                say: "Wie sagst du auf Englisch: Er mag Äpfel?"
                show: { object: boy }
                options: ["He like apples.", "She likes apples.", "He likes apples."]
                answer: "He likes apples."
                option_audio: false
                hints: ["Junge oder Mädchen? Und hat das Verb ein s?"]
              - id: l1-s2
                type: audio_choice
                text: "Über wen wird gesprochen?"
                say: { de: "Hör zu. Über wen wird gesprochen?" }
                audio: { en: "She plays football." }
                options: [{ object: boy }, { object: girl }]
                answer: girl
                hints: ["Hör auf das erste Wort."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Sie kann singen“?"
                say: "Wie sagst du auf Englisch: Sie kann singen?"
                show: { object: girl }
                options: ["She can sings.", "She cans sing.", "She can sing."]
                answer: "She can sing."
                option_audio: false
                hints: ["Ändert sich „can“?"]
              - id: l1-s4
                type: ordering
                text: "Bau den Satz: Er mag Eis."
                say: "Bau den Satz auf Englisch: Er mag Eis."
                options: ["likes", "ice cream.", "He"]
                slot_count: 3
                answer: ["He", "likes", "ice cream."]
                option_audio: false
                hints: ["Wer kommt zuerst?"]
              - id: l1-s5
                type: true_false
                text: "She can swim.\nIst der Satz richtig?"
                say: { de: "Lies den Satz. Ist er richtig?" }
                answer: true
                hints: ["Schau dir „can“ und das Verb danach genau an."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Sie mag Pferde“?"
                say: "Wie sagst du auf Englisch: Sie mag Pferde?"
                show: { object: girl }
                options: ["She likes horses.", "She like horses.", "She liking horses."]
                answer: "She likes horses."
                option_audio: false
              - id: l1-n2
                type: audio_choice
                text: "Über wen wird gesprochen?"
                say: { de: "Hör zu. Über wen wird gesprochen?" }
                audio: { en: "He likes his bike." }
                options: [{ object: girl }, { object: boy }]
                answer: boy
              - id: l1-n3
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Er kann malen“?"
                say: "Wie sagst du auf Englisch: Er kann malen?"
                show: { object: boy }
                options: ["He can paint.", "He cans paint.", "He can paints."]
                answer: "He can paint."
                option_audio: false
              - id: l1-n4
                type: ordering
                text: "Bau den Satz: Sie spielt Gitarre."
                say: "Bau den Satz auf Englisch: Sie spielt Gitarre."
                options: ["the guitar.", "plays", "She"]
                slot_count: 3
                answer: ["She", "plays", "the guitar."]
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "He play football.\nIst der Satz richtig?"
                say: { de: "Lies den Satz. Ist er richtig?" }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Er mag Bananen“?"
            say: "Wie sagst du auf Englisch: Er mag Bananen?"
            show: { object: boy }
            options: ["He likes bananas.", "He like bananas.", "She likes bananas."]
            answer: "He likes bananas."
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Sie kann Rad fahren“?"
            say: "Wie sagst du auf Englisch: Sie kann Rad fahren?"
            show: { object: girl }
            options: ["She cans ride a bike.", "She can ride a bike.", "She can rides a bike."]
            answer: "She can ride a bike."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "She likes music.\nIst der Satz richtig?"
            say: { de: "Lies den Satz. Ist er richtig?" }
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Er spielt Fußball. Ergänze den Satz."
            say: { de: "Er spielt Fußball. Ergänze den Satz." }
            show: { object: boy }
            frame: "He _ football."
            options: ["plays", "play"]
            answer: ["plays"]
            option_audio: false
          - id: l1-c5
            type: audio_choice
            text: "Was kann Sam?"
            say: { de: "Hör zu. Was kann Sam?" }
            audio: { en: "This is Sam. He can swim.", speaker: female }
            options: [{ object: swim }, { object: dance }, { object: sing }]
            answer: swim
          - id: l1-c6
            type: true_false
            text: "She cans sing.\nIst der Satz richtig?"
            say: { de: "Lies den Satz. Ist er richtig?" }
            answer: false

  - n: 2
    title: { de: "He has got, she is", en: "He has got, she is" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Sie mag Katzen“?"
            say: "Wie sagst du auf Englisch: Sie mag Katzen?"
            options: ["She likes cats.", "She like cats.", "She cans cats."]
            answer: "She likes cats."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Über wen wird gesprochen?"
            say: { de: "Hör zu. Über wen wird gesprochen?" }
            audio: { en: "She can swim." }
            options: [{ object: boy }, { object: girl }]
            answer: girl
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "I have got a dog. · He has got a dog."
            say: { de: "Bei „he“ und „she“ wird aus „have“ „has“:", en: "I have got a dog. He has got a dog." }
            show: { object: dog }
          - text: "I am nine. · She is nine."
            say: { de: "Und aus „am“ wird „is“:", en: "I am nine. She is nine." }
            show: { object: girl }
          - text: "This is my brother. He is ten. He has got a cat. He likes football."
            say: { en: "This is my brother. He is ten. He has got a cat. He likes football." }
            show: { object: boy }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Er hat ein Kaninchen“?"
                say: "Wie sagst du auf Englisch: Er hat ein Kaninchen?"
                show: { object: rabbit }
                options: ["He has got a rabbit.", "He have got a rabbit.", "He is got a rabbit."]
                answer: "He has got a rabbit."
                option_audio: false
                feedback:
                  "He have got a rabbit.": "Bei „he“ und „she“ wird aus „have“ „has“: He has got a rabbit."
                hints:
                  - "Bei „he“ und „she“ ändert sich „have“."
                  - "Aus „have“ wird „has“."
                  - "He has got a rabbit."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Sie ist acht“?"
                say: "Wie sagst du auf Englisch: Sie ist acht?"
                show: { object: girl }
                options: ["She am eight.", "She is eight.", "She has eight."]
                answer: "She is eight."
                option_audio: false
                feedback:
                  "She am eight.": "„Am“ gehört nur zu „I“. Bei „she“ sagst du „is“: She is eight."
                hints:
                  - "Bei „she“ wird aus „am“ ein anderes Wort."
                  - "„Is“ heißt ist."
                  - "She is eight."
              - id: l2-f3
                type: audio_choice
                text: "Was hat das Mädchen?"
                say: { de: "Hör zu. Was hat das Mädchen?" }
                audio: { en: "This is my friend. She has got a fish.", speaker: female }
                options: [{ object: cat }, { object: fish }, { object: dog }]
                answer: fish
                hints:
                  - "Hör auf das Wort am Ende."
                  - "„Fish“ ist der Fisch."
                  - "Tippe auf den Fisch."
              - id: l2-f4
                type: ordering
                text: "Bau den Satz: Er ist zehn."
                say: "Bau den Satz auf Englisch: Er ist zehn."
                options: ["ten.", "is", "He"]
                slot_count: 3
                answer: ["He", "is", "ten."]
                option_audio: false
                hints:
                  - "Der Satz fängt mit „He“ an."
                  - "Dann kommt „is“."
                  - "He is ten."
              - id: l2-f5
                type: true_false
                text: "She have got a ball.\nIst der Satz richtig?"
                say: { de: "Lies den Satz. Ist er richtig?" }
                answer: false
                hints:
                  - "Was wird bei „she“ aus „have“?"
                  - "Aus „have“ wird „has“."
                  - "Nein. Richtig ist: She has got a ball."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Sie hat eine Katze“?"
                say: "Wie sagst du auf Englisch: Sie hat eine Katze?"
                show: { object: cat }
                options: ["She have got a cat.", "She has got a cat.", "She is a cat."]
                answer: "She has got a cat."
                option_audio: false
                hints: ["Was wird bei „she“ aus „have“?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Er ist neun“?"
                say: "Wie sagst du auf Englisch: Er ist neun?"
                show: { object: boy }
                options: ["He is nine.", "He am nine.", "He has nine."]
                answer: "He is nine."
                option_audio: false
                hints: ["Welches Wort heißt ist?"]
              - id: l2-s3
                type: audio_choice
                text: "Was hat der Junge?"
                say: { de: "Hör zu. Was hat der Junge?" }
                audio: { en: "This is my cousin. He has got a kite.", speaker: male }
                options: [{ object: ball }, { object: bike }, { object: kite }]
                answer: kite
                hints: ["Hör auf das Wort am Ende."]
              - id: l2-s4
                type: ordering
                text: "Bau den Satz: Sie hat einen Hund."
                say: "Bau den Satz auf Englisch: Sie hat einen Hund."
                options: ["got", "a dog.", "She", "has"]
                slot_count: 4
                answer: ["She", "has", "got", "a dog."]
                option_audio: false
                hints: ["Was wird bei „she“ aus „have“? Und wohin kommt „got“?"]
              - id: l2-s5
                type: true_false
                text: "He is eleven.\nIst der Satz richtig?"
                say: { de: "Lies den Satz. Ist er richtig?" }
                answer: true
                hints: ["Denk an „I am“. Was sagst du bei „he“?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Er hat ein Fahrrad“?"
                say: "Wie sagst du auf Englisch: Er hat ein Fahrrad?"
                show: { object: bike }
                options: ["He has got a bike.", "He have got a bike.", "He is got a bike."]
                answer: "He has got a bike."
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Wie sagst du auf Englisch: „Sie ist zehn“?"
                say: "Wie sagst du auf Englisch: Sie ist zehn?"
                show: { object: girl }
                options: ["She has ten.", "She am ten.", "She is ten."]
                answer: "She is ten."
                option_audio: false
              - id: l2-n3
                type: audio_choice
                text: "Was hat das Mädchen?"
                say: { de: "Hör zu. Was hat das Mädchen?" }
                audio: { en: "This is my sister. She has got a balloon.", speaker: female }
                options: [{ object: balloon }, { object: ball }, { object: book }]
                answer: balloon
              - id: l2-n4
                type: ordering
                text: "Bau den Satz: Er hat eine Schwester."
                say: "Bau den Satz auf Englisch: Er hat eine Schwester."
                options: ["a sister.", "has", "He", "got"]
                slot_count: 4
                answer: ["He", "has", "got", "a sister."]
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "She am nine.\nIst der Satz richtig?"
                say: { de: "Lies den Satz. Ist er richtig?" }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: verb-s
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Sie spielt Fußball“?"
            say: "Wie sagst du auf Englisch: Sie spielt Fußball?"
            show: { object: girl }
            options: ["She play football.", "She plays football.", "He plays football."]
            answer: "She plays football."
            option_audio: false
          - id: l2-c2
            part: can
            type: multiple_choice
            text: "Wie sagst du auf Englisch: „Er kann lesen und schreiben“?"
            say: "Wie sagst du auf Englisch: Er kann lesen und schreiben?"
            show: { object: boy }
            options: ["He can reads and writes.", "He can read and write.", "He cans read and write."]
            answer: "He can read and write."
            option_audio: false
          - id: l2-c3
            part: has-is
            type: fill_in_blank
            text: "Sie hat ein Buch. Ergänze den Satz."
            say: { de: "Sie hat ein Buch. Ergänze den Satz." }
            show: { object: book }
            frame: "She _ got a book."
            options: ["have", "is", "has"]
            answer: ["has"]
            option_audio: false
          - id: l2-c4
            part: he-she
            type: audio_choice
            text: "Über wen wird gesprochen?"
            say: { de: "Hör zu. Über wen wird gesprochen?" }
            audio: { en: "He is my best friend.", speaker: male }
            options: [{ object: girl }, { object: boy }]
            answer: boy
          - id: l2-c5
            part: has-is
            type: true_false
            text: "Lena erzählt von ihrem Bruder.\nHe is ten. He have got a cat.\nSind beide Sätze richtig?"
            say: { de: "Lena erzählt von ihrem Bruder. Lies die Sätze. Sind beide richtig?" }
            answer: false
          - id: l2-c6
            part: he-she
            type: fill_in_blank
            text: "Das ist Tom. Ergänze den Satz."
            say: { de: "Das ist Tom. Ergänze den Satz." }
            show: { object: boy }
            frame: "_ likes cats."
            options: ["He", "She"]
            answer: ["He"]
            option_audio: false
          - id: l2-c7
            part: he-she
            type: fill_in_blank
            text: "Das ist Oma. Ergänze den Satz."
            say: { de: "Das ist Oma. Ergänze den Satz." }
            show: { object: grandma }
            frame: "_ has got a cat."
            options: ["He", "She"]
            answer: ["She"]
            option_audio: false
          - id: l2-c8
            part: he-she
            type: audio_choice
            text: "Wer spielt Gitarre?"
            say: { de: "Hör zu. Wer spielt Gitarre?" }
            audio: { en: "This is Lucy and this is Max. He plays the guitar.", speaker: female }
            options: [{ object: girl }, { object: boy }]
            answer: boy
          - id: l2-c9
            part: he-she
            type: multiple_choice
            text: "Du sprichst über deinen Papa. Welcher Satz passt?"
            say: "Du sprichst über deinen Papa. Welcher Satz passt?"
            show: { object: dad }
            options: ["He likes football.", "She likes football.", "I likes football."]
            answer: "He likes football."
            option_audio: false
          - id: l2-c10
            part: verb-s
            type: ordering
            text: "Bau den Satz: Sie mag Katzen und spielt Tennis."
            say: "Bau den Satz auf Englisch: Sie mag Katzen und spielt Tennis."
            options: ["plays", "She", "tennis.", "and", "likes", "cats"]
            slot_count: 6
            answer: ["She", "likes", "cats", "and", "plays", "tennis."]
            option_audio: false
          - id: l2-c11
            part: verb-s
            type: true_false
            text: "He plays the guitar.\nIst der Satz richtig?"
            say: { de: "Lies den Satz. Ist er richtig?" }
            answer: true
          - id: l2-c12
            part: verb-s
            type: fill_in_blank
            text: "Er mag Musik. Ergänze den Satz."
            say: { de: "Er mag Musik. Ergänze den Satz." }
            show: { object: boy }
            frame: "He _ music."
            options: ["like", "likes", "liking"]
            answer: ["likes"]
            option_audio: false
          - id: l2-c13
            part: verb-s
            type: multiple_choice
            text: "Welcher Satz ist richtig?"
            say: "Welcher Satz ist richtig?"
            options: ["He playing football.", "He play football.", "He plays football."]
            answer: "He plays football."
            option_audio: false
          - id: l2-c14
            part: can
            type: fill_in_blank
            text: "Sie kann schwimmen. Ergänze den Satz."
            say: { de: "Sie kann schwimmen. Ergänze den Satz." }
            show: { object: girl }
            frame: "She _ swim."
            options: ["can", "cans", "is"]
            answer: ["can"]
            option_audio: false
          - id: l2-c15
            part: can
