# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-speak-about-me
skill: fl.speaking.about-me
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Über mich erzählen
  en: Talking about myself
summary: >
  Talking about oneself in a few connected sentences: name, age, where you
  live, family, pets, hobbies and what you like doing. Lesson 1 listens to
  children introducing themselves and says the first sentences about name,
  age and family; lesson 2 adds hobbies and likes, joins sentences with
  and, but and too, and ends with the skill check. Speaking tasks are
  practice only; the skill check asks for the building blocks of a short
  talk by listening, choosing and ordering.
metadata:
  year: lernjahr-2
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.describe, fl.themes.hobbies]
  also_practises: [fl.themes.family, fl.themes.hobbies, fl.grammar.chunks, fl.listening.details]
  vocabulary: { en: ["My name is ...", "I'm ... years old", "I live in ...", "I've got ...", "My favourite ... is ...", "I like ...ing", and, but, too, brother, sister, grandma, grandpa] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: me, what: { de: "sich vorstellen: Name, Alter, Wohnort", en: "introducing yourself: name, age, where you live" } }
    - { id: family, what: { de: Familie und Haustiere nennen, en: naming family and pets } }
    - { id: likes, what: { de: "sagen, was man gern macht und kann", en: saying what you like doing and can do } }
    - { id: join, what: { de: "Sätze mit and, but und too verbinden", en: "joining sentences with and, but and too" } }
  misconceptions:
    - id: list-not-talk
      what: Says single words (nine, dog, football) instead of whole sentences
      addressed: lesson 1 Learn models every fact as a sentence; speak tasks give a whole sentence as the model
    - id: have-age
      what: Says I have nine years, from the German Ich habe ... or Ich bin neun Jahre alt said word for word
      addressed: lesson 1 Learn says I'm nine or I'm nine years old; l1-f2 and l1-s3 give feedback on I have nine years
    - id: same-start
      what: Starts every sentence with I like ... and never joins them
      addressed: lesson 2 Learn joins sentences with and, but and too; l2-f4 and l2-s2 build joined sentences
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das bin ich, en: This is me }
    goal:
      de: "Sag in ganzen Sätzen, wie du heißt, wie alt du bist und wer in deiner Familie ist, so wie I'm nine."
      en: "Say in whole sentences your name, your age and who is in your family, like I'm nine."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Was kann das Kind?"
            say: { de: "Hör zu. Was kann das Kind?" }
            audio: { en: "I can swim.", speaker: male }
            options: [{ object: swim }, { object: dance }, { object: read }]
            answer: swim
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welches Tier ist es?"
            say: { de: "Hör zu. Welches Tier ist es?" }
            audio: { en: "It's small and it's got long ears." }
            options: [{ object: rabbit }, { object: elephant }, { object: fish }]
            answer: rabbit
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Ich bin neun Jahre alt. Was glaubst du: „I have nine years“ oder „I'm nine years old“?"
            say: { de: "Auf Deutsch sagst du: Ich bin neun Jahre alt. Was glaubst du: Wie sagt Amelia das auf Englisch? I have nine years, oder I'm nine years old? Hör gleich genau hin." }
            show: { object: girl }
          - say: { de: "Hör zu. So erzählt Amelia über sich.", en: "Hi! My name is Amelia. I'm nine years old. I live in Manchester. I've got a little brother. His name is Sam." }
            show: { object: girl }
            text: "My name is Amelia.\nI'm nine years old.\nI live in Manchester.\nI've got a little brother."
          - text: "I'm nine. / I'm nine years old.\nnicht: I have nine years."
            say: { de: "Dein Alter sagst du mit „I'm“: „I'm nine“ oder „I'm nine years old“. Auf Englisch hast du keine Jahre, du bist sie.", en: "I'm nine. I'm nine years old." }
          - text: "Hi! My name is ...\nI'm ... years old.\nI live in ...\nI've got ..."
            say: { de: "Das ist dein Plan. Jeder Satz sagt eine Sache über dich. Sprich in ganzen Sätzen, nicht nur in einzelnen Wörtern." }
          - text: "Wusstest du? Der häufigste Familienname in England ist Smith."
            say: { de: "Wusstest du? Der häufigste Familienname in England ist Smith. Smith heißt Schmied. So nannte man früher jemanden, der Hufeisen und Werkzeug aus Eisen machte. Bei uns heißen viele darum Schmidt.", en: "Smith." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Wo wohnt Harry?"
                say: { de: "Hör zu. Wo wohnt Harry?" }
                audio: { en: "Hello, I'm Harry. I'm ten. I live in Leeds with my mum and my dad.", speaker: male }
                options: ["in Leeds", "in London", "in Bristol"]
                answer: "in Leeds"
                hints:
                  - "Hör auf „I live in“."
                  - "„Live“ heißt wohnen."
                  - "I live in Leeds."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Wie sagst du: Ich bin zehn Jahre alt?"
                say: { de: "Wie sagst du auf Englisch: Ich bin zehn Jahre alt?" }
                options: ["I'm ten years old.", "I have ten years.", "My ten years."]
                answer: "I'm ten years old."
                feedback:
                  "I have ten years.": "Auf Englisch hast du keine Jahre, du bist sie: „I'm ten years old.“"
                hints:
                  - "„Ich bin“ heißt „I'm“."
                  - "Danach kommt die Zahl und „years old“."
                  - "I'm ten years old."
              - id: l1-f3
                type: speak
                text: "Stell dich vor. Sag deinen Namen."
                say: { de: "Stell dich vor. Sag deinen Namen. Zum Beispiel so:", en: "Hi! My name is Amelia." }
                show: { object: girl }
                expected_text: "Hi! My name is Amelia."
                hints:
                  - "Fang mit „Hi!“ an."
                  - "Dann: „My name is“ und dein Name."
                  - "Sag mit mir: Hi! My name is Amelia."
              - id: l1-f4
                type: audio_choice
                text: "Wen hat Grace in ihrer Familie?"
                say: { de: "Hör zu. Wen hat Grace in ihrer Familie?" }
                audio: { en: "I'm Grace. I've got two sisters and a baby brother.", speaker: female }
                options: ["zwei Schwestern und einen kleinen Bruder", "zwei Brüder und eine Schwester", "eine Schwester"]
                answer: "zwei Schwestern und einen kleinen Bruder"
                hints:
                  - "Hör auf „I've got“."
                  - "„Sisters“ heißt Schwestern, „baby brother“ kleiner Bruder."
                  - "Two sisters and a baby brother."
              - id: l1-f5
                type: speak
                text: "Sag, wie alt du bist."
                say: { de: "Sag, wie alt du bist. Zum Beispiel so:", en: "I'm nine years old." }
                expected_text: "I'm nine years old."
                hints:
                  - "Fang mit „I'm“ an."
                  - "Dann deine Zahl und „years old“."
                  - "Sag mit mir: I'm nine years old."
              - id: l1-f6
                type: ordering
                option_audio: false
                text: "Bring die Sätze in eine gute Reihenfolge."
                say: { de: "Ben will sich vorstellen. Was sagt er zuerst?" }
                options: ["I live in York.", "Hi! My name is Ben.", "I'm eight."]
                slot_count: 3
                answer: ["Hi! My name is Ben.", "I'm eight.", "I live in York."]
                hints:
                  - "Zuerst begrüßt du und sagst deinen Namen."
                  - "Dann kommt das Alter."
                  - "Hi! My name is Ben. I'm eight. I live in York."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Wie alt ist Oscar?"
                say: { de: "Hör zu. Wie alt ist Oscar?" }
                audio: { en: "Hi, I'm Oscar. I'm eleven years old. I live in Bath.", speaker: male }
                options: ["11", "7", "10"]
                answer: "11"
                hints: ["„Eleven“ heißt elf."]
              - id: l1-s2
                type: speak
                text: "Sag, wo du wohnst."
                say: { de: "Sag, wo du wohnst. Zum Beispiel so:", en: "I live in Hamburg." }
                expected_text: "I live in Hamburg."
                hints: ["Sag „I live in“ und den Namen deiner Stadt."]
              - id: l1-s3
                type: multiple_choice
                option_audio: false
                text: "Mila ist acht. Welcher Satz ist richtig?"
                say: { de: "Mila ist acht. Welcher Satz ist richtig?" }
                options: ["I'm eight.", "I have eight years.", "I eight."]
                answer: "I'm eight."
                feedback:
                  "I have eight years.": "Dein Alter sagst du mit „I'm“."
                hints: ["„Ich bin“ heißt „I'm“."]
              - id: l1-s4
                type: audio_choice
                text: "Welches Haustier hat Ruby?"
                say: { de: "Hör zu. Welches Haustier hat Ruby?" }
                audio: { en: "My name is Ruby. I've got a brother and a dog. My dog is called Pepper.", speaker: female }
                options: [{ object: dog }, { object: cat }, { object: rabbit }]
                answer: dog
                hints: ["Hör auf „I've got a brother and a ...“."]
              - id: l1-s5
                type: speak
                text: "Erzähl von deiner Familie."
                say: { de: "Erzähl von deiner Familie. Zum Beispiel so:", en: "I've got a sister and a brother." }
                show: { objects: [girl, boy] }
                expected_text: "I've got a sister and a brother."
                hints: ["Fang mit „I've got“ an."]
              - id: l1-s6
                type: ordering
                option_audio: false
                text: "Bring die Sätze in eine gute Reihenfolge."
                say: { de: "Lea will sich vorstellen. Was sagt sie zuerst?" }
                options: ["I've got a cat.", "I'm nine.", "Hello! I'm Lea."]
                slot_count: 3
                answer: ["Hello! I'm Lea.", "I'm nine.", "I've got a cat."]
                hints: ["Begrüßung und Name kommen zuerst."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Wo wohnt Isla?"
                say: { de: "Hör zu. Wo wohnt Isla?" }
                audio: { en: "Hi! I'm Isla. I'm nine. I live in Glasgow, in Scotland.", speaker: female }
                options: ["in Glasgow", "in London", "in Leeds"]
                answer: "in Glasgow"
              - id: l1-n2
                type: speak
                text: "Stell dich vor: Name und Alter."
                say: { de: "Stell dich vor: Name und Alter. Zum Beispiel so:", en: "Hello! My name is Jonas. I'm ten." }
                expected_text: "Hello! My name is Jonas. I'm ten."
              - id: l1-n3
                type: audio_choice
                text: "Wie viele Brüder hat Leo?"
                say: { de: "Hör zu. Wie viele Brüder hat Leo?" }
                audio: { en: "I'm Leo. I've got three brothers. It's very loud at home!", speaker: male }
                options: ["3", "2", "1"]
                answer: "3"
              - id: l1-n4
                type: multiple_choice
                option_audio: false
                text: "Wie sagst du: Ich wohne in Berlin?"
                say: { de: "Wie sagst du auf Englisch: Ich wohne in Berlin?" }
                options: ["I live in Berlin.", "I am Berlin.", "I have got Berlin."]
                answer: "I live in Berlin."
              - id: l1-n5
                type: speak
                text: "Erzähl von deiner Familie oder deinem Haustier."
                say: { de: "Erzähl von deiner Familie oder deinem Haustier. Zum Beispiel so:", en: "I've got a little brother and a cat." }
                expected_text: "I've got a little brother and a cat."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Wie alt ist Freya?"
            say: { de: "Hör zu. Wie alt ist Freya?" }
            audio: { en: "My name is Freya. I'm eight years old.", speaker: female }
            options: ["8", "9", "10"]
            answer: "8"
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Wie sagst du: Ich bin neun Jahre alt?"
            say: { de: "Wie sagst du auf Englisch: Ich bin neun Jahre alt?" }
            options: ["I'm nine years old.", "I have nine years.", "I nine years."]
            answer: "I'm nine years old."
          - id: l1-c3
            type: audio_choice
            text: "Wen hat Ethan in seiner Familie?"
            say: { de: "Hör zu. Wen hat Ethan in seiner Familie?" }
            audio: { en: "I'm Ethan. I've got a big sister.", speaker: male }
            options: ["eine große Schwester", "einen großen Bruder", "zwei Schwestern"]
            answer: "eine große Schwester"
          - id: l1-c4
            type: audio_choice
            text: "Wo wohnt Noah?"
            say: { de: "Hör zu. Wo wohnt Noah?" }
            audio: { en: "Hi! I'm Noah. I'm ten. I live in Oxford.", speaker: male }
            options: ["in York", "in Oxford", "in Bath"]
            answer: "in Oxford"
          - id: l1-c5
            type: multiple_choice
            option_audio: false
            text: "Du willst sagen, wie du heißt. Welcher Satzanfang passt?"
            say: { de: "Du willst sagen, wie du heißt. Welcher Satzanfang passt?" }
            options: ["I live in …", "My name is …", "I've got …"]
            answer: "My name is …"
          - id: l1-c6
            type: audio_choice
            text: "Wie viele Schwestern hat Mo?"
            say: { de: "Hör zu. Wie viele Schwestern hat Mo?" }
            audio: { en: "I'm Mo. I've got four sisters!", speaker: male }
            options: ["2", "4", "1"]
            answer: "4"

  - n: 2
    title: { de: Was ich gern mache, en: What I like doing }
    goal:
      de: "Erzähl, was du gern machst, und verbinde deine Sätze mit and, but und too."
      en: "Say what you like doing and join your sentences with and, but and too."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Wo wohnt Jack?"
            say: { de: "Hör zu. Wo wohnt Jack?" }
            audio: { en: "Hi, I'm Jack. I live in London.", speaker: male }
            options: ["in London", "in York"]
            answer: "in London"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Wie alt ist Lina?"
            say: { de: "Hör zu. Wie alt ist Lina?" }
            audio: { en: "Hi! My name is Lina. I'm nine.", speaker: female }
            options: ["9", "5"]
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Amelia erzählt gleich, was sie gern isst. Was glaubst du: Was ist ihr Lieblingsessen?"
            say: { de: "Amelia erzählt gleich weiter, auch über ihr Lieblingsessen. Was glaubst du: Was isst sie am liebsten?" }
            show: { objects: [pizza, ice-cream, cake] }
          - say: { de: "Hör zu. Amelia erzählt weiter.", en: "I like swimming and I like reading. My favourite food is pizza. I can play the guitar, but I can't sing." }
            show: { objects: [swim, read, play-guitar] }
            text: "I like swimming and I like reading.\nMy favourite food is pizza.\nI can play the guitar, but I can't sing."
          - text: "and = und\nbut = aber\ntoo = auch"
            say: { de: "Mit „and“, „but“ und „too“ verbindest du deine Sätze. Dann klingt es wie eine kleine Erzählung und nicht wie eine Liste. „I like cats. I like dogs, too“ heißt: Ich mag auch Hunde.", en: "I like cats. I like dogs, too." }
          - text: "My name is ... I'm ...\nI've got ...\nI like ... and ...\nI can ..., but I can't ..."
            say: { de: "Jetzt hast du einen ganzen kleinen Vortrag über dich: Name, Alter, Familie, was du magst und was du kannst." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Was macht Noah gern?"
                say: { de: "Hör zu. Was macht Noah gern?" }
                audio: { en: "I'm Noah. I like painting and I like playing football.", speaker: male }
                options: ["malen und Fußball spielen", "malen und lesen", "schwimmen und Fußball spielen"]
                answer: "malen und Fußball spielen"
                hints:
                  - "Noah sagt zwei Sachen. Hör auf „and“."
                  - "„Painting“ heißt malen."
                  - "Painting and playing football."
                difficulty: easy
              - id: l2-f2
                type: speak
                text: "Sag, was du gern machst."
                say: { de: "Sag, was du gern machst. Zum Beispiel so:", en: "I like swimming and I like dancing." }
                show: { objects: [swim, dance] }
                expected_text: "I like swimming and I like dancing."
                hints:
                  - "Fang mit „I like“ an."
                  - "Verbinde zwei Hobbys mit „and“."
                  - "Sag mit mir: I like swimming and I like dancing."
              - id: l2-f3
                type: audio_choice
                text: "Was kann Chloe nicht?"
                say: { de: "Hör zu. Was kann Chloe nicht?" }
                audio: { en: "My name is Chloe. I can ride a bike, but I can't swim.", speaker: female }
                options: [{ object: swim }, { object: ride-bike }, { object: dance }]
                answer: swim
                feedback:
                  ride-bike: "Rad fahren kann Chloe. Hör auf das, was nach „but“ kommt: „I can't swim.“"
                hints:
                  - "Hör auf „can't“."
                  - "Nach „but“ kommt, was Chloe nicht kann."
                  - "I can't swim. Chloe kann nicht schwimmen."
              - id: l2-f4
                type: ordering
                option_audio: false
                text: "Bau den Satz: Ich kann Tennis spielen, aber ich kann nicht tanzen."
                say: { de: "Bau den Satz: Ich kann Tennis spielen, aber ich kann nicht tanzen." }
                options: ["but", "I can't dance.", "I can play tennis,"]
                slot_count: 3
                answer: ["I can play tennis,", "but", "I can't dance."]
                hints:
                  - "Zuerst kommt, was du kannst."
                  - "„But“ steht in der Mitte."
                  - "I can play tennis, but I can't dance."
              - id: l2-f5
                type: multiple_choice
                option_audio: false
                text: "Ich mag Katzen. Ich mag auch Hunde.\nI like cats. I like dogs, ___ .\nWelches Wort passt?"
                say: { de: "Welches Wort passt? Ich mag Katzen. Ich mag auch Hunde." }
                options: ["too", "but", "and"]
                answer: "too"
                hints:
                  - "Welches Wort heißt „auch“?"
                  - "„Too“ steht am Ende des Satzes."
                  - "I like dogs, too."
              - id: l2-f6
                type: speak
                text: "Sag, was du kannst und was nicht."
                say: { de: "Sag, was du kannst und was nicht. Zum Beispiel so:", en: "I can play football, but I can't play the guitar." }
                show: { objects: [play-football, play-guitar] }
                expected_text: "I can play football, but I can't play the guitar."
                hints:
                  - "Zuerst, was du kannst: „I can“."
                  - "Dann „but“ und was du nicht kannst: „I can't“."
                  - "Sag mit mir: I can play football, but I can't play the guitar."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Was ist Emilys Lieblingsessen?"
                say: { de: "Hör zu. Was ist Emilys Lieblingsessen?" }
                audio: { en: "I'm Emily. My favourite food is pasta. I like apples, too.", speaker: female }
                options: ["Nudeln", "Äpfel", "Pizza"]
                answer: "Nudeln"
                feedback:
                  "Äpfel": "Äpfel mag Emily auch, aber ihr Lieblingsessen ist „pasta“."
                hints: ["Hör auf „My favourite food is“."]
              - id: l2-s2
                type: ordering
                option_audio: false
                text: "Bau den Satz: Ich lese gern und ich male gern."
                say: { de: "Bau den Satz: Ich lese gern und ich male gern." }
                options: ["I like painting.", "I like reading", "and"]
                slot_count: 3
                answer: ["I like reading", "and", "I like painting."]
                hints: ["„And“ steht in der Mitte."]
              - id: l2-s3
                type: speak
                text: "Sag, was dein Lieblingsessen ist."
                say: { de: "Sag, was dein Lieblingsessen ist. Zum Beispiel so:", en: "My favourite food is pizza." }
                show: { object: pizza }
                expected_text: "My favourite food is pizza."
                hints: ["Fang mit „My favourite food is“ an."]
              - id: l2-s4
                type: audio_choice
                text: "Was macht Finn gern?"
                say: { de: "Hör zu. Was macht Finn gern?" }
                audio: { en: "Hi, I'm Finn. I'm ten. I've got a dog. I like singing, but I don't like dancing.", speaker: male }
                options: [{ object: sing }, { object: dance }, { object: paint }]
                answer: sing
                feedback:
                  dance: "Hör auf das, was nach „but“ kommt: „I don't like dancing.“ Tanzen mag Finn nicht."
                hints: ["Hör auf „I like“, nicht auf „I don't like“."]
              - id: l2-s5
                type: multiple_choice
                option_audio: false
                text: "Ich kann schwimmen, aber ich kann nicht tanzen.\nI can swim, ___ I can't dance.\nWelches Wort passt?"
                say: { de: "Welches Wort passt? Ich kann schwimmen, aber ich kann nicht tanzen." }
                options: ["but", "too", "and"]
                answer: "but"
                hints: ["„Aber“ heißt „but“."]
              - id: l2-s6
                type: speak
                text: "Erzähl in zwei Sätzen von dir."
                say: { de: "Erzähl in zwei Sätzen von dir. Zum Beispiel so:", en: "I'm nine. I like reading and I like singing." }
                expected_text: "I'm nine. I like reading and I like singing."
                hints: ["Zuerst dein Alter, dann was du magst."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Was macht Aisha gern?"
                say: { de: "Hör zu. Was macht Aisha gern?" }
                audio: { en: "I'm Aisha. I like playing tennis and I like reading books.", speaker: female }
                options: ["Tennis spielen und lesen", "Fußball spielen und lesen", "Tennis spielen und malen"]
                answer: "Tennis spielen und lesen"
              - id: l2-n2
                type: ordering
                option_audio: false
                text: "Bring die Sätze in eine gute Reihenfolge."
                say: { de: "Tom erzählt über sich. Bring seine Sätze in eine gute Reihenfolge." }
                options: ["I like football.", "I'm ten.", "Hi! My name is Tom.", "I've got a sister."]
                slot_count: 4
                answer: ["Hi! My name is Tom.", "I'm ten.", "I've got a sister.", "I like football."]
              - id: l2-n3
                type: speak
                text: "Erzähl über dich: Name, Alter und ein Hobby."
                say: { de: "Erzähl über dich: Name, Alter und ein Hobby. Zum Beispiel so:", en: "Hi! My name is Emma. I'm ten. I like riding my bike." }
                expected_text: "Hi! My name is Emma. I'm ten. I like riding my bike."
              - id: l2-n4
                type: multiple_choice
                option_audio: false
                text: "Ich mag Milch. Ich mag auch Saft.\nI like milk. I like juice, ___ .\nWelches Wort passt?"
                say: { de: "Welches Wort passt? Ich mag Milch. Ich mag auch Saft." }
                options: ["too", "but", "and"]
                answer: "too"
              - id: l2-n5
