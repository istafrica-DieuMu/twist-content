# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-video
skill: fl.listening.video
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Kurze Clips verstehen
  en: Understanding short clips
summary: >
  Short clips and cartoons on familiar topics: a dog in the park, baking a
  cake, the weather report, a visit to the zoo, a race between a snail and
  a bird. Each clip is a few spoken lines with its pictures on screen, so
  the child can use what it sees to understand what it hears. Lesson 1
  finds what a clip is about with the help of the pictures; lesson 2
  listens for details and the order of the scenes, and ends with the skill
  check. Questions are in German or pictures, so the task tests listening.
metadata:
  year: lernjahr-2
  topic: { de: Hören, en: Listening }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.stories]
  also_practises: [fl.culture-strategies.guess-meaning, fl.themes.weather, fl.themes.food, fl.themes.outside-animals]
  vocabulary: { en: [look, today, first, then, in the end, sunny, "It's raining.", "It's snowing.", cake, eggs, milk, zoo, race, fast, slow, wins] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: gist, what: { de: "verstehen, worum es in einem Clip geht", en: understanding what a clip is about } }
    - { id: details, what: { de: Einzelheiten aus einem Clip heraushören, en: picking out details from a clip } }
    - { id: order, what: { de: "verstehen, was zuerst, dann und am Ende passiert", en: "understanding what happens first, then and in the end" } }
  misconceptions:
    - id: ignore-pictures
      what: Listens only and gives up on unknown words, without using the pictures of the clip
      addressed: lesson 1 Learn says "Schau dir die Bilder an. Sie helfen dir beim Verstehen."; the full-stage hints point to the pictures
    - id: picture-not-words
      what: Picks whatever is in the picture, even when the clip says something else about it
      addressed: l1-f4 and l2-f3 show two animals and ask about one; feedback says to listen to what the clip says about each
    - id: first-mentioned
      what: Takes the first thing heard as the answer when the question asks about the end
      addressed: lesson 2 Learn brings first, then, in the end; l2-f2 gives feedback when the morning weather is taken for the afternoon
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Worum geht es im Clip?", en: "What is the clip about?" }
    goal:
      de: "Schau auf die Bilder im Clip und find heraus, worum es geht, auch wenn du nicht jedes Wort kennst."
      en: "Use the pictures in a clip to work out what it is about, even if you do not know every word."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Hör die Geschichte. Was findet die Maus?"
            say: { de: "Hör die Geschichte. Was findet die Maus?" }
            audio: { en: "A little mouse is hungry. It finds some cheese. Yum!" }
            options: [{ object: cheese }, { object: bread }, { object: apple }]
            answer: cheese
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welches Tier ist es?"
            say: { de: "Hör zu. Welches Tier ist es?" }
            audio: { en: "Look! It's big and grey. It's an elephant." }
            options: [{ object: elephant }, { object: mouse }, { object: giraffe }]
            answer: elephant
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: { de: "Jetzt schaust du kurze Clips an, wie kleine Filme. Schau dir die Bilder an. Sie helfen dir beim Verstehen.", en: "Look, this is Sam and his dog Rex. Sam throws the ball. Rex runs and runs. Good dog, Rex!" }
            show: { objects: [dog, ball] }
          - say: { de: "Was hast du gesehen? Einen Hund und einen Ball. Was hast du gehört? „Dog“, „ball“ und „runs“. Bild und Ton zusammen sagen dir: Sam spielt mit seinem Hund im Park." }
            show: { objects: [dog, ball] }
          - text: "Bild + Wörter, die du kennst = Worum geht es?"
            say: { de: "Du musst nicht jedes Wort verstehen. Schau auf die Bilder und hör auf die Wörter, die du kennst. Dann weißt du, worum es geht." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Worum geht es im Clip?"
                say: { de: "Schau und hör zu. Worum geht es im Clip?" }
                show: { objects: [egg, milk, cake] }
                audio: { en: "Hello! Today we're making a cake. First, two eggs. Then some milk. Mix, mix, mix. Mmm, a yummy cake!", speaker: female }
                options: ["Jemand backt einen Kuchen.", "Jemand kauft Eier ein.", "Jemand hat Geburtstag."]
                answer: "Jemand backt einen Kuchen."
                hints:
                  - "Schau auf die Bilder: Eier, Milch, Kuchen."
                  - "Du hörst: „Today we're making a cake.“"
                  - "„Make a cake“ heißt einen Kuchen backen."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Was für ein Clip ist das?"
                say: { de: "Schau und hör zu. Was für ein Clip ist das?" }
                show: { objects: [sun, rain] }
                audio: { en: "Good morning! Here is the weather for today. In the morning it's sunny. In the afternoon it's raining." }
                options: ["der Wetterbericht", "ein Kochclip", "ein Tierfilm"]
                answer: "der Wetterbericht"
                hints:
                  - "Schau auf die Bilder: Sonne und Regen."
                  - "Hörst du „weather“, „sunny“ und „raining“?"
                  - "„Weather“ heißt Wetter. Es ist der Wetterbericht."
              - id: l1-f3
                type: audio_choice
                text: "Wo spielt der Clip?"
                say: { de: "Schau und hör zu. Wo spielt der Clip?" }
                show: { objects: [elephant, giraffe, monkey] }
                audio: { en: "Welcome to the zoo! This is Ella the elephant. She is very big. And here is a monkey. He loves bananas!", speaker: male }
                options: ["im Zoo", "auf dem Bauernhof", "in der Schule"]
                answer: "im Zoo"
                feedback:
                  "auf dem Bauernhof": "Elefanten und Affen leben nicht auf dem Bauernhof. Hör auf den ersten Satz: „Welcome to the zoo!“"
                hints:
                  - "Schau auf die Tiere. Wo siehst du solche Tiere?"
                  - "Der erste Satz ist: „Welcome to the zoo!“"
                  - "Die Kinder sind im Zoo."
              - id: l1-f4
                type: audio_choice
                text: "Wer gewinnt das Rennen?"
                say: { de: "Schau und hör zu. Wer gewinnt das Rennen?" }
                show: { objects: [snail, bird] }
                audio: { en: "Sammy the snail is slow. Bella the bird is fast. They have a race. Bella flies, but then she stops and sleeps. Sammy goes slowly, slowly, and wins!" }
                options: [{ object: snail }, { object: bird }]
                answer: snail
                feedback:
                  bird: "Bella ist schnell, aber sie hält an und schläft. Hör auf das Ende: „Sammy goes slowly, slowly, and wins!“"
                hints:
                  - "Beide Tiere sind im Bild. Hör, was der Clip über jedes sagt."
                  - "Bella, der Vogel, schläft ein."
                  - "Sammy, die Schnecke, gewinnt."
              - id: l1-f5
                type: true_false
                text: "Spielt Sam mit seiner Katze?"
                say: { de: "Schau und hör zu. Spielt Sam mit seiner Katze?", en: "Look, this is Sam and his dog Rex. Sam throws the ball. Rex runs and runs. Good dog, Rex!" }
                show: { objects: [dog, ball] }
                answer: false
                hints:
                  - "Schau auf das Bild. Welches Tier siehst du?"
                  - "Du hörst „his dog Rex“."
                  - "Nein, Rex ist ein Hund."
              - id: l1-f6
                type: audio_choice
                text: "Was baut Mia?"
                say: { de: "Schau und hör zu. Was baut Mia?" }
                show: { objects: [snow, snowman] }
                audio: { en: "It's cold and it's snowing. Mia goes outside. She makes a big snowman. It's got a carrot nose!" }
                options: [{ object: snowman }, { object: house }, { object: kite }]
                answer: snowman
                hints:
                  - "Schau auf die Bilder. Es schneit."
                  - "Hör auf „She makes a big ...“."
                  - "„Snowman“ heißt Schneemann."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Worum geht es im Clip?"
                say: { de: "Schau und hör zu. Worum geht es im Clip?" }
                show: { objects: [whale, octopus] }
                audio: { en: "Look at the sea! There's a big whale. And here is an octopus. It's got eight legs." }
                options: ["Tiere im Meer", "Tiere im Zoo", "Tiere auf dem Bauernhof"]
                answer: "Tiere im Meer"
                hints: ["„Sea“ heißt Meer. Schau auf die Tiere."]
              - id: l1-s2
                type: audio_choice
                text: "Was macht Lily?"
                say: { de: "Schau und hör zu. Was macht Lily?" }
                show: { objects: [bread, milk] }
                audio: { en: "It's seven o'clock. Lily gets up. She has breakfast: bread and milk. Yum!" }
                options: ["Sie frühstückt.", "Sie geht schlafen.", "Sie spielt Fußball."]
                answer: "Sie frühstückt."
                hints: ["Schau auf Brot und Milch. Hör auf „breakfast“."]
              - id: l1-s3
                type: true_false
                text: "Geht es um einen Geburtstag?"
                say: { de: "Schau und hör zu. Geht es um einen Geburtstag?", en: "Happy birthday, Tom! Here's your cake. And here are your balloons. Now blow out the candles!" }
                show: { objects: [cake, balloon] }
                answer: true
                hints: ["Hörst du „Happy birthday“?"]
              - id: l1-s4
                type: audio_choice
                text: "Welches Tier mag Bananen?"
                say: { de: "Schau und hör zu. Welches Tier mag Bananen?" }
                show: { objects: [elephant, monkey] }
                audio: { en: "This is Ella the elephant. She is very big. And here is a monkey. He loves bananas!", speaker: male }
                options: [{ object: elephant }, { object: monkey }]
                answer: monkey
                feedback:
                  elephant: "Über Ella hörst du nur: „She is very big.“ Bananen mag der Affe."
                hints: ["Hör, was der Clip über jedes Tier sagt."]
              - id: l1-s5
                type: audio_choice
                text: "Was macht das Kind?"
                say: { de: "Schau und hör zu. Was macht das Kind?" }
                show: { objects: [scissors, crayon, kite] }
                audio: { en: "Let's make a kite! You need paper, scissors and crayons. Cut, colour, and it's ready!", speaker: female }
                options: ["Es bastelt einen Drachen.", "Es malt ein Haus.", "Es lässt einen Drachen steigen."]
                answer: "Es bastelt einen Drachen."
                feedback:
                  "Es lässt einen Drachen steigen.": "Der Drachen ist erst am Ende fertig. Hör auf „Let's make a kite“ und „scissors“."
                hints: ["Schau auf Schere und Stifte. „Make“ heißt machen."]
              - id: l1-s6
                type: audio_choice
                text: "Wie ist das Wetter?"
                say: { de: "Schau und hör zu. Wie ist das Wetter?" }
                show: { objects: [wind, kite] }
                audio: { en: "Here is the weather. Today it's very windy. It's a good day for a kite!" }
                options: [{ object: wind }, { object: snow }, { object: sun }]
                answer: wind
                hints: ["„Windy“ klingt fast wie Wind."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Worum geht es im Clip?"
                say: { de: "Schau und hör zu. Worum geht es im Clip?" }
                show: { objects: [pizza, cheese] }
                audio: { en: "Hi! Let's make a pizza. First the cheese. Then some tomatoes. Into the oven, and it's ready!", speaker: male }
                options: ["Jemand macht eine Pizza.", "Jemand isst ein Eis.", "Jemand kauft Käse."]
                answer: "Jemand macht eine Pizza."
              - id: l1-n2
                type: audio_choice
                text: "Wo ist Ben?"
                say: { de: "Schau und hör zu. Wo ist Ben?" }
                show: { objects: [cow, pig, goat] }
                audio: { en: "Hello! I'm Ben and this is my grandpa's farm. Look, a cow! And a pig! And this is my goat, Billy.", speaker: male }
                options: ["auf dem Bauernhof", "im Zoo", "am Meer"]
                answer: "auf dem Bauernhof"
              - id: l1-n3
                type: true_false
                text: "Ist Rex müde?"
                say: { de: "Schau und hör zu. Ist Rex müde?", en: "Sam and Rex play in the park. Rex runs and runs. Now Rex is very tired. He sleeps." }
                show: { objects: [dog, tired] }
                answer: true
              - id: l1-n4
                type: audio_choice
                text: "Wer ist langsam?"
                say: { de: "Schau und hör zu. Wer ist langsam?" }
                show: { objects: [snail, bird] }
                audio: { en: "Sammy the snail is slow. Bella the bird is fast." }
                options: [{ object: snail }, { object: bird }]
                answer: snail
              - id: l1-n5
                type: audio_choice
                text: "Was für ein Clip ist das?"
                say: { de: "Schau und hör zu. Was für ein Clip ist das?" }
                show: { objects: [snow, sun] }
                audio: { en: "Good evening! Here is the weather for tomorrow. In the morning it's snowing. In the afternoon it's sunny." }
                options: ["der Wetterbericht", "ein Kochclip", "eine Geburtstagsfeier"]
                answer: "der Wetterbericht"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Worum geht es im Clip?"
            say: { de: "Schau und hör zu. Worum geht es im Clip?" }
            show: { objects: [egg, cake] }
            audio: { en: "Today we're making a cake. First, three eggs. Mix, mix, mix. Here's our cake!", speaker: male }
            options: ["Jemand backt einen Kuchen.", "Jemand malt ein Bild.", "Jemand geht in den Zoo."]
            answer: "Jemand backt einen Kuchen."
          - id: l1-c2
            type: audio_choice
            text: "Wo sind die Tiere?"
            say: { de: "Schau und hör zu. Wo sind die Tiere?" }
            show: { objects: [whale, fish] }
            audio: { en: "Look at the sea! A big whale and lots of little fish." }
            options: ["im Meer", "im Zoo", "im Park"]
            answer: "im Meer"
          - id: l1-c3
            type: true_false
            text: "Schläft Bella, der Vogel?"
            say: { de: "Schau und hör zu. Schläft Bella, der Vogel?", en: "Bella the bird flies, but then she stops and sleeps." }
            show: { objects: [bird, snail] }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Worum geht es im Clip?"
            say: { de: "Schau und hör zu. Worum geht es im Clip?" }
            show: { objects: [snow, snowman] }
            audio: { en: "Look! It's snowing. The children make a snowman and play in the snow." }
            options: ["um einen Tag am Meer", "um einen Tag im Schnee", "um einen Geburtstag"]
            answer: "um einen Tag im Schnee"
          - id: l1-c5
            type: audio_choice
            text: "Wo spielt der Clip?"
            say: { de: "Schau und hör zu. Wo spielt der Clip?" }
            show: { objects: [tree, ball, dog] }
            audio: { en: "We're in the park. The children play football, and the dog runs after the ball.", speaker: female }
            options: ["im Zoo", "in der Küche", "im Park"]
            answer: "im Park"
          - id: l1-c6
            type: true_false
            text: "Geht es im Clip um das Wetter?"
            say: { de: "Schau und hör zu. Geht es im Clip um das Wetter?", en: "Here is the weather for today. It's sunny and hot!" }
            show: { objects: [sun] }
            answer: true

  - n: 2
    title: { de: Genau hinschauen und hinhören, en: Watching and listening for details }
    goal:
      de: "Hör im Clip genau hin, was passiert und was zuerst kommt, so wie first und then."
      en: "Listen closely in a clip for what happens and what comes first, like first and then."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Was für ein Clip ist das?"
            say: { de: "Schau und hör zu. Was für ein Clip ist das?" }
            show: { objects: [rain, sun] }
            audio: { en: "Here is the weather. Today it's raining." }
            options: ["der Wetterbericht", "ein Tierfilm", "ein Kochclip"]
            answer: "der Wetterbericht"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Wo sind die Kinder?"
            say: { de: "Schau und hör zu. Wo sind die Kinder?" }
            show: { objects: [giraffe, lion] }
            audio: { en: "Welcome to the zoo! Look at the giraffe!" }
            options: ["im Zoo", "in der Schule", "am Meer"]
            answer: "im Zoo"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: { de: "Jetzt schaust du genau hin. In einem Clip passiert oft eins nach dem anderen. Hör auf „first“, „then“ und „in the end“.", en: "First, Lily gets up. Then she has breakfast. In the end she goes to school by bus." }
            show: { objects: [bed, bread, bus] }
          - text: "first → then → in the end"
            say: { de: "„First“ heißt zuerst, „then“ heißt dann, „in the end“ heißt am Ende. Zuerst steht Lily auf, dann frühstückt sie, am Ende fährt sie mit dem Bus." }
          - say: { de: "Noch ein Beispiel. Wie ist das Wetter am Nachmittag? Hör bis zum Ende.", en: "In the morning it's sunny. In the afternoon it's raining." }
            show: { objects: [sun, rain] }
            text: "morning: sunny, afternoon: raining"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                option_audio: false
                text: "Bring die Bilder in die richtige Reihenfolge."
                say: { de: "Schau und hör zu. Bring die Bilder in die richtige Reihenfolge.", en: "Today we're making a cake. First, two eggs. Then some milk. Mix, mix, mix. In the end, a yummy cake!" }
                options: [{ object: cake }, { object: egg }, { object: milk }]
                slot_count: 3
                answer: [egg, milk, cake]
                hints:
                  - "Hör auf „first“. Was kommt zuerst?"
                  - "Zuerst hörst du „eggs“, dann „milk“."
                  - "Eier, Milch, Kuchen."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Wie ist das Wetter am Nachmittag?"
                say: { de: "Schau und hör zu. Wie ist das Wetter am Nachmittag?" }
                show: { objects: [sun, rain] }
                audio: { en: "Good morning! In the morning it's sunny. In the afternoon it's raining. Don't forget your jacket!" }
                options: [{ object: sun }, { object: rain }, { object: snow }]
                answer: rain
                feedback:
                  sun: "Sonnig ist es am Morgen. Hör weiter: „In the afternoon it's raining.“"
                hints:
                  - "„Afternoon“ heißt Nachmittag. Hör, was danach kommt."
                  - "Du hörst: „In the afternoon it's raining.“"
                  - "„It's raining“ heißt: Es regnet."
              - id: l2-f3
                type: audio_choice
                text: "Welches Tier ist groß und grau?"
                say: { de: "Schau und hör zu. Welches Tier ist groß und grau?" }
                show: { objects: [elephant, giraffe] }
                audio: { en: "This is Gus the giraffe. He's got a very long neck. And this is Ella the elephant. She's big and grey." }
                options: [{ object: elephant }, { object: giraffe }]
                answer: elephant
                feedback:
                  giraffe: "Über Gus hörst du: „a very long neck“. Groß und grau ist Ella, der Elefant."
                hints:
                  - "Beide Tiere sind im Bild. Hör, was der Clip über jedes sagt."
                  - "Hör auf „big and grey“."
                  - "Ella, der Elefant, ist groß und grau."
              - id: l2-f4
                type: audio_choice
                text: "Wie viele Eier braucht man?"
                say: { de: "Schau und hör zu. Wie viele Eier braucht man?" }
                show: { objects: [egg, cake] }
                audio: { en: "Let's make a cake. You need three eggs and some milk.", speaker: female }
                options: ["2", "3", "4"]
                answer: "3"
                hints:
                  - "Hör auf die Zahl vor „eggs“."
                  - "Du hörst: „three eggs“."
                  - "„Three“ heißt drei."
              - id: l2-f5
                type: true_false
                text: "Fährt Lily mit dem Fahrrad zur Schule?"
                say: { de: "Schau und hör zu. Fährt Lily mit dem Fahrrad zur Schule?", en: "First, Lily has breakfast. Then she goes to school by bus." }
                show: { objects: [bread, bus] }
                answer: false
                hints:
                  - "Schau auf das Bild. Siehst du ein Fahrrad?"
                  - "Du hörst „by bus“."
                  - "Nein, Lily fährt mit dem Bus."
              - id: l2-f6
                type: ordering
                option_audio: false
                text: "Bring die Bilder in die richtige Reihenfolge."
                say: { de: "Schau und hör zu. Bring die Bilder in die richtige Reihenfolge.", en: "Let's make a kite! First, cut with the scissors. Then colour it with crayons. In the end, fly your kite!" }
                options: [{ object: kite }, { object: crayon }, { object: scissors }]
                slot_count: 3
                answer: [scissors, crayon, kite]
                hints:
                  - "Hör auf „first“: Was brauchst du zuerst?"
                  - "Zuerst hörst du „scissors“, dann „crayons“."
                  - "Schere, Stifte, Drachen."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Wie heißt der Affe?"
                say: { de: "Schau und hör zu. Wie heißt der Affe?" }
                show: { objects: [monkey, banana] }
                audio: { en: "Look, here's our monkey. His name is Coco. He loves bananas!", speaker: male }
                options: ["Coco", "Ella", "Gus"]
                answer: "Coco"
                hints: ["Hör auf „His name is ...“."]
              - id: l2-s2
                type: ordering
                option_audio: false
                text: "Bring die Bilder in die richtige Reihenfolge."
                say: { de: "Schau und hör zu. Bring die Bilder in die richtige Reihenfolge.", en: "First, Tom eats some cake. Then he plays with his ball. In the end he goes to bed." }
                options: [{ object: bed }, { object: cake }, { object: ball }]
                slot_count: 3
                answer: [cake, ball, bed]
                hints: ["Hör auf „first“, „then“ und „in the end“."]
              - id: l2-s3
                type: audio_choice
                text: "Wie ist das Wetter am Morgen?"
                say: { de: "Schau und hör zu. Wie ist das Wetter am Morgen?" }
                show: { objects: [snow, sun] }
                audio: { en: "Here is the weather for Monday. In the morning it's snowing. In the afternoon it's sunny." }
                options: [{ object: snow }, { object: sun }, { object: rain }]
                answer: snow
                hints: ["„Morning“ heißt Morgen."]
              - id: l2-s4
                type: true_false
                text: "Hat der Krake acht Arme?"
                say: { de: "Schau und hör zu. Hat der Krake acht Arme?", en: "Look at the sea! Here is an octopus. It's got eight legs." }
                show: { objects: [octopus] }
                answer: true
                hints: ["„Eight“ heißt acht. Mit „legs“ meint der Clip die Arme des Kraken."]
              - id: l2-s5
                type: audio_choice
                text: "Was macht Bella am Ende?"
                say: { de: "Schau und hör zu. Was macht Bella am Ende?" }
                show: { objects: [bird, snail] }
                audio: { en: "Bella the bird flies very fast. Then she stops. In the end she sleeps under a tree." }
                options: ["Sie schläft.", "Sie fliegt.", "Sie isst."]
