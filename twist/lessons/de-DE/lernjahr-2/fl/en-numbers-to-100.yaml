# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-numbers-to-100
skill: fl.themes.numbers-to-100
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Zahlen bis 100 und Preise auf Englisch
  en: Numbers to 100 and prices in English
summary: >
  The tens and the two-digit numbers to 100, and prices in pence. Lesson
  1 brings twenty to a hundred and numbers like twenty-four, where English
  says the tens first, the other way round from German; lesson 2 asks
  "How much is it?" and answers with prices in pence, said the everyday
  British way ("It's forty-five p."), and ends with the skill check.
  Instructions are in German; children read numerals and the English is
  spoken and shown in short form.
metadata:
  year: lernjahr-2
  topic: { de: Zahlen, en: Numbers }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.numbers-to-20]
  also_practises: [fl.themes.food]
  vocabulary: { en: [twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety, a hundred, "How much is it?", "It's … p."] }
  forms: [audio, text, picture, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: german-order
      what: Hears "twenty-four" and takes it for 42, reading the order of German vierundzwanzig into it
      addressed: lesson 1 Learn says English names the tens first; every stage and both checks have a two-digit listening task with the swapped digits as an option (l1-f1, l1-s1, l1-n1, l1-c1, l2-f1, l2-s1, l2-n1, l2-c1, l2-c3) and a true_false card with the swapped digits (l1-f5, l1-n5, l2-f5, l2-n5), with feedback in l1-f1 and l2-f1
    - id: teen-ty
      what: Mixes up thirteen and thirty, fourteen and forty
      addressed: lesson 1 Learn sets thirteen against thirty; a -teen against -ty option set in every stage of lesson 1 (l1-f3, l1-s3, l1-n3) and in the skill check (l2-c2), and l2-n3 puts sixteen p against sixty p, with feedback in l1-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "twenty-four", en: "twenty-four" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Seventeen." }
            options: ["17", "7", "70"]
            answer: "17"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Twenty." }
            options: ["12", "20", "2"]
            answer: "20"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "20 twenty · 30 thirty · 40 forty · 50 fifty"
            say: { de: "Die Zehnerzahlen enden auf „ty“. Hör zu und sprich nach.", en: "Twenty. Thirty. Forty. Fifty." }
          - text: "60 sixty · 70 seventy · 80 eighty · 90 ninety · 100 a hundred"
            say: { en: "Sixty. Seventy. Eighty. Ninety. A hundred." }
          - text: "24 = twenty-four"
            say: { de: "Achtung: Auf Deutsch sagst du zuerst die Vier, dann die Zwanzig. Im Englischen kommt der Zehner zuerst:", en: "Twenty-four." }
          - text: "13 thirteen · 30 thirty"
            say: { de: "Hör gut hin: Bei „thirteen“ ist das Ende lang und betont. Bei „thirty“ ist das Ende kurz.", en: "Thirteen. Thirty." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Thirty-six." }
                options: ["36", "63", "30"]
                answer: "36"
                option_audio: false
                feedback:
                  "63": "Im Englischen kommt der Zehner zuerst: „thirty-six“ ist sechsunddreißig, 36."
                hints:
                  - "Hör auf das erste Wort: „thirty“."
                  - "Im Englischen kommt der Zehner zuerst. „Thirty“ ist dreißig."
                  - "Tippe auf die 36."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrem englischen Wort. Tippe auf ein Wort, um es zu hören."
                pairs:
                  - { left: { text: "50" }, right: { text: "fifty", say: { en: "Fifty." } } }
                  - { left: { text: "80" }, right: { text: "eighty", say: { en: "Eighty." } } }
                  - { left: { text: "100" }, right: { text: "a hundred", say: { en: "A hundred." } } }
                option_audio: false
                hints:
                  - "Hör dir jedes Wort an."
                  - "„Fifty“ fängt wie „five“ an."
                  - "50 ist „fifty“, 80 ist „eighty“, 100 ist „a hundred“."
              - id: l1-f3
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Forty." }
                options: ["14", "40", "4"]
                answer: "40"
                option_audio: false
                feedback:
                  "14": "Das wäre „fourteen“, mit langem „teen“. „Forty“ endet kurz auf „ty“: 40."
                hints:
                  - "Hör auf das Ende: lang oder kurz?"
                  - "Ist das Ende kurz, ist es eine Zehnerzahl."
                  - "Tippe auf die 40."
              - id: l1-f4
                type: speak
                say: { de: "Sag die Zahl auf Englisch.", en: "Fifty-two." }
                show: { drawn: letter-card, text: "52" }
                expected_text: fifty-two
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst den Zehner, dann die Einer."
                  - "Sag mit mir: fifty-two."
              - id: l1-f5
                type: true_false
                say: { de: "Hör zu. Passt das zur Zahl auf der Karte?", en: "Seventy-one." }
                show: { drawn: letter-card, text: "17" }
                answer: false
                hints:
                  - "Hör auf das erste Wort."
                  - "„Seventy“ ist siebzig. Der Zehner kommt zuerst."
                  - "Nein. „Seventy-one“ ist 71. Tippe auf Nein."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Eighty-five." }
                options: ["58", "85", "80"]
                answer: "85"
                option_audio: false
                hints: ["Welcher Teil kommt im Englischen zuerst?"]
              - id: l1-s2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrem englischen Wort. Tippe auf ein Wort, um es zu hören."
                pairs:
                  - { left: { text: "30" }, right: { text: "thirty", say: { en: "Thirty." } } }
                  - { left: { text: "60" }, right: { text: "sixty", say: { en: "Sixty." } } }
                  - { left: { text: "90" }, right: { text: "ninety", say: { en: "Ninety." } } }
                option_audio: false
                hints: ["Hör dir jedes Wort an."]
              - id: l1-s3
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Fifteen." }
                options: ["50", "15", "5"]
                answer: "15"
                option_audio: false
                hints: ["Lang oder kurz am Ende?"]
              - id: l1-s4
                type: speak
                say: { de: "Sag die Zahl auf Englisch.", en: "Forty-three." }
                show: { drawn: letter-card, text: "43" }
                expected_text: forty-three
                hints: ["Zuerst den Zehner."]
              - id: l1-s5
                type: true_false
                say: { de: "Hör zu. Passt das zur Zahl auf der Karte?", en: "Ninety-eight." }
                show: { drawn: letter-card, text: "98" }
                answer: true
                hints: ["Hör auf den Zehner und die Einer."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Sixty-seven." }
                options: ["76", "60", "67"]
                answer: "67"
                option_audio: false
              - id: l1-n2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrem englischen Wort. Tippe auf ein Wort, um es zu hören."
                pairs:
                  - { left: { text: "40" }, right: { text: "forty", say: { en: "Forty." } } }
                  - { left: { text: "70" }, right: { text: "seventy", say: { en: "Seventy." } } }
                  - { left: { text: "20" }, right: { text: "twenty", say: { en: "Twenty." } } }
                option_audio: false
              - id: l1-n3
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Eighteen." }
                options: ["18", "80", "81"]
                answer: "18"
                option_audio: false
              - id: l1-n4
                type: speak
                say: { de: "Wie heißt die Zahl auf Englisch? Sag sie." }
                show: { drawn: letter-card, text: "39" }
                expected_text: thirty-nine
              - id: l1-n5
                type: true_false
                say: { de: "Hör zu. Passt das zur Zahl auf der Karte?", en: "Twenty-seven." }
                show: { drawn: letter-card, text: "72" }
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu und tippe auf die Zahl." }
            audio: { en: "Forty-eight." }
            options: ["84", "48", "40"]
            answer: "48"
            option_audio: false
          - id: l1-c2
            type: audio_choice
            say: { de: "Hör zu und tippe auf die Zahl." }
            audio: { en: "Sixty." }
            options: ["16", "6", "60"]
            answer: "60"
            option_audio: false
          - id: l1-c3
            type: true_false
            say: { de: "Hör zu. Passt das zur Zahl auf der Karte?", en: "Fifty-four." }
            show: { drawn: letter-card, text: "54" }
            answer: true

  - n: 2
    title: { de: "How much is it?", en: "How much is it?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Seventy-three." }
            options: ["37", "73", "70"]
            answer: "73"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Thirteen." }
            options: ["13", "30", "31"]
            answer: "13"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "How much is the apple? It's 45p."
            say: { de: "In Großbritannien bezahlt man mit Pfund und Pence. So fragst du, was etwas kostet, und so antwortest du:", en: "How much is the apple? It's forty-five p." }
            show: { object: apple }
          - text: "60p = sixty p"
            say: { de: "Hinter dem Preis steht ein „p“. Das ist kurz für Pence. Du sagst die Zahl und dann „p“:", en: "Sixty p." }
          - text: "How much is the ice cream? It's 90p."
            say: { en: "How much is the ice cream? It's ninety p." }
            show: { object: ice-cream }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Wie viel kostet das Brot?" }
                audio: { en: "How much is the bread? It's seventy-five p." }
                show: { object: bread }
                options: ["75p", "57p", "70p"]
                answer: "75p"
                option_audio: false
                feedback:
                  "57p": "Im Englischen kommt der Zehner zuerst: „seventy-five p“ ist 75p."
                hints:
                  - "Hör auf die Zahl am Ende."
                  - "Der Zehner kommt zuerst: „seventy“ ist siebzig."
                  - "Tippe auf 75p."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie viel kostet das?"
                say: "Du möchtest wissen, wie viel etwas kostet. Was fragst du auf Englisch?"
                options: ["How much is it?", "How many is it?", "How old is it?"]
                answer: "How much is it?"
                option_audio: false
                feedback:
                  "How many is it?": "„How many“ fragt nach der Anzahl. Nach dem Preis fragst du mit „How much“."
                hints:
                  - "Für Preise gibt es eine feste Frage."
                  - "Sie beginnt mit „How much“."
                  - "Tippe auf „How much is it?“"
              - id: l2-f3
                type: audio_choice
                say: { de: "Hör zu. Was kostet dreißig Pence?" }
                audio: { en: "The banana is thirty p. The cake is ninety p." }
                options: [{ object: banana }, { object: cake }]
                answer: banana
                hints:
                  - "Hör auf „thirty“."
                  - "Was kommt vor „thirty p“?"
                  - "Tippe auf die Banane."
              - id: l2-f4
                type: speak
                say: { de: "Sag den Preis auf Englisch.", en: "It's sixty-five p." }
                show: { drawn: letter-card, text: "65p" }
                expected_text: "It's sixty-five p."
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „It's“, dann die Zahl, dann „p“."
                  - "Sag mit mir: It's sixty-five p."
              - id: l2-f5
                type: true_false
                say: { de: "Hör zu. Passt das zum Preis auf der Karte?", en: "It's twenty-nine p." }
                show: { drawn: letter-card, text: "92p" }
                answer: false
                hints:
                  - "Welcher Teil der Zahl kommt im Englischen zuerst?"
                  - "„Twenty“ ist zwanzig. Der Zehner kommt zuerst."
                  - "Nein. „Twenty-nine p“ ist 29p. Tippe auf Nein."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Wie viel kostet die Orange?" }
                audio: { en: "How much is the orange? It's fifty-two p." }
                show: { object: orange }
                options: ["25p", "50p", "52p"]
                answer: "52p"
                option_audio: false
                hints: ["Hör auf die Zahl am Ende."]
              - id: l2-s2
                type: ordering
                text: "Bau die Frage: Wie viel kostet der Apfel?"
                say: "Bau die Frage auf Englisch: Wie viel kostet der Apfel?"
                options: ["the apple?", "How", "is", "much"]
                slot_count: 4
                answer: ["How", "much", "is", "the apple?"]
                option_audio: false
                hints: ["Eine englische Frage fängt mit dem Fragewort an."]
              - id: l2-s3
                type: audio_choice
                say: { de: "Hör zu. Was kostet achtzig Pence?" }
                audio: { en: "The milk is eighty p. The juice is forty p." }
                options: [{ object: juice }, { object: milk }]
                answer: milk
                hints: ["Hör auf „eighty“."]
              - id: l2-s4
                type: speak
                say: { de: "Sag den Preis auf Englisch.", en: "It's thirty-eight p." }
                show: { drawn: letter-card, text: "38p" }
                expected_text: "It's thirty-eight p."
                hints: ["Zuerst „It's“, dann die Zahl."]
              - id: l2-s5
                type: true_false
                say: { de: "Hör zu. Passt das zum Preis auf der Karte?", en: "It's forty-one p." }
                show: { drawn: letter-card, text: "41p" }
                answer: true
                hints: ["Hör auf den Zehner und die Einer."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Wie viel kostet die Pizza?" }
                audio: { en: "How much is the pizza? It's ninety-six p." }
                show: { object: pizza }
                options: ["69p", "96p", "90p"]
                answer: "96p"
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Bau die Frage: Wie viel kostet das Eis?"
                say: "Bau die Frage auf Englisch: Wie viel kostet das Eis?"
                options: ["much", "the ice cream?", "is", "How"]
                slot_count: 4
                answer: ["How", "much", "is", "the ice cream?"]
                option_audio: false
              - id: l2-n3
                type: audio_choice
                say: { de: "Hör zu. Was kostet sechzig Pence?" }
                audio: { en: "The cheese is sixteen p. The bread is sixty p." }
                options: [{ object: cheese }, { object: bread }]
                answer: bread
              - id: l2-n4
                type: speak
                say: { de: "Wie viel kostet es? Sag den Preis auf Englisch mit „It's“." }
                show: { drawn: letter-card, text: "74p" }
                expected_text: "It's seventy-four p."
              - id: l2-n5
                type: true_false
                say: { de: "Hör zu. Passt das zum Preis auf der Karte?", en: "It's eighty-three p." }
                show: { drawn: letter-card, text: "38p" }
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu und tippe auf die Zahl." }
            audio: { en: "Ninety-one." }
            options: ["19", "91", "90"]
            answer: "91"
            option_audio: false
          - id: l2-c2
            type: audio_choice
            say: { de: "Hör zu und tippe auf die Zahl." }
            audio: { en: "Fourteen." }
            options: ["40", "4", "14"]
            answer: "14"
            option_audio: false
          - id: l2-c3
            type: audio_choice
            say: { de: "Hör zu. Wie viel kostet der Kuchen?" }
            audio: { en: "How much is the cake? It's sixty-two p." }
            show: { object: cake }
            options: ["26p", "62p", "60p"]
            answer: "62p"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "„How much is the juice?“ Welche Antwort passt?"
            say: { de: "Im Laden fragt ein Kind nach dem Preis. Welche Antwort passt?", en: "How much is the juice?" }
            show: { object: juice }
            options: ["It's forty p.", "Yes, I do.", "I like juice."]
            answer: "It's forty p."
            option_audio: false
          - id: l2-c5
            type: true_false
            say: { de: "Hör zu. Passt das zur Zahl auf der Karte?", en: "Thirty-five." }
            show: { drawn: letter-card, text: "35" }
            answer: true
