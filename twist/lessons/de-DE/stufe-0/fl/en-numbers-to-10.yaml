            show: { drawn: dots, count: 6, layout: dice }
          - say: { en: "Seven." }
            show: { drawn: dots, count: 7, layout: dice }
          - say: { en: "Eight." }
            show: { drawn: dots, count: 8, layout: dice }
          - say: { en: "Nine." }
            show: { drawn: dots, count: 9, layout: dice }
          - say: { en: "Ten." }
            show: { drawn: dots, count: 10, layout: dice }
          - text: "Wusstest du?"
            say: { de: "Wusstest du? Nach ten kommt auf Englisch eleven, so wie bei uns nach zehn die Elf. Elf und eleven sind uralte Wörter und heißen eigentlich: eins übrig. Wer an seinen zehn Fingern zählt, hat bei elf eins übrig!", en: "Ten. Eleven." }
            show: { object: hand, count: 2 }
          - say: { de: "Mit „How many?“ fragst du, wie viele es sind.", en: "How many apples? Six apples." }
            show: { object: apple, count: 6 }

