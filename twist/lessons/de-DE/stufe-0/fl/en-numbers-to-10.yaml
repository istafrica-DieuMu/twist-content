              - { drawn: dots, count: 2, layout: dice }
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 3, layout: dice }
            answer: "3"
          - id: l1-c4
            type: audio_choice
            text: "Tippe auf das Bild mit so vielen Bällen."
            say: { de: "Hör zu. Tippe auf das Bild mit so vielen Bällen." }
