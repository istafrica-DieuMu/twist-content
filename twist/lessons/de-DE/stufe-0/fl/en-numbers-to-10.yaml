                show: { drawn: dots, count: 2, layout: dice }
                answer: false
                hints: ["Zähl die Punkte."]
              - id: l1-s5
                type: audio_choice
                text: "Tippe auf die passenden Punkte."
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Three." }
                options:
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                answer: "3"
                hints: ["Hör noch einmal: three. Wie heißt das auf Deutsch?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tippe auf die passenden Punkte."
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "One." }
                options:
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                answer: "1"
              - id: l1-n2
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Two." }
                show: { drawn: dots, count: 2, layout: dice }
                expected_text: two
              - id: l1-n3
                type: audio_choice
                text: "Tippe auf die passenden Punkte."
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Three." }
                options:
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                answer: "3"
              - id: l1-n4
                type: true_false
                text: "Passt die Zahl zu den Punkten?"
                say: { de: "Hör zu. Passt die Zahl zu den Punkten?", en: "Five." }
                show: { drawn: dots, count: 5, layout: dice }
                answer: true
              - id: l1-n5
                type: audio_choice
                text: "Tippe auf die passenden Punkte."
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Four." }
