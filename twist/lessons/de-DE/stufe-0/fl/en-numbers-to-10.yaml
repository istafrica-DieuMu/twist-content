              - id: l2-n2
                type: audio_choice
                text: "Tippe auf das passende Bild."
                say: { de: "Hör zu. Tippe auf das passende Bild." }
                audio: { en: "How many apples? Nine apples." }
                options:
                  - { object: apple, count: 9 }
                  - { object: apple, count: 7 }
                  - { object: apple, count: 5 }
                answer: "9"
              - id: l2-n3
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Eight." }
                show: { drawn: dots, count: 8, layout: dice }
                expected_text: eight
              - id: l2-n4
                type: true_false
                text: "Passt die Zahl zu den Punkten?"
                say: { de: "Hör zu. Passt die Zahl zu den Punkten?", en: "Six." }
                show: { drawn: dots, count: 6, layout: dice }
                answer: true
              - id: l2-n5
                type: audio_choice
                text: "Tippe auf die passenden Punkte."
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Two." }
                options:
                  - { drawn: dots, count: 2, layout: dice }
