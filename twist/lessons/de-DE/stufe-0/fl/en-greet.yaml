# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-greet
skill: fl.speaking.greet
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: "Hallo, wie geht's?"
  en: "Hello, how are you?"
summary: >
  Children greet someone and keep the conversation going. Lesson 1 asks
  How are you? and answers I'm fine, thank you, I'm OK or I'm sad, then
  asks back with And you? Lesson 2 adds I'm Mia for the name, How old are
  you? and I'm seven, puts a whole greeting together from hello to
  goodbye, and ends with the skill check. Hello, goodbye, please and thank
  you come from the Hello lessons and are used here in short exchanges.
  Speaking is practised and not marked; the checks ask whether a reply
  fits. Oral only: nothing is read.
metadata:
  year: stufe-0
  topic: { de: Sprechen, en: Speaking }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: [fl.speaking.imitate]
  also_practises: [fl.themes.hello, fl.themes.numbers-to-10, fl.speaking.imitate]
  vocabulary: { en: ["How are you?", "I'm fine, thank you.", "I'm OK.", "And you?", "How old are you?", "I'm seven.", "I'm Mia.", hello, hi, goodbye, bye, happy, sad, tired] }
  no_reading: true
  forms: [audio, picture, drawn]
  drawn: [dots]
  facets: []
  parts:
    - { id: how, what: { de: "fragen, wie es jemandem geht, und darauf antworten", en: asking how someone is and answering } }
    - { id: age, what: { de: "nach dem Alter fragen und sagen, wie alt man ist", en: asking someone's age and saying your own } }
    - { id: name, what: { de: den eigenen Namen sagen und verstehen, en: saying and understanding a name } }
    - { id: hello-bye, what: { de: im Gespräch begrüßen und verabschieden, en: saying hello and goodbye in a conversation } }
  misconceptions:
    - id: wrong-question
      what: Mixes up How are you? and How old are you?, and answers one with the reply to the other (How are you? I'm seven.)
      addressed: lesson 2 Learn sets the two questions side by side; a "Passt die Antwort?" task in every stage of lesson 2 crosses them (l2-f4, l2-s3, l2-n4), with feedback in l2-f4, and the skill check crosses them again (l2-c5)
    - id: answer-not-question
      what: Answers How are you? with a name or a goodbye because only hello is recognised
      addressed: lesson 1 sets How are you? against a name, What's your name? and Goodbye (l1-f4, l1-s4, l1-n2, l1-c3), with feedback in l1-f4
    - id: no-question-back
      what: Answers but never asks back, so the talk stops
      addressed: lesson 1 models And you? in Learn and has the child say it in l1-s3 and l1-n3
    - id: german-sound
      what: Says the phrases with German sounds (Senk ju, Hau ar ju)
      addressed: every phrase is heard before the child says it (l1-w1, l1-f5); the full-stage hints point at the th in thank you (l1-f5)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "How are you?", en: "How are you?" }
    goal:
      de: "Frag jemanden, wie es ihm geht, und antworte selbst, zum Beispiel mit I'm fine, thank you."
      en: "Ask someone how they are and answer yourself, like I'm fine, thank you."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: speak
            text: "Hör zu und sprich genau nach. Denk an die Zunge bei th."
            say: { de: "Hör zu und sprich genau nach. Denk an die Zunge bei th.", en: "Thank you." }
            expected_text: thank you
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Hör genau hin. Welches Wort hörst du?"
            say: { de: "Hör genau hin. Welches Wort hörst du?" }
            audio: { en: "Mouth." }
            options: [{ object: mouse }, { object: mouth }]
            answer: mouth
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör mal, ein Kind fragt dich etwas. Was glaubst du: Will es wissen, wie du heißt, oder wie es dir geht?", en: "Hello! How are you?" }
            show: { objects: [happy, sad] }
          - say: { de: "Wie es dir geht! Wenn du jemanden triffst, sagst du Hallo und fragst oft gleich, wie es ihm geht:", en: "Hello! How are you?" }
            show: { object: child }
          - say: { de: "Geht es dir gut, sagst du:", en: "I'm fine, thank you." }
            show: { object: happy }
          - say: { de: "Oder ganz kurz:", en: "I'm OK." }
            show: { object: happy }
          - say: { de: "Geht es dir nicht so gut, sagst du zum Beispiel:", en: "I'm sad. I'm tired." }
            show: { object: sad }
          - say: { de: "Dann fragst du zurück: Und dir? Auf Englisch sagst du:", en: "I'm fine, thank you. And you?" }
          - text: "Wusstest du?"
            say: { de: "Wusstest du? Auch in Neuseeland sprechen die Menschen Englisch. Dort gibt es noch eine ganz alte Begrüßung der Maori: Zwei Menschen drücken sanft Nase und Stirn aneinander. Sie heißt Hongi." }
            show: { object: nose }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Fragt hier jemand, wie es dir geht?"
                say: { de: "Hör zu. Fragt hier jemand, wie es dir geht?", en: "How are you?" }
                answer: true
                hints:
                  - "Hör noch einmal: How are you?"
                  - "Das sagt man gleich nach dem Hallo."
                  - "Ja. „How are you?“ heißt: Wie geht es dir?"
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Wie geht es dem Kind? Tippe auf das Bild."
                say: { de: "Hör zu. Wie geht es dem Kind? Tippe auf das Bild." }
                audio: { turns: [{ en: "How are you?", speaker: female }, { en: "I'm fine, thank you.", speaker: male }] }
                options: [{ object: happy }, { object: sad }, { object: tired }]
                answer: happy
                feedback:
                  sad: "Das Kind sagt „I'm fine“. Es geht ihm gut."
                hints:
                  - "Hör auf die Antwort nach der Frage."
                  - "„I'm fine“ heißt: Mir geht es gut."
                  - "Tippe auf das fröhliche Kind."
              - id: l1-f3
                type: speak
                text: "Frag deinen Freund auf Englisch, wie es ihm geht."
                say: { de: "Frag deinen Freund auf Englisch, wie es ihm geht.", en: "How are you?" }
                expected_text: how are you
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Drei kurze Wörter: how … are … you."
                  - "Sag mit mir: How are you?"
              - id: l1-f4
                type: true_false
                text: "Passt die Antwort?"
                say: { de: "Hör zu. Passt die Antwort?" }
                audio: { turns: [{ en: "How are you?", speaker: female }, { en: "My name is Tom.", speaker: male }] }
                answer: false
                feedback:
                  "true": "Tom sagt seinen Namen. Auf „How are you?“ sagst du, wie es dir geht, zum Beispiel „I'm fine“."
                hints:
                  - "Hör auf die Frage und dann auf die Antwort."
                  - "Die Frage heißt: Wie geht es dir? Sagt Tom, wie es ihm geht?"
                  - "Nein. Tom sagt nur seinen Namen."
              - id: l1-f5
                type: speak
                text: "Dir geht es gut. Antworte auf Englisch."
                say: { de: "Dir geht es gut. Antworte auf Englisch.", en: "I'm fine, thank you." }
                show: { object: happy }
                expected_text: "I'm fine, thank you"
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Bei „thank you“ liegt die Zunge kurz zwischen den Zähnen."
                  - "Sag mit mir: I'm fine, thank you."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Wie geht es dem Kind? Tippe auf das Bild."
                say: { de: "Hör zu. Wie geht es dem Kind? Tippe auf das Bild." }
                audio: { turns: [{ en: "Hi, Ben! How are you?", speaker: female }, { en: "I'm tired.", speaker: male }] }
                options: [{ object: happy }, { object: tired }, { object: angry }]
                answer: tired
                hints: ["Hör auf die Antwort am Ende: I'm tired. Das Kind ist müde."]
              - id: l1-s2
                type: true_false
                text: "Passt die Antwort?"
                say: { de: "Hör zu. Passt die Antwort?" }
                audio: { turns: [{ en: "How are you?", speaker: male }, { en: "I'm fine, thank you. And you?", speaker: female }] }
                answer: true
                hints: ["Sagt das Kind, wie es ihm geht?"]
              - id: l1-s3
                type: speak
                text: "Frag zurück, wie es deiner Freundin geht."
                say: { de: "Frag zurück, wie es deiner Freundin geht.", en: "And you?" }
                expected_text: and you
                hints: ["Zwei kurze Wörter: and … you."]
              - id: l1-s4
                type: true_false
                text: "Fragt hier jemand, wie es dir geht?"
                say: { de: "Hör zu. Fragt hier jemand, wie es dir geht?", en: "What's your name?" }
                answer: false
                hints: ["Hörst du „How are you?“ oder „What's your name?“"]
              - id: l1-s5
                type: speak
                text: "Begrüß Oma und frag, wie es ihr geht."
                say: { de: "Begrüß Oma und frag, wie es ihr geht.", en: "Hello, Grandma! How are you?" }
                show: { object: grandma }
                expected_text: "hello, grandma, how are you"
                hints: ["Erst „Hello, Grandma!“, dann „How are you?“"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Wie geht es dem Kind? Tippe auf das Bild."
                say: { de: "Hör zu. Wie geht es dem Kind? Tippe auf das Bild." }
                audio: { turns: [{ en: "How are you, Mia?", speaker: male }, { en: "I'm sad.", speaker: female }] }
                options: [{ object: happy }, { object: scared }, { object: sad }]
                answer: sad
              - id: l1-n2
                type: true_false
                text: "Passt die Antwort?"
                say: { de: "Hör zu. Passt die Antwort?" }
                audio: { turns: [{ en: "How are you?", speaker: female }, { en: "Goodbye!", speaker: male }] }
                answer: false
              - id: l1-n3
                type: speak
                text: "Dir geht es gut. Antworte und frag zurück."
                say: { de: "Dir geht es gut. Antworte und frag zurück.", en: "I'm fine, thank you. And you?" }
                show: { object: happy }
                expected_text: "I'm fine, thank you. And you?"
              - id: l1-n4
                type: true_false
                text: "Fragt hier jemand, wie es dir geht?"
                say: { de: "Hör zu. Fragt hier jemand, wie es dir geht?", en: "Hi, Lena! How are you today?" }
                answer: true
              - id: l1-n5
                type: speak
                text: "Frag auf Englisch, wie es jemandem geht."
                say: { de: "Frag auf Englisch, wie es jemandem geht." }
                show: { object: child }
                expected_text: "How are you?"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Passt die Antwort?"
            say: { de: "Hör zu. Passt die Antwort?" }
            audio: { turns: [{ en: "How are you?", speaker: male }, { en: "I'm OK.", speaker: female }] }
            answer: true
          - id: l1-c2
            type: audio_choice
            text: "Wie geht es dem Kind? Tippe auf das Bild."
            say: { de: "Hör zu. Wie geht es dem Kind? Tippe auf das Bild." }
            audio: { turns: [{ en: "How are you?", speaker: male }, { en: "I'm fine, thank you.", speaker: female }] }
            options: [{ object: sad }, { object: happy }, { object: tired }]
            answer: happy
          - id: l1-c3
            type: true_false
            text: "Fragt hier jemand, wie es dir geht?"
            say: { de: "Hör zu. Fragt hier jemand, wie es dir geht?", en: "Goodbye!" }
            answer: false
          - id: l1-c4
            type: audio_choice
            text: "Wie geht es dem Mädchen? Tippe auf das Bild."
            say: { de: "Hör zu. Wie geht es dem Mädchen? Tippe auf das Bild." }
            audio: { turns: [{ en: "Good morning, Lisa! How are you?", speaker: male }, { en: "I'm OK. And you?", speaker: female }] }
            options: [{ object: sad }, { object: tired }, { object: happy }]
            answer: happy
          - id: l1-c5
            type: true_false
            text: "Fragt Tom zurück, wie es ihr geht?"
            say: { de: "Hör zu. Fragt Tom zurück, wie es ihr geht?" }
            audio: { turns: [{ en: "How are you, Tom?", speaker: female }, { en: "I'm fine, thank you. And you?", speaker: male }] }
            answer: true
          - id: l1-c6
            type: true_false
            text: "Ben ist müde. Passt seine Antwort?"
            say: { de: "Ben ist müde. Hör zu. Passt seine Antwort?" }
            audio: { turns: [{ en: "How are you, Ben?", speaker: female }, { en: "I'm fine, thank you.", speaker: male }] }
            show: { object: tired }
            answer: false

  - n: 2
    title: { de: "I'm Mia. I'm seven.", en: "I'm Mia. I'm seven." }
    goal:
      de: "Sag auf Englisch, wie du heißt und wie alt du bist, so wie I'm seven."
      en: "Say in English what your name is and how old you are, like I'm seven."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Weißt du noch? Wie geht es dem Kind?"
            say: { de: "Weißt du noch? Wie geht es dem Kind?" }
            audio: { turns: [{ en: "How are you?", speaker: female }, { en: "I'm sad.", speaker: male }] }
            options: [{ object: happy }, { object: sad }]
            answer: sad
            difficulty: easy
          - id: l2-w2
            type: speak
            text: "Weißt du noch? Frag, wie es jemandem geht."
            say: { de: "Weißt du noch? Frag, wie es jemandem geht.", en: "How are you?" }
            expected_text: how are you
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör mal, Mia sagt etwas über sich. Was glaubst du: Sagt sie, wie sie heißt, oder wie alt sie ist?", en: "Hello! I'm Mia." }
            show: { object: girl }
          - say: { de: "Wie sie heißt! Deinen Namen kannst du ganz kurz sagen, mit „I'm“:", en: "Hello! I'm Mia." }
            show: { object: girl }
          - say: { de: "So fragst du, wie alt jemand ist:", en: "How old are you?" }
            show: { object: boy }
          - say: { de: "Und so sagst du, wie alt du bist:", en: "I'm seven." }
            show: { drawn: dots, count: 7, layout: dice }
          - say: { de: "Pass auf, die beiden Fragen klingen ähnlich. „How are you?“ heißt: Wie geht es dir? „How old are you?“ heißt: Wie alt bist du?", en: "How are you? How old are you?" }
          - say: { de: "Hör dir ein ganzes Gespräch an. Tom und Mia lernen sich kennen:", en: "Hello! I'm Tom. What's your name? Hi, Tom! I'm Mia. How old are you? I'm seven. Bye, Mia! Goodbye, Tom!" }
            show: { objects: [boy, girl] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Fragt hier jemand, wie alt du bist?"
                say: { de: "Hör zu. Fragt hier jemand, wie alt du bist?", en: "How old are you?" }
                answer: true
                hints:
                  - "Hör noch einmal: How old are you?"
                  - "Hörst du das Wort „old“? Es klingt fast wie alt."
                  - "Ja. „How old are you?“ heißt: Wie alt bist du?"
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Wie alt ist das Kind? Tippe auf die Punkte."
                say: { de: "Hör zu. Wie alt ist das Kind? Tippe auf die Punkte." }
                audio: { turns: [{ en: "How old are you?", speaker: female }, { en: "I'm six.", speaker: male }] }
                options:
                  - { drawn: dots, count: 8, layout: dice }
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                answer: "6"
                feedback:
                  "3": "Das sind drei Punkte. Das Kind sagt „six“, das ist sechs."
                hints:
                  - "Hör auf die Zahl am Ende."
                  - "„Six“ klingt fast wie sechs."
                  - "Tippe auf die sechs Punkte."
              - id: l2-f3
                type: speak
                text: "Sag auf Englisch, wie alt du bist."
                say: { de: "Sag, wie alt du bist. Zum Beispiel so:", en: "I'm seven." }
                expected_text: "I'm seven"
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Erst „I'm“, dann deine Zahl."
                  - "Sag mit mir: I'm seven. Oder sag dein eigenes Alter."
              - id: l2-f4
                type: true_false
                text: "Passt die Antwort?"
                say: { de: "Hör zu. Passt die Antwort?" }
                audio: { turns: [{ en: "How old are you?", speaker: male }, { en: "I'm fine, thank you.", speaker: female }] }
                answer: false
                feedback:
                  "true": "Die Frage war „How old are you?“, also: Wie alt bist du? Darauf sagst du eine Zahl, zum Beispiel „I'm seven“."
                hints:
                  - "Hörst du „old“ in der Frage?"
                  - "Die Frage heißt: Wie alt bist du? Sagt das Kind eine Zahl?"
                  - "Nein. „I'm fine“ ist die Antwort auf „How are you?“"
              - id: l2-f5
                type: true_false
                text: "Sagt hier ein Kind seinen Namen?"
                say: { de: "Hör zu. Sagt hier ein Kind seinen Namen?" }
                audio: { en: "Hi! I'm Leo.", speaker: male }
                answer: true
                hints:
                  - "Hör auf das Ende: I'm Leo."
                  - "Nach „I'm“ kann ein Name kommen."
                  - "Ja. Das Kind heißt Leo."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Wie alt ist das Kind? Tippe auf die Punkte."
                say: { de: "Hör zu. Wie alt ist das Kind? Tippe auf die Punkte." }
                audio: { turns: [{ en: "How old are you?", speaker: male }, { en: "I'm eight.", speaker: female }] }
                options:
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 8, layout: dice }
                answer: "8"
                hints: ["„Eight“ klingt fast wie acht."]
              - id: l2-s2
                type: speak
                text: "Frag ein Kind auf Englisch, wie alt es ist."
                say: { de: "Frag ein Kind auf Englisch, wie alt es ist.", en: "How old are you?" }
                expected_text: how old are you
                hints: ["Vergiss das „old“ nicht: How old are you?"]
              - id: l2-s3
                type: true_false
                text: "Passt die Antwort?"
                say: { de: "Hör zu. Passt die Antwort?" }
                audio: { turns: [{ en: "How old are you?", speaker: female }, { en: "I'm seven.", speaker: male }] }
                answer: true
                hints: ["Die Frage heißt: Wie alt bist du? Sagt das Kind eine Zahl?"]
              - id: l2-s4
                type: true_false
                text: "Sagt hier jemand, wie alt er ist?"
                say: { de: "Hör zu. Sagt hier jemand, wie alt er ist?" }
                audio: { en: "Hello! I'm Sam.", speaker: male }
                answer: false
                hints: ["Hörst du eine Zahl oder einen Namen?"]
              - id: l2-s5
                type: speak
                text: "Stell dich vor. Sag Hallo und deinen Namen."
                say: { de: "Stell dich vor. Sag Hallo und deinen Namen. Zum Beispiel so:", en: "Hello! I'm Mia." }
                show: { object: girl }
                expected_text: "Hello! I'm Mia."
                hints: ["Erst „Hello!“, dann „I'm“ und dein Name."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Wie alt ist das Kind? Tippe auf die Punkte."
                say: { de: "Hör zu. Wie alt ist das Kind? Tippe auf die Punkte." }
                audio: { en: "I'm Ella. I'm seven.", speaker: female }
                options:
                  - { drawn: dots, count: 7, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                answer: "7"
              - id: l2-n2
                type: true_false
                text: "Fragt hier jemand, wie alt du bist?"
                say: { de: "Hör zu. Fragt hier jemand, wie alt du bist?", en: "How are you?" }
                answer: false
              - id: l2-n3
                type: speak
                text: "Stell dir vor, du bist sechs. Sag es auf Englisch."
                say: { de: "Stell dir vor, du bist sechs. Sag es auf Englisch." }
                show: { drawn: dots, count: 6, layout: dice }
                expected_text: "I'm six."
              - id: l2-n4
                type: true_false
                text: "Passt die Antwort?"
                say: { de: "Hör zu. Passt die Antwort?" }
                audio: { turns: [{ en: "How old are you?", speaker: female }, { en: "I'm OK.", speaker: male }] }
                answer: false
              - id: l2-n5
                type: speak
                text: "Ein neues Kind kommt in deine Klasse. Begrüß es, sag deinen Namen und frag nach seinem Namen."
                say: { de: "Ein neues Kind kommt in deine Klasse. Begrüß es, sag deinen Namen und frag nach seinem Namen.", en: "Hello! I'm Mia. What's your name?" }
                show: { object: child }
                expected_text: "Hello! I'm Mia. What's your name?"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: how
            type: audio_choice
            text: "Wie geht es dem Jungen? Tippe auf das Bild."
            say: { de: "Hör zu. Wie geht es dem Jungen? Tippe auf das Bild." }
            audio: { turns: [{ en: "Hello, Max! How are you?", speaker: female }, { en: "I'm tired today.", speaker: male }] }
            options: [{ object: tired }, { object: happy }, { object: sad }]
            answer: tired
          - id: l2-c2
            part: age
            type: true_false
            text: "Ben sagt, wie alt er ist. Ist er 8?"
            say: { de: "Ben sagt, wie alt er ist. Hör zu. Ist er acht?" }
            audio: { turns: [{ en: "How old are you, Ben?", speaker: female }, { en: "I'm eight.", speaker: male }] }
            answer: true
          - id: l2-c3
            part: age
            type: audio_choice
            text: "Wie alt ist das Mädchen? Tippe auf die Punkte."
            say: { de: "Hör zu. Wie alt ist das Mädchen? Tippe auf die Punkte." }
            audio: { en: "Hi! I'm Nora. I'm six.", speaker: female }
            options:
              - { drawn: dots, count: 6, layout: dice }
              - { drawn: dots, count: 9, layout: dice }
              - { drawn: dots, count: 2, layout: dice }
            answer: "6"
          - id: l2-c4
            part: how
            type: audio_choice
            text: "Wie geht es dem Jungen? Tippe auf das Bild."
            say: { de: "Hör zu. Wie geht es dem Jungen? Tippe auf das Bild." }
            audio: { turns: [{ en: "Good morning, Leo! How are you?", speaker: female }, { en: "I'm fine, thank you. And you?", speaker: male }] }
            options: [{ object: angry }, { object: happy }, { object: sad }]
            answer: happy
          - id: l2-c5
            part: how
            type: true_false
