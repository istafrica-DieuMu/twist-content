            show: { objects: [carrot, leaf] }
          - say: { de: "Die Möhre! Vier neue Farben. Hör zu und sprich nach.", en: "Orange." }
            show: { object: crayon, colour: orange }
          - say: { en: "Purple." }
            show: { object: crayon, colour: purple }
          - say: { en: "Pink." }
            show: { object: crayon, colour: pink }
          - say: { en: "Brown." }
            show: { object: crayon, colour: brown }
          - text: "Wusstest du?"
            say: { de: "Wusstest du? Die Farbe Orange hat ihren Namen von der Frucht, der Orange. Bevor die ersten Orangen nach England kamen, sagten die Leute dort zu dieser Farbe einfach gelbrot." }
            show: { object: orange }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "„Purple“ oder „pink“? Tippe auf die Farbe."
                say: { de: "„Purple“ oder „pink“? Tippe auf die Farbe." }
                audio: { en: "Purple." }
                options:
                  - { drawn: colour-swatch, colour: pink }
                  - { drawn: colour-swatch, colour: purple }
                answer: purple
                feedback:
                  pink: "Das ist „pink“. „Purple“ ist dunkler, wie eine Pflaume."
                hints:
                  - "Hör noch einmal: purple."
                  - "„Purple“ ist die dunklere Farbe, wie eine Pflaume."
