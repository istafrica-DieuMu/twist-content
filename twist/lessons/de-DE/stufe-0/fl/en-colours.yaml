                answer: pink
                feedback:
                  purple: "Das ist „purple“, die dunklere Farbe. „Pink“ ist heller."
                hints:
                  - "Hör noch einmal: pink."
                  - "„Pink“ ist die hellere Farbe."
                  - "Tippe auf Rosa."

          - support: some
