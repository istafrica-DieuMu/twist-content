                  - { object: t-shirt, colour: blue }
                answer: purple
              - id: l2-n2
                type: audio_choice
                text: "Tippe auf den Luftballon in dieser Farbe."
                say: { de: "Hör zu. Tippe auf den Luftballon in dieser Farbe." }
                audio: { en: "Pink." }
                options:
                  - { object: balloon, colour: orange }
                  - { object: balloon, colour: purple }
                  - { object: balloon, colour: pink }
                answer: pink
              - id: l2-n3
