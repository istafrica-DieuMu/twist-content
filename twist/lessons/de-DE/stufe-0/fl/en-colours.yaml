                answer: carrot
                hints:
                  - "Hör noch einmal: orange."
                  - "Orange ist die Farbe einer Möhre."
                  - "Tippe auf die Möhre."
                difficulty: easy
              - id: l2-f3
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Pink." }
                show: { object: crayon, colour: pink }
                expected_text: pink
                hints:
                  - "Hör noch einmal: pink."
                  - "Es ist ganz kurz, wie im Deutschen: pink."
                  - "Sag mit mir: pink."
                difficulty: easy
              - id: l2-f4
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Brown." }
                show: { object: crayon, colour: brown }
                expected_text: brown
                hints:
                  - "Hör noch einmal: brown."
                  - "Es klingt fast wie braun auf Deutsch."
                  - "Sag mit mir: brown."
              - id: l2-f5
                type: matching
                text: "Was passt zusammen? Tippe auf eine Farbe und dann auf das Bild."
                say: { de: "Was passt zusammen? Tippe auf eine Farbe und dann auf das Bild." }
                pairs:
                  - left: { drawn: colour-swatch, colour: orange, say: { en: "Orange." } }
                    right: { object: carrot }
                  - left: { drawn: colour-swatch, colour: purple, say: { en: "Purple." } }
                    right: { object: octopus }
                  - left: { drawn: colour-swatch, colour: brown, say: { en: "Brown." } }
                    right: { object: dog }
                hints:
                  - "Tippe auf eine Farbe und hör zu."
                  - "Die Möhre ist orange. Auf Englisch: orange."
                  - "Der Oktopus ist lila: „purple“. Der Hund ist braun: „brown“."
              - id: l2-f6
                type: audio_choice
                text: "„Purple“ oder „pink“? Tippe auf die Farbe."
                say: { de: "„Purple“ oder „pink“? Tippe auf die Farbe." }
                audio: { en: "Pink." }
                options:
