              - id: l2-n5
                type: sorting
                text: "Sortiere die Bilder nach Farben."
                say: { de: "Sortiere die Bilder nach Farben.", en: "Orange. Brown." }
                bins:
                  - { id: orange, show: { drawn: colour-swatch, colour: orange }, say: { en: "Orange." } }
                  - { id: brown, show: { drawn: colour-swatch, colour: brown }, say: { en: "Brown." } }
