# Model lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-colours
skill: fl.themes.colours
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Farben auf Englisch
  en: Colours in English
summary: >
  Eight colours, heard and said before they are ever read. Stufe 0 is oral
  only: every task can be done without reading. Instructions are spoken in
  German, the colour words in English. Lesson 1 brings red, blue, yellow and
  green; lesson 2 adds orange, purple, pink and brown and ends with the
  skill check. Practice runs in three stages: full hints, one hint, no
  hints, and the last stage puts the colours on things. Each lesson also
  pairs colours with things that have them (matching) and sorts pictures by
  colour (sorting); tapping a colour says its English name. Saying a
  colour aloud is covered in Practise and not marked; the checks ask the
  child to find the colour or the thing that has it, or to say whether a
  colour word fits a picture.
metadata:
  year: stufe-0
  topic: { de: Farben, en: Colours }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: [fl.speaking.imitate, fl.listening.classroom-phrases]
  vocabulary:
    { en: [red, blue, yellow, green, orange, purple, pink, brown, colour] }
  no_reading: true
  forms: [audio, picture, drawn]
  drawn: [colour-swatch]
  facets: []
  parts:
    - { id: first, what: { de: "Rot, Blau, Gelb und Grün auf Englisch verstehen", en: "understanding red, blue, yellow and green" } }
    - { id: new, what: { de: "Orange, Lila, Rosa und Braun auf Englisch verstehen", en: "understanding orange, purple, pink and brown" } }
    - { id: things, what: { de: "verstehen, welche Farbe ein Ding hat", en: understanding what colour something is } }
  misconceptions:
    - id: german-sound
      what: Says English colour words with German sounds (rot for red, "blau" for blue)
      addressed: every word is heard before the child says it; speak tasks replay the model, and their hints break the word into its start and end
    - id: purple-pink
      what: Mixes up purple and pink
      addressed: lesson 2 sets them side by side in every stage
  twist_reuse: []
  status: draft
  version: 2
  authored: 2026-10-12

lessons:
  - n: 1
    title: { de: "Red, blue, yellow, green", en: "Red, blue, yellow, green" }
    goal:
      de: "Hör vier Farben auf Englisch und finde sie, so wie red für Rot oder green für Grün."
      en: "Hear four colours in English and find them, like red or green."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör mal, eine Farbe auf Englisch. Was glaubst du: Hat die Erdbeere diese Farbe oder der Frosch?", en: "Red." }
            show: { objects: [strawberry, frog] }
          - say: { de: "Die Erdbeere! Sie ist rot. Hör zu und sprich nach.", en: "Red." }
            show: { object: crayon, colour: red }
          - say: { en: "Blue." }
            show: { object: crayon, colour: blue }
          - say: { en: "Yellow." }
            show: { object: crayon, colour: yellow }
          - say: { en: "Green." }
            show: { object: crayon, colour: green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tippe auf die Farbe."
                say: { de: "Hör zu. Tippe auf die Farbe." }
                audio: { en: "Red." }
                options:
                  - { drawn: colour-swatch, colour: red }
                  - { drawn: colour-swatch, colour: blue }
                  - { drawn: colour-swatch, colour: green }
                answer: red
                hints:
                  - "Hör noch einmal: red."
                  - "„Red“ ist die Farbe einer Erdbeere."
                  - "Tippe auf Rot."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tippe auf die Farbe."
                say: { de: "Hör zu. Tippe auf die Farbe." }
                audio: { en: "Yellow." }
                options:
                  - { drawn: colour-swatch, colour: blue }
                  - { drawn: colour-swatch, colour: yellow }
                  - { drawn: colour-swatch, colour: red }
                answer: yellow
                hints:
                  - "Hör noch einmal: yellow."
                  - "„Yellow“ ist die Farbe einer Banane."
                  - "Tippe auf Gelb."
                difficulty: easy
              - id: l1-f3
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Blue." }
                show: { object: crayon, colour: blue }
                expected_text: blue
                hints:
                  - "Hör noch einmal zu: blue."
                  - "Es fängt an wie Blume, dann kommt ein langes u: bluuu."
                  - "Sag mit mir: blue."
                difficulty: easy
              - id: l1-f4
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Green." }
                options: [{ object: banana }, { object: frog }, { object: strawberry }]
                answer: frog
                feedback:
                  banana: "Diese Banane ist gelb. Wäre sie grün, könntest du sie noch nicht essen! „Green“ ist der Frosch."
                hints:
                  - "Hör noch einmal: green."
                  - "„Green“ ist die Farbe von Gras."
                  - "Der Frosch ist grün."
              - id: l1-f5
                type: speak
                text: "Welche Farbe hat die Banane? Sag es auf Englisch."
                say: { de: "Welche Farbe hat die Banane? Sag es auf Englisch." }
                show: { object: banana }
                expected_text: yellow
                hints:
                  - "Die Banane ist gelb."
                  - "Gelb heißt auf Englisch „yel…“?"
                  - "Sag mit mir: yellow."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tippe auf die Farbe."
                say: { de: "Hör zu. Tippe auf die Farbe." }
                audio: { en: "Blue." }
                options:
                  - { drawn: colour-swatch, colour: green }
                  - { drawn: colour-swatch, colour: blue }
                  - { drawn: colour-swatch, colour: yellow }
                answer: blue
                hints: ["„Blue“ ist die Farbe vom Himmel."]
              - id: l1-s2
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Red." }
                options: [{ object: strawberry }, { object: frog }, { object: banana }]
                answer: strawberry
                hints: ["Was davon ist rot?"]
              - id: l1-s3
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Green." }
                show: { object: crayon, colour: green }
                expected_text: green
                hints: ["Hör noch einmal: green. Das ee klingt wie ein langes i: griin."]
              - id: l1-s4
                type: audio_choice
                text: "Tippe auf den Ball in dieser Farbe."
                say: { de: "Hör zu. Tippe auf den Ball in dieser Farbe." }
                audio: { en: "Yellow." }
                options:
                  - { object: ball, colour: red }
                  - { object: ball, colour: blue }
                  - { object: ball, colour: yellow }
                answer: yellow
                hints: ["„Yellow“ ist die Farbe der Sonne."]
              - id: l1-s5
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Red." }
                show: { object: crayon, colour: red }
                expected_text: red
                hints: ["Hör noch einmal: red. Ganz kurz."]
              - id: l1-s6
                type: matching
                text: "Was passt zusammen? Tippe auf eine Farbe und dann auf das Bild."
                say: { de: "Was passt zusammen? Tippe auf eine Farbe und dann auf das Bild." }
                pairs:
                  - left: { drawn: colour-swatch, colour: yellow, say: { en: "Yellow." } }
                    right: { object: banana }
                  - left: { drawn: colour-swatch, colour: green, say: { en: "Green." } }
                    right: { object: frog }
                  - left: { drawn: colour-swatch, colour: red, say: { en: "Red." } }
                    right: { object: strawberry }
                hints: ["Tippe auf eine Farbe und hör zu. Welches Bild hat diese Farbe?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Yellow." }
                options: [{ object: frog }, { object: strawberry }, { object: sun }]
                answer: sun
              - id: l1-n2
                type: audio_choice
                text: "Tippe auf das Auto in dieser Farbe."
                say: { de: "Hör zu. Tippe auf das Auto in dieser Farbe." }
                audio: { en: "Blue." }
                options:
                  - { object: car, colour: red }
                  - { object: car, colour: blue }
                  - { object: car, colour: yellow }
                answer: blue
              - id: l1-n3
                type: speak
                text: "Welche Farbe hat der Frosch? Sag es auf Englisch."
                say: { de: "Welche Farbe hat der Frosch? Sag es auf Englisch." }
                show: { object: frog }
                expected_text: green
              - id: l1-n4
                type: audio_choice
                text: "Tippe auf den Luftballon in dieser Farbe."
                say: { de: "Hör zu. Tippe auf den Luftballon in dieser Farbe." }
                audio: { en: "Red." }
                options:
                  - { object: balloon, colour: green }
                  - { object: balloon, colour: blue }
                  - { object: balloon, colour: red }
                answer: red
              - id: l1-n5
                type: audio_choice
                text: "Tippe auf das Blatt in dieser Farbe."
                say: { de: "Hör zu. Tippe auf das Blatt in dieser Farbe." }
                audio: { en: "Green." }
                options:
                  - { object: leaf, colour: green }
                  - { object: leaf, colour: yellow }
                  - { object: leaf, colour: red }
                answer: green
                difficulty: easy
              - id: l1-n6
                type: sorting
                text: "Sortiere die Bilder nach Farben."
                say: { de: "Sortiere die Bilder nach Farben.", en: "Red. Green." }
                bins:
                  - { id: red, show: { drawn: colour-swatch, colour: red }, say: { en: "Red." } }
                  - { id: green, show: { drawn: colour-swatch, colour: green }, say: { en: "Green." } }
                options:
                  - { object: strawberry, bin: red }
                  - { object: frog, bin: green }
                  - { object: apple, bin: red }
                  - { object: leaf, bin: green }
                difficulty: stretch

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Tippe auf die Farbe."
            say: { de: "Hör zu. Tippe auf die Farbe." }
            audio: { en: "Blue." }
            options:
              - { drawn: colour-swatch, colour: yellow }
              - { drawn: colour-swatch, colour: green }
              - { drawn: colour-swatch, colour: blue }
            answer: blue
          - id: l1-c2
            type: audio_choice
            text: "Tippe auf die Farbe."
            say: { de: "Hör zu. Tippe auf die Farbe." }
            audio: { en: "Green." }
            options:
              - { drawn: colour-swatch, colour: green }
              - { drawn: colour-swatch, colour: red }
            answer: green
          - id: l1-c3
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Red." }
            options: [{ object: banana }, { object: frog }, { object: strawberry }]
            answer: strawberry
          - id: l1-c4
            type: true_false
            text: "Passt die Farbe?"
            say: { de: "Hör zu. Passt die Farbe?" }
            audio: { en: "Red." }
            show: { object: apple }
            answer: true
          - id: l1-c5
            type: audio_choice
            text: "Tippe auf den Ball in dieser Farbe."
            say: { de: "Hör zu. Tippe auf den Ball in dieser Farbe." }
            audio: { en: "Green." }
            options:
              - { object: ball, colour: yellow }
              - { object: ball, colour: green }
              - { object: ball, colour: red }
            answer: green
          - id: l1-c6
            type: true_false
            text: "Passt die Farbe?"
            say: { de: "Hör zu. Passt die Farbe?" }
            audio: { en: "Blue." }
            show: { object: sun }
            answer: false

