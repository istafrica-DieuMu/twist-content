          - id: l1-c2
            type: true_false
            text: "Passt das Wort zum Bild?"
            say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Grandpa." }
            show: { object: dad }
            answer: false
          - id: l1-c3
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Grandma." }
            options: [{ object: grandma }, { object: dad }, { object: baby }]
            answer: grandma
          - id: l1-c4
            type: audio_choice
            text: "Welches Bild passt?"
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "Mum." }
            options: [{ object: dad }, { object: grandpa }, { object: mum }]
