# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-family
skill: fl.themes.family
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Meine Familie auf Englisch
  en: My family in English
summary: >
  Family words in English and introducing your family with "This is my
  …". Stufe 0 is oral only: instructions are spoken in German, the words
  in English. Lesson 1 brings mum, dad, baby, grandma and grandpa; lesson
  2 adds brother and sister, "This is my …", and ends with the skill check.
  Introducing your own family aloud is covered in Practise and not
  marked; the checks ask who a child is introducing.
metadata:
  year: stufe-0
  topic: { de: Familie, en: Family }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: [fl.speaking.imitate]
  vocabulary: { en: [mum, dad, baby, grandma, grandpa, brother, sister, family, "This is my …"] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: family, what: { de: "Mama, Papa, Baby, Oma und Opa auf Englisch verstehen", en: "understanding mum, dad, baby, grandma and grandpa" } }
    - { id: siblings, what: { de: Bruder und Schwester auf Englisch verstehen, en: understanding brother and sister } }
    - { id: introduce, what: { de: "verstehen, wen jemand mit „This is my …“ vorstellt", en: "understanding who someone introduces with “This is my …”" } }
  misconceptions:
    - id: brother-sister
      what: Mixes up brother and sister
      addressed: lesson 2 sets the boy and the girl side by side in an audio task in every stage, with feedback in l2-f1
    - id: grandma-grandpa
      what: Mixes up grandma and grandpa
      addressed: both appear in one audio task in every stage of lesson 1, with feedback in l1-f2; lesson 2 sets them side by side again in l2-s2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Mum, dad, grandma, grandpa", en: "Mum, dad, grandma, grandpa" }
    goal:
      de: "Lerne, wie Mama, Papa, Oma und Opa auf Englisch heißen, zum Beispiel grandma."
      en: "Learn the English words for Mama, Papa, Oma and Opa, like grandma."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör zu und sprich nach.", en: "Mum." }
            show: { object: mum }
          - say: { en: "Dad." }
            show: { object: dad }
          - say: { en: "Grandma." }
            show: { object: grandma }
          - say: { en: "Grandpa." }
            show: { object: grandpa }
          - say: { en: "Baby." }
            show: { object: baby }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Dad." }
                options: [{ object: dad }, { object: mum }, { object: baby }]
                answer: dad
                hints:
                  - "Hör noch einmal: dad."
                  - "„Dad“ ist der Papa."
                  - "Tippe auf den Papa."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Grandpa." }
                options: [{ object: grandma }, { object: grandpa }, { object: dad }]
                answer: grandpa
                feedback:
                  grandma: "Das ist „grandma“, die Oma. „Grandpa“ ist der Opa."
                hints:
                  - "Hör auf das Ende: grand-pa."
                  - "„Grandpa“ ist der Opa, „grandma“ die Oma."
                  - "Tippe auf den Opa."
              - id: l1-f3
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Mum." }
                show: { object: mum }
                expected_text: mum
                hints:
                  - "Hör noch einmal: mum."
                  - "Ein kurzes Wort. Das u klingt fast wie a."
                  - "Sag mit mir: mum."
              - id: l1-f4
                type: true_false
                text: "Passt das Wort zum Bild?"
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Baby." }
                show: { object: baby }
                answer: true
                hints:
                  - "Hör noch einmal: baby."
                  - "Das Wort kennst du auch auf Deutsch."
                  - "Tippe auf Ja."
              - id: l1-f5
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Grandma." }
                options: [{ object: grandma }, { object: grandpa }, { object: mum }]
                answer: grandma
                hints:
                  - "Hör auf das Ende: grand-ma."
                  - "„Grandma“ ist die Oma."
                  - "Tippe auf die Oma."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Mum." }
                options: [{ object: grandma }, { object: mum }, { object: baby }]
                answer: mum
                hints: ["Hör noch einmal: mum. Es klingt ein bisschen wie Mama."]
              - id: l1-s2
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Grandpa." }
                options: [{ object: dad }, { object: grandma }, { object: grandpa }]
                answer: grandpa
                hints: ["Hör auf das Ende des Wortes."]
              - id: l1-s3
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Dad." }
                show: { object: dad }
                expected_text: dad
                hints: ["Hör noch einmal: dad. Das a ist breit, fast wie ä."]
              - id: l1-s4
                type: true_false
                text: "Passt das Wort zum Bild?"
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Grandma." }
                show: { object: mum }
                answer: false
                hints: ["Hör noch einmal: grandma. Wer ist auf dem Bild?"]
              - id: l1-s5
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Baby." }
                options: [{ object: baby }, { object: dad }, { object: grandpa }]
                answer: baby
                hints: ["Das Wort klingt fast wie im Deutschen."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Grandma." }
                options: [{ object: mum }, { object: grandpa }, { object: grandma }]
                answer: grandma
              - id: l1-n2
                type: speak
                text: "Wie heißt das auf Englisch? Sag es laut."
                say: { de: "Wie heißt das auf Englisch? Sag es laut." }
                show: { object: grandpa }
                expected_text: grandpa
              - id: l1-n3
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Dad." }
                options: [{ object: baby }, { object: dad }, { object: grandma }]
                answer: dad
              - id: l1-n4
                type: true_false
                text: "Passt das Wort zum Bild?"
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Dad." }
                show: { object: dad }
                answer: true
              - id: l1-n5
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Mum." }
                options: [{ object: mum }, { object: baby }, { object: grandpa }]
                answer: mum

      - activity: check
