                  - "Hör noch einmal: mouse."
                  - "„Mouse“ klingt fast wie Maus."
                  - "Tippe auf die Maus."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
