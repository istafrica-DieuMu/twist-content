  - n: 2
    title: { de: "A bird can fly.", en: "A bird can fly." }
    goal:
      de: "Hör, was ein Tier kann, und sag es selbst auf Englisch, so wie A bird can fly."
      en: "Hear what an animal can do and say it yourself in English, like A bird can fly."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör zu und sprich nach. Was kann der Vogel?", en: "A bird can fly." }
            show: { object: bird }
          - say: { de: "Was kann der Fisch?", en: "A fish can swim." }
            show: { object: fish }
          - say: { de: "Was kann der Frosch?", en: "A frog can jump." }
            show: { object: frog }
          - say: { de: "„Can“ heißt „kann“. „Fly“ heißt fliegen, „swim“ heißt schwimmen und „jump“ heißt springen." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Wer kann das? Tippe auf das Bild."
                say: { de: "Hör zu. Wer kann das? Tippe auf das Bild." }
                audio: { en: "It can fly." }
                options: [{ object: bird }, { object: fish }, { object: snake }]
                answer: bird
                hints:
                  - "„Fly“ heißt fliegen."
                  - "Wer von den dreien hat Flügel?"
                  - "Tippe auf den Vogel."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das?"
                say: { de: "Hör zu. Stimmt das?", en: "A fish can fly." }
                show: { object: fish }
                answer: false
                feedback:
                  "true": "Ein Fisch kann nicht fliegen. „A fish can swim“: Ein Fisch kann schwimmen."
                hints:
                  - "Hör noch einmal: A fish can fly. „Fly“ heißt fliegen."
                  - "Kann ein Fisch fliegen?"
                  - "Tippe auf Nein. Ein Fisch kann schwimmen."
              - id: l2-f3
                type: speak
                text: "Was kann der Vogel? Sag es auf Englisch."
                say: { de: "Was kann der Vogel? Sag es auf Englisch." }
                show: { object: bird }
                expected_text: a bird can fly
                hints:
                  - "Der Vogel kann fliegen. Fliegen heißt „fly“."
                  - "Fang so an: A bird can …"
                  - "Sag mit mir: A bird can fly."
              - id: l2-f4
                type: audio_choice
                text: "Wer kann das? Tippe auf das Bild."
                say: { de: "Hör zu. Wer kann das? Tippe auf das Bild." }
                audio: { en: "It can swim." }
