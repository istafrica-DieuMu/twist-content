                show: { object: frog }
                answer: true
                hints:
                  - "„Swim“ heißt schwimmen."
                  - "Ein Frosch springt. Kann er im Teich auch schwimmen?"
                  - "Tippe auf Ja. Ein Frosch kann springen und schwimmen."

          - support: some
