# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-animals
skill: fl.themes.outside-animals
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Tiere und Natur auf Englisch
  en: Animals and nature in English
summary: >
  Animals and things outside in English, and what an animal can do (A
  bird can fly.). Stufe 0 is oral only: instructions are spoken in German,
  the words in English. Lesson 1 brings bird, fish, frog, snake, mouse and
  tree, sun, cloud; lesson 2 says what animals can do (fly, swim, jump),
  with "It can …" riddles and true or false "can" sentences, and ends with
  the skill check. Naming the animals aloud is covered in Practise and
  not marked; the checks ask the child to find the picture or say
  whether a sentence is true.
metadata:
  year: stufe-0
  topic: { de: Tiere und Natur, en: Animals and nature }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: [fl.speaking.imitate, fl.speaking.name-things]
  vocabulary: { en: [bird, fish, frog, snake, mouse, tree, sun, cloud, fly, swim, jump, can] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: animals, what: { de: Tiere auf Englisch verstehen, en: understanding animal words in English } }
    - { id: nature, what: { de: Dinge in der Natur auf Englisch verstehen, en: understanding words for things in nature } }
    - { id: can, what: { de: "verstehen, was ein Tier kann", en: understanding what an animal can do } }
  misconceptions:
    - id: german-sound
      what: Says English words with German sounds (a German r in frog, an e for the ei in snake)
      addressed: every word is heard before the child says it; the speak hint for frog (l1-s3) points to the soft English r, and the hint for snake (l1-s1) to its ei
    - id: can-all
      what: Hears the animal that is in the picture and answers Ja without listening to what it can do (A fish can fly.)
      addressed: lesson 2 has a false "can" sentence about the animal in the picture in every stage (l2-f2, l2-s2, l2-n4), with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Bird, fish, frog", en: "Bird, fish, frog" }
    goal:
      de: "Hör gut zu und tippe auf das richtige Tier oder Bild, zum Beispiel frog oder tree."
      en: "Listen carefully and tap the right animal or picture, like frog or tree."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör zu und sprich nach.", en: "Bird." }
            show: { object: bird }
          - say: { en: "Fish." }
            show: { object: fish }
          - say: { en: "Frog." }
            show: { object: frog }
          - say: { en: "Snake." }
            show: { object: snake }
          - say: { en: "Mouse." }
            show: { object: mouse }
          - say: { de: "Und das siehst du draußen.", en: "Tree." }
            show: { object: tree }
          - say: { en: "Sun." }
            show: { object: sun }
          - say: { en: "Cloud." }
            show: { object: cloud }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Frog." }
                options: [{ object: frog }, { object: fish }, { object: bird }]
                answer: frog
                hints:
                  - "Hör noch einmal: frog."
                  - "„Frog“ ist der Frosch."
                  - "Tippe auf den Frosch."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Bird." }
                options: [{ object: snake }, { object: bird }, { object: mouse }]
                answer: bird
                hints:
                  - "Hör noch einmal: bird."
                  - "„Bird“ ist der Vogel."
                  - "Tippe auf den Vogel."
              - id: l1-f3
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Fish." }
                show: { object: fish }
                expected_text: fish
                hints:
                  - "Hör noch einmal: fish."
                  - "Es klingt fast wie Fisch auf Deutsch."
                  - "Sag mit mir: fish."
              - id: l1-f4
                type: true_false
                text: "Passt das Wort zum Bild?"
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Sun." }
                show: { object: sun }
                answer: true
                hints:
                  - "Hör noch einmal: sun."
                  - "„Sun“ ist die Sonne."
