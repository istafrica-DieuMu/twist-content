            answer: boat
          - id: l2-c4
            part: rhyme
            type: audio_choice
            text: "Wie geht der Reim weiter? Tippe auf das Bild."
            say: { de: "Hör zu. Wie geht der Reim weiter? Tippe auf das Bild." }
            audio: { en: "A cat in a …" }
            options: [{ object: boat }, { object: hat }, { object: tree }]
            answer: hat
          - id: l2-c5
            part: rhyme
            type: true_false
