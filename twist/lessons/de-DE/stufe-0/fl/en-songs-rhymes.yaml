# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-songs-rhymes
skill: fl.listening.songs-rhymes
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Reime und Mitmachverse
  en: Rhymes and chants
summary: >
  Two short chants written for Twist. Lesson 1 is an action chant (Clap,
  clap, clap your hands, jump, jump, jump up high, stand up, sit down, wave
  and say goodbye!): children hear a line and tap the movement that goes
  with it, then say what comes next. Lesson 2 is a rhyme chant (A cat in a
  hat, a bee in a tree, a mouse in a house, and a goat in a boat!):
  children find where each animal is, finish a line with the rhyming word
  and speak along, and it ends with the skill check. Oral only: nothing is
  read. Speaking along is covered in Practise and not marked; the checks
  ask for the movement, the next line, where an animal is and which words
  rhyme.
metadata:
  year: stufe-0
  topic: { de: Hören, en: Listening }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: [fl.listening.familiar-words]
  also_practises: [fl.speaking.imitate, fl.listening.classroom-phrases]
  vocabulary: { en: [clap, hands, jump, high, stand up, sit down, wave, goodbye, cat, hat, bee, tree, mouse, house, goat, boat] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: actions, what: { de: zu einer Zeile des Mitmachreims die passende Bewegung finden, en: finding the movement that goes with a line of the action chant } }
    - { id: order, what: { de: "wissen, was im Mitmachreim als Nächstes kommt", en: knowing what comes next in the action chant } }
    - { id: where, what: { de: "verstehen, wo jedes Tier im Reim ist", en: understanding where each animal is in the rhyme } }
    - { id: rhyme, what: { de: "hören, welche Wörter sich reimen", en: hearing which words rhyme } }
  misconceptions:
    - id: every-word
      what: Gives up on a chant because not every word is understood
      addressed: both Learns say that the pictures and movements help and that not every word has to be understood; every line of the chant comes with its picture before the child is asked about it
    - id: rhyme-from-line
      what: Finishes a rhyme line with a word from another line (A bee in a house) instead of the word that rhymes
      addressed: every stage of lesson 2 has a "Wie geht der Reim weiter?" task with the other chant words as options; l2-f2 gives feedback on house, and a "Reimt sich das?" task in every stage sets rhyming against non-rhyming pairs
    - id: line-order
      what: Knows the words but not the order of the chant, so cannot join in
      addressed: every stage of lesson 1 asks "Was kommt danach?" after a chant line (l1-f5, l1-s4, l1-n3, l1-n5), with feedback in l1-f5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Clap your hands", en: "Clap your hands" }
    goal:
      de: "Hör den Mitmachreim, mach die Bewegungen dazu und sprich mit, so wie Clap your hands."
      en: "Listen to the action chant, do the moves and say it with us, like Clap your hands."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Hand." }
            options: [{ object: hand }, { object: house }]
            answer: hand
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Mouse." }
            options: [{ object: fish }, { object: mouse }]
            answer: mouse
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör dir einen Mitmachreim an. Du musst nicht jedes Wort verstehen. Die Bilder und die Bewegungen helfen dir.", en: "Clap, clap, clap your hands, jump, jump, jump up high, stand up, sit down, wave and say goodbye!" }
          - say: { de: "Hier klatschst du in die Hände:", en: "Clap, clap, clap your hands." }
            show: { object: clap }
          - say: { de: "Hier springst du hoch:", en: "Jump, jump, jump up high." }
            show: { object: jump }
          - say: { de: "Erst stehst du auf, dann setzt du dich hin:", en: "Stand up, sit down." }
            show: { object: stand-up }
          - say: { de: "Zum Schluss winkst du und sagst Tschüss:", en: "Wave and say goodbye!" }
            show: { object: wave }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Was machst du dazu?"
                say: { de: "Hör zu. Was machst du dazu?" }
                audio: { en: "Clap, clap, clap your hands." }
                options: [{ object: clap }, { object: jump }, { object: wave }]
                answer: clap
                hints:
                  - "Hör noch einmal: Clap, clap, clap your hands."
                  - "„Hands“ sind die Hände. Was machst du mit den Händen?"
                  - "Tippe auf das Kind, das klatscht."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Was machst du dazu?"
                say: { de: "Hör zu. Was machst du dazu?" }
                audio: { en: "Jump, jump, jump up high." }
                options: [{ object: sit-down }, { object: jump }, { object: clap }]
                answer: jump
                feedback:
                  sit-down: "„Sit down“ heißt: Setz dich hin. Bei „jump“ springst du hoch."
                hints:
                  - "Hör noch einmal: Jump, jump, jump up high."
                  - "„High“ heißt hoch. Wie kommst du hoch?"
                  - "Tippe auf das Kind, das springt."
              - id: l1-f3
                type: speak
                text: "Sprich mit und klatsch dabei."
                say: { de: "Sprich mit und klatsch dabei.", en: "Clap, clap, clap your hands." }
                show: { object: clap }
                expected_text: "clap, clap, clap your hands"
                hints:
                  - "Hör noch einmal zu."
                  - "Dreimal „clap“, dann „your hands“."
                  - "Sag mit mir: Clap, clap, clap your hands."
              - id: l1-f4
                type: true_false
                text: "Passt das Bild?"
                say: { de: "Hör zu. Passt das Bild?", en: "Wave and say goodbye!" }
                show: { object: wave }
                answer: true
                hints:
                  - "Hör noch einmal: Wave and say goodbye!"
                  - "„Goodbye“ heißt Tschüss. Was machst du mit der Hand, wenn du Tschüss sagst?"
                  - "Ja, das Kind winkt. Tippe auf Ja."
              - id: l1-f5
                type: audio_choice
                text: "Was kommt danach? Tippe auf das Bild."
                say: { de: "Hör zu. Was kommt danach? Tippe auf das Bild." }
                audio: { en: "Stand up, …" }
                options: [{ object: sit-down }, { object: stand-up }, { object: jump }]
                answer: sit-down
                feedback:
                  stand-up: "Aufstehen kam gerade. Danach setzt du dich wieder hin: sit down."
                hints:
                  - "Sag den Reim leise mit: Stand up, …"
                  - "Erst stehst du auf. Was machst du danach?"
                  - "Danach kommt „sit down“. Tippe auf das Kind, das sich hinsetzt."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Was machst du dazu?"
                say: { de: "Hör zu. Was machst du dazu?" }
                audio: { en: "Stand up, stand up!" }
                options: [{ object: stand-up }, { object: sit-down }, { object: clap }]
                answer: stand-up
                feedback:
                  sit-down: "Hier setzt sich das Kind hin. „Stand up“ heißt: Steh auf."
                hints: ["„Stand“ klingt fast wie stehen."]
              - id: l1-s2
                type: true_false
                text: "Passt das Bild?"
                say: { de: "Hör zu. Passt das Bild?", en: "Jump, jump, jump up high." }
                show: { object: clap }
                answer: false
                hints: ["Klatscht oder springt das Kind bei „jump“?"]
              - id: l1-s3
                type: speak
                text: "Sprich mit und spring dabei."
                say: { de: "Sprich mit und spring dabei.", en: "Jump, jump, jump up high." }
                show: { object: jump }
                expected_text: "jump, jump, jump up high"
                hints: ["Dreimal „jump“, dann „up high“."]
              - id: l1-s4
                type: audio_choice
                text: "Was kommt danach? Tippe auf das Bild."
                say: { de: "Hör zu. Was kommt danach? Tippe auf das Bild." }
                audio: { en: "Clap, clap, clap your hands, …" }
                options: [{ object: jump }, { object: wave }, { object: sit-down }]
                answer: jump
                hints: ["Nach dem Klatschen kommt das Springen."]
              - id: l1-s5
                type: audio_choice
                text: "Was machst du dazu?"
                say: { de: "Hör zu. Was machst du dazu?" }
                audio: { en: "Wave and say goodbye!" }
                options: [{ object: point }, { object: wave }, { object: listen }]
                answer: wave
                hints: ["„Goodbye“ heißt Tschüss."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Was machst du dazu?"
                say: { de: "Hör zu. Was machst du dazu?" }
                audio: { en: "Sit down, sit down!" }
                options: [{ object: stand-up }, { object: jump }, { object: sit-down }]
                answer: sit-down
              - id: l1-n2
                type: true_false
                text: "Passt das Bild?"
                say: { de: "Hör zu. Passt das Bild?", en: "Wave and say goodbye!" }
                show: { object: jump }
                answer: false
              - id: l1-n3
                type: audio_choice
                text: "Was kommt danach? Tippe auf das Bild."
                say: { de: "Hör zu. Was kommt danach? Tippe auf das Bild." }
                audio: { en: "Jump, jump, jump up high, …" }
                options: [{ object: stand-up }, { object: clap }, { object: wave }]
                answer: stand-up
              - id: l1-n4
                type: speak
                text: "Jetzt sprichst du den ganzen Reim mit. Mach die Bewegungen dazu."
                say: { de: "Jetzt sprichst du den ganzen Reim mit. Mach die Bewegungen dazu.", en: "Clap, clap, clap your hands, jump, jump, jump up high, stand up, sit down, wave and say goodbye!" }
                expected_text: "clap, clap, clap your hands, jump, jump, jump up high, stand up, sit down, wave and say goodbye"
              - id: l1-n5
                type: audio_choice
                text: "Was kommt danach? Tippe auf das Bild."
                say: { de: "Hör zu. Was kommt danach? Tippe auf das Bild." }
                audio: { en: "Stand up, sit down, …" }
                options: [{ object: wave }, { object: clap }, { object: jump }]
                answer: wave

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Was machst du dazu?"
            say: { de: "Hör zu. Was machst du dazu?" }
            audio: { en: "Jump, jump, jump up high." }
            options: [{ object: wave }, { object: jump }, { object: stand-up }]
            answer: jump
          - id: l1-c2
            type: true_false
            text: "Passt das Bild?"
            say: { de: "Hör zu. Passt das Bild?", en: "Clap, clap, clap your hands." }
            show: { object: clap }
            answer: true
          - id: l1-c3
            type: audio_choice
            text: "Was kommt danach? Tippe auf das Bild."
            say: { de: "Hör zu. Was kommt danach? Tippe auf das Bild." }
            audio: { en: "Stand up, …" }
            options: [{ object: clap }, { object: sit-down }, { object: wave }]
            answer: sit-down
          - id: l1-c4
            type: audio_choice
            text: "Was machst du dazu?"
            say: { de: "Hör zu. Was machst du dazu?" }
            audio: { en: "Clap, clap!" }
            options: [{ object: jump }, { object: clap }, { object: stand-up }]
            answer: clap
          - id: l1-c5
            type: true_false
            text: "Passt das Bild?"
            say: { de: "Hör zu. Passt das Bild?" }
            audio: { en: "Stand up, stand up!" }
            show: { object: stand-up }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "Was kommt danach? Tippe auf das Bild."
            say: { de: "Hör zu. Was kommt danach? Tippe auf das Bild." }
            audio: { en: "Clap, clap, clap your hands, jump, jump, jump up high, stand up, sit down, …" }
            options: [{ object: clap }, { object: wave }, { object: jump }]
            answer: wave

  - n: 2
    title: { de: "A cat in a hat", en: "A cat in a hat" }
    goal:
      de: "Hör den Tierreim und finde die Wörter, die sich reimen, so wie cat und hat."
      en: "Listen to the animal rhyme and find the words that rhyme, like cat and hat."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Weißt du noch? Was machst du dazu?"
            say: { de: "Weißt du noch? Hör zu. Was machst du dazu?" }
            audio: { en: "Clap, clap, clap your hands." }
            options: [{ object: clap }, { object: sit-down }]
            answer: clap
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Weißt du noch? Was machst du dazu?"
            say: { de: "Weißt du noch? Hör zu. Was machst du dazu?" }
            audio: { en: "Wave and say goodbye!" }
            options: [{ object: jump }, { object: wave }]
            answer: wave
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Heute hörst du einen Reim mit vier Tieren. Du musst nicht jedes Wort verstehen, die Bilder helfen dir. Hör gut zu: In jeder Zeile reimen sich zwei Wörter.", en: "A cat in a hat, a bee in a tree, a mouse in a house, and a goat in a boat!" }
          - say: { de: "Die Katze sitzt in einem Hut. „Cat“ und „hat“ klingen am Ende gleich. Sie reimen sich.", en: "A cat in a hat." }
            show: { objects: [cat, hat] }
          - say: { de: "Die Biene ist im Baum:", en: "A bee in a tree." }
            show: { objects: [bee, tree] }
          - say: { de: "Die Maus ist im Haus:", en: "A mouse in a house." }
            show: { objects: [mouse, house] }
          - say: { de: "Und die Ziege ist im Boot:", en: "And a goat in a boat!" }
            show: { objects: [goat, boat] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Wo sitzt die Katze?"
                say: { de: "Hör zu. Wo sitzt die Katze?" }
                audio: { en: "A cat in a hat." }
                options: [{ object: hat }, { object: tree }, { object: boat }]
                answer: hat
                hints:
                  - "Hör noch einmal: A cat in a hat."
                  - "Hör auf das letzte Wort. Es reimt sich auf „cat“."
                  - "„Hat“ heißt Hut. Tippe auf den Hut."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Wie geht der Reim weiter? Tippe auf das Bild."
                say: { de: "Hör zu. Wie geht der Reim weiter? Tippe auf das Bild." }
                audio: { en: "A bee in a …" }
                options: [{ object: tree }, { object: house }, { object: hat }]
                answer: tree
                feedback:
                  house: "„House“ reimt sich auf „mouse“. Auf „bee“ reimt sich „tree“."
                hints:
                  - "Welches Wort klingt am Ende wie „bee“?"
                  - "„Bee“ endet mit einem langen i. Welches Wort endet auch so?"
                  - "Die Biene ist im Baum: „a bee in a tree“."
              - id: l2-f3
                type: image_multiple_choice
                text: "Was reimt sich auf dieses Wort? Tippe auf die Bilder und hör gut zu."
                say: { de: "Was reimt sich auf dieses Wort? Tippe auf die Bilder und hör gut zu.", en: "Mouse." }
                show: { object: mouse }
                options: [{ object: house }, { object: boat }, { object: tree }]
                answer: house
                hints:
                  - "Tippe auf jedes Bild und hör das englische Wort."
                  - "„Mouse“ … Welches Wort klingt am Ende genauso?"
                  - "„Mouse“ und „house“ reimen sich. Tippe auf das Haus."
              - id: l2-f4
                type: speak
                text: "Sprich mit."
                say: { de: "Sprich mit.", en: "A goat in a boat." }
                show: { objects: [goat, boat] }
                expected_text: "a goat in a boat"
                hints:
                  - "Hör noch einmal zu."
                  - "„Goat“ und „boat“ klingen am Ende gleich."
                  - "Sag mit mir: A goat in a boat."
              - id: l2-f5
                type: true_false
                text: "Reimt sich das?"
                say: { de: "Hör zu. Reimt sich das?", en: "Bee, tree." }
                show: { objects: [bee, tree] }
                answer: true
                hints:
                  - "Hör noch einmal: „bee“, „tree“."
                  - "Klingen beide Wörter am Ende gleich?"
                  - "Ja, „bee“ und „tree“ reimen sich."
              - id: l2-f6
                type: matching
                text: "Was reimt sich? Tippe auf ein Tier und dann auf das Ding, das sich darauf reimt."
                say: { de: "Was reimt sich? Tippe auf ein Tier und dann auf das Ding, das sich darauf reimt." }
                pairs:
                  - left: { object: cat }
                    right: { object: hat }
                  - left: { object: mouse }
                    right: { object: house }
                  - left: { object: goat }
                    right: { object: boat }
                hints:
                  - "Tippe auf die Bilder und hör die englischen Wörter."
                  - "Denk an den Reim: „a cat in a hat, a mouse in a house“."
                  - "„Cat“ und „hat“, „mouse“ und „house“, „goat“ und „boat“."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Wo ist die Maus?"
                say: { de: "Hör zu. Wo ist die Maus?" }
                audio: { en: "A mouse in a house." }
                options: [{ object: boat }, { object: house }, { object: hat }]
                answer: house
                hints: ["Hör auf das letzte Wort. Es reimt sich auf „mouse“."]
              - id: l2-s2
                type: audio_choice
                text: "Wie geht der Reim weiter? Tippe auf das Bild."
                say: { de: "Hör zu. Wie geht der Reim weiter? Tippe auf das Bild." }
                audio: { en: "A goat in a …" }
                options: [{ object: boat }, { object: tree }, { object: hat }]
                answer: boat
                feedback:
                  hat: "„Hat“ reimt sich auf „cat“. Auf „goat“ reimt sich „boat“."
                hints: ["Welches Wort klingt am Ende wie „goat“?"]
              - id: l2-s3
                type: true_false
                text: "Reimt sich das?"
                say: { de: "Hör zu. Reimt sich das?", en: "Cat, boat." }
                show: { objects: [cat, boat] }
                answer: false
                hints: ["Klingen „cat“ und „boat“ am Ende gleich?"]
              - id: l2-s4
                type: speak
                text: "Sprich mit."
                say: { de: "Sprich mit.", en: "A cat in a hat." }
                show: { objects: [cat, hat] }
                expected_text: "a cat in a hat"
                hints: ["„Cat“ und „hat“ klingen am Ende gleich."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Was reimt sich auf dieses Wort? Tippe auf die Bilder und hör gut zu."
                say: { de: "Was reimt sich auf dieses Wort? Tippe auf die Bilder und hör gut zu.", en: "Goat." }
                show: { object: goat }
                options: [{ object: bee }, { object: boat }, { object: house }]
                answer: boat
                hints: ["„Goat“ … Welches Wort klingt am Ende genauso?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Wie geht der Reim weiter? Tippe auf das Bild."
                say: { de: "Hör zu. Wie geht der Reim weiter? Tippe auf das Bild." }
                audio: { en: "A mouse in a …" }
                options: [{ object: house }, { object: tree }, { object: boat }]
                answer: house
              - id: l2-n2
                type: audio_choice
                text: "Wo ist die Biene?"
                say: { de: "Hör zu. Wo ist die Biene?" }
                audio: { en: "A bee in a tree." }
                options: [{ object: hat }, { object: tree }, { object: house }]
                answer: tree
              - id: l2-n3
                type: true_false
                text: "Reimt sich das?"
                say: { de: "Hör zu. Reimt sich das?", en: "Goat, boat." }
                show: { objects: [goat, boat] }
                answer: true
              - id: l2-n4
                type: image_multiple_choice
                text: "Was reimt sich auf dieses Wort? Tippe auf die Bilder und hör gut zu."
                say: { de: "Was reimt sich auf dieses Wort? Tippe auf die Bilder und hör gut zu.", en: "Cat." }
                show: { object: cat }
                options: [{ object: tree }, { object: house }, { object: hat }]
                answer: hat
              - id: l2-n5
                type: speak
                text: "Jetzt sprichst du den ganzen Reim mit."
                say: { de: "Jetzt sprichst du den ganzen Reim mit.", en: "A cat in a hat, a bee in a tree, a mouse in a house, and a goat in a boat!" }
                expected_text: "a cat in a hat, a bee in a tree, a mouse in a house, and a goat in a boat"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: actions
            type: audio_choice
            text: "Hör dir diese Zeile aus dem Mitmachreim an. Was machst du dazu?"
            say: { de: "Hör dir diese Zeile aus dem Mitmachreim an. Was machst du dazu?" }
            audio: { en: "Clap, clap, clap your hands." }
            options: [{ object: wave }, { object: clap }, { object: point }]
            answer: clap
          - id: l2-c2
            part: order
            type: audio_choice
