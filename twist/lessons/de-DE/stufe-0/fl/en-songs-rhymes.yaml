            type: true_false
            text: "Passt das Bild?"
            say: { de: "Hör zu. Passt das Bild?" }
            audio: { en: "Jump, jump, jump up high." }
            show: { object: jump }
            answer: true
          - id: l2-c7
            part: actions
            type: true_false
            text: "Passt das Bild?"
