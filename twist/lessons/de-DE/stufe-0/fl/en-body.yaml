# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-body
skill: fl.themes.body
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Mein Körper auf Englisch
  en: My body in English
summary: >
  Body parts in English and simple commands with them (Touch your nose!).
  Stufe 0 is oral only: instructions are spoken in German, the words and
  commands in English. Lesson 1 brings head, eye, ear, nose and mouth;
  lesson 2 adds hand, arm, leg and foot, follows "Touch your …!", and ends
  with the skill check. Naming the body parts aloud is covered in
  Practise and not marked; in the checks the child taps the body part
  that is meant.
metadata:
  year: stufe-0
  topic: { de: Körper, en: My body }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: [fl.speaking.imitate, fl.listening.classroom-phrases]
  vocabulary: { en: [head, eye, ear, nose, mouth, hand, arm, leg, foot, "Touch your …!"] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: face, what: { de: Kopf und Gesicht auf Englisch verstehen, en: understanding the words for the head and face } }
    - { id: limbs, what: { de: "Hand, Arm, Bein und Fuß auf Englisch verstehen", en: "understanding hand, arm, leg and foot" } }
    - { id: touch, what: { de: "„Touch your …!“ verstehen und befolgen", en: "understanding and following “Touch your …!”" } }
  misconceptions:
    - id: false-friends
      what: Takes "hand" and "arm" for the German words and says them with German sounds
      addressed: Learn says they sound almost like the German words but are said the English way; the speak hints for hand (l2-f4) and leg (l2-f3) model the English vowel
    - id: eye-ear
      what: Mixes up eye and ear, which sound alike
      addressed: both appear side by side in an audio task in every stage of lesson 1, with feedback in l1-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
