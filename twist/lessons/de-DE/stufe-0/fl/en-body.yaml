              - id: l1-f1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Nose." }
                options: [{ object: nose }, { object: mouth }, { object: ear }]
                answer: nose
                hints:
                  - "Hör noch einmal: nose."
                  - "„Nose“ klingt ein bisschen wie Nase."
                  - "Tippe auf die Nase."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Eye." }
                options: [{ object: ear }, { object: eye }, { object: nose }]
                answer: eye
                feedback:
                  ear: "Das ist „ear“, das Ohr. „Eye“ ist das Auge."
                hints:
                  - "Hör noch einmal: eye."
                  - "„Eye“ ist das Auge, „ear“ das Ohr."
                  - "Tippe auf das Auge."
              - id: l1-f3
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Mouth." }
                show: { object: mouth }
                expected_text: mouth
                hints:
                  - "Hör noch einmal: mouth."
                  - "Am Ende legst du die Zunge kurz zwischen die Zähne."
                  - "Sag mit mir: mouth."
              - id: l1-f4
                type: true_false
