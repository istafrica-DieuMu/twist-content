    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör zu und sprich nach.", en: "Head." }
            show: { object: head }
          - say: { en: "Eye." }
            show: { object: eye }
          - say: { en: "Ear." }
            show: { object: ear }
          - say: { en: "Nose." }
            show: { object: nose }
          - say: { en: "Mouth." }
            show: { object: mouth }

      - activity: practise
        setting: plain
        stages:
