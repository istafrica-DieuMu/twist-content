                say: { de: "Welche Farbe hat der Ball? Sag es auf Englisch.", en: "It's red." }
                show: { object: ball, colour: red }
                expected_text: "It's red."
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Erst „It's“, dann die Farbe."
                  - "Sag mit mir: It's red."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Passt das Wort zum Bild?"
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Blue." }
                show: { object: car, colour: blue }
                answer: true
                hints:
                  - "Hör noch einmal: blue."
                  - "„Blue“ klingt fast wie blau."
                  - "Ja, das Auto ist blau."
              - id: l2-f3
                type: speak
                text: "Wie viele Katzen sind es? Sag die Zahl auf Englisch."
                say: { de: "Wie viele Katzen sind es? Sag die Zahl auf Englisch.", en: "Three." }
                show: { object: cat, count: 3, layout: row }
                expected_text: three
                hints:
                  - "Zähl erst auf Deutsch: eins, zwei, drei."
                  - "Bei „three“ liegt die Zunge zwischen den Zähnen."
                  - "Sag mit mir: three."
              - id: l2-f4
                type: audio_choice
                text: "Welcher Luftballon ist gemeint?"
                say: { de: "Hör zu. Welcher Luftballon ist gemeint?" }
                audio: { en: "It's green." }
                options:
                  - { object: balloon, colour: red }
                  - { object: balloon, colour: green }
                  - { object: balloon, colour: blue }
                answer: green
                feedback:
                  blue: "Das ist „blue“, blau. Gemeint ist „green“, grün."
                hints:
                  - "Hör auf die Farbe: green."
                  - "„Green“ klingt fast wie grün."
                  - "Tippe auf den grünen Luftballon."
              - id: l2-f5
                type: true_false
                text: "Passt die Zahl?"
                say: { de: "Hör zu. Passt die Zahl?", en: "Five." }
                show: { object: apple, count: 4, layout: row }
                answer: false
                feedback:
                  "true": "Zähl noch einmal. Es sind vier Äpfel, auf Englisch „four“."
                hints:
                  - "Zähl die Äpfel."
                  - "„Five“ heißt fünf. Sind es fünf Äpfel?"
                  - "Nein, es sind vier, „four“."

