                hints: ["„Rubber“ heißt Radiergummi."]
              - id: l1-s5
                type: speak
                text: "Was ist das? Sag es auf Englisch."
                say: { de: "Was ist das? Sag es auf Englisch.", en: "It's a cat." }
                show: { object: cat }
                expected_text: "It's a cat."
                hints: ["Vergiss das kleine a nicht: It's a cat."]

          - support: none
