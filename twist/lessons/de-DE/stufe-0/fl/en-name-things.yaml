            show: { object: crayon, colour: purple }
          - say: { de: "So fragst du, wie viele es sind. Dann sagst du einfach die Zahl:", en: "How many? Three." }
            show: { object: cat, count: 3, layout: row }
          - say: { de: "Willst du Farbe und Ding zusammen sagen, kommt die Farbe zuerst, wie im Deutschen: ein grüner Ball.", en: "A green ball." }
            show: { object: ball, colour: green }

      - activity: practise
        setting: plain
