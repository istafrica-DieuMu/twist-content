# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-name-things
skill: fl.speaking.name-things
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: "Was ist das? Ich sag es auf Englisch"
  en: "What's this? I can say it"
summary: >
  Children see a picture and say what it is in English. Lesson 1 names
  animals and school things with It's a … (It's a dog. It's a pencil.).
  Lesson 2 names colours and amounts (It's red. Three.) and then both
  together (a green ball), and ends with the skill check. Most tasks are
  speaking; between them the child hears a name and decides whether it
  fits the picture, so the checks can be marked without speech
  recognition. Oral only: nothing is read.
metadata:
  year: stufe-0
  topic: { de: Sprechen, en: Speaking }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: [fl.speaking.imitate]
  also_practises: [fl.themes.colours, fl.themes.numbers-to-10, fl.themes.school]
  vocabulary: { en: ["What's this?", "It's a …", dog, cat, fish, bird, frog, rabbit, pencil, ruler, rubber, book, "What colour is it?", red, blue, green, yellow, purple, "How many?", two, three, four, five, six, seven] }
  no_reading: true
  forms: [audio, picture, drawn]
  drawn: [dots]
  facets: []
  parts:
    - { id: things, what: { de: "Tiere und Schulsachen auf Englisch verstehen (It's a …)", en: "understanding animals and school things in English (It's a …)" } }
    - { id: colours, what: { de: "verstehen, welche Farbe genannt wird", en: understanding which colour is named } }
    - { id: numbers, what: { de: Anzahlen auf Englisch verstehen, en: understanding amounts in English } }
    - { id: colour-thing, what: { de: "Farbe und Ding zusammen verstehen (a green ball)", en: "understanding a colour and a thing together (a green ball)" } }
  misconceptions:
    - id: ruler-rubber
      what: Mixes up the school words that sound alike (ruler and rubber)
      addressed: every stage of lesson 1 has a ruler-or-rubber task (l1-f5, l1-s4, l1-n2), with feedback in l1-f5
    - id: no-article
      what: Says only the noun or a German article (It's dog, It's der dog)
      addressed: lesson 1 Learn models It's a …; every lesson 1 speak task has It's a … as its model and the full-stage hints point at the little a
    - id: colour-after-noun
      what: Puts the colour after the thing, as in some other languages (a ball green)
      addressed: lesson 2 Learn says the colour comes first, as in German; l2-s5 and l2-n5 ask for colour and thing together, and the skill check plays a yellow car (l2-c5)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "It's a dog.", en: "It's a dog." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: speak
            text: "Hör zu und sprich genau nach."
            say: { de: "Hör zu und sprich genau nach.", en: "Fish." }
            show: { object: fish }
            expected_text: fish
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Book." }
            options: [{ object: book }, { object: ball }]
            answer: book
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "So fragst du auf Englisch: Was ist das?", en: "What's this?" }
            show: { object: dog }
          - say: { de: "Und so antwortest du. Vor dem Wort steht ein kleines „a“. Es heißt „ein“:", en: "It's a dog." }
            show: { object: dog }
          - say: { de: "Das geht mit allen Tieren:", en: "It's a cat. It's a bird. It's a frog." }
            show: { object: cat }
          - say: { de: "Das ist ein Kaninchen. Auf Englisch:", en: "It's a rabbit." }
            show: { object: rabbit }
          - say: { de: "Und mit den Sachen aus deinem Mäppchen:", en: "It's a pencil. It's a ruler. It's a rubber." }
            show: { object: pencil-case }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: speak
                text: "Was ist das? Sag es auf Englisch."
                say: { de: "Was ist das? Sag es auf Englisch.", en: "It's a dog." }
                show: { object: dog }
                expected_text: "It's a dog."
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Erst „It's a“, dann das Tier."
                  - "Sag mit mir: It's a dog."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Passt das Wort zum Bild?"
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "It's a cat." }
                show: { object: cat }
                answer: true
                hints:
                  - "Hör noch einmal: It's a cat."
                  - "„Cat“ ist die Katze."
                  - "Ja, das ist eine Katze. Tippe auf Ja."
              - id: l1-f3
                type: audio_choice
                text: "Was ist gemeint? Tippe auf das Bild."
                say: { de: "Hör zu. Was ist gemeint? Tippe auf das Bild." }
                audio: { en: "It's a pencil." }
                options: [{ object: pencil }, { object: ruler }, { object: rubber }]
                answer: pencil
                feedback:
                  ruler: "Das ist das Lineal, „ruler“. Der Stift heißt „pencil“."
                hints:
                  - "Hör auf das letzte Wort: pencil."
                  - "„Pencil“ ist der Bleistift. Damit schreibst und malst du."
                  - "Tippe auf den Bleistift."
              - id: l1-f4
                type: speak
                text: "Was ist das? Sag es auf Englisch."
                say: { de: "Was ist das? Sag es auf Englisch.", en: "It's a book." }
                show: { object: book }
                expected_text: "It's a book."
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "„Book“ klingt fast wie Buch."
                  - "Sag mit mir: It's a book."
              - id: l1-f5
                type: true_false
                text: "Passt das Wort zum Bild?"
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "It's a rubber." }
                show: { object: ruler }
                answer: false
                feedback:
                  "true": "Das ist ein Lineal, „ruler“. „Rubber“ ist der Radiergummi. Die beiden Wörter klingen ähnlich."
                hints:
                  - "Hör genau hin: rubber oder ruler?"
                  - "„Rubber“ ist der Radiergummi. Was siehst du auf dem Bild?"
                  - "Nein. Das ist ein Lineal, „ruler“."

          - support: some
