# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-imitate
skill: fl.speaking.imitate
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Gut zuhören, genau nachsprechen
  en: Listen and say it like me
summary: >
  Children hear an English word or a short sentence and say it back, with
  attention to three sounds German does not have in the same way. Lesson
  1 is th: the tongue sits between the teeth (three, thank you, mouth),
  heard against the German-sounding t and s (tree, mouse). Lesson 2 is w
  with round lips (whale, water, web), heard against v (van), and the soft
  English r (red, rabbit, rose); it ends with the skill check. Speaking is
  practised, not marked: the skill check asks the child to hear the sounds
  apart, which comes before saying them well. Oral only: nothing is read.
metadata:
  year: stufe-0
  topic: { de: Sprechen, en: Speaking }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: [fl.listening.familiar-words]
  also_practises: [fl.listening.familiar-words]
  vocabulary: { en: [three, thank you, mouth, tree, mouse, whale, water, web, van, red, rabbit, rose] }
  no_reading: true
  forms: [audio, picture, drawn]
  drawn: [dots, colour-swatch]
  sounds: [en.r, en.w]
  facets: []
  parts:
    - { id: th, what: { de: "das englische th hören (three oder tree, mouth oder mouse)", en: "hearing the English th (three or tree, mouth or mouse)" } }
    - { id: w, what: { de: "das englische w hören (whale oder van)", en: "hearing the English w (whale or van)" } }
    - { id: r, what: { de: das englische r am Wortanfang hören, en: hearing the English r at the start of a word } }
  misconceptions:
    - id: th-as-s-or-t
      what: Says th as s or t, so three sounds like tree and mouth like mouse
      addressed: lesson 1 Learn shows the tongue between the teeth and sets three against tree and mouth against mouse; every stage of lesson 1 has a mouth-or-mouse and a three-or-tree task, with feedback in l1-f1 and l1-f2, and the skill check asks both again
    - id: w-as-v
      what: Says the English w like a German w, so whale starts like van
      addressed: lesson 2 Learn has the child make round lips like a kiss; every stage of lesson 2 sets a w word against van, with feedback in l2-f1
    - id: german-r
      what: Says the English r at the back of the throat like a German r
      addressed: lesson 2 Learn and the r speak hints say the tongue stays in the mouth and does not touch anything, and the lips are a little round
    - id: rushing
      what: Starts speaking before listening to the whole model
      addressed: every speak task plays the model first; the full-stage hints start with "Hör erst ganz zu"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Three, thank you", en: "Three, thank you" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Mouse." }
            options: [{ object: mouse }, { object: ball }]
            answer: mouse
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Tippe auf das Bild."
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Banana." }
            options: [{ object: apple }, { object: banana }]
            answer: banana
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Im Englischen gibt es einen Laut, den wir im Deutschen nicht haben. Leg die Zungenspitze ganz leicht zwischen die Zähne und puste. Hör zu:", en: "Three. Three." }
            show: { drawn: dots, count: 3, layout: dice }
          - say: { de: "Ohne die Zunge zwischen den Zähnen wird daraus ein anderes Wort, der Baum:", en: "Tree. Three." }
            show: { object: tree }
          - say: { de: "Das ist der Mund. Am Ende kommt wieder die Zunge zwischen die Zähne:", en: "Mouth. Mouth." }
            show: { object: mouth }
          - say: { de: "Und das ist die Maus. Hör gut auf das Ende:", en: "Mouse. Mouth." }
            show: { object: mouse }
          - say: { de: "Auch das englische Wort für danke fängt mit diesem Laut an. Hör erst ganz zu und sprich dann genau so nach:", en: "Thank you." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Hör genau hin. Welches Wort hörst du?"
                say: { de: "Hör genau hin. Welches Wort hörst du?" }
                audio: { en: "Mouth." }
                options: [{ object: mouse }, { object: mouth }]
                answer: mouth
                feedback:
                  mouse: "Das ist die Maus, „mouse“. Bei „mouth“ kommt am Ende die Zunge zwischen die Zähne."
                hints:
                  - "Hör noch einmal auf das Ende des Wortes."
                  - "Hörst du am Ende ein s wie bei Maus, oder kommt die Zunge zwischen die Zähne?"
                  - "Das war „mouth“, der Mund."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Hör genau hin. Welches Wort hörst du?"
                say: { de: "Hör genau hin. Welches Wort hörst du?" }
                audio: { en: "Three." }
                options: [{ object: tree }, { drawn: dots, count: 3, layout: dice }]
                answer: "3"
                feedback:
                  tree: "Das ist der Baum, „tree“. Bei „three“ liegt die Zunge am Anfang zwischen den Zähnen."
                hints:
                  - "Hör noch einmal auf den Anfang."
                  - "Fängt das Wort mit t an wie bei Tee, oder mit der Zunge zwischen den Zähnen?"
                  - "Das war „three“, die Zahl drei."
              - id: l1-f3
                type: speak
                text: "Sprich genau nach. Denk an die Zunge."
                say: { de: "Sprich genau nach. Denk an die Zunge.", en: "Three." }
                show: { drawn: dots, count: 3, layout: dice }
                expected_text: three
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Leg die Zungenspitze zwischen die Zähne und puste leise."
                  - "Sag mit mir: three."
              - id: l1-f4
                type: true_false
                text: "Ist das der Mund?"
                say: { de: "Hör zu. Ist das der Mund?", en: "Mouse." }
                show: { object: mouth }
                answer: false
                feedback:
                  "true": "Du hast „mouse“ gehört, die Maus. Der Mund heißt „mouth“."
                hints:
                  - "Hör noch einmal auf das Ende."
                  - "Hörst du ein s am Ende?"
                  - "Das war „mouse“, die Maus. Tippe auf Nein."
              - id: l1-f5
                type: speak
                text: "Jemand hilft dir. Sprich genau nach."
                say: { de: "Jemand hilft dir. Sprich genau nach.", en: "Thank you." }
                expected_text: thank you
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Bei „th“ liegt die Zunge kurz zwischen den Zähnen."
                  - "Sag mit mir: thank you."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
