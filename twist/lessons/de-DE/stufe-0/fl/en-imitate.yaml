                show: { object: tree, count: 3, layout: row }
                expected_text: three trees
              - id: l1-n3
                type: audio_choice
                text: "Hör genau hin. Welches Wort hörst du?"
                say: { de: "Hör genau hin. Welches Wort hörst du?" }
                audio: { en: "Three." }
