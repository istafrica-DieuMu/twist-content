# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-hello
skill: fl.themes.hello
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Hallo und Tschüss auf Englisch
  en: Hello and goodbye in English
summary: >
  Greeting, saying your name and saying goodbye, with please and thank
  you. Stufe 0 is oral only: instructions are spoken in German, the
  phrases in English. Lesson 1 brings hello, hi, goodbye, bye and good
  morning; lesson 2 adds My name is … and What's your name?, please and
  thank you, and ends with the skill check. Saying the phrases is
  covered in Practise and not marked; the checks ask whether a phrase
  fits the moment.
metadata:
  year: stufe-0
  topic: { de: Hallo, en: Hello }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: [fl.speaking.greet, fl.speaking.imitate]
  vocabulary: { en: [hello, hi, goodbye, bye, good morning, My name is, "What's your name?", please, thank you] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: greet, what: { de: jemanden auf Englisch begrüßen, en: greeting someone in English } }
    - { id: goodbye, what: { de: sich auf Englisch verabschieden, en: saying goodbye in English } }
    - { id: name, what: { de: "nach dem Namen fragen und den eigenen Namen sagen", en: asking someone's name and saying your own } }
    - { id: polite, what: { de: bitte und danke verstehen, en: understanding please and thank you } }
  misconceptions:
    - id: hello-for-goodbye
      what: Uses hello and goodbye the wrong way round
      addressed: every stage of lesson 1 asks whether a phrase is said to greet or to say goodbye, and sets hi against bye in the some stage; l1-f2 gives feedback when goodbye is taken for a greeting
    - id: german-sound
      what: Says English phrases with German sounds ("Gutbai", "Senk ju")
      addressed: every phrase is heard before the child says it; the speak hints show the th of thank you (tongue between the teeth) and the rounded lips for the w of What's your name?
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Hello und goodbye", en: "Hello and goodbye" }
    goal:
      de: "Sag hello, wenn du kommst, und goodbye, wenn du gehst."
      en: "Say hello and goodbye in English, hello when you come and goodbye when you go."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Wenn du jemanden triffst, sagst du auf Englisch:", en: "Hello! Hi!" }
            show: { object: child }
          - say: { de: "Am Morgen kannst du auch sagen:", en: "Good morning!" }
          - say: { de: "Wenn du gehst, sagst du:", en: "Goodbye! Bye!" }
            show: { object: house }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Sagt man das zur Begrüßung?"
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Hello!" }
                answer: true
                hints:
                  - "Hör noch einmal: hello."
                  - "„Hello“ klingt fast wie Hallo."
                  - "Tippe auf Ja. „Hello“ sagst du zur Begrüßung."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Sagt man das zur Begrüßung?"
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Goodbye!" }
                answer: false
                feedback:
                  "true": "„Goodbye“ sagst du, wenn du gehst. Zur Begrüßung sagst du „hello“."
                hints:
                  - "Hör noch einmal: goodbye."
                  - "„Goodbye“ heißt Tschüss oder Auf Wiedersehen."
                  - "Tippe auf Nein. „Goodbye“ sagst du zum Abschied."
              - id: l1-f3
                type: speak
                text: "Begrüß deine Lehrerin auf Englisch."
                say: { de: "Begrüß deine Lehrerin auf Englisch.", en: "Hello!" }
                expected_text: hello
                hints:
                  - "Hör noch einmal: hello."
                  - "Es klingt fast wie Hallo, nur am Anfang mit e: he-llo."
                  - "Sag mit mir: hello."
              - id: l1-f4
                type: true_false
                text: "Sagt man das am Morgen?"
                say: { de: "Hör zu. Sagt man das am Morgen?", en: "Good morning!" }
                answer: true
                hints:
                  - "Hör noch einmal: good morning."
                  - "„Morning“ heißt Morgen."
                  - "Tippe auf Ja. „Good morning“ heißt Guten Morgen."
              - id: l1-f5
                type: speak
                text: "Du gehst nach Hause. Verabschiede dich auf Englisch."
                say: { de: "Du gehst nach Hause. Verabschiede dich auf Englisch.", en: "Goodbye!" }
                expected_text: goodbye
                hints:
                  - "Hör noch einmal: goodbye."
                  - "Es hat zwei Teile: good … bye."
                  - "Sag mit mir: goodbye."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Sagt man das zum Abschied?"
                say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Bye!" }
                answer: true
                hints: ["„Bye“ ist die kurze Form von „goodbye“."]
              - id: l1-s2
                type: true_false
                text: "Sagt man das zum Abschied?"
                say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Hi!" }
                answer: false
                hints: ["Hör noch einmal: hi. Sagst du das, wenn du kommst oder wenn du gehst?"]
              - id: l1-s3
                type: speak
                text: "Es ist Morgen. Sag Guten Morgen auf Englisch."
                say: { de: "Es ist Morgen. Sag Guten Morgen auf Englisch.", en: "Good morning!" }
                expected_text: good morning
                hints: ["Zwei Wörter: good … morning. Sprich mir nach."]
              - id: l1-s4
                type: true_false
                text: "Sagt man das zur Begrüßung?"
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Hi!" }
                answer: true
                hints: ["Hör noch einmal: hi. Wann sagst du das?"]
              - id: l1-s5
                type: speak
                text: "Verabschiede dich kurz auf Englisch."
                say: { de: "Verabschiede dich kurz auf Englisch.", en: "Bye!" }
                expected_text: bye
                hints: ["Das kurze Wort steckt in „goodbye“: bye."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Sagt man das zur Begrüßung?"
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Good morning!" }
                answer: true
              - id: l1-n2
                type: true_false
                text: "Sagt man das zur Begrüßung?"
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Bye!" }
                answer: false
              - id: l1-n3
                type: speak
                text: "Begrüß deine Freundin ganz kurz auf Englisch."
                say: { de: "Begrüß deine Freundin ganz kurz auf Englisch.", en: "Hi!" }
                expected_text: hi
              - id: l1-n4
                type: true_false
                text: "Sagt man das zum Abschied?"
                say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Goodbye!" }
                answer: true
              - id: l1-n5
                type: speak
                text: "Sag Hallo auf Englisch."
                say: { de: "Sag Hallo auf Englisch.", en: "Hello!" }
                expected_text: hello

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Sagt man das zum Abschied?"
            say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Hello!" }
            answer: false
          - id: l1-c2
            type: true_false
            text: "Sagt man das zur Begrüßung?"
            say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Hi!" }
            answer: true
          - id: l1-c3
            type: true_false
            text: "Sagt man das zum Abschied?"
            say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Bye!" }
            answer: true
          - id: l1-c4
            type: true_false
            text: "Das Kind kommt in die Schule. Passt das?"
            say: { de: "Das Kind kommt in die Schule. Hör zu. Passt das?" }
            audio: { en: "Goodbye!" }
            show: { object: school }
            answer: false
          - id: l1-c5
            type: true_false
            text: "Das Kind geht nach Hause. Passt das?"
            say: { de: "Das Kind geht nach Hause. Hör zu. Passt das?" }
            audio: { en: "Bye!" }
            show: { object: house }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "Was macht das Kind dazu? Tippe auf das Bild."
            say: { de: "Hör zu. Was macht das Kind dazu? Tippe auf das Bild." }
            audio: { en: "Hello!" }
            options: [{ object: sit-down }, { object: wave }, { object: read }]
            answer: wave

  - n: 2
    title: { de: "My name is …", en: "My name is …" }
    goal:
      de: "Sag auf Englisch deinen Namen mit My name is und bedank dich mit thank you."
      en: "Say your name in English with My name is, and say thank you."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "So fragst du nach dem Namen:", en: "What's your name?" }
            show: { object: girl }
          - say: { de: "So sagst du deinen Namen:", en: "My name is Emma." }
            show: { object: girl }
          - say: { de: "Bitte heißt „please“. Danke heißt „thank you“. Bei „th“ legst du die Zunge kurz zwischen die Zähne.", en: "Please. Thank you." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Fragt hier jemand nach deinem Namen?"
                say: { de: "Hör zu. Fragt hier jemand nach deinem Namen?", en: "What's your name?" }
                answer: true
                hints:
                  - "Hör noch einmal: What's your name?"
                  - "Hörst du das Wort „name“? Es klingt fast wie Name."
                  - "Tippe auf Ja. „What's your name?“ heißt: Wie heißt du?"
                difficulty: easy
              - id: l2-f2
                type: speak
                text: "Sag deinen Namen auf Englisch. Fang so an."
                say: { de: "Sag deinen Namen auf Englisch. Fang so an.", en: "My name is …" }
                expected_text: my name is
                hints:
                  - "Hör noch einmal: My name is."
                  - "Dann sagst du deinen Namen."
                  - "Sag „My name is“ und dann deinen Namen."
              - id: l2-f3
                type: true_false
                text: "Bedankt sich hier jemand?"
                say: { de: "Hör zu. Bedankt sich hier jemand?", en: "Thank you." }
                answer: true
                hints:
                  - "Hör noch einmal: thank you."
                  - "„Thank you“ heißt danke."
                  - "Tippe auf Ja."
              - id: l2-f4
                type: true_false
                text: "Heißt das bitte?"
                say: { de: "Hör zu. Heißt das bitte?", en: "Thank you." }
                answer: false
                feedback:
                  "true": "„Thank you“ heißt danke. Bitte heißt „please“."
                hints:
                  - "Hör noch einmal: thank you."
                  - "Ist das bitte oder danke?"
                  - "Tippe auf Nein. „Thank you“ heißt danke."
              - id: l2-f5
                type: speak
                text: "Du bekommst ein Geschenk. Bedank dich auf Englisch."
                say: { de: "Du bekommst ein Geschenk. Bedank dich auf Englisch.", en: "Thank you." }
                show: { object: present }
                expected_text: thank you
                hints:
                  - "Hör noch einmal: thank you."
                  - "Bei „th“ liegt die Zunge kurz zwischen den Zähnen."
                  - "Sag mit mir: thank you."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Sagt hier jemand seinen Namen?"
                say: { de: "Hör zu. Sagt hier jemand seinen Namen?" }
                audio: { en: "My name is Tom.", speaker: male }
                answer: true
                hints: ["Was hörst du nach „My name is“?"]
              - id: l2-s2
                type: speak
                text: "Frag ein Kind auf Englisch, wie es heißt."
                say: { de: "Frag ein Kind auf Englisch, wie es heißt.", en: "What's your name?" }
                expected_text: what's your name
                hints: ["Am Anfang machst du die Lippen rund: w … What's your name?"]
              - id: l2-s3
                type: true_false
                text: "Heißt das bitte?"
                say: { de: "Hör zu. Heißt das bitte?", en: "Please." }
                answer: true
                hints: ["Hör noch einmal: please. Was sagst du, wenn du etwas haben möchtest?"]
              - id: l2-s4
                type: true_false
                text: "Fragt hier jemand nach deinem Namen?"
                say: { de: "Hör zu. Fragt hier jemand nach deinem Namen?", en: "Goodbye!" }
                answer: false
                hints: ["Hör auf das Wort „name“."]
              - id: l2-s5
                type: speak
                text: "Du möchtest einen Stift. Sag bitte auf Englisch."
                say: { de: "Du möchtest einen Stift. Sag bitte auf Englisch.", en: "Please." }
                expected_text: please
                hints: ["Hör noch einmal: please. In der Mitte hörst du ein langes i: pliis."]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "Bedankt sich hier jemand?"
                say: { de: "Hör zu. Bedankt sich hier jemand?", en: "Please." }
                answer: false
              - id: l2-n2
                type: speak
                text: "Sag deinen Namen auf Englisch."
                say: { de: "Sag deinen Namen auf Englisch.", en: "My name is …" }
                expected_text: my name is
              - id: l2-n3
                type: true_false
                text: "Sagt hier jemand seinen Namen?"
                say: { de: "Hör zu. Sagt hier jemand seinen Namen?" }
                audio: { en: "My name is Lina.", speaker: female }
                answer: true
              - id: l2-n4
                type: true_false
                text: "Sagt man das zur Begrüßung?"
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Hello! What's your name?" }
                answer: true
              - id: l2-n5
                type: speak
                text: "Bedank dich auf Englisch."
                say: { de: "Bedank dich auf Englisch.", en: "Thank you." }
                expected_text: thank you

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: goodbye
            type: true_false
            text: "Sagt man das zum Abschied?"
            say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Good morning!" }
            answer: false
          - id: l2-c2
            part: name
            type: true_false
            text: "Fragt hier jemand nach deinem Namen?"
            say: { de: "Hör zu. Fragt hier jemand nach deinem Namen?" }
            audio: { en: "Hi! My name is Tom.", speaker: male }
            answer: false
          - id: l2-c3
            part: polite
            type: true_false
            text: "Heißt das danke?"
            say: { de: "Hör zu. Heißt das danke?", en: "Thank you, Lina." }
            answer: true
          - id: l2-c4
            part: name
            type: true_false
            text: "Heißt das Mädchen Lisa?"
            say: { de: "Hör zu. Heißt das Mädchen Lisa?" }
            audio: { en: "Hello! My name is Lisa.", speaker: female }
            show: { object: girl }
            answer: true
          - id: l2-c5
            part: greet
            type: true_false
            text: "Frau Green kommt in die Klasse. Passt das?"
            say: { de: "Frau Green kommt in die Klasse. Hör zu. Passt das?" }
            audio: { en: "Bye, Mrs Green!", speaker: female }
            show: { object: teacher }
            answer: false
          - id: l2-c6
            part: greet
            type: true_false
            text: "Ben kommt am Morgen in die Schule. Passt das?"
            say: { de: "Ben kommt am Morgen in die Schule. Hör zu. Passt das?" }
            audio: { en: "Good morning!", speaker: male }
            show: { object: school }
            answer: true
          - id: l2-c7
            part: greet
            type: audio_choice
            text: "Wer kommt gerade an? Tippe auf das Bild."
            say: { de: "Hör zu. Wer kommt gerade an? Tippe auf das Bild." }
            audio: { turns: [{ en: "Bye!", speaker: female }, { en: "Hello!", speaker: male }] }
            options: [{ object: girl }, { object: boy }]
            answer: boy
          - id: l2-c8
            part: greet
            type: audio_choice
            text: "Wann sagt man das? Tippe auf das Bild."
            say: { de: "Hör zu. Wann sagt man das? Tippe auf das Bild." }
            audio: { en: "Good morning, Mia!", speaker: male }
            options: [{ object: moon }, { object: sun }]
            answer: sun
          - id: l2-c9
            part: greet
            type: true_false
            text: "Tom besucht seinen Freund. Begrüßt er ihn?"
            say: { de: "Tom besucht seinen Freund. Hör zu. Begrüßt er ihn?" }
            audio: { en: "Goodbye, Leo!", speaker: male }
            show: { object: boy }
            answer: false
          - id: l2-c10
            part: goodbye
            type: audio_choice
            text: "Wer geht gerade? Tippe auf das Bild."
            say: { de: "Hör zu. Wer geht gerade? Tippe auf das Bild." }
            audio: { turns: [{ en: "Hi!", speaker: male }, { en: "Goodbye!", speaker: female }] }
            options: [{ object: boy }, { object: girl }]
            answer: girl
          - id: l2-c11
            part: goodbye
            type: true_false
            text: "Die Schule ist aus. Lina geht nach Hause. Passt das?"
            say: { de: "Die Schule ist aus. Lina geht nach Hause. Hör zu. Passt das?" }
            audio: { en: "Bye, Ben!", speaker: female }
            show: { object: house }
            answer: true
          - id: l2-c12
            part: goodbye
            type: true_false
            text: "Tom geht nach Hause. Passt das?"
            say: { de: "Tom geht nach Hause. Hör zu. Passt das?" }
            audio: { en: "Hello, Mia!", speaker: male }
            show: { object: house }
            answer: false
          - id: l2-c13
            part: goodbye
            type: true_false
            text: "Verabschiedet sich das Kind?"
            say: { de: "Hör zu. Verabschiedet sich das Kind?" }
            audio: { en: "Good morning, Mrs Green!", speaker: female }
            answer: false
          - id: l2-c14
            part: name
            type: true_false
            text: "Passt die Antwort?"
            say: { de: "Hör zu. Passt die Antwort?" }
            audio: { turns: [{ en: "What's your name?", speaker: female }, { en: "Goodbye!", speaker: male }] }
            answer: false
          - id: l2-c15
            part: name
            type: true_false
            text: "Passt die Antwort?"
            say: { de: "Hör zu. Passt die Antwort?" }
            audio: { turns: [{ en: "Hello! What's your name?", speaker: male }, { en: "My name is Mia.", speaker: female }] }
            answer: true
          - id: l2-c16
            part: name
            type: true_false
            text: "Heißt der Junge Tom?"
            say: { de: "Hör zu. Heißt der Junge Tom?" }
            audio: { en: "Hi! My name is Ben.", speaker: male }
            show: { object: boy }
            answer: false
          - id: l2-c17
            part: polite
            type: true_false
            text: "Lina bekommt ein Eis. Passt das?"
            say: { de: "Lina bekommt ein Eis. Hör zu. Passt das?" }
            audio: { en: "Thank you!", speaker: female }
            show: { object: ice-cream }
            answer: true
          - id: l2-c18
            part: polite
            type: true_false
            text: "Ben möchte einen Stift haben. Sagt er bitte?"
            say: { de: "Ben möchte einen Stift haben. Hör zu. Sagt er bitte?" }
            audio: { en: "Thank you!", speaker: male }
            show: { object: pencil }
            answer: false
          - id: l2-c19
            part: polite
            type: true_false
            text: "Lina möchte das Buch haben. Sagt sie bitte?"
            say: { de: "Lina möchte das Buch haben. Hör zu. Sagt sie bitte?" }
            audio: { en: "Please!", speaker: female }
            show: { object: book }
            answer: true
          - id: l2-c20
            part: polite
            type: true_false
            text: "Mia schenkt Ben etwas. Bedankt sich Ben?"
            say: { de: "Mia schenkt Ben etwas. Hör zu. Bedankt sich Ben?" }
            audio: { turns: [{ en: "Hello, Ben!", speaker: female }, { en: "Hello, Mia!", speaker: male }] }
            show: { object: present }
            answer: false
