# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-compare-languages
skill: fl.culture-strategies.compare-languages
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Englisch und Deutsch vergleichen
  en: Comparing English and German
summary: >
  Children compare English words with German ones. Lesson 1 finds words
  that sound almost the same (Haus, house; Milch, milk; Wasser, water;
  Buch, book) and sets them against words that sound quite different
  (Hund, dog). Lesson 2 meets false friends a child might trip over: the
  Rock is a skirt in English (rock is a stone), the Hose is trousers, the
  Handy is a mobile phone and a Kind is a child (kind means nett). It
  mixes them with true pairs and ends with the skill check. Oral only:
  nothing is read.
metadata:
  year: stufe-0
  topic: { de: Sprachen vergleichen, en: Comparing languages }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: [fl.listening.familiar-words, fl.speaking.imitate]
  vocabulary: { en: [house, mouse, milk, water, book, sun, bed, bread, apple, hand, dog, duck, butterfly, bird, skirt, trousers, child, mobile phone] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: all-alike
      what: Thinks every English word sounds like the German one, so guesses Hund for dog
      addressed: every stage of lesson 1 has a "Klingt es fast gleich?" task with a pair that does not match (Hund, dog; Ente, duck; Schmetterling, butterfly), with feedback in l1-f2, and the skill check asks it again with Vogel, bird
    - id: false-friend
      what: Uses a German word in English because an English word looks or sounds the same (rock for Rock, handy for Handy)
      addressed: lesson 2 Learn names four false friends and what the English word really means; every stage of lesson 2 asks "Heißt der … auf Englisch auch …?" for a false friend, with feedback in l2-f1, l2-f3 and l2-s2
    - id: never-alike
      what: After false friends, distrusts every similar word
      addressed: lesson 2 mixes true pairs (Hand, hand; Maus, mouse; Haus, house) into each stage, with feedback in l2-f5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Haus und house", en: "Haus and house" }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Englisch und Deutsch sind Geschwister. Darum klingen manche Wörter fast gleich. Auf Deutsch sagst du Haus. Auf Englisch:", en: "House." }
            show: { object: house }
          - say: { de: "Auf Deutsch Milch, auf Englisch:", en: "Milk." }
            show: { object: milk }
          - say: { de: "Auf Deutsch Wasser, auf Englisch:", en: "Water." }
            show: { object: water }
          - say: { de: "Auf Deutsch Buch, auf Englisch:", en: "Book." }
            show: { object: book }
          - say: { de: "Aber nicht alle Wörter sind so. Auf Deutsch sagst du Hund. Auf Englisch klingt es ganz anders:", en: "Dog." }
            show: { object: dog }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                say: { de: "Auf Deutsch sagst du Haus. Hör, wie es auf Englisch heißt. Klingt es fast gleich?", en: "House." }
                show: { object: house }
                answer: true
                hints:
                  - "Sag leise Haus. Hör noch einmal: house."
                  - "Klingen die beiden Wörter ähnlich?"
                  - "Ja. Haus und house klingen fast gleich."
                difficulty: easy
              - id: l1-f2
                type: true_false
                say: { de: "Auf Deutsch sagst du Ente. Hör, wie es auf Englisch heißt. Klingt es fast gleich?", en: "Duck." }
                show: { object: duck }
                answer: false
                feedback:
                  "true": "Ente und duck klingen ganz verschieden. Nicht alle Wörter sind ähnlich."
                hints:
                  - "Sag leise Ente. Hör noch einmal: duck."
                  - "Klingt „duck“ wie Ente?"
                  - "Nein. Ente und duck klingen ganz anders."
              - id: l1-f3
                type: image_multiple_choice
                say: { de: "Welches englische Wort klingt fast wie das deutsche Wort? Tippe auf die Bilder und hör zu." }
                options: [{ object: milk }, { object: dog }, { object: rabbit }]
                answer: milk
                feedback:
                  dog: "Dog heißt Hund. Das klingt ganz anders."
                hints:
                  - "Tippe auf jedes Bild und hör das englische Wort."
                  - "Sag dazu leise das deutsche Wort: Milch, Hund, Kaninchen."
                  - "Milch und milk klingen fast gleich."
              - id: l1-f4
                type: audio_choice
                say: { de: "Hör zu. Das Wort klingt fast wie ein deutsches Wort. Tippe auf das Bild." }
                audio: { en: "Water." }
                options: [{ object: juice }, { object: water }, { object: milk }]
                answer: water
                hints:
                  - "Hör noch einmal: water."
                  - "Welches deutsche Wort klingt fast so?"
                  - "„Water“ klingt fast wie Wasser."
              - id: l1-f5
                type: speak
                say: { de: "Sag das englische Wort. Es klingt fast wie Buch.", en: "Book." }
                show: { object: book }
                expected_text: book
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Fast wie Buch, nur mit k am Ende."
                  - "Sag mit mir: book."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                say: { de: "Auf Deutsch sagst du Sonne. Hör, wie es auf Englisch heißt. Klingt es fast gleich?", en: "Sun." }
                show: { object: sun }
                answer: true
                hints: ["Sag leise Sonne. Und dann: sun."]
              - id: l1-s2
                type: true_false
                say: { de: "Auf Deutsch sagst du Hund. Hör, wie es auf Englisch heißt. Klingt es fast gleich?", en: "Dog." }
                show: { object: dog }
                answer: false
                hints: ["Klingt „dog“ wie Hund?"]
              - id: l1-s3
                type: image_multiple_choice
                say: { de: "Welches englische Wort klingt fast wie das deutsche Wort? Tippe auf die Bilder und hör zu." }
                options: [{ object: chair }, { object: table }, { object: bed }]
                answer: bed
                hints: ["Sag leise Stuhl, Tisch, Bett. Welches englische Wort klingt ähnlich?"]
              - id: l1-s4
                type: audio_choice
                say: { de: "Hör zu. Das Wort klingt fast wie ein deutsches Wort. Tippe auf das Bild." }
                audio: { en: "Bread." }
                options: [{ object: cheese }, { object: cake }, { object: bread }]
                answer: bread
                hints: ["„Bread“ klingt fast wie Brot."]
              - id: l1-s5
                type: speak
                say: { de: "Sag das englische Wort. Es klingt fast wie Milch.", en: "Milk." }
                show: { object: milk }
                expected_text: milk
                hints: ["Fast wie Milch, nur mit k am Ende."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                say: { de: "Auf Deutsch sagst du Buch. Hör, wie es auf Englisch heißt. Klingt es fast gleich?", en: "Book." }
                show: { object: book }
                answer: true
              - id: l1-n2
                type: true_false
                say: { de: "Auf Deutsch sagst du Schmetterling. Hör, wie es auf Englisch heißt. Klingt es fast gleich?", en: "Butterfly." }
                show: { object: butterfly }
                answer: false
              - id: l1-n3
                type: image_multiple_choice
                say: { de: "Welches englische Wort klingt fast wie das deutsche Wort? Tippe auf die Bilder und hör zu." }
                options: [{ object: spoon }, { object: apple }, { object: knife }]
                answer: apple
              - id: l1-n4
                type: audio_choice
                say: { de: "Hör zu. Das Wort klingt fast wie ein deutsches Wort. Tippe auf das Bild." }
                audio: { en: "Sun." }
                options: [{ object: moon }, { object: star }, { object: sun }]
                answer: sun
              - id: l1-n5
                type: speak
                say: { de: "Sag das englische Wort. Es klingt fast wie Haus." }
                show: { object: house }
                expected_text: house

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: true_false
            say: { de: "Auf Deutsch sagst du Milch. Hör, wie es auf Englisch heißt. Klingt es fast gleich?", en: "Milk." }
            show: { object: milk }
            answer: true
          - id: l1-c2
            type: audio_choice
            say: { de: "Hör zu. Das Wort klingt fast wie ein deutsches Wort. Tippe auf das Bild." }
            audio: { en: "Book." }
            options: [{ object: book }, { object: bed }, { object: ball }]
            answer: book
          - id: l1-c3
            type: true_false
            say: { de: "Auf Deutsch sagst du Hund. Hör, wie es auf Englisch heißt. Klingt es fast gleich?", en: "Dog." }
            show: { object: dog }
            answer: false

  - n: 2
    title: { de: "Falsche Freunde", en: "False friends" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Weißt du noch? Das Wort klingt fast wie ein deutsches Wort. Tippe auf das Bild." }
            audio: { en: "Milk." }
            options: [{ object: milk }, { object: juice }]
            answer: milk
            difficulty: easy
          - id: l2-w2
            type: true_false
            say: { de: "Weißt du noch? Auf Deutsch sagst du Wasser. Hör, wie es auf Englisch heißt. Klingt es fast gleich?", en: "Water." }
            show: { object: water }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Manche Wörter tun nur so, als wären sie gleich. Sie heißen falsche Freunde. Der Rock heißt auf Englisch nicht rock, sondern:", en: "Skirt. Skirt." }
            show: { object: skirt }
          - say: { de: "Sagst du in England rock, denken alle an einen Stein. Und die Hose heißt auf Englisch nicht hose, sondern:", en: "Trousers." }
            show: { object: trousers }
          - say: { de: "Das Handy heißt auf Englisch:", en: "Mobile phone." }
            show: { object: mobile-phone }
          - say: { de: "Und ein Kind heißt auf Englisch:", en: "Child." }
            show: { object: child }
          - say: { de: "Das englische Wort kind gibt es auch. Es heißt aber nett. Viele Wörter sind trotzdem echte Freunde, wie Hand:", en: "Hand." }
            show: { object: hand }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                say: { de: "Heißt der Rock auf Englisch auch rock?" }
                show: { object: skirt }
                answer: false
                feedback:
                  "true": "Nein, das ist ein falscher Freund. Der Rock heißt „skirt“. „Rock“ ist auf Englisch ein Stein."
                hints:
                  - "Denk an die falschen Freunde."
                  - "Auf Englisch ist rock ein Stein."
                  - "Nein. Der Rock heißt „skirt“."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Skirt." }
                options: [{ object: sock }, { object: skirt }, { object: shoe }]
                answer: skirt
                hints:
                  - "Hör noch einmal: skirt."
                  - "Das ist der falsche Freund von eben."
                  - "„Skirt“ ist der Rock."
              - id: l2-f3
                type: true_false
                say: { de: "Heißt das Kind auf Englisch auch Kind?" }
                show: { object: child }
                answer: false
                feedback:
                  "true": "Nein. Ein Kind heißt „child“. Das englische Wort kind heißt nett."
                hints:
                  - "Denk an die falschen Freunde."
                  - "Das englische Wort kind heißt nett."
                  - "Nein. Ein Kind heißt „child“."
              - id: l2-f4
                type: speak
                say: { de: "So heißt das Handy auf Englisch. Sprich nach.", en: "Mobile phone." }
                show: { object: mobile-phone }
                expected_text: mobile phone
                hints:
                  - "Hör erst ganz zu, dann sprich."
                  - "Zwei Wörter: mobile … phone."
                  - "Sag mit mir: mobile phone."
              - id: l2-f5
                type: true_false
                say: { de: "Heißt die Hand auf Englisch auch hand?" }
                show: { object: hand }
                answer: true
                feedback:
                  "false": "Doch, hier sind die Wörter echte Freunde. Hand heißt „hand“."
                hints:
                  - "Nicht jedes Wort ist ein falscher Freund."
                  - "Erinnerst du dich? Hand war ein echter Freund."
                  - "Ja. Hand heißt auf Englisch „hand“."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Trousers." }
                options: [{ object: trousers }, { object: skirt }, { object: jumper }]
                answer: trousers
                hints: ["„Trousers“ ist das englische Wort für Hose."]
              - id: l2-s2
                type: true_false
                say: { de: "Heißt die Hose auf Englisch auch hose?" }
                show: { object: trousers }
                answer: false
                feedback:
                  "true": "Nein, das ist ein falscher Freund. Die Hose heißt „trousers“."
                hints: ["Denk an die falschen Freunde."]
              - id: l2-s3
                type: speak
                say: { de: "Sag Kind auf Englisch.", en: "Child." }
                show: { object: child }
                expected_text: child
                hints: ["Hör erst ganz zu: child."]
              - id: l2-s4
                type: true_false
                say: { de: "Hör zu. Heißt die Maus auf Englisch so?", en: "Mouse." }
                show: { object: mouse }
                answer: true
                hints: ["Maus und mouse sind echte Freunde."]
              - id: l2-s5
                type: true_false
                say: { de: "Hör zu. Heißt das Handy auf Englisch so?", en: "Mobile phone." }
                show: { object: mobile-phone }
                answer: true
                hints: ["Handy ist ein falscher Freund. Auf Englisch sagt man dazu zwei Wörter."]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                say: { de: "Hör zu. Heißt der Rock auf Englisch so?", en: "Skirt." }
                show: { object: skirt }
                answer: true
              - id: l2-n2
                type: true_false
                say: { de: "Heißt das Handy auf Englisch auch handy?" }
                show: { object: mobile-phone }
                answer: false
              - id: l2-n3
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Child." }
                options: [{ object: baby }, { object: child }, { object: mum }]
                answer: child
              - id: l2-n4
                type: speak
                say: { de: "Sag Hose auf Englisch." }
                show: { object: trousers }
                expected_text: trousers
              - id: l2-n5
                type: true_false
                say: { de: "Hör zu. Heißt das Haus auf Englisch so?", en: "House." }
                show: { object: house }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: true_false
            say: { de: "Klingen die beiden Wörter fast gleich? Auf Deutsch heißt es Brot. Auf Englisch:", en: "Bread." }
            show: { object: bread }
            answer: true
          - id: l2-c2
            type: true_false
            say: { de: "Klingen die beiden Wörter fast gleich? Auf Deutsch heißt es Vogel. Auf Englisch:", en: "Bird." }
            show: { object: bird }
            answer: false
          - id: l2-c3
            type: true_false
            say: { de: "Ein Mädchen in London zeigt auf ihren Rock. Sagt sie dazu rock?" }
            show: { object: skirt }
            answer: false
          - id: l2-c4
            type: audio_choice
            say: { de: "Hör gut zu. Welches Bild passt?" }
            audio: { en: "Trousers." }
            options: [{ object: skirt }, { object: sock }, { object: trousers }]
            answer: trousers
          - id: l2-c5
            type: image_multiple_choice
            say: { de: "Welches englische Wort klingt fast wie das deutsche? Tippe auf die Bilder und hör gut zu." }
            options: [{ object: duck }, { object: book }, { object: dog }]
            answer: book
