# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-classroom-phrases
skill: fl.listening.classroom-phrases
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Was sollst du tun?
  en: Classroom instructions
summary: >
  The very first English lessons. Children hear short classroom
  instructions (Stand up! Listen! Clap your hands!) and show they understand
  by tapping the child who does it. Stufe 0 is oral only: instructions to
  the child are spoken in German, the English is heard, never read. Lesson
  1 brings four instructions, lesson 2 six more, and ends with the skill
  check over all ten.
metadata:
  year: stufe-0
  topic: { de: Hören, en: Listening }
  ages: [6-7]
  lesson_minutes: 8
  builds_on: []
  also_practises: [fl.speaking.imitate]
  vocabulary: { en: ["Stand up!", "Sit down!", "Listen!", "Look!", "Clap your hands!", "Jump!", "Be quiet!", "Wave!", "Point!", "Open your book!"] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: stand-sit
      what: Mixes up stand up and sit down, the first pair children hear
      addressed: 'lesson 1 sets them side by side in every stage; hints act it out ("„Stand up“ heißt: Steh auf")'
    - id: look-listen
      what: Mixes up look and listen
      addressed: hints point at the body part (Ohr, Augen); options always offer both
    - id: whole-sentence
      what: Waits for a full sentence and misses a one-word instruction (Jump!)
      addressed: Learn plays each instruction twice; the audio can be heard again with the big speaker
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Aufstehen, hinsetzen", en: "Stand up, sit down" }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör zu. So sagt man auf Englisch: Steh auf.", en: "Stand up! Stand up!" }
            show: { object: stand-up }
          - say: { de: "Und so: Setz dich hin.", en: "Sit down! Sit down!" }
            show: { object: sit-down }
          - say: { de: "Hör gut zu.", en: "Listen! Listen!" }
            show: { object: listen }
          - say: { de: "Schau her.", en: "Look! Look!" }
            show: { object: look }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Stand up!" }
                options: [{ object: stand-up }, { object: sit-down }, { object: listen }]
                answer: stand-up
                feedback:
                  sit-down: "Das Kind sitzt. „Stand up“ heißt: Steh auf."
                hints:
                  - "Hör noch einmal: Stand up!"
                  - "„Up“ heißt: nach oben. Das Kind steht auf."
                  - "Tippe auf das Kind, das aufsteht."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Sit down!" }
                options: [{ object: look }, { object: stand-up }, { object: sit-down }]
                answer: sit-down
                feedback:
                  stand-up: "Das Kind steht auf. „Sit down“ heißt: Setz dich hin."
                hints:
                  - "Hör noch einmal: Sit down!"
                  - "„Down“ heißt: nach unten. Das Kind setzt sich hin."
                  - "Tippe auf das Kind auf dem Stuhl."
              - id: l1-f3
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Listen!" }
                show: { object: listen }
                answer: true
                hints:
                  - "Hör noch einmal: Listen!"
                  - "„Listen“ heißt: Hör zu. Was macht das Kind?"
                  - "Ja, das Kind hört zu."
              - id: l1-f4
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Look!" }
                options: [{ object: listen }, { object: look }, { object: sit-down }]
                answer: look
                feedback:
                  listen: "Das Kind hört zu. „Look“ heißt: Schau."
                hints:
                  - "Hör noch einmal: Look!"
                  - "„Look“ heißt: Schau. Dafür brauchst du die Augen."
                  - "Tippe auf das Kind, das in die Ferne schaut."
              - id: l1-f5
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Stand up!" }
                show: { object: sit-down }
                answer: false
                hints:
                  - "Hör noch einmal: Stand up!"
                  - "„Stand up“ heißt: Steh auf. Steht das Kind auf?"
                  - "Nein, das Kind sitzt."
              - id: l1-f6
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Sit down!" }
                show: { object: sit-down }
                expected_text: "sit down"
                hints:
                  - "Hör noch einmal: Sit down!"
                  - "Zwei kurze Wörter: „sit“ und „down“."
                  - "Sag mit mir: Sit down!"

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Listen!" }
                options: [{ object: look }, { object: listen }, { object: stand-up }]
                answer: listen
                hints: ["Bei „listen“ brauchst du die Ohren."]
              - id: l1-s2
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Sit down!" }
                show: { object: sit-down }
                answer: true
                hints: ["„Down“ heißt: nach unten."]
              - id: l1-s3
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Stand up!" }
                options: [{ object: sit-down }, { object: look }, { object: stand-up }]
                answer: stand-up
                hints: ["„Up“ heißt: nach oben."]
              - id: l1-s4
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Look!" }
                show: { object: listen }
                answer: false
                hints: ["Bei „look“ brauchst du die Augen."]
              - id: l1-s5
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Sit down!" }
                options: [{ object: sit-down }, { object: listen }, { object: look }]
                answer: sit-down
                hints: ["„Down“ heißt: nach unten. Das Kind setzt sich hin."]
              - id: l1-s6
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Listen!" }
                show: { object: listen }
                expected_text: "listen"
                hints: ["Hör noch einmal: Listen!"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Look!" }
                options: [{ object: stand-up }, { object: look }, { object: listen }]
                answer: look
              - id: l1-n2
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Stand up!" }
                show: { object: stand-up }
                answer: true
              - id: l1-n3
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Listen!" }
                options: [{ object: listen }, { object: sit-down }, { object: look }]
                answer: listen
              - id: l1-n4
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Sit down!" }
                show: { object: look }
                answer: false
              - id: l1-n5
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Stand up!" }
                options: [{ object: look }, { object: stand-up }, { object: sit-down }]
                answer: stand-up

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
            audio: { en: "Sit down!" }
            options: [{ object: stand-up }, { object: sit-down }, { object: look }]
            answer: sit-down
          - id: l1-c2
            type: audio_choice
            say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
            audio: { en: "Look!" }
            options: [{ object: look }, { object: listen }, { object: stand-up }]
            answer: look
          - id: l1-c3
            type: true_false
            say: { de: "Hör zu. Passt das Bild?", en: "Listen!" }
            show: { object: look }
            answer: false

  - n: 2
    title: { de: "Klatschen, springen, winken", en: "Clap, jump, wave" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
            audio: { en: "Stand up!" }
            options: [{ object: stand-up }, { object: sit-down }]
            answer: stand-up
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
            audio: { en: "Listen!" }
            options: [{ object: look }, { object: listen }]
            answer: listen
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Neue Wörter. Klatsch in die Hände.", en: "Clap your hands! Clap your hands!" }
            show: { object: clap }
          - say: { de: "Spring.", en: "Jump! Jump!" }
            show: { object: jump }
          - say: { de: "Sei leise.", en: "Be quiet! Be quiet!" }
            show: { object: quiet }
          - say: { de: "Winke.", en: "Wave! Wave!" }
            show: { object: wave }
          - say: { de: "Zeig drauf.", en: "Point! Point!" }
            show: { object: point }
          - say: { de: "Mach dein Buch auf.", en: "Open your book! Open your book!" }
            show: { object: book-open }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Clap your hands!" }
                options: [{ object: clap }, { object: wave }, { object: jump }]
                answer: clap
                feedback:
                  wave: "Das Kind winkt. „Clap your hands“ heißt: Klatsch in die Hände."
                hints:
                  - "Hör noch einmal: Clap your hands!"
                  - "„Hands“ sind die Hände. Was machst du mit beiden Händen?"
                  - "Tippe auf das Kind, das klatscht."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Jump!" }
                options: [{ object: stand-up }, { object: jump }, { object: point }]
                answer: jump
                hints:
                  - "Hör noch einmal: Jump!"
                  - "„Jump“ heißt: Spring."
                  - "Tippe auf das Kind in der Luft."
              - id: l2-f3
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Be quiet!" }
                show: { object: quiet }
                answer: true
                hints:
                  - "Hör noch einmal: Be quiet!"
                  - "„Be quiet“ heißt: Sei leise. Was macht das Kind mit dem Finger?"
                  - "Ja, das Kind ist leise."
              - id: l2-f4
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Open your book!" }
                options: [{ object: book }, { object: book-open }, { object: look }]
                answer: book-open
                feedback:
                  book: "Dieses Buch ist zu. „Open“ heißt: Mach auf."
                hints:
                  - "Hör noch einmal: Open your book!"
                  - "„Open“ heißt: Mach auf. „Book“ heißt: Buch."
                  - "Tippe auf das offene Buch."
              - id: l2-f5
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Wave!" }
                options: [{ object: wave }, { object: point }, { object: clap }]
                answer: wave
                hints:
                  - "Hör noch einmal: Wave!"
                  - "„Wave“ heißt: Winke."
                  - "Tippe auf das Kind, das winkt."
              - id: l2-f6
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Point!" }
                show: { object: wave }
                answer: false
                hints:
                  - "Hör noch einmal: Point!"
                  - "„Point“ heißt: Zeig drauf. Zeigt das Kind auf etwas?"
                  - "Nein, das Kind winkt."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Point!" }
                options: [{ object: clap }, { object: point }, { object: quiet }]
                answer: point
                hints: ["„Point“ heißt: Zeig drauf."]
              - id: l2-s2
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Jump!" }
                show: { object: jump }
                answer: true
                hints: ["„Jump“ heißt: Spring."]
              - id: l2-s3
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Be quiet!" }
                options: [{ object: quiet }, { object: listen }, { object: wave }]
                answer: quiet
                hints: ["„Be quiet“ heißt: Sei leise."]
              - id: l2-s4
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Sit down!" }
                options: [{ object: jump }, { object: sit-down }, { object: clap }]
                answer: sit-down
                hints: ["Das kennst du schon: „down“ heißt nach unten."]
              - id: l2-s5
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Clap your hands!" }
                show: { object: point }
                answer: false
                hints: ["Klatscht das Kind in die Hände?"]
              - id: l2-s6
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Jump!" }
                show: { object: jump }
                expected_text: "jump"
                hints: ["Hör noch einmal: Jump!"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Open your book!" }
                options: [{ object: book-open }, { object: listen }, { object: book }]
                answer: book-open
              - id: l2-n2
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Wave!" }
                options: [{ object: point }, { object: jump }, { object: wave }]
                answer: wave
              - id: l2-n3
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Look!" }
                show: { object: look }
                answer: true
              - id: l2-n4
                type: audio_choice
                say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
                audio: { en: "Clap your hands!" }
                options: [{ object: quiet }, { object: clap }, { object: stand-up }]
                answer: clap
              - id: l2-n5
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Be quiet!" }
                show: { object: jump }
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: true_false
            say: { de: "Hör zu. Passt das Bild?", en: "Jump!" }
            show: { object: clap }
            answer: false
          - id: l2-c2
            type: audio_choice
            say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
            audio: { en: "Stand up, please!" }
            options: [{ object: sit-down }, { object: clap }, { object: stand-up }]
            answer: stand-up
          - id: l2-c3
            type: audio_choice
            say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
            audio: { en: "Listen, please!" }
            options: [{ object: listen }, { object: quiet }, { object: look }]
            answer: listen
          - id: l2-c4
            type: true_false
            say: { de: "Hör zu. Passt das Bild?", en: "Point!" }
            show: { object: point }
            answer: true
          - id: l2-c5
            type: audio_choice
            say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
            audio: { en: "Please open your book!" }
            options: [{ object: book }, { object: clap }, { object: book-open }]
            answer: book-open
