# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-familiar-words
skill: fl.listening.familiar-words
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Wörter, die ich kenne
  en: Words I know
summary: >
  Children hear English words and tap the matching picture. The first
  words sound almost like German ones (ball, Ball; mouse, Maus; house,
  Haus), so children can understand English from the very start. Lesson 1
  brings six such words, lesson 2 eight more and the classroom instruction
  Point to the ... ! and ends with the skill check. Oral only: nothing is
  read.
metadata:
  year: stufe-0
  topic: { de: Hören, en: Listening }
  ages: [6-7]
  lesson_minutes: 8
  builds_on: [fl.listening.classroom-phrases]
  also_practises: [fl.speaking.imitate]
  vocabulary: { en: [ball, banana, apple, house, mouse, fish, hand, nose, shoe, boat, elephant, giraffe, crocodile, telephone] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: first, what: { de: "Ball, Banane, Apfel, Haus, Maus und Fisch auf Englisch verstehen", en: "understanding ball, banana, apple, house, mouse and fish" } }
    - { id: more, what: { de: die Wörter aus Lektion 2 auf Englisch verstehen, en: understanding the words from lesson 2 } }
    - { id: point, what: { de: "„Point to the …!“ verstehen und auf das Bild zeigen", en: "understanding “Point to the …!” and pointing to the picture" } }
  misconceptions:
    - id: german-sound
      what: Expects the German sound and misses the English one (Maus, mouse)
      addressed: Learn plays the German word, then the English one, and says what changes
    - id: false-friend
      what: Thinks every similar-sounding word means the same (an English word that sounds like a different German word)
      addressed: kept for the compare-languages skill; here every word is a true pair
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Das klingt wie Deutsch, en: It sounds like German }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Was sollst du tun? Tippe auf das Bild."
            say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
            audio: { en: "Listen!" }
            options: [{ object: listen }, { object: jump }]
            answer: listen
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Was sollst du tun? Tippe auf das Bild."
            say: { de: "Hör zu. Was sollst du tun? Tippe auf das Bild." }
            audio: { en: "Look!" }
            options: [{ object: clap }, { object: look }]
            answer: look
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Manche englischen Wörter klingen fast wie deutsche. Auf Deutsch sagst du Ball. Auf Englisch:", en: "Ball. Ball." }
            show: { object: ball }
          - say: { de: "Auf Deutsch Maus, auf Englisch:", en: "Mouse. Mouse." }
            show: { object: mouse }
          - say: { de: "Auf Deutsch Haus, auf Englisch:", en: "House. House." }
            show: { object: house }
          - say: { de: "Banane heißt auf Englisch:", en: "Banana." }
            show: { object: banana }
          - say: { de: "Apfel heißt auf Englisch:", en: "Apple." }
            show: { object: apple }
          - say: { de: "Und Fisch heißt auf Englisch:", en: "Fish." }
            show: { object: fish }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Mouse." }
                options: [{ object: mouse }, { object: house }, { object: fish }]
                answer: mouse
                feedback:
                  house: "„House“ ist das Haus. „Mouse“ ist die Maus."
                hints:
                  - "Hör noch einmal: mouse."
                  - "„Mouse“ klingt fast wie ein Tier auf Deutsch."
                  - "„Mouse“ heißt Maus."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Apple." }
                options: [{ object: ball }, { object: banana }, { object: apple }]
                answer: apple
                hints:
                  - "Hör noch einmal: apple."
                  - "„Apple“ klingt fast wie Apfel."
                  - "Tippe auf den Apfel."
              - id: l1-f3
                type: true_false
                text: "Passt das Bild?"
                say: { de: "Hör zu. Passt das Bild?", en: "Fish." }
                show: { object: fish }
                answer: true
                hints:
                  - "Hör noch einmal: fish."
                  - "„Fish“ klingt fast wie Fisch."
                  - "Ja, das ist ein Fisch."
              - id: l1-f4
                type: audio_choice
                text: "Tippe auf das Bild."
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "House." }
                options: [{ object: mouse }, { object: house }, { object: apple }]
                answer: house
                feedback:
                  mouse: "„Mouse“ ist die Maus. „House“ ist das Haus."
                hints:
                  - "Hör noch einmal: house."
                  - "„House“ klingt fast wie Haus."
                  - "Tippe auf das Haus."
              - id: l1-f5
                type: speak
                text: "Sag es auf Englisch."
                say: { de: "Sag es auf Englisch.", en: "Banana." }
                show: { object: banana }
                expected_text: "banana"
                hints:
                  - "Hör noch einmal: banana."
                  - "Fast wie Banane, nur am Ende ein a statt e."
                  - "Sag mit mir: banana."
              - id: l1-f6
                type: true_false
                text: "Passt das Bild?"
                say: { de: "Hör zu. Passt das Bild?", en: "Ball." }
                show: { object: apple }
                answer: false
                hints:
                  - "Hör noch einmal: ball."
                  - "Das englische Wort „ball“ klingt fast wie unser Wort Ball."
                  - "Nein, das ist ein Apfel."

          - support: some
