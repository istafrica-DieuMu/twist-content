          - text: "20 · 45 = 900 | 3 · 45 = 135"
            say: "Zwanzig mal fünfundvierzig ist neunhundert. Drei mal fünfundvierzig ist hundertfünfunddreißig."
          - text: "900 + 135 = 1035"
            say: "Zum Schluss addierst du die Teilergebnisse: neunhundert plus hundertfünfunddreißig ist tausendfünfunddreißig."

