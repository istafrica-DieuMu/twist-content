                hints:
                  - "Zwanzig muss mit der ganzen Dreizehn malgenommen werden."
                  - "Richtig wäre zwanzig mal dreizehn plus vier mal dreizehn."
                  - "Er hat Zehner nur mit Zehnern und Einer nur mit Einern malgenommen."
