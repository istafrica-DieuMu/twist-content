# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.multi-digit-semi
skill: math.mult-div-larger.multi-digit-semi
curriculum: de-DE
language: de
title:
  de: Halbschriftlich malnehmen und teilen
  en: Informal written multiplication and division
summary: >
  Multiplying two two-digit numbers and dividing large numbers
  halbschriftlich. Lesson 1 splits one factor into tens and ones
  (23 · 45 = 20 · 45 + 3 · 45) and adds the parts; lesson 2 divides
  four-digit numbers by a one-digit number in steps (2568 : 4 =
  2400 : 4 + 160 : 4 + 8 : 4) when it works out exactly, divides by full
  tens through the one-digit fact (840 : 20: first : 2, then : 10),
  checks with the Probe, and ends with the skill check. Divisors stay
  one-digit or full tens, as Klasse 4 Lehrpläne ask; division by other
  two-digit numbers is left out. Typed answers are plain digits.
metadata:
  year: klasse-4
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.large-mental]
  also_practises: [math.mult-div-larger.large-mental]
  vocabulary: { de: [halbschriftlich, zerlegen, Teilaufgabe, Probe] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: mult, what: { de: zweistellige Zahlen halbschriftlich malnehmen, en: multiplying two two-digit numbers informally } }
    - { id: div-one, what: { de: vierstellige Zahlen schrittweise durch einstellige Zahlen teilen, en: dividing four-digit numbers by a one-digit number in steps } }
    - { id: div-tens, what: { de: durch Zehnerzahlen teilen, en: dividing by multiples of ten } }
  misconceptions:
    - id: tens-times-tens-only
      what: Multiplies only tens with tens and ones with ones (23 · 45 = 20 · 40 + 3 · 5)
      addressed: lesson 1 Learn multiplies the whole second factor with each part; a "Wo ist der Fehler?" task with that slip in every stage of lesson 1, with feedback in l1-f3
    - id: forget-a-part
      what: Forgets one part when adding the partial results
      addressed: lesson 1 frames ask for each part and then the total; lesson 2 frames ask for each step and the sum of the step results
    - id: tens-divisor-one-step
      what: "Divides by a full ten as if by its digit alone (840 : 20 = 420)"
      addressed: "lesson 2 Learn splits : 20 into : 2 and then : 10; frames in the full and none stages ask for both steps, and l2-s5 shows a result off by a factor of ten"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
