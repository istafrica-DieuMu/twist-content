# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.name-fractions
skill: math.fractions.name-fractions
curriculum: de-DE
language: de
title:
  de: Brüche benennen
  en: Naming fractions
summary: >
  Lesson 1 names a fraction of a whole: a circle, bar or rectangle in equal
  parts, the Nenner counting all parts and the Zähler the coloured ones;
  it names Drittel, Fünftel, Sechstel, Achtel and Zehntel and shows that
  more parts make each part smaller (ein Achtel is less than ein Viertel).
  Lesson 2 names a fraction of a set (2 of 5 children, one of three equal
  rows of dots), matches picture, word and number, and ends with the skill
  check. Fractions are written 3/4 on screen and spoken as words; fraction
  options are not read aloud.
metadata:
  year: klasse-4
  topic: { de: Brüche, en: Fractions }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.fractions.halves-quarters, math.mult-div.div-meaning]
  also_practises: [math.fractions.halves-quarters]
  vocabulary: { de: [Bruch, Zähler, Nenner, Bruchstrich, Ganzes, ein Drittel, ein Fünftel, ein Sechstel, ein Achtel, ein Zehntel, drei Viertel] }
  forms: [text, audio, drawn]
  drawn: [fraction, dots]
  facets: []
  parts:
    - { id: whole, what: { de: den Bruchteil eines Ganzen benennen, en: naming a fraction of a whole } }
    - { id: set, what: { de: den Bruchteil einer Menge benennen, en: naming a fraction of a set } }
    - { id: represent, what: { de: "Bild, Wort und Bruch zuordnen", en: "matching picture, word and fraction" } }
    - { id: compare, what: { de: Brüche wie 1/8 und 1/4 der Größe nach vergleichen, en: comparing fractions such as 1/8 and 1/4 } }
  misconceptions:
    - id: shaded-over-unshaded
      what: Writes coloured parts over uncoloured parts (2/3 for two of five parts coloured) instead of over all parts
      addressed: lesson 1 Learn says the Nenner counts all parts; l1-f2 and l2-f2 (with feedback), l1-s2, l2-s2, l2-n1, l2-n4, l2-n5 and l2-c1 offer the coloured-over-white fraction
    - id: zaehler-nenner-swapped
      what: Puts the number of parts on top and the coloured parts below (3/1 for one of three)
      addressed: l1-f1 (with feedback), l1-s1, l1-n2, l1-n1 and l2-n2 (Zähler and Nenner as separate gaps), l2-s2 and l2-c1
    - id: bigger-denominator-bigger
      what: Thinks 1/8 is more than 1/4 because 8 is more than 4
      addressed: lesson 1 Learn screen 3 sets ein Achtel against ein Viertel; l1-f5 (with feedback), l1-s4, l1-n4, l1-c3, l2-w2 and l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Teile eines Ganzen", en: "Parts of a whole" }
    goal:
      de: "Benenne Brüche wie drei Viertel, wenn ein Ganzes in gleich große Teile geteilt ist. Ein Achtel ist kleiner als ein Viertel."
      en: "Name fractions like three quarters when a whole is cut into equal parts. An eighth is smaller than a quarter."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Teil ist rot?"
            say: "Welcher Teil des Kreises ist rot?"
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
            options: ["ein Viertel", "die Hälfte", "alles"]
            answer: "ein Viertel"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "12 : 3 = _"
            say: "Wie viel ist zwölf geteilt durch drei?"
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3/4\nZähler: 3 Teile sind rot.\nNenner: 4 gleich große Teile insgesamt."
            say: "Dieser Kreis ist in vier gleich große Teile geteilt. Drei davon sind rot. Das schreibst du als Bruch: drei Viertel. Die Zahl unter dem Bruchstrich heißt Nenner. Sie nennt, in wie viele gleich große Teile das Ganze geteilt ist. Die Zahl über dem Bruchstrich heißt Zähler. Sie zählt, wie viele Teile gemeint sind."
            show: { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
          - text: "1/2 ein Halbes\n1/3 ein Drittel\n1/4 ein Viertel\n1/5 ein Fünftel\n1/6 ein Sechstel\n1/8 ein Achtel\n1/10 ein Zehntel"
            say: "So heißen die Brüche: ein Halbes, ein Drittel, ein Viertel, ein Fünftel, ein Sechstel, ein Achtel, ein Zehntel. Ab vier hängst du an die Zahl einfach tel an: Viertel, Fünftel, Zehntel. Meinst du mehrere Teile, sagst du ihre Zahl davor: zwei Fünftel, drei Achtel."
          - text: "1/8 ist kleiner als 1/4."
            say: "Je mehr Teile, desto kleiner ist jeder Teil. Teilst du einen Kuchen in acht Stücke, ist jedes Stück kleiner als bei vier Stücken. Ein Achtel ist also kleiner als ein Viertel, obwohl acht mehr ist als vier."
            show: { drawn: fraction, kind: bar, parts: 8, shaded: 1 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Bruchteil ist rot?"
                say: "Welcher Bruchteil ist rot gefärbt?"
                show: { drawn: fraction, kind: circle, parts: 3, shaded: 1 }
                options: ["1/3", "1/2", "3/1"]
                answer: "1/3"
                option_audio: false
                feedback:
                  "3/1": "Oben steht, wie viele Teile rot sind. Unten steht, in wie viele Teile das Ganze geteilt ist."
                hints:
                  - "Zähl zuerst alle Teile. Das ist der Nenner."
                  - "Es sind 3 Teile, 1 davon ist rot."
                  - "1/3, ein Drittel."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Bruchteil ist rot?"
                say: "Welcher Bruchteil ist rot gefärbt?"
                show: { drawn: fraction, kind: bar, parts: 5, shaded: 2 }
                options: ["2/5", "2/3", "3/5"]
                answer: "2/5"
                option_audio: false
                feedback:
                  "2/3": "Du hast rote und weiße Teile verglichen. Der Nenner zählt alle Teile: 5."
                  "3/5": "3/5 sind die weißen Teile. Gefragt sind die roten."
                hints:
                  - "Zähl alle Teile. Zähl dann die roten Teile."
                  - "Es sind 5 Teile, 2 davon sind rot."
                  - "2/5, zwei Fünftel."
              - id: l1-f3
                type: image_multiple_choice
                text: "Wo sind 3/4 gefärbt?"
                say: "Wo sind drei Viertel gefärbt?"
                options:
                  - { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
                  - { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
                  - { drawn: fraction, kind: circle, parts: 6, shaded: 3 }
                answer: "3/4"
                feedback:
                  "3/6": "Hier sind 3 Teile gefärbt, aber der Kreis hat 6 Teile. Du suchst 4 Teile."
                hints:
                  - "Der Nenner 4 sagt: Der Kreis hat 4 gleich große Teile."
                  - "Suche einen Kreis mit 4 Teilen. Dann zähl die gefärbten."
                  - "Der Kreis mit 4 Teilen, von denen 3 gefärbt sind."
              - id: l1-f4
                type: multiple_choice
                text: "Wie heißt dieser Bruch?\n1/6"
                say: "Wie heißt dieser Bruch?"
                options: ["ein Sechstel", "ein Sechser", "sechs Ganze"]
                answer: "ein Sechstel"
                hints:
                  - "Ab vier hängst du an die Zahl im Nenner die Endung „-tel“ an."
                  - "Unten steht 6, oben 1. Aus sechs wird Sechstel."
                  - "Ein Sechstel."
              - id: l1-f5
                type: multiple_choice
                text: "Was ist größer: 1/8 oder 1/4?"
                say: "Was ist größer: ein Achtel oder ein Viertel?"
                options: ["1/4", "1/8", "beide gleich groß"]
                answer: "1/4"
                keep_order: true
                option_audio: false
                feedback:
                  "1/8": "8 ist mehr als 4. Aber bei 8 Teilen ist jeder Teil kleiner."
                hints:
                  - "Denk an einen Kuchen. Einmal teilst du ihn in 4 Stücke, einmal in 8."
                  - "Bei 8 Stücken ist jedes Stück kleiner als bei 4."
                  - "Ein Viertel ist größer."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Bruchteil ist rot?"
                say: "Welcher Bruchteil ist rot gefärbt?"
                show: { drawn: fraction, kind: rect, parts: 6, rows: 2, shaded: 5 }
                options: ["5/6", "5/1", "1/6"]
                answer: "5/6"
                option_audio: false
                hints: ["Zähl alle Teile für den Nenner und die roten Teile für den Zähler."]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Bruchteil ist rot?"
                say: "Welcher Bruchteil ist rot gefärbt?"
                show: { drawn: fraction, kind: circle, parts: 8, shaded: 3 }
                options: ["3/8", "3/5", "5/8"]
                answer: "3/8"
                option_audio: false
                hints: ["Der Nenner zählt alle Teile, auch die weißen."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Wo ist 1/5 gefärbt?"
                say: "Wo ist ein Fünftel gefärbt?"
                options:
                  - { drawn: fraction, kind: bar, parts: 5, shaded: 1 }
                  - { drawn: fraction, kind: bar, parts: 4, shaded: 1 }
                  - { drawn: fraction, kind: bar, parts: 6, shaded: 5 }
                answer: "1/5"
                hints: ["Ein Fünftel: 5 gleich große Teile, einer davon gefärbt."]
              - id: l1-s4
                type: true_false
                text: "1/3 ist größer als 1/2."
                say: "Stimmt das? Ein Drittel ist größer als ein Halbes."
                answer: false
                hints: ["Je mehr Teile, desto kleiner ist jeder Teil."]
              - id: l1-s5
                type: matching
                text: "Verbinde jedes Bild mit seinem Bruch."
                say: "Verbinde jedes Bild mit seinem Bruch."
                pairs:
                  - { left: { drawn: fraction, kind: circle, parts: 3, shaded: 1 }, right: { text: "ein Drittel" } }
                  - { left: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }, right: { text: "drei Viertel" } }
                  - { left: { drawn: fraction, kind: rect, parts: 8, rows: 2, shaded: 1 }, right: { text: "ein Achtel" } }
                  - { left: { drawn: fraction, kind: circle, parts: 2, shaded: 1 }, right: { text: "ein Halbes" } }
                hints: ["Zähl bei jedem Bild zuerst alle Teile."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Schreib den Bruch für den roten Teil."
                say: "Schreib den Bruch für den roten Teil. Was ist der Zähler, was der Nenner?"
                show: { drawn: fraction, kind: bar, parts: 6, shaded: 1 }
                frame: "Zähler: _   Nenner: _"
                options: ["1", "5", "6"]
                answer: ["1", "6"]
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Bruchteil ist rot?"
                say: "Welcher Bruchteil ist rot gefärbt?"
                show: { drawn: fraction, kind: circle, parts: 5, shaded: 4 }
                options: ["4/5", "5/4", "1/5"]
                answer: "4/5"
                option_audio: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Wo ist 1/8 gefärbt?"
                say: "Wo ist ein Achtel gefärbt?"
                options:
                  - { drawn: fraction, kind: rect, parts: 8, rows: 2, shaded: 1 }
                  - { drawn: fraction, kind: rect, parts: 4, rows: 2, shaded: 1 }
                  - { drawn: fraction, kind: rect, parts: 8, rows: 2, shaded: 7 }
                answer: "1/8"
              - id: l1-n4
                type: multiple_choice
                text: "Welcher Bruch ist am kleinsten?"
                say: "Welcher Bruch ist am kleinsten: ein Zehntel, ein Drittel oder ein Fünftel?"
                options: ["1/10", "1/3", "1/5"]
                answer: "1/10"
                option_audio: false
              - id: l1-n5
                type: fill_in_blank
                text: "Schreib drei Fünftel als Bruch."
                say: "Schreib drei Fünftel als Bruch. Was ist der Zähler, was der Nenner?"
                frame: "Zähler: _   Nenner: _"
                options: ["2", "3", "5"]
                answer: ["3", "5"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welcher Bruchteil ist rot?"
            say: "Welcher Bruchteil ist rot gefärbt?"
            show: { drawn: fraction, kind: bar, parts: 3, shaded: 2 }
            options: ["2/3", "2/1", "1/3"]
            answer: "2/3"
            option_audio: false
          - id: l1-c2
            type: image_multiple_choice
            text: "Wo ist 1/4 gefärbt?"
            say: "Wo ist ein Viertel gefärbt?"
            options:
              - { drawn: fraction, kind: circle, parts: 4, shaded: 1 }
              - { drawn: fraction, kind: circle, parts: 3, shaded: 1 }
              - { drawn: fraction, kind: circle, parts: 4, shaded: 3 }
            answer: "1/4"
          - id: l1-c3
            type: true_false
            text: "1/6 ist kleiner als 1/2."
            say: "Stimmt das? Ein Sechstel ist kleiner als ein Halbes."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Welcher Bruchteil ist rot?"
            say: "Welcher Bruchteil ist rot gefärbt?"
            show: { drawn: fraction, kind: circle, parts: 5, shaded: 3 }
            options: ["3/5", "3/2", "2/5"]
            answer: "3/5"
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Wie heißt dieser Bruch?\n1/5"
            say: "Wie heißt dieser Bruch?"
            options: ["ein Fünftel", "ein Fünfer", "fünf Ganze"]
            answer: "ein Fünftel"
          - id: l1-c6
            type: true_false
            text: "1/10 ist größer als 1/4."
            say: "Stimmt das? Ein Zehntel ist größer als ein Viertel."
            answer: false

  - n: 2
    title: { de: "Teile einer Menge", en: "Parts of a set" }
    goal:
      de: "Finde Brüche in einer Gruppe. Tragen 2 von 5 Kindern eine Mütze, sind das zwei Fünftel der Kinder."
      en: "Find fractions of a group. If 2 out of 5 children wear a hat, that is two fifths of the children."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Bruchteil ist rot?"
            say: "Welcher Bruchteil ist rot gefärbt?"
            show: { drawn: fraction, kind: circle, parts: 6, shaded: 1 }
            options: ["1/6", "1/5", "6/1"]
            answer: "1/6"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist größer: 1/3 oder 1/5?"
            say: "Was ist größer: ein Drittel oder ein Fünftel?"
            options: ["1/3", "1/5", "beide gleich groß"]
            answer: "1/3"
            keep_order: true
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "12 Punkte in 3 gleichen Reihen.\n1 Reihe ist rot: 1/3 der Punkte.\n12 : 3 = 4 Punkte"
            say: "Ein Bruch kann auch ein Teil einer Menge sein. Hier sind zwölf Punkte in drei gleich großen Reihen. Eine Reihe ist rot. Das ist ein Drittel der Punkte. Zwölf geteilt durch drei ist vier: Ein Drittel der Punkte sind vier Punkte."
            show: { drawn: dots, array: [3, 4], split_rows: 1 }
          - text: "5 Kinder, 2 tragen eine Mütze.\n2/5 der Kinder tragen eine Mütze."
            say: "Fünf Kinder warten an der Bushaltestelle. Zwei davon tragen eine Mütze. Zwei von fünf, das sind zwei Fünftel der Kinder. Der Nenner zählt alle Kinder, der Zähler nur die mit Mütze."
          - text: "Bild, Wort und Zahl\ndrei Viertel = 3/4"
            say: "Einen Bruch kannst du zeichnen, sagen und schreiben. Das Bild, das Wort drei Viertel und die Zahl mit Bruchstrich meinen dasselbe."
            show: { drawn: fraction, kind: bar, parts: 4, shaded: 3 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Teil der Punkte ist rot?"
                say: "Welcher Teil der Punkte ist rot?"
                show: { drawn: dots, array: [4, 3], split_rows: 1 }
                options: ["1/4", "1/3", "4/1"]
                answer: "1/4"
                option_audio: false
                feedback:
                  "1/3": "Jede Reihe hat 3 Punkte. Zähl aber die Reihen: Es sind 4."
                hints:
                  - "Zähl die gleichen Reihen. Wie viele davon sind rot?"
                  - "Es sind 4 Reihen, 1 davon ist rot."
                  - "1/4, ein Viertel."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Von 8 Äpfeln sind 3 grün. Welcher Teil der Äpfel ist grün?"
                say: "Von acht Äpfeln sind drei grün. Welcher Teil der Äpfel ist grün?"
                options: ["3/8", "3/5", "5/8"]
                answer: "3/8"
                option_audio: false
                feedback:
                  "3/5": "Du hast grüne und andere Äpfel verglichen. Unten steht, wie viele Äpfel es insgesamt sind."
                  "5/8": "5/8 sind die Äpfel, die nicht grün sind."
                hints:
                  - "Der Nenner zählt alle Äpfel. Der Zähler zählt die grünen."
                  - "Es sind 8 Äpfel, 3 davon sind grün."
                  - "3/8, drei Achtel."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Teil der Punkte ist rot?"
                say: "Welcher Teil der Punkte ist rot?"
                show: { drawn: dots, array: [3, 5], split_rows: 2 }
                options: ["2/3", "1/3", "2/5"]
                answer: "2/3"
                option_audio: false
                feedback:
                  "2/5": "Jede Reihe hat 5 Punkte. Zähl aber die Reihen: Es sind 3."
                hints:
                  - "Zähl die gleichen Reihen und die roten Reihen."
                  - "Es sind 3 Reihen, 2 davon sind rot."
                  - "2/3, zwei Drittel."
              - id: l2-f4
                type: true_false
                text: "In der Gruppe sind 10 Kinder. 1 Kind hat heute Geburtstag. Das ist 1/10 der Kinder."
                say: "In der Gruppe sind zehn Kinder. Ein Kind hat heute Geburtstag. Stimmt das? Das ist ein Zehntel der Kinder."
                answer: true
                hints:
                  - "Der Nenner zählt alle Kinder."
                  - "1 von 10 Kindern."
                  - "Ja, 1/10 stimmt."
              - id: l2-f5
                type: image_multiple_choice
                text: "Wo ist 1/3 der Punkte rot?"
                say: "Wo ist ein Drittel der Punkte rot?"
                options:
                  - { drawn: dots, array: [3, 4], split_rows: 1 }
                  - { drawn: dots, array: [4, 3], split_rows: 1 }
                  - { drawn: dots, array: [2, 6], split_rows: 1 }
                answer: "3x4"
                hints:
                  - "Bei einem Drittel ist eine von 3 gleichen Reihen rot."
                  - "Zähl in jedem Bild die Reihen."
                  - "Das Bild mit 3 Reihen, von denen 1 rot ist."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Teil der Punkte ist rot?"
                say: "Welcher Teil der Punkte ist rot?"
                show: { drawn: dots, array: [5, 2], split_rows: 1 }
                options: ["1/5", "1/2", "5/1"]
                answer: "1/5"
                option_audio: false
                hints: ["Zähl die gleichen Reihen, nicht die Punkte in einer Reihe."]
              - id: l2-s2
                type: multiple_choice
                text: "Von 6 Kindern fahren 5 mit dem Bus. Welcher Teil der Kinder fährt mit dem Bus?"
                say: "Von sechs Kindern fahren fünf mit dem Bus. Welcher Teil der Kinder fährt mit dem Bus?"
                options: ["5/6", "5/1", "6/5"]
                answer: "5/6"
                option_audio: false
                hints: ["Oben stehen die Kinder im Bus, unten alle Kinder."]
              - id: l2-s3
                type: true_false
                text: "3/4 der Punkte sind rot."
                say: "Stimmt das? Drei Viertel der Punkte sind rot."
                show: { drawn: dots, array: [4, 3], split_rows: 3 }
                answer: true
                hints: ["Zähl alle Reihen und die roten Reihen."]
              - id: l2-s4
                type: matching
                text: "Verbinde jedes Wort mit seinem Bruch."
                say: "Verbinde jedes Wort mit seinem Bruch."
                pairs:
                  - { left: { text: "zwei Drittel" }, right: { text: "2/3" } }
                  - { left: { text: "drei Achtel" }, right: { text: "3/8" } }
                  - { left: { text: "ein Zehntel" }, right: { text: "1/10" } }
                  - { left: { text: "vier Fünftel" }, right: { text: "4/5" } }
                option_audio: false
                hints: ["Das erste Wort ist der Zähler, das zweite nennt den Nenner."]
              - id: l2-s5
                type: multiple_choice
                text: "Lea isst 2 von 8 Pizzastücken. Welcher Teil der Pizza bleibt übrig?"
                say: "Lea isst zwei von acht Pizzastücken. Welcher Teil der Pizza bleibt übrig?"
                options: ["6/8", "2/8", "6/2"]
                answer: "6/8"
                option_audio: false
                hints: ["Wie viele Stücke bleiben übrig? Wie viele waren es insgesamt?"]
                difficulty: stretch

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "In einer Tüte sind 7 Bonbons. 4 davon sind rot. Welcher Teil der Bonbons ist rot?"
                say: "In einer Tüte sind sieben Bonbons. Vier davon sind rot. Welcher Teil der Bonbons ist rot?"
                options: ["4/7", "4/3", "3/7"]
                answer: "4/7"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Von 9 Kindern spielen 2 Fußball. Schreib den Bruch."
                say: "Von neun Kindern spielen zwei Fußball. Schreib den Bruch. Was ist der Zähler, was der Nenner?"
                frame: "Zähler: _   Nenner: _"
                options: ["2", "7", "9"]
                answer: ["2", "9"]
              - id: l2-n3
                type: image_multiple_choice
                text: "Wo sind 2/3 der Punkte rot?"
                say: "Wo sind zwei Drittel der Punkte rot?"
                options:
                  - { drawn: dots, array: [3, 4], split_rows: 2 }
                  - { drawn: dots, array: [4, 3], split_rows: 2 }
                  - { drawn: dots, array: [2, 3], split_rows: 1 }
                answer: "3x4"
              - id: l2-n4
                type: true_false
                text: "Tim hat 10 Murmeln. 3 davon sind blau. Tim sagt: „3/7 meiner Murmeln sind blau.“"
                say: "Tim hat zehn Murmeln. Drei davon sind blau. Tim sagt: Drei Siebtel meiner Murmeln sind blau. Hat Tim recht?"
                answer: false
