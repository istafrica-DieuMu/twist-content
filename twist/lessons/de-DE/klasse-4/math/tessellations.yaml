                text: "Bei einem Parkett dürfen Formen übereinanderliegen."
                say: "Stimmt das? Bei einem Parkett dürfen Formen übereinanderliegen."
                answer: false
                hints:
                  - "Denk an die zwei Regeln für ein Parkett."
                  - "Keine Lücken, und nichts liegt über etwas anderem."
                  - "Nein, das stimmt nicht."
              - id: l2-f5
