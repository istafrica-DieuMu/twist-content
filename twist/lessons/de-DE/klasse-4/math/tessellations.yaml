# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.tessellations
skill: math.shapes.tessellations
curriculum: de-DE
language: de
title:
  de: Bandornamente und Parkette
  en: Friezes and tessellations
summary: >
  Lesson 1 continues Bandornamente from their Grundmuster, with shapes and
  with letters, and says whether the Grundmuster is verschoben or
  gespiegelt (b b b b, b d b d, b p b p); lesson 2 learns what a Parkett
  is (keine Lücken, nichts liegt übereinander), finds which shapes tile
  (Quadrat, Rechteck, Dreieck, Sechseck) and which do not (Kreis), counts
  the shapes that meet at a corner, and ends with the skill check.
  Inventing and drawing one's own frieze or tessellation waits for a
  drawing task.
metadata:
  year: klasse-4
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.patterns.repeating, math.shapes.more-shapes]
  also_practises: [math.patterns.repeating]
  vocabulary: { de: [Bandornament, Grundmuster, verschieben, spiegeln, Parkett, lückenlos, Fliese, Wabe] }
  forms: [text, audio, drawn]
  drawn: [letter-card, shape]
  facets: []
  parts:
    - { id: continue, what: { de: Bandornamente fortsetzen, en: continuing frieze patterns } }
    - { id: move-mirror, what: { de: "beschreiben, ob das Grundmuster verschoben oder gespiegelt wird", en: saying whether the unit is slid or reflected } }
    - { id: tile, what: { de: "Formen finden, die lückenlos aneinanderpassen", en: finding shapes that fit together without gaps } }
    - { id: describe, what: { de: Parkette und ihre Ecken beschreiben, en: describing tessellations and their corners } }
  misconceptions:
    - id: copies-last-item
      what: Continues a frieze by repeating the last item or by alternating two items, without finding the whole Grundmuster
      addressed: lesson 1 Learn names the Grundmuster Kreis, Dreieck, Dreieck; l1-f1, l1-f4, l1-n1, l1-c2 and l2-c2 have a three-part Grundmuster, with feedback in l1-f1, l2-c1 a four-part one
    - id: every-shape-tiles
      what: Thinks any shape of the same size, circles too, can cover a floor without gaps
      addressed: lesson 2 Learn shows the gaps between circles; l2-f2, l2-s3, l2-n1 and l2-n3 ask about circles, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bandornamente", en: "Friezes" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was kommt als Nächstes?"
            say: "Welche Form kommt als Nächstes?"
            show: { drawn: shape, row: [circle, square, circle, square, "?"], colours: blue }
            options: ["Kreis", "Quadrat", "Dreieck"]
            answer: "Kreis"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Farbe hat das nächste Dreieck?"
            say: "Welche Farbe hat das nächste Dreieck?"
            show: { drawn: shape, row: [triangle, triangle, triangle, triangle, "?"], colours: [red, blue, red, blue, null] }
            options: ["rot", "blau", "grün"]
            answer: "rot"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Bandornament: Das Grundmuster wiederholt sich."
            say: "Ein Bandornament ist ein Muster auf einem langen Streifen. Ein Grundmuster wiederholt sich immer wieder. Hier ist das Grundmuster: Kreis, Dreieck, Dreieck."
            show: { drawn: shape, row: [circle, triangle, triangle, circle, triangle, triangle], colours: green }
          - text: "verschieben"
            say: "Hier wird das b immer ein Stück weitergeschoben. Es sieht jedes Mal gleich aus. Das Grundmuster wird verschoben."
            show: { drawn: letter-card, text: "b b b b" }
          - text: "spiegeln"
            say: "Hier steht zwischen zwei Buchstaben ein Spiegel. Aus dem b wird ein d, dann wieder ein b. Das Grundmuster wird gespiegelt."
            show: { drawn: letter-card, text: "b d b d" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Finde das Grundmuster. Welche Form kommt als Nächstes?"
                show: { drawn: shape, row: [square, circle, circle, square, circle, circle, "?"], colours: orange }
                options: ["Quadrat", "Kreis", "Dreieck"]
                answer: "Quadrat"
                feedback:
                  "Kreis": "Das Grundmuster ist Quadrat, Kreis, Kreis. Nach zwei Kreisen kommt wieder ein Quadrat."
                hints:
                  - "Welche Formen wiederholen sich immer zusammen?"
                  - "Das Grundmuster ist Quadrat, Kreis, Kreis. Es ist gerade zu Ende."
                  - "Quadrat."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Buchstabe kommt als Nächstes?"
                say: "Welcher Buchstabe kommt als Nächstes?"
                show: { drawn: letter-card, text: "b d b d b ?" }
                options: ["d", "b", "p"]
                answer: "d"
                option_audio: false
                hints:
                  - "Was folgt immer auf das b?"
                  - "Auf b folgt sein Spiegelbild."
                  - "d."
              - id: l1-f3
                type: multiple_choice
                text: "Wie entsteht dieses Bandornament?"
                say: "Wie entsteht dieses Bandornament?"
                show: { drawn: letter-card, text: "b b b b" }
                options: ["Das b wird verschoben.", "Das b wird gespiegelt.", "Das b wird gedreht."]
                answer: "Das b wird verschoben."
                hints:
                  - "Sieht jedes b gleich aus?"
                  - "Alle Buchstaben zeigen in dieselbe Richtung."
                  - "Das b wird verschoben."
              - id: l1-f4
                type: multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Finde das Grundmuster. Welche Form kommt als Nächstes?"
                show: { drawn: shape, row: [triangle, triangle, square, triangle, triangle, square, triangle, "?"], colours: purple }
                options: ["Dreieck", "Quadrat", "Kreis"]
                answer: "Dreieck"
                hints:
                  - "Das Grundmuster hat drei Formen."
                  - "Dreieck, Dreieck, Quadrat. Nach dem letzten Quadrat steht erst ein Dreieck."
                  - "Dreieck."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viele Formen hat das Grundmuster?"
                say: "Wie viele Formen hat das Grundmuster?"
                show: { drawn: shape, row: [circle, square, triangle, circle, square, triangle], colours: red }
                options: ["3", "6", "2"]
                answer: "3"
                hints:
                  - "Wann fängt das Muster von vorn an?"
                  - "Nach Kreis, Quadrat, Dreieck kommt wieder ein Kreis."
                  - "3."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Buchstabe kommt als Nächstes?"
                say: "Welcher Buchstabe kommt als Nächstes?"
                show: { drawn: letter-card, text: "p q p q p ?" }
                options: ["q", "p", "d"]
                answer: "q"
                option_audio: false
                hints: ["Auf p folgt immer sein Spiegelbild."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie entsteht dieses Bandornament?"
                say: "Wie entsteht dieses Bandornament?"
                show: { drawn: letter-card, text: "b d b d" }
                options: ["Das b wird gespiegelt.", "Das b wird verschoben.", "Das b wird gedreht."]
                answer: "Das b wird gespiegelt."
                hints: ["Zeigen alle Buchstaben in dieselbe Richtung?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Farbe hat der nächste Kreis?"
                say: "Welche Farbe hat der nächste Kreis?"
