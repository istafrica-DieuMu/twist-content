# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.grid-drawing
skill: math.shapes.grid-drawing
curriculum: de-DE
language: de
title:
  de: Figuren im Gitter übertragen
  en: Copying shapes on a grid
summary: >
  Lesson 1 copies figures on Karopapier by counting Kästchen from a
  corner, counts slanted lines in two steps (3 nach rechts, 2 nach oben),
  picks the right copy and finds what is wrong with a copy; lesson 2
  does the same on the Punkteraster (from point to point), draws a
  figure doppelt so groß and halb so groß by doubling or halving every
  side, slanted ones too, and ends with the skill check. Enlarging to
  other scales is left to math.shapes.scale; buildings on an isometric
  dot grid and drawing with the finger wait for a drawing task.
metadata:
  year: klasse-4
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [math.shapes.parallel-perpendicular, math.shapes.draw-freehand-ruler]
  also_practises: [math.numbers-to-100.double-halve]
  vocabulary: { de: [übertragen, Vorlage, Kopie, Karopapier, Kästchen, Punkteraster, Punkt, Ecke, schräg, senkrecht, doppelt so groß, halb so groß] }
  forms: [text, audio, drawn]
  drawn: [grid]
  facets: []
  parts:
    - { id: copy, what: { de: eine Figur auf Karopapier übertragen und eine Kopie prüfen, en: copying a shape on squared paper and checking a copy } }
    - { id: slant, what: { de: schräge Linien in zwei Schritten abzählen, en: counting a slanted line in two steps } }
    - { id: dot-grid, what: { de: im Punkteraster von Punkt zu Punkt zählen und übertragen, en: counting and copying from point to point on a dot grid } }
    - { id: scale, what: { de: eine Figur doppelt oder halb so groß zeichnen, en: drawing a shape twice or half as big } }
  misconceptions:
    - id: slant-by-eye
      what: Copies a slanted line by eye instead of counting how far it goes to the side and up, so the copy is steeper or flatter, or swaps the two steps
      addressed: lesson 1 Learn counts a slanted line in two steps; l1-f1 has feedback on swapped steps, l1-f2 and l1-s2 have feedback on a wrong slant, l1-s3, l1-n2, l1-n4 and l2-c1 show a copy with another slant
    - id: counts-points-not-gaps
      what: On the Punkteraster counts the points on a line instead of the gaps between them, so a line 4 long is called 5
      addressed: lesson 2 Learn counts from point to point; l2-f1 has feedback on counting points, l2-s2, l2-n4 and l2-c5 ask again
    - id: enlarge-by-adding
      what: Enlarges a figure by adding the same number of Kästchen to every side, or doubles only the length and not the height
      addressed: lesson 2 Learn doubles every side; l2-f2 has feedback on both, l2-s3, l2-n1, l2-n2 and l2-c3 offer them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Figuren übertragen", en: "Copying shapes" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Die beiden Linien sind parallel."
            say: "Stimmt das? Die beiden Linien sind parallel."
            show: { drawn: grid, cols: 6, rows: 3, lines: [[0, 0, 5, 0], [1, 3, 4, 3]] }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Kästchen lang ist die Linie?"
            say: "Wie viele Kästchen lang ist die Linie?"
            show: { drawn: grid, cols: 7, rows: 2, lines: [[1, 1, 6, 1]] }
            options: ["5", "6", "4"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Übertragen: gleich groß, an einer anderen Stelle"
            say: "Links ist die Vorlage, rechts die Kopie. Übertragen heißt: Du zeichnest die Figur genau gleich groß ab, nur an einer anderen Stelle. Such dir eine Ecke als Startpunkt. Dann zählst du die Kästchen: zwei nach rechts, zwei nach unten, zwei nach links, zwei nach oben. Das Dach geht eins nach rechts und eins nach oben, dann eins nach rechts und eins nach unten."
            show: { drawn: grid, cols: 10, rows: 5, lines: [[1, 2, 3, 2], [3, 2, 3, 4], [3, 4, 1, 4], [1, 4, 1, 2], [1, 2, 2, 1], [2, 1, 3, 2], [6, 2, 8, 2], [8, 2, 8, 4], [8, 4, 6, 4], [6, 4, 6, 2], [6, 2, 7, 1], [7, 1, 8, 2]] }
          - text: "Schräge Linien: 3 nach rechts, 2 nach oben"
            say: "Schräge Linien zeichnest du nicht nach Gefühl. Du zählst in zwei Schritten. Diese Linie geht vom Startpunkt drei Kästchen nach rechts und zwei Kästchen nach oben. Dort ist ihr Ende. Mit dem Lineal verbindest du die beiden Punkte."
            show: { drawn: grid, cols: 5, rows: 3, lines: [[1, 3, 4, 1]] }
          - text: "Zum Schluss: jede Seite vergleichen"
            say: "Zum Schluss vergleichst du jede Seite der Kopie mit der Vorlage. Ist jede gleich lang? Geht jede schräge Linie gleich weit zur Seite und nach oben?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie geht die schräge Linie von links nach rechts?"
                say: "Die Linie startet links unten. Wie geht sie bis zu ihrem Ende?"
                show: { drawn: grid, cols: 5, rows: 3, lines: [[0, 3, 3, 1]] }
                options: ["3 nach rechts, 2 nach oben", "2 nach rechts, 3 nach oben", "3 nach rechts, 3 nach oben"]
                answer: "3 nach rechts, 2 nach oben"
                feedback:
                  "2 nach rechts, 3 nach oben": "Du hast die Schritte vertauscht. Zähl zuerst nach rechts, dann nach oben."
                hints:
                  - "Zähl zuerst die Kästchen nach rechts, dann die nach oben."
                  - "Vom Start bis unter das Ende sind es 3 Kästchen."
                  - "3 nach rechts, 2 nach oben."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Welche Figur ist richtig übertragen?"
                say: "Hier ist die Vorlage. Welche Kopie ist richtig übertragen?"
                show: { drawn: grid, cols: 5, rows: 2, lines: [[0, 2, 3, 2], [3, 2, 4, 0], [4, 0, 1, 0], [1, 0, 0, 2]] }
                options:
                  - { drawn: grid, cols: 6, rows: 2, lines: [[1, 2, 4, 2], [4, 2, 4, 0], [4, 0, 1, 0], [1, 0, 1, 2]], key: gerade }
                  - { drawn: grid, cols: 6, rows: 2, lines: [[1, 2, 4, 2], [4, 2, 5, 0], [5, 0, 2, 0], [2, 0, 1, 2]], key: richtig }
                  - { drawn: grid, cols: 6, rows: 2, lines: [[1, 2, 3, 2], [3, 2, 4, 0], [4, 0, 2, 0], [2, 0, 1, 2]], key: kurz }
                answer: richtig
                feedback:
                  gerade: "Hier stehen die Seiten senkrecht. In der Vorlage gehen sie schräg: 1 nach rechts, 2 nach oben."
                  kurz: "Hier sind die untere und die obere Seite nur 2 Kästchen lang. In der Vorlage sind es 3."
                hints:
                  - "Vergleiche zuerst die untere Seite, dann die schrägen Seiten."
                  - "Unten 3 Kästchen. Jede schräge Seite: 1 nach rechts, 2 nach oben."
                  - "Richtig ist die Kopie mit schrägen Seiten, oben und unten 3 Kästchen lang."
              - id: l1-f3
                type: true_false
                text: "Die Kopie rechts ist genau wie die Vorlage links."
                say: "Stimmt das? Die Kopie rechts ist genau wie die Vorlage links."
                show: { drawn: grid, cols: 9, rows: 3, lines: [[0, 3, 3, 3], [3, 3, 0, 1], [0, 1, 0, 3], [5, 3, 8, 3], [8, 3, 5, 1], [5, 1, 5, 3]] }
                answer: true
                hints:
                  - "Vergleiche die untere Seite und die senkrechte Seite."
                  - "Beide unten 3 Kästchen, beide 2 Kästchen hoch."
                  - "Ja, die Kopie stimmt."
              - id: l1-f4
                type: multiple_choice
                text: "Was ist an der Kopie falsch?"
                say: "Links ist die Vorlage, rechts die Kopie. Was ist an der Kopie falsch?"
                show: { drawn: grid, cols: 10, rows: 3, lines: [[0, 3, 3, 3], [3, 3, 0, 1], [0, 1, 0, 3], [5, 3, 9, 3], [9, 3, 5, 1], [5, 1, 5, 3]] }
                options: ["Die untere Seite ist zu lang.", "Die senkrechte Seite ist zu lang.", "Nichts, sie ist richtig."]
                answer: "Die untere Seite ist zu lang."
                feedback:
                  "Nichts, sie ist richtig.": "Zähl die untere Seite bei beiden Figuren nach."
                hints:
                  - "Zähl bei beiden Figuren die untere Seite."
                  - "Vorlage: 3 Kästchen. Kopie: 4 Kästchen."
                  - "Die untere Seite ist zu lang."
              - id: l1-f5
                type: multiple_choice
                text: "Wie geht die schräge Linie von oben nach unten?"
                say: "Die Linie startet links oben. Wie geht sie bis zu ihrem Ende?"
                show: { drawn: grid, cols: 4, rows: 4, lines: [[1, 0, 3, 3]] }
                options: ["2 nach rechts, 3 nach unten", "3 nach rechts, 2 nach unten", "2 nach rechts, 2 nach unten"]
                answer: "2 nach rechts, 3 nach unten"
                hints:
                  - "Zähl zuerst nach rechts, dann nach unten."
                  - "Nach rechts sind es 2 Kästchen."
                  - "2 nach rechts, 3 nach unten."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie geht die schräge Linie von links nach rechts?"
                say: "Die Linie startet links. Wie geht sie bis zu ihrem Ende?"
                show: { drawn: grid, cols: 5, rows: 2, lines: [[0, 2, 4, 1]] }
                options: ["4 nach rechts, 1 nach oben", "1 nach rechts, 4 nach oben", "4 nach rechts, 2 nach oben"]
                answer: "4 nach rechts, 1 nach oben"
                hints: ["Zähl zuerst nach rechts, dann nach oben."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welche Figur ist richtig übertragen?"
                say: "Hier ist die Vorlage. Welche Kopie ist richtig übertragen?"
                show: { drawn: grid, cols: 5, rows: 3, lines: [[0, 3, 4, 3], [4, 3, 2, 0], [2, 0, 0, 3]] }
                options:
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 3, 5, 3], [5, 3, 3, 1], [3, 1, 1, 3]], key: flach }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 3, 5, 3], [5, 3, 2, 0], [2, 0, 1, 3]], key: schief }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 3, 5, 3], [5, 3, 3, 0], [3, 0, 1, 3]], key: richtig }
                answer: richtig
                feedback:
                  flach: "Diese Spitze liegt nur 2 Kästchen hoch. In der Vorlage sind es 3."
                hints: ["Die Spitze liegt 3 Kästchen über der Mitte der unteren Seite."]
              - id: l1-s3
                type: true_false
                text: "Die Kopie rechts ist genau wie die Vorlage links."
                say: "Stimmt das? Die Kopie rechts ist genau wie die Vorlage links."
                show: { drawn: grid, cols: 12, rows: 2, lines: [[0, 2, 3, 2], [3, 2, 4, 0], [4, 0, 1, 0], [1, 0, 0, 2], [6, 2, 9, 2], [9, 2, 11, 0], [11, 0, 8, 0], [8, 0, 6, 2]] }
                answer: false
                hints: ["Zähl bei den schrägen Seiten: Wie weit geht es nach rechts?"]
              - id: l1-s4
                type: multiple_choice
                text: "Was ist an der Kopie falsch?"
                say: "Links ist die Vorlage, rechts die Kopie. Was ist an der Kopie falsch?"
                show: { drawn: grid, cols: 10, rows: 3, lines: [[0, 1, 4, 1], [4, 1, 4, 3], [4, 3, 0, 3], [0, 3, 0, 1], [5, 0, 9, 0], [9, 0, 9, 3], [9, 3, 5, 3], [5, 3, 5, 0]] }
                options: ["Die Kopie ist zu hoch.", "Die Kopie ist zu lang.", "Nichts, sie ist richtig."]
                answer: "Die Kopie ist zu hoch."
                hints: ["Zähl bei beiden Rechtecken die Kästchen nach oben."]
              - id: l1-s5
                type: fill_in_blank
                text: "Wie geht die schräge Linie von links nach rechts?"
                say: "Die Linie startet links unten. Wie viele Kästchen geht sie nach rechts, wie viele nach oben?"
                show: { drawn: grid, cols: 4, rows: 3, lines: [[1, 3, 3, 0]] }
                frame: "_ nach rechts, _ nach oben"
                options: ["1", "2", "3", "4"]
                answer: ["2", "3"]
                hints: ["Zähl zuerst nach rechts bis unter das Ende, dann nach oben."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Ali überträgt das Dreieck. Welche Zeichnung stimmt?"
                say: "Ali überträgt die Vorlage. Welche Zeichnung stimmt?"
                show: { drawn: grid, cols: 4, rows: 3, lines: [[0, 3, 2, 3], [2, 3, 0, 0], [0, 0, 0, 3]] }
                options:
                  - { drawn: grid, cols: 5, rows: 3, lines: [[1, 3, 4, 3], [4, 3, 1, 0], [1, 0, 1, 3]], key: breit }
                  - { drawn: grid, cols: 5, rows: 3, lines: [[1, 3, 3, 3], [3, 3, 1, 0], [1, 0, 1, 3]], key: richtig }
                  - { drawn: grid, cols: 5, rows: 3, lines: [[1, 3, 3, 3], [3, 3, 1, 1], [1, 1, 1, 3]], key: flach }
                answer: richtig
              - id: l1-n2
                type: image_multiple_choice
                text: "Pia zeichnet eine Linie: 3 nach rechts, 1 nach unten. Welche ist es?"
                say: "Pia startet links oben und zeichnet eine Linie: drei nach rechts, eins nach unten. Welche ist es?"
                options:
                  - { drawn: grid, cols: 4, rows: 3, lines: [[0, 0, 1, 3]], key: steil }
                  - { drawn: grid, cols: 4, rows: 3, lines: [[0, 1, 3, 0]], key: hoch }
                  - { drawn: grid, cols: 4, rows: 3, lines: [[0, 0, 3, 1]], key: richtig }
                answer: richtig
              - id: l1-n3
                type: true_false
                text: "Beim Übertragen darf die Kopie an einer anderen Stelle liegen."
                say: "Stimmt das? Beim Übertragen darf die Kopie an einer anderen Stelle auf dem Papier liegen."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Ida hat übertragen. Was ist an ihrer Kopie falsch?"
                say: "Links ist die Vorlage, rechts Idas Kopie. Was ist an ihrer Kopie falsch?"
                show: { drawn: grid, cols: 11, rows: 3, lines: [[0, 3, 4, 3], [4, 3, 4, 1], [4, 1, 0, 3], [6, 3, 10, 3], [10, 3, 10, 0], [10, 0, 6, 3]] }
                options: ["Die senkrechte Seite ist zu lang.", "Die untere Seite ist zu kurz.", "Nichts, sie ist richtig."]
                answer: "Die senkrechte Seite ist zu lang."
              - id: l1-n5
                type: fill_in_blank
                text: "Tom überträgt diese schräge Linie. Wie zählt er?"
                say: "Tom startet links oben und überträgt die schräge Linie. Wie viele Kästchen nach rechts, wie viele nach unten?"
                show: { drawn: grid, cols: 5, rows: 3, lines: [[0, 0, 4, 3]] }
                frame: "_ nach rechts, _ nach unten"
                options: ["2", "3", "4", "5"]
                answer: ["4", "3"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie geht die schräge Linie von links nach rechts?"
            say: "Die Linie startet links unten. Wie geht sie bis zu ihrem Ende?"
            show: { drawn: grid, cols: 4, rows: 2, lines: [[1, 2, 3, 0]] }
            options: ["2 nach rechts, 2 nach oben", "2 nach rechts, 1 nach oben", "1 nach rechts, 2 nach oben"]
            answer: "2 nach rechts, 2 nach oben"
          - id: l1-c2
            type: image_multiple_choice
            text: "Welche Figur ist richtig übertragen?"
            say: "Hier ist die Vorlage. Welche Kopie ist richtig übertragen?"
            show: { drawn: grid, cols: 4, rows: 2, lines: [[0, 2, 3, 2], [3, 2, 3, 0], [3, 0, 0, 2]] }
            options:
              - { drawn: grid, cols: 5, rows: 2, lines: [[1, 2, 4, 2], [4, 2, 4, 0], [4, 0, 1, 2]], key: richtig }
              - { drawn: grid, cols: 5, rows: 2, lines: [[1, 2, 4, 2], [4, 2, 4, 1], [4, 1, 1, 2]], key: flach }
              - { drawn: grid, cols: 5, rows: 2, lines: [[1, 2, 3, 2], [3, 2, 3, 0], [3, 0, 1, 2]], key: kurz }
            answer: richtig
          - id: l1-c3
            type: true_false
            text: "Beim Übertragen zählst du die Kästchen ab."
            say: "Stimmt das? Beim Übertragen zählst du die Kästchen ab."
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Wie geht die schräge Linie von links nach rechts?"
            say: "Die Linie startet links oben. Wie viele Kästchen geht sie nach rechts, wie viele nach unten?"
            show: { drawn: grid, cols: 5, rows: 3, lines: [[1, 0, 4, 2]] }
            frame: "_ nach rechts, _ nach unten"
            options: ["1", "2", "3", "4"]
            answer: ["3", "2"]
          - id: l1-c5
            type: multiple_choice
            text: "Was ist an der Kopie falsch?"
            say: "Links ist die Vorlage, rechts die Kopie. Was ist an der Kopie falsch?"
            show: { drawn: grid, cols: 9, rows: 3, lines: [[0, 1, 3, 1], [3, 1, 3, 3], [3, 3, 0, 3], [0, 3, 0, 1], [5, 1, 7, 1], [7, 1, 7, 3], [7, 3, 5, 3], [5, 3, 5, 1]] }
            options: ["Die Kopie ist zu kurz.", "Die Kopie ist zu hoch.", "Nichts, sie ist richtig."]
            answer: "Die Kopie ist zu kurz."
          - id: l1-c6
            type: true_false
            text: "Die Kopie rechts ist genau wie die Vorlage links."
            say: "Stimmt das? Die Kopie rechts ist genau wie die Vorlage links."
            show: { drawn: grid, cols: 7, rows: 3, lines: [[0, 3, 2, 3], [2, 3, 2, 1], [2, 1, 0, 3], [4, 3, 6, 3], [6, 3, 6, 0], [6, 0, 4, 3]] }
            answer: false

  - n: 2
    title: { de: "Punkteraster, größer und kleiner", en: "Dot grids, larger and smaller" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie geht die schräge Linie von links nach rechts?"
            say: "Die Linie startet links unten. Wie geht sie bis zu ihrem Ende?"
            show: { drawn: grid, cols: 4, rows: 3, lines: [[0, 3, 3, 0]] }
            options: ["3 nach rechts, 3 nach oben", "3 nach rechts, 2 nach oben"]
            answer: "3 nach rechts, 3 nach oben"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Die Kopie rechts ist genau wie die Vorlage links."
            say: "Stimmt das? Die Kopie rechts ist genau wie die Vorlage links."
            show: { drawn: grid, cols: 9, rows: 2, lines: [[0, 0, 3, 0], [3, 0, 3, 2], [3, 2, 0, 2], [0, 2, 0, 0], [5, 0, 8, 0], [8, 0, 8, 2], [8, 2, 5, 2], [5, 2, 5, 0]] }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Im Punkteraster: von Punkt zu Punkt"
            say: "Im Punkteraster gibt es keine Kästchen, nur Punkte. Du zählst die Abstände von Punkt zu Punkt, so wie Kästchen. Diese Linie ist vier lang. Auf ihr liegen fünf Punkte, aber nur vier Abstände."
            show: { drawn: grid, cols: 6, rows: 2, dots: true, lines: [[1, 1, 5, 1]] }
          - text: "Doppelt so groß: jede Seite mal 2"
            say: "Willst du eine Figur doppelt so groß zeichnen, machst du jede Seite doppelt so lang. Das Rechteck links ist zwei Kästchen lang und eins hoch. Rechts ist es vier lang und zwei hoch. Länge und Höhe werden beide verdoppelt."
            show: { drawn: grid, cols: 9, rows: 2, lines: [[0, 1, 2, 1], [2, 1, 2, 2], [2, 2, 0, 2], [0, 2, 0, 1], [4, 0, 8, 0], [8, 0, 8, 2], [8, 2, 4, 2], [4, 2, 4, 0]] }
          - text: "Schräge Linien: beide Schritte mal 2"
            say: "Auch schräge Linien verdoppelst du in beiden Schritten. Aus eins nach rechts und zwei nach oben wird zwei nach rechts und vier nach oben."
            show: { drawn: grid, cols: 5, rows: 4, lines: [[0, 4, 1, 2], [2, 4, 4, 0]] }
          - text: "Halb so groß: jede Seite durch 2"
            say: "Halb so groß geht genauso, nur rückwärts. Jede Seite wird halb so lang. Aus sechs Kästchen werden drei."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie lang ist die Linie im Punkteraster?"
                say: "Wie lang ist die Linie im Punkteraster? Zähl von Punkt zu Punkt."
                show: { drawn: grid, cols: 5, rows: 2, dots: true, lines: [[0, 1, 4, 1]] }
                options: ["4", "5", "3"]
                answer: "4"
                feedback:
                  "5": "Du hast die Punkte gezählt. Zähl die Abstände zwischen den Punkten."
                hints:
                  - "Zähl die Sprünge von einem Punkt zum nächsten."
                  - "Fang am linken Ende an: eins, zwei, ..."
                  - "4 Abstände."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Welches Rechteck ist doppelt so groß wie die Vorlage?"
                say: "Hier ist die Vorlage. Welches Rechteck ist doppelt so groß?"
                show: { drawn: grid, cols: 4, rows: 2, lines: [[1, 0, 3, 0], [3, 0, 3, 1], [3, 1, 1, 1], [1, 1, 1, 0]] }
                options:
                  - { drawn: grid, cols: 5, rows: 2, lines: [[0, 1, 4, 1], [4, 1, 4, 2], [4, 2, 0, 2], [0, 2, 0, 1]], key: nurlang }
                  - { drawn: grid, cols: 5, rows: 2, lines: [[0, 0, 4, 0], [4, 0, 4, 2], [4, 2, 0, 2], [0, 2, 0, 0]], key: doppelt }
                  - { drawn: grid, cols: 5, rows: 2, lines: [[0, 0, 3, 0], [3, 0, 3, 2], [3, 2, 0, 2], [0, 2, 0, 0]], key: plus1 }
                answer: doppelt
                feedback:
                  nurlang: "Hier ist nur die Länge doppelt. Auch die Höhe muss doppelt so groß werden."
                  plus1: "Hier ist jede Seite nur 1 Kästchen länger. Doppelt heißt: mal 2."
                hints:
