# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.data-units
skill: math.mass-capacity.data-units
curriculum: de-DE
language: de
title:
  de: Datenmengen
  en: Data sizes
summary: >
  Lesson 1 meets Byte, Kilobyte and Megabyte (1 KB = 1000 Byte, 1 MB =
  1000 KB, kilo means a thousand as in Kilogramm), changes between them
  and puts sizes in order; lesson 2 judges what needs a lot of storage
  (a message, a photo, a song, a video), works out how many photos or
  songs still fit and ends with the skill check. The lessons use the
  decimal steps of 1000 that phones and shops use.
metadata:
  year: klasse-4
  topic: { de: Datenmengen, en: Data sizes }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.to-million]
  also_practises: [math.large-numbers.to-million, math.mult-div-larger.large-mental]
  vocabulary: { de: [Byte, Kilobyte, Megabyte, Speicher, Datei, frei] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: convert, what: { de: "Byte, Kilobyte und Megabyte umrechnen", en: "converting between bytes, kilobytes and megabytes" } }
    - { id: compare, what: { de: Datenmengen vergleichen und ordnen, en: comparing and ordering data sizes } }
    - { id: storage, what: { de: "einschätzen, was viel Speicher braucht", en: judging what takes a lot of storage } }
    - { id: fit, what: { de: "ausrechnen, wie viele Dateien noch passen", en: working out how many files still fit } }
  misconceptions:
    - id: number-not-unit
      what: Compares the numbers and not the units (900 KB is more than 2 MB because 900 is bigger)
      addressed: lesson 1 Learn changes MB to KB before comparing; every stage of lesson 1 compares KB with MB, with feedback in l1-f2, and l1-f4, l1-s4 and l1-n5 put mixed units in order
    - id: long-text-big-file
      what: Thinks a long text needs more storage than a photo or a short video
      addressed: lesson 2 Learn sets one photo against 1000 pages of text; l2-f2, l2-f5, l2-s4, l2-n2 and l2-c5 compare text with pictures, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Byte, Kilobyte, Megabyte", en: "Bytes, kilobytes, megabytes" }
    goal:
      de: "Rechne zwischen Byte, Kilobyte und Megabyte um. Kilo heißt tausend, so wie beim Kilogramm."
      en: "Change between bytes, kilobytes and megabytes. Kilo means a thousand, just like in kilogram."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1000 · 1000 = _"
            say: "Tausend mal tausend."
            options: ["1 000 000", "100 000", "10 000"]
            answer: "1 000 000"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie oft passt 1000 in 1 000 000?"
            say: "Wie oft passt tausend in eine Million?"
            options: ["1000-mal", "100-mal", "10-mal"]
            answer: "1000-mal"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du?\nKilogramm, Kilometer, Kilobyte: Was heißt Kilo?"
            say: "Was glaubst du: Kilogramm, Kilometer und jetzt Kilobyte. Was bedeutet das Kilo vorne dran? Merk dir deine Idee."
          - text: "Ein Buchstabe braucht etwa 1 Byte."
            say: "Computer, Tablets und Handys speichern Daten: Texte, Fotos, Lieder und Videos. Wie viel Platz sie brauchen, misst man in Byte. Ein Buchstabe in einem Text braucht ungefähr ein Byte."
          - text: "1 Kilobyte (KB) = 1000 Byte\n1 Megabyte (MB) = 1000 KB = 1 000 000 Byte"
            say: "Jetzt kommt die Auflösung: Kilo heißt tausend, so wie bei Kilogramm. Ein Kilobyte sind tausend Byte. Mega heißt Million. Ein Megabyte sind tausend Kilobyte, also eine Million Byte."
          - text: "Was ist mehr: 2 MB oder 900 KB?\n2 MB = 2000 KB\n2000 KB > 900 KB"
            say: "Zum Vergleichen bringst du beide Größen in dieselbe Einheit. Zwei Megabyte sind zweitausend Kilobyte. Das ist mehr als neunhundert Kilobyte, obwohl neunhundert die größere Zahl ist."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "1 KB = _ Byte"
                say: "Ein Kilobyte sind wie viele Byte?"
                answer: "1000"
                hints:
                  - "Kilo heißt dasselbe wie bei Kilogramm."
                  - "1 kg = 1000 g."
                  - "1000 Byte."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was ist mehr: 3 MB oder 800 KB?"
                say: "Was ist mehr: drei Megabyte oder achthundert Kilobyte?"
                options: ["3 MB", "800 KB", "Beides ist gleich viel."]
                answer: "3 MB"
                feedback:
                  "800 KB": "800 ist die größere Zahl. Aber 3 MB sind 3000 KB."
                hints:
                  - "Bring beide Größen in Kilobyte."
                  - "1 MB = 1000 KB, also 3 MB = 3000 KB."
                  - "3 MB."
              - id: l1-f3
                type: multiple_choice
                text: "5 MB = _ KB"
                say: "Fünf Megabyte sind wie viele Kilobyte?"
                options: ["5000", "500", "5 000 000"]
                answer: "5000"
                hints:
                  - "1 MB sind 1000 KB."
                  - "5 · 1000."
                  - "5000 KB."
              - id: l1-f4
                type: ordering
                text: "Ordne von klein nach groß."
                say: "Ordne die Größen. Die kleinste kommt zuerst."
                options: ["1 MB", "500 KB", "2000 Byte", "3 MB"]
                slot_count: 4
                answer: ["2000 Byte", "500 KB", "1 MB", "3 MB"]
                hints:
                  - "Bring alles in Kilobyte."
                  - "2000 Byte = 2 KB, 1 MB = 1000 KB, 3 MB = 3000 KB."
                  - "2000 Byte, 500 KB, 1 MB, 3 MB."
              - id: l1-f5
                type: true_false
                text: "1 MB sind eine Million Byte. Stimmt das?"
                say: "Ein Megabyte sind eine Million Byte. Stimmt das?"
                answer: true
                hints:
                  - "1 MB = 1000 KB und 1 KB = 1000 Byte."
                  - "1000 · 1000 Byte."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "2 KB = _ Byte"
                say: "Zwei Kilobyte sind wie viele Byte?"
                options: ["2000", "200", "20"]
                answer: "2000"
                hints: ["1 KB sind 1000 Byte."]
              - id: l1-s2
                type: multiple_choice
                text: "Was ist weniger: 1500 KB oder 1 MB?"
                say: "Was ist weniger: tausendfünfhundert Kilobyte oder ein Megabyte?"
                options: ["1 MB", "1500 KB", "Beides ist gleich viel."]
                answer: "1 MB"
                hints: ["1 MB sind 1000 KB."]
              - id: l1-s3
                type: multiple_choice
                text: "3000 KB = _ MB"
                say: "Dreitausend Kilobyte sind wie viele Megabyte?"
                options: ["3", "30", "300"]
                answer: "3"
                hints: ["1000 KB sind 1 MB."]
              - id: l1-s4
                type: ordering
                text: "Ordne von klein nach groß."
                say: "Ordne die Größen. Die kleinste kommt zuerst."
                options: ["4 MB", "40 KB", "400 Byte", "400 KB"]
                slot_count: 4
                answer: ["400 Byte", "40 KB", "400 KB", "4 MB"]
                hints: ["400 Byte sind weniger als 1 KB."]
              - id: l1-s5
                type: true_false
                text: "500 KB sind mehr als 1 MB. Stimmt das?"
                say: "Fünfhundert Kilobyte sind mehr als ein Megabyte. Stimmt das?"
                answer: false
                hints: ["1 MB sind 1000 KB."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "7 MB = _ KB"
                say: "Sieben Megabyte sind wie viele Kilobyte?"
                options: ["7000", "700", "70"]
                answer: "7000"
              - id: l1-n2
                type: multiple_choice
                text: "Was ist mehr: 1,5 MB oder 1200 KB?"
                say: "Was ist mehr: eins Komma fünf Megabyte oder tausendzweihundert Kilobyte?"
                options: ["1,5 MB", "1200 KB", "Beides ist gleich viel."]
                answer: "1,5 MB"
              - id: l1-n3
                type: multiple_choice
                text: "Ein Text hat 4000 Buchstaben. Wie viel Speicher braucht er ungefähr?"
                say: "Ein Text hat viertausend Buchstaben. Wie viel Speicher braucht er ungefähr?"
                options: ["etwa 4 KB", "etwa 4 MB", "etwa 4 Byte"]
                answer: "etwa 4 KB"
              - id: l1-n4
                type: true_false
                text: "2000 Byte = 2 KB. Stimmt das?"
                say: "Zweitausend Byte sind zwei Kilobyte. Stimmt das?"
                answer: true
              - id: l1-n5
                type: ordering
                text: "Ordne von klein nach groß."
                say: "Ordne die Größen. Die kleinste kommt zuerst."
                options: ["2 MB", "20 KB", "200 KB", "2000 MB"]
                slot_count: 4
                answer: ["20 KB", "200 KB", "2 MB", "2000 MB"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "4 KB = _ Byte"
            say: "Vier Kilobyte sind wie viele Byte?"
            options: ["4000", "400", "40"]
            answer: "4000"
          - id: l1-c2
            type: multiple_choice
            text: "Was ist mehr: 6 MB oder 950 KB?"
            say: "Was ist mehr: sechs Megabyte oder neunhundertfünfzig Kilobyte?"
            options: ["6 MB", "950 KB", "Beides ist gleich viel."]
            answer: "6 MB"
          - id: l1-c3
            type: true_false
            text: "1 MB = 1000 KB. Stimmt das?"
            say: "Ein Megabyte sind tausend Kilobyte. Stimmt das?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "6000 KB = _ MB"
            say: "Sechstausend Kilobyte sind wie viele Megabyte?"
            options: ["6", "60", "600"]
            answer: "6"
          - id: l1-c5
            type: ordering
            text: "Ordne von klein nach groß."
            say: "Ordne die Größen. Die kleinste kommt zuerst."
            options: ["5 KB", "5 MB", "500 Byte", "50 KB"]
            slot_count: 4
            answer: ["500 Byte", "5 KB", "50 KB", "5 MB"]
          - id: l1-c6
            type: true_false
            text: "1 KB = 100 Byte. Stimmt das?"
            say: "Ein Kilobyte sind hundert Byte. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Was braucht viel Speicher?", en: "What takes a lot of storage?" }
    goal:
      de: "Schätz ein, was viel Speicher braucht, und rechne aus, wie viele Fotos noch auf das Tablet passen."
      en: "Judge what takes a lot of storage and work out how many photos still fit on the tablet."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist mehr: 2 MB oder 1800 KB?"
            say: "Was ist mehr: zwei Megabyte oder tausendachthundert Kilobyte?"
            options: ["2 MB", "1800 KB", "Beides ist gleich viel."]
            answer: "2 MB"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "8 MB = _ KB"
            say: "Acht Megabyte sind wie viele Kilobyte?"
            answer: "8000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du?\nWas braucht mehr Speicher: ein Foto oder 100 Seiten Text?"
            say: "Was glaubst du: Was braucht auf dem Handy mehr Speicher, ein einziges Foto oder ein Buch mit hundert Seiten Text?"
            show: { object: mobile-phone }
          - text: "So viel Speicher braucht es ungefähr:\nNachricht: 1 KB\nTextseite: 3 KB\nFoto: 3 MB\nLied: 4 MB\nVideo, 1 Minute: 100 MB"
            say: "So viel Speicher brauchen Dateien ungefähr. Texte brauchen wenig, nur ein paar Kilobyte. Ein Foto braucht ein paar Megabyte. Videos brauchen am meisten, denn ein Video besteht aus sehr vielen Bildern hintereinander."
          - text: "Foto: 3 MB = 3000 KB\nTextseite: 3 KB\n3000 KB : 3 KB = 1000"
            say: "Ein Foto braucht dreitausend Kilobyte, eine Textseite nur drei Kilobyte. Ein einziges Foto braucht so viel Speicher wie tausend Seiten Text. Das Foto gewinnt also locker gegen hundert Seiten."
          - text: "Wusstest du? Der Computer, der 1969 Menschen zum Mond brachte, hatte weniger als 100 KB Speicher."
            say: "Wusstest du? Neunzehnhundertneunundsechzig flogen zum ersten Mal Menschen zum Mond. Der Computer in ihrem Raumschiff hatte weniger als hundert Kilobyte Speicher. Ein einziges Foto auf deinem Handy braucht heute viel mehr: ungefähr dreitausend Kilobyte!"
          - text: "Auf dem Tablet sind 60 MB frei.\nEin Foto braucht 3 MB.\n60 MB : 3 MB = 20 Fotos"
            say: "Auf dem Tablet sind noch sechzig Megabyte frei. Wie viele Fotos passen noch darauf? Sechzig geteilt durch drei sind zwanzig. Es passen noch zwanzig Fotos."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was braucht am meisten Speicher?"
                say: "Was braucht am meisten Speicher?"
                options: ["ein Video von 10 Minuten", "ein Foto", "eine Nachricht"]
                answer: "ein Video von 10 Minuten"
                hints:
                  - "Ein Video besteht aus sehr vielen Bildern."
                  - "Eine Minute Video braucht etwa 100 MB, ein Foto etwa 3 MB."
                  - "ein Video von 10 Minuten."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was braucht mehr Speicher: ein Brief mit 3 Seiten oder ein Foto?"
                say: "Was braucht mehr Speicher: ein Brief mit drei Seiten Text oder ein Foto?"
                options: ["das Foto", "der Brief", "beide gleich viel"]
                answer: "das Foto"
                feedback:
                  "der Brief": "Ein Text braucht wenig Speicher, auch wenn er lang ist. Ein Foto braucht etwa 3 MB."
                hints:
                  - "Eine Textseite braucht etwa 3 KB."
                  - "3 Seiten sind etwa 9 KB. Ein Foto braucht etwa 3 MB = 3000 KB."
                  - "das Foto."
              - id: l2-f3
                type: text_input
                text: "Auf dem Tablet sind noch 30 MB frei. Ein Foto braucht 3 MB. Wie viele Fotos passen noch darauf?"
                say: "Auf dem Tablet sind noch dreißig Megabyte frei. Ein Foto braucht drei Megabyte. Wie viele Fotos passen noch darauf?"
                answer: "10"
                hints:
                  - "Wie oft passen 3 MB in 30 MB?"
                  - "30 : 3."
                  - "10 Fotos."
              - id: l2-f4
                type: multiple_choice
                text: "Ein Lied braucht 4 MB. Lea speichert 12 Lieder. Wie viel Speicher brauchen sie zusammen?"
                say: "Ein Lied braucht vier Megabyte. Lea speichert zwölf Lieder. Wie viel Speicher brauchen sie zusammen?"
                options: ["48 MB", "16 MB", "48 KB"]
                answer: "48 MB"
                hints:
                  - "12 Lieder zu je 4 MB."
                  - "12 · 4."
                  - "48 MB."
              - id: l2-f5
                type: true_false
                text: "Ein Video von einer Minute braucht ungefähr so viel Speicher wie eine Nachricht. Stimmt das?"
                say: "Ein Video von einer Minute braucht ungefähr so viel Speicher wie eine kurze Nachricht. Stimmt das?"
                answer: false
                hints:
                  - "Eine Nachricht braucht etwa 1 KB."
                  - "Eine Minute Video braucht etwa 100 MB."
                  - "Nein, das Video braucht viel mehr."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was braucht am wenigsten Speicher?"
                say: "Was braucht am wenigsten Speicher?"
                options: ["eine kurze Nachricht", "ein Lied", "ein Foto"]
                answer: "eine kurze Nachricht"
                hints: ["Texte brauchen nur ein paar Kilobyte."]
              - id: l2-s2
                type: multiple_choice
                text: "Auf dem USB-Stick sind 300 MB frei. Eine Minute Video braucht 100 MB. Wie lang darf das Video höchstens sein?"
                say: "Auf dem USB-Stick sind dreihundert Megabyte frei. Eine Minute Video braucht hundert Megabyte. Wie lang darf das Video höchstens sein?"
                options: ["3 Minuten", "30 Minuten", "300 Minuten", "3 Wochen"]
                answer: "3 Minuten"
                hints: ["300 : 100."]
              - id: l2-s3
                type: multiple_choice
                text: "Ben schickt 5 Fotos zu je 3 MB. Wie viel Speicher ist das?"
                say: "Ben schickt fünf Fotos zu je drei Megabyte. Wie viel Speicher ist das zusammen?"
                options: ["15 MB", "8 MB", "15 KB"]
                answer: "15 MB"
                hints: ["5 · 3 MB."]
              - id: l2-s4
                type: true_false
                text: "Ein Foto mit 3 MB braucht so viel Speicher wie 1000 Textseiten mit je 3 KB. Stimmt das?"
                say: "Ein Foto mit drei Megabyte braucht so viel Speicher wie tausend Textseiten mit je drei Kilobyte. Stimmt das?"
                answer: true
                hints: ["1000 · 3 KB = 3000 KB."]
              - id: l2-s5
                type: sorting
                text: "Ein paar KB oder viele MB?"
                say: "Sortiere: Braucht die Datei nur ein paar Kilobyte oder viele Megabyte?"
                bins:
                  - { id: kb, show: { text: "ein paar KB" }, say: "ein paar Kilobyte" }
                  - { id: mb, show: { text: "viele MB" }, say: "viele Megabyte" }
                options:
                  - { text: "eine Nachricht an Oma", bin: kb }
                  - { text: "eine Einkaufsliste", bin: kb }
                  - { text: "ein Video vom Geburtstag", bin: mb }
                  - { text: "ein Kinofilm", bin: mb }
                hints: ["Texte brauchen wenig, Videos viel."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Auf dem Handy sind 50 MB frei. Ein Lied braucht 5 MB. Wie viele Lieder passen noch darauf?"
                say: "Auf dem Handy sind fünfzig Megabyte frei. Ein Lied braucht fünf Megabyte. Wie viele Lieder passen noch darauf?"
                show: { object: mobile-phone }
                options: ["10", "45", "250"]
                answer: "10"
              - id: l2-n2
                type: multiple_choice
                text: "Was braucht mehr Speicher: 20 Nachrichten oder ein Foto?"
                say: "Was braucht mehr Speicher: zwanzig kurze Nachrichten oder ein Foto?"
                options: ["ein Foto", "20 Nachrichten", "beide gleich viel"]
                answer: "ein Foto"
              - id: l2-n3
                type: true_false
                text: "Ein Kinofilm braucht mehr Speicher als ein Lied. Stimmt das?"
                say: "Ein Kinofilm braucht mehr Speicher als ein Lied. Stimmt das?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Tim speichert 4 Videos zu je 200 MB. Wie viel Speicher brauchen sie?"
                say: "Tim speichert vier Videos zu je zweihundert Megabyte. Wie viel Speicher brauchen sie zusammen?"
                options: ["800 MB", "204 MB", "8000 MB"]
                answer: "800 MB"
              - id: l2-n5
                type: sorting
                text: "Ein paar KB oder viele MB?"
                say: "Sortiere: Braucht die Datei nur ein paar Kilobyte oder viele Megabyte?"
                bins:
                  - { id: kb, show: { text: "ein paar KB" }, say: "ein paar Kilobyte" }
                  - { id: mb, show: { text: "viele MB" }, say: "viele Megabyte" }
                options:
                  - { text: "eine Hausaufgabe als Text", bin: kb }
                  - { text: "ein Video vom Fußballspiel", bin: mb }
                  - { text: "ein langes Hörspiel", bin: mb }
                  - { text: "eine kurze Nachricht", bin: kb }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: convert
            type: multiple_choice
            text: "9 MB = _ KB"
            say: "Neun Megabyte sind wie viele Kilobyte?"
            options: ["9000", "900", "90"]
            answer: "9000"
          - id: l2-c2
            part: compare
            type: multiple_choice
            text: "Was ist mehr: 4 MB oder 4000 Byte?"
            say: "Was ist mehr: vier Megabyte oder viertausend Byte?"
            options: ["4 MB", "4000 Byte", "Beides ist gleich viel."]
            answer: "4 MB"
          - id: l2-c3
            part: fit
            type: multiple_choice
            text: "Auf der Speicherkarte sind 24 MB frei. Ein Foto braucht 3 MB. Wie viele Fotos passen noch darauf?"
            say: "Auf der Speicherkarte sind vierundzwanzig Megabyte frei. Ein Foto braucht drei Megabyte. Wie viele Fotos passen noch darauf?"
            options: ["8", "21", "72"]
            answer: "8"
          - id: l2-c4
            part: storage
            type: multiple_choice
            text: "Welche Datei ist am größten?"
            say: "Welche Datei ist am größten?"
            options: ["ein Film", "ein Lied", "ein Buch als Text"]
            answer: "ein Film"
          - id: l2-c5
            part: storage
            type: true_false
            text: "Ein langer Text braucht mehr Speicher als ein Foto. Stimmt das?"
            say: "Ein langer Text braucht mehr Speicher als ein Foto. Stimmt das?"
            answer: false
          - id: l2-c6
            part: convert
            type: text_input
            text: "6 KB = _ Byte"
            say: "Sechs Kilobyte sind wie viele Byte?"
            answer: "6000"
          - id: l2-c7
            part: convert
            type: multiple_choice
            text: "5000 KB = _ MB"
            say: "Fünftausend Kilobyte sind wie viele Megabyte?"
            options: ["5", "50", "500"]
            answer: "5"
          - id: l2-c8
            part: convert
            type: true_false
            text: "2 MB = 200 KB. Stimmt das?"
            say: "Zwei Megabyte sind zweihundert Kilobyte. Stimmt das?"
            answer: false
          - id: l2-c9
            part: convert
            type: fill_in_blank
            text: "Setze ein."
            say: "Setze ein. Ein Megabyte sind wie viele Kilobyte und wie viele Byte?"
            frame: "1 MB = _ KB = _ Byte"
            options: ["1000", "1 000 000", "100", "10 000"]
            answer: ["1000", "1 000 000"]
            option_audio: false
          - id: l2-c10
            part: compare
            type: multiple_choice
            text: "Was ist weniger: 2500 KB oder 2 MB?"
            say: "Was ist weniger: zweitausendfünfhundert Kilobyte oder zwei Megabyte?"
            options: ["2500 KB", "2 MB", "Beides ist gleich viel."]
            answer: "2 MB"
          - id: l2-c11
            part: compare
            type: ordering
            text: "Ordne von klein nach groß."
            say: "Ordne die Größen. Die kleinste kommt zuerst."
            options: ["1 MB", "90 KB", "9000 Byte", "900 KB"]
            slot_count: 4
            answer: ["9000 Byte", "90 KB", "900 KB", "1 MB"]
          - id: l2-c12
            part: compare
            type: true_false
            text: "3000 Byte sind mehr als 2 KB. Stimmt das?"
            say: "Dreitausend Byte sind mehr als zwei Kilobyte. Stimmt das?"
            answer: true
          - id: l2-c13
            part: compare
            type: multiple_choice
            text: "Was ist genauso viel wie 4 MB?"
            say: "Was ist genauso viel wie vier Megabyte?"
            options: ["400 KB", "4000 KB", "40 000 Byte"]
            answer: "4000 KB"
            option_audio: false
          - id: l2-c14
            part: storage
            type: multiple_choice
            text: "Welche Datei braucht am meisten Speicher?"
            say: "Welche Datei braucht am meisten Speicher?"
            options: ["ein Lied", "100 kurze Nachrichten", "ein Video von 5 Minuten"]
            answer: "ein Video von 5 Minuten"
          - id: l2-c15
            part: storage
            type: sorting
            text: "Wenig oder viel Speicher?"
