# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.written-mult-one
skill: math.written-mult-div.mult-one-digit
curriculum: de-DE
language: de
title:
  de: Schriftlich malnehmen mit einer einstelligen Zahl
  en: Written multiplication by a one-digit number
summary: >
  Multiplying a multi-digit number by a one-digit number in writing,
  starting with the ones. Lesson 1 multiplies without Übertrag (231 · 3)
  and checks the size with an Überschlag; lesson 2 carries the Übertrag
  to the next place (347 · 6 = 2082), finds the step where an Übertrag
  was forgotten, and ends with the skill check. Typed answers are plain
  digits.
metadata:
  year: klasse-4
  topic: { de: Schriftlich malnehmen, en: Written multiplication }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.semi-written-mult, math.written-add-sub.add-carry]
  also_practises: [math.mult-div-larger.large-mental]
  vocabulary: { de: [schriftlich multiplizieren, Übertrag, Einer, Zehner, Hunderter, Überschlag] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: no-carry, what: { de: Stelle für Stelle ohne Übertrag malnehmen, en: multiplying place by place without carrying } }
    - { id: carry, what: { de: mit Übertrag malnehmen, en: multiplying with carrying } }
    - { id: explain, what: { de: den Übertrag erklären und Fehler finden, en: explaining the carrying and finding mistakes } }
    - { id: estimate, what: { de: mit einem Überschlag prüfen, en: checking with an estimate } }
  misconceptions:
    - id: forget-carry
      what: Writes the Übertrag but does not add it at the next place
      addressed: lesson 2 Learn adds each Übertrag aloud; a "Wo ist der Fehler?" task with a forgotten Übertrag in the full and some stages of lesson 2 (feedback in l2-f3), a correct one to judge in the none stage, and a true/false task with a forgotten Übertrag in the some stage and the skill check
    - id: start-left
      what: Starts with the hundreds instead of the ones
      addressed: both Learn parts start with the ones; the step frames always go Einer, Zehner, Hunderter
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
