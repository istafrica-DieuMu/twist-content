            say: "Dreihundertzwölf mal drei, schriftlich. Du fängst bei den Einern an: zwei mal drei ist sechs. Die Sechs schreibst du unter die Einer."
          - text: "Z: 1 · 3 = 3 | H: 3 · 3 = 9 | 312 · 3 = 936"
            say: "Dann die Zehner: eins mal drei ist drei. Dann die Hunderter: drei mal drei ist neun. Das Ergebnis ist neunhundertsechsunddreißig."
          - text: "Überschlag: 300 · 3 = 900"
            say: "Mit dem Überschlag prüfst du, ob das Ergebnis ungefähr stimmt: dreihundert mal drei ist neunhundert. Neunhundertsechsunddreißig liegt nah daran."

