    title: { de: Ohne Übertrag, en: Without carrying }
    goal:
      de: "Nimm eine große Zahl schriftlich mal und fang bei den Einern an, so wie bei 312 mal 3."
      en: "Multiply a big number in columns, starting with the ones, like 312 times 3."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "7 · 8 = _"
            say: "Sieben mal acht."
            answer: "56"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "30 · 4 = _"
            say: "Dreißig mal vier."
            answer: "120"
            difficulty: easy

      - activity: learn
