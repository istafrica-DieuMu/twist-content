# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.capacity-l-ml
skill: math.mass-capacity.l-ml
curriculum: de-DE
language: de
title:
  de: Liter und Milliliter
  en: Litres and millilitres
summary: >
  Lesson 1 learns 1 l = 1000 ml, reads and marks amounts on a measuring
  jug scale in steps of 100 ml (a number line from 0 to 1000 ml stands
  in for the jug) and estimates what a glass, a bottle and a bucket
  hold; lesson 2 writes capacities with a comma (1,5 l = 1500 ml, 0,33 l
  = 330 ml), finds what is missing to 1 l and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Rauminhalte, en: Capacity }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mass-capacity.compare-capacity, math.numbers-to-100.number-line]
  also_practises: [math.mass-capacity.compare-capacity, math.numbers-to-1000.number-line]
  vocabulary: { de: [Liter, Milliliter, Messbecher, Skala, halber Liter, fassen] }
  forms: [picture, drawn, text, audio]
  drawn: [number-line]
  facets: [units]
  parts:
    - { id: convert, what: { de: Liter und Milliliter umrechnen, en: converting between litres and millilitres } }
    - { id: scale, what: { de: am Messbecher ablesen und eintragen, en: reading and marking a measuring jug } }
    - { id: estimate, what: { de: Rauminhalte mit passenden Mengen angeben, en: giving sensible capacities for everyday things } }
  misconceptions:
    - id: tick-as-one
      what: Counts each mark on the jug scale as 1 ml or 10 ml when the marks go in steps of 100 ml
      addressed: lesson 1 Learn says each mark is 100 ml; every scale reading offers 3 ml and 30 ml for 300 ml, with feedback in l1-f2
    - id: litre-hundred
      what: Thinks 1 l = 100 ml, as with metres and centimetres, and so reads 1,5 l as 150 ml or 1005 ml
      addressed: lesson 1 Learn and lesson 2 Learn set 1 l = 1000 ml and three places after the comma; l1-f1, l2-f1, l2-n4 and l2-c4 offer the factor 100 or the misread comma, with feedback in l1-f1 and l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Am Messbecher ablesen", en: "Reading a measuring jug" }
    goal:
      de: "Lies am Messbecher ab, wie viel darin ist. Denk daran, 1 Liter hat 1000 Milliliter."
      en: "Read how much is in a measuring jug. Remember, 1 litre has 1000 millilitres."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "In welches Gefäß passt am meisten?"
            say: "In welches Gefäß passt am meisten Wasser?"
            options: ["eine Badewanne", "ein Eimer", "eine Tasse"]
            answer: "eine Badewanne"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wohin zeigt der Pfeil?"
            say: "Wohin zeigt der Pfeil auf dem Zahlenstrahl?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 70 }
            options: ["70", "7", "60"]
            answer: "70"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du? In diese Flasche passt 1 Liter. Wie viele Milliliter sind das: 10 ml, 100 ml oder 1000 ml?"
            say: "In diese Flasche passt ein Liter Wasser. Was glaubst du: Wie viele Milliliter sind das? Zehn, hundert oder tausend?"
            show: { object: bottle }
          - text: "1 l = 1000 ml"
            say: "Tausend Milliliter! Wie viel in ein Gefäß passt, misst du in Litern und Millilitern. Ein Liter hat tausend Milliliter. In eine große Flasche Wasser passt oft ein Liter. Ein Teelöffel fasst ungefähr fünf Milliliter."
          - text: "Skala am Messbecher: 0 ml bis 1000 ml\nJeder Strich: 100 ml\n500 ml = ein halber Liter"
            say: "Am Messbecher ist eine Skala. Hier siehst du sie liegend. Jeder Strich ist hundert Milliliter. Der Strich genau in der Mitte zeigt fünfhundert Milliliter, einen halben Liter. Der Pfeil zeigt, wie hoch der Saft steht."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 500 }
          - text: "Glas: etwa 200 ml\nFlasche: etwa 1 l\nPutzeimer: etwa 10 l"
            say: "Merk dir ein paar Dinge zum Vergleichen. In ein Glas passen ungefähr zweihundert Milliliter. In eine Flasche ungefähr ein Liter. In einen Putzeimer ungefähr zehn Liter."
          - text: "Wusstest du? Ein Teelöffel fasst etwa 5 ml. Willst du eine 1-Liter-Flasche mit dem Teelöffel füllen, brauchst du 1000 : 5 = 200 Löffel."
            say: "Wusstest du? Ein Teelöffel fasst etwa fünf Milliliter. Willst du eine Ein-Liter-Flasche nur mit dem Teelöffel füllen, brauchst du tausend geteilt durch fünf, also zweihundert Löffel. Das dauert!"
            show: { object: spoon }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1 l = _ ml"
                say: "Wie viele Milliliter hat ein Liter?"
                options: ["1000", "100", "10"]
                answer: "1000"
                feedback:
                  "100": "So ist es bei Meter und Zentimeter. Ein Liter hat 1000 Milliliter."
                hints:
                  - "Milli heißt: ein Tausendstel."
                  - "Wie bei Kilogramm und Gramm."
                  - "1000 ml."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Messbecher-Skala: Wie viel Saft ist im Becher?"
                say: "Der Pfeil zeigt, wie hoch der Saft im Messbecher steht. Wie viel Saft ist im Becher?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 300 }
                options: ["300 ml", "3 ml", "30 ml"]
                answer: "300 ml"
                feedback:
                  "3 ml": "Jeder Strich ist 100 ml, nicht 1 ml."
                  "30 ml": "Jeder Strich ist 100 ml, nicht 10 ml."
                hints:
                  - "Jeder Strich ist 100 ml."
                  - "Zähle die Striche bis zum Pfeil: 100, 200, ..."
                  - "300 ml."
              - id: l1-f3
                type: point_on_line
                text: "Zeig auf der Skala, wo 800 ml sind."
                say: "Zeig auf der Skala vom Messbecher, wo achthundert Milliliter sind."
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
                answer: 800
                hints:
                  - "Der Strich in der Mitte ist 500 ml."
                  - "Von 500 ml noch drei Striche weiter."
                  - "Der zweite Strich vor 1000 ml."
              - id: l1-f4
                type: multiple_choice
                text: "Was fasst ungefähr 200 ml?"
                say: "Was fasst ungefähr zweihundert Milliliter?"
                options: ["ein Glas", "ein Eimer", "ein Teelöffel"]
                answer: "ein Glas"
                hints:
                  - "200 ml sind weniger als ein halber Liter."
                  - "Ein Eimer fasst viele Liter, ein Teelöffel nur ein paar Milliliter."
                  - "ein Glas."
              - id: l1-f5
                type: true_false
                text: "2 l = 2000 ml. Stimmt das?"
                say: "Zwei Liter sind zweitausend Milliliter. Stimmt das?"
                answer: true
                hints:
                  - "1 l sind 1000 ml."
                  - "2 · 1000 ml."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Messbecher-Skala: Wie viel Wasser ist im Becher?"
                say: "Der Pfeil zeigt, wie hoch das Wasser steht. Wie viel Wasser ist im Messbecher?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 600 }
                options: ["600 ml", "6 ml", "60 ml"]
                answer: "600 ml"
                hints: ["Der Strich in der Mitte ist 500 ml."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie viele Milliliter sind ein halber Liter?"
                say: "Wie viele Milliliter sind ein halber Liter?"
                options: ["500 ml", "50 ml", "5 ml"]
                answer: "500 ml"
                hints: ["Die Hälfte von 1000 ml."]
              - id: l1-s3
                type: point_on_line
                text: "Zeig auf der Skala, wo 200 ml sind."
                say: "Zeig auf der Skala vom Messbecher, wo zweihundert Milliliter sind."
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
                answer: 200
                hints: ["Jeder Strich ist 100 ml."]
              - id: l1-s4
                type: multiple_choice
                text: "Was misst du in Litern?"
                say: "Was misst du am besten in Litern?"
                options: ["das Wasser in der Badewanne", "den Saft in einem Löffel", "einen Tropfen Medizin"]
                answer: "das Wasser in der Badewanne"
                hints: ["Liter passen für große Mengen."]
              - id: l1-s5
                type: true_false
                text: "3000 ml = 3 l. Stimmt das?"
                say: "Dreitausend Milliliter sind drei Liter. Stimmt das?"
                answer: true
                hints: ["1000 ml sind 1 l."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Messbecher-Skala: Wie viel Milch ist im Becher?"
                say: "Der Pfeil zeigt, wie hoch die Milch steht. Wie viel Milch ist im Messbecher?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 900 }
                options: ["900 ml", "9 ml", "90 ml"]
                answer: "900 ml"
              - id: l1-n2
                type: point_on_line
                text: "Zeig auf der Skala, wo ein halber Liter ist."
                say: "Zeig auf der Skala vom Messbecher, wo ein halber Liter ist."
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
                answer: 500
              - id: l1-n3
                type: multiple_choice
                text: "5 l = _ ml"
                say: "Wie viele Milliliter sind fünf Liter?"
                options: ["5000", "500", "50"]
                answer: "5000"
              - id: l1-n4
                type: multiple_choice
                text: "Was fasst ungefähr 10 l?"
                say: "Was fasst ungefähr zehn Liter?"
                options: ["ein Putzeimer", "eine Kaffeetasse", "ein Schwimmbecken"]
                answer: "ein Putzeimer"
              - id: l1-n5
                type: true_false
                text: "Ein Teelöffel fasst ungefähr 1 l. Stimmt das?"
                say: "Ein Teelöffel fasst ungefähr einen Liter. Stimmt das?"
                answer: false
                feedback:
                  "true": "Ein Liter in einem Teelöffel? Dann wäre der Löffel so groß wie eine Schaufel! Ein Teelöffel fasst ungefähr 5 ml."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Messbecher-Skala: Wie viel Wasser ist im Becher?"
            say: "Wie viel Wasser ist im Messbecher?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 400 }
            options: ["400 ml", "4 ml", "40 ml"]
            answer: "400 ml"
          - id: l1-c2
            type: multiple_choice
            text: "4 l = _ ml"
            say: "Wie viele Milliliter sind vier Liter?"
            options: ["4000", "400", "40"]
            answer: "4000"
          - id: l1-c3
            type: point_on_line
            text: "Zeig auf der Skala, wo 700 ml sind."
            say: "Zeig auf der Skala vom Messbecher, wo siebenhundert Milliliter sind."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
            answer: 700
          - id: l1-c4
            type: true_false
            text: "8000 ml = 8 l. Stimmt das?"
            say: "Achttausend Milliliter sind acht Liter. Stimmt das?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Was fasst ungefähr 5 ml?"
            say: "Was fasst ungefähr fünf Milliliter?"
            options: ["ein Teelöffel", "ein Glas", "ein Eimer"]
            answer: "ein Teelöffel"
          - id: l1-c6
            type: multiple_choice
            text: "Messbecher-Skala: Wie viel Saft ist im Becher?"
            say: "Der Pfeil zeigt, wie hoch der Saft steht. Wie viel Saft ist im Messbecher?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 100 }
            options: ["100 ml", "1 ml", "10 ml"]
            answer: "100 ml"

  - n: 2
    title: { de: "Liter mit Komma", en: "Litres with decimals" }
    goal:
      de: "Schreib Liter mit Komma und rechne sie in Milliliter um. 1,5 Liter sind 1500 Milliliter."
      en: "Write litres with a decimal point and change them into millilitres. 1.5 litres is 1500 millilitres."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Messbecher-Skala: Wie viel Saft ist im Becher?"
            say: "Wie viel Saft ist im Messbecher?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 800 }
            options: ["800 ml", "8 ml", "80 ml"]
            answer: "800 ml"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "6 l = _ ml"
            say: "Wie viele Milliliter sind sechs Liter?"
            options: ["6000", "600", "60"]
            answer: "6000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du? Auf der großen Wasserflasche steht 1,5 l. Kannst du damit 3 Trinkflaschen zu je 500 ml füllen?"
            say: "Auf der großen Wasserflasche steht eins Komma fünf Liter. Was glaubst du: Kannst du damit drei Trinkflaschen füllen, in die je fünfhundert Milliliter passen?"
            show: { object: bottle }
          - text: "1,5 l = 1,500 l = 1 l 500 ml = 1500 ml"
            say: "Ja, genau! Eins Komma fünf Liter sind tausendfünfhundert Milliliter, und dreimal fünfhundert sind auch tausendfünfhundert. Auch Liter kannst du mit Komma schreiben. Ein Liter hat tausend Milliliter. Darum stehen nach dem Komma drei Stellen für die Milliliter. Eins Komma fünf Liter sind ein Liter und fünfhundert Milliliter."
          - text: "0,2 l = 200 ml\n0,33 l = 330 ml\n2 l 50 ml = 2,05 l = 2050 ml"
            say: "Auf Flaschen und Dosen steht oft eine Kommazahl. Null Komma drei drei Liter sind dreihundertdreißig Milliliter. Achte auf die Null: Zwei Liter und fünfzig Milliliter schreibst du zwei Komma null fünf Liter."
          - text: "Im Becher: 300 ml\nBis 1 l fehlen: 700 ml\n300 ml + 700 ml = 1000 ml = 1 l"
            say: "Im Messbecher sind dreihundert Milliliter. Wie viel fehlt bis zu einem Liter? Du ergänzt bis tausend Milliliter: Es fehlen siebenhundert Milliliter."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 300 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "1,5 l = _"
                say: "Wie viele Milliliter sind eins Komma fünf Liter?"
                options: ["1500 ml", "1005 ml", "150 ml"]
                answer: "1500 ml"
                feedback:
                  "1005 ml": "1,5 l sind 1,500 l. Nach dem Komma stehen 500 Milliliter, nicht 5."
                  "150 ml": "Ein Liter hat 1000 Milliliter, nicht 100."
                hints:
                  - "Nach dem Komma stehen drei Stellen für die Milliliter."
                  - "1,5 l = 1 l 500 ml."
                  - "1500 ml."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Schreib mit Komma."
                say: "Zwei Liter und zweihundertfünfzig Milliliter. Schreib das mit Komma."
                frame: "2 l 250 ml = _ l"
                options: ["2,25", "2,025", "22,5"]
                answer: ["2,25"]
                hints:
                  - "Vor das Komma kommen die Liter."
                  - "250 ml sind 0,250 l. Die Null am Ende kannst du weglassen."
                  - "2,25 l."
              - id: l2-f3
                type: multiple_choice
                text: "Auf der Saftdose steht 0,33 l. Wie viele Milliliter sind das?"
                say: "Auf einer Saftdose steht null Komma drei drei Liter. Wie viele Milliliter sind das?"
                options: ["330 ml", "33 ml", "3300 ml"]
                answer: "330 ml"
                hints:
                  - "Schreib drei Stellen nach dem Komma."
                  - "0,33 l = 0,330 l."
                  - "330 ml."
              - id: l2-f4
                type: multiple_choice
                text: "Eine Flasche hat 1 l Wasser. Lea hat schon 400 ml getrunken. Wie viel ist noch darin?"
                say: "In einer Flasche ist ein Liter Wasser. Lea hat schon vierhundert Milliliter getrunken. Wie viel ist noch darin?"
                show: { object: bottle }
                options: ["600 ml", "1400 ml", "400 ml"]
                answer: "600 ml"
                hints:
                  - "1 l sind 1000 ml."
                  - "1000 ml − 400 ml."
                  - "600 ml."
              - id: l2-f5
                type: matching
                text: "Was ist gleich viel?"
                say: "Verbinde die Mengen, die gleich viel sind."
                pairs:
                  - { left: { text: "1,2 l" }, right: { text: "1200 ml" } }
                  - { left: { text: "1,02 l" }, right: { text: "1020 ml" } }
                  - { left: { text: "0,12 l" }, right: { text: "120 ml" } }
                hints:
                  - "Schreib jede Menge mit drei Stellen nach dem Komma."
                  - "1,2 l = 1,200 l. 1,02 l = 1,020 l. 0,12 l = 0,120 l."
                  - "1,2 l und 1200 ml, 1,02 l und 1020 ml, 0,12 l und 120 ml."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "2,5 l = _"
                say: "Wie viele Milliliter sind zwei Komma fünf Liter?"
                options: ["2500 ml", "2005 ml", "250 ml"]
                answer: "2500 ml"
                hints: ["2,5 l = 2,500 l."]
              - id: l2-s2
                type: fill_in_blank
                text: "Wie viele Liter und Milliliter sind das?"
                say: "Dreitausendzweihundert Milliliter. Wie viele Liter und Milliliter sind das?"
                frame: "3200 ml = _ l _ ml"
                options: ["3", "200", "32", "20"]
                answer: ["3", "200"]
                hints: ["3000 ml sind 3 l."]
              - id: l2-s3
                type: multiple_choice
                text: "Was ist mehr: 1,4 l oder 1250 ml?"
                say: "Was ist mehr: eins Komma vier Liter oder tausendzweihundertfünfzig Milliliter?"
                options: ["1,4 l", "1250 ml", "Beides ist gleich viel."]
                answer: "1,4 l"
                hints: ["Rechne 1,4 l in Milliliter um."]
              - id: l2-s4
                type: multiple_choice
                text: "Im Messbecher ist Saft. Wie viel fehlt bis 1 l?"
                say: "Wie viel Saft fehlt noch bis zu einem Liter?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 600 }
                options: ["400 ml", "600 ml", "1600 ml"]
                answer: "400 ml"
                hints: ["Lies zuerst ab, wie viel drin ist. Dann ergänze bis 1000 ml."]
              - id: l2-s5
                type: true_false
                text: "0,5 l = 500 ml. Stimmt das?"
                say: "Null Komma fünf Liter sind fünfhundert Milliliter. Stimmt das?"
                answer: true
                hints: ["0,5 l ist ein halber Liter."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "3,75 l = _"
                say: "Wie viele Milliliter sind drei Komma sieben fünf Liter?"
                options: ["3750 ml", "3075 ml", "375 ml"]
                answer: "3750 ml"
              - id: l2-n2
                type: fill_in_blank
                text: "Schreib mit Komma."
                say: "Ein Liter und achtzig Milliliter. Schreib das mit Komma."
                frame: "1 l 80 ml = _ l"
                options: ["1,08", "1,8", "1,008"]
                answer: ["1,08"]
              - id: l2-n3
                type: multiple_choice
                text: "Welche Menge ist am größten?"
                say: "Welche Menge ist am größten?"
                options: ["1,1 l", "990 ml", "0,9 l"]
                answer: "1,1 l"
              - id: l2-n4
                type: true_false
                text: "0,25 l = 25 ml. Stimmt das?"
                say: "Null Komma zwei fünf Liter sind fünfundzwanzig Milliliter. Stimmt das?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Ein Eimer fasst 10 l. Darin sind 6,5 l. Wie viel passt noch hinein?"
                say: "Ein Eimer fasst zehn Liter. Darin sind sechs Komma fünf Liter. Wie viel passt noch hinein?"
                show: { object: bucket }
                options: ["3,5 l", "4,5 l", "16,5 l"]
                answer: "3,5 l"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: convert
            type: multiple_choice
            text: "4,2 l = _"
            say: "Wie viele Milliliter sind vier Komma zwei Liter?"
            options: ["4200 ml", "4002 ml", "420 ml"]
            answer: "4200 ml"
          - id: l2-c2
            part: scale
            type: multiple_choice
            text: "Messbecher-Skala: Wie viel Tee ist im Becher?"
            say: "Der Pfeil zeigt, wie hoch der Tee steht. Wie viel Tee ist im Messbecher?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 200 }
            options: ["200 ml", "2 ml", "20 ml"]
            answer: "200 ml"
          - id: l2-c3
            part: convert
            type: fill_in_blank
            text: "Schreib mit Komma."
            say: "Zweitausendfünfzig Milliliter. Schreib das in Litern mit Komma."
            frame: "2050 ml = _ l"
            options: ["2,05", "2,5", "20,5"]
            answer: ["2,05"]
          - id: l2-c4
            part: convert
            type: true_false
            text: "1 l = 100 ml. Stimmt das?"
            say: "Ein Liter sind hundert Milliliter. Stimmt das?"
            answer: false
          - id: l2-c5
            part: estimate
            type: multiple_choice
            text: "Was fasst ungefähr 1 l?"
            say: "Was fasst ungefähr einen Liter?"
            options: ["eine Milchtüte", "ein Fingerhut", "eine Badewanne"]
            answer: "eine Milchtüte"
          - id: l2-c6
            part: convert
            type: text_input
            text: "7 l = _ ml"
            say: "Wie viele Milliliter sind sieben Liter?"
            answer: "7000"
          - id: l2-c7
            part: convert
            type: multiple_choice
            text: "0,75 l = _"
            say: "Wie viele Milliliter sind null Komma sieben fünf Liter?"
            options: ["750 ml", "75 ml", "7500 ml"]
            answer: "750 ml"
          - id: l2-c8
            part: convert
            type: multiple_choice
            text: "1,06 l = _"
            say: "Wie viele Milliliter sind eins Komma null sechs Liter?"
            options: ["1060 ml", "1600 ml", "106 ml"]
            answer: "1060 ml"
          - id: l2-c9
            part: convert
            type: fill_in_blank
            text: "Wie viele Liter und Milliliter sind das?"
            say: "Fünftausendsiebzig Milliliter. Wie viele Liter und Milliliter sind das?"
            frame: "5070 ml = _ l _ ml"
            options: ["5", "70", "7", "507"]
            answer: ["5", "70"]
          - id: l2-c10
            part: scale
            type: multiple_choice
