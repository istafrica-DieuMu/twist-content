            say: "Du drehst eine Karte mit der Zahl achtzehn eine halbe Drehung. Welche Zahl siehst du?"
            show: { drawn: letter-card, text: "18" }
            options: ["81", "18", "88"]
            answer: "81"
            option_audio: false
