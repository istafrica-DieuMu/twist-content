            options: ["5", "2", "4"]
            answer: "5"
          - id: l2-c5
            part: tip
            type: multiple_choice
            text: "2 oben, 1 rechts. Du kippst den Würfel nach rechts. Welche Zahl ist oben?"
            say: "Der Würfel liegt mit der Zwei oben, die Eins zeigt nach rechts. Du kippst ihn nach rechts. Welche Zahl ist jetzt oben?"
            options: ["6", "1", "5"]
