# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.mental-moves
skill: math.space.mental-moves
curriculum: de-DE
language: de
title:
  de: Drehen und Kippen im Kopf
  en: Turning and tipping in your head
summary: >
  Lesson 1 turns letters, numbers and shapes in the head (eine halbe
  Drehung macht aus b ein q, aus 16 wird 91; eine Vierteldrehung stellt
  ein liegendes Rechteck hochkant) and tells a turn from a mirror image
  (b gespiegelt ist d); lesson 2 tips a Spielwürfel in the head, using
  that opposite faces make 7 and that tipping brings the face from the
  other side on top, and ends with the skill check. Turning a drawn shape
  by a quarter turn and choosing its picture waits for a drawn component
  that shows rotated figures and dice in an oblique view.
metadata:
  year: klasse-4
  topic: { de: Orientierung, en: Position and direction }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.space.views, math.solids.nets]
  also_practises: []
  vocabulary: { de: [drehen, halbe Drehung, Vierteldrehung, spiegeln, kippen, Spielwürfel, gegenüber, Augen] }
  forms: [text, audio, drawn]
  drawn: [shape, letter-card, dots]
  facets: []
  parts:
    - { id: turn, what: { de: Buchstaben und Figuren im Kopf drehen und vom Spiegelbild unterscheiden, en: turning letters and shapes in your head and telling a turn from a mirror image } }
    - { id: opposite, what: { de: die gegenüberliegenden Seiten eines Spielwürfels kennen, en: knowing the opposite faces of a dice } }
    - { id: tip, what: { de: einen Spielwürfel im Kopf kippen, en: tipping a dice in your head } }
  misconceptions:
    - id: turn-is-mirror
      what: Mixes up a half turn with a mirror image (turns b and picks d)
      addressed: lesson 1 Learn turns b into q and mirrors b into d; l1-f1, l1-s1, l1-n1 and l2-c1 offer the mirror image, with feedback in l1-f1; l1-f2, l1-s5 and l1-n4 ask for the mirror image
    - id: tipped-face-comes-up
      what: When a dice is tipped, thinks the face on the side it tips towards comes on top, instead of the face on the opposite side
      addressed: lesson 2 Learn tips the dice forward and brings the back face up; l2-f2, l2-s2, l2-n5, l2-c4 and l2-c5 offer the face in the tipping direction, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Figuren drehen", en: "Turning shapes" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Flächen hat ein Würfel?"
            say: "Wie viele Flächen hat ein Würfel?"
            show: { drawn: shape, kind: cube, colour: blue }
            options: ["6", "4", "8"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Du schaust von oben auf einen Würfel. Was siehst du?"
            say: "Du schaust genau von oben auf einen Würfel. Welche Form siehst du?"
            options: ["ein Quadrat", "einen Kreis", "ein Dreieck"]
            answer: "ein Quadrat"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "halbe Drehung: Aus b wird q."
            say: "Stell dir vor, du drehst die Karte mit dem b eine halbe Drehung, bis oben unten ist. Der Strich war links und geht jetzt rechts nach unten. Der Bauch war unten und ist jetzt oben. Aus dem b wird ein q."
            show: { drawn: letter-card, text: "b" }
          - text: "spiegeln: Aus b wird d."
            say: "Hältst du das b an einen Spiegel, der daneben steht, siehst du sein Spiegelbild. Der Bauch bleibt unten, zeigt aber zur anderen Seite. Aus dem b wird ein d. Drehen und Spiegeln sind also nicht dasselbe."
            show: { drawn: letter-card, text: "b d" }
          - text: "Vierteldrehung: Das Rechteck steht hochkant."
            say: "Bei einer Vierteldrehung dreht sich eine Figur so weit wie der große Uhrzeiger von zwölf bis drei. Ein liegendes Rechteck steht danach hochkant. Ein Quadrat sieht danach genauso aus wie vorher."
            show: { drawn: shape, kind: rectangle, colour: green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Du drehst das d eine halbe Drehung. Welcher Buchstabe entsteht?"
                say: "Du drehst das d eine halbe Drehung. Welcher Buchstabe entsteht?"
                show: { drawn: letter-card, text: "d" }
                options: ["p", "b", "q"]
                answer: "p"
                option_audio: false
                feedback:
                  "b": "Das b ist das Spiegelbild vom d. Bei einer halben Drehung kommt der Bauch nach oben."
                hints:
                  - "Wo sind der Strich und der Bauch nach der Drehung?"
                  - "Der Strich geht jetzt links nach unten, der Bauch ist oben rechts."
                  - "p."
              - id: l1-f2
                type: multiple_choice
                text: "Du spiegelst das b an einem Spiegel daneben. Welcher Buchstabe entsteht?"
                say: "Du hältst das b an einen Spiegel, der daneben steht. Welchen Buchstaben siehst du im Spiegel?"
                show: { drawn: letter-card, text: "b" }
                options: ["d", "p", "q"]
                answer: "d"
                option_audio: false
                hints:
                  - "Beim Spiegeln bleibt oben oben."
                  - "Der Bauch bleibt unten, zeigt aber zur anderen Seite."
                  - "d."
                difficulty: easy
              - id: l1-f3
                type: multiple_choice
                text: "Du drehst die 6 eine halbe Drehung. Welche Zahl entsteht?"
                say: "Du drehst die Karte mit der Sechs eine halbe Drehung. Welche Zahl siehst du?"
                show: { drawn: letter-card, text: "6" }
                options: ["9", "6", "0"]
                answer: "9"
                option_audio: false
                hints:
                  - "Wo ist der Kreis der 6 nach der Drehung?"
                  - "Der Kreis war unten, jetzt ist er oben."
                  - "9."
              - id: l1-f4
                type: true_false
                text: "Nach einer Vierteldrehung sieht das Quadrat genauso aus wie vorher."
                say: "Stimmt das? Nach einer Vierteldrehung sieht das Quadrat genauso aus wie vorher."
                show: { drawn: shape, kind: square, colour: orange }
                answer: true
                hints:
                  - "Wie lang sind die Seiten des Quadrats?"
                  - "Alle Seiten sind gleich lang. Nach der Drehung liegt einfach eine andere Seite unten."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Du drehst das Dreieck eine halbe Drehung. Wohin zeigt die Spitze dann?"
                say: "Die Spitze des Dreiecks zeigt nach oben. Du drehst es eine halbe Drehung. Wohin zeigt die Spitze dann?"
                show: { drawn: shape, kind: triangle, colour: purple }
                options: ["nach unten", "nach oben", "nach rechts"]
                answer: "nach unten"
                hints:
                  - "Bei einer halben Drehung wird oben zu unten."
                  - "Die Spitze ist oben. Nach der halben Drehung ist sie auf der anderen Seite."
                  - "Nach unten."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Du drehst das p eine halbe Drehung. Welcher Buchstabe entsteht?"
                say: "Du drehst das p eine halbe Drehung. Welcher Buchstabe entsteht?"
                show: { drawn: letter-card, text: "p" }
                options: ["d", "q", "b"]
                answer: "d"
                option_audio: false
                hints: ["Der Bauch ist danach unten, der Strich geht nach oben."]
              - id: l1-s2
                type: multiple_choice
                text: "Du drehst das n eine halbe Drehung. Welcher Buchstabe entsteht?"
                say: "Du drehst das n eine halbe Drehung. Welcher Buchstabe entsteht?"
                show: { drawn: letter-card, text: "n" }
                options: ["u", "n", "m"]
                answer: "u"
                option_audio: false
                hints: ["Der Bogen ist oben. Wo ist er danach?"]
              - id: l1-s3
                type: multiple_choice
                text: "Du drehst die Karte mit 16 eine halbe Drehung. Welche Zahl siehst du?"
                say: "Du drehst eine Karte mit der Zahl sechzehn eine halbe Drehung. Welche Zahl siehst du?"
                show: { drawn: letter-card, text: "16" }
                options: ["91", "19", "61"]
                answer: "91"
                option_audio: false
                hints: ["Die Ziffern tauschen ihren Platz, und aus der 6 wird eine 9."]
                difficulty: stretch
              - id: l1-s4
                type: true_false
                text: "Nach einer Vierteldrehung steht das liegende Rechteck hochkant."
                say: "Stimmt das? Nach einer Vierteldrehung steht das liegende Rechteck hochkant."
                show: { drawn: shape, kind: rectangle, colour: blue }
                answer: true
                hints: ["Stell dir den Uhrzeiger von zwölf bis drei vor."]
              - id: l1-s5
                type: multiple_choice
                text: "Du spiegelst das q an einem Spiegel daneben. Welcher Buchstabe entsteht?"
                say: "Du hältst das q an einen Spiegel, der daneben steht. Welchen Buchstaben siehst du im Spiegel?"
                show: { drawn: letter-card, text: "q" }
                options: ["p", "d", "b"]
                answer: "p"
                option_audio: false
                hints: ["Der Bauch bleibt oben, zeigt aber zur anderen Seite."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Du drehst das q eine halbe Drehung. Welcher Buchstabe entsteht?"
                say: "Du drehst das q eine halbe Drehung. Welcher Buchstabe entsteht?"
                show: { drawn: letter-card, text: "q" }
                options: ["b", "p", "d"]
                answer: "b"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Du drehst das M eine halbe Drehung. Welcher Buchstabe entsteht?"
                say: "Du drehst das große M eine halbe Drehung. Welcher Buchstabe entsteht?"
                show: { drawn: letter-card, text: "M" }
                options: ["W", "M", "N"]
                answer: "W"
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Du drehst die Karte mit 69 eine halbe Drehung. Welche Zahl siehst du?"
                say: "Du drehst eine Karte mit der Zahl neunundsechzig eine halbe Drehung. Welche Zahl siehst du?"
                show: { drawn: letter-card, text: "69" }
                options: ["69", "96", "66"]
                answer: "69"
                option_audio: false
                difficulty: stretch
              - id: l1-n4
                type: multiple_choice
                text: "Du spiegelst das b an einem Spiegel, der darunter liegt. Welcher Buchstabe entsteht?"
                say: "Du legst einen Spiegel unter das b. Welchen Buchstaben siehst du im Spiegel?"
                show: { drawn: letter-card, text: "b" }
                options: ["p", "d", "q"]
                answer: "p"
                option_audio: false
                difficulty: stretch
              - id: l1-n5
                type: true_false
                text: "Zwei Vierteldrehungen sind zusammen eine halbe Drehung."
                say: "Stimmt das? Zwei Vierteldrehungen sind zusammen eine halbe Drehung."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Du drehst das u eine halbe Drehung. Welcher Buchstabe entsteht?"
            say: "Du drehst das u eine halbe Drehung. Welcher Buchstabe entsteht?"
            show: { drawn: letter-card, text: "u" }
            options: ["n", "u", "v"]
            answer: "n"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Du spiegelst das d an einem Spiegel daneben. Welcher Buchstabe entsteht?"
            say: "Du hältst das d an einen Spiegel, der daneben steht. Welchen Buchstaben siehst du im Spiegel?"
            show: { drawn: letter-card, text: "d" }
            options: ["b", "p", "q"]
            answer: "b"
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "Du drehst die Karte mit 86 eine halbe Drehung. Welche Zahl siehst du?"
            say: "Du drehst eine Karte mit der Zahl sechsundachtzig eine halbe Drehung. Welche Zahl siehst du?"
            show: { drawn: letter-card, text: "86" }
            options: ["98", "89", "68"]
            answer: "98"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Du drehst das liegende Rechteck eine halbe Drehung. Wie liegt es danach?"
            say: "Du drehst das liegende Rechteck eine halbe Drehung. Wie liegt es danach?"
            show: { drawn: shape, kind: rectangle, colour: green }
            options: ["Es liegt wie vorher.", "Es steht hochkant."]
            answer: "Es liegt wie vorher."
            keep_order: true
          - id: l1-c5
            type: multiple_choice
            text: "Du drehst die Karte mit 66 eine halbe Drehung. Welche Zahl siehst du?"
            say: "Du drehst eine Karte mit der Zahl sechsundsechzig eine halbe Drehung. Welche Zahl siehst du?"
            show: { drawn: letter-card, text: "66" }
            options: ["66", "99", "96"]
            answer: "99"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Eine halbe Drehung macht aus dem d ein b."
            say: "Stimmt das? Eine halbe Drehung macht aus dem d ein b."
            show: { drawn: letter-card, text: "d" }
            answer: false

  - n: 2
    title: { de: "Den Würfel kippen", en: "Tipping a dice" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Du drehst die 9 eine halbe Drehung. Welche Zahl entsteht?"
            say: "Du drehst die Karte mit der Neun eine halbe Drehung. Welche Zahl siehst du?"
            show: { drawn: letter-card, text: "9" }
            options: ["6", "9"]
            answer: "6"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Eine Vierteldrehung ist so weit wie der große Uhrzeiger von 12 bis 3."
            say: "Stimmt das? Eine Vierteldrehung ist so weit wie der große Uhrzeiger von zwölf bis drei."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Gegenüber ergeben die Augen zusammen 7."
            say: "Auf einem Spielwürfel ergeben die Augen auf zwei gegenüberliegenden Seiten immer sieben. Liegt die Eins oben, liegt die Sechs unten. Gegenüber der Zwei ist die Fünf, gegenüber der Drei die Vier."
            show: { drawn: dots, count: 1, layout: dice }
          - text: "1 oben, 2 vorn. Nach vorn kippen: Die 5 kommt nach oben."
            say: "Der Würfel liegt mit der Eins oben, die Zwei zeigt zu dir. Kippst du ihn nach vorn zu dir, rollt die Eins nach vorn und die Zwei nach unten. Oben ist jetzt die Seite, die vorher hinten war. Hinten war die Fünf, denn sie liegt gegenüber der Zwei."
          - text: "Flach auf dem Tisch drehen: Oben bleibt oben."
            say: "Drehst du den Würfel flach auf dem Tisch, ohne ihn zu kippen, bleibt die Zahl oben dieselbe. Nur die Seiten wandern weiter."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Oben liegt die 3. Welche Zahl liegt unten?"
                say: "Auf dem Würfel liegt die Drei oben. Welche Zahl liegt unten?"
                show: { drawn: dots, count: 3, layout: dice }
                options: ["4", "3", "6"]
                answer: "4"
                hints:
                  - "Gegenüberliegende Seiten ergeben zusammen 7."
                  - "3 + _ = 7"
                  - "4."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "1 oben, 2 vorn. Du kippst den Würfel nach vorn zu dir. Welche Zahl ist jetzt oben?"
                say: "Der Würfel liegt mit der Eins oben, die Zwei zeigt zu dir. Du kippst ihn nach vorn zu dir. Welche Zahl ist jetzt oben?"
                options: ["5", "2", "6"]
                answer: "5"
                feedback:
                  "2": "Die 2 war vorn. Beim Kippen nach vorn rollt sie nach unten. Oben kommt die Seite an, die hinten war."
                  "6": "Die 6 war unten. Sie rollt nach hinten. Oben kommt die Seite an, die hinten war."
                hints:
                  - "Welche Seite war hinten?"
                  - "Hinten liegt gegenüber der 2. 2 + _ = 7"
                  - "5."
              - id: l2-f3
                type: true_false
                text: "Du drehst den Würfel flach auf dem Tisch. Die Zahl oben bleibt gleich."
                say: "Stimmt das? Du drehst den Würfel flach auf dem Tisch, ohne ihn zu kippen. Die Zahl oben bleibt gleich."
                answer: true
                hints:
                  - "Wird der Würfel dabei umgekippt?"
                  - "Die obere Seite bleibt oben, nur die Seiten wandern weiter."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: multiple_choice
                text: "1 oben, 2 vorn. Du kippst den Würfel nach hinten, weg von dir. Welche Zahl ist oben?"
                say: "Der Würfel liegt mit der Eins oben, die Zwei zeigt zu dir. Du kippst ihn nach hinten, weg von dir. Welche Zahl ist jetzt oben?"
                options: ["2", "5", "6"]
                answer: "2"
                hints:
                  - "Beim Kippen nach hinten rollt die obere Seite nach hinten."
                  - "Die Seite, die vorn war, kommt nach oben."
                  - "2."
              - id: l2-f5
                type: multiple_choice
                text: "Oben liegt die 4. Du kippst den Würfel zweimal nach vorn. Welche Zahl ist oben?"
                say: "Auf dem Würfel liegt die Vier oben. Du kippst ihn zweimal hintereinander nach vorn. Welche Zahl ist jetzt oben?"
                options: ["3", "4", "1"]
                answer: "3"
                hints:
                  - "Nach zweimal Kippen in dieselbe Richtung liegt der Würfel auf dem Kopf."
                  - "Oben ist jetzt die Seite, die vorher unten war. Unten war die Seite gegenüber der 4."
                  - "3."
                difficulty: stretch

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Oben liegt die 5. Welche Zahl liegt unten?"
                say: "Auf dem Würfel liegt die Fünf oben. Welche Zahl liegt unten?"
                show: { drawn: dots, count: 5, layout: dice }
                options: ["2", "5", "1"]
                answer: "2"
                hints: ["Oben und unten ergeben zusammen 7."]
              - id: l2-s2
                type: multiple_choice
                text: "1 oben, 3 rechts. Du kippst den Würfel nach rechts. Welche Zahl ist oben?"
                say: "Der Würfel liegt mit der Eins oben, die Drei zeigt nach rechts. Du kippst ihn nach rechts. Welche Zahl ist jetzt oben?"
                options: ["4", "3", "6"]
                answer: "4"
                hints: ["Beim Kippen nach rechts kommt die linke Seite nach oben. Was liegt gegenüber der 3?"]
              - id: l2-s3
                type: true_false
                text: "Auf einem Spielwürfel liegt die 6 gegenüber der 1."
                say: "Stimmt das? Auf einem Spielwürfel liegt die Sechs gegenüber der Eins."
                answer: true
                hints: ["Ergeben die beiden zusammen 7?"]
              - id: l2-s4
                type: multiple_choice
                text: "6 oben, 3 vorn. Du kippst den Würfel nach hinten. Welche Zahl ist oben?"
                say: "Der Würfel liegt mit der Sechs oben, die Drei zeigt zu dir. Du kippst ihn nach hinten, weg von dir. Welche Zahl ist jetzt oben?"
                options: ["3", "4", "1"]
                answer: "3"
                hints: ["Beim Kippen nach hinten kommt die vordere Seite nach oben."]
              - id: l2-s5
                type: multiple_choice
                text: "Oben liegt die 2. Du drehst den Würfel eine Vierteldrehung flach auf dem Tisch. Welche Zahl ist oben?"
                say: "Auf dem Würfel liegt die Zwei oben. Du drehst ihn eine Vierteldrehung flach auf dem Tisch. Welche Zahl ist jetzt oben?"
                options: ["2", "5", "3"]
                answer: "2"
                hints: ["Wird der Würfel dabei gekippt?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Oben liegt die 6. Welche Zahl liegt unten?"
                say: "Auf dem Würfel liegt die Sechs oben. Welche Zahl liegt unten?"
                show: { drawn: dots, count: 6, layout: dice }
                options: ["1", "6", "2"]
                answer: "1"
              - id: l2-n2
                type: multiple_choice
                text: "1 oben, 2 vorn. Du kippst den Würfel zweimal nach vorn. Welche Zahl ist oben?"
                say: "Der Würfel liegt mit der Eins oben, die Zwei zeigt zu dir. Du kippst ihn zweimal hintereinander nach vorn. Welche Zahl ist jetzt oben?"
                options: ["6", "1", "5"]
                answer: "6"
              - id: l2-n3
                type: multiple_choice
                text: "1 oben, 3 rechts. Du kippst den Würfel nach links. Welche Zahl ist oben?"
                say: "Der Würfel liegt mit der Eins oben, die Drei zeigt nach rechts. Du kippst ihn nach links. Welche Zahl ist jetzt oben?"
                options: ["3", "4", "1"]
                answer: "3"
              - id: l2-n4
                type: true_false
                text: "Liegt die 2 oben, liegt die 4 unten."
                say: "Stimmt das? Liegt auf einem Spielwürfel die Zwei oben, liegt die Vier unten."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "5 oben, 1 vorn. Du kippst den Würfel nach vorn. Welche Zahl ist oben?"
                say: "Der Würfel liegt mit der Fünf oben, die Eins zeigt zu dir. Du kippst ihn nach vorn zu dir. Welche Zahl ist jetzt oben?"
                options: ["6", "1", "2"]
                answer: "6"

      - activity: check
        size: skill
        draw: 5
        tasks:
