# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.order-to-10000
skill: math.large-numbers.order-to-10000
curriculum: de-DE
language: de
title:
  de: Ordnen, vergleichen und runden bis 10 000
  en: Ordering, comparing and rounding to 10 000
summary: >
  Numbers to 10 000 on the Zahlenstrahl, compared from the left and
  rounded. Lesson 1 finds and reads numbers on lines in thousands and in
  hundreds; lesson 2 compares and orders; lesson 3 rounds to tens,
  hundreds and thousands, and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Zahlen bis 10 000, en: Numbers to 10 000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.to-10000, math.numbers-to-1000.round]
  also_practises: [math.numbers-to-1000.order-compare]
  vocabulary: { de: [Zahlenstrahl, Schritt, größer als, kleiner als, runden, Nachbartausender] }
  forms: [drawn, text, audio]
  drawn: [number-line, place-value-chart]
  facets: [operation-signs]
  misconceptions:
    - id: step-size
      what: Reads each tick as one hundred on a line in thousands
      addressed: lesson 1 Learn asks for the step of every line; feedback on wrong-step readings names the step
    - id: digit-count
      what: Compares 999 and 1000 by the size of the first digit
      addressed: lesson 2 Learn says that a number with more digits is greater, then compares from the left
    - id: rounding-digit
      what: Uses the wrong digit to decide when rounding to thousands
      addressed: lesson 3 Learn names the deciding digit for each kind of rounding; tasks round one number three ways
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Der Zahlenstrahl bis 10 000, en: The number line to 10 000 }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: point_on_line
            text: "Wo ist 600?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
            answer: 600
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "4000, 5000, 6000, _"
            options: ["6100", "7000", "6001"]
            answer: "7000"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "0 bis 10 000"
            say: "Der Zahlenstrahl bis zehntausend. Zehn Schritte, also ist ein Schritt tausend."
            show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
          - text: "3000 bis 4000"
            say: "Ein Ausschnitt von dreitausend bis viertausend. Hier ist ein Schritt hundert: dreitausendeinhundert, dreitausendzweihundert, und so weiter."
            show: { drawn: number-line, from: 3000, to: 4000, step: 100, labels: ends }
          - text: "3700"
            say: "Der Pfeil zeigt sieben Schritte nach dreitausend: dreitausendsiebenhundert. Frag dich immer zuerst, wie groß ein Schritt ist."
            show: { drawn: number-line, from: 3000, to: 4000, step: 100, labels: ends, mark: 3700 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: point_on_line
                text: "Wo ist 4000?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
                answer: 4000
                hints:
                  - "Ein Schritt ist tausend."
                  - "Zähl: tausend, zweitausend, ..."
                  - "4000 ist der vierte Strich nach der Null."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 5000, to: 6000, step: 100, labels: ends, mark: 5300 }
                options: ["5003", "5030", "5300"]
                answer: "5300"
                feedback:
                  "5003": "Ein Schritt ist hier hundert, nicht eins."
                  "5030": "Ein Schritt ist hier hundert, nicht zehn."
                hints:
                  - "Wie groß ist ein Schritt?"
                  - "Von 5000 bis 6000 in zehn Schritten: ein Schritt ist hundert."
                  - "Drei Schritte: 5300."
              - id: l1-f3
                type: point_on_line
                text: "Wo ist 2500?"
                show: { drawn: number-line, from: 2000, to: 3000, step: 100, labels: ends }
                answer: 2500
                hints:
                  - "2500 liegt genau zwischen 2000 und 3000."
                  - "Ein Schritt ist hundert. Zähl von 2000 aus fünf Schritte weiter."
                  - "Tipp auf den fünften Strich nach 2000, in der Mitte."
              - id: l1-f4
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends, mark: 8000 }
                options: ["800", "8000", "80"]
                answer: "8000"
                feedback:
                  "800": "Ein Schritt ist hier tausend, nicht hundert."
                hints:
                  - "Ein Schritt ist tausend."
                  - "Zähl die Schritte bis zum Pfeil."
                  - "Acht Schritte: 8000."
              - id: l1-f5
                type: fill_in_blank
                text: "Zwischen welchen Tausendern liegt 6750?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends, mark: 6750 }
                frame: "6750 liegt zwischen _ und _"
                options: ["5000", "6000", "7000", "8000"]
                answer: ["6000", "7000"]
                hints:
                  - "6750 hat 6 Tausender."
                  - "Davor 6000, danach 7000."
                  - "Zwischen 6000 und 7000."
              - id: l1-f6
                type: point_on_line
                text: "Wo ist 7900?"
                show: { drawn: number-line, from: 7000, to: 8000, step: 100, labels: ends }
                answer: 7900
                hints:
                  - "7900 ist nah an 8000."
                  - "Ein Schritt vor 8000."
                  - "Der Strich vor 8000."

          - support: some
            tasks:
              - id: l1-s1
                type: point_on_line
                text: "Wo ist 9000?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
                answer: 9000
                hints: ["Ein Schritt vor 10 000."]
              - id: l1-s2
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 1000, to: 2000, step: 100, labels: ends, mark: 1600 }
                options: ["1006", "1060", "1600"]
                answer: "1600"
                hints: ["Ein Schritt ist hundert."]
              - id: l1-s3
                type: point_on_line
                text: "Wo ist 4200?"
                show: { drawn: number-line, from: 4000, to: 5000, step: 100, labels: ends }
                answer: 4200
                hints: ["Fang bei 4000 an."]
              - id: l1-s4
                type: fill_in_blank
                text: "Zwischen welchen Tausendern liegt 3080?"
                frame: "3080 liegt zwischen _ und _"
                options: ["2000", "3000", "4000", "5000"]
                answer: ["3000", "4000"]
                hints: ["3080 hat 3 Tausender."]
              - id: l1-s5
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 6000, to: 7000, step: 100, labels: ends, mark: 6500 }
                options: ["6500", "6050", "6005"]
                answer: "6500"
                hints: ["Genau in der Mitte."]
              - id: l1-s6
                type: point_on_line
                text: "Wo ist 1000?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
                answer: 1000
                hints: ["Der erste Schritt nach 0."]

          - support: none
            tasks:
              - id: l1-n1
                type: point_on_line
                text: "Wo ist 6000?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
                answer: 6000
              - id: l1-n2
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 8000, to: 9000, step: 100, labels: ends, mark: 8800 }
                options: ["8008", "8080", "8800"]
                answer: "8800"
              - id: l1-n3
                type: point_on_line
                text: "Wo ist 5100?"
                show: { drawn: number-line, from: 5000, to: 6000, step: 100, labels: ends }
                answer: 5100
              - id: l1-n4
                type: fill_in_blank
                text: "Zwischen welchen Tausendern liegt 9450?"
                frame: "9450 liegt zwischen _ und _"
                options: ["8000", "9000", "10 000", "9500"]
                answer: ["9000", "10 000"]
              - id: l1-n5
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends, mark: 3000 }
                options: ["300", "3000", "30"]
                answer: "3000"
              - id: l1-n6
                type: point_on_line
                text: "Wo ist 2300?"
                show: { drawn: number-line, from: 2000, to: 3000, step: 100, labels: ends }
                answer: 2300

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: point_on_line
            text: "Wo ist 7000?"
            show: { drawn: number-line, from: 0, to: 10000, step: 1000, labels: ends }
            answer: 7000
          - id: l1-c2
            type: multiple_choice
            text: "Wohin zeigt der Pfeil?"
            show: { drawn: number-line, from: 4000, to: 5000, step: 100, labels: ends, mark: 4700 }
            options: ["4007", "4070", "4700"]
            answer: "4700"
          - id: l1-c3
            type: point_on_line
            text: "Wo ist 1800?"
            show: { drawn: number-line, from: 1000, to: 2000, step: 100, labels: ends }
            answer: 1800

  - n: 2
    title: { de: Vergleichen und ordnen, en: Comparing and ordering }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            frame: "582 _ 528"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viel ist die 6 in 6213 wert?"
            options: ["60", "600", "6000"]
            answer: "6000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "999 < 1000"
            say: "Eine Zahl mit mehr Stellen ist größer. Neunhundertneunundneunzig hat drei Stellen, tausend hat vier. Also ist tausend größer."
          - text: "4281 und 4218"
            say: "Haben beide Zahlen gleich viele Stellen, vergleichen wir von links. Die Tausender sind gleich, die Hunderter auch. Bei den Zehnern: acht ist mehr als eins."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [4, 2, 8, 1] }
          - text: "4281 > 4218"
            say: "Also ist viertausendzweihunderteinundachtzig größer als viertausendzweihundertachtzehn."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [4, 2, 1, 8] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "999 _ 1001"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "Neun ist eine große Ziffer, aber 1001 hat vier Stellen. Mehr Stellen heißt größer."
                hints:
                  - "Wie viele Stellen hat jede Zahl?"
                  - "999 hat drei Stellen, 1001 hat vier."
                  - "999 ist kleiner als 1001."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "6512 _ 6152"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Die Tausender sind gleich."
                  - "Vergleiche die Hunderter: 5 und 1."
                  - "6512 ist größer als 6152."
              - id: l2-f3
                type: ordering
                text: "Ordne die Zahlen. Die kleinste zuerst."
                options: ["3050", "3500", "3005", "5300"]
                slot_count: 4
                answer: ["3005", "3050", "3500", "5300"]
                hints:
                  - "Welche Zahlen haben 3 Tausender?"
                  - "Bei 3005, 3050, 3500 entscheiden die Hunderter, dann die Zehner."
                  - "3005, 3050, 3500, 5300."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 7089 > 7098"
                say: "Siebentausendneunundachtzig ist größer als siebentausendachtundneunzig. Stimmt das?"
                answer: false
                hints:
                  - "Tausender und Hunderter sind gleich."
                  - "Zehner: 8 und 9."
                  - "Nein, 7089 ist kleiner."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Zahl ist am größten?"
                options: ["8999", "9008", "9080"]
                answer: "9080"
                hints:
                  - "Welche Zahl hat die meisten Tausender?"
                  - "9008 und 9080: Vergleiche die Zehner."
                  - "9080 ist am größten."
              - id: l2-f6
                type: fill_in_blank
                text: "Welche Zahl passt?"
                frame: "_ < 4000"
                options: ["4001", "3999", "4100"]
                answer: ["3999"]
                hints:
                  - "Die Zahl muss kleiner sein als 4000."
                  - "Weniger als 4 Tausender."
                  - "3999."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "2470 _ 2740"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Vergleiche die Hunderter."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "5000 + 300 _ 5300"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Rechne zuerst links."]
              - id: l2-s3
                type: ordering
                text: "Ordne die Zahlen. Die größte zuerst."
                options: ["1999", "9119", "9191", "1919"]
                slot_count: 4
                answer: ["9191", "9119", "1999", "1919"]
                hints: ["Von links vergleichen."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 10 000 > 9999"
                say: "Zehntausend ist größer als neuntausendneunhundertneunundneunzig. Stimmt das?"
                answer: true
                hints: ["Mehr Stellen."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Zahl ist am kleinsten?"
                options: ["4044", "4404", "4440"]
                answer: "4044"
                hints: ["Vergleiche die Hunderter."]
              - id: l2-s6
                type: fill_in_blank
                text: "Welche Zahl passt?"
                frame: "_ > 6990"
                options: ["6909", "6099", "7000"]
                answer: ["7000"]
                hints: ["Mehr als 6990."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "8303 _ 8330"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Ordne die Zahlen. Die kleinste zuerst."
                options: ["6006", "660", "6060", "6600"]
                slot_count: 4
                answer: ["660", "6006", "6060", "6600"]
              - id: l2-n3
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "1205 _ 1250"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 3456 < 3465"
                say: "Dreitausendvierhundertsechsundfünfzig ist kleiner als dreitausendvierhundertfünfundsechzig. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welche Zahl ist am größten?"
                options: ["7770", "7707", "7077"]
                answer: "7770"
              - id: l2-n6
                type: fill_in_blank
                text: "Welche Zahl passt?"
                frame: "_ < 2100"
                options: ["2101", "2010", "2110"]
                answer: ["2010"]

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            frame: "4090 _ 4009"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
          - id: l2-c2
            type: ordering
            text: "Ordne die Zahlen. Die kleinste zuerst."
            options: ["2828", "8282", "2882", "8228"]
            slot_count: 4
            answer: ["2828", "2882", "8228", "8282"]
          - id: l2-c3
            type: multiple_choice
            text: "Welche Zahl ist am kleinsten?"
            options: ["5150", "5105", "5510"]
            answer: "5105"

  - n: 3
    title: { de: Runden bis 10 000, en: Rounding to 10 000 }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Runde 471 auf Hunderter."
            options: ["400", "470", "500"]
            answer: "500"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "Runde 645 auf Zehner."
            options: ["640", "650", "600"]
            answer: "650"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3720 ≈ 4000"
            say: "Auf Tausender runden: Dreitausendsiebenhundertzwanzig liegt zwischen dreitausend und viertausend, näher an viertausend."
            show: { drawn: number-line, from: 3000, to: 4000, step: 100, labels: ends, mark: 3720 }
          - text: "Die Hunderterziffer entscheidet"
            say: "Beim Runden auf Tausender entscheidet die Hunderterziffer: null bis vier abrunden, fünf bis neun aufrunden. Bei dreitausendsiebenhundertzwanzig ist sie sieben: aufrunden."
          - text: "3720: 3720, 3700, 4000"
            say: "Eine Zahl, dreimal gerundet: auf Zehner dreitausendsiebenhundertzwanzig, sie bleibt gleich. Auf Hunderter dreitausendsiebenhundert. Auf Tausender viertausend. Immer entscheidet die Ziffer rechts von der Stelle, auf die du rundest."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Runde 5300 auf Tausender."
                show: { drawn: number-line, from: 5000, to: 6000, step: 100, labels: ends, mark: 5300 }
                options: ["5000", "6000", "5300"]
                answer: "5000"
                hints:
                  - "Welche Tausender liegen neben 5300?"
                  - "5000 und 6000. 5300 ist näher an 5000."
                  - "5300 gerundet ist 5000."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "Runde 2650 auf Tausender."
                options: ["2000", "3000", "2700"]
                answer: "3000"
                feedback:
                  "2700": "Das ist auf Hunderter gerundet. Auf Tausender entscheidet die Hunderterziffer."
                hints:
                  - "Die Hunderterziffer entscheidet."
                  - "Sie ist 6: aufrunden."
                  - "2650 gerundet ist 3000."
              - id: l3-f3
                type: fill_in_blank
                text: "Runde 8461 auf Zehner, Hunderter und Tausender."
                frame: "Zehner: _  Hunderter: _  Tausender: _"
                options: ["8000", "8460", "8500", "8470"]
                answer: ["8460", "8500", "8000"]
                hints:
                  - "Auf Zehner entscheidet die Einerziffer 1."
                  - "Auf Hunderter die Zehnerziffer 6, auf Tausender die Hunderterziffer 4."
                  - "8460, 8500, 8000."
              - id: l3-f4
                type: true_false
                text: "Stimmt das? 7500 auf Tausender gerundet ist 8000."
                answer: true
                hints:
                  - "7500 liegt genau in der Mitte."
                  - "Bei 5 runden wir auf."
                  - "Ja."
              - id: l3-f5
                type: text_input
                text: "Runde 4980 auf Hunderter."
                answer: "5000"
                hints:
                  - "Die Nachbarhunderter sind 4900 und 5000."
                  - "Die Zehnerziffer ist 8: aufrunden."
                  - "4980 gerundet ist 5000."
              - id: l3-f6
                type: multiple_choice
                text: "Welche Zahl ergibt auf Tausender gerundet 6000?"
                options: ["5400", "6600", "5700"]
                answer: "5700"
                hints:
                  - "Die Zahl muss näher an 6000 liegen als an anderen Tausendern."
                  - "5400 wird 5000, 6600 wird 7000."
                  - "5700 wird 6000."

          - support: some
            tasks:
              - id: l3-s1
                type: multiple_choice
                text: "Runde 1200 auf Tausender."
                options: ["1000", "2000", "1200"]
                answer: "1000"
                hints: ["Die Hunderterziffer ist 2."]
              - id: l3-s2
                type: multiple_choice
                text: "Runde 9520 auf Tausender."
                options: ["9000", "10 000", "9500"]
                answer: "10 000"
                hints: ["Die Hunderterziffer ist 5."]
              - id: l3-s3
                type: fill_in_blank
                text: "Runde 3049 auf Zehner, Hunderter und Tausender."
                frame: "Zehner: _  Hunderter: _  Tausender: _"
                options: ["3000", "3050", "3040", "3100"]
                answer: ["3050", "3000", "3000"]
                hints: ["Für jede Rundung eine andere Ziffer."]
              - id: l3-s4
                type: true_false
                text: "Stimmt das? 6449 auf Hunderter gerundet ist 6500."
                answer: false
                hints: ["Die Zehnerziffer ist 4."]
              - id: l3-s5
                type: text_input
                text: "Runde 2875 auf Zehner."
                answer: "2880"
                hints: ["Bei 5 aufrunden."]
              - id: l3-s6
                type: multiple_choice
                text: "Welche Zahl ergibt auf Tausender gerundet 2000?"
                options: ["2600", "1400", "2300"]
                answer: "2300"
                hints: ["Die Hunderterziffer muss klein sein, oder die Zahl liegt kurz vor 2000."]

          - support: none
            tasks:
              - id: l3-n1
                type: multiple_choice
                text: "Runde 7800 auf Tausender."
                options: ["7000", "8000", "7800"]
                answer: "8000"
              - id: l3-n2
                type: text_input
                text: "Runde 5555 auf Hunderter."
                answer: "5600"
              - id: l3-n3
                type: fill_in_blank
                text: "Runde 6214 auf Zehner, Hunderter und Tausender."
                frame: "Zehner: _  Hunderter: _  Tausender: _"
                options: ["6000", "6200", "6210", "6220"]
                answer: ["6210", "6200", "6000"]
              - id: l3-n4
                type: true_false
                text: "Stimmt das? 499 auf Tausender gerundet ist 0."
                answer: true
              - id: l3-n5
                type: text_input
                text: "Runde 8096 auf Zehner."
                answer: "8100"
              - id: l3-n6
                type: multiple_choice
                text: "Welche Zahl ergibt auf Tausender gerundet 9000?"
                options: ["8400", "9600", "8550"]
                answer: "8550"

      - activity: check
        size: skill
        tasks:
          - id: l3-c1
