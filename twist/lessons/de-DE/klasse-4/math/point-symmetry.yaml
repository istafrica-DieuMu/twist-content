# Lesson set: Mathe, Klasse 4, Erweiterung. Hand-authored draft.
id: de-DE.math.point-symmetry
skill: math.symmetry.point-symmetry
curriculum: de-DE
language: de
title:
  de: Punktsymmetrie
  en: Rotational symmetry
summary: >
  Lesson 1 learns that a figure is punktsymmetrisch when it looks the same
  after a half turn about its centre, and checks letters, digits and short
  words (N, S, Z, H, X, 8, 69, SOS ja; A, T, M, 6 nein), keeping it apart
  from having a Symmetrieachse; lesson 2 checks shapes (Rechteck, Quadrat,
  Kreis, Sechseck, schiefes Parallelogramm ja; Dreieck nein), sorts
  letters, and ends with the skill check. Turning a drawn figure on screen
  to check waits for a rotate task.
metadata:
  year: klasse-4
  topic: { de: Symmetrie, en: Symmetry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.symmetry.several-axes, math.space.mental-moves]
  also_practises: [math.space.mental-moves]
  vocabulary: { de: [punktsymmetrisch, halbe Drehung, Symmetriezentrum, Symmetrieachse, Parallelogramm] }
  forms: [text, audio, picture, drawn]
  drawn: [letter-card, shape]
  facets: []
  parts:
    - { id: letters, what: { de: "punktsymmetrische Buchstaben, Ziffern und Wörter erkennen", en: "recognising letters, digits and words with rotational symmetry" } }
    - { id: shapes, what: { de: punktsymmetrische Figuren erkennen, en: recognising shapes with rotational symmetry } }
    - { id: axis, what: { de: Punktsymmetrie und Achsensymmetrie unterscheiden, en: telling rotational symmetry apart from line symmetry } }
  misconceptions:
    - id: axis-means-point-symmetric
      what: Thinks every figure with a Symmetrieachse is also punktsymmetrisch (A, T, the triangle)
      addressed: lesson 1 Learn turns the A upside down; l1-f2 and l2-f2 ask about the T and the triangle with feedback, l1-s5, l1-c3, l2-n2 and l2-c3 ask about letters or shapes with an axis that are not punktsymmetrisch
    - id: no-axis-no-symmetry
      what: Thinks a figure without a Symmetrieachse cannot be symmetric at all (N, S, Z, a schiefes Parallelogramm)
      addressed: lesson 1 Learn shows N, S and Z; l1-f1 asks about the Z with feedback, l1-n5, l2-f4, l2-s3, l2-n4 and l2-c16 ask about figures without an axis
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gleich nach einer halben Drehung", en: "The same after a half turn" }
    goal:
      de: "Dreh Buchstaben und Zahlen im Kopf eine halbe Drehung. Sieht die 8 danach gleich aus, ist sie punktsymmetrisch."
      en: "Turn letters and numbers a half turn in your head. If the 8 looks the same afterwards, it has rotational symmetry."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Du drehst das b eine halbe Drehung. Welcher Buchstabe entsteht?"
            say: "Du drehst das b eine halbe Drehung. Welcher Buchstabe entsteht?"
            show: { drawn: letter-card, text: "b" }
            options: ["q", "d", "p"]
            answer: "q"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Symmetrieachsen hat das H?"
            say: "Wie viele Symmetrieachsen hat das H?"
            show: { drawn: letter-card, text: "H" }
            options: ["2", "1", "0"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was glaubst du? Du drehst das S eine halbe Drehung, so dass oben unten ist. Sieht es dann anders aus?"
            say: "Du drehst das S eine halbe Drehung um seine Mitte, so dass oben unten ist. Was glaubst du: Sieht es dann anders aus?"
            show: { drawn: letter-card, text: "S" }
          - text: "punktsymmetrisch"
            say: "Nein, es sieht genauso aus wie vorher! Eine Figur, die nach einer halben Drehung gleich aussieht, heißt punktsymmetrisch. Der Punkt in der Mitte, um den du drehst, heißt Symmetriezentrum."
            show: { drawn: letter-card, text: "S" }
          - text: "Keine Achse, aber punktsymmetrisch"
            say: "Das N, das S und das Z haben keine Symmetrieachse. Trotzdem sind sie punktsymmetrisch. Nach einer halben Drehung passen sie wieder genau auf sich selbst."
            show: { drawn: letter-card, text: "N S Z" }
          - text: "Eine Achse, aber nicht punktsymmetrisch"
            say: "Das A hat eine Symmetrieachse. Dreh es eine halbe Drehung, dann steht es auf dem Kopf, die Spitze zeigt nach unten. Das A ist nicht punktsymmetrisch."
            show: { drawn: letter-card, text: "A" }
          - text: "Wusstest du? Auf vielen Spielkarten ist der König zweimal gemalt, oben und unten. Die untere Hälfte ist die obere, nur eine halbe Drehung gedreht."
            say: "Wusstest du? Auf vielen Spielkarten ist der König zweimal gemalt, einmal oben und einmal unten. Die untere Hälfte ist genau die obere, nur eine halbe Drehung gedreht. Die Karte ist punktsymmetrisch. So steht der König immer richtig herum, egal wie du die Karte hältst!"
            show: { object: crown }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Ist das Z punktsymmetrisch?"
                say: "Dreh das Z in Gedanken eine halbe Drehung. Ist es punktsymmetrisch?"
                show: { drawn: letter-card, text: "Z" }
                answer: true
                feedback:
                  "false": "Das Z hat keine Symmetrieachse. Dreh es aber eine halbe Drehung: Der obere Strich kommt nach unten, der untere nach oben. Es ist wieder ein Z."
                hints:
                  - "Dreh, statt zu falten."
                  - "Der obere Strich kommt nach unten und der untere nach oben. Der Schrägstrich bleibt schräg."
                  - "Ja, das Z ist punktsymmetrisch."
              - id: l1-f2
                type: true_false
                text: "Ist das T punktsymmetrisch?"
                say: "Dreh das T in Gedanken eine halbe Drehung. Ist es punktsymmetrisch?"
                show: { drawn: letter-card, text: "T" }
                answer: false
                feedback:
                  "true": "Das T hat eine Symmetrieachse. Nach einer halben Drehung ist der Balken aber unten. Das sieht anders aus."
                hints:
                  - "Wo ist der Balken nach der Drehung?"
                  - "Der Balken war oben und ist jetzt unten."
                  - "Nein, das T ist nicht punktsymmetrisch."
              - id: l1-f3
                type: multiple_choice
                text: "Welcher Buchstabe ist punktsymmetrisch?"
                say: "Welcher Buchstabe ist punktsymmetrisch?"
                options: ["N", "A", "E"]
                answer: "N"
                option_audio: false
                hints:
                  - "Dreh jeden Buchstaben in Gedanken eine halbe Drehung."
                  - "A steht dann auf dem Kopf, beim E zeigen die Arme nach links."
                  - "N."
              - id: l1-f4
                type: true_false
                text: "Ist die 8 punktsymmetrisch?"
                say: "Dreh die Acht in Gedanken eine halbe Drehung. Ist sie punktsymmetrisch?"
                show: { drawn: letter-card, text: "8" }
                answer: true
                hints:
                  - "Was kommt nach der Drehung nach oben?"
                  - "Der untere Kreis kommt nach oben, der obere nach unten."
                  - "Ja, die 8 ist punktsymmetrisch."
                difficulty: easy
              - id: l1-f5
                type: multiple_choice
                text: "Was bedeutet punktsymmetrisch?"
                say: "Was bedeutet punktsymmetrisch?"
                options: ["Nach einer halben Drehung sieht die Figur gleich aus.", "Die Figur hat eine Symmetrieachse.", "Nach einer Vierteldrehung sieht die Figur gleich aus."]
                answer: "Nach einer halben Drehung sieht die Figur gleich aus."
                hints:
                  - "Beim Punktsymmetrischen drehst du, statt zu falten."
                  - "Gedreht wird so weit, bis oben unten ist."
                  - "Nach einer halben Drehung sieht die Figur gleich aus."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Ist das H punktsymmetrisch?"
                say: "Dreh das H in Gedanken eine halbe Drehung. Ist es punktsymmetrisch?"
                show: { drawn: letter-card, text: "H" }
                answer: true
                hints: ["Was kommt nach der Drehung nach oben, was nach links?"]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Buchstabe ist nicht punktsymmetrisch?"
                say: "Welcher Buchstabe ist nicht punktsymmetrisch?"
                options: ["U", "S", "X"]
                answer: "U"
                option_audio: false
                hints: ["Wo ist der Bogen vom U nach einer halben Drehung?"]
              - id: l1-s3
                type: true_false
                text: "Ist die 6 punktsymmetrisch?"
                say: "Dreh die Sechs in Gedanken eine halbe Drehung. Ist sie punktsymmetrisch?"
                show: { drawn: letter-card, text: "6" }
                answer: false
                hints: ["Was wird aus der 6 nach einer halben Drehung?"]
              - id: l1-s4
                type: multiple_choice
                text: "Auf einer Karte steht SOS. Du drehst sie eine halbe Drehung. Was steht dann da?"
                say: "Auf einer Karte steht SOS. Du drehst die Karte eine halbe Drehung. Was steht dann da?"
                show: { drawn: letter-card, text: "SOS" }
                options: ["SOS", "OSO", "ZOZ"]
                answer: "SOS"
                option_audio: false
                feedback:
                  "ZOZ": "ZOZ klingt nach einem Außerirdischen! Aber ein S bleibt nach einer halben Drehung ein S."
                hints: ["S und O sind beide punktsymmetrisch."]
              - id: l1-s5
                type: true_false
                text: "Ist das M punktsymmetrisch?"
                say: "Dreh das M in Gedanken eine halbe Drehung. Ist es punktsymmetrisch?"
                show: { drawn: letter-card, text: "M" }
                answer: false
                hints: ["Welcher Buchstabe entsteht aus dem M bei einer halben Drehung?"]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Ist das X punktsymmetrisch?"
                say: "Ist das X punktsymmetrisch?"
                show: { drawn: letter-card, text: "X" }
                answer: true
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Buchstabe ist punktsymmetrisch?"
                say: "Welcher Buchstabe ist punktsymmetrisch?"
                options: ["S", "B", "K"]
                answer: "S"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Ist die Zahl 88 punktsymmetrisch?"
                say: "Ist die Zahl achtundachtzig punktsymmetrisch?"
                show: { drawn: letter-card, text: "88" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Welche Zahl sieht nach einer halben Drehung gleich aus?"
                say: "Welche Zahlenkarte sieht nach einer halben Drehung genauso aus wie vorher?"
                options: ["69", "66", "99"]
                answer: "69"
                option_audio: false
                difficulty: stretch
              - id: l1-n5
                type: true_false
                text: "Ein Buchstabe ohne Symmetrieachse kann punktsymmetrisch sein."
                say: "Stimmt das? Ein Buchstabe ohne Symmetrieachse kann trotzdem punktsymmetrisch sein."
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Ist das N punktsymmetrisch?"
            say: "Ist das N punktsymmetrisch?"
            show: { drawn: letter-card, text: "N" }
            answer: true
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Buchstabe ist nicht punktsymmetrisch?"
            say: "Welcher Buchstabe ist nicht punktsymmetrisch?"
            options: ["V", "Z", "O"]
            answer: "V"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Jeder Buchstabe mit einer Symmetrieachse ist auch punktsymmetrisch."
            say: "Stimmt das? Jeder Buchstabe mit einer Symmetrieachse ist auch punktsymmetrisch."
            answer: false
          - id: l1-c4
            type: true_false
            text: "Ist das K punktsymmetrisch?"
            say: "Ist das K punktsymmetrisch?"
            show: { drawn: letter-card, text: "K" }
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Welche Ziffer sieht nach einer halben Drehung gleich aus?"
            say: "Welche Ziffer sieht nach einer halben Drehung genauso aus wie vorher?"
            options: ["8", "7", "4"]
            answer: "8"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Das S hat keine Symmetrieachse. Es ist trotzdem punktsymmetrisch."
            say: "Stimmt das? Das S hat keine Symmetrieachse. Es ist trotzdem punktsymmetrisch."
            answer: true

  - n: 2
    title: { de: "Punktsymmetrische Figuren", en: "Shapes with rotational symmetry" }
    goal:
      de: "Prüf, welche Figuren nach einer halben Drehung gleich aussehen. Das Rechteck schafft es, das Dreieck nicht."
      en: "Check which shapes look the same after a half turn. A rectangle does, a triangle does not."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Ist das S punktsymmetrisch?"
            say: "Ist das S punktsymmetrisch?"
            show: { drawn: letter-card, text: "S" }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Buchstabe ist punktsymmetrisch?"
            say: "Welcher Buchstabe ist punktsymmetrisch: Z oder A?"
            options: ["Z", "A"]
            answer: "Z"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was glaubst du? Du drehst ein Rechteck eine halbe Drehung um seine Mitte. Liegt es danach genauso da wie vorher?"
            say: "Du drehst ein Rechteck eine halbe Drehung um seine Mitte. Was glaubst du: Liegt es danach genauso da wie vorher?"
            show: { drawn: shape, kind: rectangle, colour: blue }
          - text: "Rechteck, Quadrat, Kreis: punktsymmetrisch"
            say: "Ja, genau wie vorher! Rechteck, Quadrat und Kreis sind punktsymmetrisch."
            show: { drawn: shape, kind: rectangle, colour: blue }
          - text: "Dreieck: nicht punktsymmetrisch"
            say: "Beim Dreieck zeigt die Spitze nach oben. Nach einer halben Drehung zeigt sie nach unten. Das Dreieck ist nicht punktsymmetrisch, obwohl es Symmetrieachsen hat."
            show: { drawn: shape, kind: triangle, colour: yellow }
          - text: "Schiefes Parallelogramm: keine Achse, aber punktsymmetrisch"
            say: "Ein schiefes Parallelogramm hat keine Symmetrieachse. Dreh es eine halbe Drehung um seine Mitte, dann passt es genau auf sich selbst. Es ist punktsymmetrisch."
            show: { drawn: shape, kind: parallelogram, colour: red }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Ist das Quadrat punktsymmetrisch?"
                say: "Dreh das Quadrat in Gedanken eine halbe Drehung um seine Mitte. Ist es punktsymmetrisch?"
                show: { drawn: shape, kind: square, colour: green }
                answer: true
                hints:
                  - "Liegt es nach der Drehung genau wie vorher?"
                  - "Alle Seiten sind gleich lang, jede Ecke landet auf einer Ecke."
                  - "Ja, das Quadrat ist punktsymmetrisch."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Ist das Dreieck punktsymmetrisch?"
                say: "Dreh das Dreieck in Gedanken eine halbe Drehung um seine Mitte. Ist es punktsymmetrisch?"
                show: { drawn: shape, kind: triangle, colour: purple }
                answer: false
                feedback:
                  "true": "Das Dreieck hat Symmetrieachsen. Nach einer halben Drehung zeigt die Spitze aber nach unten. Es sieht anders aus."
                hints:
                  - "Wohin zeigt die Spitze nach der Drehung?"
                  - "Die Spitze war oben, jetzt ist sie unten."
                  - "Nein, das Dreieck ist nicht punktsymmetrisch."
              - id: l2-f3
                type: image_multiple_choice
                text: "Welche Figur ist nicht punktsymmetrisch?"
                say: "Welche Figur ist nicht punktsymmetrisch?"
                options:
                  - { drawn: shape, kind: rectangle, colour: orange }
                  - { drawn: shape, kind: triangle, colour: orange }
                  - { drawn: shape, kind: circle, colour: orange }
                answer: triangle
                option_audio: false
                hints:
                  - "Dreh jede Figur in Gedanken eine halbe Drehung."
                  - "Bei einer Figur zeigt danach eine Spitze nach unten."
                  - "Das Dreieck."
              - id: l2-f4
                type: true_false
                text: "Ein schiefes Parallelogramm ist punktsymmetrisch."
                say: "Stimmt das? Ein schiefes Parallelogramm ist punktsymmetrisch."
                answer: true
                hints:
                  - "Es hat keine Symmetrieachse. Aber was passiert beim Drehen?"
                  - "Die gegenüberliegenden Seiten sind gleich lang und parallel. Beim Drehen tauschen sie den Platz."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Wo liegt das Symmetriezentrum des Sechsecks?"
                say: "Das Sechseck ist punktsymmetrisch. Wo liegt sein Symmetriezentrum?"
                show: { drawn: shape, kind: hexagon, colour: blue }
                options: ["genau in der Mitte", "an einer Ecke", "in der Mitte einer Seite"]
                answer: "genau in der Mitte"
                hints:
                  - "Um diesen Punkt drehst du die Figur."
                  - "Dreht man um eine Ecke, wandert die Figur weg."
                  - "Genau in der Mitte."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Ist der Kreis punktsymmetrisch?"
                say: "Dreh den Kreis in Gedanken eine halbe Drehung um seinen Mittelpunkt. Ist er punktsymmetrisch?"
                show: { drawn: shape, kind: circle, colour: red }
                answer: true
                hints: ["Sieht ein Kreis nach dem Drehen anders aus?"]
              - id: l2-s2
                type: true_false
                text: "Ist das Sechseck punktsymmetrisch?"
                say: "Dreh das Sechseck in Gedanken eine halbe Drehung um seine Mitte. Ist es punktsymmetrisch?"
                show: { drawn: shape, kind: hexagon, colour: green }
                answer: true
                hints: ["Die Seite oben kommt nach unten. Ist unten auch eine Seite?"]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Figur hat keine Symmetrieachse, ist aber punktsymmetrisch?"
                say: "Welche Figur hat keine Symmetrieachse, ist aber punktsymmetrisch?"
                options: ["ein schiefes Parallelogramm", "ein Quadrat", "ein Dreieck"]
                answer: "ein schiefes Parallelogramm"
                hints: ["Das Quadrat hat vier Achsen, das Dreieck ist nicht punktsymmetrisch."]
              - id: l2-s4
                type: sorting
                text: "Punktsymmetrisch oder nicht?"
                say: "Sortiere die Buchstaben: punktsymmetrisch oder nicht punktsymmetrisch?"
                bins:
                  - { id: point, show: { text: "punktsymmetrisch" }, say: "punktsymmetrisch" }
                  - { id: not-point, show: { text: "nicht punktsymmetrisch" }, say: "nicht punktsymmetrisch" }
                options:
                  - { text: "H", bin: point }
                  - { text: "S", bin: point }
                  - { text: "N", bin: point }
                  - { text: "A", bin: not-point }
                  - { text: "T", bin: not-point }
                  - { text: "E", bin: not-point }
                option_audio: false
                hints: ["Dreh jeden Buchstaben in Gedanken eine halbe Drehung."]
              - id: l2-s5
                type: multiple_choice
                text: "Wann sieht ein Quadrat beim Drehen zum ersten Mal wieder gleich aus?"
                say: "Du drehst ein Quadrat langsam um seine Mitte. Wann sieht es zum ersten Mal wieder gleich aus?"
                options: ["nach einer Vierteldrehung", "nach einer halben Drehung", "nach einer ganzen Drehung"]
                answer: "nach einer Vierteldrehung"
                keep_order: true
                hints: ["Alle vier Seiten sind gleich lang."]
                difficulty: stretch

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Welche Figur ist punktsymmetrisch?"
                say: "Welche Figur ist punktsymmetrisch?"
                options:
                  - { drawn: shape, kind: triangle, colour: blue }
                  - { drawn: shape, kind: rectangle, colour: blue }
                answer: rectangle
                option_audio: false
              - id: l2-n2
                type: true_false
                text: "Ein Dreieck mit drei gleich langen Seiten ist punktsymmetrisch."
                say: "Stimmt das? Ein Dreieck mit drei gleich langen Seiten ist punktsymmetrisch."
                answer: false
              - id: l2-n3
                type: sorting
                text: "Punktsymmetrisch oder nicht?"
                say: "Sortiere die Buchstaben: punktsymmetrisch oder nicht punktsymmetrisch?"
                bins:
                  - { id: point, show: { text: "punktsymmetrisch" }, say: "punktsymmetrisch" }
                  - { id: not-point, show: { text: "nicht punktsymmetrisch" }, say: "nicht punktsymmetrisch" }
                options:
                  - { text: "Z", bin: point }
                  - { text: "X", bin: point }
                  - { text: "O", bin: point }
                  - { text: "U", bin: not-point }
                  - { text: "L", bin: not-point }
                  - { text: "V", bin: not-point }
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Was ist punktsymmetrisch, hat aber keine Symmetrieachse?"
                say: "Was ist punktsymmetrisch, hat aber keine Symmetrieachse?"
                options: ["der Buchstabe S", "der Buchstabe A", "der Buchstabe H"]
                answer: "der Buchstabe S"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Ein Rechteck hat zwei Symmetrieachsen und ist punktsymmetrisch."
                say: "Stimmt das? Ein Rechteck hat zwei Symmetrieachsen und ist außerdem punktsymmetrisch."
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: letters
            type: true_false
            text: "Ist das I punktsymmetrisch?"
            say: "Ist das I punktsymmetrisch?"
            show: { drawn: letter-card, text: "I" }
            answer: true
          - id: l2-c2
            part: letters
            type: multiple_choice
            text: "Welcher Buchstabe sieht nach einer halben Drehung genauso aus?"
            say: "Welcher Buchstabe sieht nach einer halben Drehung genauso aus wie vorher?"
            options: ["Z", "Y", "R"]
            answer: "Z"
            option_audio: false
          - id: l2-c3
            part: shapes
            type: image_multiple_choice
            text: "Welche Figur sieht nach einer halben Drehung anders aus?"
            say: "Welche Figur sieht nach einer halben Drehung anders aus als vorher?"
            options:
              - { drawn: shape, kind: square, colour: purple }
              - { drawn: shape, kind: hexagon, colour: purple }
              - { drawn: shape, kind: triangle, colour: purple }
            answer: triangle
            option_audio: false
          - id: l2-c4
            part: axis
            type: true_false
            text: "Die 0 hat zwei Symmetrieachsen. Sie ist auch punktsymmetrisch."
            say: "Stimmt das? Die Null hat zwei Symmetrieachsen. Sie ist auch punktsymmetrisch."
            show: { drawn: letter-card, text: "0" }
            answer: true
          - id: l2-c5
            part: letters
            type: multiple_choice
