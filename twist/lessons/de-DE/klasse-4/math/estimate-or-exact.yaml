# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.estimate-or-exact
skill: math.word-problems.estimate-or-exact
curriculum: de-DE
language: de
title:
  de: Überschlag oder genau?
  en: Estimate or exact?
summary: >
  Lesson 1 decides from the situation whether an Überschlag is enough
  (Reicht das Geld? Passen alle in den Bus?) or an exact answer is needed
  (Rückgeld, Kassenbon, Medizin); lesson 2 makes the Überschlag safe by
  rounding up when something must be enough, and calculates exactly when
  the Überschlag lands close to the limit, then ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.word-problems.multi-step, math.add-sub-to-1000.estimate]
  also_practises: [math.add-sub-to-1000.estimate, math.money.calculate]
  vocabulary: { de: [Überschlag, ungefähr, genau, aufrunden, abrunden, knapp, reichen] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: decide, what: { de: "entscheiden, ob ein Überschlag reicht oder ob man genau rechnen muss", en: deciding whether an estimate is enough or an exact answer is needed } }
    - { id: safe-estimate, what: { de: "mit aufgerundeten Zahlen sicher prüfen, ob etwas reicht", en: rounding up to check safely that something is enough } }
    - { id: close, what: { de: bei einem knappen Überschlag genau nachrechnen, en: calculating exactly when the estimate is close to the limit } }
  misconceptions:
    - id: always-exact
      what: Thinks every word problem needs an exact answer, even when the question only asks whether something is enough
      addressed: lesson 1 Learn sets a question an Überschlag answers beside one that needs the exact sum; every stage of lesson 1 has a sorting task and a Reicht-es story, with feedback in l1-f1
    - id: close-estimate-trusted
      what: Trusts an Überschlag that lands next to the limit, or rounds prices down when the money must be enough
      addressed: lesson 2 Learn rounds up and then calculates exactly when the Überschlag is knapp; l2-f1, l2-f3, l2-s3, l2-s5, l2-n2 and l2-c3 offer the rounded-down or close answer, with feedback in l2-f1 and l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Reicht ein Überschlag?", en: "Is an estimate enough?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ungefähr wie viel ist 398 + 207?"
            say: "Ungefähr wie viel ist dreihundertachtundneunzig plus zweihundertsieben?"
            options: ["600", "500", "700"]
            answer: "600"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Runde 2480 auf Hunderter."
            say: "Runde zweitausendvierhundertachtzig auf Hunderter."
            options: ["2500", "2400", "2000"]
            answer: "2500"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mia hat 10 €.\nSie kauft für 3,90 €, 2,95 € und 1,99 €.\nÜberschlag: 4 € + 3 € + 2 € = 9 €"
            say: "Mia hat zehn Euro. Sie kauft drei Dinge für drei Euro neunzig, zwei Euro fünfundneunzig und einen Euro neunundneunzig. Reicht ihr Geld? Dafür muss sie nicht genau rechnen. Sie rundet auf: vier plus drei plus zwei sind neun Euro. Das reicht."
          - text: "An der Kasse: 3,90 € + 2,95 € + 1,99 € = 8,84 €"
            say: "Die Kassiererin muss aber genau wissen, was Mia bezahlt. Sie rechnet genau: acht Euro vierundachtzig. Beim Bezahlen und beim Rückgeld reicht kein Überschlag."
          - text: "Überschlag reicht: Reicht es? Passt es? Ungefähr wie viel?\nGenau rechnen: Was kostet es? Wie viel Rückgeld? Wie viel Medizin?"
            say: "Frag dich immer zuerst: Will ich nur wissen, ob etwas reicht oder ungefähr wie viel es ist? Dann reicht ein Überschlag. Muss jeder Euro und jeder Milliliter stimmen? Dann rechnest du genau."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Familie Kaya fährt 487 km in den Urlaub. Mit einem vollen Tank kommt das Auto 600 km weit. Muss Papa genau rechnen, ob der Tank reicht?"
                say: "Familie Kaya fährt vierhundertsiebenundachtzig Kilometer in den Urlaub. Mit einem vollen Tank kommt das Auto sechshundert Kilometer weit. Muss Papa genau rechnen, ob der Tank reicht?"
                options: ["Nein, ein Überschlag reicht.", "Ja, er muss genau rechnen."]
                answer: "Nein, ein Überschlag reicht."
                keep_order: true
                feedback:
                  "Ja, er muss genau rechnen.": "Gefragt ist nur, ob es reicht. 487 km sind weniger als 500 km, also weit unter 600 km."
                hints:
                  - "Was will Papa wissen: eine genaue Zahl oder nur, ob es reicht?"
                  - "487 km sind ungefähr 500 km. Das ist viel weniger als 600 km."
                  - "Nein, ein Überschlag reicht."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Für den Ausflug zahlt jedes Kind 7 €. Frau Berg schreibt auf, wie viel Geld sie eingesammelt hat. Reicht ein Überschlag?"
                say: "Für den Ausflug zahlt jedes Kind sieben Euro. Frau Berg schreibt auf, wie viel Geld sie eingesammelt hat. Reicht ein Überschlag?"
                options: ["Ja, ein Überschlag reicht.", "Nein, sie muss genau rechnen."]
                answer: "Nein, sie muss genau rechnen."
                keep_order: true
                hints:
                  - "Darf beim eingesammelten Geld etwas fehlen?"
                  - "Beim Geld für die Klasse muss jeder Euro stimmen."
                  - "Nein, sie muss genau rechnen."
              - id: l1-f3
                type: sorting
                text: "Überschlag oder genau rechnen?"
                say: "Sortiere die Fragen. Reicht ein Überschlag, oder musst du genau rechnen?"
                bins:
                  - { id: estimate, show: { text: "Überschlag reicht" }, say: "Überschlag reicht" }
                  - { id: exact, show: { text: "genau rechnen" }, say: "genau rechnen" }
                options:
                  - { text: "Reicht mein Geld für das Fahrrad?", bin: estimate }
                  - { text: "Wie viel Rückgeld bekomme ich?", bin: exact }
                  - { text: "Passen alle Kinder in die Turnhalle?", bin: estimate }
                  - { text: "Was steht auf der Rechnung?", bin: exact }
                hints:
                  - "Bei welchen Fragen willst du nur wissen, ob etwas reicht oder passt?"
                  - "Rückgeld und Rechnung müssen auf den Cent stimmen."
                  - "Überschlag: Fahrrad, Turnhalle. Genau: Rückgeld, Rechnung."
              - id: l1-f4
                type: true_false
                text: "Lea soll 5 ml Hustensaft nehmen. Darf sie die Menge einfach schätzen?"
                say: "Lea soll fünf Milliliter Hustensaft nehmen. Darf sie die Menge einfach schätzen?"
                answer: false
                hints:
                  - "Bei Medizin kommt es auf die genaue Menge an."
                  - "Zu viel Medizin kann schaden. Lea misst mit dem Löffel oder dem Becher ab."
                  - "Nein, sie misst genau ab."
              - id: l1-f5
                type: multiple_choice
                text: "Ein Bus hat 52 Plätze. Drei Klassen mit 24, 27 und 22 Kindern wollen mitfahren. Reicht ein Bus?"
                say: "Ein Bus hat zweiundfünfzig Plätze. Drei Klassen mit vierundzwanzig, siebenundzwanzig und zweiundzwanzig Kindern wollen mitfahren. Reicht ein Bus?"
                options: ["Nein, es sind ungefähr 70 Kinder.", "Ja, es sind ungefähr 50 Kinder.", "Das weiß man erst, wenn man genau rechnet."]
                answer: "Nein, es sind ungefähr 70 Kinder."
                hints:
                  - "Runde jede Klasse auf Zehner."
                  - "20 + 30 + 20 sind schon 70."
                  - "Nein, es sind ungefähr 70 Kinder."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Der Zug fährt um 14:37 Uhr ab. Reicht es, wenn du ungefähr weißt, wann er fährt?"
                say: "Der Zug fährt um vierzehn Uhr siebenunddreißig ab. Reicht es, wenn du ungefähr weißt, wann er fährt?"
                options: ["Ja, ungefähr reicht.", "Nein, ich muss es genau wissen."]
                answer: "Nein, ich muss es genau wissen."
                keep_order: true
                hints: ["Der Zug wartet nicht auf dich."]
              - id: l1-s2
                type: multiple_choice
                text: "Beim Schulfest gibt es 1000 Stühle. Es kommen 312 Eltern, 405 Kinder und 88 Gäste. Muss Herr Sommer genau rechnen, ob die Stühle reichen?"
                say: "Beim Schulfest gibt es tausend Stühle. Es kommen dreihundertzwölf Eltern, vierhundertfünf Kinder und achtundachtzig Gäste. Muss Herr Sommer genau rechnen, ob die Stühle reichen?"
                options: ["Nein, ein Überschlag reicht.", "Ja, er muss genau rechnen."]
                answer: "Nein, ein Überschlag reicht."
                keep_order: true
                hints: ["300 + 400 + 100 sind ungefähr 800."]
              - id: l1-s3
                type: sorting
                text: "Überschlag oder genau rechnen?"
                say: "Sortiere die Fragen. Reicht ein Überschlag, oder musst du genau rechnen?"
                bins:
                  - { id: estimate, show: { text: "Überschlag reicht" }, say: "Überschlag reicht" }
                  - { id: exact, show: { text: "genau rechnen" }, say: "genau rechnen" }
                options:
                  - { text: "Wie lange fahren wir ungefähr bis zu Oma?", bin: estimate }
                  - { text: "Was steht auf dem Kassenbon?", bin: exact }
                  - { text: "Wie viele Menschen leben ungefähr in Köln?", bin: estimate }
                  - { text: "Wie viel Wechselgeld bekommst du?", bin: exact }
                hints: ["Beim Bezahlen muss jeder Cent stimmen."]
              - id: l1-s4
                type: true_false
                text: "Max hat 20 €. Er kauft Bücher für 4,95 €, 5,10 € und 3,99 €. Weiß er schon mit einem Überschlag, dass das Geld reicht?"
                say: "Max hat zwanzig Euro. Er kauft Bücher für vier Euro fünfundneunzig, fünf Euro zehn und drei Euro neunundneunzig. Weiß er schon mit einem Überschlag, dass das Geld reicht?"
                answer: true
                hints: ["Runde jeden Preis auf: 5 € + 6 € + 4 €."]
              - id: l1-s5
                type: multiple_choice
                text: "Ein Lkw darf 7500 kg laden. Er hat 12 Kisten zu je 480 kg geladen. Ist er zu schwer?"
                say: "Ein Lastwagen darf siebentausendfünfhundert Kilogramm laden. Er hat zwölf Kisten zu je vierhundertachtzig Kilogramm geladen. Ist er zu schwer?"
                options: ["Nein, es sind weniger als 6000 kg.", "Ja, es sind mehr als 7500 kg.", "Das kann man nicht wissen."]
                answer: "Nein, es sind weniger als 6000 kg."
                hints: ["Runde auf: 12 Kisten zu je 500 kg."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Frau Ott hat getankt und bezahlt an der Kasse. Muss der Betrag genau stimmen?"
                say: "Frau Ott hat getankt und bezahlt an der Kasse. Muss der Betrag genau stimmen?"
                options: ["Ja, er muss genau stimmen.", "Nein, ungefähr reicht."]
                answer: "Ja, er muss genau stimmen."
                keep_order: true
              - id: l1-n2
                type: multiple_choice
                text: "Ein Aufzug trägt 600 kg. Vier Männer mit 78 kg, 92 kg, 85 kg und 81 kg steigen ein. Reicht ein Überschlag, um zu wissen, ob sie fahren dürfen?"
                say: "Ein Aufzug trägt sechshundert Kilogramm. Vier Männer mit achtundsiebzig, zweiundneunzig, fünfundachtzig und einundachtzig Kilogramm steigen ein. Reicht ein Überschlag, um zu wissen, ob sie fahren dürfen?"
                options: ["Ja, es sind höchstens 400 kg.", "Nein, man muss genau rechnen."]
                answer: "Ja, es sind höchstens 400 kg."
                keep_order: true
              - id: l1-n3
                type: sorting
                text: "Überschlag oder genau rechnen?"
                say: "Sortiere die Fragen. Reicht ein Überschlag, oder musst du genau rechnen?"
                bins:
                  - { id: estimate, show: { text: "Überschlag reicht" }, say: "Überschlag reicht" }
                  - { id: exact, show: { text: "genau rechnen" }, say: "genau rechnen" }
                options:
                  - { text: "Wie hoch ist der Fernsehturm ungefähr?", bin: estimate }
                  - { text: "Wie viel Geld gibst du dem Bäcker?", bin: exact }
                  - { text: "Wie lange dauert der Film ungefähr?", bin: estimate }
                  - { text: "Wie viele Tabletten bekommt der Hund?", bin: exact }
              - id: l1-n4
                type: true_false
                text: "Die Schule hat 486 Kinder. Der Hausmeister hat 600 Eis am Stiel gekauft, eins für jedes Kind. Weißt du ohne genaues Rechnen, dass das Eis reicht?"
                say: "Die Schule hat vierhundertsechsundachtzig Kinder. Der Hausmeister hat sechshundert Eis am Stiel gekauft, eins für jedes Kind. Weißt du ohne genaues Rechnen, dass das Eis reicht?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Für die Klassenfahrt zahlt jedes der 26 Kinder 85 €. Die Lehrerin überweist das Geld an die Jugendherberge. Wie rechnet sie?"
                say: "Für die Klassenfahrt zahlt jedes der sechsundzwanzig Kinder fünfundachtzig Euro. Die Lehrerin überweist das Geld an die Jugendherberge. Wie rechnet sie?"
                options: ["genau: 26 · 85 €", "ungefähr: 30 · 90 €"]
                answer: "genau: 26 · 85 €"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ein Kino hat 180 Plätze. Vier Klassen mit 23, 26, 21 und 25 Kindern kommen. Reichen die Plätze?"
            say: "Ein Kino hat hundertachtzig Plätze. Vier Klassen mit dreiundzwanzig, sechsundzwanzig, einundzwanzig und fünfundzwanzig Kindern kommen. Reichen die Plätze?"
            options: ["Ja, es sind ungefähr 100 Kinder.", "Nein, es sind zu viele Kinder.", "Das weiß man erst, wenn man genau rechnet."]
            answer: "Ja, es sind ungefähr 100 Kinder."
          - id: l1-c2
            type: multiple_choice
            text: "Du kaufst am Kiosk ein. Was muss genau stimmen?"
            say: "Du kaufst am Kiosk ein. Was muss genau stimmen?"
            options: ["das Rückgeld", "wie lange du anstehst", "wie viele Leute im Laden sind"]
            answer: "das Rückgeld"
          - id: l1-c3
            type: true_false
            text: "Jonas will wissen, ob sein Taschengeld für ein Spiel reicht. Muss er dafür immer genau rechnen?"
            say: "Jonas will wissen, ob sein Taschengeld für ein Spiel reicht. Muss er dafür immer genau rechnen?"
            answer: false
          - id: l1-c4
            type: true_false
            text: "Herr Wolf kauft für die Klasse 28 Hefte zu je 1,15 €. Auf der Rechnung stehen 32,20 €. Muss dieser Betrag genau stimmen?"
            say: "Herr Wolf kauft für die Klasse achtundzwanzig Hefte zu je einem Euro fünfzehn. Auf der Rechnung stehen zweiunddreißig Euro zwanzig. Muss dieser Betrag genau stimmen?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Ein Saal hat 400 Plätze. Es kommen 96 Kinder und 103 Eltern. Reichen die Plätze?"
            say: "Ein Saal hat vierhundert Plätze. Es kommen sechsundneunzig Kinder und hundertdrei Eltern. Reichen die Plätze?"
            options: ["Ja, es sind ungefähr 200 Leute.", "Nein, es sind zu viele Leute.", "Das weiß man erst, wenn man genau rechnet."]
            answer: "Ja, es sind ungefähr 200 Leute."
          - id: l1-c6
            type: sorting
            text: "Überschlag oder genau rechnen?"
            say: "Sortiere die Fragen. Reicht ein Überschlag, oder musst du genau rechnen?"
            bins:
              - { id: estimate, show: { text: "Überschlag reicht" }, say: "Überschlag reicht" }
              - { id: exact, show: { text: "genau rechnen" }, say: "genau rechnen" }
            options:
              - { text: "Wie viele Kilometer sind es ungefähr bis Berlin?", bin: estimate }
              - { text: "Wie viel zahlst du an der Kasse?", bin: exact }
              - { text: "Reichen 40 Stühle für 25 Gäste?", bin: estimate }
              - { text: "Wie viele Tropfen Medizin bekommt die Katze?", bin: exact }

  - n: 2
    title: { de: "Sicher und knapp", en: "Safe and close" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viel Rückgeld bekommst du? Reicht dafür ein Überschlag?"
            say: "Du willst wissen, wie viel Rückgeld du bekommst. Reicht dafür ein Überschlag?"
            options: ["Ja, ein Überschlag reicht.", "Nein, ich muss genau rechnen."]
            answer: "Nein, ich muss genau rechnen."
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ungefähr wie viel ist 2,95 € + 4,10 €?"
            say: "Ungefähr wie viel ist zwei Euro fünfundneunzig plus vier Euro zehn?"
            options: ["7 €", "6 €", "8 €"]
            answer: "7 €"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lea hat 20 €. Sie kauft für 3,80 €, 4,60 € und 5,90 €.\nAufgerundet: 4 € + 5 € + 6 € = 15 €"
            say: "Lea hat zwanzig Euro. Sie kauft drei Dinge. Soll das Geld sicher reichen, rundest du jeden Preis auf. Dann ist dein Überschlag eher zu groß als zu klein. Vier plus fünf plus sechs sind fünfzehn Euro. Selbst aufgerundet sind es nur fünfzehn Euro. Das Geld reicht sicher."
          - text: "Ben hat 10 €. Er kauft für 4,80 € und 5,30 €.\nÜberschlag: 5 € + 5 € = 10 €. Knapp!\nGenau: 4,80 € + 5,30 € = 10,10 €"
            say: "Ben hat zehn Euro und kauft zwei Dinge. Sein Überschlag ergibt zehn Euro. Das liegt genau an der Grenze. Das ist knapp! Jetzt rechnet er genau: zehn Euro zehn. Das Geld reicht nicht."
          - text: "Weit weg von der Grenze: Überschlag reicht.\nNah an der Grenze: genau rechnen."
            say: "Liegt dein Überschlag weit weg von der Grenze, weißt du die Antwort schon. Liegt er nah dran, rechnest du genau."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Mia hat 20 €. Sie möchte ein Buch für 8,90 € und ein Spiel für 9,80 €. Wie rundest du, damit du sicher weißt, ob es reicht?"
                say: "Mia hat zwanzig Euro. Sie möchte ein Buch für acht Euro neunzig und ein Spiel für neun Euro achtzig. Wie rundest du, damit du sicher weißt, ob es reicht?"
                options: ["beide Preise aufrunden: 9 € + 10 €", "beide Preise abrunden: 8 € + 9 €", "gar nicht runden"]
                answer: "beide Preise aufrunden: 9 € + 10 €"
                feedback:
                  "beide Preise abrunden: 8 € + 9 €": "Abgerundet sieht alles billiger aus, als es ist. Dann reicht das Geld vielleicht doch nicht."
                hints:
                  - "Der Überschlag soll lieber zu groß sein als zu klein."
                  - "8,90 € wird zu 9 €, 9,80 € wird zu 10 €."
                  - "beide Preise aufrunden: 9 € + 10 €."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Mia rechnet aufgerundet: 9 € + 10 € = 19 €. Sie hat 20 €. Was weiß sie jetzt?"
                say: "Mia rechnet aufgerundet: neun Euro plus zehn Euro sind neunzehn Euro. Sie hat zwanzig Euro. Was weiß sie jetzt?"
                options: ["Das Geld reicht sicher.", "Das Geld reicht nicht.", "Sie muss noch genau rechnen."]
                answer: "Das Geld reicht sicher."
                hints:
                  - "Aufgerundet ist der Überschlag größer als der echte Preis."
                  - "Schon 19 € sind weniger als 20 €. Der echte Preis ist noch kleiner."
                  - "Das Geld reicht sicher."
              - id: l2-f3
                type: multiple_choice
                text: "Ole hat 12 €. Er kauft Kleber für 5,90 € und Papier für 6,40 €. Aufgerundet: 6 € + 7 € = 13 €. Was nun?"
                say: "Ole hat zwölf Euro. Er kauft Kleber für fünf Euro neunzig und Papier für sechs Euro vierzig. Aufgerundet sind das sechs plus sieben, also dreizehn Euro. Was nun?"
                options: ["Knapp. Genau sind es 12,30 €. Es reicht nicht.", "Der Überschlag zeigt sicher: Es reicht nicht.", "Es reicht sicher."]
                answer: "Knapp. Genau sind es 12,30 €. Es reicht nicht."
                feedback:
                  "Der Überschlag zeigt sicher: Es reicht nicht.": "Aufgerundet ist der Überschlag zu groß. Bei 13 € statt 12 € musst du genau nachrechnen."
                hints:
                  - "13 € liegt ganz nah an 12 €."
                  - "Rechne genau: 5,90 € + 6,40 €."
                  - "Knapp. Genau sind es 12,30 €. Es reicht nicht."
              - id: l2-f4
                type: true_false
                text: "Ein Aufzug trägt 400 kg. Drei Leute wiegen 92 kg, 105 kg und 88 kg und haben 70 kg Gepäck. Aufgerundet: 100 + 110 + 90 + 70 = 370. Dürfen alle zusammen fahren?"
                say: "Ein Aufzug trägt vierhundert Kilogramm. Drei Leute wiegen zweiundneunzig, hundertfünf und achtundachtzig Kilogramm und haben siebzig Kilogramm Gepäck. Aufgerundet sind das dreihundertsiebzig. Dürfen alle zusammen fahren?"
                answer: true
                hints:
                  - "Alle Gewichte wurden aufgerundet."
                  - "Schon aufgerundet sind es nur 370 kg. Das ist weniger als 400 kg."
                  - "Ja, sie dürfen fahren."
              - id: l2-f5
                type: multiple_choice
                text: "Für ein Fest werden 1000 Becher gekauft. Es kommen 487 Kinder und 496 Erwachsene. Reichen die Becher?"
                say: "Für ein Fest werden tausend Becher gekauft. Es kommen vierhundertsiebenundachtzig Kinder und vierhundertsechsundneunzig Erwachsene. Reichen die Becher?"
                options: ["Knapp. Genau sind es 983 Gäste. Die Becher reichen.", "Überschlag 1000. Die Becher reichen nicht.", "Überschlag 900. Es bleiben viele übrig."]
                answer: "Knapp. Genau sind es 983 Gäste. Die Becher reichen."
                hints:
                  - "Der Überschlag 500 + 500 liegt genau an der Grenze."
                  - "Rechne genau: 487 + 496."
                  - "Knapp. Genau sind es 983 Gäste. Die Becher reichen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Lukas hat 30 €. Er möchte Schuhe für 18,90 € und Socken für 4,95 €. Reicht das Geld?"
                say: "Lukas hat dreißig Euro. Er möchte Schuhe für achtzehn Euro neunzig und Socken für vier Euro fünfundneunzig. Reicht das Geld?"
                options: ["Ja, aufgerundet sind es 24 €.", "Nein, es fehlt Geld.", "Das weiß man erst, wenn man genau rechnet."]
                answer: "Ja, aufgerundet sind es 24 €."
                hints: ["Runde auf: 19 € + 5 €."]
              - id: l2-s2
                type: multiple_choice
                text: "Das Geld soll sicher reichen. Wie rundest du die Preise?"
                say: "Das Geld soll sicher reichen. Wie rundest du die Preise?"
                options: ["Ich runde sie auf.", "Ich runde sie ab."]
