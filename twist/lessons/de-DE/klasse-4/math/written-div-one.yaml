      en: "Divide in writing, place by place, starting on the left. For 846 divided by 2, first work out 8 divided by 2."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "36 : 4 = _"
            say: "Sechsunddreißig geteilt durch vier."
            answer: "9"
