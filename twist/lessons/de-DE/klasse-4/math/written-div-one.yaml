# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.written-div-one
skill: math.written-mult-div.div-one-digit
curriculum: de-DE
language: de
title:
  de: Schriftlich teilen durch eine einstellige Zahl
  en: Written division by a one-digit number
summary: >
  Dividing a three- or four-digit number by a one-digit number in
  writing, starting from the left. Lesson 1 divides place by place when
  every digit can be divided (846 : 2); lesson 2 brings the next digit
  down next to the remainder (864 : 4: 6 : 4 is 1 Rest 2, then 24 : 4),
  checks with the Probe, and ends with the skill check. All divisions
  come out exactly; typed answers are plain digits.
metadata:
  year: klasse-4
  topic: { de: Schriftlich teilen, en: Written division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.semi-written-div, math.written-add-sub.sub-regroup]
  also_practises: [math.written-mult-div.mult-one-digit]
  vocabulary: { de: [schriftlich dividieren, teilen, Rest, herunterholen, Probe] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: place, what: { de: Stelle für Stelle von links teilen, en: dividing place by place from the left } }
    - { id: remainder, what: { de: mit dem Rest und der nächsten Ziffer weiterrechnen, en: carrying the remainder to the next digit } }
    - { id: probe, what: { de: das Ergebnis mit der Probe prüfen, en: checking the answer by multiplying } }
    - { id: explain, what: { de: die Schritte erklären und Fehler finden, en: explaining the steps and finding mistakes } }
  misconceptions:
    - id: start-right
      what: Starts with the ones as in multiplication
      addressed: lesson 1 Learn says division starts on the left; l1-f3 asks where to start; the step frames always go from the left
    - id: drop-remainder
      what: "Forgets the Rest and divides the next digit on its own (864 : 4 = 211)"
      addressed: lesson 2 Learn writes the next digit next to each Rest; a "Wo ist der Fehler?" task with a forgotten Rest in the full and some stages of lesson 2 (feedback in l2-f3), and a correct one to judge in the none stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
