          - text: "H: 8 : 2 = 4 | Z: 4 : 2 = 2 | E: 6 : 2 = 3"
            say: "Dann die Zehner: vier geteilt durch zwei ist zwei. Dann die Einer: sechs geteilt durch zwei ist drei. Das Ergebnis ist vierhundertdreiundzwanzig."
          - text: "Probe: 423 · 2 = 846"
