# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.digital-tools
skill: math.data.digital-tools
curriculum: de-DE
language: de
title:
  de: Tabellen und Diagramme am Computer
  en: Tables and charts on the computer
summary: >
  Lesson 1 enters survey data in a Tabellenprogramm: columns have
  letters, rows have numbers, a cell is named column first (B3: Spalte
  B, Zeile 3); headings go in row 1, the answers in column A and the
  numbers in column B, one thing per cell, the number instead of the
  strokes, and the entries are checked against the Strichliste.
  Lesson 2 lets the program draw a Säulendiagramm: mark the cells with
  the data, choose the chart, give it a title, see that a changed
  number changes its bar and that a typing mistake (51 for 15) is drawn
  as well, because the program does not know it is wrong; it ends with
  the skill check. Tables are drawn as a spreadsheet (table with sheet);
  typing into a real Tabellenprogramm stays in the classroom.
metadata:
  year: klasse-4
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.data.plan-survey]
  also_practises: [math.data.plan-survey, math.data.read-charts]
  vocabulary: { de: [Tabellenprogramm, Tabelle, Zelle, Spalte, Zeile, Überschrift, eintragen, markieren, Diagramm einfügen, Säulendiagramm, Tippfehler] }
  forms: [text, audio, drawn]
  drawn: [bar-chart, table]
  facets: []
  parts:
    - { id: cells, what: { de: Zellen benennen und Daten richtig eintragen, en: naming cells and entering data correctly } }
    - { id: chart, what: { de: vom Programm ein Diagramm zeichnen lassen, en: letting the program draw a chart } }
    - { id: check, what: { de: Tabelle und Diagramm prüfen, en: checking the table and the chart } }
  misconceptions:
    - id: row-column-swap
      what: Names a cell row first or mixes up Spalte and Zeile (2B or B2 for Spalte C, Zeile 2)
      addressed: lesson 1 Learn names B3 as Spalte B, Zeile 3; l1-f1 (with feedback), l1-f2, l1-s1, l1-s2, l1-n1, l1-n2 and l2-c1 ask for a cell name or what is in a cell
    - id: program-is-always-right
      what: Trusts the chart because the computer drew it, and does not check the entries
      addressed: lesson 1 Learn checks the table against the Strichliste and lesson 2 Learn shows a typing mistake drawn as a far too high bar; l1-f5, l1-s5, l1-n5, l2-f3 (with feedback), l2-s3, l2-n3 and l2-c4 find the mistake
    - id: forgets-to-mark-all
      what: Marks only part of the data, so a bar is missing
      addressed: lesson 2 Learn marks A1 to B4; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c3 ask which cells to mark or which bar is missing
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Daten in eine Tabelle eintragen", en: "Entering data in a table" }
    goal:
      de: "Trag die Zahlen aus einer Umfrage in eine Tabelle am Computer ein, in jede Zelle nur eine Sache."
      en: "Enter the numbers from a survey into a table on the computer, with only one thing in each cell."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Kinder mögen Fußball am liebsten?"
            say: "Die Klasse hat eine Umfrage gemacht. Wie viele Kinder mögen Fußball am liebsten?"
            show: { drawn: bar-chart, tally: true, rows: [["Fußball", 12], ["Schwimmen", 8], ["Turnen", 6]] }
            options: ["12", "10", "8"]
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Fußball 12, Schwimmen 8, Turnen 6. In der Klasse sind 26 Kinder, jedes hat einmal abgestimmt. Passt das?"
            say: "Fußball zwölf, Schwimmen acht, Turnen sechs. In der Klasse sind sechsundzwanzig Kinder, jedes hat einmal abgestimmt. Passt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du? In einer Tabelle am Computer hat jedes Kästchen einen Namen. Wie könnte das gelbe Kästchen heißen?"
            say: "In einer Tabelle am Computer hat jedes Kästchen einen eigenen Namen. Was glaubst du: Wie könnte das gelbe Kästchen heißen?"
            show: { drawn: table, sheet: true, header: false, rows: [["", "", ""], ["", "", ""], ["", "", ""]], mark: [[2, 1]] }
          - text: "Spalten: A, B, C\nZeilen: 1, 2, 3\nB3 = Spalte B, Zeile 3"
            say: "Es heißt B drei! Mit einem Tabellenprogramm kannst du Daten am Computer oder am Tablet eintragen. Die Spalten haben Buchstaben: A, B, C. Die Zeilen haben Zahlen: eins, zwei, drei. Jedes Kästchen heißt Zelle. Die gelbe Zelle ist B drei: Spalte B und Zeile drei. Zuerst kommt immer der Buchstabe."
            show: { drawn: table, sheet: true, header: false, rows: [["", "", ""], ["", "", ""], ["", "", ""]], mark: [[2, 1]] }
          - text: "Wusstest du? Nach Spalte Z geht es weiter mit AA, AB, AC. In vielen Tabellenprogrammen gibt es mehr als eine Million Zeilen."
            say: "Wusstest du? Nach Spalte Z sind die Buchstaben nicht zu Ende. Dann geht es weiter mit A A, A B, A C. Und in vielen Tabellenprogrammen gibt es mehr als eine Million Zeilen. Da musst du ganz schön weit nach unten scrollen!"
          - text: "Eine Umfrage in der Tabelle"
            say: "So trägst du eine Umfrage ein. In Zeile eins stehen die Überschriften: Tier und Anzahl. Darunter stehen in Spalte A die Antworten und in Spalte B die Zahlen."
            show: { drawn: table, sheet: true, rows: [["Tier", "Anzahl"], ["Hund", 7], ["Katze", 5], ["Hase", 3]] }
          - text: "In B2 tippst du: 7"
            say: "In jede Zelle kommt nur eine Sache, ein Wort oder eine Zahl. Striche tippst du nicht ab. Du zählst sie aus und tippst die Zahl. Bei Hund sind es sieben."
            show: { drawn: bar-chart, tally: true, rows: [["Hund", 7], ["Katze", 5], ["Hase", 3]] }
          - text: "Strichliste und Tabelle vergleichen"
            say: "Zum Schluss prüfst du: Stimmt jede Zahl in der Tabelle mit der Strichliste überein? Ein Tippfehler passiert schnell."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißt die Zelle in Spalte C und Zeile 2?"
                say: "Wie heißt die Zelle in Spalte C und Zeile zwei?"
                options: ["C2", "2C", "B2"]
                answer: "C2"
                feedback:
                  "2C": "Zuerst kommt der Buchstabe der Spalte, dann die Zahl der Zeile."
                hints:
                  - "Der Name einer Zelle hat einen Buchstaben und eine Zahl."
                  - "Der Buchstabe ist die Spalte und kommt zuerst."
                  - "C2."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Welche Zahl steht in Zelle B3?"
                show: { drawn: table, sheet: true, rows: [["Tier", "Anzahl"], ["Hund", 7], ["Katze", 5], ["Hase", 3]] }
                say: "Welche Zahl steht in der Zelle B drei? Tippe sie ein."
                answer: "5"
                hints:
                  - "B ist die Spalte, 3 ist die Zeile."
                  - "Such die Zeile, die mit A3 und B3 anfängt."
                  - "In B3 steht 5."
              - id: l1-f3
                type: multiple_choice
                text: "Wo tippst du die Anzahl für Hase ein?"
                show: { drawn: table, sheet: true, rows: [["Tier", "Anzahl"], ["Hund", 7], ["Katze", 5], ["Hase", "?"]] }
                say: "Wo tippst du die Anzahl für Hase ein?"
                options: ["B4", "A4", "B3"]
                answer: "B4"
                hints:
                  - "Hase steht in Zeile 4."
                  - "Die Zahlen stehen in Spalte B."
                  - "Spalte B, Zeile 4: B4."
              - id: l1-f4
                type: multiple_choice
                text: "Was tippst du für Schwimmen in die Zelle?"
                say: "Du überträgst die Strichliste in die Tabelle. Was tippst du für Schwimmen in die Zelle?"
                show: { drawn: bar-chart, tally: true, rows: [["Fußball", 12], ["Schwimmen", 8], ["Turnen", 6]] }
                options: ["8", "acht Striche", "Schwimmen 8"]
                answer: "8"
                hints:
                  - "In die Zelle kommt nur eine Sache."
                  - "Schwimmen steht schon in Spalte A. In Spalte B kommt die Zahl."
                  - "Du tippst 8."
              - id: l1-f5
                type: multiple_choice
                text: "Strichliste: Fußball 12, Schwimmen 8, Turnen 6\nWelche Zahl in der Tabelle ist falsch eingetippt?"
                say: "In der Strichliste steht: Fußball zwölf, Schwimmen acht, Turnen sechs. Vergleiche sie mit der Tabelle. Welche Zahl ist falsch eingetippt?"
                show: { drawn: table, sheet: true, rows: [["Sport", "Anzahl"], ["Fußball", 21], ["Schwimmen", 8], ["Turnen", 6]] }
                options: ["21 bei Fußball", "8 bei Schwimmen", "6 bei Turnen"]
                answer: "21 bei Fußball"
                hints:
                  - "Vergleiche jede Zahl in Spalte B mit der Strichliste."
                  - "In der Strichliste hat Fußball 12. Was steht in B2?"
                  - "In B2 steht 21. Die Ziffern sind vertauscht."
              - id: l1-f6
                type: fill_in_blank
                text: "In Spalte A stehen die Lieblingsfarben, in Spalte B die Zahlen. Was passt als Überschrift in Zelle B1?"
                say: "In Spalte A stehen die Lieblingsfarben, in Spalte B die Zahlen. Was passt als Überschrift in die Zelle B eins?"
                frame: "B1: _"
                options: ["Anzahl", "Rot", "7"]
                answer: ["Anzahl"]
                hints:
                  - "Die Überschrift sagt, was in der ganzen Spalte steht."
                  - "In Spalte B steht, wie viele Kinder jede Farbe gewählt haben."
                  - "Anzahl."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie heißt die Zelle in Spalte A und Zeile 5?"
                say: "Wie heißt die Zelle in Spalte A und Zeile fünf?"
                options: ["A5", "5A", "E1"]
                answer: "A5"
                hints: ["Zuerst der Buchstabe der Spalte."]
              - id: l1-s2
                type: multiple_choice
                text: "In welcher Zelle steht Banane?"
                show: { drawn: table, sheet: true, rows: [["Obst", "Anzahl"], ["Apfel", 9], ["Banane", 6], ["Birne", 4]] }
                say: "In welcher Zelle steht Banane?"
                options: ["A3", "B3", "3A"]
                answer: "A3"
                hints: ["Die Wörter stehen in Spalte A."]
              - id: l1-s3
                type: text_input
                text: "Welche Zahl steht in Zelle B2?"
                show: { drawn: table, sheet: true, rows: [["Obst", "Anzahl"], ["Apfel", 9], ["Banane", 6], ["Birne", 4]] }
                say: "Welche Zahl steht in der Zelle B zwei? Tippe sie ein."
                answer: "9"
                hints: ["Spalte B, Zeile 2."]
              - id: l1-s4
                type: multiple_choice
                text: "Wo trägst du die neue Antwort Kiwi ein?"
                show: { drawn: table, sheet: true, rows: [["Obst", "Anzahl"], ["Apfel", 9], ["Banane", 6], ["Birne", 4]] }
                say: "In der Obst-Tabelle sind die Zeilen eins bis vier schon voll. Wo trägst du die neue Antwort Kiwi ein?"
                options: ["A5", "B5", "A4"]
                answer: "A5"
                hints: ["Das Wort kommt in Spalte A, in die nächste freie Zeile."]
              - id: l1-s5
                type: true_false
                text: "Strichliste: Rot 9, Blau 14, Grün 5\nStimmt die Tabelle?"
                say: "In der Strichliste steht: Rot neun, Blau vierzehn, Grün fünf. Vergleiche sie mit der Tabelle. Stimmt die Tabelle?"
                show: { drawn: table, sheet: true, rows: [["Farbe", "Anzahl"], ["Rot", 9], ["Blau", 14], ["Grün", 5]] }
                answer: true
                hints: ["Prüf jede Farbe einzeln."]
              - id: l1-s6
                type: ordering
                text: "Bring die Schritte in die richtige Reihenfolge."
                say: "Du willst eine Strichliste in ein Tabellenprogramm übertragen. Bring die Schritte in die richtige Reihenfolge."
                options: ["Zahlen in Spalte B tippen", "Überschriften in Zeile 1 tippen", "Mit der Strichliste vergleichen", "Antworten in Spalte A tippen"]
                slot_count: 4
                answer: ["Überschriften in Zeile 1 tippen", "Antworten in Spalte A tippen", "Zahlen in Spalte B tippen", "Mit der Strichliste vergleichen"]
                hints: ["Ganz oben stehen die Überschriften. Prüfen kommt zum Schluss."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie heißt die Zelle in Spalte D und Zeile 3?"
                say: "Wie heißt die Zelle in Spalte D und Zeile drei?"
                options: ["D3", "3D", "C3"]
                answer: "D3"
              - id: l1-n2
                type: multiple_choice
                text: "Was steht in Zelle A4?"
                show: { drawn: table, sheet: true, rows: [["Ziel", "Stimmen"], ["Zoo", 8], ["Museum", 3], ["Kletterpark", 11]] }
                say: "Die Klasse hat über ihr Ausflugsziel abgestimmt. Was steht in der Zelle A vier?"
                options: ["Kletterpark", "11", "Museum"]
                answer: "Kletterpark"
              - id: l1-n3
                type: multiple_choice
                text: "In welcher Zelle steht die Zahl für Museum?"
                show: { drawn: table, sheet: true, rows: [["Ziel", "Stimmen"], ["Zoo", 8], ["Museum", 3], ["Kletterpark", 11]] }
                say: "In welcher Zelle steht die Zahl der Stimmen für Museum?"
                options: ["B3", "A3", "B4"]
                answer: "B3"
              - id: l1-n4
                type: text_input
                text: "Was tippst du für Turnen in die Zelle B4?"
                say: "Was tippst du für Turnen in die Zelle B vier? Tippe es hier ein."
                show: { drawn: bar-chart, tally: true, rows: [["Fußball", 10], ["Schwimmen", 7], ["Turnen", 9]] }
                answer: "9"
              - id: l1-n5
                type: multiple_choice
                text: "Strichliste: Rot 6, Blau 13, Grün 7\nWelche Zahl in der Tabelle ist falsch eingetippt?"
                say: "In der Strichliste steht: Rot sechs, Blau dreizehn, Grün sieben. Vergleiche sie mit der Tabelle. Welche Zahl ist falsch eingetippt?"
                show: { drawn: table, sheet: true, rows: [["Farbe", "Anzahl"], ["Rot", 6], ["Blau", 13], ["Grün", 4]] }
                options: ["4 bei Grün", "13 bei Blau", "6 bei Rot"]
                answer: "4 bei Grün"
              - id: l1-n6
                type: true_false
                text: "In eine Zelle darfst du zwei Antworten schreiben."
                say: "Stimmt das? In eine Zelle darfst du zwei Antworten schreiben, zum Beispiel Hund und Katze."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie heißt die Zelle in Spalte B und Zeile 6?"
            say: "Wie heißt die Zelle in Spalte B und Zeile sechs?"
            options: ["B6", "6B", "A6"]
            answer: "B6"
          - id: l1-c2
            type: multiple_choice
            text: "Was steht in Zelle B3?"
            show: { drawn: table, sheet: true, rows: [["Instrument", "Anzahl"], ["Gitarre", 7], ["Flöte", 10]] }
            say: "Was steht in der Zelle B drei?"
            options: ["10", "Flöte", "7"]
            answer: "10"
          - id: l1-c3
            type: multiple_choice
            text: "Was tippst du für Gelb in die Zelle?"
            say: "Was tippst du für Gelb in die Zelle?"
            show: { drawn: bar-chart, tally: true, rows: [["Rot", 4], ["Gelb", 11]] }
            options: ["11", "elf Striche", "Gelb 11"]
            answer: "11"
          - id: l1-c4
            type: multiple_choice
            text: "Wie heißt die Zelle in Spalte E und Zeile 2?"
            say: "Wie heißt die Zelle in Spalte E und Zeile zwei?"
            options: ["E2", "2E", "B5"]
            answer: "E2"
          - id: l1-c5
            type: multiple_choice
            text: "In welcher Zelle steht Verstecken?"
            show: { drawn: table, sheet: true, rows: [["Spiel", "Anzahl"], ["Fangen", 7], ["Verstecken", 12]] }
            say: "In welcher Zelle steht das Wort Verstecken?"
            options: ["A3", "B3", "3A"]
            answer: "A3"
          - id: l1-c6
            type: multiple_choice
            text: "Strichliste: Fangen 7, Verstecken 12\nWelche Zahl in der Tabelle ist falsch eingetippt?"
            say: "In der Strichliste steht: Fangen sieben, Verstecken zwölf. Vergleiche sie mit der Tabelle. Welche Zahl ist falsch eingetippt?"
            show: { drawn: table, sheet: true, rows: [["Spiel", "Anzahl"], ["Fangen", 7], ["Verstecken", 21]] }
            options: ["21 bei Verstecken", "7 bei Fangen", "keine, alles stimmt"]
            answer: "21 bei Verstecken"

  - n: 2
    title: { de: "Ein Diagramm erstellen lassen", en: "Letting the program draw a chart" }
    goal:
      de: "Lass das Programm aus deiner Tabelle ein Säulendiagramm zeichnen. Prüf genau, denn auch Tippfehler zeichnet es mit."
      en: "Let the program draw a bar chart from your table. Check carefully, because it draws typing mistakes too."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie heißt die Zelle in Spalte B und Zeile 4?"
            say: "Wie heißt die Zelle in Spalte B und Zeile vier?"
            options: ["B4", "4B", "D2"]
            answer: "B4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was steht in Zelle A2?"
            show: { drawn: table, sheet: true, rows: [["Tier", "Anzahl"], ["Hund", 7], ["Katze", 5]] }
            say: "Was steht in der Zelle A zwei?"
            options: ["Hund", "7", "Katze"]
            answer: "Hund"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du? Aus dieser Tabelle soll ein Säulendiagramm werden. Musst du die Säulen selbst malen?"
            say: "Aus dieser Tabelle soll ein Säulendiagramm werden. Was glaubst du: Musst du die Säulen selbst malen?"
            show: { drawn: table, sheet: true, rows: [["Tier", "Anzahl"], ["Hund", 7], ["Katze", 5], ["Hase", 3]] }
          - text: "Markieren: A1 bis B4"
            show: { drawn: table, sheet: true, rows: [["Tier", "Anzahl"], ["Hund", 7], ["Katze", 5], ["Hase", 3]], mark: [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [2, 1], [3, 0], [3, 1]] }
            say: "Nein, das macht das Programm für dich! Zuerst markierst du alle Zellen mit Daten, von A eins bis B vier. Dann wählst du: Diagramm einfügen, Säulendiagramm."
          - text: "Haustiere der 4a"
            say: "Das Programm zeichnet die Säulen selbst. Es nimmt genau die Zahlen aus der Tabelle: Hund sieben, Katze fünf, Hase drei. Gib dem Diagramm noch eine Überschrift, damit jeder weiß, worum es geht."
            show: { drawn: bar-chart, rows: [["Hund", 7], ["Katze", 5], ["Hase", 3]] }
          - text: "Tippfehler: 51 statt 15"
            say: "Vorsicht! Hast du dich vertippt, zeichnet das Programm den Fehler mit. Hier sollte bei Rot fünfzehn stehen. Aus Versehen steht da einundfünfzig. Die Säule ist viel zu hoch. Das Programm merkt das nicht. Das musst du prüfen."
            show: { drawn: bar-chart, step: 10, rows: [["Rot", 51], ["Blau", 12], ["Gelb", 9]] }
          - text: "B3: 5 → 8"
            say: "Änderst du eine Zahl in der Tabelle, ändert sich das Diagramm sofort mit. Wird bei Katze aus fünf eine Acht, wird die Säule für Katze höher."
            show: { drawn: bar-chart, rows: [["Hund", 7], ["Katze", 8], ["Hase", 3]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Welches Diagramm zeichnet das Programm?"
                show: { drawn: table, sheet: true, rows: [["Obst", "Anzahl"], ["Apfel", 9], ["Banane", 6], ["Birne", 4]] }
                say: "Welches Säulendiagramm zeichnet das Programm aus dieser Tabelle?"
                options:
                  - { drawn: bar-chart, rows: [["Apfel", 9], ["Banane", 6], ["Birne", 4]], key: "9-6-4" }
                  - { drawn: bar-chart, rows: [["Apfel", 4], ["Banane", 6], ["Birne", 9]], key: "4-6-9" }
                  - { drawn: bar-chart, rows: [["Apfel", 9], ["Banane", 4], ["Birne", 6]], key: "9-4-6" }
                answer: "9-6-4"
                hints:
                  - "Das Programm nimmt genau die Zahlen aus Spalte B."
                  - "Apfel 9, Banane 6, Birne 4."
                  - "Die Säulen werden von links nach rechts kleiner."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Zellen markierst du?"
                show: { drawn: table, sheet: true, rows: [["Obst", "Anzahl"], ["Apfel", 9], ["Banane", 6], ["Birne", 4]] }
                say: "Du willst ein Diagramm mit allen Obstsorten. Welche Zellen markierst du?"
                options: ["A1 bis B4", "A1 bis B3", "nur B2 bis B4"]
                answer: "A1 bis B4"
                feedback:
                  "A1 bis B3": "Dann fehlt Zeile 4, und im Diagramm fehlt die Säule für Birne."
                hints:
                  - "Die Daten gehen bis zur letzten Zeile mit Birne."
                  - "Birne steht in Zeile 4."
                  - "A1 bis B4."
              - id: l2-f3
                type: multiple_choice
                text: "Strichliste: Rot 15, Blau 12, Gelb 9\nWas ist hier passiert?"
                say: "In der Strichliste steht: Rot fünfzehn, Blau zwölf, Gelb neun. Das Programm hat dieses Diagramm gezeichnet. Was ist passiert?"
                show: { drawn: bar-chart, step: 10, rows: [["Rot", 51], ["Blau", 12], ["Gelb", 9]] }
                options: ["Bei Rot wurde 51 statt 15 eingetippt.", "Das Programm hat sich verrechnet.", "Alles ist richtig."]
                answer: "Bei Rot wurde 51 statt 15 eingetippt."
                feedback:
                  "Das Programm hat sich verrechnet.": "Das Programm zeichnet genau, was in der Tabelle steht. Der Fehler steckt in der Tabelle."
                  "Alles ist richtig.": "Lies die Säule für Rot ab und vergleiche sie mit der Strichliste."
                hints:
                  - "Lies jede Säule ab und vergleiche sie mit der Strichliste."
                  - "Die Säule für Rot geht über 50 hinaus."
                  - "Statt 15 wurde 51 eingetippt."
              - id: l2-f4
                type: true_false
                text: "In B3 steht die Anzahl für Banane. Du änderst sie von 6 auf 10. Wird die Säule für Banane im Diagramm höher?"
                say: "In B drei steht die Anzahl für Banane. Du änderst sie von sechs auf zehn. Wird die Säule für Banane im Diagramm dann höher?"
                answer: true
