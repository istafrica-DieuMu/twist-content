                options: ["135 600", "301 500", "153 060"]
                answer: "135 600"
                option_audio: false
                hints: ["Die 3 muss bei den Zehntausendern stehen."]
              - id: l2-s6
                type: true_false
                text: "Stimmt das? In 222 222 ist jede 2 gleich viel wert."
                say: "In zweihundertzweiundzwanzigtausendzweihundertzweiundzwanzig ist jede Zwei gleich viel wert. Stimmt das?"
                answer: false
                hints: ["Was macht den Wert einer Ziffer aus?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                say: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [9, 3, 0, 0, 7, 0] }
                options: ["930 070", "93 070", "930 700"]
                answer: "930 070"
                option_audio: false
