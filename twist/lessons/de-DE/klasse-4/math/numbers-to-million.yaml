                answer: ["4", "0", "8", "0", "0", "6"]
              - id: l2-n3
                type: multiple_choice
                text: "Wie viel ist die 5 in 175 904 wert?"
                say: "Wie viel ist die Fünf in hundertfünfundsiebzigtausendneunhundertvier wert?"
                options: ["500", "5000", "50 000"]
