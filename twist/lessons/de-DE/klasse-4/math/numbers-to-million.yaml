# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.numbers-to-million
skill: math.large-numbers.to-million
curriculum: de-DE
language: de
title:
  de: Zahlen bis 1 000 000
  en: Numbers to 1 000 000
summary: >
  The Zahlenraum grows to a million: ten thousands make a Zehntausender,
  ten Zehntausender a Hunderttausender, ten Hunderttausender a million.
  Lesson 1 bundles and counts in Zehntausendern and Hunderttausendern;
  lesson 2 enters six-digit numbers in the Stellentafel (HT, ZT, T, H, Z,
  E), names the value of each digit and groups the digits in threes;
  lesson 3 reads and writes them, also as number words, and ends with the
  skill check.
metadata:
  year: klasse-4
  topic: { de: Große Zahlen, en: Large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.to-10000]
  also_practises: [math.numbers-to-1000.read-write]
  vocabulary: { de: [Zehntausender, Hunderttausender, Million, Stellentafel, Stellenwert, Dreiergruppe, Zahlwort] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart]
  facets: []
  parts:
    - { id: bundle, what: { de: in Zehntausendern und Hunderttausendern bündeln und zählen, en: bundling and counting in ten thousands and hundred thousands } }
    - { id: place-value, what: { de: Zahlen in die Stellentafel eintragen und den Wert jeder Ziffer nennen, en: entering numbers in a place-value chart and naming the value of each digit } }
    - { id: read-write, what: { de: Zahlen bis 1 000 000 in Dreiergruppen lesen und schreiben, en: reading and writing numbers to 1 000 000 grouped in threes } }
  misconceptions:
    - id: tausend-group
      what: Reads 250 000 as zweihundertfünfzig, losing the tausend
      addressed: lesson 2 Learn groups the digits in threes and lesson 3 Learn reads the left group first with "tausend"; full-stage feedback names the missing tausend
    - id: zeros-dropped
      what: Drops zeros inside a group (writes dreihunderttausendvierzig as 30040 or 340)
      addressed: lessons 2 and 3 set numbers with zeros inside both groups in every stage; full-stage feedback counts the six places
    - id: digit-value
      what: Says the 4 in 342 615 is worth 4000
      addressed: lesson 2 asks for the value of digits in the left group of three; feedback names the column
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehntausender und Hunderttausender, en: Ten thousands and hundred thousands }
    goal:
      de: "Bündle Tausender zu Zehntausendern und Hunderttausendern und zähl in großen Schritten bis zu einer Million."
      en: "Bundle thousands into ten thousands and hundred thousands, and count in big steps up to a million."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Hunderter sind 10 000?"
            say: "Wie viele Hunderter sind zehntausend?"
            options: ["10", "100", "1000"]
            answer: "100"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Zahl steht in der Stellentafel?"
            say: "Welche Zahl steht in der Stellentafel?"
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [6, 0, 3, 0] }
            options: ["6030", "630", "6300"]
            answer: "6030"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "10 Tausender = 1 Zehntausender"
            say: "Zehn Tausender sind zehntausend. Wir bündeln sie zu einem Zehntausender. Die Stellentafel bekommt links eine neue Spalte, die Zehntausender."
            show: { drawn: place-value-chart, columns: [ten-thousands, thousands, hundreds, tens, ones], values: [1, 0, 0, 0, 0] }
          - text: "10 Zehntausender = 1 Hunderttausender"
            say: "Zehn Zehntausender sind hunderttausend. Das ist ein Hunderttausender, in der Spalte der Hunderttausender."
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [1, 0, 0, 0, 0, 0] }
          - text: "10 Hunderttausender = 1 000 000"
            say: "Und zehn Hunderttausender sind eine Million. Bei jeder Spalte nach links wird der Wert zehnmal so groß, wie schon bei Einern, Zehnern und Hundertern."
          - text: "20 000, 30 000, 40 000 ... · 200 000, 300 000, 400 000 ..."
            say: "Wir zählen in Zehntausendern: zwanzigtausend, dreißigtausend, vierzigtausend. Und in Hunderttausendern: zweihunderttausend, dreihunderttausend, vierhunderttausend."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Zehntausender sind 100 000?"
                say: "Wie viele Zehntausender sind hunderttausend?"
                options: ["10", "100", "1000"]
                answer: "10"
                feedback:
                  "100": "Hundert Tausender sind hunderttausend. Gefragt sind Zehntausender: davon brauchst du zehn."
                hints:
                  - "Zähl in Zehntausendern bis hunderttausend."
                  - "Zehntausend, zwanzigtausend, ... neunzigtausend, hunderttausend."
                  - "Zehn Zehntausender sind hunderttausend."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "40 000, 50 000, 60 000, _"
                say: "Wie geht es weiter? Vierzigtausend, fünfzigtausend, sechzigtausend."
                options: ["70 000", "61 000", "60 010"]
                answer: "70 000"
                option_audio: false
                hints:
                  - "Wie groß ist jeder Schritt?"
                  - "Jeder Schritt ist zehntausend."
                  - "Nach sechzigtausend kommt siebzigtausend."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viele Zehntausender sind 1 000 000?"
                say: "Wie viele Zehntausender sind eine Million?"
                options: ["10", "100", "1000"]
                answer: "100"
                hints:
                  - "Eine Million sind zehn Hunderttausender."
                  - "Ein Hunderttausender sind zehn Zehntausender."
                  - "Zehnmal zehn: 100 Zehntausender."
              - id: l1-f4
                type: multiple_choice
                text: "Wie viele Tausender sind 30 000?"
                say: "Wie viele Tausender sind dreißigtausend?"
                options: ["3", "30", "300"]
                answer: "30"
                feedback:
                  "3": "Dreißigtausend sind 3 Zehntausender. Ein Zehntausender sind zehn Tausender."
                hints:
                  - "Ein Zehntausender sind zehn Tausender."
                  - "Drei Zehntausender sind dreimal zehn Tausender."
                  - "30 000 sind 30 Tausender."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 10 Zehntausender sind 100 000."
                say: "Zehn Zehntausender sind hunderttausend. Stimmt das?"
                answer: true
                hints:
                  - "Zähl in Zehntausendern."
                  - "Neunzigtausend, dann hunderttausend."
                  - "Ja."
              - id: l1-f6
                type: multiple_choice
                text: "900 000, 800 000, 700 000, _"
                say: "Wie geht es weiter? Neunhunderttausend, achthunderttausend, siebenhunderttausend."
                options: ["600 000", "690 000", "710 000"]
                answer: "600 000"
                option_audio: false
                hints:
                  - "Die Zahlen werden kleiner."
                  - "Immer hunderttausend weniger."
                  - "Nach siebenhunderttausend kommt sechshunderttausend."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Zehntausender sind 70 000?"
                say: "Wie viele Zehntausender sind siebzigtausend?"
                options: ["7", "70", "700"]
                answer: "7"
                hints: ["Zähl in Zehntausendern."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie viele Tausender sind 500 000?"
                say: "Wie viele Tausender sind fünfhunderttausend?"
                options: ["5", "50", "500"]
                answer: "500"
                hints: ["Ein Hunderttausender sind hundert Tausender."]
              - id: l1-s3
                type: multiple_choice
                text: "300 000, 400 000, 500 000, _"
                say: "Wie geht es weiter? Dreihunderttausend, vierhunderttausend, fünfhunderttausend."
                options: ["510 000", "600 000", "501 000"]
                answer: "600 000"
                option_audio: false
                hints: ["Wie groß ist jeder Schritt?"]
              - id: l1-s4
                type: text_input
                text: "Wie viel sind 6 Zehntausender?"
                say: "Wie viel sind sechs Zehntausender? Schreib die Zahl."
                answer: "60000"
                hints: ["Ein Zehntausender sind zehntausend."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? 20 Tausender sind 200 000."
                say: "Zwanzig Tausender sind zweihunderttausend. Stimmt das?"
                answer: false
                hints: ["Zehn Tausender sind ein Zehntausender."]
              - id: l1-s6
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                say: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [4, 0, 0, 0, 0, 0] }
                options: ["4000", "40 000", "400 000"]
                answer: "400 000"
                option_audio: false
                hints: ["In welcher Spalte steht die 4?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Zehntausender sind 90 000?"
                say: "Wie viele Zehntausender sind neunzigtausend?"
                options: ["9", "90", "900"]
                answer: "9"
              - id: l1-n2
                type: multiple_choice
                text: "Wie viele Zehntausender sind 400 000?"
                say: "Wie viele Zehntausender sind vierhunderttausend?"
                options: ["4", "40", "400"]
                answer: "40"
              - id: l1-n3
                type: text_input
                text: "Wie viel sind 8 Hunderttausender?"
                say: "Wie viel sind acht Hunderttausender? Schreib die Zahl."
                answer: "800000"
              - id: l1-n4
                type: multiple_choice
                text: "20 000, 40 000, 60 000, _"
                say: "Wie geht es weiter? Zwanzigtausend, vierzigtausend, sechzigtausend."
                options: ["70 000", "80 000", "62 000"]
                answer: "80 000"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 100 000 + 100 000 + 100 000 = 300 000"
                say: "Hunderttausend plus hunderttausend plus hunderttausend gleich dreihunderttausend. Stimmt das?"
                answer: true
              - id: l1-n6
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                say: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [0, 5, 0, 0, 0, 0] }
                options: ["5000", "50 000", "500 000"]
                answer: "50 000"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Tausender sind 60 000?"
            say: "Wie viele Tausender sind sechzigtausend?"
            options: ["6", "60", "600"]
            answer: "60"
          - id: l1-c2
            type: multiple_choice
            text: "700 000, 800 000, 900 000, _"
            say: "Wie geht es weiter? Siebenhunderttausend, achthunderttausend, neunhunderttausend."
            options: ["910 000", "1 000 000", "901 000"]
            answer: "1 000 000"
            option_audio: false
          - id: l1-c3
            type: text_input
            text: "Wie viel sind 3 Hunderttausender?"
            say: "Wie viel sind drei Hunderttausender? Schreib die Zahl."
            answer: "300000"
          - id: l1-c4
            type: multiple_choice
            text: "Wie viele Zehntausender sind 300 000?"
            say: "Wie viele Zehntausender sind dreihunderttausend?"
            options: ["3", "30", "300"]
            answer: "30"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 10 Hunderttausender sind 1 000 000."
            say: "Zehn Hunderttausender sind eine Million. Stimmt das?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "70 000, 80 000, 90 000, _"
            say: "Wie geht es weiter? Siebzigtausend, achtzigtausend, neunzigtausend."
            options: ["100 000", "91 000", "900 000"]
            answer: "100 000"
            option_audio: false

  - n: 2
    title: { de: "HT, ZT, T, H, Z und E", en: "HTh, TTh, Th, H, T and O" }
    goal:
      de: "Trag sechsstellige Zahlen in die Stellentafel ein. In 248 731 ist die 4 vierzigtausend wert."
      en: "Put six-digit numbers into the place value chart. In 248,731 the 4 is worth forty thousand."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Zehntausender sind 50 000?"
            say: "Wie viele Zehntausender sind fünfzigtausend?"
            options: ["5", "50", "500"]
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Wie viel sind 2 Hunderttausender?"
            say: "Wie viel sind zwei Hunderttausender? Schreib die Zahl."
            answer: "200000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 HT, 4 ZT, 2 T, 6 H, 1 Z, 5 E"
            say: "Drei Hunderttausender, vier Zehntausender, zwei Tausender, sechs Hunderter, ein Zehner und fünf Einer. Jede Ziffer kommt in ihre Spalte."
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [3, 4, 2, 6, 1, 5] }
          - text: "342 615"
            say: "Große Zahlen schreibt man in Dreiergruppen, von rechts: sechshundertfünfzehn ist die rechte Gruppe, dreihundertzweiundvierzig die linke. Dazwischen steht eine kleine Lücke. Manchmal steht dort auch ein Punkt. Es ist dieselbe Zahl."
          - text: "342 615 = 300 000 + 40 000 + 2000 + 600 + 10 + 5"
            say: "Die Drei steht bei den Hunderttausendern, sie ist dreihunderttausend wert. Die Vier steht bei den Zehntausendern: vierzigtausend. Die Zwei bei den Tausendern: zweitausend."
          - text: "507 080"
            say: "Bei fünfhundertsiebentausendachtzig stehen bei den Zehntausendern, bei den Hundertern und bei den Einern Nullen. Ohne die Nullen stimmt keine Spalte mehr. Zähl immer nach: Die Zahl hat sechs Stellen."
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [5, 0, 7, 0, 8, 0] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                say: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [2, 5, 0, 3, 1, 8] }
                options: ["250 318", "25 318", "253 180"]
                answer: "250 318"
                option_audio: false
                feedback:
                  "25 318": "Die 2 steht bei den Hunderttausendern. Bei den Tausendern steht eine Null, die musst du mitschreiben: sechs Stellen."
                hints:
                  - "Lies von links nach rechts."
                  - "2 Hunderttausender, 5 Zehntausender, 0 Tausender, 3 Hunderter, 1 Zehner, 8 Einer."
                  - "Die Zahl ist 250 318."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Trag 604 950 in die Stellentafel ein."
                say: "Trag sechshundertviertausendneunhundertfünfzig in die Stellentafel ein."
                frame: "HT: _  ZT: _  T: _  H: _  Z: _  E: _"
                options: ["0", "4", "5", "6", "9"]
                answer: ["6", "0", "4", "9", "5", "0"]
                hints:
                  - "Die erste Ziffer gehört zu den Hunderttausendern."
                  - "6 Hunderttausender, 0 Zehntausender, 4 Tausender."
                  - "6, 0, 4, 9, 5, 0: von den Hunderttausendern bis zu den Einern."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viel ist die 4 in 248 731 wert?"
                say: "Wie viel ist die Vier in zweihundertachtundvierzigtausendsiebenhunderteinunddreißig wert?"
                options: ["4000", "40 000", "400 000"]
                answer: "40 000"
                option_audio: false
                feedback:
                  "4000": "Die 4 steht in der linken Dreiergruppe in der Mitte, also bei den Zehntausendern. Sie ist vierzigtausend wert."
                hints:
                  - "Schreib die Ziffern in die Stellentafel."
                  - "Die 4 steht bei den Zehntausendern."
                  - "Sie ist 40 000 wert."
              - id: l2-f4
                type: fill_in_blank
                text: "Zerlege 730 500."
                say: "Zerlege siebenhundertdreißigtausendfünfhundert in ihre Stellenwerte."
                frame: "730 500 = _ + _ + _"
                options: ["500", "30 000", "700 000", "3000"]
                answer: ["700 000", "30 000", "500"]
                hints:
                  - "Jede Ziffer, die keine Null ist, hat ihren Wert."
                  - "7 Hunderttausender, 3 Zehntausender, 5 Hunderter."
                  - "700 000 + 30 000 + 500."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 400 000 + 6000 + 20 = 406 020"
                say: "Vierhunderttausend plus sechstausend plus zwanzig gleich vierhundertsechstausendzwanzig. Stimmt das?"
                answer: true
                hints:
                  - "Welche Spalten sind leer?"
                  - "Bei den Zehntausendern, Hundertern und Einern steht 0."
                  - "Ja: 406 020."
              - id: l2-f6
                type: multiple_choice
                text: "Wo steht die Lücke richtig?"
                say: "Große Zahlen schreibt man in Dreiergruppen von rechts. Wo steht die Lücke richtig?"
                options: ["815 207", "81 5207", "8152 07"]
                answer: "815 207"
                option_audio: false
                hints:
                  - "Zähl von rechts drei Ziffern ab."
                  - "Die rechte Gruppe ist 207."
                  - "815 207."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                say: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [7, 0, 4, 0, 6, 2] }
                options: ["704 062", "74 062", "740 620"]
                answer: "704 062"
                option_audio: false
