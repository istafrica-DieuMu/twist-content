                frame: "HT: _  ZT: _  T: _  H: _  Z: _  E: _"
                options: ["0", "1", "3", "5", "9"]
                answer: ["0", "9", "0", "3", "1", "5"]
                hints: ["Wie viele Stellen hat die Zahl?"]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viel ist die 6 in 615 280 wert?"
                say: "Wie viel ist die Sechs in sechshundertfünfzehntausendzweihundertachtzig wert?"
                options: ["6000", "60 000", "600 000"]
                answer: "600 000"
                option_audio: false
                hints: ["In welcher Spalte steht die erste Ziffer einer sechsstelligen Zahl?"]
              - id: l2-s4
                type: text_input
