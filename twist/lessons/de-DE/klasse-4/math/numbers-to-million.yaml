      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welche Zahl steht in der Stellentafel?"
            say: "Welche Zahl steht in der Stellentafel?"
            show: { drawn: place-value-chart, columns: [hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], values: [1, 6, 0, 5, 0, 0] }
            options: ["160 500", "16 500", "165 000"]
            answer: "160 500"
