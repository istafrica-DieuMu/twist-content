            say: "Wusstest du? Eine Stunde hat dreitausendsechshundert Sekunden. Ein Tag hat vierundzwanzig Stunden, also vierundzwanzig mal dreitausendsechshundert Sekunden. Das sind sechsundachtzigtausendvierhundert Sekunden, jeden Tag!"
