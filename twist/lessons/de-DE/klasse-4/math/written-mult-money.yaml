# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.written-mult-money
skill: math.written-mult-div.mult-money
curriculum: de-DE
language: de
title:
  de: Geldbeträge malnehmen
  en: Multiplying amounts of money
summary: >
  Multiplying amounts in Euro with a decimal comma. Lesson 1 turns the
  amount into Cent, multiplies and turns the result back (3,45 € · 4 =
  345 ct · 4 = 1380 ct = 13,80 €); lesson 2 uses this for shopping and
  checks with a Überschlag, and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Schriftlich malnehmen, en: Written multiplication }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-mult-div.mult-one-digit, math.money.decimal-notation]
  also_practises: [math.written-mult-div.mult-one-digit, math.money.calculate]
  vocabulary: { de: [Euro, Cent, Komma, Geldbetrag, umrechnen, Überschlag] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: cent, what: { de: Geldbeträge in Cent umrechnen und malnehmen, en: changing amounts to cents and multiplying } }
    - { id: comma, what: { de: das Komma im Ergebnis richtig setzen, en: putting the decimal comma in the right place } }
    - { id: estimate, what: { de: mit einem Überschlag prüfen, en: checking with an estimate } }
    - { id: shopping, what: { de: Einkaufsaufgaben lösen, en: solving shopping problems } }
  misconceptions:
    - id: comma-in-wrong-place
      what: Puts the comma in the wrong place after multiplying (1,380 € or 138,0 €)
      addressed: lesson 1 Learn says the comma sits two places from the right, because 100 Cent are 1 Euro; every stage of lesson 1 offers the wrongly placed comma
    - id: cent-forgotten
      what: Multiplies only the Euro (3,45 € · 4 = 12,45 €)
      addressed: "l1-f4, l1-n4 and l2-s4 multiply only the Euro part; the Überschlag in lesson 2 catches it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "In Cent rechnen", en: "Working in cents" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Cent sind 2,50 €?"
            say: "Zwei Euro fünfzig. Wie viele Cent sind das?"
            options: ["250 ct", "25 ct", "2500 ct"]
            answer: "250 ct"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "265 · 3 = _"
            say: "Zweihundertfünfundsechzig mal drei."
            answer: "795"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3,45 € · 4"
            say: "Ein Heft kostet drei Euro fünfundvierzig. Wie viel kosten vier Hefte? Rechne den Betrag zuerst in Cent um: drei Euro fünfundvierzig sind dreihundertfünfundvierzig Cent."
          - text: "345 ct · 4 = 1380 ct"
            say: "Jetzt rechnest du schriftlich: Dreihundertfünfundvierzig mal vier ist tausenddreihundertachtzig. Das sind tausenddreihundertachtzig Cent."
          - text: "1380 ct = 13,80 €"
            say: "Hundert Cent sind ein Euro. Darum setzt du das Komma zwei Stellen von rechts: dreizehn Euro achtzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne in Cent."
                say: "Zwei Euro fünfzehn mal drei. Rechne in Cent und dann zurück in Euro."
                frame: "2,15 € · 3 = 215 ct · 3 = _ ct = _"
                options: ["645", "6,45 €", "64,50 €", "0,645 €"]
                answer: ["645", "6,45 €"]
                hints:
                  - "Zweihundertfünfzehn mal drei."
                  - "Das sind sechshundertfünfundvierzig Cent. Hundert Cent sind ein Euro."
                  - "645 ct und 6,45 €."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wo steht das Komma? 1750 ct = …"
                say: "Tausendsiebenhundertfünfzig Cent. Wie viele Euro sind das?"
                options: ["17,50 €", "1,750 €", "175,0 €"]
                answer: "17,50 €"
                feedback:
                  "1,750 €": "Das Komma steht zwei Stellen von rechts, weil hundert Cent ein Euro sind."
                hints:
                  - "Hundert Cent sind ein Euro."
                  - "Das Komma steht zwei Stellen von rechts."
                  - "17,50 €."
              - id: l1-f3
                type: text_input
                text: "1,25 € · 6 = _ ct"
                say: "Ein Euro fünfundzwanzig mal sechs. Wie viele Cent sind das?"
                answer: "750"
                hints:
                  - "Rechne zuerst in Cent um: hundertfünfundzwanzig Cent."
                  - "Hundertfünfundzwanzig mal sechs."
                  - "750 ct."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 3,45 € · 2 = 6,45 €"
                say: "Drei Euro fünfundvierzig mal zwei ist sechs Euro fünfundvierzig. Stimmt das?"
                answer: false
                hints:
                  - "Hast du auch die Cent malgenommen?"
                  - "Dreihundertfünfundvierzig Cent mal zwei sind sechshundertneunzig Cent."
                  - "Nein. 3,45 € · 2 = 6,90 €."
              - id: l1-f5
                type: fill_in_blank
                text: "Ein Brot kostet 2,80 €. Wie viel kosten 3 Brote?"
                say: "Ein Brot kostet zwei Euro achtzig. Wie viel kosten drei Brote?"
                frame: "2,80 € · 3 = _"
                options: ["8,40 €", "6,80 €", "84,0 €"]
                answer: ["8,40 €"]
                hints:
                  - "Rechne in Cent: zweihundertachtzig mal drei."
                  - "Achthundertvierzig Cent."
                  - "8,40 €."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne in Cent."
                say: "Vier Euro zwanzig mal zwei. Rechne in Cent und dann zurück in Euro."
                frame: "4,20 € · 2 = 420 ct · 2 = _ ct = _"
                options: ["840", "8,40 €", "84,00 €"]
                answer: ["840", "8,40 €"]
                hints: ["Hundert Cent sind ein Euro."]
              - id: l1-s2
                type: multiple_choice
                text: "Wo steht das Komma? 2385 ct = …"
                say: "Zweitausenddreihundertfünfundachtzig Cent. Wie viele Euro sind das?"
                options: ["23,85 €", "2,385 €", "238,5 €"]
                answer: "23,85 €"
                hints: ["Das Komma steht zwei Stellen von rechts."]
              - id: l1-s3
                type: text_input
                text: "1,60 € · 5 = _ ct"
                say: "Ein Euro sechzig mal fünf. Wie viele Cent sind das?"
                answer: "800"
                hints: ["Hundertsechzig Cent mal fünf."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 2,50 € · 4 = 10,00 €"
                say: "Zwei Euro fünfzig mal vier ist zehn Euro. Stimmt das?"
                answer: true
                hints: ["Zweihundertfünfzig Cent mal vier."]
              - id: l1-s5
                type: fill_in_blank
                text: "Eine Kugel Eis kostet 1,35 €. Wie viel kosten 4 Kugeln?"
                say: "Eine Kugel Eis kostet einen Euro fünfunddreißig. Wie viel kosten vier Kugeln?"
                frame: "1,35 € · 4 = _"
                options: ["5,40 €", "4,35 €", "54,0 €"]
                answer: ["5,40 €"]
                hints: ["Hundertfünfunddreißig Cent mal vier."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne in Cent."
                say: "Drei Euro fünfundsiebzig mal drei. Rechne in Cent und dann zurück in Euro."
                frame: "3,75 € · 3 = 375 ct · 3 = _ ct = _"
                options: ["1125", "11,25 €", "1,125 €"]
                answer: ["1125", "11,25 €"]
              - id: l1-n2
                type: multiple_choice
                text: "Wo steht das Komma? 905 ct = …"
                say: "Neunhundertfünf Cent. Wie viele Euro sind das?"
                options: ["9,05 €", "90,5 €", "9,50 €"]
                answer: "9,05 €"
              - id: l1-n3
                type: text_input
                text: "2,45 € · 4 = _ ct"
                say: "Zwei Euro fünfundvierzig mal vier. Wie viele Cent sind das?"
                answer: "980"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 4,15 € · 3 = 12,15 €"
                say: "Vier Euro fünfzehn mal drei ist zwölf Euro fünfzehn. Stimmt das?"
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Eine Flasche Saft kostet 0,95 €. Wie viel kosten 6 Flaschen?"
                say: "Eine Flasche Saft kostet fünfundneunzig Cent. Wie viel kosten sechs Flaschen?"
                frame: "0,95 € · 6 = _"
                options: ["5,70 €", "6,95 €", "57,0 €"]
                answer: ["5,70 €"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "1,85 € · 4 = _ ct"
            say: "Ein Euro fünfundachtzig mal vier. Wie viele Cent sind das?"
            answer: "740"
          - id: l1-c2
            type: multiple_choice
            text: "Wo steht das Komma? 1260 ct = …"
            say: "Tausendzweihundertsechzig Cent. Wie viele Euro sind das?"
            options: ["12,60 €", "1,260 €", "126,0 €"]
            answer: "12,60 €"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 2,25 € · 3 = 6,75 €"
            say: "Zwei Euro fünfundzwanzig mal drei ist sechs Euro fünfundsiebzig. Stimmt das?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Rechne in Cent."
            say: "Drei Euro zwanzig mal vier. Rechne in Cent und dann zurück in Euro."
            frame: "3,20 € · 4 = 320 ct · 4 = _ ct = _"
            options: ["1280", "12,80 €", "1,280 €"]
            answer: ["1280", "12,80 €"]
          - id: l1-c5
            type: multiple_choice
            text: "Wo steht das Komma? 1505 ct = …"
            say: "Tausendfünfhundertfünf Cent. Wie viele Euro sind das?"
            options: ["15,05 €", "1,505 €", "15,50 €"]
            answer: "15,05 €"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 2,40 € · 3 = 6,40 €"
            say: "Zwei Euro vierzig mal drei ist sechs Euro vierzig. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Einkaufen", en: "Shopping" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo steht das Komma? 640 ct = …"
            say: "Sechshundertvierzig Cent. Wie viele Euro sind das?"
            options: ["6,40 €", "64,0 €", "0,64 €"]
            answer: "6,40 €"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "1,20 € · 5 = _ ct"
            say: "Ein Euro zwanzig mal fünf. Wie viele Cent sind das?"
            answer: "600"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4,95 € · 6 ≈ 5 € · 6 = 30 €"
            say: "Ein Spielzeugauto kostet vier Euro fünfundneunzig. Mach zuerst einen Überschlag: Das ist fast fünf Euro. Sechs Autos kosten ungefähr dreißig Euro."
          - text: "495 ct · 6 = 2970 ct = 29,70 €"
            say: "Genau gerechnet: vierhundertfünfundneunzig Cent mal sechs sind zweitausendneunhundertsiebzig Cent, also neunundzwanzig Euro siebzig. Das passt zum Überschlag."
          - text: "50 € − 29,70 € = 20,30 €"
            say: "Zahlst du mit einem Fünfzig-Euro-Schein, bekommst du zwanzig Euro dreißig zurück."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ein Buch kostet 7,90 €. Welcher Überschlag passt für 3 Bücher?"
                say: "Ein Buch kostet sieben Euro neunzig. Welcher Überschlag passt für drei Bücher?"
                options: ["8 € · 3 = 24 €", "7 € · 3 = 21 €", "10 € · 3 = 30 €"]
                answer: "8 € · 3 = 24 €"
                hints:
                  - "Runde den Preis auf ganze Euro."
                  - "Sieben Euro neunzig ist fast acht Euro."
                  - "8 € · 3 = 24 €."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Ein Buch kostet 7,90 €. Wie viel kosten 3 Bücher?"
                say: "Ein Buch kostet sieben Euro neunzig. Wie viel kosten drei Bücher genau?"
                frame: "7,90 € · 3 = _"
                options: ["23,70 €", "21,90 €", "2,370 €"]
                answer: ["23,70 €"]
                hints:
                  - "Rechne in Cent: siebenhundertneunzig mal drei."
                  - "Zweitausenddreihundertsiebzig Cent."
                  - "23,70 €."
              - id: l2-f3
                type: text_input
                text: "Ein Stift kostet 0,85 €. Wie viele Cent kosten 8 Stifte?"
                say: "Ein Stift kostet fünfundachtzig Cent. Wie viele Cent kosten acht Stifte?"
                answer: "680"
                hints:
                  - "Fünfundachtzig mal acht."
                  - "Achtzig mal acht und fünf mal acht."
                  - "680 ct."
              - id: l2-f4
                type: true_false
                text: "Kann 4 · 2,99 € = 8,99 € stimmen?"
                say: "Vier mal zwei Euro neunundneunzig ist acht Euro neunundneunzig. Kann das stimmen?"
                answer: false
                hints:
                  - "Mach einen Überschlag."
                  - "Zwei Euro neunundneunzig ist fast drei Euro. Vier mal drei Euro sind zwölf Euro."
                  - "Nein. Richtig ist 11,96 €."
              - id: l2-f5
                type: fill_in_blank
                text: "Lena kauft 2 T-Shirts zu je 8,50 € und zahlt mit 20 €. Wie viel bekommt sie zurück?"
                say: "Lena kauft zwei T-Shirts. Jedes kostet acht Euro fünfzig. Sie zahlt mit einem Zwanzig-Euro-Schein. Wie viel Geld bekommt sie zurück?"
                frame: "20 € − _ = _"
                options: ["17,00 €", "3,00 €", "11,50 €"]
                answer: ["17,00 €", "3,00 €"]
                hints:
                  - "Rechne zuerst, was die zwei T-Shirts kosten."
                  - "Acht Euro fünfzig mal zwei sind siebzehn Euro."
                  - "17,00 € und 3,00 €."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ein Ball kostet 12,95 €. Welcher Überschlag passt für 4 Bälle?"
                say: "Ein Ball kostet zwölf Euro fünfundneunzig. Welcher Überschlag passt für vier Bälle?"
                options: ["13 € · 4 = 52 €", "12 € · 4 = 48 €", "20 € · 4 = 80 €"]
                answer: "13 € · 4 = 52 €"
                hints: ["Runde den Preis auf ganze Euro."]
              - id: l2-s2
                type: fill_in_blank
                text: "Ein Ball kostet 12,95 €. Wie viel kosten 4 Bälle?"
                say: "Ein Ball kostet zwölf Euro fünfundneunzig. Wie viel kosten vier Bälle genau?"
                frame: "12,95 € · 4 = _"
                options: ["51,80 €", "48,95 €", "5,180 €"]
                answer: ["51,80 €"]
                hints: ["Tausendzweihundertfünfundneunzig Cent mal vier."]
              - id: l2-s3
                type: text_input
                text: "Ein Brötchen kostet 0,45 €. Wie viele Cent kosten 7 Brötchen?"
                say: "Ein Brötchen kostet fünfundvierzig Cent. Wie viele Cent kosten sieben Brötchen?"
                answer: "315"
                hints: ["Fünfundvierzig mal sieben."]
              - id: l2-s4
                type: true_false
                text: "Kann 5 · 3,80 € = 15,80 € stimmen?"
                say: "Fünf mal drei Euro achtzig ist fünfzehn Euro achtzig. Kann das stimmen?"
                answer: false
                hints: ["Mach einen Überschlag: Drei Euro achtzig ist fast vier Euro."]
              - id: l2-s5
                type: fill_in_blank
                text: "Tim kauft 3 Hefte zu je 1,50 € und zahlt mit 10 €. Wie viel bekommt er zurück?"
                say: "Tim kauft drei Hefte. Jedes kostet einen Euro fünfzig. Er zahlt mit einem Zehn-Euro-Schein. Wie viel Geld bekommt er zurück?"
                frame: "10 € − _ = _"
                options: ["4,50 €", "5,50 €", "8,50 €"]
                answer: ["4,50 €", "5,50 €"]
                hints: ["Rechne zuerst, was die drei Hefte kosten."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ein Spiel kostet 19,90 €. Welcher Überschlag passt für 3 Spiele?"
                say: "Ein Spiel kostet neunzehn Euro neunzig. Welcher Überschlag passt für drei Spiele?"
                options: ["20 € · 3 = 60 €", "19 € · 3 = 57 €", "10 € · 3 = 30 €"]
                answer: "20 € · 3 = 60 €"
              - id: l2-n2
                type: fill_in_blank
                text: "Ein Spiel kostet 19,90 €. Wie viel kosten 3 Spiele?"
                say: "Ein Spiel kostet neunzehn Euro neunzig. Wie viel kosten drei Spiele genau?"
                frame: "19,90 € · 3 = _"
                options: ["59,70 €", "57,90 €", "5,970 €"]
                answer: ["59,70 €"]
              - id: l2-n3
                type: text_input
                text: "Eine Postkarte kostet 0,65 €. Wie viele Cent kosten 9 Karten?"
                say: "Eine Postkarte kostet fünfundsechzig Cent. Wie viele Cent kosten neun Postkarten?"
                answer: "585"
              - id: l2-n4
                type: true_false
                text: "Kann 6 · 4,98 € = 29,88 € stimmen?"
                say: "Sechs mal vier Euro achtundneunzig ist neunundzwanzig Euro achtundachtzig. Kann das stimmen?"
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Mia kauft 4 Säfte zu je 1,25 € und zahlt mit 10 €. Wie viel bekommt sie zurück?"
                say: "Mia kauft vier Säfte. Jeder kostet einen Euro fünfundzwanzig. Sie zahlt mit einem Zehn-Euro-Schein. Wie viel Geld bekommt sie zurück?"
                frame: "10 € − _ = _"
                options: ["5,00 €", "5,25 €", "8,75 €"]
                answer: ["5,00 €", "5,00 €"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: cent
            type: fill_in_blank
            text: "Rechne in Cent."
            say: "Zwei Euro fünfunddreißig mal vier. Rechne in Cent und dann zurück in Euro."
            frame: "2,35 € · 4 = 235 ct · 4 = _ ct = _"
            options: ["940", "9,40 €", "94,00 €"]
            answer: ["940", "9,40 €"]
          - id: l2-c2
            part: estimate
            type: multiple_choice
            text: "Ein Kuscheltier kostet 9,95 €. Welcher Überschlag passt für 5 Kuscheltiere?"
            say: "Ein Kuscheltier kostet neun Euro fünfundneunzig. Welcher Überschlag passt für fünf Kuscheltiere?"
            options: ["10 € · 5 = 50 €", "9 € · 5 = 45 €", "5 € · 5 = 25 €"]
            answer: "10 € · 5 = 50 €"
          - id: l2-c3
            part: shopping
            type: text_input
            text: "Ein Apfel kostet 0,35 €. Wie viele Cent kosten 8 Äpfel?"
            say: "Ein Apfel kostet fünfunddreißig Cent. Wie viele Cent kosten acht Äpfel?"
            answer: "280"
          - id: l2-c4
            part: cent
            type: true_false
            text: "Stimmt das? 3 · 6,40 € = 19,20 €"
            say: "Drei mal sechs Euro vierzig ist neunzehn Euro zwanzig. Stimmt das?"
            answer: true
          - id: l2-c5
