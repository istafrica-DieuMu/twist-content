            say: "Vier Euro fünfundsechzig mal drei. Rechne in Cent und dann zurück in Euro."
            frame: "4,65 € · 3 = 465 ct · 3 = _ ct = _"
            options: ["1395", "13,95 €", "1,395 €", "12,95 €"]
            answer: ["1395", "13,95 €"]
          - id: l2-c7
