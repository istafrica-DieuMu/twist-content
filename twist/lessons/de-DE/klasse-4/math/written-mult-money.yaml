            text: "Wo steht das Komma? 3045 ct = …"
            say: "Dreitausendfünfundvierzig Cent. Wie viele Euro sind das?"
            options: ["30,45 €", "3,045 €", "304,5 €"]
            answer: "30,45 €"
          - id: l2-c6
