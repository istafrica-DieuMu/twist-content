            say: "Dreiundsechzigtausend geteilt durch neun ist siebenhundert. Stimmt das?"
            answer: false
          - id: l2-c17
            part: divide-tens
            type: multiple_choice
            text: "3600 : 90 = ?"
            say: "Dreitausendsechshundert geteilt durch neunzig. Wie viel ist das?"
            options: ["4", "40", "400"]
            answer: "40"
          - id: l2-c18
            part: divide-tens
            type: text_input
            text: "3000 : 50 = _"
            say: "Dreitausend geteilt durch fünfzig."
            answer: "60"
          - id: l2-c19
            part: divide-tens
            type: true_false
            text: "Stimmt das? 5600 : 70 = 80"
            say: "Fünftausendsechshundert geteilt durch siebzig ist achtzig. Stimmt das?"
            answer: true
          - id: l2-c20
            part: divide-tens
            type: fill_in_blank
            text: "Das Einmaleins hilft."
            say: "Rechne zuerst achtundvierzig geteilt durch sechs, dann viertausendachthundert geteilt durch sechzig."
            frame: "48 : 6 = _ | 4800 : 60 = _"
