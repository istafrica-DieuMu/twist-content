# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.large-mult-mental
skill: math.mult-div-larger.large-mental
curriculum: de-DE
language: de
title:
  de: Mit runden Zahlen malnehmen und teilen
  en: Multiplying and dividing with round numbers
summary: >
  Mental multiplication and division with round numbers, helped by a
  small times-table fact. Lesson 1 multiplies (3 · 400, 40 · 300) by
  using 3 · 4 and counting the zeros, including the trap 50 · 60 = 3000;
  lesson 2 divides (36 000 : 9, 2400 : 60) by using 36 : 9 and 240 : 6,
  and ends with the skill check. Typed answers are plain digits.
metadata:
  year: klasse-4
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.tens, math.large-numbers.to-million]
  also_practises: [math.large-numbers.to-million]
  vocabulary: { de: [malnehmen, teilen, runde Zahl, Nullen, Einmaleins] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  parts:
    - { id: multiply, what: { de: mit runden Zahlen malnehmen und die Nullen zählen, en: multiplying round numbers and counting the zeros } }
    - { id: zero-fact, what: { de: malnehmen mit einer Einmaleins-Aufgabe mit Null (50 · 60), en: multiplying when the small fact ends in zero (50 × 60) } }
    - { id: divide-one, what: { de: eine runde Zahl durch eine einstellige Zahl teilen, en: dividing a round number by a one-digit number } }
    - { id: divide-tens, what: { de: durch eine Zehnerzahl teilen, en: dividing by a multiple of ten } }
  misconceptions:
    - id: count-zeros-wrong
      what: Writes the wrong number of zeros (40 · 300 = 1200)
      addressed: lesson 1 Learn counts the zeros of both numbers; a wrong-zeros option in every stage, with feedback in l1-f1
    - id: zero-in-fact
      what: Loses the zero that comes from the small fact (50 · 60 = 300)
      addressed: lesson 1 Learn shows 5 · 6 = 30 and then two more zeros; a fact ending in 0 in every stage of lesson 1 (40 · 50, 50 · 80, 20 · 500), with feedback in l1-f3
    - id: divide-zeros
      what: "When dividing by a Zehnerzahl, keeps all the zeros (2400 : 60 = 400)"
      addressed: lesson 2 Learn takes one zero away from both numbers first; such a task in every stage of lesson 2, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Malnehmen mit runden Zahlen, en: Multiplying round numbers }
    goal:
      de: "Nimm runde Zahlen im Kopf mal. Für 40 mal 300 rechnest du 4 mal 3 und hängst drei Nullen an."
      en: "Multiply round numbers in your head. For 40 times 300, work out 4 times 3 and add three zeros."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 · 7 = _"
            say: "Sechs mal sieben."
            answer: "42"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "8 · 30 = _"
            say: "Acht mal dreißig."
            answer: "240"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was glaubst du? 50 · 60: Wie viele Nullen hat das Ergebnis, zwei oder drei?"
            say: "Fünfzig mal sechzig. Was glaubst du: Wie viele Nullen hat das Ergebnis? Zwei oder drei?"
          - text: "3 · 400 = 1200"
            say: "Das findest du gleich heraus. Erst ein leichtes Beispiel: Drei mal vierhundert. Rechne zuerst drei mal vier, das ist zwölf. Vierhundert hat zwei Nullen, also hängst du an die Zwölf zwei Nullen an. Das ist tausendzweihundert."
          - text: "40 · 300 = 12 000"
            say: "Vierzig mal dreihundert. Vier mal drei ist zwölf. Zähl die Nullen von beiden Zahlen: eine und zwei, zusammen drei. Zwölf mit drei Nullen ist zwölftausend."
          - text: "50 · 60 = 3000"
            say: "Und jetzt fünfzig mal sechzig. Pass auf: Fünf mal sechs ist dreißig. Die Null von dreißig bleibt, und die zwei Nullen kommen noch dazu. Das ist dreitausend, mit drei Nullen!"
          - text: "Wusstest du? Licht schafft in einer Sekunde fast 300 000 km."
            say: "Wusstest du? Nichts ist so schnell wie Licht. In einer einzigen Sekunde schafft es fast dreihunderttausend Kilometer. In zwei Sekunden sind das fast zwei mal dreihunderttausend, also sechshunderttausend Kilometer!"
            show: { object: light-bulb }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "20 · 400 = ?"
                say: "Zwanzig mal vierhundert. Wie viel ist das?"
                options: ["8000", "800", "80 000"]
                answer: "8000"
                feedback:
                  "800": "Zwanzig hat eine Null und vierhundert zwei. Zusammen drei Nullen: 8000."
                  "80 000": "Das ist eine Null zu viel. Zwei mal vier ist acht, dazu drei Nullen: 8000."
                hints:
                  - "Rechne zuerst zwei mal vier."
                  - "Zähl die Nullen von beiden Zahlen."
                  - "Acht mit drei Nullen: 8000."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Das Einmaleins hilft."
                say: "Rechne zuerst sieben mal sechs, dann sieben mal sechshundert."
                frame: "7 · 6 = _ | 7 · 600 = _"
                options: ["42", "420", "4200", "42 000"]
                answer: ["42", "4200"]
                hints:
                  - "Sieben mal sechs ist zweiundvierzig."
                  - "Sechshundert hat zwei Nullen."
                  - "42 und 4200."
              - id: l1-f3
                type: multiple_choice
                text: "40 · 50 = ?"
                say: "Vierzig mal fünfzig. Wie viel ist das?"
                options: ["2000", "200", "20 000"]
                answer: "2000"
                feedback:
                  "200": "Vier mal fünf ist zwanzig, das hat schon eine Null. Dazu kommen die zwei Nullen von vierzig und fünfzig: 2000."
                hints:
                  - "Vier mal fünf ist zwanzig."
                  - "Die Null von zwanzig bleibt. Dann kommen noch zwei Nullen dazu."
                  - "2000."
              - id: l1-f4
                type: text_input
                text: "Ein Bauer füllt 9 Kisten mit je 300 Äpfeln. Wie viele Äpfel sind das?"
                say: "Ein Bauer füllt neun Kisten mit je dreihundert Äpfeln. Wie viele Äpfel sind das?"
                show: { object: apple }
                answer: "2700"
                hints:
                  - "Neun mal drei ist siebenundzwanzig."
                  - "Hänge zwei Nullen an."
                  - "2700."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 60 · 700 = 42 000"
                say: "Sechzig mal siebenhundert ist zweiundvierzigtausend. Stimmt das?"
                answer: true
                hints:
                  - "Sechs mal sieben ist zweiundvierzig."
                  - "Zähl die Nullen: eine und zwei."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "30 · 600 = ?"
                say: "Dreißig mal sechshundert. Wie viel ist das?"
                options: ["1800", "18 000", "180 000"]
                answer: "18 000"
                hints: ["Wie viele Nullen haben beide Zahlen zusammen?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Das Einmaleins hilft."
                say: "Rechne zuerst acht mal vier, dann achtzig mal vierhundert."
                frame: "8 · 4 = _ | 80 · 400 = _"
                options: ["32", "3200", "32 000", "320 000"]
                answer: ["32", "32 000"]
                hints: ["Zähl die Nullen beider Zahlen."]
              - id: l1-s3
                type: multiple_choice
                text: "50 · 80 = ?"
                say: "Fünfzig mal achtzig. Wie viel ist das?"
                options: ["400", "4000", "40 000"]
                answer: "4000"
                hints: ["Fünf mal acht ist vierzig. Hat das schon eine Null?"]
              - id: l1-s4
                type: text_input
                text: "4 · 900 = _"
                say: "Vier mal neunhundert."
                answer: "3600"
                hints: ["Rechne zuerst vier mal neun."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? 70 · 300 = 2100"
                say: "Siebzig mal dreihundert ist zweitausendeinhundert. Stimmt das?"
                answer: false
                hints: ["Hast du alle Nullen gezählt?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "90 · 200 = ?"
                say: "Neunzig mal zweihundert. Wie viel ist das?"
                options: ["180 000", "1800", "18 000"]
                answer: "18 000"
              - id: l1-n2
                type: fill_in_blank
                text: "Das Einmaleins hilft."
                say: "Rechne zuerst sechs mal neun, dann sechs mal neuntausend."
                frame: "6 · 9 = _ | 6 · 9000 = _"
                options: ["54", "5400", "54 000", "540 000"]
                answer: ["54", "54 000"]
              - id: l1-n3
                type: multiple_choice
                text: "20 · 500 = ?"
                say: "Zwanzig mal fünfhundert. Wie viel ist das?"
                options: ["10 000", "1000", "100 000"]
                answer: "10 000"
              - id: l1-n4
                type: text_input
                text: "Die Bäckerei backt eine Woche lang jeden Tag 800 Brötchen. Wie viele Brötchen sind das in 7 Tagen?"
                say: "Die Bäckerei backt eine Woche lang jeden Tag achthundert Brötchen. Wie viele Brötchen sind das in sieben Tagen?"
                show: { object: bread }
                answer: "5600"
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 80 · 500 = 40 000"
                say: "Achtzig mal fünfhundert ist vierzigtausend. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "30 · 700 = ?"
            say: "Dreißig mal siebenhundert. Wie viel ist das?"
            options: ["2100", "21 000", "210 000"]
            answer: "21 000"
          - id: l1-c2
            type: text_input
            text: "8 · 600 = _"
            say: "Acht mal sechshundert."
            answer: "4800"
          - id: l1-c3
            type: multiple_choice
            text: "20 · 50 = ?"
            say: "Zwanzig mal fünfzig. Wie viel ist das?"
            options: ["100", "1000", "10 000"]
            answer: "1000"
          - id: l1-c4
            type: fill_in_blank
            text: "Das Einmaleins hilft."
            say: "Rechne zuerst neun mal vier, dann neunzig mal vierhundert."
            frame: "9 · 4 = _ | 90 · 400 = _"
            options: ["36", "3600", "36 000", "360 000"]
            answer: ["36", "36 000"]
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 60 · 50 = 300"
            say: "Sechzig mal fünfzig ist dreihundert. Stimmt das?"
            answer: false
          - id: l1-c6
            type: text_input
            text: "3 · 8000 = _"
            say: "Drei mal achttausend."
            answer: "24000"

  - n: 2
    title: { de: Teilen mit runden Zahlen, en: Dividing round numbers }
    goal:
      de: "Teile runde Zahlen im Kopf mit dem Einmaleins. Weil 36 durch 9 gleich 4 ist, ist 36 000 durch 9 gleich 4000."
      en: "Divide round numbers in your head with your times tables. Because 36 divided by 9 is 4, 36,000 divided by 9 is 4000."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "5 · 700 = _"
            say: "Fünf mal siebenhundert."
            answer: "3500"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "54 : 6 = _"
            say: "Vierundfünfzig geteilt durch sechs."
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du? 28 000 : 7: Welche Aufgabe aus dem Einmaleins hilft dir?"
            say: "Achtundzwanzigtausend geteilt durch sieben. Was glaubst du: Welche Aufgabe aus dem Einmaleins hilft dir?"
          - text: "28 000 : 7 = 4000"
            say: "Achtundzwanzig geteilt durch sieben! Achtundzwanzigtausend geteilt durch sieben. Denk an achtundzwanzig geteilt durch sieben, das ist vier. Achtundzwanzig Tausender durch sieben sind vier Tausender: viertausend."
          - text: "3500 : 50 = 70"
            say: "Dreitausendfünfhundert geteilt durch fünfzig. Streich bei beiden Zahlen eine Null: dreihundertfünfzig geteilt durch fünf ist siebzig."
          - text: "Probe: 70 · 50 = 3500"
            say: "Mit der Probe prüfst du: siebzig mal fünfzig ist dreitausendfünfhundert. Das stimmt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "36 000 : 9 = ?"
                say: "Sechsunddreißigtausend geteilt durch neun. Wie viel ist das?"
                options: ["4000", "400", "40 000"]
                answer: "4000"
                hints:
                  - "Denk an sechsunddreißig geteilt durch neun."
                  - "Sechsunddreißig Tausender geteilt durch neun sind vier Tausender."
                  - "4000."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Das Einmaleins hilft."
                say: "Rechne zuerst zweiundvierzig geteilt durch sechs, dann viertausendzweihundert geteilt durch sechs."
                frame: "42 : 6 = _ | 4200 : 6 = _"
                options: ["7", "70", "700", "7000"]
                answer: ["7", "700"]
                hints:
                  - "Zweiundvierzig durch sechs ist sieben."
                  - "Zweiundvierzig Hunderter durch sechs sind sieben Hunderter."
                  - "7 und 700."
              - id: l2-f3
                type: multiple_choice
                text: "2400 : 60 = ?"
                say: "Zweitausendvierhundert geteilt durch sechzig. Wie viel ist das?"
                options: ["40", "400", "4", "ein Elefant"]
                answer: "40"
                feedback:
                  "ein Elefant": "Ein Elefant passt hier wirklich nicht hinein! Streich bei beiden Zahlen eine Null: 240 : 6 = 40."
                  "400": "Streich zuerst bei beiden Zahlen eine Null: zweihundertvierzig durch sechs ist vierzig."
                hints:
                  - "Streich bei beiden Zahlen eine Null."
                  - "Zweihundertvierzig geteilt durch sechs."
                  - "40."
              - id: l2-f4
                type: text_input
                text: "Ein Hof verteilt 5600 Eier gleichmäßig auf 8 Läden. Wie viele Eier bekommt jeder Laden?"
                say: "Ein Hof verteilt fünftausendsechshundert Eier gleichmäßig auf acht Läden. Wie viele Eier bekommt jeder Laden?"
                show: { object: egg }
                answer: "700"
                hints:
                  - "Denk an sechsundfünfzig geteilt durch acht."
                  - "Das sind sieben Hunderter."
                  - "700."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 4500 : 90 = 50"
                say: "Viertausendfünfhundert geteilt durch neunzig ist fünfzig. Stimmt das?"
                answer: true
                hints:
                  - "Streich bei beiden Zahlen eine Null."
                  - "Vierhundertfünfzig durch neun."
                  - "Ja, das stimmt. Probe: 50 · 90 = 4500."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "48 000 : 8 = ?"
                say: "Achtundvierzigtausend geteilt durch acht. Wie viel ist das?"
                options: ["600", "6000", "60 000"]
                answer: "6000"
                hints: ["Welche Einmaleins-Aufgabe steckt darin?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Das Einmaleins hilft."
                say: "Rechne zuerst einundzwanzig geteilt durch drei, dann zweitausendeinhundert geteilt durch dreißig."
                frame: "21 : 3 = _ | 2100 : 30 = _"
                options: ["7", "70", "700", "7000"]
                answer: ["7", "70"]
                hints: ["Streich bei beiden Zahlen eine Null."]
              - id: l2-s3
                type: multiple_choice
                text: "3200 : 40 = ?"
                say: "Dreitausendzweihundert geteilt durch vierzig. Wie viel ist das?"
                options: ["800", "8", "80"]
                answer: "80"
                hints: ["Streich zuerst eine Null bei beiden Zahlen."]
              - id: l2-s4
                type: text_input
                text: "6300 : 9 = _"
                say: "Sechstausenddreihundert geteilt durch neun."
                answer: "700"
                hints: ["Denk an dreiundsechzig geteilt durch neun."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? 1800 : 30 = 600"
                say: "Tausendachthundert geteilt durch dreißig ist sechshundert. Stimmt das?"
                answer: false
                hints: ["Mach die Probe: sechshundert mal dreißig."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "54 000 : 6 = ?"
                say: "Vierundfünfzigtausend geteilt durch sechs. Wie viel ist das?"
                options: ["9000", "900", "90 000"]
                answer: "9000"
              - id: l2-n2
                type: fill_in_blank
                text: "Das Einmaleins hilft."
                say: "Rechne zuerst vierundzwanzig geteilt durch vier, dann zweitausendvierhundert geteilt durch vierzig."
                frame: "24 : 4 = _ | 2400 : 40 = _"
                options: ["6", "60", "600", "6000"]
                answer: ["6", "60"]
              - id: l2-n3
                type: multiple_choice
                text: "4900 : 70 = ?"
                say: "Viertausendneunhundert geteilt durch siebzig. Wie viel ist das?"
                options: ["7", "700", "70"]
                answer: "70"
              - id: l2-n4
                type: text_input
                text: "7200 : 8 = _"
                say: "Siebentausendzweihundert geteilt durch acht."
                answer: "900"
              - id: l2-n5
                type: true_false
                text: "Stimmt das? 6000 : 20 = 300"
                say: "Sechstausend geteilt durch zwanzig ist dreihundert. Stimmt das?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: multiply
            type: multiple_choice
            text: "60 · 400 = ?"
            say: "Sechzig mal vierhundert. Wie viel ist das?"
            options: ["2400", "24 000", "240 000"]
            answer: "24 000"
          - id: l2-c2
            part: zero-fact
            type: multiple_choice
            text: "40 · 500 = ?"
            say: "Vierzig mal fünfhundert. Wie viel ist das?"
            options: ["2000", "20 000", "200 000"]
            answer: "20 000"
          - id: l2-c3
            part: divide-one
            type: text_input
            text: "27 000 : 3 = _"
            say: "Siebenundzwanzigtausend geteilt durch drei."
            answer: "9000"
          - id: l2-c4
            part: divide-tens
            type: multiple_choice
            text: "2800 : 40 = ?"
            say: "Zweitausendachthundert geteilt durch vierzig. Wie viel ist das?"
            options: ["70", "700", "7"]
            answer: "70"
          - id: l2-c5
            part: multiply
            type: true_false
            text: "Stimmt das? 30 · 900 = 2700"
            say: "Dreißig mal neunhundert ist zweitausendsiebenhundert. Stimmt das?"
            answer: false
          - id: l2-c6
            part: multiply
            type: text_input
            text: "70 · 80 = _"
            say: "Siebzig mal achtzig."
            answer: "5600"
          - id: l2-c7
            part: multiply
            type: true_false
            text: "Stimmt das? 9 · 7000 = 63 000"
            say: "Neun mal siebentausend ist dreiundsechzigtausend. Stimmt das?"
            answer: true
          - id: l2-c8
            part: multiply
            type: multiple_choice
            text: "300 · 300 = ?"
            say: "Dreihundert mal dreihundert. Wie viel ist das?"
            options: ["9000", "90 000", "900 000"]
            answer: "90 000"
          - id: l2-c9
            part: zero-fact
            type: multiple_choice
            text: "40 · 5000 = ?"
            say: "Vierzig mal fünftausend. Wie viel ist das?"
            options: ["20 000", "200 000", "2 000 000"]
            answer: "200 000"
          - id: l2-c10
            part: zero-fact
            type: text_input
            text: "5 · 800 = _"
            say: "Fünf mal achthundert."
            answer: "4000"
          - id: l2-c11
            part: zero-fact
            type: true_false
            text: "Stimmt das? 20 · 5000 = 100 000"
            say: "Zwanzig mal fünftausend ist hunderttausend. Stimmt das?"
            answer: true
          - id: l2-c12
            part: zero-fact
            type: fill_in_blank
            text: "Das Einmaleins hilft."
            say: "Rechne zuerst sechs mal fünf, dann sechshundert mal fünfzig."
            frame: "6 · 5 = _ | 600 · 50 = _"
            options: ["30", "3000", "30 000", "300 000"]
            answer: ["30", "30 000"]
          - id: l2-c13
            part: divide-one
            type: multiple_choice
            text: "42 000 : 6 = ?"
            say: "Zweiundvierzigtausend geteilt durch sechs. Wie viel ist das?"
            options: ["700", "7000", "70 000"]
            answer: "7000"
          - id: l2-c14
            part: divide-one
            type: text_input
            text: "5400 : 9 = _"
            say: "Fünftausendvierhundert geteilt durch neun."
            answer: "600"
          - id: l2-c15
            part: divide-one
            type: fill_in_blank
            text: "Das Einmaleins hilft."
            say: "Rechne zuerst zweiunddreißig geteilt durch vier, dann zweiunddreißigtausend geteilt durch vier."
            frame: "32 : 4 = _ | 32 000 : 4 = _"
            options: ["8", "800", "8000", "80 000"]
            answer: ["8", "8000"]
          - id: l2-c16
            part: divide-one
            type: true_false
