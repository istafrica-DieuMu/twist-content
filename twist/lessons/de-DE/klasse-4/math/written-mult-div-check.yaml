# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.written-mult-div-check
skill: math.written-mult-div.check
curriculum: de-DE
language: de
title:
  de: Malnehmen und Teilen prüfen
  en: Checking multiplication and division
summary: >
  Checking written multiplication and division. Lesson 1 checks a
  multiplication with a Überschlag and with the Tauschaufgabe and spots a
  Teilprodukt that is not written stellengerecht (the one for the Zehner
  one place too far right); lesson 2 checks a division with the
  Umkehraufgabe (852 : 6 = 142, Probe 142 · 6 = 852) and spots a missing
  Null, and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Schriftlich teilen, en: Written division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-mult-div.div-one-digit, math.mult-div-larger.estimate]
  also_practises: [math.written-mult-div.mult-multi-digit, math.written-mult-div.div-remainder-zeros]
  vocabulary: { de: [Überschlag, Probe, Umkehraufgabe, Tauschaufgabe, Teilprodukt, stellengerecht] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: estimate, what: { de: mit einem Überschlag prüfen, en: checking with an estimate } }
    - { id: swap, what: { de: Malaufgaben mit der Tauschaufgabe prüfen, en: checking multiplications by swapping the factors } }
    - { id: probe, what: { de: Geteiltaufgaben mit der Umkehraufgabe prüfen, en: checking divisions with the inverse } }
    - { id: mistakes, what: { de: typische Fehler erkennen, en: spotting typical mistakes } }
  misconceptions:
    - id: probe-wrong-operation
      what: "Checks a division with another division or with the wrong numbers (852 : 6 = 142 with 852 · 6)"
      addressed: "\"Welche Probe passt?\" in every stage of lesson 2 offers both wrong choices, with feedback in l2-f1"
    - id: estimate-too-rough
      what: Rounds so roughly that the Überschlag cannot catch an error
      addressed: lesson 1 Learn rounds each factor to its first digit; l1-f4, l1-n4 and l2-f4 need the Überschlag to catch a result that is ten times too small or too big
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Malaufgaben prüfen", en: "Checking multiplication" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "50 · 20 = _"
            say: "Fünfzig mal zwanzig."
            answer: "1000"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "36 · 12 = _"
            say: "Sechsunddreißig mal zwölf."
            answer: "432"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "47 · 23 = 1081 | Überschlag: 50 · 20 = 1000"
            say: "Siebenundvierzig mal dreiundzwanzig ist tausendeinundachtzig. Prüfe mit einem Überschlag: Fünfzig mal zwanzig ist tausend. Das Ergebnis passt."
          - text: "23 · 47 = 1081"
            say: "Genauer prüfst du mit der Tauschaufgabe: Dreiundzwanzig mal siebenundvierzig muss das Gleiche ergeben."
          - text: "47 · 23 = 94 + 141 = 235?"
            say: "Kommt beim Überschlag tausend heraus, aber dein Ergebnis ist zweihundertfünfunddreißig, stimmt etwas nicht. Hier steht das erste Teilprodukt nicht stellengerecht. Siebenundvierzig mal zwanzig ist neunhundertvierzig, nicht vierundneunzig. Die Vierundneunzig gehört eine Stelle weiter nach links, unter die Zehner. Schreib die Teilprodukte immer stellengerecht untereinander."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Überschlag passt zu 38 · 52?"
                say: "Achtunddreißig mal zweiundfünfzig. Welcher Überschlag passt?"
                options: ["40 · 50", "30 · 50", "40 · 60"]
                answer: "40 · 50"
                hints:
                  - "Runde beide Zahlen auf Zehner."
                  - "Achtunddreißig ist nah an vierzig, zweiundfünfzig an fünfzig."
                  - "40 · 50."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Passt 38 · 52 = 1976 zum Überschlag?"
                say: "Achtunddreißig mal zweiundfünfzig ist tausendneunhundertsechsundsiebzig. Passt das zum Überschlag?"
                answer: true
                hints:
                  - "Der Überschlag ist vierzig mal fünfzig."
                  - "Das sind zweitausend."
                  - "Ja, 1976 ist nah an 2000."
              - id: l1-f3
                type: multiple_choice
                text: "Mit welcher Tauschaufgabe prüfst du 64 · 27?"
                say: "Vierundsechzig mal siebenundzwanzig. Mit welcher Tauschaufgabe prüfst du das?"
                options: ["27 · 64", "64 : 27", "46 · 72"]
                answer: "27 · 64"
                feedback:
                  "46 · 72": "Bei der Tauschaufgabe tauschen die Faktoren die Plätze, nicht die Ziffern."
                hints:
                  - "Bei der Tauschaufgabe tauschen die beiden Faktoren die Plätze."
                  - "Vorne steht dann siebenundzwanzig."
                  - "27 · 64."
              - id: l1-f4
                type: true_false
                text: "Kann 56 · 31 = 174 stimmen?"
                say: "Sechsundfünfzig mal einunddreißig ist hundertvierundsiebzig. Kann das stimmen?"
                answer: false
                hints:
                  - "Mach einen Überschlag."
                  - "Sechzig mal dreißig ist tausendachthundert."
                  - "Nein. Das Ergebnis ist viel zu klein. Richtig ist 1736."
              - id: l1-f5
                type: multiple_choice
                text: "Welcher Fehler ist bei 32 · 14 = 32 + 128 = 160 passiert?"
                say: "Zweiunddreißig mal vierzehn ist zweiunddreißig plus hundertachtundzwanzig, also hundertsechzig. Welcher Fehler ist passiert?"
                options: ["Das erste Teilprodukt steht nicht stellengerecht.", "Der Übertrag wurde vergessen.", "Es wurde geteilt statt malgenommen."]
                answer: "Das erste Teilprodukt steht nicht stellengerecht."
                hints:
                  - "Wofür steht die Eins in vierzehn?"
                  - "Zweiunddreißig mal zehn ist dreihundertzwanzig. Die 32 muss eine Stelle weiter links stehen."
                  - "Das erste Teilprodukt steht nicht stellengerecht."

          - support: some
