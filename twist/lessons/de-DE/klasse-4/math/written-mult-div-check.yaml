          - text: "859 : 6 = 143 Rest 1 | Probe: 143 · 6 + 1 = 859"
            say: "Bleibt ein Rest, zählst du ihn bei der Probe dazu: Hundertdreiundvierzig mal sechs ist achthundertachtundfünfzig, plus eins ist achthundertneunundfünfzig."
          - text: "624 : 3 = 28? | Überschlag: 600 : 3 = 200"
            say: "Ein häufiger Fehler ist die vergessene Null. Der Überschlag zeigt ihn: Sechshundert geteilt durch drei ist zweihundert. Achtundzwanzig ist viel zu klein. Richtig ist zweihundertacht."

