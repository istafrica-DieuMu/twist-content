            say: "Wie oft passt die Drei in die Zwei?"
            options: ["nullmal", "einmal", "zweimal"]
            answer: "nullmal"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was glaubst du? 624 : 3. Ist das Ergebnis 28 oder 208?"
            say: "Sechshundertvierundzwanzig geteilt durch drei. Was glaubst du: Ist das Ergebnis achtundzwanzig oder zweihundertacht?"
          - text: "H: 6 : 3 = 2 | Z: 2 : 3 = 0 Rest 2 | E: 24 : 3 = 8"
            say: "Rechnen wir nach. Sechs Hunderter geteilt durch drei sind zwei. Zwei Zehner geteilt durch drei geht nullmal, Rest zwei. Die Null musst du ins Ergebnis schreiben. Dann vierundzwanzig Einer geteilt durch drei sind acht."
          - text: "624 : 3 = 208, nicht 28"
            say: "Das Ergebnis ist zweihundertacht. Vergisst du die Null, steht dort achtundzwanzig. Der Überschlag hilft: Sechshundert geteilt durch drei ist zweihundert."

