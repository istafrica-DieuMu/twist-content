      en: "Divide in writing and don't forget the zero in the answer. 624 divided by 3 is 208, not 28."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Rechne schriftlich."
            say: "Sechshundertvierundneunzig geteilt durch fünf. Rechne Stelle für Stelle."
