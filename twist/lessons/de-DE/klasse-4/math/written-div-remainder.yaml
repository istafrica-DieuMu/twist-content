# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.written-div-remainder
skill: math.written-mult-div.div-remainder-zeros
curriculum: de-DE
language: de
title:
  de: Schriftlich teilen mit Rest und Null
  en: Written division with remainders and zeros
summary: >
  Written division that does not come out evenly at every step. Lesson 1
  carries the Rest of one place to the next (857 : 4 = 214 Rest 1) and
  checks with the Probe; lesson 2 writes the Null when a place goes
  nullmal (624 : 3 = 208, not 28), and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Schriftlich teilen, en: Written division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-mult-div.div-one-digit]
  also_practises: [math.mult-div.remainder, math.mult-div-larger.estimate]
  vocabulary: { de: [schriftlich teilen, Rest, Stelle, nullmal, Probe, Überschlag] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  parts:
    - { id: remainder, what: { de: schriftlich mit Rest teilen, en: dividing in writing with a remainder } }
    - { id: zero, what: { de: die Null im Ergebnis schreiben, en: writing the zero in the answer } }
    - { id: probe, what: { de: mit Probe und Überschlag prüfen, en: checking with the inverse and an estimate } }
    - { id: context, what: { de: Sachaufgaben mit Rest lösen, en: solving word problems with remainders } }
  misconceptions:
    - id: drop-rest
      what: "Forgets to carry the Rest of a place into the next place (5 Zehner : 4 = 1, then divides only the 7 Einer)"
      addressed: lesson 1 Learn turns the Rest-Zehner into Einer; "Welche Zahl teilst du als Nächstes?" in every stage of lesson 1
    - id: skip-zero
      what: "Leaves out the Null in the result (624 : 3 = 28)"
      addressed: lesson 2 Learn shows 208 against 28 and uses the Überschlag; every stage of lesson 2 asks what goes in the Zehnerstelle and has a true_false with the zero left out
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Der Rest wandert weiter", en: "Carrying the remainder" }
    goal:
      de: "Teil schriftlich und nimm den Rest mit zur nächsten Stelle. 857 durch 4 ist 214 Rest 1."
      en: "Divide in writing and carry the remainder to the next place. 857 divided by 4 is 214 remainder 1."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "848 : 4 = _"
            say: "Achthundertachtundvierzig geteilt durch vier."
            answer: "212"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Rechne mit Rest."
            say: "Siebzehn geteilt durch vier, mit Rest."
            frame: "17 : 4 = _ Rest _"
            options: ["4", "1", "3"]
            answer: ["4", "1"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was glaubst du? 857 Sticker kommen gerecht auf 4 Blätter. Geht das glatt auf, oder bleiben Sticker übrig?"
            say: "Achthundertsiebenundfünfzig Sticker sollen gerecht auf vier Blätter. Was glaubst du: Geht das glatt auf, oder bleiben Sticker übrig?"
            show: { object: sticker }
          - text: "857 : 4"
            say: "Rechnen wir nach: achthundertsiebenundfünfzig geteilt durch vier. Du teilst Stelle für Stelle und fängst bei den Hundertern an."
          - text: "H: 8 : 4 = 2 | Z: 5 : 4 = 1 Rest 1 | E: 17 : 4 = 4 Rest 1"
            say: "Acht Hunderter geteilt durch vier sind zwei. Fünf Zehner geteilt durch vier ist eins, Rest eins. Der übrige Zehner wird zu zehn Einern: Zehn plus sieben sind siebzehn. Siebzehn geteilt durch vier ist vier, Rest eins."
          - text: "857 : 4 = 214 Rest 1 | Probe: 214 · 4 + 1 = 857"
            say: "Das Ergebnis ist zweihundertvierzehn Rest eins. Ein Sticker bleibt also übrig! Die Probe: Zweihundertvierzehn mal vier ist achthundertsechsundfünfzig, plus eins ist achthundertsiebenundfünfzig."
          - text: "Wusstest du? 100 : 7 = 14 Rest 2. 100 Tage sind also 14 Wochen und 2 Tage. Ist heute Montag, ist in 100 Tagen Mittwoch."
            say: "Wusstest du? Mit dem Rest findest du heraus, welcher Wochentag in hundert Tagen ist. Hundert geteilt durch sieben ist vierzehn, Rest zwei. Hundert Tage sind also vierzehn ganze Wochen und noch zwei Tage. Ist heute Montag, ist in hundert Tagen Mittwoch. Probier es mit deinem Geburtstag aus!"
            show: { object: present }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Siebenhundertneununddreißig geteilt durch drei. Rechne Stelle für Stelle."
                frame: "739 : 3 = _ Rest _"
                options: ["246", "1", "245", "2"]
                answer: ["246", "1"]
                hints:
                  - "Fang bei den Hundertern an: sieben geteilt durch drei."
                  - "Zwei Rest eins. Der übrige Hunderter wird zu zehn Zehnern. Mit den drei Zehnern sind das dreizehn Zehner: dreizehn geteilt durch drei."
                  - "246 Rest 1."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "653 : 5. Du rechnest 6 : 5 = 1 Rest 1. Welche Zahl teilst du als Nächstes?"
                say: "Sechshundertdreiundfünfzig geteilt durch fünf. Du rechnest sechs geteilt durch fünf gleich eins Rest eins. Welche Zahl teilst du als Nächstes?"
                options: ["15", "5", "11"]
                answer: "15"
