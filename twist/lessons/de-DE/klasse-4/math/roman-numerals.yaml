# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.roman-numerals
skill: math.large-numbers.roman-numerals
curriculum: de-DE
language: de
title:
  de: Römische Zahlen
  en: Roman numerals
summary: >
  Lesson 1 reads and writes römische Zahlzeichen to 20 with I, V and X: a
  smaller sign to the right of a bigger one adds, one to the left
  subtracts (IV, IX), and no sign stands more than three times in a row.
  Lesson 2 adds L and C, reads numbers to 100 in parts (tens, then ones),
  reads the hours on a clock face with Roman numerals, compares the Roman
  way with our Stellenwertsystem (an X is always ten, there is no zero) and
  ends with the skill check. The voice never reads a Roman numeral aloud,
  and Roman options are not read, so the child must read them.
metadata:
  year: klasse-4
  topic: { de: Zahlen bis 1 000 000, en: Roman numerals }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { de: [römische Zahlzeichen, römische Zahl, Zifferblatt, Stellenwertsystem, Stellenwert, Null] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: read, what: { de: römische Zahlen bis 100 lesen, en: reading Roman numerals to 100 } }
    - { id: write, what: { de: Zahlen bis 100 mit römischen Zahlzeichen schreiben, en: writing numbers to 100 in Roman numerals } }
    - { id: clock, what: { de: römische Zahlen auf dem Zifferblatt lesen, en: reading Roman numerals on a clock face } }
    - { id: place-value, what: { de: römische Zahlen mit unserem Stellenwertsystem vergleichen, en: comparing Roman numerals with our place-value system } }
  misconceptions:
    - id: always-add
      what: Adds every sign, also one on the left (IV = 6, IX = 11, XL = 60)
      addressed: lesson 1 Learn screen 3 and lesson 2 Learn screen 1 set plus on the right against minus on the left; l1-f2, l1-f5 and l2-f2 (with feedback), l1-s3, l2-s3, l2-c4 and l2-n3
    - id: four-in-a-row
      what: Writes a sign four times in a row (IIII for 4, XXXX for 40, LXXXX for 90)
      addressed: lesson 1 Learn screen 3; l1-s2, l1-s5, l1-c2, l2-f4 (with feedback), l2-s2, l2-n3 and l2-c2 offer four in a row
    - id: smaller-first
      what: Writes the signs from small to big (IIIX for 13, VIIX for 17)
      addressed: l1-f3 (with feedback), l1-n3 and l2-c2 offer the reversed order
    - id: roman-place-value
      what: Thinks Roman numerals work like our digits, with places and a zero
      addressed: lesson 2 Learn screen 3; l2-f5, l2-n5 and l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "I, V und X", en: "I, V and X" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viel ist die 3 in 352 wert?"
            say: "Wie viel ist die Drei in dreihundertzweiundfünfzig wert?"
            options: ["300", "30", "3"]
            answer: "300"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "70 = _ Zehner"
            say: "Wie viele Zehner sind siebzig?"
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I = 1\nV = 5\nX = 10"
            say: "Die alten Römer haben Zahlen mit Buchstaben geschrieben. Das I bedeutet eins, das V bedeutet fünf und das X bedeutet zehn. Man nennt sie römische Zahlzeichen."
          - text: "VI = 5 + 1 = 6\nXII = 10 + 1 + 1 = 12\nXV = 10 + 5 = 15"
            say: "Steht ein kleineres Zeichen rechts von einem größeren, rechnest du plus. Ein I rechts vom V: fünf plus eins, also sechs. Zwei I rechts vom X: zehn plus eins plus eins, also zwölf. Ein V rechts vom X: zehn plus fünf, also fünfzehn."
          - text: "IV = 5 − 1 = 4\nIX = 10 − 1 = 9\nNicht mehr als drei gleiche Zeichen: 4 ist IV, nicht IIII."
            say: "Steht das I links vom V oder links vom X, rechnest du minus. I vor V: fünf minus eins, also vier. I vor X: zehn minus eins, also neun. Und merk dir: Mehr als drei gleiche Zeichen hintereinander schreibst du nicht. Vier schreibst du nicht mit vier I, sondern mit I und V."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "VII = ?"
                say: "Welche Zahl ist das?"
                options: ["7", "12", "3"]
                answer: "7"
                feedback:
                  "3": "Die I stehen rechts vom V. Dann rechnest du plus: 5 + 1 + 1."
                hints:
                  - "Rechne die Zeichen von links nach rechts zusammen."
                  - "V ist 5, jedes I ist 1."
                  - "5 + 1 + 1 = 7."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "IV = ?"
                say: "Welche Zahl ist das?"
                options: ["4", "6", "15"]
                answer: "4"
                feedback:
                  "6": "Das I steht links vom V. Dann rechnest du minus: 5 − 1."
                hints:
                  - "Schau, ob das I links oder rechts vom V steht."
                  - "Das I steht links. Links heißt minus."
                  - "5 − 1 = 4."
              - id: l1-f3
                type: multiple_choice
                text: "Wie schreibst du 13 mit römischen Zahlzeichen?"
                say: "Wie schreibst du dreizehn mit römischen Zahlzeichen?"
                options: ["XIII", "IIIX", "XIIV"]
                answer: "XIII"
                option_audio: false
                feedback:
                  "IIIX": "Das größte Zeichen kommt zuerst. Erst X für 10, dann drei I für 3."
                hints:
                  - "Zerlege 13 in 10 und 3."
                  - "10 ist X. 3 ist III. Das größere Zeichen kommt zuerst."
                  - "XIII."
              - id: l1-f4
                type: text_input
                text: "XVI = _"
                say: "Welche Zahl ist das?"
                answer: "16"
                hints:
                  - "Lies von links nach rechts. Jedes Zeichen ist kleiner als das davor."
                  - "X ist 10, V ist 5, I ist 1."
                  - "10 + 5 + 1 = 16."
              - id: l1-f5
                type: true_false
                text: "IX = 11"
                say: "Stimmt das? Diese römische Zahl bedeutet elf."
                answer: false
                hints:
                  - "Schau, ob das I links oder rechts vom X steht."
                  - "Das I steht links vom X. Links heißt minus."
                  - "Nein. IX ist 10 − 1 = 9."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "XIV = _"
                say: "Welche Zahl ist das?"
                answer: "14"
                hints: ["Lies in zwei Teilen: X und IV."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie schreibst du 9 mit römischen Zahlzeichen?"
                say: "Wie schreibst du neun mit römischen Zahlzeichen?"
                options: ["IX", "VIIII", "XI"]
                answer: "IX"
                option_audio: false
                hints: ["9 ist 10 − 1. Mehr als drei gleiche Zeichen gibt es nicht."]
              - id: l1-s3
                type: multiple_choice
                text: "XIX = ?"
                say: "Welche Zahl ist das?"
                options: ["19", "21", "11"]
                answer: "19"
                hints: ["Lies in zwei Teilen: X und IX."]
              - id: l1-s4
                type: matching
                text: "Verbinde jede römische Zahl mit unserer Zahl."
                say: "Verbinde jede römische Zahl mit unserer Zahl."
                pairs:
                  - { left: { text: "VIII" }, right: { text: "8" } }
                  - { left: { text: "XI" }, right: { text: "11" } }
                  - { left: { text: "IV" }, right: { text: "4" } }
                  - { left: { text: "XX" }, right: { text: "20" } }
                option_audio: false
                hints: ["Kleineres Zeichen rechts: plus. Kleineres Zeichen links: minus."]
              - id: l1-s5
                type: true_false
                text: "4 = IIII"
                say: "Stimmt das? So schreibst du vier mit römischen Zahlzeichen."
                answer: false
                hints: ["Mehr als drei gleiche Zeichen hintereinander gibt es nicht."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: text_input
                text: "In einem Buch steht über einem Kapitel: XII. Welches Kapitel ist das?"
                say: "In einem Buch steht über einem Kapitel diese römische Zahl. Welches Kapitel ist das?"
                answer: "12"
              - id: l1-n2
                type: multiple_choice
                text: "Eine Uhr hat römische Zahlen. Der kleine Zeiger zeigt auf IX. Welche Stunde ist das?"
                say: "Eine Uhr hat römische Zahlen. Der kleine Zeiger zeigt auf dieses Zeichen. Welche Stunde ist das?"
                options: ["9", "11", "4"]
                answer: "9"
              - id: l1-n3
                type: multiple_choice
                text: "Jan wird 17 Jahre alt. Seine Schwester schreibt die Zahl in römischen Zahlzeichen auf die Karte. Was schreibt sie?"
                say: "Jan wird siebzehn Jahre alt. Seine Schwester schreibt die Zahl in römischen Zahlzeichen auf die Karte. Was schreibt sie?"
                options: ["XVII", "XIIIV", "VIIX"]
                answer: "XVII"
                option_audio: false
              - id: l1-n4
                type: text_input
                text: "Eine Uhr hat römische Zahlen. Der kleine Zeiger zeigt auf VI, der große auf XII. Wie viel Uhr ist es?"
                say: "Eine Uhr hat römische Zahlen. Der kleine Zeiger zeigt auf das eine Zeichen, der große auf das andere. Wie viel Uhr ist es?"
                answer: "6"
              - id: l1-n5
                type: multiple_choice
                text: "Welche römische Zahl ist am größten?"
                say: "Welche römische Zahl ist am größten?"
                options: ["XIV", "XVI", "XI"]
                answer: "XVI"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "VIII = _"
            say: "Welche Zahl ist das?"
            answer: "8"
          - id: l1-c2
            type: multiple_choice
            text: "Wie schreibst du 4 mit römischen Zahlzeichen?"
            say: "Wie schreibst du vier mit römischen Zahlzeichen?"
            options: ["IV", "IIII", "VI"]
            answer: "IV"
            option_audio: false
          - id: l1-c3
            type: text_input
            text: "XVIII = _"
            say: "Welche Zahl ist das?"
            answer: "18"
          - id: l1-c4
            type: text_input
            text: "XV = _"
            say: "Welche Zahl ist das?"
            answer: "15"
          - id: l1-c5
            type: multiple_choice
            text: "Wie schreibst du 6 mit römischen Zahlzeichen?"
            say: "Wie schreibst du sechs mit römischen Zahlzeichen?"
            options: ["VI", "IV", "IIIIII"]
            answer: "VI"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "IX = 9"
            say: "Stimmt das? Diese römische Zahl bedeutet neun."
            answer: true

  - n: 2
    title: { de: "L und C: bis 100", en: "L and C: to 100" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "XVII = _"
            say: "Welche Zahl ist das?"
            answer: "17"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie schreibst du 19 mit römischen Zahlzeichen?"
            say: "Wie schreibst du neunzehn mit römischen Zahlzeichen?"
            options: ["XIX", "IXX", "XVIIII"]
            answer: "XIX"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "L = 50\nC = 100\nLX = 50 + 10 = 60\nXL = 50 − 10 = 40\nXC = 100 − 10 = 90"
            say: "Jetzt kommen zwei neue Zeichen dazu: Das L bedeutet fünfzig, das C bedeutet hundert. Es gelten dieselben Regeln wie bisher. Ein X rechts vom L heißt plus: fünfzig plus zehn, also sechzig. Ein X links vom L heißt minus: fünfzig minus zehn, also vierzig. Genauso beim C: Ein X links vom C ist hundert minus zehn, also neunzig."
          - text: "LXXIV\nL + XX + IV\n50 + 20 + 4 = 74"
            say: "Lange römische Zahlen liest du in Teilen, von links nach rechts. Erst das L für fünfzig, dann zwei X für zwanzig, dann I und V für vier. Zusammen sind das vierundsiebzig."
          - text: "Bei uns: 22\nDie erste 2 ist 20 wert, die zweite 2 ist 2 wert.\nBei den Römern: XX\nJedes X ist 10 wert.\nDie Römer hatten keine Null."
            say: "Bei unseren Zahlen hängt der Wert einer Ziffer von ihrer Stelle ab. In zweiundzwanzig ist die erste Zwei zwanzig wert, die zweite nur zwei. Bei den Römern ist ein X immer zehn, egal an welcher Stelle. Darum brauchten die Römer auch keine Null: Für hundert schrieben sie einfach ein C."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "LX = ?"
                say: "Welche Zahl ist das?"
                options: ["60", "40", "15"]
                answer: "60"
                feedback:
                  "40": "Das X steht rechts vom L. Dann rechnest du plus: 50 + 10."
                hints:
                  - "L ist 50, X ist 10."
                  - "Das X steht rechts vom L. Rechts heißt plus."
                  - "50 + 10 = 60."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "XL = ?"
                say: "Welche Zahl ist das?"
                options: ["40", "60", "30"]
                answer: "40"
                feedback:
                  "60": "Das X steht links vom L. Dann rechnest du minus: 50 − 10."
                hints:
                  - "Schau, ob das X links oder rechts vom L steht."
                  - "Das X steht links. Links heißt minus."
                  - "50 − 10 = 40."
              - id: l2-f3
                type: text_input
                text: "LXXIII = _"
                say: "Welche Zahl ist das?"
                answer: "73"
                hints:
                  - "Lies in Teilen: erst das L, dann die X, dann die I."
                  - "L ist 50, XX ist 20, III ist 3."
                  - "50 + 20 + 3 = 73."
              - id: l2-f4
                type: multiple_choice
                text: "Wie schreibst du 90 mit römischen Zahlzeichen?"
                say: "Wie schreibst du neunzig mit römischen Zahlzeichen?"
                options: ["XC", "LXXXX", "CX"]
                answer: "XC"
                option_audio: false
                feedback:
                  "LXXXX": "Mehr als drei gleiche Zeichen schreibst du nicht. 90 ist 100 − 10."
                  "CX": "Das X steht rechts vom C. Das ist 100 + 10 = 110."
                hints:
                  - "90 ist 10 weniger als 100."
                  - "100 ist C. Für minus 10 steht das X links vom C."
                  - "XC."
              - id: l2-f5
                type: multiple_choice
                text: "Was ist bei den römischen Zahlen anders als bei unseren?"
                say: "Was ist bei den römischen Zahlen anders als bei unseren Zahlen?"
                options: ["Ein X ist immer 10 wert, egal wo es steht.", "Die Römer schreiben auch eine Null.", "Die Römer haben die Ziffern 0 bis 9."]
                answer: "Ein X ist immer 10 wert, egal wo es steht."
                hints:
                  - "Denk an die beiden Zweien in 22."
                  - "Bei uns hängt der Wert einer Ziffer von ihrer Stelle ab. Bei den Römern nicht."
                  - "Ein X ist immer 10 wert."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "XXXVIII = _"
                say: "Welche Zahl ist das?"
                answer: "38"
                hints: ["Lies in Teilen: XXX und VIII."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie schreibst du 45 mit römischen Zahlzeichen?"
                say: "Wie schreibst du fünfundvierzig mit römischen Zahlzeichen?"
                options: ["XLV", "VL", "XXXXV"]
                answer: "XLV"
                option_audio: false
                hints: ["45 ist 40 + 5. Schreib erst 40, dann 5."]
              - id: l2-s3
                type: true_false
                text: "XC = 110"
                say: "Stimmt das? Diese römische Zahl bedeutet hundertzehn."
                answer: false
                hints: ["Steht das X links oder rechts vom C?"]
              - id: l2-s4
                type: matching
                text: "Verbinde jede römische Zahl mit unserer Zahl."
                say: "Verbinde jede römische Zahl mit unserer Zahl."
                pairs:
                  - { left: { text: "XXIV" }, right: { text: "24" } }
                  - { left: { text: "LV" }, right: { text: "55" } }
                  - { left: { text: "XCIX" }, right: { text: "99" } }
                  - { left: { text: "LXXX" }, right: { text: "80" } }
                option_audio: false
                hints: ["Lies jede Zahl in Teilen: erst die Zehner, dann die Einer."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Zahl ist größer: LXX oder XC?"
                say: "Welche römische Zahl ist größer?"
                options: ["XC", "LXX", "beide gleich groß"]
                answer: "XC"
                keep_order: true
                option_audio: false
                hints: ["Rechne beide Zahlen um: LXX ist 70."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Die Kirchturmuhr hat römische Zahlen. Der kleine Zeiger zeigt auf XI. Welche Stunde ist das?"
                say: "Die Kirchturmuhr hat römische Zahlen. Der kleine Zeiger zeigt auf dieses Zeichen. Welche Stunde ist das?"
                options: ["11", "9", "12"]
                answer: "11"
              - id: l2-n2
                type: text_input
                text: "Im Museum steht an einer Tür: Saal XXIV. Welche Nummer hat der Saal?"
                say: "Im Museum steht an einer Tür diese römische Zahl. Welche Nummer hat der Saal?"
                answer: "24"
              - id: l2-n3
                type: multiple_choice
                text: "Lena schreibt 49 mit römischen Zahlzeichen auf eine Geburtstagskarte. Was ist richtig?"
                say: "Lena schreibt neunundvierzig mit römischen Zahlzeichen auf eine Geburtstagskarte. Was ist richtig?"
                options: ["XLIX", "IL", "XXXXVIIII"]
                answer: "XLIX"
                option_audio: false
                difficulty: stretch
              - id: l2-n4
                type: text_input
                text: "In einem alten Buch steht: Kapitel LXXXVI. Welches Kapitel ist das?"
                say: "In einem alten Buch steht über einem Kapitel diese römische Zahl. Welches Kapitel ist das?"
                answer: "86"
              - id: l2-n5
                type: true_false
                text: "Ben sagt: „Mit römischen Zahlzeichen kann man die Null nicht schreiben.“"
                say: "Ben sagt: Mit römischen Zahlzeichen kann man die Null nicht schreiben. Hat Ben recht?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: text_input
            text: "XXVII = _"
            say: "Welche Zahl ist das?"
            answer: "27"
          - id: l2-c2
            part: write
            type: multiple_choice
            text: "Wie schreibst du 14 mit römischen Zahlzeichen?"
            say: "Wie schreibst du vierzehn mit römischen Zahlzeichen?"
            options: ["XIV", "XIIII", "IVX"]
            answer: "XIV"
            option_audio: false
          - id: l2-c3
            part: clock
            type: multiple_choice
            text: "Eine Uhr hat römische Zahlen. Der kleine Zeiger zeigt auf VII. Welche Stunde ist das?"
            say: "Eine Uhr hat römische Zahlen. Der kleine Zeiger zeigt auf dieses Zeichen. Welche Stunde ist das?"
            options: ["7", "6", "9"]
            answer: "7"
          - id: l2-c4
            part: read
            type: text_input
            text: "XCV = _"
            say: "Welche Zahl ist das?"
            answer: "95"
          - id: l2-c5
            part: place-value
            type: multiple_choice
            text: "Was ist bei unseren Zahlen anders als bei den römischen?"
            say: "Was ist bei unseren Zahlen anders als bei den römischen Zahlen?"
            options: ["Bei uns hängt der Wert einer Ziffer von ihrer Stelle ab.", "Bei uns gibt es keine Null.", "Bei uns ist eine Ziffer überall gleich viel wert."]
            answer: "Bei uns hängt der Wert einer Ziffer von ihrer Stelle ab."
          - id: l2-c6
            part: read
            type: text_input
            text: "XXXIX = _"
            say: "Welche Zahl ist das?"
            answer: "39"
          - id: l2-c7
            part: read
            type: multiple_choice
            text: "LXIV = ?"
            say: "Welche Zahl ist das?"
            options: ["64", "66", "46"]
            answer: "64"
          - id: l2-c8
            part: read
            type: true_false
            text: "XLII = 62"
            say: "Stimmt das? Diese römische Zahl bedeutet zweiundsechzig."
            answer: false
          - id: l2-c9
            part: read
            type: text_input
            text: "LXXXVIII = _"
            say: "Welche Zahl ist das?"
            answer: "88"
          - id: l2-c10
            part: write
            type: multiple_choice
            text: "Wie schreibst du 40 mit römischen Zahlzeichen?"
            say: "Wie schreibst du vierzig mit römischen Zahlzeichen?"
            options: ["XL", "XXXX", "LX"]
            answer: "XL"
            option_audio: false
          - id: l2-c11
            part: write
            type: multiple_choice
            text: "Wie schreibst du 26 mit römischen Zahlzeichen?"
            say: "Wie schreibst du sechsundzwanzig mit römischen Zahlzeichen?"
            options: ["XXVI", "XXIV", "VIXX"]
            answer: "XXVI"
            option_audio: false
          - id: l2-c12
            part: write
            type: multiple_choice
            text: "Wie schreibst du 59 mit römischen Zahlzeichen?"
            say: "Wie schreibst du neunundfünfzig mit römischen Zahlzeichen?"
            options: ["LIX", "LVIIII", "XLI"]
            answer: "LIX"
            option_audio: false
          - id: l2-c13
            part: write
            type: true_false
            text: "15 = XV"
            say: "Stimmt das? So schreibst du fünfzehn mit römischen Zahlzeichen."
            answer: true
          - id: l2-c14
            part: write
            type: multiple_choice
            text: "Wie schreibst du 83 mit römischen Zahlzeichen?"
            say: "Wie schreibst du dreiundachtzig mit römischen Zahlzeichen?"
            options: ["LXXXIII", "XXCIII", "LXXIIIX"]
            answer: "LXXXIII"
            option_audio: false
          - id: l2-c15
            part: clock
            type: multiple_choice
            text: "Eine Uhr hat römische Zahlen. Ganz oben steht XII. Welches Zeichen steht ganz unten, genau gegenüber?"
            say: "Eine Uhr hat römische Zahlen. Ganz oben steht die Zwölf. Welches Zeichen steht ganz unten, genau gegenüber?"
            options: ["VI", "IV", "IX"]
            answer: "VI"
            option_audio: false
          - id: l2-c16
            part: clock
