# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.proportional
skill: math.patterns.proportional
curriculum: de-DE
language: de
title:
  de: Über eins rechnen
  en: Working through one
summary: >
  Lesson 1 works from what is known to one and then to the amount asked
  for (3 Hefte kosten 6 €, 1 Heft kostet 2 €, 5 Hefte kosten 10 €);
  lesson 2 scales recipes and journeys by halving, doubling and adding
  up, compares two ways, notices where "doppelt so viele, doppelt so
  viel" does not hold (an egg takes as long as three) and ends with the
  skill check.
metadata:
  year: klasse-4
  topic: { de: Zusammenhänge, en: Relationships }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.patterns.functional-tables, math.mult-div.div-facts]
  also_practises: [math.money.calculate, math.mult-div.all-tables]
  vocabulary: { de: [Preis, Menge, doppelt so viel, halb so viel, Rezept, gleich schnell] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: via-one, what: { de: vom Bekannten auf eins und dann auf die gesuchte Menge schließen, en: working from what is known to one and then to the amount needed } }
    - { id: scale, what: { de: Rezepte und Wege durch Halbieren und Verdoppeln umrechnen, en: scaling recipes and journeys by halving and doubling } }
    - { id: not-proportional, what: { de: "erkennen, ob eine Menge wirklich mitwächst", en: spotting whether an amount really grows with the number } }
  misconceptions:
    - id: adds-the-difference
      what: Adds the change in the amount to the price (4 Brötchen kosten 2 €, also kosten 6 Brötchen 4 €)
      addressed: lesson 1 Learn goes through the price of one; every stage of lesson 1 offers the added answer, with feedback in l1-f2, and l1-s5 and l2-c1 ask about it again
    - id: everything-scales
      what: Scales things that do not grow with the amount, such as the time a song or a cooking egg takes
      addressed: lesson 2 Learn shows a song that takes as long for four singers; l2-f4, l2-f5, l2-s3, l2-n3 and l2-c3 ask whether the amount really grows
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Vom Bekannten auf eins", en: "From what you know to one" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Ein Heft kostet 2 €. Setze die Tabelle fort."
            say: "Ein Heft kostet zwei Euro. Setze die Tabelle fort."
            frame: "1 Heft: 2 € · 2 Hefte: 4 € · 3 Hefte: 6 € · 4 Hefte: _"
            options: ["8 €", "7 €", "10 €"]
            answer: ["8 €"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "24 : 4 = _"
            say: "Vierundzwanzig geteilt durch vier."
            options: ["6", "8", "20"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 Hefte kosten 6 €.\nWas kosten 5 Hefte?"
            say: "Drei Hefte kosten sechs Euro. Was kosten fünf Hefte? Von drei auf fünf kommst du nicht mit einem einfachen Schritt. Rechne zuerst, was ein Heft kostet."
          - text: "3 Hefte: 6 €\n: 3\n1 Heft: 2 €\n· 5\n5 Hefte: 10 €"
            say: "Drei Hefte kosten sechs Euro. Du teilst beides durch drei: Ein Heft kostet zwei Euro. Dann nimmst du beides mal fünf: Fünf Hefte kosten zehn Euro."
          - text: "Erst auf eins, dann auf die gesuchte Menge.\nWas du mit der Anzahl machst, machst du auch mit dem Preis."
            say: "So rechnest du immer: vom Bekannten auf eins, dann auf die gesuchte Menge. Teilst du die Anzahl, teilst du auch den Preis. Nimmst du die Anzahl mal, nimmst du auch den Preis mal."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "4 Brötchen kosten 2 €. Was kostet 1 Brötchen?"
                say: "Vier Brötchen kosten zwei Euro. Was kostet ein Brötchen?"
                options: ["0,50 €", "8 €", "2 €"]
                answer: "0,50 €"
                hints:
                  - "Von 4 Brötchen auf 1 Brötchen: Du teilst durch 4."
                  - "2 € : 4. Rechne in Cent: 200 ct : 4."
                  - "0,50 €."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "4 Brötchen kosten 2 €. Was kosten 6 Brötchen?"
                say: "Vier Brötchen kosten zwei Euro. Was kosten sechs Brötchen?"
                options: ["3 €", "4 €", "12 €"]
                answer: "3 €"
                feedback:
                  "4 €": "Du hast 2 Brötchen mehr und dafür 2 € mehr gerechnet. Rechne zuerst, was ein Brötchen kostet."
                hints:
                  - "Rechne zuerst, was ein Brötchen kostet."
                  - "Ein Brötchen kostet 0,50 €. Dann mal 6."
                  - "3 €."
              - id: l1-f3
                type: fill_in_blank
                text: "5 Kugeln Eis kosten 7,50 €."
                say: "Fünf Kugeln Eis kosten sieben Euro fünfzig. Was kostet eine Kugel? Was kosten drei Kugeln?"
                frame: "1 Kugel: _ | 3 Kugeln: _"
                options: ["1,50 €", "4,50 €", "2,50 €", "5,50 €"]
                answer: ["1,50 €", "4,50 €"]
                hints:
                  - "Teile zuerst den Preis durch 5."
                  - "7,50 € : 5 = 1,50 €. Dann mal 3."
                  - "1,50 € und 4,50 €."
              - id: l1-f4
                type: multiple_choice
                text: "6 gleich schwere Äpfel wiegen 900 g. Wie schwer sind 4 Äpfel?"
                say: "Sechs gleich schwere Äpfel wiegen zusammen neunhundert Gramm. Wie schwer sind vier Äpfel?"
                options: ["600 g", "700 g", "150 g"]
                answer: "600 g"
                hints:
                  - "Rechne zuerst, wie schwer ein Apfel ist."
                  - "900 g : 6 = 150 g. Dann mal 4."
                  - "600 g."
              - id: l1-f5
                type: true_false
                text: "3 Kinokarten kosten 24 €. Kosten 6 Kinokarten 48 €?"
                say: "Drei Kinokarten kosten vierundzwanzig Euro. Kosten sechs Kinokarten achtundvierzig Euro?"
                answer: true
                hints:
                  - "6 Karten sind doppelt so viele wie 3 Karten."
                  - "Doppelt so viele Karten kosten doppelt so viel: 2 · 24 €."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "5 Hefte kosten 4 €. Was kostet 1 Heft?"
                say: "Fünf Hefte kosten vier Euro. Was kostet ein Heft?"
                options: ["0,80 €", "1,25 €", "20 €"]
                answer: "0,80 €"
                hints: ["Rechne in Cent: 400 ct : 5."]
              - id: l1-s2
                type: multiple_choice
                text: "8 Stifte kosten 6 €. Was kosten 4 Stifte?"
                say: "Acht Stifte kosten sechs Euro. Was kosten vier Stifte?"
                options: ["3 €", "2 €", "12 €"]
                answer: "3 €"
                hints: ["4 Stifte sind halb so viele wie 8 Stifte."]
              - id: l1-s3
                type: fill_in_blank
                text: "Pia fährt jeden Tag gleich weit mit dem Rad. In 7 Tagen fährt sie 21 km."
                say: "Pia fährt jeden Tag gleich weit mit dem Rad. In sieben Tagen fährt sie einundzwanzig Kilometer. Wie weit fährt sie an einem Tag, wie weit in zehn Tagen?"
                frame: "1 Tag: _ | 10 Tage: _"
                options: ["3 km", "30 km", "24 km", "14 km"]
                answer: ["3 km", "30 km"]
                hints: ["21 km : 7 = 3 km."]
              - id: l1-s4
                type: multiple_choice
                text: "Ein Auto braucht für 100 km 6 l Benzin. Wie viel braucht es für 300 km?"
                say: "Ein Auto braucht für hundert Kilometer sechs Liter Benzin. Wie viel braucht es für dreihundert Kilometer?"
                options: ["18 l", "9 l", "600 l"]
                answer: "18 l"
                hints: ["300 km sind dreimal so weit wie 100 km."]
              - id: l1-s5
                type: true_false
                text: "4 Flaschen Saft kosten 6 €. Kosten 10 Flaschen 12 €?"
                say: "Vier Flaschen Saft kosten sechs Euro. Kosten zehn Flaschen zwölf Euro?"
                answer: false
                hints: ["Eine Flasche kostet 1,50 €."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "3 kg Kartoffeln kosten 4,50 €. Was kostet 1 kg?"
                say: "Drei Kilogramm Kartoffeln kosten vier Euro fünfzig. Was kostet ein Kilogramm?"
                options: ["1,50 €", "1,30 €", "13,50 €"]
                answer: "1,50 €"
              - id: l1-n2
                type: multiple_choice
                text: "3 kg Kartoffeln kosten 4,50 €. Was kosten 5 kg?"
                say: "Drei Kilogramm Kartoffeln kosten vier Euro fünfzig. Was kosten fünf Kilogramm?"
                options: ["7,50 €", "6,50 €", "9 €"]
                answer: "7,50 €"
              - id: l1-n3
                type: fill_in_blank
                text: "6 gleiche Pakete wiegen 18 kg."
                say: "Sechs gleiche Pakete wiegen achtzehn Kilogramm. Wie schwer ist ein Paket, wie schwer sind vier Pakete?"
                frame: "1 Paket: _ | 4 Pakete: _"
                options: ["3 kg", "12 kg", "16 kg", "6 kg"]
                answer: ["3 kg", "12 kg"]
              - id: l1-n4
                type: multiple_choice
                text: "Ein Wasserhahn füllt in 2 Minuten 16 l in die Wanne. Wie viel Wasser ist nach 5 Minuten in der Wanne?"
                say: "Ein Wasserhahn füllt in zwei Minuten sechzehn Liter in die Badewanne. Wie viel Wasser ist nach fünf Minuten in der Wanne?"
                options: ["40 l", "19 l", "80 l"]
                answer: "40 l"
              - id: l1-n5
                type: true_false
                text: "9 Bonbons kosten 0,90 €. Kostet 1 Bonbon 10 Cent?"
                say: "Neun Bonbons kosten neunzig Cent. Kostet ein Bonbon zehn Cent?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "6 Muffins kosten 9 €. Was kostet 1 Muffin?"
            say: "Sechs Muffins kosten neun Euro. Was kostet ein Muffin?"
            options: ["1,50 €", "3 €", "54 €"]
            answer: "1,50 €"
          - id: l1-c2
            type: multiple_choice
            text: "6 Muffins kosten 9 €. Was kosten 4 Muffins?"
            say: "Sechs Muffins kosten neun Euro. Was kosten vier Muffins?"
            options: ["6 €", "7 €", "5 €"]
            answer: "6 €"
          - id: l1-c3
            type: fill_in_blank
            text: "5 m Stoff kosten 20 €."
            say: "Fünf Meter Stoff kosten zwanzig Euro. Was kostet ein Meter, was kosten acht Meter?"
            frame: "1 m: _ | 8 m: _"
            options: ["4 €", "32 €", "23 €", "40 €"]
            answer: ["4 €", "32 €"]
          - id: l1-c4
            type: multiple_choice
            text: "4 Kiwis kosten 2,40 €. Was kostet 1 Kiwi?"
            say: "Vier Kiwis kosten zwei Euro vierzig. Was kostet eine Kiwi?"
            options: ["0,60 €", "0,80 €", "9,60 €"]
            answer: "0,60 €"
          - id: l1-c5
            type: true_false
            text: "2 Bälle kosten 18 €. Kosten 5 Bälle 21 €?"
            say: "Zwei Bälle kosten achtzehn Euro. Kosten fünf Bälle einundzwanzig Euro?"
            answer: false
          - id: l1-c6
            type: text_input
            text: "7 gleiche Kisten wiegen 35 kg. Wie viele Kilogramm wiegen 3 Kisten?"
            say: "Sieben gleiche Kisten wiegen fünfunddreißig Kilogramm. Wie viele Kilogramm wiegen drei Kisten?"
            answer: "15"

  - n: 2
    title: { de: "Rezepte und Wege", en: "Recipes and journeys" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "2 Hefte kosten 3 €. Was kosten 6 Hefte?"
            say: "Zwei Hefte kosten drei Euro. Was kosten sechs Hefte?"
            options: ["9 €", "7 €", "18 €"]
            answer: "9 €"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "4 Brezeln kosten 6 €."
            say: "Vier Brezeln kosten sechs Euro. Was kostet eine Brezel?"
            frame: "1 Brezel: _"
            options: ["1,50 €", "2 €", "24 €"]
            answer: ["1,50 €"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Pfannkuchen für 4 Personen\n200 g Mehl\n400 ml Milch\n2 Eier\n\nIhr seid 6 Personen."
            say: "Das Rezept reicht für vier Personen. Ihr seid aber sechs. Wie viel Mehl braucht ihr?"
          - text: "4 Personen: 200 g\n2 Personen: 100 g\n6 Personen: 200 g + 100 g = 300 g"
            say: "Hier musst du nicht auf eins rechnen. Für die Hälfte, also zwei Personen, brauchst du hundert Gramm. Sechs Personen sind vier und zwei. Zweihundert plus hundert sind dreihundert Gramm Mehl."
          - text: "Ein Lied dauert 3 Minuten.\nSingen es 4 Kinder zusammen, dauert es auch 3 Minuten."
            say: "Aber Vorsicht: Nicht alles wächst mit. Wenn vier Kinder ein Lied zusammen singen, dauert es nicht viermal so lange. Frag dich immer: Heißt doppelt so viele hier wirklich doppelt so viel?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Pfannkuchen für 4 Personen: 400 ml Milch. Wie viel Milch brauchst du für 6 Personen?"
                say: "Für Pfannkuchen für vier Personen brauchst du vierhundert Milliliter Milch. Wie viel Milch brauchst du für sechs Personen?"
                options: ["600 ml", "800 ml", "500 ml"]
                answer: "600 ml"
                feedback:
                  "800 ml": "800 ml reichen für 8 Personen. Ihr seid 6."
                hints:
                  - "Rechne zuerst für 2 Personen."
                  - "2 Personen: 200 ml. 6 Personen sind 4 und 2."
                  - "600 ml."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Pfannkuchen für 4 Personen: 2 Eier. Wie viele Eier brauchst du für 6 Personen?"
                say: "Für Pfannkuchen für vier Personen brauchst du zwei Eier. Wie viele Eier brauchst du für sechs Personen?"
                options: ["3", "4", "8"]
                answer: "3"
                hints:
                  - "Wie viele Eier brauchst du für 2 Personen?"
                  - "Für 2 Personen 1 Ei. 6 Personen sind 4 und 2."
                  - "3 Eier."
              - id: l2-f3
                type: fill_in_blank
                text: "Für 4 Personen brauchst du 200 g Mehl."
                say: "Für vier Personen brauchst du zweihundert Gramm Mehl. Wie viel für zwei Personen, wie viel für zehn Personen?"
                frame: "2 Personen: _ | 10 Personen: _"
                options: ["100 g", "500 g", "400 g", "1000 g"]
                answer: ["100 g", "500 g"]
                hints:
                  - "2 Personen sind die Hälfte von 4 Personen."
                  - "10 Personen sind 4 und 4 und 2: 200 g + 200 g + 100 g."
                  - "100 g und 500 g."
              - id: l2-f4
                type: true_false
                text: "Ein Lied dauert 3 Minuten. 4 Kinder singen es zusammen. Dauert es dann 12 Minuten?"
                say: "Ein Lied dauert drei Minuten. Vier Kinder singen es zusammen. Dauert es dann zwölf Minuten?"
                answer: false
                hints:
                  - "Wird ein Lied länger, wenn mehr Kinder mitsingen?"
                  - "Alle singen gleichzeitig. Das Lied ist gleich lang."
                  - "Nein, es dauert 3 Minuten."
              - id: l2-f5
                type: multiple_choice
                text: "Bei welcher Aufgabe gilt: doppelt so viele, doppelt so viel?"
                say: "Bei welcher Aufgabe gilt: doppelt so viele, doppelt so viel?"
                options: ["4 Hefte kosten 3 €. Was kosten 8 Hefte?", "Ein Kuchen backt 40 Minuten. Wie lange backen 2 Kuchen zusammen im Ofen?", "Ein Kind ist 8 Jahre alt. Wie alt sind 2 Kinder?"]
                answer: "4 Hefte kosten 3 €. Was kosten 8 Hefte?"
                hints:
                  - "Frag bei jeder Aufgabe: Wächst die Menge wirklich mit?"
                  - "Zwei Kuchen im Ofen backen gleichzeitig. Das Alter wächst auch nicht mit."
                  - "4 Hefte kosten 3 €. Was kosten 8 Hefte?"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Für einen Kuchen mit 12 Stücken brauchst du 300 g Zucker. Wie viel Zucker brauchst du für einen kleinen Kuchen mit 4 Stücken?"
                say: "Für einen Kuchen mit zwölf Stücken brauchst du dreihundert Gramm Zucker. Wie viel Zucker brauchst du für einen kleinen Kuchen mit vier Stücken?"
                options: ["100 g", "150 g", "900 g"]
                answer: "100 g"
                hints: ["4 Stücke sind ein Drittel von 12 Stücken."]
              - id: l2-s2
                type: multiple_choice
                text: "Ein Zug fährt in 2 Stunden 240 km. Wie weit kommt er in 3 Stunden, wenn er gleich schnell fährt?"
                say: "Ein Zug fährt in zwei Stunden zweihundertvierzig Kilometer. Wie weit kommt er in drei Stunden, wenn er gleich schnell fährt?"
                options: ["360 km", "480 km", "300 km"]
                answer: "360 km"
                hints: ["In einer Stunde fährt er 120 km."]
              - id: l2-s3
                type: true_false
                text: "Ein Handtuch trocknet auf der Leine in 2 Stunden. Brauchen 3 Handtücher nebeneinander 6 Stunden?"
                say: "Ein Handtuch trocknet auf der Wäscheleine in zwei Stunden. Brauchen drei Handtücher nebeneinander sechs Stunden?"
                answer: false
                hints: ["Die Handtücher trocknen gleichzeitig."]
              - id: l2-s4
                type: fill_in_blank
                text: "Für 3 Personen nimmt Opa 6 Kartoffeln."
                say: "Für drei Personen nimmt Opa sechs Kartoffeln. Wie viele für eine Person, wie viele für fünf Personen?"
                frame: "1 Person: _ | 5 Personen: _"
                options: ["2", "10", "8", "15"]
                answer: ["2", "10"]
                hints: ["6 : 3 = 2."]
              - id: l2-s5
                type: multiple_choice
                text: "6 Eis kosten 9 €. Was kosten 4 Eis?\nLeo: 1 Eis kostet 1,50 €, 4 Eis kosten 6 €.\nSina: 2 Eis kosten 3 €, 4 Eis kosten 6 €.\nWer hat richtig gerechnet?"
                say: "Sechs Eis kosten neun Euro. Leo und Sina rechnen aus, was vier Eis kosten. Leo rechnet über ein Eis, Sina über zwei Eis. Wer hat richtig gerechnet?"
                options: ["beide", "nur Leo", "nur Sina"]
                answer: "beide"
                keep_order: true
                hints: ["2 Eis sind ein Drittel von 6 Eis: 9 € : 3 = 3 €."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Nudeln für 2 Personen: 150 g. Wie viel Gramm Nudeln brauchst du für 6 Personen?"
                say: "Für zwei Personen kochst du hundertfünfzig Gramm Nudeln. Wie viel Gramm Nudeln brauchst du für sechs Personen?"
                options: ["450 g", "300 g", "600 g"]
                answer: "450 g"
              - id: l2-n2
                type: multiple_choice
                text: "Ein Drucker druckt in 3 Minuten 45 Seiten. Wie viele Seiten druckt er in 10 Minuten?"
                say: "Ein Drucker druckt in drei Minuten fünfundvierzig Seiten. Wie viele Seiten druckt er in zehn Minuten?"
                options: ["150", "135", "52"]
                answer: "150"
              - id: l2-n3
                type: true_false
                text: "Ein Ei kocht in 7 Minuten weich. Brauchen 3 Eier im selben Topf 21 Minuten?"
                say: "Ein Ei kocht in sieben Minuten weich. Brauchen drei Eier im selben Topf einundzwanzig Minuten?"
                answer: false
              - id: l2-n4
                type: fill_in_blank
                text: "8 Eintrittskarten kosten 56 €."
                say: "Acht Eintrittskarten kosten sechsundfünfzig Euro. Was kostet eine Karte, was kosten drei Karten?"
                frame: "1 Karte: _ | 3 Karten: _"
                options: ["7 €", "21 €", "8 €", "24 €"]
                answer: ["7 €", "21 €"]
              - id: l2-n5
                type: multiple_choice
                text: "Für 5 Personen braucht Mama 1 kg Kartoffeln. Wie viel braucht sie für 15 Personen?"
                say: "Für fünf Personen braucht Mama ein Kilogramm Kartoffeln. Wie viel braucht sie für fünfzehn Personen?"
                options: ["3 kg", "1,5 kg", "11 kg"]
                answer: "3 kg"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: via-one
            type: multiple_choice
            text: "7 Hefte kosten 14 €. Was kosten 3 Hefte?"
            say: "Sieben Hefte kosten vierzehn Euro. Was kosten drei Hefte?"
            options: ["6 €", "10 €", "9 €"]
            answer: "6 €"
          - id: l2-c2
            part: via-one
            type: fill_in_blank
            text: "4 Säcke Erde wiegen 60 kg."
            say: "Vier Säcke Erde wiegen sechzig Kilogramm. Wie schwer ist ein Sack, wie schwer sind sieben Säcke?"
            frame: "1 Sack: _ | 7 Säcke: _"
            options: ["15 kg", "105 kg", "63 kg", "90 kg"]
            answer: ["15 kg", "105 kg"]
          - id: l2-c3
            part: not-proportional
            type: true_false
            text: "Ein Film dauert 90 Minuten. 3 Freunde schauen ihn zusammen. Dauert er dann 270 Minuten?"
            say: "Ein Film dauert neunzig Minuten. Drei Freunde schauen ihn zusammen. Dauert er dann zweihundertsiebzig Minuten?"
            answer: false
          - id: l2-c4
            part: scale
            type: multiple_choice
            text: "In einem Rezept für 4 Personen stehen 600 ml Milch. Wie viel Milch brauchst du für 2 Personen?"
            say: "In einem Rezept für vier Personen stehen sechshundert Milliliter Milch. Wie viel Milch brauchst du für zwei Personen?"
            options: ["300 ml", "400 ml", "1200 ml"]
            answer: "300 ml"
          - id: l2-c5
            part: scale
            type: multiple_choice
            text: "Ein Bus fährt in 3 Stunden 180 km. Wie weit kommt er in 5 Stunden, wenn er gleich schnell fährt?"
            say: "Ein Bus fährt in drei Stunden hundertachtzig Kilometer. Wie weit kommt er in fünf Stunden, wenn er gleich schnell fährt?"
            options: ["300 km", "200 km", "900 km"]
            answer: "300 km"
          - id: l2-c6
            part: via-one
            type: multiple_choice
            text: "5 Brezeln kosten 4 €. Was kosten 3 Brezeln?"
            say: "Fünf Brezeln kosten vier Euro. Was kosten drei Brezeln?"
            options: ["2,40 €", "2 €", "12 €"]
            answer: "2,40 €"
          - id: l2-c7
            part: via-one
            type: fill_in_blank
            text: "6 Flaschen Wasser kosten 3,60 €."
            say: "Sechs Flaschen Wasser kosten drei Euro sechzig. Was kostet eine Flasche, was kosten vier Flaschen?"
            frame: "1 Flasche: _ | 4 Flaschen: _"
            options: ["0,60 €", "2,40 €", "0,50 €", "1,60 €"]
            answer: ["0,60 €", "2,40 €"]
          - id: l2-c8
            part: via-one
