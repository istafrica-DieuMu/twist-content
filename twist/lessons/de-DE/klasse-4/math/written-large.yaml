            show: { drawn: written-calc, rows: ["7845", "3412"], op: "-" }
            answer: "4433"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "63 452 − 27 316"
            say: "Bei den Einern geht zwei minus sechs nicht. Du entbündelst einen Zehner: Du streichst die Fünf durch und schreibst klein eine Vier darüber. Aus zwei Einern werden zwölf. Zwölf minus sechs ist sechs."
            show: { drawn: written-calc, rows: ["63452", "27316"], op: "-", above: "   41", cross: "   x ", result: "____6" }
          - text: "63 452 − 27 316 = 36 136"
            say: "So geht es weiter, Stelle für Stelle. Bei den Tausendern geht drei minus sieben nicht. Du entbündelst einen Zehntausender: Aus sechs werden fünf, aus drei Tausendern dreizehn. Dreizehn minus sieben ist sechs, fünf minus zwei ist drei. Das Ergebnis ist sechsunddreißigtausendeinhundertsechsunddreißig."
            show: { drawn: written-calc, rows: ["63452", "27316"], op: "-", above: "51 41", cross: "x  x ", result: "36136" }
          - text: "Probe: 36 136 + 27 316 = 63 452"
            say: "Bei der Probe rechnest du das Ergebnis plus die Zahl, die du abgezogen hast. Dann muss die erste Zahl herauskommen. Hier kommt dreiundsechzigtausendvierhundertzweiundfünfzig heraus, also hast du richtig gerechnet."
            show: { drawn: written-calc, rows: ["36136", "27316"], op: "+", carry: "1  1 ", result: "63452" }

