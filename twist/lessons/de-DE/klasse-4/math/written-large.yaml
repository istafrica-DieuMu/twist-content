# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.written-large
skill: math.written-add-sub.large
curriculum: de-DE
language: de
title:
  de: Schriftlich rechnen mit großen Zahlen
  en: Column addition and subtraction with large numbers
summary: >
  Column addition and subtraction with five-digit numbers. Lesson 1 adds,
  with several Überträge and with numbers of different lengths written
  stellengerecht, and checks the size with an Überschlag; lesson 2
  subtracts with Entbündeln, checks with the Probe (the result plus the
  number taken away gives the first number), and ends with the skill
  check. Typed answers are plain digits.
metadata:
  year: klasse-4
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.check, math.large-numbers.to-10000]
  also_practises: [math.add-sub-to-1000.large-semi-written]
  vocabulary: { de: [schriftlich, Übertrag, entbündeln, stellengerecht, Überschlag, Probe] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: add, what: { de: große Zahlen schriftlich addieren, en: adding large numbers in columns } }
    - { id: sub, what: { de: große Zahlen schriftlich subtrahieren, en: subtracting large numbers in columns } }
    - { id: align, what: { de: Zahlen verschiedener Länge stellengerecht rechnen, en: working with numbers of different lengths by place } }
    - { id: check, what: { de: mit Überschlag und Probe prüfen, en: checking with an estimate and the inverse } }
  misconceptions:
    - id: forgotten-carry
      what: Forgets a Übertrag when several columns carry
      addressed: lesson 1 Learn carries in three columns; a true/false task with one forgotten Übertrag in the full and none stages of lesson 1 and in the skill check; the some stage checks a correct one
    - id: misaligned
      what: Writes numbers of different lengths left-aligned instead of by place
      addressed: lesson 1 Learn adds a four-digit to a five-digit number; every stage of lesson 1 has one, the written-calc drawing shows them stellengerecht
    - id: forgotten-regroup
      what: Forgets to lower the next digit after entbündeln
      addressed: lesson 2 Learn crosses the digit out and writes the lowered digit above it; a true/false task with that slip in the full and none stages of lesson 2 and in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Schriftlich addieren, en: Column addition }
    goal:
      de: "Addier große Zahlen schriftlich und vergiss keinen Übertrag. Schreib Einer unter Einer, auch wenn eine Zahl kürzer ist."
      en: "Add large numbers in columns and don't forget any carries. Put ones under ones, even when one number is shorter."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: viertausendfünfhundertdreiundzwanzig plus dreitausendzweihundertachtundsechzig."
            show: { drawn: written-calc, rows: ["4523", "3268"], op: "+" }
            answer: "7791"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Stellen hat 45 380?"
            say: "Wie viele Stellen hat fünfundvierzigtausenddreihundertachtzig?"
            options: ["5", "4", "6"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "25 478 + 13 965"
            say: "Bei großen Zahlen rechnest du genauso wie bisher. Fang bei den Einern an: acht plus fünf ist dreizehn. Drei schreibst du hin, eins überträgst du zu den Zehnern."
            show: { drawn: written-calc, rows: ["25478", "13965"], op: "+", carry: "   1 ", result: "____3" }
          - text: "25 478 + 13 965 = 39 443"
            say: "Bei den Zehnern, Hundertern und Tausendern kommt jedes Mal ein Übertrag dazu. Vergiss keinen. Das Ergebnis ist neununddreißigtausendvierhundertdreiundvierzig."
            show: { drawn: written-calc, rows: ["25478", "13965"], op: "+", carry: " 111 ", result: "39443" }
          - text: "46 307 + 8 596 = 54 903"
            say: "Ist eine Zahl kürzer, schreibst du sie stellengerecht: Einer unter Einer, Zehner unter Zehner. Bei den Zehntausendern steht unten keine Ziffer: vier plus der Übertrag eins ist fünf."
            show: { drawn: written-calc, rows: ["46307", "8596"], op: "+", carry: "1 11 ", result: "54903" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
