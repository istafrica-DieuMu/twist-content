                  - "Bei den Zehnern: vier plus drei plus eins."
                  - "57 783. Tippe 57783."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Ist das richtig gerechnet?"
                say: "Lies die Rechnung. Ist das richtig gerechnet?"
                show: { drawn: written-calc, rows: ["28467", "15284"], op: "+", result: "43651" }
                answer: false
                hints:
                  - "Rechne Stelle für Stelle nach."
                  - "Bei den Zehnern: sechs plus acht plus eins ist fünfzehn. Wurde der Übertrag zu den Hundertern weitergegeben?"
                  - "Nein. Richtig ist 43 751."
              - id: l1-f3
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich. Die zweite Zahl ist kürzer."
                show: { drawn: written-calc, rows: ["53829", "7456"], op: "+" }
