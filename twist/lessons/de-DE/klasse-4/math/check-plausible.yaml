# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.check-plausible
skill: math.word-problems.check-plausible
curriculum: de-DE
language: de
title:
  de: Kann das stimmen?
  en: Does the answer make sense?
summary: >
  Lesson 1 asks whether a result fits the situation: is the size
  possible, is the unit right, does a Rest need one more car or box, is
  the change more than the money paid? Lesson 2 finds the mistake in a
  wrong solution (plus instead of mal, a zero too many, the comma
  forgotten), puts it right, checks it with an Überschlag or the
  Umkehraufgabe and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.word-problems.multi-step]
  also_practises: [math.add-sub-to-1000.estimate, math.mult-div.remainder]
  vocabulary: { de: [Ergebnis, prüfen, verbessern, Überschlag, Umkehraufgabe, Rest, Antwortsatz] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: size, what: { de: "prüfen, ob Größe und Einheit eines Ergebnisses stimmen können", en: checking whether the size and unit of a result are possible } }
    - { id: remainder, what: { de: den Rest in der Sachsituation deuten, en: interpreting a remainder in the story } }
    - { id: fix, what: { de: den Fehler in einer Lösung finden und sie verbessern, en: finding the mistake in a solution and putting it right } }
    - { id: check, what: { de: "eine Lösung mit Überschlag, Umkehraufgabe oder Antwortsatz prüfen", en: "checking a solution with an estimate, the inverse or the answer sentence" } }
  misconceptions:
    - id: result-not-checked
      what: Accepts any result the calculation gives, even a teacher 168 m tall or change worth more than the money paid
      addressed: lesson 1 Learn compares a result with what the child knows of the world; every stage has an impossible size or amount, and lesson 2 Learn checks a wrong solution with an Überschlag, with feedback in l2-f1
    - id: remainder-ignored
      what: In a sharing story, gives the quotient without the Rest (30 children, 4 per car, 7 cars)
      addressed: lesson 1 Learn adds one more car for the Rest; l1-f2, l1-s2, l1-n2, l1-c2, l2-w2, l2-s1, l2-n2 and l2-c2 ask how many cars, boats or boxes are needed, with feedback in l1-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Passt das Ergebnis?", en: "Does the result fit?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Tom hat 50 €. Er kauft 3 Bücher zu je 12 €. Wie viel Geld bleibt ihm?"
            say: "Tom hat fünfzig Euro. Er kauft drei Bücher zu je zwölf Euro. Wie viel Geld bleibt ihm?"
            options: ["14 €", "36 €", "38 €"]
            answer: "14 €"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viel ist 612 − 289 ungefähr?"
            say: "Wie viel ist sechshundertzwölf minus zweihundertneunundachtzig ungefähr?"
            options: ["300", "400", "900"]
            answer: "300"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lena: Ein Schulbus ist 120 m lang."
            say: "Lena hat ausgerechnet: Ein Schulbus ist hundertzwanzig Meter lang. Kann das sein? Ein Fußballfeld ist ungefähr hundert Meter lang. Ein Bus ist viel kürzer, ungefähr zwölf Meter. Das Ergebnis passt nicht. Lena sucht ihren Fehler."
          - text: "30 Kinder, 4 Kinder pro Auto\n30 : 4 = 7 Rest 2\n7 Autos sind zu wenig: 8 Autos"
            say: "Dreißig Kinder fahren mit, in ein Auto passen vier. Dreißig geteilt durch vier sind sieben Rest zwei. Mit sieben Autos blieben zwei Kinder zu Hause. Für den Rest braucht man noch ein Auto. Also acht Autos."
          - text: "Prüfe:\nKann die Größe stimmen?\nPasst die Einheit?\nPasst der Überschlag?\nWas heißt der Rest?"
            say: "Prüfe am Ende jedes Ergebnis. Kann die Zahl in Wirklichkeit stimmen? Passt die Einheit? Passt der Überschlag? Und bei einem Rest: Was bedeutet er in der Geschichte?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Jan rechnet aus: Seine Lehrerin ist 168 m groß. Kann das stimmen?"
                say: "Jan rechnet aus: Seine Lehrerin ist hundertachtundsechzig Meter groß. Kann das stimmen?"
                answer: false
                hints:
                  - "Wie groß ist ein Erwachsener ungefähr?"
                  - "Ein Erwachsener ist ungefähr 1,70 m groß. 168 m sind höher als ein Kirchturm."
                  - "Nein. Gemeint sind 168 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "30 Kinder fahren zum Zoo. In ein Auto passen 4 Kinder. Ben rechnet 30 : 4 = 7 Rest 2 und schreibt: Wir brauchen 7 Autos. Was stimmt?"
                say: "Dreißig Kinder fahren zum Zoo. In ein Auto passen vier Kinder. Ben rechnet dreißig geteilt durch vier gleich sieben Rest zwei und schreibt: Wir brauchen sieben Autos. Was stimmt?"
                options: ["Es sind 8 Autos. Die 2 Kinder brauchen auch einen Platz.", "7 Autos stimmen.", "Es sind 6 Autos."]
                answer: "Es sind 8 Autos. Die 2 Kinder brauchen auch einen Platz."
                feedback:
                  "7 Autos stimmen.": "Dann bleiben 2 Kinder zu Hause. Der Rest braucht noch ein Auto."
                hints:
                  - "Was bedeutet der Rest 2 in der Geschichte?"
                  - "2 Kinder haben in den 7 Autos keinen Platz."
                  - "Es sind 8 Autos."
              - id: l1-f3
                type: multiple_choice
                text: "Mia bezahlt ihren Einkauf mit 20 €. Welches Rückgeld kann nicht stimmen?"
                say: "Mia bezahlt ihren Einkauf mit zwanzig Euro. Welches Rückgeld kann nicht stimmen?"
                options: ["25 €", "4,50 €", "12 €"]
                answer: "25 €"
                hints:
                  - "Kann das Rückgeld mehr sein als das Geld, das sie gibt?"
                  - "Mia gibt 20 €. Zurück bekommt sie weniger."
                  - "25 €."
              - id: l1-f4
                type: multiple_choice
                text: "Ein Becken ist 25 m lang. Paul schwimmt 8 Bahnen. Er rechnet: 25 · 8 = 2000 m. Passt das?"
                say: "Ein Schwimmbecken ist fünfundzwanzig Meter lang. Paul schwimmt acht Bahnen. Er rechnet: fünfundzwanzig mal acht gleich zweitausend Meter. Passt das?"
                options: ["Nein, 25 · 8 = 200. Er schwimmt 200 m.", "Ja, 2000 m stimmen.", "Nein, er schwimmt 33 m."]
                answer: "Nein, 25 · 8 = 200. Er schwimmt 200 m."
                hints:
                  - "Mach einen Überschlag."
                  - "25 · 8 ist weniger als 30 · 8 = 240."
                  - "Nein, 25 · 8 = 200. Er schwimmt 200 m."
              - id: l1-f5
                type: true_false
                text: "Ein Kuchen hat 12 Stücke. 3 Kinder essen je 2 Stücke. Lara rechnet: Es bleiben 15 Stücke übrig. Kann das stimmen?"
                say: "Ein Kuchen hat zwölf Stücke. Drei Kinder essen je zwei Stücke. Lara rechnet: Es bleiben fünfzehn Stücke übrig. Kann das stimmen?"
                answer: false
                hints:
                  - "Können mehr Stücke übrig bleiben, als der Kuchen hat?"
                  - "Die Kinder essen 6 Stücke. Es bleiben 12 − 6."
                  - "Nein, es bleiben 6 Stücke."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Max schätzt: Ein Apfel wiegt ungefähr 150 g. Kann das stimmen?"
                say: "Max schätzt: Ein Apfel wiegt ungefähr hundertfünfzig Gramm. Kann das stimmen?"
                answer: true
                hints: ["Eine Tafel Schokolade wiegt 100 g."]
              - id: l1-s2
                type: multiple_choice
                text: "Ein Boot nimmt 6 Personen mit. 45 Personen wollen über den See. Wie oft muss das Boot mindestens fahren?"
                say: "Ein Boot nimmt sechs Personen mit. Fünfundvierzig Personen wollen über den See. Wie oft muss das Boot mindestens fahren?"
                options: ["8-mal", "7-mal", "7,5-mal"]
                answer: "8-mal"
                hints: ["45 : 6 = 7 Rest 3. Die 3 Personen wollen auch hinüber."]
              - id: l1-s3
                type: multiple_choice
                text: "Ole rechnet aus, wie alt seine Oma ist. Welches Ergebnis kann stimmen?"
                say: "Ole rechnet aus, wie alt seine Oma ist. Welches Ergebnis kann stimmen?"
                options: ["72 Jahre", "720 Jahre", "7 Jahre"]
                answer: "72 Jahre"
                hints: ["Eine Oma ist älter als Oles Mama, aber kein Mensch wird 720 Jahre alt."]
              - id: l1-s4
                type: multiple_choice
                text: "Kim kauft 4 Hefte zu je 1,20 €. Sie rechnet: 48 €. Was ist passiert?"
                say: "Kim kauft vier Hefte zu je einem Euro zwanzig. Sie rechnet: achtundvierzig Euro. Was ist passiert?"
                options: ["Sie hat das Komma vergessen. Richtig sind 4,80 €.", "Das stimmt so.", "Sie hat plus statt mal gerechnet."]
                answer: "Sie hat das Komma vergessen. Richtig sind 4,80 €."
                hints: ["Vier Hefte kosten nicht 48 €. Überschlag: 4 · 1 € = 4 €."]
              - id: l1-s5
                type: true_false
                text: "Ein Zug fährt um 9:15 Uhr los und kommt um 11:45 Uhr an. Sara rechnet: Die Fahrt dauert 3 Stunden 30 Minuten. Stimmt das?"
                say: "Ein Zug fährt um neun Uhr fünfzehn los und kommt um elf Uhr fünfundvierzig an. Sara rechnet: Die Fahrt dauert drei Stunden dreißig Minuten. Stimmt das?"
                answer: false
                hints: ["Von 9:15 Uhr bis 11:15 Uhr sind es 2 Stunden."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Elif rechnet aus: Ihr Klassenzimmer ist 8 km lang. Kann das stimmen?"
                say: "Elif rechnet aus: Ihr Klassenzimmer ist acht Kilometer lang. Kann das stimmen?"
                answer: false
              - id: l1-n2
                type: multiple_choice
                text: "50 Eier sollen in Kartons mit je 6 Plätzen verpackt werden. Wie viele Kartons braucht man für alle Eier?"
                say: "Fünfzig Eier sollen in Kartons mit je sechs Plätzen verpackt werden. Wie viele Kartons braucht man für alle Eier?"
                options: ["9", "8", "8 Rest 2"]
                answer: "9"
              - id: l1-n3
                type: multiple_choice
                text: "3 Freunde teilen 24 Murmeln gerecht. Welches Ergebnis passt?"
                say: "Drei Freunde teilen vierundzwanzig Murmeln gerecht. Welches Ergebnis passt?"
                options: ["Jeder bekommt 8 Murmeln.", "Jeder bekommt 72 Murmeln.", "Jeder bekommt 21 Murmeln."]
                answer: "Jeder bekommt 8 Murmeln."
              - id: l1-n4
                type: multiple_choice
                text: "Frau Klein fährt mit dem Rad 12 km in einer Stunde. Sie fährt 3 Stunden. Jonas rechnet: 4 km. Was stimmt?"
                say: "Frau Klein fährt mit dem Rad zwölf Kilometer in einer Stunde. Sie fährt drei Stunden. Jonas rechnet: vier Kilometer. Was stimmt?"
                options: ["Er hat geteilt statt malgenommen. Richtig sind 36 km.", "4 km stimmen.", "Er hat plus gerechnet. Richtig sind 15 km."]
                answer: "Er hat geteilt statt malgenommen. Richtig sind 36 km."
              - id: l1-n5
                type: true_false
                text: "Ein Baby wiegt bei der Geburt 3500 g. Kann das stimmen?"
                say: "Ein Baby wiegt bei der Geburt dreitausendfünfhundert Gramm. Kann das stimmen?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Ein Hund ist 60 cm hoch. Kann das stimmen?"
            say: "Ein Hund ist sechzig Zentimeter hoch. Kann das stimmen?"
            answer: true
          - id: l1-c2
            type: multiple_choice
            text: "26 Kinder essen zu Mittag. An einen Tisch passen 4 Kinder. Wie viele Tische braucht man?"
            say: "Sechsundzwanzig Kinder essen zu Mittag. An einen Tisch passen vier Kinder. Wie viele Tische braucht man?"
            options: ["7", "6", "6,5"]
            answer: "7"
          - id: l1-c3
            type: multiple_choice
            text: "Ali hat 10 € und kauft 2 Bücher zu je 3 €. Er rechnet: Es bleiben 16 € übrig. Was stimmt?"
            say: "Ali hat zehn Euro und kauft zwei Bücher zu je drei Euro. Er rechnet: Es bleiben sechzehn Euro übrig. Was stimmt?"
            options: ["Er hat plus statt minus gerechnet. Es bleiben 4 €.", "16 € stimmen.", "Es bleiben 7 €."]
            answer: "Er hat plus statt minus gerechnet. Es bleiben 4 €."
          - id: l1-c4
            type: true_false
            text: "Eine Katze wiegt 4 kg. Kann das stimmen?"
            say: "Eine Katze wiegt vier Kilogramm. Kann das stimmen?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "39 Kinder wollen Tretboot fahren. In ein Boot passen 4 Kinder. Wie viele Boote brauchen sie?"
            say: "Neununddreißig Kinder wollen Tretboot fahren. In ein Boot passen vier Kinder. Wie viele Boote brauchen sie?"
            options: ["10", "9", "9 Rest 3"]
            answer: "10"
          - id: l1-c6
            type: multiple_choice
            text: "Leo bezahlt mit 10 €. Welches Rückgeld kann stimmen?"
            say: "Leo bezahlt mit zehn Euro. Welches Rückgeld kann stimmen?"
            options: ["3,50 €", "12 €", "10,50 €"]
            answer: "3,50 €"

  - n: 2
    title: { de: "Lösungen verbessern", en: "Putting solutions right" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Ein neues Fahrrad kostet 3 €. Kann das stimmen?"
            say: "Ein neues Fahrrad kostet drei Euro. Kann das stimmen?"
            answer: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "33 Kinder fahren Kanu. In ein Kanu passen 5 Kinder. Wie viele Kanus braucht man?"
            say: "Dreiunddreißig Kinder fahren Kanu. In ein Kanu passen fünf Kinder. Wie viele Kanus braucht man?"
            options: ["7", "6", "6 Rest 3"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ein Kino hat 12 Reihen mit je 18 Plätzen.\nTim: 12 + 18 = 30 Plätze"
            say: "Ein Kino hat zwölf Reihen mit je achtzehn Plätzen. Tim rechnet zwölf plus achtzehn, also dreißig Plätze. Kann das stimmen? Schon zehn Reihen mit je achtzehn Plätzen sind hundertachtzig. Tim hat plus statt mal gerechnet."
          - text: "Verbessert: 12 · 18 = 216 Plätze\nÜberschlag: 10 · 20 = 200. Das passt."
            say: "Tim rechnet neu: zwölf mal achtzehn sind zweihundertsechzehn Plätze. Er prüft mit einem Überschlag: zehn mal zwanzig sind zweihundert. Das passt zu zweihundertsechzehn."
          - text: "1. Passt das Ergebnis?\n2. Wenn nicht: Fehler suchen.\n3. Neu rechnen und wieder prüfen."
            say: "So verbesserst du eine Lösung. Passt das Ergebnis nicht, suchst du den Fehler. Dann rechnest du neu und prüfst noch einmal, mit einem Überschlag oder mit der Umkehraufgabe."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ein Buch hat 240 Seiten. Lea liest jeden Tag 8 Seiten. Sie rechnet: Ich brauche 1920 Tage. Was stimmt?"
                say: "Ein Buch hat zweihundertvierzig Seiten. Lea liest jeden Tag acht Seiten. Sie rechnet: Ich brauche tausendneunhundertzwanzig Tage. Was stimmt?"
                options: ["Sie hat malgenommen statt geteilt. Richtig sind 30 Tage.", "1920 Tage stimmen.", "Sie hat plus gerechnet. Richtig sind 248 Tage."]
                answer: "Sie hat malgenommen statt geteilt. Richtig sind 30 Tage."
                feedback:
                  "1920 Tage stimmen.": "1920 Tage sind mehr als 5 Jahre. So lange liest niemand an einem Buch."
                hints:
                  - "Kann man so lange an einem Buch lesen?"
                  - "Die 240 Seiten werden in Portionen zu 8 Seiten geteilt."
                  - "Richtig sind 240 : 8 = 30 Tage."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Lea hat 240 : 8 = 30 gerechnet. Wie prüft sie das mit der Umkehraufgabe?"
                say: "Lea hat zweihundertvierzig geteilt durch acht gleich dreißig gerechnet. Wie prüft sie das mit der Umkehraufgabe?"
                options: ["30 · 8 = 240", "240 + 8 = 248", "240 − 30 = 210"]
                answer: "30 · 8 = 240"
                hints:
                  - "Die Umkehraufgabe vom Teilen ist das Malnehmen."
                  - "30 Tage mal 8 Seiten müssen wieder alle Seiten ergeben."
                  - "30 · 8 = 240."
              - id: l2-f3
                type: multiple_choice
                text: "Ein Saal hat 15 Reihen mit je 22 Stühlen. Ben rechnet: 15 · 22 = 3300. Was stimmt?"
                say: "Ein Saal hat fünfzehn Reihen mit je zweiundzwanzig Stühlen. Ben rechnet: fünfzehn mal zweiundzwanzig gleich dreitausenddreihundert. Was stimmt?"
                options: ["Überschlag 15 · 20 = 300. Richtig sind 330 Stühle.", "3300 Stühle stimmen.", "Richtig sind 15 + 22 = 37 Stühle."]
                answer: "Überschlag 15 · 20 = 300. Richtig sind 330 Stühle."
                hints:
                  - "Mach einen Überschlag mit 15 · 20."
                  - "15 · 20 = 300. Ben hat eine Null zu viel."
                  - "Richtig sind 330 Stühle."
              - id: l2-f4
                type: true_false
                text: "Ein Seil ist 12 m lang. Es wird in 4 gleiche Stücke geschnitten. Mira antwortet: Ein Stück ist 48 m lang. Passt das?"
                say: "Ein Seil ist zwölf Meter lang. Es wird in vier gleiche Stücke geschnitten. Mira antwortet: Ein Stück ist achtundvierzig Meter lang. Passt das?"
                answer: false
                hints:
                  - "Kann ein Stück länger sein als das ganze Seil?"
                  - "Beim Schneiden wird geteilt: 12 : 4."
                  - "Nein. Ein Stück ist 3 m lang."
              - id: l2-f5
                type: multiple_choice
                text: "Frage: Wie viel kostet ein Ticket? Rechnung: 4 Tickets kosten 36 €. 36 € : 4 = 9 €. Welcher Antwortsatz passt?"
                say: "Die Frage ist: Wie viel kostet ein Ticket? Vier Tickets kosten sechsunddreißig Euro, geteilt durch vier sind das neun Euro. Welcher Antwortsatz passt?"
                options: ["Ein Ticket kostet 9 €.", "4 Tickets kosten 9 €.", "Ein Ticket kostet 36 €."]
                answer: "Ein Ticket kostet 9 €."
                hints:
                  - "Der Antwortsatz beantwortet genau die Frage."
                  - "Gefragt ist der Preis für ein Ticket."
                  - "Ein Ticket kostet 9 €."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ein Bauer hat 84 Eier. Er packt je 10 in eine Schachtel. Er sagt: Für alle Eier brauche ich 8 Schachteln. Was stimmt?"
                say: "Ein Bauer hat vierundachtzig Eier. Er packt je zehn in eine Schachtel. Er sagt: Für alle Eier brauche ich acht Schachteln. Was stimmt?"
                options: ["9 Schachteln. Die 4 übrigen Eier brauchen auch eine.", "8 Schachteln stimmen.", "840 Schachteln."]
                answer: "9 Schachteln. Die 4 übrigen Eier brauchen auch eine."
                hints: ["84 : 10 = 8 Rest 4."]
              - id: l2-s2
                type: true_false
                text: "Die Klasse sammelt Altpapier: 48 kg, 52 kg und 39 kg. Lina rechnet: zusammen 1390 kg. Passt das?"
                say: "Die Klasse sammelt Altpapier: achtundvierzig, zweiundfünfzig und neununddreißig Kilogramm. Lina rechnet: zusammen tausenddreihundertneunzig Kilogramm. Passt das?"
                answer: false
                hints: ["Überschlag: 50 + 50 + 40."]
              - id: l2-s3
                type: multiple_choice
                text: "Mia läuft jeden Tag 2 km. Wie weit läuft sie in einer Woche? Sie rechnet: 2 · 5 = 10 km. Was stimmt?"
                say: "Mia läuft jeden Tag zwei Kilometer. Wie weit läuft sie in einer Woche? Sie rechnet: zwei mal fünf gleich zehn Kilometer. Was stimmt?"
                options: ["Eine Woche hat 7 Tage. Richtig sind 14 km.", "10 km stimmen.", "Sie muss 2 + 7 rechnen."]
                answer: "Eine Woche hat 7 Tage. Richtig sind 14 km."
                hints: ["Wie viele Tage hat eine Woche?"]
              - id: l2-s4
                type: multiple_choice
                text: "Herr Lang kauft 3 Pizzen zu je 8,50 €. Er rechnet: 3 · 8,50 € = 2,55 €. Was stimmt?"
                say: "Herr Lang kauft drei Pizzen zu je acht Euro fünfzig. Er rechnet: drei mal acht Euro fünfzig gleich zwei Euro fünfundfünfzig. Was stimmt?"
                options: ["Überschlag 3 · 9 € = 27 €. Richtig sind 25,50 €.", "2,55 € stimmen.", "Überschlag 3 · 8 € = 24 €. Richtig sind 24 €."]
                answer: "Überschlag 3 · 9 € = 27 €. Richtig sind 25,50 €."
                hints: ["Eine Pizza kostet schon mehr als 2,55 €."]
              - id: l2-s5
                type: true_false
                text: "Der Schulweg von Nils ist 900 m lang. Er geht hin und zurück. Er rechnet: 1800 km. Passt das?"
                say: "Der Schulweg von Nils ist neunhundert Meter lang. Er geht hin und zurück. Er rechnet: tausendachthundert Kilometer. Passt das?"
                answer: false
                hints: ["Schau auf die Einheit."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ein Zug hat 8 Wagen mit je 64 Plätzen. Jana rechnet: 8 · 64 = 72. Was stimmt?"
                say: "Ein Zug hat acht Wagen mit je vierundsechzig Plätzen. Jana rechnet: acht mal vierundsechzig gleich zweiundsiebzig. Was stimmt?"
                options: ["Sie hat plus gerechnet. Richtig sind 512 Plätze.", "72 Plätze stimmen.", "Richtig sind 8 Plätze."]
                answer: "Sie hat plus gerechnet. Richtig sind 512 Plätze."
              - id: l2-n2
                type: multiple_choice
                text: "35 Kinder fahren Riesenrad. In eine Gondel passen 6 Kinder. Wie viele Gondeln brauchen sie?"
                say: "Fünfunddreißig Kinder fahren Riesenrad. In eine Gondel passen sechs Kinder. Wie viele Gondeln brauchen sie?"
                options: ["6", "5", "5 Rest 5"]
                answer: "6"
              - id: l2-n3
                type: true_false
                text: "Mama ist 38 Jahre alt. Ihr Sohn rechnet aus: Mama ist 456 Monate alt. Passt das?"
                say: "Mama ist achtunddreißig Jahre alt. Ihr Sohn rechnet aus: Mama ist vierhundertsechsundfünfzig Monate alt. Passt das?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Frage: Wie viele Kinder fahren nicht mit? Rechnung: 28 − 19 = 9. Welcher Antwortsatz passt?"
                say: "Die Frage ist: Wie viele Kinder fahren nicht mit? Die Rechnung ist achtundzwanzig minus neunzehn gleich neun. Welcher Antwortsatz passt?"
                options: ["9 Kinder fahren nicht mit.", "19 Kinder fahren nicht mit.", "9 Kinder fahren mit."]
                answer: "9 Kinder fahren nicht mit."
              - id: l2-n5
