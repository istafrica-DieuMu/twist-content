# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.divisibility
skill: math.written-mult-div.divisibility
curriculum: de-DE
language: de
title:
  de: Teilbarkeitsregeln
  en: Divisibility rules
summary: >
  Telling without dividing whether a number divides evenly. Lesson 1
  reads the last digit for 2, 5 and 10; lesson 2 uses the Quersumme for 3
  and 9 (234: 2 + 3 + 4 = 9), and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Schriftlich teilen, en: Written division }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.multiples-divisors]
  also_practises: [math.mult-div-larger.multiples-divisors, math.numbers-to-20.even-odd]
  vocabulary: { de: [teilbar, Endziffer, gerade, Quersumme, Teilbarkeitsregel] }
  forms: [picture, drawn, text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: last-digit, what: { de: "an der Endziffer erkennen, ob eine Zahl durch 2, 5 oder 10 teilbar ist", en: "using the last digit to check for 2, 5 or 10" } }
    - { id: digit-sum, what: { de: mit der Quersumme die Teilbarkeit durch 3 und 9 prüfen, en: using the digit sum to check for 3 and 9 } }
    - { id: combined, what: { de: mehrere Teilbarkeitsregeln zusammen anwenden, en: using several rules on one number } }
  misconceptions:
    - id: last-digit-for-3
      what: Uses the last digit for 3 and 9 too (thinks 23 is divisible by 3 because it ends in 3)
      addressed: lesson 2 Learn shows 23 and 33 side by side; l2-f4 and l2-n4 ask about a number ending in 3 or 9 that is not divisible
    - id: quersumme-as-result
      what: Takes the Quersumme for the result of the division
      addressed: lesson 2 Learn says the Quersumme only tells whether it divides; l2-f2 and l2-s2 ask for the Quersumme as a separate step
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Teilbar durch 2, 5 und 10", en: "Divisible by 2, 5 and 10" }
    goal:
      de: "Erkenne an der letzten Ziffer, ob eine Zahl durch 2, 5 oder 10 teilbar ist. 470 endet mit 0."
      en: "Use the last digit to tell whether a number divides by 2, 5 or 10. 470 ends in 0."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Ist 48 eine gerade Zahl?"
            say: "Ist achtundvierzig eine gerade Zahl?"
            answer: true
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ist 7 ein Teiler von 63?"
            say: "Ist sieben ein Teiler von dreiundsechzig?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was glaubst du? Kannst du sehen, ob 356 durch 2 teilbar ist, ohne zu rechnen?"
            say: "Was glaubst du: Kannst du sehen, ob dreihundertsechsundfünfzig durch zwei teilbar ist, ganz ohne zu rechnen?"
          - text: "durch 2: Endziffer 0, 2, 4, 6, 8"
            say: "Ja, das geht! Eine Zahl ist durch zwei teilbar, wenn sie gerade ist. Das siehst du an der letzten Ziffer: null, zwei, vier, sechs oder acht. Dreihundertsechsundfünfzig endet mit sechs, also ist sie durch zwei teilbar."
          - text: "durch 5: Endziffer 0 oder 5"
            say: "Eine Zahl ist durch fünf teilbar, wenn sie mit null oder fünf endet, wie hundertfünfundzwanzig."
          - text: "durch 10: Endziffer 0"
            say: "Durch zehn teilbar sind nur Zahlen, die mit null enden, wie vierhundertsiebzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf alle Zahlen, die durch 5 teilbar sind."
                say: "Tippe auf alle Zahlen, die durch fünf teilbar sind."
                show: { drawn: letter-card, text: "135 252 470 508 995" }
                spans: ["135", "470", "995"]
                hints:
                  - "Schau auf die letzte Ziffer."
                  - "Endet die Zahl mit null oder fünf?"
                  - "135, 470 und 995."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Ist 734 durch 2 teilbar?"
                say: "Ist siebenhundertvierunddreißig durch zwei teilbar?"
                answer: true
                hints:
                  - "Schau auf die letzte Ziffer."
                  - "Vier ist gerade."
                  - "Ja, 734 ist durch 2 teilbar."
              - id: l1-f3
                type: multiple_choice
                text: "Stifte gibt es nur in Zehnerpackungen. Welche Anzahl kannst du genau kaufen, ohne dass ein Stift übrig bleibt?"
                say: "Im Laden gibt es Stifte nur in Zehnerpackungen. Welche Anzahl kannst du genau kaufen, ohne dass ein Stift übrig bleibt?"
                show: { object: pencil }
                options: ["860", "605", "856"]
                answer: "860"
                feedback:
                  "605": "Mit fünf am Ende ist sie durch fünf teilbar, aber nicht durch zehn. Fünf Stifte müsstest du aus einer Packung herausschmuggeln!"
                hints:
                  - "Welche Endziffer brauchst du für zehn?"
                  - "Die letzte Ziffer muss null sein."
                  - "860."
              - id: l1-f4
                type: true_false
                text: "Ist 315 durch 2 teilbar?"
                say: "Ist dreihundertfünfzehn durch zwei teilbar?"
                answer: false
                hints:
                  - "Schau auf die letzte Ziffer."
                  - "Ist fünf gerade?"
                  - "Nein, 315 ist ungerade."
              - id: l1-f5
                type: multiple_choice
                text: "Prüfe 2, 5 und 10. Durch welche davon ist 540 teilbar?"
                say: "Prüfe zwei, fünf und zehn. Durch welche davon ist fünfhundertvierzig teilbar?"
                options: ["durch 2, 5 und 10", "nur durch 5", "nur durch 2"]
                answer: "durch 2, 5 und 10"
                hints:
                  - "Prüfe jede Regel."
                  - "Endet sie mit null? Dann klappen alle drei Regeln."
                  - "durch 2, 5 und 10."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf alle Zahlen, die durch 2 teilbar sind."
                say: "Tippe auf alle Zahlen, die durch zwei teilbar sind."
                show: { drawn: letter-card, text: "318 427 590 663 884" }
                spans: ["318", "590", "884"]
                hints: ["Endet die Zahl mit einer geraden Ziffer?"]
              - id: l1-s2
                type: true_false
                text: "Ist 905 durch 5 teilbar?"
                say: "Ist neunhundertfünf durch fünf teilbar?"
                answer: true
                hints: ["Schau auf die letzte Ziffer."]
              - id: l1-s3
                type: multiple_choice
                text: "Murmeln kommen in Beutel zu je 5. Welche Anzahl passt nicht genau in Fünferbeutel?"
                say: "Murmeln kommen in Beutel zu je fünf Stück. Welche Anzahl passt nicht genau in Fünferbeutel?"
                show: { object: marble }
                options: ["452", "450", "455"]
                answer: "452"
                hints: ["Welche Zahl endet nicht mit null oder fünf?"]
              - id: l1-s4
                type: true_false
                text: "Ist 705 durch 10 teilbar?"
                say: "Ist siebenhundertfünf durch zehn teilbar?"
                answer: false
                hints: ["Durch zehn: Endziffer null."]
              - id: l1-s5
                type: multiple_choice
                text: "Prüfe 2, 5 und 10. Durch welche davon ist 285 teilbar?"
                say: "Prüfe zwei, fünf und zehn. Durch welche davon ist zweihundertfünfundachtzig teilbar?"
                options: ["nur durch 5", "durch 2, 5 und 10", "durch 2 und 5"]
                answer: "nur durch 5"
                hints: ["Prüfe jede Regel einzeln."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf alle Zahlen, die durch 10 teilbar sind."
                say: "Tippe auf alle Zahlen, die durch zehn teilbar sind."
                show: { drawn: letter-card, text: "300 405 610 755 980" }
                spans: ["300", "610", "980"]
              - id: l1-n2
                type: true_false
                text: "Ist 1001 durch 2 teilbar?"
                say: "Ist tausendeins durch zwei teilbar?"
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Welche Zahl ist durch 2 und durch 5 teilbar?"
                say: "Welche Zahl ist durch zwei und durch fünf teilbar?"
                options: ["620", "625", "622"]
                answer: "620"
              - id: l1-n4
                type: true_false
                text: "Ist 3555 durch 5 teilbar?"
                say: "Ist dreitausendfünfhundertfünfundfünfzig durch fünf teilbar?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Prüfe 2, 5 und 10. Durch welche davon ist 726 teilbar?"
                say: "Prüfe zwei, fünf und zehn. Durch welche davon ist siebenhundertsechsundzwanzig teilbar?"
                options: ["nur durch 2", "durch 2 und 5", "durch 2, 5 und 10"]
                answer: "nur durch 2"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tippe auf alle Zahlen, die durch 5 teilbar sind."
            say: "Tippe auf alle Zahlen, die durch fünf teilbar sind."
            show: { drawn: letter-card, text: "215 352 640 708 845" }
            spans: ["215", "640", "845"]
          - id: l1-c2
            type: true_false
            text: "Ist 878 durch 2 teilbar?"
            say: "Ist achthundertachtundsiebzig durch zwei teilbar?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Welche Zahl ist durch 10 teilbar?"
            say: "Welche Zahl ist durch zehn teilbar?"
            options: ["1230", "1235", "1203"]
            answer: "1230"
          - id: l1-c4
            type: true_false
            text: "Ist 4570 durch 10 teilbar?"
            say: "Ist viertausendfünfhundertsiebzig durch zehn teilbar?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Welche Zahl ist durch 5, aber nicht durch 10 teilbar?"
            say: "Welche Zahl ist durch fünf, aber nicht durch zehn teilbar?"
            options: ["735", "730", "736"]
            answer: "735"
          - id: l1-c6
            type: true_false
            text: "Ist 693 durch 2 teilbar?"
            say: "Ist sechshundertdreiundneunzig durch zwei teilbar?"
            answer: false

  - n: 2
    title: { de: "Teilbar durch 3 und 9", en: "Divisible by 3 and 9" }
    goal:
      de: "Prüf mit der Quersumme, ob eine Zahl durch 3 oder 9 teilbar ist. Bei 234 ergibt 2 + 3 + 4 genau 9."
      en: "Use the digit sum to check whether a number divides by 3 or 9. For 234, 2 + 3 + 4 makes 9."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Ist 465 durch 5 teilbar?"
            say: "Ist vierhundertfünfundsechzig durch fünf teilbar?"
            answer: true
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "3 + 5 + 7 = _"
            say: "Drei plus fünf plus sieben."
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was glaubst du? Was kommt heraus, wenn du die Ziffern von 234 zusammenzählst?"
            say: "Zweihundertvierunddreißig hat die Ziffern zwei, drei und vier. Was glaubst du: Was kommt heraus, wenn du sie zusammenzählst?"
          - text: "234: 2 + 3 + 4 = 9"
            say: "Neun! Zählst du die Ziffern einer Zahl zusammen, bekommst du die Quersumme. Die Quersumme von zweihundertvierunddreißig ist zwei plus drei plus vier, also neun."
          - text: "durch 3: Quersumme durch 3 teilbar | durch 9: Quersumme durch 9 teilbar"
            say: "Ist die Quersumme durch drei teilbar, ist auch die Zahl durch drei teilbar. Ist die Quersumme durch neun teilbar, ist die Zahl durch neun teilbar. Zweihundertvierunddreißig ist also durch drei und durch neun teilbar."
          - text: "23: 2 + 3 = 5 | 33: 3 + 3 = 6"
            say: "Bei drei und neun hilft die letzte Ziffer nicht. Dreiundzwanzig endet mit drei, aber die Quersumme fünf ist nicht durch drei teilbar. Dreiunddreißig hat die Quersumme sechs: Sie ist durch drei teilbar. Die Quersumme sagt dir nur, ob die Zahl teilbar ist, nicht das Ergebnis."
          - text: "Wusstest du? 2520 kannst du durch jede Zahl von 1 bis 10 teilen, ohne Rest."
            say: "Wusstest du? Zweitausendfünfhundertzwanzig ist die kleinste Zahl, die du durch jede Zahl von eins bis zehn teilen kannst, ohne Rest. Prüf es mit den Regeln: Sie endet mit null, und ihre Quersumme ist neun."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Ist 312 durch 3 teilbar?"
                say: "Ist dreihundertzwölf durch drei teilbar?"
                answer: true
                hints:
                  - "Bilde die Quersumme."
                  - "Drei plus eins plus zwei ist sechs."
                  - "Ja, 6 ist durch 3 teilbar."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Wie groß ist die Quersumme von 457?"
                say: "Wie groß ist die Quersumme von vierhundertsiebenundfünfzig?"
                answer: "16"
                hints:
                  - "Zähle die Ziffern zusammen."
                  - "Vier plus fünf plus sieben."
                  - "16."
              - id: l2-f3
                type: highlight_in_text
                text: "Tippe auf alle Zahlen, die durch 9 teilbar sind."
                say: "Tippe auf alle Zahlen, die durch neun teilbar sind."
                show: { drawn: letter-card, text: "126 243 350 504 619" }
                spans: ["126", "243", "504"]
                hints:
                  - "Bilde bei jeder Zahl die Quersumme."
                  - "Ist die Quersumme neun oder achtzehn?"
                  - "126, 243 und 504."
              - id: l2-f4
                type: true_false
                text: "Ist 43 durch 3 teilbar?"
                say: "Ist dreiundvierzig durch drei teilbar?"
                answer: false
                hints:
                  - "Die letzte Ziffer hilft hier nicht. Bilde die Quersumme."
                  - "Vier plus drei ist sieben."
                  - "Nein, 7 ist nicht durch 3 teilbar."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Zahl ist durch 3, aber nicht durch 9 teilbar?"
                say: "Welche Zahl ist durch drei, aber nicht durch neun teilbar?"
                options: ["123", "117", "125"]
                answer: "123"
                hints:
                  - "Bilde bei jeder Zahl die Quersumme."
                  - "Die Quersummen sind sechs, neun und acht. Welche ist durch drei, aber nicht durch neun teilbar?"
                  - "123."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Ist 522 durch 9 teilbar?"
                say: "Ist fünfhundertzweiundzwanzig durch neun teilbar?"
                answer: true
                hints: ["Bilde die Quersumme."]
              - id: l2-s2
                type: text_input
                text: "Wie groß ist die Quersumme von 2348?"
                say: "Wie groß ist die Quersumme von zweitausenddreihundertachtundvierzig?"
                answer: "17"
                hints: ["Zähle alle vier Ziffern zusammen."]
              - id: l2-s3
                type: highlight_in_text
