# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.complex-problems
skill: math.word-problems.complex
curriculum: de-DE
language: de
title:
  de: Knifflige Sachaufgaben
  en: Complex word problems
summary: >
  Lesson 1 solves problems from price lists and a bus timetable: find the
  facts the question needs, leave the others out, and compare ways
  (Familienkarte or single tickets); lesson 2 takes its facts from bar
  charts, solves the same problem in two ways ((60 + 45 + 75) · 2 € or
  120 € + 90 € + 150 €) and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.word-problems.estimate-or-exact, math.data.read-charts]
  also_practises: [math.data.read-tables, math.time.timetables, math.money.word-problems]
  vocabulary: { de: [Tabelle, Fahrplan, Diagramm, Angabe, Lösungsweg, günstiger, Unterschied] }
  forms: [drawn, text, audio]
  drawn: [bar-chart, table]
  facets: []
  parts:
    - { id: table, what: { de: "Sachaufgaben mit Preislisten, Tabellen und Fahrplänen lösen", en: "solving problems with price lists, tables and timetables" } }
    - { id: chart, what: { de: Sachaufgaben mit Diagrammen lösen, en: solving problems with bar charts } }
    - { id: facts, what: { de: "die Angaben auswählen, die die Frage braucht", en: picking out the facts the question needs } }
    - { id: ways, what: { de: Lösungswege vergleichen, en: comparing ways of solving } }
  misconceptions:
    - id: uses-every-number
      what: Uses every number in the table, also the ones the question does not need
      addressed: lesson 1 Learn picks out the facts the question needs; l1-f5, l1-n4 and l1-c3 ask which fact is not needed, and lesson 2 charts carry rows the question does not ask about
    - id: one-way-only
      what: Thinks only one way of calculating can be right, or stops at the first step (gives the cost of the Familienkarte instead of the saving)
      addressed: lesson 1 Learn compares two ways of buying tickets and lesson 2 Learn solves one problem in two ways; l1-s5, l2-w2, l2-f4, l2-s5, l2-n5 and l2-c4 ask who calculated right with both ways right, and l1-f2 and l2-f1 have feedback on the first-step answer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Tabellen und Fahrpläne", en: "Tables and timetables" }
    goal:
      de: "Such dir aus Preislisten und Fahrplänen nur das heraus, was du brauchst. Vergleich dann, welcher Weg günstiger ist."
      en: "Pick out only what you need from price lists and timetables. Then compare which way is cheaper."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Lina hat 10 €. Sie kauft 2 Hefte zu je 1,50 € und einen Stift für 2 €. Wie viel Geld bleibt ihr?"
            say: "Lina hat zehn Euro. Sie kauft zwei Hefte zu je einem Euro fünfzig und einen Stift für zwei Euro. Wie viel Geld bleibt ihr?"
            options: ["5 €", "6,50 €", "3,50 €"]
            answer: "5 €"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viel kosten 4 Karten zu je 4,90 € ungefähr?"
            say: "Wie viel kosten vier Karten zu je vier Euro neunzig ungefähr?"
            options: ["20 €", "16 €", "40 €"]
            answer: "20 €"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Die Familienkarte gilt für 2 Erwachsene und 2 Kinder.\n\nFamilie Weber: 2 Erwachsene, 3 Kinder"
            say: "Familie Weber geht ins Freibad: zwei Erwachsene und drei Kinder. Was ist am günstigsten? Lies die Preisliste genau. Du brauchst nur die Eintrittspreise."
            show: { drawn: table, rows: [["Freibad", "Preis"], ["Kind", "3 €"], ["Erwachsener", "5 €"], ["Familienkarte", "14 €"]] }
          - text: "Weg 1: nur einzelne Karten\n2 · 5 € + 3 · 3 € = 19 €\nWeg 2: Familienkarte und 1 Kind\n14 € + 3 € = 17 €"
            say: "Es gibt mehr als einen Weg. Mit einzelnen Karten zahlt die Familie neunzehn Euro. Mit der Familienkarte und einer Kinderkarte zahlt sie siebzehn Euro. Der zweite Weg ist günstiger."
          - text: "1. Was ist gefragt?\n2. Welche Angaben brauche ich?\n3. Welche Wege gibt es?\n4. Vergleichen und Antwort geben"
            say: "So gehst du bei kniffligen Aufgaben vor. Lies, was gefragt ist. Such dir aus Text und Tabelle nur die Angaben, die du brauchst. Überlege, welche Wege es gibt, und vergleiche sie."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                show: { drawn: table, rows: [["Freibad", "Preis"], ["Kind", "3 €"], ["Erwachsener", "5 €"], ["Familienkarte", "14 €"], ["Pommes", "2,50 €"], ["Eis", "1,50 €"]] }
                text: "Die Familienkarte gilt für 2 Erwachsene und 2 Kinder.\nWie viel Eintritt zahlen 2 Kinder und 1 Erwachsener?"
                say: "Schau dir die Preisliste vom Freibad an. Wie viel Eintritt zahlen zwei Kinder und ein Erwachsener?"
                options: ["11 €", "8 €", "13 €"]
                answer: "11 €"
                hints:
                  - "Du brauchst nur den Preis für Kinder und für Erwachsene."
                  - "2 · 3 € für die Kinder und 5 € für den Erwachsenen."
                  - "11 €."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                show: { drawn: table, rows: [["Freibad", "Preis"], ["Kind", "3 €"], ["Erwachsener", "5 €"], ["Familienkarte", "14 €"], ["Pommes", "2,50 €"], ["Eis", "1,50 €"]] }
                text: "Die Familienkarte gilt für 2 Erwachsene und 2 Kinder.\nFamilie Öz: 2 Erwachsene und 2 Kinder. Wie viel sparen sie mit der Familienkarte?"
                say: "Die Familienkarte gilt für zwei Erwachsene und zwei Kinder. Familie Öz kommt mit zwei Erwachsenen und zwei Kindern. Wie viel sparen sie mit der Familienkarte?"
                options: ["2 €", "14 €", "16 €"]
                answer: "2 €"
                feedback:
                  "14 €": "Das ist der Preis der Familienkarte. Gefragt ist, wie viel sie sparen."
                  "16 €": "So viel kosten einzelne Karten. Vergleiche mit der Familienkarte."
                hints:
                  - "Rechne zuerst, was einzelne Karten kosten."
                  - "Einzeln: 2 · 5 € + 2 · 3 € = 16 €. Die Familienkarte kostet 14 €."
                  - "2 €."
              - id: l1-f3
                type: multiple_choice
                show: { drawn: table, rows: [["Freibad", "Preis"], ["Kind", "3 €"], ["Erwachsener", "5 €"], ["Familienkarte", "14 €"], ["Pommes", "2,50 €"], ["Eis", "1,50 €"]] }
                text: "Die Familienkarte gilt für 2 Erwachsene und 2 Kinder.\nFamilie Berg: 2 Erwachsene und 4 Kinder. Was ist am günstigsten?"
                say: "Die Familienkarte gilt für zwei Erwachsene und zwei Kinder. Familie Berg kommt mit zwei Erwachsenen und vier Kindern. Was ist am günstigsten?"
                options: ["Familienkarte und 2 Kinderkarten: 20 €", "nur einzelne Karten: 22 €", "2 Familienkarten: 28 €"]
                answer: "Familienkarte und 2 Kinderkarten: 20 €"
                hints:
                  - "Prüfe jeden Weg."
                  - "Die Familienkarte deckt 2 Erwachsene und 2 Kinder. Dann fehlen noch 2 Kinder."
                  - "Familienkarte und 2 Kinderkarten: 20 €."
              - id: l1-f4
                type: multiple_choice
                show: { drawn: table, rows: [["Freibad", "Preis"], ["Kind", "3 €"], ["Erwachsener", "5 €"], ["Familienkarte", "14 €"], ["Pommes", "2,50 €"], ["Eis", "1,50 €"]] }
                text: "Die Familienkarte gilt für 2 Erwachsene und 2 Kinder.\nLeo hat 10 €. Er zahlt den Eintritt für ein Kind und kauft Pommes und ein Eis. Wie viel Geld bleibt ihm?"
                say: "Leo hat zehn Euro. Er zahlt den Eintritt für ein Kind und kauft Pommes und ein Eis. Wie viel Geld bleibt ihm?"
                options: ["3 €", "7 €", "4 €"]
                answer: "3 €"
                hints:
                  - "Rechne zuerst, was Leo ausgibt."
                  - "3 € + 2,50 € + 1,50 € = 7 €."
                  - "Es bleiben 3 €."
              - id: l1-f5
                type: multiple_choice
                show: { drawn: table, rows: [["Freibad", "Preis"], ["Kind", "3 €"], ["Erwachsener", "5 €"], ["Familienkarte", "14 €"], ["Pommes", "2,50 €"], ["Eis", "1,50 €"]] }
                text: "Die Familienkarte gilt für 2 Erwachsene und 2 Kinder.\nFrage: Was kosten 3 Eis und 1 Portion Pommes? Welche Angabe brauchst du nicht?"
                say: "Die Frage ist: Was kosten drei Eis und eine Portion Pommes? Welche Angabe aus der Liste brauchst du dafür nicht?"
                options: ["den Preis für ein Kind", "den Preis für ein Eis", "den Preis für Pommes"]
                answer: "den Preis für ein Kind"
                hints:
                  - "Nach dem Eintritt wird nicht gefragt."
                  - "Gefragt sind nur Eis und Pommes."
                  - "den Preis für ein Kind."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                show: { drawn: table, rows: [["Bus Linie 5", "Bus 1", "Bus 2", "Bus 3"], ["Bahnhof ab", "8:05", "8:35", "9:05"], ["Schule an", "8:22", "8:52", "9:22"], ["Zoo an", "8:40", "9:10", "9:40"]] }
                text: "Wie lange fährt der Bus vom Bahnhof bis zum Zoo?"
                say: "Schau dir den Fahrplan der Linie fünf an. Wie lange fährt der Bus vom Bahnhof bis zum Zoo?"
                options: ["35 Minuten", "17 Minuten", "40 Minuten"]
                answer: "35 Minuten"
                hints: ["Nimm den ersten Bus: ab 8:05 Uhr, an 8:40 Uhr."]
              - id: l1-s2
                type: multiple_choice
                show: { drawn: table, rows: [["Bus Linie 5", "Bus 1", "Bus 2", "Bus 3"], ["Bahnhof ab", "8:05", "8:35", "9:05"], ["Schule an", "8:22", "8:52", "9:22"], ["Zoo an", "8:40", "9:10", "9:40"]] }
                text: "Mia muss um 9:00 Uhr in der Schule sein. Sie will so spät wie möglich losfahren. Welchen Bus nimmt sie am Bahnhof?"
                say: "Mia muss um neun Uhr in der Schule sein. Sie will so spät wie möglich losfahren. Welchen Bus nimmt sie am Bahnhof?"
                options: ["8:35 Uhr", "9:05 Uhr", "8:05 Uhr"]
                answer: "8:35 Uhr"
                hints: ["Schau in die Zeile „Schule an“. Welcher Bus ist vor 9:00 Uhr da und fährt am spätesten los?"]
              - id: l1-s3
                type: multiple_choice
                show: { drawn: table, rows: [["Bus Linie 5", "Bus 1", "Bus 2", "Bus 3"], ["Bahnhof ab", "8:05", "8:35", "9:05"], ["Schule an", "8:22", "8:52", "9:22"], ["Zoo an", "8:40", "9:10", "9:40"]] }
                text: "3 Kinder fahren zum Zoo. Die Busfahrt kostet je 2 €, der Zoo je 8 €. Was kostet der Ausflug zusammen?"
                say: "Drei Kinder fahren mit dem Bus zum Zoo. Die Busfahrt kostet für jedes Kind zwei Euro, der Eintritt in den Zoo acht Euro. Was kostet der Ausflug für alle zusammen?"
                options: ["30 €", "26 €", "10 €"]
                answer: "30 €"
                hints: ["Rechne für ein Kind: 2 € + 8 €. Dann mal 3."]
              - id: l1-s4
                type: true_false
                show: { drawn: table, rows: [["Bus Linie 5", "Bus 1", "Bus 2", "Bus 3"], ["Bahnhof ab", "8:05", "8:35", "9:05"], ["Schule an", "8:22", "8:52", "9:22"], ["Zoo an", "8:40", "9:10", "9:40"]] }
                text: "Der Bus fährt alle 30 Minuten. Stimmt das?"
                say: "Schau auf die Abfahrten am Bahnhof. Fährt der Bus alle dreißig Minuten?"
                answer: true
                hints: ["Von 8:05 Uhr bis 8:35 Uhr sind es 30 Minuten."]
              - id: l1-s5
                type: multiple_choice
                text: "3 Kinder fahren in den Zoo. Der Bus kostet je 2 €, der Eintritt je 8 €. Wer hat richtig gerechnet?"
                show: { drawn: table, header: false, rows: [["Ben", "3 · 2 € + 3 · 8 € = 30 €"], ["Lea", "3 · 10 € = 30 €"]] }
                say: "Ben und Lea rechnen den Ausflug für drei Kinder aus. Ben rechnet erst alle Busfahrten und dann alle Eintritte. Lea rechnet zuerst, was ein Kind zahlt. Wer hat richtig gerechnet?"
                options: ["beide", "nur Ben", "nur Lea"]
                answer: "beide"
                keep_order: true
                hints: ["Ein Kind zahlt 2 € + 8 € = 10 €."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                show: { drawn: table, rows: [["Jugendherberge", "für jedes Kind"], ["Übernachtung", "22 €"], ["Frühstück", "5 €"], ["Abendessen", "7 €"]] }
                text: "Was kostet für ein Kind eine Nacht mit Frühstück und Abendessen?"
                say: "Schau dir die Preise der Jugendherberge an. Was kostet für ein Kind eine Nacht mit Frühstück und Abendessen?"
                options: ["34 €", "29 €", "27 €"]
                answer: "34 €"
              - id: l1-n2
                type: multiple_choice
                show: { drawn: table, rows: [["Jugendherberge", "für jedes Kind"], ["Übernachtung", "22 €"], ["Frühstück", "5 €"], ["Abendessen", "7 €"]] }
                text: "Was kosten für ein Kind 2 Nächte mit Frühstück und Abendessen?"
                say: "Was kosten für ein Kind zwei Nächte mit Frühstück und Abendessen?"
                options: ["68 €", "34 €", "54 €"]
                answer: "68 €"
              - id: l1-n3
                type: multiple_choice
                show: { drawn: table, rows: [["Jugendherberge", "für jedes Kind"], ["Übernachtung", "22 €"], ["Frühstück", "5 €"], ["Abendessen", "7 €"]] }
                text: "25 Kinder bleiben eine Nacht, nur mit Frühstück. Was kostet das?"
                say: "Fünfundzwanzig Kinder bleiben eine Nacht, nur mit Frühstück. Was kostet das zusammen?"
                options: ["675 €", "550 €", "850 €"]
                answer: "675 €"
              - id: l1-n4
                type: multiple_choice
                show: { drawn: table, rows: [["Jugendherberge", "für jedes Kind"], ["Übernachtung", "22 €"], ["Frühstück", "5 €"], ["Abendessen", "7 €"]] }
                text: "Frage: Was kostet das Abendessen für 10 Kinder? Welche Angabe brauchst du nicht?"
                say: "Die Frage ist: Was kostet das Abendessen für zehn Kinder? Welche Angabe brauchst du dafür nicht?"
                options: ["den Preis für die Übernachtung", "den Preis für das Abendessen", "die Zahl der Kinder"]
                answer: "den Preis für die Übernachtung"
              - id: l1-n5
                type: true_false
                show: { drawn: table, rows: [["Jugendherberge", "für jedes Kind"], ["Übernachtung", "22 €"], ["Frühstück", "5 €"], ["Abendessen", "7 €"]] }
                text: "Für 4 Kinder kostet eine Übernachtung zusammen 88 €. Stimmt das?"
                say: "Für vier Kinder kostet eine Übernachtung ohne Essen zusammen achtundachtzig Euro. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            show: { drawn: table, rows: [["Kino", "Preis"], ["Kind", "6 €"], ["Erwachsener", "9 €"], ["Popcorn", "3 €"], ["Getränk", "2 €"]] }
            text: "Wie viel Eintritt zahlen 1 Erwachsener und 2 Kinder?"
            say: "Schau dir die Preise im Kino an. Wie viel Eintritt zahlen ein Erwachsener und zwei Kinder?"
            options: ["21 €", "15 €", "24 €"]
            answer: "21 €"
          - id: l1-c2
            type: multiple_choice
            show: { drawn: table, rows: [["Kino", "Preis"], ["Kind", "6 €"], ["Erwachsener", "9 €"], ["Popcorn", "3 €"], ["Getränk", "2 €"]] }
            text: "Tim hat 15 €. Er kauft eine Kinderkarte, Popcorn und ein Getränk. Wie viel bleibt ihm?"
            say: "Tim hat fünfzehn Euro. Er kauft eine Kinderkarte, Popcorn und ein Getränk. Wie viel Geld bleibt ihm?"
            options: ["4 €", "11 €", "6 €"]
            answer: "4 €"
          - id: l1-c3
            type: multiple_choice
            show: { drawn: table, rows: [["Kino", "Preis"], ["Kind", "6 €"], ["Erwachsener", "9 €"], ["Popcorn", "3 €"], ["Getränk", "2 €"]] }
            text: "Frage: Was kosten 2 Popcorn und 2 Getränke? Welche Angabe brauchst du nicht?"
            say: "Die Frage ist: Was kosten zwei Popcorn und zwei Getränke? Welche Angabe brauchst du dafür nicht?"
            options: ["den Preis für ein Kind", "den Preis für Popcorn", "den Preis für ein Getränk"]
            answer: "den Preis für ein Kind"
          - id: l1-c4
            type: multiple_choice
            show: { drawn: table, rows: [["Bus Linie 3", "Bus 1", "Bus 2", "Bus 3"], ["Markt ab", "14:10", "14:40", "15:10"], ["Schwimmbad an", "14:32", "15:02", "15:32"]] }
            text: "Wie lange fährt der Bus vom Markt bis zum Schwimmbad?"
            say: "Schau dir den Fahrplan der Linie drei an. Wie lange fährt der Bus vom Markt bis zum Schwimmbad?"
            options: ["22 Minuten", "30 Minuten", "32 Minuten"]
            answer: "22 Minuten"
          - id: l1-c5
            type: multiple_choice
            show: { drawn: table, rows: [["Kino", "Preis"], ["Kind", "6 €"], ["Erwachsener", "9 €"], ["Popcorn", "3 €"], ["Getränk", "2 €"]] }
            text: "Familie Roth: 2 Erwachsene und 2 Kinder. Alle zahlen Eintritt und jeder kauft ein Getränk. Was zahlen sie zusammen?"
            say: "Familie Roth geht ins Kino, zwei Erwachsene und zwei Kinder. Alle zahlen Eintritt, und jeder kauft ein Getränk. Was zahlen sie zusammen?"
            options: ["38 €", "30 €", "42 €"]
            answer: "38 €"
          - id: l1-c6
            type: true_false
            show: { drawn: table, rows: [["Kino", "Preis"], ["Kind", "6 €"], ["Erwachsener", "9 €"], ["Popcorn", "3 €"], ["Getränk", "2 €"]] }
            text: "Frage: Was kostet der Eintritt für 3 Kinder? Dafür brauchst du den Preis für Popcorn. Stimmt das?"
            say: "Die Frage ist: Was kostet der Eintritt für drei Kinder? Brauchst du dafür den Preis für Popcorn?"
            answer: false

  - n: 2
    title: { de: "Diagramme und zwei Wege", en: "Charts and two ways" }
    goal:
      de: "Lies Zahlen aus einem Diagramm ab und löse die Aufgabe auf zwei Wegen. Mit dem zweiten Weg prüfst du den ersten."
      en: "Read numbers from a chart and solve the problem in two ways. The second way checks the first."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            show: { drawn: table, rows: [["Eintritt", "Preis"], ["Kind", "3 €"], ["Erwachsener", "5 €"]] }
            text: "Was zahlen 2 Erwachsene und 1 Kind?"
            say: "Ein Kind zahlt drei Euro, ein Erwachsener fünf Euro. Was zahlen zwei Erwachsene und ein Kind?"
            options: ["13 €", "11 €", "8 €"]
            answer: "13 €"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "4 Kinder kaufen je eine Brezel für 3 € und einen Saft für 2 €. Wer hat richtig gerechnet?"
            show: { drawn: table, header: false, rows: [["Ben", "4 · 3 € + 4 · 2 €"], ["Lea", "4 · 5 €"]] }
            say: "Vier Kinder kaufen je eine Brezel für drei Euro und einen Saft für zwei Euro. Ben und Lea rechnen verschieden. Wer hat richtig gerechnet?"
            options: ["beide", "nur Ben", "nur Lea"]
            answer: "beide"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Runden beim Spendenlauf\nFür jede Runde gibt es 2 €."
            say: "Beim Spendenlauf sind drei Klassen Runden gelaufen. Das Diagramm zeigt, wie viele. Für jede Runde spendet der Förderverein zwei Euro. Wie viel Geld kommt zusammen? Lies zuerst die Werte ab: sechzig, fünfundvierzig und fünfundsiebzig Runden."
            show: { drawn: bar-chart, rows: [["4a", 60], ["4b", 45], ["4c", 75]], step: 15 }
          - text: "Weg 1: 60 + 45 + 75 = 180 Runden\n180 · 2 € = 360 €\nWeg 2: 120 € + 90 € + 150 € = 360 €"
            say: "Du kannst erst alle Runden zusammenzählen und dann mal zwei Euro rechnen. Oder du rechnest für jede Klasse das Geld aus und zählst dann zusammen. Beide Wege ergeben dreihundertsechzig Euro."
          - text: "Zwei Wege, ein Ergebnis.\nRechne auf einem Weg.\nPrüfe mit dem anderen."
            say: "Viele Aufgaben kannst du auf mehr als einem Weg lösen. Nimm den Weg, der dir leichter fällt. Mit dem anderen Weg kannst du dein Ergebnis prüfen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Runden beim Spendenlauf. Wie viele Runden ist die 4c mehr gelaufen als die 4b?"
                say: "Schau auf das Diagramm vom Spendenlauf. Wie viele Runden ist die vier c mehr gelaufen als die vier b?"
                show: { drawn: bar-chart, rows: [["4a", 60], ["4b", 45], ["4c", 75]], step: 15 }
                options: ["30", "120", "75"]
                answer: "30"
                feedback:
                  "120": "Das sind beide Klassen zusammen. Gefragt ist der Unterschied."
                hints:
                  - "Lies die Runden der 4b und der 4c ab."
                  - "Die 4c ist 75 Runden gelaufen, die 4b 45 Runden."
                  - "75 − 45 = 30."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Runden beim Spendenlauf. Für jede Runde gibt es 2 €. Wie viel Geld bekommt die 4a?"
                say: "Für jede Runde gibt es zwei Euro. Wie viel Geld bekommt die vier a?"
                show: { drawn: bar-chart, rows: [["4a", 60], ["4b", 45], ["4c", 75]], step: 15 }
                options: ["120 €", "60 €", "62 €"]
                answer: "120 €"
                hints:
                  - "Lies ab, wie viele Runden die 4a gelaufen ist."
                  - "60 Runden zu je 2 €."
                  - "120 €."
              - id: l2-f3
                type: multiple_choice
                text: "Runden beim Spendenlauf. Für jede Runde gibt es 2 €. Die 4b möchte 100 € erlaufen. Wie viele Runden fehlen ihr noch?"
                say: "Für jede Runde gibt es zwei Euro. Die vier b möchte hundert Euro erlaufen. Wie viele Runden fehlen ihr noch?"
                show: { drawn: bar-chart, rows: [["4a", 60], ["4b", 45], ["4c", 75]], step: 15 }
                options: ["5", "55", "10"]
                answer: "5"
                hints:
                  - "Wie viele Runden bringen 100 €?"
                  - "100 € : 2 € = 50 Runden. Die 4b ist schon 45 gelaufen."
                  - "50 − 45 = 5."
              - id: l2-f4
                type: multiple_choice
