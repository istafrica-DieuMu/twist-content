# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.capacity-calculate
skill: math.mass-capacity.calculate-capacity
curriculum: de-DE
language: de
title:
  de: Mit Rauminhalten rechnen
  en: Calculating with capacity
summary: >
  Lesson 1 finds how many glasses a bottle fills (1 l : 200 ml = 1000 ml
  : 200 ml = 5), compares capacities in different units and estimates
  what a bath or a bucket holds; lesson 2 solves stories with litres:
  juice for a class party, water for showering and watering, what is
  left in the can, and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Rauminhalte, en: Capacity }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mass-capacity.l-ml, math.mult-div.div-facts]
  also_practises: [math.mass-capacity.l-ml, math.word-problems.multi-step]
  vocabulary: { de: [Liter, Milliliter, fassen, füllen, voll, halb voll, schätzen] }
  forms: [text, audio]
  drawn: []
  facets: [units]
  parts:
    - { id: fill, what: { de: wie oft eine Menge in ein Gefäß passt, en: how many times one capacity fills another } }
    - { id: compare, what: { de: Rauminhalte in Litern und Millilitern vergleichen, en: comparing capacities in litres and millilitres } }
    - { id: estimate, what: { de: Rauminhalte schätzen, en: estimating capacities } }
    - { id: stories, what: { de: Sachaufgaben mit Rauminhalten, en: word problems with capacity } }
  misconceptions:
    - id: bigger-number-more
      what: Compares the numbers and not the amounts (500 ml is more than 2 l because 500 is bigger than 2)
      addressed: lesson 1 Learn changes the litres to millilitres first; every stage of lesson 1 compares litres with millilitres, with feedback in l1-f2
    - id: bigger-glass-more-glasses
      what: Thinks bigger glasses give more glasses from the same bottle
      addressed: lesson 1 Learn fills one bottle into 200 ml and 250 ml glasses; l1-f4, l1-s4, l1-n4, l1-c3 and l2-c4 ask which glasses you fill more often
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wie viele Gläser?", en: "How many glasses?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1,5 l = _"
            say: "Wie viele Milliliter sind eins Komma fünf Liter?"
            options: ["1500 ml", "1005 ml", "150 ml"]
            answer: "1500 ml"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "1000 : 200 = _"
            say: "Tausend geteilt durch zweihundert."
            options: ["5", "50", "500"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Eine 1-l-Flasche Saft\nGläser mit 200 ml\n1 l = 1000 ml\n1000 ml : 200 ml = 5"
            say: "Wie viele Gläser füllt eine Ein-Liter-Flasche, wenn in ein Glas zweihundert Milliliter passen? Rechne den Liter zuerst in Milliliter um. Tausend geteilt durch zweihundert sind fünf. Die Flasche füllt fünf Gläser."
          - text: "Gläser mit 250 ml\n1000 ml : 250 ml = 4"
            say: "Sind die Gläser größer, zum Beispiel zweihundertfünfzig Milliliter, füllst du nur vier Gläser. Größere Gläser, weniger Gläser."
          - text: "Was ist mehr: 2 l oder 500 ml?\n2 l = 2000 ml\n2000 ml > 500 ml"
            say: "Zum Vergleichen bringst du beide Mengen in dieselbe Einheit. Zwei Liter sind zweitausend Milliliter. Das ist viel mehr als fünfhundert Milliliter, obwohl die Zahl fünfhundert größer aussieht."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Eine 1-l-Flasche Saft wird in Becher mit 250 ml gefüllt. Wie viele Becher werden voll?"
                say: "Eine Ein-Liter-Flasche Saft wird in Becher gefüllt. In jeden Becher passen zweihundertfünfzig Milliliter. Wie viele Becher werden voll?"
                options: ["4", "5", "25"]
                answer: "4"
                hints:
                  - "Rechne den Liter in Milliliter um."
                  - "1000 ml : 250 ml. Wie oft passt 250 in 1000?"
                  - "4 Becher."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was ist mehr: 2 l oder 500 ml?"
                say: "Was ist mehr: zwei Liter oder fünfhundert Milliliter?"
                options: ["2 l", "500 ml", "Beides ist gleich viel."]
                answer: "2 l"
                feedback:
                  "500 ml": "500 ist zwar die größere Zahl. Aber 2 l sind 2000 ml."
                hints:
                  - "Bring beide Mengen in Milliliter."
                  - "2 l = 2000 ml."
                  - "2 l."
              - id: l1-f3
                type: multiple_choice
                text: "Eine 1,5-l-Flasche Wasser wird in Gläser mit 300 ml gefüllt. Wie viele Gläser werden voll?"
                say: "Eine Flasche mit eins Komma fünf Litern Wasser wird in Gläser gefüllt. In jedes Glas passen dreihundert Milliliter. Wie viele Gläser werden voll?"
                options: ["5", "6", "50"]
                answer: "5"
                hints:
                  - "1,5 l sind 1500 ml."
                  - "1500 ml : 300 ml."
                  - "5 Gläser."
              - id: l1-f4
                type: true_false
                text: "Aus einer 1-l-Flasche füllst du mehr Gläser, wenn die Gläser größer sind. Stimmt das?"
                say: "Aus einer Ein-Liter-Flasche füllst du mehr Gläser, wenn die Gläser größer sind. Stimmt das?"
                answer: false
                hints:
                  - "Denk an 200-ml-Gläser und 250-ml-Gläser."
                  - "Mit 200 ml sind es 5 Gläser, mit 250 ml nur 4."
                  - "Nein. Größere Gläser, weniger Gläser."
              - id: l1-f5
                type: multiple_choice
                text: "Ein Aquarium fasst 60 l. Papa füllt es mit einem 10-l-Eimer. Wie oft muss er den Eimer ausgießen?"
                say: "Ein Aquarium fasst sechzig Liter. Papa füllt es mit einem Zehn-Liter-Eimer. Wie oft muss er den vollen Eimer ausgießen?"
                options: ["6", "600", "50"]
                answer: "6"
                hints:
                  - "Wie oft passen 10 l in 60 l?"
                  - "60 : 10."
                  - "6-mal."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Eine 2-l-Flasche Wasser wird in Gläser mit 200 ml gefüllt. Wie viele Gläser werden voll?"
                say: "Eine Zwei-Liter-Flasche Wasser wird in Gläser mit zweihundert Millilitern gefüllt. Wie viele Gläser werden voll?"
                options: ["10", "1", "100"]
                answer: "10"
                hints: ["2 l sind 2000 ml."]
              - id: l1-s2
                type: multiple_choice
                text: "Was ist weniger: 750 ml oder 1 l?"
                say: "Was ist weniger: siebenhundertfünfzig Milliliter oder ein Liter?"
                options: ["750 ml", "1 l", "Beides ist gleich viel."]
                answer: "750 ml"
                hints: ["1 l sind 1000 ml."]
              - id: l1-s3
                type: multiple_choice
                text: "Eine Teekanne fasst 1,2 l. Eine Tasse fasst 200 ml. Wie viele Tassen kannst du füllen?"
                say: "Eine Teekanne fasst eins Komma zwei Liter. Eine Tasse fasst zweihundert Milliliter. Wie viele Tassen kannst du füllen?"
                options: ["6", "60", "5"]
                answer: "6"
                hints: ["1,2 l sind 1200 ml."]
              - id: l1-s4
                type: multiple_choice
                text: "Mit welchen Gläsern füllst du aus einer 1-l-Flasche die meisten Gläser?"
                say: "Mit welchen Gläsern füllst du aus einer Ein-Liter-Flasche die meisten Gläser?"
                options: ["Gläser mit 100 ml", "Gläser mit 200 ml", "Gläser mit 500 ml"]
                answer: "Gläser mit 100 ml"
                hints: ["Je kleiner das Glas, desto mehr Gläser füllst du."]
              - id: l1-s5
                type: true_false
                text: "Ein Planschbecken fasst 300 l. Mit einem 10-l-Eimer brauchst du 30 Eimer. Stimmt das?"
                say: "Ein Planschbecken fasst dreihundert Liter. Mit einem Zehn-Liter-Eimer brauchst du dreißig volle Eimer. Stimmt das?"
                answer: true
                hints: ["300 : 10."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Eine 1-l-Packung Milch wird in Becher mit 125 ml gefüllt. Wie viele Becher werden voll?"
                say: "Eine Ein-Liter-Packung Milch wird in Becher mit hundertfünfundzwanzig Millilitern gefüllt. Wie viele Becher werden voll?"
                options: ["8", "12", "80"]
                answer: "8"
              - id: l1-n2
                type: multiple_choice
                text: "Was ist mehr: 1,5 l oder 1600 ml?"
                say: "Was ist mehr: eins Komma fünf Liter oder tausendsechshundert Milliliter?"
                options: ["1600 ml", "1,5 l", "Beides ist gleich viel."]
                answer: "1600 ml"
              - id: l1-n3
                type: multiple_choice
                text: "In einem Regenfass sind 50 l Wasser. Eine Gießkanne fasst 5 l. Wie viele Gießkannen kann Oma füllen?"
                say: "In einem Regenfass sind fünfzig Liter Wasser. Eine Gießkanne fasst fünf Liter. Wie viele Gießkannen kann Oma füllen?"
                options: ["10", "45", "250"]
                answer: "10"
              - id: l1-n4
                type: true_false
                text: "Aus 1 l Saft füllst du 4 Gläser mit 250 ml oder 5 Gläser mit 200 ml. Stimmt das?"
                say: "Aus einem Liter Saft füllst du vier Gläser mit zweihundertfünfzig Millilitern oder fünf Gläser mit zweihundert Millilitern. Stimmt das?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Schätze: Wie viel Wasser passt in eine Badewanne?"
                say: "Schätze: Wie viel Wasser passt in eine Badewanne?"
                options: ["etwa 150 l", "etwa 15 l", "etwa 1500 l"]
                answer: "etwa 150 l"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Eine 1-l-Flasche wird in Gläser mit 100 ml gefüllt. Wie viele Gläser werden voll?"
            say: "Eine Ein-Liter-Flasche wird in Gläser mit hundert Millilitern gefüllt. Wie viele Gläser werden voll?"
            options: ["10", "100", "1"]
            answer: "10"
          - id: l1-c2
            type: multiple_choice
            text: "Was ist mehr: 3 l oder 2900 ml?"
            say: "Was ist mehr: drei Liter oder zweitausendneunhundert Milliliter?"
            options: ["3 l", "2900 ml", "Beides ist gleich viel."]
            answer: "3 l"
          - id: l1-c3
            type: true_false
            text: "Mit größeren Bechern füllst du aus einer Flasche weniger Becher. Stimmt das?"
            say: "Mit größeren Bechern füllst du aus einer Flasche weniger Becher. Stimmt das?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Eine 1-l-Flasche wird in Gläser mit 500 ml gefüllt. Wie viele Gläser werden voll?"
            say: "Eine Ein-Liter-Flasche wird in Gläser mit fünfhundert Millilitern gefüllt. Wie viele Gläser werden voll?"
            options: ["2", "5", "20"]
            answer: "2"
          - id: l1-c5
            type: multiple_choice
            text: "Was ist weniger: 1,2 l oder 1300 ml?"
            say: "Was ist weniger: eins Komma zwei Liter oder tausenddreihundert Milliliter?"
            options: ["1,2 l", "1300 ml", "Beides ist gleich viel."]
            answer: "1,2 l"
          - id: l1-c6
            type: multiple_choice
            text: "Schätze: Wie viel passt in eine Saftflasche?"
            say: "Schätze: Wie viel passt in eine Saftflasche?"
            options: ["etwa 1 l", "etwa 10 l", "etwa 10 ml"]
            answer: "etwa 1 l"

  - n: 2
    title: { de: "Sachaufgaben mit Litern", en: "Capacity word problems" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Eine 1-l-Flasche wird in Becher mit 200 ml gefüllt. Wie viele Becher werden voll?"
            say: "Eine Ein-Liter-Flasche wird in Becher mit zweihundert Millilitern gefüllt. Wie viele Becher werden voll?"
            options: ["5", "50", "2"]
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist mehr: 1 l oder 900 ml?"
            say: "Was ist mehr: ein Liter oder neunhundert Milliliter?"
            options: ["1 l", "900 ml", "Beides ist gleich viel."]
            answer: "1 l"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Für das Klassenfest: 6 Flaschen Saft zu je 1,5 l\n6 · 1500 ml = 9000 ml = 9 l"
            say: "Für das Klassenfest kauft die Lehrerin sechs Flaschen Saft. In jeder sind eins Komma fünf Liter. Rechne in Millilitern: sechs mal tausendfünfhundert sind neuntausend Milliliter, also neun Liter."
          - text: "25 Kinder trinken je 200 ml.\n25 · 200 ml = 5000 ml = 5 l\n5 l < 9 l. Der Saft reicht."
            say: "Fünfundzwanzig Kinder trinken je ein Glas mit zweihundert Millilitern. Das sind fünftausend Milliliter, also fünf Liter. Neun Liter sind genug. Der Saft reicht, es bleiben sogar vier Liter übrig."
          - text: "Duschen: etwa 40 l\nBaden: etwa 150 l\n150 l − 40 l = 110 l"
            say: "Auch im Alltag rechnest du mit Litern. Beim Duschen fließen ungefähr vierzig Liter Wasser, beim Baden ungefähr hundertfünfzig Liter. Wer duscht, spart ungefähr hundertzehn Liter."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Frau Ali kauft für das Klassenfest 6 Flaschen Saft zu je 1,5 l. Wie viel Saft ist das?"
                say: "Frau Ali kauft für das Klassenfest sechs Flaschen Saft zu je eins Komma fünf Litern. Wie viel Saft ist das zusammen?"
                options: ["9 l", "7,5 l", "6,5 l"]
                answer: "9 l"
                feedback:
                  "7,5 l": "Du hast 6 und 1,5 zusammengezählt. Es sind 6 Flaschen zu je 1,5 l: 6 · 1,5 l."
                hints:
                  - "Rechne 1,5 l in Milliliter um."
                  - "6 · 1500 ml = 9000 ml."
                  - "9 l."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "24 Kinder trinken je 250 ml Saft. Wie viel Saft brauchen sie?"
                say: "Vierundzwanzig Kinder trinken je zweihundertfünfzig Milliliter Saft. Wie viel Saft brauchen sie zusammen?"
                options: ["6 l", "60 l", "600 ml"]
                answer: "6 l"
                hints:
                  - "4 Gläser mit 250 ml sind 1 l."
                  - "24 Kinder sind 6-mal 4 Kinder."
                  - "6 l."
              - id: l2-f3
                type: true_false
                text: "Es gibt 9 l Saft. 24 Kinder trinken je 250 ml. Reicht der Saft?"
                say: "Es gibt neun Liter Saft. Vierundzwanzig Kinder trinken je zweihundertfünfzig Milliliter. Reicht der Saft?"
                answer: true
                hints:
                  - "Rechne aus, wie viel die Kinder trinken."
                  - "24 · 250 ml = 6000 ml = 6 l."
                  - "Ja, 6 l sind weniger als 9 l."
              - id: l2-f4
                type: multiple_choice
                text: "Im Regenfass sind 50 l Wasser. Oma füllt viermal ihre Gießkanne mit 8 l. Wie viel Wasser ist noch im Fass?"
                say: "Im Regenfass sind fünfzig Liter Wasser. Oma füllt viermal ihre Gießkanne mit acht Litern. Wie viel Wasser ist noch im Fass?"
                options: ["18 l", "32 l", "42 l"]
                answer: "18 l"
                hints:
                  - "Rechne zuerst, wie viel Oma herausnimmt."
                  - "4 · 8 l = 32 l. Dann 50 l − 32 l."
                  - "18 l."
              - id: l2-f5
                type: multiple_choice
                text: "Ein Wasserhahn tropft. In einer Stunde sind es 100 ml. Wie viel Wasser tropft an einem ganzen Tag?"
                say: "Ein Wasserhahn tropft. In einer Stunde tropfen hundert Milliliter. Wie viel Wasser tropft an einem ganzen Tag?"
                options: ["2,4 l", "24 l", "0,24 l"]
                answer: "2,4 l"
                hints:
                  - "Ein Tag hat 24 Stunden."
                  - "24 · 100 ml = 2400 ml."
                  - "2,4 l."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Familie Kurz trinkt jeden Tag 3 l Wasser. Wie viel trinkt sie in einer Woche?"
                say: "Familie Kurz trinkt jeden Tag drei Liter Wasser. Wie viel trinkt sie in einer Woche?"
                options: ["21 l", "10 l", "15 l"]
                answer: "21 l"
                hints: ["Eine Woche hat 7 Tage."]
              - id: l2-s2
                type: multiple_choice
                text: "Im Topf sind 2 l Suppe. Ein Teller fasst 250 ml. Wie viele Teller werden voll?"
                say: "Im Topf sind zwei Liter Suppe. Ein Teller fasst zweihundertfünfzig Milliliter. Wie viele Teller werden voll?"
                options: ["8", "4", "80"]
                answer: "8"
                hints: ["1 l füllt 4 Teller."]
              - id: l2-s3
                type: multiple_choice
                text: "Lukas duscht 5 Minuten. In jeder Minute fließen 8 l Wasser. Wie viel Wasser braucht er?"
                say: "Lukas duscht fünf Minuten. In jeder Minute fließen acht Liter Wasser. Wie viel Wasser braucht er?"
                options: ["40 l", "13 l", "400 l"]
                answer: "40 l"
                hints: ["5 · 8 l."]
              - id: l2-s4
                type: true_false
                text: "Ein Becher fasst 0,2 l. 5 Becher sind 1 l. Stimmt das?"
                say: "Ein Becher fasst null Komma zwei Liter. Fünf Becher sind ein Liter. Stimmt das?"
                answer: true
                hints: ["0,2 l sind 200 ml."]
              - id: l2-s5
                type: multiple_choice
                text: "In der Kanne sind 1,5 l Tee. Mama gießt 2 Tassen zu je 200 ml ein. Wie viel ist noch in der Kanne?"
                say: "In der Kanne sind eins Komma fünf Liter Tee. Mama gießt zwei Tassen zu je zweihundert Millilitern ein. Wie viel ist noch in der Kanne?"
                options: ["1,1 l", "1,3 l", "1,9 l"]
                answer: "1,1 l"
                hints: ["1500 ml − 400 ml."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Papa tankt 45 l. Ein Liter kostet 2 €. Was kostet das Tanken?"
                say: "Papa tankt fünfundvierzig Liter. Ein Liter kostet zwei Euro. Was kostet das Tanken?"
                options: ["90 €", "47 €", "22,50 €"]
                answer: "90 €"
              - id: l2-n2
                type: multiple_choice
                text: "Ein Aquarium fasst 120 l. Es ist halb voll. Wie viel Wasser fehlt noch?"
                say: "Ein Aquarium fasst hundertzwanzig Liter. Es ist halb voll. Wie viel Wasser fehlt noch?"
                options: ["60 l", "120 l", "20 l"]
                answer: "60 l"
              - id: l2-n3
                type: true_false
                text: "Zum Baden braucht man etwa 150 l Wasser, zum Duschen etwa 40 l. Spart man beim Duschen etwa 110 l?"
                say: "Zum Baden braucht man ungefähr hundertfünfzig Liter Wasser, zum Duschen ungefähr vierzig Liter. Spart man beim Duschen ungefähr hundertzehn Liter?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "In einem Kanister sind 5 l Wasser. Daraus werden 3 Flaschen zu je 750 ml gefüllt. Wie viel bleibt im Kanister?"
                say: "In einem Kanister sind fünf Liter Wasser. Daraus werden drei Flaschen zu je siebenhundertfünfzig Millilitern gefüllt. Wie viel bleibt im Kanister?"
                options: ["2,75 l", "2,25 l", "4,25 l"]
                answer: "2,75 l"
              - id: l2-n5
                type: multiple_choice
                text: "Eine Kuh gibt am Tag etwa 25 l Milch. Wie viel Milch geben 4 Kühe an einem Tag?"
                say: "Eine Kuh gibt am Tag ungefähr fünfundzwanzig Liter Milch. Wie viel Milch geben vier Kühe an einem Tag?"
                options: ["100 l", "29 l", "1000 l"]
                answer: "100 l"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: fill
            type: multiple_choice
            text: "Eine 1,5-l-Flasche wird in Gläser mit 250 ml gefüllt. Wie viele Gläser werden voll?"
            say: "Eine Flasche mit eins Komma fünf Litern wird in Gläser mit zweihundertfünfzig Millilitern gefüllt. Wie viele Gläser werden voll?"
            options: ["6", "5", "60"]
            answer: "6"
          - id: l2-c2
            part: compare
            type: multiple_choice
            text: "Was ist mehr: 4 l oder 3800 ml?"
            say: "Was ist mehr: vier Liter oder dreitausendachthundert Milliliter?"
            options: ["4 l", "3800 ml", "Beides ist gleich viel."]
            answer: "4 l"
          - id: l2-c3
            part: stories
            type: multiple_choice
            text: "30 Kinder trinken je 200 ml Kakao. Wie viel Kakao braucht man?"
            say: "Dreißig Kinder trinken je zweihundert Milliliter Kakao. Wie viel Kakao braucht man?"
            options: ["6 l", "60 l", "600 ml"]
            answer: "6 l"
          - id: l2-c4
            part: fill
            type: true_false
            text: "Aus einer Flasche füllst du mehr Becher mit 300 ml als Becher mit 200 ml. Stimmt das?"
            say: "Aus einer Flasche füllst du mehr Becher mit dreihundert Millilitern als Becher mit zweihundert Millilitern. Stimmt das?"
            answer: false
          - id: l2-c5
            part: stories
            type: multiple_choice
            text: "In einem Eimer sind 10 l Wasser. Papa füllt daraus 4 Gießkannen zu je 2 l. Wie viel ist noch im Eimer?"
            say: "In einem Eimer sind zehn Liter Wasser. Papa füllt daraus vier Gießkannen zu je zwei Litern. Wie viel ist noch im Eimer?"
            options: ["2 l", "8 l", "6 l"]
            answer: "2 l"
          - id: l2-c6
            part: fill
            type: text_input
            text: "In einem Kanister sind 5 l Wasser. Du füllst daraus Flaschen mit 500 ml. Wie viele Flaschen werden voll?"
            say: "In einem Kanister sind fünf Liter Wasser. Du füllst daraus Flaschen mit fünfhundert Millilitern. Wie viele Flaschen werden voll?"
            answer: "10"
          - id: l2-c7
            part: fill
            type: multiple_choice
            text: "Ein Eimer fasst 12 l. Mia füllt ihn mit einer 1,5-l-Flasche. Wie oft muss sie die volle Flasche ausgießen?"
            say: "Ein Eimer fasst zwölf Liter. Mia füllt ihn mit einer Flasche, in die eins Komma fünf Liter passen. Wie oft muss sie die volle Flasche ausgießen?"
            options: ["8", "6", "18"]
            answer: "8"
          - id: l2-c8
            part: fill
            type: true_false
            text: "Aus einer vollen 3-l-Flasche füllst du 10 Gläser mit 200 ml. Dann ist die Flasche leer. Stimmt das?"
            say: "Aus einer vollen Drei-Liter-Flasche füllst du zehn Gläser mit zweihundert Millilitern. Dann ist die Flasche leer. Stimmt das?"
            answer: false
          - id: l2-c9
