# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.large-mental
skill: math.add-sub-to-1000.large-mental
curriculum: de-DE
language: de
title:
  de: Große Zahlen im Kopf
  en: Large numbers in your head
summary: >
  Mental addition and subtraction with large round numbers, helped by a
  small sum. Lesson 1 adds and subtracts whole thousands (7000 + 5000,
  15 000 − 8000) using 7 + 5 and 15 − 8; lesson 2 does the same with
  ten-thousands and hundred-thousands (250 000 − 50 000, 340 000 +
  60 000), and ends with the skill check. Typed answers are written
  without the space; numbers shown on screen keep it.
metadata:
  year: klasse-4
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.large-numbers.to-million, math.add-sub-to-1000.hundreds]
  also_practises: [math.large-numbers.to-million]
  vocabulary: { de: [Tausender, Zehntausender, Hunderttausender, Analogieaufgabe] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart]
  facets: []
  parts:
    - { id: thousands, what: { de: mit ganzen Tausendern plus und minus rechnen, en: adding and subtracting whole thousands } }
    - { id: ten-thousands, what: { de: mit Zehntausendern plus und minus rechnen, en: adding and subtracting ten-thousands } }
    - { id: hundred-thousands, what: { de: mit Hunderttausendern plus und minus rechnen, en: adding and subtracting hundred-thousands } }
    - { id: helper, what: { de: die kleine Aufgabe finden und nutzen, en: finding and using the small fact that helps } }
  misconceptions:
    - id: zeros-pile-up
      what: Writes the small sum and adds too many or too few zeros (7000 + 5000 = 120 000 or 1200)
      addressed: lesson 1 Learn counts in thousands (vier Tausender und drei Tausender sind sieben Tausender); a wrong-zeros option in every stage of both lessons, with feedback in l1-f1
    - id: wrong-unit
      what: Treats 50 000 as 5000 when subtracting from 250 000
      addressed: lesson 2 Learn names the unit (Zehntausender) in both numbers; every stage of lesson 2 has a task where the two numbers have different numbers of digits, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Mit Tausendern rechnen, en: Calculating with thousands }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "600 + 300 = _"
            say: "Sechshundert plus dreihundert."
            answer: "900"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Tausender hat 9000?"
            say: "Wie viele Tausender hat neuntausend?"
            options: ["9", "90", "900"]
            answer: "9"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4000 + 3000"
            say: "Viertausend plus dreitausend. Das sind vier Tausender und drei Tausender."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [4, 0, 0, 0] }
          - text: "4 + 3 = 7 | 4000 + 3000 = 7000"
            say: "Vier Tausender und drei Tausender sind sieben Tausender: siebentausend. Die kleine Aufgabe vier plus drei hilft dir. Viertausend plus dreitausend ist ihre Analogieaufgabe."
          - text: "8000 + 6000 = 14 000"
            say: "Auch über zehntausend geht es so: acht Tausender und sechs Tausender sind vierzehn Tausender, also vierzehntausend."
          - text: "13 000 − 5000 = 8000"
            say: "Bei Minusaufgaben geht es genauso: dreizehn Tausender minus fünf Tausender sind acht Tausender."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "7000 + 5000 = ?"
                say: "Siebentausend plus fünftausend. Wie viel ist das?"
                options: ["12 000", "1200", "120 000"]
                answer: "12 000"
                feedback:
                  "1200": "Da fehlt eine Null. Sieben Tausender und fünf Tausender sind zwölf Tausender, also 12 000."
                  "120 000": "Das sind zu viele Nullen. Zwölf Tausender sind 12 000."
                hints:
                  - "Rechne mit Tausendern."
                  - "Sieben plus fünf ist zwölf."
                  - "Zwölf Tausender sind 12 000."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst fünfzehn minus acht, dann fünfzehntausend minus achttausend."
                frame: "15 − 8 = _ | 15 000 − 8000 = _"
                options: ["7", "70", "700", "7000"]
                answer: ["7", "7000"]
                hints:
                  - "Fünfzehn minus acht ist sieben."
                  - "Fünfzehn Tausender minus acht Tausender sind sieben Tausender."
                  - "7 und 7000."
              - id: l1-f3
                type: text_input
                text: "6000 + 9000 = _"
                say: "Sechstausend plus neuntausend."
                answer: "15000"
                hints:
                  - "Sechs Tausender und neun Tausender."
                  - "Sechs plus neun ist fünfzehn."
                  - "15 000. Tippe 15000."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 11 000 − 4000 = 7000"
                say: "Elftausend minus viertausend ist siebentausend. Stimmt das?"
                answer: true
                hints:
                  - "Elf Tausender minus vier Tausender."
                  - "Elf minus vier ist sieben."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Welche kleine Aufgabe hilft bei 16 000 − 9000?"
                say: "Welche kleine Aufgabe hilft bei sechzehntausend minus neuntausend?"
                options: ["16 − 9", "16 + 9", "1 − 9"]
                answer: "16 − 9"
                hints:
                  - "Es ist eine Minusaufgabe."
                  - "Rechne mit den Tausendern."
                  - "16 − 9."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "8000 + 7000 = ?"
                say: "Achttausend plus siebentausend. Wie viel ist das?"
                options: ["1500", "15 000", "150 000"]
                answer: "15 000"
                hints: ["Wie viele Tausender sind es zusammen?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst vierzehn minus sechs, dann vierzehntausend minus sechstausend."
                frame: "14 − 6 = _ | 14 000 − 6000 = _"
                options: ["8", "80", "800", "8000"]
                answer: ["8", "8000"]
                hints: ["Wie viele Tausender bleiben übrig?"]
              - id: l1-s3
                type: text_input
                text: "12 000 − 3000 = _"
                say: "Zwölftausend minus dreitausend."
                answer: "9000"
                hints: ["Zwölf Tausender minus drei Tausender."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 5000 + 8000 = 1300"
                say: "Fünftausend plus achttausend ist tausenddreihundert. Stimmt das?"
                answer: false
                hints: ["Wie viele Tausender sind es zusammen?"]
              - id: l1-s5
                type: multiple_choice
                text: "Welche kleine Aufgabe hilft bei 9000 + 4000?"
                say: "Welche kleine Aufgabe hilft bei neuntausend plus viertausend?"
                options: ["9 − 4", "9 + 4", "90 + 40"]
                answer: "9 + 4"
                hints: ["Ist es plus oder minus?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "6000 + 7000 = ?"
                say: "Sechstausend plus siebentausend. Wie viel ist das?"
                options: ["130 000", "1300", "13 000"]
                answer: "13 000"
              - id: l1-n2
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst siebzehn minus neun, dann siebzehntausend minus neuntausend."
                frame: "17 − 9 = _ | 17 000 − 9000 = _"
                options: ["8", "80", "800", "8000"]
                answer: ["8", "8000"]
              - id: l1-n3
                type: text_input
                text: "9000 + 9000 = _"
                say: "Neuntausend plus neuntausend."
                answer: "18000"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 14 000 − 7000 = 7000"
                say: "Vierzehntausend minus siebentausend ist siebentausend. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "20 000 − 6000 = _"
                say: "Zwanzigtausend minus sechstausend."
                answer: "14000"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "5000 + 9000 = ?"
            say: "Fünftausend plus neuntausend. Wie viel ist das?"
            options: ["14 000", "1400", "59 000"]
            answer: "14 000"
          - id: l1-c2
            type: text_input
            text: "16 000 − 8000 = _"
            say: "Sechzehntausend minus achttausend."
            answer: "8000"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 7000 + 7000 = 14 000"
            say: "Siebentausend plus siebentausend ist vierzehntausend. Stimmt das?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Die kleine Aufgabe hilft."
            say: "Rechne erst dreizehn minus vier, dann dreizehntausend minus viertausend."
            frame: "13 − 4 = _ | 13 000 − 4000 = _"
            options: ["9", "90", "900", "9000"]
            answer: ["9", "9000"]
          - id: l1-c5
            type: multiple_choice
            text: "Welche kleine Aufgabe hilft bei 9000 + 7000?"
            say: "Welche kleine Aufgabe hilft bei neuntausend plus siebentausend?"
            options: ["9 − 7", "9 + 7", "90 + 70"]
            answer: "9 + 7"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 15 000 − 6000 = 900"
            say: "Fünfzehntausend minus sechstausend ist neunhundert. Stimmt das?"
            answer: false

  - n: 2
    title: { de: Zehntausender und Hunderttausender, en: Ten-thousands and hundred-thousands }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "8000 + 5000 = _"
            say: "Achttausend plus fünftausend."
            answer: "13000"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viele Zehntausender hat 70 000?"
            say: "Wie viele Zehntausender hat siebzigtausend?"
            options: ["7", "70", "700"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "30 000 + 40 000 = 70 000"
            say: "Dreißigtausend plus vierzigtausend. Drei Zehntausender und vier Zehntausender sind sieben Zehntausender: siebzigtausend."
            show: { drawn: place-value-chart, columns: [ten-thousands, thousands, hundreds, tens, ones], values: [7, 0, 0, 0, 0] }
          - text: "250 000 − 50 000 = 200 000"
            say: "Zweihundertfünfzigtausend minus fünfzigtausend. Zähl in Zehntausendern: fünfundzwanzig minus fünf ist zwanzig. Zwanzig Zehntausender sind zweihunderttausend."
          - text: "600 000 + 300 000 = 900 000"
            say: "Sechshunderttausend plus dreihunderttausend. Mit Hunderttausendern geht es genauso: sechs Hunderttausender und drei Hunderttausender sind neun Hunderttausender, also neunhunderttausend."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "340 000 + 60 000 = ?"
                say: "Dreihundertvierzigtausend plus sechzigtausend. Wie viel ist das?"
                options: ["400 000", "346 000", "940 000"]
                answer: "400 000"
                feedback:
                  "346 000": "Sechzigtausend sind sechs Zehntausender, nicht sechs Tausender. Vierunddreißig Zehntausender und sechs Zehntausender sind vierzig Zehntausender."
                  "940 000": "Sechzigtausend sind sechs Zehntausender, nicht sechs Hunderttausender."
                hints:
                  - "Zähl in Zehntausendern: 34 und 6."
                  - "34 + 6 = 40."
                  - "Vierzig Zehntausender sind 400 000."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst acht plus vier, dann achtzigtausend plus vierzigtausend."
                frame: "8 + 4 = _ | 80 000 + 40 000 = _"
                options: ["12", "12 000", "120 000", "1 200 000"]
                answer: ["12", "120 000"]
                hints:
                  - "Acht plus vier ist zwölf."
                  - "Zwölf Zehntausender."
                  - "12 und 120 000."
              - id: l2-f3
                type: text_input
                text: "900 000 − 200 000 = _"
                say: "Neunhunderttausend minus zweihunderttausend."
                answer: "700000"
                hints:
                  - "Rechne mit Hunderttausendern."
                  - "Neun minus zwei ist sieben."
                  - "700 000. Tippe 700000."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 450 000 − 50 000 = 400 000"
                say: "Vierhundertfünfzigtausend minus fünfzigtausend ist vierhunderttausend. Stimmt das?"
                answer: true
                hints:
                  - "Zähl in Zehntausendern: 45 minus 5."
                  - "45 − 5 = 40."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Welche kleine Aufgabe hilft bei 70 000 − 30 000?"
                say: "Welche kleine Aufgabe hilft bei siebzigtausend minus dreißigtausend?"
                options: ["7 − 3", "70 − 3", "7 + 3"]
                answer: "7 − 3"
                hints:
                  - "Beide Zahlen haben Zehntausender."
                  - "Sieben Zehntausender minus drei Zehntausender."
                  - "7 − 3."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "520 000 + 80 000 = ?"
                say: "Fünfhundertzwanzigtausend plus achtzigtausend. Wie viel ist das?"
                options: ["600 000", "528 000", "1 320 000"]
                answer: "600 000"
                hints: ["Wie viele Zehntausender sind achtzigtausend?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst fünfzehn minus sieben, dann hundertfünfzigtausend minus siebzigtausend."
                frame: "15 − 7 = _ | 150 000 − 70 000 = _"
                options: ["8", "8000", "80 000", "800 000"]
                answer: ["8", "80 000"]
                hints: ["Zähl in Zehntausendern."]
              - id: l2-s3
                type: text_input
                text: "400 000 + 500 000 = _"
                say: "Vierhunderttausend plus fünfhunderttausend."
                answer: "900000"
                hints: ["Wie viele Hunderttausender sind es zusammen?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 360 000 − 60 000 = 354 000"
                say: "Dreihundertsechzigtausend minus sechzigtausend ist dreihundertvierundfünfzigtausend. Stimmt das?"
                answer: false
                hints: ["Wie viele Zehntausender sind sechzigtausend?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welche kleine Aufgabe hilft bei 300 000 + 500 000?"
                say: "Welche kleine Aufgabe hilft bei dreihunderttausend plus fünfhunderttausend?"
                options: ["30 + 5", "3 + 5", "3 − 5"]
                answer: "3 + 5"
                hints: ["Mit welcher Einheit rechnest du hier?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "730 000 + 70 000 = ?"
                say: "Siebenhundertdreißigtausend plus siebzigtausend. Wie viel ist das?"
                options: ["737 000", "800 000", "1 430 000"]
                answer: "800 000"
              - id: l2-n2
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst neun plus sechs, dann neunzigtausend plus sechzigtausend."
                frame: "9 + 6 = _ | 90 000 + 60 000 = _"
                options: ["15", "15 000", "150 000", "1 500 000"]
                answer: ["15", "150 000"]
              - id: l2-n3
                type: text_input
                text: "1 000 000 − 400 000 = _"
                say: "Eine Million minus vierhunderttausend."
                answer: "600000"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 280 000 + 20 000 = 300 000"
                say: "Zweihundertachtzigtausend plus zwanzigtausend ist dreihunderttausend. Stimmt das?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "500 000 − 50 000 = _"
                say: "Fünfhunderttausend minus fünfzigtausend."
                answer: "450000"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: thousands
            type: multiple_choice
            text: "8000 + 9000 = ?"
            say: "Achttausend plus neuntausend. Wie viel ist das?"
            options: ["1700", "17 000", "89 000"]
            answer: "17 000"
          - id: l2-c2
            part: thousands
            type: text_input
            text: "13 000 − 7000 = _"
            say: "Dreizehntausend minus siebentausend."
            answer: "6000"
          - id: l2-c3
            part: ten-thousands
            type: multiple_choice
            text: "650 000 + 50 000 = ?"
            say: "Sechshundertfünfzigtausend plus fünfzigtausend. Wie viel ist das?"
            options: ["655 000", "700 000", "1 150 000"]
            answer: "700 000"
          - id: l2-c4
            part: hundred-thousands
            type: text_input
            text: "800 000 − 300 000 = _"
            say: "Achthunderttausend minus dreihunderttausend."
            answer: "500000"
          - id: l2-c5
            part: ten-thousands
            type: true_false
            text: "Stimmt das? 120 000 − 40 000 = 80 000"
            say: "Hundertzwanzigtausend minus vierzigtausend ist achtzigtausend. Stimmt das?"
            answer: true
          - id: l2-c6
            part: thousands
            type: text_input
            text: "4000 + 9000 = _"
            say: "Viertausend plus neuntausend."
            answer: "13000"
          - id: l2-c7
            part: thousands
            type: true_false
            text: "Stimmt das? 11 000 − 3000 = 8000"
            say: "Elftausend minus dreitausend ist achttausend. Stimmt das?"
            answer: true
          - id: l2-c8
            part: thousands
            type: multiple_choice
            text: "18 000 − 9000 = ?"
            say: "Achtzehntausend minus neuntausend. Wie viel ist das?"
            options: ["900", "9000", "90 000"]
            answer: "9000"
          - id: l2-c9
            part: ten-thousands
            type: text_input
            text: "60 000 + 70 000 = _"
            say: "Sechzigtausend plus siebzigtausend."
            answer: "130000"
          - id: l2-c10
            part: ten-thousands
            type: multiple_choice
            text: "430 000 − 30 000 = ?"
            say: "Vierhundertdreißigtausend minus dreißigtausend. Wie viel ist das?"
            options: ["427 000", "400 000", "130 000"]
            answer: "400 000"
          - id: l2-c11
            part: ten-thousands
            type: true_false
            text: "Stimmt das? 470 000 + 30 000 = 473 000"
            say: "Vierhundertsiebzigtausend plus dreißigtausend ist vierhundertdreiundsiebzigtausend. Stimmt das?"
            answer: false
          - id: l2-c12
            part: hundred-thousands
            type: text_input
            text: "400 000 + 400 000 = _"
            say: "Vierhunderttausend plus vierhunderttausend."
            answer: "800000"
          - id: l2-c13
            part: hundred-thousands
            type: multiple_choice
            text: "700 000 − 400 000 = ?"
            say: "Siebenhunderttausend minus vierhunderttausend. Wie viel ist das?"
            options: ["30 000", "300 000", "3 000 000"]
            answer: "300 000"
          - id: l2-c14
            part: hundred-thousands
            type: true_false
            text: "Stimmt das? 1 000 000 − 300 000 = 700 000"
            say: "Eine Million minus dreihunderttausend ist siebenhunderttausend. Stimmt das?"
            answer: true
          - id: l2-c15
            part: hundred-thousands
            type: multiple_choice
            text: "500 000 + 500 000 = ?"
            say: "Fünfhunderttausend plus fünfhunderttausend. Wie viel ist das?"
            options: ["100 000", "1 000 000", "10 000 000"]
            answer: "1 000 000"
          - id: l2-c16
            part: helper
            type: multiple_choice
            text: "Welche kleine Aufgabe hilft bei 130 000 − 70 000?"
            say: "Welche kleine Aufgabe hilft bei hundertdreißigtausend minus siebzigtausend?"
            options: ["13 − 7", "130 − 7", "13 + 7"]
            answer: "13 − 7"
          - id: l2-c17
            part: helper
            type: fill_in_blank
            text: "Die kleine Aufgabe hilft."
            say: "Rechne erst sieben plus acht, dann siebentausend plus achttausend."
            frame: "7 + 8 = _ | 7000 + 8000 = _"
            options: ["15", "1500", "15 000", "150 000"]
            answer: ["15", "15 000"]
          - id: l2-c18
            part: helper
            type: fill_in_blank
            text: "Die kleine Aufgabe hilft."
            say: "Rechne erst zwei plus sieben, dann zweihunderttausend plus siebenhunderttausend."
            frame: "2 + 7 = _ | 200 000 + 700 000 = _"
            options: ["9", "90 000", "900 000", "9 000 000"]
            answer: ["9", "900 000"]
          - id: l2-c19
            part: helper
            type: multiple_choice
            text: "Zu welcher großen Aufgabe passt 9 − 4?"
            say: "Zu welcher großen Aufgabe passt die kleine Aufgabe neun minus vier?"
            options: ["90 000 − 4000", "90 000 − 40 000", "9000 + 4000"]
            answer: "90 000 − 40 000"
          - id: l2-c20
            part: helper
            type: fill_in_blank
            text: "Die kleine Aufgabe hilft."
            say: "Rechne erst vierzehn minus acht, dann hundertvierzigtausend minus achtzigtausend."
            frame: "14 − 8 = _ | 140 000 − 80 000 = _"
            options: ["6", "6000", "60 000", "600 000"]
            answer: ["6", "60 000"]
