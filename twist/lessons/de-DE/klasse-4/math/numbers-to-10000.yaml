# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.numbers-to-10000
skill: math.large-numbers.to-10000
curriculum: de-DE
language: de
title:
  de: Zahlen bis 10 000
  en: Numbers to 10 000
summary: >
  The first lesson of Klasse 4 opens the Zehntausenderraum: ten hundreds
  make a thousand, as ten tens made a hundred. Lesson 1 bundles hundreds
  into thousands and counts in thousands; lesson 2 enters four-digit
  numbers in the Stellentafel (T, H, Z, E) and names the value of each
  digit; lesson 3 reads and writes them, also as number words, and ends
  with the skill check.
metadata:
  year: klasse-4
  topic: { de: Zahlen bis 10 000, en: Numbers to 10 000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value]
  also_practises: [math.numbers-to-1000.read-write]
  vocabulary: { de: [Tausender, Stellentafel, Stellenwert, Ziffer, zehntausend, bündeln] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart, base-ten]
  facets: []
  misconceptions:
    - id: thousand-as-hundred
      what: Thinks ten hundreds make a new hundred or does not see the new column
      addressed: lesson 1 Learn bundles ten hundred flats and opens the T column
    - id: zero-columns
      what: Drops zeros in the middle (writes 4007 as 47 or 407)
      addressed: lessons 2 and 3 set numbers with zeros in the middle in most stages; full-stage feedback names the empty column
    - id: word-order
      what: Writes the two-digit part as heard (dreitausendvierhundertzweiundsechzig as 3426)
      addressed: lesson 3 Learn splits the word at tausend and hundert and writes the last part tens first
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehn Hunderter sind ein Tausender, en: Ten hundreds make a thousand }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Hunderter sind 1000?"
            options: ["10", "100", "1"]
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Zahl steht in der Stellentafel?"
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [7, 0, 4] }
            options: ["74", "704", "740"]
            answer: "704"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "10 Hunderter = 1 Tausender"
            say: "Zehn Hunderterplatten sind tausend. Wir bündeln sie zu einem Tausender."
            show: { drawn: base-ten, hundreds: 10, tens: 0, ones: 0 }
          - text: "T | H | Z | E"
            say: "Die Stellentafel bekommt eine neue Spalte: T für Tausender. Sie steht links von den Hundertern."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [1, 0, 0, 0] }
          - text: "1000, 2000, 3000 ... 10 000"
            say: "Wir zählen in Tausenderschritten: tausend, zweitausend, dreitausend und so weiter bis neuntausend. Zehn Tausender sind zehntausend."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Hunderter sind ein Tausender?"
                options: ["10", "100", "1000"]
                answer: "10"
                hints:
                  - "Zähl in Hundertern bis tausend."
                  - "Hundert, zweihundert, ... neunhundert, tausend."
                  - "Zehn Hunderter sind ein Tausender."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "3000, 4000, 5000, _"
                options: ["5001", "5100", "6000"]
                answer: "6000"
                hints:
                  - "Es geht in Tausenderschritten weiter."
                  - "Nach fünf Tausendern kommen sechs."
                  - "Das ist 6000."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viele Tausender sind 7000?"
                options: ["7", "70", "700"]
                answer: "7"
                hints:
                  - "Zähl in Tausendern bis 7000."
                  - "Tausend, zweitausend, ... siebentausend."
                  - "7000 sind 7 Tausender."
              - id: l1-f4
                type: multiple_choice
                text: "Wie viele Hunderter sind 2000?"
                options: ["2", "20", "200"]
                answer: "20"
                feedback:
                  "2": "2000 sind 2 Tausender. Ein Tausender sind zehn Hunderter."
                hints:
                  - "Ein Tausender sind zehn Hunderter."
                  - "Zwei Tausender sind zweimal zehn Hunderter."
                  - "2000 sind 20 Hunderter."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 10 Tausender sind 10 000."
                answer: true
                hints:
                  - "Zähl zehn Tausender: tausend, zweitausend, ..."
                  - "Neuntausend, dann zehntausend."
                  - "Ja."
              - id: l1-f6
                type: multiple_choice
                text: "9000, 8000, 7000, _"
                options: ["6000", "6900", "7100"]
                answer: "6000"
                hints:
                  - "Die Zahlen werden kleiner."
                  - "Immer tausend weniger."
                  - "Nach 7000 kommt 6000."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Tausender sind 4000?"
                options: ["4", "40", "400"]
                answer: "4"
                hints: ["Zähl in Tausendern."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie viele Hunderter sind 5000?"
                options: ["5", "50", "500"]
                answer: "50"
                hints: ["Ein Tausender sind zehn Hunderter."]
              - id: l1-s3
                type: multiple_choice
                text: "6000, 7000, 8000, _"
                options: ["8100", "9000", "8001"]
                answer: "9000"
                hints: ["Immer tausend mehr."]
              - id: l1-s4
                type: text_input
                text: "Wie viel sind 8 Tausender?"
                answer: "8000"
                hints: ["Acht mal tausend."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? 30 Hunderter sind 300."
                answer: false
                hints: ["Zehn Hunderter sind tausend."]
              - id: l1-s6
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [3, 0, 0, 0] }
                options: ["3", "300", "3000"]
                answer: "3000"
                hints: ["Die 3 steht bei T."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Tausender sind 9000?"
                options: ["9", "90", "900"]
                answer: "9"
              - id: l1-n2
                type: multiple_choice
                text: "Wie viele Hunderter sind 3000?"
                options: ["3", "30", "300"]
                answer: "30"
              - id: l1-n3
                type: text_input
                text: "Wie viel sind 5 Tausender?"
                answer: "5000"
              - id: l1-n4
                type: multiple_choice
                text: "2000, 4000, 6000, _"
                options: ["7000", "8000", "6200"]
                answer: "8000"
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 1000 + 1000 + 1000 = 3000"
                answer: true
              - id: l1-n6
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [6, 0, 0, 0] }
                options: ["6", "600", "6000"]
                answer: "6000"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Hunderter sind 4000?"
            options: ["4", "40", "400"]
            answer: "40"
          - id: l1-c2
            type: multiple_choice
            text: "7000, 8000, 9000, _"
            options: ["9100", "10 000", "9001"]
            answer: "10 000"
          - id: l1-c3
            type: text_input
            text: "Wie viel sind 2 Tausender?"
            answer: "2000"

  - n: 2
    title: { de: "T, H, Z und E", en: "Th, H, T and O" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Hunderter sind 6000?"
            options: ["6", "60", "600"]
            answer: "60"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Wie viel sind 7 Tausender?"
            answer: "7000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 T, 4 H, 6 Z, 2 E"
            say: "Drei Tausender, vier Hunderter, sechs Zehner und zwei Einer. Jede Ziffer kommt in ihre Spalte."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [3, 4, 6, 2] }
          - text: "3462 = 3000 + 400 + 60 + 2"
            say: "Die Zahl ist dreitausendvierhundertzweiundsechzig. Zerlegt: dreitausend plus vierhundert plus sechzig plus zwei. Die Drei ist dreitausend wert."
          - text: "4007"
            say: "Bei viertausendsieben gibt es keine Hunderter und keine Zehner. Dort stehen zwei Nullen. Ohne sie wäre es nur siebenundvierzig."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [4, 0, 0, 7] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [2, 5, 1, 8] }
                options: ["2518", "8152", "2581"]
                answer: "2518"
                hints:
                  - "Lies von links nach rechts."
                  - "2 Tausender, 5 Hunderter, 1 Zehner, 8 Einer."
                  - "Die Zahl ist 2518."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Trag 6094 in die Stellentafel ein."
                frame: "T: _  H: _  Z: _  E: _"
                options: ["0", "4", "6", "9"]
                answer: ["6", "0", "9", "4"]
                hints:
                  - "Die erste Ziffer gehört zu T."
                  - "6 bei T, 0 bei H."
                  - "T: 6, H: 0, Z: 9, E: 4."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [5, 0, 0, 3] }
                options: ["53", "503", "5003"]
                answer: "5003"
                feedback:
                  "53": "Es gibt 5 Tausender. Bei H und Z stehen Nullen, die musst du mitschreiben."
                  "503": "Die 5 steht bei T, nicht bei H. Es fehlt eine Null."
                hints:
                  - "Bei H und Z steht 0."
                  - "5 Tausender, keine Hunderter, keine Zehner, 3 Einer."
                  - "Die Zahl ist 5003."
              - id: l2-f4
                type: multiple_choice
                text: "Wie viel ist die 7 in 4721 wert?"
                options: ["7", "70", "700"]
                answer: "700"
                hints:
                  - "An welcher Stelle steht die 7?"
                  - "Bei den Hundertern."
                  - "Sie ist 700 wert."
              - id: l2-f5
                type: fill_in_blank
                text: "Zerlege 8350."
                frame: "8350 = _ + _ + _"
                options: ["50", "300", "350", "8000"]
                answer: ["8000", "300", "50"]
                hints:
                  - "Jede Ziffer hat ihren Wert. Die 0 brauchst du nicht zu schreiben."
                  - "8 Tausender, 3 Hunderter, 5 Zehner."
                  - "8000 + 300 + 50."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? 9000 + 40 + 6 = 9406"
                answer: false
                hints:
                  - "Gibt es Hunderter?"
                  - "Keine Hunderter: bei H steht 0. 40 sind Zehner."
                  - "Nein, es ist 9046."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [7, 3, 0, 5] }
                options: ["735", "7305", "7350"]
                answer: "7305"
                hints: ["Bei Z steht 0."]
              - id: l2-s2
                type: fill_in_blank
                text: "Trag 1460 in die Stellentafel ein."
                frame: "T: _  H: _  Z: _  E: _"
                options: ["0", "1", "4", "6"]
                answer: ["1", "4", "6", "0"]
                hints: ["Keine Einer: 0."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viel ist die 3 in 3815 wert?"
                options: ["3", "300", "3000"]
                answer: "3000"
                hints: ["Ganz links stehen die Tausender."]
              - id: l2-s4
                type: text_input
                text: "4000 + 200 + 9 = _"
                answer: "4209"
                hints: ["Keine Zehner."]
              - id: l2-s5
                type: multiple_choice
                text: "In welcher Zahl ist die 6 sechzig wert?"
                options: ["6012", "1602", "2163"]
                answer: "2163"
                hints: ["Die 6 muss bei Z stehen."]
              - id: l2-s6
                type: true_false
                text: "Stimmt das? In 5555 sind alle Ziffern 5 wert."
                answer: false
                hints: ["Die Stelle bestimmt den Wert."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [9, 0, 8, 0] }
                options: ["98", "9080", "9800"]
                answer: "9080"
              - id: l2-n2
                type: fill_in_blank
                text: "Trag 3007 in die Stellentafel ein."
                frame: "T: _  H: _  Z: _  E: _"
                options: ["0", "3", "7", "37"]
                answer: ["3", "0", "0", "7"]
              - id: l2-n3
                type: multiple_choice
                text: "Wie viel ist die 2 in 6249 wert?"
                options: ["2", "20", "200"]
                answer: "200"
              - id: l2-n4
                type: text_input
                text: "7000 + 50 = _"
                answer: "7050"
              - id: l2-n5
                type: fill_in_blank
                text: "Zerlege 2614."
                frame: "2614 = _ + _ + _ + _"
                options: ["4", "10", "600", "2000"]
                answer: ["2000", "600", "10", "4"]
              - id: l2-n6
                type: multiple_choice
                text: "In welcher Zahl ist die 1 tausend wert?"
                options: ["4100", "1004", "4010"]
                answer: "1004"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welche Zahl steht in der Stellentafel?"
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [4, 6, 0, 0] }
            options: ["46", "460", "4600"]
            answer: "4600"
          - id: l2-c2
            type: multiple_choice
            text: "Wie viel ist die 8 in 1857 wert?"
            options: ["8", "80", "800"]
            answer: "800"
          - id: l2-c3
            type: text_input
            text: "6000 + 300 + 20 + 1 = _"
            answer: "6321"

  - n: 3
    title: { de: Große Zahlen lesen und schreiben, en: Reading and writing large numbers }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Welche Zahl steht in der Stellentafel?"
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [8, 1, 4, 0] }
            options: ["8140", "8014", "814"]
            answer: "8140"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "Wie viel ist die 5 in 5318 wert?"
            options: ["50", "500", "5000"]
            answer: "5000"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "dreitausend | vierhundert | zweiundsechzig"
            say: "Ein langes Zahlwort liest du in Teilen: dreitausend, vierhundert, zweiundsechzig. Aus dreitausend wird die Drei bei den Tausendern, aus vierhundert die Vier bei den Hundertern."
          - text: "3462"
            say: "Bei zweiundsechzig hörst du die Zehner zuletzt: sechzig. Also kommt die Sechs zu den Zehnern und die Zwei zu den Einern. Die Ziffern sind drei, vier, sechs und zwei."
            show: { drawn: place-value-chart, columns: [thousands, hundreds, tens, ones], values: [3, 4, 6, 2] }
          - text: "5080 → fünftausendachtzig"
            say: "Andersherum: Die Ziffern sind fünf, null, acht und null. Fünf Tausender, keine Hunderter, acht Zehner. Man sagt nur, was da ist: fünftausendachtzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Hör zu. Welche Zahl ist das?"
                say: "Zweitausendsiebenhundertfünfunddreißig. Welche Zahl ist das?"
                options: ["2735", "2753", "27 035"]
                answer: "2735"
                option_audio: false
                feedback:
                  "2753": "Fünfunddreißig: Die Zehner stehen am Ende, dreißig. Die 3 kommt zu Z."
                hints:
                  - "Zweitausend: 2 bei T. Siebenhundert: 7 bei H."
                  - "Fünfunddreißig: 3 Zehner, 5 Einer."
                  - "2735."
                difficulty: easy
              - id: l3-f2
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Sechstausendvierhundertzwölf. Schreib die Zahl."
                answer: "6412"
                hints:
                  - "Sechstausend, vierhundert, zwölf."
                  - "Zwölf ist 1 Zehner und 2 Einer."
                  - "6412."
              - id: l3-f3
                type: multiple_choice
                text: "Hör zu. Welche Zahl ist das?"
                say: "Neuntausendfünfzig. Welche Zahl ist das?"
                options: ["950", "9050", "9500"]
                answer: "9050"
                option_audio: false
                hints:
                  - "Hörst du Hunderter?"
                  - "Keine Hunderter: bei H steht 0."
                  - "9050."
              - id: l3-f4
                type: multiple_choice
                text: "fünftausenddreihundertachtundvierzig"
                say: "Lies das Zahlwort. Welche Zahl ist das?"
                options: ["5384", "5348", "53 048"]
                answer: "5348"
                option_audio: false
                hints:
                  - "Teile das Wort: fünftausend, dreihundert, achtundvierzig."
                  - "Achtundvierzig: 4 Zehner, 8 Einer."
                  - "5348."
              - id: l3-f5
                type: multiple_choice
                text: "Welches Zahlwort passt zu 4006?"
                say: "Welches Zahlwort passt zu der Zahl? Lies die Wörter selbst."
                options: ["viertausendsechs", "viertausendsechzig", "vierhundertsechs"]
                answer: "viertausendsechs"
                option_audio: false
                hints:
                  - "4006: 4 Tausender, 6 Einer."
                  - "Keine Hunderter, keine Zehner."
                  - "Viertausendsechs."
              - id: l3-f6
                type: text_input
                text: "achttausendzweihundert"
                say: "Lies das Zahlwort und schreib die Zahl."
                answer: "8200"
                hints:
                  - "Achttausend: 8 bei T."
                  - "Zweihundert: 2 bei H. Keine Zehner, keine Einer."
                  - "8200."

          - support: some
            tasks:
              - id: l3-s1
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Dreitausendneunhunderteinundsiebzig. Schreib die Zahl."
                answer: "3971"
                hints: ["Einundsiebzig: 7 Zehner, 1 Einer."]
              - id: l3-s2
                type: multiple_choice
                text: "Hör zu. Welche Zahl ist das?"
                say: "Siebentausendacht. Welche Zahl ist das?"
                options: ["708", "7008", "7800"]
                answer: "7008"
                option_audio: false
                hints: ["Keine Hunderter, keine Zehner."]
              - id: l3-s3
                type: multiple_choice
                text: "zweitausendsechshundertneunzehn"
                say: "Lies das Zahlwort. Welche Zahl ist das?"
                options: ["2691", "2619", "2609"]
                answer: "2619"
                option_audio: false
                hints: ["Neunzehn ist 1 Zehner, 9 Einer."]
              - id: l3-s4
                type: multiple_choice
                text: "Welches Zahlwort passt zu 1530?"
                say: "Welches Zahlwort passt zu der Zahl? Lies die Wörter selbst."
                options: ["tausendfünfhundertdreißig", "tausendfünfhundertdrei", "tausenddreihundertfünfzig"]
                answer: "tausendfünfhundertdreißig"
                option_audio: false
                hints: ["1 T, 5 H, 3 Z, 0 E."]
              - id: l3-s5
                type: text_input
                text: "neuntausendneunhundertneunundneunzig"
                say: "Lies das Zahlwort und schreib die Zahl."
                answer: "9999"
                hints: ["Alle Ziffern sind gleich."]
              - id: l3-s6
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Zehntausend. Schreib die Zahl."
                answer: "10000"
                hints: ["Eine 1 und vier Nullen."]

          - support: none
            tasks:
              - id: l3-n1
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Viertausendzweihundertsechsundachtzig. Schreib die Zahl."
                answer: "4286"
              - id: l3-n2
                type: multiple_choice
                text: "Hör zu. Welche Zahl ist das?"
                say: "Sechstausenddreihundert. Welche Zahl ist das?"
                options: ["630", "6030", "6300"]
                answer: "6300"
                option_audio: false
              - id: l3-n3
                type: multiple_choice
                text: "achttausendvierzehn"
                say: "Lies das Zahlwort. Welche Zahl ist das?"
                options: ["8014", "8140", "8041"]
                answer: "8014"
                option_audio: false
              - id: l3-n4
                type: text_input
                text: "dreitausendsiebenhundertzwei"
                say: "Lies das Zahlwort und schreib die Zahl."
                answer: "3702"
              - id: l3-n5
                type: multiple_choice
                text: "Welches Zahlwort passt zu 5090?"
                say: "Welches Zahlwort passt zu der Zahl? Lies die Wörter selbst."
                options: ["fünftausendneunzig", "fünftausendneunhundert", "fünftausendneun"]
                answer: "fünftausendneunzig"
                option_audio: false
              - id: l3-n6
                type: text_input
                text: "Hör zu und schreib die Zahl."
                say: "Tausendeins. Schreib die Zahl."
                answer: "1001"

      - activity: check
        size: skill
        tasks:
          - id: l3-c1
