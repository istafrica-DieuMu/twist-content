# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.parallel-perpendicular
skill: math.shapes.parallel-perpendicular
curriculum: de-DE
language: de
title:
  de: Parallel und senkrecht
  en: Parallel and perpendicular
summary: >
  Lesson 1 recognises parallele Linien (überall gleich weit entfernt, sie
  treffen sich nie) and Linien, die senkrecht zueinander sind (sie
  schneiden sich im rechten Winkel), in Zeichen, Buchstaben and things
  around us, also when they lie schräg; lesson 2 says how the Geodreieck
  checks both and finds parallel sides and right angles in Rechteck,
  Quadrat, Parallelogramm, Trapez, Dreieck and Sechseck, and ends with
  the skill check. Drawing
  parallels and perpendiculars with the Geodreieck waits for a drawing
  task.
metadata:
  year: klasse-4
  topic: { de: Geometrie, en: Geometry }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.shapes.lines-segments]
  also_practises: [math.shapes.properties]
  vocabulary: { de: [parallel, senkrecht zueinander, rechter Winkel, Gerade, Geodreieck, Mittellinie, gegenüberliegend] }
  forms: [text, audio, drawn]
  drawn: [letter-card, ruler, shape]
  facets: []
  parts:
    - { id: parallel, what: { de: parallele Linien erkennen, en: recognising parallel lines } }
    - { id: perpendicular, what: { de: "Linien erkennen, die senkrecht zueinander sind, auch schräge", en: "recognising perpendicular lines, also tilted ones" } }
    - { id: set-square, what: { de: mit dem Geodreieck prüfen, en: checking with a set square } }
    - { id: shapes, what: { de: parallele Seiten und rechte Winkel in Figuren finden, en: finding parallel sides and right angles in shapes } }
  misconceptions:
    - id: senkrecht-means-upright
      what: Thinks two lines are only senkrecht zueinander when one of them stands upright on the page, so a tilted right-angled cross does not count
      addressed: lesson 1 Learn turns the plus sign into the times sign; l1-f4 asks about the times sign with feedback, l2-c4 asks about two tilted lines
    - id: parallel-needs-same-length
      what: Thinks parallel lines must be equally long or lie exactly side by side
      addressed: lesson 1 Learn says parallel lines may have different lengths; l1-s3 and l1-n4 ask whether parallels must be equally long or meet in the end
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Parallel oder senkrecht zueinander", en: "Parallel or perpendicular" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist eine Strecke?"
            say: "Was ist eine Strecke?"
            options: ["eine gerade Linie zwischen zwei Punkten", "eine gerade Linie ohne Ende", "eine krumme Linie"]
            answer: "eine gerade Linie zwischen zwei Punkten"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie lang ist die Strecke?"
            say: "Die Strecke fängt bei null an. Wie lang ist sie?"
            show: { drawn: ruler, to: 10, length: 7, colour: blue }
            options: ["7 cm", "8 cm", "6 cm"]
            answer: "7 cm"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "parallel"
            say: "Zwei Geraden sind parallel, wenn sie überall gleich weit voneinander entfernt sind. Sie treffen sich nie, auch wenn du sie ganz lang zeichnest. Die Schienen einer Eisenbahn sind parallel, und auch die beiden Striche im Gleichheitszeichen."
            show: { drawn: letter-card, text: "=" }
          - text: "senkrecht zueinander"
            say: "Zwei Geraden sind senkrecht zueinander, wenn sie sich in einem rechten Winkel schneiden, so wie beim Pluszeichen. Alle vier Winkel sind dann gleich groß."
            show: { drawn: letter-card, text: "+" }
          - text: "Auch schräg bleibt der rechte Winkel."
            say: "Dreh das Pluszeichen ein Stück, dann bekommst du das Malzeichen. Der rechte Winkel bleibt, die Striche sind immer noch senkrecht zueinander. Senkrecht zueinander heißt also nicht, dass eine Linie von oben nach unten geht. Und parallele Linien dürfen verschieden lang sein."
            show: { drawn: letter-card, text: "×" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Sind die beiden Striche parallel?"
                say: "Schau dir das Gleichheitszeichen an. Sind die beiden Striche parallel?"
                show: { drawn: letter-card, text: "=" }
                answer: true
                hints:
                  - "Sind sie überall gleich weit voneinander entfernt?"
                  - "Die Striche laufen nebeneinander her und treffen sich nie."
                  - "Ja, sie sind parallel."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was ist parallel?"
                say: "Was ist parallel?"
                options: ["die Schienen einer Eisenbahn", "die Zeiger einer Uhr um 3 Uhr", "die Äste eines Baumes"]
                answer: "die Schienen einer Eisenbahn"
                feedback:
                  "die Zeiger einer Uhr um 3 Uhr": "Um 3 Uhr bilden die Zeiger einen rechten Winkel. Sie sind senkrecht zueinander, nicht parallel."
                hints:
                  - "Parallele Linien treffen sich nie."
                  - "Ein Zug braucht zwei Schienen, die immer gleich weit auseinander sind."
                  - "Die Schienen einer Eisenbahn."
              - id: l1-f3
                type: true_false
                text: "Beim Pluszeichen sind die Striche senkrecht zueinander."
                say: "Stimmt das? Beim Pluszeichen sind die beiden Striche senkrecht zueinander."
                show: { drawn: letter-card, text: "+" }
                answer: true
                hints:
                  - "Schneiden sie sich im rechten Winkel?"
                  - "Alle vier Winkel am Pluszeichen sind gleich groß."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: true_false
                text: "Beim Malzeichen sind die Striche senkrecht zueinander."
                say: "Stimmt das? Beim Malzeichen sind die beiden Striche senkrecht zueinander."
                show: { drawn: letter-card, text: "×" }
                answer: true
                feedback:
                  "false": "Das Malzeichen ist ein gedrehtes Pluszeichen. Beim Drehen bleibt der rechte Winkel, auch wenn kein Strich von oben nach unten geht."
                hints:
                  - "Denk an das Pluszeichen. Was passiert, wenn du es drehst?"
                  - "Beim Drehen ändern sich die Winkel nicht."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Welcher Buchstabe hat zwei parallele Striche?"
                say: "Welcher Buchstabe hat zwei parallele Striche?"
                options: ["H", "L", "V"]
                answer: "H"
                option_audio: false
                hints:
                  - "Suche zwei Striche, die nebeneinander herlaufen."
                  - "Beim L und beim V treffen sich die Striche in einer Ecke."
                  - "H."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Die beiden Striche vom L sind senkrecht zueinander."
                say: "Stimmt das? Die beiden Striche vom L sind senkrecht zueinander."
                show: { drawn: letter-card, text: "L" }
                answer: true
                hints: ["Sie treffen sich in einer Ecke wie die Kanten an einem Blatt Papier."]
              - id: l1-s2
                type: multiple_choice
                text: "Was ist senkrecht zueinander?"
                say: "Was ist senkrecht zueinander?"
                options: ["ein Tischbein und die Tischplatte", "die Linien in einem Heft", "die Sprossen einer Leiter"]
                answer: "ein Tischbein und die Tischplatte"
                hints: ["Wo treffen sich zwei Dinge im rechten Winkel?"]
              - id: l1-s3
                type: true_false
                text: "Parallele Linien müssen gleich lang sein."
                say: "Stimmt das? Parallele Linien müssen gleich lang sein."
                answer: false
                hints: ["Denk an die Erklärung: Was muss bei parallelen Linien überall gleich sein?"]
              - id: l1-s4
                type: multiple_choice
                text: "Wie viele parallele Querstriche hat das E?"
                say: "Wie viele Querstriche hat das E, die zueinander parallel sind?"
                show: { drawn: letter-card, text: "E" }
                options: ["3", "2", "4"]
                answer: "3"
                hints: ["Zähl die Striche, die nach rechts zeigen."]
              - id: l1-s5
                type: true_false
                text: "Beim T sind die beiden Striche parallel."
                say: "Stimmt das? Beim T sind die beiden Striche parallel."
                show: { drawn: letter-card, text: "T" }
                answer: false
                hints: ["Treffen sich die Striche?"]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Die beiden Querstriche vom F sind parallel."
                say: "Stimmt das? Die beiden Querstriche vom F sind parallel."
                show: { drawn: letter-card, text: "F" }
                answer: true
              - id: l1-n2
                type: multiple_choice
                text: "Was ist parallel?"
                say: "Was ist parallel?"
                options: ["die Linien im Notenheft", "die Zeiger einer Uhr um 9 Uhr", "die Seiten eines Dreiecks"]
                answer: "die Linien im Notenheft"
              - id: l1-n3
                type: multiple_choice
                text: "Welcher Buchstabe hat einen rechten Winkel?"
                say: "Welcher Buchstabe hat einen rechten Winkel?"
                options: ["L", "V", "O"]
                answer: "L"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Zwei parallele Geraden treffen sich, wenn man sie lang genug zeichnet."
                say: "Stimmt das? Zwei parallele Geraden treffen sich irgendwann, wenn man sie nur lang genug zeichnet."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Wie liegen die beiden Stäbe eines Fensterkreuzes zueinander?"
                say: "Ein Fenster hat ein Fensterkreuz aus zwei Stäben. Wie liegen die beiden Stäbe zueinander?"
                options: ["senkrecht zueinander", "parallel", "weder noch"]
                answer: "senkrecht zueinander"
                keep_order: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Beim N sind die beiden langen Striche links und rechts parallel."
            say: "Stimmt das? Beim N sind die beiden langen Striche links und rechts parallel."
            show: { drawn: letter-card, text: "N" }
            answer: true
          - id: l1-c2
            type: multiple_choice
            text: "Was ist senkrecht zueinander?"
            say: "Was ist senkrecht zueinander?"
            options: ["die zwei Kanten an der Ecke eines Blattes", "die Streifen eines Zebrastreifens", "die Schienen einer Straßenbahn"]
            answer: "die zwei Kanten an der Ecke eines Blattes"
          - id: l1-c3
            type: true_false
            text: "Senkrecht zueinander heißt: Die Linien schneiden sich im rechten Winkel."
            say: "Stimmt das? Senkrecht zueinander heißt: Die Linien schneiden sich im rechten Winkel."
            answer: true
          - id: l1-c4
            type: true_false
            text: "Beim X sind die beiden Striche parallel."
            say: "Stimmt das? Beim X sind die beiden Striche parallel."
            show: { drawn: letter-card, text: "X" }
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Was ist parallel?"
            say: "Was ist parallel?"
            options: ["die Latten eines Gartenzauns", "die Zeiger einer Uhr um 3 Uhr", "die Kanten an der Ecke eines Buches"]
            answer: "die Latten eines Gartenzauns"
          - id: l1-c6
            type: multiple_choice
            text: "Welcher Buchstabe hat einen rechten Winkel?"
            say: "Welcher Buchstabe hat einen rechten Winkel?"
            options: ["T", "A", "O"]
            answer: "T"
            option_audio: false

  - n: 2
    title: { de: "Mit dem Geodreieck prüfen", en: "Checking with a set square" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Beim H sind die beiden langen Striche parallel."
            say: "Stimmt das? Beim H sind die beiden langen Striche parallel."
            show: { drawn: letter-card, text: "H" }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist parallel?"
            say: "Was ist parallel: die beiden langen Stangen einer Leiter oder die Zeiger einer Uhr um 3 Uhr?"
            options: ["die beiden langen Stangen einer Leiter", "die Zeiger einer Uhr um 3 Uhr"]
            answer: "die beiden langen Stangen einer Leiter"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Senkrecht prüfen: lange Seite auf die eine Linie, Mittellinie auf die andere"
            say: "Mit dem Geodreieck prüfst du, ob zwei Linien senkrecht zueinander sind. Leg die lange Seite genau auf die eine Linie. Die Mittellinie geht durch die Null. Liegt sie genau auf der anderen Linie, sind beide senkrecht zueinander."
          - text: "Parallel prüfen: lange Seite auf die eine Linie, die andere liegt auf einer dünnen Linie"
            say: "Auf dem Geodreieck sind dünne Linien, die parallel zur langen Seite laufen. Leg die lange Seite auf die eine Linie. Liegt die andere Linie genau auf einer der dünnen Linien, sind beide parallel."
          - text: "Rechteck: 2 Paare paralleler Seiten, 4 rechte Winkel"
            say: "Im Rechteck sind die gegenüberliegenden Seiten parallel. Das sind zwei Paare. Zwei Seiten, die sich in einer Ecke treffen, sind senkrecht zueinander. Jede Ecke ist ein rechter Winkel."
            show: { drawn: shape, kind: rectangle, colour: blue }
          - text: "Parallelogramm: 2 Paare paralleler Seiten, kein rechter Winkel"
            say: "Auch im Parallelogramm sind die gegenüberliegenden Seiten parallel, zwei Paare. Aber es ist schief: Keine Ecke ist ein rechter Winkel."
            show: { drawn: shape, kind: parallelogram, colour: green }
          - text: "Trapez: 1 Paar paralleler Seiten"
            say: "Dieses Viereck ist ein Trapez. Die Seite oben und die Seite unten sind parallel. Die Seiten links und rechts laufen schräg aufeinander zu."
            show: { drawn: shape, kind: trapezoid, colour: orange }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Paare paralleler Seiten hat das Rechteck?"
                say: "Wie viele Paare paralleler Seiten hat das Rechteck?"
                show: { drawn: shape, kind: rectangle, colour: green }
                options: ["2", "4", "1"]
                answer: "2"
                feedback:
                  "4": "Das Rechteck hat 4 Seiten. Ein Paar sind immer zwei Seiten, also sind es 2 Paare."
                hints:
                  - "Welche Seiten liegen sich gegenüber?"
                  - "Oben und unten ist ein Paar, links und rechts ist ein Paar."
                  - "2."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie viele rechte Winkel hat das Quadrat?"
                say: "Wie viele rechte Winkel hat das Quadrat?"
                show: { drawn: shape, kind: square, colour: orange }
                options: ["4", "2", "0"]
                answer: "4"
                hints:
                  - "Schau jede Ecke an."
                  - "Jede Ecke ist so wie die Ecke eines Blattes Papier."
                  - "4."
              - id: l2-f3
                type: true_false
                text: "Das Dreieck hat zwei parallele Seiten."
                say: "Stimmt das? Das Dreieck hat zwei parallele Seiten."
                show: { drawn: shape, kind: triangle, colour: yellow }
                answer: false
                hints:
                  - "Parallele Seiten treffen sich nie."
                  - "Im Dreieck trifft jede Seite die beiden anderen in einer Ecke."
                  - "Nein, im Dreieck ist keine Seite parallel zu einer anderen."
              - id: l2-f4
                type: multiple_choice
                text: "Die lange Seite des Geodreiecks liegt auf der ersten Linie. Was muss auf der zweiten Linie liegen, damit beide senkrecht zueinander sind?"
                say: "Du prüfst mit dem Geodreieck, ob zwei Linien senkrecht zueinander sind. Die lange Seite liegt auf der ersten Linie. Was muss genau auf der zweiten Linie liegen?"
                options: ["die Mittellinie durch die Null", "eine dünne Linie parallel zur langen Seite", "die Zentimeterskala"]
                answer: "die Mittellinie durch die Null"
                feedback:
                  "eine dünne Linie parallel zur langen Seite": "Die dünnen Linien laufen parallel zur langen Seite. Mit ihnen prüfst du, ob zwei Linien parallel sind."
                hints:
                  - "Welche Linie auf dem Geodreieck steht im rechten Winkel auf der langen Seite?"
                  - "Sie geht durch die Null in der Mitte."
                  - "Die Mittellinie durch die Null."
              - id: l2-f5
                type: multiple_choice
                text: "Wie viele Paare paralleler Seiten hat das Sechseck?"
                say: "Wie viele Paare paralleler Seiten hat das Sechseck?"
                show: { drawn: shape, kind: hexagon, colour: purple }
                options: ["3", "6", "2"]
                answer: "3"
                hints:
                  - "Schau dir Seiten an, die sich gegenüberliegen."
                  - "Oben und unten ist ein Paar. Dann gibt es noch zwei schräge Paare."
                  - "3."
                difficulty: stretch

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Im Quadrat ist jede Seite senkrecht zu ihren beiden Nachbarseiten."
                say: "Stimmt das? Im Quadrat ist jede Seite senkrecht zu ihren beiden Nachbarseiten."
                show: { drawn: shape, kind: square, colour: blue }
                answer: true
                hints: ["An jeder Ecke ist ein rechter Winkel."]
              - id: l2-s2
                type: multiple_choice
                text: "Ein Viereck hat genau ein Paar paralleler Seiten. Wie heißt es?"
                say: "Ein Viereck hat genau ein Paar paralleler Seiten. Wie heißt es?"
                show: { drawn: shape, kind: trapezoid, colour: yellow }
                options: ["Trapez", "Rechteck", "Quadrat"]
                answer: "Trapez"
                hints: ["Rechteck und Quadrat haben zwei Paare."]
              - id: l2-s3
                type: multiple_choice
                text: "Die lange Seite des Geodreiecks liegt auf einer Linie. Woran siehst du, dass die andere Linie parallel dazu ist?"
                say: "Die lange Seite des Geodreiecks liegt auf einer Linie. Woran siehst du, dass die andere Linie parallel dazu ist?"
                options: ["Sie liegt genau auf einer dünnen Linie.", "Sie liegt genau auf der Mittellinie.", "Sie ist genauso lang."]
                answer: "Sie liegt genau auf einer dünnen Linie."
                hints: ["Die dünnen Linien laufen parallel zur langen Seite."]
              - id: l2-s4
                type: true_false
                text: "Im Rechteck sind die lange Seite oben und die kurze Seite rechts parallel."
                say: "Stimmt das? Im Rechteck sind die lange Seite oben und die kurze Seite rechts parallel."
                show: { drawn: shape, kind: rectangle, colour: red }
                answer: false
                hints: ["Treffen sich die beiden Seiten in einer Ecke?"]
              - id: l2-s5
                type: multiple_choice
                text: "Wie viele rechte Winkel hat ein Parallelogramm, das kein Rechteck ist?"
                say: "Wie viele rechte Winkel hat ein Parallelogramm, das kein Rechteck ist?"
                show: { drawn: shape, kind: parallelogram, colour: red }
                options: ["0", "2", "4"]
                answer: "0"
                hints: ["Beim Parallelogramm sind die Seiten schräg gegeneinander verschoben."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele Paare paralleler Seiten hat das Quadrat?"
                say: "Wie viele Paare paralleler Seiten hat das Quadrat?"
                show: { drawn: shape, kind: square, colour: green }
                options: ["2", "4", "1"]
                answer: "2"
              - id: l2-n2
                type: true_false
                text: "Ein Dreieck kann einen rechten Winkel haben."
                say: "Stimmt das? Ein Dreieck kann einen rechten Winkel haben."
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Ein Viereck hat zwei Paare paralleler Seiten und vier rechte Winkel. Alle Seiten sind gleich lang. Was ist es?"
                say: "Ein Viereck hat zwei Paare paralleler Seiten und vier rechte Winkel. Alle Seiten sind gleich lang. Was ist es?"
                options: ["ein Quadrat", "ein Rechteck mit zwei langen Seiten", "ein Parallelogramm ohne rechten Winkel"]
                answer: "ein Quadrat"
              - id: l2-n4
                type: multiple_choice
                text: "Mit welcher Linie des Geodreiecks prüfst du, ob zwei Linien senkrecht zueinander sind?"
                say: "Mit welcher Linie des Geodreiecks prüfst du, ob zwei Linien senkrecht zueinander sind?"
                options: ["mit der Mittellinie", "mit einer dünnen Linie", "mit der Zentimeterskala"]
                answer: "mit der Mittellinie"
              - id: l2-n5
                type: true_false
                text: "Das Sechseck hat einen rechten Winkel."
                say: "Stimmt das? Das Sechseck hat einen rechten Winkel."
                show: { drawn: shape, kind: hexagon, colour: orange }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: parallel
            type: multiple_choice
            text: "Bei welchem Zeichen sind die Striche parallel?"
            say: "Bei welchem Zeichen sind die beiden Striche parallel?"
            show: { drawn: letter-card, text: "+ = ×" }
            options: ["=", "+", "×"]
            answer: "="
            option_audio: false
          - id: l2-c2
            part: perpendicular
            type: multiple_choice
            text: "Was ist senkrecht zueinander?"
            say: "Was ist senkrecht zueinander?"
            options: ["ein Fahnenmast und der flache Boden", "die Streifen einer Flagge", "die Saiten einer Gitarre"]
            answer: "ein Fahnenmast und der flache Boden"
          - id: l2-c3
            part: shapes
            type: multiple_choice
            text: "Welche Seiten des Rechtecks sind parallel?"
            say: "Welche Seiten des Rechtecks sind parallel?"
            show: { drawn: shape, kind: rectangle, colour: purple }
            options: ["zwei Seiten, die sich gegenüberliegen", "zwei Seiten, die sich in einer Ecke treffen", "keine"]
            answer: "zwei Seiten, die sich gegenüberliegen"
          - id: l2-c4
            part: perpendicular
            type: true_false
            text: "Zwei Linien liegen schräg auf dem Blatt und schneiden sich im rechten Winkel. Sie sind senkrecht zueinander."
            say: "Stimmt das? Zwei Linien liegen schräg auf dem Blatt und schneiden sich im rechten Winkel. Dann sind sie senkrecht zueinander."
            answer: true
          - id: l2-c5
            part: shapes
            type: multiple_choice
            text: "Ein Viereck hat zwei Paare paralleler Seiten, aber keinen rechten Winkel. Was kann es sein?"
            say: "Ein Viereck hat zwei Paare paralleler Seiten, aber keinen rechten Winkel. Was kann es sein?"
            options: ["ein Parallelogramm", "ein Rechteck", "ein Quadrat"]
            answer: "ein Parallelogramm"
          - id: l2-c6
            part: parallel
            type: true_false
            text: "Beim Z sind der obere und der untere Strich parallel."
            say: "Stimmt das? Beim Z sind der obere und der untere Strich parallel."
            show: { drawn: letter-card, text: "Z" }
            answer: true
          - id: l2-c7
            part: parallel
            type: multiple_choice
            text: "Welcher Buchstabe hat keine parallelen Striche?"
            say: "Welcher Buchstabe hat keine parallelen Striche?"
            options: ["X", "H", "Z"]
            answer: "X"
            option_audio: false
          - id: l2-c8
            part: parallel
            type: multiple_choice
            text: "Was ist parallel?"
            say: "Was ist parallel?"
            options: ["die Leinen zwischen den Bahnen im Schwimmbad", "zwei Straßen an einer Kreuzung", "die Kanten an der Ecke eines Tisches"]
            answer: "die Leinen zwischen den Bahnen im Schwimmbad"
          - id: l2-c9
            part: parallel
