# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.binary
skill: math.large-numbers.binary
curriculum: de-DE
language: de
title:
  de: Das Zweiersystem
  en: Binary numbers
summary: >
  Lesson 1 sets the Zweiersystem beside our Zehnersystem: only the digits
  0 and 1, and each place worth double the one to its right (Einser,
  Zweier, Vierer, Achter); it reads Dualzahlen up to four places as
  numbers, also as a row of lamps that are on (1) or off (0). Lesson 2
  writes numbers to 31 in the Zweiersystem by taking the biggest place
  value that fits, writes a 0 for every place not needed, checks by
  working back, and ends with the skill check. Dualzahlen are spoken
  digit by digit (eins, null, eins) and never read as decimal numbers;
  options in binary are not read aloud.
metadata:
  year: klasse-4
  topic: { de: Zahlen bis 1 000 000, en: Binary numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { de: [Zweiersystem, Zehnersystem, Dualzahl, Stelle, Stellenwert, Einser, Zweier, Vierer, Achter, Sechzehner] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: places, what: { de: die Stellenwerte und Ziffern des Zweiersystems, en: the place values and digits of binary } }
    - { id: read, what: { de: Dualzahlen ins Zehnersystem umwandeln, en: converting binary numbers to base ten } }
    - { id: write, what: { de: Zahlen ins Zweiersystem umwandeln, en: converting numbers to binary } }
  misconceptions:
    - id: read-as-decimal
      what: Reads a Dualzahl as a number in the Zehnersystem (11 as elf, 100 as hundert)
      addressed: lesson 1 Learn; l1-f1 and l1-f2 (with feedback), l1-s2, l1-n2, l1-n5, l1-c2 and l2-c5 offer the Dualzahl itself as a number
    - id: tenfold-places
      what: Thinks the places grow by ten (1, 10, 100) as in the Zehnersystem
      addressed: lesson 1 Learn screen 1; l1-f4, l1-c3 and l2-w2
    - id: zeros-left-out
      what: Leaves out the 0 for a place that is not needed (writes 5 as 11, 9 as 11)
      addressed: lesson 2 Learn screen 3; l2-f2 (with feedback), l2-f3, l2-s2, l2-s4, l2-n2 and l2-c2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Dualzahlen lesen", en: "Reading binary numbers" }
    goal:
      de: "Lies Zahlen im Zweiersystem, das nur 0 und 1 kennt. Leuchten der Vierer und der Zweier, ist das 6."
      en: "Read numbers in binary, which only uses 0 and 1. If the fours and the twos light up, that makes 6."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viel ist die 4 in 547 wert?"
            say: "Wie viel ist die Vier in fünfhundertsiebenundvierzig wert?"
            options: ["40", "4", "400"]
            answer: "40"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Das Doppelte von 8 = _"
            say: "Was ist das Doppelte von acht?"
            answer: "16"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du? Ein Computer kennt nur zwei Ziffern: 0 und 1. Kann er damit trotzdem bis 10 zählen?"
            say: "Ein Computer kennt nur zwei Ziffern: null und eins. Was glaubst du: Kann er damit trotzdem bis zehn zählen?"
          - text: "Zehnersystem\nStellen: 1000, 100, 10, 1\nZiffern: 0 bis 9\n\nZweiersystem\nStellen: 8, 4, 2, 1\nZiffern: nur 0 und 1"
            say: "Ja, und noch viel weiter! In unserem Zehnersystem ist jede Stelle zehnmal so viel wert wie die Stelle rechts daneben: Einer, Zehner, Hunderter, Tausender. Im Zweiersystem ist jede Stelle nur doppelt so viel wert: Einser, Zweier, Vierer, Achter. Und es gibt nur zwei Ziffern: null und eins. Computer rechnen so, denn der Strom ist entweder aus oder an."
          - text: "Dualzahl 1011\n8er: 1\n4er: 0\n2er: 1\n1er: 1\n8 + 2 + 1 = 11"
            say: "So liest du die Dualzahl eins, null, eins, eins. Schreib über jede Ziffer ihren Stellenwert, von rechts: Einser, Zweier, Vierer, Achter. Eine Eins heißt: Diese Stelle zählt mit. Eine Null heißt: Sie zählt nicht. Hier zählen der Achter, der Zweier und der Einser. Acht plus zwei plus eins ist elf."
          - text: "4 Lämpchen: aus, an, an, aus\naus = 0, an = 1\nDualzahl 0110\n4 + 2 = 6"
            say: "Stell dir vier Lämpchen vor, von links: Achter, Vierer, Zweier, Einser. An heißt eins, aus heißt null. Leuchten der Vierer und der Zweier, ist das vier plus zwei, also sechs."
          - text: "Wusstest du? Mit deinen 10 Fingern kannst du im Zweiersystem bis 1023 zählen."
            say: "Wusstest du? Mit deinen zehn Fingern kannst du im Zweiersystem bis tausenddreiundzwanzig zählen. Jeder Finger ist eine Stelle: ausgestreckt heißt eins, eingeklappt heißt null. Mit einer Hand kommst du schon bis einunddreißig."
            show: { object: hand }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Dualzahl: 11\nWelche Zahl ist das?"
                say: "Die Dualzahl eins, eins. Welche Zahl ist das in unserem Zehnersystem?"
                options: ["3", "11", "2"]
                answer: "3"
                option_audio: false
                feedback:
                  "11": "Im Zweiersystem ist die linke 1 ein Zweier, kein Zehner."
                hints:
                  - "Die rechte Stelle ist der Einser, die linke der Zweier."
                  - "Beide Stellen haben eine 1: ein Zweier und ein Einser."
                  - "2 + 1 = 3."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Dualzahl: 100\nWelche Zahl ist das?"
                say: "Die Dualzahl eins, null, null. Welche Zahl ist das in unserem Zehnersystem?"
                options: ["4", "100", "1"]
                answer: "4"
                option_audio: false
                feedback:
                  "100": "Im Zweiersystem ist die dritte Stelle von rechts der Vierer, kein Hunderter."
                hints:
                  - "Von rechts heißen die Stellen Einser, Zweier, Vierer."
                  - "Nur der Vierer hat eine 1."
                  - "4."
              - id: l1-f3
                type: text_input
                text: "Dualzahl: 101 = _"
                say: "Die Dualzahl eins, null, eins. Welche Zahl ist das in unserem Zehnersystem?"
                answer: "5"
                hints:
                  - "Schreib über jede Ziffer ihren Stellenwert: 4, 2, 1."
                  - "Eine 1 steht beim Vierer und beim Einser."
                  - "4 + 1 = 5."
              - id: l1-f4
                type: multiple_choice
                text: "Welche Stelle kommt im Zweiersystem links vom Vierer?"
                say: "Welche Stelle kommt im Zweiersystem links vom Vierer?"
                options: ["der Achter", "der Fünfer", "der Zehner"]
                answer: "der Achter"
                feedback:
                  "der Fünfer": "Einen Fünfer gibt es beim Geld, aber nicht im Zweiersystem! Hier ist jede Stelle doppelt so viel wert wie die rechts daneben: 1, 2, 4, 8."
                  "der Zehner": "Den Zehner gibt es im Zehnersystem. Im Zweiersystem ist jede Stelle doppelt so viel wert wie die rechts daneben."
                hints:
                  - "Jede Stelle ist doppelt so viel wert wie die rechts daneben."
                  - "Was ist das Doppelte von 4?"
                  - "Der Achter."
              - id: l1-f5
                type: text_input
                text: "Dualzahl: 1010 = _"
                say: "Die Dualzahl eins, null, eins, null. Welche Zahl ist das in unserem Zehnersystem?"
                answer: "10"
                hints:
                  - "Schreib über jede Ziffer ihren Stellenwert: 8, 4, 2, 1."
                  - "Eine 1 steht beim Achter und beim Zweier."
                  - "8 + 2 = 10."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Dualzahl: 111 = _"
                say: "Die Dualzahl eins, eins, eins. Welche Zahl ist das?"
                answer: "7"
                hints: ["Von rechts: Einser, Zweier, Vierer. Alle drei zählen mit."]
              - id: l1-s2
                type: multiple_choice
                text: "Dualzahl: 1100\nWelche Zahl ist das?"
                say: "Die Dualzahl eins, eins, null, null. Welche Zahl ist das?"
                options: ["12", "1100", "3"]
                answer: "12"
                option_audio: false
                hints: ["Eine 1 steht beim Achter und beim Vierer."]
              - id: l1-s3
                type: true_false
                text: "Im Zweiersystem gibt es die Ziffern 0, 1 und 2."
                say: "Stimmt das? Im Zweiersystem gibt es die Ziffern null, eins und zwei."
                answer: false
                hints: ["Im Zehnersystem gibt es keine Ziffer für zehn. Welche Ziffer fehlt dann im Zweiersystem?"]
              - id: l1-s4
                type: matching
                text: "Verbinde jede Dualzahl mit ihrer Zahl."
                say: "Verbinde jede Dualzahl mit ihrer Zahl im Zehnersystem."
                pairs:
                  - { left: { text: "110" }, right: { text: "6" } }
                  - { left: { text: "1001" }, right: { text: "9" } }
                  - { left: { text: "11" }, right: { text: "3" } }
                  - { left: { text: "1111" }, right: { text: "15" } }
                option_audio: false
                hints: ["Schreib von rechts über jede Ziffer ihren Stellenwert: 1, 2, 4, 8."]
              - id: l1-s5
                type: multiple_choice
                text: "4 Lämpchen: an, aus, an, an\nan = 1, aus = 0\nWelche Zahl zeigen sie?"
                say: "Vier Lämpchen: an, aus, an, an. An heißt eins, aus heißt null. Welche Zahl zeigen die Lämpchen?"
                options: ["11", "13", "1011"]
                answer: "11"
                option_audio: false
                hints: ["Schreib die Lämpchen als Dualzahl: 1011. Die Stellenwerte sind 8, 4, 2, 1."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: text_input
                text: "Dualzahl: 1000 = _"
                say: "Die Dualzahl eins, null, null, null. Welche Zahl ist das?"
                answer: "8"
              - id: l1-n2
                type: multiple_choice
                text: "Dualzahl: 1101\nWelche Zahl ist das?"
                say: "Die Dualzahl eins, eins, null, eins. Welche Zahl ist das?"
                options: ["13", "11", "1101"]
                answer: "13"
                option_audio: false
              - id: l1-n3
                type: text_input
                text: "Dualzahl: 1110 = _"
                say: "Die Dualzahl eins, eins, eins, null. Welche Zahl ist das?"
                answer: "14"
              - id: l1-n4
                type: multiple_choice
                text: "Ein Roboter zeigt mit 4 Lämpchen eine Zahl: aus, an, an, an. Welche Zahl ist das?"
                say: "Ein Roboter zeigt mit vier Lämpchen eine Zahl: aus, an, an, an. Welche Zahl ist das?"
                options: ["7", "14", "3"]
                answer: "7"
              - id: l1-n5
                type: true_false
                text: "Die Dualzahl 10 bedeutet zehn."
                say: "Stimmt das? Die Dualzahl eins, null bedeutet zehn."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Dualzahl: 110 = _"
            say: "Die Dualzahl eins, eins, null. Welche Zahl ist das?"
            answer: "6"
          - id: l1-c2
            type: multiple_choice
            text: "Dualzahl: 1001\nWelche Zahl ist das?"
            say: "Die Dualzahl eins, null, null, eins. Welche Zahl ist das?"
            options: ["9", "1001", "5"]
            answer: "9"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Im Zweiersystem ist jede Stelle doppelt so viel wert wie die Stelle rechts daneben."
            say: "Stimmt das? Im Zweiersystem ist jede Stelle doppelt so viel wert wie die Stelle rechts daneben."
            answer: true
          - id: l1-c4
            type: matching
            text: "Verbinde jede Dualzahl mit ihrer Zahl."
            say: "Verbinde jede Dualzahl mit ihrer Zahl im Zehnersystem."
            pairs:
              - { left: { text: "10" }, right: { text: "2" } }
              - { left: { text: "1110" }, right: { text: "14" } }
              - { left: { text: "111" }, right: { text: "7" } }
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "4 Lämpchen: an, an, aus, an\nan = 1, aus = 0\nWelche Zahl zeigen sie?"
            say: "Vier Lämpchen: an, an, aus, an. An heißt eins, aus heißt null. Welche Zahl zeigen die Lämpchen?"
            options: ["13", "1101", "11"]
            answer: "13"
            option_audio: false
          - id: l1-c6
            type: multiple_choice
            text: "Welche Stelle kommt im Zweiersystem rechts vom Vierer?"
            say: "Welche Stelle kommt im Zweiersystem rechts vom Vierer?"
            options: ["der Zweier", "der Dreier", "der Zehner"]
            answer: "der Zweier"

  - n: 2
    title: { de: "Zahlen ins Zweiersystem", en: "Writing numbers in binary" }
    goal:
      de: "Schreib Zahlen bis 31 im Zweiersystem und vergiss die Nullen nicht. 13 ist 8 + 4 + 1."
      en: "Write numbers up to 31 in binary and don't forget the zeros. 13 is 8 + 4 + 1."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Dualzahl: 1011 = _"
            say: "Die Dualzahl eins, null, eins, eins. Welche Zahl ist das?"
            answer: "11"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Stellenwerte hat das Zweiersystem?"
            say: "Welche Stellenwerte hat das Zweiersystem?"
            options: ["8, 4, 2, 1", "1000, 100, 10, 1", "4, 3, 2, 1"]
            answer: "8, 4, 2, 1"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du? Welche Stelle kommt im Zweiersystem links vom Achter?"
            say: "Einser, Zweier, Vierer, Achter. Was glaubst du: Welche Stelle kommt im Zweiersystem links vom Achter?"
          - text: "Schreib 13 im Zweiersystem.\nStellen: 16, 8, 4, 2, 1\n13 = 8 + 4 + 1"
            say: "Links vom Achter kommt der Sechzehner, denn das Doppelte von acht ist sechzehn. So schreibst du dreizehn im Zweiersystem. Der Sechzehner passt nicht in dreizehn. Nimm den größten Stellenwert, der in dreizehn passt: die Acht. Es bleiben fünf. Dann passt die Vier, es bleibt eins. Die Zwei passt nicht mehr, die Eins schon. Dreizehn ist also acht plus vier plus eins."
          - text: "8er: 1\n4er: 1\n2er: 0\n1er: 1\n13 = 1101 im Zweiersystem"
            say: "Jetzt schreibst du für jede Stelle eine Eins, wenn du sie brauchst, und eine Null, wenn nicht. Achter ja, Vierer ja, Zweier nein, Einser ja. Dreizehn ist im Zweiersystem eins, eins, null, eins."
          - text: "Prüfe rückwärts: 1101 = 8 + 4 + 1 = 13\nVergiss die Null nicht:\n5 = 4 + 1 = 101, nicht 11"
            say: "Prüfe immer rückwärts: Rechne die Dualzahl wieder aus. Und vergiss die Nullen nicht. Fünf ist vier plus eins. Den Zweier brauchst du nicht, also steht dort eine Null: eins, null, eins. Ohne die Null wäre es eins, eins, und das ist drei."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Schreib 6 im Zweiersystem."
                say: "Schreib sechs im Zweiersystem."
                options: ["110", "11", "1100"]
                answer: "110"
                option_audio: false
                feedback:
                  "1100": "1100 ist 8 + 4 = 12. Für 6 brauchst du den Vierer und den Zweier."
                hints:
                  - "Welcher größte Stellenwert passt in 6?"
                  - "Die 4 passt, es bleiben 2. Dann passt die 2."
                  - "4 + 2 = 6, also 110."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Schreib 5 im Zweiersystem."
                say: "Schreib fünf im Zweiersystem."
                options: ["101", "11", "5"]
                answer: "101"
                option_audio: false
                feedback:
                  "11": "Du hast die Null für den Zweier vergessen. 11 ist 2 + 1 = 3."
                  "5": "Im Zweiersystem gibt es nur die Ziffern 0 und 1."
                hints:
                  - "Welcher größte Stellenwert passt in 5?"
                  - "Die 4 passt, es bleibt 1. Den Zweier brauchst du nicht."
                  - "Vierer 1, Zweier 0, Einser 1: 101."
              - id: l2-f3
                type: text_input
                text: "9 = _ im Zweiersystem"
                say: "Schreib neun im Zweiersystem."
                answer: "1001"
                hints:
                  - "Welcher größte Stellenwert passt in 9?"
                  - "Die 8 passt, es bleibt 1. Vierer und Zweier brauchst du nicht, dort steht eine 0."
                  - "9 = 8 + 1, also 1001."
              - id: l2-f4
                type: fill_in_blank
                text: "Schreib 12 im Zweiersystem.\n12 = 8 + 4"
                say: "Schreib zwölf im Zweiersystem. Zwölf ist acht plus vier."
                frame: "8er: _   4er: _   2er: _   1er: _"
                options: ["0", "1"]
                answer: ["1", "1", "0", "0"]
                hints:
                  - "Eine 1 für jede Stelle, die du brauchst, eine 0 für die anderen."
                  - "Du brauchst den Achter und den Vierer."
                  - "1, 1, 0, 0."
              - id: l2-f5
                type: text_input
                text: "16 = _ im Zweiersystem"
                say: "Schreib sechzehn im Zweiersystem."
                answer: "10000"
                hints:
                  - "16 ist selbst ein Stellenwert: das Doppelte von 8."
                  - "Links vom Achter steht der Sechzehner. Nur er bekommt eine 1."
                  - "Eine 1 und vier Nullen: 10000."
                difficulty: stretch

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "7 = _ im Zweiersystem"
                say: "Schreib sieben im Zweiersystem."
                answer: "111"
                hints: ["7 = 4 + 2 + 1."]
              - id: l2-s2
                type: multiple_choice
                text: "Schreib 10 im Zweiersystem."
                say: "Schreib zehn im Zweiersystem."
                options: ["1010", "10", "1100"]
                answer: "1010"
                option_audio: false
                feedback:
                  "10": "Die Dualzahl 10 ist 2. Für 10 brauchst du den Achter und den Zweier."
                hints: ["10 = 8 + 2."]
              - id: l2-s3
                type: true_false
                text: "11 = 1011 im Zweiersystem"
                say: "Stimmt das? Elf ist im Zweiersystem eins, null, eins, eins."
                answer: true
                hints: ["Prüfe rückwärts: Rechne 1011 mit den Stellenwerten 8, 4, 2, 1 aus."]
              - id: l2-s4
                type: fill_in_blank
                text: "Schreib 14 im Zweiersystem."
                say: "Schreib vierzehn im Zweiersystem."
                frame: "8er: _   4er: _   2er: _   1er: _"
                options: ["0", "1"]
                answer: ["1", "1", "1", "0"]
                hints: ["14 = 8 + 4 + 2."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Zahl braucht im Zweiersystem 5 Stellen?"
                say: "Welche Zahl braucht im Zweiersystem fünf Stellen?"
                options: ["17", "15", "9"]
                answer: "17"
                hints: ["Mit 4 Stellen schaffst du höchstens 8 + 4 + 2 + 1 = 15."]
                difficulty: stretch

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: text_input
                text: "3 = _ im Zweiersystem"
                say: "Schreib drei im Zweiersystem."
                answer: "11"
              - id: l2-n2
                type: multiple_choice
                text: "Mia will mit 4 Lämpchen die Zahl 5 zeigen. Die Lämpchen stehen für 8, 4, 2 und 1. Welche sind an?"
                say: "Mia will mit vier Lämpchen die Zahl fünf zeigen. Die Lämpchen stehen für acht, vier, zwei und eins. Welche Lämpchen sind an?"
                options: ["aus, an, aus, an", "aus, aus, an, an", "an, aus, an, aus"]
                answer: "aus, an, aus, an"
              - id: l2-n3
                type: text_input
                text: "15 = _ im Zweiersystem"
                say: "Schreib fünfzehn im Zweiersystem."
                answer: "1111"
              - id: l2-n4
                type: text_input
                text: "Ein Computer speichert die Zahl 20. Wie sieht sie im Zweiersystem aus?"
                say: "Ein Computer speichert die Zahl zwanzig. Wie sieht sie im Zweiersystem aus?"
                answer: "10100"
                difficulty: stretch
              - id: l2-n5
                type: true_false
                text: "Lea schreibt 8 im Zweiersystem als 111."
                say: "Lea schreibt acht im Zweiersystem als eins, eins, eins. Stimmt das?"
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: text_input
            text: "Dualzahl: 1111 = _"
            say: "Die Dualzahl eins, eins, eins, eins. Welche Zahl ist das?"
            answer: "15"
          - id: l2-c2
            part: write
            type: multiple_choice
            text: "Schreib 8 im Zweiersystem."
            say: "Schreib acht im Zweiersystem."
            options: ["1000", "1", "111"]
            answer: "1000"
            option_audio: false
          - id: l2-c3
            part: write
            type: text_input
            text: "11 = _ im Zweiersystem"
            say: "Schreib elf im Zweiersystem."
            answer: "1011"
          - id: l2-c4
            part: read
            type: true_false
            text: "Die Dualzahl 1000 ist größer als die Dualzahl 111."
            say: "Stimmt das? Die Dualzahl eins, null, null, null ist größer als die Dualzahl eins, eins, eins."
            answer: true
          - id: l2-c5
            part: read
            type: multiple_choice
            text: "4 Lämpchen für 8, 4, 2 und 1: an, aus, an, aus. Welche Zahl ist das?"
            say: "Vier Lämpchen für acht, vier, zwei und eins: an, aus, an, aus. Welche Zahl ist das?"
            options: ["10", "5", "1010"]
            answer: "10"
            option_audio: false
          - id: l2-c6
            part: read
            type: true_false
            text: "Die Dualzahl 1110 ist größer als 12."
            say: "Stimmt das? Die Dualzahl eins, eins, eins, null ist größer als zwölf."
            answer: true
          - id: l2-c7
            part: read
            type: multiple_choice
