            options: ["9000", "8000", "10 000"]
            answer: "9000"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "2300 + 4600 = _"
            say: "Zweitausenddreihundert plus viertausendsechshundert."
            answer: "6900"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8950 − 3100 ≈ 9000 − 3000 = 6000"
            say: "Achttausendneunhundertfünfzig minus dreitausendeinhundert. Auch beim Minusrechnen überschlägst du zuerst: neuntausend minus dreitausend ist sechstausend."
          - text: "8950 − 3000 = 5950 | 5950 − 100 = 5850"
            say: "Dann schrittweise: Erst die Tausender weg, dann die Hunderter. Fünftausendachthundertfünfzig liegt nah bei sechstausend. Das passt zum Überschlag."
          - text: "Ben: 8400 − 3000 = 5400 | 8400 − 200 = 8200 | Überschlag: 8000 − 3000 = 5000 ✗"
            say: "Ben rechnet achttausendvierhundert minus dreitausendzweihundert und hat achttausendzweihundert heraus. Der Überschlag ist fünftausend. Achttausendzweihundert ist weit weg davon, das passt nicht. Ben hat im zweiten Schritt wieder mit achttausendvierhundert angefangen. Richtig ist fünftausendzweihundert."

      - activity: practise
