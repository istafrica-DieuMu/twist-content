            say: "Ben hat dreitausendfünfhundert plus viertausendzweihundertvierzig schrittweise gerechnet. Gibt es einen Fehler?"
            options: ["Es ist alles richtig.", "Der erste Schritt ist falsch.", "Der letzte Schritt ist falsch."]
            answer: "Der letzte Schritt ist falsch."
          - id: l1-c6
            type: multiple_choice
            text: "Überschlag: 1700 + 4800 ≈ ?"
