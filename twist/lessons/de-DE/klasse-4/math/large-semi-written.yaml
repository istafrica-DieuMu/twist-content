                answer: ["7600", "7800", "7870"]
                hints: ["Jedes Ergebnis ist der Anfang vom nächsten Schritt."]
              - id: l1-s3
                type: multiple_choice
                text: "Tom rechnet 5400 + 2360 schrittweise. In welchem Schritt ist der Fehler?"
                say: "Tom hat fünftausendvierhundert plus zweitausenddreihundertsechzig schrittweise gerechnet. In welchem Schritt ist der Fehler?"
                options: ["5400 + 2000 = 7400", "7400 + 300 = 7700", "7400 + 60 = 7460"]
                answer: "7400 + 60 = 7460"
                hints: ["Prüf bei jedem Schritt die erste Zahl."]
              - id: l1-s4
                type: text_input
                text: "2450 + 3300 = _"
                say: "Zweitausendvierhundertfünfzig plus dreitausenddreihundert. Rechne schrittweise."
                answer: "5750"
                hints: ["Erst die Tausender, dann die Hunderter."]
              - id: l1-s5
                type: true_false
                text: "Passt das zum Überschlag? 3900 + 4200 = 4100"
                say: "Dreitausendneunhundert plus viertausendzweihundert ist viertausendeinhundert. Passt das zum Überschlag?"
                answer: false
                hints: ["Wie groß ist der Überschlag?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Überschlag: 7200 + 1900 ≈ ?"
                say: "Mach den Überschlag für siebentausendzweihundert plus tausendneunhundert. Runde auf Tausender."
                options: ["9000", "8000", "11 000"]
                answer: "9000"
              - id: l1-n2
                type: fill_in_blank
                text: "Rechne schrittweise: 6300 + 2540"
                say: "Sechstausenddreihundert plus zweitausendfünfhundertvierzig. Rechne schrittweise."
                frame: "6300 + 2000 = _ | 8300 + 500 = _ | 8800 + 40 = _"
                options: ["8300", "8800", "8840", "8340"]
                answer: ["8300", "8800", "8840"]
              - id: l1-n3
                type: multiple_choice
                text: "Lea rechnet 1800 + 5130 schrittweise:\n1800 + 5000 = 6800\n6800 + 100 = 6900\n6900 + 30 = 6930\nGibt es einen Fehler?"
                say: "Lea hat tausendachthundert plus fünftausendeinhundertdreißig schrittweise gerechnet. Gibt es einen Fehler?"
                options: ["Es ist alles richtig.", "Der erste Schritt ist falsch.", "Der letzte Schritt ist falsch."]
                answer: "Es ist alles richtig."
              - id: l1-n4
                type: text_input
                text: "5600 + 3350 = _"
                say: "Fünftausendsechshundert plus dreitausenddreihundertfünfzig."
                answer: "8950"
              - id: l1-n5
                type: true_false
                text: "Passt das zum Überschlag? 4800 + 3100 = 7900"
                say: "Viertausendachthundert plus dreitausendeinhundert ist siebentausendneunhundert. Passt das zum Überschlag?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
