# Lesson set: Mathe, Klasse 4. Hand-authored draft.
id: de-DE.math.large-semi-written
skill: math.add-sub-to-1000.large-semi-written
curriculum: de-DE
language: de
title:
  de: Große Zahlen halbschriftlich
  en: Informal written methods with large numbers
summary: >
  Adding and subtracting four-digit numbers halbschriftlich, with an
  Überschlag first. Lesson 1 rounds both numbers to thousands for the
  Überschlag and adds schrittweise (4600 + 2350: first the thousands,
  then the hundreds, then the tens); lesson 2 subtracts schrittweise,
  compares the result with the Überschlag to catch mistakes, and ends
  with the skill check. Four-digit numbers are written without a space
  (4600), on screen and in typed answers.
metadata:
  year: klasse-4
  topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-1000.large-mental, math.add-sub-to-1000.estimate]
  also_practises: [math.add-sub-to-1000.large-mental]
  vocabulary: { de: [halbschriftlich, schrittweise, Überschlag, ungefähr, runden] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: estimate, what: { de: das Ergebnis vorher überschlagen, en: estimating the answer first } }
    - { id: add, what: { de: große Zahlen schrittweise addieren, en: adding large numbers in steps } }
    - { id: subtract, what: { de: große Zahlen schrittweise subtrahieren, en: subtracting large numbers in steps } }
    - { id: check, what: { de: das Ergebnis mit dem Überschlag prüfen, en: checking the answer against the estimate } }
  misconceptions:
    - id: lost-step
      what: Starts the next step from the first number instead of the last result
      addressed: Learn writes each result into the next step; a "Wo ist der Fehler?" task in the full and some stages of lesson 1 (with feedback in l1-f3) and a "Gibt es einen Fehler?" task in its none stage
    - id: skip-estimate
      what: Does not compare the result with the Überschlag, so a big mistake (a lost step, plus instead of minus) goes unnoticed
      addressed: lesson 2 Learn catches a lost step with the Überschlag; a "Passt das zum Überschlag?" task in every stage of both lessons, each wrong result far from its Überschlag
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Überschlagen und schrittweise addieren, en: "Estimate, then add in steps" }
    goal:
      de: "Überschlag zuerst und addier dann Schritt für Schritt, erst die Tausender, dann die Hunderter, dann die Zehner."
      en: "Estimate first, then add step by step, starting with the thousands, then the hundreds, then the tens."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6000 + 7000 = _"
            say: "Sechstausend plus siebentausend."
            answer: "13000"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Runde 4380 auf Tausender."
            say: "Runde viertausenddreihundertachtzig auf Tausender."
            options: ["4000", "5000", "4400"]
            answer: "4000"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4600 + 2350 ≈ 5000 + 2000 = 7000"
            say: "Bevor du rechnest, überschlägst du: Runde beide Zahlen auf Tausender. Viertausendsechshundert ist ungefähr fünftausend, zweitausenddreihundertfünfzig ist ungefähr zweitausend. Fünftausend plus zweitausend ist siebentausend. Das Ergebnis liegt also ungefähr bei siebentausend."
          - text: "4600 + 2000 = 6600 | 6600 + 300 = 6900 | 6900 + 50 = 6950"
            say: "Jetzt schrittweise: Erst die Tausender dazu, dann die Hunderter, dann die Zehner. Jedes Ergebnis ist der Anfang vom nächsten Schritt."
          - text: "6950 ≈ 7000 ✓"
            say: "Sechstausendneunhundertfünfzig liegt nah bei siebentausend. Das Ergebnis passt zum Überschlag."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Überschlag: 3800 + 5100 ≈ ?"
                say: "Mach den Überschlag für dreitausendachthundert plus fünftausendeinhundert. Runde auf Tausender."
                options: ["9000", "8000", "90 000"]
                answer: "9000"
                hints:
                  - "Runde 3800 und 5100 auf Tausender."
                  - "4000 + 5000."
                  - "9000."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Rechne schrittweise: 5200 + 3450"
                say: "Fünftausendzweihundert plus dreitausendvierhundertfünfzig. Rechne schrittweise."
                frame: "5200 + 3000 = _ | 8200 + 400 = _ | 8600 + 50 = _"
                options: ["8200", "8600", "8650", "8250"]
                answer: ["8200", "8600", "8650"]
                hints:
                  - "Erst die Tausender, dann die Hunderter, dann die Zehner."
                  - "5200 + 3000 = 8200."
                  - "8200, 8600, 8650."
              - id: l1-f3
                type: multiple_choice
                text: "Mia rechnet 2700 + 4620 schrittweise. In welchem Schritt ist der Fehler?"
                say: "Mia hat zweitausendsiebenhundert plus viertausendsechshundertzwanzig schrittweise gerechnet. In welchem Schritt ist der Fehler?"
                options: ["2700 + 4000 = 6700", "2700 + 600 = 3300", "3300 + 20 = 3320"]
                answer: "2700 + 600 = 3300"
                feedback:
                  "3300 + 20 = 3320": "Dieser Schritt ist richtig gerechnet. Der Fehler passiert vorher: Der zweite Schritt fängt wieder mit 2700 an."
                hints:
                  - "Mit welcher Zahl fängt jeder Schritt an?"
                  - "Der zweite Schritt muss mit 6700 anfangen."
                  - "Richtig ist 6700 + 600 = 7300."
              - id: l1-f4
                type: text_input
                text: "4300 + 2500 = _"
                say: "Viertausenddreihundert plus zweitausendfünfhundert. Rechne schrittweise."
                answer: "6800"
                hints:
                  - "Erst 4300 + 2000."
                  - "Dann noch 500 dazu."
                  - "6800."
              - id: l1-f5
                type: true_false
                text: "Passt das zum Überschlag? 6100 + 2800 = 8900"
                say: "Sechstausendeinhundert plus zweitausendachthundert ist achttausendneunhundert. Passt das zum Überschlag?"
                answer: true
                hints:
                  - "Überschlag: 6000 + 3000."
                  - "Das sind 9000. Liegt 8900 nah daran?"
                  - "Ja, das passt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Überschlag: 6900 + 2200 ≈ ?"
                say: "Mach den Überschlag für sechstausendneunhundert plus zweitausendzweihundert. Runde auf Tausender."
                options: ["8000", "9000", "10 000"]
                answer: "9000"
                hints: ["Runde beide Zahlen auf Tausender."]
              - id: l1-s2
