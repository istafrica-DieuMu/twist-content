# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.foreign-words
skill: lit-de.vocabulary.foreign-words
curriculum: de-DE
language: de
title:
  de: Fremdwörter
  en: Borrowed words
summary: >
  Words German took from other languages. Lesson 1 spots Fremdwörter in a
  sentence, sorts them by the language they come from (Englisch,
  Französisch, Italienisch), learns that they are often not spoken as they
  are written and so must be learnt as Merkwörter, and meets Lehnwörter
  that came so long ago that they look German (Fenster, Mauer). Lesson 2
  finds the meaning of a Fremdwort from the sentence, swaps in a German
  word, reads the Herkunftsangabe in a dictionary entry, and ends with the
  skill check.
metadata:
  year: klasse-4
  topic: { de: Sprache untersuchen, en: Exploring language }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.spelling.ph-v-foreign]
  also_practises: [lit-de.spelling.ph-v-foreign]
  vocabulary: { de: [Fremdwort, Lehnwort, Herkunft, englisch, französisch, italienisch, griechisch, lateinisch, türkisch, Wörterbuch, Merkwort] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: spot, what: { de: Fremdwörter erkennen, en: spotting borrowed words } }
    - { id: origin, what: { de: "herausfinden, aus welcher Sprache ein Fremdwort kommt", en: finding out which language a borrowed word comes from } }
    - { id: meaning, what: { de: "herausfinden, was ein Fremdwort bedeutet", en: finding out what a borrowed word means } }
    - { id: spelling, what: { de: Fremdwörter als Merkwörter richtig schreiben, en: spelling borrowed words as words to learn } }
  misconceptions:
    - id: all-from-english
      what: Thinks every Fremdwort comes from English
      addressed: "lesson 1 Learn names Italian, French and English words; l1-f2, l1-s2, l1-n2 and l2-c2 sort by language; l1-f4 asks directly; l1-n4 and l2-f2 take a Turkish word, l2-n5 a Greek one"
    - id: write-as-heard
      what: Writes a Fremdwort as it sounds (Kompjuter, Restorang)
      addressed: "lesson 1 Learn shows that the spoken and written forms differ; l1-f3 (with feedback), l1-s3, l1-n3, l1-c3 and l2-c3 choose the right spelling"
    - id: guess-from-sound
      what: Guesses a Fremdwort's meaning from a word it sounds like instead of from the sentence (Trainer as Zug)
      addressed: "lesson 2 Learn uses the sentence and the Ersatzprobe; l2-f3 gives feedback on the sound-alike; l2-s3, l2-n3 and l2-c4 take the meaning from the sentence"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Woher kommen die Wörter?", en: "Where do the words come from?" }
    goal:
      de: "Entdeck Wörter aus anderen Sprachen, wie Pizza aus dem Italienischen, und merk dir, wie man sie schreibt."
      en: "Discover words from other languages, like pizza from Italian, and remember how they are spelt."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            options: ["Vulkan", "Wulkan", "Fulkan"]
            answer: "Vulkan"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Welche Buchstaben fehlen?"
            say: "Ergänze das Wort Alphabet."
            frame: "Al_abet"
            options: ["ph", "f", "v"]
            answer: ["ph"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Pizza, Restaurant, Computer"
            say: "Pizza, Restaurant, Computer: Diese Wörter hörst du bestimmt oft. Was glaubst du: Sind das eigentlich deutsche Wörter?"
            show: { object: pizza }
          - text: "Pizza: aus dem Italienischen\nRestaurant: aus dem Französischen\nComputer: aus dem Englischen"
            say: "Nicht ganz! Sie sind von weit her zu uns gekommen. Viele Wörter, die wir jeden Tag benutzen, kommen aus anderen Sprachen. Pizza kommt aus dem Italienischen, Restaurant aus dem Französischen und Computer aus dem Englischen. Solche Wörter heißen Fremdwörter."
          - text: "Computer\nRestaurant\nCroissant"
            say: "Viele Fremdwörter spricht man anders, als man sie schreibt. Computer schreibt man mit C und u, Restaurant mit au und t am Ende. Darum sind Fremdwörter Merkwörter. Du erkennst sie oft an ungewohnten Buchstaben wie ou, au, oi oder c am Anfang."
          - text: "Fenster kommt vom lateinischen Wort fenestra.\nMauer kommt vom lateinischen Wort murus."
            say: "Manche Wörter sind schon vor sehr langer Zeit zu uns gekommen, zum Beispiel aus dem Lateinischen. Sie klingen heute ganz deutsch, wie Fenster und Mauer. Solche Wörter heißen Lehnwörter."
          - text: "Wusstest du? Handy klingt englisch. Aber in England sagt niemand Handy zu seinem Telefon. Dort heißt es „mobile phone“."
            say: "Wusstest du? Das Wort Handy klingt wie ein englisches Wort. Aber wenn du in England nach einem Handy fragst, versteht dich niemand. Dort heißt das Telefon mobile phone. Das Wort Handy für das Telefon haben sich die Deutschen selbst ausgedacht!"
            show: { object: mobile-phone }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Wort ist ein Fremdwort?"
                options: ["Restaurant", "Gasthaus", "Esszimmer"]
                answer: "Restaurant"
                hints:
                  - "Welches Wort klingt anders, als es geschrieben wird?"
                  - "Achte auf das au und das t am Ende."
                  - "Restaurant kommt aus dem Französischen."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Aus welcher Sprache kommt das Wort?"
                say: "Sortiere: Kommt das Wort aus dem Englischen, dem Französischen oder dem Italienischen?"
                bins:
                  - { id: en, show: { text: "Englisch" }, say: "Englisch" }
                  - { id: fr, show: { text: "Französisch" }, say: "Französisch" }
                  - { id: it, show: { text: "Italienisch" }, say: "Italienisch" }
                options:
                  - { text: "Computer", bin: en }
                  - { text: "Team", bin: en }
                  - { text: "Croissant", bin: fr }
                  - { text: "Portemonnaie", bin: fr }
                  - { text: "Spaghetti", bin: it }
                  - { text: "Pizza", bin: it }
                hints:
                  - "Denk an das Land, aus dem das Essen oder die Sache kommt."
                  - "Pizza und Spaghetti isst man in Italien gern. Croissants in Frankreich."
                  - "Computer und Team: Englisch. Croissant und Portemonnaie: Französisch. Pizza und Spaghetti: Italienisch."
              - id: l1-f3
                type: multiple_choice
                text: "Ein Rechner heißt auch so. Wie schreibt man das Wort richtig?"
                say: "Ein Rechner heißt auch Computer. Wie schreibt man das Wort Computer richtig?"
                options: ["Computer", "Kompjuter", "Computa"]
                answer: "Computer"
                option_audio: false
                feedback:
                  "Kompjuter": "So klingt das Wort. Fremdwörter schreibt man aber oft anders, als man sie spricht. Computer ist ein Merkwort."
                hints:
                  - "Schreibt man ein Fremdwort so, wie man es hört?"
                  - "Das Wort kommt aus dem Englischen und fängt mit C an."
                  - "Computer."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Alle Fremdwörter im Deutschen kommen aus dem Englischen."
                answer: false
                hints:
                  - "Woher kommt das Wort Pizza?"
                  - "Und woher kommt Croissant?"
                  - "Nein, Fremdwörter kommen aus vielen Sprachen."
              - id: l1-f5
                type: multiple_choice
                text: "Woran erkennst du ein Fremdwort oft?"
                options: ["Es wird anders gesprochen, als man es schreibt.", "Es ist immer sehr lang.", "Es hat immer einen Umlaut."]
                answer: "Es wird anders gesprochen, als man es schreibt."
                hints:
                  - "Denk an Computer und Restaurant."
                  - "Klingen diese Wörter so, wie sie geschrieben werden?"
                  - "Es wird anders gesprochen, als man es schreibt."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf die Fremdwörter."
                say: "Lies den Satz. Tippe auf die zwei Fremdwörter."
                show: { drawn: letter-card, text: "Nach dem Training essen wir Spaghetti im Garten." }
                spans: ["Training", "Spaghetti"]
                hints: ["Welche Wörter spricht man anders, als man sie schreibt?"]
              - id: l1-s2
                type: sorting
                text: "Aus welcher Sprache kommt das Wort?"
                say: "Sortiere: Kommt das Wort aus dem Englischen, dem Französischen oder dem Italienischen?"
                bins:
                  - { id: en, show: { text: "Englisch" }, say: "Englisch" }
                  - { id: fr, show: { text: "Französisch" }, say: "Französisch" }
                  - { id: it, show: { text: "Italienisch" }, say: "Italienisch" }
                options:
                  - { text: "Baby", bin: en }
                  - { text: "Hobby", bin: en }
                  - { text: "Garage", bin: fr }
                  - { text: "Bonbon", bin: fr }
                  - { text: "Pasta", bin: it }
                  - { text: "Konfetti", bin: it }
                hints: ["Hobby und Baby enden mit y wie viele englische Wörter."]
              - id: l1-s3
                type: multiple_choice
                text: "Eine Gaststätte heißt auch so. Wie schreibt man das Wort richtig?"
                say: "Eine Gaststätte heißt auch Restaurant. Wie schreibt man das Wort Restaurant richtig?"
                options: ["Restaurant", "Restorang", "Restaurang"]
                answer: "Restaurant"
                option_audio: false
                hints: ["Am Ende hörst du kein t, aber du schreibst es."]
              - id: l1-s4
                type: true_false
                text: "Das Wort Fenster kommt aus dem Lateinischen. Ist es also aus einer anderen Sprache zu uns gekommen?"
                answer: true
                hints: ["Denk an das lateinische Wort fenestra."]
              - id: l1-s5
                type: multiple_choice
                text: "Aus welcher Sprache kommt Pizza?"
                options: ["aus dem Italienischen", "aus dem Englischen", "aus dem Französischen"]
                answer: "aus dem Italienischen"
                hints: ["Wo wurde die Pizza erfunden?"]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf die Fremdwörter."
                say: "Lies den Satz. Tippe auf die zwei Fremdwörter."
                show: { drawn: letter-card, text: "Oma schickt uns ein Foto vom Hotel am Strand." }
                spans: ["Foto", "Hotel"]
              - id: l1-n2
                type: sorting
                text: "Aus welcher Sprache kommt das Wort?"
                say: "Sortiere: Kommt das Wort aus dem Englischen, dem Französischen oder dem Italienischen?"
                bins:
                  - { id: en, show: { text: "Englisch" }, say: "Englisch" }
                  - { id: fr, show: { text: "Französisch" }, say: "Französisch" }
                  - { id: it, show: { text: "Italienisch" }, say: "Italienisch" }
                options:
                  - { text: "Skateboard", bin: en }
                  - { text: "Laptop", bin: en }
                  - { text: "Parfüm", bin: fr }
                  - { text: "Etage", bin: fr }
                  - { text: "Lasagne", bin: it }
                  - { text: "Tiramisu", bin: it }
              - id: l1-n3
                type: multiple_choice
                text: "Ein Hörnchen aus Blätterteig heißt auch so. Wie schreibt man das Wort richtig?"
                say: "Ein Hörnchen aus Blätterteig heißt auch Croissant. Wie schreibt man das Wort Croissant richtig?"
                options: ["Croissant", "Kroassong", "Croasant"]
                answer: "Croissant"
                feedback:
                  "Kroassong": "Kroassong? So klingt es, aber so schreibt es kein Bäcker in Paris! Croissant ist ein Merkwort aus dem Französischen."
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Das Wort Joghurt kommt aus dem Türkischen. Ist es ein Fremdwort?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Aus welcher Sprache kommt das Wort Computer?"
                options: ["aus dem Englischen", "aus dem Italienischen", "aus dem Türkischen"]
                answer: "aus dem Englischen"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort ist ein Fremdwort?"
            options: ["Garage", "Haus", "Tür"]
            answer: "Garage"
          - id: l1-c2
            type: multiple_choice
            text: "Aus welcher Sprache kommt Spaghetti?"
            options: ["aus dem Italienischen", "aus dem Englischen", "aus dem Französischen"]
            answer: "aus dem Italienischen"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Das Wort Bonbon kommt aus dem Italienischen."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Ein ganz kleines Kind heißt auch so. Wie schreibt man das Wort richtig?"
            say: "Ein ganz kleines Kind heißt auch Baby. Wie schreibt man das Wort Baby richtig?"
            options: ["Baby", "Bebi", "Bäbi"]
            answer: "Baby"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Aus welcher Sprache kommt das Wort Hobby?"
            options: ["aus dem Englischen", "aus dem Französischen", "aus dem Italienischen"]
            answer: "aus dem Englischen"
          - id: l1-c6
            type: multiple_choice
            text: "Welches Wort kommt aus dem Französischen?"
            options: ["Etage", "Pasta", "Baby"]
            answer: "Etage"

  - n: 2
    title: { de: "Was bedeutet das Fremdwort?", en: "What does the borrowed word mean?" }
    goal:
      de: "Finde heraus, was ein Fremdwort bedeutet, und setz ein deutsches Wort ein. Statt Ticket sagst du Fahrkarte."
      en: "Find out what a borrowed word means and put a German word in its place. Instead of Ticket you say Fahrkarte."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Aus welcher Sprache kommt Croissant?"
            options: ["aus dem Französischen", "aus dem Englischen", "aus dem Italienischen"]
            answer: "aus dem Französischen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Spricht man Restaurant so, wie man es schreibt?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "„Hast du dein Ticket dabei?“"
            say: "Ben steigt in den Bus. Der Busfahrer fragt: Hast du dein Ticket dabei? Was glaubst du: Was will der Busfahrer sehen?"
            show: { object: bus }
          - text: "Team = Mannschaft\nTicket = Fahrkarte\nPortemonnaie = Geldbeutel"
            say: "Ben zeigt seine Fahrkarte! Für viele Fremdwörter gibt es auch ein deutsches Wort, das fast dasselbe bedeutet. Statt Team kannst du Mannschaft sagen, statt Ticket Fahrkarte."
          - text: "„Unser Team hat das Spiel gewonnen.“\n„Unsere Mannschaft hat das Spiel gewonnen.“"
            say: "Kennst du ein Fremdwort nicht, lies den ganzen Satz. Er verrät dir oft, was das Wort bedeutet. Dann setzt du ein deutsches Wort ein. Passt der Satz noch, hast du die Bedeutung gefunden. Das ist die Ersatzprobe."
          - text: "Res|tau|rant, das (franz.): Gaststätte\n\nengl. = englisch\nfranz. = französisch\nital. = italienisch\ngriech. = griechisch\nlat. = lateinisch\ntürk. = türkisch"
            say: "Im Wörterbuch steht bei vielen Fremdwörtern in Klammern, woher sie kommen. Franz. heißt französisch, engl. englisch, ital. italienisch. Dahinter steht oft, was das Wort bedeutet."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f2
                type: multiple_choice
                text: "Im Wörterbuch steht:\nJo|ghurt, der oder das (türk.): saure Milch, die dick geworden ist\n\nAus welcher Sprache kommt Joghurt?"
                say: "Lies den Eintrag im Wörterbuch. Aus welcher Sprache kommt Joghurt?"
                options: ["aus dem Türkischen", "aus dem Englischen", "aus dem Italienischen"]
                answer: "aus dem Türkischen"
                hints:
                  - "Schau in die Klammer."
                  - "Die Abkürzung türk. steht für eine Sprache."
                  - "Die Abkürzung türk. heißt türkisch."
              - id: l2-f3
                type: multiple_choice
                text: "„Der Trainer pfeift, und das Fußballtraining beginnt.“\n\nWas ist ein Trainer?"
                say: "Der Trainer pfeift, und das Fußballtraining beginnt. Was ist ein Trainer?"
                options: ["jemand, der beim Sport anleitet", "ein Zug", "ein Turnschuh"]
                answer: "jemand, der beim Sport anleitet"
                feedback:
                  "ein Zug": "Train heißt auf Englisch Zug, das klingt ähnlich. Aber lies den Satz: Wer pfeift beim Training?"
                hints:
                  - "Lies den ganzen Satz. Was macht der Trainer?"
                  - "Er pfeift, und das Training beginnt."
                  - "Ein Trainer leitet beim Sport an."
              - id: l2-f1
                type: matching
                text: "Welches deutsche Wort passt?"
                say: "Verbinde jedes Fremdwort mit einem deutschen Wort, das dasselbe bedeutet."
                pairs:
                  - { left: { text: "Team" }, right: { text: "Mannschaft" } }
                  - { left: { text: "Ticket" }, right: { text: "Fahrkarte" } }
                  - { left: { text: "Portemonnaie" }, right: { text: "Geldbeutel" } }
                  - { left: { text: "Hobby" }, right: { text: "Freizeitbeschäftigung" } }
                hints:
                  - "Stell dir jedes Wort in einem Satz vor."
                  - "Was braucht man im Bus? Worin steckt das Geld?"
                  - "Team: Mannschaft. Ticket: Fahrkarte. Portemonnaie: Geldbeutel. Hobby: Freizeitbeschäftigung."
                difficulty: easy
              - id: l2-f4
                type: multiple_choice
                text: "„Lukas kauft am Automaten ein Ticket für den Bus.“\n\nWelches deutsche Wort kannst du statt Ticket einsetzen?"
                say: "Lukas kauft am Automaten ein Ticket für den Bus. Welches deutsche Wort kannst du statt Ticket einsetzen?"
                options: ["Fahrkarte", "Fahrrad", "Fahrer"]
                answer: "Fahrkarte"
                hints:
                  - "Mach die Ersatzprobe: Setz jedes Wort in den Satz ein."
                  - "Was kauft man am Automaten für den Bus?"
                  - "Eine Fahrkarte."
              - id: l2-f5
                type: multiple_choice
                text: "Im Wörterbuch steht hinter Spaghetti „(ital.)“. Was bedeutet das?"
                options: ["Das Wort kommt aus dem Italienischen.", "Das Wort ist besonders lang.", "Das Wort ist ein Verb."]
                answer: "Das Wort kommt aus dem Italienischen."
                hints:
                  - "Was steht in der Klammer hinter einem Fremdwort?"
                  - "Die Klammer zeigt die Herkunft."
                  - "Die Abkürzung ital. heißt italienisch."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Welches deutsche Wort passt?"
                say: "Verbinde jedes Fremdwort mit einem deutschen Wort, das dasselbe bedeutet."
                pairs:
                  - { left: { text: "Shop" }, right: { text: "Laden" } }
                  - { left: { text: "Baby" }, right: { text: "Säugling" } }
                  - { left: { text: "Chance" }, right: { text: "Gelegenheit" } }
                  - { left: { text: "Computer" }, right: { text: "Rechner" } }
                hints: ["Wo kauft man ein? Wer ist ganz klein?"]
              - id: l2-s2
                type: multiple_choice
                text: "Im Wörterbuch steht:\nGa|ra|ge, die (franz.): Raum, in dem ein Auto steht\n\nWas bedeutet Garage?"
                say: "Lies den Eintrag im Wörterbuch. Was bedeutet Garage?"
                options: ["ein Raum, in dem ein Auto steht", "ein großer Garten", "eine Tankstelle"]
                answer: "ein Raum, in dem ein Auto steht"
                hints: ["Die Bedeutung steht hinter dem Doppelpunkt."]
              - id: l2-s3
                type: multiple_choice
                text: "„Im Schloss hängt ein Porträt der Königin. Man sieht ihr Gesicht und ihre Krone.“\n\nWas ist ein Porträt?"
                say: "Im Schloss hängt ein Porträt der Königin. Man sieht ihr Gesicht und ihre Krone. Was ist ein Porträt?"
                options: ["ein Bild von einem Menschen", "ein großes Tor", "ein Thron"]
                answer: "ein Bild von einem Menschen"
                hints: ["Was sieht man auf dem Porträt?"]
              - id: l2-s4
                type: multiple_choice
                text: "„Mein Lieblingsessen ist Pasta mit Tomatensoße.“\n\nWelches deutsche Wort kannst du statt Pasta einsetzen?"
                say: "Mein Lieblingsessen ist Pasta mit Tomatensoße. Welches deutsche Wort kannst du statt Pasta einsetzen?"
                options: ["Nudeln", "Suppe", "Pfannkuchen"]
                answer: "Nudeln"
                feedback:
                  "Pfannkuchen": "Pfannkuchen mit Tomatensoße? Na dann, guten Appetit! Pasta ist das italienische Wort für Nudeln."
                hints: ["Was isst man oft mit Tomatensoße?"]
              - id: l2-s5
                type: true_false
                text: "Im Wörterbuch steht: Del|fin, der (griech.). Kommt das Wort aus dem Griechischen?"
                say: "Lies den Eintrag im Wörterbuch. Kommt das Wort Delfin aus dem Griechischen?"
                answer: true
                hints: ["Wofür steht griech.?"]

          - support: none
            tasks:
              - id: l2-n2
                type: multiple_choice
                text: "Im Wörterbuch steht:\nPy|ja|ma, der (engl.): Schlafanzug\n\nWas ist ein Pyjama?"
                say: "Lies den Eintrag im Wörterbuch. Was ist ein Pyjama?"
                options: ["ein Schlafanzug", "ein Bademantel", "eine Mütze"]
                answer: "ein Schlafanzug"
              - id: l2-n3
                type: multiple_choice
                text: "„Nach dem Konzert klatschen alle Leute, und das Orchester verbeugt sich.“\n\nWas ist ein Konzert?"
                say: "Nach dem Konzert klatschen alle Leute, und das Orchester verbeugt sich. Was ist ein Konzert?"
                options: ["eine Aufführung mit Musik", "ein Kochrezept", "ein Spiel auf dem Schulhof"]
                answer: "eine Aufführung mit Musik"
              - id: l2-n1
                type: matching
                text: "Welches deutsche Wort passt?"
                say: "Verbinde jedes Fremdwort mit einem deutschen Wort, das dasselbe bedeutet."
                pairs:
                  - { left: { text: "Party" }, right: { text: "Feier" } }
                  - { left: { text: "Job" }, right: { text: "Arbeit" } }
                  - { left: { text: "Training" }, right: { text: "Übung" } }
                  - { left: { text: "Restaurant" }, right: { text: "Gaststätte" } }
              - id: l2-n4
                type: multiple_choice
                text: "„Wir wohnen in der dritten Etage.“\n\nWelches deutsche Wort kannst du statt Etage einsetzen?"
                say: "Wir wohnen in der dritten Etage. Welches deutsche Wort kannst du statt Etage einsetzen?"
                options: ["Stockwerk", "Straße", "Stadt"]
                answer: "Stockwerk"
