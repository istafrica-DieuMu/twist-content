# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.logic-puzzles
skill: lit-de.comprehension.logic-puzzles
curriculum: de-DE
language: de
title:
  de: Logicals und genaues Lesen
  en: Logic puzzles and close reading
summary: >
  Reading closely where every word counts. Lesson 1 solves Logicals with
  three people and three things, starts from the clue that says something
  for sure, reads small words such as nicht, kein, neben and älter als,
  and checks a solution against every clue; lesson 2 reads short texts
  full of times, prices and rules, joins two facts to answer a question,
  solves Logicals with four people, and ends with the skill check. Every
  puzzle is written for Twist and has one solution.
metadata:
  year: klasse-4
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [lit-de.comprehension.infer]
  also_practises: [lit-de.comprehension.infer]
  vocabulary: { de: [Logical, Hinweis, Lösung, nicht, kein, neben, direkt hinter, älter als, höchstens] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: skip-small-words
      what: Overlooks nicht, kein or weder noch in a clue and reads it as the opposite
      addressed: lesson 1 Learn names the small words; every stage has a clue with nicht, kein or weder noch, with feedback in l1-f1
    - id: number-near-the-question
      what: Takes the first number near the key word instead of the one the question asks for (1,50 Euro for three Lose)
      addressed: lesson 2 Learn reads the question first and joins two facts; every stage of lesson 2 has a price or time question with a near-miss number, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Hinweis für Hinweis", en: "Clue by clue" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Tom zieht Gummistiefel an und nimmt einen Schirm mit. Wie ist das Wetter wohl?"
            options: ["Es regnet.", "Es ist heiß und sonnig.", "Es ist windstill und trocken."]
            answer: "Es regnet."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Lisa gähnt und reibt sich die Augen. Wie fühlt sie sich wohl?"
            options: ["müde", "wütend", "hungrig"]
            answer: "müde"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lena, Max und Ida haben je ein Haustier: einen Hund, eine Katze und einen Hasen.\n1. Lena hat keinen Hund.\n2. Max hat die Katze."
            say: "Ein Logical ist ein Rätsel aus Hinweisen. Lies jeden Hinweis genau. Fang mit dem Hinweis an, der etwas sicher sagt: Max hat die Katze."
          - text: "Max: Katze\nLena: kein Hund, keine Katze, also der Hase\nIda: Hund"
            say: "Lena hat keinen Hund. Die Katze hat schon Max. Also hat Lena den Hasen. Für Ida bleibt der Hund."
          - text: "nicht · kein · neben · direkt hinter · älter als"
            say: "Kleine Wörter wie nicht, kein, neben oder älter als sind wichtig. Am Ende prüfst du deine Lösung mit jedem Hinweis."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Tim, Ole und Mia essen je ein Eis: Erdbeere, Schokolade und Vanille.\n1. Mia isst Vanille.\n2. Tim mag keine Schokolade.\n\nWer isst Schokolade?"
                say: "Lies die Hinweise. Wer isst Schokolade?"
                options: ["Ole", "Tim", "Mia"]
                answer: "Ole"
                feedback:
                  "Tim": "Lies Hinweis 2 noch einmal: Tim mag keine Schokolade."
                hints:
                  - "Fang mit dem Hinweis an, der etwas sicher sagt."
                  - "Mia hat Vanille. Tim mag keine Schokolade, also hat er Erdbeere."
                  - "Für Ole bleibt Schokolade."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Drei Häuser stehen nebeneinander. Eins ist rot, eins blau, eins gelb.\n1. Das rote Haus steht ganz links.\n2. Das gelbe Haus steht nicht in der Mitte.\n\nWelche Farbe hat das Haus in der Mitte?"
                say: "Lies die Hinweise. Welche Farbe hat das Haus in der Mitte?"
                options: ["blau", "gelb", "rot"]
                answer: "blau"
                hints:
                  - "Wo steht das rote Haus?"
                  - "Links ist rot. Das gelbe steht nicht in der Mitte, also rechts."
                  - "In der Mitte steht das blaue Haus."
              - id: l1-f3
                type: true_false
                text: "Jana, Paul und Lukas sind 8, 9 und 10 Jahre alt.\n1. Paul ist älter als Jana.\n2. Lukas ist der Jüngste.\n\nLösung: Jana ist 9, Paul ist 10, Lukas ist 8. Stimmt die Lösung?"
                say: "Lies die Hinweise und die Lösung. Stimmt die Lösung?"
                answer: true
                hints:
                  - "Prüf die Lösung mit jedem Hinweis."
                  - "Ist Lukas mit 8 der Jüngste? Ist Paul älter als Jana?"
                  - "Ja, beide Hinweise passen."
              - id: l1-f4
                type: multiple_choice
                text: "„Ben sitzt nicht neben Emma.“ Welches Wort darfst du hier auf keinen Fall überlesen?"
                options: ["nicht", "Ben", "sitzt"]
                answer: "nicht"
                hints:
                  - "Welches Wort dreht die Bedeutung um?"
                  - "Ohne dieses Wort hieße es: Ben sitzt neben Emma."
                  - "nicht."
              - id: l1-f5
                type: fill_in_blank
                text: "Sara, Nils und Eva spielen je ein Instrument: Gitarre, Flöte und Klavier.\n1. Nils spielt Flöte.\n2. Eva spielt nicht Klavier.\n\nTrag die Lösung ein."
                say: "Lies die Hinweise. Wer spielt welches Instrument? Trag die Lösung ein."
                frame: "Sara: _   Nils: _   Eva: _"
                options: ["Gitarre", "Flöte", "Klavier"]
                answer: ["Klavier", "Flöte", "Gitarre"]
                hints:
                  - "Trag zuerst ein, was sicher ist."
                  - "Nils hat die Flöte. Eva spielt nicht Klavier, also Gitarre."
                  - "Sara Klavier, Nils Flöte, Eva Gitarre."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Anna, Leo und Kim kommen mit dem Rad, dem Bus und dem Roller zur Schule.\n1. Leo kommt nicht mit dem Bus.\n2. Kim kommt mit dem Rad.\n\nWer kommt mit dem Bus?"
                say: "Lies die Hinweise. Wer kommt mit dem Bus?"
                options: ["Anna", "Leo", "Kim"]
                answer: "Anna"
                hints: ["Kim hat das Rad. Was bleibt für Leo?"]
              - id: l1-s2
                type: multiple_choice
                text: "Im Regal stehen drei Bücher nebeneinander: ein Tierbuch, ein Krimi und ein Comic.\n1. Der Comic steht ganz rechts.\n2. Das Tierbuch steht nicht neben dem Comic.\n\nWas steht in der Mitte?"
                say: "Lies die Hinweise. Welches Buch steht in der Mitte?"
                options: ["der Krimi", "das Tierbuch", "der Comic"]
                answer: "der Krimi"
                hints: ["Das Buch in der Mitte steht neben dem Comic."]
              - id: l1-s3
                type: true_false
                text: "Finn, Ella und Jonas sind 1,30 m, 1,35 m und 1,40 m groß.\n1. Ella ist kleiner als Finn.\n2. Jonas ist am größten.\n\nLösung: Finn ist 1,30 m, Ella ist 1,35 m, Jonas ist 1,40 m. Stimmt die Lösung?"
                say: "Lies die Hinweise und die Lösung. Stimmt die Lösung?"
                answer: false
                hints: ["Ist Ella in der Lösung wirklich kleiner als Finn?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Hinweis sagt dir sofort, wer was hat?"
                options: ["Max hat die Katze.", "Lena hat keinen Hund.", "Ida hat nicht den Hasen."]
                answer: "Max hat die Katze."
                hints: ["Zwei Hinweise sagen nur, was jemand nicht hat."]
              - id: l1-s5
                type: fill_in_blank
                text: "Mila, Tom und Ayla haben im März, im Juni und im Oktober Geburtstag.\n1. Tom hat im Herbst Geburtstag.\n2. Ayla hat nicht im März Geburtstag.\n\nTrag die Lösung ein."
                say: "Lies die Hinweise. Wer hat wann Geburtstag? Trag die Lösung ein."
                frame: "Mila: _   Tom: _   Ayla: _"
                options: ["März", "Juni", "Oktober"]
                answer: ["März", "Oktober", "Juni"]
                hints: ["Welcher der drei Monate liegt im Herbst?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Pia, Jan und Lea tragen je eine Mütze: eine grüne, eine rote und eine weiße.\n1. Pia trägt keine rote und keine weiße Mütze.\n2. Jan trägt die rote Mütze.\n\nWelche Farbe hat Leas Mütze?"
                say: "Lies die Hinweise. Welche Farbe hat Leas Mütze?"
                options: ["weiß", "grün", "rot"]
                answer: "weiß"
              - id: l1-n2
                type: multiple_choice
                text: "Noah, Lina und Elias stehen an der Kasse in einer Reihe.\n1. Lina steht ganz vorne.\n2. Noah steht direkt hinter Lina.\n\nWer steht ganz hinten?"
                say: "Lies die Hinweise. Wer steht ganz hinten?"
                options: ["Elias", "Noah", "Lina"]
                answer: "Elias"
              - id: l1-n3
                type: true_false
                text: "Oma, Opa und Tante Rita trinken Tee, Kaffee und Kakao.\n1. Opa trinkt keinen Kaffee und keinen Kakao.\n2. Tante Rita trinkt Kakao.\n\nLösung: Oma trinkt Kaffee. Stimmt das?"
                say: "Lies die Hinweise. Stimmt es, dass Oma Kaffee trinkt?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "„Ben ist älter als Ida.“ Was weißt du dadurch sicher?"
                options: ["Ida ist jünger als Ben.", "Ben ist der Älteste von allen.", "Ida ist älter als Ben."]
                answer: "Ida ist jünger als Ben."
              - id: l1-n5
                type: fill_in_blank
                text: "Emil, Hanna und Luis wohnen in einem Haus im 1., im 2. und im 3. Stock.\n1. Hanna wohnt ganz oben.\n2. Emil wohnt nicht im 1. Stock.\n\nTrag die Lösung ein."
                say: "Lies die Hinweise. Wer wohnt in welchem Stock? Trag die Lösung ein."
                frame: "Emil: _   Hanna: _   Luis: _"
                options: ["1. Stock", "2. Stock", "3. Stock"]
                answer: ["2. Stock", "3. Stock", "1. Stock"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ali, Greta und Sam haben je eine Lieblingsfarbe: Blau, Gelb und Lila.\n1. Greta mag Gelb am liebsten.\n2. Sam mag Blau nicht.\n\nWer mag Blau am liebsten?"
            say: "Lies die Hinweise. Wer mag Blau am liebsten?"
            options: ["Ali", "Sam", "Greta"]
            answer: "Ali"
          - id: l1-c2
            type: true_false
            text: "Die Hunde Bello, Rex und Struppi wiegen 5 kg, 10 kg und 20 kg.\n1. Rex ist schwerer als Bello.\n2. Struppi wiegt am wenigsten.\n\nLösung: Bello wiegt 10 kg, Rex wiegt 20 kg. Stimmt die Lösung?"
            say: "Lies die Hinweise und die Lösung. Stimmt die Lösung?"
            answer: true
          - id: l1-c3
            type: fill_in_blank
            text: "Clara, David und Frieda gehen in die Klassen 2, 3 und 4.\n1. David ist in einer höheren Klasse als Clara und Frieda.\n2. Frieda geht nicht in die Klasse 2.\n\nTrag die Lösung ein."
            say: "Lies die Hinweise. Wer geht in welche Klasse? Trag die Lösung ein."
            frame: "Clara: Klasse _   David: Klasse _   Frieda: Klasse _"
            options: ["2", "3", "4"]
            answer: ["2", "4", "3"]

  - n: 2
    title: { de: "Zahlen und Angaben genau lesen", en: "Reading numbers and details closely" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Uli, Vera und Willi haben je ein Kuscheltier: einen Bären, einen Affen und einen Elefanten.\n1. Vera hat den Affen.\n2. Uli hat keinen Elefanten.\n\nWer hat den Elefanten?"
            say: "Lies die Hinweise. Wer hat den Elefanten?"
            options: ["Willi", "Uli", "Vera"]
            answer: "Willi"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "„Lina steht direkt hinter Noah.“ Was bedeutet das?"
            options: ["Zwischen Noah und Lina steht niemand.", "Lina steht vor Noah.", "Zwischen den beiden steht ein Kind."]
            answer: "Zwischen Noah und Lina steht niemand."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Schwimmbadbus\n\nDer Bus zum Schwimmbad fährt montags bis freitags um 14:15 Uhr ab. Am Samstag fährt er schon um 10:30 Uhr. Am Sonntag fährt kein Bus.\nDie Fahrt dauert 20 Minuten. Kinder zahlen 1,50 Euro, Erwachsene 3 Euro."
            say: "In manchen Texten stecken viele Zahlen und Angaben. Lies zuerst die Frage. Dann suchst du genau die Angabe, die du brauchst."
          - text: "Wann kommt der Bus am Samstag an?\n10:30 Uhr + 20 Minuten = 10:50 Uhr"
            say: "Manchmal musst du zwei Angaben verbinden: die Abfahrt am Samstag und die Fahrzeit. Der Bus kommt um 10:50 Uhr an."
          - text: "nur · schon · kein · höchstens · zusammen"
            say: "Kleine Wörter verändern viel. Am Sonntag fährt kein Bus. Prüf deine Antwort am Ende noch einmal am Text."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Das Sommerfest\n\nDas Sommerfest der Grundschule beginnt am Samstag um 14 Uhr und endet um 18 Uhr.\nAn der Losbude kostet ein Los 50 Cent. Drei Lose kosten zusammen 1 Euro.\nDie Klasse 4a verkauft Waffeln, die Klasse 3b bietet Kinderschminken an. Um 16 Uhr singt der Schulchor.\n\nWie viel kosten drei Lose?"
                say: "Lies den Text. Wie viel kosten drei Lose?"
                options: ["1 Euro", "1,50 Euro", "50 Cent"]
                answer: "1 Euro"
                feedback:
                  "1,50 Euro": "So viel kosten drei einzelne Lose. Im Text steht aber: Drei Lose kosten zusammen 1 Euro."
                  "50 Cent": "So viel kostet ein Los. Gefragt sind drei."
                hints:
                  - "Such die Stelle mit den Losen."
                  - "Es gibt zwei Preise: für ein Los und für drei Lose."
                  - "Drei Lose kosten zusammen 1 Euro."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Das Sommerfest\n\nDas Sommerfest der Grundschule beginnt am Samstag um 14 Uhr und endet um 18 Uhr.\nAn der Losbude kostet ein Los 50 Cent. Drei Lose kosten zusammen 1 Euro.\nDie Klasse 4a verkauft Waffeln, die Klasse 3b bietet Kinderschminken an. Um 16 Uhr singt der Schulchor.\n\nWie viele Stunden dauert das Fest?"
                say: "Lies den Text. Wie viele Stunden dauert das Fest? Tipp die Zahl ein."
                answer: "4"
                hints:
                  - "Du brauchst zwei Angaben: Anfang und Ende."
                  - "Von 14 Uhr bis 18 Uhr."
                  - "Es sind 4 Stunden."
              - id: l2-f3
                type: true_false
                text: "Das Sommerfest\n\nDas Sommerfest der Grundschule beginnt am Samstag um 14 Uhr und endet um 18 Uhr.\nAn der Losbude kostet ein Los 50 Cent. Drei Lose kosten zusammen 1 Euro.\nDie Klasse 4a verkauft Waffeln, die Klasse 3b bietet Kinderschminken an. Um 16 Uhr singt der Schulchor.\n\nStimmt das? Die Klasse 3b verkauft Waffeln."
                say: "Lies den Text. Stimmt das: Die Klasse 3b verkauft Waffeln?"
                answer: false
                hints:
                  - "Such die Stelle mit den Klassen."
                  - "Zwei Klassen werden genannt. Welche hat die Waffeln?"
                  - "Nein. Die 4a verkauft Waffeln, die 3b schminkt."
              - id: l2-f4
                type: multiple_choice
                text: "Ina, Jan, Kai und Lou sitzen nebeneinander auf einer Bank.\n1. Ina sitzt ganz links.\n2. Lou sitzt ganz rechts.\n3. Jan sitzt neben Ina.\n\nWer sitzt neben Lou?"
                say: "Lies die Hinweise. Wer sitzt neben Lou?"
                options: ["Kai", "Jan", "Ina"]
                answer: "Kai"
                hints:
                  - "Setz zuerst die beiden an den Enden hin."
                  - "Ina links, Lou rechts. Jan sitzt neben Ina, also auf dem zweiten Platz."
                  - "Auf dem dritten Platz, neben Lou, sitzt Kai."
              - id: l2-f5
                type: fill_in_blank
                text: "Rosa, Ben und Ida gehen zum Fußball, zum Schwimmen und zum Tanzen.\n1. Rosa geht nicht zum Schwimmen.\n2. Ben geht weder zum Schwimmen noch zum Fußball.\n\nTrag die Lösung ein."
                say: "Lies die Hinweise. Wer macht welchen Sport? Trag die Lösung ein."
                frame: "Rosa: _   Ben: _   Ida: _"
                options: ["Fußball", "Schwimmen", "Tanzen"]
                answer: ["Fußball", "Tanzen", "Schwimmen"]
                hints:
                  - "Weder noch heißt: das eine nicht und das andere auch nicht."
                  - "Ben bleibt nur Tanzen. Rosa geht nicht zum Schwimmen."
                  - "Rosa Fußball, Ben Tanzen, Ida Schwimmen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Tierpark Sonnenwiese\n\nÖffnungszeiten: April bis Oktober täglich von 9 bis 18 Uhr, November bis März täglich von 10 bis 16 Uhr.\nEintritt: Kinder 4 Euro, Erwachsene 8 Euro. Kinder unter 3 Jahren kommen umsonst hinein.\nFütterungen: Seehunde um 11 Uhr, Pinguine um 15 Uhr.\n\nUm wie viel Uhr öffnet der Tierpark im Dezember?"
                say: "Lies den Text. Um wie viel Uhr öffnet der Tierpark im Dezember?"
                options: ["um 10 Uhr", "um 9 Uhr", "gar nicht"]
                answer: "um 10 Uhr"
                hints: ["Zu welchem Zeitraum gehört der Dezember?"]
              - id: l2-s2
                type: text_input
                text: "Tierpark Sonnenwiese\n\nÖffnungszeiten: April bis Oktober täglich von 9 bis 18 Uhr, November bis März täglich von 10 bis 16 Uhr.\nEintritt: Kinder 4 Euro, Erwachsene 8 Euro. Kinder unter 3 Jahren kommen umsonst hinein.\nFütterungen: Seehunde um 11 Uhr, Pinguine um 15 Uhr.\n\nZwei Erwachsene und ein Kind von 7 Jahren gehen in den Tierpark. Wie viel Euro zahlen sie zusammen?"
                say: "Lies den Text. Zwei Erwachsene und ein Kind von sieben Jahren gehen in den Tierpark. Wie viel Euro zahlen sie zusammen? Tipp die Zahl ein."
                answer: "20"
                hints: ["Zwei Erwachsene zu 8 Euro und ein Kind zu 4 Euro."]
              - id: l2-s3
                type: true_false
                text: "Tierpark Sonnenwiese\n\nÖffnungszeiten: April bis Oktober täglich von 9 bis 18 Uhr, November bis März täglich von 10 bis 16 Uhr.\nEintritt: Kinder 4 Euro, Erwachsene 8 Euro. Kinder unter 3 Jahren kommen umsonst hinein.\nFütterungen: Seehunde um 11 Uhr, Pinguine um 15 Uhr.\n\nStimmt das? Ein Kind von 2 Jahren zahlt 4 Euro."
                say: "Lies den Text. Stimmt das: Ein Kind von zwei Jahren zahlt 4 Euro?"
                answer: false
                hints: ["Lies den Satz über Kinder unter 3 Jahren."]
              - id: l2-s4
                type: multiple_choice
                text: "Mats, Nele, Omar und Pia laufen um die Wette.\n1. Nele ist schneller als Mats.\n2. Omar wird Erster.\n3. Pia wird Letzte.\n\nAuf welchem Platz landet Mats?"
                say: "Lies die Hinweise. Auf welchem Platz landet Mats?"
                options: ["auf Platz 3", "auf Platz 2", "auf Platz 4"]
                answer: "auf Platz 3"
                hints: ["Omar und Pia stehen fest. Wer von Nele und Mats ist vorne?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Tara, Uwe und Vera haben je ein Lieblingsfach: Mathe, Sport und Kunst.\n1. Tara mag Sport nicht.\n2. Uwe mag Kunst am liebsten.\n\nTrag die Lösung ein."
                say: "Lies die Hinweise. Wer mag welches Fach am liebsten? Trag die Lösung ein."
                frame: "Tara: _   Uwe: _   Vera: _"
                options: ["Mathe", "Sport", "Kunst"]
                answer: ["Mathe", "Kunst", "Sport"]
                hints: ["Trag zuerst Uwe ein."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Die Stadtbücherei\n\nDie Bücherei hat dienstags bis freitags von 10 bis 18 Uhr geöffnet, samstags von 10 bis 13 Uhr. Montags und sonntags ist sie geschlossen.\nMit einem Leseausweis darfst du höchstens 10 Bücher auf einmal ausleihen. Du darfst sie 4 Wochen behalten.\nFür Kinder ist der Ausweis kostenlos.\n\nWann kannst du am Samstag Bücher ausleihen?"
                say: "Lies den Text. Wann kannst du am Samstag Bücher ausleihen?"
                options: ["von 10 bis 13 Uhr", "von 10 bis 18 Uhr", "gar nicht"]
                answer: "von 10 bis 13 Uhr"
              - id: l2-n2
                type: text_input
                text: "Die Stadtbücherei\n\nDie Bücherei hat dienstags bis freitags von 10 bis 18 Uhr geöffnet, samstags von 10 bis 13 Uhr. Montags und sonntags ist sie geschlossen.\nMit einem Leseausweis darfst du höchstens 10 Bücher auf einmal ausleihen. Du darfst sie 4 Wochen behalten.\nFür Kinder ist der Ausweis kostenlos.\n\nWie viele Bücher darfst du höchstens auf einmal ausleihen?"
                say: "Lies den Text. Wie viele Bücher darfst du höchstens auf einmal ausleihen? Tipp die Zahl ein."
                answer: "10"
              - id: l2-n3
                type: true_false
                text: "Die Stadtbücherei\n\nDie Bücherei hat dienstags bis freitags von 10 bis 18 Uhr geöffnet, samstags von 10 bis 13 Uhr. Montags und sonntags ist sie geschlossen.\nMit einem Leseausweis darfst du höchstens 10 Bücher auf einmal ausleihen. Du darfst sie 4 Wochen behalten.\nFür Kinder ist der Ausweis kostenlos.\n\nStimmt das? Am Montag kannst du um 11 Uhr Bücher zurückbringen."
                say: "Lies den Text. Stimmt das: Am Montag kannst du um 11 Uhr Bücher zurückbringen?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Ella, Finn, Gina und Hugo wohnen in einer Straße in den Häusern 1, 2, 3 und 4.\n1. Ella wohnt in Haus 3.\n2. Gina wohnt neben Ella, aber nicht in Haus 4.\n3. Finn wohnt in einem Haus mit einer geraden Nummer.\n\nIn welchem Haus wohnt Finn?"
                say: "Lies die Hinweise. In welchem Haus wohnt Finn?"
                options: ["in Haus 4", "in Haus 2", "in Haus 1"]
                answer: "in Haus 4"
              - id: l2-n5
                type: fill_in_blank
                text: "Kira, Lars und Moni bringen Saft, Kekse und Obst zum Picknick mit.\n1. Lars bringt nichts zu trinken mit.\n2. Moni bringt das Obst mit.\n\nTrag die Lösung ein."
                say: "Lies die Hinweise. Wer bringt was mit? Trag die Lösung ein."
                frame: "Kira: _   Lars: _   Moni: _"
                options: ["Saft", "Kekse", "Obst"]
                answer: ["Saft", "Kekse", "Obst"]

      - activity: check
