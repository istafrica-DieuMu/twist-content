# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.verbs-compound
skill: lit-de.verbs.compound
curriculum: de-DE
language: de
title:
  de: Zusammengesetzte Verben
  en: Compound verbs
summary: >
  Verbs built from a front part and a verb (einkaufen, mitbringen,
  zurückgehen). Lesson 1 builds them and shows that the front part splits
  off to the end of the sentence (Ich kaufe heute ein.), unlike the
  Vorsilben ver-, be- and ent- (Ich verkaufe mein Rad.); lesson 2 forms
  the Perfekt with ge in the middle (eingekauft) and without ge for the
  fixed Vorsilben (verkauft), and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Verben, en: Verbs }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.verbs.prefixes]
  also_practises: [lit-de.verbs.perfect, lit-de.sentences.subject-predicate]
  vocabulary: { de: [zusammengesetztes Verb, trennbar, nicht trennbar, Vorsilbe, Perfekt] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: build, what: { de: zusammengesetzte Verben bilden und ihre Grundform nennen, en: building compound verbs and naming their base form } }
    - { id: split, what: { de: die abgetrennte Vorsilbe im Satz ans Ende stellen, en: putting the split-off front part at the end of the sentence } }
    - { id: separable, what: { de: trennbare und nicht trennbare Verben unterscheiden, en: telling separable from inseparable verbs } }
    - { id: perfect, what: { de: das Perfekt mit ge in der Mitte oder ohne ge bilden, en: forming the perfect with ge in the middle or without ge } }
  misconceptions:
    - id: no-split
      what: Keeps the front part on the verb in a sentence (Ich einkaufe heute.)
      addressed: lesson 1 Learn shows the front part moving to the end; every stage and the check of lesson 1 offer the unsplit form as a distractor, with feedback in l1-f2
    - id: split-everything
      what: Splits the fixed Vorsilben too (Ich kaufe mein Rad ver.)
      addressed: lesson 1 Learn sets einkaufen against verkaufen; true/false tasks in every stage of lesson 1 show a split ver-, be- or ent- verb (l1-f3, l1-s3, l1-n3)
    - id: ge-in-front
      what: Puts ge in front in the Perfekt (geeinkauft) or adds ge to fixed Vorsilben (geverkauft)
      addressed: lesson 2 Learn shows eingekauft and verkauft; every stage of lesson 2 offers both wrong forms, with feedback in l2-f1 and l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Ich kaufe heute ein.", en: "I am going shopping today." }
    goal:
      de: "Bau Verben wie einkaufen. Im Satz wandert der vordere Teil ans Ende, so wie bei ich kaufe heute ein."
      en: "Build verbs like einkaufen. In a sentence the front part moves to the end, as in ich kaufe heute ein."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "auf + stehen = _"
            say: "Welches Verb entsteht? Auf und stehen."
            options: ["aufstehen", "stehenauf", "aufsteht"]
            answer: "aufstehen"
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tippe auf beide Teile des Prädikats."
            say: "Lies den Satz. Das Prädikat hat zwei Teile. Tippe auf beide."
            show: { drawn: letter-card, text: "Der Bus fährt gleich los." }
            spans: ["fährt", "los"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "ein + kaufen = einkaufen"
            say: "Viele Verben bestehen aus einer Vorsilbe und einem Verb: ein und kaufen wird einkaufen. Mit und bringen wird mitbringen."
          - text: "Ich kaufe heute ein."
            say: "Im Satz trennt sich die Vorsilbe ab und wandert ans Ende: Ich kaufe heute ein. Das Verb ist trennbar."
          - text: "Ich verkaufe mein Rad."
            say: "Bei ver-, be-, ent-, er- und zer- trennt sich nichts ab: Ich verkaufe mein Rad. Ich bezahle an der Kasse. Diese Verben sind nicht trennbar."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "zurück + gehen = _"
                say: "Welches Verb entsteht? Zurück und gehen."
                options: ["zurückgehen", "gehenzurück", "zurückgeht"]
                answer: "zurückgehen"
                hints:
                  - "Die Vorsilbe steht in der Grundform vorn."
                  - "zurück und dann gehen."
                  - "zurückgehen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Das Verb heißt einladen. Welcher Satz ist richtig?"
                say: "Das Verb heißt einladen. Welcher Satz ist richtig?"
                options: ["Ich lade dich zu meinem Geburtstag ein.", "Ich einlade dich zu meinem Geburtstag.", "Ich lade ein dich zu meinem Geburtstag."]
                answer: "Ich lade dich zu meinem Geburtstag ein."
                option_audio: false
                feedback:
                  "Ich einlade dich zu meinem Geburtstag.": "Einladen ist trennbar. Der Teil „ein“ wandert ans Ende: Ich lade dich zu meinem Geburtstag ein."
                  "Ich lade ein dich zu meinem Geburtstag.": "Der Teil „ein“ steht nicht gleich hinter dem Verb, sondern ganz am Ende des Satzes."
                hints:
                  - "Einladen ist trennbar."
                  - "Der Teil „ein“ steht ganz am Ende."
                  - "Ich lade dich zu meinem Geburtstag ein."
              - id: l1-f3
                type: true_false
                text: "Ist der Satz richtig?"
                say: "Lies die Karte. Ist der Satz richtig?"
                show: { drawn: letter-card, text: "Ich spreche es dir ver." }
                answer: false
                hints:
                  - "Wie heißt das Verb? Versprechen."
                  - "Trennt sich ver- ab?"
                  - "Nein. Richtig ist: Ich verspreche es dir."
              - id: l1-f4
                type: fill_in_blank
                text: "Das Verb heißt anrufen. Ergänze den Satz."
                say: "Das Verb heißt anrufen. Ergänze: Lea ruft ihre Oma …"
                frame: "Lea ruft ihre Oma _."
                options: ["an", "ab", "zu"]
                answer: ["an"]
                hints:
                  - "Welche Vorsilbe gehört zu anrufen?"
                  - "an und rufen."
                  - "Lea ruft ihre Oma an."
              - id: l1-f5
                type: sorting
                text: "Trennbar oder nicht trennbar?"
                say: "Sortiere die Verben: trennbar oder nicht trennbar?"
                bins:
                  - { id: sep, show: { text: "trennbar" }, say: "trennbar" }
                  - { id: insep, show: { text: "nicht trennbar" }, say: "nicht trennbar" }
                options:
                  - { text: "aufräumen", bin: sep }
                  - { text: "verlieren", bin: insep }
                  - { text: "weglaufen", bin: sep }
                  - { text: "bekommen", bin: insep }
                hints:
                  - "Bau mit jedem Verb einen kurzen Satz."
                  - "Ich räume auf. Ich verliere."
                  - "Aufräumen und weglaufen sind trennbar, verlieren und bekommen nicht."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "weg + werfen = _"
                say: "Welches Verb entsteht? Weg und werfen."
                options: ["werfenweg", "wegwerfen", "wegwirft"]
                answer: "wegwerfen"
                hints: ["Welcher Teil steht vorn?"]
              - id: l1-s2
                type: multiple_choice
                text: "Das Verb heißt zuhören. Welcher Satz ist richtig?"
                say: "Das Verb heißt zuhören. Welcher Satz ist richtig?"
                options: ["Wir zuhören dem Lehrer.", "Wir hören zu dem Lehrer.", "Wir hören dem Lehrer zu."]
                answer: "Wir hören dem Lehrer zu."
                option_audio: false
                hints: ["Wo steht der abgetrennte Teil?"]
              - id: l1-s3
                type: true_false
                text: "Ist der Satz richtig?"
                say: "Lies die Karte. Ist der Satz richtig?"
                show: { drawn: letter-card, text: "Wir suchen morgen Oma be." }
                answer: false
                hints: ["Trennt sich be- ab?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Das Verb heißt einschlafen. Ergänze den Satz."
                say: "Das Verb heißt einschlafen. Ergänze: Das Baby schläft schnell …"
                frame: "Das Baby schläft schnell _."
                options: ["ein", "an", "vor"]
                answer: ["ein"]
                hints: ["Wie heißt das Verb in der Grundform?"]
              - id: l1-s5
                type: sorting
                text: "Trennbar oder nicht trennbar?"
                say: "Sortiere die Verben: trennbar oder nicht trennbar?"
                bins:
                  - { id: sep, show: { text: "trennbar" }, say: "trennbar" }
                  - { id: insep, show: { text: "nicht trennbar" }, say: "nicht trennbar" }
                options:
                  - { text: "mitnehmen", bin: sep }
                  - { text: "erzählen", bin: insep }
                  - { text: "ausziehen", bin: sep }
                  - { text: "entdecken", bin: insep }
                hints: ["Bau mit jedem Verb einen kurzen Satz: Ich …"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "los + fahren = _"
                say: "Welches Verb entsteht? Los und fahren."
                options: ["losfährt", "fahrenlos", "losfahren"]
                answer: "losfahren"
              - id: l1-n2
                type: multiple_choice
                text: "Das Verb heißt abholen. Welcher Satz ist richtig?"
                say: "Das Verb heißt abholen. Welcher Satz ist richtig?"
                options: ["Papa holt ab mich um drei.", "Papa holt mich um drei ab.", "Papa abholt mich um drei."]
                answer: "Papa holt mich um drei ab."
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Ist der Satz richtig?"
                say: "Lies die Karte. Ist der Satz richtig?"
                show: { drawn: letter-card, text: "Ich schuldige mich bei Lea ent." }
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Das Verb heißt aussteigen. Ergänze den Satz."
                say: "Das Verb heißt aussteigen. Ergänze: Wir steigen an der nächsten Haltestelle …"
                frame: "Wir steigen an der nächsten Haltestelle _."
                options: ["aus", "an", "vor"]
                answer: ["aus"]
              - id: l1-n5
                type: sorting
                text: "Trennbar oder nicht trennbar?"
                say: "Sortiere die Verben: trennbar oder nicht trennbar?"
                bins:
                  - { id: sep, show: { text: "trennbar" }, say: "trennbar" }
                  - { id: insep, show: { text: "nicht trennbar" }, say: "nicht trennbar" }
                options:
                  - { text: "zumachen", bin: sep }
                  - { text: "zerreißen", bin: insep }
                  - { text: "vorlesen", bin: sep }
                  - { text: "erklären", bin: insep }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Das Verb heißt anziehen. Welcher Satz ist richtig?"
            say: "Das Verb heißt anziehen. Welcher Satz ist richtig?"
            options: ["Ich ziehe meine Jacke an.", "Ich anziehe meine Jacke.", "Ich ziehe an meine Jacke."]
            answer: "Ich ziehe meine Jacke an."
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Ist der Satz richtig?"
            say: "Lies die Karte. Ist der Satz richtig?"
            show: { drawn: letter-card, text: "Ich stelle dir meinen Freund vor." }
            answer: true
          - id: l1-c3
            type: fill_in_blank
            text: "Das Verb heißt aufpassen. Ergänze den Satz."
            say: "Das Verb heißt aufpassen. Ergänze: Pass gut …"
            frame: "Pass gut _!"
            options: ["auf", "an", "ab"]
            answer: ["auf"]
          - id: l1-c4
            type: multiple_choice
            text: "nach + sehen = _"
            say: "Welches Verb entsteht? Nach und sehen."
            options: ["sehennach", "nachsehen", "nachsieht"]
            answer: "nachsehen"
          - id: l1-c5
            type: sorting
            text: "Trennbar oder nicht trennbar?"
            say: "Sortiere die Verben: trennbar oder nicht trennbar?"
            bins:
              - { id: sep, show: { text: "trennbar" }, say: "trennbar" }
              - { id: insep, show: { text: "nicht trennbar" }, say: "nicht trennbar" }
            options:
              - { text: "anfassen", bin: sep }
              - { text: "berühren", bin: insep }
              - { text: "umdrehen", bin: sep }
              - { text: "verraten", bin: insep }
          - id: l1-c6
            type: true_false
            text: "Ist der Satz richtig?"
            say: "Lies die Karte. Ist der Satz richtig?"
            show: { drawn: letter-card, text: "Wir ankommen um acht Uhr am Bahnhof." }
            answer: false

  - n: 2
    title: { de: "eingekauft und verkauft", en: "shopped and sold" }
    goal:
      de: "Bilde das Perfekt von Verben wie einkaufen und verkaufen. Es heißt eingekauft, aber verkauft ganz ohne ge."
      en: "Form the perfect of verbs like einkaufen and verkaufen. It is eingekauft, but verkauft with no ge at all."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Das Verb heißt aufwachen. Welcher Satz ist richtig?"
            say: "Das Verb heißt aufwachen. Welcher Satz ist richtig?"
            options: ["Ich wache früh auf.", "Ich aufwache früh.", "Ich wache auf früh."]
            answer: "Ich wache früh auf."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ist der Satz richtig?"
            say: "Lies die Karte. Ist der Satz richtig?"
            show: { drawn: letter-card, text: "Tom vergisst seine Mütze." }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "einkaufen → ich habe eingekauft"
            say: "Im Perfekt rutscht bei trennbaren Verben das ge in die Mitte: einkaufen, ich habe eingekauft. Mitbringen, ich habe mitgebracht."
          - text: "verkaufen → ich habe verkauft"
            say: "Bei den nicht trennbaren Verben gibt es gar kein ge: verkaufen, ich habe verkauft. Bezahlen, ich habe bezahlt."
          - text: "ein-ge-kauft ✓ · ge-ein-kauft ✗ · ge-ver-kauft ✗"
            say: "Merk dir: Geeinkauft und geverkauft gibt es nicht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "aufräumen: Ich habe mein Zimmer _."
                say: "Bilde das Perfekt von aufräumen. Ich habe mein Zimmer …"
                options: ["aufgeräumt", "geaufräumt", "aufräumt"]
                answer: "aufgeräumt"
                feedback:
                  "geaufräumt": "Bei trennbaren Verben steht ge in der Mitte: auf-ge-räumt."
                hints:
                  - "Aufräumen ist trennbar."
                  - "Das ge kommt zwischen auf und räumt."
                  - "aufgeräumt."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "besuchen: Wir haben Oma _."
                say: "Bilde das Perfekt von besuchen. Wir haben Oma …"
                options: ["gebesucht", "besucht", "begesucht"]
                answer: "besucht"
                feedback:
                  "gebesucht": "Besuchen ist nicht trennbar. Dann gibt es kein ge: besucht."
                hints:
                  - "Ist besuchen trennbar?"
                  - "Bei be- gibt es kein ge."
                  - "besucht."
              - id: l2-f3
                type: fill_in_blank
                text: "Ergänze das Perfekt von zumachen."
                say: "Das Verb heißt zumachen. Ergänze: Ich habe die Tür …"
                frame: "Ich habe die Tür _."
                options: ["zugemacht", "gezumacht", "zumacht"]
                answer: ["zugemacht"]
                hints:
                  - "Zumachen ist trennbar."
                  - "zu, dann ge, dann macht."
                  - "zugemacht."
              - id: l2-f4
                type: true_false
                text: "Ist das Perfekt richtig?"
                say: "Lies die Karte. Ist das Perfekt richtig?"
                show: { drawn: letter-card, text: "Ich habe ihm das Spiel geerklärt." }
                answer: false
                hints:
                  - "Ist erklären trennbar?"
                  - "Bei er- gibt es kein ge."
                  - "Nein. Richtig ist: Ich habe ihm das Spiel erklärt."
              - id: l2-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Verb mit seinem Perfekt."
                pairs:
                  - { left: { text: "abschreiben" }, right: { text: "abgeschrieben" } }
                  - { left: { text: "verstecken" }, right: { text: "versteckt" } }
                  - { left: { text: "anmalen" }, right: { text: "angemalt" } }
                hints:
                  - "Welche Verben sind trennbar?"
                  - "Verstecken ist nicht trennbar, also ohne ge."
                  - "Abschreiben passt zu abgeschrieben, verstecken zu versteckt, anmalen zu angemalt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "einpacken: Ich habe das Geschenk _."
                say: "Bilde das Perfekt von einpacken. Ich habe das Geschenk …"
                options: ["geeinpackt", "einpackt", "eingepackt"]
                answer: "eingepackt"
                hints: ["Ist einpacken trennbar?"]
              - id: l2-s2
                type: multiple_choice
                text: "entdecken: Die Kinder haben eine Höhle _."
                say: "Bilde das Perfekt von entdecken. Die Kinder haben eine Höhle …"
                options: ["entdeckt", "geentdeckt", "entgedeckt"]
                answer: "entdeckt"
                hints: ["Ist entdecken trennbar?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Ergänze das Perfekt von aufhängen."
                say: "Das Verb heißt aufhängen. Ergänze: Mama hat das Bild …"
                frame: "Mama hat das Bild _."
                options: ["aufgehängt", "geaufhängt", "aufhängt"]
                answer: ["aufgehängt"]
                hints: ["Wo steht das ge bei trennbaren Verben?"]
              - id: l2-s4
                type: true_false
                text: "Ist das Perfekt richtig?"
                say: "Lies die Karte. Ist das Perfekt richtig?"
                show: { drawn: letter-card, text: "Wir haben den Tisch abgewischt." }
                answer: true
                hints: ["Ist abwischen trennbar? Wo steht dann ge?"]
              - id: l2-s5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Verb mit seinem Perfekt."
                pairs:
                  - { left: { text: "auspacken" }, right: { text: "ausgepackt" } }
                  - { left: { text: "bemalen" }, right: { text: "bemalt" } }
                  - { left: { text: "zerstören" }, right: { text: "zerstört" } }
                hints: ["Nur trennbare Verben haben ge."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "abholen: Papa hat mich _."
                say: "Bilde das Perfekt von abholen. Papa hat mich …"
                options: ["abgeholt", "geabholt", "abholt"]
                answer: "abgeholt"
              - id: l2-n2
                type: multiple_choice
                text: "verlieren: Ich habe meinen Schlüssel _."
                say: "Bilde das Perfekt von verlieren. Ich habe meinen Schlüssel …"
                options: ["geverloren", "verloren", "vergeloren"]
                answer: "verloren"
              - id: l2-n3
                type: fill_in_blank
                text: "Ergänze das Perfekt von anmachen."
                say: "Das Verb heißt anmachen. Ergänze: Ich habe das Licht …"
                frame: "Ich habe das Licht _."
                options: ["angemacht", "geanmacht", "anmacht"]
                answer: ["angemacht"]
              - id: l2-n4
                type: true_false
                text: "Ist das Perfekt richtig?"
                say: "Lies die Karte. Ist das Perfekt richtig?"
                show: { drawn: letter-card, text: "Der Hund hat den Ball gebekommen." }
                answer: false
              - id: l2-n5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Verb mit seinem Perfekt."
                pairs:
                  - { left: { text: "mitspielen" }, right: { text: "mitgespielt" } }
                  - { left: { text: "erzählen" }, right: { text: "erzählt" } }
                  - { left: { text: "zuhören" }, right: { text: "zugehört" } }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: split
            type: multiple_choice
            text: "Das Verb heißt ausschalten. Welcher Satz ist richtig?"
            say: "Das Verb heißt ausschalten. Welcher Satz ist richtig?"
            options: ["Ich ausschalte den Fernseher.", "Ich schalte den Fernseher aus.", "Ich schalte aus den Fernseher."]
            answer: "Ich schalte den Fernseher aus."
            option_audio: false
          - id: l2-c2
            part: separable
            type: sorting
            text: "Welche Verben trennen sich im Satz?"
            say: "Welche Verben trennen sich im Satz und welche nicht? Sortiere sie."
            bins:
              - { id: sep, show: { text: "trennbar" }, say: "trennbar" }
              - { id: insep, show: { text: "nicht trennbar" }, say: "nicht trennbar" }
            options:
              - { text: "einsteigen", bin: sep }
              - { text: "bestellen", bin: insep }
              - { text: "hinfallen", bin: sep }
              - { text: "verstehen", bin: insep }
          - id: l2-c3
            part: perfect
            type: multiple_choice
            text: "anrufen: Ich habe dich gestern _."
            say: "Bilde das Perfekt von anrufen. Ich habe dich gestern …"
            options: ["geanrufen", "angerufen", "anrufen"]
            answer: "angerufen"
          - id: l2-c4
            part: perfect
            type: fill_in_blank
            text: "Ergänze das Perfekt von erleben."
            say: "Das Verb heißt erleben. Ergänze: Wir haben im Urlaub viel …"
            frame: "Wir haben im Urlaub viel _."
            options: ["erlebt", "geerlebt", "ergelebt"]
            answer: ["erlebt"]
          - id: l2-c5
            part: split
            type: true_false
            text: "Ist der Satz richtig?"
            say: "Lies die Karte. Ist der Satz richtig?"
            show: { drawn: letter-card, text: "Ich räume den Tisch ab." }
            answer: true
          - id: l2-c6
            part: build
            type: multiple_choice
            text: "fest + halten = _"
            say: "Welches Verb entsteht? Fest und halten."
            options: ["festhalten", "haltenfest", "festhält"]
            answer: "festhalten"
          - id: l2-c7
            part: build
