# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.reading-strategies
skill: lit-de.comprehension.strategies
curriculum: de-DE
language: de
title:
  de: Lesestrategien
  en: Reading strategies
summary: >
  A plan for reading a Sachtext: before, during and after. Lesson 1 asks
  questions from the title before reading and checks understanding while
  reading (read again, work out a word from the sentence, look it up);
  lesson 2 sums up the main points after reading, leaves out details,
  checks the questions from before, and ends with the skill check. Every
  text is written for Twist.
metadata:
  year: klasse-4
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.comprehension.skim, lit-de.comprehension.notes]
  also_practises: [lit-de.comprehension.notes]
  vocabulary: { de: [Lesestrategie, Überschrift, Frage, Zusammenhang, nachschlagen, zusammenfassen, das Wichtigste, Einzelheit] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: before, what: { de: vor dem Lesen Fragen an einen Text stellen, en: asking questions of a text before reading } }
    - { id: during, what: { de: "beim Lesen prüfen, ob ich alles verstehe, und Unklares klären", en: "checking understanding while reading and clearing up what is unclear" } }
    - { id: after, what: { de: nach dem Lesen das Wichtigste zusammenfassen, en: summing up the main points after reading } }
    - { id: plan, what: { de: "die Schritte vor, beim und nach dem Lesen kennen", en: "knowing the steps before, while and after reading" } }
  misconceptions:
    - id: read-on-regardless
      what: Reads on when a word or sentence is not understood, or gives up on the text
      addressed: lesson 1 Learn names read again, use the sentence, look it up; every stage of lesson 1 asks what to do when something is unclear, with feedback in l1-f5
    - id: summary-is-details
      what: Sums up with a few details or the first sentences instead of the main points
      addressed: lesson 2 Learn separates main points from details; every stage of lesson 2 has a best-summary task and a one-detail summary to reject, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Vor dem Lesen und beim Lesen", en: "Before and while reading" }
    goal:
      de: "Stell Fragen an einen Text, bevor du liest, zum Beispiel wo der Biber lebt. Prüf beim Lesen, ob du alles verstehst."
      en: "Ask questions about a text before you read, such as where the beaver lives. While reading, check that you understand everything."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Du willst schnell wissen, worum es in einem Text geht. Worauf schaust du zuerst?"
            options: ["auf die Überschrift und die Bilder", "auf das letzte Wort", "auf die Seitenzahl"]
            answer: "auf die Überschrift und die Bilder"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "„Der Igel frisst Käfer, Würmer und Schnecken.“ Welche Stichwörter passen?"
            say: "Der Igel frisst Käfer, Würmer und Schnecken. Welche Stichwörter passen zu diesem Satz?"
            options: ["Igel frisst: Käfer, Würmer, Schnecken", "Igel: schläft im Winter", "der, und, frisst"]
            answer: "Igel frisst: Käfer, Würmer, Schnecken"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Biber\n\nWo lebt der Biber? Was frisst er?"
            say: "Bevor du liest, schaust du dir die Überschrift an und überlegst: Was weiß ich schon? Was will ich wissen? Stell dir Fragen an den Text, zum Beispiel: Wo lebt der Biber? Was frisst er?"
          - text: "Der Biber ist ein Nagetier. Er lebt an Flüssen und Seen.\nMit seinen scharfen Zähnen fällt er Bäume."
            say: "Beim Lesen prüfst du immer wieder: Verstehe ich das? Was bedeutet fällen? Lies den Satz noch einmal. Mit scharfen Zähnen Bäume fällen heißt: Er nagt so lange, bis der Baum umfällt."
          - text: "1. noch einmal lesen\n2. im Satz nach Hinweisen suchen\n3. nachschlagen oder fragen"
            say: "Wenn du etwas nicht verstehst, liest du die Stelle noch einmal. Oft hilft der Satz drumherum. Hilft das nicht, schlägst du nach oder fragst jemanden."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ein Text heißt „Der Biber“. Welche Frage kann er dir wahrscheinlich beantworten?"
                options: ["Wo lebt der Biber?", "Wie viele Zähne hat ein Löwe?", "Wann fährt der Bus?"]
                answer: "Wo lebt der Biber?"
                hints:
                  - "Lies die Überschrift. Um welches Tier geht es?"
                  - "Nur eine Frage handelt vom Biber."
                  - "Wo lebt der Biber?"
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Wann machst du das?"
                say: "Sortiere: Machst du das vor dem Lesen, beim Lesen oder nach dem Lesen?"
                bins:
                  - { id: before, show: { text: "vor dem Lesen" }, say: "vor dem Lesen" }
                  - { id: during, show: { text: "beim Lesen" }, say: "beim Lesen" }
                  - { id: after, show: { text: "nach dem Lesen" }, say: "nach dem Lesen" }
                options:
                  - { text: "die Überschrift lesen", bin: before }
                  - { text: "Fragen an den Text stellen", bin: before }
                  - { text: "schwierige Stellen noch einmal lesen", bin: during }
                  - { text: "unbekannte Wörter klären", bin: during }
                  - { text: "das Wichtigste zusammenfassen", bin: after }
                  - { text: "prüfen, ob meine Fragen beantwortet sind", bin: after }
                hints:
                  - "Was kannst du schon tun, bevor du den Text liest?"
                  - "Zusammenfassen kannst du erst, wenn du alles gelesen hast."
                  - "Vor: Überschrift, Fragen. Beim: noch einmal lesen, Wörter klären. Nach: zusammenfassen, Fragen prüfen."
              - id: l1-f3
                type: multiple_choice
                text: "Der Biber\n\nDer Biber ist ein Nagetier. Er lebt an Flüssen und Seen.\nMit seinen scharfen Zähnen fällt er Bäume.\nAus Ästen und Schlamm baut er eine Burg. Der Eingang liegt unter Wasser. So kommen Feinde nicht hinein.\n\nWas bedeutet „fällen“ hier?"
                say: "Lies den Text. Was bedeutet das Wort fällen hier?"
                options: ["Bäume zum Umfallen bringen", "Bäume pflanzen", "auf Bäume klettern"]
                answer: "Bäume zum Umfallen bringen"
                feedback:
                  "Bäume pflanzen": "Lies den Satz noch einmal: Mit scharfen Zähnen pflanzt man nichts. Der Biber nagt, bis der Baum umfällt."
                hints:
                  - "Lies den Satz mit „fällen“ noch einmal."
                  - "Was kann man mit scharfen Zähnen mit einem Baum machen?"
                  - "Er nagt so lange, bis der Baum umfällt."
              - id: l1-f4
                type: true_false
                text: "Der Biber\n\nDer Biber ist ein Nagetier. Er lebt an Flüssen und Seen.\nMit seinen scharfen Zähnen fällt er Bäume.\nAus Ästen und Schlamm baut er eine Burg. Der Eingang liegt unter Wasser. So kommen Feinde nicht hinein.\n\nBeantwortet der Text die Frage: Warum liegt der Eingang unter Wasser?"
                say: "Lies den Text. Beantwortet er die Frage: Warum liegt der Eingang unter Wasser?"
                answer: true
                hints:
                  - "Such die Stelle, in der der Eingang vorkommt."
                  - "Lies den Satz danach."
                  - "Ja: So kommen Feinde nicht hinein."
              - id: l1-f5
                type: multiple_choice
                text: "Du liest einen Satz und verstehst ihn nicht. Was hilft dir zuerst?"
                options: ["den Satz noch einmal langsam lesen", "schneller weiterlesen", "den Text zuklappen"]
                answer: "den Satz noch einmal langsam lesen"
                feedback:
                  "schneller weiterlesen": "Wenn du schnell weiterliest, bleibt die Stelle unklar, und der Rest wird oft auch schwer. Lies sie lieber noch einmal."
                hints:
                  - "Was tust du, damit du die Stelle doch noch verstehst?"
                  - "Beim zweiten Lesen merkt man oft mehr."
                  - "Lies den Satz noch einmal langsam."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ein Text heißt „Bienen machen Honig“. Welche Frage kann er dir wahrscheinlich beantworten?"
                options: ["Woraus machen Bienen Honig?", "Wie schnell fliegt ein Flugzeug?", "Wer hat das Fahrrad erfunden?"]
                answer: "Woraus machen Bienen Honig?"
                hints: ["Lies die Überschrift genau."]
              - id: l1-s2
                type: ordering
                text: "Bring den Leseplan in die richtige Reihenfolge."
                say: "Bring die Schritte des Leseplans in die richtige Reihenfolge."
                options: ["das Wichtigste zusammenfassen", "Fragen an den Text stellen", "den Text lesen und prüfen, ob ich alles verstehe"]
                slot_count: 3
                answer: ["Fragen an den Text stellen", "den Text lesen und prüfen, ob ich alles verstehe", "das Wichtigste zusammenfassen"]
                hints: ["Was machst du, bevor du überhaupt liest?"]
              - id: l1-s3
                type: multiple_choice
                text: "Ein Bienenvolk\n\nIn einem Bienenstock leben viele tausend Bienen. Zusammen bilden sie ein Volk.\nDie Königin legt die Eier.\nDie Arbeiterinnen sammeln Nektar, den süßen Saft der Blüten. Daraus machen sie Honig.\n\nWas ist Nektar?"
                say: "Lies den Text. Was ist Nektar?"
                options: ["der süße Saft der Blüten", "der Bienenstock", "die Königin"]
                answer: "der süße Saft der Blüten"
                hints: ["Manchmal erklärt der Text ein Wort gleich danach."]
              - id: l1-s4
                type: true_false
                text: "Ein Bienenvolk\n\nIn einem Bienenstock leben viele tausend Bienen. Zusammen bilden sie ein Volk.\nDie Königin legt die Eier.\nDie Arbeiterinnen sammeln Nektar, den süßen Saft der Blüten. Daraus machen sie Honig.\n\nBeantwortet der Text die Frage: Wie alt wird eine Biene?"
                say: "Lies den Text. Beantwortet er die Frage: Wie alt wird eine Biene?"
                answer: false
                hints: ["Such eine Stelle, in der es um das Alter geht."]
              - id: l1-s5
                type: multiple_choice
                text: "Ein Wort verstehst du auch nach dem zweiten Lesen nicht. Was machst du?"
                options: ["im Wörterbuch oder Kinderlexikon nachschlagen", "aufhören und den Text nicht fertig lesen", "ein anderes Wort dafür erfinden"]
                answer: "im Wörterbuch oder Kinderlexikon nachschlagen"
                hints: ["Wo kannst du nachsehen, was ein Wort bedeutet?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ein Text heißt „Der Maulwurf“. Welche Frage kann er dir wahrscheinlich beantworten?"
                options: ["Wie gräbt der Maulwurf seine Gänge?", "Wie hoch fliegt ein Adler?", "Was kostet ein Fahrrad?"]
                answer: "Wie gräbt der Maulwurf seine Gänge?"
              - id: l1-n2
                type: sorting
                text: "Wann machst du das?"
                say: "Sortiere: Machst du das vor dem Lesen, beim Lesen oder nach dem Lesen?"
                bins:
                  - { id: before, show: { text: "vor dem Lesen" }, say: "vor dem Lesen" }
                  - { id: during, show: { text: "beim Lesen" }, say: "beim Lesen" }
                  - { id: after, show: { text: "nach dem Lesen" }, say: "nach dem Lesen" }
                options:
                  - { text: "die Bilder ansehen", bin: before }
                  - { text: "überlegen, was ich schon weiß", bin: before }
                  - { text: "mich fragen: Verstehe ich das?", bin: during }
                  - { text: "ein unbekanntes Wort nachschlagen", bin: during }
                  - { text: "den Text in eigenen Worten erzählen", bin: after }
                  - { text: "meine Fragen beantworten", bin: after }
              - id: l1-n3
                type: multiple_choice
                text: "Der Maulwurf\n\nDer Maulwurf lebt unter der Erde. Mit seinen breiten Vorderpfoten gräbt er lange Gänge.\nEr sieht sehr schlecht. Dafür riecht und fühlt er sehr gut.\nDie Erde, die er beim Graben nach oben schiebt, bildet kleine Hügel auf der Wiese.\n\nWas sind die kleinen Hügel auf der Wiese?"
                say: "Lies den Text. Was sind die kleinen Hügel auf der Wiese?"
                options: ["Erde, die der Maulwurf nach oben schiebt", "Nester von Vögeln", "Steine, die dort liegen"]
                answer: "Erde, die der Maulwurf nach oben schiebt"
              - id: l1-n4
                type: true_false
                text: "Der Maulwurf\n\nDer Maulwurf lebt unter der Erde. Mit seinen breiten Vorderpfoten gräbt er lange Gänge.\nEr sieht sehr schlecht. Dafür riecht und fühlt er sehr gut.\nDie Erde, die er beim Graben nach oben schiebt, bildet kleine Hügel auf der Wiese.\n\nBeantwortet der Text die Frage: Wie gut sieht der Maulwurf?"
                say: "Lies den Text. Beantwortet er die Frage: Wie gut sieht der Maulwurf?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Beim Lesen merkst du: Ich weiß nicht mehr, worum es im letzten Absatz ging. Was machst du?"
                options: ["den Absatz noch einmal lesen", "mit dem nächsten Text anfangen", "nur noch die Bilder anschauen"]
                answer: "den Absatz noch einmal lesen"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ein Text heißt „Wie Vögel ihre Nester bauen“. Welche Frage kann er dir wahrscheinlich beantworten?"
            options: ["Woraus bauen Vögel ihre Nester?", "Wie viele Beine hat eine Spinne?", "Wann beginnen die Ferien?"]
            answer: "Woraus bauen Vögel ihre Nester?"
          - id: l1-c2
            type: multiple_choice
            text: "„Der Igel rollt sich zusammen. Seine Stacheln schützen ihn vor Feinden.“ Was bedeutet „schützen“ hier?"
            say: "Der Igel rollt sich zusammen. Seine Stacheln schützen ihn vor Feinden. Was bedeutet schützen hier?"
            options: ["dafür sorgen, dass ihm nichts passiert", "angreifen", "füttern"]
            answer: "dafür sorgen, dass ihm nichts passiert"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Beim Lesen prüfst du immer wieder, ob du alles verstehst."
            say: "Stimmt das? Beim Lesen prüfst du immer wieder, ob du alles verstehst."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Die Schnecke\n\nSchnecken kriechen sehr langsam. Dabei hinterlassen sie eine Spur aus Schleim. Der Schleim ist glitschig und schützt den Fuß der Schnecke.\n\nWas bedeutet „glitschig“ hier?"
            say: "Lies den Text. Was bedeutet glitschig hier?"
            options: ["so feucht und glatt, dass man leicht abrutscht", "sehr hart und spitz", "bunt gefärbt"]
            answer: "so feucht und glatt, dass man leicht abrutscht"
          - id: l1-c5
            type: true_false
            text: "Ein Text heißt „Wie wird aus Milch Käse?“\n\nStimmt das? Der Text beantwortet dir wahrscheinlich die Frage: Wie viele Kühe gibt es in Deutschland?"
            say: "Ein Text heißt: Wie wird aus Milch Käse? Stimmt das? Der Text beantwortet dir wahrscheinlich die Frage: Wie viele Kühe gibt es in Deutschland?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Beim Lesen stolperst du über das Wort „Kokon“. Auch nach dem zweiten Lesen weißt du nicht, was es heißt. Was ist jetzt sinnvoll?"
            say: "Beim Lesen stolperst du über das Wort Kokon. Auch nach dem zweiten Lesen weißt du nicht, was es heißt. Was ist jetzt sinnvoll?"
            options: ["im Kinderlexikon nachschlagen oder jemanden fragen", "den ganzen Text noch einmal von vorne lesen", "das Wort durch „Ding“ ersetzen und weiterlesen"]
            answer: "im Kinderlexikon nachschlagen oder jemanden fragen"

  - n: 2
    title: { de: "Nach dem Lesen zusammenfassen", en: "Summing up after reading" }
    goal:
      de: "Fass nach dem Lesen das Wichtigste kurz in deinen eigenen Worten zusammen und lass Einzelheiten weg."
      en: "After reading, sum up the main points briefly in your own words and leave out the details."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ein Text heißt „Der Fuchs“. Welche Frage kann er dir wahrscheinlich beantworten?"
            options: ["Wo wohnt der Fuchs?", "Wie heißt der höchste Berg der Welt?", "Wie backt man Brot?"]
            answer: "Wo wohnt der Fuchs?"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Du verstehst ein Wort nicht. Was machst du zuerst?"
            options: ["den Satz noch einmal lesen und im Zusammenhang überlegen", "das Wort einfach weglassen", "den Text weglegen"]
            answer: "den Satz noch einmal lesen und im Zusammenhang überlegen"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Wie entsteht Regen?\n\nDie Sonne wärmt das Wasser in Meeren, Seen und Pfützen. Ein Teil des Wassers verdunstet. Es steigt als unsichtbarer Wasserdampf nach oben.\nOben ist die Luft kalt. Der Dampf kühlt ab, und es entstehen winzige Tröpfchen. Viele Tröpfchen zusammen bilden eine Wolke.\nDie Tröpfchen stoßen zusammen und werden größer. Wenn sie zu schwer sind, fallen sie als Regen auf die Erde."
            say: "Nach dem Lesen fasst du zusammen. Frag dich: Was ist das Wichtigste? Was würde ich jemandem erzählen, der den Text nicht kennt?"
          - text: "Die Sonne wärmt Wasser, es verdunstet und steigt auf. Oben bilden sich Wolken aus Tröpfchen. Werden die Tropfen zu schwer, fällt Regen."
            say: "Eine Zusammenfassung ist kurz. Sie nennt die wichtigsten Punkte in der richtigen Reihenfolge, in deinen eigenen Worten."
          - text: "wichtig: Wasser verdunstet.\nEinzelheit: Es gibt Meere, Seen und Pfützen."
            say: "Einzelheiten lässt du weg. Zum Schluss prüfst du: Kann ich jetzt die Fragen beantworten, die ich mir vor dem Lesen gestellt habe?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie entsteht Regen?\n\nDie Sonne wärmt das Wasser in Meeren, Seen und Pfützen. Ein Teil des Wassers verdunstet. Es steigt als unsichtbarer Wasserdampf nach oben.\nOben ist die Luft kalt. Der Dampf kühlt ab, und es entstehen winzige Tröpfchen. Viele Tröpfchen zusammen bilden eine Wolke.\nDie Tröpfchen stoßen zusammen und werden größer. Wenn sie zu schwer sind, fallen sie als Regen auf die Erde.\n\nWelche Zusammenfassung passt am besten?"
                say: "Lies den Text. Welche Zusammenfassung passt am besten?"
                options:
                  - "Wasser verdunstet in der Wärme und steigt auf. Oben wird es zu Wolken. Schwere Tropfen fallen als Regen."
                  - "Es gibt Meere, Seen und Pfützen. Oben ist die Luft kalt."
                  - "Regen ist nass, und viele Kinder mögen keinen Regen."
                answer: "Wasser verdunstet in der Wärme und steigt auf. Oben wird es zu Wolken. Schwere Tropfen fallen als Regen."
                option_audio: false
                feedback:
                  "Es gibt Meere, Seen und Pfützen. Oben ist die Luft kalt.": "Diese Sätze stehen im Text, aber es sind Einzelheiten. Sie erklären nicht, wie Regen entsteht."
                  "Regen ist nass, und viele Kinder mögen keinen Regen.": "Das steht nicht im Text. Eine Zusammenfassung gibt wieder, was der Text sagt."
                hints:
                  - "Die Überschrift fragt: Wie entsteht Regen? Welche Zusammenfassung beantwortet das?"
                  - "Die richtige nennt alle Schritte: verdunsten, Wolken, Regen."
                  - "Wasser verdunstet, wird zu Wolken, schwere Tropfen fallen."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Wie entsteht Regen?\n\nDie Sonne wärmt das Wasser in Meeren, Seen und Pfützen. Ein Teil des Wassers verdunstet. Es steigt als unsichtbarer Wasserdampf nach oben.\nOben ist die Luft kalt. Der Dampf kühlt ab, und es entstehen winzige Tröpfchen. Viele Tröpfchen zusammen bilden eine Wolke.\nDie Tröpfchen stoßen zusammen und werden größer. Wenn sie zu schwer sind, fallen sie als Regen auf die Erde.\n\nBring die wichtigsten Punkte in die Reihenfolge des Textes."
                say: "Bring die wichtigsten Punkte aus dem Text über den Regen in die richtige Reihenfolge."
                options: ["Tröpfchen bilden Wolken.", "Die Sonne wärmt das Wasser.", "Schwere Tropfen fallen als Regen.", "Wasserdampf steigt auf und kühlt ab."]
                slot_count: 4
                answer: ["Die Sonne wärmt das Wasser.", "Wasserdampf steigt auf und kühlt ab.", "Tröpfchen bilden Wolken.", "Schwere Tropfen fallen als Regen."]
                hints:
                  - "Womit fängt alles an?"
                  - "Erst muss das Wasser warm werden, dann steigt es auf."
                  - "Sonne, Dampf steigt auf, Wolken, Regen."
              - id: l2-f3
                type: true_false
                text: "Das Eichhörnchen\n\nEichhörnchen leben im Wald und in Parks. Sie klettern sehr gut. Ihr buschiger Schwanz hilft ihnen, beim Springen das Gleichgewicht zu halten.\nIm Herbst sammeln sie Nüsse und Samen und vergraben sie als Vorrat. Viele Verstecke finden sie nicht wieder. Daraus können neue Bäume wachsen.\nIm Winter schlafen Eichhörnchen viel, aber sie halten keinen Winterschlaf.\n\nIst das eine gute Zusammenfassung? „Eichhörnchen haben einen buschigen Schwanz.“"
                say: "Lies den Text. Ist das eine gute Zusammenfassung: Eichhörnchen haben einen buschigen Schwanz?"
                answer: false
                hints:
                  - "Nennt der Satz das Wichtigste aus allen Absätzen?"
                  - "Was machen Eichhörnchen im Herbst und im Winter?"
                  - "Nein. Der Satz nennt nur eine Einzelheit."
              - id: l2-f4
                type: multiple_choice
                text: "Das Eichhörnchen\n\nEichhörnchen leben im Wald und in Parks. Sie klettern sehr gut. Ihr buschiger Schwanz hilft ihnen, beim Springen das Gleichgewicht zu halten.\nIm Herbst sammeln sie Nüsse und Samen und vergraben sie als Vorrat. Viele Verstecke finden sie nicht wieder. Daraus können neue Bäume wachsen.\nIm Winter schlafen Eichhörnchen viel, aber sie halten keinen Winterschlaf.\n\nZusammenfassung: „Eichhörnchen leben im Wald und in Parks und klettern gut. Im Winter schlafen sie viel.“ Welcher wichtige Punkt fehlt?"
                say: "Lies den Text und die Zusammenfassung. Welcher wichtige Punkt fehlt?"
                options: ["Im Herbst vergraben sie Nüsse als Vorrat.", "Der Wald ist groß.", "Eichhörnchen sind Tiere."]
                answer: "Im Herbst vergraben sie Nüsse als Vorrat."
                option_audio: false
                hints:
                  - "Geh die Absätze durch. Zu welchem Absatz steht nichts in der Zusammenfassung?"
                  - "Der mittlere Absatz handelt vom Herbst."
                  - "Es fehlt: Im Herbst vergraben sie Nüsse als Vorrat."
              - id: l2-f5
                type: multiple_choice
