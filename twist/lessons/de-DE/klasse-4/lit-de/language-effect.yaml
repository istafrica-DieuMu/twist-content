# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.language-effect
skill: lit-de.vocabulary.language-effect
curriculum: de-DE
language: de
title:
  de: Wie Sprache wirkt
  en: How language works on people
summary: >
  The same thing can be said in different ways, and each way works
  differently on the listener. Lesson 1 sets a polite request against a
  command, sorts friendly from rude and hurtful sentences, asks how the
  other person feels, and turns a reproach into an Ich-Botschaft. Lesson 2
  sets sachlich against werbend, finds the words that advertise (super,
  am besten, nur heute), learns that a reason convinces more than
  shouting, and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Sprache untersuchen, en: Exploring language }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.comprehension.infer]
  also_practises: [lit-de.comprehension.infer]
  vocabulary: { de: [höflich, unhöflich, verletzend, Wirkung, Ich-Botschaft, sachlich, werbend, überzeugen, Begründung] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: polite, what: { de: höfliche und unhöfliche Sätze unterscheiden, en: telling polite from rude sentences } }
    - { id: effect, what: { de: "sagen, wie ein Satz auf andere wirkt", en: saying how a sentence makes others feel } }
    - { id: i-message, what: { de: eine Ich-Botschaft statt eines Vorwurfs wählen, en: choosing an I-message instead of a reproach } }
    - { id: factual-advert, what: { de: sachliche und werbende Sprache unterscheiden, en: telling factual from advertising language } }
    - { id: convince, what: { de: mit einem Grund überzeugen, en: persuading with a reason } }
  misconceptions:
    - id: only-content-counts
      what: Thinks only what is said matters, not how it is said; a command and a polite request feel the same, and a hurtful word is fine if it was a joke
      addressed: "lesson 1 Learn sets a command against a request and a reproach against an Ich-Botschaft; l1-f1 (with feedback), l1-s1, l1-n1 and l2-c1 choose the polite version; l1-f3, l1-s3, l1-n3 ask how the listener feels; l1-f5 asks about nur Spaß"
    - id: loud-convinces
      what: Thinks big words, exclamation marks or insisting make a stronger case than a reason
      addressed: "lesson 2 Learn shows a request with weil; l2-f3 (with feedback), l2-s3, l2-n3 and l2-c4 choose the sentence that convinces; l2-f1, l2-s1, l2-n1 and l2-c3 tell sachlich from werbend"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Freundlich oder verletzend?", en: "Kind or hurtful?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Tim knallt die Tür zu und stampft mit dem Fuß. Wie fühlt er sich?"
            options: ["wütend", "fröhlich", "müde"]
            answer: "wütend"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Lisa strahlt über das ganze Gesicht und hüpft durch den Flur. Wie fühlt sie sich?"
            options: ["froh", "traurig", "ängstlich"]
            answer: "froh"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "„Gib mir sofort den Kleber!“\n„Kannst du mir bitte den Kleber geben?“"
            say: "Beide Kinder wollen dasselbe: den Kleber. Aber die Sätze wirken ganz verschieden. Der erste ist ein Befehl und klingt unfreundlich. Der zweite ist eine Bitte. Dem zweiten Kind hilft man viel lieber."
          - text: "„Du bist so blöd! Du hast mein Bild kaputt gemacht!“\n„Ich bin traurig, weil mein Bild kaputt ist.“"
            say: "Auch wenn du dich ärgerst, kannst du wählen, wie du es sagst. Ein Schimpfwort verletzt den anderen, und dann gibt es Streit. Im zweiten Satz sagst du, wie es dir geht. Das nennt man eine Ich-Botschaft. So kann der andere zuhören."
          - text: "freundlich: bitte, danke, Entschuldigung, Könntest du ...?\nunhöflich oder verletzend: Befehle, Schimpfwörter, Auslachen"
            say: "Mit Wörtern wie bitte, danke und Entschuldigung zeigst du Respekt. Schimpfwörter und Auslachen tun weh. Das gilt auch, wenn man danach sagt: War doch nur Spaß. Frag dich immer: Wie fühlt sich der andere, wenn er meinen Satz hört?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Du möchtest, dass Paul dir sein Lineal leiht. Welcher Satz ist höflich?"
                options: ["Kannst du mir bitte dein Lineal leihen?", "Lineal her, aber sofort!", "Gib mal das Lineal, du Schnecke."]
                answer: "Kannst du mir bitte dein Lineal leihen?"
                feedback:
                  "Lineal her, aber sofort!": "Das ist ein Befehl. Paul fühlt sich herumkommandiert und hilft dir vielleicht nicht gern."
                hints:
                  - "Welcher Satz ist eine Bitte und kein Befehl?"
                  - "Achte auf das Wort bitte."
                  - "Kannst du mir bitte dein Lineal leihen?"
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Freundlich oder unhöflich?"
                say: "Sortiere: Ist der Satz freundlich oder unhöflich?"
                bins:
                  - { id: kind, show: { text: "freundlich" }, say: "freundlich" }
                  - { id: rude, show: { text: "unhöflich" }, say: "unhöflich" }
                options:
                  - { text: "Danke, dass du mir geholfen hast.", bin: kind }
                  - { text: "Entschuldigung, ich habe dich nicht gesehen.", bin: kind }
                  - { text: "Geh weg, du nervst!", bin: rude }
                  - { text: "Halt die Klappe!", bin: rude }
                hints:
                  - "Wie würdest du dich fühlen, wenn jemand das zu dir sagt?"
                  - "Danke und Entschuldigung sind freundliche Wörter."
                  - "Danke und Entschuldigung: freundlich. Geh weg und Halt die Klappe: unhöflich."
              - id: l1-f3
                type: multiple_choice
                text: "Jana ruft vor allen: „Haha, Kai kann ja nicht mal einen Ball fangen!“\n\nWie fühlt sich Kai wahrscheinlich?"
                say: "Jana ruft vor allen: Haha, Kai kann ja nicht mal einen Ball fangen! Wie fühlt sich Kai wahrscheinlich?"
                options: ["verletzt", "stolz", "fröhlich"]
                answer: "verletzt"
                hints:
                  - "Jana lacht Kai vor allen aus."
                  - "Wie fühlt man sich, wenn andere über einen lachen?"
                  - "Kai ist verletzt."
              - id: l1-f4
                type: multiple_choice
                text: "Leo drängelt sich in der Schlange vor dich. Welcher Satz sagt freundlich, aber klar, was dich stört?"
                options: ["Ich ärgere mich, weil ich schon lange warte.", "Du bist ein gemeiner Drängler!", "Ist doch egal."]
                answer: "Ich ärgere mich, weil ich schon lange warte."
                hints:
                  - "Eine Ich-Botschaft beginnt oft mit ich."
                  - "Sag, wie es dir geht, ohne zu schimpfen."
                  - "Ich ärgere mich, weil ich schon lange warte."
              - id: l1-f5
                type: true_false
                text: "Ein verletzendes Wort tut auch weh, wenn man danach sagt: „War doch nur Spaß.“ Stimmt das?"
                say: "Ein verletzendes Wort tut auch weh, wenn man danach sagt: War doch nur Spaß. Stimmt das?"
                answer: true
                hints:
                  - "Wer bestimmt, ob etwas wehtut?"
                  - "Der andere hat das Wort ja trotzdem gehört."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "„Mach das Fenster zu!“ Wie sagst du das höflicher?"
                say: "Mach das Fenster zu! Wie sagst du das höflicher?"
                options: ["Könntest du bitte das Fenster schließen?", "Fenster zu, los!", "Mach endlich das Fenster zu!"]
                answer: "Könntest du bitte das Fenster schließen?"
                hints: ["Welcher Satz ist eine Frage mit bitte?"]
              - id: l1-s2
                type: sorting
                text: "Freundlich oder unhöflich?"
                say: "Sortiere: Ist der Satz freundlich oder unhöflich?"
                bins:
                  - { id: kind, show: { text: "freundlich" }, say: "freundlich" }
                  - { id: rude, show: { text: "unhöflich" }, say: "unhöflich" }
                options:
                  - { text: "Magst du mitspielen?", bin: kind }
                  - { text: "Das hast du toll gemacht.", bin: kind }
                  - { text: "Mit dir spielt keiner!", bin: rude }
                  - { text: "Das kann ja jedes Baby.", bin: rude }
                hints: ["Welche Sätze machen den anderen froh?"]
              - id: l1-s3
                type: multiple_choice
                text: "Oma sagt: „Danke für dein schönes Bild. Es hängt jetzt in meiner Küche.“\n\nWie fühlt sich das Kind?"
                say: "Oma sagt: Danke für dein schönes Bild. Es hängt jetzt in meiner Küche. Wie fühlt sich das Kind?"
                options: ["froh", "beleidigt", "gelangweilt"]
                answer: "froh"
                hints: ["Oma bedankt sich und lobt das Bild."]
              - id: l1-s4
                type: multiple_choice
                text: "Mira nimmt deinen Stift, ohne zu fragen. Welcher Satz ist eine Ich-Botschaft?"
                options: ["Ich möchte gefragt werden, bevor du meinen Stift nimmst.", "Du Diebin!", "Du nimmst immer alles weg!"]
                answer: "Ich möchte gefragt werden, bevor du meinen Stift nimmst."
                hints: ["Welcher Satz sagt, was du dir wünschst?"]
              - id: l1-s5
                type: true_false
                text: "„Könntest du bitte leiser sein?“ ist höflicher als „Sei still!“. Stimmt das?"
                say: "Könntest du bitte leiser sein? Das ist höflicher als: Sei still! Stimmt das?"
                answer: true
                hints: ["Welcher Satz ist eine Bitte?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Du sitzt bei deiner Freundin am Tisch und möchtest das Salz. Welcher Satz passt?"
                options: ["Reichst du mir bitte das Salz?", "Salz!", "Her mit dem Salz!"]
                answer: "Reichst du mir bitte das Salz?"
              - id: l1-n2
                type: sorting
                text: "Freundlich oder unhöflich?"
                say: "Sortiere: Ist der Satz freundlich oder unhöflich?"
                bins:
                  - { id: kind, show: { text: "freundlich" }, say: "freundlich" }
                  - { id: rude, show: { text: "unhöflich" }, say: "unhöflich" }
                options:
                  - { text: "Soll ich dir beim Tragen helfen?", bin: kind }
                  - { text: "Tut mir leid, das wollte ich nicht.", bin: kind }
                  - { text: "Du bist so dumm!", bin: rude }
                  - { text: "Hau ab, das ist unser Platz!", bin: rude }
              - id: l1-n3
                type: multiple_choice
                text: "Unter Ellas Foto in der Klassengruppe schreibt jemand: „Hässlich!“\n\nWie fühlt sich Ella wahrscheinlich?"
                say: "Unter Ellas Foto in der Klassengruppe schreibt jemand: Hässlich! Wie fühlt sich Ella wahrscheinlich?"
                options: ["verletzt", "stolz", "gleichgültig"]
                answer: "verletzt"
              - id: l1-n4
                type: multiple_choice
                text: "Dein Bruder hört laute Musik, während du Hausaufgaben machst. Welcher Satz ist eine Ich-Botschaft?"
                options: ["Ich kann mich nicht konzentrieren, wenn die Musik so laut ist.", "Du bist so nervig!", "Mach sofort die doofe Musik aus!"]
                answer: "Ich kann mich nicht konzentrieren, wenn die Musik so laut ist."
              - id: l1-n5
                type: multiple_choice
                text: "Du merkst, dass dein Satz jemanden verletzt hat. Was kannst du tun?"
                options: ["mich entschuldigen", "laut darüber lachen", "den Satz noch einmal sagen"]
                answer: "mich entschuldigen"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welcher Satz ist höflich?"
            options: ["Darf ich bitte vorbei?", "Weg da!", "Mach Platz, du Trödler!"]
            answer: "Darf ich bitte vorbei?"
          - id: l1-c2
            type: true_false
            text: "„Danke, dass du auf mich gewartet hast!“ Ist das ein verletzender Satz?"
            say: "Danke, dass du auf mich gewartet hast! Ist das ein verletzender Satz?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Welcher Satz ist eine Ich-Botschaft?"
            options: ["Ich bin traurig, weil du nicht auf mich gewartet hast.", "Du bist so gemein!", "Immer vergisst du mich!"]
            answer: "Ich bin traurig, weil du nicht auf mich gewartet hast."
          - id: l1-c4
            type: multiple_choice
            text: "Ida macht beim Vorlesen einen Fehler. Max lacht laut darüber.\n\nWie fühlt sich Ida wahrscheinlich?"
            say: "Ida macht beim Vorlesen einen Fehler. Max lacht laut darüber. Wie fühlt sich Ida wahrscheinlich?"
            options: ["beschämt", "stolz", "fröhlich"]
            answer: "beschämt"
          - id: l1-c5
            type: true_false
            text: "„Darf ich mal sehen?“ Ist das eine höfliche Frage?"
            say: "Darf ich mal sehen? Ist das eine höfliche Frage?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Mit welchen Wörtern zeigst du Respekt?"
            options: ["bitte, danke, Entschuldigung", "sofort, los, schnell", "doof, blöd, nervig"]
            answer: "bitte, danke, Entschuldigung"

  - n: 2
    title: { de: "Sachlich, werbend, überzeugend", en: "Factual, advertising, persuasive" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "„Gib mir das Buch!“ Wie sagst du das höflicher?"
            say: "Gib mir das Buch! Wie sagst du das höflicher?"
            options: ["Gibst du mir bitte das Buch?", "Buch her!", "Das Buch, aber schnell!"]
            answer: "Gibst du mir bitte das Buch?"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Bei einer Ich-Botschaft sagst du, wie es dir geht. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "sachlich:\nDer Apfelsaft kostet 1,50 €. Er ist aus Äpfeln vom Bodensee.\n\nwerbend:\nDer beste Apfelsaft der Welt! Nur heute! Greif zu!"
            say: "Beide Texte sprechen über denselben Saft. Der erste ist sachlich. Er nennt Tatsachen, ruhig und genau. Der zweite ist werbend. Er will, dass du den Saft kaufst. Dafür benutzt er große Wörter, viele Ausrufezeichen und sagt: Nur heute."
          - text: "„Wir wünschen uns eine Bank auf dem Schulhof, weil sich die Kleinen in der Pause ausruhen wollen.“"
            say: "Wer jemanden überzeugen will, nennt einen Grund. Oft steht er nach dem Wort weil. Lautes Rufen oder Sätze wie: Weil ich es will, überzeugen niemanden."
          - text: "werbende Wörter:\nder, die, das Beste\nsuper, mega, toll\nnur heute, jetzt, sofort\nviele Ausrufezeichen!!!"
            say: "An diesen Wörtern erkennst du werbende Sprache. Wenn du sie liest, frag dich: Will mich hier jemand zu etwas überreden?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Satz über das Fahrrad ist sachlich?"
                options: ["Das Fahrrad hat sieben Gänge und wiegt zwölf Kilo.", "Das coolste Fahrrad aller Zeiten!", "Kauf es jetzt, sonst ist es weg!"]
                answer: "Das Fahrrad hat sieben Gänge und wiegt zwölf Kilo."
                feedback:
                  "Das coolste Fahrrad aller Zeiten!": "Das klingt toll, sagt aber nichts Genaues. Coolste ist ein werbendes Wort."
                hints:
                  - "Ein sachlicher Satz nennt Tatsachen."
                  - "Welcher Satz hat genaue Angaben?"
                  - "Sieben Gänge und zwölf Kilo sind Tatsachen."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Sachlich oder werbend?"
                say: "Sortiere: Ist der Satz sachlich oder werbend?"
                bins:
                  - { id: factual, show: { text: "sachlich" }, say: "sachlich" }
                  - { id: advert, show: { text: "werbend" }, say: "werbend" }
                options:
                  - { text: "Das Freibad öffnet um neun Uhr.", bin: factual }
                  - { text: "Der Roller hat zwei Räder und eine Klingel.", bin: factual }
                  - { text: "Mega Spaß im Freibad, komm sofort!", bin: advert }
                  - { text: "Der allerbeste Roller, nur heute billiger!", bin: advert }
                hints:
                  - "Achte auf Wörter wie mega, sofort und nur heute."
                  - "Sachliche Sätze klingen ruhig und genau."
                  - "Öffnungszeit und Räder: sachlich. Mega Spaß und allerbeste Roller: werbend."
              - id: l2-f3
                type: multiple_choice
                text: "Deine Klasse möchte einen Ausflug in den Wald machen. Welcher Satz überzeugt eure Lehrerin am ehesten?"
                options: ["Im Wald können wir Tiere beobachten und viel für den Sachunterricht lernen.", "Wald! Wald! Wald!", "Weil wir es eben wollen."]
                answer: "Im Wald können wir Tiere beobachten und viel für den Sachunterricht lernen."
                feedback:
                  "Weil wir es eben wollen.": "Das ist kein echter Grund. Die Lehrerin will wissen, warum der Ausflug gut ist."
                hints:
                  - "Was überzeugt: ein Grund oder lautes Rufen?"
                  - "Welcher Satz sagt, warum der Ausflug sinnvoll ist?"
                  - "Im Wald können wir Tiere beobachten und viel lernen."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf die werbenden Wörter."
                say: "Lies den Satz. Tippe auf die zwei werbenden Wörter."
                show: { drawn: letter-card, text: "Das allerbeste Spiel, mega spannend für dich!" }
                spans: ["allerbeste", "mega"]
                hints:
                  - "Welche Wörter übertreiben?"
                  - "Ein Wort macht aus beste noch mehr, das andere bedeutet so viel wie super."
                  - "Die Wörter allerbeste und mega."
              - id: l2-f5
                type: multiple_choice
                text: "Woran erkennst du werbende Sprache?"
                options: ["an Wörtern wie super, am besten und nur heute", "an genauen Zahlen", "an ruhigen Sätzen ohne Ausrufezeichen"]
                answer: "an Wörtern wie super, am besten und nur heute"
                hints:
                  - "Wie klingt ein Satz, der dich zum Kaufen bringen will?"
                  - "Werbung übertreibt gern."
                  - "An Wörtern wie super, am besten und nur heute."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Satz über den Zoo ist sachlich?"
                options: ["Der Zoo ist jeden Tag von 9 bis 18 Uhr geöffnet.", "Der tollste Zoo der Welt!", "Komm sofort in den Zoo!"]
                answer: "Der Zoo ist jeden Tag von 9 bis 18 Uhr geöffnet."
                hints: ["Welcher Satz nennt eine genaue Angabe?"]
              - id: l2-s2
                type: sorting
                text: "Sachlich oder werbend?"
                say: "Sortiere: Ist der Satz sachlich oder werbend?"
                bins:
                  - { id: factual, show: { text: "sachlich" }, say: "sachlich" }
                  - { id: advert, show: { text: "werbend" }, say: "werbend" }
                options:
                  - { text: "Das Buch hat 120 Seiten.", bin: factual }
                  - { text: "Die Bücherei ist am Montag geschlossen.", bin: factual }
                  - { text: "Das spannendste Buch des Jahres!", bin: advert }
                  - { text: "Jetzt zugreifen, solange es noch da ist!", bin: advert }
                hints: ["Welche Sätze wollen dich überreden?"]
              - id: l2-s3
                type: multiple_choice
                text: "Du möchtest deine Eltern überzeugen, dass ihr einen Hund bekommt. Welcher Satz überzeugt am ehesten?"
                options: ["Ich gehe jeden Tag mit ihm raus und kümmere mich ums Füttern.", "Alle anderen haben auch einen!", "Ich will aber!"]
                answer: "Ich gehe jeden Tag mit ihm raus und kümmere mich ums Füttern."
                hints: ["Was ist für deine Eltern ein guter Grund?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf die werbenden Wörter."
                say: "Lies den Satz. Tippe auf die zwei werbenden Wörter."
                show: { drawn: letter-card, text: "Der superschnelle Roller fährt am allerbesten." }
                spans: ["superschnelle", "allerbesten"]
                hints: ["Welche Wörter übertreiben?"]
              - id: l2-s5
                type: true_false
                text: "Ein Text mit vielen Ausrufezeichen und Wörtern wie mega will dich oft zu etwas überreden. Stimmt das?"
                answer: true
                hints: ["Woran erkennst du Werbung?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Satz über die Turnschuhe ist sachlich?"
                options: ["Die Turnschuhe gibt es in den Größen 28 bis 40.", "Die besten Turnschuhe überhaupt!", "Nur heute: Schnapp sie dir!"]
                answer: "Die Turnschuhe gibt es in den Größen 28 bis 40."
              - id: l2-n2
                type: sorting
                text: "Sachlich oder werbend?"
                say: "Sortiere: Ist der Satz sachlich oder werbend?"
                bins:
                  - { id: factual, show: { text: "sachlich" }, say: "sachlich" }
                  - { id: advert, show: { text: "werbend" }, say: "werbend" }
                options:
                  - { text: "Der Bus fährt alle zehn Minuten.", bin: factual }
                  - { text: "Der Kuchen enthält Mehl, Eier und Zucker.", bin: factual }
                  - { text: "Super lecker, super billig, super Kuchen!", bin: advert }
                  - { text: "Nie war Busfahren so toll!", bin: advert }
              - id: l2-n3
                type: multiple_choice
                text: "Mia möchte Klassensprecherin werden. Welcher Satz überzeugt am meisten?"
                options: ["Ich höre allen zu und bringe eure Wünsche zu unserer Lehrerin.", "Wählt mich, ich bin die Beste!", "Wer mich nicht wählt, ist doof."]
                answer: "Ich höre allen zu und bringe eure Wünsche zu unserer Lehrerin."
              - id: l2-n4
                type: multiple_choice
                text: "„Die mega leckerste Pizza aller Zeiten!“ Welcher Satz sagt sachlich etwas über die Pizza?"
                say: "Die mega leckerste Pizza aller Zeiten! Welcher Satz sagt sachlich etwas über die Pizza?"
                options: ["Die Pizza ist mit Tomaten und Käse belegt.", "Die Pizza ist einfach unschlagbar!", "Diese Pizza musst du sofort probieren!"]
                answer: "Die Pizza ist mit Tomaten und Käse belegt."
              - id: l2-n5
                type: multiple_choice
                text: "Warum steht in der Werbung oft „nur heute“?"
                say: "Warum steht in der Werbung oft: nur heute?"
                options: ["Damit du schnell kaufst, ohne lange nachzudenken.", "Weil der Laden morgen schließt.", "Damit du die Uhrzeit weißt."]
                answer: "Damit du schnell kaufst, ohne lange nachzudenken."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
