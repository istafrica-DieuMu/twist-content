# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.interview
skill: lit-de.speaking.interview
curriculum: de-DE
language: de
title:
  de: Ein Interview führen
  en: Holding an interview
summary: >
  Planning an interview and noting the answers. Lesson 1 prepares
  questions: open W-Fragen instead of Ja-Nein-Fragen, questions that fit
  the goal of the interview, and a polite start and end; lesson 2 holds
  the interview with a baker, follows up with a Nachfrage, notes the
  answers as Stichwörter, and ends with the skill check. The people and
  answers are written for Twist. The speak tasks run as the
  record-and-compare fallback and are never scored. The skill check marks
  what a screen can mark (open questions, questions that fit the goal, the
  order of an interview, the Nachfrage and the note); asking the questions
  aloud is practised, not marked.
metadata:
  year: klasse-4
  topic: { de: Gespräche führen, en: Having conversations }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.speaking.argue, lit-de.sentences.questions]
  also_practises: [lit-de.sentences.questions, lit-de.comprehension.notes]
  vocabulary: { de: [Interview, Interviewpartnerin, offene Frage, Ja-Nein-Frage, W-Frage, nachfragen, Nachfrage, notieren, Stichwort] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: open-questions, what: { de: offene Fragen statt Ja-Nein-Fragen stellen, en: asking open questions instead of yes/no questions } }
    - { id: goal, what: { de: Fragen passend zum Ziel vorbereiten, en: preparing questions that fit the goal } }
    - { id: structure, what: { de: den Ablauf eines Interviews kennen, en: knowing the order of an interview } }
    - { id: follow-up, what: { de: zur Antwort passend nachfragen, en: asking a follow-up question about the answer } }
    - { id: notes, what: { de: Antworten in Stichwörtern notieren, en: noting answers as key words } }
  misconceptions:
    - id: yes-no-questions
      what: Asks Ja-Nein-Fragen and gets one-word answers
      addressed: "lesson 1 Learn turns a Ja-Nein-Frage into a W-Frage; l1-f1, l1-s1, l1-n1 and l2-c1 sort or choose open questions, with feedback on l1-f2 for the Ja-Nein-Frage"
    - id: next-question-regardless
      what: Reads out the next prepared question without listening to the answer
      addressed: "lesson 2 Learn shows a Nachfrage; l2-f2, l2-s2, l2-n2 and l2-c4 choose the Nachfrage that picks up the answer, with feedback on l2-f2 for the next prepared question"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gute Fragen vorbereiten", en: "Preparing good questions" }
    goal:
      de: "Bereite gute Fragen für ein Interview vor. Mit W-Fragen erfährst du viel mehr als mit Ja-Nein-Fragen."
      en: "Prepare good questions for an interview. Questions with who, what, why and how get you much more than yes or no questions."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welches Fragewort passt?"
            say: "Welches Fragewort passt in die Lücke?"
            frame: "_ wohnst du? In Köln."
            options: ["Wo", "Wann", "Wer"]
            answer: ["Wo"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Du möchtest einen Erwachsenen etwas fragen. Wie fängst du höflich an?"
            say: "Du möchtest einen Erwachsenen etwas fragen. Wie fängst du höflich an?"
            options: ["Entschuldigung, darf ich Sie etwas fragen?", "Hey du, sag mal!", "Antworte mir!"]
            answer: "Entschuldigung, darf ich Sie etwas fragen?"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "„Backen Sie gern?“"
            say: "Du darfst der Bäckerin eine Frage stellen. Du fragst: Backen Sie gern? Was glaubst du: Wie lang wird ihre Antwort?"
          - text: "Backen Sie gern? Ja.\n\nWas backen Sie am liebsten? Am liebsten backe ich Brezeln, weil …"
            say: "Wahrscheinlich hörst du nur ein Wort: Ja. In einem Interview willst du viel erfahren. Auf eine Ja-Nein-Frage bekommst du oft nur ein Wort. Auf eine W-Frage erzählt dein Interviewpartner mehr. Das ist eine offene Frage."
          - text: "Wusstest du? Das Wort Interview haben wir aus dem Englischen. Es geht auf ein französisches Wort zurück, das „sich sehen“ bedeutet."
            say: "Wusstest du? Das Wort Interview haben wir aus dem Englischen. Die Engländer haben es aus dem Französischen, von einem Wort, das so viel heißt wie: sich sehen. Und genau das passiert bei einem Interview: Zwei Menschen treffen sich und sehen sich an, während sie reden."
          - text: "Ziel: Wie arbeitet eine Bäckerin?\n\nWann fangen Sie morgens an?\nWas ist das Schwierigste an Ihrer Arbeit?"
            say: "Überleg vorher, was du herausfinden willst. Dann schreibst du Fragen auf, die zu diesem Ziel passen. Fragen wie: Was ist Ihre Lieblingsfarbe? gehören nicht dazu."
          - text: "1. begrüßen und vorstellen\n2. um Erlaubnis fragen\n3. Fragen stellen\n4. bedanken"
            say: "Ein Interview hat einen Ablauf. Du begrüßt deine Interviewpartnerin, sagst, wer du bist, und fragst, ob du Fragen stellen darfst. Am Ende bedankst du dich."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Offene Frage oder Ja-Nein-Frage?"
                say: "Sortiere die Fragen: offene Frage oder Ja-Nein-Frage?"
                bins:
                  - { id: open, show: { text: "offene Frage" }, say: "offene Frage" }
                  - { id: closed, show: { text: "Ja-Nein-Frage" }, say: "Ja-Nein-Frage" }
                options:
                  - { text: "Wie sind Sie Busfahrerin geworden?", bin: open }
                  - { text: "Fahren Sie gern Bus?", bin: closed }
                  - { text: "Was erleben Sie auf Ihren Fahrten?", bin: open }
                  - { text: "Ist der Bus groß?", bin: closed }
                option_audio: false
                hints:
                  - "Kann man mit Ja oder Nein antworten?"
                  - "Offene Fragen beginnen mit einem W-Wort: wie, was, warum."
                  - "Die Fragen mit „Wie“ und „Was“ sind offen. Die Fragen mit „Fahren“ und „Ist“ sind Ja-Nein-Fragen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Du interviewst einen Tierarzt. Mit welcher Frage erfährst du am meisten?"
                say: "Du interviewst einen Tierarzt. Mit welcher Frage erfährst du am meisten?"
                options: ["Welche Tiere behandeln Sie am häufigsten?", "Mögen Sie Tiere?", "Haben Sie einen Kittel?"]
                answer: "Welche Tiere behandeln Sie am häufigsten?"
                feedback:
                  "Mögen Sie Tiere?": "Darauf kann er nur Ja sagen. Stell lieber eine W-Frage."
                hints:
                  - "Welche Frage kann man nicht mit Ja oder Nein beantworten?"
                  - "Die W-Frage beginnt mit „Welche“."
                  - "Welche Tiere behandeln Sie am häufigsten?"
              - id: l1-f3
                type: multiple_choice
                text: "Ziel: Wie war die Schule früher?\n\nDu interviewst deinen Opa. Welche Frage passt zum Ziel?"
                say: "Du willst wissen, wie die Schule früher war. Du interviewst deinen Opa. Welche Frage passt zum Ziel?"
                options: ["Womit habt ihr damals in der Schule geschrieben?", "Was isst du heute zu Mittag?", "Wie heißt dein Nachbar?"]
                answer: "Womit habt ihr damals in der Schule geschrieben?"
                hints:
                  - "Lies das Ziel noch einmal."
                  - "Es geht um die Schule, und zwar früher."
                  - "Womit habt ihr damals in der Schule geschrieben?"
              - id: l1-f4
                type: ordering
                text: "Bring das Interview in die richtige Reihenfolge."
                say: "Bring die Teile des Interviews in die richtige Reihenfolge."
                options: ["Vielen Dank für das Interview!", "Guten Tag, ich heiße Lina und gehe in die 4b.", "Was gefällt Ihnen an Ihrem Beruf?", "Darf ich Ihnen ein paar Fragen stellen?"]
                slot_count: 4
                answer: ["Guten Tag, ich heiße Lina und gehe in die 4b.", "Darf ich Ihnen ein paar Fragen stellen?", "Was gefällt Ihnen an Ihrem Beruf?", "Vielen Dank für das Interview!"]
                option_audio: false
                hints:
                  - "Begrüßen, um Erlaubnis fragen, fragen, bedanken."
                  - "Zuerst sagt Lina, wer sie ist."
                  - "„Guten Tag“, „Darf ich“, „Was gefällt“, „Vielen Dank“."
              - id: l1-f5
                type: speak
                text: "Guten Tag, ich heiße Lina. Darf ich Ihnen ein paar Fragen stellen?"
                say: "Übe den Anfang eines Interviews. Sprich freundlich und deutlich. Dann hörst du dich und das Vorbild."
                expected_text: "Guten Tag, ich heiße Lina. Darf ich Ihnen ein paar Fragen stellen?"
                hints:
                  - "Lächle und schau die Person an."
                  - "Bei der Frage geht die Stimme am Ende nach oben."
                  - "Hör das Vorbild an und sag es noch einmal."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Offene Frage oder Ja-Nein-Frage?"
                say: "Sortiere die Fragen: offene Frage oder Ja-Nein-Frage?"
                bins:
                  - { id: open, show: { text: "offene Frage" }, say: "offene Frage" }
                  - { id: closed, show: { text: "Ja-Nein-Frage" }, say: "Ja-Nein-Frage" }
                options:
                  - { text: "Warum sind Sie Gärtnerin geworden?", bin: open }
                  - { text: "Haben Sie viele Pflanzen?", bin: closed }
                  - { text: "Welche Blume mögen Sie am liebsten?", bin: open }
                  - { text: "Arbeiten Sie draußen?", bin: closed }
                option_audio: false
                hints: ["Achte auf das erste Wort der Frage."]
              - id: l1-s2
                type: multiple_choice
                text: "Du interviewst eine Feuerwehrfrau. Mit welcher Frage erfährst du am meisten?"
                say: "Du interviewst eine Feuerwehrfrau. Mit welcher Frage erfährst du am meisten?"
                options: ["Was passiert, wenn bei Ihnen der Alarm losgeht?", "Ist Ihr Auto rot?", "Haben Sie einen Helm?"]
                answer: "Was passiert, wenn bei Ihnen der Alarm losgeht?"
                feedback:
                  "Ist Ihr Auto rot?": "Das Feuerwehrauto siehst du schon von Weitem! Darauf sagt sie nur: Ja. Mit einer W-Frage erzählt sie dir viel mehr."
                hints: ["Welche Frage ist eine W-Frage?"]
              - id: l1-s3
                type: multiple_choice
                text: "Ziel: Wie lebt man auf einem Bauernhof?\n\nDu interviewst eine Bäuerin. Welche Frage passt zum Ziel?"
                say: "Du willst wissen, wie man auf einem Bauernhof lebt. Du interviewst eine Bäuerin. Welche Frage passt zum Ziel?"
                options: ["Wie sieht ein ganz normaler Tag auf Ihrem Hof aus?", "Welches Auto fahren Sie?", "Waren Sie schon einmal am Meer?"]
                answer: "Wie sieht ein ganz normaler Tag auf Ihrem Hof aus?"
                hints: ["Welche Frage hat mit dem Leben auf dem Hof zu tun?"]
              - id: l1-s4
                type: ordering
                text: "Bring das Interview in die richtige Reihenfolge."
                say: "Bring die Teile des Interviews in die richtige Reihenfolge."
                options: ["Darf ich Sie für unsere Schülerzeitung interviewen?", "Danke, dass Sie sich Zeit genommen haben!", "Hallo, ich bin Max aus der Klasse 4a.", "Wie lange arbeiten Sie schon hier?"]
                slot_count: 4
                answer: ["Hallo, ich bin Max aus der Klasse 4a.", "Darf ich Sie für unsere Schülerzeitung interviewen?", "Wie lange arbeiten Sie schon hier?", "Danke, dass Sie sich Zeit genommen haben!"]
                option_audio: false
                hints: ["Zuerst stellt sich Max vor, am Ende bedankt er sich."]
              - id: l1-s5
                type: speak
                text: "Vielen Dank, dass Sie sich Zeit für mein Interview genommen haben!"
                say: "Übe das Ende eines Interviews. Bedanke dich freundlich. Dann hörst du dich und das Vorbild."
                expected_text: "Vielen Dank, dass Sie sich Zeit für mein Interview genommen haben!"
                hints: ["Sprich freundlich und nicht zu schnell."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Offene Frage oder Ja-Nein-Frage?"
                say: "Sortiere die Fragen: offene Frage oder Ja-Nein-Frage?"
                bins:
                  - { id: open, show: { text: "offene Frage" }, say: "offene Frage" }
                  - { id: closed, show: { text: "Ja-Nein-Frage" }, say: "Ja-Nein-Frage" }
                options:
                  - { text: "Wie entsteht bei Ihnen ein neues Buch?", bin: open }
                  - { text: "Schreiben Sie am Computer?", bin: closed }
                  - { text: "Woher bekommen Sie Ihre Ideen?", bin: open }
                  - { text: "Lesen Sie gern?", bin: closed }
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Du interviewst eine Schulbusfahrerin. Mit welcher Frage erfährst du am meisten?"
                say: "Du interviewst eine Schulbusfahrerin. Mit welcher Frage erfährst du am meisten?"
                options: ["Was war das Lustigste, das Sie im Bus erlebt haben?", "Fahren Sie jeden Tag?", "Ist das schwer?"]
                answer: "Was war das Lustigste, das Sie im Bus erlebt haben?"
              - id: l1-n3
                type: multiple_choice
                text: "Ziel: Wie kümmert man sich um ein Pferd?\n\nDu interviewst eine Reitlehrerin. Welche Frage passt zum Ziel?"
                say: "Du willst wissen, wie man sich um ein Pferd kümmert. Du interviewst eine Reitlehrerin. Welche Frage passt zum Ziel?"
                options: ["Was frisst ein Pferd jeden Tag?", "Wie alt sind Sie?", "Wohin fahren Sie in den Urlaub?"]
                answer: "Was frisst ein Pferd jeden Tag?"
              - id: l1-n4
                type: true_false
                text: "„Mögen Sie Ihren Beruf?“ Ist das eine offene Frage?"
                say: "Lies die Frage. Ist das eine offene Frage?"
                answer: false
              - id: l1-n5
                type: speak
                text: "Was gefällt Ihnen an Ihrem Beruf am besten?"
                say: "Stell eine offene Frage. Sprich deutlich und freundlich. Dann hörst du dich und das Vorbild."
                expected_text: "Was gefällt Ihnen an Ihrem Beruf am besten?"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Du interviewst einen Koch. Mit welcher Frage erfährst du am meisten?"
            say: "Du interviewst einen Koch. Mit welcher Frage erfährst du am meisten?"
            options: ["Wie haben Sie kochen gelernt?", "Kochen Sie gern?", "Ist die Küche groß?"]
            answer: "Wie haben Sie kochen gelernt?"
          - id: l1-c3
            type: multiple_choice
            text: "Womit fängt ein Interview an?"
            say: "Womit fängt ein Interview an?"
            options: ["Ich begrüße die Person und stelle mich vor.", "Ich stelle sofort meine erste Frage.", "Ich bedanke mich."]
            answer: "Ich begrüße die Person und stelle mich vor."
          - id: l1-c2
            type: true_false
            text: "„Warum sind Sie Lehrerin geworden?“ Ist das eine offene Frage?"
            say: "Lies die Frage. Ist das eine offene Frage?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Ziel: Wie arbeitet ein Zahnarzt?\n\nWelche Frage passt nicht zum Ziel?"
            say: "Du willst wissen, wie ein Zahnarzt arbeitet. Welche Frage passt nicht zum Ziel?"
            options: ["Welchen Film haben Sie zuletzt gesehen?", "Wie lange dauert es, ein Loch im Zahn zu füllen?", "Welche Werkzeuge brauchen Sie?"]
            answer: "Welchen Film haben Sie zuletzt gesehen?"
          - id: l1-c5
            type: multiple_choice
            text: "„Spielen Sie ein Instrument?“ Wie wird daraus eine offene Frage?"
            say: "Spielen Sie ein Instrument? Wie wird daraus eine offene Frage?"
            options: ["Welches Instrument spielen Sie?", "Spielen Sie gern ein Instrument?", "Spielen Sie kein Instrument?"]
            answer: "Welches Instrument spielen Sie?"
            option_audio: false
          - id: l1-c6
            type: multiple_choice
            text: "Warum fragst du am Anfang, ob du Fragen stellen darfst?"
            options: ["Weil es höflich ist und die Person zustimmen soll.", "Weil du sonst keine Fragen hast.", "Weil das Interview dann kürzer wird."]
            answer: "Weil es höflich ist und die Person zustimmen soll."

  - n: 2
    title: { de: "Nachfragen und notieren", en: "Following up and taking notes" }
    goal:
      de: "Frag im Interview nach und schreib die Antworten in Stichwörtern auf, so wie beim Bäcker Herrn Yilmaz."
      en: "Ask follow-up questions in an interview and note the answers in key words, like with Mr Yilmaz the baker."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "„Wann stehen Sie morgens auf?“ Ist das eine offene Frage?"
            say: "Lies die Frage. Ist das eine offene Frage?"
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Womit hört ein Interview auf?"
            say: "Womit hört ein Interview auf?"
            options: ["Ich bedanke mich.", "Ich gehe einfach weg.", "Ich stelle mich vor."]
            answer: "Ich bedanke mich."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Paul: Wann fangen Sie morgens an?\nHerr Yilmaz: Um drei Uhr. Dann ist der Teig schon fertig.\nPaul: … ?"
            say: "Paul interviewt den Bäcker, Herrn Yilmaz. Paul fragt: Wann fangen Sie morgens an? Herr Yilmaz sagt: Um drei Uhr. Dann ist der Teig schon fertig. Moment mal! Was glaubst du: Was könnte Paul jetzt fragen?"
          - text: "Paul: Wann fangen Sie morgens an?\nHerr Yilmaz: Um drei Uhr. Dann ist der Teig schon fertig.\nPaul: Wer macht denn den Teig in der Nacht?"
            say: "Paul fragt: Wer macht denn den Teig in der Nacht? Paul hört genau zu. Herr Yilmaz sagt etwas Neues: Der Teig ist schon fertig. Paul fragt nach. So eine Frage heißt Nachfrage. Sie greift die Antwort auf."
          - text: "Antwort: Um drei Uhr. Dann ist der Teig schon fertig.\n\nNotiz: Beginn 3 Uhr, Teig schon fertig"
            say: "Während des Interviews schreibst du die Antworten nicht Wort für Wort mit. Du notierst nur Stichwörter. Zahlen und Namen schreibst du genau auf."
          - text: "Interview mit Herrn Yilmaz, Bäcker\n- Beginn 3 Uhr\n- Lieblingsbrot: Roggenbrot\n- schwierig: früh aufstehen"
            say: "Nach dem Interview ordnest du deine Notizen. Daraus kannst du einen Artikel für die Schülerzeitung schreiben oder der Klasse berichten."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Herr Yilmaz: Am liebsten backe ich Roggenbrot, weil es lange frisch bleibt.\n\nWelche Notiz ist am besten?"
                say: "Lies die Antwort. Welche Notiz ist am besten?"
                options: ["Lieblingsbrot: Roggenbrot, bleibt lange frisch", "Am liebsten backe ich Roggenbrot, weil es lange frisch bleibt.", "Brot"]
                answer: "Lieblingsbrot: Roggenbrot, bleibt lange frisch"
                hints:
                  - "Eine Notiz ist kurz, aber das Wichtige fehlt nicht."
                  - "Der ganze Satz ist zu lang. Brot allein ist zu wenig."
                  - "Lieblingsbrot: Roggenbrot, bleibt lange frisch."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Herr Yilmaz: Manchmal backe ich auch Torten für Hochzeiten.\n\nWelche Nachfrage passt?"
                say: "Lies die Antwort. Welche Nachfrage passt dazu?"
                options: ["Wie groß war die größte Hochzeitstorte, die Sie gebacken haben?", "Wann haben Sie Feierabend?", "Wie heißen Sie?"]
                answer: "Wie groß war die größte Hochzeitstorte, die Sie gebacken haben?"
                feedback:
                  "Wann haben Sie Feierabend?": "Das ist eine neue Frage. Eine Nachfrage greift auf, was Herr Yilmaz gerade gesagt hat."
                hints:
                  - "Worüber hat Herr Yilmaz gerade gesprochen?"
                  - "Er spricht über Torten für Hochzeiten. Die Nachfrage muss dazu passen."
                  - "Wie groß war die größte Hochzeitstorte?"
              - id: l2-f3
                type: multiple_choice
                text: "Frau Berger, Försterin: Im Wald arbeite ich bei jedem Wetter. Im Winter friert man manchmal ganz schön.\n\nWelche Notiz ist am besten?"
                say: "Lies die Antwort. Welche Notiz ist am besten?"
                options: ["arbeitet bei jedem Wetter, im Winter kalt", "Im Wald arbeite ich bei jedem Wetter.", "Wald"]
                answer: "arbeitet bei jedem Wetter, im Winter kalt"
                feedback:
                  "Wald": "Nur „Wald“? Später weißt du nicht mehr, ob sie im Wald arbeitet, wohnt oder Pilze sammelt! Eine gute Notiz ist kurz, aber sie hat das Wichtige: bei jedem Wetter, im Winter kalt."
                hints:
                  - "Welche Notiz ist kurz und hat das Wichtige?"
                  - "Ein Satz ist abgeschrieben, einer ist zu kurz."
                  - "arbeitet bei jedem Wetter, im Winter kalt."
              - id: l2-f4
                type: true_false
                text: "Bei einem Interview schreibst du jede Antwort Wort für Wort mit. Stimmt das?"
                say: "Bei einem Interview schreibst du jede Antwort Wort für Wort mit. Stimmt das?"
                answer: false
                hints:
                  - "Wie schnell spricht man, wie schnell schreibt man?"
                  - "Du notierst nur Stichwörter."
                  - "Nein, das stimmt nicht."
              - id: l2-f5
                type: speak
                text: "Sie haben gesagt, dass Sie Torten backen. Wie lange brauchen Sie für eine Torte?"
                say: "Übe eine Nachfrage. Sprich freundlich und deutlich. Dann hörst du dich und das Vorbild."
                expected_text: "Sie haben gesagt, dass Sie Torten backen. Wie lange brauchen Sie für eine Torte?"
                hints:
                  - "Zuerst greifst du die Antwort auf, dann fragst du."
                  - "Bei der Frage geht die Stimme am Ende nach oben."
                  - "Hör das Vorbild an und sag es noch einmal."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Frau Berger: Ich pflanze jedes Jahr etwa tausend junge Bäume.\n\nWelche Notiz ist am besten?"
                say: "Lies die Antwort. Welche Notiz ist am besten?"
                options: ["pflanzt ca. 1000 Bäume pro Jahr", "Bäume", "Ich pflanze jedes Jahr etwa tausend junge Bäume."]
                answer: "pflanzt ca. 1000 Bäume pro Jahr"
                hints: ["Zahlen schreibst du genau auf."]
              - id: l2-s2
                type: multiple_choice
                text: "Frau Berger: Letzte Woche habe ich im Wald einen Uhu gesehen.\n\nWelche Nachfrage passt?"
                say: "Lies die Antwort. Welche Nachfrage passt dazu?"
                options: ["Wo genau haben Sie den Uhu gesehen?", "Welche Bäume mögen Sie?", "Wie alt sind Sie?"]
                answer: "Wo genau haben Sie den Uhu gesehen?"
                hints: ["Worüber hat Frau Berger gerade gesprochen?"]
              - id: l2-s3
                type: matching
                text: "Welche Notiz gehört zu welcher Antwort? Verbinde."
                say: "Lies die Antworten von Frau Berger. Welche Notiz gehört dazu? Verbinde."
