                frame: "Kannst du mir einen guten _ geben?"
                options: ["Rat", "Rad"]
                answer: ["Rat"]
                hints:
                  - "Ein Tipp oder ein Fahrrad?"
                  - "Verlängere: raten."
                  - "Rat."
              - id: l2-f5
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Wir wohnen seit drei Jahren hier." }
                answer: true
                hints:
                  - "Geht es um die Zeit?"
                  - "Bei der Zeit schreibst du seit mit t."
                  - "Ja, das ist richtig."

