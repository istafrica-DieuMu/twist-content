              - id: l1-n3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seiner Bedeutung."
                pairs:
                  - { left: { text: "der Wal" }, right: { text: "ein Tier, das kein Fisch ist" } }
                  - { left: { text: "die Wahl" }, right: { text: "sich entscheiden" } }
                  - { left: { text: "das Lid" }, right: { text: "geht beim Blinzeln zu" } }
                  - { left: { text: "mehr" }, right: { text: "noch etwas dazu" } }
              - id: l1-n4
                type: true_false
