            say: "Rad und Rat klingen gleich. Verlängere das Wort: Rad, die Räder, da hörst du das d. Rat, raten, da hörst du das t. Ein Rat ist ein Tipp, den dir jemand gibt."
            show: { object: bike }
          - text: "ihr seid · seit gestern"
            say: "Seid mit d gehört zu ihr: Ihr seid meine Freunde. Seit mit t sagt etwas über die Zeit: seit gestern, seit einer Woche."
          - text: "die Seite · die Saite"
            say: "Ein Buch hat Seiten. Ein Instrument wie die Gitarre hat Saiten. Die Saite schreibst du mit ai."
            show: { object: book }

