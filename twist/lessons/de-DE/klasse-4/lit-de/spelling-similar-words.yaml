                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Ich bin so müde, mir fallen die Augenlieder zu." }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Der _ bläst eine Fontäne aus Wasser."
                options: ["Wahl", "Wal"]
                answer: ["Wal"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
