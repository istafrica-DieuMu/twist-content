# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.spelling-similar-words
skill: lit-de.spelling.similar-words
curriculum: de-DE
language: de
title:
  de: Gleich klingende Wörter
  en: Words that sound the same
summary: >
  Words that sound the same but are written differently and mean
  different things. Lesson 1 takes Wal and Wahl, Lid and Lied, Meer and
  mehr and decides by the meaning; lesson 2 takes Rad and Rat, seid and
  seit, Seite and Saite, uses a related word to find the spelling (Rad,
  Räder; Rat, raten), and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Rechtschreibung üben, en: Spelling practice }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling.long-i]
  also_practises: [lit-de.spelling-strategies.lengthen-dt]
  vocabulary: { de: [gleich klingend, Bedeutung, Wal, Wahl, Lid, Lied, Meer, mehr, Rad, Rat, seid, seit, Seite, Saite] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: wal-lid-meer, what: { de: "Wal und Wahl, Lid und Lied, Meer und mehr nach der Bedeutung schreiben", en: "Wal and Wahl, Lid and Lied, Meer and mehr, spelt by their meaning" } }
    - { id: rad-rat, what: { de: Rad und Rat unterscheiden, en: telling Rad from Rat } }
    - { id: seid-seit, what: { de: seid und seit unterscheiden, en: telling seid from seit } }
    - { id: seite-saite, what: { de: Seite und Saite unterscheiden, en: telling Seite from Saite } }
  misconceptions:
    - id: one-spelling-fits-all
      what: Writes one spelling for both meanings (Die Wal hat begonnen.)
      addressed: lesson 1 Learn sets both meanings side by side; every stage asks which spelling fits a sentence, with feedback in l1-f1
    - id: seid-seit
      what: Mixes up seid (ihr seid) and seit (seit gestern)
      addressed: lesson 2 Learn ties seid to ihr and seit to time; a seid/seit gap in every stage of lesson 2, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wal oder Wahl?", en: "Wal or Wahl?" }
    goal:
      de: "Unterscheide Wörter, die gleich klingen, aber anders geschrieben werden. Der Wal schwimmt im Meer, bei einer Wahl entscheidest du dich."
      en: "Tell apart words that sound the same but are spelt differently. A Wal swims in the sea, at a Wahl you make a choice."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "i oder ie?"
            say: "Setz die richtigen Buchstaben ein. Ich spiele mit meinem Bruder."
            frame: "sp_len"
            options: ["ie", "i"]
            answer: ["ie"]
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "d oder t?"
            say: "Setz den richtigen Buchstaben ein. Der Hund bellt."
            frame: "Hun_"
            options: ["d", "t"]
            answer: ["d"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "der Wal · die Wahl"
            say: "Manche Wörter klingen gleich, werden aber verschieden geschrieben. Der Wal ist ein großes Tier im Meer. Die Wahl hat mit wählen zu tun. Bei einer Wahl entscheidest du dich."
            show: { object: whale }
          - text: "das Lid · das Lied"
            say: "Das Lid ist die Haut über deinem Auge. Das Lied singst du."
            show: { object: eye }
          - text: "das Meer · mehr"
            say: "Das Meer ist ganz viel Wasser mit Wellen und Strand. Mehr mit h heißt: noch etwas dazu. Ich möchte mehr Saft. Überleg immer zuerst, was das Wort bedeutet."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke? Denk an die Bedeutung."
                frame: "Im Ozean schwimmt ein großer _."
                options: ["Wal", "Wahl"]
                answer: ["Wal"]
                feedback:
                  "Wahl": "Die Wahl hat mit wählen zu tun. Das große Tier schreibst du ohne h: Wal."
                hints:
                  - "Geht es um ein Tier oder ums Wählen?"
                  - "Ein großes Tier im Ozean."
                  - "Wal."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Wir singen ein _."
                options: ["Lid", "Lied"]
                answer: ["Lied"]
                hints:
                  - "Was singt man?"
                  - "Das Wort, das mit Singen zu tun hat, hat ie."
                  - "Lied."
              - id: l1-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seiner Bedeutung."
                pairs:
                  - { left: { text: "die Wahl" }, right: { text: "sich entscheiden" } }
                  - { left: { text: "das Lid" }, right: { text: "Haut über dem Auge" } }
                  - { left: { text: "mehr" }, right: { text: "noch etwas dazu" } }
                hints:
                  - "Denk an verwandte Wörter: Wahl kommt von wählen."
                  - "Das Lid gehört zum Auge."
                  - "Wahl: sich entscheiden. Lid: Haut über dem Auge. mehr: noch etwas dazu."
              - id: l1-f4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Im Sommer baden wir im Mehr." }
                answer: false
                hints:
                  - "Ist das große Wasser gemeint oder noch etwas dazu?"
                  - "Das große Wasser schreibst du mit zwei e."
                  - "Nein. Richtig ist: im Meer."
              - id: l1-f5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Bei der _ zum Klassensprecher hat Lea gewonnen."
