# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.verbs-imperative
skill: lit-de.verbs.imperative
curriculum: de-DE
language: de
title:
  de: Die Aufforderungsform
  en: The imperative
summary: >
  Verbs in the imperative tell someone what to do (Komm! Kommt!). Lesson 1
  forms the imperative for one person (komm, lauf), including the verbs
  that change e to i (lies, gib, nimm) and verbs whose front part moves to
  the end (Räum auf!); lesson 2 forms it for several people (kommt, lest)
  and for polite address (Kommen Sie!), sets the exclamation mark, and
  ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Verben, en: Verbs }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.verbs.present]
  also_practises: [lit-de.verbs.conjugate, lit-de.sentences.end-punctuation]
  vocabulary: { de: [Aufforderungsform, Imperativ, Aufforderung, Ausrufezeichen] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: one-person, what: { de: "die Aufforderung an ein Kind, auch mit e zu i (Lies!)", en: "the imperative to one child, also with e to i" } }
    - { id: several, what: { de: die Aufforderung an mehrere Kinder, en: the imperative to several children } }
    - { id: polite, what: { de: die höfliche Aufforderung mit Sie, en: the polite imperative with Sie } }
    - { id: prefix, what: { de: Aufforderungen mit einer Vorsilbe am Ende, en: imperatives with the front part at the end } }
  misconceptions:
    - id: du-ending
      what: Keeps the du-ending (Kommst! Läufst!)
      addressed: lesson 1 Learn builds the form from the verb without -en and shows that a stays a (du fährst, fahr!); the du-ending form is an option in every stage and the check of lesson 1, with feedback in l1-f1; l2-c1 offers Schläfst! and Schläf!
    - id: no-e-i-change
      what: Forms "les!" or "geb!" without the e-to-i change
      addressed: lesson 1 Learn shows du liest, lies!; e-i verbs appear in every stage of lesson 1 and its check, with the e form as a distractor or on a wrong card
    - id: ihr-for-sie
      what: Uses the ihr-form for polite address (Kommt, Frau Meier!)
      addressed: lesson 2 Learn sets Macht mit! against Machen Sie mit!; every stage of lesson 2 and the skill check have a task that addresses an adult politely, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Komm! Lies! Räum auf!", en: "Come! Read! Tidy up!" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "du _ (singen)"
            say: "Welche Form passt? Du … Das Verb heißt singen."
            options: ["singst", "singt", "singen"]
            answer: "singst"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "du _ (fahren)"
            say: "Welche Form passt? Du … Das Verb heißt fahren."
            options: ["fährst", "fahrst", "fährt"]
            answer: "fährst"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "gehen → Geh! · fahren → Fahr!"
            say: "Mit der Aufforderungsform sagst du jemandem, was er tun soll. Nimm das Verb ohne -en: gehen, geh! Am Ende steht ein Ausrufezeichen. Aus a wird dabei kein ä: Du fährst, aber: Fahr langsam!"
          - text: "du liest → Lies! · du gibst → Gib!"
            say: "Bei manchen Verben wird aus e ein i oder ie. Das hörst du schon in der du-Form: du liest, lies! Du gibst, gib! Du nimmst, nimm!"
          - text: "du räumst auf → Räum auf!"
            say: "Hat das Verb eine Vorsilbe, die sich abtrennt, kommt sie ans Ende: aufräumen, räum auf! Einkaufen, kauf ein!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "kommen: Du sagst zu deinem Freund: _"
                say: "Du sagst zu deinem Freund, er soll kommen. Welche Form passt?"
                options: ["Komm!", "Kommst!", "Kommt!"]
                answer: "Komm!"
                feedback:
                  "Kommst!": "Kommst ist die du-Form. Bei der Aufforderung fällt -st weg: Komm!"
                  "Kommt!": "Das sagst du zu mehreren Kindern. Zu einem Freund sagst du: Komm!"
                hints:
                  - "Nimm das Verb ohne -en."
                  - "Kommen ohne -en heißt komm."
                  - "Komm!"
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "helfen: Ergänze die Aufforderung."
                say: "Ergänze die Aufforderung. Das Verb heißt helfen. … mir bitte!"
                frame: "_ mir bitte!"
                options: ["Hilf", "Helf", "Hilfst"]
                answer: ["Hilf"]
                hints:
                  - "Wie heißt die du-Form? Du hilfst."
                  - "Aus e wird i, und -st fällt weg."
                  - "Hilf mir bitte!"
              - id: l1-f3
                type: multiple_choice
                text: "aufpassen: Du sagst zu deiner Schwester: _"
                say: "Du sagst zu deiner Schwester, sie soll aufpassen. Welche Form passt?"
                options: ["Pass auf!", "Aufpass!", "Passt auf!"]
                answer: "Pass auf!"
                hints:
                  - "Die Vorsilbe auf kommt ans Ende."
                  - "Passen ohne -en heißt pass. Dann kommt auf."
                  - "Pass auf!"
              - id: l1-f4
                type: true_false
                text: "Stimmt die Aufforderung?"
                say: "Lies die Karte. Stimmt die Aufforderung?"
                show: { drawn: letter-card, text: "Seh mal, ein Regenbogen!" }
                answer: false
                hints:
                  - "Wie heißt die du-Form von sehen?"
                  - "Du siehst. Aus e wird ie."
                  - "Nein. Richtig ist: Sieh mal, ein Regenbogen!"
              - id: l1-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Verb mit seiner Aufforderung."
                pairs:
                  - { left: { text: "laufen" }, right: { text: "Lauf!" } }
                  - { left: { text: "essen" }, right: { text: "Iss!" } }
                  - { left: { text: "anrufen" }, right: { text: "Ruf an!" } }
                hints:
                  - "Denk an die du-Form: du läufst, du isst, du rufst an."
                  - "Bei essen wird aus e ein i. Bei laufen bleibt das a."
                  - "Laufen passt zu Lauf!, essen zu Iss! und anrufen zu Ruf an!"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "schreiben: Du sagst zu deinem Bruder: _"
                say: "Du sagst zu deinem Bruder, er soll schreiben. Welche Form passt?"
                options: ["Schreibst!", "Schreib!", "Schreibt!"]
                answer: "Schreib!"
                hints: ["Nimm das Verb ohne die Endung."]
              - id: l1-s2
                type: fill_in_blank
                text: "treten: Ergänze die Aufforderung."
                say: "Ergänze die Aufforderung. Das Verb heißt treten. … nicht auf die Blumen!"
                frame: "_ nicht auf die Blumen!"
                options: ["Tritt", "Tret", "Trittst"]
                answer: ["Tritt"]
                hints: ["Wie heißt die du-Form von treten?"]
              - id: l1-s3
                type: multiple_choice
                text: "zumachen: Du sagst zu deiner Freundin: _"
                say: "Du sagst zu deiner Freundin, sie soll die Tür zumachen. Welche Form passt?"
                options: ["Zumach die Tür!", "Mach die Tür zu!", "Machst die Tür zu!"]
                answer: "Mach die Tür zu!"
                hints: ["Wohin wandert die Vorsilbe?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt die Aufforderung?"
                say: "Lies die Karte. Stimmt die Aufforderung?"
                show: { drawn: letter-card, text: "Sprich lauter!" }
                answer: true
                hints: ["Wie heißt die du-Form von sprechen?"]
              - id: l1-s5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Verb mit seiner Aufforderung."
                pairs:
                  - { left: { text: "trinken" }, right: { text: "Trink!" } }
                  - { left: { text: "vergessen" }, right: { text: "Vergiss!" } }
                  - { left: { text: "mitkommen" }, right: { text: "Komm mit!" } }
                hints: ["Achte bei vergessen auf das e in der du-Form."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "lachen: Du sagst zu deinem Freund: _"
                say: "Du sagst zu deinem Freund, er soll lachen. Welche Form passt?"
                options: ["Lachst!", "Lacht!", "Lach!"]
                answer: "Lach!"
              - id: l1-n2
                type: fill_in_blank
                text: "brechen: Ergänze die Aufforderung."
                say: "Ergänze die Aufforderung. Das Verb heißt brechen. … das Brot in zwei Teile!"
                frame: "_ das Brot in zwei Teile!"
                options: ["Brich", "Brech", "Brichst"]
                answer: ["Brich"]
              - id: l1-n3
                type: multiple_choice
                text: "aufstehen: Du sagst zu deinem Bruder: _"
                say: "Du sagst zu deinem Bruder, er soll aufstehen. Welche Form passt?"
                options: ["Aufsteh!", "Stehst auf!", "Steh auf!"]
                answer: "Steh auf!"
              - id: l1-n4
                type: true_false
                text: "Stimmt die Aufforderung?"
                say: "Lies die Karte. Stimmt die Aufforderung?"
                show: { drawn: letter-card, text: "Aufheb deine Socken!" }
                answer: false
              - id: l1-n5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Verb mit seiner Aufforderung."
                pairs:
                  - { left: { text: "werfen" }, right: { text: "Wirf!" } }
                  - { left: { text: "springen" }, right: { text: "Spring!" } }
                  - { left: { text: "einsteigen" }, right: { text: "Steig ein!" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "rennen: Du sagst zu deiner Freundin: _"
            say: "Du sagst zu deiner Freundin, sie soll rennen. Welche Form passt?"
            options: ["Renn!", "Rennst!", "Rennt!"]
            answer: "Renn!"
          - id: l1-c2
            type: fill_in_blank
            text: "messen: Ergänze die Aufforderung."
            say: "Ergänze die Aufforderung. Das Verb heißt messen. … bitte, wie lang der Tisch ist!"
            frame: "_ bitte, wie lang der Tisch ist!"
            options: ["Miss", "Mess", "Misst"]
            answer: ["Miss"]
          - id: l1-c3
            type: true_false
            text: "Stimmt die Aufforderung?"
            say: "Lies die Karte. Stimmt die Aufforderung?"
            show: { drawn: letter-card, text: "Hör gut zu!" }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "vergessen: Du sagst zu deiner Schwester: _"
            say: "Du sagst zu deiner Schwester, sie soll ihre Mütze nicht vergessen. Welche Form passt?"
            options: ["Vergess deine Mütze nicht!", "Vergisst deine Mütze nicht!", "Vergiss deine Mütze nicht!"]
            answer: "Vergiss deine Mütze nicht!"
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Du sprichst mit deinem Freund. Stimmt die Aufforderung so?"
            say: "Du sprichst mit deinem Freund. Lies die Karte. Stimmt die Aufforderung so?"
            show: { drawn: letter-card, text: "Spielst mit mir!" }
            answer: false
          - id: l1-c6
            type: matching
            text: "Was passt zusammen?"
            say: "Verbinde jedes Verb mit seiner Aufforderung."
            pairs:
              - { left: { text: "schwimmen" }, right: { text: "Schwimm!" } }
              - { left: { text: "nehmen" }, right: { text: "Nimm!" } }
              - { left: { text: "aufschreiben" }, right: { text: "Schreib auf!" } }

  - n: 2
    title: { de: "Kommt! Kommen Sie!", en: "Come (you all)! Come, please!" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "fragen: Du sagst zu deinem Freund: _"
            say: "Du sagst zu deinem Freund, er soll fragen. Welche Form passt?"
            options: ["Frag!", "Fragst!", "Fragt!"]
            answer: "Frag!"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "sprechen: Du sagst zu deiner Schwester: _"
            say: "Du sagst zu deiner Schwester, sie soll leiser sprechen. Welche Form passt?"
            options: ["Sprich leiser!", "Sprech leiser!", "Sprichst leiser!"]
            answer: "Sprich leiser!"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "ihr singt → Singt!"
            say: "Sprichst du mit mehreren Kindern, nimmst du die ihr-Form und lässt ihr weg: ihr singt, singt! Ihr lest, lest! Hier bleibt das e."
          - text: "Schauen Sie mal!"
            say: "Erwachsene, die du siezt, sprichst du so an: Schauen Sie mal! Das Verb steht in der Grundform vorn, dann kommt Sie. Sie schreibst du groß."
          - text: "Macht mit! · Machen Sie mit!"
            say: "Die Vorsilbe wandert auch hier ans Ende: Macht mit! Machen Sie bitte mit!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Die Lehrerin sagt zur Klasse: _"
                say: "Die Lehrerin sagt zur ganzen Klasse, alle sollen zuhören. Welche Form passt?"
                options: ["Hört zu!", "Hör zu!", "Hören Sie zu!"]
                answer: "Hört zu!"
                feedback:
                  "Hör zu!": "Das sagst du zu einem Kind. Zu mehreren sagst du: Hört zu!"
                hints:
                  - "Es sind viele Kinder."
                  - "Nimm die ihr-Form: ihr hört zu."
                  - "Hört zu!"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Du sprichst mit Frau Meier: _"
                say: "Eure Nachbarin, Frau Meier, steht vor der Tür. Du bittest sie herein. Was sagst du?"
                options: ["Kommen Sie bitte herein!", "Kommt bitte herein!", "Komm bitte herein!"]
                answer: "Kommen Sie bitte herein!"
                feedback:
                  "Kommt bitte herein!": "Das sagst du zu mehreren Kindern. Frau Meier siezt du: Kommen Sie bitte herein!"
                  "Komm bitte herein!": "Das sagst du zu einem Kind. Frau Meier siezt du: Kommen Sie bitte herein!"
                hints:
                  - "Frau Meier ist eine Erwachsene, die du siezt."
                  - "Grundform vorn, dann Sie."
                  - "Kommen Sie bitte herein!"
              - id: l2-f3
                type: fill_in_blank
                text: "sprechen: Du sagst es zu deinen Freunden. Ergänze die Aufforderung."
                say: "Du sagst zu deinen Freunden, sie sollen leise sprechen. Ergänze: … leise! Das Verb heißt sprechen."
                frame: "_ leise!"
                options: ["Sprecht", "Sprich", "Sprechen"]
                answer: ["Sprecht"]
                hints:
                  - "Es sind mehrere Kinder."
                  - "Ihr sprecht. Bei der ihr-Form bleibt das e."
                  - "Sprecht leise!"
              - id: l2-f4
                type: true_false
                text: "Du rufst dem Busfahrer etwas zu. Stimmt die Aufforderung so?"
                say: "Du rennst zum Bus und rufst dem Busfahrer etwas zu. Lies die Karte. Stimmt die Aufforderung so?"
                show: { drawn: letter-card, text: "Warten Sie bitte!" }
                answer: true
                hints:
                  - "Den Busfahrer siezt du."
                  - "Grundform vorn, dann Sie."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: fill_in_blank
                text: "Setz das Satzzeichen."
                say: "Welches Satzzeichen gehört an das Ende einer Aufforderung?"
                frame: "Macht das Fenster zu_"
                options: ["!", "?", ","]
                answer: ["!"]
                hints:
                  - "Es ist eine Aufforderung."
                  - "Nach einer Aufforderung steht ein besonderes Zeichen."
                  - "Das Ausrufezeichen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Der Trainer sagt zur Mannschaft: _"
                say: "Der Trainer sagt zu seiner Mannschaft, alle sollen schneller laufen. Welche Form passt?"
                options: ["Lauf schneller!", "Lauft schneller!", "Laufen Sie schneller!"]
                answer: "Lauft schneller!"
                hints: ["Mit wie vielen spricht der Trainer?"]
              - id: l2-s2
                type: multiple_choice
                text: "Du sprichst mit Herrn Yilmaz: _"
                say: "Herr Yilmaz arbeitet in der Bücherei. Du kommst nicht an das obere Regal. Du bittest ihn, dir zu helfen. Was sagst du?"
                options: ["Hilf mir bitte!", "Helfen Sie mir bitte!", "Helft mir bitte!"]
                answer: "Helfen Sie mir bitte!"
                hints: ["Herrn Yilmaz siezt du."]
              - id: l2-s3
                type: fill_in_blank
                text: "nehmen: Die Lehrerin sagt es zur Klasse. Ergänze die Aufforderung."
                say: "Die Lehrerin sagt zur Klasse, jedes Kind soll sich ein Blatt nehmen. Ergänze: … euch ein Blatt! Das Verb heißt nehmen."
                frame: "_ euch ein Blatt!"
                options: ["Nehmt", "Nimm", "Nimmt"]
                answer: ["Nehmt"]
                hints: ["Wie heißt die ihr-Form von nehmen?"]
              - id: l2-s4
                type: true_false
                text: "Die Mutter spricht mit ihren zwei Söhnen. Stimmt die Aufforderung so?"
                say: "Die Mutter spricht mit ihren zwei Söhnen. Lies die Karte. Stimmt die Aufforderung so?"
                show: { drawn: letter-card, text: "Zieh eure Jacken an!" }
                answer: false
                hints: ["Spricht die Mutter mit einem oder mit zwei Kindern?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Setz das Satzzeichen."
                say: "Welches Satzzeichen gehört ans Ende?"
                frame: "Gebt mir bitte die Schere_"
                options: ["!", "?", ","]
                answer: ["!"]
                hints: ["Ist das eine Frage oder eine Aufforderung?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Oma sagt zu den Enkeln: _"
                say: "Oma sagt zu ihren Enkeln, sie sollen essen. Welche Form passt?"
                options: ["Esst!", "Iss!", "Essen Sie!"]
                answer: "Esst!"
              - id: l2-n2
                type: multiple_choice
                text: "Du sprichst mit dem Nachbarn: _"
                say: "Dein Ball ist über den Zaun geflogen. Du bittest den Nachbarn, ihn dir zurückzuwerfen. Was sagst du?"
                options: ["Werft ihn mir bitte zurück!", "Wirf ihn mir bitte zurück!", "Werfen Sie ihn mir bitte zurück!"]
                answer: "Werfen Sie ihn mir bitte zurück!"
              - id: l2-n3
                type: fill_in_blank
                text: "geben: Die Lehrerin sagt es zur Klasse. Ergänze die Aufforderung."
                say: "Die Lehrerin sammelt die Hefte ein. Ergänze: … mir bitte eure Hefte! Das Verb heißt geben."
                frame: "_ mir bitte eure Hefte!"
                options: ["Gebt", "Gib", "Gibt"]
                answer: ["Gebt"]
              - id: l2-n4
                type: true_false
                text: "Du sprichst beim Bäcker mit der Verkäuferin. Stimmt die Aufforderung so?"
                say: "Du kaufst beim Bäcker ein und sprichst mit der Verkäuferin. Lies die Karte. Stimmt die Aufforderung so?"
                show: { drawn: letter-card, text: "Gib mir bitte zwei Brötchen!" }
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Setz das Satzzeichen."
                say: "Welches Satzzeichen gehört ans Ende?"
                frame: "Schreibt eure Namen auf das Blatt_"
                options: ["!", "?", ","]
                answer: ["!"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: one-person
            type: multiple_choice
            text: "schlafen: Du sagst zu deinem kleinen Bruder: _"
            say: "Du sagst zu deinem kleinen Bruder, er soll jetzt schlafen. Welche Form passt?"
            options: ["Schläfst!", "Schlaf!", "Schläf!"]
            answer: "Schlaf!"
          - id: l2-c2
            part: one-person
            type: fill_in_blank
            text: "treffen: Du sagst es zu deinem Freund. Ergänze die Aufforderung."
            say: "Dein Freund will den Ball ins Tor schießen. Ergänze die Aufforderung. Das Verb heißt treffen. … das Tor!"
            frame: "_ das Tor!"
            options: ["Triff", "Treff", "Triffst"]
            answer: ["Triff"]
          - id: l2-c3
            part: several
            type: multiple_choice
            text: "Die Lehrerin sagt zur Klasse: _"
            say: "Die Lehrerin sagt zur Klasse, alle sollen die Hefte einpacken. Welche Form passt?"
            options: ["Packt die Hefte ein!", "Einpackt die Hefte!", "Pack die Hefte ein!"]
            answer: "Packt die Hefte ein!"
          - id: l2-c4
            part: polite
            type: multiple_choice
            text: "Du sprichst mit dem Hausmeister: _"
            say: "Du bittest den Hausmeister, die Tür aufzuschließen. Was sagst du?"
            options: ["Schließt bitte die Tür auf!", "Schließen Sie bitte die Tür auf!", "Schließ bitte die Tür auf!"]
            answer: "Schließen Sie bitte die Tür auf!"
          - id: l2-c5
            part: several
            type: true_false
            text: "Du willst mit deinen Freunden auf den Spielplatz. Stimmt die Aufforderung so?"
            say: "Du willst mit deinen Freunden auf den Spielplatz. Lies die Karte. Stimmt die Aufforderung so?"
            show: { drawn: letter-card, text: "Kommt alle mit!" }
            answer: true
          - id: l2-c6
            part: one-person
            type: fill_in_blank
            text: "nehmen: Du sagst es zu deiner Freundin. Ergänze die Aufforderung."
            say: "Du sagst zu deiner Freundin, sie soll sich ein Stück Kuchen nehmen. Ergänze die Aufforderung. Das Verb heißt nehmen. … dir ein Stück Kuchen!"
            frame: "_ dir ein Stück Kuchen!"
            options: ["Nehm", "Nimm", "Nimmst"]
            answer: ["Nimm"]
          - id: l2-c7
            part: one-person
            type: true_false
            text: "Du sprichst mit deinem Bruder. Stimmt die Aufforderung so?"
            say: "Du sprichst mit deinem Bruder. Lies die Karte. Stimmt die Aufforderung so?"
            show: { drawn: letter-card, text: "Kämm dir die Haare!" }
            answer: true
          - id: l2-c8
            part: one-person
            type: multiple_choice
            text: "essen: Du sagst zu deinem Bruder: _"
            say: "Du sagst zu deinem Bruder, er soll seinen Teller leer essen. Welche Form passt?"
            options: ["Iss deinen Teller leer!", "Ess deinen Teller leer!", "Isst deinen Teller leer!"]
            answer: "Iss deinen Teller leer!"
            option_audio: false
          - id: l2-c9
