# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.sentences-list-commas
skill: lit-de.sentences.list-commas
curriculum: de-DE
language: de
title:
  de: Kommas bei Aufzählungen
  en: Commas in lists
summary: >
  Commas between the items of a list. Lesson 1 sets commas between
  words in a list and none before und or oder (Äpfel, Birnen und
  Bananen); lesson 2 lists groups of words and adjectives (ein großer,
  schwerer Koffer), judges whether a sentence is written correctly, and
  ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Zeichensetzung, en: Punctuation }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.sentences.end-punctuation]
  also_practises: [lit-de.adjectives.agreement]
  vocabulary: { de: [Aufzählung, Komma, und, oder] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: words, what: { de: Kommas zwischen aufgezählten Wörtern setzen, en: setting commas between the words of a list } }
    - { id: before-und, what: { de: kein Komma vor dem letzten und oder oder, en: no comma before the last und or oder } }
    - { id: groups, what: { de: Kommas zwischen aufgezählten Wortgruppen und Tätigkeiten setzen, en: setting commas between listed word groups and actions } }
    - { id: adjectives, what: { de: Kommas zwischen aufgezählten Adjektiven setzen, en: setting commas between listed adjectives } }
  misconceptions:
    - id: comma-before-und
      what: Sets a comma before the und that closes a list (Äpfel, Birnen, und Bananen)
      addressed: lesson 1 Learn shows the list ending with und and no comma; every stage of lesson 1 offers a comma before und or oder as wrong (l1-f2, l1-s2, l1-n4), with feedback in l1-f2 and l1-f4
    - id: forgets-commas
      what: Leaves out the commas in a longer list
      addressed: a "Wie viele Kommas fehlen?" task in every stage of both lessons and in both checks; true/false cards with a missing comma (l1-n5, l2-n5)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

