# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.verbs-perfect
skill: lit-de.verbs.perfect
curriculum: de-DE
language: de
title:
  de: Das Perfekt
  en: The present perfect
summary: >
  The Perfekt is the past we use when we speak: Ich habe gespielt. It has
  two parts, haben or sein and the Partizip (gespielt, gegessen). Lesson 1
  builds the Perfekt with haben, the Partizip with ge-...-t and
  ge-...-en, and the Satzklammer around the rest of the sentence; lesson 2
  adds sein for verbs of moving and changing (ich bin gelaufen, er ist
  eingeschlafen), sets spoken Perfekt beside written Präteritum, and ends
  with the skill check. Verbs whose helper differs by region (sitzen,
  stehen, liegen) are left out.
metadata:
  year: klasse-4
  topic: { de: Zeitformen, en: Tenses }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.verbs.simple-past]
  also_practises: [lit-de.verbs.base-form]
  vocabulary: { de: [Perfekt, Partizip, Hilfsverb, haben, sein, Vergangenheit] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: partizip, what: { de: das Partizip schwacher und starker Verben bilden, en: forming the participle of weak and strong verbs } }
    - { id: haben-sein, what: { de: das Perfekt mit haben oder sein bilden, en: forming the perfect with haben or sein } }
    - { id: two-parts, what: { de: beide Teile des Perfekts finden und einsetzen, en: finding and filling in both parts of the perfect } }
    - { id: speaking, what: { de: "wissen, dass man beim Erzählen meist das Perfekt sagt", en: knowing that the perfect is mostly used when speaking } }
  misconceptions:
    - id: missing-helper
      what: Writes only the Partizip (Ich gespielt.)
      addressed: lesson 1 Learn names both parts; fill-in tasks leave a gap for the Hilfsverb and feedback says the Perfekt has two parts
    - id: weak-partizip-on-strong
      what: Forms strong verbs with -t (gegesst, gesingt)
      addressed: lesson 1 Learn sets gespielt beside gegessen; feedback on "gegesst" and "gesingt" options
    - id: haben-for-movement
      what: Uses haben with verbs of moving (Ich habe gelaufen.)
      addressed: lesson 2 Learn gives the rule for sein (moving from one place to another, or changing); feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Perfekt mit haben, en: The perfect with haben }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Gestern _ wir Fußball."
            say: "Welche Form von spielen im Präteritum passt? Gestern ... wir Fußball."
            options: ["spielen", "spielten", "spielt"]
            answer: "spielten"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Präteritum von „essen“: Er _."
            say: "Wie heißt essen im Präteritum? Er ..."
            options: ["aß", "esste", "isst"]
            answer: "aß"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ich habe Fußball gespielt."
            say: "Wenn wir erzählen, was wir gemacht haben, benutzen wir meist das Perfekt. Es hat zwei Teile: eine Form von haben und das Partizip, hier gespielt."
          - text: "spielen → gespielt · essen → gegessen"
            say: "Schwache Verben bilden das Partizip mit ge und t: gespielt, gekauft. Starke Verben mit ge und en: gegessen, gelesen, geschrieben."
          - text: "Ich habe gestern im Garten Fußball gespielt."
            say: "Die zwei Teile stehen wie eine Klammer um den Satz. Habe steht an zweiter Stelle, das Partizip ganz am Ende."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Ergänze das Hilfsverb."
                say: "Setz die passende Form von haben ein: Ich ... ein Eis gekauft."
                frame: "Ich _ ein Eis gekauft."
                options: ["habe", "hast", "hat", "haben"]
                answer: ["habe"]
                hints:
                  - "Wer hat gekauft? Ich."
                  - "Ich habe, du hast, er hat."
                  - "Ich habe ein Eis gekauft."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Mia hat ein Lied _."
                say: "Welches Partizip von singen passt? Mia hat ein Lied ..."
                options: ["gesingt", "gesungen", "gesangen"]
                answer: "gesungen"
                feedback:
                  "gesingt": "„Singen“ ist ein starkes Verb. Das Partizip endet auf „en“, und der Selbstlaut ändert sich: gesungen."
                hints:
                  - "„Singen“ ist ein starkes Verb."
                  - "Starke Verben enden im Partizip auf „en“."
                  - "Mia hat ein Lied gesungen."
              - id: l1-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Grundform mit ihrem Partizip."
                option_audio: false
                pairs:
                  - { left: { text: "malen" }, right: { text: "gemalt" } }
                  - { left: { text: "trinken" }, right: { text: "getrunken" } }
                  - { left: { text: "lesen" }, right: { text: "gelesen" } }
                  - { left: { text: "bauen" }, right: { text: "gebaut" } }
                hints:
                  - "Alle Partizipien fangen mit „ge“ an."
                  - "„Malen“ und „bauen“ enden auf „t“."
                  - "gemalt, getrunken, gelesen, gebaut."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? „Tim gegessen eine Banane.“"
                say: "Tim gegessen eine Banane. Ist der Satz richtig?"
                answer: false
                feedback:
                  "true": "Das Perfekt hat zwei Teile. Es fehlt „hat“: Tim hat eine Banane gegessen."
                hints:
                  - "Das Perfekt hat zwei Teile."
                  - "Es fehlt die Form von „haben“."
                  - "Nein. Richtig ist: Tim hat eine Banane gegessen."
              - id: l1-f5
                type: highlight_in_text
                text: "Tippe auf beide Teile des Perfekts."
                say: "Tippe auf die zwei Wörter, die zusammen das Perfekt bilden."
                show: { drawn: letter-card, text: "Wir haben am Montag einen Kuchen gebacken." }
                spans: ["haben", "gebacken"]
                hints:
                  - "Ein Teil ist eine Form von „haben“."
                  - "Der andere steht am Ende und fängt mit „ge“ an."
                  - "„haben“ und „gebacken“."
              - id: l1-f6
                type: fill_in_blank
                text: "Ergänze das Partizip."
                say: "Setz das Partizip von schreiben ein: Lena hat einen Brief ..."
                frame: "Lena hat einen Brief _."
                options: ["geschreibt", "geschrieben", "schrieb"]
                answer: ["geschrieben"]
                hints:
                  - "„Schreiben“ ist ein starkes Verb."
                  - "Das Partizip endet auf „en“, der Selbstlaut wird „ie“."
                  - "Lena hat einen Brief geschrieben."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Ergänze das Hilfsverb."
                say: "Setz die passende Form von haben ein: Du ... das Fenster geputzt."
                frame: "Du _ das Fenster geputzt."
                options: ["habe", "hast", "hat", "haben"]
                answer: ["hast"]
                hints: ["Welche Form von „haben“ gehört zu „du“?"]
              - id: l1-s2
                type: multiple_choice
                text: "Wir haben Saft _."
                say: "Welches Partizip von trinken passt? Wir haben Saft ..."
                options: ["getrinkt", "getrunken", "getranken"]
                answer: "getrunken"
                hints: ["„Trinken“ ist ein starkes Verb."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf beide Teile des Perfekts."
                say: "Tippe auf die zwei Wörter, die zusammen das Perfekt bilden."
                show: { drawn: letter-card, text: "Papa hat gestern das Auto gewaschen." }
                spans: ["hat", "gewaschen"]
                hints: ["Such eine Form von „haben“ und das Wort am Ende."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? „Ich habe ein Bild gemalt.“"
                say: "Ich habe ein Bild gemalt. Ist der Satz richtig?"
                answer: true
                hints: ["Sind beide Teile da?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Ergänze das Partizip."
                say: "Setz das Partizip von sehen ein: Habt ihr den Film ...?"
                frame: "Habt ihr den Film _?"
                options: ["gesieht", "gesehen", "gesah"]
                answer: ["gesehen"]
                hints: ["Ist „sehen“ schwach oder stark?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Ergänze das Hilfsverb."
                say: "Setz die passende Form von haben ein: Die Kinder ... laut gelacht."
                frame: "Die Kinder _ laut gelacht."
                options: ["habe", "hast", "hat", "haben"]
                answer: ["haben"]
              - id: l1-n2
                type: multiple_choice
                text: "Opa hat die Zeitung _."
                say: "Welches Partizip von lesen passt? Opa hat die Zeitung ..."
                options: ["gelest", "gelesen", "gelas"]
                answer: "gelesen"
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf beide Teile des Perfekts."
                say: "Tippe auf die zwei Wörter, die zusammen das Perfekt bilden."
                show: { drawn: letter-card, text: "Hast du deine Hausaufgaben schon gemacht?" }
                spans: ["Hast", "gemacht"]
              - id: l1-n4
                type: true_false
                text: "Stimmt das? „Sie hat den Ball gewerft.“"
                say: "Sie hat den Ball gewerft. Ist der Satz richtig?"
                answer: false
              - id: l1-n5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Grundform mit ihrem Partizip."
                option_audio: false
                pairs:
                  - { left: { text: "kochen" }, right: { text: "gekocht" } }
                  - { left: { text: "finden" }, right: { text: "gefunden" } }
                  - { left: { text: "nehmen" }, right: { text: "genommen" } }
                  - { left: { text: "suchen" }, right: { text: "gesucht" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Ergänze das Hilfsverb."
            say: "Setz die passende Form von haben ein: Er ... den Tisch gedeckt."
            frame: "Er _ den Tisch gedeckt."
            options: ["habe", "hast", "hat", "haben"]
            answer: ["hat"]
          - id: l1-c2
            type: multiple_choice
            text: "Ich habe einen Schlüssel _."
            say: "Welches Partizip von finden passt? Ich habe einen Schlüssel ..."
            options: ["gefindet", "gefunden", "gefanden"]
            answer: "gefunden"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? „Wir haben Pizza gegessen.“"
            say: "Wir haben Pizza gegessen. Ist der Satz richtig?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Ergänze das Hilfsverb."
            say: "Setz die passende Form von haben ein: Wir ... im Sandkasten gegraben."
            frame: "Wir _ im Sandkasten gegraben."
            options: ["habe", "hast", "hat", "haben"]
            answer: ["haben"]
          - id: l1-c5
            type: highlight_in_text
            text: "Tippe auf beide Teile des Perfekts."
            say: "Tippe auf die zwei Wörter, die zusammen das Perfekt bilden."
            show: { drawn: letter-card, text: "Mama hat heute Nudeln gekocht." }
            spans: ["hat", "gekocht"]
          - id: l1-c6
            type: true_false
            text: "Stimmt das? „Du hast ein Bild gemalen.“"
            say: "Du hast ein Bild gemalen. Ist der Satz richtig?"
            answer: false

  - n: 2
    title: { de: Perfekt mit sein, en: The perfect with sein }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Ergänze das Hilfsverb."
            say: "Setz die passende Form von haben ein: Ihr ... Musik gehört."
            frame: "Ihr _ Musik gehört."
            options: ["habe", "habt", "hat", "haben"]
            answer: ["habt"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Mama hat Suppe _."
            say: "Welches Partizip von kochen passt? Mama hat Suppe ..."
            options: ["gekocht", "gekochen", "kochte"]
            answer: "gekocht"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ich bin nach Hause gelaufen."
            say: "Manche Verben bilden das Perfekt mit sein. Das sind vor allem Verben, bei denen man sich von einem Ort zum anderen bewegt: gehen, laufen, fahren, kommen, fliegen."
          - text: "Das Baby ist eingeschlafen. Die Blume ist gewachsen."
            say: "Auch wenn sich etwas verändert, nimmst du sein: einschlafen, aufwachen, wachsen. Ich bin, du bist, er ist, wir sind, ihr seid, sie sind."
          - text: "Erzählen: Ich bin gelaufen. · Buch: Ich lief."
            say: "Wenn du jemandem etwas erzählst, sagst du meist das Perfekt. In geschriebenen Geschichten steht meist das Präteritum."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wir _ mit dem Zug gefahren."
                say: "Welches Hilfsverb passt? Wir ... mit dem Zug gefahren."
                options: ["haben", "sind", "hat"]
                answer: "sind"
                feedback:
                  "haben": "Beim Fahren bewegst du dich von einem Ort zum anderen. Dann nimmst du „sein“: wir sind gefahren."
                hints:
                  - "Bewegt ihr euch von einem Ort zum anderen?"
                  - "Bei Bewegung nimmst du „sein“."
                  - "Wir sind mit dem Zug gefahren."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ich _ ein Buch gelesen."
                say: "Welches Hilfsverb passt? Ich ... ein Buch gelesen."
                options: ["habe", "bin", "hat"]
                answer: "habe"
                feedback:
                  "bin": "Beim Lesen bewegst du dich nicht von einem Ort zum anderen. „Lesen“ bildet das Perfekt mit „haben“."
                hints:
                  - "Bewegst du dich beim Lesen von einem Ort zum anderen?"
                  - "Nein. Dann nimmst du „haben“."
                  - "Ich habe ein Buch gelesen."
              - id: l2-f3
                type: sorting
                text: "haben oder sein?"
                say: "Sortiere die Verben. Bilden sie das Perfekt mit haben oder mit sein?"
                option_audio: false
                bins:
                  - { id: haben, show: { text: "haben" }, say: "haben" }
                  - { id: sein, show: { text: "sein" }, say: "sein" }
                options:
                  - { text: "laufen", bin: sein }
                  - { text: "malen", bin: haben }
                  - { text: "kommen", bin: sein }
                  - { text: "essen", bin: haben }
                hints:
                  - "Bei welchem Verb geht man von einem Ort zum anderen?"
                  - "„Laufen“ und „kommen“ sind Bewegungen."
                  - "„Laufen“ und „kommen“ gehören zu „sein“, „malen“ und „essen“ zu „haben“."
              - id: l2-f4
                type: fill_in_blank
                text: "Ergänze das Hilfsverb."
                say: "Setz die passende Form von sein ein: Der Vogel ... weggeflogen."
                frame: "Der Vogel _ weggeflogen."
                options: ["bin", "bist", "ist", "sind"]
                answer: ["ist"]
                hints:
                  - "„Wegfliegen“ ist eine Bewegung: „sein“."
                  - "Für den Vogel kannst du „er“ sagen."
                  - "Der Vogel ist weggeflogen."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? „Ich habe zur Schule gelaufen.“"
                say: "Ich habe zur Schule gelaufen. Ist der Satz richtig?"
                answer: false
                feedback:
                  "true": "Beim Laufen bewegst du dich zu einem Ort. Richtig ist: Ich bin zur Schule gelaufen."
                hints:
                  - "Ist „laufen“ eine Bewegung?"
                  - "Ja, dann nimmst du „sein“."
                  - "Nein. Richtig ist: Ich bin zur Schule gelaufen."
              - id: l2-f6
                type: multiple_choice
                text: "Was sagst du zu deiner Freundin?"
                say: "Du erzählst deiner Freundin vom Wochenende. Was sagst du meistens?"
                options: ["Ich bin ins Kino gegangen.", "Ich ging ins Kino."]
                answer: "Ich bin ins Kino gegangen."
                option_audio: false
                hints:
                  - "Beim Erzählen sagt man meist das Perfekt."
                  - "Das Perfekt hat zwei Teile."
                  - "Ich bin ins Kino gegangen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Lena _ früh aufgewacht."
                say: "Welches Hilfsverb passt? Lena ... früh aufgewacht."
                options: ["hat", "ist", "haben"]
                answer: "ist"
                hints: ["Verändert sich hier etwas?"]
              - id: l2-s2
                type: multiple_choice
                text: "Du _ den Ball gefangen."
                say: "Welches Hilfsverb passt? Du ... den Ball gefangen."
                options: ["hast", "bist", "hat"]
                answer: "hast"
                hints: ["Gehst du beim Fangen von einem Ort zum anderen?"]
              - id: l2-s3
                type: sorting
                text: "haben oder sein?"
                say: "Sortiere die Verben. Bilden sie das Perfekt mit haben oder mit sein?"
                option_audio: false
                bins:
                  - { id: haben, show: { text: "haben" }, say: "haben" }
                  - { id: sein, show: { text: "sein" }, say: "sein" }
                options:
                  - { text: "fallen", bin: sein }
                  - { text: "schreiben", bin: haben }
                  - { text: "wachsen", bin: sein }
                  - { text: "kaufen", bin: haben }
                hints: ["Bei Bewegung oder Veränderung nimmst du „sein“."]
              - id: l2-s4
                type: fill_in_blank
                text: "Ergänze das Hilfsverb."
                say: "Setz die passende Form von sein ein: Ihr ... spät nach Hause gekommen."
                frame: "Ihr _ spät nach Hause gekommen."
                options: ["bin", "seid", "ist", "sind"]
                answer: ["seid"]
                hints: ["Welche Form von „sein“ gehört zu „ihr“?"]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? „Der Hund ist über den Zaun gesprungen.“"
                say: "Der Hund ist über den Zaun gesprungen. Ist der Satz richtig?"
                answer: true
                hints: ["Springt der Hund von einem Ort zum anderen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wir _ über den See geschwommen."
                say: "Welches Hilfsverb passt? Wir ... über den See geschwommen."
                options: ["haben", "sind", "hat"]
                answer: "sind"
              - id: l2-n2
                type: multiple_choice
                text: "Ich _ Opa einen Brief geschickt."
                say: "Welches Hilfsverb passt? Ich ... Opa einen Brief geschickt."
                options: ["habe", "bin", "hat"]
                answer: "habe"
              - id: l2-n3
                type: sorting
                text: "haben oder sein?"
                say: "Sortiere die Verben. Bilden sie das Perfekt mit haben oder mit sein?"
                option_audio: false
                bins:
                  - { id: haben, show: { text: "haben" }, say: "haben" }
                  - { id: sein, show: { text: "sein" }, say: "sein" }
                options:
                  - { text: "einschlafen", bin: sein }
                  - { text: "trinken", bin: haben }
                  - { text: "fliegen", bin: sein }
                  - { text: "spielen", bin: haben }
              - id: l2-n4
                type: fill_in_blank
                text: "Ergänze das Hilfsverb."
                say: "Setz die passende Form von sein ein: Du ... gestern hingefallen."
                frame: "Du _ gestern hingefallen."
                options: ["bin", "bist", "ist", "sind"]
                answer: ["bist"]
              - id: l2-n5
                type: multiple_choice
                text: "Was steht eher in einem Märchenbuch?"
                say: "Welcher Satz steht eher in einem Märchenbuch?"
                options: ["Der Prinz ritt in den Wald.", "Der Prinz ist in den Wald geritten."]
                answer: "Der Prinz ritt in den Wald."
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: haben-sein
            type: multiple_choice
            text: "Die Kinder _ in den Park gegangen."
            say: "Welches Wort passt? Die Kinder ... in den Park gegangen."
            options: ["haben", "sind", "hat"]
            answer: "sind"
          - id: l2-c2
            part: partizip
            type: multiple_choice
            text: "Paul hat ein Haus aus Holz _."
            say: "Welches Wort passt? Paul hat ein Haus aus Holz ..."
            options: ["gebaut", "gebauen", "baute"]
            answer: "gebaut"
          - id: l2-c3
            part: two-parts
            type: fill_in_blank
            text: "Ergänze das Perfekt."
            say: "Setz beide Teile des Perfekts von kaufen ein: Ich ... ein Buch ..."
            frame: "Ich _ ein Buch _."
            options: ["habe", "bin", "gekauft", "gekaufen"]
            answer: ["habe", "gekauft"]
          - id: l2-c4
            part: haben-sein
            type: true_false
            text: "Stimmt das? „Wir haben nach Italien geflogen.“"
            say: "Wir haben nach Italien geflogen. Ist der Satz richtig?"
            answer: false
          - id: l2-c5
            part: two-parts
            type: highlight_in_text
            text: "Tippe auf beide Teile des Perfekts."
            say: "Tippe auf die zwei Wörter, die zusammen das Perfekt bilden."
            show: { drawn: letter-card, text: "Am Abend ist die Sonne hinter dem Berg untergegangen." }
            spans: ["ist", "untergegangen"]
          - id: l2-c6
            part: partizip
            type: multiple_choice
            text: "schlafen: Das Baby hat lange _."
            say: "Welches Partizip von schlafen passt? Das Baby hat lange ..."
            options: ["geschlaft", "geschlafen", "geschliefen"]
            answer: "geschlafen"
          - id: l2-c7
            part: partizip
            type: matching
            text: "Welches Partizip gehört zu welchem Verb?"
            say: "Verbinde jedes Verb mit seinem Partizip."
            option_audio: false
            pairs:
              - { left: { text: "fragen" }, right: { text: "gefragt" } }
              - { left: { text: "helfen" }, right: { text: "geholfen" } }
              - { left: { text: "werfen" }, right: { text: "geworfen" } }
              - { left: { text: "tanzen" }, right: { text: "getanzt" } }
          - id: l2-c8
            part: partizip
            type: fill_in_blank
            text: "Ergänze das Partizip von sprechen."
            say: "Setz das Partizip von sprechen ein: Wir haben lange miteinander ..."
            frame: "Wir haben lange miteinander _."
            options: ["gesprecht", "gesprochen", "gesprachen"]
            answer: ["gesprochen"]
          - id: l2-c9
            part: partizip
