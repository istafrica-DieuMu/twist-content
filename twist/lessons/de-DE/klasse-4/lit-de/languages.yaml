# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.languages
skill: lit-de.vocabulary.languages
curriculum: de-DE
language: de
title:
  de: Sprachen und Dialekte vergleichen
  en: Comparing languages and dialects
summary: >
  Comparing German with other languages children may speak at home or in
  class, and with its own Dialekte. Lesson 1 finds words that sound alike
  across languages (Nacht, night, notte, noche; Haus, house), greets in
  Englisch, Türkisch, Polnisch, Italienisch and Spanisch, and notices what
  works differently (the for der, die and das in English, no such article in Turkish, capital
  nouns only in German, Arabic written from right to left). Lesson 2 takes
  Dialekte: Brötchen as Semmel, Schrippe, Rundstück or Weckle, Moin and
  Servus, Sonnabend and Samstag, and ends with the skill check. Every word
  is shown in Latin letters; hearing the other languages waits for voices
  in those languages.
metadata:
  year: klasse-4
  topic: { de: Sprache untersuchen, en: Exploring language }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: []
  also_practises: [lit-de.vocabulary.spoken-written]
  vocabulary: { de: [Sprache, verwandt, ähnlich, Artikel, Dialekt, Standardsprache, Gegend, Begrüßung] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: alike, what: { de: ähnliche Wörter in verwandten Sprachen finden, en: finding similar words in related languages } }
    - { id: different, what: { de: "Unterschiede zwischen Sprachen entdecken (Wörter, Artikel, Schrift)", en: "spotting how languages differ (words, articles, writing)" } }
    - { id: dialect-words, what: { de: Wörter aus Dialekten verstehen, en: understanding dialect words } }
    - { id: dialect-region, what: { de: Dialekte einer Gegend zuordnen und von der Standardsprache unterscheiden, en: placing dialects in a region and telling them from standard German } }
  misconceptions:
    - id: german-is-the-pattern
      what: Expects other languages to work like German, word for word, with der, die, das and capital nouns
      addressed: "lesson 1 Learn compares articles and capitals; l1-f4, l1-f5, l1-s5, l1-n4, l1-c3 and l2-c3 ask what works differently, with feedback on l1-f5"
    - id: dialect-is-wrong
      what: Thinks a Dialekt word is a mistake rather than the word of a region
      addressed: "lesson 2 Learn calls dialect words real words of a region; l2-f4, l2-s4 and l2-n4 ask directly; l2-f5 gives feedback on Dialekte sind verboten"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wörter aus vielen Sprachen", en: "Words from many languages" }
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Deutsch: Nacht\nEnglisch: night\nNiederländisch: nacht\nFranzösisch: nuit\nItalienisch: notte\nSpanisch: noche"
            say: "Schau dir das Wort Nacht in sechs Sprachen an. Es klingt überall ein bisschen ähnlich. Viele Sprachen sind miteinander verwandt, wie in einer großen Familie. Deutsch, Englisch und Niederländisch sind enge Verwandte, Italienisch, Spanisch und Französisch auch."
          - text: "Hallo!\nEnglisch: Hello!\nTürkisch: Merhaba!\nPolnisch: Cześć!\nItalienisch: Ciao!\nSpanisch: Hola!"
            say: "Andere Wörter sind ganz verschieden. So grüßt man in fünf anderen Sprachen. Vielleicht spricht jemand in deiner Klasse eine dieser Sprachen. Dann frag doch mal nach."
          - text: "Deutsch: der Hund, die Katze, das Pferd\nEnglisch: the dog, the cat, the horse\nTürkisch: köpek, kedi, at"
            say: "Sprachen funktionieren auch unterschiedlich. Im Deutschen gibt es der, die und das. Im Englischen gibt es nur the. Im Türkischen gibt es gar keinen solchen Artikel. Und nur im Deutschen schreibt man Nomen groß. Arabisch schreibt man sogar von rechts nach links."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches englische Wort ist dem deutschen Wort Haus ähnlich?"
                options: ["house", "garden", "window"]
                answer: "house"
                hints:
                  - "Sprich die Wörter leise vor dich hin."
                  - "Welches Wort klingt fast wie Haus?"
                  - "Das Wort house."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Welche Wörter sind verwandt?"
                say: "Verbinde jedes deutsche Wort mit dem englischen Wort, das ihm ähnlich ist."
                pairs:
                  - { left: { text: "Maus" }, right: { text: "mouse" } }
                  - { left: { text: "Wasser" }, right: { text: "water" } }
                  - { left: { text: "Vater" }, right: { text: "father" } }
                  - { left: { text: "Apfel" }, right: { text: "apple" } }
                hints:
                  - "Schau auf die ersten Buchstaben."
                  - "Wasser und water fangen beide mit wa an."
                  - "Maus: mouse. Wasser: water. Vater: father. Apfel: apple."
              - id: l1-f3
                type: sorting
                text: "Schule in anderen Sprachen: ähnlich oder ganz anders?"
                say: "So heißt Schule in anderen Sprachen. Sortiere: Klingt das Wort ähnlich wie Schule oder ganz anders?"
                bins:
                  - { id: alike, show: { text: "ähnlich" }, say: "ähnlich" }
                  - { id: unlike, show: { text: "ganz anders" }, say: "ganz anders" }
                options:
                  - { text: "school (Englisch)", bin: alike }
                  - { text: "scuola (Italienisch)", bin: alike }
                  - { text: "escuela (Spanisch)", bin: alike }
                  - { text: "okul (Türkisch)", bin: unlike }
                hints:
                  - "Welche Wörter haben ein sch oder sc und ein l?"
                  - "Okul klingt anders als Schule."
                  - "Ähnlich sind school, scuola und escuela. Ganz anders ist okul."
              - id: l1-f4
                type: true_false
                text: "Im Englischen schreibt man Nomen wie dog und cat auch groß. Stimmt das?"
                answer: false
                hints:
                  - "Wie sind dog und cat geschrieben?"
                  - "Im Englischen schreibt man nur Namen und den Satzanfang groß."
                  - "Nein, nur im Deutschen schreibt man alle Nomen groß."
              - id: l1-f5
                type: multiple_choice
                text: "Was ist im Englischen anders als im Deutschen?"
                options: ["Statt der, die und das gibt es nur the.", "Es gibt keine Wörter für Tiere.", "Man schreibt von rechts nach links."]
                answer: "Statt der, die und das gibt es nur the."
                feedback:
                  "Man schreibt von rechts nach links.": "Englisch schreibt man von links nach rechts, wie Deutsch. Von rechts nach links schreibt man zum Beispiel Arabisch."
                hints:
                  - "Denk an the dog, the cat, the horse."
                  - "Im Deutschen sagst du der Hund, die Katze, das Pferd. Und im Englischen?"
                  - "Statt der, die und das gibt es im Englischen nur the."
              - id: l1-f6
                type: multiple_choice
                text: "Emre aus deiner Klasse sagt: „Merhaba!“ Was meint er?"
                say: "Emre aus deiner Klasse sagt: Merhaba! Was meint er?"
                options: ["Hallo!", "Tschüss!", "Danke!"]
                answer: "Hallo!"
                hints:
                  - "Merhaba ist Türkisch."
                  - "Schau dir die Begrüßungen noch einmal an."
                  - "Merhaba heißt Hallo."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Deutsch: Nacht. Italienisch: notte. Spanisch: noche. Was fällt dir auf?"
                options: ["Die Wörter klingen ähnlich.", "Die Wörter sind genau gleich.", "Die Wörter haben nichts gemeinsam."]
                answer: "Die Wörter klingen ähnlich."
                hints: ["Vergleiche die ersten Buchstaben: N, n, n."]
              - id: l1-s2
                type: matching
                text: "So grüßt man in anderen Sprachen."
                say: "Verbinde jede Sprache mit ihrer Begrüßung."
                pairs:
                  - { left: { text: "Englisch" }, right: { text: "Hello!" } }
                  - { left: { text: "Italienisch" }, right: { text: "Ciao!" } }
                  - { left: { text: "Spanisch" }, right: { text: "Hola!" } }
                  - { left: { text: "Türkisch" }, right: { text: "Merhaba!" } }
                option_audio: false
                hints: ["Ciao hörst du oft in Italien."]
              - id: l1-s3
                type: sorting
                text: "Mutter in anderen Sprachen: ähnlich oder ganz anders?"
                say: "So heißt Mutter in anderen Sprachen. Sortiere: Klingt das Wort ähnlich wie Mutter oder ganz anders?"
                bins:
                  - { id: alike, show: { text: "ähnlich" }, say: "ähnlich" }
                  - { id: unlike, show: { text: "ganz anders" }, say: "ganz anders" }
                options:
                  - { text: "mother (Englisch)", bin: alike }
                  - { text: "madre (Italienisch)", bin: alike }
                  - { text: "matka (Polnisch)", bin: alike }
                  - { text: "anne (Türkisch)", bin: unlike }
                hints: ["Welche Wörter fangen mit m an?"]
              - id: l1-s4
                type: true_false
                text: "Arabisch schreibt man von rechts nach links. Stimmt das?"
                answer: true
                hints: ["Arabische Bücher schlägt man von der anderen Seite auf."]
              - id: l1-s5
                type: multiple_choice
                text: "Im Türkischen gibt es keinen Artikel wie der, die oder das. Was heißt das?"
                options: ["Man sagt einfach kedi, ohne Artikel davor.", "Man darf das Wort Katze nicht sagen.", "Alle Nomen sind weiblich."]
                answer: "Man sagt einfach kedi, ohne Artikel davor."
                hints: ["Kedi heißt Katze. Steht davor ein Artikel?"]
              - id: l1-s6
                type: multiple_choice
                text: "Wie findest du heraus, wie ein Wort in einer anderen Sprache heißt?"
                options: ["ein Kind fragen, das die Sprache spricht, oder im Wörterbuch nachsehen", "einfach raten", "das deutsche Wort lauter sagen"]
                answer: "ein Kind fragen, das die Sprache spricht, oder im Wörterbuch nachsehen"
                hints: ["Wer kennt die Sprache gut?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches englische Wort ist dem deutschen Wort Buch ähnlich?"
                options: ["book", "page", "read"]
                answer: "book"
              - id: l1-n2
                type: matching
                text: "Nacht in anderen Sprachen"
                say: "Verbinde jede Sprache mit ihrem Wort für Nacht."
                pairs:
                  - { left: { text: "Englisch" }, right: { text: "night" } }
                  - { left: { text: "Französisch" }, right: { text: "nuit" } }
                  - { left: { text: "Italienisch" }, right: { text: "notte" } }
                  - { left: { text: "Spanisch" }, right: { text: "noche" } }
                option_audio: false
              - id: l1-n3
                type: sorting
                text: "Milch in anderen Sprachen: ähnlich oder ganz anders?"
                say: "So heißt Milch in anderen Sprachen. Sortiere: Klingt das Wort ähnlich wie Milch oder ganz anders?"
                bins:
                  - { id: alike, show: { text: "ähnlich" }, say: "ähnlich" }
                  - { id: unlike, show: { text: "ganz anders" }, say: "ganz anders" }
                options:
                  - { text: "milk (Englisch)", bin: alike }
                  - { text: "melk (Niederländisch)", bin: alike }
                  - { text: "mleko (Polnisch)", bin: alike }
                  - { text: "süt (Türkisch)", bin: unlike }
              - id: l1-n4
                type: true_false
                text: "Im Deutschen schreibt man Nomen groß. Ist das in fast allen anderen Sprachen auch so?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Kasia begrüßt dich mit „Cześć!“. Aus welcher Sprache kommt das?"
                say: "Kasia begrüßt dich mit einem Gruß. Lies ihn. Aus welcher Sprache kommt das?"
                options: ["aus dem Polnischen", "aus dem Englischen", "aus dem Spanischen"]
                answer: "aus dem Polnischen"
              - id: l1-n6
                type: multiple_choice
                text: "Warum klingen Haus und house so ähnlich?"
                options: ["Deutsch und Englisch sind miteinander verwandt.", "Jemand hat sich verschrieben.", "Das ist reiner Zufall."]
                answer: "Deutsch und Englisch sind miteinander verwandt."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches englische Wort ist dem deutschen Wort Garten ähnlich?"
            options: ["garden", "flower", "tree"]
            answer: "garden"
          - id: l1-c2
            type: multiple_choice
            text: "Wie grüßt man auf Spanisch?"
            options: ["Hola!", "Merhaba!", "Cześć!"]
            answer: "Hola!"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Gibt es im Englischen die Artikel der, die und das?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Welches englische Wort ist dem deutschen Wort Bruder ähnlich?"
            options: ["brother", "sister", "baby"]
            answer: "brother"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Im Polnischen grüßt man mit „Cześć!“."
            say: "Stimmt das? Im Polnischen grüßt man mit dem Wort, das hier steht."
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Was ist im Türkischen anders als im Deutschen?"
            options: ["Es gibt keinen Artikel wie der, die oder das.", "Man schreibt von rechts nach links.", "Es gibt keine Wörter für Tiere."]
            answer: "Es gibt keinen Artikel wie der, die oder das."

  - n: 2
    title: { de: "Dialekte in Deutschland", en: "Dialects in Germany" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches englische Wort ist dem deutschen Wort Vater ähnlich?"
            options: ["father", "family", "friend"]
            answer: "father"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Auf Italienisch sagt man zur Begrüßung Ciao. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Brötchen\nHamburg: Rundstück\nBerlin: Schrippe\nBayern: Semmel\nSchwaben: Weckle"
            say: "Auch in Deutschland spricht man nicht überall gleich. In vielen Gegenden gibt es einen Dialekt. Ein Brötchen heißt in Hamburg Rundstück, in Berlin Schrippe, in Bayern Semmel und in Schwaben Weckle."
          - text: "Guten Tag!\nim Norden: Moin!\nin Bayern: Servus! Grüß Gott!\nin der Schweiz: Grüezi!"
            say: "Auch zur Begrüßung sagt man nicht überall dasselbe. Im Norden sagt man Moin, in Bayern Servus oder Grüß Gott und in der Schweiz Grüezi."
          - text: "Sonnabend = Samstag (Norden)\nDeern = Mädchen (Norden)\nErdapfel = Kartoffel (Süden)\nBub = Junge (Süden)\nick = ich (Berlin)\nnet = nicht (Bayern)"
            say: "Dialekte haben eigene Wörter und eigene Laute. Im Norden sagen viele Sonnabend statt Samstag und Deern statt Mädchen. Im Süden heißt die Kartoffel oft Erdapfel und der Junge Bub. Ein Berliner sagt ick statt ich, eine Bayerin net statt nicht. Diese Wörter sind nicht falsch. Sie gehören zu einer Gegend. In der Schule schreibt man die Standardsprache, damit alle in Deutschland den Text verstehen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Lea ist in Bayern beim Bäcker und kauft eine Semmel. Was kauft sie?"
                options: ["ein Brötchen", "ein Stück Kuchen", "eine Brezel"]
                answer: "ein Brötchen"
                feedback:
                  "eine Brezel": "Eine Brezel heißt in Bayern Breze. Semmel ist das bayerische Wort für Brötchen."
                hints:
                  - "Semmel ist ein Wort aus einem Dialekt."
                  - "Denk an die vielen Namen für ein Brötchen."
                  - "Eine Semmel ist ein Brötchen."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was heißt das in der Standardsprache?"
                say: "Verbinde das Wort aus dem Dialekt mit dem Wort aus der Standardsprache."
                pairs:
                  - { left: { text: "Schrippe" }, right: { text: "Brötchen" } }
                  - { left: { text: "Bub" }, right: { text: "Junge" } }
                  - { left: { text: "Erdapfel" }, right: { text: "Kartoffel" } }
                  - { left: { text: "Sonnabend" }, right: { text: "Samstag" } }
                hints:
                  - "Ein Erdapfel wächst in der Erde."
                  - "Sonnabend ist ein Tag am Wochenende."
                  - "Schrippe: Brötchen. Bub: Junge. Erdapfel: Kartoffel. Sonnabend: Samstag."
              - id: l2-f3
                type: sorting
                text: "Wo grüßt man so?"
                say: "Sortiere: Grüßt man so eher im Norden oder eher im Süden?"
                bins:
                  - { id: north, show: { text: "im Norden" }, say: "im Norden" }
                  - { id: south, show: { text: "im Süden" }, say: "im Süden" }
                options:
                  - { text: "Moin!", bin: north }
                  - { text: "Moin moin!", bin: north }
                  - { text: "Servus!", bin: south }
                  - { text: "Grüß Gott!", bin: south }
                hints:
                  - "Bayern liegt im Süden von Deutschland."
                  - "In Bayern sagt man Servus und Grüß Gott."
                  - "Moin: Norden. Servus und Grüß Gott: Süden."
              - id: l2-f4
                type: true_false
                text: "Opa kommt aus Hamburg und sagt Sonnabend statt Samstag. Spricht er falsch?"
                answer: false
                hints:
                  - "Ist Sonnabend ein Fehler oder ein Wort aus einer Gegend?"
                  - "Im Norden sagen viele Menschen Sonnabend."
                  - "Nein, Opa spricht nicht falsch."
              - id: l2-f5
                type: multiple_choice
                text: "Warum schreibt man in der Schule meistens die Standardsprache?"
                options: ["Damit alle in Deutschland den Text verstehen.", "Weil Dialekte verboten sind.", "Weil Dialekte keine richtigen Wörter haben."]
                answer: "Damit alle in Deutschland den Text verstehen."
                feedback:
                  "Weil Dialekte verboten sind.": "Dialekte sind nicht verboten. Viele Menschen sprechen sie gern. Die Standardsprache verstehen aber alle."
                hints:
                  - "Versteht ein Kind aus Hamburg sofort das Wort Weckle?"
                  - "Die Standardsprache ist überall gleich."
                  - "Damit alle den Text verstehen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Tom aus Berlin sagt: „Ick hab Hunger.“ Was heißt ick?"
                say: "Tom aus Berlin sagt: Ick hab Hunger. Was heißt ick?"
                options: ["ich", "ihr", "es"]
                answer: "ich"
                hints: ["Wer hat Hunger?"]
              - id: l2-s2
                type: matching
                text: "Wo grüßt man so?"
                say: "Verbinde jeden Gruß mit der Gegend, in der man ihn oft hört."
                pairs:
                  - { left: { text: "Grüezi!" }, right: { text: "Schweiz" } }
                  - { left: { text: "Moin!" }, right: { text: "Norddeutschland" } }
                  - { left: { text: "Servus!" }, right: { text: "Bayern" } }
                hints: ["Grüezi klingt nach der Schweiz."]
              - id: l2-s3
                type: sorting
                text: "Standardsprache oder Wort aus einer Gegend?"
                say: "Sortiere: Ist das ein Wort aus der Standardsprache oder ein Wort aus einer Gegend?"
                bins:
                  - { id: standard, show: { text: "Standardsprache" }, say: "Standardsprache" }
                  - { id: region, show: { text: "Wort aus einer Gegend" }, say: "Wort aus einer Gegend" }
                options:
                  - { text: "Brötchen", bin: standard }
                  - { text: "Kartoffel", bin: standard }
                  - { text: "Semmel", bin: region }
                  - { text: "Erdapfel", bin: region }
                hints: ["Welche Wörter versteht man überall in Deutschland?"]
              - id: l2-s4
                type: true_false
                text: "Ein Wort aus einem Dialekt kann in einer anderen Gegend fremd klingen. Stimmt das?"
                answer: true
                hints: ["Kennt man in Hamburg das Wort Weckle?"]
              - id: l2-s5
                type: multiple_choice
                text: "Oma aus Bayern sagt: „Des is net schlimm.“ Was heißt net?"
                say: "Oma aus Bayern sagt: Des is net schlimm. Was heißt net?"
                options: ["nicht", "nett", "nie"]
                answer: "nicht"
                hints: ["Ist es schlimm oder nicht?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Paul bestellt in Hamburg ein Rundstück mit Käse. Was bekommt er?"
                options: ["ein Brötchen mit Käse", "ein Stück Käsekuchen", "eine runde Pizza"]
                answer: "ein Brötchen mit Käse"
              - id: l2-n2
                type: matching
                text: "Was heißt das in der Standardsprache?"
                say: "Verbinde das Wort aus dem Dialekt mit dem Wort aus der Standardsprache."
                pairs:
                  - { left: { text: "Deern" }, right: { text: "Mädchen" } }
                  - { left: { text: "Weckle" }, right: { text: "Brötchen" } }
                  - { left: { text: "ick" }, right: { text: "ich" } }
                  - { left: { text: "net" }, right: { text: "nicht" } }
              - id: l2-n3
                type: sorting
                text: "Wo sagt man das eher?"
                say: "Sortiere: Sagt man das eher im Norden oder eher im Süden?"
                bins:
                  - { id: north, show: { text: "im Norden" }, say: "im Norden" }
                  - { id: south, show: { text: "im Süden" }, say: "im Süden" }
                options:
                  - { text: "Sonnabend", bin: north }
                  - { text: "Deern", bin: north }
                  - { text: "Semmel", bin: south }
                  - { text: "Bub", bin: south }
              - id: l2-n4
                type: true_false
                text: "Wer zu Hause Dialekt spricht, kann auch die Standardsprache lernen und sprechen. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Was ist ein Dialekt?"
                options: ["die besondere Sprache einer Gegend", "eine Sprache aus einem anderen Land", "eine Sprache, die man nur schreibt"]
                answer: "die besondere Sprache einer Gegend"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: alike
            type: multiple_choice
            text: "Welches englische Wort ist dem deutschen Wort Hand ähnlich?"
            options: ["hand", "head", "leg"]
            answer: "hand"
          - id: l2-c2
            part: alike
            type: matching
            text: "Deutsch und Englisch: Was gehört zusammen?"
            say: "Welche deutschen und englischen Wörter klingen ähnlich? Verbinde sie."
            pairs:
              - { left: { text: "Sonne" }, right: { text: "sun" } }
              - { left: { text: "Fisch" }, right: { text: "fish" } }
              - { left: { text: "Gras" }, right: { text: "grass" } }
              - { left: { text: "Bett" }, right: { text: "bed" } }
          - id: l2-c3
            part: different
