# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.write-feelings
skill: lit-de.writing.feelings
curriculum: de-DE
language: de
title:
  de: Gefühle und Gedanken erzählen
  en: Writing feelings and thoughts
summary: >
  Putting a character's feelings and thoughts into a story. Lesson 1
  chooses precise feeling words (enttäuscht, erleichtert, stolz) and shows
  a feeling through the body instead of only naming it; lesson 2 writes
  what a character thinks (dachte, fragte sich, überlegte), lets a feeling
  change from the start of a story to its end, and ends with the skill
  check. Writing a whole story freely waits for a free text task type;
  here the child chooses, sorts and fills. Every scene is written for
  Twist.
metadata:
  year: klasse-4
  topic: { de: Erzählen, en: Telling stories }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.writing.stories]
  also_practises: [lit-de.speaking.feelings, lit-de.verbs.simple-past]
  vocabulary: { de: [Gefühl, Gedanke, enttäuscht, erleichtert, stolz, nervös, neidisch, dachte, fragte sich, überlegte] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: only-gut-schlecht
      what: Names every feeling with the same few words (gut, schlecht, traurig, froh)
      addressed: "lesson 1 Learn sets precise words against gut and schlecht; l1-f1, l1-s1, l1-n1 and l2-c1 choose the precise word, with feedback on l1-f1 for the vague one"
    - id: tell-not-show
      what: Only names the feeling (Ich hatte Angst) and never shows it through the body or thoughts
      addressed: "lesson 1 Learn shows a feeling through the body; l1-f3, l1-s3, l1-n3 and l2-c2 choose the sentence that shows the feeling, with feedback on l1-f3; lesson 2 adds the character's thoughts"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gefühle zeigen", en: "Showing feelings" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wo ist eine Geschichte am spannendsten?"
            say: "Wo ist eine Geschichte am spannendsten?"
            options: ["am Höhepunkt", "in der Einleitung", "am Schluss"]
            answer: "am Höhepunkt"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Erzähl in der Vergangenheit."
            say: "Die Geschichte steht in der Vergangenheit. Welche Form passt?"
            frame: "Ich _ die Tür ganz langsam auf."
            options: ["machte", "mache", "machen"]
            answer: ["machte"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "gut: froh, stolz, erleichtert, glücklich\nschlecht: traurig, enttäuscht, wütend, nervös, neidisch"
            say: "Gut und schlecht sagen nicht viel. Es gibt viele genauere Wörter für Gefühle. Stolz ist man, wenn man etwas geschafft hat. Erleichtert ist man, wenn eine Sorge vorbei ist. Enttäuscht ist man, wenn etwas nicht so wird, wie man gehofft hat."
          - text: "Ich hatte Angst.\n\nMein Herz klopfte wie wild. Meine Hände wurden ganz feucht."
            say: "Du kannst ein Gefühl nennen: Ich hatte Angst. Spannender ist es, wenn du es zeigst. Was macht der Körper? Das Herz klopft, die Hände werden feucht. So spürt der Leser die Angst mit."
          - text: "Knie zittern: Angst\nGesicht wird heiß: Scham\nFäuste ballen: Wut\nin die Luft springen: Freude"
            say: "Der Körper verrät viele Gefühle. Wer wütend ist, ballt die Fäuste. Wer sich schämt, bekommt ein heißes Gesicht."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welches Gefühlswort passt am genauesten?"
                say: "Lies den Satz. Welches Gefühlswort passt am genauesten?"
                frame: "Nach drei Wochen Üben konnte Ida endlich Rad fahren. Sie war richtig _."
                options: ["stolz", "gut", "neidisch"]
                answer: ["stolz"]
                feedback:
                  "gut": "Gut stimmt, sagt aber nicht viel. Wie fühlt man sich, wenn man etwas geschafft hat?"
                hints:
                  - "Ida hat lange geübt und es geschafft."
                  - "Wie fühlt man sich, wenn man selbst etwas Schweres geschafft hat?"
                  - "stolz."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Was verrät der Körper? Verbinde."
                say: "Lies, was der Körper macht. Welches Gefühl steckt dahinter? Verbinde."
                pairs:
                  - { left: { text: "Ihre Knie zitterten." }, right: { text: "Angst" } }
                  - { left: { text: "Er ballte die Fäuste." }, right: { text: "Wut" } }
                  - { left: { text: "Sie hüpfte durchs Zimmer." }, right: { text: "Freude" } }
                option_audio: false
                hints:
                  - "Mach die Bewegung selbst. Wie fühlst du dich dabei?"
                  - "Wer hüpft, ist fröhlich. Wer die Fäuste ballt, ist sauer."
                  - "Knie zittern: Angst. Fäuste: Wut. Hüpfen: Freude."
              - id: l1-f3
                type: multiple_choice
                text: "Welcher Satz zeigt die Angst, ohne das Wort Angst zu benutzen?"
                say: "Welcher Satz zeigt die Angst, ohne das Wort Angst zu benutzen?"
                options: ["Mein Mund wurde trocken, und ich wagte kaum zu atmen.", "Ich hatte große Angst.", "Ich ging in den Keller."]
                answer: "Mein Mund wurde trocken, und ich wagte kaum zu atmen."
                feedback:
                  "Ich hatte große Angst.": "Hier wird das Gefühl nur genannt. Zeig es: Was macht der Körper?"
                hints:
                  - "Welcher Satz beschreibt, was der Körper macht?"
                  - "Ein Satz nennt die Angst, einer sagt gar nichts über Gefühle."
                  - "Mein Mund wurde trocken, und ich wagte kaum zu atmen."
              - id: l1-f4
                type: sorting
                text: "Wird das Gefühl genannt oder gezeigt?"
                say: "Sortiere die Sätze: Wird das Gefühl genannt oder gezeigt?"
                bins:
                  - { id: named, show: { text: "genannt" }, say: "genannt" }
                  - { id: shown, show: { text: "gezeigt" }, say: "gezeigt" }
                options:
                  - { text: "Tom war wütend.", bin: named }
                  - { text: "Tom knallte die Tür zu.", bin: shown }
                  - { text: "Lea war traurig.", bin: named }
                  - { text: "Lea starrte stumm aus dem Fenster.", bin: shown }
                option_audio: false
                hints:
                  - "Steht das Gefühlswort im Satz?"
                  - "Wütend und traurig sind Gefühlswörter. Die Tür zuknallen und aus dem Fenster starren sind Handlungen."
                  - "Wütend und traurig: genannt. Tür und Fenster: gezeigt."
              - id: l1-f5
                type: fill_in_blank
                text: "Welches Gefühlswort passt am genauesten?"
                say: "Lies den Satz. Welches Gefühlswort passt am genauesten?"
                frame: "Der Hund war wieder da. Wir waren alle sehr _."
                options: ["erleichtert", "nervös", "neidisch"]
                answer: ["erleichtert"]
                hints:
                  - "Was war vorher? Der Hund war weg."
                  - "Die Sorge ist jetzt vorbei."
                  - "erleichtert."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welches Gefühlswort passt am genauesten?"
                say: "Lies den Satz. Welches Gefühlswort passt am genauesten?"
                frame: "Das Fest fiel wegen des Regens aus. Paul war sehr _."
                options: ["enttäuscht", "schlecht", "stolz"]
                answer: ["enttäuscht"]
                hints: ["Paul hatte sich auf das Fest gefreut, und dann fiel es aus."]
              - id: l1-s2
                type: matching
                text: "Was verrät der Körper? Verbinde."
                say: "Lies, was der Körper macht. Welches Gefühl steckt dahinter? Verbinde."
                pairs:
                  - { left: { text: "Sein Gesicht wurde knallrot." }, right: { text: "Scham" } }
                  - { left: { text: "Tränen liefen ihr über die Wangen." }, right: { text: "Trauer" } }
                  - { left: { text: "Er kaute an seinen Fingernägeln." }, right: { text: "Aufregung" } }
                option_audio: false
                hints: ["Wann wird man rot im Gesicht?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welcher Satz zeigt die Freude, ohne das Wort Freude zu benutzen?"
                say: "Welcher Satz zeigt die Freude, ohne das Wort Freude zu benutzen?"
                options: ["Ich riss das Papier auf und jubelte laut.", "Ich freute mich sehr.", "Ich bekam ein Geschenk."]
                answer: "Ich riss das Papier auf und jubelte laut."
                hints: ["Welcher Satz beschreibt, was der Körper macht?"]
              - id: l1-s4
                type: sorting
                text: "Wird das Gefühl genannt oder gezeigt?"
                say: "Sortiere die Sätze: Wird das Gefühl genannt oder gezeigt?"
                bins:
                  - { id: named, show: { text: "genannt" }, say: "genannt" }
                  - { id: shown, show: { text: "gezeigt" }, say: "gezeigt" }
                options:
                  - { text: "Mia war aufgeregt.", bin: named }
                  - { text: "Mia rutschte unruhig auf dem Stuhl hin und her.", bin: shown }
                  - { text: "Ben war glücklich.", bin: named }
                  - { text: "Ben strahlte über das ganze Gesicht.", bin: shown }
                option_audio: false
                hints: ["Steht das Gefühlswort im Satz?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Welches Gefühlswort passt am genauesten?"
                say: "Lies den Satz. Welches Gefühlswort passt am genauesten?"
                frame: "Alle hatten ein neues Handy, nur ich nicht. Ich war ein bisschen _."
                options: ["neidisch", "erleichtert", "stolz"]
                answer: ["neidisch"]
                hints: ["Andere haben etwas, das du auch gern hättest."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welches Gefühlswort passt am genauesten?"
                say: "Lies den Satz. Welches Gefühlswort passt am genauesten?"
                frame: "Gleich musste ich vor der ganzen Schule singen. Ich war sehr _."
                options: ["nervös", "gut", "enttäuscht"]
                answer: ["nervös"]
              - id: l1-n2
                type: matching
                text: "Was verrät der Körper? Verbinde."
                say: "Lies, was der Körper macht. Welches Gefühl steckt dahinter? Verbinde."
                pairs:
                  - { left: { text: "Er stampfte mit dem Fuß auf." }, right: { text: "Wut" } }
                  - { left: { text: "Sie atmete tief aus und lächelte." }, right: { text: "Erleichterung" } }
                  - { left: { text: "Ihm lief es kalt den Rücken hinunter." }, right: { text: "Angst" } }
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Welcher Satz zeigt die Wut, ohne das Wort Wut zu benutzen?"
                say: "Welcher Satz zeigt die Wut, ohne das Wort Wut zu benutzen?"
                options: ["Mit rotem Kopf warf ich den Stift auf den Boden.", "Ich war total wütend.", "Ich schrieb meine Hausaufgaben."]
                answer: "Mit rotem Kopf warf ich den Stift auf den Boden."
              - id: l1-n4
                type: sorting
                text: "Wird das Gefühl genannt oder gezeigt?"
                say: "Sortiere die Sätze: Wird das Gefühl genannt oder gezeigt?"
                bins:
                  - { id: named, show: { text: "genannt" }, say: "genannt" }
                  - { id: shown, show: { text: "gezeigt" }, say: "gezeigt" }
                options:
                  - { text: "Oma war stolz auf mich.", bin: named }
                  - { text: "Oma drückte mich fest und hatte Tränen in den Augen.", bin: shown }
                  - { text: "Ich hatte Angst vor dem Hund.", bin: named }
                  - { text: "Ich versteckte mich schnell hinter Papa.", bin: shown }
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "„Ich war froh.“ Zeigt dieser Satz das Gefühl so, dass der Leser es mitfühlt?"
                say: "Lies den Satz. Zeigt er das Gefühl so, dass der Leser es mitfühlt?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Welches Gefühlswort passt am genauesten?"
            say: "Lies den Satz. Welches Gefühlswort passt am genauesten?"
            frame: "Die Mathearbeit war doch nicht so schwer. Lukas war _."
            options: ["erleichtert", "wütend", "neidisch"]
            answer: ["erleichtert"]
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Satz zeigt die Aufregung, ohne das Wort aufgeregt zu benutzen?"
            say: "Welcher Satz zeigt die Aufregung, ohne das Wort aufgeregt zu benutzen?"
            options: ["In der Nacht vor der Reise konnte ich kein Auge zumachen.", "Ich war sehr aufgeregt.", "Am Morgen fuhren wir los."]
            answer: "In der Nacht vor der Reise konnte ich kein Auge zumachen."
          - id: l1-c3
            type: matching
            text: "Was verrät der Körper? Verbinde."
            say: "Lies, was der Körper macht. Welches Gefühl steckt dahinter? Verbinde."
            pairs:
              - { left: { text: "Sie ließ den Kopf hängen." }, right: { text: "Trauer" } }
              - { left: { text: "Er sprang jubelnd in die Luft." }, right: { text: "Freude" } }
              - { left: { text: "Ihre Hände zitterten." }, right: { text: "Angst" } }
            option_audio: false

  - n: 2
    title: { de: "Was die Figur denkt", en: "What the character thinks" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welches Gefühlswort passt am genauesten?"
            say: "Lies den Satz. Welches Gefühlswort passt am genauesten?"
            frame: "Endlich hatte ich mein erstes Tor geschossen. Ich war so _!"
            options: ["stolz", "nervös", "enttäuscht"]
            answer: ["stolz"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Satz zeigt die Traurigkeit?"
            say: "Welcher Satz zeigt die Traurigkeit, ohne das Wort traurig zu benutzen?"
            options: ["Mit hängenden Schultern schlich Jan nach Hause.", "Jan war traurig.", "Jan ging nach Hause."]
            answer: "Mit hängenden Schultern schlich Jan nach Hause."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Die Vase lag in Scherben. „Oh nein“, dachte Ella. „Was sagt Mama nur dazu?“"
            say: "Der Leser möchte wissen, was in einer Figur vorgeht. Darum schreibst du auch ihre Gedanken auf. Wörter wie dachte, fragte sich oder überlegte zeigen: Jetzt kommt ein Gedanke. Den Gedanken setzt du wie wörtliche Rede in Anführungszeichen."
          - text: "Ella hatte Angst. (genannt)\nEllas Hände zitterten. (gezeigt)\n„Hoffentlich merkt das keiner“, dachte Ella. (gedacht)"
            say: "Ein Gefühl kannst du nennen, zeigen oder durch einen Gedanken verraten. Am besten mischst du alle drei. Die Gedanken stehen oft im Präsens, der Rest der Geschichte im Präteritum."
          - text: "Anfang: Ella ist erschrocken.\nMitte: Ella ist nervös und überlegt.\nSchluss: Ella ist erleichtert."
            say: "Gefühle verändern sich in einer Geschichte. Am Ende erzählt Ella alles. Mama ist nicht böse. Ella ist erleichtert. So merkt der Leser, dass die Figur etwas erlebt hat."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Max steht zum ersten Mal auf dem Fünfmeterbrett.\n\nWelcher Gedanke passt zu Max?"
                say: "Lies, was passiert. Welcher Gedanke passt zu Max?"
                options: ["Ist das hoch! Schaffe ich das wirklich?", "Was gibt es heute zum Abendessen?", "Mein Fahrrad ist blau."]
                answer: "Ist das hoch! Schaffe ich das wirklich?"
                feedback:
                  "Was gibt es heute zum Abendessen?": "Daran denkt Max gerade bestimmt nicht. Was geht ihm oben auf dem Brett durch den Kopf?"
                hints:
                  - "Stell dir vor, du stehst ganz oben auf dem Brett."
                  - "Max ist aufgeregt und ein bisschen ängstlich."
                  - "Ist das hoch! Schaffe ich das wirklich?"
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welches Wort zeigt, dass ein Gedanke kommt?"
                say: "Welches Wort zeigt, dass ein Gedanke kommt?"
                frame: "„Wo ist nur mein Schlüssel?“, _ sich Lina."
                options: ["fragte", "rief", "lachte"]
                answer: ["fragte"]
                hints:
                  - "Lina sagt den Satz nicht laut. Sie denkt ihn."
                  - "Welches Wort passt vor „sich Lina“?"
                  - "fragte sich Lina."
              - id: l2-f3
                type: sorting
                text: "Genannt, gezeigt oder gedacht?"
                say: "Sortiere die Sätze: Wird das Gefühl genannt, gezeigt oder durch einen Gedanken verraten?"
                bins:
                  - { id: named, show: { text: "genannt" }, say: "genannt" }
                  - { id: shown, show: { text: "gezeigt" }, say: "gezeigt" }
                  - { id: thought, show: { text: "gedacht" }, say: "gedacht" }
                options:
                  - { text: "Jonas war nervös.", bin: named }
                  - { text: "Jonas trommelte mit den Fingern auf den Tisch.", bin: shown }
                  - { text: "„Hoffentlich komme ich nicht dran“, dachte Jonas.", bin: thought }
                option_audio: false
                hints:
                  - "Achte auf Gefühlswörter, auf Bewegungen und auf das Wort dachte."
                  - "Nervös ist ein Gefühlswort. Trommeln ist eine Bewegung."
                  - "Nervös: genannt. Trommeln: gezeigt. Hoffentlich: gedacht."
              - id: l2-f4
                type: ordering
                text: "Wie verändert sich das Gefühl? Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Sätze aus einer Geschichte. Wie verändert sich Emmas Gefühl? Leg sie in die richtige Reihenfolge."
                options: ["Als alle klatschten, strahlte Emma über das ganze Gesicht.", "Vor dem Auftritt hatte Emma einen Kloß im Hals.", "Beim ersten Ton zitterte ihre Stimme noch ein bisschen."]
                slot_count: 3
                answer: ["Vor dem Auftritt hatte Emma einen Kloß im Hals.", "Beim ersten Ton zitterte ihre Stimme noch ein bisschen.", "Als alle klatschten, strahlte Emma über das ganze Gesicht."]
                option_audio: false
                hints:
                  - "Achte auf die Wörter, die sagen, wann etwas passiert: vor, beim, als."
                  - "Erst die Angst, dann wird es besser."
                  - "Kloß im Hals, Stimme zittert, strahlen."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Gedanke passt am Ende der Geschichte?\n\nNach langem Suchen fand Ben seinen Kater im Schuppen."
                say: "Lies das Ende der Geschichte. Welcher Gedanke passt?"
                options: ["„Zum Glück, da bist du ja!“, dachte Ben.", "„Wo kann er nur sein?“, dachte Ben.", "„Hoffentlich regnet es nicht“, dachte Ben."]
                answer: "„Zum Glück, da bist du ja!“, dachte Ben."
                hints:
                  - "Der Kater ist gefunden. Wie fühlt sich Ben jetzt?"
                  - "Ben ist erleichtert. Er sucht nicht mehr."
                  - "Zum Glück, da bist du ja!"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Aylin hat beim Spiel den entscheidenden Elfmeter verschossen.\n\nWelcher Gedanke passt zu Aylin?"
                say: "Lies, was passiert. Welcher Gedanke passt zu Aylin?"
                options: ["Warum ausgerechnet ich? Jetzt sind alle sauer auf mich.", "Toll, das hat Spaß gemacht!", "Morgen ist Dienstag."]
                answer: "Warum ausgerechnet ich? Jetzt sind alle sauer auf mich."
                hints: ["Wie fühlt sich jemand nach einem verschossenen Elfmeter?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Welches Wort zeigt, dass ein Gedanke kommt?"
                say: "Welches Wort zeigt, dass ein Gedanke kommt?"
                frame: "„Soll ich das Geheimnis verraten?“ Lange _ Tim hin und her."
                options: ["überlegte", "rannte", "sang"]
                answer: ["überlegte"]
                hints: ["Tim denkt lange nach."]
              - id: l2-s3
                type: sorting
                text: "Genannt, gezeigt oder gedacht?"
                say: "Sortiere die Sätze: Wird das Gefühl genannt, gezeigt oder durch einen Gedanken verraten?"
                bins:
                  - { id: named, show: { text: "genannt" }, say: "genannt" }
                  - { id: shown, show: { text: "gezeigt" }, say: "gezeigt" }
                  - { id: thought, show: { text: "gedacht" }, say: "gedacht" }
                options:
                  - { text: "Hannah war enttäuscht.", bin: named }
                  - { text: "Hannah ließ den Kopf hängen.", bin: shown }
                  - { text: "„Schon wieder nicht gewonnen“, dachte Hannah.", bin: thought }
                option_audio: false
                hints: ["Wo steht dachte?"]
              - id: l2-s4
                type: ordering
                text: "Wie verändert sich das Gefühl? Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Sätze aus einer Geschichte. Wie verändert sich Noahs Gefühl? Leg sie in die richtige Reihenfolge."
                options: ["Am Abend hatte Noah schon zwei neue Freunde.", "Am ersten Tag in der neuen Schule kannte Noah niemanden.", "In der Pause fragte ihn ein Junge, ob er mitspielen wollte."]
                slot_count: 3
                answer: ["Am ersten Tag in der neuen Schule kannte Noah niemanden.", "In der Pause fragte ihn ein Junge, ob er mitspielen wollte.", "Am Abend hatte Noah schon zwei neue Freunde."]
                option_audio: false
                hints: ["Am Anfang ist Noah allein."]
              - id: l2-s5
                type: true_false
                text: "„Bloß nicht hinsehen“, dachte ich. Verrät dieser Satz ein Gefühl durch einen Gedanken?"
                say: "Lies den Satz. Verrät er ein Gefühl durch einen Gedanken?"
                answer: true
                hints: ["Achte auf das Wort dachte."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Leo findet auf dem Schulweg einen Geldbeutel mit viel Geld.\n\nWelcher Gedanke passt zu Leo?"
                say: "Lies, was passiert. Welcher Gedanke passt zu Leo?"
                options: ["Wem gehört der wohl? Der sucht ihn bestimmt schon.", "Ich habe heute Sport.", "Hoffentlich gibt es Nudeln."]
                answer: "Wem gehört der wohl? Der sucht ihn bestimmt schon."
              - id: l2-n2
                type: fill_in_blank
                text: "Welches Wort zeigt, dass ein Gedanke kommt?"
