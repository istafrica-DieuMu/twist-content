# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.character-perspective
skill: lit-de.texts-media.character-perspective
curriculum: de-DE
language: de
title:
  de: Sich in Figuren hineinversetzen
  en: Putting yourself in a character's place
summary: >
  Reading what characters feel and think. Lesson 1 works out a feeling
  from what a character does (holding on tight, looking at their shoes),
  finds the line that shows it and says what the character might be
  thinking; lesson 2 tells a moment from another character's point of
  view, backs up an opinion with a line from the text (opinion, line,
  explanation), and ends with the skill check. Every story is written for
  Twist.
metadata:
  year: klasse-4
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.texts-media.story-elements, lit-de.comprehension.infer]
  also_practises: [lit-de.comprehension.infer]
  vocabulary: { de: [Figur, Gefühl, Gedanke, Sicht, Ich-Form, Textstelle, Beleg, begründen] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: feeling, what: { de: "sagen, wie sich eine Figur fühlt", en: saying how a character feels } }
    - { id: thinking, what: { de: "sagen, was eine Figur denkt", en: saying what a character thinks } }
    - { id: point-of-view, what: { de: aus der Sicht einer Figur erzählen, en: telling a moment from a character's point of view } }
    - { id: evidence, what: { de: eine Meinung mit einer Textstelle begründen, en: backing up a view with a line from the text } }
  misconceptions:
    - id: feeling-from-setting
      what: Takes the mood of the scene or of other characters as the feeling of the character asked about
      addressed: lesson 1 Learn reads the character's own actions; every feeling task offers the mood of others as a distractor, with feedback in l1-f1
    - id: own-view-as-character
      what: Tells another character's view with the first character's words, or backs up an opinion with a line that is not in the text
      addressed: lesson 2 Learn shows the same moment from two characters; every stage has a point-of-view task and an evidence task with a line not in the text, with feedback in l2-f1 and l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was fühlt und denkt die Figur?", en: "What does the character feel and think?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Die Personen und Tiere, die in einer Geschichte handeln, nennt man …"
            options: ["die Figuren", "den Ort", "die Zeit"]
            answer: "die Figuren"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "„Am Morgen lief Lisa durch den Wald.“ Wo spielt die Geschichte?"
            options: ["im Wald", "am Morgen", "bei Lisa zu Hause"]
            answer: "im Wald"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Am ersten Schultag stand Kofi allein am Rand des Schulhofs. Er hielt seinen Ranzen fest umklammert und schaute auf seine Schuhe. Die anderen Kinder spielten Fangen und lachten laut. Da kam Jule zu ihm und fragte: „Willst du mitspielen?“ Kofi hob den Kopf und lächelte zum ersten Mal an diesem Tag."
            say: "Wenn du dich in eine Figur hineinversetzt, fragst du: Wie geht es ihr? Was denkt sie? Oft steht das nicht direkt im Text."
          - text: "„Er hielt seinen Ranzen fest umklammert und schaute auf seine Schuhe.“\n→ Kofi ist unsicher und fühlt sich allein."
            say: "Achte darauf, was die Figur selbst tut. Die anderen Kinder lachen, aber Kofi nicht. Wer sich festhält und auf seine Schuhe schaut, fühlt sich unsicher."
          - text: "Am Anfang: Hier kenne ich niemanden.\nAm Ende: Vielleicht finde ich hier doch Freunde."
            say: "Du kannst auch überlegen, was die Figur denkt. Am Ende lächelt Kofi. Vielleicht denkt er: Hier finde ich doch Freunde."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Am ersten Schultag stand Kofi allein am Rand des Schulhofs. Er hielt seinen Ranzen fest umklammert und schaute auf seine Schuhe. Die anderen Kinder spielten Fangen und lachten laut.\n\nWie fühlt sich Kofi?"
                say: "Lies den Text. Wie fühlt sich Kofi?"
                options: ["unsicher und allein", "fröhlich", "wütend"]
                answer: "unsicher und allein"
                feedback:
                  "fröhlich": "Die anderen Kinder lachen, aber nicht Kofi. Schau, was Kofi selbst tut."
                hints:
                  - "Schau, was Kofi selbst tut."
                  - "Er hält sich am Ranzen fest und schaut auf seine Schuhe."
                  - "Kofi fühlt sich unsicher und allein."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Am ersten Schultag stand Kofi allein am Rand des Schulhofs. Er hielt seinen Ranzen fest umklammert und schaute auf seine Schuhe. Die anderen Kinder spielten Fangen und lachten laut. Da kam Jule zu ihm und fragte: „Willst du mitspielen?“ Kofi hob den Kopf und lächelte zum ersten Mal an diesem Tag.\n\nWelche Textstelle zeigt, dass Kofi sich am Ende freut?"
                say: "Lies den Text. Welche Textstelle zeigt, dass Kofi sich am Ende freut?"
                options: ["Kofi hob den Kopf und lächelte.", "Die anderen Kinder spielten Fangen.", "Er hielt seinen Ranzen fest umklammert."]
                answer: "Kofi hob den Kopf und lächelte."
                option_audio: false
                hints:
                  - "Lies den Schluss."
                  - "Was macht Kofi, nachdem Jule ihn gefragt hat?"
                  - "Er hebt den Kopf und lächelt."
              - id: l1-f3
                type: true_false
                text: "Lina hatte für die Mathearbeit kaum geübt. Als die Lehrerin die Blätter austeilte, klopfte ihr Herz bis zum Hals. Bei der dritten Aufgabe kaute sie lange auf ihrem Stift herum.\n\nStimmt das? Lina ist ganz ruhig."
                say: "Lies den Text. Stimmt das: Lina ist ganz ruhig?"
                answer: false
                hints:
                  - "Was passiert mit Linas Herz?"
                  - "Wenn das Herz bis zum Hals klopft, ist man aufgeregt."
                  - "Nein, Lina ist aufgeregt."
              - id: l1-f4
                type: multiple_choice
                text: "Ella hatte drei Wochen lang ihr Taschengeld gespart. Sie kaufte für Oma einen Schal in ihrer Lieblingsfarbe. Als Oma das Päckchen öffnete, wurden ihre Augen feucht. Sie drückte Ella ganz fest.\n\nWas denkt Ella wohl, als Oma sie drückt?"
                say: "Lies den Text. Was denkt Ella wohl, als Oma sie drückt?"
                options: ["Das Sparen hat sich gelohnt.", "Hätte ich das Geld doch behalten!", "Oma gefällt der Schal nicht."]
                answer: "Das Sparen hat sich gelohnt."
                hints:
                  - "Wie reagiert Oma auf das Geschenk?"
                  - "Oma freut sich so sehr, dass sie Ella fest drückt."
                  - "Ella denkt: Das Sparen hat sich gelohnt."
              - id: l1-f5
                type: matching
                text: "Welches Gefühl zeigt die Textstelle?"
                say: "Verbinde jede Textstelle mit dem Gefühl, das sie zeigt."
                pairs:
                  - { left: { text: "Ihre Knie zitterten." }, right: { text: "ängstlich" } }
                  - { left: { text: "Sie reckte beide Arme in die Luft." }, right: { text: "stolz" } }
                  - { left: { text: "Er wischte sich über die Augen." }, right: { text: "traurig" } }
                hints:
                  - "Stell dir vor, du machst das selbst. Wie fühlst du dich dabei?"
                  - "Wer die Arme hochreckt, hat etwas geschafft."
                  - "Zittern: ängstlich. Arme hoch: stolz. Augen wischen: traurig."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Paul suchte seit zwei Stunden nach seinem Hund Struppi. Er rief immer wieder seinen Namen, doch seine Stimme wurde leiser. Am Bach setzte er sich auf einen Stein und wischte sich über die Augen.\n\nWie fühlt sich Paul am Bach?"
                say: "Lies den Text. Wie fühlt sich Paul am Bach?"
                options: ["traurig", "gelangweilt", "fröhlich"]
                answer: "traurig"
                hints: ["Was macht Paul mit seinen Augen?"]
              - id: l1-s2
                type: multiple_choice
                text: "Paul suchte seit zwei Stunden nach seinem Hund Struppi. Er rief immer wieder seinen Namen, doch seine Stimme wurde leiser. Am Bach setzte er sich auf einen Stein und wischte sich über die Augen.\n\nWelche Textstelle zeigt, dass Paul traurig ist?"
                say: "Lies den Text. Welche Textstelle zeigt, dass Paul traurig ist?"
                options: ["Er wischte sich über die Augen.", "Am Bach setzte er sich auf einen Stein.", "Paul suchte nach seinem Hund."]
                answer: "Er wischte sich über die Augen."
                option_audio: false
                hints: ["Welche Stelle verrät etwas über sein Gefühl?"]
              - id: l1-s3
                type: true_false
                text: "Mira stand auf dem Drei-Meter-Brett. Unten winkten ihre Freunde. Ihre Knie zitterten, und sie hielt sich am Geländer fest.\n\nStimmt das? Mira hat Angst."
                say: "Lies den Text. Stimmt das: Mira hat Angst?"
                answer: true
                hints: ["Was machen Miras Knie?"]
              - id: l1-s4
                type: multiple_choice
                text: "Beim Tischdecken rutschte Noah Mamas Lieblingsglas aus der Hand. Es zerbrach in tausend Stücke. Noah wurde rot und versteckte die Scherben schnell unter der Zeitung. Als Mama hereinkam, schaute er zur Seite.\n\nWas denkt Noah wohl, als Mama hereinkommt?"
                say: "Lies den Text. Was denkt Noah wohl, als Mama hereinkommt?"
                options: ["Hoffentlich merkt sie nichts.", "Was für ein schöner Tag!", "Mama soll sich das Glas ansehen."]
                answer: "Hoffentlich merkt sie nichts."
                hints: ["Warum versteckt Noah die Scherben?"]
              - id: l1-s5
                type: matching
                text: "Welches Gefühl zeigt die Textstelle?"
                say: "Verbinde jede Textstelle mit dem Gefühl, das sie zeigt."
                pairs:
                  - { left: { text: "Er wurde rot und schaute zur Seite." }, right: { text: "schuldig" } }
                  - { left: { text: "Sie runzelte die Stirn." }, right: { text: "misstrauisch" } }
                  - { left: { text: "Ihre Augen wurden feucht vor Freude." }, right: { text: "gerührt" } }
                hints: ["Stell dir vor, du machst das selbst."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Max hatte Ben versprochen, ihm sein neues Buch zu leihen. Doch dann gab er es Leon. Ben sagte den ganzen Tag kein Wort zu Max. In der Pause setzte er sich ans andere Ende der Bank.\n\nWie fühlt sich Ben?"
                say: "Lies den Text. Wie fühlt sich Ben?"
                options: ["enttäuscht", "stolz", "müde"]
                answer: "enttäuscht"
              - id: l1-n2
                type: multiple_choice
                text: "Max hatte Ben versprochen, ihm sein neues Buch zu leihen. Doch dann gab er es Leon. Ben sagte den ganzen Tag kein Wort zu Max. In der Pause setzte er sich ans andere Ende der Bank.\n\nWelche Textstelle zeigt, dass Ben enttäuscht ist?"
                say: "Lies den Text. Welche Textstelle zeigt, dass Ben enttäuscht ist?"
                options: ["Ben sagte den ganzen Tag kein Wort zu Max.", "Max hatte ein neues Buch.", "Max hatte Ben etwas versprochen."]
                answer: "Ben sagte den ganzen Tag kein Wort zu Max."
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Seit Tagen tuschelten Lenas Eltern, wenn sie ins Zimmer kam. Lena runzelte die Stirn. Was war hier los? Am Samstag stand im Garten ein Zelt, und alle ihre Freunde riefen: „Überraschung!“\n\nStimmt das? Lena weiß von Anfang an, was ihre Eltern planen."
                say: "Lies den Text. Stimmt das: Lena weiß von Anfang an, was ihre Eltern planen?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Seit Tagen tuschelten Lenas Eltern, wenn sie ins Zimmer kam. Lena runzelte die Stirn. Was war hier los? Am Samstag stand im Garten ein Zelt, und alle ihre Freunde riefen: „Überraschung!“\n\nWas denkt Lena wohl, als ihre Eltern tuscheln?"
                say: "Lies den Text. Was denkt Lena wohl, als ihre Eltern tuscheln?"
                options: ["Was verheimlichen die beiden?", "Wie langweilig.", "Ich weiß schon alles."]
                answer: "Was verheimlichen die beiden?"
              - id: l1-n5
                type: matching
                text: "Welches Gefühl zeigt die Textstelle?"
                say: "Verbinde jede Textstelle mit dem Gefühl, das sie zeigt."
                pairs:
                  - { left: { text: "Sie hielt sich am Geländer fest." }, right: { text: "ängstlich" } }
                  - { left: { text: "Er lächelte zum ersten Mal an diesem Tag." }, right: { text: "froh" } }
                  - { left: { text: "Er stampfte mit dem Fuß auf." }, right: { text: "wütend" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Beim Sportfest lief Emre als Letzter durchs Ziel. Er ließ die Schultern hängen und ging allein zur Bank. Seine Trainerin setzte sich neben ihn: „Du warst zwei Sekunden schneller als letztes Jahr!“ Da richtete Emre sich auf.\n\nWie fühlt sich Emre direkt nach dem Lauf?"
            say: "Lies den Text. Wie fühlt sich Emre direkt nach dem Lauf?"
            options: ["enttäuscht", "stolz", "wütend"]
            answer: "enttäuscht"
          - id: l1-c2
            type: multiple_choice
            text: "Beim Sportfest lief Emre als Letzter durchs Ziel. Er ließ die Schultern hängen und ging allein zur Bank. Seine Trainerin setzte sich neben ihn: „Du warst zwei Sekunden schneller als letztes Jahr!“ Da richtete Emre sich auf.\n\nWelche Textstelle zeigt, dass es Emre am Ende besser geht?"
            say: "Lies den Text. Welche Textstelle zeigt, dass es Emre am Ende besser geht?"
            options: ["Da richtete Emre sich auf.", "Er ließ die Schultern hängen.", "Emre lief als Letzter durchs Ziel."]
            answer: "Da richtete Emre sich auf."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Wie sich eine Figur fühlt, erkennst du oft daran, was sie tut."
            say: "Stimmt das? Wie sich eine Figur fühlt, erkennst du oft daran, was sie tut."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Ronja wartete am Bahnhof. Als der Zug einfuhr, stellte sie sich auf die Zehenspitzen. Dann sah sie ihren Papa und rannte los.\n\nWie fühlt sich Ronja, als sie ihren Papa sieht?"
            say: "Lies den Text. Wie fühlt sich Ronja, als sie ihren Papa sieht?"
            options: ["froh", "ängstlich", "gelangweilt"]
            answer: "froh"
          - id: l1-c5
            type: multiple_choice
            text: "Theo hatte sein Pausenbrot vergessen. In der Pause sah er zu, wie die anderen aßen, und sein Bauch knurrte laut.\n\nWas denkt Theo wohl?"
            say: "Lies den Text. Was denkt Theo wohl?"
            options: ["Hätte ich doch an mein Brot gedacht!", "Ich habe gar keinen Hunger.", "Heute ist die Pause viel zu lang."]
            answer: "Hätte ich doch an mein Brot gedacht!"
          - id: l1-c6
            type: true_false
            text: "Als die anderen über seine Brille lachten, drehte Emil sich weg und biss sich auf die Lippe.\n\nStimmt das? Emil fühlt sich gekränkt."
            say: "Lies den Text. Stimmt das: Emil fühlt sich gekränkt?"
            answer: true

  - n: 2
    title: { de: "Aus einer anderen Sicht", en: "From another point of view" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "„Leons Hände zitterten, als er auf die Bühne ging.“ Wie fühlt sich Leon?"
            options: ["aufgeregt", "gelangweilt", "wütend"]
            answer: "aufgeregt"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Woran erkennst du oft, wie sich eine Figur fühlt?"
            options: ["daran, was sie tut und sagt", "an der Überschrift", "an der Länge des Textes"]
            answer: "daran, was sie tut und sagt"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Max hatte Ben versprochen, ihm sein neues Buch zu leihen. Doch dann gab er es Leon. Ben sagte den ganzen Tag kein Wort zu Max."
            say: "Jede Figur erlebt eine Geschichte anders. Ben ist enttäuscht. Aber wie sieht Max das? Vielleicht hat er ein schlechtes Gewissen."
          - text: "Ben: Max hat sein Versprechen gebrochen.\nMax: Ich habe Ben enttäuscht. Das tut mir leid."
            say: "Erzählst du aus der Sicht einer Figur, sprichst du mit ihrer Stimme, in der Ich-Form. Du erzählst nur, was diese Figur weiß und fühlt."
          - text: "Meinung: Ben ist zu Recht enttäuscht.\nBeleg: „Max hatte Ben versprochen, ihm sein neues Buch zu leihen.“\nErklärung: Max hat sein Versprechen nicht gehalten."
            say: "Sagst du deine Meinung über eine Figur, begründest du sie mit einer Textstelle. Die Textstelle muss wirklich im Text stehen. Dann erklärst du, warum sie deine Meinung stützt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Am ersten Schultag stand Kofi allein am Rand des Schulhofs. Er hielt seinen Ranzen fest umklammert und schaute auf seine Schuhe. Da kam Jule zu ihm und fragte: „Willst du mitspielen?“\n\nWie würde Jule das erzählen?"
                say: "Lies den Text. Wie würde Jule das erzählen?"
                options:
                  - "Der Neue stand ganz allein da. Da habe ich ihn gefragt, ob er mitspielen will."
                  - "Ich stand allein am Rand und schaute auf meine Schuhe."
                  - "Kofi stand allein am Rand des Schulhofs."
                answer: "Der Neue stand ganz allein da. Da habe ich ihn gefragt, ob er mitspielen will."
                option_audio: false
                feedback:
                  "Ich stand allein am Rand und schaute auf meine Schuhe.": "So würde Kofi erzählen. Jule sieht Kofi von außen."
                  "Kofi stand allein am Rand des Schulhofs.": "Das ist nicht in der Ich-Form. Jule würde von sich selbst erzählen."
                hints:
                  - "Jule erzählt in der Ich-Form."
                  - "Was hat Jule gesehen, und was hat sie getan?"
                  - "Sie sieht den Neuen allein und fragt ihn."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ella hatte drei Wochen lang ihr Taschengeld gespart. Sie kaufte für Oma einen Schal in ihrer Lieblingsfarbe. Als Oma das Päckchen öffnete, wurden ihre Augen feucht.\n\nLea meint: „Ella hat ihre Oma sehr lieb.“ Welche Textstelle stützt das?"
                say: "Lies den Text. Lea meint: Ella hat ihre Oma sehr lieb. Welche Textstelle stützt das?"
                options: ["Ella hatte drei Wochen lang ihr Taschengeld gespart.", "Oma öffnete das Päckchen.", "Ella besucht ihre Oma jeden Tag."]
                answer: "Ella hatte drei Wochen lang ihr Taschengeld gespart."
                option_audio: false
                feedback:
                  "Ella besucht ihre Oma jeden Tag.": "Das steht nicht im Text. Ein Beleg muss eine Stelle aus dem Text sein."
                hints:
                  - "Welche Stelle zeigt, was Ella für Oma tut?"
                  - "Wer lange für jemanden spart, hat ihn lieb."
                  - "Sie hat drei Wochen lang gespart."
              - id: l2-f3
                type: true_false
                text: "Beim Tischdecken rutschte Noah Mamas Lieblingsglas aus der Hand. Noah versteckte die Scherben schnell unter der Zeitung. Als Mama hereinkam, schaute er zur Seite.\n\nMama erzählt: „Noah schaut mich gar nicht an. Ob etwas passiert ist?“ Passt das zu Mamas Sicht?"
                say: "Lies den Text. Mama erzählt: Noah schaut mich gar nicht an. Ob etwas passiert ist? Passt das zu Mamas Sicht?"
                answer: true
                hints:
                  - "Was sieht Mama, als sie hereinkommt?"
                  - "Sieht sie die Scherben?"
                  - "Ja. Mama sieht nur, dass Noah wegschaut."
              - id: l2-f4
                type: ordering
                text: "Bring die Begründung in die richtige Reihenfolge: Meinung, Beleg, Erklärung."
                say: "Bring die Begründung in die richtige Reihenfolge: zuerst die Meinung, dann der Beleg, dann die Erklärung."
                options: ["Obwohl sie Angst hatte, ist sie gesprungen.", "Ich finde, Mira ist mutig.", "Im Text steht: Sie holte tief Luft und sprang."]
                slot_count: 3
                answer: ["Ich finde, Mira ist mutig.", "Im Text steht: Sie holte tief Luft und sprang.", "Obwohl sie Angst hatte, ist sie gesprungen."]
                hints:
                  - "Die Meinung beginnt oft mit: Ich finde."
                  - "Der Beleg beginnt mit: Im Text steht."
                  - "Meinung, Beleg, Erklärung."
              - id: l2-f5
                type: multiple_choice
                text: "Paul suchte seit zwei Stunden nach seinem Hund Struppi. Am Bach setzte er sich auf einen Stein und wischte sich über die Augen. Plötzlich raschelte es im Gebüsch, und Struppi sprang ihm auf den Schoß.\n\nWie würde Struppi das erzählen?"
                say: "Lies den Text. Wie würde Struppi das erzählen?"
                options:
                  - "Ich hatte mich im Gebüsch verlaufen. Endlich habe ich Paul gerochen!"
                  - "Ich suchte seit zwei Stunden nach meinem Hund."
                  - "Struppi sprang Paul auf den Schoß."
                answer: "Ich hatte mich im Gebüsch verlaufen. Endlich habe ich Paul gerochen!"
                option_audio: false
                hints:
                  - "Struppi erzählt in der Ich-Form."
                  - "Wer sucht hier wen?"
                  - "Struppi war im Gebüsch und findet Paul."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Max hatte Ben versprochen, ihm sein neues Buch zu leihen. Doch dann gab er es Leon. Ben sagte den ganzen Tag kein Wort zu Max.\n\nWie würde Max das erzählen?"
                say: "Lies den Text. Wie würde Max das erzählen?"
                options:
                  - "Ich habe mein Buch Leon gegeben. Jetzt redet Ben nicht mehr mit mir."
                  - "Max hat mir sein Buch nicht geliehen. Ich rede nicht mehr mit ihm."
                  - "Ben und Max saßen in der Pause auf einer Bank."
                answer: "Ich habe mein Buch Leon gegeben. Jetzt redet Ben nicht mehr mit mir."
                option_audio: false
                hints: ["Wer ist ich, wenn Max erzählt?"]
              - id: l2-s2
                type: multiple_choice
                text: "Mira stand auf dem Drei-Meter-Brett. Ihre Knie zitterten. Dann holte sie tief Luft und sprang. Als sie wieder auftauchte, reckte sie beide Arme in die Luft.\n\nAli meint: „Mira ist am Ende stolz.“ Welche Textstelle stützt das?"
                say: "Lies den Text. Ali meint: Mira ist am Ende stolz. Welche Textstelle stützt das?"
                options: ["Als sie wieder auftauchte, reckte sie beide Arme in die Luft.", "Ihre Knie zitterten.", "Mira springt jeden Tag vom Zehner."]
                answer: "Als sie wieder auftauchte, reckte sie beide Arme in die Luft."
                option_audio: false
                hints: ["Der Beleg muss im Text stehen und zum Ende passen."]
              - id: l2-s3
