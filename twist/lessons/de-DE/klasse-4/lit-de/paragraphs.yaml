                type: true_false
                text: "Ameisen\n\nAmeisen leben in großen Gruppen, den Staaten. In einem Staat können viele tausend Ameisen leben.\n\nJede Ameise hat eine Aufgabe. Manche holen Futter, andere pflegen die Eier, wieder andere bauen am Nest.\n\nAmeisen sind sehr stark. Eine Ameise kann ein Vielfaches ihres eigenen Gewichts tragen.\n\nGeht es im ersten Absatz darum, dass Ameisen in großen Gruppen leben?"
