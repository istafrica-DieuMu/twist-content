      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Der Mond\n\nDer Mond kreist um die Erde. Für eine Runde braucht er ungefähr einen Monat.\n\nDer Mond leuchtet nicht selbst. Er wird von der Sonne angestrahlt.\n\nIm Jahr 1969 landeten zum ersten Mal Menschen auf dem Mond.\n\nIn welchem Absatz erfährst du, wann Menschen auf dem Mond landeten?"
            say: "Lies den Text. In welchem Absatz erfährst du, wann Menschen auf dem Mond landeten?"
            options: ["im ersten Absatz", "im zweiten Absatz", "im dritten Absatz"]
            answer: "im dritten Absatz"
            keep_order: true
          - id: l1-c2
            type: multiple_choice
            text: "Die Honigbiene\n\nHonigbienen leben in einem Bienenstock. Im Sommer wohnen dort bis zu 50 000 Bienen.\n\nDie Bienen fliegen von Blüte zu Blüte und sammeln Nektar. Daraus machen sie Honig.\n\nIn jedem Stock gibt es eine Königin. Sie legt jeden Tag viele Eier.\n\nWorum geht es im zweiten Absatz?"
            say: "Lies den Text. Worum geht es im zweiten Absatz?"
            options: ["wie Bienen Honig machen", "wo Bienen wohnen", "was die Königin tut"]
            answer: "wie Bienen Honig machen"
          - id: l1-c3
            type: true_false
            text: "Schokolade\n\nSchokolade wird aus Kakaobohnen gemacht. Kakaobäume wachsen nur dort, wo es das ganze Jahr warm ist.\n\nDie Bohnen werden geerntet, getrocknet und geröstet. Dann mahlt man sie zu einer braunen Masse.\n\nIn der Fabrik kommen Milch und Zucker dazu. Zum Schluss gießt man die Schokolade in Formen.\n\nHat der Text drei Absätze?"
            say: "Lies den Text. Hat er drei Absätze?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Der Löwenzahn\n\nDer Löwenzahn wächst auf fast jeder Wiese. Seine Blüten sind leuchtend gelb.\n\nAus der Blüte wird später eine weiße Kugel, die Pusteblume.\n\nWenn der Wind weht, fliegen die Samen wie kleine Schirme davon.\n\nKaninchen und Meerschweinchen fressen die Blätter gern.\n\nWie viele Absätze hat der Text?"
            say: "Lies den Text. Wie viele Absätze hat er?"
            options: ["4", "5", "3"]
            answer: "4"
          - id: l1-c5
            type: multiple_choice
            text: "Der Pinguin\n\nPinguine sind Vögel, aber sie können nicht fliegen. Dafür schwimmen sie sehr schnell.\n\nDie meisten Pinguine leben im Süden der Erde, wo es kalt ist. Ein dickes Fettpolster und dichte Federn halten sie warm.\n\nPinguine fressen Fische und Krebse. Sie tauchen dafür tief ins Meer.\n\nIn welchem Absatz erfährst du, warum Pinguine nicht frieren?"
            say: "Lies den Text. In welchem Absatz erfährst du, warum Pinguine nicht frieren?"
            options: ["im ersten Absatz", "im zweiten Absatz", "im dritten Absatz"]
            answer: "im zweiten Absatz"
            keep_order: true
          - id: l1-c6
            type: true_false
            text: "Das Eichhörnchen\n\nEichhörnchen leben in Wäldern und Parks. Ihr Nest heißt Kobel und sitzt hoch oben im Baum.\n\nIm Herbst sammeln sie Nüsse und vergraben sie in der Erde. Viele Verstecke finden sie im Winter nicht wieder.\n\nMit ihrem buschigen Schwanz halten sie beim Springen das Gleichgewicht.\n\nGeht es im zweiten Absatz darum, wo Eichhörnchen wohnen?"
            say: "Lies den Text. Geht es im zweiten Absatz darum, wo Eichhörnchen wohnen?"
            answer: false

  - n: 2
    title: { de: "Teilüberschriften finden", en: "Finding sub-headings" }
    goal:
      de: "Gib jedem Absatz eine passende Teilüberschrift, nicht zu klein und nicht zu groß, so wie Was Igel fressen."
      en: "Give each paragraph a sub-heading that fits, not too small and not too big, like What hedgehogs eat."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Der Hamster\n\nHamster sind Nagetiere. Am Tag schlafen sie.\n\nNachts laufen sie viele Kilometer in ihrem Laufrad.\n\nIn ihren Backentaschen tragen sie Futter in ihr Versteck.\n\nWie viele Absätze hat der Text?"
            say: "Lies den Text. Wie viele Absätze hat er?"
            options: ["3", "4", "5"]
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Der Hamster\n\nHamster sind Nagetiere. Am Tag schlafen sie.\n\nNachts laufen sie viele Kilometer in ihrem Laufrad.\n\nIn ihren Backentaschen tragen sie Futter in ihr Versteck.\n\nIn welchem Absatz erfährst du, wie Hamster Futter tragen?"
            say: "Lies den Text. In welchem Absatz erfährst du, wie Hamster Futter tragen?"
            options: ["im ersten Absatz", "im zweiten Absatz", "im dritten Absatz"]
            answer: "im dritten Absatz"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Igel sind nachts unterwegs. Am Tag schlafen sie in Hecken oder unter Laub.\n\nIgel · Laub · Nachts unterwegs"
            say: "Über diesen Absatz soll eine kleine Überschrift. Was glaubst du: Was passt am besten, Igel, Laub oder Nachts unterwegs?"
            show: { object: hedgehog }
          - text: "Igel sind nachts unterwegs. ...\n→ Nachts unterwegs\n\nIgel fressen Käfer, Würmer und Schnecken. ...\n→ Was Igel fressen\n\nIm Herbst fressen sich Igel ein Fettpolster an. ...\n→ Der Winterschlaf"
            say: "Nachts unterwegs passt am besten. Eine Teilüberschrift sagt in wenigen Wörtern, worum es in einem Absatz geht. Sie steht über dem Absatz, wie eine kleine Überschrift."
          - text: "zu klein: Schnecken\nzu groß: Igel\npasst: Was Igel fressen"
            say: "Eine gute Teilüberschrift passt zum ganzen Absatz. Schnecken ist zu klein, das ist nur ein Wort aus dem Absatz. Igel ist zu groß, darum geht es im ganzen Text. Was Igel fressen passt genau."
          - text: "Nachts unterwegs · Was Igel fressen · Der Winterschlaf"
            say: "Mit Teilüberschriften findest du dich im Text schnell zurecht. Sie sind wie Wegweiser."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
