                type: multiple_choice
                text: "Die Feuerwehr\n\nWenn es brennt, ruft man die Feuerwehr unter der Nummer 112 an. Man sagt, wo es brennt und was passiert ist.\n\nDie Feuerwehr löscht nicht nur Brände. Sie hilft auch bei Unfällen und Überschwemmungen und rettet Tiere.\n\nIn vielen Dörfern gibt es eine Freiwillige Feuerwehr. Ihre Mitglieder haben andere Berufe und kommen, wenn der Alarm geht.\n\nWie viele Absätze hat der Text?"
                say: "Lies den Text. Wie viele Absätze hat er?"
                options: ["3", "6", "4"]
                answer: "3"
