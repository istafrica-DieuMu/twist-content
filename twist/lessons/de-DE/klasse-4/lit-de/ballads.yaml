# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.ballads
skill: lit-de.texts-media.ballads
curriculum: de-DE
language: de
title:
  de: Balladen
  en: Ballads
summary: >
  A Ballade is a poem that tells an exciting story. Lesson 1 reads two
  short ballads written for Twist (Jan und das Lamm, Grete im Leuchtturm),
  tells a ballad from a poem without a story and from a story without
  Verse, finds who speaks, the Höhepunkt and the order of events. Lesson 2
  reads Theodor Fontane's "Herr von Ribbeck auf Ribbeck im Havelland"
  (first and last two Strophen quoted, the middle retold), translates its
  Plattdeutsch lines, says why Ribbeck takes a pear into his grave, looks
  at the first Strophe of Goethe's "Erlkönig", and ends with the skill
  check. Fontane is quoted word for word from the Cotta edition of 1905
  and Goethe from Goethes Werke (Bertelsmann), as on Wikisource, in their
  original spelling (Thurme, faßt).
metadata:
  year: klasse-4
  topic: { de: "Märchen, Fabeln, Sagen", en: "Fairy tales, fables, legends" }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [lit-de.texts-media.poems, lit-de.texts-media.fables-legends]
  also_practises: [lit-de.texts-media.poems, lit-de.texts-media.story-elements]
  vocabulary: { de: [Ballade, Gedicht, Vers, Strophe, Reim, Erzähler, Figur, Handlung, Höhepunkt, wörtliche Rede, Plattdeutsch] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: recognise, what: { de: eine Ballade von anderen Texten unterscheiden, en: telling a ballad from other texts } }
    - { id: features, what: { de: "Merkmale einer Ballade finden (Strophe, Höhepunkt, wörtliche Rede)", en: "finding the features of a ballad (verse, climax, direct speech)" } }
    - { id: story, what: { de: "verstehen, was in einer Ballade passiert", en: understanding what happens in a ballad } }
  misconceptions:
    - id: any-poem-is-ballad
      what: Calls every rhyming poem a Ballade, or every exciting story, and misses that a Ballade needs both Verse and a story
      addressed: "lesson 1 Learn names the two parts together; l1-f1 (feedback on Ja, es reimt sich), l1-s1, l1-n1, l1-n4, l2-w2 and l2-c2 ask whether a text is a ballad; l2-f5 gives feedback on the author as a reason"
    - id: narrator-is-speaker
      what: Takes the Erzähler for the person speaking, or does not notice when a Figur speaks in wörtliche Rede
      addressed: "lesson 1 Learn shows wörtliche Rede in Strophe 2; l1-f3, l1-s2, l1-c2, l2-s2 and l2-c5 ask who speaks a line, with feedback on l1-f3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gedichte, die Geschichten erzählen", en: "Poems that tell stories" }
    goal:
      de: "Lies eine Ballade, ein Gedicht mit einer spannenden Geschichte. Finde die spannendste Stelle, so wie in Jan und das Lamm."
      en: "Read a ballad, a poem that tells an exciting story. Find the most exciting part, like in Jan und das Lamm."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort reimt sich auf Wind?"
            options: ["Kind", "Wand", "Wald"]
            answer: "Kind"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was ist eine Strophe?"
            options: ["mehrere Verse, die zusammengehören", "eine einzelne Zeile", "die Überschrift eines Gedichts"]
            answer: "mehrere Verse, die zusammengehören"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Kann ein Gedicht so spannend sein wie ein Abenteuer?"
            say: "Viele Gedichte sind ruhig. Sie beschreiben den Herbst oder den Schnee. Was glaubst du: Kann ein Gedicht auch so spannend sein wie ein Abenteuer? Hör gut zu!"
          - text: "Jan und das Lamm\n\nDer Regen peitscht, der Sturmwind braust,\nder Bach schwillt an, dass jedem graust.\nAm Ufer steht der kleine Jan\nund sieht die alte Brücke an.\n\n„Dort drüben blökt mein Lämmchen klein,\nes ist im Sturm ganz allein!“\nDer Vater ruft: „Bleib hier, mein Sohn!\nDie Brücke wackelt ja schon!“"
            say: "Hör dir dieses Gedicht an und lies mit. Es heißt: Jan und das Lamm. Der Regen peitscht, der Sturmwind braust, der Bach schwillt an, dass jedem graust. Am Ufer steht der kleine Jan und sieht die alte Brücke an. Dort drüben blökt mein Lämmchen klein, es ist im Sturm ganz allein! Der Vater ruft: Bleib hier, mein Sohn! Die Brücke wackelt ja schon!"
          - text: "Doch Jan rennt los, ganz ohne Halt,\ndie Bretter knarren, nass und kalt.\nEr packt das Lamm und dreht sich um,\nda bricht ein Pfosten: krach und bumm!\n\nMit einem Sprung erreicht er Land,\nder Vater hält ihn an der Hand.\nUnd hinter ihnen, mit lautem Krach,\nstürzt die Brücke in den Bach."
            say: "Doch Jan rennt los, ganz ohne Halt, die Bretter knarren, nass und kalt. Er packt das Lamm und dreht sich um, da bricht ein Pfosten: krach und bumm! Mit einem Sprung erreicht er Land, der Vater hält ihn an der Hand. Und hinter ihnen, mit lautem Krach, stürzt die Brücke in den Bach."
          - text: "Ballade = Gedicht + spannende Geschichte\n\nVerse, Strophen, Reime\nFiguren und eine Handlung\nein Höhepunkt\noft wörtliche Rede"
            say: "Na, hast du mitgezittert? Ein Gedicht kann richtig spannend sein! So ein Gedicht heißt Ballade. Eine Ballade hat Verse, Strophen und Reime wie jedes Gedicht. Aber sie erzählt auch eine spannende Geschichte mit Figuren. Die spannendste Stelle heißt Höhepunkt. Hier ist es die dritte Strophe, als der Pfosten bricht. Oft sprechen die Figuren selbst, wie Jan und sein Vater in der zweiten Strophe. Das ist wörtliche Rede."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Herbstwind\n\nDer Herbstwind singt sein leises Lied,\ndas bunte Laub im Kreise zieht.\nDie Sonne wärmt nur noch ganz sacht,\nbald kommt die lange, kühle Nacht.\n\nIst das eine Ballade?"
                say: "Lies das Gedicht. Ist das eine Ballade?"
                options: ["Nein, es erzählt keine Geschichte.", "Ja, es reimt sich.", "Ja, es hat Verse."]
                answer: "Nein, es erzählt keine Geschichte."
                feedback:
                  "Ja, es reimt sich.": "Reime hat jedes Gedicht. Eine Ballade erzählt außerdem eine spannende Geschichte."
                hints:
                  - "Was braucht eine Ballade außer Versen und Reimen?"
                  - "Gibt es hier Figuren, und passiert etwas Spannendes?"
                  - "Das Gedicht beschreibt nur den Herbst. Es ist keine Ballade."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Gehört das zu einer Ballade?"
                say: "Sortiere: Gehört das zu einer Ballade oder nicht?"
                bins:
                  - { id: yes, show: { text: "gehört dazu" }, say: "gehört dazu" }
                  - { id: no, show: { text: "gehört nicht dazu" }, say: "gehört nicht dazu" }
                options:
                  - { text: "Verse und Strophen", bin: yes }
                  - { text: "eine spannende Handlung", bin: yes }
                  - { text: "Figuren, die selbst sprechen", bin: yes }
                  - { text: "lange Absätze ohne Verse", bin: no }
                  - { text: "eine Tabelle mit Zahlen", bin: no }
                hints:
                  - "Eine Ballade ist ein Gedicht und eine Geschichte zugleich."
                  - "Hat ein Gedicht Absätze oder Verse?"
                  - "Verse, Handlung und sprechende Figuren gehören dazu."
              - id: l1-f3
                type: multiple_choice
                text: "„Dort drüben blökt mein Lämmchen klein,\nes ist im Sturm ganz allein!“\nDer Vater ruft: „Bleib hier, mein Sohn!\nDie Brücke wackelt ja schon!“\n\nWer ruft: „Bleib hier, mein Sohn!“?"
                say: "Lies die Strophe. Wer ruft: Bleib hier, mein Sohn?"
                options: ["der Vater", "Jan", "der Erzähler"]
                answer: "der Vater"
                feedback:
                  "der Erzähler": "Der Erzähler sagt nur: Der Vater ruft. Was in den Anführungszeichen steht, sagt eine Figur selbst."
                hints:
                  - "Lies, was direkt vor den Anführungszeichen steht."
                  - "Da steht: Der Vater ruft."
                  - "Der Vater ruft das."
              - id: l1-f4
                type: multiple_choice
                text: "Wo ist der Höhepunkt der Ballade „Jan und das Lamm“?"
                say: "Wo ist der Höhepunkt der Ballade Jan und das Lamm?"
                options: ["als der Pfosten bricht", "als Jan am Ufer steht", "als es zu regnen beginnt"]
                answer: "als der Pfosten bricht"
                hints:
                  - "Der Höhepunkt ist die spannendste Stelle."
                  - "Wann ist Jan in der größten Gefahr?"
                  - "Als der Pfosten bricht."
              - id: l1-f5
                type: ordering
                text: "Was passiert in „Jan und das Lamm“? Bring die Sätze in die richtige Reihenfolge."
                say: "Was passiert in der Ballade Jan und das Lamm? Bring die Sätze in die richtige Reihenfolge."
                options: ["Jan holt das Lamm.", "Der Vater warnt Jan.", "Die Brücke stürzt in den Bach.", "Jan hört sein Lamm blöken."]
                slot_count: 4
                answer: ["Jan hört sein Lamm blöken.", "Der Vater warnt Jan.", "Jan holt das Lamm.", "Die Brücke stürzt in den Bach."]
                hints:
                  - "Warum will Jan über die Brücke?"
                  - "Der Vater warnt ihn, bevor er losrennt."
                  - "Blöken, warnen, holen, Brücke stürzt."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Grete im Leuchtturm\n\nDie Nacht ist schwarz, die Wellen schlagen,\nim Leuchtturm sitzt die Grete Hagen.\nDa flackert's oben: Licht ist aus!\nUnd draußen kommt ein Schiff nach Haus.\n\nSie rennt hinauf, Stufe um Stufe,\nvom Meer her hört sie laute Rufe:\n„Wo ist das Licht? Wir sehen nichts!“\nDa strahlt es hell: der Schein des Lichts!\n\nErzählt dieses Gedicht eine Geschichte?"
                say: "Lies das Gedicht. Erzählt es eine Geschichte?"
                answer: true
                hints: ["Gibt es eine Figur, und passiert etwas?"]
              - id: l1-s2
                type: multiple_choice
                text: "Sie rennt hinauf, Stufe um Stufe,\nvom Meer her hört sie laute Rufe:\n„Wo ist das Licht? Wir sehen nichts!“\n\nWer ruft: „Wo ist das Licht?“"
                say: "Lies die Verse. Wer ruft: Wo ist das Licht?"
                options: ["die Seeleute auf dem Schiff", "Grete", "der Erzähler"]
                answer: "die Seeleute auf dem Schiff"
                hints: ["Woher kommen die Rufe?"]
              - id: l1-s3
                type: true_false
                text: "In einer Ballade passiert oft etwas Gefährliches, und man weiß lange nicht, wie es ausgeht. Stimmt das?"
                say: "Hör gut zu. In einer Ballade passiert oft etwas Gefährliches, und man weiß lange nicht, wie es ausgeht. Stimmt das?"
                answer: true
                hints: ["Wann hältst du beim Zuhören den Atem an?"]
              - id: l1-s4
                type: multiple_choice
                text: "Grete im Leuchtturm\n\nDie Nacht ist schwarz, die Wellen schlagen,\nim Leuchtturm sitzt die Grete Hagen.\nDa flackert's oben: Licht ist aus!\nUnd draußen kommt ein Schiff nach Haus.\n\nSie rennt hinauf, Stufe um Stufe,\nvom Meer her hört sie laute Rufe:\n„Wo ist das Licht? Wir sehen nichts!“\nDa strahlt es hell: der Schein des Lichts!\n\nAm Morgen liegt das Schiff im Hafen,\ndie Seeleute können endlich schlafen.\nSie winken hoch zum Turm am Meer:\n„Danke, Grete, danke sehr!“\n\nWie viele Strophen hat die Ballade?"
                say: "Lies die ganze Ballade. Wie viele Strophen hat sie?"
                options: ["3", "12", "4"]
                answer: "3"
                hints: ["Eine Strophe endet dort, wo eine Leerzeile kommt."]
              - id: l1-s5
                type: multiple_choice
                text: "Ein Fuchs überlistet in einer kurzen Geschichte einen Raben. Am Ende steht eine Lehre. Was ist das?"
                options: ["eine Fabel", "eine Ballade", "ein Gedicht"]
                answer: "eine Fabel"
                hints: ["Welche Texte haben am Ende eine Lehre?"]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Der Sturm tobte. Mit letzter Kraft zog Mila das Boot an Land. Da hörte sie hinter sich ein lautes Krachen.\n\nIst das eine Ballade?"
                say: "Lies den Text. Ist das eine Ballade?"
                answer: false
              - id: l1-n2
                type: multiple_choice
                text: "Am Morgen liegt das Schiff im Hafen,\ndie Seeleute können endlich schlafen.\nSie winken hoch zum Turm am Meer:\n„Danke, Grete, danke sehr!“\n\nWie geht die Ballade aus?"
                say: "Lies die letzte Strophe. Wie geht die Ballade aus?"
                options: ["Das Schiff kommt sicher in den Hafen.", "Das Schiff geht im Sturm unter.", "Grete schläft im Leuchtturm ein."]
                answer: "Das Schiff kommt sicher in den Hafen."
              - id: l1-n3
                type: ordering
                text: "Was passiert in „Grete im Leuchtturm“? Bring die Sätze in die richtige Reihenfolge."
                say: "Was passiert in der Ballade Grete im Leuchtturm? Bring die Sätze in die richtige Reihenfolge."
                options: ["Grete rennt die Treppe hinauf.", "Das Licht geht aus.", "Die Seeleute danken Grete.", "Das Licht strahlt wieder."]
                slot_count: 4
                answer: ["Das Licht geht aus.", "Grete rennt die Treppe hinauf.", "Das Licht strahlt wieder.", "Die Seeleute danken Grete."]
              - id: l1-n4
                type: multiple_choice
                text: "Was hat eine Ballade, was eine Erzählung nicht hat?"
                options: ["Verse, Strophen und Reime", "Figuren", "eine Handlung"]
                answer: "Verse, Strophen und Reime"
              - id: l1-n5
                type: multiple_choice
                text: "Wo ist der Höhepunkt der Ballade „Grete im Leuchtturm“?"
                say: "Wo ist der Höhepunkt der Ballade Grete im Leuchtturm?"
                options: ["als die Seeleute rufen und nichts sehen", "als Grete im Leuchtturm sitzt", "als das Schiff im Hafen liegt"]
                answer: "als die Seeleute rufen und nichts sehen"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Ein Gedicht erzählt in drei Strophen, wie ein Mädchen im Schneesturm seinen Hund rettet. Ist das eine Ballade?"
            answer: true
          - id: l1-c2
            type: multiple_choice
            text: "„Dort drüben blökt mein Lämmchen klein,\nes ist im Sturm ganz allein!“\n\nWer sagt das?"
            say: "Lies die Verse. Wer sagt das?"
            options: ["Jan", "der Vater", "der Erzähler"]
            answer: "Jan"
          - id: l1-c3
            type: multiple_choice
            text: "Was hat eine Ballade immer?"
            options: ["Verse und eine spannende Geschichte", "eine Lehre am Ende", "Tiere, die sprechen"]
            answer: "Verse und eine spannende Geschichte"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? In einer Ballade sprechen die Figuren nie selbst."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Der Kapitän schreit: „Alle Mann an Deck!“\nDie Wellen spülen Kisten weg.\n\nWer ruft: „Alle Mann an Deck!“?"
            say: "Lies die Verse. Wer ruft: Alle Mann an Deck?"
            options: ["der Kapitän", "der Erzähler", "die Wellen"]
            answer: "der Kapitän"
          - id: l1-c5
            type: multiple_choice
            text: "Was ist der Höhepunkt einer Ballade?"
            options: ["die spannendste Stelle", "der erste Vers", "die Überschrift"]
            answer: "die spannendste Stelle"

  - n: 2
    title: { de: "Herr von Ribbeck", en: "Herr von Ribbeck" }
    goal:
      de: "Lies die Ballade von Herrn von Ribbeck und finde heraus, warum er eine Birne mit ins Grab nimmt."
      en: "Read the ballad of Herr von Ribbeck and find out why he takes a pear into his grave."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist eine Ballade?"
            options: ["ein Gedicht, das eine spannende Geschichte erzählt", "eine Geschichte ohne Verse", "ein Lied ohne Worte"]
            answer: "ein Gedicht, das eine spannende Geschichte erzählt"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein Gedicht beschreibt nur, wie der Schnee in der Sonne glitzert. Ist das eine Ballade?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Eine Birne mit ins Grab?"
            say: "Ein alter Mann wünscht sich: Legt mir eine Birne mit in mein Grab. Was glaubst du: Warum wünscht er sich das? Die Ballade verrät es dir."
          - text: "Herr von Ribbeck auf Ribbeck im Havelland\nvon Theodor Fontane\n\nHerr von Ribbeck auf Ribbeck im Havelland,\nEin Birnbaum in seinem Garten stand,\nUnd kam die goldene Herbsteszeit,\nUnd die Birnen leuchteten weit und breit,\nDa stopfte, wenn’s Mittag vom Thurme scholl,\nDer von Ribbeck sich beide Taschen voll,\nUnd kam in Pantinen ein Junge daher,\nSo rief er: „Junge, wist’ ne Beer?“\nUnd kam ein Mädel, so rief er: „Lütt Dirn,\nKumm man röwer, ick hebb’ ne Birn.“"
            say: "Diese Ballade hat Theodor Fontane vor mehr als hundert Jahren geschrieben. Hier ist die erste Strophe. Herr von Ribbeck auf Ribbeck im Havelland, ein Birnbaum in seinem Garten stand, und kam die goldene Herbsteszeit und die Birnen leuchteten weit und breit, da stopfte, wenn's Mittag vom Turme scholl, der von Ribbeck sich beide Taschen voll, und kam in Pantinen ein Junge daher, so rief er: Junge, wist 'ne Beer? Und kam ein Mädel, so rief er: Lütt Dirn, kumm man röwer, ick hebb 'ne Birn."
          - text: "wist’ ne Beer? = willst du eine Birne?\nLütt Dirn = kleines Mädchen\nKumm man röwer = Komm mal herüber\nick hebb’ ne Birn = ich habe eine Birne\n\nSo geht es weiter: Der alte Ribbeck wird krank. Er sagt: „Legt mir eine Birne mit in’s Grab.“ Sein Sohn ist geizig und verschenkt keine Birnen. Die Kinder sind traurig. Doch aus der Birne im Grab wächst ein kleiner Birnbaum."
            say: "Ribbeck spricht Plattdeutsch, so wie die Leute damals im Dorf. Wist 'ne Beer heißt: Willst du eine Birne? Er schenkt den Kindern also Birnen. In den nächsten Strophen stirbt der alte Ribbeck. Er lässt sich eine Birne mit ins Grab legen. Sein Sohn ist geizig und verschenkt nichts. Doch aus der Birne im Grab wächst ein neuer Birnbaum."
          - text: "Und die Jahre gehen wohl auf und ab,\nLängst wölbt sich ein Birnbaum über dem Grab,\nUnd in der goldenen Herbsteszeit\nLeuchtet’s wieder weit und breit.\nUnd kommt ein Jung’ über’n Kirchhof her,\nSo flüstert’s im Baume: „wiste ne Beer?“\nUnd kommt ein Mädel, so flüstert’s: „Lütt Dirn,\nKumm man röwer, ick gew’ Di ’ne Birn.“\n\nSo spendet Segen noch immer die Hand\nDes von Ribbeck auf Ribbeck im Havelland."
            say: "Und so endet die Ballade. Und die Jahre gehen wohl auf und ab, längst wölbt sich ein Birnbaum über dem Grab, und in der goldenen Herbsteszeit leuchtet's wieder weit und breit. Und kommt ein Jung' über'n Kirchhof her, so flüstert's im Baume: Wiste ne Beer? Und kommt ein Mädel, so flüstert's: Lütt Dirn, kumm man röwer, ick gew' di 'ne Birn. So spendet Segen noch immer die Hand des von Ribbeck auf Ribbeck im Havelland. Ick gew' di 'ne Birn heißt: Ich gebe dir eine Birne. Der alte Ribbeck hat also vorgesorgt: Die Kinder bekommen weiter Birnen."
          - text: "Wusstest du? Das Dorf Ribbeck im Havelland gibt es wirklich. Und an der Kirche steht heute wieder ein Birnbaum."
            say: "Wusstest du? Das Dorf Ribbeck im Havelland gibt es wirklich, und die Familie von Ribbeck auch. Dort stand lange ein alter Birnbaum. Im Jahr neunzehnhundertelf hat ihn ein Sturm umgeworfen. Heute steht an der Kirche wieder ein junger Birnbaum, und viele Leute kommen, um ihn anzuschauen."
            show: { object: pear }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was macht Herr von Ribbeck im Herbst mit seinen Birnen?"
                options: ["Er schenkt sie den Kindern.", "Er verkauft sie auf dem Markt.", "Er isst sie alle allein."]
                answer: "Er schenkt sie den Kindern."
                feedback:
                  "Er isst sie alle allein.": "Er stopft sich zwar die Taschen voll. Aber lies, was er dem Jungen und dem Mädel zuruft."
                hints:
                  - "Was ruft Ribbeck den Kindern zu?"
                  - "Wist’ ne Beer heißt: Willst du eine Birne?"
                  - "Er schenkt die Birnen den Kindern."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was heißt das auf Hochdeutsch?"
                say: "Ribbeck spricht Plattdeutsch. Verbinde jeden Ausdruck mit dem, was er auf Hochdeutsch heißt."
                pairs:
                  - { left: { text: "wist’ ne Beer?" }, right: { text: "Willst du eine Birne?" } }
                  - { left: { text: "Lütt Dirn" }, right: { text: "kleines Mädchen" } }
                  - { left: { text: "Kumm man röwer" }, right: { text: "Komm mal herüber" } }
                  - { left: { text: "ick gew’ Di ’ne Birn" }, right: { text: "ich gebe dir eine Birne" } }
                hints:
                  - "Viele Wörter klingen fast wie im Hochdeutschen."
                  - "Beer und Birn sind beide die Birne. Lütt heißt klein."
                  - "Kumm man röwer heißt: Komm mal herüber."
              - id: l2-f3
                type: multiple_choice
                text: "Warum lässt sich der alte Ribbeck eine Birne mit ins Grab legen?"
                options: ["Er ahnt, dass sein Sohn geizig ist, und will, dass ein neuer Baum wächst.", "Er will im Grab etwas zu essen haben.", "Er will die Birne vor den Kindern verstecken."]
                answer: "Er ahnt, dass sein Sohn geizig ist, und will, dass ein neuer Baum wächst."
                feedback:
                  "Er will im Grab etwas zu essen haben.": "Ein Snack für später? Nein! Ribbeck denkt an die Kinder. Er ahnt, dass sein Sohn geizig ist. Aus der Birne soll ein neuer Baum wachsen."
                hints:
                  - "Was wächst später aus dem Grab?"
                  - "Was würde der Sohn mit den Birnen machen?"
                  - "Ribbeck will, dass die Kinder weiter Birnen bekommen."
              - id: l2-f4
                type: ordering
                text: "Bring die Handlung der Ballade in die richtige Reihenfolge."
                options: ["Ribbeck stirbt.", "Ribbeck verschenkt Birnen.", "Der Baum auf dem Grab schenkt den Kindern Birnen.", "Aus dem Grab wächst ein Birnbaum."]
                slot_count: 4
                answer: ["Ribbeck verschenkt Birnen.", "Ribbeck stirbt.", "Aus dem Grab wächst ein Birnbaum.", "Der Baum auf dem Grab schenkt den Kindern Birnen."]
                hints:
