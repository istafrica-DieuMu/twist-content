# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.sentences-place-time
skill: lit-de.sentences.place-time
curriculum: de-DE
language: de
title:
  de: Orts- und Zeitangaben
  en: Place and time phrases
summary: >
  Satzglieder that say where and when something happens. Lesson 1 finds
  the Ortsangabe with "Wo?", "Wohin?" and "Woher?" (im Garten, in die
  Schule); lesson 2 finds the Zeitangabe with "Wann?" and "Wie lange?"
  (am Morgen, zwei Stunden), tells both apart in one sentence, and ends
  with the skill check.
metadata:
  year: klasse-4
  topic: { de: Satzglieder, en: Parts of a sentence }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.sentences.move-parts]
  also_practises: [lit-de.sentences.objects]
  vocabulary: { de: [Ortsangabe, Zeitangabe, "Wo?", "Wohin?", "Woher?", "Wann?", "Wie lange?"] }
  forms: [picture, text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: place, what: { de: "Ortsangaben mit „Wo?“, „Wohin?“ und „Woher?“ erfragen", en: "finding place phrases with where, where to and where from" } }
    - { id: time, what: { de: "Zeitangaben mit „Wann?“ und „Wie lange?“ erfragen", en: finding time phrases with when and how long } }
    - { id: tell-apart, what: { de: Orts- und Zeitangaben in einem Satz unterscheiden, en: telling place and time phrases apart in one sentence } }
  misconceptions:
    - id: one-word-only
      what: Marks only the noun of a place or time phrase (Garten instead of im Garten)
      addressed: the highlight tasks in every stage need every word of the phrase
    - id: place-time-mixup
      what: Calls a time phrase an Ortsangabe because it has a preposition (am Montag, im Sommer)
      addressed: lesson 2 Learn sets im Garten against im Sommer; every stage of lesson 2 has a sorting or naming task with im or am phrases of both kinds, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wo? Wohin? Woher?", en: "Where? Where to? Where from?" }
    goal:
      de: "Finde Ortsangaben mit den Fragen wo, wohin und woher, so wie im Garten oder in die Schule."
      en: "Find phrases of place with the questions where, where to and where from, like in the garden or to school."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "„Ich trage einen Rucksack.“ Wen oder was trage ich?"
            say: "Ich trage einen Rucksack. Wen oder was trage ich?"
            options: ["einen Rucksack", "Ich", "trage"]
            answer: "einen Rucksack"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Satzglieder hat der Satz? „Der Hase hoppelt über die Wiese.“"
            say: "Der Hase hoppelt über die Wiese. Wie viele Satzglieder hat der Satz?"
            options: ["3", "5", "4"]
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Im Kühlschrank? Im Schwimmbad? Auf dem Sofa?"
            say: "Was glaubst du: Wo schläft eine Katze am liebsten? Im Kühlschrank, im Schwimmbad oder auf dem Sofa?"
            show: { objects: [cat, sofa] }
          - text: "Die Katze schläft auf dem Sofa."
            say: "Auf dem Sofa, natürlich! Manche Satzglieder sagen, wo etwas passiert. Frag: Wo schläft die Katze? Auf dem Sofa. Das ist die Ortsangabe."
          - text: "Wir fahren an den See."
            say: "Mit Wohin fragst du nach dem Ziel: Wohin fahren wir? An den See. Auch das ist eine Ortsangabe."
          - text: "Papa kommt aus dem Büro."
            say: "Und mit Woher fragst du, wo jemand herkommt: Woher kommt Papa? Aus dem Büro. Das ist auch eine Ortsangabe."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "„Die Kinder spielen im Garten.“ Wo spielen die Kinder?"
                say: "Die Kinder spielen im Garten. Wo spielen die Kinder?"
                options: ["im Garten", "Die Kinder", "spielen"]
                answer: "im Garten"
                hints:
                  - "Stell die Frage: Wo spielen die Kinder?"
                  - "Die Antwort sagt einen Ort."
                  - "im Garten."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tippe auf alle Wörter der Ortsangabe."
                say: "Lies den Satz. Tippe auf alle Wörter, die zur Ortsangabe gehören."
                show: { drawn: letter-card, text: "Der Vogel sitzt auf dem hohen Baum." }
                spans: ["auf", "dem", "hohen", "Baum"]
                hints:
                  - "Frag: Wo sitzt der Vogel?"
                  - "Die Antwort hat vier Wörter."
                  - "auf dem hohen Baum."
              - id: l1-f3
                type: multiple_choice
                text: "„Lena geht in die Bücherei.“ Mit welcher Frage findest du „in die Bücherei“?"
                say: "Lena geht in die Bücherei. Mit welcher Frage findest du in die Bücherei?"
                options: ["Wohin?", "Woher?", "Wen oder was?"]
                answer: "Wohin?"
                feedback:
                  "Woher?": "Lena kommt nicht aus der Bücherei, sie geht hinein. Nach dem Ziel fragst du mit Wohin."
                hints:
                  - "Geht Lena irgendwo hin oder kommt sie von dort?"
                  - "Nach dem Ziel fragst du mit …"
                  - "Wohin?"
              - id: l1-f4
                type: true_false
                text: "„Der Zug kommt aus Hamburg.“ Findest du „aus Hamburg“ mit der Frage „Woher?“?"
                say: "Der Zug kommt aus Hamburg. Findest du aus Hamburg mit der Frage Woher?"
                answer: true
                hints:
                  - "Fährt der Zug nach Hamburg oder kommt er von dort?"
                  - "Woher kommt der Zug?"
                  - "Ja, mit Woher."
              - id: l1-f5
                type: multiple_choice
                text: "„Auf dem Spielplatz trifft Max seinen Freund.“ Wo trifft Max seinen Freund?"
                say: "Auf dem Spielplatz trifft Max seinen Freund. Wo trifft Max seinen Freund?"
                options: ["seinen Freund", "Max", "Auf dem Spielplatz"]
                answer: "Auf dem Spielplatz"
                hints:
                  - "Die Ortsangabe kann auch vorn stehen."
                  - "Welcher Teil sagt einen Ort?"
                  - "Auf dem Spielplatz."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "„Die Fische schwimmen im Aquarium.“ Wo schwimmen die Fische?"
                say: "Die Fische schwimmen im Aquarium. Wo schwimmen die Fische?"
                options: ["Die Fische", "im Aquarium", "schwimmen"]
                answer: "im Aquarium"
                show: { object: fish }
                feedback:
                  "Die Fische": "Die Fische schwimmen in den Fischen? Da wird es aber eng! Frag mit Wo: Wo schwimmen die Fische? Im Aquarium."
                hints: ["Stell die Frage mit Wo."]
              - id: l1-s2
                type: highlight_in_text
                text: "Tippe auf alle Wörter der Ortsangabe."
                say: "Lies den Satz. Tippe auf alle Wörter, die zur Ortsangabe gehören."
                show: { drawn: letter-card, text: "Mein Bruder klettert auf das Dach." }
                spans: ["auf", "das", "Dach"]
                hints: ["Frag: Wohin klettert mein Bruder? Nimm alle Wörter der Antwort."]
              - id: l1-s3
                type: multiple_choice
                text: "„Oma kommt aus der Apotheke zurück.“ Mit welcher Frage findest du „aus der Apotheke“?"
                say: "Oma kommt aus der Apotheke zurück. Mit welcher Frage findest du aus der Apotheke?"
                options: ["Wo?", "Woher?", "Wohin?"]
                answer: "Woher?"
                hints: ["Kommt Oma von dort oder geht sie dorthin?"]
              - id: l1-s4
                type: true_false
                text: "„Wir wohnen in einem kleinen Dorf.“ Findest du „in einem kleinen Dorf“ mit der Frage „Wohin?“?"
                say: "Wir wohnen in einem kleinen Dorf. Findest du in einem kleinen Dorf mit der Frage Wohin?"
                answer: false
                hints: ["Bewegt sich hier jemand zu einem Ziel?"]
              - id: l1-s5
                type: multiple_choice
                text: "„In der Küche duftet es nach Kuchen.“ Wo duftet es nach Kuchen?"
                say: "In der Küche duftet es nach Kuchen. Wo duftet es nach Kuchen?"
                options: ["nach Kuchen", "In der Küche", "es"]
                answer: "In der Küche"
                hints: ["Welcher Teil nennt einen Ort?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "„Der Hund liegt unter dem Tisch.“ Wo liegt der Hund?"
                say: "Der Hund liegt unter dem Tisch. Wo liegt der Hund?"
                options: ["unter dem Tisch", "Der Hund", "liegt"]
                answer: "unter dem Tisch"
                show: { objects: [dog, table] }
              - id: l1-n2
                type: highlight_in_text
                text: "Tippe auf alle Wörter der Ortsangabe."
                say: "Lies den Satz. Tippe auf alle Wörter, die zur Ortsangabe gehören."
                show: { drawn: letter-card, text: "Nach der Schule fahre ich zu meiner Oma." }
                spans: ["zu", "meiner", "Oma"]
              - id: l1-n3
                type: multiple_choice
                text: "„Die Vögel fliegen in den Süden.“ Mit welcher Frage findest du „in den Süden“?"
                say: "Die Vögel fliegen in den Süden. Mit welcher Frage findest du in den Süden?"
                options: ["Woher?", "Wo?", "Wohin?"]
                answer: "Wohin?"
              - id: l1-n4
                type: true_false
                text: "„Die Äpfel kommen aus Italien.“ Findest du „aus Italien“ mit der Frage „Wo?“?"
                say: "Die Äpfel kommen aus Italien. Findest du aus Italien mit der Frage Wo?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "„Im Wald sammeln wir Pilze.“ Wo sammeln wir Pilze?"
                say: "Im Wald sammeln wir Pilze. Wo sammeln wir Pilze?"
                options: ["Pilze", "wir", "Im Wald"]
                answer: "Im Wald"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "„Die Jacke hängt an der Garderobe.“ Wo hängt die Jacke?"
            say: "Die Jacke hängt an der Garderobe. Wo hängt die Jacke?"
            options: ["Die Jacke", "an der Garderobe", "hängt"]
            answer: "an der Garderobe"
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf alle Wörter der Ortsangabe."
            say: "Lies den Satz. Tippe auf alle Wörter, die zur Ortsangabe gehören."
            show: { drawn: letter-card, text: "Der Igel kriecht unter die Hecke." }
            spans: ["unter", "die", "Hecke"]
          - id: l1-c3
            type: multiple_choice
            text: "„Tim kommt gerade vom Training.“ Mit welcher Frage findest du „vom Training“?"
            say: "Tim kommt gerade vom Training. Mit welcher Frage findest du vom Training?"
            options: ["Wohin?", "Woher?", "Wo?"]
            answer: "Woher?"
          - id: l1-c4
            type: true_false
            text: "„Die Kinder laufen in den Wald.“ Findest du „in den Wald“ mit der Frage „Wohin?“?"
            say: "Die Kinder laufen in den Wald. Findest du in den Wald mit der Frage Wohin?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "„Hinter dem Haus steht ein alter Schuppen.“ Wo steht ein alter Schuppen?"
            say: "Hinter dem Haus steht ein alter Schuppen. Wo steht ein alter Schuppen?"
            options: ["Hinter dem Haus", "ein alter Schuppen", "steht"]
            answer: "Hinter dem Haus"
          - id: l1-c6
            type: highlight_in_text
            text: "Tippe auf alle Wörter der Ortsangabe."
            say: "Lies den Satz. Tippe auf alle Wörter, die zur Ortsangabe gehören."
            show: { drawn: letter-card, text: "Der Brief kommt aus Amerika." }
            spans: ["aus", "Amerika"]

  - n: 2
    title: { de: "Wann? Wie lange?", en: "When? How long?" }
    goal:
      de: "Finde Zeitangaben mit den Fragen wann und wie lange. Im Sommer ist eine Zeit, im Garten ist ein Ort."
      en: "Find phrases of time with the questions when and how long. In summer is a time, in the garden is a place."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "„Das Buch liegt auf dem Regal.“ Wo liegt das Buch?"
            say: "Das Buch liegt auf dem Regal. Wo liegt das Buch?"
            options: ["auf dem Regal", "Das Buch", "liegt"]
            answer: "auf dem Regal"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "„Wir fliegen nach Spanien.“ Mit welcher Frage findest du „nach Spanien“?"
            say: "Wir fliegen nach Spanien. Mit welcher Frage findest du nach Spanien?"
            options: ["Wohin?", "Woher?", "Wo?"]
            answer: "Wohin?"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Am Morgen frühstückt Ben. Wo oder wann?"
            say: "Am Morgen frühstückt Ben. Was glaubst du: Sagt am Morgen, wo Ben frühstückt, oder wann?"
            show: { object: cereal-box }
          - text: "Am Morgen frühstückt Ben."
            say: "Es sagt, wann! Andere Satzglieder sagen, wann etwas passiert. Frag: Wann frühstückt Ben? Am Morgen. Das ist die Zeitangabe."
          - text: "Wir haben zwei Stunden gespielt."
            say: "Mit Wie lange fragst du nach der Dauer: Wie lange haben wir gespielt? Zwei Stunden. Auch das ist eine Zeitangabe."
          - text: "im Garten · im Sommer"
            say: "Pass auf, im Garten und im Sommer klingen ähnlich. Im Garten ist ein Ort, danach fragst du mit Wo. Im Sommer ist eine Zeit, danach fragst du mit Wann. Stell immer die Frage, dann weißt du es."
          - text: "Wusstest du? Wenn es in Berlin 12 Uhr mittags ist, ist es in New York meistens erst 6 Uhr morgens."
            say: "Wusstest du? Wenn es in Berlin zwölf Uhr mittags ist, ist es in New York meistens erst sechs Uhr morgens. Die Kinder in Berlin essen also schon zu Mittag, während die Kinder in New York gerade aufwachen."
            show: { object: clock }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "„Am Samstag gehen wir schwimmen.“ Wann gehen wir schwimmen?"
                say: "Am Samstag gehen wir schwimmen. Wann gehen wir schwimmen?"
                options: ["Am Samstag", "wir", "schwimmen"]
                answer: "Am Samstag"
                hints:
                  - "Stell die Frage: Wann gehen wir schwimmen?"
                  - "Die Antwort sagt eine Zeit."
                  - "Am Samstag."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "„Im Winter fahren wir Schlitten.“ Was ist „Im Winter“?"
                say: "Im Winter fahren wir Schlitten. Ist im Winter eine Ortsangabe oder eine Zeitangabe?"
                options: ["Zeitangabe", "Ortsangabe"]
                answer: "Zeitangabe"
                feedback:
                  "Ortsangabe": "Im Winter klingt wie im Garten, aber es ist eine Zeit. Frag: Wann fahren wir Schlitten?"
                hints:
                  - "Frag: Wo? Oder: Wann?"
                  - "Wann fahren wir Schlitten?"
                  - "Zeitangabe."
              - id: l2-f3
                type: highlight_in_text
                text: "Tippe auf alle Wörter der Zeitangabe."
                say: "Lies den Satz. Tippe auf alle Wörter, die zur Zeitangabe gehören."
                show: { drawn: letter-card, text: "Der Film dauert eine ganze Stunde." }
                spans: ["eine", "ganze", "Stunde"]
                hints:
                  - "Frag: Wie lange dauert der Film?"
                  - "Die Antwort hat drei Wörter."
                  - "eine ganze Stunde."
              - id: l2-f4
                type: sorting
                text: "Ortsangabe oder Zeitangabe?"
                say: "Sortiere: Ist es eine Ortsangabe oder eine Zeitangabe?"
                bins:
                  - { id: place, show: { text: "Ortsangabe (Wo?)" }, say: "Ortsangabe" }
                  - { id: time, show: { text: "Zeitangabe (Wann?)" }, say: "Zeitangabe" }
                options:
                  - { text: "im Keller", bin: place }
                  - { text: "im Herbst", bin: time }
                  - { text: "am Strand", bin: place }
                  - { text: "am Abend", bin: time }
                hints:
                  - "Frag bei jedem: Wo? Oder: Wann?"
                  - "Ein Keller ist ein Ort, der Herbst eine Jahreszeit."
                  - "Im Keller und am Strand sind Orte, im Herbst und am Abend Zeiten."
              - id: l2-f5
                type: true_false
                text: "„Ich habe drei Tage gewartet.“ Findest du „drei Tage“ mit der Frage „Wie lange?“?"
                say: "Ich habe drei Tage gewartet. Findest du drei Tage mit der Frage Wie lange?"
                answer: true
                hints:
                  - "Sagt drei Tage, wann es war oder wie lange es gedauert hat?"
                  - "Wie lange habe ich gewartet?"
                  - "Ja, mit Wie lange."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "„Nach dem Essen putzt sich Mia die Zähne.“ Wann putzt sich Mia die Zähne?"
                say: "Nach dem Essen putzt sich Mia die Zähne. Wann putzt sich Mia die Zähne?"
                options: ["die Zähne", "Nach dem Essen", "Mia"]
                answer: "Nach dem Essen"
                hints: ["Stell die Frage mit Wann."]
              - id: l2-s2
                type: multiple_choice
                text: "„Am Fluss angeln Opa und ich.“ Was ist „Am Fluss“?"
                say: "Am Fluss angeln Opa und ich. Ist am Fluss eine Ortsangabe oder eine Zeitangabe?"
                options: ["Zeitangabe", "Ortsangabe"]
                answer: "Ortsangabe"
                hints: ["Probier beide Fragen aus: Wo? Wann?"]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf alle Wörter der Zeitangabe."
                say: "Lies den Satz. Tippe auf alle Wörter, die zur Zeitangabe gehören."
                show: { drawn: letter-card, text: "Am nächsten Tag schien wieder die Sonne." }
                spans: ["Am", "nächsten", "Tag"]
                hints: ["Frag: Wann schien die Sonne wieder?"]
              - id: l2-s4
                type: sorting
                text: "Ortsangabe oder Zeitangabe?"
                say: "Sortiere: Ist es eine Ortsangabe oder eine Zeitangabe?"
                bins:
                  - { id: place, show: { text: "Ortsangabe (Wo?)" }, say: "Ortsangabe" }
                  - { id: time, show: { text: "Zeitangabe (Wann?)" }, say: "Zeitangabe" }
                options:
                  - { text: "im Mai", bin: time }
                  - { text: "im Zelt", bin: place }
                  - { text: "am Mittag", bin: time }
                  - { text: "am Fenster", bin: place }
                hints: ["Frag bei jedem: Wo? Oder: Wann?"]
              - id: l2-s5
                type: true_false
                text: "„Der Kuchen backt eine Stunde im Ofen.“ Ist „im Ofen“ die Zeitangabe?"
                say: "Der Kuchen backt eine Stunde im Ofen. Ist im Ofen die Zeitangabe?"
                answer: false
                show: { objects: [cake, oven] }
                hints: ["Welcher Teil sagt, wie lange?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "„Gestern hat es stark geregnet.“ Wann hat es stark geregnet?"
                say: "Gestern hat es stark geregnet. Wann hat es stark geregnet?"
                options: ["stark", "Gestern", "es"]
                answer: "Gestern"
              - id: l2-n2
                type: multiple_choice
                text: "„Im Frühling blühen die Tulpen.“ Was ist „Im Frühling“?"
                say: "Im Frühling blühen die Tulpen. Ist im Frühling eine Ortsangabe oder eine Zeitangabe?"
                options: ["Ortsangabe", "Zeitangabe"]
                answer: "Zeitangabe"
              - id: l2-n3
                type: highlight_in_text
                text: "Tippe auf alle Wörter der Zeitangabe."
                say: "Lies den Satz. Tippe auf alle Wörter, die zur Zeitangabe gehören."
                show: { drawn: letter-card, text: "Die Sommerferien dauern sechs Wochen." }
                spans: ["sechs", "Wochen"]
              - id: l2-n4
                type: sorting
                text: "Ortsangabe oder Zeitangabe?"
                say: "Sortiere: Ist es eine Ortsangabe oder eine Zeitangabe?"
                bins:
                  - { id: place, show: { text: "Ortsangabe (Wo?)" }, say: "Ortsangabe" }
                  - { id: time, show: { text: "Zeitangabe (Wann?)" }, say: "Zeitangabe" }
                options:
                  - { text: "im Stall", bin: place }
                  - { text: "am Wochenende", bin: time }
                  - { text: "im Januar", bin: time }
                  - { text: "am Bahnhof", bin: place }
              - id: l2-n5
                type: true_false
                text: "„Morgen fahren wir mit dem Bus in die Stadt.“ Ist „in die Stadt“ eine Ortsangabe?"
                say: "Morgen fahren wir mit dem Bus in die Stadt. Ist in die Stadt eine Ortsangabe?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: time
            type: multiple_choice
            text: "„Um acht Uhr beginnt die Schule.“ Wann beginnt die Schule?"
            say: "Um acht Uhr beginnt die Schule. Wann beginnt die Schule?"
            options: ["die Schule", "Um acht Uhr", "beginnt"]
            answer: "Um acht Uhr"
          - id: l2-c2
            part: place
            type: highlight_in_text
            text: "Tippe auf alle Wörter der Ortsangabe."
            say: "Lies den Satz. Tippe auf alle Wörter, die zur Ortsangabe gehören."
            show: { drawn: letter-card, text: "Am Abend sitzen wir vor dem Kamin." }
            spans: ["vor", "dem", "Kamin"]
          - id: l2-c3
            part: place
            type: multiple_choice
            text: "„Die Kinder rennen auf den Schulhof.“ Mit welcher Frage findest du „auf den Schulhof“?"
            say: "Die Kinder rennen auf den Schulhof. Mit welcher Frage findest du auf den Schulhof?"
            options: ["Wo?", "Wann?", "Wohin?"]
            answer: "Wohin?"
          - id: l2-c4
            part: tell-apart
            type: sorting
            text: "Welche Frage passt: Wo oder Wann?"
            say: "Sortiere die Karten. Fragst du mit Wo oder mit Wann?"
            bins:
              - { id: place, show: { text: "Wo?" }, say: "Wo" }
              - { id: time, show: { text: "Wann?" }, say: "Wann" }
            options:
              - { text: "im April", bin: time }
              - { text: "im Schwimmbad", bin: place }
              - { text: "am Nachmittag", bin: time }
              - { text: "am Kiosk", bin: place }
          - id: l2-c5
            part: time
            type: true_false
            text: "„Wir haben eine Woche an der Nordsee gezeltet.“ Ist „eine Woche“ die Zeitangabe?"
            say: "Wir haben eine Woche an der Nordsee gezeltet. Ist eine Woche die Zeitangabe?"
            answer: true
          - id: l2-c6
            part: place
            type: highlight_in_text
            text: "Tippe auf alle Wörter der Ortsangabe."
            say: "Lies den Satz. Tippe auf alle Wörter, die zur Ortsangabe gehören."
            show: { drawn: letter-card, text: "Die Katze springt auf den Schrank." }
            spans: ["auf", "den", "Schrank"]
          - id: l2-c7
