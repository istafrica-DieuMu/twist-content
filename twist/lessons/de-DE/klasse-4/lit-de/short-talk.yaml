# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.short-talk
skill: lit-de.speaking.short-talk
curriculum: de-DE
language: de
title:
  de: Einen Kurzvortrag halten
  en: Giving a short talk
summary: >
  Preparing and giving a short talk from a cue card. Lesson 1 plans a talk
  (Einleitung, Hauptteil, Schluss), writes Stichwörter instead of whole
  sentences on the Stichwortzettel and leaves out notes that do not fit
  the topic; lesson 2 gives the talk (Blickkontakt, frei sprechen, ein
  Bild zeigen, Fragen beantworten), turns a Stichwort back into a spoken
  sentence, gives fair feedback, and ends with the skill check. The talks
  about the honeybee and the red fox use well-established facts and are
  written for Twist. The speak tasks run as the record-and-compare
  fallback and are never scored. The skill check marks what a screen can
  mark (the cue card, what fits the topic, the order of the parts, what
  helps when speaking, fair feedback); giving the talk aloud is covered by
  the speak tasks in Practise.
metadata:
  year: klasse-4
  topic: { de: Vor anderen sprechen, en: Speaking to an audience }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.speaking.describe-explain, lit-de.comprehension.notes]
  also_practises: [lit-de.comprehension.notes, lit-de.speaking.record-voice]
  vocabulary: { de: [Vortrag, Referat, Stichwortzettel, Stichwort, Einleitung, Hauptteil, Schluss, Blickkontakt, frei sprechen, Rückmeldung] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: cue-card, what: { de: Stichwörter für den Stichwortzettel wählen, en: choosing key words for the cue card } }
    - { id: fit-topic, what: { de: "Stichwörter weglassen, die nicht zum Thema passen", en: leaving out notes that do not fit the topic } }
    - { id: structure, what: { de: "Einleitung, Hauptteil und Schluss ordnen", en: "putting introduction, main part and ending in order" } }
    - { id: delivery, what: { de: "wissen, was beim Vortragen hilft, und frei sprechen", en: knowing what helps when giving a talk and speaking freely } }
    - { id: feedback, what: { de: eine faire Rückmeldung geben, en: giving fair feedback } }
  misconceptions:
    - id: read-out-sentences
      what: Writes whole sentences on the card and reads them out instead of speaking freely
      addressed: "lesson 1 Learn shrinks a sentence to Stichwörter; l1-f1, l1-s1, l1-n1 and l2-c1 offer the whole sentence as a distractor (feedback on l1-f1), and l2-f1, l2-s1 and l2-n1 tell reading out from speaking freely"
    - id: everything-i-know
      what: Puts everything known about the subject into the talk, including notes off the topic
      addressed: "l1-f4, l1-s4, l1-n4 and l2-c3 find the note that does not fit the topic, with feedback on l1-f4"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Den Vortrag vorbereiten", en: "Preparing the talk" }
    goal:
      de: "Plane einen kurzen Vortrag mit Einleitung, Hauptteil und Schluss, und schreib nur Stichwörter auf deinen Zettel."
      en: "Plan a short talk with a beginning, a middle and an end, and write only key words on your card."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Füchse leben in einem Bau unter der Erde.\n\nWelche Notiz ist ein gutes Stichwort?"
            say: "Lies den Satz. Welche Notiz ist ein gutes Stichwort?"
            options: ["Bau unter der Erde", "Füchse leben in einem", "unter der"]
            answer: "Bau unter der Erde"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Du erklärst einem Freund, wie man einen Drachen steigen lässt. Was hilft ihm am meisten?"
            say: "Du erklärst einem Freund, wie man einen Drachen steigen lässt. Was hilft ihm am meisten?"
            options: ["Ich erkläre Schritt für Schritt in der richtigen Reihenfolge.", "Ich erzähle alles durcheinander.", "Ich sage nur: Das ist ganz leicht."]
            answer: "Ich erkläre Schritt für Schritt in der richtigen Reihenfolge."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "„Ähm, also … Bienen.“\n\noder\n\n„Habt ihr schon einmal eine Biene tanzen sehen?“"
            say: "Zwei Kinder fangen ihren Vortrag über Bienen an. Das erste sagt: Ähm, also, Bienen. Das zweite fragt: Habt ihr schon einmal eine Biene tanzen sehen? Was glaubst du: Bei wem willst du weiter zuhören?"
          - text: "Einleitung: Thema nennen, neugierig machen\nHauptteil: das Wichtigste in Abschnitten\nSchluss: kurz zusammenfassen, Fragen beantworten"
            say: "Bestimmt beim zweiten! Die Frage macht neugierig. Ein Kurzvortrag hat drei Teile. In der Einleitung sagst du, worum es geht, und machst die Zuhörer neugierig. Im Hauptteil erklärst du das Wichtigste. Im Schluss fasst du zusammen und fragst, ob es Fragen gibt."
          - text: "Honigbienen leben in einem Volk mit einer Königin.\n\nStichwortzettel:\n1. Volk mit Königin"
            say: "Auf deinen Stichwortzettel schreibst du keine ganzen Sätze. Du schreibst nur Stichwörter, groß und gut lesbar, und nummerierst sie. So sprichst du frei und liest nicht ab."
          - text: "1. Volk mit Königin\n2. Arbeiterinnen: Nektar, Pollen\n3. Tanz zeigt Futterplatz\n4. Honig als Wintervorrat"
            say: "Auf den Zettel kommt nur, was zu deinem Thema passt. Dass dein Onkel Imker ist, ist spannend, gehört aber nicht in einen Vortrag über das Leben der Bienen."
          - text: "Wusstest du? Eine Honigbiene hat fünf Augen: zwei große an den Seiten und drei kleine oben auf dem Kopf."
            say: "Wusstest du? Eine Honigbiene hat fünf Augen. Zwei große Augen sitzen an den Seiten des Kopfes, und drei winzige Augen oben auf dem Kopf. Mit so einer Frage kannst du deinen Vortrag beginnen: Wusstet ihr, dass eine Biene fünf Augen hat?"
            show: { object: bee }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Eine Biene besucht an einem Tag viele hundert Blüten.\n\nWas schreibst du auf den Stichwortzettel?"
                say: "Lies den Satz. Was schreibst du auf den Stichwortzettel?"
                options: ["viele hundert Blüten am Tag", "Eine Biene besucht an einem Tag viele hundert Blüten.", "Biene, eine, an"]
                answer: "viele hundert Blüten am Tag"
                feedback:
                  "Eine Biene besucht an einem Tag viele hundert Blüten.": "Das ist ein ganzer Satz. Den würdest du nur ablesen. Schreib nur Stichwörter."
                hints:
                  - "Auf den Zettel kommen nur die wichtigsten Wörter."
                  - "Ein ganzer Satz ist zu lang. Kleine Wörter wie eine oder an lässt du weg."
                  - "viele hundert Blüten am Tag."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "In welchen Teil des Vortrags gehört der Satz?"
                say: "Sortiere die Sätze: Einleitung, Hauptteil oder Schluss?"
                bins:
                  - { id: intro, show: { text: "Einleitung" }, say: "Einleitung" }
                  - { id: main, show: { text: "Hauptteil" }, say: "Hauptteil" }
                  - { id: end, show: { text: "Schluss" }, say: "Schluss" }
                options:
                  - { text: "Heute erzähle ich euch etwas über Honigbienen.", bin: intro }
                  - { text: "Die Königin legt jeden Tag viele Eier.", bin: main }
                  - { text: "Habt ihr noch Fragen?", bin: end }
                option_audio: false
                hints:
                  - "Welcher Satz nennt das Thema? Welcher beendet den Vortrag?"
                  - "Die Einleitung nennt das Thema. Der Schluss fragt nach Fragen."
                  - "Heute erzähle ich: Einleitung. Die Königin: Hauptteil. Fragen: Schluss."
              - id: l1-f3
                type: multiple_choice
                text: "Welcher Anfang macht die Zuhörer neugierig?"
                say: "Welcher Anfang macht die Zuhörer am meisten neugierig?"
                options: ["Wusstet ihr, dass Bienen tanzen können?", "Ich mache meinen Vortrag über Bienen.", "Ähm, also, Bienen."]
                answer: "Wusstet ihr, dass Bienen tanzen können?"
                hints:
                  - "Neugierig wirst du, wenn du etwas Überraschendes hörst."
                  - "Eine Frage an die Zuhörer weckt Interesse."
                  - "Wusstet ihr, dass Bienen tanzen können?"
              - id: l1-f4
                type: multiple_choice
                text: "Thema: So leben Honigbienen.\n\nWelches Stichwort gehört nicht auf den Zettel?"
                say: "Das Thema ist: So leben Honigbienen. Welches Stichwort gehört nicht auf den Zettel?"
                options: ["mein Lieblingseis: Honig", "Arbeiterinnen sammeln Nektar", "Waben aus Wachs"]
                answer: "mein Lieblingseis: Honig"
                feedback:
                  "Waben aus Wachs": "Waben gehören zum Leben der Bienen. Sie bauen sie selbst."
                hints:
                  - "Prüfe jedes Stichwort: Passt es zum Thema?"
                  - "Das Thema ist das Leben der Bienen, nicht du."
                  - "Dein Lieblingseis gehört nicht dazu."
              - id: l1-f5
                type: ordering
                text: "Bring den Stichwortzettel in eine gute Reihenfolge."
                say: "Bring die Stichwörter in eine gute Reihenfolge: vom Anfang bis zum Schluss."
                options: ["Fragen?", "Thema: Honigbienen", "Arbeit im Bienenvolk", "Zusammenfassung"]
                slot_count: 4
                answer: ["Thema: Honigbienen", "Arbeit im Bienenvolk", "Zusammenfassung", "Fragen?"]
                option_audio: false
                hints:
                  - "Denk an Einleitung, Hauptteil und Schluss."
                  - "Zuerst das Thema, ganz am Ende die Fragen."
                  - "Thema, Arbeit, Zusammenfassung, Fragen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Füchse haben einen langen, buschigen Schwanz.\n\nWas schreibst du auf den Stichwortzettel?"
                say: "Lies den Satz. Was schreibst du auf den Stichwortzettel?"
                options: ["Schwanz: lang, buschig", "Füchse haben einen langen, buschigen Schwanz.", "haben einen"]
                answer: "Schwanz: lang, buschig"
                hints: ["Nur die wichtigsten Wörter, kein ganzer Satz."]
              - id: l1-s2
                type: sorting
                text: "In welchen Teil des Vortrags gehört der Satz?"
                say: "Sortiere die Sätze: Einleitung, Hauptteil oder Schluss?"
                bins:
                  - { id: intro, show: { text: "Einleitung" }, say: "Einleitung" }
                  - { id: main, show: { text: "Hauptteil" }, say: "Hauptteil" }
                  - { id: end, show: { text: "Schluss" }, say: "Schluss" }
                options:
                  - { text: "Mein Thema ist der Rotfuchs.", bin: intro }
                  - { text: "Füchse jagen vor allem Mäuse.", bin: main }
                  - { text: "Jetzt wisst ihr, wie der Fuchs lebt.", bin: end }
                option_audio: false
                hints: ["Welcher Satz fasst am Ende zusammen?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welcher Anfang macht die Zuhörer neugierig?"
                say: "Welcher Anfang macht die Zuhörer am meisten neugierig?"
                options: ["Habt ihr schon einmal nachts einen Fuchs bellen hören?", "Mein Vortrag ist über Füchse.", "Also, ich fange jetzt an."]
                answer: "Habt ihr schon einmal nachts einen Fuchs bellen hören?"
                hints: ["Welcher Satz spricht die Zuhörer an?"]
              - id: l1-s4
                type: multiple_choice
                text: "Thema: So lebt der Rotfuchs.\n\nWelches Stichwort gehört nicht auf den Zettel?"
                say: "Das Thema ist: So lebt der Rotfuchs. Welches Stichwort gehört nicht auf den Zettel?"
                options: ["Fuchs im Märchen: schlau", "Bau unter der Erde", "Futter: Mäuse, Beeren"]
                answer: "Fuchs im Märchen: schlau"
                hints: ["Geht es um den echten Fuchs oder um eine Geschichte?"]
              - id: l1-s5
                type: ordering
                text: "Bring die Teile des Vortrags in die richtige Reihenfolge."
                say: "Bring die Teile in die richtige Reihenfolge."
                options: ["Hauptteil", "Schluss", "Einleitung"]
                slot_count: 3
                answer: ["Einleitung", "Hauptteil", "Schluss"]
                option_audio: false
                hints: ["Womit fängt jeder Vortrag an?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Im Winter wird das Fell des Fuchses dichter und wärmer.\n\nWas schreibst du auf den Stichwortzettel?"
                say: "Lies den Satz. Was schreibst du auf den Stichwortzettel?"
                options: ["Winter: dichteres Fell", "Im Winter wird das Fell des Fuchses dichter und wärmer.", "wird das"]
                answer: "Winter: dichteres Fell"
              - id: l1-n2
                type: sorting
                text: "In welchen Teil des Vortrags gehört der Satz?"
                say: "Sortiere die Sätze: Einleitung, Hauptteil oder Schluss?"
                bins:
                  - { id: intro, show: { text: "Einleitung" }, say: "Einleitung" }
                  - { id: main, show: { text: "Hauptteil" }, say: "Hauptteil" }
                  - { id: end, show: { text: "Schluss" }, say: "Schluss" }
                options:
                  - { text: "Ich möchte euch heute den Igel vorstellen.", bin: intro }
                  - { text: "Igel fressen Käfer, Würmer und Schnecken.", bin: main }
                  - { text: "Danke fürs Zuhören!", bin: end }
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Auf den Stichwortzettel schreibst du den ganzen Vortrag Wort für Wort. Stimmt das?"
                say: "Auf den Stichwortzettel schreibst du den ganzen Vortrag Wort für Wort. Stimmt das?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Thema: Der Igel im Winter.\n\nWelches Stichwort gehört nicht auf den Zettel?"
                say: "Das Thema ist: Der Igel im Winter. Welches Stichwort gehört nicht auf den Zettel?"
                options: ["Igel als Kuscheltier", "Winterschlaf im Laubhaufen", "Herz schlägt langsam"]
                answer: "Igel als Kuscheltier"
              - id: l1-n5
                type: ordering
                text: "Bring den Stichwortzettel in eine gute Reihenfolge."
                say: "Bring die Stichwörter in eine gute Reihenfolge: vom Anfang bis zum Schluss."
                options: ["Futter: Mäuse, Beeren", "Danke fürs Zuhören", "Thema: der Rotfuchs", "kurz zusammenfassen"]
                slot_count: 4
                answer: ["Thema: der Rotfuchs", "Futter: Mäuse, Beeren", "kurz zusammenfassen", "Danke fürs Zuhören"]
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Bienen bauen ihre Waben aus Wachs.\n\nWas schreibst du auf den Stichwortzettel?"
            say: "Lies den Satz. Was schreibst du auf den Stichwortzettel?"
            options: ["Waben aus Wachs", "Bienen bauen ihre Waben aus Wachs.", "bauen ihre"]
            answer: "Waben aus Wachs"
          - id: l1-c5
            type: ordering
            text: "Bring die Teile des Vortrags in die richtige Reihenfolge."
            say: "Bring die Teile des Vortrags in die richtige Reihenfolge."
            options: ["Schluss: zusammenfassen", "Einleitung: Thema nennen", "Hauptteil: das Wichtigste"]
            slot_count: 3
            answer: ["Einleitung: Thema nennen", "Hauptteil: das Wichtigste", "Schluss: zusammenfassen"]
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "In welchen Teil des Vortrags gehört: „Habt ihr noch Fragen?“"
            say: "In welchen Teil des Vortrags gehört der Satz: Habt ihr noch Fragen?"
            options: ["Schluss", "Einleitung", "Hauptteil"]
            answer: "Schluss"
          - id: l1-c3
            type: multiple_choice
            text: "Thema: Wie Bienen Honig machen.\n\nWelches Stichwort gehört nicht auf den Zettel?"
            say: "Das Thema ist: Wie Bienen Honig machen. Welches Stichwort gehört nicht auf den Zettel?"
            options: ["Wespen auf dem Kuchen", "Nektar aus Blüten", "Honig in den Waben"]
            answer: "Wespen auf dem Kuchen"
          - id: l1-c6
            type: true_false
            text: "Thema: Wie Bienen leben. Das Stichwort „Bienen bestäuben Blüten“ passt zum Thema. Stimmt das?"
            say: "Das Thema ist: Wie Bienen leben. Das Stichwort Bienen bestäuben Blüten passt zum Thema. Stimmt das?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Igel sind nachts unterwegs und schlafen am Tag.\n\nWas schreibst du auf den Stichwortzettel?"
            say: "Lies den Satz. Was schreibst du auf den Stichwortzettel?"
            options: ["Igel sind nachts unterwegs und schlafen am Tag.", "nachts unterwegs, tagsüber Schlaf", "sind und am"]
            answer: "nachts unterwegs, tagsüber Schlaf"

  - n: 2
    title: { de: "Den Vortrag halten", en: "Giving the talk" }
    goal:
      de: "Halte deinen Vortrag frei. Schau kurz auf ein Stichwort, dann schau deine Zuhörer an und erzähl in ganzen Sätzen."
      en: "Give your talk without reading it out. Glance at a key word, then look at your audience and speak in whole sentences."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            text: "Bring die Teile des Vortrags in die richtige Reihenfolge."
            say: "Bring die Teile des Vortrags in die richtige Reihenfolge."
            options: ["Schluss", "Einleitung", "Hauptteil"]
            slot_count: 3
            answer: ["Einleitung", "Hauptteil", "Schluss"]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Auf den Stichwortzettel schreibst du nur wenige wichtige Wörter. Stimmt das?"
            say: "Auf den Stichwortzettel schreibst du nur wenige wichtige Wörter. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Kai hält den Zettel vors Gesicht und liest alles ab."
            say: "Kai hält seinen Vortrag über Bienen. Er hält den Zettel vors Gesicht und liest jedes Wort ab. Was glaubst du: Hört die Klasse ihm gern zu?"
          - text: "Stichwort: Tanz zeigt Futterplatz\n\nGesagt: Wenn eine Biene viele Blüten gefunden hat, tanzt sie im Stock. So zeigt sie den anderen, wo das Futter ist."
            say: "Eher nicht, denn niemand sieht sein Gesicht! So geht es besser: Beim Vortrag schaust du kurz auf ein Stichwort. Dann schaust du hoch und erzählst in ganzen Sätzen. Das heißt: frei sprechen."
          - text: "Blickkontakt | ein Bild zeigen | ruhig und laut genug"
            say: "Schau deine Zuhörer an, nicht nur deinen Zettel. Ein Bild oder ein Plakat hilft allen, sich das Thema vorzustellen. Sprich ruhig und laut genug."
          - text: "Das hat mir gefallen: … \nEin Tipp für dich: …"
            say: "Nach dem Vortrag geben die Zuhörer eine Rückmeldung. Zuerst sagen sie, was gut war. Dann geben sie einen freundlichen Tipp."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wer spricht frei?"
                say: "Drei Kinder halten ihren Vortrag. Wer spricht frei?"
                options: ["Jonas schaut kurz auf seine Stichwörter und spricht dann zur Klasse.", "Mara liest ihren Text Wort für Wort vom Blatt ab.", "Kai hält den Zettel vors Gesicht und murmelt."]
                answer: "Jonas schaut kurz auf seine Stichwörter und spricht dann zur Klasse."
                feedback:
                  "Mara liest ihren Text Wort für Wort vom Blatt ab.": "Wer abliest, spricht nicht frei und schaut die Zuhörer nicht an."
                hints:
                  - "Frei sprechen heißt: nicht ablesen."
                  - "Wer schaut die Klasse an?"
                  - "Jonas spricht frei."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Stichwort: Arbeiterinnen sammeln Nektar\n\nWelchen Satz sagst du dazu?"
                say: "Lies das Stichwort. Welchen Satz sagst du dazu im Vortrag?"
                options: ["Die Arbeiterinnen fliegen von Blüte zu Blüte und sammeln süßen Nektar.", "Arbeiterinnen sammeln Nektar.", "Die Königin schläft den ganzen Tag."]
                answer: "Die Arbeiterinnen fliegen von Blüte zu Blüte und sammeln süßen Nektar."
                hints:
                  - "Aus dem Stichwort machst du einen ganzen, lebendigen Satz."
                  - "Der Satz muss zum Stichwort passen und mehr erzählen."
                  - "Die Arbeiterinnen fliegen von Blüte zu Blüte und sammeln süßen Nektar."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Rückmeldung ist fair und hilfreich?"
                say: "Lena hat ihren Vortrag gehalten. Welche Rückmeldung ist fair und hilfreich?"
                options: ["Dein Bild war toll. Ein Tipp: Sprich etwas lauter.", "Das war langweilig.", "Gut."]
                answer: "Dein Bild war toll. Ein Tipp: Sprich etwas lauter."
                hints:
                  - "Eine gute Rückmeldung hat zwei Teile."
                  - "Zuerst etwas Gutes, dann ein freundlicher Tipp."
                  - "Dein Bild war toll. Ein Tipp: Sprich etwas lauter."
              - id: l2-f4
                type: sorting
                text: "Hilft das beim Vortrag?"
                say: "Sortiere: Hilft das beim Vortrag oder nicht?"
                bins:
                  - { id: helps, show: { text: "hilft" }, say: "hilft" }
                  - { id: hinders, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "die Zuhörer anschauen", bin: helps }
                  - { text: "ein Foto zum Thema zeigen", bin: helps }
                  - { text: "mit dem Rücken zur Klasse stehen", bin: hinders }
                  - { text: "so schnell wie möglich fertig werden", bin: hinders }
                option_audio: false
                hints:
                  - "Stell dir vor, du bist Zuhörer."
                  - "Wer mit dem Rücken zur Klasse steht, wird schlecht verstanden."
                  - "Anschauen und Foto helfen."
              - id: l2-f5
                type: speak
                text: "Wusstet ihr, dass Bienen tanzen können? Heute erzähle ich euch etwas über Honigbienen."
                say: "Übe den Anfang deines Vortrags. Sprich laut und deutlich und schau dabei hoch. Dann hörst du dich und das Vorbild."
                expected_text: "Wusstet ihr, dass Bienen tanzen können? Heute erzähle ich euch etwas über Honigbienen."
                hints:
                  - "Die Frage am Anfang macht neugierig. Lass die Stimme am Ende hochgehen."
                  - "Mach nach der Frage eine kleine Pause."
                  - "Hör das Vorbild an und sag es noch einmal."

          - support: some
            tasks:
