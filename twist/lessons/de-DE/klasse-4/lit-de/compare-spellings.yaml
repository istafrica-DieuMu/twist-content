# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.compare-spellings
skill: lit-de.spelling-strategies.compare-spellings
curriculum: de-DE
language: de
title:
  de: Schreibungen vergleichen und erklären
  en: Comparing and explaining spellings
summary: >
  Comparing words to see why they are spelt the way they are. Lesson 1
  compares a word with a related or rhyming word (Hund and Hunde, Rad and
  Räder, Baum and Traum) and picks the explanation; lesson 2 compares two
  children's spellings of one word, says who is right and why, sorts words
  by the strategy that explains them, and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Fehler berichtigen, en: Correcting mistakes }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling-strategies.choose-strategy]
  also_practises: [lit-de.spelling-strategies.correct-errors]
  vocabulary: { de: [vergleichen, erklären, Beweiswort, verlängern, ableiten, Wortfamilie, kurzer Selbstlaut, doppelter Mitlaut] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: lengthen, what: { de: "das Wortende durch Verlängern erklären (Hund, Hunde)", en: "explaining the end of a word by lengthening it (Hund, Hunde)" } }
    - { id: derive, what: { de: "ä und äu durch Ableiten erklären (Räder, Rad)", en: "explaining ä and äu by finding the related word (Räder, Rad)" } }
    - { id: short-vowel, what: { de: den doppelten Mitlaut nach einem kurzen Selbstlaut erklären, en: explaining a double consonant after a short vowel } }
    - { id: choose, what: { de: die passende Erklärung für verschiedene Wörter wählen, en: choosing the right explanation for different words } }
    - { id: who-is-right, what: { de: "zwei Schreibungen vergleichen und sagen, wer recht hat", en: comparing two spellings and saying which is right } }
  misconceptions:
    - id: explain-by-sound
      what: Explains a spelling by what is heard at the end of the word (Wand mit d, weil man d hört)
      addressed: lesson 1 Learn shows that the related word proves the letter; true_false tasks in every stage of lesson 1 test a sound-only explanation (l1-s4), with feedback in l1-f1 and l1-n5
    - id: reason-without-proof
      what: Says who is right but cannot name the strategy or the word that proves it
      addressed: lesson 2 Learn names strategy and proof word together; every "Wer hat recht, und warum?" task offers the right child with a wrong reason, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Warum schreibt man das so?", en: "Why is it spelt like that?" }
    goal:
      de: "Vergleich Wörter wie Hund und Hunde und erklär so, warum ein Wort so geschrieben wird."
      en: "Compare words like Hund and Hunde to explain why a word is spelt the way it is."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Strategie hilft bei Zwerg?"
            say: "Zwerg. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
            options: ["Verlängern", "Ableiten", "Merken"]
            answer: "Verlängern"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Strategie hilft bei Häuser?"
            say: "Häuser. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
            options: ["Ableiten", "Verlängern", "Schwingen"]
            answer: "Ableiten"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Raum · Baum · Traum · Schaum"
            say: "Vergleiche diese Wörter. Sie reimen sich und werden am Ende gleich geschrieben, mit aum. Kannst du eins, kannst du die anderen auch."
          - text: "Hund → Hunde"
            say: "Vergleiche Hund und Hunde. Am Ende von Hund hörst du ein t. In Hunde hörst du ein d. Darum schreibst du Hund mit d. Hunde ist dein Beweiswort."
          - text: "Rad → Räder · Baum → Bäume"
            say: "Vergleiche Räder mit Rad. Räder kommt von Rad, darum schreibst du ä. So erklärst du, warum ein Wort so geschrieben wird: mit der Strategie und dem Beweiswort."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Warum schreibt man Hund mit d?"
                options: ["Weil man in Hunde ein d hört.", "Weil man am Ende ein d hört.", "Weil Hund ein Nomen ist."]
                answer: "Weil man in Hunde ein d hört."
                feedback:
                  "Weil man am Ende ein d hört.": "Sprich Hund deutlich. Am Ende hörst du ein t. Erst beim Verlängern hörst du das d: Hunde."
                hints:
                  - "Welche Strategie hilft bei d oder t am Ende?"
                  - "Verlängere das Wort: ein Hund, zwei ..."
                  - "In Hunde hörst du ein d."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Du weißt, wie man Baum schreibt. Wie schreibst du das Weiße auf dem Kakao?"
                say: "Du weißt, wie man Baum schreibt. Wie schreibst du den Schaum auf dem Kakao?"
                options: ["Schaum", "Schaom", "Schoum"]
                answer: "Schaum"
                option_audio: false
                hints:
                  - "Reimt sich das Wort auf Baum?"
                  - "Baum und Schaum klingen am Ende gleich."
                  - "Schaum, wie Baum mit aum."
              - id: l1-f3
                type: matching
                text: "Welche Erklärung passt zu welchem Wort?"
                say: "Verbinde jedes Wort mit der Erklärung für seine Schreibung."
                pairs:
                  - { left: { text: "Berg" }, right: { text: "verlängern: Berge" } }
                  - { left: { text: "Hände" }, right: { text: "ableiten: Hand" } }
                  - { left: { text: "Sonne" }, right: { text: "kurzer Selbstlaut: nn" } }
                hints:
                  - "Bei welchem Wort ist das Ende schwierig, bei welchem das ä?"
                  - "Hände hat ein ä. Welches verwandte Wort hat ein a?"
                  - "Berg: Berge. Hände: Hand. Sonne: nn nach dem kurzen o."
              - id: l1-f4
                type: true_false
                text: "„Kälte schreibt man mit ä, weil es von kalt kommt.“ Stimmt die Erklärung?"
                say: "Kälte schreibt man mit ä, weil es von kalt kommt. Stimmt die Erklärung?"
                answer: true
                hints:
                  - "Gehören Kälte und kalt zu einer Wortfamilie?"
                  - "Kalt hat ein a. Daraus wird ä."
                  - "Ja, die Erklärung stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Gold oder Golt? Welche Erklärung hilft?"
                say: "Schreibt man Gold mit d oder mit t? Welche Erklärung hilft?"
                options: ["Verlängern: golden", "Ableiten: gelb", "Merken: Gold ist ein Merkwort"]
                answer: "Verlängern: golden"
                hints:
                  - "Die schwierige Stelle ist am Ende."
                  - "Bilde ein längeres Wort: der goldene Ring."
                  - "In golden hörst du ein d."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Warum schreibt man Räder mit ä?"
                options: ["Weil es von Rad kommt.", "Weil man ein e hört.", "Weil es ein Merkwort ist."]
                answer: "Weil es von Rad kommt."
                hints: ["Gibt es ein verwandtes Wort mit a?"]
              - id: l1-s2
                type: multiple_choice
                text: "Du weißt, wie man Kanne schreibt. Wie schreibst du den Nadelbaum?"
                say: "Du weißt, wie man Kanne schreibt. Wie schreibst du den Nadelbaum Tanne?"
                options: ["Tanne", "Tane", "Thanne"]
                answer: "Tanne"
                option_audio: false
                hints: ["Kanne und Tanne reimen sich."]
              - id: l1-s3
                type: matching
                text: "Welche Erklärung passt zu welchem Wort?"
                say: "Verbinde jedes Wort mit der Erklärung für seine Schreibung."
                pairs:
                  - { left: { text: "Korb" }, right: { text: "verlängern: Körbe" } }
                  - { left: { text: "Häuser" }, right: { text: "ableiten: Haus" } }
                  - { left: { text: "Teller" }, right: { text: "kurzer Selbstlaut: ll" } }
                hints: ["Schau, wo die schwierige Stelle ist: am Ende, beim äu oder nach dem kurzen e."]
              - id: l1-s4
                type: true_false
                text: "„Wand schreibt man mit d, weil man am Ende ein d hört.“ Stimmt die Erklärung?"
                say: "Wand schreibt man mit d, weil man am Ende ein d hört. Stimmt die Erklärung?"
                answer: false
                hints: ["Sprich Wand deutlich. Was hörst du am Ende wirklich?"]
              - id: l1-s5
                type: multiple_choice
                text: "Vergleiche Leute und Läuse. Warum schreibt man Läuse mit äu?"
                options: ["Weil es von Laus kommt.", "Weil man eu hört.", "Weil es sich auf Leute reimt."]
                answer: "Weil es von Laus kommt."
                hints: ["Wie heißt es, wenn es nur ein Tier ist?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Warum schreibt man Zwerg mit g?"
                options: ["Weil man in Zwerge ein g hört.", "Weil man am Ende ein k hört.", "Weil es ein Merkwort ist."]
                answer: "Weil man in Zwerge ein g hört."
              - id: l1-n2
                type: multiple_choice
                text: "Du weißt, wie man Katze schreibt. Wie schreibst du die Pfote eines Bären?"
                say: "Du weißt, wie man Katze schreibt. Wie schreibst du die Tatze eines Bären?"
                options: ["Tatze", "Taze", "Tatse"]
                answer: "Tatze"
                option_audio: false
              - id: l1-n3
                type: matching
                text: "Welche Erklärung passt zu welchem Wort?"
                say: "Verbinde jedes Wort mit der Erklärung für seine Schreibung."
                pairs:
                  - { left: { text: "Kind" }, right: { text: "verlängern: Kinder" } }
                  - { left: { text: "Äste" }, right: { text: "ableiten: Ast" } }
                  - { left: { text: "Puppe" }, right: { text: "kurzer Selbstlaut: pp" } }
              - id: l1-n4
                type: true_false
                text: "„Blätter schreibt man mit ä, weil es von Blatt kommt.“ Stimmt die Erklärung?"
                say: "Blätter schreibt man mit ä, weil es von Blatt kommt. Stimmt die Erklärung?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Vergleiche Feld und Welt. Warum endet Feld mit d, Welt aber mit t?"
                options: ["In Felder hört man d, in Welten hört man t.", "Feld ist kürzer als Welt.", "Bei Feld hört man am Ende ein d."]
                answer: "In Felder hört man d, in Welten hört man t."
                feedback:
                  "Bei Feld hört man am Ende ein d.": "Am Ende klingen beide Wörter gleich, mit t. Erst das Verlängern zeigt den Unterschied."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Warum schreibt man Bäume mit äu?"
            options: ["Weil es von Baum kommt.", "Weil man oi hört.", "Weil es ein Merkwort ist."]
            answer: "Weil es von Baum kommt."
          - id: l1-c2
            type: matching
            text: "Welche Erklärung passt zu welchem Wort?"
            say: "Verbinde jedes Wort mit der Erklärung für seine Schreibung."
            pairs:
              - { left: { text: "Bild" }, right: { text: "verlängern: Bilder" } }
              - { left: { text: "Gläser" }, right: { text: "ableiten: Glas" } }
              - { left: { text: "Mutter" }, right: { text: "kurzer Selbstlaut: tt" } }
          - id: l1-c3
            type: true_false
            text: "„Sand schreibt man mit d, weil man in sandig ein d hört.“ Stimmt die Erklärung?"
            say: "Sand schreibt man mit d, weil man in sandig ein d hört. Stimmt die Erklärung?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Du weißt, wie man Hose schreibt. Wie schreibst du die Blume, die sich darauf reimt?"
            say: "Du weißt, wie man Hose schreibt. Wie schreibst du die Blume Rose?"
            options: ["Rose", "Rohse", "Roose"]
            answer: "Rose"
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Welches Wort beweist das ä in Kälber?"
            options: ["Kalb", "kalt", "Keller"]
            answer: "Kalb"
          - id: l1-c6
            type: true_false
            text: "„Laub schreibt man mit b, weil es ein kurzes Wort ist.“ Stimmt die Erklärung?"
            say: "Laub schreibt man mit b, weil es ein kurzes Wort ist. Stimmt die Erklärung?"
            answer: false

  - n: 2
    title: { de: "Wer hat recht?", en: "Who is right?" }
    goal:
      de: "Vergleich, wie zwei Kinder ein Wort schreiben, und sag, wer recht hat. Bälle kommt von Ball, also hat Mia recht."
      en: "Compare how two children spell a word and say who is right. Bälle comes from Ball, so Mia is right."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Warum schreibt man Korb mit b?"
            options: ["Weil man in Körbe ein b hört.", "Weil man am Ende ein p hört.", "Weil Korb ein kurzes Wort ist."]
            answer: "Weil man in Körbe ein b hört."
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Du weißt, wie man Hund schreibt. Wie schreibst du rund?"
            say: "Du weißt, wie man Hund schreibt. Wie schreibst du das Wort rund, wie ein runder Ball?"
            options: ["rund", "runt", "rundt"]
            answer: "rund"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mia: Bälle\nBen: Belle"
            say: "Mia und Ben schreiben dasselbe Wort verschieden. Vergleiche die beiden Schreibungen. Bälle kommt von Ball. Darum hat Mia recht."
          - text: "Bälle, weil es von Ball kommt."
            say: "Eine gute Erklärung hat zwei Teile: die Strategie, hier Ableiten, und das Beweiswort, hier Ball."
          - text: "verlängern: Hund, Kind, Berg\nableiten: Bälle, Häuser\nkurzer Selbstlaut: Sonne, Ball"
            say: "Wörter mit derselben Erklärung kannst du sammeln. So siehst du schnell, welche Strategie zu welchem Wort passt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Mia schreibt Gläser, Ben schreibt Gleser. Wer hat recht, und warum?"
                options: ["Mia, denn es kommt von Glas.", "Mia, denn Gläser ist ein langes Wort.", "Ben, denn man hört ein e."]
                answer: "Mia, denn es kommt von Glas."
                feedback:
                  "Mia, denn Gläser ist ein langes Wort.": "Mia hat recht, aber der Grund stimmt nicht. Das Beweiswort ist Glas."
                  "Ben, denn man hört ein e.": "Ä und e klingen fast gleich. Das verwandte Wort Glas zeigt, dass es ä sein muss."
                hints:
                  - "Gibt es ein verwandtes Wort mit a?"
                  - "Ein Glas, zwei ..."
                  - "Mia hat recht: Gläser kommt von Glas."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Welche Strategie erklärt die Schreibung?"
                say: "Sortiere die Wörter nach der Erklärung für ihre Schreibung."
                bins:
                  - { id: long, show: { text: "verlängern" }, say: "verlängern" }
                  - { id: derive, show: { text: "ableiten" }, say: "ableiten" }
                  - { id: double, show: { text: "kurzer Selbstlaut" }, say: "kurzer Selbstlaut" }
                options:
                  - { text: "Kind", bin: long }
                  - { text: "Hände", bin: derive }
                  - { text: "Kissen", bin: double }
                  - { text: "Zug", bin: long }
                  - { text: "Läufer", bin: derive }
                  - { text: "Wasser", bin: double }
                hints:
                  - "Schau bei jedem Wort, wo die schwierige Stelle ist."
                  - "Am Ende: verlängern. Ein ä oder äu: ableiten. Zwei gleiche Mitlaute: kurzer Selbstlaut."
                  - "Kind und Zug: verlängern. Hände und Läufer: ableiten. Kissen und Wasser: kurzer Selbstlaut."
              - id: l2-f3
                type: multiple_choice
                text: "Alle Wörter bis auf eins erklärst du mit Verlängern. Welches passt nicht?"
                options: ["Bäume", "Hund", "Korb", "Weg"]
                answer: "Bäume"
                hints:
                  - "Bei welchem Wort ist die schwierige Stelle nicht am Ende?"
                  - "Hund, Korb, Weg: d, b, g am Ende. Und Bäume?"
                  - "Bäume erklärst du mit Ableiten: Baum."
              - id: l2-f4
                type: true_false
                text: "Tim schreibt Fahrad. Er sagt: „Man hört nur ein r, also schreibt man nur eins.“ Stimmt das?"
                say: "Tim schreibt Fahrrad mit einem r. Er sagt: Man hört nur ein r, also schreibt man nur eins. Stimmt das?"
                answer: false
                hints:
                  - "Aus welchen zwei Wörtern besteht Fahrrad?"
                  - "fahren und Rad."
                  - "Nein. Fahr und Rad treffen sich, darum stehen zwei r."
              - id: l2-f5
                type: multiple_choice
                text: "Sara schreibt Zelt, Paul schreibt Zeld. Wer hat recht, und warum?"
                options: ["Sara, denn in Zelte hört man t.", "Paul, denn Feld hat auch ein d.", "Paul, denn am Ende hört man d."]
                answer: "Sara, denn in Zelte hört man t."
                hints:
                  - "Verlängere das Wort."
                  - "Ein Zelt, zwei ..."
                  - "In Zelte hörst du ein t. Sara hat recht."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ole schreibt Mäuse, Ida schreibt Meuse. Wer hat recht, und warum?"
                options: ["Ole, denn es kommt von Maus.", "Ida, denn man hört eu.", "Ida, denn es reimt sich auf Leute."]
                answer: "Ole, denn es kommt von Maus."
                hints: ["Wie heißt es, wenn es nur ein Tier ist?"]
              - id: l2-s2
                type: sorting
                text: "Welche Strategie erklärt die Schreibung?"
                say: "Sortiere die Wörter nach der Erklärung für ihre Schreibung."
                bins:
                  - { id: long, show: { text: "verlängern" }, say: "verlängern" }
                  - { id: derive, show: { text: "ableiten" }, say: "ableiten" }
                  - { id: double, show: { text: "kurzer Selbstlaut" }, say: "kurzer Selbstlaut" }
                options:
                  - { text: "Kleid", bin: long }
                  - { text: "Wälder", bin: derive }
                  - { text: "Wolle", bin: double }
                  - { text: "Sieb", bin: long }
                  - { text: "Träume", bin: derive }
                  - { text: "Himmel", bin: double }
                hints: ["Schau bei jedem Wort, wo die schwierige Stelle ist."]
              - id: l2-s3
                type: multiple_choice
                text: "Alle Wörter bis auf eins erklärst du mit Ableiten. Welches passt nicht?"
                options: ["Brett", "Gläser", "Räuber", "Kälte"]
                answer: "Brett"
                hints: ["Welches Wort hat kein ä und kein äu?"]
              - id: l2-s4
                type: true_false
                text: "Jan schreibt Brille mit ll. Er sagt: „Nach dem kurzen i stehen zwei l.“ Stimmt die Erklärung?"
                say: "Jan schreibt Brille mit zwei l. Er sagt: Nach dem kurzen i stehen zwei l. Stimmt die Erklärung?"
                answer: true
                hints: ["Sprich Brille langsam: Ist das i kurz oder lang?"]
              - id: l2-s5
                type: multiple_choice
                text: "Emma und Leo schreiben das Wort für den Gegenstand, mit dem man sich die Haare kämmt. Emma schreibt Kamm, Leo schreibt Kam. Wer hat recht, und warum?"
                options: ["Emma, denn nach dem kurzen a stehen zwei m.", "Leo, denn man hört nur ein m.", "Leo, denn kam ist ein Verb."]
                answer: "Emma, denn nach dem kurzen a stehen zwei m."
                hints: ["Ist das a in Kamm kurz oder lang?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Lukas schreibt Blat, Nora schreibt Blatt. Wer hat recht, und warum?"
                options: ["Nora, denn nach dem kurzen a stehen zwei t.", "Lukas, denn man hört nur ein t.", "Lukas, denn kurze Wörter haben nur ein t."]
                answer: "Nora, denn nach dem kurzen a stehen zwei t."
              - id: l2-n2
                type: sorting
                text: "Welche Strategie erklärt die Schreibung?"
                say: "Sortiere die Wörter nach der Erklärung für ihre Schreibung."
                bins:
                  - { id: long, show: { text: "verlängern" }, say: "verlängern" }
                  - { id: derive, show: { text: "ableiten" }, say: "ableiten" }
                  - { id: double, show: { text: "kurzer Selbstlaut" }, say: "kurzer Selbstlaut" }
                options:
                  - { text: "Wind", bin: long }
                  - { text: "Zähne", bin: derive }
                  - { text: "Tasse", bin: double }
                  - { text: "Dieb", bin: long }
                  - { text: "Bäuche", bin: derive }
                  - { text: "Kette", bin: double }
              - id: l2-n3
                type: multiple_choice
                text: "Alle Wörter bis auf eins erklärst du mit dem kurzen Selbstlaut. Welches passt nicht?"
                options: ["Hand", "Sonne", "Ball", "Kette"]
                answer: "Hand"
              - id: l2-n4
                type: true_false
                text: "Mira schreibt Fahrrad mit rr. Sie sagt: „Es besteht aus fahren und Rad.“ Stimmt die Erklärung?"
                say: "Mira schreibt Fahrrad mit zwei r. Sie sagt: Es besteht aus fahren und Rad. Stimmt die Erklärung?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Finn schreibt Burk, Ella schreibt Burg. Wer hat recht, und warum?"
                options: ["Ella, denn in Burgen hört man g.", "Finn, denn am Ende hört man k.", "Ella, denn Burg ist ein Nomen."]
                answer: "Ella, denn in Burgen hört man g."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: who-is-right
            type: multiple_choice
            text: "Max schreibt Wälder, Lina schreibt Welder. Wer hat recht, und warum?"
            options: ["Max, denn es kommt von Wald.", "Lina, denn man hört ein e.", "Max, denn Wälder ist ein Nomen."]
            answer: "Max, denn es kommt von Wald."
          - id: l2-c2
            part: choose
            type: sorting
            text: "Wie erklärst du die Schreibung?"
            say: "Ordne jedes Wort der Strategie zu, die seine Schreibung erklärt."
            bins:
