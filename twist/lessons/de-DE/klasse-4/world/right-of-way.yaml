# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.right-of-way
skill: world.space.right-of-way
curriculum: de-DE
language: de
title:
  de: Wer hat Vorfahrt?
  en: Who has right of way?
summary: >
  Lina practises for the Radfahrausbildung with her Opa in the streets
  round her house; the child is the cyclist on a junction drawn from
  above (green is grass, grey is road, "Du" always comes from the bottom,
  letters are the others, arrows show that everyone goes straight on). Lesson 1 is rechts
  vor links (StVO § 8) at crossroads and T-junctions with no sign and no
  lights, for cars and bikes alike, with two and three road users; coming
  out of a driveway or over a lowered kerb you let everyone go first
  (§ 10); having right of way never means going regardless: eye contact,
  and if in doubt, wait. Lesson 2 is the signs: Vorfahrtstraße (yellow
  diamond, right of way at every junction until it ends), Vorfahrt an der
  nächsten Kreuzung (red-bordered triangle with a thick black upright
  stroke and a thin crossbar, at the next junction only), Vorfahrt
  gewähren (triangle on its point: let everyone on the other road go,
  from left and right) and Stopp (stop completely, even when nobody
  comes); a working traffic light goes before signs, signs before rechts
  vor links, and a police officer's signals before everything. It ends
  with the skill check.
metadata:
  year: klasse-4
  topic: { de: Mit dem Fahrrad unterwegs, en: Out on a bike }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [world.space.traffic-signs-basic, world.space.left-right-position]
  also_practises: [world.space.traffic-signs-basic]
  vocabulary: { de: [Vorfahrt, rechts vor links, Kreuzung, Einmündung, Einfahrt, abgesenkter Bordstein, Blickkontakt, Vorfahrtstraße, Raute, Vorfahrt an der nächsten Kreuzung, Vorfahrt gewähren, Stoppschild, Ampel] }
  forms: [text, audio, drawn]
  drawn: [junction]
  facets: []
  parts:
    - { id: right-before-left, what: { de: "an Kreuzungen und Einmündungen ohne Schild rechts vor links anwenden und wissen, dass man aus einer Einfahrt alle vorlässt", en: "applying give way to the right at junctions with no sign, and letting everyone go first when coming out of a driveway" } }
    - { id: signs, what: { de: "Vorfahrtstraße, Vorfahrt an der nächsten Kreuzung, Vorfahrt gewähren und Stopp erkennen und befolgen", en: "recognising and obeying the priority road, priority at the next junction, give way and stop signs" } }
    - { id: rank-care, what: { de: "wissen, dass die Ampel vor dem Schild und das Schild vor rechts vor links gilt, und auch mit Vorfahrt vorsichtig fahren", en: "knowing that lights go before signs and signs before give way to the right, and riding carefully even with right of way" } }
  misconceptions:
    - id: right-of-way-is-left
      what: Lets the road user on the left go first, or mixes up right and left when seen from above
      addressed: "lesson 1 Learn shows how to read the picture from the cyclist's seat; l1-f1, l1-f2, l1-s5, l1-c4 and l2-c1, l2-c3 test it"
    - id: insist-on-priority
      what: Thinks having right of way means riding on whatever the other driver does
      addressed: "lessons 1 and 2 Learn say eye contact and, if in doubt, wait; l1-f5, l1-n5, l2-n4 and l2-c18 test it, with feedback on l1-f5"
    - id: give-way-only-right
      what: Thinks Vorfahrt gewähren means letting only traffic from the right go, so rechts vor links still applies
      addressed: "lesson 2 Learn says everyone on the other road, from left and right; l2-f2, l2-s1 and l2-c9, l2-c14 test it, with feedback on l2-f2"
    - id: rolling-stop
      what: Thinks you may roll on slowly at a Stoppschild when nobody comes
      addressed: "lesson 2 Learn says stop completely even when the road is empty; l2-f3, l2-s4 and l2-c12 test it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Rechts vor links", en: "Give way to the right" }
    goal:
      de: "Finde heraus, wer an einer Kreuzung ohne Schild zuerst fahren darf. Wer von rechts kommt, hat Vorfahrt."
      en: "Find out who may go first at a junction with no sign. Whoever comes from the right has right of way."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Schild ist ein rotes Achteck?"
            options: ["das Stoppschild", "das Schild Radweg", "das Schild Haltestelle"]
            answer: "das Stoppschild"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Wenn du mit dem Fahrrad nach vorne fährst, ist rechts auf der Seite deiner rechten Hand. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lina kommt mit dem Rad an eine Kreuzung. Es gibt kein Schild und keine Ampel. Von rechts kommt ein Auto.\n\nWer darf zuerst fahren?"
            say: "Lina fährt mit dem Rad durch ihre Siedlung. Sie kommt an eine Kreuzung. Es gibt kein Schild und keine Ampel. Von rechts kommt ein Auto. Was glaubst du: Wer darf zuerst fahren, Lina oder das Auto?"
            show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: east, go: straight, label: "A" }] }
          - text: "Das Auto! Ohne Schild und ohne Ampel gilt: rechts vor links."
            say: "Das Auto darf zuerst! An Kreuzungen und Einmündungen ohne Schild und ohne Ampel gilt: rechts vor links. Wer von rechts kommt, hat Vorfahrt. Lina wartet, bis das Auto vorbei ist. Die Regel gilt für alle, für Autos genauso wie für Fahrräder."
            show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: east, go: straight, label: "A" }] }
          - text: "So liest du das Bild: Grün ist Wiese, grau ist die Straße. Du kommst immer von unten. Die Pfeile zeigen: Alle fahren geradeaus."
            say: "So liest du die Bilder: Die Kreuzung ist von oben gezeichnet. Grün ist Wiese, grau ist die Straße. Du kommst immer von unten und fährst nach oben, so als ob du selbst auf dem Rad sitzt. Dann ist deine rechte Hand auf der rechten Seite des Bildes. Die Buchstaben sind die anderen. Die Pfeile zeigen, wohin alle fahren: Alle wollen geradeaus fahren."
            show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: east, go: straight, label: "A" }] }
          - text: "Kommt das Auto von links, hast du Vorfahrt. Aber fahr erst, wenn du sicher bist, dass es wartet."
            say: "Kommt das Auto von links, hast du Vorfahrt, und das Auto muss warten. Aber fahr erst, wenn du sicher bist, dass es wirklich wartet. Schau dem Fahrer in die Augen. Das heißt Blickkontakt. Wenn du nicht sicher bist, wartest du lieber."
            show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: west, go: straight, label: "A" }] }
          - text: "Zwei Autos: A von rechts, B von links.\nZuerst A, dann du, zuletzt B."
            say: "Jetzt kommen zwei Autos. A kommt von rechts, B von links. Rechts von A ist niemand, also fährt A zuerst. Dann fährst du, denn für B kommst du von rechts. Zuletzt fährt B."
            show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: east, go: straight, label: "A" }, { kind: car, arm: west, go: straight, label: "B", colour: blue }] }
          - text: "Aus einer Einfahrt oder über einen abgesenkten Bordstein: Du lässt alle anderen vor."
            say: "Noch eine wichtige Regel. Kommst du aus einer Einfahrt, zum Beispiel vom Hof eines Hauses, oder fährst du über einen abgesenkten Bordstein auf die Straße, dann gilt rechts vor links nicht. Du lässt alle anderen vor, egal von wo sie kommen."
            show: { object: house }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Kein Schild, keine Ampel. Wer darf zuerst fahren?"
                say: "Schau dir die Kreuzung an. Es gibt kein Schild und keine Ampel. Wer darf zuerst fahren?"
                show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: east, go: straight, label: "A" }] }
                options: ["Auto A", "du"]
                answer: "Auto A"
                hints:
                  - "Ohne Schild gilt rechts vor links."
                  - "Du kommst von unten. Auf welcher Seite ist A?"
                  - "A kommt von rechts. A darf zuerst fahren."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Kein Schild, keine Ampel. Wer hat Vorfahrt?"
                say: "Schau dir die Kreuzung an. Es gibt kein Schild und keine Ampel. Wer hat Vorfahrt?"
                show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: west, go: straight, label: "A" }] }
                options: ["du", "Auto A"]
                answer: "du"
                hints:
                  - "Rechts vor links: Wer von rechts kommt, darf zuerst."
                  - "A kommt von links. Für A kommst du von rechts."
                  - "Du hast Vorfahrt. Schau trotzdem, ob A wartet."
              - id: l1-f3
                type: true_false
                text: "An einer Kreuzung ohne Schild und ohne Ampel gilt rechts vor links. Stimmt das?"
                answer: true
                hints:
                  - "Wenn nichts anderes die Vorfahrt regelt, gibt es eine Grundregel."
                  - "Die Grundregel heißt: Wer von rechts kommt, darf zuerst."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: sorting
                text: "Musst du warten, oder darfst du fahren? Es gibt kein Schild. Sortiere."
                bins:
                  - { id: wait, show: { text: "Ich warte." }, say: "Ich warte." }
                  - { id: go, show: { text: "Ich darf fahren." }, say: "Ich darf fahren." }
                options:
                  - { text: "Ein Auto kommt von rechts.", bin: wait }
                  - { text: "Ein Radfahrer kommt von rechts.", bin: wait }
                  - { text: "Ich komme aus unserer Einfahrt.", bin: wait }
                  - { text: "Ein Auto kommt von links und hält an.", bin: go }
                hints:
                  - "Prüf bei jedem Satz: Kommt jemand von rechts, oder komme ich aus einer Einfahrt?"
                  - "Von rechts und aus der Einfahrt heißt warten."
                  - "Nur beim Auto von links, das anhält, darfst du fahren."
              - id: l1-f5
                type: multiple_choice
                text: "Lina hat Vorfahrt. Aber das Auto von links wird gar nicht langsamer. Was macht Lina?"
                options: ["Sie wartet lieber.", "Sie fährt schnell los, sie hat ja Vorfahrt.", "Sie klingelt und fährt einfach weiter."]
                answer: "Sie wartet lieber."
                feedback:
                  "Sie fährt schnell los, sie hat ja Vorfahrt.": "Recht haben hilft nicht, wenn das Auto nicht bremst. Sicherheit geht vor: Lina wartet."
                hints:
                  - "Was ist wichtiger: Vorfahrt oder gesund ankommen?"
                  - "Fahr erst, wenn du sicher bist, dass der andere wartet."
                  - "Sie wartet lieber."
              - id: l1-f6
                type: ordering
                text: "Wer fährt zuerst, wer danach? Bring es in die richtige Reihenfolge."
                say: "Schau dir die Kreuzung an. Es gibt kein Schild. Wer fährt zuerst, wer danach?"
                show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: east, go: straight, label: "A" }, { kind: car, arm: west, go: straight, label: "B", colour: blue }] }
                options: ["Auto B", "du", "Auto A"]
                slot_count: 3
                answer: ["Auto A", "du", "Auto B"]
                hints:
                  - "Fang mit dem an, der niemanden rechts von sich hat."
                  - "A kommt von deiner rechten Seite. Für B kommst du von rechts."
                  - "A, dann du, dann B."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Eine Einmündung ohne Schild: Wer darf zuerst fahren?"
                say: "Hier endet deine Straße an einer anderen Straße. Das heißt Einmündung. Es gibt kein Schild. Wer darf zuerst fahren?"
                show: { drawn: junction, arms: [east, south, west], users: [{ kind: you, arm: south }, { kind: car, arm: west, go: straight, label: "A" }] }
                options: ["du", "Auto A"]
                answer: "du"
                hints: ["Auch an einer Einmündung gilt rechts vor links. Für A kommst du von rechts."]
              - id: l1-s2
                type: true_false
                text: "Wer aus einer Einfahrt auf die Straße fährt, lässt alle anderen vor. Stimmt das?"
                answer: true
                hints: ["Aus der Einfahrt gilt rechts vor links nicht."]
              - id: l1-s3
                type: matching
                text: "Was bedeutet das? Verbinde."
                pairs:
                  - { left: { text: "Vorfahrt" }, right: { text: "Du darfst zuerst fahren." } }
                  - { left: { text: "warten" }, right: { text: "Du lässt die anderen vor." } }
                  - { left: { text: "Blickkontakt" }, right: { text: "Du schaust dem Fahrer in die Augen." } }
                hints: ["Blickkontakt hat mit den Augen zu tun."]
              - id: l1-s4
                type: multiple_choice
                text: "Kein Schild, keine Ampel. Ein Kind mit dem Rad kommt. Wer darf zuerst fahren?"
                say: "Schau dir die Kreuzung an. Es gibt kein Schild und keine Ampel. R ist ein Kind mit dem Fahrrad. Wer darf zuerst fahren?"
                show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: bike, arm: east, go: straight, label: "R" }] }
                options: ["das Kind R", "du"]
                answer: "das Kind R"
                hints: ["Rechts vor links gilt auch zwischen zwei Fahrrädern."]
              - id: l1-s5
                type: true_false
                text: "Auto A kommt von rechts. Du darfst zuerst fahren. Stimmt das?"
                show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: east, go: straight, label: "A" }] }
                answer: false
                hints: ["Wer von rechts kommt, hat Vorfahrt."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Kein Schild, keine Ampel. Wer fährt zuerst?"
                say: "Schau dir die Kreuzung an. Es gibt kein Schild und keine Ampel. Wer fährt zuerst?"
                show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: west, go: straight, label: "A" }, { kind: car, arm: east, go: straight, label: "B", colour: blue }] }
                options: ["Auto B", "du", "Auto A"]
                answer: "Auto B"
              - id: l1-n2
                type: true_false
                text: "Du fährst über einen abgesenkten Bordstein auf die Straße. Ein Auto kommt von links. Du darfst zuerst fahren. Stimmt das?"
                answer: false
              - id: l1-n3
                type: sorting
                text: "Musst du warten, oder darfst du fahren? Sortiere."
                bins:
                  - { id: wait, show: { text: "Ich warte." }, say: "Ich warte." }
                  - { id: go, show: { text: "Ich darf fahren." }, say: "Ich darf fahren." }
                options:
                  - { text: "Kein Schild. Von rechts kommt ein Traktor.", bin: wait }
                  - { text: "Ich fahre vom Hof meiner Oma auf die Straße.", bin: wait }
                  - { text: "Kein Schild. Von rechts kommt ein Mofa.", bin: wait }
                  - { text: "Kein Schild. Von links kommt ein Bus und hält an.", bin: go }
              - id: l1-n4
                type: ordering
                text: "Wer fährt zuerst, wer danach? Bring es in die richtige Reihenfolge."
                say: "Schau dir die Kreuzung an. Es gibt kein Schild. R ist ein Kind mit dem Fahrrad, A ist ein Auto. Wer fährt zuerst, wer danach?"
                show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: bike, arm: east, go: straight, label: "R" }, { kind: car, arm: west, go: straight, label: "A" }] }
                options: ["Auto A", "Rad R", "du"]
                slot_count: 3
                answer: ["Rad R", "du", "Auto A"]
              - id: l1-n5
                type: multiple_choice
                text: "Warum schaut Lina dem Autofahrer in die Augen?"
                options: ["Damit sie sicher ist, dass er sie gesehen hat und wartet.", "Weil sie ihn vielleicht kennt.", "Damit er schneller fährt."]
                answer: "Damit sie sicher ist, dass er sie gesehen hat und wartet."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Kein Schild. Wer hat hier Vorfahrt?"
            say: "Schau dir die Kreuzung an. Es gibt kein Schild. Wer hat hier Vorfahrt?"
            show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: east, go: straight, label: "A" }] }
            options: ["Auto A", "du"]
            answer: "Auto A"
          - id: l1-c2
            type: true_false
            text: "Rechts vor links gilt nur für Autos, nicht für Fahrräder. Stimmt das?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Du fährst aus einer Einfahrt auf die Straße. Wer darf zuerst?"
            options: ["alle anderen auf der Straße", "du", "wer schneller ist"]
            answer: "alle anderen auf der Straße"
          - id: l1-c4
            type: multiple_choice
            text: "Kein Schild. Ein Kind mit dem Rad kommt. Wer darf zuerst?"
            say: "Schau dir die Kreuzung an. Es gibt kein Schild. R ist ein Kind mit dem Fahrrad. Wer darf zuerst?"
            show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: bike, arm: west, go: straight, label: "R" }] }
            options: ["du", "das Kind R"]
            answer: "du"
          - id: l1-c5
            type: true_false
            text: "Auch wenn du Vorfahrt hast, fährst du erst, wenn du sicher bist, dass der andere wartet. Stimmt das?"
            answer: true
          - id: l1-c6
            type: ordering
            text: "Kein Schild. Wer fährt zuerst, wer danach?"
            say: "Schau dir die Kreuzung an. Es gibt kein Schild. Wer fährt zuerst, wer danach?"
            show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: west, go: straight, label: "A" }, { kind: car, arm: east, go: straight, label: "B", colour: blue }] }
            options: ["du", "Auto A", "Auto B"]
            slot_count: 3
            answer: ["Auto B", "du", "Auto A"]

  - n: 2
    title: { de: "Schilder regeln die Vorfahrt", en: "Signs set the right of way" }
    goal:
      de: "Lerne die Schilder, die sagen, wer Vorfahrt hat. Am Stoppschild hältst du immer ganz an."
      en: "Learn the signs that say who has right of way. At a stop sign you always stop completely."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Es gibt kein Schild. Wer fährt zuerst?"
            say: "Schau dir die Kreuzung an. Es gibt kein Schild und keine Ampel. Wer fährt zuerst?"
            show: { drawn: junction, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: east, go: straight, label: "A" }] }
            options: ["Auto A", "du"]
            answer: "Auto A"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Wer vom Hof auf die Straße fährt, lässt alle vor. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "An Linas Straße steht ein gelbes Schild, ein Quadrat auf der Spitze. Von rechts kommt ein Auto.\n\nMuss Lina warten?"
            say: "Lina fährt auf einer breiten Straße. Am Rand steht ein gelbes Schild mit weißem Rand. Es ist ein Quadrat, das auf der Spitze steht. An der nächsten Kreuzung kommt von rechts ein Auto. Was glaubst du: Muss Lina warten?"
            show: { drawn: junction, signs: { south: priority-road }, users: [{ kind: you, arm: south, go: straight }, { kind: car, arm: east, go: straight, label: "A" }] }
          - text: "Nein! Steht ein Schild da, gilt das Schild, nicht rechts vor links."
            say: "Nein! Das gelbe Schild heißt Vorfahrtstraße. Wenn ein Schild die Vorfahrt regelt, gilt das Schild und nicht mehr rechts vor links. Lina darf fahren, und das Auto von rechts muss warten."
          - text: "Vorfahrtstraße: gelbe Raute mit weißem Rand.\nDu hast an jeder Kreuzung Vorfahrt."
            say: "Das Schild Vorfahrtstraße ist ein gelbes Quadrat mit weißem Rand, das auf der Spitze steht. Diese Form heißt Raute. Auf dieser Straße hast du an jeder Kreuzung Vorfahrt, bis ein Schild sagt, dass die Vorfahrtstraße zu Ende ist."
            show: { object: sign-priority-road }
          - text: "Vorfahrt an der nächsten Kreuzung: Dreieck mit rotem Rand, darin ein dicker schwarzer Strich mit einem dünnen Querstrich."
            say: "Dieses Schild ist ein Dreieck mit rotem Rand und der Spitze nach oben. Darin ist ein dicker schwarzer Strich nach oben, mit einem dünnen Querstrich. Es sagt: Du hast Vorfahrt, aber nur an der nächsten Kreuzung."
            show: { object: sign-priority-next-junction }
          - text: "Vorfahrt gewähren: Dreieck mit rotem Rand, das auf der Spitze steht. Du lässt alle auf der anderen Straße vor."
            say: "Steht bei dir ein Dreieck mit rotem Rand, das auf der Spitze steht, heißt das: Vorfahrt gewähren. Du lässt alle auf der anderen Straße vor, egal ob sie von rechts oder von links kommen. Ist die Straße frei, darfst du fahren, ohne ganz anzuhalten."
            show: { object: sign-give-way }
          - text: "Stopp: rotes Achteck. Du hältst ganz an, auch wenn niemand kommt."
            say: "Am Stoppschild, dem roten Achteck, hältst du immer ganz an, auch wenn niemand kommt. Dann lässt du alle auf der anderen Straße vor und fährst erst, wenn frei ist."
            show: { object: sign-stop }
          - text: "Ampel vor Schild. Schild vor rechts vor links."
            say: "Gibt es an der Kreuzung eine Ampel, die leuchtet, dann gilt die Ampel und nicht das Schild. Ist die Ampel aus, gelten die Schilder. Und wo es keine Ampel und kein Schild gibt, gilt rechts vor links. Und immer gilt: Auch mit Vorfahrt fährst du nur, wenn du sicher bist, dass die anderen warten."
            show: { object: traffic-light }
          - text: "Wusstest du? Eine Polizistin kann mit den Armen den Verkehr regeln. Dann gilt, was sie zeigt, sogar vor der Ampel."
            say: "Wusstest du? Eine Polizistin oder ein Polizist kann sich auf die Kreuzung stellen und mit den Armen den Verkehr regeln. Dann gilt, was sie zeigen, sogar vor der Ampel und vor allen Schildern."
            show: { object: police-officer }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Was sagt das Schild? Verbinde."
                pairs:
                  - { left: { object: sign-priority-road }, right: { text: "Ich habe an jeder Kreuzung Vorfahrt." } }
                  - { left: { object: sign-give-way }, right: { text: "Ich lasse alle auf der anderen Straße vor." } }
                  - { left: { object: sign-stop }, right: { text: "Ich halte ganz an." } }
                hints:
                  - "Fang mit dem Achteck an. Das ist das Stoppschild."
                  - "Die gelbe Raute ist die Vorfahrtstraße. Das Dreieck auf der Spitze heißt Vorfahrt gewähren."
                  - "Raute: Vorfahrt. Dreieck auf der Spitze: vorlassen. Achteck: anhalten."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "An Linas Straße steht Vorfahrt gewähren. Von links kommt ein Auto. Was macht Lina?"
