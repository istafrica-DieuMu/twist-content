# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.cycling-test
skill: world.space.cycling-test
curriculum: de-DE
language: de
title:
  de: Fit für die Fahrradprüfung
  en: Ready for the cycling test
summary: >
  The theory part of the Radfahrprüfung, as German schools prepare it with
  the police; the practical ride stays outside the app. The story: the
  Klasse 4b gets ready for the test with Frau Okafor from the police,
  following Aylin, Jonas and Mila. Lesson 1 covers the bike and where to
  ride: what a roadworthy bike must have (two brakes, a bell, white light
  and reflector at the front, red at the back, yellow reflectors on the
  pedals and spokes), the helmet (not compulsory, always worth wearing),
  pavement and road by age (up to 8 on the pavement, up to 10 allowed
  there, from 10 on the cycle path or the road, always on the right),
  the blue cycle path sign, pushing the bike across the road, and what is
  forbidden while riding (no hands, phone, a passenger on the rack).
  Lesson 2 covers junctions and dangers: who goes first (police, traffic
  light, signs, then rechts vor links), the three main priority signs,
  the steps for turning left and the option to push across, pulling out
  from the kerb and passing parked cars with about a metre to spare, the
  lorry's blind spot, and the zebra crossing. It ends with the skill
  check. Rules follow the StVO and StVZO as taught in German schools.
metadata:
  year: klasse-4
  topic: { de: Mit dem Fahrrad unterwegs, en: Out on a bike }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.space.bike-parts, world.space.right-of-way, world.space.turning-left]
  also_practises: [world.space.bike-parts, world.space.right-of-way, world.space.turning-left]
  vocabulary: { de: [Fahrradprüfung, verkehrssicher, Bremse, Klingel, Licht, Reflektor, Helm, Gehweg, Radweg, Fahrbahn, Handzeichen, Vorfahrt, Vorfahrtstraße, Vorfahrt gewähren, Stoppschild, einordnen, Gegenverkehr, umschauen, toter Winkel, Abstand, Zebrastreifen] }
  forms: [text, audio, picture, drawn]
  drawn: [junction]
  facets: []
  parts:
    - { id: bike, what: { de: "sagen, was ein verkehrssicheres Fahrrad braucht, und warum ein Helm schützt", en: "saying what a roadworthy bike needs and why a helmet protects" } }
    - { id: rules, what: { de: "wissen, wo man fahren darf, was verboten ist und wer an der Kreuzung Vorfahrt hat", en: "knowing where to ride, what is forbidden and who has priority at a junction" } }
    - { id: moves, what: { de: "die Schritte beim Abbiegen, Losfahren und Vorbeifahren nennen und Gefahren wie den toten Winkel kennen", en: "naming the steps for turning, pulling out and passing, and knowing dangers such as the blind spot" } }
  misconceptions:
    - id: pavement-always
      what: Thinks children may always ride on the pavement, or may ride across the road from it
      addressed: "lesson 1 Learn sets out the ages and the pushing rule; l1-f3, l1-f4, l1-c3 and l2-c7, l2-c13 test it"
    - id: lorry-sees-me
      what: Thinks the driver of a big lorry can see a cyclist waiting beside it on the right
      addressed: "lesson 2 Learn explains the blind spot; l2-f5, l2-s5 and l2-c15 ask where to wait"
    - id: sign-before-light
      what: Thinks a priority sign counts more than a working traffic light or a police officer's signal
      addressed: "lesson 2 opens with the guess about the green light and the sign; l2-f2, l2-n1, l2-n2 and l2-c12 order them"
    - id: zebra-for-cyclists
      what: Thinks a cyclist riding over a zebra crossing has priority like a pedestrian
      addressed: "lesson 2 Learn says only people on foot, and those pushing a bike, have priority there; l2-s3 tests it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Das Fahrrad und die Regeln", en: "The bike and the rules" }
    goal:
      de: "Prüf, ob ein Fahrrad verkehrssicher ist, und finde heraus, wo du fahren darfst. Ab zehn Jahren fährst du zum Beispiel auf dem Radweg oder auf der Straße."
      en: "Check whether a bike is roadworthy, and find out where you may ride. From the age of ten, for example, you ride on the cycle path or on the road."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wozu ist die Klingel am Fahrrad da?"
            options: ["um andere zu warnen", "um Musik zu machen", "um schneller zu fahren"]
            answer: "um andere zu warnen"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "An einer Kreuzung ohne Ampel und ohne Schilder gilt: rechts vor links. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Frau Okafor von der Polizei kommt in die 4b. Bald ist die Fahrradprüfung.\n\nWird bei der Prüfung nur gefahren?"
            say: "Frau Okafor von der Polizei kommt in die Klasse 4b. Bald machen alle die Fahrradprüfung. Was glaubst du: Wird bei der Prüfung nur gefahren, oder musst du auch Fragen beantworten?"
            show: { object: police-officer }
          - text: "Die Prüfung hat zwei Teile: Fragen zu den Regeln und eine Fahrt.\nHier übst du die Fragen."
            say: "Beides! Zuerst beantwortest du Fragen zu den Verkehrsregeln. Dann fährst du mit dem Fahrrad, und die Polizei schaut genau zu. Das Fahren übst du draußen mit deiner Klasse. Hier in Twist übst du die Fragen."
          - text: "Ein verkehrssicheres Fahrrad hat:\nzwei Bremsen und eine Klingel\nvorne: weißes Licht, weißer Reflektor\nhinten: rotes Licht, roter Reflektor\ngelbe Reflektoren an den Pedalen und an den Speichen"
            say: "Zuerst schaut Frau Okafor auf die Fahrräder. Ein verkehrssicheres Fahrrad hat zwei Bremsen, die unabhängig voneinander bremsen, und eine Klingel. Vorne leuchtet ein weißes Licht, und es gibt einen weißen Reflektor. Hinten leuchtet ein rotes Licht, dazu kommt ein roter Reflektor. An den Pedalen sind gelbe Reflektoren, und an den Speichen gelbe Reflektoren oder weiße Streifen. So sehen dich die anderen auch im Dunkeln."
            show: { object: bike }
          - text: "Ein Helm ist keine Pflicht. Er schützt aber deinen Kopf. Trag ihn bei jeder Fahrt."
            say: "Und der Helm? In Deutschland ist er keine Pflicht. Aber bei einem Sturz schützt er deinen Kopf. Darum trägst du ihn bei jeder Fahrt, auch auf kurzen Wegen."
            show: { object: helmet }
          - text: "Bis 8 Jahre: auf dem Gehweg fahren\nBis 10 Jahre: Gehweg erlaubt\nAb 10 Jahren: Radweg oder Straße, immer rechts\nÜber die Straße: absteigen und schieben"
            say: "Wo darfst du fahren? Kinder bis acht Jahre müssen auf dem Gehweg fahren, oder auf einem Radweg, der von der Straße getrennt ist. Kinder bis zehn Jahre dürfen noch auf dem Gehweg fahren. Ab dem zehnten Geburtstag fährst du auf dem Radweg oder auf der Straße, immer am rechten Rand. Auf dem Gehweg passt du auf die Fußgänger auf. Und wenn du vom Gehweg über die Straße willst, steigst du ab und schiebst."
          - text: "Rundes blaues Schild mit weißem Fahrrad: Hier ist ein Radweg. Du musst ihn benutzen."
            say: "Dieses Schild ist rund und blau und zeigt ein weißes Fahrrad. Es heißt: Hier ist ein Radweg, und Radfahrer müssen ihn benutzen."
            show: { object: sign-cycle-path }
          - text: "Verboten beim Radfahren:\nfreihändig fahren\naufs Handy schauen\nein anderes Kind auf dem Gepäckträger mitnehmen"
            say: "Ein paar Dinge sind beim Radfahren verboten. Du fährst nie freihändig, sondern hältst den Lenker immer fest. Du schaust beim Fahren nicht aufs Handy. Und du nimmst kein anderes Kind auf dem Gepäckträger mit."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Frau Okafor prüft Jonas' Fahrrad. Was muss daran sein?"
                options: [{ object: bell }, { object: balloon }, { object: teddy }]
                answer: bell
                feedback:
                  teddy: "Ein Teddy als Beifahrer? Süß, aber kein Teil eines verkehrssicheren Fahrrads. Die Klingel muss dran sein."
                hints:
                  - "Ein verkehrssicheres Fahrrad braucht etwas, mit dem du andere warnen kannst."
                  - "Damit machst du „Ring, ring!“."
                  - "Die Klingel."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Muss das an ein verkehrssicheres Fahrrad? Sortiere."
                bins:
                  - { id: must, show: { text: "muss dran sein" }, say: "muss dran sein" }
                  - { id: extra, show: { text: "muss nicht dran sein" }, say: "muss nicht dran sein" }
                options:
                  - { text: "zwei Bremsen", bin: must }
                  - { text: "ein weißes Licht vorne", bin: must }
                  - { text: "gelbe Reflektoren an den Pedalen", bin: must }
                  - { text: "ein Fahrradkorb", bin: extra }
                  - { text: "bunte Bänder am Lenker", bin: extra }
                hints:
                  - "Was brauchst du, um zu bremsen, zu warnen und gesehen zu werden?"
                  - "Korb und Bänder sind schön, aber sie machen das Fahrrad nicht sicherer."
                  - "Bremsen, Licht und Reflektoren müssen dran sein. Korb und Bänder nicht."
              - id: l1-f3
                type: multiple_choice
                text: "Jonas hatte gestern seinen 10. Geburtstag. Wo fährt er jetzt mit dem Fahrrad?"
                options: ["auf dem Radweg oder rechts auf der Straße", "auf dem Gehweg zwischen den Fußgängern", "auf der linken Straßenseite"]
                answer: "auf dem Radweg oder rechts auf der Straße"
                hints:
                  - "Ab einem bestimmten Alter dürfen Kinder nicht mehr auf dem Gehweg fahren."
                  - "Bis zehn Jahre ist der Gehweg erlaubt. Jonas ist jetzt zehn."
                  - "Auf dem Radweg oder rechts auf der Straße."
              - id: l1-f4
                type: true_false
                text: "Mila ist 7 und fährt auf dem Gehweg. Jetzt will sie über die Straße.\n\nDarf sie einfach hinüberfahren?"
                answer: false
                hints:
                  - "Auf dem Gehweg fährst du wie ein Fußgänger. Wie gehst du über die Straße?"
                  - "Kinder vom Gehweg steigen an der Straße ab."
                  - "Nein, Mila steigt ab und schiebt."
              - id: l1-f5
                type: matching
                text: "Licht und Reflektoren: Was gehört wohin? Verbinde."
                pairs:
                  - { left: { text: "vorne" }, right: { text: "weißes Licht und weißer Reflektor" } }
                  - { left: { text: "hinten" }, right: { text: "rotes Licht und roter Reflektor" } }
                  - { left: { text: "an den Pedalen" }, right: { text: "gelbe Reflektoren" } }
                hints:
                  - "Denk an ein Auto: Welche Farbe haben seine Lichter vorne und hinten?"
                  - "Hinten ist alles rot, vorne alles weiß."
                  - "vorne weiß, hinten rot, Pedale gelb"
              - id: l1-f6
                type: multiple_choice
                text: "Aylin sieht dieses Schild. Was bedeutet es?"
                show: { object: sign-cycle-path }
                options: ["Hier ist ein Radweg, und ich muss ihn benutzen.", "Hier dürfen keine Fahrräder fahren.", "Hier gibt es Fahrräder zu kaufen."]
                answer: "Hier ist ein Radweg, und ich muss ihn benutzen."
                feedback:
                  "Hier gibt es Fahrräder zu kaufen.": "Ein Fahrradladen mit Verkehrsschild? Nein, das runde blaue Schild ist ein Gebot: Radweg benutzen!"
                hints:
                  - "Runde blaue Schilder sagen, was du tun musst."
                  - "Auf dem Schild ist ein weißes Fahrrad."
                  - "Es zeigt einen Radweg, den du benutzen musst."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ein Helm ist keine Pflicht. Warum trägt Aylin trotzdem immer einen?"
                show: { object: helmet }
                options: ["Er schützt ihren Kopf, wenn sie stürzt.", "Damit sie schneller fährt.", "Weil die Polizei sonst ihr Fahrrad mitnimmt."]
                answer: "Er schützt ihren Kopf, wenn sie stürzt."
                hints: ["Denk daran, was bei einem Sturz passieren kann."]
              - id: l1-s2
                type: sorting
                text: "Erlaubt oder verboten beim Radfahren? Sortiere."
                bins:
                  - { id: ok, show: { text: "erlaubt" }, say: "erlaubt" }
                  - { id: no, show: { text: "verboten" }, say: "verboten" }
                options:
                  - { text: "mit beiden Händen am Lenker fahren", bin: ok }
                  - { text: "am rechten Rand fahren", bin: ok }
                  - { text: "freihändig fahren", bin: no }
                  - { text: "beim Fahren aufs Handy schauen", bin: no }
                hints: ["Verboten ist alles, wobei du den Lenker loslässt oder nicht auf den Weg schaust."]
              - id: l1-s3
                type: multiple_choice
                text: "Mila ist 7 Jahre alt. An ihrer Straße gibt es keinen Radweg. Wo fährt sie?"
                options: ["auf dem Gehweg", "auf der Straße", "mitten auf der Kreuzung"]
                answer: "auf dem Gehweg"
                hints: ["Kinder bis acht Jahre müssen auf dem Gehweg fahren."]
              - id: l1-s4
                type: true_false
                text: "Ein verkehrssicheres Fahrrad hat zwei Bremsen. Stimmt das?"
                answer: true
                hints: ["Wenn eine Bremse kaputtgeht, brauchst du noch eine zweite."]
              - id: l1-s5
                type: fill_in_blank
                text: "Welche Zahlen passen?"
                frame: "Kinder bis _ Jahre müssen auf dem Gehweg fahren. Kinder bis _ Jahre dürfen dort noch fahren."
                options: ["6", "8", "10", "12"]
                answer: ["8", "10"]
                hints: ["Mila mit 7 muss auf dem Gehweg fahren, Jonas mit 10 nicht mehr."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Muss das an ein verkehrssicheres Fahrrad? Sortiere."
                bins:
                  - { id: must, show: { text: "muss dran sein" }, say: "muss dran sein" }
                  - { id: extra, show: { text: "muss nicht dran sein" }, say: "muss nicht dran sein" }
                options:
                  - { text: "ein rotes Licht hinten", bin: must }
                  - { text: "eine Klingel", bin: must }
                  - { text: "Reflektoren an den Speichen", bin: must }
                  - { text: "ein Getränkehalter", bin: extra }
                  - { text: "ein Wimpel", bin: extra }
              - id: l1-n2
                type: multiple_choice
                text: "Aylin fährt am Abend im Dunkeln nach Hause. Was muss sie tun?"
                options: ["das Licht einschalten", "schneller fahren", "auf der linken Seite fahren"]
                answer: "das Licht einschalten"
              - id: l1-n3
                type: true_false
                text: "Jonas will seine kleine Schwester auf dem Gepäckträger mitnehmen.\n\nDarf er das?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Ben ist 9. An seiner Straße gibt es einen Radweg. Wo darf er fahren?"
                options: ["auf dem Gehweg oder auf dem Radweg", "nur mitten auf der Straße", "auf der linken Straßenseite"]
                answer: "auf dem Gehweg oder auf dem Radweg"
              - id: l1-n5
                type: matching
                text: "Wozu ist das am Fahrrad da? Verbinde."
                pairs:
                  - { left: { text: "Klingel" }, right: { text: "andere warnen" } }
                  - { left: { text: "Licht" }, right: { text: "im Dunkeln sehen und gesehen werden" } }
                  - { left: { text: "Bremsen" }, right: { text: "rechtzeitig anhalten" } }
                  - { left: { text: "Reflektoren" }, right: { text: "das Licht von Autos zurückwerfen" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Farbe hat das Licht hinten am Fahrrad?"
            options: ["rot", "weiß", "gelb"]
            answer: "rot"
          - id: l1-c2
            type: true_false
            text: "Freihändig fahren ist erlaubt, wenn die Straße leer ist. Stimmt das?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Ab wann darfst du nicht mehr auf dem Gehweg fahren?"
            options: ["ab dem 10. Geburtstag", "ab dem 6. Geburtstag", "ab dem 14. Geburtstag"]
            answer: "ab dem 10. Geburtstag"
          - id: l1-c4
            type: image_multiple_choice
            text: "Welches Schild zeigt einen Radweg?"
            options: [{ object: sign-cycle-path }, { object: sign-bus-stop }, { object: sign-toilet }]
            answer: sign-cycle-path
          - id: l1-c5
            type: sorting
            text: "Erlaubt oder verboten beim Radfahren? Sortiere."
            bins:
              - { id: ok, show: { text: "erlaubt" }, say: "erlaubt" }
              - { id: no, show: { text: "verboten" }, say: "verboten" }
            options:
              - { text: "einen Helm tragen", bin: ok }
              - { text: "ein Kind auf dem Gepäckträger mitnehmen", bin: no }
              - { text: "beim Fahren eine Nachricht schreiben", bin: no }
          - id: l1-c6
            type: true_false
            text: "Wer mit dem Fahrrad auf dem Gehweg fährt, muss auf die Fußgänger aufpassen. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Kreuzungen und Gefahren", en: "Junctions and dangers" }
    goal:
      de: "Finde heraus, wer an einer Kreuzung zuerst fahren darf und wie du sicher abbiegst. Neben einem Lastwagen wartest du zum Beispiel nie rechts, sondern dahinter."
      en: "Find out who goes first at a junction and how to turn safely. Next to a lorry, for example, you never wait on its right but behind it."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was muss an ein verkehrssicheres Fahrrad?"
            options: ["zwei Bremsen", "ein Getränkehalter", "ein Wimpel"]
            answer: "zwei Bremsen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ab dem 10. Geburtstag fährst du auf dem Gehweg. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Die Ampel zeigt Grün. Am Mast hängt auch ein Schild: Vorfahrt gewähren.\n\nWas gilt für Aylin?"
            say: "Aylin kommt mit dem Fahrrad an eine Kreuzung. Die Ampel zeigt Grün. Am Mast hängt aber auch ein Schild: Vorfahrt gewähren. Was glaubst du: Was gilt für Aylin, die Ampel oder das Schild?"
            show: { drawn: junction, lights: { south: green }, signs: { south: give-way }, users: [{ kind: bike, arm: south, go: straight, label: "Aylin" }] }
          - text: "Was gilt zuerst?\n1. Polizei\n2. Ampel\n3. Verkehrsschilder\n4. rechts vor links"
            say: "Die Ampel gilt! Es gibt eine feste Reihenfolge. Am wichtigsten ist, was eine Polizistin oder ein Polizist mit der Hand zeigt. Danach kommt die Ampel. Dann die Verkehrsschilder. Und wo es nichts davon gibt, gilt rechts vor links. Das Schild ist für die Zeit da, in der die Ampel aus ist."
          - text: "gelbe Raute: Vorfahrtstraße, du hast Vorfahrt\nDreieck mit der Spitze nach unten: Vorfahrt gewähren\nrotes Achteck: Stopp, immer anhalten und Vorfahrt gewähren"
            say: "Drei Schilder musst du für die Prüfung kennen. Die gelbe Raute mit weißem Rand zeigt die Vorfahrtstraße: Du hast Vorfahrt. Das weiße Dreieck mit rotem Rand und der Spitze nach unten heißt: Vorfahrt gewähren. Du lässt die anderen zuerst fahren. Das rote Achteck ist das Stoppschild. Dort hältst du immer an, schaust und lässt die anderen fahren."
            show: { object: sign-priority-road }
          - text: "Links abbiegen:\n1. nach hinten umschauen\n2. Handzeichen links\n3. zur Mitte einordnen\n4. Gegenverkehr vorbeilassen\n5. noch einmal umschauen und abbiegen"
            say: "Links abbiegen ist die schwerste Aufgabe. Zuerst schaust du über die linke Schulter nach hinten. Dann gibst du mit dem linken Arm ein Handzeichen. Du ordnest dich zur Straßenmitte ein. Den Gegenverkehr lässt du vorbei. Dann schaust du noch einmal nach hinten und biegst ab. Ist dir das zu gefährlich, steigst du ab und schiebst das Fahrrad wie ein Fußgänger hinüber."
            show: { drawn: junction, users: [{ kind: you, arm: south, go: left }, { kind: car, arm: north, go: straight }] }
          - text: "Losfahren vom Rand und an parkenden Autos vorbei: nach hinten umschauen, Handzeichen links.\nAn parkenden Autos: etwa 1 Meter Abstand."
            say: "Auch beim Losfahren vom Straßenrand schaust du nach hinten und gibst ein Handzeichen nach links. Erst wenn alles frei ist, fährst du los. An einem parkenden Auto fährst du genauso vorbei, mit etwa einem Meter Abstand. Denn plötzlich kann eine Autotür aufgehen."
            show: { object: car }
          - text: "Toter Winkel: Rechts neben einem Lastwagen sieht dich der Fahrer oft nicht.\nWarte hinter dem Lastwagen!"
            say: "Besonders gefährlich ist ein Lastwagen, der rechts abbiegen will. Wenn du rechts neben ihm stehst, kann der Fahrer dich oft nicht sehen, auch nicht im Spiegel. Diese Stelle heißt toter Winkel. Darum wartest du immer hinter dem Lastwagen, bis er abgebogen ist."
            show: { object: lorry }
          - text: "Zebrastreifen: Vorrang haben Fußgänger.\nWer mit dem Fahrrad fährt, hat dort keinen Vorrang. Wer schiebt, ist Fußgänger."
            say: "Und am Zebrastreifen? Dort haben die Fußgänger Vorrang. Wer mit dem Fahrrad darüberfährt, hat keinen Vorrang. Steigst du ab und schiebst, bist du ein Fußgänger, und die Autos müssen dich hinüberlassen."
            show: { object: zebra-crossing }
          - text: "Wusstest du? In den Niederlanden gibt es mehr Fahrräder als Menschen."
            say: "Wusstest du? In den Niederlanden, unserem Nachbarland, gibt es mehr Fahrräder als Menschen. Viele Kinder fahren dort jeden Tag mit dem Rad zur Schule."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Jonas will links abbiegen. Bring die Schritte in die richtige Reihenfolge."
                options: ["Gegenverkehr vorbeilassen.", "Handzeichen nach links geben.", "Noch einmal umschauen und abbiegen.", "Nach hinten umschauen.", "Zur Straßenmitte einordnen."]
                slot_count: 5
                answer: ["Nach hinten umschauen.", "Handzeichen nach links geben.", "Zur Straßenmitte einordnen.", "Gegenverkehr vorbeilassen.", "Noch einmal umschauen und abbiegen."]
                option_audio: false
                hints:
                  - "Bevor du etwas zeigst oder dich bewegst, musst du wissen, was hinter dir los ist."
                  - "Erst umschauen, dann das Handzeichen. Abbiegen kommt ganz zum Schluss."
                  - "Umschauen, Handzeichen, einordnen, Gegenverkehr vorbeilassen, noch einmal umschauen und abbiegen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Die Ampel zeigt Rot. Ein Polizist steht auf der Kreuzung und winkt Aylin weiter. Was macht sie?"
                options: ["Sie fährt, weil der Polizist es zeigt.", "Sie wartet trotzdem auf Grün.", "Sie schaut, was auf dem Schild steht."]
                answer: "Sie fährt, weil der Polizist es zeigt."
                hints:
                  - "Es gibt eine Reihenfolge, was zuerst gilt."
                  - "Ganz oben in der Reihenfolge steht die Polizei."
