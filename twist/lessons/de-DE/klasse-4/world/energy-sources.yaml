# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.energy-sources
skill: world.nature.energy-sources
curriculum: de-DE
language: de
title:
  de: Woher kommt die Energie?
  en: Where does energy come from?
summary: >
  Mats wants to find out where the energy in his village comes from.
  Lesson 1: a lamp, a heating and a car all need energy, which comes from
  Energiequellen. Kohle, Erdöl and Erdgas lie deep in the ground, formed
  over millions of years from plants and tiny sea creatures, and are
  burned; what is burned is gone, and new ones take millions of years, so
  they are endlich. Sonne, Wind and fließendes Wasser come back every day
  and are erneuerbar. Benzin and Diesel are made from Erdöl. Lesson 2:
  the new Solaranlage on the school roof, a Windrad and a
  Wasserkraftwerk make Strom from sun, wind and flowing water without
  burning anything; burning Kohle, Erdöl and Erdgas makes Abgase such as
  Kohlendioxid; at night there is no sun and the wind does not always
  blow, so several sources are used together. It ends with the skill
  check. The village, names and story are written for Twist.
metadata:
  year: klasse-4
  topic: { de: Energie und Klima, en: Energy and climate }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: []
  vocabulary: { de: [Energie, Energiequelle, erneuerbar, endlich, Kohle, Erdöl, Erdgas, Benzin, Diesel, verbrennen, Abgase, Kohlendioxid, Kraftwerk, Strom, Solaranlage, Windrad, Wasserkraftwerk] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: renewable, what: { de: "erneuerbare Energiequellen nennen und sagen, wie aus ihnen Strom wird", en: "naming renewable energy sources and saying how they are turned into electricity" } }
    - { id: finite, what: { de: "endliche Energiequellen nennen und erklären, warum sie zu Ende gehen", en: "naming energy sources that run out and explaining why they run out" } }
    - { id: compare, what: { de: "erneuerbare und endliche Energiequellen unterscheiden", en: "telling renewable sources from ones that run out" } }
  misconceptions:
    - id: fuel-comes-back
      what: Thinks Kohle, Erdöl and Erdgas grow back or are made again quickly, so they can never run out
      addressed: "lesson 1 Learn on how they formed over millions of years and that what is burned is gone; l1-f2, l1-n5, l1-n6, l1-c5 and l2-c9, l2-c12"
    - id: turbine-burns
      what: Thinks a Windrad or a Solaranlage burns something or uses up the wind or the sun
      addressed: "lesson 2 Learn says nothing is burned and the sun and wind come back; l1-s2, l2-f3, l2-f5 and l2-c6"
    - id: solar-at-night
      what: Thinks a Solaranlage makes electricity at night as well
      addressed: "lesson 2 Learn on night and calm days; l2-f6, l2-n3 and l2-c3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Endlich oder erneuerbar?", en: "Running out or renewable?" }
    goal:
      de: "Finde heraus, woher Energie kommt. Du lernst, welche Energiequellen zu Ende gehen, zum Beispiel Kohle, und welche immer wiederkommen, zum Beispiel der Wind."
      en: "Find out where energy comes from. You learn which energy sources run out, like coal, and which always come back, like the wind."
    new_content: true
    activities:
      - activity: learn
        mode: model-text
        screens:
          - text: "Morgens macht Mats das Licht an. Die Heizung macht das Haus warm. Papa fährt mit dem Auto zur Arbeit.\n\nWas brauchen Lampe, Heizung und Auto alle?"
            say: "Morgens macht Mats das Licht an. Die Heizung macht das Haus warm, und Papa fährt mit dem Auto zur Arbeit. Was glaubst du: Was brauchen die Lampe, die Heizung und das Auto alle?"
            show: { object: lamp }
          - text: "Sie alle brauchen Energie. Mit Energie leuchtet etwas, wird warm oder bewegt sich."
            say: "Sie alle brauchen Energie! Mit Energie leuchtet die Lampe, die Heizung wird warm, und das Auto fährt. Auch du brauchst Energie zum Rennen und Denken. Die bekommst du aus deinem Essen."
          - text: "Die Energie kommt aus Energiequellen. Im Kraftwerk wird daraus Strom."
            say: "Die Energie für Lampe, Heizung und Auto kommt aus Energiequellen. In einem Kraftwerk wird aus einer Energiequelle Strom gemacht. Der Strom kommt durch Kabel bis in Mats' Haus."
            show: { object: light-bulb }
          - text: "Kohle, Erdöl und Erdgas liegen tief in der Erde. Sie sind vor vielen Millionen Jahren entstanden."
            say: "Viele Energiequellen liegen tief in der Erde: Kohle, Erdöl und Erdgas. Kohle ist aus Pflanzen entstanden. Erdöl und Erdgas sind aus winzigen Lebewesen im Meer entstanden. Das hat viele Millionen Jahre gedauert. Heute holt man sie aus der Erde und verbrennt sie."
            show: { object: coal }
          - text: "Aus Erdöl macht man Benzin und Diesel. Mit Erdgas heizen viele Häuser. Kohle wird im Kraftwerk verbrannt."
            say: "Aus Erdöl macht man Benzin und Diesel für Autos und Lastwagen. Mit Erdgas heizen viele Häuser, und manche Menschen kochen damit. Kohle wird im Kraftwerk verbrannt, und daraus wird Strom."
            show: { object: car }
          - text: "Was verbrannt ist, ist weg. Kohle, Erdöl und Erdgas sind endlich."
            say: "Was verbrannt ist, ist weg. Neue Kohle und neues Erdöl entstehen erst wieder in Millionen Jahren. Wir verbrauchen sie viel schneller. Darum gehen sie irgendwann zu Ende. Man sagt: Sie sind endlich."
          - text: "Sonne, Wind und fließendes Wasser kommen immer wieder. Sie sind erneuerbar."
            say: "Ganz anders ist es mit der Sonne, dem Wind und dem fließenden Wasser in Bächen und Flüssen. Die Sonne scheint jeden Tag neu, der Wind weht immer wieder, und die Flüsse fließen weiter. Diese Energiequellen gehen nicht zu Ende. Man sagt: Sie sind erneuerbar."
            show: { object: sun }
          - text: "Wusstest du? Kohle ist aus Pflanzen entstanden, die vor vielen Millionen Jahren gewachsen sind."
            say: "Wusstest du? Kohle ist aus Pflanzen entstanden. Vor vielen Millionen Jahren wuchsen in Sümpfen riesige Farne und Bäume. Sie fielen um, Schlamm deckte sie zu, und sie wurden tief in die Erde gedrückt. In sehr langer Zeit wurde daraus Kohle. Manchmal findet man in der Kohle sogar noch den Abdruck eines Blattes!"
            show: { object: leaf }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Erneuerbar oder endlich? Sortiere."
                say: "Kommt die Energiequelle immer wieder, oder geht sie irgendwann zu Ende? Sortiere."
                bins:
                  - { id: ern, show: { text: "erneuerbar" }, say: "erneuerbar" }
                  - { id: end, show: { text: "endlich" }, say: "endlich" }
                options:
                  - { object: sun, bin: ern }
                  - { object: wind, bin: ern }
                  - { object: coal, bin: end }
                  - { object: crude-oil, bin: end }
                hints:
                  - "Erneuerbar heißt: Die Quelle kommt immer wieder. Endlich heißt: Sie geht irgendwann zu Ende."
                  - "Was liegt tief in der Erde und wird verbrannt? Was scheint oder weht jeden Tag neu?"
                  - "Sonne und Wind sind erneuerbar. Kohle und Erdöl sind endlich."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Warum geht das Erdöl irgendwann zu Ende?"
                show: { object: crude-oil }
                options: ["Neues Erdöl entsteht erst in Millionen Jahren.", "Erdöl wird im Sommer schlecht.", "Erdöl fliegt in den Himmel."]
                answer: "Neues Erdöl entsteht erst in Millionen Jahren."
                hints:
                  - "Denk daran, wie lange es gedauert hat, bis das Erdöl entstanden ist."
                  - "Was verbrannt ist, ist weg. Und neues entsteht nur sehr, sehr langsam."
                  - "Neues Erdöl entsteht erst in Millionen Jahren."
              - id: l1-f3
                type: image_multiple_choice
                text: "Draußen pfeift es, und die Bäume wackeln. Welche Energiequelle ist das?"
                options: [{ object: wind }, { object: sun }, { object: snow }]
                answer: wind
                hints:
                  - "Was bewegt die Bäume?"
                  - "Es ist bewegte Luft, die du hören und spüren kannst."
                  - "Das ist der Wind."
                difficulty: easy
              - id: l1-f4
                type: true_false
                text: "Kohle, Erdöl und Erdgas holt man aus der Erde. Stimmt das?"
                answer: true
                hints:
                  - "Wo liegen Kohle, Erdöl und Erdgas?"
                  - "Sie sind vor Millionen Jahren tief unter der Erde entstanden."
                  - "Ja, man holt sie aus der Erde."
              - id: l1-f5
                type: matching
                text: "Was passt zusammen? Verbinde."
                pairs:
                  - { left: { object: crude-oil }, right: { text: "Daraus macht man Benzin und Diesel." } }
                  - { left: { object: coal }, right: { text: "schwarz und hart, aus alten Pflanzen entstanden" } }
                  - { left: { object: wind }, right: { text: "Luft, die sich bewegt" } }
                hints:
                  - "Fang mit dem an, was du sicher weißt."
                  - "Was tankt das Auto? Und was ist aus Pflanzen entstanden?"
                  - "Erdöl: Benzin. Kohle: alte Pflanzen. Wind: bewegte Luft."
              - id: l1-f6
                type: multiple_choice
                text: "Wofür braucht die Heizung Energie?"
                options: ["zum Wärmen", "zum Fahren", "zum Wachsen"]
                answer: "zum Wärmen"
                feedback:
                  "zum Fahren": "Eine Heizung, die durchs Zimmer fährt? Das wäre lustig! Die Heizung braucht Energie, damit es warm wird."
                hints:
                  - "Mit Energie leuchtet etwas, wird warm oder bewegt sich."
                  - "Was macht eine Heizung im Winter mit deinem Zimmer?"
                  - "Zum Wärmen."
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Erneuerbar oder endlich? Sortiere."
                say: "Kommt die Energiequelle immer wieder, oder geht sie irgendwann zu Ende? Sortiere."
                bins:
                  - { id: ern, show: { text: "erneuerbar" }, say: "erneuerbar" }
                  - { id: end, show: { text: "endlich" }, say: "endlich" }
                options:
                  - { text: "fließendes Wasser", bin: ern }
                  - { object: sun, bin: ern }
                  - { object: natural-gas, bin: end }
                  - { object: coal, bin: end }
                hints: ["Was in der Erde liegt und verbrannt wird, ist endlich."]
              - id: l1-s2
                type: true_false
                text: "Heute weht viel Wind. Morgen ist darum kein Wind mehr übrig. Stimmt das?"
                answer: false
                hints: ["Der Wind wird nicht verbraucht. Er weht immer wieder neu."]
              - id: l1-s3
                type: multiple_choice
                text: "Woraus ist Erdöl entstanden?"
                show: { object: crude-oil }
                options: ["aus winzigen Lebewesen im Meer", "aus geschmolzenem Eis", "aus alten Autoreifen"]
                answer: "aus winzigen Lebewesen im Meer"
                hints: ["Erdöl ist vor Millionen Jahren aus Lebewesen entstanden, die im Meer lebten."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Kohle, Erdöl und Erdgas sind _. Sonne, Wind und fließendes Wasser sind _."
                options: ["endlich", "erneuerbar", "flüssig"]
                answer: ["endlich", "erneuerbar"]
                hints: ["Was verbrannt ist, ist weg. Was jeden Tag wiederkommt, ist erneuerbar."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Was fährt mit Benzin oder Diesel aus Erdöl?"
                options: [{ object: car }, { object: bike }, { object: horse }]
                answer: car
                feedback:
                  horse: "Ein Pferd mit Benzin im Bauch? Nein! Ein Pferd frisst Heu. Das Auto tankt Benzin oder Diesel."
                hints: ["Was hat einen Motor und muss an die Tankstelle?"]
              - id: l1-s6
                type: multiple_choice
                text: "Mats' Oma heizt mit Erdgas. Was für eine Energiequelle ist Erdgas?"
                show: { object: natural-gas }
                options: ["endlich", "erneuerbar"]
                answer: "endlich"
                keep_order: true
                hints: ["Erdgas liegt in der Erde, wird verbrannt und ist dann weg."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Erneuerbar oder endlich? Sortiere alle sechs."
                bins:
                  - { id: ern, show: { text: "erneuerbar" }, say: "erneuerbar" }
                  - { id: end, show: { text: "endlich" }, say: "endlich" }
                options:
                  - { object: crude-oil, bin: end }
                  - { object: wind, bin: ern }
                  - { object: natural-gas, bin: end }
                  - { text: "fließendes Wasser", bin: ern }
                  - { object: coal, bin: end }
                  - { object: sun, bin: ern }
              - id: l1-n2
                type: true_false
                text: "Die Sonne scheint jeden Tag neu. Darum ist sie eine erneuerbare Energiequelle. Stimmt das?"
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Welche Energiequelle wird verbrannt?"
                options: ["Erdgas", "Wind", "Sonne"]
                answer: "Erdgas"
              - id: l1-n4
                type: matching
                text: "Wofür brauchen die Dinge Energie? Verbinde."
                pairs:
                  - { left: { object: lamp }, right: { text: "leuchten" } }
                  - { left: { object: radiator }, right: { text: "wärmen" } }
                  - { left: { object: car }, right: { text: "fahren" } }
              - id: l1-n5
                type: multiple_choice
                text: "Mats sagt: „In Millionen Jahren entsteht doch wieder neue Kohle!“\n\nWarum ist Kohle trotzdem endlich?"
                options: ["Wir verbrauchen sie viel schneller, als neue entsteht.", "Weil Kohle schwarz ist.", "Weil Kohle nur im Winter brennt."]
                answer: "Wir verbrauchen sie viel schneller, als neue entsteht."
                difficulty: stretch
              - id: l1-n6
                type: true_false
                text: "Wenn Kohle verbrannt ist, wächst sie im nächsten Jahr wieder nach. Stimmt das?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Energiequelle ist endlich?"
            options: ["Erdöl", "Wind", "Sonne"]
            answer: "Erdöl"
          - id: l1-c2
            type: true_false
            text: "Fließendes Wasser ist eine erneuerbare Energiequelle. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Woraus ist Kohle entstanden?"
            show: { object: coal }
            options: ["aus Pflanzen vor vielen Millionen Jahren", "aus schwarz angemalten Steinen", "aus Ruß aus dem Ofen"]
            answer: "aus Pflanzen vor vielen Millionen Jahren"
          - id: l1-c4
            type: image_multiple_choice
            text: "Welches Bild zeigt eine erneuerbare Energiequelle?"
            options: [{ object: sun }, { object: car }, { object: oven }]
            answer: sun
          - id: l1-c5
            type: true_false
            text: "Erdgas, das verbrannt ist, kann man noch einmal verbrennen. Stimmt das?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Was haben Kohle, Erdöl und Erdgas gemeinsam?"
            options: ["Sie liegen in der Erde und gehen irgendwann zu Ende.", "Sie fallen als Regen vom Himmel.", "Sie wachsen jedes Jahr nach."]
            answer: "Sie liegen in der Erde und gehen irgendwann zu Ende."

  - n: 2
    title: { de: "Strom aus Sonne, Wind und Wasser", en: "Electricity from sun, wind and water" }
    goal:
      de: "Finde heraus, wie aus Sonne, Wind und fließendem Wasser Strom wird. Ein Windrad zum Beispiel macht Strom, ohne etwas zu verbrennen."
      en: "Find out how sun, wind and flowing water are turned into electricity. A wind turbine, for example, makes electricity without burning anything."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Neues Erdöl entsteht in ein paar Wochen. Stimmt das?"
            answer: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche drei Energiequellen sind erneuerbar?"
            options: ["Sonne, Wind, fließendes Wasser", "Kohle, Erdöl, Erdgas", "Sonne, Kohle, Wind"]
            answer: "Sonne, Wind, fließendes Wasser"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Auf dem Dach von Mats' Schule liegen neue dunkelblaue Platten.\n\nWas machen sie dort?"
            say: "Auf dem Dach von Mats' Schule liegen neue dunkelblaue Platten. Sie glänzen in der Sonne. Was glaubst du: Was machen sie dort?"
            show: { object: school }
          - text: "Das ist eine Solaranlage. Sie macht aus Sonnenlicht Strom."
            say: "Das ist eine Solaranlage. Wenn Sonnenlicht auf die Platten fällt, entsteht Strom. Dabei wird nichts verbrannt, und es gibt keinen Rauch. Mit dem Strom leuchten die Lampen in Mats' Klasse."
            show: { object: sun }
          - text: "Ein Windrad macht aus Wind Strom."
            say: "Hinter dem Dorf stehen Windräder. Der Wind dreht ihre langen Flügel. Oben im Windrad steckt eine Maschine, die aus der Drehung Strom macht. Auch hier wird nichts verbrannt."
            show: { object: wind }
          - text: "Ein Wasserkraftwerk macht aus fließendem Wasser Strom."
            say: "Am Fluss steht ein Wasserkraftwerk. Das fließende Wasser dreht darin ein großes Rad, und daraus wird Strom. Früher haben Bäche die Räder von Mühlen gedreht, damit sie Getreide mahlen."
            show: { object: water }
          - text: "Kohle, Erdöl und Erdgas werden verbrannt. Dabei entstehen Abgase, zum Beispiel Kohlendioxid."
            say: "In einem Kohlekraftwerk wird Kohle verbrannt. Auch Erdgas und Benzin werden verbrannt. Dabei kommen Abgase in die Luft, zum Beispiel Kohlendioxid. Zu viel Kohlendioxid macht das Klima auf der Erde wärmer. Solaranlagen, Windräder und Wasserkraftwerke machen beim Stromerzeugen keine Abgase."
            show: { object: coal-power-station }
          - text: "Nachts scheint keine Sonne, und manchmal ist es windstill. Darum nutzt man mehrere Energiequellen zusammen."
            say: "Aber Achtung: Nachts scheint keine Sonne, und an manchen Tagen weht kaum Wind. Dann macht die Solaranlage keinen Strom, und das Windrad steht still. Darum nutzt man mehrere Energiequellen zusammen."
            show: { object: moon }
          - text: "Wusstest du? Manche Windräder sind höher als der Kölner Dom."
            say: "Wusstest du? Manche Windräder sind höher als der Kölner Dom. Und der ist mit seinen zwei Türmen schon über hundertfünfzig Meter hoch!"
            show: { object: wind-turbine }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Was nutzt welche Energiequelle? Verbinde."
                pairs:
                  - { left: { object: solar-panel }, right: { text: "Sonne" } }
                  - { left: { object: wind-turbine }, right: { text: "Wind" } }
                  - { left: { object: hydro-power-station }, right: { text: "fließendes Wasser" } }
                  - { left: { object: coal-power-station }, right: { text: "Kohle" } }
                hints:
                  - "Der Name verrät oft schon die Energiequelle."
                  - "Ein Windrad dreht sich im Wind. Die Solaranlage braucht Sonnenlicht."
                  - "Solaranlage: Sonne. Windrad: Wind. Wasserkraftwerk: fließendes Wasser. Kohlekraftwerk: Kohle."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wann macht die Solaranlage auf Mats' Schuldach am meisten Strom?"
                show: { object: solar-panel }
                options: ["mittags, wenn die Sonne scheint", "um Mitternacht", "wenn es stark schneit"]
                answer: "mittags, wenn die Sonne scheint"
                hints:
                  - "Die Solaranlage macht aus Sonnenlicht Strom."
                  - "Wann fällt das meiste Sonnenlicht auf das Dach?"
                  - "Mittags, wenn die Sonne scheint."
              - id: l2-f3
                type: true_false
                text: "Ein Windrad verbrennt den Wind. Stimmt das?"
                show: { object: wind-turbine }
                answer: false
                hints:
                  - "Was macht der Wind mit den Flügeln?"
                  - "Der Wind dreht die Flügel. Dabei wird nichts verbrannt."
                  - "Nein, im Windrad wird nichts verbrannt."
              - id: l2-f4
                type: image_multiple_choice
                text: "Was dreht die Flügel eines Windrads?"
                options: [{ object: wind }, { object: sun }, { object: rain }]
                answer: wind
                hints:
                  - "Das Windrad hat seinen Namen davon."
                  - "Was bewegt auch Drachen und Blätter?"
                  - "Der Wind."
                difficulty: easy
              - id: l2-f5
                type: sorting
                text: "Wird hier etwas verbrannt? Sortiere."
                bins:
                  - { id: burn, show: { text: "wird verbrannt" }, say: "wird verbrannt" }
                  - { id: noburn, show: { text: "wird nicht verbrannt" }, say: "wird nicht verbrannt" }
                options:
                  - { object: coal-power-station, bin: burn }
                  - { text: "Heizung mit Erdgas", bin: burn }
                  - { object: wind-turbine, bin: noburn }
                  - { object: solar-panel, bin: noburn }
                hints:
                  - "Kohle, Erdöl und Erdgas werden verbrannt."
                  - "Sonne und Wind werden nicht verbrannt. Sie drehen ein Rad oder fallen auf eine Platte."
                  - "Kohlekraftwerk und Gasheizung: wird verbrannt. Windrad und Solaranlage: nicht."
              - id: l2-f6
                type: multiple_choice
                text: "Warum nutzt Mats' Dorf Sonne und Wind zusammen?"
                options: ["Weil nachts keine Sonne scheint und nicht immer Wind weht.", "Weil Windräder Sonnenlicht brauchen.", "Weil die Sonne sonst ausgeht."]
                answer: "Weil nachts keine Sonne scheint und nicht immer Wind weht."
                hints:
                  - "Denk an die Nacht und an windstille Tage."
                  - "Wenn eine Quelle gerade fehlt, hilft die andere."
                  - "Nachts scheint keine Sonne, und nicht immer weht Wind."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Beim Verbrennen von Kohle entstehen Abgase. Stimmt das?"
                answer: true
                hints: ["Was kommt in die Luft, wenn etwas verbrannt wird?"]
              - id: l2-s2
                type: multiple_choice
                text: "Durch Mats' Dorf fließt ein Fluss. Welches Kraftwerk nutzt das fließende Wasser?"
                options: ["ein Wasserkraftwerk", "ein Kohlekraftwerk", "eine Solaranlage"]
                answer: "ein Wasserkraftwerk"
                hints: ["Im Kraftwerk dreht das fließende Wasser ein Rad."]
              - id: l2-s3
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Eine Solaranlage macht aus _ Strom. Ein Windrad macht aus _ Strom."
                options: ["Sonnenlicht", "Wind", "Kohle"]
                answer: ["Sonnenlicht", "Wind"]
                hints: ["Die Platten auf dem Dach brauchen Licht, die Flügel brauchen bewegte Luft."]
              - id: l2-s4
                type: sorting
                text: "Kommt die Energie aus einer erneuerbaren oder aus einer endlichen Quelle? Sortiere."
                bins:
                  - { id: ern, show: { text: "erneuerbar" }, say: "erneuerbar" }
                  - { id: end, show: { text: "endlich" }, say: "endlich" }
                options:
                  - { text: "Strom vom Windrad", bin: ern }
