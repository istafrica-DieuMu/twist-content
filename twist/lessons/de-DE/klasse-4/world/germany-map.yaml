# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.germany-map
skill: world.space.germany-map
curriculum: de-DE
language: de
title:
  de: Deutschland und seine Bundesländer
  en: Germany and its Länder
summary: >
  Nele's Oma Gerda drives a lorry and wants to deliver to every Land of
  Germany in one year, sending Nele a postcard from each. Lesson 1 finds
  the 16 Länder by where they lie: Schleswig-Holstein right in the north
  between the North Sea and the Baltic, Mecklenburg-Vorpommern also on the
  Baltic, Bayern right in the south and the largest, Nordrhein-Westfalen
  right in the west, Sachsen right in the east, Bremen the smallest; the
  three city states Berlin (inside Brandenburg), Hamburg and Bremen (inside
  Niedersachsen); and the child's own Land, which the child asks about at
  home. Lesson 2 delivers to all 16 Land capitals, two tables of eight,
  Berlin as the capital of Germany, and Germany's nine neighbours by
  direction. It ends with the skill check. There is no map of Germany yet,
  so position is taught in words and tables; the drag-the-Länder puzzle
  waits for that drawing. Every name and story is written for Twist.
metadata:
  year: klasse-4
  topic: { de: Deutschland und die Welt, en: Germany and the world }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.space.map-symbols, world.space.compass]
  also_practises: [world.space.compass]
  vocabulary: { de: [Deutschland, Bundesland, Stadtstaat, Landeshauptstadt, Hauptstadt, Landesregierung, Nachbarland, Grenze, Norden, Süden, Osten, Westen, Nordsee, Ostsee] }
  forms: [text, audio, picture, drawn]
  drawn: [table]
  facets: []
  parts:
    - { id: position, what: { de: "Bundesländer und Nachbarländer nach ihrer Lage finden: Norden, Süden, Osten, Westen, am Meer", en: "finding Länder and neighbouring countries by where they lie: north, south, east, west, by the sea" } }
    - { id: laender, what: { de: "die 16 Bundesländer, die drei Stadtstaaten, das größte und das kleinste Land und das eigene Bundesland kennen", en: "knowing the 16 Länder, the three city states, the largest and smallest Land and one's own Land" } }
    - { id: capitals, what: { de: "Landeshauptstädte zuordnen und Berlin als Hauptstadt Deutschlands nennen", en: "matching Land capitals and naming Berlin as the capital of Germany" } }
  misconceptions:
    - id: biggest-is-capital
      what: Thinks the biggest or best-known city of a Land is its capital (Frankfurt for Hessen, Köln for Nordrhein-Westfalen)
      addressed: "lesson 2 Learn tables and the screen on big cities; l2-f5, l2-s3, l2-s4 and l2-c17, l2-c19, with feedback on l2-f1"
    - id: city-state-inside
      what: Thinks Berlin belongs to Brandenburg and Bremen to Niedersachsen because they lie inside them
      addressed: "lesson 1 Learn screen on city states; l1-f3, l1-f5, l1-s4, l1-c4 and l2-c11, with feedback on l2-f1"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Postkarten aus 16 Ländern", en: "Postcards from 16 Länder" }
    goal:
      de: "Finde heraus, wo die Bundesländer liegen. Schleswig-Holstein zum Beispiel liegt ganz im Norden."
      en: "Find out where the Länder lie. Schleswig-Holstein, for example, is right in the north."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Himmelsrichtung ist auf einer Karte fast immer oben?"
            options: ["Norden", "Süden", "Westen"]
            answer: "Norden"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Auf den meisten Karten ist Wasser grün. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Oma Gerda will in einem Jahr in jedes Bundesland fahren.\n\nWas glaubst du: Wie viele sind es? 6, 16 oder 60?"
            say: "Neles Oma Gerda fährt Lastwagen. In einem Jahr will sie in jedes Bundesland von Deutschland fahren und Nele aus jedem eine Postkarte schicken. Was glaubst du: Wie viele Bundesländer sind es? Sechs, sechzehn oder sechzig?"
            show: { object: lorry }
          - text: "Deutschland hat 16 Bundesländer. Zusammen sind sie ein Land."
            say: "Es sind sechzehn! Deutschland besteht aus sechzehn Bundesländern. Auf einer Karte von Deutschland siehst du sie wie Puzzleteile nebeneinander. Zusammen sind sie ein Land: Deutschland."
            show: { object: map }
          - text: "Ganz im Norden: Schleswig-Holstein, zwischen Nordsee und Ostsee.\nAuch an der Ostsee: Mecklenburg-Vorpommern.\nGanz im Süden: Bayern."
            say: "Die erste Postkarte kommt aus Schleswig-Holstein. Das Land liegt ganz im Norden, zwischen zwei Meeren: links die Nordsee, rechts die Ostsee. Auch Mecklenburg-Vorpommern liegt an der Ostsee. Ganz im Süden, an den Bergen, liegt Bayern."
            show: { object: ship }
          - text: "Ganz im Westen: Nordrhein-Westfalen.\nGanz im Osten: Sachsen."
            say: "Fährt Oma Gerda ganz nach Westen, kommt sie nach Nordrhein-Westfalen. Fährt sie ganz nach Osten, kommt sie nach Sachsen."
          - text: "Norden: Schleswig-Holstein, Mecklenburg-Vorpommern, Niedersachsen, Brandenburg\nSüden: Bayern, Baden-Württemberg, Rheinland-Pfalz, Saarland\nWesten: Nordrhein-Westfalen, Rheinland-Pfalz, Saarland\nOsten: Brandenburg, Sachsen, Mecklenburg-Vorpommern"
            say: "So kannst du dir die Lage merken. Im Norden liegen Schleswig-Holstein, Mecklenburg-Vorpommern, Niedersachsen und Brandenburg. Im Süden liegen Bayern, Baden-Württemberg, Rheinland-Pfalz und das Saarland. Im Westen liegen Nordrhein-Westfalen, Rheinland-Pfalz und das Saarland. Im Osten liegen Brandenburg, Sachsen und Mecklenburg-Vorpommern. Manche Länder liegen zum Beispiel im Norden und im Osten zugleich. Hessen und Thüringen liegen in der Mitte."
          - text: "Am größten ist Bayern. Am kleinsten ist Bremen."
            say: "Die Bundesländer sind verschieden groß. Am größten ist Bayern. Am kleinsten ist Bremen."
          - text: "Drei Bundesländer sind nur eine Stadt: Berlin, Hamburg und Bremen. Sie heißen Stadtstaaten.\nBerlin liegt mitten in Brandenburg. Bremen liegt mitten in Niedersachsen."
            say: "Drei Bundesländer sind nur eine Stadt: Berlin, Hamburg und Bremen. Man nennt sie Stadtstaaten. Berlin liegt mitten in Brandenburg, und Bremen liegt mitten in Niedersachsen. Trotzdem gehören sie nicht dazu. Sie sind eigene Bundesländer. Hamburg liegt zwischen Schleswig-Holstein und Niedersachsen."
            show: { object: house }
          - text: "Und du? Frag zu Hause: In welchem Bundesland wohnen wir? Dann such es in der Liste."
            say: "Und du? Jeder Ort in Deutschland liegt in einem Bundesland. Frag zu Hause, in welchem Bundesland ihr wohnt. Dann such es in der Liste. Liegt dein Land im Norden, im Süden, im Osten, im Westen oder in der Mitte?"
          - text: "Wusstest du? Das Bundesland Bremen besteht aus zwei Städten: Bremen und Bremerhaven."
            say: "Wusstest du? Das kleinste Bundesland, Bremen, besteht aus zwei Städten: Bremen und Bremerhaven. Dazwischen liegt ein Stück Niedersachsen. Wer von Bremen nach Bremerhaven fährt, ist unterwegs also kurz in einem anderen Bundesland."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Oma Gerda schreibt: „Ich bin ganz im Norden. Links von mir ist die Nordsee, rechts die Ostsee.“\n\nIn welchem Bundesland ist sie?"
                options: ["Schleswig-Holstein", "Bayern", "Hessen"]
                answer: "Schleswig-Holstein"
                hints:
                  - "Welches Bundesland liegt zwischen zwei Meeren?"
                  - "Bayern liegt ganz im Süden, Hessen in der Mitte."
                  - "Schleswig-Holstein liegt ganz im Norden, zwischen Nordsee und Ostsee."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Liegt das Bundesland im Norden oder im Süden? Sortiere."
                bins:
                  - { id: nord, show: { text: "Norden" }, say: "Norden" }
                  - { id: sued, show: { text: "Süden" }, say: "Süden" }
                options:
                  - { text: "Bayern", bin: sued }
                  - { text: "Schleswig-Holstein", bin: nord }
                  - { text: "Baden-Württemberg", bin: sued }
                  - { text: "Niedersachsen", bin: nord }
                hints:
                  - "Schleswig-Holstein liegt an den Meeren, Bayern an den Bergen."
                  - "Denk an die Liste: Wer gehört zum Norden, wer zum Süden?"
                  - "Norden: Schleswig-Holstein und Niedersachsen. Süden: Bayern und Baden-Württemberg."
              - id: l1-f3
                type: true_false
                text: "Berlin ist eine Stadt und zugleich ein Bundesland. Stimmt das?"
                answer: true
                hints:
                  - "Drei Bundesländer sind nur eine Stadt."
                  - "Sie heißen Stadtstaaten: Berlin, Hamburg und Bremen."
                  - "Ja, Berlin ist ein Stadtstaat."
              - id: l1-f4
                type: text_input
                text: "Oma Gerda war schon in 9 Bundesländern. In wie vielen Bundesländern war sie noch nicht?"
                answer: "7"
                hints:
                  - "Wie viele Bundesländer hat Deutschland insgesamt?"
                  - "Es sind 16. Neun davon hat sie schon besucht."
                  - "16 − 9 = 7"
              - id: l1-f5
                type: multiple_choice
                text: "Bremen liegt mitten in einem anderen Bundesland. In welchem?"
                options: ["Niedersachsen", "Bayern", "Sachsen"]
                answer: "Niedersachsen"
                hints:
                  - "Bremen liegt im Norden, nicht weit von der Nordsee."
                  - "Bayern liegt im Süden, Sachsen im Osten."
                  - "Bremen liegt mitten in Niedersachsen."
              - id: l1-f6
                type: matching
                text: "Wo liegt das Bundesland? Verbinde."
                pairs:
                  - { left: { text: "Schleswig-Holstein" }, right: { text: "ganz im Norden" } }
                  - { left: { text: "Bayern" }, right: { text: "ganz im Süden" } }
                  - { left: { text: "Nordrhein-Westfalen" }, right: { text: "ganz im Westen" } }
                  - { left: { text: "Sachsen" }, right: { text: "ganz im Osten" } }
                hints:
                  - "Manchmal steckt die Richtung im Namen."
                  - "Nordrhein-Westfalen hat Westen im Namen. Schleswig-Holstein liegt an den Meeren."
                  - "Schleswig-Holstein Norden, Bayern Süden, Nordrhein-Westfalen Westen, Sachsen Osten."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Stadt ist auch ein Bundesland?"
                options: ["Hamburg", "München", "Köln"]
                answer: "Hamburg"
                hints: ["Nur drei Städte sind auch Bundesländer: Berlin, Hamburg und Bremen."]
              - id: l1-s2
                type: true_false
                text: "Bayern ist das kleinste Bundesland. Stimmt das?"
                answer: false
                hints: ["Bayern ist ganz anders: Es ist das größte Bundesland."]
              - id: l1-s3
                type: sorting
                text: "Liegt das Bundesland im Westen oder im Osten? Sortiere."
                bins:
                  - { id: west, show: { text: "Westen" }, say: "Westen" }
                  - { id: ost, show: { text: "Osten" }, say: "Osten" }
                options:
                  - { text: "Sachsen", bin: ost }
                  - { text: "Nordrhein-Westfalen", bin: west }
                  - { text: "Brandenburg", bin: ost }
                  - { text: "Saarland", bin: west }
                hints: ["Nordrhein-Westfalen und das Saarland liegen an der Grenze zu Frankreich, Belgien und den Niederlanden."]
              - id: l1-s4
                type: multiple_choice
                text: "Oma Gerda fährt einmal rund um Berlin. Durch welches Bundesland fährt sie dabei?"
                options: ["Brandenburg", "Bayern", "Hessen"]
                answer: "Brandenburg"
                hints: ["Berlin liegt mitten in einem anderen Bundesland."]
              - id: l1-s5
                type: text_input
                text: "Drei Bundesländer sind Stadtstaaten. Wie viele der 16 Bundesländer sind keine Stadtstaaten?"
                answer: "13"
                hints: ["Rechne 16 − 3."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Bundesland ist das größte?"
                options: ["Bayern", "Bremen", "Saarland"]
                answer: "Bayern"
              - id: l1-n2
                type: true_false
                text: "Schleswig-Holstein liegt ganz im Süden von Deutschland. Stimmt das?"
                answer: false
              - id: l1-n3
                type: sorting
                text: "Stadtstaat oder nicht? Sortiere."
                bins:
                  - { id: stadt, show: { text: "Stadtstaat" }, say: "Stadtstaat" }
                  - { id: land, show: { text: "kein Stadtstaat" }, say: "kein Stadtstaat" }
                options:
                  - { text: "Sachsen", bin: land }
                  - { text: "Bremen", bin: stadt }
                  - { text: "Hessen", bin: land }
                  - { text: "Berlin", bin: stadt }
              - id: l1-n4
                type: multiple_choice
                text: "Oma Gerda will an die Ostsee. In welche zwei Bundesländer kann sie fahren?"
                options: ["Schleswig-Holstein und Mecklenburg-Vorpommern", "Bayern und Baden-Württemberg", "Hessen und Thüringen"]
                answer: "Schleswig-Holstein und Mecklenburg-Vorpommern"
                feedback:
                  "Bayern und Baden-Württemberg": "Dann landet Oma Gerda in den Bergen statt am Strand! Die Ostsee liegt im Norden."
              - id: l1-n5
                type: multiple_choice
                text: "Mila wohnt in Köln. Köln liegt in Nordrhein-Westfalen.\n\nWas ist Nordrhein-Westfalen für Mila?"
                options: ["ihr Bundesland", "ihr Nachbarland", "ihre Stadt"]
                answer: "ihr Bundesland"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Bundesland liegt ganz im Norden?"
            options: ["Schleswig-Holstein", "Bayern", "Saarland"]
            answer: "Schleswig-Holstein"
          - id: l1-c2
            type: true_false
            text: "Deutschland hat 16 Bundesländer. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Welches Bundesland ist das kleinste?"
            options: ["Bremen", "Bayern", "Nordrhein-Westfalen"]
            answer: "Bremen"
          - id: l1-c4
            type: true_false
            text: "Brandenburg liegt mitten in Berlin. Stimmt das?"
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Welche drei Bundesländer sind Stadtstaaten?"
            options: ["Berlin, Hamburg und Bremen", "Berlin, München und Köln", "Bayern, Sachsen und Hessen"]
            answer: "Berlin, Hamburg und Bremen"
          - id: l1-c6
            type: multiple_choice
            text: "Welches Bundesland liegt ganz im Westen?"
            options: ["Nordrhein-Westfalen", "Sachsen", "Brandenburg"]
            answer: "Nordrhein-Westfalen"

  - n: 2
    title: { de: "Pakete für 16 Hauptstädte", en: "Parcels for 16 capitals" }
    goal:
      de: "Finde zu jedem Bundesland seine Landeshauptstadt. Die Hauptstadt von Bayern zum Beispiel ist München."
      en: "Find the capital of each Land. The capital of Bayern, for example, is München."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches Bundesland liegt ganz im Süden?"
            options: ["Bayern", "Schleswig-Holstein", "Bremen"]
            answer: "Bayern"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Berlin, Hamburg und Bremen sind Stadtstaaten. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Oma Gerda hat ein Paket für die Regierung von Bayern.\n\nWas glaubst du: Wohin fährt sie? Nach Nürnberg, nach Augsburg oder nach München?"
            say: "Heute hat Oma Gerda ein Paket für die Regierung von Bayern. Was glaubst du: Wohin muss sie fahren? Nach Nürnberg, nach Augsburg oder nach München?"
            show: { object: lorry }
          - text: "Nach München! Jedes Bundesland hat eine Landeshauptstadt. Dort arbeitet die Landesregierung."
            say: "Nach München! Jedes Bundesland hat eine Landeshauptstadt. Dort arbeitet die Regierung des Landes. Die Hauptstadt von Bayern ist München. Berlin ist sogar zweimal Hauptstadt: von seinem Bundesland und von ganz Deutschland."
          - text: "Die Landeshauptstädte im Norden und Osten"
            say: "Hier sind acht Landeshauptstädte. Schleswig-Holstein: Kiel. Hamburg: Hamburg. Bremen: Bremen. Niedersachsen: Hannover. Mecklenburg-Vorpommern: Schwerin. Brandenburg: Potsdam. Berlin: Berlin. Sachsen-Anhalt: Magdeburg."
            show: { drawn: table, rows: [["Bundesland", "Landeshauptstadt"], ["Schleswig-Holstein", "Kiel"], ["Hamburg", "Hamburg"], ["Bremen", "Bremen"], ["Niedersachsen", "Hannover"], ["Mecklenburg-Vorpommern", "Schwerin"], ["Brandenburg", "Potsdam"], ["Berlin", "Berlin"], ["Sachsen-Anhalt", "Magdeburg"]] }
          - text: "Die Landeshauptstädte im Westen, in der Mitte und im Süden"
            say: "Und hier die anderen acht. Nordrhein-Westfalen: Düsseldorf. Hessen: Wiesbaden. Thüringen: Erfurt. Sachsen: Dresden. Rheinland-Pfalz: Mainz. Saarland: Saarbrücken. Baden-Württemberg: Stuttgart. Bayern: München."
            show: { drawn: table, rows: [["Bundesland", "Landeshauptstadt"], ["Nordrhein-Westfalen", "Düsseldorf"], ["Hessen", "Wiesbaden"], ["Thüringen", "Erfurt"], ["Sachsen", "Dresden"], ["Rheinland-Pfalz", "Mainz"], ["Saarland", "Saarbrücken"], ["Baden-Württemberg", "Stuttgart"], ["Bayern", "München"]] }
          - text: "Aufgepasst: Frankfurt liegt in Hessen, Köln in Nordrhein-Westfalen. Beide sind keine Landeshauptstadt."
            say: "Aufgepasst! Die bekannteste Stadt ist nicht immer die Hauptstadt. Frankfurt liegt in Hessen, aber die Hauptstadt von Hessen ist Wiesbaden. Köln liegt in Nordrhein-Westfalen, aber die Hauptstadt ist Düsseldorf. Ein Trick für das Saarland: Saarbrücken hat das Saar schon im Namen."
          - text: "Deutschland hat 9 Nachbarländer.\nNorden: Dänemark\nOsten: Polen, Tschechien\nSüden: Österreich, Schweiz\nWesten: Frankreich, Luxemburg, Belgien, Niederlande"
            say: "Manchmal fährt Oma Gerda sogar über die Grenze. Deutschland hat neun Nachbarländer. Im Norden liegt Dänemark. Im Osten liegen Polen und Tschechien. Im Süden liegen Österreich und die Schweiz. Im Westen liegen Frankreich, Luxemburg, Belgien und die Niederlande."
          - text: "Wusstest du? Hamburg hat mehr Brücken als Venedig."
            say: "Wusstest du? Hamburg hat mehr Brücken als Venedig in Italien. Dort gibt es viele Kanäle, und doch hat Hamburg mit seinen Flüssen, Kanälen und dem Hafen noch viel mehr Brücken."
            show: { object: bridge }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Oma Gerda bringt ein Paket zur Regierung von Niedersachsen. Wohin fährt sie?"
                options: ["nach Hannover", "nach Bremen", "nach Kiel"]
                answer: "nach Hannover"
                feedback:
                  "nach Bremen": "Bremen liegt zwar mitten in Niedersachsen, ist aber ein eigenes Bundesland mit eigener Regierung."
                hints:
                  - "Gesucht ist die Landeshauptstadt von Niedersachsen."
                  - "Kiel gehört zu Schleswig-Holstein, Bremen ist ein eigenes Bundesland."
                  - "Die Hauptstadt von Niedersachsen ist Hannover."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Welche Landeshauptstadt gehört zu welchem Bundesland? Verbinde."
                pairs:
                  - { left: { text: "Schleswig-Holstein" }, right: { text: "Kiel" } }
                  - { left: { text: "Sachsen" }, right: { text: "Dresden" } }
                  - { left: { text: "Hessen" }, right: { text: "Wiesbaden" } }
                  - { left: { text: "Baden-Württemberg" }, right: { text: "Stuttgart" } }
                hints:
                  - "Fang mit dem an, das du sicher weißt."
                  - "Kiel liegt ganz im Norden, Stuttgart im Süden."
                  - "Schleswig-Holstein Kiel, Sachsen Dresden, Hessen Wiesbaden, Baden-Württemberg Stuttgart."
              - id: l2-f3
                type: true_false
                text: "Berlin ist die Hauptstadt von Deutschland. Stimmt das?"
                answer: true
                hints:
                  - "Berlin ist zweimal Hauptstadt."
                  - "Berlin ist Hauptstadt von seinem Bundesland und von ganz Deutschland."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: fill_in_blank
                text: "Welche Städte passen?"
                frame: "Die Hauptstadt von Thüringen ist _. Die Hauptstadt von Sachsen-Anhalt ist _."
                options: ["Erfurt", "Magdeburg", "Dresden", "Potsdam"]
                answer: ["Erfurt", "Magdeburg"]
                hints:
                  - "Dresden gehört zu Sachsen, Potsdam zu Brandenburg."
                  - "Es bleiben Erfurt und Magdeburg. Welche gehört zu Thüringen?"
                  - "Thüringen: Erfurt. Sachsen-Anhalt: Magdeburg."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Stadt fehlt in der Tabelle?"
                show: { drawn: table, rows: [["Bundesland", "Landeshauptstadt"], ["Saarland", "Saarbrücken"], ["Rheinland-Pfalz", "?"]] }
                options: ["Mainz", "Trier", "Köln"]
                answer: "Mainz"
                hints:
                  - "Köln liegt in Nordrhein-Westfalen."
                  - "Trier liegt zwar in Rheinland-Pfalz, ist aber nicht die Hauptstadt."
                  - "Die Hauptstadt von Rheinland-Pfalz ist Mainz."
              - id: l2-f6
                type: multiple_choice
                text: "Oma Gerda fährt von Deutschland aus nach Norden über die Grenze. In welches Land kommt sie?"
                options: ["Dänemark", "Österreich", "Frankreich"]
                answer: "Dänemark"
                hints:
                  - "Im Norden hat Deutschland nur ein Nachbarland."
                  - "Österreich liegt im Süden, Frankreich im Westen."
                  - "Im Norden liegt Dänemark."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Welche Landeshauptstadt gehört zu welchem Bundesland? Verbinde."
                pairs:
                  - { left: { text: "Bayern" }, right: { text: "München" } }
                  - { left: { text: "Nordrhein-Westfalen" }, right: { text: "Düsseldorf" } }
                  - { left: { text: "Brandenburg" }, right: { text: "Potsdam" } }
                  - { left: { text: "Mecklenburg-Vorpommern" }, right: { text: "Schwerin" } }
                hints: ["Potsdam liegt gleich neben Berlin, Schwerin weiter im Norden."]
              - id: l2-s2
                type: sorting
                text: "Ist das ein Nachbarland von Deutschland? Sortiere."
                bins:
                  - { id: ja, show: { text: "Nachbarland" }, say: "Nachbarland" }
                  - { id: nein, show: { text: "kein Nachbarland" }, say: "kein Nachbarland" }
                options:
                  - { text: "Polen", bin: ja }
                  - { text: "Spanien", bin: nein }
