# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.bike-parts
skill: world.space.bike-parts
curriculum: de-DE
language: de
title:
  de: Das verkehrssichere Fahrrad
  en: The roadworthy bike
summary: >
  Ole gets his bike ready for the Radfahrausbildung with his Oma Gerda.
  Lesson 1 is what a verkehrssicheres Fahrrad must have, as the StVZO
  says: two brakes that work independently of each other, a bell that
  rings clearly (a horn is not allowed), a white headlight and a white
  reflector at the front, a red rear light and a red reflector at the
  back, yellow reflectors on the pedals facing forwards and backwards, and
  on each wheel two yellow spoke reflectors or white reflective stripes on
  the tyres; the lights may run on a dynamo or a battery; a stand, basket
  or carrier is nice but not required. Lesson 2 is what each part is for
  and the bike check before a ride: pull each brake, lights on, ring the
  bell, tyres, chain, handlebar and saddle tight, saddle height (sitting,
  the tips of the toes reach the ground), and the helmet sitting straight
  over the forehead with the chin strap closed, one finger's room under
  it. A broken part means repair first, then ride. It ends with the skill
  check.
metadata:
  year: klasse-4
  topic: { de: Mit dem Fahrrad unterwegs, en: Out on a bike }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.space.see-be-seen]
  also_practises: [world.space.see-be-seen]
  vocabulary: { de: [verkehrssicher, Vorderradbremse, Hinterradbremse, Rücktrittbremse, Klingel, Scheinwerfer, Rücklicht, Rückstrahler, Pedalrückstrahler, Speichenrückstrahler, Reflexstreifen, Dynamo, Akku, Sattel, Lenker, Kette, Reifen, Helm, Kinnriemen, Fahrrad-Check] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: equipment, what: { de: "sagen, was an einem verkehrssicheren Fahrrad sein muss und was keine Pflicht ist", en: "saying what a roadworthy bike must have and what is not required" } }
    - { id: colours, what: { de: "Licht und Rückstrahler mit ihrer Farbe und ihrem Platz zuordnen", en: "matching lights and reflectors to their colour and place" } }
    - { id: bike-check, what: { de: "sagen, wozu die Teile da sind, und vor der Fahrt Fahrrad und Helm prüfen", en: "saying what the parts are for and checking the bike and helmet before a ride" } }
  misconceptions:
    - id: one-brake-enough
      what: Thinks one brake, or a coaster brake alone, is enough
      addressed: "lesson 1 Learn says two brakes that work independently; l1-f5, l1-s5, l1-n5 and l2-c2 test it"
    - id: extras-required
      what: Takes a stand, basket or carrier to be required, or misses that a bell is
      addressed: "lesson 1 Learn sets the required parts against the nice extras; l1-f2, l1-n1, l1-c2, l2-c1 and l2-c6 sort them"
    - id: front-back-colours
      what: Mixes up the colours, putting a red light or reflector at the front or white at the back
      addressed: "lesson 1 Learn names white at the front, red at the back and yellow at the side; l1-f4, l1-f6, l1-n3, l2-c8, l2-c13 and l2-c14 test it"
    - id: parts-are-enough
      what: Thinks a bike with all the parts is safe without checking that they work
      addressed: "lesson 2 Learn opens with the question and the check; l2-f2, l2-f5, l2-n1 and l2-c15, l2-c18 test it, with feedback on l2-f2"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Was ein Fahrrad braucht", en: "What a bike needs" }
    goal:
      de: "Lerne, was an einem verkehrssicheren Fahrrad sein muss. Zum Beispiel zwei Bremsen und hinten ein rotes Licht."
      en: "Learn what a roadworthy bike must have. For example two brakes and a red light at the back."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wann ist es besonders wichtig, dass Autofahrer dich gut sehen?"
            options: ["wenn es dunkel ist oder regnet", "nur mittags bei Sonne", "nie"]
            answer: "wenn es dunkel ist oder regnet"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ein Rückstrahler leuchtet nur, wenn Licht auf ihn fällt. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ole will bei der Radfahrausbildung mitmachen. Oma Gerda fragt: „Ist dein Rad verkehrssicher?“\n\nWas muss ein Fahrrad unbedingt haben?"
            say: "Ole will bei der Radfahrausbildung in der Schule mitmachen. Oma Gerda fragt: Ist dein Rad überhaupt verkehrssicher? Was glaubst du: Was muss ein Fahrrad unbedingt haben?"
            show: { object: bike }
          - text: "Zwei Bremsen, die unabhängig voneinander bremsen"
            say: "Zuerst die Bremsen. Ein verkehrssicheres Fahrrad hat zwei Bremsen, die unabhängig voneinander bremsen. Meistens ist eine für das Vorderrad und eine für das Hinterrad. Geht eine kaputt, kannst du mit der anderen noch anhalten. Eine Rücktrittbremse allein reicht also nicht."
            show: { object: brake }
          - text: "Eine Klingel, die hell klingt. Eine Hupe ist am Fahrrad nicht erlaubt."
            say: "Dann die Klingel. Mit ihr warnst du andere, zum Beispiel einen Fußgänger, der dich nicht kommen sieht. Sie muss hell klingen. Eine Hupe ist am Fahrrad nicht erlaubt."
            show: { object: bell }
          - text: "Vorne: weißes Licht und weißer Rückstrahler\nHinten: rotes Licht und roter Rückstrahler"
            say: "Vorne hat das Fahrrad einen Scheinwerfer mit weißem Licht und einen weißen Rückstrahler. Hinten hat es ein rotes Rücklicht und einen roten Rückstrahler. Das Licht darf mit einem Dynamo oder mit einem Akku leuchten."
          - text: "Pedale: gelbe Rückstrahler\nRäder: an jedem Rad zwei gelbe Rückstrahler in den Speichen oder weiße Streifen am Reifen"
            say: "An den Pedalen sind gelbe Rückstrahler, nach vorne und nach hinten. An jedem Rad sind zwei gelbe Rückstrahler in den Speichen. Statt der Speichenrückstrahler können die Reifen auch weiße Streifen haben, die im Licht aufleuchten. So sieht man dich auch von der Seite."
          - text: "Schön, aber keine Pflicht: Ständer, Korb, Gepäckträger"
            say: "Und der Fahrradständer, der Korb oder der Gepäckträger? Die sind praktisch, aber keine Pflicht. Ein Fahrrad ohne Korb ist trotzdem verkehrssicher."
            show: { object: bike-basket }
          - text: "Wusstest du? Im Gesetz heißt die Fahrradklingel „helltönende Glocke“."
            say: "Wusstest du? Im Gesetz für Fahrzeuge heißt die Fahrradklingel nicht Klingel, sondern helltönende Glocke. Das steht dort wirklich so."
            show: { object: bell }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Ole prüft sein Rad. Was muss an jedes verkehrssichere Fahrrad?"
                options: [{ object: bell }, { object: kite }, { object: teddy }]
                answer: bell
                feedback:
                  teddy: "Ein Teddy im Korb ist süß, aber keine Pflicht. Die Klingel muss dran."
                hints:
                  - "Womit warnst du andere?"
                  - "Es klingt hell, wenn du drückst."
                  - "Die Klingel."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Muss das ans Fahrrad, oder ist es nur praktisch? Sortiere."
                bins:
                  - { id: must, show: { text: "muss dran" }, say: "muss dran" }
                  - { id: extra, show: { text: "keine Pflicht" }, say: "keine Pflicht" }
                options:
                  - { object: bell, bin: must }
                  - { text: "zwei Bremsen", bin: must }
                  - { object: bike-basket, bin: extra }
                  - { object: kickstand, bin: extra }
                hints:
                  - "Frag dich: Hilft es beim Anhalten, beim Warnen oder beim Gesehenwerden?"
                  - "Bremsen und Klingel sind Pflicht. Ständer und Korb sind nur praktisch."
                  - "Klingel und zwei Bremsen: muss dran. Korb und Ständer: keine Pflicht."
              - id: l1-f3
                type: multiple_choice
                text: "Welche Farbe hat das Rücklicht?"
                options: ["rot", "weiß", "grün"]
                answer: "rot"
                hints:
                  - "Das Rücklicht ist hinten."
                  - "Vorne ist das Licht weiß, hinten hat es eine andere Farbe."
                  - "Rot."
              - id: l1-f4
                type: matching
                text: "Welche Farbe hat der Rückstrahler? Verbinde."
                pairs:
                  - { left: { text: "vorne" }, right: { text: "weiß" } }
                  - { left: { text: "hinten" }, right: { text: "rot" } }
                  - { left: { text: "an den Pedalen" }, right: { text: "gelb" } }
                hints:
                  - "Vorne passt die Farbe zum Scheinwerfer, hinten zum Rücklicht."
                  - "Vorne weiß wie der Scheinwerfer, hinten rot wie das Rücklicht."
                  - "Vorne weiß, hinten rot, an den Pedalen gelb."
              - id: l1-f5
                type: true_false
                text: "Ein Fahrrad mit nur einer Bremse ist verkehrssicher. Stimmt das?"
                answer: false
                hints:
                  - "Was passiert, wenn diese eine Bremse kaputtgeht?"
                  - "Ein verkehrssicheres Fahrrad hat zwei Bremsen."
                  - "Nein, das stimmt nicht."
              - id: l1-f6
                type: fill_in_blank
                text: "Welche Farben passen?"
                frame: "Vorne leuchtet das Licht _. Hinten leuchtet das Licht _."
                options: ["weiß", "rot", "gelb", "blau"]
                answer: ["weiß", "rot"]
                hints:
                  - "Der Scheinwerfer zeigt dir den Weg, das Rücklicht zeigt dich den Autos hinter dir."
                  - "Vorne ist es wie das Licht einer Taschenlampe."
                  - "Vorne weiß, hinten rot."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ole möchte statt der Klingel eine laute Hupe an sein Rad bauen. Ist das erlaubt?"
                options: ["Nein, am Fahrrad muss eine Klingel sein.", "Ja, je lauter, desto besser.", "Ja, aber nur am Sonntag."]
                answer: "Nein, am Fahrrad muss eine Klingel sein."
                hints: ["Eine Hupe ist am Fahrrad nicht erlaubt."]
              - id: l1-s2
                type: sorting
                text: "Gelb oder rot? Sortiere."
                bins:
                  - { id: yellow, show: { text: "gelb" }, say: "gelb" }
                  - { id: red, show: { text: "rot" }, say: "rot" }
                options:
                  - { text: "Rückstrahler an den Pedalen", bin: yellow }
                  - { text: "Rückstrahler in den Speichen", bin: yellow }
                  - { text: "Rücklicht", bin: red }
                  - { text: "Rückstrahler hinten", bin: red }
                hints: ["Was an der Seite und an den Pedalen ist, ist gelb. Hinten ist alles rot."]
              - id: l1-s3
                type: true_false
                text: "Das Fahrradlicht darf auch mit einem Akku leuchten. Stimmt das?"
                answer: true
                hints: ["Das Licht darf mit einem Dynamo oder mit einem Akku leuchten."]
              - id: l1-s4
                type: text_input
                text: "Oles Fahrrad hat zwei Räder. An jedem Rad sind zwei gelbe Speichenrückstrahler. Wie viele sind es zusammen?"
                answer: "4"
                hints: ["Zwei Räder mit je zwei Rückstrahlern: 2 + 2."]
              - id: l1-s5
                type: multiple_choice
                text: "Warum hat ein Fahrrad zwei Bremsen?"
                options: ["Wenn eine kaputt ist, kannst du mit der anderen noch bremsen.", "Damit es schneller fährt.", "Damit es schöner aussieht."]
                answer: "Wenn eine kaputt ist, kannst du mit der anderen noch bremsen."
                hints: ["Die zwei Bremsen bremsen unabhängig voneinander."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Pflicht oder keine Pflicht? Sortiere."
                bins:
                  - { id: must, show: { text: "Pflicht" }, say: "Pflicht" }
                  - { id: extra, show: { text: "keine Pflicht" }, say: "keine Pflicht" }
                options:
                  - { object: rear-light, bin: must }
                  - { text: "Rückstrahler an den Pedalen", bin: must }
                  - { object: luggage-rack, bin: extra }
                  - { object: bike-basket, bin: extra }
              - id: l1-n2
                type: multiple_choice
                text: "Am Hinterrad von Oles Rad fehlen die gelben Rückstrahler, und der Reifen hat keinen weißen Streifen. Was ist das Problem?"
                options: ["Von der Seite sieht man ihn im Dunkeln schlecht.", "Er kann nicht mehr bremsen.", "Er kann nicht mehr klingeln."]
                answer: "Von der Seite sieht man ihn im Dunkeln schlecht."
              - id: l1-n3
                type: true_false
                text: "Vorne am Fahrrad ist ein roter Rückstrahler. Stimmt das?"
                answer: false
              - id: l1-n4
                type: matching
                text: "Welche Farbe hat es? Verbinde."
                pairs:
                  - { left: { text: "Scheinwerfer" }, right: { text: "weiß" } }
                  - { left: { text: "Rücklicht" }, right: { text: "rot" } }
                  - { left: { text: "Speichenrückstrahler" }, right: { text: "gelb" } }
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele Bremsen hat ein verkehrssicheres Fahrrad mindestens?"
                options: ["1", "2", "4"]
                answer: "2"
                keep_order: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was gehört an jedes Fahrrad?"
            options: [{ object: crown }, { object: bell }, { object: ball }]
            answer: bell
          - id: l1-c2
            type: true_false
            text: "Ein Fahrradständer ist Pflicht. Stimmt das?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Welche Farbe haben die Rückstrahler an den Pedalen?"
            options: ["gelb", "rot", "blau"]
            answer: "gelb"
          - id: l1-c4
            type: multiple_choice
            text: "Was ist am Fahrrad nicht erlaubt?"
            options: ["eine Hupe", "eine Klingel", "ein Rücklicht"]
            answer: "eine Hupe"
          - id: l1-c5
            type: true_false
            text: "Hinten am Fahrrad sind ein rotes Licht und ein roter Rückstrahler. Stimmt das?"
            answer: true
          - id: l1-c6
            type: text_input
            text: "Ein Fahrrad hat 2 Pedale. An jedem Pedal sind 2 gelbe Rückstrahler, einer nach vorne und einer nach hinten. Wie viele Pedalrückstrahler sind es?"
            answer: "4"

  - n: 2
    title: { de: "Der Fahrrad-Check", en: "The bike check" }
    goal:
      de: "Prüfe vor der Fahrt, ob dein Fahrrad und dein Helm in Ordnung sind. Zieh zum Beispiel jede Bremse und schau, ob das Rad stehen bleibt."
      en: "Check before a ride that your bike and your helmet are all right. For example, pull each brake and see if the wheel stops."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist Pflicht am Fahrrad?"
            options: ["die Klingel", "der Korb", "der Ständer"]
            answer: "die Klingel"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Vorne am Fahrrad leuchtet das Licht weiß. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Oles Rad hat jetzt Bremsen, Klingel, Licht und alle Rückstrahler.\n\nIst es damit schon sicher?"
            say: "Oles Fahrrad hat jetzt zwei Bremsen, eine Klingel, Licht und alle Rückstrahler. Was glaubst du: Ist es damit schon sicher?"
            show: { object: bike }
          - text: "Noch nicht ganz! Die Teile müssen auch funktionieren."
            say: "Noch nicht ganz! Alle Teile müssen auch funktionieren. Eine Bremse, die nicht bremst, hilft dir nicht. Darum macht Ole vor der Fahrt den Fahrrad-Check."
          - text: "Bremsen: Rad schieben, jede Bremse ziehen. Das Rad bleibt stehen."
            say: "Zuerst die Bremsen. Ole schiebt das Rad und zieht erst die eine, dann die andere Bremse. Jedes Mal muss das Rad sofort stehen bleiben."
            show: { object: brake }
          - text: "Licht: Leuchtet es vorne weiß und hinten rot?\nKlingel: Klingt sie hell?"
            say: "Dann schaltet er das Licht an. Leuchtet es vorne weiß und hinten rot? Und er drückt die Klingel. Klingt sie hell?"
            show: { object: bell }
          - text: "Reifen: genug Luft?\nKette: läuft sie?\nLenker und Sattel: fest?"
            say: "Jetzt drückt er auf die Reifen. Ist genug Luft drin? Er schaut, ob die Kette richtig läuft. Und er prüft, ob Lenker und Sattel fest sind und nicht wackeln."
            show: { object: tyre }
          - text: "Der Sattel ist richtig hoch, wenn du im Sitzen mit den Fußspitzen auf den Boden kommst."
            say: "Auch die Höhe vom Sattel muss stimmen. Setz dich auf den Sattel. Kommst du mit den Fußspitzen auf den Boden? Dann passt er. So kannst du schnell einen Fuß absetzen, wenn du anhältst."
            show: { object: saddle }
          - text: "Der Helm sitzt gerade und bedeckt die Stirn. Der Kinnriemen ist zu, ein Finger passt darunter."
            say: "Zum Schluss der Helm. Er ist kein Teil des Fahrrads, aber er schützt deinen Kopf, wenn du stürzt. Er sitzt gerade auf dem Kopf und bedeckt die Stirn. Der Kinnriemen ist geschlossen, und zwischen Riemen und Kinn passt ein Finger."
            show: { object: helmet }
          - text: "Ist etwas kaputt? Erst reparieren, dann fahren."
            say: "Und wenn beim Check etwas kaputt ist? Dann fährt Ole nicht los. Erst wird es repariert, dann wird gefahren."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Wozu ist das Teil da? Verbinde."
                pairs:
                  - { left: { object: brake }, right: { text: "anhalten" } }
                  - { left: { object: bell }, right: { text: "andere warnen" } }
                  - { left: { object: headlight }, right: { text: "im Dunkeln sehen und gesehen werden" } }
                  - { left: { text: "Rückstrahler" }, right: { text: "im Licht der Autos aufleuchten" } }
                hints:
                  - "Fang mit dem leichtesten Teil an, den Bremsen."
                  - "Die Klingel hört man, das Licht und die Rückstrahler sieht man."
                  - "Bremsen: anhalten. Klingel: warnen. Licht: sehen und gesehen werden. Rückstrahler: aufleuchten."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ole zieht die Vorderradbremse, aber das Rad rollt weiter. Was macht er?"
                options: ["Er fährt nicht los und lässt die Bremse reparieren.", "Er fährt trotzdem, er hat ja noch eine Bremse.", "Er klingelt dafür lauter."]
                answer: "Er fährt nicht los und lässt die Bremse reparieren."
                feedback:
                  "Er fährt trotzdem, er hat ja noch eine Bremse.": "Ein Fahrrad braucht zwei Bremsen, die funktionieren. Mit einer kaputten Bremse ist es nicht verkehrssicher."
                hints:
                  - "Ist das Rad mit einer kaputten Bremse noch verkehrssicher?"
                  - "Ist beim Check etwas kaputt, gilt: erst reparieren, dann fahren."
                  - "Er fährt nicht los und lässt die Bremse reparieren."
              - id: l2-f3
                type: true_false
                text: "Der Helm schützt deinen Kopf, wenn du stürzt. Stimmt das?"
                show: { object: helmet }
                answer: true
                hints:
                  - "Wofür trägst du den Helm?"
                  - "Der Helm fängt einen Stoß auf den Kopf ab."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: image_multiple_choice
                text: "Womit prüft Ole, ob er andere warnen kann?"
                options: [{ object: sock }, { object: bell }, { object: spoon }]
                answer: bell
                feedback:
                  spoon: "Mit einem Löffel an den Lenker klopfen? Lieber nicht! Ole drückt die Klingel."
                hints:
                  - "Andere hören dich, wenn du sie warnst."
                  - "Es klingt hell."
                  - "Mit der Klingel."
              - id: l2-f5
                type: sorting
                text: "Fahrrad-Check: in Ordnung oder nicht? Sortiere."
                bins:
                  - { id: ok, show: { text: "in Ordnung" }, say: "in Ordnung" }
                  - { id: fix, show: { text: "nicht in Ordnung" }, say: "nicht in Ordnung" }
                options:
                  - { text: "Das Rücklicht leuchtet rot.", bin: ok }
                  - { text: "Beide Bremsen halten das Rad fest.", bin: ok }
                  - { text: "Der Reifen ist ganz platt.", bin: fix }
                  - { text: "Der Lenker wackelt.", bin: fix }
                hints:
                  - "Frag dich bei jedem Satz: Kann Ole so sicher fahren?"
                  - "Ein platter Reifen und ein wackliger Lenker müssen erst repariert werden."
                  - "Rücklicht und Bremsen: in Ordnung. Reifen und Lenker: nicht in Ordnung."
              - id: l2-f6
                type: multiple_choice
                text: "Wann hat der Sattel die richtige Höhe?"
                show: { object: saddle }
                options: ["wenn du im Sitzen mit den Fußspitzen auf den Boden kommst", "wenn deine Füße nicht mehr an die Pedale kommen", "wenn deine Knie an den Lenker stoßen"]
                answer: "wenn du im Sitzen mit den Fußspitzen auf den Boden kommst"
                hints:
                  - "Beim Anhalten willst du schnell einen Fuß absetzen."
                  - "Setz dich in Gedanken auf den Sattel. Wo sind deine Füße?"
                  - "Die Fußspitzen kommen auf den Boden."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Der Kinnriemen am Helm darf offen bleiben. Stimmt das?"
                show: { object: helmet }
                answer: false
                hints: ["Ein offener Helm kann beim Sturz vom Kopf rutschen."]
              - id: l2-s2
                type: multiple_choice
                text: "Es wird dunkel. Oles Rücklicht leuchtet nicht. Was ist richtig?"
                options: ["Er schiebt das Rad, bis das Licht wieder geht.", "Er fährt schneller, damit er früher zu Hause ist.", "Er fährt in der Mitte der Straße."]
                answer: "Er schiebt das Rad, bis das Licht wieder geht."
                hints: ["Ohne Rücklicht sehen ihn die Autos hinter ihm im Dunkeln nicht."]
              - id: l2-s3
                type: sorting
                text: "Gehört das zum Fahrrad-Check? Sortiere."
                bins:
                  - { id: yes, show: { text: "gehört dazu" }, say: "gehört dazu" }
                  - { id: no, show: { text: "gehört nicht dazu" }, say: "gehört nicht dazu" }
                options:
                  - { text: "die Bremsen ziehen", bin: yes }
                  - { text: "die Luft in den Reifen prüfen", bin: yes }
                  - { text: "das Rad bunt bemalen", bin: no }
                  - { text: "die Klingel polieren, bis sie glänzt", bin: no }
                hints: ["Zum Check gehört, was dein Fahrrad sicher macht."]
              - id: l2-s4
                type: matching
                text: "Wie prüfst du es? Verbinde."
                pairs:
                  - { left: { object: brake }, right: { text: "ziehen: Das Rad bleibt stehen." } }
                  - { left: { object: tyre }, right: { text: "drücken: Ist genug Luft drin?" } }
                  - { left: { object: bell }, right: { text: "ausprobieren: Klingt sie hell?" } }
