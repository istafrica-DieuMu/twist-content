# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.electric-circuit
skill: world.nature.electric-circuit
curriculum: de-DE
language: de
title:
  de: Der Stromkreis
  en: The electric circuit
summary: >
  Lina and Opa Theo build a reading light for Lina's blanket den from a
  flat battery, wires and a small bulb. Every task is predict, then see:
  the child says whether the bulb lights before finding out. Lesson 1
  opens with one wire from the battery to the bulb, which stays dark: the
  current needs a closed loop from one pole of the battery through the
  bulb and back to the other pole (Pluspol, Minuspol). A gap anywhere
  opens the circuit; two wires on the same pole do not light it either.
  Experiments only ever with a battery, never with the socket. Lesson 2
  adds the switch, which opens and closes the circuit like a small
  bridge, looks inside a torch, and finds faults (switch off, loose wire,
  flat battery, burnt-out bulb); two switches one after the other light
  the bulb only when both are on. It ends with the skill check. No
  circuit is drawn: assets/drawn.yaml has no circuit component yet, so
  each set-up is described in words. The direction of the current is
  left out on purpose, since schools teach it differently.
metadata:
  year: klasse-4
  topic: { de: Feuer und Strom, en: Fire and electricity }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: []
  also_practises: []
  vocabulary: { de: [Strom, Stromkreis, Batterie, Flachbatterie, Pluspol, Minuspol, Kabel, Lämpchen, Schalter, geschlossen, offen, Lücke, Taschenlampe, Volt] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: closed-circuit, what: { de: "erklären, dass der Strom einen geschlossenen Kreis von Pol zu Pol braucht", en: "explaining that the current needs a closed loop from pole to pole" } }
    - { id: predict, what: { de: "vorhersagen, ob das Lämpchen in einem beschriebenen Aufbau leuchtet", en: "predicting whether the bulb lights in a described set-up" } }
    - { id: switch, what: { de: "erklären, wie ein Schalter den Kreis öffnet und schließt, und Fehler finden", en: "explaining how a switch opens and closes the circuit, and finding faults" } }
  misconceptions:
    - id: one-wire-enough
      what: Thinks one wire from the battery to the bulb is enough, as if the current flows there and is used up
      addressed: "lesson 1 opens with the one-wire guess; l1-f1, l1-f2, l1-c1 and l2-c6, l2-c14"
    - id: any-two-contacts
      what: Thinks it does not matter where the second wire goes, so both wires on one pole would light the bulb
      addressed: "the lesson 1 screen on the two poles; l1-s3, l1-f4 and l2-c8"
    - id: switch-makes-current
      what: Thinks the switch makes or stores the current instead of opening and closing the circuit
      addressed: "lesson 2 Learn shows the switch as a bridge in the loop; l2-f2, l2-n2, l2-c15 and l2-c16"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Der Strom braucht einen Kreis", en: "The current needs a loop" }
    goal:
      de: "Sag vorher, ob das Lämpchen leuchtet. Du findest heraus, warum der Strom einen Weg hin und einen Weg zurück braucht."
      en: "Predict whether the bulb lights up. You find out why the current needs a way there and a way back."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lina verbindet einen Pol der Batterie mit einem Kabel mit dem Lämpchen.\n\nWas glaubst du: Leuchtet das Lämpchen?"
            say: "Lina will in ihrer Höhle aus Decken lesen. Mit Opa Theo baut sie eine Leselampe. Sie haben eine Flachbatterie, ein Lämpchen und Kabel. Lina verbindet einen Pol der Batterie mit einem Kabel mit dem Lämpchen. Was glaubst du: Leuchtet das Lämpchen?"
            show: { object: light-bulb }
          - text: "Nein! Das Lämpchen bleibt dunkel. Ein Kabel reicht nicht."
            say: "Das Lämpchen bleibt dunkel. Opa Theo lacht: Ein Kabel reicht nicht. Der Strom braucht einen Weg zum Lämpchen und einen Weg wieder zurück zur Batterie."
          - text: "Die Batterie hat zwei Pole: den Pluspol und den Minuspol."
            say: "Schau dir die Batterie genau an. Sie hat zwei Anschlüsse, die Pole. Der eine heißt Pluspol, der andere Minuspol. Das erste Kabel führt von einem Pol zum Lämpchen. Das zweite Kabel führt vom Lämpchen zum anderen Pol."
          - text: "Ein Kreis ohne Lücke: Batterie, Kabel, Lämpchen, Kabel, zurück zur Batterie. Das Lämpchen leuchtet!"
            say: "Jetzt ist der Weg ein Kreis ohne Lücke: von der Batterie durch das erste Kabel zum Lämpchen, durch das Lämpchen hindurch und durch das zweite Kabel zurück zur Batterie. Der Strom fließt im Kreis, und das Lämpchen leuchtet. Das nennt man einen Stromkreis."
            show: { object: light-bulb }
          - text: "Geschlossener Stromkreis: Das Lämpchen leuchtet.\nOffener Stromkreis: Es bleibt dunkel."
            say: "Ist der Kreis geschlossen, leuchtet das Lämpchen. Ist irgendwo eine Lücke, ein loses Kabel oder ein durchgeschnittener Draht, ist der Stromkreis offen, und das Lämpchen bleibt dunkel. Auch wenn beide Kabel am selben Pol hängen, leuchtet es nicht. Ein Kabel muss zum Pluspol, eins zum Minuspol."
          - text: "Wusstest du? Die Einheit Volt auf jeder Batterie ist nach Alessandro Volta benannt."
            say: "Wusstest du? Auf jeder Batterie steht eine Zahl mit dem Wort Volt. Die Einheit Volt ist nach Alessandro Volta benannt. Er hat vor mehr als zweihundert Jahren die erste Batterie gebaut, aus Metallscheiben und Pappe mit Salzwasser."
          - text: "Probier's aus, aber nur mit einer Batterie! Nie mit der Steckdose."
            say: "Mit einer Flachbatterie, einem Lämpchen und zwei Kabeln kannst du einen Stromkreis mit einem Erwachsenen ausprobieren. Das ist ungefährlich. Aber nie mit der Steckdose! Der Strom aus der Steckdose ist viel stärker und lebensgefährlich."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Lina verbindet nur den Pluspol mit dem Lämpchen. Ein zweites Kabel gibt es nicht.\n\nLeuchtet das Lämpchen?"
                answer: false
                hints:
                  - "Der Strom fließt nur in einem Kreis."
                  - "Gibt es einen Weg vom Lämpchen zurück zur Batterie?"
                  - "Nein, mit einem Kabel bleibt das Lämpchen dunkel."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was braucht Lina noch, damit ihr Lämpchen leuchtet?"
                options: ["ein zweites Kabel vom Lämpchen zum Minuspol", "ein zweites Lämpchen", "eine Schere"]
                answer: "ein zweites Kabel vom Lämpchen zum Minuspol"
                hints:
                  - "Der Strom braucht einen Weg hin und einen Weg zurück."
                  - "Das erste Kabel kommt vom Pluspol. Wohin muss das zweite?"
                  - "Ein zweites Kabel vom Lämpchen zum Minuspol."
              - id: l1-f3
                type: ordering
                text: "Welchen Weg nimmt der Strom? Bring ihn in die richtige Reihenfolge."
                options: ["durch das Lämpchen", "zurück in die Batterie", "von der Batterie in das erste Kabel", "durch das zweite Kabel"]
                slot_count: 4
                answer: ["von der Batterie in das erste Kabel", "durch das Lämpchen", "durch das zweite Kabel", "zurück in die Batterie"]
                option_audio: false
                hints:
                  - "Der Strom kommt aus der Batterie und fließt im Kreis."
                  - "Zwischen den beiden Kabeln liegt das Lämpchen."
                  - "Batterie, erstes Kabel, Lämpchen, zweites Kabel, zurück in die Batterie."
              - id: l1-f4
                type: sorting
                text: "Leuchtet das Lämpchen? Sortiere."
                bins:
                  - { id: on, show: { text: "leuchtet" }, say: "leuchtet" }
                  - { id: off, show: { text: "bleibt dunkel" }, say: "bleibt dunkel" }
                options:
                  - { text: "Ein Kabel vom Pluspol zum Lämpchen, eins vom Lämpchen zum Minuspol.", bin: on }
                  - { text: "Nur ein Kabel führt zum Lämpchen.", bin: off }
                  - { text: "Ein Kabel ist in der Mitte durchgeschnitten.", bin: off }
                  - { text: "Beide Kabel hängen am Pluspol.", bin: off }
                hints:
                  - "Frag bei jedem: Gibt es einen Kreis ohne Lücke von Pol zu Pol?"
                  - "Ein Kabel allein, ein durchgeschnittenes Kabel oder zweimal derselbe Pol: Dann ist der Kreis nicht geschlossen."
                  - "Nur der erste Aufbau leuchtet."
              - id: l1-f5
                type: multiple_choice
                text: "Wie heißen die zwei Pole der Batterie?"
                options: ["Pluspol und Minuspol", "Nordpol und Südpol", "Anfang und Ende"]
                answer: "Pluspol und Minuspol"
                feedback:
                  "Nordpol und Südpol": "Nordpol und Südpol hat ein Magnet, und die Erde auch. Die Batterie hat einen Pluspol und einen Minuspol."
                hints:
                  - "Auf der Batterie stehen ein Plus und ein Minus."
                  - "Die Pole heißen nach diesen Zeichen."
                  - "Pluspol und Minuspol."
              - id: l1-f6
                type: image_multiple_choice
                text: "Was baut Lina in ihren Stromkreis ein, damit es hell wird?"
                options: [{ object: light-bulb }, { object: candle }, { object: star }]
                answer: light-bulb
                feedback:
                  candle: "Eine Kerze in der Deckenhöhle? Viel zu gefährlich! Und Strom braucht sie auch nicht. Lina baut ein Lämpchen ein."
                hints:
                  - "Es soll durch Strom leuchten."
                  - "Es hat ein Gewinde aus Metall, wie eine kleine Glühbirne."
                  - "Das Lämpchen."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Zwei Kabel verbinden die Batterie und das Lämpchen zu einem Kreis. Es gibt keine Lücke.\n\nLeuchtet das Lämpchen?"
                answer: true
                hints: ["Ein Kreis ohne Lücke heißt geschlossener Stromkreis."]
              - id: l1-s2
                type: matching
                text: "Was gehört zusammen? Verbinde."
                pairs:
                  - { left: { text: "geschlossener Stromkreis" }, right: { text: "Das Lämpchen leuchtet." } }
                  - { left: { text: "offener Stromkreis" }, right: { text: "Das Lämpchen bleibt dunkel." } }
                  - { left: { text: "Batterie" }, right: { text: "gibt den Strom" } }
                  - { left: { text: "Kabel" }, right: { text: "führt den Strom weiter" } }
                hints: ["Offen heißt: Irgendwo ist eine Lücke."]
              - id: l1-s3
                type: multiple_choice
                text: "Lina hat beide Kabel an den Pluspol geklemmt. Leuchtet das Lämpchen?"
                options: ["Nein, ein Kabel muss zum Minuspol.", "Ja, ganz hell.", "Ja, aber nur kurz."]
                answer: "Nein, ein Kabel muss zum Minuspol."
                hints: ["Der Kreis führt von einem Pol zum anderen Pol."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Der Strom fließt nur in einem _ Stromkreis. Hat der Kreis eine Lücke, ist er _."
                options: ["geschlossenen", "offen", "bunten", "warm"]
                answer: ["geschlossenen", "offen"]
                hints: ["Ohne Lücke ist der Kreis zu, mit Lücke ist er auf."]
              - id: l1-s5
                type: sorting
                text: "Was nimmt Lina für ihre Lampe? Sortiere."
                bins:
                  - { id: yes, show: { text: "nimmt sie" }, say: "nimmt sie" }
                  - { id: no, show: { text: "nimmt sie nicht" }, say: "nimmt sie nicht" }
                options:
                  - { text: "eine Flachbatterie", bin: yes }
                  - { text: "zwei Kabel", bin: yes }
                  - { text: "ein Lämpchen", bin: yes }
                  - { text: "die Steckdose", bin: no }
                  - { text: "eine Kerze", bin: no }
                hints: ["Für Versuche gibt es Strom nur aus der Batterie. Eine Kerze braucht keinen Strom."]
              - id: l1-s6
                type: multiple_choice
                text: "Opa Theo sagt: „Der Strom fließt im Kreis.“ Was meint er?"
                options: ["Er fließt von der Batterie durch das Lämpchen und wieder zurück zur Batterie.", "Er fließt außen um die Batterie herum.", "Er fließt nur bis zum Lämpchen und bleibt dort."]
                answer: "Er fließt von der Batterie durch das Lämpchen und wieder zurück zur Batterie."
                hints: ["Ein Kreis hat kein Ende. Wo kommt der Strom am Schluss wieder an?"]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Ein Kabel geht vom Minuspol zum Lämpchen, das andere vom Lämpchen zum Pluspol.\n\nLeuchtet das Lämpchen?"
                answer: true
              - id: l1-n2
                type: multiple_choice
                text: "Das Lämpchen bleibt dunkel. Woran kann es liegen?"
                options: ["Ein Kabel hat sich gelöst.", "Das Kabel ist rot.", "Die Batterie liegt auf dem Tisch."]
                answer: "Ein Kabel hat sich gelöst."
              - id: l1-n3
                type: ordering
                text: "Lina baut ihre Lampe. Bring die Schritte in die richtige Reihenfolge."
                options: ["Das zweite Kabel vom Lämpchen zum anderen Pol führen.", "Das Lämpchen leuchtet.", "Das erste Kabel an einen Pol der Batterie klemmen.", "Das erste Kabel zum Lämpchen führen."]
                slot_count: 4
                answer: ["Das erste Kabel an einen Pol der Batterie klemmen.", "Das erste Kabel zum Lämpchen führen.", "Das zweite Kabel vom Lämpchen zum anderen Pol führen.", "Das Lämpchen leuchtet."]
                option_audio: false
              - id: l1-n4
                type: text_input
                text: "In Linas Höhle liegen die Batterie und das Lämpchen weit auseinander. Wie viele Kabel braucht sie für den Stromkreis?"
                answer: "2"
              - id: l1-n5
                type: sorting
                text: "Leuchtet das Lämpchen? Sortiere."
                bins:
                  - { id: on, show: { text: "leuchtet" }, say: "leuchtet" }
                  - { id: off, show: { text: "bleibt dunkel" }, say: "bleibt dunkel" }
                options:
                  - { text: "Ein Kreis ohne Lücke von Pol zu Pol.", bin: on }
                  - { text: "Beide Kabel hängen am Minuspol.", bin: off }
                  - { text: "Zwischen Kabel und Lämpchen ist ein Spalt.", bin: off }
                  - { text: "Es gibt Kabel und ein Lämpchen, aber keine Batterie.", bin: off }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Ein Lämpchen leuchtet auch mit nur einem Kabel zur Batterie. Stimmt das?"
            answer: false
          - id: l1-c2
            type: multiple_choice
            text: "Was ist ein offener Stromkreis?"
            options: ["ein Kreis mit einer Lücke", "ein Kreis ohne Lücke", "ein Kreis mit zwei Lämpchen"]
            answer: "ein Kreis mit einer Lücke"
          - id: l1-c3
            type: multiple_choice
            text: "Woher kommt der Strom in Linas Lampe?"
            options: ["aus der Batterie", "aus dem Lämpchen", "aus der Bettdecke"]
            answer: "aus der Batterie"
          - id: l1-c4
            type: true_false
            text: "In einem geschlossenen Stromkreis leuchtet das Lämpchen. Stimmt das?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Womit darfst du Stromkreise ausprobieren?"
            options: ["mit einer Batterie", "mit der Steckdose", "mit einem Stromkabel aus der Wand"]
            answer: "mit einer Batterie"
          - id: l1-c6
            type: multiple_choice
            text: "Ein Kabel ist vom Lämpchen abgerutscht. Was passiert?"
            options: ["Das Lämpchen geht aus.", "Das Lämpchen leuchtet heller.", "Die Batterie wird voller."]
            answer: "Das Lämpchen geht aus."

  - n: 2
    title: { de: "Schalter und Fehlersuche", en: "Switches and finding faults" }
    goal:
      de: "Finde heraus, wie ein Schalter das Licht an- und ausmacht. Dann suchst du wie ein Profi den Fehler, wenn eine Lampe dunkel bleibt."
      en: "Find out how a switch turns the light on and off. Then you look for the fault like an expert when a lamp stays dark."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Hat der Stromkreis eine Lücke, bleibt das Lämpchen dunkel. Stimmt das?"
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viele Pole hat eine Batterie?"
            options: ["1", "2", "3"]
            answer: "2"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lina will ihre Lampe an- und ausmachen, ohne jedes Mal ein Kabel abzuziehen.\n\nWas glaubst du: Was braucht sie?"
            say: "Linas Leselampe leuchtet. Aber zum Ausmachen muss sie jedes Mal ein Kabel abziehen. Das nervt. Was glaubst du: Was braucht sie?"
            show: { object: lamp }
          - text: "Einen Schalter! Er öffnet und schließt den Stromkreis."
            say: "Sie braucht einen Schalter. Opa Theo baut ihn mit einem dritten Kabel in den Kreis ein. Der Schalter ist wie eine kleine Brücke aus Metall. Schaltest du ihn ein, ist die Brücke zu: Der Kreis ist geschlossen, und das Lämpchen leuchtet. Schaltest du ihn aus, ist die Brücke offen: Es gibt eine Lücke, und das Lämpchen geht aus."
          - text: "Schalter an: Kreis geschlossen, Licht an.\nSchalter aus: Kreis offen, Licht aus."
            say: "Der Schalter macht keinen Strom. Er öffnet und schließt nur den Weg. Schalter an heißt: Kreis geschlossen, Licht an. Schalter aus heißt: Kreis offen, Licht aus."
            show: { object: light-bulb }
          - text: "In jeder Taschenlampe steckt ein Stromkreis: Batterien, Schalter, Lämpchen und Metallstreifen."
            say: "Opa Theo schraubt eine Taschenlampe auf. Darin stecken Batterien, ein Schalter und ein Lämpchen. Statt Kabeln führen Metallstreifen und Federn den Strom. Auch der Lichtschalter in deinem Zimmer öffnet und schließt einen Stromkreis. Dessen Leitungen liegen in der Wand, und dort ist der Strom lebensgefährlich. Die fasst du nie an."
          - text: "Bleibt es dunkel? Prüfe:\nIst der Schalter an?\nSitzt jedes Kabel fest?\nIst die Batterie leer?\nIst das Lämpchen durchgebrannt?"
            say: "Bleibt eine Lampe dunkel, suchst du die Lücke im Kreis wie ein Profi. Ist der Schalter an? Sitzt jedes Kabel fest? Ist die Batterie leer? Oder ist das Lämpchen durchgebrannt? Dann ist der dünne Draht darin gerissen, und der Kreis hat eine Lücke."
          - text: "Zwei Schalter hintereinander: Das Lämpchen leuchtet nur, wenn beide an sind."
            say: "Zum Schluss baut Opa Theo zwei Schalter hintereinander in den Kreis. Was glaubst du? Das Lämpchen leuchtet nur, wenn beide Schalter an sind. Ist einer aus, hat der Kreis eine Lücke."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Linas Schalter ist aus. Die Batterie ist voll, alle Kabel sitzen fest.\n\nLeuchtet die Lampe?"
                answer: false
                hints:
                  - "Was macht ein Schalter, der aus ist?"
                  - "Ist der Schalter aus, hat der Kreis eine Lücke."
                  - "Nein, die Lampe bleibt dunkel."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Lina schaltet den Schalter ein. Was macht er jetzt?"
                options: ["Er schließt den Stromkreis.", "Er öffnet den Stromkreis.", "Er lädt die Batterie auf."]
                answer: "Er schließt den Stromkreis."
                hints:
                  - "Der Schalter ist wie eine kleine Brücke."
                  - "Beim Einschalten geht die Brücke zu."
                  - "Er schließt den Stromkreis."
              - id: l2-f3
                type: sorting
                text: "Licht an oder Licht aus? Sortiere."
                bins:
                  - { id: on, show: { text: "Licht an" }, say: "Licht an" }
                  - { id: off, show: { text: "Licht aus" }, say: "Licht aus" }
                options:
                  - { text: "Schalter an, volle Batterie, alle Kabel fest", bin: on }
                  - { text: "Schalter aus", bin: off }
                  - { text: "Schalter an, aber ein Kabel ist lose", bin: off }
                  - { text: "Schalter an, aber die Batterie ist leer", bin: off }
                hints:
                  - "Das Licht ist nur an, wenn alles stimmt."
                  - "Ein loses Kabel oder ein Schalter, der aus ist, machen eine Lücke. Eine leere Batterie gibt keinen Strom."
                  - "Licht an nur beim ersten. Die anderen bleiben dunkel."
              - id: l2-f4
                type: multiple_choice
                text: "Linas Taschenlampe bleibt dunkel. Der Schalter ist an, das Lämpchen ist heil, alles sitzt fest. Was prüft sie jetzt?"
                options: ["ob die Batterien leer sind", "ob die Taschenlampe die richtige Farbe hat", "ob es draußen dunkel ist"]
                answer: "ob die Batterien leer sind"
                hints:
                  - "Schalter, Lämpchen und Kabel sind in Ordnung. Was fehlt noch im Kreis?"
                  - "Woher kommt der Strom?"
                  - "Sie prüft die Batterien."
              - id: l2-f5
                type: matching
                text: "Was macht jedes Teil im Stromkreis? Verbinde."
                pairs:
                  - { left: { text: "Schalter" }, right: { text: "macht den Kreis auf und zu" } }
                  - { left: { text: "Batterie" }, right: { text: "gibt den Strom" } }
                  - { left: { text: "Lämpchen" }, right: { text: "leuchtet, wenn Strom fließt" } }
                hints:
                  - "Jedes Teil hat eine andere Aufgabe."
                  - "Der Schalter macht keinen Strom. Er öffnet und schließt den Weg."
                  - "Schalter: auf und zu. Batterie: Strom. Lämpchen: leuchtet."
              - id: l2-f6
                type: image_multiple_choice
                text: "Wo steckt auch ein Stromkreis mit einem Schalter?"
                options: [{ object: lamp }, { object: candle }, { object: book }]
                answer: lamp
                feedback:
                  book: "Ein Buch mit Schalter? Das wäre ein lustiges Buch! Die Tischlampe hat einen Schalter und einen Stromkreis."
                hints:
                  - "Was kannst du mit einem Schalter an- und ausmachen?"
                  - "Es braucht Strom, um zu leuchten."
                  - "Die Tischlampe."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Der Lichtschalter in deinem Zimmer öffnet und schließt einen Stromkreis. Stimmt das?"
                answer: true
                hints: ["Jeder Schalter macht dasselbe: Er öffnet und schließt den Weg für den Strom."]
              - id: l2-s2
                type: multiple_choice
                text: "Lina legt eine neue Batterie ein. Jetzt leuchtet die Lampe wieder. Was war los?"
                options: ["Die alte Batterie war leer.", "Das Kabel war zu lang.", "Der Schalter war zu klein."]
                answer: "Die alte Batterie war leer."
                hints: ["Sie hat nur eine Sache getauscht."]
              - id: l2-s3
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Ist der Schalter aus, ist der Stromkreis _. Das Lämpchen bleibt _."
                options: ["offen", "geschlossen", "dunkel", "hell"]
                answer: ["offen", "dunkel"]
                hints: ["Ein Schalter, der aus ist, macht eine Lücke in den Kreis."]
              - id: l2-s4
                type: sorting
