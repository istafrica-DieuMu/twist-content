# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.inventions
skill: world.technology.inventions
curriculum: de-DE
language: de
title:
  de: Erfindungen verändern die Welt
  en: Inventions change the world
summary: >
  Important inventions, when they came and how they changed people's
  lives. The story: Lina and her Opa Karl visit a museum of inventions,
  where Herr Demir shows them around. Lesson 1 puts inventions on a
  timeline with dates that are certain: the printing press with movable
  type (Johannes Gutenberg, Mainz, around 1450), the Laufmaschine (Karl
  Drais, Mannheim, 1817), the telephone (1876), the first car (Carl
  Benz, Mannheim, 1886), a working programmable computer (Konrad Zuse,
  Berlin, 1941) and the smartphone as the newest; it says what an
  invention is and that inventions build on each other (no car without
  the wheel, no computer without electricity). Lesson 2 asks how they
  changed life (books for many people, light at the flick of a switch,
  talking across long distances, travelling far and fast) and weighs
  advantages and drawbacks, for people and the environment (exhaust
  fumes, noise, too much screen time). It ends with the skill check. No
  brands; the museum and its guide are written for Twist.
metadata:
  year: klasse-4
  topic: { de: Technik verändert die Welt, en: Technology changes the world }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.time.timeline]
  also_practises: [world.time.timeline]
  vocabulary: { de: [Erfindung, erfinden, Erfinder, Zeitleiste, Buchdruck, Laufmaschine, Telefon, Auto, Computer, Smartphone, Glühbirne, Strom, Vorteil, Nachteil, bewerten, Abgase, Umwelt] }
  forms: [text, audio, picture, drawn]
  drawn: [table]
  facets: []
  parts:
    - { id: timeline, what: { de: "Erfindungen auf der Zeitleiste ordnen und sagen, wer sie wo erfunden hat", en: "putting inventions in order on a timeline and saying who invented them where" } }
    - { id: changes, what: { de: "beschreiben, wie eine Erfindung das Leben verändert hat", en: "describing how an invention changed people's lives" } }
    - { id: evaluate, what: { de: "Vorteile und Nachteile einer Erfindung für Menschen und Umwelt abwägen", en: "weighing an invention's advantages and drawbacks for people and the environment" } }
  misconceptions:
    - id: car-before-bike
      what: Thinks the car is older than the bicycle because it seems more important
      addressed: "lesson 1 opens with the guess which is older; l1-f2, l1-s3 and l2-c1 order them"
    - id: only-good
      what: Thinks an invention is either only good or only bad
      addressed: "lesson 2 Learn weighs the car and the phone; l2-f6, l2-s3 and l2-c16, l2-c17 test it, with feedback on l2-f6"
    - id: always-there
      what: Thinks everyday things like electric light or books in every home have always existed
      addressed: "lesson 2 opens with the evening without electric light; l2-f3, l2-n3 and l2-c8, l2-c9 ask how it was before"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Erfindungen auf der Zeitleiste", en: "Inventions on a timeline" }
    goal:
      de: "Bring Erfindungen in die richtige Reihenfolge, von alt nach neu. Das Fahrrad ist zum Beispiel älter als das Auto."
      en: "Put inventions in order, from old to new. The bicycle, for example, is older than the car."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Jahre hat ein Jahrhundert?"
            options: ["10 Jahre", "100 Jahre", "1000 Jahre"]
            answer: "100 Jahre"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ein Jahrzehnt sind 10 Jahre. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lina und Opa Karl sind im Museum der Erfindungen.\n\nWas ist älter: das Fahrrad oder das Auto?"
            say: "Lina und ihr Opa Karl besuchen ein Museum der Erfindungen. Herr Demir führt sie herum. Gleich am Eingang fragt er: Was glaubst du, was ist älter, das Fahrrad oder das Auto?"
            show: { object: bike }
          - text: "Das Fahrrad! 1817 fuhr Karl Drais in Mannheim mit seiner Laufmaschine.\nDas erste Auto baute Carl Benz 1886, auch in Mannheim."
            say: "Das Fahrrad ist älter! Im Jahr achtzehnhundertsiebzehn fuhr Karl Drais in Mannheim zum ersten Mal mit seiner Laufmaschine. Aus ihr wurde später das Fahrrad. Das erste Auto baute Carl Benz im Jahr achtzehnhundertsechsundachtzig, auch in Mannheim. Dazwischen liegen fast siebzig Jahre."
            show: { object: car }
          - text: "Eine Erfindung ist etwas Neues, das sich Menschen ausdenken und bauen."
            say: "Laufmaschine und Auto sind Erfindungen. Eine Erfindung ist etwas Neues, das sich Menschen ausdenken und bauen. Wer etwas erfindet, ist eine Erfinderin oder ein Erfinder."
          - text: "Herrn Demirs Zeitleiste, von alt nach neu"
            say: "Herr Demir zeigt eine Zeitleiste. Um vierzehnhundertfünfzig erfand Johannes Gutenberg in Mainz den Buchdruck mit beweglichen Buchstaben aus Metall. Achtzehnhundertsiebzehn kam die Laufmaschine, achtzehnhundertsechsundsiebzig das Telefon und achtzehnhundertsechsundachtzig das Auto. Neunzehnhunderteinundvierzig baute Konrad Zuse in Berlin einen Computer, den man programmieren konnte. Das Smartphone ist die jüngste Erfindung in der Reihe."
            show: { drawn: table, rows: [["Jahr", "Erfindung"], ["um 1450", "Buchdruck (Johannes Gutenberg, Mainz)"], ["1817", "Laufmaschine (Karl Drais, Mannheim)"], ["1876", "Telefon"], ["1886", "Auto (Carl Benz, Mannheim)"], ["1941", "Computer (Konrad Zuse, Berlin)"], ["später", "Smartphone"]] }
          - text: "Erfindungen bauen aufeinander auf.\nOhne das Rad gäbe es kein Fahrrad und kein Auto.\nOhne Strom gäbe es keinen Computer."
            say: "Viele Erfindungen bauen auf älteren auf. Das Rad ist schon viele tausend Jahre alt. Ohne das Rad gäbe es kein Fahrrad und kein Auto. Ohne Strom gäbe es keinen Computer und kein Smartphone."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was ist älter: der Buchdruck oder das Telefon?"
                options: ["der Buchdruck", "das Telefon"]
                answer: "der Buchdruck"
                hints:
                  - "Schau auf die Jahreszahlen: Die kleinere Zahl ist älter."
                  - "Der Buchdruck ist von ungefähr 1450, das Telefon von 1876."
                  - "Der Buchdruck ist älter."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Bring die Erfindungen auf die Zeitleiste, die älteste zuerst."
                options: ["Auto (1886)", "Computer (1941)", "Buchdruck (um 1450)", "Laufmaschine (1817)"]
                slot_count: 4
                answer: ["Buchdruck (um 1450)", "Laufmaschine (1817)", "Auto (1886)", "Computer (1941)"]
                hints:
                  - "Ordne nach den Jahreszahlen, von klein nach groß."
                  - "1450 ist die kleinste Zahl, 1941 die größte."
                  - "Buchdruck, Laufmaschine, Auto, Computer."
              - id: l1-f3
                type: matching
                text: "Wer hat was erfunden? Verbinde."
                pairs:
                  - { left: { text: "Buchdruck" }, right: { text: "Johannes Gutenberg in Mainz" } }
                  - { left: { text: "Laufmaschine" }, right: { text: "Karl Drais in Mannheim" } }
                  - { left: { text: "Computer" }, right: { text: "Konrad Zuse in Berlin" } }
                hints:
                  - "Zwei der Erfindungen kommen aus Mannheim und Mainz, eine aus Berlin."
                  - "Gutenberg druckte Bücher, Drais fuhr mit der Laufmaschine."
                  - "Gutenberg: Buchdruck. Drais: Laufmaschine. Zuse: Computer."
              - id: l1-f4
                type: true_false
                text: "Eine Erfindung ist etwas Neues, das sich Menschen ausdenken und bauen. Stimmt das?"
                answer: true
                hints:
                  - "Denk an die Laufmaschine von Karl Drais."
                  - "Vorher gab es sie nicht. Er hat sie sich ausgedacht und gebaut."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: image_multiple_choice
                text: "Welche dieser Erfindungen ist die jüngste?"
                options: [{ object: mobile-phone }, { object: telephone }, { object: book }]
                answer: mobile-phone
                hints:
                  - "Die jüngste Erfindung ist die neueste."
                  - "Gedruckte Bücher gibt es seit ungefähr 1450, das Telefon seit 1876."
                  - "Das Smartphone ist die jüngste."
              - id: l1-f6
                type: text_input
                text: "Die Laufmaschine gibt es seit 1817, das Auto seit 1886. Wie viele Jahre liegen dazwischen?"
                answer: "69"
                hints:
                  - "Du rechnest: das spätere Jahr minus das frühere."
                  - "1886 − 1817. Von 1817 bis 1880 sind es 63 Jahre."
                  - "63 + 6 = 69"

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Bring die Erfindungen in die richtige Reihenfolge, die älteste zuerst."
                options: ["Telefon", "Buchdruck", "Laufmaschine"]
                slot_count: 3
                answer: ["Buchdruck", "Laufmaschine", "Telefon"]
                hints: ["Der Buchdruck ist fast 400 Jahre älter als die beiden anderen."]
              - id: l1-s2
                type: multiple_choice
                text: "Wer baute 1886 in Mannheim das erste Auto?"
                options: ["Carl Benz", "Karl Drais", "Johannes Gutenberg"]
                answer: "Carl Benz"
                hints: ["Karl Drais kommt auch aus Mannheim, aber er baute die Laufmaschine."]
              - id: l1-s3
                type: true_false
                text: "Das Auto wurde vor dem Fahrrad erfunden. Stimmt das?"
                answer: false
                hints: ["Vergleiche: Laufmaschine 1817, Auto 1886."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welche Jahreszahlen passen?"
                frame: "Den Buchdruck gibt es seit ungefähr _. Das erste Auto fuhr _."
                options: ["1450", "1817", "1886", "1941"]
                answer: ["1450", "1886"]
                hints: ["Der Buchdruck ist die älteste Erfindung auf der Zeitleiste."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Erfindung braucht Strom?"
                options: ["der Computer", "die Laufmaschine", "der Buchdruck von Gutenberg"]
                answer: "der Computer"
                hints: ["Ohne Strom gäbe es keinen Computer."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Bring die fünf Erfindungen auf die Zeitleiste, die älteste zuerst."
                options: ["Computer", "Smartphone", "Laufmaschine", "Buchdruck", "Auto"]
                slot_count: 5
                answer: ["Buchdruck", "Laufmaschine", "Auto", "Computer", "Smartphone"]
              - id: l1-n2
                type: multiple_choice
                text: "In welcher Stadt erfand Johannes Gutenberg den Buchdruck?"
                options: ["in Mainz", "in Berlin", "in Hamburg"]
                answer: "in Mainz"
              - id: l1-n3
                type: true_false
                text: "Konrad Zuse baute 1941 in Berlin einen Computer. Stimmt das?"
                answer: true
              - id: l1-n4
                type: text_input
                text: "Das erste Auto fuhr 1886, der Computer von Konrad Zuse lief 1941. Wie viele Jahre liegen dazwischen?"
                answer: "55"
              - id: l1-n5
                type: multiple_choice
                text: "Ohne welche ältere Erfindung gäbe es kein Fahrrad und kein Auto?"
                options: ["das Rad", "das Telefon", "den Buchdruck"]
                answer: "das Rad"
                feedback:
                  "das Telefon": "Ein Auto, das telefoniert, aber keine Räder hat? Das kommt nicht weit! Ohne das Rad gäbe es weder Fahrrad noch Auto."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist älter: das Telefon oder der Computer?"
            options: ["das Telefon", "der Computer"]
            answer: "das Telefon"
          - id: l1-c2
            type: ordering
            text: "Bring die Erfindungen in die richtige Reihenfolge, die älteste zuerst."
            options: ["Computer (1941)", "Telefon (1876)", "Buchdruck (um 1450)"]
            slot_count: 3
            answer: ["Buchdruck (um 1450)", "Telefon (1876)", "Computer (1941)"]
          - id: l1-c3
            type: true_false
            text: "Karl Drais erfand das Telefon. Stimmt das?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Was ist eine Erfindung?"
            options: ["etwas Neues, das sich Menschen ausdenken und bauen", "etwas, das in der Natur wächst", "ein altes Buch im Museum"]
            answer: "etwas Neues, das sich Menschen ausdenken und bauen"
          - id: l1-c5
            type: image_multiple_choice
            text: "Welche dieser Erfindungen ist am ältesten?"
            options: [{ object: book }, { object: mobile-phone }, { object: car }]
            answer: book
          - id: l1-c6
            type: fill_in_blank
            text: "Was passt in die Lücken?"
            frame: "Das erste Auto fuhr _ in _."
            options: ["1886", "1941", "Mannheim", "Mainz"]
            answer: ["1886", "Mannheim"]

  - n: 2
    title: { de: "Wie Erfindungen das Leben verändern", en: "How inventions change our lives" }
    goal:
      de: "Finde heraus, wie Erfindungen unser Leben verändert haben, und sag, was daran gut ist und was schwierig. Das Auto bringt dich zum Beispiel schnell weit weg, aber es macht Abgase."
      en: "Find out how inventions have changed our lives, and say what is good about them and what is difficult. The car, for example, takes you far away quickly, but it gives off exhaust fumes."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist älter: der Buchdruck oder das Auto?"
            options: ["der Buchdruck", "das Auto"]
            answer: "der Buchdruck"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Carl Benz baute das erste Auto. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Stell dir vor: kein Strom, keine Lampe.\n\nWas machst du am Abend, wenn es dunkel wird?"
            say: "Im Museum kommen Lina und Opa Karl in einen dunklen Raum. Herr Demir fragt: Stell dir vor, es gibt keinen Strom und keine Lampe. Was glaubst du: Was machst du am Abend, wenn es dunkel wird?"
            show: { object: candle }
          - text: "Früher: Kerzen und Öllampen. Sie gaben wenig Licht, und schnell brach ein Feuer aus.\nHeute: Licht mit einem Schalter."
            say: "Früher zündete man Kerzen oder Öllampen an. Sie gaben nur wenig Licht, und wenn man nicht aufpasste, brach schnell ein Feuer aus. Mit Strom und der Glühbirne wurde alles anders: Ein Schalter, und das Zimmer ist hell. Jetzt konnten die Menschen auch abends lesen, arbeiten und spielen."
            show: { object: light-bulb }
          - text: "Buchdruck: Vorher schrieb man Bücher mit der Hand ab.\nJetzt gab es mehr und billigere Bücher. Mehr Menschen lernten lesen."
            say: "Auch der Buchdruck hat viel verändert. Vorher musste man jedes Buch mit der Hand abschreiben. Das dauerte lange, und Bücher waren sehr teuer. Mit dem Buchdruck konnte man viele Bücher schnell herstellen. Sie wurden billiger, und mehr Menschen lernten lesen."
            show: { object: book-open }
          - text: "Auto\nVorteile: schnell weit fahren, schwere Sachen transportieren\nNachteile: Abgase, Lärm, Unfälle, viel Platz für Straßen"
            say: "Viele Erfindungen haben Vorteile und Nachteile. Mit dem Auto kommt man schnell weit, und Lastwagen bringen Waren in jeden Ort. Aber Autos machen Abgase, die der Luft schaden, und Lärm. Es gibt Unfälle, und Straßen und Parkplätze brauchen viel Platz."
            show: { object: car }
          - text: "Telefon und Handy\nVorteile: mit Menschen sprechen, die weit weg sind, im Notfall Hilfe rufen\nNachteile: immer erreichbar, oft zu lange am Bildschirm"
            say: "Mit dem Telefon und später dem Handy kann man mit Menschen sprechen, die weit weg wohnen, und im Notfall schnell Hilfe rufen. Aber man ist auch immer erreichbar, und viele schauen zu lange auf den Bildschirm."
            show: { object: mobile-phone }
          - text: "Eine Erfindung bewerten: Was wird besser? Was wird schwieriger? Für wen?"
            say: "Wenn du eine Erfindung bewertest, fragst du: Was wird besser, und was wird schwieriger? Für wen ist sie gut, und wem oder welcher Umwelt macht sie Probleme? Fast jede Erfindung hat beides."
          - text: "Wusstest du? 1888 fuhr Bertha Benz mit dem Auto ihres Mannes von Mannheim nach Pforzheim. Unterwegs kaufte sie den Treibstoff in einer Apotheke."
            say: "Wusstest du? Im Jahr achtzehnhundertachtundachtzig fuhr Bertha Benz mit dem Auto ihres Mannes Carl von Mannheim nach Pforzheim, ungefähr hundert Kilometer weit. Tankstellen gab es noch nicht. Darum kaufte sie den Treibstoff unterwegs in einer Apotheke."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Was hat die Erfindung verändert? Verbinde."
                pairs:
                  - { left: { text: "Buchdruck" }, right: { text: "Bücher wurden billiger, mehr Menschen lernten lesen." } }
                  - { left: { text: "Glühbirne" }, right: { text: "Abends wird es mit einem Schalter hell." } }
                  - { left: { text: "Telefon" }, right: { text: "Man spricht mit Menschen, die weit weg sind." } }
                  - { left: { text: "Auto" }, right: { text: "Man fährt schnell weite Strecken." } }
                hints:
                  - "Frag dich bei jeder Erfindung: Was konnte man danach, was vorher nicht ging?"
                  - "Die Glühbirne hat mit Licht zu tun, das Telefon mit Sprechen."
                  - "Buchdruck: Bücher. Glühbirne: Licht. Telefon: Sprechen. Auto: Fahren."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Das Auto: Vorteil oder Nachteil? Sortiere."
                bins:
                  - { id: plus, show: { text: "Vorteil" }, say: "Vorteil" }
                  - { id: minus, show: { text: "Nachteil" }, say: "Nachteil" }
                options:
                  - { text: "schnell weit fahren", bin: plus }
                  - { text: "schwere Sachen transportieren", bin: plus }
                  - { text: "Abgase", bin: minus }
                  - { text: "Lärm", bin: minus }
                hints:
                  - "Ein Vorteil macht etwas leichter, ein Nachteil macht Probleme."
                  - "Abgase und Lärm stören Menschen und schaden der Umwelt."
                  - "Fahren und Transportieren sind Vorteile, Abgase und Lärm Nachteile."
              - id: l2-f3
                type: multiple_choice
                text: "Wie lasen die Menschen abends, bevor es elektrisches Licht gab?"
                options: ["bei Kerzenlicht oder mit einer Öllampe", "mit einer Taschenlampe", "beim Licht vom Fernseher"]
                answer: "bei Kerzenlicht oder mit einer Öllampe"
                feedback:
                  "beim Licht vom Fernseher": "Ein Fernseher ohne Strom? Der bleibt schwarz! Man las bei Kerzenlicht oder mit einer Öllampe."
                hints:
                  - "Taschenlampe und Fernseher brauchen Strom."
                  - "Man brauchte eine kleine Flamme."
                  - "Bei Kerzenlicht oder mit einer Öllampe."
              - id: l2-f4
                type: true_false
                text: "Mit dem Buchdruck konnte man viele Bücher schneller herstellen als mit der Hand. Stimmt das?"
                answer: true
                hints:
                  - "Vorher wurde jedes Buch mit der Hand abgeschrieben."
                  - "Mit den Buchstaben aus Metall druckte man viele Seiten gleich."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: image_multiple_choice
                text: "Linas Oma wohnt weit weg. Welche Erfindung hilft Lina, mit ihr zu sprechen?"
                options: [{ object: telephone }, { object: bike }, { object: candle }]
                answer: telephone
                hints:
                  - "Lina will Omas Stimme hören, ohne hinzufahren."
                  - "Mit dieser Erfindung spricht man über weite Strecken."
                  - "Das Telefon."
              - id: l2-f6
                type: multiple_choice
                text: "Opa Karl sagt: „Das Handy ist nur gut.“ Lina sagt: „Es hat Vorteile und Nachteile.“ Wer hat recht?"
                options: ["Lina", "Opa Karl"]
                answer: "Lina"
                feedback:
                  "Opa Karl": "Mit dem Handy kann man Hilfe rufen, das ist gut. Aber zu lange am Bildschirm ist nicht gut. Es hat beides."
                hints:
                  - "Denk an das, was am Handy gut ist, und an das, was schwierig ist."
                  - "Im Notfall Hilfe rufen ist gut. Zu lange auf den Bildschirm schauen nicht."
                  - "Lina hat recht."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Das Handy: Vorteil oder Nachteil? Sortiere."
                bins:
                  - { id: plus, show: { text: "Vorteil" }, say: "Vorteil" }
                  - { id: minus, show: { text: "Nachteil" }, say: "Nachteil" }
                options:
                  - { text: "im Notfall Hilfe rufen", bin: plus }
                  - { text: "Oma ein Foto schicken", bin: plus }
                  - { text: "zu lange auf den Bildschirm schauen", bin: minus }
                  - { text: "beim Essen ständig Nachrichten bekommen", bin: minus }
                hints: ["Ein Nachteil stört dich oder tut dir nicht gut."]
              - id: l2-s2
                type: multiple_choice
                text: "Warum konnten nach der Erfindung des Buchdrucks mehr Menschen lesen lernen?"
                options: ["Weil es mehr und billigere Bücher gab.", "Weil die Bücher größer wurden.", "Weil Gutenberg in jede Schule ging."]
                answer: "Weil es mehr und billigere Bücher gab."
                hints: ["Wer lesen lernen will, braucht Bücher. Was wurde mit dem Buchdruck anders?"]
              - id: l2-s3
                type: true_false
                text: "Eine Erfindung hat immer nur Vorteile. Stimmt das?"
                answer: false
                hints: ["Denk an das Auto: Es bringt dich weit, aber was kommt aus dem Auspuff?"]
              - id: l2-s4
                type: multiple_choice
                text: "Was ist ein Nachteil vom Auto für die Umwelt?"
                options: ["die Abgase", "die vier Räder", "die bunte Farbe"]
                answer: "die Abgase"
                hints: ["Ein Nachteil für die Umwelt schadet zum Beispiel der Luft."]
              - id: l2-s5
                type: fill_in_blank
                text: "Was passt in die Lücken?"
                frame: "Bevor es die Glühbirne gab, machte man Licht mit _. Das war gefährlich, weil schnell ein _ ausbrechen konnte."
                options: ["Kerzen", "Spiegeln", "Feuer", "Regen"]
                answer: ["Kerzen", "Feuer"]
                hints: ["Eine Kerze hat eine Flamme."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Familie Yilmaz wohnt auf dem Land. Der nächste Supermarkt ist 10 Kilometer weit weg. Wie hilft ihr das Auto?"
                options: ["Sie kann schnell zum Einkaufen fahren.", "Sie muss nie mehr einkaufen.", "Das Auto kauft allein ein."]
                answer: "Sie kann schnell zum Einkaufen fahren."
              - id: l2-n2
                type: true_false
                text: "Für Autos braucht man viel Platz für Straßen und Parkplätze. Stimmt das?"
                answer: true
              - id: l2-n3
                type: sorting
                text: "Früher oder heute? Sortiere."
                bins:
                  - { id: then, show: { text: "früher" }, say: "früher" }
                  - { id: now, show: { text: "heute" }, say: "heute" }
                options:
