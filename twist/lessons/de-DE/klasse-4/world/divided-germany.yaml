# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.divided-germany
skill: world.time.divided-germany
curriculum: de-DE
language: de
title:
  de: Geteilt und wieder vereint
  en: Divided and reunited
summary: >
  A time trip with one family. Lesson 1 meets Katrin, ten years old in
  East Berlin in 1961, whose aunt lives a few streets away in West Berlin:
  the Second World War, which Germany started and lost, ended in 1945; the
  USA, Great Britain, France and the Soviet Union divided Germany and
  Berlin into four parts; in 1949 two German states came into being, the
  Bundesrepublik Deutschland in the west with free elections, free travel
  and free opinion, and the DDR in the east, where one party decided,
  elections were not free and people could not travel to the west; many
  people left, so on 13 August 1961 the DDR government had a wall built
  through Berlin and closed the guarded border; families and friends were
  separated for 28 years; the wall ran all round West Berlin, about 155 km.
  Lesson 2 meets Katrin again in 1989, now living in Leipzig with her son
  Tom: peaceful demonstrations with candles ("Wir sind das Volk!"), the
  border opened on 9 November 1989, the first free election in the DDR in
  March 1990, reunification on 3 October 1990 (Tag der Deutschen Einheit),
  Berlin the capital of all Germany, what is left of the wall today and the
  Ampelmännchen from the DDR. It ends with the skill check. Factual and
  calm: no violence at the border is described, only that it was guarded
  and crossing was forbidden; no party is named. No task names the current
  year.
metadata:
  year: klasse-4
  topic: { de: Leben in anderen Zeiten, en: Life in other times }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.time.timeline, world.time.sources, world.society.democracy-vote]
  also_practises: [world.time.timeline, world.society.democracy-vote]
  vocabulary: { de: [Zweiter Weltkrieg, Bundesrepublik Deutschland, DDR, Ost-Berlin, West-Berlin, Mauer, Grenze, Partei, Demonstration, friedlich, friedliche Revolution, Mauerfall, Wiedervereinigung, Tag der Deutschen Einheit, Hauptstadt, Zeitzeuge] }
  forms: [text, audio, picture, drawn]
  drawn: [number-line, germany-map, timeline]
  facets: []
  parts:
    - { id: division, what: { de: "erklären, warum es nach dem Krieg zwei deutsche Staaten gab und wie sie sich unterschieden", en: "explaining why there were two German states after the war and how they differed" } }
    - { id: wall, what: { de: "sagen, wann und warum die Mauer gebaut wurde und was sie für die Menschen bedeutete", en: "saying when and why the Wall was built and what it meant for people" } }
    - { id: unity, what: { de: "beschreiben, wie friedliche Demonstrationen zum Mauerfall und zur Wiedervereinigung 1990 führten", en: "describing how peaceful protests led to the fall of the Wall and reunification in 1990" } }
  misconceptions:
    - id: name-means-democracy
      what: Takes the DDR for a democracy because the word is in its name
      addressed: "lesson 1 Learn on the differences; l1-f4, l1-c4 and l2-c5, l2-c7"
    - id: fall-equals-unity
      what: Thinks the Wall opened and Germany was reunited on the same day
      addressed: "lesson 2 Learn has separate screens for November 1989, March 1990 and October 1990; l2-f2, l2-f5, l2-n1 and l2-c15"
    - id: west-built-wall
      what: Thinks the West built the Wall, or that both sides wanted it
      addressed: "lesson 1 Learn says the DDR government had it built and why; l1-f6, l1-n5"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Eine Mauer durch Berlin", en: "A wall through Berlin" }
    goal:
      de: "Finde mit Katrin heraus, warum es zwei deutsche Staaten gab und warum 1961 eine Mauer durch Berlin gebaut wurde."
      en: "Find out with Katrin why there were two German states and why a wall was built through Berlin in 1961."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Eine Wahl soll frei sein. Was heißt das?"
            options: ["Niemand darf dich zwingen, wen du wählst.", "Die Wahl kostet nichts.", "Jeder darf so oft wählen, wie er will."]
            answer: "Niemand darf dich zwingen, wen du wählst."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Eine Zeitzeugin war dabei und kann erzählen, wie es damals war. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Katrin ist 10 und wohnt 1961 in Berlin. Ihre Tante Ilse wohnt nur ein paar Straßen weiter.\n\nTrotzdem kann Katrin sie viele Jahre lang nicht besuchen. Was glaubst du: Warum?"
            say: "Das ist Katrin. Sie ist zehn Jahre alt und wohnt im Jahr neunzehnhunderteinundsechzig in Berlin. Ihre Tante Ilse wohnt nur ein paar Straßen weiter. Trotzdem kann Katrin sie viele Jahre lang nicht besuchen. Was glaubst du: Warum?"
            show: { object: house }
          - text: "1945 war der Zweite Weltkrieg zu Ende. Deutschland hatte ihn angefangen und verloren."
            say: "Die Antwort beginnt schon früher. Neunzehnhundertfünfundvierzig war der Zweite Weltkrieg zu Ende. Deutschland hatte ihn angefangen und verloren. Vier Länder, die den Krieg gewonnen hatten, teilten Deutschland in vier Teile auf: die USA, Großbritannien, Frankreich und die Sowjetunion. Auch Berlin wurde in vier Teile geteilt."
            show: { drawn: timeline, from: 1940, to: 1970, step: 5, events: [[1945, "Kriegsende"], [1949, "zwei Staaten"], [1961, "Mauerbau"]], highlight: 1945 }
          - text: "1949 entstanden zwei deutsche Staaten:\nim Westen die Bundesrepublik Deutschland,\nim Osten die DDR (auf der Karte gelb)."
            say: "Neunzehnhundertneunundvierzig entstanden daraus zwei deutsche Staaten. Im Westen die Bundesrepublik Deutschland. Im Osten, wo die Sowjetunion bestimmte, die DDR. Das heißt Deutsche Demokratische Republik. Auch Berlin blieb geteilt, in West-Berlin und Ost-Berlin. Ost-Berlin war die Hauptstadt der DDR. Katrin wohnt in Ost-Berlin, ihre Tante in West-Berlin. Auf der Karte ist die DDR gelb. Der rote Punkt ist Berlin."
            show: { drawn: germany-map, highlight: [mecklenburg-vorpommern, brandenburg, sachsen-anhalt, sachsen, thueringen], labels: none, mark: [berlin] }
          - text: "Bundesrepublik: freie Wahlen, frei reisen, offen seine Meinung sagen.\nDDR: eine Partei bestimmt, Wahlen nicht frei, nicht in den Westen reisen."
            say: "Die beiden Staaten waren sehr verschieden. In der Bundesrepublik gab es freie Wahlen, man konnte reisen und offen sagen, was man denkt. In der DDR bestimmte eine einzige Partei. Es gab zwar Wahlen, aber man konnte nicht wirklich auswählen. Man durfte nicht in den Westen reisen und nicht alles laut sagen. Die DDR hatte das Wort demokratisch im Namen, eine Demokratie war sie aber nicht."
          - text: "Viele Menschen verließen die DDR. Am 13. August 1961 ließ die Regierung der DDR eine Mauer durch Berlin bauen."
            say: "Sehr viele Menschen gingen aus der DDR weg in den Westen, oft über Berlin. Das wollte die Regierung der DDR verhindern. Am dreizehnten August neunzehnhunderteinundsechzig ließ sie die Grenze in Berlin über Nacht sperren, erst mit Zäunen, dann mit einer Mauer. Auch an der Grenze quer durch Deutschland gab es Zäune. Die Grenze wurde streng bewacht. Hinüber durfte niemand aus der DDR."
            show: { object: berlin-wall }
          - text: "Die Mauer trennte Familien und Freunde, 28 Jahre lang."
            say: "Katrin durfte ihre Tante in West-Berlin nicht mehr besuchen. Vielen Familien und Freunden ging es genauso. Sie sahen sich jahrelang nicht oder nur selten. Achtundzwanzig Jahre lang stand die Mauer."
            show: { object: heart }
          - text: "Wusstest du? Die Mauer lief einmal ganz um West-Berlin herum. Sie war ungefähr 155 Kilometer lang."
            say: "Wusstest du? Die Mauer lief einmal ganz um West-Berlin herum. West-Berlin war wie eine Insel mitten in der DDR. Zusammen war die Mauer ungefähr hundertfünfundfünfzig Kilometer lang."
            show: { object: berlin-wall }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Warum kann Katrin ihre Tante nicht mehr besuchen?"
                options: ["Eine Mauer trennt Ost-Berlin und West-Berlin.", "Ihre Tante wohnt auf einem anderen Kontinent.", "Katrin hat keine Lust dazu."]
                answer: "Eine Mauer trennt Ost-Berlin und West-Berlin."
                hints:
                  - "Katrin und ihre Tante wohnen in zwei Teilen von Berlin."
                  - "Was wurde 1961 durch Berlin gebaut?"
                  - "Eine Mauer trennt die beiden Teile."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Was geschah zuerst? Bring es in die richtige Reihenfolge."
                options: ["Die Mauer wird gebaut.", "Der Zweite Weltkrieg ist zu Ende.", "Zwei deutsche Staaten entstehen."]
                slot_count: 3
                answer: ["Der Zweite Weltkrieg ist zu Ende.", "Zwei deutsche Staaten entstehen.", "Die Mauer wird gebaut."]
                option_audio: false
                hints:
                  - "Die Jahreszahlen helfen: 1945, 1949, 1961."
                  - "Erst wurde Deutschland nach dem Krieg aufgeteilt. Dann entstanden die Staaten."
                  - "Kriegsende, zwei Staaten, Mauer."
              - id: l1-f3
                type: sorting
                text: "Bundesrepublik oder DDR? Sortiere."
                bins:
                  - { id: brd, show: { text: "Bundesrepublik" }, say: "Bundesrepublik" }
                  - { id: ddr, show: { text: "DDR" }, say: "DDR" }
                options:
                  - { text: "freie Wahlen", bin: brd }
                  - { text: "offen seine Meinung sagen", bin: brd }
                  - { text: "Eine Partei bestimmt alles.", bin: ddr }
                  - { text: "Reisen in den Westen verboten", bin: ddr }
                hints:
                  - "In einem der beiden Staaten durften die Menschen frei wählen."
                  - "Frei wählen, frei reden: Das war im Westen so."
                  - "Freie Wahlen und Meinung: Bundesrepublik. Eine Partei und Reiseverbot: DDR."
              - id: l1-f4
                type: true_false
                text: "Die DDR war eine Demokratie, weil das Wort demokratisch in ihrem Namen steht. Stimmt das?"
                answer: false
                hints:
                  - "Ein Name ist noch kein Beweis."
                  - "Waren die Wahlen in der DDR frei?"
                  - "Nein, die DDR war keine Demokratie."
              - id: l1-f5
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Im Jahr _ wurde die Mauer gebaut. Sie trennte Ost-Berlin und _."
                options: ["1961", "1990", "West-Berlin", "Hamburg"]
                answer: ["1961", "West-Berlin"]
                hints:
                  - "Katrin ist zehn, als die Mauer gebaut wird."
                  - "Katrin wohnt in Ost-Berlin. Wo wohnt ihre Tante?"
                  - "1961 und West-Berlin."
              - id: l1-f6
                type: multiple_choice
                text: "Warum ließ die Regierung der DDR die Mauer bauen?"
                options: ["Damit die Menschen aus der DDR nicht mehr in den Westen gehen konnten.", "Damit es in Berlin weniger Wind gibt.", "Weil die Menschen in West-Berlin es sich gewünscht hatten."]
                answer: "Damit die Menschen aus der DDR nicht mehr in den Westen gehen konnten."
                hints:
                  - "Vor 1961 verließen sehr viele Menschen die DDR."
                  - "Das wollte die Regierung der DDR verhindern."
                  - "Damit niemand mehr in den Westen gehen konnte."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Was gehört zusammen? Verbinde."
                pairs:
                  - { left: { text: "DDR" }, right: { text: "der Staat im Osten" } }
                  - { left: { text: "Bundesrepublik Deutschland" }, right: { text: "der Staat im Westen" } }
                  - { left: { object: berlin-wall }, right: { text: "trennte Ost-Berlin und West-Berlin" } }
                  - { left: { text: "1945" }, right: { text: "Ende des Zweiten Weltkriegs" } }
                hints: ["Der Staat, in dem Katrin wohnt, liegt im Osten."]
              - id: l1-s2
                type: true_false
                text: "Nach dem Krieg teilten vier Länder Deutschland in vier Teile auf. Stimmt das?"
                answer: true
                hints: ["Die USA, Großbritannien, Frankreich und die Sowjetunion hatten den Krieg gewonnen."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie lange stand die Mauer ungefähr?"
                options: ["ungefähr 2 Jahre", "ungefähr 28 Jahre", "ungefähr 280 Jahre"]
                answer: "ungefähr 28 Jahre"
                keep_order: true
                hints: ["Katrin war zehn, als die Mauer kam, und schon erwachsen, als sie wieder verschwand."]
              - id: l1-s4
                type: sorting
                text: "Was durfte Katrin in Ost-Berlin, was nicht? Sortiere."
                bins:
                  - { id: yes, show: { text: "durfte sie" }, say: "durfte sie" }
                  - { id: no, show: { text: "durfte sie nicht" }, say: "durfte sie nicht" }
                options:
                  - { text: "zur Schule gehen", bin: yes }
                  - { text: "mit Freundinnen spielen", bin: yes }
                  - { text: "ihre Tante in West-Berlin besuchen", bin: no }
                  - { text: "in den Westen reisen", bin: no }
                hints: ["Was lag hinter der Mauer?"]
              - id: l1-s5
                type: multiple_choice
                text: "Was bedeutete die Mauer für viele Familien?"
                options: ["Sie konnten sich jahrelang nicht oder nur selten sehen.", "Sie durften jeden Tag hinüber und zurück.", "Sie merkten gar nichts davon."]
                answer: "Sie konnten sich jahrelang nicht oder nur selten sehen."
                hints: ["Denk an Katrin und ihre Tante Ilse."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Ordne die Jahre: Was war zuerst?"
                options: ["1961", "1945", "1949"]
                slot_count: 3
                answer: ["1945", "1949", "1961"]
              - id: l1-n2
                type: true_false
                text: "In der DDR durften die Menschen frei in den Westen reisen. Stimmt das?"
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Katrin wohnt in Ost-Berlin. In welchem Staat lebt sie?"
                options: ["in der DDR", "in der Bundesrepublik Deutschland", "in Frankreich"]
                answer: "in der DDR"
              - id: l1-n4
                type: sorting
                text: "Wo war das so? Sortiere."
                bins:
                  - { id: brd, show: { text: "Bundesrepublik" }, say: "Bundesrepublik" }
                  - { id: ddr, show: { text: "DDR" }, say: "DDR" }
                options:
                  - { text: "Ost-Berlin war die Hauptstadt.", bin: ddr }
                  - { text: "Man konnte nicht wirklich auswählen.", bin: ddr }
                  - { text: "Die Menschen konnten frei wählen.", bin: brd }
                  - { text: "Man konnte reisen, wohin man wollte.", bin: brd }
              - id: l1-n5
                type: multiple_choice
                text: "Wer ließ die Mauer bauen?"
                options: ["die Regierung der DDR", "die Menschen in West-Berlin", "Katrins Tante Ilse"]
                answer: "die Regierung der DDR"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "In welchem Jahr wurde die Mauer gebaut?"
            options: ["1945", "1961", "1990"]
            answer: "1961"
            keep_order: true
          - id: l1-c2
            type: true_false
            text: "Die Mauer trennte Ost-Berlin und West-Berlin. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wie hieß der deutsche Staat im Osten?"
            options: ["DDR", "Bundesrepublik Deutschland", "Österreich"]
            answer: "DDR"
          - id: l1-c4
            type: true_false
            text: "In der DDR waren die Wahlen frei. Stimmt das?"
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Warum gab es von 1949 an zwei deutsche Staaten?"
            options: ["Nach dem Krieg war Deutschland in Teile aufgeteilt worden.", "Zwei Fußballvereine hatten sich gestritten.", "Ein König hatte das Land an seine zwei Kinder verschenkt."]
            answer: "Nach dem Krieg war Deutschland in Teile aufgeteilt worden."
          - id: l1-c6
            type: true_false
            text: "Wegen der Mauer konnten sich viele Familien lange nicht sehen. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Die Mauer fällt", en: "The Wall comes down" }
    goal:
      de: "Erlebe mit Tom, wie die Menschen 1989 friedlich demonstriert haben und Deutschland 1990 wieder ein Land wurde."
      en: "See with Tom how people protested peacefully in 1989 and Germany became one country again in 1990."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was trennte von 1961 an Ost-Berlin und West-Berlin?"
            options: ["eine Mauer", "ein breiter Fluss", "ein hohes Gebirge"]
            answer: "eine Mauer"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Die DDR lag im Westen von Deutschland. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "1989: Katrin ist erwachsen und wohnt mit ihrem Sohn Tom in Leipzig. Am Montagabend gehen sie mit vielen Menschen auf die Straße. Sie haben Kerzen in der Hand.\n\nWas glaubst du: Können Kerzen etwas verändern?"
            say: "Achtundzwanzig Jahre später, neunzehnhundertneunundachtzig. Katrin ist erwachsen und wohnt mit ihrem Sohn Tom in Leipzig. Tom ist zehn. Am Montagabend gehen sie mit vielen Menschen auf die Straße. Sie haben Kerzen in der Hand. Was glaubst du: Können Menschen mit Kerzen etwas verändern?"
            show: { object: candle }
          - text: "Die Menschen demonstrieren friedlich. Sie rufen: „Wir sind das Volk!“"
            say: "Ja! Die Menschen rufen: Wir sind das Volk! Sie wollen frei wählen, frei reisen und ihre Meinung sagen dürfen. Jede Woche kommen mehr, in Leipzig und in vielen anderen Städten der DDR. Sie bleiben friedlich, ohne Gewalt. Darum heißt das heute die friedliche Revolution."
          - text: "9. November 1989: Die Mauer ist offen!"
            say: "Am Abend des neunten November neunzehnhundertneunundachtzig wird die Grenze in Berlin geöffnet. Tausende Menschen gehen hinüber, umarmen sich und feiern. Das nennt man den Mauerfall. Ein paar Tage später besucht Katrin ihre Tante Ilse in West-Berlin, zum ersten Mal seit achtundzwanzig Jahren."
            show: { object: heart }
          - text: "März 1990: In der DDR gibt es zum ersten Mal freie Wahlen."
            say: "Im März neunzehnhundertneunzig dürfen die Menschen in der DDR zum ersten Mal frei wählen. Das neu gewählte Parlament beschließt, dass die DDR zur Bundesrepublik dazukommt."
            show: { drawn: timeline, from: 1985, to: 1995, step: 1, events: [[1989, "Mauer offen"], [1990, "freie Wahl"]], highlight: 1990 }
          - text: "3. Oktober 1990: Deutschland ist wieder ein Land. Das ist die Wiedervereinigung."
            say: "Am dritten Oktober neunzehnhundertneunzig ist Deutschland wieder ein Land. Das nennt man die Wiedervereinigung. Seitdem ist der dritte Oktober jedes Jahr ein Feiertag: der Tag der Deutschen Einheit. Berlin ist heute die Hauptstadt von ganz Deutschland. Auf der Karte ist Berlin der rote Punkt."
            show: { drawn: germany-map, labels: none, mark: [berlin] }
          - text: "Heute ist die Mauer fast überall abgerissen. Ein paar Reste erinnern an sie."
            say: "Nach dem Mauerfall wurde die Mauer fast überall abgerissen. An einigen Orten in Berlin sind Reste stehen geblieben, damit sich alle daran erinnern. An vielen Stellen zeigt eine Reihe aus Pflastersteinen im Boden, wo die Mauer einmal stand. Katrin erzählt Tom heute noch davon. Sie ist eine Zeitzeugin."
            show: { object: berlin-wall }
          - text: "Wusstest du? Das Ampelmännchen mit dem Hut wurde in der DDR erfunden."
            say: "Wusstest du? Das Ampelmännchen mit dem Hut wurde in der DDR erfunden. Nach der Wiedervereinigung sollte es zuerst verschwinden. Viele Menschen wollten es aber behalten. Heute leuchtet es in Berlin und in vielen anderen Städten."
            show: { object: traffic-light }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was wollten die Menschen bei den Demonstrationen 1989?"
                options: ["frei wählen, frei reisen und ihre Meinung sagen", "eine noch höhere Mauer", "einen König für die DDR"]
                answer: "frei wählen, frei reisen und ihre Meinung sagen"
                hints:
                  - "Die Menschen wollten das, was in der DDR verboten war."
                  - "Denk an die Unterschiede zwischen der DDR und der Bundesrepublik."
                  - "Frei wählen, frei reisen, die Meinung sagen."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Wie ging es weiter? Bring es in die richtige Reihenfolge."
                options: ["Die Mauer wird geöffnet.", "Deutschland ist wieder ein Land.", "Menschen demonstrieren mit Kerzen.", "In der DDR gibt es freie Wahlen."]
                slot_count: 4
                answer: ["Menschen demonstrieren mit Kerzen.", "Die Mauer wird geöffnet.", "In der DDR gibt es freie Wahlen.", "Deutschland ist wieder ein Land."]
                option_audio: false
                hints:
                  - "Am Anfang standen Tom und Katrin auf der Straße."
                  - "Erst kam der Mauerfall im November 1989, dann ging es 1990 weiter."
                  - "Demonstrationen, Mauerfall, freie Wahlen, Wiedervereinigung."
              - id: l2-f3
                type: true_false
                text: "Die Demonstrationen 1989 waren friedlich. Stimmt das?"
                answer: true
                hints:
                  - "Was hatten Tom und Katrin in der Hand?"
                  - "Die Menschen trugen Kerzen, keine Steine."
                  - "Ja, sie blieben friedlich."
              - id: l2-f4
                type: point_on_line
                text: "1990 wurde Deutschland wieder ein Land. Wo liegt das Jahr 1990? Tippe es an."
                say: "Neunzehnhundertneunzig wurde Deutschland wieder ein Land. Wo liegt das Jahr neunzehnhundertneunzig? Tippe es an."
                show: { drawn: number-line, from: 1940, to: 2000, step: 10, labels: ends }
                answer: 1990
                hints:
                  - "Jeder Strich ist ein Jahrzehnt."
                  - "2000 ist das rechte Ende. 1990 ist zehn Jahre früher."
                  - "Der Strich direkt links neben 2000."
              - id: l2-f5
                type: matching
                text: "Was geschah wann? Verbinde."
                pairs:
                  - { left: { text: "13. August 1961" }, right: { text: "Die Mauer wird gebaut." } }
                  - { left: { text: "9. November 1989" }, right: { text: "Die Mauer ist offen." } }
                  - { left: { text: "3. Oktober 1990" }, right: { text: "Deutschland ist wieder ein Land." } }
                hints:
                  - "Zwei Daten liegen nah beieinander, eins ist viel früher."
                  - "Das früheste Datum gehört zum Bau der Mauer."
                  - "1961 Bau, 1989 offen, 1990 wieder ein Land."
              - id: l2-f6
                type: image_multiple_choice
                text: "Was hatten viele Menschen in Leipzig bei den Demonstrationen in der Hand?"
                options: [{ object: candle }, { object: crown }, { object: ball }]
                answer: candle
                feedback:
                  crown: "Eine Krone? Die Menschen wollten keinen König, sondern freie Wahlen! Sie trugen Kerzen."
                hints:
                  - "Es war Abend, und es war dunkel."
                  - "Es leuchtet und ist ein Zeichen für Frieden."
                  - "Eine Kerze."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Feiertag erinnert an die Wiedervereinigung?"
                options: ["der Tag der Deutschen Einheit am 3. Oktober", "Silvester am 31. Dezember", "der Nikolaustag am 6. Dezember"]
                answer: "der Tag der Deutschen Einheit am 3. Oktober"
