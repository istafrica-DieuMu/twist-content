# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.energy-saving
skill: world.nature.energy-saving
curriculum: de-DE
language: de
title:
  de: Energie und Wasser sparen
  en: Saving energy and water
summary: >
  The Klasse 4b become Energiedetektive. Lesson 1: Lina searches her flat
  for wasted energy. Light off in an empty room; a device on Standby
  still uses Strom, so switch it off fully (a Steckdosenleiste with a
  switch) and unplug the charger; heating uses a lot of energy, so in
  winter air the room briefly with the window wide open (Stoßlüften)
  instead of leaving it tilted, and put on a jumper before turning the
  heating up; a lid on the pot; the fridge runs day and night, so close
  its door quickly. Saving means less Kohle, Erdöl and Erdgas burned,
  fewer Abgase, lower costs. Lesson 2: water at home and energy at school.
  A short shower usually needs much less water than a full bath, and warm
  water needs energy; tap off while brushing teeth, with a cup; tell an
  adult about a dripping tap; the small Spartaste on the toilet;
  rainwater for the plants; cleaning and pumping drinking water needs
  energy too. At school: light off in the break, Stoßlüften, computers and
  tablets switched off fully. It ends with the skill check. Names and
  story are written for Twist.
metadata:
  year: klasse-4
  topic: { de: Energie und Klima, en: Energy and climate }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.nature.energy-sources, world.nature.drinking-water]
  also_practises: [world.nature.energy-sources]
  vocabulary: { de: [Energie, sparen, verschwenden, Strom, Standby, Steckdosenleiste, Ladegerät, Heizung, Stoßlüften, gekippt, Deckel, Kühlschrank, Vollbad, Duschen, Wasserhahn, tropfen, Spartaste, Regenwasser, Abgase] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: power, what: { de: "Strom und Heizenergie zu Hause und in der Schule sparen", en: "saving electricity and heating energy at home and at school" } }
    - { id: water, what: { de: "Wasser im Alltag sparen", en: "saving water in daily life" } }
    - { id: why, what: { de: "erklären, warum Sparen hilft: weniger Abgase, endliche Quellen reichen länger, weniger Kosten", en: "explaining why saving helps: fewer exhaust gases, finite sources last longer, lower costs" } }
  misconceptions:
    - id: standby-is-off
      what: Thinks a device on Standby is off and uses no electricity
      addressed: "lesson 1 Learn on Standby and the red light; l1-f4, l1-n1, l1-c3 and l2-c6"
    - id: tilted-window
      what: Thinks a window left tilted all day in winter is a good way to air a room, or that an open fridge cools the kitchen
      addressed: "lesson 1 Learn on Stoßlüften and the Wusstest du screen on the fridge; l1-f5, l1-n2, l1-n4, l2-n4 and l2-c2"
    - id: my-part-too-small
      what: Thinks one child's saving makes no difference, or that saving is only for adults
      addressed: "lesson 2 Learn on the whole class saving together; l2-c19 and l2-c20"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Energiedetektive zu Hause", en: "Energy detectives at home" }
    goal:
      de: "Finde heraus, wo zu Hause Energie verschwendet wird, und wie du sie sparst. Zum Beispiel machst du das Licht aus, wenn niemand im Zimmer ist."
      en: "Find out where energy is wasted at home and how you save it. For example, you switch the light off when nobody is in the room."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Woraus macht eine Solaranlage Strom?"
            options: ["aus Sonnenlicht", "aus Erdgas", "aus Kohle"]
            answer: "aus Sonnenlicht"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wo wird das schmutzige Wasser aus dem Waschbecken wieder sauber?"
            options: ["in der Kläranlage", "im Kühlschrank", "im Wasserhahn"]
            answer: "in der Kläranlage"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lina geht abends durch die Wohnung. Im leeren Kinderzimmer brennt Licht. Der Fernseher zeigt ein rotes Lämpchen. Das Fenster ist gekippt, und die Heizung läuft.\n\nWo geht hier Energie verloren?"
            say: "Die Klasse 4b sind jetzt Energiedetektive. Lina geht abends durch die Wohnung. Im leeren Kinderzimmer brennt Licht. Der Fernseher ist aus, aber ein kleines rotes Lämpchen leuchtet. Das Fenster ist gekippt, und die Heizung läuft. Was glaubst du: Wo geht hier Energie verloren?"
            show: { object: house }
          - text: "Überall! Erste Regel: Licht aus, wenn niemand im Zimmer ist."
            say: "Überall! Erste Regel für Energiedetektive: Licht aus, wenn niemand im Zimmer ist. Eine Lampe in einem leeren Zimmer leuchtet für niemanden."
            show: { object: lamp }
          - text: "Das rote Lämpchen heißt Standby. Das Gerät braucht weiter Strom. Ganz ausschalten hilft, zum Beispiel mit einer Steckdosenleiste mit Schalter."
            say: "Das rote Lämpchen am Fernseher heißt Standby. Der Fernseher wartet nur und braucht dabei weiter Strom. Besser ist es, Geräte ganz auszuschalten, zum Beispiel mit einer Steckdosenleiste mit Schalter. Und wenn dein Handy voll ist, zieh das Ladegerät aus der Steckdose."
            show: { object: mobile-phone }
          - text: "Heizen braucht viel Energie. Im Winter: kurz und weit lüften, nicht stundenlang kippen. Ist dir kühl? Zieh erst einen Pullover an."
            say: "Heizen braucht besonders viel Energie. Ein gekipptes Fenster lässt stundenlang die Wärme hinaus. Im Winter lüftet man darum kurz und weit: Heizung kleiner drehen, Fenster ein paar Minuten ganz aufmachen, dann wieder zu. Das heißt Stoßlüften. Und wenn dir kühl ist, zieh erst einen Pullover an, bevor du die Heizung höher drehst."
            show: { object: window }
          - text: "In der Küche: Deckel auf den Topf. Der Kühlschrank läuft Tag und Nacht, also die Tür schnell wieder zumachen."
            say: "In der Küche gibt es auch viel zu entdecken. Mit einem Deckel auf dem Topf kocht das Wasser schneller und braucht weniger Energie. Der Kühlschrank läuft Tag und Nacht. Darum machst du seine Tür schnell wieder zu."
            show: { object: fridge }
          - text: "Wer Energie spart, braucht weniger Kohle, Erdöl und Erdgas. So gibt es weniger Abgase, und die Familie spart Geld."
            say: "Warum lohnt sich das? Viel Strom und Wärme kommen noch aus Kohle, Erdöl und Erdgas. Wer Energie spart, sorgt dafür, dass weniger davon verbrannt wird. So kommen weniger Abgase in die Luft, die endlichen Quellen reichen länger, und die Familie spart Geld."
          - text: "Wusstest du? Wenn die Kühlschranktür offen bleibt, wird die Küche nicht kälter, sondern wärmer."
            say: "Wusstest du? Wenn die Kühlschranktür offen bleibt, wird die Küche nicht kälter, sondern ein bisschen wärmer! Der Kühlschrank pumpt die Wärme aus seinem Inneren nach draußen, hinten an seiner Rückseite. Bleibt die Tür offen, arbeitet er ohne Pause und wird dabei hinten immer wärmer."
            show: { object: fridge }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Spart das Energie, oder wird Energie verschwendet? Sortiere."
                bins:
                  - { id: spart, show: { text: "spart Energie" }, say: "spart Energie" }
                  - { id: versch, show: { text: "verschwendet Energie" }, say: "verschwendet Energie" }
                options:
                  - { text: "Licht aus beim Rausgehen", bin: spart }
                  - { text: "Deckel auf den Topf", bin: spart }
                  - { text: "Fernseher auf Standby", bin: versch }
                  - { text: "Fenster im Winter den ganzen Tag gekippt", bin: versch }
                hints:
                  - "Frag dich: Wird hier Strom oder Wärme gebraucht, obwohl es nicht nötig ist?"
                  - "Auf Standby braucht ein Gerät weiter Strom. Durch ein gekipptes Fenster geht stundenlang Wärme hinaus."
                  - "Licht aus und Deckel drauf sparen. Standby und gekipptes Fenster verschwenden."
              - id: l1-f2
                type: multiple_choice
                text: "Im Kinderzimmer ist niemand, aber das Licht brennt. Was macht Lina?"
                options: ["Sie macht das Licht aus.", "Sie macht noch eine Lampe an.", "Sie lässt es bis morgen an."]
                answer: "Sie macht das Licht aus."
                feedback:
                  "Sie macht noch eine Lampe an.": "Noch mehr Licht für ein leeres Zimmer? Die Kuscheltiere freuen sich, aber das verschwendet Energie!"
                hints:
                  - "Braucht ein leeres Zimmer Licht?"
                  - "Eine Lampe in einem leeren Zimmer leuchtet für niemanden."
                  - "Sie macht das Licht aus."
                difficulty: easy
              - id: l1-f3
                type: image_multiple_choice
                text: "Welches Gerät läuft Tag und Nacht?"
                options: [{ object: fridge }, { object: kettle }, { object: oven }]
                answer: fridge
                hints:
                  - "Welches Gerät muss die Lebensmittel immer kühl halten?"
                  - "Seine Tür soll man schnell wieder zumachen."
                  - "Der Kühlschrank."
              - id: l1-f4
                type: true_false
                text: "Ein Fernseher auf Standby braucht keinen Strom. Stimmt das?"
                answer: false
                hints:
                  - "Was zeigt das kleine rote Lämpchen?"
                  - "Auf Standby wartet das Gerät nur. Dabei braucht es weiter Strom."
                  - "Nein, auf Standby braucht er weiter Strom."
              - id: l1-f5
                type: multiple_choice
                text: "Es ist Winter. Wie lüftet Lina richtig?"
                options: ["Fenster ein paar Minuten weit auf, dann wieder zu", "Fenster den ganzen Tag gekippt lassen", "gar nicht lüften"]
                answer: "Fenster ein paar Minuten weit auf, dann wieder zu"
                hints:
                  - "Frische Luft ist wichtig, aber die Wärme soll nicht stundenlang hinaus."
                  - "Kurz und weit lüften heißt Stoßlüften."
                  - "Ein paar Minuten weit auf, dann wieder zu."
              - id: l1-f6
                type: matching
                text: "Was hilft? Verbinde."
                pairs:
                  - { left: { text: "Licht im leeren Zimmer" }, right: { text: "ausschalten" } }
                  - { left: { text: "Topf ohne Deckel" }, right: { text: "Deckel drauflegen" } }
                  - { left: { text: "Fernseher auf Standby" }, right: { text: "an der Steckdosenleiste ganz ausschalten" } }
                  - { left: { text: "Zimmer zu warm" }, right: { text: "Heizung kleiner drehen" } }
                hints:
                  - "Zu jedem Problem gibt es genau einen Tipp."
                  - "Was macht man mit einem Topf, mit Licht, mit Standby und mit zu viel Wärme?"
                  - "Licht: aus. Topf: Deckel. Standby: Steckdosenleiste. Zu warm: Heizung kleiner."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Mit einem Deckel auf dem Topf kocht das Wasser schneller. Stimmt das?"
                answer: true
                hints: ["Der Deckel hält die Wärme im Topf."]
              - id: l1-s2
                type: multiple_choice
                text: "Lina ist es im Wohnzimmer ein bisschen kühl. Was spart am meisten Energie?"
                options: ["einen Pullover anziehen", "die Heizung ganz hoch drehen und das Fenster kippen", "den Backofen aufmachen"]
                answer: "einen Pullover anziehen"
                feedback:
                  "den Backofen aufmachen": "Den Backofen als Heizung? Das kostet viel Strom und ist gefährlich. Ein Pullover wärmt ohne Energie."
                hints: ["Was wärmt dich, ohne dass Strom oder Gas gebraucht wird?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Wer das Zimmer verlässt, macht das Licht _. Im Winter lüftet man kurz und _."
                options: ["aus", "weit", "an", "gekippt"]
                answer: ["aus", "weit"]
                hints: ["Licht im leeren Zimmer braucht niemand. Stoßlüften heißt: Fenster ganz auf."]
              - id: l1-s4
                type: sorting
                text: "Spart das Energie, oder wird Energie verschwendet? Sortiere."
                bins:
                  - { id: spart, show: { text: "spart Energie" }, say: "spart Energie" }
                  - { id: versch, show: { text: "verschwendet Energie" }, say: "verschwendet Energie" }
                options:
                  - { text: "Heizung beim Lüften kleiner drehen", bin: spart }
                  - { text: "Geräte ganz ausschalten", bin: spart }
                  - { text: "Kühlschranktür lange offen lassen", bin: versch }
                  - { text: "Ladegerät nach dem Laden in der Steckdose lassen", bin: versch }
                hints: ["Ein Ladegerät in der Steckdose und ein offener Kühlschrank brauchen Strom für nichts."]
              - id: l1-s5
                type: true_false
                text: "Wenn Linas Familie Energie spart, wird weniger Kohle, Erdöl und Erdgas verbrannt. Stimmt das?"
                answer: true
                hints: ["Viel Strom und Wärme kommen noch aus Kohle, Erdöl und Erdgas."]
              - id: l1-s6
                type: multiple_choice
                text: "Warum spart Linas Familie Energie?"
                options: ["Es gibt weniger Abgase, und es kostet weniger Geld.", "Damit die Lampen schöner leuchten.", "Damit der Kühlschrank Ferien hat."]
                answer: "Es gibt weniger Abgase, und es kostet weniger Geld."
                hints: ["Denk an die Luft und an das Geld der Familie."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Der Fernseher ist aus, aber ein kleines rotes Lämpchen leuchtet. Was heißt das?"
                options: ["Er ist auf Standby und braucht noch Strom.", "Er ist kaputt.", "Er braucht gar keinen Strom mehr."]
                answer: "Er ist auf Standby und braucht noch Strom."
              - id: l1-n2
                type: true_false
                text: "Wenn die Kühlschranktür offen bleibt, wird die Küche schön kühl. Stimmt das?"
                answer: false
              - id: l1-n3
                type: sorting
                text: "Spart das Energie, oder wird Energie verschwendet? Sortiere."
                bins:
                  - { id: spart, show: { text: "spart Energie" }, say: "spart Energie" }
                  - { id: versch, show: { text: "verschwendet Energie" }, say: "verschwendet Energie" }
                options:
                  - { text: "den Laptop ganz ausschalten", bin: spart }
                  - { text: "die Tür zum kalten Flur zumachen", bin: spart }
                  - { text: "das Licht im Flur die ganze Nacht anlassen", bin: versch }
                  - { text: "heizen und dabei das Fenster kippen", bin: versch }
              - id: l1-n4
                type: ordering
                text: "So lüftet Lina im Winter. Bring die Schritte in die richtige Reihenfolge."
                options: ["Fenster schließen und Heizung wieder aufdrehen.", "Fenster weit öffnen.", "Heizung kleiner drehen.", "Ein paar Minuten warten."]
                slot_count: 4
                answer: ["Heizung kleiner drehen.", "Fenster weit öffnen.", "Ein paar Minuten warten.", "Fenster schließen und Heizung wieder aufdrehen."]
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Lina schreibt einen Energiespar-Plan. Welcher Satz passt nicht auf ihren Plan?"
                options: ["Den Backofen offen lassen, damit die Küche warm wird.", "Licht aus, wenn ich rausgehe.", "Deckel auf den Topf."]
                answer: "Den Backofen offen lassen, damit die Küche warm wird."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was spart Strom?"
            options: ["Licht ausmachen, wenn niemand im Zimmer ist", "den Fernseher auf Standby lassen", "die Kühlschranktür offen lassen"]
            answer: "Licht ausmachen, wenn niemand im Zimmer ist"
          - id: l1-c2
            type: true_false
            text: "Im Winter lüftet man am besten kurz mit weit offenem Fenster. Stimmt das?"
            answer: true
          - id: l1-c3
            type: true_false
            text: "Ein Gerät auf Standby ist ganz aus. Stimmt das?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Wie kocht das Nudelwasser schneller und mit weniger Energie?"
            options: ["mit Deckel auf dem Topf", "ohne Deckel", "mit offenem Fenster daneben"]
            answer: "mit Deckel auf dem Topf"
          - id: l1-c5
            type: image_multiple_choice
            text: "Dir ist kühl. Was ziehst du an, bevor du die Heizung höher drehst?"
            options: [{ object: jumper }, { object: t-shirt }, { object: glasses }]
            answer: jumper
          - id: l1-c6
            type: multiple_choice
            text: "Warum ist Energiesparen gut?"
            options: ["Es wird weniger verbrannt, und es kostet weniger Geld.", "Dann geht der Strom nie aus.", "Dann scheint die Sonne länger."]
            answer: "Es wird weniger verbrannt, und es kostet weniger Geld."

  - n: 2
    title: { de: "Wasser sparen, auch in der Schule", en: "Saving water, at school too" }
    goal:
      de: "Finde heraus, wie du Wasser sparst, und wie deine Klasse in der Schule Energie spart. Zum Beispiel drehst du beim Zähneputzen den Hahn zu."
      en: "Find out how you save water and how your class saves energy at school. For example, you turn the tap off while you brush your teeth."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Lina verlässt ihr Zimmer. Was macht sie mit dem Licht?"
            options: ["Sie macht es aus.", "Sie lässt es an.", "Sie macht es heller."]
            answer: "Sie macht es aus."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein Topf ohne Deckel braucht weniger Energie als ein Topf mit Deckel. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was braucht mehr Wasser: ein Vollbad oder fünf Minuten Duschen?"
            say: "Heute untersuchen die Energiedetektive das Wasser. Was glaubst du: Was braucht mehr Wasser, ein Vollbad in der Badewanne oder fünf Minuten Duschen?"
            show: { object: bath }
          - text: "Ein Vollbad braucht meist viel mehr Wasser. Und warmes Wasser braucht auch Energie."
            say: "Ein Vollbad braucht meistens viel mehr Wasser als eine kurze Dusche. Und noch etwas: Das warme Wasser muss erst erwärmt werden. Dafür braucht man Energie. Auch Trinkwasser wird gereinigt und durch Rohre zu dir gepumpt. Auch das braucht Energie. Wer Wasser spart, spart also auch Energie."
          - text: "Beim Zähneputzen den Hahn zudrehen und einen Zahnputzbecher nehmen."
            say: "Beim Zähneputzen läuft oft die ganze Zeit Wasser, das niemand braucht. Dreh den Hahn zu und nimm einen Zahnputzbecher. Genauso beim Einseifen der Hände: Wasser ab, einseifen, dann abspülen."
            show: { object: toothbrush }
          - text: "Ein Hahn tropft? Sag einem Erwachsenen Bescheid. Auf der Toilette: die kleine Spartaste."
            say: "Ein tropfender Wasserhahn verliert Tropfen für Tropfen, Tag und Nacht. Sag einem Erwachsenen oder dem Hausmeister Bescheid. Und viele Toiletten haben zwei Tasten. Die kleine Spartaste spült mit weniger Wasser."
          - text: "Die Blumen bekommen Regenwasser aus der Regentonne."
            say: "Die 4b sammelt Regenwasser in einer Regentonne. Damit gießt sie die Blumen und das Hochbeet. Die Pflanzen mögen Regenwasser, und das Trinkwasser bleibt zum Trinken."
            show: { object: watering-can }
          - text: "In der Schule: Licht aus in der Pause. Stoßlüften. Computer und Tablets nach dem Unterricht ganz ausschalten."
            say: "Auch in der Schule kann die Klasse viel tun. In der Pause macht der Lichtdienst das Licht aus. Gelüftet wird kurz und weit. Computer, Tablets und die digitale Tafel brauchen Strom, beim Benutzen und beim Laden. Darum werden sie nach dem Unterricht ganz ausgeschaltet. Ein Kind allein spart ein bisschen. Wenn alle mitmachen, wird daraus viel."
            show: { object: school }
          - text: "Wusstest du? Zu Hause braucht das Heizen die meiste Energie, mehr als alle Lampen und Geräte zusammen."
            say: "Wusstest du? In einer Wohnung in Deutschland braucht das Heizen die meiste Energie. Es braucht mehr als alle Lampen, der Fernseher, der Kühlschrank und alle anderen Geräte zusammen. Darum lohnt es sich so sehr, richtig zu lüften und die Heizung nicht zu warm zu drehen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Spart das Wasser, oder wird Wasser verschwendet? Sortiere."
                bins:
                  - { id: spart, show: { text: "spart Wasser" }, say: "spart Wasser" }
                  - { id: versch, show: { text: "verschwendet Wasser" }, say: "verschwendet Wasser" }
                options:
                  - { text: "kurz duschen statt baden", bin: spart }
                  - { text: "beim Zähneputzen den Hahn zudrehen", bin: spart }
                  - { text: "den tropfenden Hahn einfach tropfen lassen", bin: versch }
                  - { text: "beim Einseifen das Wasser laufen lassen", bin: versch }
                hints:
                  - "Frag dich: Läuft hier Wasser, das niemand braucht?"
                  - "Beim Einseifen und bei einem tropfenden Hahn läuft Wasser für nichts."
                  - "Kurz duschen und Hahn zu sparen. Tropfen lassen und beim Einseifen laufen lassen verschwenden."
              - id: l2-f2
                type: multiple_choice
                text: "Was braucht meistens weniger Wasser?"
                options: ["fünf Minuten duschen", "ein Vollbad"]
                answer: "fünf Minuten duschen"
                keep_order: true
                hints:
                  - "Stell dir vor, wie viel Wasser in eine volle Badewanne passt."
                  - "Beim kurzen Duschen fließt nur ein paar Minuten lang Wasser."
                  - "Kurz duschen braucht meistens weniger."
                difficulty: easy
              - id: l2-f3
                type: image_multiple_choice
                text: "Was nimmt Lina beim Zähneputzen, damit kein Wasser unnötig läuft?"
                options: [{ object: cup }, { object: bucket }, { object: bath }]
                answer: cup
                feedback:
                  bath: "Eine ganze Badewanne zum Zähneputzen? Da passt viel zu viel Wasser hinein! Ein Becher reicht."
                hints:
                  - "Sie braucht nur ein bisschen Wasser zum Ausspülen."
                  - "Es ist klein und steht oft am Waschbecken."
                  - "Ein Becher."
              - id: l2-f4
                type: true_false
                text: "Wer weniger warmes Wasser braucht, spart auch Energie. Stimmt das?"
                answer: true
                hints:
                  - "Woher kommt die Wärme im warmen Wasser?"
                  - "Das Wasser muss erst erwärmt werden, und dafür braucht man Energie."
                  - "Ja, weniger warmes Wasser spart auch Energie."
              - id: l2-f5
                type: multiple_choice
                text: "Pause! Alle Kinder der 4b sind auf dem Schulhof. Was macht der Lichtdienst?"
                options: ["Er macht das Licht aus.", "Er macht alle Lampen an.", "Er kippt die Fenster und dreht die Heizung hoch."]
                answer: "Er macht das Licht aus."
                hints:
                  - "Ist während der Pause jemand im Klassenzimmer?"
                  - "Licht im leeren Raum leuchtet für niemanden."
                  - "Er macht das Licht aus."
              - id: l2-f6
                type: matching
