# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.municipality
skill: world.society.municipality
curriculum: de-DE
language: de
title:
  de: Was die Gemeinde für uns tut
  en: What the local council does for us
summary: >
  Mia's class, the 4b in the made-up town of Lindenau, finds a broken swing
  on the playground and wants a climbing wall. Lesson 1 follows Mia
  through her morning and asks who looks after the street lamps, the bins,
  the playground and the bus: the Gemeinde, a village or a town with
  everyone who lives there. It names what the Gemeinde looks after
  (playgrounds, streets and cycle paths, the school building, the library,
  the swimming pool, the bins, the fire brigade), what the Rathaus does
  (an identity card, registering after a move) and who helps in an
  emergency: the fire brigade on 112, which the Gemeinde runs, and the
  police on 110, which belongs to the Land and helps in every town. Lesson
  2 asks who decides: the people elect the Gemeinderat (Stadtrat in a
  town), which meets in the Rathaus and decides by majority; in most Länder
  they also elect the mayor; the money comes from taxes and fees and is
  never enough for every wish; children can have a say by writing to the
  mayor or, where there is one, in a children's council. It ends with the
  skill check. Strictly non-partisan: no parties, politicians or current
  issues. Lindenau, its mayor and every name are written for Twist.
metadata:
  year: klasse-4
  topic: { de: Mitbestimmen, en: Having a say }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.society.democracy-vote]
  also_practises: [world.society.democracy-vote]
  vocabulary: { de: [Gemeinde, Dorf, Stadt, Rathaus, Bürgermeisterin, Bürgermeister, Gemeinderat, Stadtrat, Feuerwehr, Polizei, Notruf, Müllabfuhr, Bücherei, Spielplatz, Ausweis, Steuern, Gebühr, Kinderparlament] }
  forms: [text, audio, picture, drawn]
  drawn: [bar-chart]
  facets: []
  parts:
    - { id: services, what: { de: "sagen, wofür die Gemeinde sorgt, und was ohne sie fehlen würde", en: "saying what the local council looks after, and what would be missing without it" } }
    - { id: help, what: { de: "wissen, wobei Rathaus, Feuerwehr und Polizei helfen und wie man sie erreicht", en: "knowing what the town hall, the fire brigade and the police help with and how to reach them" } }
    - { id: decide, what: { de: "erklären, wer in der Gemeinde entscheidet, woher das Geld kommt und wie Kinder mitreden können", en: "explaining who decides in the local council, where the money comes from and how children can have a say" } }
  misconceptions:
    - id: things-just-happen
      what: Thinks street lamps, emptied bins and repaired playgrounds just happen, or that each family looks after the street itself
      addressed: "lesson 1 opens with Mia's morning and asks who looks after it; l1-f1, l1-f4, l1-n5 and l2-f5, l2-c3, l2-c5"
    - id: mayor-decides-alone
      what: Thinks the mayor decides everything alone, like a king of the town
      addressed: "lesson 2 Learn says the elected Gemeinderat decides by majority; l2-f2, l2-s3, l2-n2 and l2-c15, l2-c17"
    - id: endless-money
      what: Thinks the Gemeinde has endless money and can build every wish
      addressed: "lesson 2 Learn says the money comes from taxes and fees and must be shared out; l2-f3, l2-s5 and l2-c18, l2-c19"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wer kümmert sich darum?", en: "Who looks after it?" }
    goal:
      de: "Finde heraus, wofür deine Gemeinde sorgt, vom Spielplatz bis zur Feuerwehr."
      en: "Find out what your local council looks after, from the playground to the fire brigade."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Die 4b stimmt ab: Kletterwand 15 Stimmen, Sandkasten 9 Stimmen. Was gilt?"
            options: ["die Kletterwand", "der Sandkasten", "beides halb"]
            answer: "die Kletterwand"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Bei einer geheimen Wahl sieht jeder, wen du ankreuzt. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mia geht zur Schule. Die Straßenlampen leuchten, die Mülltonnen sind leer, der Bus kommt.\n\nWer kümmert sich um all das?"
            say: "Mia wohnt in Lindenau und geht morgens zur Schule. Die Straßenlampen leuchten noch, die Mülltonnen sind geleert, und an der Haltestelle kommt der Bus. Was glaubst du: Wer kümmert sich eigentlich um all das? Mias Eltern, die Lehrerin, oder jemand ganz anderes?"
            show: { object: sign-bus-stop }
          - text: "Das macht die Gemeinde. Die Gemeinde ist dein Wohnort: ein Dorf oder eine Stadt, mit allen, die dort wohnen."
            say: "Darum kümmert sich die Gemeinde. Die Gemeinde ist dein Wohnort, mit allen Menschen, die dort wohnen. Das kann ein kleines Dorf sein oder eine große Stadt. Jedes Dorf und jede Stadt in Deutschland ist eine Gemeinde oder gehört zu einer."
            show: { object: house }
          - text: "Die Gemeinde sorgt für Dinge, die alle brauchen: Spielplätze, Straßen und Radwege, Straßenlampen, das Schulgebäude, die Bücherei, oft auch ein Schwimmbad."
            say: "Die Gemeinde sorgt für Dinge, die alle brauchen und die keine Familie allein bauen kann. Sie baut Spielplätze und repariert Straßen und Radwege. Sie sorgt für die Straßenlampen, für das Schulgebäude und für die Bücherei. Viele Gemeinden haben auch ein Schwimmbad."
            show: { object: library }
          - text: "Die Müllabfuhr leert die Mülltonnen. Die Gemeinde und der Kreis sorgen dafür."
            say: "Auch der Müll muss weg. Die Müllabfuhr leert die Mülltonnen jede Woche oder alle zwei Wochen. Dafür sorgen die Gemeinde und der Kreis. Ohne Müllabfuhr würde der Müll bald auf den Straßen liegen und stinken."
            show: { object: bin }
          - text: "Es brennt? Notruf 112: Die Feuerwehr kommt.\nEin Diebstahl? Notruf 110: Die Polizei kommt."
            say: "Wenn es brennt, rufst du die Eins Eins Zwei. Dann kommt die Feuerwehr. Für die Feuerwehr sorgt die Gemeinde. Die Feuerwehr löscht Brände und rettet Menschen und Tiere. Wird etwas gestohlen oder bist du in Gefahr, rufst du die Eins Eins Null. Dann kommt die Polizei. Die Polizei gehört zum Bundesland, aber sie hilft in jeder Gemeinde."
            show: { object: fire-engine }
          - text: "Im Rathaus arbeitet die Gemeinde. Dort bekommt man zum Beispiel einen Ausweis und meldet sich an, wenn man umzieht."
            say: "Im Rathaus arbeiten viele Menschen für die Gemeinde. Dorthin geht man zum Beispiel, wenn man einen Ausweis braucht, oder wenn man in die Gemeinde zieht und sich anmelden muss. Mias Klasse will bald ins Rathaus. Die Schaukel auf dem Spielplatz ist nämlich kaputt."
            show: { object: park }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Wer kümmert sich darum? Sortiere."
                say: "Wer kümmert sich darum: die Gemeinde oder Mias Familie? Sortiere."
                bins:
                  - { id: gemeinde, show: { text: "die Gemeinde" }, say: "die Gemeinde" }
                  - { id: familie, show: { text: "Mias Familie" }, say: "Mias Familie" }
                options:
                  - { text: "die kaputte Schaukel auf dem Spielplatz reparieren", bin: gemeinde }
                  - { text: "das Loch in der Straße zumachen", bin: gemeinde }
                  - { text: "Mias Zimmer aufräumen", bin: familie }
                  - { text: "den Hund der Familie füttern", bin: familie }
                hints:
                  - "Die Gemeinde sorgt für Dinge, die allen gehören und die alle brauchen."
                  - "Gehört es allen in Lindenau, oder nur Mias Familie?"
                  - "Schaukel und Straße: Gemeinde. Zimmer und Hund: Familie."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Mia möchte ein Buch über Wale ausleihen. Wohin geht sie?"
                options: [{ object: library }, { object: supermarket }, { object: station }]
                answer: library
                feedback:
                  supermarket: "Im Supermarkt kann Mia das Buch vielleicht kaufen, aber nicht ausleihen. Ausleihen kann sie es in der Bücherei."
                hints:
                  - "Dort stehen viele Bücher, und man bringt sie nach ein paar Wochen zurück."
                  - "Die Gemeinde sorgt für diesen Ort."
                  - "In die Bücherei."
              - id: l1-f3
                type: multiple_choice
                text: "Was ist eine Gemeinde?"
                options: ["ein Dorf oder eine Stadt mit allen, die dort wohnen", "nur das Rathaus", "ein Verein für Fußball"]
                answer: "ein Dorf oder eine Stadt mit allen, die dort wohnen"
                hints:
                  - "Die Gemeinde ist dein Wohnort."
                  - "Zu deinem Wohnort gehören die Häuser, die Straßen und alle Menschen dort."
                  - "Ein Dorf oder eine Stadt mit allen, die dort wohnen."
              - id: l1-f4
                type: true_false
                text: "Die Schaukel auf dem Spielplatz ist kaputt.\n\nMuss Mias Familie sie reparieren?"
                answer: false
                hints:
                  - "Wem gehört der Spielplatz?"
                  - "Der Spielplatz ist für alle Kinder in Lindenau da."
                  - "Nein, die Gemeinde repariert die Schaukel."
              - id: l1-f5
                type: matching
                text: "Wer macht was? Verbinde."
                pairs:
                  - { left: { object: fire-engine }, right: { text: "löscht Brände und rettet" } }
                  - { left: { object: police-officer }, right: { text: "hilft, wenn jemand in Gefahr ist oder etwas gestohlen wird" } }
                  - { left: { object: bin-lorry }, right: { text: "leert die Mülltonnen" } }
                  - { left: { object: town-hall }, right: { text: "Dort bekommt man einen Ausweis." } }
                hints:
                  - "Fang mit dem an, was du sicher weißt."
                  - "Der Ausweis hat mit der Arbeit der Gemeinde im Rathaus zu tun."
                  - "Feuerwehr: Brände. Polizei: Gefahr und Diebstahl. Müllabfuhr: Tonnen. Rathaus: Ausweis."
              - id: l1-f6
                type: image_multiple_choice
                text: "In der Küche von Familie Kaya brennt es. Was kommt zum Löschen?"
                options: [{ object: fire-engine }, { object: bus }, { object: ice-cream }]
                answer: fire-engine
                feedback:
                  ice-cream: "Ein Eis ist zwar kalt, aber damit löscht niemand einen Brand! Die Feuerwehr kommt mit ihrem Feuerwehrauto."
                  bus: "Der Bus bringt Menschen zur Schule und zur Arbeit. Zum Löschen kommt das Feuerwehrauto."
                hints:
                  - "Wer löscht Brände?"
                  - "Die Feuerwehr fährt mit einem roten Auto mit Blaulicht."
                  - "Das Feuerwehrauto."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Nummer rufst du, wenn es brennt?"
                options: ["112", "110", "117"]
                answer: "112"
                hints: ["Bei Feuer kommt die Feuerwehr. Ihre Nummer beginnt mit 11 und endet mit 2."]
              - id: l1-s2
                type: true_false
                text: "Familie Kaya zieht nach Lindenau. Sie meldet sich im Rathaus an. Stimmt das?"
                answer: true
                hints: ["Im Rathaus arbeitet die Gemeinde. Wer neu in die Gemeinde zieht, meldet sich dort."]
              - id: l1-s3
                type: sorting
                text: "Wen ruft man hier? Sortiere."
                bins:
                  - { id: feuer, show: { text: "Feuerwehr" }, say: "Feuerwehr" }
                  - { id: polizei, show: { text: "Polizei" }, say: "Polizei" }
                options:
                  - { text: "Nach dem Regen steht ein Keller unter Wasser.", bin: feuer }
                  - { text: "Im Mülleimer am Park brennt es.", bin: feuer }
                  - { text: "Ein Fahrrad wurde gestohlen.", bin: polizei }
                  - { text: "Bei den Nachbarn wurde eingebrochen.", bin: polizei }
                hints: ["Die Feuerwehr löscht und pumpt Wasser ab. Die Polizei kommt bei Diebstahl und Einbruch."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Für dieses Gebäude sorgt die Gemeinde. Hier lernen die Kinder von Lindenau. Welches ist es?"
                options: [{ object: school }, { object: shop }, { object: hospital }]
                answer: school
                hints: ["Mia geht jeden Morgen dorthin."]
              - id: l1-s5
                type: multiple_choice
                text: "Was würde passieren, wenn niemand mehr die Mülltonnen leert?"
                options: ["Der Müll würde sich in den Straßen stapeln und stinken.", "Nichts, der Müll verschwindet von selbst.", "Die Tonnen würden sich selbst leeren."]
                answer: "Der Müll würde sich in den Straßen stapeln und stinken."
                feedback:
                  "Nichts, der Müll verschwindet von selbst.": "Schön wär's! Müll verschwindet nicht von allein. Darum gibt es die Müllabfuhr."
                hints: ["Denk an eine volle Mülltonne nach drei Wochen."]

          - support: none
            tasks:
              - id: l1-n1
                type: matching
                text: "Wozu ist das da? Verbinde."
                pairs:
                  - { left: { object: library }, right: { text: "Bücher ausleihen" } }
                  - { left: { object: swimming-pool }, right: { text: "schwimmen lernen" } }
                  - { left: { object: playground }, right: { text: "schaukeln und klettern" } }
                  - { left: { object: sign-cycle-path }, right: { text: "sicher Fahrrad fahren" } }
              - id: l1-n2
                type: multiple_choice
                text: "An der Bushaltestelle vor der Schule fehlt eine Bank. Wem schreibt die 4b?"
                options: ["der Gemeinde im Rathaus", "dem Supermarkt", "der Bäckerei"]
                answer: "der Gemeinde im Rathaus"
              - id: l1-n3
                type: true_false
                text: "Eine Gemeinde kann ein kleines Dorf oder eine große Stadt sein. Stimmt das?"
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Jemand hat Mias Fahrrad gestohlen. Wer hilft?"
                options: [{ object: police-officer }, { object: cook }, { object: farmer }]
                answer: police-officer
              - id: l1-n5
                type: sorting
                text: "Wer kümmert sich darum? Sortiere."
                say: "Wer kümmert sich darum: die Gemeinde oder eine Familie? Sortiere."
                bins:
                  - { id: gemeinde, show: { text: "die Gemeinde" }, say: "die Gemeinde" }
                  - { id: familie, show: { text: "eine Familie" }, say: "eine Familie" }
                options:
                  - { text: "Der Spielplatz bekommt eine neue Rutsche.", bin: gemeinde }
                  - { text: "Eine kaputte Straßenlampe wird repariert.", bin: gemeinde }
                  - { text: "Ben bekommt ein neues Fahrrad.", bin: familie }
                  - { text: "Das Wohnzimmer wird gestrichen.", bin: familie }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist keine Aufgabe der Gemeinde?"
            options: ["Mias Hausaufgaben machen", "Straßen reparieren", "die Bücherei öffnen"]
            answer: "Mias Hausaufgaben machen"
          - id: l1-c2
            type: true_false
            text: "Die Gemeinde sorgt für Spielplätze. Stimmt das?"
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Was braucht die Feuerwehr, um schnell zum Brand zu kommen?"
            options: [{ object: fire-engine }, { object: bike }, { object: boat }]
            answer: fire-engine
          - id: l1-c4
            type: true_false
            text: "Einen neuen Ausweis bekommt man in der Bücherei. Stimmt das?"
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Welche Nummer rufst du, wenn jemand bei euch einbricht?"
            options: ["110", "112", "116 111"]
            answer: "110"
          - id: l1-c6
            type: multiple_choice
            text: "Wer leert die Mülltonnen in Mias Straße?"
            options: ["die Müllabfuhr", "die Polizei", "die Lehrerin"]
            answer: "die Müllabfuhr"

  - n: 2
    title: { de: "Wer entscheidet in Lindenau?", en: "Who decides in Lindenau?" }
    goal:
      de: "Finde heraus, wer in der Gemeinde entscheidet, woher das Geld kommt und wie du mitreden kannst."
      en: "Find out who decides in the local council, where the money comes from and how you can have a say."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Die Schaukel auf dem Spielplatz ist kaputt. Wer kümmert sich darum?"
            options: ["die Gemeinde", "Mias Familie", "die Polizei"]
            answer: "die Gemeinde"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Die Gemeinde sorgt für die Feuerwehr. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Die 4b wünscht sich eine Kletterwand auf dem Spielplatz.\n\nWer entscheidet, ob sie gebaut wird?"
            say: "Die 4b wünscht sich auf dem Spielplatz eine Kletterwand. Wer entscheidet in Lindenau, ob sie gebaut wird? Was glaubst du: Die Kinder selbst, die Bürgermeisterin ganz allein, oder viele Menschen zusammen?"
            show: { object: park }
          - text: "Die Menschen in der Gemeinde wählen den Gemeinderat. In einer Stadt heißt er Stadtrat."
            say: "In Deutschland wählen die Menschen den Bundestag. Jede Gemeinde hat außerdem ihren eigenen Rat. Die Menschen, die dort wohnen und wählen dürfen, wählen den Gemeinderat. In einer Stadt heißt er Stadtrat. Der Rat trifft sich im Rathaus, berät und stimmt ab. Die Mehrheit entscheidet, genau wie in deiner Klasse."
          - text: "Die Bürgermeisterin oder der Bürgermeister leitet das Rathaus und arbeitet mit dem Rat zusammen."
            say: "Die Bürgermeisterin oder der Bürgermeister leitet die Arbeit im Rathaus. In den meisten Bundesländern wählen die Menschen sie oder ihn auch selbst. Allein bestimmen darf die Bürgermeisterin aber nicht alles. Über große Pläne entscheidet der Rat."
          - text: "Das Geld der Gemeinde kommt aus Steuern und Gebühren. Es reicht nie für alle Wünsche."
            say: "Eine Kletterwand kostet Geld. Woher hat die Gemeinde Geld? Menschen und Firmen zahlen Steuern. Ein Teil davon geht an die Gemeinde. Dazu kommen Gebühren, zum Beispiel für die Müllabfuhr. Das Geld reicht aber nie für alles. Der Rat muss also wählen: Was ist zuerst dran, die Kletterwand oder die kaputte Straße?"
            show: { object: purse }
          - text: "Kinder können mitreden: einen Brief an die Bürgermeisterin schreiben oder im Kinderparlament mitmachen, wo es eines gibt."
            say: "Auch Kinder können in der Gemeinde mitreden. Sie können der Bürgermeisterin einen Brief schreiben, so wie die 4b. In manchen Gemeinden gibt es ein Kinderparlament oder einen Jugendrat. Dort sagen Kinder und Jugendliche, was ihnen wichtig ist, und der Rat hört ihnen zu."
            show: { object: letter }
          - text: "Wusstest du? In vielen Bundesländern darf man den Gemeinderat schon ab 16 Jahren wählen."
            say: "Wusstest du? Für den Bundestag darf man erst ab achtzehn wählen. Aber in vielen Bundesländern dürfen Jugendliche den Gemeinderat schon ab sechzehn Jahren wählen. Bei Dingen, die sie direkt vor der Haustür betreffen, reden sie so früher mit."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Wie kommt die Kletterwand auf den Spielplatz? Bring es in die richtige Reihenfolge."
                options: ["Die Kletterwand wird gebaut.", "Die 4b schreibt einen Brief an die Bürgermeisterin.", "Die Mehrheit stimmt dafür.", "Der Gemeinderat berät über den Brief."]
                slot_count: 4
                answer: ["Die 4b schreibt einen Brief an die Bürgermeisterin.", "Der Gemeinderat berät über den Brief.", "Die Mehrheit stimmt dafür.", "Die Kletterwand wird gebaut."]
                option_audio: false
                hints:
                  - "Am Anfang steht der Wunsch der Kinder."
                  - "Erst beraten, dann abstimmen. Gebaut wird zuletzt."
                  - "Brief, beraten, abstimmen, bauen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wer wählt den Gemeinderat?"
                options: ["die Menschen, die in der Gemeinde wohnen und wählen dürfen", "die Bürgermeisterin ganz allein", "die Lehrerinnen und Lehrer der Schule"]
                answer: "die Menschen, die in der Gemeinde wohnen und wählen dürfen"
                hints:
                  - "Der Gemeinderat ist für alle in der Gemeinde da."
                  - "Beim Bundestag wählen die Menschen in ganz Deutschland. Beim Gemeinderat ist es ähnlich, nur kleiner."
                  - "Die Menschen in der Gemeinde, die wählen dürfen."
              - id: l2-f3
                type: true_false
                text: "Die Gemeinde hat unendlich viel Geld. Sie kann jeden Wunsch erfüllen.\n\nStimmt das?"
                answer: false
                hints:
                  - "Woher kommt das Geld der Gemeinde?"
                  - "Das Geld kommt aus Steuern und Gebühren, und es ist nicht unendlich viel."
                  - "Nein, der Rat muss auswählen, was zuerst dran ist."
              - id: l2-f4
                type: matching
                text: "Was bedeutet das Wort? Verbinde."
                pairs:
                  - { left: { text: "Steuern" }, right: { text: "Geld, das Menschen und Firmen an den Staat zahlen" } }
                  - { left: { text: "Gebühr" }, right: { text: "Geld für einen bestimmten Dienst, zum Beispiel die Müllabfuhr" } }
                  - { left: { text: "Gemeinderat" }, right: { text: "gewählte Menschen, die für die Gemeinde entscheiden" } }
                  - { left: { text: "Rathaus" }, right: { text: "das Haus, in dem die Gemeinde arbeitet" } }
                hints:
                  - "Zwei Wörter haben mit Geld zu tun."
                  - "Eine Gebühr zahlt man für etwas Bestimmtes. Steuern zahlen alle für vieles zusammen."
                  - "Steuern: an den Staat. Gebühr: für die Müllabfuhr. Gemeinderat: entscheidet. Rathaus: das Haus."
              - id: l2-f5
                type: multiple_choice
                text: "Warum baut die Gemeinde Radwege?"
                options: ["Damit alle sicher mit dem Fahrrad fahren können.", "Damit die Autos dort parken können.", "Damit die Bürgermeisterin dort spazieren geht."]
                answer: "Damit alle sicher mit dem Fahrrad fahren können."
                hints:
                  - "Die Gemeinde sorgt für Dinge, die alle brauchen."
                  - "Wer fährt auf einem Radweg?"
                  - "Damit alle sicher Rad fahren können."
              - id: l2-f6
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "In einer Stadt heißt der Gemeinderat _. Er trifft sich im _."
                options: ["Stadtrat", "Rathaus", "Bundestag", "Klassenrat"]
                answer: ["Stadtrat", "Rathaus"]
                hints:
                  - "Der Rat einer Stadt trägt das Wort Stadt im Namen."
                  - "Der Rat trifft sich in dem Haus, in dem die Gemeinde arbeitet."
                  - "Stadtrat, Rathaus."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Hilft das, damit die Gemeinde die Kinder hört? Sortiere."
