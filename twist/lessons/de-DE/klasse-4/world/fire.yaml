# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.fire
skill: world.nature.fire
curriculum: de-DE
language: de
title:
  de: Feuer brennen und löschen
  en: How fire burns and how to put it out
summary: >
  The Klasse 4a visits the fire station, where firefighter Jana shows what
  a fire needs. Lesson 1 opens with a glass over a burning candle: the
  flame soon goes out because fresh air is missing. A fire needs three
  things, fuel, air (the oxygen in it) and heat; burning changes the
  material for good (wood becomes ash and smoke). Putting out a fire means
  taking one of the three away: water cools (heat), a lid, a fire blanket
  or sand keeps the air out, and turning off the gas or clearing away wood
  removes the fuel. Burning fat is never put out with water. Lesson 2 is
  what a child does when something burns, as German schools and fire
  brigades teach it: get out of the room, close the door behind you, warn
  the others, call 112 from outside; never hide, never take the lift; stay
  low in smoke; if the way out is full of smoke, stay in a room with the
  door shut and call for help at the window. The emergency call: who is
  calling, where, what is burning, then wait for questions. Matches,
  lighters and candles are not toys. It ends with the skill check. The
  candle test stays in class with the teacher; Twist teaches the idea and
  the prediction.
metadata:
  year: klasse-4
  topic: { de: Feuer und Strom, en: Fire and electricity }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.nature.air]
  also_practises: [world.nature.air]
  vocabulary: { de: [Feuer, brennen, Brennstoff, Luft, Sauerstoff, Hitze, Flamme, Asche, Rauch, löschen, Löschdecke, Deckel, Fettbrand, Stichflamme, Rauchmelder, Notruf, Leitstelle, Feuerwehr] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: needs, what: { de: "nennen, was ein Feuer braucht (Brennstoff, Luft, Hitze), und vorhersagen, wann es ausgeht", en: "naming what a fire needs (fuel, air, heat) and predicting when it goes out" } }
    - { id: extinguish, what: { de: "erklären, welches der drei Dinge eine Löschmethode dem Feuer wegnimmt", en: "explaining which of the three things a way of putting out a fire takes away" } }
    - { id: emergency, what: { de: "wissen, was man tut, wenn es brennt, und den Notruf 112 absetzen", en: "knowing what to do when something burns and making the 112 call" } }
  misconceptions:
    - id: fire-needs-only-fuel
      what: Thinks a fire needs only something to burn, not air, so a covered fire goes on burning
      addressed: "lesson 1 opens with the glass over the candle; l1-f3, l1-s2, l1-n2 and l2-c2, l2-c5, l2-c7"
    - id: water-for-every-fire
      what: Thinks water puts out every fire, burning fat too
      addressed: "the lesson 1 screen on burning fat; l1-f6 with feedback, l1-n4, l2-w2 and l2-c9"
    - id: hide-from-fire
      what: Hides from a fire under the bed or in a cupboard instead of getting out
      addressed: "the lesson 2 screen on what to do; l2-f2, l2-s1, l2-n4 and l2-c16"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Was ein Feuer braucht", en: "What a fire needs" }
    goal:
      de: "Finde heraus, welche drei Dinge ein Feuer braucht. Dann weißt du auch, warum Wasser oder ein Deckel ein Feuer löschen."
      en: "Find out which three things a fire needs. Then you also know why water or a lid puts a fire out."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Dieses Glas sieht leer aus. Was ist darin?"
            show: { object: glass }
            options: ["Luft", "gar nichts", "Sand"]
            answer: "Luft"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Luft kann man nicht sehen, aber sie braucht Platz. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Jana stülpt ein Glas über eine brennende Kerze.\n\nWas glaubst du: Brennt die Kerze weiter?"
            say: "Die Klasse 4a besucht die Feuerwache. Feuerwehrfrau Jana zündet eine Kerze an und stülpt ein Glas darüber. Was glaubst du: Brennt die Kerze weiter, oder geht sie aus?"
            show: { object: candle }
          - text: "Nach kurzer Zeit geht die Flamme aus. Unter dem Glas fehlt bald frische Luft."
            say: "Schau genau hin! Erst brennt die Kerze weiter, dann wird die Flamme klein, und nach kurzer Zeit geht sie aus. Unter dem Glas fehlt bald frische Luft. In der Luft steckt Sauerstoff, und den braucht das Feuer."
            show: { object: candle }
          - text: "Ein Feuer braucht drei Dinge:\n1. einen Brennstoff\n2. Luft\n3. Hitze"
            say: "Jana erklärt: Ein Feuer braucht drei Dinge. Erstens einen Brennstoff, also etwas, das brennen kann, zum Beispiel Holz, Papier, Wachs oder Gas. Zweitens Luft mit Sauerstoff. Drittens Hitze: Erst wenn es heiß genug ist, fängt etwas an zu brennen, zum Beispiel durch die Flamme eines Streichholzes. Fehlt eins davon, geht das Feuer aus."
            show: { object: firefighter }
          - text: "Beim Brennen verändert sich der Stoff. Aus Holz werden Asche und Rauch."
            say: "Beim Brennen verändert sich der Brennstoff für immer. Aus Holz werden Asche und Rauch, dazu kommen Licht und Wärme. Aus der Asche kann niemand wieder Holz machen. Stein, Glas, Sand und Wasser brennen nicht."
            show: { object: campfire }
          - text: "Löschen heißt: Du nimmst dem Feuer eins der drei Dinge weg."
            say: "Löschen heißt: Man nimmt dem Feuer eins der drei Dinge weg. Wasser kühlt das Feuer ab, so fehlt die Hitze. Ein Deckel, eine Löschdecke oder Sand halten die Luft fern. Wer den Gashahn zudreht oder das Holz wegräumt, nimmt dem Feuer den Brennstoff."
            show: { object: water }
          - text: "Brennendes Fett nie mit Wasser löschen! Deckel drauf."
            say: "Aber Vorsicht! Brennt Fett oder Öl in einer Pfanne, darf niemals Wasser darauf. Das Wasser verdampft sofort, und eine riesige Stichflamme schießt hoch. Ein Erwachsener legt einen Deckel darauf und schaltet den Herd aus. Löschen ist Sache der Erwachsenen und der Feuerwehr. Du bringst dich in Sicherheit."
            show: { object: oven }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Jana fragt die Klasse: Was braucht ein Feuer zum Brennen?"
                options: ["Brennstoff, Luft und Hitze", "Wasser, Luft und Hitze", "Brennstoff, Wasser und Kälte"]
                answer: "Brennstoff, Luft und Hitze"
                hints:
                  - "Es sind drei Dinge. Wasser gehört nicht dazu, Wasser löscht."
                  - "Etwas muss brennen können, und unter dem Glas ging die Kerze ohne frische Luft aus."
                  - "Brennstoff, Luft und Hitze."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Brennt es, oder brennt es nicht? Sortiere."
                bins:
                  - { id: burns, show: { text: "brennt" }, say: "brennt" }
                  - { id: not, show: { text: "brennt nicht" }, say: "brennt nicht" }
                options:
                  - { object: book, bin: burns }
                  - { object: candle, bin: burns }
                  - { object: rope, bin: burns }
                  - { object: stone, bin: not }
                  - { object: spoon, bin: not }
                  - { object: glass, bin: not }
                hints:
                  - "Frag bei jedem Ding: Woraus ist es?"
                  - "Papier, Wachs und ein Seil aus Fasern können brennen. Stein, Metall und Glas brennen im Feuer nicht."
                  - "Brennt: Buch, Kerze, Seil. Brennt nicht: Stein, Löffel, Glas."
              - id: l1-f3
                type: multiple_choice
                text: "Zwei gleiche Kerzen brennen. Über die eine stülpt Jana ein kleines Glas, über die andere ein großes. Welche Kerze brennt länger?"
                options: ["die unter dem großen Glas", "die unter dem kleinen Glas", "beide gleich lang"]
                answer: "die unter dem großen Glas"
                hints:
                  - "Die Kerze braucht die Luft unter dem Glas."
                  - "Unter welchem Glas ist mehr Luft?"
                  - "Unter dem großen Glas ist mehr Luft. Die Kerze dort brennt länger."
              - id: l1-f4
                type: true_false
                text: "Das Lagerfeuer ist aus. Aus der Asche kann man das Holz wieder zurückmachen. Stimmt das?"
                show: { object: campfire }
                answer: false
                hints:
                  - "Beim Brennen verändert sich der Stoff."
                  - "Aus Holz werden Asche und Rauch. Geht das auch rückwärts?"
                  - "Nein, aus Asche wird nie wieder Holz."
              - id: l1-f5
                type: matching
                text: "Was nimmt man dem Feuer weg? Verbinde."
                pairs:
                  - { left: { text: "Wasser auf das Lagerfeuer gießen" }, right: { text: "die Hitze" } }
                  - { left: { text: "einen Deckel auf den Topf legen" }, right: { text: "die Luft" } }
                  - { left: { text: "den Gashahn zudrehen" }, right: { text: "den Brennstoff" } }
                hints:
                  - "Jeder Weg nimmt dem Feuer ein anderes der drei Dinge weg."
                  - "Wasser kühlt. Ein Deckel schließt das Feuer ein. Gas ist etwas, das brennt."
                  - "Wasser: die Hitze. Deckel: die Luft. Gashahn: den Brennstoff."
              - id: l1-f6
                type: multiple_choice
                text: "Bei Familie Öztürk brennt Öl in der Pfanne. Womit löscht Papa das Feuer?"
                show: { object: frying-pan }
                options: ["mit einem Deckel", "mit einem Glas Wasser", "mit kräftigem Pusten"]
                answer: "mit einem Deckel"
                feedback:
                  "mit einem Glas Wasser": "Bloß nicht! Wasser auf brennendem Öl macht eine riesige Stichflamme. Der Deckel nimmt dem Feuer die Luft weg."
                  "mit kräftigem Pusten": "Pusten bringt dem Feuer nur neue Luft. Der Deckel nimmt ihm die Luft weg."
                hints:
                  - "Bei brennendem Fett oder Öl gibt es eine wichtige Regel."
                  - "Wasser macht hier eine Stichflamme. Was hält die Luft fern?"
                  - "Mit einem Deckel."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Was nimmt dem Feuer was weg? Sortiere."
                bins:
                  - { id: air, show: { text: "nimmt die Luft weg" }, say: "nimmt die Luft weg" }
                  - { id: heat, show: { text: "nimmt die Hitze weg" }, say: "nimmt die Hitze weg" }
                  - { id: fuel, show: { text: "nimmt den Brennstoff weg" }, say: "nimmt den Brennstoff weg" }
                options:
                  - { text: "eine Löschdecke über den Brand legen", bin: air }
                  - { text: "Sand auf das Lagerfeuer schütten", bin: air }
                  - { text: "das Feuer mit Wasser abkühlen", bin: heat }
                  - { text: "das trockene Holz vom Feuer wegräumen", bin: fuel }
                hints: ["Frag bei jedem: Fehlt dem Feuer danach die Luft, die Hitze oder etwas zum Brennen?"]
              - id: l1-s2
                type: multiple_choice
                text: "Warum geht die Kerze unter dem Glas aus?"
                options: ["Ihr fehlt bald frische Luft.", "Das Glas ist zu kalt.", "Das Wachs ist sofort alle."]
                answer: "Ihr fehlt bald frische Luft."
                hints: ["Ein Feuer braucht Luft mit Sauerstoff. Kommt unter dem Glas neue Luft hinein?"]
              - id: l1-s3
                type: true_false
                text: "Ein Stein brennt gut im Lagerfeuer. Stimmt das?"
                answer: false
                hints: ["Ist ein Stein ein Brennstoff?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                frame: "Wasser kühlt das Feuer ab. Es nimmt ihm die _ weg."
                options: ["Hitze", "Luft", "Asche"]
                answer: ["Hitze"]
                hints: ["Kühlen heißt: Es wird kälter."]
              - id: l1-s5
                type: multiple_choice
                text: "Das Holz im Kamin ist verbrannt. Was ist übrig?"
                options: ["Asche", "neues Holz", "Wasser"]
                answer: "Asche"
                hints: ["Beim Brennen werden aus Holz Asche und Rauch."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Der Ausflug ist vorbei. Wie macht die Gruppe das Lagerfeuer am besten aus?"
                show: { object: campfire }
                options: ["mit viel Wasser, bis nichts mehr glüht", "Sie lassen es einfach weiterbrennen.", "Sie legen trockenes Laub darauf."]
                answer: "mit viel Wasser, bis nichts mehr glüht"
              - id: l1-n2
                type: true_false
                text: "Eine Löschdecke über dem Feuer nimmt ihm die Luft weg. Stimmt das?"
                show: { object: fire-blanket }
                answer: true
              - id: l1-n3
                type: matching
                text: "Was braucht ein Feuer? Verbinde mit einem Beispiel."
                pairs:
                  - { left: { text: "Brennstoff" }, right: { text: "Holz, Papier, Wachs" } }
                  - { left: { text: "Luft" }, right: { text: "der Sauerstoff um uns herum" } }
                  - { left: { text: "Hitze" }, right: { text: "die Flamme eines Streichholzes" } }
              - id: l1-n4
                type: multiple_choice
                text: "In der Pfanne brennt Öl. Warum darf nie Wasser darauf?"
                show: { object: frying-pan }
                options: ["Das Wasser macht eine gefährliche Stichflamme.", "Das Wasser wird zu Eis.", "Das Öl wird zu Wasser."]
                answer: "Das Wasser macht eine gefährliche Stichflamme."
              - id: l1-n5
                type: sorting
                text: "Brennt es, oder brennt es nicht? Sortiere."
                bins:
                  - { id: burns, show: { text: "brennt" }, say: "brennt" }
                  - { id: not, show: { text: "brennt nicht" }, say: "brennt nicht" }
                options:
                  - { object: log, bin: burns }
                  - { object: newspaper, bin: burns }
                  - { text: "trockenes Gras", bin: burns }
                  - { object: stone, bin: not }
                  - { object: bottle, bin: not }
                  - { text: "ein Blumentopf aus Ton", bin: not }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was fehlt dem Feuer, wenn du einen Deckel auf den brennenden Topf legst?"
            options: ["die Luft", "die Hitze", "der Brennstoff"]
            answer: "die Luft"
          - id: l1-c2
            type: true_false
            text: "Ein Feuer braucht Wasser zum Brennen. Stimmt das?"
            answer: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Was ist ein Brennstoff?"
            options: [{ object: book }, { object: stone }, { object: spoon }]
            answer: book
          - id: l1-c4
            type: multiple_choice
            text: "Zwei gleiche Kerzen stehen unter Gläsern. Welche geht zuerst aus?"
            options: ["die unter dem kleinen Glas", "die unter dem großen Glas", "keine von beiden"]
            answer: "die unter dem kleinen Glas"
          - id: l1-c5
            type: true_false
            text: "Nimmst du einem Feuer eins der drei Dinge weg, geht es aus. Stimmt das?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Die Feuerwehr spritzt Wasser auf ein brennendes Haus. Was nimmt das Wasser dem Feuer weg?"
            options: ["die Hitze", "die Luft", "den Brennstoff"]
            answer: "die Hitze"

  - n: 2
    title: { de: "Wenn es brennt", en: "When there is a fire" }
    goal:
      de: "Lerne, was du tust, wenn es brennt: raus aus dem Raum, Tür zu und die Feuerwehr anrufen. Du übst auch, was du am Telefon sagst."
      en: "Learn what to do when there is a fire: get out of the room, close the door and call the fire brigade. You also practise what to say on the phone."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was kann brennen?"
            options: [{ object: rope }, { object: ring }, { object: glass }]
            answer: rope
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Brennendes Fett löscht man mit Wasser. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Mitten in der Nacht piept es laut im Flur.\n\nWas glaubst du: Was piept da?"
            say: "Jana erzählt der Klasse von einem Einsatz. Mitten in der Nacht piept es in einer Wohnung laut und schrill im Flur. Was glaubst du: Was piept da?"
          - text: "Ein Rauchmelder! Er piept, wenn Rauch in der Wohnung ist."
            say: "Es ist ein Rauchmelder. Er hängt an der Decke und piept laut, sobald Rauch in die Wohnung kommt. In der Küche war ein Feuer ausgebrochen. Weil alle rechtzeitig aufgewacht sind, sind alle gesund aus der Wohnung gekommen."
            show: { object: smoke-alarm }
          - text: "Wusstest du? Wer schläft, wacht vom Geruch von Rauch meistens nicht auf."
            say: "Wusstest du? Wer schläft, wacht vom Geruch von Rauch meistens nicht auf. Die Nase allein weckt dich also nicht. Darum gibt es Rauchmelder: Ihr lautes Piepen weckt dich, auch mitten in der Nacht."
            show: { object: bed }
          - text: "Wenn es brennt:\n1. Raus aus dem Raum.\n2. Tür hinter dir zumachen.\n3. Die anderen warnen.\n4. Draußen 112 anrufen."
            say: "Wenn es brennt, gehst du sofort aus dem Raum. Mach die Tür hinter dir zu, dann bleiben Feuer und Rauch erst einmal drin. Warne die anderen und geh mit ihnen nach draußen. Dort rufst du die Feuerwehr an, unter eins, eins, zwei. Versteck dich nie unter dem Bett oder im Schrank, denn dort findet dich die Feuerwehr nur schwer. Nimm keinen Aufzug, und hol keine Spielsachen."
            show: { object: door }
          - text: "Rauch ist gefährlicher als die Flammen. Bleib tief unten."
            say: "Rauch ist giftig und oft gefährlicher als die Flammen. Er steigt nach oben, darum ist die Luft unten am Boden besser. Bei Rauch bleibst du tief unten und krabbelst hinaus. Ist der Flur schon voller Rauch, bleibst du in einem Zimmer, machst die Tür zu, gehst ans Fenster und rufst laut um Hilfe."
            show: { object: window }
          - text: "Notruf 112:\nWer ruft an?\nWo brennt es?\nWas brennt?\nDann warten, bis die Leitstelle fragt."
            say: "Der Notruf eins, eins, zwei kostet nichts, von jedem Telefon und jedem Handy. Auch Kinder dürfen und sollen anrufen, wenn es brennt. Sag, wer du bist, wo es brennt und was brennt. Dann leg nicht auf, sondern warte. Die Leitstelle stellt dir noch Fragen. Die Nummer der Polizei ist eins, eins, null."
            show: { object: mobile-phone }
          - text: "Streichhölzer, Feuerzeuge und Kerzen sind kein Spielzeug."
            say: "Viele Brände beginnen ganz klein, mit einem Streichholz oder einer Kerze. Streichhölzer und Feuerzeuge sind kein Spielzeug. Eine brennende Kerze lässt man nie allein im Zimmer."
            show: { object: candle }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Im Kinderzimmer brennt es. Was machst du? Bring es in die richtige Reihenfolge."
                say: "Im Kinderzimmer brennt es. Was machst du? Bring es in die richtige Reihenfolge."
                options: ["Draußen die 112 anrufen.", "Die anderen in der Wohnung warnen.", "Aus dem Zimmer gehen.", "Die Tür hinter dir zumachen."]
                slot_count: 4
                answer: ["Aus dem Zimmer gehen.", "Die Tür hinter dir zumachen.", "Die anderen in der Wohnung warnen.", "Draußen die 112 anrufen."]
                option_audio: false
                hints:
                  - "Zuerst bringst du dich selbst in Sicherheit."
                  - "Die Tür machst du zu, sobald du aus dem Zimmer bist. Angerufen wird draußen."
                  - "Raus, Tür zu, die anderen warnen, draußen anrufen."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Bei einem Feuer versteckst du dich am besten unter dem Bett. Stimmt das?"
                answer: false
                hints:
                  - "Die Feuerwehr muss dich schnell finden können."
                  - "Unter dem Bett ist der Rauch genauso da, und niemand sieht dich."
                  - "Nein, du gehst hinaus und versteckst dich nie."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Nummer wählst du, wenn es brennt?"
                say: "Welche Nummer wählst du, wenn es brennt?"
                options: ["112", "110", "123"]
                answer: "112"
                feedback:
                  "110": "Die 110 ist die Polizei. Bei Feuer rufst du die 112 an."
                hints:
                  - "Die Feuerwehr hat ihre eigene Notrufnummer."
                  - "Die 110 ist die Polizei."
                  - "Eins, eins, zwei."
              - id: l2-f4
                type: sorting
                text: "Richtig oder falsch, wenn es brennt? Sortiere."
                bins:
                  - { id: right, show: { text: "richtig" }, say: "richtig" }
                  - { id: wrong, show: { text: "falsch" }, say: "falsch" }
                options:
                  - { text: "Die Tür hinter dir zumachen.", bin: right }
                  - { text: "Bei Rauch tief unten hinauskrabbeln.", bin: right }
                  - { text: "Mit dem Aufzug nach unten fahren.", bin: wrong }
                  - { text: "Noch schnell das Spielzeug holen.", bin: wrong }
                hints:
                  - "Bei Feuer zählt nur eins: schnell und sicher hinaus."
                  - "Rauch steigt nach oben. Ein Aufzug kann stecken bleiben."
                  - "Richtig: Tür zu, tief unten krabbeln. Falsch: Aufzug, Spielzeug holen."
              - id: l2-f5
                type: multiple_choice
                text: "Mila ruft die 112 an. Was sagt sie der Leitstelle?"
                options: ["wer sie ist, wo es brennt und was brennt", "nur „Feuer!“, dann legt sie auf", "wie ihr Lieblingsessen heißt"]
                answer: "wer sie ist, wo es brennt und was brennt"
                hints:
                  - "Die Feuerwehr muss wissen, wohin sie fahren soll."
                  - "Denk an die Fragen Wer, Wo und Was."
                  - "Wer sie ist, wo es brennt und was brennt."
              - id: l2-f6
                type: image_multiple_choice
                text: "Mila hat die 112 angerufen. Wer kommt jetzt?"
                options: [{ object: fire-engine }, { object: taxi }, { object: bus }]
                answer: fire-engine
                feedback:
                  taxi: "Ein Taxi mit Löschschlauch? Das gibt es nicht! Es kommt die Feuerwehr mit dem Feuerwehrauto."
                hints:
                  - "Die 112 ist die Nummer der Feuerwehr."
                  - "Welches Auto hat eine Leiter und Schläuche?"
                  - "Das Feuerwehrauto."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Im Treppenhaus ist dichter Rauch. Mila kommt nicht hinaus. Was macht sie?"
                options: ["Tür zu, ans Fenster gehen und laut um Hilfe rufen", "durch den Rauch nach unten rennen", "sich im Schrank verstecken"]
                answer: "Tür zu, ans Fenster gehen und laut um Hilfe rufen"
                hints: ["Rauch ist giftig. Die Feuerwehr muss Mila sehen und hören können."]
              - id: l2-s2
                type: true_false
                text: "Rauch ist giftig. Darum bleibst du bei Rauch tief unten am Boden. Stimmt das?"
                answer: true
