# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.cyberbullying
skill: world.society.cyberbullying
curriculum: de-DE
language: de
title:
  de: Mobbing und Cybermobbing
  en: Bullying and cyberbullying
summary: >
  Lea in the Klasse 4c is laughed at every day and then gets mean messages
  in the class chat. Lesson 1 tells a quarrel (once, both sides, made up
  again) from bullying (again and again, on purpose, over a longer time,
  often by several, and the child can hardly defend itself alone). It
  names forms of bullying (laughing at, insulting, leaving out, spreading
  lies, taking things) and of cyberbullying with a phone, tablet or
  computer (mean messages, sharing an embarrassing photo, throwing someone
  out of the group chat, lies in the chat); cyberbullying goes on at home,
  many see it and it is hard to delete. It is never the bullied child's
  fault. Lesson 2 says what to do, as German schools teach it: do not
  write back, keep the evidence with a screenshot instead of deleting,
  block and report with an adult's help, and get help from parents, the
  teacher, the school social worker or the Nummer gegen Kummer (116 111,
  free, no name needed); getting help is not telling tales. Bystanders do
  not laugh, like or forward, stand by the child and tell an adult. It
  ends with the skill check. No explicit content; every name and message
  is written for Twist.
metadata:
  year: klasse-4
  topic: { de: Sicher mit Medien, en: Safe with media }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.society.friendship-conflict, world.society.media-types]
  also_practises: [world.society.friendship-conflict]
  vocabulary: { de: [Streit, Mobbing, Cybermobbing, absichtlich, auslachen, beleidigen, ausschließen, Gerücht, bloßstellen, Klassengruppe, Screenshot, Beweis, blockieren, melden, Petzen, Schulsozialarbeit, Nummer gegen Kummer, Zuschauer, Erlaubnis] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: recognise, what: { de: "Mobbing und Cybermobbing erkennen und von einem Streit unterscheiden", en: "recognising bullying and cyberbullying and telling them from a quarrel" } }
    - { id: react, what: { de: "wissen, was man tut, wenn man selbst gemobbt wird: nicht zurückschreiben, Beweise sichern, blockieren und melden", en: "knowing what to do when you are bullied: do not write back, keep evidence, block and report" } }
    - { id: helpers, what: { de: "wissen, wer hilft, und wie man als Zuschauer hilft", en: "knowing who helps, and how to help as a bystander" } }
  misconceptions:
    - id: victim-to-blame
      what: Thinks a bullied child brought it on themselves (wears glasses, did something odd)
      addressed: "lesson 1 Learn says it is never the bullied child's fault; l1-f3, l1-n5, l2-w2 and l2-c7"
    - id: telling-is-snitching
      what: Thinks telling an adult about bullying is telling tales, so stays silent
      addressed: "lesson 2 Learn says getting help is not telling tales; l2-f3, l2-n5 and l2-c12, l2-c17"
    - id: quarrel-is-bullying
      what: Calls every quarrel bullying, or thinks bullying happens only once
      addressed: "lesson 1 opens with a quarrel next to bullying; l1-f1, l1-s2, l1-s3, l1-n1 and l2-c1, l2-c2"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Streit oder Mobbing?", en: "Quarrel or bullying?" }
    goal:
      de: "Lerne, wie du Mobbing und Cybermobbing erkennst und was sie von einem Streit unterscheidet."
      en: "Learn how to recognise bullying and cyberbullying and how they differ from a quarrel."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Lina und Ben wollen beide den Ball. Was ist fair?"
            options: ["Beide sagen nacheinander, was sie fühlen, und suchen eine Lösung.", "Ben schubst Lina weg.", "Lina beschimpft Ben."]
            answer: "Beide sagen nacheinander, was sie fühlen, und suchen eine Lösung."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ein Handy ist ein Medium. Damit kann man Nachrichten an andere schicken. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Max und Tom streiten in der Pause über den Ball.\nLea wird seit Wochen jeden Tag ausgelacht, und niemand will neben ihr sitzen.\n\nIst beides Mobbing?"
            say: "In der Klasse 4c streiten Max und Tom in der Pause über den Ball. Und Lea wird seit Wochen jeden Tag ausgelacht. Niemand will neben ihr sitzen. Was glaubst du: Ist beides Mobbing?"
          - text: "Streit: Es passiert einmal, beide wehren sich, danach verträgt man sich.\nMobbing: Es passiert immer wieder, mit Absicht, über längere Zeit."
            say: "Nein. Max und Tom haben einen Streit. Beide sagen ihre Meinung, und am nächsten Tag spielen sie wieder zusammen. Bei Lea ist es anders. Sie wird immer wieder geärgert, mit Absicht und über lange Zeit, oft von mehreren Kindern. Allein kann sie sich kaum wehren. Das ist Mobbing."
          - text: "Mobbing kann so aussehen: auslachen, beleidigen, ausschließen, Gerüchte verbreiten, Sachen wegnehmen."
            say: "Mobbing hat viele Formen. Kinder lachen jemanden aus oder beleidigen ihn. Sie schließen ihn aus und lassen ihn nicht mitspielen. Sie verbreiten Gerüchte, also Lügen über ihn. Oder sie nehmen ihm Sachen weg und verstecken sie."
          - text: "Cybermobbing ist Mobbing mit Handy, Tablet oder Computer: gemeine Nachrichten, peinliche Fotos teilen, jemanden aus der Klassengruppe werfen, Lügen im Chat."
            say: "Seit ein paar Tagen bekommt Lea auch gemeine Nachrichten in der Klassengruppe. Mobbing mit Handy, Tablet oder Computer heißt Cybermobbing. Dazu gehört: gemeine Nachrichten schreiben, Lügen im Chat verbreiten, jemanden immer wieder aus der Klassengruppe werfen, oder ein peinliches Foto ohne Erlaubnis herumschicken, um jemanden bloßzustellen."
            show: { object: mobile-phone }
          - text: "Cybermobbing hört nicht an der Schultür auf. Viele können es sehen, und es ist schwer zu löschen."
            say: "Cybermobbing ist besonders gemein. Es hört nicht an der Schultür auf. Die Nachrichten kommen auch abends und am Wochenende, mitten ins Kinderzimmer. Viele können sie sehen, und was einmal im Netz ist, lässt sich schwer wieder löschen."
          - text: "Mobbing tut weh. Und es ist nie die Schuld des Kindes, das gemobbt wird."
            say: "Mobbing tut weh. Lea ist traurig, hat morgens Bauchweh und will nicht mehr zur Schule. Ganz wichtig: Lea ist nicht schuld. Kein Kind ist schuld daran, dass es gemobbt wird. Schuld haben die, die mobben."
            show: { object: sad }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Streit oder Mobbing? Sortiere."
                bins:
                  - { id: streit, show: { text: "Streit" }, say: "Streit" }
                  - { id: mobbing, show: { text: "Mobbing" }, say: "Mobbing" }
                options:
                  - { text: "Mia und Tim streiten einmal über die Schaukel und vertragen sich wieder.", bin: streit }
                  - { text: "Zwei Freundinnen sind sich über die Spielregeln uneinig.", bin: streit }
                  - { text: "Seit Wochen lachen drei Kinder Lea jeden Tag aus.", bin: mobbing }
                  - { text: "Jeden Morgen versteckt jemand Bens Mäppchen, und alle lachen.", bin: mobbing }
                hints:
                  - "Frag dich: Passiert es einmal, oder immer wieder?"
                  - "Beim Mobbing wird ein Kind immer wieder und mit Absicht geärgert."
                  - "Schaukel und Spielregeln: Streit. Lea und Bens Mäppchen: Mobbing."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was ist Cybermobbing?"
                options: ["wenn jemand mit Handy oder Computer immer wieder absichtlich beleidigt oder bloßgestellt wird", "wenn ein Handy kaputtgeht", "wenn man zu lange am Computer spielt"]
                answer: "wenn jemand mit Handy oder Computer immer wieder absichtlich beleidigt oder bloßgestellt wird"
                hints:
                  - "Cybermobbing ist eine Form von Mobbing."
                  - "Es passiert mit Handy, Tablet oder Computer, immer wieder und mit Absicht."
                  - "Wenn jemand damit immer wieder beleidigt oder bloßgestellt wird."
              - id: l1-f3
                type: true_false
                text: "Die anderen sagen, Lea ist komisch. Ist Lea selbst schuld, dass sie gemobbt wird?"
                answer: false
                hints:
                  - "Wer tut hier jemandem weh?"
                  - "Kein Kind ist schuld daran, dass es gemobbt wird."
                  - "Nein, schuld haben die, die mobben."
              - id: l1-f4
                type: image_multiple_choice
                text: "Womit passiert Cybermobbing?"
                options: [{ object: mobile-phone }, { object: ball }, { object: bike }]
                answer: mobile-phone
                hints:
                  - "Cyber hat mit Handy, Tablet, Computer und Internet zu tun."
                  - "Womit kann man Nachrichten an viele schicken?"
                  - "Mit dem Handy."
              - id: l1-f5
                type: matching
                text: "Welche Form von Mobbing ist das? Verbinde."
                pairs:
                  - { left: { text: "Lea wird immer wieder aus der Klassengruppe geworfen." }, right: { text: "ausschließen" } }
                  - { left: { text: "Jemand schreibt Lügen über Ben in den Chat." }, right: { text: "Gerüchte verbreiten" } }
                  - { left: { text: "Ein peinliches Foto von Max wird ohne Erlaubnis herumgeschickt." }, right: { text: "bloßstellen" } }
                  - { left: { text: "Kim bekommt jeden Tag Schimpfwörter geschickt." }, right: { text: "beleidigen" } }
                hints:
                  - "Fang mit dem an, was du sicher weißt."
                  - "Ein Gerücht ist eine Lüge, die herumerzählt wird. Ausschließen heißt: nicht mitmachen lassen."
                  - "Gruppe: ausschließen. Lügen: Gerüchte. Foto: bloßstellen. Schimpfwörter: beleidigen."
              - id: l1-f6
                type: multiple_choice
                text: "Warum ist Cybermobbing besonders schlimm?"
                options: ["Es geht auch zu Hause weiter, und viele können es sehen.", "Weil Handys so laut klingeln.", "Weil es nur ein einziges Mal passiert."]
                answer: "Es geht auch zu Hause weiter, und viele können es sehen."
                hints:
                  - "Wann kommen die Nachrichten bei Lea an?"
                  - "Die Nachrichten kommen auch abends, und die ganze Klassengruppe liest mit."
                  - "Es geht zu Hause weiter, und viele sehen es."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Cybermobbing oder nicht? Sortiere."
                bins:
                  - { id: cyber, show: { text: "Cybermobbing" }, say: "Cybermobbing" }
                  - { id: kein, show: { text: "kein Cybermobbing" }, say: "kein Cybermobbing" }
                options:
                  - { text: "Kinder schreiben jeden Abend gemeine Sachen über Jonas in den Chat.", bin: cyber }
                  - { text: "Jemand stellt immer wieder heimlich gemachte Fotos von Aylin ins Netz und lacht darüber.", bin: cyber }
                  - { text: "Lea schickt ihrer Oma ein Foto von ihrem Kuchen.", bin: kein }
                  - { text: "Die Klasse schreibt Ben Glückwünsche zum Geburtstag.", bin: kein }
                hints: ["Cybermobbing tut jemandem weh, immer wieder und mit Absicht."]
              - id: l1-s2
                type: true_false
                text: "Mobbing passiert meistens nur ein einziges Mal. Stimmt das?"
                answer: false
                hints: ["Mobbing passiert immer wieder, über längere Zeit."]
              - id: l1-s3
                type: multiple_choice
                text: "Tom und Max streiten über den Ball. Am nächsten Tag spielen sie wieder zusammen. Was war das?"
                options: ["ein Streit", "Mobbing", "Cybermobbing"]
                answer: "ein Streit"
                hints: ["Es ist einmal passiert, und danach haben sie sich vertragen."]
              - id: l1-s4
                type: true_false
                text: "Was einmal im Internet ist, lässt sich oft nur schwer wieder löschen. Stimmt das?"
                answer: true
                hints: ["Andere können ein Foto speichern und weiterschicken."]
              - id: l1-s5
                type: multiple_choice
                text: "Was kann Mobbing bei einem Kind auslösen?"
                options: ["Es ist traurig, hat Angst oder will nicht mehr zur Schule.", "Es freut sich jeden Tag mehr.", "Es merkt gar nichts davon."]
                answer: "Es ist traurig, hat Angst oder will nicht mehr zur Schule."
                hints: ["Denk daran, wie es Lea geht."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Streit oder Mobbing? Sortiere."
                bins:
                  - { id: streit, show: { text: "Streit" }, say: "Streit" }
                  - { id: mobbing, show: { text: "Mobbing" }, say: "Mobbing" }
                options:
                  - { text: "Jonas und Emre sind einmal wütend aufeinander und entschuldigen sich später.", bin: streit }
                  - { text: "Zwei Kinder streiten, wer zuerst an die Tafel darf.", bin: streit }
                  - { text: "Seit Monaten darf Kim in der Pause nie mitspielen.", bin: mobbing }
                  - { text: "Eine Gruppe nennt Paul jeden Tag mit einem gemeinen Spitznamen.", bin: mobbing }
              - id: l1-n2
                type: multiple_choice
                text: "Was ist kein Mobbing?"
                options: ["Zwei Kinder streiten einmal und entschuldigen sich.", "Ein Kind wird jeden Tag ausgelacht.", "Ein Kind wird immer wieder vom Spiel ausgeschlossen."]
                answer: "Zwei Kinder streiten einmal und entschuldigen sich."
              - id: l1-n3
                type: true_false
                text: "Ein peinliches Foto von einem Kind ohne seine Erlaubnis in die Klassengruppe zu stellen, kann Cybermobbing sein. Stimmt das?"
                answer: true
              - id: l1-n4
                type: matching
                text: "Welche Form von Mobbing ist das? Verbinde."
                pairs:
                  - { left: { text: "Alle drehen sich weg, wenn Emre kommt." }, right: { text: "ausschließen" } }
                  - { left: { text: "Jemand erzählt herum, Aylin hätte geklaut. Das stimmt nicht." }, right: { text: "Gerüchte verbreiten" } }
                  - { left: { text: "Pauls Jacke wird jeden Tag versteckt." }, right: { text: "Sachen wegnehmen" } }
              - id: l1-n5
                type: multiple_choice
                text: "Wer ist schuld, wenn ein Kind gemobbt wird?"
                options: ["die Kinder, die mobben", "das Kind, das gemobbt wird", "niemand, das ist doch nur Spaß"]
                answer: "die Kinder, die mobben"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist Mobbing?"
            options: ["Ein Kind wird immer wieder und mit Absicht geärgert.", "Zwei Kinder streiten einmal.", "Ein Kind gewinnt ein Spiel."]
            answer: "Ein Kind wird immer wieder und mit Absicht geärgert."
          - id: l1-c2
            type: true_false
            text: "Ein einmaliger Streit ist schon Mobbing. Stimmt das?"
            answer: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Was kann man für Cybermobbing missbrauchen?"
            options: [{ object: mobile-phone }, { object: apple }, { object: shoe }]
            answer: mobile-phone
          - id: l1-c4
            type: true_false
            text: "Cybermobbing kann auch abends zu Hause weitergehen. Stimmt das?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Lea wird immer wieder aus der Klassengruppe geworfen. Was ist das?"
            options: ["Cybermobbing", "ein Spiel", "Werbung"]
            answer: "Cybermobbing"
          - id: l1-c6
            type: sorting
            text: "Streit oder Mobbing? Sortiere."
            bins:
              - { id: streit, show: { text: "Streit" }, say: "Streit" }
              - { id: mobbing, show: { text: "Mobbing" }, say: "Mobbing" }
            options:
              - { text: "Ein kurzer Streit um einen Stift.", bin: streit }
              - { text: "Wochenlang wird ein Kind auf dem Schulweg geschubst.", bin: mobbing }
              - { text: "Zwei Brüder sind sich uneinig, wer das letzte Stück Kuchen bekommt.", bin: streit }
              - { text: "Jeden Tag schreiben Kinder einem Mädchen gemeine Sachen auf den Tisch.", bin: mobbing }

  - n: 2
    title: { de: "Was tun? Hilfe holen!", en: "What to do? Get help!" }
    goal:
      de: "Lerne, was du tust, wenn du oder ein anderes Kind gemobbt wird, und wer dir hilft."
      en: "Learn what to do when you or another child is bullied, and who helps you."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was unterscheidet Mobbing von einem Streit?"
            options: ["Mobbing passiert immer wieder und mit Absicht.", "Beim Mobbing sind beide gleich stark.", "Mobbing dauert nur eine Minute."]
            answer: "Mobbing passiert immer wieder und mit Absicht."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Wer gemobbt wird, ist selbst schuld. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Lea bekommt wieder eine gemeine Nachricht.\n\nSoll sie zurückschreiben, alles löschen oder es jemandem zeigen?"
            say: "Am Abend bekommt Lea wieder eine gemeine Nachricht in der Klassengruppe. Sie überlegt: Soll sie genauso gemein zurückschreiben? Soll sie alles löschen? Oder soll sie es jemandem zeigen? Was würdest du tun?"
            show: { object: mobile-phone }
          - text: "1. Nicht zurückschreiben."
            say: "Erstens: Nicht zurückschreiben. Eine gemeine Antwort macht es meistens noch schlimmer. Die anderen warten oft nur darauf."
          - text: "2. Beweise sichern: einen Screenshot machen. Nicht löschen!"
            say: "Zweitens: Beweise sichern. Mach einen Screenshot, also ein Bild von deinem Bildschirm. Lass dir dabei von einem Erwachsenen helfen. Lösch die Nachrichten nicht. Sie zeigen später, was passiert ist."
          - text: "3. Blockieren und melden."
            say: "Drittens: Blockieren und melden. Wenn du jemanden blockierst, kann er dir nicht mehr schreiben. In vielen Apps kann man gemeine Nachrichten auch melden. Das macht ihr am besten zusammen mit einem Erwachsenen."
          - text: "4. Hilfe holen: Eltern, Lehrerin oder Lehrer, Schulsozialarbeit.\nNummer gegen Kummer: 116 111, kostenlos, du musst deinen Namen nicht sagen."
            say: "Viertens, und am wichtigsten: Hilfe holen. Erzähl es deinen Eltern, deiner Lehrerin oder deinem Lehrer, oder der Schulsozialarbeit. Du kannst auch die Nummer gegen Kummer anrufen: eins, eins, sechs, eins, eins, eins. Der Anruf kostet nichts, und du musst deinen Namen nicht sagen. Hilfe holen ist kein Petzen. Du schützt dich und andere."
          - text: "Siehst du Mobbing? Mach nicht mit: nicht lachen, nicht liken, nicht weiterleiten. Halte zu dem Kind und sag einem Erwachsenen Bescheid."
            say: "Und wenn du siehst, dass ein anderes Kind gemobbt wird? Mach nicht mit. Lach nicht mit, like nichts und leite nichts weiter. Halte zu dem Kind, frag, wie es ihm geht, und sag einem Erwachsenen Bescheid. Wer nur zuschaut und mitlacht, macht es für das Kind schlimmer."
          - text: "Wusstest du? Ein Foto von einem anderen Menschen darf man meistens nur mit seiner Erlaubnis ins Internet stellen."
            say: "Wusstest du? In Deutschland darf man ein Foto von einem anderen Menschen meistens nur dann ins Internet stellen, wenn er es erlaubt. Das nennt man das Recht am eigenen Bild. Für Fotos von Kindern müssen meistens auch die Eltern einverstanden sein."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Hilft das Lea? Sortiere."
                bins:
                  - { id: ja, show: { text: "hilft" }, say: "hilft" }
                  - { id: nein, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "einen Screenshot machen", bin: ja }
                  - { text: "die Nachrichten ihren Eltern zeigen", bin: ja }
                  - { text: "genauso gemein zurückschreiben", bin: nein }
                  - { text: "alles löschen und niemandem etwas sagen", bin: nein }
                hints:
                  - "Denk an die vier Schritte: nicht zurückschreiben, Beweise sichern, blockieren und melden, Hilfe holen."
                  - "Was zeigt später, was passiert ist? Wer kann Lea helfen?"
                  - "Screenshot und Eltern: hilft. Zurückschreiben und alles löschen: hilft nicht."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Warum soll Lea die gemeinen Nachrichten nicht löschen?"
                options: ["Weil sie Beweise sind, die den Erwachsenen beim Helfen nützen.", "Weil das Handy sonst kaputtgeht.", "Weil man nie etwas löschen darf."]
                answer: "Weil sie Beweise sind, die den Erwachsenen beim Helfen nützen."
                hints:
                  - "Was müssen die Erwachsenen sehen, um zu helfen?"
                  - "Die Nachrichten zeigen, was passiert ist."
                  - "Weil sie Beweise sind."
              - id: l2-f3
                type: true_false
                text: "Lea erzählt ihrer Lehrerin vom Mobbing. Ist das Petzen?"
                answer: false
                hints:
                  - "Lea braucht Hilfe."
                  - "Wer Hilfe holt, schützt sich und andere."
                  - "Nein, Hilfe holen ist kein Petzen."
              - id: l2-f4
                type: matching
                text: "Was bedeutet das? Verbinde."
                pairs:
                  - { left: { text: "Screenshot" }, right: { text: "ein Bild vom Bildschirm, als Beweis" } }
                  - { left: { text: "blockieren" }, right: { text: "Der Absender kann dir nicht mehr schreiben." } }
                  - { left: { text: "melden" }, right: { text: "der App sagen, dass etwas nicht in Ordnung ist" } }
                  - { left: { text: "Nummer gegen Kummer" }, right: { text: "ein Telefon, bei dem Kindern zugehört wird" } }
                hints:
                  - "Fang mit dem an, was du sicher weißt."
                  - "Ein Screenshot ist ein Bild. Blockieren heißt: Die Person kommt nicht mehr durch."
                  - "Screenshot: Bild. Blockieren: kann nicht mehr schreiben. Melden: der App sagen. Nummer gegen Kummer: Telefon."
              - id: l2-f5
                type: multiple_choice
                text: "In der Klassengruppe lachen alle über Kim. Jonas sieht es. Was ist mutig und hilfreich?"
                options: ["Er lacht nicht mit, hält zu Kim und sagt einem Erwachsenen Bescheid.", "Er schickt ein lachendes Gesicht.", "Er leitet die Nachricht weiter."]
                answer: "Er lacht nicht mit, hält zu Kim und sagt einem Erwachsenen Bescheid."
                hints:
                  - "Wer nur zuschaut und mitlacht, macht es schlimmer."
                  - "Jonas kann nicht mitmachen, Kim helfen und Hilfe holen."
                  - "Nicht mitlachen, zu Kim halten, Bescheid sagen."
              - id: l2-f6
                type: text_input
                text: "Welche Nummer hat die Nummer gegen Kummer? Tippe sie ein."
                answer: "116111"
                hints:
                  - "Die Nummer hat sechs Ziffern und beginnt mit 116."
                  - "Danach kommen drei gleiche Ziffern."
                  - "116 111"

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "So hilft ein Zuschauer, oder nicht? Sortiere."
                bins:
                  - { id: ja, show: { text: "hilft" }, say: "hilft" }
                  - { id: nein, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "Kim fragen, wie es ihr geht", bin: ja }
                  - { text: "einer Lehrerin Bescheid sagen", bin: ja }
                  - { text: "das gemeine Foto liken", bin: nein }
                  - { text: "die Nachricht an andere weiterleiten", bin: nein }
                hints: ["Ein guter Zuschauer macht nicht mit und holt Hilfe."]
