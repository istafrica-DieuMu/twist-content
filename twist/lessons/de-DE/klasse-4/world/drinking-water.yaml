# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.drinking-water
skill: world.nature.drinking-water
curriculum: de-DE
language: de
title:
  de: Der Weg des Wassers
  en: The journey of water
summary: >
  Where tap water comes from and where waste water goes. The story: Lina
  brushes her teeth and wonders where the water comes from; her class
  visits the Wasserwerk with Frau Brandt and later the Kläranlage. Lesson
  1 opens with the guess where tap water comes from, then follows it:
  most drinking water in Germany is Grundwasser (rain soaks into the
  ground and is cleaned by sand and stone; some comes from Talsperren,
  lakes and rivers); a Brunnen pumps it up, the Wasserwerk filters and
  tests it, pipes under the street bring it to the tap. Clean water keeps
  us healthy; tap water in Germany is tested often and can be drunk. Each
  person uses about 125 litres a day, only a few of them for drinking.
  Lesson 2 follows the waste water: from toilet, shower and sink through
  the Kanal to the Kläranlage, where a Rechen catches large things,
  sand sinks, tiny living things (Bakterien) eat the dirt and the cleaned
  water flows into a river; what must not go down the toilet (Feuchttücher,
  food, fat, medicines); the whole way in order. It ends with the skill
  check. Real visits stay in class. Tap, pipe, Wasserwerk and
  Kläranlage are pictures from the bank.
metadata:
  year: klasse-4
  topic: { de: Wasser, en: Water }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.nature.water-cycle]
  also_practises: [world.nature.water-cycle]
  vocabulary: { de: [Trinkwasser, Leitungswasser, Grundwasser, Talsperre, Brunnen, Wasserwerk, Filter, Wasserrohr, Wasserhahn, Abwasser, Kanal, Kläranlage, Rechen, Bakterien, Becken, Feuchttuch] }
  forms: [text, audio, picture, drawn]
  drawn: [water-cycle]
  facets: []
  parts:
    - { id: drinking, what: { de: "sagen, woher unser Trinkwasser kommt und was das Wasserwerk damit macht", en: "saying where our drinking water comes from and what the waterworks does with it" } }
    - { id: sewage, what: { de: "beschreiben, wie Abwasser in der Kläranlage gereinigt wird und was nicht in die Toilette gehört", en: "describing how waste water is cleaned at the sewage works and what must not go down the toilet" } }
    - { id: journey, what: { de: "den ganzen Weg des Wassers in die richtige Reihenfolge bringen", en: "putting the whole journey of water in order" } }
  misconceptions:
    - id: tap-water-from-sea
      what: Thinks tap water comes straight from the sea or is made in the house
      addressed: "lesson 1 opens with the guess and follows the Grundwasser; l1-f1, l1-s2, l1-n2 and l2-c1, l2-c4"
    - id: flushed-is-gone
      what: Thinks what goes down the toilet simply disappears, so anything can be flushed
      addressed: "lesson 2 opens with the guess where the flush goes and shows the Rechen; l2-f4, l2-s1, l2-n3 and l2-c10, l2-c12"
    - id: clean-sewage-drinkable
      what: Thinks water from the Kläranlage goes straight back to the tap as drinking water
      addressed: "lesson 2 Learn says the cleaned water flows into a river, not to the tap; l2-f5, l2-n4 and l2-c13"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Vom Regen zum Wasserhahn", en: "From rain to the tap" }
    goal:
      de: "Folge dem Trinkwasser auf seinem Weg. Es kommt meistens aus dem Boden und fließt durch das Wasserwerk bis zu deinem Wasserhahn."
      en: "Follow drinking water on its way. It mostly comes from the ground and flows through the waterworks to your tap."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Es regnet. Wohin kann das Regenwasser fließen?"
            options: ["in den Boden, in Bäche und Flüsse", "nur zurück in die Wolke", "nirgendwohin, es verschwindet"]
            answer: "in den Boden, in Bäche und Flüsse"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Beim Wasserkreislauf geht kein Wasser verloren. Stimmt das?"
            show: { drawn: water-cycle }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lina putzt Zähne und dreht den Wasserhahn auf.\n\nWas glaubst du: Woher kommt das Wasser?"
            say: "Lina putzt sich die Zähne und dreht den Wasserhahn auf. Sofort kommt sauberes Wasser. Was glaubst du: Woher kommt dieses Wasser? Aus dem Meer, aus dem Boden oder aus einer großen Flasche im Keller?"
            show: { object: toothbrush }
          - text: "Das meiste Trinkwasser in Deutschland ist Grundwasser. Es kommt aus dem Boden."
            say: "Das meiste Trinkwasser in Deutschland kommt aus dem Boden! Regen versickert in der Erde. Auf dem Weg nach unten fließt er durch Sand und Steine. Die halten Schmutz zurück, wie ein Filter. Tief unten sammelt sich das Wasser. Es heißt Grundwasser. Ein Teil des Trinkwassers kommt auch aus Talsperren, Seen und Flüssen."
            show: { object: rain }
          - text: "Ein Brunnen pumpt das Grundwasser nach oben ins Wasserwerk."
            say: "Linas Klasse besucht das Wasserwerk. Frau Brandt arbeitet dort. Sie erklärt: Ein Brunnen pumpt das Grundwasser nach oben. Im Wasserwerk fließt es noch einmal durch große Filter aus Sand. Dann wird es im Labor geprüft. Erst wenn alles sauber ist, darf es weiter."
            show: { object: well }
          - text: "Durch Rohre unter der Straße fließt das Wasser bis zu deinem Wasserhahn."
            say: "Vom Wasserwerk fließt das Trinkwasser durch dicke Rohre unter der Straße. Von dort gehen dünnere Rohre in jedes Haus, bis zu deinem Wasserhahn. Darum kommt sofort Wasser, wenn du ihn aufdrehst."
            show: { object: house }
          - text: "Sauberes Wasser hält uns gesund. Leitungswasser wird in Deutschland oft geprüft. Man kann es trinken."
            say: "Sauberes Wasser ist wichtig für die Gesundheit. Schmutziges Wasser kann Menschen krank machen. In Deutschland gibt es strenge Regeln für Trinkwasser, und es wird oft geprüft. Darum kannst du das Wasser aus dem Hahn trinken."
            show: { object: glass }
          - text: "Wusstest du? Für die Toilettenspülung brauchen wir viel mehr Wasser als zum Trinken."
            say: "Wusstest du? Jeder Mensch in Deutschland braucht ungefähr hundertfünfundzwanzig Liter Wasser am Tag. Das sind mehr als zehn Eimer voll. Zum Trinken und Kochen sind davon nur wenige Liter. Viel mehr fließt beim Duschen, Baden und durch die Toilettenspülung."
            show: { object: bucket }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Woher kommt das meiste Trinkwasser in Deutschland?"
                options: ["aus dem Boden, als Grundwasser", "direkt aus dem Meer", "aus Pfützen auf der Straße"]
                answer: "aus dem Boden, als Grundwasser"
                feedback:
                  "aus Pfützen auf der Straße": "Pfützenwasser im Glas? Lieber nicht! Das meiste Trinkwasser ist Grundwasser aus dem Boden."
                hints:
                  - "Denk an den Regen, der in der Erde versickert."
                  - "Das Wasser sammelt sich tief unten im Boden."
                  - "Aus dem Boden, als Grundwasser."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Wie kommt das Wasser zu Lina? Bring es in die richtige Reihenfolge."
                options: [{ object: waterworks }, { object: tap }, "Grundwasser", { object: water-pipe }]
                slot_count: 4
                answer: ["Grundwasser", waterworks, water-pipe, tap]
                hints:
                  - "Am Anfang ist das Wasser noch im Boden."
                  - "Erst wird das Wasser gereinigt, dann fließt es durch die Rohre."
                  - "Grundwasser, Wasserwerk, Rohre, Wasserhahn."
              - id: l1-f3
                type: true_false
                text: "Wenn Regen in der Erde versickert, halten Sand und Steine Schmutz zurück. Stimmt das?"
                answer: true
                hints:
                  - "Sand und Steine wirken wie ein Filter."
                  - "Ein Filter lässt Wasser durch, aber hält Schmutz fest."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: matching
                text: "Was passiert wo? Verbinde."
                pairs:
                  - { left: { object: well }, right: { text: "pumpt das Grundwasser nach oben" } }
                  - { left: { object: waterworks }, right: { text: "reinigt und prüft das Wasser" } }
                  - { left: { object: water-pipe }, right: { text: "bringen das Wasser bis ins Haus" } }
                hints:
                  - "Jedes Wort ist ein Ort auf dem Weg des Wassers."
                  - "Im Wasserwerk arbeitet Frau Brandt mit Filtern und im Labor."
                  - "Brunnen: pumpt. Wasserwerk: reinigt und prüft. Rohre: bringen ins Haus."
              - id: l1-f5
                type: image_multiple_choice
                text: "Wofür braucht Lina am Tag das meiste Wasser?"
                options: [{ object: bath }, { object: glass }, { object: cup }]
                answer: bath
                hints:
                  - "Zum Trinken braucht man nur wenige Liter."
                  - "Beim Duschen und Baden fließt sehr viel Wasser."
                  - "Für das Bad."
              - id: l1-f6
                type: multiple_choice
                text: "Warum prüft das Wasserwerk das Trinkwasser so oft?"
                options: ["Weil schmutziges Wasser krank machen kann.", "Weil das Wasser sonst zu kalt ist.", "Weil Frau Brandt gern Wasser trinkt."]
                answer: "Weil schmutziges Wasser krank machen kann."
                hints:
                  - "Trinkwasser ist wichtig für die Gesundheit."
                  - "Was passiert, wenn man schmutziges Wasser trinkt?"
                  - "Schmutziges Wasser kann krank machen."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Woher kann Trinkwasser kommen? Sortiere."
                bins:
                  - { id: yes, show: { text: "Trinkwasser kommt von dort" }, say: "Trinkwasser kommt von dort" }
                  - { id: no, show: { text: "nicht von dort" }, say: "nicht von dort" }
                options:
                  - { text: "Grundwasser", bin: yes }
                  - { object: reservoir, bin: yes }
                  - { object: puddle, bin: no }
                  - { object: bin, bin: no }
                hints: ["Das Wasser muss sauber sein, bevor das Wasserwerk es reinigt."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie heißt das Wasser, das sich tief im Boden sammelt?"
                options: ["Grundwasser", "Abwasser", "Mineralwasser aus der Flasche"]
                answer: "Grundwasser"
                hints: ["Es liegt ganz unten, auf dem Grund."]
              - id: l1-s3
                type: true_false
                text: "Leitungswasser darf man in Deutschland nicht trinken. Stimmt das?"
                answer: false
                hints: ["Für Trinkwasser gibt es strenge Regeln, und es wird oft geprüft."]
              - id: l1-s4
                type: fill_in_blank
                text: "Ergänze."
                frame: "Im Wasserwerk fließt das Wasser durch große Filter aus _. Danach wird es im _ geprüft."
                options: ["Sand", "Labor", "Plastik", "Keller"]
                answer: ["Sand", "Labor"]
                hints: ["Frau Brandt prüft das Wasser wie eine Forscherin."]
              - id: l1-s5
                type: ordering
                text: "Vom Regen zum Glas: Bring es in die richtige Reihenfolge."
                options: [{ object: glass }, { object: waterworks }, { object: rain }]
                slot_count: 3
                answer: [rain, waterworks, glass]
                hints: ["Am Anfang fällt das Wasser vom Himmel."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Wie kommt das Wasser zu dir? Bring es in die richtige Reihenfolge."
                options: ["Brunnen pumpt es hoch", "Regen versickert im Boden", "Wasserhahn", "Wasserwerk reinigt es"]
                slot_count: 4
                answer: ["Regen versickert im Boden", "Brunnen pumpt es hoch", "Wasserwerk reinigt es", "Wasserhahn"]
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Jonas sagt: „Unser Leitungswasser kommt direkt aus dem Meer.“ Was stimmt?"
                options: ["Nein, es ist meistens Grundwasser aus dem Boden.", "Ja, deshalb schmeckt es salzig.", "Ja, ein Schiff bringt es jeden Morgen."]
                answer: "Nein, es ist meistens Grundwasser aus dem Boden."
              - id: l1-n3
                type: true_false
                text: "Zum Trinken und Kochen braucht ein Mensch am Tag mehr Wasser als für Duschen, Baden und Toilette zusammen. Stimmt das?"
                answer: false
              - id: l1-n4
                type: matching
                text: "Was ist was? Verbinde."
                pairs:
                  - { left: { text: "Grundwasser" }, right: { text: "Wasser tief im Boden" } }
                  - { left: { object: reservoir }, right: { text: "ein großer See hinter einer Mauer" } }
                  - { left: { object: waterworks }, right: { text: "macht aus Grundwasser Trinkwasser" } }
              - id: l1-n5
                type: multiple_choice
                text: "Warum kommt sofort Wasser, wenn Lina den Hahn aufdreht?"
                options: ["Die Rohre sind immer voll mit Wasser aus dem Wasserwerk.", "Im Wasserhahn wohnt eine kleine Wolke.", "Das Wasser wird im Hahn gemacht."]
                answer: "Die Rohre sind immer voll mit Wasser aus dem Wasserwerk."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was macht das Wasserwerk?"
            show: { object: waterworks }
            options: ["Es reinigt und prüft das Wasser.", "Es macht aus Luft Wasser.", "Es reinigt schmutziges Abwasser."]
            answer: "Es reinigt und prüft das Wasser."
          - id: l1-c2
            type: true_false
            text: "Das meiste Trinkwasser in Deutschland ist Grundwasser. Stimmt das?"
            answer: true
          - id: l1-c3
            type: ordering
            text: "Bring den Weg des Trinkwassers in die richtige Reihenfolge."
            options: [{ object: tap }, "Grundwasser", { object: waterworks }]
            slot_count: 3
            answer: ["Grundwasser", waterworks, tap]
          - id: l1-c4
            type: multiple_choice
            text: "Was hält Schmutz zurück, wenn Regen im Boden versickert?"
            options: ["Sand und Steine", "Würmer und Käfer", "das Licht"]
            answer: "Sand und Steine"
          - id: l1-c5
            type: true_false
            text: "Schmutziges Wasser kann Menschen krank machen. Stimmt das?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Wie kommt das Trinkwasser vom Wasserwerk in die Häuser?"
            options: ["durch Rohre unter der Straße", "mit Lastwagen", "durch die Luft"]
            answer: "durch Rohre unter der Straße"

  - n: 2
    title: { de: "Wohin fließt das Abwasser?", en: "Where does waste water go?" }
    goal:
      de: "Finde heraus, wohin das Wasser aus Toilette und Dusche fließt und wie die Kläranlage es wieder sauber macht."
      en: "Find out where the water from the toilet and the shower goes and how the sewage works cleans it again."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            text: "Bring den Weg des Trinkwassers in die richtige Reihenfolge."
            options: [{ object: water-pipe }, { object: waterworks }, { object: tap }, { object: well }]
            slot_count: 4
            answer: [well, waterworks, water-pipe, tap]
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Woher kommt das meiste Trinkwasser in Deutschland?"
            options: ["aus dem Boden", "aus dem Meer", "aus dem Supermarkt"]
            answer: "aus dem Boden"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lina zieht die Toilettenspülung.\n\nWas glaubst du: Wohin fließt das Wasser jetzt?"
            say: "Lina geht auf die Toilette und zieht die Spülung. Was glaubst du: Wohin fließt das Wasser jetzt? Verschwindet es einfach, fließt es direkt in den Fluss oder kommt es irgendwo an?"
            show: { object: toilet }
          - text: "Abwasser fließt durch den Kanal unter der Straße zur Kläranlage."
            say: "Es kommt an! Das Wasser aus Toilette, Dusche, Waschbecken und Waschmaschine heißt Abwasser. Es fließt durch Rohre aus dem Haus in einen großen Kanal unter der Straße. Der Kanal bringt es zur Kläranlage. Dort wird es wieder sauber gemacht."
            show: { object: bath }
          - text: "1. Ein Rechen fängt große Dinge auf.\n2. Sand sinkt nach unten."
            say: "Linas Klasse besucht auch die Kläranlage. Zuerst fließt das Abwasser durch einen Rechen. Das ist ein großes Gitter. Es fängt alles Große auf: Feuchttücher, Plastik und Essensreste. Danach fließt das Wasser langsam durch ein Becken, den Sandfang. Dort sinken Sand und kleine Steine nach unten."
            show: { object: sewage-plant }
          - text: "3. Winzige Lebewesen fressen den Schmutz.\n4. Das saubere Wasser fließt in einen Fluss."
            say: "Im nächsten Becken arbeiten winzige Lebewesen. Sie heißen Bakterien und sind so klein, dass man sie nur unter dem Mikroskop sieht. Sie fressen den Schmutz im Wasser. Am Ende ist das Wasser so sauber, dass es in einen Fluss fließen darf. Trinkwasser ist es aber noch nicht. So kommt das Wasser zurück in den Wasserkreislauf."
            show: { object: boat }
          - text: "In die Toilette gehören nur Toilettenpapier und was aus dem Körper kommt."
            say: "Der Arbeiter in der Kläranlage bittet die Kinder: In die Toilette gehören nur Toilettenpapier und das, was aus dem Körper kommt. Feuchttücher verstopfen die Pumpen. Fett und Öl verkleben die Rohre. Essensreste locken Ratten an. Und alte Medikamente kann die Kläranlage nicht ganz herausholen. Sie landen sonst im Fluss."
            show: { object: bin }
          - text: "Wusstest du? Schon die Römer bauten eine Wasserleitung, die fast 100 Kilometer lang war."
            say: "Wusstest du? Schon vor fast zweitausend Jahren bauten die Römer eine Wasserleitung aus der Eifel bis nach Köln. Sie war fast hundert Kilometer lang. Das Wasser floss darin ganz ohne Pumpen, nur leicht bergab."
            show: { object: aqueduct }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wohin fließt das Abwasser aus Linas Dusche?"
                options: ["durch den Kanal zur Kläranlage", "direkt zurück ins Wasserwerk", "in den Garten"]
                answer: "durch den Kanal zur Kläranlage"
                hints:
                  - "Abwasser muss erst gereinigt werden."
                  - "Unter der Straße liegt ein großer Kanal."
                  - "Durch den Kanal zur Kläranlage."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Was passiert in der Kläranlage? Bring es in die richtige Reihenfolge."
                options: ["Bakterien fressen den Schmutz.", "Der Rechen fängt große Dinge auf.", "Das saubere Wasser fließt in den Fluss.", "Sand sinkt nach unten."]
                slot_count: 4
                answer: ["Der Rechen fängt große Dinge auf.", "Sand sinkt nach unten.", "Bakterien fressen den Schmutz.", "Das saubere Wasser fließt in den Fluss."]
                option_audio: false
                hints:
                  - "Zuerst kommt das Große heraus, am Ende ist das Wasser sauber."
                  - "Nach dem Rechen sinkt der Sand. Dann arbeiten die Bakterien."
                  - "Rechen, Sand, Bakterien, Fluss."
              - id: l2-f3
                type: matching
                text: "Was macht was in der Kläranlage? Verbinde."
                pairs:
                  - { left: { text: "Rechen" }, right: { text: "fängt Feuchttücher und Plastik auf" } }
                  - { left: { text: "Bakterien" }, right: { text: "fressen den Schmutz im Wasser" } }
                  - { left: { text: "Kanal" }, right: { text: "bringt das Abwasser zur Kläranlage" } }
                hints:
                  - "Ein Rechen ist ein großes Gitter."
                  - "Bakterien sind winzige Lebewesen."
                  - "Rechen: fängt auf. Bakterien: fressen Schmutz. Kanal: bringt das Abwasser."
              - id: l2-f4
                type: sorting
                text: "Darf das in die Toilette? Sortiere."
                bins:
                  - { id: yes, show: { text: "darf in die Toilette" }, say: "darf in die Toilette" }
                  - { id: no, show: { text: "gehört nicht hinein" }, say: "gehört nicht hinein" }
                options:
                  - { object: toilet-paper, bin: yes }
                  - { object: wet-wipes, bin: no }
                  - { text: "Bratfett", bin: no }
                  - { object: pills, bin: no }
                hints:
                  - "Nur sehr wenig gehört in die Toilette."
                  - "Feuchttücher verstopfen Pumpen, Fett verklebt Rohre."
                  - "Nur das Toilettenpapier darf hinein."
              - id: l2-f5
                type: true_false
                text: "Das Wasser aus der Kläranlage fließt direkt zurück in Linas Wasserhahn. Stimmt das?"
                answer: false
                hints:
                  - "Wohin fließt das Wasser am Ende der Kläranlage?"
                  - "Es ist sauber genug für den Fluss, aber noch kein Trinkwasser."
                  - "Nein, es fließt in einen Fluss."
              - id: l2-f6
                type: image_multiple_choice
                text: "Wohin gehören alte Feuchttücher?"
                options: [{ object: bin }, { object: bath }, { object: bucket }]
                answer: bin
                hints:
                  - "In die Toilette dürfen sie nicht."
                  - "Sie sind Müll."
                  - "In die Mülltonne."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Warum dürfen Feuchttücher nicht in die Toilette?"
                options: ["Sie lösen sich nicht auf und verstopfen die Pumpen.", "Sie sind zu teuer.", "Sie machen das Wasser blau."]
                answer: "Sie lösen sich nicht auf und verstopfen die Pumpen."
                hints: ["Der Rechen fängt sie auf, aber manche kommen bis zu den Pumpen."]
              - id: l2-s2
                type: fill_in_blank
                text: "Ergänze."
                frame: "Das Wasser aus Toilette und Dusche heißt _. Es fließt durch den Kanal zur _."
                options: ["Abwasser", "Kläranlage", "Grundwasser", "Talsperre"]
                answer: ["Abwasser", "Kläranlage"]
                hints: ["Sauberes Wasser kommt vom Wasserwerk, schmutziges Wasser fließt ab."]
              - id: l2-s3
                type: true_false
                text: "In der Kläranlage helfen winzige Lebewesen, das Wasser sauber zu machen. Stimmt das?"
                answer: true
                hints: ["Denk an die Bakterien."]
              - id: l2-s4
                type: ordering
                text: "Wohin fließt das Abwasser? Bring es in die richtige Reihenfolge."
                options: [{ object: river }, { object: toilet }, { object: sewage-plant }, "Kanal"]
                slot_count: 4
                answer: [toilet, "Kanal", sewage-plant, river]
                hints: ["Das Abwasser muss gereinigt werden, bevor es in den Fluss darf."]
              - id: l2-s5
                type: multiple_choice
                text: "Papa will heißes Bratfett in die Spüle kippen. Was sagt Lina?"
                options: ["„Nicht! Das Fett verklebt die Rohre.“", "„Gut, dann ist die Pfanne sauber.“", "„Kipp lieber noch Wasser dazu.“"]
                answer: "„Nicht! Das Fett verklebt die Rohre.“"
                hints: ["Fett wird kalt und hart, auch im Rohr."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
