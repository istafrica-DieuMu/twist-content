# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.turning-left
skill: world.space.turning-left
curriculum: de-DE
language: de
title:
  de: Sicher links abbiegen
  en: Turning left safely
summary: >
  Mira cycles to her friend Ayşe, and the way turns left. Lesson 1 is
  direct turning left as the Radfahrausbildung teaches it, following StVO
  § 9: look back over the left shoulder (Schulterblick), give the hand
  signal (left arm out; right arm for turning right), move to the middle
  of the road on your own side (einordnen), let oncoming traffic go
  (whoever goes straight on or turns right goes first, and people crossing
  the road you turn into), look over the left shoulder once more, then
  turn with both hands on the handlebar. Lesson 2 is indirect turning
  left, which StVO § 9 allows on a bike and which is often safer for
  children at big or busy junctions: ride straight across on the right,
  stop at the right edge on the far side, turn the bike to the new
  direction, look both ways (or wait for green), then ride straight
  across; or get off and push the bike across at a pedestrian light or
  zebra crossing as a pedestrian; and when to choose which. It ends with
  the skill check. The junction is drawn from above as in right-of-way
  ("Du" comes from the bottom).
metadata:
  year: klasse-4
  topic: { de: Mit dem Fahrrad unterwegs, en: Out on a bike }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [world.space.right-of-way]
  also_practises: [world.space.right-of-way]
  vocabulary: { de: [abbiegen, Linksabbiegen, Schulterblick, Handzeichen, einordnen, Mitte der Straße, Gegenverkehr, direkt, indirekt, schieben, Fußgängerampel, Fußgänger] }
  forms: [text, audio, picture, drawn]
  drawn: [grid]
  facets: []
  parts:
    - { id: direct-steps, what: { de: "die Schritte zum direkten Linksabbiegen in der richtigen Reihenfolge nennen", en: "putting the steps for turning left directly in the right order" } }
    - { id: look-signal, what: { de: "Schulterblick, Handzeichen und Gegenverkehr durchlassen erklären", en: "explaining the look over the shoulder, the hand signal and letting oncoming traffic go" } }
    - { id: indirect, what: { de: "indirekt links abbiegen oder schieben und sagen, wann das sicherer ist", en: "turning left indirectly or pushing the bike, and saying when that is safer" } }
  misconceptions:
    - id: signal-first
      what: Gives the hand signal or moves to the middle before looking back over the shoulder
      addressed: "lesson 1 Learn puts the Schulterblick first; l1-f1, l1-s4, l1-n1, l1-c1 and l2-c1 test the order"
    - id: turn-before-oncoming
      what: Thinks a left turner may go before oncoming traffic, like rechts vor links
      addressed: "lesson 1 Learn says oncoming traffic goes first; l1-f5, l1-s1, l1-n4 and l2-c7, l2-c13 test it, with feedback on l1-f5"
    - id: arm-out-while-turning
      what: Keeps the arm out while turning instead of both hands on the handlebar
      addressed: "lesson 1 Learn says both hands on the handlebar for the turn; l1-f6, l1-s2 and l2-c6 test it"
    - id: must-go-to-middle
      what: Thinks a cyclist must always move to the middle of the road to turn left
      addressed: "lesson 2 Learn opens with the question and shows indirect turning and pushing; l2-f3, l2-n1 and l2-c16 test it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Direkt links abbiegen", en: "Turning left directly" }
    goal:
      de: "Lerne die Schritte zum Linksabbiegen mit dem Fahrrad. Zuerst kommt immer der Schulterblick."
      en: "Learn the steps for turning left on a bike. The look over your shoulder always comes first."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Kein Schild, keine Ampel. Wer darf zuerst fahren?"
            say: "Schau dir die Kreuzung an. Es gibt kein Schild und keine Ampel. Wer darf zuerst fahren?"
            show: { drawn: grid, cols: 5, rows: 5, cells: [[0, 0, green], [1, 0, green], [3, 0, green], [4, 0, green], [0, 1, green], [1, 1, green], [3, 1, green], [4, 1, green], [0, 3, green], [1, 3, green], [3, 3, green], [4, 3, green], [0, 4, green], [1, 4, green], [3, 4, green], [4, 4, green]], labels: [[2, 4, "Du"], [4, 2, "A"]] }
            options: ["Auto A", "du"]
            answer: "Auto A"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Am Stoppschild hältst du ganz an. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mira fährt zu ihrer Freundin Ayşe. Gleich muss sie links abbiegen.\n\nWarum ist Linksabbiegen schwieriger als Rechtsabbiegen?"
            say: "Mira fährt mit dem Rad zu ihrer Freundin Ayşe. An der nächsten Kreuzung muss sie links abbiegen. Was glaubst du: Warum ist Linksabbiegen schwieriger als Rechtsabbiegen?"
            show: { object: ride-bike }
          - text: "Beim Linksabbiegen kreuzt du die Straße. Hinter dir fahren Autos, und von vorne kommt Gegenverkehr."
            say: "Wer rechts abbiegt, bleibt am rechten Rand. Wer links abbiegt, muss über die ganze Straße. Hinter dir fahren Autos, und von vorne kommt Gegenverkehr. Darum geht Mira Schritt für Schritt vor."
          - text: "1. Schulterblick: über die linke Schulter nach hinten schauen."
            say: "Schritt eins: der Schulterblick. Mira schaut über ihre linke Schulter nach hinten. Kommt ein Auto? Dabei hält sie den Lenker gerade, damit sie nicht schlenkert."
          - text: "2. Handzeichen: den linken Arm ausstrecken."
            say: "Schritt zwei: das Handzeichen. Mira streckt ihren linken Arm aus. So wissen alle, dass sie nach links will. Wer rechts abbiegen will, streckt den rechten Arm aus."
            show: { object: arm }
          - text: "3. Einordnen: zur Mitte der Straße fahren, auf deiner Seite."
            say: "Schritt drei: einordnen. Wenn hinten frei ist, fährt Mira zur Mitte der Straße, aber noch auf ihrer Seite. Dort wartet sie."
          - text: "4. Gegenverkehr durchlassen."
            say: "Schritt vier: den Gegenverkehr durchlassen. Wer Mira entgegenkommt und geradeaus fährt oder rechts abbiegt, darf zuerst. Auch Fußgänger, die über die Straße gehen, in die sie abbiegt, lässt sie gehen."
            show: { drawn: grid, cols: 5, rows: 5, cells: [[0, 0, green], [1, 0, green], [3, 0, green], [4, 0, green], [0, 1, green], [1, 1, green], [3, 1, green], [4, 1, green], [0, 3, green], [1, 3, green], [3, 3, green], [4, 3, green], [0, 4, green], [1, 4, green], [3, 4, green], [4, 4, green]], labels: [[2, 4, "Du"], [2, 0, "A"]] }
          - text: "5. Noch einmal Schulterblick nach links.\n6. Abbiegen, mit beiden Händen am Lenker."
            say: "Schritt fünf: Kurz vor dem Abbiegen schaut Mira noch einmal über die linke Schulter. Vielleicht will sie gerade jemand überholen. Schritt sechs: Jetzt biegt sie ab, mit beiden Händen am Lenker. So kann sie sicher lenken und bremsen."
          - text: "Wusstest du? Früher hatten Autos statt Blinkern kleine Ärmchen, die beim Abbiegen herausklappten."
            say: "Wusstest du? Früher hatten viele Autos noch keine Blinker. Stattdessen klappte an der Seite ein kleines Ärmchen heraus, wenn der Fahrer abbiegen wollte. Es hieß Winker. Eigentlich hat das Auto also ein Handzeichen gegeben, genau wie du."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Mira will links abbiegen. Bring die ersten drei Schritte in die richtige Reihenfolge."
                options: ["Handzeichen geben", "zur Mitte einordnen", "Schulterblick nach hinten"]
                slot_count: 3
                answer: ["Schulterblick nach hinten", "Handzeichen geben", "zur Mitte einordnen"]
                hints:
                  - "Bevor Mira etwas tut, muss sie wissen, wer hinter ihr fährt."
                  - "Erst schauen, dann zeigen, dann fahren."
                  - "Schulterblick, Handzeichen, einordnen."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Womit gibt Mira das Handzeichen?"
                options: [{ object: foot }, { object: arm }, { object: ear }]
                answer: arm
                feedback:
                  foot: "Mit dem Fuß winken? Dann fällt Mira vom Rad! Sie streckt den Arm aus."
                hints:
                  - "Das Handzeichen sehen die anderen von weitem."
                  - "Mira streckt etwas zur Seite aus."
                  - "Mit dem Arm."
              - id: l1-f3
                type: multiple_choice
                text: "Mira will links abbiegen. Welchen Arm streckt sie aus?"
                options: ["den linken Arm", "den rechten Arm", "beide Arme"]
                answer: "den linken Arm"
                hints:
                  - "Der Arm zeigt, wohin Mira will."
                  - "Sie will nach links."
                  - "Den linken Arm."
              - id: l1-f4
                type: true_false
                text: "Beim Schulterblick schaust du über die linke Schulter nach hinten. Stimmt das?"
                answer: true
                hints:
                  - "Beim Linksabbiegen willst du sehen, was hinter dir links kommt."
                  - "Du drehst den Kopf nach links und schaust nach hinten."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Mira hat sich zur Mitte eingeordnet. Ein Auto kommt ihr entgegen und fährt geradeaus. Was macht Mira?"
                options: ["Sie lässt das Auto vorbei.", "Sie biegt schnell vor dem Auto ab.", "Sie klingelt, damit das Auto anhält."]
                answer: "Sie lässt das Auto vorbei."
                feedback:
                  "Sie biegt schnell vor dem Auto ab.": "Das ist gefährlich! Wer links abbiegt, lässt den Gegenverkehr zuerst fahren."
                hints:
                  - "Wer ist beim Linksabbiegen zuerst dran?"
                  - "Der Gegenverkehr darf vor dir fahren."
                  - "Sie lässt das Auto vorbei."
              - id: l1-f6
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Kurz vor dem Abbiegen schaue ich noch einmal über die _ Schulter. Beim Abbiegen habe ich _ Hände am Lenker."
                options: ["linke", "rechte", "beide", "keine"]
                answer: ["linke", "beide"]
                hints:
                  - "Du biegst nach links ab. Wer könnte dich links überholen?"
                  - "Zum Lenken und Bremsen brauchst du beide Hände."
                  - "Die linke Schulter, beide Hände."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Du willst links abbiegen. Auto A kommt dir entgegen und fährt geradeaus. Wer fährt zuerst?"
                say: "Schau dir die Kreuzung an. Du willst links abbiegen. Auto A kommt dir entgegen und fährt geradeaus. Wer fährt zuerst?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[0, 0, green], [1, 0, green], [3, 0, green], [4, 0, green], [0, 1, green], [1, 1, green], [3, 1, green], [4, 1, green], [0, 3, green], [1, 3, green], [3, 3, green], [4, 3, green], [0, 4, green], [1, 4, green], [3, 4, green], [4, 4, green]], labels: [[2, 4, "Du"], [2, 0, "A"]] }
                options: ["Auto A", "du"]
                answer: "Auto A"
                hints: ["Beim Linksabbiegen lässt du den Gegenverkehr durch."]
              - id: l1-s2
                type: true_false
                text: "Beim Abbiegen hältst du den Arm die ganze Zeit ausgestreckt. Stimmt das?"
                answer: false
                hints: ["Zum Lenken und Bremsen brauchst du beide Hände am Lenker."]
              - id: l1-s3
                type: ordering
                text: "Bring die letzten drei Schritte in die richtige Reihenfolge."
                options: ["abbiegen", "noch einmal Schulterblick", "Gegenverkehr durchlassen"]
                slot_count: 3
                answer: ["Gegenverkehr durchlassen", "noch einmal Schulterblick", "abbiegen"]
                hints: ["Abbiegen ist immer der letzte Schritt."]
              - id: l1-s4
                type: multiple_choice
                text: "Warum machst du vor dem Einordnen einen Schulterblick?"
                options: ["um zu sehen, ob von hinten ein Auto kommt", "um zu sehen, ob dein Rucksack zu ist", "um dem Gegenverkehr zu winken"]
                answer: "um zu sehen, ob von hinten ein Auto kommt"
                hints: ["Beim Einordnen fährst du zur Mitte. Wer könnte dort schon fahren?"]
              - id: l1-s5
                type: matching
                text: "Was machst du dabei? Verbinde."
                pairs:
                  - { left: { text: "Schulterblick" }, right: { text: "über die linke Schulter nach hinten schauen" } }
                  - { left: { text: "Handzeichen" }, right: { text: "den linken Arm ausstrecken" } }
                  - { left: { text: "einordnen" }, right: { text: "zur Mitte der Straße fahren" } }
                hints: ["Beim Schulterblick bewegst du den Kopf, beim Handzeichen den Arm."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Bring alle Schritte zum Linksabbiegen in die richtige Reihenfolge."
                options: ["Gegenverkehr durchlassen", "Handzeichen geben", "abbiegen", "zur Mitte einordnen", "noch einmal Schulterblick", "Schulterblick nach hinten"]
                slot_count: 6
                answer: ["Schulterblick nach hinten", "Handzeichen geben", "zur Mitte einordnen", "Gegenverkehr durchlassen", "noch einmal Schulterblick", "abbiegen"]
              - id: l1-n2
                type: true_false
                text: "Wenn du links abbiegst, musst du den Gegenverkehr vorbeilassen. Stimmt das?"
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Mira will rechts abbiegen. Welches Handzeichen gibt sie?"
                options: ["Sie streckt den rechten Arm aus.", "Sie streckt den linken Arm aus.", "Sie gibt gar keins."]
                answer: "Sie streckt den rechten Arm aus."
              - id: l1-n4
                type: multiple_choice
                text: "Auto A kommt dir entgegen und biegt rechts ab. Du willst links abbiegen. Wer fährt zuerst?"
                say: "Schau dir die Kreuzung an. Auto A kommt dir entgegen und will rechts abbiegen. Du willst links abbiegen. Wer fährt zuerst?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[0, 0, green], [1, 0, green], [3, 0, green], [4, 0, green], [0, 1, green], [1, 1, green], [3, 1, green], [4, 1, green], [0, 3, green], [1, 3, green], [3, 3, green], [4, 3, green], [0, 4, green], [1, 4, green], [3, 4, green], [4, 4, green]], labels: [[2, 4, "Du"], [2, 0, "A"]] }
                options: ["Auto A", "du"]
                answer: "Auto A"
              - id: l1-n5
                type: sorting
                text: "Richtig oder falsch beim Linksabbiegen? Sortiere."
                bins:
                  - { id: right, show: { text: "richtig" }, say: "richtig" }
                  - { id: wrong, show: { text: "falsch" }, say: "falsch" }
                options:
                  - { text: "beim Abbiegen beide Hände am Lenker", bin: right }
                  - { text: "den Gegenverkehr vorbeilassen", bin: right }
                  - { text: "ohne Schulterblick zur Mitte fahren", bin: wrong }
                  - { text: "ohne Handzeichen abbiegen", bin: wrong }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist der erste Schritt beim Linksabbiegen?"
            options: ["der Schulterblick nach hinten", "das Abbiegen", "das Einordnen"]
            answer: "der Schulterblick nach hinten"
          - id: l1-c2
            type: true_false
            text: "Zum Linksabbiegen streckst du den rechten Arm aus. Stimmt das?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Ein Fahrrad kommt dir entgegen und fährt geradeaus. Du willst links abbiegen. Wer fährt zuerst?"
            options: ["das Fahrrad", "du", "wer zuerst klingelt"]
            answer: "das Fahrrad"
          - id: l1-c4
            type: ordering
            text: "Was machst du zuerst? Bring die Schritte in die richtige Reihenfolge."
            options: ["einordnen", "Handzeichen", "Schulterblick"]
            slot_count: 3
            answer: ["Schulterblick", "Handzeichen", "einordnen"]
          - id: l1-c5
            type: true_false
            text: "Kurz vor dem Abbiegen schaust du noch einmal über die linke Schulter. Stimmt das?"
            answer: true
          - id: l1-c6
            type: image_multiple_choice
            text: "Womit hältst du beim Abbiegen den Lenker?"
            options: [{ object: hand }, { object: foot }, { object: nose }]
            answer: hand

  - n: 2
    title: { de: "Indirekt links abbiegen", en: "Turning left indirectly" }
    goal:
      de: "Lerne, wie du an einer großen Kreuzung sicher links abbiegst, ohne in die Mitte zu fahren. Du fährst erst geradeaus und dann über die Straße."
      en: "Learn how to turn left safely at a big junction without going to the middle. You ride straight on first and then across the road."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was machst du direkt nach dem Schulterblick?"
            options: ["das Handzeichen geben", "abbiegen", "absteigen"]
            answer: "das Handzeichen geben"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Beim Abbiegen hast du beide Hände am Lenker. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Heute ist viel los: zwei Spuren, viele Autos, ein Lastwagen. Mira traut sich nicht in die Mitte.\n\nMuss sie trotzdem in die Mitte fahren?"
            say: "Heute nimmt Mira einen anderen Weg. An der großen Kreuzung ist viel los: Die Straße hat zwei Spuren, es fahren viele Autos und ein Lastwagen. Mira traut sich nicht, in die Mitte zu fahren. Was glaubst du: Muss sie trotzdem in die Mitte?"
            show: { object: lorry }
          - text: "Nein! Mit dem Fahrrad darfst du auch indirekt links abbiegen."
            say: "Nein! Mit dem Fahrrad darfst du auch indirekt links abbiegen. Dann fährst du gar nicht in die Mitte der Straße. Für Kinder ist das an großen Kreuzungen oft der sicherere Weg."
          - text: "1. Rechts bleiben und geradeaus über die Kreuzung fahren."
            say: "Schritt eins: Mira bleibt rechts und fährt geradeaus über die Kreuzung, so als wollte sie gar nicht abbiegen."
          - text: "2. Auf der anderen Seite rechts am Rand anhalten."
            say: "Schritt zwei: Auf der anderen Seite der Kreuzung hält sie rechts am Rand an, so dass sie niemandem im Weg steht."
          - text: "3. Das Rad in die neue Richtung drehen."
            say: "Schritt drei: Sie dreht ihr Fahrrad nach links, in die Richtung, in die sie weiterfahren will."
          - text: "4. Nach links und rechts schauen. Ist frei oder die Ampel grün, geradeaus über die Straße fahren."
            say: "Schritt vier: Jetzt schaut sie nach links und nach rechts, denn von beiden Seiten kann Verkehr kommen. Gibt es eine Ampel, wartet sie auf Grün. Ist alles frei, fährt sie geradeaus über die Straße."
          - text: "Noch sicherer: absteigen und schieben. Dann bist du Fußgängerin oder Fußgänger."
            say: "Es geht auch noch anders. Mira kann absteigen und ihr Rad an der Fußgängerampel oder am Zebrastreifen über die Straße schieben. Wer sein Rad schiebt, ist ein Fußgänger."
            show: { object: traffic-light-green }
          - text: "Wenig Verkehr, du fühlst dich sicher: direkt.\nViel Verkehr, mehrere Spuren oder du bist unsicher: indirekt oder schieben."
            say: "Und wann nimmst du welchen Weg? Auf einer ruhigen Straße, wenn du dich sicher fühlst, kannst du direkt abbiegen. Bei viel Verkehr, bei mehreren Spuren oder wenn du dich unsicher fühlst, biegst du indirekt ab oder schiebst."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Mira biegt indirekt links ab. Bring die Schritte in die richtige Reihenfolge."
                options: ["das Rad in die neue Richtung drehen", "geradeaus über die Kreuzung fahren", "nach links und rechts schauen und über die Straße fahren", "rechts am Rand anhalten"]
                slot_count: 4
                answer: ["geradeaus über die Kreuzung fahren", "rechts am Rand anhalten", "das Rad in die neue Richtung drehen", "nach links und rechts schauen und über die Straße fahren"]
                hints:
                  - "Beim indirekten Abbiegen fährst du zuerst so, als wolltest du gar nicht abbiegen."
                  - "Erst geradeaus, dann anhalten. Über die Straße fährst du zuletzt."
                  - "Geradeaus, anhalten, drehen, schauen und fahren."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Mira biegt indirekt links ab. Wohin fährt sie zuerst?"
                options: ["geradeaus über die Kreuzung, rechts am Rand", "in die Mitte der Straße", "auf den Gehweg"]
                answer: "geradeaus über die Kreuzung, rechts am Rand"
                hints:
                  - "Indirekt heißt: nicht in die Mitte."
                  - "Mira bleibt rechts."
                  - "Geradeaus über die Kreuzung."
              - id: l2-f3
                type: true_false
                text: "Beim indirekten Linksabbiegen fährst du nicht in die Mitte der Straße. Stimmt das?"
                answer: true
                hints:
                  - "Wo bleibt Mira beim indirekten Abbiegen?"
                  - "Sie bleibt die ganze Zeit rechts am Rand."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: sorting
                text: "Direkt abbiegen oder lieber indirekt? Sortiere."
                bins:
                  - { id: direct, show: { text: "direkt abbiegen" }, say: "direkt abbiegen" }
                  - { id: indirect, show: { text: "indirekt abbiegen oder schieben" }, say: "indirekt abbiegen oder schieben" }
                options:
                  - { text: "eine ruhige Straße, kein Auto zu sehen", bin: direct }
                  - { text: "eine kleine Straße in der Siedlung", bin: direct }
                  - { text: "eine große Kreuzung mit zwei Spuren", bin: indirect }
                  - { text: "viele Lastwagen und Busse", bin: indirect }
                hints:
                  - "Frag dich: Wie viel Verkehr ist dort?"
                  - "Bei viel Verkehr und mehreren Spuren ist indirekt sicherer."
                  - "Ruhige und kleine Straße: direkt. Große Kreuzung und viele Lastwagen: indirekt."
              - id: l2-f5
                type: multiple_choice
                text: "Mira schiebt ihr Rad über den Zebrastreifen. Was ist sie jetzt?"
                options: ["eine Fußgängerin", "eine Autofahrerin", "eine Radfahrerin auf der Straße"]
                answer: "eine Fußgängerin"
                hints:
                  - "Mira sitzt nicht mehr auf dem Rad."
                  - "Wer sein Rad schiebt, geht zu Fuß."
                  - "Eine Fußgängerin."
              - id: l2-f6
                type: text_input
                text: "Mira biegt indirekt links ab. Erst fährt sie über die Kreuzung, dann über die andere Straße. Wie oft fährt sie dabei geradeaus über eine Straße?"
                answer: "2"
                hints:
                  - "Zähl die Straßen, über die Mira fährt."
                  - "Einmal über die Kreuzung, einmal nach dem Drehen."
                  - "Zweimal."

          - support: some
            tasks:
              - id: l2-s1
