# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.germany-eu
skill: world.society.germany-eu
curriculum: de-DE
language: de
title:
  de: Deutschland und Europa
  en: Germany and Europe
summary: >
  Mila lives in Köln, her cousin Jonas in München, and Mila already has
  her summer holidays while Jonas is still at school. Lesson 1 explains
  why: Germany is made of 16 Länder, each with its own capital and
  government, and the Länder decide about their schools, so the holidays
  differ. Berlin is the capital of Germany, where the Bundestag sits;
  Berlin, Hamburg and Bremen are city states; six Land capitals are
  taught (Düsseldorf, not Köln, for Nordrhein-Westfalen). The child places
  a town inside its Land, Germany, Europe and the world. Lesson 2 follows
  Mila's family on holiday in Austria: Germany belongs to the European
  Union, more than twenty countries that work together and keep the peace;
  people from one EU country may live, learn and work in another; many but
  not all pay with the euro (Poland pays with the złoty); not every
  European country is in the EU (Switzerland, Norway, the United Kingdom);
  of Germany's nine neighbours, all but Switzerland are in it; the people
  of all EU countries elect the European Parliament. It ends with the
  skill check. The number of member states is left out on purpose, as it
  can change; no politicians, parties or current issues.
metadata:
  year: klasse-4
  topic: { de: Mitbestimmen, en: Having a say }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.society.democracy-vote]
  also_practises: []
  vocabulary: { de: [Deutschland, Bundesland, Landeshauptstadt, Hauptstadt, Landesregierung, Stadtstaat, Europa, Europäische Union, EU, Euro, Nachbarland, Europäisches Parlament, Europaflagge, Frieden] }
  forms: [text, audio, picture, drawn]
  drawn: [coins]
  facets: []
  parts:
    - { id: laender, what: { de: "Deutschland als Land mit 16 Bundesländern beschreiben: Hauptstadt, Landeshauptstädte, Stadtstaaten, was die Länder bestimmen", en: "describing Germany as a country of 16 Länder: the capital, Land capitals, city states, what the Länder decide" } }
    - { id: nest, what: { de: "den Wohnort in Bundesland, Deutschland, Europa und Welt einordnen", en: "placing a home town within its Land, Germany, Europe and the world" } }
    - { id: eu, what: { de: "erklären, was die EU ist, wer dazugehört und was sie für die Menschen bedeutet", en: "explaining what the EU is, who belongs to it and what it means for people" } }
  misconceptions:
    - id: biggest-is-capital
      what: Thinks the biggest city of a Land is always its capital (Köln for Nordrhein-Westfalen, Frankfurt for Hessen)
      addressed: "lesson 1 Learn screen on Land capitals; l1-f2, l1-s1, l1-n4 and l2-c3"
    - id: eu-is-euro
      what: Thinks every EU country pays with the euro, or that the EU is one country with one language
      addressed: "lesson 2 Learn names Poland and its złoty and says the countries stay countries; l2-f3, l2-s2, l2-s5 and l2-c13"
    - id: europe-is-eu
      what: Thinks every country in Europe is in the EU
      addressed: "lesson 2 Learn names Switzerland, Norway and the United Kingdom; l2-f2, l2-s4, l2-n1 and l2-c14, l2-c20"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "16 Länder, ein Deutschland", en: "16 Länder, one Germany" }
    goal:
      de: "Finde heraus, wie Deutschland aus 16 Bundesländern besteht und warum Mila früher Ferien hat als Jonas."
      en: "Find out how Germany is made of 16 federal states and why Mila's holidays start before Jonas's."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wen wählen die Erwachsenen bei der Bundestagswahl?"
            options: ["Abgeordnete für ganz Deutschland", "die Klassensprecherin", "einen König"]
            answer: "Abgeordnete für ganz Deutschland"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Im Bundestag entscheidet die Mehrheit. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mila wohnt in Köln und hat schon Sommerferien. Ihr Cousin Jonas wohnt in München und muss noch zur Schule.\n\nWie kann das sein?"
            say: "Mila wohnt in Köln. Sie hat schon Sommerferien. Ihr Cousin Jonas wohnt in München. Er muss noch drei Wochen zur Schule gehen. Was glaubst du: Wie kann das sein? Beide wohnen doch in Deutschland!"
            show: { object: map }
          - text: "Deutschland besteht aus 16 Bundesländern. Köln liegt in Nordrhein-Westfalen, München in Bayern."
            say: "Deutschland ist ein Land, das aus sechzehn Bundesländern besteht. Köln liegt im Bundesland Nordrhein-Westfalen. München liegt im Bundesland Bayern. Mila und Jonas wohnen also in verschiedenen Bundesländern."
          - text: "Jedes Bundesland hat eine eigene Regierung. Die Länder bestimmen zum Beispiel über ihre Schulen. Darum beginnen die Ferien nicht überall am selben Tag."
            say: "Jedes Bundesland hat ein eigenes Parlament und eine eigene Regierung. Die Länder bestimmen zum Beispiel über ihre Schulen und über die Ferien. Darum beginnen die Sommerferien nicht überall in Deutschland am selben Tag. In Nordrhein-Westfalen waren sie dieses Mal früher dran als in Bayern."
          - text: "Jedes Bundesland hat eine Landeshauptstadt:\nNordrhein-Westfalen: Düsseldorf\nBayern: München\nNiedersachsen: Hannover\nSachsen: Dresden\nBaden-Württemberg: Stuttgart\nHessen: Wiesbaden"
            say: "Jedes Bundesland hat eine Landeshauptstadt. Dort arbeitet die Regierung des Landes. Hier sind sechs davon. Nordrhein-Westfalen: Düsseldorf. Bayern: München. Niedersachsen: Hannover. Sachsen: Dresden. Baden-Württemberg: Stuttgart. Hessen: Wiesbaden. Aufgepasst: Die größte Stadt ist nicht immer die Hauptstadt. In Nordrhein-Westfalen ist Köln am größten, aber die Landeshauptstadt ist Düsseldorf."
          - text: "Berlin ist die Hauptstadt von Deutschland. Berlin, Hamburg und Bremen sind Stadtstaaten: eine Stadt, die ein ganzes Bundesland ist."
            say: "Die Hauptstadt von ganz Deutschland ist Berlin. Dort sitzen der Bundestag und die Bundesregierung. Berlin ist außerdem ein eigenes Bundesland, genau wie Hamburg und Bremen. Solche Bundesländer heißen Stadtstaaten. Zum Land Bremen gehört noch eine zweite Stadt, Bremerhaven."
          - text: "Köln liegt in Nordrhein-Westfalen.\nNordrhein-Westfalen liegt in Deutschland.\nDeutschland liegt in Europa.\nEuropa ist ein Teil der Welt."
            say: "Wo wohnt Mila genau? Vom Kleinen zum Großen: Mila wohnt in Köln. Köln liegt in Nordrhein-Westfalen. Nordrhein-Westfalen liegt in Deutschland. Deutschland liegt in Europa. Und Europa ist ein Teil der Welt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Aus wie vielen Bundesländern besteht Deutschland?"
                options: ["16", "12", "50"]
                answer: "16"
                hints:
                  - "Es sind mehr als zehn, aber weniger als zwanzig."
                  - "Denk an Mila und Jonas: zwei davon heißen Nordrhein-Westfalen und Bayern. Es gibt noch viele mehr."
                  - "Es sind 16 Bundesländer."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Welche Landeshauptstadt gehört zu welchem Bundesland? Verbinde."
                pairs:
                  - { left: { text: "Nordrhein-Westfalen" }, right: { text: "Düsseldorf" } }
                  - { left: { text: "Bayern" }, right: { text: "München" } }
                  - { left: { text: "Niedersachsen" }, right: { text: "Hannover" } }
                  - { left: { text: "Sachsen" }, right: { text: "Dresden" } }
                hints:
                  - "Fang mit dem an, was du sicher weißt: Jonas wohnt in der Landeshauptstadt von Bayern."
                  - "Pass bei Sachsen und Niedersachsen auf. Die Landeshauptstadt von Niedersachsen fängt mit H an."
                  - "Nordrhein-Westfalen: Düsseldorf. Bayern: München. Niedersachsen: Hannover. Sachsen: Dresden."
              - id: l1-f3
                type: true_false
                text: "Mila und Jonas wohnen in verschiedenen Bundesländern. Darum haben sie nicht zur selben Zeit Sommerferien.\n\nKann das sein?"
                answer: true
                hints:
                  - "Wer bestimmt über die Schulen?"
                  - "Jedes Bundesland bestimmt selbst über seine Schulen und Ferien."
                  - "Ja, das kann sein."
              - id: l1-f4
                type: ordering
                text: "Wo wohnt Mila? Bring es in die Reihenfolge, vom Kleinen zum Großen."
                options: ["Deutschland", "Köln", "Europa", "Nordrhein-Westfalen"]
                slot_count: 4
                answer: ["Köln", "Nordrhein-Westfalen", "Deutschland", "Europa"]
                hints:
                  - "Fang mit dem Kleinsten an: der Stadt, in der Mila wohnt."
                  - "Die Stadt liegt in einem Bundesland, das Bundesland in einem Land."
                  - "Köln, Nordrhein-Westfalen, Deutschland, Europa."
              - id: l1-f5
                type: multiple_choice
                text: "Was ist die Hauptstadt von Deutschland?"
                options: ["Berlin", "Hamburg", "München"]
                answer: "Berlin"
                hints:
                  - "In der Hauptstadt sitzt der Bundestag."
                  - "Diese Stadt ist auch ein eigenes Bundesland, ein Stadtstaat."
                  - "Berlin."
              - id: l1-f6
                type: sorting
                text: "Ist die Stadt ein ganzes Bundesland? Sortiere."
                bins:
                  - { id: staat, show: { text: "Stadtstaat" }, say: "Stadtstaat" }
                  - { id: stadt, show: { text: "Stadt in einem Bundesland" }, say: "Stadt in einem Bundesland" }
                options:
                  - { text: "Hamburg", bin: staat }
                  - { text: "Berlin", bin: staat }
                  - { text: "München", bin: stadt }
                  - { text: "Köln", bin: stadt }
                hints:
                  - "Es gibt drei Stadtstaaten."
                  - "München liegt in Bayern, Köln in Nordrhein-Westfalen."
                  - "Hamburg und Berlin sind Stadtstaaten."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Köln liegt im Bundesland _. Die Landeshauptstadt dort ist _."
                options: ["Nordrhein-Westfalen", "Bayern", "Düsseldorf", "Köln"]
                answer: ["Nordrhein-Westfalen", "Düsseldorf"]
                hints: ["Die größte Stadt ist nicht immer die Landeshauptstadt."]
              - id: l1-s2
                type: true_false
                text: "In allen Bundesländern beginnen die Sommerferien in derselben Woche. Stimmt das?"
                answer: false
                hints: ["Denk an Mila in Köln und Jonas in München."]
              - id: l1-s3
                type: multiple_choice
                text: "In welcher Stadt sitzt der Bundestag?"
                options: ["in Berlin", "in Köln", "in Dresden"]
                answer: "in Berlin"
                hints: ["Der Bundestag sitzt in der Hauptstadt von Deutschland."]
              - id: l1-s4
                type: ordering
                text: "Wo wohnt Jonas? Bring es in die Reihenfolge, vom Kleinen zum Großen."
                options: ["Bayern", "Europa", "München", "Deutschland"]
                slot_count: 4
                answer: ["München", "Bayern", "Deutschland", "Europa"]
                hints: ["Fang mit der Stadt an, dann kommt das Bundesland."]
              - id: l1-s5
                type: true_false
                text: "Hamburg ist eine Stadt und gleichzeitig ein Bundesland. Stimmt das?"
                answer: true
                hints: ["Berlin, Hamburg und Bremen heißen Stadtstaaten."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Deutschland hat 16 Bundesländer. 3 davon sind Stadtstaaten. Wie viele Bundesländer sind keine Stadtstaaten?"
                answer: "13"
              - id: l1-n2
                type: matching
                text: "Welche Landeshauptstadt gehört zu welchem Bundesland? Verbinde."
                pairs:
                  - { left: { text: "Baden-Württemberg" }, right: { text: "Stuttgart" } }
                  - { left: { text: "Hessen" }, right: { text: "Wiesbaden" } }
                  - { left: { text: "Nordrhein-Westfalen" }, right: { text: "Düsseldorf" } }
              - id: l1-n3
                type: multiple_choice
                text: "Was hat jedes Bundesland?"
                options: ["eine Landeshauptstadt und eine eigene Regierung", "einen eigenen König", "eine eigene Sprache"]
                answer: "eine Landeshauptstadt und eine eigene Regierung"
              - id: l1-n4
                type: true_false
                text: "Köln ist die Landeshauptstadt von Nordrhein-Westfalen. Stimmt das?"
                answer: false
              - id: l1-n5
                type: sorting
                text: "Ist die Stadt ein ganzes Bundesland? Sortiere."
                bins:
                  - { id: staat, show: { text: "Stadtstaat" }, say: "Stadtstaat" }
                  - { id: stadt, show: { text: "Stadt in einem Bundesland" }, say: "Stadt in einem Bundesland" }
                options:
                  - { text: "Bremen", bin: staat }
                  - { text: "Berlin", bin: staat }
                  - { text: "Dresden", bin: stadt }
                  - { text: "Stuttgart", bin: stadt }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Bundesländer hat Deutschland?"
            options: ["6", "16", "60"]
            answer: "16"
          - id: l1-c2
            type: true_false
            text: "Berlin ist die Hauptstadt von Deutschland. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Welche Stadt ist die Landeshauptstadt von Bayern?"
            options: ["München", "Köln", "Hamburg"]
            answer: "München"
          - id: l1-c4
            type: ordering
            text: "Bring es in die Reihenfolge, vom Kleinen zum Großen."
            options: ["Sachsen", "Europa", "Deutschland", "Dresden"]
            slot_count: 4
            answer: ["Dresden", "Sachsen", "Deutschland", "Europa"]
          - id: l1-c5
            type: true_false
            text: "In ganz Deutschland beginnen die Sommerferien am selben Tag. Stimmt das?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Welche drei Bundesländer sind Stadtstaaten?"
            options: ["Berlin, Hamburg und Bremen", "Berlin, München und Köln", "Bayern, Sachsen und Hessen"]
            answer: "Berlin, Hamburg und Bremen"

  - n: 2
    title: { de: "Deutschland in der EU", en: "Germany in the EU" }
    goal:
      de: "Finde heraus, was die Europäische Union ist und warum Mila in Österreich mit Euro bezahlen kann."
      en: "Find out what the European Union is and why Mila can pay with euros in Austria."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Mila wohnt in Köln. In welchem Bundesland liegt Köln?"
            options: ["Nordrhein-Westfalen", "Bayern", "Sachsen"]
            answer: "Nordrhein-Westfalen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Jedes Bundesland hat eine Landeshauptstadt. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Milas Familie fährt in den Ferien nach Österreich. Mila will dort ein Eis kaufen.\n\nMuss sie vorher ihr Geld umtauschen?"
            say: "In den Ferien fährt Milas Familie nach Österreich. Mila hat ihr Taschengeld dabei und will dort ein Eis kaufen. Was glaubst du: Muss sie ihr Geld vorher in anderes Geld umtauschen?"
            show: { drawn: coins, values: [200, 100, 50] }
          - text: "Nein! In Österreich bezahlt man auch mit dem Euro. Beide Länder gehören zur Europäischen Union, kurz EU."
            say: "Nein, muss sie nicht! In Österreich bezahlt man auch mit dem Euro, genau wie in Deutschland. Deutschland und Österreich gehören beide zur Europäischen Union. Kurz sagt man EU."
          - text: "In der EU arbeiten mehr als zwanzig Länder aus Europa zusammen. Sie wollen, dass in Europa Frieden bleibt."
            say: "In der EU haben sich mehr als zwanzig Länder aus Europa zusammengetan. Früher gab es zwischen den Ländern in Europa viele Kriege. Heute arbeiten sie zusammen und wollen, dass Frieden bleibt. Jedes Land bleibt dabei ein eigenes Land, mit seiner eigenen Sprache."
          - text: "Menschen aus EU-Ländern dürfen in jedem anderen EU-Land wohnen, lernen und arbeiten."
            say: "Die EU macht vieles leichter. Menschen aus einem EU-Land dürfen in jedem anderen EU-Land wohnen, lernen und arbeiten. Zofias Mama kommt zum Beispiel aus Polen und arbeitet als Krankenpflegerin in Köln. Auch Waren können ohne Zoll von einem EU-Land ins andere."
          - text: "In vielen EU-Ländern bezahlt man mit dem Euro, aber nicht in allen. In Polen bezahlt man mit dem Złoty."
            say: "In vielen EU-Ländern bezahlt man mit dem Euro, aber nicht in allen. Polen gehört zum Beispiel zur EU, aber dort bezahlt man mit dem Złoty."
          - text: "Nicht jedes Land in Europa ist in der EU, zum Beispiel die Schweiz, Norwegen und Großbritannien."
            say: "Nicht jedes Land in Europa gehört zur EU. Die Schweiz und Norwegen sind nicht dabei. Großbritannien war früher in der EU und ist ausgetreten. Deutschland hat neun Nachbarländer: Dänemark, Polen, Tschechien, Österreich, die Schweiz, Frankreich, Luxemburg, Belgien und die Niederlande. Alle außer der Schweiz sind in der EU."
          - text: "Die Menschen in allen EU-Ländern wählen zusammen das Europäische Parlament."
            say: "Alle fünf Jahre wählen die Menschen in allen EU-Ländern zusammen das Europäische Parlament. Dort beraten Abgeordnete aus allen EU-Ländern und stimmen ab, ähnlich wie im Bundestag."
          - text: "Wusstest du? Die Europaflagge hat immer 12 Sterne, egal wie viele Länder in der EU sind."
            say: "Wusstest du? Die Europaflagge ist blau und hat einen Kreis aus zwölf goldenen Sternen. Die Zahl zwölf ändert sich nie, egal wie viele Länder gerade in der EU sind. Die Sterne im Kreis stehen für Einheit und Zusammenhalt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Mila kauft in Österreich ein Eis. Womit bezahlt sie?"
                show: { drawn: coins, values: [100, 50, 20] }
                options: ["mit Euro", "mit Złoty", "mit Muscheln"]
                answer: "mit Euro"
                feedback:
                  "mit Muscheln": "Mit Muscheln hat man vor sehr langer Zeit an manchen Orten bezahlt. In Österreich nimmt die Eisdiele Euro!"
                hints:
                  - "Österreich und Deutschland sind beide in der EU."
                  - "Mila muss ihr Geld nicht umtauschen. In beiden Ländern gilt dasselbe Geld."
                  - "Mit Euro."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "In der EU oder nicht? Sortiere."
                bins:
                  - { id: eu, show: { text: "in der EU" }, say: "in der EU" }
                  - { id: nicht, show: { text: "nicht in der EU" }, say: "nicht in der EU" }
                options:
                  - { text: "Frankreich", bin: eu }
                  - { text: "Österreich", bin: eu }
                  - { text: "die Schweiz", bin: nicht }
                  - { text: "Norwegen", bin: nicht }
                hints:
                  - "Nicht jedes Land in Europa ist in der EU."
                  - "Von Deutschlands Nachbarländern ist nur eines nicht in der EU."
                  - "Frankreich und Österreich sind in der EU, die Schweiz und Norwegen nicht."
              - id: l2-f3
                type: true_false
                text: "In allen Ländern der EU bezahlt man mit dem Euro. Stimmt das?"
                answer: false
                hints:
                  - "Denk an Zofias Mama und ihr Heimatland."
                  - "Polen ist in der EU. Womit bezahlt man dort?"
                  - "Nein, in Polen bezahlt man mit dem Złoty."
              - id: l2-f4
                type: matching
                text: "Was gehört zusammen? Verbinde."
                pairs:
                  - { left: { text: "EU" }, right: { text: "viele Länder in Europa, die zusammenarbeiten" } }
                  - { left: { text: "Euro" }, right: { text: "das Geld in vielen EU-Ländern" } }
                  - { left: { text: "Europäisches Parlament" }, right: { text: "wird von den Menschen in allen EU-Ländern gewählt" } }
                  - { left: { text: "Europaflagge" }, right: { text: "blau mit zwölf goldenen Sternen" } }
                hints:
                  - "Fang mit dem an, was du sicher weißt."
                  - "Ein Parlament wird gewählt, ein Geld wird zum Bezahlen gebraucht."
                  - "EU: viele Länder. Euro: Geld. Parlament: wird gewählt. Flagge: zwölf Sterne."
              - id: l2-f5
                type: multiple_choice
                text: "Warum haben sich die Länder der EU zusammengetan?"
                options: ["damit in Europa Frieden bleibt und sie besser zusammenarbeiten", "damit alle dieselbe Sprache sprechen", "damit es nur noch ein einziges Land gibt"]
                answer: "damit in Europa Frieden bleibt und sie besser zusammenarbeiten"
                hints:
                  - "Früher gab es in Europa viele Kriege."
                  - "Jedes Land behält seine Sprache und bleibt ein eigenes Land."
                  - "Für Frieden und Zusammenarbeit."
              - id: l2-f6
                type: text_input
                text: "Deutschland hat 9 Nachbarländer. Nur die Schweiz ist nicht in der EU. Wie viele Nachbarländer sind in der EU?"
                answer: "8"
                hints:
                  - "Von allen Nachbarländern fehlt eines in der EU."
                  - "Rechne 9 minus 1."
                  - "9 − 1 = 8"

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Zofias Mama kommt aus Polen. Sie darf in Deutschland wohnen und arbeiten, weil beide Länder in der EU sind. Stimmt das?"
                answer: true
                hints: ["Menschen aus einem EU-Land dürfen in jedem anderen EU-Land wohnen, lernen und arbeiten."]
              - id: l2-s2
                type: multiple_choice
                text: "Polen ist in der EU. Womit bezahlt man dort?"
                options: ["mit dem Złoty", "mit dem Euro", "mit Gummibärchen"]
                answer: "mit dem Złoty"
                hints: ["Nicht alle EU-Länder haben den Euro."]
              - id: l2-s3
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Deutschland gehört zur _. Ihre Flagge ist blau und hat _ goldene Sterne."
                options: ["Europäischen Union", "Schweiz", "12", "16"]
                answer: ["Europäischen Union", "12"]
                hints: ["16 ist die Zahl der Bundesländer. Die Sterne der Europaflagge sind weniger."]
              - id: l2-s4
                type: multiple_choice
                text: "Welches Nachbarland von Deutschland ist nicht in der EU?"
                options: ["die Schweiz", "Frankreich", "Österreich"]
                answer: "die Schweiz"
                hints: ["Mila bezahlt in diesem Land nicht mit Euro, und es ist nicht in der EU."]
              - id: l2-s5
                type: true_false
                text: "Die EU ist ein einziges großes Land, in dem alle dieselbe Sprache sprechen. Stimmt das?"
                answer: false
                hints: ["In der EU arbeiten viele Länder zusammen. Jedes bleibt ein eigenes Land."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "In der EU oder nicht? Sortiere."
                bins:
                  - { id: eu, show: { text: "in der EU" }, say: "in der EU" }
                  - { id: nicht, show: { text: "nicht in der EU" }, say: "nicht in der EU" }
                options:
                  - { text: "Belgien", bin: eu }
