# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.conductors
skill: world.nature.conductors
curriculum: de-DE
language: de
title:
  de: Leiter und Nichtleiter
  en: Conductors and insulators
summary: >
  Lina and her friend Can become material testers with Opa Theo's test
  circuit: a battery, a bulb and a gap between two wires. Lesson 1 opens
  with a paper clip in the gap (the bulb lights) and then a rubber (it
  stays dark). Metals such as iron, copper and aluminium conduct;
  wood, plastic, rubber, glass, paper and cloth do not and are called
  Nichtleiter or Isolatoren. Colour, shine and shape say nothing; the
  material decides. The child predicts each test before seeing it. Lesson
  2 cuts open an old cable: copper wires inside, a plastic sleeve outside,
  so the current stays in the cable; plugs have metal pins and a plastic
  grip. Tap water and the human body barely show in the bulb test, but
  both carry the strong current from the socket, so wet hands and broken
  cables are dangerous. It ends with the skill check. The test circuit
  is drawn with the thing in its gap; where the child predicts, the bulb
  shows a question mark. The test with real material stays in class or at home with an adult and a battery.
metadata:
  year: klasse-4
  topic: { de: Feuer und Strom, en: Fire and electricity }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.nature.electric-circuit, world.nature.materials-sort]
  also_practises: [world.nature.electric-circuit]
  vocabulary: { de: [Leiter, Nichtleiter, Isolator, leiten, Metall, Eisen, Kupfer, Aluminium, Alufolie, Kunststoff, Gummi, Holz, Glas, Lücke, Prüfstrecke, Hülle, Draht, Stecker, Graphit] }
  forms: [text, audio, picture, drawn]
  drawn: [circuit]
  facets: []
  parts:
    - { id: predict, what: { de: "vorhersagen, ob ein Ding oder ein Stoff den Strom leitet", en: "predicting whether a thing or a material conducts" } }
    - { id: test, what: { de: "erklären, wie man mit dem Stromkreis prüft, und das Ergebnis deuten", en: "explaining how to test with the circuit and reading the result" } }
    - { id: insulation, what: { de: "erklären, warum Kabel und Stecker Leiter und Nichtleiter haben und was das für die Sicherheit heißt", en: "explaining why cables and plugs have both conductors and insulators and what that means for safety" } }
  misconceptions:
    - id: looks-decide
      what: Decides by colour, shine or shape whether a thing conducts, not by its material
      addressed: "the lesson 1 screen on testing; l1-f6, l1-s2 and l2-c7"
    - id: hard-things-conduct
      what: Thinks every hard or solid thing (stone, glass, wood) conducts like metal
      addressed: "lesson 1 Learn lists glass and wood as Nichtleiter; l1-s3, l1-n5 and l2-c6"
    - id: body-water-safe
      what: Thinks water and the human body do not carry electricity because the bulb test barely shows it
      addressed: "the lesson 2 screen on water and the body; l2-f3, l2-s3, l2-n4 and l2-c19, l2-c20"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Leitet es den Strom?", en: "Does it conduct?" }
    goal:
      de: "Sag vorher, welche Dinge den Strom leiten, und prüf es mit dem Stromkreis. Eine Büroklammer aus Metall leitet zum Beispiel."
      en: "Predict which things conduct electricity and test it with the circuit. A metal paper clip, for example, conducts."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Woraus ist diese Büroklammer?"
            show: { object: paper-clip }
            options: ["aus Metall", "aus Holz", "aus Glas"]
            answer: "aus Metall"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Hat ein Stromkreis eine Lücke, bleibt das Lämpchen dunkel. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Im Stromkreis ist eine Lücke. Lina legt eine Büroklammer hinein.\n\nWas glaubst du: Leuchtet das Lämpchen?"
            say: "Opa Theo hat einen Prüf-Stromkreis gebaut: eine Batterie, ein Lämpchen und zwischen zwei Kabeln eine Lücke. Lina und ihr Freund Can sind heute Stofftester. Lina legt eine Büroklammer in die Lücke, so dass sie beide Kabel berührt. Was glaubst du: Leuchtet das Lämpchen?"
            show: { drawn: circuit, switch: false, gap: { label: Büroklammer, object: paper-clip, conductor: true }, bulb: "?" }
          - text: "Ja! Die Büroklammer schließt die Lücke. Sie leitet den Strom."
            say: "Das Lämpchen leuchtet! Die Büroklammer ist aus Metall. Sie schließt die Lücke, und der Strom fließt durch sie hindurch. Ein Stoff, der den Strom durchlässt, heißt Leiter."
            show: { drawn: circuit, switch: false, gap: { label: Büroklammer, object: paper-clip, conductor: true } }
          - text: "Can legt einen Radiergummi in die Lücke. Das Lämpchen bleibt dunkel."
            say: "Jetzt ist Can dran. Er legt einen Radiergummi in die Lücke. Das Lämpchen bleibt dunkel. Der Radiergummi lässt den Strom nicht durch. Er ist ein Nichtleiter. Ein anderes Wort dafür ist Isolator."
            show: { drawn: circuit, switch: false, gap: { label: Radiergummi, object: rubber, conductor: false } }
          - text: "Leiter: Metalle wie Eisen, Kupfer und Aluminium.\nNichtleiter: Holz, Kunststoff, Gummi, Glas, Papier und Stoff."
            say: "Die beiden testen weiter. Alles aus Metall leitet: Eisen, Kupfer, Aluminium, auch Alufolie, ein Schlüssel oder eine Münze. Holz, Kunststoff, Gummi, Glas, Papier und Stoff leiten nicht. Auch ein Stein lässt das Lämpchen dunkel."
          - text: "So prüfst du: Ding in die Lücke legen. Leuchtet das Lämpchen, ist es ein Leiter."
            say: "So gehen Stofftester vor: Erst sagen sie vorher, was passiert. Dann legen sie das Ding in die Lücke. Leuchtet das Lämpchen, ist es ein Leiter. Bleibt es dunkel, ist es ein Nichtleiter. Die Farbe, ob etwas glänzt oder ob es rund ist, sagt dir nichts. Es kommt nur auf den Stoff an."
          - text: "Wusstest du? Die Mine eines Bleistifts leitet Strom, obwohl sie nicht aus Metall ist."
            say: "Wusstest du? Die Mine eines Bleistifts leitet Strom, obwohl sie nicht aus Metall ist. Sie ist aus Graphit, einer besonderen Form von Kohlenstoff. Das Holz um die Mine herum leitet aber nicht."
            show: { object: pencil }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Lina will die Lücke schließen. Womit leuchtet das Lämpchen?"
                options: [{ object: paper-clip }, { object: sock }, { object: book }]
                answer: paper-clip
                feedback:
                  sock: "Eine Socke als Kabel? Stoff leitet den Strom nicht. Die Büroklammer aus Metall schließt die Lücke."
                hints:
                  - "Woraus ist jedes Ding?"
                  - "Metall leitet den Strom, Stoff und Papier nicht."
                  - "Die Büroklammer."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Leiter oder Nichtleiter? Sortiere."
                bins:
                  - { id: yes, show: { text: "Leiter" }, say: "Leiter" }
                  - { id: no, show: { text: "Nichtleiter" }, say: "Nichtleiter" }
                options:
                  - { object: spoon, bin: yes }
                  - { object: ring, bin: yes }
                  - { object: fork, bin: yes }
                  - { object: sock, bin: no }
                  - { object: feather, bin: no }
                  - { object: rubber, bin: no }
                hints:
                  - "Frag bei jedem Ding: Ist es aus Metall?"
                  - "Löffel, Ring und Gabel sind aus Metall. Socke, Feder und Radiergummi nicht."
                  - "Leiter: Löffel, Ring, Gabel. Nichtleiter: Socke, Feder, Radiergummi."
              - id: l1-f3
                type: true_false
                text: "Can legt einen Holzlöffel in die Lücke.\n\nLeuchtet das Lämpchen?"
                show: { drawn: circuit, switch: false, gap: { label: Holzlöffel, conductor: false }, bulb: "?" }
                answer: false
                hints:
                  - "Woraus ist ein Holzlöffel?"
                  - "Holz ist ein Nichtleiter."
                  - "Nein, das Lämpchen bleibt dunkel."
              - id: l1-f4
                type: multiple_choice
                text: "Woran erkennst du beim Test einen Leiter?"
                options: ["Das Lämpchen leuchtet.", "Das Ding wird nass.", "Das Ding wird rot."]
                answer: "Das Lämpchen leuchtet."
                hints:
                  - "Ein Leiter lässt den Strom durch."
                  - "Fließt Strom im Kreis, was macht dann das Lämpchen?"
                  - "Das Lämpchen leuchtet."
              - id: l1-f5
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Metalle _ den Strom. Holz und Kunststoff leiten ihn _."
                options: ["leiten", "nicht", "essen", "doppelt"]
                answer: ["leiten", "nicht"]
                hints:
                  - "Die Büroklammer hat das Lämpchen zum Leuchten gebracht, der Radiergummi nicht."
                  - "Metall ist ein Leiter, Holz und Kunststoff sind Nichtleiter."
                  - "leiten, nicht"
              - id: l1-f6
                type: multiple_choice
                text: "Can sagt: „Der Knopf ist schwarz, also leitet er nicht.“ Hat er recht?"
                options: ["Nein, die Farbe sagt nichts. Es kommt auf den Stoff an.", "Ja, schwarze Dinge leiten nie.", "Ja, nur weiße Dinge leiten."]
                answer: "Nein, die Farbe sagt nichts. Es kommt auf den Stoff an."
                hints:
                  - "Was entscheidet, ob etwas leitet?"
                  - "Ein schwarzer Knopf kann aus Metall oder aus Kunststoff sein."
                  - "Nein, nur der Stoff entscheidet."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Can testet seine Fundsachen. Leiter oder Nichtleiter? Sortiere."
                bins:
                  - { id: yes, show: { text: "Leiter" }, say: "Leiter" }
                  - { id: no, show: { text: "Nichtleiter" }, say: "Nichtleiter" }
                options:
                  - { object: tin-foil, bin: yes }
                  - { object: key, bin: yes }
                  - { text: "eine Münze", bin: yes }
                  - { text: "ein Holzlineal", bin: no }
                  - { text: "ein Plastikbecher", bin: no }
                  - { object: rubber-band, bin: no }
                hints: ["Alufolie, Schlüssel und Münzen sind aus Metall."]
              - id: l1-s2
                type: true_false
                text: "Alles, was glänzt, leitet den Strom. Stimmt das?"
                answer: false
                hints: ["Auch Glas und manche Kunststoffe glänzen. Leiten sie?"]
              - id: l1-s3
                type: multiple_choice
                text: "Can legt einen Holzstab in die Lücke. Was passiert?"
                show: { drawn: circuit, switch: false, gap: { label: Holzstab, conductor: false }, bulb: "?" }
                options: ["Das Lämpchen bleibt dunkel.", "Das Lämpchen leuchtet hell.", "Der Holzstab wird zu Metall."]
                answer: "Das Lämpchen bleibt dunkel."
                hints: ["Holz ist hart, aber ist es ein Leiter?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Was ist ein Nichtleiter?"
                options: [{ object: rubber }, { object: spoon }, { object: bell }]
                answer: rubber
                hints: ["Löffel und Glocke sind aus Metall."]
              - id: l1-s5
                type: multiple_choice
                text: "Wie heißt ein Nichtleiter noch?"
                options: ["Isolator", "Batterie", "Schalter"]
                answer: "Isolator"
                hints: ["Das Wort kommt auch beim Radiergummi vor."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Leiter oder Nichtleiter? Sortiere."
                bins:
                  - { id: yes, show: { text: "Leiter" }, say: "Leiter" }
                  - { id: no, show: { text: "Nichtleiter" }, say: "Nichtleiter" }
                options:
                  - { object: bell, bin: yes }
                  - { object: anchor, bin: yes }
                  - { object: paper-clip, bin: yes }
                  - { object: book, bin: no }
                  - { object: leaf, bin: no }
                  - { object: teddy, bin: no }
              - id: l1-n2
                type: true_false
                text: "Lina legt ihren Ring aus Gold in die Lücke.\n\nLeuchtet das Lämpchen?"
                show: { drawn: circuit, switch: false, gap: { label: Goldring, object: ring, conductor: true }, bulb: "?" }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Welcher Stoff leitet den Strom?"
                options: ["Kupfer", "Gummi", "Glas"]
                answer: "Kupfer"
              - id: l1-n4
                type: multiple_choice
                text: "In der Lücke liegt eine Gabel. Ihre Zinken sind aus Metall, ihr Griff aus Kunststoff. Lina hält beide Kabel an die Zinken. Leuchtet das Lämpchen?"
                options: ["Ja, die Zinken sind aus Metall.", "Nein, der Griff ist aus Kunststoff.", "Nur, wenn die Gabel frisch gespült ist."]
                answer: "Ja, die Zinken sind aus Metall."
                difficulty: stretch
              - id: l1-n5
                type: multiple_choice
                text: "Can hat einen Kieselstein getestet. Das Lämpchen blieb dunkel. Was weiß er jetzt?"
                options: ["Der Kieselstein ist ein Nichtleiter.", "Der Kieselstein ist ein Leiter.", "Die Batterie ist aus Stein."]
                answer: "Der Kieselstein ist ein Nichtleiter."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was leitet den Strom?"
            options: ["ein Nagel aus Eisen", "ein Radiergummi", "eine Feder"]
            answer: "ein Nagel aus Eisen"
          - id: l1-c2
            type: true_false
            text: "Kunststoff leitet den Strom gut. Stimmt das?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was ist ein Leiter?"
            options: ["ein Stoff, der den Strom durchlässt", "ein Stoff, der den Strom aufhält", "ein Stoff, der von selbst leuchtet"]
            answer: "ein Stoff, der den Strom durchlässt"
          - id: l1-c4
            type: true_false
            text: "Legst du einen Leiter in die Lücke, leuchtet das Lämpchen. Stimmt das?"
            answer: true
          - id: l1-c5
            type: image_multiple_choice
            text: "Was leitet den Strom?"
            options: [{ object: ring }, { object: sock }, { object: feather }]
            answer: ring
          - id: l1-c6
            type: multiple_choice
            text: "Ein Gummiband liegt in der Lücke. Was macht das Lämpchen?"
            show: { drawn: circuit, switch: false, gap: { label: Gummiband, conductor: false }, bulb: "?" }
            options: ["Es bleibt dunkel.", "Es leuchtet.", "Es blinkt."]
            answer: "Es bleibt dunkel."

  - n: 2
    title: { de: "Warum Kabel eine Hülle haben", en: "Why cables have a sleeve" }
    goal:
      de: "Finde heraus, warum in einem Kabel Metall steckt und außen Kunststoff. Dann weißt du, warum nasse Hände und kaputte Kabel gefährlich sind."
      en: "Find out why a cable has metal inside and plastic outside. Then you know why wet hands and broken cables are dangerous."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was leitet den Strom?"
            options: [{ object: fork }, { object: leaf }, { object: rubber }]
            answer: fork
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Glas ist ein Leiter. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Opa Theo schneidet ein altes Kabel auf.\n\nWas glaubst du: Was steckt darin?"
            say: "Opa Theo hat ein altes, abgeschnittenes Kabel. Es hängt an keiner Steckdose mehr. Er schneidet es vorsichtig auf. Was glaubst du: Was steckt darin?"
            show: { object: cable }
          - text: "Innen sind Drähte aus Kupfer. Außen ist eine Hülle aus Kunststoff."
            say: "Innen glänzen dünne Drähte aus Kupfer. Kupfer ist ein Metall und leitet den Strom sehr gut. Außen ist eine Hülle aus Kunststoff. Sie ist ein Nichtleiter. So bleibt der Strom im Kabel, und wer das Kabel anfasst, bekommt keinen Schlag."
            show: { object: cable }
          - text: "Am Stecker leiten die Stifte aus Metall. Der Griff ist aus Kunststoff."
            say: "Auch ein Stecker hat beides. Die Stifte aus Metall leiten den Strom in die Steckdose. Der Griff ist aus Kunststoff, damit du den Stecker sicher anfassen kannst. Elektrikerinnen und Elektriker haben Werkzeug mit einem Griff aus Kunststoff aus demselben Grund."
            show: { object: plug }
          - text: "Auch Wasser und dein Körper leiten den Strom aus der Steckdose."
            say: "Legt man Leitungswasser in die Lücke, leuchtet das Lämpchen kaum oder gar nicht. Dafür ist die Batterie zu schwach. Den starken Strom aus der Steckdose leitet Leitungswasser aber, und dein Körper auch. Darum fasst du Stecker und Elektrogeräte nie mit nassen Händen an."
            show: { object: water }
          - text: "Ist die Hülle kaputt: nicht anfassen! Einem Erwachsenen Bescheid sagen."
            say: "Ist die Hülle eines Kabels kaputt, liegen die Drähte frei. Dann schützt dich nichts mehr vor dem Strom. Fass so ein Kabel nie an und sag sofort einem Erwachsenen Bescheid."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum hat ein Kabel eine Hülle aus Kunststoff?"
                options: ["Kunststoff ist ein Nichtleiter. So bleibt der Strom im Kabel.", "Damit das Kabel bunt aussieht.", "Kunststoff leitet den Strom besonders gut."]
                answer: "Kunststoff ist ein Nichtleiter. So bleibt der Strom im Kabel."
                hints:
                  - "Denk an den Test mit dem Plastikbecher."
                  - "Kunststoff lässt den Strom nicht durch."
                  - "Die Hülle ist ein Nichtleiter, so bleibt der Strom drin."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Leiter oder Nichtleiter? Sortiere die Teile von Kabel und Stecker."
                bins:
                  - { id: yes, show: { text: "Leiter" }, say: "Leiter" }
                  - { id: no, show: { text: "Nichtleiter" }, say: "Nichtleiter" }
                options:
                  - { text: "die Drähte im Kabel", bin: yes }
                  - { text: "die Stifte am Stecker", bin: yes }
                  - { text: "die Hülle des Kabels", bin: no }
                  - { text: "der Griff des Steckers", bin: no }
                hints:
                  - "Frag bei jedem Teil: Ist es aus Metall oder aus Kunststoff?"
                  - "Drähte und Stifte sind aus Metall. Hülle und Griff sind aus Kunststoff."
                  - "Leiter: Drähte, Stifte. Nichtleiter: Hülle, Griff."
              - id: l2-f3
                type: true_false
                text: "Dein Körper leitet den Strom aus der Steckdose. Stimmt das?"
                answer: true
                hints:
                  - "Beim Lämpchen-Test sieht man es kaum, aber der Strom aus der Steckdose ist viel stärker."
                  - "Wasser leitet diesen Strom, und in deinem Körper ist viel Wasser."
                  - "Ja, dein Körper leitet ihn."
              - id: l2-f4
                type: multiple_choice
                text: "Woraus sind die Drähte in einem Kabel meistens?"
                options: ["aus Kupfer", "aus Holz", "aus Papier"]
                answer: "aus Kupfer"
                hints:
                  - "Die Drähte müssen den Strom gut leiten."
                  - "Es ist ein Metall, rötlich und glänzend."
                  - "Aus Kupfer."
              - id: l2-f5
                type: image_multiple_choice
                text: "Lina findet ein Kabel, aus dem die Drähte herausschauen. Wem sagt sie sofort Bescheid?"
                options: [{ object: mum }, { object: teddy }, { object: cat }]
                answer: mum
                feedback:
                  teddy: "Der Teddy hört gut zu, aber helfen kann er nicht! Lina sagt einem Erwachsenen Bescheid."
                hints:
                  - "Ein kaputtes Kabel fasst Lina nicht an."
                  - "Wer kann es sicher wegräumen?"
                  - "Mama, einem Erwachsenen."
              - id: l2-f6
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Die Drähte im Kabel sind aus _. Die Hülle ist aus _."
                options: ["Kupfer", "Kunststoff", "Holz", "Glas"]
                answer: ["Kupfer", "Kunststoff"]
                hints:
                  - "Innen ein Leiter, außen ein Nichtleiter."
                  - "Innen ein Metall, außen etwas Biegsames, das nicht leitet."
                  - "Kupfer, Kunststoff"

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Was gehört zusammen? Verbinde."
                pairs:
                  - { left: { text: "Draht aus Kupfer" }, right: { text: "Leiter" } }
                  - { left: { text: "Hülle aus Kunststoff" }, right: { text: "Isolator" } }
                  - { left: { text: "kaputte Hülle" }, right: { text: "nicht anfassen, Bescheid sagen" } }
                hints: ["Ein Isolator ist ein Nichtleiter."]
              - id: l2-s2
                type: multiple_choice
                text: "Warum hat das Werkzeug einer Elektrikerin einen Griff aus Kunststoff?"
                options: ["Der Griff leitet den Strom nicht.", "Kunststoff ist schwerer als Metall.", "Der Griff leuchtet im Dunkeln."]
                answer: "Der Griff leitet den Strom nicht."
                hints: ["Kunststoff ist ein Nichtleiter."]
              - id: l2-s3
                type: true_false
                text: "Mit nassen Händen darfst du einen Stecker anfassen. Stimmt das?"
                answer: false
                hints: ["Wasser leitet den Strom aus der Steckdose."]
              - id: l2-s4
                type: sorting
                text: "Leiter oder Nichtleiter? Sortiere."
                bins:
                  - { id: yes, show: { text: "Leiter" }, say: "Leiter" }
                  - { id: no, show: { text: "Nichtleiter" }, say: "Nichtleiter" }
                options:
                  - { object: nail, bin: yes }
                  - { object: screw, bin: yes }
                  - { object: wellies, bin: no }
                  - { object: plank, bin: no }
                hints: ["Nagel und Schraube sind aus Metall."]
              - id: l2-s5
                type: multiple_choice
                text: "Die Hülle der Lichterkette ist aufgerissen. Die Drähte schauen heraus. Was macht Can?"
                options: ["nicht anfassen und einem Erwachsenen Bescheid sagen", "die Drähte mit dem Finger zurückschieben", "die Lichterkette trotzdem einstecken"]
                answer: "nicht anfassen und einem Erwachsenen Bescheid sagen"
                hints: ["Ohne Hülle schützt dich nichts vor dem Strom."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Teil des Steckers leitet den Strom?"
                options: ["die Stifte aus Metall", "der Griff aus Kunststoff", "die Farbe"]
                answer: "die Stifte aus Metall"
              - id: l2-n2
                type: true_false
                text: "Die Hülle eines Kabels ist ein Nichtleiter. Stimmt das?"
                answer: true
              - id: l2-n3
                type: sorting
                text: "Leiter oder Nichtleiter? Sortiere."
                bins:
                  - { id: yes, show: { text: "Leiter" }, say: "Leiter" }
                  - { id: no, show: { text: "Nichtleiter" }, say: "Nichtleiter" }
                options:
                  - { object: copper-wire, bin: yes }
                  - { object: key, bin: yes }
                  - { text: "eine Kabelhülle", bin: no }
                  - { object: broom, bin: no }
