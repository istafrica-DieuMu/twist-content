# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.media-reality
skill: world.society.media-reality
curriculum: de-DE
language: de
title:
  de: Stimmt das wirklich?
  en: Is that really true?
summary: >
  Aylin and Jonas of the 4a run a detective office for the media. Lesson 1
  starts with a photo in the class chat of a shark swimming down a flooded
  street: photos can be changed, things added or taken away. Not
  everything in the media is real: fairy tales, cartoons, jokes and April
  fools are made up, which is fine when everyone knows it; a
  Falschmeldung pretends to be true. Warning signs: it sounds too crazy,
  nobody knows who made it, it wants you to be very angry or scared, it
  says "send this to everyone"; many shares and likes do not make it true.
  Lesson 2 gives four detective questions (Who made it? When was it? Does
  it appear elsewhere, in the children's news or the paper? Can it be at
  all?), tells reliable sources from ones to be careful with, spots
  "Anzeige" or "Werbung" over a post, and the rules for using media
  responsibly: check first, then share; ask a trusted adult when unsure;
  a message from a friend is not checked just because a friend sent it;
  correct a false message you passed on. It ends with the skill check.
  Every message, account and name is written for Twist; no real brands,
  programmes or people.
metadata:
  year: klasse-4
  topic: { de: Sicher mit Medien, en: Safe with media }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.society.media-types, world.society.advertising]
  also_practises: [world.society.advertising]
  vocabulary: { de: [Medien, echt, erfunden, verändert, Falschmeldung, Aprilscherz, Warnzeichen, Quelle, Absender, prüfen, teilen, weiterschicken, Kindernachrichten, Anzeige, Werbung, verlässlich] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: spot, what: { de: "erkennen, was erfunden oder verändert sein kann, und Warnzeichen einer Falschmeldung nennen", en: "recognising what may be made up or changed, and naming the warning signs of a false message" } }
    - { id: check, what: { de: "mit Detektivfragen und verlässlichen Quellen prüfen, ob etwas stimmt, und Werbung erkennen", en: "checking whether something is true with detective questions and reliable sources, and spotting adverts" } }
    - { id: act, what: { de: "verantwortungsvoll handeln: erst prüfen, dann teilen, und bei Unsicherheit Erwachsene fragen", en: "acting responsibly: check before sharing, and ask an adult when unsure" } }
  misconceptions:
    - id: photo-is-proof
      what: Thinks a photo or video always shows what really happened
      addressed: "lesson 1 opens with the edited shark photo; l1-f3, l1-n4, l1-c1 and l2-w1, l2-c2"
    - id: many-shares-true
      what: Thinks something is true because many people share or like it, or because a friend sent it
      addressed: "lesson 1 Learn on warning signs and lesson 2 Learn on checking first; l1-s2, l2-f6 and l2-c10, l2-c17"
    - id: made-up-is-lie
      what: Thinks every made-up story is a lie, so fairy tales and cartoons are Falschmeldungen
      addressed: "lesson 1 Learn says made-up stories are fine when everyone knows they are made up; l1-f6, l1-n3 and l2-s3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Echt oder erfunden?", en: "Real or made up?" }
    goal:
      de: "Werde Medien-Detektiv: Finde heraus, was erfunden oder verändert sein kann, und erkenne die Warnzeichen."
      en: "Become a media detective: find out what may be made up or changed, and spot the warning signs."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Welches davon ist ein Medium?"
            options: [{ object: book }, { object: apple }, { object: shoe }]
            answer: book
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Werbung will, dass wir etwas kaufen. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "In der Klassengruppe der 4a ist ein Foto: Ein Hai schwimmt durch eine überflutete Straße!\n\nIst das echt?"
            say: "Nach einem großen Regen schickt jemand ein Foto in die Klassengruppe der 4a. Darauf schwimmt ein Hai durch eine überflutete Straße, mitten zwischen den Autos! Was glaubst du: Ist das echt?"
            show: { object: shark }
          - text: "Nein! Jemand hat den Hai in das Foto eingefügt. Fotos kann man verändern."
            say: "Aylin und Jonas, die Medien-Detektive der 4a, finden es heraus: Das Foto ist verändert. Jemand hat den Hai mit einem Programm in ein Foto von der Straße eingefügt. Mit solchen Programmen kann man Dinge in ein Foto einfügen oder wegnehmen. Auch Videos kann man verändern."
          - text: "Manches in den Medien ist erfunden: Märchen, Trickfilme, Witze. Das ist in Ordnung, wenn alle wissen, dass es erfunden ist."
            say: "Nicht alles in den Medien ist echt. Märchen, Trickfilme und Witze sind erfunden. Das ist in Ordnung, denn jeder weiß: Ein Hund, der im Trickfilm spricht, ist ausgedacht. Eine Nachricht im Radio oder in der Zeitung soll dagegen berichten, was wirklich passiert ist."
            show: { object: book }
          - text: "Eine Falschmeldung tut so, als wäre sie wahr. Sie ist aber erfunden oder verändert."
            say: "Gefährlich wird es, wenn etwas Erfundenes so tut, als wäre es wahr. Das heißt Falschmeldung. Viele Menschen glauben sie und schicken sie weiter. So verbreitet sie sich schnell."
            show: { object: mobile-phone }
          - text: "Warnzeichen:\nEs klingt zu verrückt.\nNiemand weiß, wer es gemacht hat.\nEs macht dich sehr wütend oder ängstlich.\nDa steht: Schick das an alle!"
            say: "Detektive achten auf Warnzeichen. Klingt es zu verrückt, um wahr zu sein? Weiß niemand, wer es gemacht hat? Will es dich sehr wütend machen oder dir Angst machen? Steht da: Schick das sofort an alle? Dann ist Vorsicht gut. Und Achtung: Nur weil viele etwas teilen oder liken, stimmt es noch lange nicht."
          - text: "Wusstest du? An einem 1. April zeigte das Fernsehen in Großbritannien einen Film über Bäume, an denen Spaghetti wachsen."
            say: "Wusstest du? Am ersten April neunzehnhundertsiebenundfünfzig zeigte das Fernsehen in Großbritannien einen Film über Bäume, an denen Spaghetti wachsen. Es war ein Aprilscherz, also mit Absicht erfundener Quatsch zum ersten April. Viele Menschen haben es geglaubt und angerufen. Sie wollten wissen, wie man selbst einen Spaghettibaum pflanzt!"
            show: { object: pasta }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Kann das echt sein, oder ist es erfunden? Sortiere."
                bins:
                  - { id: echt, show: { text: "kann echt sein" }, say: "kann echt sein" }
                  - { id: erf, show: { text: "erfunden" }, say: "erfunden" }
                options:
                  - { text: "Ein Foto: Ein Elefant mit Flügeln fliegt über die Schule.", bin: erf }
                  - { text: "Ein Trickfilm: Ein Hund spricht mit seinem Herrchen.", bin: erf }
                  - { text: "Im Radio: Morgen regnet es im ganzen Land.", bin: echt }
                  - { text: "In der Zeitung: Die Bücherei öffnet am Montag wieder.", bin: echt }
                hints:
                  - "Frag dich bei jeder Karte: Kann das in Wirklichkeit passieren?"
                  - "Elefanten haben keine Flügel, und Hunde sprechen nur im Trickfilm."
                  - "Elefant und Hund: erfunden. Regen und Bücherei: kann echt sein."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ben bekommt eine Nachricht: „Morgen ist schulfrei! Schick das an alle!“ Wer sie geschrieben hat, steht nicht dabei.\n\nWas ist hier ein Warnzeichen?"
                options: ["Niemand weiß, wer es geschrieben hat, und alle sollen es weiterschicken.", "Die Nachricht ist kurz.", "Die Nachricht ist auf Deutsch."]
                answer: "Niemand weiß, wer es geschrieben hat, und alle sollen es weiterschicken."
                hints:
                  - "Denk an die Warnzeichen für eine Falschmeldung."
                  - "Ist bekannt, wer die Nachricht geschrieben hat? Was sollst du mit ihr tun?"
                  - "Kein Absender und Schick das an alle."
              - id: l1-f3
                type: true_false
                text: "Man kann ein Foto so verändern, dass etwas zu sehen ist, das es gar nicht gab. Stimmt das?"
                answer: true
                hints:
                  - "Denk an den Hai auf der Straße."
                  - "Mit einem Programm kann man Dinge in ein Foto einfügen."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: image_multiple_choice
                text: "Im Netz steht: „Riesiges Tier in einem Dorfteich in Bayern entdeckt!“ Welches dieser Tiere kann nicht in einem Teich in Bayern leben?"
                options: [{ object: shark }, { object: frog }, { object: duck }]
                answer: shark
                feedback:
                  frog: "Frösche leben sogar sehr gern in Teichen! Ein Hai braucht das salzige Meer."
                hints:
                  - "Detektive fragen: Kann das überhaupt sein?"
                  - "Welches Tier lebt im salzigen Meer und nicht im Teich?"
                  - "Der Hai."
              - id: l1-f5
                type: multiple_choice
                text: "Was ist eine Falschmeldung?"
                options: ["eine Nachricht, die so tut, als wäre sie wahr, aber erfunden ist", "eine Nachricht mit einem Rechtschreibfehler", "jede Nachricht, die mir nicht gefällt"]
                answer: "eine Nachricht, die so tut, als wäre sie wahr, aber erfunden ist"
                hints:
                  - "Es geht darum, ob die Nachricht wahr ist."
                  - "Eine Falschmeldung tut so, als wäre sie echt."
                  - "Sie tut so, als wäre sie wahr, ist aber erfunden."
              - id: l1-f6
                type: matching
                text: "Was ist was? Verbinde."
                pairs:
                  - { left: { text: "Märchen" }, right: { text: "eine erfundene Geschichte, und jeder weiß das" } }
                  - { left: { text: "Nachricht" }, right: { text: "berichtet, was wirklich passiert ist" } }
                  - { left: { text: "Falschmeldung" }, right: { text: "tut so, als wäre sie wahr, ist aber erfunden" } }
                  - { left: { text: "Werbung" }, right: { text: "will, dass du etwas kaufst" } }
                hints:
                  - "Zwei davon sind erfunden. Aber nur eines tut so, als wäre es wahr."
                  - "Beim Märchen weiß jeder, dass es ausgedacht ist."
                  - "Märchen: jeder weiß es. Nachricht: wirklich passiert. Falschmeldung: tut so. Werbung: kaufen."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Warnzeichen oder nicht? Sortiere."
                bins:
                  - { id: warn, show: { text: "Warnzeichen" }, say: "Warnzeichen" }
                  - { id: ok, show: { text: "kein Warnzeichen" }, say: "kein Warnzeichen" }
                options:
                  - { text: "Niemand weiß, wer es geschrieben hat.", bin: warn }
                  - { text: "Da steht: „Schick das sofort an alle!“", bin: warn }
                  - { text: "Die Kindernachrichten berichten auch darüber.", bin: ok }
                  - { text: "Es steht dabei, wann und wo es passiert ist.", bin: ok }
                hints: ["Ein Warnzeichen macht dich vorsichtig. Wenn bekannt ist, wer, wann und wo, ist das ein gutes Zeichen."]
              - id: l1-s2
                type: true_false
                text: "Ein Video wurde von ganz vielen Leuten geteilt. Dann stimmt es sicher.\n\nStimmt das?"
                answer: false
                hints: ["Auch eine Falschmeldung kann ganz oft geteilt werden."]
              - id: l1-s3
                type: multiple_choice
                text: "In einem Film fliegt ein Junge auf einem Besen über die Stadt. Was stimmt?"
                options: ["Das ist ausgedacht und mit Tricks gefilmt.", "Das hat ein Junge wirklich gemacht.", "Besen fliegen, wenn man schnell genug rennt."]
                answer: "Das ist ausgedacht und mit Tricks gefilmt."
                hints: ["Kann ein Besen in Wirklichkeit fliegen?"]
              - id: l1-s4
                type: multiple_choice
                text: "Am 1. April steht in der Zeitung: „Ab heute müssen alle Hunde Schuhe tragen.“\n\nWas ist das wohl?"
                options: ["ein Aprilscherz", "eine neue Regel für alle Hunde", "Werbung für Hundefutter"]
                answer: "ein Aprilscherz"
                hints: ["Schau auf das Datum. Was machen manche Zeitungen am 1. April?"]
              - id: l1-s5
                type: true_false
                text: "Eine Nachricht will, dass du sehr wütend oder ängstlich wirst. Das kann ein Warnzeichen sein. Stimmt das?"
                answer: true
                hints: ["Falschmeldungen wollen oft starke Gefühle wecken, damit man sie schnell weiterschickt."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Kann das echt sein, oder ist es erfunden? Sortiere."
                bins:
                  - { id: echt, show: { text: "kann echt sein" }, say: "kann echt sein" }
                  - { id: erf, show: { text: "erfunden" }, say: "erfunden" }
                options:
                  - { text: "Ein Video: Eine Katze fährt allein Auto durch die Stadt.", bin: erf }
                  - { text: "Ein Comic: Eine Maus rettet die ganze Welt.", bin: erf }
                  - { text: "Im Wetterbericht: Am Wochenende wird es warm.", bin: echt }
                  - { text: "Auf der Seite der Schule: Das Sportfest ist am Freitag.", bin: echt }
              - id: l1-n2
                type: multiple_choice
                text: "Was ist kein Warnzeichen für eine Falschmeldung?"
                options: ["Man weiß, wer es geschrieben hat und wann.", "Es klingt total verrückt.", "Da steht: Schick das an alle!"]
                answer: "Man weiß, wer es geschrieben hat und wann."
              - id: l1-n3
                type: true_false
                text: "Ein Märchen ist eine Falschmeldung. Stimmt das?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Aylin sieht ein Foto: Ihre Lehrerin hat plötzlich grüne Haare und Hörner. Was ist am wahrscheinlichsten?"
                options: ["Jemand hat das Foto verändert.", "Die Lehrerin ist ein Monster.", "Fotos zeigen immer die Wahrheit."]
                answer: "Jemand hat das Foto verändert."
              - id: l1-n5
                type: multiple_choice
                text: "Warum können Falschmeldungen schaden?"
                options: ["Viele glauben sie und schicken sie weiter.", "Sie sind immer zu lang.", "Sie haben zu bunte Bilder."]
                answer: "Viele glauben sie und schicken sie weiter."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Ein Foto kann verändert sein. Stimmt das?"
            answer: true
          - id: l1-c2
            type: multiple_choice
            text: "Welche Nachricht ist am ehesten eine Falschmeldung?"
            options: ["„Achtung! Morgen fallen alle Ferien aus! Schick das an alle!“", "Wetterbericht im Radio: „Morgen wird es sonnig.“", "Seite der Schule: „Die Bücherei hat ab Montag länger offen.“"]
            answer: "„Achtung! Morgen fallen alle Ferien aus! Schick das an alle!“"
          - id: l1-c3
            type: sorting
            text: "Kann das echt sein, oder ist es erfunden? Sortiere."
            bins:
              - { id: echt, show: { text: "kann echt sein" }, say: "kann echt sein" }
              - { id: erf, show: { text: "erfunden" }, say: "erfunden" }
            options:
              - { text: "Ein Foto: Ein Fisch klettert auf einen Baum und winkt.", bin: erf }
              - { text: "In der Zeitung: Im Zoo ist ein Giraffenbaby geboren.", bin: echt }
              - { text: "Ein Trickfilm: Ein Auto lacht und singt.", bin: erf }
              - { text: "Im Radio: Die Straße am Bahnhof ist heute gesperrt.", bin: echt }
          - id: l1-c4
            type: true_false
            text: "Was viele teilen, stimmt immer. Stimmt das?"
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Was ist ein Warnzeichen?"
            options: ["Es steht nicht dabei, wer es geschrieben hat.", "Es ist ein Foto.", "Es ist kurz."]
            answer: "Es steht nicht dabei, wer es geschrieben hat."
          - id: l1-c6
            type: multiple_choice
            text: "Ein Trickfilm ist …"
            options: ["erfunden, und alle wissen das", "eine Falschmeldung", "immer eine echte Nachricht"]
            answer: "erfunden, und alle wissen das"

  - n: 2
    title: { de: "Die Detektivfragen", en: "The detective questions" }
    goal:
      de: "Prüfe mit vier Detektivfragen, ob etwas stimmt. Erst prüfen, dann teilen!"
      en: "Use four detective questions to check whether something is true. Check first, then share!"
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Fotos zeigen immer genau, was wirklich passiert ist. Stimmt das?"
            answer: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Satz ist ein Warnzeichen?"
            options: ["„Schick das sofort an alle!“", "„Geschrieben von der Klasse 4a, am Montag.“", "„Das berichten auch die Kindernachrichten.“"]
            answer: "„Schick das sofort an alle!“"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Aylin liest: „Ab nächster Woche gibt es an allen Schulen keine Hausaufgaben mehr!“\n\nWie findet sie heraus, ob das stimmt?"
            say: "Aylin liest auf ihrem Tablet: Ab nächster Woche gibt es an allen Schulen keine Hausaufgaben mehr! Das wäre toll. Aber wie kann Aylin herausfinden, ob das stimmt? Was würdest du tun?"
            show: { object: mobile-phone }
          - text: "Detektivfrage 1: Wer hat das gemacht?"
            say: "Die erste Detektivfrage heißt: Wer hat das gemacht? Kommt es von der Schule, von einer Zeitung, von Kindernachrichten? Oder weiß niemand, woher es kommt? Und will mir jemand etwas verkaufen? Steht Anzeige oder Werbung dabei, dann hat jemand dafür bezahlt. Und Werbung zeigt Dinge oft schöner, als sie in Wirklichkeit sind."
          - text: "Detektivfrage 2: Wann war das?"
            say: "Die zweite Detektivfrage heißt: Wann war das? Manchmal wird eine alte Nachricht oder ein altes Foto wieder verschickt, als wäre es von heute."
          - text: "Detektivfrage 3: Steht es auch woanders?"
            say: "Die dritte Detektivfrage heißt: Steht es auch woanders? Schau in den Kindernachrichten, in der Zeitung oder auf Kinderseiten im Internet nach. Steht es nur in einem Chat und nirgends sonst, ist Vorsicht gut."
          - text: "Detektivfrage 4: Kann das überhaupt sein?"
            say: "Die vierte Detektivfrage heißt: Kann das überhaupt sein? Denk an das, was du schon weißt. Ein Hund wird nicht hundert Jahre alt, und ein Hai schwimmt nicht durch eine Stadt."
          - text: "Erst prüfen, dann teilen.\nUnsicher? Frag einen Erwachsenen, dem du vertraust."
            say: "Aylin findet die Nachricht nirgends sonst, und keiner weiß, wer sie geschrieben hat. Sie ist erfunden. Darum schickt Aylin sie nicht weiter. Das ist die wichtigste Regel: Erst prüfen, dann teilen. Und wenn du unsicher bist, frag einen Erwachsenen, dem du vertraust. Auch eine Nachricht von deiner besten Freundin kann falsch sein, denn vielleicht hat sie sie selbst nur weitergeschickt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Welche Detektivfrage hilft hier? Verbinde."
                pairs:
                  - { left: { text: "Niemand kennt den Absender." }, right: { text: "Wer hat das gemacht?" } }
                  - { left: { text: "Das Foto ist schon fünf Jahre alt." }, right: { text: "Wann war das?" } }
                  - { left: { text: "Keine Zeitung berichtet darüber." }, right: { text: "Steht es auch woanders?" } }
                  - { left: { text: "Ein Hund soll 100 Jahre alt geworden sein." }, right: { text: "Kann das überhaupt sein?" } }
                hints:
                  - "Jede Frage passt zu genau einem Problem."
                  - "Absender heißt: wer es geschickt oder gemacht hat. Ein Alter hat mit der Zeit zu tun."
                  - "Absender: Wer? Altes Foto: Wann? Keine Zeitung: Woanders? 100 Jahre alter Hund: Kann das sein?"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Aylin ist unsicher, ob eine Nachricht stimmt. Was macht sie?"
                options: ["Sie prüft sie oder fragt einen Erwachsenen, bevor sie sie weiterschickt.", "Sie schickt sie schnell an alle.", "Sie glaubt sie einfach."]
                answer: "Sie prüft sie oder fragt einen Erwachsenen, bevor sie sie weiterschickt."
                hints:
                  - "Denk an die wichtigste Regel."
                  - "Erst prüfen, dann teilen."
                  - "Prüfen oder fragen, dann erst weiterschicken."
              - id: l2-f3
                type: true_false
                text: "Eine Nachricht steht nur in einem Chat und nirgends sonst. Dann ist Vorsicht gut. Stimmt das?"
                answer: true
                hints:
                  - "Denk an Detektivfrage 3."
                  - "Echte wichtige Nachrichten stehen meistens an mehreren Stellen."
                  - "Ja, dann ist Vorsicht gut."
              - id: l2-f4
                type: sorting
                text: "Eher verlässlich oder Vorsicht? Sortiere."
                bins:
                  - { id: gut, show: { text: "eher verlässlich" }, say: "eher verlässlich" }
                  - { id: vorsicht, show: { text: "Vorsicht" }, say: "Vorsicht" }
                options:
                  - { text: "Kindernachrichten im Fernsehen", bin: gut }
                  - { text: "die Internetseite der Schule", bin: gut }
                  - { text: "ein Konto ohne Namen, das Schockvideos zeigt", bin: vorsicht }
                  - { text: "eine Kettennachricht von einem Unbekannten", bin: vorsicht }
                hints:
                  - "Frag: Weiß man, wer das gemacht hat?"
                  - "Die Schule und die Kindernachrichten kennt man. Bei einem Unbekannten weiß man es nicht."
                  - "Kindernachrichten und Schulseite: eher verlässlich. Konto ohne Namen und Kettennachricht: Vorsicht."
              - id: l2-f5
                type: multiple_choice
                text: "Ein Video zeigt, wie toll ein neuer Schulranzen ist. Oben steht „Anzeige“. Was heißt das?"
                options: ["Für das Video wurde bezahlt. Es ist Werbung.", "Es ist eine Nachricht aus der Zeitung.", "Den Schulranzen gibt es umsonst."]
                answer: "Für das Video wurde bezahlt. Es ist Werbung."
                hints:
                  - "Denk an Detektivfrage 1: Will mir jemand etwas verkaufen?"
                  - "Anzeige steht über Werbung."
                  - "Es ist Werbung."
              - id: l2-f6
                type: true_false
                text: "Aylin hat eine Nachricht von ihrer besten Freundin bekommen. Darum stimmt sie sicher.\n\nStimmt das?"
                answer: false
                hints:
                  - "Wer hat die Nachricht zuerst geschrieben?"
                  - "Vielleicht hat die Freundin sie selbst nur weitergeschickt."
                  - "Nein, auch dann muss Aylin prüfen."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Hilft das beim Prüfen? Sortiere."
                bins:
                  - { id: ja, show: { text: "hilft" }, say: "hilft" }
                  - { id: nein, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
