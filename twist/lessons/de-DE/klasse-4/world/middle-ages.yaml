# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.middle-ages
skill: world.time.middle-ages
curriculum: de-DE
language: de
title:
  de: Zeitreise ins Mittelalter
  en: Time travel to the Middle Ages
summary: >
  A time trip with a guide child in each lesson. Lesson 1 visits Konrad, a
  Page on a castle about 800 years ago: the Middle Ages lasted about 1000
  years, from about 500 to about 1500, long after the Stone Age; the king
  stood at the top, princes and knights held land from him, and the
  farmers, most of the people, worked it and gave part of the harvest; the
  people did not vote, and a farmer's child mostly stayed a farmer. The
  castle (thick walls, Bergfried, Graben, Zugbrücke; cold in winter), the
  way to knighthood (Page at about 7, Knappe at about 14, Ritter at about
  21), horse, armour and weapons that only rich families could pay for;
  village life with Lene (work from early on, no school, Brei and bread,
  light from candles and fire); dragons only in legends; no potatoes in
  Europe yet. Lesson 2 visits Grete, a smith's daughter in a town about 600
  years ago: town wall and gates, market, crafts and Zünfte (Lehrling,
  Geselle, Meister), wells, no electricity, most people unable to read,
  monks and nuns copying books, Gutenberg printing in Mainz around 1450,
  what towns still keep today, and the myth that everyone thought the earth
  was flat. It ends with the skill check. Every date is a rounded figure
  that stays true; no task names the current year. Romantic myths (dragons,
  knights always rescuing someone, everyone a knight) are named as made up.
metadata:
  year: klasse-4
  topic: { de: Leben in anderen Zeiten, en: Life in other times }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.time.timeline, world.time.stone-age]
  also_practises: [world.time.timeline]
  vocabulary: { de: [Mittelalter, König, Kaiser, Fürst, Ritter, Knappe, Page, Ritterschlag, Rüstung, Burg, Bergfried, Graben, Zugbrücke, Bauer, Ernte, Dorf, Stadt, Stadtmauer, Markt, Handwerker, Zunft, Lehrling, Geselle, Meister, Kloster, Mönch, Nonne, Brunnen] }
  forms: [text, audio, picture, drawn]
  drawn: [number-line]
  facets: []
  parts:
    - { id: rulers, what: { de: "sagen, wer im Mittelalter herrschte und wie Bauern, Ritter und König zueinander standen", en: "saying who ruled in the Middle Ages and how farmers, knights and the king stood to each other" } }
    - { id: castle-knight, what: { de: "eine Burg beschreiben und erklären, wie ein Junge Ritter wurde", en: "describing a castle and explaining how a boy became a knight" } }
    - { id: daily-life, what: { de: "beschreiben, wie Bauern und Handwerker in Dorf und Stadt lebten und arbeiteten", en: "describing how farmers and craftspeople lived and worked in village and town" } }
    - { id: then-now, what: { de: "das Mittelalter zeitlich einordnen und mit heute vergleichen", en: "placing the Middle Ages in time and comparing them with today" } }
  misconceptions:
    - id: everyone-on-castles
      what: Thinks most people in the Middle Ages lived on castles as knights or princesses
      addressed: "lesson 1 Learn opens with the question and answers that most were farmers in villages; l1-f1, l1-f4, l1-c1 and l2-c3"
    - id: dragons-real
      what: Takes dragons and other creatures from legends and films as part of real medieval life
      addressed: "lesson 1 Learn has a screen on dragons; l1-n5 with feedback"
    - id: flat-earth
      what: Believes that people in the Middle Ages all thought the earth was flat
      addressed: "the Wusstest du screen in lesson 2; l2-n2"
    - id: people-voted
      what: Assumes the people chose their rulers then as they do today
      addressed: "lesson 1 Learn on who ruled; l1-s3 and l2-c4"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Auf der Burg und im Dorf", en: "At the castle and in the village" }
    goal:
      de: "Reise mit Konrad ins Mittelalter. Du lernst, wer damals bestimmt hat und wie ein Junge Ritter wurde."
      en: "Travel to the Middle Ages with Konrad. You learn who was in charge then and how a boy became a knight."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Jahre hat ein Jahrhundert?"
            options: ["10 Jahre", "100 Jahre", "1000 Jahre"]
            answer: "100 Jahre"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "In der Jungsteinzeit wurden die Menschen sesshaft und bauten Getreide an. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Reise mit Konrad ins Mittelalter, vor ungefähr 800 Jahren.\n\nWas glaubst du: Wohnten damals fast alle Menschen auf Burgen, oder nur wenige?"
            say: "Heute reist du mit Konrad ins Mittelalter, ungefähr achthundert Jahre zurück. Konrad wohnt auf einer Burg. Was glaubst du: Wohnten damals fast alle Menschen auf Burgen, oder nur wenige?"
            show: { object: horse }
          - text: "Nur wenige! Die meisten Menschen waren Bauern und lebten in Dörfern."
            say: "Nur wenige! Auf der Burg wohnte der Burgherr, ein Ritter, mit seiner Familie. Dazu kamen Knechte, Mägde und Wachen. Die allermeisten Menschen aber waren Bauern. Sie lebten in Dörfern und arbeiteten auf den Feldern."
            show: { object: farmer }
          - text: "Das Mittelalter dauerte ungefähr 1000 Jahre: von ungefähr 500 bis ungefähr 1500."
            say: "Das Mittelalter dauerte ungefähr tausend Jahre, von ungefähr fünfhundert bis ungefähr fünfzehnhundert. Auf der Zeitleiste liegt es zwischen den beiden mittleren Strichen. Die Steinzeit war viel, viel früher."
            show: { drawn: number-line, from: 0, to: 2000, step: 100, labels: tens }
          - text: "Ganz oben: der König.\nDarunter: Fürsten und Ritter.\nUnten: die Bauern."
            say: "Wer bestimmte damals? Ganz oben stand der König. Manche Könige wurden auch zum Kaiser gekrönt. Der König gab Land an Fürsten und Ritter. Die Bauern bearbeiteten dieses Land und mussten einen Teil ihrer Ernte abgeben. Das Volk durfte nicht wählen. Wer als Bauernkind geboren wurde, blieb meistens sein Leben lang Bauer oder Bäuerin."
            show: { object: crown }
          - text: "Eine Burg hat dicke Mauern, einen hohen Turm, den Bergfried, und oft einen Graben mit einer Zugbrücke."
            say: "Viele Burgen stehen auf einem Berg. Von dort sieht man Feinde schon von Weitem. Dicke Mauern schützen die Burg. Der höchste Turm heißt Bergfried. Oft liegt ein tiefer Graben um die Burg, und darüber führt eine Zugbrücke, die man hochziehen kann. Gemütlich war es nicht: Im Winter war es kalt und dunkel, denn es gab nur offene Feuer und kleine Fenster."
          - text: "Page mit ungefähr 7 Jahren\nKnappe mit ungefähr 14 Jahren\nRitter mit ungefähr 21 Jahren"
            say: "Konrad ist acht und schon Page. Mit ungefähr sieben Jahren kam er auf die Burg. Er lernt reiten und gutes Benehmen. Mit ungefähr vierzehn Jahren wird er Knappe. Dann hilft er einem Ritter, pflegt sein Pferd und seine Rüstung und übt mit Schwert und Lanze. Mit ungefähr einundzwanzig Jahren kann er beim Ritterschlag zum Ritter gemacht werden. Ein Ritter kämpfte zu Pferd. Pferd, Rüstung und Waffen waren sehr teuer. Darum konnten nur reiche Familien ihre Söhne zu Rittern machen."
            show: { object: horse }
          - text: "Im Dorf: Lene füttert die Hühner und hütet die Schafe. Zur Schule geht sie nicht."
            say: "Unten im Dorf wohnt Lene. Bauernkinder arbeiteten früh mit: Hühner füttern, Schafe hüten, Wasser holen. In eine Schule gingen sie nicht. Gegessen wurde meistens Brei, Brot und Gemüse, Fleisch nur selten. Abends machten Kerzen und das Herdfeuer Licht, denn Strom gab es noch nicht."
            show: { object: hen }
          - text: "Und die Drachen? Drachen gab es nie. Sie kommen nur in Sagen und Märchen vor."
            say: "In Filmen kämpfen Ritter oft gegen Drachen. Drachen gab es aber nie, auch nicht im Mittelalter. Sie kommen nur in Sagen und Märchen vor."
          - text: "Wusstest du? Kartoffeln gab es im Mittelalter in Europa noch nicht."
            say: "Wusstest du? Kartoffeln gab es im Mittelalter in Europa noch nicht. Sie kamen erst später aus Amerika zu uns. Lene hat also nie Pommes gegessen!"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Konrad zeigt dir seine Burg. Wer wohnt dort?"
                options: ["der Burgherr mit seiner Familie, Knechte, Mägde und Wachen", "fast alle Menschen aus dem ganzen Land", "nur die Bauern mit ihren Kühen"]
                answer: "der Burgherr mit seiner Familie, Knechte, Mägde und Wachen"
                hints:
                  - "Auf einer Burg wohnten nur wenige Menschen."
                  - "Wem gehört die Burg, und wer arbeitet für ihn?"
                  - "Der Burgherr, seine Familie und seine Leute."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Wer lebte wo? Sortiere."
                bins:
                  - { id: burg, show: { text: "auf der Burg" }, say: "auf der Burg" }
                  - { id: dorf, show: { text: "im Dorf" }, say: "im Dorf" }
                options:
                  - { text: "der Ritter", bin: burg }
                  - { text: "die Wachen am Tor", bin: burg }
                  - { text: "die Bauernfamilie", bin: dorf }
                  - { text: "der Hirte mit den Schafen", bin: dorf }
                hints:
                  - "Die Burg ist der Ort zum Schützen und Kämpfen. Das Dorf liegt bei den Feldern."
                  - "Wer kämpft oder bewacht? Wer arbeitet mit Tieren und Feldern?"
                  - "Ritter und Wachen: Burg. Bauernfamilie und Hirte: Dorf."
              - id: l1-f3
                type: ordering
                text: "Wie wird Konrad Ritter? Bring es in die richtige Reihenfolge."
                options: ["Knappe", "Ritter", "Page"]
                slot_count: 3
                answer: ["Page", "Knappe", "Ritter"]
                hints:
                  - "Konrad ist jetzt acht. Was ist er?"
                  - "Als Page fängt er an. Wer hilft einem Ritter mit vierzehn?"
                  - "Page, Knappe, Ritter."
              - id: l1-f4
                type: true_false
                text: "Die meisten Menschen im Mittelalter waren Bauern. Stimmt das?"
                answer: true
                hints:
                  - "Denk an die Frage am Anfang: Wohnten fast alle auf Burgen?"
                  - "Auf der Burg wohnten nur wenige. Wo lebten die anderen?"
                  - "Ja, die meisten lebten als Bauern in Dörfern."
              - id: l1-f5
                type: image_multiple_choice
                text: "Was gab es im Mittelalter schon? Tippe es an."
                options: [{ object: candle }, { object: light-bulb }, { object: mobile-phone }]
                answer: candle
                feedback:
                  mobile-phone: "Ein Handy auf der Burg? Dann hätte Konrad dir eine Nachricht schicken können! Strom gab es noch nicht."
                hints:
                  - "Im Mittelalter gab es keinen Strom."
                  - "Was braucht keinen Strom?"
                  - "Die Kerze."
              - id: l1-f6
                type: multiple_choice
                text: "Warum stehen viele Burgen auf einem Berg?"
                options: ["Damit man Feinde früh sieht und sich gut schützen kann.", "Damit die Ritter näher an den Wolken wohnen.", "Weil die Bauern im Tal keine Burg wollten."]
                answer: "Damit man Feinde früh sieht und sich gut schützen kann."
                hints:
                  - "Eine Burg soll die Menschen darin schützen."
                  - "Von oben kann man weit ins Land schauen."
                  - "Damit man Feinde früh sieht."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Was ist was an der Burg? Verbinde."
                pairs:
                  - { left: { text: "Bergfried" }, right: { text: "der höchste Turm" } }
                  - { left: { text: "Graben" }, right: { text: "tief und rund um die Burg" } }
                  - { left: { text: "Zugbrücke" }, right: { text: "kann man hochziehen" } }
                hints: ["Über den Graben führt die Zugbrücke. Der Bergfried ragt hoch auf."]
              - id: l1-s2
                type: multiple_choice
                text: "Wer stand im Mittelalter ganz oben?"
                options: ["der König", "der Bauer", "der Knappe"]
                answer: "der König"
                hints: ["Er trägt eine Krone."]
              - id: l1-s3
                type: true_false
                text: "Im Mittelalter durfte das Volk den König wählen. Stimmt das?"
                answer: false
                hints: ["Konnten Bauern damals mitbestimmen, wer herrscht?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Welche Zahlen passen?"
                frame: "Mit ungefähr _ Jahren kam ein Junge als Page auf die Burg. Mit ungefähr _ Jahren wurde er Knappe."
                options: ["3", "7", "14", "21"]
                answer: ["7", "14"]
                hints: ["Konrad ist acht und schon Page. Knappe wird man doppelt so alt."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Worauf ritt ein Ritter in den Kampf?"
                options: [{ object: horse }, { object: cow }, { object: pig }]
                answer: horse
                feedback:
                  pig: "Ein Ritter auf einem Schwein? Das wäre ein lustiger Kampf! Ein Ritter kämpfte zu Pferd."
                hints: ["Ein Knappe pflegt das Tier des Ritters."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Mittelalter oder heute? Sortiere."
                bins:
                  - { id: then, show: { text: "Mittelalter" }, say: "Mittelalter" }
                  - { id: now, show: { text: "heute" }, say: "heute" }
                options:
                  - { text: "Licht von Kerzen und Feuer", bin: then }
                  - { text: "jeden Tag Brei und Brot, Fleisch nur selten", bin: then }
                  - { text: "Licht aus der Lampe mit Strom", bin: now }
                  - { text: "Pommes aus Kartoffeln", bin: now }
              - id: l1-n2
                type: point_on_line
                text: "Um 1500 ging das Mittelalter zu Ende. Wo liegt das Jahr 1500? Tippe es an."
                say: "Um fünfzehnhundert ging das Mittelalter zu Ende. Wo liegt das Jahr fünfzehnhundert? Tippe es an."
                show: { drawn: number-line, from: 0, to: 2000, step: 100, labels: tens }
                answer: 1500
              - id: l1-n3
                type: true_false
                text: "Im Mittelalter gingen alle Bauernkinder zur Schule. Stimmt das?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Lene ist ein Bauernkind. Was macht sie an einem normalen Tag?"
                options: ["Sie füttert die Hühner und holt Wasser.", "Sie übt mit dem Schwert für den Ritterschlag.", "Sie schaut abends fern."]
                answer: "Sie füttert die Hühner und holt Wasser."
              - id: l1-n5
                type: multiple_choice
                text: "Ein Mann erzählt: „Auf unserer Burg hat mein Urgroßvater einen echten Drachen gesehen.“\n\nWas stimmt?"
                options: ["Drachen gab es nie. Sie kommen nur in Sagen und Märchen vor.", "Im Mittelalter gab es Drachen, heute nicht mehr.", "Drachen lebten nur in Burggräben."]
                answer: "Drachen gab es nie. Sie kommen nur in Sagen und Märchen vor."
                feedback:
                  "Im Mittelalter gab es Drachen, heute nicht mehr.": "Drachen gab es zu keiner Zeit. Kein Fund und keine Quelle zeigt einen echten Drachen. Sie sind erfunden."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wo wohnten die meisten Menschen im Mittelalter?"
            options: ["in Dörfern", "auf Burgen", "in Klöstern"]
            answer: "in Dörfern"
          - id: l1-c2
            type: true_false
            text: "Ein Knappe hilft einem Ritter und pflegt sein Pferd. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wie lange dauerte das Mittelalter ungefähr?"
            options: ["ungefähr 10 Jahre", "ungefähr 1000 Jahre", "ungefähr 100 000 Jahre"]
            say: "Wie lange dauerte das Mittelalter ungefähr? Zehn Jahre, tausend Jahre oder hunderttausend Jahre?"
            answer: "ungefähr 1000 Jahre"
            keep_order: true
          - id: l1-c4
            type: image_multiple_choice
            text: "Woran erkennt man den König?"
            options: [{ object: crown }, { object: bucket }, { object: woolly-hat }]
            answer: crown
          - id: l1-c5
            type: true_false
            text: "Im Mittelalter gab es schon Strom. Stimmt das?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Warum hat eine Burg oft einen Graben?"
            options: ["Damit Feinde schwer an die Mauer kommen.", "Damit die Ritter darin baden können.", "Damit die Kühe dort trinken."]
            answer: "Damit Feinde schwer an die Mauer kommen."

  - n: 2
    title: { de: "In der Stadt", en: "In the town" }
    goal:
      de: "Besuche Grete in einer Stadt im Mittelalter. Du lernst, wie Handwerker arbeiteten und was es damals noch nicht gab."
      en: "Visit Grete in a medieval town. You learn how craftspeople worked and what did not exist yet."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wer stand im Mittelalter unter dem König, aber über den Bauern?"
            options: ["Fürsten und Ritter", "Knechte und Mägde", "niemand"]
            answer: "Fürsten und Ritter"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein Page war ungefähr 14 Jahre alt, als er Ritter wurde. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Grete lebt vor ungefähr 600 Jahren in einer Stadt.\n\nWas glaubst du: Warum hat ihre Stadt eine hohe Mauer?"
            say: "Jetzt besuchst du Grete. Sie lebt vor ungefähr sechshundert Jahren in einer Stadt. Rund um die Stadt steht eine hohe Mauer. Was glaubst du: Wozu ist die Mauer da?"
            show: { object: church }
          - text: "Die Stadtmauer schützt die Stadt. Nachts werden die Stadttore geschlossen."
            say: "Die Mauer schützt die Stadt vor Feinden und Dieben. Hinein kommt man nur durch die Stadttore, und nachts werden sie geschlossen. Wer in der Stadt wohnt, ist ein Bürger oder eine Bürgerin."
          - text: "Auf dem Markt verkaufen Bauern und Handwerker ihre Waren."
            say: "Mitten in der Stadt liegt der Marktplatz mit der Kirche und dem Rathaus. Bauern aus den Dörfern bringen Eier, Gemüse und Getreide. Handwerker stellen Dinge her und verkaufen sie: Der Bäcker backt Brot, der Schuster macht Schuhe, der Weber webt Stoff, und der Schmied schmiedet Hufeisen und Werkzeug aus Eisen. Gretes Vater ist Schmied."
            show: { object: bread }
          - text: "Die Handwerker eines Berufs gehören zu einer Zunft.\nErst Lehrling, dann Geselle, dann Meister."
            say: "Alle Handwerker eines Berufs gehören zu einer Zunft. Die Zunft legt fest, wie gut die Waren sein müssen. Wer ein Handwerk lernt, ist zuerst Lehrling bei einem Meister. Danach arbeitet er als Geselle. Erst wer viel kann, wird selbst Meister und darf eine eigene Werkstatt haben."
          - text: "In Gretes Stadt: enge Gassen, Wasser aus dem Brunnen, kein Strom, keine Müllabfuhr."
            say: "Die Gassen sind eng, und viele Häuser sind aus Holz und Lehm. Darum ist Feuer sehr gefährlich. Wasser holt Grete mit dem Eimer am Brunnen, denn eine Wasserleitung im Haus gibt es nicht. Strom und eine Müllabfuhr gibt es auch nicht."
            show: { object: bucket }
          - text: "Im Kloster schreiben Mönche und Nonnen Bücher mit der Hand ab. Die meisten Menschen können nicht lesen."
            say: "Vor der Stadt liegt ein Kloster. Dort leben Mönche und Nonnen. Sie beten, arbeiten und schreiben Bücher mit der Hand ab. Das dauert sehr lange. Die meisten Menschen können damals nicht lesen und schreiben, auch Grete nicht."
            show: { object: book }
          - text: "Um 1450 druckt Johannes Gutenberg in Mainz Bücher mit beweglichen Buchstaben."
            say: "Um vierzehnhundertfünfzig druckt Johannes Gutenberg in Mainz Bücher mit beweglichen Buchstaben aus Metall. So kann man ein Buch viel schneller herstellen als mit der Hand. Bücher werden billiger, und mehr Menschen lernen lesen."
          - text: "Heute haben viele Städte noch Kirchen, Marktplätze und Reste der Stadtmauer aus dem Mittelalter."
            say: "Vieles aus Gretes Zeit kannst du heute noch sehen: alte Kirchen, Marktplätze, Stadttore und Reste der Stadtmauer. Ritter, Zünfte und Stadttore, die nachts schließen, gibt es aber nicht mehr."
          - text: "Wusstest du? Gelehrte im Mittelalter wussten schon, dass die Erde eine Kugel ist."
            say: "Wusstest du? Manche Leute glauben heute, im Mittelalter hätten alle gedacht, die Erde sei eine Scheibe. Das stimmt nicht. Gelehrte im Mittelalter wussten schon, dass die Erde eine Kugel ist. Das hatten Gelehrte im alten Griechenland schon lange vorher herausgefunden."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum schließt Gretes Stadt nachts die Tore?"
                options: ["Damit keine Feinde und Diebe hineinkommen.", "Damit der Mond nicht hineinscheint.", "Damit die Kinder früh ins Bett gehen."]
                answer: "Damit keine Feinde und Diebe hineinkommen."
                hints:
                  - "Mauer und Tore haben die gleiche Aufgabe."
                  - "Die Stadtmauer schützt die Stadt. Wovor?"
                  - "Damit keine Feinde und Diebe hineinkommen."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Wer macht was? Verbinde."
                pairs:
                  - { left: { text: "Bäcker" }, right: { text: "Brot" } }
                  - { left: { text: "Schuster" }, right: { text: "Schuhe" } }
                  - { left: { text: "Weber" }, right: { text: "Stoff" } }
                  - { left: { text: "Schmied" }, right: { text: "Hufeisen und Werkzeug aus Eisen" } }
                hints:
                  - "Viele Berufsnamen verraten schon, was gemacht wird."
                  - "Der Bäcker backt, der Weber webt. Und der Schmied?"
                  - "Der Schmied macht Dinge aus Eisen, der Schuster Schuhe."
              - id: l2-f3
                type: ordering
                text: "Wie wird man Meister? Bring es in die richtige Reihenfolge."
                options: ["Meister", "Lehrling", "Geselle"]
                slot_count: 3
                answer: ["Lehrling", "Geselle", "Meister"]
                hints:
                  - "Am Anfang lernt man noch."
                  - "Wer ein Handwerk lernt, ist zuerst Lehrling. Wer kann am meisten?"
                  - "Lehrling, Geselle, Meister."
              - id: l2-f4
                type: true_false
                text: "Im Mittelalter konnten die meisten Menschen lesen und schreiben. Stimmt das?"
                answer: false
                hints:
                  - "Bücher wurden mit der Hand abgeschrieben. Gab es viele davon?"
                  - "Kann Grete lesen?"
                  - "Nein, die meisten konnten es nicht."
              - id: l2-f5
                type: image_multiple_choice
                text: "Womit holt Grete Wasser am Brunnen?"
                options: [{ object: bucket }, { object: kettle }, { object: watering-can }]
                answer: bucket
                feedback:
                  kettle: "Ein Wasserkocher braucht Strom, und den gab es noch nicht! Grete holt das Wasser mit dem Eimer."
                hints:
                  - "Grete muss viel Wasser auf einmal tragen."
                  - "Es ist ein Gefäß mit einem Henkel, ganz ohne Strom."
                  - "Mit dem Eimer."
              - id: l2-f6
                type: sorting
