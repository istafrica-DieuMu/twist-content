# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.addiction-prevention
skill: world.body.addiction-prevention
curriculum: de-DE
language: de
title:
  de: Rauchen, Alkohol und Bildschirm
  en: Smoking, alcohol and screens
summary: >
  Calm and factual, with Lia's family; nobody is shamed. Lesson 1, at
  Grandma's birthday: Uncle Tarek goes outside to smoke and would like to
  stop but finds it hard, because the nicotine in cigarettes is
  addictive (the body wants it again and again), as it is for many
  people who smoke; smoke has poisonous substances that harm the lungs
  and the heart, and breathing in other people's smoke (Passivrauchen)
  harms too. Alcohol in beer, wine, Sekt and Schnaps acts on the brain,
  makes people slow and unsteady, harms liver and brain over time and can
  be addictive too; a child's body is still growing, so even a little
  harms it, and shops do not sell alcohol or cigarettes to children. The
  children drink juice and water. Lesson 2: Lia's brother Finn cannot
  stop gaming, because many games and videos are made to keep you
  watching; too much screen time brings tired, dry eyes, headaches, too
  little movement and poor sleep; what helps is agreeing the time with
  the parents, an alarm, breaks with movement and no screen before bed.
  What an addiction is, and that saying no ("Nein, danke") is fine, needs
  no reason, and an adult helps if someone pushes. It ends with the
  skill check. No brands; no pictures of cigarettes or alcohol.
metadata:
  year: klasse-4
  topic: { de: Gesund bleiben, en: Staying healthy }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.body.heart-lungs, world.body.exercise-rest, world.society.media-types]
  also_practises: []
  vocabulary: { de: [Zigarette, rauchen, Rauch, Nikotin, süchtig, Sucht, Passivrauchen, Alkohol, Bier, Wein, Sekt, Schnaps, Gesetz, Bildschirm, Spielzeit, Pause, Wecker, Nein sagen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: smoking, what: { de: "erklären, warum Rauchen und Passivrauchen schaden und warum Aufhören schwer ist", en: "explaining why smoking and second-hand smoke harm and why stopping is hard" } }
    - { id: alcohol, what: { de: "erklären, was Alkohol im Körper macht und warum Kinder keinen trinken", en: "explaining what alcohol does in the body and why children do not drink it" } }
    - { id: screens, what: { de: "sagen, was zu viel Bildschirmzeit macht und was dagegen hilft", en: "saying what too much screen time does and what helps against it" } }
    - { id: say-no, what: { de: "wissen, was eine Sucht ist, und freundlich Nein sagen", en: "knowing what an addiction is and saying no in a friendly way" } }
  misconceptions:
    - id: smokers-are-bad
      what: Thinks people who smoke or drink are bad people, rather than that these substances are addictive and stopping is hard
      addressed: "lesson 1 Learn says Uncle Tarek is not a bad person and that many smokers want to stop; l1-f1, l1-s5, l1-c6 and l2-c4, l2-c5 test it"
    - id: little-is-fine
      what: Thinks a little alcohol does a child no harm
      addressed: "lesson 1 Learn says a child's body is still growing, so even a little harms it; l1-f6, l1-s1, l1-n5 and l2-c8 test it, with feedback on l1-f6"
    - id: can-always-stop
      what: Thinks you can always stop a game or a video whenever you like, so screen time needs no plan
      addressed: "lesson 2 Learn says many games and videos are made to keep you watching; l2-f1, l2-s1, l2-n1 and l2-c12, l2-c15 test it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Rauchen und Alkohol", en: "Smoking and alcohol" }
    goal:
      de: "Finde heraus, warum Rauchen und Alkohol dem Körper schaden und warum es so schwer ist, damit aufzuhören."
      en: "Find out why smoking and alcohol harm the body and why it is so hard to stop."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was passiert in deiner Lunge?"
            options: ["Sauerstoff aus der Luft geht ins Blut.", "Das Essen wird verdaut.", "Die Knochen wachsen."]
            answer: "Sauerstoff aus der Luft geht ins Blut."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Wenn du rennst, schlägt dein Herz schneller. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Onkel Tarek geht beim Familienfest immer wieder zum Rauchen vor die Tür. Er möchte aufhören, aber es ist so schwer.\n\nWarum ist es wohl so schwer?"
            say: "Lia feiert mit ihrer Familie Omas Geburtstag. Onkel Tarek geht immer wieder zum Rauchen vor die Tür. Er seufzt und erzählt, dass er gern aufhören möchte, aber dass es so schwer ist. Was glaubst du: Warum ist das so schwer?"
          - text: "In Zigaretten ist Nikotin. Nikotin macht süchtig: Der Körper will es immer wieder haben."
            say: "In Zigaretten steckt ein Stoff, der Nikotin heißt. Nikotin macht süchtig. Das heißt: Der Körper will es immer wieder haben. Ohne Zigarette wird man unruhig und schlecht gelaunt. Darum ist Aufhören so schwer. So geht es vielen Menschen, die rauchen. Onkel Tarek ist kein schlechter Mensch. Er hat sich an etwas gewöhnt, das ihm schadet."
          - text: "Im Rauch sind giftige Stoffe. Sie schaden vor allem der Lunge und dem Herzen."
            say: "Im Zigarettenrauch sind viele giftige Stoffe. Sie schaden vor allem der Lunge und dem Herzen. Wer raucht, ist beim Rennen schneller außer Atem und kann später schwer krank werden."
            show: { object: heart }
          - text: "Passivrauchen: Wer den Rauch von anderen einatmet, atmet die giftigen Stoffe auch ein."
            say: "Auch wer neben jemandem sitzt, der raucht, atmet die giftigen Stoffe ein. Das heißt Passivrauchen. Darum geht Onkel Tarek zum Rauchen nach draußen. Für Kinder ist rauchfreie Luft besonders wichtig."
          - text: "Alkohol ist in Bier, Wein, Sekt und Schnaps. Er macht langsam und unsicher."
            say: "Zum Anstoßen trinken die Erwachsenen ein Glas Sekt. Auch in Bier, Wein und Schnaps steckt Alkohol. Alkohol wirkt auf das Gehirn. Wer zu viel trinkt, wird langsam und unsicher und kann hinfallen. Viel Alkohol schadet auf Dauer vor allem der Leber und dem Gehirn. Und auch Alkohol kann süchtig machen."
            show: { object: wine }
          - text: "Der Körper von Kindern wächst noch. Schon wenig Alkohol schadet ihm.\nGeschäfte verkaufen Alkohol und Zigaretten nicht an Kinder."
            say: "Der Körper von Kindern wächst noch. Darum schadet ihm schon wenig Alkohol. In Deutschland gibt es dafür ein Gesetz: Geschäfte verkaufen Alkohol und Zigaretten nicht an Kinder. Lia und ihre Cousins trinken Saft und Wasser."
            show: { object: juice }
          - text: "Wusstest du? Die meisten Jugendlichen in Deutschland rauchen nicht."
            say: "Wusstest du? Die meisten Jugendlichen in Deutschland rauchen nicht. Nichtrauchen ist also ganz normal."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Warum fällt Onkel Tarek das Aufhören so schwer?"
                options: ["Nikotin macht süchtig.", "Zigaretten schmecken nach Erdbeere.", "Rauchen macht stark."]
                answer: "Nikotin macht süchtig."
                hints:
                  - "In Zigaretten steckt ein Stoff, an den sich der Körper gewöhnt."
                  - "Der Körper will diesen Stoff immer wieder haben."
                  - "Das Nikotin macht süchtig."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Mit Alkohol oder ohne? Sortiere."
                bins:
                  - { id: with, show: { text: "mit Alkohol" }, say: "mit Alkohol" }
                  - { id: without, show: { text: "ohne Alkohol" }, say: "ohne Alkohol" }
                options:
                  - { object: beer, bin: with }
                  - { object: wine, bin: with }
                  - { object: juice, bin: without }
                  - { object: bottle, bin: without }
                hints:
                  - "Alkohol steckt in Getränken für Erwachsene."
                  - "Bier, Wein, Sekt und Schnaps haben Alkohol."
                  - "Bier und Wein: mit Alkohol. Apfelsaft und Mineralwasser: ohne."
              - id: l1-f3
                type: true_false
                text: "Wer neben jemandem sitzt, der raucht, atmet auch giftige Stoffe ein. Stimmt das?"
                answer: true
                hints:
                  - "Der Rauch bleibt nicht bei dem, der raucht."
                  - "Wie heißt es, wenn man den Rauch von anderen einatmet?"
                  - "Ja. Das ist Passivrauchen."
              - id: l1-f4
                type: image_multiple_choice
                text: "Welchem Organ schadet der Rauch, neben der Lunge, besonders?"
                options: [{ object: heart }, { object: ear }, { object: foot }]
                answer: heart
                hints:
                  - "Der Rauch schadet vor allem zwei Organen."
                  - "Das eine ist die Lunge. Das andere pumpt das Blut."
                  - "Dem Herzen."
              - id: l1-f5
                type: matching
                text: "Was bedeutet das? Verbinde."
                pairs:
                  - { left: { text: "Nikotin" }, right: { text: "ein Stoff in Zigaretten" } }
                  - { left: { text: "süchtig" }, right: { text: "Der Körper will etwas immer wieder haben." } }
                  - { left: { text: "Passivrauchen" }, right: { text: "den Rauch von anderen einatmen" } }
                hints:
                  - "Eines der Wörter ist ein Stoff, eines ein Gefühl im Körper, eines eine Situation."
                  - "Passiv heißt: Man raucht nicht selbst."
                  - "Nikotin: der Stoff. süchtig: immer wieder wollen. Passivrauchen: den Rauch anderer einatmen."
              - id: l1-f6
                type: multiple_choice
                text: "Beim Fest stoßen die Erwachsenen mit Sekt an. Was trinkt Lia?"
                options: ["Saft", "ein kleines Glas Sekt", "Bier"]
                answer: "Saft"
                feedback:
                  "ein kleines Glas Sekt": "Auch ein kleines Glas schadet einem Körper, der noch wächst. Lia stößt mit Saft an."
                hints:
                  - "Lias Körper wächst noch."
                  - "Schon wenig Alkohol schadet Kindern."
                  - "Lia trinkt Saft."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Ein bisschen Alkohol schadet Kindern nicht. Stimmt das?"
                answer: false
                hints: ["Der Körper von Kindern wächst noch."]
              - id: l1-s2
                type: multiple_choice
                text: "Was macht viel Alkohol mit einem Menschen?"
                options: ["Er wird langsam und unsicher.", "Er wird schneller und schlauer.", "Er wird größer."]
                answer: "Er wird langsam und unsicher."
                hints: ["Alkohol wirkt auf das Gehirn."]
              - id: l1-s3
                type: sorting
                text: "Gut für Lunge und Herz oder schädlich? Sortiere."
                bins:
                  - { id: good, show: { text: "gut" }, say: "gut" }
                  - { id: bad, show: { text: "schädlich" }, say: "schädlich" }
                options:
                  - { text: "Fahrrad fahren", bin: good }
                  - { text: "an der frischen Luft spielen", bin: good }
                  - { text: "rauchen", bin: bad }
                  - { text: "in einem verrauchten Zimmer sitzen", bin: bad }
                hints: ["Bewegung macht Herz und Lunge stark. Rauch schadet ihnen, auch der von anderen."]
              - id: l1-s4
                type: multiple_choice
                text: "Warum geht Onkel Tarek zum Rauchen nach draußen?"
                options: ["Damit die anderen den Rauch nicht einatmen.", "Weil es draußen wärmer ist.", "Weil der Rauch draußen gesund ist."]
                answer: "Damit die anderen den Rauch nicht einatmen."
                hints: ["Denk an das Passivrauchen."]
              - id: l1-s5
                type: true_false
                text: "Onkel Tarek ist ein schlechter Mensch, weil er raucht. Stimmt das?"
                answer: false
                hints: ["Nikotin macht süchtig. Onkel Tarek möchte sogar aufhören."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was ist Passivrauchen?"
                options: ["den Rauch von anderen einatmen", "eine Zigarette ausmachen", "draußen spazieren gehen"]
                answer: "den Rauch von anderen einatmen"
              - id: l1-n2
                type: fill_in_blank
                text: "Ergänze."
                frame: "In Zigaretten ist _. Es macht _."
                options: ["Nikotin", "Alkohol", "süchtig", "stark"]
                answer: ["Nikotin", "süchtig"]
              - id: l1-n3
                type: true_false
                text: "In Deutschland dürfen Geschäfte Zigaretten an Kinder verkaufen. Stimmt das?"
                answer: false
              - id: l1-n4
                type: sorting
                text: "Mit Alkohol oder ohne? Sortiere."
                bins:
                  - { id: with, show: { text: "mit Alkohol" }, say: "mit Alkohol" }
                  - { id: without, show: { text: "ohne Alkohol" }, say: "ohne Alkohol" }
                options:
                  - { text: "Schnaps", bin: with }
                  - { text: "Sekt", bin: with }
                  - { object: hot-chocolate, bin: without }
                  - { object: lemonade, bin: without }
              - id: l1-n5
                type: multiple_choice
                text: "Warum schadet Alkohol Kindern besonders?"
                options: ["Ihr Körper wächst noch.", "Kinder sind zu klein für Gläser.", "Kinder mögen keinen Saft."]
                answer: "Ihr Körper wächst noch."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was macht Nikotin?"
            options: ["Es macht süchtig.", "Es macht satt.", "Es macht stark."]
            answer: "Es macht süchtig."
          - id: l1-c2
            type: true_false
            text: "Rauchen schadet der Lunge. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Worin ist Alkohol?"
            options: ["im Wein", "im Apfelsaft", "in der Milch"]
            answer: "im Wein"
          - id: l1-c4
            type: true_false
            text: "Passivrauchen schadet nicht. Stimmt das?"
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Lia ist 10. Darf ein Geschäft ihr Zigaretten verkaufen?"
            options: ["Nein, das ist verboten.", "Ja, wenn sie bezahlt.", "Ja, am Wochenende."]
            answer: "Nein, das ist verboten."
          - id: l1-c6
            type: true_false
            text: "Viele Menschen, die rauchen, möchten gern aufhören. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Bildschirm und Nein sagen", en: "Screens and saying no" }
    goal:
      de: "Finde heraus, warum zu viel Zeit am Bildschirm deinem Körper schadet, was dir hilft aufzuhören, und wie du freundlich Nein sagst."
      en: "Find out why too much screen time harms your body, what helps you stop, and how to say no in a friendly way."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Stoff in Zigaretten macht süchtig?"
            options: ["Nikotin", "Zucker", "Vitamine"]
            answer: "Nikotin"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Kinder trinken keinen Alkohol, weil ihr Körper noch wächst. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Finn spielt am Tablet. „Nur noch eine Runde!“ Nach zwei Stunden spielt er immer noch.\n\nWarum ist Aufhören so schwer?"
            say: "Lias großer Bruder Finn spielt am Tablet. Er sagt: Nur noch eine Runde! Aber dann kommt noch eine und noch eine. Nach zwei Stunden spielt er immer noch. Was glaubst du: Warum fällt ihm das Aufhören so schwer?"
            show: { object: tablet-computer }
          - text: "Viele Spiele und Videos sind so gemacht, dass man nicht aufhören will."
            say: "Viele Spiele belohnen dich immer wieder mit Punkten, Sternen oder einem neuen Level. Und nach einem Video startet oft gleich das nächste. Das ist absichtlich so gemacht, damit du lange dranbleibst. Darum ist Aufhören nicht leicht. Bei manchen Menschen wird daraus sogar eine Sucht."
            show: { object: tablet-computer }
          - text: "Zu viel Bildschirm: müde Augen, Kopfweh, zu wenig Bewegung, schlechter Schlaf."
            say: "Finn reibt sich die Augen. Wer zu lange auf einen Bildschirm schaut, bekommt oft müde, trockene Augen oder Kopfweh. Er bewegt sich zu wenig. Und wer abends noch spielt, schläft schlechter ein."
            show: { object: tired }
          - text: "Das hilft:\nDie Spielzeit mit den Eltern abmachen.\nEinen Wecker stellen.\nPausen machen und sich bewegen.\nVor dem Schlafen bleibt der Bildschirm aus."
            say: "Was hilft? Mach mit deinen Eltern ab, wie lange du am Tag spielen darfst. Stell dir einen Wecker, dann vergisst du die Zeit nicht. Mach Pausen und beweg dich. Und vor dem Schlafen bleibt der Bildschirm aus."
            show: { object: clock }
          - text: "Eine Sucht heißt: Man will etwas immer wieder, auch wenn es schadet, und kann schwer aufhören."
            say: "Jetzt weißt du, was eine Sucht ist. Man will etwas immer wieder haben oder tun, auch wenn es schadet, und man kann nur schwer aufhören. Das kann bei Zigaretten passieren, bei Alkohol und auch bei Spielen. Am Nachmittag fährt Finn mit Lia Fahrrad. Hinterher findet er: Das hat richtig Spaß gemacht!"
            show: { object: ride-bike }
          - text: "Nein sagen ist in Ordnung: „Nein, danke.“\nDu musst keinen Grund nennen. Drängt dich jemand, hol dir Hilfe bei einem Erwachsenen."
            say: "Manchmal bietet dir jemand etwas an, das dir schadet, zum Beispiel später einmal eine Zigarette. Oder Freunde drängen dich, noch länger zu spielen. Du darfst immer Nein sagen. Ein einfaches Nein, danke reicht. Du musst keinen Grund nennen. Nein sagen ist mutig. Und wenn dich jemand immer wieder drängt, holst du dir Hilfe bei einem Erwachsenen."
          - text: "Wusstest du? Wenn du auf einen Bildschirm schaust, blinzelst du viel seltener als sonst."
            say: "Wusstest du? Wenn du gebannt auf einen Bildschirm schaust, blinzelst du viel seltener als sonst. Darum werden deine Augen trocken und müde. Eine Pause, in der du in die Ferne schaust, tut ihnen gut."
            show: { object: eye }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum will Finn immer „nur noch eine Runde“ spielen?"
                options: ["Das Spiel belohnt ihn immer wieder, damit er dranbleibt.", "Das Spiel geht nach einer Runde kaputt.", "Seine Eltern haben es ihm befohlen."]
                answer: "Das Spiel belohnt ihn immer wieder, damit er dranbleibt."
                hints:
                  - "Viele Spiele sind absichtlich so gemacht."
                  - "Was bekommt Finn nach jeder Runde: Punkte, Sterne, ein neues Level?"
                  - "Das Spiel belohnt ihn, damit er dranbleibt."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Was kann bei zu viel Bildschirm passieren? Sortiere."
                bins:
                  - { id: yes, show: { text: "kann passieren" }, say: "kann passieren" }
                  - { id: no, show: { text: "passiert nicht" }, say: "passiert nicht" }
                options:
                  - { text: "müde Augen", bin: yes }
                  - { text: "Kopfweh", bin: yes }
                  - { text: "Man wächst doppelt so schnell.", bin: no }
                  - { text: "Man wird ein Superheld.", bin: no }
                hints:
                  - "Denk an Finn nach zwei Stunden am Tablet."
                  - "Was merkt Finn an seinen Augen und an seinem Kopf?"
                  - "Müde Augen und Kopfweh können passieren. Superhelden gibt es nur im Spiel."
              - id: l2-f3
                type: true_false
                text: "Ein spannendes Spiel kurz vor dem Schlafen hilft beim Einschlafen. Stimmt das?"
                answer: false
                hints:
                  - "Vor dem Schlafen helfen ruhige Dinge."
                  - "Was passiert, wenn man abends noch spielt?"
                  - "Nein. Man schläft schlechter ein."
              - id: l2-f4
                type: image_multiple_choice
                text: "Finn hat lange gespielt. Was bringt seinen Körper jetzt in Bewegung?"
                options: [{ object: ride-bike }, { object: mobile-phone }, { object: sofa }]
                answer: ride-bike
                feedback:
                  sofa: "Auf dem Sofa ruht sich Finn aus, aber er bewegt sich nicht. Beim Radfahren bewegt er sich."
                hints:
                  - "Finn hat lange stillgesessen."
                  - "Wobei bewegen sich Arme und Beine?"
                  - "Rad fahren."
              - id: l2-f5
                type: matching
                text: "Was hilft? Verbinde."
                pairs:
                  - { left: { text: "Ich vergesse beim Spielen die Zeit." }, right: { text: "einen Wecker stellen" } }
                  - { left: { text: "Meine Augen sind müde." }, right: { text: "eine Pause machen und in die Ferne schauen" } }
                  - { left: { text: "Ich schlafe schlecht ein." }, right: { text: "vor dem Schlafen kein Bildschirm" } }
                  - { left: { text: "Wir streiten über die Spielzeit." }, right: { text: "die Zeit mit den Eltern abmachen" } }
                hints:
                  - "Zu jedem Problem passt ein Tipp."
                  - "Ein Wecker erinnert an die Zeit. Augen brauchen Pausen."
                  - "Zeit vergessen: Wecker. Augen: Pause. Schlaf: kein Bildschirm. Streit: abmachen."
              - id: l2-f6
                type: multiple_choice
                text: "Ein großer Junge bietet Lia eine Zigarette an. Was sagt sie?"
                options: ["„Nein, danke.“", "„Na gut, eine.“", "„Nur, wenn du mir zwei gibst.“"]
                answer: "„Nein, danke.“"
                hints:
                  - "Du darfst immer Nein sagen."
                  - "Lia muss keinen Grund nennen."
                  - "Nein, danke."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Spiele und Videos sind oft so gemacht, dass man lange dranbleibt. Stimmt das?"
                answer: true
                hints: ["Denk an die Punkte, Sterne und das nächste Video."]
              - id: l2-s2
                type: multiple_choice
                text: "Wer bestimmt, wie lange Finn am Tag spielen darf?"
                options: ["Finn macht es mit seinen Eltern ab.", "das Spiel", "sein Freund aus dem Chat"]
                answer: "Finn macht es mit seinen Eltern ab."
                hints: ["Die Spielzeit macht man mit jemandem ab, der auf einen aufpasst."]
              - id: l2-s3
                type: sorting
                text: "Mit oder ohne Bildschirm? Sortiere."
                bins:
                  - { id: screen, show: { text: "mit Bildschirm" }, say: "mit Bildschirm" }
                  - { id: none, show: { text: "ohne Bildschirm" }, say: "ohne Bildschirm" }
                options:
                  - { object: play-football, bin: none }
                  - { object: read, bin: none }
                  - { text: "ein Video schauen", bin: screen }
                  - { text: "am Tablet spielen", bin: screen }
                hints: ["Frag dich: Schaue ich dabei auf einen Bildschirm?"]
              - id: l2-s4
                type: multiple_choice
                text: "Mia will nicht mehr mitspielen, aber ihre Freundin drängt sie. Was darf Mia?"
                options: ["Nein sagen, ohne einen Grund zu nennen.", "Nichts, sie muss mitmachen.", "Nur Nein sagen, wenn sie krank ist."]
                answer: "Nein sagen, ohne einen Grund zu nennen."
