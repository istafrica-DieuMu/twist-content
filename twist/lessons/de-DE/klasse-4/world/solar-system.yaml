# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.solar-system
skill: world.nature.solar-system
curriculum: de-DE
language: de
title:
  de: Sonne, Erde, Mond und Planeten
  en: Sun, Earth, Moon and planets
summary: >
  Lesson 1, day and night: on a December evening Juri lies in bed in the
  dark while his aunt Mira in Sydney calls in the sunshine. Oma shows why
  with a lamp (the Sun) and a ball (the Earth): the Earth is a ball that
  turns once in about 24 hours; the half facing the Sun has day, the
  other night. The Sun does not go round the Earth; it only looks so
  because we turn with the Earth: it rises in the east, stands in the
  south at midday and sets in the west. The Sun is a star and shines
  itself; the Moon is lit by the Sun and goes round the Earth in about a
  month; the Earth goes round the Sun in a year. Lesson 2, a class visit
  to the planetarium: eight planets go round the Sun, in order Merkur,
  Venus, Erde, Mars, Jupiter, Saturn, Uranus, Neptun (Merksatz „Mein
  Vater erklärt mir jeden Sonntag unseren Nachthimmel"); the four inner
  ones are small and rocky, the four outer ones huge with no solid
  ground; Merkur is closest, Venus the brightest in the night sky after
  the Moon, Mars the red planet, Jupiter the largest, Saturn has the
  bright rings, the Earth is the only planet where we know there is
  life; planets do not shine themselves; Pluto is a dwarf planet. It ends
  with the skill check. Names and story are written for Twist.
metadata:
  year: klasse-4
  topic: { de: Erde und Weltall, en: Earth and space }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.nature.seasons, world.nature.light-shadow]
  vocabulary: { de: [Sonne, Stern, Erde, Kugel, Mond, Planet, Sonnensystem, drehen, kreisen, Tag, Nacht, Osten, Süden, Westen, Merkur, Venus, Mars, Jupiter, Saturn, Uranus, Neptun, Zwergplanet, Planetarium] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: day-night, what: { de: "erklären, wie Tag und Nacht entstehen", en: "explaining how day and night happen" } }
    - { id: sun-moon, what: { de: "Sonne, Erde und Mond beschreiben und sagen, was um was kreist", en: "describing the Sun, Earth and Moon and saying what goes round what" } }
    - { id: planets, what: { de: "die acht Planeten in ihrer Reihenfolge nennen und einige beschreiben", en: "naming the eight planets in order and describing some of them" } }
  misconceptions:
    - id: sun-goes-round
      what: Thinks the Sun goes round the Earth every day, or switches off at night
      addressed: "lesson 1 Learn with the lamp and the ball; l1-f5, l1-n2, l1-n3 and l2-c1, l2-c12"
    - id: moon-shines
      what: Thinks the Moon and the planets shine by their own light
      addressed: "lesson 1 Learn on the Moon and lesson 2 Learn on the planets; l1-f4, l1-s1, l1-n5, l2-s1 and l2-c10"
    - id: night-everywhere
      what: Thinks it is day or night everywhere on Earth at the same time
      addressed: "lesson 1 Learn on Sydney; l1-f3, l1-s3 and l2-c2"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Tag und Nacht", en: "Day and night" }
    goal:
      de: "Finde heraus, wie Tag und Nacht entstehen. Die Erde dreht sich zum Beispiel einmal am Tag um sich selbst."
      en: "Find out how day and night happen. The Earth, for example, turns once a day."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "In welcher Jahreszeit sind die Tage bei uns am längsten?"
            options: ["im Sommer", "im Winter", "im Herbst"]
            answer: "im Sommer"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie entsteht ein Schatten?"
            options: ["Ein Gegenstand hält das Licht auf.", "Das Licht wird schwarz.", "Die Sonne malt ihn auf den Boden."]
            answer: "Ein Gegenstand hält das Licht auf."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "An einem Abend im Dezember liegt Juri im Bett. Draußen ist es dunkel. Da ruft Tante Mira aus Sydney in Australien an. Bei ihr scheint die Sonne!\n\nWie kann das sein?"
            say: "An einem Abend im Dezember liegt Juri im Bett. Draußen ist es schon dunkel. Da ruft Tante Mira an. Sie wohnt in Sydney, in Australien, und bei ihr scheint gerade die Sonne! Was glaubst du: Wie kann das sein?"
            show: { object: moon }
          - text: "Die Erde ist eine riesige Kugel. Sie dreht sich, einmal in ungefähr 24 Stunden."
            say: "Oma holt eine Lampe und einen Ball. Die Lampe ist die Sonne, der Ball ist die Erde. Die Erde ist eine riesige Kugel, und sie dreht sich. Für eine ganze Drehung braucht sie ungefähr vierundzwanzig Stunden, also einen Tag und eine Nacht."
            show: { object: ball }
          - text: "Die Seite der Erde, die zur Sonne zeigt, hat Tag. Die andere Seite hat Nacht."
            say: "Oma leuchtet mit der Lampe auf den Ball. Die Seite, die zur Lampe zeigt, ist hell. Dort ist Tag. Die andere Seite liegt im Schatten. Dort ist Nacht. Australien liegt auf der anderen Seite der Erde. Wenn Juri schlafen geht, dreht sich Australien gerade zur Sonne hin."
            show: { object: lamp }
          - text: "Die Sonne geht im Osten auf. Mittags steht sie im Süden. Im Westen geht sie unter."
            say: "Für uns sieht es so aus, als ob die Sonne über den Himmel wandert. Morgens geht sie im Osten auf, mittags steht sie im Süden, und abends geht sie im Westen unter. In Wirklichkeit dreht sich die Erde, und wir drehen uns mit ihr. Die Sonne kreist nicht um die Erde."
            show: { object: sun }
          - text: "Die Sonne ist ein Stern. Sie leuchtet selbst."
            say: "Die Sonne ist ein Stern, eine riesige, glühend heiße Kugel. Sie leuchtet selbst. Die vielen Sterne am Nachthimmel sind auch Sonnen. Sie sind nur so weit weg, dass sie ganz klein aussehen."
            show: { object: star }
          - text: "Der Mond leuchtet nicht selbst. Die Sonne strahlt ihn an. Er kreist in ungefähr einem Monat um die Erde."
            say: "Und der Mond? Er leuchtet nicht selbst. Die Sonne strahlt ihn an, und wir sehen das Licht, das von ihm zurückkommt. Der Mond kreist um die Erde. Für eine Runde braucht er ungefähr einen Monat."
            show: { object: moon }
          - text: "Die Erde kreist in einem Jahr einmal um die Sonne."
            say: "Auch die Erde ist unterwegs. Sie kreist um die Sonne. Für eine ganze Runde braucht sie ein Jahr. Und während dieser Runde dreht sie sich ungefähr dreihundertfünfundsechzigmal um sich selbst."
            show: { object: earth }
          - text: "Wusstest du? Am Äquator dreht sich die Erde schneller, als ein Flugzeug fliegt."
            say: "Wusstest du? Am Äquator, rund um die Mitte der Erde, saust der Boden mit über tausendsechshundert Kilometern pro Stunde herum. Das ist schneller, als ein Flugzeug fliegt! Du merkst davon nichts, weil sich alles mit dir mitdreht: die Luft, die Häuser und du."
            show: { object: earth }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie lange braucht die Erde, um sich einmal um sich selbst zu drehen?"
                options: ["ungefähr 24 Stunden", "ungefähr eine Woche", "ungefähr ein Jahr"]
                answer: "ungefähr 24 Stunden"
                hints:
                  - "Eine Drehung bringt einen Tag und eine Nacht."
                  - "Wie viele Stunden haben ein Tag und eine Nacht zusammen?"
                  - "Ungefähr 24 Stunden."
              - id: l1-f2
                type: image_multiple_choice
                text: "Oma zeigt, wie Tag und Nacht entstehen. Was ist bei ihr die Sonne?"
                options: [{ object: lamp }, { object: ball }, { object: bed }]
                answer: lamp
                feedback:
                  bed: "Das Bett als Sonne? Darin schläft Juri! Die Sonne leuchtet, also nimmt Oma die Lampe."
                hints:
                  - "Die Sonne leuchtet selbst."
                  - "Was von Omas Sachen kann leuchten?"
                  - "Die Lampe."
                difficulty: easy
              - id: l1-f3
                type: true_false
                text: "Wenn bei uns Nacht ist, ist auf der anderen Seite der Erde Tag. Stimmt das?"
                answer: true
                hints:
                  - "Denk an die Lampe und den Ball."
                  - "Eine Hälfte des Balls ist hell, die andere dunkel."
                  - "Ja, auf der anderen Seite ist Tag."
              - id: l1-f4
                type: sorting
                text: "Leuchtet es selbst, oder wird es angestrahlt? Sortiere."
                bins:
                  - { id: selbst, show: { text: "leuchtet selbst" }, say: "leuchtet selbst" }
                  - { id: ange, show: { text: "wird angestrahlt" }, say: "wird angestrahlt" }
                options:
                  - { object: sun, bin: selbst }
                  - { object: star, bin: selbst }
                  - { object: moon, bin: ange }
                  - { object: earth, bin: ange }
                hints:
                  - "Sterne sind Sonnen."
                  - "Mond und Erde bekommen ihr Licht von der Sonne."
                  - "Sonne und Stern leuchten selbst. Mond und Erde werden angestrahlt."
              - id: l1-f5
                type: multiple_choice
                text: "Warum sieht es so aus, als ob die Sonne über den Himmel wandert?"
                options: ["Weil sich die Erde dreht.", "Weil die Sonne um die Erde rennt.", "Weil der Wind die Sonne schiebt."]
                answer: "Weil sich die Erde dreht."
                feedback:
                  "Weil der Wind die Sonne schiebt.": "Der Wind schiebt Wolken, aber keine Sonne! Die Erde dreht sich, und wir drehen uns mit."
                hints:
                  - "Die Sonne kreist nicht um die Erde."
                  - "Wer dreht sich, und wir drehen uns mit?"
                  - "Weil sich die Erde dreht."
              - id: l1-f6
                type: fill_in_blank
                text: "Welche Himmelsrichtungen passen?"
                frame: "Die Sonne geht im _ auf und im _ unter."
                options: ["Osten", "Westen", "Norden"]
                answer: ["Osten", "Westen"]
                hints:
                  - "Morgens und abends steht die Sonne auf verschiedenen Seiten."
                  - "Im Norden steht die Sonne bei uns nie."
                  - "Osten, dann Westen."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Der Mond leuchtet selbst, wie eine Lampe. Stimmt das?"
                answer: false
                hints: ["Woher bekommt der Mond sein Licht?"]
              - id: l1-s2
                type: matching
                text: "Was passt? Verbinde."
                pairs:
                  - { left: { object: earth }, right: { text: "dreht sich einmal am Tag um sich selbst" } }
                  - { left: { object: moon }, right: { text: "kreist in ungefähr einem Monat um die Erde" } }
                  - { left: { object: sun }, right: { text: "ein Stern, der selbst leuchtet" } }
                hints: ["Nur eins davon leuchtet selbst, und nur eins kreist um die Erde."]
              - id: l1-s3
                type: multiple_choice
                text: "Bei Juri ist es Abend und dunkel. Warum scheint bei Tante Mira in Sydney die Sonne?"
                options: ["Australien zeigt gerade zur Sonne.", "In Australien gibt es eine zweite Sonne.", "Australien ist näher am Mond."]
                answer: "Australien zeigt gerade zur Sonne."
                hints: ["Australien liegt auf der anderen Seite der Erdkugel."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Was leuchtet selbst?"
                options: [{ object: sun }, { object: moon }, { object: ball }]
                answer: sun
                hints: ["Es ist ein Stern."]
              - id: l1-s5
                type: true_false
                text: "Die Erde braucht ein Jahr, um einmal um die Sonne zu kreisen. Stimmt das?"
                answer: true
                hints: ["Eine Runde um die Sonne dauert so lange wie alle vier Jahreszeiten zusammen."]
              - id: l1-s6
                type: multiple_choice
                text: "Wo steht die Sonne bei uns mittags?"
                options: ["im Süden", "im Norden", "im Osten"]
                answer: "im Süden"
                hints: ["Morgens Osten, abends Westen. Und dazwischen?"]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Ein Tag mit der Sonne. Bring es in die richtige Reihenfolge."
                options: ["Die Sonne geht im Westen unter.", "Die Sonne geht im Osten auf.", "Es ist Nacht.", "Mittags steht die Sonne im Süden."]
                slot_count: 4
                answer: ["Die Sonne geht im Osten auf.", "Mittags steht die Sonne im Süden.", "Die Sonne geht im Westen unter.", "Es ist Nacht."]
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "Die Sonne kreist jeden Tag einmal um die Erde. Stimmt das?"
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Warum gibt es Tag und Nacht?"
                options: ["Die Erde dreht sich, und immer nur eine Hälfte zeigt zur Sonne.", "Die Sonne geht nachts aus.", "Der Mond schiebt sich jede Nacht vor die Sonne."]
                answer: "Die Erde dreht sich, und immer nur eine Hälfte zeigt zur Sonne."
              - id: l1-n4
                type: matching
                text: "Was dauert wie lange? Verbinde."
                pairs:
                  - { left: { text: "Die Erde dreht sich einmal um sich selbst." }, right: { text: "ungefähr 24 Stunden" } }
                  - { left: { text: "Der Mond kreist einmal um die Erde." }, right: { text: "ungefähr ein Monat" } }
                  - { left: { text: "Die Erde kreist einmal um die Sonne." }, right: { text: "ein Jahr" } }
              - id: l1-n5
                type: true_false
                text: "Der Mond wird von der Sonne angestrahlt. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist die Sonne?"
            options: ["ein Stern", "ein Planet", "ein Mond"]
            answer: "ein Stern"
          - id: l1-c2
            type: true_false
            text: "Auf der Seite der Erde, die zur Sonne zeigt, ist Tag. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "In welcher Himmelsrichtung geht die Sonne unter?"
            options: ["im Westen", "im Osten", "im Norden"]
            answer: "im Westen"
          - id: l1-c4
            type: true_false
            text: "Die Erde dreht sich in einer Woche einmal um sich selbst. Stimmt das?"
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Was kreist um die Erde?"
            options: [{ object: moon }, { object: sun }, { object: star }]
            answer: moon
          - id: l1-c6
            type: multiple_choice
            text: "Warum sehen wir den Mond leuchten?"
            options: ["Die Sonne strahlt ihn an.", "Er hat innen Lampen.", "Er brennt wie ein Feuer."]
            answer: "Die Sonne strahlt ihn an."

  - n: 2
    title: { de: "Die acht Planeten", en: "The eight planets" }
    goal:
      de: "Lerne die acht Planeten und ihre Reihenfolge kennen. Ein Merksatz hilft dir: Mein Vater erklärt mir jeden Sonntag unseren Nachthimmel."
      en: "Get to know the eight planets and their order. A memory sentence helps you: My Very Easy Method Just Speeds Up Naming."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Die Sonne ist ein Stern. Stimmt das?"
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie lange braucht die Erde für eine Runde um die Sonne?"
            options: ["ein Jahr", "einen Tag", "eine Stunde"]
            answer: "ein Jahr"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Juris Klasse ist im Planetarium. Frau Brandt fragt: „Wie viele Planeten kreisen um die Sonne?“\n\nWas glaubst du?"
            say: "Juris Klasse besucht das Planetarium. Über den Kindern leuchtet ein künstlicher Sternenhimmel. Frau Brandt fragt: Wie viele Planeten kreisen um unsere Sonne? Was glaubst du?"
            show: { object: star }
          - text: "Acht Planeten kreisen um die Sonne. Die Erde ist einer davon. Alle zusammen heißen Sonnensystem."
            say: "Es sind acht Planeten! Die Erde ist einer davon. Die Sonne in der Mitte und alles, was um sie kreist, heißt zusammen Sonnensystem. Die Planeten leuchten nicht selbst. Wie der Mond werden sie von der Sonne angestrahlt."
            show: { object: sun }
          - text: "Von der Sonne aus: Merkur, Venus, Erde, Mars, Jupiter, Saturn, Uranus, Neptun."
            say: "Von der Sonne aus nach außen heißen sie: Merkur, Venus, Erde, Mars, Jupiter, Saturn, Uranus und Neptun."
          - text: "Merksatz: Mein Vater erklärt mir jeden Sonntag unseren Nachthimmel."
            say: "Frau Brandt kennt einen Merksatz: Mein Vater erklärt mir jeden Sonntag unseren Nachthimmel. Jedes Wort fängt an wie ein Planet. Mein: Merkur. Vater: Venus. Erklärt: Erde. Mir: Mars. Jeden: Jupiter. Sonntag: Saturn. Unseren: Uranus. Nachthimmel: Neptun."
          - text: "Die vier inneren Planeten sind klein und aus Gestein. Die vier äußeren sind riesig und haben keinen festen Boden."
            say: "Merkur, Venus, Erde und Mars sind innen, nahe an der Sonne. Sie sind klein und aus Gestein. Jupiter, Saturn, Uranus und Neptun sind außen. Sie sind riesig und haben keinen festen Boden, auf dem man stehen könnte. Jupiter und Saturn bestehen vor allem aus Gas."
          - text: "Merkur: am nächsten an der Sonne.\nVenus: nach dem Mond das Hellste am Nachthimmel.\nMars: der rote Planet.\nJupiter: der größte Planet.\nSaturn: große, helle Ringe."
            say: "Jeder Planet ist besonders. Merkur ist der Sonne am nächsten und der kleinste Planet. Venus leuchtet am Nachthimmel heller als jeder Stern, nur der Mond ist heller. Mars sieht rötlich aus, darum heißt er der rote Planet. Jupiter ist der größte Planet. Saturn hat große, helle Ringe aus Eis und Gestein. Und die Erde ist der einzige Planet, von dem wir wissen, dass es dort Leben gibt."
          - text: "Pluto ist kein Planet mehr. Er heißt Zwergplanet."
            say: "Vielleicht hast du schon von Pluto gehört. Früher zählte er zu den Planeten. Seit 2006 nennen ihn die Forscherinnen und Forscher einen Zwergplaneten, weil er so klein ist. Darum gibt es acht Planeten."
            show: { object: pluto }
          - text: "Wusstest du? In den Jupiter würden mehr als 1000 Erden passen."
            say: "Wusstest du? Der Jupiter ist so riesig, dass mehr als tausend Erden in ihn hineinpassen würden!"
            show: { object: jupiter }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Die vier inneren Planeten: Ordne sie von der Sonne aus."
                options: [{ object: earth }, { object: mercury }, { object: mars }, { object: venus }]
                slot_count: 4
                answer: [mercury, venus, earth, mars]
                hints:
                  - "Denk an den Merksatz: Mein Vater erklärt mir ..."
                  - "Mein: Merkur. Vater: Venus. Erklärt: Erde. Mir: Mars."
                  - "Merkur, Venus, Erde, Mars."
              - id: l2-f2
                type: multiple_choice
                text: "Welcher Planet ist der größte?"
                options: ["Jupiter", "Merkur", "Erde"]
                answer: "Jupiter"
                hints:
                  - "Der größte Planet gehört zu den äußeren Planeten."
                  - "Mehr als tausend Erden würden in ihn passen."
                  - "Jupiter."
                difficulty: easy
              - id: l2-f3
                type: true_false
                text: "Die Erde ist ein Planet. Stimmt das?"
                show: { object: earth }
                answer: true
                hints:
                  - "Wie viele Planeten kreisen um die Sonne, und wer gehört dazu?"
                  - "Im Merksatz steht „erklärt“ für einen Planeten."
                  - "Ja, die Erde ist ein Planet."
                difficulty: easy
              - id: l2-f4
                type: sorting
                text: "Innen oder außen? Sortiere die Planeten."
                bins:
                  - { id: innen, show: { text: "innen, klein, aus Gestein" }, say: "innen" }
                  - { id: aussen, show: { text: "außen, riesig" }, say: "außen" }
                options:
                  - { object: mercury, bin: innen }
                  - { object: mars, bin: innen }
                  - { object: saturn, bin: aussen }
                  - { object: neptune, bin: aussen }
                hints:
                  - "Die ersten vier Planeten von der Sonne aus sind innen."
                  - "Merkur, Venus, Erde und Mars sind innen."
                  - "Merkur und Mars: innen. Saturn und Neptun: außen."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Planet heißt „der rote Planet“?"
                options: ["Mars", "Venus", "Uranus"]
                answer: "Mars"
                hints:
                  - "Er ist der vierte Planet von der Sonne aus."
                  - "Er kommt direkt nach der Erde."
                  - "Mars."
              - id: l2-f6
                type: fill_in_blank
                text: "Mein Vater erklärt mir jeden Sonntag unseren Nachthimmel."
                frame: "Das Wort „Mein“ steht für _. Das Wort „jeden“ steht für _."
                options: ["Merkur", "Jupiter", "Mars", "Saturn"]
                answer: ["Merkur", "Jupiter"]
                hints:
                  - "Jedes Wort steht für einen Planeten, in der richtigen Reihenfolge."
                  - "Mein ist das erste Wort, jeden das fünfte."
                  - "Mein: Merkur. Jeden: Jupiter."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Die Planeten leuchten selbst, wie die Sonne. Stimmt das?"
                answer: false
                hints: ["Planeten sind wie der Mond. Woher bekommen sie ihr Licht?"]
              - id: l2-s2
                type: matching
                text: "Welcher Planet ist das? Verbinde."
                pairs:
                  - { left: { object: mercury }, right: { text: "am nächsten an der Sonne" } }
                  - { left: { object: saturn }, right: { text: "große, helle Ringe" } }
                  - { left: { object: jupiter }, right: { text: "der größte Planet" } }
                  - { left: { object: mars }, right: { text: "der rote Planet" } }
                hints: ["Merkur steht im Merksatz ganz vorne."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viele Planeten kreisen um unsere Sonne?"
                options: ["8", "9", "12"]
                answer: "8"
                hints: ["Zähl die Wörter im Merksatz."]
              - id: l2-s4
                type: ordering
                text: "Die vier äußeren Planeten: Ordne sie von der Sonne aus."
                options: [{ object: uranus }, { object: saturn }, { object: neptune }, { object: jupiter }]
                slot_count: 4
                answer: [jupiter, saturn, uranus, neptune]
                hints: ["Jeden Sonntag unseren Nachthimmel."]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Planet leuchtet am Nachthimmel heller als jeder Stern?"
                options: ["Venus", "Neptun", "Uranus"]
                answer: "Venus"
                hints: ["Es ist der zweite Planet von der Sonne aus."]
              - id: l2-s6
                type: true_false
                text: "Auf dem Jupiter kann man spazieren gehen wie auf der Erde. Stimmt das?"
                show: { object: jupiter }
                answer: false
                hints: ["Haben die äußeren Planeten einen festen Boden?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Alle acht Planeten: Ordne sie von der Sonne aus."
                options: [{ object: saturn }, { object: venus }, { object: neptune }, { object: earth }, { object: jupiter }, { object: mercury }, { object: uranus }, { object: mars }]
                slot_count: 8
                answer: [mercury, venus, earth, mars, jupiter, saturn, uranus, neptune]
                difficulty: stretch
              - id: l2-n2
