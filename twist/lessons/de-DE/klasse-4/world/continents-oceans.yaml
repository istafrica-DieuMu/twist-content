# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.continents-oceans
skill: world.space.continents-oceans
curriculum: de-DE
language: de
title:
  de: Kontinente und Ozeane
  en: Continents and oceans
summary: >
  Kapitänin Frieda sails around the world and sends Jonas photos from
  every continent. Lesson 1 opens with the guess whether the Earth has
  more land or more water, then names the seven continents on the drawn
  world map (numbers for the continents, by their names in Learn): Europe with Germany in it, Africa to the
  south, Asia to the east and the largest, North and South America across
  the Atlantic, Australia the smallest, Antarctica under ice in the far
  south, and no continent at the North Pole. A continent is not a country,
  except Australia, which is both. Lesson 2 names the three big oceans,
  Pacific (the largest, seen on both edges of the map), Atlantic and
  Indian Ocean, and where each lies; all oceans join, so Frieda can sail
  from Germany to Australia. It ends with the skill check. The oceans carry
  letters on the map (A, I, P) as the continents carry numbers.
metadata:
  year: klasse-4
  topic: { de: Deutschland und die Welt, en: Germany and the world }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.space.map-symbols, world.space.compass]
  also_practises: [world.space.compass]
  vocabulary: { de: [Erde, Kontinent, Ozean, Weltkarte, Europa, Afrika, Asien, Nordamerika, Südamerika, Australien, Antarktis, Pazifik, Atlantik, Indischer Ozean, Nordpol, Südpol] }
  forms: [text, audio, picture, drawn]
  drawn: [world-map]
  facets: []
  parts:
    - { id: continents, what: { de: "die sieben Kontinente nennen, auf der Weltkarte finden und vergleichen", en: "naming the seven continents, finding them on the world map and comparing them" } }
    - { id: oceans, what: { de: "die drei großen Ozeane nennen und sagen, zwischen welchen Kontinenten sie liegen", en: "naming the three big oceans and saying which continents they lie between" } }
    - { id: world, what: { de: "Länder, Tiere und den eigenen Ort einem Kontinent zuordnen und Land und Kontinent unterscheiden", en: "placing countries, animals and one's own town on a continent and telling a country from a continent" } }
  misconceptions:
    - id: continent-is-country
      what: Takes a continent for a country (Afrika ist ein Land) or a country for a continent
      addressed: "lesson 1 Learn screen on continent and country; l1-f4, l1-s3, l1-n1 and l2-c17, l2-c18, l2-c20"
    - id: oceans-separate
      what: Thinks the oceans are separate seas with no way between them, or that the Pacific appears twice because there are two
      addressed: "lesson 2 opens with the guess about sailing to Australia and explains the Pacific on both edges; l2-f3, l2-f6 and l2-c13"
    - id: north-pole-continent
      what: Thinks there is a continent at the North Pole as at the South Pole
      addressed: "lesson 1 Learn screen on Antarctica; l2-s5"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Sieben Kontinente", en: "Seven continents" }
    goal:
      de: "Lerne die sieben Kontinente kennen und finde sie auf der Weltkarte. Deutschland zum Beispiel liegt in Europa."
      en: "Get to know the seven continents and find them on the world map. Germany, for example, is in Europe."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Oben auf der Karte ist Norden. Welche Himmelsrichtung ist rechts?"
            options: ["Osten", "Westen", "Süden"]
            answer: "Osten"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Auf den meisten Karten ist das Meer blau. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Kapitänin Frieda segelt einmal um die ganze Erde.\n\nWas glaubst du: Gibt es auf der Erde mehr Land oder mehr Wasser?"
            say: "Kapitänin Frieda segelt mit ihrem Schiff einmal um die ganze Erde. Von jeder Station schickt sie Jonas ein Foto. Was glaubst du: Gibt es auf der Erde mehr Land oder mehr Wasser?"
            show: { object: ship }
          - text: "Mehr Wasser! Von 10 Teilen der Erde sind ungefähr 7 Meer.\nDie großen Landflächen heißen Kontinente. Es gibt 7 Kontinente."
            say: "Mehr Wasser! Teilst du die Erde in zehn gleiche Teile, sind ungefähr sieben davon Meer. Dazwischen liegen riesige Landflächen. Sie heißen Kontinente. Es gibt sieben Kontinente."
          - text: "1 Nordamerika, 2 Südamerika, 3 Europa, 4 Afrika, 5 Asien, 6 Australien, 7 Antarktis"
            say: "Hier ist eine einfache Weltkarte. Oben ist Norden. Grün ist Land, blau ist Meer. Die Zahlen sind die Kontinente: eins Nordamerika, zwei Südamerika, drei Europa, vier Afrika, fünf Asien, sechs Australien und sieben die Antarktis."
            show: { drawn: world-map, names: { north-america: "1 Nordamerika", south-america: "2 Südamerika", europe: "3 Europa", africa: "4 Afrika", asia: "5 Asien", australia: "6 Australien", antarctica: "7 Antarktis" } }
          - text: "3 Europa: Hier liegt Deutschland.\n4 Afrika liegt südlich von Europa.\n5 Asien liegt östlich von Europa. Asien ist der größte Kontinent."
            say: "Frieda startet in Europa, denn hier liegt Deutschland, ungefähr in der Mitte. Südlich von Europa, über das Mittelmeer, liegt Afrika. Östlich von Europa liegt Asien. Asien ist der größte Kontinent, und dort leben die meisten Menschen."
            show: { drawn: world-map, highlight: [europe, africa, asia], mark: germany, names: { north-america: "1 Nordamerika", south-america: "2 Südamerika", europe: "3 Europa", africa: "4 Afrika", asia: "5 Asien", australia: "6 Australien", antarctica: "7 Antarktis" } }
          - text: "1 Nordamerika und 2 Südamerika liegen westlich, auf der anderen Seite des Meeres.\n6 Australien ist der kleinste Kontinent.\n7 Die Antarktis liegt ganz im Süden, am Südpol, unter dickem Eis."
            say: "Westlich von Europa und Afrika, auf der anderen Seite des großen Meeres, liegen Nordamerika und Südamerika. Südöstlich von Asien liegt Australien, der kleinste Kontinent. Ganz im Süden, rund um den Südpol, liegt die Antarktis. Sie ist fast ganz von dickem Eis bedeckt, und dort wohnen nur Forscherinnen und Forscher für eine Zeit. Am Nordpol gibt es übrigens keinen Kontinent, nur Meer, auf dem Eis schwimmt."
            show: { drawn: world-map, highlight: [north-america, south-america, australia, antarctica], names: { north-america: "1 Nordamerika", south-america: "2 Südamerika", europe: "3 Europa", africa: "4 Afrika", asia: "5 Asien", australia: "6 Australien", antarctica: "7 Antarktis" } }
          - text: "Ein Kontinent ist kein Land. Auf einem Kontinent liegen viele Länder.\nEuropa: Deutschland, Frankreich, Polen\nAsien: China\nAfrika: Kenia\nNordamerika: Kanada\nSüdamerika: Brasilien\nAustralien ist ein Land und ein Kontinent."
            say: "Aufgepasst: Ein Kontinent ist kein Land. Auf einem Kontinent liegen viele Länder. In Europa liegen zum Beispiel Deutschland, Frankreich und Polen. China liegt in Asien, Kenia in Afrika, Kanada in Nordamerika und Brasilien in Südamerika. Nur Australien ist beides: ein Land und ein ganzer Kontinent."
          - text: "Wusstest du? Die Antarktis ist die größte Wüste der Erde."
            say: "Wusstest du? Die Antarktis ist die größte Wüste der Erde. Eine Wüste muss nicht heiß sein. Wüste heißt: Es fällt fast kein Regen und kaum Schnee. In der Antarktis ist das so. Das Eis dort ist in sehr, sehr langer Zeit gewachsen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Friedas Reise beginnt in Deutschland. Auf welchem Kontinent startet sie?"
                options: ["Europa", "Afrika", "Asien"]
                answer: "Europa"
                hints:
                  - "Deutschland ist ein Land. Es liegt auf einem Kontinent."
                  - "Auf diesem Kontinent liegen auch Frankreich und Polen."
                  - "Deutschland liegt in Europa."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Die 3 ist Europa. Frieda segelt von Europa nach Süden zur 4. Welcher Kontinent ist das?"
                show: { drawn: world-map, names: { north-america: "1", south-america: "2", europe: "3", africa: "4", asia: "5", australia: "6", antarctica: "7" } }
                options: ["Afrika", "Asien", "Australien"]
                answer: "Afrika"
                hints:
                  - "Süden ist auf der Karte unten."
                  - "Unter Europa liegt die 4. Welcher Kontinent liegt südlich von Europa?"
                  - "Südlich von Europa liegt Afrika."
              - id: l1-f3
                type: true_false
                text: "Auf der Erde gibt es sieben Kontinente. Stimmt das?"
                answer: true
                hints:
                  - "Zähl die Zahlen auf der Weltkarte."
                  - "Die Zahlen gehen von 1 bis 7."
                  - "Ja, es gibt sieben Kontinente."
              - id: l1-f4
                type: sorting
                text: "Kontinent oder Land? Sortiere."
                bins:
                  - { id: kont, show: { text: "Kontinent" }, say: "Kontinent" }
                  - { id: land, show: { text: "Land" }, say: "Land" }
                options:
                  - { text: "Afrika", bin: kont }
                  - { text: "Deutschland", bin: land }
                  - { text: "Asien", bin: kont }
                  - { text: "Frankreich", bin: land }
                hints:
                  - "Auf einem Kontinent liegen viele Länder."
                  - "Deutschland und Frankreich liegen beide auf demselben Kontinent."
                  - "Kontinente: Afrika und Asien. Länder: Deutschland und Frankreich."
              - id: l1-f5
                type: multiple_choice
                text: "Frieda fotografiert Giraffen in freier Natur. Auf welchem Kontinent ist sie?"
                show: { object: giraffe }
                options: ["in Afrika", "in Europa", "in der Antarktis"]
                answer: "in Afrika"
                feedback:
                  "in der Antarktis": "Eine Giraffe im ewigen Eis würde ganz schön frieren! Giraffen leben in Afrika."
                hints:
                  - "In Europa leben Giraffen nur im Zoo."
                  - "Giraffen brauchen Wärme und Bäume mit Blättern."
                  - "Giraffen leben in Afrika."
              - id: l1-f6
                type: ordering
                text: "Ordne die Kontinente vom größten zum kleinsten."
                options: ["Europa", "Australien", "Asien"]
                slot_count: 3
                answer: ["Asien", "Europa", "Australien"]
                hints:
                  - "Einer ist der größte Kontinent, einer der kleinste."
                  - "Asien ist der größte, Australien der kleinste."
                  - "Asien, Europa, Australien."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Kontinent ist der größte?"
                options: ["Asien", "Europa", "Australien"]
                answer: "Asien"
                hints: ["Auf diesem Kontinent leben auch die meisten Menschen. Er liegt östlich von Europa."]
              - id: l1-s2
                type: matching
                text: "Auf welchem Kontinent liegt das Land? Verbinde."
                pairs:
                  - { left: { text: "China" }, right: { text: "Asien" } }
                  - { left: { text: "Brasilien" }, right: { text: "Südamerika" } }
                  - { left: { text: "Kanada" }, right: { text: "Nordamerika" } }
                  - { left: { text: "Kenia" }, right: { text: "Afrika" } }
                hints: ["Kanada liegt im Norden von Amerika, Brasilien im Süden."]
              - id: l1-s3
                type: true_false
                text: "Afrika ist ein Land. Stimmt das?"
                answer: false
                hints: ["Auf Afrika liegen viele Länder, zum Beispiel Kenia."]
              - id: l1-s4
                type: multiple_choice
                text: "Frieda segelt von Europa nach Westen über das große Meer. Wo kommt sie an?"
                show: { drawn: world-map, names: { north-america: "1", south-america: "2", europe: "3", africa: "4", asia: "5", australia: "6", antarctica: "7" } }
                options: ["in Nordamerika", "in Asien", "in Afrika"]
                answer: "in Nordamerika"
                hints: ["Westen ist auf der Karte links. Was liegt links von der 3, auf gleicher Höhe?"]
              - id: l1-s5
                type: multiple_choice
                text: "Auf welchem Kontinent liegt fast alles unter dickem Eis?"
                options: ["in der Antarktis", "in Afrika", "in Australien"]
                answer: "in der Antarktis"
                hints: ["Dieser Kontinent liegt ganz im Süden, rund um den Südpol."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Kontinent oder Land? Sortiere."
                bins:
                  - { id: kont, show: { text: "Kontinent" }, say: "Kontinent" }
                  - { id: land, show: { text: "Land" }, say: "Land" }
                options:
                  - { text: "Polen", bin: land }
                  - { text: "Europa", bin: kont }
                  - { text: "Kenia", bin: land }
                  - { text: "Südamerika", bin: kont }
              - id: l1-n2
                type: true_false
                text: "Asien ist der kleinste Kontinent. Stimmt das?"
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Welcher Kontinent liegt östlich von Europa?"
                options: ["Asien", "Nordamerika", "Südamerika"]
                answer: "Asien"
              - id: l1-n4
                type: image_multiple_choice
                text: "Frieda ist in Paris, in Europa. Was fotografiert sie dort?"
                options: [{ object: eiffel-tower }, { object: giraffe }, { object: zebra }]
                answer: eiffel-tower
              - id: l1-n5
                type: text_input
                text: "Frieda war schon auf 4 Kontinenten. Auf wie vielen Kontinenten war sie noch nicht?"
                answer: "3"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Auf welchem Kontinent liegt Frankreich?"
            options: ["Europa", "Asien", "Afrika"]
            answer: "Europa"
          - id: l1-c2
            type: true_false
            text: "Die Antarktis liegt ganz im Norden der Erde. Stimmt das?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Welcher Kontinent liegt südlich von Europa?"
            options: ["Afrika", "Asien", "Nordamerika"]
            answer: "Afrika"
          - id: l1-c4
            type: true_false
            text: "Asien ist der größte Kontinent. Stimmt das?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Was ist ein Kontinent?"
            options: ["eine riesige Landfläche mit vielen Ländern", "ein großes Meer", "ein Bundesland"]
            answer: "eine riesige Landfläche mit vielen Ländern"
          - id: l1-c6
            type: multiple_choice
            text: "Welches Land ist zugleich ein ganzer Kontinent?"
            options: ["Australien", "China", "Deutschland"]
            answer: "Australien"

  - n: 2
    title: { de: "Über drei Ozeane", en: "Across three oceans" }
    goal:
      de: "Lerne die drei großen Ozeane kennen und sag, wo sie liegen. Der Atlantik zum Beispiel liegt zwischen Europa und Amerika."
      en: "Get to know the three big oceans and say where they are. The Atlantic, for example, lies between Europe and America."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Kontinente gibt es?"
            options: ["5", "7", "16"]
            answer: "7"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Deutschland liegt in Asien. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Frieda will mit dem Schiff von Deutschland bis nach Australien.\n\nWas glaubst du: Kann sie den ganzen Weg auf dem Wasser fahren?"
            say: "Jetzt will Kapitänin Frieda mit ihrem Schiff von Deutschland bis nach Australien. Das ist auf der anderen Seite der Erde. Was glaubst du: Kann sie den ganzen Weg auf dem Wasser fahren?"
            show: { object: ship }
          - text: "Ja! Alle Meere der Erde hängen zusammen.\nDie drei größten heißen Ozeane: Pazifik, Atlantik und Indischer Ozean."
            say: "Ja, das kann sie! Alle Meere der Erde hängen zusammen. Die ganz großen Meere heißen Ozeane. Die drei größten sind der Pazifik, der Atlantik und der Indische Ozean. Im hohen Norden und im hohen Süden gibt es noch das Nordpolarmeer und das Südpolarmeer."
          - text: "A Atlantik: zwischen Europa und Afrika auf der einen Seite und Amerika auf der anderen\nI Indischer Ozean: zwischen Afrika, Asien und Australien\nP Pazifik: zwischen Asien und Australien auf der einen Seite und Amerika auf der anderen"
            say: "Auf der Weltkarte stehen jetzt Buchstaben für die Ozeane. Der Atlantik, A, liegt zwischen Europa und Afrika auf der einen Seite und Amerika auf der anderen. Der Indische Ozean, I, liegt zwischen Afrika, Asien und Australien. Der Pazifik, P, liegt zwischen Asien und Australien auf der einen Seite und Amerika auf der anderen."
            show: { drawn: world-map, names: { north-america: "1 Nordamerika", south-america: "2 Südamerika", europe: "3 Europa", africa: "4 Afrika", asia: "5 Asien", australia: "6 Australien", antarctica: "7 Antarktis", atlantic: "A Atlantik", indian: "I Indischer\nOzean", pacific: "P Pazifik" } }
          - text: "Der Pazifik ist der größte Ozean. Auf der Karte liegt er ganz links und ganz rechts."
            say: "Der Pazifik ist der größte Ozean. Auf unserer Karte steht das P ganz links. Aber auch das Meer ganz rechts, östlich von Asien und Australien, ist der Pazifik. Das ist ein und derselbe Ozean! Die Erde ist rund wie ein Ball. Eine Karte muss sie flach machen, und dabei wird der Pazifik in der Mitte durchgeschnitten. Der zweitgrößte Ozean ist der Atlantik."
            show: { drawn: world-map, highlight: [pacific], names: { north-america: "1", south-america: "2", europe: "3", africa: "4", asia: "5", australia: "6", antarctica: "7", atlantic: "A", indian: "I", pacific: "P" } }
          - text: "Friedas Weg nach Australien: Nordsee, Atlantik, um Afrika herum, Indischer Ozean, Australien."
            say: "So fährt Frieda nach Australien. Sie startet in Deutschland an der Nordsee. Dann fährt sie in den Atlantik und nach Süden, an Afrika entlang und um Afrika herum. Danach segelt sie über den Indischen Ozean nach Osten, bis sie in Australien ankommt."
            show: { object: anchor }
          - text: "Wusstest du? Der Pazifik ist größer als alle Kontinente zusammen."
            say: "Wusstest du? Der Pazifik ist so riesig, dass alle sieben Kontinente zusammen hineinpassen würden, und es wäre sogar noch Platz übrig."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Ozean ist der größte?"
                options: ["der Pazifik", "der Atlantik", "der Indische Ozean"]
                answer: "der Pazifik"
                hints:
                  - "Dieser Ozean liegt auf der Karte ganz links und ganz rechts."
                  - "Auf der Karte steht dort der Buchstabe P."
                  - "Der Pazifik."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Frieda segelt von Europa nach Westen bis nach Amerika. Über welchen Ozean fährt sie?"
                show: { drawn: world-map, names: { north-america: "1", south-america: "2", europe: "3", africa: "4", asia: "5", australia: "6", antarctica: "7", atlantic: "A", indian: "I", pacific: "P" } }
                options: ["über den Atlantik", "über den Pazifik", "über den Indischen Ozean"]
                answer: "über den Atlantik"
                hints:
                  - "Europa ist die 3. Westen ist links."
                  - "Zwischen Europa und Amerika steht ein Buchstabe. Welcher?"
                  - "Dort steht A, der Atlantik."
              - id: l2-f3
                type: true_false
                text: "Alle Meere der Erde hängen zusammen. Stimmt das?"
                answer: true
                hints:
                  - "Denk an Friedas Reise nach Australien."
                  - "Sie ist den ganzen Weg auf dem Wasser gefahren."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: matching
                text: "Wo liegt der Ozean? Verbinde."
                pairs:
                  - { left: { text: "Atlantik" }, right: { text: "zwischen Europa und Amerika" } }
                  - { left: { text: "Indischer Ozean" }, right: { text: "zwischen Afrika und Australien" } }
                  - { left: { text: "Pazifik" }, right: { text: "zwischen Asien und Amerika" } }
                hints:
                  - "Fang mit dem Ozean an, den Frieda nach Amerika überquert hat."
                  - "Der Indische Ozean liegt südlich von Asien, zwischen Afrika und Australien."
                  - "Atlantik Europa und Amerika, Indischer Ozean Afrika und Australien, Pazifik Asien und Amerika."
              - id: l2-f5
                type: sorting
                text: "Kontinent oder Ozean? Sortiere."
                bins:
                  - { id: kont, show: { text: "Kontinent" }, say: "Kontinent" }
                  - { id: ozean, show: { text: "Ozean" }, say: "Ozean" }
                options:
                  - { text: "Atlantik", bin: ozean }
                  - { text: "Afrika", bin: kont }
                  - { text: "Pazifik", bin: ozean }
                  - { text: "Asien", bin: kont }
                hints:
                  - "Ein Kontinent ist Land, ein Ozean ist Wasser."
                  - "Pazifik und Atlantik hast du heute als Ozeane kennengelernt."
                  - "Kontinente: Afrika und Asien. Ozeane: Atlantik und Pazifik."
              - id: l2-f6
                type: ordering
                text: "Bring Friedas Reise nach Australien in die richtige Reihenfolge."
                options: ["Indischer Ozean", "Nordsee", "Australien", "Atlantik"]
                slot_count: 4
                answer: ["Nordsee", "Atlantik", "Indischer Ozean", "Australien"]
                hints:
                  - "Frieda startet in Deutschland."
                  - "Von der Nordsee fährt sie in den Atlantik, dann um Afrika herum."
                  - "Nordsee, Atlantik, Indischer Ozean, Australien."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Zwischen welchen Kontinenten liegt der Indische Ozean?"
                options: ["zwischen Afrika, Asien und Australien", "zwischen Europa und Nordamerika", "zwischen Südamerika und Nordamerika"]
                answer: "zwischen Afrika, Asien und Australien"
                hints: ["Auf der Karte steht das I südlich von Asien, zwischen der 4 und der 6."]
              - id: l2-s2
                type: true_false
                text: "Der Atlantik ist größer als der Pazifik. Stimmt das?"
                answer: false
                hints: ["Der größte Ozean liegt auf der Karte ganz links und ganz rechts."]
              - id: l2-s3
                type: multiple_choice
                text: "Frieda segelt von Asien nach Osten bis nach Amerika. Welchen Ozean überquert sie?"
                options: ["den Pazifik", "den Atlantik", "den Indischen Ozean"]
                answer: "den Pazifik"
                hints: ["Von Asien nach Osten kommst du an den rechten Rand der Karte. Der Ozean dort geht ganz links weiter, beim P."]
              - id: l2-s4
                type: fill_in_blank
                text: "Was passt?"
                frame: "Deutschland liegt in _. Zwischen Europa und Amerika liegt der _."
                options: ["Europa", "Asien", "Atlantik", "Pazifik"]
                answer: ["Europa", "Atlantik"]
                hints: ["Frieda ist von Europa nach Westen über den Atlantik gesegelt."]
              - id: l2-s5
                type: multiple_choice
                text: "Was ist am Nordpol?"
