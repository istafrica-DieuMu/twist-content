# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.climate
skill: world.nature.climate
curriculum: de-DE
language: de
title:
  de: Das Klima verändert sich
  en: The climate is changing
summary: >
  Ida hikes in the Alps with her Opa, who shows her an old photo of a
  glacier that reached much further than today. Lesson 1: Wetter is how
  it is outside today; Klima is how the weather at a place usually is
  over many years (about 30), so one cold day says nothing about the
  climate. The air around the Earth (Lufthülle) keeps warmth in like a
  blanket; without it the Earth would be icy. Burning Kohle, Erdöl and
  Erdgas puts Kohlendioxid into the air, cutting down forests leaves
  fewer trees to take it up, so the blanket holds more warmth and the
  Earth slowly gets warmer: more hot summer days, shrinking glaciers.
  Lesson 2, hopeful: people all over the world work on solutions
  (Windräder, Solaranlagen, protecting forests, planting trees), and Ida's
  class makes a Klima-Plan: walk, cycle, bus and train; save energy; eat
  fruit and vegetables from nearby in their season and waste no food;
  repair and pass things on. It ends with the skill check. Calm and
  factual, no fear, no politics: no parties, politicians, protests or
  current disputes. Names and story are written for Twist.
metadata:
  year: klasse-4
  topic: { de: Energie und Klima, en: Energy and climate }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.nature.weather, world.nature.energy-sources, world.nature.energy-saving]
  also_practises: [world.nature.energy-saving]
  vocabulary: { de: [Wetter, Klima, Klimawandel, Lufthülle, Kohlendioxid, verbrennen, Abgase, Gletscher, abholzen, klimafreundlich, regional, saisonal, reparieren] }
  forms: [text, audio, picture, drawn]
  drawn: [thermometer]
  facets: []
  parts:
    - { id: weather-climate, what: { de: "Wetter und Klima unterscheiden", en: "telling weather from climate" } }
    - { id: cause, what: { de: "einfach erklären, warum es auf der Erde wärmer wird, und Folgen nennen", en: "explaining simply why the Earth is getting warmer, and naming effects" } }
    - { id: action, what: { de: "sagen, was ich selbst für das Klima tun kann", en: "saying what I can do myself for the climate" } }
  misconceptions:
    - id: cold-day-no-change
      what: Takes one cold or snowy day as proof that the climate is not changing, or one hot day as climate
      addressed: "lesson 1 Learn on weather against climate; l1-f2, l1-n1, l1-c6 and l2-c5, l2-c6"
    - id: sun-closer
      what: Thinks the Earth is getting warmer because the sun comes closer or shines stronger
      addressed: "lesson 1 Learn on the Lufthülle and Kohlendioxid; l1-f5, l1-n5 and l2-c11"
    - id: nothing-to-do
      what: Thinks a child can do nothing about the climate, or that nothing can be done at all
      addressed: "lesson 2 Learn on people working on solutions and the Klima-Plan; l2-s1, l2-n4 and l2-c20"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wetter, Klima und eine warme Decke", en: "Weather, climate and a warm blanket" }
    goal:
      de: "Finde heraus, was Wetter und was Klima ist, und warum es auf der Erde langsam wärmer wird. Ein kalter Tag zum Beispiel ist Wetter."
      en: "Find out what weather and climate are, and why the Earth is slowly getting warmer. A cold day, for example, is weather."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie warm ist es?"
            say: "Lies das Thermometer ab. Wie warm ist es?"
            show: { drawn: thermometer, from: -10, to: 30, step: 5, value: 15 }
            options: ["15 °C", "5 °C", "25 °C"]
            answer: "15 °C"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was entsteht, wenn Kohle, Erdöl und Erdgas verbrannt werden?"
            options: ["Abgase wie Kohlendioxid", "frisches Wasser", "neue Kohle"]
            answer: "Abgase wie Kohlendioxid"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Heute schneit es bei Ida. Ihr Bruder Ben ruft: „Siehst du? Die Erde wird gar nicht wärmer!“\n\nHat Ben recht?"
            say: "Heute schneit es bei Ida. Ihr Bruder Ben schaut aus dem Fenster und ruft: Siehst du? Die Erde wird gar nicht wärmer! Was glaubst du: Hat Ben recht?"
            show: { object: snow }
          - text: "Wetter ist, wie es gerade draußen ist. Klima ist, wie das Wetter an einem Ort meistens ist, über viele Jahre."
            say: "Nicht ganz! Ben verwechselt Wetter und Klima. Das Wetter ist, wie es gerade draußen ist: heute Schnee, morgen vielleicht Sonne. Das Klima ist, wie das Wetter an einem Ort meistens ist, über viele Jahre. Forscherinnen und Forscher schauen dafür auf ungefähr dreißig Jahre."
          - text: "Ein kalter Tag ist Wetter. Über viele Jahre ist es auf der Erde wärmer geworden."
            say: "Ein kalter, verschneiter Tag sagt darum nichts über das Klima. Wenn man aber das Wetter vieler Jahre vergleicht, sieht man: Auf der Erde ist es im Durchschnitt wärmer geworden, auch in Deutschland. Das nennt man Klimawandel."
            show: { drawn: thermometer, from: -10, to: 30, step: 5, value: -2 }
          - text: "Die Lufthülle um die Erde hält die Wärme fest, wie eine Decke."
            say: "Um die Erde liegt eine Hülle aus Luft. Die Sonne wärmt die Erde, und die Lufthülle hält einen Teil der Wärme fest, wie eine Decke. Das ist gut so, denn sonst wäre es bei uns eiskalt."
            show: { object: sun }
          - text: "Wusstest du? Ohne ihre Lufthülle wäre es auf der Erde im Durchschnitt ungefähr minus 18 Grad kalt."
            say: "Wusstest du? Ohne ihre Lufthülle wäre es auf der Erde im Durchschnitt ungefähr minus achtzehn Grad kalt, so kalt wie in einer Tiefkühltruhe. Mit der Lufthülle sind es im Durchschnitt ungefähr plus fünfzehn Grad."
          - text: "Beim Verbrennen von Kohle, Erdöl und Erdgas kommt Kohlendioxid in die Luft. Dann hält die Decke mehr Wärme fest."
            say: "Kraftwerke, Heizungen und Autos verbrennen viel Kohle, Erdöl und Erdgas. Dabei kommt Kohlendioxid in die Luft. Je mehr Kohlendioxid in der Luft ist, desto mehr Wärme hält die Decke aus Luft fest. Bäume holen Kohlendioxid aus der Luft. Wenn große Wälder abgeholzt werden, bleibt mehr davon in der Luft. So wird es auf der Erde langsam wärmer."
            show: { object: coal }
          - text: "Folgen: mehr heiße Sommertage, und die Gletscher in den Alpen werden kleiner."
            say: "Ida wandert mit Opa in den Alpen. Opa zeigt ihr ein altes Foto. Damals reichte das Eis des Gletschers viel weiter ins Tal. Heute ist der Gletscher viel kleiner. Wenn es wärmer wird, gibt es auch mehr heiße Sommertage. Das alles passiert langsam, über viele Jahre. Forscherinnen und Forscher beobachten es genau."
            show: { object: grandpa }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Geht es um das Wetter oder um das Klima? Sortiere."
                bins:
                  - { id: wetter, show: { text: "Wetter" }, say: "Wetter" }
                  - { id: klima, show: { text: "Klima" }, say: "Klima" }
                options:
                  - { text: "Heute regnet es.", bin: wetter }
                  - { text: "Morgen wird es sonnig.", bin: wetter }
                  - { text: "In der Wüste ist es fast immer trocken.", bin: klima }
                  - { text: "In Deutschland sind die Winter meistens kühler als die Sommer.", bin: klima }
                hints:
                  - "Wetter ist heute oder morgen. Klima ist meistens, über viele Jahre."
                  - "Achte auf Wörter wie heute, morgen, meistens und fast immer."
                  - "Regen heute und Sonne morgen: Wetter. Wüste und Winter in Deutschland: Klima."
              - id: l1-f2
                type: true_false
                text: "Heute zeigt das Thermometer minus 5 Grad. Beweist das, dass die Erde nicht wärmer wird?"
                show: { drawn: thermometer, from: -10, to: 30, step: 5, value: -5 }
                answer: false
                hints:
                  - "Ist ein einzelner Tag Wetter oder Klima?"
                  - "Ob es wärmer wird, sieht man erst, wenn man viele Jahre vergleicht."
                  - "Nein, ein kalter Tag ist Wetter."
              - id: l1-f3
                type: multiple_choice
                text: "Was macht die Lufthülle der Erde?"
                options: ["Sie hält Wärme fest, wie eine Decke.", "Sie schiebt die Sonne weg.", "Sie macht die Erde dunkel."]
                answer: "Sie hält Wärme fest, wie eine Decke."
                hints:
                  - "Ohne Lufthülle wäre es auf der Erde eiskalt."
                  - "Was macht eine Decke im Bett mit deiner Wärme?"
                  - "Sie hält Wärme fest."
                difficulty: easy
              - id: l1-f4
                type: matching
                text: "Was bedeutet das Wort? Verbinde."
                pairs:
                  - { left: { text: "Wetter" }, right: { text: "wie es gerade draußen ist" } }
                  - { left: { text: "Klima" }, right: { text: "wie das Wetter über viele Jahre meistens ist" } }
                  - { left: { text: "Lufthülle" }, right: { text: "hält die Erde warm wie eine Decke" } }
                  - { left: { text: "Kohlendioxid" }, right: { text: "ein Gas, das beim Verbrennen entsteht" } }
                hints:
                  - "Fang mit Wetter und Klima an."
                  - "Was entsteht beim Verbrennen? Was liegt um die Erde?"
                  - "Wetter: gerade. Klima: viele Jahre. Lufthülle: Decke. Kohlendioxid: Gas vom Verbrennen."
              - id: l1-f5
                type: multiple_choice
                text: "Warum wird es auf der Erde langsam wärmer?"
                options: ["Beim Verbrennen von Kohle, Erdöl und Erdgas kommt viel Kohlendioxid in die Luft.", "Die Sonne ist näher an die Erde gerückt.", "Es gibt mehr Gewitter."]
                answer: "Beim Verbrennen von Kohle, Erdöl und Erdgas kommt viel Kohlendioxid in die Luft."
                hints:
                  - "Die Sonne steht so weit weg wie immer. Es liegt an der Luft."
                  - "Was kommt in die Luft, wenn etwas verbrannt wird?"
                  - "Es kommt viel Kohlendioxid in die Luft."
              - id: l1-f6
                type: true_false
                text: "Ohne die Lufthülle wäre es auf der Erde viel kälter. Stimmt das?"
                answer: true
                hints:
                  - "Was hält die Wärme der Sonne fest?"
                  - "Ohne Decke wäre es kalt. Ohne Lufthülle auch."
                  - "Ja, es wäre eiskalt."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Geht es um das Wetter oder um das Klima? Sortiere."
                bins:
                  - { id: wetter, show: { text: "Wetter" }, say: "Wetter" }
                  - { id: klima, show: { text: "Klima" }, say: "Klima" }
                options:
                  - { text: "Gestern hat es gehagelt.", bin: wetter }
                  - { text: "Heute ist es windig.", bin: wetter }
                  - { text: "Am Nordpol ist es das ganze Jahr kalt.", bin: klima }
                  - { text: "In Spanien sind die Sommer meistens heiß und trocken.", bin: klima }
                hints: ["Gestern und heute sind Wetter. Was über viele Jahre meistens so ist, ist Klima."]
              - id: l1-s2
                type: true_false
                text: "Wetter und Klima sind dasselbe. Stimmt das?"
                answer: false
                hints: ["Das eine ist gerade, das andere über viele Jahre."]
              - id: l1-s3
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Beim Verbrennen von Erdöl entsteht _. Dann hält die Lufthülle _ Wärme fest."
                options: ["Kohlendioxid", "mehr", "Sauerstoff", "weniger"]
                answer: ["Kohlendioxid", "mehr"]
                hints: ["Mehr Kohlendioxid macht die Decke aus Luft wärmer."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Wer holt Kohlendioxid aus der Luft?"
                options: [{ object: tree }, { object: car }, { object: oven }]
                answer: tree
                hints: ["Es ist ein Lebewesen, und es wächst im Wald."]
              - id: l1-s5
                type: multiple_choice
                text: "Ida vergleicht Opas altes Foto mit heute. Was ist mit dem Gletscher passiert?"
                show: { object: glacier }
                options: ["Er ist kleiner geworden.", "Er ist viel größer geworden.", "Er ist ans Meer gewandert."]
                answer: "Er ist kleiner geworden."
                hints: ["Wenn es wärmer wird, schmilzt Eis."]
              - id: l1-s6
                type: true_false
                text: "Der Klimawandel passiert langsam, über viele Jahre. Stimmt das?"
                answer: true
                hints: ["Man sieht ihn, wenn man das Wetter vieler Jahre vergleicht."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ben sagt: „Diese Woche war es eisig. Also wird die Erde nicht wärmer.“ Was stimmt?"
                options: ["Eine kalte Woche ist Wetter. Das Klima sieht man erst über viele Jahre.", "Ben hat recht.", "Kalte Wochen gibt es gar nicht mehr."]
                answer: "Eine kalte Woche ist Wetter. Das Klima sieht man erst über viele Jahre."
              - id: l1-n2
                type: true_false
                text: "Wenn große Wälder abgeholzt werden, holen weniger Bäume Kohlendioxid aus der Luft. Stimmt das?"
                answer: true
              - id: l1-n3
                type: ordering
                text: "Wie wird es wärmer? Bring es in die richtige Reihenfolge."
                options: ["Die Lufthülle hält mehr Wärme fest.", "Kohle wird verbrannt.", "Es wird wärmer auf der Erde.", "Kohlendioxid kommt in die Luft."]
                slot_count: 4
                answer: ["Kohle wird verbrannt.", "Kohlendioxid kommt in die Luft.", "Die Lufthülle hält mehr Wärme fest.", "Es wird wärmer auf der Erde."]
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Was passiert, wenn es auf der Erde wärmer wird?"
                options: ["Es gibt mehr heiße Sommertage.", "Es schneit im Sommer öfter.", "Die Nächte werden länger."]
                answer: "Es gibt mehr heiße Sommertage."
              - id: l1-n5
                type: true_false
                text: "Die Erde wird wärmer, weil die Sonne jedes Jahr näher kommt. Stimmt das?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist Wetter?"
            options: ["wie es gerade draußen ist", "wie es über viele Jahre meistens ist", "eine Karte von Deutschland"]
            answer: "wie es gerade draußen ist"
          - id: l1-c2
            type: true_false
            text: "Das Klima beschreibt, wie das Wetter an einem Ort über viele Jahre meistens ist. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was hält die Wärme auf der Erde fest?"
            options: ["die Lufthülle", "der Mond", "der Wind"]
            answer: "die Lufthülle"
          - id: l1-c4
            type: true_false
            text: "Beim Verbrennen von Erdöl entsteht Kohlendioxid. Stimmt das?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Welcher Satz sagt etwas über das Klima?"
            options: ["In Deutschland sind die Sommer meistens warm.", "Heute regnet es.", "Morgen scheint die Sonne."]
            answer: "In Deutschland sind die Sommer meistens warm."
          - id: l1-c6
            type: true_false
            text: "Ein einzelner kalter Tag zeigt, dass es keinen Klimawandel gibt. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Unser Klima-Plan", en: "Our climate plan" }
    goal:
      de: "Finde heraus, was du selbst für das Klima tun kannst. Du kannst zum Beispiel mit dem Rad zur Schule fahren."
      en: "Find out what you can do yourself for the climate. You can, for example, cycle to school."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Warum hält die Lufthülle heute mehr Wärme fest als früher?"
            options: ["Es ist mehr Kohlendioxid in der Luft.", "Die Sonne ist näher gekommen.", "Der Mond ist größer geworden."]
            answer: "Es ist mehr Kohlendioxid in der Luft."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Klima ist das Wetter von heute. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ida fragt: „Kann ich als Kind überhaupt etwas für das Klima tun?“\n\nWas glaubst du?"
            say: "Zurück vom Gletscher fragt Ida ihre Lehrerin: Kann ich als Kind überhaupt etwas für das Klima tun? Was glaubst du?"
            show: { object: child }
          - text: "Ja! Und auf der ganzen Welt arbeiten viele Menschen an Lösungen."
            say: "Ja, du kannst! Und du bist nicht allein. Auf der ganzen Welt arbeiten viele Menschen an Lösungen. Immer mehr Strom kommt aus Windrädern und Solaranlagen. Forscherinnen und Forscher erfinden Fahrzeuge und Heizungen, die weniger Energie brauchen. Wälder werden geschützt, und es werden neue Bäume gepflanzt."
            show: { object: sun }
          - text: "Unterwegs: zu Fuß, mit dem Rad, mit Bus und Bahn."
            say: "Die Klasse 4c schreibt einen Klima-Plan. Erster Punkt: Kurze Wege gehen wir zu Fuß oder fahren mit dem Rad. Für weite Wege nehmen wir Bus und Bahn. Ein Bus nimmt viele Menschen auf einmal mit, statt dass jeder allein im Auto fährt."
            show: { object: bike }
          - text: "Energie sparen: Licht aus, kurz und weit lüften, Geräte ganz ausschalten."
            say: "Zweiter Punkt: Energie sparen, so wie die Energiedetektive. Licht aus, wenn niemand im Raum ist, kurz und weit lüften und Geräte ganz ausschalten. Dann muss weniger verbrannt werden."
            show: { object: lamp }
          - text: "Essen: Obst und Gemüse aus der Nähe, zu seiner Jahreszeit. Kein gutes Essen wegwerfen."
            say: "Dritter Punkt: das Essen. Erdbeeren aus der Gegend gibt es im Sommer. Im Winter kommen Erdbeeren oft von sehr weit her. Obst und Gemüse aus der Nähe, zu seiner Jahreszeit, müssen keinen weiten Weg reisen. Und gutes Essen werfen wir nicht weg."
            show: { object: strawberry }
          - text: "Sachen reparieren, tauschen und weitergeben."
            say: "Vierter Punkt: Um neue Dinge herzustellen, braucht man Energie und Rohstoffe. Darum reparieren wir kaputte Sachen, tauschen Spielzeug und geben Kleidung weiter, aus der wir herausgewachsen sind."
          - text: "Wusstest du? Ein Baum wächst vor allem aus Luft."
            say: "Wusstest du? Ein Baum wächst vor allem aus Luft! Ein großer Baum ist sehr schwer. Aber sein Holz kommt nicht aus der Erde. Der Baum holt Kohlendioxid aus der Luft und baut daraus mit Wasser und Sonnenlicht sein Holz. Darum hilft jeder Baum, der wächst."
            show: { object: tree }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Hilft das dem Klima? Sortiere."
                bins:
                  - { id: hilft, show: { text: "hilft dem Klima" }, say: "hilft dem Klima" }
                  - { id: nicht, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "mit dem Rad zur Schule fahren", bin: hilft }
                  - { text: "Licht aus beim Rausgehen", bin: hilft }
                  - { text: "jeden kurzen Weg mit dem Auto fahren", bin: nicht }
                  - { text: "kaputtes Spielzeug wegwerfen und gleich neues kaufen", bin: nicht }
                hints:
                  - "Frag dich: Wird dabei etwas verbrannt oder neu hergestellt, obwohl es nicht nötig ist?"
                  - "Das Rad fährt ohne Abgase. Neues Spielzeug herzustellen braucht Energie."
                  - "Rad und Licht aus helfen. Auto für kurze Wege und gleich Neues kaufen helfen nicht."
              - id: l2-f2
                type: multiple_choice
                text: "Idas Schule ist einen Kilometer entfernt. Wie kommt sie klimafreundlich hin?"
                options: ["zu Fuß oder mit dem Rad", "mit dem Auto, das nur für sie fährt", "mit dem Flugzeug"]
                answer: "zu Fuß oder mit dem Rad"
                feedback:
                  "mit dem Flugzeug": "Mit dem Flugzeug zur Schule? Bis es abhebt, ist Ida längst zu Fuß angekommen! Kurze Wege gehst du am besten zu Fuß oder fährst Rad."
                hints:
                  - "Ein Kilometer ist ein kurzer Weg."
                  - "Was fährt ohne Benzin und ohne Abgase?"
                  - "Zu Fuß oder mit dem Rad."
                difficulty: easy
              - id: l2-f3
                type: image_multiple_choice
                text: "Was nimmt viele Menschen auf einmal mit?"
                options: [{ object: bus }, { object: car }, { object: taxi }]
                answer: bus
                hints:
                  - "Es hält an Haltestellen."
                  - "Darin sitzen oft viele Kinder auf dem Weg zur Schule."
                  - "Der Bus."
              - id: l2-f4
                type: true_false
                text: "Windräder und Solaranlagen machen Strom, ohne dabei Kohlendioxid in die Luft zu blasen. Stimmt das?"
                show: { object: wind-turbine }
                answer: true
                hints:
                  - "Wird in einem Windrad etwas verbrannt?"
                  - "Kohlendioxid entsteht beim Verbrennen. Wind und Sonne werden nicht verbrannt."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Es ist Dezember. Ida hat Lust auf Obst. Was ist klimafreundlich?"
                options: ["Äpfel aus der Gegend essen und sich im Sommer auf Erdbeeren freuen", "jeden Tag Erdbeeren essen, die von sehr weit herkommen", "Erdbeeren kaufen und dann wegwerfen"]
                answer: "Äpfel aus der Gegend essen und sich im Sommer auf Erdbeeren freuen"
                hints:
                  - "Wann wachsen bei uns Erdbeeren?"
                  - "Obst aus der Nähe muss keinen weiten Weg reisen."
                  - "Äpfel aus der Gegend, Erdbeeren im Sommer."
              - id: l2-f6
                type: matching
                text: "Warum hilft das? Verbinde."
                pairs:
                  - { left: { text: "Rad fahren" }, right: { text: "Es kommen keine Abgase aus einem Auspuff." } }
                  - { left: { text: "Bäume pflanzen" }, right: { text: "Bäume holen Kohlendioxid aus der Luft." } }
                  - { left: { text: "Spielzeug reparieren" }, right: { text: "Es muss kein neues hergestellt werden." } }
                  - { left: { text: "Licht ausmachen" }, right: { text: "Es wird Strom gespart." } }
                hints:
                  - "Zu jeder Idee gibt es genau einen Grund."
                  - "Was haben Bäume mit der Luft zu tun? Was spart man beim Reparieren?"
                  - "Rad: keine Abgase. Bäume: Kohlendioxid. Reparieren: nichts Neues. Licht: Strom."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Ein Kind kann nichts für das Klima tun. Stimmt das?"
                answer: false
                hints: ["Denk an den Klima-Plan der 4c."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welche Wörter passen in den Klima-Plan?"
                frame: "Kurze Wege gehen wir zu _. Für weite Wege nehmen wir Bus und _."
                options: ["Fuß", "Bahn", "Flugzeug", "Taxi"]
                answer: ["Fuß", "Bahn"]
                hints: ["Für kurze Wege brauchst du nur deine Beine. Der Bus hat einen Partner auf Schienen."]
              - id: l2-s3
