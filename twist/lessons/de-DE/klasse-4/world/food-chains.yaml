# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.food-chains
skill: world.nature.food-chains
curriculum: de-DE
language: de
title:
  de: Wer frisst wen?
  en: What eats what?
summary: >
  Food chains and food webs. The story: Mira and Jonas from the 4a hang a
  Wildkamera at the edge of the forest and watch who eats whom. Lesson 1
  builds food chains: every chain starts with a plant, which makes its own
  food with sunlight; the arrow means "wird gefressen von" and points to
  the eater (Gras, Feldhase, Fuchs; Körner, Maus, Eule; Blatt, Raupe,
  Meise, Sperber); animals are Pflanzenfresser, Fleischfresser or
  Allesfresser. Lesson 2 joins chains into a Nahrungsnetz, because most
  animals eat more than one thing, and shows that animals and plants
  depend on each other: when one link goes missing, others go hungry or
  become too many (no ladybirds, many aphids); at the start of a chain
  there are many living things, at the end few. It ends with the skill
  check. Fox and hedgehog are never sorted as pure meat eaters, as both
  also eat fruit. Feldhase, Reh, Meise, Sperber, Blattlaus, Raupe,
  Wildschwein and Krill have no pictures yet, so they are text cards.
metadata:
  year: klasse-4
  topic: { de: Lebensräume, en: Habitats }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.nature.meadow, world.nature.forest, world.nature.adaptation]
  also_practises: []
  vocabulary: { de: [Nahrungskette, Nahrungsnetz, Pflanzenfresser, Fleischfresser, Allesfresser, Pfeil, Beute, Jäger, Gewölle, Blattlaus, Wildkamera, abhängen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: chain, what: { de: "eine Nahrungskette in die richtige Reihenfolge bringen und den Pfeil lesen", en: "putting a food chain in order and reading the arrow" } }
    - { id: eaters, what: { de: "Tiere als Pflanzenfresser, Fleischfresser oder Allesfresser einordnen", en: "sorting animals into plant eaters, meat eaters and omnivores" } }
    - { id: depend, what: { de: "erklären, wie Tiere und Pflanzen in einem Nahrungsnetz voneinander abhängen", en: "explaining how animals and plants in a food web depend on each other" } }
  misconceptions:
    - id: arrow-points-to-food
      what: Reads the arrow as "frisst" and points it from the eater to its food, or starts the chain with the biggest animal
      addressed: "lesson 1 Learn says the arrow means \"wird gefressen von\" and points to the eater; l1-f2, l1-s4, l1-n4, l1-c3 and l2-c3, l2-c5 test it, with feedback on l1-n4"
    - id: chain-starts-with-animal
      what: Starts a food chain with an animal and does not see that every chain begins with a plant
      addressed: "lesson 1 Learn opens with the guess what is at the start; l1-f4, l1-s2, l1-c2 and l2-c2, l2-c6"
    - id: fewer-hunters-better
      what: Thinks that if a hunter disappears, nothing else changes, or that the animals it ate are simply better off for ever
      addressed: "lesson 2 Learn shows the ladybirds and aphids and the hare and the fox; l2-f3, l2-s3, l2-n3 and l2-c15, l2-c17"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Die Wildkamera", en: "The wildlife camera" }
    goal:
      de: "Bau Nahrungsketten und lies den Pfeil richtig. Zum Beispiel wird das Gras vom Hasen gefressen und der Hase vom Fuchs."
      en: "Build food chains and read the arrow the right way. For example, the grass is eaten by the hare and the hare by the fox."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist ein Lebensraum?"
            options: ["der Ort, an dem ein Tier Nahrung und Schutz findet", "der Ort, an dem ein Tier nur schläft", "ein Zimmer im Zoo"]
            answer: "der Ort, an dem ein Tier Nahrung und Schutz findet"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Welches Tier sammelt auf der Wiese Nektar von den Blüten?"
            options: [{ object: bee }, { object: snail }, { object: worm }]
            answer: bee
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mira und Jonas hängen am Waldrand eine Wildkamera auf.\n\nWas glaubst du: Was steht am Anfang, wenn Tiere fressen und gefressen werden?"
            say: "Mira und Jonas aus der 4a hängen am Waldrand eine Wildkamera auf. Sie macht Fotos, sobald sich etwas bewegt. Was glaubst du: Was steht ganz am Anfang, wenn Tiere fressen und gefressen werden? Ein großes Tier, ein kleines Tier oder eine Pflanze?"
            show: { object: tree }
          - text: "Am Anfang steht immer eine Pflanze."
            say: "Am Anfang steht immer eine Pflanze! Eine Pflanze muss kein anderes Lebewesen fressen. Sie macht ihre Nahrung selbst, mit Sonnenlicht, Wasser und Luft. Tiere können das nicht. Sie müssen Pflanzen oder andere Tiere fressen."
            show: { object: sun }
          - text: "Gras → Feldhase → Fuchs\n\nDer Pfeil heißt: „wird gefressen von“."
            say: "Auf dem ersten Foto knabbert ein Feldhase am Gras. Auf dem nächsten schleicht ein Fuchs heran. So sieht das als Nahrungskette aus: Gras, Pfeil, Feldhase, Pfeil, Fuchs. Der Pfeil heißt: wird gefressen von. Das Gras wird vom Feldhasen gefressen, und der Feldhase wird vom Fuchs gefressen. Der Pfeil zeigt also immer zu dem, der frisst."
            show: { object: fox }
          - text: "Körner → Maus → Eule"
            say: "In der Nacht fotografiert die Kamera eine Maus, die Körner frisst. Kurz danach fliegt eine Eule durchs Bild. Die Nahrungskette heißt: Körner, Pfeil, Maus, Pfeil, Eule. Die Körner werden von der Maus gefressen, die Maus von der Eule."
            show: { object: owl }
          - text: "Pflanzenfresser fressen Pflanzen.\nFleischfresser fressen andere Tiere.\nAllesfresser fressen beides."
            say: "Der Feldhase und die Maus fressen Pflanzen. Sie sind Pflanzenfresser. Die Eule frisst andere Tiere. Sie ist ein Fleischfresser. Und manche Tiere fressen beides, zum Beispiel das Wildschwein. Es frisst Eicheln und Wurzeln, aber auch Würmer und Käfer. Das ist ein Allesfresser. Auch wir Menschen sind Allesfresser."
          - text: "Wusstest du? Eulen würgen Knochen und Fell wieder aus."
            say: "Wusstest du? Eulen schlucken kleine Mäuse oft im Ganzen herunter. Knochen und Fell können sie nicht verdauen. Darum würgen sie diese Reste später als kleines graues Päckchen wieder aus. Das heißt Gewölle. Forscher sehen darin, welche Tiere die Eule gefressen hat."
            show: { object: owl }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Bau die Nahrungskette. Was kommt zuerst?"
                say: "Die Kamera zeigt eine Schnecke am Salatblatt und einen Igel, der die Schnecke frisst. Bau die Nahrungskette. Was kommt zuerst?"
                options: [{ object: hedgehog }, { object: leaf }, { object: snail }]
                slot_count: 3
                answer: [leaf, snail, hedgehog]
                hints:
                  - "Eine Nahrungskette beginnt immer mit einer Pflanze."
                  - "Das Blatt wird von der Schnecke gefressen. Wer frisst die Schnecke?"
                  - "Blatt, Schnecke, Igel."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Rose → Blattlaus → Marienkäfer\n\nWas bedeutet der Pfeil?"
                say: "Rose, Pfeil, Blattlaus, Pfeil, Marienkäfer. Was bedeutet der Pfeil?"
                options: ["wird gefressen von", "frisst", "wohnt neben"]
                answer: "wird gefressen von"
                hints:
                  - "Der Pfeil zeigt immer zu dem Tier, das frisst."
                  - "Die Rose zeigt auf die Blattlaus. Frisst die Rose die Blattlaus?"
                  - "Die Rose wird von der Blattlaus gefressen."
              - id: l1-f3
                type: sorting
                text: "Was frisst das Tier? Sortiere."
                bins:
                  - { id: plant, show: { text: "Pflanzenfresser" }, say: "Pflanzenfresser" }
                  - { id: meat, show: { text: "Fleischfresser" }, say: "Fleischfresser" }
                options:
                  - { object: cow, bin: plant }
                  - { object: rabbit, bin: plant }
                  - { object: owl, bin: meat }
                  - { object: spider, bin: meat }
                hints:
                  - "Frag dich bei jedem Tier: Frisst es Pflanzen oder andere Tiere?"
                  - "Die Spinne fängt Fliegen in ihrem Netz. Die Kuh frisst Gras."
                  - "Kuh und Hase: Pflanzenfresser. Eule und Spinne: Fleischfresser."
              - id: l1-f4
                type: true_false
                text: "Fuchs → Maus → Körner\n\nIst diese Nahrungskette richtig?"
                say: "Fuchs, Pfeil, Maus, Pfeil, Körner. Ist diese Nahrungskette richtig?"
                answer: false
                hints:
                  - "Womit beginnt eine Nahrungskette immer?"
                  - "Hier steht der Fuchs am Anfang. Wird der Fuchs von der Maus gefressen?"
                  - "Nein. Richtig ist: Körner, Maus, Fuchs."
              - id: l1-f5
                type: image_multiple_choice
                text: "Welches Tier ist ein Allesfresser?"
                options: [{ object: bear }, { object: giraffe }, { object: cow }]
                answer: bear
                feedback:
                  giraffe: "Die Giraffe frisst Blätter von hohen Bäumen, aber keine Tiere. Sie ist ein Pflanzenfresser."
                hints:
                  - "Ein Allesfresser frisst Pflanzen und Tiere."
                  - "Welches Tier frisst Beeren und Honig, fängt aber auch Fische?"
                  - "Der Bär."
              - id: l1-f6
                type: fill_in_blank
                text: "Ergänze die Nahrungskette."
                say: "Blatt, Pfeil, Raupe, Pfeil, Lücke. Welches Tier frisst die Raupe? Ergänze."
                frame: "Blatt → Raupe → _"
                options: ["Meise", "Gras", "Kuh"]
                answer: ["Meise"]
                hints:
                  - "Am Ende steht ein Tier, das die Raupe frisst."
                  - "Gras ist eine Pflanze, und eine Kuh frisst keine Raupen."
                  - "Die Meise frisst Raupen."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Was frisst das Tier am liebsten? Verbinde."
                pairs:
                  - { left: { object: rabbit }, right: { text: "Gras und Kräuter" } }
                  - { left: { object: owl }, right: { text: "Mäuse" } }
                  - { left: { object: ladybird }, right: { text: "Blattläuse" } }
                  - { left: { object: hedgehog }, right: { text: "Schnecken und Käfer" } }
                hints: ["Der Marienkäfer ist klein. Er frisst noch kleinere Tiere."]
              - id: l1-s2
                type: multiple_choice
                text: "Jonas will eine Nahrungskette malen. Womit fängt er an?"
                options: ["mit einer Pflanze", "mit dem größten Tier", "mit dem kleinsten Tier"]
                answer: "mit einer Pflanze"
                hints: ["Nur Pflanzen machen ihre Nahrung selbst."]
              - id: l1-s3
                type: ordering
                text: "Bau die Nahrungskette."
                say: "Auf dem Foto der Nacht: Körner, eine Maus und ein Fuchs. Bau die Nahrungskette."
                options: [{ object: fox }, { object: wheat }, { object: mouse }]
                slot_count: 3
                answer: [wheat, mouse, fox]
                hints: ["Fang mit der Pflanze an. Der Pfeil zeigt zum Fresser."]
              - id: l1-s4
                type: true_false
                text: "Gras → Kuh\n\nDas heißt: Das Gras wird von der Kuh gefressen. Stimmt das?"
                say: "Gras, Pfeil, Kuh. Das heißt: Das Gras wird von der Kuh gefressen. Stimmt das?"
                answer: true
                hints: ["Der Pfeil heißt: wird gefressen von."]
              - id: l1-s5
                type: sorting
                text: "Pflanzenfresser, Fleischfresser oder Allesfresser? Sortiere."
                bins:
                  - { id: plant, show: { text: "Pflanzenfresser" }, say: "Pflanzenfresser" }
                  - { id: meat, show: { text: "Fleischfresser" }, say: "Fleischfresser" }
                  - { id: both, show: { text: "Allesfresser" }, say: "Allesfresser" }
                options:
                  - { object: elephant, bin: plant }
                  - { object: lion, bin: meat }
                  - { object: shark, bin: meat }
                  - { text: "Wildschwein", bin: both }
                hints: ["Das Wildschwein frisst Eicheln, aber auch Würmer und Käfer."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Bau die Nahrungskette mit vier Gliedern."
                say: "Mira hat vier Karten: Meise, Sperber, Blatt und Raupe. Der Sperber ist ein Greifvogel, der kleine Vögel jagt. Bau die Nahrungskette."
                options: ["Meise", "Sperber", "Blatt", "Raupe"]
                slot_count: 4
                answer: ["Blatt", "Raupe", "Meise", "Sperber"]
              - id: l1-n2
                type: multiple_choice
                text: "Warum fressen Pflanzen keine anderen Lebewesen?"
                options: ["Sie machen ihre Nahrung selbst, mit Licht, Wasser und Luft.", "Sie haben keinen Hunger.", "Sie fressen nur in der Nacht, wenn niemand hinschaut."]
                answer: "Sie machen ihre Nahrung selbst, mit Licht, Wasser und Luft."
              - id: l1-n3
                type: image_multiple_choice
                text: "Welches Tier ist ein Pflanzenfresser?"
                options: [{ object: spider }, { object: owl }, { object: rabbit }]
                answer: rabbit
              - id: l1-n4
                type: multiple_choice
                text: "Welche Nahrungskette ist richtig?"
                say: "Welche Nahrungskette ist richtig? Lies die Pfeile genau."
                options: ["Körner → Maus → Eule", "Eule → Maus → Körner", "Maus → Körner → Eule"]
                answer: "Körner → Maus → Eule"
                option_audio: false
                feedback:
                  "Eule → Maus → Körner": "Dann würde die Eule von der Maus gefressen! Der Pfeil zeigt zum Fresser, und am Anfang steht die Pflanze."
              - id: l1-n5
                type: true_false
                text: "Wir Menschen sind Allesfresser. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: ordering
            text: "Bau die Nahrungskette."
            options: [{ object: frog }, { text: "Gras" }, { text: "Grashüpfer" }]
            slot_count: 3
            answer: ["Gras", "Grashüpfer", frog]
          - id: l1-c2
            type: multiple_choice
            text: "Was steht am Anfang jeder Nahrungskette?"
            options: ["eine Pflanze", "ein Fleischfresser", "ein Mensch"]
            answer: "eine Pflanze"
          - id: l1-c3
            type: true_false
            text: "In einer Nahrungskette zeigt der Pfeil immer zu dem Tier, das frisst. Stimmt das?"
            answer: true
          - id: l1-c4
            type: image_multiple_choice
            text: "Welches Tier ist ein Fleischfresser?"
            options: [{ object: cow }, { object: lion }, { object: giraffe }]
            answer: lion
          - id: l1-c5
            type: fill_in_blank
            text: "Ergänze."
            frame: "Wer nur Pflanzen frisst, ist ein _. Wer Pflanzen und Tiere frisst, ist ein _."
            options: ["Pflanzenfresser", "Fleischfresser", "Allesfresser"]
            answer: ["Pflanzenfresser", "Allesfresser"]
          - id: l1-c6
            type: multiple_choice
            text: "Gras → Feldhase → Fuchs\n\nWer frisst den Feldhasen?"
            say: "Gras, Pfeil, Feldhase, Pfeil, Fuchs. Wer frisst den Feldhasen?"
            options: ["der Fuchs", "das Gras", "niemand"]
            answer: "der Fuchs"

  - n: 2
    title: { de: "Alles hängt zusammen", en: "Everything is connected" }
    goal:
      de: "Entdecke, wie viele Nahrungsketten ein Netz bilden. Fehlt ein Tier, merken das auch die anderen."
      en: "Find out how many food chains make a web. When one animal is missing, the others notice too."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            text: "Bau die Nahrungskette."
            options: [{ object: owl }, { object: wheat }, { object: mouse }]
            slot_count: 3
            answer: [wheat, mouse, owl]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist ein Allesfresser?"
            options: ["ein Tier, das Pflanzen und Tiere frisst", "ein Tier, das alles auf einmal frisst", "ein Tier, das nur Pflanzen frisst"]
            answer: "ein Tier, das Pflanzen und Tiere frisst"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Der Fuchs auf der Wildkamera frisst heute eine Maus, morgen einen Feldhasen.\n\nWas glaubst du: Passt er in eine einzige Nahrungskette?"
            say: "Mira schaut sich die Fotos der ganzen Woche an. Der Fuchs frisst mal eine Maus, mal einen Feldhasen, und im Herbst auch Brombeeren. Was glaubst du: Passt der Fuchs in eine einzige Nahrungskette?"
            show: { object: fox }
          - text: "Nein! Viele Nahrungsketten hängen zusammen. Das ist ein Nahrungsnetz."
            say: "Nein! Die meisten Tiere fressen mehr als eine Sache. Darum hängen viele Nahrungsketten zusammen. Die Maus wird von der Eule und vom Fuchs gefressen. Der Feldhase und die Maus fressen beide Pflanzen. Wenn man alle Ketten zusammen malt, sieht das aus wie ein Netz. Es heißt Nahrungsnetz."
            show: { object: web }
          - text: "Viele Pflanzen, weniger Pflanzenfresser, wenige Jäger."
            say: "Am Anfang einer Nahrungskette gibt es sehr viel: unzählige Gräser und Körner. Davon leben viele Mäuse. Und von den vielen Mäusen leben nur wenige Eulen. Ein Jäger braucht nämlich viele Beutetiere, um satt zu werden."
            show: { object: wheat }
          - text: "Fehlt ein Glied, merken es die anderen."
            say: "Im Garten von Jonas wohnen viele Marienkäfer. Sie fressen Blattläuse. Was passiert, wenn die Marienkäfer fehlen? Dann gibt es plötzlich sehr viele Blattläuse, und die Rosen bekommen kranke Blätter. Und wenn im Winter wenige Mäuse da sind, finden die Eulen wenig Futter und haben weniger Junge. So hängen Tiere und Pflanzen voneinander ab."
            show: { object: ladybird }
          - text: "Tote Pflanzen und Tiere werden zu Erde. Daraus wachsen neue Pflanzen."
            say: "Und was passiert mit Blättern und Tieren, die sterben? Regenwürmer, Asseln und Pilze machen daraus neue Erde. In dieser Erde wachsen wieder Pflanzen. So geht es immer weiter."
            show: { object: worm }
          - text: "Wusstest du? Das größte Tier der Erde frisst winzige Krebse."
            say: "Wusstest du? Der Blauwal ist das größte Tier der Erde. Trotzdem frisst er vor allem winzige Krebse, die kaum so lang sind wie dein Finger. Sie heißen Krill. Davon schluckt er jeden Tag riesige Mengen. Der Krill frisst winzige Algen im Meer. Auch diese Kette beginnt also mit einer Pflanze."
            show: { object: whale }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Im Nahrungsnetz am Waldrand: Wer frisst die Maus?"
                say: "Schau ins Nahrungsnetz am Waldrand. Körner werden von der Maus gefressen. Die Maus wird von der Eule und vom Fuchs gefressen. Wer frisst die Maus?"
                options: ["die Eule und der Fuchs", "nur die Eule", "die Körner"]
                answer: "die Eule und der Fuchs"
                hints:
                  - "In einem Nahrungsnetz kann ein Tier von mehreren Tieren gefressen werden."
                  - "Zwei Pfeile gehen von der Maus weg. Wohin zeigen sie?"
                  - "Die Eule und der Fuchs."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Die meisten Tiere fressen nur eine einzige Sache. Stimmt das?"
                answer: false
                hints:
                  - "Denk an den Fuchs auf der Wildkamera."
                  - "Der Fuchs frisst Mäuse, Feldhasen und Brombeeren."
                  - "Nein, die meisten Tiere fressen mehr als eine Sache."
              - id: l2-f3
                type: multiple_choice
                text: "In Jonas' Garten gibt es keine Marienkäfer mehr. Was passiert mit den Blattläusen?"
                options: ["Es werden viel mehr Blattläuse.", "Es werden weniger Blattläuse.", "Die Blattläuse fressen jetzt Marienkäfer."]
                answer: "Es werden viel mehr Blattläuse."
                hints:
                  - "Marienkäfer fressen Blattläuse."
                  - "Wenn niemand mehr die Blattläuse frisst, was passiert dann?"
                  - "Es werden viel mehr Blattläuse."
              - id: l2-f4
                type: ordering
                text: "Bau die Nahrungskette im Meer."
                say: "Algen, Krill und Blauwal. Bau die Nahrungskette im Meer."
                options: ["Blauwal", "Algen", "Krill"]
                slot_count: 3
                answer: ["Algen", "Krill", "Blauwal"]
                hints:
                  - "Auch im Meer beginnt die Kette mit einer Pflanze."
                  - "Algen sind winzige Pflanzen. Wer frisst sie?"
                  - "Algen, Krill, Blauwal."
              - id: l2-f5
                type: multiple_choice
                text: "Wovon gibt es am Waldrand am meisten?"
                options: ["Gräser und Körner", "Mäuse", "Eulen"]
                answer: "Gräser und Körner"
                feedback:
                  "Eulen": "Ein Wald voller Eulen? Die hätten bald nichts mehr zu fressen! Am meisten gibt es am Anfang der Kette."
                hints:
                  - "Ein Jäger braucht viele Beutetiere, um satt zu werden."
                  - "Viele Mäuse leben von noch viel mehr Körnern."
                  - "Gräser und Körner."
              - id: l2-f6
                type: image_multiple_choice
                text: "Wer macht aus toten Blättern neue Erde?"
                options: [{ object: worm }, { object: fox }, { object: owl }]
                answer: worm
                hints:
                  - "Es ist ein Tier, das im Boden lebt."
                  - "Es zieht Blätter in die Erde und frisst sie."
                  - "Der Regenwurm."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Was frisst der Fuchs, und was frisst ihn nicht? Sortiere."
                bins:
                  - { id: yes, show: { text: "frisst der Fuchs" }, say: "frisst der Fuchs" }
                  - { id: no, show: { text: "frisst der Fuchs nicht" }, say: "frisst der Fuchs nicht" }
                options:
                  - { object: mouse, bin: yes }
                  - { text: "Brombeeren", bin: yes }
                  - { object: stone, bin: no }
                  - { object: elephant, bin: no }
                hints: ["Der Fuchs ist ein kleiner Jäger, aber er frisst auch Früchte."]
              - id: l2-s2
                type: multiple_choice
                text: "Warum heißt es Nahrungsnetz?"
                options: ["Weil viele Nahrungsketten zusammenhängen.", "Weil Spinnen alle Tiere fangen.", "Weil die Tiere in einem Netz wohnen."]
                answer: "Weil viele Nahrungsketten zusammenhängen."
                hints: ["Ein Tier frisst oft mehr als eine Sache und wird von mehr als einem Tier gefressen."]
              - id: l2-s3
                type: true_false
