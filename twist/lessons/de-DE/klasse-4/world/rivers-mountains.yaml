# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.rivers-mountains
skill: world.space.rivers-mountains
curriculum: de-DE
language: de
title:
  de: Flüsse und Gebirge in Deutschland
  en: Rivers and mountains of Germany
summary: >
  Lotta's Opa Ben steered a cargo ship on Germany's rivers for many years
  and now goes hiking in the mountains. Lesson 1 follows his trips: a
  river runs from its Quelle to its Mündung, small rivers flow into big
  ones (the Main into the Rhein); the Rhein comes from the Alps in
  Switzerland, flows through the Bodensee and north past Mainz, Bonn, Köln
  and Düsseldorf into the North Sea, and is the river with the longest
  stretch in Germany; the Elbe comes from the Czech Republic and flows
  past Dresden, Magdeburg and Hamburg into the North Sea; the Donau starts
  in the Schwarzwald and flows east past Ulm, Regensburg and Passau into
  the Black Sea; the Weser flows past Bremen. Lesson 2 climbs: a range is a
  group of mountains; the Zugspitze (2962 m) in the Alps in Bayern on the
  border with Austria, the Feldberg (1493 m) in the Schwarzwald, the
  Brocken (1141 m) in the Harz, and the Erzgebirge in Sachsen; many rivers
  start in mountains. It ends with the skill check. A table stands in for
  the map until the map of Germany is drawn.
metadata:
  year: klasse-4
  topic: { de: Deutschland und die Welt, en: Germany and the world }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.space.germany-map, world.space.germany-landscapes]
  also_practises: [world.space.germany-landscapes]
  vocabulary: { de: [Fluss, Quelle, Mündung, münden, entspringen, Nebenfluss, Rhein, Elbe, Donau, Weser, Main, Gebirge, Berg, Gipfel, Zugspitze, Feldberg, Brocken, Harz, Schwarzwald, Erzgebirge] }
  forms: [text, audio, picture, drawn]
  drawn: [table]
  facets: []
  parts:
    - { id: rivers, what: { de: "die großen Flüsse nennen und sagen, woher sie kommen und wohin sie fließen", en: "naming the big rivers and saying where they come from and where they flow" } }
    - { id: cities, what: { de: "große Städte ihrem Fluss zuordnen", en: "matching big cities to their river" } }
    - { id: mountains, what: { de: "Gebirge und ihre höchsten Berge nennen und vergleichen", en: "naming ranges and their highest mountains and comparing them" } }
  misconceptions:
    - id: rivers-flow-south
      what: Thinks rivers flow down the map, so every river flows south, or that all rivers end in the same sea
      addressed: "lesson 1 Learn says the Rhein and the Elbe flow north and the Donau east; l1-f3, l1-f4, l1-s2, l1-s4 and l2-c1, l2-c2, l2-c3"
    - id: range-or-mountain
      what: Mixes up a range (Gebirge) with one mountain (Berg), calling the Alps a mountain or the Zugspitze a range
      addressed: "lesson 2 Learn screen on Gebirge and Berg; l2-f3, l2-s2, l2-n1 and l2-c17, l2-c18"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Mit Opa Ben auf dem Fluss", en: "On the river with Opa Ben" }
    goal:
      de: "Lerne die großen Flüsse Deutschlands kennen. Der Rhein zum Beispiel kommt aus den Alpen und fließt in die Nordsee."
      en: "Get to know Germany's big rivers. The Rhine, for example, comes from the Alps and flows into the North Sea."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie heißen die beiden Meere im Norden von Deutschland?"
            options: ["Nordsee und Ostsee", "Nordsee und Mittelmeer", "Ostsee und Bodensee"]
            answer: "Nordsee und Ostsee"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Die Alpen liegen ganz im Süden, in Bayern. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Opa Ben war viele Jahre Kapitän auf einem Frachtschiff.\n\nWas glaubst du: Wohin fließen die meisten großen Flüsse Deutschlands? In die Nordsee, in die Ostsee oder in die Alpen?"
            say: "Lottas Opa Ben war viele Jahre Kapitän auf einem Frachtschiff. Er ist auf den großen Flüssen durch ganz Deutschland gefahren. Was glaubst du: Wohin fließen die meisten großen Flüsse Deutschlands? In die Nordsee, in die Ostsee oder in die Alpen?"
            show: { object: ship }
          - text: "In die Nordsee! Ein Fluss beginnt an der Quelle und endet an der Mündung.\nKleine Flüsse münden in große: Der Main mündet in den Rhein."
            say: "In die Nordsee! In die Alpen kann kein Fluss fließen, denn Wasser fließt immer bergab. Jeder Fluss beginnt an einer Quelle und endet an seiner Mündung, im Meer oder in einem größeren Fluss. Der Main zum Beispiel fließt durch Frankfurt und mündet dann in den Rhein."
          - text: "Der Rhein: aus den Alpen in der Schweiz, durch den Bodensee, dann nach Norden in die Nordsee.\nStädte: Mainz, Bonn, Köln, Düsseldorf"
            say: "Opa Bens liebster Fluss ist der Rhein. Er kommt aus den Alpen in der Schweiz und fließt durch den Bodensee. Dann fließt er nach Norden, an Mainz, Bonn, Köln und Düsseldorf vorbei. In den Niederlanden mündet er in die Nordsee. Kein anderer Fluss fließt so lange durch Deutschland wie der Rhein. Aufgepasst: Er fließt nach Norden, auf der Karte also nach oben!"
          - text: "Die Elbe: aus Tschechien, nach Nordwesten in die Nordsee.\nStädte: Dresden, Magdeburg, Hamburg"
            say: "Die Elbe kommt aus Tschechien. Sie fließt nach Nordwesten, an Dresden, Magdeburg und Hamburg vorbei, und mündet in die Nordsee. In Hamburg hat Opa Ben oft im großen Hafen angelegt."
          - text: "Die Donau: aus dem Schwarzwald, nach Osten ins Schwarze Meer.\nStädte: Ulm, Regensburg, Passau"
            say: "Die Donau ist anders. Sie beginnt im Schwarzwald und fließt nach Osten, an Ulm, Regensburg und Passau vorbei. Dann verlässt sie Deutschland und fließt bis ins Schwarze Meer, weit weg im Osten von Europa."
          - text: "Die großen Flüsse auf einen Blick"
            say: "Hier siehst du die großen Flüsse auf einen Blick. Der Rhein kommt aus den Alpen und fließt in die Nordsee. Die Elbe kommt aus Tschechien und fließt in die Nordsee. Die Donau kommt aus dem Schwarzwald und fließt ins Schwarze Meer. Die Weser fließt durch Bremen in die Nordsee."
            show: { drawn: table, rows: [["Fluss", "kommt aus", "fließt in", "Städte"], ["Rhein", "Alpen", "Nordsee", "Köln, Düsseldorf"], ["Elbe", "Tschechien", "Nordsee", "Dresden, Hamburg"], ["Donau", "Schwarzwald", "Schwarzes Meer", "Ulm, Passau"], ["Weser", "Niedersachsen", "Nordsee", "Bremen"]] }
          - text: "Wusstest du? Die Donau fließt durch zehn Länder."
            say: "Wusstest du? Die Donau fließt durch zehn Länder, mehr als jeder andere Fluss der Welt. Nach Deutschland kommen zum Beispiel Österreich, Ungarn und Rumänien."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Opa Ben fährt mit seinem Schiff an Köln vorbei. Auf welchem Fluss ist er?"
                options: ["auf dem Rhein", "auf der Elbe", "auf der Donau"]
                answer: "auf dem Rhein"
                hints:
                  - "Köln liegt im Westen von Deutschland."
                  - "Der Rhein fließt an Mainz, Bonn, Köln und Düsseldorf vorbei."
                  - "Auf dem Rhein."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "An welchem Fluss liegt die Stadt? Verbinde."
                pairs:
                  - { left: { text: "Rhein" }, right: { text: "Köln" } }
                  - { left: { text: "Elbe" }, right: { text: "Dresden" } }
                  - { left: { text: "Donau" }, right: { text: "Regensburg" } }
                  - { left: { text: "Weser" }, right: { text: "Bremen" } }
                hints:
                  - "Fang mit dem Fluss an, den du am besten kennst."
                  - "Die Donau fließt durch Ulm, Regensburg und Passau. Die Weser durch Bremen."
                  - "Rhein Köln, Elbe Dresden, Donau Regensburg, Weser Bremen."
              - id: l1-f3
                type: true_false
                text: "Die Donau fließt in die Nordsee. Stimmt das?"
                answer: false
                hints:
                  - "Die Donau ist anders als Rhein und Elbe."
                  - "Sie fließt nach Osten, aus Deutschland hinaus."
                  - "Nein, die Donau fließt ins Schwarze Meer."
              - id: l1-f4
                type: sorting
                text: "In welches Meer fließt der Fluss? Sortiere."
                bins:
                  - { id: nord, show: { text: "Nordsee" }, say: "Nordsee" }
                  - { id: schwarz, show: { text: "Schwarzes Meer" }, say: "Schwarzes Meer" }
                options:
                  - { text: "Rhein", bin: nord }
                  - { text: "Donau", bin: schwarz }
                  - { text: "Elbe", bin: nord }
                  - { text: "Weser", bin: nord }
                hints:
                  - "Die meisten großen Flüsse fließen in die Nordsee."
                  - "Nur einer fließt nach Osten, weit weg."
                  - "Nur die Donau fließt ins Schwarze Meer."
              - id: l1-f5
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Ein Fluss beginnt an der _ und endet an der _."
                options: ["Quelle", "Mündung", "Brücke", "Grenze"]
                answer: ["Quelle", "Mündung"]
                hints:
                  - "Am Anfang kommt das Wasser aus der Erde."
                  - "Am Ende fließt der Fluss ins Meer oder in einen anderen Fluss."
                  - "Quelle am Anfang, Mündung am Ende."
              - id: l1-f6
                type: multiple_choice
                text: "Was fehlt in der Tabelle?"
                show: { drawn: table, rows: [["Fluss", "kommt aus"], ["Rhein", "Alpen"], ["Elbe", "?"]] }
                options: ["Tschechien", "Schwarzwald", "Dänemark"]
                answer: "Tschechien"
                hints:
                  - "Die Elbe kommt nicht aus Deutschland."
                  - "Aus dem Schwarzwald kommt die Donau."
                  - "Die Elbe kommt aus Tschechien."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "An welchem Fluss liegt die Stadt? Verbinde."
                pairs:
                  - { left: { text: "Rhein" }, right: { text: "Düsseldorf" } }
                  - { left: { text: "Elbe" }, right: { text: "Hamburg" } }
                  - { left: { text: "Donau" }, right: { text: "Ulm" } }
                  - { left: { text: "Main" }, right: { text: "Frankfurt" } }
                hints: ["Frankfurt heißt mit vollem Namen Frankfurt am Main."]
              - id: l1-s2
                type: multiple_choice
                text: "Opa Ben fährt auf der Elbe bis zur Mündung. An welchem Meer kommt er an?"
                options: ["an der Nordsee", "an der Ostsee", "am Schwarzen Meer"]
                answer: "an der Nordsee"
                hints: ["Die Elbe fließt an Hamburg vorbei nach Nordwesten."]
              - id: l1-s3
                type: true_false
                text: "Der Main mündet in den Rhein. Stimmt das?"
                answer: true
                hints: ["Kleine Flüsse münden oft in große."]
              - id: l1-s4
                type: multiple_choice
                text: "In welche Richtung fließt die Donau durch Deutschland?"
                options: ["nach Osten", "nach Norden", "nach Westen"]
                answer: "nach Osten"
                hints: ["Das Schwarze Meer liegt weit im Osten von Europa."]
              - id: l1-s5
                type: text_input
                text: "Die Donau ist ungefähr 2850 km lang, der Rhein ungefähr 1230 km. Wie viele Kilometer ist die Donau ungefähr länger?"
                answer: "1620"
                hints: ["Rechne 2850 − 1230."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "An welchem Fluss liegt Dresden?"
                options: ["an der Elbe", "am Rhein", "an der Donau"]
                answer: "an der Elbe"
              - id: l1-n2
                type: sorting
                text: "Rhein oder Donau? Sortiere die Städte."
                bins:
                  - { id: rhein, show: { text: "Rhein" }, say: "Rhein" }
                  - { id: donau, show: { text: "Donau" }, say: "Donau" }
                options:
                  - { text: "Passau", bin: donau }
                  - { text: "Köln", bin: rhein }
                  - { text: "Regensburg", bin: donau }
                  - { text: "Mainz", bin: rhein }
              - id: l1-n3
                type: true_false
                text: "Der Rhein kommt aus den Alpen. Stimmt das?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Welcher Fluss fließt am längsten durch Deutschland?"
                options: ["der Rhein", "der Main", "die Weser"]
                answer: "der Rhein"
              - id: l1-n5
                type: text_input
                text: "Durch Hamburg fließt ein großer Fluss. Wie heißt er? Schreib den Namen."
                keyboard: letters
                answer: "Elbe"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "An welchem Fluss liegt Bremen?"
            options: ["an der Weser", "an der Elbe", "an der Donau"]
            answer: "an der Weser"
          - id: l1-c2
            type: true_false
            text: "Die Elbe fließt ins Schwarze Meer. Stimmt das?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Wo beginnt die Donau?"
            options: ["im Schwarzwald", "in Hamburg", "an der Nordsee"]
            answer: "im Schwarzwald"
          - id: l1-c4
            type: true_false
            text: "Ein Fluss endet an seiner Mündung. Stimmt das?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "In welches Meer fließt der Rhein?"
            options: ["in die Nordsee", "in die Ostsee", "ins Schwarze Meer"]
            answer: "in die Nordsee"
          - id: l1-c6
            type: multiple_choice
            text: "Welcher Fluss fließt an Ulm und Passau vorbei?"
            options: ["die Donau", "die Elbe", "die Weser"]
            answer: "die Donau"

  - n: 2
    title: { de: "Mit Opa Ben auf dem Gipfel", en: "On the summit with Opa Ben" }
    goal:
      de: "Lerne die Gebirge Deutschlands und ihre höchsten Berge kennen. Der höchste Berg ist die Zugspitze in den Alpen."
      en: "Get to know Germany's mountain ranges and their highest peaks. The highest is the Zugspitze in the Alps."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "An welchem Fluss liegt Mainz?"
            options: ["am Rhein", "an der Elbe", "an der Weser"]
            answer: "am Rhein"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Die Donau fließt nach Osten. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Opa Ben wandert jetzt gern auf Berge.\n\nWas glaubst du: Wie hoch ist der höchste Berg Deutschlands? Ungefähr 300 m, 3000 m oder 30 000 m?"
            say: "Seit Opa Ben nicht mehr Schiff fährt, wandert er gern auf Berge. Lotta fragt ihn: Wie hoch ist eigentlich der höchste Berg Deutschlands? Was glaubst du: Ungefähr dreihundert Meter, dreitausend Meter oder dreißigtausend Meter?"
            show: { object: shoe }
          - text: "Ungefähr 3000 m! Die Zugspitze ist 2962 m hoch.\nSie steht in den Alpen, in Bayern, an der Grenze zu Österreich."
            say: "Ungefähr dreitausend Meter! Der höchste Berg Deutschlands ist die Zugspitze. Sie ist 2962 Meter hoch. Sie steht in den Alpen, in Bayern, genau an der Grenze zu Österreich. Auf ihrem Gipfel liegt oft Schnee."
            show: { object: snow }
          - text: "Ein Gebirge sind viele Berge zusammen.\nDie Alpen sind ein Gebirge. Die Zugspitze ist ein Berg darin."
            say: "Lotta fragt: Sind die Alpen ein Berg? Nein! Viele Berge zusammen heißen Gebirge. Die Alpen sind ein Gebirge, und die Zugspitze ist ein Berg in diesem Gebirge. Jedes Gebirge hat einen höchsten Berg."
          - text: "Gebirge und ihre höchsten Berge"
            say: "Opa Ben hat auch die Mittelgebirge besucht. Im Harz steht der Brocken, 1141 Meter hoch. Der Harz liegt vor allem in Sachsen-Anhalt und Niedersachsen. Im Schwarzwald in Baden-Württemberg steht der Feldberg, 1493 Meter hoch. Und in den Alpen in Bayern steht die Zugspitze. Ein weiteres Mittelgebirge ist das Erzgebirge in Sachsen, an der Grenze zu Tschechien. Sein höchster Berg in Deutschland ist der Fichtelberg, 1215 Meter hoch."
            show: { drawn: table, rows: [["Gebirge", "Bundesland", "höchster Berg"], ["Alpen", "Bayern", "Zugspitze, 2962 m"], ["Schwarzwald", "Baden-Württemberg", "Feldberg, 1493 m"], ["Harz", "Sachsen-Anhalt, Niedersachsen", "Brocken, 1141 m"], ["Erzgebirge", "Sachsen", "Fichtelberg, 1215 m"]] }
          - text: "Die Zugspitze ist ungefähr doppelt so hoch wie der Feldberg."
            say: "Vergleich mal: Die Zugspitze ist ungefähr doppelt so hoch wie der Feldberg. Darum sind die Alpen ein Hochgebirge, und der Schwarzwald ist ein Mittelgebirge."
          - text: "Viele Flüsse beginnen im Gebirge.\nRhein: Alpen\nDonau: Schwarzwald"
            say: "Opa Ben sagt: Meine Flüsse kommen aus den Bergen! Viele Flüsse beginnen im Gebirge. Der Rhein kommt aus den Alpen, die Donau aus dem Schwarzwald. Von dort fließt das Wasser bergab bis ins Meer."
            show: { object: ship }
          - text: "Wusstest du? Auf der Zugspitze kannst du mit einem Schritt von Deutschland nach Österreich gehen."
            say: "Wusstest du? Über den Gipfel der Zugspitze läuft die Grenze zwischen Deutschland und Österreich. Oben kannst du mit einem einzigen Schritt von einem Land ins andere gehen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Lotta will auf den höchsten Berg Deutschlands. Wie heißt er?"
                options: ["die Zugspitze", "der Brocken", "der Feldberg"]
                answer: "die Zugspitze"
                hints:
                  - "Der höchste Berg steht im höchsten Gebirge."
                  - "Das höchste Gebirge sind die Alpen. Welcher Berg steht dort?"
                  - "Die Zugspitze, 2962 m."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Ordne die Berge vom höchsten zum niedrigsten."
                options: ["Brocken", "Zugspitze", "Feldberg"]
                slot_count: 3
                answer: ["Zugspitze", "Feldberg", "Brocken"]
                hints:
                  - "Vergleich die Höhen in der Tabelle."
                  - "Zugspitze 2962 m, Feldberg 1493 m, Brocken 1141 m."
                  - "Zugspitze, Feldberg, Brocken."
              - id: l2-f3
                type: true_false
                text: "Die Alpen sind ein Gebirge. Die Zugspitze ist ein Berg darin. Stimmt das?"
                answer: true
                hints:
                  - "Ein Gebirge sind viele Berge zusammen."
                  - "Die Zugspitze ist ein einzelner Berg in den Alpen."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: matching
                text: "In welchem Bundesland liegt das Gebirge? Verbinde."
                pairs:
                  - { left: { text: "Alpen" }, right: { text: "Bayern" } }
                  - { left: { text: "Schwarzwald" }, right: { text: "Baden-Württemberg" } }
                  - { left: { text: "Erzgebirge" }, right: { text: "Sachsen" } }
                hints:
                  - "Die Alpen liegen ganz im Süden, an der Grenze zu Österreich."
                  - "Der Schwarzwald liegt im Südwesten, das Erzgebirge an der Grenze zu Tschechien."
                  - "Alpen Bayern, Schwarzwald Baden-Württemberg, Erzgebirge Sachsen."
              - id: l2-f5
                type: text_input
                text: "Die Zugspitze ist 2962 m hoch, der Brocken 1141 m. Wie viele Meter ist die Zugspitze höher?"
                answer: "1821"
                hints:
                  - "Gesucht ist der Unterschied der beiden Höhen."
                  - "Rechne 2962 − 1141."
                  - "2962 − 1141 = 1821"
              - id: l2-f6
                type: multiple_choice
                text: "In welchem Gebirge beginnt die Donau?"
                options: ["im Schwarzwald", "im Harz", "in den Alpen"]
                answer: "im Schwarzwald"
                hints:
                  - "Die Donau beginnt im Südwesten von Deutschland."
                  - "Aus den Alpen kommt der Rhein."
                  - "Im Schwarzwald."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Opa Ben steht auf dem Brocken. In welchem Gebirge ist er?"
                options: ["im Harz", "in den Alpen", "im Schwarzwald"]
                answer: "im Harz"
                hints: ["Der Brocken ist 1141 m hoch und der höchste Berg eines Mittelgebirges in der Mitte Deutschlands."]
              - id: l2-s2
                type: sorting
                text: "Berg oder Gebirge? Sortiere."
                bins:
                  - { id: berg, show: { text: "ein Berg" }, say: "ein Berg" }
                  - { id: gebirge, show: { text: "ein Gebirge" }, say: "ein Gebirge" }
                options:
                  - { text: "Zugspitze", bin: berg }
                  - { text: "Alpen", bin: gebirge }
                  - { text: "Brocken", bin: berg }
                  - { text: "Harz", bin: gebirge }
                hints: ["Ein Gebirge sind viele Berge zusammen."]
              - id: l2-s3
                type: true_false
                text: "Der Feldberg ist höher als die Zugspitze. Stimmt das?"
                answer: false
                hints: ["Feldberg 1493 m, Zugspitze 2962 m."]
              - id: l2-s4
                type: fill_in_blank
                text: "Was passt?"
                frame: "Die Zugspitze ist _ m hoch. Sie steht in den _."
                options: ["2962", "1141", "Alpen", "Harz"]
                answer: ["2962", "Alpen"]
                hints: ["1141 m hoch ist der Brocken im Harz."]
              - id: l2-s5
                type: multiple_choice
                text: "Auf der Zugspitze ist eine Grenze. Welches Land liegt auf der anderen Seite?"
                options: ["Österreich", "Dänemark", "Polen"]
                answer: "Österreich"
                hints: ["Die Zugspitze steht ganz im Süden von Deutschland."]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "In welchem Gebirge steht der Berg? Verbinde."
                pairs:
                  - { left: { text: "Zugspitze" }, right: { text: "Alpen" } }
                  - { left: { text: "Feldberg" }, right: { text: "Schwarzwald" } }
                  - { left: { text: "Brocken" }, right: { text: "Harz" } }
              - id: l2-n2
                type: true_false
                text: "Die Elbe beginnt im Schwarzwald. Stimmt das?"
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Welches Gebirge ist am höchsten?"
                options: ["die Alpen", "der Harz", "der Schwarzwald"]
                answer: "die Alpen"
              - id: l2-n4
                type: ordering
                text: "Opa Ben wandert auf drei Berge, von Norden nach Süden. Bring sie in die richtige Reihenfolge."
