# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.democracy-vote
skill: world.society.democracy-vote
curriculum: de-DE
language: de
title:
  de: Wählen und abstimmen
  en: Voting and elections
summary: >
  How a democracy decides, starting from the child's own class. Lesson 1
  follows the Klasse 4b as it votes on a class trip: everyone has one
  vote, the votes are counted on a Strichliste, the majority decides and
  the result holds for everyone; it tells an Abstimmung (about a thing)
  from a Wahl (of a person) and an open vote by hand from a secret one
  with folded slips in a box. Lesson 2 moves from the class to the
  country: too many people for one Klassenrat, so adults elect
  Abgeordnete to the Bundestag (from 18, normally every four years); the
  way through the Wahllokal, the Wahlkabine, the Stimmzettel and the
  Wahlurne; a free, equal and secret vote; voting is a right, not a
  duty; the Bundestag also decides by majority. It ends with the skill
  check. Strictly non-partisan: no parties, politicians or current
  issues. Every class, name and vote is written for Twist.
metadata:
  year: klasse-4
  topic: { de: Mitbestimmen, en: Having a say }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.society.class-council, world.society.children-rights]
  also_practises: [world.society.class-council]
  vocabulary: { de: [abstimmen, Abstimmung, Wahl, wählen, Stimme, Mehrheit, Ergebnis, offen, geheim, frei, gleich, Strichliste, Klassensprecher, Demokratie, Bundestag, Abgeordnete, Wahllokal, Wahlkabine, Stimmzettel, Wahlurne] }
  forms: [text, audio, picture, drawn]
  drawn: [bar-chart]
  facets: []
  parts:
    - { id: majority, what: { de: "Stimmen zählen, sagen, wer die Mehrheit hat, und wissen, dass das Ergebnis für alle gilt", en: "counting votes, saying who has the majority, and knowing the result holds for everyone" } }
    - { id: fair-vote, what: { de: "erklären, was eine Wahl fair macht: eine Stimme für jeden, frei, gleich und geheim", en: "explaining what makes a vote fair: one vote each, free, equal and secret" } }
    - { id: election, what: { de: "Wahl und Abstimmung unterscheiden und beschreiben, wie in Deutschland der Bundestag gewählt wird", en: "telling an election from a vote on a matter, and describing how the Bundestag is elected in Germany" } }
  misconceptions:
    - id: loser-opts-out
      what: Thinks the children who voted for something else need not go along with the result, or may no longer say what they think
      addressed: "lesson 1 Learn says the result holds for all and the minority keeps its voice; l1-f3, l1-s3, l1-n5 and l2-c2, l2-c7 test it, with feedback on l1-n5"
    - id: secret-means-hidden
      what: Takes a secret vote to mean that the vote itself is hidden or that nobody may know an election takes place, not that nobody sees what one person votes
      addressed: "lessons 1 and 2 Learn show the folded slip and the Wahlkabine; l1-f5, l1-c4, l2-n4 and l2-c10, l2-c12 ask what secret means, with feedback on l1-c4"
    - id: wahl-abstimmung
      what: Uses Wahl for every decision and does not tell electing a person from voting on a matter
      addressed: "lesson 1 Learn sets Abstimmung (a thing) against Wahl (a person); l1-f2, l1-n2, l1-c3 and l2-c16 sort them"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Die Klasse stimmt ab", en: "The class votes" }
    goal:
      de: "Zähl die Stimmen und finde heraus, wer die Mehrheit hat. Du lernst auch, wann eine Klasse geheim wählt."
      en: "Count the votes and find out who has the majority. You also learn when a class votes in secret."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Im Klassenrat möchte Emre etwas sagen. Was macht er?"
            options: ["Er meldet sich und wartet, bis er dran ist.", "Er ruft laut dazwischen.", "Er flüstert es seinem Nachbarn."]
            answer: "Er meldet sich und wartet, bis er dran ist."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Im Klassenrat darf jedes Kind seine Meinung sagen. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Die 4b darf einen Ausflug machen: ins Schwimmbad, in den Park oder in die Bücherei.\n\nWie entscheidet die Klasse am fairsten?"
            say: "Die Klasse 4b darf einen Ausflug machen. Zur Auswahl stehen das Schwimmbad, der Park und die Bücherei. Was glaubst du: Wie entscheidet die Klasse am fairsten? Bestimmt die Lehrerin, das lauteste Kind oder alle zusammen?"
            show: { object: school }
          - text: "Alle stimmen ab. Jedes Kind hat eine Stimme."
            say: "Am fairsten ist es, wenn alle abstimmen! Vorher sagen die Kinder im Klassenrat ihre Gründe. Dann hat jedes Kind genau eine Stimme. So zählt jede Meinung gleich viel."
          - text: "Die meisten Stimmen hat das Schwimmbad. Es hat die Mehrheit."
            say: "Die Kinder heben die Hand, und Mila macht eine Strichliste. Das Schwimmbad hat dreizehn Stimmen, der Park acht und die Bücherei vier. Das Schwimmbad hat die meisten Stimmen. Es hat die Mehrheit."
            show: { drawn: bar-chart, tally: true, rows: [["Schwimmbad", 13], ["Park", 8], ["Bücherei", 4]] }
          - text: "Die Mehrheit entscheidet. Das Ergebnis gilt für alle."
            say: "So wird in einer Demokratie entschieden: Die Mehrheit entscheidet. Das Ergebnis gilt dann für die ganze Klasse. Auch die Kinder, die für den Park oder die Bücherei waren, fahren mit ins Schwimmbad. Ihre Meinung durften sie trotzdem sagen, und beim nächsten Mal kann es anders ausgehen."
            show: { object: swimming-pool }
          - text: "Abstimmung: Die Klasse entscheidet über eine Sache.\nWahl: Die Klasse bestimmt eine Person für eine Aufgabe."
            say: "Bald wählt die 4b auch eine Klassensprecherin oder einen Klassensprecher. Bei einer Abstimmung entscheidet ihr über eine Sache, zum Beispiel über das Ausflugsziel. Bei einer Wahl bestimmt ihr eine Person für eine Aufgabe."
          - text: "Offen: Alle heben die Hand.\nGeheim: Jeder schreibt einen Namen auf einen Zettel, faltet ihn und wirft ihn in eine Kiste."
            say: "Über den Ausflug hat die Klasse offen abgestimmt, mit der Hand. Bei der Klassensprecherwahl wählt sie lieber geheim. Jedes Kind schreibt einen Namen auf einen Zettel, faltet ihn und wirft ihn in eine Kiste. Niemand sieht, wen du gewählt hast. So kannst du frei entscheiden, und niemand ist hinterher sauer auf dich."
            show: { object: box }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Die 4b stimmt ab: Was gibt es beim Klassenfest? Was hat die Mehrheit?"
                say: "Die 4b stimmt ab, was es beim Klassenfest zu essen gibt. Schau dir die Strichliste an. Was hat die Mehrheit?"
                show: { drawn: bar-chart, tally: true, rows: [["Pizza", 12], ["Kuchen", 6], ["Eis", 7]] }
                options: ["Pizza", "Kuchen", "Eis"]
                answer: "Pizza"
                hints:
                  - "Die Mehrheit hat, was die meisten Stimmen bekommt."
                  - "Zähl die Striche in jeder Zeile und vergleich."
                  - "Pizza hat 12 Stimmen. Das sind die meisten."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Wahl oder Abstimmung? Sortiere."
                say: "Geht es um eine Person oder um eine Sache? Sortiere: Wahl oder Abstimmung?"
                bins:
                  - { id: wahl, show: { text: "Wahl (eine Person)" }, say: "Wahl" }
                  - { id: abst, show: { text: "Abstimmung (eine Sache)" }, say: "Abstimmung" }
                options:
                  - { text: "Wer wird Klassensprecherin?", bin: wahl }
                  - { text: "Wer kümmert sich um die Klassenkasse?", bin: wahl }
                  - { text: "Wohin geht der Ausflug?", bin: abst }
                  - { text: "Welches Spiel spielen wir in der Pause?", bin: abst }
                hints:
                  - "Bei einer Wahl wird eine Person bestimmt."
                  - "Frag dich: Lautet die Antwort ein Name oder eine Sache?"
                  - "Klassensprecherin und Klassenkasse: Wahl. Ausflug und Pausenspiel: Abstimmung."
              - id: l1-f3
                type: true_false
                text: "Das Schwimmbad hat gewonnen. Lea war für den Park.\n\nGilt das Ergebnis auch für Lea?"
                answer: true
                hints:
                  - "Das Ergebnis einer Abstimmung gilt für die ganze Klasse."
                  - "Lea durfte ihre Meinung sagen und abstimmen. Jetzt hat die Mehrheit entschieden."
                  - "Ja, Lea fährt mit ins Schwimmbad."
              - id: l1-f4
                type: image_multiple_choice
                text: "Die Klasse wählt geheim. Wohin kommen die gefalteten Zettel?"
                options: [{ object: box }, { object: schoolbag }, { object: pencil-case }]
                answer: box
                feedback:
                  schoolbag: "Im Schulranzen? Dann nimmt ein Kind alle Stimmen mit nach Hause! Die Zettel kommen in eine Kiste, die alle sehen können."
                hints:
                  - "Alle Zettel kommen an einen Ort, den alle sehen können."
                  - "Danach werden die Zettel zusammen ausgezählt."
                  - "In die Kiste."
              - id: l1-f5
                type: multiple_choice
                text: "Warum wählt die Klasse die Klassensprecherin geheim?"
                options: ["Damit jedes Kind frei wählen kann und niemand Ärger bekommt.", "Damit die Wahl schneller geht.", "Damit die Lehrerin allein entscheiden kann."]
                answer: "Damit jedes Kind frei wählen kann und niemand Ärger bekommt."
                hints:
                  - "Geheim heißt: Niemand sieht, wen du wählst."
                  - "Stell dir vor, deine beste Freundin sieht, dass du jemand anderen wählst."
                  - "Damit jedes Kind frei wählen kann."
              - id: l1-f6
                type: text_input
                text: "Die 4b stimmt über den Namen für das Klassenmeerschweinchen ab. Wie viele Kinder haben abgestimmt?"
                show: { drawn: bar-chart, tally: true, rows: [["Flocke", 9], ["Keks", 11]] }
                answer: "20"
                hints:
                  - "Jedes Kind hat genau eine Stimme."
                  - "Zähl alle Stimmen zusammen: Flocke hat 9, Keks hat 11."
                  - "9 + 11 = 20"

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Ist das fair bei einer Abstimmung? Sortiere."
                say: "Ist das fair bei einer Abstimmung, oder nicht? Sortiere."
                bins:
                  - { id: fair, show: { text: "fair" }, say: "fair" }
                  - { id: unfair, show: { text: "nicht fair" }, say: "nicht fair" }
                options:
                  - { text: "Jedes Kind hat eine Stimme.", bin: fair }
                  - { text: "Vorher dürfen alle ihre Gründe sagen.", bin: fair }
                  - { text: "Jonas hebt dreimal die Hand und zählt dreimal.", bin: unfair }
                  - { text: "Tim sagt: „Wer nicht für Fußball stimmt, darf nicht mitspielen!“", bin: unfair }
                hints: ["Bei einer fairen Abstimmung zählt jede Stimme einmal, und niemand wird unter Druck gesetzt."]
              - id: l1-s2
                type: multiple_choice
                text: "Die 4b stimmt über ein neues Pausenspiel ab. Was hat die Mehrheit?"
                say: "Die 4b stimmt über ein neues Pausenspiel ab. Schau dir die Strichliste an. Was hat die Mehrheit?"
                show: { drawn: bar-chart, tally: true, rows: [["Tischtennis", 8], ["Verstecken", 10], ["Gummitwist", 6]] }
                options: ["Tischtennis", "Verstecken", "Gummitwist"]
                answer: "Verstecken"
                hints: ["Welche Zeile hat die meisten Striche?"]
              - id: l1-s3
                type: true_false
                text: "Wer bei einer Abstimmung verliert, darf seine Meinung danach nicht mehr sagen. Stimmt das?"
                answer: false
                hints: ["Das Ergebnis gilt für alle. Aber sagen, was man denkt, darf jeder."]
              - id: l1-s4
                type: matching
                text: "Was bedeutet das Wort? Verbinde."
                pairs:
                  - { left: { text: "Mehrheit" }, right: { text: "die meisten Stimmen" } }
                  - { left: { text: "geheim" }, right: { text: "Niemand sieht, wen du wählst." } }
                  - { left: { text: "Abstimmung" }, right: { text: "Entscheidung über eine Sache" } }
                  - { left: { text: "Wahl" }, right: { text: "Eine Person wird bestimmt." } }
                hints: ["Bei der Wahl geht es um eine Person, bei der Abstimmung um eine Sache."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Die 4b stimmt offen ab. Was zeigen die Kinder?"
                options: [{ object: hand }, { object: box }, { object: bell }]
                answer: hand
                hints: ["Offen abstimmen heißt: Alle sehen, wer wofür ist."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Die 4a hat über ihren Ausflug abgestimmt. Wohin fährt sie?"
                say: "Die Klasse 4a hat über ihren Ausflug abgestimmt. Schau dir die Strichliste an. Wohin fährt sie?"
                show: { drawn: bar-chart, tally: true, rows: [["Kletterwald", 6], ["Zoo", 9], ["Museum", 10]] }
                options: ["in den Kletterwald", "in den Zoo", "ins Museum"]
                answer: "ins Museum"
              - id: l1-n2
                type: sorting
                text: "Wahl oder Abstimmung? Sortiere."
                say: "Geht es um eine Person oder um eine Sache? Sortiere: Wahl oder Abstimmung?"
                bins:
                  - { id: wahl, show: { text: "Wahl (eine Person)" }, say: "Wahl" }
                  - { id: abst, show: { text: "Abstimmung (eine Sache)" }, say: "Abstimmung" }
                options:
                  - { text: "Wer vertritt die Klasse im Schülerrat?", bin: wahl }
                  - { text: "Wer leitet den nächsten Klassenrat?", bin: wahl }
                  - { text: "Welches Buch lesen wir als Nächstes?", bin: abst }
                  - { text: "Welche Farbe bekommt unsere Klassenfahne?", bin: abst }
              - id: l1-n3
                type: true_false
                text: "Bei der Klassensprecherwahl bekommt Mila 12 Stimmen und Ben 13 Stimmen.\n\nIst Ben gewählt?"
                show: { drawn: bar-chart, tally: true, rows: [["Mila", 12], ["Ben", 13]] }
                answer: true
              - id: l1-n4
                type: text_input
                text: "In der 4c stimmen 26 Kinder ab. 15 sind für das Schwimmbad, die anderen sind dagegen. Wie viele sind dagegen?"
                answer: "11"
              - id: l1-n5
                type: multiple_choice
                text: "Paul war für den Park, aber das Schwimmbad hat gewonnen. Was ist fair?"
                options: ["Paul fährt mit ins Schwimmbad und sagt beim nächsten Mal wieder seine Gründe.", "Paul fährt allein in den Park.", "Paul lässt so lange abstimmen, bis der Park gewinnt."]
                answer: "Paul fährt mit ins Schwimmbad und sagt beim nächsten Mal wieder seine Gründe."
                feedback:
                  "Paul lässt so lange abstimmen, bis der Park gewinnt.": "Dann stimmt die Klasse noch an Weihnachten ab! Das Ergebnis gilt für alle, auch für Paul."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Die 4b stimmt über den Spielenachmittag ab. Was hat die Mehrheit?"
            say: "Die 4b stimmt über den Spielenachmittag ab. Schau dir die Strichliste an. Was hat die Mehrheit?"
            show: { drawn: bar-chart, tally: true, rows: [["Brettspiele", 7], ["Basteln", 5], ["Schatzsuche", 12]] }
            options: ["Brettspiele", "Basteln", "Schatzsuche"]
            answer: "Schatzsuche"
          - id: l1-c2
            type: true_false
            text: "Bei einer Abstimmung in der Klasse hat jedes Kind zwei Stimmen. Stimmt das?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Welche Frage beantwortet die Klasse mit einer Wahl?"
            options: ["Wer wird Klassensprecher?", "Wohin geht der Ausflug?", "Was essen wir beim Fest?"]
            answer: "Wer wird Klassensprecher?"
          - id: l1-c4
            type: multiple_choice
            text: "Die Klassensprecherwahl ist geheim. Was heißt das?"
            options: ["Niemand sieht, wen du wählst.", "Niemand darf wissen, dass gewählt wird.", "Nur die Lehrerin darf wählen."]
            answer: "Niemand sieht, wen du wählst."
            feedback:
              "Niemand darf wissen, dass gewählt wird.": "Die Wahl selbst ist kein Geheimnis. Geheim ist nur, wen jeder Einzelne wählt."
          - id: l1-c5
            type: true_false
            text: "Das Ergebnis gilt auch für die Kinder, die anders abgestimmt haben. Stimmt das?"
            answer: true
          - id: l1-c6
            type: text_input
            text: "24 Kinder stimmen ab. Der Zoo bekommt 13 Stimmen, alle anderen sind für das Kino. Wie viele Stimmen hat das Kino?"
            answer: "11"

  - n: 2
    title: { de: "Wählen in Deutschland", en: "Elections in Germany" }
    goal:
      de: "Finde heraus, wie die Erwachsenen in Deutschland den Bundestag wählen und warum die Wahl frei, gleich und geheim ist."
      en: "Find out how adults in Germany elect the Bundestag and why the vote is free, equal and secret."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Die 4b stimmt über ein Klassenfoto ab: drinnen oder draußen? Was hat die Mehrheit?"
            say: "Die 4b stimmt ab, wo das Klassenfoto gemacht wird. Schau dir die Strichliste an. Was hat die Mehrheit?"
            show: { drawn: bar-chart, tally: true, rows: [["drinnen", 10], ["draußen", 14]] }
            options: ["drinnen", "draußen"]
            answer: "draußen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Bei einer geheimen Wahl sieht niemand, wen du wählst. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "In Deutschland leben über 80 Millionen Menschen.\n\nPassen sie alle in einen Klassenrat?"
            say: "In deiner Klasse sitzen alle im Kreis und stimmen gemeinsam ab. In Deutschland leben aber über achtzig Millionen Menschen. Was glaubst du: Passen sie alle in einen Klassenrat?"
            show: { object: map }
          - text: "Nein! Die Erwachsenen wählen Menschen, die für sie beraten und entscheiden."
            say: "Nein, dafür bräuchte man einen Stuhlkreis, der viele Kilometer lang ist! Darum wählen die Erwachsenen Menschen, die für sie beraten und entscheiden. Für ganz Deutschland ist das der Bundestag in Berlin. Die Gewählten heißen Abgeordnete."
          - text: "Demokratie heißt: Das Volk herrscht."
            say: "So eine Ordnung heißt Demokratie. Das Wort kommt aus dem Griechischen und bedeutet: Das Volk herrscht. In einer Demokratie bestimmt kein König allein. Die Bürgerinnen und Bürger bestimmen mit, durch Wahlen."
            show: { object: crown, crossed: true }
          - text: "Bundestagswahl: wählen ab 18 Jahren, normalerweise alle 4 Jahre.\nWählen ist ein Recht. Niemand muss wählen."
            say: "Bei der Bundestagswahl darf man ab achtzehn Jahren wählen. Der Bundestag wird normalerweise alle vier Jahre neu gewählt. Wählen ist ein Recht: Man darf wählen, aber niemand muss. Kinder dürfen hier noch nicht wählen. In der Klasse und im Klassenrat bestimmen sie aber schon mit."
          - text: "1. ins Wahllokal gehen\n2. in der Wahlkabine allein ankreuzen\n3. den Stimmzettel falten\n4. ihn in die Wahlurne werfen"
            say: "Am Wahltag geht man ins Wahllokal. Das ist oft eine Schule! In der Wahlkabine kreuzt man allein auf dem Stimmzettel an, wen man wählt. Dann faltet man den Zettel und wirft ihn in die Wahlurne. Das ist eine Kiste mit einem Schlitz, so wie bei eurer Klassensprecherwahl."
            show: { object: box }
          - text: "Die Wahl ist frei, gleich und geheim."
            say: "Im Grundgesetz steht, wie die Wahl sein muss. Frei: Niemand darf dich zwingen oder dir drohen. Gleich: Jede Stimme zählt gleich viel, egal ob jemand reich oder arm ist. Geheim: Niemand sieht, was du ankreuzt, und du musst es niemandem verraten."
            show: { object: voting-booth }
          - text: "Nach der Wahl werden alle Stimmen gezählt. Auch im Bundestag entscheidet die Mehrheit."
            say: "Nach der Wahl werden alle Stimmen gezählt. Auch im Bundestag stimmen die Abgeordneten ab, zum Beispiel über neue Gesetze. Dort entscheidet ebenfalls die Mehrheit, genau wie in deiner Klasse."
          - text: "Wusstest du? Eine Bundestagswahl ist immer an einem Sonntag oder an einem Feiertag."
            say: "Wusstest du? Eine Bundestagswahl ist in Deutschland immer an einem Sonntag oder an einem Feiertag. So steht es im Gesetz. An diesem Tag haben die meisten Menschen frei und können in Ruhe wählen gehen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Frau Kim geht wählen. Bring die Schritte in die richtige Reihenfolge."
                options: ["Den Zettel in die Wahlurne werfen.", "Ins Wahllokal gehen.", "Den Stimmzettel falten.", "In der Wahlkabine ankreuzen."]
                slot_count: 4
                answer: ["Ins Wahllokal gehen.", "In der Wahlkabine ankreuzen.", "Den Stimmzettel falten.", "Den Zettel in die Wahlurne werfen."]
                option_audio: false
                hints:
                  - "Zuerst muss Frau Kim dort sein, wo gewählt wird."
                  - "Erst ankreuzen, dann falten. Die Urne kommt zuletzt."
                  - "Wahllokal, Wahlkabine, falten, Wahlurne."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Opa Karl ist 70, Mama ist 38, Lena ist 16 und Tim ist 10. Wer darf bei der Bundestagswahl wählen?"
                options: ["Opa Karl und Mama", "nur Opa Karl", "alle vier"]
                answer: "Opa Karl und Mama"
                feedback:
                  "alle vier": "Tim mit 10 Jahren im Wahllokal? Bei der Bundestagswahl darf man erst ab 18 wählen."
                hints:
                  - "Bei der Bundestagswahl gibt es ein Mindestalter."
                  - "Man darf ab 18 Jahren wählen. Wer ist mindestens 18?"
                  - "Opa Karl und Mama sind älter als 18."
              - id: l2-f3
                type: matching
                text: "Wie muss eine Wahl sein? Verbinde."
                pairs:
                  - { left: { text: "frei" }, right: { text: "Niemand darf dich zwingen, wen du wählst." } }
                  - { left: { text: "gleich" }, right: { text: "Jede Stimme zählt gleich viel." } }
                  - { left: { text: "geheim" }, right: { text: "Niemand sieht, was du ankreuzt." } }
                hints:
                  - "Jedes Wort sagt etwas anderes über die Wahl."
                  - "Gleich hat mit dem Zählen der Stimmen zu tun, geheim mit dem Zuschauen."
                  - "frei: kein Zwang. gleich: jede Stimme zählt gleich. geheim: niemand sieht es."
              - id: l2-f4
                type: true_false
                text: "Ein Chef sagt zu seinen Leuten: „Wählt, wen ich sage, sonst verliert ihr eure Arbeit!“\n\nDarf er das?"
                answer: false
                hints:
                  - "Die Wahl muss frei sein."
                  - "Frei heißt: Niemand darf dich zwingen oder dir drohen."
                  - "Nein, das darf er nicht."
              - id: l2-f5
                type: image_multiple_choice
                text: "Worin landet der Stimmzettel am Ende?"
