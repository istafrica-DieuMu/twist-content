# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.fact-fiction
skill: world.time.fact-fiction
curriculum: de-DE
language: de
title:
  de: Erfunden oder wirklich passiert?
  en: Made up or really happened?
summary: >
  Nele and Malik of the 4c are history detectives for the class exhibition.
  Lesson 1 checks old stories: the Rattenfänger von Hameln is a Sage, which
  names a real place and often a time but adds much that is made up; old
  writings from Hameln say that children left the town in 1284, why is not
  known, so a Sage can have a true core (and the oldest reports have no
  rats at all); the Loreley as a second example (the Rhine is narrow and
  dangerous there); a Märchen starts with "Es war einmal", names no exact
  place or year and has magic and talking animals; a Sachtext or Sachbuch
  tells how it really was from sources and says what is not known; clues
  for made up and for facts, and that a year alone proves nothing.
  Lesson 2 checks films, games, comics and novels about the past: settings
  and clothes may be right, figures, words and adventures are invented,
  things are changed to be exciting ("nach einer wahren Geschichte" still
  adds a lot); a comic made today is no source from back then; Viking
  helmets had no horns; how to check (Sachbuch or Kinderlexikon, museum,
  experts, comparing several sources); made-up stories are fine when you
  know they are made up. It ends with the skill check. Every name, film
  and game is written for Twist; the Sagen are traditional.
metadata:
  year: klasse-4
  topic: { de: Leben in anderen Zeiten, en: Life in other times }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.time.sources, world.society.media-reality]
  also_practises: [world.time.sources]
  vocabulary: { de: [Sage, Märchen, Sachtext, Sachbuch, Quelle, Sachquelle, erfunden, echt, wahrer Kern, Hinweis, Fund, Museum, Fachleute, Comic, Roman, nachprüfen, vergleichen, Geschichtsdetektiv] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: kinds, what: { de: "Märchen, Sage und Sachtext unterscheiden", en: "telling a fairy tale, a legend and a factual text apart" } }
    - { id: clues, what: { de: "Hinweise auf Erfundenes und auf Fakten erkennen und den wahren Kern einer Sage finden", en: "spotting clues for what is made up and what is fact, and finding the true core of a legend" } }
    - { id: media, what: { de: "erklären, was in Filmen, Spielen und Comics über früher echt und was erfunden ist", en: "explaining what is real and what is made up in films, games and comics about the past" } }
    - { id: check, what: { de: "sagen, wie man nachprüft, wie es früher wirklich war", en: "saying how to check what the past was really like" } }
  misconceptions:
    - id: date-proves-truth
      what: Thinks a story must be true because it names a year or a real place
      addressed: "lesson 1 Learn on clues says a year alone proves nothing; l1-s1, l1-s5 and l2-c9"
    - id: legend-all-false
      what: Thinks a legend is either entirely true or entirely invented
      addressed: "lesson 1 Learn on the true core; l1-f4, l1-n2, l1-n4, l1-c6 and l2-c8"
    - id: based-on-true-story
      what: Takes a film or game set in the past, or one "based on a true story", as showing exactly how it was
      addressed: "lesson 2 Learn; l2-f3, l2-f4, l2-n1, l2-c12 and l2-c14"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Sage, Märchen oder Sachtext?", en: "Legend, fairy tale or factual text?" }
    goal:
      de: "Werde Geschichtsdetektiv mit Nele und Malik. Du lernst, eine Sage von einem Sachtext zu unterscheiden und den wahren Kern zu finden."
      en: "Become a history detective with Nele and Malik. You learn to tell a legend from a factual text and to find the true core."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ein alter Brief erzählt von früher. Was für eine Quelle ist er?"
            options: ["eine Schriftquelle", "eine Sachquelle", "eine Bildquelle"]
            answer: "eine Schriftquelle"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ein Foto im Internet kann verändert worden sein. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Nele und Malik aus der 4c sind Geschichtsdetektive. Ihr erster Fall:\n„Ein Mann mit einer Flöte lockt alle Ratten aus der Stadt Hameln.“\n\nWas glaubst du: Ist das wirklich so passiert?"
            say: "Nele und Malik aus der Klasse 4c sind Geschichtsdetektive. Für die Ausstellung ihrer Klasse prüfen sie Geschichten über früher. Ihr erster Fall: Ein Mann mit einer Flöte lockt alle Ratten aus der Stadt Hameln. Was glaubst du: Ist das wirklich so passiert?"
          - text: "Das ist eine Sage: der Rattenfänger von Hameln."
            say: "Das ist eine Sage, der Rattenfänger von Hameln. In der Sage spielt ein Mann so schön Flöte, dass ihm alle Ratten folgen. Als die Stadt ihn nicht bezahlt, lockt er auch hundertdreißig Kinder aus der Stadt. Eine Sage erzählt von früher. Sie nennt oft einen echten Ort, manchmal auch eine Jahreszahl. Vieles darin ist aber erfunden oder übertrieben."
          - text: "Viele Sagen haben einen wahren Kern."
            say: "Viele Sagen haben einen wahren Kern. Alte Schriften aus Hameln berichten, dass im Jahr zwölfhundertvierundachtzig hundertdreißig Kinder die Stadt verlassen haben. Warum, weiß heute niemand genau. Vielleicht zogen junge Leute fort, um anderswo zu leben. Etwas ist also wirklich passiert. Die Geschichte drumherum wurde aber ausgeschmückt."
          - text: "Märchen: „Es war einmal“, kein genauer Ort, keine Jahreszahl, Zauberei, sprechende Tiere.\nSage: ein echter Ort, oft eine Zeit, dazu viel Erfundenes."
            say: "Und was ist ein Märchen? Ein Märchen fängt oft mit Es war einmal an. Es nennt keinen genauen Ort und keine Jahreszahl. Darin gibt es Zauberei, Feen und sprechende Tiere. Eine Sage dagegen spielt an einem echten Ort, oft auch zu einer bestimmten Zeit, und erzählt trotzdem viel Erfundenes."
            show: { object: witch }
          - text: "Ein Sachtext oder Sachbuch erzählt, wie es wirklich war. Es stützt sich auf Quellen."
            say: "Ein Sachtext oder ein Sachbuch erzählt, wie es wirklich war. Forscherinnen und Forscher lesen alte Schriften, graben Funde aus und vergleichen sie. Ein gutes Sachbuch schreibt auf, was man aus den Quellen weiß. Und es sagt auch, was man nicht genau weiß."
            show: { object: book }
          - text: "Hinweise auf Erfundenes: Zauberei, Drachen, Riesen, sprechende Tiere.\nHinweise auf Fakten: Quellen, Funde, Fachleute, die es prüfen."
            say: "So arbeiten Geschichtsdetektive. Hinweise auf Erfundenes sind Zauberei, Drachen, Riesen und sprechende Tiere. Hinweise auf Fakten sind Quellen, Funde im Museum und Fachleute, die alles prüfen. Aber Vorsicht: Eine Jahreszahl allein beweist noch nichts. Auch eine Sage kann eine Jahreszahl nennen. Frag immer: Woher weiß man das?"
          - text: "Wusstest du? In den ältesten Berichten aus Hameln kommen gar keine Ratten vor."
            say: "Wusstest du? In den ältesten Berichten aus Hameln kommen gar keine Ratten vor. Die Ratten kamen erst viel später in die Geschichte. So verändert sich eine Sage, wenn man sie immer weitererzählt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Nele liest: „Es war einmal eine Prinzessin, die mit einem Frosch sprach.“\n\nWas ist das?"
                options: ["ein Märchen", "ein Sachtext", "ein Brief"]
                answer: "ein Märchen"
                hints:
                  - "Achte auf den Anfang und auf den Frosch."
                  - "„Es war einmal“ und ein sprechendes Tier: Woran erinnert dich das?"
                  - "Ein Märchen."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Klingt das erfunden, oder ist es ein Hinweis auf Fakten? Sortiere."
                bins:
                  - { id: made, show: { text: "klingt erfunden" }, say: "klingt erfunden" }
                  - { id: fact, show: { text: "Hinweis auf Fakten" }, say: "Hinweis auf Fakten" }
                options:
                  - { text: "Ein Riese wirft Felsen in den Fluss.", bin: made }
                  - { text: "Ein Pferd spricht mit dem Ritter.", bin: made }
                  - { text: "Im Museum liegt ein Schwert, das man ausgegraben hat.", bin: fact }
                  - { text: "Ein alter Brief aus der Zeit erzählt davon.", bin: fact }
                hints:
                  - "Kann das in Wirklichkeit passieren?"
                  - "Riesen und sprechende Tiere gibt es nicht. Funde und alte Briefe sind Quellen."
                  - "Riese und sprechendes Pferd: erfunden. Schwert und Brief: Fakten."
              - id: l1-f3
                type: true_false
                text: "Eine Sage nennt oft einen echten Ort. Stimmt das?"
                answer: true
                hints:
                  - "Denk an den Rattenfänger. Wo spielt die Sage?"
                  - "Hameln ist eine echte Stadt."
                  - "Ja, Sagen nennen oft echte Orte."
              - id: l1-f4
                type: multiple_choice
                text: "Malik liest eine Sage: „Auf einem hohen Felsen am Rhein, der Loreley, sitzt eine Frau und singt. Die Schiffer schauen zu ihr hoch und fahren gegen die Felsen.“\n\nWas könnte der wahre Kern sein?"
                options: ["An dieser Stelle ist der Rhein eng und gefährlich für Schiffe.", "Dort sitzt heute noch eine singende Frau.", "Schiffer hören gern Musik."]
                answer: "An dieser Stelle ist der Rhein eng und gefährlich für Schiffe."
                hints:
                  - "Der wahre Kern ist etwas, das man wirklich prüfen kann."
                  - "Warum könnten Schiffe dort wirklich verunglückt sein?"
                  - "Der Rhein ist dort eng und gefährlich."
              - id: l1-f5
                type: matching
                text: "Was gehört zusammen? Verbinde."
                pairs:
                  - { left: { text: "Märchen" }, right: { text: "„Es war einmal“ und Zauberei" } }
                  - { left: { text: "Sage" }, right: { text: "echter Ort, aber vieles erfunden" } }
                  - { left: { text: "Sachbuch" }, right: { text: "erzählt, wie es wirklich war" } }
                hints:
                  - "Eine der drei Arten stützt sich auf Quellen."
                  - "Die Sage nennt einen echten Ort, das Märchen nicht."
                  - "Märchen: Zauberei. Sage: echter Ort. Sachbuch: wie es wirklich war."
              - id: l1-f6
                type: image_multiple_choice
                text: "Welches Wesen kommt nur in Sagen und Märchen vor?"
                options: [{ object: troll }, { object: horse }, { object: sheep }]
                answer: troll
                hints:
                  - "Zwei der Tiere kannst du auf einem Bauernhof sehen."
                  - "Welches Wesen hat noch nie jemand wirklich gesehen?"
                  - "Der Troll."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Wenn in einer Geschichte eine Jahreszahl steht, ist sie bestimmt wahr. Stimmt das?"
                answer: false
                hints: ["Auch die Sage vom Rattenfänger nennt eine Jahreszahl."]
              - id: l1-s2
                type: multiple_choice
                text: "Woher weiß ein Sachbuch, wie es früher war?"
                options: ["aus Quellen wie alten Schriften und Funden", "aus Träumen", "aus Märchen"]
                answer: "aus Quellen wie alten Schriften und Funden"
                hints: ["Forscherinnen und Forscher lesen alte Schriften und graben."]
              - id: l1-s3
                type: sorting
                text: "Märchen oder Sage? Sortiere."
                bins:
                  - { id: tale, show: { text: "Märchen" }, say: "Märchen" }
                  - { id: saga, show: { text: "Sage" }, say: "Sage" }
                options:
                  - { text: "Es war einmal ein Mädchen, das tief im Wald wohnte.", bin: tale }
                  - { text: "Es war einmal ein Esel, der sprechen konnte.", bin: tale }
                  - { text: "In Hameln kam einst ein Mann mit einer Flöte in die Stadt.", bin: saga }
                  - { text: "Am Rhein bei der Loreley sang einst eine Frau auf dem Felsen.", bin: saga }
                hints: ["Nennt die Geschichte einen echten Ort?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Eine Sage hat oft einen wahren _. Ein Sachbuch stützt sich auf _."
                options: ["Kern", "Quellen", "Drachen", "Zauberei"]
                answer: ["Kern", "Quellen"]
                hints: ["Etwas in der Sage ist wirklich passiert. Das Sachbuch weiß es aus alten Schriften und Funden."]
              - id: l1-s5
                type: multiple_choice
                text: "Malik liest: „Im Jahr 1284 haben 130 Kinder Hameln verlassen.“ Was fragt ein guter Geschichtsdetektiv?"
                options: ["Woher weiß man das? Gibt es eine Quelle?", "Welche Farbe hatte die Flöte?", "Gar nichts, die Jahreszahl reicht."]
                answer: "Woher weiß man das? Gibt es eine Quelle?"
                hints: ["Eine Jahreszahl allein beweist noch nichts."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Sachbuch oder erfundene Geschichte? Sortiere."
                bins:
                  - { id: fact, show: { text: "Sachbuch" }, say: "Sachbuch" }
                  - { id: made, show: { text: "erfundene Geschichte" }, say: "erfundene Geschichte" }
                options:
                  - { text: "Ein Drache bewacht den Schatz der Burg.", bin: made }
                  - { text: "Ein Junge zaubert sich ins Mittelalter.", bin: made }
                  - { text: "Forscher haben die Reste einer Burg ausgegraben.", bin: fact }
                  - { text: "In der Steinzeit machten Menschen Werkzeug aus Feuerstein.", bin: fact }
              - id: l1-n2
                type: true_false
                text: "In einer Sage ist immer alles erfunden. Stimmt das?"
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Welcher Satz klingt nach einem Märchen?"
                options: ["Es war einmal ein armer Müller, der eine Katze mit Stiefeln hatte.", "Um 1450 druckte Gutenberg in Mainz Bücher.", "Forscher fanden am Rhein alte Münzen."]
                answer: "Es war einmal ein armer Müller, der eine Katze mit Stiefeln hatte."
              - id: l1-n4
                type: multiple_choice
                text: "Was ist der wahre Kern der Sage vom Rattenfänger?"
                options: ["Alte Schriften berichten, dass Kinder aus Hameln fortgingen.", "Ein Mann konnte mit einer Flöte zaubern.", "Ratten folgen jeder Flötenmusik."]
                answer: "Alte Schriften berichten, dass Kinder aus Hameln fortgingen."
              - id: l1-n5
                type: image_multiple_choice
                text: "Welches dieser Wesen gibt es wirklich?"
                options: [{ object: wolf }, { object: troll }, { object: ghost }]
                answer: wolf

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Woran erkennst du oft ein Märchen?"
            options: ["am Anfang „Es war einmal“", "an einer genauen Jahreszahl", "an einem Foto"]
            answer: "am Anfang „Es war einmal“"
          - id: l1-c2
            type: true_false
            text: "Ein Sachbuch stützt sich auf Quellen. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was ist der Rattenfänger von Hameln?"
            options: ["eine Sage", "ein Sachtext", "ein Brief"]
            answer: "eine Sage"
          - id: l1-c4
            type: true_false
            text: "Ein Drache in einer Geschichte ist ein Hinweis auf Fakten. Stimmt das?"
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Wer kommt nur in Geschichten vor?"
            options: [{ object: ghost }, { object: cow }, { object: hen }]
            answer: ghost
          - id: l1-c6
            type: multiple_choice
            text: "Was heißt: Eine Sage hat einen wahren Kern?"
            options: ["Ein kleiner Teil ist wirklich passiert.", "Alles ist genau so passiert.", "In der Sage kommt ein Apfel vor."]
            answer: "Ein kleiner Teil ist wirklich passiert."

  - n: 2
    title: { de: "Film, Spiel und Wirklichkeit", en: "Film, game and reality" }
    goal:
      de: "Finde heraus, was in Filmen und Spielen über früher echt ist und was erfunden. Du lernst auch, wie du es nachprüfst."
      en: "Find out what is real and what is made up in films and games about the past. You also learn how to check."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Geschichte nennt einen echten Ort, ist aber zum Teil erfunden?"
            options: ["eine Sage", "ein Sachbuch", "ein Kochbuch"]
            answer: "eine Sage"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein sprechendes Tier ist ein Hinweis auf etwas Erfundenes. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Malik spielt ein Spiel. Darin baut er in fünf Minuten eine ganze Burg.\n\nWas glaubst du: Wie lange hat man im Mittelalter an einer Burg gebaut?"
            say: "Malik spielt ein Spiel am Computer. Darin baut er in fünf Minuten eine ganze Burg. Was glaubst du: Wie lange hat man im Mittelalter an einer echten Burg gebaut?"
          - text: "Oft viele Jahre! Im Spiel geht es schnell, damit es Spaß macht."
            say: "Oft viele Jahre! Viele Menschen schleppten Steine und Holz, ganz ohne Bagger und Kran mit Motor. Im Spiel geht es schnell, damit es Spaß macht. Filme und Spiele verändern die Geschichte, damit sie spannend ist."
          - text: "In Filmen und Spielen über früher ist manches echt und manches erfunden."
            say: "In Filmen und Spielen über früher sehen Burgen, Kleidung und Werkzeuge oft so aus wie damals. Die Figuren, was sie sagen, und viele Abenteuer haben sich die Macher aber ausgedacht. Zauberer und Drachen sind sowieso erfunden."
          - text: "„Nach einer wahren Geschichte“ heißt: Etwas ist wirklich passiert. Vieles ist trotzdem dazuerfunden."
            say: "Manchmal steht bei einem Film: nach einer wahren Geschichte. Das heißt: Etwas davon ist wirklich passiert. Vieles ist trotzdem dazuerfunden, zum Beispiel Gespräche oder ganze Figuren."
          - text: "Ein Comic oder Roman über früher spielt oft in einer echten Zeit, mit erfundenen Figuren. Eine Quelle von damals ist er nicht."
            say: "Nele liest einen Comic über die Steinzeit. Er spielt in einer echten Zeit, aber die Figuren sind erfunden. Und der Comic wurde viel später gezeichnet. Darum ist er keine Quelle aus der Steinzeit."
            show: { object: book-open }
          - text: "So prüfst du nach:\nim Sachbuch oder Kinderlexikon lesen,\nins Museum gehen,\nFachleute fragen,\nmehrere Quellen vergleichen."
            say: "Wie war es wirklich? So prüfst du nach: Lies in einem Sachbuch oder Kinderlexikon. Geh ins Museum und schau dir echte Funde an. Frag Fachleute. Und vergleich mehrere Quellen. Wenn sie dasselbe sagen, stimmt es wahrscheinlich."
          - text: "Erfundene Geschichten sind nicht schlecht! Wichtig ist, dass du weißt, was erfunden ist."
            say: "Erfundene Geschichten, Filme und Spiele sind nicht schlecht. Sie machen Spaß und können neugierig auf früher machen. Wichtig ist nur, dass du weißt, was erfunden ist."
          - text: "Wusstest du? Wikinger trugen keine Helme mit Hörnern."
            say: "Wusstest du? In Filmen und Comics haben Wikinger oft Helme mit Hörnern. Kein Wikingerhelm, den Forscher gefunden haben, hat aber Hörner. Die Hörner haben sich Künstler vor mehr als hundert Jahren für Bilder und Theaterstücke ausgedacht."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Im Film reitet ein Ritter auf einem Drachen zu seiner Burg. Was ist erfunden?"
                options: ["der Drache", "die Burg aus Stein", "die Rüstung des Ritters"]
                answer: "der Drache"
                hints:
                  - "Burgen und Rüstungen kannst du im Museum sehen."
                  - "Welches Wesen kommt nur in Sagen und Märchen vor?"
                  - "Der Drache."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Im Ritterfilm: Kann das echt sein, oder ist es erfunden? Sortiere."
                bins:
                  - { id: real, show: { text: "kann echt sein" }, say: "kann echt sein" }
                  - { id: made, show: { text: "erfunden" }, say: "erfunden" }
                options:
                  - { text: "Burgen mit dicken Mauern", bin: real }
                  - { text: "Ritter auf Pferden", bin: real }
                  - { text: "ein Zauberer, der Blitze schleudert", bin: made }
                  - { text: "eine Burg, die in einer Nacht fertig ist", bin: made }
                hints:
                  - "Was hast du über das Mittelalter gelernt?"
                  - "Zauberei gibt es nicht, und eine Burg zu bauen dauerte viele Jahre."
                  - "Mauern und Pferde: kann echt sein. Zauberer und Burg in einer Nacht: erfunden."
              - id: l2-f3
                type: true_false
                text: "„Nach einer wahren Geschichte“ heißt: Alles im Film ist genau so passiert. Stimmt das?"
                answer: false
                hints:
                  - "Etwas ist wirklich passiert. Aber alles?"
                  - "Gespräche und manche Figuren sind oft dazuerfunden."
                  - "Nein, vieles ist dazuerfunden."
              - id: l2-f4
                type: multiple_choice
                text: "Nele liest einen Comic über die Steinzeit. Ist der Comic eine Quelle aus der Steinzeit?"
                options: ["Nein, er wurde viel später gezeichnet.", "Ja, weil er Bilder hat.", "Ja, weil er von früher erzählt."]
                answer: "Nein, er wurde viel später gezeichnet."
                hints:
                  - "Eine Quelle stammt aus der Zeit, von der sie erzählt."
                  - "Wann wurde der Comic gezeichnet?"
                  - "Nein, er wurde viel später gemacht."
              - id: l2-f5
                type: image_multiple_choice
                text: "Malik will nachprüfen, wie es früher wirklich war. Was hilft ihm?"
                options: [{ object: book }, { object: dice }, { object: ghost }]
                answer: book
                feedback:
                  dice: "Würfeln? Dann wäre die Antwort reiner Zufall! Ein Sachbuch hilft beim Nachprüfen."
                hints:
                  - "Malik braucht etwas, das sich auf Quellen stützt."
                  - "Darin kann er nachlesen."
                  - "Ein Buch, zum Beispiel ein Sachbuch."
              - id: l2-f6
                type: matching
                text: "Was passt? Verbinde."
                pairs:
                  - { left: { text: "Film" }, right: { text: "spannend erzählt, vieles erfunden" } }
                  - { left: { text: "Sachbuch" }, right: { text: "stützt sich auf Quellen" } }
                  - { left: { text: "Museum" }, right: { text: "zeigt echte Funde" } }
                  - { left: { text: "Computerspiel" }, right: { text: "Man kann Dinge tun, die es nie gab." } }
                hints:
                  - "Zwei davon helfen beim Nachprüfen, zwei sind zum Spaß gemacht."
                  - "Funde liegen im Museum. Quellen stehen im Sachbuch."
                  - "Film: spannend. Sachbuch: Quellen. Museum: Funde. Spiel: Dinge, die es nie gab."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Warum verändern Filme oft, was früher passiert ist?"
                options: ["Damit die Geschichte spannender wird.", "Weil es früher keine Farben gab.", "Weil Filme nur zehn Minuten lang sein dürfen."]
                answer: "Damit die Geschichte spannender wird."
                hints: ["Ein Film soll die Zuschauer unterhalten."]
