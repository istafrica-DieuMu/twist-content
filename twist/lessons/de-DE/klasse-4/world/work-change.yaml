# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.work-change
skill: world.technology.work-change
curriculum: de-DE
language: de
title:
  de: Wie Maschinen die Arbeit verändern
  en: How machines change work
summary: >
  How machines and computers have changed the way people work, and what
  that means for people and the environment. The story: for a class
  project on work then and now, Emil asks his Opa Hans, who grew up on a
  farm, and his Mama, who works in a bicycle factory and does her
  paperwork at a computer. Lesson 1 goes from hand work to machines: the
  washing day with the washboard and the washing machine, horse and
  plough and the tractor, scythe and flail and the combine harvester; the
  shoemaker who made a whole shoe, the division of labour in a factory,
  the assembly line (first used for cars in America more than 100 years
  ago) and robots that weld and paint while people program and look
  after them; and the effects (less heavy work, cheaper goods, but
  monotonous work, lost jobs and the energy machines need). Lesson 2 is
  about computers at work: e-mail in place of letters, the scanner at the
  till, the milking robot, doctors and architects at the screen; jobs
  that have almost gone (switchboard operator, lamplighter), new ones
  (programmer, wind turbine technician), learning new things at work,
  and the good and hard sides of screen work. It ends with the skill
  check. No brands.
metadata:
  year: klasse-4
  topic: { de: Technik verändert die Welt, en: Technology changes the world }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.technology.jobs, world.technology.inventions]
  also_practises: [world.technology.jobs]
  vocabulary: { de: [Handarbeit, Maschine, Waschbrett, Waschmaschine, Pflug, Traktor, Sense, Mähdrescher, Handwerker, Fabrik, Arbeitsteilung, Fließband, Roboter, Energie, Computer, E-Mail, Scanner, Strichcode, Melkroboter, Beruf, Arbeitsplatz, Telefonistin, Laternenanzünder, Programmiererin] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: then-now, what: { de: "beschreiben, wie eine Arbeit früher mit der Hand und heute mit Maschinen oder Computern gemacht wird", en: "describing how a job was done by hand in the past and is done with machines or computers today" } }
    - { id: organisation, what: { de: "Handarbeit, Arbeitsteilung, Fließband und Roboter unterscheiden", en: "telling hand work, division of labour, the assembly line and robots apart" } }
    - { id: effects, what: { de: "sagen, was Maschinen und Computer für die Menschen, ihre Berufe und die Umwelt bedeuten", en: "saying what machines and computers mean for people, their jobs and the environment" } }
  misconceptions:
    - id: always-machines
      what: Thinks washing machines, tractors and computers have always been there, so work was always as it is now
      addressed: "lesson 1 opens with the guess how long washing took; l1-f1, l1-n2 and l2-c2, l2-c4 ask how it was before"
    - id: robots-alone
      what: Thinks robots in a factory work entirely on their own, without people who program and look after them
      addressed: "lesson 1 Learn says people program and look after robots; l1-s5, l2-c13 and l2-c19 test it"
    - id: only-loss
      what: Thinks machines only take jobs away and that no new jobs come
      addressed: "lesson 2 Learn sets old jobs against new ones; l2-f3, l2-s3 and l2-c16 test it, with the hint on l2-s3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Von der Hand zur Maschine", en: "From hand to machine" }
    goal:
      de: "Finde heraus, wie Maschinen die Arbeit verändert haben. Früher hat man die Wäsche zum Beispiel einen ganzen Tag lang mit der Hand gewaschen."
      en: "Find out how machines have changed work. In the past, for example, people spent a whole day washing clothes by hand."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Wer sät Getreide und erntet es?"
            options: [{ object: farmer }, { object: cook }, { object: teacher }]
            answer: farmer
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Das Auto wurde vor dem Computer erfunden. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Emils Klasse macht ein Projekt: Arbeit früher und heute.\nOpa Hans erzählt: Als seine Oma jung war, gab es keine Waschmaschine.\n\nWie lange dauerte da wohl das Wäschewaschen?"
            say: "Emils Klasse macht ein Projekt über Arbeit früher und heute. Emil fragt seinen Opa Hans. Der erzählt: Als meine Oma jung war, gab es noch keine Waschmaschine. Was glaubst du: Wie lange dauerte damals das Wäschewaschen für eine ganze Familie?"
            show: { object: grandpa }
          - text: "Oft einen ganzen Tag! Man nannte ihn den Waschtag.\nHeute wäscht die Waschmaschine allein."
            say: "Oft einen ganzen Tag! Man nannte ihn den Waschtag. Das Wasser wurde heiß gemacht, und jedes Stück wurde mit der Hand auf einem Waschbrett geschrubbt. Das war schwere Arbeit. Heute wäscht die Waschmaschine die Wäsche allein, und die Menschen haben Zeit für anderes."
          - text: "Auf dem Bauernhof\nfrüher: Pferd und Pflug, Sense und Dreschflegel, viele Helfer\nheute: Traktor und Mähdrescher"
            say: "Auch auf dem Bauernhof von Opa Hans war früher viel Handarbeit. Ein Pferd zog den Pflug über den Acker. Das Getreide mähten viele Helfer mit der Sense, dann schlugen sie die Körner mit dem Dreschflegel heraus. Heute zieht ein Traktor den Pflug. Und ein Mähdrescher mäht das Getreide und drischt es gleich aus. Eine Person fährt ihn und schafft ein großes Feld."
            show: { object: wheat }
          - text: "Früher: Ein Schuhmacher machte einen ganzen Schuh allein.\nIn der Fabrik: Jeder macht einen Teil. Das heißt Arbeitsteilung."
            say: "Früher machte ein Handwerker ein Ding von Anfang bis Ende. Ein Schuhmacher machte einen ganzen Schuh allein. In einer Fabrik ist die Arbeit aufgeteilt. Jeder macht nur einen Teil, immer wieder. Das heißt Arbeitsteilung. So werden viel mehr Dinge in der gleichen Zeit fertig."
            show: { object: shoe }
          - text: "Am Fließband fährt das Ding von Platz zu Platz. An jedem Platz kommt ein Teil dazu."
            say: "Vor mehr als hundert Jahren baute man in Amerika zum ersten Mal Autos am Fließband. Das Auto fährt langsam von Platz zu Platz, und an jedem Platz baut jemand ein Teil an. Die Arbeit kommt zu den Menschen. Autos wurden so schneller fertig und billiger. In der Fabrik von Emils Mama werden heute Fahrräder so gebaut."
            show: { object: car }
          - text: "Roboter in der Fabrik: schwere, gefährliche oder immer gleiche Arbeit, zum Beispiel schweißen und lackieren.\nMenschen programmieren sie und passen auf."
            say: "Heute arbeiten in vielen Fabriken auch Roboter. Sie machen Arbeit, die schwer, gefährlich oder immer gleich ist, zum Beispiel Teile zusammenschweißen oder lackieren. Menschen programmieren die Roboter, passen auf sie auf und reparieren sie."
          - text: "Gut: weniger schwere Arbeit, mehr Waren, billigere Waren\nSchwierig: am Fließband immer der gleiche Handgriff, manche verlieren ihre Arbeit, Maschinen brauchen Energie"
            say: "Was bedeutet das für die Menschen? Gut ist: Die Arbeit ist weniger schwer, es gibt mehr Waren, und sie werden billiger. Schwierig ist: Am Fließband macht man oft den ganzen Tag den gleichen Handgriff. Manche Menschen verlieren ihre Arbeit, weil eine Maschine sie macht. Und alle Maschinen brauchen Energie, zum Beispiel Strom oder Diesel. Das ist nicht gut für die Umwelt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: matching
                text: "Früher mit der Hand, heute mit der Maschine. Verbinde."
                pairs:
                  - { left: { text: "Wäsche auf dem Waschbrett schrubben" }, right: { text: "Waschmaschine" } }
                  - { left: { text: "Getreide mit der Sense mähen" }, right: { text: "Mähdrescher" } }
                  - { left: { text: "mit dem Pferd den Acker pflügen" }, right: { text: "Traktor" } }
                hints:
                  - "Frag dich: Welche Maschine macht heute diese Arbeit?"
                  - "Wäsche gehört zur Waschmaschine. Getreide mäht der Mähdrescher."
                  - "Waschbrett: Waschmaschine. Sense: Mähdrescher. Pferd und Pflug: Traktor."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was macht ein Mähdrescher?"
                options: ["Er mäht das Getreide und drischt die Körner aus.", "Er melkt die Kühe.", "Er backt Brot."]
                answer: "Er mäht das Getreide und drischt die Körner aus."
                feedback:
                  "Er backt Brot.": "Ein Mähdrescher mit Backofen? Lecker, aber nein! Er mäht und drischt das Getreide. Aus den Körnern macht man später Mehl."
                hints:
                  - "Im Wort Mähdrescher stecken zwei Arbeiten."
                  - "Mähen und dreschen. Beides hat mit Getreide zu tun."
                  - "Er mäht das Getreide und drischt die Körner aus."
              - id: l1-f3
                type: ordering
                text: "In der Fabrik von Emils Mama wird ein Fahrrad gebaut. Bring die Schritte am Fließband in die richtige Reihenfolge."
                options: ["Die Räder anbauen.", "Den Rahmen schweißen.", "Das fertige Fahrrad prüfen.", "Den Rahmen lackieren."]
                slot_count: 4
                answer: ["Den Rahmen schweißen.", "Den Rahmen lackieren.", "Die Räder anbauen.", "Das fertige Fahrrad prüfen."]
                option_audio: false
                hints:
                  - "Zuerst braucht man den Rahmen, an den alles andere kommt."
                  - "Erst schweißen, dann lackieren. Geprüft wird ganz am Ende."
                  - "Schweißen, lackieren, Räder anbauen, prüfen."
              - id: l1-f4
                type: true_false
                text: "Bei der Arbeitsteilung macht jeder Mensch das ganze Ding von Anfang bis Ende. Stimmt das?"
                answer: false
                hints:
                  - "Denk an den Schuhmacher und an die Fabrik."
                  - "Der Schuhmacher macht alles allein. In der Fabrik ist die Arbeit aufgeteilt."
                  - "Nein, bei der Arbeitsteilung macht jeder nur einen Teil."
              - id: l1-f5
                type: sorting
                text: "Was bedeuten Maschinen für die Menschen? Sortiere."
                bins:
                  - { id: good, show: { text: "gut" }, say: "gut" }
                  - { id: hard, show: { text: "schwierig" }, say: "schwierig" }
                options:
                  - { text: "weniger schwere Arbeit", bin: good }
                  - { text: "Waren werden billiger", bin: good }
                  - { text: "am Fließband immer den gleichen Handgriff machen", bin: hard }
                  - { text: "manche verlieren ihren Arbeitsplatz", bin: hard }
                hints:
                  - "Gut ist, was den Menschen hilft. Schwierig ist, was ihnen Probleme macht."
                  - "Den ganzen Tag das Gleiche zu tun, ist langweilig. Ohne Arbeit fehlt Geld."
                  - "Weniger schwere Arbeit und billigere Waren sind gut, die anderen beiden schwierig."
              - id: l1-f6
                type: multiple_choice
                text: "Warum schweißen in der Autofabrik oft Roboter?"
                options: ["Weil die Arbeit schwer, gefährlich und immer gleich ist.", "Weil Roboter gern Auto fahren.", "Weil Menschen das nicht lernen können."]
                answer: "Weil die Arbeit schwer, gefährlich und immer gleich ist."
                hints:
                  - "Roboter machen eine bestimmte Art von Arbeit."
                  - "Beim Schweißen gibt es Funken und große Hitze, und es ist immer der gleiche Handgriff."
                  - "Weil die Arbeit schwer, gefährlich und immer gleich ist."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was heißt Arbeitsteilung?"
                options: ["Jeder macht einen Teil der Arbeit.", "Alle machen gleichzeitig Pause.", "Einer macht die ganze Arbeit allein."]
                answer: "Jeder macht einen Teil der Arbeit."
                hints: ["Im Wort steckt teilen: Die Arbeit wird aufgeteilt."]
              - id: l1-s2
                type: true_false
                text: "Die Waschmaschine spart den Menschen viel Zeit. Stimmt das?"
                answer: true
                hints: ["Denk an den Waschtag von früher."]
              - id: l1-s3
                type: fill_in_blank
                text: "Was passt in die Lücken?"
                frame: "In der Fabrik wird die Arbeit _. Am _ fährt das Auto von Platz zu Platz."
                options: ["aufgeteilt", "verschenkt", "Fließband", "Fahrrad"]
                answer: ["aufgeteilt", "Fließband"]
                hints: ["Jeder macht einen Teil, und die Arbeit kommt auf einem Band zu den Menschen."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Opa Hans erzählt vom Pferd, das den Pflug zog. Wer arbeitete damit?"
                options: [{ object: farmer }, { object: doctor }, { object: firefighter }]
                answer: farmer
                hints: ["Der Pflug lockert den Boden auf dem Acker."]
              - id: l1-s5
                type: matching
                text: "Was macht die Maschine? Verbinde."
                pairs:
                  - { left: { text: "Waschmaschine" }, right: { text: "wäscht die Wäsche" } }
                  - { left: { text: "Traktor" }, right: { text: "zieht den Pflug" } }
                  - { left: { text: "Roboter in der Fabrik" }, right: { text: "schweißt Teile, Menschen programmieren ihn" } }
                hints: ["Der Traktor macht heute die Arbeit, die früher das Pferd gemacht hat."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "In der Autofabrik: Bring die Schritte am Fließband in die richtige Reihenfolge."
                options: ["Das fertige Auto prüfen.", "Die Karosserie lackieren.", "Die Karosserie schweißen.", "Die Räder anbauen."]
                slot_count: 4
                answer: ["Die Karosserie schweißen.", "Die Karosserie lackieren.", "Die Räder anbauen.", "Das fertige Auto prüfen."]
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Früher mähten viele Helfer das Getreide mit der Sense. Wie ist es heute?"
                options: ["Eine Person erntet mit dem Mähdrescher ein großes Feld.", "Das Getreide wird gar nicht mehr geerntet.", "Die Kühe fressen das Getreide vom Feld."]
                answer: "Eine Person erntet mit dem Mähdrescher ein großes Feld."
              - id: l1-n3
                type: true_false
                text: "Am Fließband ist die Arbeit für alle sehr abwechslungsreich. Stimmt das?"
                answer: false
              - id: l1-n4
                type: sorting
                text: "Handarbeit oder Maschine? Sortiere."
                bins:
                  - { id: hand, show: { text: "Handarbeit" }, say: "Handarbeit" }
                  - { id: machine, show: { text: "Maschine" }, say: "Maschine" }
                options:
                  - { text: "Wäsche auf dem Waschbrett schrubben", bin: hand }
                  - { text: "Körner mit dem Dreschflegel ausschlagen", bin: hand }
                  - { text: "mit dem Mähdrescher ernten", bin: machine }
                  - { text: "Autoteile vom Roboter schweißen lassen", bin: machine }
              - id: l1-n5
                type: multiple_choice
                text: "Maschinen machen die Arbeit leichter. Was brauchen sie dafür?"
                options: ["Energie, zum Beispiel Strom oder Diesel", "Futter und Wasser", "gar nichts"]
                answer: "Energie, zum Beispiel Strom oder Diesel"
                feedback:
                  "Futter und Wasser": "Futter braucht das Pferd! Ein Traktor braucht Diesel, eine Waschmaschine Strom."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Maschine zieht heute auf dem Acker den Pflug?"
            options: ["der Traktor", "die Waschmaschine", "der Roboter aus der Autofabrik"]
            answer: "der Traktor"
          - id: l1-c2
            type: true_false
            text: "Ein Schuhmacher machte früher einen ganzen Schuh allein. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was ist ein Fließband?"
            options: ["Ein Band, auf dem das Ding von Platz zu Platz fährt.", "Ein Band, das man ins Haar bindet.", "Ein Fluss neben der Fabrik."]
            answer: "Ein Band, auf dem das Ding von Platz zu Platz fährt."
          - id: l1-c4
            type: sorting
            text: "Früher oder heute? Sortiere."
            bins:
              - { id: then, show: { text: "früher" }, say: "früher" }
              - { id: now, show: { text: "heute" }, say: "heute" }
            options:
              - { text: "der Waschtag mit dem Waschbrett", bin: then }
              - { text: "das Pferd vor dem Pflug", bin: then }
              - { text: "der Mähdrescher auf dem Feld", bin: now }
          - id: l1-c5
            type: multiple_choice
            text: "Was ist schwierig an der Arbeit am Fließband?"
            options: ["Man macht oft den ganzen Tag den gleichen Handgriff.", "Man muss sehr weit laufen.", "Man darf nie sprechen."]
            answer: "Man macht oft den ganzen Tag den gleichen Handgriff."
          - id: l1-c6
            type: true_false
            text: "Roboter in der Fabrik machen oft schwere oder gefährliche Arbeit. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Computer bei der Arbeit", en: "Computers at work" }
    goal:
      de: "Finde heraus, wie Computer die Arbeit verändern und welche Berufe neu dazukommen. Eine E-Mail kommt zum Beispiel in wenigen Sekunden an."
      en: "Find out how computers change work and which new jobs appear. An e-mail, for example, arrives in a few seconds."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was heißt Arbeitsteilung in der Fabrik?"
            options: ["Jeder macht nur einen Teil der Arbeit.", "Einer baut das ganze Fahrrad allein.", "Die Maschinen machen Pause."]
            answer: "Jeder macht nur einen Teil der Arbeit."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Früher wurde die Wäsche mit der Hand auf dem Waschbrett geschrubbt. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Emils Mama arbeitet auch im Büro der Fabrik.\n\nWie hat man früher eine Nachricht in eine andere Stadt geschickt?"
            say: "Emils Mama arbeitet einen Teil der Zeit im Büro der Fahrradfabrik. Sie schreibt viele Nachrichten an Firmen in anderen Städten. Was glaubst du: Wie hat man früher im Büro eine Nachricht in eine andere Stadt geschickt, und wie lange hat das gedauert?"
          - text: "Früher: ein Brief mit der Post, meistens einen Tag oder länger.\nHeute: eine E-Mail, in wenigen Sekunden."
            say: "Früher schrieb man einen Brief und schickte ihn mit der Post. Er kam meistens erst am nächsten Tag an oder noch später. Heute schreibt Emils Mama eine E-Mail am Computer. Die ist in wenigen Sekunden da, und man braucht kein Papier."
          - text: "Computer helfen bei vielen Berufen:\nKasse: Der Scanner liest den Strichcode.\nStall: Ein Melkroboter melkt die Kühe.\nÄrztin: Röntgenbilder am Bildschirm\nArchitekt: Häuser am Computer zeichnen"
            say: "Computer helfen in vielen Berufen. An der Kasse tippte man früher jeden Preis mit der Hand ein. Heute liest ein Scanner den Strichcode, und der Computer findet den Preis. In manchen Ställen melkt ein Melkroboter die Kühe. Die Kuh geht selbst hinein, wenn sie gemolken werden möchte. Eine Ärztin schaut sich Röntgenbilder am Bildschirm an. Und ein Architekt zeichnet Häuser am Computer."
            show: { object: supermarket }
          - text: "Berufe, die es kaum noch gibt: Telefonistin, Laternenanzünder\nNeue Berufe: Programmiererin, Technikerin für Windräder"
            say: "Manche Berufe gibt es heute kaum noch. Früher zündete der Laternenanzünder jeden Abend die Gaslaternen in der Straße an. Heute gehen die Straßenlampen von selbst an. Früher verband eine Telefonistin jedes Telefongespräch mit der Hand. Heute macht das ein Computer. Dafür sind neue Berufe entstanden, zum Beispiel die Programmiererin, die Programme schreibt, oder die Technikerin, die Windräder repariert."
          - text: "Wenn sich Maschinen und Computer ändern, lernen die Menschen bei der Arbeit Neues dazu."
            say: "Emils Mama hat gerade gelernt, mit einem neuen Programm zu arbeiten. Wenn sich Maschinen und Computer ändern, lernen die Menschen bei der Arbeit immer wieder Neues dazu, auch als Erwachsene."
          - text: "Gut: schneller, weniger Papier, manchmal von zu Hause arbeiten\nSchwierig: lange am Bildschirm sitzen, immer erreichbar sein, Computer brauchen Strom"
            say: "Was bedeutet das für die Menschen? Gut ist: Vieles geht schneller, man braucht weniger Papier, und manche können von zu Hause aus arbeiten und sparen den Weg. Schwierig ist: Viele sitzen lange vor dem Bildschirm. Manche sind immer erreichbar, auch am Abend. Und Computer brauchen Strom."
          - text: "Wusstest du? Früher steckten Frauen in der Telefonzentrale jedes Gespräch mit der Hand um. Man nannte sie das Fräulein vom Amt."
            say: "Wusstest du? Früher konnte man nicht einfach eine Nummer wählen. Man sagte einer Frau in der Telefonzentrale, mit wem man sprechen wollte. Sie verband das Gespräch mit der Hand, indem sie ein Kabel in die richtige Buchse steckte. Man nannte sie das Fräulein vom Amt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Früher und heute: Verbinde."
                pairs:
                  - { left: { text: "einen Brief mit der Post schicken" }, right: { text: "eine E-Mail schreiben" } }
                  - { left: { text: "jeden Preis an der Kasse eintippen" }, right: { text: "den Strichcode scannen" } }
                  - { left: { text: "die Kühe mit der Hand melken" }, right: { text: "der Melkroboter melkt" } }
                hints:
                  - "Frag dich: Wie wird diese Arbeit heute mit einem Computer gemacht?"
                  - "Die E-Mail ersetzt den Brief. Der Scanner liest den Preis."
                  - "Brief: E-Mail. Kasse: scannen. Melken: Melkroboter."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Emils Mama schickt eine E-Mail nach Hamburg. Wann ist sie da?"
                options: ["nach wenigen Sekunden", "nach einer Woche", "nach einem Jahr"]
                answer: "nach wenigen Sekunden"
                keep_order: true
                hints:
                  - "Eine E-Mail geht nicht mit der Post."
                  - "Sie fliegt sozusagen durch das Internet von Computer zu Computer."
                  - "Nach wenigen Sekunden."
              - id: l2-f3
                type: sorting
                text: "Neuer Beruf oder ein Beruf, den es kaum noch gibt? Sortiere."
                bins:
                  - { id: new, show: { text: "neuer Beruf" }, say: "neuer Beruf" }
                  - { id: old, show: { text: "gibt es kaum noch" }, say: "gibt es kaum noch" }
                options:
                  - { text: "Programmiererin", bin: new }
                  - { text: "Technikerin für Windräder", bin: new }
                  - { text: "Laternenanzünder", bin: old }
                  - { text: "Telefonistin, die Gespräche mit der Hand verbindet", bin: old }
                hints:
                  - "Neue Berufe haben mit Computern oder neuer Technik zu tun."
                  - "Die Straßenlampen gehen heute von selbst an, und Telefongespräche verbindet ein Computer."
                  - "Programmiererin und Windrad-Technikerin sind neu, die anderen beiden gibt es kaum noch."
              - id: l2-f4
                type: true_false
                text: "Wenn sich die Technik ändert, lernen Menschen bei der Arbeit Neues dazu. Stimmt das?"
                answer: true
                hints:
                  - "Denk an Emils Mama und ihr neues Programm."
                  - "Auch Erwachsene lernen bei der Arbeit dazu."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: ordering
