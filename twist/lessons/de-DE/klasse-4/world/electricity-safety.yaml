# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.electricity-safety
skill: world.nature.electricity-safety
curriculum: de-DE
language: de
title:
  de: Vorsicht, Strom!
  en: Careful, electricity!
summary: >
  Emil and his sister Jule are electricity detectives. Lesson 1 searches
  the flat. It opens with Emil's question whether his battery bulb also
  works from the socket: no, a flat battery has 4,5 volts, the socket 230,
  and its current is dangerous to life. The rules as German schools teach
  them: nothing but a plug goes into a socket (child safety covers protect
  small children); never touch plugs or devices with wet hands; no
  electrical devices next to the bath or the sink; pull the plug by its
  grip, not the cable; broken cables, hot or smelly devices are not
  touched, an adult is told. If someone gets a shock: do not touch them,
  get an adult, call 112. Lesson 2 goes outside on the way to fly a kite:
  kites only far from power lines (if it gets caught, let go of the
  string and tell an adult); never climb pylons, substations or railway
  wagons; the railway's overhead line carries 15 000 volts and the
  current can jump across even without touching; the yellow triangle
  with the black lightning arrow means danger to life; stay far away from
  a cable lying on the ground and get help. A bird on a wire is no proof
  that the wire is safe. It ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Feuer und Strom, en: Fire and electricity }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.nature.electric-circuit, world.nature.conductors]
  also_practises: [world.nature.conductors]
  vocabulary: { de: [Steckdose, Stecker, Kabel, Elektrogerät, Stromschlag, lebensgefährlich, Volt, Kindersicherung, Stromleitung, Strommast, Umspannwerk, Oberleitung, Hochspannung, Warnschild, Notruf] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: home, what: { de: "die Regeln für Steckdose, Stecker, Kabel und Wasser im Haus kennen und begründen", en: "knowing and explaining the rules for sockets, plugs, cables and water at home" } }
    - { id: outside, what: { de: "Gefahren an Stromleitungen, Umspannwerken und der Bahn erkennen", en: "recognising dangers at power lines, substations and the railway" } }
    - { id: help, what: { de: "wissen, was man bei einem Stromunfall oder einem kaputten Kabel tut", en: "knowing what to do after an electric accident or with a broken cable" } }
  misconceptions:
    - id: socket-like-battery
      what: Thinks the current from the socket is as weak and harmless as the current from a battery
      addressed: "lesson 1 opens with Emil's socket question; l1-f2, l1-s1, l1-n5 and l2-w2, l2-c4"
    - id: pull-the-person
      what: Wants to pull a person who is getting a shock away by the hand
      addressed: "the lesson 1 screen on electric accidents; l1-f6, l1-s5 and l2-c15, l2-c18"
    - id: only-touch-is-dangerous
      what: Thinks a power line is dangerous only when touched, so coming close is fine
      addressed: "the lesson 2 screen on the overhead line; l2-f5, l2-n3 and l2-c11"
    - id: bird-proves-safe
      what: Takes a bird sitting on a wire as proof that the wire is harmless
      addressed: "the lesson 2 fact screen; l2-s1, l2-n1 and l2-c13"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Strom-Detektive zu Hause", en: "Electricity detectives at home" }
    goal:
      de: "Werde Strom-Detektiv und finde die Gefahren in der Wohnung. Du lernst die Regeln für Steckdose, Stecker und Wasser."
      en: "Be an electricity detective and find the dangers in the flat. You learn the rules for sockets, plugs and water."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Dein Körper leitet den Strom aus der Steckdose. Stimmt das?"
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was am Kabel schützt dich vor dem Strom?"
            options: ["die Hülle aus Kunststoff", "der Draht aus Kupfer", "die Farbe"]
            answer: "die Hülle aus Kunststoff"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Emil hat mit einer Batterie ein Lämpchen zum Leuchten gebracht. Er fragt: „Geht das auch mit der Steckdose?“\n\nWas glaubst du?"
            say: "Emil hat mit einer Flachbatterie ein Lämpchen zum Leuchten gebracht. Jetzt fragt er seine große Schwester Jule: Geht das auch mit der Steckdose? Was glaubst du?"
            show: { object: light-bulb }
          - text: "Nein! Eine Flachbatterie hat 4,5 Volt. Die Steckdose hat 230 Volt. Ihr Strom ist lebensgefährlich."
            say: "Auf keinen Fall! Eine Flachbatterie hat vier Komma fünf Volt. Die Steckdose hat zweihundertdreißig Volt, also mehr als fünfzigmal so viel. Ihr Strom kann durch deinen Körper fließen und ist lebensgefährlich. Versuche gibt es nur mit Batterien."
          - text: "In die Steckdose gehört nur ein Stecker. Kleine Kinder schützt eine Kindersicherung."
            say: "Jule und Emil werden Strom-Detektive und suchen Gefahren in der Wohnung. Regel eins: In die Steckdose kommt nur ein Stecker, nie eine Haarklammer, eine Nadel oder ein Stift. Für kleine Geschwister gibt es eine Kindersicherung. Sie macht die Löcher der Steckdose zu."
          - text: "Strom und Wasser vertragen sich nicht."
            say: "Regel zwei: Fass Stecker, Schalter und Elektrogeräte nur mit trockenen Händen an. Elektrogeräte wie ein Föhn, ein Radio oder ein Handy, das gerade lädt, haben neben der Badewanne und am Waschbecken nichts zu suchen. Fällt so ein Gerät ins Wasser, leitet das Wasser den Strom zu dir."
            show: { object: bath }
          - text: "Stecker am Griff herausziehen, nicht am Kabel. Kaputte Kabel nie anfassen."
            say: "Regel drei: Zieh einen Stecker immer am Griff heraus, nie am Kabel. Sonst kann das Kabel reißen. Ist ein Kabel kaputt, wird ein Gerät heiß, raucht oder riecht es verbrannt, fasst du es nicht an. Sag sofort einem Erwachsenen Bescheid."
          - text: "Bekommt jemand einen Stromschlag: nicht anfassen! Erwachsene holen, 112 anrufen."
            say: "Regel vier: Hält jemand ein Gerät oder ein Kabel und bekommt einen Stromschlag, fass ihn nicht an. Der Strom kann sonst auch durch dich fließen. Hol sofort einen Erwachsenen, der den Strom ausschaltet, und ruf den Notruf an, eins, eins, zwei."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Sicher oder gefährlich? Sortiere."
                bins:
                  - { id: safe, show: { text: "sicher" }, say: "sicher" }
                  - { id: danger, show: { text: "gefährlich" }, say: "gefährlich" }
                options:
                  - { text: "Emil zieht den Stecker am Griff heraus.", bin: safe }
                  - { text: "Emil trocknet sich die Hände ab, bevor er die Lampe einsteckt.", bin: safe }
                  - { text: "Jule steckt eine Haarklammer in die Steckdose.", bin: danger }
                  - { text: "Das Radio steht auf dem Rand der vollen Badewanne.", bin: danger }
                hints:
                  - "Denk an die Steckdose und an das Wasser."
                  - "In die Steckdose gehört nur ein Stecker. Wasser leitet den Strom zu dir."
                  - "Sicher: Stecker am Griff, trockene Hände. Gefährlich: Haarklammer, Radio an der Badewanne."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Warum darf Emil mit der Batterie basteln, aber nie mit der Steckdose?"
                options: ["Der Strom aus der Steckdose ist viel stärker.", "In der Steckdose ist Wasser.", "Die Batterie ist aus Gold."]
                answer: "Der Strom aus der Steckdose ist viel stärker."
                hints:
                  - "Vergleich die Zahlen auf der Batterie und an der Steckdose."
                  - "4,5 Volt gegen 230 Volt."
                  - "Der Strom aus der Steckdose ist viel stärker."
              - id: l1-f3
                type: true_false
                text: "Emil zieht den Stecker am Kabel aus der Steckdose. Ist das richtig?"
                answer: false
                hints:
                  - "Am Kabel zu ziehen kann das Kabel beschädigen."
                  - "Wo fasst man den Stecker an?"
                  - "Nein, man zieht am Griff des Steckers."
              - id: l1-f4
                type: image_multiple_choice
                text: "Wo ist ein Föhn besonders gefährlich?"
                options: [{ object: bath }, { object: bed }, { object: table }]
                answer: bath
                hints:
                  - "Strom und Wasser vertragen sich nicht."
                  - "Wo ist viel Wasser?"
                  - "An der Badewanne."
              - id: l1-f5
                type: multiple_choice
                text: "Jule findet ein Kabel, aus dem die Drähte herausschauen. Was macht sie?"
                options: ["nicht anfassen und Mama oder Papa Bescheid sagen", "die Drähte zusammendrehen", "das Kabel schnell einstecken"]
                answer: "nicht anfassen und Mama oder Papa Bescheid sagen"
                hints:
                  - "Die Hülle schützt vor dem Strom. Hier ist sie kaputt."
                  - "Kaputte Kabel fasst du nie an."
                  - "Nicht anfassen, einem Erwachsenen Bescheid sagen."
              - id: l1-f6
                type: true_false
                text: "Onkel Kai hält ein kaputtes Kabel und bekommt einen Stromschlag. Emil zieht ihn sofort an der Hand weg.\n\nIst das richtig?"
                answer: false
                hints:
                  - "Der Strom kann durch den Menschen weiterfließen."
                  - "Fasst Emil Onkel Kai an, fließt der Strom auch durch Emil."
                  - "Nein. Nicht anfassen, Erwachsene holen und 112 anrufen."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welche Zahlen passen?"
                frame: "Eine Flachbatterie hat _ Volt. Die Steckdose hat _ Volt."
                options: ["4,5", "230", "1"]
                answer: ["4,5", "230"]
                hints: ["Die Steckdose hat viel mehr Volt als die Batterie."]
              - id: l1-s2
                type: sorting
                text: "Erlaubt oder nicht erlaubt? Sortiere."
                bins:
                  - { id: ok, show: { text: "erlaubt" }, say: "erlaubt" }
                  - { id: no, show: { text: "nicht erlaubt" }, say: "nicht erlaubt" }
                options:
                  - { text: "mit einer Batterie ein Lämpchen leuchten lassen", bin: ok }
                  - { text: "einen Erwachsenen rufen, weil ein Gerät qualmt", bin: ok }
                  - { text: "eine Gabel in den Toaster stecken", bin: no }
                  - { text: "mit nassen Händen das Ladekabel einstecken", bin: no }
                hints: ["Gefährlich ist alles, wobei der Strom aus der Steckdose zu dir kommen kann."]
              - id: l1-s3
                type: true_false
                text: "Emil zieht den Stecker mit trockenen Händen am Griff heraus. Ist das richtig?"
                answer: true
                hints: ["Trockene Hände, am Griff: So ist es richtig."]
              - id: l1-s4
                type: multiple_choice
                text: "Warum stellt man kein Radio auf den Rand der Badewanne?"
                options: ["Fällt es ins Wasser, leitet das Wasser den Strom zu dir.", "Das Radio ist dort zu laut.", "Im Bad darf man keine Musik hören."]
                answer: "Fällt es ins Wasser, leitet das Wasser den Strom zu dir."
                hints: ["Wasser leitet den Strom aus der Steckdose."]
              - id: l1-s5
                type: multiple_choice
                text: "Jemand hat einen Stromschlag und hält noch das Kabel. Was machst du?"
                options: ["Nicht anfassen, Erwachsene holen und 112 anrufen.", "Die Person sofort festhalten.", "Weglaufen und niemandem etwas sagen."]
                answer: "Nicht anfassen, Erwachsene holen und 112 anrufen."
                hints: ["Der Strom kann sonst auch durch dich fließen."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Eine Kindersicherung in der Steckdose schützt kleine Kinder. Stimmt das?"
                answer: true
              - id: l1-n2
                type: multiple_choice
                text: "Emils Ladekabel ist heiß und riecht komisch. Was macht er?"
                options: ["Er sagt sofort einem Erwachsenen Bescheid.", "Er wickelt es in eine Decke.", "Er gießt Wasser darüber."]
                answer: "Er sagt sofort einem Erwachsenen Bescheid."
                feedback:
                  "Er gießt Wasser darüber.": "Wasser auf ein Kabel, das noch Strom hat? Das ist gefährlich, denn Wasser leitet den Strom. Emil sagt einem Erwachsenen Bescheid."
              - id: l1-n3
                type: sorting
                text: "Sicher oder gefährlich? Sortiere."
                bins:
                  - { id: safe, show: { text: "sicher" }, say: "sicher" }
                  - { id: danger, show: { text: "gefährlich" }, say: "gefährlich" }
                options:
                  - { text: "Jule liest in ihrer Höhle mit einer Batterielampe.", bin: safe }
                  - { text: "Mama ruft den Elektriker für die kaputte Lampe.", bin: safe }
                  - { text: "Emil bohrt mit einem Stift in der Steckdose.", bin: danger }
                  - { text: "Das Handy lädt auf dem Rand des Waschbeckens.", bin: danger }
              - id: l1-n4
                type: multiple_choice
                text: "Warum steckst du nie etwas in die Steckdose?"
                options: ["Der Strom kann durch das Ding in deinen Körper fließen.", "Dann geht im Haus das Licht aus.", "Die Steckdose wird sonst schmutzig."]
                answer: "Der Strom kann durch das Ding in deinen Körper fließen."
              - id: l1-n5
                type: multiple_choice
                text: "Emil will eine Lampe für seine Höhle bauen. Woher nimmt er den Strom?"
                options: ["aus einer Batterie", "aus der Steckdose", "aus der Stromleitung vor dem Haus"]
                answer: "aus einer Batterie"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Wer vorsichtig ist, darf eine Stricknadel in die Steckdose stecken. Stimmt das?"
            answer: false
          - id: l1-c2
            type: multiple_choice
            text: "Wie ziehst du einen Stecker richtig heraus?"
            options: ["mit trockenen Händen am Griff", "am Kabel", "mit nassen Händen"]
            answer: "mit trockenen Händen am Griff"
          - id: l1-c3
            type: multiple_choice
            text: "Wo ist ein Elektrogerät besonders gefährlich?"
            options: ["neben der Badewanne", "auf dem Schreibtisch", "im Regal"]
            answer: "neben der Badewanne"
          - id: l1-c4
            type: true_false
            text: "Hat jemand einen Stromschlag, fasst du ihn nicht an. Stimmt das?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Welche Nummer rufst du nach einem Stromunfall an?"
            options: ["112", "110", "115"]
            answer: "112"
          - id: l1-c6
            type: multiple_choice
            text: "Ein Kabel ist kaputt. Was machst du?"
            options: ["nicht anfassen und Bescheid sagen", "es selbst reparieren", "es weiter benutzen"]
            answer: "nicht anfassen und Bescheid sagen"

  - n: 2
    title: { de: "Strom-Detektive draußen", en: "Electricity detectives outside" }
    goal:
      de: "Finde draußen die Gefahren durch Strom: an Stromleitungen, an der Bahn und überall, wo ein Warnschild hängt. Du lernst, wie weit du wegbleibst."
      en: "Find the dangers from electricity outside: at power lines, at the railway and at small buildings with a warning sign. You learn to keep well away."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Elektrogeräte haben neben der Badewanne nichts zu suchen. Stimmt das?"
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist viel stärker?"
            options: ["der Strom aus der Steckdose", "der Strom aus einer Flachbatterie", "beide sind gleich stark"]
            answer: "der Strom aus der Steckdose"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Emil und Jule wollen ihren Drachen steigen lassen. Am Feld steht ein großer Strommast.\n\nWas glaubst du: Ist das ein guter Platz?"
            say: "Es ist windig. Emil und Jule wollen ihren neuen Drachen steigen lassen. Am Rand des Feldes steht ein großer Strommast, und dicke Leitungen hängen darüber. Was glaubst du: Ist das ein guter Platz?"
            show: { object: kite }
          - text: "Nein! Drachen nur weit weg von Stromleitungen steigen lassen."
            say: "Kein guter Platz! In diesen Leitungen ist sehr viel Strom. Einen Drachen lässt du nur dort steigen, wo weit und breit keine Stromleitung ist. Verfängt er sich doch in einer Leitung, lass die Schnur los, zieh nicht daran und klettere nie hinterher. Sag einem Erwachsenen Bescheid."
          - text: "Nie auf Strommasten klettern. Nie in ein Umspannwerk."
            say: "Auf dem Weg zum Feld kommen die beiden an einem hohen Zaun vorbei. Dahinter stehen große Gestelle aus Metall mit dicken Leitungen. Das ist ein Umspannwerk. Am Zaun hängt ein gelbes Dreieck mit einem schwarzen Blitz. Dieses Schild heißt: Vorsicht, Hochspannung, Lebensgefahr! Auf Strommasten und über solche Zäune klettert man nie, auch nicht, um einen Ball zu holen."
          - text: "Die Oberleitung der Bahn hat 15 000 Volt. Der Strom kann überspringen, auch ohne dass du sie berührst."
            say: "Dann kommen sie an den Bahngleisen vorbei. Über den Gleisen hängt die Oberleitung. Sie hat fünfzehntausend Volt. Der Strom kann sogar überspringen, wenn du nur nah herankommst, ohne etwas zu berühren. Darum klettert man nie auf Waggons oder Signalmasten. Gleise sind kein Spielplatz."
            show: { object: train }
          - text: "Wusstest du? Ein Vogel kann auf einer Stromleitung sitzen, weil er nur ein Kabel berührt."
            say: "Wusstest du? Ein Vogel kann auf einer Stromleitung sitzen, weil er nur ein einziges Kabel berührt. Dann fließt der Strom nicht durch ihn hindurch. Berührt ein großer Vogel mit den Flügeln zwei Leitungen oder den Mast, ist das für ihn lebensgefährlich. Für Menschen sind Stromleitungen immer lebensgefährlich."
            show: { object: bird }
          - text: "Liegt ein Kabel auf dem Boden: weit weg bleiben und Hilfe holen, 112."
            say: "Nach einem Sturm kann eine Leitung herunterhängen oder auf dem Boden liegen. Bleib weit weg, fass nichts an und stochere auch nicht mit einem Stock daran herum. Hol einen Erwachsenen oder ruf den Notruf an, eins, eins, zwei."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wo lassen Emil und Jule den Drachen steigen?"
                options: ["auf einer Wiese ohne Stromleitungen", "direkt neben dem Strommast", "über den Bahngleisen"]
                answer: "auf einer Wiese ohne Stromleitungen"
                hints:
                  - "Der Drachen darf sich nicht in einer Leitung verfangen."
                  - "Wo ist weit und breit keine Leitung?"
                  - "Auf einer Wiese ohne Stromleitungen."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Der Drachen hängt in der Stromleitung. Emil zieht kräftig an der Schnur.\n\nIst das richtig?"
                answer: false
                hints:
                  - "Die Leitung ist voller Strom."
                  - "Was macht man mit der Schnur, wenn der Drachen in der Leitung hängt?"
                  - "Nein. Schnur loslassen und einem Erwachsenen Bescheid sagen."
              - id: l2-f3
                type: multiple_choice
                text: "Was bedeutet ein gelbes Dreieck mit einem schwarzen Blitz?"
                options: ["Vorsicht, Hochspannung, Lebensgefahr!", "Hier gibt es oft Gewitter.", "Hier kann man Handys laden."]
                answer: "Vorsicht, Hochspannung, Lebensgefahr!"
                hints:
                  - "Gelbe Dreiecke warnen vor einer Gefahr."
                  - "Der Blitz steht hier für Strom."
                  - "Vorsicht, Hochspannung, Lebensgefahr!"
              - id: l2-f4
                type: sorting
                text: "Sicher oder gefährlich? Sortiere."
                bins:
                  - { id: safe, show: { text: "sicher" }, say: "sicher" }
                  - { id: danger, show: { text: "gefährlich" }, say: "gefährlich" }
                options:
                  - { text: "den Drachen auf einem Feld ohne Leitungen steigen lassen", bin: safe }
                  - { text: "den Ball liegen lassen und einem Erwachsenen Bescheid sagen", bin: safe }
                  - { text: "auf einen Strommast klettern", bin: danger }
                  - { text: "über den Zaun ins Umspannwerk klettern", bin: danger }
                hints:
                  - "Wo Hochspannung ist, bleibst du weg."
                  - "Strommast und Umspannwerk sind Orte für Fachleute, nie für Kinder."
                  - "Sicher: Feld ohne Leitungen, Bescheid sagen. Gefährlich: Strommast, Umspannwerk."
              - id: l2-f5
                type: multiple_choice
                text: "Warum hältst du Abstand zur Oberleitung der Bahn, auch wenn du sie nicht anfasst?"
                options: ["Der Strom kann schon überspringen, wenn du nah herankommst.", "Die Oberleitung ist frisch gestrichen.", "Die Vögel dort beißen."]
                answer: "Der Strom kann schon überspringen, wenn du nah herankommst."
                hints:
                  - "Die Oberleitung hat sehr viel Volt."
                  - "Bei so viel Strom ist Anfassen gar nicht nötig."
                  - "Der Strom kann überspringen."
              - id: l2-f6
                type: fill_in_blank
                text: "Welche Zahlen passen?"
                frame: "Die Oberleitung der Bahn hat _ Volt. Die Steckdose hat _ Volt."
                options: ["15 000", "230", "4,5"]
                answer: ["15 000", "230"]
                option_audio: false
                hints:
                  - "Die Oberleitung hat viel mehr Volt als die Steckdose."
                  - "Die kleinste Zahl gehört zur Flachbatterie."
                  - "15 000 und 230."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Auf der Stromleitung sitzt ein Vogel. Also ist die Leitung auch für Menschen ungefährlich. Stimmt das?"
                answer: false
                hints: ["Der Vogel berührt nur ein Kabel. Für Menschen ist eine Stromleitung immer lebensgefährlich."]
              - id: l2-s2
                type: multiple_choice
                text: "Nach einem Sturm liegt ein Stromkabel auf dem Weg. Was machen Emil und Jule?"
                options: ["weit weg bleiben und Hilfe holen", "das Kabel zur Seite schieben", "mit einem Stock daran tippen"]
                answer: "weit weg bleiben und Hilfe holen"
                hints: ["Auch ein Kabel auf dem Boden kann Strom haben."]
              - id: l2-s3
                type: matching
                text: "Was ist die Regel? Verbinde."
                pairs:
                  - { left: { text: "Drachen steigen lassen" }, right: { text: "nur weit weg von Stromleitungen" } }
                  - { left: { text: "gelbes Schild mit Blitz" }, right: { text: "Vorsicht, Hochspannung" } }
                  - { left: { text: "Kabel auf dem Boden" }, right: { text: "weit weg bleiben, Hilfe holen" } }
                hints: ["Bei jedem geht es darum, dem Strom nicht zu nahe zu kommen."]
              - id: l2-s4
                type: multiple_choice
                text: "Der Ball ist über den Zaun eines Umspannwerks geflogen. Was macht Jule?"
                options: ["Sie klettert nicht hinüber und sagt einem Erwachsenen Bescheid.", "Sie klettert schnell hinüber.", "Sie angelt ihn mit einer langen Metallstange."]
                answer: "Sie klettert nicht hinüber und sagt einem Erwachsenen Bescheid."
