# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.internet-safety
skill: world.society.internet-safety
curriculum: de-DE
language: de
title:
  de: Sicher im Internet
  en: Safe on the internet
summary: >
  Noah gets a tablet for his school's learning app and his first account;
  his cousin Ella helps him set it up. Lesson 1 is passwords and personal
  data: a strong password is long, mixes capital and small letters,
  numbers and signs, and is no name or birthday; the Merksatz trick (the
  first letter of each word of a sentence, the number and the sign kept)
  makes one that is easy to remember; a password is shared only with the
  parents and changed with them if someone else knows it; personal data
  (full name, address, phone number, birthday, school, photos) stay
  private online, a nickname that says nothing about the child is safer,
  and the parents are asked first. Lesson 2 is strangers online: nobody
  can see who really writes in a chat, so someone known only from the
  internet is a stranger however friendly; tell them nothing about
  yourself, send no photos, never meet them, keep no secrets with them;
  if something is mean, strange or frightening, stop, close it and tell a
  trusted adult, who helps to report and block; the child never gets into
  trouble for telling. It ends with the skill check. No real apps,
  brands or platforms.
metadata:
  year: klasse-4
  topic: { de: Sicher mit Medien, en: Safe with media }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.society.media-types]
  also_practises: []
  vocabulary: { de: [Internet, Passwort, Merksatz, Benutzername, Spitzname, persönliche Daten, Adresse, Konto, Chat, Fremde, melden, blockieren, Geheimnis, Vertrauensperson] }
  forms: [text, audio, picture, drawn]
  drawn: [word-card]
  facets: []
  parts:
    - { id: password, what: { de: "ein starkes Passwort erkennen und bauen und es geheim halten", en: "recognising and building a strong password and keeping it secret" } }
    - { id: data, what: { de: "persönliche Daten erkennen und im Internet schützen", en: "recognising personal data and protecting it online" } }
    - { id: contact, what: { de: "mit Fremden im Internet vorsichtig sein und bei Problemen einem Erwachsenen Bescheid sagen", en: "being careful with strangers online and telling an adult when something goes wrong" } }
  misconceptions:
    - id: easy-password
      what: Thinks a good password is one that is easy to remember, such as one's own name, a pet's name or a birthday
      addressed: "lesson 1 Learn opens with noah123 against a Merksatz password and says why the first is guessed quickly; l1-f1, l1-s2, l1-n4, l1-c4 and l2-c4 test it"
    - id: nice-means-child
      what: Believes that someone who writes kindly in a chat and says they are a child really is a child
      addressed: "lesson 2 Learn opens with Sternchen11 and says nobody can see who writes; l2-f1, l2-n3 and l2-c14, l2-c20 test it"
    - id: telling-means-trouble
      what: Keeps something bad that happened online to themselves for fear of getting into trouble or losing the device
      addressed: "lesson 2 Learn says the child never gets into trouble for telling; l2-f6, l2-n2 and l2-c15, l2-c18 test it, with feedback on l2-f6"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Mein Passwort, meine Daten", en: "My password, my data" }
    goal:
      de: "Bau dir ein starkes Passwort mit einem Merksatz. Du lernst auch, welche Daten du im Internet für dich behältst, zum Beispiel deine Adresse."
      en: "Build a strong password with a memory sentence. You also learn which data you keep to yourself online, such as your address."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Noah will wissen, wie das Wetter morgen wird. Welches Medium hilft ihm?"
            options: ["der Wetterbericht im Radio", "ein Märchenbuch", "ein Brief von Oma"]
            answer: "der Wetterbericht im Radio"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Mit einem Tablet kann man lernen, spielen und Nachrichten schreiben. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Noah braucht ein Passwort für die Lern-App seiner Schule.\n\nWelches ist besser: „noah123“ oder „MHBfg3W!“?"
            say: "Noah bekommt ein Tablet für die Lern-App seiner Schule. Dafür braucht er ein Passwort. Was glaubst du: Welches Passwort ist besser? Noah eins zwei drei, oder das Durcheinander aus Buchstaben, Zahlen und einem Ausrufezeichen?"
          - text: "„noah123“ errät man schnell.\n\nEin starkes Passwort ist lang. Es hat große und kleine Buchstaben, Zahlen und Zeichen. Es ist kein Name und kein Geburtstag."
            say: "Das Durcheinander ist viel stärker! Wer Noah kennt, errät seinen Namen sofort, und eins zwei drei probiert jeder als Erstes. Ein starkes Passwort ist lang. Es hat große und kleine Buchstaben, Zahlen und Zeichen. Und es ist kein Name und kein Geburtstag."
          - text: "Der Trick mit dem Merksatz:\nMein Hund Bello frisst gern 3 Würste!\nwird zu MHBfg3W!"
            say: "Noahs Cousine Ella kennt einen Trick. Denk dir einen Satz aus, den du dir gut merken kannst. Nimm von jedem Wort den ersten Buchstaben. Groß bleibt groß, klein bleibt klein, und die Zahl und das Zeichen behältst du. Aus Mein Hund Bello frisst gern drei Würste wird so ein starkes Passwort. Denk dir aber deinen eigenen Satz aus!"
            show: { drawn: word-card, text: "MHBfg3W!" }
          - text: "Dein Passwort ist geheim. Nur deine Eltern dürfen es kennen."
            say: "Ein Passwort ist wie ein Haustürschlüssel. Den gibst du auch nicht jedem. Verrate dein Passwort niemandem außer deinen Eltern, auch nicht deiner besten Freundin oder deinem besten Freund. Wenn es doch jemand erfährt, änderst du es zusammen mit deinen Eltern."
            show: { object: house }
          - text: "Persönliche Daten: dein ganzer Name, deine Adresse, deine Telefonnummer, dein Geburtstag, deine Schule, Fotos von dir."
            say: "Persönliche Daten verraten, wer du bist und wo man dich findet. Das sind dein ganzer Name, deine Adresse, deine Telefonnummer, dein Geburtstag, der Name deiner Schule und Fotos von dir. Die schreibst du im Internet nicht einfach hin. Frag immer zuerst deine Eltern."
          - text: "Ein Spitzname schützt dich.\nNicht: Noah Becker, Lindenstraße 4\nBesser: Blitzkicker"
            say: "In der App braucht Noah auch einen Benutzernamen. Ella rät ihm: Nimm einen Spitznamen, der nichts über dich verrät, also nicht deinen echten Namen und nicht deine Straße. Noah spielt gern Fußball. Er nennt sich Blitzkicker."
          - text: "Wusstest du? Eines der häufigsten Passwörter besteht einfach aus den Zahlen von 1 bis 6."
            say: "Wusstest du? Eines der häufigsten Passwörter auf der Welt ist eins, zwei, drei, vier, fünf, sechs. Darum probieren Betrüger es oft als Erstes aus. So ein Passwort schützt also fast gar nicht."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Passwort ist am stärksten?"
                options: ["lena10", "hallo", "Gr8!kLm#3"]
                answer: "Gr8!kLm#3"
                option_audio: false
                feedback:
                  "lena10": "Lena und eine Zahl? Das errät jeder, der Lena kennt. Ein starkes Passwort ist lang und mischt Buchstaben, Zahlen und Zeichen."
                hints:
                  - "Ein starkes Passwort ist lang und mischt Buchstaben, Zahlen und Zeichen."
                  - "Welches Passwort könnte ein Fremder leicht erraten? Das ist schwach."
                  - "„Gr8!kLm#3“ ist lang und gemischt."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Was behältst du im Internet für dich, was darfst du zeigen? Sortiere."
                bins:
                  - { id: secret, show: { text: "für mich behalten" }, say: "für mich behalten" }
                  - { id: share, show: { text: "darf ich zeigen" }, say: "darf ich zeigen" }
                options:
                  - { text: "meine Adresse", bin: secret }
                  - { text: "mein Passwort", bin: secret }
                  - { text: "meine Telefonnummer", bin: secret }
                  - { text: "mein Spitzname Blitzkicker", bin: share }
                hints:
                  - "Persönliche Daten verraten, wer du bist und wo man dich findet."
                  - "Frag dich: Kann jemand mit dieser Angabe zu mir nach Hause finden oder in mein Konto kommen?"
                  - "Adresse, Passwort und Telefonnummer behältst du für dich. Den Spitznamen darfst du zeigen."
              - id: l1-f3
                type: true_false
                text: "Noahs beste Freundin Mia will sein Passwort wissen.\n\nMuss Noah es ihr sagen?"
                answer: false
                hints:
                  - "Ein Passwort ist wie ein Haustürschlüssel."
                  - "Nur ganz bestimmte Menschen dürfen dein Passwort kennen."
                  - "Nein. Nur seine Eltern dürfen es kennen."
              - id: l1-f4
                type: fill_in_blank
                text: "Bau das Passwort aus dem Merksatz: „Mein Opa hat 2 große Katzen!“"
                frame: "_ _ h 2 g _ !"
                options: ["M", "O", "K", "m", "o", "k"]
                answer: ["M", "O", "K"]
                option_audio: false
                hints:
                  - "Nimm von jedem Wort den ersten Buchstaben."
                  - "Groß bleibt groß, klein bleibt klein. Mein, Opa und Katzen schreibt man groß."
                  - "M, O und K."
              - id: l1-f5
                type: multiple_choice
                text: "Noahs Freund Paul sucht einen Benutzernamen für die App. Welcher ist am sichersten?"
                options: ["Blauwal", "PaulSchneider", "Paul_Gartenweg7"]
                answer: "Blauwal"
                hints:
                  - "Ein guter Spitzname verrät nichts über dich."
                  - "Welche Namen verraten, wie Paul heißt oder wo er wohnt?"
                  - "Blauwal verrät nichts über Paul."
              - id: l1-f6
                type: image_multiple_choice
                text: "Wem darf Noah sein Passwort verraten?"
                options: [{ object: mum }, { object: child }, { object: clown }]
                answer: mum
                feedback:
                  clown: "Einem Clown? Der erzählt es vielleicht in der ganzen Manege herum! Nur deine Eltern dürfen dein Passwort kennen."
                  child: "Auch einem anderen Kind verrätst du dein Passwort nicht, selbst wenn es dein Freund ist."
                hints:
                  - "Ein Passwort bleibt geheim."
                  - "Es gibt nur eine Ausnahme: die Menschen, die auf dich aufpassen."
                  - "Seiner Mama."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Was bedeutet das? Verbinde."
                pairs:
                  - { left: { text: "Passwort" }, right: { text: "ein geheimes Wort, das dein Konto schützt" } }
                  - { left: { text: "Spitzname" }, right: { text: "ein Name, der nichts über dich verrät" } }
                  - { left: { text: "persönliche Daten" }, right: { text: "Name, Adresse, Telefonnummer, Geburtstag" } }
                  - { left: { text: "Merksatz" }, right: { text: "ein Satz, aus dem du ein Passwort baust" } }
                hints: ["Persönliche Daten verraten, wer du bist. Der Merksatz hilft beim Passwort."]
              - id: l1-s2
                type: true_false
                text: "„ella“ ist ein gutes Passwort für Ella, weil sie es sich gut merken kann. Stimmt das?"
                answer: false
                hints: ["Ein Name ist leicht zu erraten. Ein starkes Passwort ist lang und gemischt."]
              - id: l1-s3
                type: multiple_choice
                text: "Ein Gewinnspiel in einer App will deine Adresse. Was machst du?"
                options: ["Ich frage zuerst meine Eltern.", "Ich schreibe sie schnell hin, damit ich gewinne.", "Ich schreibe die Adresse von meiner Freundin hin."]
                answer: "Ich frage zuerst meine Eltern."
                hints: ["Deine Adresse ist eine persönliche Angabe. Wen fragst du, bevor du sie weitergibst?"]
              - id: l1-s4
                type: sorting
                text: "Starkes oder schwaches Passwort? Sortiere."
                bins:
                  - { id: strong, show: { text: "stark" }, say: "stark" }
                  - { id: weak, show: { text: "schwach" }, say: "schwach" }
                options:
                  - { text: "Sonne", bin: weak }
                  - { text: "abcd", bin: weak }
                  - { text: "4U!kp9Zr", bin: strong }
                  - { text: "Bt7#Wm2x", bin: strong }
                option_audio: false
                hints: ["Starke Passwörter sind lang und haben große und kleine Buchstaben, Zahlen und Zeichen."]
              - id: l1-s5
                type: fill_in_blank
                text: "Was gehört zu einem starken Passwort? Ergänze."
                frame: "Ein starkes Passwort ist _ und hat Buchstaben, _ und Zeichen."
                options: ["lang", "kurz", "Zahlen", "Namen"]
                answer: ["lang", "Zahlen"]
                hints: ["Ein kurzes Passwort errät man leichter. Namen gehören nicht hinein."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ella hat den Merksatz „Im Sommer essen wir 5 Eis!“. Welches Passwort passt?"
                options: ["ISew5E!", "Isew5e!", "Sommer5!"]
                answer: "ISew5E!"
                option_audio: false
              - id: l1-n2
                type: sorting
                text: "Für mich behalten oder zeigen? Sortiere."
                bins:
                  - { id: secret, show: { text: "für mich behalten" }, say: "für mich behalten" }
                  - { id: share, show: { text: "darf ich zeigen" }, say: "darf ich zeigen" }
                options:
                  - { text: "der Name meiner Schule", bin: secret }
                  - { text: "mein Geburtstag", bin: secret }
                  - { text: "meine Handynummer", bin: secret }
                  - { text: "mein Spitzname im Spiel", bin: share }
              - id: l1-n3
                type: true_false
                text: "Noah fragt seine Eltern, bevor er ein Foto von sich in die App stellt. Macht er das richtig?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Warum ist „noah123“ kein gutes Passwort?"
                options: ["Man kann es leicht erraten.", "Es ist zu lang.", "Es hat zu viele Zeichen."]
                answer: "Man kann es leicht erraten."
              - id: l1-n5
                type: multiple_choice
                text: "Mia hat ihr Passwort aus Versehen ihrer Sitznachbarin gezeigt. Was ist jetzt klug?"
                options: ["Sie ändert es zusammen mit ihren Eltern.", "Sie macht gar nichts.", "Sie schreibt es an die Tafel, dann ist es egal."]
                answer: "Sie ändert es zusammen mit ihren Eltern."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Passwort ist am stärksten?"
            options: ["fussball", "hP4!tQz8", "1234"]
            answer: "hP4!tQz8"
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Deine Adresse schreibst du nur ins Internet, wenn deine Eltern es erlaubt haben. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Welcher Benutzername verrät nichts über dich?"
            options: ["Mondrakete", "LeaSchmidt", "Lea_Klasse4b"]
            answer: "Mondrakete"
          - id: l1-c4
            type: true_false
            text: "Dein Geburtstag ist ein gutes Passwort. Stimmt das?"
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Was sind persönliche Daten?"
            options: ["Name, Adresse und Telefonnummer", "das Wetter von heute", "die Regeln eines Spiels"]
            answer: "Name, Adresse und Telefonnummer"
          - id: l1-c6
            type: fill_in_blank
            text: "Bau das Passwort aus dem Merksatz: „Mein Bruder Tim mag 7 rote Äpfel!“"
            frame: "_ B T m 7 r _ !"
            options: ["M", "Ä", "m", "ä"]
            answer: ["M", "Ä"]
            option_audio: false

  - n: 2
    title: { de: "Fremde im Internet", en: "Strangers online" }
    goal:
      de: "Finde heraus, was du tust, wenn dir im Internet ein Fremder schreibt oder du etwas siehst, das dir Angst macht. Du sagst es einem Erwachsenen."
      en: "Find out what to do when a stranger writes to you online or you see something that frightens you. You tell an adult."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was behältst du im Internet für dich?"
            options: ["deine Adresse", "deinen Spitznamen im Spiel"]
            answer: "deine Adresse"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Mit einem Merksatz kannst du ein starkes Passwort bauen. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Im Spiele-Chat schreibt „Sternchen11“:\n„Hi! Ich bin auch 10. Wie heißt deine Schule?“\n\nWer schreibt da wohl?"
            say: "Noah spielt ein Spiel in seiner App. Im Chat schreibt jemand mit dem Namen Sternchen elf: Hi! Ich bin auch zehn. Wie heißt deine Schule? Was glaubst du: Wer schreibt da? Ein Kind? Oder vielleicht jemand ganz anderes?"
          - text: "Du kannst nicht sehen, wer wirklich schreibt."
            say: "Im Internet kann jeder schreiben, er sei zehn Jahre alt. Hinter Sternchen elf kann ein Kind stecken, aber auch ein Erwachsener, der lügt. Du kannst es nicht wissen. Darum ist jemand, den du nur aus dem Internet kennst, ein Fremder, auch wenn er sehr nett schreibt."
          - text: "Fremden im Internet verrätst du nichts über dich. Du schickst ihnen keine Fotos."
            say: "Noah schreibt Sternchen elf nicht, wie seine Schule heißt. Er verrät nicht, wo er wohnt, und er schickt keine Fotos von sich, auch nicht, wenn er dafür Spielmünzen oder ein Geschenk bekommen soll."
          - text: "Triff dich nie mit jemandem aus dem Internet. Solche Geheimnisse musst du nie für dich behalten."
            say: "Manchmal will ein Fremder sich treffen. Oder er schreibt: Das bleibt unser Geheimnis, sag es nicht deinen Eltern. Dann ist Vorsicht wichtig. Triff dich nie mit jemandem, den du nur aus dem Internet kennst. Und so ein Geheimnis musst du nie für dich behalten."
          - text: "Komisches Gefühl? Stopp! Schließ es und sag es einem Erwachsenen, dem du vertraust."
            say: "Vielleicht schreibt dir jemand etwas Gemeines, oder du siehst ein Bild oder ein Video, das dir Angst macht. Dann hörst du auf, schließt es und sagst es sofort einem Erwachsenen, dem du vertraust: deinen Eltern, deiner Lehrerin oder deinem Lehrer. Du bekommst keinen Ärger. Du hast nichts falsch gemacht."
            show: { object: mum }
          - text: "Melden: Du sagst der App, dass sich jemand falsch verhält.\nBlockieren: Die Person kann dir nicht mehr schreiben."
            say: "Noah macht es richtig. Er zeigt Mama den Chat. Zusammen melden sie Sternchen elf. Melden heißt: Sie sagen der App, dass sich jemand falsch verhält. Dann blockieren sie Sternchen elf. Jetzt kann Sternchen elf Noah nicht mehr schreiben."
          - text: "Wusstest du? Jedes Jahr im Februar gibt es den Safer Internet Day."
            say: "Wusstest du? Jedes Jahr im Februar gibt es einen besonderen Tag: den Safer Internet Day. Das ist Englisch und heißt ungefähr: Tag für ein sichereres Internet. An diesem Tag lernen Kinder in vielen Ländern der Welt, wie sie sich im Internet schützen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "„Blumenkind“ schreibt Noah: „Ich bin 9 und gehe auch in die 4. Klasse.“\n\nWeiß Noah jetzt sicher, dass Blumenkind ein Kind ist?"
                answer: false
                hints:
                  - "Im Internet kann jeder alles über sich schreiben."
                  - "Kann Noah sehen, wer wirklich hinter Blumenkind steckt?"
                  - "Nein. Noah kann es nicht wissen."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Was ist im Chat sicher, was nicht? Sortiere."
                bins:
                  - { id: safe, show: { text: "sicher" }, say: "sicher" }
                  - { id: unsafe, show: { text: "nicht sicher" }, say: "nicht sicher" }
                options:
                  - { text: "Noah schreibt: „Gutes Spiel!“", bin: safe }
                  - { text: "Noah blockiert mit Mama jemanden, der gemein ist.", bin: safe }
                  - { text: "Noah schreibt seine Adresse.", bin: unsafe }
                  - { text: "Noah schickt ein Foto von sich.", bin: unsafe }
                hints:
                  - "Fremden im Internet verrätst du nichts über dich."
                  - "Frag dich bei jeder Karte: Verrät Noah hier etwas über sich?"
                  - "„Gutes Spiel!“ und Blockieren sind sicher. Adresse und Foto nicht."
              - id: l2-f3
                type: multiple_choice
                text: "Ein Fremder schreibt Lina: „Lass uns treffen. Aber sag es keinem!“ Was macht Lina?"
                options: ["Sie sagt es sofort ihren Eltern.", "Sie trifft sich heimlich mit ihm.", "Sie behält das Geheimnis für sich."]
                answer: "Sie sagt es sofort ihren Eltern."
                hints:
                  - "Mit jemandem aus dem Internet triffst du dich nie."
                  - "Muss Lina so ein Geheimnis für sich behalten?"
                  - "Sie sagt es ihren Eltern."
              - id: l2-f4
                type: image_multiple_choice
                text: "Mila sieht ein Video, das ihr Angst macht. Zu wem geht sie?"
                options: [{ object: dad }, { object: teddy }, { object: ghost }]
                answer: dad
                feedback:
                  ghost: "Zu einem Gespenst? Das macht doch noch mehr Angst! Mila geht zu einem Erwachsenen, dem sie vertraut, zum Beispiel zu Papa."
                  teddy: "Der Teddy tröstet, aber er kann nicht helfen. Mila geht zu einem Erwachsenen, dem sie vertraut."
                hints:
                  - "Mila braucht jemanden, der ihr helfen kann."
                  - "Es ist ein Erwachsener, dem sie vertraut."
                  - "Zu Papa."
              - id: l2-f5
                type: matching
                text: "Was bedeutet das? Verbinde."
                pairs:
                  - { left: { text: "blockieren" }, right: { text: "Die Person kann dir nicht mehr schreiben." } }
                  - { left: { text: "melden" }, right: { text: "Du sagst der App, dass sich jemand falsch verhält." } }
                  - { left: { text: "ein Fremder" }, right: { text: "jemand, den du nur aus dem Internet kennst" } }
                hints:
                  - "Zwei Wörter sagen, was du mit einem Erwachsenen in der App tun kannst."
                  - "Nach dem Blockieren ist der Chat mit dieser Person zu."
                  - "blockieren: kann nicht mehr schreiben. melden: der App sagen. Fremder: nur aus dem Internet."
              - id: l2-f6
                type: multiple_choice
                text: "Tim hat im Chat etwas Gemeines gelesen. Er traut sich nicht, es zu erzählen, weil er Angst vor Ärger hat. Was stimmt?"
                options: ["Tim bekommt keinen Ärger. Er darf es erzählen.", "Tim muss es für sich behalten.", "Tim ist selbst schuld."]
                answer: "Tim bekommt keinen Ärger. Er darf es erzählen."
                feedback:
                  "Tim ist selbst schuld.": "Nein! Wer etwas Gemeines schreibt, macht etwas falsch, nicht Tim. Er darf es einem Erwachsenen erzählen."
                hints:
                  - "Wer etwas Gemeines liest, hat nichts falsch gemacht."
                  - "Was sagen Erwachsene, denen Tim vertraut, wenn er ihnen davon erzählt?"
                  - "Tim bekommt keinen Ärger."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Im Chat fragt jemand: „Wie heißt deine Schule?“ Was antwortet Noah am besten?"
                options: ["„Das verrate ich nicht.“", "„Die Lindenschule in der Hauptstraße.“", "„Ich schicke dir ein Foto vom Schulschild.“"]
