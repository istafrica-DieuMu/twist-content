# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.nature-protection
skill: world.nature.nature-protection
curriculum: de-DE
language: de
title:
  de: Natur schützen
  en: Protecting nature
summary: >
  How people change habitats and how we can protect animals and plants.
  The story: Hanna and her grandmother Rosi are nature detectives in their
  small town. Lesson 1 opens with the guess what happens to the animals
  when a meadow becomes a car park, then shows how people change habitats:
  building covers the ground, roads cut through the way of toads to their
  pond, hedges are cut and meadows mown often, poisons kill insects and so
  leave birds hungry, litter traps and harms animals, bright lights at
  night confuse insects. People can also make new habitats. Lesson 2 shows
  what protects them: the Krötenzaun with its buckets, rules in many
  Naturschutzgebiete (stay on the paths, dogs on the lead, pick nothing,
  take litter home), the Rote Liste, and what a child can do at home
  (Nistkasten, Insektenhotel, wild flowers, a pile of leaves for the
  hedgehog, a gap in the fence, lights off); and why it matters for people
  too (bees pollinate fruit). It ends with the skill check. No real
  parties, campaigns or organisations. Kröte, Biber, Hecke, Nistkasten
  and Insektenhotel have no pictures yet, so they are text cards.
metadata:
  year: klasse-4
  topic: { de: Lebensräume, en: Habitats }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.nature.food-chains, world.nature.pond, world.nature.forest, world.nature.waste-recycling]
  also_practises: [world.nature.food-chains]
  vocabulary: { de: [Lebensraum, Naturschutz, Naturschutzgebiet, versiegeln, Hecke, Kröte, Krötenzaun, Krötenwanderung, Insektenhotel, Nistkasten, Blumenwiese, Rote Liste, bedroht, Biber] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: change, what: { de: "erklären, wie Menschen Lebensräume verändern und was das für Tiere und Pflanzen bedeutet", en: "explaining how people change habitats and what that means for animals and plants" } }
    - { id: protect, what: { de: "sagen, was Menschen und Kinder tun können, um Tiere und Pflanzen zu schützen, und warum", en: "saying what people and children can do to protect animals and plants, and why" } }
    - { id: rules, what: { de: "Regeln für den Aufenthalt in der Natur und im Naturschutzgebiet kennen und begründen", en: "knowing and giving reasons for the rules for being out in nature and in a nature reserve" } }
  misconceptions:
    - id: animals-just-move
      what: Thinks animals whose habitat is built over simply move somewhere else and nothing is lost
      addressed: "lesson 1 opens with the guess about the car park; l1-f1, l1-s2, l1-n1 and l2-c1, l2-c3"
    - id: insects-unimportant
      what: Thinks fewer insects make no difference to other animals or to people
      addressed: "lesson 1 Learn links poisons, insects and birds, lesson 2 Learn the bees and the fruit; l1-f4, l1-n3, l2-s4 and l2-c5, l2-c10"
    - id: protection-is-for-adults
      what: Thinks only adults or the government can protect nature and a child cannot do anything
      addressed: "lesson 2 Learn lists what Hanna does at home; l2-f3, l2-s1, l2-n2 and l2-c8, l2-c9"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Was Menschen verändern", en: "What people change" }
    goal:
      de: "Finde heraus, wie Menschen die Lebensräume von Tieren verändern. Eine neue Straße kann zum Beispiel den Weg der Kröten zum Teich versperren."
      en: "Find out how people change the habitats of animals. A new road, for example, can block the toads' way to their pond."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Marienkäfer fressen Blattläuse. Was passiert, wenn die Marienkäfer fehlen?"
            options: ["Es gibt viel mehr Blattläuse.", "Es gibt weniger Blattläuse.", "Nichts ändert sich."]
            answer: "Es gibt viel mehr Blattläuse."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Müll, den man im Wald liegen lässt, verrottet genauso schnell wie Laub. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Hinter Hannas Haus war eine Wiese. Jetzt ist dort ein Parkplatz.\n\nWas glaubst du: Was passiert mit den Tieren der Wiese?"
            say: "Hinter Hannas Haus war früher eine große Wiese mit Blumen, Bienen und Feldmäusen. Jetzt ist dort ein Parkplatz. Was glaubst du: Was passiert mit den Tieren der Wiese? Ziehen sie einfach um, oder geht etwas verloren?"
            show: { object: car }
          - text: "Sie verlieren Futter und Verstecke. Manche finden keinen neuen Platz."
            say: "Die Tiere verlieren ihr Futter und ihre Verstecke. Manche finden eine andere Wiese. Aber oft ist dort schon besetzt, oder es gibt in der Nähe gar keine Wiese mehr. Dann gibt es dort weniger Tiere. Und noch etwas: Unter Asphalt kann Regen nicht mehr versickern."
            show: { object: flower }
          - text: "Straßen zerschneiden Lebensräume."
            say: "Oma Rosi zeigt Hanna eine Straße zwischen dem Wald und dem Teich. Im Frühling wandern die Kröten aus dem Wald zum Teich, um dort ihre Eier abzulegen. Dafür müssen sie über die Straße. Viele werden dabei überfahren."
            show: { object: frog }
          - text: "Gift gegen Insekten → weniger Insekten → weniger Futter für Vögel"
            say: "Wenn Menschen Gift gegen Insekten spritzen, Hecken abschneiden und Wiesen sehr oft mähen, gibt es weniger Insekten. Erinnerst du dich an die Nahrungskette? Viele Vögel füttern ihre Jungen mit Insekten. Weniger Insekten heißt also auch: weniger Futter für die Vögel."
            show: { object: bird }
          - text: "Müll und helles Licht in der Nacht schaden Tieren."
            say: "Auch Müll schadet Tieren. Sie verfangen sich in Plastik oder fressen es, weil sie es für Futter halten. Und helle Lampen in der Nacht locken Insekten an. Sie fliegen dann so lange um das Licht, bis sie erschöpft sind."
            show: { object: lamp }
          - text: "Menschen können aber auch neue Lebensräume schaffen."
            say: "Aber Menschen können auch etwas Gutes tun. Sie können einen Teich anlegen, eine Hecke pflanzen oder eine Blumenwiese säen. Dann ziehen dort neue Tiere ein. Wie das geht, erfährst du in der nächsten Lektion."
            show: { object: garden }
          - text: "Wusstest du? Kröten wandern meistens zu dem Teich zurück, in dem sie selbst groß geworden sind."
            say: "Wusstest du? Kröten wandern im Frühling meistens genau zu dem Teich zurück, in dem sie selbst als Kaulquappe groß geworden sind. Auch wenn inzwischen eine Straße dazwischen liegt."
            show: { object: frog }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Auf der Wiese wird ein Parkplatz gebaut. Was verlieren die Tiere?"
                options: ["ihr Futter und ihre Verstecke", "nur ihre Farbe", "gar nichts, sie mögen Autos"]
                answer: "ihr Futter und ihre Verstecke"
                hints:
                  - "Ein Lebensraum gibt Tieren Futter und Schutz."
                  - "Auf Asphalt wachsen keine Blumen und keine Gräser."
                  - "Ihr Futter und ihre Verstecke."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Hilft das den Tieren, oder schadet es? Sortiere."
                bins:
                  - { id: harm, show: { text: "schadet" }, say: "schadet" }
                  - { id: help, show: { text: "hilft" }, say: "hilft" }
                options:
                  - { text: "eine Hecke abschneiden", bin: harm }
                  - { text: "Müll in den Wald werfen", bin: harm }
                  - { text: "einen Teich anlegen", bin: help }
                  - { text: "eine Blumenwiese säen", bin: help }
                hints:
                  - "Frag dich: Bekommen die Tiere mehr oder weniger Futter und Verstecke?"
                  - "In einer Hecke wohnen Vögel. Müll verletzt Tiere."
                  - "Hecke abschneiden und Müll: schadet. Teich und Blumenwiese: hilft."
              - id: l1-f3
                type: true_false
                text: "Kröten müssen im Frühling oft über eine Straße, um zu ihrem Teich zu kommen. Stimmt das?"
                answer: true
                hints:
                  - "Wohin wandern die Kröten im Frühling?"
                  - "Zwischen dem Wald und dem Teich liegt oft eine Straße."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: ordering
                text: "Was passiert nacheinander? Bring es in die richtige Reihenfolge."
                options: ["Die Vögel finden weniger Futter für ihre Jungen.", "Ein Bauer spritzt Gift gegen Insekten.", "Es gibt weniger Insekten."]
                slot_count: 3
                answer: ["Ein Bauer spritzt Gift gegen Insekten.", "Es gibt weniger Insekten.", "Die Vögel finden weniger Futter für ihre Jungen."]
                option_audio: false
                hints:
                  - "Am Anfang steht, was der Mensch tut."
                  - "Viele Vögel füttern ihre Jungen mit Insekten."
                  - "Gift, weniger Insekten, weniger Futter für die Vögel."
              - id: l1-f5
                type: image_multiple_choice
                text: "Was lockt in der Nacht Insekten an, bis sie erschöpft sind?"
                options: [{ object: lamp }, { object: flower }, { object: tree }]
                answer: lamp
                hints:
                  - "Es geht um etwas, das in der Nacht leuchtet."
                  - "Insekten fliegen immer wieder um das Licht herum."
                  - "Die Lampe."
              - id: l1-f6
                type: multiple_choice
                text: "Warum ist Plastikmüll in der Natur gefährlich für Tiere?"
                options: ["Tiere verfangen sich darin oder fressen es.", "Plastik ist zu bunt.", "Plastik macht zu viel Lärm."]
                answer: "Tiere verfangen sich darin oder fressen es."
                hints:
                  - "Denk an einen Igel und eine Plastiktüte."
                  - "Manche Tiere halten Plastik für Futter."
                  - "Tiere verfangen sich darin oder fressen es."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Was verändert der Mensch, und was passiert dann? Verbinde."
                pairs:
                  - { left: { text: "eine neue Straße" }, right: { text: "Kröten werden auf dem Weg zum Teich überfahren." } }
                  - { left: { text: "eine Wiese, die sehr oft gemäht wird" }, right: { text: "Bienen finden keine Blüten mehr." } }
                  - { left: { text: "ein Parkplatz" }, right: { text: "Regen kann nicht mehr versickern." } }
                hints: ["Unter Asphalt kann kein Wasser in den Boden."]
              - id: l1-s2
                type: true_false
                text: "Wenn eine Wiese verschwindet, ziehen alle Tiere einfach auf eine andere Wiese um. Stimmt das?"
                answer: false
                hints: ["Ist in der Nähe immer noch eine Wiese mit freiem Platz?"]
              - id: l1-s3
                type: multiple_choice
                text: "Warum wandern Kröten im Frühling zum Teich?"
                options: ["um dort ihre Eier abzulegen", "um dort zu überwintern", "um dort Fische zu jagen"]
                answer: "um dort ihre Eier abzulegen"
                hints: ["Aus Krötenlaich werden Kaulquappen, und die leben im Wasser."]
              - id: l1-s4
                type: sorting
                text: "Gibt es danach mehr oder weniger Insekten? Sortiere."
                bins:
                  - { id: more, show: { text: "mehr Insekten" }, say: "mehr Insekten" }
                  - { id: fewer, show: { text: "weniger Insekten" }, say: "weniger Insekten" }
                options:
                  - { text: "Wildblumen am Feldrand", bin: more }
                  - { text: "eine neue Hecke", bin: more }
                  - { text: "Gift gegen Insekten", bin: fewer }
                  - { text: "ein Garten nur aus Steinen", bin: fewer }
                hints: ["Insekten brauchen Blüten und Verstecke."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Viele Vögel füttern ihre Jungen mit Insekten. Wer hat es schwer, wenn es weniger Insekten gibt?"
                options: [{ object: bird }, { object: cow }, { object: fish }]
                answer: bird
                hints: ["Denk an die Nahrungskette mit den Insekten."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "An einem Bach wird ein großes Haus gebaut. Das Ufer wird zubetoniert. Was folgt daraus?"
                options: ["Tiere am Ufer verlieren ihren Lebensraum.", "Es gibt mehr Frösche am Bach.", "Der Bach fließt schneller zum Meer zurück, und das ist alles."]
                answer: "Tiere am Ufer verlieren ihren Lebensraum."
              - id: l1-n2
                type: sorting
                text: "Schadet das den Tieren, oder hilft es? Sortiere."
                bins:
                  - { id: harm, show: { text: "schadet" }, say: "schadet" }
                  - { id: help, show: { text: "hilft" }, say: "hilft" }
                options:
                  - { text: "nachts alle Gartenlampen anlassen", bin: harm }
                  - { text: "eine Plastiktüte im Gebüsch lassen", bin: harm }
                  - { text: "eine Hecke pflanzen", bin: help }
                  - { text: "einen kleinen Teich anlegen", bin: help }
              - id: l1-n3
                type: true_false
                text: "Wenn es weniger Insekten gibt, merken das auch die Vögel. Stimmt das?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Warum wird Hannas Straße im Frühling für Kröten gefährlich?"
                options: ["Sie liegt zwischen dem Wald und dem Teich.", "Kröten mögen keinen Asphalt.", "Im Frühling fahren keine Autos."]
                answer: "Sie liegt zwischen dem Wald und dem Teich."
              - id: l1-n5
                type: ordering
                text: "Was passiert nacheinander? Bring es in die richtige Reihenfolge."
                options: ["Die Bienen finden kein Futter mehr.", "Die Wiese wird zum Parkplatz.", "Die Blumen verschwinden."]
                slot_count: 3
                answer: ["Die Wiese wird zum Parkplatz.", "Die Blumen verschwinden.", "Die Bienen finden kein Futter mehr."]
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was passiert, wenn auf einer Wiese Häuser gebaut werden?"
            options: ["Die Tiere verlieren Futter und Verstecke.", "Die Tiere bekommen mehr Platz.", "Es wachsen mehr Blumen."]
            answer: "Die Tiere verlieren Futter und Verstecke."
          - id: l1-c2
            type: true_false
            text: "Helle Lampen in der Nacht können Insekten schaden. Stimmt das?"
            answer: true
          - id: l1-c3
            type: sorting
            text: "Schadet das, oder hilft es? Sortiere."
            bins:
              - { id: harm, show: { text: "schadet" }, say: "schadet" }
              - { id: help, show: { text: "hilft" }, say: "hilft" }
            options:
              - { text: "Gift gegen Insekten", bin: harm }
              - { text: "eine Blumenwiese", bin: help }
          - id: l1-c4
            type: multiple_choice
            text: "Warum werden im Frühling viele Kröten überfahren?"
            options: ["Sie wandern über Straßen zu ihrem Teich.", "Sie sonnen sich auf der Straße.", "Sie jagen Autos."]
            answer: "Sie wandern über Straßen zu ihrem Teich."
          - id: l1-c5
            type: true_false
            text: "Menschen können Lebensräume nur zerstören, aber nie neue schaffen. Stimmt das?"
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Wer findet weniger Futter, wenn eine Wiese sehr oft gemäht wird?"
            options: [{ object: bee }, { object: shark }, { object: car }]
            answer: bee

  - n: 2
    title: { de: "Wir schützen die Natur", en: "We protect nature" }
    goal:
      de: "Lerne, wie Menschen Tiere und Pflanzen schützen und was du selbst tun kannst. Ein Laubhaufen im Garten hilft zum Beispiel dem Igel."
      en: "Learn how people protect animals and plants and what you can do yourself. A pile of leaves in the garden, for example, helps the hedgehog."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Warum ist eine Straße zwischen Wald und Teich gefährlich für Kröten?"
            options: ["Die Kröten müssen auf dem Weg zum Teich darüber.", "Die Kröten wohnen auf der Straße.", "Die Straße ist zu laut für die Fische."]
            answer: "Die Kröten müssen auf dem Weg zum Teich darüber."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Weniger Insekten heißt weniger Futter für viele Vögel. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Im Frühling stellen Helfer an Hannas Straße einen niedrigen Zaun auf. Daneben graben sie Eimer ein.\n\nWas glaubst du: Wofür?"
            say: "Im Frühling stellen Helferinnen und Helfer an Hannas Straße einen niedrigen Zaun aus Folie auf. Daneben graben sie Eimer in die Erde ein. Was glaubst du: Wofür ist das?"
            show: { object: bucket }
          - text: "Das ist ein Krötenzaun. Die Kröten fallen in die Eimer und werden über die Straße getragen."
            say: "Das ist ein Krötenzaun! Die Kröten können nicht über den Zaun klettern. Sie krabbeln daran entlang und fallen in die Eimer. Jeden Morgen und Abend tragen Helfer die Eimer vorsichtig über die Straße. Auch Hanna und Oma Rosi helfen mit. So kommen die Kröten sicher zum Teich."
            show: { object: frog }
          - text: "Im Naturschutzgebiet gilt oft:\nauf den Wegen bleiben\nHunde an die Leine\nnichts pflücken\nMüll wieder mitnehmen"
            say: "Manche Orte sind besonders wichtig für seltene Tiere und Pflanzen. Sie werden Naturschutzgebiet. In vielen Naturschutzgebieten gilt: Bleib auf den Wegen, damit du keine Nester zertrittst. Hunde kommen an die Leine, damit sie keine Tiere jagen. Pflück keine Pflanzen. Und nimm deinen Müll wieder mit."
            show: { object: dog }
          - text: "Auf der Roten Liste stehen Tiere und Pflanzen, die bedroht sind."
            say: "Es gibt eine Liste, auf der die Tiere und Pflanzen stehen, die selten geworden sind und verschwinden könnten. Sie heißt Rote Liste. Viele Insekten, Vögel, Frösche und Kröten stehen darauf."
          - text: "Das kannst du tun: Nistkasten, Insektenhotel, Wildblumen, Laubhaufen, ein Loch im Zaun, nachts das Licht aus."
            say: "Und was kannst du selbst tun? Hanna hängt mit Oma Rosi einen Nistkasten für Meisen auf und baut ein Insektenhotel. Im Garten säen sie Wildblumen. Im Herbst lassen sie einen Laubhaufen liegen. Darin kann ein Igel überwintern. Ein kleines Loch im Gartenzaun lässt Igel durch. Und nachts machen sie das Gartenlicht aus."
            show: { object: hedgehog }
          - text: "Naturschutz hilft auch uns Menschen. Ohne Bienen gäbe es viel weniger Äpfel."
            say: "Naturschutz hilft nicht nur den Tieren. Bienen und andere Insekten tragen den Blütenstaub von Blüte zu Blüte. Erst dann können an einem Apfelbaum Äpfel wachsen. Und Pflanzen sorgen für saubere Luft und sauberes Wasser. Wir brauchen die Natur also auch."
            show: { object: apple }
          - text: "Wusstest du? Vor ungefähr 100 Jahren gab es in Deutschland nur noch wenige Hundert Biber. Heute sind es wieder viele Tausend."
            say: "Wusstest du? Vor ungefähr hundert Jahren gab es in Deutschland nur noch wenige Hundert Biber. Die Menschen hatten sie fast alle gejagt. Dann wurden die Biber geschützt. Heute leben bei uns wieder viele Tausend. Schutz kann also wirklich helfen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wofür ist der Krötenzaun mit den Eimern?"
                options: ["Damit die Kröten sicher über die Straße getragen werden.", "Damit die Kröten nicht mehr zum Teich kommen.", "Damit die Autos langsamer fahren."]
                answer: "Damit die Kröten sicher über die Straße getragen werden."
                hints:
                  - "Die Kröten wollen zum Teich auf der anderen Straßenseite."
                  - "Sie fallen in die Eimer, und Helfer tragen sie hinüber."
                  - "Damit sie sicher über die Straße kommen."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Warum gibt es diese Regel im Naturschutzgebiet? Verbinde."
                pairs:
                  - { left: { text: "Bleib auf den Wegen." }, right: { text: "Sonst zertrittst du Nester und Pflanzen." } }
                  - { left: { text: "Hunde an die Leine." }, right: { text: "Sonst jagen sie Tiere." } }
                  - { left: { text: "Pflück keine Pflanzen." }, right: { text: "Seltene Pflanzen sollen sich vermehren." } }
                hints:
                  - "Jede Regel schützt etwas anderes."
                  - "Hunde laufen gern hinter Rehen und Hasen her."
                  - "Wege: Nester. Hunde: Jagd. Pflanzen: sollen sich vermehren."
              - id: l2-f3
                type: sorting
                text: "Was kann Hanna zu Hause tun? Sortiere."
                bins:
                  - { id: help, show: { text: "hilft Tieren" }, say: "hilft Tieren" }
                  - { id: no, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "einen Nistkasten aufhängen", bin: help }
                  - { text: "einen Laubhaufen liegen lassen", bin: help }
                  - { text: "den Rasen jede Woche ganz kurz mähen", bin: no }
                  - { text: "nachts alle Lampen im Garten anlassen", bin: no }
                hints:
                  - "Frag dich: Bekommen Tiere dadurch Futter oder ein Versteck?"
                  - "In einem Nistkasten brüten Meisen, im Laub schläft der Igel."
                  - "Nistkasten und Laubhaufen helfen. Kurzer Rasen und Licht in der Nacht nicht."
              - id: l2-f4
                type: image_multiple_choice
                text: "Wer kann im Winter in Hannas Laubhaufen schlafen?"
                options: [{ object: hedgehog }, { object: fish }, { object: elephant }]
                answer: hedgehog
                feedback:
                  elephant: "Ein Elefant im Laubhaufen? Da müsste Hanna sehr viel Laub sammeln! Der Igel überwintert im Laub."
                hints:
                  - "Es ist ein kleines Tier mit Stacheln."
                  - "Es hält Winterschlaf."
                  - "Der Igel."
              - id: l2-f5
                type: true_false
                text: "Auf der Roten Liste stehen Tiere und Pflanzen, die bedroht sind. Stimmt das?"
                answer: true
                hints:
                  - "Rot ist eine Warnfarbe."
                  - "Auf der Liste stehen Tiere und Pflanzen, die verschwinden könnten."
                  - "Ja, das stimmt."
              - id: l2-f6
                type: multiple_choice
                text: "Warum brauchen auch wir Menschen die Bienen?"
                options: ["Sie tragen Blütenstaub weiter, und dann wachsen Äpfel.", "Sie machen die Luft wärmer.", "Sie fressen den Müll im Park."]
                answer: "Sie tragen Blütenstaub weiter, und dann wachsen Äpfel."
                hints:
                  - "Bienen fliegen von Blüte zu Blüte."
                  - "Aus einer Blüte am Apfelbaum wird ein Apfel."
                  - "Sie tragen den Blütenstaub weiter."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Max sagt: „Natur schützen können nur Erwachsene.“ Was antwortest du?"
                options: ["„Kinder können auch helfen, zum Beispiel mit einem Insektenhotel.“", "„Stimmt, Kinder können nichts tun.“", "„Nur wenn sie einen Traktor haben.“"]
