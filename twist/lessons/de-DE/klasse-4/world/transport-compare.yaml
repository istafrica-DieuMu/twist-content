# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.transport-compare
skill: world.space.transport-compare
curriculum: de-DE
language: de
title:
  de: Verkehrsmittel vergleichen
  en: Comparing ways to travel
summary: >
  Jonte and his family work out how to get to school, to the shops and to
  Oma. Lesson 1 compares ways of travelling for the environment: walking
  and cycling run on muscle power and make no exhaust and little noise; a
  car with petrol or diesel burns fuel made from Erdöl, makes Abgase such
  as Kohlendioxid, noise, and needs a lot of space; a full bus or train
  shares one vehicle among many people, so each passenger causes much less
  exhaust; on the same journey a plane causes the most per passenger; an
  electric car has no exhaust pipe but still needs electricity and as much
  space. Lesson 2 adds health and safety: walking and cycling are exercise,
  many Elterntaxis make the school gate dangerous, a Laufbus and a
  Fahrgemeinschaft are alternatives, and the right choice depends on the
  journey (short: walk or cycle; long: bus or train; heavy loads or no bus:
  sometimes the car). It ends with the skill check. Names and story are
  written for Twist.
metadata:
  year: klasse-4
  topic: { de: Verkehr und Umwelt, en: Travel and the environment }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.technology.vehicles, world.nature.energy-sources, world.space.public-transport]
  also_practises: [world.technology.vehicles]
  vocabulary: { de: [Verkehrsmittel, Abgase, Kohlendioxid, Lärm, Muskelkraft, Benzin, Diesel, Elektroauto, Fahrgast, Bewegung, Elterntaxi, Laufbus, Fahrgemeinschaft, umweltfreundlich] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: environment, what: { de: "Verkehrsmittel nach Abgasen, Lärm und Platz vergleichen, für jeden, der mitfährt", en: "comparing ways to travel by exhaust, noise and space, per person travelling" } }
    - { id: health, what: { de: "erklären, warum zu Fuß gehen und Rad fahren gesund sind und warum Elterntaxis den Schulweg gefährlicher machen", en: "explaining why walking and cycling are healthy and why school-run cars make the way to school more dangerous" } }
    - { id: choose, what: { de: "für einen Weg das passende Verkehrsmittel wählen und Alternativen nennen", en: "choosing a suitable way to travel for a journey and naming alternatives" } }
  misconceptions:
    - id: bus-worse-than-car
      what: Thinks a bus is worse for the environment than a car because a bus is bigger and uses more fuel, without counting the passengers
      addressed: "lesson 1 Learn counts the people in the bus and in the car; l1-f3, l1-s2, l1-s3, l1-c2 and l2-c4 test it, with feedback on l1-f3"
    - id: electric-car-free
      what: Thinks an electric car costs the environment nothing because it has no exhaust pipe
      addressed: "lesson 1 Learn says it still needs electricity and as much space; l1-f6, l1-c5 and l2-c6 test it, with feedback on l1-f6"
    - id: car-safest-to-school
      what: Thinks being driven to the school gate is the safest way for every child
      addressed: "lesson 2 Learn shows the crowded school gate; l2-f3, l2-n4, l2-c9 and l2-c13 test it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Was ist gut für die Umwelt?", en: "What is good for the environment?" }
    goal:
      de: "Vergleiche, wie viele Abgase ein Verkehrsmittel macht. Ein voller Bus ist für jeden Fahrgast besser als ein Auto mit nur einer Person."
      en: "Compare how much exhaust a way of travelling makes. A full bus is better for each passenger than a car with only one person in it."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was treibt ein Fahrrad an?"
            options: ["die Kraft deiner Muskeln", "Benzin", "Strom aus der Oberleitung"]
            answer: "die Kraft deiner Muskeln"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Benzin und Diesel werden aus Erdöl gemacht. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Jonte wohnt 1 km von der Schule entfernt. Heute will Mama ihn mit dem Auto bringen.\n\nWas ist für die Umwelt am besten: Auto, Bus oder Fahrrad?"
            say: "Jonte wohnt einen Kilometer von der Schule entfernt. Heute will Mama ihn mit dem Auto bringen. Was glaubst du: Was ist für die Umwelt am besten? Das Auto, der Bus oder das Fahrrad?"
            show: { object: car }
          - text: "Zu Fuß und mit dem Rad: keine Abgase, kaum Lärm, wenig Platz."
            say: "Am besten ist es zu Fuß oder mit dem Fahrrad! Dafür brauchst du kein Benzin und keinen Strom, nur deine Muskeln. Es kommen keine Abgase heraus, es ist leise, und ein Fahrrad braucht wenig Platz."
            show: { object: ride-bike }
          - text: "Ein Auto mit Benzin oder Diesel verbrennt Kraftstoff. Dabei entstehen Abgase."
            say: "Ein Auto mit Benzin oder Diesel verbrennt Kraftstoff, der aus Erdöl gemacht ist. Dabei entstehen Abgase, zum Beispiel Kohlendioxid. Zu viel Kohlendioxid in der Luft macht die Erde wärmer. Außerdem ist ein Auto laut und braucht viel Platz, auf der Straße und auf dem Parkplatz."
          - text: "Im Auto sitzt oft nur eine Person. Im Bus fahren viele Menschen mit."
            say: "Ein Bus verbraucht mehr Kraftstoff als ein Auto. Aber in einem Bus fahren viele Menschen mit, und in vielen Autos sitzt nur eine Person. Wenn sich viele Menschen einen Bus oder eine Bahn teilen, entstehen für jeden Fahrgast viel weniger Abgase. Und auf der Straße bleibt mehr Platz."
            show: { object: bus }
          - text: "Abgase für jeden, der mitfährt, auf derselben Strecke:\nzu Fuß und Rad: keine\nBus und Bahn: wenig\nAuto: viel\nFlugzeug: am meisten"
            say: "Für jeden, der mitfährt, gilt auf derselben Strecke meistens: Zu Fuß und mit dem Rad entstehen keine Abgase. Bus und Bahn machen wenig. Das Auto macht viel. Und das Flugzeug macht am meisten."
          - text: "Ein Elektroauto hat keinen Auspuff. Es braucht aber Strom und genauso viel Platz."
            say: "Und das Elektroauto? Es hat keinen Auspuff, beim Fahren kommen also keine Abgase heraus. Aber es braucht Strom, und es braucht genauso viel Platz auf der Straße wie jedes andere Auto."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Jonte will zur Schule. Welches Verkehrsmittel macht keine Abgase?"
                options: [{ object: bike }, { object: car }, { object: lorry }]
                answer: bike
                hints:
                  - "Abgase entstehen, wenn ein Motor Benzin oder Diesel verbrennt."
                  - "Welches Fahrzeug hat gar keinen Motor?"
                  - "Das Fahrrad. Es fährt mit deinen Muskeln."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Macht das beim Fahren Abgase? Sortiere."
                bins:
                  - { id: yes, show: { text: "macht Abgase" }, say: "macht Abgase" }
                  - { id: no, show: { text: "keine Abgase" }, say: "keine Abgase" }
                options:
                  - { text: "Fahrrad", bin: no }
                  - { text: "Tretroller", bin: no }
                  - { text: "Auto mit Benzin", bin: yes }
                  - { text: "Lastwagen mit Diesel", bin: yes }
                hints:
                  - "Frag dich: Hat es einen Motor, der Kraftstoff verbrennt?"
                  - "Fahrrad und Tretroller bewegst du selbst."
                  - "Auto und Lastwagen machen Abgase, Fahrrad und Tretroller nicht."
              - id: l1-f3
                type: multiple_choice
                text: "Im Auto von Herrn Kaya sitzt nur er selbst. Im Bus daneben sitzen 40 Menschen.\n\nWo entstehen für jeden, der mitfährt, weniger Abgase?"
                options: ["im vollen Bus", "im Auto mit einer Person", "Das ist gleich."]
                answer: "im vollen Bus"
                feedback:
                  "im Auto mit einer Person": "Der Bus verbraucht mehr, aber er teilt die Abgase auf 40 Menschen auf. Im Auto bekommt Herr Kaya alles allein."
                hints:
                  - "Denk daran, wie viele Menschen sich das Fahrzeug teilen."
                  - "Der Bus macht mehr Abgase als ein Auto, aber er nimmt 40 Menschen mit."
                  - "Im vollen Bus."
              - id: l1-f4
                type: ordering
                text: "Ordne von wenig zu vielen Abgasen, für jeden, der mitfährt."
                options: ["Auto", "Flugzeug", "Fahrrad", "Bahn"]
                slot_count: 4
                answer: ["Fahrrad", "Bahn", "Auto", "Flugzeug"]
                hints:
                  - "Fang mit dem an, was gar keine Abgase macht."
                  - "Die Bahn teilt sich viele Menschen. Das Flugzeug macht am meisten."
                  - "Fahrrad, Bahn, Auto, Flugzeug."
              - id: l1-f5
                type: true_false
                text: "Ein Auto braucht auf der Straße viel mehr Platz als ein Fahrrad. Stimmt das?"
                answer: true
                hints:
                  - "Stell dir ein Auto und ein Fahrrad nebeneinander vor."
                  - "Ein Auto ist viel breiter und länger."
                  - "Ja, das stimmt."
              - id: l1-f6
                type: multiple_choice
                text: "Ein Elektroauto hat keinen Auspuff. Was braucht es trotzdem?"
                options: ["Strom und viel Platz", "Heu und Hafer", "gar nichts"]
                answer: "Strom und viel Platz"
                feedback:
                  "Heu und Hafer": "Heu und Hafer frisst ein Pferd! Ein Elektroauto braucht Strom und so viel Platz wie jedes Auto."
                  "gar nichts": "Ohne Strom fährt es nicht, und parken muss es auch."
                hints:
                  - "Womit fährt ein Elektroauto?"
                  - "Es fährt mit Strom aus einer Batterie, und es ist so groß wie ein anderes Auto."
                  - "Strom und viel Platz."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Leise oder laut? Sortiere."
                bins:
                  - { id: quiet, show: { text: "leise" }, say: "leise" }
                  - { id: loud, show: { text: "laut" }, say: "laut" }
                options:
                  - { text: "zu Fuß gehen", bin: quiet }
                  - { text: "Fahrrad fahren", bin: quiet }
                  - { text: "Lastwagen", bin: loud }
                  - { text: "Motorrad", bin: loud }
                hints: ["Ein Motor brummt. Wer ohne Motor unterwegs ist, ist leise."]
              - id: l1-s2
                type: multiple_choice
                text: "Vor der Schule halten 20 Autos. In jedem sitzt ein Kind. Wie viele Busse bräuchte man für die 20 Kinder?"
                options: ["1 Bus", "10 Busse", "20 Busse"]
                answer: "1 Bus"
                keep_order: true
                hints: ["In einen Bus passen viel mehr als 20 Menschen."]
              - id: l1-s3
                type: true_false
                text: "Mit dem Bus entstehen für jeden Fahrgast immer mehr Abgase als mit dem Auto. Stimmt das?"
                answer: false
                hints: ["Ein voller Bus teilt seine Abgase auf viele Menschen auf."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Was braucht auf dem Parkplatz den meisten Platz?"
                options: [{ object: bike }, { object: car }, { object: schoolbag }]
                answer: car
                feedback:
                  schoolbag: "Einen Parkplatz für den Schulranzen gibt es nicht! Das Auto braucht am meisten Platz."
                hints: ["Welches davon ist am größten?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Ein Auto mit Benzin macht _. Ein Fahrrad fährt mit _."
                options: ["Abgase", "Muskelkraft", "Wind", "Strom"]
                answer: ["Abgase", "Muskelkraft"]
                hints: ["Das Auto verbrennt Benzin. Das Fahrrad bewegst du mit deinen Beinen."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Ordne von wenig zu vielen Abgasen, für jeden, der mitfährt."
                options: ["Bus", "Flugzeug", "zu Fuß", "Auto"]
                slot_count: 4
                answer: ["zu Fuß", "Bus", "Auto", "Flugzeug"]
              - id: l1-n2
                type: multiple_choice
                text: "Familie Demir fährt zu viert zu Oma. Oma wohnt 200 km weit weg. Womit entstehen die wenigsten Abgase?"
                options: ["mit der Bahn", "mit zwei Autos", "mit dem Flugzeug"]
                answer: "mit der Bahn"
              - id: l1-n3
                type: true_false
                text: "Zu viel Kohlendioxid in der Luft macht die Erde wärmer. Stimmt das?"
                answer: true
              - id: l1-n4
                type: sorting
                text: "Gut für die Umwelt oder nicht so gut? Sortiere."
                bins:
                  - { id: good, show: { text: "gut für die Umwelt" }, say: "gut für die Umwelt" }
                  - { id: bad, show: { text: "nicht so gut" }, say: "nicht so gut" }
                options:
                  - { text: "Jonte geht zu Fuß zum Bäcker um die Ecke.", bin: good }
                  - { text: "Lea fährt mit dem vollen Bus in die Stadt.", bin: good }
                  - { text: "Papa fährt mit dem Auto 300 Meter zum Briefkasten.", bin: bad }
                  - { text: "Vor der Schule wartet ein Auto, und der Motor läuft die ganze Zeit.", bin: bad }
              - id: l1-n5
                type: multiple_choice
                text: "An einer Straße mit vielen Autos riecht die Luft schlecht. Woran liegt das?"
                options: ["an den Abgasen", "an den Fahrrädern", "an den Bäumen"]
                answer: "an den Abgasen"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welches Verkehrsmittel fährt nur mit Muskelkraft?"
            options: [{ object: bus }, { object: bike }, { object: taxi }]
            answer: bike
          - id: l1-c2
            type: true_false
            text: "In einem vollen Bus entstehen für jeden Fahrgast weniger Abgase als in einem Auto mit nur einer Person. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was macht ein Auto mit Benzin, ein Fahrrad aber nicht?"
            options: ["Abgase", "Spaß", "Kurven"]
            answer: "Abgase"
          - id: l1-c4
            type: multiple_choice
            text: "Was macht auf derselben Strecke für jeden, der mitfährt, die meisten Abgase?"
            options: ["das Flugzeug", "die Bahn", "das Fahrrad"]
            answer: "das Flugzeug"
          - id: l1-c5
            type: true_false
            text: "Ein Elektroauto braucht keinen Platz zum Parken. Stimmt das?"
            answer: false
          - id: l1-c6
            type: text_input
            text: "15 Kinder werden mit 15 Autos zur Schule gebracht. Morgen fahren alle 15 Kinder mit einem Bus. Wie viele Autos fahren dann weniger?"
            answer: "15"

  - n: 2
    title: { de: "Gesund und sicher ans Ziel", en: "Healthy and safe to get there" }
    goal:
      de: "Finde heraus, warum zu Fuß gehen und Rad fahren gesund sind. Dann wählst du für jeden Weg das passende Verkehrsmittel."
      en: "Find out why walking and cycling are healthy. Then you choose the right way to travel for each journey."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Die Schule ist 1 km weit weg. Was ist für die Umwelt am besten?"
            options: ["zu Fuß oder mit dem Rad", "mit dem Auto", "mit dem Taxi"]
            answer: "zu Fuß oder mit dem Rad"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein Bus mit vielen Menschen macht für jeden weniger Abgase als viele einzelne Autos. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Jonte geht zu Fuß zur Schule. Sein Freund Max wird mit dem Auto gebracht.\n\nWer ist in der ersten Stunde wohl wacher?"
            say: "Jonte geht jeden Morgen zu Fuß zur Schule. Sein Freund Max wird mit dem Auto bis vor die Tür gebracht. Was glaubst du: Wer ist in der ersten Stunde wohl wacher?"
            show: { object: school }
          - text: "Wer sich bewegt, wird wach und bleibt fit."
            say: "Oft ist es Jonte. Wer zu Fuß geht oder Rad fährt, bewegt sich an der frischen Luft. Herz und Muskeln arbeiten, und danach kannst du dich oft besser konzentrieren. Bewegung jeden Tag hält dich gesund."
            show: { object: heart }
          - text: "Viele Elterntaxis machen es vor der Schule eng und gefährlich."
            say: "Wenn viele Eltern ihre Kinder mit dem Auto bis vor die Schule bringen, nennt man das Elterntaxi. Dann wird es vor dem Schultor eng. Autos halten, wenden und fahren rückwärts. Für die Kinder, die zu Fuß oder mit dem Rad kommen, wird es gefährlich."
            show: { object: car }
          - text: "Laufbus: Kinder gehen zusammen zu Fuß zur Schule.\nFahrgemeinschaft: Mehrere fahren zusammen in einem Auto."
            say: "Es geht auch anders. Beim Laufbus gehen mehrere Kinder zusammen zu Fuß zur Schule, am Anfang mit einem Erwachsenen. Und wenn es doch das Auto sein muss, können mehrere Familien zusammen fahren. Das heißt Fahrgemeinschaft. So fahren weniger Autos."
          - text: "Kurzer Weg: zu Fuß oder mit dem Rad\nLanger Weg: Bus oder Bahn\nSchwere Sachen oder kein Bus: manchmal das Auto"
            say: "Nicht jeder Weg ist gleich. Für kurze Wege bist du zu Fuß oder mit dem Rad gut unterwegs. Für lange Wege sind Bus und Bahn eine gute Wahl. Manchmal braucht man doch ein Auto, zum Beispiel für einen schweren Einkauf oder dort, wo kein Bus fährt. Dann kann man überlegen, ob mehrere zusammen fahren."
          - text: "Wusstest du? Auf einen Parkplatz für ein Auto passen ungefähr acht Fahrräder."
            say: "Wusstest du? Auf einen Parkplatz für ein einziges Auto passen ungefähr acht Fahrräder. Stell dir vor, wie viel Platz in einer Stadt frei wäre, wenn mehr Menschen Rad fahren!"
            show: { object: bike }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Die Schule ist 800 Meter weit weg, und es ist trocken. Wie kommt Jonte am gesündesten hin?"
                options: ["zu Fuß", "mit dem Taxi", "mit dem Auto"]
                answer: "zu Fuß"
                hints:
                  - "Gesund ist, wobei du dich bewegst."
                  - "Im Taxi und im Auto sitzt du nur."
                  - "Zu Fuß."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Bewegst du dich dabei? Sortiere."
                bins:
                  - { id: move, show: { text: "Bewegung" }, say: "Bewegung" }
                  - { id: still, show: { text: "keine Bewegung" }, say: "keine Bewegung" }
                options:
                  - { text: "mit dem Rad zur Schule fahren", bin: move }
                  - { text: "zur Bushaltestelle laufen", bin: move }
                  - { text: "hinten im Auto sitzen", bin: still }
                  - { text: "mit dem Aufzug statt über die Treppe fahren", bin: still }
                hints:
                  - "Frag dich: Arbeiten dabei deine Beine?"
                  - "Beim Radfahren und Laufen arbeiten deine Muskeln. Im Auto und im Aufzug nicht."
                  - "Rad und Bushaltestelle: Bewegung. Auto und Aufzug: keine Bewegung."
              - id: l2-f3
                type: true_false
                text: "Vor der Schule halten jeden Morgen viele Elterntaxis. Das macht den Schulweg für alle sicherer. Stimmt das?"
                answer: false
                hints:
                  - "Denk an das Schultor, wenn viele Autos gleichzeitig kommen."
                  - "Die Autos halten, wenden und fahren rückwärts, mitten zwischen den Kindern."
                  - "Nein, es wird gefährlicher."
              - id: l2-f4
                type: matching
                text: "Welches Verkehrsmittel passt zum Weg? Verbinde."
                pairs:
                  - { left: { text: "zum Bäcker um die Ecke" }, right: { text: "zu Fuß" } }
                  - { left: { text: "zu Oma, 300 km weit weg" }, right: { text: "mit der Bahn" } }
                  - { left: { text: "den schweren Wocheneinkauf in ein Dorf ohne Bus" }, right: { text: "mit dem Auto" } }
                hints:
                  - "Überleg, wie weit der Weg ist und was man tragen muss."
                  - "Kurze Wege zu Fuß, lange Wege mit der Bahn, schwere Sachen ohne Bus mit dem Auto."
                  - "Bäcker: zu Fuß. Oma: Bahn. Einkauf: Auto."
              - id: l2-f5
                type: multiple_choice
                text: "Drei Familien aus einer Straße fahren jeden Samstag mit drei Autos zum selben Fußballplatz. Was können sie besser machen?"
                options: ["eine Fahrgemeinschaft bilden", "mit vier Autos fahren", "den Motor beim Warten laufen lassen"]
                answer: "eine Fahrgemeinschaft bilden"
                hints:
                  - "Alle wollen an denselben Ort."
                  - "Wenn mehrere in einem Auto fahren, fahren weniger Autos."
                  - "Eine Fahrgemeinschaft."
              - id: l2-f6
                type: image_multiple_choice
                text: "Jonte und Max wollen ins Schwimmbad. Es ist 2 km weit weg, und es gibt einen Radweg. Womit fahren sie gesund und ohne Abgase?"
                options: [{ object: taxi }, { object: bike }, { object: car }]
                answer: bike
                hints:
                  - "Gesund und ohne Abgase: Du bewegst dich selbst."
                  - "Es gibt einen Radweg."
                  - "Mit dem Fahrrad."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was ist ein Laufbus?"
                options: ["Kinder gehen zusammen zu Fuß zur Schule.", "ein Bus, der ganz langsam fährt", "ein Bus mit Beinen"]
                answer: "Kinder gehen zusammen zu Fuß zur Schule."
                feedback:
                  "ein Bus mit Beinen": "Das wäre lustig! Beim Laufbus sind die Kinder selbst der Bus: Sie gehen zusammen zur Schule."
                hints: ["Beim Laufbus wird gelaufen, nicht gefahren."]
              - id: l2-s2
                type: true_false
                text: "Wer sich jeden Tag bewegt, bleibt fitter. Stimmt das?"
                answer: true
                hints: ["Denk an Herz und Muskeln."]
              - id: l2-s3
                type: sorting
                text: "Kurzer oder langer Weg? Sortiere."
                bins:
                  - { id: short, show: { text: "zu Fuß oder mit dem Rad" }, say: "zu Fuß oder mit dem Rad" }
                  - { id: long, show: { text: "mit Bus oder Bahn" }, say: "mit Bus oder Bahn" }
                options:
                  - { text: "1 km zur Schule", bin: short }
                  - { text: "zum Spielplatz in der Nachbarstraße", bin: short }
                  - { text: "100 km zum Zoo", bin: long }
                  - { text: "in eine andere Stadt zu Tante Lisa", bin: long }
                hints: ["Kurze Wege gehst oder fährst du selbst. Für lange Wege nimmst du Bus oder Bahn."]
              - id: l2-s4
                type: multiple_choice
                text: "Max wird jeden Tag 500 Meter zur Schule gefahren. Was kann er vorschlagen?"
                options: ["mit dem Laufbus gehen", "mit dem Taxi fahren", "noch näher an die Tür gefahren werden"]
                answer: "mit dem Laufbus gehen"
                hints: ["500 Meter sind ein kurzer Weg, den man gut laufen kann."]
              - id: l2-s5
                type: fill_in_blank
                text: "Welche Wörter passen?"
                frame: "Für kurze Wege gehe ich _. Für lange Wege durch Deutschland nehme ich _."
                options: ["zu Fuß", "die Bahn", "den Aufzug", "das Taxi"]
                answer: ["zu Fuß", "die Bahn"]
                hints: ["Kurz: zu Fuß oder Rad. Lang: Bus oder Bahn."]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "Was bedeutet das Wort? Verbinde."
                pairs:
                  - { left: { text: "Laufbus" }, right: { text: "Kinder gehen zusammen zur Schule." } }
                  - { left: { text: "Fahrgemeinschaft" }, right: { text: "Mehrere fahren in einem Auto." } }
                  - { left: { text: "Elterntaxi" }, right: { text: "Eltern fahren ihr Kind bis vor die Schule." } }
