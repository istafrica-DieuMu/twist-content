# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.pond
skill: world.nature.pond
curriculum: de-DE
language: de
title:
  de: Leben am Teich
  en: Life at the pond
summary: >
  The pond as a habitat. The story: Ida and her uncle Malte explore the
  school pond with a Kescher and a Becherlupe. Lesson 1 opens with the
  guess how many animals live in a quiet pond, then goes round its three
  places: am Ufer (Schilf, Frosch, Graureiher), auf dem Wasser (Seerose,
  Ente, Wasserläufer) and unter Wasser (Wasserpflanzen, Fische,
  Kaulquappen, Teichschnecken, Libellenlarven). Lesson 2 asks how the
  animals live there: breathing with gills or fetching air at the
  surface (Gelbrandkäfer, Mückenlarve), the dragonfly larva that lives in
  the water and leaves its skin on a reed stem, a pond food chain (Algen,
  Mückenlarve, Libellenlarve, Fisch, Graureiher) and winter under the
  ice, with the rule to step on ice only where it is officially open. It
  ends with the skill check. Schilf, Seerose, Libelle, Wasserläufer,
  Graureiher, Gelbrandkäfer, Kaulquappe, Mückenlarve and Algen have no
  pictures yet, so they are text cards.
metadata:
  year: klasse-4
  topic: { de: Lebensräume, en: Habitats }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.nature.life-cycles, world.nature.adaptation, world.nature.food-chains]
  also_practises: [world.nature.food-chains]
  vocabulary: { de: [Teich, Ufer, Schilf, Seerose, Wasserpflanzen, Kescher, Becherlupe, Wasserläufer, Libelle, Larve, Kaulquappe, Graureiher, Gelbrandkäfer, Kiemen, Luftvorrat, Algen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: where, what: { de: "Tiere und Pflanzen am Teich nennen und sagen, wo sie leben: am Ufer, auf dem Wasser oder unter Wasser", en: "naming pond animals and plants and saying where they live: on the bank, on the water or under water" } }
    - { id: living, what: { de: "beschreiben, wie Tiere im Teich atmen, aufwachsen und den Winter überstehen", en: "describing how pond animals breathe, grow up and get through the winter" } }
    - { id: pond-food, what: { de: "eine Nahrungskette im Teich bilden", en: "building a pond food chain" } }
  misconceptions:
    - id: all-water-animals-gills
      what: Thinks every animal that lives in water breathes with gills, like a fish
      addressed: "lesson 2 opens with the guess how the Gelbrandkäfer breathes; l2-f1, l2-s2, l2-n1 and l2-c8, l2-c10"
    - id: pond-is-empty
      what: Thinks a quiet pond holds few animals, only fish and ducks
      addressed: "lesson 1 opens with the guess and goes round the three places; l1-f1, l1-s1, l1-n1 and l2-c1"
    - id: dragonfly-lives-in-air
      what: Thinks a dragonfly spends its whole life in the air and does not know its larva lives in water
      addressed: "lesson 2 Learn follows the larva up the reed stem; l2-f3, l2-s4, l2-n4 and l2-c9"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Rund um den Schulteich", en: "Round the school pond" }
    goal:
      de: "Lerne Tiere und Pflanzen am Teich kennen und wo sie leben. Die Seerose zum Beispiel schwimmt auf dem Wasser."
      en: "Get to know the animals and plants of the pond and where they live. The water lily, for example, floats on the water."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Wie wird aus dem Laich ein Frosch? Bring es in die richtige Reihenfolge."
            options: ["Kaulquappe mit Beinen", "Froschlaich", "junger Frosch", "Kaulquappe"]
            slot_count: 4
            answer: ["Froschlaich", "Kaulquappe", "Kaulquappe mit Beinen", "junger Frosch"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was hilft der Ente beim Schwimmen?"
            options: ["die Schwimmhäute zwischen den Zehen", "der lange Schnabel", "die Federn am Kopf"]
            answer: "die Schwimmhäute zwischen den Zehen"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ida und Onkel Malte stehen am Schulteich. Das Wasser ist ganz still.\n\nWas glaubst du: Wie viele Tiere leben in diesem Teich?"
            say: "Ida und ihr Onkel Malte stehen am Schulteich. Sie haben einen Kescher und eine Becherlupe dabei. Das Wasser ist ganz still. Was glaubst du: Wie viele Tiere leben in diesem Teich? Keins, ein paar oder sehr viele?"
            show: { object: water }
          - text: "Sehr viele! Die meisten sind klein oder verstecken sich.\n\nAm Teich gibt es drei Orte: am Ufer, auf dem Wasser und unter Wasser."
            say: "Sehr viele! Die meisten sind klein, oder sie verstecken sich zwischen den Pflanzen. Ida und Malte gehen einmal rund um den Teich. Sie finden drei Orte: am Ufer, auf dem Wasser und unter Wasser. An jedem Ort leben andere Tiere und Pflanzen."
          - text: "Am Ufer: Schilf, Frosch und Graureiher."
            say: "Am Ufer wächst hohes Schilf. Seine Wurzeln stecken im Schlamm. Im Schilf bauen Vögel ihre Nester. Ein Frosch sitzt im Gras am Rand. Und ein Graureiher steht ganz still im flachen Wasser. Er wartet auf Fische und Frösche."
            show: { object: frog }
          - text: "Auf dem Wasser: Seerose, Ente und Wasserläufer."
            say: "Auf dem Wasser schwimmen die großen runden Blätter der Seerose. Ihre Wurzeln stecken unten im Boden des Teichs, und ein langer Stiel trägt die Blätter nach oben. Eine Ente paddelt vorbei. Und ein dünnes Insekt flitzt über das Wasser, ohne einzusinken. Das ist der Wasserläufer."
            show: { object: duck }
          - text: "Unter Wasser: Wasserpflanzen, Fische, Kaulquappen, Teichschnecken und Libellenlarven."
            say: "Dann taucht Ida den Kescher ins Wasser. In der Becherlupe zappeln kleine Fische, Kaulquappen und eine Teichschnecke. Und ein seltsames Tier mit sechs Beinen: eine Libellenlarve. Unter Wasser wachsen auch Wasserpflanzen. Dort finden die Tiere Futter und Verstecke. Danach bringt Ida alle Tiere vorsichtig zurück ins Wasser."
            show: { object: fish }
          - text: "Wusstest du? Frösche trinken nicht mit dem Mund."
            say: "Wusstest du? Frösche trinken nicht mit dem Mund. Sie nehmen das Wasser durch ihre Haut auf. Darum ist ihre Haut immer feucht, und darum brauchen Frösche einen Teich oder eine feuchte Wiese in der Nähe."
            show: { object: frog }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Ida taucht den Kescher ins Wasser. Welches Tier kann darin sein?"
                options: [{ object: fish }, { object: hedgehog }, { object: bee }]
                answer: fish
                hints:
                  - "Gesucht ist ein Tier, das unter Wasser lebt."
                  - "Der Igel und die Biene leben an Land."
                  - "Der Fisch."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Wo lebt das am Teich? Sortiere."
                bins:
                  - { id: bank, show: { text: "am Ufer" }, say: "am Ufer" }
                  - { id: on, show: { text: "auf dem Wasser" }, say: "auf dem Wasser" }
                  - { id: under, show: { text: "unter Wasser" }, say: "unter Wasser" }
                options:
                  - { text: "Schilf", bin: bank }
                  - { text: "Seerose", bin: on }
                  - { object: duck, bin: on }
                  - { object: fish, bin: under }
                hints:
                  - "Frag dich: Steht es am Rand, schwimmt es oben, oder lebt es im Wasser?"
                  - "Das Schilf wächst am Rand. Die Seerose hat Blätter, die oben schwimmen."
                  - "Schilf: am Ufer. Seerose und Ente: auf dem Wasser. Fisch: unter Wasser."
              - id: l1-f3
                type: true_false
                text: "Die Seerose hat keine Wurzeln. Sie treibt einfach auf dem Wasser. Stimmt das?"
                answer: false
                hints:
                  - "Denk an den langen Stiel der Seerose."
                  - "Der Stiel führt von den Blättern nach unten."
                  - "Nein, ihre Wurzeln stecken im Boden des Teichs."
              - id: l1-f4
                type: multiple_choice
                text: "Ein dünnes Insekt flitzt über das Wasser, ohne einzusinken. Wie heißt es?"
                options: ["Wasserläufer", "Regenwurm", "Marienkäfer"]
                answer: "Wasserläufer"
                hints:
                  - "Der Name sagt, was es tut."
                  - "Es läuft auf dem Wasser."
                  - "Der Wasserläufer."
              - id: l1-f5
                type: matching
                text: "Was tut das Tier am Teich? Verbinde."
                pairs:
                  - { left: { text: "Graureiher" }, right: { text: "steht im flachen Wasser und fängt Fische" } }
                  - { left: { object: duck }, right: { text: "paddelt auf dem Wasser" } }
                  - { left: { text: "Libellenlarve" }, right: { text: "krabbelt unter Wasser" } }
                hints:
                  - "Jedes Tier lebt an einem anderen Ort am Teich."
                  - "Der Graureiher ist ein großer Vogel mit langen Beinen."
                  - "Graureiher: fängt Fische. Ente: paddelt. Libellenlarve: krabbelt unter Wasser."
              - id: l1-f6
                type: multiple_choice
                text: "Warum ist die Haut eines Frosches immer feucht?"
                options: ["Er nimmt Wasser durch die Haut auf.", "Er hat gerade geduscht.", "Er schwitzt so viel."]
                answer: "Er nimmt Wasser durch die Haut auf."
                hints:
                  - "Frösche trinken nicht mit dem Mund."
                  - "Das Wasser kommt durch die Haut in den Körper."
                  - "Er nimmt Wasser durch die Haut auf."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Lebt das am Teich? Sortiere."
                bins:
                  - { id: yes, show: { text: "am Teich" }, say: "am Teich" }
                  - { id: no, show: { text: "nicht am Teich" }, say: "nicht am Teich" }
                options:
                  - { object: frog, bin: yes }
                  - { object: snail, bin: yes }
                  - { object: zebra, bin: no }
                  - { object: giraffe, bin: no }
                hints: ["Zebra und Giraffe leben in Afrika, in der Savanne."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welches Tier sitzt am Ufer und quakt?"
                options: [{ object: frog }, { object: cat }, { object: owl }]
                answer: frog
                hints: ["Es ist ein Tier, das zuerst eine Kaulquappe war."]
              - id: l1-s3
                type: multiple_choice
                text: "Wo bauen Vögel am Teich gern ihre Nester?"
                options: ["im Schilf am Ufer", "auf den Seerosenblättern mitten im Wasser", "unter Wasser"]
                answer: "im Schilf am Ufer"
                hints: ["Das hohe Schilf am Ufer ist ein gutes Versteck."]
              - id: l1-s4
                type: true_false
                text: "Unter Wasser finden die Tiere zwischen den Wasserpflanzen Futter und Verstecke. Stimmt das?"
                answer: true
                hints: ["Ida findet die meisten kleinen Tiere zwischen den Pflanzen."]
              - id: l1-s5
                type: fill_in_blank
                text: "Ergänze."
                frame: "Die Blätter der Seerose schwimmen _ . Ihre Wurzeln stecken _ ."
                options: ["auf dem Wasser", "im Boden des Teichs", "in der Luft"]
                answer: ["auf dem Wasser", "im Boden des Teichs"]
                hints: ["Ein langer Stiel verbindet oben und unten."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Wo lebt das am Teich? Sortiere."
                bins:
                  - { id: bank, show: { text: "am Ufer" }, say: "am Ufer" }
                  - { id: on, show: { text: "auf dem Wasser" }, say: "auf dem Wasser" }
                  - { id: under, show: { text: "unter Wasser" }, say: "unter Wasser" }
                options:
                  - { text: "Graureiher", bin: bank }
                  - { text: "Wasserläufer", bin: on }
                  - { text: "Kaulquappe", bin: under }
                  - { text: "Teichschnecke", bin: under }
              - id: l1-n2
                type: multiple_choice
                text: "Ida hat Tiere in der Becherlupe angeschaut. Was macht sie danach?"
                options: ["Sie bringt alle Tiere vorsichtig zurück ins Wasser.", "Sie nimmt die Tiere mit nach Hause.", "Sie lässt die Becherlupe in der Sonne stehen."]
                answer: "Sie bringt alle Tiere vorsichtig zurück ins Wasser."
              - id: l1-n3
                type: true_false
                text: "Der Graureiher schwimmt mitten im Teich und taucht nach Fischen. Stimmt das?"
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                text: "Welches Tier lebt auf dem Wasser und hat Schwimmhäute?"
                options: [{ object: duck }, { object: hen }, { object: owl }]
                answer: duck
              - id: l1-n5
                type: matching
                text: "Welche Pflanze ist gemeint? Verbinde."
                pairs:
                  - { left: { text: "Schilf" }, right: { text: "wächst hoch am Ufer" } }
                  - { left: { text: "Seerose" }, right: { text: "hat runde Blätter, die auf dem Wasser schwimmen" } }
                  - { left: { text: "Wasserpflanzen" }, right: { text: "wachsen ganz unter Wasser" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Tier flitzt über das Wasser, ohne einzusinken?"
            options: ["der Wasserläufer", "die Teichschnecke", "der Fisch"]
            answer: "der Wasserläufer"
          - id: l1-c2
            type: image_multiple_choice
            text: "Welches Tier lebt unter Wasser im Teich?"
            options: [{ object: fish }, { object: rabbit }, { object: cow }]
            answer: fish
          - id: l1-c3
            type: true_false
            text: "Frösche trinken mit dem Mund, so wie wir. Stimmt das?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Wo wächst das Schilf?"
            options: ["am Ufer", "mitten auf dem Wasser", "auf Bäumen"]
            answer: "am Ufer"
          - id: l1-c5
            type: sorting
            text: "Am Teich oder nicht? Sortiere."
            bins:
              - { id: yes, show: { text: "am Teich" }, say: "am Teich" }
              - { id: no, show: { text: "nicht am Teich" }, say: "nicht am Teich" }
            options:
              - { object: duck, bin: yes }
              - { text: "Seerose", bin: yes }
              - { object: lion, bin: no }
              - { object: elephant, bin: no }
          - id: l1-c6
            type: true_false
            text: "Im Teich leben viele kleine Tiere, die man erst sieht, wenn man genau hinschaut. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Wie lebt man im Teich?", en: "How do you live in a pond?" }
    goal:
      de: "Finde heraus, wie Tiere im Teich atmen, groß werden und den Winter überstehen. Der Gelbrandkäfer zum Beispiel holt sich Luft von oben."
      en: "Find out how pond animals breathe, grow up and get through the winter. The great diving beetle, for example, fetches air from the surface."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: sorting
            text: "Wo lebt das am Teich? Sortiere."
            bins:
              - { id: bank, show: { text: "am Ufer" }, say: "am Ufer" }
              - { id: on, show: { text: "auf dem Wasser" }, say: "auf dem Wasser" }
              - { id: under, show: { text: "unter Wasser" }, say: "unter Wasser" }
            options:
              - { text: "Schilf", bin: bank }
              - { text: "Wasserläufer", bin: on }
              - { object: fish, bin: under }
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Die Wurzeln der Seerose stecken im Boden des Teichs. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Im Kescher zappelt ein großer Käfer mit gelbem Rand. Er lebt unter Wasser, hat aber keine Kiemen.\n\nWas glaubst du: Wie atmet er?"
            say: "Im Kescher zappelt ein großer dunkler Käfer mit einem gelben Rand. Onkel Malte sagt: Das ist ein Gelbrandkäfer. Er lebt unter Wasser, aber er hat keine Kiemen wie ein Fisch. Was glaubst du: Wie atmet er?"
          - text: "Er schwimmt nach oben und nimmt Luft unter seinen Flügeln mit."
            say: "Der Gelbrandkäfer schwimmt immer wieder nach oben an die Wasseroberfläche. Dort holt er Luft und nimmt sie unter seinen Flügeln mit nach unten. So hat er unter Wasser einen Luftvorrat. Auch die Mückenlarve holt sich Luft von oben. Sie hängt unter der Wasseroberfläche und atmet durch ein kleines Rohr."
            show: { object: mosquito }
          - text: "Fische und Kaulquappen atmen mit Kiemen.\nFrösche atmen mit Lungen und durch die Haut."
            say: "Fische und Kaulquappen atmen mit Kiemen. Damit holen sie die Luft direkt aus dem Wasser. Ein erwachsener Frosch hat keine Kiemen mehr, sondern Lungen. Er streckt die Nase aus dem Wasser, um zu atmen. Ein bisschen Luft nimmt er auch durch seine feuchte Haut auf."
            show: { object: fish }
          - text: "Die Libellenlarve lebt im Wasser. Dann klettert sie am Schilf hoch, und eine Libelle schlüpft."
            say: "Erinnerst du dich an die Libellenlarve? Sie lebt oft ein Jahr oder länger unter Wasser und jagt dort kleine Tiere. Eines Tages klettert sie an einem Schilfhalm aus dem Wasser. Ihre Haut platzt auf, und heraus kommt eine Libelle. Die leere Haut bleibt am Halm hängen."
          - text: "Algen → Mückenlarve → Libellenlarve → Fisch → Graureiher"
            say: "Auch im Teich gibt es Nahrungsketten. Winzige Algen werden von Mückenlarven gefressen. Die Mückenlarven werden von Libellenlarven gefressen, die Libellenlarven von Fischen, und die Fische vom Graureiher."
          - text: "Im Winter friert der Teich oben zu. Darunter bleibt Wasser.\n\nGeh nur auf Eis, das offiziell freigegeben ist!"
            say: "Im Winter friert der Teich oben zu. Wenn er tief genug ist, bleibt unter dem Eis Wasser. Dort ruhen die Fische am Grund. Manche Frösche überwintern im Schlamm am Boden des Teichs, andere an Land unter Laub. Und für dich gilt: Geh nie auf das Eis eines Teichs, wenn es nicht offiziell freigegeben ist. Es kann einbrechen, auch wenn es dick aussieht."
          - text: "Wusstest du? Die Wasserspinne wohnt unter Wasser in einer Luftblase."
            say: "Wusstest du? Es gibt eine Spinne, die unter Wasser lebt: die Wasserspinne. Sie spinnt zwischen den Wasserpflanzen ein Netz wie eine kleine Glocke und füllt es mit Luft von der Oberfläche. In dieser Luftblase wohnt sie."
            show: { object: spider }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie bekommt der Gelbrandkäfer unter Wasser Luft?"
                options: ["Er holt Luft an der Oberfläche und nimmt sie unter den Flügeln mit.", "Er atmet mit Kiemen wie ein Fisch.", "Er braucht keine Luft."]
                answer: "Er holt Luft an der Oberfläche und nimmt sie unter den Flügeln mit."
                hints:
                  - "Der Gelbrandkäfer hat keine Kiemen."
                  - "Er schwimmt immer wieder nach oben."
                  - "Er nimmt einen Luftvorrat unter den Flügeln mit."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Wie atmet das Tier? Sortiere."
                bins:
                  - { id: gills, show: { text: "mit Kiemen im Wasser" }, say: "mit Kiemen im Wasser" }
                  - { id: air, show: { text: "holt Luft von oben" }, say: "holt Luft von oben" }
                options:
                  - { object: fish, bin: gills }
                  - { text: "Kaulquappe", bin: gills }
                  - { text: "Gelbrandkäfer", bin: air }
                  - { text: "Mückenlarve", bin: air }
                hints:
                  - "Nur manche Tiere im Teich haben Kiemen."
                  - "Fische und Kaulquappen haben Kiemen. Käfer und Mückenlarven nicht."
                  - "Fisch und Kaulquappe: Kiemen. Gelbrandkäfer und Mückenlarve: Luft von oben."
              - id: l2-f3
                type: ordering
                text: "Wie wird aus der Libellenlarve eine Libelle? Bring es in die richtige Reihenfolge."
                options: ["Die Haut platzt auf, und die Libelle schlüpft.", "Die Larve lebt unter Wasser und jagt.", "Die Larve klettert am Schilf aus dem Wasser."]
                slot_count: 3
                answer: ["Die Larve lebt unter Wasser und jagt.", "Die Larve klettert am Schilf aus dem Wasser.", "Die Haut platzt auf, und die Libelle schlüpft."]
                option_audio: false
                hints:
                  - "Die Libelle beginnt ihr Leben im Wasser."
                  - "Bevor die Haut aufplatzt, muss die Larve aus dem Wasser."
                  - "Unter Wasser jagen, am Schilf hochklettern, schlüpfen."
              - id: l2-f4
                type: true_false
                text: "Ein erwachsener Frosch hat Kiemen wie eine Kaulquappe. Stimmt das?"
                answer: false
                hints:
                  - "Beim Frosch verändert sich viel, wenn er groß wird."
                  - "Die Kaulquappe hat Kiemen. Der Frosch streckt die Nase aus dem Wasser."
                  - "Nein, der erwachsene Frosch hat Lungen."
              - id: l2-f5
                type: fill_in_blank
                text: "Ergänze die Nahrungskette im Teich."
                say: "Algen, Pfeil, Mückenlarve, Pfeil, Lücke, Pfeil, Fisch. Wer frisst die Mückenlarve und wird vom Fisch gefressen?"
                frame: "Algen → Mückenlarve → _ → Fisch"
                options: ["Libellenlarve", "Seerose", "Graureiher"]
                answer: ["Libellenlarve"]
                hints:
                  - "In die Lücke gehört ein Tier, das selbst jagt."
                  - "Die Seerose ist eine Pflanze. Der Graureiher frisst den Fisch, nicht umgekehrt."
                  - "Die Libellenlarve."
              - id: l2-f6
                type: multiple_choice
                text: "Der Teich ist zugefroren. Ida sagt: „Das Eis sieht dick aus. Ich gehe drauf!“ Was ist richtig?"
                options: ["Nur auf Eis gehen, das offiziell freigegeben ist.", "Wenn das Eis dick aussieht, ist es sicher.", "Erst springen und testen, ob es hält."]
                answer: "Nur auf Eis gehen, das offiziell freigegeben ist."
                hints:
                  - "Eis kann einbrechen, auch wenn es dick aussieht."
                  - "Erwachsene prüfen und erlauben, ob man auf das Eis darf."
                  - "Nur auf freigegebenes Eis gehen."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Bau die Nahrungskette im Teich."
                options: [{ text: "Graureiher" }, { text: "Libellenlarve" }, { object: fish }]
                slot_count: 3
                answer: ["Libellenlarve", fish, "Graureiher"]
                hints: ["Der größte Jäger kommt ans Ende."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie atmet die Mückenlarve?"
                options: ["Sie hängt unter der Oberfläche und atmet durch ein kleines Rohr.", "Sie hat Kiemen wie ein Fisch.", "Sie fliegt zum Atmen aus dem Wasser."]
                answer: "Sie hängt unter der Oberfläche und atmet durch ein kleines Rohr."
                hints: ["Sie holt sich die Luft von oben, so wie der Gelbrandkäfer."]
