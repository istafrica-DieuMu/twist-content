# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.germany-landscapes
skill: world.space.germany-landscapes
curriculum: de-DE
language: de
title:
  de: Landschaften in Deutschland
  en: Landscapes of Germany
summary: >
  Kemal and his sister Defne travel with their father across Germany, from
  the North Sea down to the Alps. Lesson 1 finds that the land rises from
  north to south and names the four big landscapes in that order: Küste
  (beach, dunes, dykes, Ebbe und Flut), Tiefland (flat, below 200 m,
  fields, meadows and heath), Mittelgebirge (rounded hills up to about
  1500 m with much forest, such as the Harz and the Schwarzwald) and Alpen
  (the highest, rocky peaks, snow on the summits, only in Bayern); on a
  map green is low and brown is high, shown on the drawn map of Germany
  with its landscape bands. Lesson 2 sorts Kemal's four souvenirs, sets the
  North Sea (Watt, tides twice a day) against the Baltic (hardly any
  tide, chalk cliffs on Rügen), places the landscapes in Länder and towns
  (coast in Schleswig-Holstein, Niedersachsen and Mecklenburg-Vorpommern,
  Berlin and Hamburg in the Tiefland, the Lüneburger Heide, the Alps only
  in Bayern) and says how people use each. It ends with the skill check.
  The Alpenvorland is named once and not tested.
metadata:
  year: klasse-4
  topic: { de: Deutschland und die Welt, en: Germany and the world }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.space.germany-map]
  also_practises: [world.space.germany-map]
  vocabulary: { de: [Landschaft, Küste, Tiefland, Mittelgebirge, Alpen, Gipfel, Tal, Düne, Deich, Watt, Ebbe, Flut, Heide, Alm, Nordsee, Ostsee] }
  forms: [text, audio, picture, drawn]
  drawn: [germany-map]
  facets: []
  parts:
    - { id: features, what: { de: "die vier Landschaften an ihren Merkmalen erkennen", en: "recognising the four landscapes by their features" } }
    - { id: order, what: { de: "die Landschaften von Norden nach Süden ordnen und auf der Karte an der Farbe erkennen", en: "ordering the landscapes from north to south and reading them from a map's colours" } }
    - { id: places, what: { de: "Bundesländer, Orte und Gebirge einer Landschaft zuordnen", en: "placing Länder, towns and ranges in a landscape" } }
  misconceptions:
    - id: germany-all-flat-or-all-mountains
      what: Thinks Germany is the same everywhere, or that the mountains are in the north and the sea in the south
      addressed: "lesson 1 opens with the guess about the land rising and shows the landscape map; l1-f2, l1-s3, l1-s5 and l2-c8, l2-c10, l2-c13"
    - id: mittelgebirge-alps
      what: Takes every range of hills for the Alps, or thinks the Mittelgebirge are higher than the Alps
      addressed: "lesson 1 Learn sets the rounded, wooded Mittelgebirge against the rocky Alps; l1-s2, l1-n5, l2-n3 and l2-c2, l2-c16"
    - id: tides-everywhere
      what: Thinks every sea coast has strong tides and a Watt
      addressed: "lesson 2 Learn sets the North Sea against the Baltic; l2-f3, l2-f4 and l2-c18, with feedback on l2-c18"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Vom Meer bis in die Berge", en: "From the sea to the mountains" }
    goal:
      de: "Lerne die vier großen Landschaften Deutschlands kennen und bring sie in die richtige Reihenfolge, von der Küste bis zu den Alpen."
      en: "Get to know Germany's four big landscapes and put them in order, from the coast to the Alps."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Bundesland liegt ganz im Süden?"
            options: ["Bayern", "Schleswig-Holstein", "Bremen"]
            answer: "Bayern"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Schleswig-Holstein und Mecklenburg-Vorpommern liegen an der Ostsee. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Kemal fährt mit Papa und Defne von der Nordsee bis ganz in den Süden.\n\nWas glaubst du: Wird das Land unterwegs höher, tiefer oder bleibt es gleich?"
            say: "Kemal macht mit seinem Papa und seiner Schwester Defne eine große Reise. Sie starten an der Nordsee und fahren bis ganz in den Süden von Deutschland. Was glaubst du: Wird das Land unterwegs höher, wird es tiefer, oder bleibt es überall gleich?"
            show: { object: car }
          - text: "Es wird höher! Von Norden nach Süden:\nKüste\nTiefland\nMittelgebirge\nAlpen"
            say: "Es wird immer höher! Von Norden nach Süden gibt es in Deutschland vier große Landschaften. Zuerst die Küste am Meer. Dann das flache Tiefland. Dann das Mittelgebirge. Und ganz im Süden die Alpen."
            show: { drawn: germany-map, landscapes: true, seas: true }
          - text: "Küste: Strand, Dünen und Deiche.\nAn der Nordsee: Ebbe und Flut."
            say: "Die Reise beginnt an der Küste. Dort gibt es Strand, Dünen aus Sand und Deiche, die das Land vor dem Meer schützen. An der Nordsee geht das Wasser zweimal am Tag weg und kommt wieder. Wenn es weggeht, heißt das Ebbe. Wenn es zurückkommt, heißt das Flut."
            show: { object: shell }
          - text: "Tiefland: flach und tief, meist unter 200 Meter.\nFelder, Wiesen und Heide."
            say: "Dann kommt das Tiefland. Es ist flach, und es liegt tief, meist unter zweihundert Metern. Kemal sieht weite Felder und Wiesen mit Kühen. Manchmal fahren sie an einer Heide vorbei. Eine Heide ist flaches Land mit niedrigen Sträuchern, die im Spätsommer lila blühen."
            show: { object: wheat }
          - text: "Mittelgebirge: Berge mit runden Kuppen, bis etwa 1500 Meter, viel Wald.\nZum Beispiel: Harz, Schwarzwald"
            say: "In der Mitte und im Südwesten wird es hügelig. Das ist das Mittelgebirge. Die Berge haben runde Kuppen, und auf ihnen wächst viel Wald. Sie sind bis etwa fünfzehnhundert Meter hoch. Zwei Mittelgebirge heißen Harz und Schwarzwald. Kurz vor den Alpen wird das Land wieder flacher, mit vielen Seen. Das heißt Alpenvorland."
            show: { object: fir-tree }
          - text: "Alpen: die höchsten Berge, spitze Felsen, Schnee auf den Gipfeln.\nIn Deutschland nur ganz im Süden, in Bayern."
            say: "Ganz im Süden, in Bayern, sind die Alpen. Das sind die höchsten Berge. Sie haben spitze Felsen, und auf den Gipfeln liegt oft Schnee, manchmal sogar im Sommer. Hier steht auch der höchste Berg Deutschlands, die Zugspitze."
            show: { object: snow }
          - text: "Auf der Landkarte: Grün ist tiefes Land. Je höher, desto brauner."
            say: "Auf einer Landkarte erkennst du die Landschaften an der Farbe. Tiefes Land ist grün. Je höher das Land ist, desto mehr geht die Farbe ins Gelbe, Orange und Braun. Die höchsten Berge sind dunkelbraun. Das Meer ist blau."
            show: { drawn: germany-map, landscapes: true, seas: true }
          - text: "Wusstest du? An der Nordsee kannst du bei Ebbe auf dem Meeresboden spazieren gehen."
            say: "Wusstest du? An der Nordsee kannst du bei Ebbe auf dem Meeresboden spazieren gehen. Dieser Boden heißt Watt. Aber nur mit einer Führerin oder einem Führer, denn bei Flut kommt das Wasser schnell zurück."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Landschaft liegt ganz im Süden?"
                show: { drawn: germany-map, landscapes: true, seas: true }
                options: ["die Alpen", "die Küste", "das Tiefland"]
                answer: "die Alpen"
                hints:
                  - "Auf der Karte ist Norden oben. Wo ist dann Süden?"
                  - "Schau ganz nach unten auf die Karte. Welcher Name steht dort?"
                  - "Ganz unten steht Alpen. Ganz im Süden liegen die Alpen."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Bring die Landschaften in die Reihenfolge von Norden nach Süden."
                options: ["Mittelgebirge", "Küste", "Alpen", "Tiefland"]
                slot_count: 4
                answer: ["Küste", "Tiefland", "Mittelgebirge", "Alpen"]
                hints:
                  - "Kemals Reise beginnt am Meer."
                  - "Nach dem Meer kommt flaches Land, dann wird es immer höher."
                  - "Küste, Tiefland, Mittelgebirge, Alpen."
              - id: l1-f3
                type: image_multiple_choice
                text: "Kemal ist an der Küste. Was findet er am Strand?"
                options: [{ object: shell }, { object: giraffe }, { object: eiffel-tower }]
                answer: shell
                feedback:
                  giraffe: "Eine Giraffe am Nordseestrand? Die wohnt in Afrika! Am Strand findet Kemal Muscheln."
                hints:
                  - "Was spült das Meer an den Strand?"
                  - "Es ist klein, hart und war früher das Haus eines Meerestiers."
                  - "Eine Muschel."
              - id: l1-f4
                type: true_false
                text: "Im Tiefland ist das Land flach. Stimmt das?"
                answer: true
                hints:
                  - "Denk an die weiten Felder, die Kemal sieht."
                  - "Das Tiefland liegt tief, meist unter 200 Metern."
                  - "Ja, das Tiefland ist flach."
              - id: l1-f5
                type: matching
                text: "Was passt zu welcher Landschaft? Verbinde."
                pairs:
                  - { left: { text: "Küste" }, right: { text: "Strand, Dünen und Deiche" } }
                  - { left: { text: "Tiefland" }, right: { text: "flach, weite Felder" } }
                  - { left: { text: "Mittelgebirge" }, right: { text: "runde Berge mit viel Wald" } }
                  - { left: { text: "Alpen" }, right: { text: "hohe, spitze Felsen mit Schnee" } }
                hints:
                  - "Fang mit dem Meer an."
                  - "Rund und bewaldet ist das Mittelgebirge, spitz und hoch sind die Alpen."
                  - "Küste Strand, Tiefland flach, Mittelgebirge Wald, Alpen Felsen."
              - id: l1-f6
                type: multiple_choice
                text: "Wo geht das Wasser zweimal am Tag weg und kommt wieder?"
                options: ["an der Nordsee", "im Schwarzwald", "in den Alpen"]
                answer: "an der Nordsee"
                hints:
                  - "Das Wasser, das weggeht und kommt, ist Meerwasser."
                  - "Das heißt Ebbe und Flut. Wo ist ein Meer?"
                  - "An der Nordsee."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Küste oder Alpen? Sortiere."
                bins:
                  - { id: kueste, show: { text: "Küste" }, say: "Küste" }
                  - { id: alpen, show: { text: "Alpen" }, say: "Alpen" }
                options:
                  - { text: "Dünen aus Sand", bin: kueste }
                  - { text: "Gipfel mit Schnee", bin: alpen }
                  - { text: "ein Deich", bin: kueste }
                  - { text: "steile, spitze Felsen", bin: alpen }
                hints: ["An der Küste ist das Meer, in den Alpen die höchsten Berge."]
              - id: l1-s2
                type: multiple_choice
                text: "Kemal sieht Berge mit runden Kuppen, und überall wächst Wald. Wo ist er?"
                options: ["im Mittelgebirge", "an der Küste", "im Tiefland"]
                answer: "im Mittelgebirge"
                hints: ["An der Küste und im Tiefland ist es flach."]
              - id: l1-s3
                type: true_false
                text: "Die Alpen liegen ganz im Norden von Deutschland. Stimmt das?"
                answer: false
                hints: ["Im Norden ist das Meer. Wo sind dann die höchsten Berge?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Im Tiefland fährt Kemal an weiten Feldern vorbei. Was wächst dort?"
                options: [{ object: wheat }, { object: shell }, { object: fish }]
                answer: wheat
                hints: ["Auf Feldern baut die Bäuerin etwas an, aus dem man Mehl macht."]
              - id: l1-s5
                type: ordering
                text: "Kemal fährt zurück, von den Alpen nach Norden. Bring die Landschaften in die Reihenfolge der Rückfahrt."
                options: ["Tiefland", "Alpen", "Küste", "Mittelgebirge"]
                slot_count: 4
                answer: ["Alpen", "Mittelgebirge", "Tiefland", "Küste"]
                hints: ["Jetzt ist es umgekehrt: Er startet ganz oben in den Bergen."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Auf einer Landkarte ist ein Gebiet dunkelbraun. Was ist dort?"
                options: ["hohe Berge", "das Meer", "flaches, tiefes Land"]
                answer: "hohe Berge"
              - id: l1-n2
                type: true_false
                text: "Im Mittelgebirge wächst viel Wald. Stimmt das?"
                answer: true
              - id: l1-n3
                type: sorting
                text: "Tiefland oder Mittelgebirge? Sortiere."
                bins:
                  - { id: tief, show: { text: "Tiefland" }, say: "Tiefland" }
                  - { id: mittel, show: { text: "Mittelgebirge" }, say: "Mittelgebirge" }
                options:
                  - { text: "flaches Land, so weit man sieht", bin: tief }
                  - { text: "Berge mit runden Kuppen", bin: mittel }
                  - { text: "eine Heide mit niedrigen Sträuchern", bin: tief }
                  - { text: "Wälder auf den Bergen", bin: mittel }
              - id: l1-n4
                type: multiple_choice
                text: "Defne möchte auf den höchsten Bergen Deutschlands Ski fahren. Wohin fährt sie?"
                options: ["in die Alpen", "an die Ostsee", "ins Tiefland"]
                answer: "in die Alpen"
              - id: l1-n5
                type: text_input
                text: "Der höchste Berg im Schwarzwald ist 1493 m hoch. Die Zugspitze in den Alpen ist 2962 m hoch. Wie viele Meter ist die Zugspitze höher?"
                answer: "1469"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Landschaft liegt ganz im Norden?"
            options: ["die Küste", "die Alpen", "das Mittelgebirge"]
            answer: "die Küste"
          - id: l1-c2
            type: true_false
            text: "Die Alpen sind höher als das Mittelgebirge. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Welche Landschaft liegt zwischen dem Tiefland und den Alpen?"
            options: ["das Mittelgebirge", "die Küste", "die Nordsee"]
            answer: "das Mittelgebirge"
          - id: l1-c4
            type: true_false
            text: "An der Küste gibt es hohe, spitze Felsberge mit Schnee. Stimmt das?"
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Was passt zum Mittelgebirge?"
            options: [{ object: fir-tree }, { object: crab }, { object: ship }]
            answer: fir-tree
          - id: l1-c6
            type: multiple_choice
            text: "Was passiert bei Ebbe an der Nordsee?"
            options: ["Das Wasser geht weg.", "Das Wasser kommt zurück.", "Es fängt an zu schneien."]
            answer: "Das Wasser geht weg."

  - n: 2
    title: { de: "Vier Andenken", en: "Four souvenirs" }
    goal:
      de: "Ordne Orte, Tiere und Bundesländer der richtigen Landschaft zu. Das Watt zum Beispiel gehört zur Küste an der Nordsee."
      en: "Match places, animals and Länder to the right landscape. The Watt, for example, belongs to the North Sea coast."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "In welcher Landschaft sind die höchsten Berge?"
            options: ["in den Alpen", "im Tiefland", "an der Küste"]
            answer: "in den Alpen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Die Küste liegt ganz im Süden von Deutschland. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Kemal hat vier Andenken: eine Muschel, ein Heidezweig, ein Tannenzapfen und ein Stein von einem Gipfel über 2000 Meter.\n\nWas glaubst du: Woher kommt welches?"
            say: "Zu Hause packt Kemal seine Andenken aus: eine Muschel, einen Zweig aus der Heide, einen Tannenzapfen und einen Stein von einem Gipfel, der über zweitausend Meter hoch ist. Was glaubst du: Aus welcher Landschaft kommt welches Andenken?"
            show: { object: suitcase }
          - text: "Die Muschel kommt von der Küste.\nNordsee: Watt, Ebbe und Flut, Inseln\nOstsee: kaum Ebbe und Flut, Kreidefelsen auf der Insel Rügen\nKüste haben Schleswig-Holstein, Niedersachsen und Mecklenburg-Vorpommern."
            say: "Die Muschel kommt von der Küste. Deutschland hat zwei Meere. An der Nordsee gibt es Ebbe und Flut und das Watt, und davor liegen viele Inseln. An der Ostsee gibt es kaum Ebbe und Flut. Auf der Insel Rügen stehen weiße Kreidefelsen am Meer. Eine Küste haben Schleswig-Holstein, Niedersachsen und Mecklenburg-Vorpommern. Hier leben viele Menschen vom Fischfang, vom Hafen und von den Gästen."
            show: { drawn: germany-map, highlight: [schleswig-holstein, niedersachsen, mecklenburg-vorpommern], seas: true }
          - text: "Der Heidezweig kommt aus dem Tiefland, aus der Lüneburger Heide in Niedersachsen.\nAuch Berlin und Hamburg liegen im Tiefland."
            say: "Der Heidezweig kommt aus dem Tiefland. Kemal war in der Lüneburger Heide in Niedersachsen. Dort weiden Schafe zwischen den lila Sträuchern. Im Tiefland gibt es viele Bauernhöfe mit großen Feldern. Auch die großen Städte Berlin und Hamburg liegen im Tiefland."
            show: { object: sheep }
          - text: "Der Tannenzapfen kommt aus dem Mittelgebirge, aus dem Harz.\nMittelgebirge: Harz, Schwarzwald, Eifel, Erzgebirge"
            say: "Den Tannenzapfen hat Kemal im Harz gefunden. Der Harz ist ein Mittelgebirge in der Mitte von Deutschland. Andere Mittelgebirge heißen Schwarzwald, Eifel und Erzgebirge. Im Mittelgebirge wachsen große Wälder, und viele Menschen wandern dort. Im Winter kann man oft Schlitten fahren."
            show: { object: fir-tree }
          - text: "Der Stein kommt aus den Alpen, von der Zugspitze.\nDie Alpen gibt es in Deutschland nur in Bayern."
            say: "Der Stein kommt aus den Alpen. Nur dort gibt es in Deutschland Gipfel über zweitausend Meter, zum Beispiel die Zugspitze. Die deutschen Alpen liegen alle in Bayern. Im Sommer grasen Kühe hoch oben auf den Bergwiesen. So eine Bergwiese heißt Alm. Im Winter kommen viele Menschen zum Skifahren."
            show: { object: cow }
          - text: "Wusstest du? Die Alpen reichen durch acht Länder."
            say: "Wusstest du? Die Alpen gehören nicht nur zu Deutschland. Sie reichen durch acht Länder: Frankreich, Monaco, Italien, die Schweiz, Liechtenstein, Deutschland, Österreich und Slowenien."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Woher kommt welches Andenken? Verbinde."
                pairs:
                  - { left: { object: shell }, right: { text: "Küste" } }
                  - { left: { object: heather }, right: { text: "Tiefland" } }
                  - { left: { object: pine-cone }, right: { text: "Mittelgebirge" } }
                  - { left: { text: "Stein von einem Gipfel über 2000 Meter" }, right: { text: "Alpen" } }
                hints:
                  - "Fang mit der Muschel an. Wo ist das Meer?"
                  - "Gipfel über 2000 Meter gibt es nur in einer Landschaft."
                  - "Muschel Küste, Heide Tiefland, Harz Mittelgebirge, Gipfel Alpen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "In welchem Bundesland liegen die deutschen Alpen?"
                options: ["in Bayern", "in Schleswig-Holstein", "in Hessen"]
                answer: "in Bayern"
                hints:
                  - "Die Alpen liegen ganz im Süden."
                  - "Welches dieser Länder liegt ganz im Süden?"
                  - "In Bayern."
              - id: l2-f3
                type: true_false
                text: "An der Ostsee gibt es kaum Ebbe und Flut. Stimmt das?"
                answer: true
                hints:
                  - "Deutschland hat zwei Meere, und sie sind verschieden."
                  - "Ebbe und Flut und das Watt gehören zur Nordsee."
                  - "Ja, an der Ostsee gibt es kaum Ebbe und Flut."
              - id: l2-f4
                type: sorting
                text: "Nordsee oder Ostsee? Sortiere."
                bins:
                  - { id: nord, show: { text: "Nordsee" }, say: "Nordsee" }
                  - { id: ost, show: { text: "Ostsee" }, say: "Ostsee" }
                options:
                  - { text: "das Watt", bin: nord }
                  - { text: "Kreidefelsen auf Rügen", bin: ost }
                  - { text: "Ebbe und Flut zweimal am Tag", bin: nord }
                  - { text: "kaum Ebbe und Flut", bin: ost }
                hints:
                  - "An einem der beiden Meere geht das Wasser zweimal am Tag weg."
                  - "Das Watt gibt es nur dort, wo Ebbe ist."
                  - "Nordsee: Watt, Ebbe und Flut. Ostsee: Rügen, kaum Ebbe und Flut."
              - id: l2-f5
                type: multiple_choice
                text: "In welcher Landschaft liegt Berlin?"
                options: ["im Tiefland", "in den Alpen", "an der Nordsee"]
                answer: "im Tiefland"
                hints:
                  - "Um Berlin herum ist das Land flach."
                  - "Berlin liegt nicht am Meer und nicht in den Bergen."
                  - "Berlin liegt im Tiefland."
              - id: l2-f6
                type: image_multiple_choice
                text: "Wer grast im Sommer hoch oben auf der Alm in den Alpen?"
                options: [{ object: cow }, { object: crab }, { object: whale }]
                answer: cow
                feedback:
                  whale: "Ein Wal auf der Alm? Der bräuchte ein sehr großes Planschbecken! Auf der Alm grasen Kühe."
                hints:
                  - "Eine Alm ist eine Wiese hoch in den Bergen."
                  - "Welches Tier frisst Gras?"
                  - "Die Kuh."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ein Förster kümmert sich um große Wälder auf runden Bergen. In welcher Landschaft arbeitet er?"
                options: ["im Mittelgebirge", "an der Küste", "im Watt"]
                answer: "im Mittelgebirge"
                hints: ["Runde Berge mit viel Wald: Welche Landschaft ist das?"]
              - id: l2-s2
                type: sorting
                text: "Hat das Bundesland eine Küste? Sortiere."
                bins:
                  - { id: ja, show: { text: "mit Küste" }, say: "mit Küste" }
                  - { id: nein, show: { text: "ohne Küste" }, say: "ohne Küste" }
                options:
                  - { text: "Schleswig-Holstein", bin: ja }
                  - { text: "Hessen", bin: nein }
                  - { text: "Mecklenburg-Vorpommern", bin: ja }
                  - { text: "Thüringen", bin: nein }
                hints: ["Eine Küste haben nur Bundesländer im Norden, am Meer."]
              - id: l2-s3
                type: true_false
                text: "Der Schwarzwald ist ein Mittelgebirge. Stimmt das?"
                answer: true
                hints: ["Denk an die Mittelgebirge: Harz, Schwarzwald, Eifel, Erzgebirge."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Kemal läuft bei Ebbe mit einer Führerin durch das Watt. Welches Tier sieht er dort?"
                options: [{ object: crab }, { object: giraffe }, { object: elephant }]
                answer: crab
                hints: ["Im Watt leben kleine Tiere aus dem Meer."]
              - id: l2-s5
