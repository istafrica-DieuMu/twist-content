# Lesson set: Sachunterricht, Klasse 4. Hand-authored draft.
id: de-DE.world.first-aid
skill: world.body.first-aid
curriculum: de-DE
language: de
title:
  de: Erste Hilfe und Notruf
  en: First aid and the emergency call
summary: >
  First aid as German primary schools teach it, in two lessons with Jana.
  Lesson 1, on the class hiking day: stay calm, do not put yourself in
  danger (never run into the road), fetch an adult, stay with the hurt
  child and comfort them; anyone can help, children too. Small injuries:
  an adult cleans a graze and puts on a plaster, which keeps dirt out; a
  bump or an insect sting is cooled, the cool pack always wrapped in a
  cloth; a nosebleed means bending the head forwards, never back, with a
  cool wet cloth on the neck and the nostrils pressed together; a small
  burn goes under cool running water, not ice cold. Lesson 2, at the
  playground: a man has fallen off his bike and does not answer. That is
  an emergency, so the emergency number 112 is called (ambulance and
  fire brigade; 110 is the police); the call is free, and a child may
  call when no adult is there. The five W questions (Wo, Was, Wie viele,
  Welche Verletzungen, Warten auf Rückfragen), the caller's name first,
  and never hang up before the control centre does. The stabile
  Seitenlage is only recognised, not practised: a person who breathes but
  does not answer lies on the side, one leg bent, head tilted slightly
  back, so they can breathe; adults learn it in a first aid course. It
  ends with the skill check. No injury is shown; every picture is a
  helper, a phone, an ambulance or a glass of water.
metadata:
  year: klasse-4
  topic: { de: Helfen im Notfall, en: Helping in an emergency }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.body.heart-lungs, world.body.skeleton-muscles]
  also_practises: []
  vocabulary: { de: [erste Hilfe, Unfall, Notfall, Notruf, Rettungsdienst, Rettungswagen, Feuerwehr, Polizei, Leitstelle, Schürfwunde, Pflaster, Verbandskasten, Beule, Kühlpack, Nasenbluten, Verbrennung, W-Fragen, Rückfragen, stabile Seitenlage, trösten] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: help-steps, what: { de: "bei einem Unfall ruhig bleiben, auf sich achten, einen Erwachsenen holen, trösten und die stabile Seitenlage erkennen", en: "staying calm at an accident, keeping safe, fetching an adult, comforting, and recognising the recovery position" } }
    - { id: small-injuries, what: { de: "sagen, was bei kleinen Verletzungen hilft: Pflaster, kühlen, Nasenbluten, kleine Verbrennung", en: "saying what helps with small injuries: plaster, cooling, nosebleed, small burn" } }
    - { id: emergency-call, what: { de: "im Notfall die 112 wählen und mit den fünf W-Fragen sagen, was passiert ist", en: "calling 112 in an emergency and saying what has happened with the five W questions" } }
  misconceptions:
    - id: nosebleed-head-back
      what: Thinks you tilt the head back for a nosebleed
      addressed: "lesson 1 Learn says forwards, never back, and why; l1-f2, l1-s5, l1-n4, l1-c1 and l2-c7, l2-c12 test it, with feedback on l1-f2"
    - id: child-must-not-call
      what: Thinks a child must not call 112 or will get into trouble for calling in a real emergency
      addressed: "lesson 2 Learn says a child may call when no adult is there; l2-s2, l2-n5 and l2-c20 test it"
    - id: hang-up-fast
      what: Hangs up as soon as they have said what happened, instead of waiting for the control centre's questions
      addressed: "lesson 2 Learn ends the five W questions with Warten auf Rückfragen; l2-f3, l2-s3, l2-n4 and l2-c16 test it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Kleine Unfälle, schnelle Hilfe", en: "Small accidents, quick help" }
    goal:
      de: "Finde heraus, wie du bei einem kleinen Unfall hilfst: ruhig bleiben, einen Erwachsenen holen und trösten. Du lernst auch, was bei Nasenbluten hilft."
      en: "Find out how to help at a small accident: stay calm, fetch an adult and comfort. You also learn what helps with a nosebleed."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was macht dein Herz?"
            options: ["Es pumpt Blut durch den ganzen Körper.", "Es verdaut das Essen.", "Es bewegt die Knochen."]
            answer: "Es pumpt Blut durch den ganzen Körper."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Knochen leben. Nach einem Bruch können sie wieder heilen. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Die 4a macht einen Wandertag. Malik stolpert und schürft sich das Knie auf. Er weint.\n\nWas soll Jana als Erstes tun?"
            say: "Die Klasse 4a macht einen Wandertag. Auf dem Waldweg stolpert Malik über eine Wurzel und schürft sich das Knie auf. Er weint. Was glaubst du: Was soll Jana als Erstes tun? Schnell weglaufen, selbst irgendetwas machen, oder ruhig bleiben und Hilfe holen?"
          - text: "1. Ruhig bleiben.\n2. Einen Erwachsenen rufen.\n3. Bei Malik bleiben und ihn trösten."
            say: "Jana atmet tief durch und bleibt ruhig. Sie ruft laut nach Herrn Brandt, ihrem Lehrer. Dann bleibt sie bei Malik und tröstet ihn: Hilfe kommt gleich! Das ist schon erste Hilfe. Jeder kann helfen, auch Kinder."
            show: { object: teacher }
          - text: "Pass auch auf dich selbst auf. Lauf nie einfach auf die Straße, um zu helfen."
            say: "Wichtig ist auch: Bring dich nicht selbst in Gefahr. Wenn auf der Straße etwas passiert ist, läufst du nicht zwischen die Autos. Ruf lieber laut einen Erwachsenen."
          - text: "Schürfwunde: Ein Erwachsener macht sie sauber und klebt ein Pflaster darauf. Das Pflaster hält Schmutz fern."
            say: "Herr Brandt hat einen Verbandskasten dabei. Er macht die Schürfwunde vorsichtig mit sauberem Wasser sauber und klebt ein Pflaster darauf. Das Pflaster hält Schmutz von der Wunde fern. Jana darf ihm die Pflaster reichen."
            show: { object: plaster }
          - text: "Beule oder Insektenstich: kühlen.\nDas Kühlpack immer in ein Tuch wickeln, nie direkt auf die Haut."
            say: "Beim Picknick stößt sich Ida den Kopf an einem Ast. Sie bekommt eine Beule. Kühlen hilft, bei einer Beule und auch bei einem Insektenstich. Leg das Kühlpack aber nie direkt auf die Haut, sondern wickle es in ein Tuch. Sonst wird es zu kalt."
            show: { object: cool-pack }
          - text: "Nasenbluten: Kopf nach vorne beugen, nicht nach hinten!\nEin kühles, nasses Tuch in den Nacken legen."
            say: "Auf dem Rückweg bekommt Malik Nasenbluten. Viele denken, man soll den Kopf nach hinten legen. Das ist falsch, denn dann läuft das Blut in den Hals. Richtig ist: Malik beugt den Kopf nach vorne und drückt die Nasenflügel ein paar Minuten zusammen. Ein kühles, nasses Tuch im Nacken hilft auch."
            show: { object: nose }
          - text: "Kleine Verbrennung: gleich unter kühles, fließendes Wasser halten. Nicht eiskalt."
            say: "Und wenn sich jemand an etwas Heißem verbrennt, zum Beispiel zu Hause am Backblech? Halte die Stelle gleich unter kühles, fließendes Wasser, aber nicht eiskalt. Und sag es einem Erwachsenen."
            show: { object: water }
          - text: "Wusstest du? Das Zeichen des Roten Kreuzes ist die Flagge der Schweiz mit vertauschten Farben."
            say: "Wusstest du? Das Rote Kreuz hilft auf der ganzen Welt Menschen in Not. Sein Zeichen ist ein rotes Kreuz auf weißem Grund. Die Flagge der Schweiz ist ein weißes Kreuz auf rotem Grund. Das Rote Kreuz wurde in der Schweiz gegründet, darum hat man einfach die Farben ihrer Flagge vertauscht."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Ben ist vom Klettergerüst gefallen und weint. Was tust du? Bring es in die richtige Reihenfolge."
                options: ["Bei Ben bleiben und ihn trösten.", "Ruhig bleiben.", "Einen Erwachsenen rufen."]
                slot_count: 3
                answer: ["Ruhig bleiben.", "Einen Erwachsenen rufen.", "Bei Ben bleiben und ihn trösten."]
                option_audio: false
                hints:
                  - "Zuerst kommt etwas, das du mit dir selbst machst."
                  - "Erst wenn du ruhig bist, kannst du Hilfe holen."
                  - "Ruhig bleiben, einen Erwachsenen rufen, Ben trösten."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Lukas hat Nasenbluten. Was ist richtig?"
                options: ["den Kopf nach vorne beugen", "den Kopf nach hinten legen", "auf und ab hüpfen"]
                answer: "den Kopf nach vorne beugen"
                feedback:
                  "den Kopf nach hinten legen": "Dann läuft das Blut in den Hals. Bei Nasenbluten beugst du den Kopf nach vorne."
                  "auf und ab hüpfen": "Hüpfen? Dann wird es eher schlimmer! Lukas bleibt ruhig und beugt den Kopf nach vorne."
                hints:
                  - "Das Blut soll nicht in den Hals laufen."
                  - "Liegt der Kopf hinten, läuft das Blut nach hinten in den Hals."
                  - "Den Kopf nach vorne beugen."
              - id: l1-f3
                type: image_multiple_choice
                text: "Mia hat sich am heißen Backblech die Finger verbrannt. Was hilft sofort?"
                options: [{ object: water }, { object: book }, { object: teddy }]
                answer: water
                feedback:
                  teddy: "Der Teddy tröstet, aber er kühlt nicht. Halte die Finger unter kühles, fließendes Wasser."
                hints:
                  - "Eine Verbrennung muss schnell gekühlt werden."
                  - "Was ist kühl und fließt aus dem Wasserhahn?"
                  - "Kühles Wasser."
              - id: l1-f4
                type: true_false
                text: "Ein Kühlpack legt man direkt auf die Haut. Stimmt das?"
                show: { object: cool-pack }
                answer: false
                hints:
                  - "Ein Kühlpack ist sehr kalt."
                  - "Was wickelst du um das Kühlpack, damit es nicht zu kalt wird?"
                  - "Nein. Das Kühlpack kommt immer in ein Tuch."
              - id: l1-f5
                type: sorting
                text: "Was hilft? Sortiere."
                bins:
                  - { id: cool, show: { text: "kühlen" }, say: "kühlen" }
                  - { id: plaster, show: { text: "ein Pflaster" }, say: "ein Pflaster" }
                options:
                  - { text: "eine Beule am Kopf", bin: cool }
                  - { text: "ein Mückenstich", bin: cool }
                  - { text: "ein kleiner Kratzer am Arm", bin: plaster }
                  - { text: "eine Schürfwunde am Knie", bin: plaster }
                hints:
                  - "Ein Pflaster hält Schmutz von einer Wunde fern."
                  - "Bei welchen Verletzungen ist die Haut offen, bei welchen nicht?"
                  - "Beule und Mückenstich: kühlen. Kratzer und Schürfwunde: Pflaster."
              - id: l1-f6
                type: multiple_choice
                text: "Auf der Straße ist ein Kind vom Fahrrad gefallen. Autos fahren vorbei. Was tust du?"
                options: ["Ich rufe laut einen Erwachsenen, statt auf die Straße zu laufen.", "Ich renne sofort auf die Straße.", "Ich gehe einfach weiter."]
                answer: "Ich rufe laut einen Erwachsenen, statt auf die Straße zu laufen."
                hints:
                  - "Du sollst dich nicht selbst in Gefahr bringen."
                  - "Zwischen fahrenden Autos ist es gefährlich. Wer kann sicher helfen?"
                  - "Laut einen Erwachsenen rufen."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Auch Kinder können erste Hilfe leisten. Stimmt das?"
                answer: true
                hints: ["Ruhig bleiben, Hilfe holen und trösten kann jeder."]
              - id: l1-s2
                type: multiple_choice
                text: "Elif hat eine Beule am Kopf. Was hilft?"
                options: ["ein Kühlpack, in ein Tuch gewickelt", "ein Pflaster auf die Beule", "warmes Wasser"]
                answer: "ein Kühlpack, in ein Tuch gewickelt"
                hints: ["Eine Beule wird gekühlt, aber nie zu kalt."]
              - id: l1-s3
                type: matching
                text: "Was hilft? Verbinde."
                pairs:
                  - { left: { text: "Nasenbluten" }, right: { text: "den Kopf nach vorne beugen" } }
                  - { left: { text: "kleine Verbrennung" }, right: { text: "unter kühles Wasser halten" } }
                  - { left: { text: "Schürfwunde" }, right: { text: "sauber machen und ein Pflaster" } }
                  - { left: { text: "Insektenstich" }, right: { text: "kühlen" } }
                hints: ["Bei offener Haut hilft ein Pflaster. Bei Nasenbluten kommt es auf den Kopf an."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Paul ist auf dem Schulhof hingefallen. Wen holt Ole?"
                options: [{ object: teacher }, { object: baby }, { object: dog }]
                answer: teacher
                hints: ["Ole holt einen Erwachsenen, der helfen kann."]
              - id: l1-s5
                type: true_false
                text: "Bei Nasenbluten legt man den Kopf nach hinten. Stimmt das?"
                answer: false
                hints: ["Wohin läuft das Blut, wenn der Kopf hinten liegt?"]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Richtig oder falsch bei erster Hilfe? Sortiere."
                bins:
                  - { id: right, show: { text: "richtig" }, say: "richtig" }
                  - { id: wrong, show: { text: "falsch" }, say: "falsch" }
                options:
                  - { text: "ruhig bleiben", bin: right }
                  - { text: "das Kind trösten", bin: right }
                  - { text: "das verletzte Kind allein lassen", bin: wrong }
                  - { text: "Eis direkt auf die Haut legen", bin: wrong }
              - id: l1-n2
                type: multiple_choice
                text: "Ein Kind hat einen Wespenstich am Arm. Was hilft?"
                options: ["kühlen und einem Erwachsenen Bescheid sagen", "fest reiben", "warmes Wasser darübergießen"]
                answer: "kühlen und einem Erwachsenen Bescheid sagen"
              - id: l1-n3
                type: ordering
                text: "Lina sieht, dass Max sich wehgetan hat. Bring es in die richtige Reihenfolge."
                options: ["Max trösten, bis Frau Özdemir da ist.", "Frau Özdemir rufen.", "Tief durchatmen und ruhig bleiben."]
                slot_count: 3
                answer: ["Tief durchatmen und ruhig bleiben.", "Frau Özdemir rufen.", "Max trösten, bis Frau Özdemir da ist."]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Bei Nasenbluten hilft ein kühles, nasses Tuch im Nacken. Stimmt das?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Warum ist ein Pflaster auf einer Schürfwunde gut?"
                show: { object: plaster }
                options: ["Es hält Schmutz von der Wunde fern.", "Es macht die Wunde unsichtbar.", "Es kühlt die Wunde."]
                answer: "Es hält Schmutz von der Wunde fern."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wohin beugst du bei Nasenbluten den Kopf?"
            options: ["nach vorne", "nach hinten", "zur Seite"]
            answer: "nach vorne"
          - id: l1-c2
            type: true_false
            text: "Wenn sich jemand verletzt, holst du einen Erwachsenen. Stimmt das?"
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Was hilft bei einer kleinen Verbrennung?"
            options: [{ object: water }, { object: sun }, { object: cake }]
            answer: water
          - id: l1-c4
            type: multiple_choice
            text: "Wie legst du ein Kühlpack auf eine Beule?"
            show: { object: cool-pack }
            options: ["in ein Tuch gewickelt", "direkt auf die Haut", "gar nicht, eine Beule kühlt man nicht"]
            answer: "in ein Tuch gewickelt"
          - id: l1-c5
            type: true_false
            text: "Eine kleine Verbrennung kühlt man am besten mit Eis direkt auf der Haut. Stimmt das?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Was tust du zuerst, wenn ein Unfall passiert?"
            options: ["ruhig bleiben", "weglaufen", "laut lachen"]
            answer: "ruhig bleiben"

  - n: 2
    title: { de: "Den Notruf wählen", en: "Making the emergency call" }
    goal:
      de: "Lerne, wie du im Notfall den Notruf wählst und mit den fünf W-Fragen sagst, was passiert ist."
      en: "Learn how to make the emergency call and say what has happened with the five W questions."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was hilft bei einem Mückenstich?"
            options: ["kühlen", "ein warmes Bad", "kratzen"]
            answer: "kühlen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Bei einem Unfall bleibst du ruhig und holst einen Erwachsenen. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Auf dem Spielplatz liegt ein Mann neben seinem Fahrrad. Er ist gestürzt, hat die Augen zu und antwortet nicht.\n\nWas ist jetzt das Wichtigste?"
            say: "Jana und ihre Mama gehen am Spielplatz vorbei. Da liegt ein Mann neben seinem Fahrrad. Er ist gestürzt. Er hat die Augen zu und antwortet nicht, als Mama ihn anspricht. Was glaubst du: Was ist jetzt das Wichtigste?"
            show: { object: bike }
          - text: "Das ist ein Notfall. Jetzt muss schnell Hilfe kommen: Notruf 112.\nDer Anruf kostet nichts. Ist kein Erwachsener da, rufst du selbst an."
            say: "Das ist ein Notfall. Jetzt muss schnell der Rettungsdienst kommen. Mama ruft sofort die eins, eins, zwei an. Die eins, eins, zwei ist der Notruf. Der Anruf kostet nichts, auch nicht vom Handy. Wenn kein Erwachsener da ist, darfst und sollst du selbst anrufen."
            show: { object: mobile-phone }
          - text: "112: Rettungsdienst und Feuerwehr\n110: Polizei"
            say: "Merk dir zwei Nummern. Die eins, eins, zwei holt den Rettungswagen und die Feuerwehr, zum Beispiel wenn jemand schwer verletzt ist oder wenn es brennt. Die eins, eins, null holt die Polizei, zum Beispiel wenn jemand etwas stiehlt."
            show: { object: ambulance }
          - text: "Die fünf W-Fragen:\nWo ist es passiert?\nWas ist passiert?\nWie viele Verletzte gibt es?\nWelche Verletzungen haben sie?\nWarten auf Rückfragen!"
            say: "Am Telefon meldet sich die Leitstelle. Sag zuerst deinen Namen. Dann helfen dir die fünf W-Fragen. Wo ist es passiert? Was ist passiert? Wie viele Menschen sind verletzt? Welche Verletzungen haben sie? Und das Wichtigste: Warten auf Rückfragen. Leg nicht einfach auf! Die Leitstelle fragt nach, und sie beendet das Gespräch."
          - text: "Mama sagt ihren Namen. Dann:\nWo? Am Spielplatz in der Gartenstraße.\nWas? Ein Mann ist vom Fahrrad gestürzt.\nWie viele? Ein Verletzter.\nWelche Verletzungen? Er atmet, aber er antwortet nicht.\nDann wartet sie."
            say: "Hör mal, wie Mama es macht. Sie sagt ihren Namen. Dann sagt sie, wo es passiert ist: am Spielplatz in der Gartenstraße. Was passiert ist: Ein Mann ist vom Fahrrad gestürzt. Wie viele verletzt sind: einer. Und welche Verletzungen er hat: Er atmet, aber er antwortet nicht. Dann wartet sie und beantwortet die Fragen der Leitstelle."
          - text: "Stabile Seitenlage: Der Mensch liegt auf der Seite, ein Bein ist angewinkelt, der Kopf leicht nach hinten geneigt. So bekommt er gut Luft."
            say: "Bis der Rettungswagen kommt, dreht Mama den Mann vorsichtig auf die Seite. Das heißt stabile Seitenlage. Ein Bein ist angewinkelt, damit er nicht umkippt, und der Kopf ist leicht nach hinten geneigt. So bekommt jemand, der atmet, aber nicht antwortet, gut Luft. Erwachsene lernen das in einem Erste-Hilfe-Kurs. Du hilfst, indem du einen Erwachsenen holst und den Notruf wählst."
          - text: "Wusstest du? Die 112 ist in allen Ländern der EU der Notruf."
            say: "Wusstest du? Die eins, eins, zwei ist nicht nur in Deutschland der Notruf. Sie gilt in allen Ländern der Europäischen Union, zum Beispiel auch im Urlaub in Italien oder in Spanien. Darum gibt es jedes Jahr am elften Februar den Europäischen Tag des Notrufs: elf, zwei, so wie eins, eins, zwei."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Jemand ist schwer verletzt und braucht einen Rettungswagen. Welche Nummer rufst du an?"
                say: "Jemand ist schwer verletzt und braucht einen Rettungswagen. Welche Nummer rufst du an? Eins, eins, zwei, eins, eins, null, oder neun, eins, eins?"
                options: ["112", "110", "911"]
                answer: "112"
                option_audio: false
                feedback:
                  "911": "Die 911 kennst du vielleicht aus Filmen. Das ist der Notruf in Amerika. Bei uns wählst du die 112."
                  "110": "Die 110 holt die Polizei. Für den Rettungswagen wählst du die 112."
                hints:
                  - "Es gibt eine Nummer für den Rettungsdienst und die Feuerwehr und eine für die Polizei."
                  - "Die Polizei ist die eins, eins, null. Und der Rettungswagen?"
                  - "Die eins, eins, zwei."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Bring die fünf W-Fragen in die richtige Reihenfolge."
                options: ["Was ist passiert?", "Warten auf Rückfragen!", "Wo ist es passiert?", "Welche Verletzungen?", "Wie viele Verletzte?"]
                slot_count: 5
                answer: ["Wo ist es passiert?", "Was ist passiert?", "Wie viele Verletzte?", "Welche Verletzungen?", "Warten auf Rückfragen!"]
                option_audio: false
                hints:
                  - "Zuerst muss der Rettungswagen wissen, wohin er fahren soll."
                  - "Nach dem Ort kommt, was passiert ist. Das Warten kommt ganz zum Schluss."
                  - "Wo, Was, Wie viele, Welche Verletzungen, Warten."
              - id: l2-f3
                type: true_false
                text: "Wenn du alles gesagt hast, legst du sofort auf. Stimmt das?"
                answer: false
                hints:
                  - "Die letzte W-Frage heißt: Warten auf Rückfragen."
                  - "Wer beendet das Gespräch?"
                  - "Nein. Du wartest, bis die Leitstelle das Gespräch beendet."
              - id: l2-f4
                type: image_multiple_choice
                text: "Du rufst die 112 an, weil jemand schwer verletzt ist. Wer kommt?"
                say: "Du rufst die eins, eins, zwei an, weil jemand schwer verletzt ist. Wer kommt?"
                options: [{ object: ambulance }, { object: taxi }, { object: bus }]
                answer: ambulance
                feedback:
                  taxi: "Ein Taxi kann nicht helfen. Der Rettungswagen bringt Hilfe und kann den Verletzten ins Krankenhaus fahren."
                hints:
                  - "Es kommt ein Fahrzeug mit Sanitätern."
                  - "Es hat ein Blaulicht und bringt Verletzte ins Krankenhaus."
                  - "Der Krankenwagen."
              - id: l2-f5
                type: sorting
                text: "112 oder 110? Sortiere."
                say: "Eins, eins, zwei oder eins, eins, null? Sortiere."
