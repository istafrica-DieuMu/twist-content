# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.gap-words
skill: lit-de.spelling.gap-words
curriculum: de-DE
language: de
title:
  de: Lückenwörter
  en: Gap words
summary: >
  Children fill the gaps in words and build words from syllables and
  letters. Lesson 1 fills one missing letter or letter group, including
  the ones that are one sound but more letters (sch, ei, au, ch, eu): Fi_
  becomes Fisch. Lesson 2 builds words from syllable cards with one card
  too many and from letter cards, and ends with the skill check. The
  strategy is always the same: say the word slowly and listen where the
  gap is.
metadata:
  year: klasse-1
  topic: { de: Erste Wörter schreiben, en: Writing first words }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.spelling.write-by-sound]
  also_practises: [lit-de.spelling.write-by-sound, lit-de.decoding.two-syllable-words]
  vocabulary: { de: [Lücke, Lückenwort, Silbe, Buchstabe, mitsprechen] }
  forms: [picture, drawn, audio]
  drawn: [word-card]
  facets: []
  misconceptions:
    - id: one-letter-per-sound
      what: Thinks every sound is one letter, so writes s for sch or a for au (Fis, Hs)
      addressed: "lesson 1 Learn shows sch as three letters for one sound; chips in l1-f1, l1-s2 and l1-n2 offer the single-letter choice, with feedback on l1-f1"
    - id: gap-position
      what: Fills the gap with the sound from the wrong part of the word (the first sound for a gap in the middle)
      addressed: "gaps move between start, middle and end; hints say the word in syllables and point to the syllable with the gap"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was fehlt?", en: "What is missing?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Nase. Welcher Buchstabe fehlt?"
            show: { object: nose }
            frame: "Na_e"
            options: ["s", "m", "t"]
            answer: ["s"]
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Leg das Wort."
            say: "Oma. Leg die Buchstaben."
            show: { object: grandma }
            options: ["a", "m", "O"]
            slot_count: 3
            answer: ["O", "m", "a"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Fi_"
            say: "Hier fehlt etwas am Ende. Sprich mit: Fi ... sch. Der letzte Laut ist sch."
            show: { object: fish }
          - text: "sch"
            say: "Sch ist ein Laut, aber drei Buchstaben: s, c, h. In die Lücke kommt alles zusammen."
            show: { drawn: word-card, text: "Fisch" }
          - text: "H_s"
            say: "Auch au ist ein Laut mit zwei Buchstaben: H ... au ... s. Haus."
            show: { object: house }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Tisch. Was fehlt?"
                show: { object: table }
                frame: "Ti_"
                options: ["s", "sch", "ch"]
                answer: ["sch"]
                feedback:
                  s: "Dann stünde da Tis. Du hörst aber sch am Ende, und sch hat drei Buchstaben."
                hints:
                  - "Sprich das Wort langsam bis zum Ende."
                  - "Ti ... sch. Der letzte Laut ist sch."
                  - "Es fehlt sch."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Maus. Was fehlt?"
                show: { object: mouse }
                frame: "M_s"
                options: ["a", "au", "u"]
                answer: ["au"]
                hints:
                  - "Sprich langsam: Mmm ... au ... sss."
                  - "Der Laut in der Mitte ist au."
                  - "Au: zwei Buchstaben, a und u."
              - id: l1-f3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Bein. Was fehlt?"
                show: { object: leg }
                frame: "B_n"
                options: ["ei", "e", "au"]
                answer: ["ei"]
                hints:
                  - "Sprich langsam: B ... ei ... nnn."
                  - "In der Mitte hörst du ei."
                  - "Es fehlt ei."
              - id: l1-f4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Hose. Welcher Buchstabe fehlt?"
                show: { object: trousers }
                frame: "_ose"
                options: ["R", "H", "D"]
                answer: ["H"]
                hints:
                  - "Die Lücke ist ganz vorne. Hör auf den ersten Laut."
                  - "Hhh ... ose. Ein Hauch am Anfang."
                  - "Es fehlt das H."
              - id: l1-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Milch. Was fehlt?"
                show: { object: milk }
                frame: "Mil_"
                options: ["ch", "sch", "k"]
                answer: ["ch"]
                hints:
                  - "Sprich das Wort langsam bis zum Ende."
                  - "Mil ... ch. Es klingt wie bei ich, nicht wie bei Tisch."
                  - "Es fehlt ch."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Eis. Was fehlt?"
                show: { object: ice-cream }
                frame: "_s"
                options: ["E", "Ei", "Au"]
                answer: ["Ei"]
                hints: ["Ei ... sss."]
              - id: l1-s2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Schuh. Was fehlt?"
                show: { object: shoe }
                frame: "_uh"
                options: ["S", "Sch", "Ch"]
                answer: ["Sch"]
                hints: ["Sch ... uh. Der erste Laut ist sch."]
              - id: l1-s3
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Igel. Welcher Buchstabe fehlt?"
                show: { object: hedgehog }
                frame: "I_el"
                options: ["g", "k", "l"]
                answer: ["g"]
                hints: ["I ... gel. Die zweite Silbe fängt mit g an."]
              - id: l1-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Baum. Was fehlt?"
                show: { object: tree }
                frame: "B_m"
                options: ["au", "a", "ei"]
                answer: ["au"]
                hints: ["B ... au ... mmm."]
              - id: l1-s5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Eule. Was fehlt?"
                frame: "_le"
                options: ["Eu", "Ei", "E"]
                answer: ["Eu"]
                hints: ["Eu ... le. Eu klingt wie oi."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Schwein. Was fehlt?"
                show: { object: pig }
                frame: "Schw_n"
                options: ["ei", "au", "e"]
                answer: ["ei"]
              - id: l1-n2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Fisch. Was fehlt?"
                show: { object: fish }
                frame: "Fi_"
                options: ["sch", "s", "ch"]
                answer: ["sch"]
              - id: l1-n3
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Rose. Welcher Buchstabe fehlt?"
                show: { object: rose }
                frame: "Ro_e"
                options: ["s", "t", "n"]
                answer: ["s"]
              - id: l1-n4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Haus. Was fehlt?"
                show: { object: house }
                frame: "H_s"
                options: ["ei", "au", "a"]
                answer: ["au"]
              - id: l1-n5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Wolke. Welcher Buchstabe fehlt?"
                show: { object: cloud }
                frame: "_olke"
                options: ["W", "F", "B"]
                answer: ["W"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Bein. Was fehlt?"
            show: { object: leg }
            frame: "B_n"
            options: ["au", "ei"]
            answer: ["ei"]
          - id: l1-c2
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Tasche. Was fehlt?"
            frame: "Ta_e"
            options: ["s", "sch", "ch"]
            answer: ["sch"]
          - id: l1-c3
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Nudel. Welcher Buchstabe fehlt?"
            frame: "Nu_el"
            options: ["d", "t", "b"]
            answer: ["d"]

  - n: 2
    title: { de: Wörter bauen, en: Building words }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Maus. Was fehlt?"
            show: { object: mouse }
            frame: "M_s"
            options: ["au", "ei"]
            answer: ["au"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Tisch. Was fehlt?"
            show: { object: table }
            frame: "Ti_"
            options: ["sch", "s"]
            answer: ["sch"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ba  ne  na  Ro"
            say: "Hier liegen Silbenkarten. Eine passt nicht. Wir bauen Banane: Ba ... na ... ne."
            show: { drawn: word-card, text: "Ba ne na Ro" }
          - text: "Banane"
            say: "Erst Ba, dann na, dann ne. Ro brauchen wir nicht. Lies zum Schluss nach: Banane."
            show: { object: banana }
          - text: "Hut"
            say: "Mit Buchstaben geht es genauso. Sprich mit und leg einen Buchstaben für jeden Laut: H ... u ... t."
            show: { object: hat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Bau das Wort."
                say: "Tomate. Bau das Wort aus den Silben. Eine Silbe passt nicht."
                options: ["ma", "te", "To", "ne"]
                slot_count: 3
                answer: ["To", "ma", "te"]
                hints:
                  - "Sprich das Wort langsam: To ... ma ... te."
                  - "Welche Silbe hörst du gar nicht?"
                  - "To, ma, te. Ne passt nicht."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Leg das Wort."
                say: "Hut. Leg die Buchstaben."
                show: { object: hat }
                options: ["t", "H", "u"]
                slot_count: 3
                answer: ["H", "u", "t"]
                hints:
                  - "Sprich mit: H ... u ... t."
                  - "Ein Hauch am Anfang."
                  - "H, u, t."
              - id: l2-f3
                type: ordering
                text: "Bau das Wort."
                say: "Rakete. Bau das Wort aus den Silben. Eine Silbe passt nicht."
                options: ["te", "Ra", "ke", "ka"]
                slot_count: 3
                answer: ["Ra", "ke", "te"]
                hints:
                  - "Sprich langsam: Ra ... ke ... te."
                  - "Ke oder ka? Hör auf die Mitte."
                  - "Ra, ke, te."
              - id: l2-f4
                type: fill_in_blank
                text: "Welche Silben fehlen?"
                say: "Banane. Welche Silben fehlen?"
                show: { object: banana }
                frame: "Ba_ _"
                options: ["na", "ne", "no"]
                answer: ["na", "ne"]
                hints:
                  - "Sprich das Wort Silbe für Silbe."
                  - "Ba ... na ... ne."
                  - "Erst na, dann ne."
              - id: l2-f5
                type: ordering
                text: "Leg das Wort."
                say: "Eis. Leg die Buchstaben."
                show: { object: ice-cream }
                options: ["s", "i", "E"]
                slot_count: 3
                answer: ["E", "i", "s"]
                hints:
                  - "Ei ist ein Laut mit zwei Buchstaben."
                  - "Erst E und i, dann s."
                  - "E, i, s."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Bau das Wort."
                say: "Giraffe. Bau das Wort aus den Silben. Eine Silbe passt nicht."
                show: { object: giraffe }
                options: ["fe", "Gi", "raf", "ro"]
                slot_count: 3
                answer: ["Gi", "raf", "fe"]
                hints: ["Gi ... raf ... fe."]
              - id: l2-s2
                type: ordering
                text: "Leg das Wort."
                say: "Hase. Leg die Buchstaben."
                show: { object: rabbit }
                options: ["e", "s", "H", "a"]
                slot_count: 4
                answer: ["H", "a", "s", "e"]
                hints: ["H ... a ... s ... e."]
              - id: l2-s3
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Schule. Welche Silbe fehlt?"
                frame: "_le"
                options: ["Schu", "Su", "Scha"]
                answer: ["Schu"]
                hints: ["Schu ... le."]
              - id: l2-s4
                type: ordering
                text: "Bau das Wort."
                say: "Melone. Bau das Wort aus den Silben. Eine Silbe passt nicht."
                options: ["lo", "ne", "Me", "Ma"]
                slot_count: 3
                answer: ["Me", "lo", "ne"]
                hints: ["Me ... lo ... ne."]
              - id: l2-s5
                type: ordering
                text: "Leg das Wort."
                say: "Mund. Leg die Buchstaben."
                show: { object: mouth }
                options: ["d", "u", "M", "n"]
                slot_count: 4
                answer: ["M", "u", "n", "d"]
                hints: ["Mmm ... u ... nnn ... d."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Bau das Wort."
                say: "Ameise. Bau das Wort aus den Silben. Eine Silbe passt nicht."
                show: { object: ant }
                options: ["se", "A", "mei", "mau"]
                slot_count: 3
                answer: ["A", "mei", "se"]
              - id: l2-n2
                type: ordering
                text: "Leg das Wort."
                say: "Bus. Leg die Buchstaben."
                show: { object: bus }
                options: ["s", "u", "B"]
                slot_count: 3
                answer: ["B", "u", "s"]
              - id: l2-n3
                type: fill_in_blank
                text: "Welche Silben fehlen?"
                say: "Telefon. Welche Silben fehlen?"
                show: { object: telephone }
                frame: "Te_ _"
                options: ["le", "fon", "la"]
                answer: ["le", "fon"]
              - id: l2-n4
                type: ordering
                text: "Leg das Wort."
                say: "Hand. Leg die Buchstaben."
                show: { object: hand }
                options: ["d", "a", "H", "n"]
                slot_count: 4
                answer: ["H", "a", "n", "d"]
              - id: l2-n5
                type: ordering
                text: "Bau das Wort."
                say: "Elefant. Bau das Wort aus den Silben. Eine Silbe passt nicht."
                show: { object: elephant }
                options: ["fant", "le", "E", "la"]
                slot_count: 3
                answer: ["E", "le", "fant"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Schnee. Was fehlt?"
            show: { object: snow }
            frame: "_nee"
            options: ["S", "Sch", "Ch"]
            answer: ["Sch"]
          - id: l2-c2
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Auto. Was fehlt?"
            show: { object: car }
            frame: "_to"
            options: ["A", "Au", "Ei"]
            answer: ["Au"]
          - id: l2-c3
            type: ordering
            text: "Bau das Wort."
            say: "Krokodil. Bau das Wort aus den Silben. Eine Silbe passt nicht."
            show: { object: crocodile }
            options: ["dil", "Kro", "ko", "ka"]
            slot_count: 3
            answer: ["Kro", "ko", "dil"]
          - id: l2-c4
            type: ordering
            text: "Leg das Wort."
            say: "Igel. Leg die Buchstaben."
            show: { object: hedgehog }
            options: ["l", "g", "I", "e"]
            slot_count: 4
            answer: ["I", "g", "e", "l"]
          - id: l2-c5
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Kuchen. Was fehlt?"
            show: { object: cake }
            frame: "Ku_en"
            options: ["sch", "ch", "k"]
            answer: ["ch"]
