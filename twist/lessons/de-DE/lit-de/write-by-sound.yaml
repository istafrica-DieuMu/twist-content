# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.write-by-sound
skill: lit-de.spelling.write-by-sound
curriculum: de-DE
language: de
title:
  de: Schreiben, wie man spricht
  en: Writing words by their sounds
summary: >
  Children write words whose spelling follows their sounds (Oma, Nase,
  Limo, Tomate), using the letters they know. The strategy is the
  Mitsprechen: say the word slowly, one sound at a time, and write a letter
  for each sound. They build words from letter cards, fill the missing
  letter, count sounds and spot a spelling with a sound left out. Lesson 1
  has short words of two open syllables; lesson 2 longer ones (Ente,
  Tomate, Esel) and ends with the skill check. Writing a whole word freely
  waits for a letter keyboard or handwriting recognition.
metadata:
  year: klasse-1
  topic: { de: Erste Wörter schreiben, en: Writing first words }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.phonological.sounds-in-words, lit-de.letters.e-n-d-u]
  also_practises: [lit-de.phonological.sounds-in-words]
  vocabulary: { de: [Laut, Buchstabe, mitsprechen, langsam sprechen] }
  forms: [audio, picture, drawn]
  drawn: [dots, word-card]
  facets: []
  misconceptions:
    - id: vowel-left-out
      what: Leaves out vowels and writes only the loud consonants (Nse for Nase, Tmt for Tomate)
      addressed: "Learn stretches each vowel; tasks l1-f3, l1-s4 and l2-f4 offer the spelling without a vowel, with feedback that every Silbe has a vowel"
    - id: letter-names
      what: Writes letter names for sounds (Esel as SL, because the name of S is Es)
      addressed: "hints say the sound, never the letter name; task l2-f3 sets Esel against a spelling built from letter names"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Langsam mitsprechen, en: Saying it slowly }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Wie viele Laute hörst du?"
            say: "Mund. Wie viele Laute hörst du?"
            show: { object: mouth }
            options:
              - { drawn: dots, count: 3, layout: row }
              - { drawn: dots, count: 4, layout: row }
              - { drawn: dots, count: 5, layout: row }
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "Tal." }
            options: ["Tal", "Tee", "Tom"]
            answer: "Tal"
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "Nase"
            say: "Wir schreiben Nase. Sprich ganz langsam mit: Nnn ... aaa ... sss ... eee."
            show: { object: nose }
          - text: "N a s e"
            say: "Für jeden Laut schreibst du einen Buchstaben. Nnn: N. Aaa: a. Sss: s. Eee: e. Nase."
            show: { drawn: word-card, text: "N a s e" }
          - text: "Nase"
            say: "Jede Silbe hat einen Selbstlaut: Na hat das a, se hat das e. Lies zum Schluss nach: Nase."
            show: { drawn: word-card, text: "Nase" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Leg das Wort."
                say: "Oma. Sprich langsam mit und leg die Buchstaben in die richtige Reihenfolge."
                show: { object: grandma }
                options: ["m", "a", "O"]
                slot_count: 3
                answer: ["O", "m", "a"]
                hints:
                  - "Sprich ganz langsam: Ooo ... mmm ... aaa."
                  - "Welchen Laut hörst du zuerst?"
                  - "O, dann m, dann a."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Limo. Sprich mit. Welcher Buchstabe fehlt?"
                frame: "Li_o"
                options: ["m", "n", "l"]
                answer: ["m"]
                hints:
                  - "Sprich langsam: Lll ... iii ... und dann?"
                  - "Die Lippen gehen zu: mmm."
                  - "Es fehlt das m."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Nase. Welches Wort ist richtig geschrieben?"
                show: { object: nose }
                options: ["Nse", "Nase", "Nas"]
                option_audio: false
                answer: "Nase"
                feedback:
                  Nse: "Hier fehlt das a. Sprich mit: Nnn ... aaa. Jede Silbe braucht einen Selbstlaut."
                  Nas: "Hier fehlt das e am Ende. Sprich bis zum Schluss: Na ... se."
                hints:
                  - "Sprich das Wort langsam und hör auf jeden Laut."
                  - "Nnn ... aaa ... sss ... eee. Das sind vier Laute."
                  - "Nase hat vier Buchstaben: N, a, s, e."
              - id: l1-f4
                type: ordering
                text: "Leg das Wort."
                say: "Lama. Sprich langsam mit und leg die Buchstaben."
                show: { object: llama }
                options: ["a", "m", "L", "a"]
                slot_count: 4
                answer: ["L", "a", "m", "a"]
                hints:
                  - "Sprich langsam: La ... ma."
                  - "Lll ... aaa ... mmm ... aaa."
                  - "L, a, m, a."
              - id: l1-f5
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Limo. Sprich langsam mit. Wie viele Laute hörst du?"
                show: { drawn: word-card, text: "Limo" }
                options:
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 5, layout: row }
                answer: "4"
                hints:
                  - "Zeig für jeden Laut einen Finger."
                  - "Lll ... iii ... mmm ... ooo."
                  - "Vier Laute, vier Buchstaben."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Mama. Sprich mit. Welcher Buchstabe fehlt?"
                show: { object: mum }
                frame: "M_ma"
                options: ["a", "o", "u"]
                answer: ["a"]
                hints: ["Mmm ... aaa."]
              - id: l1-s2
                type: ordering
                text: "Leg das Wort."
                say: "Nase. Sprich langsam mit und leg die Buchstaben."
                show: { object: nose }
                options: ["s", "N", "e", "a"]
                slot_count: 4
                answer: ["N", "a", "s", "e"]
                hints: ["Nnn ... aaa ... sss ... eee."]
              - id: l1-s3
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Dose. Sprich mit. Welcher Buchstabe fehlt?"
                frame: "Do_e"
                options: ["s", "t", "n"]
                answer: ["s"]
                hints: ["Do ... und dann summt es wie eine Biene."]
              - id: l1-s4
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Limo. Welches Wort ist richtig geschrieben?"
                options: ["Lmo", "Limo", "Lim"]
                option_audio: false
                answer: "Limo"
                hints: ["Jede Silbe braucht einen Selbstlaut: Li ... mo."]
              - id: l1-s5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Oma. Sprich mit. Welcher Buchstabe fehlt?"
                show: { object: grandma }
                frame: "Om_"
                options: ["o", "a", "e"]
                answer: ["a"]
                hints: ["Sprich bis zum Schluss: O ... maaa."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Leg das Wort."
                say: "Dose. Leg die Buchstaben."
                options: ["e", "o", "D", "s"]
                slot_count: 4
                answer: ["D", "o", "s", "e"]
              - id: l1-n2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Nase. Welcher Buchstabe fehlt?"
                show: { object: nose }
                frame: "Nas_"
                options: ["a", "e", "i"]
                answer: ["e"]
              - id: l1-n3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Mama. Welches Wort ist richtig geschrieben?"
                show: { object: mum }
                options: ["Mma", "Mama", "Mam"]
                option_audio: false
                answer: "Mama"
              - id: l1-n4
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Oma. Wie viele Laute hörst du?"
                show: { object: grandma }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
              - id: l1-n5
                type: ordering
                text: "Leg das Wort."
                say: "Limo. Leg die Buchstaben."
                options: ["o", "L", "m", "i"]
                slot_count: 4
                answer: ["L", "i", "m", "o"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Lama. Welcher Buchstabe fehlt?"
            show: { object: llama }
            frame: "L_ma"
            options: ["o", "a", "i"]
            answer: ["a"]
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Dose. Welches Wort ist richtig geschrieben?"
            options: ["Dse", "Dos", "Dose"]
            option_audio: false
            answer: "Dose"
          - id: l1-c3
            type: ordering
            text: "Leg das Wort."
            say: "Mama. Leg die Buchstaben."
            show: { object: mum }
            options: ["a", "M", "a", "m"]
            slot_count: 4
            answer: ["M", "a", "m", "a"]

  - n: 2
    title: { de: Längere Wörter, en: Longer words }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Limo. Welcher Buchstabe fehlt?"
            frame: "L_mo"
            options: ["i", "a"]
            answer: ["i"]
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Leg das Wort."
            say: "Oma. Leg die Buchstaben."
            show: { object: grandma }
            options: ["a", "O", "m"]
            slot_count: 3
            answer: ["O", "m", "a"]
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "To ma te"
            say: "Lange Wörter schreibst du Silbe für Silbe. Tomate: To ... ma ... te. Erst die erste Silbe, dann die nächste."
            show: { drawn: word-card, text: "To ma te" }
          - text: "Tomate"
            say: "In jeder Silbe sprichst du langsam mit: t ... ooo. mmm ... aaa. t ... eee. Tomate."
            show: { drawn: word-card, text: "Tomate" }
          - text: "Ente"
            say: "Ente. En ... te. Am Anfang hörst du ein kurzes e. Du sagst den Laut, nicht den Namen des Buchstabens."
            show: { object: duck }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Leg das Wort."
                say: "Ente. Sprich langsam mit und leg die Buchstaben."
                show: { object: duck }
                options: ["t", "E", "e", "n"]
                slot_count: 4
                answer: ["E", "n", "t", "e"]
                hints:
                  - "Sprich Silbe für Silbe: En ... te."
                  - "E ... nnn. Dann t ... eee."
                  - "E, n, t, e."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Tomate. Welche Silbe fehlt?"
                frame: "To_te"
                options: ["ma", "mo", "na"]
                answer: ["ma"]
                hints:
                  - "Sprich Silbe für Silbe: To ... ma ... te."
                  - "Die mittlere Silbe fängt mit mmm an."
                  - "Es fehlt ma."
              - id: l2-f3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Esel. Welches Wort ist richtig geschrieben?"
                options: ["SL", "Esel", "Esl"]
                option_audio: false
                answer: "Esel"
                feedback:
                  SL: "So klingen die Namen der Buchstaben: Es, El. Du schreibst aber die Laute: E ... sss ... eee ... lll."
                  Esl: "Hier fehlt ein e. Sprich mit: E ... sel. Die zweite Silbe braucht auch einen Selbstlaut."
                hints:
                  - "Sprich die Laute, nicht die Buchstabennamen."
                  - "E ... sss ... eee ... lll."
                  - "Esel hat vier Buchstaben: E, s, e, l."
              - id: l2-f4
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Tomate. Welches Wort ist richtig geschrieben?"
                options: ["Tmte", "Tomate", "Tomte"]
                option_audio: false
                answer: "Tomate"
                feedback:
                  Tmte: "Hier fehlen die Selbstlaute. Jede Silbe hat einen: To, ma, te."
                hints:
                  - "Sprich Silbe für Silbe."
                  - "To ... ma ... te. Drei Silben, drei Selbstlaute."
                  - "Tomate."
              - id: l2-f5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Tante. Welcher Buchstabe fehlt?"
                frame: "Ta_te"
                options: ["n", "m", "t"]
                answer: ["n"]
                hints:
                  - "Sprich langsam: Taaa ... und dann?"
                  - "Die Zunge geht hoch, es klingt durch die Nase."
                  - "Es fehlt das n: Tan ... te."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Leg das Wort."
                say: "Esel. Leg die Buchstaben."
                options: ["e", "l", "E", "s"]
                slot_count: 4
                answer: ["E", "s", "e", "l"]
                hints: ["E ... sss ... eee ... lll."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Ente. Welche Silbe fehlt?"
                show: { object: duck }
                frame: "En_"
                options: ["te", "ta", "de"]
                answer: ["te"]
                hints: ["En ... te. Am Ende hörst du eee."]
              - id: l2-s3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Name. Welches Wort ist richtig geschrieben?"
                options: ["Nme", "Name", "Nam"]
                option_audio: false
                answer: "Name"
                hints: ["Na ... me. Zwei Silben, zwei Selbstlaute."]
              - id: l2-s4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Tomate. Welcher Buchstabe fehlt?"
                frame: "Toma_e"
                options: ["t", "d", "n"]
                answer: ["t"]
                hints: ["Hör auf die letzte Silbe: te."]
              - id: l2-s5
                type: ordering
                text: "Leg das Wort."
                say: "Name. Leg die Buchstaben."
                options: ["m", "N", "e", "a"]
                slot_count: 4
                answer: ["N", "a", "m", "e"]
                hints: ["Nnn ... aaa ... mmm ... eee."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Tomate. Welche Silbe fehlt?"
                frame: "_mate"
                options: ["To", "Ta", "Mo"]
                answer: ["To"]
              - id: l2-n2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Ente. Welches Wort ist richtig geschrieben?"
                show: { object: duck }
                options: ["Ent", "Nte", "Ente"]
                option_audio: false
                answer: "Ente"
              - id: l2-n3
                type: ordering
                text: "Leg das Wort."
                say: "Tante. Leg die Buchstaben."
                options: ["e", "T", "n", "a", "t"]
                slot_count: 5
                answer: ["T", "a", "n", "t", "e"]
              - id: l2-n4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Esel. Welcher Buchstabe fehlt?"
                frame: "Es_l"
                options: ["a", "e", "i"]
                answer: ["e"]
              - id: l2-n5
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Ente. Wie viele Laute hörst du?"
                show: { object: duck }
                options:
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 5, layout: row }
                answer: "4"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            text: "Leg das Wort."
            say: "Nase. Hör gut zu und leg die Buchstaben."
            options: ["a", "e", "s", "N"]
            slot_count: 4
            answer: ["N", "a", "s", "e"]
          - id: l2-c2
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Tante. Welches Wort ist richtig geschrieben?"
            options: ["Tnte", "Tante", "Tate"]
            option_audio: false
            answer: "Tante"
          - id: l2-c3
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Dose. Welcher Buchstabe fehlt?"
            frame: "D_se"
            options: ["a", "o", "u"]
            answer: ["o"]
          - id: l2-c4
            type: fill_in_blank
            text: "Welche Silbe fehlt?"
            say: "Esel. Welche Silbe fehlt?"
            frame: "E_"
            options: ["sel", "sal", "lse"]
            answer: ["sel"]
          - id: l2-c5
            type: ordering
            text: "Leg das Wort."
            say: "Tomate. Leg die Silben."
            options: ["te", "To", "ma"]
            slot_count: 3
            answer: ["To", "ma", "te"]
