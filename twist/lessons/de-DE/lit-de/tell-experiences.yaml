# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.tell-experiences
skill: lit-de.speaking.tell
curriculum: de-DE
language: de
title:
  de: Von Erlebnissen erzählen
  en: Telling about something that happened
summary: >
  Telling about something you did so that others can follow. The app
  cannot mark a child's own telling, so the lessons teach and check what
  is behind it. Lesson 1 tells in the right order with zuerst, dann,
  danach and am Ende, puts pictures and sentences of a told experience in
  order and picks what comes next; lesson 2 starts with who, where and
  when, finds what a listener still needs, spots the sentence that does
  not belong, picks a good ending, sorts what helps when telling, and
  ends with the skill check. Speak tasks let the child tell a sentence
  aloud and compare it with the model; they are practice only. Every
  experience told here is written for Twist.
metadata:
  year: klasse-1
  topic: { de: Erzählen, en: Telling stories }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: []
  also_practises: [lit-de.comprehension.order-story]
  vocabulary: { de: [erzählen, Erlebnis, Reihenfolge, zuerst, dann, danach, am Ende, Zuhörer] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: jumbled-order
      what: Tells things in the order they come to mind, often the exciting end first
      addressed: "lesson 1 Learn tells Ida's day at the lake with zuerst, dann, danach and am Ende; every stage of lesson 1 has an ordering task and a true_false where a child starts with the end (l1-f3, l1-n3); \"Was kommt als Nächstes?\" offers the ending as a wrong option with feedback in l1-f4"
    - id: listener-knows
      what: Leaves out who, where and when, or says er and der, as if the listener had been there
      addressed: "lesson 2 Learn sets \"Und dann war der da\" against a start with Wer, Wo and Wann; \"Welcher Anfang ist besser?\" (l2-f1 with feedback, l2-s1, l2-n1, l2-c3) and \"Was fehlt noch?\" (l2-f2, l2-s2, l2-n2, l2-c4); l2-s4 asks whether the listener knows who er is"
    - id: off-topic
      what: Adds things that have nothing to do with the experience
      addressed: "lesson 2 Learn says stay with your experience; \"Welcher Satz passt nicht?\" in every stage of lesson 2 (l2-f3 with feedback) and in l2-c5"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Der Reihe nach", en: "In the right order" }
    new_content: true
    activities:
      - activity: learn
        mode: model-text
        screens:
          - text: "Am Sonntag war ich mit Papa am See.\nZuerst haben wir eine Decke ausgebreitet.\nDann bin ich ins Wasser gesprungen.\nDanach haben wir Eis gegessen.\nAm Ende waren wir müde und sind nach Hause gefahren."
            say: "Hör zu. Ida erzählt von ihrem Sonntag. Am Sonntag war ich mit Papa am See. Zuerst haben wir eine Decke ausgebreitet. Dann bin ich ins Wasser gesprungen. Danach haben wir Eis gegessen. Am Ende waren wir müde und sind nach Hause gefahren."
          - text: "zuerst\ndann\ndanach\nam Ende"
            say: "Ida erzählt der Reihe nach. Sie sagt zuerst, was zuerst passiert ist, und am Ende, was am Ende passiert ist. Diese Wörter helfen ihr dabei: zuerst, dann, danach, am Ende."
          - text: "Am Ende waren wir müde.\nZuerst haben wir eine Decke ausgebreitet."
            say: "Was wäre, wenn Ida mit dem Ende anfängt? Am Ende waren wir müde. Zuerst haben wir eine Decke ausgebreitet. Das ist durcheinander. So kann man ihr schlecht folgen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Leg die Bilder in die richtige Reihenfolge."
                say: "Ella erzählt, wie sie mit Oma einen Kuchen gebacken hat. Zuerst haben sie Eier aufgeschlagen. Dann kam der Kuchen in den Ofen. Am Ende haben sie den Kuchen gegessen. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: cake }, { object: egg }, { object: oven }]
                slot_count: 3
                answer: [egg, oven, cake]
                hints:
                  - "Was muss man zuerst machen, wenn man backt?"
                  - "Zuerst die Eier. Was kommt dann?"
                  - "Eier, Ofen, am Ende der fertige Kuchen."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke? Lies mit: Lücke, sind wir in den Zoo gefahren. Dann haben wir die Affen gesehen. Am Ende waren wir müde."
                frame: "_ sind wir in den Zoo gefahren.\nDann haben wir die Affen gesehen.\nAm Ende waren wir müde."
                options: ["Zuerst", "Danach", "Am Ende"]
                answer: ["Zuerst"]
                hints:
                  - "Die Lücke steht ganz am Anfang."
                  - "Welches Wort sagt: Das war als Erstes?"
                  - "Zuerst."
              - id: l1-f3
                type: true_false
                text: "Hat Ben der Reihe nach erzählt?"
                say: "Hör zu, wie Ben erzählt. Am Ende sind wir nach Hause gegangen. Zuerst waren wir auf dem Spielplatz. Hat Ben der Reihe nach erzählt?"
                answer: false
                hints:
                  - "Womit fängt Ben an?"
                  - "Ben fängt mit „Am Ende“ an."
                  - "Das Ende kommt zuerst. Nein, das ist durcheinander."
              - id: l1-f4
                type: multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Hör zu. Am Samstag war ich mit Mama im Schwimmbad. Zuerst haben wir uns umgezogen. Was kommt als Nächstes?"
                options: ["Dann bin ich ins Wasser gesprungen.", "Am Ende haben wir uns abgetrocknet.", "Am Samstag war ich im Schwimmbad."]
                answer: "Dann bin ich ins Wasser gesprungen."
                feedback:
                  "Am Ende haben wir uns abgetrocknet.": "Das passiert erst ganz zum Schluss. Was kommt nach dem Umziehen?"
                hints:
                  - "Was macht man im Schwimmbad nach dem Umziehen?"
                  - "Der nächste Satz fängt mit dann an."
                  - "Dann bin ich ins Wasser gesprungen."
              - id: l1-f5
                type: ordering
                text: "Bring die Sätze in die richtige Reihenfolge."
                say: "Finn erzählt von seinem Drachen. Bring die Sätze in die richtige Reihenfolge."
                options: ["Am Ende ist der Drachen hoch in den Himmel geflogen.", "Zuerst haben Papa und ich einen Drachen gebaut.", "Dann sind wir auf die Wiese gegangen."]
                slot_count: 3
                answer: ["Zuerst haben Papa und ich einen Drachen gebaut.", "Dann sind wir auf die Wiese gegangen.", "Am Ende ist der Drachen hoch in den Himmel geflogen."]
                hints:
                  - "Achte auf die Wörter zuerst, dann und am Ende."
                  - "Erst muss der Drachen gebaut sein."
                  - "Bauen, auf die Wiese gehen, fliegen lassen."
              - id: l1-f6
                type: speak
                text: "Erzähl wie Ella."
                say: "Erzähl wie Ella. Sprich nach: Zuerst haben wir Eier aufgeschlagen."
                expected_text: "Zuerst haben wir Eier aufgeschlagen."
                hints:
                  - "Fang mit zuerst an."
                  - "Sprich langsam und deutlich."
                  - "Zuerst haben wir Eier aufgeschlagen."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Leg die Bilder in die richtige Reihenfolge."
                say: "Paul erzählt von seinem Morgen. Zuerst bin ich aufgewacht. Dann habe ich ein Brot gegessen. Am Ende bin ich mit dem Bus zur Schule gefahren. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: bus }, { object: bed }, { object: bread }]
                slot_count: 3
                answer: [bed, bread, bus]
                hints: ["Was macht Paul, bevor er frühstückt?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke? Lies mit: Zuerst habe ich den Ball geholt. Lücke, haben wir Fußball gespielt."
                frame: "Zuerst habe ich den Ball geholt.\n_ haben wir Fußball gespielt."
                options: ["Dann", "Zuerst", "Am Anfang"]
                answer: ["Dann"]
                hints: ["Zuerst ist schon da. Was kommt danach?"]
              - id: l1-s3
                type: multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Hör zu. Gestern hat es geschneit. Zuerst habe ich meine Jacke angezogen. Was kommt als Nächstes?"
                options: ["Dann habe ich einen Schneemann gebaut.", "Am Ende war der Schneemann fertig.", "Gestern hat es geschneit."]
                answer: "Dann habe ich einen Schneemann gebaut."
                hints: ["Was kommt nach dem Anziehen, und was erst am Schluss?"]
              - id: l1-s4
                type: true_false
                text: "Hat Mia der Reihe nach erzählt?"
                say: "Hör zu, wie Mia erzählt. Zuerst habe ich Samen in die Erde gesteckt. Dann habe ich sie gegossen. Am Ende ist eine Blume gewachsen. Hat Mia der Reihe nach erzählt?"
                answer: true
                hints: ["Kann eine Blume wachsen, bevor die Samen in der Erde sind?"]
              - id: l1-s5
                type: multiple_choice
                text: "Mit welchen Wörtern sagst du, was zum Schluss passiert ist?"
                options: ["am Ende", "zuerst", "am Anfang"]
                answer: "am Ende"
                hints: ["Welche Wörter hat Ida im letzten Satz gesagt?"]
              - id: l1-s6
                type: speak
                text: "Erzähl wie Ida."
                say: "Erzähl wie Ida. Sprich nach: Dann bin ich ins Wasser gesprungen."
                expected_text: "Dann bin ich ins Wasser gesprungen."
                hints: ["Sprich laut und deutlich."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Bring die Sätze in die richtige Reihenfolge."
                say: "Lea erzählt von ihrem Nachmittag mit Opa. Bring die Sätze in die richtige Reihenfolge."
                options: ["Dann haben wir die Enten gefüttert.", "Am Ende hat Opa mir ein Eis gekauft.", "Zuerst sind wir in den Park gegangen."]
                slot_count: 3
                answer: ["Zuerst sind wir in den Park gegangen.", "Dann haben wir die Enten gefüttert.", "Am Ende hat Opa mir ein Eis gekauft."]
              - id: l1-n2
                type: fill_in_blank
                text: "Welche Wörter passen?"
                say: "Welche Wörter passen in die Lücken? Lies mit: Lücke, habe ich mein Fahrrad geholt. Lücke, bin ich zu Lea gefahren."
                frame: "_ habe ich mein Fahrrad geholt.\n_ bin ich zu Lea gefahren."
                options: ["Zuerst", "Dann", "Und"]
                answer: ["Zuerst", "Dann"]
              - id: l1-n3
                type: true_false
                text: "Hat Jonas der Reihe nach erzählt?"
                say: "Hör zu, wie Jonas erzählt. Am Ende hat mein Hund den Ball gebracht. Zuerst habe ich den Ball geworfen. Hat Jonas der Reihe nach erzählt?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Hör zu. Heute war ich beim Friseur. Zuerst habe ich gewartet. Dann hat mir die Friseurin die Haare gewaschen. Was kommt als Nächstes?"
                options: ["Danach hat sie mir die Haare geschnitten.", "Zuerst habe ich gewartet.", "Heute war ich beim Friseur."]
                answer: "Danach hat sie mir die Haare geschnitten."
              - id: l1-n5
                type: speak
                text: "Erzähl wie Lea."
                say: "Erzähl wie Lea. Sprich nach: Am Ende hat Opa mir ein Eis gekauft."
                expected_text: "Am Ende hat Opa mir ein Eis gekauft."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "Leg die Bilder in die richtige Reihenfolge."
            say: "Emil erzählt. Zuerst bin ich ins Bett gegangen. Dann habe ich vom Mond geträumt. Am Ende hat mich die Sonne geweckt. Leg die Bilder in die richtige Reihenfolge."
            options: [{ object: sun }, { object: bed }, { object: moon }]
            slot_count: 3
            answer: [bed, moon, sun]
          - id: l1-c2
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke? Lies mit: Zuerst haben wir gemalt. Dann haben wir gesungen. Lücke, haben wir aufgeräumt."
            frame: "Zuerst haben wir gemalt.\nDann haben wir gesungen.\n_ haben wir aufgeräumt."
            options: ["Am Ende", "Zuerst", "Am Anfang"]
            answer: ["Am Ende"]
          - id: l1-c3
            type: true_false
            text: "Hat Sara der Reihe nach erzählt?"
            say: "Hör zu, wie Sara erzählt. Zuerst habe ich meine Schuhe angezogen. Dann bin ich nach draußen gegangen. Hat Sara der Reihe nach erzählt?"
            answer: true

  - n: 2
    title: { de: "So verstehen dich alle", en: "So that everyone understands" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            text: "Leg die Bilder in die richtige Reihenfolge."
            say: "Nina erzählt. Zuerst habe ich einen Apfel gepflückt. Dann habe ich ihn gewaschen. Am Ende habe ich ihn mit einem Messer in Stücke geschnitten. Leg die Bilder in die richtige Reihenfolge."
            options: [{ object: knife }, { object: tree }, { object: water }]
            slot_count: 3
            answer: [tree, water, knife]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Mit welchem Wort fängst du an, wenn du der Reihe nach erzählst?"
            options: ["zuerst", "am Ende", "danach"]
            answer: "zuerst"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Und dann war der da.\nUnd dann hat er den gefangen."
            say: "Hör zu, wie Tim erzählt. Und dann war der da. Und dann hat er den gefangen. Verstehst du, was passiert ist? Nein. Wer war da? Wo war das? Wer hat was gefangen?"
          - text: "Wann? Wo? Wer?\nGestern war ich mit meinem Bruder im Garten.\nMein Bruder hat einen Frosch gefangen."
            say: "So geht es besser. Gestern war ich mit meinem Bruder im Garten. Mein Bruder hat einen Frosch gefangen. Am Anfang sagst du, wann es war, wo du warst und wer dabei war. Dann kann jeder dir folgen."
            show: { object: frog }
          - text: "Bleib bei deinem Erlebnis.\nFinde ein gutes Ende."
            say: "Erzähl nur, was zu deinem Erlebnis gehört. Und am Schluss sagst du, wie es ausgegangen ist, zum Beispiel: Am Ende haben wir den Frosch wieder in den Teich gesetzt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Anfang ist besser?"
                options: ["Gestern war ich mit Mama im Zoo.", "Und dann war der da."]
                answer: "Gestern war ich mit Mama im Zoo."
                feedback:
                  "Und dann war der da.": "Wer ist der? Und wo war das? Das weiß der Zuhörer nicht."
                hints:
                  - "Welcher Satz sagt dir, wann, wo und mit wem?"
                  - "Gestern ist wann. Im Zoo ist wo. Mama ist wer."
                  - "Gestern war ich mit Mama im Zoo."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was fehlt noch?"
                say: "Leo erzählt: Am Samstag habe ich eine Sandburg gebaut. Was fehlt noch?"
                options: ["Wo war Leo?", "Was hat Leo gebaut?", "Wann war das?"]
                answer: "Wo war Leo?"
                hints:
                  - "Frag dich: Wann? Wo? Wer? Was?"
                  - "Wann war es? Am Samstag. Was hat er gebaut? Eine Sandburg."
                  - "Leo sagt nicht, wo er war. Das fehlt."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Satz passt nicht?"
                say: "Hör zu, wie Sophie erzählt. Gestern hatte ich Geburtstag. Meine Freunde sind gekommen. Mein Lieblingstier ist der Wal. Welcher Satz passt nicht zu ihrem Erlebnis?"
                options: ["Mein Lieblingstier ist der Wal.", "Meine Freunde sind gekommen.", "Gestern hatte ich Geburtstag."]
                answer: "Mein Lieblingstier ist der Wal."
                feedback:
                  "Meine Freunde sind gekommen.": "Die Freunde kommen zum Geburtstag. Das gehört dazu."
                hints:
                  - "Worum geht es in Sophies Erlebnis?"
                  - "Es geht um ihren Geburtstag. Welcher Satz hat damit nichts zu tun?"
                  - "Der Satz über den Wal passt nicht."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Satz ist ein gutes Ende?"
                say: "Hör zu. Am Montag war ich mit meiner Klasse im Museum. Wir haben Dinosaurier gesehen. Welcher Satz ist ein gutes Ende?"
                options: ["Am Ende waren wir müde, aber es war ein toller Tag.", "Am Montag war ich im Museum.", "Und dann und dann und dann."]
                answer: "Am Ende waren wir müde, aber es war ein toller Tag."
                hints:
                  - "Ein gutes Ende sagt, wie es ausgegangen ist."
                  - "Welcher Satz fängt mit am Ende an?"
                  - "Am Ende waren wir müde, aber es war ein toller Tag."
              - id: l2-f5
                type: sorting
                text: "Was hilft beim Erzählen?"
                say: "Was hilft beim Erzählen, was nicht? Sortiere."
                bins:
                  - { id: good, show: { text: "hilft" }, say: "hilft" }
                  - { id: bad, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "der Reihe nach erzählen", say: "der Reihe nach erzählen", bin: good }
                  - { text: "sagen, wer dabei war", say: "sagen, wer dabei war", bin: good }
                  - { text: "mit dem Ende anfangen", say: "mit dem Ende anfangen", bin: bad }
                  - { text: "ganz leise murmeln", say: "ganz leise murmeln", bin: bad }
                hints:
                  - "Stell dir vor, du hörst zu. Was hilft dir?"
                  - "Durcheinander und leise kannst du schlecht verstehen."
                  - "Es hilft, der Reihe nach zu erzählen und zu sagen, wer dabei war."
              - id: l2-f6
                type: speak
                text: "Fang deine Erzählung gut an."
                say: "Fang gut an. Sag, wann es war, wo du warst und wer dabei war. Sprich nach: Gestern war ich mit Oma im Park."
                expected_text: "Gestern war ich mit Oma im Park."
                hints:
                  - "Wann? Gestern."
                  - "Wo? Im Park. Wer? Oma."
                  - "Gestern war ich mit Oma im Park."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Anfang ist besser?"
                options: ["Da war so ein Ding.", "Am Montag war ich mit Papa beim Arzt."]
                answer: "Am Montag war ich mit Papa beim Arzt."
                hints: ["Welcher Satz sagt, wann, wo und mit wem?"]
              - id: l2-s2
                type: multiple_choice
                text: "Was fehlt noch?"
                say: "Mia erzählt: Ich war mit meiner Schwester im Schwimmbad. Was fehlt noch?"
                options: ["Wann war das?", "Wer war dabei?", "Wo war Mia?"]
                answer: "Wann war das?"
                hints: ["Wo und wer stehen schon im Satz."]
              - id: l2-s3
                type: multiple_choice
                text: "Welcher Satz passt nicht?"
                say: "Hör zu, wie Ali erzählt. Heute Morgen hat es geschneit. Ich habe mit meiner Freundin einen Schneemann gebaut. Im Sommer esse ich gern Eis. Welcher Satz passt nicht zu seinem Erlebnis?"
                options: ["Im Sommer esse ich gern Eis.", "Heute Morgen hat es geschneit.", "Ich habe mit meiner Freundin einen Schneemann gebaut."]
                answer: "Im Sommer esse ich gern Eis."
                hints: ["Es geht um den Schnee heute Morgen."]
              - id: l2-s4
                type: true_false
                text: "Weiß der Zuhörer, wer gebellt hat?"
                say: "Tom fängt so an: Er hat ganz laut gebellt. Weiß der Zuhörer, wer gebellt hat?"
                answer: false
                hints: ["Wer ist er? Hat Tom einen Namen gesagt?"]
              - id: l2-s5
                type: sorting
                text: "Was hilft beim Erzählen?"
                say: "Was hilft beim Erzählen, was nicht? Sortiere."
                bins:
                  - { id: good, show: { text: "hilft" }, say: "hilft" }
                  - { id: bad, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "sagen, wo es war", say: "sagen, wo es war", bin: good }
                  - { text: "laut und deutlich sprechen", say: "laut und deutlich sprechen", bin: good }
                  - { text: "von etwas ganz anderem erzählen", say: "von etwas ganz anderem erzählen", bin: bad }
                  - { text: "alles durcheinander erzählen", say: "alles durcheinander erzählen", bin: bad }
                hints: ["Was brauchst du, wenn du jemandem zuhörst?"]
              - id: l2-s6
                type: speak
                text: "Erzähl ein gutes Ende."
                say: "Sag ein gutes Ende. Sprich nach: Am Ende war ich müde, aber froh."
                expected_text: "Am Ende war ich müde, aber froh."
                hints: ["Fang mit am Ende an."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Anfang ist besser?"
                options: ["Letzte Woche war ich mit Opa am Meer.", "Also da war das so und dann."]
                answer: "Letzte Woche war ich mit Opa am Meer."
              - id: l2-n2
                type: multiple_choice
                text: "Was fehlt noch?"
                say: "Jan erzählt: Am Sonntag hat mein Bruder ein Tor geschossen. Was fehlt noch?"
                options: ["Wo war das?", "Wer hat ein Tor geschossen?", "Wann war das?"]
                answer: "Wo war das?"
              - id: l2-n3
                type: multiple_choice
                text: "Welcher Satz passt nicht?"
                say: "Hör zu, wie Ben erzählt. Am Freitag war ich mit Mama auf dem Markt. Wir haben Äpfel gekauft. Mein Fahrrad ist blau. Welcher Satz passt nicht zu seinem Erlebnis?"
                options: ["Mein Fahrrad ist blau.", "Wir haben Äpfel gekauft.", "Am Freitag war ich mit Mama auf dem Markt."]
                answer: "Mein Fahrrad ist blau."
              - id: l2-n4
                type: multiple_choice
                text: "Welcher Satz ist ein gutes Ende?"
                say: "Hör zu. Heute habe ich mit Papa einen Vogel im Garten beobachtet. Er hat Körner gepickt. Welcher Satz ist ein gutes Ende?"
                options: ["Am Ende ist der Vogel weggeflogen.", "Heute war ich im Garten.", "Ich mag Pizza."]
                answer: "Am Ende ist der Vogel weggeflogen."
              - id: l2-n5
                type: ordering
                text: "Bring die Sätze in die richtige Reihenfolge."
                say: "Elif erzählt von ihrem Ausflug. Bring die Sätze in die richtige Reihenfolge."
                options: ["Am Ende sind wir mit dem Bus zurückgefahren.", "Am Dienstag war meine Klasse auf dem Bauernhof.", "Dort haben wir die Kühe gefüttert."]
                slot_count: 3
                answer: ["Am Dienstag war meine Klasse auf dem Bauernhof.", "Dort haben wir die Kühe gefüttert.", "Am Ende sind wir mit dem Bus zurückgefahren."]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            text: "Leg die Bilder in die richtige Reihenfolge."
            say: "Max erzählt. Zuerst hat es geschneit. Dann haben wir einen Schneemann gebaut. Am Ende kam die Sonne, und der Schneemann ist geschmolzen. Leg die Bilder in die richtige Reihenfolge."
            options: [{ object: sun }, { object: snow }, { object: snowman }]
