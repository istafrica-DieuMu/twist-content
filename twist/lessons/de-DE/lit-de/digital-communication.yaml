# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.digital-communication
skill: lit-de.vocabulary.digital-communication
curriculum: de-DE
language: de
title:
  de: Chats, Nachrichten und Videoanrufe
  en: Chats, messages and video calls
summary: >
  How people talk in messages, chats and video calls, and the rules that
  hold there. Lesson 1 looks at chat language: short and close to speech,
  Abkürzungen (LG, vllt, kA), Emojis that show a feeling, and messages
  that are easy to misread because the reader cannot hear your voice; it
  sets a chat with friends against a message to the teacher. Lesson 2
  takes the Netiquette: Großbuchstaben read as shouting, think before you
  send, no photos of others without asking, nobody shut out or insulted,
  telling an adult, and taking turns in a video call; it ends with the
  skill check. All chats are written for Twist; each emoji is also
  described in the spoken text.
metadata:
  year: klasse-4
  topic: { de: Sprache untersuchen, en: Exploring language }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.vocabulary.spoken-written]
  also_practises: [lit-de.vocabulary.spoken-written, lit-de.vocabulary.language-effect]
  vocabulary: { de: [Nachricht, Chat, Gruppe, Abkürzung, Emoji, Videoanruf, Mikrofon, Netiquette, Großbuchstaben, Missverständnis] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: tone-is-heard
      what: Expects the reader to hear the tone of a short message, so a joke or a bare Na super is not misread
      addressed: "lesson 1 Learn shows Toll, schon wieder Regen with no voice; l1-f3 and l1-n3 ask about voice and emojis; l1-f4 (with feedback), l1-s4 and l1-n4 choose the clearer message"
    - id: online-anything-goes
      what: Thinks politeness rules stop in a chat, that a sent message can always be taken back, or that a laughing emoji under an insult is harmless
      addressed: "lesson 2 Learn lists the Netiquette; l2-f2, l2-s2, l2-n2 and l2-c4 sort good rules from bad ideas; l2-f3 asks about saving and forwarding; l2-f5 gives feedback on the laughing emoji; l2-f1, l2-s1, l2-n1 and l2-c3 take Großbuchstaben as shouting"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "So schreiben wir im Chat", en: "How we write in a chat" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie schreibt man „hab“ vollständig?"
            say: "Wie schreibt man die Kurzform hab vollständig?"
            options: ["habe", "hat", "haben"]
            answer: "habe"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Umgangssprache passt gut, wenn du mit deinen Freunden sprichst. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Lena: hey 😊 kommst du nachher mit zum spielplatz?\nTom: ok, bis gleich 👍"
            say: "So schreiben Lena und Tom im Chat. Lena setzt ein lächelndes Gesicht dazu, Tom einen Daumen nach oben. Im Chat schreiben wir oft so, wie wir sprechen: kurz, locker und manchmal alles klein. Emojis zeigen Gefühle, denn der andere sieht dein Gesicht nicht."
          - text: "LG = liebe Grüße\nvllt = vielleicht\nkA = keine Ahnung\nHDL = hab dich lieb\nthx = danke (englisch: thanks)\nsry = Entschuldigung (englisch: sorry)"
            say: "Viele Leute kürzen Wörter im Chat ab. LG heißt liebe Grüße, vllt heißt vielleicht. Manche Abkürzungen kommen aus dem Englischen: T, H, X heißt danke, S, R, Y heißt Entschuldigung. Solche Abkürzungen passen zu Freunden. In einer Nachricht an deine Lehrerin schreibst du lieber alles aus."
          - text: "Tom schreibt: „Toll, schon wieder Regen.“"
            say: "Freut sich Tom über den Regen, oder ist er genervt? Beim Sprechen würdest du es an seiner Stimme hören. In einer Nachricht hörst du keine Stimme. So entstehen schnell Missverständnisse. Schreib deshalb klar, was du meinst, und frag nach, wenn du dir nicht sicher bist."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Mia schreibt: „Hab die Mathearbeit zurück 😭“\n\nWie fühlt sie sich wahrscheinlich?"
                say: "Mia schreibt: Hab die Mathearbeit zurück. Dahinter steht ein Gesicht, das laut weint. Wie fühlt sie sich wahrscheinlich?"
                options: ["traurig", "glücklich", "müde"]
                answer: "traurig"
                hints:
                  - "Schau auf das Emoji am Ende."
                  - "Das Gesicht weint."
                  - "Mia ist traurig."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Was bedeutet die Abkürzung?"
                say: "Verbinde jede Abkürzung mit ihrer Bedeutung."
                pairs:
                  - { left: { text: "LG" }, right: { text: "liebe Grüße" } }
                  - { left: { text: "HDL" }, right: { text: "hab dich lieb" } }
                  - { left: { text: "vllt" }, right: { text: "vielleicht" } }
                  - { left: { text: "kA" }, right: { text: "keine Ahnung" } }
                hints:
                  - "Jeder Buchstabe steht oft für den Anfang eines Wortes."
                  - "L und G: liebe Grüße."
                  - "LG: liebe Grüße. HDL: hab dich lieb. vllt: vielleicht. kA: keine Ahnung."
              - id: l1-f3
                type: true_false
                text: "Wer deine Nachricht liest, hört dabei deine Stimme. Stimmt das?"
                answer: false
                hints:
                  - "Ist eine Nachricht gesprochen oder geschrieben?"
                  - "Beim Lesen hört man keine Stimme."
                  - "Nein, darum gibt es leicht Missverständnisse."
              - id: l1-f4
                type: multiple_choice
                text: "Ben schreibt Ali: „Dein Bild ist echt besonders.“ Ali weiß nicht, ob Ben das nett meint. Wie hätte Ben es klarer schreiben können?"
                say: "Ben schreibt Ali: Dein Bild ist echt besonders. Ali weiß nicht, ob Ben das nett meint. Wie hätte Ben es klarer schreiben können?"
                options: ["Dein Bild gefällt mir richtig gut! 😊", "Bild.", "DEIN BILD IST BESONDERS!!!"]
                answer: "Dein Bild gefällt mir richtig gut! 😊"
                option_audio: false
                feedback:
                  "DEIN BILD IST BESONDERS!!!": "Großbuchstaben wirken wie Schreien. Klarer wird die Nachricht dadurch nicht."
                hints:
                  - "Welche Nachricht sagt genau, was Ben denkt?"
                  - "Ein freundliches Emoji hilft auch."
                  - "Dein Bild gefällt mir richtig gut!"
              - id: l1-f5
                type: sorting
                text: "Chat mit Freunden oder Nachricht an die Lehrerin?"
                say: "Sortiere: Passt das eher in den Chat mit Freunden oder in eine Nachricht an deine Lehrerin?"
                bins:
                  - { id: friends, show: { text: "Chat mit Freunden" }, say: "Chat mit Freunden" }
                  - { id: teacher, show: { text: "Nachricht an die Lehrerin" }, say: "Nachricht an die Lehrerin" }
                options:
                  - { text: "hey, kommst du? 😄", bin: friends }
                  - { text: "LG Tom", bin: friends }
                  - { text: "Liebe Frau Berg,", bin: teacher }
                  - { text: "Viele Grüße, Tom", bin: teacher }
                option_audio: false
                hints:
                  - "Mit wem schreibst du locker, mit wem höflich?"
                  - "Abkürzungen passen zu Freunden."
                  - "Freunde: hey und LG. Lehrerin: Liebe Frau Berg und Viele Grüße."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Jonas schreibt: „Morgen ist Zooausflug 🥳“\n\nWie fühlt er sich?"
                say: "Jonas schreibt: Morgen ist Zooausflug. Dahinter steht ein Gesicht mit Partyhut. Wie fühlt er sich?"
                options: ["Er freut sich.", "Er hat Angst.", "Er ist wütend."]
                answer: "Er freut sich."
                hints: ["Was zeigt ein Gesicht mit Partyhut?"]
              - id: l1-s2
                type: matching
                text: "Was bedeutet die Abkürzung?"
                say: "Verbinde jede Abkürzung mit ihrer Bedeutung."
                pairs:
                  - { left: { text: "thx" }, right: { text: "danke" } }
                  - { left: { text: "sry" }, right: { text: "Entschuldigung" } }
                  - { left: { text: "HDGDL" }, right: { text: "hab dich ganz doll lieb" } }
                  - { left: { text: "ok" }, right: { text: "in Ordnung" } }
                hints: ["Die Abkürzungen thx und sry kommen aus dem Englischen: thanks und sorry."]
              - id: l1-s3
                type: true_false
                text: "Im Chat schreiben viele Leute so ähnlich, wie sie sprechen. Stimmt das?"
                answer: true
                hints: ["Klingt ein Chat eher wie ein Aufsatz oder wie ein Gespräch?"]
              - id: l1-s4
                type: multiple_choice
                text: "Lea schreibt nur: „Na super.“ Was kann das heißen?"
                say: "Lea schreibt nur: Na super. Was kann das heißen?"
                options: ["Sie freut sich oder sie ist genervt. Man weiß es nicht genau.", "Sie freut sich ganz sicher.", "Sie ist ganz sicher wütend."]
                answer: "Sie freut sich oder sie ist genervt. Man weiß es nicht genau."
                hints: ["Hörst du Leas Stimme?"]
              - id: l1-s5
                type: multiple_choice
                text: "Du schreibst deiner Lehrerin, dass du krank bist. Wie beginnst du?"
                options: ["Liebe Frau Berg,", "hey 😎", "yo, was geht"]
                answer: "Liebe Frau Berg,"
                option_audio: false
                hints: ["An die Lehrerin schreibst du höflich."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Paul antwortet auf einen Witz mit 😂. Was meint er?"
                say: "Paul antwortet auf einen Witz mit einem Gesicht, das Lachtränen weint. Was meint er?"
                options: ["Er findet den Witz sehr lustig.", "Er ist traurig.", "Er hat den Witz nicht gelesen."]
                answer: "Er findet den Witz sehr lustig."
              - id: l1-n2
                type: matching
                text: "Was bedeutet die Abkürzung?"
                say: "Verbinde jede Abkürzung mit ihrer Bedeutung."
                pairs:
                  - { left: { text: "LG" }, right: { text: "liebe Grüße" } }
                  - { left: { text: "kA" }, right: { text: "keine Ahnung" } }
                  - { left: { text: "sry" }, right: { text: "Entschuldigung" } }
                  - { left: { text: "vllt" }, right: { text: "vielleicht" } }
              - id: l1-n3
                type: true_false
                text: "Ein Emoji kann zeigen, wie eine Nachricht gemeint ist. Stimmt das?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Du kannst nicht zu Emmas Geburtstag kommen. Welche Nachricht ist freundlich und klar?"
                options: ["Schade, ich kann leider nicht kommen. Ich wünsche dir eine tolle Feier! 🎈", "Nö.", "Keine Lust."]
                answer: "Schade, ich kann leider nicht kommen. Ich wünsche dir eine tolle Feier! 🎈"
                option_audio: false
              - id: l1-n5
                type: sorting
                text: "Chat mit Freunden oder Nachricht an die Lehrerin?"
                say: "Sortiere: Passt das eher in den Chat mit Freunden oder in eine Nachricht an deine Lehrerin?"
                bins:
                  - { id: friends, show: { text: "Chat mit Freunden" }, say: "Chat mit Freunden" }
                  - { id: teacher, show: { text: "Nachricht an die Lehrerin" }, say: "Nachricht an die Lehrerin" }
                options:
                  - { text: "kA, frag Jonas 🤷", bin: friends }
                  - { text: "bis gleich 👍", bin: friends }
                  - { text: "Ich habe eine Frage zu den Hausaufgaben.", bin: teacher }
                  - { text: "Vielen Dank für Ihre Hilfe.", bin: teacher }
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was heißt vllt im Chat?"
            options: ["vielleicht", "viel Glück", "vorhin"]
            answer: "vielleicht"
          - id: l1-c2
            type: multiple_choice
            text: "Warum gibt es in Nachrichten leicht Missverständnisse?"
            options: ["Man hört die Stimme nicht und sieht das Gesicht nicht.", "Nachrichten sind immer zu lang.", "Man darf keine Emojis benutzen."]
            answer: "Man hört die Stimme nicht und sieht das Gesicht nicht."
          - id: l1-c3
            type: true_false
            text: "Passt „hey 😎“ als Anfang einer Nachricht an deinen Lehrer?"
            say: "Passt hey mit einem Sonnenbrillen-Gesicht als Anfang einer Nachricht an deinen Lehrer?"
            answer: false

  - n: 2
    title: { de: "Regeln im Netz", en: "Rules online" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was heißt LG am Ende einer Nachricht?"
            options: ["liebe Grüße", "lange Geschichte", "leise gehen"]
            answer: "liebe Grüße"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein weinendes Emoji zeigt, dass jemand traurig ist. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Regeln im Chat:\nfreundlich bleiben\nnicht in GROSSBUCHSTABEN schreiben\nniemanden auslachen oder ausschließen\nkeine Fotos von anderen ohne Erlaubnis"
            say: "Für Chats und Gruppen gibt es Regeln. Man nennt sie Netiquette. Im Netz gilt dasselbe wie auf dem Schulhof: Sei freundlich. Großbuchstaben wirken wie Schreien. Und ein Foto von jemandem schickst du nur weiter, wenn er es erlaubt."
          - text: "Erst denken, dann senden."
            say: "Eine Nachricht, die du gesendet hast, kannst du nicht ganz zurückholen. Andere können sie speichern und weiterschicken. Darum: erst denken, dann senden. Wenn jemand in einer Gruppe gemein ist, schimpf nicht zurück. Sag einem Erwachsenen Bescheid."
          - text: "Im Videoanruf:\nan einen ruhigen Ort setzen\nMikrofon aus, wenn andere sprechen\nnacheinander reden\ndie Hand heben, wenn du etwas sagen willst"
            say: "Auch im Videoanruf gibt es Regeln. Setz dich an einen ruhigen Ort. Schalte dein Mikrofon aus, wenn andere sprechen, damit es keine Störgeräusche gibt. Und redet nacheinander. Wer etwas sagen will, hebt die Hand."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum wirkt die Nachricht „KOMM JETZT SOFORT!!!“ unfreundlich?"
                say: "Jemand schreibt in Großbuchstaben: Komm jetzt sofort, mit drei Ausrufezeichen. Warum wirkt die Nachricht unfreundlich?"
                options: ["Großbuchstaben wirken wie Schreien.", "Das Wort sofort ist falsch geschrieben.", "Die Nachricht ist zu kurz."]
                answer: "Großbuchstaben wirken wie Schreien."
                hints:
                  - "Wie sieht die Nachricht aus?"
                  - "Alles steht in Großbuchstaben."
                  - "Großbuchstaben wirken wie Schreien."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Gute Regel oder keine gute Idee?"
                say: "Sortiere: Ist das eine gute Regel für den Chat oder keine gute Idee?"
                bins:
                  - { id: good, show: { text: "gute Regel" }, say: "gute Regel" }
                  - { id: bad, show: { text: "keine gute Idee" }, say: "keine gute Idee" }
                options:
                  - { text: "erst nachdenken, dann senden", bin: good }
                  - { text: "fragen, bevor man ein Foto von jemandem teilt", bin: good }
                  - { text: "ein peinliches Foto von Max in die Klassengruppe stellen", bin: bad }
                  - { text: "jemanden aus der Gruppe werfen, um ihn zu ärgern", bin: bad }
                hints:
                  - "Wie würdest du dich fühlen, wenn man das mit dir macht?"
                  - "Ein peinliches Foto kann jeder in der Gruppe sehen."
                  - "Nachdenken und fragen sind gute Regeln. Foto und rauswerfen sind keine gute Idee."
              - id: l2-f3
                type: true_false
                text: "Eine Nachricht, die du gesendet hast, kann jemand speichern und weiterschicken. Stimmt das?"
                answer: true
                hints:
                  - "Was kann der andere mit deiner Nachricht machen?"
                  - "Gesendet ist gesendet. Erst denken, dann senden."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: multiple_choice
                text: "Im Videoanruf mit der Klasse spricht gerade die Lehrerin. Was machst du?"
                options: ["das Mikrofon ausschalten und zuhören", "laut dazwischenrufen", "nebenbei Musik anmachen"]
                answer: "das Mikrofon ausschalten und zuhören"
                hints:
                  - "Wer redet gerade?"
                  - "Geräusche bei dir stören alle anderen."
                  - "Mikrofon aus und zuhören."
              - id: l2-f5
                type: multiple_choice
                text: "In der Klassengruppe beschimpft jemand Lina. Was ist richtig?"
                options: ["nicht mitmachen und einem Erwachsenen Bescheid sagen", "zurückschimpfen", "ein lachendes Emoji schicken"]
                answer: "nicht mitmachen und einem Erwachsenen Bescheid sagen"
                feedback:
                  "ein lachendes Emoji schicken": "Auch ein lachendes Emoji macht beim Ärgern mit. Lina fühlt sich dann noch schlechter."
                hints:
                  - "Wer kann Lina helfen?"
                  - "Zurückschimpfen macht den Streit größer."
                  - "Nicht mitmachen und einem Erwachsenen Bescheid sagen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Nachricht ist freundlich?"
                options: ["Kannst du mir bitte die Hausaufgaben schicken? 🙂", "SCHICK MIR DIE HAUSAUFGABEN!!!", "hausaufgaben her"]
                answer: "Kannst du mir bitte die Hausaufgaben schicken? 🙂"
                option_audio: false
                hints: ["Welche Nachricht ist eine Bitte?"]
              - id: l2-s2
                type: sorting
                text: "Gute Regel oder keine gute Idee?"
                say: "Sortiere: Ist das eine gute Regel für den Chat oder keine gute Idee?"
                bins:
                  - { id: good, show: { text: "gute Regel" }, say: "gute Regel" }
                  - { id: bad, show: { text: "keine gute Idee" }, say: "keine gute Idee" }
                options:
                  - { text: "auch im Chat bitte und danke schreiben", bin: good }
                  - { text: "bei gemeinen Nachrichten einen Erwachsenen fragen", bin: good }
                  - { text: "einen Kettenbrief an alle weiterschicken", bin: bad }
                  - { text: "über jemanden lästern, der nicht in der Gruppe ist", bin: bad }
                hints: ["Was würdest du auf dem Schulhof auch nicht tun?"]
              - id: l2-s3
                type: true_false
                text: "Du darfst ein Foto deiner Freundin in eine Gruppe stellen, ohne sie zu fragen. Stimmt das?"
                answer: false
                hints: ["Wer entscheidet über ein Foto von dir?"]
              - id: l2-s4
                type: multiple_choice
                text: "Wo setzt du dich für einen Videoanruf am besten hin?"
                options: ["an einen ruhigen Ort", "neben den laufenden Fernseher", "auf den lauten Spielplatz"]
                answer: "an einen ruhigen Ort"
                hints: ["Was sollen die anderen hören?"]
              - id: l2-s5
                type: multiple_choice
                text: "Du bist sehr wütend und willst eine gemeine Nachricht schreiben. Was ist klug?"
                options: ["erst abwarten und später in Ruhe schreiben", "die Nachricht sofort senden", "die Nachricht an alle schicken"]
                answer: "erst abwarten und später in Ruhe schreiben"
                hints: ["Kannst du eine gesendete Nachricht zurückholen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Max schreibt alles in GROSSBUCHSTABEN. Wie wirkt das auf die anderen?"
                say: "Max schreibt alles in Großbuchstaben. Wie wirkt das auf die anderen?"
                options: ["als würde er schreien", "als würde er flüstern", "als wäre er besonders höflich"]
                answer: "als würde er schreien"
              - id: l2-n2
                type: sorting
                text: "Gute Regel oder keine gute Idee?"
                say: "Sortiere: Ist das eine gute Regel für den Chat oder keine gute Idee?"
                bins:
                  - { id: good, show: { text: "gute Regel" }, say: "gute Regel" }
                  - { id: bad, show: { text: "keine gute Idee" }, say: "keine gute Idee" }
                options:
                  - { text: "nur mit Leuten schreiben, die man kennt", bin: good }
                  - { text: "eine Nachricht vor dem Senden noch einmal lesen", bin: good }
                  - { text: "fremden Leuten die eigene Adresse schreiben", bin: bad }
                  - { text: "jemanden wegen eines Fehlers auslachen", bin: bad }
              - id: l2-n3
                type: true_false
                text: "Im Videoanruf reden am besten alle gleichzeitig. Stimmt das?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Ein Unbekannter schreibt dir im Spiele-Chat und will ein Foto von dir. Was tust du?"
                options: ["nicht antworten und einem Erwachsenen Bescheid sagen", "schnell ein Foto schicken", "ihm deine Telefonnummer geben"]
                answer: "nicht antworten und einem Erwachsenen Bescheid sagen"
              - id: l2-n5
                type: multiple_choice
                text: "Emil wird in der Klassengruppe nie gefragt, ob er mitspielen will. Was kannst du tun?"
                options: ["ihm freundlich schreiben und ihn einladen", "so tun, als ob du es nicht merkst", "über ihn lästern"]
                answer: "ihm freundlich schreiben und ihn einladen"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Sara schreibt: „Ich hab mein Fahrrad verloren 😢“\n\nWie fühlt sie sich?"
            say: "Sara schreibt: Ich hab mein Fahrrad verloren. Dahinter steht ein Gesicht mit einer Träne. Wie fühlt sie sich?"
            options: ["traurig", "fröhlich", "stolz"]
            answer: "traurig"
          - id: l2-c2
            type: multiple_choice
            text: "Was heißt kA im Chat?"
            options: ["keine Ahnung", "kein Auto", "komm an"]
            answer: "keine Ahnung"
          - id: l2-c3
            type: multiple_choice
            text: "Welche Nachricht ist freundlich?"
            options: ["Hast du Lust, morgen mit mir zu spielen? 🙂", "SPIEL MORGEN MIT MIR!!!", "morgen spielen, sonst sauer"]
            answer: "Hast du Lust, morgen mit mir zu spielen? 🙂"
            option_audio: false
          - id: l2-c4
            type: sorting
            text: "Gute Regel oder keine gute Idee?"
            say: "Ordne zu: Ist das eine gute Regel für den Chat oder keine gute Idee?"
            bins:
              - { id: good, show: { text: "gute Regel" }, say: "gute Regel" }
              - { id: bad, show: { text: "keine gute Idee" }, say: "keine gute Idee" }
            options:
              - { text: "freundlich bleiben, auch wenn man sich ärgert", bin: good }
              - { text: "Fotos von anderen nur mit Erlaubnis teilen", bin: good }
              - { text: "eine gemeine Nachricht sofort abschicken", bin: bad }
