# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.two-syllable-words
skill: lit-de.decoding.two-syllable-words
curriculum: de-DE
language: de
title:
  de: Wörter mit zwei Silben lesen
  en: Reading two-syllable words
summary: >
  Children read words of two syllables bit by bit: first syllable, second
  syllable, then the whole word. Syllable arcs show where to split. Lesson
  1 reads words whose first syllable ends in a vowel (Na-se, O-fen,
  Pu-del); lesson 2 reads words with a closed first syllable (Son-ne,
  Tas-se, Kis-te), where two consonants meet in the middle, and ends with
  the skill check. Only letters already taught are used (up to P, K, B, F).
metadata:
  year: klasse-1
  topic: { de: Silben lesen, en: Reading syllables }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.one-syllable-words, lit-de.letters.p-k-b-f]
  also_practises: [lit-de.phonological.syllables]
  vocabulary: { de: [Silbe, Silbenbogen, Wort] }
  forms: [audio, drawn, picture]
  drawn: [syllable-arcs, word-card]
  facets: []
  misconceptions:
    - id: first-syllable-guess
      what: Reads the first syllable and guesses the rest, so Sofa becomes Sonne and Tonne becomes Tanne
      addressed: "options share the first syllable; feedback on l1-f1 and l2-f2 asks the child to read the second arc too"
    - id: letter-by-letter
      what: Spells out every letter (T-a-s-s-e) and loses the word, instead of reading syllable by syllable
      addressed: "Learn reads arc by arc; hints say each syllable whole (Tas ... se), never single letters"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Bogen für Bogen, en: Arc by arc }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Mond" }
            options: [{ object: moon }, { object: mouth }]
            answer: moon
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "Nest." }
            options: ["Nest", "Ast", "Mist"]
            answer: "Nest"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Na se"
            say: "Dieses Wort hat zwei Bögen. Lies den ersten Bogen: Na. Lies den zweiten Bogen: se. Jetzt zusammen: Nase."
            show: { drawn: syllable-arcs, word: "Nase", syllables: ["Na", "se"] }
          - text: "Nase"
            say: "Nase. Erst Silbe für Silbe, dann das ganze Wort."
            show: { object: nose }
          - text: "O fen"
            say: "Auch hier: O ... fen. Ofen. Lies immer beide Bögen bis zum Ende."
            show: { drawn: syllable-arcs, word: "Ofen", syllables: ["O", "fen"] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Ofen", syllables: ["O", "fen"] }
                options: [{ object: oven }, { object: grandma }, { object: ear }]
                answer: oven
                feedback:
                  grandma: "Oma fängt auch mit O an. Lies den zweiten Bogen: fen. O ... fen."
                  ear: "Ohr hat nur eine Silbe. Hier sind zwei Bögen."
                hints:
                  - "Lies erst den ersten Bogen, dann den zweiten."
                  - "O ... fen."
                  - "Ofen."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Pudel." }
                options: ["Pudel", "Nudel", "Pute"]
                answer: "Pudel"
                hints:
                  - "Lies jedes Wort Silbe für Silbe."
                  - "Das Wort fängt mit Pu an und hört mit del auf."
                  - "Pu ... del. Pudel."
              - id: l1-f3
                type: ordering
                text: "Bau das Wort."
                say: "Nase. Leg die Silben in die richtige Reihenfolge."
                show: { object: nose }
                options: ["se", "Na"]
                slot_count: 2
                answer: ["Na", "se"]
                hints:
                  - "Welche Silbe hörst du zuerst?"
                  - "Sprich das Wort langsam: Na ... se."
                  - "Erst Na, dann se."
              - id: l1-f4
                type: true_false
                text: "Lies das Wort. Ist das ein Tier?"
                say: "Lies das Wort. Ist das ein Tier?"
                show: { drawn: syllable-arcs, word: "Esel", syllables: ["E", "sel"] }
                answer: true
                hints:
                  - "Lies Bogen für Bogen."
                  - "E ... sel."
                  - "Da steht Esel. Ein Esel ist ein Tier. Ja."
              - id: l1-f5
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Dose. Welche Silbe fehlt?"
                frame: "Do_"
                options: ["se", "fe", "me"]
                answer: ["se"]
                hints:
                  - "Sprich das Wort langsam: Do ... se."
                  - "Die zweite Silbe fängt mit einem s an."
                  - "Es fehlt se."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Lama", syllables: ["La", "ma"] }
                options: [{ object: mum }, { object: llama }, { object: lamp }]
                answer: llama
                hints: ["La ... ma."]
              - id: l1-s2
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Nudel." }
                options: ["Nadel", "Nudel", "Pudel"]
                answer: "Nudel"
                hints: ["Nach dem N kommt ein u."]
              - id: l1-s3
                type: true_false
                text: "Lies das Wort. Kann man das essen?"
                say: "Lies das Wort. Kann man das essen?"
                show: { drawn: syllable-arcs, word: "Sofa", syllables: ["So", "fa"] }
                answer: false
                hints: ["So ... fa. Was ist das?"]
              - id: l1-s4
                type: ordering
                text: "Bau das Wort."
                say: "Ofen. Leg die Silben."
                show: { object: oven }
                options: ["fen", "O"]
                slot_count: 2
                answer: ["O", "fen"]
                hints: ["O ... fen."]
              - id: l1-s5
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Limo. Welche Silbe fehlt?"
                frame: "_mo"
                options: ["Li", "La", "Lo"]
                answer: ["Li"]
                hints: ["Li ... mo. Hör auf den Selbstlaut."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Nase", syllables: ["Na", "se"] }
                options: [{ object: ear }, { object: nose }, { object: mouth }]
                answer: nose
              - id: l1-n2
                type: true_false
                text: "Lies das Wort. Kann man darauf sitzen?"
                say: "Lies das Wort. Kann man darauf sitzen?"
                show: { drawn: syllable-arcs, word: "Sofa", syllables: ["So", "fa"] }
                answer: true
              - id: l1-n3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Dose." }
                options: ["Dose", "Nase", "Dame"]
                answer: "Dose"
              - id: l1-n4
                type: ordering
                text: "Bau das Wort."
                say: "Pudel. Leg die Silben."
                options: ["del", "Pu"]
                slot_count: 2
                answer: ["Pu", "del"]
              - id: l1-n5
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Esel. Welche Silbe fehlt?"
                frame: "E_"
                options: ["sel", "fen", "se"]
                answer: ["sel"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Ofen" }
            options: [{ object: oven }, { object: ear }, { object: grandma }]
            answer: oven
          - id: l1-c2
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "Sofa." }
            options: ["Sofa", "Sonne", "Dose"]
            answer: "Sofa"
          - id: l1-c3
            type: true_false
            text: "Lies das Wort. Ist das ein Tier?"
            say: "Lies das Wort. Ist das ein Tier?"
            show: { drawn: syllable-arcs, word: "Nudel", syllables: ["Nu", "del"] }
            answer: false

  - n: 2
    title: { de: Zwei Buchstaben in der Mitte, en: Two letters in the middle }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: syllable-arcs, word: "Oma", syllables: ["O", "ma"] }
            options: [{ object: oven }, { object: grandma }]
            answer: grandma
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Bau das Wort."
            say: "Sofa. Leg die Silben."
            show: { object: sofa }
            options: ["fa", "So"]
            slot_count: 2
            answer: ["So", "fa"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Son ne"
            say: "Hier stehen in der Mitte zwei gleiche Buchstaben: n und n. Der Bogen teilt sie. Son ... ne. Sonne."
            show: { drawn: syllable-arcs, word: "Sonne", syllables: ["Son", "ne"] }
          - text: "Sonne"
            say: "Sonne. Der erste Bogen ist kurz und hört mit n auf."
            show: { object: sun }
          - text: "Kis te"
            say: "Auch zwei verschiedene Buchstaben in der Mitte teilt der Bogen: s und t. Kis ... te. Kiste."
            show: { drawn: syllable-arcs, word: "Kiste", syllables: ["Kis", "te"] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Tasse", syllables: ["Tas", "se"] }
                options: [{ object: cup }, { object: jug }, { object: fir-tree }]
                answer: cup
                hints:
                  - "Lies erst den ersten Bogen, dann den zweiten."
                  - "Tas ... se."
                  - "Tasse."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Tonne", syllables: ["Ton", "ne"] }
                options: [{ object: sun }, { object: bin }, { object: fir-tree }]
                answer: bin
                feedback:
                  sun: "Sonne fängt mit S an. Lies den ersten Buchstaben: T. Ton ... ne."
                  fir-tree: "Tanne hat ein a. Hier steht ein o: Ton ... ne."
                hints:
                  - "Lies jeden Buchstaben im ersten Bogen."
                  - "Ton ... ne."
                  - "Tonne."
              - id: l2-f3
                type: ordering
                text: "Bau das Wort."
                say: "Kiste. Leg die Silben."
                show: { object: box }
                options: ["te", "Kis"]
                slot_count: 2
                answer: ["Kis", "te"]
                hints:
                  - "Welche Silbe hörst du zuerst?"
                  - "Sprich das Wort langsam: Kis ... te."
                  - "Erst Kis, dann te."
              - id: l2-f4
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Ente." }
                options: ["Ente", "Tante", "Enkel"]
                answer: "Ente"
                hints:
                  - "Lies jedes Wort Silbe für Silbe."
                  - "Das Wort fängt mit En an."
                  - "En ... te. Ente."
              - id: l2-f5
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Affe. Welche Silbe fehlt?"
                show: { object: monkey }
                frame: "_fe"
                options: ["Af", "Ap", "Of"]
                answer: ["Af"]
                hints:
                  - "Sprich langsam: Af ... fe."
                  - "Die erste Silbe fängt mit a an und hört mit f auf."
                  - "Es fehlt Af."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Kanne", syllables: ["Kan", "ne"] }
                options: [{ object: fir-tree }, { object: jug }, { object: cup }]
                answer: jug
                hints: ["Kan ... ne."]
              - id: l2-s2
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Tanne." }
                options: ["Tonne", "Tanne", "Kanne"]
                answer: "Tanne"
                hints: ["Nach dem T kommt ein a."]
              - id: l2-s3
                type: true_false
                text: "Lies das Wort. Ist das ein Tier?"
                say: "Lies das Wort. Ist das ein Tier?"
                show: { drawn: syllable-arcs, word: "Affe", syllables: ["Af", "fe"] }
                answer: true
                hints: ["Af ... fe."]
              - id: l2-s4
                type: ordering
                text: "Bau das Wort."
                say: "Tasse. Leg die Silben."
                options: ["se", "Tas"]
                slot_count: 2
                answer: ["Tas", "se"]
                hints: ["Tas ... se."]
              - id: l2-s5
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Sonne. Welche Silbe fehlt?"
                show: { object: sun }
                frame: "Son_"
                options: ["ne", "se", "te"]
                answer: ["ne"]
                hints: ["Son ... ne."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Tanne", syllables: ["Tan", "ne"] }
                options: [{ object: jug }, { object: bin }, { object: fir-tree }]
                answer: fir-tree
              - id: l2-n2
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Kiste." }
                options: ["Kiste", "Kasse", "Kissen"]
                answer: "Kiste"
              - id: l2-n3
                type: true_false
                text: "Lies das Wort. Kann man daraus trinken?"
                say: "Lies das Wort. Kann man daraus trinken?"
                show: { drawn: syllable-arcs, word: "Tasse", syllables: ["Tas", "se"] }
                answer: true
              - id: l2-n4
                type: ordering
                text: "Bau das Wort."
                say: "Ente. Leg die Silben."
                options: ["te", "En"]
                slot_count: 2
                answer: ["En", "te"]
              - id: l2-n5
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Sonne", syllables: ["Son", "ne"] }
                options: [{ object: bin }, { object: sun }, { object: moon }]
                answer: sun

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Kanne" }
            options: [{ object: jug }, { object: fir-tree }, { object: bin }]
            answer: jug
          - id: l2-c2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Nase" }
            options: [{ object: oven }, { object: nose }, { object: ear }]
            answer: nose
          - id: l2-c3
            type: audio_choice
            text: "Hör zu. Welches Wort ist das?"
            audio: { de: "Tonne." }
            options: ["Tanne", "Sonne", "Tonne"]
            answer: "Tonne"
          - id: l2-c4
            type: true_false
            text: "Lies das Wort. Ist das ein Tier?"
            say: "Lies das Wort. Ist das ein Tier?"
            show: { drawn: word-card, text: "Pudel" }
            answer: true
          - id: l2-c5
            type: ordering
            text: "Bau das Wort."
            say: "Kanne. Leg die Silben."
            show: { object: jug }
            options: ["ne", "Kan", "Ka"]
            slot_count: 2
            answer: ["Kan", "ne"]
