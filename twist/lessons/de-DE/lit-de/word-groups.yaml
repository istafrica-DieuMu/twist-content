# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.word-groups
skill: lit-de.fluency.word-groups
curriculum: de-DE
language: de
title:
  de: Wortgruppen blitzlesen
  en: Flash reading phrases
summary: >
  Taking in short phrases at a glance. Lesson 1 flashes a phrase for two
  seconds and the child picks what was written from phrases that differ in
  one small word; lesson 2 finds the word groups inside a sentence, reads
  a sentence in groups instead of word by word, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Blitzlesen, en: Flash reading }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.fluency.sight-words-longer]
  also_practises: [lit-de.fluency.sight-words-longer]
  vocabulary: { de: [Wortgruppe, Blitzlesen, Blick, zusammengehören] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: only-first-word
      what: Reads the first word of a phrase and guesses the rest, so small words (dem, den, unter, auf) slip by
      addressed: "every flash task offers phrases that differ only in a small word (l1-f1, l1-f3, l1-s2, l1-n4); feedback on l1-f1 points at the small word"
    - id: word-by-word
      what: Reads every word on its own and loses which words belong together
      addressed: "lesson 2 Learn shows the sentence in groups; l2-f1, l2-s1 and l2-n1 find a whole group in a sentence, and l2-f4 and l2-n3 split a sentence into its groups"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Auf einen Blick", en: "At a glance" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Lies das Wort schnell. Welches Wort war es?"
            say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
            show: { drawn: letter-card, text: "Fahrrad", flash: 2 }
            options: ["Fahrrad", "Fahrbahn", "Farbe"]
            answer: "Fahrrad"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Lies das Wort schnell. Welches Wort war es?"
            say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
            show: { drawn: letter-card, text: "Schmetterling", flash: 2 }
            options: ["Schmetterling", "Schneeflocke", "Schmeckerling"]
            answer: "Schmetterling"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "auf dem Tisch"
            say: "Diese drei Wörter gehören zusammen. Sie sagen dir, wo etwas ist. So eine Gruppe heißt Wortgruppe."
          - text: "ein kleiner Hund"
            say: "Gute Leser lesen nicht jedes Wort einzeln. Sie sehen die ganze Wortgruppe mit einem Blick: ein kleiner Hund."
          - text: "auf dem Tisch | auf den Tisch | unter dem Tisch"
            say: "Schau trotzdem genau hin. Die kleinen Wörter machen den Unterschied: auf dem Tisch, auf den Tisch, unter dem Tisch."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Lies schnell. Was stand da?"
                say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
                show: { drawn: letter-card, text: "unter dem Bett", flash: 2 }
                options: ["unter dem Bett", "unter den Bett", "neben dem Bett"]
                answer: "unter dem Bett"
                option_audio: false
                feedback:
                  "neben dem Bett": "Schau auf das erste Wort. Es war nicht neben."
                hints:
                  - "Tippe auf Nochmal sehen und lies alle drei Wörter."
                  - "Das erste Wort sagt, wo etwas ist. Hieß es unter oder neben?"
                  - "Da stand: unter dem Bett."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Lies schnell. Was stand da?"
                say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
                show: { drawn: letter-card, text: "eine große Katze", flash: 2 }
                options: ["eine große Katze", "eine graue Katze", "eine große Kasse"]
                answer: "eine große Katze"
                option_audio: false
                hints:
                  - "Tippe auf Nochmal sehen. Achte auf das Wort in der Mitte."
                  - "groß oder grau? Beide fangen mit gr an."
                  - "Da stand: eine große Katze."
              - id: l1-f3
                type: multiple_choice
                text: "Lies schnell. Was stand da?"
                say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
                show: { drawn: letter-card, text: "mit dem Ball", flash: 2 }
                options: ["mit dem Ball", "mit den Ball", "mit einem Ball"]
                answer: "mit dem Ball"
                option_audio: false
                hints:
                  - "Tippe auf Nochmal sehen. Das kleine Wort in der Mitte ist wichtig."
                  - "dem, den oder einem?"
                  - "Da stand: mit dem Ball."
              - id: l1-f4
                type: true_false
                text: "Lies schnell. Stimmt das?"
                say: "Lies die Wortgruppe mit einem Blick. Stand da: am frühen Morgen?"
                show: { drawn: letter-card, text: "am frühen Morgen", flash: 2 }
                answer: true
                hints:
                  - "Tippe auf Nochmal sehen."
                  - "Lies alle drei Wörter: am, frühen, Morgen."
                  - "Ja, da stand: am frühen Morgen."
              - id: l1-f5
                type: true_false
                text: "Lies schnell. Stimmt das?"
                say: "Lies die Wortgruppe mit einem Blick. Stand da: hinter dem Haus?"
                show: { drawn: letter-card, text: "hinter das Haus", flash: 2 }
                answer: false
                hints:
                  - "Tippe auf Nochmal sehen. Lies das kleine Wort genau."
                  - "dem oder das?"
                  - "Nein, da stand: hinter das Haus."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Lies schnell. Was stand da?"
                say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
                show: { drawn: letter-card, text: "ein roter Apfel", flash: 2 }
                options: ["ein roter Apfel", "ein runder Apfel", "ein roter Affe"]
                answer: "ein roter Apfel"
                option_audio: false
                hints: ["Tippe auf Nochmal sehen. Achte auf das zweite und das dritte Wort."]
              - id: l1-s2
                type: multiple_choice
                text: "Lies schnell. Was stand da?"
                say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
                show: { drawn: letter-card, text: "in den Wald", flash: 2 }
                options: ["in den Wald", "in dem Wald", "an den Wald"]
                answer: "in den Wald"
                option_audio: false
                hints: ["Tippe auf Nochmal sehen. Lies die kleinen Wörter genau."]
              - id: l1-s3
                type: true_false
                text: "Lies schnell. Stimmt das?"
                say: "Lies die Wortgruppe mit einem Blick. Stand da: zwei bunte Vögel?"
                show: { drawn: letter-card, text: "zwei bunte Vögel", flash: 2 }
                answer: true
                hints: ["Tippe auf Nochmal sehen und lies alle Wörter."]
              - id: l1-s4
                type: multiple_choice
                text: "Lies schnell. Was stand da?"
                say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
                show: { drawn: letter-card, text: "nach der Schule", flash: 2 }
                options: ["nach der Schule", "vor der Schule", "nach der Schaukel"]
                answer: "nach der Schule"
                option_audio: false
                hints: ["Tippe auf Nochmal sehen. Wann ist es: vor oder nach?"]
              - id: l1-s5
                type: true_false
                text: "Lies schnell. Stimmt das?"
                say: "Lies die Wortgruppe mit einem Blick. Stand da: ganz leise singen?"
                show: { drawn: letter-card, text: "ganz laut singen", flash: 2 }
                answer: false
                hints: ["Tippe auf Nochmal sehen. Lies das zweite Wort genau."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Lies schnell. Was stand da?"
                say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
                show: { drawn: letter-card, text: "über die Brücke", flash: 2 }
                options: ["über die Brücke", "über der Brücke", "unter die Brücke"]
                answer: "über die Brücke"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Lies schnell. Was stand da?"
                say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
                show: { drawn: letter-card, text: "ein langer Zug", flash: 2 }
                options: ["ein langer Zug", "ein lauter Zug", "ein langer Zaun"]
                answer: "ein langer Zug"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Lies schnell. Stimmt das?"
                say: "Lies die Wortgruppe mit einem Blick. Stand da: am Abend?"
                show: { drawn: letter-card, text: "am Abend", flash: 2 }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Lies schnell. Was stand da?"
                say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
                show: { drawn: letter-card, text: "neben dem Fenster", flash: 2 }
                options: ["neben dem Fenster", "neben den Fenstern", "neben dem Felsen"]
                answer: "neben dem Fenster"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Lies schnell. Stimmt das?"
                say: "Lies die Wortgruppe mit einem Blick. Stand da: drei kleine Mäuse?"
                show: { drawn: letter-card, text: "drei kleine Häuser", flash: 2 }
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Lies schnell. Was stand da?"
            say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
            show: { drawn: letter-card, text: "auf der Wiese", flash: 2 }
            options: ["auf der Wiese", "auf die Wiese", "aus der Wiese"]
            answer: "auf der Wiese"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Lies schnell. Was stand da?"
            say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
            show: { drawn: letter-card, text: "ein warmer Pullover", flash: 2 }
            options: ["ein warmer Pullover", "ein weicher Pullover", "ein warmer Pulli"]
            answer: "ein warmer Pullover"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Lies schnell. Stimmt das?"
            say: "Lies die Wortgruppe mit einem Blick. Stand da: in der Küche?"
            show: { drawn: letter-card, text: "in der Küche", flash: 2 }
            answer: true

  - n: 2
    title: { de: "Wortgruppen im Satz", en: "Phrases in a sentence" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Lies schnell. Was stand da?"
            say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
            show: { drawn: letter-card, text: "vor dem Kino", flash: 2 }
            options: ["vor dem Kino", "vor den Kindern", "von dem Kino"]
            answer: "vor dem Kino"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Lies schnell. Stimmt das?"
            say: "Lies die Wortgruppe mit einem Blick. Stand da: ein dicker Hund?"
            show: { drawn: letter-card, text: "ein dicker Hund", flash: 2 }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der kleine Hund | schläft | unter dem Tisch."
            say: "Ein Satz besteht aus Wortgruppen. Wer? Der kleine Hund. Was tut er? Schläft. Wo? Unter dem Tisch."
          - text: "Der kleine Hund schläft unter dem Tisch."
            say: "Lies den Satz in drei Blicken, nicht in sieben. So liest du schneller und verstehst den Satz besser."
          - text: "Am Morgen | fährt | Oma | mit dem Bus | in die Stadt."
            say: "Frag dich beim Lesen: Wann? Wer? Wo oder wohin? Mit wem oder womit? So findest du die Wortgruppen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Wo schläft die Katze? Tippe auf alle Wörter dieser Wortgruppe."
                say: "Lies den Satz. Wo schläft die Katze? Tippe auf alle Wörter, die das sagen."
                show: { drawn: letter-card, text: "Die Katze schläft auf dem Sofa." }
                spans: ["auf", "dem", "Sofa."]
                hints:
                  - "Frag: Wo? Die Antwort hat mehr als ein Wort."
                  - "Das Wort auf gehört dazu und auch die Wörter danach."
                  - "auf dem Sofa."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "„Ein alter Mann sitzt auf der Bank.“ Welche Wörter gehören zusammen?"
                say: "Lies den Satz. Welche Wörter gehören zusammen?"
                options: ["auf der Bank", "sitzt auf", "Mann sitzt"]
                answer: "auf der Bank"
                feedback:
                  "sitzt auf": "Frag: Wo sitzt er? Die Antwort ist eine ganze Wortgruppe."
                hints:
                  - "Frag: Wo sitzt der Mann?"
                  - "Die Antwort beginnt mit auf."
                  - "auf der Bank."
              - id: l2-f3
                type: highlight_in_text
                text: "Wer spielt im Hof? Tippe auf alle Wörter dieser Wortgruppe."
                say: "Lies den Satz. Wer spielt im Hof? Tippe auf alle Wörter, die das sagen."
                show: { drawn: letter-card, text: "Meine beiden Freunde spielen im Hof." }
                spans: ["Meine", "beiden", "Freunde"]
                hints:
                  - "Frag: Wer spielt? Es sind mehrere Wörter."
                  - "Es geht um Freunde. Welche Wörter sagen mehr über sie?"
                  - "Meine beiden Freunde."
              - id: l2-f4
                type: ordering
                text: "Hör zu. Leg die Wortgruppen in die richtige Reihenfolge."
                say: "Lena malt am Nachmittag ein buntes Bild. Leg die Wortgruppen in die richtige Reihenfolge."
                options: ["ein buntes Bild", "Lena", "am Nachmittag", "malt"]
                slot_count: 4
                answer: ["Lena", "malt", "am Nachmittag", "ein buntes Bild"]
                option_audio: false
                hints:
                  - "Hör den Satz noch einmal. Womit fängt er an?"
                  - "Lena, dann was sie tut, dann wann."
                  - "Lena, malt, am Nachmittag, ein buntes Bild."
              - id: l2-f5
                type: multiple_choice
                text: "Wie liest du den Satz gut in Blicken?"
                say: "Wie liest du diesen Satz gut, in wenigen Blicken?"
                options: ["Der Vogel | singt | im Baum.", "Der | Vogel singt im | Baum.", "Der Vogel singt | im | Baum."]
                answer: "Der Vogel | singt | im Baum."
                option_audio: false
                hints:
                  - "Jeder Blick soll Wörter fassen, die zusammengehören."
                  - "Wer? Was tut er? Wo?"
                  - "Der Vogel, singt, im Baum."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Wann geht Ben schwimmen? Tippe auf alle Wörter dieser Wortgruppe."
                say: "Lies den Satz. Wann geht Ben schwimmen? Tippe auf alle Wörter, die das sagen."
                show: { drawn: letter-card, text: "Ben geht jeden Freitag schwimmen." }
                spans: ["jeden", "Freitag"]
                hints: ["Frag: Wann? Die Antwort hat zwei Wörter."]
              - id: l2-s2
                type: multiple_choice
                text: "„Der Bäcker backt frische Brötchen.“ Welche Wörter gehören zusammen?"
                say: "Lies den Satz. Welche Wörter gehören zusammen?"
                options: ["frische Brötchen", "backt frische", "Bäcker backt"]
                answer: "frische Brötchen"
                hints: ["Frag: Was backt der Bäcker?"]
              - id: l2-s3
                type: ordering
                text: "Hör zu. Leg die Wortgruppen in die richtige Reihenfolge."
                say: "Am Sonntag fährt Opa mit dem Rad. Leg die Wortgruppen in die richtige Reihenfolge."
                options: ["mit dem Rad", "fährt", "Am Sonntag", "Opa"]
                slot_count: 4
                answer: ["Am Sonntag", "fährt", "Opa", "mit dem Rad"]
                option_audio: false
                hints: ["Der Satz fängt mit der Zeit an."]
              - id: l2-s4
                type: true_false
                text: "„Das Kind | trinkt ein | Glas Milch.“ Sind das gute Wortgruppen?"
                say: "Lies die Striche genau. Gehören die Wörter so zusammen?"
                answer: false
                hints: ["Frag: Was trinkt das Kind?"]
              - id: l2-s5
                type: multiple_choice
                text: "Wie liest du den Satz gut in Blicken?"
                say: "Wie liest du diesen Satz gut, in wenigen Blicken?"
                options: ["Die Kinder | rennen | über den Sportplatz.", "Die | Kinder rennen über | den Sportplatz.", "Die Kinder rennen | über | den | Sportplatz."]
                answer: "Die Kinder | rennen | über den Sportplatz."
                option_audio: false
                hints: ["Wer? Was tun sie? Wo?"]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Wohin springt der Frosch? Tippe auf alle Wörter dieser Wortgruppe."
                say: "Lies den Satz. Wohin springt der Frosch? Tippe auf alle Wörter, die das sagen."
                show: { drawn: letter-card, text: "Der grüne Frosch springt in den Teich." }
                spans: ["in", "den", "Teich."]
              - id: l2-n2
                type: multiple_choice
                text: "„Mia trägt einen gelben Regenmantel.“ Welche Wörter gehören zusammen?"
                say: "Lies den Satz. Welche Wörter gehören zusammen?"
                options: ["einen gelben Regenmantel", "Mia trägt einen", "trägt einen gelben"]
                answer: "einen gelben Regenmantel"
              - id: l2-n3
                type: ordering
                text: "Hör zu. Leg die Wortgruppen in die richtige Reihenfolge."
                say: "Mein Bruder liest im Bett ein spannendes Buch. Leg die Wortgruppen in die richtige Reihenfolge."
                options: ["im Bett", "ein spannendes Buch", "liest", "Mein Bruder"]
                slot_count: 4
                answer: ["Mein Bruder", "liest", "im Bett", "ein spannendes Buch"]
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "„Am Abend | leuchten | die Sterne.“ Sind das gute Wortgruppen?"
                say: "Lies die Striche genau. Gehören die Wörter so zusammen?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Lies schnell. Was stand da?"
                say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
                show: { drawn: letter-card, text: "mit seinem besten Freund", flash: 2 }
                options: ["mit seinem besten Freund", "mit seinen besten Freunden", "mit seinem bunten Freund"]
                answer: "mit seinem besten Freund"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Lies schnell. Was stand da?"
            say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
            show: { drawn: letter-card, text: "hinter dem großen Baum", flash: 2 }
            options: ["hinter dem großen Baum", "hinter den großen Bäumen", "hinter dem grünen Baum"]
            answer: "hinter dem großen Baum"
            option_audio: false
          - id: l2-c2
            type: true_false
            text: "Lies schnell. Stimmt das?"
            say: "Lies die Wortgruppe mit einem Blick. Stand da: in die Schule?"
            show: { drawn: letter-card, text: "in der Schule", flash: 2 }
            answer: false
          - id: l2-c3
            type: highlight_in_text
            text: "Womit fährt Papa zur Arbeit? Tippe auf alle Wörter dieser Wortgruppe."
            say: "Lies den Satz. Womit fährt Papa zur Arbeit? Tippe auf alle Wörter, die das sagen."
            show: { drawn: letter-card, text: "Papa fährt mit der Straßenbahn zur Arbeit." }
            spans: ["mit", "der", "Straßenbahn"]
          - id: l2-c4
            type: ordering
            text: "Hör zu. Leg die Wortgruppen in die richtige Reihenfolge."
            say: "Im Winter baut Jonas einen Schneemann. Leg die Wortgruppen in die richtige Reihenfolge."
            options: ["Jonas", "einen Schneemann", "Im Winter", "baut"]
            slot_count: 4
            answer: ["Im Winter", "baut", "Jonas", "einen Schneemann"]
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Wie liest du den Satz gut in Blicken?"
            say: "Wie liest du diesen Satz gut, in wenigen Blicken?"
            options: ["Die alte Frau | füttert | die Enten.", "Die alte | Frau füttert | die Enten.", "Die | alte Frau füttert die | Enten."]
            answer: "Die alte Frau | füttert | die Enten."
            option_audio: false
