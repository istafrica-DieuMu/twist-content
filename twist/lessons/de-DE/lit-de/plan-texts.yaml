# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.plan-texts
skill: lit-de.writing.plan
curriculum: de-DE
language: de
title:
  de: Ideen sammeln und planen
  en: Collecting ideas and planning
summary: >
  Planning before writing. Lesson 1 collects ideas in a Cluster: the
  Thema in the middle, Stichwörter around it, questions that bring ideas
  (Wer? Wo? Was passiert?), and only ideas that fit the Thema; lesson 2
  crosses out ideas that do not fit, turns the rest into a Schreibplan
  with Anfang, Mitte and Schluss, and ends with the skill check. Drawing
  a Cluster freely waits for a free text task type; here the child
  chooses, sorts and orders ideas.
metadata:
  year: klasse-2
  topic: { de: Texte planen, en: Planning writing }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.writing.story-pictures]
  also_practises: [lit-de.writing.story-pictures]
  vocabulary: { de: [Thema, Idee, Cluster, Stichwort, Schreibplan, Anfang, Mitte, Schluss, roter Faden] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: off-topic-ideas
      what: Collects ideas that do not fit the Thema and keeps them in the text
      addressed: "lesson 1 Learn puts the Thema in the middle; \"Welche Idee passt?\" in every stage (l1-f1 with feedback, l1-s1, l1-n1, l1-c1, l2-w1, l2-c1); ideas are sorted by Thema (l1-f2, l1-s2, l1-n2, l1-c2, l2-c4); lesson 2 Learn crosses out Hausaufgaben and every stage crosses out an idea (l2-f1 with feedback, l2-s1, l2-n1, l2-c2); l1-f5, l1-n5 and l2-f5 ask whether all ideas fit"
    - id: no-order
      what: Writes the ideas down in the order they came, with no plan for Anfang, Mitte and Schluss
      addressed: "lesson 2 Learn turns the ideas into a Schreibplan; every stage of lesson 2 orders a plan (l2-f2, l2-s2, l2-n2, l2-c3) and matches Anfang, Mitte and Schluss (l2-f3, l2-s3, l2-n3); l2-f4, l2-s4 and l2-n4 ask what the plan and its parts are for"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ideen sammeln im Cluster", en: "Collecting ideas in a mind map" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Satz ist ein guter Anfang für eine Geschichte?"
            say: "Welcher Satz ist ein guter Anfang für eine Geschichte?"
            options: ["An einem kalten Morgen ging Noah mit seinem Hund spazieren.", "Am Ende schliefen alle.", "Zum Glück war alles gut."]
            answer: "An einem kalten Morgen ging Noah mit seinem Hund spazieren."
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Paula wartete auf den Bus. _ fing es an zu regnen."
            options: ["Plötzlich", "Am Ende", "Eines Tages"]
            answer: ["Plötzlich"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Thema in der Mitte: Mein Geburtstag\nIdeen drum herum: Kuchen, Freunde, Geschenke, Spiele, Luftballons"
            say: "Bevor du schreibst, sammelst du Ideen. Das geht gut mit einem Cluster. In die Mitte schreibst du dein Thema. Drum herum schreibst du alles, was dir dazu einfällt."
          - text: "Kuchen | Freunde | Geschenke"
            say: "Im Cluster stehen nur Stichwörter, keine ganzen Sätze. So geht es schnell, und du vergisst keine Idee."
          - text: "Wer? | Wo? | Wann? | Was passiert?"
            say: "Wenn dir nichts einfällt, helfen Fragen. Wer ist dabei? Wo und wann ist es? Was passiert?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Thema: Ein Tag am Meer\n\nWelche Idee passt in den Cluster?"
                say: "Das Thema ist: Ein Tag am Meer. Welche Idee passt in den Cluster?"
                options: ["Sandburg", "Schneemann", "Schultasche"]
                answer: "Sandburg"
                feedback:
                  "Schneemann": "Einen Schneemann baust du im Winter, nicht am Meer."
                hints:
                  - "Stell dir einen Tag am Meer vor. Was machst du dort?"
                  - "Am Meer gibt es Sand und Wasser."
                  - "Sandburg."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Zu welchem Thema passt die Idee?"
                say: "Sortiere die Ideen: Zoo oder Schwimmbad?"
                bins:
                  - { id: zoo, show: { text: "Zoo" }, say: "Zoo" }
                  - { id: pool, show: { text: "Schwimmbad" }, say: "Schwimmbad" }
                options:
                  - { text: "Affen", bin: zoo }
                  - { text: "Rutsche", bin: pool }
                  - { text: "Elefanten", bin: zoo }
                  - { text: "Sprungbrett", bin: pool }
                hints:
                  - "Wo siehst du Tiere, wo springst du ins Wasser?"
                  - "Affen und Elefanten leben im Zoo."
                  - "Affen und Elefanten: Zoo. Rutsche und Sprungbrett: Schwimmbad."
              - id: l1-f3
                type: multiple_choice
                text: "Was schreibst du in die Mitte des Clusters?"
                say: "Was schreibst du in die Mitte des Clusters?"
                options: ["das Thema", "den Schluss", "deinen Namen"]
                answer: "das Thema"
                hints:
                  - "Um die Mitte herum stehen die Ideen."
                  - "Worum geht es bei allen Ideen?"
                  - "Das Thema."
              - id: l1-f4
                type: multiple_choice
                text: "Was gehört in einen Cluster?"
                say: "Was gehört in einen Cluster?"
                options: ["Stichwörter wie Kuchen und Geschenke", "eine ganze Geschichte", "nur ein einziges Wort"]
                answer: "Stichwörter wie Kuchen und Geschenke"
                hints:
                  - "Ein Cluster soll schnell gehen."
                  - "Du schreibst keine Sätze, sondern kurze Wörter."
                  - "Stichwörter."
              - id: l1-f5
                type: true_false
                text: "Thema: Mein Haustier\nIdeen: Futter, Käfig, Spielen, Hausaufgaben\n\nPassen alle Ideen zum Thema?"
                say: "Lies das Thema und die Ideen. Passen alle Ideen zum Thema?"
                answer: false
                hints:
                  - "Prüf jede Idee: Hat sie mit dem Haustier zu tun?"
                  - "Was hat nichts mit einem Tier zu tun?"
                  - "Nein, die Hausaufgaben passen nicht."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Thema: Im Winter\n\nWelche Idee passt in den Cluster?"
                say: "Das Thema ist: Im Winter. Welche Idee passt in den Cluster?"
                options: ["Schlitten fahren", "Freibad", "Erdbeeren pflücken"]
                answer: "Schlitten fahren"
                hints: ["Was machst du, wenn es kalt ist und schneit?"]
              - id: l1-s2
                type: sorting
                text: "Zu welchem Thema passt die Idee?"
                say: "Sortiere die Ideen: Geburtstag oder Wald?"
                bins:
                  - { id: party, show: { text: "Geburtstag" }, say: "Geburtstag" }
                  - { id: wood, show: { text: "Wald" }, say: "Wald" }
                options:
                  - { text: "Kerzen", bin: party }
                  - { text: "Pilze", bin: wood }
                  - { text: "Geschenke", bin: party }
                  - { text: "Bäume", bin: wood }
                hints: ["Was gibt es auf einem Fest, was draußen im Wald?"]
              - id: l1-s3
                type: multiple_choice
                text: "Lina will über ihren Hund schreiben. Welche Frage hilft ihr, Ideen zu finden?"
                say: "Lina will über ihren Hund schreiben. Welche Frage hilft ihr, Ideen zu finden?"
                options: ["Was macht mein Hund gern?", "Wie spät ist es?", "Was esse ich morgen?"]
                answer: "Was macht mein Hund gern?"
                hints: ["Die Frage muss mit dem Hund zu tun haben."]
              - id: l1-s4
                type: multiple_choice
                text: "Was ist ein Cluster?"
                say: "Was ist ein Cluster?"
                options: ["eine Ideensammlung rund um ein Thema", "ein langer Brief", "ein Gedicht mit elf Wörtern"]
                answer: "eine Ideensammlung rund um ein Thema"
                hints: ["Denk an das Thema in der Mitte."]
              - id: l1-s5
                type: true_false
                text: "In einen Cluster schreibst du lange Sätze. Stimmt das?"
                say: "In einen Cluster schreibst du lange Sätze. Stimmt das?"
                answer: false
                hints: ["Denk an Kuchen, Freunde, Geschenke."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Thema: Unser Schulfest\n\nWelche Idee passt in den Cluster?"
                say: "Das Thema ist: Unser Schulfest. Welche Idee passt in den Cluster?"
                options: ["Kuchenverkauf", "Zahnarzt", "Weihnachtsbaum"]
                answer: "Kuchenverkauf"
              - id: l1-n2
                type: sorting
                text: "Zu welchem Thema passt die Idee?"
                say: "Sortiere die Ideen: Bauernhof oder Weltraum?"
                bins:
                  - { id: farm, show: { text: "Bauernhof" }, say: "Bauernhof" }
                  - { id: space, show: { text: "Weltraum" }, say: "Weltraum" }
                options:
                  - { text: "Kühe", bin: farm }
                  - { text: "Rakete", bin: space }
                  - { text: "Traktor", bin: farm }
                  - { text: "Sterne", bin: space }
              - id: l1-n3
                type: multiple_choice
                text: "Ben will über einen Ausflug schreiben. Welche Frage hilft ihm, Ideen zu finden?"
                say: "Ben will über einen Ausflug schreiben. Welche Frage hilft ihm, Ideen zu finden?"
                options: ["Wo waren wir?", "Wie heißt mein Lehrer?", "Welche Farbe hat mein Stift?"]
                answer: "Wo waren wir?"
              - id: l1-n4
                type: multiple_choice
                text: "Wo steht im Cluster das Thema?"
                say: "Wo steht im Cluster das Thema?"
                options: ["in der Mitte", "ganz unten", "gar nicht"]
                answer: "in der Mitte"
              - id: l1-n5
                type: true_false
                text: "Thema: Herbst\nIdeen: Drachen steigen lassen, bunte Blätter, Kastanien sammeln\n\nPassen alle Ideen zum Thema?"
                say: "Lies das Thema und die Ideen. Passen alle Ideen zum Thema?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Thema: Auf dem Spielplatz\n\nWelche Idee passt in den Cluster?"
            say: "Das Thema ist: Auf dem Spielplatz. Welche Idee passt in den Cluster?"
            options: ["Schaukel", "Badewanne", "Tafel"]
            answer: "Schaukel"
          - id: l1-c2
            type: sorting
            text: "Zu welchem Thema passt die Idee?"
            say: "Sortiere die Ideen: Sommer oder Winter?"
            bins:
              - { id: summer, show: { text: "Sommer" }, say: "Sommer" }
              - { id: winter, show: { text: "Winter" }, say: "Winter" }
            options:
              - { text: "Eis essen", bin: summer }
              - { text: "Schlitten", bin: winter }
              - { text: "im See baden", bin: summer }
              - { text: "Schneeball", bin: winter }
          - id: l1-c3
            type: true_false
            text: "Im Cluster stehen Stichwörter rund um das Thema. Stimmt das?"
            say: "Im Cluster stehen Stichwörter rund um das Thema. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Der Schreibplan", en: "The writing plan" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Thema: Im Zoo\n\nWelche Idee passt in den Cluster?"
            say: "Das Thema ist: Im Zoo. Welche Idee passt in den Cluster?"
            options: ["Löwen beim Fressen zusehen", "Hausaufgaben", "Schneemann"]
            answer: "Löwen beim Fressen zusehen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "In die Mitte des Clusters schreibst du das Thema. Stimmt das?"
            say: "In die Mitte des Clusters schreibst du das Thema. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Thema: Mein Geburtstag\nIdeen: Kuchen, Freunde kommen, Geschenke, Schatzsuche, Hausaufgaben"
            say: "Nicht jede Idee passt. Hausaufgaben haben mit dem Geburtstag nichts zu tun. Die streichst du durch. So bleibt dein Text bei seinem Thema, wie an einem roten Faden."
          - text: "Schreibplan\nAnfang: Freunde kommen\nMitte: Schatzsuche, der Schatz ist weg\nSchluss: Kuchen und Geschenke"
            say: "Dann machst du einen Schreibplan. Du legst fest, was an den Anfang kommt, was in die Mitte und was an den Schluss."
          - text: "Erst planen, dann schreiben."
            say: "Mit dem Schreibplan weißt du beim Schreiben immer, was als Nächstes kommt. Du schreibst einen Teil nach dem anderen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Thema: Unser Ausflug zum See\nIdeen: Picknick, Enten füttern, Mathearbeit, Boot fahren\n\nWelche Idee streichst du?"
                say: "Lies das Thema und die Ideen. Welche Idee streichst du?"
                options: ["Mathearbeit", "Picknick", "Enten füttern"]
                answer: "Mathearbeit"
                feedback:
                  "Picknick": "Ein Picknick passt gut zum Ausflug. Welche Idee hat nichts mit dem See zu tun?"
                hints:
                  - "Du streichst die Idee, die nicht zum Thema passt."
                  - "Was macht man nicht bei einem Ausflug zum See?"
                  - "Die Mathearbeit."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Schreibplan: Der verlorene Schlüssel. Bring die Teile in die richtige Reihenfolge."
                say: "Bring den Schreibplan für die Geschichte Der verlorene Schlüssel in die richtige Reihenfolge."
                options: ["Mama findet ihn im Blumentopf.", "Wir suchen überall.", "Wir kommen nach Hause, aber der Schlüssel ist weg."]
                slot_count: 3
                answer: ["Wir kommen nach Hause, aber der Schlüssel ist weg.", "Wir suchen überall.", "Mama findet ihn im Blumentopf."]
                hints:
                  - "Am Anfang steht, was los ist. Am Schluss, wie es ausgeht."
                  - "Erst muss der Schlüssel weg sein, dann sucht man ihn."
                  - "Schlüssel weg, suchen, Mama findet ihn."
              - id: l2-f3
                type: matching
                text: "Anfang, Mitte oder Schluss?"
                say: "Thema: Picknick am See. Verbinde jeden Teil des Schreibplans mit der passenden Idee."
                pairs:
                  - { left: { text: "Anfang" }, right: { text: "Wir packen den Picknickkorb." } }
                  - { left: { text: "Mitte" }, right: { text: "Eine Ente klaut unser Brot." } }
                  - { left: { text: "Schluss" }, right: { text: "Wir fahren müde nach Hause." } }
                hints:
                  - "Was passiert zuerst, was ist das Besondere, wie endet der Tag?"
                  - "Das Besondere kommt in die Mitte."
                  - "Anfang: Korb packen. Mitte: die Ente. Schluss: nach Hause."
              - id: l2-f4
                type: multiple_choice
                text: "Wozu machst du einen Schreibplan?"
                say: "Wozu machst du einen Schreibplan?"
                options: ["damit du weißt, was als Nächstes kommt", "damit der Text länger wird", "damit du keine Überschrift brauchst"]
                answer: "damit du weißt, was als Nächstes kommt"
                hints:
                  - "Im Schreibplan stehen Anfang, Mitte und Schluss."
                  - "Was hilft dir beim Schreiben, wenn die Reihenfolge schon feststeht?"
                  - "Damit du weißt, was als Nächstes kommt."
              - id: l2-f5
                type: true_false
                text: "Eine Idee passt nicht zum Thema. Du lässt sie trotzdem im Text. Ist das gut?"
                say: "Eine Idee passt nicht zum Thema. Du lässt sie trotzdem im Text. Ist das gut?"
                answer: false
                hints:
                  - "Denk an den roten Faden."
                  - "Was passierte mit den Hausaufgaben im Geburtstags-Cluster?"
                  - "Nein, die Idee streichst du."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Thema: Mein Hamster\nIdeen: Laufrad, Körner, Fußballspiel, Streu\n\nWelche Idee streichst du?"
                say: "Lies das Thema und die Ideen. Welche Idee streichst du?"
                options: ["Fußballspiel", "Laufrad", "Körner"]
                answer: "Fußballspiel"
                hints: ["Was hat nichts mit einem Hamster zu tun?"]
              - id: l2-s2
                type: ordering
                text: "Schreibplan: Ein Tag im Schnee. Bring die Teile in die richtige Reihenfolge."
                say: "Bring den Schreibplan für Ein Tag im Schnee in die richtige Reihenfolge."
                options: ["Wir trinken drinnen heißen Kakao.", "Wir ziehen unsere Schneeanzüge an.", "Wir bauen einen Schneemann."]
                slot_count: 3
                answer: ["Wir ziehen unsere Schneeanzüge an.", "Wir bauen einen Schneemann.", "Wir trinken drinnen heißen Kakao."]
                hints: ["Was musst du machen, bevor du nach draußen gehst?"]
              - id: l2-s3
                type: matching
                text: "Anfang, Mitte oder Schluss?"
                say: "Thema: Angeln mit Opa. Verbinde jeden Teil des Schreibplans mit der passenden Idee."
                pairs:
                  - { left: { text: "Anfang" }, right: { text: "Opa holt mich ab." } }
                  - { left: { text: "Mitte" }, right: { text: "Ein großer Fisch beißt an." } }
                  - { left: { text: "Schluss" }, right: { text: "Wir grillen den Fisch." } }
                hints: ["Das Spannende kommt in die Mitte."]
              - id: l2-s4
                type: multiple_choice
                text: "Was schreibst du im Schreibplan beim Schluss auf?"
                say: "Was schreibst du im Schreibplan beim Schluss auf?"
                options: ["wie die Geschichte ausgeht", "wer mitspielt", "das Thema"]
                answer: "wie die Geschichte ausgeht"
                hints: ["Der Schluss ist das Ende."]
              - id: l2-s5
                type: true_false
                text: "Zuerst planst du, dann schreibst du. Stimmt das?"
                say: "Zuerst planst du, dann schreibst du. Stimmt das?"
                answer: true
                hints: ["Wann machst du den Schreibplan?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Thema: Der erste Schultag\nIdeen: Schultüte, neue Lehrerin, Sandburg, Klassenzimmer\n\nWelche Idee streichst du?"
                say: "Lies das Thema und die Ideen. Welche Idee streichst du?"
                options: ["Sandburg", "Schultüte", "neue Lehrerin"]
                answer: "Sandburg"
              - id: l2-n2
                type: ordering
                text: "Schreibplan: Das Laternenfest. Bring die Teile in die richtige Reihenfolge."
                say: "Bring den Schreibplan für Das Laternenfest in die richtige Reihenfolge."
                options: ["Am Ende singen alle und gehen nach Hause.", "Wir basteln Laternen.", "Wir laufen mit den Laternen durch die Straßen."]
                slot_count: 3
                answer: ["Wir basteln Laternen.", "Wir laufen mit den Laternen durch die Straßen.", "Am Ende singen alle und gehen nach Hause."]
              - id: l2-n3
                type: matching
                text: "Anfang, Mitte oder Schluss?"
                say: "Thema: Der Ball im Nachbargarten. Verbinde jeden Teil des Schreibplans mit der passenden Idee."
                pairs:
                  - { left: { text: "Anfang" }, right: { text: "Mein Bruder und ich spielen Fußball." } }
                  - { left: { text: "Mitte" }, right: { text: "Der Ball fliegt in Frau Kims Garten." } }
                  - { left: { text: "Schluss" }, right: { text: "Frau Kim wirft ihn lachend zurück." } }
              - id: l2-n4
                type: multiple_choice
                text: "Was schreibst du im Schreibplan beim Anfang auf?"
                say: "Was schreibst du im Schreibplan beim Anfang auf?"
                options: ["wer mitspielt und wo", "wie alles ausgeht", "alle Ideen durcheinander"]
                answer: "wer mitspielt und wo"
              - id: l2-n5
                type: true_false
                text: "Thema: Im Schwimmbad\nAnfang: Wir packen die Badesachen.\nMitte: Ich springe vom Sprungbrett.\nSchluss: Wir essen Pommes.\n\nPasst der Schreibplan zum Thema?"
                say: "Lies den Schreibplan. Passt er zum Thema?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Thema: Ein Tag auf dem Bauernhof\n\nWelche Idee passt in den Cluster?"
            say: "Das Thema ist: Ein Tag auf dem Bauernhof. Welche Idee passt in den Cluster?"
            options: ["Kühe melken", "Achterbahn fahren", "Fernsehen"]
            answer: "Kühe melken"
          - id: l2-c2
            type: multiple_choice
            text: "Thema: Unser Klassenausflug\nIdeen: Bus fahren, Museum, Zahnarzt, Picknick\n\nWelche Idee streichst du?"
            say: "Lies das Thema und die Ideen. Welche Idee streichst du?"
            options: ["Zahnarzt", "Museum", "Picknick"]
            answer: "Zahnarzt"
          - id: l2-c3
            type: ordering
            text: "Schreibplan: Ein Kuchen für Oma. Bring die Teile in die richtige Reihenfolge."
            say: "Bring den Schreibplan für Ein Kuchen für Oma in die richtige Reihenfolge."
            options: ["Oma freut sich und isst ein großes Stück.", "Ich backe mit Papa einen Kuchen.", "Der Kuchen wird fast schwarz, aber wir retten ihn."]
            slot_count: 3
            answer: ["Ich backe mit Papa einen Kuchen.", "Der Kuchen wird fast schwarz, aber wir retten ihn.", "Oma freut sich und isst ein großes Stück."]
          - id: l2-c4
            type: sorting
            text: "Was passt zu welchem Thema?"
            say: "Sortiere die Ideen: Strand oder Wald?"
            bins:
              - { id: beach, show: { text: "Strand" }, say: "Strand" }
              - { id: wood, show: { text: "Wald" }, say: "Wald" }
            options:
              - { text: "Muscheln", bin: beach }
              - { text: "Pilze", bin: wood }
              - { text: "Wellen", bin: beach }
              - { text: "Eichhörnchen", bin: wood }
          - id: l2-c5
            type: multiple_choice
            text: "Was schreibst du im Schreibplan bei der Mitte auf?"
            say: "Was schreibst du im Schreibplan bei der Mitte auf?"
            options: ["was Spannendes passiert", "wie alles ausgeht", "wer mitspielt und wo"]
            answer: "was Spannendes passiert"
