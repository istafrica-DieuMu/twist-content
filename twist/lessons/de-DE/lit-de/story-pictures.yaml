# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.story-pictures
skill: lit-de.writing.story-pictures
curriculum: de-DE
language: de
title:
  de: Zu Bildern erzählen
  en: Writing a story from pictures
summary: >
  Turning a Bildergeschichte into a connected story. Lesson 1 finds the
  sentence that tells what happens in a picture (not "Auf Bild 2 ist
  ..."), puts the sentences in order, and names Anfang, Mitte and
  Schluss; lesson 2 links the sentences with Eines Tages, Plötzlich, Da,
  Zum Glück and Am Ende instead of und dann, picks a heading, and ends
  with the skill check. The four stories are written for Twist; each
  picture is given as one line of text, with a bank picture beside it
  where one fits. Writing the story freely waits for a free text task
  type.
metadata:
  year: klasse-2
  topic: { de: Erzählen, en: Telling stories }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.writing.words-to-pictures, lit-de.comprehension.order-story]
  also_practises: [lit-de.comprehension.order-story]
  vocabulary: { de: [Bildergeschichte, Anfang, Mitte, Schluss, Überschrift, Eines Tages, Plötzlich, Zum Glück, Am Ende] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: picture-list
      what: Lists what each picture shows (Auf Bild 1 ist ein Mädchen) instead of telling a connected story
      addressed: "lesson 1 Learn sets a list against a told story; every \"Welcher Satz erzählt dazu?\" task offers the list sentence (l1-f1 with feedback, l1-s1, l1-n1, l1-c1, l2-c1); l1-f5 and l1-c3 ask whether a list is a story"
    - id: and-then
      what: Starts every sentence with und dann
      addressed: "lesson 2 Learn sets und dann against Eines Tages, Plötzlich, Da, Zum Glück and Am Ende; a linking-word gap in every stage (l2-f1 with feedback, l2-f3, l2-s1, l2-s3, l2-n1, l2-n3, l2-c4); l2-f2 (with feedback), l2-s2 and l2-n2 replace und dann; l2-f5 asks about it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Anfang, Mitte und Schluss", en: "Beginning, middle and end" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Bild an. Welcher Satz passt?"
            show: { object: kite }
            options: ["Der Drachen fliegt hoch in der Luft.", "Der Hund schläft im Korb.", "Das Auto ist rot."]
            option_audio: false
            answer: "Der Drachen fliegt hoch in der Luft."
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Bring die Sätze in die richtige Reihenfolge."
            say: "Bring die Sätze in die richtige Reihenfolge."
            options: ["Sie isst den Apfel.", "Lea pflückt einen Apfel.", "Sie wäscht den Apfel."]
            slot_count: 3
            answer: ["Lea pflückt einen Apfel.", "Sie wäscht den Apfel.", "Sie isst den Apfel."]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Bild 1: Mia lässt auf der Wiese einen Drachen steigen.\nBild 2: Der Wind reißt ihr die Schnur aus der Hand.\nBild 3: Der Drachen hängt in einem Baum.\nBild 4: Opa holt ihn mit einer Leiter herunter."
            say: "Das ist eine Bildergeschichte mit vier Bildern. Schau dir jedes Bild genau an. Wer ist zu sehen? Was passiert?"
            show: { object: kite }
          - text: "Anfang: Wer? Wo?\nMitte: Was passiert?\nSchluss: Wie geht es aus?"
            say: "Eine Geschichte hat einen Anfang, eine Mitte und einen Schluss. Am Anfang erfährst du, wer mitspielt und wo. In der Mitte passiert etwas. Am Schluss erfährst du, wie es ausgeht."
          - text: "Auf Bild 1 ist ein Mädchen. Auf Bild 2 ist Wind.\n\nAn einem windigen Tag ließ Mia ihren Drachen steigen. Plötzlich riss ihr der Wind die Schnur aus der Hand."
            say: "Schreib nicht nur auf, was auf jedem Bild ist. Erzähl eine Geschichte, in der ein Satz zum nächsten führt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Bild 2: Der Wind reißt Mia die Schnur aus der Hand.\n\nWelcher Satz erzählt dazu?"
                say: "Lies, was auf Bild 2 zu sehen ist. Welcher Satz erzählt dazu?"
                show: { object: kite }
                options: ["Plötzlich riss ihr der Wind die Schnur aus der Hand.", "Auf Bild 2 ist Wind.", "Mia hat einen Hund."]
                answer: "Plötzlich riss ihr der Wind die Schnur aus der Hand."
                feedback:
                  "Auf Bild 2 ist Wind.": "Das zählt nur auf, was auf dem Bild ist. Erzähl, was passiert."
                hints:
                  - "Eine Geschichte erzählt, was passiert."
                  - "Welcher Satz sagt, was der Wind mit der Schnur macht?"
                  - "Plötzlich riss ihr der Wind die Schnur aus der Hand."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Bring die Sätze der Geschichte in die richtige Reihenfolge."
                say: "Bring die Sätze der Drachengeschichte in die richtige Reihenfolge."
                options: ["Zum Glück holte Opa ihn mit einer Leiter herunter.", "Mia ließ auf der Wiese ihren Drachen steigen.", "Plötzlich blieb der Drachen in einem Baum hängen."]
                slot_count: 3
                answer: ["Mia ließ auf der Wiese ihren Drachen steigen.", "Plötzlich blieb der Drachen in einem Baum hängen.", "Zum Glück holte Opa ihn mit einer Leiter herunter."]
                hints:
                  - "Welcher Satz sagt, wer mitspielt und wo?"
                  - "Erst muss der Drachen im Baum hängen, dann kann Opa ihn holen."
                  - "Mia lässt den Drachen steigen, er bleibt hängen, Opa holt ihn."
              - id: l1-f3
                type: matching
                text: "Anfang, Mitte oder Schluss?"
                say: "Verbinde jeden Teil der Geschichte mit dem passenden Satz."
                pairs:
                  - { left: { text: "Anfang" }, right: { text: "Mia ließ auf der Wiese ihren Drachen steigen." } }
                  - { left: { text: "Mitte" }, right: { text: "Der Drachen blieb im Baum hängen." } }
                  - { left: { text: "Schluss" }, right: { text: "Opa holte ihn herunter, und Mia lachte." } }
                hints:
                  - "Am Anfang erfährst du, wer und wo. Am Schluss, wie es ausgeht."
                  - "In der Mitte gibt es ein Problem."
                  - "Anfang: Mia und der Drachen. Mitte: der Baum. Schluss: Opa hilft."
              - id: l1-f4
                type: multiple_choice
                text: "Welcher Satz ist ein guter Schluss für die Drachengeschichte?"
                say: "Welcher Satz ist ein guter Schluss für die Drachengeschichte?"
                options: ["Am Ende flog der Drachen wieder, und Mia war froh.", "Mia hat blonde Haare.", "Auf Bild 4 ist eine Leiter."]
                answer: "Am Ende flog der Drachen wieder, und Mia war froh."
                hints:
                  - "Der Schluss sagt, wie die Geschichte ausgeht."
                  - "Welcher Satz sagt, wie es mit dem Drachen und Mia ausgeht?"
                  - "Am Ende flog der Drachen wieder, und Mia war froh."
              - id: l1-f5
                type: true_false
                text: "„Auf Bild 1 ist ein Mädchen. Auf Bild 2 ist ein Baum.“ Ist das eine Geschichte?"
                say: "Auf Bild 1 ist ein Mädchen. Auf Bild 2 ist ein Baum. Ist das eine Geschichte?"
                answer: false
                hints:
                  - "Erfährst du, was passiert?"
                  - "Die Sätze zählen nur auf, was auf den Bildern ist."
                  - "Nein, das ist keine Geschichte."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Bild 3: Der Hund Fiete springt in den Teich.\n\nWelcher Satz erzählt dazu?"
                say: "Lies, was auf Bild 3 zu sehen ist. Welcher Satz erzählt dazu?"
                show: { object: dog }
                options: ["Sofort sprang Fiete hinterher ins Wasser.", "Auf Bild 3 ist Wasser.", "Fiete ist ein Hund."]
                answer: "Sofort sprang Fiete hinterher ins Wasser."
                hints: ["Welcher Satz erzählt, was passiert?"]
              - id: l1-s2
                type: ordering
                text: "Bring die Sätze der Geschichte in die richtige Reihenfolge."
                say: "Bring die Sätze der Geschichte von Ben und Fiete in die richtige Reihenfolge."
                options: ["Fiete brachte den Ball nass zurück.", "Ben spielte mit seinem Hund Fiete im Garten Ball.", "Der Ball flog über den Zaun in den Teich."]
                slot_count: 3
                answer: ["Ben spielte mit seinem Hund Fiete im Garten Ball.", "Der Ball flog über den Zaun in den Teich.", "Fiete brachte den Ball nass zurück."]
                hints: ["Der Ball muss erst im Teich sein, bevor Fiete ihn zurückbringt."]
              - id: l1-s3
                type: matching
                text: "Anfang, Mitte oder Schluss?"
                say: "Verbinde jeden Teil der Geschichte mit dem passenden Satz."
                pairs:
                  - { left: { text: "Anfang" }, right: { text: "Ben spielte mit Fiete im Garten." } }
                  - { left: { text: "Mitte" }, right: { text: "Der Ball fiel in den Teich." } }
                  - { left: { text: "Schluss" }, right: { text: "Fiete brachte den Ball zurück." } }
                hints: ["In der Mitte passiert etwas, das nicht geplant war."]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Satz ist ein guter Anfang für die Geschichte von Ben und Fiete?"
                say: "Welcher Satz ist ein guter Anfang für die Geschichte von Ben und Fiete?"
                options: ["An einem sonnigen Tag spielte Ben mit seinem Hund Fiete im Garten.", "Dann war der Ball weg.", "Am Ende waren beide nass."]
                answer: "An einem sonnigen Tag spielte Ben mit seinem Hund Fiete im Garten."
                hints: ["Der Anfang sagt, wer mitspielt und wo."]
              - id: l1-s5
                type: true_false
                text: "Am Anfang einer Geschichte erfährst du, wer mitspielt und wo sie spielt. Stimmt das?"
                say: "Am Anfang einer Geschichte erfährst du, wer mitspielt und wo sie spielt. Stimmt das?"
                answer: true
                hints: ["Denk an die Fragen Wer? und Wo?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Bild 2: Die Sonne scheint. Der Schneemann wird immer kleiner.\n\nWelcher Satz erzählt dazu?"
                say: "Lies, was auf Bild 2 zu sehen ist. Welcher Satz erzählt dazu?"
                show: { object: snowman }
                options: ["Doch dann kam die Sonne heraus, und der Schneemann schmolz.", "Auf Bild 2 ist eine Sonne.", "Schnee ist weiß."]
                answer: "Doch dann kam die Sonne heraus, und der Schneemann schmolz."
              - id: l1-n2
                type: ordering
                text: "Bring die Sätze der Geschichte in die richtige Reihenfolge."
                say: "Bring die Sätze der Schneemanngeschichte in die richtige Reihenfolge."
                options: ["Am nächsten Tag schneite es wieder, und sie bauten einen neuen.", "Lina und Tom bauten im Garten einen Schneemann.", "Mittags schmolz der Schneemann in der Sonne."]
                slot_count: 3
                answer: ["Lina und Tom bauten im Garten einen Schneemann.", "Mittags schmolz der Schneemann in der Sonne.", "Am nächsten Tag schneite es wieder, und sie bauten einen neuen."]
              - id: l1-n3
                type: matching
                text: "Anfang, Mitte oder Schluss?"
                say: "Verbinde jeden Teil der Geschichte mit dem passenden Satz."
                pairs:
                  - { left: { text: "Anfang" }, right: { text: "Lina und Tom bauten einen Schneemann." } }
                  - { left: { text: "Mitte" }, right: { text: "Die Sonne schmolz ihn." } }
                  - { left: { text: "Schluss" }, right: { text: "Sie bauten einen neuen Schneemann." } }
              - id: l1-n4
                type: multiple_choice
                text: "Welcher Satz ist ein guter Schluss für die Geschichte vom Schneemann?"
                say: "Welcher Satz ist ein guter Schluss für die Geschichte vom Schneemann?"
                options: ["Am nächsten Tag bauten sie einen neuen, noch größeren Schneemann.", "Lina und Tom gingen in den Garten.", "Es war Winter."]
                answer: "Am nächsten Tag bauten sie einen neuen, noch größeren Schneemann."
              - id: l1-n5
                type: true_false
                text: "In der Mitte einer Geschichte passiert etwas. Stimmt das?"
                say: "In der Mitte einer Geschichte passiert etwas. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Bild 2: Lenas Mütze fällt ins Wasser.\n\nWelcher Satz erzählt dazu?"
            say: "Lies, was auf Bild 2 zu sehen ist. Welcher Satz erzählt dazu?"
            show: { object: duck }
            options: ["Auf einmal fiel Lenas Mütze ins Wasser.", "Auf Bild 2 ist eine Mütze.", "Lena mag Enten."]
            answer: "Auf einmal fiel Lenas Mütze ins Wasser."
          - id: l1-c2
            type: ordering
            text: "Bring die Sätze der Geschichte in die richtige Reihenfolge."
            say: "Bring die Sätze der Geschichte von Lena in die richtige Reihenfolge."
            options: ["Eine Ente schob die Mütze ans Ufer.", "Lena fütterte mit Oma die Enten am See.", "Da fiel Lenas Mütze ins Wasser."]
            slot_count: 3
            answer: ["Lena fütterte mit Oma die Enten am See.", "Da fiel Lenas Mütze ins Wasser.", "Eine Ente schob die Mütze ans Ufer."]
          - id: l1-c3
            type: true_false
            text: "„Auf Bild 3 ist eine Ente. Auf Bild 4 ist ein Ufer.“ Ist das eine Geschichte?"
            say: "Auf Bild 3 ist eine Ente. Auf Bild 4 ist ein Ufer. Ist das eine Geschichte?"
            answer: false

  - n: 2
    title: { de: "Sätze verbinden", en: "Linking sentences" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Satz ist ein guter Anfang?"
            say: "Welcher Satz ist ein guter Anfang für eine Geschichte?"
            options: ["Eines Morgens ging Ella mit ihrem Papa in den Wald.", "Am Ende lachten alle.", "Dann war es vorbei."]
            answer: "Eines Morgens ging Ella mit ihrem Papa in den Wald."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Am Schluss einer Geschichte erfährst du, wie sie ausgeht. Stimmt das?"
            say: "Am Schluss einer Geschichte erfährst du, wie sie ausgeht. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Mia ließ ihren Drachen steigen. Und dann riss die Schnur. Und dann hing er im Baum. Und dann kam Opa."
            say: "Hör mal: und dann, und dann, und dann. Das klingt langweilig."
          - text: "Eines Tages | Plötzlich | Da | Zum Glück | Am Ende"
            say: "Diese Wörter verbinden deine Sätze. Eines Tages passt an den Anfang. Plötzlich zeigt, dass etwas Unerwartetes passiert. Zum Glück zeigt, dass es gut wird. Am Ende passt an den Schluss."
          - text: "Mias Drachen im Baum"
            say: "Deine Geschichte braucht noch eine Überschrift. Sie sagt, worum es geht, aber sie verrät noch nicht das Ende."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Mia ließ ihren Drachen steigen. _ riss die Schnur."
                options: ["Plötzlich", "Am Ende", "Eines Tages"]
                answer: ["Plötzlich"]
                feedback:
                  "Am Ende": "Am Ende passt an den Schluss. Hier passiert gerade etwas Unerwartetes."
                hints:
                  - "Die Schnur reißt. Hat Mia damit gerechnet?"
                  - "Welches Wort zeigt, dass etwas Unerwartetes passiert?"
                  - "Plötzlich."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welcher Satz klingt besser als „Und dann kam Opa.“?"
                say: "Welcher Satz klingt besser als: Und dann kam Opa?"
                options: ["Zum Glück kam Opa mit einer Leiter.", "Und dann kam Opa mit einer Leiter.", "Und dann, und dann kam Opa."]
                answer: "Zum Glück kam Opa mit einer Leiter."
                feedback:
                  "Und dann kam Opa mit einer Leiter.": "Der Satz fängt wieder mit und dann an. Probier ein anderes Wort."
                hints:
                  - "Such einen Satz ohne und dann."
                  - "Opa hilft. Welches Wort zeigt, dass es gut wird?"
                  - "Zum Glück kam Opa mit einer Leiter."
              - id: l2-f3
                type: fill_in_blank
                text: "Wie fängt die Geschichte an? Welches Wort passt?"
                say: "Wie fängt die Geschichte an? Welches Wort passt in die Lücke?"
                frame: "_ ging Ella mit Papa in den Wald."
                options: ["Eines Tages", "Zum Schluss", "Am Ende"]
                answer: ["Eines Tages"]
                hints:
                  - "Das ist der erste Satz der Geschichte."
                  - "Welche Wörter passen an den Anfang?"
                  - "Eines Tages."
              - id: l2-f4
                type: multiple_choice
                text: "Welche Überschrift passt zur Geschichte von Ben und Fiete?"
                say: "Ben spielt mit Fiete Ball, der Ball fliegt in den Teich, und Fiete springt hinterher. Welche Überschrift passt?"
                options: ["Fiete springt in den Teich", "Mein Garten", "Hunde"]
                answer: "Fiete springt in den Teich"
                hints:
                  - "Die Überschrift sagt, worum es in der Geschichte geht."
                  - "Was ist das Besondere an dieser Geschichte?"
                  - "Fiete springt in den Teich."
              - id: l2-f5
                type: true_false
                text: "Jeder Satz einer Geschichte fängt am besten mit „Und dann“ an. Stimmt das?"
                say: "Jeder Satz einer Geschichte fängt am besten mit und dann an. Stimmt das?"
                answer: false
                hints:
                  - "Denk an Mias Drachengeschichte mit und dann, und dann."
                  - "Wie hat das geklungen?"
                  - "Nein, das klingt langweilig."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Der Ball flog in den Teich. _ sprang Fiete hinterher."
                options: ["Da", "Am Ende", "Eines Tages"]
                answer: ["Da"]
                hints: ["Fiete springt gleich, nachdem der Ball ins Wasser fällt."]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Satz klingt besser als „Und dann war der Schneemann weg.“?"
                say: "Welcher Satz klingt besser als: Und dann war der Schneemann weg?"
                options: ["Am Abend war der Schneemann ganz verschwunden.", "Und dann war der Schneemann weg.", "Und dann, und dann war er weg."]
                answer: "Am Abend war der Schneemann ganz verschwunden."
                hints: ["Such einen Satz ohne und dann."]
              - id: l2-s3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Die Mütze schwamm weg. _ schob eine Ente sie ans Ufer."
                options: ["Zum Glück", "Eines Tages", "Zuerst"]
                answer: ["Zum Glück"]
                hints: ["Die Ente hilft. Welches Wort zeigt, dass es gut wird?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welche Überschrift passt zur Geschichte vom Schneemann?"
                say: "Lina und Tom bauen einen Schneemann, und die Sonne lässt ihn schmelzen. Welche Überschrift passt?"
                options: ["Der Schneemann schmilzt", "Winterjacken", "Lina hat Geburtstag"]
                answer: "Der Schneemann schmilzt"
                hints: ["Worum geht es in der Geschichte?"]
              - id: l2-s5
                type: true_false
                text: "„Zum Glück“ zeigt, dass etwas gut ausgeht. Stimmt das?"
                say: "Zum Glück zeigt, dass etwas gut ausgeht. Stimmt das?"
                answer: true
                hints: ["Denk an Opa mit der Leiter."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Jonas suchte seine Katze Minka überall. _ hörte er ein Miauen vom Dach."
                options: ["Plötzlich", "Am Ende", "Eines Tages"]
                answer: ["Plötzlich"]
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Satz klingt besser als „Und dann kam die Feuerwehr.“?"
                say: "Welcher Satz klingt besser als: Und dann kam die Feuerwehr?"
                options: ["Zum Glück kam bald die Feuerwehr.", "Und dann kam die Feuerwehr.", "Und dann, und dann kam sie."]
                answer: "Zum Glück kam bald die Feuerwehr."
              - id: l2-n3
                type: fill_in_blank
                text: "Wie endet die Geschichte? Welche Wörter passen?"
                say: "Wie endet die Geschichte? Welche Wörter passen in die Lücke?"
                frame: "_ lag Minka wieder gemütlich auf ihrem Kissen."
                options: ["Am Ende", "Eines Tages", "Plötzlich"]
                answer: ["Am Ende"]
              - id: l2-n4
                type: multiple_choice
                text: "Welche Überschrift passt zur Geschichte von Minka?"
                say: "Die Katze Minka sitzt auf dem Dach, und die Feuerwehr holt sie herunter. Welche Überschrift passt?"
                options: ["Minka auf dem Dach", "Katzenfutter", "Unser Haus"]
                answer: "Minka auf dem Dach"
              - id: l2-n5
                type: true_false
                text: "„Am Ende“ passt gut an den Anfang einer Geschichte. Stimmt das?"
                say: "Am Ende passt gut an den Anfang einer Geschichte. Stimmt das?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Bild 1: Emil baut am Strand eine Sandburg.\n\nWelcher Satz erzählt dazu?"
            say: "Lies, was auf Bild 1 zu sehen ist. Welcher Satz erzählt dazu?"
            options: ["Am ersten Ferientag baute Emil am Strand eine große Sandburg.", "Auf Bild 1 ist Sand.", "Emil ist sieben."]
            answer: "Am ersten Ferientag baute Emil am Strand eine große Sandburg."
          - id: l2-c2
            type: ordering
            text: "Bring die Sätze der Geschichte in die richtige Reihenfolge."
            say: "Bring die Sätze der Geschichte von Emil in die richtige Reihenfolge."
            options: ["Seine Schwester half ihm, eine neue zu bauen.", "Emil baute am Strand eine Sandburg.", "Eine große Welle rollte heran."]
            slot_count: 3
            answer: ["Emil baute am Strand eine Sandburg.", "Eine große Welle rollte heran.", "Seine Schwester half ihm, eine neue zu bauen."]
          - id: l2-c3
            type: matching
            text: "Was gehört zusammen?"
            say: "Verbinde Anfang, Mitte und Schluss mit den Sätzen aus Emils Geschichte."
            pairs:
              - { left: { text: "Anfang" }, right: { text: "Emil baute eine Sandburg." } }
              - { left: { text: "Mitte" }, right: { text: "Eine Welle machte sie kaputt." } }
              - { left: { text: "Schluss" }, right: { text: "Mit seiner Schwester baute er eine neue Burg." } }
          - id: l2-c4
