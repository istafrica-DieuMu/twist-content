# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.adjectives-compounds
skill: lit-de.adjectives.compounds
curriculum: de-DE
language: de
title:
  de: Zusammengesetzte Adjektive
  en: Compound adjectives
summary: >
  A noun and an adjective make a stronger adjective (eiskalt is kalt wie
  Eis). Lesson 1 says what a compound adjective means and builds it from
  its two parts; lesson 2 adds colour words with hell- and dunkel-, writes
  them as one word in small letters and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Adjektive, en: Adjectives }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.adjectives.suffixes, lit-de.nouns.compounds]
  also_practises: [lit-de.adjectives.agreement]
  vocabulary: { de: [zusammengesetztes Adjektiv, Bestimmungswort, Grundwort] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: two-words
      what: Writes the compound as two words or with a capital (Eis kalt, Eiskalt)
      addressed: lesson 2 Learn says one word, small; spelling tasks in every stage of lesson 2 offer the split and capital forms
    - id: wrong-picture
      what: Pairs a noun that does not fit the adjective (steinleicht, federhart)
      addressed: lesson 1 Learn explains "so … wie"; building tasks in every stage of lesson 1 offer a noun that does not fit (schneckenschnell, zwerggroß, schneerot), and true/false tasks show a compound that does not fit
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "eiskalt und federleicht", en: "ice-cold and light as a feather" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Haus + Tür = _"
            say: "Setz die Nomen zusammen. Haus und Tür."
            options: ["die Haustür", "das Haustür", "die Türhaus"]
            answer: "die Haustür"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "der Schatten → _"
            say: "Mach aus dem Nomen ein Adjektiv. Der Schatten, …"
            options: ["schattig", "schattlich", "Schattig"]
            answer: "schattig"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Eis + kalt = eiskalt"
            say: "Das Wasser ist so kalt wie Eis. Es ist eiskalt. Aus einem Nomen und einem Adjektiv wird ein neues Adjektiv."
          - text: "federleicht = so leicht wie eine Feder"
            say: "Federleicht heißt: so leicht wie eine Feder. Das erste Wort sagt, wie leicht."
          - text: "himmelblau"
            say: "Himmelblau ist so blau wie der Himmel. Hinten steht das Grundwort blau. Es ist ein Adjektiv, darum ist auch himmelblau ein Adjektiv."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was bedeutet „steinhart“?"
                say: "Was bedeutet steinhart?"
                options: ["so hart wie ein Stein", "ein harter Stein", "hart und leicht"]
                answer: "so hart wie ein Stein"
                feedback:
                  "ein harter Stein": "Steinhart ist ein Adjektiv. Es sagt, wie hart etwas ist: so hart wie ein Stein."
                hints:
                  - "Lies es mit „so … wie“."
                  - "So hart wie …"
                  - "so hart wie ein Stein."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "so schnell wie ein Blitz → _"
                say: "So schnell wie ein Blitz. Welches Wort passt? … schnell."
                options: ["blitzschnell", "schneckenschnell", "Blitzschnell"]
                answer: "blitzschnell"
                feedback:
                  "schneckenschnell": "Eine Schnecke ist langsam. So schnell wie ein Blitz ist blitzschnell."
                hints:
                  - "So schnell wie …"
                  - "Was ist am Himmel und ganz schnell?"
                  - "blitzschnell."
              - id: l1-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Adjektiv mit seiner Bedeutung."
                pairs:
                  - { left: { text: "zuckersüß" }, right: { text: "so süß wie Zucker" } }
                  - { left: { text: "schneeweiß" }, right: { text: "so weiß wie Schnee" } }
                  - { left: { text: "bärenstark" }, right: { text: "so stark wie ein Bär" } }
                hints:
                  - "Lies das erste Wort."
                  - "Zucker ist süß, Schnee ist weiß."
                  - "zuckersüß heißt so süß wie Zucker, schneeweiß so weiß wie Schnee, bärenstark so stark wie ein Bär."
              - id: l1-f4
                type: fill_in_blank
                text: "Ergänze das Adjektiv."
                say: "Die Wiese ist so grün wie Gras. Ergänze das Adjektiv."
                frame: "Die Wiese ist _."
                options: ["grasgrün", "himmelgrün", "grünlich"]
                answer: ["grasgrün"]
                hints:
                  - "So grün wie Gras."
                  - "Gras und grün."
                  - "grasgrün."
              - id: l1-f5
                type: true_false
                text: "Passt das? Das Kissen ist steinweich."
                say: "Lies die Karte. Passt das?"
                show: { drawn: letter-card, text: "Das Kissen ist steinweich." }
                answer: false
                hints:
                  - "Ist ein Stein weich?"
                  - "Ein Stein ist hart."
                  - "Nein. Ein Kissen ist federweich."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was bedeutet „spiegelglatt“?"
                say: "Was bedeutet spiegelglatt?"
                options: ["so glatt wie ein Spiegel", "ein glatter Spiegel", "glatt und rund"]
                answer: "so glatt wie ein Spiegel"
                hints: ["Lies es mit „so … wie“."]
              - id: l1-s2
                type: multiple_choice
                text: "so groß wie ein Riese → _"
                say: "So groß wie ein Riese. Welches Wort passt? … groß."
                options: ["riesengroß", "zwerggroß", "Riesengroß"]
                answer: "riesengroß"
                hints: ["Ist ein Zwerg groß oder klein?"]
              - id: l1-s3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Adjektiv mit seiner Bedeutung."
                pairs:
                  - { left: { text: "pechschwarz" }, right: { text: "so schwarz wie Pech" } }
                  - { left: { text: "glasklar" }, right: { text: "so klar wie Glas" } }
                  - { left: { text: "mausgrau" }, right: { text: "so grau wie eine Maus" } }
                hints: ["Lies das erste Wort."]
              - id: l1-s4
                type: fill_in_blank
                text: "Ergänze das Adjektiv."
                say: "Das Auto ist so rot wie Feuer. Ergänze das Adjektiv."
                frame: "Das Auto ist _."
                options: ["feuerrot", "schneerot", "rötlich"]
                answer: ["feuerrot"]
                hints: ["Welche Farbe hat Schnee?"]
              - id: l1-s5
                type: true_false
                text: "Passt das? Der Koffer ist federschwer."
                say: "Lies die Karte. Passt das?"
                show: { drawn: letter-card, text: "Der Koffer ist federschwer." }
                answer: false
                hints: ["Ist eine Feder schwer?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was bedeutet „honigsüß“?"
                say: "Was bedeutet honigsüß?"
                options: ["so süß wie Honig", "ein süßer Honig", "süß und klebrig"]
                answer: "so süß wie Honig"
              - id: l1-n2
                type: multiple_choice
                text: "so still wie ein Mäuschen → _"
                say: "So still wie ein Mäuschen. Welches Wort passt? … still."
                options: ["mäuschenstill", "löwenstill", "Mäuschenstill"]
                answer: "mäuschenstill"
              - id: l1-n3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Adjektiv mit seiner Bedeutung."
                pairs:
                  - { left: { text: "goldgelb" }, right: { text: "so gelb wie Gold" } }
                  - { left: { text: "butterweich" }, right: { text: "so weich wie Butter" } }
                  - { left: { text: "kugelrund" }, right: { text: "so rund wie eine Kugel" } }
              - id: l1-n4
                type: fill_in_blank
                text: "Ergänze das Adjektiv."
                say: "Der Turm ist so hoch wie der Himmel. Ergänze das Adjektiv."
                frame: "Der Turm ist _."
                options: ["himmelhoch", "kellerhoch", "höher"]
                answer: ["himmelhoch"]
              - id: l1-n5
                type: true_false
                text: "Passt das? Unsere Schildkröte ist steinalt."
                say: "Lies die Karte. Passt das?"
                show: { drawn: letter-card, text: "Unsere Schildkröte ist steinalt." }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was bedeutet „knochentrocken“?"
            say: "Was bedeutet knochentrocken?"
            options: ["so trocken wie ein Knochen", "ein trockener Knochen", "trocken und hart"]
            answer: "so trocken wie ein Knochen"
          - id: l1-c2
            type: fill_in_blank
            text: "Ergänze das Adjektiv."
            say: "Die Katze ist so flink wie ein Wiesel. Ergänze das Adjektiv."
            frame: "Die Katze ist _."
            options: ["wieselflink", "schneckenflink", "flinker"]
            answer: ["wieselflink"]
          - id: l1-c3
            type: true_false
            text: "Passt das? Die Nacht ist rabenschwarz."
            say: "Lies die Karte. Passt das?"
            show: { drawn: letter-card, text: "Die Nacht ist rabenschwarz." }
            answer: true

  - n: 2
    title: { de: "hellblau und dunkelrot", en: "light blue and dark red" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was bedeutet „eisenhart“?"
            say: "Was bedeutet eisenhart?"
            options: ["so hart wie Eisen", "ein hartes Eisen", "hart und kalt"]
            answer: "so hart wie Eisen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Passt das? Die Wolke ist watteweich."
            say: "Lies die Karte. Passt das?"
            show: { drawn: letter-card, text: "Die Wolke ist watteweich." }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "hell + blau = hellblau"
            say: "Auch zwei Adjektive kann man zusammensetzen. Hell und blau wird hellblau. Dunkel und grün wird dunkelgrün."
          - text: "eiskalt ✓ · Eis kalt ✗ · Eiskalt ✗"
            say: "Ein zusammengesetztes Adjektiv schreibst du als ein Wort. Und weil es ein Adjektiv ist, schreibst du es klein."
          - text: "ein eiskaltes Getränk"
            say: "Vor einem Nomen bekommt es eine Endung wie jedes Adjektiv: ein eiskaltes Getränk, die hellblaue Jacke."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie schreibt man es richtig?"
                say: "Die Kirsche ist rot, aber ganz dunkel. Wie schreibt man das Adjektiv richtig?"
                options: ["dunkelrot", "dunkel rot", "Dunkelrot"]
                answer: "dunkelrot"
                feedback:
                  "dunkel rot": "Zusammengesetzte Adjektive schreibst du als ein Wort: dunkelrot."
                  "Dunkelrot": "Adjektive schreibst du klein: dunkelrot."
                hints:
                  - "Ein Wort oder zwei?"
                  - "Groß oder klein?"
                  - "dunkelrot."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung. Ich trage die hellgrün… Mütze."
                frame: "die hellgrün_ Mütze"
                options: ["e", "en", "es"]
                answer: ["e"]
                hints:
                  - "Wie heißt es bei „die grüne Mütze“?"
                  - "Nach „die“ endet das Adjektiv auf -e."
                  - "die hellgrüne Mütze."
              - id: l2-f3
                type: true_false
                text: "Richtig geschrieben? Das Wasser ist Glas klar."
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Das Wasser ist Glas klar." }
                answer: false
                hints:
                  - "Ein Wort oder zwei?"
                  - "Und groß oder klein?"
                  - "Nein. Richtig ist: glasklar."
              - id: l2-f4
                type: multiple_choice
                text: "Welches Adjektiv passt?"
                say: "In der Nacht ist der Himmel blau, aber ganz dunkel. Welches Adjektiv passt?"
                options: ["dunkelblau", "hellblau", "himmelblau"]
                answer: "dunkelblau"
                hints:
                  - "Ist der Himmel in der Nacht hell oder dunkel?"
                  - "dunkel und blau."
                  - "dunkelblau."
              - id: l2-f5
                type: highlight_in_text
                text: "Tippe auf das zusammengesetzte Adjektiv."
                say: "Lies den Satz. Tippe auf das zusammengesetzte Adjektiv."
                show: { drawn: letter-card, text: "Der Kater hat ein samtweiches Fell." }
                spans: ["samtweiches"]
                hints:
                  - "Such ein Adjektiv aus zwei Teilen."
                  - "Samt und weich."
                  - "samtweiches."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie schreibt man es richtig?"
                say: "Das Kleid ist rosa, aber ganz hell. Wie schreibt man das Adjektiv richtig?"
                options: ["hellrosa", "hell rosa", "Hellrosa"]
                answer: "hellrosa"
                hints: ["Denk an die Regel: Wie schreibt man zusammengesetzte Adjektive?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung. Wir sehen einen glasklar… Bach."
                frame: "einen glasklar_ Bach"
                options: ["en", "e", "es"]
                answer: ["en"]
                hints: ["Lass glas- einmal weg. Wie heißt es dann?"]
              - id: l2-s3
                type: true_false
                text: "Richtig geschrieben? Das Meer ist tiefblau."
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Das Meer ist tiefblau." }
                answer: true
                hints: ["Ein Wort und klein?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welches Adjektiv passt?"
                say: "Der Teddy ist braun, aber ganz hell. Welches Adjektiv passt?"
                options: ["hellbraun", "dunkelbraun", "schokobraun"]
                answer: "hellbraun"
                hints: ["Hör noch einmal genau hin: Wie ist das Braun?"]
              - id: l2-s5
                type: highlight_in_text
                text: "Tippe auf das zusammengesetzte Adjektiv."
                say: "Lies den Satz. Tippe auf das zusammengesetzte Adjektiv."
                show: { drawn: letter-card, text: "Das Baby hat ein zuckersüßes Lächeln." }
                spans: ["zuckersüßes"]
                hints: ["Welches Adjektiv ist ein Wort aus zwei Teilen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie schreibt man es richtig?"
                say: "Der Pulli ist lila, aber ganz dunkel. Wie schreibt man das Adjektiv richtig?"
                options: ["dunkellila", "dunkel lila", "Dunkellila"]
                answer: "dunkellila"
              - id: l2-n2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung. Das ist ein bärenstark… Mann."
                frame: "ein bärenstark_ Mann"
                options: ["er", "en", "es"]
                answer: ["er"]
              - id: l2-n3
                type: true_false
                text: "Richtig geschrieben? Die Straße ist Spiegel glatt."
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Die Straße ist Spiegel glatt." }
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Welches Adjektiv passt?"
                say: "Die Zitrone ist gelb, aber ganz hell. Welches Adjektiv passt?"
                options: ["hellgelb", "dunkelgelb", "goldgelb"]
                answer: "hellgelb"
              - id: l2-n5
                type: highlight_in_text
                text: "Tippe auf das zusammengesetzte Adjektiv."
                say: "Lies den Satz. Tippe auf das zusammengesetzte Adjektiv."
                show: { drawn: letter-card, text: "Nach dem Lauf war ich hundemüde." }
                spans: ["hundemüde"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Was bedeutet „taghell“?"
            say: "Was bedeutet taghell?"
            options: ["so hell wie am Tag", "ein heller Tag", "hell und warm"]
            answer: "so hell wie am Tag"
          - id: l2-c2
            type: multiple_choice
            text: "so nass wie ein Pudel → _"
            say: "So nass wie ein Pudel. Welches Wort passt? … nass."
            options: ["pudelnass", "wüstennass", "Pudelnass"]
            answer: "pudelnass"
          - id: l2-c3
            type: multiple_choice
            text: "Wie schreibt man es richtig?"
            say: "Die Wolke ist grau, aber ganz dunkel. Wie schreibt man das Adjektiv richtig?"
            options: ["dunkelgrau", "dunkel grau", "Dunkelgrau"]
            answer: "dunkelgrau"
          - id: l2-c4
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung. Ich trage eine zitronengelb… Jacke."
            frame: "eine zitronengelb_ Jacke"
            options: ["e", "en", "er"]
            answer: ["e"]
          - id: l2-c5
            type: true_false
            text: "Passt das? Der Löwe ist mausestark."
            say: "Lies die Karte. Passt das?"
            show: { drawn: letter-card, text: "Der Löwe ist mausestark." }
            answer: false
