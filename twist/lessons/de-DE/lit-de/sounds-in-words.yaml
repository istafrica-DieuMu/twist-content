# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.sounds-in-words
skill: lit-de.phonological.sounds-in-words
curriculum: de-DE
language: de
title:
  de: Laute im Wort
  en: Sounds in a word
summary: >
  Children hear where a sound sits in a word (mmm at the start of Maus, in
  the middle of Oma, at the end of Baum) and split short words into all
  their sounds. There are no letters yet: everything is spoken, and every
  picture says its word. Lesson 1 finds the place of a sound; lesson 2
  counts the sounds of a word, blends heard sounds into a word, and ends
  with the skill check.
metadata:
  year: klasse-1
  topic: { de: Laute hören, en: Hearing sounds }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: [lit-de.phonological.initial-sound]
  also_practises: [lit-de.phonological.initial-sound]
  vocabulary: { de: [Laut, Anfang, Mitte, Ende, zerlegen, zusammenschieben] }
  no_reading: true
  forms: [picture, audio, drawn]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: always-start
      what: Says "am Anfang" for every sound, because the first sound is the one practised so far
      addressed: tasks mix start, middle and end; hints say to speak the word slowly and listen for when the sound comes
    - id: two-letters-two-sounds
      what: Counts au or sch as two sounds
      addressed: lesson 2 Learn counts Maus as mmm, au, sss; feedback on 4 for Haus says au is one sound
    - id: sounds-not-blended
      what: Hears the single sounds but cannot push them together into a word
      addressed: lesson 2 Learn blends Baum slowly; audio_choice tasks offer words that differ in one sound (Mund, Mond)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Anfang, Mitte oder Ende?", en: "Start, middle or end?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Fangen sie gleich an?"
            say: "Mond, Maus. Fangen beide gleich an?"
            show: { objects: [moon, mouse] }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Was fängt mit lll an?"
            say: "Was fängt mit lll an? Tippe auf das Bild."
            options: [{ object: lamp }, { object: ball }, { object: fish }]
            answer: lamp
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: "Ein Laut kann am Anfang, in der Mitte oder am Ende eines Wortes stehen. Maus. Mmm ... aus. Das mmm hörst du am Anfang."
            show: { object: mouse }
          - say: "Baum. Bau ... mmm. Das mmm hörst du am Ende."
            show: { object: tree }
          - say: "Oma. O ... mmm ... a. Das mmm hörst du in der Mitte."
            show: { object: grandma }
          - say: "Sprich das Wort ganz langsam und dehne jeden Laut. Dann hörst du, wann der Laut kommt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wo hörst du das sss?"
                say: "Haus. Wo hörst du das sss? Am Anfang, in der Mitte oder am Ende?"
                show: { object: house }
                options: ["am Anfang", "in der Mitte", "am Ende"]
                answer: "am Ende"
                feedback:
                  "am Anfang": "Haus fängt mit h an. Hör auf das Ende: Hau ... sss."
                hints:
                  - "Sprich das Wort ganz langsam."
                  - "Hau ... sss. Das sss kommt ganz zum Schluss."
                  - "Am Ende."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Hörst du am Ende ein lll?"
                say: "Ball. Hörst du am Ende ein lll?"
                show: { object: ball }
                answer: true
                hints:
                  - "Sprich das Wort langsam und hör auf den Schluss."
                  - "Ba ... lll."
                  - "Ja, Ball hört mit lll auf."
              - id: l1-f3
                type: multiple_choice
                text: "Wo hörst du das fff?"
                say: "Affe. Wo hörst du das fff? Am Anfang, in der Mitte oder am Ende?"
                show: { object: monkey }
                options: ["am Anfang", "in der Mitte", "am Ende"]
                answer: "in der Mitte"
                feedback:
                  "am Anfang": "Affe fängt mit a an. Das fff kommt danach."
                  "am Ende": "Affe hört mit e auf. Das fff kommt vorher."
                hints:
                  - "Dehne jeden Laut."
                  - "A ... fff ... e. Vor dem fff kommt noch etwas, danach auch."
                  - "In der Mitte."
              - id: l1-f4
                type: image_multiple_choice
                text: "Wo hörst du am Ende ein mmm?"
                say: "Bei welchem Wort hörst du das mmm am Ende? Tippe auf das Bild."
                options: [{ object: tree }, { object: moon }, { object: grandma }]
                answer: tree
                feedback:
                  moon: "Mond fängt mit mmm an. Du suchst das mmm am Ende."
                  grandma: "Bei Oma hörst du das mmm in der Mitte."
                hints:
                  - "Tippe auf jedes Bild und hör auf den Schluss."
                  - "Baum, Mond, Oma: Wo kommt das mmm ganz zum Schluss?"
                  - "Bau ... mmm. Baum."
              - id: l1-f5
                type: true_false
                text: "Hörst du am Anfang ein sch?"
                say: "Schlange. Hörst du am Anfang ein sch?"
                show: { object: snake }
                answer: true
                hints:
                  - "Halte den ersten Laut lange."
                  - "Schsch ... lange."
                  - "Ja, Schlange fängt mit sch an."
              - id: l1-f6
                type: multiple_choice
                text: "Wo hörst du das lll?"
                say: "Wolke. Wo hörst du das lll? Am Anfang, in der Mitte oder am Ende?"
                show: { object: cloud }
                options: ["am Anfang", "in der Mitte", "am Ende"]
                answer: "in der Mitte"
                hints:
                  - "Sprich das Wort ganz langsam."
                  - "Wo ... lll ... ke. Vorher und nachher hörst du noch Laute."
                  - "In der Mitte."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wo hörst du das sss?"
                say: "Maus. Wo hörst du das sss? Am Anfang, in der Mitte oder am Ende?"
                show: { object: mouse }
                options: ["am Anfang", "in der Mitte", "am Ende"]
                answer: "am Ende"
                hints: ["Sprich das Wort langsam: Wann kommt das sss?"]
              - id: l1-s2
                type: true_false
                text: "Hörst du am Anfang ein lll?"
                say: "Löwe. Hörst du am Anfang ein lll?"
                show: { object: lion }
                answer: true
                hints: ["Halte den ersten Laut lange."]
              - id: l1-s3
                type: multiple_choice
                text: "Wo hörst du das mmm?"
                say: "Lama. Wo hörst du das mmm? Am Anfang, in der Mitte oder am Ende?"
                show: { object: llama }
                options: ["am Anfang", "in der Mitte", "am Ende"]
                answer: "in der Mitte"
                hints: ["Sprich das Wort ganz langsam und hör, wann das mmm kommt."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Wo hörst du am Ende ein sch?"
                say: "Bei welchem Wort hörst du das sch am Ende? Tippe auf das Bild."
                options: [{ object: fish }, { object: snake }, { object: ball }]
                answer: fish
                hints: ["Hör bei jedem Wort auf den Schluss."]
              - id: l1-s5
                type: true_false
                text: "Hörst du am Ende ein mmm?"
                say: "Mond. Hörst du am Ende ein mmm?"
                show: { object: moon }
                answer: false
                hints: ["Was hörst du ganz zum Schluss?"]
              - id: l1-s6
                type: multiple_choice
                text: "Wo hörst du das fff?"
                say: "Ofen. Wo hörst du das fff? Am Anfang, in der Mitte oder am Ende?"
                show: { object: oven }
                options: ["am Anfang", "in der Mitte", "am Ende"]
                answer: "in der Mitte"
                hints: ["Dehne jeden Laut und hör, was vor und nach dem fff kommt."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wo hörst du das lll?"
                say: "Wal. Wo hörst du das lll? Am Anfang, in der Mitte oder am Ende?"
                show: { object: whale }
                options: ["am Anfang", "in der Mitte", "am Ende"]
                answer: "am Ende"
              - id: l1-n2
                type: true_false
                text: "Hörst du am Anfang ein mmm?"
                say: "Messer. Hörst du am Anfang ein mmm?"
                show: { object: knife }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Wo hörst du das sch?"
                say: "Schneemann. Wo hörst du das sch? Am Anfang, in der Mitte oder am Ende?"
                show: { object: snowman }
                options: ["am Anfang", "in der Mitte", "am Ende"]
                answer: "am Anfang"
              - id: l1-n4
                type: image_multiple_choice
                text: "Wo hörst du am Ende ein lll?"
                say: "Bei welchem Wort hörst du das lll am Ende? Tippe auf das Bild."
                options: [{ object: ball }, { object: lamp }, { object: cloud }]
                answer: ball
              - id: l1-n5
                type: multiple_choice
                text: "Wo hörst du das fff?"
                say: "Würfel. Wo hörst du das fff? Am Anfang, in der Mitte oder am Ende?"
                show: { object: cube }
                options: ["am Anfang", "in der Mitte", "am Ende"]
                answer: "in der Mitte"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wo hörst du das mmm?"
            say: "Mund. Wo hörst du das mmm? Am Anfang, in der Mitte oder am Ende?"
            show: { object: mouth }
            options: ["am Anfang", "in der Mitte", "am Ende"]
            answer: "am Anfang"
          - id: l1-c2
            type: true_false
            text: "Hörst du am Ende ein sch?"
            say: "Frosch. Hörst du am Ende ein sch?"
            show: { object: frog }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wo hörst du das mmm?"
            say: "Lampe. Wo hörst du das mmm? Am Anfang, in der Mitte oder am Ende?"
            show: { object: lamp }
            options: ["am Anfang", "in der Mitte", "am Ende"]
            answer: "in der Mitte"

  - n: 2
    title: { de: Laute zählen und zusammenschieben, en: Counting and blending sounds }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo hörst du das lll?"
            say: "Lampe. Wo hörst du das lll? Am Anfang, in der Mitte oder am Ende?"
            show: { object: lamp }
            options: ["am Anfang", "in der Mitte", "am Ende"]
            answer: "am Anfang"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Hörst du am Ende ein sss?"
            say: "Ananas. Hörst du am Ende ein sss?"
            show: { object: pineapple }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: "Jetzt zerlegen wir ein Wort in alle seine Laute. Maus. Mmm ... au ... sss. Das au ist ein Laut. Maus hat drei Laute."
            show: { object: mouse }
          - say: "Für jeden Laut legst du einen Punkt: mmm, au, sss. Drei Laute, drei Punkte."
            show: { drawn: dots, count: 3, layout: row }
          - say: "Es geht auch andersherum. Hör die Laute und schieb sie zusammen: Bbb ... au ... mmm. Baum!"
            show: { object: tree }
          - say: "Manche Wörter haben nur wenige Laute. Eis: Ei ... sss. Das ei ist ein Laut. Eis hat zwei Laute."
            show: { object: ice-cream }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Haus. Wie viele Laute hörst du? Für jeden Laut gibt es einen Punkt."
                show: { object: house }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
                feedback:
                  "4": "Das au klingt wie ein Laut, nicht wie zwei."
                hints:
                  - "Sprich das Wort ganz langsam und zähl an den Fingern."
                  - "H ... au ... sss."
                  - "Drei Laute."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Welches Wort ist das?"
                say: "Hör gut zu und schieb die Laute zusammen. Welches Wort ist das?"
                audio: { de: "Fff ... i ... sch." }
                options: [{ object: fish }, { object: frog }, { object: ball }]
                answer: fish
                feedback:
                  frog: "Frosch fängt auch mit fff an, aber danach kommt rrr."
                hints:
                  - "Sprich die Laute nach und werde immer schneller."
                  - "Fff ... isch."
                  - "Fisch."
              - id: l2-f3
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Ball. Wie viele Laute hörst du?"
                show: { object: ball }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
                hints:
                  - "Dehne jeden Laut."
                  - "Bbb ... a ... lll."
                  - "Drei Laute."
              - id: l2-f4
                type: true_false
                text: "Hat das Wort drei Laute?"
                say: "Buch. Hat Buch drei Laute?"
                show: { object: book }
                answer: true
                hints:
                  - "Zähl die Laute an den Fingern."
                  - "Bbb ... u ... ch."
                  - "Ja, drei Laute."
              - id: l2-f5
                type: audio_choice
                text: "Welches Wort ist das?"
                say: "Hör gut zu und schieb die Laute zusammen. Welches Wort ist das?"
                audio: { de: "Mmm ... u ... n ... t." }
                options: [{ object: mouth }, { object: moon }, { object: mouse }]
                answer: mouth
                feedback:
                  moon: "Bei Mond hörst du in der Mitte ein o. Hier war es ein u."
                hints:
                  - "Hör genau auf den Laut nach dem mmm."
                  - "Mmm ... u ... nt."
                  - "Mund."
              - id: l2-f6
                type: image_multiple_choice
                text: "Welches Wort hat vier Laute?"
                say: "Welches Wort hat vier Laute? Die Bilder sagen ihr Wort, wenn du sie antippst."
                options: [{ object: lion }, { object: whale }, { object: egg }]
                answer: lion
                hints:
                  - "Zähl bei jedem Wort die Laute."
                  - "Wal hat drei Laute, Ei nur einen."
                  - "Lll ... ö ... w ... e: Löwe hat vier."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Wal. Wie viele Laute hörst du?"
                show: { object: whale }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
                hints: ["Für jeden Laut einen Finger."]
              - id: l2-s2
                type: audio_choice
                text: "Welches Wort ist das?"
                say: "Hör gut zu und schieb die Laute zusammen. Welches Wort ist das?"
                audio: { de: "Kkk ... i ... n ... t." }
                options: [{ object: child }, { object: cake }, { object: kite }]
                answer: child
                hints: ["Sprich die Laute nach und schieb sie langsam zusammen."]
              - id: l2-s3
                type: true_false
                text: "Hat das Wort zwei Laute?"
                say: "Ei. Hat Ei zwei Laute?"
                show: { object: egg }
                answer: false
                hints: ["Denk an das au in Maus. Wie viele Laute sind das?"]
              - id: l2-s4
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Oma. Wie viele Laute hörst du?"
                show: { object: grandma }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
                hints: ["Dehne jeden Laut und zähl mit."]
              - id: l2-s5
                type: audio_choice
                text: "Welches Wort ist das?"
                say: "Hör gut zu und schieb die Laute zusammen. Welches Wort ist das?"
                audio: { de: "Lll ... a ... mmm ... a." }
                options: [{ object: llama }, { object: lamp }, { object: lion }]
                answer: llama
                hints: ["Hör bis zum letzten Laut zu."]
              - id: l2-s6
                type: image_multiple_choice
                text: "Welches Wort hat fünf Laute?"
                say: "Welches Wort hat fünf Laute? Die Bilder sagen ihr Wort, wenn du sie antippst."
                options: [{ object: snake }, { object: dog }, { object: house }]
                answer: snake
                hints: ["Zähl bei jedem Wort die Laute."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Fisch. Wie viele Laute hörst du?"
                show: { object: fish }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
              - id: l2-n2
                type: audio_choice
                text: "Welches Wort ist das?"
                say: "Hör gut zu und schieb die Laute zusammen. Welches Wort ist das?"
                audio: { de: "H ... u ... n ... t." }
                options: [{ object: dog }, { object: house }, { object: mouth }]
                answer: dog
              - id: l2-n3
                type: true_false
                text: "Hat das Wort vier Laute?"
                say: "Mond. Hat Mond vier Laute?"
                show: { object: moon }
                answer: true
              - id: l2-n4
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Auto. Wie viele Laute hörst du?"
                show: { object: car }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
              - id: l2-n5
                type: audio_choice
                text: "Welches Wort ist das?"
                say: "Hör gut zu und schieb die Laute zusammen. Welches Wort ist das?"
                audio: { de: "Sss ... o ... nnn ... e." }
                options: [{ object: sun }, { object: saw }, { object: moon }]
                answer: sun

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wo hörst du das sch?"
            say: "Fisch. Wo hörst du das sch? Am Anfang, in der Mitte oder am Ende?"
            show: { object: fish }
            options: ["am Anfang", "in der Mitte", "am Ende"]
            answer: "am Ende"
          - id: l2-c2
            type: image_multiple_choice
            text: "Wie viele Laute hörst du?"
            say: "Löwe. Wie viele Laute hörst du?"
            show: { object: lion }
            options:
              - { drawn: dots, count: 3, layout: row }
              - { drawn: dots, count: 4, layout: row }
              - { drawn: dots, count: 5, layout: row }
            answer: "4"
          - id: l2-c3
            type: audio_choice
            text: "Welches Wort ist das?"
            say: "Hör gut zu. Welches Wort ist das?"
            audio: { de: "Bbb ... a ... lll." }
            options: [{ object: ball }, { object: book }, { object: tree }]
            answer: ball
          - id: l2-c4
            type: true_false
            text: "Hörst du am Anfang ein fff?"
            say: "Frosch. Hörst du am Anfang ein fff?"
            show: { object: frog }
            answer: true
          - id: l2-c5
            type: multiple_choice
            text: "Wo hörst du das mmm?"
            say: "Ameise. Wo hörst du das mmm? Am Anfang, in der Mitte oder am Ende?"
            show: { object: ant }
            options: ["am Anfang", "in der Mitte", "am Ende"]
            answer: "in der Mitte"
