# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.research
skill: lit-de.texts-media.research
curriculum: de-DE
language: de
title:
  de: Informationen suchen und prüfen
  en: Finding and checking information
summary: >
  Looking up an answer to a question and checking whether it can be
  trusted. Lesson 1 turns a question into search words, finds the entry
  in a children's encyclopedia by its first letter, picks the search
  result that fits and puts the research steps in order; lesson 2 checks
  whether a page is reliable (who made it, advertising, a second source),
  spots the source that is wrong, notes the answer with its source, and
  ends with the skill check. Search results are shown as text lists; the
  child does not use a live browser.
metadata:
  year: klasse-4
  topic: { de: Medien, en: Media }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.texts-media.digital-texts, lit-de.comprehension.notes]
  also_practises: [lit-de.comprehension.notes]
  vocabulary: { de: [Suchbegriff, Kinderlexikon, Stichwort, Suchmaschine, Treffer, Werbung, verlässlich, Quelle, Register] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: vague-search-words
      what: Searches with words that are too general (Tiere, Afrika) or with the whole chatty question
      addressed: lesson 1 Learn picks one or two key words from the question; every stage of lesson 1 asks for the best search words, with feedback in l1-f1
    - id: online-means-true
      what: Believes whatever a web page says, or trusts a page because it looks exciting
      addressed: lesson 2 Learn checks who made a page and compares with a second source; every stage of lesson 2 has a reliability choice and a wrong source to spot, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Richtig suchen", en: "Searching well" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Auf einer Internetseite ist ein Wort blau und unterstrichen. Was ist das meistens?"
            options: ["ein Link", "ein Fehler", "eine Überschrift"]
            answer: "ein Link"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "„Der Biber baut Burgen aus Ästen und Schlamm.“ Welche Stichwörter passen?"
            options: ["Biber: Burgen aus Ästen, Schlamm", "Biber: schwimmt gut", "der, aus, und"]
            answer: "Biber: Burgen aus Ästen, Schlamm"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Frage: Wie lange halten Igel Winterschlaf?\nSuchbegriffe: Igel Winterschlaf"
            say: "Bevor du suchst, schreibst du deine Frage auf. Dann wählst du ein oder zwei Suchbegriffe. Das sind die wichtigsten Wörter aus deiner Frage."
          - text: "Kinderlexikon: Stichwörter von A bis Z\nIgel steht unter I."
            say: "Im Kinderlexikon stehen die Stichwörter nach dem Alphabet. Igel findest du also unter I. Im Internet nimmst du eine Suchmaschine für Kinder, zum Beispiel fragFINN oder Blinde Kuh."
          - text: "1. Igel im Winter: So lange schlafen sie\n2. Igel-Stachelball, jetzt nur 9,99 Euro!\n3. Der Igel im Märchen"
            say: "Lies die Treffer genau und nimm den, der zu deiner Frage passt. Hier ist es der erste. Der zweite ist Werbung, der dritte eine Geschichte."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Du willst wissen, wie lange Elefanten leben. Welche Suchbegriffe passen am besten?"
                options: ["Elefant Lebensalter", "Tiere Afrika Zoo", "Ferien"]
                answer: "Elefant Lebensalter"
                feedback:
                  "Tiere Afrika Zoo": "Diese Wörter sind zu allgemein. Du findest dann viel, was nicht zu deiner Frage passt."
                hints:
                  - "Welche Wörter aus deiner Frage sind am wichtigsten?"
                  - "Es geht um ein bestimmtes Tier und um sein Alter."
                  - "Elefant Lebensalter."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Du willst im Kinderlexikon nachlesen, wo Pinguine leben. Unter welchem Buchstaben suchst du?"
                options: ["P", "L", "W"]
                answer: "P"
                option_audio: false
                hints:
                  - "Welches Wort ist das Stichwort?"
                  - "Du suchst nach dem Tier, nicht nach leben oder wo."
                  - "Pinguin steht unter P."
              - id: l1-f3
                type: multiple_choice
                text: "Deine Frage: Was fressen Pandas?\n\n1. Panda-Plüschtier jetzt im Angebot!\n2. Der Große Panda: Lebensraum und Nahrung\n3. Pandas im Zoo: Öffnungszeiten und Preise\n\nWelcher Treffer hilft dir?"
                say: "Deine Frage ist: Was fressen Pandas? Lies die Treffer. Welcher hilft dir?"
                options: ["Treffer 2", "Treffer 1", "Treffer 3"]
                answer: "Treffer 2"
                keep_order: true
                hints:
                  - "Welcher Treffer hat etwas mit Fressen zu tun?"
                  - "Ein anderes Wort für Futter ist Nahrung."
                  - "Treffer 2: Lebensraum und Nahrung."
              - id: l1-f4
                type: ordering
                text: "Bring die Schritte in die richtige Reihenfolge."
                say: "Du suchst eine Antwort auf eine Frage. Bring die Schritte in die richtige Reihenfolge."
                options: ["suchen und lesen", "die Antwort notieren", "die Frage aufschreiben", "Suchbegriffe überlegen"]
                slot_count: 4
                answer: ["die Frage aufschreiben", "Suchbegriffe überlegen", "suchen und lesen", "die Antwort notieren"]
                hints:
                  - "Was musst du wissen, bevor du Suchbegriffe wählst?"
                  - "Am Anfang steht die Frage, am Ende die Antwort."
                  - "Frage, Suchbegriffe, suchen und lesen, notieren."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? Oft reicht es, ein oder zwei wichtige Wörter einzugeben."
                say: "Stimmt das? Oft reicht es, ein oder zwei wichtige Wörter einzugeben."
                answer: true
                hints:
                  - "Denk an Igel Winterschlaf."
                  - "Die wichtigen Wörter reichen der Suchmaschine."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Du willst wissen, wie hoch der höchste Berg in Deutschland ist. Welche Suchbegriffe passen am besten?"
                options: ["höchster Berg Deutschland", "Berg", "Urlaub Alpen"]
                answer: "höchster Berg Deutschland"
                hints: ["Welche Wörter sagen genau, was du suchst?"]
              - id: l1-s2
                type: multiple_choice
                text: "Du willst im Kinderlexikon etwas über Vulkane nachlesen. Unter welchem Buchstaben suchst du?"
                options: ["V", "F", "W"]
                answer: "V"
                option_audio: false
                hints: ["Wie schreibt man Vulkan?"]
              - id: l1-s3
                type: multiple_choice
                text: "Deine Frage: Wie entsteht ein Regenbogen?\n\n1. Regenbogen: So entsteht er, einfach erklärt\n2. Regenbogentorte backen: das Rezept\n3. Regenschirme günstig kaufen\n\nWelcher Treffer hilft dir?"
                say: "Deine Frage ist: Wie entsteht ein Regenbogen? Lies die Treffer. Welcher hilft dir?"
                options: ["Treffer 1", "Treffer 2", "Treffer 3"]
                answer: "Treffer 1"
                keep_order: true
                hints: ["In welchem Treffer steht das Wort entsteht?"]
              - id: l1-s4
                type: ordering
                text: "So stehen die Stichwörter im Lexikon. Bring sie in die richtige Reihenfolge."
                say: "Im Lexikon stehen die Stichwörter nach dem Alphabet. Bring sie in die richtige Reihenfolge."
                options: ["Dachs", "Adler", "Esel", "Biber"]
                slot_count: 4
                answer: ["Adler", "Biber", "Dachs", "Esel"]
                hints: ["Schau auf den ersten Buchstaben: A, B, D, E."]
              - id: l1-s5
                type: multiple_choice
                text: "Wo findest du in einem Sachbuch schnell die Seite über Igel?"
                options: ["im Register hinten im Buch", "auf dem Buchrücken", "auf der letzten Seite der Geschichte"]
                answer: "im Register hinten im Buch"
                hints: ["Wo stehen alle wichtigen Wörter mit ihrer Seitenzahl?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Du willst wissen, wie viele Beine eine Spinne hat. Welche Suchbegriffe passen am besten?"
                options: ["Spinne Beine", "Tiere mit Beinen", "Garten Insekten"]
                answer: "Spinne Beine"
              - id: l1-n2
                type: multiple_choice
                text: "Du willst im Kinderlexikon etwas über das Chamäleon nachlesen. Unter welchem Buchstaben suchst du?"
                options: ["C", "K", "S"]
                answer: "C"
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Deine Frage: Wie alt werden Schildkröten?\n\n1. Schildkrötenspiel kostenlos spielen\n2. Wie alt werden Schildkröten? Antworten für Kinder\n3. Schildkrötenfutter im Sonderangebot\n\nWelcher Treffer hilft dir?"
                say: "Deine Frage ist: Wie alt werden Schildkröten? Lies die Treffer. Welcher hilft dir?"
                options: ["Treffer 1", "Treffer 2", "Treffer 3"]
                answer: "Treffer 2"
                keep_order: true
              - id: l1-n4
                type: ordering
                text: "So stehen die Stichwörter im Lexikon. Bring sie in die richtige Reihenfolge."
                say: "Im Lexikon stehen die Stichwörter nach dem Alphabet. Bring sie in die richtige Reihenfolge."
                options: ["Hamster", "Krokodil", "Giraffe", "Igel"]
                slot_count: 4
                answer: ["Giraffe", "Hamster", "Igel", "Krokodil"]
              - id: l1-n5
                type: true_false
                text: "Stimmt das? Ein Treffer mit „jetzt kaufen“ oder „im Angebot“ ist meistens Werbung."
                say: "Stimmt das? Ein Treffer mit jetzt kaufen oder im Angebot ist meistens Werbung."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Du willst wissen, woraus man Glas macht. Welche Suchbegriffe passen am besten?"
            options: ["Glas herstellen", "Fenster putzen", "Flaschen"]
            answer: "Glas herstellen"
          - id: l1-c2
            type: multiple_choice
            text: "Du willst im Kinderlexikon etwas über Pferde nachlesen. Unter welchem Buchstaben suchst du?"
            options: ["P", "F", "B"]
            answer: "P"
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "Deine Frage: Warum ist das Meer salzig?\n\n1. Meersalz für die Küche bestellen\n2. Warum ist das Meer salzig? Einfach erklärt\n3. Die schönsten Strände am Meer\n\nWelcher Treffer hilft dir?"
            say: "Deine Frage ist: Warum ist das Meer salzig? Lies die Treffer. Welcher hilft dir?"
            options: ["Treffer 1", "Treffer 2", "Treffer 3"]
            answer: "Treffer 2"
            keep_order: true

  - n: 2
    title: { de: "Stimmt das wirklich?", en: "Is that really true?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Du willst wissen, was Koalas fressen. Welche Suchbegriffe passen am besten?"
            options: ["Koala Nahrung", "Australien", "Bären Zoo"]
            answer: "Koala Nahrung"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Unter welchem Buchstaben steht Zebra im Kinderlexikon?"
            options: ["Z", "S", "T"]
            answer: "Z"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Gute Zeichen:\nMan sieht, wer die Seite gemacht hat.\nDie Seite erklärt es für Kinder.\nSie will dir nichts verkaufen."
            say: "Nicht alles im Internet stimmt. Prüfe: Wer hat die Seite gemacht? Ein Museum, eine Zeitung oder ein Kindersender? Oder weißt du es gar nicht? Will die Seite dir etwas verkaufen?"
          - text: "Seite A: Igel schlafen von November bis März.\nKinderlexikon: Igel halten etwa von November bis März Winterschlaf."
            say: "Vergleiche mit einer zweiten Quelle, zum Beispiel einem Kinderlexikon. Sagen beide dasselbe, kannst du der Angabe eher trauen."
          - text: "Igel, Winterschlaf: November bis März\n(Kinderlexikon, Seite 34)"
            say: "Schreib die Antwort in Stichwörtern auf und notiere, woher du sie hast. Das ist deine Quelle."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Du suchst etwas über Dinosaurier. Welche Seite ist wohl am verlässlichsten?"
                options: ["die Kinderseite eines Naturkundemuseums", "ein Beitrag ohne Namen mit vielen blinkenden Werbefenstern", "ein Kommentar unter einem Video"]
                answer: "die Kinderseite eines Naturkundemuseums"
                feedback:
                  "ein Beitrag ohne Namen mit vielen blinkenden Werbefenstern": "Du weißt nicht, wer das geschrieben hat, und die Seite will vor allem Werbung zeigen. Das sind Warnzeichen."
                hints:
                  - "Bei welcher Seite weißt du, wer sie gemacht hat?"
                  - "Ein Museum kennt sich mit Dinosauriern aus."
                  - "Die Kinderseite des Naturkundemuseums."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Gutes Zeichen oder Warnzeichen?"
                say: "Sortiere: Ist das ein gutes Zeichen oder ein Warnzeichen für eine Internetseite?"
                bins:
                  - { id: good, show: { text: "gutes Zeichen" }, say: "gutes Zeichen" }
                  - { id: warn, show: { text: "Warnzeichen" }, say: "Warnzeichen" }
                options:
                  - { text: "Man sieht, wer die Seite gemacht hat.", bin: good }
                  - { text: "Die Seite erklärt es für Kinder.", bin: good }
                  - { text: "Überall blinkt Werbung.", bin: warn }
                  - { text: "Du sollst erst deinen Namen und deine Adresse eingeben.", bin: warn }
                hints:
                  - "Würdest du einer Seite trauen, die du nicht kennst?"
                  - "Deine Adresse gibst du nie einfach so ein."
                  - "Gut: man sieht, wer sie gemacht hat, und sie ist für Kinder. Warnzeichen: Werbung, Adresse eingeben."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Sagen zwei verschiedene Quellen dasselbe, kannst du der Angabe eher trauen."
                say: "Stimmt das? Sagen zwei verschiedene Quellen dasselbe, kannst du der Angabe eher trauen."
                answer: true
                hints:
                  - "Warum vergleicht man mit einem Lexikon?"
                  - "Zwei Quellen irren sich selten genau gleich."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: multiple_choice
                text: "Seite A: Ein Gepard läuft bis zu 100 km/h schnell.\nSeite B: Ein Gepard läuft bis zu 1000 km/h schnell.\nKinderlexikon: Geparden erreichen etwa 100 km/h.\n\nWelche Quelle irrt sich wohl?"
                say: "Lies die drei Angaben. Welche Quelle irrt sich wohl?"
                options: ["Seite B", "Seite A", "das Kinderlexikon"]
                answer: "Seite B"
                hints:
                  - "Welche zwei Angaben sagen dasselbe?"
                  - "Seite A und das Lexikon sagen etwa 100 km/h."
                  - "Seite B irrt sich: 1000 km/h ist schneller als ein Flugzeug."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Notiz ist am besten?"
                options: ["Gepard: bis etwa 100 km/h (Kinderlexikon, S. 51)", "Gepard schnell", "Ich habe etwas über Geparden gelesen."]
                answer: "Gepard: bis etwa 100 km/h (Kinderlexikon, S. 51)"
                hints:
                  - "Eine gute Notiz beantwortet die Frage genau."
                  - "Steht auch dabei, woher die Angabe kommt?"
                  - "Die erste Notiz hat die Zahl und die Quelle."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Du willst wissen, wie viele Menschen in Hamburg leben. Welche Quelle ist am verlässlichsten?"
                options: ["die Internetseite der Stadt Hamburg", "ein Rätselheft", "ein Werbeprospekt"]
                answer: "die Internetseite der Stadt Hamburg"
                hints: ["Wer weiß am besten, wie viele Menschen in Hamburg leben?"]
              - id: l2-s2
                type: sorting
                text: "Gutes Zeichen oder Warnzeichen?"
                say: "Sortiere: Ist das ein gutes Zeichen oder ein Warnzeichen für eine Internetseite?"
                bins:
                  - { id: good, show: { text: "gutes Zeichen" }, say: "gutes Zeichen" }
                  - { id: warn, show: { text: "Warnzeichen" }, say: "Warnzeichen" }
                options:
                  - { text: "Ein Lexikon sagt dasselbe.", bin: good }
                  - { text: "Es steht dabei, wann der Text geschrieben wurde.", bin: good }
                  - { text: "„Nur hier erfährst du die Wahrheit!“", bin: warn }
                  - { text: "Die Seite will, dass du sofort etwas kaufst.", bin: warn }
                hints: ["Wer laut ruft, dass nur er recht hat, will oft etwas anderes."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Was im Internet steht, ist immer richtig."
                say: "Stimmt das? Was im Internet steht, ist immer richtig."
                answer: false
                hints: ["Kann jeder etwas ins Internet schreiben?"]
              - id: l2-s4
                type: multiple_choice
                text: "Seite A: Der Rhein ist etwa 1200 km lang.\nSeite B: Der Rhein ist etwa 12 km lang.\nAtlas: Der Rhein ist rund 1230 km lang.\n\nWelche Quelle irrt sich wohl?"
                say: "Lies die drei Angaben. Welche Quelle irrt sich wohl?"
                options: ["Seite B", "Seite A", "der Atlas"]
                answer: "Seite B"
                hints: ["Welche zwei Angaben passen zusammen?"]
              - id: l2-s5
                type: multiple_choice
                text: "Was schreibst du zu deiner Notiz dazu?"
                options: ["woher du die Angabe hast", "wie spät es war", "deine Lieblingsfarbe"]
                answer: "woher du die Angabe hast"
                hints: ["Wie heißt das Buch oder die Seite, aus der du es hast?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Du suchst etwas über Haie. Welche Seite nimmst du?"
                options: ["die Kinderseite eines Meeresmuseums", "ein Spiel, in dem Haie Autos fressen", "eine Seite, die Haiposter verkauft"]
                answer: "die Kinderseite eines Meeresmuseums"
              - id: l2-n2
                type: sorting
                text: "Gutes Zeichen oder Warnzeichen?"
                say: "Sortiere: Ist das ein gutes Zeichen oder ein Warnzeichen für eine Internetseite?"
                bins:
                  - { id: good, show: { text: "gutes Zeichen" }, say: "gutes Zeichen" }
                  - { id: warn, show: { text: "Warnzeichen" }, say: "Warnzeichen" }
                options:
                  - { text: "Die Seite gehört zu einem Kindersender.", bin: good }
                  - { text: "Schwierige Wörter werden erklärt.", bin: good }
                  - { text: "Niemand weiß, wer den Text geschrieben hat.", bin: warn }
                  - { text: "Ein Fenster ruft: „Du hast gewonnen! Klick hier!“", bin: warn }
              - id: l2-n3
                type: true_false
                text: "Eine Seite will deine Adresse, bevor du weiterlesen darfst. Ist das ein Warnzeichen?"
                say: "Eine Seite will deine Adresse, bevor du weiterlesen darfst. Ist das ein Warnzeichen?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Seite A: Eine Biene hat sechs Beine.\nSeite B: Eine Biene hat acht Beine.\nKinderlexikon: Insekten wie die Biene haben sechs Beine.\n\nWelche Quelle irrt sich wohl?"
                say: "Lies die drei Angaben. Welche Quelle irrt sich wohl?"
                options: ["Seite B", "Seite A", "das Kinderlexikon"]
                answer: "Seite B"
              - id: l2-n5
                type: multiple_choice
                text: "Welche Notiz ist am besten?"
                options: ["Biene: 6 Beine (Kinderlexikon, S. 12)", "Bienen sind toll.", "Beine"]
                answer: "Biene: 6 Beine (Kinderlexikon, S. 12)"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Du willst wissen, wie schnell ein Delfin schwimmt. Welche Suchbegriffe passen am besten?"
            options: ["Delfin Geschwindigkeit", "Meer Urlaub", "Fische"]
            answer: "Delfin Geschwindigkeit"
          - id: l2-c2
            type: multiple_choice
            text: "Deine Frage: Wie bauen Vögel ihre Nester?\n\n1. Vogelhäuschen aus Holz: jetzt bestellen\n2. Lustige Vogelstimmen zum Anhören\n3. Nestbau: So bauen Vögel ihr Nest\n\nWelcher Treffer hilft dir?"
            say: "Deine Frage ist: Wie bauen Vögel ihre Nester? Lies die Treffer. Welcher hilft dir?"
            options: ["Treffer 1", "Treffer 2", "Treffer 3"]
            answer: "Treffer 3"
            keep_order: true
          - id: l2-c3
            type: sorting
            text: "Kannst du der Seite trauen?"
            say: "Ordne zu: Spricht das für die Seite, oder ist es ein Warnzeichen?"
            bins:
              - { id: good, show: { text: "gutes Zeichen" }, say: "gutes Zeichen" }
              - { id: warn, show: { text: "Warnzeichen" }, say: "Warnzeichen" }
            options:
              - { text: "Die Seite gehört zu einem Zoo.", bin: good }
              - { text: "Das Kinderlexikon sagt dasselbe.", bin: good }
              - { text: "Neben dem Text blinkt ein Kaufknopf.", bin: warn }
              - { text: "Die Seite verrät nicht, wer sie gemacht hat.", bin: warn }
          - id: l2-c4
            type: multiple_choice
            text: "Seite A: Der Mount Everest ist etwa 8800 Meter hoch.\nSeite B: Der Mount Everest ist etwa 880 Meter hoch.\nAtlas: Der Mount Everest ist rund 8850 Meter hoch.\n\nWelche Quelle irrt sich wohl?"
            say: "Lies die drei Angaben. Welche Quelle irrt sich wohl?"
            options: ["Seite B", "Seite A", "der Atlas"]
            answer: "Seite B"
          - id: l2-c5
            type: ordering
            text: "Bring die Schritte beim Nachforschen in die richtige Reihenfolge."
            say: "Bring die Schritte beim Nachforschen in die richtige Reihenfolge."
            options: ["mit einer zweiten Quelle vergleichen", "eine passende Seite lesen", "die Antwort mit Quelle notieren", "Suchbegriffe eingeben"]
            slot_count: 4
            answer: ["Suchbegriffe eingeben", "eine passende Seite lesen", "mit einer zweiten Quelle vergleichen", "die Antwort mit Quelle notieren"]
