# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.nouns-recognise
skill: lit-de.nouns.recognise
curriculum: de-DE
language: de
title:
  de: Nomen erkennen
  en: Recognising nouns
summary: >
  Children learn that Nomen are the names for people, animals, plants and
  things, and that a Nomen always starts with a capital letter. Lesson 1
  sorts pictures into Menschen, Tiere, Pflanzen and Dinge and picks the
  Nomen out of word groups; lesson 2 uses the capital letter: find every
  Nomen in a short sentence, pick the right spelling, and ends with the
  skill check.
metadata:
  year: klasse-1
  topic: { de: Nomen, en: Nouns }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.word-picture]
  also_practises: [lit-de.vocabulary.categories]
  vocabulary: { de: [Nomen, Namenwort, Mensch, Tier, Pflanze, Ding, großschreiben] }
  forms: [picture, drawn, audio]
  drawn: [word-card, letter-card]
  facets: []
  misconceptions:
    - id: only-things
      what: Thinks only things you can hold are Nomen, so people, animals and plants are left out
      addressed: "Learn names all four groups; sorting tasks need all four bins; l1-f3 asks if Oma is a Nomen, with hints that people are Nomen too"
    - id: first-word-only
      what: Thinks a capital letter just marks the first word, so every capital word is a Nomen and Nomen in the middle of a sentence are missed
      addressed: "l2-f1, l2-s1, l2-n1 and l2-c1 start with Der, Die or Das, which are not Nomen; Learn screen 3 and the l2-f1 hint say the first word is big because the sentence starts there; l2-n5 has Nomen in the middle (Lea, Kuchen)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Menschen, Tiere, Pflanzen, Dinge", en: "People, animals, plants, things" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Hose" }
            options: [{ object: rose }, { object: trousers }]
            answer: trousers
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Tisch" }
            options: [{ object: fish }, { object: table }]
            answer: table
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Nomen"
            say: "Alles, was du sehen und anfassen kannst, hat einen Namen: der Tisch, der Ball. Solche Wörter heißen Nomen."
            show: { object: ball }
          - text: "Menschen und Tiere"
            say: "Auch Menschen und Tiere haben Namen: die Oma, das Kind, der Hund, die Katze. Das sind auch Nomen."
            show: { objects: [grandma, dog] }
          - text: "Pflanzen und Dinge"
            say: "Und Pflanzen: der Baum, die Rose. Menschen, Tiere, Pflanzen und Dinge: Das alles sind Nomen."
            show: { objects: [tree, rose] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Mensch, Tier oder Ding?"
                say: "Ist es ein Mensch, ein Tier oder ein Ding? Sortiere die Bilder."
                bins:
                  - { id: mensch, show: { text: "Mensch" }, say: "Mensch" }
                  - { id: tier, show: { text: "Tier" }, say: "Tier" }
                  - { id: ding, show: { text: "Ding" }, say: "Ding" }
                options:
                  - { object: grandma, bin: mensch }
                  - { object: cat, bin: tier }
                  - { object: cup, bin: ding }
                  - { object: baby, bin: mensch }
                  - { object: frog, bin: tier }
                  - { object: chair, bin: ding }
                hints:
                  - "Tippe auf ein Bild und hör das Wort. Lebt es? Ist es ein Mensch?"
                  - "Oma und Baby sind Menschen. Katze und Frosch sind Tiere."
                  - "Tasse und Stuhl sind Dinge."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Wo ist eine Pflanze?"
                say: "Wo ist eine Pflanze?"
                options: [{ object: tree }, { object: dog }, { object: ball }]
                answer: tree
                hints:
                  - "Eine Pflanze wächst aus der Erde."
                  - "Der Hund läuft, der Ball rollt. Was wächst?"
                  - "Der Baum ist eine Pflanze."
              - id: l1-f3
                type: true_false
                text: "Ist das ein Nomen?"
                say: "Oma. Ist das Wort Oma ein Nomen?"
                show: { object: grandma }
                answer: true
                hints:
                  - "Nomen sind Namen für Menschen, Tiere, Pflanzen und Dinge."
                  - "Ist die Oma ein Mensch?"
                  - "Ja. Oma ist ein Mensch, also ist Oma ein Nomen."
              - id: l1-f4
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Welches Wort ist ein Nomen?"
                options: ["laufen", "Katze", "schnell"]
                answer: "Katze"
                feedback:
                  laufen: "Laufen ist etwas, das man tut. Das ist kein Nomen."
                  schnell: "Schnell sagt, wie etwas ist. Das ist kein Nomen."
                hints:
                  - "Frag dich: Kann ich das sehen oder anfassen?"
                  - "Eine Katze kannst du sehen und streicheln. Und laufen oder schnell?"
                  - "Katze ist ein Nomen. Sie ist ein Tier."
              - id: l1-f5
                type: sorting
                text: "Tier oder Pflanze?"
                say: "Ist es ein Tier oder eine Pflanze? Sortiere die Bilder."
                bins:
                  - { id: tier, show: { text: "Tier" }, say: "Tier" }
                  - { id: pflanze, show: { text: "Pflanze" }, say: "Pflanze" }
                options:
                  - { object: rose, bin: pflanze }
                  - { object: fir-tree, bin: pflanze }
                  - { object: rabbit, bin: tier }
                  - { object: snail, bin: tier }
                hints:
                  - "Tiere können sich bewegen. Pflanzen wachsen an einem Platz."
                  - "Die Schnecke ist langsam, aber sie kriecht."
                  - "Rose und Tanne sind Pflanzen, Hase und Schnecke sind Tiere."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Welches Wort ist ein Nomen?"
                options: ["springen", "rot", "Ball"]
                answer: "Ball"
                hints: ["Kann ich das anfassen?"]
              - id: l1-s2
                type: sorting
                text: "Mensch, Tier, Pflanze oder Ding?"
                say: "Sortiere die Bilder: Mensch, Tier, Pflanze oder Ding."
                bins:
                  - { id: mensch, show: { text: "Mensch" }, say: "Mensch" }
                  - { id: tier, show: { text: "Tier" }, say: "Tier" }
                  - { id: pflanze, show: { text: "Pflanze" }, say: "Pflanze" }
                  - { id: ding, show: { text: "Ding" }, say: "Ding" }
                options:
                  - { object: teacher, bin: mensch }
                  - { object: duck, bin: tier }
                  - { object: leaf, bin: pflanze }
                  - { object: scissors, bin: ding }
                hints: ["Die Lehrerin ist ein Mensch, die Ente ein Tier."]
              - id: l1-s3
                type: true_false
                text: "Ist das ein Nomen?"
                say: "Baum. Ist das Wort Baum ein Nomen?"
                show: { object: tree }
                answer: true
                hints: ["Ist ein Baum eine Pflanze?"]
              - id: l1-s4
                type: true_false
                text: "Ist das ein Nomen?"
                say: "Singen. Ist das Wort singen ein Nomen?"
                show: { object: sing }
                answer: false
                hints: ["Singen ist etwas, das man tut. Das kannst du nicht anfassen."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Wo ist ein Mensch?"
                say: "Wo ist ein Mensch?"
                options: [{ object: monkey }, { object: doctor }, { object: snowman }]
                answer: doctor
                hints: ["Ein Schneemann sieht aus wie ein Mensch, aber er ist aus Schnee."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Welches Wort ist ein Nomen?"
                options: ["Rose", "lesen", "klein"]
                answer: "Rose"
              - id: l1-n2
                type: sorting
                text: "Mensch, Tier oder Pflanze?"
                say: "Sortiere die Bilder: Mensch, Tier oder Pflanze."
                bins:
                  - { id: mensch, show: { text: "Mensch" }, say: "Mensch" }
                  - { id: tier, show: { text: "Tier" }, say: "Tier" }
                  - { id: pflanze, show: { text: "Pflanze" }, say: "Pflanze" }
                options:
                  - { object: grandpa, bin: mensch }
                  - { object: girl, bin: mensch }
                  - { object: hedgehog, bin: tier }
                  - { object: tree, bin: pflanze }
              - id: l1-n3
                type: true_false
                text: "Ist das ein Nomen?"
                say: "Schnell. Ist das Wort schnell ein Nomen?"
                show: { drawn: word-card, text: "schnell" }
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                text: "Wo ist ein Ding?"
                say: "Wo ist ein Ding? Kein Mensch, kein Tier, keine Pflanze."
                options: [{ object: rose }, { object: bird }, { object: pencil }]
                answer: pencil
              - id: l1-n5
                type: true_false
                text: "Ist das ein Nomen?"
                say: "Hund. Ist das Wort Hund ein Nomen?"
                show: { object: dog }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Welches Wort ist ein Nomen?"
            options: ["malen", "Tasse", "groß"]
            answer: "Tasse"
          - id: l1-c2
            type: true_false
            text: "Ist das ein Nomen?"
            say: "Kind. Ist das Wort Kind ein Nomen?"
            show: { object: child }
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Wo ist eine Pflanze?"
            say: "Wo ist eine Pflanze?"
            options: [{ object: cat }, { object: rose }, { object: book }]
            answer: rose

  - n: 2
    title: { de: Nomen schreibt man groß, en: Nouns take a capital }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Welches Wort ist ein Nomen?"
            options: ["Baum", "gehen"]
            answer: "Baum"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Wo ist ein Tier?"
            say: "Wo ist ein Tier?"
            options: [{ object: chair }, { object: fox }]
            answer: fox
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Hund"
            say: "Nomen schreibt man groß. Der erste Buchstabe ist ein Großbuchstabe: H wie Hund."
            show: { drawn: word-card, text: "Hund" }
          - text: "Der Hund holt den Ball."
            say: "In diesem Satz sind zwei Nomen: Hund und Ball. Beide fangen groß an."
            show: { drawn: letter-card, text: "Der Hund holt den Ball." }
          - text: "Der"
            say: "Der ist auch groß. Aber der ist kein Nomen. Es fängt groß an, weil der Satz damit anfängt."
            show: { drawn: letter-card, text: "Der Hund holt den Ball." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Ball rollt zur Katze. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Der Ball rollt zur Katze." }
                spans: ["Ball", "Katze."]
                hints:
                  - "Such die Namen für Menschen, Tiere, Pflanzen und Dinge."
                  - "Ein Ding und ein Tier. Der ist groß, weil der Satz damit anfängt."
                  - "Ball und Katze."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie schreibt man das Nomen?"
                say: "Wie schreibt man das Nomen Sonne?"
                show: { object: sun }
                options: ["Sonne", "sonne"]
                option_audio: false
                answer: "Sonne"
                feedback:
                  sonne: "Sonne ist ein Nomen. Nomen fangen immer mit einem großen Buchstaben an."
                hints:
                  - "Sonne ist ein Ding am Himmel. Also ist es ein Nomen."
                  - "Nomen schreibt man groß."
                  - "Sonne, mit großem S."
              - id: l2-f3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: word-card, text: "maus" }
                answer: false
                hints:
                  - "Ist Maus ein Nomen?"
                  - "Maus ist ein Tier. Wie fängt ein Nomen an?"
                  - "Nein. Maus schreibt man mit großem M."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Mama kauft Brot und Käse. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Mama kauft Brot und Käse." }
                spans: ["Mama", "Brot", "Käse."]
                hints:
                  - "Ein Mensch und zwei Dinge."
                  - "Die Wörter kauft und und sind keine Nomen."
                  - "Mama, Brot und Käse."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Wort schreibt man groß?"
                say: "Welches Wort schreibt man groß?"
                options: ["lampe", "lesen", "leise"]
                option_audio: false
                answer: "lampe"
                hints:
                  - "Such das Nomen."
                  - "Was davon kannst du anfassen?"
                  - "Lampe ist ein Ding. Man schreibt es groß."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Die Ente frisst Brot. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Die Ente frisst Brot." }
                spans: ["Ente", "Brot."]
                hints: ["Ein Tier und ein Ding. Die ist kein Nomen."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie schreibt man das Nomen?"
                say: "Wie schreibt man das Nomen Hase?"
                show: { object: rabbit }
                options: ["hase", "Hase"]
                option_audio: false
                answer: "Hase"
                hints: ["Hase ist ein Tier."]
              - id: l2-s3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: word-card, text: "Tisch" }
                answer: true
                hints: ["Tisch ist ein Ding. Fängt es groß an?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welches Wort schreibt man groß?"
                say: "Welches Wort schreibt man groß?"
                options: ["rot", "baum", "rennen"]
                option_audio: false
                answer: "baum"
                hints: ["Welches ist eine Pflanze?"]
              - id: l2-s5
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Opa liest ein Buch. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Opa liest ein Buch." }
                spans: ["Opa", "Buch."]
                hints: ["Ein Mensch und ein Ding."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Das Kind malt eine Blume. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Das Kind malt eine Blume." }
                spans: ["Kind", "Blume."]
              - id: l2-n2
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: word-card, text: "schuh" }
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Wie schreibt man das Nomen?"
                say: "Wie schreibt man das Nomen Igel?"
                show: { object: hedgehog }
                options: ["Igel", "igel"]
                option_audio: false
                answer: "Igel"
              - id: l2-n4
                type: multiple_choice
                text: "Welches Wort schreibt man groß?"
                say: "Welches Wort schreibt man groß?"
                options: ["singen", "müde", "kuh"]
                option_audio: false
                answer: "kuh"
              - id: l2-n5
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Papa und Lea backen einen Kuchen. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Papa und Lea backen einen Kuchen." }
                spans: ["Papa", "Lea", "Kuchen."]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tippe auf jedes Nomen."
            say: "Die Katze trinkt Milch. Tippe auf jedes Nomen."
            show: { drawn: letter-card, text: "Die Katze trinkt Milch." }
            spans: ["Katze", "Milch."]
          - id: l2-c2
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Welches Wort ist ein Nomen? Hör gut zu."
            options: ["tanzen", "Löffel", "lustig"]
            answer: "Löffel"
          - id: l2-c3
            type: sorting
            text: "Mensch, Tier, Pflanze oder Ding?"
            say: "Mensch, Tier, Pflanze oder Ding? Sortiere die Bilder."
            bins:
              - { id: mensch, show: { text: "Mensch" }, say: "Mensch" }
              - { id: tier, show: { text: "Tier" }, say: "Tier" }
              - { id: pflanze, show: { text: "Pflanze" }, say: "Pflanze" }
              - { id: ding, show: { text: "Ding" }, say: "Ding" }
            options:
              - { object: farmer, bin: mensch }
              - { object: goat, bin: tier }
              - { object: rose, bin: pflanze }
              - { object: lamp, bin: ding }
          - id: l2-c4
            type: true_false
            text: "Ist das richtig geschrieben?"
            say: "Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: word-card, text: "nase" }
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Welches Wort schreibt man groß?"
            say: "Welches Wort schreibt man groß? Lies genau."
            options: ["apfel", "essen", "süß"]
            option_audio: false
            answer: "apfel"
