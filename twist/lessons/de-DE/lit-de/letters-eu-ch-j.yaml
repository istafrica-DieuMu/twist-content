# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-eu-ch-j
skill: lit-de.letters.eu-ch-j
curriculum: de-DE
language: de
title:
  de: Eu, Ch und J
  en: Eu, Ch and J
summary: >
  The seventh letter group in Fibel order. Lesson 1 brings eu, written e
  and u but spoken oi (Eule, Feuer), set against ei and au. Lesson 2
  brings ch and its two sounds: light as in ich and Milch, rough as in
  Dach and Buch; the child sorts words by the two sounds and keeps ch
  apart from sch. Lesson 3 brings J (Jacke, Junge), set against the long
  I. Lesson 4 reads words with all three and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises:
    [lit-de.letters.g-au-sch-z, lit-de.handwriting.print-letters, lit-de.decoding.longer-words]
  vocabulary:
    { de: [Buchstabe, Laut, Anlaut, Silbe, Zwielaut, Großbuchstabe, Kleinbuchstabe] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, syllable-arcs, word-card]
  sounds: []
  facets: [script]
  misconceptions:
    - id: eu-spelling
      what: Writes oi or ei for the sound in Eule, or mixes eu up with ei and au
      addressed: lesson 1 Learn sets eu, ei and au side by side; l1-f1, l1-f3, l1-f4, l1-s3, l1-n1 and l1-n2 ask which of the three it is
    - id: ch-two-sounds
      what: Expects ch to sound the same in ich and in Dach
      addressed: lesson 2 Learn plays both; l2-f3, l2-s1, l2-s3, l2-n1, l2-n3 and l4-c2 sort words by the two sounds
    - id: ch-sch
      what: Confuses ch with sch (Fisch, Milch)
      addressed: l2-f1, l2-f4, l2-s2 and l2-c3 contrast them
    - id: j-i
      what: Hears the j at the start of a word as i
      addressed: l3-f1, l3-f3 and l3-n2 contrast J and I
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das Eu, en: The sound eu }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Sch oder S?"
            audio: { de: "Schiff." }
            options: ["Sch", "S"]
            answer: "Sch"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Zebra" }
            options: [{ object: giraffe }, { object: zebra }, { object: goat }]
            answer: zebra
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Eu eu"
            say: "Hier stehen e und u zusammen: eu. Sie klingen aber anders, als du denkst: oi. Wie bei Eule und Feuer."
            show: { drawn: letter-card, text: "Eu eu" }
          - text: "Feuerwehrmann"
            say: "Feuerwehrmann. F ... eu ... er. Hörst du das eu? Es klingt wie oi."
            show: { object: firefighter }
          - text: "ei au eu"
            say: "Pass gut auf: ei wie bei Eis, au wie bei Auto, und eu wie bei Eule. Das sind drei verschiedene Laute."
            show: { drawn: letter-card, text: "ei au eu" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Wie fängt das Wort an?"
                audio: { de: "Eule." }
                options: ["Eu", "Ei", "Au"]
                answer: "Eu"
                feedback:
                  Ei: "Ei klingt wie bei Eis. Eule fängt mit oi an. Das schreibt man eu."
                  Au: "Au klingt wie bei Auto. Eule fängt mit oi an."
                hints:
                  - "Hör noch einmal hin."
                  - "Sprich es nach: Eu ... le. Klingt es wie oi?"
                  - "Oi schreibt man eu."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Hörst du ein eu?"
                say: "Feuerwehrmann. Hörst du in dem Wort ein eu?"
                show: { object: firefighter }
                answer: true
                hints:
                  - "Sag das Wort langsam: Feu ... er ... wehr ... mann."
                  - "Feu: Klingt das wie oi?"
                  - "Ja, in Feuerwehrmann hörst du ein eu."
              - id: l1-f3
                type: true_false
                text: "Hörst du ein eu?"
                say: "Eis. Hörst du in dem Wort ein eu?"
                show: { object: ice-cream }
                answer: false
                hints:
                  - "Sag das Wort langsam: Eis."
                  - "Klingt der erste Laut wie oi, oder wie ei?"
                  - "Nein, Eis fängt mit ei an."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes eu."
                say: "Tippe auf jede Karte mit eu: erst e, dann u. Auch das große Eu zählt."
                show: { drawn: letter-card, text: "eu ei Eu au eu" }
                spans: ["eu", "Eu", "eu"]
                hints:
                  - "Bei eu steht das e vorne und das u dahinter."
                  - "Bei ei steht hinten ein i. Bei au steht vorne ein a."
                  - "Es sind drei Karten: eu, Eu und eu."
              - id: l1-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Feuer. Was fehlt in dem Wort?"
                frame: "F_er"
                options: ["ei", "eu", "au"]
                answer: ["eu"]
                hints:
                  - "Sprich das Wort langsam: F ... eu ... er."
                  - "Klingt es wie oi? Mit ei wäre es eine Feier."
                  - "Feuer schreibt man mit eu."
              - id: l1-f6
                type: tracing
                text: "Schreib Eu nach."
                show: { drawn: writing-lines, text: "Eu", mode: trace, arrows: true }
                char: "Eu"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Welches Wort hörst du?"
                say: "Hör gut zu. Welches Wort hörst du? Lies die Karten."
                audio: { de: "Heu." }
                options: ["Hut", "Heu", "Hase"]
                answer: "Heu"
                hints: ["Klingt es am Ende wie oi?"]
              - id: l1-s2
                type: true_false
                text: "Hörst du ein eu?"
                say: "Haus. Hörst du in dem Wort ein eu?"
                show: { object: house }
                answer: false
                hints: ["Klingt es wie bei Auto, oder wie oi?"]
              - id: l1-s3
                type: audio_choice
                text: "Eu, Ei oder Au?"
                audio: { de: "Euro." }
                options: ["Ei", "Eu", "Au"]
                answer: "Eu"
                hints: ["Eu ... ro. Klingt es wie oi?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tippe auf jedes eu."
                say: "Tippe auf jede Karte mit eu."
                show: { drawn: letter-card, text: "au eu ei eu" }
                spans: ["eu", "eu"]
                hints: ["Es sind zwei. Das e steht vorne, das u dahinter."]
              - id: l1-s5
                type: tracing
                text: "Schreib eu nach."
                show: { drawn: writing-lines, text: "eu", mode: trace, arrows: true }
                char: "eu"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Eu, Ei oder Au?"
                audio: { de: "Eimer." }
                options: ["Eu", "Au", "Ei"]
                answer: "Ei"
              - id: l1-n2
                type: audio_choice
                text: "Eu, Ei oder Au?"
                audio: { de: "Euter." }
                options: ["Au", "Eu", "Ei"]
                answer: "Eu"
              - id: l1-n3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Leute. Was fehlt in dem Wort?"
                frame: "L_te"
                options: ["au", "ei", "eu"]
                answer: ["eu"]
                difficulty: stretch
              - id: l1-n4
                type: true_false
                text: "Hörst du ein eu?"
                say: "Bauer. Hörst du in dem Wort ein eu?"
                show: { object: farmer }
                answer: false
              - id: l1-n5
                type: tracing
                text: "Schreib eu ab."
                show: { drawn: writing-lines, text: "eu", mode: copy, arrows: false }
                char: "eu"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Eu, Ei oder Au?"
            audio: { de: "Beule." }
            options: ["Ei", "Au", "Eu"]
            answer: "Eu"
          - id: l1-c2
            type: true_false
            text: "Hörst du ein eu?"
            say: "Ei. Hörst du in dem Wort ein eu?"
            show: { object: egg }
            answer: false
          - id: l1-c3
            type: highlight_in_text
            text: "Tippe auf jedes eu."
            say: "Tippe auf jede Karte mit eu."
            show: { drawn: letter-card, text: "ei eu au" }
            spans: ["eu"]

  - n: 2
    title: { de: Das Ch, en: The sound ch }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Eu, Ei oder Au?"
            audio: { de: "Feuer." }
            options: ["Eu", "Ei", "Au"]
            answer: "Eu"
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tippe auf jedes eu."
            say: "Tippe auf jede Karte mit eu."
            show: { drawn: letter-card, text: "eu ei eu" }
            spans: ["eu", "eu"]
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "ch"
            say: "Hier stehen c und h zusammen: ch. Das ch klingt auf zwei Arten. Hell und weich, wie bei ich."
            show: { drawn: letter-card, text: "ch" }
          - text: "Milch"
            say: "Milch. Mil ... ch. Hörst du das helle ch am Ende? Es klingt wie bei ich."
            show: { object: milk }
          - text: "Buch"
            say: "Buch. Bu ... ch. Hier kratzt das ch hinten im Hals, wie bei Dach. Nach a, o, u und au klingt das ch so."
            show: { object: book }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Wo hörst du ein ch?"
                say: "In welchem Wort hörst du ein ch?"
                options: [{ object: book }, { object: fish }, { object: shoe }]
                answer: book
                feedback:
                  fish: "Bei Fisch rauscht am Ende ein sch. Bei Buch kratzt ein ch."
                  shoe: "Schuh fängt mit sch an. Das rauscht."
                hints:
                  - "Sprich jedes Wort langsam. Rauscht es, oder kratzt es?"
                  - "Buch ... ch. Fisch ... sch. Schuh ... sch."
                  - "In Buch hörst du ein ch."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Hörst du ein ch?"
                say: "Kuchen. Hörst du in dem Wort ein ch?"
                show: { object: cake }
                answer: true
                hints:
                  - "Sag das Wort langsam: Ku ... chen."
                  - "Kratzt es in der Mitte hinten im Hals?"
                  - "Ja, in Kuchen hörst du ein ch."
              - id: l2-f3
                type: sorting
                text: "Wie klingt das ch?"
                say: "Klingt das ch hell wie bei ich, oder kratzig wie bei Dach? Tippe auf ein Bild und dann auf das Wort."
                bins:
                  - { id: ich, show: { text: "ich" }, say: "ich" }
                  - { id: dach, show: { text: "Dach" }, say: "Dach" }
                options:
                  - { object: milk, bin: ich }
                  - { object: book, bin: dach }
                  - { object: girl, bin: ich }
                  - { object: cook, bin: dach }
                hints:
                  - "Tippe auf jedes Bild und hör auf das ch."
                  - "Hell wie bei ich? Oder kratzig hinten im Hals wie bei Dach?"
                  - "Milch und Mädchen: wie bei ich. Buch und Koch: wie bei Dach."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes ch."
                say: "Tippe auf jede Karte mit c und h. Pass auf: sch zählt nicht."
                show: { drawn: letter-card, text: "ch sch ch c ch" }
                spans: ["ch", "ch", "ch"]
                hints:
                  - "Bei ch stehen nur c und h."
                  - "Bei sch steht noch ein s davor. Das ist ein anderer Laut."
                  - "Es sind drei Karten mit ch."
              - id: l2-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Koch. Was fehlt am Ende?"
                show: { object: cook }
                frame: "Ko_"
                options: ["sch", "ch", "k"]
                answer: ["ch"]
                hints:
                  - "Sprich das Wort langsam bis zum Ende: Koch."
                  - "Kratzt es am Ende, oder rauscht es wie sch?"
                  - "Am Ende fehlt ch."
              - id: l2-f6
                type: tracing
                text: "Schreib ch nach."
                show: { drawn: writing-lines, text: "ch", mode: trace, arrows: true }
                char: "ch"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Wo klingt das ch hell?"
                say: "In welchem Wort klingt das ch hell, wie bei ich?"
                options: [{ object: book }, { object: milk }, { object: cake }]
                answer: milk
                hints: ["Milch, Buch, Kuchen: Wo kratzt es nicht?"]
              - id: l2-s2
                type: true_false
                text: "Hörst du ein ch?"
                say: "Tisch. Hörst du in dem Wort ein ch?"
                show: { object: table }
                answer: false
                hints: ["Rauscht es am Ende wie sch, oder kratzt es wie ch?"]
              - id: l2-s3
                type: audio_choice
                text: "Wie klingt das ch?"
                audio: { de: "Bauch." }
                options: ["wie bei ich", "wie bei Dach"]
                answer: "wie bei Dach"
                keep_order: true
                hints: ["Kratzt es hinten im Hals?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Drachen. Was fehlt in dem Wort?"
                show: { object: kite }
                frame: "Dra_en"
                options: ["sch", "ch"]
                answer: ["ch"]
                hints: ["Dra ... chen. Kratzt es, oder rauscht es?"]
              - id: l2-s5
                type: tracing
                text: "Schreib ch nach."
                show: { drawn: writing-lines, text: "ch", mode: trace, arrows: false }
                char: "ch"

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Wie klingt das ch?"
                say: "Klingt das ch hell wie bei ich, oder kratzig wie bei Dach? Tippe auf ein Bild und dann auf das Wort."
                bins:
                  - { id: ich, show: { text: "ich" }, say: "ich" }
                  - { id: dach, show: { text: "Dach" }, say: "Dach" }
                options:
                  - { object: pencil-case, bin: ich }
                  - { object: kite, bin: dach }
                  - { object: happy, bin: ich }
                  - { object: cake, bin: dach }
              - id: l2-n2
                type: true_false
                text: "Hörst du ein ch?"
                say: "Mädchen. Hörst du in dem Wort ein ch?"
                show: { object: girl }
                answer: true
                difficulty: easy
              - id: l2-n3
                type: audio_choice
                text: "Wie klingt das ch?"
                audio: { de: "Licht." }
                options: ["wie bei ich", "wie bei Dach"]
                answer: "wie bei ich"
                keep_order: true
              - id: l2-n4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Milch. Was fehlt am Ende?"
                show: { object: milk }
                frame: "Mil_"
                options: ["ch", "sch", "k"]
                answer: ["ch"]
              - id: l2-n5
                type: tracing
                text: "Schreib ch ab."
                show: { drawn: writing-lines, text: "ch", mode: copy, arrows: false }
                char: "ch"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Wo hörst du ein ch?"
            say: "In welchem Wort hörst du ein ch?"
            options: [{ object: sun }, { object: kite }, { object: sock }]
            answer: kite
          - id: l2-c2
            type: audio_choice
            text: "Wie klingt das ch?"
            audio: { de: "Kuchen." }
            options: ["wie bei ich", "wie bei Dach"]
            answer: "wie bei Dach"
            keep_order: true
          - id: l2-c3
            type: true_false
            text: "Hörst du ein ch?"
            say: "Fisch. Hörst du in dem Wort ein ch?"
            show: { object: fish }
            answer: false

  - n: 3
    title: { de: Das J, en: The letter J }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: audio_choice
            text: "Wie klingt das ch?"
            audio: { de: "Nacht." }
            options: ["wie bei ich", "wie bei Dach"]
            answer: "wie bei Dach"
            keep_order: true
            difficulty: easy
          - id: l3-w2
            type: image_multiple_choice
            text: "Wo hörst du ein ch?"
            say: "In welchem Wort hörst du ein ch?"
            options: [{ object: ball }, { object: book }]
            answer: book
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "J j"
            say: "Dieser Buchstabe klingt so: j. Wie bei Jacke und Junge. Die Zunge drückt sich dabei oben an den Gaumen."
            show: { drawn: letter-card, text: "Jj" }
          - text: "Jacke"
            say: "Jacke. J ... acke. Hörst du das j am Anfang?"
            show: { object: jacket }
          - text: "Jo-Jo"
            say: "Jo-Jo. Hier hörst du das j zweimal: Jo ... Jo."
            show: { object: yo-yo }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: image_multiple_choice
                text: "Was fängt mit J an?"
                options: [{ object: jacket }, { object: hedgehog }, { object: giraffe }]
                answer: jacket
                feedback:
                  hedgehog: "Igel fängt mit iii an. Das j klingt ähnlich, gleitet aber gleich weiter: Ja."
                  giraffe: "Giraffe fängt mit g an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Jacke ... j. Igel ... iii. Giraffe ... g."
                  - "Jacke fängt mit J an."
                difficulty: easy
              - id: l3-f2
                type: true_false
                text: "Hörst du am Anfang ein J?"
                say: "Junge. Hörst du am Anfang ein j?"
                show: { object: boy }
                answer: true
                hints:
                  - "Sag das Wort mit: Junge."
                  - "J ... unge. Drückt die Zunge oben an den Gaumen?"
                  - "Ja, Junge fängt mit j an."
                difficulty: easy
              - id: l3-f3
                type: true_false
                text: "Hörst du am Anfang ein J?"
                say: "Igel. Hörst du am Anfang ein j?"
                show: { object: hedgehog }
                answer: false
                hints:
                  - "Sag das Wort mit: Igel."
                  - "Iii kannst du lange halten. Das j gleitet gleich weiter: Ja, Jo, Ju."
                  - "Nein, Igel fängt mit I an."
              - id: l3-f4
                type: highlight_in_text
                text: "Tippe auf jedes J."
                say: "Tippe auf jedes große und kleine J."
                show: { drawn: letter-card, text: "J i j g J" }
                spans: ["J", "j", "J"]
                hints:
                  - "Das große J hat unten einen Haken nach links."
                  - "Das kleine j hat einen Punkt wie das i und unten einen Haken."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l3-f5
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Jahr." }
                options: ["I", "J", "G"]
                answer: "J"
                hints:
                  - "Hör noch einmal hin."
                  - "Ja ... hr. Gleitet der erste Laut gleich zum a?"
                  - "Das ist das J."
              - id: l3-f6
                type: tracing
                text: "Schreib das J nach."
                show: { drawn: writing-lines, text: "J", mode: trace, arrows: true }
                char: "J"
                difficulty: easy

          - support: some
            tasks:
              - id: l3-s1
                type: image_multiple_choice
                text: "Was fängt mit J an?"
                options: [{ object: ice-cream }, { object: yo-yo }, { object: giraffe }]
                answer: yo-yo
                hints: ["Jo-Jo ... j."]
              - id: l3-s2
                type: true_false
                text: "Hörst du am Anfang ein J?"
                say: "Giraffe. Hörst du am Anfang ein j?"
                show: { object: giraffe }
                answer: false
                hints: ["Kommt der erste Laut weich von hinten wie bei Gabel?"]
              - id: l3-s3
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Joghurt." }
                options: ["G", "Sch", "J"]
                answer: "J"
                hints: ["Jo ... ghurt. Drückt die Zunge oben an den Gaumen?"]
              - id: l3-s4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Jacke. Welcher Buchstabe fehlt?"
                show: { object: jacket }
                frame: "_acke"
                options: ["I", "J", "G"]
                answer: ["J"]
                hints: ["J ... acke."]
              - id: l3-s5
                type: tracing
                text: "Schreib das j nach."
                show: { drawn: writing-lines, text: "j", mode: trace, arrows: true }
                char: "j"
                difficulty: easy

          - support: none
            tasks:
              - id: l3-n1
                type: image_multiple_choice
                text: "Was fängt mit J an?"
                options: [{ object: eye }, { object: egg }, { object: boy }]
                answer: boy
              - id: l3-n2
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Insel." }
                options: ["J", "I"]
                answer: "I"
              - id: l3-n3
                type: true_false
                text: "Hörst du am Anfang ein J?"
                say: "Jacke. Hörst du am Anfang ein j?"
                show: { object: jacket }
                answer: true
                difficulty: easy
              - id: l3-n4
                type: highlight_in_text
                text: "Tippe auf jedes J."
                say: "Tippe auf jedes große und kleine J."
                show: { drawn: letter-card, text: "j i J g j" }
                spans: ["j", "J", "j"]
                difficulty: stretch
              - id: l3-n5
                type: tracing
                text: "Schreib das J ab."
                show: { drawn: writing-lines, text: "J", mode: copy, arrows: false }
                char: "J"

      - activity: check
        size: quick
        tasks:
          - id: l3-c1
            type: image_multiple_choice
            text: "Was fängt mit J an?"
            options: [{ object: cake }, { object: jacket }, { object: ice-cream }]
            answer: jacket
          - id: l3-c2
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Juli." }
            options: ["U", "I", "J"]
            answer: "J"
