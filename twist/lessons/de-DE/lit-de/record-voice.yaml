# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.record-voice
skill: lit-de.speaking.record-voice
curriculum: de-DE
language: de
title:
  de: Sich aufnehmen und besser sprechen
  en: Recording yourself and speaking better
summary: >
  Listening to your own voice and making it clearer. Lesson 1 learns three
  things to listen for (laut genug, deutlich, ein gutes Tempo with pauses
  at the full stop) and works out what a speaker should practise from what
  a recording sounds like; lesson 2 follows the steps aufnehmen, anhören,
  prüfen, verbessern, nochmal aufnehmen, chooses the next thing to work
  on, and ends with the skill check. Every lesson records the child's
  voice in speak tasks, which run as the record-and-compare fallback and
  are never scored; the check asks only what the child knows about it.
metadata:
  year: klasse-3
  topic: { de: Vor anderen sprechen, en: Speaking to an audience }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.speaking.tell]
  also_practises: [lit-de.fluency.read-aloud, lit-de.speaking.rhymes-tongue-twisters]
  vocabulary: { de: [Aufnahme, aufnehmen, anhören, Lautstärke, deutlich, Tempo, Pause, Endung, verbessern] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: fast-sounds-good
      what: Thinks fast speaking sounds clever, so leaves out pauses and runs words together
      addressed: "lesson 1 Learn shows pauses at the full stop; l1-f3, l1-s3, l1-n3 and l2-c3 tap the place for a pause, and l1-f4 and l2-s4 ask about the fastest speaker, with feedback on l1-f4"
    - id: louder-fixes-all
      what: Thinks speaking louder fixes every problem with a recording
      addressed: "l1-f1, l1-s1, l1-n1, l2-f2 and l2-c2 match a problem to its own fix (deutlicher, langsamer, lauter), with feedback on l1-f1 for lauter"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Laut, deutlich, nicht zu schnell", en: "Loud, clear, not too fast" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "In welcher Reihenfolge erzählst du?"
            say: "Du erzählst von deinem Ausflug. Leg die Sätze in die richtige Reihenfolge."
            options: ["Dann haben wir am Strand gepicknickt.", "Am Morgen sind wir mit dem Zug ans Meer gefahren.", "Am Abend waren wir müde, aber glücklich."]
            slot_count: 3
            answer: ["Am Morgen sind wir mit dem Zug ans Meer gefahren.", "Dann haben wir am Strand gepicknickt.", "Am Abend waren wir müde, aber glücklich."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Du erzählst der Klasse etwas. Wie sprichst du?"
            say: "Du erzählst der Klasse etwas. Wie sprichst du?"
            options: ["so, dass alle mich verstehen", "ganz leise, nur für mich", "so schnell ich kann"]
            answer: "so, dass alle mich verstehen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "laut genug | deutlich | gutes Tempo"
            say: "Wenn du vor anderen sprichst, achte auf drei Dinge. Sprich laut genug, damit dich auch die letzte Reihe hört. Sprich deutlich, auch die Endungen. Und sprich nicht zu schnell."
          - text: "Wir gehen heute in den Wald."
            say: "Deutlich heißt: Du öffnest den Mund gut und sprichst jedes Wort zu Ende. Nicht: Wir gehn heut in Wald. Sondern: Wir gehen heute in den Wald."
          - text: "Der Igel schläft im Winter. | Im Frühling wacht er auf."
            say: "Am Punkt machst du eine kleine Pause. Atme kurz ein. Dann können die Zuhörer mitdenken. Der Igel schläft im Winter. Im Frühling wacht er auf."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Nora hört ihre Aufnahme. Die Wörter klingen verschluckt, die Endungen fehlen.\n\nWas soll Nora üben?"
                say: "Lies, was Nora hört. Was soll sie üben?"
                options: ["deutlicher sprechen", "lauter sprechen", "schneller sprechen"]
                answer: "deutlicher sprechen"
                feedback:
                  "lauter sprechen": "Laut ist Nora schon. Die Wörter selbst sind nicht klar."
                hints:
                  - "Was ist das Problem: die Lautstärke, die Wörter oder das Tempo?"
                  - "Fehlende Endungen haben mit den Wörtern zu tun."
                  - "Nora soll deutlicher sprechen."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Hilft das beim Sprechen?"
                say: "Sortiere: Hilft das, damit dich alle verstehen, oder nicht?"
                bins:
                  - { id: helps, show: { text: "hilft" }, say: "hilft" }
                  - { id: hinders, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "den Mund gut öffnen", bin: helps }
                  - { text: "in die Hand murmeln", bin: hinders }
                  - { text: "am Punkt Luft holen", bin: helps }
                  - { text: "alles in einem Atemzug sagen", bin: hinders }
                option_audio: false
                hints:
                  - "Stell dir vor, du sitzt ganz hinten in der Klasse."
                  - "Murmeln ist leise. In einem Atemzug ist zu schnell."
                  - "Mund öffnen und Luft holen helfen."
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf das Wort, nach dem du eine Pause machst."
                say: "Lies die Sätze. Nach welchem Wort machst du eine Pause? Tippe es an."
                show: { drawn: letter-card, text: "Die Katze springt aufs Dach. Dort sonnt sie sich." }
                spans: ["Dach."]
                hints:
                  - "Wo endet der erste Satz?"
                  - "Am Punkt machst du eine Pause."
                  - "Nach Dach."
              - id: l1-f4
                type: multiple_choice
                text: "Drei Kinder lesen den gleichen Text vor. Wer macht es am besten?"
                say: "Drei Kinder lesen den gleichen Text vor. Wer macht es am besten?"
                options: ["Paul liest ruhig und macht am Punkt eine Pause.", "Lisa liest ganz schnell und ist als Erste fertig.", "Tarek liest leise in sein Buch hinein."]
                answer: "Paul liest ruhig und macht am Punkt eine Pause."
                feedback:
                  "Lisa liest ganz schnell und ist als Erste fertig.": "Schnell ist nicht besser. Die Zuhörer kommen nicht mit."
                hints:
                  - "Wer wird am besten verstanden?"
                  - "Wer zu schnell oder zu leise liest, ist schwer zu verstehen."
                  - "Paul liest ruhig und macht Pausen."
              - id: l1-f5
                type: speak
                text: "Fünf freche Frösche fangen flinke Fliegen."
                say: "Sprich den Zungenbrecher langsam und deutlich. Dann hörst du deine Aufnahme und das Vorbild. Klingt jedes f klar?"
                expected_text: "Fünf freche Frösche fangen flinke Fliegen."
                hints:
                  - "Fang langsam an. Schnell wird es später."
                  - "Sprich jedes f und jedes fl deutlich."
                  - "Hör das Vorbild an und nimm dich noch einmal auf."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Jan hört seine Aufnahme. Er spricht so leise, dass man ihn kaum hört.\n\nWas soll Jan üben?"
                say: "Lies, was Jan hört. Was soll er üben?"
                options: ["lauter sprechen", "schneller sprechen", "weniger Pausen machen"]
                answer: "lauter sprechen"
                hints: ["Was ist das Problem: die Lautstärke, die Wörter oder das Tempo?"]
              - id: l1-s2
                type: sorting
                text: "Hilft das beim Sprechen?"
                say: "Sortiere: Hilft das, damit dich alle verstehen, oder nicht?"
                bins:
                  - { id: helps, show: { text: "hilft" }, say: "hilft" }
                  - { id: hinders, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "die Zuhörer anschauen", bin: helps }
                  - { text: "Kaugummi kauen", bin: hinders }
                  - { text: "gerade stehen", bin: helps }
                  - { text: "zum Boden sprechen", bin: hinders }
                option_audio: false
                hints: ["Wohin geht deine Stimme, wenn du zum Boden sprichst?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf das Wort, nach dem du eine Pause machst."
                say: "Lies die Sätze. Nach welchem Wort machst du eine Pause? Tippe es an."
                show: { drawn: letter-card, text: "Morgen ist Sportfest. Wir laufen um die Wette." }
                spans: ["Sportfest."]
                hints: ["Wo steht der erste Punkt?"]
              - id: l1-s4
                type: true_false
                text: "Je schneller du sprichst, desto besser verstehen dich die anderen. Stimmt das?"
                say: "Je schneller du sprichst, desto besser verstehen dich die anderen. Stimmt das?"
                answer: false
                hints: ["Können die Zuhörer mitdenken, wenn du rast?"]
              - id: l1-s5
                type: speak
                text: "Zwei zottelige Zwerge ziehen zwanzig Zwiebeln."
                say: "Sprich den Satz langsam und deutlich. Dann hörst du deine Aufnahme und das Vorbild. Klingt jedes z klar?"
                expected_text: "Zwei zottelige Zwerge ziehen zwanzig Zwiebeln."
                hints: ["Sprich langsam und jedes Wort bis zum Ende."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ayla hört ihre Aufnahme. Sie spricht so schnell, dass alle Sätze ineinanderlaufen.\n\nWas soll Ayla üben?"
                say: "Lies, was Ayla hört. Was soll sie üben?"
                options: ["langsamer sprechen und Pausen machen", "lauter sprechen", "leiser sprechen"]
                answer: "langsamer sprechen und Pausen machen"
              - id: l1-n2
                type: sorting
                text: "Hilft das beim Sprechen?"
                say: "Sortiere: Hilft das, damit dich alle verstehen, oder nicht?"
                bins:
                  - { id: helps, show: { text: "hilft" }, say: "hilft" }
                  - { id: hinders, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "vorher tief einatmen", bin: helps }
                  - { text: "das Blatt vors Gesicht halten", bin: hinders }
                  - { text: "wichtige Wörter betonen", bin: helps }
                  - { text: "Endungen weglassen", bin: hinders }
                option_audio: false
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf das Wort, nach dem du eine Pause machst."
                say: "Lies die Sätze. Nach welchem Wort machst du eine Pause? Tippe es an."
                show: { drawn: letter-card, text: "Unser Hund heißt Bello. Er frisst gern Karotten." }
                spans: ["Bello."]
              - id: l1-n4
                type: multiple_choice
                text: "Welcher Satz ist deutlich gesprochen?"
                say: "Lies die Sätze. Welcher ist deutlich gesprochen?"
                options: ["Ich habe heute keine Zeit.", "Ich hab heut keine Zeit.", "Hab heut kein Zeit."]
                answer: "Ich habe heute keine Zeit."
                option_audio: false
              - id: l1-n5
                type: speak
                text: "Kleine Kinder kaufen knackige Kekse beim Bäcker."
                say: "Sprich den Satz deutlich, erst langsam, dann etwas schneller. Dann hörst du deine Aufnahme und das Vorbild."
                expected_text: "Kleine Kinder kaufen knackige Kekse beim Bäcker."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Malte hört seine Aufnahme. Man versteht ihn gut, aber er spricht sehr leise.\n\nWas soll Malte üben?"
            say: "Lies, was Malte hört. Was soll er üben?"
            options: ["lauter sprechen", "deutlicher sprechen", "schneller sprechen"]
            answer: "lauter sprechen"
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf das Wort, nach dem du eine Pause machst."
            say: "Lies die Sätze. Nach welchem Wort machst du eine Pause? Tippe es an."
            show: { drawn: letter-card, text: "Es schneit seit Stunden. Alles ist weiß." }
            spans: ["Stunden."]
          - id: l1-c3
            type: true_false
            text: "Wer deutlich spricht, öffnet beim Sprechen den Mund gut. Stimmt das?"
            say: "Wer deutlich spricht, öffnet beim Sprechen den Mund gut. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Aufnehmen, anhören, verbessern", en: "Record, listen, improve" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Kim spricht in der Aufnahme so leise, dass man sie kaum versteht. Was soll sie üben?"
            say: "Kim spricht in der Aufnahme so leise, dass man sie kaum versteht. Was soll sie üben?"
            options: ["lauter sprechen", "schneller sprechen", "weniger atmen"]
            answer: "lauter sprechen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Am Punkt machst du eine kleine Pause. Stimmt das?"
            say: "Am Punkt machst du eine kleine Pause. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1. aufnehmen\n2. anhören\n3. prüfen: laut? deutlich? Tempo?\n4. eine Sache verbessern\n5. noch einmal aufnehmen"
            say: "Mit einer Aufnahme kannst du dich selbst hören, so wie die anderen dich hören. Geh in diesen Schritten vor."
          - text: "Aufnahme 1: zu schnell, keine Pausen\nZiel: langsamer, Pause am Punkt"
            say: "Nimm dir immer nur eine Sache vor. Wenn du zu schnell warst, übst du zuerst das Tempo. Wenn das klappt, kommt die nächste Sache dran."
          - text: "Aufnahme 2: ruhiges Tempo, Pausen am Punkt"
            say: "Vergleiche die zweite Aufnahme mit der ersten. Was ist besser geworden? So merkst du, dass Üben hilft."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Leg die Schritte in die richtige Reihenfolge."
                say: "Du willst deinen Vortrag verbessern. Leg die Schritte in die richtige Reihenfolge."
                options: ["anhören", "noch einmal aufnehmen", "aufnehmen", "eine Sache verbessern"]
                slot_count: 4
                answer: ["aufnehmen", "anhören", "eine Sache verbessern", "noch einmal aufnehmen"]
                option_audio: false
                hints:
                  - "Was brauchst du zuerst, damit du etwas anhören kannst?"
                  - "Erst aufnehmen, dann anhören. Und am Ende?"
                  - "aufnehmen, anhören, verbessern, noch einmal aufnehmen."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was hilft? Verbinde."
                say: "Lies, was in der Aufnahme nicht gut ist. Was hilft dagegen? Verbinde."
                pairs:
                  - { left: { text: "Man hört dich kaum." }, right: { text: "lauter sprechen" } }
                  - { left: { text: "Die Wörter klingen verschluckt." }, right: { text: "deutlicher sprechen" } }
                  - { left: { text: "Die Sätze laufen ineinander." }, right: { text: "Pausen machen" } }
                option_audio: false
                hints:
                  - "Lies jedes Problem und überlege, was genau fehlt."
                  - "Kaum hören hat mit der Lautstärke zu tun."
                  - "Kaum hören: lauter. Verschluckt: deutlicher. Ineinander: Pausen."
              - id: l2-f3
                type: multiple_choice
                text: "Mehmet war zu schnell und hat leise gesprochen. Was nimmt er sich zuerst vor?"
                say: "Mehmet war zu schnell und hat leise gesprochen. Was nimmt er sich zuerst vor?"
                options: ["eine Sache, zum Beispiel langsamer sprechen", "alles auf einmal", "gar nichts, er nimmt einfach noch einmal auf"]
                answer: "eine Sache, zum Beispiel langsamer sprechen"
                hints:
                  - "Kannst du beim Sprechen auf zwei Dinge gleichzeitig achten?"
                  - "Nimm dir immer nur eine Sache vor."
                  - "Eine Sache, zum Beispiel langsamer sprechen."
              - id: l2-f4
                type: true_false
                text: "Du vergleichst die zweite Aufnahme mit der ersten. Ist das sinnvoll?"
                say: "Du vergleichst die zweite Aufnahme mit der ersten. Ist das sinnvoll?"
                answer: true
                hints:
                  - "Woher weißt du sonst, ob es besser geworden ist?"
                  - "Beim Vergleichen hörst du, was du verbessert hast."
                  - "Ja, das ist sinnvoll."
              - id: l2-f5
                type: speak
                text: "Im Herbst sammeln Eichhörnchen Nüsse. Sie verstecken sie im Boden."
                say: "Nimm dich auf. Sprich ruhig und mach am Punkt eine Pause. Dann hörst du deine Aufnahme und das Vorbild."
                expected_text: "Im Herbst sammeln Eichhörnchen Nüsse. Sie verstecken sie im Boden."
                hints:
                  - "Lies den Text vorher einmal leise."
                  - "Nach Nüsse kommt eine kleine Pause."
                  - "Hör das Vorbild an und nimm dich noch einmal auf."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Leg die Schritte in die richtige Reihenfolge."
                say: "Leg die Schritte in die richtige Reihenfolge."
                options: ["prüfen: laut, deutlich, Tempo", "aufnehmen", "anhören"]
                slot_count: 3
                answer: ["aufnehmen", "anhören", "prüfen: laut, deutlich, Tempo"]
                option_audio: false
                hints: ["Was kannst du erst prüfen, wenn du es gehört hast?"]
              - id: l2-s2
                type: matching
                text: "Was hilft? Verbinde."
                say: "Lies, was in der Aufnahme nicht gut ist. Was hilft dagegen? Verbinde."
                pairs:
                  - { left: { text: "Du nuschelst." }, right: { text: "den Mund mehr öffnen" } }
                  - { left: { text: "Du bist außer Atem." }, right: { text: "am Punkt einatmen" } }
                  - { left: { text: "Alles klingt gleich und langweilig." }, right: { text: "wichtige Wörter betonen" } }
                option_audio: false
                hints: ["Nuscheln heißt: undeutlich sprechen."]
              - id: l2-s3
                type: multiple_choice
                text: "Nach der zweiten Aufnahme sagt Greta: „Ich bin jetzt langsamer. Aber man hört mich immer noch schlecht.“\n\nWas übt sie als Nächstes?"
                say: "Lies, was Greta sagt. Was übt sie als Nächstes?"
                options: ["lauter sprechen", "noch langsamer sprechen", "nichts mehr"]
                answer: "lauter sprechen"
                hints: ["Das Tempo klappt schon. Was fehlt noch?"]
              - id: l2-s4
                type: true_false
                text: "Robin sagt: „Ich spreche ganz schnell, dann ist der Vortrag schneller vorbei.“ Ist das eine gute Idee?"
                say: "Lies, was Robin sagt. Ist das eine gute Idee?"
                answer: false
                hints: ["Wer soll den Vortrag verstehen?"]
              - id: l2-s5
                type: speak
                text: "Unsere Klasse fährt nächste Woche ins Museum. Dort sehen wir echte Dinosaurierknochen."
                say: "Nimm dich auf. Sprich laut genug und mach am Punkt eine Pause. Dann hörst du deine Aufnahme und das Vorbild."
                expected_text: "Unsere Klasse fährt nächste Woche ins Museum. Dort sehen wir echte Dinosaurierknochen."
                hints: ["Sprich das lange Wort am Ende Silbe für Silbe: Di, no, sau, ri, er, kno, chen."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Leg die Schritte in die richtige Reihenfolge."
                say: "Leg die Schritte in die richtige Reihenfolge."
                options: ["eine Sache verbessern", "anhören und prüfen", "noch einmal aufnehmen und vergleichen", "aufnehmen"]
                slot_count: 4
                answer: ["aufnehmen", "anhören und prüfen", "eine Sache verbessern", "noch einmal aufnehmen und vergleichen"]
                option_audio: false
              - id: l2-n2
                type: matching
                text: "Was hilft? Verbinde."
                say: "Lies, was in der Aufnahme nicht gut ist. Was hilft dagegen? Verbinde."
                pairs:
                  - { left: { text: "Man versteht die Endungen nicht." }, right: { text: "jedes Wort zu Ende sprechen" } }
                  - { left: { text: "Du rast durch den Text." }, right: { text: "langsamer sprechen" } }
                  - { left: { text: "Hinten hört dich niemand." }, right: { text: "lauter sprechen" } }
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Nach der zweiten Aufnahme sagt Elias: „Jetzt bin ich laut genug. Aber ich nuschle noch.“\n\nWas übt er als Nächstes?"
                say: "Lies, was Elias sagt. Was übt er als Nächstes?"
                options: ["deutlicher sprechen", "noch lauter sprechen", "schneller sprechen"]
                answer: "deutlicher sprechen"
              - id: l2-n4
                type: multiple_choice
                text: "Warum ist es gut, sich selbst aufzunehmen?"
                say: "Warum ist es gut, sich selbst aufzunehmen?"
                options: ["Man hört sich so, wie die anderen einen hören.", "Dann muss man nicht mehr üben.", "Dann klingt die Stimme tiefer."]
                answer: "Man hört sich so, wie die anderen einen hören."
              - id: l2-n5
                type: speak
                text: "Mein Lieblingstier ist der Pinguin. Er kann nicht fliegen, aber sehr gut schwimmen."
                say: "Nimm dich auf. Achte auf alle drei Dinge: laut, deutlich, gutes Tempo. Dann hörst du deine Aufnahme und das Vorbild."
                expected_text: "Mein Lieblingstier ist der Pinguin. Er kann nicht fliegen, aber sehr gut schwimmen."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Du hast dich aufgenommen, angehört und eine Sache verbessert. Was machst du jetzt?"
            say: "Du hast dich aufgenommen, angehört und eine Sache verbessert. Was machst du jetzt?"
            options: ["noch einmal aufnehmen und vergleichen", "gleich alles andere auch ändern", "die Aufnahme löschen, fertig"]
            answer: "noch einmal aufnehmen und vergleichen"
          - id: l2-c2
            type: multiple_choice
            text: "Sofia hört ihre Aufnahme. Sie ist laut genug und spricht ruhig. Aber statt „haben“ sagt sie „ham“ und statt „gehen“ sagt sie „gehn“.\n\nWas soll Sofia üben?"
            say: "Lies, was Sofia hört. Was soll sie üben?"
            options: ["deutlicher sprechen", "langsamer sprechen", "lauter sprechen"]
            answer: "deutlicher sprechen"
          - id: l2-c3
            type: highlight_in_text
            text: "Tippe auf das Wort, nach dem du eine Pause machst."
            say: "Lies die Sätze. Nach welchem Wort machst du eine Pause? Tippe es an."
            show: { drawn: letter-card, text: "Der Bus kommt zu spät. Wir warten im Regen." }
            spans: ["spät."]
          - id: l2-c4
            type: multiple_choice
