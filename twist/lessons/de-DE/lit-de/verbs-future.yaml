# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.verbs-future
skill: lit-de.verbs.future
curriculum: de-DE
language: de
title:
  de: Die Zukunft
  en: The future
summary: >
  The Futur says what will happen: Ich werde spielen. Lesson 1 builds it
  from a form of werden and the Grundform at the end of the sentence
  (ich werde, du wirst, er wird, wir werden); lesson 2 shows that German
  often uses the Präsens with a time word for the future (Morgen fahre ich
  zu Oma.), finds sentences about the future, and ends with the skill
  check.
metadata:
  year: klasse-4
  topic: { de: Zeitformen, en: Tenses }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.verbs.perfect]
  also_practises: [lit-de.verbs.present]
  vocabulary: { de: [Futur, Zukunft, werden, Grundform, Zeitangabe] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: partizip-with-werden
      what: Puts the Partizip after werden (Ich werde gespielt.)
      addressed: lesson 1 Learn says the Grundform goes at the end; feedback on "gespielt" options
    - id: werden-forms
      what: Uses wrong forms of werden (du werdest, er werdet)
      addressed: lesson 1 Learn lists ich werde, du wirst, er wird; matching and fill-in tasks practise them
    - id: future-only-with-werden
      what: Thinks only sentences with werden can be about the future
      addressed: lesson 2 Learn and tasks show the Präsens with morgen, nächste Woche, im Sommer as future
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Futur mit werden, en: The future with werden }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ich _ nach Hause gelaufen."
            say: "Welches Hilfsverb passt? Ich ... nach Hause gelaufen."
            options: ["habe", "bin", "hat"]
            answer: "bin"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wir haben Kuchen _."
            say: "Welches Partizip von essen passt? Wir haben Kuchen ..."
            options: ["gegessen", "gegesst", "aßen"]
            answer: "gegessen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ich werde morgen schwimmen."
            say: "Was noch kommt, kannst du im Futur sagen. Das Futur hat zwei Teile: eine Form von werden und die Grundform des Verbs."
          - text: "ich werde · du wirst · er wird · wir werden · ihr werdet · sie werden"
            say: "So ändert sich werden: ich werde, du wirst, er, sie, es wird, wir werden, ihr werdet, sie werden."
          - text: "Lisa wird im Sommer einen Drachen bauen."
            say: "Werden steht an zweiter Stelle, die Grundform ganz am Ende. Dazwischen steht der Rest des Satzes."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Ergänze die passende Form von werden."
                say: "Setz die passende Form von werden ein: Du ... die Prüfung schaffen."
                frame: "Du _ die Prüfung schaffen."
                options: ["werde", "wirst", "wird", "werdet"]
                answer: ["wirst"]
                feedback:
                  "werdet": "Werdet gehört zu ihr. Bei du heißt es wirst."
                hints:
                  - "Wer schafft die Prüfung? Du."
                  - "Ich werde, du ..."
                  - "Du wirst die Prüfung schaffen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Morgen werden wir einen Ausflug _."
                say: "Welche Form passt ans Ende? Morgen werden wir einen Ausflug ..."
                options: ["machen", "gemacht", "machten"]
                answer: "machen"
                feedback:
                  "gemacht": "Gemacht ist das Partizip und gehört zum Perfekt. Im Futur steht die Grundform: machen."
                hints:
                  - "Im Futur steht am Ende die Grundform."
                  - "Die Grundform endet auf en."
                  - "Morgen werden wir einen Ausflug machen."
              - id: l1-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Person mit der passenden Form von werden."
                option_audio: false
                pairs:
                  - { left: { text: "ich" }, right: { text: "werde" } }
                  - { left: { text: "du" }, right: { text: "wirst" } }
                  - { left: { text: "er" }, right: { text: "wird" } }
                  - { left: { text: "ihr" }, right: { text: "werdet" } }
                hints:
                  - "Bei du und er ändert sich der Selbstlaut."
                  - "Du wirst, er wird."
                  - "ich werde, du wirst, er wird, ihr werdet."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf beide Teile des Futurs."
                say: "Tippe auf die zwei Wörter, die zusammen das Futur bilden."
                show: { drawn: letter-card, text: "Nächste Woche wird Opa uns besuchen." }
                spans: ["wird", "besuchen"]
                hints:
                  - "Ein Teil ist eine Form von werden."
                  - "Der andere steht am Ende."
                  - "wird und besuchen."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? „Ich werde den Hund gefüttert.“"
                say: "Ich werde den Hund gefüttert. Ist der Satz richtig?"
                answer: false
                feedback:
                  "true": "Nach werden steht im Futur die Grundform: Ich werde den Hund füttern."
                hints:
                  - "Welche Form steht im Futur am Ende?"
                  - "Die Grundform, nicht das Partizip."
                  - "Nein. Richtig ist: Ich werde den Hund füttern."
              - id: l1-f6
                type: fill_in_blank
                text: "Ergänze die passende Form von werden."
                say: "Setz die passende Form von werden ein: Die Kinder ... ein Lied singen."
                frame: "Die Kinder _ ein Lied singen."
                options: ["werde", "wirst", "wird", "werden"]
                answer: ["werden"]
                hints:
                  - "Für die Kinder kannst du sie sagen. Es sind viele."
                  - "Wenn es viele sind, heißt es wie in der Grundform: werden."
                  - "Die Kinder werden ein Lied singen."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Ergänze die passende Form von werden."
                say: "Setz die passende Form von werden ein: Mama ... uns abholen."
                frame: "Mama _ uns abholen."
                options: ["werde", "wirst", "wird", "werden"]
                answer: ["wird"]
                hints: ["Für Mama kannst du sie sagen. Das ist eine Person."]
              - id: l1-s2
                type: multiple_choice
                text: "Ich werde dir eine Karte _."
                say: "Welche Form passt ans Ende? Ich werde dir eine Karte ..."
                options: ["schreiben", "geschrieben", "schrieb"]
                answer: "schreiben"
                hints: ["Welche Form gehört nach werden?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf beide Teile des Futurs."
                say: "Tippe auf die zwei Wörter, die zusammen das Futur bilden."
                show: { drawn: letter-card, text: "Im Herbst werden wir Äpfel pflücken." }
                spans: ["werden", "pflücken"]
                hints: ["Such werden und das Wort am Ende."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? „Ihr werdet viel Spaß haben.“"
                say: "Ihr werdet viel Spaß haben. Ist der Satz richtig?"
                answer: true
                hints: ["Prüfe die Form von werden und das Ende."]
              - id: l1-s5
                type: fill_in_blank
                text: "Ergänze die passende Form von werden."
                say: "Setz die passende Form von werden ein: Ich ... morgen früh aufstehen."
                frame: "Ich _ morgen früh aufstehen."
                options: ["werde", "wirst", "wird", "werden"]
                answer: ["werde"]
                hints: ["Welche Form gehört zu ich?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Ergänze die passende Form von werden."
                say: "Setz die passende Form von werden ein: Ihr ... den Zug verpassen."
                frame: "Ihr _ den Zug verpassen."
                options: ["werde", "wirst", "werdet", "werden"]
                answer: ["werdet"]
              - id: l1-n2
                type: multiple_choice
                text: "Tom wird nächstes Jahr in die fünfte Klasse _."
                say: "Welche Form passt ans Ende? Tom wird nächstes Jahr in die fünfte Klasse ..."
                options: ["gehen", "gegangen", "ging"]
                answer: "gehen"
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf beide Teile des Futurs."
                say: "Tippe auf die zwei Wörter, die zusammen das Futur bilden."
                show: { drawn: letter-card, text: "Du wirst bestimmt einen Preis gewinnen." }
                spans: ["wirst", "gewinnen"]
              - id: l1-n4
                type: true_false
                text: "Stimmt das? „Er werdet im Zelt schlafen.“"
                say: "Er werdet im Zelt schlafen. Ist der Satz richtig?"
                answer: false
              - id: l1-n5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden Satzanfang mit dem passenden Ende."
                option_audio: false
                pairs:
                  - { left: { text: "Wir werden" }, right: { text: "tanzen." } }
                  - { left: { text: "Wir haben" }, right: { text: "getanzt." } }
                  - { left: { text: "Wir tanzten" }, right: { text: "gestern." } }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Ergänze die passende Form von werden."
            say: "Setz die passende Form von werden ein: Du ... das Rätsel lösen."
            frame: "Du _ das Rätsel lösen."
            options: ["werde", "wirst", "wird", "werdet"]
            answer: ["wirst"]
          - id: l1-c2
            type: multiple_choice
            text: "Am Samstag werden wir Pizza _."
            say: "Welche Form passt ans Ende? Am Samstag werden wir Pizza ..."
            options: ["backen", "gebacken", "backten"]
            answer: "backen"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? „Ich werde dich anrufen.“"
            say: "Ich werde dich anrufen. Ist der Satz richtig?"
            answer: true

  - n: 2
    title: { de: Zukunft auch im Präsens, en: The future in the present tense }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Ergänze die passende Form von werden."
            say: "Setz die passende Form von werden ein: Sie ... uns helfen."
            frame: "Sie _ uns helfen."
            options: ["werde", "wirst", "wird", "werdet"]
            answer: ["wird"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ich werde ein Buch _."
            say: "Welche Form passt ans Ende? Ich werde ein Buch ..."
            options: ["lesen", "gelesen", "las"]
            answer: "lesen"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Morgen fahre ich zu Oma."
            say: "Über die Zukunft sprechen wir oft auch im Präsens. Eine Zeitangabe zeigt, dass es noch kommt: morgen, nächste Woche, im Sommer."
          - text: "Ich werde morgen zu Oma fahren. = Morgen fahre ich zu Oma."
            say: "Beide Sätze sagen dasselbe. Der Satz im Präsens klingt beim Sprechen oft natürlicher."
          - text: "Ich spiele jetzt. · Ich spiele morgen."
            say: "Ohne Zeitangabe ist das Präsens Gegenwart. Mit morgen wird daraus Zukunft. Achte also auf die Zeitangabe."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Satz erzählt von der Zukunft?"
                say: "Welcher Satz sagt, was noch kommt?"
                options: ["Nächste Woche fliegen wir nach Spanien.", "Gerade fliegen wir über Spanien.", "Wir sind nach Spanien geflogen."]
                answer: "Nächste Woche fliegen wir nach Spanien."
                option_audio: false
                feedback:
                  "Gerade fliegen wir über Spanien.": "Gerade heißt jetzt. Das ist Gegenwart."
                hints:
                  - "Such ein Wort für die Zeit, die noch kommt."
                  - "Nächste Woche ist noch nicht da."
                  - "Nächste Woche fliegen wir nach Spanien."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welcher Satz sagt dasselbe? „Ich werde morgen Tennis spielen.“"
                say: "Welcher Satz sagt dasselbe wie: Ich werde morgen Tennis spielen?"
                options: ["Morgen spiele ich Tennis.", "Ich spielte morgen Tennis.", "Ich habe morgen Tennis gespielt."]
                answer: "Morgen spiele ich Tennis."
                option_audio: false
                hints:
                  - "Die Zukunft geht auch im Präsens, mit einer Zeitangabe."
                  - "Morgen bleibt im Satz, das Verb steht im Präsens."
                  - "Morgen spiele ich Tennis."
              - id: l2-f3
                type: sorting
                text: "Jetzt oder später?"
                say: "Sortiere die Sätze. Passiert es jetzt oder später?"
                option_audio: false
                bins:
                  - { id: now, show: { text: "jetzt" }, say: "jetzt" }
                  - { id: later, show: { text: "später" }, say: "später" }
                options:
                  - { text: "Im Sommer zelten wir.", bin: later }
                  - { text: "Gerade regnet es.", bin: now }
                  - { text: "Übermorgen kommt Tante Eva.", bin: later }
                  - { text: "Jetzt essen wir.", bin: now }
                hints:
                  - "Achte auf die Zeitangabe im Satz."
                  - "Im Sommer und übermorgen sind später."
                  - "Gerade und jetzt sind jetzt."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Der Satz „Heute Abend gehe ich ins Kino.“ erzählt von der Zukunft."
                say: "Heute Abend gehe ich ins Kino. Erzählt der Satz von der Zukunft?"
                answer: true
                hints:
                  - "Ist der Abend schon da?"
                  - "Heute Abend kommt noch."
                  - "Ja, der Satz steht im Präsens und erzählt von der Zukunft."
              - id: l2-f5
                type: highlight_in_text
                text: "Tippe auf die Zeitangabe."
                say: "Der Satz steht im Präsens. Tippe auf die zwei Wörter, die zeigen, dass es später passiert."
                show: { drawn: letter-card, text: "Nächsten Montag schreiben wir einen Test." }
                spans: ["Nächsten", "Montag"]
                hints:
                  - "Welche Wörter sagen, wann es passiert?"
                  - "Sie stehen am Anfang."
                  - "Nächsten Montag."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Satz erzählt von der Zukunft?"
                say: "Welcher Satz sagt, was noch kommt?"
                options: ["Ich räume gerade auf.", "Ich räume morgen auf.", "Ich habe aufgeräumt."]
                answer: "Ich räume morgen auf."
                option_audio: false
                hints: ["Such die Zeitangabe."]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Satz sagt dasselbe? „Wir werden im Winter Ski fahren.“"
                say: "Welcher Satz sagt dasselbe wie: Wir werden im Winter Ski fahren?"
                options: ["Im Winter fahren wir Ski.", "Im Winter fuhren wir Ski.", "Im Winter sind wir Ski gefahren."]
                answer: "Im Winter fahren wir Ski."
                option_audio: false
                hints: ["Welche Zeitform kann mit einer Zeitangabe Zukunft ausdrücken?"]
              - id: l2-s3
                type: sorting
                text: "Jetzt oder später?"
                say: "Sortiere die Sätze. Passiert es jetzt oder später?"
                option_audio: false
                bins:
                  - { id: now, show: { text: "jetzt" }, say: "jetzt" }
                  - { id: later, show: { text: "später" }, say: "später" }
                options:
                  - { text: "Bald beginnen die Ferien.", bin: later }
                  - { text: "Im Moment schläft das Baby.", bin: now }
                  - { text: "Nächstes Jahr lernen wir Französisch.", bin: later }
                  - { text: "Die Katze liegt gerade auf dem Sofa.", bin: now }
                hints: ["Welche Wörter sagen, wann es passiert?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Der Satz „Ich lese gerade ein Buch.“ erzählt von der Zukunft."
                say: "Ich lese gerade ein Buch. Erzählt der Satz von der Zukunft?"
                answer: false
                hints: ["Was bedeutet gerade?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Ergänze die passende Form von werden."
                say: "Setz die passende Form von werden ein: Wir ... im Garten grillen."
                frame: "Wir _ im Garten grillen."
                options: ["werde", "wirst", "wird", "werden"]
                answer: ["werden"]
                hints: ["Welche Form gehört zu wir?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Satz erzählt von der Zukunft?"
                say: "Welcher Satz sagt, was noch kommt?"
                options: ["Am Freitag besuchen wir das Museum.", "Wir besuchten das Museum.", "Wir besuchen gerade das Museum."]
                answer: "Am Freitag besuchen wir das Museum."
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Satz sagt dasselbe? „Tim wird im Herbst Fußball spielen.“"
                say: "Welcher Satz sagt dasselbe wie: Tim wird im Herbst Fußball spielen?"
                options: ["Im Herbst spielt Tim Fußball.", "Im Herbst spielte Tim Fußball.", "Tim hat im Herbst Fußball gespielt."]
                answer: "Im Herbst spielt Tim Fußball."
                option_audio: false
              - id: l2-n3
                type: sorting
                text: "Jetzt oder später?"
                say: "Sortiere die Sätze. Passiert es jetzt oder später?"
                option_audio: false
                bins:
                  - { id: now, show: { text: "jetzt" }, say: "jetzt" }
                  - { id: later, show: { text: "später" }, say: "später" }
                options:
                  - { text: "In zwei Tagen fahren wir los.", bin: later }
                  - { text: "Jetzt klingelt das Telefon.", bin: now }
                  - { text: "Morgen früh backt Papa Brot.", bin: later }
                  - { text: "Gerade kocht das Wasser.", bin: now }
              - id: l2-n4
                type: true_false
                text: "Es ist März. Stimmt das? Der Satz „Im Juli fahren wir ans Meer.“ erzählt von der Zukunft."
                say: "Es ist März. Im Juli fahren wir ans Meer. Erzählt der Satz von der Zukunft?"
                answer: true
              - id: l2-n5
                type: highlight_in_text
                text: "Tippe auf die Zeitangabe."
                say: "Der Satz steht im Präsens. Tippe auf das Wort, das zeigt, dass es später passiert."
                show: { drawn: letter-card, text: "Übermorgen besucht uns der Nikolaus." }
                spans: ["Übermorgen"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Ergänze die passende Form von werden."
            say: "Setz das passende Wort ein: Ihr ... den Kuchen probieren."
            frame: "Ihr _ den Kuchen probieren."
            options: ["werde", "wirst", "werdet", "werden"]
            answer: ["werdet"]
          - id: l2-c2
            type: multiple_choice
            text: "Paul wird morgen sein Zimmer _."
            say: "Welches Wort passt ans Ende? Paul wird morgen sein Zimmer ..."
            options: ["streichen", "gestrichen", "strich"]
            answer: "streichen"
          - id: l2-c3
            type: multiple_choice
            text: "Welcher Satz sagt dasselbe? „Wir werden am Sonntag wandern.“"
            say: "Welcher Satz sagt dasselbe wie: Wir werden am Sonntag wandern?"
            options: ["Am Sonntag wandern wir.", "Am Sonntag wanderten wir.", "Am Sonntag sind wir gewandert."]
            answer: "Am Sonntag wandern wir."
            option_audio: false
          - id: l2-c4
            type: true_false
            text: "Stimmt das? „Du wirst den Weg finden.“"
            say: "Du wirst den Weg finden. Ist der Satz richtig?"
            answer: true
          - id: l2-c5
            type: sorting
            text: "Jetzt oder später?"
            say: "Ordne jeden Satz zu: jetzt oder später?"
            option_audio: false
            bins:
              - { id: now, show: { text: "jetzt" }, say: "jetzt" }
              - { id: later, show: { text: "später" }, say: "später" }
            options:
              - { text: "Morgen schneit es.", bin: later }
              - { text: "Gerade bellt der Hund.", bin: now }
              - { text: "Nach den Ferien kaufen wir ein Rad.", bin: later }
              - { text: "Im Moment lacht Mia.", bin: now }
