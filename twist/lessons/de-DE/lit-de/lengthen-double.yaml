# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.lengthen-double
skill: lit-de.spelling-strategies.lengthen-double
curriculum: de-DE
language: de
title:
  de: Verlängern bei doppelten Mitlauten
  en: Lengthening for double consonants
summary: >
  At the end of a word or before another letter, a double Mitlaut is hard
  to hear. Lesson 1 lengthens Nomen and Wiewörter (Ball, Bälle; dünn,
  dünne) to hear it across two syllables; lesson 2 lengthens Tunwörter
  (er kommt, kommen; sie rennt, rennen), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Rechtschreibstrategien, en: Spelling strategies }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling-strategies.lengthen-bp-gk, lit-de.spelling.double-consonants, lit-de.verbs.conjugate]
  also_practises: [lit-de.spelling.double-consonants, lit-de.verbs.base-form]
  vocabulary: { de: [verlängern, doppelter Mitlaut, Grundform, Mehrzahl] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: lose-double-at-end
      what: Writes one letter at the end because the double cannot be heard there (Bal, dün, Schif)
      addressed: lesson 1 Learn lengthens Ball and dünn; a gap and a misspelt card in every stage of lesson 1
    - id: lose-double-in-verb
      what: Writes one letter in a conjugated Tunwort (er komt, sie rent)
      addressed: lesson 2 Learn lengthens kommt and rennt to the Grundform; every stage of lesson 2 has a verb gap and a verb card, misspelt in l2-f4 and l2-s4
    - id: double-without-reason
      what: Doubles where the long form has one letter (Hutt, er lebbt)
      addressed: l1-f2, l1-n2, l2-s2 and l2-n2 lengthen a word that keeps one letter
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Ball, Bälle", en: "Ball, Bälle" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "d oder t? Verlängere."
            say: "Das Kleid. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "das Klei_"
            options: ["d", "t"]
            answer: ["d"]
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "n oder nn?"
            say: "Die Sonne. Was fehlt?"
            frame: "So_e"
            options: ["nn", "n"]
            answer: ["nn"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ball → die Bälle"
            say: "Am Ende von Ball hörst du nicht, ob ein l oder zwei kommen. Verlängere das Wort: die Bälle. Jetzt schwingst du: Bäl, le. Du hörst: Das l gehört zu beiden Silben. Darum schreibst du ll."
            show: { object: ball }
          - text: "dünn → ein dünnes Buch"
            say: "Auch Wiewörter kannst du so verlängern: dünn, ein dünnes Buch. Dün, nes: Du schreibst nn."
          - text: "Hut → die Hüte"
            say: "Verlängerst du Hut, hörst du Hü, te. Das t gehört nur zur zweiten Silbe, und das ü ist lang. Hut schreibst du mit einem t."
            show: { object: hat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Verlängere: f oder ff?"
                say: "Das Schiff. Was fehlt am Ende? Verlängere das Wort."
                frame: "das Schi_"
                options: ["ff", "f"]
                answer: ["ff"]
                hints:
                  - "Mach das Wort länger: ein Schiff, zwei …"
                  - "Schiffe. Schwinge: Schif, fe."
                  - "Das f gehört zu beiden Silben: Schiff mit ff."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Verlängere: l oder ll?"
                say: "Der Stuhl. Was fehlt am Ende? Verlängere das Wort."
                frame: "der Stuh_"
                options: ["l", "ll"]
                answer: ["l"]
                hints:
                  - "Mach das Wort länger: ein Stuhl, zwei …"
                  - "Stühle. Schwinge: Stüh, le. Das l gehört nur zur zweiten Silbe."
                  - "Ein l: Stuhl."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Wort hilft dir bei nett?"
                say: "Welches Wort hilft dir, wenn du nett schreiben willst?"
                options: ["ein nettes Kind", "der Nebel", "neu"]
                answer: "ein nettes Kind"
                hints:
                  - "Verlängere das Wiewort mit einem Nomen."
                  - "In welchem Wort steckt nett, aber mit einer Silbe mehr?"
                  - "ein nettes Kind."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Das Fell. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Fel" }
                answer: false
                hints:
                  - "Verlängere das Wort: ein Fell, viele …"
                  - "Schwinge: Fel, le. Hörst du das l in beiden Silben?"
                  - "Nein. Richtig ist Fell mit ll."
              - id: l1-f5
                type: fill_in_blank
                text: "Verlängere: l oder ll?"
                say: "Schnell. Was fehlt am Ende? Verlängere das Wiewort mit einem Nomen."
                frame: "schne_"
                options: ["ll", "l"]
                answer: ["ll"]
                hints:
                  - "Setz ein Nomen dazu: ein schnelles …"
                  - "Ein schnelles Auto. Schwinge: schnel, les."
                  - "Doppel-l: schnell."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Verlängere: m oder mm?"
                say: "Der Kamm. Was fehlt am Ende? Verlängere das Wort."
                frame: "der Ka_"
                options: ["mm", "m"]
                answer: ["mm"]
                hints: ["Verlängere das Wort: ein Kamm, zwei …"]
              - id: l1-s2
                type: multiple_choice
                text: "Welches Wort hilft dir bei voll?"
                say: "Welches Wort hilft dir, wenn du voll schreiben willst?"
                options: ["ein volles Glas", "der Vogel", "vor"]
                answer: "ein volles Glas"
                hints: ["Verlängere das Wiewort mit einem Nomen."]
              - id: l1-s3
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Toll. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "tol" }
                answer: false
                hints: ["Setz ein Nomen dazu: ein … Tag. Schwinge dann."]
              - id: l1-s4
                type: fill_in_blank
                text: "Verlängere: t oder tt?"
                say: "Das Blatt. Was fehlt am Ende? Verlängere das Wort."
                show: { object: leaf }
                frame: "das Bla_"
                options: ["tt", "t"]
                answer: ["tt"]
                hints: ["Verlängere das Wort: ein Blatt, viele …"]
              - id: l1-s5
                type: fill_in_blank
                text: "Verlängere: s oder ss?"
                say: "Nass. Was fehlt am Ende? Verlängere das Wiewort mit einem Nomen."
                frame: "na_"
                options: ["ss", "s"]
                answer: ["ss"]
                hints: ["Setz ein Nomen dazu: ein … Handtuch. Schwinge dann."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Verlängere: l oder ll?"
                say: "Der Stall. Was fehlt am Ende? Verlängere das Wort."
                frame: "der Sta_"
                options: ["ll", "l"]
                answer: ["ll"]
              - id: l1-n2
                type: fill_in_blank
                text: "Verlängere: r oder rr?"
                say: "Das Tor. Was fehlt am Ende? Verlängere das Wort."
                frame: "das To_"
                options: ["r", "rr"]
                answer: ["r"]
              - id: l1-n3
                type: multiple_choice
                text: "Welches Wort hilft dir bei Brett?"
                say: "Welches Wort hilft dir, wenn du Brett schreiben willst?"
                options: ["die Bretter", "breit", "das Brot"]
                answer: "die Bretter"
              - id: l1-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Hell. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "hel" }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Verlängere: p oder pp?"
                say: "Knapp. Was fehlt am Ende? Verlängere das Wiewort."
                frame: "kna_"
                options: ["pp", "p"]
                answer: ["pp"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Verlängere: n oder nn?"
            say: "Der Mann. Was fehlt am Ende? Verlängere das Wort."
            frame: "der Ma_"
            options: ["nn", "n"]
            answer: ["nn"]
          - id: l1-c2
            type: fill_in_blank
            text: "Verlängere: l oder ll?"
            say: "Das Seil. Was fehlt am Ende? Verlängere das Wort."
            frame: "das Sei_"
            options: ["l", "ll"]
            answer: ["l"]
          - id: l1-c3
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Satt. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "satt" }
            answer: true

  - n: 2
    title: { de: "Er kommt, kommen", en: "Er kommt, kommen" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Verlängere: t oder tt?"
            say: "Das Bett. Was fehlt am Ende? Verlängere das Wort."
            frame: "das Be_"
            options: ["tt", "t"]
            answer: ["tt"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist die Grundform von er schwimmt?"
            say: "Er schwimmt. Wie heißt die Grundform?"
            options: ["schwimmen", "schwimmt", "schwamm"]
            answer: "schwimmen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "er kommt → kommen"
            say: "In er kommt hörst du nicht, ob ein m oder zwei kommen, weil das t gleich folgt. Bilde die Grundform: kommen. Schwinge: kom, men. Jetzt hörst du es: mm."
          - text: "sie rennt → rennen"
            say: "Sie rennt kommt von rennen. Ren, nen: Du schreibst nn, also auch in sie rennt."
          - text: "er lebt → leben"
            say: "Er lebt kommt von leben. Le, ben: Hier hörst du nur ein b. Also schreibst du er lebt mit einem b."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Verlängere: n oder nn?"
                say: "Es brennt. Was fehlt? Bilde die Grundform."
                frame: "es bre_t"
                options: ["nn", "n"]
                answer: ["nn"]
                hints:
                  - "Bilde die Grundform: Es brennt kommt von …"
                  - "Brennen. Schwinge: bren, nen."
                  - "Doppel-n: es brennt."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Grundform hilft dir bei er bellt?"
                say: "Er bellt. Welche Grundform hilft dir?"
                options: ["bellen", "belt", "bleiben"]
                answer: "bellen"
                hints:
                  - "Wie heißt das Tunwort ohne er?"
                  - "Sag: Der Hund will … Welches Wort passt?"
                  - "bellen. Schwinge: bel, len."
              - id: l2-f3
                type: fill_in_blank
                text: "Verlängere: f oder ff?"
                say: "Sie hofft. Was fehlt? Bilde die Grundform."
                frame: "sie ho_t"
                options: ["ff", "f"]
                answer: ["ff"]
                hints:
                  - "Bilde die Grundform: Sie hofft kommt von …"
                  - "Hoffen. Schwinge: hof, fen."
                  - "Doppel-f: sie hofft."
              - id: l2-f4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Er brummt. Lies die Wörter. Sind sie richtig geschrieben?"
                show: { drawn: letter-card, text: "er brumt" }
                answer: false
                hints:
                  - "Bilde die Grundform."
                  - "Er brummt kommt von brummen. Schwinge: brum, men. Wie viele m hörst du?"
                  - "Nein. Richtig ist er brummt mit mm."
              - id: l2-f5
                type: fill_in_blank
                text: "Verlängere: l oder ll?"
                say: "Sie stellt die Tasse hin. Was fehlt? Bilde die Grundform."
                frame: "Sie ste_t die Tasse hin."
                options: ["ll", "l"]
                answer: ["ll"]
                hints:
                  - "Welches Tunwort steckt in stellt?"
                  - "Stellen. Schwinge: stel, len."
                  - "Doppel-l: sie stellt."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Verlängere: m oder mm?"
                say: "Er schwimmt. Was fehlt? Bilde die Grundform."
                frame: "er schwi_t"
                options: ["mm", "m"]
                answer: ["mm"]
                hints: ["Bilde die Grundform und schwinge sie."]
              - id: l2-s2
                type: fill_in_blank
                text: "Verlängere: g oder gg?"
                say: "Sie fragt. Was fehlt? Bilde die Grundform."
                frame: "sie fra_t"
                options: ["g", "gg"]
                answer: ["g"]
                hints: ["Bilde die Grundform und schwinge sie."]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Grundform hilft dir bei sie kennt?"
                say: "Sie kennt. Welche Grundform hilft dir?"
                options: ["kennen", "kent", "kaufen"]
                answer: "kennen"
                hints: ["Wie heißt das Tunwort ohne sie?"]
              - id: l2-s4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Er rollt. Lies die Wörter. Sind sie richtig geschrieben?"
                show: { drawn: letter-card, text: "er rolt" }
                answer: false
                hints: ["Bilde die Grundform und schwinge sie."]
              - id: l2-s5
                type: fill_in_blank
                text: "Verlängere: t oder tt?"
                say: "Er bittet um Hilfe. Was fehlt? Bilde die Grundform."
                frame: "Er bi_et um Hilfe."
                options: ["tt", "t"]
                answer: ["tt"]
                hints: ["Bilde die Grundform und schwinge sie."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Verlängere: n oder nn?"
                say: "Er gewinnt. Was fehlt? Bilde die Grundform."
                frame: "er gewi_t"
                options: ["nn", "n"]
                answer: ["nn"]
              - id: l2-n2
                type: fill_in_blank
                text: "Verlängere: l oder ll?"
                say: "Sie spielt. Was fehlt? Bilde die Grundform."
                frame: "sie spie_t"
                options: ["l", "ll"]
                answer: ["l"]
              - id: l2-n3
                type: multiple_choice
                text: "Welche Grundform hilft dir bei es klappt?"
                say: "Es klappt. Welche Grundform hilft dir?"
                options: ["klappen", "klapt", "klopfen"]
                answer: "klappen"
              - id: l2-n4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Er trifft. Lies die Wörter. Sind sie richtig geschrieben?"
                show: { drawn: letter-card, text: "er trifft" }
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Verlängere: m oder mm?"
                say: "Das stimmt. Was fehlt? Bilde die Grundform."
                frame: "Das sti_t."
                options: ["mm", "m"]
                answer: ["mm"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Verlängere: f oder ff?"
            say: "Der Stoff. Was fehlt am Ende? Verlängere das Wort."
            frame: "der Sto_"
            options: ["ff", "f"]
            answer: ["ff"]
          - id: l2-c2
            type: fill_in_blank
            text: "Verlängere: l oder ll?"
            say: "Er füllt das Glas. Was fehlt? Bilde die Grundform."
            frame: "Er fü_t das Glas."
            options: ["ll", "l"]
            answer: ["ll"]
          - id: l2-c3
            type: fill_in_blank
            text: "Verlängere: m oder mm?"
            say: "Sie kämmt ihre Haare. Was fehlt? Bilde die Grundform."
            frame: "Sie kä_t ihre Haare."
            options: ["mm", "m"]
            answer: ["mm"]
          - id: l2-c4
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Glatt. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "glat" }
            answer: false
          - id: l2-c5
            type: fill_in_blank
            text: "Verlängere: l oder ll?"
            say: "Er holt den Ball. Was fehlt? Bilde die Grundform."
            frame: "Er ho_t den Ball."
            options: ["l", "ll"]
            answer: ["l"]
