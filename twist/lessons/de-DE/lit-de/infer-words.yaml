# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.infer-words
skill: lit-de.comprehension.infer-words
curriculum: de-DE
language: de
title:
  de: Unbekannte Wörter verstehen
  en: Working out unknown words
summary: >
  Working out what a new word means. Lesson 1 finds the clue in the same
  sentence or the next one (Der Fuchs ist flink. Kein Hund kann ihn
  fangen.) and the word in the text that means nearly the same; lesson 2
  reads on for the clue, uses a known word inside a long one (verschlafen,
  Federtasche), knows when to look a word up and under which letter, and
  ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.comprehension.find-information]
  also_practises: [lit-de.comprehension.find-information]
  vocabulary: { de: [Hinweis, Bedeutung, nachschlagen, Kinderlexikon] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: look-alike-word
      what: Guesses from a word that looks or sounds alike instead of reading the text (Knirps is a Knopf, a Wellensittich is a wave, a Federtasche holds feathers)
      addressed: "lesson 1 Learn sets flink against Fink; l1-f1, l2-f1 and l2-c3 offer the look-alike meaning, with feedback on l1-f1 and l2-f1"
    - id: stop-at-the-word
      what: Reads only the sentence with the new word and stops, so the clue in the next sentence is missed
      addressed: "lesson 2 Learn reads on from verschlafen; the clue sits in the next sentence in l2-f1, l2-f5, l2-s1, l2-n4, l2-c1 and l2-c2; the ordering tasks put \"Lies den nächsten Satz\" before looking up"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Der Satz hilft", en: "The sentence helps" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Nele hat ein Kaninchen.\nEs frisst gern Löwenzahn.\n\nWas frisst das Kaninchen gern?"
            say: "Lies den Text und die Frage. Was frisst das Kaninchen gern?"
            options: ["Löwenzahn", "Möhren", "Nele"]
            answer: "Löwenzahn"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Nele hat ein Kaninchen.\nEs wohnt in einem Stall im Garten.\n\nSteht das im Text? Das Kaninchen wohnt im Haus."
            say: "Lies den Text. Steht das so im Text?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Fuchs ist sehr flink.\nKein Hund kann ihn fangen."
            say: "Kennst du das Wort flink? Lies weiter: Kein Hund kann ihn fangen. Also ist der Fuchs sehr schnell. Flink heißt schnell."
          - text: "Lies den Satz.\nLies den Satz danach.\nFrag dich: Was würde hier passen?"
            say: "So findest du heraus, was ein Wort bedeutet. Der Text gibt dir einen Hinweis. Setz dann ein Wort ein, das du kennst, und prüfe, ob der Satz noch Sinn ergibt."
          - text: "flink | der Fink"
            say: "Pass auf: Flink sieht fast aus wie Fink. Ein Fink ist ein Vogel. Aber der Fuchs ist kein Vogel. Achte auf den Text, nicht nur darauf, wie das Wort aussieht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Mein Bruder ist ein kleiner Knirps.\nEr ist erst drei Jahre alt.\n\nWas ist ein Knirps?"
                say: "Lies den Text. Was ist ein Knirps?"
                options: ["ein kleines Kind", "ein Knopf", "ein großer Mann"]
                answer: "ein kleines Kind"
                feedback:
                  "ein Knopf": "Knirps sieht ein bisschen aus wie Knopf. Aber lies weiter: Er ist drei Jahre alt."
                hints:
                  - "Lies auch den zweiten Satz. Wie alt ist der Bruder?"
                  - "Wer drei Jahre alt ist, ist noch klein."
                  - "Ein Knirps ist ein kleines Kind."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ein Schwarm Vögel fliegt über das Feld.\nEs sind so viele, dass der Himmel dunkel wird.\n\nWas ist ein Schwarm?"
                say: "Lies den Text. Was ist ein Schwarm?"
                options: ["viele Vögel zusammen", "ein einzelner Vogel", "eine dunkle Wolke"]
                answer: "viele Vögel zusammen"
                hints:
                  - "Lies den zweiten Satz. Wie viele Vögel sind es?"
                  - "Es sind so viele, dass der Himmel dunkel wird."
                  - "Ein Schwarm sind viele Vögel zusammen."
              - id: l1-f3
                type: highlight_in_text
                text: "Welches Wort bedeutet fast das Gleiche wie schlummert? Tippe darauf."
                say: "Lies den Text. Welches Wort bedeutet fast das Gleiche wie schlummert? Tippe darauf."
                show: { drawn: letter-card, text: "Das Baby schlummert in seinem Bett. Es schläft ganz tief." }
                spans: ["schläft"]
                hints:
                  - "Der zweite Satz sagt das Gleiche noch einmal mit anderen Worten."
                  - "Was macht ein Baby in seinem Bett?"
                  - "Tippe auf schläft."
              - id: l1-f4
                type: true_false
                text: "Der Pfau hat prächtige Federn.\nSie glänzen in vielen Farben.\nAlle Kinder bleiben stehen und staunen.\n\nHeißt prächtig hier: sehr schön?"
                say: "Lies den Text. Heißt prächtig hier: sehr schön?"
                answer: true
                hints:
                  - "Lies weiter. Was machen die Kinder?"
                  - "Die Federn glänzen bunt, und die Kinder staunen."
                  - "Ja, prächtig heißt sehr schön."
              - id: l1-f5
                type: fill_in_blank
                text: "Mitten im Wald ist eine Lichtung.\nDort stehen keine Bäume, und die Sonne scheint hell.\n\nFüll die Lücke."
                say: "Lies den Text. Was ist eine Lichtung? Füll die Lücke."
                frame: "Eine Lichtung ist eine Stelle im Wald ohne _."
                options: ["Bäume", "Sonne", "Wege"]
                answer: ["Bäume"]
                hints:
                  - "Lies den zweiten Satz genau."
                  - "Was steht dort nicht?"
                  - "Eine Lichtung ist eine Stelle ohne Bäume."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Draußen ist es eiskalt.\nLea bibbert, und ihre Zähne klappern.\n\nWas bedeutet bibbern?"
                say: "Lies den Text. Was bedeutet bibbern?"
                options: ["vor Kälte zittern", "laut singen", "schnell rennen"]
                answer: "vor Kälte zittern"
                hints: ["Es ist eiskalt, und die Zähne klappern."]
              - id: l1-s2
                type: multiple_choice
                text: "Die Wölfe leben in einem Rudel.\nSie jagen immer zusammen.\n\nWas ist ein Rudel?"
                say: "Lies den Text. Was ist ein Rudel?"
                options: ["eine Gruppe Wölfe", "ein Wolf allein", "ein Wald"]
                answer: "eine Gruppe Wölfe"
                hints: ["Lies den zweiten Satz: zusammen."]
              - id: l1-s3
                type: highlight_in_text
                text: "Welche Wörter bedeuten fast das Gleiche wie mürrisch? Tippe darauf."
                say: "Lies den Text. Welche zwei Wörter bedeuten fast das Gleiche wie mürrisch? Tippe darauf."
                show: { drawn: letter-card, text: "Opa ist heute mürrisch. Er ist schlecht gelaunt und brummt nur." }
                spans: ["schlecht", "gelaunt"]
                hints: ["Der zweite Satz sagt es mit anderen Worten."]
              - id: l1-s4
                type: true_false
                text: "Die Ziegen laufen im Gehege herum.\nRundherum ist ein Zaun.\n\nIst ein Gehege ein Platz mit einem Zaun?"
                say: "Lies den Text. Ist ein Gehege ein Platz mit einem Zaun?"
                answer: true
                hints: ["Was ist rund um die Ziegen herum?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Hinter dem Haus fließt ein Bach.\nEr ist schmal, und das Wasser plätschert.\n\nFüll die Lücke."
                say: "Lies den Text. Was ist ein Bach? Füll die Lücke."
                frame: "Ein Bach ist ein kleiner _."
                options: ["Fluss", "Berg", "Weg"]
                answer: ["Fluss"]
                hints: ["Ein Bach fließt, und er hat Wasser."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Der Hund zerrt an der Leine.\nEr will unbedingt zum Ball.\n\nWas bedeutet zerren?"
                say: "Lies den Text. Was bedeutet zerren?"
                options: ["fest ziehen", "leise bellen", "lange schlafen"]
                answer: "fest ziehen"
              - id: l1-n2
                type: multiple_choice
                text: "Das Eichhörnchen klettert bis in den Wipfel.\nHöher geht es nicht.\n\nWas ist ein Wipfel?"
                say: "Lies den Text. Was ist ein Wipfel?"
                options: ["die Spitze vom Baum", "die Wurzel vom Baum", "ein Nest"]
                answer: "die Spitze vom Baum"
              - id: l1-n3
                type: highlight_in_text
                text: "Welches Wort bedeutet fast das Gleiche wie stibitzt? Tippe darauf."
                say: "Lies den Text. Welches Wort bedeutet fast das Gleiche wie stibitzt? Tippe darauf."
                show: { drawn: letter-card, text: "Der Rabe stibitzt einen Keks. Er klaut ihn vom Tisch und fliegt weg." }
                spans: ["klaut"]
              - id: l1-n4
                type: true_false
                text: "Zaghaft streckt Paul die Hand aus.\nEr hat ein bisschen Angst vor dem Pferd.\n\nHeißt zaghaft hier: mutig und schnell?"
                say: "Lies den Text. Heißt zaghaft hier: mutig und schnell?"
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Für den Ausflug packen wir Proviant ein.\nWir nehmen Brote, Äpfel und Saft mit.\n\nFüll die Lücke."
                say: "Lies den Text. Was ist Proviant? Füll die Lücke."
                frame: "Proviant ist _ für unterwegs."
                options: ["Essen und Trinken", "Spielzeug", "Kleidung"]
                answer: ["Essen und Trinken"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ben isst seine Suppe und schmatzt dabei laut.\nMama sagt: „Bitte iss leiser!“\n\nWas bedeutet schmatzen?"
            say: "Lies den Text. Was bedeutet schmatzen?"
            options: ["beim Essen laute Geräusche machen", "leise flüstern", "schnell laufen"]
            answer: "beim Essen laute Geräusche machen"
          - id: l1-c2
            type: highlight_in_text
            text: "Welches Wort bedeutet fast das Gleiche wie munter? Tippe darauf."
            say: "Lies den Text. Welches Wort bedeutet fast das Gleiche wie munter? Tippe darauf."
            show: { drawn: letter-card, text: "Lars ist heute früh schon munter. Er ist hellwach und will spielen." }
            spans: ["hellwach"]
          - id: l1-c3
            type: true_false
            text: "Auf dem Tisch liegt ein Stapel Bücher.\nEin Buch liegt auf dem anderen.\n\nIst ein Stapel: viele Dinge übereinander?"
            say: "Lies den Text. Ist ein Stapel: viele Dinge übereinander?"
            answer: true

  - n: 2
    title: { de: "Weiterlesen und nachschlagen", en: "Reading on and looking up" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Die Katze ist flink.\nSie fängt jede Maus.\n\nWas bedeutet flink?"
            say: "Lies den Text. Was bedeutet flink?"
            options: ["schnell", "müde", "dick"]
            answer: "schnell"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Das Kätzchen ist erschöpft.\nEs hat den ganzen Tag gespielt und schläft sofort ein.\n\nHeißt erschöpft: sehr müde?"
            say: "Lies den Text. Heißt erschöpft: sehr müde?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Am Morgen ist Paul ganz verschlafen.\nEr gähnt und reibt sich die Augen.\nEr kommt kaum aus dem Bett."
            say: "Manchmal steht der Hinweis erst in den nächsten Sätzen. Lies dann weiter. Paul gähnt und kommt kaum aus dem Bett. Verschlafen heißt: noch ganz müde."
          - text: "verschlafen: schlafen\nFedertasche: Tasche"
            say: "In einem langen Wort steckt oft ein Wort, das du kennst. In verschlafen steckt schlafen. Eine Federtasche ist eine Tasche. Aber was ist drin? Lies im Text nach: Es sind Stifte."
          - text: "Der Text hilft nicht?\nSchlag im Kinderlexikon nach.\nSuch beim ersten Buchstaben."
            say: "Manchmal hilft dir der Text nicht weiter. Dann schlägst du das Wort im Kinderlexikon nach oder fragst jemanden. Im Lexikon sind die Wörter nach dem ABC geordnet. Du suchst beim ersten Buchstaben des Wortes."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Lilly hat einen Wellensittich.\nEr sitzt in seinem Käfig und zwitschert.\nSeine Federn sind grün und gelb.\n\nWas ist ein Wellensittich?"
                say: "Lies den ganzen Text. Was ist ein Wellensittich?"
                options: ["ein kleiner Vogel", "eine Welle im Meer", "ein Fisch"]
                answer: "ein kleiner Vogel"
                feedback:
                  "eine Welle im Meer": "In Wellensittich steckt Welle. Aber lies weiter: Er zwitschert und hat Federn."
                hints:
                  - "Lies weiter. Was macht der Wellensittich, und was hat er?"
                  - "Er zwitschert und hat Federn. Welches Tier ist das?"
                  - "Ein Wellensittich ist ein kleiner Vogel."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Oma füllt die Gießkanne mit Wasser.\nDann gießt sie die Blumen.\n\nWas ist eine Gießkanne?"
                say: "Lies den Text. Was ist eine Gießkanne?"
                options: ["eine Kanne zum Blumengießen", "eine Kanne für Tee", "ein Eimer für Sand"]
                answer: "eine Kanne zum Blumengießen"
                hints:
                  - "In Gießkanne stecken zwei Wörter, die du kennst."
                  - "Gießen und Kanne. Was macht Oma mit dem Wasser?"
                  - "Eine Gießkanne ist eine Kanne zum Blumengießen."
              - id: l2-f3
                type: multiple_choice
                text: "Du liest das Wort Hängematte. Du verstehst es nicht, und der Text hilft dir nicht.\n\nWas kannst du tun?"
                say: "Du verstehst ein Wort nicht, und der Text hilft dir nicht. Was kannst du tun?"
                options: ["im Kinderlexikon nachschlagen", "aufhören zu lesen", "irgendetwas raten"]
                answer: "im Kinderlexikon nachschlagen"
                hints:
                  - "Wo stehen Wörter mit ihrer Erklärung?"
                  - "Raten hilft dir nicht, wenn der Text keinen Hinweis gibt."
                  - "Schlag im Kinderlexikon nach."
              - id: l2-f4
                type: multiple_choice
                text: "Unter welchem Buchstaben suchst du Hängematte im Lexikon?"
                say: "Unter welchem Buchstaben suchst du Hängematte im Lexikon?"
                options: ["H", "M", "Ä"]
                answer: "H"
                hints:
                  - "Im Lexikon suchst du beim ersten Buchstaben."
                  - "Was ist der erste Buchstabe von Hängematte?"
                  - "H."
              - id: l2-f5
                type: true_false
                text: "Herr Kaya ist Bergsteiger.\nEr klettert auf die höchsten Berge der Welt.\n\nIst ein Bergsteiger jemand, der auf Berge klettert?"
                say: "Lies den Text. Ist ein Bergsteiger jemand, der auf Berge klettert?"
                answer: true
                hints:
                  - "Lies den zweiten Satz."
                  - "In Bergsteiger steckt auch Berg."
                  - "Ja."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Im Herbst färbt sich das Laub.\nDie Blätter an den Bäumen werden gelb, rot und braun.\n\nWas ist Laub?"
                say: "Lies den Text. Was ist Laub?"
                options: ["die Blätter der Bäume", "die Äste", "das Gras"]
                answer: "die Blätter der Bäume"
                hints: ["Lies weiter. Was wird gelb, rot und braun?"]
              - id: l2-s2
                type: multiple_choice
                text: "Es regnet stark.\nDas Wasser läuft vom Dach in die Regenrinne.\n\nWas ist eine Regenrinne?"
                say: "Lies den Text. Was ist eine Regenrinne?"
                options: ["eine Rinne am Dach für Regenwasser", "ein Regenschirm", "eine Wolke"]
                answer: "eine Rinne am Dach für Regenwasser"
                hints: ["In Regenrinne stecken zwei Wörter. Wohin läuft das Wasser?"]
              - id: l2-s3
                type: multiple_choice
                text: "Unter welchem Buchstaben suchst du Qualle im Lexikon?"
                say: "Unter welchem Buchstaben suchst du Qualle im Lexikon?"
                options: ["Q", "K", "U"]
                answer: "Q"
                hints: ["Qualle klingt am Anfang wie K. Aber wie schreibt man es?"]
              - id: l2-s4
                type: true_false
                text: "Das Kätzchen ist noch winzig.\nEs passt in eine Hand.\n\nHeißt winzig: sehr groß?"
                say: "Lies den Text. Heißt winzig: sehr groß?"
                answer: false
                hints: ["Wie groß ist etwas, das in eine Hand passt?"]
              - id: l2-s5
                type: ordering
                text: "Du verstehst ein Wort nicht. Was machst du zuerst, was danach?"
                say: "Du verstehst ein Wort nicht. Bring die Schritte in die richtige Reihenfolge."
                options: ["Lies den Satz noch einmal.", "Lies den nächsten Satz.", "Schlag im Lexikon nach."]
                slot_count: 3
                answer: ["Lies den Satz noch einmal.", "Lies den nächsten Satz.", "Schlag im Lexikon nach."]
                hints: ["Erst suchst du im Text. Nachschlagen kommt zum Schluss."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Auf dem Markt gibt es einen Stand mit Gemüse.\nDort verkauft eine Frau Möhren und Kartoffeln.\n\nWas ist hier ein Stand?"
                say: "Lies den Text. Was ist hier ein Stand?"
                options: ["ein Tisch, an dem man etwas verkauft", "ein Stuhl", "ein Bus"]
                answer: "ein Tisch, an dem man etwas verkauft"
              - id: l2-n2
                type: multiple_choice
                text: "Bello schläft in seiner Hundehütte.\nSie steht im Garten und hat ein kleines Dach.\n\nWas ist eine Hundehütte?"
                say: "Lies den Text. Was ist eine Hundehütte?"
                options: ["ein kleines Haus für den Hund", "ein Napf für den Hund", "eine Leine"]
                answer: "ein kleines Haus für den Hund"
              - id: l2-n3
                type: multiple_choice
                text: "Unter welchem Buchstaben suchst du Vulkan im Lexikon?"
                say: "Unter welchem Buchstaben suchst du Vulkan im Lexikon?"
                options: ["V", "F", "U"]
                answer: "V"
              - id: l2-n4
                type: true_false
                text: "Opa ist heute heiser.\nEr kann kaum sprechen, und seine Stimme ist ganz rau.\n\nHeißt heiser: mit rauer Stimme?"
                say: "Lies den Text. Heißt heiser: mit rauer Stimme?"
                answer: true
              - id: l2-n5
                type: ordering
                text: "Du schlägst ein Wort im Lexikon nach. Was machst du zuerst, was danach?"
                say: "Du schlägst ein Wort im Lexikon nach. Bring die Schritte in die richtige Reihenfolge."
                options: ["Schau auf den ersten Buchstaben.", "Such den Buchstaben im Lexikon.", "Lies die Erklärung."]
                slot_count: 3
                answer: ["Schau auf den ersten Buchstaben.", "Such den Buchstaben im Lexikon.", "Lies die Erklärung."]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Der Igel sucht sich ein Quartier für den Winter.\nUnter einem Laubhaufen schläft er bis zum Frühling.\n\nWas ist hier ein Quartier?"
            say: "Lies den Text. Was ist hier ein Quartier?"
            options: ["ein Platz zum Wohnen und Schlafen", "ein Stück Futter", "ein Freund"]
            answer: "ein Platz zum Wohnen und Schlafen"
          - id: l2-c2
            type: multiple_choice
            text: "Die Kinder stehen am Ufer.\nVor ihnen liegt der See.\nSie werfen Steine ins Wasser.\n\nWas ist ein Ufer?"
            say: "Lies den Text. Was ist ein Ufer?"
            options: ["der Rand am Wasser", "ein Boot", "ein Berg"]
            answer: "der Rand am Wasser"
          - id: l2-c3
            type: multiple_choice
            text: "Ella packt ihre Federtasche.\nSie legt Stifte und einen Radiergummi hinein.\n\nWas ist eine Federtasche?"
            say: "Lies den Text. Was ist eine Federtasche?"
            options: ["eine Tasche für Stifte", "eine Tasche voller Federn", "ein Kissen"]
            answer: "eine Tasche für Stifte"
          - id: l2-c4
            type: multiple_choice
            text: "Unter welchem Buchstaben suchst du Pinguin im Lexikon?"
            say: "Unter welchem Buchstaben suchst du Pinguin im Lexikon?"
            options: ["P", "B", "G"]
            answer: "P"
          - id: l2-c5
            type: true_false
            text: "Lukas ist heute sehr vergnügt.\nEr lacht, singt und hüpft durch die Küche.\n\nHeißt vergnügt: traurig?"
            say: "Lies den Text. Heißt vergnügt: traurig?"
            answer: false
