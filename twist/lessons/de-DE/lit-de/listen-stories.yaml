# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.listen-stories
skill: lit-de.texts-media.listen-stories
curriculum: de-DE
language: de
title:
  de: Geschichten und Gedichte hören
  en: Listening to stories and poems
summary: >
  Listening to a story or a poem read aloud and saying who is in it and
  what happens. The voice reads every story; the child never has to read
  it. Lesson 1 learns what a good listener does and finds who is in a
  story and where it happens; lesson 2 listens for what happens, in what
  order and how it ends, hears short poems, and ends with the skill
  check. Retelling aloud is practised with speak tasks and not marked.
  All stories and poems are written for Twist.
metadata:
  year: klasse-1
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: [lit-de.comprehension.order-story]
  vocabulary: { de: [zuhören, Geschichte, Gedicht, Figur, vorkommen, passieren] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: last-named
      what: Answers with the last person or animal named, not with the one the story is about
      addressed: "lesson 1 Learn says the one the story is about comes back again and again; the stories in l1-f1 (with feedback), l1-s1, l1-n1 and l2-c1 end by naming another animal that is among the options"
    - id: what-usually-happens
      what: Answers from what usually happens, not from what the story says (the cat catches the mouse; the hedgehog sleeps all winter)
      addressed: "lesson 2 Learn tells a story where the cat does not chase the mouse; l1-f4 (with feedback), l2-f2, l2-s2, l2-n2 and l2-c3 offer the usual ending as a wrong option"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wer kommt vor?", en: "Who is in the story?" }
    new_content: true
    activities:
      - activity: learn
        mode: model-text
        screens:
          - text: "Gut zuhören"
            say: "Gleich hörst du eine Geschichte. Gute Zuhörer sind leise, schauen hin und hören bis zum Ende zu."
            show: { objects: [listen, quiet] }
          - text: "Hör zu."
            say: "Hör zu. Ein kleiner Igel wohnt im Garten. Am Abend sucht der Igel Würmer. Er findet drei Würmer und frisst sie auf. Dann kriecht er zurück unter den Busch. Eine Amsel sieht ihm zu."
            show: { object: hedgehog }
          - text: "Wer?\nWas passiert?"
            say: "Wer kommt in der Geschichte vor? Ein Igel, und am Ende eine Amsel. Um wen geht es? Um den Igel. Er kommt immer wieder vor. Was passiert? Der Igel sucht Würmer und frisst sie. Frag dich nach jeder Geschichte: Wer? Und: Was passiert?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Um wen geht es in der Geschichte?"
                say: "Hör gut zu. Um wen geht es in der Geschichte?"
                audio: { de: "Ein kleiner Hase hat Hunger. Er hoppelt über die Wiese. Unter einem Busch findet er eine dicke Möhre. Der Hase knabbert sie ganz auf. Ein Hund bellt in der Ferne." }
                options: [{ object: rabbit }, { object: dog }, { object: mouse }]
                answer: rabbit
                feedback:
                  dog: "Der Hund bellt nur ganz am Ende. Wer kommt immer wieder vor?"
                hints:
                  - "Hör noch einmal. Wer kommt immer wieder vor?"
                  - "Wer hoppelt über die Wiese?"
                  - "Es geht um den Hasen."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Was findet der Hase?"
                say: "Hör noch einmal zu. Was findet der Hase?"
                audio: { de: "Ein kleiner Hase hat Hunger. Er hoppelt über die Wiese. Unter einem Busch findet er eine dicke Möhre. Der Hase knabbert sie ganz auf." }
                options: [{ object: carrot }, { object: apple }, { object: leaf }]
                answer: carrot
                hints:
                  - "Hör auf den Satz mit findet."
                  - "Er findet eine dicke ..."
                  - "Eine Möhre."
              - id: l1-f3
                type: audio_choice
                text: "Wer geht mit Lena in den Wald?"
                say: "Hör gut zu. Wer geht mit Lena in den Wald?"
                audio: { de: "Lena und ihr Opa gehen in den Wald. Sie sammeln Tannenzapfen. Plötzlich sehen sie einen Fuchs. Der Fuchs läuft schnell weg." }
                options: [{ object: grandpa }, { object: grandma }, { object: mum }]
                answer: grandpa
                hints:
                  - "Hör auf den ersten Satz."
                  - "Lena und ihr ..."
                  - "Lena geht mit Opa."
              - id: l1-f4
                type: audio_choice
                text: "Welches Tier sehen Lena und Opa?"
                say: "Hör noch einmal zu. Welches Tier sehen Lena und Opa?"
                audio: { de: "Lena und ihr Opa gehen in den Wald. Sie sammeln Tannenzapfen. Plötzlich sehen sie einen Fuchs. Der Fuchs läuft schnell weg." }
                options: [{ object: fox }, { object: hedgehog }, { object: rabbit }]
                answer: fox
                feedback:
                  hedgehog: "Im Wald gibt es oft Igel. Aber welches Tier kommt in dieser Geschichte vor?"
                hints:
                  - "Hör auf das Wort plötzlich."
                  - "Plötzlich sehen sie einen ..."
                  - "Einen Fuchs."
              - id: l1-f5
                type: image_multiple_choice
                text: "Was macht ein guter Zuhörer?"
                say: "Gleich kommt eine Geschichte. Was macht ein guter Zuhörer?"
                options: [{ object: listen }, { object: dance }, { object: clap }]
                answer: listen
                option_audio: false
                hints:
                  - "Beim Zuhören bist du still."
                  - "Welches Kind hält die Hand ans Ohr?"
                  - "Das Kind, das zuhört."
              - id: l1-f6
                type: audio_choice
                text: "Wo spielt die Geschichte?"
                say: "Hör gut zu. Wo spielt die Geschichte?"
                audio: { de: "Tim und Ida sind im Schwimmbad. Tim springt ins Wasser. Ida schwimmt schon eine ganze Bahn." }
                options: [{ object: swim }, { object: tree }, { object: house }]
                answer: swim
                hints:
                  - "Hör auf den ersten Satz. Wo sind Tim und Ida?"
                  - "Sie sind im Schwimmbad. Was macht man da?"
                  - "Tippe auf das Kind im Wasser."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Um wen geht es in der Geschichte?"
                say: "Hör gut zu. Um wen geht es in der Geschichte?"
                audio: { de: "Die Kuh Berta steht auf der Weide. Sie frisst Gras, den ganzen Tag. Am Abend geht Berta in den Stall. Auf dem Dach sitzt eine Katze." }
                options: [{ object: cow }, { object: cat }, { object: pig }]
                answer: cow
                hints: ["Wer kommt immer wieder vor?"]
              - id: l1-s2
                type: audio_choice
                text: "Wer kommt in der Geschichte vor?"
                say: "Hör gut zu. Wer kommt in der Geschichte vor?"
                audio: { de: "Mama und Noah backen Kekse. Noah rührt den Teig. Mama schiebt das Blech in den Ofen. Bald riecht die ganze Küche nach Keksen." }
                options: [{ object: mum }, { object: dad }, { object: grandma }]
                answer: mum
                hints: ["Hör auf den ersten Satz. Wer backt mit Noah?"]
              - id: l1-s3
                type: true_false
                text: "Kommt eine Ente vor?"
                say: "Hör gut zu. Kommt in der Geschichte eine Ente vor?"
                audio: { de: "Die Ente Frida schwimmt auf dem See. Ein Junge wirft ihr Brot zu. Frida schnappt es sich." }
                answer: true
                hints: ["Wer schwimmt auf dem See?"]
              - id: l1-s4
                type: audio_choice
                text: "Wo spielt die Geschichte?"
                say: "Hör gut zu. Wo spielt die Geschichte?"
                audio: { de: "Es ist Nacht. Jakob liegt in seinem Bett. Er kann nicht schlafen. Er zählt die Sterne vor dem Fenster." }
                options: [{ object: bed }, { object: bus }, { object: table }]
                answer: bed
                hints: ["Wo liegt Jakob?"]
              - id: l1-s5
                type: speak
                text: "Wer kommt in der Geschichte vor?"
                say: "Hör zu. Lina und ihr Hund Bruno spielen im Park. Bruno holt den Ball. Jetzt du: Sag, wer in der Geschichte vorkommt."
                expected_text: "In der Geschichte kommen Lina und ihr Hund Bruno vor."
                hints: ["Fang so an: In der Geschichte kommen ... vor."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Um wen geht es in der Geschichte?"
                say: "Hör gut zu. Um wen geht es in der Geschichte?"
                audio: { de: "Ein Frosch sitzt am Teich. Er will ganz hoch springen. Er springt und springt, jeden Tag ein bisschen höher. Ein Vogel fliegt über ihn hinweg." }
                options: [{ object: frog }, { object: bird }, { object: fish }]
                answer: frog
              - id: l1-n2
                type: audio_choice
                text: "Was bekommt Ella zum Geburtstag?"
                say: "Hör gut zu. Was bekommt Ella zum Geburtstag?"
                audio: { de: "Ella hat Geburtstag. Oma kommt zu Besuch. Sie bringt ein Paket mit. Darin ist ein rotes Fahrrad. Ella jubelt." }
                options: [{ object: bike }, { object: ball }, { object: book }]
                answer: bike
              - id: l1-n3
                type: audio_choice
                text: "Welches Tier füttern die Kinder?"
                say: "Hör gut zu. Welches Tier füttern die Kinder auf dem Bauernhof?"
                audio: { de: "Die Kinder der Klasse 1a machen einen Ausflug. Sie fahren mit dem Bus auf einen Bauernhof. Dort füttern sie Schweine und Kühe." }
                options: [{ object: cow }, { object: whale }, { object: lion }]
                answer: cow
              - id: l1-n4
                type: true_false
                text: "Geht Mila mit Mama zum Bäcker?"
                say: "Hör gut zu. Geht Mila mit Mama zum Bäcker?"
                audio: { de: "Papa und Mila gehen zum Bäcker. Sie kaufen sechs Brötchen." }
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                text: "Was macht ein guter Zuhörer?"
                say: "Jemand liest dir eine Geschichte vor. Was machst du?"
                options: [{ object: quiet }, { object: sing }, { object: jump }]
                answer: quiet
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Um wen geht es in der Geschichte?"
            say: "Hör gut zu. Um wen geht es in der Geschichte?"
            audio: { de: "Ein Affe wohnt im Urwald. Er klettert auf eine hohe Palme. Oben pflückt er eine Banane. Unten am Fluss liegt ein Krokodil." }
            options: [{ object: monkey }, { object: crocodile }, { object: elephant }]
            answer: monkey
          - id: l1-c2
            type: audio_choice
            text: "Was trinkt Paul?"
            say: "Hör gut zu. Was trinkt Paul?"
            audio: { de: "Paul kommt vom Fußball. Er ist durstig. Er trinkt ein großes Glas Saft." }
            options: [{ object: juice }, { object: milk }, { object: water }]
            answer: juice
          - id: l1-c3
            type: true_false
            text: "Malt Sara einen Mond?"
            say: "Hör gut zu. Malt Sara einen Mond?"
            audio: { de: "Sara malt ein Bild. Sie malt eine große gelbe Sonne." }
            answer: false

  - n: 2
    title: { de: "Was passiert?", en: "What happens?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Um wen geht es in der Geschichte?"
            say: "Hör gut zu. Um wen geht es in der Geschichte?"
            audio: { de: "Eine kleine Ziege hat sich verlaufen. Sie meckert ganz laut. Endlich findet sie ihre Mama wieder." }
            options: [{ object: goat }, { object: cow }, { object: pig }]
            answer: goat
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Was macht ein guter Zuhörer?"
            say: "Was macht ein guter Zuhörer? Tippe auf das Bild."
            options: [{ object: look }, { object: play-football }, { object: dance }]
            answer: look
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Hör zu."
            say: "Hör zu. Die Katze Minka liegt in der Sonne. Da kommt eine kleine Maus vorbei. Minka macht ein Auge auf. Dann gähnt sie und schläft einfach weiter. Die Maus läuft schnell nach Hause."
            show: { objects: [cat, mouse] }
          - text: "Was passiert?"
            say: "Was passiert in der Geschichte? Viele denken: Die Katze fängt die Maus. Aber das passiert hier nicht. Minka schläft weiter. Antworte immer mit dem, was du gehört hast."
          - text: "zuerst\ndann\nzum Schluss"
            say: "Merk dir auch die Reihenfolge. Zuerst liegt Minka in der Sonne. Dann kommt die Maus. Zum Schluss schläft Minka weiter, und die Maus läuft nach Hause."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Leg die Bilder in die Reihenfolge der Geschichte."
                say: "Hör gut zu. Tom hat Hunger. Zuerst isst er einen Apfel. Dann isst er eine Banane. Zum Schluss trinkt er ein Glas Milch. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: milk }, { object: apple }, { object: banana }]
                slot_count: 3
                answer: [apple, banana, milk]
                hints:
                  - "Hör noch einmal. Was kommt nach zuerst?"
                  - "Zuerst der Apfel. Was isst Tom dann?"
                  - "Apfel, Banane, zum Schluss die Milch."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was passiert mit dem Igel?"
                say: "Hör gut zu. Es ist Winter. Alle Igel schlafen. Nur ein kleiner Igel ist wach. Er will den Schnee sehen. Er läuft hinaus und staunt. Was passiert mit dem kleinen Igel?"
                options: ["Er sieht sich den Schnee an.", "Er schläft den ganzen Winter.", "Er sucht Äpfel."]
                answer: "Er sieht sich den Schnee an."
                feedback:
                  "Er schläft den ganzen Winter.": "Die anderen Igel schlafen. Aber was macht dieser kleine Igel?"
                hints:
                  - "Hör auf das Wort nur. Nur ein kleiner Igel ist ..."
                  - "Der kleine Igel ist wach. Was will er sehen?"
                  - "Er sieht sich den Schnee an."
              - id: l2-f3
                type: image_multiple_choice
                text: "Wie fühlt sich Malik am Ende?"
                say: "Hör gut zu. Malik sucht seinen Teddy. Er sucht unter dem Bett und im Schrank. Er ist traurig. Da findet er den Teddy im Wäschekorb. Wie fühlt sich Malik am Ende?"
                options: [{ object: happy }, { object: sad }, { object: angry }]
                answer: happy
                option_audio: false
                feedback:
                  sad: "In der Mitte ist Malik traurig. Aber was passiert am Ende?"
                hints:
                  - "Hör auf das Ende der Geschichte."
                  - "Malik findet seinen Teddy. Wie geht es ihm dann?"
                  - "Malik freut sich."
              - id: l2-f4
                type: audio_choice
                text: "Welches Tier kommt im Gedicht vor?"
                say: "Hör dir das Gedicht an. Welches Tier kommt darin vor?"
                audio: { de: "Die Schnecke hat ein Haus. Sie kommt nur langsam raus. Sie kriecht durchs nasse Gras und hat dabei viel Spaß." }
                options: [{ object: snail }, { object: mouse }, { object: frog }]
                answer: snail
                hints:
                  - "Hör auf die erste Zeile."
                  - "Welches Tier trägt ein Haus auf dem Rücken?"
                  - "Die Schnecke."
              - id: l2-f5
                type: multiple_choice
                text: "Was passiert am Ende?"
                say: "Hör gut zu. Jonas baut einen hohen Turm aus Klötzen. Seine kleine Schwester krabbelt herbei. Sie stößt an den Turm. Der Turm fällt um. Was passiert am Ende?"
                options: ["Der Turm fällt um.", "Jonas baut einen Turm.", "Die Schwester schläft."]
                answer: "Der Turm fällt um."
                hints:
                  - "Hör auf den letzten Satz."
                  - "Die Schwester stößt an den Turm. Was passiert dann?"
                  - "Der Turm fällt um."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Leg die Bilder in die Reihenfolge der Geschichte."
                say: "Hör gut zu. Am Morgen scheint die Sonne. Am Mittag kommen dicke Wolken. Am Abend regnet es. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: rain }, { object: sun }, { object: cloud }]
                slot_count: 3
                answer: [sun, cloud, rain]
                hints: ["Was ist am Morgen, was am Mittag, was am Abend?"]
              - id: l2-s2
                type: multiple_choice
                text: "Was macht der Hund?"
                say: "Hör gut zu. Der Hund Fips sieht eine Katze. Er bellt nicht. Er wedelt mit dem Schwanz und legt sich neben sie. Was macht der Hund?"
                options: ["Er legt sich neben die Katze.", "Er jagt die Katze.", "Er bellt die Katze an."]
                answer: "Er legt sich neben die Katze."
                hints: ["Hör genau: Er bellt nicht. Was macht er stattdessen?"]
              - id: l2-s3
                type: image_multiple_choice
                text: "Wie fühlt sich Hanna am Ende?"
                say: "Hör gut zu. Hanna will mitspielen. Aber die anderen Kinder sagen: Nein. Hanna setzt sich allein auf die Bank. Wie fühlt sich Hanna am Ende?"
                options: [{ object: sad }, { object: happy }, { object: tired }]
                answer: sad
                option_audio: false
                hints: ["Hanna sitzt allein. Wie geht es ihr wohl?"]
              - id: l2-s4
                type: multiple_choice
                text: "Wann spielt das Gedicht?"
                say: "Hör dir das Gedicht an. Die Sonne lacht, der Tag ist da. Die Vögel singen trallala. Ich spring aus meinem warmen Bett, der Tag wird heute sicher nett. Wann spielt das Gedicht?"
                options: ["am Morgen", "am Abend", "in der Nacht"]
                answer: "am Morgen"
                hints: ["Der Tag ist da, und das Kind springt aus dem Bett."]
              - id: l2-s5
                type: speak
                text: "Was passiert in der Geschichte?"
                say: "Hör zu. Ben verliert im Park seine Mütze. Ein Mädchen findet sie und bringt sie ihm zurück. Jetzt du: Erzähl in einem Satz, was passiert."
                expected_text: "Ben verliert seine Mütze, und ein Mädchen bringt sie ihm zurück."
                hints: ["Sag zuerst, was Ben verliert. Sag dann, wer hilft."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Leg die Bilder in die Reihenfolge der Geschichte."
                say: "Hör gut zu. Lea geht in den Garten. Zuerst pflückt sie eine Rose. Dann findet sie eine Schnecke. Zum Schluss klettert sie auf den Baum. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: tree }, { object: rose }, { object: snail }]
                slot_count: 3
                answer: [rose, snail, tree]
              - id: l2-n2
                type: multiple_choice
                text: "Was macht der Fuchs?"
                say: "Hör gut zu. Ein Fuchs schleicht zum Hühnerstall. Aber er hat keinen Hunger. Er will nur Hallo sagen. Die Hühner lachen. Was macht der Fuchs?"
                options: ["Er sagt den Hühnern Hallo.", "Er frisst ein Huhn.", "Er schläft im Stall."]
                answer: "Er sagt den Hühnern Hallo."
              - id: l2-n3
                type: image_multiple_choice
                text: "Wie fühlt sich Leon am Ende?"
                say: "Hör gut zu. Leon hat Angst vor dem Wasser. Papa hält seine Hand. Leon springt ins Becken. Er lacht und ruft: Nochmal! Wie fühlt sich Leon am Ende?"
                options: [{ object: happy }, { object: scared }, { object: sad }]
                answer: happy
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Was passiert im Gedicht mit dem Schneemann?"
                say: "Hör dir das Gedicht an. Der Schneemann steht im Garten, er muss auf Kinder warten. Doch kommt die Sonne raus, dann ist es mit ihm aus. Was passiert mit dem Schneemann?"
                options: ["Er schmilzt.", "Er spielt mit den Kindern.", "Er bekommt eine Mütze."]
                answer: "Er schmilzt."
              - id: l2-n5
                type: true_false
                text: "Fahren Oma und Lisa mit dem Auto?"
                say: "Hör gut zu. Fahren Oma und Lisa mit dem Auto?"
                audio: { de: "Oma und Lisa fahren mit dem Zug ans Meer. Dort sammeln sie Muscheln." }
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Um wen geht es in der Geschichte?"
            say: "Hör gut zu. Um wen geht es in der Geschichte?"
            audio: { de: "Ein kleiner Wal schwimmt im Meer. Er sucht seine Mama. Er ruft und ruft. Endlich hört sie ihn. Ein Fisch schwimmt vorbei." }
            options: [{ object: whale }, { object: fish }, { object: octopus }]
            answer: whale
          - id: l2-c2
            type: ordering
            text: "Leg die Bilder in die Reihenfolge der Geschichte."
            say: "Hör gut zu. Mia hat Geburtstag. Zuerst bläst sie die Kerze auf dem Kuchen aus. Dann packt sie ein Buch aus. Zum Schluss lässt sie einen Luftballon fliegen. Leg die Bilder in die richtige Reihenfolge."
            options: [{ object: balloon }, { object: cake }, { object: book }]
            slot_count: 3
            answer: [cake, book, balloon]
          - id: l2-c3
            type: multiple_choice
            text: "Was macht die Maus?"
            say: "Hör gut zu. Eine Maus sieht ein Stück Käse in der Falle. Sie schnuppert daran. Dann dreht sie um und holt sich lieber eine Nuss. Was macht die Maus?"
            options: ["Sie holt sich eine Nuss.", "Sie frisst den Käse.", "Sie schläft in der Falle."]
            answer: "Sie holt sich eine Nuss."
          - id: l2-c4
            type: image_multiple_choice
            text: "Wie fühlt sich Emil am Ende?"
            say: "Hör gut zu. Emil soll ins Bett. Er will aber noch spielen. Er stampft mit dem Fuß auf und ruft: Nein! Wie fühlt sich Emil am Ende?"
            options: [{ object: angry }, { object: happy }, { object: tired }]
            answer: angry
            option_audio: false
          - id: l2-c5
            type: audio_choice
            text: "Welches Tier kommt im Gedicht vor?"
            say: "Hör dir das Gedicht an. Welches Tier kommt darin vor?"
            audio: { de: "Die Biene summt im Sonnenschein, sie fliegt in jede Blüte rein. Sie summt so laut, sie summt so fein, dann fliegt sie in ihr Haus hinein." }
            options: [{ object: bee }, { object: butterfly }, { object: bird }]
            answer: bee
