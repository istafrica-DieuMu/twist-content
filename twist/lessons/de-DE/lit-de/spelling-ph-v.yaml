# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.spelling-ph-v
skill: lit-de.spelling.ph-v-foreign
curriculum: de-DE
language: de
title:
  de: Wörter mit v und ph
  en: Words with v and ph
summary: >
  Words where you hear f or w but write v, and words with ph. Lesson 1
  takes v as f (Vogel, viel, the prefixes ver- and vor-) and v as w in
  borrowed words (Vase, Vulkan, Klavier); lesson 2 takes ph (Alphabet,
  Strophe), words now written with f (Delfin, Telefon, Foto) and common
  borrowed words (Melone, Computer, Pizza), and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Besondere Laute, en: Special sounds }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling.special-sounds]
  also_practises: [lit-de.spelling-strategies.memory-words]
  vocabulary: { de: [Merkwort, Vorsilbe, Fremdwort, ver, vor, ph, Vogel, Vulkan, Alphabet, Strophe, Delfin] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: write-what-you-hear
      what: Writes f or w for every f or w sound (Fogel, ferlieren, Wase)
      addressed: lesson 1 Learn names v as f and v as w; every stage has a v gap or a v error to find, with feedback in l1-f2 and l1-s2
    - id: ph-everywhere
      what: Writes ph in words that now take f (Elephant, Telephon) or f where ph belongs (Alfabet)
      addressed: lesson 2 Learn sets ph words beside f words; every stage of lesson 2 asks ph or f, with feedback in l2-f1 and l2-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Vogel und Vase", en: "Vogel and Vase" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welche Buchstaben fehlen?"
            say: "Der Fuchs schläft. Welche Buchstaben fehlen?"
            frame: "Der Fu_ schläft."
            options: ["chs", "x", "ks"]
            answer: ["chs"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Wir essen Quark mit Erdbeeren. Welches Wort ist richtig geschrieben?"
            options: ["Quark", "Kwark", "Kuark"]
            answer: "Quark"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Vogel · Vater · viel · vier · voll"
            say: "Bei diesen Wörtern hörst du ein f, aber du schreibst ein v. Das sind Merkwörter. Präge sie dir gut ein."
          - text: "ver: verlieren, vergessen\nvor: vorlesen, vorbei"
            say: "Die Vorsilben ver und vor schreibst du immer mit v. So weißt du es bei vielen Wörtern auf einmal: verlieren, vergessen, vorlesen, vorbei."
          - text: "Vase · Vulkan · Klavier · Video"
            say: "In Wörtern aus anderen Sprachen klingt das v oft wie ein w. Du hörst Wase, aber du schreibst Vase. Auch diese Wörter merkst du dir."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Der Vogel singt im Baum. Welcher Buchstabe fehlt?"
                frame: "Der _ogel singt im Baum."
                options: ["V", "F", "W"]
                answer: ["V"]
                hints:
                  - "Du hörst ein f. Ist Vogel ein Merkwort?"
                  - "Vogel steht in der Reihe mit Vater, viel und vier."
                  - "Vogel schreibt man mit V."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ich habe meinen Schlüssel _. Welches Wort ist richtig geschrieben?"
                say: "Ich habe meinen Schlüssel verloren. Welches Wort ist richtig geschrieben?"
                options: ["verloren", "ferloren", "werloren"]
                answer: "verloren"
                option_audio: false
                feedback:
                  "ferloren": "Du hörst ein f. Aber ver ist eine Vorsilbe, und die schreibst du immer mit v."
                hints:
                  - "Steckt in dem Wort eine Vorsilbe?"
                  - "Verloren beginnt mit der Vorsilbe ver."
                  - "verloren, mit v."
              - id: l1-f3
                type: sorting
                text: "Wie klingt das v?"
                say: "Sortiere die Wörter. Klingt das v wie ein f oder wie ein w?"
                bins:
                  - { id: f, show: { text: "v klingt wie f" }, say: "v klingt wie f" }
                  - { id: w, show: { text: "v klingt wie w" }, say: "v klingt wie w" }
                options:
                  - { text: "Vater", bin: f }
                  - { text: "Vase", bin: w }
                  - { text: "viel", bin: f }
                  - { text: "Vulkan", bin: w }
                hints:
                  - "Sprich jedes Wort leise vor dich hin."
                  - "Vater klingt wie Fater, Vase klingt wie Wase."
                  - "Vater und viel: f. Vase und Vulkan: w."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Der Berg spuckt Feuer und Lava. Ist das Wort für den Berg richtig geschrieben?"
                show: { drawn: letter-card, text: "Wulkan" }
                answer: false
                hints:
                  - "Du hörst ein w. Kommt das Wort aus einer anderen Sprache?"
                  - "Denk an Vase und Klavier."
                  - "Nein. Richtig ist Vulkan, mit V."
              - id: l1-f5
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Mein Fater spielt jeden Abend Klavier." }
                spans: ["Fater"]
                hints:
                  - "Achte auf die Wörter, in denen du ein f oder ein w hörst."
                  - "Vater gehört zu den Merkwörtern mit v."
                  - "Fater ist falsch. Richtig ist Vater."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Oma liest uns eine Geschichte vor. Welcher Buchstabe fehlt?"
                frame: "Oma liest uns eine Geschichte _or."
                options: ["v", "f", "w"]
                answer: ["v"]
                hints: ["Vor ist eine Vorsilbe, wie in vorlesen."]
              - id: l1-s2
                type: multiple_choice
                text: "Die Blumen stehen in einer _. Welches Wort ist richtig geschrieben?"
                say: "Die Blumen stehen in einer Vase. Welches Wort ist richtig geschrieben?"
                options: ["Vase", "Wase", "Fase"]
                answer: "Vase"
                option_audio: false
                feedback:
                  "Wase": "Du hörst ein w, aber Vase kommt aus einer anderen Sprache und wird mit V geschrieben."
                hints: ["Das Wort kommt aus einer anderen Sprache, wie Vulkan."]
              - id: l1-s3
                type: sorting
                text: "Wie klingt das v?"
                say: "Sortiere die Wörter. Klingt das v wie ein f oder wie ein w?"
                bins:
                  - { id: f, show: { text: "v klingt wie f" }, say: "v klingt wie f" }
                  - { id: w, show: { text: "v klingt wie w" }, say: "v klingt wie w" }
                options:
                  - { text: "Vogel", bin: f }
                  - { text: "Video", bin: w }
                  - { text: "vier", bin: f }
                  - { text: "Klavier", bin: w }
                hints: ["Sprich jedes Wort leise vor dich hin."]
              - id: l1-s4
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Wir haben fiele Bücher im Regal." }
                answer: false
                hints: ["Achte auf das Wort viele."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Lena hat ihre Jacke in der Schule fergessen." }
                spans: ["fergessen"]
                hints: ["Welches Wort beginnt mit einer Vorsilbe?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Im Vulkan brodelt heiße Lava. Welcher Buchstabe fehlt?"
                frame: "Im _ulkan brodelt heiße Lava."
                options: ["V", "W", "F"]
                answer: ["V"]
              - id: l1-n2
                type: multiple_choice
                text: "Im Winter trage ich einen warmen _. Welches Wort ist richtig geschrieben?"
                say: "Im Winter trage ich einen warmen Pullover. Welches Wort ist richtig geschrieben?"
                options: ["Pullover", "Pullower", "Pullofer"]
                answer: "Pullover"
                option_audio: false
              - id: l1-n3
                type: sorting
                text: "Wie klingt das v?"
                say: "Sortiere die Wörter. Klingt das v wie ein f oder wie ein w?"
                bins:
                  - { id: f, show: { text: "v klingt wie f" }, say: "v klingt wie f" }
                  - { id: w, show: { text: "v klingt wie w" }, say: "v klingt wie w" }
                options:
                  - { text: "voll", bin: f }
                  - { text: "Vanille", bin: w }
                  - { text: "vorbei", bin: f }
                  - { text: "November", bin: w }
              - id: l1-n4
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Der Vogel baut ein Nest auf dem Dach." }
                answer: true
              - id: l1-n5
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Wir ferstecken uns hinter dem großen Baum." }
                spans: ["ferstecken"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Vier Kinder spielen Fußball. Welcher Buchstabe fehlt?"
            frame: "_ier Kinder spielen Fußball."
            options: ["V", "F", "W"]
            answer: ["V"]
          - id: l1-c2
            type: multiple_choice
            text: "Wir schauen ein _ über Wale. Welches Wort ist richtig geschrieben?"
            say: "Wir schauen ein Video über Wale. Welches Wort ist richtig geschrieben?"
            options: ["Video", "Wideo", "Fideo"]
            answer: "Video"
            option_audio: false
          - id: l1-c3
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Papa ferliert beim Spielen nie." }
            spans: ["ferliert"]

  - n: 2
    title: { de: "Alphabet und Delfin", en: "Alphabet and Delfin" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Das Glas ist voll. Welcher Buchstabe fehlt?"
            frame: "Das Glas ist _oll."
            options: ["v", "f", "w"]
            answer: ["v"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Lisa spielt Klavier. Welches Wort ist richtig geschrieben?"
            options: ["Klavier", "Klawier", "Klafier"]
            answer: "Klavier"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Alphabet · Strophe · Physik · Katastrophe"
            say: "In manchen Wörtern aus dem Griechischen schreibst du ph und sprichst f. Diese Wörter musst du dir merken."
          - text: "Telefon · Elefant · Delfin · Foto"
            say: "Viele Wörter schreibt man heute mit f, obwohl sie früher mit ph geschrieben wurden. Telefon und Elefant schreibst du nur mit f. Auch Delfin und Foto schreibst du am besten mit f."
          - text: "Melone · Computer · Pizza · Theater"
            say: "Auch andere Fremdwörter schreibt man nicht so, wie man sie hört: Computer mit C, Pizza mit zz, Theater mit th. Schlag nach, wenn du unsicher bist, und übe die Wörter."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Kannst du das _ aufsagen? Welches Wort ist richtig geschrieben?"
                say: "Kannst du das Alphabet aufsagen? Welches Wort ist richtig geschrieben?"
                options: ["Alphabet", "Alfabet", "Alpabet"]
                answer: "Alphabet"
                option_audio: false
                feedback:
                  "Alfabet": "Du hörst ein f. Alphabet ist aber ein griechisches Wort mit ph."
                hints:
                  - "Das Wort kommt aus dem Griechischen."
                  - "Im Griechischen wird das f oft als ph geschrieben."
                  - "Alphabet, mit ph."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welche Buchstaben fehlen?"
                say: "Das Gedicht hat drei Strophen. Welche Buchstaben fehlen?"
                frame: "Das Gedicht hat drei Stro_en."
                options: ["ph", "f", "ff"]
                answer: ["ph"]
                hints:
                  - "Strophe ist ein Wort aus dem Griechischen."
                  - "Es steht in der Reihe mit Alphabet und Physik."
                  - "Strophen, mit ph."
              - id: l2-f3
                type: sorting
                text: "ph oder f?"
                say: "Sortiere die Wörter. Schreibt man sie mit ph oder mit f?"
                bins:
                  - { id: ph, show: { text: "mit ph" }, say: "mit ph" }
                  - { id: f, show: { text: "mit f" }, say: "mit f" }
                options:
                  - { text: "Al_abet", bin: ph }
                  - { text: "Ele_ant", bin: f }
                  - { text: "Stro_e", bin: ph }
                  - { text: "Tele_on", bin: f }
                option_audio: false
                hints:
                  - "Du hörst überall f. Welche Wörter schreibt man trotzdem mit ph?"
                  - "Elefant und Telefon schreibt man heute mit f."
                  - "Alphabet und Strophe: ph. Elefant und Telefon: f."
              - id: l2-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Im Zoo sehen wir einen großen grauen Elefanten. Ist das Wort richtig geschrieben?"
                show: { drawn: letter-card, text: "Elephant" }
                answer: false
                hints:
                  - "Steht Elefant in der Reihe mit Alphabet oder mit Delfin?"
                  - "Elefant schreibt man im Deutschen mit f."
                  - "Nein. Richtig ist Elefant."
              - id: l2-f5
                type: multiple_choice
                text: "Im Sommer essen wir eine süße _. Welches Wort ist richtig geschrieben?"
                say: "Im Sommer essen wir eine süße Melone. Welches Wort ist richtig geschrieben?"
                options: ["Melone", "Mellone", "Mehlone"]
                answer: "Melone"
                option_audio: false
                hints:
                  - "Melone ist ein Fremdwort. Sprich es in Silben: Me, lo, ne."
                  - "Bei Fremdwörtern helfen die Regeln für doppelte Mitlaute und das h oft nicht. Du merkst sie dir."
                  - "Melone, mit einem l und ohne h."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Der Elefant hebt seinen Rüssel. Welcher Buchstabe fehlt?"
                frame: "Der Ele_ant hebt seinen Rüssel."
                options: ["f", "ph", "v"]
                answer: ["f"]
                hints: ["Elefant steht in der Reihe mit Telefon."]
              - id: l2-s2
                type: multiple_choice
                text: "In _ machen wir Versuche mit Magneten. Welches Wort ist richtig geschrieben?"
                say: "In Physik machen wir Versuche mit Magneten. Welches Wort ist richtig geschrieben?"
                options: ["Physik", "Fysik", "Phisik"]
                answer: "Physik"
                option_audio: false
                hints: ["Physik ist griechisch: ph am Anfang und ein y in der Mitte."]
              - id: l2-s3
                type: sorting
                text: "ph oder f?"
                say: "Sortiere die Wörter. Schreibt man sie mit ph oder mit f?"
                bins:
                  - { id: ph, show: { text: "mit ph" }, say: "mit ph" }
                  - { id: f, show: { text: "mit f" }, say: "mit f" }
                options:
                  - { text: "_ysik", bin: ph }
                  - { text: "Tele_on", bin: f }
                  - { text: "Katastro_e", bin: ph }
                  - { text: "Ele_ant", bin: f }
                option_audio: false
                hints: ["Telefon und Elefant schreibt man heute mit f."]
              - id: l2-s4
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Ich spiele am Kompjuter." }
                answer: false
                hints: ["Computer kommt aus dem Englischen und behält seine Schreibung."]
              - id: l2-s5
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Am Abend essen wir eine Pitza mit Käse." }
                spans: ["Pitza"]
                hints: ["Pizza kommt aus dem Italienischen."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Oma ruft am Telefon an. Welcher Buchstabe fehlt?"
                frame: "Oma ruft am Tele_on an."
                options: ["f", "ph", "v"]
                answer: ["f"]
              - id: l2-n2
                type: multiple_choice
                text: "Der Sturm war eine _ für das Dorf. Welches Wort ist richtig geschrieben?"
                say: "Der Sturm war eine Katastrophe für das Dorf. Welches Wort ist richtig geschrieben?"
                options: ["Katastrophe", "Katastrofe", "Kathastrophe"]
                answer: "Katastrophe"
                option_audio: false
              - id: l2-n3
                type: sorting
                text: "ph oder f?"
                say: "Sortiere die Wörter. Schreibt man sie mit ph oder mit f?"
                bins:
                  - { id: ph, show: { text: "mit ph" }, say: "mit ph" }
                  - { id: f, show: { text: "mit f" }, say: "mit f" }
                options:
                  - { text: "Stro_e", bin: ph }
                  - { text: "Tele_on", bin: f }
                  - { text: "_ysik", bin: ph }
                  - { text: "Ele_ant", bin: f }
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Wir gehen heute Abend ins Theater." }
                answer: true
              - id: l2-n5
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Das Telephon klingelt im Flur." }
                spans: ["Telephon"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Im Zoo füttert der Pfleger die _. Welches Wort ist richtig geschrieben?"
            say: "Im Zoo füttert der Pfleger die Elefanten. Welches Wort ist richtig geschrieben?"
            options: ["Elefanten", "Elephanten", "Elevanten"]
            answer: "Elefanten"
            option_audio: false
          - id: l2-c2
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Mein Vater kocht heute. Welcher Buchstabe fehlt?"
            frame: "Mein _ater kocht heute."
            options: ["V", "F", "W"]
            answer: ["V"]
          - id: l2-c3
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Auf der Insel gibt es einen hohen Wulkan." }
            spans: ["Wulkan"]
          - id: l2-c4
            type: sorting
            text: "Welche Wörter schreibt man mit ph?"
            say: "Welche Wörter schreibt man mit ph, welche mit f? Ordne sie zu."
            bins:
              - { id: ph, show: { text: "mit ph" }, say: "mit ph" }
              - { id: f, show: { text: "mit f" }, say: "mit f" }
            options:
              - { text: "Al_abet", bin: ph }
              - { text: "Ele_ant", bin: f }
              - { text: "Katastro_e", bin: ph }
              - { text: "Tele_on", bin: f }
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Ich _ dir ein Geheimnis. Welches Wort ist richtig geschrieben?"
            say: "Ich verrate dir ein Geheimnis. Welches Wort ist richtig geschrieben?"
            options: ["verrate", "ferrate", "werrate"]
            answer: "verrate"
            option_audio: false
