# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.writing-purpose
skill: lit-de.writing.purpose
curriculum: de-DE
language: de
title:
  de: Für wen und wozu schreibe ich?
  en: Who am I writing for, and why?
summary: >
  Deciding the reader and the purpose before writing, and choosing the kind
  of text that fits. Lesson 1 names who a text is for and what it should
  do (einladen, informieren, erklären, unterhalten, sich bedanken); lesson
  2 matches a writing task to its Textart and fits the words to the reader
  (du or Sie, the right greeting), and ends with the skill check. Writing
  the text itself waits for the write_text task type.
metadata:
  year: klasse-3
  topic: { de: Texte planen, en: Planning writing }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.writing.plan, lit-de.texts-media.text-types]
  also_practises: [lit-de.texts-media.text-types, lit-de.writing.letters-emails]
  vocabulary: { de: [Leser, Empfänger, Zweck, Textart, Einladung, Brief, Anleitung, Steckbrief, Plakat, Anrede] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: one-style-for-all
      what: Writes to the head teacher in the same way as to a friend
      addressed: "lesson 2 Learn compares du and Sie; l2-f3, l2-s3, l2-n3 and l2-c3 choose the greeting or the sentence that fits the reader, with feedback on l2-f3"
    - id: text-type-by-topic
      what: Picks the Textart by the topic (a party, an animal) instead of by what the text has to do
      addressed: "lesson 1 asks for the purpose before the Textart (l1-f1, l1-s1, l1-n1); lesson 2 matches tasks to Textarten where the topic is the same but the purpose differs (l2-f1, l2-s2, l2-n1)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Leser und Zweck", en: "Reader and purpose" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Zuerst den Teig rühren. Dann in die Form füllen. Zum Schluss 30 Minuten backen.\n\nWas für ein Text ist das?"
            say: "Lies den Text. Was für ein Text ist das?"
            options: ["eine Anleitung", "ein Gedicht", "ein Märchen"]
            answer: "eine Anleitung"
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Du planst einen Text. Was machst du in welcher Reihenfolge?"
            say: "Du planst einen Text. Leg die Schritte in die richtige Reihenfolge."
            options: ["den Text schreiben", "Ideen sammeln", "die Ideen ordnen"]
            slot_count: 3
            answer: ["Ideen sammeln", "die Ideen ordnen", "den Text schreiben"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Für wen schreibe ich? | Wozu schreibe ich?"
            say: "Bevor du schreibst, stellst du dir zwei Fragen. Für wen schreibe ich? Und: Wozu schreibe ich? Was soll mein Text bewirken?"
          - text: "einladen | informieren | erklären | unterhalten | sich bedanken | um etwas bitten | sich entschuldigen"
            say: "Ein Text kann zu einem Fest einladen, über etwas informieren, erklären, wie etwas geht, unterhalten, Danke sagen, um etwas bitten oder sich entschuldigen."
          - text: "Lina schreibt an Oma: Danke für das Buch!\nLeserin: Oma | Zweck: sich bedanken"
            say: "Lina schreibt ihrer Oma, weil sie ein Buch geschenkt bekommen hat. Die Leserin ist Oma. Der Zweck ist: sich bedanken."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ben feiert am Samstag Geburtstag. Er schreibt seinen Freunden. Wozu schreibt er?"
                say: "Ben feiert am Samstag Geburtstag und schreibt seinen Freunden. Wozu schreibt er?"
                options: ["um sie einzuladen", "um sich zu bedanken", "um etwas zu erklären"]
                answer: "um sie einzuladen"
                feedback:
                  "um sich zu bedanken": "Danke sagt man nach dem Fest. Jetzt sollen die Freunde erst kommen."
                hints:
                  - "Das Fest ist noch nicht vorbei."
                  - "Was sollen die Freunde tun?"
                  - "Er schreibt, um sie einzuladen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Die Klasse 3c schreibt ein Plakat für den Schulflur: „Unser Flohmarkt am Freitag“. Für wen ist das Plakat?"
                say: "Die Klasse drei c schreibt ein Plakat für den Schulflur. Für wen ist es?"
                options: ["für alle Kinder und Eltern der Schule", "nur für die Lehrerin", "für die Klasse 3c selbst"]
                answer: "für alle Kinder und Eltern der Schule"
                hints:
                  - "Wo hängt das Plakat?"
                  - "Wer läuft durch den Schulflur?"
                  - "für alle Kinder und Eltern der Schule."
              - id: l1-f3
                type: multiple_choice
                text: "Mia schreibt auf, wie man ein Papierflugzeug faltet. Ihr kleiner Bruder soll es nachmachen. Wozu schreibt sie?"
                say: "Mia schreibt auf, wie man ein Papierflugzeug faltet. Ihr kleiner Bruder soll es nachmachen. Wozu schreibt sie?"
                options: ["um etwas zu erklären", "um zu unterhalten", "um einzuladen"]
                answer: "um etwas zu erklären"
                hints:
                  - "Der Bruder soll etwas nachmachen."
                  - "Mia beschreibt Schritt für Schritt."
                  - "Sie schreibt, um etwas zu erklären."
              - id: l1-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden Text mit seinem Zweck."
                pairs:
                  - { left: { text: "Danke für das tolle Geschenk!" }, right: { text: "sich bedanken" } }
                  - { left: { text: "Komm am Sonntag zu meinem Fest!" }, right: { text: "einladen" } }
                  - { left: { text: "Igel halten Winterschlaf." }, right: { text: "informieren" } }
                hints:
                  - "Lies jeden Text. Was will er?"
                  - "Ein Fest: einladen. Ein Geschenk: Danke."
                  - "Danke: sich bedanken. Fest: einladen. Igel: informieren."
              - id: l1-f5
                type: true_false
                text: "Jonas schreibt eine lustige Geschichte für die Klassenzeitung. Will er seine Leser unterhalten?"
                say: "Jonas schreibt eine lustige Geschichte für die Klassenzeitung. Will er seine Leser unterhalten?"
                answer: true
                hints:
                  - "Was soll eine lustige Geschichte bewirken?"
                  - "Die Leser sollen Spaß haben."
                  - "Ja, er will unterhalten."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Lea möchte, dass ihr Nachbar ihre Blumen gießt, während sie im Urlaub ist. Wozu schreibt sie ihm?"
                say: "Lea möchte, dass ihr Nachbar die Blumen gießt, während sie im Urlaub ist. Wozu schreibt sie ihm?"
                options: ["um ihn um etwas zu bitten", "um ihn zu unterhalten", "um sich zu bedanken"]
                answer: "um ihn um etwas zu bitten"
                hints: ["Was soll der Nachbar tun?"]
              - id: l1-s2
                type: multiple_choice
                text: "Herr Schmidt schreibt einen Elternbrief: Der Ausflug ist am Dienstag. Für wen ist der Brief?"
                say: "Herr Schmidt schreibt einen Elternbrief über den Ausflug. Für wen ist der Brief?"
                options: ["für die Eltern", "für die Kinder einer anderen Schule", "für Herrn Schmidt"]
                answer: "für die Eltern"
                hints: ["Das Wort steckt schon im Namen des Briefs."]
              - id: l1-s3
                type: multiple_choice
                text: "Ole schreibt für die Klasse einen Text: „Was Hamster fressen und wie man sie pflegt“. Wozu schreibt er?"
                say: "Ole schreibt für die Klasse einen Text darüber, was Hamster fressen und wie man sie pflegt. Wozu schreibt er?"
                options: ["um zu informieren", "um einzuladen", "um sich zu entschuldigen"]
                answer: "um zu informieren"
                hints: ["Die Klasse soll etwas erfahren."]
              - id: l1-s4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden Text mit seinem Zweck."
                pairs:
                  - { left: { text: "Es tut mir leid, dass ich dein Rad kaputt gemacht habe." }, right: { text: "sich entschuldigen" } }
                  - { left: { text: "Kannst du mir bitte dein Lineal leihen?" }, right: { text: "um etwas bitten" } }
                  - { left: { text: "Ein Witz: Was ist grün und hüpft? Ein Frosch!" }, right: { text: "unterhalten" } }
                hints: ["Was will jeder Text erreichen?"]
              - id: l1-s5
                type: true_false
                text: "Bevor du schreibst, überlegst du, wer deinen Text lesen soll. Ist das wichtig?"
                say: "Bevor du schreibst, überlegst du, wer deinen Text lesen soll. Ist das wichtig?"
                answer: true
                hints: ["An Oma schreibst du anders als an die Zeitung."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Pia hat von Tante Rosa Geld zum Geburtstag bekommen. Sie schreibt ihr eine Karte. Wozu?"
                say: "Pia hat von Tante Rosa Geld zum Geburtstag bekommen und schreibt ihr eine Karte. Wozu?"
                options: ["um sich zu bedanken", "um sie einzuladen", "um ihr etwas zu erklären"]
                answer: "um sich zu bedanken"
              - id: l1-n2
                type: multiple_choice
                text: "Die Schülerzeitung bekommt einen Bericht über das Sportfest. Für wen ist der Bericht?"
                say: "Die Schülerzeitung bekommt einen Bericht über das Sportfest. Für wen ist der Bericht?"
                options: ["für alle, die die Schülerzeitung lesen", "nur für den Sieger", "für niemanden"]
                answer: "für alle, die die Schülerzeitung lesen"
              - id: l1-n3
                type: multiple_choice
                text: "Can schreibt eine spannende Gruselgeschichte für seine Freunde. Wozu schreibt er?"
                say: "Can schreibt eine spannende Gruselgeschichte für seine Freunde. Wozu schreibt er?"
                options: ["um zu unterhalten", "um zu informieren", "um sich zu bedanken"]
                answer: "um zu unterhalten"
              - id: l1-n4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden Text mit seinem Zweck."
                pairs:
                  - { left: { text: "So pflanzt du eine Sonnenblume: ..." }, right: { text: "erklären" } }
                  - { left: { text: "Unser Sommerfest beginnt um 15 Uhr. Kommt alle!" }, right: { text: "einladen" } }
                  - { left: { text: "Vielen Dank für deine Hilfe beim Umzug!" }, right: { text: "sich bedanken" } }
              - id: l1-n5
                type: true_false
                text: "Max schreibt der Bürgermeisterin, weil der Spielplatz kaputt ist. Will er sie unterhalten?"
                say: "Max schreibt der Bürgermeisterin, weil der Spielplatz kaputt ist. Will er sie unterhalten?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Sara hat aus Versehen Tims Brotdose kaputt gemacht. Sie schreibt ihm einen Zettel. Wozu?"
            say: "Sara hat aus Versehen Tims Brotdose kaputt gemacht und schreibt ihm einen Zettel. Wozu?"
            options: ["um sich zu entschuldigen", "um ihn einzuladen", "um ihn zu informieren, wie Igel leben"]
            answer: "um sich zu entschuldigen"
          - id: l1-c2
            type: multiple_choice
            text: "Ein Zettel an der Haustür: „Bitte nicht klingeln, das Baby schläft!“ Für wen ist er?"
            say: "Ein Zettel hängt an der Haustür: Bitte nicht klingeln, das Baby schläft. Für wen ist er?"
            options: ["für alle, die an die Tür kommen", "für das Baby", "für die Nachbarn im Urlaub"]
            answer: "für alle, die an die Tür kommen"
          - id: l1-c3
            type: true_false
            text: "Ein Text über das Leben der Bienen soll informieren. Stimmt das?"
            say: "Ein Text über das Leben der Bienen soll informieren. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Die passende Textart", en: "The right kind of text" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Emil schreibt seiner Freundin, dass sie zu seinem Fest kommen soll. Wozu schreibt er?"
            say: "Emil schreibt seiner Freundin, dass sie zu seinem Fest kommen soll. Wozu schreibt er?"
            options: ["um sie einzuladen", "um sich zu bedanken", "um zu informieren, wie Hamster leben"]
            answer: "um sie einzuladen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein Witz soll die Leser unterhalten. Stimmt das?"
            say: "Ein Witz soll die Leser unterhalten. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "einladen → Einladung | erklären → Anleitung | informieren → Sachtext | sich vorstellen → Steckbrief | etwas ankündigen → Plakat | Neuigkeiten erzählen → Brief oder E-Mail"
            say: "Für jeden Zweck gibt es eine passende Textart. Wer einlädt, schreibt eine Einladung. Wer erklärt, wie etwas geht, schreibt eine Anleitung. Wer über eine Sache informiert, schreibt einen Sachtext."
          - text: "Einladung: Wer? Was? Wann? Wo?"
            say: "Jede Textart hat ihre Teile. In eine Einladung gehört: wer einlädt, wozu, wann und wo."
          - text: "Liebe Lea, ... | Sehr geehrte Frau Berg, ..."
            say: "Auch die Wörter passen zum Leser. Freunden schreibst du Liebe Lea und du. Erwachsenen, die du gut kennst, wie deiner Lehrerin, schreibst du Liebe Frau Sommer und Sie. Erwachsenen, die du nicht gut kennst, schreibst du Sehr geehrte Frau Berg und Sie."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Die Klasse will allen in der Schule sagen: Am Freitag ist Kuchenverkauf in der Pause. Welche Textart passt am besten?"
                say: "Die Klasse will allen in der Schule sagen, dass am Freitag Kuchenverkauf ist. Welche Textart passt am besten?"
                options: ["ein Plakat", "ein Rezept", "ein Gedicht"]
                answer: "ein Plakat"
                hints:
                  - "Viele sollen es sehen."
                  - "Was hängt man im Flur auf?"
                  - "ein Plakat."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden Zweck mit der passenden Textart."
                pairs:
                  - { left: { text: "zum Geburtstag einladen" }, right: { text: "Einladung" } }
                  - { left: { text: "erklären, wie ein Spiel geht" }, right: { text: "Spielanleitung" } }
                  - { left: { text: "sich der neuen Klasse vorstellen" }, right: { text: "Steckbrief" } }
                hints:
                  - "Lies jeden Zweck. Welche Textart hilft dabei?"
                  - "Ein Steckbrief sagt, wer jemand ist."
                  - "einladen: Einladung. Spiel: Anleitung. Vorstellen: Steckbrief."
              - id: l2-f3
                type: multiple_choice
                text: "Du schreibst einen Brief an die Schulleiterin Frau Yilmaz. Welche Anrede passt?"
                say: "Du schreibst einen Brief an die Schulleiterin Frau Yilmaz. Welche Anrede passt?"
                options: ["Sehr geehrte Frau Yilmaz,", "Hi Yilmaz!", "Hallo du,"]
                answer: "Sehr geehrte Frau Yilmaz,"
                option_audio: false
                feedback:
                  "Hi Yilmaz!": "So schreibst du einem Freund. Einer Schulleiterin schreibst du höflich."
                hints:
                  - "Wie sprichst du mit der Schulleiterin?"
                  - "Erwachsenen schreibst du höflich, mit Sie."
                  - "Sehr geehrte Frau Yilmaz,"
              - id: l2-f4
                type: multiple_choice
                text: "Was muss in einer Einladung zum Geburtstag auf jeden Fall stehen?"
                say: "Was muss in einer Einladung zum Geburtstag auf jeden Fall stehen?"
                options: ["wann und wo das Fest ist", "was du dir wünschst", "wie alt dein Hund ist"]
                answer: "wann und wo das Fest ist"
                hints:
                  - "Was müssen die Gäste wissen, damit sie kommen können?"
                  - "Wer? Was? Wann? Wo?"
                  - "wann und wo das Fest ist."
              - id: l2-f5
                type: true_false
                text: "Du willst deiner Freundin erzählen, was du in den Ferien erlebt hast. Passt eine E-Mail?"
                say: "Du willst deiner Freundin erzählen, was du in den Ferien erlebt hast. Passt eine E-Mail?"
                answer: true
                hints:
                  - "Wozu schreibst du: Neuigkeiten erzählen?"
                  - "Brief oder E-Mail passen dafür."
                  - "Ja, eine E-Mail passt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Du willst aufschreiben, wie man Pfannkuchen backt. Welche Textart passt?"
                say: "Du willst aufschreiben, wie man Pfannkuchen backt. Welche Textart passt?"
                options: ["ein Rezept", "eine Einladung", "ein Märchen"]
                answer: "ein Rezept"
                hints: ["Welche Textart erklärt Kochen und Backen?"]
              - id: l2-s2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden Zweck mit der passenden Textart."
                pairs:
                  - { left: { text: "einen verlorenen Hund suchen" }, right: { text: "Suchanzeige" } }
                  - { left: { text: "Mama sagen, wo du bist" }, right: { text: "Notizzettel" } }
                  - { left: { text: "erzählen, was du erlebt hast" }, right: { text: "Brief" } }
                hints: ["Welche Textart ist kurz, welche lang?"]
              - id: l2-s3
                type: multiple_choice
                text: "Du schreibst deinem besten Freund Noah eine Karte. Welche Anrede passt?"
                say: "Du schreibst deinem besten Freund Noah eine Karte. Welche Anrede passt?"
                options: ["Lieber Noah,", "Sehr geehrter Herr Noah,", "An alle,"]
                answer: "Lieber Noah,"
                option_audio: false
                hints: ["Wie schreibst du einem Freund?"]
              - id: l2-s4
                type: multiple_choice
                text: "Was gehört in einen Steckbrief über dich?"
                say: "Was gehört in einen Steckbrief über dich?"
                options: ["Name, Alter, Hobbys", "eine spannende Gruselgeschichte", "ein Kuchenrezept"]
                answer: "Name, Alter, Hobbys"
                hints: ["Ein Steckbrief stellt jemanden vor."]
              - id: l2-s5
                type: true_false
                text: "Im Brief an die Bürgermeisterin schreibst du: „Hey, mach mal den Spielplatz heile!“ Passt das?"
                say: "Im Brief an die Bürgermeisterin schreibst du: Hey, mach mal den Spielplatz heile. Passt das?"
                answer: false
                hints: ["Wie schreibst du einer Bürgermeisterin?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Die Klasse will den Eltern zeigen, was sie über Igel gelernt hat. Welche Textart passt?"
                say: "Die Klasse will den Eltern zeigen, was sie über Igel gelernt hat. Welche Textart passt?"
                options: ["ein Sachtext mit Bildern", "eine Einladung", "ein Einkaufszettel"]
                answer: "ein Sachtext mit Bildern"
              - id: l2-n2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden Zweck mit der passenden Textart."
                pairs:
                  - { left: { text: "nicht vergessen, was man kaufen will" }, right: { text: "Einkaufszettel" } }
                  - { left: { text: "eine lustige Geschichte erzählen" }, right: { text: "Erzählung" } }
                  - { left: { text: "zum Klassenfest einladen" }, right: { text: "Einladung" } }
              - id: l2-n3
                type: multiple_choice
                text: "Du schreibst Herrn Lang vom Tierheim eine E-Mail. Welcher Satz passt?"
                say: "Du schreibst Herrn Lang vom Tierheim eine E-Mail. Welcher Satz passt?"
                options: ["Können Sie mir bitte sagen, wann wir das Tierheim besuchen dürfen?", "Sag mal, wann darf ich kommen?", "Ey, wann kann ich vorbei?"]
                answer: "Können Sie mir bitte sagen, wann wir das Tierheim besuchen dürfen?"
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Was gehört in eine Spielanleitung?"
                say: "Was gehört in eine Spielanleitung?"
                options: ["die Regeln, Schritt für Schritt", "ein Reim am Ende jeder Zeile", "Es war einmal"]
                answer: "die Regeln, Schritt für Schritt"
              - id: l2-n5
                type: true_false
                text: "Du möchtest Oma zu deinem Fest einladen. Passt ein Steckbrief?"
                say: "Du möchtest Oma zu deinem Fest einladen. Passt ein Steckbrief?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Lukas will der Klasse erklären, wie man ein Vogelhaus baut. Welche Textart passt?"
            say: "Lukas will der Klasse erklären, wie man ein Vogelhaus baut. Welche Textart passt?"
            options: ["eine Bauanleitung", "eine Einladung", "ein Gedicht"]
            answer: "eine Bauanleitung"
          - id: l2-c2
            type: matching
            text: "Was gehört zusammen?"
            say: "Verbinde jeden Text mit seinem Zweck."
            pairs:
              - { left: { text: "Lieber Opa, danke für den Ausflug!" }, right: { text: "sich bedanken" } }
              - { left: { text: "Wir laden euch zum Schulkonzert ein." }, right: { text: "einladen" } }
              - { left: { text: "Füchse leben im Wald und jagen Mäuse." }, right: { text: "informieren" } }
          - id: l2-c3
            type: multiple_choice
            text: "Du schreibst deiner Lehrerin Frau Kühn, dass du krank bist. Welche Anrede passt?"
            say: "Du schreibst deiner Lehrerin Frau Kühn, dass du krank bist. Welche Anrede passt?"
            options: ["Liebe Frau Kühn,", "Hi Kühn,", "Hallo Leute,"]
            answer: "Liebe Frau Kühn,"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Tara will, dass Herr Wolf ihr seinen Rasenmäher leiht. Wozu schreibt sie?"
            say: "Tara möchte, dass Herr Wolf ihr seinen Rasenmäher leiht. Wozu schreibt sie ihm?"
            options: ["um ihn um etwas zu bitten", "um ihn zu unterhalten", "um sich zu bedanken"]
            answer: "um ihn um etwas zu bitten"
          - id: l2-c5
            type: true_false
            text: "Für ein Plakat zum Flohmarkt brauchst du: was, wann und wo. Stimmt das?"
            say: "Für ein Plakat zum Flohmarkt brauchst du: was, wann und wo. Stimmt das?"
            answer: true
