# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.noun-cases
skill: lit-de.nouns.cases
curriculum: de-DE
language: de
title:
  de: Die vier Fälle
  en: The four cases
summary: >
  The case questions find the case of a noun: Wer oder was? (Nominativ),
  Wessen? (Genitiv), Wem? (Dativ), Wen oder was? (Akkusativ). Lesson 1
  finds the Nominativ and the Akkusativ; lesson 2 adds the Dativ; lesson 3
  adds the Genitiv, puts nouns into a given case and ends with the skill
  check. The article shows the case: der Hund, des Hundes, dem Hund, den
  Hund.
metadata:
  year: klasse-4
  topic: { de: Die vier Fälle, en: The four cases }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.nouns.pronouns, lit-de.sentences.subject-predicate]
  also_practises: [lit-de.nouns.articles]
  vocabulary: { de: [Fall, Nominativ, Genitiv, Dativ, Akkusativ, Fragewort, Artikel] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: order-is-case
      what: Thinks the first noun in a sentence is always the Nominativ (Den Ball wirft Tim.)
      addressed: lesson 1 sets sentences that start with the Akkusativ; hints say "Frag mit dem Verb"
    - id: wem-wen
      what: Mixes up Wem? and Wen?
      addressed: lesson 2 Learn sets dem and den side by side in one sentence (Ich gebe dem Hund den Knochen.)
    - id: feminine-same
      what: Expects the article to change for every noun (die Katze stays die Katze in Nominativ and Akkusativ)
      addressed: lesson 3 Learn shows the table for der, die and das
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wer oder was? Wen oder was?", en: "Nominative and accusative" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wer bellt? \"Der Hund bellt.\""
            options: ["der Hund", "bellt"]
            answer: "der Hund"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welches Wort ist das Verb? \"Tim wirft den Ball.\""
            options: ["Tim", "wirft", "Ball"]
            answer: "wirft"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Hund holt den Ball."
            say: "Ein Nomen kann in verschiedenen Fällen stehen. Den Fall findest du mit einer Frage. Wer oder was holt den Ball? Der Hund. Das ist der erste Fall, der Nominativ."
          - text: "Wen oder was holt der Hund? den Ball"
            say: "Wen oder was holt der Hund? Den Ball. Das ist der vierte Fall, der Akkusativ. Der Artikel zeigt es: der wird zu den."
          - text: "Den Ball holt der Hund."
            say: "Auch wenn den Ball vorne steht, bleibt es der Akkusativ. Frag immer mit dem Verb."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wer oder was? \"Die Katze fängt eine Maus.\""
                say: "Wer oder was fängt eine Maus?"
                options: ["die Katze", "eine Maus", "fängt"]
                answer: "die Katze"
                hints:
                  - "Frag mit dem Verb: Wer fängt?"
                  - "Wer tut hier etwas? Wer fängt?"
                  - "Die Katze. Sie steht im Nominativ."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wen oder was? \"Die Katze fängt eine Maus.\""
                say: "Wen oder was fängt die Katze?"
                options: ["die Katze", "eine Maus", "fängt"]
                answer: "eine Maus"
                hints:
                  - "Frag: Wen fängt die Katze?"
                  - "Was wird gefangen?"
                  - "Eine Maus. Sie steht im Akkusativ."
              - id: l1-f3
                type: multiple_choice
                text: "In welchem Fall steht \"den Apfel\"? \"Lena isst den Apfel.\""
                options: ["Nominativ", "Akkusativ"]
                answer: "Akkusativ"
                hints:
                  - "Welche Frage passt? Wer isst? Oder: Wen oder was isst Lena?"
                  - "Was isst Lena? Den Apfel."
                  - "Wen oder was? Das ist der Akkusativ."
              - id: l1-f4
                type: fill_in_blank
                text: "Ergänze den Artikel."
                frame: "Der Junge sieht _ Vogel."
                options: ["der", "den", "dem"]
                answer: ["den"]
                hints:
                  - "Wen oder was sieht der Junge?"
                  - "Der Vogel steht im Akkusativ."
                  - "Den Vogel."
              - id: l1-f5
                type: multiple_choice
                text: "Wer oder was? \"Den Ball wirft Tim.\""
                say: "Wer oder was wirft den Ball?"
                options: ["den Ball", "Tim"]
                answer: "Tim"
                feedback:
                  "den Ball": "Den Ball steht vorne, aber der Ball wirft nicht. Frag mit dem Verb: Wer wirft?"
                hints:
                  - "Wer wirft?"
                  - "Der Ball kann nicht werfen."
                  - "Tim. Er steht im Nominativ."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? In \"Der Bäcker backt das Brot.\" steht das Brot im Akkusativ."
                answer: true
                hints:
                  - "Wen oder was backt der Bäcker?"
                  - "Das Brot."
                  - "Ja, Akkusativ. Bei das ändert sich der Artikel nicht."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wer oder was? \"Der Wind bewegt die Blätter.\""
                say: "Wer oder was bewegt die Blätter?"
                options: ["der Wind", "die Blätter"]
                answer: "der Wind"
                hints: ["Frag mit dem Verb."]
              - id: l1-s2
                type: multiple_choice
                text: "Wen oder was? \"Oma liest ein Buch.\""
                say: "Wen oder was liest Oma?"
                options: ["Oma", "ein Buch"]
                answer: "ein Buch"
                hints: ["Was liest Oma?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Ergänze den Artikel."
                frame: "Ich suche _ Schlüssel."
                options: ["der", "den", "dem"]
                answer: ["den"]
                hints: ["Wen oder was suche ich?"]
              - id: l1-s4
                type: multiple_choice
                text: "In welchem Fall steht \"der Lehrer\"? \"Der Lehrer erklärt die Aufgabe.\""
                options: ["Nominativ", "Akkusativ"]
                answer: "Nominativ"
                hints: ["Wer erklärt?"]
              - id: l1-s5
                type: multiple_choice
                text: "Wer oder was? \"Den Tee kocht Papa.\""
                say: "Wer oder was kocht den Tee?"
                options: ["den Tee", "Papa"]
                answer: "Papa"
                hints: ["Wer kocht?"]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? In \"Der Hund sucht den Knochen.\" steht der Hund im Akkusativ."
                answer: false
                hints: ["Wer sucht?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wen oder was? \"Mia malt einen Baum.\""
                say: "Wen oder was malt Mia?"
                options: ["Mia", "einen Baum"]
                answer: "einen Baum"
              - id: l1-n2
                type: fill_in_blank
                text: "Ergänze den Artikel."
                frame: "Wir besuchen _ Zoo."
                options: ["der", "den", "dem"]
                answer: ["den"]
              - id: l1-n3
                type: multiple_choice
                text: "In welchem Fall steht \"den Kuchen\"? \"Den Kuchen backt Opa.\""
                options: ["Nominativ", "Akkusativ"]
                answer: "Akkusativ"
              - id: l1-n4
                type: multiple_choice
                text: "Wer oder was? \"Das Pferd zieht den Wagen.\""
                say: "Wer oder was zieht den Wagen?"
                options: ["das Pferd", "den Wagen"]
                answer: "das Pferd"
              - id: l1-n5
                type: true_false
                text: "Stimmt das? In \"Ben trinkt die Milch.\" steht die Milch im Akkusativ."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wen oder was? \"Der Fuchs jagt den Hasen.\""
            say: "Wen oder was jagt der Fuchs?"
            options: ["der Fuchs", "den Hasen"]
            answer: "den Hasen"
          - id: l1-c2
            type: fill_in_blank
            text: "Ergänze den Artikel."
            frame: "Sara füttert _ Hund."
            options: ["der", "den", "dem"]
            answer: ["den"]
          - id: l1-c3
            type: multiple_choice
            text: "In welchem Fall steht \"die Kinder\"? \"Die Kinder spielen Fußball.\""
            options: ["Nominativ", "Akkusativ"]
            answer: "Nominativ"

  - n: 2
    title: { de: "Wem?", en: "The dative" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wen oder was? \"Tom holt den Ball.\""
            say: "Wen oder was holt Tom?"
            options: ["Tom", "den Ball"]
            answer: "den Ball"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Ergänze den Artikel."
            frame: "Ich sehe _ Mond."
            options: ["der", "den", "dem"]
            answer: ["den"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ich gebe dem Hund den Knochen."
            say: "Wem gebe ich den Knochen? Dem Hund. Mit der Frage Wem findest du den dritten Fall, den Dativ."
          - text: "dem Hund: Wem?  den Knochen: Wen oder was?"
            say: "Im selben Satz: Wem gebe ich etwas? Dem Hund, Dativ. Wen oder was gebe ich? Den Knochen, Akkusativ. Dem und den klingen ähnlich. Die Frage hilft dir."
          - text: "der → dem, die → der, das → dem"
            say: "Im Dativ wird der zu dem, die zu der und das zu dem: dem Hund, der Katze, dem Pferd."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wem? \"Lea hilft der Oma.\""
                say: "Wem hilft Lea?"
                options: ["Lea", "der Oma"]
                answer: "der Oma"
                hints:
                  - "Frag: Wem hilft Lea?"
                  - "Wem wird geholfen?"
                  - "Der Oma. Sie steht im Dativ."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Ergänze den Artikel."
                frame: "Ich danke _ Lehrer."
                options: ["der", "den", "dem"]
                answer: ["dem"]
                feedback:
                  "den": "Frag: Wem danke ich? Die Frage Wem zeigt den Dativ: dem Lehrer."
                hints:
                  - "Frag: Wem danke ich?"
                  - "Im Dativ wird der zu dem."
                  - "Dem Lehrer."
              - id: l2-f3
                type: multiple_choice
                text: "In welchem Fall steht \"dem Kind\"? \"Papa liest dem Kind vor.\""
                options: ["Nominativ", "Dativ", "Akkusativ"]
                answer: "Dativ"
                hints:
                  - "Welche Frage passt?"
                  - "Wem liest Papa vor?"
                  - "Dem Kind: Dativ."
              - id: l2-f4
                type: multiple_choice
                text: "Wen oder was? \"Ich schenke der Freundin ein Buch.\""
                say: "Wen oder was schenke ich?"
                options: ["der Freundin", "ein Buch"]
                answer: "ein Buch"
                hints:
                  - "Wem schenke ich etwas, und was schenke ich?"
                  - "Was wird geschenkt?"
                  - "Ein Buch: Akkusativ."
              - id: l2-f5
                type: fill_in_blank
                text: "Ergänze die Artikel."
                frame: "Ich gebe _ Katze _ Futter."
                options: ["der", "die", "das", "dem"]
                answer: ["der", "das"]
                hints:
                  - "Wem gebe ich? Wen oder was gebe ich?"
                  - "Die Katze im Dativ: der Katze. Das Futter im Akkusativ: das Futter."
                  - "Der Katze das Futter."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? In \"Der Ball gehört dem Jungen.\" steht dem Jungen im Dativ."
                answer: true
                hints:
                  - "Wem gehört der Ball?"
                  - "Dem Jungen."
                  - "Ja, Dativ."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wem? \"Das Eis schmeckt dem Opa.\""
                say: "Wem schmeckt das Eis?"
                options: ["das Eis", "dem Opa"]
                answer: "dem Opa"
                hints: ["Wem schmeckt es?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Ergänze den Artikel."
                frame: "Wir winken _ Nachbarin."
                options: ["die", "der", "den"]
                answer: ["der"]
                hints: ["Wem winken wir? Die wird im Dativ zu der."]
              - id: l2-s3
                type: multiple_choice
                text: "In welchem Fall steht \"den Brief\"? \"Ich schreibe dem Onkel den Brief.\""
                options: ["Nominativ", "Dativ", "Akkusativ"]
                answer: "Akkusativ"
                hints: ["Wen oder was schreibe ich?"]
              - id: l2-s4
                type: multiple_choice
                text: "Wem? \"Der Arzt hilft dem Patienten.\""
                say: "Wem hilft der Arzt?"
                options: ["der Arzt", "dem Patienten"]
                answer: "dem Patienten"
                hints: ["Wem wird geholfen?"]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? In \"Ich rufe den Hund.\" steht den Hund im Dativ."
                answer: false
                hints: ["Wen rufe ich?"]
              - id: l2-s6
                type: fill_in_blank
                text: "Ergänze die Artikel."
                frame: "Mama erklärt _ Kind _ Spiel."
                options: ["das", "dem", "den", "der"]
                answer: ["dem", "das"]
                hints: ["Wem erklärt Mama etwas? Wen oder was erklärt sie?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wem? \"Ich bringe der Lehrerin die Hefte.\""
                say: "Wem bringe ich die Hefte?"
                options: ["der Lehrerin", "die Hefte"]
                answer: "der Lehrerin"
              - id: l2-n2
                type: fill_in_blank
                text: "Ergänze den Artikel."
                frame: "Das Fahrrad gehört _ Mädchen."
                options: ["das", "dem", "den"]
                answer: ["dem"]
              - id: l2-n3
                type: multiple_choice
                text: "In welchem Fall steht \"dem Vogel\"? \"Ben gibt dem Vogel Wasser.\""
                options: ["Nominativ", "Dativ", "Akkusativ"]
                answer: "Dativ"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? In \"Wir zeigen dem Gast den Garten.\" steht den Garten im Akkusativ."
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Ergänze den Artikel."
                frame: "Ich glaube _ Freund."
                options: ["der", "den", "dem"]
                answer: ["dem"]

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wem? \"Lisa hilft dem Bruder.\""
            say: "Wem hilft Lisa?"
            options: ["Lisa", "dem Bruder"]
            answer: "dem Bruder"
          - id: l2-c2
            type: fill_in_blank
            text: "Ergänze die Artikel."
            frame: "Ich gebe _ Pferd _ Apfel."
            options: ["das", "dem", "den", "der"]
            answer: ["dem", "den"]
          - id: l2-c3
            type: multiple_choice
            text: "In welchem Fall steht \"der Mutter\"? \"Das Kind dankt der Mutter.\""
            options: ["Nominativ", "Dativ", "Akkusativ"]
            answer: "Dativ"

  - n: 3
    title: { de: "Wessen? Und alle vier Fälle", en: "The genitive and all four cases" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Wem? \"Ich helfe dem Opa.\""
            say: "Wem helfe ich?"
            options: ["ich", "dem Opa"]
            answer: "dem Opa"
            difficulty: easy
          - id: l3-w2
            type: fill_in_blank
            text: "Ergänze den Artikel."
            frame: "Ich danke _ Fahrer."
            options: ["der", "den", "dem"]
            answer: ["dem"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Das ist das Fahrrad des Jungen."
            say: "Wessen Fahrrad ist das? Des Jungen. Mit Wessen findest du den zweiten Fall, den Genitiv. Er zeigt, wem etwas gehört."
          - text: "der Hund, des Hundes, dem Hund, den Hund"
            say: "Alle vier Fälle mit der: Nominativ der Hund, Genitiv des Hundes, Dativ dem Hund, Akkusativ den Hund."
          - text: "die Katze, der Katze, der Katze, die Katze"
            say: "Mit die: die Katze, der Katze, der Katze, die Katze. Mit das: das Pferd, des Pferdes, dem Pferd, das Pferd. Nicht jeder Artikel ändert sich in jedem Fall. Die Frage zeigt dir trotzdem den Fall."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "Wessen? \"Das ist die Tasche der Lehrerin.\""
                say: "Wessen Tasche ist das?"
                options: ["die Tasche", "der Lehrerin"]
                answer: "der Lehrerin"
                hints:
                  - "Frag: Wessen Tasche?"
                  - "Wem gehört die Tasche?"
                  - "Der Lehrerin. Das ist der Genitiv."
                difficulty: easy
              - id: l3-f2
                type: fill_in_blank
                text: "Ergänze den Genitiv."
                frame: "Das Dach _ Hauses ist rot."
                options: ["das", "des", "dem"]
                answer: ["des"]
                hints:
                  - "Wessen Dach?"
                  - "Im Genitiv wird das zu des, und das Nomen bekommt -es."
                  - "Des Hauses."
              - id: l3-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Frage mit ihrem Fall."
                option_audio: false
                pairs:
                  - { left: { text: "Wer oder was?" }, right: { text: "Nominativ" } }
                  - { left: { text: "Wessen?" }, right: { text: "Genitiv" } }
                  - { left: { text: "Wem?" }, right: { text: "Dativ" } }
                  - { left: { text: "Wen oder was?" }, right: { text: "Akkusativ" } }
                hints:
                  - "Der erste Fall fragt nach dem, der etwas tut."
                  - "Wessen fragt nach dem Besitzer."
                  - "Wer: Nominativ, Wessen: Genitiv, Wem: Dativ, Wen: Akkusativ."
              - id: l3-f4
                type: multiple_choice
                text: "In welchem Fall steht \"des Vaters\"? \"Das Auto des Vaters ist neu.\""
                options: ["Genitiv", "Dativ", "Akkusativ"]
                answer: "Genitiv"
                hints:
                  - "Welche Frage passt?"
                  - "Wessen Auto?"
                  - "Des Vaters: Genitiv."
              - id: l3-f5
                type: fill_in_blank
                text: "Setz \"der Baum\" in die vier Fälle."
                frame: "Nominativ: der Baum. Genitiv: _ Baumes. Dativ: _ Baum. Akkusativ: _ Baum."
                options: ["der", "des", "dem", "den"]
                answer: ["des", "dem", "den"]
                hints:
                  - "Wie beim Hund."
                  - "Des Hundes, dem Hund, den Hund."
                  - "Des Baumes, dem Baum, den Baum."
              - id: l3-f6
                type: true_false
                text: "Stimmt das? In \"Ich sehe die Katze.\" steht die Katze im Akkusativ, obwohl der Artikel die bleibt."
                answer: true
                hints:
                  - "Wen oder was sehe ich?"
                  - "Die Katze."
                  - "Ja, Akkusativ. Bei die ändert sich der Artikel nicht."

          - support: some
            tasks:
              - id: l3-s1
                type: multiple_choice
                text: "Wessen? \"Die Farbe des Autos ist blau.\""
                say: "Wessen Farbe ist blau?"
                options: ["die Farbe", "des Autos"]
                answer: "des Autos"
                hints: ["Wessen Farbe?"]
              - id: l3-s2
                type: fill_in_blank
                text: "Ergänze den Genitiv."
                frame: "Der Schwanz _ Hundes wedelt."
                options: ["der", "des", "dem"]
                answer: ["des"]
                hints: ["Wessen Schwanz?"]
              - id: l3-s3
                type: multiple_choice
                text: "In welchem Fall steht \"dem Hund\"? \"Ich gebe dem Hund Futter.\""
                options: ["Genitiv", "Dativ", "Akkusativ"]
                answer: "Dativ"
                hints: ["Wem gebe ich Futter?"]
              - id: l3-s4
                type: fill_in_blank
                text: "Setz \"der Tisch\" in die vier Fälle."
                frame: "Nominativ: der Tisch. Genitiv: _ Tisches. Dativ: _ Tisch. Akkusativ: _ Tisch."
                options: ["der", "des", "dem", "den"]
                answer: ["des", "dem", "den"]
                hints: ["Des, dem, den."]
              - id: l3-s5
                type: multiple_choice
                text: "Welche Frage passt zu \"den Ball\"? \"Tim schießt den Ball.\""
                options: ["Wem?", "Wessen?", "Wen oder was?"]
                answer: "Wen oder was?"
                hints: ["Was schießt Tim?"]
              - id: l3-s6
                type: true_false
                text: "Stimmt das? In \"Die Mütze des Kindes ist nass.\" steht des Kindes im Dativ."
                answer: false
                hints: ["Wessen Mütze?"]

          - support: none
            tasks:
              - id: l3-n1
                type: multiple_choice
                text: "Wessen? \"Die Stimme der Sängerin ist schön.\""
                say: "Wessen Stimme ist schön?"
                options: ["die Stimme", "der Sängerin"]
                answer: "der Sängerin"
              - id: l3-n2
                type: fill_in_blank
                text: "Ergänze den Genitiv."
                frame: "Das Ende _ Films war spannend."
                options: ["der", "des", "den"]
                answer: ["des"]
              - id: l3-n3
                type: multiple_choice
                text: "In welchem Fall steht \"die Blumen\"? \"Oma gießt die Blumen.\""
                options: ["Nominativ", "Dativ", "Akkusativ"]
                answer: "Akkusativ"
              - id: l3-n4
                type: fill_in_blank
                text: "Setz \"der Stein\" in die vier Fälle."
                frame: "Nominativ: der Stein. Genitiv: _ Steines. Dativ: _ Stein. Akkusativ: _ Stein."
                options: ["der", "des", "dem", "den"]
                answer: ["des", "dem", "den"]
              - id: l3-n5
                type: multiple_choice
                text: "Welche Frage passt zu \"dem Opa\"? \"Wir winken dem Opa.\""
                options: ["Wem?", "Wessen?", "Wen oder was?"]
                answer: "Wem?"

      - activity: check
        size: skill
        tasks:
          - id: l3-c1
            type: multiple_choice
            text: "Wer oder was? \"Den Zug fährt der Lokführer.\""
            say: "Wer oder was fährt den Zug?"
            options: ["den Zug", "der Lokführer"]
            answer: "der Lokführer"
          - id: l3-c2
            type: fill_in_blank
            text: "Ergänze die Artikel."
            frame: "Ich zeige _ Mädchen _ Weg."
            options: ["das", "dem", "den", "der"]
            answer: ["dem", "den"]
          - id: l3-c3
