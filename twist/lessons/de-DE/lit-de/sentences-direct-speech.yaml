# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.sentences-direct-speech
skill: lit-de.sentences.direct-speech
curriculum: de-DE
language: de
title:
  de: Wörtliche Rede
  en: Direct speech
summary: >
  Writing what someone says, with the Begleitsatz in front. Lesson 1
  finds the wörtliche Rede and the Begleitsatz and sets the Doppelpunkt
  after the Begleitsatz; lesson 2 sets the Anführungszeichen (unten am
  Anfang, oben am Ende), puts the end mark of the spoken sentence inside
  them, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Wörtliche Rede, en: Direct speech }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.sentences.end-punctuation]
  also_practises: [lit-de.sentences.end-punctuation]
  vocabulary: { de: [wörtliche Rede, Begleitsatz, Redezeichen, Anführungszeichen, Doppelpunkt] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: no-colon
      what: Leaves out the Doppelpunkt after the Begleitsatz or sets a Komma
      addressed: lesson 1 Learn names the Doppelpunkt; a fill-in task with a Komma option after the Begleitsatz in every stage of lesson 1 (l1-f2, l1-s2, l1-n2), with feedback in l1-f2; l1-s5 is a card with a Komma instead
    - id: end-mark-outside
      what: Puts the end mark of the spoken sentence after the closing Anführungszeichen
      addressed: lesson 2 Learn shows the end mark inside; a "Welcher Satz ist richtig?" task with the mark outside in every stage of lesson 2 (l2-f1, l2-s1, l2-n1), with feedback in l2-f1; l2-s3 is a card with the Punkt outside
    - id: quotes-around-all
      what: Puts the Begleitsatz inside the Anführungszeichen too
      addressed: highlight tasks in every stage of lesson 1 separate the spoken words from the Begleitsatz; l1-n5 is a card with the Begleitsatz inside the Anführungszeichen, and l2-n4 offers it as a wrong option
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wer sagt was?", en: "Who says what?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Setz das Zeichen."
            say: "Lies den Satz. Welches Zeichen gehört ans Ende?"
            frame: "Wann kommst du nach Hause_"
            options: ["?", ".", "!"]
            answer: ["?"]
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Setz das Zeichen."
            say: "Lies den Satz. Welches Zeichen gehört ans Ende?"
            frame: "Hurra, wir haben Ferien_"
            options: ["!", "?", "."]
            answer: ["!"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lea sagt: „Ich habe Hunger.“"
            say: "Hier steht genau, was Lea sagt: Ich habe Hunger. Das ist die wörtliche Rede. Sie steht zwischen Anführungszeichen."
          - text: "Lea sagt: · „Ich habe Hunger.“"
            say: "Die Wörter Lea sagt sind der Begleitsatz. Er verrät, wer spricht. Steht er vorn, folgt danach ein Doppelpunkt."
          - text: "Opa fragt: „Wo ist meine Brille?“"
            say: "Im Begleitsatz kann auch fragt, ruft oder antwortet stehen. Opa fragt, wo seine Brille ist."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf alle Wörter der wörtlichen Rede."
                say: "Lies den Satz. Tippe auf alle Wörter, die gesagt werden."
                show: { drawn: letter-card, text: "Tom ruft: „Komm schnell her!“" }
                spans: ["„Komm", "schnell", "her!“"]
                hints:
                  - "Was sagt Tom genau?"
                  - "Die wörtliche Rede steht zwischen den Anführungszeichen."
                  - "Komm schnell her!"
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Setz das Zeichen nach dem Begleitsatz."
                say: "Welches Zeichen gehört hinter den Begleitsatz?"
                frame: "Mia sagt_ „Ich spiele gern Fußball.“"
                options: [":", ",", "."]
                answer: [":"]
                feedback:
                  ",": "Nach einem Begleitsatz vorn steht ein Doppelpunkt, kein Komma."
                hints:
                  - "Mia sagt ist der Begleitsatz."
                  - "Nach dem Begleitsatz vorn steht ein besonderes Zeichen."
                  - "Ein Doppelpunkt."
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Begleitsatzes."
                say: "Lies den Satz. Tippe auf die Wörter, die verraten, wer spricht."
                show: { drawn: letter-card, text: "Die Lehrerin fragt: „Wer hat das gemalt?“" }
                spans: ["Die", "Lehrerin", "fragt:"]
                hints:
                  - "Wer spricht hier?"
                  - "Der Begleitsatz steht vor dem Doppelpunkt."
                  - "Die Lehrerin fragt."
              - id: l1-f4
                type: multiple_choice
                text: "Wer spricht? Ben antwortet: „Ich war das.“"
                say: "Lies den Satz. Wer spricht?"
                options: ["Ben", "die Lehrerin", "niemand"]
                answer: "Ben"
                hints:
                  - "Schau in den Begleitsatz."
                  - "Der Begleitsatz steht vor dem Doppelpunkt."
                  - "Ben."
              - id: l1-f5
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Papa sagt: „Das Essen ist fertig.“" }
                answer: true
                hints:
                  - "Steht nach dem Begleitsatz ein Doppelpunkt?"
                  - "Steht die wörtliche Rede zwischen Anführungszeichen?"
                  - "Ja, alles ist richtig."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf alle Wörter der wörtlichen Rede."
                say: "Lies den Satz. Tippe auf alle Wörter, die gesagt werden."
                show: { drawn: letter-card, text: "Oma fragt: „Hast du Durst?“" }
                spans: ["„Hast", "du", "Durst?“"]
                hints: ["Welche Wörter stehen zwischen den Anführungszeichen?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Setz das Zeichen nach dem Begleitsatz."
                say: "Welches Zeichen gehört hinter den Begleitsatz?"
                frame: "Der Kapitän ruft_ „Alle an Bord!“"
                options: [",", ":", "!"]
                answer: [":"]
                hints: ["Welches Zeichen steht nach einem Begleitsatz vorn?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Begleitsatzes."
                say: "Lies den Satz. Tippe auf die Wörter, die verraten, wer spricht."
                show: { drawn: letter-card, text: "Mein Bruder flüstert: „Psst, sei leise!“" }
                spans: ["Mein", "Bruder", "flüstert:"]
                hints: ["Was steht vor dem Doppelpunkt?"]
              - id: l1-s4
                type: multiple_choice
                text: "Wer spricht? Die Ärztin sagt: „Mach den Mund auf.“"
                say: "Lies den Satz. Wer spricht?"
                options: ["das Kind", "die Ärztin", "die Mama"]
                answer: "die Ärztin"
                hints: ["Schau in den Begleitsatz."]
              - id: l1-s5
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Lisa sagt, „Ich komme gleich.“" }
                answer: false
                hints: ["Prüf das Zeichen nach dem Begleitsatz."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf alle Wörter der wörtlichen Rede."
                say: "Lies den Satz. Tippe auf alle Wörter, die gesagt werden."
                show: { drawn: letter-card, text: "Max jubelt: „Wir haben gewonnen!“" }
                spans: ["„Wir", "haben", "gewonnen!“"]
              - id: l1-n2
                type: fill_in_blank
                text: "Setz das Zeichen nach dem Begleitsatz."
                say: "Welches Zeichen gehört hinter den Begleitsatz?"
                frame: "Der Busfahrer sagt_ „Bitte einsteigen.“"
                options: [".", ":", ","]
                answer: [":"]
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Begleitsatzes."
                say: "Lies den Satz. Tippe auf die Wörter, die verraten, wer spricht."
                show: { drawn: letter-card, text: "Unsere Nachbarin fragt: „Ist das euer Ball?“" }
                spans: ["Unsere", "Nachbarin", "fragt:"]
              - id: l1-n4
                type: multiple_choice
                text: "Wer spricht? Der Hund bellt, und Jonas ruft: „Aus, Bello!“"
                say: "Lies den Satz. Wer spricht?"
                options: ["Bello", "Jonas", "der Hund"]
                answer: "Jonas"
              - id: l1-n5
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "„Tim fragt: Kommst du mit?“" }
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tippe auf alle Wörter der wörtlichen Rede."
            say: "Lies den Satz. Tippe auf alle Wörter, die gesagt werden."
            show: { drawn: letter-card, text: "Paula sagt: „Ich mag Katzen.“" }
            spans: ["„Ich", "mag", "Katzen.“"]
          - id: l1-c2
            type: fill_in_blank
            text: "Setz das Zeichen nach dem Begleitsatz."
            say: "Welches Zeichen gehört hinter den Begleitsatz?"
            frame: "Mama ruft_ „Kommt schnell in den Garten!“"
            options: [":", ",", "?"]
            answer: [":"]
          - id: l1-c3
            type: multiple_choice
            text: "Wer spricht? Der Lehrer antwortet: „Das ist richtig.“"
            say: "Lies den Satz. Wer spricht?"
            options: ["die Klasse", "der Lehrer", "das Kind"]
            answer: "der Lehrer"

  - n: 2
    title: { de: "Die Anführungszeichen", en: "The speech marks" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Setz das Zeichen nach dem Begleitsatz."
            say: "Welches Zeichen gehört hinter den Begleitsatz?"
            frame: "Emil fragt_ „Wie spät ist es?“"
            options: [":", ",", "."]
            answer: [":"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wer spricht? Sara ruft: „Fang den Ball!“"
            say: "Lies den Satz. Wer spricht?"
            options: ["Sara", "der Ball", "niemand"]
            answer: "Sara"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "„ … “"
            say: "Die Anführungszeichen am Anfang stehen unten, die am Ende oben. Unten sehen sie aus wie zwei kleine Neunen, oben wie zwei kleine Sechsen. Merk dir: unten neun neun, oben sechs sechs."
          - text: "Jan sagt: „Ich bin müde.“"
            say: "Das Satzzeichen der wörtlichen Rede steht vor den Anführungszeichen am Ende: müde, Punkt, Anführungszeichen oben."
          - text: "Jan fragt: „Bist du müde?“ · Jan ruft: „Ich bin so müde!“"
            say: "Fragt jemand, steht das Fragezeichen drinnen. Ruft jemand, steht das Ausrufezeichen drinnen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Lies die Sätze. Welcher ist richtig geschrieben?"
                options: ["Anna sagt: „Ich gehe jetzt.“", "Anna sagt: „Ich gehe jetzt“.", "Anna sagt: Ich gehe jetzt."]
                answer: "Anna sagt: „Ich gehe jetzt.“"
                option_audio: false
                feedback:
                  "Anna sagt: „Ich gehe jetzt“.": "Der Punkt gehört zur wörtlichen Rede. Er steht vor den Anführungszeichen am Ende."
                hints:
                  - "Wo stehen die Anführungszeichen?"
                  - "Und wo steht der Punkt?"
                  - "Anna sagt: „Ich gehe jetzt.“"
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Setz das Satzzeichen der wörtlichen Rede."
                say: "Lies den Satz. Welches Zeichen gehört in die Lücke?"
                frame: "Peter fragt: „Darf ich mitspielen_“"
                options: ["?", ".", ":"]
                answer: ["?"]
                hints:
                  - "Peter fragt."
                  - "Nach einer Frage steht ein Fragezeichen."
                  - "Ein Fragezeichen."
              - id: l2-f3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Lukas ruft: „Vorsicht, ein Auto!“" }
                answer: true
                hints:
                  - "Prüf den Doppelpunkt, die Anführungszeichen und das Ausrufezeichen."
                  - "Das Ausrufezeichen steht vor den Anführungszeichen am Ende."
                  - "Ja, alles ist richtig."
              - id: l2-f4
                type: multiple_choice
                text: "Welche Anführungszeichen stehen am Anfang?"
                say: "Welche Anführungszeichen stehen am Anfang der wörtlichen Rede?"
                options: ["unten: „", "oben: “"]
                answer: "unten: „"
                option_audio: false
                hints:
                  - "Denk an neun neun und sechs sechs."
                  - "Am Anfang stehen sie unten."
                  - "Unten."
              - id: l2-f5
                type: fill_in_blank
                text: "Setz das Satzzeichen der wörtlichen Rede."
                say: "Lies den Satz. Welches Zeichen gehört in die Lücke?"
                frame: "Oma erzählt: „Früher hatte ich einen Hund_“"
                options: [".", "?", ","]
                answer: ["."]
                hints:
                  - "Oma fragt nicht und ruft nicht."
                  - "Sie erzählt etwas."
                  - "Ein Punkt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Lies die Sätze. Welcher ist richtig geschrieben?"
                options: ["Mia fragt: „Kommst du?“", "Mia fragt: „Kommst du“?", "Mia fragt „Kommst du?“"]
                answer: "Mia fragt: „Kommst du?“"
                option_audio: false
                hints: ["Prüf den Doppelpunkt und die Stelle des Fragezeichens."]
              - id: l2-s2
                type: fill_in_blank
                text: "Setz das Satzzeichen der wörtlichen Rede."
                say: "Lies den Satz. Welches Zeichen gehört in die Lücke?"
                frame: "Felix ruft: „Hilfe, mein Drachen fliegt weg_“"
                options: ["?", "!", ":"]
                answer: ["!"]
                hints: ["Felix ruft. Welches Zeichen passt zu einem Ruf?"]
              - id: l2-s3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Clara sagt: „Ich habe ein neues Fahrrad“." }
                answer: false
                hints: ["Wo steht der Punkt?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welche Anführungszeichen stehen am Ende?"
                say: "Welche Anführungszeichen stehen am Ende der wörtlichen Rede?"
                options: ["unten: „", "oben: “"]
                answer: "oben: “"
                option_audio: false
                hints: ["Denk an neun neun und sechs sechs."]
              - id: l2-s5
                type: fill_in_blank
                text: "Setz das Satzzeichen der wörtlichen Rede."
                say: "Lies den Satz. Welches Zeichen gehört in die Lücke?"
                frame: "Der Verkäufer fragt: „Was möchtest du_“"
                options: [".", "!", "?"]
                answer: ["?"]
                hints: ["Fragt der Verkäufer?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Lies die Sätze. Welcher ist richtig geschrieben?"
                options: ["Opa ruft: „Frohe Ostern“!", "Opa ruft: „Frohe Ostern!“", "Opa ruft: “Frohe Ostern!„"]
                answer: "Opa ruft: „Frohe Ostern!“"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Setz das Satzzeichen der wörtlichen Rede."
                say: "Lies den Satz. Welches Zeichen gehört in die Lücke?"
                frame: "Nina sagt: „Mein Hamster heißt Krümel_“"
                options: ["!", ".", "?"]
                answer: ["."]
              - id: l2-n3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Die Mutter fragt: „Hast du deine Hausaufgaben gemacht?“" }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Lies die Sätze. Welcher ist richtig geschrieben?"
                options: ["Leo sagt: „Ich bin zehn.“", "„Leo sagt: Ich bin zehn.“", "Leo sagt: Ich bin zehn."]
                answer: "Leo sagt: „Ich bin zehn.“"
                option_audio: false
              - id: l2-n5
                type: fill_in_blank
                text: "Setz das Satzzeichen der wörtlichen Rede."
                say: "Lies den Satz. Welches Zeichen gehört in die Lücke?"
                frame: "Der Trainer fragt: „Wer will ins Tor_“"
                options: ["?", ".", "!"]
                answer: ["?"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tippe auf alle Wörter der wörtlichen Rede."
            say: "Lies den Satz. Tippe auf alle Wörter, die gesagt werden."
            show: { drawn: letter-card, text: "Der Zauberer ruft: „Simsalabim!“" }
            spans: ["„Simsalabim!“"]
          - id: l2-c2
            type: fill_in_blank
            text: "Setz das Zeichen nach dem Begleitsatz."
            say: "Welches Zeichen gehört hinter den Begleitsatz?"
            frame: "Lena antwortet_ „Ja, gern.“"
            options: [",", ":", "."]
            answer: [":"]
          - id: l2-c3
            type: multiple_choice
            text: "Welcher Satz ist richtig?"
            say: "Lies die Sätze. Welcher ist richtig geschrieben?"
            options: ["Ali fragt: „Wo wohnst du“?", "Ali fragt: „Wo wohnst du?“", "Ali fragt, „Wo wohnst du?“"]
            answer: "Ali fragt: „Wo wohnst du?“"
            option_audio: false
          - id: l2-c4
            type: fill_in_blank
            text: "Setz das Satzzeichen der wörtlichen Rede."
            say: "Lies den Satz. Welches Zeichen gehört in die Lücke?"
            frame: "Der Junge ruft: „Schau mal, ein Regenbogen_“"
            options: ["!", "?", "."]
            answer: ["!"]
          - id: l2-c5
            type: true_false
            text: "Ist das richtig geschrieben?"
            say: "Lies die Karte. Ist das richtig geschrieben?"
            show: { drawn: letter-card, text: "Ben sagt: Ich lese ein Buch." }
            answer: false
