# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.digital-texts
skill: lit-de.texts-media.digital-texts
curriculum: de-DE
language: de
title:
  de: Digitale Texte lesen
  en: Reading digital texts
summary: >
  Finding your way in a children's website. Lesson 1 reads a page from a
  made-up animal lexicon, shown as text with its links in square brackets,
  and chooses the link that leads to an answer (Startseite, Menü, Suche,
  Zurück); lesson 2 puts text, picture, video and sound together to answer
  a question and ends with the skill check. Tapping real links waits for a
  web page component; here the child chooses the link from options.
metadata:
  year: klasse-3
  topic: { de: Medien, en: Media }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.comprehension.find-information]
  also_practises: [lit-de.comprehension.find-information]
  vocabulary: { de: [Internetseite, Link, Startseite, Menü, Suche, Zurück, Bildunterschrift, Video, Ton] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: read-page-top-down
      what: Reads the whole page from the top instead of using the menu or the search
      addressed: "lesson 1 Learn shows the menu first; every stage asks which link leads to the answer (l1-f1, l1-s1, l1-n1), with a link that only sounds close as the key distractor (feedback on l1-f1)"
    - id: text-only
      what: Looks for every answer in the text and ignores the picture, the video and the sound
      addressed: "lesson 2 asks where an answer is found (l2-f1, l2-s1, l2-n1, l2-c2) and sorts facts by text, picture or sound (l2-f4, l2-s4, l2-n4)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Links folgen", en: "Following links" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Der Hund\nFutter: Hunde fressen Fleisch und Trockenfutter.\nPflege: Hunde müssen jeden Tag nach draußen.\n\nUnter welcher Überschrift steht, was Hunde fressen?"
            say: "Lies den Text. Unter welcher Überschrift steht, was Hunde fressen?"
            options: ["Futter", "Pflege", "Der Hund"]
            answer: "Futter"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Du suchst im Inhaltsverzeichnis eines Tierbuchs etwas über Eulen. Unter welchem Kapitel schaust du nach?"
            say: "Du suchst im Inhaltsverzeichnis eines Tierbuchs etwas über Eulen. Unter welchem Kapitel schaust du nach?"
            options: ["Vögel", "Fische", "Insekten"]
            answer: "Vögel"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Tierlexikon für Kinder\n[Startseite] [Säugetiere] [Vögel] [Insekten] [Suche]"
            say: "So sieht der Anfang einer Kinderseite im Internet aus. Oben ist das Menü. Die Wörter in eckigen Klammern sind Links. Tippst du darauf, kommst du auf eine andere Seite."
          - text: "Tierlexikon für Kinder > Säugetiere > Fuchs\n[Zurück]\n\nDer Fuchs\nFüchse leben im Wald und am Feldrand. Sie jagen vor allem Mäuse."
            say: "Hier bist du auf der Seite Fuchs. Die Zeile oben zeigt, wo du bist. Mit Zurück kommst du auf die Seite davor, mit Startseite ganz an den Anfang."
          - text: "[Suche]: Fuchs"
            say: "Findest du etwas im Menü nicht, gibst du ein Suchwort in die Suche ein. Nimm ein kurzes Schlüsselwort, zum Beispiel Fuchs."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Tierlexikon für Kinder\n[Startseite] [Säugetiere] [Vögel] [Insekten] [Suche]\n\nDu willst etwas über Marienkäfer lesen. Auf welchen Link tippst du?"
                say: "Lies die Seite. Du willst etwas über Marienkäfer lesen. Auf welchen Link tippst du?"
                options: ["Insekten", "Säugetiere", "Vögel"]
                answer: "Insekten"
                feedback:
                  "Vögel": "Marienkäfer können fliegen, aber sie sind keine Vögel."
                hints:
                  - "Zu welcher Tiergruppe gehört ein Käfer?"
                  - "Käfer haben sechs Beine."
                  - "Tippe auf Insekten."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Tierlexikon für Kinder > Vögel > Amsel\n[Startseite] [Zurück]\n\nDu willst wieder zur Liste aller Vögel. Auf welchen Link tippst du?"
                say: "Lies die Seite. Du willst wieder zur Liste aller Vögel. Auf welchen Link tippst du?"
                options: ["Zurück", "Startseite", "Amsel"]
                answer: "Zurück"
                hints:
                  - "Die Zeile oben zeigt, wo du bist: Vögel, dann Amsel."
                  - "Die Seite davor ist Vögel."
                  - "Tippe auf Zurück."
              - id: l1-f3
                type: true_false
                text: "Tierlexikon für Kinder\n[Startseite] [Säugetiere] [Vögel] [Insekten] [Suche]\n\nDu suchst einen Text über Delfine. Hilft dir der Link Säugetiere?"
                say: "Lies die Seite. Du suchst einen Text über Delfine. Hilft dir der Link Säugetiere?"
                answer: true
                hints:
                  - "Delfine leben im Meer, aber sind sie Fische?"
                  - "Delfine trinken als Junge Milch bei ihrer Mutter."
                  - "Ja, Delfine sind Säugetiere."
              - id: l1-f4
                type: multiple_choice
                text: "Du suchst auf der Kinderseite etwas über Schildkröten. Welches Suchwort gibst du ein?"
                say: "Du suchst auf der Kinderseite etwas über Schildkröten. Welches Suchwort gibst du ein?"
                options: ["Schildkröte", "Was fressen eigentlich so Tiere mit Panzer im Garten", "Tier"]
                answer: "Schildkröte"
                hints:
                  - "Ein gutes Suchwort ist kurz."
                  - "Tier ist zu allgemein."
                  - "Schildkröte."
              - id: l1-f5
                type: multiple_choice
                text: "Tierlexikon für Kinder > Insekten > Biene > Honig\n[Startseite] [Zurück]\n\nDu willst ganz an den Anfang der Seite. Auf welchen Link tippst du?"
                say: "Lies die Seite. Du willst ganz an den Anfang. Auf welchen Link tippst du?"
                options: ["Startseite", "Zurück", "Honig"]
                answer: "Startseite"
                hints:
                  - "Zurück führt nur eine Seite zurück."
                  - "Welcher Link führt ganz an den Anfang?"
                  - "Tippe auf Startseite."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Tierlexikon für Kinder\n[Startseite] [Säugetiere] [Vögel] [Insekten] [Suche]\n\nDu willst etwas über Spechte lesen. Auf welchen Link tippst du?"
                say: "Lies die Seite. Du willst etwas über Spechte lesen. Auf welchen Link tippst du?"
                options: ["Vögel", "Insekten", "Säugetiere"]
                answer: "Vögel"
                hints: ["Ein Specht hat Federn und einen Schnabel."]
              - id: l1-s2
                type: multiple_choice
                text: "Tierlexikon für Kinder > Säugetiere > Igel\n[Startseite] [Zurück]\n\nDu willst wieder zur Liste aller Säugetiere. Auf welchen Link tippst du?"
                say: "Lies die Seite. Du willst wieder zur Liste aller Säugetiere. Auf welchen Link tippst du?"
                options: ["Zurück", "Startseite", "Igel"]
                answer: "Zurück"
                hints: ["Welche Seite kam vor Igel?"]
              - id: l1-s3
                type: true_false
                text: "Du suchst etwas über Eichhörnchen und gibst „Eichhörnchen“ in die Suche ein. Ist das ein gutes Suchwort?"
                say: "Du suchst etwas über Eichhörnchen und gibst Eichhörnchen in die Suche ein. Ist das ein gutes Suchwort?"
                answer: true
                hints: ["Ist das Wort kurz und genau?"]
              - id: l1-s4
                type: multiple_choice
                text: "Der Fuchs\nFüchse leben im Wald. [Mehr über den Wald]\nSie jagen Mäuse. [Mehr über Mäuse]\n\nDu willst wissen, wie Mäuse leben. Auf welchen Link tippst du?"
                say: "Lies die Seite. Du willst wissen, wie Mäuse leben. Auf welchen Link tippst du?"
                options: ["Mehr über Mäuse", "Mehr über den Wald", "Der Fuchs"]
                answer: "Mehr über Mäuse"
                hints: ["Welcher Link hat das Wort Mäuse?"]
              - id: l1-s5
                type: multiple_choice
                text: "Wo findest du auf einer Internetseite meistens das Menü?"
                say: "Wo findest du auf einer Internetseite meistens das Menü?"
                options: ["oben auf der Seite", "ganz unten im Text versteckt", "auf jedem Bild"]
                answer: "oben auf der Seite"
                hints: ["Denk an das Tierlexikon."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Tierlexikon für Kinder\n[Startseite] [Säugetiere] [Vögel] [Insekten] [Suche]\n\nDu willst etwas über Pferde lesen. Auf welchen Link tippst du?"
                say: "Lies die Seite. Du willst etwas über Pferde lesen. Auf welchen Link tippst du?"
                options: ["Säugetiere", "Vögel", "Insekten"]
                answer: "Säugetiere"
              - id: l1-n2
                type: multiple_choice
                text: "Tierlexikon für Kinder > Vögel > Eule\n[Startseite] [Zurück]\n\nDu willst ganz an den Anfang der Seite. Auf welchen Link tippst du?"
                say: "Lies die Seite. Du willst ganz an den Anfang. Auf welchen Link tippst du?"
                options: ["Startseite", "Zurück", "Eule"]
                answer: "Startseite"
              - id: l1-n3
                type: true_false
                text: "Tierlexikon für Kinder\n[Startseite] [Säugetiere] [Vögel] [Insekten] [Suche]\n\nDu suchst etwas über Haie. Im Menü gibt es keinen Link Fische. Hilft dir die Suche?"
                say: "Lies die Seite. Du suchst etwas über Haie. Im Menü gibt es keinen Link Fische. Hilft dir die Suche?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Du willst wissen, wie lange Elefanten schlafen. Welches Suchwort gibst du ein?"
                say: "Du willst wissen, wie lange Elefanten schlafen. Welches Suchwort gibst du ein?"
                options: ["Elefant Schlaf", "lange", "Tiere im Zoo und was sie den ganzen Tag machen"]
                answer: "Elefant Schlaf"
              - id: l1-n5
                type: multiple_choice
                text: "Die Biene\nBienen sammeln Nektar. [Was ist Nektar?]\nAus Nektar machen sie Honig. [So entsteht Honig]\n\nDu weißt nicht, was Nektar ist. Auf welchen Link tippst du?"
                say: "Lies die Seite. Du weißt nicht, was Nektar ist. Auf welchen Link tippst du?"
                options: ["Was ist Nektar?", "So entsteht Honig", "Die Biene"]
                answer: "Was ist Nektar?"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Tierlexikon für Kinder\n[Startseite] [Säugetiere] [Vögel] [Insekten] [Suche]\n\nDu willst etwas über Ameisen lesen. Auf welchen Link tippst du?"
            say: "Lies die Seite. Du willst etwas über Ameisen lesen. Auf welchen Link tippst du?"
            options: ["Insekten", "Säugetiere", "Vögel"]
            answer: "Insekten"
          - id: l1-c2
            type: multiple_choice
            text: "Tierlexikon für Kinder > Säugetiere > Katze\n[Startseite] [Zurück]\n\nDu willst wieder zur Liste aller Säugetiere. Auf welchen Link tippst du?"
            say: "Lies die Seite. Du willst wieder zur Liste aller Säugetiere. Auf welchen Link tippst du?"
            options: ["Zurück", "Startseite", "Katze"]
            answer: "Zurück"
          - id: l1-c3
            type: multiple_choice
            text: "Du suchst etwas über Frösche. Welches Suchwort gibst du ein?"
            say: "Du suchst etwas über Frösche. Welches Suchwort gibst du ein?"
            options: ["Frosch", "grün", "Tiere, die quaken und im Teich hüpfen"]
            answer: "Frosch"

  - n: 2
    title: { de: "Text, Bild und Ton", en: "Text, pictures and sound" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Tierlexikon für Kinder\n[Startseite] [Säugetiere] [Vögel] [Insekten] [Suche]\n\nDu willst etwas über Störche lesen. Auf welchen Link tippst du?"
            say: "Lies die Seite. Du willst etwas über Störche lesen. Auf welchen Link tippst du?"
            options: ["Vögel", "Säugetiere", "Insekten"]
            answer: "Vögel"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Mit dem Link Zurück kommst du auf die Seite, auf der du vorher warst. Stimmt das?"
            say: "Mit dem Link Zurück kommst du auf die Seite, auf der du vorher warst. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Die Eule\nEulen jagen nachts. Sie können fast lautlos fliegen.\n[Bild: Eine Schleiereule mit weißem Gesicht sitzt auf einem Ast.]\n[Ton: So ruft ein Waldkauz]\n[Video: Eine Eule fängt eine Maus]"
            say: "Auf einer Internetseite gibt es nicht nur Text. Es gibt Bilder mit einer Bildunterschrift, Töne zum Anhören und Videos."
          - text: "Text: Eulen jagen nachts. | Bild: weißes Gesicht | Ton: der Ruf"
            say: "Jedes Teil erzählt etwas anderes. Wie die Eule aussieht, zeigt das Bild. Wie sie ruft, hörst du im Ton. Was sie tut, steht im Text."
          - text: "Frage: Welche Farbe hat das Gesicht der Schleiereule? → Bild"
            say: "Überlege bei jeder Frage: Steht die Antwort im Text, sehe ich sie im Bild, oder höre ich sie? Dann weißt du, wo du nachschauen musst."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Der Specht\nSpechte hämmern mit dem Schnabel Löcher in Bäume.\n[Bild: Ein Buntspecht mit rotem Fleck am Kopf]\n[Ton: So klopft ein Specht]\n\nWo erfährst du, wie das Klopfen klingt?"
                say: "Lies die Seite. Wo erfährst du, wie das Klopfen klingt?"
                options: ["im Ton", "im Bild", "in der Überschrift"]
                answer: "im Ton"
                feedback:
                  "im Bild": "Ein Bild zeigt, wie etwas aussieht. Wie etwas klingt, kann es nicht zeigen."
                hints:
                  - "Wie etwas klingt, musst du hören."
                  - "Welches Teil kann man anhören?"
                  - "im Ton."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Der Specht\nSpechte hämmern mit dem Schnabel Löcher in Bäume.\n[Bild: Ein Buntspecht mit rotem Fleck am Kopf]\n[Ton: So klopft ein Specht]\n\nWelche Farbe hat der Fleck am Kopf des Buntspechts?"
                say: "Lies die Seite. Welche Farbe hat der Fleck am Kopf des Buntspechts?"
                options: ["rot", "blau", "Das steht nirgends."]
                answer: "rot"
                hints:
                  - "Es steht nicht im Text."
                  - "Lies die Bildunterschrift."
                  - "Der Fleck ist rot."
              - id: l2-f3
                type: true_false
                text: "Der Delfin\nDelfine leben im Meer und atmen Luft.\n[Video: Delfine springen aus dem Wasser]\n\nZeigt dir das Video, wie Delfine springen?"
                say: "Lies die Seite. Zeigt dir das Video, wie Delfine springen?"
                answer: true
                hints:
                  - "Lies, was im Video zu sehen ist."
                  - "Delfine springen aus dem Wasser."
                  - "Ja, das zeigt das Video."
              - id: l2-f4
                type: sorting
                text: "Der Frosch\nFrösche legen Laich ins Wasser.\n[Bild: Ein grüner Frosch mit gelben Augen]\n[Ton: So quakt ein Wasserfrosch]\n\nWo findest du was?"
                say: "Lies die Seite. Sortiere: Findest du es im Text, im Bild oder im Ton?"
                bins:
                  - { id: text, show: { text: "Text" }, say: "Text" }
                  - { id: picture, show: { text: "Bild" }, say: "Bild" }
                  - { id: sound, show: { text: "Ton" }, say: "Ton" }
                options:
                  - { text: "wo Frösche den Laich ablegen", bin: text }
                  - { text: "welche Farbe die Augen haben", bin: picture }
                  - { text: "wie das Quaken klingt", bin: sound }
                hints:
                  - "Was steht im Text, was zeigt das Bild, was hört man?"
                  - "Farben sieht man."
                  - "Laich: Text. Augen: Bild. Quaken: Ton."
              - id: l2-f5
                type: multiple_choice
                text: "Der Igel\nIgel rollen sich bei Gefahr zusammen. [Video: Ein Igel rollt sich ein]\n\nDu verstehst den Satz nicht ganz. Was hilft dir?"
                say: "Lies die Seite. Du verstehst den Satz nicht ganz. Was hilft dir?"
                options: ["das Video ansehen", "die Seite schließen", "auf Startseite tippen"]
                answer: "das Video ansehen"
                hints:
                  - "Welches Teil gehört zu dem Satz?"
                  - "Im Video siehst du genau das, was der Satz sagt."
                  - "das Video ansehen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Der Wolf\nWölfe leben in Rudeln.\n[Bild: Fünf graue Wölfe im Schnee]\n[Ton: So heult ein Wolf]\n\nWo erfährst du, wie ein Wolf heult?"
                say: "Lies die Seite. Wo erfährst du, wie ein Wolf heult?"
                options: ["im Ton", "im Bild", "im Text"]
                answer: "im Ton"
                hints: ["Heulen musst du hören."]
              - id: l2-s2
                type: multiple_choice
                text: "Der Wolf\nWölfe leben in Rudeln.\n[Bild: Fünf graue Wölfe im Schnee]\n[Ton: So heult ein Wolf]\n\nWie viele Wölfe sind auf dem Bild?"
                say: "Lies die Seite. Wie viele Wölfe sind auf dem Bild?"
                options: ["fünf", "einer", "Das steht nirgends."]
                answer: "fünf"
                hints: ["Lies die Bildunterschrift."]
              - id: l2-s3
                type: true_false
                text: "Die Hummel\nHummeln fliegen auch bei kühlem Wetter.\n[Bild: Eine dicke Hummel auf einer Blüte]\n\nErfährst du im Bild, dass Hummeln bei kühlem Wetter fliegen?"
                say: "Lies die Seite. Erfährst du im Bild, dass Hummeln bei kühlem Wetter fliegen?"
                answer: false
                hints: ["Wo steht das mit dem kühlen Wetter?"]
              - id: l2-s4
                type: sorting
                text: "Der Papagei\nPapageien können Wörter nachsprechen.\n[Bild: Ein Papagei mit blauen und gelben Federn]\n[Ton: Ein Papagei sagt Hallo]\n\nWo findest du was?"
                say: "Lies die Seite. Sortiere: Findest du es im Text, im Bild oder im Ton?"
                bins:
                  - { id: text, show: { text: "Text" }, say: "Text" }
                  - { id: picture, show: { text: "Bild" }, say: "Bild" }
                  - { id: sound, show: { text: "Ton" }, say: "Ton" }
                options:
                  - { text: "dass Papageien Wörter nachsprechen", bin: text }
                  - { text: "welche Farben die Federn haben", bin: picture }
                  - { text: "wie der Papagei Hallo sagt", bin: sound }
                hints: ["Farben sieht man, Stimmen hört man."]
              - id: l2-s5
                type: multiple_choice
                text: "Was ist eine Bildunterschrift?"
                say: "Was ist eine Bildunterschrift?"
                options: ["ein kurzer Text, der sagt, was auf dem Bild ist", "die Überschrift ganz oben", "ein Link zur Startseite"]
                answer: "ein kurzer Text, der sagt, was auf dem Bild ist"
                hints: ["Wo steht sie: über dem Text oder beim Bild?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Die Fledermaus\nFledermäuse schlafen am Tag.\n[Bild: Eine Fledermaus hängt kopfüber an einem Balken]\n[Video: Fledermäuse fliegen in der Dämmerung aus]\n\nWo siehst du, wie Fledermäuse ausfliegen?"
                say: "Lies die Seite. Wo siehst du, wie Fledermäuse ausfliegen?"
                options: ["im Video", "im Bild", "im Text"]
                answer: "im Video"
              - id: l2-n2
                type: multiple_choice
                text: "Die Fledermaus\nFledermäuse schlafen am Tag.\n[Bild: Eine Fledermaus hängt kopfüber an einem Balken]\n\nWie schläft eine Fledermaus?"
                say: "Lies die Seite. Wie schläft eine Fledermaus?"
                options: ["kopfüber hängend", "auf dem Rücken liegend", "Das steht nirgends."]
                answer: "kopfüber hängend"
              - id: l2-n3
                type: true_false
                text: "Der Kuckuck\nDer Kuckuck legt seine Eier in fremde Nester.\n[Ton: So ruft der Kuckuck]\n\nKannst du im Ton hören, wie der Kuckuck ruft?"
                say: "Lies die Seite. Kannst du im Ton hören, wie der Kuckuck ruft?"
                answer: true
              - id: l2-n4
                type: sorting
                text: "Die Katze\nKatzen sehen im Dunkeln gut.\n[Bild: Eine getigerte Katze mit langem Schwanz]\n[Ton: So schnurrt eine Katze]\n\nWo findest du was?"
                say: "Lies die Seite. Sortiere: Findest du es im Text, im Bild oder im Ton?"
                bins:
                  - { id: text, show: { text: "Text" }, say: "Text" }
                  - { id: picture, show: { text: "Bild" }, say: "Bild" }
                  - { id: sound, show: { text: "Ton" }, say: "Ton" }
                options:
                  - { text: "dass Katzen im Dunkeln gut sehen", bin: text }
                  - { text: "wie das Fell aussieht", bin: picture }
                  - { text: "wie das Schnurren klingt", bin: sound }
              - id: l2-n5
                type: multiple_choice
                text: "Die Seite über Pinguine hat einen Text, ein Bild und ein Video. Du willst wissen, wie Pinguine watscheln. Was hilft dir am besten?"
                say: "Die Seite über Pinguine hat einen Text, ein Bild und ein Video. Du willst wissen, wie Pinguine watscheln. Was hilft dir am besten?"
                options: ["das Video", "das Bild", "die Überschrift"]
                answer: "das Video"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Tierlexikon für Kinder\n[Startseite] [Säugetiere] [Vögel] [Insekten] [Suche]\n\nDu willst etwas über Schmetterlinge lesen. Auf welchen Link tippst du?"
            say: "Lies die Seite. Du willst etwas über Schmetterlinge lesen. Auf welchen Link tippst du?"
            options: ["Insekten", "Vögel", "Säugetiere"]
            answer: "Insekten"
          - id: l2-c2
            type: multiple_choice
            text: "Der Esel\nEsel sind sehr trittsicher.\n[Bild: Ein grauer Esel mit langen Ohren]\n[Ton: So schreit ein Esel]\n\nWo erfährst du, wie ein Esel schreit?"
            say: "Lies die Seite. Wo erfährst du, wie ein Esel schreit?"
            options: ["im Ton", "im Bild", "im Text"]
            answer: "im Ton"
          - id: l2-c3
