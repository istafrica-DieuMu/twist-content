            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Haustür = Haus + Tür"
            say: "Man kann zusammengesetzte Nomen auch zerlegen. Haustür besteht aus Haus und Tür."
          - text: "Ein Baumhaus ist ein Haus."
            say: "Das letzte Wort sagt, was es ist. Ein Baumhaus ist ein Haus, und zwar ein Haus im Baum. Es ist kein Baum."
            show: { objects: [tree, house] }
          - text: "Ein Apfelbaum ist ein Baum."
            say: "Ein Apfelbaum ist ein Baum, an dem Äpfel wachsen. Das erste Wort sagt, was für einer es ist."
            show: { objects: [apple, tree] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Schneemann in zwei Nomen."
                frame: "Schneemann = _ + _"
                options: ["Schnee", "Mann", "Schne", "Emann"]
                answer: ["Schnee", "Mann"]
                hints:
                  - "Welches Wort hörst du am Anfang?"
                  - "Schnee am Anfang, Mann am Ende."
                  - "Schnee + Mann."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was ist ein Baumhaus?"
                show: { objects: [tree, house] }
                options: ["ein Haus", "ein Baum"]
                answer: "ein Haus"
                feedback:
                  "ein Baum": "Das letzte Wort sagt, was es ist. Bei Baumhaus ist das letzte Wort Haus."
                hints:
                  - "Das letzte Wort sagt, was es ist."
                  - "Das letzte Wort ist Haus."
                  - "Ein Baumhaus ist ein Haus."
              - id: l2-f3
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Zahnbürste in zwei Nomen."
                frame: "Zahnbürste = _ + _"
                options: ["Zahn", "Bürste", "Zahnb", "Ürste"]
                answer: ["Zahn", "Bürste"]
                hints:
                  - "Mit welchem Nomen fängt es an?"
                  - "Zahn und Bürste."
                  - "Zahn + Bürste."
              - id: l2-f4
                type: multiple_choice
                text: "Was ist ein Handschuh?"
                options: ["ein Schuh für die Hand", "eine Hand für den Schuh"]
                answer: "ein Schuh für die Hand"
                hints:
                  - "Das letzte Wort ist Schuh."
                  - "Es ist eine Art Schuh."
                  - "Ein Schuh für die Hand."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? Eine Kuhglocke ist eine Kuh."
                say: "Eine Kuhglocke ist eine Kuh. Stimmt das?"
                answer: false
                hints:
                  - "Welches Wort steht am Ende?"
                  - "Glocke steht am Ende."
                  - "Nein, eine Kuhglocke ist eine Glocke."
              - id: l2-f6
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes lange Wort mit seinem letzten Teil."
                option_audio: false
                pairs:
                  - { left: { text: "Regenschirm" }, right: { text: "Schirm" } }
                  - { left: { text: "Vogelnest" }, right: { text: "Nest" } }
                  - { left: { text: "Haustür" }, right: { text: "Tür" } }
                hints:
                  - "Schau auf das Ende von jedem langen Wort."
                  - "Regenschirm endet mit Schirm."
                  - "Schirm, Nest, Tür."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Kinderzimmer in zwei Nomen."
                frame: "Kinderzimmer = _ + _"
                options: ["Kinder", "Zimmer", "Kind", "Erzimmer"]
                answer: ["Kinder", "Zimmer"]
                hints: ["Ein Zimmer für Kinder."]
              - id: l2-s2
                type: multiple_choice
                text: "Was ist ein Apfelbaum?"
                options: ["ein Baum", "ein Apfel"]
                answer: "ein Baum"
                hints: ["Das letzte Wort sagt, was es ist."]
              - id: l2-s3
                type: multiple_choice
                text: "Was ist eine Tischlampe?"
                options: ["eine Lampe für den Tisch", "ein Tisch mit Lampe"]
                answer: "eine Lampe für den Tisch"
                hints: ["Lampe steht am Ende."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Ein Brotmesser ist ein Messer."
                say: "Ein Brotmesser ist ein Messer. Stimmt das?"
                answer: true
                hints: ["Welches Wort steht am Ende?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Gartentür in zwei Nomen."
                frame: "Gartentür = _ + _"
                options: ["Garten", "Tür", "Gart", "Entür"]
                answer: ["Garten", "Tür"]
                hints: ["Eine Tür im Garten."]
              - id: l2-s6
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes lange Wort mit seinem letzten Teil."
                option_audio: false
                pairs:
                  - { left: { text: "Schultasche" }, right: { text: "Tasche" } }
                  - { left: { text: "Handspiegel" }, right: { text: "Spiegel" } }
                  - { left: { text: "Schneemann" }, right: { text: "Mann" } }
                hints: ["Schau auf das Ende."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Regenschirm in zwei Nomen."
                frame: "Regenschirm = _ + _"
                options: ["Regen", "Schirm", "Rege", "Nschirm"]
                answer: ["Regen", "Schirm"]
              - id: l2-n2
                type: multiple_choice
                text: "Was ist ein Hausschuh?"
                options: ["ein Schuh", "ein Haus"]
                answer: "ein Schuh"
              - id: l2-n3
                type: true_false
                text: "Stimmt das? Ein Vogelnest ist ein Vogel."
                say: "Ein Vogelnest ist ein Vogel. Stimmt das?"
                answer: false
              - id: l2-n4
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Fußball in zwei Nomen."
                frame: "Fußball = _ + _"
                options: ["Fuß", "Ball", "Fu", "Sball"]
                answer: ["Fuß", "Ball"]
              - id: l2-n5
                type: multiple_choice
                text: "Was ist ein Tischbein?"
                options: ["ein Bein vom Tisch", "ein Tisch mit einem Bein"]
                answer: "ein Bein vom Tisch"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Zerlege das Wort."
            say: "Zerlege das Wort Haustür in zwei Nomen."
            frame: "Haustür = _ + _"
            options: ["Haus", "Tür", "Hau", "Stür"]
            answer: ["Haus", "Tür"]
          - id: l2-c2
            type: multiple_choice
            text: "Was ist ein Handspiegel?"
            options: ["ein Spiegel", "eine Hand"]
            answer: "ein Spiegel"
          - id: l2-c3
            type: true_false
            text: "Stimmt das? Ein Schneemann ist ein Mann aus Schnee."
            say: "Ein Schneemann ist ein Mann aus Schnee. Stimmt das?"
            answer: true

  - n: 3
    title: { de: Das letzte Wort bestimmt den Artikel, en: The last word decides the article }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Was ist ein Baumhaus?"
            show: { objects: [tree, house] }
            options: ["ein Haus", "ein Baum"]
            answer: "ein Haus"
            difficulty: easy
          - id: l3-w2
            type: fill_in_blank
            text: "Zerlege das Wort."
            say: "Zerlege das Wort Apfelbaum in zwei Nomen."
            frame: "Apfelbaum = _ + _"
            options: ["Apfel", "Baum", "Apf", "Elbaum"]
            answer: ["Apfel", "Baum"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "der Baum + das Haus = das Baumhaus"
            say: "Welcher Artikel passt zu Baumhaus? Der Baum, das Haus. Das letzte Wort bestimmt den Artikel. Das Haus, also das Baumhaus."
            show: { objects: [tree, house] }
          - text: "das Haus + die Tür = die Haustür"
            say: "Bei Haustür ist das letzte Wort die Tür. Also heißt es die Haustür."
          - text: "die Sonne + der Hut = der Sonnenhut"
            say: "Manchmal kommt ein Buchstabe dazwischen: Sonne und Hut werden zum Sonnenhut, mit einem n. Der Artikel kommt trotzdem vom letzten Wort: der Hut, also der Sonnenhut."
            show: { objects: [sun, hat] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: multiple_choice
                text: "der, die oder das? Baumhaus"
                say: "Welcher Artikel passt zu Baumhaus?"
                show: { objects: [tree, house] }
                options: ["der", "die", "das"]
                answer: "das"
                feedback:
                  "der": "Der Baum ist das erste Wort. Das letzte Wort bestimmt: das Haus."
                hints:
                  - "Welches Wort steht am Ende?"
                  - "Das Haus."
                  - "Das Baumhaus."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "der, die oder das? Tischlampe"
                say: "Welcher Artikel passt zu Tischlampe?"
                show: { objects: [table, lamp] }
                options: ["der", "die", "das"]
                answer: "die"
                hints:
                  - "Das letzte Wort ist Lampe."
                  - "Es heißt die Lampe."
                  - "Die Tischlampe."
              - id: l3-f3
                type: fill_in_blank
                text: "Welcher Artikel?"
                say: "Das Brot und das Messer. Welcher Artikel passt zu Brotmesser?"
                frame: "_ Brotmesser"
                options: ["der", "die", "das"]
                answer: ["das"]
                hints:
                  - "Das letzte Wort ist Messer."
                  - "Es heißt das Messer."
                  - "Das Brotmesser."
              - id: l3-f4
                type: true_false
                text: "Stimmt das? die Kuh + die Glocke = die Kuhglocke"
                say: "Die Kuh und die Glocke werden die Kuhglocke. Stimmt das?"
                show: { objects: [cow, bell] }
                answer: true
                hints:
                  - "Das letzte Wort ist Glocke."
                  - "Es heißt die Glocke."
                  - "Ja, die Kuhglocke."
              - id: l3-f5
                type: multiple_choice
                text: "der, die oder das? Handschuh"
                say: "Welcher Artikel passt zu Handschuh?"
                show: { objects: [hand, shoe] }
                options: ["der", "die", "das"]
                answer: "der"
                feedback:
                  "die": "Die Hand ist das erste Wort. Das letzte Wort bestimmt: der Schuh."
                hints:
                  - "Welches Wort steht am Ende?"
                  - "Der Schuh."
                  - "Der Handschuh."
              - id: l3-f6
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seinem Artikel."
                option_audio: false
                pairs:
                  - { left: { text: "Haustür" }, right: { text: "die" } }
                  - { left: { text: "Tischbein" }, right: { text: "das" } }
                  - { left: { text: "Apfelbaum" }, right: { text: "der" } }
                hints:
                  - "Schau auf das letzte Wort."
                  - "die Tür, das Bein, der Baum."
                  - "die Haustür, das Tischbein, der Apfelbaum."

          - support: some
            tasks:
              - id: l3-s1
                type: multiple_choice
                text: "der, die oder das? Haustür"
                say: "Welcher Artikel passt zu Haustür?"
                options: ["der", "die", "das"]
                answer: "die"
                hints: ["Die Tür."]
              - id: l3-s2
                type: fill_in_blank
                text: "Welcher Artikel?"
                say: "Der Tisch und das Bein. Welcher Artikel passt zu Tischbein?"
                frame: "_ Tischbein"
                options: ["der", "die", "das"]
                answer: ["das"]
                hints: ["Das letzte Wort entscheidet."]
              - id: l3-s3
                type: multiple_choice
                text: "der, die oder das? Sonnenhut"
