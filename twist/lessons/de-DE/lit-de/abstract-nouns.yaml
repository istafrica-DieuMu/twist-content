# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.abstract-nouns
skill: lit-de.nouns.abstract
curriculum: de-DE
language: de
title:
  de: Nomen, die man nicht anfassen kann
  en: Nouns you cannot touch
summary: >
  Feelings, ideas and times are nouns too (die Freude, das Glück, der
  Mut), even though you cannot touch them. Lesson 1 sorts concrete and
  abstract nouns and uses the article test (can der, die or das go in
  front?); lesson 2 finds abstract nouns in sentences written all in small
  letters and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Nomen, en: Nouns }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.nouns.endings]
  also_practises: [lit-de.nouns.recognise]
  vocabulary: { de: [Nomen, Gefühl, anfassen, Artikelprobe, großschreiben] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: touch-only
      what: Thinks only things you can touch are nouns, so writes die angst
      addressed: Learn shows feelings as nouns and teaches the article test; check feedback on angst names it
    - id: verb-or-adjective
      what: Writes the verb or adjective with a capital too (Freuen, Mutig)
      addressed: lesson 1 pairs nouns with words of the same family (die Freude, sich freuen; die Angst, ängstlich)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Die Artikelprobe, en: The article test }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Frei wird zu einem Nomen. Welche Endung passt?"
            frame: "die Frei_"
            options: ["heit", "keit", "ung"]
            answer: ["heit"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
            options: ["laufen", "tisch", "schnell"]
            answer: "tisch"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "der Tisch, die Freude"
            say: "Einen Tisch kann man anfassen. Freude kann man nicht anfassen, man fühlt sie. Trotzdem sind beide Nomen."
            show: { object: table }
          - text: "die Freude, das Glück, der Mut"
            say: "Gefühle und Gedanken sind auch Nomen: die Freude, das Glück, der Mut, die Angst. Man schreibt sie groß."
          - text: "Artikelprobe: die ... Angst"
            say: "So prüfst du es: Kannst du der, die oder das davor setzen? Die Angst, das geht. Also ist Angst ein Nomen. Die ängstlich geht nicht, also ist ängstlich kein Nomen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
                options: ["mutig", "mut", "mutiger"]
                answer: "mut"
                option_audio: false
                hints:
                  - "Mach die Artikelprobe."
                  - "Der Mut geht. Der mutig geht nicht."
                  - "Mut ist ein Nomen."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Freude ist ein Nomen, obwohl man sie nicht anfassen kann."
                answer: true
                hints:
                  - "Kannst du einen Artikel davor setzen?"
                  - "Die Freude."
                  - "Ja, Freude ist ein Nomen."
              - id: l1-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Nomen mit seinem Artikel."
                option_audio: false
                pairs:
                  - { left: { text: "Glück" }, right: { text: "das" } }
                  - { left: { text: "Angst" }, right: { text: "die" } }
                  - { left: { text: "Mut" }, right: { text: "der" } }
                hints:
                  - "Sag jedes Wort mit der, die und das. Was klingt richtig?"
                  - "Das Glück, die Angst."
                  - "das Glück, die Angst, der Mut."
              - id: l1-f4
                type: multiple_choice
                text: "Welches Wort ist kein Nomen?"
                say: "Alle Wörter sind klein geschrieben. Welches Wort ist kein Nomen? Mach die Artikelprobe."
                options: ["wut", "hoffnung", "wütend"]
                answer: "wütend"
                option_audio: false
                hints:
                  - "Mach mit jedem Wort die Artikelprobe."
                  - "Die Wut und die Hoffnung gehen."
                  - "Wütend ist kein Nomen."
              - id: l1-f5
                type: multiple_choice
                text: "Kann man es anfassen?"
                say: "Welches Nomen kann man anfassen?"
                options: ["der Stein", "die Idee", "die Zeit"]
                answer: "der Stein"
                hints:
                  - "Was kann man in die Hand nehmen?"
                  - "Eine Idee hat man im Kopf."
                  - "Den Stein kann man anfassen."
              - id: l1-f6
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Nomen mit einem Wort aus derselben Wortfamilie."
                option_audio: false
                pairs:
                  - { left: { text: "die Freude" }, right: { text: "sich freuen" } }
                  - { left: { text: "die Angst" }, right: { text: "ängstlich" } }
                  - { left: { text: "die Liebe" }, right: { text: "lieben" } }
                hints:
                  - "Welche Wörter klingen ähnlich?"
                  - "Angst und ängstlich."
                  - "Freude und sich freuen, Angst und ängstlich, Liebe und lieben."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
                options: ["traurig", "trauer", "trauern"]
                answer: "trauer"
                option_audio: false
                hints: ["Die Trauer."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Zeit ist kein Nomen, weil man sie nicht sehen kann."
                answer: false
                hints: ["Die Zeit."]
              - id: l1-s3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Nomen mit seinem Artikel."
                option_audio: false
                pairs:
                  - { left: { text: "Idee" }, right: { text: "die" } }
                  - { left: { text: "Spaß" }, right: { text: "der" } }
                  - { left: { text: "Wissen" }, right: { text: "das" } }
                hints: ["Sag die Wörter mit Artikel."]
              - id: l1-s4
                type: multiple_choice
                text: "Welches Wort ist kein Nomen?"
                say: "Alle Wörter sind klein geschrieben. Welches Wort ist kein Nomen? Mach die Artikelprobe."
                options: ["stolz", "eifer", "ruhe"]
                answer: "stolz"
                option_audio: false
                hints: ["Artikelprobe."]
              - id: l1-s5
                type: multiple_choice
                text: "Kann man es anfassen?"
                say: "Welches Nomen kann man nicht anfassen?"
                options: ["der Ball", "der Traum", "die Tasse"]
                answer: "der Traum"
                hints: ["Was hat man nur im Kopf?"]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Man schreibt: Ich habe große Lust."
                answer: true
                hints: ["Die Lust."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
                options: ["ruhig", "ruhe", "ruhen"]
                answer: "ruhe"
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "Stimmt das? Durst ist ein Nomen."
                answer: true
              - id: l1-n3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Nomen mit seinem Artikel."
                option_audio: false
                pairs:
                  - { left: { text: "Geduld" }, right: { text: "die" } }
                  - { left: { text: "Hunger" }, right: { text: "der" } }
                  - { left: { text: "Vertrauen" }, right: { text: "das" } }
              - id: l1-n4
                type: multiple_choice
                text: "Welches Wort ist kein Nomen?"
                say: "Alle Wörter sind klein geschrieben. Welches Wort ist kein Nomen? Mach die Artikelprobe."
                options: ["neugier", "neugierig", "sorge"]
                answer: "neugierig"
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Kann man es anfassen?"
                say: "Welches Nomen kann man nicht anfassen?"
                options: ["die Schere", "die Wahrheit", "das Heft"]
                answer: "die Wahrheit"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
            options: ["glücklich", "glück", "glücklicher"]
            answer: "glück"
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Man schreibt: Ich habe angst vor Spinnen."
            answer: false
            feedback:
              "true": "Angst kann man nicht anfassen, aber es ist ein Nomen: die Angst. Man schreibt es groß."
          - id: l1-c3
            type: multiple_choice
            text: "Welches Wort ist kein Nomen?"
            say: "Alle Wörter sind klein geschrieben. Welches Wort ist kein Nomen? Mach die Artikelprobe."
            options: ["mut", "freude", "freundlich"]
            answer: "freundlich"
            option_audio: false

  - n: 2
    title: { de: Nomen im Satz finden, en: Finding nouns in a sentence }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
            options: ["mutig", "mut", "mutiger"]
            answer: "mut"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Angst ist ein Nomen."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "ich habe heute viel spaß."
            say: "Dieser Satz ist ganz klein geschrieben. Welche Wörter sind Nomen? Mach bei jedem Wort die Artikelprobe."
            show: { drawn: letter-card, text: "ich habe heute viel spaß" }
          - text: "der Spaß"
            say: "Der Spaß, das geht. Der heute, der viel, das geht nicht. Nur Spaß ist ein Nomen."
          - text: "Ich habe heute viel Spaß."
            say: "Richtig geschrieben: Ich habe heute viel Spaß. Das erste Wort im Satz ist sowieso groß."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "mia hat große angst vor dem gewitter" }
                spans: ["mia", "angst", "gewitter"]
                hints:
                  - "Namen sind auch Nomen."
                  - "Die Angst, das Gewitter."
                  - "mia, angst und gewitter."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "die freude über das geschenk war groß" }
                spans: ["freude", "geschenk"]
                hints:
                  - "Mach bei jedem Wort die Artikelprobe."
                  - "Die Freude, das Geschenk."
                  - "freude und geschenk."
              - id: l2-f3
                type: multiple_choice
                text: "Welches Wort im Satz ist ein Nomen? \"wir hatten viel glück.\""
                options: ["hatten", "viel", "glück"]
                answer: "glück"
                option_audio: false
                hints:
                  - "Artikelprobe."
                  - "Das Glück."
                  - "glück."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Man schreibt: Die Kinder hatten große Langeweile."
                answer: true
                hints:
                  - "Welche Wörter sind Nomen?"
                  - "Die Kinder, die Langeweile."
                  - "Ja, richtig geschrieben."
              - id: l2-f5
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "mit geduld baut ben einen turm" }
                spans: ["geduld", "ben", "turm"]
                hints:
                  - "Auch Namen."
                  - "Die Geduld, der Turm."
                  - "geduld, ben und turm."
              - id: l2-f6
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                options: ["Der Mut hat ihr geholfen.", "Der mut hat ihr geholfen.", "Der Mut Hat ihr geholfen."]
                answer: "Der Mut hat ihr geholfen."
                option_audio: false
                hints:
                  - "Welche Wörter sind Nomen?"
                  - "Nur Mut ist ein Nomen."
                  - "Der Mut hat ihr geholfen."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "die wut verging nach einer pause" }
                spans: ["wut", "pause"]
                hints: ["Zwei Nomen."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "lena hat eine gute idee" }
                spans: ["lena", "idee"]
                hints: ["Ein Name und ein Gedanke."]
              - id: l2-s3
                type: multiple_choice
                text: "Welches Wort im Satz ist ein Nomen? \"er hatte keine zeit.\""
                options: ["hatte", "keine", "zeit"]
                answer: "zeit"
                option_audio: false
                hints: ["Die Zeit."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Man schreibt: Die Hoffnung war Groß."
                answer: false
                hints: ["Ist groß ein Nomen?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                options: ["Wir haben Hunger.", "Wir haben hunger.", "Wir Haben Hunger."]
                answer: "Wir haben Hunger."
                option_audio: false
                hints: ["Der Hunger."]
              - id: l2-s6
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "die stille im wald war schön" }
                spans: ["stille", "wald"]
                hints: ["Die Stille, der Wald."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "die sorge um den hund war groß" }
                spans: ["sorge", "hund"]
              - id: l2-n2
                type: multiple_choice
                text: "Welches Wort im Satz ist ein Nomen? \"sie spürte große müdigkeit.\""
                options: ["spürte", "große", "müdigkeit"]
                answer: "müdigkeit"
                option_audio: false
              - id: l2-n3
                type: true_false
                text: "Stimmt das? Man schreibt: Nach dem Streit kam die Versöhnung."
                answer: true
              - id: l2-n4
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "tom sagt die wahrheit" }
                spans: ["tom", "wahrheit"]
              - id: l2-n5
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                options: ["Das Vertrauen ist wichtig.", "Das vertrauen ist wichtig.", "Das Vertrauen ist Wichtig."]
                answer: "Das Vertrauen ist wichtig."
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
            options: ["neugierig", "neugier", "neugieriger"]
            answer: "neugier"
            option_audio: false
          - id: l2-c2
            type: highlight_in_text
            text: "Tippe auf jedes Nomen."
            say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
            show: { drawn: letter-card, text: "die kinder hatten großen spaß" }
            spans: ["kinder", "spaß"]
          - id: l2-c3
            type: true_false
            text: "Stimmt das? Man schreibt: Er zeigte viel mut."
            answer: false
          - id: l2-c4
            type: matching
            text: "Was passt zusammen?"
            say: "Verbinde jedes Nomen mit seinem Artikel."
            option_audio: false
            pairs:
              - { left: { text: "Wut" }, right: { text: "die" } }
              - { left: { text: "Ärger" }, right: { text: "der" } }
              - { left: { text: "Lachen" }, right: { text: "das" } }
          - id: l2-c5
            type: multiple_choice
            text: "Welcher Satz ist richtig geschrieben?"
            options: ["Die Freude war riesig.", "Die freude war riesig.", "Die Freude War riesig."]
            answer: "Die Freude war riesig."
            option_audio: false
