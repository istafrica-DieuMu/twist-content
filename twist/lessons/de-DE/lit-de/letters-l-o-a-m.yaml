# Model lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-l-o-a-m
skill: lit-de.letters.l-o-a-m
curriculum: de-DE
language: de
title:
  de: Die Buchstaben L, O, A und M
  en: The letters L, O, A and M
summary: >
  The first four letters in Fibel order, chosen because their sounds can be
  held (lll, ooo, aaa, mmm) and they make words at once: Oma, Mama, Lama.
  One lesson per letter: hear the sound, find it at the start of words, see
  and trace the letter. The fifth lesson blends the first syllables, reads
  three words and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 8
  builds_on: [lit-de.letters.sound-chart, lit-de.phonological.initial-sound]
  also_practises: [lit-de.handwriting.print-letters, lit-de.decoding.blend-syllables]
  vocabulary: { de: [Buchstabe, Laut, Anlaut, Silbe, Großbuchstabe, Kleinbuchstabe] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, syllable-arcs, word-card]
  sounds: ["de.l", "de.o:", "de.a:", "de.a", "de.m", "de.ma", "de.mo", "de.la", "de.lo"]
  facets: [script]
  misconceptions:
    - id: letter-name
      what: Says the letter name (El, Em) instead of the sound (lll, mmm), which blocks blending
      addressed: Learn always plays the sound, never the name; feedback repeats the sound
    - id: o-a-confusion
      what: Mixes up O and A by shape and sound
      addressed: lesson 3 practises O against A; the skill check asks both
    - id: m-n-later
      what: Confuses M with N later
      addressed: not yet; N comes with the group E, N, D, U, where it is contrasted with M
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-12

lessons:
  - n: 1
    title: { de: Das L, en: The letter L }
    new_content: true
    activities:
      - activity: learn
        mode: new-sound
        screens:
          - text: "L l"
            say: "Das ist das L. Es klingt so: lll. Wie bei Lama und Löwe."
            show: { drawn: letter-card, text: "Ll" }
            sound: de.l
            character: pip-point
          - text: "Lama"
            say: "Lama. Hörst du das lll am Anfang?"
            show: { object: llama }
          - text: "Löwe"
            say: "Löwe. Lll, Löwe."
            show: { object: lion }

      - activity: practise
        support: full
        setting: plain
        tasks:
          - id: l1-p1
            type: image_multiple_choice
            text: "Was fängt mit L an?"
            say: "Tippe auf das Bild, das mit lll anfängt."
            options: [{ object: lamp }, { object: sun }, { object: fish }]
            answer: lamp
            feedback: { sun: "Sonne fängt mit sss an.", fish: "Fisch fängt mit fff an." }
            hints:
              - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
              - "Lampe ... lll. Sonne ... sss. Fisch ... fff."
              - "Lampe fängt mit lll an."
            difficulty: easy
          - id: l1-p2
            type: true_false
            text: "Hörst du am Anfang ein L?"
            say: "Leiter. Hörst du am Anfang ein lll?"
            show: { object: ladder }
            answer: true
            hints: ["Sprich es mit: Lll-eiter.", "Der erste Laut ist lll.", "Ja, Leiter fängt mit L an."]
            difficulty: easy
          - id: l1-p3
            type: true_false
            text: "Hörst du am Anfang ein L?"
            say: "Baum. Hörst du am Anfang ein lll?"
            show: { object: tree }
            answer: false
            hints: ["Sprich es mit: B-aum.", "Der erste Laut ist bbb.", "Nein, Baum fängt mit B an."]
            difficulty: easy
          - id: l1-p4
            type: highlight_in_text
            text: "Tippe auf jedes L."
            say: "Tippe auf jedes große und kleine L."
            show: { drawn: letter-card, text: "L o l M L a" }
            spans: "L, l, L"
            hints: ["Das große L sieht aus wie eine Ecke.", "Das kleine l ist ein langer Strich.", "Es sind drei: L, l, L."]
            difficulty: core
          - id: l1-p5
            type: tracing
            text: "Schreib das kleine l nach."
            show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }
            char: "l"
            difficulty: easy
          - id: l1-p6
            type: tracing
            text: "Schreib das große L nach."
            show: { drawn: writing-lines, text: "L", mode: trace, arrows: true }
            char: "L"
            difficulty: easy

      - activity: check
        size: quick
        tasks:
          - { id: l1-c1, type: image_multiple_choice, text: "Was fängt mit L an?", say: "Was fängt mit lll an?", options: [{ object: spoon }, { object: dog }, { object: egg }], answer: spoon, difficulty: core }
          - { id: l1-c2, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: de.l }, options: ["L", "M", "S"], answer: "L", difficulty: core }
          - { id: l1-c3, type: true_false, text: "Hörst du am Anfang ein L?", say: "Löwe. Hörst du am Anfang ein lll?", show: { object: lion }, answer: true, difficulty: easy }

  - n: 2
    title: { de: Das O, en: The letter O }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - { id: l2-w1, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: de.l }, options: ["L", "O"], answer: "L", difficulty: easy }
          - { id: l2-w2, type: image_multiple_choice, text: "Was fängt mit L an?", options: [{ object: lamp }, { object: house }], answer: lamp, difficulty: easy }

      - activity: learn
        mode: new-sound
        screens:
          - text: "O o"
            say: "Das ist das O. Es klingt so: ooo. Wie bei Oma und Ofen."
            show: { drawn: letter-card, text: "Oo" }
            sound: "de.o:"
            character: pip-point
          - text: "Oma"
            say: "Oma. Ooo-ma."
            show: { object: grandma }
          - text: "Ohr"
            say: "Ohr. Hörst du das ooo?"
            show: { object: ear }

      - activity: practise
        support: full
        setting: plain
        tasks:
          - id: l2-p1
            type: image_multiple_choice
            text: "Was fängt mit O an?"
            options: [{ object: oven }, { object: mouse }, { object: banana }]
            answer: oven
            feedback: { mouse: "Maus fängt mit mmm an.", banana: "Banane fängt mit bbb an." }
            hints: ["Sprich jedes Wort langsam.", "Ofen ... ooo. Maus ... mmm. Banane ... bbb.", "Ofen fängt mit O an."]
            difficulty: easy
          - id: l2-p2
            type: true_false
            text: "Hörst du am Anfang ein O?"
            say: "Ohr. Hörst du am Anfang ein ooo?"
            show: { object: ear }
            answer: true
            hints: ["Sprich es lang: Ooohr.", "Der erste Laut ist ooo.", "Ja, Ohr fängt mit O an."]
            difficulty: easy
          - id: l2-p3
            type: audio_choice
            text: "Welcher Buchstabe klingt so?"
            audio: { sound: "de.o:" }
            options: ["O", "L", "A"]
            answer: "O"
            hints: ["Hör noch einmal hin.", "Der Mund wird beim O ganz rund.", "Das ist das O."]
            difficulty: core
          - id: l2-p4
            type: highlight_in_text
            text: "Tippe auf jedes O."
            show: { drawn: letter-card, text: "O a o L O" }
            spans: "O, o, O"
            hints: ["Das O ist ein Kreis.", "Das große O ist groß und rund, das kleine o ist klein und rund.", "Es sind drei: O, o, O."]
            difficulty: core
          - id: l2-p5
            type: tracing
            text: "Schreib das O nach."
            show: { drawn: writing-lines, text: "O o", mode: trace, arrows: true }
            char: "O"
            difficulty: easy

      - activity: check
        size: quick
        tasks:
          - { id: l2-c1, type: image_multiple_choice, text: "Was fängt mit O an?", options: [{ object: grandma }, { object: sun }, { object: dog }], answer: grandma, difficulty: core }
          - { id: l2-c2, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: "de.o:" }, options: ["L", "O"], answer: "O", difficulty: core }
          - { id: l2-c3, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: de.l }, options: ["L", "O"], answer: "L", difficulty: core }

  - n: 3
    title: { de: Das A, en: The letter A }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - { id: l3-w1, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: "de.o:" }, options: ["O", "L"], answer: "O", difficulty: easy }

      - activity: learn
        mode: new-sound
        screens:
          - text: "A a"
            say: "Das ist das A. Es klingt so: aaa. Wie bei Ameise und Affe."
            show: { drawn: letter-card, text: "Aa" }
            sound: "de.a:"
            character: pip-point
          - text: "Ameise"
            say: "Ameise. Aaa-meise."
            show: { object: ant }
          - text: "Affe"
            say: "Affe. Hier ist das a ganz kurz: a, Affe."
            show: { object: monkey }
            sound: de.a

      - activity: practise
        support: full
        setting: plain
        tasks:
          - id: l3-p1
            type: image_multiple_choice
            text: "Was fängt mit A an?"
            options: [{ object: monkey }, { object: ear }, { object: lion }]
            answer: monkey
            feedback: { ear: "Ohr fängt mit ooo an. Das ist das O.", lion: "Löwe fängt mit lll an." }
            hints: ["Sprich jedes Wort langsam.", "Affe ... a. Ohr ... ooo. Löwe ... lll.", "Affe fängt mit A an."]
            difficulty: easy
          - id: l3-p2
            type: audio_choice
            text: "O oder A?"
            say: "Hör gut hin: Welcher Buchstabe klingt so?"
            audio: { sound: "de.a:" }
            options: ["O", "A"]
            answer: "A"
            feedback: { "O": "Beim O wird der Mund rund. Beim A ist er weit offen: aaa." }
            hints: ["Hör noch einmal hin.", "Ist dein Mund rund oder weit offen?", "Das ist das A."]
            difficulty: core
          - id: l3-p3
            type: image_multiple_choice
            text: "Was fängt mit A an?"
            options: [{ object: oven }, { object: apple }]
            answer: apple
            feedback: { oven: "Ofen fängt mit ooo an." }
            hints: ["Sprich beide Wörter langsam.", "Apfel ... a. Ofen ... ooo.", "Apfel fängt mit A an."]
            difficulty: core
          - id: l3-p4
            type: highlight_in_text
            text: "Tippe auf jedes A."
            show: { drawn: letter-card, text: "A o a O A" }
            spans: "A, a, A"
            hints: ["Das große A sieht aus wie ein Dach.", "Das kleine a ist rund mit einem Strich.", "Es sind drei: A, a, A."]
            difficulty: core
          - id: l3-p5
            type: tracing
            text: "Schreib das A nach."
            show: { drawn: writing-lines, text: "A a", mode: trace, arrows: true }
            char: "A"
            difficulty: easy

      - activity: check
        size: quick
        tasks:
          - { id: l3-c1, type: audio_choice, text: "O oder A?", audio: { sound: "de.a:" }, options: ["O", "A"], answer: "A", difficulty: core }
          - { id: l3-c2, type: audio_choice, text: "O oder A?", audio: { sound: "de.o:" }, options: ["O", "A"], answer: "O", difficulty: core }
          - { id: l3-c3, type: image_multiple_choice, text: "Was fängt mit A an?", options: [{ object: ant }, { object: grandma }, { object: lamp }], answer: ant, difficulty: core }

  - n: 4
    title: { de: Das M, en: The letter M }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - { id: l4-w1, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: "de.a:" }, options: ["A", "O", "L"], answer: "A", difficulty: easy }

      - activity: learn
        mode: new-sound
        screens:
          - text: "M m"
            say: "Das ist das M. Es klingt so: mmm. Wie bei Maus und Mama."
            show: { drawn: letter-card, text: "Mm" }
            sound: de.m
            character: pip-point
          - text: "Maus"
            say: "Maus. Mmm-aus."
            show: { object: mouse }
          - text: "M + a = Ma"
            say: "Jetzt verbinden wir zwei Laute. Mmm und aaa. Mmmaaa. Ma."
            show: { drawn: syllable-arcs, word: "Ma", syllables: ["Ma"] }
            sound: de.ma

      - activity: practise
        support: full
        setting: plain
        tasks:
          - id: l4-p1
            type: image_multiple_choice
            text: "Was fängt mit M an?"
            options: [{ object: moon }, { object: lion }, { object: oven }]
            answer: moon
            feedback: { lion: "Löwe fängt mit lll an.", oven: "Ofen fängt mit ooo an." }
            hints: ["Sprich jedes Wort langsam.", "Mond ... mmm. Löwe ... lll. Ofen ... ooo.", "Mond fängt mit M an."]
            difficulty: easy
          - id: l4-p2
            type: true_false
            text: "Hörst du am Anfang ein M?"
            say: "Mütze. Hörst du am Anfang ein mmm?"
            show: { object: woolly-hat }
            answer: true
            hints: ["Sprich es mit: Mmm-ütze.", "Der erste Laut ist mmm.", "Ja, Mütze fängt mit M an."]
            difficulty: easy
          - id: l4-p3
            type: audio_choice
            text: "Was hörst du?"
            say: "Hör zu und tippe auf die Silbe."
            audio: { sound: de.mo }
            options: ["Ma", "Mo"]
            answer: "Mo"
            hints: ["Hör auf den zweiten Laut.", "Mmm ... ooo. Ist der Mund rund?", "Mo."]
            difficulty: core
          - id: l4-p4
            type: tracing
            text: "Schreib das M nach."
            show: { drawn: writing-lines, text: "M m", mode: trace, arrows: true }
            char: "M"
            difficulty: easy

      - activity: check
        size: quick
        tasks:
          - { id: l4-c1, type: image_multiple_choice, text: "Was fängt mit M an?", options: [{ object: knife }, { object: ear }, { object: tree }], answer: knife, difficulty: core }
          - { id: l4-c2, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: de.m }, options: ["M", "L", "A"], answer: "M", difficulty: core }
          - { id: l4-c3, type: audio_choice, text: "Was hörst du?", audio: { sound: de.ma }, options: ["Ma", "Mo"], answer: "Ma", difficulty: core }

  - n: 5
    title: { de: "L, O, A und M zusammen", en: "L, O, A and M together" }
    new_content: false
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - { id: l5-w1, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: de.m }, options: ["M", "O"], answer: "M", difficulty: easy }
          - { id: l5-w2, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: de.l }, options: ["A", "L"], answer: "L", difficulty: easy }

      - activity: practise
        support: some
        setting: plain
        tasks:
          - id: l5-p1
            type: audio_choice
            text: "Welche Silbe hörst du?"
            audio: { sound: de.la }
            options: ["La", "Lo", "Ma"]
            answer: "La"
            hints: ["Hör auf den ersten und den zweiten Laut: lll ... aaa."]
            difficulty: core
          - id: l5-p2
            type: audio_choice
            text: "Welche Silbe hörst du?"
            audio: { sound: de.lo }
            options: ["Mo", "Lo", "La"]
            answer: "Lo"
            hints: ["Hör auf den ersten Laut. Ist es lll oder mmm?"]
            difficulty: core
          - id: l5-p3
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            say: "Lies das Wort leise mit. Welches Bild passt?"
            show: { drawn: syllable-arcs, word: "Oma", syllables: ["O", "ma"] }
            options: [{ object: grandma }, { object: mum }, { object: llama }]
            answer: grandma
            hints: ["Lies Silbe für Silbe: O ... ma."]
            difficulty: core
          - id: l5-p4
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: syllable-arcs, word: "Lama", syllables: ["La", "ma"] }
            options: [{ object: grandma }, { object: llama }, { object: mum }]
            answer: llama
            hints: ["Lies Silbe für Silbe: La ... ma."]
            difficulty: core

      - activity: practise
        support: none
        setting: plain
        tasks:
          - { id: l5-q1, type: image_multiple_choice, text: "Lies das Wort. Welches Bild passt?", show: { drawn: syllable-arcs, word: "Mama", syllables: ["Ma", "ma"] }, options: [{ object: mum }, { object: grandma }, { object: llama }], answer: mum, difficulty: core }
          - { id: l5-q2, type: fill_in_blank, text: "Welcher Buchstabe fehlt?", say: "Lama. Welcher Buchstabe fehlt am Anfang?", show: { object: llama }, frame: "_ama", options: ["L", "M", "O"], answer: ["L"], difficulty: core }
          - { id: l5-q3, type: fill_in_blank, text: "Welcher Buchstabe fehlt?", say: "Oma. Welcher Buchstabe fehlt am Anfang?", show: { object: grandma }, frame: "_ma", options: ["A", "O", "M"], answer: ["O"], difficulty: core }

      - activity: check
        size: skill
        tasks:
          - { id: l5-c1, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: "de.o:" }, options: ["O", "A", "M"], answer: "O", difficulty: core }
          - { id: l5-c2, type: audio_choice, text: "Welcher Buchstabe klingt so?", audio: { sound: de.l }, options: ["M", "L", "A"], answer: "L", difficulty: core }
          - { id: l5-c3, type: image_multiple_choice, text: "Was fängt mit A an?", options: [{ object: apple }, { object: moon }, { object: oven }], answer: apple, difficulty: core }
          - { id: l5-c4, type: audio_choice, text: "Welche Silbe hörst du?", audio: { sound: de.mo }, options: ["Mo", "Lo", "Ma"], answer: "Mo", difficulty: core }
          - { id: l5-c5, type: image_multiple_choice, text: "Lies das Wort. Welches Bild passt?", show: { drawn: word-card, text: "Mama" }, options: [{ object: mum }, { object: grandma }, { object: llama }], answer: mum, difficulty: core }
