# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.idioms
skill: lit-de.vocabulary.idioms
curriculum: de-DE
language: de
title:
  de: Redewendungen und Sprichwörter
  en: Idioms and proverbs
summary: >
  Sayings that mean more than their words. Lesson 1 takes Redewendungen
  (Tomaten auf den Augen haben, jemandem einen Bären aufbinden, Schwein
  haben, auf dem Schlauch stehen), sets the literal picture against what
  is meant, and matches each to its meaning; lesson 2 adds Sprichwörter
  (Übung macht den Meister, Lügen haben kurze Beine), tells a Sprichwort
  from a Redewendung, picks the saying that fits a scene, and ends with
  the skill check. All scenes are written for Twist.
metadata:
  year: klasse-4
  topic: { de: Sprache untersuchen, en: Exploring language }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.comprehension.infer]
  also_practises: [lit-de.comprehension.infer]
  vocabulary: { de: [Redewendung, Sprichwort, wörtlich, übertragen, Bedeutung] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: literal-reading
      what: Takes a Redewendung literally (real tomatoes, a real pig, a real bear)
      addressed: "lesson 1 Learn sets the literal picture against the meaning; l1-f1 gives feedback on the literal option; l1-f3, l1-n3 and l2-c2 ask a literal question to be answered Nein; l1-f5, l1-n5 sort wörtlich from übertragen"
    - id: idiom-proverb
      what: Mixes up Redewendung and Sprichwort, or changes the fixed words of a Sprichwort
      addressed: "lesson 2 Learn shows that a Redewendung fits into a sentence and a Sprichwort stands as a whole sentence; l2-f2, l2-s2, l2-n2 and l2-c3 sort them; l2-f4, l2-s4 and l2-n4 complete the fixed words"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was ist gemeint?", en: "What does it mean?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Lea zieht ihre Gummistiefel an und nimmt den Schirm mit. Wie ist das Wetter?"
            options: ["Es regnet.", "Die Sonne scheint.", "Es schneit."]
            answer: "Es regnet."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Paul gähnt und reibt sich die Augen. Wie fühlt er sich?"
            options: ["müde", "wütend", "hungrig"]
            answer: "müde"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mia sucht ihre Brille. Sie liegt direkt vor ihr.\nPapa lacht: „Du hast wohl Tomaten auf den Augen!“"
            say: "Mia hat natürlich keine Tomaten auf den Augen. Papa meint: Du siehst etwas nicht, obwohl es direkt vor dir liegt. Wörter, die zusammen etwas anderes bedeuten, als sie sagen, nennt man eine Redewendung."
          - text: "wörtlich: Auf Mias Augen liegen Tomaten.\nübertragen: Mia sieht etwas nicht."
            say: "Eine Redewendung kann man wörtlich verstehen, dann entsteht ein lustiges Bild im Kopf. Gemeint ist sie aber übertragen. Frag dich: Was will die Person damit sagen?"
          - text: "Max erzählt: „Unser Lehrer ist in den Ferien zum Mond geflogen.“\nLina lacht: „Du willst mir einen Bären aufbinden!“\n\njemandem einen Bären aufbinden = jemandem etwas erzählen, das nicht stimmt"
            say: "Lina hat keinen Bären auf dem Rücken. Sie meint: Du erzählst mir etwas, das nicht stimmt. Die Situation hilft dir, die Bedeutung zu finden."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Jakob sucht seinen Ball. Der liegt mitten auf dem Rasen. Seine Schwester ruft: „Du hast wohl Tomaten auf den Augen!“\n\nWas meint sie?"
                say: "Jakob sucht seinen Ball. Der liegt mitten auf dem Rasen. Seine Schwester ruft: Du hast wohl Tomaten auf den Augen! Was meint sie?"
                options: ["Du siehst etwas nicht, das direkt vor dir liegt.", "Du hast Tomaten im Gesicht.", "Du sollst mehr Gemüse essen."]
                answer: "Du siehst etwas nicht, das direkt vor dir liegt."
                feedback:
                  "Du hast Tomaten im Gesicht.": "Das wäre wörtlich gemeint. Jakob hat keine Tomaten im Gesicht. Was will die Schwester ihm sagen?"
                hints:
                  - "Wo liegt der Ball, und was macht Jakob?"
                  - "Jakob sieht den Ball nicht, obwohl er ganz nah ist."
                  - "Sie meint: Du siehst etwas nicht, das direkt vor dir liegt."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Was bedeutet die Redewendung?"
                say: "Verbinde jede Redewendung mit ihrer Bedeutung."
                pairs:
                  - { left: { text: "Schwein haben" }, right: { text: "Glück haben" } }
                  - { left: { text: "die Nase voll haben" }, right: { text: "keine Lust mehr haben" } }
                  - { left: { text: "jemandem auf den Wecker gehen" }, right: { text: "jemanden nerven" } }
                  - { left: { text: "zwei linke Hände haben" }, right: { text: "ungeschickt sein" } }
                hints:
                  - "Stell dir jede Situation vor."
                  - "Ein Wecker klingelt und klingelt. Das nervt."
                  - "Schwein: Glück. Nase voll: keine Lust mehr. Wecker: nerven. Linke Hände: ungeschickt."
              - id: l1-f3
                type: true_false
                text: "Tim hat beim Würfeln Schwein gehabt. Hat Tim ein Schwein bekommen?"
                answer: false
                hints:
                  - "Ist das wörtlich oder übertragen gemeint?"
                  - "Schwein haben ist eine Redewendung."
                  - "Nein, Tim hatte Glück."
              - id: l1-f4
                type: multiple_choice
                text: "Welcher Satz bedeutet: Ich verstehe es gerade nicht?"
                options: ["Ich stehe auf dem Schlauch.", "Ich habe Schwein gehabt.", "Ich habe die Nase voll."]
                answer: "Ich stehe auf dem Schlauch."
                hints:
                  - "Steht jemand auf dem Gartenschlauch, kommt kein Wasser mehr durch."
                  - "Bei welcher Redewendung kommt nichts mehr durch?"
                  - "Ich stehe auf dem Schlauch."
              - id: l1-f5
                type: sorting
                text: "Wörtlich oder übertragen gemeint?"
                say: "Sortiere: Ist das wörtlich gemeint oder übertragen?"
                bins:
                  - { id: literal, show: { text: "wörtlich" }, say: "wörtlich" }
                  - { id: figurative, show: { text: "übertragen" }, say: "übertragen" }
                options:
                  - { text: "Der Gärtner steht auf dem Schlauch, deshalb kommt kein Wasser.", bin: literal }
                  - { text: "Der Bauer hat im Stall drei Schweine.", bin: literal }
                  - { text: "Bei der Matheaufgabe stehe ich auf dem Schlauch.", bin: figurative }
                  - { text: "Wir hatten Schwein: Der Bus hat auf uns gewartet.", bin: figurative }
                hints:
                  - "Gibt es wirklich einen Schlauch oder ein Schwein?"
                  - "Bei einer Matheaufgabe liegt kein Gartenschlauch."
                  - "Gärtner und Bauer: wörtlich. Matheaufgabe und Bus: übertragen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ben erzählt, sein Hund kann Klavier spielen. Oma lacht: „Du willst mir doch einen Bären aufbinden!“\n\nWas meint Oma?"
                say: "Ben erzählt, sein Hund kann Klavier spielen. Oma lacht: Du willst mir doch einen Bären aufbinden! Was meint Oma?"
                options: ["Du erzählst mir etwas, das nicht stimmt.", "Du sollst mir einen Teddy schenken.", "Du sollst den Hund festbinden."]
                answer: "Du erzählst mir etwas, das nicht stimmt."
                hints: ["Kann ein Hund Klavier spielen?"]
              - id: l1-s2
                type: matching
                text: "Was bedeutet die Redewendung?"
                say: "Verbinde jede Redewendung mit ihrer Bedeutung."
                pairs:
                  - { left: { text: "Hals über Kopf" }, right: { text: "ganz schnell und ohne nachzudenken" } }
                  - { left: { text: "Kohldampf haben" }, right: { text: "großen Hunger haben" } }
                  - { left: { text: "mit dem falschen Fuß aufstehen" }, right: { text: "schlechte Laune haben" } }
                  - { left: { text: "jemandem die Daumen drücken" }, right: { text: "jemandem Glück wünschen" } }
                hints: ["Was macht man vor einer Klassenarbeit für einen Freund?"]
              - id: l1-s3
                type: true_false
                text: "Wer ins Fettnäpfchen tritt, hat etwas Peinliches gesagt oder getan. Stimmt das?"
                answer: true
                hints: ["Ist das wörtlich gemeint, mit echtem Fett?"]
              - id: l1-s4
                type: multiple_choice
                text: "Lisa fragt schon zum fünften Mal, ob sie ein Eis haben darf. Mama seufzt: „Du gehst mir auf den Wecker!“\n\nWie fühlt sich Mama?"
                say: "Lisa fragt schon zum fünften Mal, ob sie ein Eis haben darf. Mama seufzt: Du gehst mir auf den Wecker! Wie fühlt sich Mama?"
                options: ["genervt", "müde", "fröhlich"]
                answer: "genervt"
                hints: ["Wie fühlt man sich, wenn jemand immer wieder dasselbe fragt?"]
              - id: l1-s5
                type: multiple_choice
                text: "Was ist eine Redewendung?"
                options: ["Wörter, die zusammen etwas anderes bedeuten, als sie sagen", "ein Wort, das man auch rückwärts lesen kann", "ein Satz mit vielen Fehlern"]
                answer: "Wörter, die zusammen etwas anderes bedeuten, als sie sagen"
                hints: ["Bedeuten die Wörter einer Redewendung genau das, was sie sagen?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Die Klassenfahrt fällt ins Wasser. Was ist passiert?"
                options: ["Die Klassenfahrt findet nicht statt.", "Der Bus ist in einen See gefahren.", "Die Klasse fährt ans Meer."]
                answer: "Die Klassenfahrt findet nicht statt."
              - id: l1-n2
                type: matching
                text: "Was bedeutet die Redewendung?"
                say: "Verbinde jede Redewendung mit ihrer Bedeutung."
                pairs:
                  - { left: { text: "ein Brett vor dem Kopf haben" }, right: { text: "etwas nicht verstehen" } }
                  - { left: { text: "jemandem Löcher in den Bauch fragen" }, right: { text: "sehr viele Fragen stellen" } }
                  - { left: { text: "etwas auf die lange Bank schieben" }, right: { text: "etwas immer wieder verschieben" } }
                  - { left: { text: "Katzenwäsche machen" }, right: { text: "sich nur ganz kurz waschen" } }
              - id: l1-n3
                type: true_false
                text: "Jonas ist heute mit dem falschen Fuß aufgestanden. Hat Jonas gute Laune?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Emil lässt beim Basteln die Schere fallen und klebt sich die Finger zusammen. Welche Redewendung passt zu Emil?"
                options: ["Er hat zwei linke Hände.", "Er hat Schwein gehabt.", "Er hat Kohldampf."]
                answer: "Er hat zwei linke Hände."
              - id: l1-n5
                type: sorting
                text: "Wörtlich oder übertragen gemeint?"
                say: "Sortiere: Ist das wörtlich gemeint oder übertragen?"
                bins:
                  - { id: literal, show: { text: "wörtlich" }, say: "wörtlich" }
                  - { id: figurative, show: { text: "übertragen" }, say: "übertragen" }
                options:
                  - { text: "Der Wecker klingelt um sieben Uhr.", bin: literal }
                  - { text: "Im Salat sind Tomaten und Gurken.", bin: literal }
                  - { text: "Mein Bruder geht mir auf den Wecker.", bin: figurative }
                  - { text: "Hast du Tomaten auf den Augen?", bin: figurative }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was bedeutet: die Nase voll haben?"
            options: ["keine Lust mehr haben", "Schnupfen haben", "gut riechen können"]
            answer: "keine Lust mehr haben"
          - id: l1-c2
            type: true_false
            text: "Ida drückt ihrem Freund vor dem Wettlauf die Daumen. Wünscht sie ihm Glück?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Ole erzählt, er sei heute früh mit einem Drachen zur Schule geflogen. Was sagt seine Freundin?"
            options: ["Du willst mir einen Bären aufbinden!", "Du hast Schwein gehabt!", "Ich drücke dir die Daumen!"]
            answer: "Du willst mir einen Bären aufbinden!"

  - n: 2
    title: { de: "Sprichwörter", en: "Proverbs" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was bedeutet: auf dem Schlauch stehen?"
            options: ["etwas gerade nicht verstehen", "im Garten Blumen gießen", "sehr müde sein"]
            answer: "etwas gerade nicht verstehen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Wer Kohldampf hat, hat großen Hunger. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Übung macht den Meister."
            say: "Das ist ein Sprichwort. Ein Sprichwort ist ein ganzer Satz. Es gibt einen Rat oder sagt etwas, das viele Menschen erlebt haben. Hier heißt es: Wenn du viel übst, wirst du richtig gut."
          - text: "Redewendung: die Nase voll haben\n→ Ich habe die Nase voll.\n→ Tom hat die Nase voll.\n\nSprichwort: Übung macht den Meister.\n→ bleibt immer gleich"
            say: "So unterscheidest du die beiden. Eine Redewendung baust du in deinen Satz ein, und sie verändert sich ein bisschen: Ich habe, Tom hat. Ein Sprichwort steht als ganzer Satz da und bleibt immer gleich."
          - text: "Lügen haben kurze Beine.\n= Eine Lüge kommt meistens schnell heraus."
            say: "Auch ein Sprichwort ist übertragen gemeint. Lügen haben ja keine Beine. Mit kurzen Beinen kommt man aber nicht weit. So ist es mit Lügen: Man kommt nicht weit damit, sie kommen bald heraus."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was bedeutet das Sprichwort: Lügen haben kurze Beine?"
                options: ["Eine Lüge kommt meistens schnell heraus.", "Wer lügt, ist klein.", "Lügner laufen langsam."]
                answer: "Eine Lüge kommt meistens schnell heraus."
                feedback:
                  "Lügner laufen langsam.": "Das wäre wörtlich gemeint. Wie weit kommt man mit einer Lüge?"
                hints:
                  - "Haben Lügen wirklich Beine?"
                  - "Mit kurzen Beinen kommt man nicht weit."
                  - "Eine Lüge kommt meistens schnell heraus."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Redewendung oder Sprichwort?"
                say: "Sortiere: Ist das eine Redewendung oder ein Sprichwort?"
                bins:
                  - { id: idiom, show: { text: "Redewendung" }, say: "Redewendung" }
                  - { id: proverb, show: { text: "Sprichwort" }, say: "Sprichwort" }
                options:
                  - { text: "Übung macht den Meister.", bin: proverb }
                  - { text: "Aller Anfang ist schwer.", bin: proverb }
                  - { text: "Schwein haben", bin: idiom }
                  - { text: "die Daumen drücken", bin: idiom }
                hints:
                  - "Ein Sprichwort ist ein ganzer Satz mit einem Rat."
                  - "Welche Karten sind ein ganzer Satz?"
                  - "Übung und Anfang sind Sprichwörter. Schwein und Daumen sind Redewendungen."
              - id: l2-f3
                type: multiple_choice
                text: "Nele übt jeden Tag Flöte. Nach einem Monat spielt sie ihr Lied ohne einen Fehler. Welches Sprichwort passt?"
                options: ["Übung macht den Meister.", "Lügen haben kurze Beine.", "Viele Köche verderben den Brei."]
                answer: "Übung macht den Meister."
                hints:
                  - "Was hat Nele jeden Tag gemacht?"
                  - "In welchem Sprichwort steckt das Üben?"
                  - "Übung macht den Meister."
              - id: l2-f4
                type: fill_in_blank
                text: "Ergänze das Sprichwort."
                frame: "Morgenstund hat _ im Mund."
                options: ["Gold", "Brot", "Zähne"]
                answer: ["Gold"]
                hints:
                  - "Das Sprichwort sagt: Wer früh aufsteht, schafft viel."
                  - "Was ist besonders wertvoll?"
                  - "Morgenstund hat Gold im Mund."
              - id: l2-f5
                type: multiple_choice
                text: "Was bedeutet: Viele Köche verderben den Brei?"
                options: ["Wenn zu viele mitbestimmen, klappt es nicht.", "Kochen ist sehr schwer.", "Brei schmeckt nicht gut."]
                answer: "Wenn zu viele mitbestimmen, klappt es nicht."
                hints:
                  - "Stell dir vor, fünf Köche kochen einen Topf Brei."
                  - "Jeder gibt etwas anderes dazu."
                  - "Wenn zu viele mitbestimmen, klappt es nicht."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was bedeutet: Aller Anfang ist schwer?"
                options: ["Etwas Neues fällt am Anfang oft schwer.", "Der erste Tag im Jahr ist anstrengend.", "Schwere Dinge stehen immer vorne."]
                answer: "Etwas Neues fällt am Anfang oft schwer."
                hints: ["Denk daran, wie du Radfahren gelernt hast."]
              - id: l2-s2
                type: sorting
                text: "Redewendung oder Sprichwort?"
                say: "Sortiere: Ist das eine Redewendung oder ein Sprichwort?"
                bins:
                  - { id: idiom, show: { text: "Redewendung" }, say: "Redewendung" }
                  - { id: proverb, show: { text: "Sprichwort" }, say: "Sprichwort" }
                options:
                  - { text: "Ohne Fleiß kein Preis.", bin: proverb }
                  - { text: "Ende gut, alles gut.", bin: proverb }
                  - { text: "auf dem Schlauch stehen", bin: idiom }
                  - { text: "Hals über Kopf", bin: idiom }
                hints: ["Welche geben einen Rat und stehen als ganzer Satz da?"]
              - id: l2-s3
                type: multiple_choice
                text: "Malte stellt Ella ein Bein, damit sie stolpert. Dann stolpert er selbst über seinen Schnürsenkel. Welches Sprichwort passt?"
                options: ["Wer anderen eine Grube gräbt, fällt selbst hinein.", "Morgenstund hat Gold im Mund.", "Aller Anfang ist schwer."]
                answer: "Wer anderen eine Grube gräbt, fällt selbst hinein."
                hints: ["Malte wollte Ella schaden. Wem passiert es dann?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Ergänze das Sprichwort."
                frame: "Ohne Fleiß kein _."
                options: ["Preis", "Eis", "Reis"]
                answer: ["Preis"]
                hints: ["Wer fleißig ist, bekommt am Ende eine Belohnung."]
              - id: l2-s5
                type: multiple_choice
                text: "Ella hat ihren Schlüssel vergessen. Da kommt gerade ihr Bruder nach Hause und schließt auf. Ella hat ..."
                options: ["Schwein gehabt.", "die Nase voll.", "Tomaten auf den Augen."]
                answer: "Schwein gehabt."
                hints: ["Hatte Ella Glück oder Pech?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Was bedeutet: Der Apfel fällt nicht weit vom Stamm?"
                options: ["Kinder sind ihren Eltern oft ähnlich.", "Äpfel fallen im Herbst vom Baum.", "Man soll Äpfel nicht weit tragen."]
                answer: "Kinder sind ihren Eltern oft ähnlich."
              - id: l2-n2
                type: sorting
                text: "Redewendung oder Sprichwort?"
                say: "Sortiere: Ist das eine Redewendung oder ein Sprichwort?"
                bins:
                  - { id: idiom, show: { text: "Redewendung" }, say: "Redewendung" }
                  - { id: proverb, show: { text: "Sprichwort" }, say: "Sprichwort" }
                options:
                  - { text: "Morgenstund hat Gold im Mund.", bin: proverb }
                  - { text: "Lügen haben kurze Beine.", bin: proverb }
                  - { text: "jemandem einen Bären aufbinden", bin: idiom }
                  - { text: "ins Fettnäpfchen treten", bin: idiom }
              - id: l2-n3
                type: multiple_choice
                text: "Der Hund war den ganzen Tag verschwunden. Am Abend sitzt er wieder vor der Tür. Was sagt Mama erleichtert?"
                options: ["Ende gut, alles gut.", "Ohne Fleiß kein Preis.", "Viele Köche verderben den Brei."]
                answer: "Ende gut, alles gut."
              - id: l2-n4
                type: fill_in_blank
                text: "Ergänze das Sprichwort."
                frame: "Wer zuletzt _, lacht am besten."
                options: ["lacht", "weint", "schläft"]
                answer: ["lacht"]
              - id: l2-n5
                type: multiple_choice
                text: "Kurz vor dem Fußballspiel sagt Oma zu Finn: „Ich ...“"
                say: "Kurz vor dem Fußballspiel sagt Oma zu Finn etwas Liebes. Was passt?"
                options: ["drücke dir die Daumen!", "habe die Nase voll!", "stehe auf dem Schlauch!"]
                answer: "drücke dir die Daumen!"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Was bedeutet: den Kopf in den Sand stecken?"
            options: ["ein Problem nicht sehen wollen", "am Strand eine Sandburg bauen", "sich die Haare waschen"]
            answer: "ein Problem nicht sehen wollen"
          - id: l2-c2
            type: true_false
            text: "Die Kinder haben nach dem Sport Kohldampf. Haben sie Kohl gegessen?"
            answer: false
          - id: l2-c3
            type: sorting
            text: "Redewendung oder Sprichwort?"
            say: "Ordne zu: Ist das eine Redewendung oder ein Sprichwort?"
            bins:
              - { id: idiom, show: { text: "Redewendung" }, say: "Redewendung" }
              - { id: proverb, show: { text: "Sprichwort" }, say: "Sprichwort" }
            options:
              - { text: "Wer anderen eine Grube gräbt, fällt selbst hinein.", bin: proverb }
              - { text: "Viele Köche verderben den Brei.", bin: proverb }
              - { text: "jemandem auf den Wecker gehen", bin: idiom }
              - { text: "zwei linke Hände haben", bin: idiom }
          - id: l2-c4
            type: multiple_choice
            text: "Leon trainiert jeden Tag Kopfball. Beim Spiel am Samstag schießt er damit das Siegtor. Welches Sprichwort passt?"
            options: ["Übung macht den Meister.", "Der Apfel fällt nicht weit vom Stamm.", "Lügen haben kurze Beine."]
            answer: "Übung macht den Meister."
          - id: l2-c5
            type: multiple_choice
            text: "Anna fragt ihren Opa den ganzen Nachmittag: Warum? Wieso? Weshalb? Opa lacht. Was sagt er?"
            options: ["Du fragst mir Löcher in den Bauch!", "Du hast Tomaten auf den Augen!", "Du hast zwei linke Hände!"]
            answer: "Du fragst mir Löcher in den Bauch!"
