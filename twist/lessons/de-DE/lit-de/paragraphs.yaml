                type: multiple_choice
                text: "Die Kartoffel\n\nDie Kartoffel stammt aus Südamerika. Seefahrer brachten sie vor über 400 Jahren nach Europa.\n\nKartoffeln wachsen unter der Erde. Dort bildet die Pflanze dicke Knollen. Diese Knollen essen wir.\n\nAus Kartoffeln kann man viel kochen, zum Beispiel Pommes, Püree, Klöße oder Bratkartoffeln.\n\nWelche Teilüberschrift passt zum ersten Absatz?"
                say: "Lies den Text. Welche Teilüberschrift passt zum ersten Absatz?"
