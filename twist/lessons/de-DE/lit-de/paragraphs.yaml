      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Der Mond\n\nDer Mond kreist um die Erde. Für eine Runde braucht er ungefähr einen Monat.\n\nDer Mond leuchtet nicht selbst. Er wird von der Sonne angestrahlt.\n\nIm Jahr 1969 landeten zum ersten Mal Menschen auf dem Mond.\n\nIn welchem Absatz erfährst du, wann Menschen auf dem Mond landeten?"
            say: "Lies den Text. In welchem Absatz erfährst du, wann Menschen auf dem Mond landeten?"
            options: ["im ersten Absatz", "im zweiten Absatz", "im dritten Absatz"]
