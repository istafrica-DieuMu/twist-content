# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.paragraphs
skill: lit-de.comprehension.paragraphs
curriculum: de-DE
language: de
title:
  de: Absätze und Teilüberschriften
  en: Paragraphs and sub-headings
summary: >
  Using paragraphs to find one's way in a Sachtext. Lesson 1 counts
  paragraphs, says what each one is about and finds which paragraph
  answers a question; lesson 2 gives each paragraph a sub-heading that
  fits the whole paragraph, puts sub-headings in the order of the text,
  and ends with the skill check. Every text is written for Twist.
metadata:
  year: klasse-4
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.comprehension.skim]
  also_practises: [lit-de.comprehension.skim]
  vocabulary: { de: [Absatz, Teilüberschrift, Überschrift, Sachtext, worum es geht] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: paragraph-is-sentence
      what: Counts sentences or lines instead of paragraphs
      addressed: lesson 1 Learn shows a paragraph as a block that starts on a new line; every stage of lesson 1 asks how many paragraphs, with the sentence count as a distractor and feedback in l1-f1
    - id: heading-from-one-word
      what: Takes one word from the paragraph as its sub-heading instead of what the whole paragraph is about
      addressed: lesson 2 Learn compares a too-small and a fitting sub-heading; every stage of lesson 2 has a sub-heading choice with a single-word distractor, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Worum geht es in jedem Absatz?", en: "What is each paragraph about?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Du suchst in einem Tierbuch etwas über Pferde. Wie findest du es schnell?"
            options: ["im Inhaltsverzeichnis nachsehen", "das ganze Buch von vorne lesen", "irgendeine Seite aufschlagen"]
            answer: "im Inhaltsverzeichnis nachsehen"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was verrät dir die Überschrift „Wie Bienen Honig machen“?"
            options: ["worum es im Text geht", "wer den Text geschrieben hat", "wie lang der Text ist"]
            answer: "worum es im Text geht"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Igel\n\nIgel sind nachts unterwegs. Am Tag schlafen sie in Hecken oder unter Laub.\n\nIgel fressen Käfer, Würmer und Schnecken. Darum freuen sich viele Gärtner über einen Igel.\n\nIm Herbst fressen sich Igel ein Fettpolster an. Von November bis März halten sie Winterschlaf in einem Nest aus Blättern."
            say: "Dieser Text hat drei Absätze. Ein Absatz beginnt in einer neuen Zeile, und davor ist etwas Platz. In jedem Absatz geht es um etwas anderes."
          - text: "1. Absatz: wann Igel unterwegs sind\n2. Absatz: was Igel fressen\n3. Absatz: der Winterschlaf"
            say: "Frag dich bei jedem Absatz: Worum geht es hier? Im ersten geht es darum, wann Igel unterwegs sind, im zweiten um ihr Futter, im dritten um den Winterschlaf."
          - text: "Was fressen Igel?\n→ 2. Absatz"
            say: "Suchst du etwas, musst du nicht den ganzen Text lesen. Überleg, in welchem Absatz es stehen kann, und lies dort genau nach."

      - activity: practise
        setting: in-context
        stages:
