            say: "Lies den Text. Hat er drei Absätze?"
            answer: true

  - n: 2
    title: { de: "Teilüberschriften finden", en: "Finding sub-headings" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Der Hamster\n\nHamster sind Nagetiere. Am Tag schlafen sie.\n\nNachts laufen sie viele Kilometer in ihrem Laufrad.\n\nIn ihren Backentaschen tragen sie Futter in ihr Versteck.\n\nWie viele Absätze hat der Text?"
            say: "Lies den Text. Wie viele Absätze hat er?"
            options: ["3", "4", "5"]
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Der Hamster\n\nHamster sind Nagetiere. Am Tag schlafen sie.\n\nNachts laufen sie viele Kilometer in ihrem Laufrad.\n\nIn ihren Backentaschen tragen sie Futter in ihr Versteck.\n\nIn welchem Absatz erfährst du, wie Hamster Futter tragen?"
            say: "Lies den Text. In welchem Absatz erfährst du, wie Hamster Futter tragen?"
            options: ["im ersten Absatz", "im zweiten Absatz", "im dritten Absatz"]
            answer: "im dritten Absatz"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Igel sind nachts unterwegs. ...\n→ Nachts unterwegs\n\nIgel fressen Käfer, Würmer und Schnecken. ...\n→ Was Igel fressen\n\nIm Herbst fressen sich Igel ein Fettpolster an. ...\n→ Der Winterschlaf"
            say: "Eine Teilüberschrift sagt in wenigen Wörtern, worum es in einem Absatz geht. Sie steht über dem Absatz, wie eine kleine Überschrift."
          - text: "zu klein: Schnecken\nzu groß: Igel\npasst: Was Igel fressen"
            say: "Eine gute Teilüberschrift passt zum ganzen Absatz. Schnecken ist zu klein, das ist nur ein Wort aus dem Absatz. Igel ist zu groß, darum geht es im ganzen Text. Was Igel fressen passt genau."
          - text: "Nachts unterwegs · Was Igel fressen · Der Winterschlaf"
            say: "Mit Teilüberschriften findest du dich im Text schnell zurecht. Sie sind wie Wegweiser."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Der Blauwal\n\nDer Blauwal ist das größte Tier der Erde. Er kann über 30 Meter lang werden.\n\nObwohl er im Meer lebt, ist der Blauwal kein Fisch. Er ist ein Säugetier und muss zum Atmen an die Oberfläche kommen.\n\nBlauwale fressen winzige Krebse, den Krill. An einem Tag fressen sie mehrere Tonnen davon.\n\nWelche Teilüberschrift passt zum zweiten Absatz?"
                say: "Lies den Text. Welche Teilüberschrift passt zum zweiten Absatz?"
                options: ["Ein Säugetier im Meer", "Die Oberfläche", "Das größte Tier der Erde"]
                answer: "Ein Säugetier im Meer"
                feedback:
                  "Die Oberfläche": "Das Wort steht im Absatz, aber es ist zu klein. Im ganzen Absatz geht es darum, dass der Wal kein Fisch ist, sondern ein Säugetier."
                  "Das größte Tier der Erde": "Das passt zum ersten Absatz. Lies den zweiten noch einmal."
                hints:
                  - "Worum geht es im ganzen zweiten Absatz?"
                  - "Ist der Blauwal ein Fisch?"
                  - "Ein Säugetier im Meer."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Der Blauwal\n\nDer Blauwal ist das größte Tier der Erde. Er kann über 30 Meter lang werden.\n\nObwohl er im Meer lebt, ist der Blauwal kein Fisch. Er ist ein Säugetier und muss zum Atmen an die Oberfläche kommen.\n\nBlauwale fressen winzige Krebse, den Krill. An einem Tag fressen sie mehrere Tonnen davon.\n\nWelche Teilüberschrift gehört zu welchem Absatz?"
