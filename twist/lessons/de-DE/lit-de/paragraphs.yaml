                  - { left: { text: "3. Absatz" }, right: { text: "Winzige Nahrung" } }
                hints:
                  - "Überleg bei jedem Absatz: Worum geht es?"
                  - "Größe, Säugetier, Futter."
                  - "1: Riesig groß. 2: Kein Fisch. 3: Winzige Nahrung."
              - id: l2-f3
                type: true_false
                text: "Der Blauwal\n\nDer Blauwal ist das größte Tier der Erde. Er kann über 30 Meter lang werden.\n\nObwohl er im Meer lebt, ist der Blauwal kein Fisch. Er ist ein Säugetier und muss zum Atmen an die Oberfläche kommen.\n\nBlauwale fressen winzige Krebse, den Krill. An einem Tag fressen sie mehrere Tonnen davon.\n\nPasst die Teilüberschrift „Was Blauwale fressen“ zum dritten Absatz?"
