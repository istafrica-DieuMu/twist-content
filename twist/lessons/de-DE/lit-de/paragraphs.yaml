                  - "Lies den dritten Absatz."
                  - "Es geht um den Krill."
                  - "Ja, sie passt."
              - id: l2-f4
                type: ordering
                text: "Die Kartoffel\n\nDie Kartoffel stammt aus Südamerika. Seefahrer brachten sie vor über 400 Jahren nach Europa.\n\nKartoffeln wachsen unter der Erde. Dort bildet die Pflanze dicke Knollen. Diese Knollen essen wir.\n\nAus Kartoffeln kann man viel kochen, zum Beispiel Pommes, Püree, Klöße oder Bratkartoffeln.\n\nBring die Teilüberschriften in die Reihenfolge des Textes."
                say: "Lies den Text. Bring die Teilüberschriften in die Reihenfolge der Absätze."
                options: ["Was man aus Kartoffeln kocht", "Woher die Kartoffel kommt", "Wie Kartoffeln wachsen"]
                slot_count: 3
                answer: ["Woher die Kartoffel kommt", "Wie Kartoffeln wachsen", "Was man aus Kartoffeln kocht"]
                hints:
                  - "Worum geht es im ersten Absatz?"
                  - "Erst Südamerika, dann unter der Erde, dann das Kochen."
                  - "Woher, wie sie wachsen, was man kocht."
