# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.read-instructions
skill: lit-de.texts-media.instructions
curriculum: de-DE
language: de
title:
  de: Anleitungen und Rezepte lesen
  en: Reading instructions and recipes
summary: >
  Reading an Anleitung or a Rezept and following the steps in order.
  Lesson 1 reads short Anleitungen (Kakao, Obstspieß, Stein bemalen):
  what you need, what comes first and next, the order of the steps and
  the words zuerst, dann, zum Schluss; lesson 2 reads Rezepte, tells
  Zutaten from Schritte, reads amounts, finds a missing step, and ends
  with the skill check.
metadata:
  year: klasse-2
  topic: { de: Textarten, en: Kinds of text }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.texts-media.text-types]
  also_practises: [lit-de.comprehension.find-information]
  vocabulary: { de: [Anleitung, Rezept, Zutaten, Schritt, zuerst, dann, danach, zum Schluss] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: fun-step-first
      what: Jumps to the step that looks most fun (trinken, essen, bemalen) or does a later step before an earlier one
      addressed: "lesson 1 Learn says read everything, then one step after the other; \"Was machst du zuerst?\" offers a later step (l1-f1 with feedback on the last step, l1-s1, l2-c5); every stage of lesson 1 and lesson 2 has an ordering task except the full stage of lesson 2; \"bevor\" true_false tasks in l1-n4, l1-c3, l2-f4 and l2-c4"
    - id: list-as-steps
      what: Takes the list of things you need or the Zutaten for the steps, or reads past the amounts
      addressed: "lesson 2 Learn sets Zutaten against Schritte and 1 Apfel against 10 Trauben; every stage of lesson 2 sorts Zutat from Schritt (l2-f1, l2-s1, l2-n1, l2-c1) and asks for an amount (l2-f2, l2-s2, l2-n2, l2-c2)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Schritt für Schritt", en: "Step by step" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "So machst du einen Papierflieger:\n1. Nimm ein Blatt Papier.\n2. Falte es in der Mitte.\n\nWas für ein Text ist das?"
            say: "Lies den Text. Was für ein Text ist das?"
            options: ["eine Anleitung", "ein Gedicht", "ein Brief"]
            answer: "eine Anleitung"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Eine Anleitung sagt dir, wie man etwas macht. Stimmt das?"
            say: "Eine Anleitung sagt dir, wie man etwas macht. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Kresse säen\nDu brauchst: einen Teller, Watte, Wasser, Kressesamen\n1. Leg die Watte auf den Teller.\n2. Mach die Watte nass.\n3. Streu die Samen darauf.\n4. Stell den Teller ans Fenster."
            say: "Eine Anleitung hat oft zwei Teile. Oben steht, was du brauchst. Darunter stehen die Schritte mit Nummern."
          - text: "1. Alles einmal durchlesen.\n2. Alle Sachen holen.\n3. Einen Schritt nach dem anderen machen."
            say: "Lies die Anleitung zuerst ganz durch. Hol dann alle Sachen, die du brauchst. Mach dann einen Schritt nach dem anderen. Überspring keinen Schritt."
          - text: "zuerst | dann | danach | zum Schluss"
            say: "Manche Anleitungen haben keine Nummern. Dann helfen dir diese Wörter: zuerst, dann, danach und zum Schluss. Sie sagen dir die Reihenfolge."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Kakao machen\nDu brauchst: eine Tasse, Milch, Kakaopulver, einen Löffel\n1. Gieß Milch in die Tasse.\n2. Gib zwei Löffel Kakaopulver dazu.\n3. Rühre gut um.\n4. Trink deinen Kakao.\n\nWas machst du zuerst?"
                say: "Lies die Anleitung. Was machst du zuerst?"
                options: ["Gieß Milch in die Tasse.", "Rühre gut um.", "Trink deinen Kakao."]
                answer: "Gieß Milch in die Tasse."
                feedback:
                  "Trink deinen Kakao.": "Das ist der letzte Schritt. Was steht bei Nummer 1?"
                hints:
                  - "Schau auf die Nummern."
                  - "Lies Schritt 1."
                  - "Zuerst gießt du Milch in die Tasse."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Kakao machen\nDu brauchst: eine Tasse, Milch, Kakaopulver, einen Löffel\n1. Gieß Milch in die Tasse.\n2. Gib zwei Löffel Kakaopulver dazu.\n3. Rühre gut um.\n\nWie viele Löffel Kakaopulver gibst du dazu?"
                say: "Lies die Anleitung. Wie viele Löffel Kakaopulver gibst du dazu?"
                options: ["zwei", "einen", "vier"]
                answer: "zwei"
                hints:
                  - "Such das Wort Kakaopulver in den Schritten."
                  - "Lies Schritt 2."
                  - "Zwei Löffel."
              - id: l1-f3
                type: ordering
                text: "Kakao machen: Bring die Schritte in die richtige Reihenfolge."
                say: "Bring die Schritte für den Kakao in die richtige Reihenfolge."
                options: ["Rühre gut um.", "Trink deinen Kakao.", "Gieß Milch in die Tasse.", "Gib zwei Löffel Kakaopulver dazu."]
                slot_count: 4
                answer: ["Gieß Milch in die Tasse.", "Gib zwei Löffel Kakaopulver dazu.", "Rühre gut um.", "Trink deinen Kakao."]
                hints:
                  - "Was muss zuerst in der Tasse sein?"
                  - "Erst die Milch, dann das Pulver. Umrühren kannst du erst, wenn beides drin ist."
                  - "Milch, Pulver, umrühren, trinken."
              - id: l1-f4
                type: true_false
                text: "Kakao machen\nDu brauchst: eine Tasse, Milch, Kakaopulver, einen Löffel\n\nBrauchst du eine Schere?"
                say: "Lies, was du brauchst. Brauchst du eine Schere?"
                answer: false
                hints:
                  - "Lies die Zeile „Du brauchst“."
                  - "Da stehen Tasse, Milch, Kakaopulver und Löffel."
                  - "Nein, eine Schere brauchst du nicht."
              - id: l1-f5
                type: multiple_choice
                text: "Kakao machen\n1. Gieß Milch in die Tasse.\n2. Gib zwei Löffel Kakaopulver dazu.\n3. Rühre gut um.\n4. Trink deinen Kakao.\n\nWas machst du nach Schritt 2?"
                say: "Lies die Anleitung. Was machst du nach Schritt 2?"
                options: ["Rühre gut um.", "Gieß Milch in die Tasse.", "Hol eine Schere."]
                answer: "Rühre gut um."
                hints:
                  - "Nach Schritt 2 kommt Schritt 3."
                  - "Lies Schritt 3."
                  - "Du rührst gut um."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Obstspieß\nDu brauchst: Erdbeeren, eine Banane, Trauben, einen Holzspieß\n1. Wasch das Obst.\n2. Schneide die Banane in Scheiben.\n3. Steck das Obst auf den Spieß.\n4. Guten Appetit!\n\nWas machst du zuerst?"
                say: "Lies die Anleitung. Was machst du zuerst?"
                options: ["Wasch das Obst.", "Steck das Obst auf den Spieß.", "Schneide die Banane in Scheiben."]
                answer: "Wasch das Obst."
                hints: ["Lies Schritt 1."]
              - id: l1-s2
                type: multiple_choice
                text: "Obstspieß\nDu brauchst: Erdbeeren, eine Banane, Trauben, einen Holzspieß\n1. Wasch das Obst.\n2. Schneide die Banane in Scheiben.\n\nWas schneidest du in Scheiben?"
                say: "Lies die Anleitung. Was schneidest du in Scheiben?"
                options: ["die Banane", "die Erdbeeren", "die Trauben"]
                answer: "die Banane"
                hints: ["Such das Wort Scheiben."]
              - id: l1-s3
                type: ordering
                text: "Obstspieß: Bring die Schritte in die richtige Reihenfolge."
                say: "Bring die Schritte für den Obstspieß in die richtige Reihenfolge."
                options: ["Steck das Obst auf den Spieß.", "Wasch das Obst.", "Guten Appetit!", "Schneide die Banane in Scheiben."]
                slot_count: 4
                answer: ["Wasch das Obst.", "Schneide die Banane in Scheiben.", "Steck das Obst auf den Spieß.", "Guten Appetit!"]
                hints: ["Essen kommt immer zum Schluss."]
              - id: l1-s4
                type: true_false
                text: "Obstspieß\nDu brauchst: Erdbeeren, eine Banane, Trauben, einen Holzspieß\n\nBrauchst du einen Holzspieß?"
                say: "Lies, was du brauchst. Brauchst du einen Holzspieß?"
                answer: true
                hints: ["Lies die Zeile „Du brauchst“ bis zum Ende."]
              - id: l1-s5
                type: fill_in_blank
                text: "Obstspieß: Füll die Lücken."
                say: "Was machst du zuerst, was dann? Füll die Lücken."
                frame: "Zuerst _ du das Obst. Dann _ du die Banane."
                options: ["wäschst", "schneidest", "isst"]
                answer: ["wäschst", "schneidest"]
                hints: ["Schritt 1 ist waschen, Schritt 2 ist schneiden."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Einen Stein bemalen\nDu brauchst: einen glatten Stein, Farben, einen Pinsel\n1. Wasch den Stein und lass ihn trocknen.\n2. Mal ein Bild auf den Stein.\n3. Lass die Farbe trocknen.\n4. Leg den Stein in den Garten.\n\nWas machst du, bevor du malst?"
                say: "Lies die Anleitung. Was machst du, bevor du malst?"
                options: ["Wasch den Stein und lass ihn trocknen.", "Lass die Farbe trocknen.", "Leg den Stein in den Garten."]
                answer: "Wasch den Stein und lass ihn trocknen."
              - id: l1-n2
                type: multiple_choice
                text: "Einen Stein bemalen\nDu brauchst: einen glatten Stein, Farben, einen Pinsel\n\nWomit malst du?"
                say: "Lies, was du brauchst. Womit malst du?"
                options: ["mit einem Pinsel", "mit einer Schere", "mit einem Kleber"]
                answer: "mit einem Pinsel"
              - id: l1-n3
                type: ordering
                text: "Einen Stein bemalen: Bring die Schritte in die richtige Reihenfolge."
                say: "Bring die Schritte zum Steinbemalen in die richtige Reihenfolge."
                options: ["Lass die Farbe trocknen.", "Mal ein Bild auf den Stein.", "Leg den Stein in den Garten.", "Wasch den Stein und lass ihn trocknen."]
                slot_count: 4
                answer: ["Wasch den Stein und lass ihn trocknen.", "Mal ein Bild auf den Stein.", "Lass die Farbe trocknen.", "Leg den Stein in den Garten."]
              - id: l1-n4
                type: true_false
                text: "Einen Stein bemalen\n2. Mal ein Bild auf den Stein.\n3. Lass die Farbe trocknen.\n4. Leg den Stein in den Garten.\n\nLegst du den Stein in den Garten, bevor die Farbe trocken ist?"
                say: "Lies die Schritte. Legst du den Stein in den Garten, bevor die Farbe trocken ist?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Einen Stein bemalen\nDu brauchst: einen glatten Stein, Farben, einen Pinsel\n1. Wasch den Stein und lass ihn trocknen.\n2. Mal ein Bild auf den Stein.\n3. Lass die Farbe trocknen.\n4. Leg den Stein in den Garten.\n\nWie viele Schritte hat die Anleitung?"
                say: "Lies die Anleitung. Wie viele Schritte hat sie?"
                options: ["vier", "drei", "sieben"]
                answer: "vier"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "Ein Käsebrot machen: Bring die Sätze in die richtige Reihenfolge."
            say: "Bring die Sätze für das Käsebrot in die richtige Reihenfolge."
            options: ["Dann streichst du Butter darauf.", "Zum Schluss legst du Käse darauf.", "Zuerst nimmst du eine Scheibe Brot."]
            slot_count: 3
            answer: ["Zuerst nimmst du eine Scheibe Brot.", "Dann streichst du Butter darauf.", "Zum Schluss legst du Käse darauf."]
          - id: l1-c2
            type: multiple_choice
            text: "Ein Käsebrot machen\nDu brauchst: eine Scheibe Brot, Butter, Käse, ein Messer\n\nWas brauchst du nicht?"
            say: "Lies, was du brauchst. Was brauchst du nicht?"
            options: ["einen Löffel", "ein Messer", "Butter"]
            answer: "einen Löffel"
          - id: l1-c3
            type: true_false
            text: "Zuerst nimmst du eine Scheibe Brot.\nDann streichst du Butter darauf.\nZum Schluss legst du Käse darauf.\n\nStreichst du die Butter darauf, bevor der Käse kommt?"
            say: "Lies die Anleitung. Streichst du die Butter darauf, bevor der Käse kommt?"
            answer: true

  - n: 2
    title: { de: "Rezepte lesen", en: "Reading recipes" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ein Bild malen\n1. Nimm ein Blatt Papier.\n2. Mal ein Haus.\n3. Schreib deinen Namen darunter.\n\nWas machst du zum Schluss?"
            say: "Lies die Anleitung. Was machst du zum Schluss?"
            options: ["Schreib deinen Namen darunter.", "Nimm ein Blatt Papier.", "Mal ein Haus."]
            answer: "Schreib deinen Namen darunter."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Zuerst ziehst du die Socken an.\nDann ziehst du die Schuhe an.\n\nZiehst du die Schuhe zuerst an?"
            say: "Lies die Anleitung. Ziehst du die Schuhe zuerst an?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Obstsalat\nZutaten: 1 Apfel, 1 Banane, 10 Trauben, 1 Orange\nSo geht es:\n1. Wasch den Apfel und die Trauben.\n2. Schäl die Banane und die Orange.\n3. Schneide alles klein.\n4. Gib alles in eine Schüssel und rühre um."
            say: "Ein Rezept ist eine Anleitung zum Kochen oder Backen. Oben stehen die Zutaten. Das ist alles, was in das Essen hineinkommt. Darunter steht, was du tun sollst."
          - text: "Zutaten: was hineinkommt\nSchritte: was du tust"
            say: "Die Zutaten liest du zuerst, damit du alles bereitlegst. Die Reihenfolge steht in den Schritten, nicht in der Liste der Zutaten."
          - text: "1 Apfel | 10 Trauben"
            say: "Pass bei den Zahlen auf. Sie sagen dir, wie viel du nimmst: einen Apfel, aber zehn Trauben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Bananenmilch\nZutaten: 1 Banane, 1 Glas Milch, 1 Löffel Honig\n1. Schäl die Banane.\n2. Zerdrück sie mit einer Gabel.\n3. Gib die Milch und den Honig dazu.\n4. Rühre alles gut um.\n\nZutat oder Schritt?"
                say: "Lies das Rezept. Sortiere: Ist es eine Zutat oder ein Schritt?"
                bins:
                  - { id: zutat, show: { text: "Zutat" }, say: "Zutat" }
                  - { id: schritt, show: { text: "Schritt" }, say: "Schritt" }
                options:
                  - { text: "1 Banane", bin: zutat }
                  - { text: "Schäl die Banane.", bin: schritt }
                  - { text: "1 Glas Milch", bin: zutat }
                  - { text: "Rühre alles gut um.", bin: schritt }
                hints:
                  - "Zutaten kommen in das Essen hinein. Schritte sagen, was du tust."
                  - "In den Schritten steht ein Verb: schäl, rühre."
                  - "Zutaten: Banane, Milch. Schritte: schälen, umrühren."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Bananenmilch\nZutaten: 1 Banane, 1 Glas Milch, 1 Löffel Honig\n\nWie viel Honig brauchst du?"
                say: "Lies die Zutaten. Wie viel Honig brauchst du?"
                options: ["1 Löffel", "2 Löffel", "1 Glas"]
                answer: "1 Löffel"
                hints:
                  - "Such das Wort Honig in den Zutaten."
                  - "Was steht direkt vor Honig?"
                  - "1 Löffel Honig."
              - id: l2-f3
                type: multiple_choice
                text: "Bananenmilch\n1. Schäl die Banane.\n2. Zerdrück sie mit einer Gabel.\n3. Gib die Milch und den Honig dazu.\n4. Rühre alles gut um.\n\nWomit zerdrückst du die Banane?"
                say: "Lies die Schritte. Womit zerdrückst du die Banane?"
                options: ["mit einer Gabel", "mit einem Löffel", "mit einem Messer"]
                answer: "mit einer Gabel"
                hints:
                  - "Such das Wort „Zerdrück“."
                  - "Lies Schritt 2 bis zum Ende."
                  - "Mit einer Gabel."
              - id: l2-f4
                type: true_false
                text: "Bananenmilch\n1. Schäl die Banane.\n2. Zerdrück sie mit einer Gabel.\n3. Gib die Milch und den Honig dazu.\n4. Rühre alles gut um.\n\nGibst du die Milch dazu, bevor du die Banane schälst?"
                say: "Lies die Schritte. Gibst du die Milch dazu, bevor du die Banane schälst?"
                answer: false
                hints:
                  - "In welchem Schritt schälst du? In welchem kommt die Milch?"
                  - "Schälen ist Schritt 1, die Milch kommt in Schritt 3."
                  - "Nein. Zuerst schälst du die Banane."
              - id: l2-f5
                type: multiple_choice
                text: "Bananenmilch\n1. Schäl die Banane.\n2. ...\n3. Gib die Milch und den Honig dazu.\n4. Rühre alles gut um.\n\nEin Schritt fehlt. Welcher?"
                say: "Lies die Schritte. Ein Schritt fehlt. Welcher?"
                options: ["Zerdrück die Banane mit einer Gabel.", "Trink die Bananenmilch aus.", "Kauf eine Banane."]
                answer: "Zerdrück die Banane mit einer Gabel."
                hints:
                  - "Was passiert zwischen dem Schälen und der Milch?"
                  - "Austrinken kommt erst ganz am Ende."
                  - "Zerdrück die Banane mit einer Gabel."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Kräuterquark\nZutaten: 1 Becher Quark, 2 Löffel Milch, Schnittlauch, 1 Prise Salz\n1. Gib den Quark in eine Schüssel.\n2. Rühre die Milch unter.\n3. Schneide den Schnittlauch klein.\n4. Gib Schnittlauch und Salz dazu und rühre um.\n\nZutat oder Schritt?"
                say: "Lies das Rezept. Sortiere: Ist es eine Zutat oder ein Schritt?"
                bins:
                  - { id: zutat, show: { text: "Zutat" }, say: "Zutat" }
                  - { id: schritt, show: { text: "Schritt" }, say: "Schritt" }
                options:
                  - { text: "1 Becher Quark", bin: zutat }
                  - { text: "Schneide den Schnittlauch klein.", bin: schritt }
                  - { text: "1 Prise Salz", bin: zutat }
                  - { text: "Gib den Quark in eine Schüssel.", bin: schritt }
                hints: ["Schritte sagen dir, was du tun sollst."]
              - id: l2-s2
                type: multiple_choice
                text: "Kräuterquark\nZutaten: 1 Becher Quark, 2 Löffel Milch, Schnittlauch, 1 Prise Salz\n\nWie viel Milch brauchst du?"
                say: "Lies die Zutaten. Wie viel Milch brauchst du?"
                options: ["2 Löffel", "1 Löffel", "1 Becher"]
                answer: "2 Löffel"
                hints: ["Such das Wort Milch. Was steht davor?"]
              - id: l2-s3
                type: multiple_choice
                text: "Kräuterquark\n1. Gib den Quark in eine Schüssel.\n2. Rühre die Milch unter.\n3. Schneide den Schnittlauch klein.\n4. Gib Schnittlauch und Salz dazu und rühre um.\n\nWas machst du in Schritt 3?"
                say: "Lies die Schritte. Was machst du in Schritt 3?"
                options: ["Schneide den Schnittlauch klein.", "Gib den Quark in eine Schüssel.", "Iss den Quark."]
                answer: "Schneide den Schnittlauch klein."
                hints: ["Such die Nummer 3."]
              - id: l2-s4
                type: true_false
                text: "Kräuterquark\nZutaten: 1 Becher Quark, 2 Löffel Milch, Schnittlauch, 1 Prise Salz\n\nKommt Zucker in den Kräuterquark?"
                say: "Lies die Zutaten. Kommt Zucker in den Kräuterquark?"
                answer: false
                hints: ["Lies alle Zutaten. Steht da Zucker?"]
              - id: l2-s5
                type: ordering
                text: "Kräuterquark: Bring die Schritte in die richtige Reihenfolge."
                say: "Bring die Schritte für den Kräuterquark in die richtige Reihenfolge."
                options: ["Schneide den Schnittlauch klein.", "Gib Schnittlauch und Salz dazu und rühre um.", "Gib den Quark in eine Schüssel.", "Rühre die Milch unter."]
                slot_count: 4
                answer: ["Gib den Quark in eine Schüssel.", "Rühre die Milch unter.", "Schneide den Schnittlauch klein.", "Gib Schnittlauch und Salz dazu und rühre um."]
                hints: ["Zuerst muss der Quark in die Schüssel."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Müsli\nZutaten: 4 Löffel Haferflocken, 1 Apfel, 1 Handvoll Nüsse, Milch\n1. Gib die Haferflocken in eine Schale.\n2. Reibe den Apfel.\n3. Gib den Apfel und die Nüsse dazu.\n4. Gieß Milch darüber.\n\nZutat oder Schritt?"
                say: "Lies das Rezept. Sortiere: Ist es eine Zutat oder ein Schritt?"
                bins:
                  - { id: zutat, show: { text: "Zutat" }, say: "Zutat" }
                  - { id: schritt, show: { text: "Schritt" }, say: "Schritt" }
                options:
                  - { text: "4 Löffel Haferflocken", bin: zutat }
                  - { text: "Reibe den Apfel.", bin: schritt }
                  - { text: "1 Handvoll Nüsse", bin: zutat }
                  - { text: "Gieß Milch darüber.", bin: schritt }
              - id: l2-n2
                type: multiple_choice
                text: "Müsli\nZutaten: 4 Löffel Haferflocken, 1 Apfel, 1 Handvoll Nüsse, Milch\n\nWie viele Löffel Haferflocken brauchst du?"
                say: "Lies die Zutaten. Wie viele Löffel Haferflocken brauchst du?"
                options: ["4", "1", "2"]
                answer: "4"
              - id: l2-n3
                type: multiple_choice
                text: "Müsli\n1. Gib die Haferflocken in eine Schale.\n2. Reibe den Apfel.\n3. ...\n4. Gieß Milch darüber.\n\nEin Schritt fehlt. Welcher?"
                say: "Lies die Schritte. Ein Schritt fehlt. Welcher?"
                options: ["Gib den Apfel und die Nüsse dazu.", "Stell die Schale in den Ofen.", "Wasch dir die Haare."]
                answer: "Gib den Apfel und die Nüsse dazu."
              - id: l2-n4
                type: true_false
                text: "Müsli\n1. Gib die Haferflocken in eine Schale.\n2. Reibe den Apfel.\n3. Gib den Apfel und die Nüsse dazu.\n4. Gieß Milch darüber.\n\nGießt du die Milch ganz zum Schluss darüber?"
                say: "Lies die Schritte. Gießt du die Milch ganz zum Schluss darüber?"
