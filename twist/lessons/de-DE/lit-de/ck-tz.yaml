          - text: "Kerze | Pilz | Brezel"
            say: "Hörst du vor dem z noch einen Mitlaut, wie in Kerze und Pilz, oder ist der Selbstlaut lang, wie in Brezel, schreibst du nur z."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "tz oder z?"
                say: "Die Hitze. Was fehlt?"
                frame: "Hi_e"
                options: ["tz", "z", "zz"]
