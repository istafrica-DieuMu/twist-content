# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.ck-tz
skill: lit-de.spelling.ck-tz
curriculum: de-DE
language: de
title:
  de: ck und tz
  en: ck and tz
summary: >
  After a short Selbstlaut, k is written ck and z is written tz. Lesson
  1 takes ck (Schnecke, Socke, Rock) against k after a Mitlaut or a long
  Selbstlaut (Wolke, Haken); lesson 2 takes tz (Katze, Mütze, Platz)
  against z (Kerze, Pilz, Brezel), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Kurze und lange Selbstlaute, en: Short and long vowels }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling.double-consonants]
  also_practises: [lit-de.spelling.double-consonants, lit-de.spelling.short-long-vowels]
  vocabulary: { de: [ck, tz, kurzer Selbstlaut, Mitlaut] }
  forms: [picture, text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: kk-zz
      what: Doubles k or z like other Mitlaute (Glokke, Kazze, Schnekke)
      addressed: lesson 1 and 2 Learn say ck not kk and tz not zz; the first ck or tz gap of every Practise stage offers kk or zz, and l1-f4, l1-c3 and l2-f4 show Brükke, Dakkel and Pfüzze
    - id: ck-everywhere
      what: Writes ck or tz after a Mitlaut or a long Selbstlaut (Gurcke, Schmertz, Hacken for Haken)
      addressed: lesson 1 Learn shows Wolke and Haken, lesson 2 Learn shows Kerze, Pilz and Brezel; every stage has a k or z gap after a Mitlaut or a long Selbstlaut
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "ck oder k?", en: "ck or k?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "t oder tt?"
            say: "Das Bett. Was fehlt?"
            frame: "Be_"
            options: ["tt", "t"]
            answer: ["tt"]
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Ist das o kurz oder lang?"
            say: "Hör zu. Ist das o kurz oder lang?"
            audio: { de: "Locke." }
            options: ["kurz", "lang"]
            keep_order: true
            answer: "kurz"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Schnecke"
            say: "Hör genau hin: Schnecke. Das e ist kurz, danach hörst du ein k. Nach einem kurzen Selbstlaut schreibst du nicht kk, sondern ck."
            show: { object: snail }
          - text: "Glocke | Socke | Rock"
            say: "Glocke, Socke, Rock: Überall steht nach dem kurzen Selbstlaut ck."
            show: { object: bell }
          - text: "Wolke | Haken"
            say: "Hörst du vor dem k noch einen Mitlaut, wie das l in Wolke, oder ist der Selbstlaut lang, wie in Haken, schreibst du nur k."
            show: { object: cloud }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "ck oder k?"
                say: "Die Decke. Was fehlt?"
                frame: "De_e"
                options: ["ck", "k", "kk"]
                answer: ["ck"]
                hints:
                  - "Ist das e kurz oder lang?"
                  - "Es ist kurz, und danach hörst du nur das k."
                  - "Nach einem kurzen Selbstlaut steht ck: Decke."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "ck oder k?"
                say: "Der Anker. Was fehlt?"
                show: { object: anchor }
                frame: "An_er"
                options: ["k", "ck"]
                answer: ["k"]
                hints:
                  - "Hörst du vor dem k noch einen Mitlaut?"
                  - "Ja, das n."
                  - "Dann steht nur k: Anker."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Die Jacke. Welches Wort ist richtig geschrieben?"
                show: { object: jacket }
                options: ["Jacke", "Jake", "Jakke"]
                answer: "Jacke"
                option_audio: false
                hints:
                  - "Ist das a kurz oder lang?"
                  - "Es ist kurz. Wie schreibst du k nach einem kurzen Selbstlaut?"
                  - "Jacke mit ck."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Die Brücke. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Brükke" }
                answer: false
                hints:
                  - "Schau dir die Buchstaben nach dem ü genau an."
                  - "Das ü ist kurz. Wie schreibst du ein k nach einem kurzen Selbstlaut?"
                  - "Nein. Statt kk schreibst du ck: Brücke."
              - id: l1-f5
                type: audio_choice
                text: "ck oder k?"
                say: "Hör zu. Schreibt man das Wort mit ck oder mit k?"
                audio: { de: "Der Bäcker." }
                options: ["ck", "k"]
                keep_order: true
                answer: "ck"
                hints:
                  - "Hör auf den Selbstlaut vor dem k."
                  - "Ist das ä kurz? Hörst du vor dem k noch einen Mitlaut?"
                  - "Das ä ist kurz, und vor dem k steht kein Mitlaut. Also ck: Bäcker."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "ck oder k?"
                say: "Die Hecke. Was fehlt?"
                frame: "He_e"
                options: ["ck", "k", "kk"]
                answer: ["ck"]
                hints: ["Ist das e kurz?"]
              - id: l1-s2
                type: fill_in_blank
                text: "ck oder k?"
                say: "Die Bank. Was fehlt?"
                frame: "Ban_"
                options: ["k", "ck"]
                answer: ["k"]
                hints: ["Hörst du vor dem k einen Mitlaut?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Rücken. Welches Wort ist richtig geschrieben?"
                options: ["Rücken", "Rüken", "Rükken"]
                answer: "Rücken"
                option_audio: false
                hints: ["Das ü ist kurz."]
              - id: l1-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Das Glück. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Glück" }
                answer: true
                hints: ["Ist das ü kurz?"]
              - id: l1-s5
                type: audio_choice
                text: "ck oder k?"
                say: "Hör zu. Schreibt man das Wort mit ck oder mit k?"
                audio: { de: "Denken." }
                options: ["ck", "k"]
                keep_order: true
                answer: "k"
                hints: ["Hörst du vor dem k noch einen Mitlaut?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "ck oder k?"
                say: "Die Mücke. Was fehlt?"
                frame: "Mü_e"
                options: ["ck", "k", "kk"]
                answer: ["ck"]
              - id: l1-n2
                type: fill_in_blank
                text: "ck oder k?"
                say: "Quaken. Was fehlt?"
                frame: "qua_en"
                options: ["k", "ck"]
                answer: ["k"]
              - id: l1-n3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Wecker. Welches Wort ist richtig geschrieben?"
                options: ["Wecker", "Weker", "Wekker"]
                answer: "Wecker"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Der Zucker. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Zuker" }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "ck oder k?"
                say: "Hör zu. Schreibt man das Wort mit ck oder mit k?"
                audio: { de: "Der Stock." }
                options: ["ck", "k"]
                keep_order: true
                answer: "ck"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "ck oder k?"
            say: "Der Fleck. Was fehlt?"
            frame: "Fle_"
            options: ["ck", "k"]
            answer: ["ck"]
          - id: l1-c2
            type: fill_in_blank
            text: "ck oder k?"
            say: "Die Birke. Was fehlt?"
            frame: "Bir_e"
            options: ["k", "ck"]
            answer: ["k"]
          - id: l1-c3
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Der Dackel. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Dakkel" }
            answer: false

  - n: 2
    title: { de: "tz oder z?", en: "tz or z?" }
    new_content: true
    activities:
      - activity: warm-up
