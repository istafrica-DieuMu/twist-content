                text: "Ist das Wort richtig geschrieben?"
                say: "Der Kranz. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Kranz" }
                answer: true
              - id: l2-n5
                type: audio_choice
                text: "tz oder z?"
                say: "Hör zu. Schreibt man das Wort mit tz oder mit z?"
