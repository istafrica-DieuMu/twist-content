# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.spoken-written
skill: lit-de.vocabulary.spoken-written
curriculum: de-DE
language: de
title:
  de: Gesprochene und geschriebene Sprache
  en: Spoken and written language
summary: >
  How we speak and how we write. Lesson 1 sets spoken German against
  written German: short forms (hab, is, nich, 'ne), filler words (äh,
  halt, also), unfinished sentences and the Perfekt in speech, full
  sentences and the Präteritum in a written story. Lesson 2 rewrites
  Umgangssprache in Standardsprache (super krass, voll müde, Kumpel),
  decides where each fits (with a friend, in a letter to the Bürgermeisterin,
  in a school report), meets a few words from Dialekte, and ends with the
  skill check.
metadata:
  year: klasse-4
  topic: { de: Sprache untersuchen, en: Exploring language }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.verbs.perfect]
  also_practises: [lit-de.verbs.perfect, lit-de.verbs.simple-past]
  vocabulary: { de: [gesprochene Sprache, geschriebene Sprache, Umgangssprache, Standardsprache, Dialekt, Füllwort, Kurzform, Perfekt, Präteritum] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: write-as-speak
      what: Writes the way they talk, with short forms, filler words and half sentences
      addressed: "lesson 1 Learn sets a spoken and a written version side by side; l1-f1 (with feedback), l1-s1, l1-n1 and l2-c1 choose the written sentence; l1-f2, l1-s2, l1-n2 sort spoken from written"
    - id: slang-is-wrong
      what: Thinks Umgangssprache or Dialekt is simply wrong German, instead of fitting some situations and not others
      addressed: "lesson 2 Learn says each has its place; l2-f3, l2-s3, l2-n3 and l2-c4 ask where a sentence fits, with feedback on l2-f3; l2-f5 and l2-s5 take Dialekt words as real words"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Sprechen und Schreiben", en: "Speaking and writing" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Satz steht im Perfekt?"
            options: ["Ich habe ein Eis gegessen.", "Ich esse ein Eis.", "Ich aß ein Eis."]
            answer: "Ich habe ein Eis gegessen."
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Ergänze das Perfekt."
            frame: "Wir _ ins Kino gegangen."
            options: ["sind", "haben", "waren"]
            answer: ["sind"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Gesprochen:\n„Äh, also gestern, da bin ich mit Tim, weißt du, wir sind halt zum See gefahren. War voll schön.“\n\nGeschrieben:\nGestern fuhr ich mit Tim zum See. Es war sehr schön."
            say: "Lies beide Fassungen. Beide erzählen dasselbe. Beim Sprechen sagt man äh, also oder halt, fängt Sätze neu an und lässt Wörter weg. Beim Schreiben bildet man ganze Sätze ohne solche Füllwörter."
          - text: "gesprochen: hab, is, nich, 'ne, gibt's\ngeschrieben: habe, ist, nicht, eine, gibt es"
            say: "Beim Sprechen verschlucken wir oft Laute. Dann sagen wir hab statt habe oder nich statt nicht. Beim Schreiben schreibst du die Wörter vollständig."
          - text: "gesprochen: Ich bin zum See gefahren.\ngeschrieben in einer Geschichte: Ich fuhr zum See."
            say: "Wenn wir von gestern erzählen, sprechen wir meistens im Perfekt: Ich bin gefahren. In einer geschriebenen Geschichte steht oft das Präteritum: Ich fuhr."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Satz ist geschrieben, wie man ihn in einem Aufsatz schreibt?"
                options: ["Am Samstag habe ich meine Oma besucht.", "Am Samstag hab ich, äh, meine Oma besucht.", "Samstag Oma besucht, war cool."]
                answer: "Am Samstag habe ich meine Oma besucht."
                option_audio: false
                feedback:
                  "Am Samstag hab ich, äh, meine Oma besucht.": "So spricht man. Im Aufsatz schreibst du habe und lässt das äh weg."
                hints:
                  - "Achte auf Kurzformen und Füllwörter."
                  - "Welcher Satz ist vollständig und hat kein äh?"
                  - "Am Samstag habe ich meine Oma besucht."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Gesprochen oder geschrieben?"
                say: "Sortiere: Klingt das nach gesprochener oder nach geschriebener Sprache?"
                bins:
                  - { id: spoken, show: { text: "gesprochen" }, say: "gesprochen" }
                  - { id: written, show: { text: "geschrieben" }, say: "geschrieben" }
                options:
                  - { text: "Äh, wo is'n mein Stift?", bin: spoken }
                  - { text: "Hab ich doch gesagt!", bin: spoken }
                  - { text: "Wo ist mein Stift?", bin: written }
                  - { text: "Das habe ich doch gesagt.", bin: written }
                option_audio: false
                hints:
                  - "Achte auf äh und auf Kurzformen wie is'n und hab."
                  - "Geschrieben sind die Wörter vollständig."
                  - "Mit äh und Kurzformen: gesprochen. Vollständig: geschrieben."
              - id: l1-f3
                type: matching
                text: "Wie schreibt man es vollständig?"
                say: "Verbinde die Kurzform mit dem vollständigen Wort."
                pairs:
                  - { left: { text: "hab" }, right: { text: "habe" } }
                  - { left: { text: "nich" }, right: { text: "nicht" } }
                  - { left: { text: "'ne" }, right: { text: "eine" } }
                  - { left: { text: "is" }, right: { text: "ist" } }
                option_audio: false
                hints:
                  - "Welcher Laut fehlt bei der Kurzform?"
                  - "Bei nich fehlt das t am Ende."
                  - "Vollständig heißt es habe, nicht, eine und ist."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Wörter wie äh, halt und also schreibt man in einem Aufsatz meistens nicht."
                answer: true
                hints:
                  - "Wozu sagen wir äh beim Sprechen?"
                  - "Beim Sprechen überlegen wir dabei. Beim Schreiben haben wir Zeit."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Ben erzählt: „Ich bin auf den Baum geklettert.“ Wie steht der Satz oft in einer geschriebenen Geschichte?"
                say: "Ben erzählt: Ich bin auf den Baum geklettert. Wie steht der Satz oft in einer geschriebenen Geschichte?"
                options: ["Ich kletterte auf den Baum.", "Ich klettere auf den Baum.", "Ich werde auf den Baum klettern."]
                answer: "Ich kletterte auf den Baum."
                hints:
                  - "In geschriebenen Geschichten steht oft das Präteritum."
                  - "Das Präteritum von klettern ist kletterte."
                  - "Ich kletterte auf den Baum."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Satz passt in einen Brief an deine Lehrerin?"
                options: ["Ich bin morgen leider krank und kann nicht kommen.", "Bin morgen krank, komm nich.", "Also, äh, ich bin halt krank morgen."]
                answer: "Ich bin morgen leider krank und kann nicht kommen."
                option_audio: false
                hints: ["Welcher Satz ist vollständig und ohne Füllwörter?"]
              - id: l1-s2
                type: sorting
                text: "Gesprochen oder geschrieben?"
                say: "Sortiere: Klingt das nach gesprochener oder nach geschriebener Sprache?"
                bins:
                  - { id: spoken, show: { text: "gesprochen" }, say: "gesprochen" }
                  - { id: written, show: { text: "geschrieben" }, say: "geschrieben" }
                options:
                  - { text: "Gibt's heut Nudeln?", bin: spoken }
                  - { text: "Also, ich mein halt, ja.", bin: spoken }
                  - { text: "Gibt es heute Nudeln?", bin: written }
                  - { text: "Ich bin einverstanden.", bin: written }
                option_audio: false
                hints: ["Wo fehlen Laute, wo stehen Füllwörter?"]
              - id: l1-s3
                type: matching
                text: "Wie schreibt man es vollständig?"
                say: "Verbinde die Kurzform mit den vollständigen Wörtern."
                pairs:
                  - { left: { text: "gibt's" }, right: { text: "gibt es" } }
                  - { left: { text: "heut" }, right: { text: "heute" } }
                  - { left: { text: "geht's" }, right: { text: "geht es" } }
                  - { left: { text: "'n" }, right: { text: "ein" } }
                option_audio: false
                hints: ["Das Häkchen zeigt, dass etwas fehlt."]
              - id: l1-s4
                type: true_false
                text: "Wenn wir von gestern erzählen, sprechen wir meistens im Perfekt. Stimmt das?"
                answer: true
                hints: ["Sagst du eher: Ich bin gerannt, oder: Ich rannte?"]
              - id: l1-s5
                type: multiple_choice
                text: "Mia erzählt: „Wir haben einen Schneemann gebaut.“ Wie steht der Satz oft in einer geschriebenen Geschichte?"
                say: "Mia erzählt: Wir haben einen Schneemann gebaut. Wie steht der Satz oft in einer geschriebenen Geschichte?"
                options: ["Wir bauten einen Schneemann.", "Wir bauen einen Schneemann.", "Wir hatten gebaut einen Schneemann."]
                answer: "Wir bauten einen Schneemann."
                hints: ["Das Präteritum von bauen ist bauten."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welcher Satz ist geschrieben, wie man ihn in einem Bericht schreibt?"
                options: ["Um zehn Uhr begann das Sportfest.", "Also um zehn ging's dann los mit Sport und so.", "Sportfest, zehn Uhr, äh, Start."]
                answer: "Um zehn Uhr begann das Sportfest."
                option_audio: false
              - id: l1-n2
                type: sorting
                text: "Gesprochen oder geschrieben?"
                say: "Sortiere: Klingt das nach gesprochener oder nach geschriebener Sprache?"
                bins:
                  - { id: spoken, show: { text: "gesprochen" }, say: "gesprochen" }
                  - { id: written, show: { text: "geschrieben" }, say: "geschrieben" }
                options:
                  - { text: "Hast du 'ne Schere?", bin: spoken }
                  - { text: "Nee, weiß nich.", bin: spoken }
                  - { text: "Hast du eine Schere?", bin: written }
                  - { text: "Nein, das weiß ich nicht.", bin: written }
                option_audio: false
              - id: l1-n3
                type: matching
                text: "Wie schreibt man es vollständig?"
                say: "Verbinde die Kurzform mit dem vollständigen Wort."
                pairs:
                  - { left: { text: "nee" }, right: { text: "nein" } }
                  - { left: { text: "'nen" }, right: { text: "einen" } }
                  - { left: { text: "ham" }, right: { text: "haben" } }
                  - { left: { text: "grad" }, right: { text: "gerade" } }
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Stimmt das? Wenn man spricht, bildet man immer ganze, vollständige Sätze."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Opa erzählt: „Ich bin früher jeden Tag zur Schule gelaufen.“ Wie steht der Satz oft in einer geschriebenen Geschichte?"
                say: "Opa erzählt: Ich bin früher jeden Tag zur Schule gelaufen. Wie steht der Satz oft in einer geschriebenen Geschichte?"
                options: ["Ich lief früher jeden Tag zur Schule.", "Ich laufe früher jeden Tag zur Schule.", "Ich bin früher jeden Tag zur Schule laufen."]
                answer: "Ich lief früher jeden Tag zur Schule."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welcher Satz ist geschrieben, wie man ihn in einem Aufsatz schreibt?"
            options: ["Im Urlaub sind wir viel geschwommen.", "Im Urlaub, äh, sind wir halt viel geschwommen.", "Urlaub, viel geschwommen, war super."]
            answer: "Im Urlaub sind wir viel geschwommen."
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Wie schreibt man „nich“ vollständig?"
            say: "Wie schreibt man die Kurzform nich vollständig?"
            options: ["nicht", "nich", "nichts"]
            answer: "nicht"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Ist „äh“ ein Wort, das man vor allem beim Sprechen benutzt?"
            say: "Ist äh ein Wort, das man vor allem beim Sprechen benutzt?"
            answer: true

  - n: 2
    title: { de: "Umgangssprache und Standardsprache", en: "Everyday speech and standard German" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie schreibt man „gibt's“ vollständig?"
            say: "Wie schreibt man die Kurzform gibt's vollständig?"
            options: ["gibt es", "gibst", "gibt"]
            answer: "gibt es"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "In einer geschriebenen Geschichte steht oft das Präteritum. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Umgangssprache: Der Film war voll krass!\nStandardsprache: Der Film war sehr spannend."
            say: "Mit Freunden reden wir oft locker. Das ist Umgangssprache. Wörter wie voll, krass oder cool gehören dazu. In der Schule, in einem Brief an Fremde oder in einem Bericht benutzt du die Standardsprache. Die verstehen alle, und sie ist höflich und genau."
          - text: "mit deinem Freund: „Hey, kommst du mit kicken?“\nin einem Brief an die Bürgermeisterin: „Sehr geehrte Frau Bürgermeisterin, wir wünschen uns einen neuen Fußballplatz.“"
            say: "Umgangssprache ist nicht falsch. Sie passt nur nicht überall. Frag dich: Mit wem spreche oder schreibe ich? Dann wählst du die passende Sprache."
          - text: "Norddeutschland: Moin! Brötchen\nBayern: Servus! Semmel\nBerlin: Schrippe"
            say: "In manchen Gegenden sprechen die Menschen einen Dialekt. Dann heißt das Brötchen Semmel oder Schrippe, und man grüßt mit Moin oder Servus. Auch das ist richtiges Deutsch. In der Schule schreibst du aber meistens die Standardsprache."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "„Das Essen war voll lecker.“ Wie sagst du das in der Standardsprache?"
                say: "Das Essen war voll lecker. Wie sagst du das in der Standardsprache?"
                options: ["Das Essen war sehr lecker.", "Das Essen war voll krass.", "Essen voll lecker."]
                answer: "Das Essen war sehr lecker."
                hints:
                  - "Welches Wort ist Umgangssprache?"
                  - "Voll heißt hier: sehr."
                  - "Das Essen war sehr lecker."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was ist die Standardsprache?"
                say: "Verbinde das Wort aus der Umgangssprache mit dem Wort aus der Standardsprache."
                pairs:
                  - { left: { text: "Kumpel" }, right: { text: "Freund" } }
                  - { left: { text: "Kohle" }, right: { text: "Geld" } }
                  - { left: { text: "pennen" }, right: { text: "schlafen" } }
                  - { left: { text: "futtern" }, right: { text: "essen" } }
                hints:
                  - "Stell dir vor, wie du es deiner Lehrerin sagen würdest."
                  - "Mit Kohle kauft man etwas ein."
                  - "Kumpel: Freund. Kohle: Geld. pennen: schlafen. futtern: essen."
              - id: l2-f3
                type: multiple_choice
                text: "Wo passt der Satz „Ey, das war echt cool!“ gut?"
                say: "Wo passt der Satz: Ey, das war echt cool! gut?"
                options: ["im Gespräch mit einer Freundin", "in einem Brief an die Bürgermeisterin", "in einem Sachtext über Wale"]
                answer: "im Gespräch mit einer Freundin"
                feedback:
                  "in einem Brief an die Bürgermeisterin": "An die Bürgermeisterin schreibst du höflich und in Standardsprache. Ey und cool sind Umgangssprache."
                hints:
                  - "Ist das Umgangssprache oder Standardsprache?"
                  - "Umgangssprache passt zu Leuten, die du gut kennst."
                  - "Im Gespräch mit einer Freundin."
              - id: l2-f4
                type: sorting
                text: "Umgangssprache oder Standardsprache?"
                say: "Sortiere: Ist das Umgangssprache oder Standardsprache?"
                bins:
                  - { id: casual, show: { text: "Umgangssprache" }, say: "Umgangssprache" }
                  - { id: standard, show: { text: "Standardsprache" }, say: "Standardsprache" }
                options:
                  - { text: "Ich bin total kaputt.", bin: casual }
                  - { text: "Das ist mega gut.", bin: casual }
                  - { text: "Ich bin sehr müde.", bin: standard }
                  - { text: "Das ist sehr gut.", bin: standard }
                hints:
                  - "Welche Wörter würdest du in einem Bericht nicht schreiben?"
                  - "Total kaputt und mega sind locker."
                  - "Umgangssprache: kaputt und mega. Standardsprache: sehr müde und sehr gut."
              - id: l2-f5
                type: true_false
                text: "In Bayern sagen viele Menschen Semmel statt Brötchen. Ist Semmel ein falsches Wort?"
                answer: false
                hints:
                  - "Was ist ein Dialekt?"
                  - "Semmel ist das Wort aus einer Gegend in Deutschland."
                  - "Nein, Semmel ist ein richtiges Wort aus dem Dialekt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "„Der Test war voll schwer, echt jetzt.“ Wie sagst du das in der Standardsprache?"
                say: "Der Test war voll schwer, echt jetzt. Wie sagst du das in der Standardsprache?"
                options: ["Der Test war wirklich sehr schwer.", "Test voll schwer.", "Der Test war echt mega schwer."]
                answer: "Der Test war wirklich sehr schwer."
                hints: ["Ersetze voll und echt jetzt."]
              - id: l2-s2
                type: matching
                text: "Was ist die Standardsprache?"
                say: "Verbinde das Wort aus der Umgangssprache mit dem Wort aus der Standardsprache."
                pairs:
                  - { left: { text: "abhauen" }, right: { text: "weggehen" } }
                  - { left: { text: "quatschen" }, right: { text: "sich unterhalten" } }
                  - { left: { text: "Klamotten" }, right: { text: "Kleidung" } }
                  - { left: { text: "kapieren" }, right: { text: "verstehen" } }
                hints: ["Was ziehst du jeden Morgen an?"]
              - id: l2-s3
                type: multiple_choice
                text: "Welcher Satz passt in einen Brief an den Zoodirektor?"
                options: ["Wir würden gern mit unserer Klasse den Zoo besuchen.", "Hey, wir wollen mal in euren Zoo, geht klar?", "Zoo, wir kommen, voll gut!"]
                answer: "Wir würden gern mit unserer Klasse den Zoo besuchen."
                hints: ["Den Zoodirektor kennst du nicht. Schreib höflich."]
              - id: l2-s4
                type: sorting
                text: "Umgangssprache oder Standardsprache?"
                say: "Sortiere: Ist das Umgangssprache oder Standardsprache?"
                bins:
                  - { id: casual, show: { text: "Umgangssprache" }, say: "Umgangssprache" }
                  - { id: standard, show: { text: "Standardsprache" }, say: "Standardsprache" }
                options:
                  - { text: "Was geht ab?", bin: casual }
                  - { text: "Lass mal chillen.", bin: casual }
                  - { text: "Wie geht es dir?", bin: standard }
                  - { text: "Lass uns eine Pause machen.", bin: standard }
                hints: ["Welche Sätze sagst du nur zu Freunden?"]
              - id: l2-s5
                type: multiple_choice
                text: "Im Norden grüßen viele Menschen mit „Moin!“. Was ist das?"
                say: "Im Norden grüßen viele Menschen mit Moin. Was ist das?"
                options: ["ein Gruß aus einem Dialekt", "ein Schreibfehler", "ein englisches Wort"]
                answer: "ein Gruß aus einem Dialekt"
                hints: ["Wo sagt man Moin?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "„Die Party war mega cool.“ Wie sagst du das in der Standardsprache?"
                say: "Die Party war mega cool. Wie sagst du das in der Standardsprache?"
                options: ["Die Feier war sehr schön.", "Die Party war voll cool.", "Party mega."]
                answer: "Die Feier war sehr schön."
              - id: l2-n2
                type: matching
                text: "Was ist die Standardsprache?"
                say: "Verbinde das Wort aus der Umgangssprache mit dem Wort aus der Standardsprache."
                pairs:
                  - { left: { text: "Glotze" }, right: { text: "Fernseher" } }
                  - { left: { text: "Bude" }, right: { text: "Zimmer" } }
                  - { left: { text: "flitzen" }, right: { text: "schnell laufen" } }
                  - { left: { text: "Zoff" }, right: { text: "Streit" } }
              - id: l2-n3
                type: multiple_choice
                text: "Wo passt der Satz „Sehr geehrte Damen und Herren, wir bitten um Informationen über Ihr Museum.“ gut?"
                say: "Wo passt der Satz: Sehr geehrte Damen und Herren, wir bitten um Informationen über Ihr Museum. gut?"
                options: ["in einem Brief an das Museum", "in einer Nachricht an deinen besten Freund", "beim Spielen auf dem Schulhof"]
                answer: "in einem Brief an das Museum"
              - id: l2-n4
                type: sorting
                text: "Umgangssprache oder Standardsprache?"
                say: "Sortiere: Ist das Umgangssprache oder Standardsprache?"
                bins:
                  - { id: casual, show: { text: "Umgangssprache" }, say: "Umgangssprache" }
                  - { id: standard, show: { text: "Standardsprache" }, say: "Standardsprache" }
                options:
                  - { text: "Ich hab null Bock.", bin: casual }
                  - { text: "Das ist voll öde.", bin: casual }
                  - { text: "Ich habe keine Lust.", bin: standard }
                  - { text: "Das ist sehr langweilig.", bin: standard }
              - id: l2-n5
                type: true_false
                text: "In Berlin sagen viele Menschen Schrippe statt Brötchen. Ist Schrippe ein Wort aus einem Dialekt?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welcher Satz passt in einen Bericht über den Wandertag?"
            options: ["Nach zwei Stunden erreichten wir die Burg.", "Nach, äh, zwei Stunden waren wir dann halt an der Burg.", "Zwei Stunden, Burg, voll weit."]
            answer: "Nach zwei Stunden erreichten wir die Burg."
            option_audio: false
          - id: l2-c2
            type: fill_in_blank
            text: "Gesprochen: „Ich hab 'ne Idee.“ Schreib den Satz vollständig."
            say: "Gesprochen heißt es: Ich hab 'ne Idee. Schreib den Satz vollständig."
            frame: "Ich _ _ Idee."
            options: ["habe", "hab", "eine", "'ne"]
            answer: ["habe", "eine"]
            option_audio: false
          - id: l2-c3
