# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.make-media
skill: lit-de.texts-media.make-media
curriculum: de-DE
language: de
title:
  de: Medienbeiträge gestalten
  en: Making media
summary: >
  Planning a small media product of your own. The app cannot judge a real
  slideshow or recording, so the lessons teach and check what goes into a
  good one. Lesson 1 plans a Präsentation and a Plakat: the steps in
  order, Stichwörter instead of whole sentences on a Folie, one topic per
  Folie, large writing and a clear Überschrift, and pictures you may use
  with their Quelle. Lesson 2 plans a Hörgeschichte: Erzähler, Figuren,
  Geräusche and Musik, how to make a sound at home, a Drehbuch in order,
  recording tips and asking before you record or photograph someone; it
  ends with the skill check. Hearing real sound effects waits for effect
  sounds in the bank; here they are described in words.
metadata:
  year: klasse-4
  topic: { de: Medien, en: Media }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.texts-media.media-use]
  also_practises: [lit-de.texts-media.media-use]
  vocabulary: { de: [Präsentation, Folie, Plakat, Stichwort, Überschrift, Quelle, Hörgeschichte, Hörspiel, Erzähler, Geräusch, Drehbuch, Mikrofon, aufnehmen] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: whole-text-on-slide
      what: Copies whole sentences or a full text onto a Folie or Plakat, so nobody can read it from a distance
      addressed: "lesson 1 Learn sets a crowded Folie against one with Stichwörter; l1-f1, l1-s1, l1-n1 and l2-c1 choose the better Folie, with feedback on l1-f1; l1-f4 and l1-n4 sort what makes a Plakat easy to read"
    - id: any-picture-is-free
      what: Thinks any picture from the internet may be used without asking or naming where it is from
      addressed: "lesson 1 Learn names own pictures and free pictures with their Quelle; l1-f5, l1-s5 and l1-c3 ask which picture you may use, with feedback on l1-f5; l2-f5, l2-n5 and l2-c5 ask before recording or photographing someone"
    - id: only-voices
      what: Plans an audio story as reading the text aloud and forgets Geräusche, Musik and different voices
      addressed: "lesson 2 Learn names the four parts of a Hörgeschichte; l2-f1, l2-s1 and l2-n1 match a sound to a scene, with feedback on l2-f1; l2-f2 and l2-c2 sort the parts"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Präsentation und Plakat", en: "Slideshow and poster" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Über einem Bild steht klein: gesponsert. Was bedeutet das?"
            options: ["Das ist Werbung.", "Das Bild ist besonders alt.", "Das Bild hat ein Kind gemalt."]
            answer: "Das ist Werbung."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Deine Adresse schreibst du nicht ins Internet. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1. Thema wählen\n2. Informationen sammeln\n3. Folien oder Plakat gestalten\n4. Vortrag üben\n5. vortragen"
            say: "Du willst deiner Klasse etwas über ein Thema zeigen, zum Beispiel über Pinguine. Dafür gehst du in Schritten vor. Erst wählst du das Thema und sammelst Informationen. Dann gestaltest du die Folien oder das Plakat. Zum Schluss übst du den Vortrag und hältst ihn."
          - text: "Folie A:\nPinguine leben am Südpol und sie können nicht fliegen, aber sie schwimmen sehr gut und sie fressen Fische und Krill.\n\nFolie B:\nPinguine\n• leben am Südpol\n• schwimmen sehr gut\n• fressen Fische"
            say: "Auf eine Folie gehören nur Stichwörter, kein langer Text. Den Rest erzählst du selbst. Folie B ist besser: eine Überschrift, wenige Stichwörter, große Schrift. Jede Folie hat nur ein Thema. Für ein Plakat gilt dasselbe: Man muss es auch von weitem lesen können. Dabei helfen große, dunkle Schrift auf hellem Papier und ein großes Bild zum Thema."
          - text: "Bilder für deine Präsentation:\neigene Fotos und Zeichnungen\nfreie Bilder, mit Quelle\n\nBild: Kinderlexikon Tierwelt"
            say: "Nicht jedes Bild aus dem Internet darfst du einfach nehmen. Am besten nimmst du eigene Fotos und Zeichnungen. Oder du nimmst Bilder, die ausdrücklich frei sind. Dann schreibst du direkt unter das Bild, woher es kommt. Das ist die Quelle."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Folie ist besser?\n\nA: Igel\n• schlafen im Winter\n• fressen Käfer und Würmer\n\nB: Igel schlafen im Winter, weil es dann kaum Futter gibt, und sie fressen Käfer und Würmer und manchmal auch Schnecken."
                say: "Lies die zwei Folien. Welche Folie ist besser?"
                options: ["Folie A", "Folie B"]
                answer: "Folie A"
                keep_order: true
                feedback:
                  "Folie B": "Auf Folie B steht ein langer Satz. Den kann beim Vortrag niemand schnell lesen. Auf eine Folie gehören Stichwörter."
                hints:
                  - "Was gehört auf eine Folie: Stichwörter oder lange Sätze?"
                  - "Auf welcher Folie stehen nur wenige Wörter?"
                  - "Folie A hat eine Überschrift und Stichwörter."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Bring die Schritte für eine Präsentation in die richtige Reihenfolge."
                options: ["Folien gestalten", "Vortrag üben", "Thema wählen", "Informationen sammeln"]
                slot_count: 4
                answer: ["Thema wählen", "Informationen sammeln", "Folien gestalten", "Vortrag üben"]
                hints:
                  - "Was musst du wissen, bevor du etwas sammelst?"
                  - "Ohne Informationen kannst du keine Folien machen."
                  - "Thema, Informationen, Folien, üben."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Auf einer Folie stehen am besten mehrere Themen gleichzeitig, damit man nicht so viele Folien braucht."
                answer: false
                hints:
                  - "Wie viele Themen hat eine gute Folie?"
                  - "Mit zu vielen Themen verliert man den Überblick."
                  - "Nein, jede Folie hat nur ein Thema."
              - id: l1-f4
                type: sorting
                text: "Macht das ein Plakat gut lesbar?"
                say: "Sortiere: Macht das ein Plakat gut lesbar oder schwer lesbar?"
                bins:
                  - { id: good, show: { text: "gut lesbar" }, say: "gut lesbar" }
                  - { id: bad, show: { text: "schwer lesbar" }, say: "schwer lesbar" }
                options:
                  - { text: "eine große Überschrift", bin: good }
                  - { text: "wenige Stichwörter", bin: good }
                  - { text: "ganz kleine Schrift", bin: bad }
                  - { text: "ein langer Text aus dem Buch abgeschrieben", bin: bad }
                hints:
                  - "Ein Plakat hängt an der Wand. Man liest es von weitem."
                  - "Was kann man aus drei Metern noch lesen?"
                  - "Große Überschrift und wenige Stichwörter sind gut lesbar."
              - id: l1-f5
                type: multiple_choice
                text: "Welches Bild darfst du für deine Präsentation nehmen?"
                options: ["ein Foto, das du selbst gemacht hast", "irgendein Bild aus dem Internet, ohne zu fragen", "ein Foto von einem fremden Kind, ohne zu fragen"]
                answer: "ein Foto, das du selbst gemacht hast"
                feedback:
                  "irgendein Bild aus dem Internet, ohne zu fragen": "Bilder im Internet gehören jemandem. Nimm nur Bilder, die frei sind, und schreib die Quelle dazu."
                hints:
                  - "Wem gehört ein Bild?"
                  - "Ein eigenes Foto gehört dir."
                  - "Das Foto, das du selbst gemacht hast."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Folie ist besser?\n\nA: Der Mond kreist um die Erde und er braucht dafür ungefähr einen Monat und er leuchtet nicht selbst.\n\nB: Der Mond\n• kreist um die Erde\n• braucht etwa einen Monat\n• leuchtet nicht selbst"
                say: "Lies die zwei Folien. Welche Folie ist besser?"
                options: ["Folie A", "Folie B"]
                answer: "Folie B"
                keep_order: true
                hints: ["Wo stehen Stichwörter?"]
              - id: l1-s2
                type: ordering
                text: "Bring die Schritte für ein Plakat in die richtige Reihenfolge."
                options: ["das Plakat aufhängen und vorstellen", "Stichwörter und Bilder aufkleben", "eine Überschrift schreiben", "Informationen sammeln"]
                slot_count: 4
                answer: ["Informationen sammeln", "eine Überschrift schreiben", "Stichwörter und Bilder aufkleben", "das Plakat aufhängen und vorstellen"]
                hints: ["Was steht ganz oben auf dem Plakat?"]
              - id: l1-s3
                type: multiple_choice
                text: "Wie hältst du deinen Vortrag zu den Folien?"
                options: ["Ich erzähle frei und schaue die Klasse an.", "Ich lese alles von der Folie ab.", "Ich drehe mich zur Wand und flüstere."]
                answer: "Ich erzähle frei und schaue die Klasse an."
                hints: ["Die Folie hat nur Stichwörter. Wer erzählt den Rest?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? Unter ein Bild aus einem Kinderlexikon schreibst du, woher es kommt."
                answer: true
                hints: ["Wie heißt die Angabe, woher ein Bild kommt?"]
              - id: l1-s5
                type: multiple_choice
                text: "Ole findet im Internet ein schönes Foto von einem Wal. Was muss er tun, bevor er es nimmt?"
                options: ["prüfen, ob das Bild frei ist, und die Quelle dazuschreiben", "nichts, alle Bilder im Internet sind frei", "das Bild bunter machen"]
                answer: "prüfen, ob das Bild frei ist, und die Quelle dazuschreiben"
                hints: ["Darf man jedes Bild einfach nehmen?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Folie ist besser?\n\nA: Vulkane\n• Lava ist flüssiges Gestein\n• Ätna: Vulkan in Italien\n\nB: Vulkane, Dinosaurier, Planeten und das Wetter"
                say: "Lies die zwei Folien. Welche Folie ist besser?"
                options: ["Folie A", "Folie B"]
                answer: "Folie A"
                keep_order: true
              - id: l1-n2
                type: ordering
                text: "Bring die Schritte für eine Präsentation in die richtige Reihenfolge."
                options: ["vortragen", "Folien gestalten", "Informationen sammeln", "Vortrag üben"]
                slot_count: 4
                answer: ["Informationen sammeln", "Folien gestalten", "Vortrag üben", "vortragen"]
              - id: l1-n3
                type: true_false
                text: "Stimmt das? Wer seinen Vortrag vorher übt, spricht sicherer."
                answer: true
              - id: l1-n4
                type: sorting
                text: "Macht das ein Plakat gut lesbar?"
                say: "Sortiere: Macht das ein Plakat gut lesbar oder schwer lesbar?"
                bins:
                  - { id: good, show: { text: "gut lesbar" }, say: "gut lesbar" }
                  - { id: bad, show: { text: "schwer lesbar" }, say: "schwer lesbar" }
                options:
                  - { text: "dicke, dunkle Schrift", bin: good }
                  - { text: "ein großes Bild zum Thema", bin: good }
                  - { text: "gelbe Schrift auf weißem Papier", bin: bad }
                  - { text: "jeder Platz voll mit Text", bin: bad }
              - id: l1-n5
                type: multiple_choice
                text: "Wohin schreibst du die Quelle eines Bildes?"
                options: ["direkt unter das Bild", "auf die Rückseite des Plakats", "nirgendwohin"]
                answer: "direkt unter das Bild"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was gehört auf eine Folie?"
            options: ["eine Überschrift und wenige Stichwörter", "der ganze Text aus dem Sachbuch", "möglichst viele Themen"]
            answer: "eine Überschrift und wenige Stichwörter"
          - id: l1-c2
            type: multiple_choice
            text: "Was machst du direkt vor dem Vortrag?"
            options: ["den Vortrag üben", "ein neues Thema wählen", "Informationen sammeln"]
            answer: "den Vortrag üben"
          - id: l1-c3
            type: true_false
            text: "Darfst du eine Zeichnung nehmen, die du selbst gemalt hast?"
            answer: true

  - n: 2
    title: { de: "Eine Hörgeschichte planen", en: "Planning an audio story" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Folie ist besser?\n\nA: Bienen\n• sammeln Nektar\n• machen Honig\n\nB: Bienen fliegen von Blüte zu Blüte und sammeln dort Nektar, aus dem sie dann im Stock Honig machen."
            say: "Lies die zwei Folien. Welche Folie ist besser?"
            options: ["Folie A", "Folie B"]
            answer: "Folie A"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Zu einem freien Bild aus dem Internet schreibst du die Quelle. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Erzähler: „Es war schon dunkel im Wald.“\nFigur Paula: „Hörst du das auch?“\nGeräusch: Ein Ast knackt.\nMusik: leise und unheimlich"
            say: "Eine Hörgeschichte hat vier Teile. Der Erzähler erzählt, was passiert. Die Figuren sprechen mit eigener Stimme. Geräusche zeigen, wo man ist und was geschieht. Und Musik zeigt die Stimmung: lustig, traurig oder spannend."
          - text: "Regen: Reis in einer Dose schütteln\nFeuer: Alufolie zerknüllen\nPferd: zwei Becher auf den Tisch klopfen"
            say: "Viele Geräusche kannst du selbst machen. Für Regen schüttelst du Reis in einer Dose. Für ein knisterndes Feuer zerknüllst du Alufolie. Und mit zwei Bechern klingt es wie ein Pferd, das läuft."
          - text: "Drehbuch\n1. Erzähler: Paula und Ben gehen in den Wald.\n2. Geräusch: Schritte auf Laub\n3. Ben: „Wie still es hier ist.“"
            say: "Bevor du aufnimmst, schreibst du ein Drehbuch. Dort steht der Reihe nach, wer spricht und welches Geräusch kommt. Nimm in einem ruhigen Raum auf, sprich deutlich und nah am Mikrofon. Und frag immer, bevor du jemanden aufnimmst oder fotografierst."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "In deiner Hörgeschichte sitzen die Kinder im Zelt. Draußen beginnt es zu regnen. Welches Geräusch passt?"
                options: ["Reis in einer Dose schütteln", "eine Fahrradklingel", "Hundegebell"]
                answer: "Reis in einer Dose schütteln"
                feedback:
                  "eine Fahrradklingel": "Eine Klingel passt nicht zum Regen. Die Zuhörer sollen hören, was in der Geschichte passiert."
                hints:
                  - "Was passiert gerade draußen?"
                  - "Welches Geräusch klingt wie viele kleine Tropfen?"
                  - "Reis in einer Dose klingt wie Regen."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Welcher Teil der Hörgeschichte ist das?"
                say: "Sortiere: Ist das der Erzähler, eine Figur oder ein Geräusch?"
                bins:
                  - { id: narrator, show: { text: "Erzähler" }, say: "Erzähler" }
                  - { id: figure, show: { text: "Figur" }, say: "Figur" }
                  - { id: noise, show: { text: "Geräusch" }, say: "Geräusch" }
                options:
                  - { text: "Am nächsten Morgen war der Schnee weg.", bin: narrator }
                  - { text: "Opa: „Wer hat meine Brille versteckt?“", bin: figure }
                  - { text: "Eine Tür quietscht.", bin: noise }
                hints:
                  - "Wer erzählt, was passiert? Wer spricht selbst?"
                  - "Hat die Zeile einen Namen davor, spricht eine Figur."
                  - "Morgen: Erzähler. Opa: Figur. Tür: Geräusch."
              - id: l2-f3
                type: ordering
                text: "Bring die Arbeitsschritte für eine Hörgeschichte in die richtige Reihenfolge."
                options: ["aufnehmen", "Geschichte ausdenken", "Drehbuch schreiben", "anhören und verbessern"]
                slot_count: 4
                answer: ["Geschichte ausdenken", "Drehbuch schreiben", "aufnehmen", "anhören und verbessern"]
                hints:
                  - "Was brauchst du, bevor du ein Drehbuch schreibst?"
                  - "Aufnehmen kommt nach dem Drehbuch."
                  - "Ausdenken, Drehbuch, aufnehmen, anhören."
              - id: l2-f4
                type: multiple_choice
                text: "Wo nimmst du deine Hörgeschichte am besten auf?"
                options: ["in einem ruhigen Zimmer", "auf dem Schulhof in der Pause", "neben der laufenden Waschmaschine"]
                answer: "in einem ruhigen Zimmer"
                hints:
                  - "Was soll man auf der Aufnahme hören?"
                  - "Andere Geräusche stören."
                  - "In einem ruhigen Zimmer."
              - id: l2-f5
                type: true_false
                text: "Du willst deine Freundin Aylin für deine Hörgeschichte aufnehmen. Fragst du sie vorher?"
                answer: true
                hints:
                  - "Wem gehört Aylins Stimme?"
                  - "Niemand muss sich aufnehmen lassen."
                  - "Ja, du fragst immer vorher."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "In deiner Hörgeschichte sitzt die Familie am Lagerfeuer. Welches Geräusch passt?"
                options: ["Alufolie zerknüllen", "Wasser in ein Glas gießen", "eine Tür zuschlagen"]
                answer: "Alufolie zerknüllen"
                hints: ["Wie klingt ein Feuer?"]
              - id: l2-s2
                type: multiple_choice
                text: "In deiner Geschichte wird es plötzlich gefährlich. Welche Musik passt?"
                options: ["spannende, schnelle Musik", "ein fröhliches Geburtstagslied", "ein leises Schlaflied"]
                answer: "spannende, schnelle Musik"
                hints: ["Die Musik soll die Stimmung zeigen."]
              - id: l2-s3
                type: ordering
                text: "So beginnt dein Drehbuch. Bring die Zeilen in eine sinnvolle Reihenfolge."
                options: ["Paula: „Da hat doch jemand geklopft!“", "Geräusch: Es klopft an der Tür.", "Erzähler: Paula sitzt allein in der Küche."]
                slot_count: 3
                answer: ["Erzähler: Paula sitzt allein in der Küche.", "Geräusch: Es klopft an der Tür.", "Paula: „Da hat doch jemand geklopft!“"]
                option_audio: false
                hints: ["Paula reagiert auf das Klopfen. Was muss vorher kommen?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Beim Aufnehmen sprichst du deutlich und nicht zu weit weg vom Mikrofon."
                answer: true
                hints: ["Was passiert, wenn du leise und weit weg sprichst?"]
              - id: l2-s5
                type: multiple_choice
                text: "Du willst ein Foto von deinem Banknachbarn auf dein Plakat kleben. Was tust du?"
                options: ["ihn vorher fragen", "ihn heimlich fotografieren", "das Foto ohne Frage ins Internet stellen"]
                answer: "ihn vorher fragen"
                hints: ["Darf man jemanden ohne Erlaubnis fotografieren?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "In deiner Hörgeschichte reitet ein Ritter über eine Brücke. Welches Geräusch passt?"
                options: ["zwei Becher auf den Tisch klopfen", "Reis in einer Dose schütteln", "Papier zerreißen"]
                answer: "zwei Becher auf den Tisch klopfen"
              - id: l2-n2
                type: sorting
                text: "Welcher Teil der Hörgeschichte ist das?"
                say: "Sortiere: Ist das der Erzähler, eine Figur oder ein Geräusch?"
                bins:
                  - { id: narrator, show: { text: "Erzähler" }, say: "Erzähler" }
                  - { id: figure, show: { text: "Figur" }, say: "Figur" }
                  - { id: noise, show: { text: "Geräusch" }, say: "Geräusch" }
                options:
                  - { text: "Lange war es still im Schloss.", bin: narrator }
                  - { text: "Prinzessin: „Ist da jemand?“", bin: figure }
                  - { text: "Glas klirrt.", bin: noise }
              - id: l2-n3
                type: ordering
                text: "Bring die Arbeitsschritte für eine Hörgeschichte in die richtige Reihenfolge."
                options: ["die Aufnahme der Klasse vorspielen", "aufnehmen", "Geschichte ausdenken", "Drehbuch schreiben"]
                slot_count: 4
                answer: ["Geschichte ausdenken", "Drehbuch schreiben", "aufnehmen", "die Aufnahme der Klasse vorspielen"]
              - id: l2-n4
                type: multiple_choice
                text: "Deine Aufnahme ist fertig. Beim Anhören merkst du, dass ein Satz kaum zu verstehen ist. Was tust du?"
                options: ["den Satz noch einmal deutlich aufnehmen", "nichts, das merkt keiner", "die ganze Hörgeschichte löschen"]
                answer: "den Satz noch einmal deutlich aufnehmen"
              - id: l2-n5
                type: true_false
                text: "Darfst du deinen kleinen Bruder heimlich aufnehmen und die Aufnahme in der Klasse vorspielen?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welche Folie ist besser?\n\nA: Elefanten sind die größten Tiere an Land und sie trinken mit dem Rüssel und sie leben in Afrika und Asien.\n\nB: Elefanten\n• größte Landtiere\n• trinken mit dem Rüssel\n• leben in Afrika und Asien"
            say: "Lies die zwei Folien. Welche Folie ist besser?"
            options: ["Folie A", "Folie B"]
            answer: "Folie B"
            keep_order: true
          - id: l2-c2
            type: sorting
            text: "Welcher Teil der Hörgeschichte ist das?"
            say: "Ordne zu: Ist das der Erzähler, eine Figur oder ein Geräusch?"
            bins:
              - { id: narrator, show: { text: "Erzähler" }, say: "Erzähler" }
              - { id: figure, show: { text: "Figur" }, say: "Figur" }
              - { id: noise, show: { text: "Geräusch" }, say: "Geräusch" }
            options:
              - { text: "Plötzlich ging das Licht aus.", bin: narrator }
              - { text: "Max: „Hilfe, wo bist du?“", bin: figure }
              - { text: "Ein Donner grollt.", bin: noise }
          - id: l2-c3
            type: multiple_choice
            text: "In deiner Hörgeschichte geht ein Mädchen über eine Wiese, während es regnet. Welches Geräusch passt?"
            options: ["Reis in einer Dose schütteln", "Alufolie zerknüllen", "eine Klingel läuten"]
            answer: "Reis in einer Dose schütteln"
          - id: l2-c4
