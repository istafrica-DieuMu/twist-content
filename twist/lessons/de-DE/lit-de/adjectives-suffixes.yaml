# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.adjectives-suffixes
skill: lit-de.adjectives.suffixes
curriculum: de-DE
language: de
title:
  de: Adjektive mit -ig, -lich, -isch und -bar
  en: Adjectives with -ig, -lich, -isch and -bar
summary: >
  New adjectives are made from nouns and verbs with an ending (Sonne,
  sonnig; Freund, freundlich). Lesson 1 builds adjectives with -ig and
  -lich and checks the spelling by making the word longer (ruhig,
  ruhige); lesson 2 adds -isch and -bar and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Adjektive, en: Adjectives }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.adjectives.recognise, lit-de.spelling-strategies.word-stem]
  also_practises: [lit-de.adjectives.agreement]
  vocabulary: { de: [Endung, Wortstamm, verlängern, -ig, -lich, -isch, -bar] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: ig-ich-spelling
      what: Writes "-ich" for "-ig" (ruhich) because both sound alike at the end
      addressed: lesson 1 Learn makes the word longer (ruhige) to hear the g; spelling tasks with -ig and -lich in every stage of lesson 1 offer the wrong spelling (ich, lig) as a chip; the full stage says the longer form, the later stages leave it to the child
    - id: capital-after-ending
      what: Keeps the capital letter of the noun (Sonnig)
      addressed: lesson 1 Learn says the new word is an adjective and is written small; a true/false task in the full stage of lesson 1 and in the skill check shows the capital form
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "sonnig und freundlich", en: "sunny and friendly" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort hat denselben Wortstamm wie „fahren“?"
            say: "Welches Wort hat denselben Wortstamm wie fahren?"
            options: ["Fahrrad", "Farbe", "fallen"]
            answer: "Fahrrad"
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Das Bild ist bunt." }
            spans: ["bunt"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "die Sonne → sonnig"
            say: "Aus einem Nomen kannst du ein Adjektiv machen. Die Sonne scheint, der Tag ist sonnig. Du hängst -ig an den Wortstamm."
          - text: "der Freund → freundlich"
            say: "Auch mit -lich geht es: der Freund, freundlich. Das neue Wort ist ein Adjektiv. Du schreibst es klein."
          - text: "ruhig → ruhige · fröhlich → fröhliche"
            say: "Am Ende klingen -ig und -lich fast gleich. Mach das Wort länger: ruhige, da hörst du das g. Fröhliche, da hörst du ch."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "der Wind → _"
                say: "Mach aus dem Nomen ein Adjektiv. Der Wind, …"
                options: ["windig", "windlich", "Windig"]
                answer: "windig"
                feedback:
                  "Windig": "Das neue Wort ist ein Adjektiv. Du schreibst es klein: windig."
                hints:
                  - "Hänge eine Endung an Wind."
                  - "Ein Tag mit viel Wind ist …"
                  - "windig."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung. Der Hund ist durstig. Mach das Wort länger: der durstige Hund."
                frame: "durst_"
                options: ["ig", "ich", "lich"]
                answer: ["ig"]
                hints:
                  - "Mach das Wort länger."
                  - "Durstige: Hörst du g oder ch?"
                  - "ig."
              - id: l1-f3
                type: multiple_choice
                text: "die Gefahr → _"
                say: "Mach aus dem Nomen ein Adjektiv. Die Gefahr, …"
                options: ["gefährlich", "gefahrig", "Gefährlich"]
                answer: "gefährlich"
                hints:
                  - "Hier passt -lich."
                  - "Aus a wird ä."
                  - "gefährlich."
              - id: l1-f4
                type: true_false
                text: "Richtig geschrieben? Der Himmel ist Wolkig."
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Der Himmel ist Wolkig." }
                answer: false
                hints:
                  - "Ist wolkig ein Nomen oder ein Adjektiv?"
                  - "Adjektive schreibst du klein."
                  - "Nein. Richtig ist: wolkig."
              - id: l1-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Nomen mit seinem Adjektiv."
                pairs:
                  - { left: { text: "der Schmutz" }, right: { text: "schmutzig" } }
                  - { left: { text: "der Tag" }, right: { text: "täglich" } }
                  - { left: { text: "der Hunger" }, right: { text: "hungrig" } }
                hints:
                  - "Such den Wortstamm."
                  - "Was jeden Tag passiert, passiert …"
                  - "Schmutz gehört zu schmutzig, Tag zu täglich, Hunger zu hungrig."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "der Saft → _"
                say: "Mach aus dem Nomen ein Adjektiv. Der Saft, …"
                options: ["saftig", "saftlich", "Saftig"]
                answer: "saftig"
                hints: ["Welches Wort kennst du? Und wie schreibst du Adjektive?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung. Die Kinder sind lustig. Mach das Wort länger."
                frame: "lust_"
                options: ["ig", "ich", "lich"]
                answer: ["ig"]
                hints: ["Sag: die lustigen Kinder. Hörst du g oder ch?"]
              - id: l1-s3
                type: multiple_choice
                text: "die Natur → _"
                say: "Mach aus dem Nomen ein Adjektiv. Die Natur, …"
                options: ["natürlich", "naturig", "Natürlich"]
                answer: "natürlich"
                hints: ["Achte auf die Endung und auf den Anfangsbuchstaben."]
              - id: l1-s4
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung. Der Hund ist friedlich. Mach das Wort länger."
                frame: "fried_"
                options: ["lich", "lig", "ig"]
                answer: ["lich"]
                hints: ["Sag: der friedliche Hund. Hörst du g oder ch?"]
              - id: l1-s5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Nomen mit seinem Adjektiv."
                pairs:
                  - { left: { text: "der Staub" }, right: { text: "staubig" } }
                  - { left: { text: "der Ärger" }, right: { text: "ärgerlich" } }
                  - { left: { text: "das Eis" }, right: { text: "eisig" } }
                hints: ["Such den Wortstamm in jedem Adjektiv."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "der Schatten → _"
                say: "Mach aus dem Nomen ein Adjektiv. Der Schatten, …"
                options: ["schattig", "schattlich", "Schattig"]
                answer: "schattig"
              - id: l1-n2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung. Das Kissen ist kuschelig."
                frame: "kuschel_"
                options: ["ig", "ich", "lich"]
                answer: ["ig"]
              - id: l1-n3
                type: multiple_choice
                text: "der Mensch → _"
                say: "Mach aus dem Nomen ein Adjektiv. Der Mensch, …"
                options: ["menschlich", "menschig", "Menschlich"]
                answer: "menschlich"
              - id: l1-n4
                type: true_false
                text: "Richtig geschrieben? Der Weg ist steinich."
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Der Weg ist steinich." }
                answer: false
              - id: l1-n5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Nomen mit seinem Adjektiv."
                pairs:
                  - { left: { text: "der Berg" }, right: { text: "bergig" } }
                  - { left: { text: "die Woche" }, right: { text: "wöchentlich" } }
                  - { left: { text: "der Fleiß" }, right: { text: "fleißig" } }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "der Nebel → _"
            say: "Mach aus dem Nomen ein Adjektiv. Der Nebel, …"
            options: ["neblig", "nebelich", "Neblig"]
            answer: "neblig"
          - id: l1-c2
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung. Das Kind ist ehrlich."
            frame: "ehr_"
            options: ["lich", "lig", "ig"]
            answer: ["lich"]
          - id: l1-c3
            type: true_false
            text: "Richtig geschrieben? Das Brot ist frisch und knusprig."
            say: "Lies die Karte. Ist das richtig geschrieben?"
            show: { drawn: letter-card, text: "Das Brot ist frisch und knusprig." }
            answer: true

  - n: 2
    title: { de: "kindisch und essbar", en: "childish and edible" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "das Glück → _"
            say: "Mach aus dem Nomen ein Adjektiv. Das Glück, …"
            options: ["glücklich", "glückig", "Glücklich"]
            answer: "glücklich"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung. Die Hose ist dreckig. Mach das Wort länger: die dreckige Hose."
            frame: "dreck_"
            options: ["ig", "ich", "lich"]
            answer: ["ig"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "der Neid → neidisch"
            say: "Auch mit -isch kannst du Adjektive bauen: der Neid, neidisch. Oder: Spanien, spanisch."
          - text: "trinken → trinkbar"
            say: "Mit -bar baust du Adjektive aus Verben. Man kann das Wasser trinken. Es ist trinkbar."
          - text: "-ig · -lich · -isch · -bar"
            say: "Das sind vier Endungen für Adjektive: -ig, -lich, -isch und -bar."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "das Kind → _"
                say: "Tom benimmt sich wie ein kleines Kind. Er ist …"
                options: ["kindisch", "kindbar", "Kindisch"]
                answer: "kindisch"
                feedback:
                  "kindbar": "-bar passt zu Verben. Kind ist ein Nomen: kindisch."
                hints:
                  - "Kind ist ein Nomen. -bar passt nur zu Verben."
                  - "Adjektive schreibst du klein."
                  - "kindisch."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "waschen → _"
                say: "Den Pulli kann man waschen. Er ist …"
                options: ["waschbar", "waschig", "waschisch"]
                answer: "waschbar"
                hints:
                  - "Man kann ihn waschen."
                  - "Bei Verben hilft -bar."
                  - "waschbar."
              - id: l2-f3
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung. Tims Laune wechselt oft. Er ist laun…"
                frame: "laun_"
                options: ["isch", "ig", "bar"]
                answer: ["isch"]
                hints:
                  - "Wie heißt das Adjektiv zu Laune? Sag es laut."
                  - "Am Ende hörst du sch."
                  - "isch."
              - id: l2-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seinem Adjektiv."
                pairs:
                  - { left: { text: "lesen" }, right: { text: "lesbar" } }
                  - { left: { text: "der Sturm" }, right: { text: "stürmisch" } }
                  - { left: { text: "der Spaß" }, right: { text: "spaßig" } }
                hints:
                  - "Das Verb bekommt -bar."
                  - "Ein Tag mit viel Sturm ist …"
                  - "lesen gehört zu lesbar, Sturm zu stürmisch, Spaß zu spaßig."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? Man kann die Pilze essen. Sie sind essbar."
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "Man kann die Pilze essen. Sie sind essbar." }
                answer: true
                hints:
                  - "Was bedeutet -bar?"
                  - "Essbar heißt: man kann es essen."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "der Regen → _"
                say: "Mach aus dem Nomen ein Adjektiv. Der Regen, …"
                options: ["regnerisch", "regenbar", "Regnerisch"]
                answer: "regnerisch"
                hints: ["Regen ist ein Nomen. Passt -bar zu Nomen?"]
              - id: l2-s2
                type: multiple_choice
                text: "bezahlen → _"
                say: "Das Fahrrad ist nicht zu teuer. Man kann es bezahlen. Es ist …"
                options: ["bezahlbar", "bezahlig", "bezahlisch"]
                answer: "bezahlbar"
                hints: ["Bezahlen ist ein Verb. Welche Endung passt zu Verben?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung. Den Fehler kann man sehen. Er ist sicht…"
                frame: "sicht_"
                options: ["bar", "isch", "ig"]
                answer: ["bar"]
                hints: ["Lies den Satz noch einmal: Man kann ihn sehen."]
              - id: l2-s4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seinem Adjektiv."
                pairs:
                  - { left: { text: "hören" }, right: { text: "hörbar" } }
                  - { left: { text: "die Mode" }, right: { text: "modisch" } }
                  - { left: { text: "der Mut" }, right: { text: "mutig" } }
                hints: ["Ein Verb ist dabei. Es bekommt -bar."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das?"
                say: "Lies die Karte. Passt das Adjektiv?"
                show: { drawn: letter-card, text: "Man kann den Rucksack tragen. Er ist tragbar." }
                answer: true
                hints: ["Was bedeutet die Endung -bar?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "das Tier → _"
                say: "Mach aus dem Nomen ein Adjektiv. Das Tier, …"
                options: ["tierisch", "tierbar", "Tierisch"]
                answer: "tierisch"
              - id: l2-n2
                type: multiple_choice
                text: "reparieren → _"
                say: "Das Spielzeug kann man reparieren. Es ist …"
                options: ["reparierbar", "reparierig", "reparierlich"]
                answer: "reparierbar"
              - id: l2-n3
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung. Die Pizza kommt aus Italien. Sie ist italien…"
                frame: "italien_"
                options: ["isch", "bar", "ig"]
                answer: ["isch"]
              - id: l2-n4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seinem Adjektiv."
                pairs:
                  - { left: { text: "erkennen" }, right: { text: "erkennbar" } }
                  - { left: { text: "der Dieb" }, right: { text: "diebisch" } }
                  - { left: { text: "die Angst" }, right: { text: "ängstlich" } }
              - id: l2-n5
                type: true_false
                text: "Stimmt das? Den Brief kann man nicht lesen. Er ist lesbar."
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "Den Brief kann man nicht lesen. Er ist lesbar." }
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "der Sand → _"
            say: "Mach aus dem Nomen ein Adjektiv. Der Sand, …"
            options: ["sandig", "sandisch", "Sandig"]
            answer: "sandig"
          - id: l2-c2
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung. Der Junge ist höflich."
            frame: "höf_"
            options: ["lich", "lig", "ig"]
            answer: ["lich"]
          - id: l2-c3
            type: multiple_choice
            text: "klappen → _"
            say: "Den Stuhl kann man zusammenklappen. Er ist …"
            options: ["klappbar", "klappig", "klappisch"]
            answer: "klappbar"
          - id: l2-c4
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung. Alle lachen über den Clown. Er ist kom…"
            frame: "kom_"
            options: ["isch", "bar", "lich"]
            answer: ["isch"]
          - id: l2-c5
            type: true_false
            text: "Richtig geschrieben? Der Hund ist Neugierig."
            say: "Lies die Karte. Ist das richtig geschrieben?"
            show: { drawn: letter-card, text: "Der Hund ist Neugierig." }
            answer: false
