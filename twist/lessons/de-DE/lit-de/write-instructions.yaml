# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.write-instructions
skill: lit-de.writing.instructions
curriculum: de-DE
language: de
title:
  de: Anleitungen schreiben
  en: Writing instructions
summary: >
  Writing a short Anleitung that someone else can follow. Lesson 1 puts
  the steps in order, uses zuerst, dann and zum Schluss, starts with what
  you need, and finds the step that is missing; lesson 2 writes each step
  as a clear instruction (Gieß ..., not Ich habe ... gegossen), says
  exactly how much, picks a heading, keeps story and opinion sentences
  out, and ends with the skill check. Writing the whole Anleitung freely
  waits for a free text task type; here the child orders, chooses and
  sorts steps.
metadata:
  year: klasse-2
  topic: { de: Beschreiben, en: Describing }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.writing.describe, lit-de.texts-media.instructions]
  also_practises: [lit-de.texts-media.instructions, lit-de.writing.describe]
  vocabulary: { de: [Anleitung, Schritt, Reihenfolge, zuerst, dann, danach, zum Schluss, Überschrift, Du brauchst] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: skipped-step
      what: Leaves out a step that seems obvious, or writes the steps out of order, so the reader cannot follow
      addressed: "lesson 1 Learn reads the Anleitung as if someone does exactly what it says; steps are ordered in every stage of lesson 1 and in l2-w1 and l2-c1 (l1-f1, l1-s1, l1-n1, l1-c1); the missing step is found in l1-f3 (with feedback), l1-s3, l1-n3, l1-c3 and l2-c3; l1-f5 and l1-n5 ask whether order and every step matter"
    - id: story-voice
      what: Tells what they did (Ich habe ... genommen) or adds opinions, instead of telling the reader what to do in short, exact steps
      addressed: "lesson 2 Learn sets Ich habe Saft gegossen against Gieß Saft and etwas Mehl against zwei Löffel Mehl; every stage of lesson 2 picks the instruction sentence (l2-f1 with feedback, l2-s1, l2-n1, l2-c2) and the more exact step (l2-f2, l2-s2, l2-n2, l2-c5), and sorts steps from story and opinion sentences (l2-f4, l2-s4, l2-n4); l2-f5 and l2-n5 ask about a vague and a story sentence"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Schritt für Schritt aufschreiben", en: "Writing it step by step" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Satz beschreibt den Becher genau?"
            say: "Welcher Satz beschreibt den Becher genau?"
            options: ["Der Becher ist gelb und hat einen Henkel.", "Der Becher ist schön.", "Der Becher ist super."]
            answer: "Der Becher ist gelb und hat einen Henkel."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Seifenblasen machen\n1. Mische Wasser und Spülmittel.\n2. Tauch den Ring hinein.\n3. Puste vorsichtig.\n\nWas machst du nach Schritt 2?"
            say: "Lies die Anleitung. Was machst du nach Schritt 2?"
            options: ["Puste vorsichtig.", "Mische Wasser und Spülmittel.", "Tauch den Ring hinein."]
            answer: "Puste vorsichtig."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Butterbrot schmieren\nDu brauchst: eine Scheibe Brot, Butter, ein Messer\n1. Leg das Brot auf einen Teller.\n2. Nimm mit dem Messer ein Stück Butter.\n3. Streich die Butter auf das Brot."
            say: "Ole schreibt eine Anleitung. Zuerst schreibt er auf, was man braucht. Dann schreibt er die Schritte auf, einen nach dem anderen, in der richtigen Reihenfolge."
          - text: "Zuerst ... | Dann ... | Danach ... | Zum Schluss ..."
            say: "Statt Nummern kannst du auch diese Wörter benutzen: zuerst, dann, danach und zum Schluss. So weiß der Leser immer, was als Nächstes kommt."
          - text: "Stell dir vor: Jemand macht genau das, was du schreibst."
            say: "Lies deine Anleitung am Ende noch einmal. Stell dir vor, jemand macht genau das, was dort steht. Fehlt ein Schritt? Dann klappt es nicht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Zähne putzen: Bring die Schritte in die richtige Reihenfolge."
                say: "Bring die Schritte zum Zähneputzen in die richtige Reihenfolge."
                options: ["Putz die Zähne gründlich.", "Gib Zahnpasta auf die Bürste.", "Spül den Mund mit Wasser aus.", "Nimm deine Zahnbürste."]
                slot_count: 4
                answer: ["Nimm deine Zahnbürste.", "Gib Zahnpasta auf die Bürste.", "Putz die Zähne gründlich.", "Spül den Mund mit Wasser aus."]
                hints:
                  - "Was brauchst du, bevor du anfangen kannst?"
                  - "Ohne Zahnbürste keine Zahnpasta. Ausspülen kommt nach dem Putzen."
                  - "Bürste nehmen, Zahnpasta, putzen, ausspülen."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Setz die Wörter für die Reihenfolge ein."
                say: "Welches Wort passt in welche Lücke?"
                frame: "_ nimmst du einen Becher. _ gießt du Saft hinein. _ trinkst du den Saft."
                options: ["Zuerst", "Dann", "Zum Schluss"]
                answer: ["Zuerst", "Dann", "Zum Schluss"]
                hints:
                  - "Ein Wort sagt: Das kommt am Anfang. Eins sagt: Das kommt am Ende."
                  - "Zuerst ist der Anfang, zum Schluss das Ende."
                  - "Zuerst, dann, zum Schluss."
              - id: l1-f3
                type: multiple_choice
                text: "Eine Pflanze gießen\n1. Füll die Gießkanne mit Wasser.\n2. ...\n3. Stell die Gießkanne wieder weg.\n\nWelcher Schritt fehlt?"
                say: "Lies die Anleitung. Welcher Schritt fehlt?"
                options: ["Gieß das Wasser auf die Erde.", "Kauf eine neue Pflanze.", "Trink ein Glas Wasser."]
                answer: "Gieß das Wasser auf die Erde."
                feedback:
                  "Kauf eine neue Pflanze.": "Die Pflanze ist schon da. Was muss mit dem Wasser in der Kanne passieren?"
                hints:
                  - "Mach die Anleitung im Kopf nach. Wo klappt es nicht?"
                  - "Die Kanne ist voll und wird wieder weggestellt. Und die Pflanze?"
                  - "Gieß das Wasser auf die Erde."
              - id: l1-f4
                type: multiple_choice
                text: "Was schreibst du in einer Anleitung zuerst auf?"
                say: "Was schreibst du in einer Anleitung zuerst auf?"
                options: ["was man braucht", "den letzten Schritt", "wie es dir gefallen hat"]
                answer: "was man braucht"
                hints:
                  - "Denk an Oles Anleitung für das Butterbrot."
                  - "Bevor es losgeht, legt man sich alles hin."
                  - "was man braucht."
              - id: l1-f5
                type: true_false
                text: "In einer Anleitung ist die Reihenfolge der Schritte egal. Stimmt das?"
                say: "In einer Anleitung ist die Reihenfolge der Schritte egal. Stimmt das?"
                answer: false
                hints:
                  - "Kannst du die Butter streichen, bevor das Brot da ist?"
                  - "Jeder Schritt baut auf dem Schritt davor auf."
                  - "Nein, die Reihenfolge ist wichtig."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Eine Blume pflanzen: Bring die Schritte in die richtige Reihenfolge."
                say: "Bring die Schritte zum Blumenpflanzen in die richtige Reihenfolge."
                options: ["Gieß die Blume.", "Grab ein Loch in die Erde.", "Drück die Erde fest.", "Setz die Blume in das Loch."]
                slot_count: 4
                answer: ["Grab ein Loch in die Erde.", "Setz die Blume in das Loch.", "Drück die Erde fest.", "Gieß die Blume."]
                hints: ["Wohin kommt die Blume? Das muss zuerst da sein."]
              - id: l1-s2
                type: fill_in_blank
                text: "Setz die Wörter für die Reihenfolge ein."
                say: "Welches Wort passt in welche Lücke?"
                frame: "_ legst du ein Blatt hin. _ malst du einen Kreis. _ malst du Augen und einen Mund hinein."
                options: ["Zuerst", "Dann", "Zum Schluss"]
                answer: ["Zuerst", "Dann", "Zum Schluss"]
                hints: ["Welches Wort sagt: Das kommt am Anfang?"]
              - id: l1-s3
                type: multiple_choice
                text: "Müsli machen\n1. Nimm eine Schüssel.\n2. ...\n3. Gieß Milch darüber.\n4. Iss mit dem Löffel.\n\nWelcher Schritt fehlt?"
                say: "Lies die Anleitung. Welcher Schritt fehlt?"
                options: ["Schütte Haferflocken in die Schüssel.", "Wasch die Schüssel ab.", "Räum die Milch weg."]
                answer: "Schütte Haferflocken in die Schüssel."
                hints: ["Die Schüssel ist da. Was fehlt noch darin?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Wörter passen an den Anfang des letzten Schritts?"
                say: "Welche Wörter passen an den Anfang des letzten Schritts?"
                options: ["Zum Schluss", "Zuerst", "Am Anfang"]
                answer: "Zum Schluss"
                hints: ["Der letzte Schritt ist am Ende."]
              - id: l1-s5
                type: true_false
                text: "In einer Anleitung kommt ein Schritt nach dem anderen. Stimmt das?"
                say: "In einer Anleitung kommt ein Schritt nach dem anderen. Stimmt das?"
                answer: true
                hints: ["Denk an die Nummern 1, 2, 3."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Ein Geschenk einpacken: Bring die Schritte in die richtige Reihenfolge."
                say: "Bring die Schritte zum Einpacken in die richtige Reihenfolge."
                options: ["Klebe das Papier fest.", "Leg das Geschenk auf das Papier.", "Schneide genug Papier ab.", "Wickle das Papier um das Geschenk."]
                slot_count: 4
                answer: ["Schneide genug Papier ab.", "Leg das Geschenk auf das Papier.", "Wickle das Papier um das Geschenk.", "Klebe das Papier fest."]
              - id: l1-n2
                type: fill_in_blank
                text: "Setz die Wörter für die Reihenfolge ein."
                say: "Welches Wort passt in welche Lücke?"
                frame: "_ ziehst du die Jacke an. _ setzt du die Mütze auf. _ gehst du nach draußen."
                options: ["Zuerst", "Danach", "Zum Schluss"]
                answer: ["Zuerst", "Danach", "Zum Schluss"]
              - id: l1-n3
                type: multiple_choice
                text: "Hände waschen\n1. Mach die Hände nass.\n2. ...\n3. Spül die Seife ab.\n4. Trockne die Hände ab.\n\nWelcher Schritt fehlt?"
                say: "Lies die Anleitung. Welcher Schritt fehlt?"
                options: ["Reib die Hände mit Seife ein.", "Mach das Licht aus.", "Putz dir die Nase."]
                answer: "Reib die Hände mit Seife ein."
              - id: l1-n4
                type: multiple_choice
                text: "Welches Wort passt an den Anfang des ersten Schritts?"
                say: "Welches Wort passt an den Anfang des ersten Schritts?"
                options: ["Zuerst", "Zum Schluss", "Danach"]
                answer: "Zuerst"
              - id: l1-n5
                type: true_false
                text: "Lena lässt in der Anleitung für das Butterbrot einen Schritt weg: „Streich die Butter auf das Brot.“ Klappt die Anleitung noch?"
                say: "Lena lässt in der Anleitung für das Butterbrot einen Schritt weg: Streich die Butter auf das Brot. Klappt die Anleitung noch?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "Saft trinken: Bring die Schritte in die richtige Reihenfolge."
            say: "Bring die Schritte in die richtige Reihenfolge."
            options: ["Gieß Saft in das Glas.", "Trink den Saft.", "Nimm ein Glas."]
            slot_count: 3
            answer: ["Nimm ein Glas.", "Gieß Saft in das Glas.", "Trink den Saft."]
          - id: l1-c2
            type: fill_in_blank
            text: "Setz die Wörter für die Reihenfolge ein."
            say: "Welches Wort passt in welche Lücke?"
            frame: "_ nimmst du einen Stift. _ schreibst du deinen Namen. _ legst du den Stift weg."
            options: ["Zuerst", "Dann", "Zum Schluss"]
            answer: ["Zuerst", "Dann", "Zum Schluss"]
          - id: l1-c3
            type: multiple_choice
            text: "Ein Bild für dein Zimmer\n1. Nimm ein Blatt Papier.\n2. ...\n3. Häng das Bild an die Wand.\n\nWelcher Schritt fehlt?"
            say: "Lies die Anleitung. Welcher Schritt fehlt?"
            options: ["Mal ein Bild mit deinen Stiften.", "Wirf das Blatt weg.", "Räum dein Zimmer auf."]
            answer: "Mal ein Bild mit deinen Stiften."

  - n: 2
    title: { de: "Klar und genau", en: "Clear and exact" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            text: "Eine Banane essen: Bring die Schritte in die richtige Reihenfolge."
            say: "Bring die Schritte in die richtige Reihenfolge."
            options: ["Schäl die Banane.", "Iss die Banane.", "Nimm eine Banane."]
            slot_count: 3
            answer: ["Nimm eine Banane.", "Schäl die Banane.", "Iss die Banane."]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Wörter sagen, dass jetzt der letzte Schritt kommt?"
            say: "Welche Wörter sagen, dass jetzt der letzte Schritt kommt?"
            options: ["Zum Schluss", "Zuerst", "Dann"]
            answer: "Zum Schluss"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ich habe Saft in ein Glas gegossen.\nGieß Saft in ein Glas."
            say: "Eine Anleitung erzählt nicht, was du gemacht hast. Sie sagt dem Leser, was er tun soll. Darum fängt ein Schritt oft mit dem Verb an: gieß, nimm oder leg."
          - text: "Nimm etwas Mehl.\nNimm zwei Löffel Mehl."
            say: "Schreib genau, wie viel und womit. Etwas Mehl kann viel oder wenig sein. Bei zwei Löffeln Mehl weiß es jeder."
          - text: "Seifenblasen machen\nDu brauchst: ...\n1. ...\n2. ..."
            say: "Eine gute Anleitung hat eine Überschrift. Sie sagt, was man damit machen kann. Danach kommt, was man braucht, und dann kommen die Schritte."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Satz passt in eine Anleitung?"
                say: "Welcher Satz passt in eine Anleitung?"
                options: ["Nimm eine Schere.", "Ich habe eine Schere genommen.", "Die Schere war rot."]
                answer: "Nimm eine Schere."
                feedback:
                  "Ich habe eine Schere genommen.": "Das erzählt, was du gemacht hast. In einer Anleitung sagst du dem Leser, was er tun soll: Nimm ..."
                hints:
                  - "Eine Anleitung sagt dem Leser, was er tun soll."
                  - "Welcher Satz sagt: Tu das?"
                  - "Nimm eine Schere."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welcher Schritt ist genauer?"
                say: "Welcher Schritt ist genauer?"
                options: ["Gib zwei Löffel Zucker dazu.", "Gib etwas Zucker dazu.", "Gib Zucker dazu, so viel du willst."]
                answer: "Gib zwei Löffel Zucker dazu."
                hints:
                  - "Welcher Schritt sagt, wie viel?"
                  - "Etwas kann viel oder wenig sein."
                  - "Zwei Löffel Zucker."
              - id: l2-f3
                type: multiple_choice
                text: "Du brauchst: Papier, Stifte\n1. Falte das Papier in der Mitte.\n2. Mal vorne ein Bild.\n3. Schreib innen einen Gruß.\n\nWelche Überschrift passt?"
                say: "Lies die Anleitung. Welche Überschrift passt?"
                options: ["Eine Karte basteln", "Mein Lieblingstier", "Ein Ausflug in den Zoo"]
                answer: "Eine Karte basteln"
                hints:
                  - "Die Überschrift sagt, was man mit der Anleitung machen kann."
                  - "Was entsteht aus gefaltetem Papier mit Bild und Gruß?"
                  - "Eine Karte basteln."
              - id: l2-f4
                type: sorting
                text: "Passt der Satz in eine Anleitung?"
                say: "Sortiere die Sätze: Passt der Satz in eine Anleitung oder nicht?"
                bins:
                  - { id: step, show: { text: "passt" }, say: "passt" }
                  - { id: not, show: { text: "passt nicht" }, say: "passt nicht" }
                options:
                  - { text: "Leg das Brot auf den Teller.", bin: step }
                  - { text: "Gestern war ich sehr müde.", bin: not }
                  - { text: "Schneide die Gurke in Scheiben.", bin: step }
                  - { text: "Ich mag keine Gurken.", bin: not }
                option_audio: false
                hints:
                  - "In eine Anleitung passt, was der Leser tun soll."
                  - "Was du gestern gemacht hast oder magst, ist kein Schritt."
                  - "Die Sätze mit Brot und Gurke passen. Die Sätze mit müde und mag passen nicht."
              - id: l2-f5
                type: true_false
                text: "Ein Schritt heißt: „Nimm ein bisschen Wasser.“ Weiß der Leser jetzt genau, wie viel Wasser er nehmen soll?"
                say: "Ein Schritt heißt: Nimm ein bisschen Wasser. Weiß der Leser jetzt genau, wie viel Wasser er nehmen soll?"
                answer: false
                hints:
                  - "Wie viel ist ein bisschen?"
                  - "Ein bisschen kann für jeden anders sein."
                  - "Nein, das weiß er nicht."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Satz passt in eine Anleitung?"
                say: "Welcher Satz passt in eine Anleitung?"
                options: ["Klebe die Augen auf.", "Ich habe die Augen aufgeklebt.", "Die Augen waren schwarz."]
                answer: "Klebe die Augen auf."
                hints: ["Welcher Satz sagt dem Leser, was er tun soll?"]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Schritt ist genauer?"
                say: "Welcher Schritt ist genauer?"
                options: ["Lass den Kuchen 30 Minuten im Ofen.", "Lass den Kuchen eine Weile im Ofen.", "Lass den Kuchen im Ofen."]
                answer: "Lass den Kuchen 30 Minuten im Ofen."
                hints: ["Welcher Schritt sagt, wie lange?"]
              - id: l2-s3
                type: multiple_choice
                text: "Du brauchst: zwei Becher, eine lange Schnur\n1. Mach unten in jeden Becher ein kleines Loch.\n2. Steck die Schnur durch die Löcher.\n3. Mach an jedes Ende einen Knoten.\n\nWelche Überschrift passt?"
                say: "Lies die Anleitung. Welche Überschrift passt?"
                options: ["Ein Becher-Telefon bauen", "Was ich am Wochenende gemacht habe", "Wie Schnecken leben"]
                answer: "Ein Becher-Telefon bauen"
                hints: ["Was kann man am Ende mit den Bechern machen?"]
              - id: l2-s4
                type: sorting
                text: "Passt der Satz in eine Anleitung?"
                say: "Sortiere die Sätze: Passt der Satz in eine Anleitung oder nicht?"
                bins:
                  - { id: step, show: { text: "passt" }, say: "passt" }
                  - { id: not, show: { text: "passt nicht" }, say: "passt nicht" }
                options:
                  - { text: "Stell den Topf ans Fenster.", bin: step }
                  - { text: "Meine Oma hat viele Blumen.", bin: not }
                  - { text: "Gieß die Blume jeden zweiten Tag.", bin: step }
                  - { text: "Blumen sind schön.", bin: not }
                option_audio: false
                hints: ["Sagt der Satz dem Leser, was er tun soll?"]
              - id: l2-s5
                type: true_false
                text: "Am Anfang einer Anleitung steht eine Überschrift. Sie sagt, was man machen kann. Stimmt das?"
                say: "Am Anfang einer Anleitung steht eine Überschrift. Sie sagt, was man machen kann. Stimmt das?"
                answer: true
                hints: ["Denk an Butterbrot schmieren oder Seifenblasen machen."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Satz passt in eine Anleitung?"
                say: "Welcher Satz passt in eine Anleitung?"
                options: ["Rühr den Teig gut um.", "Ich habe den Teig umgerührt.", "Der Teig war klebrig."]
                answer: "Rühr den Teig gut um."
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Schritt ist genauer?"
                say: "Welcher Schritt ist genauer?"
                options: ["Schneide den Apfel in vier Stücke.", "Schneide den Apfel irgendwie.", "Mach etwas mit dem Apfel."]
                answer: "Schneide den Apfel in vier Stücke."
              - id: l2-n3
                type: multiple_choice
                text: "Du brauchst: ein großes Blatt Papier\n1. Falte das Blatt in der Mitte.\n2. Falte die oberen Ecken nach unten.\n3. Klapp die unteren Ränder hoch.\n\nWelche Überschrift passt?"
                say: "Lies die Anleitung. Welche Überschrift passt?"
                options: ["Einen Papierhut falten", "Mein schönster Tag", "Das Leben der Vögel"]
                answer: "Einen Papierhut falten"
              - id: l2-n4
                type: sorting
                text: "Passt der Satz in eine Anleitung?"
                say: "Sortiere die Sätze: Passt der Satz in eine Anleitung oder nicht?"
                bins:
                  - { id: step, show: { text: "passt" }, say: "passt" }
                  - { id: not, show: { text: "passt nicht" }, say: "passt nicht" }
                options:
                  - { text: "Misch die Farben im Becher.", bin: step }
                  - { text: "Malen macht mir Spaß.", bin: not }
                  - { text: "Wasch den Pinsel aus.", bin: step }
                  - { text: "Mein Pinsel ist schon alt.", bin: not }
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "„Ich habe den Tisch gedeckt.“ Ist das ein Schritt für eine Anleitung?"
                say: "Ich habe den Tisch gedeckt. Ist das ein Schritt für eine Anleitung?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            text: "Seifenblasen machen: Bring die Schritte in die richtige Reihenfolge."
            say: "Bring die Schritte für die Seifenblasen in die richtige Reihenfolge."
            options: ["Puste langsam durch den Ring.", "Tauch den Ring in die Seifenlauge.", "Nimm den Ring aus der Flasche."]
            slot_count: 3
            answer: ["Nimm den Ring aus der Flasche.", "Tauch den Ring in die Seifenlauge.", "Puste langsam durch den Ring."]
          - id: l2-c2
            type: multiple_choice
            text: "Welchen Satz kannst du in eine Anleitung schreiben?"
            say: "Welchen Satz kannst du in eine Anleitung schreiben?"
            options: ["Schneide das Papier in der Mitte durch.", "Ich habe das Papier zerschnitten.", "Papier ist dünn."]
            answer: "Schneide das Papier in der Mitte durch."
          - id: l2-c3
            type: multiple_choice
            text: "Einen Brief abschicken\n1. Steck den Brief in den Umschlag.\n2. ...\n3. Wirf den Brief in den Briefkasten.\n\nWelcher Schritt fehlt?"
