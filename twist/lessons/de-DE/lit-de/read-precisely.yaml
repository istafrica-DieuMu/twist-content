# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.read-precisely
skill: lit-de.comprehension.read-precisely
curriculum: de-DE
language: de
title:
  de: Genau lesen
  en: Reading carefully
summary: >
  Reading word by word and checking that it makes sense. Lesson 1 judges
  single sentences (Kann das sein?), taps the word that does not fit and
  picks the word that belongs there; lesson 2 does the same in short
  stories and finds the sentence that does not belong to the story, and
  ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Genau lesen, en: Reading carefully }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.decoding.first-texts]
  also_practises: [lit-de.decoding.first-texts]
  vocabulary: { de: [Unsinnssatz, passen, genau lesen] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: words-not-sense
      what: Accepts a sentence because every word can be read, without asking whether it can be true (Mama backt den Kuchen im Kühlschrank)
      addressed: "lesson 1 Learn reads a Unsinnssatz word by word and asks Kann das sein?; every stage has a sensible and a nonsense sentence as true_false (l1-f1, l1-f4, l1-s1, l1-s4, l1-n1, l1-n4, l1-c1), so the child cannot assume there is always a mistake"
    - id: sentence-alone
      what: Checks each sentence on its own and misses a sentence that is true but does not belong to the story
      addressed: "lesson 2 Learn shows a story with the Giraffe sentence; \"Welcher Satz passt nicht in die Geschichte?\" in every stage of lesson 2 (l2-f2, l2-s2, l2-n2) and the skill check (l2-c3)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Kann das sein?", en: "Can that be right?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Die Katze trinkt Milch. Wer trinkt Milch?"
            say: "Lies den Satz. Wer trinkt Milch? Tippe auf das Bild."
            options: [{ object: cat }, { object: dog }, { object: cow }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Der Ball ist rund. Stimmt das?"
            say: "Lies den Satz. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Fisch schwimmt im Wasser. | Der Fisch schwimmt im Baum."
            say: "Lies beide Sätze. Der erste Satz passt. Im zweiten Satz stimmt etwas nicht: Ein Fisch schwimmt nicht im Baum. So ein Satz heißt Unsinnssatz."
          - text: "Mama backt den Kuchen im Kühlschrank."
            say: "Lies Wort für Wort und frag dich am Ende: Kann das sein? Im Kühlschrank wird nichts gebacken. Das Wort Kühlschrank passt nicht. Richtig wäre: im Ofen."
          - text: "Jedes Wort lesen. Dabei denken: Kann das sein?"
            say: "Genau lesen heißt: Du liest jedes Wort und denkst dabei mit. Manche Sätze stimmen auch. Dann ist alles in Ordnung."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Kann das sein? Der Hund bellt den Briefträger an."
                say: "Lies den Satz genau. Kann das so sein?"
                answer: true
                hints:
                  - "Lies jeden Teil: Wer macht was?"
                  - "Hunde bellen. Und manchmal bellen sie den Briefträger an."
                  - "Ja, das kann sein."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tippe auf das Wort, das nicht passt."
                say: "Lies den Satz genau. Ein Wort passt nicht. Tippe darauf."
                show: { drawn: letter-card, text: "Ich trinke ein Glas Brot." }
                spans: ["Brot."]
                hints:
                  - "Was kann man aus einem Glas trinken?"
                  - "Brot kann man essen, aber nicht trinken."
                  - "Tippe auf Brot."
              - id: l1-f3
                type: multiple_choice
                text: "Opa liest die Zeitung mit seiner Badehose. Welches Wort passt statt Badehose?"
                say: "Lies den Satz genau. Welches Wort passt statt Badehose?"
                options: ["Brille", "Mütze", "Gabel"]
                answer: "Brille"
                feedback:
                  "Mütze": "Eine Mütze kann Opa tragen, aber sie hilft ihm nicht beim Lesen."
                hints:
                  - "Was hilft Opa, wenn er liest?"
                  - "Mit der Mütze und der Gabel liest man nicht besser."
                  - "Opa liest mit seiner Brille."
              - id: l1-f4
                type: true_false
                text: "Kann das sein? Im Sommer baut Lena im Garten einen Schneemann."
                say: "Lies den Satz genau. Kann das so sein?"
                answer: false
                hints:
                  - "Lies jedes Wort. Wann gibt es Schnee?"
                  - "Im Sommer ist es warm. Da liegt kein Schnee."
                  - "Nein, das kann nicht sein."
              - id: l1-f5
                type: highlight_in_text
                text: "Tippe auf das Wort, das nicht passt."
                say: "Lies den Satz genau. Ein Wort passt nicht. Tippe darauf."
                show: { drawn: letter-card, text: "Der Bäcker backt am Morgen frische Schuhe." }
                spans: ["Schuhe."]
                hints:
                  - "Was backt ein Bäcker?"
                  - "Ein Bäcker backt Brot und Brötchen."
                  - "Tippe auf Schuhe."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Kann das sein? Die Ente schwimmt auf dem Teich."
                say: "Lies den Satz genau. Kann das so sein?"
                answer: true
                hints: ["Wo schwimmen Enten?"]
              - id: l1-s2
                type: highlight_in_text
                text: "Tippe auf das Wort, das nicht passt."
                say: "Lies den Satz genau. Ein Wort passt nicht. Tippe darauf."
                show: { drawn: letter-card, text: "Tim putzt sich die Zähne mit der Gabel." }
                spans: ["Gabel."]
                hints: ["Womit putzt du deine Zähne?"]
              - id: l1-s3
                type: multiple_choice
                text: "Ich schneide das Papier mit dem Löffel. Welches Wort passt statt Löffel?"
                say: "Lies den Satz genau. Welches Wort passt statt Löffel?"
                options: ["Schere", "Socke", "Suppe"]
                answer: "Schere"
                hints: ["Womit schneidest du in der Schule?"]
              - id: l1-s4
                type: true_false
                text: "Kann das sein? Das Auto fährt auf der Wolke."
                say: "Lies den Satz genau. Kann das so sein?"
                answer: false
                hints: ["Wo fahren Autos?"]
              - id: l1-s5
                type: highlight_in_text
                text: "Tippe auf das Wort, das nicht passt."
                say: "Lies die Sätze genau. Ein Wort passt nicht. Tippe darauf."
                show: { drawn: letter-card, text: "Es ist Nacht. Die Kinder schlafen in der Badewanne." }
                spans: ["Badewanne."]
                hints: ["Wo schlafen Kinder in der Nacht?"]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Kann das sein? Der Vogel baut ein Nest im Baum."
                say: "Lies den Satz genau. Kann das so sein?"
                answer: true
              - id: l1-n2
                type: highlight_in_text
                text: "Tippe auf das Wort, das nicht passt."
                say: "Lies den Satz genau. Ein Wort passt nicht. Tippe darauf."
                show: { drawn: letter-card, text: "Lea gießt die Blumen mit Sand." }
                spans: ["Sand."]
              - id: l1-n3
                type: multiple_choice
                text: "Papa kocht die Nudeln im Bett. Welches Wort passt statt Bett?"
                say: "Lies den Satz genau. Welches Wort passt statt Bett?"
                options: ["Topf", "Teller", "Tasche"]
                answer: "Topf"
              - id: l1-n4
                type: true_false
                text: "Kann das sein? Der Schneemann schmilzt in der Sonne."
                say: "Lies den Satz genau. Kann das so sein?"
                answer: true
              - id: l1-n5
                type: highlight_in_text
                text: "Tippe auf das Wort, das nicht passt."
                say: "Lies den Satz genau. Ein Wort passt nicht. Tippe darauf."
                show: { drawn: letter-card, text: "Mein Fahrrad hat zwei Räder und eine Klingel aus Käse." }
                spans: ["Käse."]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: true_false
            text: "Kann das sein? Die Katze bellt laut."
            say: "Lies den Satz genau. Kann das so sein?"
            answer: false
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf das Wort, das nicht passt."
            say: "Lies den Satz genau. Ein Wort passt nicht. Tippe darauf."
            show: { drawn: letter-card, text: "Ich esse meine Suppe mit der Schere." }
            spans: ["Schere."]
          - id: l1-c3
            type: multiple_choice
            text: "Wir fahren mit dem Bus zum Kuchen. Welches Wort passt statt Kuchen?"
            say: "Lies den Satz genau. Welches Wort passt statt Kuchen?"
            options: ["Zoo", "Schrank", "Apfel"]
            answer: "Zoo"

  - n: 2
    title: { de: "Genau lesen in Geschichten", en: "Reading stories carefully" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Kann das sein? Der Hase hüpft über die Wiese."
            say: "Lies den Satz genau. Kann das so sein?"
            answer: true
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tippe auf das Wort, das nicht passt."
            say: "Lies den Satz genau. Ein Wort passt nicht. Tippe darauf."
            show: { drawn: letter-card, text: "Oma strickt einen Schal aus Wasser." }
            spans: ["Wasser."]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Ben hat Geburtstag.\nEr bekommt ein neues Fahrrad.\nEr fährt gleich eine Runde.\nDann isst er Kuchen."
            say: "Hier ist eine kurze Geschichte. Alle Sätze gehören zusammen. Sie erzählen von Bens Geburtstag, einer nach dem anderen."
          - text: "Ben hat Geburtstag.\nEr bekommt ein neues Fahrrad.\nEr schwimmt gleich eine Runde damit."
            say: "Lies genau. Mit einem Fahrrad schwimmt man nicht. Das Wort schwimmt passt nicht zur Geschichte. Richtig wäre: Er fährt eine Runde."
          - text: "Ben isst Kuchen.\nDie Giraffe hat einen langen Hals.\nDann spielt er mit seinen Freunden."
            say: "Auch ein ganzer Satz kann nicht passen. Eine Giraffe hat wirklich einen langen Hals. Aber der Satz gehört nicht zu Bens Geburtstag."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tippe auf das Wort, das nicht passt."
                say: "Lies die Geschichte genau. Ein Wort passt nicht. Tippe darauf."
                show: { drawn: letter-card, text: "Lisa geht in den Zoo. Sie sieht einen Elefanten. Er hat einen langen Rüssel. Dann füttert Lisa die Ziegen mit Steinen." }
                spans: ["Steinen."]
                hints:
                  - "Lies Satz für Satz. Frag dich bei jedem Satz: Kann das sein?"
                  - "Die ersten drei Sätze passen. Was fressen Ziegen?"
                  - "Tippe auf Steinen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Tom packt seine Schultasche.\nEr legt sein Heft hinein.\nDer Mond ist rund.\nDann geht er zur Schule.\n\nWelcher Satz passt nicht in die Geschichte?"
                say: "Lies die Geschichte. Welcher Satz passt nicht dazu?"
                options: ["Der Mond ist rund.", "Er legt sein Heft hinein.", "Dann geht er zur Schule."]
                answer: "Der Mond ist rund."
                feedback:
                  "Dann geht er zur Schule.": "Tom hat seine Tasche gepackt. Jetzt geht er los. Das passt zur Geschichte."
                hints:
                  - "Wovon erzählt die Geschichte?"
                  - "Sie erzählt von Tom und der Schule. Welcher Satz erzählt etwas ganz anderes?"
                  - "Der Mond ist rund. Das stimmt, aber es gehört nicht zur Geschichte."
              - id: l2-f3
                type: true_false
                text: "Es regnet.\nMia nimmt ihren Regenschirm.\nSie bleibt trocken.\n\nPasst alles zusammen?"
                say: "Lies die Geschichte genau. Passt alles zusammen?"
                answer: true
                hints:
                  - "Lies jeden Satz und frag dich: Kann das sein?"
                  - "Mit einem Regenschirm wird man nicht nass."
                  - "Ja, alles passt zusammen."
              - id: l2-f4
                type: multiple_choice
                text: "Papa macht Pfannkuchen.\nEr braucht Mehl, Eier und Milch.\nEr rührt alles mit einem Kamm um.\nDann backt er die Pfannkuchen in der Pfanne.\n\nWelches Wort passt nicht?"
                say: "Lies die Geschichte genau. Welches Wort passt nicht?"
                options: ["Kamm", "Mehl", "Pfanne"]
                answer: "Kamm"
                feedback:
                  "Pfanne": "Pfannkuchen backt man in der Pfanne. Das passt. Lies den dritten Satz noch einmal."
                hints:
                  - "Lies Satz für Satz. Bei welchem Satz stockst du?"
                  - "Womit rührt man einen Teig um?"
                  - "Kamm passt nicht. Mit einem Kamm kämmt man die Haare."
              - id: l2-f5
                type: fill_in_blank
                text: "Jan hat Durst. Er holt ein Glas. Welches Wort passt?"
                say: "Lies genau. Welches Wort passt in die Lücke?"
                frame: "Er füllt das Glas mit _."
                options: ["Wasser", "Sand", "Nudeln"]
                answer: ["Wasser"]
                hints:
                  - "Jan hat Durst. Was braucht er?"
                  - "Sand und Nudeln kann man nicht trinken."
                  - "Tippe auf Wasser."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tippe auf das Wort, das nicht passt."
                say: "Lies die Geschichte genau. Ein Wort passt nicht. Tippe darauf."
                show: { drawn: letter-card, text: "Der Wecker klingelt. Paul steht auf. Er zieht seine Hose an. Dann kämmt er sich die Haare mit der Gabel." }
                spans: ["Gabel."]
                hints: ["Lies Satz für Satz. Womit kämmt man sich?"]
              - id: l2-s2
                type: multiple_choice
                text: "Oma und Lea backen Kekse.\nSie kneten den Teig.\nMein Bruder spielt Fußball.\nDie Kekse kommen in den Ofen.\n\nWelcher Satz passt nicht in die Geschichte?"
                say: "Lies die Geschichte. Welcher Satz passt nicht dazu?"
                options: ["Mein Bruder spielt Fußball.", "Sie kneten den Teig.", "Die Kekse kommen in den Ofen."]
                answer: "Mein Bruder spielt Fußball."
                hints: ["Die Geschichte erzählt vom Backen. Welcher Satz nicht?"]
              - id: l2-s3
                type: true_false
                text: "Der Hund hat Hunger.\nAli füllt seinen Napf mit Futter.\nDer Hund frisst alles auf.\n\nPasst alles zusammen?"
                say: "Lies die Geschichte genau. Passt alles zusammen?"
                answer: true
                hints: ["Frag bei jedem Satz: Kann das sein?"]
              - id: l2-s4
                type: multiple_choice
                text: "Es ist Winter.\nDraußen liegt viel Schnee.\nDie Kinder ziehen ihre Badehosen an und fahren Schlitten.\n\nWelches Wort passt nicht?"
                say: "Lies die Geschichte genau. Welches Wort passt nicht?"
                options: ["Badehosen", "Schnee", "Schlitten"]
                answer: "Badehosen"
                hints: ["Was zieht man im Schnee an?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Die Sonne scheint. Es ist heiß. Welches Wort passt?"
                say: "Lies genau. Welches Wort passt in die Lücke?"
                frame: "Mia isst ein kaltes _."
                options: ["Eis", "Feuer", "Kissen"]
                answer: ["Eis"]
                hints: ["Was isst man gern, wenn es heiß ist?"]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tippe auf das Wort, das nicht passt."
                say: "Lies die Geschichte genau. Ein Wort passt nicht. Tippe darauf."
                show: { drawn: letter-card, text: "Ole spielt im Garten. Er klettert auf den Baum. Oben sitzt ein Vogel. Der Vogel bellt." }
                spans: ["bellt."]
              - id: l2-n2
                type: multiple_choice
                text: "Wir gehen in den Wald.\nWir sammeln Pilze.\nDer Zug ist pünktlich.\nAm Abend sind wir müde.\n\nWelcher Satz passt nicht in die Geschichte?"
                say: "Lies die Geschichte. Welcher Satz passt nicht dazu?"
                options: ["Der Zug ist pünktlich.", "Wir sammeln Pilze.", "Am Abend sind wir müde."]
                answer: "Der Zug ist pünktlich."
              - id: l2-n3
                type: true_false
                text: "Lena hat Geburtstag.\nAuf dem Kuchen brennen sieben Kerzen.\nLena pustet alle Kerzen aus.\nJetzt brennen die Kerzen hell.\n\nPasst alles zusammen?"
                say: "Lies die Geschichte genau. Passt alles zusammen?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Am Abend wird es dunkel.\nPapa macht das Licht an.\nDann liest er mir aus dem Kochtopf vor.\n\nWelches Wort passt nicht?"
                say: "Lies die Geschichte genau. Welches Wort passt nicht?"
                options: ["Kochtopf", "Licht", "dunkel"]
                answer: "Kochtopf"
              - id: l2-n5
                type: fill_in_blank
                text: "Es regnet stark. Welches Wort passt?"
                say: "Lies genau. Welches Wort passt in die Lücke?"
                frame: "Tim zieht seine _ an."
                options: ["Regenjacke", "Badehose", "Sonnenbrille"]
                answer: ["Regenjacke"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: true_false
            text: "Kann das sein? Der Bäcker verkauft Brötchen."
            say: "Lies den Satz genau. Kann das so sein?"
            answer: true
          - id: l2-c2
            type: highlight_in_text
            text: "Tippe auf das Wort, das nicht passt."
            say: "Lies die Geschichte genau. Ein Wort passt nicht. Tippe darauf."
            show: { drawn: letter-card, text: "Jana geht schwimmen. Sie springt ins Wasser. Danach trocknet sie sich mit einem Teller ab." }
            spans: ["Teller"]
          - id: l2-c3
            type: multiple_choice
            text: "Felix hat eine Katze.\nSie heißt Mimi.\nDie Banane ist gelb.\nMimi schläft gern auf dem Sofa.\n\nWelcher Satz passt nicht in die Geschichte?"
            say: "Lies die Geschichte. Welcher Satz passt nicht dazu?"
            options: ["Die Banane ist gelb.", "Sie heißt Mimi.", "Mimi schläft gern auf dem Sofa."]
            answer: "Die Banane ist gelb."
          - id: l2-c4
            type: multiple_choice
            text: "Ich schreibe mit dem Kissen in mein Heft. Welches Wort passt statt Kissen?"
            say: "Lies den Satz genau. Welches Wort passt statt Kissen?"
            options: ["Stift", "Teller", "Ball"]
            answer: "Stift"
          - id: l2-c5
            type: true_false
            text: "Es ist Nacht.\nAm Himmel leuchten die Sterne.\nDie Eule ist wach.\n\nPasst alles zusammen?"
            say: "Lies die Geschichte genau. Passt alles zusammen?"
            answer: true
