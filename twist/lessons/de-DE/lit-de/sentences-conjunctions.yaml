# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.sentences-conjunctions
skill: lit-de.sentences.conjunctions
curriculum: de-DE
language: de
title:
  de: Sätze verbinden
  en: Joining sentences
summary: >
  Joining two sentences into one. Lesson 1 joins with und, oder and aber
  and sets the comma before aber; lesson 2 joins with weil, dass and wenn,
  where the verb moves to the end of that part and a comma always
  separates the two parts, and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Sätze verbinden, en: Joining sentences }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.sentences.move-parts]
  also_practises: [lit-de.sentences.move-parts]
  vocabulary: { de: [Bindewort, verbinden, Komma, und, oder, aber, weil, dass, wenn] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: weil-verb-second
      what: Keeps the verb in second place after weil (…, weil ich bin müde.)
      addressed: lesson 2 Learn moves the verb to the end; every stage of lesson 2 offers the verb-second order as a distractor, with feedback in l2-f1
    - id: no-comma
      what: Leaves out the comma before aber, weil, dass and wenn
      addressed: comma tasks in every stage of both lessons, with feedback in l1-f3 and l2-f1
    - id: wrong-joiner
      what: Picks und where the second part says the opposite (aber), or a joiner that does not fit the meaning or word order (aber or oder before a reason with the verb at the end)
      addressed: lesson 1 has a "Welches Bindewort zeigt den Gegensatz?" task with und as a distractor in every stage and the quick check, with feedback in l1-f1, and the lesson 2 warm-up repeats it; every stage of lesson 2 has a "Welches Bindewort passt?" task where only weil, dass or wenn fits
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "und, oder, aber", en: "and, or, but" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Satz ist richtig umgestellt?"
            say: "Der Satz heißt: Wir spielen nach der Schule Fußball. Welcher Satz ist richtig umgestellt?"
            options: ["Nach der Schule spielen wir Fußball.", "Nach der Schule wir spielen Fußball.", "Fußball wir spielen nach der Schule."]
            answer: "Nach der Schule spielen wir Fußball."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Steht das Verb an zweiter Stelle?"
            say: "Lies die Karte. Steht das Verb an zweiter Stelle?"
            show: { drawn: letter-card, text: "Heute regnet es den ganzen Tag." }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ich male ein Bild und Lea liest ein Buch."
            say: "Mit einem Bindewort verbindest du zwei Sätze. Und hängt einfach etwas an: Ich male ein Bild und Lea liest ein Buch."
          - text: "Möchtest du Saft oder magst du lieber Wasser?"
            say: "Oder zeigt eine Wahl: Möchtest du Saft oder magst du lieber Wasser? Vor und brauchst du kein Komma, vor oder auch nicht."
          - text: "Ich bin müde, aber ich will noch spielen."
            say: "Aber zeigt einen Gegensatz: Ich bin müde, aber ich will noch spielen. Vor aber steht immer ein Komma."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Es regnet, _ wir gehen trotzdem raus."
                say: "Welches Bindewort zeigt den Gegensatz? Es regnet, … wir gehen trotzdem raus."
                options: ["aber", "und", "oder"]
                answer: "aber"
                feedback:
                  "und": "„Und“ hängt nur etwas an. Einen Gegensatz zeigt „aber“."
                hints:
                  - "Bei Regen bleibt man eher drinnen. Hier gehen wir trotzdem raus."
                  - "Welches Bindewort sagt: Es kommt anders, als man denkt?"
                  - "aber."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Gehen wir ins Kino _ bleiben wir zu Hause?"
                say: "Welches Bindewort passt? Gehen wir ins Kino … bleiben wir zu Hause?"
                options: ["aber", "oder", "und"]
                answer: "oder"
                hints:
                  - "Es gibt zwei Möglichkeiten."
                  - "Welches Wort zeigt eine Wahl?"
                  - "oder."
              - id: l1-f3
                type: fill_in_blank
                text: "Setz das Satzzeichen."
                say: "Welches Zeichen gehört in die Lücke?"
                frame: "Der Kuchen ist lecker_ aber er ist sehr süß."
                options: [",", "!", "."]
                answer: [","]
                feedback:
                  ".": "Ein Punkt würde den Satz beenden. Vor „aber“ steht ein Komma."
                hints:
                  - "Welches Bindewort verbindet die Sätze?"
                  - "Vor „aber“ steht immer ein bestimmtes Zeichen."
                  - "Ein Komma."
              - id: l1-f4
                type: multiple_choice
                text: "Verbinde die Sätze mit „und“."
                say: "Verbinde die zwei Sätze mit und. Papa kocht. Mama deckt den Tisch."
                options: ["Papa kocht und Mama deckt den Tisch.", "Papa kocht und Mama den Tisch deckt.", "Papa und kocht Mama deckt den Tisch."]
                answer: "Papa kocht und Mama deckt den Tisch."
                option_audio: false
                hints:
                  - "„Und“ kommt zwischen die beiden Sätze."
                  - "Die Wortstellung bleibt wie vorher."
                  - "Papa kocht und Mama deckt den Tisch."
              - id: l1-f5
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Tim wollte schwimmen aber das Wasser war zu kalt." }
                answer: false
                hints:
                  - "Welches Bindewort steht im Satz?"
                  - "Vor „aber“ steht ein Komma."
                  - "Nein. Vor „aber“ fehlt das Komma."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ich habe Hunger, _ es gibt erst später Essen."
                say: "Welches Bindewort zeigt den Gegensatz? Ich habe Hunger, … es gibt erst später Essen."
                options: ["oder", "aber", "und"]
                answer: "aber"
                hints: ["Wer Hunger hat, will gleich essen. Kommt es hier so?"]
              - id: l1-s2
                type: multiple_choice
                text: "Lena singt _ ihr Bruder spielt dazu Gitarre."
                say: "Welches Bindewort passt? Lena singt … ihr Bruder spielt dazu Gitarre."
                options: ["und", "oder", "aber"]
                answer: "und"
                hints: ["Ist es eine Wahl, ein Gegensatz oder kommt einfach etwas dazu?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Setz das Satzzeichen."
                say: "Welches Zeichen gehört in die Lücke?"
                frame: "Der Hund ist klein_ aber er bellt sehr laut."
                options: [".", ",", "!"]
                answer: [","]
                hints: ["Welches Bindewort folgt?"]
              - id: l1-s4
                type: multiple_choice
                text: "Verbinde die Sätze mit „aber“."
                say: "Verbinde die zwei Sätze mit aber. Ich mag Äpfel. Birnen mag ich nicht."
                options: ["Ich mag Äpfel aber Birnen mag ich nicht.", "Ich mag Äpfel, aber Birnen mag ich nicht.", "Ich mag Äpfel, aber Birnen ich mag nicht."]
                answer: "Ich mag Äpfel, aber Birnen mag ich nicht."
                option_audio: false
                hints: ["Achte auf das Komma und die Wortstellung."]
              - id: l1-s5
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Paul ist schnell aber Ben ist noch schneller." }
                answer: false
                hints: ["Welches Bindewort steht im Satz?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Die Sonne scheint, _ es ist kalt."
                say: "Welches Bindewort zeigt den Gegensatz? Die Sonne scheint, … es ist kalt."
                options: ["und", "aber", "oder"]
                answer: "aber"
              - id: l1-n2
                type: multiple_choice
                text: "Trinkst du Tee _ möchtest du lieber Kakao?"
                say: "Welches Bindewort passt? Trinkst du Tee … möchtest du lieber Kakao?"
                options: ["oder", "und", "aber"]
                answer: "oder"
              - id: l1-n3
                type: fill_in_blank
                text: "Setz das Satzzeichen."
                say: "Welches Zeichen gehört in die Lücke?"
                frame: "Oma ist alt_ aber sie fährt noch Fahrrad."
                options: [",", ".", "?"]
                answer: [","]
              - id: l1-n4
                type: multiple_choice
                text: "Verbinde die Sätze mit „und“."
                say: "Verbinde die zwei Sätze mit und. Max baut eine Höhle. Mia hilft ihm."
                options: ["Max baut eine Höhle, aber Mia hilft ihm.", "Max baut eine Höhle und Mia ihm hilft.", "Max baut eine Höhle und Mia hilft ihm."]
                answer: "Max baut eine Höhle und Mia hilft ihm."
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Ich lese gern, aber heute habe ich keine Zeit." }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Das Zelt ist alt, _ es hält noch dicht."
            say: "Welches Bindewort zeigt den Gegensatz? Das Zelt ist alt, … es hält noch dicht."
            options: ["aber", "oder", "und"]
            answer: "aber"
          - id: l1-c2
            type: fill_in_blank
            text: "Setz das Satzzeichen."
            say: "Welches Zeichen gehört in die Lücke?"
            frame: "Wir wollten zelten_ aber es hat gestürmt."
            options: [".", ",", "!"]
            answer: [","]
          - id: l1-c3
            type: multiple_choice
            text: "Fährst du mit dem Bus _ gehst du zu Fuß?"
            say: "Welches Bindewort passt? Fährst du mit dem Bus … gehst du zu Fuß?"
            options: ["und", "aber", "oder"]
            answer: "oder"

  - n: 2
    title: { de: "weil, dass, wenn", en: "because, that, if" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ich bin klein, _ ich bin sehr stark."
            say: "Welches Bindewort zeigt den Gegensatz? Ich bin klein, … ich bin sehr stark."
            options: ["aber", "oder", "und"]
            answer: "aber"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Setz das Satzzeichen."
            say: "Welches Zeichen gehört in die Lücke?"
            frame: "Das Eis ist kalt_ aber es schmeckt gut."
            options: [",", ".", "?"]
            answer: [","]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ich bleibe zu Hause. Ich bin krank. → Ich bleibe zu Hause, weil ich krank bin."
            say: "Mit weil sagst du einen Grund. Pass auf: Nach weil wandert das Verb ans Ende. Ich bin krank wird zu: weil ich krank bin."
          - text: "Ich weiß, dass du gern malst. Wenn es regnet, nehmen wir den Schirm."
            say: "Auch nach dass und wenn steht das Verb am Ende: Ich weiß, dass du gern malst. Wenn es regnet, nehmen wir den Schirm."
          - text: ", weil · , dass · , wenn"
            say: "Zwischen den beiden Teilen steht immer ein Komma, meist direkt vor weil, dass oder wenn. Steht wenn am Anfang, kommt das Komma ans Ende vom wenn-Teil."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Verbinde mit weil: Ich trinke viel. Ich habe Durst. Welcher Satz ist richtig?"
                options: ["Ich trinke viel, weil ich Durst habe.", "Ich trinke viel, weil ich habe Durst.", "Ich trinke viel weil ich Durst habe."]
                answer: "Ich trinke viel, weil ich Durst habe."
                option_audio: false
                feedback:
                  "Ich trinke viel, weil ich habe Durst.": "Nach „weil“ wandert das Verb ans Ende: weil ich Durst habe."
                  "Ich trinke viel weil ich Durst habe.": "Vor „weil“ fehlt das Komma."
                hints:
                  - "Wo steht das Verb nach „weil“?"
                  - "Und vor „weil“ steht ein Komma."
                  - "Ich trinke viel, weil ich Durst habe."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ich nehme die Jacke mit, _ es kalt ist."
                say: "Welches Bindewort passt? Ich nehme die Jacke mit, … es kalt ist."
                options: ["weil", "aber", "oder"]
                answer: "weil"
                hints:
                  - "Der zweite Teil sagt einen Grund."
                  - "Mit welchem Wort gibst du einen Grund an?"
                  - "weil."
              - id: l2-f3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Mama sagt dass wir gleich essen." }
                answer: false
                hints:
                  - "Welches Bindewort steht im Satz?"
                  - "Vor „dass“ steht immer ein Komma."
                  - "Nein. Richtig ist: Mama sagt, dass wir gleich essen."
              - id: l2-f4
                type: ordering
                text: "Verbinde mit „wenn“: Wir gehen schwimmen. Die Sonne scheint."
                say: "Wir gehen schwimmen. Die Sonne scheint. Verbinde die Sätze mit wenn. Leg den Teil mit wenn in die richtige Reihenfolge."
                options: ["scheint", "die Sonne", "wenn"]
                slot_count: 3
                answer: ["wenn", "die Sonne", "scheint"]
                option_audio: false
                hints:
                  - "Der Teil beginnt mit „wenn“."
                  - "Das Verb steht am Ende."
                  - "wenn die Sonne scheint."
              - id: l2-f5
                type: multiple_choice
                text: "Ich hoffe, _ du morgen kommst."
                say: "Welches Bindewort passt? Ich hoffe, … du morgen kommst."
                options: ["dass", "weil", "aber"]
                answer: "dass"
                hints:
                  - "Was hoffst du? Das steht im zweiten Teil."
                  - "Nach „hoffen“, „wissen“ und „sagen“ kommt oft dieses Wort."
                  - "dass."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Verbinde mit weil: Lea lacht. Der Film ist lustig. Welcher Satz ist richtig?"
                options: ["Lea lacht, weil der Film ist lustig.", "Lea lacht, weil der Film lustig ist.", "Lea lacht, weil lustig der Film ist."]
                answer: "Lea lacht, weil der Film lustig ist."
                option_audio: false
                hints: ["Wo steht das Verb nach „weil“?"]
              - id: l2-s2
                type: multiple_choice
                text: "_ du Hilfe brauchst, ruf mich an."
                say: "Welches Bindewort passt? … du Hilfe brauchst, ruf mich an."
                options: ["Wenn", "Dass", "Aber"]
                answer: "Wenn"
                hints: ["Der erste Teil sagt, in welchem Fall du anrufen sollst."]
              - id: l2-s3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Ich weiß, dass du ein Geheimnis hast." }
                answer: true
                hints: ["Prüf das Komma und die Stelle des Verbs."]
              - id: l2-s4
                type: ordering
                text: "Verbinde mit „weil“: Der Hund bellt. Er hat Hunger."
                say: "Der Hund bellt. Er hat Hunger. Verbinde die Sätze mit weil. Leg den Teil mit weil in die richtige Reihenfolge."
                options: ["hat", "weil", "er", "Hunger"]
                slot_count: 4
                answer: ["weil", "er", "Hunger", "hat"]
                option_audio: false
                hints: ["Wo steht das Verb?"]
              - id: l2-s5
                type: multiple_choice
                text: "Wir bleiben drinnen, _ es gewittert."
                say: "Welches Bindewort passt? Wir bleiben drinnen, … es gewittert."
                options: ["oder", "weil", "dass"]
                answer: "weil"
                hints: ["Sagt der zweite Teil einen Grund?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Verbinde mit weil: Tom ist traurig. Sein Ballon ist geplatzt. Welcher Satz ist richtig?"
                options: ["Tom ist traurig, weil sein Ballon ist geplatzt.", "Tom ist traurig weil sein Ballon geplatzt ist.", "Tom ist traurig, weil sein Ballon geplatzt ist."]
                answer: "Tom ist traurig, weil sein Ballon geplatzt ist."
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Papa sagt, _ das Essen fertig ist."
                say: "Welches Bindewort passt? Papa sagt, … das Essen fertig ist."
                options: ["weil", "dass", "aber"]
                answer: "dass"
              - id: l2-n3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Wenn ich groß bin werde ich Ärztin." }
                answer: false
              - id: l2-n4
                type: ordering
                text: "Ich glaube: Es schneit morgen. Mach einen Satz mit „dass“."
                say: "Ich glaube: Es schneit morgen. Mach daraus einen Satz mit dass. Leg den Teil mit dass in die richtige Reihenfolge."
                options: ["schneit", "es", "dass", "morgen"]
                slot_count: 4
                answer: ["dass", "es", "morgen", "schneit"]
                option_audio: false
              - id: l2-n5
                type: multiple_choice
                text: "Ich ziehe Gummistiefel an, _ es geregnet hat."
                say: "Welches Bindewort passt? Ich ziehe Gummistiefel an, … es geregnet hat."
                options: ["weil", "aber", "oder"]
                answer: "weil"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welcher Satz ist richtig?"
            say: "Verbinde mit weil: Mia ist froh. Sie hat Ferien. Welcher Satz ist richtig?"
            options: ["Mia ist froh, weil sie hat Ferien.", "Mia ist froh, weil sie Ferien hat.", "Mia ist froh weil sie Ferien hat."]
            answer: "Mia ist froh, weil sie Ferien hat."
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Ich habe Bauchweh, _ ich gehe trotzdem zur Schule."
            say: "Welches Bindewort passt? Ich habe Bauchweh, … ich gehe trotzdem zur Schule."
            options: ["weil", "aber", "dass"]
            answer: "aber"
          - id: l2-c3
            type: fill_in_blank
            text: "Setz das Satzzeichen."
            say: "Welches Zeichen gehört in die Lücke?"
            frame: "Ich freue mich_ wenn du kommst."
            options: [",", ".", "!"]
            answer: [","]
          - id: l2-c4
            type: ordering
            text: "Verbinde mit „weil“: Die Katze miaut. Sie will raus."
            say: "Die Katze miaut. Sie will raus. Verbinde die Sätze mit weil. Leg den Teil mit weil in die richtige Reihenfolge."
            options: ["will", "raus", "weil", "sie"]
            slot_count: 4
            answer: ["weil", "sie", "raus", "will"]
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Ist das richtig geschrieben?"
            say: "Lies die Karte. Ist das richtig geschrieben?"
            show: { drawn: letter-card, text: "Wir haben gewonnen, weil wir gut zusammen gespielt haben." }
            answer: true
