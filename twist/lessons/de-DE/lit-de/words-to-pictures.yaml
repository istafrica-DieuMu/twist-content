# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.words-to-pictures
skill: lit-de.writing.words-to-pictures
curriculum: de-DE
language: de
title:
  de: Zu Bildern schreiben
  en: Writing about pictures
summary: >
  Children write words and short sentences about pictures. Lesson 1 names
  what a picture shows with a word and its Begleiter (die Nase, der Igel):
  build the word from letter cards, pick its spelling, add the Begleiter.
  Lesson 2 writes a sentence about a picture with two questions, Wer? and
  Was tut er?, picks the sentence that fits, builds it from word cards,
  sees what a half sentence is missing, and ends with the skill check.
  Free writing is not marked yet, so speak tasks let the child say a
  sentence of their own as practice.
metadata:
  year: klasse-1
  topic: { de: Texte schreiben, en: Writing texts }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling.write-by-sound, lit-de.handwriting.copy-sentences]
  also_practises: [lit-de.spelling.write-by-sound, lit-de.nouns.articles]
  vocabulary: { de: [Bild, Wort, Satz, Begleiter, "Wer?", "Was tut er?", Punkt] }
  forms: [picture, drawn, audio]
  drawn: [letter-card, word-card]
  sounds: []
  facets: []
  misconceptions:
    - id: word-for-sentence
      what: Writes one word under a picture (Hund) when a sentence is asked for, or a sentence without what someone does (Das Kind.)
      addressed: "lesson 2 Learn asks Wer? and Was tut er?; l2-f3, l2-s4 and l2-c4 ask which line is a whole sentence or what it is missing, with feedback on l2-f3"
    - id: names-wrong-thing
      what: Writes about something near the picture instead of what it shows (Das Kind ist im Wasser. for a child reading)
      addressed: "every sentence choice sets the right action against a near one (malt, liest); hints say to look at what the person is doing"
    - id: sounds-left-out
      what: Leaves out a sound when writing the word for a picture (Nae, Igl)
      addressed: "options in l1-f2, l1-s2 and l1-n4 leave out one sound; hints say the word slowly"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Ein Wort zum Bild, en: A word for the picture }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Oma. Welcher Buchstabe fehlt?"
            show: { object: grandma }
            frame: "O_a"
            options: ["m", "n", "l"]
            option_audio: false
            answer: ["m"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Abschrift ist richtig?"
            say: "Vorlage: Ida malt. Welche Abschrift ist richtig?"
            show: { drawn: word-card, text: "Ida malt." }
            options: ["Ida malt", "Ida malt."]
            option_audio: false
            answer: "Ida malt."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "?"
            say: "Was siehst du auf dem Bild? Einen Igel. Sprich das Wort langsam: I ... gel."
            show: { object: hedgehog }
          - text: "Igel"
            say: "Schreib für jeden Laut einen Buchstaben: I, g, e, l. Igel ist ein Nomen, also schreibst du es groß."
            show: { drawn: word-card, text: "Igel" }
          - text: "der Igel"
            say: "Schreib den Begleiter dazu. Der, die oder das? Der Igel. Jetzt weiß jeder, was du meinst."
            show: { drawn: word-card, text: "der Igel" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Schreib das Wort zum Bild."
                say: "Was siehst du? Leg das Wort mit den Buchstaben."
                show: { object: nose }
                options: ["s", "e", "N", "a"]
                option_audio: false
                slot_count: 4
                answer: ["N", "a", "s", "e"]
                hints:
                  - "Sag das Wort langsam: Na ... se."
                  - "Der erste Laut ist nnn. Nomen fangen groß an."
                  - "N, a, s, e: Nase."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Was siehst du? Welches Wort ist richtig geschrieben?"
                show: { object: ant }
                options: ["Ameise", "Amise", "Ameis"]
                option_audio: false
                answer: "Ameise"
                feedback:
                  Amise: "Sprich langsam: A ... mei ... se. In der Mitte hörst du ei."
                  Ameis: "Am Ende fehlt etwas. Hör genau: A-mei-se."
                hints:
                  - "Sprich das Wort in Silben: A ... mei ... se."
                  - "Drei Silben. In der Mitte ist ein ei."
                  - "Ameise."
              - id: l1-f3
                type: fill_in_blank
                text: "Welcher Begleiter passt?"
                say: "Schreib den Begleiter dazu. Welcher passt?"
                show: { object: trousers }
                frame: "_ Hose"
                options: ["der", "die", "das"]
                answer: ["die"]
                hints:
                  - "Sag das Wort mit allen drei Begleitern."
                  - "Der Hose? Die Hose? Das Hose?"
                  - "Die Hose."
              - id: l1-f4
                type: matching
                text: "Welches Wort gehört zu welchem Bild?"
                say: "Lies die Wörter. Verbinde jedes Bild mit seinem Wort."
                option_audio: false
                pairs:
                  - { left: { object: llama }, right: { text: "das Lama" } }
                  - { left: { object: oven }, right: { text: "der Ofen" } }
                  - { left: { object: rose }, right: { text: "die Rose" } }
                hints:
                  - "Tippe auf ein Bild. Dann such sein Wort."
                  - "Lies den Anfang: L, O, R."
                  - "Lama, Ofen, Rose."
              - id: l1-f5
                type: speak
                text: "Was ist auf dem Bild?"
                say: "Was siehst du? Sag das Wort mit dem Begleiter."
                show: { object: mouse }
                expected_text: "die Maus"
                hints:
                  - "Es ist ein kleines Tier."
                  - "Es fängt mit mmm an."
                  - "Die Maus."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Schreib das Wort zum Bild."
                say: "Was siehst du? Leg das Wort mit den Buchstaben."
                show: { object: hat }
                options: ["t", "H", "u"]
                option_audio: false
                slot_count: 3
                answer: ["H", "u", "t"]
                hints: ["Sprich langsam: H ... u ... t."]
              - id: l1-s2
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Was siehst du? Welches Wort ist richtig geschrieben?"
                show: { object: banana }
                options: ["Banne", "Banane", "Bananne"]
                option_audio: false
                answer: "Banane"
                hints: ["Sprich in Silben: Ba ... na ... ne. Jede Silbe hat zwei Buchstaben."]
              - id: l1-s3
                type: fill_in_blank
                text: "Welcher Begleiter passt?"
                say: "Schreib den Begleiter dazu. Welcher passt?"
                show: { object: car }
                frame: "_ Auto"
                options: ["der", "die", "das"]
                answer: ["das"]
                hints: ["Sag es mit allen drei: der, die, das Auto."]
              - id: l1-s4
                type: matching
                text: "Welches Wort gehört zu welchem Bild?"
                say: "Lies die Wörter. Verbinde jedes Bild mit seinem Wort."
                option_audio: false
                pairs:
                  - { left: { object: mouth }, right: { text: "der Mund" } }
                  - { left: { object: mouse }, right: { text: "die Maus" } }
                  - { left: { object: moon }, right: { text: "der Mond" } }
                hints: ["Alle fangen mit M an. Lies weiter bis zum Ende."]
              - id: l1-s5
                type: speak
                text: "Was ist auf dem Bild?"
                say: "Was siehst du? Sag das Wort mit dem Begleiter."
                show: { object: egg }
                expected_text: "das Ei"
                hints: ["Der, die oder das? Sag es laut."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Schreib das Wort zum Bild."
                say: "Was siehst du? Leg das Wort mit den Buchstaben."
                show: { object: bus }
                options: ["s", "u", "B"]
                option_audio: false
                slot_count: 3
                answer: ["B", "u", "s"]
              - id: l1-n2
                type: fill_in_blank
                text: "Welcher Begleiter passt?"
                say: "Schreib den Begleiter dazu. Welcher passt?"
                show: { object: hedgehog }
                frame: "_ Igel"
                options: ["der", "die", "das"]
                answer: ["der"]
              - id: l1-n3
                type: matching
                text: "Welches Wort gehört zu welchem Bild?"
                say: "Lies die Wörter. Verbinde jedes Bild mit seinem Wort."
                option_audio: false
                pairs:
                  - { left: { object: grandpa }, right: { text: "der Opa" } }
                  - { left: { object: sun }, right: { text: "die Sonne" } }
                  - { left: { object: snail }, right: { text: "die Schnecke" } }
              - id: l1-n4
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Was siehst du? Welches Wort ist richtig geschrieben?"
                show: { object: llama }
                options: ["Lam", "Lama", "Lmaa"]
                option_audio: false
                answer: "Lama"
              - id: l1-n5
                type: ordering
                text: "Schreib das Wort zum Bild."
                say: "Was siehst du? Leg das Wort mit den Silben."
                show: { object: giraffe }
                options: ["raf", "fe", "Gi"]
                option_audio: false
                slot_count: 3
                answer: ["Gi", "raf", "fe"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort passt zum Bild?"
            say: "Was siehst du? Welches Wort ist richtig geschrieben?"
            show: { object: oven }
            options: ["Ofen", "Ofn", "Oven"]
            option_audio: false
            answer: "Ofen"
          - id: l1-c2
            type: fill_in_blank
            text: "Welcher Begleiter passt?"
            say: "Schreib den Begleiter dazu. Welcher passt?"
            show: { object: rose }
            frame: "_ Rose"
            options: ["der", "die", "das"]
            answer: ["die"]
          - id: l1-c3
            type: ordering
            text: "Schreib das Wort zum Bild."
            say: "Was siehst du? Leg das Wort mit den Buchstaben."
            show: { object: grandma }
            options: ["a", "O", "m"]
            option_audio: false
            slot_count: 3
            answer: ["O", "m", "a"]

  - n: 2
    title: { de: Ein Satz zum Bild, en: A sentence for the picture }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welcher Begleiter passt?"
            say: "Welcher Begleiter passt zum Bild?"
            show: { object: book }
            frame: "_ Buch"
            options: ["der", "das"]
            answer: ["das"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welches Wort passt zum Bild?"
            say: "Was siehst du? Welches Wort ist richtig geschrieben?"
            show: { object: trousers }
            options: ["Hose", "Hse"]
            option_audio: false
            answer: "Hose"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wer?"
            say: "Zu einem Bild kannst du einen ganzen Satz schreiben. Frag zuerst: Wer ist auf dem Bild? Ein Kind. Wir nennen es Pia."
            show: { object: swim }
          - text: "Was tut Pia?"
            say: "Dann frag: Was tut Pia? Pia schwimmt."
            show: { object: swim }
          - text: "Pia schwimmt."
            say: "Jetzt hast du den Satz: Pia schwimmt. Groß am Anfang, ein Punkt am Ende."
            show: { drawn: letter-card, text: "Pia schwimmt." }
          - text: "Pia schwimmt im Wasser."
            say: "Wenn du magst, sagst du noch mehr: Wo schwimmt Pia? Pia schwimmt im Wasser."
            show: { drawn: letter-card, text: "Pia schwimmt im Wasser." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Schau dir das Bild an. Welcher Satz passt?"
                show: { object: paint }
                options: ["Das Kind malt.", "Das Kind liest.", "Das Kind schläft."]
                option_audio: false
                answer: "Das Kind malt."
                feedback:
                  "Das Kind liest.": "Schau genau hin. Hat das Kind ein Buch oder einen Pinsel?"
                  "Das Kind schläft.": "Sind die Augen zu? Was tut das Kind?"
                hints:
                  - "Frag: Was tut das Kind?"
                  - "Das Kind hat einen Pinsel in der Hand."
                  - "Das Kind malt."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Schreib einen Satz zum Bild."
                say: "Schau dir das Bild an. Leg einen Satz mit den Karten."
                show: { object: sing }
                options: ["singt.", "Kind", "Das"]
                option_audio: false
                slot_count: 3
                answer: ["Das", "Kind", "singt."]
                hints:
                  - "Frag: Wer? Was tut er?"
                  - "Wer? Das Kind. Was tut es? Es singt."
                  - "Das Kind singt."
              - id: l2-f3
                type: multiple_choice
                text: "Welches ist ein ganzer Satz?"
                say: "Welches ist ein ganzer Satz zum Bild?"
                show: { object: read }
                options: ["Das Kind.", "Das Kind liest.", "liest ein Buch"]
                option_audio: false
                answer: "Das Kind liest."
                feedback:
                  "Das Kind.": "Hier steht nur, wer es ist. Was tut das Kind?"
                  "liest ein Buch": "Hier steht, was jemand tut. Aber wer liest? Und der Punkt fehlt."
                hints:
                  - "Ein ganzer Satz sagt: Wer? und Was tut er?"
                  - "Such den Satz, der beides hat."
                  - "Das Kind liest."
              - id: l2-f4
                type: fill_in_blank
                text: "Welches Wort passt zum Bild?"
                say: "Schau dir das Bild an. Welches Wort fehlt im Satz?"
                show: { object: jump }
                frame: "Das Kind _."
                options: ["springt", "schwimmt", "singt"]
                answer: ["springt"]
                hints:
                  - "Frag: Was tut das Kind?"
                  - "Die Füße sind in der Luft."
                  - "Das Kind springt."
              - id: l2-f5
                type: speak
                text: "Sag einen Satz zum Bild."
                say: "Schau dir das Bild an. Sag einen ganzen Satz: Wer? Was tut er?"
                show: { object: ride-bike }
                expected_text: "Das Kind fährt Rad."
                hints:
                  - "Wer ist auf dem Bild?"
                  - "Was tut das Kind? Es sitzt auf einem Fahrrad."
                  - "Zum Beispiel: Das Kind fährt Rad."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Schau dir das Bild an. Welcher Satz passt?"
                show: { object: dance }
                options: ["Das Kind tanzt.", "Das Kind rennt.", "Das Kind sitzt."]
                option_audio: false
                answer: "Das Kind tanzt."
                hints: ["Was tut das Kind mit Armen und Beinen?"]
              - id: l2-s2
                type: ordering
                text: "Schreib einen Satz zum Bild."
                say: "Schau dir das Bild an. Leg einen Satz mit den Karten."
                show: { object: dog }
                options: ["Der", "bellt.", "Hund"]
                option_audio: false
                slot_count: 3
                answer: ["Der", "Hund", "bellt."]
                hints: ["Wer? Der Hund. Was tut er?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Welches Wort passt zum Bild?"
                say: "Schau dir das Bild an. Welches Wort fehlt im Satz?"
                show: { object: clap }
                frame: "Das Kind _ in die Hände."
                options: ["klatscht", "malt", "liest"]
                answer: ["klatscht"]
                hints: ["Was machen die Hände?"]
              - id: l2-s4
                type: multiple_choice
                text: "Was fehlt in diesem Satz?"
                say: "Tom schreibt zum Bild: Die Katze. Was fehlt?"
                show: { object: cat }
                options: ["was die Katze tut", "wer auf dem Bild ist", "nichts, der Satz ist fertig"]
                answer: "was die Katze tut"
                hints: ["Frag: Wer? Und: Was tut sie?"]
              - id: l2-s5
                type: speak
                text: "Sag einen Satz zum Bild."
                say: "Schau dir das Bild an. Sag einen ganzen Satz."
                show: { object: play-football }
                expected_text: "Das Kind spielt Fußball."
                hints: ["Wer? Was tut er? Sag beides."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Schau dir das Bild an. Welcher Satz passt?"
                show: { object: fish }
                options: ["Der Fisch fliegt.", "Der Fisch schwimmt.", "Der Fisch läuft."]
                option_audio: false
                answer: "Der Fisch schwimmt."
              - id: l2-n2
                type: ordering
                text: "Schreib einen Satz zum Bild."
                say: "Schau dir das Bild an. Leg einen Satz mit den Karten."
                show: { object: snowman }
                options: ["ist", "Schneemann", "Der", "kalt."]
                option_audio: false
                slot_count: 4
                answer: ["Der", "Schneemann", "ist", "kalt."]
              - id: l2-n3
                type: fill_in_blank
                text: "Welches Wort passt zum Bild?"
                say: "Schau dir das Bild an. Welches Wort fehlt im Satz?"
                show: { object: play-guitar }
                frame: "Das Kind spielt _."
                options: ["Gitarre", "Fußball", "Tennis"]
                answer: ["Gitarre"]
              - id: l2-n4
                type: multiple_choice
                text: "Welches ist ein ganzer Satz?"
                say: "Welches ist ein ganzer Satz zum Bild?"
                show: { object: bee }
                options: ["Die Biene fliegt.", "die Biene", "fliegt zur Blume"]
                option_audio: false
                answer: "Die Biene fliegt."
              - id: l2-n5
                type: speak
                text: "Sag einen Satz zum Bild."
                say: "Schau dir das Bild an. Sag einen ganzen Satz."
                show: { object: frog }
                expected_text: "Der Frosch springt."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welches Wort passt zum Bild?"
            say: "Was siehst du? Welches Wort ist richtig geschrieben?"
            show: { object: hedgehog }
            options: ["Igl", "Igel", "Iegel"]
            option_audio: false
            answer: "Igel"
          - id: l2-c2
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Bild an. Welcher Satz passt?"
            show: { object: swim }
            options: ["Das Kind schwimmt.", "Das Kind badet in der Wanne.", "Das Kind malt."]
            option_audio: false
            answer: "Das Kind schwimmt."
          - id: l2-c3
            type: ordering
            text: "Schreib einen Satz zum Bild."
            say: "Schau dir das Bild an. Leg einen Satz mit den Karten."
            show: { object: duck }
            options: ["schwimmt.", "Ente", "Die"]
            option_audio: false
            slot_count: 3
            answer: ["Die", "Ente", "schwimmt."]
          - id: l2-c4
            type: multiple_choice
            text: "Was fehlt in diesem Satz?"
            say: "Lea schreibt zum Bild: Malt ein Bild. Was fehlt?"
            show: { object: paint }
            options: ["wer malt", "was gemalt wird", "nichts, der Satz ist fertig"]
            answer: "wer malt"
          - id: l2-c5
            type: fill_in_blank
            text: "Welcher Begleiter passt?"
            say: "Welcher Begleiter passt zum Bild?"
            show: { object: snail }
            frame: "_ Schnecke"
            options: ["der", "die", "das"]
            answer: ["die"]
