# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.word-picture
skill: lit-de.decoding.word-picture
curriculum: de-DE
language: de
title:
  de: Genau lesen
  en: Reading closely
summary: >
  Children read words exactly and tell apart words that differ in one
  letter: Hose and Rose, Maus and Haus, Tanne, Kanne and Tonne. Every
  task sets such look-alike words against each other, so a guess from the
  first letters or the length fails. Lesson 1 changes the first letter
  (Hose, Rose; Fisch, Tisch); lesson 2 changes a letter in the middle or
  the end (Tanne, Tonne; Bein, Boot, Brot) and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Erste Wörter lesen, en: Reading first words }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.two-syllable-words]
  also_practises: [lit-de.phonological.rhymes]
  vocabulary: { de: [genau lesen, Buchstabe, Wort, Bild] }
  forms: [picture, drawn, audio]
  drawn: [word-card, letter-card, syllable-arcs]
  facets: []
  misconceptions:
    - id: shape-guess
      what: Guesses from the end or the outline of the word, so Hose and Rose, Fisch and Tisch look the same
      addressed: "every option set is a rhyming pair or trio; feedback on l1-f1 and l1-f3 points to the first letter"
    - id: middle-skipped
      what: Reads the first and last letter and skips the middle (Tanne, Tonne; Boot, Brot)
      addressed: "lesson 2 changes only middle letters; feedback on l2-f1 and l2-f3 names the middle letter"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Der erste Buchstabe zählt, en: The first letter counts }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: syllable-arcs, word: "Nase", syllables: ["Na", "se"] }
            options: [{ object: nose }, { object: mouth }]
            answer: nose
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Reimt sich das?"
            say: "Haus, Maus. Reimt sich das?"
            show: { objects: [house, mouse] }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Hose Rose"
            say: "Diese zwei Wörter sehen fast gleich aus. Nur der erste Buchstabe ist anders. H: Hose. R: Rose."
            show: { drawn: letter-card, text: "Hose Rose" }
          - text: "Hose"
            say: "Hose. Wer nur auf das Ende schaut, liest falsch. Lies jeden Buchstaben."
            show: { object: trousers }
          - text: "Rose"
            say: "Rose. Ein Buchstabe anders, und es ist ein ganz anderes Ding."
            show: { object: rose }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Rose" }
                options: [{ object: trousers }, { object: rose }, { object: nose }]
                answer: rose
                feedback:
                  trousers: "Hose fängt mit H an. Hier steht vorne ein R: Rose."
                  nose: "Nase hat in der Mitte ein a. Hier steht R und o: Rose."
                hints:
                  - "Lies jeden Buchstaben, auch den ersten."
                  - "Der erste Buchstabe ist ein R: rrr."
                  - "Da steht Rose."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Welches Wort passt zum Bild? Lies genau."
                show: { object: table }
                options: ["Fisch", "Tisch", "Tasche"]
                option_audio: false
                answer: "Tisch"
                hints:
                  - "Sag, was du siehst. Dann lies jedes Wort."
                  - "Das Wort fängt mit t an."
                  - "Tisch."
              - id: l1-f3
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Maus" }
                options: [{ object: house }, { object: mouse }]
                answer: mouse
                feedback:
                  house: "Haus fängt mit H an. Hier steht vorne ein M: Maus."
                hints:
                  - "Beide Wörter reimen sich. Schau auf den ersten Buchstaben."
                  - "Mmm."
                  - "Maus."
              - id: l1-f4
                type: matching
                text: "Was gehört zusammen?"
                say: "Lies die Wörter und verbinde jedes Wort mit seinem Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Hase" }, right: { object: rabbit } }
                  - { left: { text: "Nase" }, right: { object: nose } }
                hints:
                  - "Lies den ersten Buchstaben von jedem Wort."
                  - "H wie Hase, N wie Nase."
                  - "Hase gehört zum Hasen, Nase zur Nase."
              - id: l1-f5
                type: true_false
                text: "Lies das Wort. Kann man das anziehen?"
                say: "Lies das Wort. Kann man das anziehen?"
                show: { drawn: word-card, text: "Hose" }
                answer: true
                hints:
                  - "Lies genau, Buchstabe für Buchstabe."
                  - "Vorne steht ein H."
                  - "Da steht Hose. Ja, eine Hose zieht man an."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Fisch" }
                options: [{ object: table }, { object: fish }]
                answer: fish
                hints: ["Fff am Anfang."]
              - id: l1-s2
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Welches Wort passt zum Bild? Lies genau."
                show: { object: rabbit }
                options: ["Nase", "Hase", "Hose"]
                option_audio: false
                answer: "Hase"
                hints: ["Das Wort fängt mit einem Hauch an: h."]
              - id: l1-s3
                type: true_false
                text: "Lies das Wort. Ist das ein Tier?"
                say: "Lies das Wort. Ist das ein Tier?"
                show: { drawn: word-card, text: "Haus" }
                answer: false
                hints: ["Schau auf den ersten Buchstaben: H."]
              - id: l1-s4
                type: matching
                text: "Was gehört zusammen?"
                say: "Lies die Wörter und verbinde jedes Wort mit seinem Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Kuh" }, right: { object: cow } }
                  - { left: { text: "Schuh" }, right: { object: shoe } }
                hints: ["Sch wie Schuh."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Hose" }
                options: [{ object: rose }, { object: trousers }, { object: rabbit }]
                answer: trousers
                hints: ["H und o."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Tisch" }
                options: [{ object: fish }, { object: table }]
                answer: table
              - id: l1-n2
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Welches Wort passt zum Bild? Lies genau."
                show: { object: mouse }
                options: ["Haus", "Laus", "Maus"]
                option_audio: false
                answer: "Maus"
              - id: l1-n3
                type: matching
                text: "Was gehört zusammen?"
                say: "Lies die Wörter und verbinde jedes Wort mit seinem Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Hose" }, right: { object: trousers } }
                  - { left: { text: "Rose" }, right: { object: rose } }
                  - { left: { text: "Nase" }, right: { object: nose } }
              - id: l1-n4
                type: true_false
                text: "Lies das Wort. Kann man darauf schreiben?"
                say: "Lies das Wort. Kann man darauf schreiben?"
                show: { drawn: word-card, text: "Fisch" }
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Schuh" }
                options: [{ object: cow }, { object: shoe }, { object: sock }]
                answer: shoe

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Haus" }
            options: [{ object: mouse }, { object: house }]
            answer: house
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort passt zum Bild?"
            say: "Welches Wort passt zum Bild? Lies genau."
            show: { object: rose }
            options: ["Hose", "Rose", "Dose"]
            option_audio: false
            answer: "Rose"
          - id: l1-c3
            type: true_false
            text: "Lies das Wort. Ist das ein Tier?"
            say: "Lies das Wort. Ist das ein Tier?"
            show: { drawn: word-card, text: "Kuh" }
            answer: true

  - n: 2
    title: { de: Auch die Mitte zählt, en: The middle counts too }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Hase" }
            options: [{ object: nose }, { object: rabbit }]
            answer: rabbit
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welches Wort passt zum Bild?"
            say: "Welches Wort passt zum Bild? Lies genau."
            show: { object: fish }
            options: ["Fisch", "Tisch"]
            option_audio: false
            answer: "Fisch"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Tanne Tonne"
            say: "Hier sind Anfang und Ende gleich. Nur in der Mitte ist ein Buchstabe anders: a oder o."
            show: { drawn: letter-card, text: "Tanne Tonne" }
          - text: "Tanne"
            say: "Tanne, mit a. Ein Baum."
            show: { object: fir-tree }
          - text: "Tonne"
            say: "Tonne, mit o. Da kommt der Müll hinein. Lies also jeden Buchstaben, von vorne bis hinten."
            show: { object: bin }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Kanne" }
                options: [{ object: fir-tree }, { object: jug }, { object: bin }]
                answer: jug
                feedback:
                  fir-tree: "Tanne fängt mit T an. Hier steht vorne ein K: Kanne."
                  bin: "Tonne hat in der Mitte ein o. Hier steht K und a: Kanne."
                hints:
                  - "Lies den ersten Buchstaben und den in der Mitte."
                  - "K ... a ... nne."
                  - "Kanne."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Welches Wort passt zum Bild? Lies genau."
                show: { object: boat }
                options: ["Brot", "Boot", "Bott"]
                option_audio: false
                answer: "Boot"
                hints:
                  - "Lies jedes Wort Buchstabe für Buchstabe."
                  - "Nach dem B kommen zwei o."
                  - "Boot."
              - id: l2-f3
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Brot" }
                options: [{ object: boat }, { object: bread }]
                answer: bread
                feedback:
                  boat: "Boot hat zwei o. Hier steht nach dem B ein r: Brot."
                hints:
                  - "Schau auf den zweiten Buchstaben."
                  - "B ... r ... o ... t."
                  - "Brot."
              - id: l2-f4
                type: matching
                text: "Was gehört zusammen?"
                say: "Lies die Wörter und verbinde jedes Wort mit seinem Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Mond" }, right: { object: moon } }
                  - { left: { text: "Mund" }, right: { object: mouth } }
                hints:
                  - "Schau auf den Buchstaben in der Mitte."
                  - "O wie Mond, u wie Mund."
                  - "Mond gehört zum Mond, Mund zum Mund."
              - id: l2-f5
                type: true_false
                text: "Lies das Wort. Ist das ein Baum?"
                say: "Lies das Wort. Ist das ein Baum?"
                show: { drawn: word-card, text: "Tonne" }
                answer: false
                hints:
                  - "Lies den Buchstaben in der Mitte genau."
                  - "T ... o ... nne."
                  - "Da steht Tonne, mit o. Der Baum heißt Tanne. Nein."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Bein" }
                options: [{ object: pig }, { object: leg }]
                answer: leg
                hints: ["B am Anfang."]
              - id: l2-s2
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Welches Wort passt zum Bild? Lies genau."
                show: { object: fir-tree }
                options: ["Tonne", "Tanne", "Kanne"]
                option_audio: false
                answer: "Tanne"
                hints: ["T am Anfang, a in der Mitte."]
              - id: l2-s3
                type: matching
                text: "Was gehört zusammen?"
                say: "Lies die Wörter und verbinde jedes Wort mit seinem Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Boot" }, right: { object: boat } }
                  - { left: { text: "Brot" }, right: { object: bread } }
                  - { left: { text: "Bett" }, right: { object: bed } }
                hints: ["Schau auf den zweiten Buchstaben."]
              - id: l2-s4
                type: true_false
                text: "Lies das Wort. Kann man das essen?"
                say: "Lies das Wort. Kann man das essen?"
                show: { drawn: word-card, text: "Brot" }
                answer: true
                hints: ["B ... r ... o ... t."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Eis" }
                options: [{ object: egg }, { object: ice-cream }]
                answer: ice-cream
                hints: ["Lies bis zum Ende. Steht nach dem ei noch ein Buchstabe?"]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Tonne" }
                options: [{ object: sun }, { object: fir-tree }, { object: bin }]
                answer: bin
              - id: l2-n2
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Welches Wort passt zum Bild? Lies genau."
                show: { object: bed }
                options: ["Brett", "Bett", "Beet"]
                option_audio: false
                answer: "Bett"
              - id: l2-n3
                type: matching
                text: "Was gehört zusammen?"
                say: "Lies die Wörter und verbinde jedes Wort mit seinem Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Bein" }, right: { object: leg } }
                  - { left: { text: "Schwein" }, right: { object: pig } }
              - id: l2-n4
                type: true_false
                text: "Lies das Wort. Kann man damit fahren?"
                say: "Lies das Wort. Kann man damit fahren?"
                show: { drawn: word-card, text: "Boot" }
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Ei" }
                options: [{ object: ice-cream }, { object: egg }, { object: leg }]
                answer: egg

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Tanne" }
            options: [{ object: jug }, { object: bin }, { object: fir-tree }]
            answer: fir-tree
          - id: l2-c2
            type: multiple_choice
            text: "Welches Wort passt zum Bild?"
            say: "Welches Wort passt zum Bild? Lies genau."
            show: { object: bread }
            options: ["Boot", "Brot", "Bart"]
            option_audio: false
            answer: "Brot"
          - id: l2-c3
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Bett" }
            options: [{ object: boat }, { object: bed }, { object: bread }]
            answer: bed
          - id: l2-c4
            type: true_false
            text: "Lies das Wort. Ist das ein Tier?"
            say: "Lies das Wort. Ist das ein Tier?"
            show: { drawn: word-card, text: "Schwein" }
            answer: true
          - id: l2-c5
            type: multiple_choice
            text: "Welches Wort passt zum Bild?"
            say: "Welches Wort passt zum Bild? Lies genau."
            show: { object: mouth }
            options: ["Mond", "Mund", "Hund"]
            option_audio: false
            answer: "Mund"
