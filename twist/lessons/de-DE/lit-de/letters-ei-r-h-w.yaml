# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-ei-r-h-w
skill: lit-de.letters.ei-r-h-w
curriculum: de-DE
language: de
title:
  de: Ei, R, H und W
  en: Ei, R, H and W
summary: >
  The fifth letter group in Fibel order. Lesson 1 brings ei, two letters
  for one sound (Ei, Eis, Bein), and sets it against the ie met before.
  Lessons 2 to 4 bring R (against L), H (the puff before a vowel, against
  words with none) and W (against F). Lesson 5 reads words made only of
  known letters (Hose, Eis, Wolke, Hase, Leiter, Brot) and ends with the
  skill check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.p-k-b-f]
  also_practises:
    [lit-de.letters.p-k-b-f, lit-de.handwriting.print-letters, lit-de.decoding.two-syllable-words]
  vocabulary:
    { de: [Buchstabe, Laut, Anlaut, Silbe, Zwielaut, Großbuchstabe, Kleinbuchstabe] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, syllable-arcs, word-card]
  sounds: []
  facets: [script]
  misconceptions:
    - id: ei-ie
      what: Mixes up ei and ie, the same two letters in a different order (Bein, Biene)
      addressed: lesson 1 sets ei against ie in every stage (l1-f1, l1-f3, l1-f4, l1-s3, l1-n4, l1-c2); l5-c3 reads Biene among Bein-like words
    - id: r-l
      what: Confuses R with L by ear
      addressed: l2-f3, l2-f5, l2-s2 and l2-n2 contrast R and L
    - id: h-dropped
      what: Does not hear the soft h before a vowel, or hears one where there is none (Auto, Ohr)
      addressed: l3-f3, l3-s2, l3-n4 and l3-c3 ask about words with no h
    - id: w-f
      what: Confuses W (humming) with F (only blowing)
      addressed: lesson 4 Learn sets W against F; l4-f3, l4-f5, l4-s2, l4-n3 and l4-c2 contrast them
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das Ei, en: The sound ei }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "B oder P?"
            audio: { de: "Bohne." }
            options: ["B", "P"]
            answer: "B"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Kopf" }
            options: [{ object: cup }, { object: head }, { object: cat }]
            answer: head
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Ei ei"
            say: "Hier stehen E und i zusammen: ei. Zusammen klingen sie so: ei. Wie bei Ei und Eis."
            show: { drawn: letter-card, text: "Ei ei" }
          - text: "Ei"
            say: "Ei. Du siehst zwei Buchstaben und hörst einen Laut: ei."
            show: { object: egg }
          - text: "Bein"
            say: "Bein. B ... ei ... n. Hier steckt das ei in der Mitte."
            show: { object: leg }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Wo hörst du ein ei?"
                say: "In welchem Wort hörst du ein ei?"
                options: [{ object: leg }, { object: bee }, { object: ball }]
                answer: leg
                feedback:
                  bee: "In Biene hörst du ein langes iii. Das schreibt man mit ie. In Bein hörst du ei."
                  ball: "In Ball hörst du ein a."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf die Mitte."
                  - "Bein ... ei. Biene ... iii. Ball ... a."
                  - "In Bein hörst du ein ei."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Hörst du am Anfang ein ei?"
                say: "Eis. Hörst du am Anfang ein ei?"
                show: { object: ice-cream }
                answer: true
                hints:
                  - "Sag das Wort mit: Eis."
                  - "Ei ... s. Was hörst du zuerst?"
                  - "Ja, Eis fängt mit ei an."
                difficulty: easy
              - id: l1-f3
                type: true_false
                text: "Hörst du ein ei?"
                say: "Ziege. Hörst du in dem Wort ein ei?"
                show: { object: goat }
                answer: false
                hints:
                  - "Sag das Wort langsam: Ziege."
                  - "Zie ... ge. Ist das ein ei oder ein langes iii?"
                  - "Nein, in Ziege hörst du ein langes iii."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes ei."
                say: "Tippe auf jede Karte mit ei: erst e, dann i. Auch das große Ei zählt."
                show: { drawn: letter-card, text: "ei ie Ei ie ei" }
                spans: ["ei", "Ei", "ei"]
                hints:
                  - "Schau, welcher Buchstabe vorne steht."
                  - "Bei ei steht das e vorne. Bei ie steht das i vorne."
                  - "Es sind drei Karten: ei, Ei und ei."
              - id: l1-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Bein. Was fehlt in dem Wort?"
                show: { object: leg }
                frame: "B_n"
                options: ["ei", "ie", "i"]
                answer: ["ei"]
                hints:
                  - "Sprich das Wort langsam: B ... ei ... n."
                  - "Hörst du ein ei oder ein langes iii?"
                  - "Bein schreibt man mit ei."
              - id: l1-f6
                type: tracing
                text: "Schreib Ei nach."
                show: { drawn: writing-lines, text: "Ei", mode: trace, arrows: true }
                char: "Ei"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wo hörst du ein ei?"
                say: "In welchem Wort hörst du ein ei?"
                options: [{ object: fish }, { object: pig }, { object: moon }]
                answer: pig
                hints: ["Schwein ... ei."]
              - id: l1-s2
                type: true_false
                text: "Hörst du ein ei?"
                say: "Leiter. Hörst du in dem Wort ein ei?"
                show: { object: ladder }
                answer: true
                hints: ["Sprich es langsam: Lei ... ter."]
              - id: l1-s3
                type: true_false
                text: "Hörst du ein ei?"
                say: "Spiegel. Hörst du in dem Wort ein ei?"
                show: { object: mirror }
                answer: false
                hints: ["Spie ... gel. Ist das ein ei oder ein langes iii?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Eis. Was fehlt in dem Wort?"
                show: { object: ice-cream }
                frame: "_s"
                options: ["Ei", "Ie", "A"]
                answer: ["Ei"]
                hints: ["Eis fängt mit ei an: erst E, dann i."]
              - id: l1-s5
                type: tracing
                text: "Schreib ei nach."
                show: { drawn: writing-lines, text: "ei", mode: trace, arrows: true }
                char: "ei"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Wo hörst du ein ei?"
                say: "In welchem Wort hörst du ein ei?"
                options: [{ object: bee }, { object: cup }, { object: dress }]
                answer: dress
              - id: l1-n2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Leiter. Was fehlt in dem Wort?"
                show: { object: ladder }
                frame: "L_ter"
                options: ["ie", "ei"]
                answer: ["ei"]
              - id: l1-n3
                type: true_false
                text: "Hörst du ein ei?"
                say: "Fisch. Hörst du in dem Wort ein ei?"
                show: { object: fish }
                answer: false
                difficulty: easy
              - id: l1-n4
                type: highlight_in_text
                text: "Tippe auf jedes ei."
                say: "Tippe auf jede Karte mit ei."
                show: { drawn: letter-card, text: "ie ei ie Ei" }
                spans: ["ei", "Ei"]
                difficulty: stretch
              - id: l1-n5
                type: tracing
                text: "Schreib ei ab."
                show: { drawn: writing-lines, text: "ei", mode: copy, arrows: false }
                char: "ei"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wo hörst du ein ei?"
            say: "In welchem Wort hörst du ein ei?"
            options: [{ object: ear }, { object: egg }, { object: apple }]
            answer: egg
          - id: l1-c2
            type: true_false
            text: "Hörst du ein ei?"
            say: "Biene. Hörst du in dem Wort ein ei?"
            show: { object: bee }
            answer: false
          - id: l1-c3
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Schwein. Was fehlt in dem Wort?"
            show: { object: pig }
            frame: "Schw_n"
            options: ["ie", "ei"]
            answer: ["ei"]

  - n: 2
    title: { de: Das R, en: The letter R }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Wo hörst du ein ei?"
            say: "In welchem Wort hörst du ein ei?"
            options: [{ object: ice-cream }, { object: sun }]
            answer: ice-cream
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tippe auf jedes ei."
            say: "Tippe auf jede Karte mit ei."
            show: { drawn: letter-card, text: "ei ie ei" }
            spans: ["ei", "ei"]
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "R r"
            say: "Dieser Buchstabe klingt so: rrr. Wie bei Rose und Regen. Es kratzt ein bisschen hinten im Hals."
            show: { drawn: letter-card, text: "Rr" }
          - text: "Rose"
            say: "Rose. Rrr-ose. Hörst du das rrr am Anfang?"
            show: { object: rose }
          - text: "Regen"
            say: "Regen. Rrr-egen."
            show: { object: rain }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Was fängt mit R an?"
                options: [{ object: rose }, { object: lion }, { object: nose }]
                answer: rose
                feedback:
                  lion: "Löwe fängt mit lll an. Da liegt die Zunge vorne oben."
                  nose: "Nase fängt mit nnn an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Rose ... rrr. Löwe ... lll. Nase ... nnn."
                  - "Rose fängt mit R an."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Hörst du am Anfang ein R?"
                say: "Rock. Hörst du am Anfang ein rrr?"
                show: { object: skirt }
                answer: true
                hints:
                  - "Sag das Wort mit: Rock."
                  - "Halte den ersten Laut lange: Rrrock. Kratzt es?"
                  - "Ja, Rock fängt mit rrr an."
                difficulty: easy
              - id: l2-f3
                type: true_false
                text: "Hörst du am Anfang ein R?"
                say: "Lampe. Hörst du am Anfang ein rrr?"
                show: { object: lamp }
                answer: false
                hints:
                  - "Sag das Wort mit: Lampe."
                  - "Bei lll liegt die Zunge vorne oben. Bei rrr kratzt es hinten."
                  - "Nein, Lampe fängt mit lll an."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes R."
                say: "Tippe auf jedes große und kleine R."
                show: { drawn: letter-card, text: "R n r P R" }
                spans: ["R", "r", "R"]
                hints:
                  - "Das große R sieht aus wie ein P mit einem Bein."
                  - "Das kleine r ist ein kurzer Strich mit einem kleinen Haken oben."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l2-f5
                type: audio_choice
                text: "R oder L?"
                audio: { de: "Rabe." }
                options: ["R", "L"]
                answer: "R"
                feedback:
                  L: "Bei lll liegt die Zunge vorne. Rabe kratzt hinten: rrr."
                hints:
                  - "Hör noch einmal hin."
                  - "Sprich es nach. Kratzt es hinten, oder liegt die Zunge vorne oben?"
                  - "Es kratzt: Das ist das R."
              - id: l2-f6
                type: tracing
                text: "Schreib das R nach."
                show: { drawn: writing-lines, text: "R", mode: trace, arrows: true }
                char: "R"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was fängt mit R an?"
                options: [{ object: egg }, { object: house }, { object: ring }]
                answer: ring
                hints: ["Ring ... rrr."]
              - id: l2-s2
                type: audio_choice
                text: "R oder L?"
                audio: { de: "Löffel." }
                options: ["R", "L"]
                answer: "L"
                hints: ["Liegt die Zunge am Anfang vorne oben?"]
              - id: l2-s3
                type: true_false
                text: "Hörst du am Anfang ein R?"
                say: "Regen. Hörst du am Anfang ein rrr?"
                show: { object: rain }
                answer: true
                hints: ["Sprich es langsam: Rrregen."]
              - id: l2-s4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Rose. Welcher Buchstabe fehlt?"
                show: { object: rose }
                frame: "_ose"
                options: ["H", "R", "N"]
                answer: ["R"]
                hints: ["Rrr ... ose. Mit H wäre es eine Hose."]
              - id: l2-s5
                type: tracing
                text: "Schreib das r nach."
                show: { drawn: writing-lines, text: "r", mode: trace, arrows: true }
                char: "r"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Was fängt mit R an?"
                options: [{ object: dog }, { object: zip }, { object: cow }]
                answer: zip
              - id: l2-n2
                type: audio_choice
                text: "R oder L?"
                audio: { de: "Ritter." }
                options: ["L", "R"]
                answer: "R"
              - id: l2-n3
                type: true_false
                text: "Hörst du am Anfang ein R?"
                say: "Nase. Hörst du am Anfang ein rrr?"
                show: { object: nose }
                answer: false
                difficulty: easy
              - id: l2-n4
                type: highlight_in_text
                text: "Tippe auf jedes R."
                say: "Tippe auf jedes große und kleine R."
                show: { drawn: letter-card, text: "r n R P r" }
                spans: ["r", "R", "r"]
                difficulty: stretch
              - id: l2-n5
                type: tracing
                text: "Schreib das R ab."
                show: { drawn: writing-lines, text: "R", mode: copy, arrows: false }
                char: "R"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Was fängt mit R an?"
            options: [{ object: lamp }, { object: skirt }, { object: sun }]
            answer: skirt
          - id: l2-c2
            type: audio_choice
            text: "R oder L?"
            audio: { de: "Laterne." }
            options: ["R", "L"]
            answer: "L"
          - id: l2-c3
            type: true_false
            text: "Hörst du am Anfang ein R?"
            say: "Rose. Hörst du am Anfang ein rrr?"
            show: { object: rose }
            answer: true

  - n: 3
    title: { de: Das H, en: The letter H }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: audio_choice
            text: "R oder L?"
            audio: { de: "Roller." }
            options: ["R", "L"]
            answer: "R"
            difficulty: easy
          - id: l3-w2
            type: image_multiple_choice
            text: "Was fängt mit R an?"
            options: [{ object: lion }, { object: rain }]
            answer: rain
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "H h"
            say: "Dieser Buchstabe klingt wie ein Hauch: h. Wie wenn du auf eine kalte Scheibe hauchst. Wie bei Hund und Hose."
            show: { drawn: letter-card, text: "Hh" }
          - text: "Hase"
            say: "Hase. H ... ase. Hörst du den Hauch am Anfang?"
            show: { object: rabbit }
          - text: "Hand"
            say: "Hand. H ... and. Ohne den Hauch bliebe nur: and."
            show: { object: hand }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: image_multiple_choice
                text: "Was fängt mit H an?"
                options: [{ object: rabbit }, { object: nose }, { object: monkey }]
                answer: rabbit
                feedback:
                  nose: "Nase fängt mit nnn an. Hase und Nase reimen sich, aber Hase fängt mit h an."
                  monkey: "Affe fängt gleich mit a an. Da ist kein Hauch."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Hase ... h. Nase ... nnn. Affe ... a."
                  - "Hase fängt mit H an."
                difficulty: easy
              - id: l3-f2
                type: true_false
                text: "Hörst du am Anfang ein H?"
                say: "Hose. Hörst du am Anfang ein h?"
                show: { object: trousers }
                answer: true
                hints:
                  - "Sag das Wort mit: Hose."
                  - "Halte die Hand vor den Mund. Spürst du am Anfang einen Hauch?"
                  - "Ja, Hose fängt mit h an."
                difficulty: easy
              - id: l3-f3
                type: true_false
                text: "Hörst du am Anfang ein H?"
                say: "Auto. Hörst du am Anfang ein h?"
                show: { object: car }
                answer: false
                hints:
                  - "Sag das Wort mit: Auto."
                  - "Halte die Hand vor den Mund. Kommt vor dem au ein Hauch?"
                  - "Nein, Auto fängt gleich mit au an."
              - id: l3-f4
                type: highlight_in_text
                text: "Tippe auf jedes H."
                say: "Tippe auf jedes große und kleine H."
                show: { drawn: letter-card, text: "H n h N H" }
                spans: ["H", "h", "H"]
                hints:
                  - "Das große H hat zwei Striche und eine Brücke in der Mitte."
                  - "Das kleine h hat einen langen Strich. Das n hat einen kurzen."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l3-f5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Hut. Welcher Buchstabe fehlt?"
                show: { object: hat }
                frame: "_ut"
                options: ["H", "M", "R"]
                answer: ["H"]
                hints:
                  - "Sprich das Wort langsam."
                  - "H ... ut. Spürst du den Hauch am Anfang?"
                  - "Vorne fehlt das H."
              - id: l3-f6
                type: tracing
                text: "Schreib das H nach."
                show: { drawn: writing-lines, text: "H", mode: trace, arrows: true }
                char: "H"
                difficulty: easy

          - support: some
            tasks:
              - id: l3-s1
                type: image_multiple_choice
                text: "Was fängt mit H an?"
                options: [{ object: egg }, { object: ant }, { object: house }]
                answer: house
                hints: ["Haus ... h."]
              - id: l3-s2
                type: true_false
                text: "Hörst du am Anfang ein H?"
                say: "Ohr. Hörst du am Anfang ein h?"
                show: { object: ear }
                answer: false
                hints: ["Kommt vor dem o ein Hauch?"]
              - id: l3-s3
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Honig." }
                options: ["O", "H", "N"]
                answer: "H"
                hints: ["Hör auf den Hauch vor dem o."]
              - id: l3-s4
                type: highlight_in_text
                text: "Tippe auf jedes H."
                say: "Tippe auf jedes große und kleine H."
                show: { drawn: letter-card, text: "h n H N" }
                spans: ["h", "H"]
                hints: ["Es sind zwei. Das kleine h hat einen langen Strich."]
              - id: l3-s5
                type: tracing
                text: "Schreib das h nach."
                show: { drawn: writing-lines, text: "h", mode: trace, arrows: true }
                char: "h"
                difficulty: easy

          - support: none
            tasks:
              - id: l3-n1
                type: image_multiple_choice
                text: "Was fängt mit H an?"
                options: [{ object: ant }, { object: rose }, { object: dog }]
                answer: dog
              - id: l3-n2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Hase. Welcher Buchstabe fehlt?"
                show: { object: rabbit }
                frame: "_ase"
                options: ["N", "H", "R"]
                answer: ["H"]
              - id: l3-n3
                type: true_false
                text: "Hörst du am Anfang ein H?"
                say: "Hexe. Hörst du am Anfang ein h?"
                show: { object: witch }
                answer: true
                difficulty: easy
              - id: l3-n4
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Igel." }
                options: ["H", "I"]
                answer: "I"
              - id: l3-n5
                type: tracing
                text: "Schreib das h ab."
                show: { drawn: writing-lines, text: "h", mode: copy, arrows: false }
                char: "h"

      - activity: check
        size: quick
        tasks:
          - id: l3-c1
            type: image_multiple_choice
            text: "Was fängt mit H an?"
            options: [{ object: apple }, { object: trousers }, { object: nose }]
            answer: trousers
          - id: l3-c2
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Hemd." }
            options: ["E", "H", "M"]
            answer: "H"
          - id: l3-c3
            type: true_false
            text: "Hörst du am Anfang ein H?"
            say: "Affe. Hörst du am Anfang ein h?"
            show: { object: monkey }
            answer: false

  - n: 4
    title: { de: Das W, en: The letter W }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l4-w1
            type: image_multiple_choice
            text: "Was fängt mit H an?"
            options: [{ object: hat }, { object: ear }]
            answer: hat
            difficulty: easy
          - id: l4-w2
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Heft." }
            options: ["H", "E"]
            answer: "H"
            difficulty: easy

      - activity: learn
        mode: new-sound
