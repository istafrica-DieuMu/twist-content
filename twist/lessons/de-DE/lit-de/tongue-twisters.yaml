# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.tongue-twisters
skill: lit-de.speaking.rhymes-tongue-twisters
curriculum: de-DE
language: de
title:
  de: Reime, Abzählverse und Zungenbrecher
  en: Rhymes, counting-out verses and tongue twisters
summary: >
  Saying rhymes, Abzählverse and Zungenbrecher clearly. The app cannot
  mark how clearly a child speaks, so the lessons teach and check what
  is behind it. Lesson 1 learns what an Abzählvers is for, uses the rhyme
  words to remember the next line, puts lines in order and says them in
  time; lesson 2 hears the sound a Zungenbrecher repeats, finds the word
  that keeps it going, learns to practise slowly first and clearly
  before fast, tells Zungenbrecher from Abzählvers, and ends with the
  skill check. Speak tasks let the child say lines aloud and compare
  with the model; they are practice only. Every verse and tongue twister
  is written for Twist.
metadata:
  year: klasse-1
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.phonological.rhymes]
  also_practises: [lit-de.phonological.rhymes, lit-de.phonological.initial-sound]
  vocabulary: { de: [Reim, Reimwort, Abzählvers, Zungenbrecher, Takt, deutlich, Laut] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: meaning-not-rhyme
      what: Fills a gap in a verse with a word that makes sense but does not rhyme (ein Käppchen blau instead of rot)
      addressed: "lesson 1 Learn says the rhyme word helps you find the next line; every gap task in lesson 1 offers a word that fits the meaning but not the rhyme (l1-f1 with feedback, l1-s1, l1-n1, l1-c1, l2-c1)"
    - id: fast-not-clear
      what: Thinks a Zungenbrecher or a verse is about saying it as fast as possible, not clearly
      addressed: "lesson 1 Learn says loud, clear and in time; lesson 2 Learn says first slowly, then faster, every word clear; \"Wie übst du\" tasks in l2-f3 (with feedback), l2-s3 and l2-c4, and l1-f5, l1-s5 for verses"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Abzählverse und Reime", en: "Counting-out verses and rhymes" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Reimt sich das?"
            say: "Haus, Maus. Reimt sich das?"
            show: { objects: [house, mouse] }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Was reimt sich auf Boot?"
            say: "Boot. Was reimt sich auf Boot?"
            show: { object: boat }
            options: [{ object: bread }, { object: bus }, { object: ball }]
            answer: bread
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Ene, bene, Butterbrot,\ndie Katze hat ein Käppchen rot.\nSie tanzt einmal ums ganze Haus,\nund du bist raus!"
            say: "Hör zu. Das ist ein Abzählvers. Ene, bene, Butterbrot, die Katze hat ein Käppchen rot. Sie tanzt einmal ums ganze Haus, und du bist raus! Mit einem Abzählvers findet ihr heraus, wer beim Spiel anfangen muss."
          - text: "E · ne · be · ne · But · ter · brot"
            say: "Ein Kind sagt den Vers und zeigt bei jeder Silbe auf ein anderes Kind. E, ne, be, ne, But, ter, brot. Wer bei der letzten Silbe dran ist, ist raus. Darum sprichst du laut, deutlich und im Takt."
          - text: "Butterbrot · rot\nHaus · raus"
            say: "Die Reimwörter helfen dir beim Merken. Weißt du Butterbrot, fällt dir rot leichter ein. Weißt du Haus, kommt raus fast von allein."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welches Reimwort fehlt?"
                say: "Welches Wort fehlt am Ende? Sprich leise mit: Ene, bene, Butterbrot, die Katze hat ein Käppchen ..."
                frame: "Ene, bene, Butterbrot,\ndie Katze hat ein Käppchen _ ."
                options: ["rot", "blau", "grün"]
                answer: ["rot"]
                feedback:
                  "blau": "Ein blaues Käppchen gibt es auch. Aber blau reimt sich nicht auf Butterbrot."
                hints:
                  - "Das Wort reimt sich auf Butterbrot."
                  - "Butterbrot endet mit ot. Welche Farbe endet auch so?"
                  - "rot."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wozu ist ein Abzählvers da?"
                say: "Wozu ist ein Abzählvers da?"
                options: ["Er zeigt, wer beim Spiel anfängt.", "Er erzählt eine lange Geschichte.", "Er erklärt, wie man kocht."]
                answer: "Er zeigt, wer beim Spiel anfängt."
                hints:
                  - "Wann sagen Kinder einen Abzählvers?"
                  - "Vor einem Spiel, zum Beispiel vor dem Fangen."
                  - "Er zeigt, wer anfängt."
              - id: l1-f3
                type: true_false
                text: "Reimt sich das?"
                say: "Hör gut zu. Haus, raus. Reimt sich das?"
                answer: true
                hints:
                  - "Sprich beide Wörter langsam nach."
                  - "Hör auf das Ende: Haus, raus."
                  - "Beide enden mit aus. Ja, sie reimen sich."
              - id: l1-f4
                type: ordering
                text: "Bring den Vers in die richtige Reihenfolge."
                say: "Bring die Zeilen in die richtige Reihenfolge."
                options: ["und du bist raus!", "Ene, bene, Butterbrot,", "Sie tanzt einmal ums ganze Haus,", "die Katze hat ein Käppchen rot."]
                slot_count: 4
                answer: ["Ene, bene, Butterbrot,", "die Katze hat ein Käppchen rot.", "Sie tanzt einmal ums ganze Haus,", "und du bist raus!"]
                hints:
                  - "Womit fängt der Vers an?"
                  - "Butterbrot reimt sich auf rot, Haus auf raus."
                  - "Butterbrot, rot, Haus, raus."
              - id: l1-f5
                type: multiple_choice
                text: "Wie sagst du einen Abzählvers auf?"
                say: "Wie sagst du einen Abzählvers auf?"
                options: ["laut, deutlich und im Takt", "ganz leise und schnell", "durcheinander"]
                answer: "laut, deutlich und im Takt"
                feedback:
                  "ganz leise und schnell": "Dann hören die anderen nicht, wer dran ist. Sprich laut und im Takt."
                hints:
                  - "Alle Kinder sollen mitzählen können."
                  - "Bei jeder Silbe ist ein anderes Kind dran."
                  - "Laut, deutlich und im Takt."
              - id: l1-f6
                type: speak
                text: "Sprich nach: „Ene, bene, Butterbrot.“"
                say: "Hör gut zu und sprich im Takt nach: Ene, bene, Butterbrot."
                expected_text: "Ene, bene, Butterbrot."
                hints:
                  - "Sprich jede Silbe deutlich."
                  - "Klatsch bei jeder Silbe leise mit."
                  - "E, ne, be, ne, But, ter, brot."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welches Reimwort fehlt?"
                say: "Welches Wort fehlt am Ende? Sprich leise mit: Eins, zwei, drei, die Maus ist mit ..."
                frame: "Eins, zwei, drei,\ndie Maus ist mit _ ."
                options: ["dabei", "Mama", "uns"]
                answer: ["dabei"]
                hints: ["Das Wort reimt sich auf drei."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Wörter reimen sich?"
                say: "Hör zu. Vier, fünf, sechs, sie malt einen Klecks. Welche Wörter reimen sich?"
                options: ["sechs und Klecks", "vier und fünf", "sie und einen"]
                answer: "sechs und Klecks"
                hints: ["Schau auf die Wörter am Ende der Zeilen."]
              - id: l1-s3
                type: true_false
                text: "Reimt sich das?"
                say: "Hör gut zu. Butterbrot, Käppchen. Reimt sich das?"
                answer: false
                hints: ["Hör auf das Ende der Wörter."]
              - id: l1-s4
                type: ordering
                text: "Bring den Vers in die richtige Reihenfolge."
                say: "Bring die Zeilen in die richtige Reihenfolge."
                options: ["Vier, fünf, sechs,", "die Maus ist mit dabei.", "Eins, zwei, drei,", "sie malt einen Klecks."]
                slot_count: 4
                answer: ["Eins, zwei, drei,", "die Maus ist mit dabei.", "Vier, fünf, sechs,", "sie malt einen Klecks."]
                hints: ["Die Zahlen helfen dir."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das?"
                say: "Stimmt das? Einen Abzählvers sprichst du so schnell, dass keiner mitkommt."
                answer: false
                hints: ["Sollen die anderen mitzählen können?"]
              - id: l1-s6
                type: speak
                text: "Sprich nach: „Eins, zwei, drei, die Maus ist mit dabei.“"
                say: "Hör gut zu und sprich im Takt nach: Eins, zwei, drei, die Maus ist mit dabei."
                expected_text: "Eins, zwei, drei, die Maus ist mit dabei."
                hints: ["Sprich laut, deutlich und im Takt."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welches Reimwort fehlt?"
                say: "Welches Wort fehlt am Ende? Sprich leise mit: Sieben, acht, jetzt wird ..."
                frame: "Sieben, acht,\njetzt wird _ ."
                options: ["gelacht", "gespielt", "gesungen"]
                answer: ["gelacht"]
              - id: l1-n2
                type: multiple_choice
                text: "Welche Wörter reimen sich?"
                say: "Hör zu. Die Ente schwimmt im See, sie trinkt am liebsten Tee. Welche Wörter reimen sich?"
                options: ["See und Tee", "Ente und See", "schwimmt und trinkt"]
                answer: "See und Tee"
              - id: l1-n3
                type: ordering
                text: "Bring den Reim in die richtige Reihenfolge."
                say: "Bring die Zeilen in die richtige Reihenfolge."
                options: ["sie trinkt am liebsten Tee.", "Die Ente schwimmt im See,"]
                slot_count: 2
                answer: ["Die Ente schwimmt im See,", "sie trinkt am liebsten Tee."]
              - id: l1-n4
                type: image_multiple_choice
                text: "Was reimt sich auf Maus?"
                say: "Maus. Was reimt sich auf Maus?"
                show: { object: mouse }
                options: [{ object: house }, { object: cat }, { object: cheese }]
                answer: house
              - id: l1-n5
                type: speak
                text: "Sprich nach: „Sie tanzt einmal ums ganze Haus, und du bist raus!“"
                say: "Hör gut zu und sprich im Takt nach: Sie tanzt einmal ums ganze Haus, und du bist raus!"
                expected_text: "Sie tanzt einmal ums ganze Haus, und du bist raus!"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Welches Reimwort fehlt?"
            say: "Welches Wort fehlt am Ende? Sprich leise mit: Sie tanzt einmal ums ganze Haus, und du bist ..."
            frame: "Sie tanzt einmal ums ganze Haus,\nund du bist _ !"
            options: ["raus", "dran", "weg"]
            answer: ["raus"]
          - id: l1-c2
            type: multiple_choice
            text: "Wann sagen Kinder einen Abzählvers?"
            say: "Wann sagen Kinder einen Abzählvers?"
            options: ["vor einem Spiel", "beim Zähneputzen", "beim Essen"]
            answer: "vor einem Spiel"
          - id: l1-c3
            type: true_false
            text: "Reimt sich das?"
            say: "Hör gut zu. Drei, dabei. Reimt sich das?"
            answer: true

  - n: 2
    title: { de: Zungenbrecher, en: Tongue twisters }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welches Reimwort fehlt?"
            say: "Welches Wort fehlt am Ende? Sprich leise mit: Vier, fünf, sechs, sie malt einen ..."
            frame: "Vier, fünf, sechs,\nsie malt einen _ ."
            options: ["Klecks", "Baum", "Kreis"]
            answer: ["Klecks"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wozu ist ein Abzählvers da?"
            say: "Was macht ihr mit einem Abzählvers?"
            options: ["Wir finden heraus, wer anfängt.", "Wir lernen neue Wörter.", "Wir schlafen ein."]
            answer: "Wir finden heraus, wer anfängt."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Fünf flinke Frösche fangen frische Fliegen."
            say: "Hör zu. Fünf flinke Frösche fangen frische Fliegen. Das ist ein Zungenbrecher. Fast alle Wörter fangen mit dem gleichen Laut an: fff. Darum stolpert die Zunge so leicht."
            show: { object: frog }
          - text: "langsam → schneller"
            say: "So übst du einen Zungenbrecher. Sprich ihn zuerst ganz langsam: Fünf, flinke, Frösche. Jedes Wort ist deutlich. Dann sprichst du ihn ein bisschen schneller. Und noch ein bisschen schneller."
          - text: "Sieben Schnecken schlecken sieben Schokoschnecken."
            say: "Schnell ist lustig, aber deutlich ist wichtiger. Wenn du stolperst, fang einfach wieder langsam an. Sieben Schnecken schlecken sieben Schokoschnecken. Hier hörst du immer wieder: sch."
            show: { object: snail }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Welchen Laut hörst du immer wieder am Anfang?"
                say: "Hör gut zu. Welchen Laut hörst du immer wieder am Anfang?"
                audio: { de: "Fünf flinke Frösche fangen frische Fliegen." }
                options: ["F", "S", "M"]
                answer: "F"
                hints:
                  - "Sprich das erste Wort langsam: Fünf."
                  - "Fünf, flinke, Frösche. Wie fangen sie an?"
                  - "Alle fangen mit fff an. Tippe auf F."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welcher Satz ist ein Zungenbrecher?"
                say: "Welcher Satz ist ein Zungenbrecher?"
                options: ["Kleine Katzen kratzen keine Kakteen.", "Die Katze schläft auf dem Sofa.", "Heute ist es warm."]
                answer: "Kleine Katzen kratzen keine Kakteen."
                feedback:
                  "Die Katze schläft auf dem Sofa.": "Der Satz lässt sich leicht sagen. Bei einem Zungenbrecher fangen fast alle Wörter gleich an."
                hints:
                  - "Bei einem Zungenbrecher stolpert die Zunge."
                  - "Hör auf die Anfänge: Kleine, Katzen, kratzen."
                  - "Kleine Katzen kratzen keine Kakteen."
              - id: l2-f3
                type: multiple_choice
                text: "Wie übst du einen Zungenbrecher?"
                say: "Wie übst du einen Zungenbrecher?"
                options: ["erst langsam, dann immer schneller", "sofort so schnell wie möglich", "nur im Kopf, ganz ohne Sprechen"]
                answer: "erst langsam, dann immer schneller"
                feedback:
                  "sofort so schnell wie möglich": "Dann stolperst du gleich. Fang langsam an, damit jedes Wort deutlich ist."
                hints:
                  - "Was hilft, damit jedes Wort deutlich bleibt?"
                  - "Fang langsam an."
                  - "Erst langsam, dann immer schneller."
              - id: l2-f4
                type: fill_in_blank
                text: "Welches Wort passt in den Zungenbrecher?"
                say: "Welches Wort passt am Ende in den Zungenbrecher? Sieben Schnecken schlecken sieben ..."
                frame: "Sieben Schnecken schlecken sieben _ ."
                options: ["Schokoschnecken", "Bonbons", "Kekse"]
                answer: ["Schokoschnecken"]
                hints:
                  - "Welcher Laut kommt immer wieder?"
                  - "Schnecken, schlecken. Das passende Wort fängt auch mit sch an."
                  - "Schokoschnecken."
              - id: l2-f5
                type: image_multiple_choice
                text: "Hundert _ hüpfen hinterm Haus.\n\nWelches Tier passt in den Zungenbrecher?"
                say: "Hundert Tiere hüpfen hinterm Haus. Welches Tier passt, damit ein Zungenbrecher daraus wird?"
                options: [{ object: rabbit }, { object: frog }, { object: cow }]
                answer: rabbit
                hints:
                  - "Hör auf die Anfänge: Hundert, hüpfen, hinterm, Haus."
                  - "Das Tier fängt auch mit h an."
                  - "Hase. Hundert Hasen hüpfen hinterm Haus."
              - id: l2-f6
                type: speak
                text: "Sprich langsam nach: „Fünf flinke Frösche fangen frische Fliegen.“"
                say: "Sprich den Zungenbrecher erst ganz langsam nach: Fünf, flinke, Frösche, fangen, frische, Fliegen."
                expected_text: "Fünf flinke Frösche fangen frische Fliegen."
                hints:
                  - "Lass dir Zeit."
                  - "Sprich jedes Wort deutlich."
                  - "Fünf flinke Frösche fangen frische Fliegen."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Welchen Laut hörst du immer wieder am Anfang?"
                say: "Hör gut zu. Welchen Laut hörst du immer wieder am Anfang?"
                audio: { de: "Lustige Lamas lachen laut im Laden." }
                options: ["M", "L", "N"]
                answer: "L"
                hints: ["Sprich das erste Wort langsam: Lustige."]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Satz ist ein Zungenbrecher?"
                say: "Welcher Satz ist ein Zungenbrecher?"
                options: ["Wilde Wale winken weißen Wellen.", "Der Wal schwimmt im Meer.", "Ich gehe heute schwimmen."]
                answer: "Wilde Wale winken weißen Wellen."
                hints: ["Bei welchem Satz fangen fast alle Wörter gleich an?"]
              - id: l2-s3
                type: true_false
                text: "Stimmt das?"
                say: "Stimmt das? Bei einem Zungenbrecher ist deutlich wichtiger als schnell."
                answer: true
                hints: ["Was haben wir gelernt? Schnell ist lustig, aber ..."]
              - id: l2-s4
                type: fill_in_blank
                text: "Welches Wort passt in den Zungenbrecher?"
                say: "Welches Wort passt am Ende in den Zungenbrecher? Zehn zahme Ziegen ziehen zwanzig ..."
                frame: "Zehn zahme Ziegen ziehen zwanzig _ ."
                options: ["Zitronen", "Äpfel", "Bananen"]
                answer: ["Zitronen"]
                hints: ["Das Wort fängt auch mit z an."]
              - id: l2-s5
                type: sorting
                text: "Zungenbrecher oder Abzählvers?"
                say: "Ist das ein Zungenbrecher oder ein Abzählvers? Sortiere."
                bins:
                  - { id: twister, show: { text: "Zungenbrecher" }, say: "Zungenbrecher" }
                  - { id: counting, show: { text: "Abzählvers" }, say: "Abzählvers" }
                options:
                  - { text: "Bäcker Braun backt braune Brezeln.", say: "Bäcker Braun backt braune Brezeln.", bin: twister }
                  - { text: "Fünf flinke Frösche fangen frische Fliegen.", say: "Fünf flinke Frösche fangen frische Fliegen.", bin: twister }
                  - { text: "Eins, zwei, drei, und du bist frei!", say: "Eins, zwei, drei, und du bist frei!", bin: counting }
                  - { text: "Ene, bene, Butterbrot …", say: "Ene, bene, Butterbrot", bin: counting }
                hints: ["Ein Abzählvers zählt oft und endet mit raus oder frei."]
              - id: l2-s6
                type: speak
                text: "Sprich nach: „Lustige Lamas lachen laut im Laden.“"
                say: "Sprich den Zungenbrecher erst langsam, dann ein bisschen schneller: Lustige Lamas lachen laut im Laden."
                expected_text: "Lustige Lamas lachen laut im Laden."
                hints: ["Fang langsam an. Jedes Wort soll deutlich sein."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Welchen Laut hörst du immer wieder am Anfang?"
                say: "Hör gut zu. Welchen Laut hörst du immer wieder am Anfang?"
                audio: { de: "Mama mag milde Möhren mit Milch." }
                options: ["N", "W", "M"]
                answer: "M"
              - id: l2-n2
                type: fill_in_blank
                text: "Welches Wort passt in den Zungenbrecher?"
                say: "Welches Wort passt am Ende in den Zungenbrecher? Kleine Katzen kratzen keine ..."
                frame: "Kleine Katzen kratzen keine _ ."
                options: ["Kakteen", "Bäume", "Stühle"]
                answer: ["Kakteen"]
              - id: l2-n3
                type: image_multiple_choice
                text: "Freche _ fressen frisches Futter.\n\nWelches Tier passt in den Zungenbrecher?"
                say: "Freche Tiere fressen frisches Futter. Welches Tier passt, damit ein Zungenbrecher daraus wird?"
                options: [{ object: fox }, { object: dog }, { object: pig }]
                answer: fox
              - id: l2-n4
                type: multiple_choice
                text: "Du stolperst beim Zungenbrecher. Was machst du?"
                say: "Du stolperst beim Zungenbrecher. Was machst du?"
                options: ["noch einmal langsam anfangen", "aufhören und nie wieder probieren", "noch schneller sprechen"]
                answer: "noch einmal langsam anfangen"
              - id: l2-n5
                type: speak
                text: "Sprich nach: „Sieben Schnecken schlecken sieben Schokoschnecken.“"
                say: "Sprich den Zungenbrecher deutlich nach: Sieben Schnecken schlecken sieben Schokoschnecken."
                expected_text: "Sieben Schnecken schlecken sieben Schokoschnecken."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Welches Reimwort fehlt?"
            say: "Welches Wort fehlt am Ende? Sprich leise mit: Der Hase hüpft ins Gras, das macht ihm großen ..."
            frame: "Der Hase hüpft ins Gras,\ndas macht ihm großen _ ."
            options: ["Spaß", "Hunger", "Mut"]
            answer: ["Spaß"]
          - id: l2-c2
            type: audio_choice
            text: "Welchen Laut hörst du immer wieder am Anfang?"
            say: "Hör gut zu. Welchen Laut hörst du immer wieder am Anfang?"
            audio: { de: "Bäcker Braun backt braune Brezeln." }
            options: ["D", "B", "P"]
            answer: "B"
          - id: l2-c3
            type: multiple_choice
            text: "Welcher Satz ist ein Zungenbrecher?"
            say: "Welcher Satz ist ein Zungenbrecher?"
            options: ["Hundert Hasen hüpfen hinterm Haus.", "Der Hase wohnt im Wald.", "Wir spielen im Garten."]
            answer: "Hundert Hasen hüpfen hinterm Haus."
          - id: l2-c4
            type: multiple_choice
            text: "Was ist beim Aufsagen am wichtigsten?"
            say: "Du sagst einen Vers oder einen Zungenbrecher auf. Was ist am wichtigsten?"
            options: ["dass jedes Wort deutlich ist", "dass du der Schnellste bist", "dass du ganz leise bist"]
            answer: "dass jedes Wort deutlich ist"
          - id: l2-c5
            type: ordering
            text: "Bring den Vers in die richtige Reihenfolge."
            say: "Bring die Zeilen in die richtige Reihenfolge."
