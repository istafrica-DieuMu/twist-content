# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.verbs-recognise
skill: lit-de.verbs.recognise
curriculum: de-DE
language: de
title:
  de: Verben erkennen
  en: Recognising verbs
summary: >
  Verben sagen, was jemand tut oder was geschieht. Lesson 1 finds the verb
  in short sentences with the question "Was tut …?" and the ich-Probe (ich
  laufe, ich male); lesson 2 adds verbs for things that happen (es regnet,
  das Eis schmilzt), tells verbs from Nomen and Adjektiven, and ends with
  the skill check.
metadata:
  year: klasse-2
  topic: { de: Verben, en: Verbs }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.nouns.recognise]
  also_practises: [lit-de.nouns.recognise]
  vocabulary: { de: [Verb, Tuwort, tun, geschehen, Nomen, Adjektiv, ich-Probe] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: verb-is-action-word-only
      what: Thinks only movements are verbs, so misses verbs like schlafen, denken, regnen
      addressed: lesson 2 Learn shows verbs for things that happen and for quiet doing (schlafen, denken); tasks ask for them in each stage
    - id: noun-for-the-doing
      what: Picks the noun that does something (der Hund) instead of what it does (bellt)
      addressed: Learn asks "Was tut der Hund?"; feedback on the noun says it names who does it
    - id: adjective-as-verb
      what: Takes a describing word for a verb (schnell, laut)
      addressed: lesson 2 sorts verbs from Adjektiven with the ich-Probe; feedback says "ich schnell" does not work
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was tut jemand?", en: "What is someone doing?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen? Alles ist klein geschrieben."
            say: "Die Wörter sind klein geschrieben. Welches ist ein Nomen?"
            options: ["katze", "schnell", "rennen"]
            answer: "katze"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ist Ball ein Nomen?"
            say: "Ist das Wort auf der Karte ein Nomen?"
            show: { drawn: letter-card, text: "der Ball" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Hund bellt."
            say: "Der Hund bellt. Was tut der Hund? Er bellt. Bellt ist ein Verb. Verben sagen, was jemand tut."
          - text: "Lina malt ein Bild."
            say: "Lina malt ein Bild. Was tut Lina? Sie malt. Malt ist das Verb. Verben nennt man auch Tuwörter."
          - text: "ich male · ich laufe · ich Hund?"
            say: "Ein Trick: die ich-Probe. Passt ich davor, ist es oft ein Verb: ich male, ich laufe. Ich Hund geht nicht. Hund ist ein Nomen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Der Vogel singt."
                say: "Lies den Satz. Welches Wort ist das Verb?"
                options: ["Der", "Vogel", "singt"]
                answer: "singt"
                feedback:
                  "Vogel": "Vogel ist ein Nomen. Es sagt, wer etwas tut. Was tut der Vogel?"
                hints:
                  - "Frag: Was tut der Vogel?"
                  - "Das Verb sagt, was der Vogel macht."
                  - "singt."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Tom springt über den Bach." }
                spans: ["springt"]
                hints:
                  - "Frag: Was tut Tom?"
                  - "Mach die ich-Probe mit jedem Wort."
                  - "springt."
              - id: l1-f3
                type: true_false
                text: "Ist lachen ein Verb?"
                say: "Lies das Wort auf der Karte. Ist es ein Verb?"
                show: { drawn: letter-card, text: "lachen" }
                answer: true
                hints:
                  - "Mach die ich-Probe."
                  - "Ich lache: das passt."
                  - "Ja, lachen ist ein Verb."
              - id: l1-f4
                type: multiple_choice
                text: "Welches Wort ist ein Verb?"
                say: "Lies die drei Wörter. Welches ist ein Verb?"
                options: ["schwimmen", "Fisch", "nass"]
                answer: "schwimmen"
                feedback:
                  "nass": "Nass sagt, wie etwas ist. Ich nass passt nicht. Das ist kein Verb."
                hints:
                  - "Welches Wort sagt, was man tut?"
                  - "Mach die ich-Probe: ich schwimme, ich Fisch, ich nass."
                  - "schwimmen."
              - id: l1-f5
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Oma backt einen Kuchen." }
                spans: ["backt"]
                hints:
                  - "Frag: Was tut Oma?"
                  - "Kuchen ist ein Nomen, es hat einen großen Anfangsbuchstaben."
                  - "backt."
              - id: l1-f6
                type: fill_in_blank
                text: "Welches Verb passt?"
                say: "Lies den Satz. Setz das passende Verb ein."
                frame: "Die Kinder _ im Garten."
                options: ["spielen", "Garten", "laut"]
                answer: ["spielen"]
                hints:
                  - "Es fehlt, was die Kinder tun."
                  - "Garten ist ein Nomen, laut sagt, wie etwas ist."
                  - "spielen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Die Katze schläft."
                say: "Lies den Satz. Welches Wort ist das Verb?"
                options: ["Die", "Katze", "schläft"]
                answer: "schläft"
                hints: ["Frag: Was tut die Katze?"]
              - id: l1-s2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Papa liest die Zeitung." }
                spans: ["liest"]
                hints: ["Was tut Papa?"]
              - id: l1-s3
                type: true_false
                text: "Ist das Wort auf der Karte ein Verb? Es ist klein geschrieben."
                say: "Lies das Wort auf der Karte. Es ist klein geschrieben. Ist es ein Verb?"
                show: { drawn: letter-card, text: "tisch" }
                answer: false
                hints: ["Mach die ich-Probe."]
              - id: l1-s4
                type: multiple_choice
                text: "Welches Wort ist ein Verb?"
                say: "Lies die drei Wörter. Welches ist ein Verb?"
                options: ["klein", "Bett", "rufen"]
                answer: "rufen"
                hints: ["Welches Wort passt nach ich?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Welches Verb passt?"
                say: "Lies den Satz. Setz das passende Verb ein."
                frame: "Ben _ ein Eis."
                options: ["isst", "Eis", "kalt"]
                answer: ["isst"]
                hints: ["Was tut Ben mit dem Eis?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Das Baby weint."
                say: "Lies den Satz. Welches Wort ist das Verb?"
                options: ["Das", "Baby", "weint"]
                answer: "weint"
              - id: l1-n2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Mia trinkt warmen Tee." }
                spans: ["trinkt"]
              - id: l1-n3
                type: true_false
                text: "Ist tanzen ein Verb?"
                say: "Lies das Wort auf der Karte. Ist es ein Verb?"
                show: { drawn: letter-card, text: "tanzen" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Welches Wort ist ein Verb?"
                say: "Lies die drei Wörter. Welches ist ein Verb?"
                options: ["Hose", "bunt", "waschen"]
                answer: "waschen"
              - id: l1-n5
                type: fill_in_blank
                text: "Welches Verb passt?"
                say: "Lies den Satz. Setz das passende Verb ein."
                frame: "Der Frosch _ ins Wasser."
                options: ["hüpft", "Teich", "grün"]
                answer: ["hüpft"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Der Bus hält an der Schule." }
            spans: ["hält"]
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort ist ein Verb?"
            say: "Lies die drei Wörter. Welches ist ein Verb?"
            options: ["bauen", "Haus", "hoch"]
            answer: "bauen"
          - id: l1-c3
            type: true_false
            text: "Ist leise ein Verb?"
            say: "Lies das Wort auf der Karte. Ist es ein Verb?"
            show: { drawn: letter-card, text: "leise" }
            answer: false

  - n: 2
    title: { de: "Verb, Nomen oder Adjektiv?", en: "Verb, noun or adjective?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Ali kauft Brot." }
            spans: ["kauft"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ist rennen ein Verb?"
            say: "Lies das Wort auf der Karte. Ist es ein Verb?"
            show: { drawn: letter-card, text: "rennen" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Es regnet. · Das Eis schmilzt."
            say: "Verben sagen auch, was geschieht. Es regnet. Das Eis schmilzt. Regnet und schmilzt sind Verben."
          - text: "schlafen · denken · wohnen"
            say: "Auch wer ganz still ist, tut etwas: Er schläft, er denkt, er wohnt in einem Haus. Auch das sind Verben."
          - text: "der Hase · schnell · hoppeln"
            say: "Drei Wortarten: Hase ist ein Nomen, man kann der davor sagen. Schnell ist ein Adjektiv, es sagt, wie etwas ist. Hoppeln ist ein Verb: ich hopple. Ich schnell passt nicht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Verb oder Adjektiv?"
                say: "Lies die Wörter. Sortiere: Was tut man, oder wie ist etwas?"
                option_audio: false
                bins:
                  - { id: verb, show: { text: "Verb: ich …" }, say: "Verb" }
                  - { id: adj, show: { text: "Adjektiv: wie?" }, say: "Adjektiv" }
                options:
                  - { text: "kochen", bin: verb }
                  - { text: "warm", bin: adj }
                  - { text: "klettern", bin: verb }
                  - { text: "müde", bin: adj }
                hints:
                  - "Mach die ich-Probe mit jedem Wort."
                  - "Ich koche, ich klettere: das passt."
                  - "kochen und klettern sind Verben, warm und müde sind Adjektive."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Am Morgen scheint die Sonne." }
                spans: ["scheint"]
                hints:
                  - "Was geschieht am Morgen?"
                  - "Die Sonne tut etwas."
                  - "scheint."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Wortart ist schnell?"
                say: "Lies das Wort auf der Karte. Welche Wortart ist es?"
                show: { drawn: letter-card, text: "schnell" }
                options: ["Verb", "Nomen", "Adjektiv"]
                answer: "Adjektiv"
                feedback:
                  "Verb": "Ich schnell passt nicht. Schnell sagt, wie jemand ist oder läuft."
                hints:
                  - "Passt ich davor? Passt der, die oder das davor?"
                  - "Schnell sagt, wie etwas ist."
                  - "Adjektiv."
              - id: l2-f4
                type: true_false
                text: "Ist schmelzen ein Verb?"
                say: "Lies das Wort auf der Karte. Ist es ein Verb?"
                show: { drawn: letter-card, text: "schmelzen" }
                answer: true
                hints:
                  - "Sagt das Wort, was geschieht?"
                  - "Der Schnee schmilzt."
                  - "Ja."
              - id: l2-f5
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Opa denkt an seinen Urlaub." }
                spans: ["denkt"]
                hints:
                  - "Auch Denken ist etwas, das man tut."
                  - "Was tut Opa?"
                  - "denkt."
              - id: l2-f6
                type: multiple_choice
                text: "Welches Wort ist kein Verb?"
                say: "Lies die drei Wörter. Welches ist kein Verb?"
                options: ["wohnen", "fröhlich", "schlafen"]
                answer: "fröhlich"
                hints:
                  - "Mach mit jedem Wort die ich-Probe."
                  - "Ich wohne, ich schlafe."
                  - "fröhlich ist kein Verb."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Verb oder Adjektiv?"
                say: "Lies die Wörter. Sortiere: Was tut man, oder wie ist etwas?"
                option_audio: false
                bins:
                  - { id: verb, show: { text: "Verb: ich …" }, say: "Verb" }
                  - { id: adj, show: { text: "Adjektiv: wie?" }, say: "Adjektiv" }
                options:
                  - { text: "flüstern", bin: verb }
                  - { text: "dunkel", bin: adj }
                  - { text: "rutschen", bin: verb }
                  - { text: "süß", bin: adj }
                hints: ["Passt ich davor?"]
              - id: l2-s2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Im Winter friert der See zu." }
                spans: ["friert"]
                hints: ["Was geschieht mit dem See?"]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Wortart ist das? Das Wort ist klein geschrieben."
                say: "Lies das Wort auf der Karte. Es ist klein geschrieben. Welche Wortart ist es?"
                show: { drawn: letter-card, text: "wolke" }
                options: ["Verb", "Nomen", "Adjektiv"]
                answer: "Nomen"
                hints: ["Steht ein Artikel davor?"]
              - id: l2-s4
                type: true_false
                text: "Ist laut ein Verb?"
                say: "Lies das Wort auf der Karte. Ist es ein Verb?"
                show: { drawn: letter-card, text: "laut" }
                answer: false
                hints: ["Mach die ich-Probe."]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Wort ist kein Verb?"
                say: "Lies die drei Wörter. Welches ist kein Verb?"
                options: ["blühen", "träumen", "nett"]
                answer: "nett"
                hints: ["Welches Wort sagt, wie jemand ist?"]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Verb oder Adjektiv?"
                say: "Lies die Wörter. Sortiere: Was tut man, oder wie ist etwas?"
                option_audio: false
                bins:
                  - { id: verb, show: { text: "Verb: ich …" }, say: "Verb" }
                  - { id: adj, show: { text: "Adjektiv: wie?" }, say: "Adjektiv" }
                options:
                  - { text: "schreiben", bin: verb }
                  - { text: "weich", bin: adj }
                  - { text: "hören", bin: verb }
                  - { text: "alt", bin: adj }
              - id: l2-n2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Der Wind weht über das Feld." }
                spans: ["weht"]
              - id: l2-n3
                type: multiple_choice
                text: "Welche Wortart ist warten?"
                say: "Lies das Wort auf der Karte. Welche Wortart ist es?"
                show: { drawn: letter-card, text: "warten" }
                options: ["Verb", "Nomen", "Adjektiv"]
                answer: "Verb"
              - id: l2-n4
                type: true_false
                text: "Ist regnen ein Verb?"
                say: "Lies das Wort auf der Karte. Ist es ein Verb?"
                show: { drawn: letter-card, text: "regnen" }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welches Wort ist kein Verb?"
                say: "Lies die drei Wörter. Welches ist kein Verb?"
                options: ["sitzen", "bequem", "stehen"]
                answer: "bequem"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Lea füttert die Hühner." }
            spans: ["füttert"]
          - id: l2-c2
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Nachts leuchten die Sterne." }
            spans: ["leuchten"]
          - id: l2-c3
            type: sorting
            text: "Verb oder Adjektiv?"
            say: "Lies die Wörter. Sortiere sie."
            option_audio: false
            bins:
              - { id: verb, show: { text: "Verb: ich …" }, say: "Verb" }
              - { id: adj, show: { text: "Adjektiv: wie?" }, say: "Adjektiv" }
            options:
              - { text: "pflücken", bin: verb }
              - { text: "rund", bin: adj }
              - { text: "glauben", bin: verb }
              - { text: "spitz", bin: adj }
          - id: l2-c4
            type: multiple_choice
            text: "Welche Wortart ist lustig?"
            say: "Lies das Wort auf der Karte. Welche Wortart ist es?"
            show: { drawn: letter-card, text: "lustig" }
            options: ["Verb", "Nomen", "Adjektiv"]
            answer: "Adjektiv"
          - id: l2-c5
            type: multiple_choice
            text: "Welches Wort ist ein Verb?"
            say: "Lies die drei Wörter. Welches ist ein Verb?"
            options: ["Blume", "wachsen", "gelb"]
            answer: "wachsen"
