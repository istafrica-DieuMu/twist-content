# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.verbs-present
skill: lit-de.verbs.present
curriculum: de-DE
language: de
title:
  de: Die Gegenwart
  en: The present tense
summary: >
  The Präsens says what happens now or always. Lesson 1 recalls the
  endings (ich spiele, du spielst, er spielt) and names the Präsens;
  lesson 2 adds starke Verben whose vowel changes with du and er, sie, es
  (geben: du gibst, er gibt; fahren: du fährst, sie fährt; laufen: du
  läufst), while ich and wir keep the vowel, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Zeitformen, en: Tenses }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.verbs.conjugate]
  also_practises: [lit-de.verbs.base-form]
  vocabulary: { de: [Präsens, Gegenwart, Grundform, Personalform, Endung, Selbstlaut] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: change-for-every-person
      what: Changes the vowel for every person (ich gib, wir fähren)
      addressed: lesson 2 Learn shows the change only with du and er, sie, es; feedback on "ich gib" and "wir fahren" tasks says ich and wir keep the vowel
    - id: no-change
      what: Keeps the vowel of the Grundform for du and er (du gebst, er fahrt)
      addressed: lesson 2 practise asks for du and er forms of geben, fahren, laufen, sehen, lesen; feedback names the changed vowel
    - id: present-only-now
      what: Thinks the Präsens can only mean right now
      addressed: lesson 1 Learn shows the Präsens for things that are always so (Die Sonne geht im Osten auf.)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Was jetzt passiert, en: What happens now }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort ist das Verb? \"Lena malt ein Bild.\""
            say: "Welches Wort in dem Satz ist das Verb?"
            options: ["Lena", "malt", "Bild"]
            answer: "malt"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Die Grundform von \"sie singt\""
            say: "Wie heißt die Grundform von sie singt?"
            options: ["singen", "singt", "gesungen"]
            answer: "singen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ich spiele. Du spielst. Er spielt."
            say: "Das Verb ändert seine Endung, je nachdem, wer etwas tut. Ich spiele, du spielst, er spielt, wir spielen."
          - text: "Präsens = Gegenwart"
            say: "Diese Zeitform heißt Präsens oder Gegenwart. Sie sagt, was jetzt gerade passiert."
          - text: "Die Sonne geht im Osten auf."
            say: "Das Präsens sagt auch, was immer so ist. Die Sonne geht jeden Morgen im Osten auf."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Setz die passende Endung von malen ein: Du mal... ein Bild."
                frame: "Du mal_ ein Bild."
                options: ["e", "st", "t", "en"]
                answer: ["st"]
                feedback:
                  "t": "Die Endung t gehört zu er, sie, es. Bei du heißt sie st."
                hints:
                  - "Wer malt? Du."
                  - "Bei du endet das Verb auf st."
                  - "Du malst ein Bild."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Setz die passende Endung von bauen ein: Wir bau... eine Burg."
                frame: "Wir bau_ eine Burg."
                options: ["e", "st", "t", "en"]
                answer: ["en"]
                hints:
                  - "Wer baut? Wir."
                  - "Bei wir sieht das Verb aus wie die Grundform."
                  - "Wir bauen eine Burg."
              - id: l1-f3
                type: multiple_choice
                text: "Welcher Satz steht im Präsens?"
                say: "Welcher Satz sagt, was jetzt gerade passiert?"
                options: ["Mia trinkt Saft.", "Mia trank Saft.", "Mia hat Saft getrunken."]
                answer: "Mia trinkt Saft."
                option_audio: false
                hints:
                  - "Das Präsens sagt, was jetzt passiert."
                  - "Trank und hat getrunken sind schon vorbei."
                  - "Mia trinkt Saft."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? \"Im Winter schneit es oft.\" steht im Präsens."
                say: "Im Winter schneit es oft. Steht dieser Satz im Präsens?"
                answer: true
                hints:
                  - "Der Satz sagt, was immer wieder so ist."
                  - "Schneit ist eine Form von jetzt, nicht von früher."
                  - "Ja, das ist das Präsens."
              - id: l1-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Person mit der passenden Form von hören."
                option_audio: false
                pairs:
                  - { left: { text: "ich" }, right: { text: "höre" } }
                  - { left: { text: "du" }, right: { text: "hörst" } }
                  - { left: { text: "sie" }, right: { text: "hört" } }
                  - { left: { text: "wir" }, right: { text: "hören" } }
                hints:
                  - "Ich endet auf e, du auf st."
                  - "Sie endet auf t, wir auf en."
                  - "ich höre, du hörst, sie hört, wir hören."
              - id: l1-f6
                type: highlight_in_text
                text: "Tippe auf das Verb im Präsens."
                say: "Tippe auf das Verb, das im Präsens steht."
                show: { drawn: letter-card, text: "Jeden Tag füttert Tom die Hühner" }
                spans: ["füttert"]
                hints:
                  - "Was tut Tom jeden Tag?"
                  - "Er füttert."
                  - "füttert."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Setz die passende Endung von kochen ein: Papa koch... Suppe."
                frame: "Papa koch_ Suppe."
                options: ["e", "st", "t", "en"]
                answer: ["t"]
                hints: ["Papa ist er."]
              - id: l1-s2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Setz die passende Endung von tanzen ein: Ich tanz... gern."
                frame: "Ich tanz_ gern."
                options: ["e", "st", "t", "en"]
                answer: ["e"]
                hints: ["Welche Endung gehört zu ich?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welcher Satz steht im Präsens?"
                say: "Welcher Satz sagt, was jetzt gerade passiert?"
                options: ["Der Hund bellte laut.", "Der Hund bellt laut.", "Der Hund hat laut gebellt."]
                answer: "Der Hund bellt laut."
                option_audio: false
                hints: ["Welcher Satz erzählt nicht von früher?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? \"Gestern regnete es.\" steht im Präsens."
                say: "Gestern regnete es. Steht dieser Satz im Präsens?"
                answer: false
                hints: ["Ist das jetzt oder schon vorbei?"]
              - id: l1-s5
                type: highlight_in_text
                text: "Tippe auf das Verb im Präsens."
                say: "Tippe auf das Verb, das im Präsens steht."
                show: { drawn: letter-card, text: "Die Kinder lachen über den Clown" }
                spans: ["lachen"]
                hints: ["Was tun die Kinder?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Setz die passende Endung von schwimmen ein: Ihr schwimm... im See."
                frame: "Ihr schwimm_ im See."
                options: ["e", "st", "t", "en"]
                answer: ["t"]
              - id: l1-n2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Setz die passende Endung von rechnen ein: Du rechn... schnell."
                frame: "Du rechne_ schnell."
                options: ["e", "st", "t", "n"]
                answer: ["st"]
              - id: l1-n3
                type: multiple_choice
                text: "Welcher Satz steht im Präsens?"
                say: "Welcher Satz sagt, was jetzt gerade passiert?"
                options: ["Opa liest die Zeitung.", "Opa las die Zeitung.", "Opa hat die Zeitung gelesen."]
                answer: "Opa liest die Zeitung."
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Stimmt das? \"Bienen sammeln Nektar.\" steht im Präsens."
                say: "Bienen sammeln Nektar. Steht dieser Satz im Präsens?"
                answer: true
              - id: l1-n5
                type: highlight_in_text
                text: "Tippe auf das Verb im Präsens."
                say: "Tippe auf das Verb, das im Präsens steht."
                show: { drawn: letter-card, text: "Im Herbst fallen die Blätter" }
                spans: ["fallen"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Setz die passende Endung von holen ein: Sie hol... die Post."
            frame: "Sie hol_ die Post."
            options: ["e", "st", "t", "en"]
            answer: ["t"]
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Satz steht im Präsens?"
            say: "Welcher Satz sagt, was jetzt gerade passiert?"
            options: ["Wir spielten Fußball.", "Wir spielen Fußball.", "Wir haben Fußball gespielt."]
            answer: "Wir spielen Fußball."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Stimmt das? \"Ich wohne in Köln.\" steht im Präsens."
            say: "Ich wohne in Köln. Steht dieser Satz im Präsens?"
            answer: true

  - n: 2
    title: { de: Verben mit neuem Selbstlaut, en: Verbs that change their vowel }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Setz die passende Endung von lernen ein: Du lern... Englisch."
            frame: "Du lern_ Englisch."
            options: ["e", "st", "t", "en"]
            answer: ["st"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? \"Der Zug fährt um acht.\" steht im Präsens."
            say: "Der Zug fährt um acht. Steht dieser Satz im Präsens?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "geben: ich gebe, du gibst, er gibt"
            say: "Manche Verben ändern ihren Selbstlaut. Bei geben wird aus e ein i, aber nur bei du und bei er, sie, es."
          - text: "fahren: ich fahre, du fährst, sie fährt"
            say: "Bei fahren wird aus a ein ä. Bei laufen wird aus au ein äu: du läufst, er läuft."
          - text: "ich gebe · wir geben · ihr gebt"
            say: "Bei ich, wir, ihr und sie, die vielen, bleibt der Selbstlaut wie in der Grundform. Hör genau hin, ob du zu jemandem sprichst oder über eine Person."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Du _ mir den Stift."
                say: "Welche Form von geben passt? Du ... mir den Stift."
                options: ["gibst", "gebst", "gibt"]
                answer: "gibst"
                feedback:
                  "gebst": "Bei du ändert geben den Selbstlaut: aus e wird i."
                  "gibt": "Gibt gehört zu er, sie, es. Bei du endet das Verb auf st."
                hints:
                  - "Geben ändert bei du den Selbstlaut."
                  - "Aus e wird i, und du braucht st."
                  - "Du gibst mir den Stift."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Lisa _ mit dem Rad."
                say: "Welche Form von fahren passt? Lisa ... mit dem Rad."
                options: ["fahrt", "fährt", "fährst"]
                answer: "fährt"
                feedback:
                  "fahrt": "Fahrt gehört zu ihr. Bei sie, Lisa, wird aus a ein ä."
                hints:
                  - "Lisa ist sie."
                  - "Bei sie wird aus a ein ä."
                  - "Lisa fährt mit dem Rad."
              - id: l2-f3
                type: multiple_choice
                text: "Ich _ dir ein Geschenk."
                say: "Welche Form von geben passt? Ich ... dir ein Geschenk."
                options: ["gibe", "gebe", "gibst"]
                answer: "gebe"
                feedback:
                  "gibe": "Bei ich bleibt der Selbstlaut wie in der Grundform geben."
                hints:
                  - "Wer gibt? Ich."
                  - "Bei ich ändert sich der Selbstlaut nicht."
                  - "Ich gebe dir ein Geschenk."
              - id: l2-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Person mit der passenden Form von laufen."
                option_audio: false
                pairs:
                  - { left: { text: "ich" }, right: { text: "laufe" } }
                  - { left: { text: "du" }, right: { text: "läufst" } }
                  - { left: { text: "er" }, right: { text: "läuft" } }
                  - { left: { text: "wir" }, right: { text: "laufen" } }
                hints:
                  - "Nur du und er bekommen äu."
                  - "Ich und wir behalten au."
                  - "ich laufe, du läufst, er läuft, wir laufen."
              - id: l2-f5
                type: fill_in_blank
                text: "Ergänze den Selbstlaut."
                say: "Setz den passenden Selbstlaut von sehen ein: Er s...ht einen Vogel."
                frame: "Er s_ht einen Vogel."
                options: ["e", "ie", "i"]
                answer: ["ie"]
                hints:
                  - "Sehen ändert bei er den Selbstlaut."
                  - "Aus e wird hier ie."
                  - "Er sieht einen Vogel."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? \"Wir fähren ans Meer.\""
                say: "Wir fähren ans Meer. Ist das Verb richtig?"
                answer: false
                feedback:
                  "true": "Bei wir bleibt der Selbstlaut wie in der Grundform: wir fahren."
                hints:
                  - "Ändert sich der Selbstlaut auch bei wir?"
                  - "Nein, nur bei du und er, sie, es."
                  - "Nein. Richtig ist: Wir fahren ans Meer."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Du _ ein Buch."
                say: "Welche Form von lesen passt? Du ... ein Buch."
                options: ["lest", "liest", "lesst"]
                answer: "liest"
                hints: ["Ändert lesen bei du den Selbstlaut?"]
              - id: l2-s2
                type: multiple_choice
                text: "Der Hund _ über die Wiese."
                say: "Welche Form von laufen passt? Der Hund ... über die Wiese."
                options: ["lauft", "läuft", "läufst"]
                answer: "läuft"
                hints: ["Der Hund ist er."]
              - id: l2-s3
                type: multiple_choice
                text: "Wir _ heute Fahrrad."
                say: "Welche Form von fahren passt? Wir ... heute Fahrrad."
                options: ["fahren", "fähren", "fahrt"]
                answer: "fahren"
                hints: ["Was passiert bei wir mit dem Selbstlaut?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Ergänze den Selbstlaut."
                say: "Setz den passenden Selbstlaut von helfen ein: Du h...lfst mir."
                frame: "Du h_lfst mir."
                options: ["e", "i", "ie"]
                answer: ["i"]
                hints: ["Helfen ändert sich wie geben."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? \"Sie schläft im Zelt.\""
                say: "Sie schläft im Zelt. Ist das Verb richtig?"
                answer: true
                hints: ["Was passiert mit dem a bei sie?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mama _ die Blumen."
                say: "Welche Form von gießen passt? Mama ... die Blumen."
                options: ["gießt", "gießst", "gieße"]
                answer: "gießt"
              - id: l2-n2
                type: multiple_choice
                text: "Du _ sehr leise."
                say: "Welche Form von sprechen passt? Du ... sehr leise."
                options: ["sprechst", "sprichst", "spricht"]
                answer: "sprichst"
              - id: l2-n3
                type: multiple_choice
                text: "Ich _ den Ball weit."
                say: "Welche Form von werfen passt? Ich ... den Ball weit."
                options: ["werfe", "wirfe", "wirfst"]
                answer: "werfe"
              - id: l2-n4
                type: fill_in_blank
                text: "Ergänze den Selbstlaut."
                say: "Setz den passenden Selbstlaut von tragen ein: Er tr...gt die Tasche."
                frame: "Er tr_gt die Tasche."
                options: ["a", "ä", "e"]
                answer: ["ä"]
              - id: l2-n5
                type: true_false
                text: "Stimmt das? \"Du esst zu schnell.\""
                say: "Du esst zu schnell. Ist das Verb richtig?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Paul _ einen Brief."
            say: "Welche Form passt in den Satz? Paul ... einen Brief."
            options: ["nimmt", "nehmt", "nimmst"]
            answer: "nimmt"
          - id: l2-c2
            type: multiple_choice
            text: "Ihr _ ein Lied."
            say: "Welche Form passt in den Satz? Ihr ... ein Lied."
            options: ["singt", "singst", "singen"]
            answer: "singt"
          - id: l2-c3
            type: fill_in_blank
            text: "Ergänze den Selbstlaut."
            say: "Setz den passenden Selbstlaut ein: Du f...ngst den Ball."
            frame: "Du f_ngst den Ball."
            options: ["a", "ä", "e"]
            answer: ["ä"]
          - id: l2-c4
            type: true_false
            text: "Stimmt das? \"Ich gib dir die Hand.\""
            say: "Ich gib dir die Hand. Ist das Verb richtig?"
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Welcher Satz steht im Präsens?"
            say: "In welchem Satz steht das Verb im Präsens?"
            options: ["Die Katze frisst ihr Futter.", "Die Katze fraß ihr Futter.", "Die Katze hat ihr Futter gefressen."]
            answer: "Die Katze frisst ihr Futter."
            option_audio: false
