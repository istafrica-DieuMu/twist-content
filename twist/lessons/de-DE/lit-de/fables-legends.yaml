# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.fables-legends
skill: lit-de.texts-media.fables-legends
curriculum: de-DE
language: de
title:
  de: Fabeln und Sagen
  en: Fables and legends
summary: >
  Fables, legends and how they differ from fairy tales. Lesson 1 reads
  short fables in which animals talk and act like people, names the
  animals' typical traits and finds the moral; lesson 2 reads legends tied
  to real places (Hameln, the Loreley, the Mäuseturm in Bingen), says what
  a legend explains, sorts fairy tale, fable and legend, and ends with the
  skill check. Every fable is written for Twist in the classic style; the
  well-known legends are retold in our own words.
metadata:
  year: klasse-4
  topic: { de: "Märchen, Fabeln, Sagen", en: "Fairy tales, fables, legends" }
  ages: [8-10]
  lesson_minutes: 15
  builds_on: [lit-de.texts-media.fairy-tales, lit-de.comprehension.infer]
  also_practises: [lit-de.texts-media.fairy-tales, lit-de.comprehension.infer]
  vocabulary: { de: [Fabel, Lehre, Eigenschaft, Sage, Märchen, wahrer Kern, listig, eitel, fleißig] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: moral-is-plot
      what: Gives something that happens in the fable as its moral
      addressed: lesson 1 Learn sets the plot apart from the moral; every moral task offers a plot sentence, with feedback in l1-f1
    - id: legend-is-fairy-tale
      what: Treats every old story with wonders as a fairy tale, missing the real place of a legend
      addressed: lesson 2 Learn names the real place as the mark of a legend; every stage of lesson 2 asks how you can tell it is a legend and sorts Märchen, Fabel and Sage, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Tiere, die wie Menschen handeln", en: "Animals that act like people" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie beginnen viele Märchen?"
            options: ["Es war einmal ...", "Liebe Oma, ...", "Heute in den Nachrichten ..."]
            answer: "Es war einmal ..."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was kommt in Märchen oft vor?"
            options: ["Zauberei", "Busfahrpläne", "Fußballergebnisse"]
            answer: "Zauberei"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Pfau und der Spatz\n\nEin Pfau stolzierte über die Wiese. „Sieh nur, Spatz“, rief er, „wie prächtig meine Federn sind! Du bist dagegen grau und klein.“\nDa schlich ein Fuchs heran. Flink flog der Spatz auf einen hohen Ast. Der Pfau aber kam mit seinem schweren Schwanz kaum vom Boden hoch und entkam dem Fuchs nur knapp."
            say: "Das ist eine Fabel. In Fabeln sprechen und handeln Tiere wie Menschen. Fabeln sind kurz, und am Ende kann man etwas daraus lernen."
          - text: "Pfau: eitel, gibt an\nSpatz: klein, aber flink"
            say: "Die Tiere in Fabeln haben typische Eigenschaften. Der Pfau ist eitel und gibt an. Der Spatz ist klein, aber flink."
          - text: "Was passiert: Der Pfau entkommt nur knapp.\nLehre: Prächtig auszusehen nützt nicht immer etwas."
            say: "Was passiert, ist die Handlung. Die Lehre sagt, was wir Menschen daraus lernen können. Frag dich: Was soll ich mir merken?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Der Rabe und die zwei Nüsse\n\nEin Rabe hatte eine Nuss im Schnabel und flog über einen Fluss. Am Ufer sah er eine zweite Nuss. „Die will ich auch!“, dachte er und öffnete den Schnabel. Da fiel seine Nuss ins Wasser, und ein Eichhörnchen schnappte sich die andere. Nun hatte der Rabe gar nichts.\n\nWas ist die Lehre der Fabel?"
                say: "Lies die Fabel. Was ist ihre Lehre?"
                options: ["Wer zu viel will, bekommt am Ende nichts.", "Der Rabe flog über einen Fluss.", "Raben fressen gern Nüsse."]
                answer: "Wer zu viel will, bekommt am Ende nichts."
                feedback:
                  "Der Rabe flog über einen Fluss.": "Das passiert in der Fabel. Die Lehre sagt, was wir daraus lernen können."
                hints:
                  - "Die Lehre passt nicht nur zum Raben, sondern auch zu uns Menschen."
                  - "Warum hat der Rabe am Ende nichts?"
                  - "Er wollte beide Nüsse. Wer zu viel will, bekommt am Ende nichts."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "„Es war einmal eine Prinzessin, die lebte in einem Schloss. Eines Tages verzauberte eine böse Fee sie in einen Schwan.“\n\nIst das der Anfang einer Fabel?"
                say: "Lies den Anfang. Ist das der Anfang einer Fabel?"
                answer: false
                hints:
                  - "Wer handelt in einer Fabel?"
                  - "Es war einmal, eine Prinzessin, eine Fee: Woran erinnert dich das?"
                  - "Nein, das ist der Anfang eines Märchens."
              - id: l1-f3
                type: multiple_choice
                text: "Das Eichhörnchen und der Maulwurf\n\nEin Eichhörnchen lachte über den Maulwurf: „Du wühlst den ganzen Tag im Dunkeln. Wie langweilig!“ In der Nacht kam ein Sturm, und der Baum des Eichhörnchens brach ab. Zitternd suchte es Schutz und fand ihn im Gang des Maulwurfs. „Komm nur herein“, sagte der Maulwurf freundlich.\n\nWelche Eigenschaft hat der Maulwurf?"
                say: "Lies die Fabel. Welche Eigenschaft hat der Maulwurf?"
                options: ["hilfsbereit", "eitel", "faul"]
                answer: "hilfsbereit"
                hints:
                  - "Was tut der Maulwurf, als das Eichhörnchen kommt?"
                  - "Er lässt es herein, obwohl es über ihn gelacht hat."
                  - "Der Maulwurf ist hilfsbereit."
              - id: l1-f4
                type: matching
                text: "Welche Eigenschaft hat das Tier in vielen Fabeln?"
                say: "Verbinde jedes Tier mit der Eigenschaft, die es in vielen Fabeln hat."
                pairs:
                  - { left: { text: "Fuchs" }, right: { text: "listig" } }
                  - { left: { text: "Löwe" }, right: { text: "mächtig" } }
                  - { left: { text: "Ameise" }, right: { text: "fleißig" } }
                  - { left: { text: "Lamm" }, right: { text: "sanft" } }
                hints:
                  - "Denk an Fabeln, die du kennst."
                  - "Der Löwe ist der König der Tiere. Die Ameise arbeitet ohne Pause."
                  - "Fuchs listig, Löwe mächtig, Ameise fleißig, Lamm sanft."
              - id: l1-f5
                type: multiple_choice
                text: "Das Eichhörnchen und der Maulwurf\n\nEin Eichhörnchen lachte über den Maulwurf: „Du wühlst den ganzen Tag im Dunkeln. Wie langweilig!“ In der Nacht kam ein Sturm, und der Baum des Eichhörnchens brach ab. Zitternd suchte es Schutz und fand ihn im Gang des Maulwurfs. „Komm nur herein“, sagte der Maulwurf freundlich.\n\nWas ist die Lehre der Fabel?"
                say: "Lies die Fabel. Was ist ihre Lehre?"
                options: ["Mach dich nicht über andere lustig, vielleicht brauchst du sie einmal.", "Im Sturm brechen Bäume ab.", "Maulwürfe leben unter der Erde."]
                answer: "Mach dich nicht über andere lustig, vielleicht brauchst du sie einmal."
                hints:
                  - "Was hat das Eichhörnchen am Anfang falsch gemacht?"
                  - "Später braucht es genau den, über den es gelacht hat."
                  - "Mach dich nicht über andere lustig, vielleicht brauchst du sie einmal."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Der Hahn, der die Sonne weckte\n\nJeden Morgen krähte der Hahn, und jeden Morgen ging die Sonne auf. „Ohne mich bliebe es dunkel“, prahlte er vor den Hühnern. Eines Morgens verschlief er. Als er die Augen öffnete, stand die Sonne schon hoch am Himmel.\n\nWas ist die Lehre der Fabel?"
                say: "Lies die Fabel. Was ist ihre Lehre?"
                options: ["Nimm dich selbst nicht zu wichtig.", "Der Hahn verschlief eines Morgens.", "Hähne krähen am Morgen."]
                answer: "Nimm dich selbst nicht zu wichtig."
                hints: ["Was hat der Hahn über sich selbst gedacht, und stimmte das?"]
              - id: l1-s2
                type: sorting
                text: "Passt das zu einer Fabel?"
                say: "Sortiere: Passt das zu einer Fabel oder nicht?"
                bins:
                  - { id: yes, show: { text: "passt zur Fabel" }, say: "passt zur Fabel" }
                  - { id: no, show: { text: "passt nicht" }, say: "passt nicht" }
                options:
                  - { text: "Tiere sprechen wie Menschen.", bin: yes }
                  - { text: "Am Ende steht eine Lehre.", bin: yes }
                  - { text: "Eine gute Fee hilft.", bin: no }
                  - { text: "Ein Zauberer verwandelt einen Prinzen.", bin: no }
                hints: ["Fee und Zauberer gehören in eine andere Textsorte."]
              - id: l1-s3
                type: true_false
                text: "Die Elster und der Biber\n\nDie Elster wollte vom Biber lernen, wie man einen Damm baut. Doch bei jedem Ast, den der Biber ihr zeigte, rief sie: „Das weiß ich schon!“ Nach dem dritten Ast flog sie davon und baute ihren eigenen Damm. Beim ersten Regen schwamm er fort.\n\nPasst die Lehre „Wer nicht zuhört, kann nichts lernen“ zu dieser Fabel?"
                say: "Lies die Fabel. Passt die Lehre: Wer nicht zuhört, kann nichts lernen?"
                answer: true
                hints: ["Warum hält der Damm der Elster nicht?"]
              - id: l1-s4
                type: multiple_choice
                text: "Der Hahn, der die Sonne weckte\n\nJeden Morgen krähte der Hahn, und jeden Morgen ging die Sonne auf. „Ohne mich bliebe es dunkel“, prahlte er vor den Hühnern. Eines Morgens verschlief er. Als er die Augen öffnete, stand die Sonne schon hoch am Himmel.\n\nWelche Eigenschaft hat der Hahn?"
                say: "Lies die Fabel. Welche Eigenschaft hat der Hahn?"
                options: ["eingebildet", "hilfsbereit", "ängstlich"]
                answer: "eingebildet"
                hints: ["Was prahlt er vor den Hühnern?"]
              - id: l1-s5
                type: ordering
                text: "Bring die Fabel vom Raben und den zwei Nüssen in die richtige Reihenfolge."
                say: "Bring die Fabel vom Raben und den zwei Nüssen in die richtige Reihenfolge."
                options: ["Er öffnet den Schnabel.", "Der Rabe fliegt mit einer Nuss über den Fluss.", "Am Ende hat er nichts.", "Er sieht eine zweite Nuss."]
                slot_count: 4
                answer: ["Der Rabe fliegt mit einer Nuss über den Fluss.", "Er sieht eine zweite Nuss.", "Er öffnet den Schnabel.", "Am Ende hat er nichts."]
                hints: ["Warum öffnet der Rabe den Schnabel?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Der Fuchs und die Ente\n\nEin Fuchs stand am Ufer eines Teiches. „Liebe Ente“, rief er, „du hast die schönsten Federn der Welt. Komm doch näher, damit ich sie bewundern kann!“ Die Ente blieb in der Mitte des Teiches. „Bewundern kannst du sie auch von dort“, antwortete sie.\n\nWas ist die Lehre der Fabel?"
                say: "Lies die Fabel. Was ist ihre Lehre?"
                options: ["Wer dir schmeichelt, will oft etwas von dir.", "Die Ente schwimmt in der Mitte des Teiches.", "Enten haben schöne Federn."]
                answer: "Wer dir schmeichelt, will oft etwas von dir."
              - id: l1-n2
                type: true_false
                text: "„Die Katze sagte zur Maus: ‚Komm heraus, lass uns Freunde sein.‘ Doch die Maus blieb in ihrem Loch. Wer klug ist, traut nicht jedem.“\n\nIst das eine Fabel?"
                say: "Lies den Text. Ist das eine Fabel?"
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Die Gans und die Körner\n\nEine Gans fand einen großen Haufen Körner. Sie jagte alle anderen Vögel fort und fraß, bis sie kaum noch laufen konnte. Da kam der Fuchs. Die anderen Vögel flogen schnell davon. Die dicke Gans aber watschelte so langsam, dass der Fuchs sie beinahe erwischt hätte.\n\nWas ist die Lehre der Fabel?"
                say: "Lies die Fabel. Was ist ihre Lehre?"
                options: ["Wer gierig ist, schadet sich selbst.", "Die Gans fand einen Haufen Körner.", "Gänse watscheln langsam."]
                answer: "Wer gierig ist, schadet sich selbst."
              - id: l1-n4
                type: matching
                text: "Welche Eigenschaft hat das Tier in vielen Fabeln?"
                say: "Verbinde jedes Tier mit der Eigenschaft, die es in vielen Fabeln hat."
                pairs:
                  - { left: { text: "Eule" }, right: { text: "weise" } }
                  - { left: { text: "Wolf" }, right: { text: "gierig" } }
                  - { left: { text: "Pfau" }, right: { text: "eitel" } }
                  - { left: { text: "Hase" }, right: { text: "ängstlich" } }
              - id: l1-n5
                type: sorting
                text: "Passt das zu einer Fabel?"
                say: "Sortiere: Passt das zu einer Fabel oder nicht?"
                bins:
                  - { id: yes, show: { text: "passt zur Fabel" }, say: "passt zur Fabel" }
                  - { id: no, show: { text: "passt nicht" }, say: "passt nicht" }
                options:
                  - { text: "Die Geschichte ist kurz.", bin: yes }
                  - { text: "Tiere haben menschliche Eigenschaften.", bin: yes }
                  - { text: "Ein Drache bewacht einen Schatz im Schloss.", bin: no }
                  - { text: "Eine Hexe kocht einen Zaubertrank.", bin: no }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Die Biene und die Fliege\n\nDie Fliege sagte zur Biene: „Warum arbeitest du so viel? Ich setze mich einfach auf den Tisch der Menschen und esse mit.“ Am nächsten Tag schlug ein Mann mit der Zeitung nach der Fliege. Die Biene aber begrüßte der Gärtner freundlich, denn sie half seinen Blumen.\n\nWas ist die Lehre der Fabel?"
            say: "Lies die Fabel. Was ist ihre Lehre?"
            options: ["Wer anderen nützt, ist überall gern gesehen.", "Ein Mann schlug mit der Zeitung.", "Bienen fliegen zu Blumen."]
            answer: "Wer anderen nützt, ist überall gern gesehen."
          - id: l1-c2
            type: true_false
            text: "Stimmt das? In Fabeln sprechen und handeln Tiere wie Menschen."
            say: "Stimmt das? In Fabeln sprechen und handeln Tiere wie Menschen."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Die Biene und die Fliege\n\nDie Fliege sagte zur Biene: „Warum arbeitest du so viel? Ich setze mich einfach auf den Tisch der Menschen und esse mit.“ Am nächsten Tag schlug ein Mann mit der Zeitung nach der Fliege. Die Biene aber begrüßte der Gärtner freundlich, denn sie half seinen Blumen.\n\nWelche Eigenschaft hat die Biene?"
            say: "Lies die Fabel. Welche Eigenschaft hat die Biene?"
            options: ["fleißig", "faul", "eitel"]
            answer: "fleißig"

  - n: 2
    title: { de: "Sagen und echte Orte", en: "Legends and real places" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was steht am Ende vieler Fabeln?"
            options: ["eine Lehre", "ein Rezept", "ein Rätsel"]
            answer: "eine Lehre"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Eigenschaft hat der Fuchs in vielen Fabeln?"
            options: ["listig", "ängstlich", "fleißig"]
            answer: "listig"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Die Loreley\n\nAm Rhein ragt ein hoher Felsen über den Fluss, die Loreley. Die Sage erzählt, dass dort oben eine schöne Frau saß und ihr goldenes Haar kämmte. Die Schiffer schauten zu ihr hinauf, vergaßen ihr Steuer und fuhren gegen die Felsen."
            say: "Das ist eine Sage. Eine Sage spielt an einem Ort, den es wirklich gibt, hier am Rhein. Den Felsen kannst du heute noch besuchen."
          - text: "Sage: echter Ort · oft eine Jahreszahl · etwas Wunderbares oder Unheimliches · erklärt etwas"
            say: "Früher haben die Menschen Sagen erzählt, als wäre alles wirklich so passiert. Oft steckt ein wahrer Kern darin: Am Felsen der Loreley ist der Rhein wirklich eng und gefährlich."
          - text: "Märchen: Es war einmal, irgendwo, Zauberei\nFabel: Tiere, kurz, Lehre\nSage: echter Ort, wahrer Kern"
            say: "So unterscheidest du die drei. Ein Märchen spielt irgendwo, eine Fabel will eine Lehre zeigen, eine Sage hängt an einem echten Ort."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Der Rattenfänger von Hameln\n\nIm Jahr 1284 kam ein Mann in bunten Kleidern in die Stadt Hameln. Er versprach, die Stadt von den Ratten zu befreien. Mit seiner Flöte lockte er alle Ratten in den Fluss Weser. Doch die Bürger wollten ihn danach nicht bezahlen.\n\nWoran erkennst du, dass das eine Sage ist?"
                say: "Lies den Text. Woran erkennst du, dass das eine Sage ist?"
                options: ["Sie spielt in einer echten Stadt, in Hameln.", "Tiere sprechen wie Menschen.", "Sie beginnt mit Es war einmal."]
                answer: "Sie spielt in einer echten Stadt, in Hameln."
                feedback:
                  "Sie beginnt mit Es war einmal.": "Lies den Anfang noch einmal. Die Geschichte beginnt mit einer Jahreszahl, nicht mit Es war einmal."
                  "Tiere sprechen wie Menschen.": "Die Ratten sprechen hier nicht. Achte auf den Ort."
                hints:
                  - "Gibt es den Ort, an dem die Geschichte spielt, wirklich?"
                  - "Hameln und die Weser findest du auf der Landkarte."
                  - "Sie spielt in einer echten Stadt."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Märchen, Fabel oder Sage?"
                say: "Sortiere: Passt das zu einem Märchen, einer Fabel oder einer Sage?"
                bins:
                  - { id: tale, show: { text: "Märchen" }, say: "Märchen" }
                  - { id: fable, show: { text: "Fabel" }, say: "Fabel" }
                  - { id: legend, show: { text: "Sage" }, say: "Sage" }
                options:
                  - { text: "Es war einmal ein König.", bin: tale }
                  - { text: "Eine Fee erfüllt drei Wünsche.", bin: tale }
                  - { text: "Der Fuchs sagte zum Raben ...", bin: fable }
                  - { text: "Am Ende steht eine Lehre.", bin: fable }
                  - { text: "Im Jahr 1284 kam ein Mann nach Hameln.", bin: legend }
                  - { text: "Noch heute heißt der Felsen Riesenstein.", bin: legend }
                hints:
                  - "Achte auf Zauberei, auf sprechende Tiere und auf echte Orte."
                  - "Jahreszahlen und Ortsnamen gehören zur Sage."
                  - "König und Fee: Märchen. Fuchs und Lehre: Fabel. Hameln und Riesenstein: Sage."
              - id: l2-f3
                type: true_false
                text: "Der Riesenstein\n\nAm Rand eines Dorfes im Schwarzwald liegt ein riesiger Felsen. Die Leute erzählen, dass vor vielen hundert Jahren ein Riese ihn auf die Kirche werfen wollte. Doch der Hahn krähte, der Riese erschrak, und der Stein fiel auf den Acker. Noch heute nennt man ihn den Riesenstein.\n\nIst das eine Sage?"
                say: "Lies den Text. Ist das eine Sage?"
                answer: true
                hints:
                  - "Spielt die Geschichte an einem echten Ort?"
                  - "Den Felsen gibt es heute noch, und die Geschichte erklärt seinen Namen."
                  - "Ja, das ist eine Sage."
              - id: l2-f4
                type: multiple_choice
                text: "Der Riesenstein\n\nAm Rand eines Dorfes im Schwarzwald liegt ein riesiger Felsen. Die Leute erzählen, dass vor vielen hundert Jahren ein Riese ihn auf die Kirche werfen wollte. Doch der Hahn krähte, der Riese erschrak, und der Stein fiel auf den Acker. Noch heute nennt man ihn den Riesenstein.\n\nWas erklärt diese Sage?"
                say: "Lies den Text. Was erklärt diese Sage?"
                options: ["warum der Felsen Riesenstein heißt", "wie man einen Riesen besiegt", "warum Hähne krähen"]
                answer: "warum der Felsen Riesenstein heißt"
                hints:
                  - "Lies den letzten Satz."
                  - "Was gibt es heute noch?"
                  - "Sie erklärt den Namen des Felsens."
              - id: l2-f5
                type: multiple_choice
                text: "„Es war einmal ein armer Müllerssohn. Eines Tages traf er im Wald eine kleine graue Frau. Sie schenkte ihm einen Stock, der jede Tür öffnen konnte.“\n\nWelche Textsorte ist das?"
                say: "Lies den Text. Welche Textsorte ist das?"
                options: ["Märchen", "Fabel", "Sage"]
                answer: "Märchen"
                keep_order: true
                hints:
                  - "Wie beginnt der Text?"
                  - "Ein Zauberstock, irgendwo in einem Wald."
                  - "Das ist ein Märchen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Die weiße Frau\n\nAuf einer alten Burg am Rhein soll in Vollmondnächten eine weiße Frau durch die Gänge gehen. Die Leute sagen, sie suche bis heute nach ihrem Ring, den sie vor vielen hundert Jahren verloren hat.\n\nWoran erkennst du, dass das eine Sage ist?"
                say: "Lies den Text. Woran erkennst du, dass das eine Sage ist?"
                options: ["Sie spielt an einem echten Ort, am Rhein.", "Am Ende steht eine Lehre.", "Ein Tier spricht."]
                answer: "Sie spielt an einem echten Ort, am Rhein."
                hints: ["Achte auf den Ort."]
              - id: l2-s2
                type: sorting
                text: "Märchen, Fabel oder Sage?"
                say: "Sortiere: Passt das zu einem Märchen, einer Fabel oder einer Sage?"
                bins:
                  - { id: tale, show: { text: "Märchen" }, say: "Märchen" }
                  - { id: fable, show: { text: "Fabel" }, say: "Fabel" }
                  - { id: legend, show: { text: "Sage" }, say: "Sage" }
                options:
                  - { text: "Eine Hexe wohnt in einem Haus aus Lebkuchen.", bin: tale }
                  - { text: "Die Ameise sprach zur Grille ...", bin: fable }
                  - { text: "Am Felsen der Loreley ist der Rhein gefährlich.", bin: legend }
                hints: ["Welcher Satz nennt einen Ort, den es wirklich gibt?"]
              - id: l2-s3
                type: true_false
                text: "„Ein Pfau gab vor dem Spatz mit seinen Federn an. Als der Fuchs kam, entkam er nur knapp. Prächtig auszusehen nützt nicht immer etwas.“\n\nIst das eine Sage?"
                say: "Lies den Text. Ist das eine Sage?"
                answer: false
                hints: ["Wer handelt hier, und was steht am Ende?"]
              - id: l2-s4
                type: multiple_choice
                text: "Was ist an einer Sage oft wirklich wahr?"
                options: ["der Ort, an dem sie spielt", "die sprechenden Tiere", "der Zauberspruch"]
                answer: "der Ort, an dem sie spielt"
                hints: ["Was kannst du heute noch besuchen?"]
              - id: l2-s5
                type: multiple_choice
