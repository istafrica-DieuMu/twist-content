              - id: l2-n3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Ich freue mich, das ihr kommt." }
                answer: false
              - id: l2-n4
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz die richtigen Wörter ein."
                frame: "Wir hoffen, _ _ Fest lustig wird."
                options: ["dass", "das"]
                answer: ["dass", "das"]
              - id: l2-n5
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein."
                frame: "Das Puzzle, _ du mir schenkst, ist schwer."
                options: ["das", "dass"]
                answer: ["das"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "das oder dass?"
            say: "Setz das richtige Wort ein."
            frame: "_ Paket ist angekommen."
