            options: ["Das", "Dass"]
            answer: ["Das"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "das oder dass?"
            say: "Setz das richtige Wort ein."
            frame: "Das Boot, _ dort schwimmt, ist blau."
            options: ["dass", "das"]
            answer: ["das"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ich weiß, dass du gern malst."
            say: "Dass mit zwei s ist ein Bindewort. Es verbindet zwei Sätze, und davor steht ein Komma. Oft kommt es nach Wörtern wie wissen, sagen, glauben oder hoffen."
          - text: "Ich weiß, dieses du gern malst. ✗"
            say: "Mach die Ersatzprobe: Ich weiß, dieses du gern malst. Das passt nicht, und jenes passt auch nicht. Also schreibst du dass mit zwei s."
          - text: "Ich hoffe, dass das Wetter schön wird."
            say: "Manchmal stehen beide nebeneinander: dass das Wetter. Das erste ist das Bindewort, das zweite der Begleiter von Wetter."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein. Mach die Ersatzprobe."
                frame: "Mama sagt, _ wir gleich essen."
                options: ["dass", "das"]
                answer: ["dass"]
                feedback:
                  "das": "Probier: Mama sagt, dieses wir gleich essen. Das passt nicht. Hier verbindet das Bindewort „dass“ die Sätze."
                hints:
                  - "Probier: Mama sagt, dieses wir gleich essen."
                  - "Passt „dieses“ hier? Wenn nicht, ist es das Bindewort."
                  - "„dass“ mit zwei s."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Passt „dieses“ oder „welches“ in die Lücke? „Oma schreibt, _ sie uns besucht.“"
                say: "Lies den Satz. Passt dieses oder welches in die Lücke?"
                options: ["Ja, also das", "Nein, also dass"]
                answer: "Nein, also dass"
                keep_order: true
                option_audio: false
                hints:
                  - "Setz „welches“ in die Lücke und sprich den Satz."
                  - "Oma schreibt, welches sie uns besucht. Klingt das richtig?"
                  - "Nein, also „dass“ mit zwei s."
              - id: l2-f3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Ich finde es toll, das du mitspielst." }
                answer: false
                feedback:
                  "true": "Probier: Ich finde es toll, dieses du mitspielst. Das passt nicht. Hier steht das Bindewort „dass“ mit zwei s."
                hints:
                  - "Mach die Ersatzprobe."
                  - "Ich finde es toll, dieses du mitspielst? Das passt nicht."
                  - "Nein. Richtig ist: Ich finde es toll, dass du mitspielst."
              - id: l2-f4
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz die richtigen Wörter ein. Mach für jede Lücke die Ersatzprobe."
                frame: "Opa sagt, _ _ Spiel um drei beginnt."
                options: ["dass", "das"]
                answer: ["dass", "das"]
                hints:
                  - "Probier „dieses“ in jeder Lücke einzeln."
                  - "Die erste Lücke verbindet die Sätze. Die zweite steht vor dem Nomen „Spiel“."
                  - "„dass“ und „das“."
              - id: l2-f5
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein. Mach die Ersatzprobe."
                frame: "Das Kind, _ dort winkt, ist meine Schwester."
                options: ["dass", "das"]
                answer: ["das"]
                hints:
                  - "Probier „welches“ statt des Wortes in der Lücke."
                  - "Das Kind, welches dort winkt. Klingt das richtig?"
                  - "„das“ mit einem s."

