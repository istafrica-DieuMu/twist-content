# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.spelling-das-dass
skill: lit-de.spelling.das-dass
curriculum: de-DE
language: de
title:
  de: das oder dass?
  en: das or dass?
summary: >
  Telling das from dass with the Ersatzprobe. Lesson 1 shows das as a
  Begleiter (das Haus), standing alone (Das schmeckt lecker.) and as a
  word you can swap for welches (Das Bild, das ich male); when dieses,
  jenes or welches does not fit, it is dass, which a few tasks set as a
  contrast. Lesson 2 shows dass as a Bindewort after a comma that cannot
  be swapped (Ich weiß, dass du gern malst.), mixes both, and ends with
  the skill check.
metadata:
  year: klasse-4
  topic: { de: Besondere Laute, en: Special sounds }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.sentences.conjunctions]
  also_practises: [lit-de.sentences.conjunctions]
  vocabulary: { de: [das, dass, Begleiter, Bindewort, Ersatzprobe, dieses, jenes, welches] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: dass-after-comma
      what: Writes dass after every comma, also before a Relativsatz (Das Buch, dass ich lese)
      addressed: lesson 1 Learn has a das after a comma that can be swapped for welches; every Practise stage of both lessons and both checks have such a sentence (l1-f3, l1-s3, l1-s4, l1-n3, l1-c3, l2-f5, l2-s2, l2-n5, l2-c3), with feedback in l1-f3 and l1-s4
    - id: das-for-dass
      what: Writes das for the Bindewort (Ich hoffe, das du kommst)
      addressed: lesson 1 Learn says dass is used when no swap fits, and each stage of lesson 1 has one dass item (l1-f5, l1-s1, l1-n5, l1-c1); lesson 2 cards with das in place of dass (l2-f3, l2-n3, l2-c5), with feedback in l1-f5, l2-f1 and l2-f3
    - id: dass-for-pronoun
      what: Writes Dass for a das that stands alone at the start of a sentence (Dass macht Spaß.)
      addressed: lesson 1 Learn screen 1 (Das schmeckt lecker.); l1-s5 and l2-n2 use das standing alone, and l2-n1 sets the contrast with a sentence that starts with Dass
    - id: no-swap-test
      what: Guesses instead of testing with dieses, jenes or welches
      addressed: the Ersatzprobe is named in lesson 1 Learn screens 1 and 3 and lesson 2 Learn screen 2, in the hints of every full-stage task, and every Practise stage has a "Passt dieses oder welches in die Lücke?" task
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "das mit einem s", en: "das with one s" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ich bleibe zu Hause, _ ich krank bin."
            say: "Welches Bindewort passt? Ich bleibe zu Hause, … ich krank bin."
            options: ["weil", "aber", "oder"]
            answer: "weil"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "_ Fahrrad ist neu."
            say: "Welcher Begleiter passt? … Fahrrad ist neu."
            options: ["Das", "Der", "Die"]
            answer: "Das"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "das Haus · Das schmeckt lecker."
            say: "Das mit einem s steht oft als Begleiter vor einem Nomen: das Haus. Es kann auch allein stehen: Das schmeckt lecker. Beide Male kannst du dafür dieses sagen: dieses Haus. Dieses schmeckt lecker."
          - text: "Das Bild, das ich male, ist bunt."
            say: "Das mit einem s kann auch auf ein Nomen zurückzeigen: Das Bild, das ich male. Hier kannst du statt das auch welches sagen: Das Bild, welches ich male."
          - text: "dieses, jenes, welches passt: das · nichts davon passt: dass"
            say: "So prüfst du es: Kannst du dieses, jenes oder welches einsetzen, schreibst du das mit einem s. Passt keins davon, ist es das Bindewort dass mit zwei s. Das lernst du in der nächsten Stunde genauer."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Passt „dieses“ oder „welches“ in die Lücke? „_ Lied gefällt mir.“"
                say: "Lies den Satz. Passt dieses oder welches in die Lücke?"
                options: ["Ja, also das", "Nein, also dass"]
                answer: "Ja, also das"
                keep_order: true
                option_audio: false
                hints:
                  - "Setz „dieses“ in die Lücke und sprich den Satz."
                  - "Dieses Lied gefällt mir. Klingt das richtig?"
                  - "Ja, also „das“ mit einem s."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein. Mach die Ersatzprobe."
                frame: "_ Wetter ist heute schön."
                options: ["Das", "Dass"]
                answer: ["Das"]
                hints:
                  - "Probier: Dieses Wetter ist heute schön."
                  - "„Dieses“ passt. Wie viele s hat das Wort dann?"
                  - "„Das“ mit einem s."
              - id: l1-f3
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein. Mach die Ersatzprobe."
                frame: "Das Pferd, _ dort steht, heißt Blitz."
                options: ["das", "dass"]
                answer: ["das"]
                feedback:
                  "dass": "Nach dem Komma steht nicht immer „dass“. Probier: Das Pferd, welches dort steht. Das passt, also „das“."
                hints:
                  - "Probier „welches“ statt des Wortes in der Lücke."
                  - "Das Pferd, welches dort steht. Klingt das richtig?"
                  - "„das“ mit einem s."
              - id: l1-f4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Das Buch, das ich lese, ist spannend." }
                answer: true
                hints:
                  - "Mach die Ersatzprobe für beide Wörter."
                  - "Dieses Buch, welches ich lese."
                  - "Ja, beide Male „das“."
              - id: l1-f5
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein. Mach die Ersatzprobe."
                frame: "Ich glaube, _ es gleich regnet."
                options: ["dass", "das"]
                answer: ["dass"]
                feedback:
                  "das": "Probier: Ich glaube, dieses es gleich regnet. Das passt nicht. Hier steht das Bindewort „dass“ mit zwei s."
                hints:
                  - "Probier „dieses“ und welches in der Lücke."
                  - "Ich glaube, welches es gleich regnet? Das klingt falsch."
                  - "„dass“ mit zwei s."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Passt „dieses“ oder „welches“ in die Lücke? „Ich hoffe, _ du gewinnst.“"
                say: "Lies den Satz. Passt dieses oder welches in die Lücke?"
                options: ["Ja, also das", "Nein, also dass"]
                answer: "Nein, also dass"
                keep_order: true
                option_audio: false
                hints: ["Setz „welches“ in die Lücke und sprich den Satz leise."]
              - id: l1-s2
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein."
                frame: "Ich mag _ Eis mit Schokolade."
                options: ["das", "dass"]
                answer: ["das"]
                hints: ["Mach die Ersatzprobe mit „dieses“."]
              - id: l1-s3
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein."
                frame: "Das Kleid, _ Oma genäht hat, ist rot."
                options: ["dass", "das"]
                answer: ["das"]
                hints: ["Probier „welches“ statt des Wortes in der Lücke."]
              - id: l1-s4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Das Zelt, dass am See steht, ist neu." }
                answer: false
                feedback:
                  "true": "Probier: Das Zelt, welches am See steht. Das passt, also schreibst du „das“ mit einem s."
                hints: ["Mach die Ersatzprobe mit „welches“."]
              - id: l1-s5
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein."
                frame: "_ macht großen Spaß."
                options: ["Dass", "Das"]
                answer: ["Das"]
                hints: ["Probier „dieses“ am Satzanfang."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Passt „dieses“ oder „welches“ in die Lücke? „_ Auto ist schnell.“"
                say: "Lies den Satz. Passt dieses oder welches in die Lücke?"
                options: ["Ja, also das", "Nein, also dass"]
                answer: "Ja, also das"
                keep_order: true
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein."
                frame: "Kennst du _ Spiel?"
                options: ["dass", "das"]
                answer: ["das"]
              - id: l1-n3
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein."
                frame: "Das Geschenk, _ ich bekommen habe, ist toll."
                options: ["das", "dass"]
                answer: ["das"]
              - id: l1-n4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die Karte. Ist das richtig geschrieben?"
                show: { drawn: letter-card, text: "Das Brot, das du gebacken hast, schmeckt gut." }
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "das oder dass?"
                say: "Setz das richtige Wort ein."
                frame: "Mama ruft, _ es Essen gibt."
                options: ["das", "dass"]
                answer: ["dass"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "das oder dass?"
            say: "Setz das richtige Wort ein."
            frame: "Lena sagt, _ sie mitkommt."
            options: ["das", "dass"]
            answer: ["dass"]
          - id: l1-c2
            type: fill_in_blank
            text: "das oder dass?"
            say: "Setz das richtige Wort ein."
            frame: "_ Zimmer ist aufgeräumt."
            options: ["Dass", "Das"]
            answer: ["Das"]
          - id: l1-c3
            type: true_false
            text: "Ist das richtig geschrieben?"
            say: "Lies die Karte. Ist das richtig geschrieben?"
            show: { drawn: letter-card, text: "Das Fenster, dass offen ist, klappert." }
            answer: false

