# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.verbs-prefixes
skill: lit-de.verbs.prefixes
curriculum: de-DE
language: de
title:
  de: Verben mit Vorsilben
  en: Verbs with prefixes
summary: >
  Eine Vorsilbe vor dem Verb macht ein neues Verb mit neuer Bedeutung:
  lesen, vorlesen; kaufen, verkaufen. Lesson 1 builds verbs with auf-,
  ab-, vor- and zer- and picks the one that fits a sentence; lesson 2 adds
  ver-, ent- and be-, says what the new verb means, shows that auf-, ab-
  and vor- move to the end of the sentence (Ich stehe auf.), and ends with
  the skill check.
metadata:
  year: klasse-2
  topic: { de: Verben, en: Verbs }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.verbs.base-form]
  also_practises: [lit-de.verbs.base-form]
  vocabulary: { de: [Vorsilbe, Verb, Bedeutung, auf, ab, vor, zer, ver, ent, be] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: same-meaning
      what: Thinks the verb with a Vorsilbe means the same as the plain verb (verkaufen is kaufen)
      addressed: lesson 2 Learn sets kaufen and verkaufen side by side; meaning tasks offer the plain meaning as a wrong option with feedback
    - id: lost-prefix
      what: Does not see the Vorsilbe when it moves to the end of the sentence (Der Zug fährt ab.)
      addressed: lesson 2 Learn shows the Vorsilbe at the end; tasks ask for the Grundform of such sentences in each stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Eine Vorsilbe davor, en: A prefix in front }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie heißt die Grundform von „sie schreibt“?"
            say: "Wie heißt die Grundform von sie schreibt?"
            options: ["schreiben", "schreibt", "schrieben"]
            answer: "schreiben"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ist brechen ein Verb?"
            say: "Lies das Wort auf der Karte. Ist es ein Verb?"
            show: { drawn: letter-card, text: "brechen" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "lesen · vor + lesen = vorlesen"
            say: "Lesen kennst du. Setzt man vor davor, wird daraus vorlesen. Wer vorliest, liest anderen etwas laut vor. Vor ist eine Vorsilbe."
          - text: "stehen · aufstehen"
            say: "Stehen und aufstehen sind nicht dasselbe. Aufstehen heißt: Du kommst aus dem Bett oder vom Stuhl hoch."
          - text: "auf · ab · vor · zer"
            say: "Vorsilben sind kleine Wortteile vor dem Verb: auf, ab, vor, zer. Zer heißt oft: in Stücke. Zerbrechen, zerreißen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welche Vorsilbe passt?"
                say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
                frame: "Pass auf, sonst _bricht die Vase!"
                options: ["zer", "vor", "auf"]
                answer: ["zer"]
                hints:
                  - "Was passiert mit einer Vase, die fällt?"
                  - "Zer heißt in Stücke."
                  - "zerbricht."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was heißt vorlesen?"
                say: "Lies die Antworten. Was heißt vorlesen?"
                options: ["für andere laut lesen", "leise für sich lesen", "ein Buch kaufen"]
                answer: "für andere laut lesen"
                feedback:
                  "leise für sich lesen": "Das ist einfach lesen. Wer vorliest, liest für andere laut."
                hints:
                  - "Denk an die Lehrerin, die ein Buch vorliest."
                  - "Die anderen hören zu."
                  - "für andere laut lesen."
              - id: l1-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Vorsilbe mit dem Verb, das passt."
                pairs:
                  - { left: { text: "auf" }, right: { text: "…machen: die Tür öffnen" } }
                  - { left: { text: "ab" }, right: { text: "…schreiben: von der Tafel ins Heft übertragen" } }
                  - { left: { text: "zer" }, right: { text: "…reißen: in Stücke reißen" } }
                hints:
                  - "Lies, was das Verb bedeutet."
                  - "Die Tür aufmachen."
                  - "aufmachen, abschreiben, zerreißen."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Aufstehen heißt dasselbe wie stehen."
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "aufstehen = stehen" }
                answer: false
                hints:
                  - "Wann stehst du auf?"
                  - "Morgens, wenn du aus dem Bett kommst."
                  - "Nein, das ist nicht dasselbe."
              - id: l1-f5
                type: fill_in_blank
                text: "Welche Vorsilbe passt?"
                say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
                frame: "Der Zug soll gleich _fahren."
                options: ["ab", "zer", "ent"]
                answer: ["ab"]
                hints:
                  - "Der Zug verlässt den Bahnhof."
                  - "Er fährt weg."
                  - "abfahren."
              - id: l1-f6
                type: highlight_in_text
                text: "Tippe auf die Vorsilbe."
                say: "Das Verb ist hier in zwei Teile getrennt. Tippe auf die Vorsilbe."
                show: { drawn: letter-card, text: "vor singen" }
                spans: ["vor"]
                hints:
                  - "Die Vorsilbe steht vorne."
                  - "Singen ist das Verb."
                  - "vor."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welche Vorsilbe passt?"
                say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
                frame: "Mia will das Papier in kleine Stücke _schneiden."
                options: ["zer", "ab", "vor"]
                answer: ["zer"]
                hints: ["Was passiert mit dem Papier?"]
              - id: l1-s2
                type: multiple_choice
                text: "Was heißt aufmachen?"
                say: "Lies die Antworten. Was heißt aufmachen?"
                options: ["etwas öffnen", "etwas schließen", "etwas machen"]
                answer: "etwas öffnen"
                hints: ["Denk an eine Tür."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Abschreiben heißt: von der Tafel ins Heft schreiben."
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "abschreiben = von der Tafel ins Heft schreiben" }
                answer: true
                hints: ["Was tust du mit dem Text an der Tafel?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tippe auf die Vorsilbe."
                say: "Das Verb ist hier in zwei Teile getrennt. Tippe auf die Vorsilbe."
                show: { drawn: letter-card, text: "auf räumen" }
                spans: ["auf"]
                hints: ["Welcher Teil ist das Verb, welcher steht davor?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Welche Vorsilbe passt?"
                say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
                frame: "Kannst du mir das Lied _singen?"
                options: ["vor", "zer", "ab"]
                answer: ["vor"]
                hints: ["Du singst für jemanden, der zuhört."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welche Vorsilbe passt?"
                say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
                frame: "Nach dem Essen müssen wir _waschen."
                options: ["ab", "zer", "vor"]
                answer: ["ab"]
              - id: l1-n2
                type: multiple_choice
                text: "Was heißt zerreißen?"
                say: "Lies die Antworten. Was heißt zerreißen?"
                options: ["in Stücke reißen", "etwas zusammenkleben", "etwas vorlesen"]
                answer: "in Stücke reißen"
              - id: l1-n3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Vorsilbe mit dem Verb, das passt."
                pairs:
                  - { left: { text: "vor" }, right: { text: "…machen: zeigen, wie es geht" } }
                  - { left: { text: "auf" }, right: { text: "…stehen: aus dem Bett kommen" } }
                  - { left: { text: "zer" }, right: { text: "…brechen: in Stücke brechen" } }
              - id: l1-n4
                type: highlight_in_text
                text: "Tippe auf die Vorsilbe."
                say: "Das Verb ist hier in zwei Teile getrennt. Tippe auf die Vorsilbe."
                show: { drawn: letter-card, text: "zer drücken" }
                spans: ["zer"]
              - id: l1-n5
                type: true_false
                text: "Stimmt das? Vorlesen heißt dasselbe wie lesen."
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "vorlesen = lesen" }
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Welche Vorsilbe passt?"
            say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
            frame: "Wir müssen das Zimmer _räumen."
            options: ["auf", "zer", "vor"]
            answer: ["auf"]
          - id: l1-c2
            type: multiple_choice
            text: "Was heißt zerbrechen?"
            say: "Lies die Antworten. Was heißt zerbrechen?"
            options: ["in Stücke brechen", "etwas reparieren", "etwas abschreiben"]
            answer: "in Stücke brechen"
          - id: l1-c3
            type: highlight_in_text
            text: "Tippe auf die Vorsilbe."
            say: "Das Verb ist hier in zwei Teile getrennt. Tippe auf die Vorsilbe."
            show: { drawn: letter-card, text: "ab trocknen" }
            spans: ["ab"]

  - n: 2
    title: { de: "ver, ent und be", en: "ver, ent and be" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welche Vorsilbe passt?"
            say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
            frame: "Der Bus muss gleich _fahren."
            options: ["ab", "zer", "ent"]
            answer: ["ab"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was heißt vormachen?"
            say: "Lies die Antworten. Was heißt vormachen?"
            options: ["zeigen, wie es geht", "etwas kaputt machen", "die Tür öffnen"]
            answer: "zeigen, wie es geht"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "kaufen · verkaufen"
            say: "Mit ver ändert sich die Bedeutung oft ganz. Wer kauft, bekommt etwas und bezahlt. Wer verkauft, gibt etwas her und bekommt Geld."
          - text: "entdecken · bemalen"
            say: "Weitere Vorsilben sind ent und be. Entdecken heißt: etwas Neues finden. Bemalen heißt: auf etwas malen, zum Beispiel einen Stein bemalen."
          - text: "Ich stehe auf. → aufstehen"
            say: "Auf, ab und vor wandern im Satz oft ans Ende. Ich stehe auf. Der Zug fährt ab. Das Verb heißt trotzdem aufstehen und abfahren. Ver, ent und be bleiben immer vorne: Ich verkaufe."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was heißt verkaufen?"
                say: "Lies die Antworten. Was heißt verkaufen?"
                options: ["etwas hergeben und Geld bekommen", "etwas bezahlen und mitnehmen", "etwas suchen"]
                answer: "etwas hergeben und Geld bekommen"
                feedback:
                  "etwas bezahlen und mitnehmen": "Das ist kaufen. Ver dreht es hier um: Wer verkauft, bekommt das Geld."
                hints:
                  - "Denk an einen Flohmarkt."
                  - "Wer verkauft, bekommt Geld."
                  - "etwas hergeben und Geld bekommen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Das Flugzeug fliegt ab. Wie heißt das Verb in der Grundform?"
                say: "Lies den Satz. Welche Grundform hat das Verb?"
                options: ["fliegen", "abfliegen", "fliegt"]
                answer: "abfliegen"
                feedback:
                  "fliegen": "Am Ende steht noch ab. Es gehört zum Verb: abfliegen."
                hints:
                  - "Schau ans Ende des Satzes."
                  - "Ab gehört zum Verb."
                  - "abfliegen."
              - id: l2-f3
                type: fill_in_blank
                text: "Welche Vorsilbe passt?"
                say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
                frame: "Wir wollen die Steine bunt _malen."
                options: ["be", "ent", "ver"]
                answer: ["be"]
                hints:
                  - "Die Farbe kommt auf die Steine."
                  - "Auf etwas malen."
                  - "bemalen."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Entdecken heißt: etwas Neues finden."
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "entdecken = etwas Neues finden" }
                answer: true
                hints:
                  - "Wer entdeckt eine Insel?"
                  - "Jemand findet sie zum ersten Mal."
                  - "Ja."
              - id: l2-f5
                type: highlight_in_text
                text: "Tippe auf die Vorsilbe."
                say: "Lies den Satz. Die Vorsilbe ist ans Ende gewandert. Tippe sie an."
                show: { drawn: letter-card, text: "Lisa liest ihrem Bruder vor." }
                spans: ["vor"]
                hints:
                  - "Schau ans Ende des Satzes."
                  - "Das Verb heißt vorlesen."
                  - "vor."
              - id: l2-f6
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Verb mit dem, was es bedeutet."
                pairs:
                  - { left: { text: "verstecken" }, right: { text: "so legen, dass es keiner findet" } }
                  - { left: { text: "entlaufen" }, right: { text: "weglaufen und nicht zurückkommen" } }
                  - { left: { text: "beschreiben" }, right: { text: "sagen, wie etwas aussieht" } }
                hints:
                  - "Lies zuerst die Bedeutungen."
                  - "Der Hund ist entlaufen."
                  - "verstecken, entlaufen, beschreiben."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was heißt verschlafen?"
                say: "Lies die Antworten. Was heißt verschlafen?"
                options: ["zu lange schlafen", "gut schlafen", "einschlafen wollen"]
                answer: "zu lange schlafen"
                hints: ["Was passiert, wenn der Wecker nicht klingelt?"]
              - id: l2-s2
                type: multiple_choice
                text: "Ich räume mein Zimmer auf. Wie heißt das Verb in der Grundform?"
                say: "Lies den Satz. Welche Grundform hat das Verb?"
                options: ["räumen", "aufräumen", "räume"]
                answer: "aufräumen"
                hints: ["Was steht am Ende des Satzes?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Welche Vorsilbe passt?"
                say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
                frame: "Die Kinder _decken eine Höhle im Wald."
                options: ["ent", "zer", "vor"]
                answer: ["ent"]
                hints: ["Sie finden etwas Neues."]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf die Vorsilbe."
                say: "Lies den Satz. Die Vorsilbe ist ans Ende gewandert. Tippe sie an."
                show: { drawn: letter-card, text: "Papa wäscht nach dem Essen ab." }
                spans: ["ab"]
                hints: ["Schau ans Ende des Satzes."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? Verkaufen heißt dasselbe wie kaufen."
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "verkaufen = kaufen" }
                answer: false
                hints: ["Wer bekommt beim Verkaufen das Geld?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Was heißt verstecken?"
                say: "Lies die Antworten. Was heißt verstecken?"
                options: ["so legen, dass es keiner findet", "etwas Neues finden", "etwas bunt malen"]
                answer: "so legen, dass es keiner findet"
              - id: l2-n2
                type: multiple_choice
                text: "Mama macht das Fenster auf. Wie heißt das Verb in der Grundform?"
                say: "Lies den Satz. Welche Grundform hat das Verb?"
                options: ["machen", "aufmachen", "macht"]
                answer: "aufmachen"
              - id: l2-n3
                type: fill_in_blank
                text: "Welche Vorsilbe passt?"
                say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
                frame: "Oma will ihr altes Fahrrad _kaufen."
                options: ["ver", "ent", "be"]
                answer: ["ver"]
              - id: l2-n4
                type: highlight_in_text
                text: "Tippe auf die Vorsilbe."
                say: "Lies den Satz. Die Vorsilbe ist ans Ende gewandert. Tippe sie an."
                show: { drawn: letter-card, text: "Der Lehrer macht die Übung vor." }
                spans: ["vor"]
              - id: l2-n5
                type: true_false
                text: "Stimmt das? Bemalen heißt: auf etwas malen."
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "bemalen = auf etwas malen" }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Was heißt verlieren?"
            say: "Lies die Antworten. Was heißt verlieren?"
            options: ["etwas nicht mehr haben", "etwas finden", "etwas verkaufen"]
            answer: "etwas nicht mehr haben"
          - id: l2-c2
            type: multiple_choice
            text: "Der Hund ist weggelaufen. Er ist _."
            say: "Lies den Satz. Welches Verb passt in die Lücke?"
            options: ["entlaufen", "vorgelesen", "bemalt"]
            answer: "entlaufen"
          - id: l2-c3
            type: multiple_choice
            text: "Ich schreibe die Wörter ab. Wie heißt das Verb in der Grundform?"
            say: "Lies den Satz. Welche Grundform hat das Verb?"
            options: ["schreiben", "abschreiben", "schreibe"]
            answer: "abschreiben"
          - id: l2-c4
            type: fill_in_blank
            text: "Welche Vorsilbe passt?"
            say: "Lies den Satz. Setz die Vorsilbe ein, die passt."
            frame: "Der Teller fällt und _springt."
            options: ["zer", "be", "vor"]
            answer: ["zer"]
          - id: l2-c5
            type: highlight_in_text
            text: "Tippe auf die Vorsilbe."
            say: "Lies den Satz. Tippe auf die Vorsilbe."
            show: { drawn: letter-card, text: "Der Clown macht den Trick vor." }
            spans: ["vor"]
