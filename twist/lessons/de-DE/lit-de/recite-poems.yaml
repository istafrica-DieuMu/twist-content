# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.recite-poems
skill: lit-de.texts-media.recite
curriculum: de-DE
language: de
title:
  de: Gedichte auswendig lernen und vortragen
  en: Learning poems by heart and reciting them
summary: >
  Learning a short poem by heart and saying it with expression. Lesson 1
  learns a poem stanza by stanza and line by line, uses the rhyme words to
  recall the next line, fills gaps and puts lines in order; lesson 2 picks
  the word to stress, matches the voice to the mood (quiet, cheerful,
  calm), sorts good and poor ways of reciting, and ends with the skill
  check. Speak tasks let the child say lines aloud and compare with the
  model; they are practice only. Every poem is written for Twist.
metadata:
  year: klasse-4
  topic: { de: Vortragen, en: Performing }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.texts-media.poems]
  also_practises: [lit-de.texts-media.poems]
  vocabulary: { de: [auswendig, Strophe, Vers, Reimwort, betonen, Pause, Vortrag, Publikum] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: learn-by-skimming
      what: Thinks reading a poem once or twice silently is enough to know it by heart
      addressed: lesson 1 Learn sets out stanza by stanza, aloud, over several days; every stage of lesson 1 asks how to learn or recall, with feedback in l1-f3
    - id: stress-small-words
      what: Recites flat or stresses small words (die, der) instead of the word that carries the meaning
      addressed: lesson 2 Learn stresses langsam; every stage of lesson 2 asks which word to stress and how a line should sound, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Strophe für Strophe", en: "Stanza by stanza" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie nennt man eine Zeile in einem Gedicht?"
            options: ["Vers", "Strophe", "Reim"]
            answer: "Vers"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Wörter reimen sich?"
            options: ["Haus und Maus", "Haus und Hose", "Maus und Mond"]
            answer: "Haus und Maus"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Herbstwind\n\nDer Herbstwind braust durchs ganze Land,\ner nimmt die Blätter an die Hand.\nEr tanzt mit ihnen, rot und braun,\nhoch über Opas Gartenzaun.\n\nAm Abend wird der Wind ganz still,\nweil er jetzt endlich schlafen will.\nDie Blätter liegen bunt im Gras\nund träumen schon vom nächsten Spaß."
            say: "Willst du ein Gedicht auswendig lernen, liest du es zuerst ein paar Mal laut. Überleg dir: Worum geht es? Hier tanzt der Herbstwind mit den Blättern und schläft am Abend ein."
          - text: "Land · Hand\nbraun · Gartenzaun"
            say: "Lern Strophe für Strophe und Zeile für Zeile. Die Reimwörter helfen dir. Weißt du Land, fällt dir Hand leichter ein."
          - text: "Der Herbstwind braust durchs ganze …,\ner nimmt die Blätter an die …"
            say: "Deck Wörter ab und sag die Zeilen trotzdem. Übe an mehreren Tagen. Zum Schluss sagst du die ganze Strophe ohne Blatt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welches Reimwort fehlt?"
                say: "Sprich die Zeilen leise mit. Welches Reimwort fehlt?"
                frame: "Der Herbstwind braust durchs ganze Land,\ner nimmt die Blätter an die _ ."
                options: ["Hand", "Wand", "Hund"]
                answer: ["Hand"]
                hints:
                  - "Das Wort reimt sich auf Land."
                  - "Hand und Wand reimen sich beide. Was nimmt man an die ...?"
                  - "Hand."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Bring die erste Strophe in die richtige Reihenfolge."
                say: "Bring die Verse der ersten Strophe in die richtige Reihenfolge."
                options: ["hoch über Opas Gartenzaun.", "er nimmt die Blätter an die Hand.", "Der Herbstwind braust durchs ganze Land,", "Er tanzt mit ihnen, rot und braun,"]
                slot_count: 4
                answer: ["Der Herbstwind braust durchs ganze Land,", "er nimmt die Blätter an die Hand.", "Er tanzt mit ihnen, rot und braun,", "hoch über Opas Gartenzaun."]
                hints:
                  - "Der erste Vers nennt, um wen es geht."
                  - "Land reimt sich auf Hand, braun auf Gartenzaun."
                  - "Land, Hand, braun, Gartenzaun."
              - id: l1-f3
                type: multiple_choice
                text: "Was hilft dir beim Auswendiglernen am meisten?"
                options: ["Strophe für Strophe laut sprechen und an mehreren Tagen üben", "das Gedicht einmal leise überfliegen", "nur die Überschrift lernen"]
                answer: "Strophe für Strophe laut sprechen und an mehreren Tagen üben"
                feedback:
                  "das Gedicht einmal leise überfliegen": "Einmal lesen reicht fast nie. Laut sprechen und oft wiederholen hilft dem Gedächtnis."
                hints:
                  - "Wie behältst du etwas am besten?"
                  - "Wiederholen und laut sprechen helfen."
                  - "Strophe für Strophe, laut und an mehreren Tagen."
              - id: l1-f4
                type: speak
                text: "Sprich den Vers nach: „Der Herbstwind braust durchs ganze Land.“"
                say: "Hör gut zu und sprich den Vers nach: Der Herbstwind braust durchs ganze Land."
                expected_text: "Der Herbstwind braust durchs ganze Land."
                hints:
                  - "Sprich langsam und deutlich."
                  - "Lass dir bei braust etwas Zeit, wie der Wind."
                  - "Der Herbstwind braust durchs ganze Land."
              - id: l1-f5
                type: fill_in_blank
                text: "Welche Wörter fehlen?"
                say: "Sprich die Zeilen leise mit. Welche Wörter fehlen?"
                frame: "Er tanzt mit ihnen, rot und _ ,\nhoch über Opas Garten_ ."
                options: ["braun", "blau", "zaun", "tor"]
                answer: ["braun", "zaun"]
                hints:
                  - "Die beiden Wörter reimen sich."
                  - "Welche Farbe haben Herbstblätter? Und was reimt sich darauf?"
                  - "braun und Gartenzaun."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welches Reimwort fehlt?"
                say: "Sprich die Zeilen leise mit. Welches Reimwort fehlt?"
                frame: "Am Abend wird der Wind ganz still,\nweil er jetzt endlich schlafen _ ."
                options: ["will", "kann", "muss"]
                answer: ["will"]
                hints: ["Das Wort reimt sich auf still."]
              - id: l1-s2
                type: ordering
                text: "Bring die zweite Strophe in die richtige Reihenfolge."
                say: "Bring die Verse der zweiten Strophe in die richtige Reihenfolge."
                options: ["Die Blätter liegen bunt im Gras", "und träumen schon vom nächsten Spaß.", "Am Abend wird der Wind ganz still,", "weil er jetzt endlich schlafen will."]
                slot_count: 4
                answer: ["Am Abend wird der Wind ganz still,", "weil er jetzt endlich schlafen will.", "Die Blätter liegen bunt im Gras", "und träumen schon vom nächsten Spaß."]
                hints: ["Erst geht es um den Wind, dann um die Blätter."]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Wörter reimen sich in der zweiten Strophe?"
                options: ["Gras und Spaß", "Wind und still", "Abend und Blätter"]
                answer: "Gras und Spaß"
                hints: ["Schau auf die letzten Wörter der Verse."]
              - id: l1-s4
                type: speak
                text: "Sprich den Vers nach: „Weil er jetzt endlich schlafen will.“"
                say: "Hör gut zu und sprich den Vers nach: Weil er jetzt endlich schlafen will."
                expected_text: "Weil er jetzt endlich schlafen will."
                hints: ["Sprich ruhig, der Wind wird ja müde."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Beim Auswendiglernen hilft es, das Gedicht an mehreren Tagen zu üben."
                say: "Stimmt das? Beim Auswendiglernen hilft es, das Gedicht an mehreren Tagen zu üben."
                answer: true
                hints: ["Was passiert, wenn du etwas oft wiederholst?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welche Reimwörter fehlen?"
                say: "Sprich die Zeilen leise mit. Welche Reimwörter fehlen?"
                frame: "Die Blätter liegen bunt im _\nund träumen schon vom nächsten _ ."
                options: ["Gras", "Baum", "Spaß", "Tag"]
                answer: ["Gras", "Spaß"]
              - id: l1-n2
                type: ordering
                text: "Der Schneemann: Bring die Verse in die richtige Reihenfolge."
                say: "Hier ist ein neues Gedicht, der Schneemann. Bring die Verse in die richtige Reihenfolge."
                options: ["dann schmilzt er leider viel zu schnell.", "Ein Schneemann steht im Garten dort,", "Doch scheint die Sonne warm und hell,", "er will um keinen Preis hier fort."]
                slot_count: 4
                answer: ["Ein Schneemann steht im Garten dort,", "er will um keinen Preis hier fort.", "Doch scheint die Sonne warm und hell,", "dann schmilzt er leider viel zu schnell."]
              - id: l1-n3
                type: multiple_choice
                text: "„Ein Schneemann steht im Garten dort, / er will um keinen Preis hier fort.“ Welche Wörter reimen sich?"
                say: "Ein Schneemann steht im Garten dort, er will um keinen Preis hier fort. Welche Wörter reimen sich?"
                options: ["dort und fort", "Schneemann und Garten", "steht und Preis"]
                answer: "dort und fort"
              - id: l1-n4
                type: speak
                text: "Sprich den Vers nach: „Ein Schneemann steht im Garten dort.“"
                say: "Hör gut zu und sprich den Vers nach: Ein Schneemann steht im Garten dort."
                expected_text: "Ein Schneemann steht im Garten dort."
              - id: l1-n5
                type: multiple_choice
                text: "Dir fällt der nächste Vers nicht ein. Was kann dir helfen?"
                options: ["an das Reimwort denken", "schneller sprechen", "einfach aufhören"]
                answer: "an das Reimwort denken"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Welche Reimwörter fehlen im Schneemann-Gedicht?"
            say: "Sprich die Zeilen leise mit. Welche Reimwörter fehlen?"
            frame: "Doch scheint die Sonne warm und _ ,\ndann schmilzt er leider viel zu _ ."
            options: ["hell", "schnell", "heiß", "bald"]
            answer: ["hell", "schnell"]
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ein Gedicht lernst du am besten Strophe für Strophe."
            say: "Stimmt das? Ein Gedicht lernst du am besten Strophe für Strophe."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Im Gedicht vom Herbstwind: Welches Wort reimt sich auf Land?"
            options: ["Hand", "Laub", "Wind"]
            answer: "Hand"

  - n: 2
    title: { de: "Betont vortragen", en: "Reciting with expression" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welches Wort fehlt?"
            say: "Sprich die Zeile leise mit. Welches Wort fehlt?"
            frame: "Am Abend wird der Wind ganz _ ,"
            options: ["still", "laut", "kalt"]
            answer: ["still"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie lernst du ein Gedicht auswendig?"
            options: ["Vers für Vers, laut und an mehreren Tagen", "einmal kurz vor dem Vortrag", "nur im Kopf, ohne zu sprechen"]
            answer: "Vers für Vers, laut und an mehreren Tagen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Die Schnecke\n\nDie Schnecke kriecht ganz langsam fort,\nihr Haus trägt sie von Ort zu Ort.\nUnd regnet es, dann freut sie sich\nund sagt: „Das Wetter passt für mich!“"
            say: "Beim Vortragen sollen alle hören, worum es geht. Sprich laut, langsam und deutlich. Am Ende eines Verses machst du eine kleine Pause, am Ende der Strophe eine längere."
          - text: "Die Schnecke kriecht ganz LANGSAM fort,"
            say: "Wichtige Wörter betonst du stärker. Hier ist langsam wichtig. Du kannst es sogar langsam sprechen: Die Schnecke kriecht ganz laaangsam fort."
          - text: "„Das Wetter passt für mich!“ → fröhlich"
            say: "Deine Stimme passt zum Gedicht. Die Schnecke freut sich über den Regen, also klingt der letzte Vers fröhlich. Schau beim Vortrag ab und zu dein Publikum an."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "„Die Schnecke kriecht ganz langsam fort.“ Welches Wort betonst du besonders?"
                options: ["langsam", "die", "fort"]
                answer: "langsam"
                feedback:
                  "die": "Die ist nur der Artikel. Er sagt nicht viel über die Schnecke. Betone das Wort, das zeigt, wie die Schnecke kriecht."
                hints:
                  - "Welches Wort ist für den Sinn am wichtigsten?"
                  - "Wie kriecht die Schnecke?"
                  - "langsam."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie sprichst du den Vers „und sagt: Das Wetter passt für mich!“?"
                options: ["fröhlich", "traurig", "wütend"]
                answer: "fröhlich"
                hints:
                  - "Wie geht es der Schnecke im Regen?"
                  - "Sie freut sich."
                  - "fröhlich."
              - id: l2-f3
                type: sorting
                text: "Was ist gut beim Vortragen?"
                say: "Sortiere: Was ist gut beim Vortragen, was nicht?"
                bins:
                  - { id: good, show: { text: "gut" }, say: "gut" }
                  - { id: bad, show: { text: "nicht gut" }, say: "nicht gut" }
                options:
                  - { text: "langsam und deutlich sprechen", bin: good }
                  - { text: "ab und zu ins Publikum schauen", bin: good }
                  - { text: "so schnell wie möglich sprechen", bin: bad }
                  - { text: "zum Boden hin murmeln", bin: bad }
                hints:
                  - "Stell dir vor, du hörst zu. Was hilft dir?"
                  - "Zu schnell und zu leise versteht man nichts."
                  - "Gut: langsam, deutlich, ins Publikum schauen."
              - id: l2-f4
                type: speak
                text: "Sprich den Vers betont: „Die Schnecke kriecht ganz langsam fort.“"
                say: "Hör zu und sprich den Vers betont nach. Mach das Wort langsam auch langsam: Die Schnecke kriecht ganz laaangsam fort."
                expected_text: "Die Schnecke kriecht ganz langsam fort."
                hints:
                  - "Betone das Wort langsam."
                  - "Zieh es etwas in die Länge."
                  - "Die Schnecke kriecht ganz laaangsam fort."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? Am Ende einer Strophe machst du eine Pause."
                say: "Stimmt das? Am Ende einer Strophe machst du eine Pause."
                answer: true
                hints:
                  - "Was hilft den Zuhörern, mitzukommen?"
                  - "Eine Pause zeigt: Jetzt beginnt etwas Neues."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "„Am Abend wird der Wind ganz still.“ Welches Wort betonst du besonders?"
                options: ["still", "der", "wird"]
                answer: "still"
                hints: ["Was passiert mit dem Wind am Abend?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wie sprichst du den Vers „Am Abend wird der Wind ganz still“?"
                options: ["leise und ruhig", "laut und schnell", "wütend"]
                answer: "leise und ruhig"
                hints: ["Der Wind wird müde."]
              - id: l2-s3
                type: sorting
                text: "Was ist gut beim Vortragen?"
                say: "Sortiere: Was ist gut beim Vortragen, was nicht?"
                bins:
                  - { id: good, show: { text: "gut" }, say: "gut" }
                  - { id: bad, show: { text: "nicht gut" }, say: "nicht gut" }
                options:
                  - { text: "an den Versenden kurze Pausen machen", bin: good }
                  - { text: "laut genug sprechen", bin: good }
                  - { text: "das Blatt vor das Gesicht halten", bin: bad }
                  - { text: "ohne Pause durchrasen", bin: bad }
                hints: ["Was hilft den Zuhörern?"]
              - id: l2-s4
                type: speak
                text: "Sprich den Vers leise und ruhig: „Am Abend wird der Wind ganz still.“"
                say: "Hör zu und sprich den Vers leise und ruhig nach: Am Abend wird der Wind ganz still."
                expected_text: "Am Abend wird der Wind ganz still."
                hints: ["Mach am Ende eine kleine Pause."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? Ein lustiges Gedicht trägst du am besten mit trauriger Stimme vor."
                say: "Stimmt das? Ein lustiges Gedicht trägst du am besten mit trauriger Stimme vor."
                answer: false
                hints: ["Soll die Stimme zum Gedicht passen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "„Dann schmilzt er leider viel zu schnell.“ Welches Wort betonst du besonders?"
                options: ["schnell", "er", "dann"]
                answer: "schnell"
              - id: l2-n2
                type: multiple_choice
                text: "„Der Mond wünscht mir eine gute Nacht.“ Wie sprichst du diesen Vers?"
                options: ["sanft und ruhig", "laut und aufgeregt", "ärgerlich"]
                answer: "sanft und ruhig"
              - id: l2-n3
                type: sorting
                text: "Was ist gut beim Vortragen?"
                say: "Sortiere: Was ist gut beim Vortragen, was nicht?"
                bins:
                  - { id: good, show: { text: "gut" }, say: "gut" }
                  - { id: bad, show: { text: "nicht gut" }, say: "nicht gut" }
                options:
                  - { text: "das Gedicht vorher oft üben", bin: good }
                  - { text: "jedes Wort deutlich sprechen", bin: good }
                  - { text: "kichern und abbrechen", bin: bad }
                  - { text: "nuscheln", bin: bad }
              - id: l2-n4
                type: speak
                text: "Sprich den Vers sanft: „Er wünscht mir eine gute Nacht.“"
                say: "Hör zu und sprich den Vers sanft nach: Er wünscht mir eine gute Nacht."
                expected_text: "Er wünscht mir eine gute Nacht."
              - id: l2-n5
                type: multiple_choice
                text: "Du bleibst beim Vortragen hängen. Was machst du?"
                options: ["kurz durchatmen und den Vers noch einmal anfangen", "weglaufen", "ein anderes Gedicht anfangen"]
                answer: "kurz durchatmen und den Vers noch einmal anfangen"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Der Mond: Welche Reimwörter fehlen?"
            say: "Sprich die Zeilen leise mit. Welche Reimwörter fehlen?"
            frame: "Der Mond schaut nachts zum Fenster _ ,\ner leuchtet sanft mit hellem _ ."
            options: ["rein", "Schein", "raus", "Licht"]
            answer: ["rein", "Schein"]
          - id: l2-c2
            type: ordering
            text: "Der Mond: Bring die Verse in die richtige Reihenfolge."
            say: "Bring die Verse des Mond-Gedichts in die richtige Reihenfolge."
            options: ["und hält bis morgen früh die Wacht.", "er leuchtet sanft mit hellem Schein.", "Er wünscht mir eine gute Nacht", "Der Mond schaut nachts zum Fenster rein,"]
            slot_count: 4
            answer: ["Der Mond schaut nachts zum Fenster rein,", "er leuchtet sanft mit hellem Schein.", "Er wünscht mir eine gute Nacht", "und hält bis morgen früh die Wacht."]
          - id: l2-c3
            type: multiple_choice
            text: "Wie trägst du ein Gedicht über ein wildes Gewitter vor?"
            options: ["kräftig und spannend", "ganz leise und müde", "gelangweilt"]
            answer: "kräftig und spannend"
          - id: l2-c4
            type: sorting
            text: "Gut oder nicht gut beim Vortrag?"
            say: "Ordne zu: Hilft das beim Vortragen oder nicht?"
            bins:
              - { id: good, show: { text: "gut" }, say: "gut" }
              - { id: bad, show: { text: "nicht gut" }, say: "nicht gut" }
            options:
              - { text: "wichtige Wörter betonen", bin: good }
              - { text: "gerade stehen und ruhig atmen", bin: good }
              - { text: "alles gleich und ohne Ausdruck sprechen", bin: bad }
              - { text: "mit dem Rücken zum Publikum stehen", bin: bad }
          - id: l2-c5
            type: true_false
            text: "Stimmt das? Reimwörter helfen dir, den nächsten Vers nicht zu vergessen."
            say: "Stimmt das? Reimwörter helfen dir, den nächsten Vers nicht zu vergessen."
            answer: true
