# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.lengthen-dt
skill: lit-de.spelling-strategies.lengthen-dt
curriculum: de-DE
language: de
title:
  de: Verlängern bei d und t
  en: Lengthening for d and t
summary: >
  At the end of a word d and t sound the same. Lesson 1 makes a noun
  longer with its plural (Hund, Hunde; Brot, Brote) to hear which letter
  it is; lesson 2 does the same for Wiewörter with a noun (rund, ein
  runder Ball; bunt, ein buntes Bild), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Rechtschreibstrategien, en: Spelling strategies }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling-strategies.syllable-swinging, lit-de.nouns.plural]
  also_practises: [lit-de.nouns.plural, lit-de.adjectives.recognise]
  vocabulary: { de: [verlängern, Mehrzahl, Wiewort, Nomen, Endbuchstabe] }
  forms: [picture, text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: write-what-you-hear
      what: Writes the end letter as it sounds (Hunt for Hund) or guesses the other way (Brod for Brot)
      addressed: lesson 1 Learn hears Hund as t and shows why it is d; a "d oder t?" gap in every stage, a word card to judge in every stage, misspelt in l1-f4, l1-n4, l2-f4 and l2-c4 (Brod, Hemt, laud, Pfert)
    - id: wrong-helper-word
      what: Picks a word that only looks similar instead of the longer form (Kino for Kind, Mond for Mund)
      addressed: "every stage has a \"Welches Wort hilft dir?\" task with look-alike words as options"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Hund mit d, Brot mit t", en: "Hund with d, Brot with t" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "ein Kind, zwei …"
            say: "Ein Kind, zwei … Wie heißt die Mehrzahl?"
            options: ["Kinder", "Kinde", "Kinds"]
            answer: "Kinder"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Silben hat das Wort?"
            say: "Schwinge das Wort Hunde. Wie viele Silben hat es?"
            show: { object: dog, count: 2, layout: row }
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Hund"
            say: "Hör genau hin: Hund. Am Ende hörst du ein t. Geschrieben wird aber ein d. Woher weißt du das?"
            show: { object: dog }
          - text: "Hund → die Hunde"
            say: "Verlängere das Wort: ein Hund, zwei Hunde. In Hunde hörst du das d deutlich. Darum schreibst du Hund mit d."
          - text: "Brot → die Brote"
            say: "Bei Brot verlängerst du auch: ein Brot, zwei Brote. Jetzt hörst du ein t. Also schreibst du Brot mit t."
            show: { object: bread }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "d oder t? Verlängere."
                say: "Die Hand. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                show: { object: hand }
                frame: "die Han_"
                options: ["d", "t"]
                answer: ["d"]
                hints:
                  - "Verlängere: eine Hand, zwei …"
                  - "Zwei Hände. In Hände hörst du das d."
                  - "Hand schreibt man mit d."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort hilft dir bei Kind?"
                say: "Welches Wort hilft dir, wenn du Kind schreiben willst?"
                options: ["Kinder", "Kino", "Kinn"]
                answer: "Kinder"
                feedback:
                  "Kino": "Kino sieht nur ähnlich aus. Mach aus einem Kind mehrere."
                  "Kinn": "Kinn sieht nur ähnlich aus. Mach aus einem Kind mehrere."
                hints:
                  - "Mach aus einem Kind mehrere."
                  - "Ein Kind, zwei …"
                  - "Tippe auf Kinder."
              - id: l1-f3
                type: fill_in_blank
                text: "d oder t? Verlängere."
                say: "Der Hut. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                show: { object: hat }
                frame: "der Hu_"
                options: ["d", "t"]
                answer: ["t"]
                hints:
                  - "Verlängere: ein Hut, zwei …"
                  - "Zwei Hüte. In Hüte hörst du das t."
                  - "Hut schreibt man mit t."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Brod" }
                answer: false
                hints:
                  - "Verlängere das Wort: ein Brot, zwei …"
                  - "Zwei Brote. In Brote hörst du ein t."
                  - "Nein. Richtig ist Brot."
              - id: l1-f5
                type: image_multiple_choice
                text: "Welches Wort schreibt man am Ende mit d?"
                say: "Tippe auf die Bilder und hör die Wörter. Welches Wort schreibt man am Ende mit d?"
                options:
                  - { object: moon }
                  - { object: hat }
                  - { object: bread }
                answer: moon
                hints:
                  - "Verlängere jedes Wort mit der Mehrzahl."
                  - "Monde, Hüte, Brote. Wo hörst du ein d?"
                  - "Tippe auf den Mond."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "d oder t? Verlängere."
                say: "Das Bild. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "das Bil_"
                options: ["d", "t"]
                answer: ["d"]
                hints: ["Verlängere: ein Bild, viele …"]
              - id: l1-s2
                type: multiple_choice
                text: "Welches Wort hilft dir bei Zelt?"
                say: "Welches Wort hilft dir, wenn du Zelt schreiben willst?"
                options: ["Zelte", "Zeit", "Zettel"]
                answer: "Zelte"
                hints: ["Mach aus einem Zelt mehrere."]
              - id: l1-s3
                type: fill_in_blank
                text: "d oder t? Verlängere."
                say: "Das Fahrrad. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                show: { object: bike }
                frame: "das Fahrra_"
                options: ["d", "t"]
                answer: ["d"]
                hints: ["Verlängere: ein Rad, zwei Räder."]
              - id: l1-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Nest" }
                answer: true
                hints: ["Verlängere: viele Nester."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Welches Wort schreibt man am Ende mit t?"
                say: "Tippe auf die Bilder und hör die Wörter. Welches Wort schreibt man am Ende mit t?"
                options:
                  - { object: hand }
                  - { object: boat }
                  - { object: child }
                answer: boat
                hints: ["Verlängere jedes Wort."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "d oder t? Verlängere."
                say: "Der Abend. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "der Aben_"
                options: ["d", "t"]
                answer: ["d"]
              - id: l1-n2
                type: multiple_choice
                text: "Welches Wort hilft dir bei Pferd?"
                say: "Welches Wort hilft dir, wenn du Pferd schreiben willst?"
                options: ["Pferde", "Pfeife", "Pfote"]
                answer: "Pferde"
              - id: l1-n3
                type: fill_in_blank
                text: "d oder t? Verlängere."
                say: "Die Wand. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "die Wan_"
                options: ["d", "t"]
                answer: ["d"]
              - id: l1-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Hemt" }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "d oder t? Verlängere."
                say: "Das Boot. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                show: { object: boat }
                frame: "das Boo_"
                options: ["d", "t"]
                answer: ["t"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "d oder t? Verlängere."
            say: "Der Strand. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "der Stran_"
            options: ["d", "t"]
            answer: ["d"]
          - id: l1-c2
            type: fill_in_blank
            text: "d oder t? Verlängere."
            say: "Der Gast. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "der Gas_"
            options: ["d", "t"]
            answer: ["t"]
          - id: l1-c3
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Wald" }
            answer: true

  - n: 2
    title: { de: "Auch Wiewörter verlängern", en: "Lengthening describing words" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "d oder t? Verlängere."
            say: "Das Zelt. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "das Zel_"
            options: ["d", "t"]
            answer: ["t"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welches Wort hilft dir bei Hand?"
            say: "Welches Wort hilft dir, wenn du Hand schreiben willst?"
            options: ["Hände", "Handy", "Hans"]
            answer: "Hände"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "rund → ein runder Ball"
            say: "Auch Wiewörter kannst du verlängern. Rund: ein runder Ball. Jetzt hörst du das d."
            show: { object: ball }
          - text: "bunt → ein buntes Bild"
            say: "Bunt: ein buntes Bild. Hier hörst du ein t."
          - text: "Hund → zwei Hunde | rund → ein runder Ball"
            say: "Merk dir: Ein Nomen verlängerst du mit der Mehrzahl, ein Hund, zwei Hunde. Ein Wiewort verlängerst du mit einem Nomen, rund, ein runder Ball."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "d oder t? Verlängere das Wiewort."
                say: "Das Tier ist wild. Welcher Buchstabe fehlt am Ende von wild? Verlängere das Wiewort mit einem Nomen."
                frame: "wil_"
                options: ["d", "t"]
                answer: ["d"]
                hints:
                  - "Setz ein Nomen dazu, zum Beispiel Tier."
                  - "Ein wildes Tier. In wildes hörst du das d."
                  - "Wild schreibt man mit d."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was hilft dir bei kalt?"
                say: "Was hilft dir, wenn du kalt schreiben willst?"
                options: ["kalte Hände", "der Kalender", "das Kamel"]
                answer: "kalte Hände"
                feedback:
                  "der Kalender": "Kalender sieht nur ähnlich aus. Setz zu kalt ein Nomen dazu."
                  "das Kamel": "Kamel sieht nur ähnlich aus. Setz zu kalt ein Nomen dazu."
                hints:
                  - "Setz zu kalt ein Nomen dazu."
                  - "Kalte Hände. In kalte hörst du das t."
                  - "Tippe auf kalte Hände."
              - id: l2-f3
                type: fill_in_blank
                text: "d oder t? Verlängere das Wiewort."
                say: "Obst ist gesund. Welcher Buchstabe fehlt am Ende von gesund? Verlängere das Wiewort mit einem Nomen."
                frame: "gesun_"
                options: ["d", "t"]
                answer: ["d"]
                hints:
                  - "Setz ein Nomen dazu, zum Beispiel Essen."
                  - "Ein gesundes Essen. In gesundes hörst du das d."
                  - "Gesund schreibt man mit d."
              - id: l2-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "laud" }
                answer: false
                hints:
                  - "Setz ein Nomen dazu, zum Beispiel Musik."
                  - "Laute Musik. In laute hörst du ein t."
                  - "Nein. Richtig ist laut."
              - id: l2-f5
                type: fill_in_blank
                text: "Setz die Buchstaben ein."
                say: "Das Hemd ist alt. Welche Buchstaben fehlen? Verlängere beide Wörter."
                frame: "Das Hem_ ist al_."
                options: ["d", "t"]
                answer: ["d", "t"]
                hints:
                  - "Verlängere beide Wörter: das Nomen mit der Mehrzahl, das Wiewort mit einem Nomen."
                  - "Zwei Hemden, ein altes Hemd. In Hemden hörst du ein d, in altes ein t."
                  - "Hemd mit d, alt mit t."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "d oder t? Verlängere das Wiewort."
                say: "Der Mann ist blind. Welcher Buchstabe fehlt am Ende von blind? Verlängere das Wiewort mit einem Nomen."
                frame: "blin_"
                options: ["d", "t"]
                answer: ["d"]
                hints: ["Verlängere: ein blinder Mann."]
              - id: l2-s2
                type: multiple_choice
                text: "Was hilft dir bei hart?"
                say: "Was hilft dir, wenn du hart schreiben willst?"
                options: ["harte Nüsse", "die Haare", "der Hase"]
                answer: "harte Nüsse"
                hints: ["Setz ein Nomen dazu."]
              - id: l2-s3
                type: fill_in_blank
                text: "d oder t? Verlängere das Wiewort."
                say: "Die Straße ist breit. Welcher Buchstabe fehlt am Ende von breit? Verlängere das Wiewort mit einem Nomen."
                frame: "brei_"
                options: ["d", "t"]
                answer: ["t"]
                hints: ["Verlängere: eine breite Straße."]
              - id: l2-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "spät" }
                answer: true
                hints: ["Verlängere: der späte Bus."]
              - id: l2-s5
                type: fill_in_blank
                text: "Setz die Buchstaben ein."
                say: "Das Feld ist weit. Welche Buchstaben fehlen? Verlängere beide Wörter."
                frame: "Das Fel_ ist wei_."
                options: ["d", "t"]
                answer: ["d", "t"]
                hints: ["Verlängere beide Wörter: Felder, weite."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "d oder t? Verlängere das Wiewort."
                say: "Das Essen ist gut. Welcher Buchstabe fehlt am Ende von gut? Verlängere das Wiewort mit einem Nomen."
                frame: "gu_"
                options: ["d", "t"]
                answer: ["t"]
              - id: l2-n2
                type: multiple_choice
                text: "Welches Wort hilft dir bei Mund?"
                say: "Welches Wort hilft dir, wenn du Mund schreiben willst?"
                options: ["Münder", "Mond", "munter"]
                answer: "Münder"
              - id: l2-n3
                type: fill_in_blank
                text: "d oder t? Verlängere."
                say: "Das Heft. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "das Hef_"
                options: ["d", "t"]
                answer: ["t"]
              - id: l2-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Freund" }
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Setz die Buchstaben ein."
                say: "Das Bad ist kalt. Welche Buchstaben fehlen? Verlängere beide Wörter."
                frame: "Das Ba_ ist kal_."
                options: ["d", "t"]
                answer: ["d", "t"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "d oder t? Verlängere."
            say: "Das Lied. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "das Lie_"
            options: ["d", "t"]
            answer: ["d"]
          - id: l2-c2
            type: fill_in_blank
            text: "d oder t? Verlängere das Wiewort."
            say: "Lenas Haar ist blond. Welcher Buchstabe fehlt am Ende von blond? Verlängere das Wiewort mit einem Nomen."
            frame: "blon_"
            options: ["d", "t"]
            answer: ["d"]
          - id: l2-c3
            type: multiple_choice
            text: "Welches Wort hilft dir bei Kleid?"
            say: "Welches Wort hilft dir, wenn du Kleid schreiben willst?"
            options: ["Kleider", "klein", "Kleber"]
            answer: "Kleider"
          - id: l2-c4
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Pfert" }
            answer: false
          - id: l2-c5
            type: fill_in_blank
            text: "Setz die Buchstaben ein."
            say: "Der Mund ist rot. Welche Buchstaben fehlen? Verlängere beide Wörter."
            frame: "Der Mun_ ist ro_."
            options: ["d", "t"]
            answer: ["d", "t"]
