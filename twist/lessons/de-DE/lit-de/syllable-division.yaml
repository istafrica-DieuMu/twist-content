# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.syllable-division
skill: lit-de.spelling.syllable-division
curriculum: de-DE
language: de
title:
  de: Wörter trennen
  en: Hyphenating words
summary: >
  Splitting a word at the end of a line. Lesson 1 splits by syllables,
  keeps ch and sch together (Ku-chen, Ta-sche) and splits two Mitlaute in
  the middle (Kis-te); lesson 2 splits double Mitlaute (Son-ne), keeps ck
  together (Zu-cker) and splits tz (Kat-ze), and ends with the skill
  check.
metadata:
  year: klasse-3
  topic: { de: Silben und Trennung, en: Syllables and hyphenation }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling.ck-tz]
  also_practises: [lit-de.spelling-strategies.syllable-swinging, lit-de.spelling.double-consonants]
  vocabulary: { de: [trennen, Silbe, Trennstrich, Zeilenende] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: split-ch-sch
      what: Splits ch or sch (Kuc-hen, Tas-che)
      addressed: lesson 1 Learn keeps ch and sch together; every stage of lesson 1 has a ch or sch word with the split option, and l1-c3 shows Flas-che
    - id: split-ck
      what: Splits ck like a double letter (Jac-ke, Soc-ke)
      addressed: lesson 2 Learn shows Zu-cker; every stage of lesson 2 has a ck word, with feedback in l2-f2, and l2-f4 shows Soc-ke
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Nach Silben trennen", en: "Splitting by syllables" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Silben hat Fenster?"
            say: "Fenster. Wie viele Silben hat das Wort?"
            show: { object: window }
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "ck oder k?"
            say: "Die Jacke. Was fehlt?"
            show: { object: jacket }
            frame: "Ja_e"
            options: ["ck", "k"]
            answer: ["ck"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ba-na-ne"
            say: "Am Ende einer Zeile darfst du ein Wort trennen. Du trennst es nach Silben, so wie beim Schwingen: Ba-na-ne."
          - text: "Ku-chen | Ta-sche"
            say: "Ch und sch bleiben zusammen, weil sie wie ein Laut klingen: Ku-chen, Ta-sche."
          - text: "Kis-te | Fens-ter"
            say: "Stehen in der Mitte mehrere Mitlaute, kommt nur der letzte in die nächste Silbe: Kis-te, Fens-ter."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie trennst du Gurke?"
                say: "Gurke. Wie trennst du das Wort?"
                options: ["Gur-ke", "Gu-rke", "Gurk-e"]
                answer: "Gur-ke"
                option_audio: false
                hints:
                  - "Schwinge das Wort."
                  - "In der Mitte stehen zwei Mitlaute, r und k. Welcher kommt in die nächste Silbe?"
                  - "Gur-ke."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie trennst du Bücher?"
                say: "Bücher. Wie trennst du das Wort?"
                options: ["Bü-cher", "Büc-her", "Büch-er"]
                answer: "Bü-cher"
                option_audio: false
                feedback:
                  "Büc-her": "Ch klingt wie ein Laut und bleibt zusammen."
                hints:
                  - "Schwinge das Wort."
                  - "Ch klingt wie ein Laut. Darf man es auseinanderreißen?"
                  - "Ch bleibt zusammen: Bü-cher."
              - id: l1-f3
                type: true_false
                text: "Ist das Wort richtig getrennt?"
                say: "Lampe. Ist das Wort richtig getrennt?"
                show: { drawn: letter-card, text: "Lam-pe" }
                answer: true
                hints:
                  - "Schwinge das Wort."
                  - "In der Mitte stehen m und p. Kommt jeder in eine andere Silbe?"
                  - "Ja, das ist richtig."
              - id: l1-f4
                type: multiple_choice
                text: "Wie trennst du Wolke?"
                say: "Wolke. Wie trennst du das Wort?"
                options: ["Wol-ke", "Wo-lke", "Wolk-e"]
                answer: "Wol-ke"
                option_audio: false
                hints:
                  - "Schwinge das Wort."
                  - "In der Mitte stehen l und k. Nur der letzte kommt in die nächste Silbe."
                  - "Wol-ke."
              - id: l1-f5
                type: multiple_choice
                text: "Welches Wort ist richtig getrennt?"
                say: "Welches Wort ist richtig getrennt?"
                options: ["Du-sche", "Dus-che", "Dusc-he"]
                answer: "Du-sche"
                option_audio: false
                hints:
                  - "Wie klingt sch?"
                  - "Sch klingt wie ein Laut. Darf man es auseinanderreißen?"
                  - "Sch bleibt zusammen: Du-sche."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie trennst du Garten?"
                say: "Garten. Wie trennst du das Wort?"
                options: ["Gar-ten", "Ga-rten", "Gart-en"]
                answer: "Gar-ten"
                option_audio: false
                hints: ["Schwinge das Wort."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie trennst du Fische?"
                say: "Fische. Wie trennst du das Wort?"
                options: ["Fi-sche", "Fis-che", "Fisch-e"]
                answer: "Fi-sche"
                option_audio: false
                hints: ["Sch bleibt zusammen."]
              - id: l1-s3
                type: true_false
                text: "Ist das Wort richtig getrennt?"
                say: "Mädchen. Ist das Wort richtig getrennt?"
                show: { drawn: letter-card, text: "Mäd-chen" }
                answer: true
                hints: ["Schwinge das Wort. Bleibt ch zusammen?"]
              - id: l1-s4
                type: multiple_choice
                text: "Wie trennst du Schwester?"
                say: "Schwester. Wie trennst du das Wort?"
                options: ["Schwes-ter", "Schwe-ster", "Schw-ester"]
                answer: "Schwes-ter"
                option_audio: false
                hints: ["Zwei Mitlaute in der Mitte werden verteilt."]
              - id: l1-s5
                type: multiple_choice
                text: "Welches Wort ist richtig getrennt?"
                say: "Welches Wort ist richtig getrennt?"
                options: ["Wä-sche", "Wäs-che", "Wäsch-e"]
                answer: "Wä-sche"
                option_audio: false
                hints: ["Sch bleibt zusammen."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie trennst du Kinder?"
                say: "Kinder. Wie trennst du das Wort?"
                options: ["Kin-der", "Ki-nder", "Kind-er"]
                answer: "Kin-der"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Wie trennst du Drachen?"
                say: "Drachen. Wie trennst du das Wort?"
                options: ["Dra-chen", "Drac-hen", "Drach-en"]
                answer: "Dra-chen"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Ist das Wort richtig getrennt?"
                say: "Kasten. Ist das Wort richtig getrennt?"
                show: { drawn: letter-card, text: "Kas-ten" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Wie trennst du Muschel?"
                say: "Muschel. Wie trennst du das Wort?"
                options: ["Mu-schel", "Mus-chel", "Musch-el"]
                answer: "Mu-schel"
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Welches Wort ist richtig getrennt?"
                say: "Welches Wort ist richtig getrennt?"
                options: ["Win-ter", "Wi-nter", "Wint-er"]
                answer: "Win-ter"
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie trennst du Becher?"
            say: "Becher. Wie trennst du das Wort?"
            options: ["Be-cher", "Bec-her", "Bech-er"]
            answer: "Be-cher"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Wie trennst du Kerze?"
            say: "Kerze. Wie trennst du das Wort?"
            options: ["Ker-ze", "Ke-rze", "Kerz-e"]
            answer: "Ker-ze"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Ist das Wort richtig getrennt?"
            say: "Flasche. Ist das Wort richtig getrennt?"
            show: { drawn: letter-card, text: "Flas-che" }
            answer: false

  - n: 2
    title: { de: "Doppelte Mitlaute, ck und tz", en: "Double letters, ck and tz" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie trennst du Nase?"
            say: "Nase. Wie trennst du das Wort?"
            options: ["Na-se", "Nas-e", "N-ase"]
            answer: "Na-se"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie trennst du Hunde?"
            say: "Hunde. Wie trennst du das Wort?"
            options: ["Hun-de", "Hu-nde", "Hund-e"]
            answer: "Hun-de"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Son-ne | Tel-ler"
            say: "Doppelte Mitlaute werden getrennt. Ein Buchstabe kommt in die erste Silbe, einer in die zweite: Son-ne, Tel-ler."
          - text: "Zu-cker | Bä-cker"
            say: "Ck wird nicht getrennt. Es kommt ganz in die nächste Silbe: Zu-cker, Bä-cker."
          - text: "Kat-ze | Müt-ze"
            say: "Tz dagegen wird getrennt: Kat-ze, Müt-ze."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie trennst du Kanne?"
                say: "Kanne. Wie trennst du das Wort?"
                options: ["Kan-ne", "Ka-nne", "Kann-e"]
                answer: "Kan-ne"
                option_audio: false
                hints:
                  - "Was machst du mit doppelten Mitlauten?"
                  - "Kanne hat zwei n. Bleiben beide zusammen?"
                  - "Ein n kommt in jede Silbe: Kan-ne."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie trennst du Jacke?"
                say: "Jacke. Wie trennst du das Wort?"
                options: ["Ja-cke", "Jac-ke", "Jack-e"]
                answer: "Ja-cke"
                option_audio: false
                feedback:
                  "Jac-ke": "Ck wird nicht getrennt. Es kommt ganz in die zweite Silbe."
                hints:
                  - "Was passiert mit ck beim Trennen?"
                  - "Ck bleibt zusammen und kommt in die nächste Silbe."
                  - "Ja-cke."
              - id: l2-f3
                type: multiple_choice
                text: "Wie trennst du Pfütze?"
                say: "Pfütze. Wie trennst du das Wort?"
                options: ["Pfüt-ze", "Pfü-tze", "Pfütz-e"]
                answer: "Pfüt-ze"
                option_audio: false
                hints:
                  - "Was passiert mit tz beim Trennen?"
                  - "Tz ist nicht wie ck. Tz darfst du trennen."
                  - "t in die erste Silbe, z in die zweite: Pfüt-ze."
              - id: l2-f4
                type: true_false
                text: "Ist das Wort richtig getrennt?"
                say: "Socke. Ist das Wort richtig getrennt?"
                show: { drawn: letter-card, text: "Soc-ke" }
                answer: false
                hints:
                  - "Was weißt du über ck beim Trennen?"
                  - "Schau genau: Hier steht c in der ersten Silbe und k in der zweiten."
                  - "Nein. Ck bleibt zusammen. Richtig ist So-cke."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Wort ist richtig getrennt?"
                say: "Welches Wort ist richtig getrennt?"
                options: ["Mut-ter", "Mu-tter", "Mutt-er"]
                answer: "Mut-ter"
                option_audio: false
                hints:
                  - "Mutter hat einen doppelten Mitlaut."
                  - "Was machst du mit den zwei t?"
                  - "Ein t in jede Silbe: Mut-ter."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie trennst du Puppe?"
                say: "Puppe. Wie trennst du das Wort?"
                options: ["Pup-pe", "Pu-ppe", "Pupp-e"]
                answer: "Pup-pe"
                option_audio: false
                hints: ["Doppelte Mitlaute werden getrennt."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie trennst du Glocke?"
                say: "Glocke. Wie trennst du das Wort?"
                options: ["Glo-cke", "Gloc-ke", "Glock-e"]
                answer: "Glo-cke"
                option_audio: false
                hints: ["Ck bleibt zusammen."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie trennst du Hitze?"
                say: "Hitze. Wie trennst du das Wort?"
                options: ["Hit-ze", "Hi-tze", "Hitz-e"]
                answer: "Hit-ze"
                option_audio: false
                hints: ["Tz wird getrennt."]
              - id: l2-s4
                type: true_false
                text: "Ist das Wort richtig getrennt?"
                say: "Schnecke. Ist das Wort richtig getrennt?"
                show: { drawn: letter-card, text: "Schne-cke" }
                answer: true
                hints: ["Bleibt ck zusammen?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Wort ist richtig getrennt?"
                say: "Welches Wort ist richtig getrennt?"
                options: ["Tas-se", "Ta-sse", "Tass-e"]
                answer: "Tas-se"
                option_audio: false
                hints: ["Doppelte Mitlaute werden getrennt."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie trennst du Himmel?"
                say: "Himmel. Wie trennst du das Wort?"
                options: ["Him-mel", "Hi-mmel", "Himm-el"]
                answer: "Him-mel"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "Wie trennst du Decke?"
                say: "Decke. Wie trennst du das Wort?"
                options: ["De-cke", "Dec-ke", "Deck-e"]
                answer: "De-cke"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Wie trennst du Tatze?"
                say: "Tatze. Wie trennst du das Wort?"
                options: ["Tat-ze", "Ta-tze", "Tatz-e"]
                answer: "Tat-ze"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Ist das Wort richtig getrennt?"
                say: "Witze. Ist das Wort richtig getrennt?"
                show: { drawn: letter-card, text: "Wi-tze" }
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Welches Wort ist richtig getrennt?"
                say: "Welches Wort ist richtig getrennt?"
                options: ["Zim-mer", "Zi-mmer", "Zimm-er"]
                answer: "Zim-mer"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie trennst du Brille?"
            say: "Brille. Wie trennst du das Wort?"
            show: { object: glasses }
            options: ["Bril-le", "Bri-lle", "Brill-e"]
            answer: "Bril-le"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Wie trennst du Rücken?"
            say: "Rücken. Wie trennst du das Wort?"
            options: ["Rü-cken", "Rüc-ken", "Rück-en"]
            answer: "Rü-cken"
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "Wie trennst du Spitze?"
            say: "Spitze. Wie trennst du das Wort?"
            options: ["Spit-ze", "Spi-tze", "Spitz-e"]
            answer: "Spit-ze"
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Wie trennst du Küche?"
            say: "Küche. Wie trennst du das Wort?"
            show: { object: kitchen }
            options: ["Kü-che", "Küc-he", "Küch-e"]
            answer: "Kü-che"
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Ist das Wort richtig getrennt?"
            say: "Wolle. Ist das Wort richtig getrennt?"
            show: { drawn: letter-card, text: "Wol-le" }
            answer: true
