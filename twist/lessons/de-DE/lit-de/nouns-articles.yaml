# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.nouns-articles
skill: lit-de.nouns.articles
curriculum: de-DE
language: de
title:
  de: "der, die, das und ein, eine"
  en: "Articles: der, die, das and ein, eine"
summary: >
  Children find the Begleiter of a Nomen: der, die or das, and then ein
  or eine. The trick a class uses is to say the word aloud with each
  Begleiter and listen for the one that sounds right. Lesson 1 practises
  der, die and das with pictures and short word cards; lesson 2 adds ein
  and eine, links der and das to ein and die to eine, and ends with the
  skill check.
metadata:
  year: klasse-1
  topic: { de: Nomen, en: Nouns }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.nouns.recognise]
  also_practises: [lit-de.nouns.recognise]
  vocabulary: { de: [Begleiter, Artikel, der, die, das, ein, eine] }
  forms: [picture, drawn, audio]
  drawn: [word-card]
  facets: []
  misconceptions:
    - id: natural-gender
      what: Picks the Begleiter by what the thing is like (a big animal is der, a small one die), not by the word
      addressed: "tasks set der Elefant against die Maus and das Zebra; feedback on l1-f2 says the word decides, not the size"
    - id: ein-for-all
      what: Uses ein with every Nomen, also with die-words (ein Katze)
      addressed: "lesson 2 Learn links die to eine; l2-f2 and l2-s2 ask for eine with die-words, with feedback on ein"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "der, die, das", en: "der, die, das" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Welches Wort ist ein Nomen?"
            options: ["Tasche", "rennen", "blau"]
            answer: "Tasche"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ist das ein Nomen?"
            say: "Ente. Ist das Wort Ente ein Nomen?"
            show: { object: duck }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "der Löwe"
            say: "Vor einem Nomen steht oft ein Begleiter. Der Löwe."
            show: { object: lion }
          - text: "die Sonne  das Haus"
            say: "Es gibt drei Begleiter: der, die und das. Die Sonne. Das Haus."
            show: { objects: [sun, house] }
          - text: "der? die? das?"
            say: "Welcher passt? Sag das Wort mit allen drei: der Ball, die Ball, das Ball. Was klingt richtig? Der Ball."
            show: { object: ball }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "der, die oder das?"
                say: "Katze. Heißt es der, die oder das Katze?"
                show: { object: cat }
                options: ["der", "die", "das"]
                keep_order: true
                answer: "die"
                hints:
                  - "Sag das Wort mit allen drei Begleitern."
                  - "Der Katze, die Katze, das Katze. Was klingt richtig?"
                  - "Die Katze."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "der, die oder das?"
                say: "Maus. Heißt es der, die oder das Maus?"
                show: { object: mouse }
                options: ["der", "die", "das"]
                keep_order: true
                answer: "die"
                feedback:
                  der: "Eine Maus ist klein, ein Elefant ist groß. Aber das sagt nichts über den Begleiter. Hör hin: die Maus."
                  das: "Hör genau hin: das Maus klingt falsch. Es heißt die Maus."
                hints:
                  - "Es kommt nicht darauf an, wie groß das Tier ist. Sag es laut."
                  - "Der Maus, die Maus, das Maus."
                  - "Die Maus."
              - id: l1-f3
                type: fill_in_blank
                text: "Welcher Begleiter passt?"
                say: "Haus. Welcher Begleiter passt?"
                show: { object: house }
                frame: "_ Haus"
                options: ["der", "die", "das"]
                answer: ["das"]
                hints:
                  - "Sag das Wort mit allen drei Begleitern."
                  - "Der Haus? Die Haus? Das Haus?"
                  - "Das Haus."
              - id: l1-f4
                type: sorting
                text: "der, die oder das?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu der, die oder das."
                bins:
                  - { id: der, show: { text: "der" }, say: "der" }
                  - { id: die, show: { text: "die" }, say: "die" }
                  - { id: das, show: { text: "das" }, say: "das" }
                options:
                  - { object: tree, bin: der }
                  - { object: banana, bin: die }
                  - { object: egg, bin: das }
                hints:
                  - "Sag jedes Wort mit der, die und das."
                  - "Der Baum, die Banane, das Ei."
                  - "Baum zu der, Banane zu die, Ei zu das."
              - id: l1-f5
                type: true_false
                text: "Heißt es „das Sonne“?"
                say: "Hör zu: das Sonne. Stimmt das?"
                show: { object: sun }
                answer: false
                hints:
                  - "Sag es laut. Klingt das Sonne richtig?"
                  - "Probier die anderen Begleiter: der? die?"
                  - "Nein. Es heißt die Sonne."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "der, die oder das?"
                say: "Elefant. Heißt es der, die oder das Elefant?"
                show: { object: elephant }
                options: ["der", "die", "das"]
                keep_order: true
                answer: "der"
                hints: ["Sag es mit allen drei."]
              - id: l1-s2
                type: fill_in_blank
                text: "Welcher Begleiter passt?"
                say: "Buch. Welcher Begleiter passt?"
                show: { object: book }
                frame: "_ Buch"
                options: ["der", "die", "das"]
                answer: ["das"]
                hints: ["Der Buch? Das Buch?"]
              - id: l1-s3
                type: sorting
                text: "der, die oder das?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu der, die oder das."
                bins:
                  - { id: der, show: { text: "der" }, say: "der" }
                  - { id: die, show: { text: "die" }, say: "die" }
                  - { id: das, show: { text: "das" }, say: "das" }
                options:
                  - { object: moon, bin: der }
                  - { object: lamp, bin: die }
                  - { object: car, bin: das }
                  - { object: shoe, bin: der }
                hints: ["Der Mond, die Lampe, das Auto, der Schuh."]
              - id: l1-s4
                type: true_false
                text: "Heißt es „das Zebra“?"
                say: "Hör zu: das Zebra. Stimmt das?"
                show: { object: zebra }
                answer: true
                hints: ["Sag es laut: das Zebra."]
              - id: l1-s5
                type: multiple_choice
                text: "der, die oder das?"
                say: "Tasse. Heißt es der, die oder das Tasse?"
                show: { object: cup }
                options: ["der", "die", "das"]
                keep_order: true
                answer: "die"
                hints: ["Die Tasse oder der Tasse?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welcher Begleiter passt?"
                say: "Tisch. Welcher Begleiter passt?"
                show: { object: table }
                frame: "_ Tisch"
                options: ["der", "die", "das"]
                answer: ["der"]
              - id: l1-n2
                type: multiple_choice
                text: "der, die oder das?"
                say: "Messer. Heißt es der, die oder das Messer?"
                show: { object: knife }
                options: ["der", "die", "das"]
                keep_order: true
                answer: "das"
              - id: l1-n3
                type: true_false
                text: "Heißt es „die Hund“?"
                say: "Hör zu: die Hund. Stimmt das?"
                show: { object: dog }
                answer: false
              - id: l1-n4
                type: sorting
                text: "der, die oder das?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu der, die oder das."
                bins:
                  - { id: der, show: { text: "der" }, say: "der" }
                  - { id: die, show: { text: "die" }, say: "die" }
                  - { id: das, show: { text: "das" }, say: "das" }
                options:
                  - { object: fish, bin: der }
                  - { object: rose, bin: die }
                  - { object: bed, bin: das }
                  - { object: giraffe, bin: die }
              - id: l1-n5
                type: multiple_choice
                text: "der, die oder das?"
                say: "Löffel. Heißt es der, die oder das Löffel?"
                show: { object: spoon }
                options: ["der", "die", "das"]
                keep_order: true
                answer: "der"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "der, die oder das?"
            say: "Nase. Heißt es der, die oder das Nase?"
            show: { object: nose }
            options: ["der", "die", "das"]
            keep_order: true
            answer: "die"
          - id: l1-c2
            type: fill_in_blank
            text: "Welcher Begleiter passt?"
            say: "Boot. Welcher Begleiter passt?"
            show: { object: boat }
            frame: "_ Boot"
            options: ["der", "die", "das"]
            answer: ["das"]
          - id: l1-c3
            type: true_false
            text: "Heißt es „der Apfel“?"
            say: "Hör zu: der Apfel. Stimmt das?"
            show: { object: apple }
            answer: true

  - n: 2
    title: { de: "ein und eine", en: "ein and eine" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "der, die oder das?"
            say: "Hase. Heißt es der, die oder das Hase?"
            show: { object: rabbit }
            options: ["der", "die", "das"]
            keep_order: true
            answer: "der"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Welcher Begleiter passt?"
            say: "Blatt. Welcher Begleiter passt?"
            show: { object: leaf }
            frame: "_ Blatt"
            options: ["der", "die", "das"]
            answer: ["das"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "ein Hund  ein Haus"
            say: "Es gibt noch andere Begleiter: ein und eine. Der Hund wird zu ein Hund. Das Haus wird zu ein Haus."
            show: { objects: [dog, house] }
          - text: "eine Katze"
            say: "Die Katze wird zu eine Katze. Zu die gehört eine."
            show: { object: cat }
          - text: "der, das: ein  die: eine"
            say: "Merk dir: der und das werden ein. Die wird eine. Weißt du den einen Begleiter, findest du auch den anderen."
            show: { drawn: word-card, text: "die → eine" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "ein oder eine?"
                say: "Ball. Heißt es ein Ball oder eine Ball?"
                show: { object: ball }
                options: ["ein", "eine"]
                keep_order: true
                answer: "ein"
                hints:
                  - "Wie heißt es mit der, die oder das?"
                  - "Der Ball. Der wird zu ein."
                  - "Ein Ball."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "ein oder eine?"
                say: "Banane. Heißt es ein Banane oder eine Banane?"
                show: { object: banana }
                options: ["ein", "eine"]
                keep_order: true
                answer: "eine"
                feedback:
                  ein: "Es heißt die Banane. Zu die gehört eine: eine Banane."
                hints:
                  - "Wie heißt es mit der, die oder das?"
                  - "Die Banane. Die wird zu eine."
                  - "Eine Banane."
              - id: l2-f3
                type: fill_in_blank
                text: "Welcher Begleiter passt?"
                say: "Ei. Ein oder eine?"
                show: { object: egg }
                frame: "_ Ei"
                options: ["ein", "eine"]
                answer: ["ein"]
                hints:
                  - "Wie heißt es mit das oder die?"
                  - "Das Ei. Das wird zu ein."
                  - "Ein Ei."
              - id: l2-f4
                type: matching
                text: "Was gehört zusammen?"
                say: "Welcher Begleiter gehört zu welchem? Verbinde."
                option_audio: false
                pairs:
                  - { left: { text: "die Rose" }, right: { text: "eine Rose" } }
                  - { left: { text: "der Igel" }, right: { text: "ein Igel" } }
                hints:
                  - "Die wird zu eine. Der wird zu ein."
                  - "Schau auf das Nomen: Es bleibt gleich."
                  - "Die Rose zu eine Rose, der Igel zu ein Igel."
              - id: l2-f5
                type: true_false
                text: "Heißt es „ein Katze“?"
                say: "Hör zu: ein Katze. Stimmt das?"
                show: { object: cat }
                answer: false
                hints:
                  - "Wie heißt es mit die oder der?"
                  - "Die Katze. Was wird aus die?"
                  - "Nein. Es heißt eine Katze."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "ein oder eine?"
                say: "Auto. Heißt es ein Auto oder eine Auto?"
                show: { object: car }
                options: ["ein", "eine"]
                keep_order: true
                answer: "ein"
                hints: ["Das Auto."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welcher Begleiter passt?"
                say: "Mütze. Ein oder eine?"
                show: { object: woolly-hat }
                frame: "_ Mütze"
                options: ["ein", "eine"]
                answer: ["eine"]
                hints: ["Die Mütze."]
              - id: l2-s3
                type: sorting
                text: "ein oder eine?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu ein oder eine."
                bins:
                  - { id: ein, show: { text: "ein" }, say: "ein" }
                  - { id: eine, show: { text: "eine" }, say: "eine" }
                options:
                  - { object: star, bin: ein }
                  - { object: bee, bin: eine }
                  - { object: bike, bin: ein }
                  - { object: cup, bin: eine }
                hints: ["Sag es erst mit der, die oder das."]
              - id: l2-s4
                type: true_false
                text: "Heißt es „eine Ente“?"
                say: "Hör zu: eine Ente. Stimmt das?"
                show: { object: duck }
                answer: true
                hints: ["Die Ente."]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Begleiter passt?"
                say: "Kind. Welcher Begleiter passt? Der, die oder das?"
                show: { object: child }
                options: ["der", "die", "das"]
                keep_order: true
                answer: "das"
                hints: ["Ein Kind. Ein kommt von der oder von das."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "ein oder eine?"
                say: "Schere. Heißt es ein Schere oder eine Schere?"
                show: { object: scissors }
                options: ["ein", "eine"]
                keep_order: true
                answer: "eine"
              - id: l2-n2
                type: fill_in_blank
                text: "Welcher Begleiter passt?"
                say: "Fuchs. Ein oder eine?"
                show: { object: fox }
                frame: "_ Fuchs"
                options: ["ein", "eine"]
                answer: ["ein"]
              - id: l2-n3
                type: matching
                text: "Was gehört zusammen?"
                say: "Welcher Begleiter gehört zu welchem? Verbinde."
                option_audio: false
                pairs:
                  - { left: { text: "das Bett" }, right: { text: "ein Bett" } }
                  - { left: { text: "die Uhr" }, right: { text: "eine Uhr" } }
                  - { left: { text: "der Bus" }, right: { text: "ein Bus" } }
              - id: l2-n4
                type: true_false
                text: "Heißt es „eine Stuhl“?"
                say: "Hör zu: eine Stuhl. Stimmt das?"
                show: { object: chair }
                answer: false
              - id: l2-n5
                type: sorting
                text: "ein oder eine?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu ein oder eine."
                bins:
                  - { id: ein, show: { text: "ein" }, say: "ein" }
                  - { id: eine, show: { text: "eine" }, say: "eine" }
                options:
                  - { object: snake, bin: eine }
                  - { object: cake, bin: ein }
                  - { object: jacket, bin: eine }
                  - { object: dress, bin: ein }

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "der, die oder das?"
            say: "Wolke. Heißt es der, die oder das Wolke?"
            show: { object: cloud }
            options: ["der", "die", "das"]
            keep_order: true
            answer: "die"
          - id: l2-c2
            type: multiple_choice
            text: "der, die oder das?"
            say: "Schwein. Heißt es der, die oder das Schwein?"
            show: { object: pig }
            options: ["der", "die", "das"]
            keep_order: true
            answer: "das"
          - id: l2-c3
            type: fill_in_blank
            text: "Welcher Begleiter passt?"
            say: "Biene. Ein oder eine?"
            show: { object: bee }
            frame: "_ Biene"
            options: ["ein", "eine"]
            answer: ["eine"]
          - id: l2-c4
            type: true_false
            text: "Heißt es „ein Vogel“?"
            say: "Hör zu: ein Vogel. Stimmt das?"
            show: { object: bird }
            answer: true
          - id: l2-c5
            type: sorting
            text: "Welcher Begleiter gehört dazu?"
            say: "Sortiere die Bilder nach ihrem Begleiter: der, die oder das."
            bins:
              - { id: der, show: { text: "der" }, say: "der" }
              - { id: die, show: { text: "die" }, say: "die" }
              - { id: das, show: { text: "das" }, say: "das" }
            options:
              - { object: frog, bin: der }
              - { object: clock, bin: die }
              - { object: t-shirt, bin: das }
