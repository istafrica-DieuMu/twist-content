# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.syllable-swinging
skill: lit-de.spelling-strategies.syllable-swinging
curriculum: de-DE
language: de
title:
  de: Silben schwingen
  en: Swinging syllables
summary: >
  Silbenschwingen as a spelling strategy. Lesson 1 swings words into
  syllables, counts them and builds words from syllable cards; lesson 2
  speaks every sound of each syllable while writing, finds the letters
  that fast speaking loses (Tomte for Tomate), and ends with the skill
  check.
metadata:
  year: klasse-2
  topic: { de: Rechtschreibstrategien, en: Spelling strategies }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.phonological.syllables, lit-de.spelling.write-by-sound]
  also_practises: [lit-de.phonological.syllables, lit-de.spelling.vowels-consonants]
  vocabulary: { de: [Silbe, schwingen, Silbenbogen, mitsprechen] }
  forms: [picture, drawn, text, audio]
  drawn: [syllable-arcs, letter-card]
  facets: []
  misconceptions:
    - id: split-after-vowel
      what: Splits a word in the wrong place (Ig-el, Of-en, Tom-at-e)
      addressed: "\"Wie schwingst du …?\" in every stage of lesson 1 offers wrong splits; l1-f4 and l1-n4 show wrongly split arcs to judge"
    - id: lost-sounds
      what: Drops sounds when speaking fast (Tomte, Bume, Elefnt, Schmeterlin)
      addressed: lesson 2 Learn shows Tomate syllable by syllable and Blume sound by sound; every stage of lesson 2 has a missing-letter gap and a word card to judge (Schmeterlin, Elefnt, Telefon)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Silben schwingen", en: "Swinging syllables" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Silben hat Sonne?"
            say: "Sonne. Wie viele Silben hat das Wort?"
            show: { object: sun }
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was reimt sich auf Hose?"
            say: "Was reimt sich auf Hose?"
            options: ["Rose", "Hase", "Nase"]
            answer: "Rose"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ba-na-ne"
            say: "Beim Silbenschwingen sprichst du ein Wort langsam und schwingst bei jeder Silbe mit dem Arm: Ba, na, ne. Banane hat drei Silben."
            show: { drawn: syllable-arcs, word: "Banane", syllables: ["Ba", "na", "ne"] }
          - text: "Kro-ko-dil"
            say: "Sprich jede Silbe deutlich: Kro, ko, dil. So hörst du jeden Laut."
            show: { drawn: syllable-arcs, word: "Krokodil", syllables: ["Kro", "ko", "dil"] }
          - text: "Schmet-ter-ling"
            say: "Auch lange Wörter kannst du schwingen: Schmet, ter, ling. Dann schreibst du Silbe für Silbe."
            show: { object: butterfly }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Silben hat Elefant?"
                say: "Elefant. Schwinge das Wort. Wie viele Silben hat es?"
                show: { object: elephant }
                options: ["2", "3", "4"]
                answer: "3"
                hints:
                  - "Sprich langsam und schwinge mit dem Arm."
                  - "E, le, fant. Wie oft hast du geschwungen?"
                  - "Elefant hat 3 Silben."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie schwingst du Tomate?"
                say: "Wie schwingst du das Wort Tomate?"
                options: ["To-ma-te", "Tom-at-e", "T-oma-te"]
                answer: "To-ma-te"
                hints:
                  - "Sprich langsam und schwinge mit."
                  - "Die erste Silbe ist To. Wie geht es weiter?"
                  - "To-ma-te."
              - id: l1-f3
                type: ordering
                text: "Bau das Wort aus den Silben."
                say: "Giraffe. Leg die Silben in die richtige Reihenfolge."
                show: { object: giraffe }
                options: ["raf", "Gi", "fe"]
                slot_count: 3
                answer: ["Gi", "raf", "fe"]
                option_audio: false
                hints:
                  - "Sprich das Wort langsam und schwinge mit."
                  - "Zuerst kommt Gi. Was hörst du danach?"
                  - "Gi, raf, fe."
              - id: l1-f4
                type: true_false
                text: "Ist das richtig geschwungen?"
                say: "Igel. Sind die Silbenbögen richtig?"
                show: { drawn: syllable-arcs, word: "Igel", syllables: ["Ig", "el"] }
                answer: false
                hints:
                  - "Sprich das Wort langsam und schwinge mit."
                  - "Wo machst du die Pause? Nach dem I oder nach dem g?"
                  - "Nein. Richtig ist I-gel."
              - id: l1-f5
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Telefon. Welche Silbe fehlt?"
                show: { object: telephone }
                frame: "Te_fon"
                options: ["le", "la", "li"]
                answer: ["le"]
                hints:
                  - "Schwinge das Wort langsam mit dem Arm."
                  - "Te, dann kommt eine Silbe, dann fon. Was hörst du in der Mitte?"
                  - "Es fehlt le."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Silben hat Schulranzen?"
                say: "Schulranzen. Schwinge das Wort. Wie viele Silben hat es?"
                show: { object: schoolbag }
                options: ["2", "3", "4"]
                answer: "3"
                hints: ["Sprich langsam und schwinge mit dem Arm."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie schwingst du Lineal?"
                say: "Wie schwingst du das Wort Lineal?"
                options: ["Li-ne-al", "Lin-e-al", "L-in-eal"]
                answer: "Li-ne-al"
                hints: ["Hör auf jede Silbe."]
              - id: l1-s3
                type: ordering
                text: "Bau das Wort aus den Silben."
                say: "Ameise. Leg die Silben in die richtige Reihenfolge."
                show: { object: ant }
                options: ["mei", "se", "A"]
                slot_count: 3
                answer: ["A", "mei", "se"]
                option_audio: false
                hints: ["Sprich das Wort langsam und hör, was zuerst kommt."]
              - id: l1-s4
                type: true_false
                text: "Ist das richtig geschwungen?"
                say: "Katze. Sind die Silbenbögen richtig?"
                show: { drawn: syllable-arcs, word: "Katze", syllables: ["Kat", "ze"] }
                answer: true
                hints: ["Sprich das Wort langsam: Kat, ze."]
              - id: l1-s5
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Spiegel. Welche Silbe fehlt?"
                show: { object: mirror }
                frame: "Spie_"
                options: ["gel", "kel", "gal"]
                answer: ["gel"]
                hints: ["Schwinge das Wort: Spie, gel."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Silben hat Ananas?"
                say: "Ananas. Schwinge das Wort. Wie viele Silben hat es?"
                show: { object: pineapple }
                options: ["2", "3", "4"]
                answer: "3"
              - id: l1-n2
                type: multiple_choice
                text: "Wie schwingst du Löffel?"
                say: "Wie schwingst du das Wort Löffel?"
                options: ["Löf-fel", "Lö-ffel", "Löff-el"]
                answer: "Löf-fel"
              - id: l1-n3
                type: ordering
                text: "Bau das Wort aus den Silben."
                say: "Oktopus. Leg die Silben in die richtige Reihenfolge."
                show: { object: octopus }
                options: ["to", "Ok", "pus"]
                slot_count: 3
                answer: ["Ok", "to", "pus"]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Ist das richtig geschwungen?"
                say: "Ofen. Sind die Silbenbögen richtig?"
                show: { drawn: syllable-arcs, word: "Ofen", syllables: ["Of", "en"] }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Murmel. Welche Silbe fehlt?"
                show: { object: marble }
                frame: "Mur_"
                options: ["mel", "mal", "mil"]
                answer: ["mel"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Silben hat Radiergummi?"
            say: "Radiergummi. Schwinge das Wort. Wie viele Silben hat es?"
            show: { object: rubber }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l1-c2
            type: ordering
            text: "Bau das Wort aus den Silben."
            say: "Möhre. Leg die Silben in die richtige Reihenfolge."
            show: { object: carrot }
            options: ["re", "Möh"]
            slot_count: 2
            answer: ["Möh", "re"]
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Ist das richtig geschwungen?"
            say: "Rose. Sind die Silbenbögen richtig?"
            show: { drawn: syllable-arcs, word: "Rose", syllables: ["Ro", "se"] }
            answer: true

  - n: 2
    title: { de: "Beim Schreiben mitsprechen", en: "Speaking while writing" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Silben hat Schmetterling?"
            say: "Schmetterling. Schwinge das Wort. Wie viele Silben hat es?"
            show: { object: butterfly }
            options: ["2", "3", "4"]
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Bau das Wort aus den Silben."
            say: "Leiter. Leg die Silben in die richtige Reihenfolge."
            show: { object: ladder }
            options: ["ter", "Lei"]
            slot_count: 2
            answer: ["Lei", "ter"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ta-fel"
            say: "Wenn du schreibst, schwingst du das Wort und sprichst jede Silbe mit: Ta, fel. Dann schreibst du erst Ta und dann fel."
            show: { drawn: syllable-arcs, word: "Tafel", syllables: ["Ta", "fel"] }
          - text: "To-ma-te"
            say: "Wer zu schnell spricht, vergisst Laute und schreibt vielleicht Tomte. Beim Schwingen hörst du jede Silbe: To, ma, te. So fehlt kein Buchstabe."
            show: { drawn: syllable-arcs, word: "Tomate", syllables: ["To", "ma", "te"] }
          - text: "Blu-me"
            say: "Hör in jeder Silbe auf alle Laute. In Blu hörst du b, l und u. In me hörst du m und e."
            show: { drawn: syllable-arcs, word: "Blume", syllables: ["Blu", "me"] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Schwinge das Wort Banane. Welches Wort ist richtig geschrieben?"
                options: ["Banane", "Bane", "Banne"]
                answer: "Banane"
                option_audio: false
                hints:
                  - "Schwinge: Ba, na, ne."
                  - "Drei Silben, jede mit zwei Buchstaben."
                  - "Banane."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Kleid. Welcher Buchstabe fehlt? Sprich das Wort langsam."
                show: { object: dress }
                frame: "K_eid"
                options: ["l", "r", "n"]
                answer: ["l"]
                hints:
                  - "Sprich das Wort ganz langsam, Laut für Laut."
                  - "Nach dem K hörst du noch einen Laut, bevor ei kommt. Welcher ist es?"
                  - "Es fehlt das l."
              - id: l2-f3
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Schmetterling. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Schmeterlin" }
                answer: false
                hints:
                  - "Schwinge: Schmet, ter, ling."
                  - "Hör auf das Ende: ling."
                  - "Nein. Richtig ist Schmetterling."
              - id: l2-f4
                type: ordering
                text: "Bau das Wort aus den Silben."
                say: "Pullover. Leg die Silben in die richtige Reihenfolge."
                show: { object: jumper }
                options: ["lo", "ver", "Pul"]
                slot_count: 3
                answer: ["Pul", "lo", "ver"]
                option_audio: false
                hints:
                  - "Sprich das Wort langsam und schwinge mit."
                  - "Zuerst kommt Pul. Was hörst du danach?"
                  - "Pul, lo, ver."
              - id: l2-f5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Krokodil. Welcher Buchstabe fehlt? Sprich jede Silbe mit."
                show: { object: crocodile }
                frame: "Kr_kodil"
                options: ["o", "a", "u"]
                answer: ["o"]
                hints:
                  - "Sprich die erste Silbe: Kro."
                  - "Du hörst k und r. Was kommt danach?"
                  - "Es fehlt das o."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Schwinge das Wort Ameise. Welches Wort ist richtig geschrieben?"
                options: ["Ameise", "Amise", "Ameie"]
                answer: "Ameise"
                option_audio: false
                hints: ["Schwinge: A, mei, se."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Frosch. Welcher Buchstabe fehlt? Sprich das Wort langsam."
                show: { object: frog }
                frame: "F_osch"
                options: ["r", "l", "n"]
                answer: ["r"]
                hints: ["Sprich den Anfang langsam: Fro."]
              - id: l2-s3
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Elefant. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Elefnt" }
                answer: false
                hints: ["Schwinge: E, le, fant."]
              - id: l2-s4
                type: ordering
                text: "Bau das Wort aus den Silben."
                say: "Schulranzen. Leg die Silben in die richtige Reihenfolge."
                options: ["ran", "Schul", "zen"]
                slot_count: 3
                answer: ["Schul", "ran", "zen"]
                option_audio: false
                hints: ["Sprich das Wort langsam: Schul, ran, zen."]
              - id: l2-s5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Lineal. Welcher Buchstabe fehlt? Sprich jede Silbe mit."
                show: { object: ruler }
                frame: "Lin_al"
                options: ["e", "a", "i"]
                answer: ["e"]
                hints: ["Schwinge: Li, ne, al."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Schwinge das Wort Giraffe. Welches Wort ist richtig geschrieben?"
                options: ["Giraffe", "Graffe", "Giraffee"]
                answer: "Giraffe"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Glocke. Welcher Buchstabe fehlt? Sprich das Wort langsam."
                show: { object: bell }
                frame: "G_ocke"
                options: ["l", "r", "n"]
                answer: ["l"]
              - id: l2-n3
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Telefon. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Telefon" }
                answer: true
              - id: l2-n4
                type: ordering
                text: "Bau das Wort aus den Silben."
                say: "Radiergummi. Leg die Silben in die richtige Reihenfolge."
                options: ["dier", "gum", "Ra", "mi"]
                slot_count: 4
                answer: ["Ra", "dier", "gum", "mi"]
                option_audio: false
              - id: l2-n5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Schnecke. Welcher Buchstabe fehlt? Sprich das Wort langsam."
                show: { object: snail }
                frame: "Sch_ecke"
                options: ["n", "m", "l"]
                answer: ["n"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie viele Silben hat Kartoffel?"
            say: "Kartoffel. Schwinge das Wort. Wie viele Silben hat es?"
            options: ["2", "3", "4"]
            answer: "3"
          - id: l2-c2
            type: multiple_choice
            text: "Wie schwingst du Kartoffel?"
            say: "Wie schwingst du das Wort Kartoffel?"
            options: ["Kar-tof-fel", "Ka-rto-ffel", "Kart-off-el"]
            answer: "Kar-tof-fel"
          - id: l2-c3
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Brille. Welcher Buchstabe fehlt? Sprich das Wort langsam."
            frame: "B_ille"
            options: ["r", "l", "n"]
            answer: ["r"]
          - id: l2-c4
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Krokodil. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Krokdil" }
            answer: false
          - id: l2-c5
            type: ordering
            text: "Bau das Wort aus den Silben."
            say: "Erdbeere. Leg die Silben in die richtige Reihenfolge."
            show: { object: strawberry }
            options: ["bee", "Erd", "re"]
            slot_count: 3
            answer: ["Erd", "bee", "re"]
            option_audio: false
