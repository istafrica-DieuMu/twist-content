# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.word-stem
skill: lit-de.spelling-strategies.word-stem
curriculum: de-DE
language: de
title:
  de: Wortstamm und Wortfamilie
  en: Word stems and word families
summary: >
  Words that share a Wortstamm form a Wortfamilie, and the stem is
  spelt the same in all of them. Lesson 1 finds the stem (fahr in fahren,
  Fahrer, Fahrrad) and tells real family members from look-alikes
  (Fahne, Farbe); lesson 2 collects families with parts in front and behind
  (abfahren, Fahrt), across Nomen, Tunwörter and Wiewörter, and ends with
  the skill check.
metadata:
  year: klasse-2
  topic: { de: Wortstamm und Wortfamilie, en: Word stems and families }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling-strategies.syllable-cores]
  also_practises: [lit-de.nouns.recognise, lit-de.verbs.recognise]
  vocabulary: { de: [Wortstamm, Wortfamilie, Endung, verwandt] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: look-alike
      what: Takes a word that only looks similar as part of the family (Fahne for fahren, Hund for Hand, Spiegel for spielen)
      addressed: lesson 2 Learn shows fahren and Fahne; every "Tippe auf die Wörter" card set has look-alikes; l1-f4, l1-n4, l2-s4 and l2-c4 ask about a look-alike, and "Welches Wort gehört nicht dazu?" in every stage of lesson 2
    - id: stem-with-ending
      what: Takes the stem with part of the ending, or too short (spi, len)
      addressed: "\"Was ist der Wortstamm?\" in every stage of lesson 1 and the skill check offers a cut that is too short and the ending"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Der Wortstamm", en: "The word stem" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Silben hat Fahrrad?"
            say: "Schwinge das Wort Fahrrad. Wie viele Silben hat es?"
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Welches Wort ist ein Nomen?"
            options: ["Fahrer", "fahren", "schnell"]
            answer: "Fahrer"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "fahren | der Fahrer | das Fahrrad | die Fahrt"
            say: "In all diesen Wörtern steckt der gleiche Teil: fahr. Das ist der Wortstamm. Wörter mit dem gleichen Wortstamm bilden eine Wortfamilie."
          - text: "spielen | das Spiel | der Spieler | der Spielplatz"
            say: "Auch spielen hat eine Wortfamilie. Der Wortstamm ist spiel."
          - text: "spiel | spielen | Spieler"
            say: "Das Gute daran: Den Wortstamm schreibst du in allen Wörtern der Familie gleich. Wenn du ein Wort schreiben kannst, kannst du viele schreiben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf die Wörter mit dem Wortstamm fahr."
                say: "Tippe auf alle Wörter mit dem Wortstamm fahr."
                show: { drawn: letter-card, text: "fahren Farbe Fahrer Hose Fahrrad" }
                spans: ["fahren", "Fahrer", "Fahrrad"]
                hints:
                  - "Suche in jedem Wort den Teil fahr."
                  - "Farbe fängt nur ähnlich an. In Farbe steckt kein fahr, in Hose auch nicht."
                  - "Tippe auf fahren, Fahrer und Fahrrad."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was ist der Wortstamm von spielen?"
                say: "Was ist der Wortstamm von spielen?"
                options: ["spiel", "spi", "len"]
                answer: "spiel"
                feedback:
                  "spi": "Das ist zu kurz. Welcher Teil steckt auch in Spiel und Spieler?"
                  "len": "Das ist ein Stück vom Ende. Nimm die Endung en weg."
                hints:
                  - "Welcher Teil steckt auch in Spiel und Spieler?"
                  - "Nimm von spielen die Endung en weg."
                  - "Der Wortstamm ist spiel."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Wort gehört zur Familie von backen?"
                say: "Welches Wort gehört zur Wortfamilie von backen?"
                options: ["der Backofen", "der Becher", "die Bank"]
                answer: "der Backofen"
                hints:
                  - "Suche in jedem Wort den Teil back."
                  - "Im Backofen backst du Kuchen. Da steckt back drin."
                  - "Tippe auf den Backofen."
              - id: l1-f4
                type: true_false
                text: "Gehört die Fahne zur Wortfamilie fahren?"
                say: "Gehört die Fahne zur Wortfamilie fahren?"
                answer: false
                hints:
                  - "Fahne sieht ähnlich aus. Hat es etwas mit fahren zu tun?"
                  - "Eine Fahne fährt nicht. In Fahne steckt fahn, nicht fahr."
                  - "Nein, die Fahne gehört nicht dazu."
              - id: l1-f5
                type: fill_in_blank
                text: "Setz den Wortstamm ein."
                say: "Lesen, der Leser, das Lesebuch. Welcher Wortstamm fehlt?"
                frame: "der _er"
                options: ["Les", "Läs", "Lees"]
                answer: ["Les"]
                hints:
                  - "Den Wortstamm schreibst du in allen Wörtern der Familie gleich."
                  - "Wie schreibst du lesen? In lesen steckt les."
                  - "Tippe auf Les."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf die Wörter mit dem Wortstamm spiel."
                say: "Tippe auf alle Wörter mit dem Wortstamm spiel."
                show: { drawn: letter-card, text: "Spieler Spiegel spielen Spinne Spielplatz" }
                spans: ["Spieler", "spielen", "Spielplatz"]
                hints: ["Spiegel und Spinne sehen nur ähnlich aus."]
              - id: l1-s2
                type: multiple_choice
                text: "Was ist der Wortstamm von malen?"
                say: "Was ist der Wortstamm von malen?"
                options: ["mal", "ma", "len"]
                answer: "mal"
                hints: ["Nimm die Endung en weg."]
              - id: l1-s3
                type: multiple_choice
                text: "Welches Wort gehört zur Familie von schlafen?"
                say: "Welches Wort gehört zur Wortfamilie von schlafen?"
                options: ["der Schlafanzug", "das Schaf", "schlau"]
                answer: "der Schlafanzug"
                hints: ["Suche den Teil schlaf."]
              - id: l1-s4
                type: true_false
                text: "Gehört der Leser zur Wortfamilie lesen?"
                say: "Gehört der Leser zur Wortfamilie lesen?"
                answer: true
                hints: ["Steckt in Leser der Teil les?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Setz den Wortstamm ein."
                say: "Malen, der Maler, der Malkasten. Welcher Wortstamm fehlt?"
                frame: "der _kasten"
                options: ["Mal", "Mahl", "Maal"]
                answer: ["Mal"]
                hints: ["Schreib den Wortstamm so wie in malen."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf die Wörter mit dem Wortstamm wasch."
                say: "Tippe auf alle Wörter mit dem Wortstamm wasch."
                show: { drawn: letter-card, text: "waschen Wagen Waschbär Tasche Waschlappen" }
                spans: ["waschen", "Waschbär", "Waschlappen"]
              - id: l1-n2
                type: multiple_choice
                text: "Was ist der Wortstamm von kaufen?"
                say: "Was ist der Wortstamm von kaufen?"
                options: ["kauf", "kau", "fen"]
                answer: "kauf"
              - id: l1-n3
                type: multiple_choice
                text: "Welches Wort gehört zur Familie von Hand?"
                say: "Welches Wort gehört zur Wortfamilie von Hand?"
                options: ["der Handschuh", "der Hahn", "der Hund"]
                answer: "der Handschuh"
              - id: l1-n4
                type: true_false
                text: "Gehört die Wolke zur Wortfamilie wohnen?"
                say: "Gehört die Wolke zur Wortfamilie wohnen?"
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Setz den Wortstamm ein."
                say: "Turnen, der Turner, die Turnhalle. Welcher Wortstamm fehlt?"
                frame: "die _halle"
                options: ["Turn", "Tur", "Durn"]
                answer: ["Turn"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist der Wortstamm von schreiben?"
            say: "Was ist der Wortstamm von schreiben?"
            options: ["schreib", "schrei", "ben"]
            answer: "schreib"
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf die Wörter mit dem Wortstamm lern."
            say: "Tippe auf alle Wörter mit dem Wortstamm lern."
            show: { drawn: letter-card, text: "lernen Laterne Lernspiel Leiter gelernt" }
            spans: ["lernen", "Lernspiel", "gelernt"]
          - id: l1-c3
            type: true_false
            text: "Gehört das Brettspiel zur Wortfamilie spielen?"
            say: "Gehört das Brettspiel zur Wortfamilie spielen?"
            answer: true

  - n: 2
    title: { de: "Wortfamilien sammeln", en: "Collecting word families" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist der Wortstamm von rufen?"
            say: "Was ist der Wortstamm von rufen?"
            options: ["ruf", "ru", "fen"]
            answer: "ruf"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Gehört der Fahrer zur Wortfamilie fahren?"
            say: "Gehört der Fahrer zur Wortfamilie fahren?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "fahren | der Fahrer | die Fahrt | abfahren | das Fahrrad"
            say: "Eine Wortfamilie kann groß sein. Vorne kann etwas dazukommen, wie bei abfahren. Hinten kann etwas dazukommen, wie bei Fahrer. Der Wortstamm bleibt gleich."
          - text: "fahren | die Fahne"
            say: "Pass auf: Nicht jedes Wort, das ähnlich aussieht, gehört dazu. Die Fahne hat nichts mit fahren zu tun."
          - text: "fahren | der Fahrer | der Sport | sportlich"
            say: "In einer Wortfamilie gibt es Nomen, Tunwörter und Wiewörter. Fahren ist ein Tunwort, der Fahrer ist ein Nomen. Zur Familie von Sport gehört das Wiewort sportlich."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seiner Wortfamilie."
                pairs:
                  - { left: { text: "der Spieler" }, right: { text: "spielen" } }
                  - { left: { text: "die Fahrt" }, right: { text: "fahren" } }
                  - { left: { text: "der Maler" }, right: { text: "malen" } }
                  - { left: { text: "das Lesebuch" }, right: { text: "lesen" } }
                hints:
                  - "Suche in jedem Wort den Wortstamm."
                  - "Im Spieler steckt spiel, in der Fahrt steckt fahr."
                  - "Spieler zu spielen, Fahrt zu fahren, Maler zu malen, Lesebuch zu lesen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Haus, Haustür, Hase, Hausaufgabe: Welches Wort gehört nicht dazu?"
                say: "Haus, Haustür, Hase, Hausaufgabe. Welches Wort gehört nicht zur Wortfamilie?"
                options: ["Hase", "Haustür", "Hausaufgabe"]
                answer: "Hase"
                hints:
                  - "Suche in jedem Wort den Teil haus."
                  - "In Haustür und Hausaufgabe steckt haus. Hase sieht nur ähnlich aus."
                  - "Hase gehört nicht dazu."
              - id: l2-f3
                type: highlight_in_text
                text: "Tippe auf alle Wörter der Wortfamilie Sport."
                say: "Tippe auf alle Wörter, die zur Wortfamilie Sport gehören."
                show: { drawn: letter-card, text: "Sportplatz sportlich Spinat Sportler Sonne" }
                spans: ["Sportplatz", "sportlich", "Sportler"]
                hints:
                  - "Suche in jedem Wort den Teil sport."
                  - "Spinat und Sonne sehen nur ähnlich aus. In ihnen steckt kein sport."
                  - "Tippe auf Sportplatz, sportlich und Sportler."
              - id: l2-f4
                type: true_false
                text: "Gehört losfahren zur Wortfamilie fahren?"
                say: "Gehört losfahren zur Wortfamilie fahren?"
                answer: true
                hints:
                  - "Suche in losfahren den Teil fahr."
                  - "Vorne steht los, dann kommt fahren. Der Wortstamm fahr ist da."
                  - "Ja, losfahren gehört dazu."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Wort gehört zur Familie von wohnen?"
                say: "Welches Wort gehört zur Wortfamilie von wohnen?"
                options: ["die Wohnung", "die Woche", "wo"]
                answer: "die Wohnung"
                hints:
                  - "Suche in jedem Wort den Teil wohn."
                  - "In einer Wohnung wohnt man. Da steckt wohn drin."
                  - "Tippe auf die Wohnung."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seiner Wortfamilie."
                pairs:
                  - { left: { text: "der Kaufladen" }, right: { text: "kaufen" } }
                  - { left: { text: "das Wohnzimmer" }, right: { text: "wohnen" } }
                  - { left: { text: "die Schreibschrift" }, right: { text: "schreiben" } }
                  - { left: { text: "der Turnschuh" }, right: { text: "turnen" } }
                hints: ["Suche in jedem Wort den Wortstamm."]
              - id: l2-s2
                type: multiple_choice
                text: "malen, Maler, Malkasten, Mantel: Welches Wort gehört nicht dazu?"
                say: "Malen, Maler, Malkasten, Mantel. Welches Wort gehört nicht zur Wortfamilie?"
                options: ["Mantel", "Maler", "Malkasten"]
                answer: "Mantel"
                hints: ["Hat jedes Wort mit malen zu tun?"]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf alle Wörter der Wortfamilie Garten."
                say: "Tippe auf alle Wörter, die zur Wortfamilie Garten gehören."
                show: { drawn: letter-card, text: "Gartenzaun Gabel Gartentür Karte Gartenhaus" }
                spans: ["Gartenzaun", "Gartentür", "Gartenhaus"]
                hints: ["Suche den Teil garten."]
              - id: l2-s4
                type: true_false
                text: "Gehört der Hund zur Wortfamilie Hand?"
                say: "Gehört der Hund zur Wortfamilie Hand?"
                answer: false
                hints: ["Hund und Hand sehen ähnlich aus. Haben sie etwas miteinander zu tun?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Wort gehört zur Familie von rechnen?"
                say: "Welches Wort gehört zur Wortfamilie von rechnen?"
                options: ["das Rechenheft", "der Regen", "die Reihe"]
                answer: "das Rechenheft"
                hints: ["In welches Heft schreibst du deine Rechenaufgaben?"]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seiner Wortfamilie."
                pairs:
                  - { left: { text: "der Leser" }, right: { text: "lesen" } }
                  - { left: { text: "die Spielzeit" }, right: { text: "spielen" } }
                  - { left: { text: "der Malstift" }, right: { text: "malen" } }
                  - { left: { text: "die Abfahrt" }, right: { text: "fahren" } }
              - id: l2-n2
                type: multiple_choice
                text: "Schlaf, Schlafsack, schlafen, Schlange: Welches Wort gehört nicht dazu?"
                say: "Schlaf, Schlafsack, schlafen, Schlange. Welches Wort gehört nicht zur Wortfamilie?"
                options: ["Schlange", "Schlafsack", "Schlaf"]
                answer: "Schlange"
              - id: l2-n3
                type: highlight_in_text
                text: "Tippe auf alle Wörter der Wortfamilie Licht."
                say: "Tippe auf alle Wörter, die zur Wortfamilie Licht gehören."
                show: { drawn: letter-card, text: "Kerzenlicht Lichtschalter Linie Lichterkette Leiter" }
                spans: ["Kerzenlicht", "Lichtschalter", "Lichterkette"]
              - id: l2-n4
                type: true_false
                text: "Gehört der Fahrradhelm zur Wortfamilie fahren?"
                say: "Gehört der Fahrradhelm zur Wortfamilie fahren?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welches Wort gehört zur Familie von turnen?"
                say: "Welches Wort gehört zur Wortfamilie von turnen?"
                options: ["der Turnbeutel", "die Tulpe", "die Tür"]
                answer: "der Turnbeutel"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: matching
            text: "Welche Wörter sind verwandt?"
            say: "Welche Wörter sind verwandt? Verbinde sie."
            pairs:
              - { left: { text: "der Wohnwagen" }, right: { text: "wohnen" } }
              - { left: { text: "das Kaufhaus" }, right: { text: "kaufen" } }
              - { left: { text: "die Leseecke" }, right: { text: "lesen" } }
              - { left: { text: "das Spielzeug" }, right: { text: "spielen" } }
          - id: l2-c2
            type: multiple_choice
            text: "Was ist der Wortstamm von tanzen?"
            say: "Was ist der Wortstamm von tanzen?"
            options: ["tanz", "tan", "zen"]
            answer: "tanz"
          - id: l2-c3
            type: highlight_in_text
            text: "Tippe auf alle Wörter der Wortfamilie Schule."
            say: "Tippe auf alle Wörter, die zur Wortfamilie Schule gehören."
            show: { drawn: letter-card, text: "Schulweg Schuh Schulhof Schaufel Schultasche" }
            spans: ["Schulweg", "Schulhof", "Schultasche"]
          - id: l2-c4
            type: true_false
            text: "Gehört der Turm zur Wortfamilie turnen?"
            say: "Gehört der Turm zur Wortfamilie turnen?"
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Spiel, Spieler, Spiegel, spielen: Welches Wort gehört nicht dazu?"
            say: "Spiel, Spieler, Spiegel, spielen. Welches Wort gehört nicht zur Wortfamilie?"
            options: ["Spiegel", "Spieler", "spielen"]
            answer: "Spiegel"
