# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.blend-syllables
skill: lit-de.decoding.blend-syllables
curriculum: de-DE
language: de
title:
  de: Silben lesen
  en: Reading syllables
summary: >
  Children push two sounds together into a syllable (mmm and aaa make Ma)
  using only the letters they know: L, O, A and M. Lesson 1 reads open
  syllables (Ma, Mo, La, Lo): hear and find them, fill the missing vowel,
  spot them among other cards. Lesson 2 reads syllables that start with a
  vowel (Al, Om, Am), then joins two syllables into the first words (Ma-ma,
  O-ma, La-ma) and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Silben lesen, en: Reading syllables }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.l-o-a-m, lit-de.phonological.syllables]
  also_practises: [lit-de.letters.l-o-a-m]
  vocabulary: { de: [Laut, Silbe, zusammenziehen, Silbenbogen] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, syllable-arcs, word-card, dots]
  sounds: [de.l, de.ma, de.mo, de.la, de.lo, de.al, de.om]
  facets: []
  misconceptions:
    - id: sounds-apart
      what: Says the sounds one after the other with a gap (m ... a) and does not hear the syllable, so Ma stays two sounds
      addressed: "Learn slides the sounds into each other (mmmaaa); hints in lesson 1 say hold the first sound and slide into the second; tasks l1-f1 and l1-f3 ask for the joined syllable"
    - id: vowel-ignored
      what: Reads only the first letter and guesses the rest, so Ma and Mo are read the same
      addressed: "pairs Ma and Mo, La and Lo in every stage; feedback on l1-f2 and l2-f1 points to the second sound"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ma, Mo, La, Lo", en: "Ma, Mo, La, Lo" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Welcher Buchstabe klingt so?"
            audio: { sound: de.l }
            options: ["L", "M", "A"]
            answer: "L"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Wie oft klatschst du?"
            say: "Lama. Klatsch das Wort mit. Wie oft hast du geklatscht?"
            show: { object: llama }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
              - { drawn: dots, count: 3, layout: row }
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "M a"
            say: "Das ist mmm, und das ist aaa. Wir ziehen sie zusammen. Halte das mmm und rutsch ins aaa: mmmaaa. Ma."
            show: { drawn: letter-card, text: "M a" }
            sound: de.ma
          - text: "Ma"
            say: "Jetzt stehen sie zusammen unter einem Bogen. Ein Bogen ist eine Silbe: Ma."
            show: { drawn: syllable-arcs, word: "Ma", syllables: ["Ma"] }
            sound: de.ma
          - text: "Lo"
            say: "Und so geht es mit lll und ooo: llllooo. Lo."
            show: { drawn: syllable-arcs, word: "Lo", syllables: ["Lo"] }
            sound: de.lo

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Welche Silbe hörst du?"
                audio: { sound: de.ma }
                options: ["Ma", "La", "Mo"]
                answer: "Ma"
                hints:
                  - "Hör auf den ersten Laut und dann auf den zweiten."
                  - "Mmm ... aaa. Die Lippen sind erst zu, dann geht der Mund weit auf."
                  - "Ma."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Welche Silbe hörst du?"
                audio: { sound: de.lo }
                options: ["La", "Lo"]
                answer: "Lo"
                feedback:
                  La: "Beide fangen mit lll an. Hör auf den zweiten Laut: Er ist rund, ooo. Das ist Lo."
                hints:
                  - "Beide fangen gleich an. Hör auf das Ende."
                  - "Lll ... ooo. Wird dein Mund rund?"
                  - "Lo."
              - id: l1-f3
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Mo. Welcher Buchstabe fehlt?"
                frame: "M_"
                options: ["a", "o"]
                answer: ["o"]
                hints:
                  - "Sprich die Silbe langsam: Mmm ... ooo."
                  - "Der zweite Laut ist rund."
                  - "Es fehlt das o."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes La."
                say: "Tippe auf jede Silbe La."
                show: { drawn: letter-card, text: "La Lo La Ma" }
                spans: ["La", "La"]
                hints:
                  - "La fängt mit L an und hört mit a auf."
                  - "Lo hört mit o auf. Das passt nicht."
                  - "Es sind zwei: die erste und die dritte Silbe."
              - id: l1-f5
                type: true_false
                text: "Stimmt das?"
                say: "Lies die Silbe. Steht da Mo?"
                show: { drawn: syllable-arcs, word: "Ma", syllables: ["Ma"] }
                answer: false
                hints:
                  - "Lies erst den ersten Buchstaben, dann den zweiten."
                  - "Mmm ... und dann? Ist der zweite Buchstabe rund wie ein O?"
                  - "Nein, da steht Ma."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Welche Silbe hörst du?"
                audio: { sound: de.la }
                options: ["Ma", "La", "Lo"]
                answer: "La"
                hints: ["Lll ... aaa."]
              - id: l1-s2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "La. Welcher Buchstabe fehlt?"
                frame: "_a"
                options: ["L", "M"]
                answer: ["L"]
                hints: ["Hör auf den Anfang: lll oder mmm?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf jedes Mo."
                say: "Tippe auf jede Silbe Mo."
                show: { drawn: letter-card, text: "Mo Ma Lo Mo" }
                spans: ["Mo", "Mo"]
                hints: ["Mo fängt mit M an und hört mit o auf."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das?"
                say: "Lies die Silbe. Steht da La?"
                show: { drawn: syllable-arcs, word: "La", syllables: ["La"] }
                answer: true
                hints: ["Lll ... aaa."]
              - id: l1-s5
                type: audio_choice
                text: "Welche Silbe hörst du?"
                audio: { sound: de.mo }
                options: ["Lo", "Ma", "Mo"]
                answer: "Mo"
                hints: ["Die Lippen sind erst zu, dann wird der Mund rund."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Ma. Welcher Buchstabe fehlt?"
                frame: "M_"
                options: ["o", "a"]
                answer: ["a"]
              - id: l1-n2
                type: audio_choice
                text: "Welche Silbe hörst du?"
                audio: { sound: de.lo }
                options: ["Mo", "Lo", "La"]
                answer: "Lo"
              - id: l1-n3
                type: true_false
                text: "Stimmt das?"
                say: "Lies die Silbe. Steht da Mo?"
                show: { drawn: syllable-arcs, word: "Mo", syllables: ["Mo"] }
                answer: true
              - id: l1-n4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Lo. Welcher Buchstabe fehlt?"
                frame: "_o"
                options: ["M", "L"]
                answer: ["L"]
              - id: l1-n5
                type: highlight_in_text
                text: "Tippe auf jedes Ma."
                say: "Tippe auf jede Silbe Ma."
                show: { drawn: letter-card, text: "Ma La Ma Mo Ma" }
                spans: ["Ma", "Ma", "Ma"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Welche Silbe hörst du?"
            audio: { sound: de.ma }
            options: ["Mo", "Ma"]
            answer: "Ma"
          - id: l1-c2
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "La. Welcher Buchstabe fehlt?"
            frame: "L_"
            options: ["o", "a"]
            answer: ["a"]
          - id: l1-c3
            type: true_false
            text: "Stimmt das?"
            say: "Lies die Silbe. Steht da Lo?"
            show: { drawn: syllable-arcs, word: "La", syllables: ["La"] }
            answer: false

  - n: 2
    title: { de: Silben werden Wörter, en: Syllables become words }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Welche Silbe hörst du?"
            audio: { sound: de.la }
            options: ["La", "Lo"]
            answer: "La"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Mo. Welcher Buchstabe fehlt?"
            frame: "_o"
            options: ["L", "M"]
            answer: ["M"]
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "Al"
            say: "Eine Silbe kann auch mit aaa anfangen. Aaa und lll: aaalll. Al."
            show: { drawn: syllable-arcs, word: "Al", syllables: ["Al"] }
            sound: de.al
          - text: "Ma ma"
            say: "Zwei Bögen, zwei Silben. Lies den ersten Bogen: Ma. Lies den zweiten Bogen: ma. Zusammen: Mama."
            show: { drawn: syllable-arcs, word: "Mama", syllables: ["Ma", "ma"] }
          - text: "La ma"
            say: "La ... ma. Lama. Du liest Bogen für Bogen, dann sagst du das ganze Wort."
            show: { drawn: syllable-arcs, word: "Lama", syllables: ["La", "ma"] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Welche Silbe hörst du?"
                audio: { sound: de.al }
                options: ["La", "Al"]
                answer: "Al"
                feedback:
                  La: "Bei La kommt das lll zuerst. Hier kommt zuerst das aaa: Al."
                hints:
                  - "Was hörst du zuerst?"
                  - "Aaa ... lll. Zuerst der offene Mund."
                  - "Al."
              - id: l2-f2
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Oma", syllables: ["O", "ma"] }
                options: [{ object: grandma }, { object: mum }, { object: llama }]
                answer: grandma
                feedback:
                  mum: "Mama fängt mit Ma an. Dieses Wort fängt mit O an."
                hints:
                  - "Lies Bogen für Bogen."
                  - "O ... ma."
                  - "Oma."
                difficulty: easy
              - id: l2-f3
                type: ordering
                text: "Bau das Wort."
                say: "Lama. Leg die Silben in die richtige Reihenfolge."
                show: { object: llama }
                options: ["ma", "La"]
                slot_count: 2
                answer: ["La", "ma"]
                hints:
                  - "Sprich das Wort langsam: La ... ma."
                  - "Welche Silbe hörst du zuerst?"
                  - "Zuerst La, dann ma."
              - id: l2-f4
                type: audio_choice
                text: "Welche Silbe hörst du?"
                audio: { sound: de.om }
                options: ["Mo", "Om", "Am"]
                answer: "Om"
                hints:
                  - "Was kommt zuerst: mmm oder ooo?"
                  - "Ooo ... mmm. Erst wird der Mund rund, dann gehen die Lippen zu."
                  - "Om."
              - id: l2-f5
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Mama." }
                options: ["Oma", "Mama", "Lama"]
                answer: "Mama"
                hints:
                  - "Lies jedes Wort Bogen für Bogen."
                  - "Zweimal die gleiche Silbe."
                  - "Ma ... ma. Mama."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Lama", syllables: ["La", "ma"] }
                options: [{ object: mum }, { object: grandma }, { object: llama }]
                answer: llama
                hints: ["La ... ma."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Mama. Welche Silbe fehlt?"
                show: { object: mum }
                frame: "Ma_"
                options: ["ma", "la", "mo"]
                answer: ["ma"]
                hints: ["Ma ... ma. Die zweite Silbe klingt wie die erste."]
              - id: l2-s3
                type: audio_choice
                text: "Welche Silbe hörst du?"
                audio: { sound: de.al }
                options: ["Al", "Ol", "La"]
                answer: "Al"
                hints: ["Zuerst der weit offene Mund."]
              - id: l2-s4
                type: ordering
                text: "Bau das Wort."
                say: "Oma. Leg die Silben in die richtige Reihenfolge."
                show: { object: grandma }
                options: ["ma", "O"]
                slot_count: 2
                answer: ["O", "ma"]
                hints: ["O ... ma. Was hörst du zuerst?"]
              - id: l2-s5
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Lama." }
                options: ["Lama", "Mama", "Oma"]
                answer: "Lama"
                hints: ["Das Wort fängt mit lll an."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Mama", syllables: ["Ma", "ma"] }
                options: [{ object: llama }, { object: mum }, { object: grandma }]
                answer: mum
              - id: l2-n2
                type: audio_choice
                text: "Welche Silbe hörst du?"
                audio: { sound: de.om }
                options: ["Am", "Om"]
                answer: "Om"
              - id: l2-n3
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Lama. Welche Silbe fehlt?"
                show: { object: llama }
                frame: "_ma"
                options: ["Ma", "La", "O"]
                answer: ["La"]
              - id: l2-n4
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Oma." }
                options: ["Mama", "Lama", "Oma"]
                answer: "Oma"
              - id: l2-n5
                type: ordering
                text: "Bau das Wort."
                say: "Mama. Leg die Silben in die richtige Reihenfolge."
                show: { object: mum }
                options: ["ma", "Ma"]
                option_audio: false
                slot_count: 2
                answer: ["Ma", "ma"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Hör zu. Welche Silbe ist das?"
            audio: { sound: de.mo }
            options: ["Ma", "Mo", "Om"]
            answer: "Mo"
          - id: l2-c2
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Lo. Welcher Buchstabe fehlt?"
            frame: "L_"
            options: ["a", "o", "m"]
            answer: ["o"]
          - id: l2-c3
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Oma" }
            options: [{ object: mum }, { object: grandma }, { object: llama }]
            answer: grandma
          - id: l2-c4
            type: true_false
            text: "Stimmt das?"
            say: "Lies die Silbe. Steht da Al?"
            show: { drawn: syllable-arcs, word: "Al", syllables: ["Al"] }
            answer: true
          - id: l2-c5
            type: highlight_in_text
            text: "Tippe auf jedes Lo."
            say: "Tippe auf jede Silbe Lo."
            show: { drawn: letter-card, text: "Lo La Ol Lo" }
            spans: ["Lo", "Lo"]
