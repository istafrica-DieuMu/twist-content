# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.revise-texts
skill: lit-de.writing.revise
curriculum: de-DE
language: de
title:
  de: Texte überarbeiten
  en: Revising writing
summary: >
  Making a text better with others and with a checklist. Lesson 1 runs a
  Schreibkonferenz: one child reads, the others say what they like and
  give a friendly, exact tip, the writer decides; it matches problems in
  a text to the checklist questions (Überschrift, Reihenfolge,
  Satzanfänge, genaue Wörter, versteht man alles?); lesson 2 changes
  repeated Satzanfänge, finds more exact words, puts sentences in order,
  spots an unclear er or sie, and ends with the skill check. Revising a
  child's own text waits for a free text task type; here the child
  chooses, orders and matches.
metadata:
  year: klasse-2
  topic: { de: Texte überarbeiten, en: Revising writing }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.writing.plan]
  also_practises: [lit-de.writing.story-pictures]
  vocabulary: { de: [überarbeiten, Schreibkonferenz, Tipp, Checkliste, Satzanfang, Überschrift, Reihenfolge, genau] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: unhelpful-feedback
      what: Gives only praise or criticism (Gut., Das ist doof.) without a tip the writer can use
      addressed: "lesson 1 Learn sets Das ist doof against Mein Tipp: ...; every \"Welcher Tipp hilft?\" task offers bare praise and bare criticism (l1-f1 with feedback, l1-s1, l1-n1, l1-c1, l2-w1, l2-c1); l1-s2 and l1-n2 choose the kind and useful sentence; l1-n5 asks what a good tip does"
    - id: neat-copy
      what: Thinks überarbeiten means copying the text out neatly, and leaves repeated Satzanfänge, vague words, a wrong order and an unclear er or sie in place
      addressed: "lesson 1 Learn gives the checklist, and l1-f4, l1-s3, l1-n3 and l2-c4 match problems to its questions; lesson 2 Learn rewrites three Dann, a vague word and an unclear er; every stage of lesson 2 changes a Satzanfang (l2-f1 with feedback, l2-s1, l2-n1, l2-c2), picks a more exact word (l2-f2, l2-s2, l2-n2, l2-c3), orders sentences (l2-f3, l2-s3, l2-n3) and finds what is unclear (l2-f4, l2-s4, l2-n4); l2-f5 asks whether revising is only copying"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die Schreibkonferenz", en: "The writing conference" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Thema: Unser Ausflug\nIdeen: Bus, Zoo, Hausaufgaben, Eis\n\nWelche Idee streichst du?"
            say: "Lies das Thema und die Ideen. Welche Idee streichst du?"
            options: ["Hausaufgaben", "Zoo", "Eis"]
            answer: "Hausaufgaben"
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Bring den Schreibplan in die richtige Reihenfolge."
            say: "Bring den Schreibplan in die richtige Reihenfolge."
            options: ["Wir kommen müde nach Hause.", "Wir fahren mit dem Bus los.", "Im Zoo sehen wir die Affen."]
            slot_count: 3
            answer: ["Wir fahren mit dem Bus los.", "Im Zoo sehen wir die Affen.", "Wir kommen müde nach Hause."]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1. Ein Kind liest seinen Text vor.\n2. Die anderen sagen, was ihnen gefällt.\n3. Die anderen geben Tipps.\n4. Das Kind entscheidet, was es ändert."
            say: "In einer Schreibkonferenz helft ihr euch gegenseitig. Zuerst liest ein Kind seinen Text vor. Dann sagen die anderen, was ihnen gefällt. Danach geben sie Tipps. Am Ende entscheidet das Kind selbst, was es ändert."
          - text: "Das ist doof.\nMir gefällt dein Anfang. Mein Tipp: Fang nicht jeden Satz mit „Dann“ an."
            say: "Ein guter Tipp ist freundlich und genau. Sag nicht nur: Das ist doof. Sag, was dir gefällt, und dann, was das Kind besser machen kann."
          - text: "Überschrift? | Reihenfolge? | Satzanfänge? | Genaue Wörter? | Versteht man alles?"
            say: "Mit einer Checkliste prüfst du einen Text. Hat er eine Überschrift? Stimmt die Reihenfolge? Fangen die Sätze verschieden an? Passen die Wörter genau? Versteht man alles?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Mira liest ihre Geschichte vor. Welcher Tipp hilft ihr am meisten?"
                say: "Mira liest ihre Geschichte vor. Welcher Tipp hilft ihr am meisten?"
                options: ["Mein Tipp: Viele Sätze fangen mit „Dann“ an. Probier mal „Plötzlich“.", "Das ist doof.", "Gut."]
                answer: "Mein Tipp: Viele Sätze fangen mit „Dann“ an. Probier mal „Plötzlich“."
                feedback:
                  "Gut.": "Das ist nett, aber Mira weiß jetzt nicht, was sie besser machen kann."
                hints:
                  - "Ein guter Tipp sagt genau, was man besser machen kann."
                  - "Welcher Satz nennt eine Stelle und einen Vorschlag?"
                  - "Der Tipp mit Dann und Plötzlich."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Wie läuft eine Schreibkonferenz ab? Bring die Schritte in die richtige Reihenfolge."
                say: "Wie läuft eine Schreibkonferenz ab? Bring die Schritte in die richtige Reihenfolge."
                options: ["Die anderen geben Tipps.", "Ein Kind liest seinen Text vor.", "Das Kind entscheidet, was es ändert.", "Die anderen sagen, was ihnen gefällt."]
                slot_count: 4
                answer: ["Ein Kind liest seinen Text vor.", "Die anderen sagen, was ihnen gefällt.", "Die anderen geben Tipps.", "Das Kind entscheidet, was es ändert."]
                hints:
                  - "Ohne Vorlesen kann niemand etwas sagen."
                  - "Erst kommt das Lob, dann der Tipp."
                  - "Vorlesen, was gefällt, Tipps, entscheiden."
              - id: l1-f3
                type: multiple_choice
                text: "Was sagst du in der Schreibkonferenz zuerst?"
                say: "Was sagst du in der Schreibkonferenz zuerst?"
                options: ["was dir gefällt", "was alles falsch ist", "gar nichts"]
                answer: "was dir gefällt"
                hints:
                  - "Das Kind soll Lust haben, weiterzuschreiben."
                  - "Erst kommt das, was schon gut ist."
                  - "was dir gefällt."
              - id: l1-f4
                type: matching
                text: "Welche Frage aus der Checkliste passt?"
                say: "Verbinde jede Stelle mit der Frage aus der Checkliste, die hilft."
                pairs:
                  - { left: { text: "Dann ... Dann ... Dann ..." }, right: { text: "Fangen die Sätze verschieden an?" } }
                  - { left: { text: "Über dem Text steht nichts." }, right: { text: "Hat der Text eine Überschrift?" } }
                  - { left: { text: "Das Ende steht am Anfang." }, right: { text: "Stimmt die Reihenfolge?" } }
                option_audio: false
                hints:
                  - "Lies jede Stelle. Was stimmt dort nicht?"
                  - "Dreimal Dann ist ein Problem mit den Satzanfängen."
                  - "Dann: Satzanfänge. Nichts darüber: Überschrift. Ende vorn: Reihenfolge."
              - id: l1-f5
                type: true_false
                text: "In der Schreibkonferenz entscheidet das Kind selbst, welche Tipps es nutzt. Stimmt das?"
                say: "In der Schreibkonferenz entscheidet das Kind selbst, welche Tipps es nutzt. Stimmt das?"
                answer: true
                hints:
                  - "Wem gehört der Text?"
                  - "Die anderen geben nur Tipps. Wer ändert den Text am Ende?"
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Jonas liest seinen Text über den Zoo vor. Welcher Tipp hilft ihm am meisten?"
                say: "Jonas liest seinen Text über den Zoo vor. Welcher Tipp hilft ihm am meisten?"
                options: ["Mein Tipp: Schreib, welche Tiere du gesehen hast.", "Langweilig.", "Schön."]
                answer: "Mein Tipp: Schreib, welche Tiere du gesehen hast."
                hints: ["Welcher Satz sagt Jonas, was er tun kann?"]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Satz ist freundlich und hilft?"
                say: "Welcher Satz ist freundlich und hilft?"
                options: ["Mir gefällt dein Anfang. Mein Tipp: Schreib noch einen Schluss.", "Dein Text ist schlecht.", "Ich hätte das besser gemacht."]
                answer: "Mir gefällt dein Anfang. Mein Tipp: Schreib noch einen Schluss."
                hints: ["Erst was gefällt, dann ein Tipp."]
              - id: l1-s3
                type: matching
                text: "Welche Frage aus der Checkliste passt?"
                say: "Verbinde jede Stelle mit der Frage aus der Checkliste, die hilft."
                pairs:
                  - { left: { text: "Der Hund machte was." }, right: { text: "Passen die Wörter genau?" } }
                  - { left: { text: "Man weiß nicht, wer „er“ ist." }, right: { text: "Versteht man alles?" } }
                  - { left: { text: "Ich ging. Ich sah. Ich lief." }, right: { text: "Fangen die Sätze verschieden an?" } }
                option_audio: false
                hints: ["Was ist an jeder Stelle das Problem?"]
              - id: l1-s4
                type: multiple_choice
                text: "Was macht das Kind, das vorgelesen hat, nach der Schreibkonferenz?"
                say: "Was macht das Kind, das vorgelesen hat, nach der Schreibkonferenz?"
                options: ["Es überlegt, welche Tipps es nutzt, und ändert seinen Text.", "Es wirft den Text weg.", "Es schreibt einen Text über etwas ganz anderes."]
                answer: "Es überlegt, welche Tipps es nutzt, und ändert seinen Text."
                hints: ["Wozu waren die Tipps da?"]
              - id: l1-s5
                type: true_false
                text: "In der Schreibkonferenz lacht man über Fehler. Stimmt das?"
                say: "In der Schreibkonferenz lacht man über Fehler. Stimmt das?"
                answer: false
                hints: ["Wie soll ein Tipp sein?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ella liest ihren Brief an Oma vor. Welcher Tipp hilft ihr am meisten?"
                say: "Ella liest ihren Brief an Oma vor. Welcher Tipp hilft ihr am meisten?"
                options: ["Mein Tipp: Unten fehlt noch dein Gruß.", "Geht so.", "Toll!"]
                answer: "Mein Tipp: Unten fehlt noch dein Gruß."
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Satz passt in eine Schreibkonferenz?"
                say: "Welcher Satz passt in eine Schreibkonferenz?"
                options: ["Mir gefällt die Stelle mit dem Drachen. Mein Tipp: Erzähl, wie Mia sich fühlt.", "Das ist alles falsch.", "Lies leiser, das nervt."]
                answer: "Mir gefällt die Stelle mit dem Drachen. Mein Tipp: Erzähl, wie Mia sich fühlt."
              - id: l1-n3
                type: matching
                text: "Welche Frage aus der Checkliste passt?"
                say: "Verbinde jede Stelle mit der Frage aus der Checkliste, die hilft."
                pairs:
                  - { left: { text: "Zuerst steht, wie es ausgeht." }, right: { text: "Stimmt die Reihenfolge?" } }
                  - { left: { text: "Es war schön. Es war toll." }, right: { text: "Passen die Wörter genau?" } }
                  - { left: { text: "Der Text hat keinen Titel." }, right: { text: "Hat der Text eine Überschrift?" } }
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Wer entscheidet, was im Text geändert wird?"
                say: "Wer entscheidet, was im Text geändert wird?"
                options: ["das Kind, das den Text geschrieben hat", "das Kind, das am lautesten ist", "das Kind, das zuerst etwas sagt"]
                answer: "das Kind, das den Text geschrieben hat"
              - id: l1-n5
                type: true_false
                text: "Ein guter Tipp sagt genau, was man besser machen kann. Stimmt das?"
                say: "Ein guter Tipp sagt genau, was man besser machen kann. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Noah liest seine Geschichte vor. Welcher Tipp hilft ihm am meisten?"
            say: "Noah liest seine Geschichte vor. Welcher Tipp hilft ihm am meisten?"
            options: ["Mein Tipp: Schreib an den Anfang, wo die Geschichte spielt.", "Nicht so gut.", "Super!"]
            answer: "Mein Tipp: Schreib an den Anfang, wo die Geschichte spielt."
          - id: l1-c2
            type: ordering
            text: "Bring die Schritte der Schreibkonferenz in die richtige Reihenfolge."
            say: "Bring die Schritte der Schreibkonferenz in die richtige Reihenfolge."
            options: ["Die anderen geben Tipps.", "Ein Kind liest seinen Text vor.", "Die anderen sagen, was ihnen gefällt."]
            slot_count: 3
            answer: ["Ein Kind liest seinen Text vor.", "Die anderen sagen, was ihnen gefällt.", "Die anderen geben Tipps."]
          - id: l1-c3
            type: true_false
            text: "In der Schreibkonferenz sagst du zuerst, was dir gefällt. Stimmt das?"
            say: "In der Schreibkonferenz sagst du zuerst, was dir gefällt. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Den Text verbessern", en: "Making the text better" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Tipp hilft am meisten?"
            say: "Welcher Tipp hilft am meisten?"
            options: ["Mein Tipp: Schreib noch, wie die Geschichte ausgeht.", "Na ja.", "Cool."]
            answer: "Mein Tipp: Schreib noch, wie die Geschichte ausgeht."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Mit der Checkliste prüfst du auch, ob die Sätze verschieden anfangen. Stimmt das?"
            say: "Mit der Checkliste prüfst du auch, ob die Sätze verschieden anfangen. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Dann ging ich in den Garten. Dann sah ich einen Igel. Dann holte ich Mama.\n\nIch ging in den Garten. Dort sah ich einen Igel. Schnell holte ich Mama."
            say: "Fangen viele Sätze gleich an, änderst du die Satzanfänge. Dort, schnell, plötzlich oder danach klingen viel besser als immer nur dann."
          - text: "Der Igel machte ein Geräusch.\nDer Igel schnaufte laut."
            say: "Such genaue Wörter. Wörter wie machen, sagen oder gut verraten wenig. Schnaufen, rufen, flüstern oder lecker zeigen genau, was los ist."
          - text: "Er rannte unter die Hecke.\nDer Igel rannte unter die Hecke."
            say: "Lies deinen Text so, als ob du ihn nicht kennst. Weiß der Leser, wer er ist? Stimmt die Reihenfolge? Wenn nicht, verbesserst du die Stelle."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Verbessere den zweiten Satzanfang."
                say: "Der zweite Satz soll anders anfangen. Welches Wort passt?"
                frame: "Dann ging ich in den Wald. _ hörte ich ein Knacken."
                options: ["Plötzlich", "Dann", "Und dann"]
                answer: ["Plötzlich"]
                feedback:
                  "Dann": "Der erste Satz fängt schon mit Dann an. Nimm ein anderes Wort."
                hints:
                  - "Der neue Satzanfang soll nicht Dann sein."
                  - "Das Knacken kommt unerwartet. Welches Wort zeigt das?"
                  - "Plötzlich."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "„Pst“, sagte Lisa leise.\n\nWelches Wort ist genauer als „sagte“?"
                say: "Lies den Satz. Welches Wort ist genauer als sagte?"
                options: ["flüsterte", "machte", "ging"]
                answer: "flüsterte"
                hints:
                  - "Lisa spricht ganz leise."
                  - "Wie heißt es, wenn man ganz leise spricht?"
                  - "flüsterte."
              - id: l2-f3
                type: ordering
                text: "Bring die Sätze in die richtige Reihenfolge."
                say: "Die Sätze sind durcheinander. Bring sie in die richtige Reihenfolge."
                options: ["Zum Schluss aßen wir Kuchen.", "Zuerst packte ich die Geschenke aus.", "Danach spielten wir Topfschlagen."]
                slot_count: 3
                answer: ["Zuerst packte ich die Geschenke aus.", "Danach spielten wir Topfschlagen.", "Zum Schluss aßen wir Kuchen."]
                hints:
                  - "Achte auf zuerst, danach und zum Schluss."
                  - "Zuerst steht am Anfang, zum Schluss am Ende."
                  - "Geschenke, Topfschlagen, Kuchen."
              - id: l2-f4
                type: multiple_choice
                text: "Am Morgen spielte ich im Garten. Plötzlich bellte er laut.\n\nWas versteht der Leser nicht?"
                say: "Lies den Text. Was versteht der Leser nicht?"
                options: ["wer gebellt hat", "wo ich gespielt habe", "wann ich gespielt habe"]
                answer: "wer gebellt hat"
                hints:
                  - "Lies den Text so, als ob du ihn nicht kennst."
                  - "Wer ist er?"
                  - "Man weiß nicht, wer gebellt hat."
              - id: l2-f5
                type: true_false
                text: "Überarbeiten heißt nur, den Text noch einmal schön abzuschreiben. Stimmt das?"
                say: "Überarbeiten heißt nur, den Text noch einmal schön abzuschreiben. Stimmt das?"
                answer: false
                hints:
                  - "Prüfst du beim Überarbeiten nur die Schrift?"
                  - "Beim Überarbeiten änderst du Satzanfänge, Wörter und die Reihenfolge."
                  - "Nein, das stimmt nicht."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Verbessere den zweiten Satzanfang."
                say: "Der zweite Satz soll anders anfangen. Welche Wörter passen?"
                frame: "Dann kam Oma. _ brachte sie einen Kuchen mit."
                options: ["Zum Glück", "Dann", "Und dann"]
                answer: ["Zum Glück"]
                hints: ["Nimm keinen Anfang mit Dann."]
              - id: l2-s2
                type: multiple_choice
                text: "Der Hund machte laut: „Wuff!“\n\nWelches Wort ist genauer als „machte“?"
                say: "Lies den Satz. Welches Wort ist genauer als machte?"
                options: ["bellte", "sagte", "ging"]
                answer: "bellte"
                hints: ["Was macht ein Hund, wenn er Wuff ruft?"]
              - id: l2-s3
                type: ordering
                text: "Bring die Sätze in die richtige Reihenfolge."
                say: "Die Sätze sind durcheinander. Bring sie in die richtige Reihenfolge."
                options: ["Dann zog ich mich an.", "Am Morgen klingelte mein Wecker.", "Zum Schluss lief ich zur Schule."]
                slot_count: 3
                answer: ["Am Morgen klingelte mein Wecker.", "Dann zog ich mich an.", "Zum Schluss lief ich zur Schule."]
                hints: ["Was passiert ganz früh am Morgen?"]
              - id: l2-s4
                type: multiple_choice
                text: "Mein Bruder und ich spielten Ball. Plötzlich fiel sie ins Wasser.\n\nWas versteht der Leser nicht?"
                say: "Lies den Text. Was versteht der Leser nicht?"
                options: ["was ins Wasser gefallen ist", "wer Ball gespielt hat", "was wir gespielt haben"]
                answer: "was ins Wasser gefallen ist"
                hints: ["Wer oder was ist sie?"]
              - id: l2-s5
                type: true_false
                text: "Wenn alle Sätze mit „Dann“ anfangen, änderst du einige Satzanfänge. Stimmt das?"
                say: "Wenn alle Sätze mit Dann anfangen, änderst du einige Satzanfänge. Stimmt das?"
                answer: true
                hints: ["Dann, dann, dann: Wie klingt das beim Vorlesen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Verbessere den zweiten Satzanfang."
                say: "Der zweite Satz soll anders anfangen. Welches Wort passt?"
                frame: "Dann sah ich ein Reh. _ lief es in den Wald."
                options: ["Schnell", "Dann", "Und dann"]
                answer: ["Schnell"]
              - id: l2-n2
                type: multiple_choice
                text: "Die Suppe war gut.\n\nWelches Wort ist genauer als „gut“?"
                say: "Lies den Satz. Welches Wort ist genauer als gut?"
                options: ["lecker", "groß", "laut"]
                answer: "lecker"
              - id: l2-n3
                type: ordering
                text: "Bring die Sätze in die richtige Reihenfolge."
                say: "Die Sätze sind durcheinander. Bring sie in die richtige Reihenfolge."
                options: ["Danach putzte ich mir die Zähne.", "Am Abend aß ich mein Brot.", "Zum Schluss ging ich ins Bett."]
                slot_count: 3
                answer: ["Am Abend aß ich mein Brot.", "Danach putzte ich mir die Zähne.", "Zum Schluss ging ich ins Bett."]
              - id: l2-n4
                type: multiple_choice
                text: "Lena und Mia bauten eine Höhle. Dann rief sie: „Fertig!“\n\nWas versteht der Leser nicht?"
                say: "Lies den Text. Was versteht der Leser nicht?"
                options: ["wer „Fertig!“ gerufen hat", "was die Kinder gebaut haben", "wie die Kinder heißen"]
                answer: "wer „Fertig!“ gerufen hat"
              - id: l2-n5
                type: true_false
                text: "„Der Tag war gut. Das Essen war gut. Das Spiel war gut.“ Sind das genaue Wörter?"
                say: "Der Tag war gut. Das Essen war gut. Das Spiel war gut. Sind das genaue Wörter?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Paul liest seine Geschichte vor. Welcher Tipp hilft ihm am meisten?"
            say: "Paul liest seine Geschichte vor. Welcher Tipp hilft ihm am meisten?"
            options: ["Mein Tipp: Der Schluss fehlt. Erzähl, wie es ausgeht.", "Ganz okay.", "Langweilig!"]
            answer: "Mein Tipp: Der Schluss fehlt. Erzähl, wie es ausgeht."
          - id: l2-c2
            type: fill_in_blank
            text: "Verbessere den zweiten Satzanfang."
            say: "Der zweite Satz soll anders anfangen. Welches Wort passt?"
            frame: "Dann rannte ich zum Bus. _ war er schon weg."
            options: ["Leider", "Dann", "Und dann"]
            answer: ["Leider"]
          - id: l2-c3
            type: multiple_choice
            text: "Der Junge ging ganz schnell zum Tor.\n\nWelches Wort ist genauer als „ging ganz schnell“?"
            say: "Lies den Satz. Welches Wort ist genauer als ging ganz schnell?"
            options: ["rannte", "machte", "sagte"]
            answer: "rannte"
          - id: l2-c4
            type: matching
            text: "Was gehört zusammen?"
            say: "Verbinde jede Stelle mit der passenden Frage aus der Checkliste."
            pairs:
