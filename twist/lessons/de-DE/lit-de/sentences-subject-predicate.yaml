# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.sentences-subject-predicate
skill: lit-de.sentences.subject-predicate
curriculum: de-DE
language: de
title:
  de: Subjekt und Prädikat
  en: Subject and predicate
summary: >
  Every sentence has a Prädikat (what someone does or what happens) and a
  Subjekt (who or what does it), found with the question "Wer oder was?".
  Lesson 1 finds both when the Subjekt comes first and may have several
  words; lesson 2 finds a Subjekt that stands later, a Prädikat in two
  parts (fängt … an, hat … gebacken), makes Subjekt and Prädikat agree,
  and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Satzglieder, en: Parts of a sentence }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.sentences.questions]
  also_practises: [lit-de.verbs.recognise, lit-de.verbs.conjugate]
  vocabulary: { de: [Satzglied, Subjekt, Prädikat, "Wer oder was?"] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: first-word-subject
      what: Takes the first word or group of the sentence as the Subjekt (Heute in "Heute backt Oma.")
      addressed: lesson 2 Learn starts a sentence with a time; every stage of lesson 2 has a Wer-oder-was task whose sentence starts with another Satzglied, with that Satzglied as a distractor
    - id: subject-one-word
      what: Marks only the noun as the Subjekt and leaves out article and adjective (Katze instead of die alte Katze)
      addressed: lesson 1 Learn shows a three-word Subjekt; the highlight tasks in every stage need every word of it
    - id: half-predicate
      what: Finds only the first part of a split Prädikat (fängt in "Der Film fängt an.")
      addressed: lesson 2 Learn shows fängt … an; the Prädikat highlight tasks in every stage of lesson 2 have two parts
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wer oder was?", en: "Who or what?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Die Katze klettert auf den Baum." }
            spans: ["klettert"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wir _ ein Lied."
            say: "Welche Form passt? Wir … ein Lied. Das Verb heißt singen."
            options: ["singen", "singt", "singst"]
            answer: "singen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Bäcker backt Brot."
            say: "Ein Satz besteht aus Satzgliedern. Das wichtigste ist das Prädikat. Es sagt, was jemand tut oder was passiert. Hier ist das Prädikat: backt."
          - text: "Wer oder was backt? Der Bäcker."
            say: "Das Subjekt findest du mit der Frage: Wer oder was? Wer oder was backt? Der Bäcker. Der Bäcker ist das Subjekt."
          - text: "Die alte Katze schläft."
            say: "Das Subjekt kann aus mehreren Wörtern bestehen. Wer oder was schläft? Die alte Katze. Alle drei Wörter gehören zum Subjekt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf das Prädikat."
                say: "Lies den Satz. Tippe auf das Prädikat."
                show: { drawn: letter-card, text: "Die Kinder lachen laut." }
                spans: ["lachen"]
                hints:
                  - "Das Prädikat sagt, was jemand tut."
                  - "Was tun die Kinder?"
                  - "lachen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "„Der Wind weht kalt.“ Wer oder was weht?"
                say: "Der Wind weht kalt. Wer oder was weht?"
                options: ["Der Wind", "kalt", "weht"]
                answer: "Der Wind"
                feedback:
                  "weht": "Weht ist das Prädikat. Frag: Wer oder was weht?"
                hints:
                  - "Das Subjekt sagt, wer oder was etwas tut."
                  - "Was weht?"
                  - "Der Wind."
                difficulty: easy
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Subjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Subjekt gehören."
                show: { drawn: letter-card, text: "Mein großer Bruder spielt Gitarre." }
                spans: ["Mein", "großer", "Bruder"]
                hints:
                  - "Frag: Wer oder was spielt Gitarre?"
                  - "Es sind drei Wörter."
                  - "Mein großer Bruder."
              - id: l1-f4
                type: multiple_choice
                text: "„Oma singt ein Lied.“ Ist „singt“ Subjekt oder Prädikat?"
                say: "Oma singt ein Lied. Ist singt das Subjekt oder das Prädikat?"
                options: ["Prädikat", "Subjekt"]
                answer: "Prädikat"
                hints:
                  - "Sagt das Wort, wer etwas tut, oder was jemand tut?"
                  - "Singen ist etwas, das Oma tut."
                  - "Prädikat."
              - id: l1-f5
                type: true_false
                text: "„Der Ball rollt unter das Sofa.“ Ist „unter das Sofa“ das Subjekt?"
                say: "Der Ball rollt unter das Sofa. Ist unter das Sofa das Subjekt?"
                answer: false
                hints:
                  - "Frag: Wer oder was rollt?"
                  - "Rollt das Sofa?"
                  - "Nein. Das Subjekt ist der Ball."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf das Prädikat."
                say: "Lies den Satz. Tippe auf das Prädikat."
                show: { drawn: letter-card, text: "Papa kocht heute Nudeln." }
                spans: ["kocht"]
                hints: ["Welches Wort sagt, was Papa tut?"]
              - id: l1-s2
                type: multiple_choice
                text: "„Die Sonne scheint hell.“ Wer oder was scheint?"
                say: "Die Sonne scheint hell. Wer oder was scheint?"
                options: ["hell", "Die Sonne", "scheint"]
                answer: "Die Sonne"
                hints: ["Frag mit dem Prädikat: Wer oder was …?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Subjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Subjekt gehören."
                show: { drawn: letter-card, text: "Das kleine Kätzchen trinkt Milch." }
                spans: ["Das", "kleine", "Kätzchen"]
                hints: ["Frag: Wer oder was trinkt? Nimm alle Wörter der Antwort."]
              - id: l1-s4
                type: multiple_choice
                text: "„Der Zug fährt schnell.“ Ist „Der Zug“ Subjekt oder Prädikat?"
                say: "Der Zug fährt schnell. Ist der Zug das Subjekt oder das Prädikat?"
                options: ["Prädikat", "Subjekt"]
                answer: "Subjekt"
                hints: ["Antwortet es auf die Frage: Wer oder was fährt?"]
              - id: l1-s5
                type: true_false
                text: "„Die Vögel fliegen nach Süden.“ Ist „fliegen“ das Prädikat?"
                say: "Die Vögel fliegen nach Süden. Ist fliegen das Prädikat?"
                answer: true
                hints: ["Welches Wort sagt, was die Vögel tun?"]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf das Prädikat."
                say: "Lies den Satz. Tippe auf das Prädikat."
                show: { drawn: letter-card, text: "Der Lehrer erklärt die Aufgabe." }
                spans: ["erklärt"]
              - id: l1-n2
                type: multiple_choice
                text: "„Die Tulpen blühen im Garten.“ Wer oder was blüht?"
                say: "Die Tulpen blühen im Garten. Wer oder was blüht?"
                options: ["im Garten", "blühen", "Die Tulpen"]
                answer: "Die Tulpen"
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Subjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Subjekt gehören."
                show: { drawn: letter-card, text: "Unsere neue Nachbarin hat einen Hund." }
                spans: ["Unsere", "neue", "Nachbarin"]
              - id: l1-n4
                type: multiple_choice
                text: "„Der Fisch schwimmt im Teich.“ Ist „schwimmt“ Subjekt oder Prädikat?"
                say: "Der Fisch schwimmt im Teich. Ist schwimmt das Subjekt oder das Prädikat?"
                options: ["Subjekt", "Prädikat"]
                answer: "Prädikat"
              - id: l1-n5
                type: true_false
                text: "„Der Bus hält an der Ecke.“ Ist „Der Bus“ das Subjekt?"
                say: "Der Bus hält an der Ecke. Ist der Bus das Subjekt?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tippe auf das Prädikat."
            say: "Lies den Satz. Tippe auf das Prädikat."
            show: { drawn: letter-card, text: "Lea malt ein Bild." }
            spans: ["malt"]
          - id: l1-c2
            type: multiple_choice
            text: "„Das Baby weint leise.“ Wer oder was weint?"
            say: "Das Baby weint leise. Wer oder was weint?"
            options: ["Das Baby", "leise", "weint"]
            answer: "Das Baby"
          - id: l1-c3
            type: highlight_in_text
            text: "Tippe auf alle Wörter des Subjekts."
            say: "Lies den Satz. Tippe auf alle Wörter, die zum Subjekt gehören."
            show: { drawn: letter-card, text: "Der freche Papagei pfeift ein Lied." }
            spans: ["Der", "freche", "Papagei"]

  - n: 2
    title: { de: "Das Subjekt steht nicht immer vorn", en: "The subject is not always first" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "„Der Hund bellt laut.“ Wer oder was bellt?"
            say: "Der Hund bellt laut. Wer oder was bellt?"
            options: ["Der Hund", "laut", "bellt"]
            answer: "Der Hund"
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tippe auf das Prädikat."
            say: "Lies den Satz. Tippe auf das Prädikat."
            show: { drawn: letter-card, text: "Max liest ein Buch." }
            spans: ["liest"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Heute backt Oma einen Kuchen."
            say: "Das Subjekt steht nicht immer vorn. Frag immer: Wer oder was backt? Oma. Heute ist nicht das Subjekt, es sagt nur, wann."
          - text: "Der Film fängt gleich an."
            say: "Manchmal hat das Prädikat zwei Teile: fängt und an. Beide Teile gehören zum Prädikat. Genauso ist es bei ist gelaufen: ist und gelaufen sind zusammen das Prädikat."
          - text: "Das Kind spielt. Die Kinder spielen."
            say: "Subjekt und Prädikat passen immer zusammen. Ein Kind spielt, viele Kinder spielen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "„Im Sommer fahren wir ans Meer.“ Wer oder was fährt ans Meer?"
                say: "Im Sommer fahren wir ans Meer. Wer oder was fährt ans Meer?"
                options: ["wir", "Im Sommer", "ans Meer"]
                answer: "wir"
                feedback:
                  "Im Sommer": "Im Sommer steht vorn, aber es sagt nur, wann. Wer fährt? Wir."
                hints:
                  - "Das Subjekt steht hier nicht vorn."
                  - "Wer fährt ans Meer?"
                  - "wir."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tippe auf beide Teile des Prädikats."
                say: "Lies den Satz. Das Prädikat hat zwei Teile. Tippe auf beide."
                show: { drawn: letter-card, text: "Der Unterricht hört um zwölf auf." }
                spans: ["hört", "auf"]
                hints:
                  - "Ein Teil steht an zweiter Stelle."
                  - "Der andere Teil steht ganz am Ende."
                  - "hört und auf."
              - id: l2-f3
                type: fill_in_blank
                text: "Ergänze das Prädikat."
                say: "Ergänze das Prädikat. Die Hunde … im Garten. Das Verb heißt bellen."
                frame: "Die Hunde _ im Garten."
                options: ["bellen", "bellt", "bellst"]
                answer: ["bellen"]
                hints:
                  - "Das Subjekt ist die Hunde, also viele."
                  - "Viele Hunde …"
                  - "bellen."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Subjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Subjekt gehören."
                show: { drawn: letter-card, text: "Morgen besucht uns Onkel Paul." }
                spans: ["Onkel", "Paul"]
                hints:
                  - "Frag: Wer oder was besucht uns?"
                  - "Das Subjekt steht am Ende."
                  - "Onkel Paul."
              - id: l2-f5
                type: true_false
                text: "„Am Samstag hat Ben einen Kuchen gebacken.“ Ist das Prädikat „hat … gebacken“?"
                say: "Am Samstag hat Ben einen Kuchen gebacken. Ist hat gebacken das Prädikat?"
                answer: true
                hints:
                  - "Wie viele Teile kann ein Prädikat haben?"
                  - "Hat steht an zweiter Stelle, gebacken ganz am Ende."
                  - "Ja, das Prädikat ist hat … gebacken."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "„Nach der Schule isst Mia einen Apfel.“ Wer oder was isst?"
                say: "Nach der Schule isst Mia einen Apfel. Wer oder was isst?"
                options: ["Nach der Schule", "Mia", "einen Apfel"]
                answer: "Mia"
                hints: ["Was vorn steht, ist nicht immer das Subjekt. Stell die Frage: Wer oder was isst?"]
              - id: l2-s2
                type: highlight_in_text
                text: "Tippe auf beide Teile des Prädikats."
                say: "Lies den Satz. Das Prädikat hat zwei Teile. Tippe auf beide."
                show: { drawn: letter-card, text: "Die Kinder räumen ihr Zimmer auf." }
                spans: ["räumen", "auf"]
                hints: ["Schau auch ans Ende des Satzes."]
              - id: l2-s3
                type: fill_in_blank
                text: "Ergänze das Prädikat."
                say: "Ergänze das Prädikat. Mein Freund … gut Fußball. Das Verb heißt spielen."
                frame: "Mein Freund _ gut Fußball."
                options: ["spielt", "spielen", "spielst"]
                answer: ["spielt"]
                hints: ["Ist das Subjekt einer oder sind es viele?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Subjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Subjekt gehören."
                show: { drawn: letter-card, text: "Am Wochenende kommt meine Tante." }
                spans: ["meine", "Tante"]
                hints: ["Wer oder was kommt?"]
              - id: l2-s5
                type: true_false
                text: "„Heute Abend ruft Lisa an.“ Ist „Heute Abend“ das Subjekt?"
                say: "Heute Abend ruft Lisa an. Ist heute Abend das Subjekt?"
                answer: false
                hints: ["Frag: Wer oder was ruft an?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "„Im Wald wohnen viele Tiere.“ Wer oder was wohnt im Wald?"
                say: "Im Wald wohnen viele Tiere. Wer oder was wohnt im Wald?"
                options: ["Im Wald", "wohnen", "viele Tiere"]
                answer: "viele Tiere"
              - id: l2-n2
                type: highlight_in_text
                text: "Tippe auf beide Teile des Prädikats."
                say: "Lies den Satz. Das Prädikat hat zwei Teile. Tippe auf beide."
                show: { drawn: letter-card, text: "Wir haben gestern Pizza gegessen." }
                spans: ["haben", "gegessen"]
              - id: l2-n3
                type: fill_in_blank
                text: "Ergänze das Prädikat."
                say: "Ergänze das Prädikat. Du … sehr schön. Das Verb heißt singen."
                frame: "Du _ sehr schön."
                options: ["singst", "singt", "singen"]
                answer: ["singst"]
              - id: l2-n4
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Subjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Subjekt gehören."
                show: { drawn: letter-card, text: "Jeden Morgen kräht der Hahn." }
                spans: ["der", "Hahn"]
              - id: l2-n5
                type: true_false
                text: "„Am Abend leuchten die Sterne.“ Ist „die Sterne“ das Subjekt?"
                say: "Am Abend leuchten die Sterne. Sind die Sterne das Subjekt?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "„Nach dem Essen spült Papa ab.“ Wer oder was spült ab?"
            say: "Nach dem Essen spült Papa ab. Wer oder was spült ab?"
            options: ["Nach dem Essen", "ab", "Papa"]
            answer: "Papa"
          - id: l2-c2
            type: highlight_in_text
            text: "Tippe auf beide Teile des Prädikats."
            say: "Lies den Satz. Das Prädikat hat zwei Teile. Tippe auf beide."
            show: { drawn: letter-card, text: "Der Zug kommt pünktlich an." }
            spans: ["kommt", "an"]
          - id: l2-c3
            type: highlight_in_text
            text: "Tippe auf alle Wörter des Subjekts."
            say: "Lies den Satz. Tippe auf alle Wörter, die zum Subjekt gehören."
            show: { drawn: letter-card, text: "Heute schreibt die ganze Klasse ein Diktat." }
            spans: ["die", "ganze", "Klasse"]
          - id: l2-c4
            type: fill_in_blank
            text: "Ergänze das Prädikat."
            say: "Ergänze das Prädikat. Die Vögel … ein Nest. Das Verb heißt bauen."
            frame: "Die Vögel _ ein Nest."
            options: ["bauen", "baut", "baust"]
            answer: ["bauen"]
          - id: l2-c5
            type: multiple_choice
            text: "„Tim hat ein Bild gemalt.“ Ist „hat … gemalt“ Subjekt oder Prädikat?"
            say: "Tim hat ein Bild gemalt. Ist hat gemalt das Subjekt oder das Prädikat?"
            options: ["Subjekt", "Prädikat"]
            answer: "Prädikat"
