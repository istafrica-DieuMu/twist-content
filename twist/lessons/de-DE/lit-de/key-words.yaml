# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.key-words
skill: lit-de.comprehension.key-words
curriculum: de-DE
language: de
title:
  de: Schlüsselwörter finden
  en: Finding key words
summary: >
  Schlüsselwörter are the few words that carry what matters. Lesson 1
  finds them in single sentences, tells them from small words (der, und,
  im) and marks only the words that answer a question; lesson 2 finds the
  key words that show what a short Sachtext is about, takes the key word
  of a question into the text, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.comprehension.find-information]
  also_practises: [lit-de.comprehension.find-information]
  vocabulary: { de: [Schlüsselwort, markieren, wichtig] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: mark-everything
      what: Marks too many words, small words included (der, und, im), so the marking no longer helps
      addressed: "lesson 1 Learn sets key words against small words; every sorting task (l1-f4, l1-s4, l1-n4, l2-s5, l2-n5, l2-c5) has small words to leave out; l1-f2 gives feedback on the small-word option"
    - id: stand-out-not-question
      what: Marks words that stand out (a name, a colour) instead of the ones that answer the question or carry the topic
      addressed: "every \"Welche Wörter sagen ...\" highlight task has other nouns and adjectives in the sentence (l1-f1, l1-f5, l2-f2, l2-c2); \"Nach welchem Wort suchst du?\" in every stage of lesson 2 offers a word from the wrong part of the text"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die wichtigen Wörter", en: "The important words" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Leo hat einen Hamster.\nDer Hamster heißt Krümel.\n\nWie heißt der Hamster?"
            say: "Lies den Text und die Frage. Wie heißt der Hamster?"
            options: ["Krümel", "Leo", "Hamster"]
            answer: "Krümel"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Leo hat einen Hamster.\nEr wohnt in einem Käfig.\n\nSteht das im Text? Der Hamster wohnt in einem Käfig."
            say: "Lies den Text. Steht das so im Text?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der kleine Hund spielt im Garten mit einem Ball."
            say: "Nicht alle Wörter sind gleich wichtig. Die wichtigen Wörter heißen Schlüsselwörter. Hier sind es Hund, spielt, Garten und Ball. Mit ihnen weißt du schon, worum es geht."
          - text: "Hund | spielt | Garten | Ball\nder | im | mit | einem"
            say: "Kleine Wörter wie der, im, mit oder einem sind keine Schlüsselwörter. Sie stehen in fast jedem Satz."
          - text: "Was isst Lena? Lena isst ein Brot und einen Apfel."
            say: "Oft suchst du Schlüsselwörter für eine Frage. Die Frage ist: Was isst Lena? Dann sind Brot und Apfel die Schlüsselwörter. Markiere nur wenige Wörter, nicht den ganzen Satz."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Was nimmt Jonas mit? Tippe auf die Schlüsselwörter."
                say: "Lies den Satz. Welche Wörter sagen, was Jonas mitnimmt? Tippe auf sie."
                show: { drawn: letter-card, text: "Jonas nimmt in den Ferien ein Zelt und eine Taschenlampe mit." }
                spans: ["Zelt", "Taschenlampe"]
                hints:
                  - "Die Frage ist: Was nimmt Jonas mit? Such nur die Dinge."
                  - "Ferien ist wichtig, aber es sagt nicht, was er mitnimmt."
                  - "Tippe auf Zelt und Taschenlampe."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Der Bauer fährt mit dem Traktor auf das Feld.\n\nWelche Wörter sind die Schlüsselwörter?"
                say: "Lies den Satz. Welche Wörter sind die Schlüsselwörter?"
                options: ["Bauer, Traktor, Feld", "der, mit, dem", "auf, das, mit"]
                answer: "Bauer, Traktor, Feld"
                feedback:
                  "der, mit, dem": "Das sind kleine Wörter. Sie stehen in fast jedem Satz. Welche Wörter sagen, worum es geht?"
                hints:
                  - "Welche Wörter sagen dir, wer was wo macht?"
                  - "Der, mit und dem stehen in fast jedem Satz."
                  - "Bauer, Traktor, Feld."
              - id: l1-f3
                type: true_false
                text: "Mia und Tom bauen eine Sandburg.\n\nIst „und“ ein Schlüsselwort?"
                say: "Lies den Satz. Ist das Wort und ein Schlüsselwort?"
                answer: false
                hints:
                  - "Sagt dir das Wort und, worum es geht?"
                  - "Und steht in ganz vielen Sätzen. Es ist ein kleines Wort."
                  - "Nein, und ist kein Schlüsselwort."
              - id: l1-f4
                type: sorting
                text: "Oma und Opa pflanzen im Frühling Tulpen.\n\nSchlüsselwort oder nicht?"
                say: "Lies den Satz. Sortiere die Wörter: Ist es ein Schlüsselwort oder nicht?"
                bins:
                  - { id: ja, show: { text: "Schlüsselwort" }, say: "Schlüsselwort" }
                  - { id: nein, show: { text: "kein Schlüsselwort" }, say: "kein Schlüsselwort" }
                options:
                  - { text: "Oma", bin: ja }
                  - { text: "Tulpen", bin: ja }
                  - { text: "Frühling", bin: ja }
                  - { text: "und", bin: nein }
                  - { text: "im", bin: nein }
                hints:
                  - "Frag bei jedem Wort: Sagt es mir etwas Wichtiges?"
                  - "Und und im sind kleine Wörter."
                  - "Schlüsselwörter: Oma, Tulpen, Frühling. Keine: und, im."
              - id: l1-f5
                type: highlight_in_text
                text: "Wo schläft die Katze? Tippe auf das Schlüsselwort."
                say: "Lies den Satz. Wo schläft die Katze? Tippe auf das Schlüsselwort."
                show: { drawn: letter-card, text: "Die Katze schläft am liebsten auf dem warmen Sofa." }
                spans: ["Sofa."]
                hints:
                  - "Wo fragt nach einem Ort."
                  - "Warm sagt, wie es ist. Welches Wort ist der Ort?"
                  - "Tippe auf Sofa."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Welche Tiere sehen sie? Tippe auf die Schlüsselwörter."
                say: "Lies den Satz. Welche Wörter sagen, welche Tiere sie im Zoo sehen? Tippe auf sie."
                show: { drawn: letter-card, text: "Im Zoo sehen wir Löwen, Affen und Zebras." }
                spans: ["Löwen", "Affen", "Zebras."]
                hints: ["Such nur die Tiere."]
              - id: l1-s2
                type: multiple_choice
                text: "Am Abend liest Papa ein Buch im Bett.\n\nWelche Wörter sind die Schlüsselwörter?"
                say: "Lies den Satz. Welche Wörter sind die Schlüsselwörter?"
                options: ["Abend, Papa, Buch, Bett", "am, ein, im", "Papa, ein, im"]
                answer: "Abend, Papa, Buch, Bett"
                hints: ["Kleine Wörter wie am, ein und im gehören nicht dazu."]
              - id: l1-s3
                type: true_false
                text: "Der Zug fährt um acht Uhr ab.\n\nIst „acht“ ein Schlüsselwort?"
                say: "Lies den Satz. Ist das Wort acht ein Schlüsselwort?"
                answer: true
                hints: ["Willst du den Zug erwischen? Was musst du dann wissen?"]
              - id: l1-s4
                type: sorting
                text: "Ben und Ali schwimmen im See.\n\nSchlüsselwort oder nicht?"
                say: "Lies den Satz. Sortiere die Wörter: Ist es ein Schlüsselwort oder nicht?"
                bins:
                  - { id: ja, show: { text: "Schlüsselwort" }, say: "Schlüsselwort" }
                  - { id: nein, show: { text: "kein Schlüsselwort" }, say: "kein Schlüsselwort" }
                options:
                  - { text: "Ben", bin: ja }
                  - { text: "See", bin: ja }
                  - { text: "schwimmen", bin: ja }
                  - { text: "und", bin: nein }
                  - { text: "im", bin: nein }
                hints: ["Kleine Wörter stehen in fast jedem Satz."]
              - id: l1-s5
                type: highlight_in_text
                text: "Womit fährt Jan zur Schule? Tippe auf das Schlüsselwort."
                say: "Lies den Satz. Womit fährt Jan zur Schule? Tippe auf das Schlüsselwort."
                show: { drawn: letter-card, text: "Jan fährt jeden Tag mit dem Roller zur Schule." }
                spans: ["Roller"]
                hints: ["Womit fragt nach einem Ding."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Was packt Ella ein? Tippe auf die Schlüsselwörter."
                say: "Lies den Satz. Welche Wörter sagen, was Ella einpackt? Tippe auf sie."
                show: { drawn: letter-card, text: "Ella packt für das Schwimmbad eine Badehose, ein Handtuch und eine Schwimmbrille ein." }
                spans: ["Badehose", "Handtuch", "Schwimmbrille"]
              - id: l1-n2
                type: multiple_choice
                text: "Im Herbst fallen die bunten Blätter von den Bäumen.\n\nWelche Wörter sind die Schlüsselwörter?"
                say: "Lies den Satz. Welche Wörter sind die Schlüsselwörter?"
                options: ["Herbst, Blätter, Bäumen", "im, die, von", "die, den, von"]
                answer: "Herbst, Blätter, Bäumen"
              - id: l1-n3
                type: true_false
                text: "Die Kinder spielen in der Pause Fangen.\n\nIst „der“ ein Schlüsselwort?"
                say: "Lies den Satz. Ist das Wort der ein Schlüsselwort?"
                answer: false
              - id: l1-n4
                type: sorting
                text: "Mama kauft Milch und Brot im Laden.\n\nSchlüsselwort oder nicht?"
                say: "Lies den Satz. Sortiere die Wörter: Ist es ein Schlüsselwort oder nicht?"
                bins:
                  - { id: ja, show: { text: "Schlüsselwort" }, say: "Schlüsselwort" }
                  - { id: nein, show: { text: "kein Schlüsselwort" }, say: "kein Schlüsselwort" }
                options:
                  - { text: "Mama", bin: ja }
                  - { text: "Milch", bin: ja }
                  - { text: "Brot", bin: ja }
                  - { text: "Laden", bin: ja }
                  - { text: "und", bin: nein }
                  - { text: "im", bin: nein }
              - id: l1-n5
                type: highlight_in_text
                text: "Wann hat Tim Geburtstag? Tippe auf das Schlüsselwort."
                say: "Lies den Satz. Wann hat Tim Geburtstag? Tippe auf das Schlüsselwort."
                show: { drawn: letter-card, text: "Tim hat im Mai Geburtstag und feiert mit seinen Freunden." }
                spans: ["Mai"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Die Feuerwehr löscht das Feuer mit Wasser.\n\nWelche Wörter sind die Schlüsselwörter?"
            say: "Lies den Satz. Welche Wörter sind die Schlüsselwörter?"
            options: ["Feuerwehr, Feuer, Wasser", "die, das, mit", "das, mit, die"]
            answer: "Feuerwehr, Feuer, Wasser"
          - id: l1-c2
            type: highlight_in_text
            text: "Welche Farben hat der Vogel? Tippe auf die Schlüsselwörter."
            say: "Lies den Satz. Welche Wörter sagen, welche Farben der Vogel hat? Tippe auf sie."
            show: { drawn: letter-card, text: "Der kleine Vogel im Baum ist blau, gelb und grün." }
            spans: ["blau", "gelb", "grün."]
          - id: l1-c3
            type: true_false
            text: "Wir fahren morgen mit dem Zug ans Meer.\n\nIst „Meer“ ein Schlüsselwort?"
            say: "Lies den Satz. Ist das Wort Meer ein Schlüsselwort?"
            answer: true

  - n: 2
    title: { de: "Schlüsselwörter im Text", en: "Key words in a text" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Der Hase frisst gern Möhren.\n\nWelche Wörter sind die Schlüsselwörter?"
            say: "Lies den Satz. Welche Wörter sind die Schlüsselwörter?"
            options: ["Hase, Möhren", "der, gern", "gern, der"]
            answer: "Hase, Möhren"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Lisa malt ein Bild für Oma.\n\nIst „ein“ ein Schlüsselwort?"
            say: "Lies den Satz. Ist das Wort ein ein Schlüsselwort?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Die Spinne\nDie Spinne hat acht Beine.\nSie baut ein Netz.\nIn dem Netz fängt sie Fliegen."
            say: "In einem Sachtext zeigen dir die Schlüsselwörter, worum es geht. Hier sind es Spinne, acht Beine, Netz und Fliegen."
          - text: "Was fängt die Spinne?\n\nIn dem Netz fängt sie Fliegen."
            say: "Hast du eine Frage, such zuerst ihr Schlüsselwort. Hier ist es fängt. Dann such das Wort im Text. Die Antwort steht ganz in der Nähe: Fliegen."
          - text: "Spinne | Beine | Netz | Fliegen\ndie | hat | in | sie"
            say: "Mit den Schlüsselwörtern kannst du jemandem schnell sagen, worum es im Text geht. Mit den kleinen Wörtern geht das nicht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Der Elefant\nDer Elefant ist das größte Tier an Land.\nEr hat einen langen Rüssel.\nMit dem Rüssel trinkt er Wasser.\n\nWelche Schlüsselwörter zeigen, worum es geht?"
                say: "Lies den Text. Welche Schlüsselwörter zeigen, worum es geht?"
                options: ["Elefant, Rüssel, Wasser", "der, er, mit", "das, an, einen"]
                answer: "Elefant, Rüssel, Wasser"
                feedback:
                  "der, er, mit": "Das sind kleine Wörter. Mit ihnen weißt du nicht, worum es geht."
                hints:
                  - "Stell dir vor, du erzählst einem Freund von dem Text. Welche Wörter brauchst du?"
                  - "Kleine Wörter wie der, er und mit helfen dir nicht."
                  - "Elefant, Rüssel, Wasser."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Womit trinkt der Elefant? Tippe auf das Schlüsselwort."
                say: "Lies den Text. Womit trinkt der Elefant Wasser? Tippe auf das Schlüsselwort."
                show: { drawn: letter-card, text: "Der Elefant ist sehr groß. Mit dem Rüssel trinkt er Wasser." }
                spans: ["Rüssel"]
                hints:
                  - "Such zuerst das Wort trinkt."
                  - "Wasser ist das, was er trinkt. Die Frage ist: womit?"
                  - "Tippe auf Rüssel."
              - id: l2-f3
                type: multiple_choice
                text: "Der Käfer\nDer Käfer hat sechs Beine.\nEr hat zwei Flügel.\n\nDu willst wissen: Wie viele Beine hat er? Nach welchem Wort suchst du im Text?"
                say: "Lies den Text und die Frage. Nach welchem Wort suchst du im Text?"
                options: ["Beine", "Flügel", "viele"]
                answer: "Beine"
                hints:
                  - "Welches Wort aus der Frage steht auch im Text?"
                  - "Flügel steht im Text, aber die Frage ist nach etwas anderem."
                  - "Such nach Beine. Daneben steht sechs."
              - id: l2-f4
                type: true_false
                text: "Die Biene\nDie Biene fliegt von Blüte zu Blüte.\nSie sammelt Nektar.\nDaraus macht sie Honig.\n\nPassen diese Schlüsselwörter zum Text? Biene, Blüte, Honig"
                say: "Lies den Text. Passen die Schlüsselwörter unten zum Text?"
                answer: true
                hints:
                  - "Such jedes Schlüsselwort im Text."
                  - "Biene, Blüte und Honig stehen alle im Text."
                  - "Ja, sie passen."
              - id: l2-f5
                type: highlight_in_text
                text: "Was sammelt die Biene, und was macht sie daraus? Tippe auf die zwei Wörter."
                say: "Lies den Text. Was sammelt die Biene, und was macht sie daraus? Tippe auf die zwei Schlüsselwörter."
                show: { drawn: letter-card, text: "Die Biene sammelt Nektar. Daraus macht sie Honig." }
                spans: ["Nektar.", "Honig."]
                hints:
                  - "Such die Wörter sammelt und macht. Was steht danach?"
                  - "Nach sammelt steht ein Wort, nach macht sie das andere."
                  - "Tippe auf Nektar und Honig."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Die Kuh\nDie Kuh lebt auf dem Bauernhof.\nSie frisst Gras.\nSie gibt Milch.\n\nWelche Schlüsselwörter zeigen, worum es geht?"
                say: "Lies den Text. Welche Schlüsselwörter zeigen, worum es geht?"
                options: ["Kuh, Bauernhof, Gras, Milch", "die, auf, sie", "lebt, dem, sie"]
                answer: "Kuh, Bauernhof, Gras, Milch"
                hints: ["Welche Wörter brauchst du, um einem Freund von dem Text zu erzählen?"]
              - id: l2-s2
                type: highlight_in_text
                text: "Was frisst die Kuh? Tippe auf das Schlüsselwort."
                say: "Lies den Text. Was frisst die Kuh? Tippe auf das Schlüsselwort."
                show: { drawn: letter-card, text: "Die Kuh lebt auf dem Bauernhof. Sie frisst Gras." }
                spans: ["Gras."]
                hints: ["Such zuerst das Wort frisst."]
              - id: l2-s3
                type: multiple_choice
                text: "Der Igel\nDer Igel hat Stacheln.\nAm Tag schläft er.\nIn der Nacht sucht er Futter.\n\nDu willst wissen: Wann sucht der Igel Futter? Nach welchem Wort suchst du im Text?"
                say: "Lies den Text und die Frage. Nach welchem Wort suchst du im Text?"
                options: ["Futter", "Stacheln", "schläft"]
                answer: "Futter"
                hints: ["Welches Wort aus der Frage steht auch im Text?"]
              - id: l2-s4
                type: true_false
                text: "Die Kuh\nDie Kuh lebt auf dem Bauernhof.\nSie frisst Gras.\nSie gibt Milch.\n\nPassen diese Schlüsselwörter zum Text? Kuh, Wald, Fische"
                say: "Lies den Text. Passen die Schlüsselwörter unten zum Text?"
                answer: false
                hints: ["Such jedes Schlüsselwort im Text."]
              - id: l2-s5
                type: sorting
                text: "Der Apfelbaum\nIm Frühling blüht der Apfelbaum.\nIm Herbst hängen Äpfel an den Ästen.\n\nSchlüsselwort oder nicht?"
                say: "Lies den Text. Sortiere die Wörter: Ist es ein Schlüsselwort oder nicht?"
                bins:
                  - { id: ja, show: { text: "Schlüsselwort" }, say: "Schlüsselwort" }
                  - { id: nein, show: { text: "kein Schlüsselwort" }, say: "kein Schlüsselwort" }
                options:
                  - { text: "Apfelbaum", bin: ja }
                  - { text: "Herbst", bin: ja }
                  - { text: "Äpfel", bin: ja }
                  - { text: "an", bin: nein }
                  - { text: "den", bin: nein }
                hints: ["Kleine Wörter stehen in fast jedem Satz."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Der Schneemann\nIm Winter bauen Kinder einen Schneemann.\nEr hat eine Möhre als Nase.\nWenn die Sonne scheint, schmilzt er.\n\nWelche Schlüsselwörter zeigen, worum es geht?"
                say: "Lies den Text. Welche Schlüsselwörter zeigen, worum es geht?"
                options: ["Winter, Schneemann, Möhre, schmilzt", "im, einen, als, er", "wenn, die, eine"]
                answer: "Winter, Schneemann, Möhre, schmilzt"
              - id: l2-n2
                type: highlight_in_text
                text: "Was hat der Schneemann als Nase? Tippe auf das Schlüsselwort."
                say: "Lies den Text. Was hat der Schneemann als Nase? Tippe auf das Schlüsselwort."
                show: { drawn: letter-card, text: "Im Winter bauen Kinder einen Schneemann. Er hat eine Möhre als Nase." }
                spans: ["Möhre"]
              - id: l2-n3
                type: multiple_choice
                text: "Der Hamster\nDer Hamster sammelt Futter in seinen Backen.\nAm Tag schläft er.\n\nDu willst wissen: Wo sammelt der Hamster Futter? Nach welchem Wort suchst du im Text?"
                say: "Lies den Text und die Frage. Nach welchem Wort suchst du im Text?"
                options: ["sammelt", "schläft", "Tag"]
                answer: "sammelt"
              - id: l2-n4
                type: true_false
                text: "Der Hamster\nDer Hamster sammelt Futter in seinen Backen.\nAm Tag schläft er.\n\nPassen diese Schlüsselwörter zum Text? Hamster, Futter, Backen"
                say: "Lies den Text. Passen die Schlüsselwörter unten zum Text?"
                answer: true
              - id: l2-n5
                type: sorting
                text: "Der Wal lebt im Meer und frisst Krebse.\n\nSchlüsselwort oder nicht?"
                say: "Lies den Satz. Sortiere die Wörter: Ist es ein Schlüsselwort oder nicht?"
                bins:
                  - { id: ja, show: { text: "Schlüsselwort" }, say: "Schlüsselwort" }
                  - { id: nein, show: { text: "kein Schlüsselwort" }, say: "kein Schlüsselwort" }
                options:
                  - { text: "Wal", bin: ja }
                  - { text: "Meer", bin: ja }
                  - { text: "Krebse", bin: ja }
                  - { text: "im", bin: nein }
                  - { text: "und", bin: nein }

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Der Regenbogen\nNach dem Regen scheint oft die Sonne.\nDann siehst du manchmal einen Regenbogen.\nEr hat viele Farben.\n\nWelche Schlüsselwörter zeigen, worum es geht?"
            say: "Lies den Text. Welche Schlüsselwörter zeigen, worum es geht?"
            options: ["Regen, Sonne, Regenbogen, Farben", "nach, dem, oft, dann", "siehst, manchmal, viele"]
            answer: "Regen, Sonne, Regenbogen, Farben"
          - id: l2-c2
            type: highlight_in_text
            text: "Was frisst der Affe? Tippe auf die Schlüsselwörter."
            say: "Lies den Text. Welche Wörter sagen, was der Affe frisst? Tippe auf sie."
            show: { drawn: letter-card, text: "Der Affe klettert auf einen hohen Baum. Dort frisst er Bananen und Blätter." }
            spans: ["Bananen", "Blätter."]
          - id: l2-c3
            type: multiple_choice
            text: "Die Schnecke\nDie Schnecke trägt ihr Haus auf dem Rücken.\nSie kriecht sehr langsam.\n\nDu willst wissen: Wie schnell kriecht die Schnecke? Nach welchem Wort suchst du im Text?"
            say: "Lies den Text und die Frage. Nach welchem Wort suchst du im Text?"
            options: ["kriecht", "Haus", "Rücken"]
            answer: "kriecht"
          - id: l2-c4
            type: true_false
            text: "Der Bus hält vor der Schule.\n\nIst „der“ ein Schlüsselwort?"
            say: "Lies den Satz. Ist das Wort der ein Schlüsselwort?"
            answer: false
          - id: l2-c5
            type: sorting
            text: "Lea füttert die Pferde mit Heu.\n\nSchlüsselwort oder nicht?"
            say: "Lies den Satz. Sortiere die Wörter: Ist es ein Schlüsselwort oder nicht?"
            bins:
