# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.copy-words
skill: lit-de.handwriting.copy-words
curriculum: de-DE
language: de
title:
  de: Wörter abschreiben
  en: Copying words
summary: >
  Children copy words without mistakes by the Abschreiben steps a class
  learns: read the word, remember it, write it from memory, then compare.
  They copy words onto writing lines, keep a flashed word in mind and pick
  its spelling, and check a copy against the model. Lesson 1 copies
  syllable by syllable (So-fa, Do-se); lesson 2 remembers whole words with
  double letters (Tasse, Sonne, Kanne) and ends with the skill check. The
  app does not yet compare the child's strokes with the model, so the
  writing tasks are practice and the check rests on the compare and
  remember tasks.
metadata:
  year: klasse-1
  topic: { de: Erste Wörter schreiben, en: Writing first words }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.handwriting.print-letters, lit-de.decoding.two-syllable-words]
  also_practises: [lit-de.decoding.two-syllable-words]
  vocabulary: { de: [abschreiben, merken, vergleichen, Silbe] }
  forms: [drawn, audio]
  drawn: [writing-lines, word-card, letter-card, syllable-arcs]
  facets: [script]
  misconceptions:
    - id: letter-by-letter-copy
      what: Looks back at the model after every letter, loses the place and skips or doubles a letter
      addressed: "Learn teaches to remember a whole syllable; flash tasks cover the word so it must be kept in mind; l1-f2 and l1-s2 ask for the copy with a skipped letter"
    - id: no-compare
      what: Never checks the copy against the model, so mistakes stay
      addressed: "every stage has a compare task (true_false with model and copy side by side); the hints on l2-f3 count the letters that differ"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Silbe für Silbe abschreiben, en: Copying syllable by syllable }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tracing
            text: "Schreib das a ab."
            say: "Schreib das kleine a ab. Es bleibt im Erdgeschoss."
            show: { drawn: writing-lines, text: "a", mode: copy, arrows: false }
            char: "a"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: syllable-arcs, word: "Nase", syllables: ["Na", "se"] }
            options: [{ object: nose }, { object: ear }]
            answer: nose
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 lesen  2 merken  3 schreiben  4 vergleichen"
            say: "So schreibst du ab. Erst liest du das Wort. Dann merkst du es dir. Dann schreibst du es auf. Zum Schluss vergleichst du Buchstabe für Buchstabe."
            show: { drawn: word-card, text: "Sofa" }
          - text: "So fa"
            say: "Merk dir nicht jeden Buchstaben einzeln. Merk dir eine ganze Silbe: So. Schreib So. Dann die nächste: fa."
            show: { drawn: syllable-arcs, word: "Sofa", syllables: ["So", "fa"] }
          - text: "Sofa"
            say: "Jetzt schreib das Wort ab. Fang jeden Buchstaben oben an."
            show: { drawn: writing-lines, text: "Sofa", mode: copy, arrows: false }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Oma ab. Merk dir das ganze Wort und schreib es auf."
                show: { drawn: writing-lines, text: "Oma", mode: copy, arrows: false }
                char: "Oma"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort ist richtig abgeschrieben?"
                say: "Ben hat Sofa abgeschrieben, dreimal. Welches ist richtig?"
                show: { drawn: word-card, text: "Sofa" }
                options: ["Sfa", "Sofa", "Sofe"]
                option_audio: false
                answer: "Sofa"
                feedback:
                  Sfa: "Hier fehlt das o. Vergleiche Buchstabe für Buchstabe: S, o, f, a."
                  Sofe: "Am Ende steht ein e statt a. Schau auf den letzten Buchstaben."
                hints:
                  - "Vergleiche jedes Wort mit der Vorlage, Buchstabe für Buchstabe."
                  - "Die Vorlage hat vier Buchstaben: S, o, f, a."
                  - "Sofa ist richtig."
              - id: l1-f3
                type: true_false
                text: "Ist das richtig abgeschrieben?"
                say: "Links steht die Vorlage, rechts die Abschrift. Ist das richtig abgeschrieben?"
                show: { drawn: letter-card, text: "Dose Dose" }
                answer: true
                hints:
                  - "Vergleiche den ersten Buchstaben, dann den zweiten, und so weiter."
                  - "D und D, o und o, s und s, e und e."
                  - "Ja, alles gleich."
              - id: l1-f4
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Merk dir das Wort. Gleich ist es weg. Wie war es geschrieben?"
                show: { drawn: word-card, text: "Limo", flash: 2 }
                options: ["Lima", "Limo", "Lmo"]
                option_audio: false
                answer: "Limo"
                hints:
                  - "Merk dir die zwei Silben. Tippe auf Nochmal sehen."
                  - "Li ... mo. Die zweite Silbe hört mit o auf."
                  - "Limo."
              - id: l1-f5
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Dose ab. Erst die Silbe Do, dann se."
                show: { drawn: writing-lines, text: "Dose", mode: copy, arrows: false }
                char: "Dose"

          - support: some
            tasks:
              - id: l1-s1
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Esel ab. Merk dir eine Silbe nach der anderen."
                show: { drawn: writing-lines, text: "Esel", mode: copy, arrows: false }
                char: "Esel"
              - id: l1-s2
                type: multiple_choice
                text: "Welches Wort ist richtig abgeschrieben?"
                say: "Mia hat Nudel abgeschrieben. Welches ist richtig?"
                show: { drawn: word-card, text: "Nudel" }
                options: ["Nudel", "Nudl", "Nadel"]
                option_audio: false
                answer: "Nudel"
                hints: ["Vergleiche Buchstabe für Buchstabe."]
              - id: l1-s3
                type: true_false
                text: "Ist das richtig abgeschrieben?"
                say: "Links die Vorlage, rechts die Abschrift. Ist das richtig abgeschrieben?"
                show: { drawn: letter-card, text: "Nase Nsae" }
                answer: false
                hints: ["Schau auf den zweiten und dritten Buchstaben."]
              - id: l1-s4
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Merk dir das Wort. Wie war es geschrieben?"
                show: { drawn: word-card, text: "Pudel", flash: 2 }
                options: ["Pudel", "Pudl", "Budel"]
                option_audio: false
                answer: "Pudel"
                hints: ["Pu ... del. Merk dir beide Silben."]
              - id: l1-s5
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Limo ab."
                show: { drawn: writing-lines, text: "Limo", mode: copy, arrows: false }
                char: "Limo"

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Ist das richtig abgeschrieben?"
                say: "Links die Vorlage, rechts die Abschrift. Ist das richtig abgeschrieben?"
                show: { drawn: letter-card, text: "Esel Esel" }
                answer: true
              - id: l1-n2
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Merk dir das Wort. Wie war es geschrieben?"
                show: { drawn: word-card, text: "Sofa", flash: 2 }
                options: ["Sofe", "Sfa", "Sofa"]
                option_audio: false
                answer: "Sofa"
              - id: l1-n3
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Nase ab."
                show: { drawn: writing-lines, text: "Nase", mode: copy, arrows: false }
                char: "Nase"
              - id: l1-n4
                type: multiple_choice
                text: "Welches Wort ist richtig abgeschrieben?"
                say: "Tom hat Esel abgeschrieben. Welches ist richtig?"
                show: { drawn: word-card, text: "Esel" }
                options: ["Esl", "Esel", "Eesl"]
                option_audio: false
                answer: "Esel"
              - id: l1-n5
                type: true_false
                text: "Ist das richtig abgeschrieben?"
                say: "Links die Vorlage, rechts die Abschrift. Ist das richtig abgeschrieben?"
                show: { drawn: letter-card, text: "Limo Lino" }
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort ist richtig abgeschrieben?"
            say: "Lea hat Dose abgeschrieben. Welches ist richtig?"
            show: { drawn: word-card, text: "Dose" }
            options: ["Dse", "Dosa", "Dose"]
            option_audio: false
            answer: "Dose"
          - id: l1-c2
            type: true_false
            text: "Ist das richtig abgeschrieben?"
            say: "Links die Vorlage, rechts die Abschrift. Ist das richtig abgeschrieben?"
            show: { drawn: letter-card, text: "Pudel Pudel" }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Welches Wort war es?"
            say: "Merk dir das Wort. Wie war es geschrieben?"
            show: { drawn: word-card, text: "Nase", flash: 2 }
            options: ["Nase", "Nasa", "Nse"]
            option_audio: false
            answer: "Nase"

  - n: 2
    title: { de: Ganze Wörter merken, en: Remembering whole words }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Ist das richtig abgeschrieben?"
            say: "Links die Vorlage, rechts die Abschrift. Ist das richtig abgeschrieben?"
            show: { drawn: letter-card, text: "Sofa Sfoa" }
            answer: false
            difficulty: easy
          - id: l2-w2
            type: tracing
            text: "Schreib das Wort ab."
            say: "Schreib Mama ab."
            show: { drawn: writing-lines, text: "Mama", mode: copy, arrows: false }
            char: "Mama"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Tasse"
            say: "Manche Wörter haben zwei gleiche Buchstaben in der Mitte. Die musst du dir besonders merken. Tasse: zwei s."
            show: { drawn: word-card, text: "Tasse" }
          - text: "Tas se"
            say: "Die Silben helfen: Tas ... se. Die erste Silbe hört mit s auf, die zweite fängt mit s an."
            show: { drawn: syllable-arcs, word: "Tasse", syllables: ["Tas", "se"] }
          - text: "Tasse"
            say: "Lies, merk dir, schreib, vergleiche. Hast du beide s?"
            show: { drawn: writing-lines, text: "Tasse", mode: copy, arrows: false }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Merk dir das Wort. Wie war es geschrieben?"
                show: { drawn: word-card, text: "Sonne", flash: 2 }
                options: ["Sone", "Sonne", "Sonnne"]
                option_audio: false
                answer: "Sonne"
                hints:
                  - "Wie viele n waren in der Mitte? Tippe auf Nochmal sehen."
                  - "Son ... ne. Die erste Silbe hört mit n auf, die zweite fängt mit n an."
                  - "Sonne, mit zwei n."
                difficulty: easy
              - id: l2-f2
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Tasse ab. Denk an die zwei s."
                show: { drawn: writing-lines, text: "Tasse", mode: copy, arrows: false }
                char: "Tasse"
              - id: l2-f3
                type: true_false
                text: "Ist das richtig abgeschrieben?"
                say: "Links die Vorlage, rechts die Abschrift. Ist das richtig abgeschrieben?"
                show: { drawn: letter-card, text: "Kanne Kane" }
                answer: false
                hints:
                  - "Vergleiche Buchstabe für Buchstabe."
                  - "Zähl die n in beiden Wörtern."
                  - "Nein. In der Abschrift fehlt ein n."
              - id: l2-f4
                type: multiple_choice
                text: "Welches Wort ist richtig abgeschrieben?"
                say: "Paul hat Kiste abgeschrieben. Welches ist richtig?"
                show: { drawn: word-card, text: "Kiste" }
                options: ["Kiste", "Kitse", "Kste"]
                option_audio: false
                answer: "Kiste"
                hints:
                  - "Vergleiche jedes Wort mit der Vorlage."
                  - "Kis ... te. Erst s, dann t."
                  - "Kiste."
              - id: l2-f5
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Ente ab."
                show: { drawn: writing-lines, text: "Ente", mode: copy, arrows: false }
                char: "Ente"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Merk dir das Wort. Wie war es geschrieben?"
                show: { drawn: word-card, text: "Kanne", flash: 2 }
                options: ["Kane", "Kanne", "Kanen"]
                option_audio: false
                answer: "Kanne"
                hints: ["Zwei gleiche Buchstaben in der Mitte."]
              - id: l2-s2
                type: true_false
                text: "Ist das richtig abgeschrieben?"
                say: "Links die Vorlage, rechts die Abschrift. Ist das richtig abgeschrieben?"
                show: { drawn: letter-card, text: "Affe Affe" }
                answer: true
                hints: ["Vergleiche Buchstabe für Buchstabe."]
              - id: l2-s3
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Sonne ab."
                show: { drawn: writing-lines, text: "Sonne", mode: copy, arrows: false }
                char: "Sonne"
              - id: l2-s4
                type: multiple_choice
                text: "Welches Wort ist richtig abgeschrieben?"
                say: "Ida hat Tonne abgeschrieben. Welches ist richtig?"
                show: { drawn: word-card, text: "Tonne" }
                options: ["Tone", "Tonne", "Tanne"]
                option_audio: false
                answer: "Tonne"
                hints: ["Schau auf den zweiten Buchstaben und zähl die n."]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Merk dir das Wort. Wie war es geschrieben?"
                show: { drawn: word-card, text: "Affe", flash: 2 }
                options: ["Afe", "Affe", "Afffe"]
                option_audio: false
                answer: "Affe"
                hints: ["Wie viele f waren es?"]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "Ist das richtig abgeschrieben?"
                say: "Links die Vorlage, rechts die Abschrift. Ist das richtig abgeschrieben?"
                show: { drawn: letter-card, text: "Tasse Tase" }
                answer: false
              - id: l2-n2
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Merk dir das Wort. Wie war es geschrieben?"
                show: { drawn: word-card, text: "Tanne", flash: 2 }
                options: ["Tanne", "Tonne", "Tane"]
                option_audio: false
                answer: "Tanne"
              - id: l2-n3
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Kanne ab."
                show: { drawn: writing-lines, text: "Kanne", mode: copy, arrows: false }
                char: "Kanne"
              - id: l2-n4
                type: multiple_choice
                text: "Welches Wort ist richtig abgeschrieben?"
                say: "Emil hat Ente abgeschrieben. Welches ist richtig?"
                show: { drawn: word-card, text: "Ente" }
                options: ["Ente", "Etne", "Nte"]
                option_audio: false
                answer: "Ente"
              - id: l2-n5
                type: true_false
                text: "Ist das richtig abgeschrieben?"
                say: "Links die Vorlage, rechts die Abschrift. Ist das richtig abgeschrieben?"
                show: { drawn: letter-card, text: "Kiste Kiste" }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welches Wort war es?"
            say: "Merk dir das Wort gut. Wie war es geschrieben?"
            show: { drawn: word-card, text: "Tasse", flash: 2 }
            options: ["Tase", "Tasse", "Tasee"]
            option_audio: false
            answer: "Tasse"
          - id: l2-c2
            type: true_false
            text: "Ist das richtig abgeschrieben?"
            say: "Vorlage und Abschrift. Ist das richtig abgeschrieben?"
            show: { drawn: letter-card, text: "Sonne Sonne" }
            answer: true
          - id: l2-c3
            type: multiple_choice
            text: "Welches Wort ist richtig abgeschrieben?"
            say: "Jan hat Kanne abgeschrieben. Welches ist richtig?"
            show: { drawn: word-card, text: "Kanne" }
            options: ["Kanne", "Kane", "Kanna"]
            option_audio: false
            answer: "Kanne"
          - id: l2-c4
            type: true_false
            text: "Ist das richtig abgeschrieben?"
            say: "Vorlage und Abschrift. Ist das richtig abgeschrieben?"
            show: { drawn: letter-card, text: "Pudel Pubel" }
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Welches Wort war es?"
            say: "Merk dir das Wort gut. Wie war es geschrieben?"
            show: { drawn: word-card, text: "Kiste", flash: 2 }
            options: ["Kitse", "Kiste", "Kisste"]
            option_audio: false
            answer: "Kiste"
