# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.core-vocabulary
skill: lit-de.spelling.core-vocabulary
curriculum: de-DE
language: de
title:
  de: Wörter, die oft vorkommen
  en: Common core words
summary: >
  The most common words of the Grundwortschatz. Lesson 1 takes small
  words that come in almost every sentence (und, ist, nicht, auch, sehr,
  schon, immer); lesson 2 takes common Tunwörter and Nomen (gehen, sehen,
  heute, wieder, Freund, Schule, nach Hause), finds a misspelt word in a
  sentence, and ends with the skill check. Writing the words in a
  dictation waits for the letter keyboard (text_input with letters).
metadata:
  year: klasse-2
  topic: { de: Rechtschreibung üben, en: Spelling practice }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling.dictation-short]
  also_practises: [lit-de.spelling-strategies.memory-words, lit-de.spelling-strategies.lengthen-dt]
  vocabulary: { de: [Wort, Grundwortschatz, Fehler, einprägen] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: write-as-heard
      what: Writes the small words as they sound (unt, nich, ser, gehn)
      addressed: lesson 1 Learn shows und with d and sehr with h; every stage has a misspelt word to find in a sentence and a choice with the as-heard spelling
    - id: h-and-double
      what: Leaves out or adds an h or a double letter (schohn, imer, Schuhle)
      addressed: lesson 1 Learn names sehr, schon and immer; a gap in every stage of lesson 1 asks for h, a double letter or a single o (l1-f5 immer, l1-s2 dann, l1-n2 schon, l1-c3 sehr); misspelt cards l1-s3 schohn, l1-n4 imer, l2-s4 Schuhle and l2-c2 komt
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Kleine Wörter", en: "Small words" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Mama. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Mama" }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Silben hat immer?"
            say: "Immer. Wie viele Silben hat das Wort?"
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "und | ist | nicht | auch"
            say: "Manche Wörter kommen in fast jedem Satz vor: und, ist, nicht, auch. Wenn du sie sicher schreiben kannst, hast du schon viel geschafft."
          - text: "und | ist"
            say: "Bei und hörst du am Ende ein t, aber du schreibst d. Bei ist hörst du ein t und schreibst auch t. Präge dir beide Wörter gut ein."
          - text: "sehr | schon | immer"
            say: "Diese Wörter musst du dir auch merken: sehr mit h, schon ohne h und immer mit zwei m."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Und. Welches Wort ist richtig geschrieben?"
                options: ["und", "unt", "undt"]
                answer: "und"
                option_audio: false
                hints:
                  - "Und ist ein Merkwort. Denk daran, wie es aussieht."
                  - "Und: Am Ende höre ich ein t. Aber und schreibt man mit einem anderen Buchstaben."
                  - "und."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Nicht. Was fehlt?"
                frame: "ni_t"
                options: ["ch", "h", "g"]
                answer: ["ch"]
                hints:
                  - "Sprich das Wort langsam: nicht."
                  - "Ni, ch, t: In der Mitte höre ich ch wie in ich."
                  - "ch."
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Ich spiele unt lache." }
                spans: ["unt"]
                hints:
                  - "Lies jedes Wort genau."
                  - "Ich, spiele, unt, lache. Bei einem kleinen Wort stimmt der letzte Buchstabe nicht."
                  - "Tippe auf unt. Richtig ist und."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Sehr. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "sehr" }
                answer: true
                hints:
                  - "Lies das Wort langsam und schau dir jeden Buchstaben an."
                  - "Sehr schreibt man mit h nach dem e. Steht das h auf der Karte?"
                  - "Ja, das ist richtig."
              - id: l1-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Immer. Was fehlt?"
                frame: "i_er"
                options: ["mm", "m", "hm"]
                answer: ["mm"]
                hints:
                  - "Schwinge das Wort: im, mer."
                  - "Jede Silbe hat ein m."
                  - "mm."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Ist. Welches Wort ist richtig geschrieben?"
                options: ["ist", "isd", "ihst"]
                answer: "ist"
                option_audio: false
                hints: ["Sprich ist ganz deutlich bis zum Ende."]
              - id: l1-s2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Dann. Was fehlt?"
                frame: "da_"
                options: ["nn", "n", "hn"]
                answer: ["nn"]
                hints: ["Das a in dann ist kurz. Was schreibst du nach einem kurzen Selbstlaut?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Wir sind schohn da." }
                spans: ["schohn"]
                hints: ["Schon schreibst du ohne h."]
              - id: l1-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Nicht. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "nich" }
                answer: false
                hints: ["Sprich das Wort bis zum Ende."]
              - id: l1-s5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Mit. Was fehlt?"
                frame: "mi_"
                options: ["t", "d", "tt"]
                answer: ["t"]
                hints: ["Mit ist ein kurzes Wort mit einem t."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Sind. Welches Wort ist richtig geschrieben?"
                options: ["sind", "sint", "sindt"]
                answer: "sind"
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Schon. Was fehlt?"
                frame: "sch_n"
                options: ["o", "oh", "oo"]
                answer: ["o"]
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Das ist ser schön." }
                spans: ["ser"]
              - id: l1-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Immer. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "imer" }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Wir. Was fehlt?"
                frame: "w_r"
                options: ["i", "ie", "ih"]
                answer: ["i"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Nicht. Welches Wort ist richtig geschrieben?"
            options: ["nicht", "nich", "nichd"]
            answer: "nicht"
            option_audio: false
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Ich bin auh müde." }
            spans: ["auh"]
          - id: l1-c3
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Sehr. Was fehlt?"
            frame: "se_r"
            options: ["h", "e", "r"]
            answer: ["h"]

  - n: 2
    title: { de: "Wichtige Wörter im Satz", en: "Important words in sentences" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Und. Was fehlt am Ende?"
            frame: "un_"
            options: ["d", "t"]
            answer: ["d"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Immer. Welches Wort ist richtig geschrieben?"
            options: ["immer", "imer", "ihmer"]
            answer: "immer"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "haben | gehen | sehen | kommen"
            say: "Diese Tunwörter brauchst du oft. Bei gehen und sehen hörst du das h kaum. Trotzdem schreibst du es."
          - text: "heute | Freund | wieder"
            say: "Heute und Freund schreibst du mit eu, wieder mit ie."
          - text: "nach Hause | die Schule"
            say: "Nach Hause schreibst du mit e am Ende. Schule schreibst du mit Sch und einem u."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Gehen. Welches Wort ist richtig geschrieben?"
                options: ["gehen", "gehn", "geen"]
                answer: "gehen"
                option_audio: false
                hints:
                  - "Schwinge das Wort: ge, hen."
                  - "Die zweite Silbe fängt mit h an."
                  - "gehen."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Heute. Was fehlt?"
                frame: "h_te"
                options: ["eu", "äu", "oi"]
                answer: ["eu"]
                hints:
                  - "Such ein verwandtes Wort mit au."
                  - "Heute: Ich finde kein verwandtes Wort mit au. Also schreibe ich eu."
                  - "eu."
              - id: l2-f3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Wir gehn in die Schule." }
                spans: ["gehn"]
                hints:
                  - "Lies jedes Wort genau und schwinge es."
                  - "Ich schwinge gehen: ge, hen. Ein Wort im Satz hat eine Silbe zu wenig."
                  - "Tippe auf gehn. Richtig ist gehen."
              - id: l2-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Wieder. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "wieder" }
                answer: true
                hints:
                  - "Lies das Wort langsam und schau dir jeden Buchstaben an."
                  - "Wieder schreibt man mit ie nach dem w. Steht das auf der Karte?"
                  - "Ja, das ist richtig."
              - id: l2-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Der Freund. Was fehlt?"
                frame: "Fr_nd"
                options: ["eu", "äu", "ei"]
                answer: ["eu"]
                hints:
                  - "Such ein verwandtes Wort mit au."
                  - "Freund: Ich finde kein verwandtes Wort mit au. Also schreibe ich eu."
                  - "eu."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Sehen. Welches Wort ist richtig geschrieben?"
                options: ["sehen", "sehn", "seen"]
                answer: "sehen"
                option_audio: false
                hints: ["Schwinge das Wort: se, hen."]
              - id: l2-s2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Wieder. Was fehlt?"
                frame: "w_der"
                options: ["ie", "ih", "ieh"]
                answer: ["ie"]
                hints: ["Wieder ist ein Merkwort mit ie."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Ich habe heude frei." }
                spans: ["heude"]
                hints: ["Heute endet mit te."]
              - id: l2-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Die Schule. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Schuhle" }
                answer: false
                hints: ["Schule schreibst du ohne h."]
              - id: l2-s5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Haben. Was fehlt?"
                frame: "ha_en"
                options: ["b", "p", "w"]
                answer: ["b"]
                hints: ["Schwinge das Wort: ha, ben."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Kommen. Welches Wort ist richtig geschrieben?"
                options: ["kommen", "komen", "kohmen"]
                answer: "kommen"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Nach Hause. Was fehlt?"
                frame: "nach Haus_"
                options: ["e", "a", "er"]
                answer: ["e"]
              - id: l2-n3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Mein Froind kommt mit." }
                spans: ["Froind"]
              - id: l2-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Haben. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "haben" }
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Die Schule. Was fehlt?"
                frame: "_ule"
                options: ["Sch", "Sh", "Ch"]
                answer: ["Sch"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Auch. Welches Wort ist richtig geschrieben?"
            options: ["auch", "auh", "aoch"]
            answer: "auch"
            option_audio: false
          - id: l2-c2
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Morgen komt Oma zu uns." }
            spans: ["komt"]
          - id: l2-c3
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Gehen. Was fehlt?"
            frame: "ge_en"
            options: ["h", "e", "n"]
            answer: ["h"]
          - id: l2-c4
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Wieder. Welches Wort ist richtig geschrieben?"
            options: ["wieder", "wieda", "wiehder"]
            answer: "wieder"
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Der Freund. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Freund" }
            answer: true
