# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.media-use
skill: lit-de.texts-media.media-use
curriculum: de-DE
language: de
title:
  de: Medien bewusst nutzen
  en: Using media wisely
summary: >
  Thinking about the media children use every day: audio stories, videos,
  games and apps. Lesson 1 asks what a medium wants (informieren,
  unterhalten, verkaufen) and finds advertising, also where it hides: an
  Anzeige at the top of a search, a product praised in a video. Lesson 2
  reads the Altersfreigabe, sees that a free game can still cost money,
  keeps personal data private, checks a chain message before passing it
  on, and says what helps when a video was frightening or screen time ran
  long; it ends with the skill check. All pages, videos and messages are
  described in text and written for Twist.
metadata:
  year: klasse-4
  topic: { de: Medien, en: Media }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.texts-media.digital-texts]
  also_practises: [lit-de.texts-media.research]
  vocabulary: { de: [Medien, informieren, unterhalten, Werbung, Anzeige, gesponsert, Suchmaschine, Treffer, Altersfreigabe, In-App-Kauf, persönliche Daten, Kettenbrief, Pause] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: hidden-ads
      what: Sees advertising only in a classic advert and misses it when a person in a video praises a product or a search result is marked Anzeige
      addressed: "lesson 1 Learn shows the Anzeige label and a product praised in a video; every stage of lesson 1 sorts Werbung from other content (l1-f2, l1-s2, l1-n2) and finds the advert among search results (l1-f3, l1-n3), with feedback on l1-f3; l1-s4 and l2-c2 ask about a video"
    - id: free-is-free
      what: Thinks a free game or app costs nothing and a purchase inside it is harmless
      addressed: "lesson 2 Learn explains In-App-Käufe; l2-f3, l2-s3 and l2-c4 ask about a purchase in a free game, with feedback on l2-s3"
    - id: age-rating-difficulty
      what: Reads the Altersfreigabe as how hard a game is, not as whether it is suitable
      addressed: "lesson 2 Learn says what the number means; l2-f1 gives feedback on zu leicht; l2-s1, l2-n1 and l2-c5 read a rating against the child's age"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was wollen Medien von mir?", en: "What do media want from me?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Der Uhu\nUhus jagen in der Nacht.\n[Bild: Ein Uhu mit orangen Augen]\n[Ton: So ruft ein Uhu]\n\nWo erfährst du, wie ein Uhu ruft?"
            say: "Lies die Seite. Wo erfährst du, wie ein Uhu ruft?"
            options: ["im Ton", "im Bild", "in der Überschrift"]
            answer: "im Ton"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Mit welchem Link kommst du ganz an den Anfang einer Kinderseite?"
            options: ["Startseite", "Zurück", "Suche"]
            answer: "Startseite"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Hörspiel, Video, Spiel, App, Zeitschrift\n\ninformieren: Du erfährst etwas.\nunterhalten: Du hast Spaß.\nverkaufen: Jemand will dein Geld."
            say: "Hörspiele, Videos, Spiele, Apps und Zeitschriften sind Medien. Jedes Medium will etwas von dir. Manche wollen dich informieren, dann erfährst du etwas Neues. Manche wollen dich unterhalten, dann hast du Spaß. Und manche wollen dir etwas verkaufen."
          - text: "Anzeige\nSuper-Schleim in zehn Farben! Jetzt bestellen!"
            say: "Werbung will, dass du etwas kaufst. Oft steht klein darüber: Anzeige, Werbung oder gesponsert. Auch in einer Suchmaschine stehen ganz oben oft Anzeigen. Der erste Treffer ist also nicht immer der beste."
          - text: "Mia zeigt in ihrem Video: „Das sind meine neuen Turnschuhe von Flitzi. Die sind einfach die besten!“\nUnter dem Video steht: Werbung"
            say: "Manchmal ist Werbung gut versteckt. Jemand lobt in einem Video ein Ding und nennt die Marke. Oft hat die Person es geschenkt bekommen oder wird dafür bezahlt. Dann muss dabeistehen, dass es Werbung ist. Frag dich immer: Will mir hier jemand etwas verkaufen?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Eine Kindersendung beginnt so: „Heute erklären wir euch, warum der Mond nicht immer rund aussieht.“\n\nWas will die Sendung?"
                say: "Eine Kindersendung beginnt so: Heute erklären wir euch, warum der Mond nicht immer rund aussieht. Was will die Sendung?"
                options: ["informieren", "verkaufen", "Angst machen"]
                answer: "informieren"
                hints:
                  - "Erfährst du hier etwas, oder sollst du etwas kaufen?"
                  - "Die Sendung erklärt etwas über den Mond."
                  - "Sie will dich informieren."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Werbung oder keine Werbung?"
                say: "Sortiere: Ist das Werbung oder keine Werbung?"
                bins:
                  - { id: ad, show: { text: "Werbung" }, say: "Werbung" }
                  - { id: noad, show: { text: "keine Werbung" }, say: "keine Werbung" }
                options:
                  - { text: "Anzeige: Knusperflocken, jetzt mit Spielzeug!", bin: ad }
                  - { text: "Gesponsert: die neue Spielkonsole Blitz X", bin: ad }
                  - { text: "Kindernachrichten: Heute beginnen in Bayern die Ferien.", bin: noad }
                  - { text: "Hörspiel: Der Drache im Keller, Folge 3", bin: noad }
                hints:
                  - "Schau auf die kleinen Wörter am Anfang."
                  - "Anzeige und gesponsert bedeuten: Jemand will etwas verkaufen."
                  - "Knusperflocken und Spielkonsole sind Werbung, Nachrichten und Hörspiel nicht."
              - id: l1-f3
                type: multiple_choice
                text: "Du suchst: Kaninchen Futter\n\n1. Anzeige: Kaninchenfutter-Mix, heute 30 Prozent billiger!\n2. Was fressen Kaninchen? Kinderlexikon\n3. Kaninchen richtig füttern: Tipps vom Tierschutzverein\n\nWelcher Treffer ist Werbung?"
                say: "Du suchst Kaninchen Futter. Lies die Treffer. Welcher Treffer ist Werbung?"
                options: ["Treffer 1", "Treffer 2", "Treffer 3"]
                answer: "Treffer 1"
                keep_order: true
                feedback:
                  "Treffer 3": "Der Tierschutzverein gibt dir Tipps und will nichts verkaufen. Schau, vor welchem Treffer Anzeige steht."
                hints:
                  - "Welcher Treffer will dir etwas verkaufen?"
                  - "Achte auf das Wort Anzeige."
                  - "Treffer 1 ist eine Anzeige."
              - id: l1-f4
                type: true_false
                text: "Leon sagt in seinem Video: „Mit dem Füller Schreibfix schreibe ich am schönsten. Den müsst ihr haben!“ Unter dem Video steht: Werbung.\n\nWill Leon, dass du den Füller kaufst?"
                say: "Leon sagt in seinem Video: Mit dem Füller Schreibfix schreibe ich am schönsten. Den müsst ihr haben! Unter dem Video steht: Werbung. Will Leon, dass du den Füller kaufst?"
                answer: true
                hints:
                  - "Leon nennt den Namen des Füllers."
                  - "Was steht unter dem Video?"
                  - "Ja, das ist Werbung. Leon will, dass du den Füller kaufst."
              - id: l1-f5
                type: multiple_choice
                text: "Woran erkennst du Werbung im Internet oft?"
                options: ["an Wörtern wie Anzeige oder gesponsert", "an einer blauen Überschrift", "an einem langen Text"]
                answer: "an Wörtern wie Anzeige oder gesponsert"
                hints:
                  - "Denk an die kleinen Wörter über einer Werbung."
                  - "Werbung muss als Werbung gekennzeichnet sein."
                  - "An Wörtern wie Anzeige oder gesponsert."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ein Hörspiel erzählt von einem Hund, der als Detektiv einen verschwundenen Ball sucht.\n\nWas will das Hörspiel vor allem?"
                say: "Ein Hörspiel erzählt von einem Hund, der als Detektiv einen verschwundenen Ball sucht. Was will das Hörspiel vor allem?"
                options: ["unterhalten", "verkaufen", "informieren"]
                answer: "unterhalten"
                hints: ["Ist das eine ausgedachte Geschichte, die Spaß machen soll?"]
              - id: l1-s2
                type: sorting
                text: "Werbung oder keine Werbung?"
                say: "Sortiere: Ist das Werbung oder keine Werbung?"
                bins:
                  - { id: ad, show: { text: "Werbung" }, say: "Werbung" }
                  - { id: noad, show: { text: "keine Werbung" }, say: "keine Werbung" }
                options:
                  - { text: "Werbung: Zahnpasta Frischi, jetzt mit Erdbeergeschmack", bin: ad }
                  - { text: "Anzeige: Trampolin Hüpfmax, nur heute im Angebot", bin: ad }
                  - { text: "Wetterbericht: Morgen scheint die Sonne.", bin: noad }
                  - { text: "Bastelvideo: So faltest du einen Papierflieger", bin: noad }
                hints: ["Will dir jemand etwas verkaufen?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Der erste Treffer in einer Suchmaschine ist immer der beste."
                answer: false
                hints: ["Was steht oft ganz oben in einer Suchmaschine?"]
              - id: l1-s4
                type: multiple_choice
                text: "Ella packt in ihrem Video eine Puppe aus. Sie sagt: „Die hat mir die Firma Lolli geschickt. Holt sie euch auch!“\n\nWas ist das?"
                say: "Ella packt in ihrem Video eine Puppe aus. Sie sagt: Die hat mir die Firma Lolli geschickt. Holt sie euch auch! Was ist das?"
                options: ["Werbung", "eine Nachricht", "ein Märchen"]
                answer: "Werbung"
                hints: ["Ella nennt die Firma und sagt: Holt sie euch auch."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Wörter zeigen dir Werbung?"
                options: ["Anzeige, Werbung, gesponsert", "Startseite, Menü, Suche", "Strophe, Vers, Reim"]
                answer: "Anzeige, Werbung, gesponsert"
                hints: ["Welche Wörter stehen klein über einer Werbung?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Eine Kinderzeitschrift erklärt auf zwei Seiten, wie ein Vulkan ausbricht.\n\nWas will sie?"
                say: "Eine Kinderzeitschrift erklärt auf zwei Seiten, wie ein Vulkan ausbricht. Was will sie?"
                options: ["informieren", "verkaufen", "unterhalten"]
                answer: "informieren"
              - id: l1-n2
                type: sorting
                text: "Werbung oder keine Werbung?"
                say: "Sortiere: Ist das Werbung oder keine Werbung?"
                bins:
                  - { id: ad, show: { text: "Werbung" }, say: "Werbung" }
                  - { id: noad, show: { text: "keine Werbung" }, say: "keine Werbung" }
                options:
                  - { text: "Gesponsert: Sammelkarten Weltall, die neue Serie", bin: ad }
                  - { text: "Anzeige: Fahrradhelm Sausewind, 20 Euro sparen", bin: ad }
                  - { text: "Kinderlexikon: Warum ist der Himmel blau?", bin: noad }
                  - { text: "Hörbuch: Die Insel der Möwen, Kapitel 2", bin: noad }
              - id: l1-n3
                type: multiple_choice
                text: "Du suchst: Igel Winterschlaf\n\n1. Igel im Winter: Wie lange schlafen sie? Kinderseite des Naturkundemuseums\n2. Anzeige: Igelhaus aus Holz, jetzt bestellen!\n3. Igel im Garten helfen: Tipps vom Naturschutzbund\n\nWelcher Treffer ist Werbung?"
                say: "Du suchst Igel Winterschlaf. Lies die Treffer. Welcher Treffer ist Werbung?"
                options: ["Treffer 1", "Treffer 2", "Treffer 3"]
                answer: "Treffer 2"
                keep_order: true
              - id: l1-n4
                type: true_false
                text: "Ein Video zeigt, wie man aus einem alten Karton eine Murmelbahn baut. Es nennt keine Marke und will nichts verkaufen.\n\nIst das Werbung?"
                say: "Ein Video zeigt, wie man aus einem alten Karton eine Murmelbahn baut. Es nennt keine Marke und will nichts verkaufen. Ist das Werbung?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Warum muss bei Werbung ein Wort wie „Anzeige“ stehen?"
                say: "Warum muss bei Werbung ein Wort wie Anzeige stehen?"
                options: ["Damit du weißt, dass jemand etwas verkaufen will.", "Damit die Seite schöner aussieht.", "Weil der Text besonders wichtig ist."]
                answer: "Damit du weißt, dass jemand etwas verkaufen will."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ein Spiel lässt dich mit einem Drachen durch Wolken fliegen und Sterne sammeln.\n\nWas will das Spiel vor allem?"
            say: "Ein Spiel lässt dich mit einem Drachen durch Wolken fliegen und Sterne sammeln. Was will das Spiel vor allem?"
            options: ["unterhalten", "informieren", "verkaufen"]
            answer: "unterhalten"
          - id: l1-c2
            type: multiple_choice
            text: "Was ist Werbung?"
            options: ["Anzeige: Schokoriegel Mampf, jetzt in der Riesenpackung", "Nachrichten: Im Zoo ist ein Elefant geboren.", "Hörspiel: Das Geheimnis der alten Mühle"]
            answer: "Anzeige: Schokoriegel Mampf, jetzt in der Riesenpackung"
          - id: l1-c3
            type: multiple_choice
            text: "Du suchst: Pferde Rassen\n\n1. Pferderassen für Kinder erklärt\n2. Pferdebücher für Kinder: Ausleihen in der Stadtbücherei\n3. Anzeige: Reithelm Galopp, nur noch heute billiger!\n\nWelcher Treffer ist Werbung?"
            say: "Du suchst Pferde Rassen. Lies die Treffer. Welcher Treffer ist Werbung?"
            options: ["Treffer 1", "Treffer 2", "Treffer 3"]
            answer: "Treffer 3"
            keep_order: true

  - n: 2
    title: { de: "Klug mit Medien umgehen", en: "Using media sensibly" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Eine Sendung erklärt, wie Bienen Honig machen. Was will sie?"
            options: ["informieren", "verkaufen", "unterhalten"]
            answer: "informieren"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Über einem Bild steht klein: Anzeige. Ist das Werbung?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Spiel: USK ab 6\nFilm: FSK ab 12"
            say: "Auf Spielen und Filmen steht eine Altersfreigabe. Die Zahl sagt nicht, wie schwer ein Spiel ist. Sie sagt, ab welchem Alter es nicht zu gruselig oder zu brutal ist. Ein Film ab zwölf ist also noch nichts für dich."
          - text: "Kostenlos spielen!\n100 Edelsteine für 4,99 €"
            say: "Viele Spiele und Apps sind kostenlos. Im Spiel kann man aber Dinge kaufen, zum Beispiel Edelsteine oder neue Kleidung für die Spielfigur. Das heißt In-App-Kauf, und es kostet echtes Geld. Frag immer zuerst deine Eltern."
          - text: "Name, Adresse, Telefonnummer, Passwort, Fotos von dir\nbleiben privat.\n\nKettenbrief: „Schick das an zehn Freunde weiter!“\nNicht weiterschicken."
            say: "Deine persönlichen Daten schreibst du nicht ins Internet und gibst sie keinem Fremden. Manche Nachrichten sagen: Schick das an zehn Freunde weiter! Das ist ein Kettenbrief. Du schickst ihn nicht weiter. Nicht alles, was in einer Nachricht oder einem Video gesagt wird, stimmt. Wenn dir ein Video Angst macht oder dir eine Nachricht komisch vorkommt, sprich mit einem Erwachsenen, dem du vertraust. Und wenn dir die Augen brennen oder du schlechte Laune bekommst, mach eine Pause."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Du bist neun Jahre alt. Ein Spiel hat die Freigabe „USK ab 12“. Was bedeutet das für dich?"
                say: "Du bist neun Jahre alt. Ein Spiel hat die Freigabe USK ab zwölf. Was bedeutet das für dich?"
                options: ["Das Spiel ist noch nichts für mein Alter.", "Das Spiel ist zu leicht für mich.", "Ich darf es spielen, wenn ich gut aufpasse."]
                answer: "Das Spiel ist noch nichts für mein Alter."
                feedback:
                  "Das Spiel ist zu leicht für mich.": "Die Zahl sagt nichts darüber, wie schwer ein Spiel ist. Sie sagt, ab welchem Alter es passt."
                hints:
                  - "Was sagt die Zahl auf dem Spiel?"
                  - "Du bist neun. Ist neun schon zwölf?"
                  - "Das Spiel ist erst ab zwölf, also noch nichts für dich."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Bleibt das privat, oder kannst du es erzählen?"
                say: "Sortiere: Bleibt das privat, oder kannst du es im Internet erzählen?"
                bins:
                  - { id: private, show: { text: "bleibt privat" }, say: "bleibt privat" }
                  - { id: share, show: { text: "kann ich erzählen" }, say: "kann ich erzählen" }
                options:
                  - { text: "meine Adresse", bin: private }
                  - { text: "mein Passwort", bin: private }
                  - { text: "mein Lieblingstier", bin: share }
                  - { text: "meine Lieblingsfarbe", bin: share }
                hints:
                  - "Womit könnte ein Fremder dich finden oder in dein Konto kommen?"
                  - "Adresse und Passwort sind persönliche Daten."
                  - "Adresse und Passwort bleiben privat. Lieblingstier und Lieblingsfarbe kannst du erzählen."
              - id: l2-f3
                type: true_false
                text: "Auf dem Spiel „Zauberwald“ steht groß: Kostenlos!\n\nKann das Spiel trotzdem Geld kosten?"
                say: "Auf dem Spiel Zauberwald steht groß: Kostenlos! Kann das Spiel trotzdem Geld kosten?"
                answer: true
                hints:
                  - "Denk an die Edelsteine im Spiel."
                  - "Im Spiel kann man oft Dinge kaufen."
                  - "Ja, In-App-Käufe kosten echtes Geld."
              - id: l2-f4
                type: multiple_choice
                text: "Du hast ein gruseliges Video gesehen und kannst nicht einschlafen. Was ist gut?"
                options: ["mit Mama, Papa oder einer anderen vertrauten Person darüber sprechen", "noch mehr solche Videos ansehen", "niemandem davon erzählen"]
                answer: "mit Mama, Papa oder einer anderen vertrauten Person darüber sprechen"
                hints:
                  - "Was hilft, wenn dich etwas bedrückt?"
                  - "Mit wem kannst du über deine Angst reden?"
                  - "Sprich mit einem Erwachsenen, dem du vertraust."
              - id: l2-f5
                type: multiple_choice
                text: "Du bekommst diese Nachricht: „Schick das an zehn Freunde, sonst passiert dir heute etwas Schlimmes!“\n\nWas machst du?"
                say: "Du bekommst diese Nachricht: Schick das an zehn Freunde, sonst passiert dir heute etwas Schlimmes! Was machst du?"
                options: ["Ich schicke sie nicht weiter und zeige sie einem Erwachsenen.", "Ich schicke sie schnell an zehn Freunde.", "Ich glaube es und habe den ganzen Tag Angst."]
                answer: "Ich schicke sie nicht weiter und zeige sie einem Erwachsenen."
                hints:
                  - "Kann eine Nachricht wirklich etwas Schlimmes passieren lassen?"
                  - "So eine Nachricht heißt Kettenbrief. Sie will nur, dass sie weitergeschickt wird."
                  - "Nicht weiterschicken und einem Erwachsenen zeigen."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Du bist zehn Jahre alt. Ein Film hat die Freigabe „FSK ab 6“. Passt der Film nach der Altersfreigabe für dich?"
                say: "Du bist zehn Jahre alt. Ein Film hat die Freigabe FSK ab sechs. Passt der Film nach der Altersfreigabe für dich?"
                answer: true
                hints: ["Ist zehn mehr oder weniger als sechs?"]
              - id: l2-s2
                type: sorting
                text: "Bleibt das privat, oder kannst du es erzählen?"
                say: "Sortiere: Bleibt das privat, oder kannst du es im Internet erzählen?"
                bins:
                  - { id: private, show: { text: "bleibt privat" }, say: "bleibt privat" }
                  - { id: share, show: { text: "kann ich erzählen" }, say: "kann ich erzählen" }
                options:
                  - { text: "meine Telefonnummer", bin: private }
                  - { text: "der Name meiner Schule", bin: private }
                  - { text: "mein Lieblingsbuch", bin: share }
                  - { text: "dass ich gern schwimme", bin: share }
                hints: ["Kann ein Fremder damit herausfinden, wo du bist?"]
              - id: l2-s3
                type: multiple_choice
                text: "Im Spiel blinkt: „Nur heute! 500 Münzen für 9,99 €!“\n\nWas machst du?"
                say: "Im Spiel blinkt: Nur heute! Fünfhundert Münzen für neun Euro neunundneunzig! Was machst du?"
                options: ["Ich frage zuerst meine Eltern.", "Ich tippe schnell auf Kaufen.", "Ich nehme heimlich das Passwort von Papa."]
                answer: "Ich frage zuerst meine Eltern."
                feedback:
                  "Ich tippe schnell auf Kaufen.": "Die Münzen kosten echtes Geld. Nur heute soll dich zum schnellen Kaufen bringen."
                hints: ["Kosten die Münzen echtes Geld?"]
              - id: l2-s4
                type: true_false
                text: "Lina spielt schon seit zwei Stunden auf dem Tablet. Ihre Augen brennen.\n\nIst jetzt eine Pause sinnvoll?"
                say: "Lina spielt schon seit zwei Stunden auf dem Tablet. Ihre Augen brennen. Ist jetzt eine Pause sinnvoll?"
                answer: true
                hints: ["Was sagen dir brennende Augen?"]
              - id: l2-s5
                type: multiple_choice
                text: "Jonas sagt: „Das habe ich in einem Video gesehen. Also stimmt es.“\n\nWas meinst du dazu?"
                say: "Jonas sagt: Das habe ich in einem Video gesehen. Also stimmt es. Was meinst du dazu?"
                options: ["Auch in Videos kann etwas Falsches gesagt werden.", "Was in Videos gesagt wird, stimmt immer.", "Videos sind immer Werbung."]
                answer: "Auch in Videos kann etwas Falsches gesagt werden."
                hints: ["Kann jeder ein Video machen und hochladen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Du bist neun Jahre alt. Welches Spiel passt nach der Altersfreigabe für dich?"
                options: ["USK ab 6", "USK ab 12", "USK ab 16"]
                answer: "USK ab 6"
              - id: l2-n2
                type: sorting
                text: "Bleibt das privat, oder kannst du es erzählen?"
                say: "Sortiere: Bleibt das privat, oder kannst du es im Internet erzählen?"
                bins:
                  - { id: private, show: { text: "bleibt privat" }, say: "bleibt privat" }
                  - { id: share, show: { text: "kann ich erzählen" }, say: "kann ich erzählen" }
                options:
                  - { text: "ein Foto von mir vor unserer Haustür", bin: private }
                  - { text: "mein voller Name mit Geburtstag", bin: private }
                  - { text: "dass ich Pizza mag", bin: share }
                  - { text: "mein Lieblingsspiel", bin: share }
              - id: l2-n3
                type: true_false
                text: "Ein fremder Spieler im Chat fragt nach deiner Adresse. Schreibst du sie ihm?"
                answer: false
              - id: l2-n4
