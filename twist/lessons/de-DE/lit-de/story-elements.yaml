# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.story-elements
skill: lit-de.texts-media.story-elements
curriculum: de-DE
language: de
title:
  de: Figuren, Ort, Zeit und Handlung
  en: Characters, place, time and plot
summary: >
  Naming the parts of a story with the right terms. Lesson 1 finds the
  Hauptfigur and Nebenfiguren, the Ort and the Zeit in short stories;
  lesson 2 follows the Handlung through Einleitung, Hauptteil with its
  Höhepunkt, and Schluss, and ends with the skill check. All stories are
  written for Twist.
metadata:
  year: klasse-3
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.comprehension.order-story]
  also_practises: [lit-de.comprehension.order-story]
  vocabulary: { de: [Figur, Hauptfigur, Nebenfigur, Ort, Zeit, Handlung, Einleitung, Hauptteil, Höhepunkt, Schluss] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: first-named-is-main
      what: Takes the first person named as the Hauptfigur
      addressed: "l1-f1, l1-s1 and l1-n1 name a Nebenfigur first; feedback on l1-f1 says the Hauptfigur is the one the story is about"
    - id: place-time-mixed
      what: Mixes up Ort and Zeit (am Abend as a place, im Park as a time)
      addressed: "every stage of lesson 1 sorts phrases into Figur, Ort and Zeit (l1-f4, l1-s4, l1-n4) with im and am phrases of both kinds"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wer, wo und wann?", en: "Who, where and when?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Leg die Sätze in die richtige Reihenfolge."
            say: "Leg die Sätze so, dass eine sinnvolle Geschichte entsteht."
            options: ["Tim leckt die Tropfen von seinen Fingern.", "Tim kauft sich ein Eis.", "Die Sonne scheint, und das Eis schmilzt schnell."]
            slot_count: 3
            answer: ["Tim kauft sich ein Eis.", "Die Sonne scheint, und das Eis schmilzt schnell.", "Tim leckt die Tropfen von seinen Fingern."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was passiert zuerst?"
            say: "Was passiert zuerst?"
            options: ["Die Kinder bauen einen Schneemann.", "Der Schneemann schmilzt.", "Die Sonne scheint warm auf den Schneemann."]
            answer: "Die Kinder bauen einen Schneemann."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "An einem kalten Wintermorgen ging Ida mit ihrem Hund Fips in den Wald. Ihr Nachbar Herr Lang winkte ihr zu."
            say: "Jede Geschichte hat Figuren. Die Hauptfigur ist die, um die es vor allem geht: Ida. Fips und Herr Lang sind Nebenfiguren."
          - text: "Ort: im Wald | Zeit: an einem kalten Wintermorgen"
            say: "Der Ort sagt, wo die Geschichte spielt: im Wald. Die Zeit sagt, wann sie spielt: an einem kalten Wintermorgen. Frag: Wo? Und: Wann?"
          - text: "Figuren: Wer? | Ort: Wo? | Zeit: Wann? | Handlung: Was passiert?"
            say: "Und die Handlung ist das, was passiert. Mit diesen vier Fragen kannst du jede Geschichte beschreiben."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Mama brachte Jonas zum Bahnhof. Jonas fuhr zum ersten Mal allein mit dem Zug zu Oma. Er war sehr aufgeregt und zählte die Haltestellen.\n\nWer ist die Hauptfigur?"
                say: "Lies die Geschichte. Wer ist die Hauptfigur?"
                options: ["Jonas", "Mama", "Oma"]
                answer: "Jonas"
                feedback:
                  "Mama": "Mama kommt zuerst vor, aber um wen geht es in der Geschichte vor allem?"
                hints:
                  - "Die Hauptfigur ist die, um die es vor allem geht."
                  - "Wer fährt Zug? Wer ist aufgeregt?"
                  - "Jonas ist die Hauptfigur."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Am Samstagnachmittag spielten Lea und Can auf dem Spielplatz Fangen.\n\nWo spielt die Geschichte?"
                say: "Lies den Satz. Wo spielt die Geschichte?"
                options: ["auf dem Spielplatz", "am Samstagnachmittag", "Lea und Can"]
                answer: "auf dem Spielplatz"
                hints:
                  - "Frag: Wo?"
                  - "Samstagnachmittag sagt, wann."
                  - "auf dem Spielplatz."
              - id: l1-f3
                type: multiple_choice
                text: "In den Sommerferien zeltete Familie Öztürk an einem See.\n\nWann spielt die Geschichte?"
                say: "Lies den Satz. Wann spielt die Geschichte?"
                options: ["in den Sommerferien", "an einem See", "Familie Öztürk"]
                answer: "in den Sommerferien"
                hints:
                  - "Frag: Wann?"
                  - "An einem See sagt, wo."
                  - "in den Sommerferien."
              - id: l1-f4
                type: sorting
                text: "Figur, Ort oder Zeit?"
                say: "Sortiere: Ist es eine Figur, ein Ort oder eine Zeit?"
                bins:
                  - { id: who, show: { text: "Figur (Wer?)" }, say: "Figur" }
                  - { id: where, show: { text: "Ort (Wo?)" }, say: "Ort" }
                  - { id: when, show: { text: "Zeit (Wann?)" }, say: "Zeit" }
                options:
                  - { text: "ein kleiner Drache", bin: who }
                  - { text: "im Schloss", bin: where }
                  - { text: "am Abend", bin: when }
                  - { text: "im Winter", bin: when }
                hints:
                  - "Frag bei jedem: Wer? Wo? Wann?"
                  - "Im Schloss ist ein Ort, im Winter eine Zeit."
                  - "Drache: Figur. Im Schloss: Ort. Am Abend und im Winter: Zeit."
              - id: l1-f5
                type: true_false
                text: "Der Bäcker Herr Huber stand jeden Morgen um vier Uhr auf. In seiner Backstube roch es nach frischen Brötchen.\n\nIst die Backstube der Ort der Geschichte?"
                say: "Lies die Geschichte. Ist die Backstube der Ort der Geschichte?"
                answer: true
                hints:
                  - "Frag: Wo spielt die Geschichte?"
                  - "Wo riecht es nach Brötchen?"
                  - "Ja, die Backstube ist der Ort."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Der Lehrer stellte der Klasse ein neues Mädchen vor. Es hieß Amira. Amira war schüchtern, aber am Ende des Tages hatte sie schon zwei Freundinnen.\n\nWer ist die Hauptfigur?"
                say: "Lies die Geschichte. Wer ist die Hauptfigur?"
                options: ["Amira", "der Lehrer", "die Klasse"]
                answer: "Amira"
                hints: ["Um wen geht es vor allem?"]
              - id: l1-s2
                type: multiple_choice
                text: "Mitten in der Nacht hörte Paul ein Kratzen unter seinem Bett.\n\nWann spielt die Geschichte?"
                say: "Lies den Satz. Wann spielt die Geschichte?"
                options: ["mitten in der Nacht", "unter seinem Bett", "Paul"]
                answer: "mitten in der Nacht"
                hints: ["Frag: Wann?"]
              - id: l1-s3
                type: multiple_choice
                text: "Im Zoo fütterte die Tierpflegerin Frau Kraus die Pinguine. Ein kleiner Pinguin schnappte ihr den Eimer weg.\n\nWelche Figur ist eine Nebenfigur?"
                say: "Lies die Geschichte. Die Tierpflegerin ist die Hauptfigur. Welche Figur ist eine Nebenfigur?"
                options: ["der kleine Pinguin", "der Zoo", "der Eimer"]
                answer: "der kleine Pinguin"
                hints: ["Eine Figur handelt oder spricht. Ist ein Eimer eine Figur?"]
              - id: l1-s4
                type: sorting
                text: "Figur, Ort oder Zeit?"
                say: "Sortiere: Ist es eine Figur, ein Ort oder eine Zeit?"
                bins:
                  - { id: who, show: { text: "Figur (Wer?)" }, say: "Figur" }
                  - { id: where, show: { text: "Ort (Wo?)" }, say: "Ort" }
                  - { id: when, show: { text: "Zeit (Wann?)" }, say: "Zeit" }
                options:
                  - { text: "eine alte Frau", bin: who }
                  - { text: "am Strand", bin: where }
                  - { text: "im Keller", bin: where }
                  - { text: "am Montag", bin: when }
                hints: ["Am Strand oder am Montag: Welches ist ein Ort?"]
              - id: l1-s5
                type: true_false
                text: "Am Montagmorgen fand Mila im Schulflur einen Schlüssel.\n\nIst „am Montagmorgen“ der Ort der Geschichte?"
                say: "Lies den Satz. Ist am Montagmorgen der Ort der Geschichte?"
                answer: false
                hints: ["Frag: Wo? Oder: Wann?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Opa schenkte Lukas ein altes Fernglas. Damit beobachtete Lukas jeden Tag die Vögel im Garten. Bald kannte er zwanzig Vogelarten.\n\nWer ist die Hauptfigur?"
                say: "Lies die Geschichte. Wer ist die Hauptfigur?"
                options: ["Lukas", "Opa", "die Vögel"]
                answer: "Lukas"
              - id: l1-n2
                type: multiple_choice
                text: "Auf dem Dachboden fand Emma eine alte Truhe.\n\nWo spielt die Geschichte?"
                say: "Lies den Satz. Wo spielt die Geschichte?"
                options: ["auf dem Dachboden", "Emma", "eine alte Truhe"]
                answer: "auf dem Dachboden"
              - id: l1-n3
                type: multiple_choice
                text: "Vor vielen hundert Jahren lebte in einer Burg ein Ritter, der Angst vor Mäusen hatte.\n\nWann spielt die Geschichte?"
                say: "Lies den Satz. Wann spielt die Geschichte?"
                options: ["vor vielen hundert Jahren", "in einer Burg", "ein Ritter"]
                answer: "vor vielen hundert Jahren"
              - id: l1-n4
                type: sorting
                text: "Figur, Ort oder Zeit?"
                say: "Sortiere: Ist es eine Figur, ein Ort oder eine Zeit?"
                bins:
                  - { id: who, show: { text: "Figur (Wer?)" }, say: "Figur" }
                  - { id: where, show: { text: "Ort (Wo?)" }, say: "Ort" }
                  - { id: when, show: { text: "Zeit (Wann?)" }, say: "Zeit" }
                options:
                  - { text: "ein frecher Rabe", bin: who }
                  - { text: "im Herbst", bin: when }
                  - { text: "im Wald", bin: where }
                  - { text: "nach der Schule", bin: when }
              - id: l1-n5
                type: true_false
                text: "Die Katze Mimi schlich durch den dunklen Garten. Plötzlich sah sie zwei grüne Augen.\n\nIst Mimi eine Figur der Geschichte?"
                say: "Lies die Geschichte. Ist Mimi eine Figur der Geschichte?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "An einem stürmischen Abend klopfte es an der Tür der Berghütte.\n\nWo spielt die Geschichte?"
            say: "Lies den Satz. Wo spielt die Geschichte?"
            options: ["in der Berghütte", "an einem stürmischen Abend", "die Tür"]
            answer: "in der Berghütte"
          - id: l1-c2
            type: multiple_choice
            text: "Die Trainerin pfiff. Mia lief los und schoss ein Tor. Ihr Team jubelte.\n\nWer ist die Hauptfigur?"
            say: "Lies die Geschichte. Wer ist die Hauptfigur?"
            options: ["Mia", "die Trainerin", "das Team"]
            answer: "Mia"
          - id: l1-c3
            type: true_false
            text: "Im Frühling baute die Amsel ein Nest in der Hecke.\n\nIst „im Frühling“ die Zeit der Geschichte?"
            say: "Lies den Satz. Ist im Frühling die Zeit der Geschichte?"
            answer: true

  - n: 2
    title: { de: "Die Handlung", en: "The plot" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Am Nachmittag ging Ben mit seiner Schwester ins Schwimmbad.\n\nWann spielt die Geschichte?"
            say: "Lies den Satz. Wann spielt die Geschichte?"
            options: ["am Nachmittag", "im Schwimmbad", "Ben"]
            answer: "am Nachmittag"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Frage passt zum Ort einer Geschichte?"
            say: "Welche Frage passt zum Ort einer Geschichte?"
            options: ["Wo?", "Wann?", "Wer?"]
            answer: "Wo?"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Einleitung: Nele geht mit ihrem Hund Bello im Park spazieren."
            say: "Die Handlung hat drei Teile. In der Einleitung erfährst du, wer mitspielt, wo und wann."
          - text: "Hauptteil: Bello reißt sich los und rennt weg. Nele sucht ihn überall. Endlich hört sie ein Bellen am Teich."
            say: "Im Hauptteil passiert etwas Besonderes, oft ein Problem. Die Spannung steigt bis zum Höhepunkt: Wo ist Bello?"
          - text: "Schluss: Bello sitzt nass am Ufer. Nele nimmt ihn glücklich in den Arm."
            say: "Im Schluss wird das Problem gelöst, und die Geschichte endet. Einleitung, Hauptteil mit Höhepunkt, Schluss."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Es war Sonntag. Tom und Opa wollten angeln gehen.\n\nZu welchem Teil der Geschichte gehören diese Sätze?"
                say: "Lies die Sätze. Zu welchem Teil der Geschichte gehören sie?"
                options: ["Einleitung", "Hauptteil", "Schluss"]
                answer: "Einleitung"
                keep_order: true
                feedback:
                  "Hauptteil": "Hier passiert noch nichts Besonderes. Du erfährst nur, wer mitspielt und wann."
                hints:
                  - "Was erfährst du in diesen Sätzen?"
                  - "Wer, wann, was sie vorhaben. So fängt eine Geschichte an."
                  - "Das ist die Einleitung."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Leg die Teile in die richtige Reihenfolge."
                say: "Leg die Teile der Geschichte in die richtige Reihenfolge: Einleitung, Hauptteil, Schluss."
                options: ["Zum Glück findet Ali den Schlüssel in seiner Jackentasche.", "Ali kommt von der Schule nach Hause.", "Er kann seinen Schlüssel nicht finden. Die Tür bleibt zu."]
                slot_count: 3
                answer: ["Ali kommt von der Schule nach Hause.", "Er kann seinen Schlüssel nicht finden. Die Tür bleibt zu.", "Zum Glück findet Ali den Schlüssel in seiner Jackentasche."]
                option_audio: false
                hints:
                  - "Was ist die Einleitung? Wo ist das Problem? Wo wird es gelöst?"
                  - "Das Problem ist der fehlende Schlüssel."
                  - "Nach Hause kommen, Schlüssel fehlt, Schlüssel gefunden."
              - id: l2-f3
                type: multiple_choice
                text: "Lina klettert auf den Baum, um ihre Katze zu retten. Der Ast knackt. Lina hält die Luft an.\n\nWelcher Satz ist der Höhepunkt?"
                say: "Lies die Sätze. Welcher Satz ist der Höhepunkt, also die spannendste Stelle?"
                options: ["Der Ast knackt.", "Lina klettert auf den Baum.", "Lina hat eine Katze."]
                answer: "Der Ast knackt."
                hints:
                  - "An welcher Stelle hältst du beim Lesen die Luft an?"
                  - "Was könnte gleich passieren?"
                  - "Der Ast knackt."
              - id: l2-f4
                type: multiple_choice
                text: "Endlich kam der Zug. Oma stieg aus und umarmte alle.\n\nZu welchem Teil der Geschichte gehören diese Sätze?"
                say: "Lies die Sätze. Zu welchem Teil der Geschichte gehören sie?"
                options: ["Einleitung", "Hauptteil", "Schluss"]
                answer: "Schluss"
                keep_order: true
                hints:
                  - "Wird hier etwas gelöst?"
                  - "Endlich zeigt: Das Warten ist vorbei."
                  - "Das ist der Schluss."
              - id: l2-f5
                type: true_false
                text: "Im Hauptteil einer Geschichte passiert meistens etwas Besonderes oder Spannendes. Stimmt das?"
                say: "Im Hauptteil einer Geschichte passiert meistens etwas Besonderes oder Spannendes. Stimmt das?"
                answer: true
                hints:
                  - "Denk an Neles Hund Bello."
                  - "Im Hauptteil rennt Bello weg."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Plötzlich ging im ganzen Haus das Licht aus. Mia tastete sich durch den dunklen Flur.\n\nZu welchem Teil der Geschichte gehören diese Sätze?"
                say: "Lies die Sätze. Zu welchem Teil der Geschichte gehören sie?"
                options: ["Einleitung", "Hauptteil", "Schluss"]
                answer: "Hauptteil"
                keep_order: true
                hints: ["Passiert hier etwas Spannendes?"]
              - id: l2-s2
                type: ordering
                text: "Leg die Teile in die richtige Reihenfolge."
                say: "Leg die Teile der Geschichte in die richtige Reihenfolge: Einleitung, Hauptteil, Schluss."
                options: ["Am Abend hängt das Bild im Wohnzimmer.", "Jana malt ein Bild für Mamas Geburtstag.", "Da kippt das Wasserglas um und läuft über das Bild."]
                slot_count: 3
                answer: ["Jana malt ein Bild für Mamas Geburtstag.", "Da kippt das Wasserglas um und läuft über das Bild.", "Am Abend hängt das Bild im Wohnzimmer."]
                option_audio: false
                hints: ["Was ist das Problem in der Geschichte?"]
              - id: l2-s3
                type: multiple_choice
                text: "Die Kinder warten auf den Bus. Ein Hund läuft auf die Straße. Ein Auto kommt angerast.\n\nWelcher Satz ist der Höhepunkt?"
                say: "Lies die Sätze. Welcher Satz ist der Höhepunkt?"
                options: ["Ein Auto kommt angerast.", "Die Kinder warten auf den Bus.", "Es ist Morgen."]
                answer: "Ein Auto kommt angerast."
                hints: ["Wo ist es am spannendsten?"]
              - id: l2-s4
                type: true_false
                text: "„Es war ein kalter Morgen im Dezember. Ole und seine Schwester gingen zur Schule.“ Ist das ein Schluss?"
                say: "Lies die Sätze. Ist das ein Schluss?"
                answer: false
                hints: ["Erfährst du hier, wer, wo und wann?"]
              - id: l2-s5
                type: multiple_choice
                text: "Was gehört in den Schluss einer Geschichte?"
                say: "Was gehört in den Schluss einer Geschichte?"
                options: ["wie das Problem gelöst wird", "wer die Figuren sind", "wie das Problem beginnt"]
                answer: "wie das Problem gelöst wird"
                hints: ["Am Ende ist das Problem vorbei."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Am letzten Ferientag fuhr Familie Wolf ans Meer.\n\nZu welchem Teil der Geschichte gehört dieser Satz?"
                say: "Lies den Satz. Zu welchem Teil der Geschichte gehört er?"
                options: ["Einleitung", "Hauptteil", "Schluss"]
                answer: "Einleitung"
                keep_order: true
              - id: l2-n2
                type: ordering
                text: "Leg die Teile in die richtige Reihenfolge."
                say: "Leg die Teile der Geschichte in die richtige Reihenfolge: Einleitung, Hauptteil, Schluss."
                options: ["Mit Papas Hilfe flicken sie den Reifen und fahren weiter.", "Mitten im Wald gibt es einen lauten Knall: Der Reifen ist platt.", "Leo und Papa machen eine Radtour."]
                slot_count: 3
                answer: ["Leo und Papa machen eine Radtour.", "Mitten im Wald gibt es einen lauten Knall: Der Reifen ist platt.", "Mit Papas Hilfe flicken sie den Reifen und fahren weiter."]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Sara übt Seiltanzen im Zirkus. Sie geht langsam über das Seil. In der Mitte fängt das Seil an zu wackeln.\n\nWelcher Satz ist der Höhepunkt?"
                say: "Lies die Sätze. Welcher Satz ist der Höhepunkt?"
                options: ["In der Mitte fängt das Seil an zu wackeln.", "Sara übt Seiltanzen im Zirkus.", "Sie geht langsam über das Seil."]
                answer: "In der Mitte fängt das Seil an zu wackeln."
              - id: l2-n4
                type: multiple_choice
                text: "Was erfährst du meistens in der Einleitung?"
                say: "Was erfährst du meistens in der Einleitung einer Geschichte?"
                options: ["wer mitspielt, wo und wann", "wie die Geschichte ausgeht", "die spannendste Stelle"]
                answer: "wer mitspielt, wo und wann"
              - id: l2-n5
                type: true_false
                text: "„Müde, aber glücklich schliefen alle ein.“ Ist das ein Schluss?"
                say: "Lies den Satz. Ist das ein Schluss?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Herr Meier pflanzte jedes Jahr Tomaten. Sein Nachbar Herr Wu half ihm dabei. Dieses Jahr wurden die Tomaten so groß wie Bälle.\n\nWer ist die Hauptfigur?"
            say: "Lies die Geschichte. Wer ist die Hauptfigur?"
            options: ["Herr Meier", "Herr Wu", "die Tomaten"]
            answer: "Herr Meier"
          - id: l2-c2
            type: sorting
            text: "Wer, wo oder wann?"
            say: "Sortiere: Ist es eine Figur, ein Ort oder eine Zeit?"
            bins:
              - { id: who, show: { text: "Figur (Wer?)" }, say: "Figur" }
              - { id: where, show: { text: "Ort (Wo?)" }, say: "Ort" }
              - { id: when, show: { text: "Zeit (Wann?)" }, say: "Zeit" }
            options:
              - { text: "ein mutiger Junge", bin: who }
              - { text: "auf dem Schiff", bin: where }
              - { text: "am Morgen", bin: when }
              - { text: "an der Bushaltestelle", bin: where }
          - id: l2-c3
            type: ordering
            text: "Leg die Teile in die richtige Reihenfolge."
            say: "Leg die Teile der Geschichte in die richtige Reihenfolge: Einleitung, Hauptteil, Schluss."
            options: ["Der Hund bringt den Ball zurück, und alle lachen.", "Die Kinder spielen im Garten Ball.", "Der Ball fliegt über den Zaun zum Nachbarhund."]
            slot_count: 3
            answer: ["Die Kinder spielen im Garten Ball.", "Der Ball fliegt über den Zaun zum Nachbarhund.", "Der Hund bringt den Ball zurück, und alle lachen."]
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Die Tür quietschte. Langsam ging sie auf. Ein Schatten stand im Zimmer.\n\nZu welchem Teil der Geschichte gehören diese Sätze?"
            say: "Lies die Sätze. Zu welchem Teil der Geschichte gehören sie?"
            options: ["Einleitung", "Hauptteil", "Schluss"]
            answer: "Hauptteil"
            keep_order: true
          - id: l2-c5
            type: multiple_choice
            text: "Was ist die Handlung einer Geschichte?"
            say: "Was ist die Handlung einer Geschichte?"
            options: ["das, was passiert", "der Ort, an dem sie spielt", "die Hauptfigur"]
            answer: "das, was passiert"
