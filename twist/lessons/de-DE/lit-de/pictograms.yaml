# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.pictograms
skill: lit-de.texts-media.pictograms
curriculum: de-DE
language: de
title:
  de: Bildzeichen verstehen
  en: Understanding signs and symbols
summary: >
  Reading the picture signs of everyday life. Lesson 1 reads the
  Bildzeichen that tell a child in a workbook what to do (pencil: write,
  scissors: cut out, ear: listen, eye: look closely, mouth: say it,
  crayon: colour in, open book: read) and learns that a sign means an
  action, not just the thing on it; lesson 2 reads signs outside: the
  traffic light, the signs for the way to the bus, cycle path, café and telephone,
  and a red line across a picture that means "not allowed", and ends with
  the skill check.
metadata:
  year: klasse-1
  topic: { de: Bildzeichen und Diagramme, en: Signs and charts }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [Bildzeichen, Zeichen, Schild, Ampel, verboten, erlaubt] }
  forms: [picture, text, audio, drawn]
  drawn: [colour-swatch]
  facets: []
  misconceptions:
    - id: thing-not-action
      what: Reads a sign as the thing it shows (eine Schere) and not as what to do (Schneide aus) or what is there (the way to the bus, not a bus)
      addressed: "lesson 1 Learn says the scissors mean Schneide aus; l1-f1 and l1-f3 (with feedback), l1-s1, l1-n1, l2-f2 (with feedback), l2-s2 and l2-c2 offer the name of the thing as a wrong option"
    - id: crossed-out
      what: Misses that a red line across a picture means it is not allowed, and reads the sign as an invitation (Hier gibt es Eis)
      addressed: "lesson 2 Learn shows the crossed-out ice cream; l2-f4 (with feedback), l2-s4, l2-n4 and l2-c4 ask about crossed-out signs and offer the invitation as an option"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bildzeichen im Heft", en: "Symbols in the workbook" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "Schneide aus."
            say: "In deinem Heft stehen oft kleine Bilder vor einer Aufgabe. Das sind Bildzeichen. Sie sagen dir ohne Wörter, was du tun sollst. Die Schere heißt nicht: Hier ist eine Schere. Sie heißt: Schneide aus."
            show: { object: scissors }
          - text: "Schreib.\nMal aus."
            say: "Der Bleistift heißt: Schreib. Der Buntstift heißt: Mal aus."
            show: { objects: [pencil, crayon] }
          - text: "Hör zu.\nSchau genau hin."
            say: "Das Ohr heißt: Hör zu. Das Auge heißt: Schau genau hin."
            show: { objects: [ear, eye] }
          - text: "Erzähle.\nLies."
            say: "Der Mund heißt: Sprich oder erzähle. Und das offene Buch heißt: Lies."
            show: { objects: [mouth, book-open] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was sollst du tun?"
                say: "Dieses Bildzeichen steht vor einer Aufgabe. Was sollst du tun?"
                show: { object: scissors }
                options: ["Schneide aus.", "eine Schere", "Mal aus."]
                answer: "Schneide aus."
                feedback:
                  "eine Schere": "Das ist das Bild. Aber was sollst du mit der Schere tun?"
                hints:
                  - "Ein Bildzeichen sagt dir, was du tun sollst."
                  - "Was macht man mit einer Schere?"
                  - "Schneide aus."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Welches Bildzeichen heißt: Hör zu?"
                say: "Welches Bildzeichen heißt: Hör zu?"
                options: [{ object: ear }, { object: eye }, { object: mouth }]
                answer: ear
                option_audio: false
                hints:
                  - "Womit hörst du?"
                  - "Du hörst mit den Ohren."
                  - "Tippe auf das Ohr."
              - id: l1-f3
                type: multiple_choice
                text: "Was sollst du tun?"
                say: "Dieses Bildzeichen steht vor einer Aufgabe. Was sollst du tun?"
                show: { object: pencil }
                options: ["Schreib.", "ein Bleistift", "Schneide aus."]
                answer: "Schreib."
                feedback:
                  "ein Bleistift": "Das ist das Bild. Was sollst du mit dem Bleistift tun?"
                hints:
                  - "Was macht man mit einem Bleistift?"
                  - "Mit dem Bleistift schreibst du Buchstaben und Wörter."
                  - "Schreib."
              - id: l1-f4
                type: matching
                text: "Was heißt welches Bildzeichen?"
                say: "Verbinde jedes Bildzeichen mit dem, was du tun sollst."
                option_audio: false
                pairs:
                  - { left: { object: crayon }, right: { text: "Mal aus." } }
                  - { left: { object: eye }, right: { text: "Schau genau hin." } }
                  - { left: { object: ear }, right: { text: "Hör zu." } }
                hints:
                  - "Nimm ein Bild nach dem anderen. Was machst du damit?"
                  - "Mit dem Auge schaust du, mit dem Ohr hörst du."
                  - "Buntstift: Mal aus. Auge: Schau genau hin. Ohr: Hör zu."
              - id: l1-f5
                type: true_false
                text: "Stimmt das?"
                say: "Vor der Aufgabe ist ein Mund. Heißt das: Erzähle?"
                show: { object: mouth }
                answer: true
                hints:
                  - "Was machst du mit dem Mund?"
                  - "Mit dem Mund sprichst du."
                  - "Ja. Der Mund heißt: Sprich oder erzähle."
              - id: l1-f6
                type: image_multiple_choice
                text: "Welches Bildzeichen heißt: Lies?"
                say: "Welches Bildzeichen heißt: Lies?"
                options: [{ object: book-open }, { object: pencil }, { object: scissors }]
                answer: book-open
                option_audio: false
                hints:
                  - "Was brauchst du zum Lesen?"
                  - "Du liest in einem Buch."
                  - "Tippe auf das offene Buch."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was sollst du tun?"
                say: "Dieses Bildzeichen steht vor einer Aufgabe. Was sollst du tun?"
                show: { object: crayon }
                options: ["Mal aus.", "ein Buntstift", "Hör zu."]
                answer: "Mal aus."
                hints: ["Was machst du mit einem Buntstift?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welches Bildzeichen heißt: Schau genau hin?"
                say: "Welches Bildzeichen heißt: Schau genau hin?"
                options: [{ object: eye }, { object: ear }, { object: book-open }]
                answer: eye
                option_audio: false
                hints: ["Womit schaust du?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das?"
                say: "Vor der Aufgabe ist eine Schere. Heißt das: Mal aus?"
                show: { object: scissors }
                answer: false
                hints: ["Was machst du mit einer Schere?"]
              - id: l1-s4
                type: matching
                text: "Was heißt welches Bildzeichen?"
                say: "Verbinde jedes Bildzeichen mit dem, was du tun sollst."
                option_audio: false
                pairs:
                  - { left: { object: pencil }, right: { text: "Schreib." } }
                  - { left: { object: mouth }, right: { text: "Erzähle." } }
                  - { left: { object: book-open }, right: { text: "Lies." } }
                hints: ["Was machst du mit einem Stift, mit dem Mund und mit einem Buch?"]
              - id: l1-s5
                type: multiple_choice
                text: "Zwei Bildzeichen: Bleistift und Ohr.\n\nWas sollst du tun?"
                say: "Vor der Aufgabe sind zwei Bildzeichen: ein Bleistift und ein Ohr. Was sollst du tun?"
                show: { objects: [pencil, ear] }
                options: ["Hör zu und schreib.", "Lies und mal aus.", "Schneide aus."]
                answer: "Hör zu und schreib."
                hints: ["Was heißt der Bleistift, was heißt das Ohr?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was sollst du tun?"
                say: "Dieses Bildzeichen steht vor einer Aufgabe. Was sollst du tun?"
                show: { object: book-open }
                options: ["Lies.", "ein Buch", "Schreib."]
                answer: "Lies."
              - id: l1-n2
                type: image_multiple_choice
                text: "Welches Bildzeichen heißt: Erzähle?"
                say: "Welches Bildzeichen heißt: Erzähle?"
                options: [{ object: mouth }, { object: eye }, { object: crayon }]
                answer: mouth
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Stimmt das?"
                say: "Vor der Aufgabe ist ein Auge. Heißt das: Hör zu?"
                show: { object: eye }
                answer: false
              - id: l1-n4
                type: matching
                text: "Was heißt welches Bildzeichen?"
                say: "Verbinde jedes Bildzeichen mit dem, was du tun sollst."
                option_audio: false
                pairs:
                  - { left: { object: scissors }, right: { text: "Schneide aus." } }
                  - { left: { object: crayon }, right: { text: "Mal aus." } }
                  - { left: { object: ear }, right: { text: "Hör zu." } }
                  - { left: { object: eye }, right: { text: "Schau genau hin." } }
              - id: l1-n5
                type: multiple_choice
                text: "Zwei Bildzeichen: Buntstift und Schere.\n\nWas sollst du tun?"
                say: "Vor der Aufgabe sind zwei Bildzeichen: ein Buntstift und eine Schere. Was sollst du tun?"
                show: { objects: [crayon, scissors] }
                options: ["Mal aus und schneide aus.", "Schreib und lies.", "Hör zu."]
                answer: "Mal aus und schneide aus."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was sollst du tun?"
            say: "Dieses Bildzeichen steht vor einer Aufgabe. Was sollst du tun?"
            show: { object: ear }
            options: ["Hör zu.", "Schau genau hin.", "Schreib."]
            answer: "Hör zu."
          - id: l1-c2
            type: image_multiple_choice
            text: "Welches Bildzeichen heißt: Schneide aus?"
            say: "Welches Bildzeichen heißt: Schneide aus?"
            options: [{ object: scissors }, { object: crayon }, { object: pencil }]
            answer: scissors
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Stimmt das?"
            say: "Vor der Aufgabe ist ein Bleistift. Heißt das: Schreib?"
            show: { object: pencil }
            answer: true

  - n: 2
    title: { de: "Bildzeichen draußen", en: "Signs outside" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was sollst du tun?"
            say: "Dieses Bildzeichen steht in deinem Heft. Was sollst du tun?"
            show: { object: mouth }
            options: ["Erzähle.", "Mal aus.", "Hör zu."]
            answer: "Erzähle."
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Welches Bildzeichen heißt: Mal aus?"
            say: "Welches Bildzeichen heißt: Mal aus?"
            options: [{ object: crayon }, { object: scissors }, { object: ear }]
            answer: crayon
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Rot: stehen bleiben\nGrün: gehen"
            say: "Auch draußen gibt es Bildzeichen. Die Ampel kennst du. Leuchtet sie rot, bleibst du stehen. Leuchtet sie grün, darfst du gehen."
            show: { drawn: colour-swatch, colour: red }
          - text: "Hier geht es zum Bus."
            say: "Am Bahnhof hängt ein Schild mit einem Bus. Das heißt nicht: Hier ist ein Bus. Es heißt: Hier geht es zum Bus. Ein Fahrrad auf einem blauen Schild heißt: Hier ist ein Radweg."
            show: { object: bus }
          - text: "Ein Eis mit einem roten Strich darüber:\nHier darfst du kein Eis essen."
            say: "Manchmal ist ein Bild rot durchgestrichen. Dann heißt das: Das ist hier verboten. Ein durchgestrichenes Eis heißt: Hier darfst du kein Eis essen. Bildzeichen verstehst du auch ohne Lesen, und in jedem Land."
            show: { object: ice-cream }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Die Ampel leuchtet so.\n\nWas machst du?"
                say: "Du willst über die Straße. Die Ampel leuchtet so. Was machst du?"
                show: { drawn: colour-swatch, colour: red }
                options: ["Ich bleibe stehen.", "Ich gehe über die Straße.", "Ich renne schnell."]
                answer: "Ich bleibe stehen."
                hints:
                  - "Welche Farbe hat die Ampel?"
                  - "Rot heißt: stehen bleiben."
                  - "Ich bleibe stehen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Am Bahnhof ist ein Schild mit einem Bus.\n\nWas heißt das?"
                say: "Am Bahnhof hängt ein Schild mit einem Bus. Was heißt das?"
                show: { object: bus }
                options: ["Hier geht es zum Bus.", "Hier wohnt ein Bus.", "Hier kannst du einen Bus kaufen."]
                answer: "Hier geht es zum Bus."
                feedback:
                  "Hier wohnt ein Bus.": "Ein Bus wohnt nirgends. Wohin zeigt dir das Schild den Weg?"
                hints:
                  - "Ein Schild sagt dir, was es hier gibt oder wo es langgeht."
                  - "Du willst mit dem Bus fahren. Wo findest du ihn?"
                  - "Hier geht es zum Bus."
              - id: l2-f3
                type: image_multiple_choice
                text: "Welches Schild zeigt einen Radweg?"
                say: "Welches Schild zeigt dir einen Radweg?"
                options: [{ object: bike }, { object: car }, { object: bus }]
                answer: bike
                option_audio: false
                hints:
                  - "Wer fährt auf einem Radweg?"
                  - "Auf dem Radweg fährst du Rad."
                  - "Tippe auf das Fahrrad."
              - id: l2-f4
                type: multiple_choice
                text: "Am Spielplatz ist ein Schild: ein Hund mit einem roten Strich darüber.\n\nWas heißt das?"
                say: "Am Spielplatz hängt ein Schild. Darauf ist ein Hund mit einem roten Strich darüber. Was heißt das?"
                show: { object: dog }
                options: ["Hunde dürfen hier nicht hinein.", "Hier spielen Hunde.", "Hier gibt es Hunde zu kaufen."]
                answer: "Hunde dürfen hier nicht hinein."
                feedback:
                  "Hier spielen Hunde.": "Schau auf den roten Strich. Was heißt ein roter Strich über einem Bild?"
                hints:
                  - "Was heißt ein roter Strich über einem Bild?"
                  - "Durchgestrichen heißt: verboten."
                  - "Hunde dürfen hier nicht hinein."
              - id: l2-f5
                type: true_false
                text: "Stimmt das?"
                say: "Bildzeichen kann man auch ohne Lesen verstehen. Stimmt das?"
                answer: true
                hints:
                  - "Muss man ein Bild lesen?"
                  - "Ein Bild zeigt dir etwas, auch wenn du die Wörter nicht kennst."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Die Ampel leuchtet so.\n\nWas machst du?"
                say: "Du stehst an der Ampel. Sie leuchtet so. Was machst du?"
                show: { drawn: colour-swatch, colour: green }
                options: ["Ich gehe über die Straße.", "Ich bleibe stehen.", "Ich setze mich hin."]
                answer: "Ich gehe über die Straße."
                hints: ["Grün heißt: gehen."]
              - id: l2-s2
                type: multiple_choice
                text: "Auf einem Schild ist eine Tasse.\n\nWas heißt das?"
                say: "Auf einem Schild ist eine Tasse. Was heißt das?"
                show: { object: cup }
                options: ["Hier kannst du etwas trinken.", "Hier ist eine Tasse kaputt.", "Hier wohnt eine Tasse."]
                answer: "Hier kannst du etwas trinken."
                hints: ["Was macht man mit einer Tasse?"]
              - id: l2-s3
                type: image_multiple_choice
                text: "Welches Schild zeigt dir: Hier kannst du telefonieren?"
                say: "Welches Schild zeigt dir: Hier kannst du telefonieren?"
                options: [{ object: telephone }, { object: clock }, { object: cup }]
                answer: telephone
                option_audio: false
                hints: ["Womit telefonierst du?"]
              - id: l2-s4
                type: multiple_choice
                text: "Im Bus ist ein Schild: ein Eis mit einem roten Strich darüber.\n\nWas heißt das?"
                say: "Im Bus hängt ein Schild. Darauf ist ein Eis mit einem roten Strich darüber. Was heißt das?"
                show: { object: ice-cream }
                options: ["Im Bus darfst du kein Eis essen.", "Im Bus gibt es Eis.", "Das Eis ist kalt."]
                answer: "Im Bus darfst du kein Eis essen."
                hints: ["Ein roter Strich über dem Bild heißt: verboten."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das?"
                say: "Die Ampel leuchtet rot. Darfst du jetzt über die Straße gehen?"
                show: { drawn: colour-swatch, colour: red }
                answer: false
                hints: ["Was heißt rot an der Ampel?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Die Ampel leuchtet so.\n\nWas heißt das?"
                say: "Du bist an der Ampel. Sie leuchtet so. Was heißt das?"
                show: { drawn: colour-swatch, colour: green }
                options: ["Du darfst gehen.", "Du musst stehen bleiben.", "Die Ampel ist kaputt."]
                answer: "Du darfst gehen."
              - id: l2-n2
                type: multiple_choice
                text: "Auf einem Schild ist ein Bett.\n\nWas heißt das?"
                say: "Auf einem Schild ist ein Bett. Was heißt das?"
                show: { object: bed }
                options: ["Hier kannst du übernachten.", "Hier kannst du ein Bett kaufen.", "Hier darfst du nicht schlafen."]
                answer: "Hier kannst du übernachten."
              - id: l2-n3
                type: image_multiple_choice
                text: "Welches Schild zeigt dir: Hier geht es zum Bus?"
                say: "Welches Schild zeigt dir: Hier geht es zum Bus?"
                options: [{ object: bus }, { object: bike }, { object: boat }]
                answer: bus
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "An der Tür ist ein Schild: ein Fahrrad mit einem roten Strich darüber.\n\nWas heißt das?"
                say: "An einer Tür hängt ein Schild. Darauf ist ein Fahrrad mit einem roten Strich darüber. Was heißt das?"
                show: { object: bike }
                options: ["Hier darfst du kein Fahrrad abstellen.", "Hier ist ein Radweg.", "Hier kannst du ein Fahrrad leihen."]
                answer: "Hier darfst du kein Fahrrad abstellen."
              - id: l2-n5
                type: true_false
                text: "Stimmt das?"
                say: "Ein roter Strich über einem Bild heißt: Das ist erlaubt. Stimmt das?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Die Ampel leuchtet so.\n\nWas macht ihr?"
            say: "Du willst mit Oma über die Straße. Die Ampel leuchtet so. Was macht ihr?"
            show: { drawn: colour-swatch, colour: red }
            options: ["Wir bleiben stehen.", "Wir gehen los.", "Wir laufen schnell."]
            answer: "Wir bleiben stehen."
          - id: l2-c2
            type: multiple_choice
            text: "Was sollst du tun?"
            say: "Dieses Bildzeichen steht vor einer Aufgabe in deinem Heft. Was sollst du tun?"
            show: { object: eye }
            options: ["Schau genau hin.", "ein Auge", "Erzähle."]
            answer: "Schau genau hin."
          - id: l2-c3
            type: image_multiple_choice
            text: "Welches Schild zeigt dir: Hier kannst du etwas trinken?"
            say: "Welches Schild zeigt dir: Hier kannst du etwas trinken?"
            options: [{ object: cup }, { object: bed }, { object: telephone }]
            answer: cup
            option_audio: false
          - id: l2-c4
            type: multiple_choice
            text: "Im Park ist ein Schild: ein Ball mit einem roten Strich darüber.\n\nWas heißt das?"
            say: "Im Park hängt ein Schild. Darauf ist ein Ball mit einem roten Strich darüber. Was heißt das?"
            show: { object: ball }
            options: ["Hier darfst du nicht Ball spielen.", "Hier kannst du Ball spielen.", "Hier liegt ein Ball."]
            answer: "Hier darfst du nicht Ball spielen."
          - id: l2-c5
            type: matching
            text: "Was heißt welches Bildzeichen im Heft?"
            say: "Verbinde jedes Bildzeichen aus deinem Heft mit dem, was du tun sollst."
            option_audio: false
            pairs:
              - { left: { object: pencil }, right: { text: "Schreib." } }
              - { left: { object: scissors }, right: { text: "Schneide aus." } }
              - { left: { object: book-open }, right: { text: "Lies." } }
