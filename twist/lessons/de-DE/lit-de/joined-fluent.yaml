# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.joined-fluent
skill: lit-de.handwriting.joined-fluent
curriculum: de-DE
language: de
title:
  de: Flüssig und leserlich schreiben
  en: Writing fluently and legibly
summary: >
  Children write words and sentences in Schreibschrift so that others can
  read them, and without stopping after every letter. Lesson 1 looks at
  what makes writing leserlich: clear letters (an open a turns Hand into
  Hund), letters of the same size sitting on the line, and a finger gap
  between words; lesson 2 is about writing flüssig: a loose grip, not
  pressing too hard, remembering a group of words and writing it in one
  go, and checking the writing at the end; it ends with the skill check.
  Copying on writing lines is the practice; the check asks what makes
  writing easy to read and to write. The models on the writing lines are
  still drawn in print, so the copy tasks ask the child to write them in
  Schreibschrift, as in a school Übertragung.
metadata:
  year: klasse-2
  topic: { de: Schreibschrift, en: Joined handwriting }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.handwriting.joined-capitals]
  also_practises: [lit-de.handwriting.copy-sentences]
  vocabulary: { de: [leserlich, flüssig, deutlich, Abstand, Linie, Stifthaltung, locker, Wortgruppe] }
  forms: [drawn, audio]
  drawn: [writing-lines, word-card]
  facets: [script]
  misconceptions:
    - id: unclear-letters
      what: Leaves the a or the o open, so it looks like a u and the reader sees another word (Hand as Hund, Mond as Mund)
      addressed: "lesson 1 Learn shows Hand turning into Hund; l1-f2 (with feedback), l1-s2, l1-n2 and l2-c1 ask what a reader sees when a letter is unclear"
    - id: fast-is-fluent
      what: Thinks flüssig means as fast as possible and presses hard, so the writing gets messy and the hand hurts
      addressed: "lesson 2 Learn says locker and gleichmäßig, not fast; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c3 ask what helps the hand; l2-f5 and l2-c5 judge a child who rushes"
    - id: word-crowding
      what: Writes the words of a sentence without gaps or lets letters float above the line
      addressed: "lesson 1 sorts leserlich from schwer zu lesen (l1-f4, l1-s4, l2-c2) and asks about the finger gap (l1-f5, l1-n4)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Leserlich schreiben", en: "Writing legibly" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Welches Wort ist richtig geschrieben?"
            options: ["Insel", "INsel", "insel"]
            answer: "Insel"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: tracing
            text: "Schreib das Wort ab."
            say: "Schreib Mama in Schreibschrift ab."
            show: { drawn: writing-lines, text: "Mama", mode: copy, arrows: false }
            char: "Mama"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "leserlich"
            say: "Du schreibst nicht nur für dich. Auch deine Lehrerin, deine Eltern und deine Freunde wollen deine Schrift lesen. Leserlich heißt: Andere können es gut lesen."
            show: { drawn: writing-lines, text: "Hand", mode: copy, arrows: false }
          - text: "Hand oder Hund?"
            say: "Pass auf die Buchstaben auf. Lässt du das a oben offen, sieht es aus wie ein u. Dann wird aus Hand ein Hund. Schließ das a und das o immer gut."
            show: { drawn: word-card, text: "Hand Hund" }
          - text: "Ich mag Eis."
            say: "Drei Tipps für leserliche Schrift. Erstens: Kleine Buchstaben wie a, e und m sind gleich hoch. Zweitens: Alle Buchstaben sitzen auf der Linie. Drittens: Zwischen zwei Wörtern ist ein Finger breit Platz."
            show: { drawn: writing-lines, text: "Ich mag Eis.", mode: copy, arrows: false }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Hand in Schreibschrift ab. Schließ das a gut."
                show: { drawn: writing-lines, text: "Hand", mode: copy, arrows: false }
                char: "Hand"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Lena schreibt Hand. Ihr a ist oben offen.\n\nWelches Wort liest Ben?"
                say: "Lena schreibt Hand. Ihr a ist oben offen. Welches Wort liest Ben?"
                options: ["Hund", "Hand", "Hemd"]
                answer: "Hund"
                feedback:
                  Hand: "Lena wollte Hand schreiben. Aber ein offenes a sieht aus wie ein u. Was liest Ben dann?"
                hints:
                  - "Wie sieht ein a aus, das oben offen ist?"
                  - "Ein offenes a sieht aus wie ein u."
                  - "Ben liest Hund."
              - id: l1-f3
                type: true_false
                text: "Die kleinen Buchstaben a, e und m sind gleich hoch. Stimmt das?"
                say: "Die kleinen Buchstaben a, e und m sind gleich hoch. Stimmt das?"
                answer: true
                hints:
                  - "Wo wohnen a, e und m im Häuschen?"
                  - "Sie wohnen alle im Erdgeschoss."
                  - "Ja. Sie sind gleich hoch."
              - id: l1-f4
                type: sorting
                text: "Was macht Schrift leserlich?"
                say: "Was macht Schrift leserlich, was macht sie schwer zu lesen? Sortiere."
                bins:
                  - { id: gut, show: { text: "leserlich" }, say: "leserlich" }
                  - { id: schwer, show: { text: "schwer zu lesen" }, say: "schwer zu lesen" }
                options:
                  - { text: "Buchstaben sitzen auf der Linie.", bin: gut }
                  - { text: "Zwischen den Wörtern ist Platz.", bin: gut }
                  - { text: "Die Wörter kleben aneinander.", bin: schwer }
                  - { text: "Die Buchstaben schweben über der Linie.", bin: schwer }
                hints:
                  - "Stell dir vor, du sollst den Text lesen."
                  - "Was hilft dir beim Lesen, was stört?"
                  - "Linie und Platz helfen. Kleben und Schweben stören."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viel Platz lässt du zwischen zwei Wörtern?"
                options: ["einen Finger breit", "gar keinen", "eine halbe Zeile"]
                answer: "einen Finger breit"
                feedback:
                  "gar keinen": "Dann kleben die Wörter aneinander, und man weiß nicht, wo ein Wort aufhört."
                hints:
                  - "Wie hast du den Platz beim Abschreiben gemessen?"
                  - "Du kannst einen Finger auf das Blatt legen."
                  - "Einen Finger breit."
              - id: l1-f6
                type: tracing
                text: "Schreib den Satz ab."
                say: "Schreib den Satz in Schreibschrift ab: Ich mag Eis. Lass zwischen den Wörtern einen Finger breit Platz."
                show: { drawn: writing-lines, text: "Ich mag Eis.", mode: copy, arrows: false }
                char: "Ich mag Eis."

          - support: some
            tasks:
              - id: l1-s1
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Hose in Schreibschrift ab. Schließ das o gut."
                show: { drawn: writing-lines, text: "Hose", mode: copy, arrows: false }
                char: "Hose"
              - id: l1-s2
                type: multiple_choice
                text: "Can schreibt Mond. Sein o ist oben offen.\n\nWelches Wort liest Mia?"
                say: "Can schreibt Mond. Sein o ist oben offen und sieht aus wie ein u. Welches Wort liest Mia?"
                options: ["Mund", "Mond", "Mann"]
                answer: "Mund"
                hints: ["Ein offenes o sieht aus wie ein u."]
              - id: l1-s3
                type: true_false
                text: "Wenn die Buchstaben über der Linie schweben, ist die Schrift gut zu lesen. Stimmt das?"
                say: "Wenn die Buchstaben über der Linie schweben, ist die Schrift gut zu lesen. Stimmt das?"
                answer: false
                hints: ["Wo sitzen die Buchstaben in einer leserlichen Schrift?"]
              - id: l1-s4
                type: sorting
                text: "Was macht Schrift leserlich?"
                say: "Was macht Schrift leserlich, was macht sie schwer zu lesen? Sortiere."
                bins:
                  - { id: gut, show: { text: "leserlich" }, say: "leserlich" }
                  - { id: schwer, show: { text: "schwer zu lesen" }, say: "schwer zu lesen" }
                options:
                  - { text: "Das a ist geschlossen.", bin: gut }
                  - { text: "Kleine Buchstaben wie a und e sind gleich hoch.", bin: gut }
                  - { text: "Manche kleinen Buchstaben sind riesig.", bin: schwer }
                  - { text: "Das o ist oben offen.", bin: schwer }
                hints: ["Was hilft dir, wenn du die Schrift lesen sollst?"]
              - id: l1-s5
                type: tracing
                text: "Schreib den Satz ab."
                say: "Schreib den Satz in Schreibschrift ab: Oma liest."
                show: { drawn: writing-lines, text: "Oma liest.", mode: copy, arrows: false }
                char: "Oma liest."

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Dose in Schreibschrift ab."
                show: { drawn: writing-lines, text: "Dose", mode: copy, arrows: false }
                char: "Dose"
              - id: l1-n2
                type: multiple_choice
                text: "Ella schreibt Band. Ihr a ist oben offen.\n\nWelches Wort liest Opa?"
                say: "Ella schreibt Band. Ihr a ist oben offen. Welches Wort liest Opa?"
                options: ["Bund", "Band", "Bild"]
                answer: "Bund"
              - id: l1-n3
                type: multiple_choice
                text: "Wo sitzen die Buchstaben?"
                say: "Wo sitzen die Buchstaben, damit man die Schrift gut lesen kann?"
                options: ["auf der Linie", "über der Linie", "mal oben, mal unten"]
                answer: "auf der Linie"
              - id: l1-n4
                type: true_false
                text: "Tim schreibt: IchmagEis.\n\nHat Tim genug Platz zwischen den Wörtern gelassen?"
                say: "Lies, was Tim geschrieben hat. Hat er genug Platz zwischen den Wörtern gelassen?"
                answer: false
              - id: l1-n5
                type: tracing
                text: "Schreib den Satz ab."
                say: "Schreib den Satz in Schreibschrift ab: Der Hund bellt."
                show: { drawn: writing-lines, text: "Der Hund bellt.", mode: copy, arrows: false }
                char: "Der Hund bellt."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was macht Schrift leserlich?"
            options: ["Platz zwischen den Wörtern", "ganz große Buchstaben", "viele bunte Farben"]
            answer: "Platz zwischen den Wörtern"
          - id: l1-c2
            type: true_false
            text: "Ein a, das oben offen ist, sieht aus wie ein u. Stimmt das?"
            say: "Ein a, das oben offen ist, sieht aus wie ein u. Stimmt das?"
            answer: true
          - id: l1-c3
            type: tracing
            text: "Schreib das Wort ab."
            say: "Schreib Mond in Schreibschrift ab."
            show: { drawn: writing-lines, text: "Mond", mode: copy, arrows: false }
            char: "Mond"

  - n: 2
    title: { de: "Flüssig schreiben", en: "Writing fluently" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viel Platz lässt du zwischen zwei Wörtern?"
            say: "Du schreibst einen Satz. Wie viel Platz lässt du zwischen zwei Wörtern?"
            options: ["einen Finger breit", "gar keinen", "eine ganze Zeile"]
            answer: "einen Finger breit"
            difficulty: easy
          - id: l2-w2
            type: tracing
            text: "Schreib den Satz ab."
            say: "Schreib den Satz in Schreibschrift ab: Ich male."
            show: { drawn: writing-lines, text: "Ich male.", mode: copy, arrows: false }
            char: "Ich male."
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "locker halten"
            say: "Flüssig schreiben heißt: Die Hand gleitet ruhig über das Blatt. Halt den Stift locker mit drei Fingern. Drück nicht zu fest. Dann tut die Hand nicht weh."
            show: { object: pencil }
          - text: "Wir spielen im Garten."
            say: "Schau nicht nach jedem Buchstaben zur Vorlage. Lies ein paar Wörter, merk sie dir und schreib sie in einem Zug. Zum Beispiel: Wir spielen. Dann: im Garten."
            show: { drawn: writing-lines, text: "Wir spielen im Garten.", mode: copy, arrows: false }
          - text: "flüssig, nicht hastig"
            say: "Flüssig heißt nicht so schnell wie möglich. Schreib ruhig und gleichmäßig, sodass die Schrift leserlich bleibt. Lies am Ende alles noch einmal durch."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tracing
                text: "Schreib den Satz ab."
                say: "Schreib den Satz in Schreibschrift ab: Wir spielen im Garten. Merk dir zwei Wörter und schreib sie in einem Zug."
                show: { drawn: writing-lines, text: "Wir spielen im Garten.", mode: copy, arrows: false }
                char: "Wir spielen im Garten."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie hältst du den Stift?"
                say: "Du willst flüssig schreiben. Wie hältst du den Stift?"
                options: ["locker, mit drei Fingern", "ganz fest, mit der Faust", "nur mit zwei Fingerspitzen"]
                answer: "locker, mit drei Fingern"
                feedback:
                  "ganz fest, mit der Faust": "Mit der Faust drückst du zu fest. Die Hand wird müde und die Schrift wird krakelig."
                hints:
                  - "Wie tut die Hand nicht weh?"
                  - "Der Stift liegt zwischen Daumen, Zeigefinger und Mittelfinger."
                  - "Locker, mit drei Fingern."
              - id: l2-f3
                type: multiple_choice
                text: "Paul schreibt den Satz ab: „Der Ball rollt weg.“\n\nWas hilft ihm am besten?"
                say: "Paul schreibt den Satz ab: Der Ball rollt weg. Was hilft ihm am besten?"
                options: ["ein paar Wörter lesen, merken und in einem Zug schreiben", "nach jedem Buchstaben zur Vorlage schauen", "so schnell wie möglich kritzeln"]
                answer: "ein paar Wörter lesen, merken und in einem Zug schreiben"
                hints:
                  - "Denk an Wir spielen im Garten."
                  - "Du hast dir immer zwei Wörter gemerkt."
                  - "Lesen, merken, in einem Zug schreiben."
              - id: l2-f4
                type: true_false
                text: "Wenn du fertig bist, liest du deinen Satz noch einmal durch. Stimmt das?"
                say: "Wenn du fertig bist, liest du deinen Satz noch einmal durch. Stimmt das?"
                answer: true
                hints:
                  - "Was machst du am Ende beim Abschreiben?"
                  - "Du vergleichst und verbesserst."
                  - "Ja. Lies am Ende alles noch einmal durch."
              - id: l2-f5
                type: true_false
                text: "Tom will als Erster fertig sein. Er schreibt so schnell er kann. Jetzt kann niemand seine Schrift lesen.\n\nHat Tom flüssig und leserlich geschrieben?"
                say: "Tom will als Erster fertig sein. Er schreibt so schnell er kann. Jetzt kann niemand seine Schrift lesen. Hat Tom flüssig und leserlich geschrieben?"
                answer: false
                hints:
                  - "Kann man Toms Schrift lesen?"
                  - "Flüssig heißt nicht hastig."
                  - "Nein. Zu schnell wird die Schrift unleserlich."
              - id: l2-f6
                type: tracing
                text: "Schreib den Satz ab."
                say: "Schreib den Satz in Schreibschrift ab: Der Ball rollt weg."
                show: { drawn: writing-lines, text: "Der Ball rollt weg.", mode: copy, arrows: false }
                char: "Der Ball rollt weg."

          - support: some
            tasks:
              - id: l2-s1
                type: tracing
                text: "Schreib den Satz ab."
                say: "Schreib den Satz in Schreibschrift ab: Mia hat einen Hasen."
                show: { drawn: writing-lines, text: "Mia hat einen Hasen.", mode: copy, arrows: false }
                char: "Mia hat einen Hasen."
              - id: l2-s2
                type: multiple_choice
                text: "Deine Hand tut beim Schreiben weh. Was hilft?"
                options: ["den Stift lockerer halten und nicht so fest drücken", "noch fester drücken", "schneller schreiben"]
                answer: "den Stift lockerer halten und nicht so fest drücken"
                hints: ["Wovon wird die Hand müde?"]
              - id: l2-s3
                type: multiple_choice
                text: "Lea schreibt den Satz ab: „Wir backen einen Kuchen.“\n\nWas merkt sie sich zuerst?"
                say: "Lea schreibt den Satz ab: Wir backen einen Kuchen. Was merkt sie sich zuerst?"
                options: ["Wir backen", "W", "den ganzen Text auf der Seite"]
                answer: "Wir backen"
                hints: ["Ein paar Wörter auf einmal, nicht nur einen Buchstaben."]
              - id: l2-s4
                type: true_false
                text: "Flüssig schreiben heißt: so schnell wie möglich schreiben. Stimmt das?"
                say: "Flüssig schreiben heißt: so schnell wie möglich schreiben. Stimmt das?"
                answer: false
                hints: ["Was passiert, wenn du zu schnell schreibst?"]
              - id: l2-s5
                type: tracing
                text: "Schreib den Satz ab."
                say: "Schreib den Satz in Schreibschrift ab: Oma kocht Suppe."
                show: { drawn: writing-lines, text: "Oma kocht Suppe.", mode: copy, arrows: false }
                char: "Oma kocht Suppe."

          - support: none
            tasks:
              - id: l2-n1
                type: tracing
                text: "Schreib den Satz ab."
                say: "Schreib den Satz in Schreibschrift ab: Im Winter fällt Schnee."
                show: { drawn: writing-lines, text: "Im Winter fällt Schnee.", mode: copy, arrows: false }
                char: "Im Winter fällt Schnee."
              - id: l2-n2
                type: multiple_choice
                text: "Wie hältst du den Stift richtig?"
                options: ["locker zwischen Daumen, Zeigefinger und Mittelfinger", "fest in der ganzen Faust", "ganz oben am Ende"]
                answer: "locker zwischen Daumen, Zeigefinger und Mittelfinger"
              - id: l2-n3
                type: true_false
                text: "Ida schaut beim Abschreiben nach jedem Buchstaben zur Vorlage. So schreibt sie flüssig. Stimmt das?"
                say: "Ida schaut beim Abschreiben nach jedem Buchstaben zur Vorlage. So schreibt sie flüssig. Stimmt das?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Was machst du, wenn der Satz fertig ist?"
                options: ["Ich lese ihn noch einmal durch.", "Ich klappe das Heft schnell zu.", "Ich male die Buchstaben bunt an."]
                answer: "Ich lese ihn noch einmal durch."
              - id: l2-n5
                type: tracing
                text: "Schreib den Satz ab."
                say: "Schreib den Satz in Schreibschrift ab: Ali malt ein Boot."
                show: { drawn: writing-lines, text: "Ali malt ein Boot.", mode: copy, arrows: false }
                char: "Ali malt ein Boot."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Nina schreibt Bach. Ihr a ist oben offen.\n\nWelches Wort liest Paul?"
            say: "Nina schreibt Bach. Ihr a ist oben offen. Welches Wort liest Paul?"
            options: ["Buch", "Bach", "Bauch"]
            answer: "Buch"
          - id: l2-c2
            type: sorting
            text: "Leserlich oder schwer zu lesen?"
            say: "Ist diese Schrift leserlich oder schwer zu lesen? Sortiere."
            bins:
              - { id: gut, show: { text: "leserlich" }, say: "leserlich" }
              - { id: schwer, show: { text: "schwer zu lesen" }, say: "schwer zu lesen" }
            options:
              - { text: "Das o ist geschlossen.", bin: gut }
              - { text: "Die Buchstaben sitzen auf der Linie.", bin: gut }
              - { text: "Die Wörter haben keinen Abstand.", bin: schwer }
              - { text: "Das a sieht aus wie ein u.", bin: schwer }
          - id: l2-c3
            type: multiple_choice
            text: "Was hilft beim flüssigen Schreiben?"
            options: ["den Stift locker halten", "ganz fest aufdrücken", "nach jedem Buchstaben aufhören"]
            answer: "den Stift locker halten"
          - id: l2-c4
            type: multiple_choice
            text: "Du schreibst den Satz ab: „Die Sonne scheint heute.“\n\nWas machst du?"
            say: "Du schreibst den Satz ab: Die Sonne scheint heute. Was machst du?"
            options: ["ein paar Wörter merken und in einem Zug schreiben", "jeden Buchstaben einzeln nachschauen", "den Satz raten"]
            answer: "ein paar Wörter merken und in einem Zug schreiben"
          - id: l2-c5
            type: true_false
            text: "Jana schreibt ruhig und gleichmäßig. Ihre Buchstaben sitzen auf der Linie, und zwischen den Wörtern ist Platz.\n\nHat Jana flüssig und leserlich geschrieben?"
            say: "Jana schreibt ruhig und gleichmäßig. Ihre Buchstaben sitzen auf der Linie, und zwischen den Wörtern ist Platz. Hat Jana flüssig und leserlich geschrieben?"
            answer: true
