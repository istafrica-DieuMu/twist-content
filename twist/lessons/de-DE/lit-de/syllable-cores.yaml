# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.syllable-cores
skill: lit-de.spelling-strategies.syllable-cores
curriculum: de-DE
language: de
title:
  de: Silbenkern, offene und geschlossene Silben
  en: Syllable cores, open and closed syllables
summary: >
  Lesson 1 finds the Silbenkern of each syllable, a Selbstlaut or a
  Zwielaut (o in Ro, au in Mau); lesson 2 tells open syllables that end
  with the core (Ro-se) from closed ones that end with a Mitlaut
  (Son-ne), links them to long and short vowels, and ends with the skill
  check.
metadata:
  year: klasse-2
  topic: { de: Rechtschreibstrategien, en: Spelling strategies }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling-strategies.syllable-swinging, lit-de.spelling.vowels-consonants]
  also_practises: [lit-de.spelling.vowels-consonants, lit-de.spelling.short-long-vowels]
  vocabulary: { de: [Silbenkern, Silbe, offene Silbe, geschlossene Silbe, Selbstlaut, Mitlaut, Zwielaut] }
  forms: [picture, drawn, text, audio]
  drawn: [letter-card, syllable-arcs]
  facets: []
  misconceptions:
    - id: half-diphthong
      what: Takes one letter of a Zwielaut as the core (a in Maus)
      addressed: lesson 1 Learn shows au in Au-to as the core; l1-f3 offers a with feedback, l1-s3 and l1-n3 ask for eu and ei
    - id: open-closed-by-word
      what: Judges open or closed by the whole word instead of the end of the syllable
      addressed: "lesson 2 Learn shows where each syllable ends; every stage of lesson 2 asks about one named syllable (\"Ist die Silbe Na …\") and has a sorting task by the first syllable"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Der Silbenkern", en: "The syllable core" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tippe auf alle Selbstlaute."
            say: "Löwe. Tippe auf alle Selbstlaute."
            show: { drawn: letter-card, text: "L ö w e" }
            spans: ["ö", "e"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie schwingst du Hose?"
            say: "Wie schwingst du das Wort Hose?"
            options: ["Ho-se", "Hos-e", "H-ose"]
            answer: "Ho-se"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ro-se"
            say: "In jeder Silbe steckt ein Selbstlaut. Er ist der Kern der Silbe, der Silbenkern. In Ro ist es das o, in se das e."
            show: { drawn: syllable-arcs, word: "Rose", syllables: ["Ro", "se"] }
          - text: "Au-to"
            say: "Auch ein Zwielaut kann ein Silbenkern sein. In Au ist es das au."
            show: { object: car }
          - text: "Hund | Maus"
            say: "Ein Wort mit einer Silbe hat einen Silbenkern. In Hund ist es das u, in Maus das au."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was ist der Silbenkern von Frosch?"
                say: "Frosch. Was ist der Silbenkern?"
                show: { object: frog }
                options: ["o", "Fr", "sch"]
                answer: "o"
                hints:
                  - "Der Silbenkern ist der Selbstlaut."
                  - "Welcher Buchstabe in Frosch ist ein Selbstlaut?"
                  - "Das o."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tippe auf jeden Silbenkern."
                say: "Kissen. Tippe auf jeden Silbenkern."
                show: { drawn: letter-card, text: "K i s s e n" }
                spans: ["i", "e"]
                hints:
                  - "Schwinge das Wort: Kis, sen."
                  - "Welcher Buchstabe in Kis ist ein Selbstlaut? Und in sen?"
                  - "Das i und das e."
              - id: l1-f3
                type: multiple_choice
                text: "Was ist der Silbenkern von Haus?"
                say: "Haus. Was ist der Silbenkern?"
                show: { object: house }
                options: ["au", "a", "H"]
                answer: "au"
                feedback:
                  "a": "In Haus klingen a und u zusammen. Der Silbenkern ist der Zwielaut au."
                hints:
                  - "Hör genau hin: Haus."
                  - "Klingt da ein Buchstabe allein, oder klingen zwei zusammen wie ein Laut?"
                  - "Der Zwielaut au."
              - id: l1-f4
                type: true_false
                text: "Ist ei der Silbenkern von Bein?"
                say: "Bein. Ist ei der Silbenkern?"
                show: { object: leg }
                answer: true
                hints:
                  - "Der Silbenkern ist ein Selbstlaut oder ein Zwielaut."
                  - "Hör genau hin: B, ei, n. Was klingt in der Mitte?"
                  - "Ja, ei ist der Silbenkern."
              - id: l1-f5
                type: fill_in_blank
                text: "Welcher Silbenkern fehlt?"
                say: "Ofen. Welcher Silbenkern fehlt?"
                show: { object: oven }
                frame: "_fen"
                options: ["O", "U", "A"]
                answer: ["O"]
                hints:
                  - "Schwinge das Wort und sprich die erste Silbe allein."
                  - "Die erste Silbe besteht nur aus ihrem Silbenkern. Welchen Selbstlaut hörst du?"
                  - "Es fehlt das O."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was ist der Silbenkern von Tisch?"
                say: "Tisch. Was ist der Silbenkern?"
                show: { object: table }
                options: ["i", "sch", "T"]
                answer: "i"
                hints: ["Der Silbenkern ist der Selbstlaut."]
              - id: l1-s2
                type: highlight_in_text
                text: "Tippe auf jeden Silbenkern."
                say: "Tafel. Tippe auf jeden Silbenkern."
                show: { drawn: letter-card, text: "T a f e l" }
                spans: ["a", "e"]
                hints: ["Schwinge das Wort: Ta, fel."]
              - id: l1-s3
                type: multiple_choice
                text: "Was ist der Silbenkern von Heu?"
                say: "Heu. Was ist der Silbenkern?"
                options: ["eu", "e", "H"]
                answer: "eu"
                hints: ["Hör genau hin. Klingen zwei Buchstaben zusammen?"]
              - id: l1-s4
                type: true_false
                text: "Ist a der Silbenkern von Ball?"
                say: "Ball. Ist a der Silbenkern?"
                show: { object: ball }
                answer: true
                hints: ["Welcher Buchstabe in Ball ist ein Selbstlaut?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Welcher Silbenkern fehlt?"
                say: "Esel. Welcher Silbenkern fehlt?"
                frame: "_sel"
                options: ["E", "A", "I"]
                answer: ["E"]
                hints: ["Sprich die erste Silbe allein. Sie besteht nur aus ihrem Silbenkern."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was ist der Silbenkern von Fuchs?"
                say: "Fuchs. Was ist der Silbenkern?"
                show: { object: fox }
                options: ["u", "ch", "F"]
                answer: "u"
              - id: l1-n2
                type: highlight_in_text
                text: "Tippe auf jeden Silbenkern."
                say: "Murmel. Tippe auf jeden Silbenkern."
                show: { drawn: letter-card, text: "M u r m e l" }
                spans: ["u", "e"]
              - id: l1-n3
                type: multiple_choice
                text: "Was ist der Silbenkern von Eis?"
                say: "Eis. Was ist der Silbenkern?"
                show: { object: ice-cream }
                options: ["ei", "s", "e"]
                answer: "ei"
              - id: l1-n4
                type: true_false
                text: "Ist l der Silbenkern von Licht?"
                say: "Licht. Ist l der Silbenkern?"
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Welcher Silbenkern fehlt?"
                say: "Ufer. Welcher Silbenkern fehlt?"
                frame: "_fer"
                options: ["U", "O", "A"]
                answer: ["U"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist der Silbenkern von Kopf?"
            say: "Kopf. Was ist der Silbenkern?"
            show: { object: head }
            options: ["o", "K", "pf"]
            answer: "o"
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf jeden Silbenkern."
            say: "Wolke. Tippe auf jeden Silbenkern."
            show: { drawn: letter-card, text: "W o l k e" }
            spans: ["o", "e"]
          - id: l1-c3
            type: true_false
            text: "Ist au der Silbenkern von Baum?"
            say: "Baum. Ist au der Silbenkern?"
            show: { object: tree }
            answer: true

  - n: 2
    title: { de: "Offen oder geschlossen?", en: "Open or closed?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist der Silbenkern von Stern?"
            say: "Stern. Was ist der Silbenkern?"
            show: { object: star }
            options: ["e", "St", "rn"]
            answer: "e"
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tippe auf jeden Silbenkern."
            say: "Hase. Tippe auf jeden Silbenkern."
            show: { drawn: letter-card, text: "H a s e" }
            spans: ["a", "e"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ro-se"
            say: "Die Silbe Ro hört mit dem Silbenkern o auf. Das ist eine offene Silbe. Das o klingt lang."
            show: { drawn: syllable-arcs, word: "Rose", syllables: ["Ro", "se"] }
          - text: "Son-ne"
            say: "Die Silbe Son hört mit dem Mitlaut n auf. Das ist eine geschlossene Silbe. Das o klingt kurz."
            show: { drawn: syllable-arcs, word: "Sonne", syllables: ["Son", "ne"] }
          - text: "offen: Ro, Ta, Ku | geschlossen: Son, Mut, Pup"
            say: "Offene Silben enden mit dem Silbenkern. Geschlossene Silben enden mit einem Mitlaut."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Na-se: Ist die Silbe Na offen oder geschlossen?"
                say: "Na-se. Ist die erste Silbe, Na, offen oder geschlossen?"
                show: { object: nose }
                options: ["offen", "geschlossen"]
                keep_order: true
                answer: "offen"
                hints:
                  - "Womit hört die Silbe Na auf?"
                  - "Sprich Na langsam: N, a. Kommt nach dem a noch ein Mitlaut?"
                  - "Na ist offen."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Offen oder geschlossen?"
                say: "Schwinge jedes Wort. Ist die erste Silbe offen wie Ro in Rose oder geschlossen wie Son in Sonne? Sortiere die Bilder."
                bins:
                  - { id: offen, show: { object: rose }, say: "Offen, wie Ro in Rose." }
                  - { id: geschlossen, show: { object: sun }, say: "Geschlossen, wie Son in Sonne." }
                options:
                  - { object: lion, bin: offen }
                  - { object: cat, bin: geschlossen }
                  - { object: rabbit, bin: offen }
                  - { object: jug, bin: geschlossen }
                hints:
                  - "Schwinge jedes Wort und hör auf das Ende der ersten Silbe."
                  - "Löwe: Lö-we. Endet Lö mit dem ö oder mit einem Mitlaut? Mach so mit jedem Bild weiter."
                  - "Offen: Löwe, Hase. Geschlossen: Katze, Kanne."
              - id: l2-f3
                type: highlight_in_text
                text: "Tippe auf alle offenen Silben."
                say: "Tippe auf alle offenen Silben."
                show: { drawn: letter-card, text: "Ro Son Na Kan Lö" }
                spans: ["Ro", "Na", "Lö"]
                hints:
                  - "Eine offene Silbe endet mit dem Silbenkern."
                  - "Schau auf den letzten Buchstaben jeder Silbe. Ro endet mit o, Son endet mit n."
                  - "Ro, Na und Lö."
              - id: l2-f4
                type: true_false
                text: "Kat-ze: Endet die Silbe Kat mit einem Mitlaut?"
                say: "Kat-ze. Endet die erste Silbe, Kat, mit einem Mitlaut?"
                show: { object: cat }
                answer: true
                hints:
                  - "Was ist der letzte Buchstabe von Kat?"
                  - "Sprich Kat langsam: K, a, t. Was hörst du zuletzt?"
                  - "Ja. Kat ist eine geschlossene Silbe."
              - id: l2-f5
                type: multiple_choice
                text: "Klingt das o in Ho-se lang oder kurz?"
                say: "Ho-se. Klingt das o lang oder kurz?"
                show: { object: trousers }
                options: ["lang", "kurz"]
                keep_order: true
                answer: "lang"
                hints:
                  - "Ist Ho eine offene oder eine geschlossene Silbe?"
                  - "Ho endet mit dem o, also ist es offen. Wie klingt der Selbstlaut in einer offenen Silbe?"
                  - "Das o ist lang."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Tan-ne: Ist die Silbe Tan offen oder geschlossen?"
                say: "Tan-ne. Ist die erste Silbe, Tan, offen oder geschlossen?"
                show: { object: fir-tree }
                options: ["offen", "geschlossen"]
                keep_order: true
                answer: "geschlossen"
                hints: ["Womit hört die Silbe Tan auf?"]
              - id: l2-s2
                type: sorting
                text: "Offen oder geschlossen?"
                say: "Ist die erste Silbe offen wie Ro in Rose oder geschlossen wie Son in Sonne? Sortiere die Bilder."
                bins:
                  - { id: offen, show: { object: rose }, say: "Offen, wie Ro in Rose." }
                  - { id: geschlossen, show: { object: sun }, say: "Geschlossen, wie Son in Sonne." }
                options:
                  - { object: monkey, bin: geschlossen }
                  - { object: oven, bin: offen }
                  - { object: bin, bin: geschlossen }
                  - { object: grandma, bin: offen }
                hints: ["Schwinge jedes Wort und hör auf das Ende der ersten Silbe."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf alle geschlossenen Silben."
                say: "Tippe auf alle geschlossenen Silben."
                show: { drawn: letter-card, text: "Kat Ho Wol Ma Kis" }
                spans: ["Kat", "Wol", "Kis"]
                hints: ["Eine geschlossene Silbe endet mit einem Mitlaut."]
              - id: l2-s4
                type: true_false
                text: "Vo-gel: Endet die Silbe Vo mit einem Mitlaut?"
                say: "Vo-gel. Endet die erste Silbe, Vo, mit einem Mitlaut?"
                show: { object: bird }
                answer: false
                hints: ["Was ist der letzte Buchstabe von Vo?"]
              - id: l2-s5
                type: multiple_choice
                text: "Klingt das a in Kan-ne lang oder kurz?"
                say: "Kan-ne. Klingt das a lang oder kurz?"
                show: { object: jug }
                options: ["lang", "kurz"]
                keep_order: true
                answer: "kurz"
                hints: ["Ist Kan eine offene oder eine geschlossene Silbe?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mo-tor: Ist die Silbe Mo offen oder geschlossen?"
                say: "Mo-tor. Ist die erste Silbe, Mo, offen oder geschlossen?"
                options: ["offen", "geschlossen"]
                keep_order: true
                answer: "offen"
              - id: l2-n2
                type: sorting
                text: "Offen oder geschlossen?"
                say: "Ist die erste Silbe offen wie Ro in Rose oder geschlossen wie Son in Sonne? Sortiere die Bilder."
                bins:
                  - { id: offen, show: { object: rose }, say: "Offen, wie Ro in Rose." }
                  - { id: geschlossen, show: { object: sun }, say: "Geschlossen, wie Son in Sonne." }
                options:
                  - { object: llama, bin: offen }
                  - { object: cup, bin: geschlossen }
                  - { object: cheese, bin: offen }
                  - { object: spoon, bin: geschlossen }
              - id: l2-n3
                type: highlight_in_text
                text: "Tippe auf alle offenen Silben."
                say: "Tippe auf alle offenen Silben."
                show: { drawn: letter-card, text: "Bu Wol Ti Hun Re" }
                spans: ["Bu", "Ti", "Re"]
              - id: l2-n4
                type: true_false
                text: "Wol-ke: Endet die Silbe Wol mit einem Mitlaut?"
                say: "Wol-ke. Endet die erste Silbe, Wol, mit einem Mitlaut?"
                show: { object: cloud }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Klingt das u in Hun-de lang oder kurz?"
                say: "Hun-de. Klingt das u lang oder kurz?"
                options: ["lang", "kurz"]
                keep_order: true
                answer: "kurz"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Was ist der Silbenkern von Zelt?"
            say: "Zelt. Was ist der Silbenkern?"
            options: ["e", "Z", "lt"]
            answer: "e"
          - id: l2-c2
            type: multiple_choice
            text: "Ra-be: Ist die Silbe Ra offen oder geschlossen?"
            say: "Ra-be. Ist die erste Silbe, Ra, offen oder geschlossen?"
            options: ["offen", "geschlossen"]
            keep_order: true
            answer: "offen"
          - id: l2-c3
            type: highlight_in_text
            text: "Tippe auf alle geschlossenen Silben."
            say: "Tippe auf alle geschlossenen Silben."
            show: { drawn: letter-card, text: "Wes Ha Fin Ru Mat" }
            spans: ["Wes", "Fin", "Mat"]
          - id: l2-c4
            type: true_false
            text: "Ti-ger: Endet die Silbe Ti mit dem Silbenkern?"
            say: "Ti-ger. Endet die erste Silbe, Ti, mit dem Silbenkern?"
            answer: true
          - id: l2-c5
            type: multiple_choice
            text: "Klingt das i in I-gel lang oder kurz?"
            say: "I-gel. Klingt das i lang oder kurz?"
            show: { object: hedgehog }
            options: ["lang", "kurz"]
            keep_order: true
            answer: "lang"
