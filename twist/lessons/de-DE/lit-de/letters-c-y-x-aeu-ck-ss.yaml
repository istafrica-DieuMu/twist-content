# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-c-y-x-aeu-ck-ss
skill: lit-de.letters.c-y-x-aeu-ck-ss
curriculum: de-DE
language: de
title:
  de: C, Y, X, äu, ck und ß
  en: C, Y, X, äu, ck and ß
summary: >
  The last letter group of Klasse 1: rare letters and spellings the child
  meets in reading. Lesson 1: ck is read as k and comes after a short
  vowel (Socke, Glocke); ß is read as s and is not a B (Fuß, groß).
  Lesson 2: äu sounds like eu and comes from au (Maus, Mäuse; Baum,
  Bäume); C is often read as k (Clown), Y at the end of a word as i
  (Baby, Pony), X as ks (Hexe, Taxi). Lesson 3 reads words with all six
  and ends with the skill check. Choosing between k and ck by rule is
  left to the later spelling skill; here ck is offered against k and kk
  in short familiar words.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.ng-nk-qu-v]
  also_practises:
    [lit-de.letters.ng-nk-qu-v, lit-de.handwriting.print-letters, lit-de.decoding.two-syllable-words]
  vocabulary:
    { de: [Buchstabe, Laut, scharfes S, Umlaut, Großbuchstabe, Kleinbuchstabe] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, word-card, syllable-arcs]
  sounds: []
  facets: [script]
  misconceptions:
    - id: ck-as-k
      what: Writes k or kk where ck belongs (Soke, Sokke)
      addressed: lesson 1 Learn shows ck after the short o; l1-f2, l1-s3, l1-n3, l1-c2, l3-f2 and l3-n2 offer k and kk, with feedback on l1-f2
    - id: ss-as-b
      what: Reads or writes ß as B, because the shapes look alike (Fub, grob for groß)
      addressed: lesson 1 Learn says ß is not a B; l1-f3 and l1-c3 ask whether a card is an ß; l1-f5, l1-s4, l3-s3 and the skill check task l3-c2 offer B; l3-f5 reads Fuß against Fuchs
    - id: aeu-as-eu
      what: Writes eu or au for äu (Meuse, Baume)
      addressed: lesson 2 Learn derives Mäuse from Maus and Bäume from Baum; l2-f1, l2-f5, l2-s1, l2-c1, l3-s2, l3-n3 and the skill check task l3-c3 offer eu and au spellings
    - id: rare-letters
      what: Reads C as z or ts, Y as j or ü, and X as a plain k (Hecke for Hexe)
      addressed: lesson 2 Learn says how each sounds in these words; l2-f2, l2-f3, l2-f4 (feedback on Hecke), l2-s4, l3-f4, l3-s5 and the skill check tasks l3-c4 and l3-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: ck und ß, en: ck and ß }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "ng oder nk?"
            audio: { de: "Zange." }
            options: ["ng", "nk"]
            answer: "ng"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Welches Wort ist richtig geschrieben? Lies genau."
            options: ["Fogel", "Vogel"]
            answer: "Vogel"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "ck"
            say: "Hier stehen c und k zusammen: ck. Du hörst nur ein k. Das ck steht nach einem kurzen a, e, i, o oder u."
            show: { drawn: letter-card, text: "ck" }
          - text: "Socke"
            say: "Socke. Das o ist ganz kurz: So ... cke. Danach schreibst du ck."
            show: { object: sock }
          - text: "ß"
            say: "Das ist das ß. Man sagt auch scharfes S. Es klingt wie sss. Pass auf: Es sieht ein bisschen aus wie ein B. Ein B ist es aber nicht."
            show: { drawn: letter-card, text: "ß" }
          - text: "Fuß"
            say: "Fuß. Das u ist lang: Fuuu ... sss. Danach schreibst du ß."
            show: { object: foot }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Socke" }
                options: [{ object: shoe }, { object: sock }, { object: sun }]
                answer: sock
                feedback:
                  shoe: "Schuh fängt mit Sch an. Auf der Karte steht S und o."
                hints:
                  - "Das ck liest du wie k."
                  - "So ... cke."
                  - "Socke."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Glocke. Was fehlt in dem Wort?"
                show: { object: bell }
                frame: "Glo_e"
                options: ["k", "ck", "kk"]
                answer: ["ck"]
                feedback:
                  k: "Nach dem kurzen o schreibst du ck."
                  kk: "Statt kk schreibst du ck."
                hints:
                  - "Sprich das Wort langsam: Glocke."
                  - "Das o ist kurz. Was kommt nach einem kurzen Laut?"
                  - "Es fehlt ck."
              - id: l1-f3
                type: true_false
                text: "Ist das ein ß?"
                say: "Schau genau hin. Ist das ein ß?"
                show: { drawn: letter-card, text: "B" }
                answer: false
                hints:
                  - "Das B hat zwei geschlossene Bäuche. Beim ß ist der untere Bauch unten offen."
                  - "Schau auf den unteren Bauch. Ist er geschlossen?"
                  - "Nein, das ist ein großes B."
              - id: l1-f4
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Fuß" }
                options: [{ object: fox }, { object: foot }, { object: fish }]
                answer: foot
                feedback:
                  fox: "Fuchs hat kein ß. Lies genau: F ... u ... ß."
                hints:
                  - "Das ß liest du wie s."
                  - "Fuuu ... sss."
                  - "Fuß."
                difficulty: easy
              - id: l1-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Fuß. Was fehlt am Ende?"
                show: { object: foot }
                frame: "Fu_"
                options: ["B", "ß"]
                answer: ["ß"]
                feedback:
                  B: "Das ist ein B. Am Ende von Fuß hörst du sss. Du schreibst ß."
                hints:
                  - "Sprich das Wort langsam bis zum Ende."
                  - "Am Ende hörst du sss. Welcher Buchstabe klingt so?"
                  - "Am Ende fehlt ß."
              - id: l1-f6
                type: tracing
                text: "Schreib ck nach."
                show: { drawn: writing-lines, text: "ck", mode: trace, arrows: true }
                char: "ck"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Jacke" }
                options: [{ object: cake }, { object: skirt }, { object: jacket }]
                answer: jacket
                hints: ["Ja ... cke."]
              - id: l1-s2
                type: highlight_in_text
                text: "Tippe auf jedes ck."
                say: "Tippe auf jede Karte mit c und k."
                show: { drawn: letter-card, text: "ck k ck kk ck" }
                spans: ["ck", "ck", "ck"]
                hints: ["Es sind drei. Vor dem k muss ein c stehen."]
              - id: l1-s3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Schnecke. Was fehlt in dem Wort?"
                show: { object: snail }
                frame: "Schne_e"
                options: ["ck", "k"]
                answer: ["ck"]
                hints: ["Das e vorher ist kurz: Schne ... cke."]
              - id: l1-s4
                type: audio_choice
                text: "Welches Wort hörst du?"
                say: "Hör gut zu. Welches Wort hörst du? Lies die Karten."
                audio: { de: "groß." }
                options: ["grob", "groß", "Gras"]
                answer: "groß"
                hints: ["Am Ende hörst du sss. Welche Karte hat ein ß?"]
              - id: l1-s5
                type: tracing
                text: "Schreib ß nach."
                show: { drawn: writing-lines, text: "ß", mode: trace, arrows: true }
                char: "ß"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Glocke", syllables: ["Glo", "cke"] }
                options: [{ object: clock }, { object: bell }, { object: ball }]
                answer: bell
              - id: l1-n2
                type: true_false
                text: "Stimmt das?"
                say: "Lies die Karte. Steht hier Decke?"
                show: { drawn: word-card, text: "Decke" }
                answer: true
              - id: l1-n3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Rock. Was fehlt am Ende?"
                show: { object: skirt }
                frame: "Ro_"
                options: ["kk", "k", "ck"]
                answer: ["ck"]
              - id: l1-n4
                type: audio_choice
                text: "Welches Wort hörst du?"
                say: "Hör gut zu. Welches Wort hörst du? Lies die Karten."
                audio: { de: "weiß." }
                options: ["Wein", "weil", "weiß"]
                answer: "weiß"
              - id: l1-n5
                type: tracing
                text: "Schreib ß ab."
                show: { drawn: writing-lines, text: "ß", mode: copy, arrows: false }
                char: "ß"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Rock" }
            options: [{ object: dress }, { object: skirt }, { object: sock }]
            answer: skirt
          - id: l1-c2
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Socke. Was fehlt in dem Wort?"
            frame: "So_e"
            options: ["k", "ck"]
            answer: ["ck"]
          - id: l1-c3
            type: true_false
            text: "Ist das ein ß?"
            say: "Schau genau hin. Ist das ein ß?"
            show: { drawn: letter-card, text: "ß" }
            answer: true

  - n: 2
    title: { de: "äu, C, Y und X", en: "äu, C, Y and X" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Glocke" }
            options: [{ object: ball }, { object: bell }]
            answer: bell
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Jacke. Was fehlt in dem Wort?"
            show: { object: jacket }
            frame: "Ja_e"
            options: ["ck", "k"]
            answer: ["ck"]
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Maus, Mäuse"
            say: "Hier stehen ä und u zusammen: äu. Zusammen klingen sie wie eu. Oft gibt es ein Wort mit au, das verwandt ist: eine Maus, viele Mäuse."
            show: { object: mouse, count: 3, layout: row }
          - text: "Baum, Bäume"
            say: "Ein Baum, viele Bäume. Aus au wird äu."
            show: { object: tree, count: 3, layout: row }
          - text: "C c"
            say: "Das C ist ein seltener Buchstabe. In vielen Wörtern klingt es wie k. Clown, Computer."
            show: { object: clown }
          - text: "Y y"
            say: "Auch das Y ist selten. Am Ende von Wörtern wie Baby und Pony klingt es wie i."
            show: { object: baby }
          - text: "X x"
            say: "Das X klingt wie k und s zusammen: ks. Wie bei Hexe und Taxi."
            show: { drawn: letter-card, text: "Xx" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Eine Maus, viele ..."
                say: "Eine Maus, viele ... Welches Wort ist richtig geschrieben?"
                show: { object: mouse, count: 3, layout: row }
                options: ["Meuse", "Mäuse", "Mause"]
                answer: "Mäuse"
                option_audio: false
                feedback:
                  Meuse: "Mäuse kommt von Maus. Aus au wird äu."
                  Mause: "Hör genau hin: Du hörst eu. Aus au wird äu."
                hints:
                  - "Denk an das Wort für eine: Maus."
                  - "Maus hat ein au. Was wird daraus, wenn es viele sind?"
                  - "Aus au wird äu: Mäuse."
              - id: l2-f2
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Clown" }
                options: [{ object: cloud }, { object: clown }, { object: cow }]
                answer: clown
                hints:
                  - "Das C liest du hier wie k."
                  - "Das ow am Ende klingt wie au: Klaun."
                  - "Clown."
                difficulty: easy
              - id: l2-f3
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Baby" }
                options: [{ object: ball }, { object: baby }, { object: bee }]
                answer: baby
                hints:
                  - "Das y am Ende liest du wie i."
                  - "Ba ... bi."
                  - "Baby."
                difficulty: easy
              - id: l2-f4
                type: audio_choice
                text: "Welches Wort hörst du?"
                say: "Hör gut zu. Welches Wort hörst du? Lies die Karten."
                audio: { de: "Hexe." }
                options: ["Hecke", "Hexe", "Hefe"]
                answer: "Hexe"
                feedback:
                  Hecke: "Bei Hexe hörst du k und s zusammen. Das schreibt man mit x."
                hints:
                  - "Hör auf die Mitte des Wortes."
                  - "He ... kse. Welcher Buchstabe klingt wie ks?"
                  - "Das Wort ist Hexe."
              - id: l2-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Bäume. Was fehlt in dem Wort?"
                show: { object: tree, count: 3, layout: row }
                frame: "B_me"
                options: ["eu", "äu", "au"]
                answer: ["äu"]
                hints:
                  - "Denk an das Wort für einen: Baum."
                  - "Baum hat ein au. Was wird daraus?"
                  - "Es fehlt äu."
              - id: l2-f6
                type: tracing
                text: "Schreib X nach."
                show: { drawn: writing-lines, text: "X", mode: trace, arrows: true }
                char: "X"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ein Haus, viele ..."
                say: "Ein Haus, viele ... Welches Wort ist richtig geschrieben?"
                show: { object: house, count: 3, layout: row }
                options: ["Häuser", "Heuser", "Hauser"]
                answer: "Häuser"
                option_audio: false
                hints: ["Haus hat ein au. Aus au wird äu."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tippe auf jedes X."
                say: "Tippe auf jede Karte mit einem großen oder kleinen X."
                show: { drawn: letter-card, text: "X K x Y X" }
                spans: ["X", "x", "X"]
                hints: ["Es sind drei. Beim X kreuzen sich zwei Striche."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das?"
                say: "Lies die Karte. Steht hier Taxi?"
                show: { drawn: word-card, text: "Taxi" }
                answer: true
                hints: ["Das x liest du wie ks: Ta ... ksi."]
              - id: l2-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Hexe. Was fehlt in dem Wort?"
                frame: "He_e"
                options: ["x", "k", "ks"]
                answer: ["x"]
                hints: ["Ks in der Mitte schreibt man hier mit einem Buchstaben."]
              - id: l2-s5
                type: tracing
                text: "Schreib y nach."
                show: { drawn: writing-lines, text: "y", mode: trace, arrows: true }
                char: "y"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "Was gehört zusammen?"
                say: "Einer und viele. Tippe auf ein Wort und dann auf das Wort, das dazu gehört."
                pairs:
                  - left: { text: "Maus" }
                    right: { text: "Mäuse" }
                  - left: { text: "Haus" }
                    right: { text: "Häuser" }
                  - left: { text: "Baum" }
                    right: { text: "Bäume" }
              - id: l2-n2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Welches Wort ist richtig geschrieben? Lies genau."
                options: ["Taksi", "Taxi", "Tacksi"]
                answer: "Taxi"
                option_audio: false
              - id: l2-n3
                type: audio_choice
                text: "Welches Wort hörst du?"
                say: "Hör gut zu. Welches Wort hörst du? Lies die Karten."
                audio: { de: "Teddy." }
                options: ["Tante", "Teddy", "Tüte"]
                answer: "Teddy"
              - id: l2-n4
                type: true_false
                text: "Stimmt das?"
                say: "Lies die Karte. Steht hier Mäuse?"
                show: { drawn: word-card, text: "Mäuse" }
                answer: true
              - id: l2-n5
                type: tracing
                text: "Schreib x ab."
                show: { drawn: writing-lines, text: "x", mode: copy, arrows: false }
                char: "x"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Ein Baum, viele ..."
            say: "Ein Baum, viele ... Welches Wort ist richtig geschrieben?"
            show: { object: tree, count: 3, layout: row }
            options: ["Bäume", "Beume", "Baume"]
            answer: "Bäume"
            option_audio: false
          - id: l2-c2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Baby" }
            options: [{ object: girl }, { object: baby }, { object: boy }]
            answer: baby
          - id: l2-c3
            type: audio_choice
            text: "Welches Wort hörst du?"
            say: "Hör gut zu. Welches Wort hörst du? Lies die Karten."
            audio: { de: "Axt." }
            options: ["Ast", "Axt", "Acht"]
            answer: "Axt"

  - n: 3
    title: { de: "Wörter mit seltenen Buchstaben", en: "Words with rare letters" }
    new_content: false
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Ein Haus, viele ..."
            say: "Ein Haus, viele ... Welches Wort ist richtig geschrieben?"
            options: ["Heuser", "Häuser"]
            answer: "Häuser"
            option_audio: false
            difficulty: easy
          - id: l3-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Clown" }
            options: [{ object: cow }, { object: clown }]
            answer: clown
