# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.verbs-tenses-mixed
skill: lit-de.verbs.tenses-mixed
curriculum: de-DE
language: de
title:
  de: Zeitformen bestimmen und durchhalten
  en: Naming tenses and keeping to one
summary: >
  The four Zeitformen side by side: Präsens, Präteritum, Perfekt and
  Futur. Lesson 1 names the Zeitform of a sentence by its verb parts (one
  word or two, werden or haben/sein); lesson 2 keeps one Zeitform through
  a short text, finds the verb that slips out of it and puts in the form
  that fits, and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Zeitformen, en: Tenses }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.verbs.future]
  also_practises: [lit-de.verbs.simple-past, lit-de.verbs.perfect]
  vocabulary: { de: [Zeitform, Präsens, Präteritum, Perfekt, Futur, Gegenwart, Vergangenheit, Zukunft] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: time-word-decides
      what: Names the Zeitform from a time word instead of the verb (Morgen fahre ich weg. called Futur)
      addressed: lesson 1 Learn says the verb decides the Zeitform, not the time word; a task in each stage of lesson 1 has a time word that points elsewhere, with feedback in the full stage
    - id: perfekt-as-praesens
      what: Sees haben or sein and calls a Perfekt sentence Präsens
      addressed: lesson 1 Learn names the Partizip at the end as the sign of the Perfekt; feedback on Präsens for Perfekt sentences
    - id: tense-drift
      what: Starts a story in the Präteritum and slips into the Präsens
      addressed: lesson 2 finds the verb that breaks the Zeitform in short texts in every stage and writes the fitting form
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Welche Zeitform ist das?", en: "Which tense is it?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Ergänze werden."
            say: "Setz die passende Form von werden ein: Ich ... morgen Rad fahren."
            frame: "Ich _ morgen Rad fahren."
            options: ["werde", "wirst", "wird", "werden"]
            answer: ["werde"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wir _ ins Schwimmbad gegangen."
            say: "Welches Hilfsverb passt? Wir ... ins Schwimmbad gegangen."
            options: ["haben", "sind", "hat"]
            answer: "sind"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Präsens: ich male · Präteritum: ich malte"
            say: "Du kennst vier Zeitformen. Präsens und Präteritum haben nur ein Verbteil: ich male, ich malte."
          - text: "Perfekt: ich habe gemalt · Futur: ich werde malen"
            say: "Perfekt und Futur haben zwei Teile. Das Perfekt: haben oder sein und das Partizip mit ge am Ende. Das Futur: werden und die Grundform am Ende."
          - text: "Morgen fahre ich weg. → Präsens"
            say: "Das Verb entscheidet, nicht das Zeitwort. Morgen fahre ich weg spricht über die Zukunft, aber das Verb fahre steht im Präsens."
          - text: "Gestern hat es geregnet. → Perfekt"
            say: "So gehst du vor: Such das Verb. Ist es ein Teil oder sind es zwei? Bei zwei Teilen: werden heißt Futur, haben oder sein mit Partizip heißt Perfekt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Lisa hat einen Brief geschrieben."
                say: "Lies den Satz. Welche Zeitform ist das?"
                options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
                answer: "Perfekt"
                feedback:
                  "Präsens": "Hat allein wäre Präsens. Am Ende steht aber noch das Partizip geschrieben: Das ist das Perfekt."
                hints:
                  - "Wie viele Teile hat das Verb?"
                  - "Hat und geschrieben: haben und ein Partizip."
                  - "Perfekt."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Im Sommer fliegen wir nach Spanien."
                say: "Lies den Satz. Welche Zeitform hat das Verb?"
                options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
                answer: "Präsens"
                feedback:
                  "Futur": "Der Satz spricht über die Zukunft, aber das Verb fliegen hat nur einen Teil und kein werden: Präsens."
                hints:
                  - "Achte auf das Verb, nicht auf im Sommer."
                  - "Fliegen ist ein Teil, ohne werden."
                  - "Präsens."
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf beide Teile des Verbs."
                say: "Der Satz steht im Futur. Tippe auf die zwei Teile des Verbs."
                show: { drawn: letter-card, text: "Nach der Schule wird Ben sein Fahrrad putzen" }
                spans: ["wird", "putzen"]
                hints:
                  - "Ein Teil ist eine Form von werden."
                  - "Der andere Teil steht am Ende."
                  - "wird und putzen."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? \"Der Wolf heulte laut.\" steht im Präteritum."
                say: "Der Wolf heulte laut. Steht dieser Satz im Präteritum?"
                answer: true
                hints:
                  - "Wie viele Teile hat das Verb?"
                  - "Heulte ist ein Teil mit te."
                  - "Ja, Präteritum."
              - id: l1-f5
                type: sorting
                text: "Ein Teil oder zwei Teile?"
                say: "Sortiere die Sätze. Hat das Verb einen Teil oder zwei Teile?"
                option_audio: false
                bins:
                  - { id: one, show: { text: "ein Teil" }, say: "ein Teil" }
                  - { id: two, show: { text: "zwei Teile" }, say: "zwei Teile" }
                options:
                  - { text: "Der Bus kam spät.", bin: one }
                  - { text: "Ich habe gewonnen.", bin: two }
                  - { text: "Sie lacht.", bin: one }
                  - { text: "Du wirst staunen.", bin: two }
                hints:
                  - "Zähl die Teile des Verbs."
                  - "Habe gewonnen und wirst staunen haben zwei Teile."
                  - "Kam und lacht haben einen Teil."
              - id: l1-f6
                type: multiple_choice
                text: "Wir werden das Spiel gewinnen."
                say: "Lies den Satz. Welche Zeitform ist das?"
                options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
                answer: "Futur"
                hints:
                  - "Wie viele Teile hat das Verb?"
                  - "Werden und die Grundform gewinnen."
                  - "Futur."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Die Katze ist auf den Baum geklettert."
                say: "Lies den Satz. Welche Zeitform ist das?"
                options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
                answer: "Perfekt"
                hints: ["Was steht am Ende des Satzes?"]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Satz steht im Präteritum?"
                say: "Welcher Satz steht im Präteritum?"
                options: ["Gestern spielte ich Klavier.", "Gestern habe ich Klavier gespielt.", "Gestern spiele ich Klavier."]
                answer: "Gestern spielte ich Klavier."
                hints: ["Das Präteritum hat ein Verbteil, oft mit te."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf beide Teile des Verbs."
                say: "Der Satz steht im Perfekt. Tippe auf die zwei Teile des Verbs."
                show: { drawn: letter-card, text: "Am Wochenende hat Opa einen Drachen gebaut" }
                spans: ["hat", "gebaut"]
                hints: ["Such eine Form von haben und das Wort am Ende."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? \"Nächste Woche besuchen wir Oma.\" steht im Futur."
                say: "Nächste Woche besuchen wir Oma. Steht dieser Satz im Futur?"
                answer: false
                hints: ["Steht im Satz eine Form von werden?"]
              - id: l1-s5
                type: multiple_choice
                text: "Der Ritter ritt zur Burg."
                say: "Lies den Satz. Welche Zeitform ist das?"
                options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
                answer: "Präteritum"
                hints: ["Ein Teil oder zwei? Ist es jetzt oder vorbei?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Morgen wird es schneien."
                say: "Lies den Satz. Welche Zeitform ist das?"
                options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
                answer: "Futur"
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Satz steht im Perfekt?"
                say: "Welcher Satz steht im Perfekt?"
                options: ["Oma hat in Berlin gewohnt.", "Oma wohnte in Berlin.", "Oma wird in Berlin wohnen."]
                answer: "Oma hat in Berlin gewohnt."
              - id: l1-n3
                type: true_false
                text: "Stimmt das? \"Heute Abend lesen wir ein Märchen.\" steht im Präsens."
                say: "Heute Abend lesen wir ein Märchen. Steht dieser Satz im Präsens?"
                answer: true
              - id: l1-n4
                type: highlight_in_text
                text: "Tippe auf beide Teile des Verbs."
                say: "Der Satz steht im Perfekt. Tippe auf die zwei Teile des Verbs."
                show: { drawn: letter-card, text: "Im Urlaub sind wir jeden Tag geschwommen" }
                spans: ["sind", "geschwommen"]
              - id: l1-n5
                type: multiple_choice
                text: "Das Eis schmilzt in der Sonne."
                say: "Lies den Satz. Welche Zeitform ist das?"
                options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
                answer: "Präsens"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Die Kinder haben ein Zelt aufgebaut."
            say: "Lies den Satz. Welche Zeitform ist das?"
            options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
            answer: "Perfekt"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? \"Ich werde dir helfen.\" steht im Futur."
            say: "Ich werde dir helfen. Steht dieser Satz im Futur?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Am Abend fing es an zu regnen."
            say: "Lies den Satz. Welche Zeitform ist das?"
            options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
            answer: "Präteritum"

  - n: 2
    title: { de: Eine Zeitform durchhalten, en: Keeping to one tense }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ihr seid zu spät gekommen."
            say: "Lies den Satz. Welche Zeitform ist das?"
            options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
            answer: "Perfekt"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Paul wird ein Bild malen."
            say: "Lies den Satz. Welche Zeitform ist das?"
            options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
            answer: "Futur"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Es war einmal ein König. Er hatte drei Töchter."
            say: "Eine Geschichte steht meist im Präteritum. Es war einmal ein König. Er hatte drei Töchter. Beide Verben stehen im Präteritum."
          - text: "Der König ging in den Wald. Dort trifft er einen Bären."
            say: "Hier rutscht ein Verb heraus. Ging steht im Präteritum, trifft im Präsens. Das passt nicht zusammen."
          - text: "Der König ging in den Wald. Dort traf er einen Bären."
            say: "Also änderst du trifft ins Präteritum: traf. Jetzt bleibt die ganze Geschichte in einer Zeitform."
          - text: "Prüfen: jedes Verb suchen · Zeitform bestimmen · passt alles?"
            say: "So prüfst du einen Text: Such jedes Verb und bestimme seine Zeitform. Ein Verb, das nicht passt, änderst du."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tippe auf das Verb, das nicht passt."
                say: "Die Geschichte steht im Präteritum. Ein Verb steht im Präsens. Tippe darauf."
                show: { drawn: letter-card, text: "Die Hexe flog über den Wald. Sie sucht ihre Katze. Am Ende fand sie sie im Turm." }
                spans: ["sucht"]
                hints:
                  - "Bestimme bei jedem Verb die Zeitform."
                  - "Flog und fand sind Präteritum."
                  - "Sucht steht im Präsens."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Die Hexe flog über den Wald. Sie _ ihre Katze."
                say: "Welche Form von suchen passt in die Geschichte im Präteritum?"
                options: ["suchte", "sucht", "hat gesucht"]
                answer: "suchte"
                feedback:
                  "hat gesucht": "Das ist Perfekt. Die Geschichte steht im Präteritum: suchte."
                hints:
                  - "Die Geschichte steht im Präteritum."
                  - "Suchen ist ein schwaches Verb: te."
                  - "suchte."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? \"Tom stand auf. Er zieht sich an und frühstückte.\" bleibt in einer Zeitform."
                say: "Tom stand auf. Er zieht sich an und frühstückte. Bleibt der Text in einer Zeitform?"
                answer: false
                hints:
                  - "Bestimme jedes Verb."
                  - "Stand und frühstückte sind Präteritum."
                  - "Nein, zieht passt nicht."
              - id: l2-f4
                type: fill_in_blank
                text: "Ergänze das Verb im Präteritum."
                say: "Setz das Verb im Präteritum ein. Der Hund rannte zum See und ... ins Wasser."
                frame: "Der Hund rannte zum See und _ ins Wasser."
                options: ["sprang", "springt", "springte"]
                answer: ["sprang"]
                hints:
                  - "Springen ist ein starkes Verb."
                  - "Es bekommt kein te."
                  - "sprang."
              - id: l2-f5
                type: highlight_in_text
                text: "Tippe auf das Verb, das nicht passt."
                say: "Der Text steht im Präsens. Ein Verb steht im Präteritum. Tippe darauf."
                show: { drawn: letter-card, text: "Jeden Morgen packe ich meine Tasche. Dann ging ich zur Schule. Dort treffe ich Mia." }
                spans: ["ging"]
                hints:
                  - "Packe und treffe sind Präsens."
                  - "Welches Verb ist schon vorbei?"
                  - "ging."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tippe auf das Verb, das nicht passt."
                say: "Die Geschichte steht im Präteritum. Ein Verb steht im Präsens. Tippe darauf."
                show: { drawn: letter-card, text: "Der Bauer pflügte sein Feld. Plötzlich sieht er einen Schatz. Er grub ihn aus." }
                spans: ["sieht"]
                hints: ["Bestimme jedes Verb."]
              - id: l2-s2
                type: multiple_choice
                text: "Der Bauer pflügte sein Feld. Plötzlich _ er einen Schatz."
                say: "Welche Form von sehen passt in die Geschichte im Präteritum?"
                options: ["sah", "sieht", "sehte"]
                answer: "sah"
                hints: ["Sehen ist ein starkes Verb."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? \"Am Samstag backen wir Kuchen. Dann essen wir ihn.\" bleibt in einer Zeitform."
                say: "Am Samstag backen wir Kuchen. Dann essen wir ihn. Bleibt der Text in einer Zeitform?"
                answer: true
                hints: ["Bestimme beide Verben."]
              - id: l2-s4
                type: fill_in_blank
                text: "Ergänze das Verb im Präteritum."
                say: "Setz das Verb im Präteritum ein. Die Kinder lachten und ... im Kreis."
                frame: "Die Kinder lachten und _ im Kreis."
                options: ["tanzten", "tanzen", "tanzt"]
                answer: ["tanzten"]
                hints: ["Tanzen ist ein schwaches Verb."]
              - id: l2-s5
                type: highlight_in_text
                text: "Tippe auf das Verb, das nicht passt."
                say: "Der Text steht im Präsens. Ein Verb steht im Präteritum. Tippe darauf."
                show: { drawn: letter-card, text: "Im Zoo füttert der Wärter die Robben. Sie klatschten mit den Flossen. Die Kinder jubeln." }
                spans: ["klatschten"]
                hints: ["Welches Verb hat te am Ende?"]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tippe auf das Verb, das nicht passt."
                say: "Die Geschichte steht im Präteritum. Ein Verb steht im Präsens. Tippe darauf."
                show: { drawn: letter-card, text: "Die Prinzessin öffnete das Tor. Ein Drache schläft im Hof. Leise schlich sie vorbei." }
                spans: ["schläft"]
              - id: l2-n2
                type: multiple_choice
                text: "Ein Drache _ im Hof. Leise schlich sie vorbei."
                say: "Welche Form von schlafen passt in die Geschichte im Präteritum?"
                options: ["schlief", "schläft", "schlafte"]
                answer: "schlief"
              - id: l2-n3
                type: true_false
                text: "Stimmt das? \"Lena kam nach Hause. Sie hat Hunger und aß ein Brot.\" bleibt in einer Zeitform."
                say: "Lena kam nach Hause. Sie hat Hunger und aß ein Brot. Bleibt der Text in einer Zeitform?"
                answer: false
              - id: l2-n4
                type: fill_in_blank
                text: "Ergänze das Verb im Präsens."
                say: "Setz das Verb im Präsens ein. Mein Bruder steht früh auf und ... Zeitung."
                frame: "Mein Bruder steht früh auf und _ Zeitung."
                options: ["liest", "las", "lest"]
                answer: ["liest"]
              - id: l2-n5
                type: multiple_choice
                text: "Welcher Text bleibt im Präteritum?"
                say: "Welcher Text bleibt in einer Zeitform, dem Präteritum?"
                option_audio: false
                options: ["Es klingelte. Ich öffnete die Tür.", "Es klingelte. Ich öffne die Tür.", "Es klingelt. Ich öffnete die Tür."]
                answer: "Es klingelte. Ich öffnete die Tür."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Der Zug ist pünktlich angekommen."
            say: "Lies den Satz. Welche Zeitform ist das?"
            options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
            answer: "Perfekt"
          - id: l2-c2
            type: true_false
            text: "Stimmt das? \"Übermorgen fahren wir ans Meer.\" steht im Futur."
            say: "Übermorgen fahren wir ans Meer. Steht dieser Satz im Futur?"
            answer: false
          - id: l2-c3
            type: highlight_in_text
            text: "Tippe auf das Verb, das nicht passt."
            say: "Die Geschichte steht im Präteritum. Tippe auf das Verb, das nicht passt."
            show: { drawn: letter-card, text: "Der Fuchs schlich zum Hühnerstall. Die Hühner gackern laut. Der Fuchs lief davon." }
            spans: ["gackern"]
          - id: l2-c4
            type: fill_in_blank
            text: "Ergänze das Verb im Präteritum."
            say: "Setz das Verb im Präteritum ein. Der Junge nahm den Ball und ... ihn weit."
            frame: "Der Junge nahm den Ball und _ ihn weit."
            options: ["warf", "wirft", "werfte"]
            answer: ["warf"]
          - id: l2-c5
            type: multiple_choice
            text: "Am Abend ging die Sonne unter."
            say: "Lies den Satz. Welche Zeitform ist das?"
            options: ["Präsens", "Präteritum", "Perfekt", "Futur"]
            answer: "Präteritum"
