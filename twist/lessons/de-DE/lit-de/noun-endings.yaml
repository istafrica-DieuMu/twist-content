# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.noun-endings
skill: lit-de.nouns.endings
curriculum: de-DE
language: de
title:
  de: Nomen mit -ung, -heit, -keit und -nis
  en: Nouns ending in -ung, -heit, -keit and -nis
summary: >
  Words ending in -ung, -heit, -keit and -nis are nouns, and so they are
  written with a capital. Lesson 1 makes nouns from verbs with -ung
  (wohnen, die Wohnung) and from adjectives with -heit and -keit (frei,
  die Freiheit; freundlich, die Freundlichkeit); lesson 2 adds -nis,
  finds such nouns in a sentence written all in small letters, and ends
  with the skill check.
metadata:
  year: klasse-3
  topic: { de: Nomen, en: Nouns }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.nouns.compounds, lit-de.verbs.recognise, lit-de.adjectives.recognise]
  also_practises: [lit-de.nouns.recognise]
  vocabulary: { de: [Nomen, Verb, Adjektiv, Endung, Nachsilbe, großschreiben] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: small-letter
      what: Writes the new noun with a small letter because it comes from a verb or adjective (die hoffnung)
      addressed: Learn says "Mit -ung wird es ein Nomen, also groß"; spelling choices in every stage
    - id: heit-keit
      what: Chooses -heit where -keit belongs (Freundlichheit)
      addressed: lesson 1 Learn gives the rule of thumb (after -lich, -ig, -bar, -sam comes -keit); hint names it
    - id: article
      what: Gives -ung, -heit and -keit nouns der or das
      addressed: Learn says these nouns always take die; -nis nouns mostly take das
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "-ung, -heit und -keit", en: "-ung, -heit and -keit" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
            options: ["laufen", "haus", "schnell"]
            answer: "haus"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "der, die oder das? Haustür"
            options: ["der", "die", "das"]
            answer: "die"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "wohnen → die Wohnung"
            say: "Aus dem Verb wohnen wird mit der Endung -ung ein Nomen: die Wohnung. Weil es jetzt ein Nomen ist, schreibt man es groß."
          - text: "frei → die Freiheit"
            say: "Aus Adjektiven werden mit -heit oder -keit Nomen: frei, die Freiheit. Krank, die Krankheit."
          - text: "freundlich → die Freundlichkeit"
            say: "Nach -lich, -ig, -bar und -sam kommt meistens -keit: freundlich, die Freundlichkeit. Traurig, die Traurigkeit. Nomen mit -ung, -heit und -keit haben immer den Artikel die."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "warnen → ?"
                say: "Mach aus dem Verb warnen ein Nomen mit -ung."
                options: ["die Warnung", "die warnung", "die Warnheit"]
                answer: "die Warnung"
                option_audio: false
                feedback:
                  "die warnung": "Warnung ist ein Nomen. Nomen schreibt man groß."
                hints:
                  - "Nimm warn- und häng -ung an."
                  - "Ein Nomen schreibt man groß."
                  - "Die Warnung."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Mach aus krank ein Nomen. Welche Endung passt?"
                frame: "die Krank_"
                options: ["heit", "keit", "ung"]
                answer: ["heit"]
                hints:
                  - "Krank ist ein Adjektiv."
                  - "Es endet nicht auf -lich oder -ig."
                  - "Die Krankheit."
              - id: l1-f3
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Mach aus ehrlich ein Nomen. Welche Endung passt?"
                frame: "die Ehrlich_"
                options: ["heit", "keit", "ung"]
                answer: ["keit"]
                feedback:
                  "heit": "Nach -lich kommt meistens -keit."
                hints:
                  - "Ehrlich endet auf -lich."
                  - "Nach -lich kommt -keit."
                  - "Die Ehrlichkeit."
              - id: l1-f4
                type: multiple_choice
                text: "Welcher Artikel passt? Zeichnung"
                options: ["der", "die", "das"]
                answer: "die"
                hints:
                  - "Wie endet das Wort?"
                  - "Nomen mit -ung haben immer denselben Artikel."
                  - "Die Zeichnung."
              - id: l1-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seinem Nomen."
                option_audio: false
                pairs:
                  - { left: { text: "rechnen" }, right: { text: "die Rechnung" } }
                  - { left: { text: "gesund" }, right: { text: "die Gesundheit" } }
                  - { left: { text: "ehrlich" }, right: { text: "die Ehrlichkeit" } }
                hints:
                  - "Welches Nomen fängt so an wie das Wort?"
                  - "Rechnen, die Rechnung."
                  - "rechnen, Rechnung; gesund, Gesundheit; ehrlich, Ehrlichkeit."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? Aus traurig wird die Traurigheit."
                answer: false
                hints:
                  - "Traurig endet auf -ig."
                  - "Nach -ig kommt -keit."
                  - "Nein, die Traurigkeit."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "üben → ?"
                say: "Mach aus dem Verb üben ein Nomen mit -ung."
                options: ["die Übung", "die übung", "die Übheit"]
                answer: "die Übung"
                option_audio: false
                hints: ["Nomen schreibt man groß."]
              - id: l1-s2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Mach aus schön ein Nomen. Welche Endung passt?"
                frame: "die Schön_"
                options: ["heit", "keit", "ung"]
                answer: ["heit"]
                hints: ["Schön endet nicht auf -lich oder -ig."]
              - id: l1-s3
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Mach aus freundlich ein Nomen. Welche Endung passt?"
                frame: "die Freundlich_"
                options: ["heit", "keit", "ung"]
                answer: ["keit"]
                hints: ["Freundlich endet auf -lich."]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Artikel passt? Freiheit"
                options: ["der", "die", "das"]
                answer: "die"
                hints: ["Nomen mit -heit haben immer denselben Artikel."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Aus hoffen wird die Hoffnung."
                answer: true
                hints: ["Hoffen ist ein Verb. Häng -ung an."]
              - id: l1-s6
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seinem Nomen."
                option_audio: false
                pairs:
                  - { left: { text: "wohnen" }, right: { text: "die Wohnung" } }
                  - { left: { text: "dunkel" }, right: { text: "die Dunkelheit" } }
                  - { left: { text: "pünktlich" }, right: { text: "die Pünktlichkeit" } }
                hints: ["Welches Nomen fängt so an wie das Wort?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "zeichnen → ?"
                say: "Mach aus dem Verb zeichnen ein Nomen mit -ung."
                options: ["die Zeichnung", "die zeichnung", "die Zeichheit"]
                answer: "die Zeichnung"
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Mach aus fröhlich ein Nomen. Welche Endung passt?"
                frame: "die Fröhlich_"
                options: ["heit", "keit", "ung"]
                answer: ["keit"]
              - id: l1-n3
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Mach aus klug ein Nomen. Welche Endung passt?"
                frame: "die Klug_"
                options: ["heit", "keit", "ung"]
                answer: ["heit"]
              - id: l1-n4
                type: multiple_choice
                text: "Welcher Artikel passt? Ordnung"
                options: ["der", "die", "das"]
                answer: "die"
              - id: l1-n5
                type: true_false
                text: "Stimmt das? Aus müde wird die Müdeheit."
                answer: false
              - id: l1-n6
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit seinem Nomen."
                option_audio: false
                pairs:
                  - { left: { text: "meinen" }, right: { text: "die Meinung" } }
                  - { left: { text: "sicher" }, right: { text: "die Sicherheit" } }
                  - { left: { text: "einsam" }, right: { text: "die Einsamkeit" } }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "landen → ?"
            say: "Mach aus dem Verb landen ein Nomen mit -ung."
            options: ["die Landung", "die landung", "die Landheit"]
            answer: "die Landung"
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Mach aus wichtig ein Nomen. Welche Endung passt?"
            frame: "die Wichtig_"
            options: ["heit", "keit", "ung"]
            answer: ["keit"]
          - id: l1-c3
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Mach aus frei ein Nomen. Welche Endung passt?"
            frame: "die Frei_"
            options: ["heit", "keit", "ung"]
            answer: ["heit"]

  - n: 2
    title: { de: "-nis und Nomen im Satz", en: "-nis and nouns in a sentence" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "wohnen → ?"
            say: "Mach aus dem Verb wohnen ein Nomen mit -ung."
            options: ["die Wohnung", "die wohnung", "die Wohnheit"]
            answer: "die Wohnung"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Mach aus ehrlich ein Nomen. Welche Endung passt?"
            frame: "die Ehrlich_"
            options: ["heit", "keit", "ung"]
            answer: ["keit"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "erleben → das Erlebnis"
            say: "Auch mit der Endung -nis entstehen Nomen: erleben, das Erlebnis. Ergeben, das Ergebnis. Geheim, das Geheimnis. Diese Nomen haben meistens den Artikel das."
          - text: "die ferien waren ein erlebnis."
            say: "Hier ist ein Satz ganz klein geschrieben. Welche Wörter sind Nomen? Die Ferien, das passt. Und erlebnis endet auf -nis. Beide Wörter schreibt man groß."
            show: { drawn: letter-card, text: "die ferien waren ein erlebnis" }
          - text: "Die Ferien waren ein Erlebnis."
            say: "Richtig geschrieben: Die Ferien waren ein Erlebnis. Das erste Wort im Satz schreibt man auch groß."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "ergeben → ?"
                say: "Mach aus dem Verb ergeben ein Nomen mit -nis."
                options: ["das Ergebnis", "das ergebnis", "die Ergebung"]
                answer: "das Ergebnis"
                option_audio: false
                hints:
                  - "Häng -nis an."
                  - "Ein Nomen schreibt man groß."
                  - "Das Ergebnis."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "die übung macht mir freude" }
                spans: ["übung", "freude"]
                hints:
                  - "Nomen sind Dinge, auch solche, die man nicht anfassen kann."
                  - "Ein Wort endet auf -ung."
                  - "übung und freude."
              - id: l2-f3
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
                options: ["gesund", "gesundheit", "gesunder"]
                answer: "gesundheit"
                option_audio: false
                hints:
                  - "Welches Wort hat eine Nomen-Endung?"
                  - "Wörter mit -heit sind Nomen."
                  - "Gesundheit."
              - id: l2-f4
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Mach aus geheim ein Nomen. Welche Endung passt?"
                frame: "das Geheim_"
                options: ["nis", "heit", "ung"]
                answer: ["nis"]
                hints:
                  - "Der Artikel ist das."
                  - "Nomen mit -nis haben meistens den Artikel das."
                  - "Das Geheimnis."
              - id: l2-f5
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "das zeugnis bringt mir freude" }
                spans: ["zeugnis", "freude"]
                hints:
                  - "Schau auf die Endungen."
                  - "Ein Wort endet auf -nis."
                  - "zeugnis und freude."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? Im Satz \"Wir hatten viel Freude.\" ist Freude ein Nomen."
                say: "Wir hatten viel Freude. Ist Freude ein Nomen?"
                answer: true
                hints:
                  - "Kann man der, die oder das davorsetzen?"
                  - "Die Freude."
                  - "Ja, Freude ist ein Nomen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "verstehen → ?"
                say: "Mach aus dem Verb verstehen ein Nomen mit -nis."
                options: ["das Verständnis", "das verständnis", "die Verstehung"]
                answer: "das Verständnis"
                option_audio: false
                hints: ["Aus e wird ä."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "die freiheit ist eine wichtige sache" }
                spans: ["freiheit", "sache"]
                hints: ["Zwei Nomen."]
              - id: l2-s3
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
                options: ["ehrlich", "ehrlicher", "ehrlichkeit"]
                answer: "ehrlichkeit"
                option_audio: false
                hints: ["Schau auf die Endung."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Man schreibt: Die erlebnisse waren toll."
                answer: false
                hints: ["Erlebnis ist ein Nomen."]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Artikel passt? Ergebnis"
                options: ["der", "die", "das"]
                answer: "das"
                hints: ["Nomen mit -nis haben meistens den Artikel das."]
              - id: l2-s6
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "die heizung macht die wohnung warm" }
                spans: ["heizung", "wohnung"]
                hints: ["Zwei Wörter enden auf -ung."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "erleben → ?"
                say: "Mach aus dem Verb erleben ein Nomen mit -nis."
                options: ["das Erlebnis", "das erlebnis", "die Erlebung"]
                answer: "das Erlebnis"
                option_audio: false
              - id: l2-n2
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "die dunkelheit macht mir keine angst" }
                spans: ["dunkelheit", "angst"]
              - id: l2-n3
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Mach aus hindern ein Nomen. Welche Endung passt?"
                frame: "das Hinder_"
                options: ["nis", "heit", "keit"]
                answer: ["nis"]
              - id: l2-n4
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
                options: ["ehrlich", "ehrlichkeit", "ehrlicher"]
                answer: "ehrlichkeit"
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Stimmt das? Man schreibt: Die Rechnung stimmt."
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "bilden → ?"
            say: "Mach aus dem Verb bilden ein Nomen mit -ung."
            options: ["die Bildung", "die bildung", "die Bildheit"]
            answer: "die Bildung"
            option_audio: false
          - id: l2-c2
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Mach aus gemütlich ein Nomen. Welche Endung passt?"
            frame: "die Gemütlich_"
            options: ["heit", "keit", "ung"]
            answer: ["keit"]
          - id: l2-c3
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Mach aus gesund ein Nomen. Welche Endung passt?"
            frame: "die Gesund_"
            options: ["heit", "keit", "nis"]
            answer: ["heit"]
          - id: l2-c4
            type: highlight_in_text
            text: "Tippe auf jedes Nomen."
            say: "Der Satz ist ganz klein geschrieben. Tippe auf jedes Nomen."
            show: { drawn: letter-card, text: "das ergebnis war eine überraschung" }
            spans: ["ergebnis", "überraschung"]
          - id: l2-c5
            type: multiple_choice
            text: "Welcher Artikel passt? Bewegung"
            options: ["der", "die", "das"]
            answer: "die"
