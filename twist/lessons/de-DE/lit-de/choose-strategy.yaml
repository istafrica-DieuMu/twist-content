# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.choose-strategy
skill: lit-de.spelling-strategies.choose-strategy
curriculum: de-DE
language: de
title:
  de: Welche Strategie hilft?
  en: Which strategy helps?
summary: >
  Choosing the spelling strategy that fits the tricky part of a word.
  Lesson 1 matches words to Schwingen, Verlängern, Ableiten or Merken
  (Tomate, Hund, Bäume, Vogel); lesson 2 finds the tricky part, picks the
  strategy and writes the letter, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Rechtschreibstrategien, en: Spelling strategies }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling-strategies.lengthen-double, lit-de.spelling-strategies.derive-ae-aeu, lit-de.spelling-strategies.memory-words]
  also_practises: [lit-de.spelling-strategies.lengthen-dt, lit-de.spelling-strategies.lengthen-bp-gk, lit-de.spelling-strategies.derive-ae-aeu, lit-de.spelling-strategies.memory-words, lit-de.spelling-strategies.syllable-swinging]
  vocabulary: { de: [Strategie, schwingen, verlängern, ableiten, merken, schwierige Stelle] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: one-strategy-for-all
      what: Uses one strategy for every word (lengthens Bäume, derives Hund)
      addressed: lesson 1 Learn ties each strategy to a kind of tricky part; every stage of lesson 1 has all four strategies, and l1-s5 asks whether Ableiten helps with Hund
    - id: strategy-without-spot
      what: Picks a strategy without finding the tricky part first
      addressed: lesson 2 Learn finds the tricky part before choosing; every lesson 2 gap names the part to decide (g or k, ä or e, V or F)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Vier Strategien", en: "Four strategies" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "d oder t? Verlängere."
            say: "Das Pferd. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "das Pfer_"
            options: ["d", "t"]
            answer: ["d"]
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "ä oder e?"
            say: "Die Zähne. Welcher Buchstabe fehlt? Such ein verwandtes Wort mit a."
            frame: "die Z_hne"
            options: ["ä", "e"]
            answer: ["ä"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Schwingen | Verlängern | Ableiten | Merken"
            say: "Du kennst vier Strategien für schwierige Wörter: Schwingen, Verlängern, Ableiten und Merken."
          - text: "Hund: Verlängern | Bäume: Ableiten"
            say: "Hörst du am Ende ein t, p oder k, hilft Verlängern: Hund, Hunde. Hörst du ein e oder eu und es gibt ein verwandtes Wort mit a oder au, hilft Ableiten: Bäume kommt von Baum."
          - text: "Tomate: Schwingen | Vogel: Merken"
            say: "Bei langen Wörtern hilft Schwingen, damit du keinen Laut vergisst: To-ma-te. Und manche Wörter musst du dir merken, wie Vogel mit V."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Strategie hilft bei „Zwerg“?"
                say: "Zwerg. Welche Strategie hilft dir?"
                options: ["Verlängern", "Ableiten", "Merken"]
                answer: "Verlängern"
                hints:
                  - "Wo ist die schwierige Stelle?"
                  - "Am Ende: g oder k? Das hörst du im längeren Wort."
                  - "Verlängern: Zwerge."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Strategie hilft bei „Mäuse“?"
                say: "Mäuse. Welche Strategie hilft dir?"
                options: ["Ableiten", "Verlängern", "Schwingen"]
                answer: "Ableiten"
                hints:
                  - "Wo ist die schwierige Stelle?"
                  - "äu oder eu? Gibt es ein verwandtes Wort mit au?"
                  - "Ableiten: Maus."
              - id: l1-f3
                type: multiple_choice
                text: "Welche Strategie hilft bei „Vater“?"
                say: "Vater. Welche Strategie hilft dir?"
                options: ["Merken", "Verlängern", "Ableiten"]
                answer: "Merken"
                hints:
                  - "Wo ist die schwierige Stelle?"
                  - "Am Anfang: V oder F? Das kannst du weder hören noch herleiten."
                  - "Merken."
              - id: l1-f4
                type: multiple_choice
                text: "Welche Strategie hilft bei „Schokolade“?"
                say: "Schokolade. Welche Strategie hilft dir?"
                options: ["Schwingen", "Ableiten", "Verlängern"]
                answer: "Schwingen"
                hints:
                  - "Das Wort ist lang. Was hilft, damit du keinen Laut vergisst?"
                  - "Scho, ko, la, de."
                  - "Schwingen."
              - id: l1-f5
                type: true_false
                text: "Hilft Verlängern bei „Wald“?"
                say: "Wald. Hilft dir Verlängern?"
                answer: true
                hints:
                  - "Wo ist die schwierige Stelle?"
                  - "Am Ende: d oder t?"
                  - "Ja: Wälder."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Strategie hilft bei „Korb“?"
                say: "Korb. Welche Strategie hilft dir?"
                options: ["Verlängern", "Merken", "Schwingen"]
                answer: "Verlängern"
                hints: ["Wo ist die schwierige Stelle?"]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Strategie hilft bei „Gläser“?"
                say: "Gläser. Welche Strategie hilft dir?"
                options: ["Ableiten", "Verlängern", "Merken"]
                answer: "Ableiten"
                hints: ["ä oder e? Gibt es ein verwandtes Wort mit a?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Strategie hilft bei „Fuchs“?"
                say: "Fuchs. Welche Strategie hilft dir?"
                options: ["Merken", "Ableiten", "Verlängern"]
                answer: "Merken"
                hints: ["chs, x oder ks? Kannst du das hören?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Strategie hilft bei „Banane“?"
                say: "Banane. Welche Strategie hilft dir?"
                options: ["Schwingen", "Ableiten", "Merken"]
                answer: "Schwingen"
                hints: ["Sprich jede Silbe deutlich."]
              - id: l1-s5
                type: true_false
                text: "Hilft Ableiten bei „Hund“?"
                say: "Hund. Hilft dir Ableiten?"
                answer: false
                hints: ["Wo ist die schwierige Stelle bei Hund?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Strategie hilft bei „Berg“?"
                say: "Berg. Welche Strategie hilft dir?"
                options: ["Verlängern", "Ableiten", "Merken"]
                answer: "Verlängern"
              - id: l1-n2
                type: multiple_choice
                text: "Welche Strategie hilft bei „Räuber“?"
                say: "Räuber. Welche Strategie hilft dir?"
                options: ["Ableiten", "Schwingen", "Verlängern"]
                answer: "Ableiten"
              - id: l1-n3
                type: multiple_choice
                text: "Welche Strategie hilft bei „Uhr“?"
                say: "Uhr. Welche Strategie hilft dir?"
                options: ["Merken", "Verlängern", "Ableiten"]
                answer: "Merken"
              - id: l1-n4
                type: multiple_choice
                text: "Welche Strategie hilft bei „Limonade“?"
                say: "Limonade. Welche Strategie hilft dir?"
                options: ["Schwingen", "Ableiten", "Verlängern"]
                answer: "Schwingen"
              - id: l1-n5
                type: true_false
                text: "Hilft Merken bei „Hexe“?"
                say: "Hexe. Hilft dir Merken?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Strategie hilft bei „Bild“?"
            say: "Bild. Welche Strategie hilft dir?"
            options: ["Verlängern", "Ableiten", "Schwingen"]
            answer: "Verlängern"
          - id: l1-c2
            type: multiple_choice
            text: "Welche Strategie hilft bei „Häuser“?"
            say: "Häuser. Welche Strategie hilft dir?"
            options: ["Ableiten", "Verlängern", "Merken"]
            answer: "Ableiten"
          - id: l1-c3
            type: multiple_choice
            text: "Welche Strategie hilft bei „Ananas“?"
            say: "Ananas. Welche Strategie hilft dir?"
            options: ["Schwingen", "Ableiten", "Verlängern"]
            answer: "Schwingen"

  - n: 2
    title: { de: "Finden, wählen, schreiben", en: "Find, choose, write" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Strategie hilft bei „Kind“?"
            say: "Kind. Welche Strategie hilft dir?"
            options: ["Verlängern", "Ableiten", "Merken"]
            answer: "Verlängern"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Strategie hilft bei „Bälle“?"
            say: "Bälle. Welche Strategie hilft dir?"
            options: ["Ableiten", "Schwingen", "Merken"]
            answer: "Ableiten"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ber_ | Verlängern: Berge | Berg"
            say: "Erst suchst du die schwierige Stelle, dann wählst du die Strategie, dann schreibst du. Berg: Am Ende hörst du k. Verlängern: Berge. Du hörst g, also Berg mit g."
          - text: "Z_hne | Ableiten: Zahn | Zähne"
            say: "Zähne: Du hörst etwas wie e. Ableiten: Zahn hat ein a. Also schreibst du Zähne mit ä."
          - text: "Berg | Zähne"
            say: "Zum Schluss schaust du dir das Wort noch einmal genau an. Stimmt es?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "g oder k?"
                say: "Der Zwerg. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "der Zwer_"
                options: ["g", "k"]
                answer: ["g"]
                hints:
                  - "Welche Strategie hilft am Wortende?"
                  - "Verlängere: Zwerge. Was hörst du?"
                  - "g: Zwerg."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "ä oder e?"
                say: "Die Wälder. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "die W_lder"
                options: ["ä", "e"]
                answer: ["ä"]
                hints:
                  - "Welche Strategie hilft bei ä oder e?"
                  - "Ableiten: Gibt es ein verwandtes Wort mit a?"
                  - "ä, von Wald."
              - id: l2-f3
                type: fill_in_blank
                text: "V oder F?"
                say: "Der Vogel. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                show: { object: bird }
                frame: "der _ogel"
                options: ["V", "F"]
                answer: ["V"]
                hints:
                  - "Kannst du V oder F hören oder herleiten?"
                  - "Nein. Vogel ist ein Merkwort."
                  - "V: Vogel."
              - id: l2-f4
                type: fill_in_blank
                text: "k oder ck?"
                say: "Die Schokolade. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "Scho_olade"
                options: ["k", "ck"]
                answer: ["k"]
                hints:
                  - "Welche Strategie hilft bei langen Wörtern?"
                  - "Schwinge: Scho, ko, la, de. Vor dem k steht ein langes o. Nach einem langen Selbstlaut steht nie ck."
                  - "Nur k: Schokolade."
              - id: l2-f5
                type: multiple_choice
                text: "Häuser: Welche Strategie, welches Wort?"
                say: "Häuser. Welche Strategie hilft, und wie schreibst du das Wort?"
                options: ["Ableiten: Häuser", "Verlängern: Heuser", "Merken: Heuser"]
                answer: "Ableiten: Häuser"
                option_audio: false
                hints:
                  - "Wo ist die schwierige Stelle?"
                  - "äu oder eu? Gibt es ein verwandtes Wort mit au?"
                  - "Ableiten: Haus, also Häuser."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "d oder t?"
                say: "Der Freund. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "der Freun_"
                options: ["d", "t"]
                answer: ["d"]
                hints: ["Verlängere: Freunde."]
              - id: l2-s2
                type: fill_in_blank
                text: "ä oder e?"
                say: "Die Bäche. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "die B_che"
                options: ["ä", "e"]
                answer: ["ä"]
                hints: ["Gibt es ein verwandtes Wort mit a?"]
              - id: l2-s3
                type: fill_in_blank
                text: "v oder f?"
                say: "Viel. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "_iel"
                options: ["v", "f"]
                answer: ["v"]
                hints: ["Viel ist ein Merkwort."]
              - id: l2-s4
                type: fill_in_blank
                text: "a oder e?"
                say: "Die Giraffe. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "Gir_ffe"
                options: ["a", "e"]
                answer: ["a"]
                hints: ["Schwinge: Gi, raf, fe."]
              - id: l2-s5
                type: multiple_choice
                text: "Hände: Welche Strategie, welches Wort?"
                say: "Hände. Welche Strategie hilft, und wie schreibst du das Wort?"
                options: ["Ableiten: Hände", "Verlängern: Hende", "Merken: Hende"]
                answer: "Ableiten: Hände"
                option_audio: false
                hints: ["Gibt es ein verwandtes Wort mit a?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "d oder t?"
                say: "Der Wald. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "der Wal_"
                options: ["d", "t"]
                answer: ["d"]
              - id: l2-n2
                type: fill_in_blank
                text: "ä oder e?"
                say: "Die Gärten. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "die G_rten"
                options: ["ä", "e"]
                answer: ["ä"]
              - id: l2-n3
                type: fill_in_blank
                text: "V oder F?"
                say: "Der Vater. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "der _ater"
                options: ["V", "F"]
                answer: ["V"]
              - id: l2-n4
                type: fill_in_blank
                text: "a oder e?"
                say: "Die Banane. Welcher Buchstabe fehlt? Wähle die passende Strategie."
                frame: "Ban_ne"
                options: ["a", "e"]
                answer: ["a"]
              - id: l2-n5
                type: multiple_choice
                text: "Träume: Welche Strategie, welches Wort?"
                say: "Träume. Welche Strategie hilft, und wie schreibst du das Wort?"
                options: ["Ableiten: Träume", "Merken: Treume", "Schwingen: Treume"]
                answer: "Ableiten: Träume"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "d oder t?"
            say: "Das Kind. Welcher Buchstabe fehlt? Wähle die passende Strategie."
            frame: "das Kin_"
            options: ["d", "t"]
            answer: ["d"]
          - id: l2-c2
            type: fill_in_blank
            text: "Ä oder E?"
            say: "Die Äpfel. Welcher Buchstabe fehlt? Wähle die passende Strategie."
            frame: "die _pfel"
            options: ["Ä", "E"]
            answer: ["Ä"]
          - id: l2-c3
            type: fill_in_blank
            text: "v oder f?"
            say: "Vier. Welcher Buchstabe fehlt? Wähle die passende Strategie."
            frame: "_ier"
            options: ["v", "f"]
            answer: ["v"]
          - id: l2-c4
            type: multiple_choice
            text: "Welche Strategie hilft bei „Kartoffel“?"
            say: "Kartoffel. Welche Strategie hilft dir?"
            options: ["Schwingen", "Ableiten", "Verlängern"]
            answer: "Schwingen"
          - id: l2-c5
            type: multiple_choice
            text: "Welche Strategie hilft bei „Fäden“?"
            say: "Fäden. Welche Strategie hilft dir?"
            options: ["Ableiten", "Merken", "Verlängern"]
            answer: "Ableiten"
