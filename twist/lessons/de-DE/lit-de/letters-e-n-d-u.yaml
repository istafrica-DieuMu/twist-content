# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-e-n-d-u
skill: lit-de.letters.e-n-d-u
curriculum: de-DE
language: de
title:
  de: Die Buchstaben E, N, D und U
  en: The letters E, N, D and U
summary: >
  The third letter group in Fibel order. One lesson each for E, N, D and U:
  hear the sound, find it in words, see and trace the letter, practised in
  three stages. Each lesson sets the new sound against its nearest
  neighbour: E against I, N against M, D against T, U against O (Mund and
  Mond). Lesson 5 reads words made only of known letters (Nase, Ente,
  Sonne, Tanne, Mond, Mund) and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.i-ie-s-t]
  also_practises:
    [lit-de.letters.i-ie-s-t, lit-de.handwriting.print-letters, lit-de.decoding.two-syllable-words]
  vocabulary:
    { de: [Buchstabe, Laut, Anlaut, Silbe, Großbuchstabe, Kleinbuchstabe] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, syllable-arcs, word-card]
  sounds: []
  facets: [script]
  misconceptions:
    - id: m-n
      what: Confuses N with M, by shape (one hump or two) and by sound (open or closed lips)
      addressed: lesson 2 Learn sets N against M; l2-f1, l2-f2, l2-s1, l2-n1 and l2-f4 ask for the difference by ear and by eye
    - id: d-t
      what: Does not hear the soft d from the t with its puff of air (Dose, Tasse)
      addressed: lesson 3 Learn uses the hand in front of the mouth; l3-f2, l3-f3, l3-s1, l3-n1 and l3-n2 contrast D and T
    - id: o-u
      what: Mixes up o and u inside a word (Mond, Mund)
      addressed: l4-f2, l4-s2, l4-s3, l5-f3 and l5-s3 put Mond and Mund side by side
    - id: e-i
      what: Hears the e at the start of Ente or Esel as i
      addressed: l1-f3 and l1-c2 set Igel against E words; the hint describes the mouth
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das E, en: The letter E }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Socke." }
            options: ["S", "T", "I"]
            answer: "S"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Was fängt mit T an?"
            options: [{ object: table }, { object: lamp }]
            answer: table
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "E e"
            say: "Das ist das E. Es klingt so: eee. Wie bei Esel. Manchmal ist es kurz: e, wie bei Ente."
            show: { drawn: letter-card, text: "Ee" }
          - text: "Erdbeere"
            say: "Erdbeere. Eee-rdbeere. Hörst du das eee am Anfang?"
            show: { object: strawberry }
          - text: "Ente"
            say: "Ente. E ... nte. Hier ist das e kurz."
            show: { object: duck }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was fängt mit E an?"
                options: [{ object: duck }, { object: hedgehog }, { object: ant }]
                answer: duck
                feedback:
                  hedgehog: "Igel fängt mit iii an. Das ist das I."
                  ant: "Ameise fängt mit aaa an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Ente ... e. Igel ... iii. Ameise ... aaa."
                  - "Ente fängt mit E an."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Hörst du am Anfang ein E?"
                say: "Elefant. Hörst du am Anfang ein e?"
                show: { object: elephant }
                answer: true
                hints:
                  - "Sag das Wort mit: Elefant."
                  - "E ... le ... fant. Was hörst du ganz vorne?"
                  - "Ja, Elefant fängt mit E an."
                difficulty: easy
              - id: l1-f3
                type: true_false
                text: "Hörst du am Anfang ein E?"
                say: "Igel. Hörst du am Anfang ein e?"
                show: { object: hedgehog }
                answer: false
                hints:
                  - "Sag das Wort mit: Igel."
                  - "Bei iii lächelst du fast. Bei eee ist der Mund ein bisschen weiter offen."
                  - "Nein, Igel fängt mit I an."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes E."
                say: "Tippe auf jedes große und kleine E."
                show: { drawn: letter-card, text: "E i e T E" }
                spans: ["E", "e", "E"]
                hints:
                  - "Das große E hat drei Striche nach rechts, wie ein Kamm."
                  - "Das kleine e hat einen Strich in der Mitte und ist unten rechts offen."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l1-f5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Tasse. Welcher Buchstabe fehlt am Ende?"
                show: { object: cup }
                frame: "Tass_"
                options: ["e", "a", "i"]
                answer: ["e"]
                hints:
                  - "Sprich das Wort langsam bis zum Ende."
                  - "Tas ... se. Am Ende hörst du ein leises e."
                  - "Am Ende fehlt das e."
              - id: l1-f6
                type: tracing
                text: "Schreib das E nach."
                show: { drawn: writing-lines, text: "E", mode: trace, arrows: true }
                char: "E"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Esel." }
                options: ["E", "I", "A"]
                answer: "E"
                hints: ["Eee-sel. Hör auf den Anfang."]
              - id: l1-s2
                type: true_false
                text: "Hörst du am Anfang ein E?"
                say: "Ente. Hörst du am Anfang ein e?"
                show: { object: duck }
                answer: true
                hints: ["Sprich es langsam: E ... nte."]
              - id: l1-s3
                type: true_false
                text: "Hörst du am Anfang ein E?"
                say: "Affe. Hörst du am Anfang ein e?"
                show: { object: monkey }
                answer: false
                hints: ["Ist dein Mund am Anfang weit offen? Dann ist es das a."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tippe auf jedes E."
                say: "Tippe auf jedes große und kleine E."
                show: { drawn: letter-card, text: "e a E o" }
                spans: ["e", "E"]
                hints: ["Es sind zwei."]
              - id: l1-s5
                type: tracing
                text: "Schreib das e nach."
                show: { drawn: writing-lines, text: "e", mode: trace, arrows: true }
                char: "e"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Was fängt mit E an?"
                options: [{ object: apple }, { object: elephant }, { object: oven }]
                answer: elephant
              - id: l1-n2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Sonne. Welcher Buchstabe fehlt am Ende?"
                show: { object: sun }
                frame: "Sonn_"
                options: ["a", "e", "o"]
                answer: ["e"]
              - id: l1-n3
                type: true_false
                text: "Hörst du am Anfang ein E?"
                say: "Ohr. Hörst du am Anfang ein e?"
                show: { object: ear }
                answer: false
                difficulty: easy
              - id: l1-n4
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Ente." }
                options: ["A", "E", "I"]
                answer: "E"
              - id: l1-n5
                type: tracing
                text: "Schreib das e ab."
                show: { drawn: writing-lines, text: "e", mode: copy, arrows: false }
                char: "e"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was fängt mit E an?"
            options: [{ object: monkey }, { object: strawberry }, { object: lion }]
            answer: strawberry
          - id: l1-c2
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Igel." }
            options: ["E", "I"]
            answer: "I"
          - id: l1-c3
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Tanne. Welcher Buchstabe fehlt am Ende?"
            show: { object: fir-tree }
            frame: "Tann_"
            options: ["i", "e"]
            answer: ["e"]

  - n: 2
    title: { de: Das N, en: The letter N }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was fängt mit E an?"
            options: [{ object: sock }, { object: duck }]
            answer: duck
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Esel." }
            options: ["A", "E"]
            answer: "E"
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "N n"
            say: "Dieser Buchstabe klingt so: nnn. Wie bei Nase. Die Zungenspitze liegt oben hinter den Zähnen, und es summt."
            show: { drawn: letter-card, text: "Nn" }
          - text: "Nase"
            say: "Nase. Nnn-ase. Hörst du das nnn am Anfang?"
            show: { object: nose }
          - text: "n m"
            say: "Pass auf: Das kleine n hat einen Bogen, das kleine m hat zwei. Beim mmm sind die Lippen zu. Beim nnn sind sie ein bisschen offen."
            show: { drawn: letter-card, text: "n m" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Was fängt mit N an?"
                options: [{ object: nose }, { object: mouse }, { object: sun }]
                answer: nose
                feedback:
                  mouse: "Maus fängt mit mmm an. Da sind die Lippen zu. Bei nnn sind sie offen."
                  sun: "Sonne fängt mit sss an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Nase ... nnn. Maus ... mmm. Sonne ... sss."
                  - "Nase fängt mit N an."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "N oder M?"
                audio: { de: "Nase." }
                options: ["N", "M"]
                answer: "N"
                feedback:
                  M: "Bei mmm sind die Lippen zu. Bei Nase sind sie offen: nnn."
                hints:
                  - "Hör noch einmal hin."
                  - "Sprich es nach. Sind deine Lippen am Anfang zu oder offen?"
                  - "Offen: Das ist das N."
              - id: l2-f3
                type: true_false
                text: "Hörst du ein N?"
                say: "Sonne. Hörst du in dem Wort ein nnn?"
                show: { object: sun }
                answer: true
                hints:
                  - "Sag das Wort langsam: Sonne."
                  - "Son ... ne. Was summt in der Mitte?"
                  - "Ja, in Sonne hörst du ein nnn."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes N."
                say: "Tippe auf jedes große und kleine N."
                show: { drawn: letter-card, text: "N m n M N" }
                spans: ["N", "n", "N"]
                hints:
                  - "Das große N hat einen schrägen Strich in der Mitte. Das große M hat zwei."
                  - "Das kleine n hat einen Bogen. Das kleine m hat zwei."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l2-f5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Nase. Welcher Buchstabe fehlt?"
                show: { object: nose }
                frame: "_ase"
                options: ["N", "M", "S"]
                answer: ["N"]
                hints:
                  - "Sprich das Wort langsam."
                  - "Nnn ... ase. Sind die Lippen am Anfang offen?"
                  - "Vorne fehlt das N."
              - id: l2-f6
                type: tracing
                text: "Schreib das N nach."
                show: { drawn: writing-lines, text: "N", mode: trace, arrows: true }
                char: "N"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Hörst du am Anfang ein N?"
                say: "Mond. Hörst du am Anfang ein nnn?"
                show: { object: moon }
                answer: false
                hints: ["Sind deine Lippen am Anfang zu? Dann ist es mmm."]
              - id: l2-s2
                type: audio_choice
                text: "N oder M?"
                audio: { de: "Nudel." }
                options: ["M", "N"]
                answer: "N"
                hints: ["Sind die Lippen am Anfang offen?"]
              - id: l2-s3
                type: true_false
                text: "Hörst du ein N?"
                say: "Tanne. Hörst du in dem Wort ein nnn?"
                show: { object: fir-tree }
                answer: true
                hints: ["Tan ... ne. Hör auf die Mitte."]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf jedes N."
                say: "Tippe auf jedes große und kleine N."
                show: { drawn: letter-card, text: "m N n M" }
                spans: ["N", "n"]
                hints: ["Es sind zwei: ein großes und ein kleines."]
              - id: l2-s5
                type: tracing
                text: "Schreib das n nach."
                show: { drawn: writing-lines, text: "n", mode: trace, arrows: true }
                char: "n"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "N oder M?"
                audio: { de: "Maus." }
                options: ["N", "M"]
                answer: "M"
              - id: l2-n2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Tanne. Welcher Buchstabe fehlt?"
                show: { object: fir-tree }
                frame: "Tan_e"
                options: ["n", "m", "t"]
                answer: ["n"]
              - id: l2-n3
                type: true_false
                text: "Hörst du ein N?"
                say: "Ball. Hörst du in dem Wort ein nnn?"
                show: { object: ball }
                answer: false
                difficulty: easy
              - id: l2-n4
                type: highlight_in_text
                text: "Tippe auf jedes N."
                say: "Tippe auf jedes große und kleine N."
                show: { drawn: letter-card, text: "n m n M N m" }
                spans: ["n", "n", "N"]
                difficulty: stretch
              - id: l2-n5
                type: tracing
                text: "Schreib das N ab."
                show: { drawn: writing-lines, text: "N", mode: copy, arrows: false }
                char: "N"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Was fängt mit N an?"
            options: [{ object: moon }, { object: nose }, { object: egg }]
            answer: nose
          - id: l2-c2
            type: audio_choice
            text: "N oder M?"
            audio: { de: "Name." }
            options: ["M", "N"]
            answer: "N"
          - id: l2-c3
            type: true_false
            text: "Hörst du am Anfang ein N?"
            say: "Mund. Hörst du am Anfang ein nnn?"
            show: { object: mouth }
            answer: false

  - n: 3
    title: { de: Das D, en: The letter D }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: audio_choice
            text: "N oder M?"
            audio: { de: "Nest." }
            options: ["N", "M"]
            answer: "N"
            difficulty: easy
          - id: l3-w2
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Nase. Welcher Buchstabe fehlt?"
            show: { object: nose }
            frame: "_ase"
            options: ["M", "N"]
            answer: ["N"]
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "D d"
            say: "Dieser Buchstabe klingt so: d. Wie bei Drachen und Dino. Das d klingt weicher als das t."
            show: { drawn: letter-card, text: "Dd" }
          - text: "Drachen"
            say: "Drachen. D ... rachen. Hörst du das weiche d am Anfang?"
            show: { object: kite }
          - text: "D T"
            say: "Halte die Hand vor den Mund. Sag Tasse: Beim t spürst du einen Hauch. Sag Dose: Beim d ist der Hauch ganz klein."
            show: { drawn: letter-card, text: "D T" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: image_multiple_choice
                text: "Was fängt mit D an?"
                options: [{ object: kite }, { object: cup }, { object: ball }]
                answer: kite
                feedback:
                  cup: "Tasse fängt mit t an. Da spürst du einen Hauch."
                  ball: "Ball fängt mit b an. Da gehen die Lippen zu."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Drachen ... d. Tasse ... t. Ball ... b."
                  - "Drachen fängt mit D an."
                difficulty: easy
              - id: l3-f2
                type: audio_choice
                text: "D oder T?"
                audio: { de: "Dose." }
                options: ["D", "T"]
                answer: "D"
                feedback:
                  T: "Bei t spürst du einen starken Hauch. Dose fängt weich an: d."
                hints:
                  - "Hör noch einmal hin."
                  - "Halte die Hand vor den Mund und sprich nach: Dose. Spürst du viel Luft?"
                  - "Wenig Luft, weich: Das ist das D."
              - id: l3-f3
                type: true_false
                text: "Hörst du am Anfang ein D?"
                say: "Tanne. Hörst du am Anfang ein d?"
                show: { object: fir-tree }
                answer: false
                hints:
                  - "Sag das Wort mit: Tanne."
                  - "Halte die Hand vor den Mund. Spürst du am Anfang einen Hauch? Dann ist es t."
                  - "Nein, Tanne fängt mit t an."
              - id: l3-f4
                type: highlight_in_text
                text: "Tippe auf jedes D."
                say: "Tippe auf jedes große und kleine D."
                show: { drawn: letter-card, text: "D b d T D" }
                spans: ["D", "d", "D"]
                hints:
                  - "Das große D hat einen geraden Strich und einen großen Bauch."
                  - "Beim kleinen d ist der Bauch links vom Strich. Beim b ist er rechts."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l3-f5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Drachen. Welcher Buchstabe fehlt?"
                show: { object: kite }
                frame: "_rachen"
                options: ["D", "T", "N"]
                answer: ["D"]
                hints:
                  - "Sprich das Wort langsam."
                  - "D ... rachen. Ist der erste Laut weich, oder spürst du einen Hauch?"
                  - "Vorne fehlt das D."
              - id: l3-f6
                type: tracing
                text: "Schreib das D nach."
                show: { drawn: writing-lines, text: "D", mode: trace, arrows: true }
                char: "D"
                difficulty: easy

          - support: some
            tasks:
              - id: l3-s1
                type: audio_choice
                text: "D oder T?"
                audio: { de: "Tasse." }
                options: ["D", "T"]
                answer: "T"
                hints: ["Spürst du an der Hand einen Hauch?"]
              - id: l3-s2
                type: true_false
                text: "Hörst du am Anfang ein D?"
                say: "Drachen. Hörst du am Anfang ein d?"
                show: { object: kite }
                answer: true
                hints: ["Sprich es langsam: D ... rachen."]
              - id: l3-s3
                type: audio_choice
                text: "D oder T?"
                audio: { de: "Dino." }
                options: ["T", "D"]
                answer: "D"
                hints: ["Weich oder mit Hauch?"]
              - id: l3-s4
                type: highlight_in_text
                text: "Tippe auf jedes D."
                say: "Tippe auf jedes große und kleine D."
                show: { drawn: letter-card, text: "d b D t" }
                spans: ["d", "D"]
                hints: ["Es sind zwei. Beim kleinen d ist der Bauch links."]
              - id: l3-s5
                type: tracing
                text: "Schreib das d nach."
                show: { drawn: writing-lines, text: "d", mode: trace, arrows: true }
                char: "d"
                difficulty: easy

          - support: none
            tasks:
              - id: l3-n1
                type: audio_choice
                text: "D oder T?"
                audio: { de: "Dach." }
                options: ["D", "T"]
                answer: "D"
              - id: l3-n2
                type: audio_choice
                text: "D oder T?"
                audio: { de: "Tonne." }
                options: ["T", "D"]
                answer: "T"
              - id: l3-n3
                type: image_multiple_choice
                text: "Was fängt mit D an?"
                options: [{ object: telephone }, { object: kite }, { object: nose }]
                answer: kite
              - id: l3-n4
                type: highlight_in_text
                text: "Tippe auf jedes D."
                say: "Tippe auf jedes große und kleine D."
                show: { drawn: letter-card, text: "D d b T d" }
                spans: ["D", "d", "d"]
                difficulty: stretch
              - id: l3-n5
                type: tracing
                text: "Schreib das d ab."
                show: { drawn: writing-lines, text: "d", mode: copy, arrows: false }
                char: "d"

      - activity: check
        size: quick
        tasks:
          - id: l3-c1
            type: audio_choice
            text: "D oder T?"
            audio: { de: "Dusche." }
            options: ["T", "D"]
            answer: "D"
          - id: l3-c2
            type: true_false
            text: "Hörst du am Anfang ein D?"
            say: "Tisch. Hörst du am Anfang ein d?"
            show: { object: table }
            answer: false
          - id: l3-c3
            type: image_multiple_choice
            text: "Was fängt mit D an?"
            options: [{ object: sun }, { object: table }, { object: kite }]
            answer: kite

  - n: 4
    title: { de: Das U, en: The letter U }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l4-w1
            type: audio_choice
            text: "D oder T?"
            audio: { de: "Delfin." }
            options: ["D", "T"]
            answer: "D"
            difficulty: easy
          - id: l4-w2
            type: image_multiple_choice
            text: "Was fängt mit D an?"
            options: [{ object: cup }, { object: kite }]
            answer: kite
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
