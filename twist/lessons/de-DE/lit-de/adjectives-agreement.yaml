# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.adjectives-agreement
skill: lit-de.adjectives.agreement
curriculum: de-DE
language: de
title:
  de: Adjektive vor dem Nomen
  en: Adjectives before the noun
summary: >
  An adjective before a noun gets an ending that fits the noun: der rote
  Ball, ein roter Ball, die roten Bälle. Lesson 1 uses der, die, das
  (der große Hund, die große Katze, das große Haus: always -e); lesson 2
  uses ein and eine (ein großer Hund, eine große Katze, ein großes Haus)
  and the plural (die großen Hunde), and ends with the skill check. Only
  the Nominativ is used here.
metadata:
  year: klasse-2
  topic: { de: Adjektive, en: Adjectives }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.adjectives.describe, lit-de.nouns.articles]
  also_practises: [lit-de.nouns.plural]
  vocabulary: { de: [Adjektiv, Endung, Begleiter, der, die, das, ein, eine, Mehrzahl] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: no-ending
      what: Leaves the adjective without an ending before the noun (der groß Hund)
      addressed: Learn says an adjective before the noun always gets an ending; the bare form is an option in each lesson 1 stage, with feedback in the full stage
    - id: ein-like-der
      what: Uses the der-ending after ein (ein große Hund)
      addressed: lesson 2 Learn sets der große Hund beside ein großer Hund; options include the -e form, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "der, die, das: immer -e", en: "der, die, das: always -e" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "der, die oder das? Hund"
            say: "Welcher Begleiter passt zu Hund?"
            options: ["der", "die", "das"]
            answer: "der"
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Der Ball ist rot." }
            spans: ["rot"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Ball ist rot. · der rote Ball"
            say: "Steht das Adjektiv hinter „ist“, bleibt es, wie es ist: Der Ball ist rot. Steht es vor dem Nomen, bekommt es eine Endung: der rote Ball."
            show: { object: ball }
          - text: "der große Hund · die große Katze · das große Haus"
            say: "Nach der, die und das endet das Adjektiv auf -e: der große Hund, die große Katze, das große Haus."
          - text: "der groß Hund ✗ · der große Hund ✓"
            say: "Ohne Endung klingt es falsch: der groß Hund. Richtig ist: der große Hund."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "der _ Apfel"
                say: "Welche Form passt? Der … Apfel. Das Adjektiv heißt grün."
                options: ["grüne", "grün", "grüner"]
                answer: "grüne"
                feedback:
                  "grün": "Vor dem Nomen braucht das Adjektiv eine Endung: der grüne Apfel."
                hints:
                  - "Vor dem Nomen bekommt das Adjektiv eine Endung."
                  - "Nach „der“ endet es auf -e."
                  - "der grüne Apfel."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: die klein… Maus."
                frame: "die klein_ Maus"
                options: ["e", "er", "es"]
                answer: ["e"]
                hints:
                  - "Nach „die“ endet das Adjektiv auf -e."
                  - "die kleine …"
                  - "Es heißt: die kleine Maus."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? das neu Fahrrad"
                say: "Lies die Karte. Stimmt das so?"
                show: { drawn: letter-card, text: "das neu Fahrrad" }
                answer: false
                hints:
                  - "Hat das Adjektiv eine Endung?"
                  - "Nach „das“ endet es auf -e."
                  - "Nein, richtig ist: das neue Fahrrad."
              - id: l1-f4
                type: multiple_choice
                text: "das _ Buch"
                say: "Welche Form passt? Das … Buch. Das Adjektiv heißt dick."
                options: ["dicke", "dick", "dickes"]
                answer: "dicke"
                hints:
                  - "Nach „das“ endet das Adjektiv auf -e."
                  - "das dicke …"
                  - "Es heißt: das dicke Buch."
              - id: l1-f5
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: der lustig… Clown."
                frame: "der lustig_ Clown"
                options: ["e", "er", "en"]
                answer: ["e"]
                hints:
                  - "Nach „der“ endet das Adjektiv auf -e."
                  - "der lustige …"
                  - "Es heißt: der lustige Clown."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "die _ Blume"
                say: "Welche Form passt? Die … Blume. Das Adjektiv heißt gelb."
                options: ["gelbe", "gelb", "gelber"]
                answer: "gelbe"
                hints: ["Welche Endung kommt nach „die“?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: das warm… Wasser."
                frame: "das warm_ Wasser"
                options: ["e", "es", "er"]
                answer: ["e"]
                hints: ["Welche Endung kommt nach „das“?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? der kalte Tee"
                say: "Lies die Karte. Stimmt das so?"
                show: { drawn: letter-card, text: "der kalte Tee" }
                answer: true
                hints: ["Hat das Adjektiv nach „der“ ein -e?"]
              - id: l1-s4
                type: multiple_choice
                text: "der _ Stein"
                say: "Welche Form passt? Der … Stein. Das Adjektiv heißt schwer."
                options: ["schwere", "schwer", "schweres"]
                answer: "schwere"
                hints: ["Vor dem Nomen braucht es eine Endung."]
              - id: l1-s5
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: die süß… Erdbeere."
                frame: "die süß_ Erdbeere"
                options: ["e", "en", "es"]
                answer: ["e"]
                hints: ["Nach „die“ endet es auf …?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "das _ Schiff"
                say: "Welche Form passt? Das … Schiff. Das Adjektiv heißt alt."
                options: ["alte", "alt", "altes"]
                answer: "alte"
              - id: l1-n2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: der schnell… Hase."
                frame: "der schnell_ Hase"
                options: ["e", "er", "es"]
                answer: ["e"]
              - id: l1-n3
                type: true_false
                text: "Stimmt das? die müde Ente"
                say: "Lies die Karte. Stimmt das so?"
                show: { drawn: letter-card, text: "die müde Ente" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "die _ Tasche"
                say: "Welche Form passt? Die … Tasche. Das Adjektiv heißt voll."
                options: ["volle", "voll", "voller"]
                answer: "volle"
              - id: l1-n5
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: das rund… Fenster."
                frame: "das rund_ Fenster"
                options: ["e", "es", "en"]
                answer: ["e"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "der _ Turm"
            say: "Welche Form passt? Der … Turm. Das Adjektiv heißt spitz."
            options: ["spitze", "spitz", "spitzer"]
            answer: "spitze"
          - id: l1-c2
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung: die bunt… Kiste."
            frame: "die bunt_ Kiste"
            options: ["e", "er", "es"]
            answer: ["e"]
          - id: l1-c3
            type: true_false
            text: "Stimmt das? das klein Kind"
            say: "Lies die Karte. Stimmt das so?"
            show: { drawn: letter-card, text: "das klein Kind" }
            answer: false

  - n: 2
    title: { de: "ein großer Hund, ein großes Haus", en: "a big dog, a big house" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "der _ Mond"
            say: "Welche Form passt? Der … Mond. Das Adjektiv heißt hell."
            options: ["helle", "hell", "heller"]
            answer: "helle"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung: das leer… Glas."
            frame: "das leer_ Glas"
            options: ["e", "es", "er"]
            answer: ["e"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "der große Hund · ein großer Hund"
            say: "Nach „ein“ ändert sich die Endung. Der große Hund, aber: ein großer Hund. Hör auf das r am Ende, wie bei „der“."
            show: { object: dog }
          - text: "eine große Katze · ein großes Haus"
            say: "Bei „eine“ bleibt das -e: eine große Katze. Bei „das Haus“ heißt es: ein großes Haus. Hör auf das s, wie bei „das“."
            show: { object: house }
          - text: "die großen Hunde · die großen Häuser"
            say: "In der Mehrzahl mit „die“ endet das Adjektiv auf -en: die großen Hunde, die großen Häuser."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "ein _ Ball"
                say: "Welche Form passt? Ein … Ball. Das Adjektiv heißt rot."
                options: ["roter", "rote", "rotes"]
                answer: "roter"
                feedback:
                  "rote": "Nach „der“ heißt es der rote Ball. Nach „ein“ kommt das r dazu: ein roter Ball."
                hints:
                  - "Es heißt „der Ball“."
                  - "Nach „ein“ hörst du bei der-Wörtern ein r am Ende."
                  - "ein roter Ball."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: ein klein… Schaf."
                frame: "ein klein_ Schaf"
                options: ["es", "er", "e"]
                answer: ["es"]
                hints:
                  - "Es heißt „das Schaf“."
                  - "Nach „ein“ hörst du bei das-Wörtern ein s am Ende."
                  - "Es heißt: ein kleines Schaf."
              - id: l2-f3
                type: multiple_choice
                text: "eine _ Maus"
                say: "Welche Form passt? Eine … Maus. Das Adjektiv heißt grau."
                options: ["graue", "grauer", "graues"]
                answer: "graue"
                hints:
                  - "Es heißt „die Maus“."
                  - "Nach „eine“ bleibt das -e."
                  - "eine graue Maus."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? ein große Baum"
                say: "Lies die Karte. Stimmt das so?"
                show: { drawn: letter-card, text: "ein große Baum" }
                answer: false
                feedback:
                  "true": "Es heißt „der Baum“. Nach „ein“ kommt ein r dazu: ein großer Baum."
                hints:
                  - "Es heißt „der Baum“."
                  - "Nach „ein“ hörst du ein r."
                  - "Nein, richtig ist: ein großer Baum."
              - id: l2-f5
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: die rot… Äpfel."
                frame: "die rot_ Äpfel"
                options: ["en", "e", "er"]
                answer: ["en"]
                hints:
                  - "Äpfel ist die Mehrzahl."
                  - "In der Mehrzahl mit „die“ endet das Adjektiv auf -en."
                  - "die roten Äpfel."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "ein _ Bär"
                say: "Welche Form passt? Ein … Bär. Das Adjektiv heißt braun."
                options: ["brauner", "braune", "braunes"]
                answer: "brauner"
                hints: ["Es heißt „der Bär“."]
              - id: l2-s2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: ein neu… Buch."
                frame: "ein neu_ Buch"
                options: ["es", "er", "e"]
                answer: ["es"]
                hints: ["Es heißt „das Buch“."]
              - id: l2-s3
                type: multiple_choice
                text: "eine _ Blume"
                say: "Welche Form passt? Eine … Blume. Das Adjektiv heißt bunt."
                options: ["bunte", "bunter", "buntes"]
                answer: "bunte"
                hints: ["Es heißt „die Blume“."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? ein kleines Boot"
                say: "Lies die Karte. Stimmt das so?"
                show: { drawn: letter-card, text: "ein kleines Boot" }
                answer: true
                hints: ["Es heißt „das Boot“."]
              - id: l2-s5
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: die lustig… Kinder."
                frame: "die lustig_ Kinder"
                options: ["en", "e", "es"]
                answer: ["en"]
                hints: ["Kinder ist die Mehrzahl."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "ein _ Stuhl"
                say: "Welche Form passt? Ein … Stuhl. Das Adjektiv heißt bequem."
                options: ["bequemer", "bequeme", "bequemes"]
                answer: "bequemer"
              - id: l2-n2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: ein weich… Kissen."
                frame: "ein weich_ Kissen"
                options: ["es", "er", "e"]
                answer: ["es"]
              - id: l2-n3
                type: multiple_choice
                text: "eine _ Suppe"
                say: "Welche Form passt? Eine … Suppe. Das Adjektiv heißt heiß."
                options: ["heiße", "heißer", "heißes"]
                answer: "heiße"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? ein lange Weg"
                say: "Lies die Karte. Stimmt das so?"
                show: { drawn: letter-card, text: "ein lange Weg" }
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: die klein… Vögel."
                frame: "die klein_ Vögel"
                options: ["en", "e", "er"]
                answer: ["en"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "das _ Auto"
            say: "Welche Form passt? Das … Auto. Das Adjektiv heißt schnell."
            options: ["schnelle", "schnell", "schnelles"]
            answer: "schnelle"
          - id: l2-c2
            type: multiple_choice
            text: "ein _ Frosch"
            say: "Welche Form passt? Ein … Frosch. Das Adjektiv heißt grün."
            options: ["grüner", "grüne", "grünes"]
            answer: "grüner"
          - id: l2-c3
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung: ein hell… Zimmer."
            frame: "ein hell_ Zimmer"
            options: ["es", "er", "e"]
            answer: ["es"]
          - id: l2-c4
            type: true_false
            text: "Stimmt das? eine nette Lehrerin"
            say: "Lies die Karte. Stimmt das so?"
            show: { drawn: letter-card, text: "eine nette Lehrerin" }
            answer: true
          - id: l2-c5
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung: die alt… Bäume."
            frame: "die alt_ Bäume"
            options: ["en", "e", "es"]
            answer: ["en"]
