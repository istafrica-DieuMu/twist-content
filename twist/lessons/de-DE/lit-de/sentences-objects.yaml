# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.sentences-objects
skill: lit-de.sentences.objects
curriculum: de-DE
language: de
title:
  de: Akkusativobjekt und Dativobjekt
  en: Accusative and dative objects
summary: >
  Objects are found with a question, like the Subjekt. Lesson 1 finds the
  Akkusativobjekt with "Wen oder was?" (Lea malt einen Baum.); lesson 2
  finds the Dativobjekt with "Wem?" (Lea hilft ihrem Bruder.), tells the
  two apart in one sentence and ends with the skill check.
metadata:
  year: klasse-4
  topic: { de: Satzglieder, en: Parts of a sentence }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.sentences.move-parts, lit-de.nouns.cases]
  also_practises: [lit-de.sentences.subject-predicate]
  vocabulary: { de: [Objekt, Akkusativobjekt, Dativobjekt, "Wen oder was?", "Wem?"] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: object-as-subject
      what: Takes the object for the Subjekt when it stands first (Den Ball holt Tim.)
      addressed: lesson 1 Learn has a sentence that starts with the object; every stage of lesson 1 and its check ask Wer oder was? about a sentence that starts with the object (l1-f4, l1-s4, l1-n4, l1-c3), with feedback in l1-f4, and the skill check has one more (l2-c5)
    - id: wer-wen-wem
      what: Asks the wrong question (Wer? for an object, Wen? for a Dativobjekt)
      addressed: every stage of lesson 2 has a "Mit welcher Frage findest du …?" task offering Wer oder was, Wen oder was and Wem, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wen oder was?", en: "Whom or what?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "„Am Abend liest Papa die Zeitung.“ Wer oder was liest?"
            say: "Am Abend liest Papa die Zeitung. Wer oder was liest?"
            options: ["Papa", "Am Abend", "die Zeitung"]
            answer: "Papa"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "„Ich sehe den Hund.“ In welchem Fall steht „den Hund“?"
            say: "Ich sehe den Hund. In welchem Fall steht den Hund?"
            options: ["Akkusativ", "Nominativ", "Dativ"]
            answer: "Akkusativ"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lea malt einen Baum."
            say: "Viele Sätze haben außer Subjekt und Prädikat noch ein Objekt. Frag: Wen oder was malt Lea? Einen Baum. Einen Baum ist das Akkusativobjekt."
          - text: "Wen oder was? → Akkusativobjekt"
            say: "So baust du die Frage: zuerst Wen oder was, dann das Prädikat, dann das Subjekt. Wen oder was malt Lea?"
          - text: "Den Ball holt Tim."
            say: "Auch das Objekt kann vorn stehen. Wer holt? Tim, das Subjekt. Wen oder was holt Tim? Den Ball, das Akkusativobjekt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "„Mia isst einen Apfel.“ Wen oder was isst Mia?"
                say: "Mia isst einen Apfel. Wen oder was isst Mia?"
                options: ["einen Apfel", "Mia", "isst"]
                answer: "einen Apfel"
                feedback:
                  "Mia": "Mia ist das Subjekt. Sie isst. Was isst sie? Einen Apfel."
                  "isst": "„Isst“ ist das Prädikat. Frag weiter: Wen oder was isst Mia?"
                hints:
                  - "Stell die Frage: Wen oder was isst Mia?"
                  - "Was isst sie?"
                  - "einen Apfel."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Akkusativobjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Akkusativobjekt gehören."
                show: { drawn: letter-card, text: "Der Junge baut eine große Sandburg." }
                spans: ["eine", "große", "Sandburg"]
                hints:
                  - "Frag: Wen oder was baut der Junge?"
                  - "Die Antwort hat drei Wörter."
                  - "eine große Sandburg."
              - id: l1-f3
                type: multiple_choice
                text: "„Die Katze fängt eine Maus.“ Was ist „eine Maus“?"
                say: "Die Katze fängt eine Maus. Ist eine Maus das Subjekt oder das Akkusativobjekt?"
                options: ["Akkusativobjekt", "Subjekt"]
                answer: "Akkusativobjekt"
                hints:
                  - "Wer fängt? Die Katze."
                  - "Wen oder was fängt die Katze?"
                  - "Akkusativobjekt."
              - id: l1-f4
                type: multiple_choice
                text: "„Den Kuchen backt Opa.“ Wer oder was backt?"
                say: "Den Kuchen backt Opa. Wer oder was backt?"
                options: ["Den Kuchen", "Opa", "backt"]
                answer: "Opa"
                feedback:
                  "Den Kuchen": "„Den Kuchen“ steht vorn, aber er backt nicht. Wer backt? Opa. „Den Kuchen“ ist das Akkusativobjekt."
                hints:
                  - "Was vorn steht, ist nicht immer das Subjekt."
                  - "Wer backt den Kuchen?"
                  - "Opa."
              - id: l1-f5
                type: true_false
                text: "„Wir besuchen den Zoo.“ Ist „den Zoo“ das Akkusativobjekt?"
                say: "Wir besuchen den Zoo. Ist den Zoo das Akkusativobjekt?"
                answer: true
                hints:
                  - "Frag: Wen oder was besuchen wir?"
                  - "Die Antwort ist „den Zoo“."
                  - "Ja, „den Zoo“ ist das Akkusativobjekt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "„Ben trinkt einen Kakao.“ Wen oder was trinkt Ben?"
                say: "Ben trinkt einen Kakao. Wen oder was trinkt Ben?"
                options: ["Ben", "einen Kakao", "trinkt"]
                answer: "einen Kakao"
                hints: ["Stell die Frage mit dem Prädikat und dem Subjekt."]
              - id: l1-s2
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Akkusativobjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Akkusativobjekt gehören."
                show: { drawn: letter-card, text: "Oma strickt einen warmen Schal." }
                spans: ["einen", "warmen", "Schal"]
                hints: ["Frag: Wen oder was strickt Oma? Nimm alle Wörter der Antwort."]
              - id: l1-s3
                type: multiple_choice
                text: "„Der Hund sucht seinen Knochen.“ Was ist „Der Hund“?"
                say: "Der Hund sucht seinen Knochen. Ist der Hund das Subjekt oder das Akkusativobjekt?"
                options: ["Subjekt", "Akkusativobjekt"]
                answer: "Subjekt"
                hints: ["Frag: Wer oder was sucht?"]
              - id: l1-s4
                type: multiple_choice
                text: "„Die Blumen gießt meine Schwester.“ Wer oder was gießt?"
                say: "Die Blumen gießt meine Schwester. Wer oder was gießt?"
                options: ["Die Blumen", "meine Schwester", "gießt"]
                answer: "meine Schwester"
                hints: ["Gießen die Blumen etwas?"]
              - id: l1-s5
                type: true_false
                text: "„Das Pferd frisst Heu.“ Ist „Das Pferd“ das Akkusativobjekt?"
                say: "Das Pferd frisst Heu. Ist das Pferd das Akkusativobjekt?"
                answer: false
                hints: ["Wer frisst? Und was frisst es?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "„Tom schreibt einen Brief.“ Wen oder was schreibt Tom?"
                say: "Tom schreibt einen Brief. Wen oder was schreibt Tom?"
                options: ["schreibt", "Tom", "einen Brief"]
                answer: "einen Brief"
              - id: l1-n2
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Akkusativobjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Akkusativobjekt gehören."
                show: { drawn: letter-card, text: "Am Montag schreiben wir einen kurzen Test." }
                spans: ["einen", "kurzen", "Test"]
              - id: l1-n3
                type: multiple_choice
                text: "„Die Kinder bauen einen Schneemann.“ Was ist „einen Schneemann“?"
                say: "Die Kinder bauen einen Schneemann. Ist einen Schneemann das Subjekt oder das Akkusativobjekt?"
                options: ["Subjekt", "Akkusativobjekt"]
                answer: "Akkusativobjekt"
              - id: l1-n4
                type: multiple_choice
                text: "„Die Hausaufgaben macht Jonas nach dem Essen.“ Wer oder was macht die Hausaufgaben?"
                say: "Die Hausaufgaben macht Jonas nach dem Essen. Wer oder was macht die Hausaufgaben?"
                options: ["Jonas", "Die Hausaufgaben", "nach dem Essen"]
                answer: "Jonas"
              - id: l1-n5
                type: true_false
                text: "„Mein Onkel repariert das Fahrrad.“ Ist „das Fahrrad“ das Akkusativobjekt?"
                say: "Mein Onkel repariert das Fahrrad. Ist das Fahrrad das Akkusativobjekt?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "„Lisa kauft eine Brezel.“ Wen oder was kauft Lisa?"
            say: "Lisa kauft eine Brezel. Wen oder was kauft Lisa?"
            options: ["Lisa", "kauft", "eine Brezel"]
            answer: "eine Brezel"
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf alle Wörter des Akkusativobjekts."
            say: "Lies den Satz. Tippe auf alle Wörter, die zum Akkusativobjekt gehören."
            show: { drawn: letter-card, text: "Der Bauer füttert die hungrigen Schweine." }
            spans: ["die", "hungrigen", "Schweine"]
          - id: l1-c3
            type: multiple_choice
            text: "„Das Buch liest Anna gern.“ Wer oder was liest?"
            say: "Das Buch liest Anna gern. Wer oder was liest?"
            options: ["Anna", "Das Buch", "gern"]
            answer: "Anna"

  - n: 2
    title: { de: "Wem?", en: "To whom?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "„Paul fängt den Ball.“ Wen oder was fängt Paul?"
            say: "Paul fängt den Ball. Wen oder was fängt Paul?"
            options: ["den Ball", "Paul", "fängt"]
            answer: "den Ball"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "„Ich gebe dem Lehrer mein Heft.“ In welchem Fall steht „dem Lehrer“?"
            say: "Ich gebe dem Lehrer mein Heft. In welchem Fall steht dem Lehrer?"
            options: ["Dativ", "Akkusativ", "Nominativ"]
            answer: "Dativ"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lea hilft ihrem Bruder."
            say: "Manche Objekte findest du mit der Frage: Wem? Wem hilft Lea? Ihrem Bruder. Das ist das Dativobjekt."
          - text: "Tim schenkt seiner Mutter eine Blume."
            say: "Ein Satz kann beide Objekte haben. Wem schenkt Tim etwas? Seiner Mutter, das Dativobjekt. Wen oder was schenkt er? Eine Blume, das Akkusativobjekt."
          - text: "Wer oder was? · Wen oder was? · Wem?"
            say: "Merk dir die drei Fragen. Mit Wer oder was fragst du nach dem Subjekt. Mit Wen oder was fragst du nach dem Akkusativobjekt. Mit Wem fragst du nach dem Dativobjekt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "„Die Kinder danken der Lehrerin.“ Wem danken die Kinder?"
                say: "Die Kinder danken der Lehrerin. Wem danken die Kinder?"
                options: ["der Lehrerin", "Die Kinder", "danken"]
                answer: "der Lehrerin"
                hints:
                  - "Stell die Frage: Wem danken die Kinder?"
                  - "Die Kinder sagen Danke zu …"
                  - "der Lehrerin."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "„Ich gebe dem Hund einen Knochen.“ Mit welcher Frage findest du „dem Hund“?"
                say: "Ich gebe dem Hund einen Knochen. Mit welcher Frage findest du dem Hund?"
                options: ["Wem?", "Wen oder was?", "Wer oder was?"]
                answer: "Wem?"
                feedback:
                  "Wen oder was?": "Mit „Wen oder was?“ findest du „einen Knochen“. Nach „dem Hund“ fragst du mit „Wem?“: Wem gebe ich einen Knochen?"
                  "Wer oder was?": "Mit „Wer oder was?“ findest du das Subjekt. Wer gibt? Ich. Nach „dem Hund“ fragst du mit „Wem?“."
                hints:
                  - "Probier die Fragen aus."
                  - "Wem gebe ich einen Knochen?"
                  - "Wem?"
              - id: l2-f3
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Dativobjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Dativobjekt gehören."
                show: { drawn: letter-card, text: "Papa liest dem kleinen Baby vor." }
                spans: ["dem", "kleinen", "Baby"]
                hints:
                  - "Frag: Wem liest Papa vor?"
                  - "Die Antwort hat drei Wörter."
                  - "dem kleinen Baby."
              - id: l2-f4
                type: multiple_choice
                text: "„Der Opa erzählt den Enkeln eine Geschichte.“ Was ist „eine Geschichte“?"
                say: "Der Opa erzählt den Enkeln eine Geschichte. Ist eine Geschichte das Subjekt, das Akkusativobjekt oder das Dativobjekt?"
                options: ["Akkusativobjekt", "Dativobjekt", "Subjekt"]
                answer: "Akkusativobjekt"
                hints:
                  - "Frag: Wen oder was erzählt der Opa?"
                  - "Die Antwort ist „eine Geschichte“."
                  - "Akkusativobjekt."
              - id: l2-f5
                type: true_false
                text: "„Das Fahrrad gehört meinem Bruder.“ Ist „meinem Bruder“ das Dativobjekt?"
                say: "Das Fahrrad gehört meinem Bruder. Ist meinem Bruder das Dativobjekt?"
                answer: true
                hints:
                  - "Frag: Wem gehört das Fahrrad?"
                  - "Die Antwort ist „meinem Bruder“."
                  - "Ja, „meinem Bruder“ ist das Dativobjekt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "„Lukas hilft seiner Oma.“ Wem hilft Lukas?"
                say: "Lukas hilft seiner Oma. Wem hilft Lukas?"
                options: ["Lukas", "seiner Oma", "hilft"]
                answer: "seiner Oma"
                hints: ["Stell die Frage mit „Wem?“."]
              - id: l2-s2
                type: multiple_choice
                text: "„Mama kauft mir eine Mütze.“ Mit welcher Frage findest du „eine Mütze“?"
                say: "Mama kauft mir eine Mütze. Mit welcher Frage findest du eine Mütze?"
                options: ["Wer oder was?", "Wem?", "Wen oder was?"]
                answer: "Wen oder was?"
                hints: ["Probier jede Frage mit dem Satz aus."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Dativobjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Dativobjekt gehören."
                show: { drawn: letter-card, text: "Ich schreibe meiner besten Freundin eine Karte." }
                spans: ["meiner", "besten", "Freundin"]
                hints: ["Frag: Wem schreibe ich eine Karte?"]
              - id: l2-s4
                type: multiple_choice
                text: "„Die Ärztin gibt dem Kind eine Spritze.“ Was ist „dem Kind“?"
                say: "Die Ärztin gibt dem Kind eine Spritze. Ist dem Kind das Subjekt, das Akkusativobjekt oder das Dativobjekt?"
                options: ["Subjekt", "Akkusativobjekt", "Dativobjekt"]
                answer: "Dativobjekt"
                hints: ["Probier aus, mit welcher Frage du „dem Kind“ findest."]
              - id: l2-s5
                type: true_false
                text: "„Ich zeige dir mein Zimmer.“ Ist „mein Zimmer“ das Dativobjekt?"
                say: "Ich zeige dir mein Zimmer. Ist mein Zimmer das Dativobjekt?"
                answer: false
                hints: ["Frag einmal mit „Wem?“ und einmal mit „Wen oder was?“."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "„Der Clown winkt den Kindern.“ Wem winkt der Clown?"
                say: "Der Clown winkt den Kindern. Wem winkt der Clown?"
                options: ["den Kindern", "Der Clown", "winkt"]
                answer: "den Kindern"
              - id: l2-n2
                type: multiple_choice
                text: "„Wir bringen unserem Nachbarn die Post.“ Mit welcher Frage findest du „unserem Nachbarn“?"
                say: "Wir bringen unserem Nachbarn die Post. Mit welcher Frage findest du unserem Nachbarn?"
                options: ["Wen oder was?", "Wem?", "Wer oder was?"]
                answer: "Wem?"
              - id: l2-n3
                type: highlight_in_text
                text: "Tippe auf alle Wörter des Dativobjekts."
                say: "Lies den Satz. Tippe auf alle Wörter, die zum Dativobjekt gehören."
                show: { drawn: letter-card, text: "Die Kinder schenken ihrer Lehrerin einen Blumenstrauß." }
                spans: ["ihrer", "Lehrerin"]
              - id: l2-n4
                type: multiple_choice
                text: "„Der Kellner bringt dem Gast eine Suppe.“ Was ist „eine Suppe“?"
                say: "Der Kellner bringt dem Gast eine Suppe. Ist eine Suppe das Dativobjekt, das Akkusativobjekt oder das Subjekt?"
                options: ["Dativobjekt", "Akkusativobjekt", "Subjekt"]
                answer: "Akkusativobjekt"
              - id: l2-n5
                type: true_false
                text: "„Der Hund folgt seinem Herrchen.“ Ist „seinem Herrchen“ das Dativobjekt?"
                say: "Der Hund folgt seinem Herrchen. Ist seinem Herrchen das Dativobjekt?"
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "„Sara malt ein Bild.“ Wen oder was malt Sara?"
            say: "Sara malt ein Bild. Wen oder was malt Sara?"
            options: ["Sara", "ein Bild", "malt"]
            answer: "ein Bild"
          - id: l2-c2
            type: multiple_choice
            text: "„Die Mutter singt dem Baby ein Lied.“ Wem singt die Mutter ein Lied?"
            say: "Die Mutter singt dem Baby ein Lied. Wem singt die Mutter ein Lied?"
            options: ["ein Lied", "dem Baby", "Die Mutter"]
            answer: "dem Baby"
          - id: l2-c3
            type: highlight_in_text
            text: "Tippe auf alle Wörter des Akkusativobjekts."
            say: "Lies den Satz. Tippe auf alle Wörter, die zum Akkusativobjekt gehören."
            show: { drawn: letter-card, text: "Der Postbote bringt uns ein großes Paket." }
            spans: ["ein", "großes", "Paket"]
          - id: l2-c4
            type: multiple_choice
            text: "„Ich leihe meinem Freund meinen Roller.“ Mit welcher Frage findest du „meinem Freund“?"
            say: "Ich leihe meinem Freund meinen Roller. Mit welcher Frage findest du meinem Freund?"
            options: ["Wem?", "Wen oder was?", "Wer oder was?"]
            answer: "Wem?"
          - id: l2-c5
            type: multiple_choice
            text: "„Den Schlüssel gibt Tante Eva dem Nachbarn.“ Wer oder was gibt?"
            say: "Den Schlüssel gibt Tante Eva dem Nachbarn. Wer oder was gibt den Schlüssel?"
            options: ["Den Schlüssel", "Tante Eva", "dem Nachbarn"]
            answer: "Tante Eva"
