# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.describe
skill: lit-de.writing.describe
curriculum: de-DE
language: de
title:
  de: Genau beschreiben
  en: Describing precisely
summary: >
  Describing things, animals and people so that someone else can picture
  or find them, and writing a Steckbrief. Lesson 1 asks Farbe? Form?
  Größe? Woraus? Was ist besonders?, picks the sentence that helps find a
  lost thing, guesses a thing or an animal from its description and
  matches a picture to its description; lesson 2 reads and fills
  Steckbriefe about animals and children, sorts Stichwörter under their
  headings, keeps opinions out, and ends with the skill check. Writing
  the description freely waits for a free text task type.
metadata:
  year: klasse-2
  topic: { de: Beschreiben, en: Describing }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.adjectives.describe, lit-de.writing.words-to-pictures]
  also_practises: [lit-de.adjectives.describe]
  vocabulary: { de: [beschreiben, genau, Farbe, Form, Größe, Steckbrief, Aussehen, Nahrung, Lebensraum, Stichwort] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: vague-words
      what: Describes with words like schön, toll or super that fit anything, so no one can picture or find the thing
      addressed: "lesson 1 Learn sets schön against blau mit einem gelben Stern; every \"Welcher Satz hilft beim Suchen?\" task offers vague sentences (l1-f1 with feedback, l1-s1, l1-n1, l1-c1, l2-w1, l2-c1); l1-f5 and l1-n5 ask whether a vague sentence is enough"
    - id: opinion-in-profile
      what: Writes what they think or feel (Igel sind süß) or a whole story into a Steckbrief instead of facts as Stichwörter
      addressed: "lesson 2 Learn shows Stichwörter and sets braune Stacheln against Ich finde Igel süß; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c4 offer an opinion or a story; l2-f5 and l2-n5 ask about long sentences and opinions; l2-f3 and l2-n3 offer an opinion word in the gap"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "So sieht es aus", en: "What it looks like" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort sagt, wie etwas ist?"
            say: "Welches Wort sagt, wie etwas ist?"
            options: ["weich", "laufen", "Hund"]
            answer: "weich"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Bild an. Welcher Satz passt?"
            show: { object: snail }
            options: ["Die Schnecke kriecht langsam.", "Der Hund bellt laut.", "Die Ente schwimmt."]
            option_audio: false
            answer: "Die Schnecke kriecht langsam."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mein Rucksack ist schön.\nMein Rucksack ist blau und hat vorne einen gelben Stern."
            say: "Lena hat ihren Rucksack verloren. Welcher Satz hilft beim Suchen? Schön sagt nicht, wie er aussieht. Blau mit einem gelben Stern: Den findet man!"
          - text: "Farbe? | Form? | Größe? | Woraus? | Was ist besonders?"
            say: "Wenn du etwas beschreibst, stell dir diese Fragen. Welche Farbe hat es? Welche Form? Wie groß ist es? Woraus ist es gemacht? Und was ist besonders daran?"
          - text: "Die Katze ist grau und hat weiße Pfoten. Ihr Schwanz ist lang und buschig."
            say: "So beschreibst du ein Tier. Welche Farbe hat das Fell? Wie sehen die Pfoten aus? Wie ist der Schwanz? Je genauer, desto besser."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Tim hat seine Mütze verloren. Welcher Satz hilft beim Suchen am meisten?"
                say: "Tim hat seine Mütze verloren. Welcher Satz hilft beim Suchen am meisten?"
                options: ["Meine Mütze ist rot und hat einen weißen Bommel.", "Meine Mütze ist schön.", "Meine Mütze ist toll."]
                answer: "Meine Mütze ist rot und hat einen weißen Bommel."
                feedback:
                  "Meine Mütze ist schön.": "Schön kann jede Mütze sein. Sag, welche Farbe sie hat und was besonders ist."
                hints:
                  - "Welcher Satz sagt, wie die Mütze aussieht?"
                  - "Achte auf eine Farbe und etwas Besonderes."
                  - "Rot mit einem weißen Bommel."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Es ist rund und orange. Man kann es schälen. Innen ist es saftig. Was ist es?"
                say: "Hör zu und rate: Es ist rund und orange. Man kann es schälen. Innen ist es saftig. Was ist es?"
                options: [{ object: orange }, { object: apple }, { object: ball }]
                answer: orange
                hints:
                  - "Fang mit der Farbe an: Was ist orange?"
                  - "Einen Ball kann man nicht schälen."
                  - "Es ist die Orange."
              - id: l1-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Frage mit der passenden Antwort."
                pairs:
                  - { left: { text: "Farbe?" }, right: { text: "grün" } }
                  - { left: { text: "Form?" }, right: { text: "rund" } }
                  - { left: { text: "Woraus?" }, right: { text: "aus Holz" } }
                hints:
                  - "Lies jede Frage und such das Wort, das darauf antwortet."
                  - "Woraus fragt, woraus etwas gemacht ist."
                  - "Farbe: grün. Form: rund. Woraus: aus Holz."
              - id: l1-f4
                type: multiple_choice
                text: "Welche Beschreibung passt zum Bild?"
                say: "Schau dir das Tier an. Welche Beschreibung passt?"
                show: { object: giraffe }
                options: ["Sie hat einen sehr langen Hals und braune Flecken.", "Sie hat einen Rüssel und große Ohren.", "Sie hat schwarze und weiße Streifen."]
                answer: "Sie hat einen sehr langen Hals und braune Flecken."
                hints:
                  - "Schau genau hin: Was ist an diesem Tier besonders?"
                  - "Schau auf den Hals und auf das Fell."
                  - "Ein langer Hals und braune Flecken."
              - id: l1-f5
                type: true_false
                text: "Ben schreibt: „Mein Fahrrad ist toll.“ Weiß jetzt jeder, wie sein Fahrrad aussieht?"
                say: "Ben schreibt: Mein Fahrrad ist toll. Weiß jetzt jeder, wie sein Fahrrad aussieht?"
                answer: false
                hints:
                  - "Sagt toll etwas über die Farbe oder die Form?"
                  - "Toll kann jedes Fahrrad sein."
                  - "Nein, das weiß niemand."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ida sucht ihre Trinkflasche. Welcher Satz hilft beim Suchen am meisten?"
                say: "Ida sucht ihre Trinkflasche. Welcher Satz hilft beim Suchen am meisten?"
                options: ["Sie ist grün, aus Metall und hat einen Hasen-Aufkleber.", "Sie ist super.", "Sie gehört mir."]
                answer: "Sie ist grün, aus Metall und hat einen Hasen-Aufkleber."
                hints: ["Welcher Satz sagt, wie die Flasche aussieht?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Es ist rund und tickt. Zwei Zeiger zeigen, wie spät es ist. Was ist es?"
                say: "Hör zu und rate: Es ist rund und tickt. Zwei Zeiger zeigen, wie spät es ist. Was ist es?"
                options: [{ object: clock }, { object: ball }, { object: moon }]
                answer: clock
                hints: ["Was hat Zeiger?"]
              - id: l1-s3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Frage mit der passenden Antwort."
                pairs:
                  - { left: { text: "Größe?" }, right: { text: "so groß wie eine Hand" } }
                  - { left: { text: "Farbe?" }, right: { text: "dunkelblau" } }
                  - { left: { text: "Woraus?" }, right: { text: "aus Wolle" } }
                hints: ["Größe fragt, wie groß etwas ist."]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Beschreibung passt zum Bild?"
                say: "Schau dir das Tier an. Welche Beschreibung passt?"
                show: { object: zebra }
                options: ["Es hat schwarze und weiße Streifen.", "Es hat einen langen Rüssel.", "Es hat rote Federn."]
                answer: "Es hat schwarze und weiße Streifen."
                hints: ["Schau auf das Fell."]
              - id: l1-s5
                type: true_false
                text: "„Mein Hund hat ein braunes Fell und ein weißes Ohr.“ Ist das eine genaue Beschreibung?"
                say: "Mein Hund hat ein braunes Fell und ein weißes Ohr. Ist das eine genaue Beschreibung?"
                answer: true
                hints: ["Kannst du dir den Hund jetzt vorstellen?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Paul sucht seine Jacke. Welcher Satz hilft beim Suchen am meisten?"
                say: "Paul sucht seine Jacke. Welcher Satz hilft beim Suchen am meisten?"
                options: ["Sie ist gelb und hat eine Kapuze mit Ohren.", "Sie ist ganz neu.", "Ich mag sie sehr."]
                answer: "Sie ist gelb und hat eine Kapuze mit Ohren."
              - id: l1-n2
                type: image_multiple_choice
                text: "Es ist klein und hat lange Ohren. Sein Fell ist weich. Es hoppelt. Was ist es?"
                say: "Hör zu und rate: Es ist klein und hat lange Ohren. Sein Fell ist weich. Es hoppelt. Was ist es?"
                options: [{ object: rabbit }, { object: mouse }, { object: cat }]
                answer: rabbit
              - id: l1-n3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Frage mit der passenden Antwort."
                pairs:
                  - { left: { text: "Form?" }, right: { text: "eckig" } }
                  - { left: { text: "Woraus?" }, right: { text: "aus Glas" } }
                  - { left: { text: "Farbe?" }, right: { text: "silbern" } }
              - id: l1-n4
                type: multiple_choice
                text: "Welche Beschreibung passt zum Bild?"
                say: "Schau dir das Tier an. Welche Beschreibung passt?"
                show: { object: elephant }
                options: ["Er ist grau, riesig und hat einen langen Rüssel.", "Er ist klein und hat lange Ohren.", "Er ist grün und hüpft."]
                answer: "Er ist grau, riesig und hat einen langen Rüssel."
              - id: l1-n5
                type: true_false
                text: "„Mein Schlüssel ist schön.“ Ist das eine genaue Beschreibung?"
                say: "Mein Schlüssel ist schön. Ist das eine genaue Beschreibung?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Mila sucht ihr Federmäppchen. Welcher Satz hilft beim Suchen am meisten?"
            say: "Mila sucht ihr Federmäppchen. Welcher Satz hilft beim Suchen am meisten?"
            options: ["Es ist lila und hat einen Stern am Reißverschluss.", "Es ist cool.", "Es ist meins."]
            answer: "Es ist lila und hat einen Stern am Reißverschluss."
          - id: l1-c2
            type: image_multiple_choice
            text: "Es hat acht Arme und lebt im Meer. Was ist es?"
            say: "Hör zu und rate: Es hat acht Arme und lebt im Meer. Was ist es?"
            options: [{ object: octopus }, { object: fish }, { object: whale }]
            answer: octopus
          - id: l1-c3
            type: true_false
            text: "„Die Maus ist klein und grau und hat einen langen, dünnen Schwanz.“ Ist das eine genaue Beschreibung?"
            say: "Die Maus ist klein und grau und hat einen langen, dünnen Schwanz. Ist das eine genaue Beschreibung?"
            answer: true

  - n: 2
    title: { de: "Der Steckbrief", en: "The profile" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Satz beschreibt den Ball genau?"
            say: "Welcher Satz beschreibt den Ball genau?"
            options: ["Der Ball ist rot und hat weiße Punkte.", "Der Ball ist schön.", "Der Ball ist toll."]
            answer: "Der Ball ist rot und hat weiße Punkte."
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Es ist schwarz und weiß gefleckt, frisst Gras und gibt Milch. Was ist es?"
            say: "Hör zu und rate: Es ist schwarz und weiß gefleckt, frisst Gras und gibt Milch. Was ist es?"
            options: [{ object: cow }, { object: zebra }, { object: pig }]
            answer: cow
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Steckbrief: Igel\nAussehen: braune Stacheln, spitze Nase\nGröße: etwa 25 Zentimeter\nNahrung: Käfer, Würmer, Schnecken\nLebensraum: Garten, Hecke, Waldrand"
            say: "Das ist ein Steckbrief über den Igel. Ein Steckbrief ist kurz. Links steht, worum es geht. Rechts stehen nur Stichwörter, keine ganzen Sätze."
          - text: "Steckbrief: Lara\nAlter: 7 Jahre\nHaare: braun, lang\nAugen: grün\nHobbys: Reiten, Malen"
            say: "Auch über dich kannst du einen Steckbrief schreiben. Dann stehen darin dein Name, dein Alter, wie du aussiehst und was du gern machst."
          - text: "Aussehen: braune Stacheln\nAussehen: Ich finde Igel süß."
            say: "Pass auf: In einen Steckbrief schreibst du nur, was man sehen oder wissen kann. Was du süß oder toll findest, gehört nicht hinein."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Steckbrief: Igel. Was passt zusammen?"
                say: "Verbinde jede Zeile des Steckbriefs mit den passenden Stichwörtern."
                pairs:
                  - { left: { text: "Nahrung" }, right: { text: "Würmer, Käfer" } }
                  - { left: { text: "Lebensraum" }, right: { text: "Garten, Hecke" } }
                  - { left: { text: "Aussehen" }, right: { text: "braune Stacheln" } }
                hints:
                  - "Nahrung ist, was das Tier frisst. Lebensraum ist, wo es lebt."
                  - "Würmer frisst der Igel. Im Garten lebt er."
                  - "Nahrung: Würmer. Lebensraum: Garten. Aussehen: Stacheln."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was gehört in den Steckbrief über den Igel?"
                say: "Was gehört in den Steckbrief über den Igel?"
                options: ["spitze Nase", "Ich finde Igel süß.", "Igel sind die besten Tiere."]
                answer: "spitze Nase"
                feedback:
                  "Ich finde Igel süß.": "Das ist deine Meinung. In den Steckbrief kommt nur, was man sehen oder wissen kann."
                hints:
                  - "Ein Steckbrief sagt, wie etwas ist, nicht, was du davon hältst."
                  - "Was kann man am Igel sehen?"
                  - "spitze Nase."
              - id: l2-f3
                type: fill_in_blank
                text: "Steckbrief: Lara\nAlter: 7 Jahre\nHaare: braun, lang\n\nWas passt in die Lücke?"
                say: "Lies den Steckbrief. Was passt in die Lücke?"
                frame: "Augen: _"
                options: ["grün", "schön", "Reiten"]
                answer: ["grün"]
                feedback:
                  "Reiten": "Reiten ist ein Hobby. Bei Augen steht, welche Farbe sie haben."
                  "schön": "Schön ist deine Meinung. Bei Augen steht, welche Farbe sie haben."
                hints:
                  - "Was kann man über Augen sagen?"
                  - "Bei Augen steht ihre Farbe. Welches Wort ist eine Farbe?"
                  - "grün."
              - id: l2-f4
                type: sorting
                text: "Steckbrief: Eichhörnchen. Wohin gehört jedes Stichwort?"
                say: "Sortiere die Stichwörter: Aussehen oder Nahrung?"
                bins:
                  - { id: look, show: { text: "Aussehen" }, say: "Aussehen" }
                  - { id: food, show: { text: "Nahrung" }, say: "Nahrung" }
                options:
                  - { text: "rotbraunes Fell", bin: look }
                  - { text: "Nüsse", bin: food }
                  - { text: "buschiger Schwanz", bin: look }
                  - { text: "Samen", bin: food }
                hints:
                  - "Aussehen: Wie sieht es aus? Nahrung: Was frisst es?"
                  - "Was frisst ein Eichhörnchen: Nüsse oder Fell?"
                  - "Fell und Schwanz: Aussehen. Nüsse und Samen: Nahrung."
              - id: l2-f5
                type: true_false
                text: "In einen Steckbrief schreibst du lange Sätze. Stimmt das?"
                say: "In einen Steckbrief schreibst du lange Sätze. Stimmt das?"
                answer: false
                hints:
                  - "Denk an den Steckbrief über den Igel."
                  - "Da standen nur einzelne Wörter: Stichwörter."
                  - "Nein, das stimmt nicht."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Steckbrief: Can. Was passt zusammen?"
                say: "Verbinde jede Zeile des Steckbriefs mit den passenden Stichwörtern."
                pairs:
                  - { left: { text: "Alter" }, right: { text: "8 Jahre" } }
                  - { left: { text: "Hobbys" }, right: { text: "Fußball, Lesen" } }
                  - { left: { text: "Haare" }, right: { text: "blond, kurz" } }
                hints: ["Alter sagt, wie alt jemand ist."]
              - id: l2-s2
                type: multiple_choice
                text: "Was gehört in den Steckbrief über den Fuchs?"
                say: "Was gehört in den Steckbrief über den Fuchs?"
                options: ["rotes Fell, buschiger Schwanz", "Füchse sind gemein.", "Ich habe mal einen Fuchs gesehen."]
                answer: "rotes Fell, buschiger Schwanz"
                hints: ["Was kann man am Fuchs sehen?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Steckbrief: Marienkäfer\nNahrung: Blattläuse\n\nWas passt in die Lücke?"
                say: "Lies den Steckbrief. Was passt in die Lücke?"
                frame: "Aussehen: rot mit schwarzen _"
                options: ["Punkten", "Streifen", "Federn"]
                answer: ["Punkten"]
                hints: ["Stell dir einen Marienkäfer vor."]
              - id: l2-s4
                type: sorting
                text: "Steckbrief: Frosch. Wohin gehört jedes Stichwort?"
                say: "Sortiere die Stichwörter: Aussehen oder Lebensraum?"
                bins:
                  - { id: look, show: { text: "Aussehen" }, say: "Aussehen" }
                  - { id: home, show: { text: "Lebensraum" }, say: "Lebensraum" }
                options:
                  - { text: "grüne Haut", bin: look }
                  - { text: "Teich", bin: home }
                  - { text: "lange Hinterbeine", bin: look }
                  - { text: "Wiese", bin: home }
                hints: ["Lebensraum sagt, wo das Tier lebt."]
              - id: l2-s5
                type: true_false
                text: "In einem Steckbrief über dich steht, wie alt du bist. Stimmt das?"
                say: "In einem Steckbrief über dich steht, wie alt du bist. Stimmt das?"
                answer: true
                hints: ["Denk an den Steckbrief von Lara."]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "Steckbrief: Hund Bello. Was passt zusammen?"
                say: "Verbinde jede Zeile des Steckbriefs mit den passenden Stichwörtern."
                pairs:
                  - { left: { text: "Fell" }, right: { text: "schwarz, lockig" } }
                  - { left: { text: "Alter" }, right: { text: "3 Jahre" } }
                  - { left: { text: "Lieblingsfutter" }, right: { text: "Hundekuchen" } }
              - id: l2-n2
                type: multiple_choice
                text: "Was gehört in den Steckbrief über die Ente?"
                say: "Was gehört in den Steckbrief über die Ente?"
                options: ["gelber Schnabel, Schwimmfüße", "Enten sind lustig.", "Gestern habe ich Enten gefüttert."]
                answer: "gelber Schnabel, Schwimmfüße"
              - id: l2-n3
                type: fill_in_blank
                text: "Steckbrief: Tom\nAlter: 7 Jahre\nHaare: schwarz, kurz\n\nWas passt in die Lücke?"
                say: "Lies den Steckbrief. Was passt in die Lücke?"
                frame: "Hobbys: _"
                options: ["Schwimmen, Malen", "sehr nett", "blaue Augen"]
                answer: ["Schwimmen, Malen"]
              - id: l2-n4
                type: sorting
                text: "Steckbrief: Pferd. Wohin gehört jedes Stichwort?"
                say: "Sortiere die Stichwörter: Aussehen oder Nahrung?"
                bins:
                  - { id: look, show: { text: "Aussehen" }, say: "Aussehen" }
                  - { id: food, show: { text: "Nahrung" }, say: "Nahrung" }
                options:
                  - { text: "lange Mähne", bin: look }
                  - { text: "Heu", bin: food }
                  - { text: "Hufe", bin: look }
                  - { text: "Hafer", bin: food }
              - id: l2-n5
                type: true_false
                text: "Steckbrief: Katze\nAussehen: Katzen sind einfach toll.\n\nPasst das in den Steckbrief?"
                say: "Lies den Steckbrief. Passt das hinein?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Jan sucht seinen Turnbeutel. Welcher Satz hilft beim Suchen am meisten?"
            say: "Jan sucht seinen Turnbeutel. Welcher Satz hilft beim Suchen am meisten?"
            options: ["Er ist schwarz und hat einen roten Blitz.", "Er ist echt gut.", "Er gehört Jan."]
            answer: "Er ist schwarz und hat einen roten Blitz."
          - id: l2-c2
            type: image_multiple_choice
            text: "Es kriecht ganz langsam und trägt sein Haus auf dem Rücken. Was ist es?"
            say: "Hör zu und rate: Es kriecht ganz langsam und trägt sein Haus auf dem Rücken. Was ist es?"
            options: [{ object: snail }, { object: ant }, { object: frog }]
            answer: snail
          - id: l2-c3
            type: matching
            text: "Steckbrief: Kuh. Was gehört zusammen?"
            say: "Verbinde jede Zeile des Steckbriefs mit den passenden Stichwörtern."
            pairs:
              - { left: { text: "Nahrung" }, right: { text: "Gras, Heu" } }
              - { left: { text: "Aussehen" }, right: { text: "schwarz-weiße Flecken" } }
              - { left: { text: "Lebensraum" }, right: { text: "Weide, Stall" } }
          - id: l2-c4
            type: multiple_choice
            text: "Was gehört in den Steckbrief über den Hasen?"
            say: "Was gehört in den Steckbrief über den Hasen?"
            options: ["lange Ohren, weiches Fell", "Hasen sind süß.", "Ich will auch einen Hasen."]
            answer: "lange Ohren, weiches Fell"
          - id: l2-c5
            type: true_false
            text: "„Die Tasse ist weiß und hat einen blauen Henkel.“ Ist das eine genaue Beschreibung?"
            say: "Die Tasse ist weiß und hat einen blauen Henkel. Ist das eine genaue Beschreibung?"
            answer: true
