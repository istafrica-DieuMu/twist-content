# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.long-i
skill: lit-de.spelling.long-i
curriculum: de-DE
language: de
title:
  de: Das lange i
  en: The long i
summary: >
  A long i is mostly written ie. Lesson 1 hears long and short i (Biene,
  Fisch) and writes ie or i; lesson 2 learns the exceptions with a plain
  i (Igel, Tiger, Kino, mir, dir, wir) and with ih (ihr, ihm, ihn), and
  ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Kurze und lange Selbstlaute, en: Short and long vowels }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling.short-long-vowels]
  also_practises: [lit-de.spelling.short-long-vowels, lit-de.spelling-strategies.memory-words]
  vocabulary: { de: [langes i, ie, kurzes i, Ausnahme, Merkwort] }
  forms: [picture, text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: i-for-ie
      what: Writes a plain i for a long i (Brif, Bine)
      addressed: lesson 1 Learn shows Biene; an ie gap in every stage of lesson 1, and l1-f4 and l1-n4 show Brif and vir
    - id: ie-for-short-i
      what: Writes ie for a short i (Tiesch, Miette)
      addressed: lesson 1 Learn sets Fisch against Biene; every stage of lesson 1 has a short-i gap and a sorting or listening task by length; the exception choices in lesson 2 always offer a word with a short i
    - id: ie-in-exceptions
      what: Writes ie in the exceptions (Tieger, wier, Krokodiel)
      addressed: lesson 2 Learn lists the exceptions; every stage of lesson 2 has an exception choice, and l2-f4 and l2-n4 show Tieger and wier
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "ie oder i?", en: "ie or i?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Ist das i kurz oder lang?"
            say: "Hör zu. Ist das i kurz oder lang?"
            audio: { de: "Die Milch." }
            options: ["kurz", "lang"]
            keep_order: true
            answer: "kurz"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "tz oder z?"
            say: "Die Mütze. Was fehlt?"
            frame: "Mü_e"
            options: ["tz", "z"]
            answer: ["tz"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Biene"
            say: "Hör genau hin: Biene. Das i ist lang. Ein langes i schreibst du meistens ie."
            show: { object: bee }
          - text: "Fisch"
            say: "In Fisch ist das i kurz. Ein kurzes i schreibst du fast immer mit einem einfachen i."
            show: { object: fish }
          - text: "Stiefel | Dieb | Papier"
            say: "Stiefel, Dieb, Papier: Hörst du ein langes i, schreibst du meistens ie."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "ie oder i?"
                say: "Die Fliege. Was fehlt?"
                frame: "Fl_ge"
                options: ["ie", "i"]
                answer: ["ie"]
                hints:
                  - "Ist das i kurz oder lang?"
                  - "Es ist lang: Flie, ge."
                  - "Ein langes i schreibst du ie: Fliege."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "ie oder i?"
                say: "Der Tisch. Was fehlt?"
                show: { object: table }
                frame: "T_sch"
                options: ["i", "ie"]
                answer: ["i"]
                hints:
                  - "Ist das i kurz oder lang?"
                  - "Es ist kurz und schnell vorbei."
                  - "Ein kurzes i schreibst du i: Tisch."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Spiegel. Welches Wort ist richtig geschrieben?"
                show: { object: mirror }
                options: ["Spiegel", "Spigel", "Spiehgel"]
                answer: "Spiegel"
                option_audio: false
                hints:
                  - "Ist das i lang oder kurz?"
                  - "Es ist lang: Spie, gel."
                  - "Spiegel mit ie."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Der Brief. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Brif" }
                answer: false
                hints:
                  - "Ist das i in Brief lang?"
                  - "Ja. Wie schreibst du ein langes i?"
                  - "Nein. Richtig ist Brief mit ie."
              - id: l1-f5
                type: sorting
                text: "Langes oder kurzes i?"
                say: "Hör dir jedes Wort an. Hat es ein langes i wie Biene oder ein kurzes wie Fisch? Sortiere die Bilder."
                bins:
                  - { id: ie, show: { object: bee }, say: "Langes i, wie Biene." }
                  - { id: i, show: { object: fish }, say: "Kurzes i, wie Fisch." }
                options:
                  - { object: goat, bin: ie }
                  - { object: child, bin: i }
                  - { object: van, bin: ie }
                  - { object: box, bin: i }
                hints:
                  - "Hör bei jedem Wort auf das i."
                  - "Ziege und Lieferwagen haben ein langes i."
                  - "Lang: Ziege, Lieferwagen. Kurz: Kind, Kiste."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "ie oder i?"
                say: "Die Wiese. Was fehlt?"
                frame: "W_se"
                options: ["ie", "i"]
                answer: ["ie"]
                hints: ["Ist das i lang?"]
              - id: l1-s2
                type: fill_in_blank
                text: "ie oder i?"
                say: "Der Stift. Was fehlt?"
                frame: "St_ft"
                options: ["i", "ie"]
                answer: ["i"]
                hints: ["Ist das i kurz?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Sieben. Welches Wort ist richtig geschrieben?"
                options: ["sieben", "siben", "sihben"]
                answer: "sieben"
                option_audio: false
                hints: ["Das i ist lang: sie, ben."]
              - id: l1-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Der Riese. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Riese" }
                answer: true
                hints: ["Ist das i lang?"]
              - id: l1-s5
                type: audio_choice
                text: "Ist das i kurz oder lang?"
                say: "Hör zu. Ist das i kurz oder lang?"
                audio: { de: "Das Lied." }
                options: ["kurz", "lang"]
                keep_order: true
                answer: "lang"
                hints: ["Sprich das Wort langsam nach."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "ie oder i?"
                say: "Lieb. Was fehlt?"
                frame: "l_b"
                options: ["ie", "i"]
                answer: ["ie"]
              - id: l1-n2
                type: fill_in_blank
                text: "ie oder i?"
                say: "Die Mitte. Was fehlt?"
                frame: "M_tte"
                options: ["i", "ie"]
                answer: ["i"]
              - id: l1-n3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Das Tier. Welches Wort ist richtig geschrieben?"
                options: ["Tier", "Tir", "Tihr"]
                answer: "Tier"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Vier. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "vir" }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "Ist das i kurz oder lang?"
                say: "Hör zu. Ist das i kurz oder lang?"
                audio: { de: "Der Ring." }
                options: ["kurz", "lang"]
                keep_order: true
                answer: "kurz"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "ie oder i?"
            say: "Das Knie. Was fehlt?"
            frame: "Kn_"
            options: ["ie", "i"]
            answer: ["ie"]
          - id: l1-c2
            type: fill_in_blank
            text: "ie oder i?"
            say: "Die Brille. Was fehlt?"
            frame: "Br_lle"
            options: ["i", "ie"]
            answer: ["i"]
          - id: l1-c3
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Das Spiel. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Spiel" }
            answer: true

  - n: 2
    title: { de: "Ausnahmen", en: "Exceptions" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "ie oder i?"
            say: "Die Ziege. Was fehlt?"
            frame: "Z_ge"
            options: ["ie", "i"]
            answer: ["ie"]
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Ist das i kurz oder lang?"
            say: "Hör zu. Ist das i kurz oder lang?"
            audio: { de: "Der Pinsel." }
            options: ["kurz", "lang"]
            keep_order: true
            answer: "kurz"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Igel | Tiger | Kino | Krokodil | Kaninchen | Maschine | Kilo | Apfelsine"
            say: "Es gibt Ausnahmen: Igel, Tiger und Kino haben ein langes i, aber kein ie. Genauso Krokodil, Kaninchen, Maschine, Kilo und Apfelsine. Diese Merkwörter musst du dir merken."
            show: { object: hedgehog }
          - text: "mir | dir | wir"
            say: "Auch mir, dir und wir schreibst du nur mit i."
          - text: "ihr | ihm | ihn"
            say: "Bei ihr, ihm und ihn schreibst du ih. Auch das sind Merkwörter."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Das Krokodil. Welches Wort ist richtig geschrieben?"
                show: { object: crocodile }
                options: ["Krokodil", "Krokodiel", "Krokodihl"]
                answer: "Krokodil"
                option_audio: false
                hints:
                  - "Denk an die Merkwörter mit langem i."
                  - "Krokodil gehört zu Igel, Tiger und Kino. Wie schreibst du dort das lange i?"
                  - "Krokodil schreibst du mit einem einfachen i."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "i, ie oder ih?"
                say: "Dir. Was fehlt?"
                frame: "d_r"
                options: ["i", "ie", "ih"]
                answer: ["i"]
                hints:
                  - "Denk an die Merkwörter."
                  - "Dir gehört zu mir und wir. Wie schreibst du die?"
                  - "Nur i: dir."
              - id: l2-f3
                type: fill_in_blank
                text: "i, ie oder ih?"
                say: "Ihr. Was fehlt?"
                frame: "_r"
                options: ["Ih", "Ie", "I"]
                answer: ["Ih"]
                hints:
                  - "Denk an die Merkwörter."
                  - "Ihr gehört zu ihm und ihn. Welcher Buchstabe steht dort nach dem i?"
                  - "Ein h: Ihr."
              - id: l2-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Der Tiger. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Tieger" }
                answer: false
                hints:
                  - "Denk an die Merkwörter mit langem i."
                  - "Tiger gehört zu Igel und Kino. Wie schreibst du dort das lange i?"
                  - "Nein. Richtig ist Tiger, ohne e."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Wort ist eine Ausnahme ohne ie?"
                say: "Welches Wort hat ein langes i ohne ie?"
                options: ["das Kino", "das Kind", "die Biene"]
                answer: "das Kino"
                hints:
                  - "Hör zuerst: In welchen Wörtern ist das i lang?"
                  - "Lang ist es in Kino und Biene. Welches davon schreibt man ohne ie?"
                  - "Kino ist ein Merkwort: langes i ohne ie."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Das Kaninchen. Welches Wort ist richtig geschrieben?"
                options: ["Kaninchen", "Kanienchen", "Kanihnchen"]
                answer: "Kaninchen"
                option_audio: false
                hints: ["Kaninchen ist ein Merkwort wie Tiger und Kino."]
              - id: l2-s2
                type: fill_in_blank
                text: "i, ie oder ih?"
                say: "Mir. Was fehlt?"
                frame: "m_r"
                options: ["i", "ie", "ih"]
                answer: ["i"]
                hints: ["Mir schreibst du wie dir."]
              - id: l2-s3
                type: fill_in_blank
                text: "i, ie oder ih?"
                say: "Ihm. Was fehlt?"
                frame: "_m"
                options: ["Ih", "Ie", "I"]
                answer: ["Ih"]
                hints: ["Ihm schreibst du wie ihr."]
              - id: l2-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Der Igel. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Igel" }
                answer: true
                hints: ["Igel ist eine Ausnahme."]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Wort ist eine Ausnahme ohne ie?"
                say: "Welches Wort hat ein langes i ohne ie?"
                options: ["der Tiger", "die Kiste", "die Fliege"]
                answer: "der Tiger"
                hints: ["Welche Wörter haben ein langes i? Und welches davon ist ein Merkwort?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Die Maschine. Welches Wort ist richtig geschrieben?"
                options: ["Maschine", "Maschiene", "Maschihne"]
                answer: "Maschine"
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "i, ie oder ih?"
                say: "Ihn. Was fehlt?"
                frame: "_n"
                options: ["Ih", "Ie", "I"]
                answer: ["Ih"]
              - id: l2-n3
                type: fill_in_blank
                text: "i, ie oder ih?"
                say: "Die Liebe. Was fehlt?"
                frame: "L_be"
                options: ["ie", "i", "ih"]
                answer: ["ie"]
              - id: l2-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Wir. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "wier" }
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Welches Wort ist eine Ausnahme ohne ie?"
                say: "Welches Wort hat ein langes i ohne ie?"
                options: ["das Kilo", "der Ring", "das Tier"]
                answer: "das Kilo"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "i, ie oder ih?"
            say: "Das Ziel. Was fehlt?"
            frame: "Z_l"
            options: ["ie", "i", "ih"]
            answer: ["ie"]
          - id: l2-c2
            type: fill_in_blank
            text: "i oder ie?"
            say: "Der Wind. Was fehlt?"
            frame: "W_nd"
            options: ["i", "ie"]
            answer: ["i"]
          - id: l2-c3
            type: multiple_choice
            text: "Welches Wort ist eine Ausnahme ohne ie?"
            say: "Welches Wort hat ein langes i ohne ie?"
            options: ["die Apfelsine", "die Kirsche", "der Spiegel"]
            answer: "die Apfelsine"
          - id: l2-c4
            type: fill_in_blank
            text: "i, ie oder ih?"
            say: "Ihnen. Was fehlt?"
            frame: "_nen"
            options: ["Ih", "Ie", "I"]
            answer: ["Ih"]
          - id: l2-c5
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Der Tiger. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Tiger" }
            answer: true
