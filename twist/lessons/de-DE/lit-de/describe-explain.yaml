# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.describe-explain
skill: lit-de.speaking.describe-explain
curriculum: de-DE
language: de
title:
  de: Beschreiben und erklären
  en: Describing and explaining
summary: >
  Saying something so that a listener who cannot see it understands.
  Lesson 1 describes a thing, an animal or a person with Farbe, Form,
  Größe and what is special about it, and swaps vague words (das Ding,
  da drüben) for exact ones; lesson 2 explains a game or a way to do
  something step by step with zuerst, dann, danach and zum Schluss, finds
  the missing or the unneeded step, and ends with the skill check. The
  app cannot mark speech, so the child chooses, orders and checks
  descriptions and explanations; saying them aloud is practised with
  speak tasks and not marked.
metadata:
  year: klasse-2
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.speaking.tell]
  also_practises: [lit-de.speaking.tell]
  vocabulary: { de: [beschreiben, erklären, Farbe, Form, Größe, genau, zuerst, dann, danach, zum Schluss] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: vague-words
      what: Uses words the listener cannot picture (das Ding, so ein, da drüben) or gives only an opinion (schön, toll) instead of what it looks like
      addressed: "lesson 1 Learn sets das Ding against a description with Farbe, Form and Größe; every stage of lesson 1 asks which description says more (l1-f2 with feedback, l1-s2, l1-n2) or which word is too vague (l1-f4, l1-s4); skill check l2-c1"
    - id: steps-out-of-order
      what: Explains the steps in the order they come to mind, or leaves out a step the listener needs
      addressed: "lesson 2 Learn shows the order words and a missing step; every stage of lesson 2 has an ordering task (l2-f1, l2-s1, l2-n1, l2-c3) and a missing-step task (l2-f3 with feedback, l2-s3, l2-n3, l2-c4)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Genau beschreiben", en: "Describing exactly" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Leg die Sätze in die richtige Reihenfolge."
            say: "Ole erzählt von seinem Ausflug. Leg die Sätze in die richtige Reihenfolge."
            options: ["Dann haben wir Enten gefüttert.", "Am Morgen sind wir zum See gefahren.", "Am Abend waren wir müde und glücklich."]
            slot_count: 3
            answer: ["Am Morgen sind wir zum See gefahren.", "Dann haben wir Enten gefüttert.", "Am Abend waren wir müde und glücklich."]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welches Wort passt an den Anfang einer Erzählung?"
            options: ["Gestern", "Zum Schluss", "Danach"]
            answer: "Gestern"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ich habe so ein Ding verloren."
            say: "Lina sagt: Ich habe so ein Ding verloren. Kannst du ihr beim Suchen helfen? Nein. Du weißt ja gar nicht, was sie sucht. Wer beschreibt, muss genau sein."
            show: { object: pencil-case }
          - text: "Farbe? Form? Größe? Was ist besonders?"
            say: "Diese Fragen helfen dir beim Beschreiben. Welche Farbe hat es? Welche Form? Wie groß ist es? Was ist besonders daran?"
          - text: "Ich habe mein Mäppchen verloren. Es ist grün und so lang wie ein Lineal. Oben hat es einen Reißverschluss."
            say: "Jetzt sagt Lina: Ich habe mein Mäppchen verloren. Es ist grün und so lang wie ein Lineal. Oben hat es einen Reißverschluss. Jetzt können alle beim Suchen helfen."
            show: { object: pencil-case }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welches Tier ist gemeint?"
                say: "Hör gut zu. Es ist groß und grau. Es hat große Ohren und einen langen Rüssel. Welches Tier ist gemeint?"
                options: [{ object: elephant }, { object: mouse }, { object: giraffe }]
                answer: elephant
                hints:
                  - "Hör auf das, was besonders ist."
                  - "Welches Tier hat einen Rüssel?"
                  - "Der Elefant ist groß und grau und hat einen Rüssel."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Beschreibung hilft am meisten?"
                say: "Tom sucht seine Mütze. Welche Beschreibung hilft am meisten?"
                options: ["Meine Mütze ist rot und hat oben einen weißen Bommel.", "Meine Mütze ist sehr schön.", "Ich suche so ein Ding für den Kopf."]
                answer: "Meine Mütze ist rot und hat oben einen weißen Bommel."
                feedback:
                  "Meine Mütze ist sehr schön.": "Schön findet jeder etwas anderes. Welche Farbe hat die Mütze? Was ist besonders?"
                  "Ich suche so ein Ding für den Kopf.": "So ein Ding sagt nicht, was Tom sucht. Nenne das Wort und beschreibe es genau."
                hints:
                  - "Denk an die Fragen: Farbe? Form? Größe? Was ist besonders?"
                  - "In welcher Beschreibung stehen eine Farbe und etwas Besonderes?"
                  - "Rot mit einem weißen Bommel. Das hilft beim Suchen."
              - id: l1-f3
                type: multiple_choice
                text: "Emma: „Mein Ball ist rund und so groß wie eine Melone.“\n\nWas fehlt in der Beschreibung?"
                say: "Emma beschreibt ihren Ball: Mein Ball ist rund und so groß wie eine Melone. Was fehlt in der Beschreibung?"
                show: { object: ball, colour: blue }
                options: ["die Farbe", "die Form", "die Größe"]
                answer: "die Farbe"
                feedback:
                  "die Form": "Rund ist die Form. Die hat Emma gesagt."
                  "die Größe": "So groß wie eine Melone ist die Größe. Die hat Emma gesagt."
                hints:
                  - "Geh die Fragen durch: Farbe? Form? Größe?"
                  - "Rund ist die Form. So groß wie eine Melone ist die Größe."
                  - "Die Farbe fehlt. Der Ball ist blau."
              - id: l1-f4
                type: multiple_choice
                text: "Ben: „Mein Buch liegt da.“\n\nWelches Wort ist zu ungenau?"
                say: "Ben sagt: Mein Buch liegt da. Welches Wort ist zu ungenau?"
                options: ["da", "Buch", "liegt"]
                answer: "da"
                hints:
                  - "Welches Wort sagt nicht genau, wo das Buch ist?"
                  - "Da kann überall sein."
                  - "Da ist zu ungenau. Besser: Mein Buch liegt auf dem Tisch."
              - id: l1-f5
                type: true_false
                text: "Ist das eine gute Beschreibung?"
                say: "Hör gut zu. Meine Katze ist schwarz und hat weiße Pfoten. Sie ist klein und hat ein rotes Halsband. Ist das eine gute Beschreibung?"
                answer: true
                hints:
                  - "Kannst du dir die Katze gut vorstellen?"
                  - "Du weißt die Farbe, die Größe und was besonders ist."
                  - "Ja. Das ist eine gute Beschreibung."
              - id: l1-f6
                type: speak
                text: "Beschreibe den Apfel."
                say: "Beschreibe den Apfel. Sag die Farbe, die Form und die Größe. Zum Beispiel: Der Apfel ist rot, rund und so groß wie meine Faust."
                show: { object: apple }
                expected_text: "Der Apfel ist rot, rund und so groß wie meine Faust."
                hints:
                  - "Fang mit der Farbe an."
                  - "Dann die Form: rund oder eckig?"
                  - "Der Apfel ist rot, rund und so groß wie meine Faust."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Was ist gemeint?"
                say: "Hör gut zu. Es ist rund und gelb. Es steht am Himmel und macht es warm und hell. Was ist gemeint?"
                options: [{ object: sun }, { object: moon }, { object: banana }]
                answer: sun
                hints: ["Was ist warm und hell?"]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Beschreibung hilft am meisten?"
                say: "Mia sucht ihren Hund im Park. Welche Beschreibung hilft am meisten?"
                options: ["Mein Hund ist klein und braun und hat ein Ohr, das immer hochsteht.", "Mein Hund ist total süß.", "Mein Hund ist ein Hund."]
                answer: "Mein Hund ist klein und braun und hat ein Ohr, das immer hochsteht."
                hints: ["Welche Beschreibung sagt Größe, Farbe und was besonders ist?"]
              - id: l1-s3
                type: multiple_choice
                text: "Jonas: „Meine Tasse ist blau. Vorne ist ein Frosch drauf.“\n\nWas fehlt in der Beschreibung?"
                say: "Jonas beschreibt seine Tasse: Meine Tasse ist blau. Vorne ist ein Frosch drauf. Was fehlt in der Beschreibung?"
                show: { object: cup }
                options: ["die Größe", "die Farbe", "was besonders ist"]
                answer: "die Größe"
                hints: ["Blau ist die Farbe. Der Frosch ist besonders."]
              - id: l1-s4
                type: multiple_choice
                text: "Ella: „Gib mir mal das Dings.“\n\nWelches Wort ist zu ungenau?"
                say: "Ella sagt: Gib mir mal das Dings. Welches Wort ist zu ungenau?"
                options: ["Dings", "gib", "mir"]
                answer: "Dings"
                hints: ["Welches Wort sagt nicht, was Ella haben will?"]
              - id: l1-s5
                type: speak
                text: "Beschreibe den Drachen."
                say: "Beschreibe den Drachen. Sag die Farbe, die Form und was besonders ist. Zum Beispiel: Der Drachen ist bunt und hat die Form einer Raute. Er hat einen langen Schwanz."
                show: { object: kite }
                expected_text: "Der Drachen ist bunt und hat die Form einer Raute. Er hat einen langen Schwanz."
                hints: ["Denk an Farbe, Form und was besonders ist."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Welches Tier ist gemeint?"
                say: "Hör gut zu. Es ist klein und hat ein Haus auf dem Rücken. Es kriecht ganz langsam. Welches Tier ist gemeint?"
                options: [{ object: snail }, { object: hedgehog }, { object: ant }]
                answer: snail
              - id: l1-n2
                type: multiple_choice
                text: "Welche Beschreibung hilft am meisten?"
                say: "Paul hat seine Jacke in der Turnhalle vergessen. Welche Beschreibung hilft am meisten?"
                options: ["Meine Jacke ist dunkelblau und hat eine gelbe Kapuze.", "Meine Jacke ist cool.", "Ich habe da was vergessen."]
                answer: "Meine Jacke ist dunkelblau und hat eine gelbe Kapuze."
              - id: l1-n3
                type: multiple_choice
                text: "Lea: „Meine Schultasche ist groß und eckig.“\n\nWas fehlt in der Beschreibung?"
                say: "Lea beschreibt ihre Schultasche: Sie ist groß und eckig. Was fehlt in der Beschreibung?"
                show: { object: schoolbag }
                options: ["die Farbe", "die Größe", "die Form"]
                answer: "die Farbe"
              - id: l1-n4
                type: true_false
                text: "Ist das eine gute Beschreibung?"
                say: "Hör gut zu. Mein Fahrrad ist toll. Ist das eine gute Beschreibung?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Welcher Satz sagt genau, wo der Schlüssel liegt?"
                options: ["Der Schlüssel liegt im Flur auf dem Schrank.", "Der Schlüssel liegt irgendwo dort.", "Der Schlüssel liegt da drüben."]
                answer: "Der Schlüssel liegt im Flur auf dem Schrank."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was ist gemeint?"
            say: "Hör gut zu. Es ist lang und gelb und ein bisschen krumm. Man kann es schälen und essen. Was ist gemeint?"
            options: [{ object: banana }, { object: carrot }, { object: apple }]
            answer: banana
          - id: l1-c2
            type: multiple_choice
            text: "Ali: „Stell das Ding bitte weg.“\n\nWelches Wort ist zu ungenau?"
            say: "Ali sagt: Stell das Ding bitte weg. Welches Wort ist zu ungenau?"
            options: ["Ding", "stell", "bitte"]
            answer: "Ding"
          - id: l1-c3
            type: multiple_choice
            text: "Welche Beschreibung hilft am meisten?"
            say: "Nele sucht ihren Teddy. Welche Beschreibung hilft am meisten?"
            options: ["Mein Teddy ist hellbraun und hat eine rote Schleife.", "Mein Teddy ist lieb.", "Ich suche so was Weiches."]
            answer: "Mein Teddy ist hellbraun und hat eine rote Schleife."

  - n: 2
    title: { de: "Schritt für Schritt erklären", en: "Explaining step by step" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Can: „Meine Trinkflasche ist rot und so groß wie meine Hand.“\n\nWas fehlt in der Beschreibung?"
            say: "Can beschreibt seine Trinkflasche: Sie ist rot und so groß wie meine Hand. Was fehlt in der Beschreibung?"
            options: ["was besonders ist", "die Farbe", "die Größe"]
            answer: "was besonders ist"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Welches Tier ist gemeint?"
            say: "Hör gut zu. Es ist grün und hüpft. Es lebt am Teich und quakt. Welches Tier ist gemeint?"
            options: [{ object: frog }, { object: duck }, { object: fish }]
            answer: frog
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "zuerst | dann | danach | zum Schluss"
            say: "Wenn du erklärst, wie etwas geht, sagst du die Schritte in der richtigen Reihenfolge. Diese Wörter helfen dir: zuerst, dann, danach und zum Schluss."
          - text: "Zähne putzen\nZuerst machst du Zahnpasta auf die Bürste.\nDann putzt du alle Zähne.\nDanach spülst du den Mund aus.\nZum Schluss wäschst du die Bürste ab."
            say: "So erklärt Mia das Zähneputzen. Jeder Schritt kommt dran, einer nach dem anderen. Wer zuhört, kann es gleich nachmachen."
          - text: "Zuerst machst du Zahnpasta auf die Bürste.\nZum Schluss wäschst du die Bürste ab."
            say: "Hier fehlt etwas. Wo bleibt das Putzen? Wer erklärt, darf keinen Schritt vergessen. Frag dich am Ende: Kann jemand das jetzt nachmachen?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Händewaschen: Bring die Schritte in die richtige Reihenfolge."
                say: "Ole erklärt, wie man sich die Hände wäscht. Bring die Schritte in die richtige Reihenfolge."
                options: ["Dann seifst du die Hände ein.", "Zum Schluss trocknest du die Hände ab.", "Zuerst machst du die Hände nass.", "Danach spülst du die Seife ab."]
                slot_count: 4
                answer: ["Zuerst machst du die Hände nass.", "Dann seifst du die Hände ein.", "Danach spülst du die Seife ab.", "Zum Schluss trocknest du die Hände ab."]
                hints:
                  - "Achte auf die Wörter zuerst, dann, danach und zum Schluss."
                  - "Was machst du, bevor du Seife nimmst?"
                  - "Nass machen, einseifen, abspülen, abtrocknen."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welches Wort passt in die Lücke?"
                say: "Lina erklärt ein Spiel. Welches Wort passt in die Lücke?"
                frame: "Zuerst stellen sich alle in einen Kreis. _ wirft ein Kind den Ball."
                options: ["Dann", "Zuerst", "Zum Schluss"]
                answer: ["Dann"]
                feedback:
                  "Zum Schluss": "Zum Schluss sagst du beim letzten Schritt. Hier geht es gerade erst los."
                hints:
                  - "Der erste Schritt war schon. Jetzt kommt der zweite."
                  - "Welches Wort sagst du beim nächsten Schritt?"
                  - "Dann wirft ein Kind den Ball."
              - id: l2-f3
                type: multiple_choice
                text: "Kakao machen\n1. Zuerst nimmst du eine Tasse.\n2. Dann rührst du gut um.\n3. Zum Schluss trinkst du den Kakao.\n\nWelcher Schritt fehlt?"
                say: "Tom erklärt, wie man einen Kakao macht: Zuerst nimmst du eine Tasse. Dann rührst du gut um. Zum Schluss trinkst du den Kakao. Welcher Schritt fehlt?"
                options: ["Milch und Kakaopulver in die Tasse geben", "die Tasse spülen", "einen Teller holen"]
                answer: "Milch und Kakaopulver in die Tasse geben"
                feedback:
                  "die Tasse spülen": "Spülen kannst du hinterher. Aber was muss in die Tasse, bevor du umrühren kannst?"
                hints:
                  - "Kann man in einer leeren Tasse umrühren?"
                  - "Was fehlt zwischen Tasse nehmen und umrühren?"
                  - "Milch und Kakaopulver in die Tasse geben."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Satz gehört nicht zur Erklärung?"
                say: "Mia erklärt, wie man einen Turm aus Bausteinen baut. Welcher Satz gehört nicht dazu?"
                options: ["Mein Bruder hat rote Haare.", "Zuerst legst du einen großen Stein hin.", "Dann setzt du einen kleineren darauf."]
                answer: "Mein Bruder hat rote Haare."
                hints:
                  - "Welcher Satz hilft nicht beim Bauen?"
                  - "Was hat der Bruder mit dem Turm zu tun?"
                  - "Mein Bruder hat rote Haare gehört nicht dazu."
              - id: l2-f5
                type: true_false
                text: "Kann man das nachmachen?"
                say: "Hör gut zu. Ben erklärt das Spiel Stille Post: Zuerst sitzen alle im Kreis. Dann flüstert ein Kind dem Nachbarn ein Wort ins Ohr. Danach flüstert der Nachbar es weiter. Zum Schluss sagt das letzte Kind das Wort laut. Kann man das Spiel jetzt nachmachen?"
                answer: true
                hints:
                  - "Sind alle Schritte da? Stimmt die Reihenfolge?"
                  - "Ben hat zuerst, dann, danach und zum Schluss gesagt."
                  - "Ja. Man kann das Spiel nachmachen."
              - id: l2-f6
                type: speak
                text: "Erkläre, wie man sich die Schuhe anzieht."
                say: "Erkläre, wie man sich die Schuhe anzieht. Zum Beispiel: Zuerst machst du die Schuhe auf. Dann steckst du den Fuß hinein. Zum Schluss machst du die Schuhe zu."
                show: { object: shoe }
                expected_text: "Zuerst machst du die Schuhe auf. Dann steckst du den Fuß hinein. Zum Schluss machst du die Schuhe zu."
                hints:
                  - "Fang mit zuerst an."
                  - "Was kommt dann? Was kommt zum Schluss?"
                  - "Zuerst aufmachen, dann den Fuß hinein, zum Schluss zumachen."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Blumen gießen: Bring die Schritte in die richtige Reihenfolge."
                say: "Emma erklärt, wie man Blumen gießt. Bring die Schritte in die richtige Reihenfolge."
                options: ["Dann trägst du die Kanne zur Blume.", "Zuerst füllst du die Gießkanne mit Wasser.", "Zum Schluss stellst du die Kanne weg.", "Danach gießt du die Blume."]
                slot_count: 4
                answer: ["Zuerst füllst du die Gießkanne mit Wasser.", "Dann trägst du die Kanne zur Blume.", "Danach gießt du die Blume.", "Zum Schluss stellst du die Kanne weg."]
                hints: ["Ohne Wasser in der Kanne kannst du nicht gießen."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welches Wort passt in die Lücke?"
                say: "Jonas erklärt, wie man ein Brot schmiert. Welches Wort passt in die Lücke?"
                frame: "Zuerst nimmst du eine Scheibe Brot. Dann streichst du Butter darauf. _ legst du Käse darauf."
                options: ["Zum Schluss", "Zuerst", "Gestern"]
                answer: ["Zum Schluss"]
                hints: ["Es ist der letzte Schritt."]
              - id: l2-s3
                type: multiple_choice
                text: "Einen Brief verschicken\n1. Zuerst schreibst du den Brief.\n2. Dann steckst du ihn in einen Umschlag.\n3. Zum Schluss wirfst du ihn in den Briefkasten.\n\nWelcher Schritt fehlt?"
                say: "Can erklärt, wie man einen Brief verschickt: Zuerst schreibst du den Brief. Dann steckst du ihn in einen Umschlag. Zum Schluss wirfst du ihn in den Briefkasten. Welcher Schritt fehlt?"
                options: ["eine Briefmarke aufkleben", "den Brief vorlesen", "einen Stift kaufen"]
                answer: "eine Briefmarke aufkleben"
                hints: ["Was braucht ein Brief, bevor er in den Briefkasten darf?"]
              - id: l2-s4
                type: true_false
                text: "Kann man das nachmachen?"
                say: "Hör gut zu. Lea erklärt, wie man ein Bild malt: Zum Schluss malst du den Himmel blau an. Zuerst nimmst du ein Blatt. Ich mag Blau. Kann man das gut nachmachen?"
                answer: false
                hints: ["Stimmt die Reihenfolge? Gehört jeder Satz dazu?"]
              - id: l2-s5
                type: multiple_choice
                text: "Was fragst du dich am Ende einer Erklärung?"
                options: ["Kann jemand das jetzt nachmachen?", "Habe ich schnell genug gesprochen?", "War meine Erklärung lang?"]
                answer: "Kann jemand das jetzt nachmachen?"
                hints: ["Wozu erklärst du etwas?"]
              - id: l2-s6
                type: speak
                text: "Erkläre, wie man einen Ball fängt."
                say: "Erkläre einem kleinen Kind, wie man einen Ball fängt. Zum Beispiel: Zuerst schaust du auf den Ball. Dann streckst du die Arme aus. Zum Schluss hältst du ihn mit beiden Händen fest."
                show: { object: ball }
                expected_text: "Zuerst schaust du auf den Ball. Dann streckst du die Arme aus. Zum Schluss hältst du ihn mit beiden Händen fest."
                hints: ["Nimm die Wörter zuerst, dann und zum Schluss."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Einen Luftballon aufblasen: Bring die Schritte in die richtige Reihenfolge."
                say: "Ali erklärt, wie man einen Luftballon aufbläst. Bring die Schritte in die richtige Reihenfolge."
                options: ["Zum Schluss machst du einen Knoten hinein.", "Zuerst nimmst du den Luftballon in die Hand.", "Dann bläst du Luft hinein."]
                slot_count: 3
                answer: ["Zuerst nimmst du den Luftballon in die Hand.", "Dann bläst du Luft hinein.", "Zum Schluss machst du einen Knoten hinein."]
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Satz gehört nicht zur Erklärung?"
                say: "Nele erklärt, wie man einen Papierflieger faltet. Welcher Satz gehört nicht dazu?"
                options: ["Gestern hat es geregnet.", "Zuerst faltest du das Blatt in der Mitte.", "Dann knickst du die Ecken nach innen."]
                answer: "Gestern hat es geregnet."
              - id: l2-n3
                type: multiple_choice
                text: "Nudeln kochen\n1. Zuerst füllst du einen Topf mit Wasser.\n2. Dann gibst du die Nudeln hinein.\n3. Zum Schluss gießt du das Wasser ab.\n\nWelcher Schritt fehlt?"
                say: "Paul erklärt, wie man Nudeln kocht: Zuerst füllst du einen Topf mit Wasser. Dann gibst du die Nudeln hinein. Zum Schluss gießt du das Wasser ab. Welcher Schritt fehlt?"
                options: ["das Wasser zum Kochen bringen", "den Tisch decken", "die Nudeln kaufen gehen"]
                answer: "das Wasser zum Kochen bringen"
