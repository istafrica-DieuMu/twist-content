# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.conversation-rules
skill: lit-de.speaking.conversation-rules
curriculum: de-DE
language: de
title:
  de: Gesprächsregeln
  en: Rules for talking together
summary: >
  The rules of a good conversation and how to spot them. Lesson 1 learns
  the rules (zuhören, ausreden lassen, nacheinander sprechen, freundlich
  bleiben) and finds the rule a speaker breaks in short scenes from class
  and the Klassenrat; lesson 2 responds to what others said (zustimmen,
  widersprechen, nachfragen, an eine Idee anknüpfen), tells a reply that
  responds from one that changes the topic, and ends with the skill check.
  The speak tasks run as the record-and-compare fallback and are never
  scored; every scene is written for Twist.
metadata:
  year: klasse-3
  topic: { de: Gespräche führen, en: Having conversations }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.speaking.listen-understand]
  also_practises: [lit-de.speaking.listen-understand]
  vocabulary: { de: [Gesprächsregel, zuhören, ausreden lassen, sich melden, eingehen, zustimmen, widersprechen, nachfragen, Klassenrat] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: rules-are-silence
      what: Thinks a good listener just keeps quiet, and that a reply on any topic counts as taking part
      addressed: "lesson 2 Learn shows replies that pick up what was said; l2-f1, l2-s1, l2-n1 and l2-c3 offer a reply that changes the topic, with feedback on l2-f1"
    - id: rude-disagreement
      what: Thinks disagreeing breaks the rules, or disagrees by putting the other person down
      addressed: "l1-f4, l2-f3, l2-s3 and l2-n3 tell a friendly disagreement from an unfriendly one; feedback on l2-f3 names the put-down"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Regeln für gute Gespräche", en: "Rules for good conversations" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Du hast etwas nicht verstanden. Was kannst du sagen?"
            say: "Du hast etwas nicht verstanden. Was kannst du sagen?"
            options: ["Kannst du das bitte noch einmal erklären?", "Das ist langweilig.", "Ich weiß schon alles."]
            answer: "Kannst du das bitte noch einmal erklären?"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Lena erzählt. Woran merkst du, dass Tim gut zuhört?"
            say: "Lena erzählt. Woran merkst du, dass Tim gut zuhört?"
            options: ["Er schaut Lena an.", "Er malt in sein Heft.", "Er flüstert mit seinem Nachbarn."]
            answer: "Er schaut Lena an."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Wir hören einander zu.\nWir lassen andere ausreden.\nWir sprechen nacheinander.\nWir bleiben freundlich."
            say: "Damit ein Gespräch gelingt, gibt es Gesprächsregeln. Wir hören zu, wir lassen andere ausreden, wir sprechen nacheinander, und wir bleiben freundlich, auch wenn wir anderer Meinung sind."
          - text: "Lina: Ich finde, wir sollten in der Pause …\nJonas: Fußball! Wir spielen Fußball!"
            say: "Hier bricht Jonas eine Regel. Lina ist noch nicht fertig, und Jonas ruft dazwischen. Er lässt Lina nicht ausreden."
          - text: "Lina: Ich finde, wir sollten in der Pause Seil springen.\nJonas: Darf ich auch etwas sagen? Ich spiele lieber Fußball."
            say: "So ist es besser. Jonas wartet, bis Lina fertig ist. Dann meldet er sich und sagt freundlich seine Meinung."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Frau Berg erklärt die Hausaufgabe. Emre spielt dabei mit seinem Radiergummi und schaut aus dem Fenster.\n\nWelche Regel vergisst Emre?"
                say: "Lies, was passiert. Welche Regel vergisst Emre?"
                options: ["zuhören", "ausreden lassen", "freundlich bleiben"]
                answer: "zuhören"
                hints:
                  - "Was macht Emre, während Frau Berg spricht?"
                  - "Er schaut aus dem Fenster. Hört er dann wirklich zu?"
                  - "Emre hört nicht zu."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Mia: Mein Hund heißt Bruno, und er …\nBen: Ich hab auch einen Hund!\n\nLässt Ben Mia ausreden?"
                say: "Lies das Gespräch. Lässt Ben Mia ausreden?"
                answer: false
                hints:
                  - "Ist Mia mit ihrem Satz fertig?"
                  - "Die drei Punkte zeigen: Mia wollte noch weitersprechen."
                  - "Nein. Ben ruft dazwischen."
              - id: l1-f3
                type: sorting
                text: "Hält sich das Kind an die Gesprächsregeln?"
                say: "Sortiere: Hält sich das Kind an die Gesprächsregeln oder nicht?"
                bins:
                  - { id: keeps, show: { text: "hält sich daran" }, say: "hält sich daran" }
                  - { id: breaks, show: { text: "hält sich nicht daran" }, say: "hält sich nicht daran" }
                options:
                  - { text: "Ella meldet sich und wartet.", bin: keeps }
                  - { text: "Finn ruft einfach rein.", bin: breaks }
                  - { text: "Aylin schaut den Sprecher an.", bin: keeps }
                  - { text: "Noah lacht ein anderes Kind aus.", bin: breaks }
                option_audio: false
                hints:
                  - "Denk an die vier Regeln: zuhören, ausreden lassen, nacheinander sprechen, freundlich bleiben."
                  - "Wer reinruft, spricht nicht nacheinander. Wer andere auslacht, ist nicht freundlich."
                  - "Ella und Aylin halten sich daran, Finn und Noah nicht."
              - id: l1-f4
                type: multiple_choice
                text: "Im Klassenrat sagt Paula: „Ich möchte, dass wir einen Tag ohne Hausaufgaben haben.“\n\nWelche Antwort widerspricht freundlich?"
                say: "Lies, was Paula sagt. Welche Antwort widerspricht freundlich?"
                options: ["Ich verstehe dich. Aber ich übe gern zu Hause.", "So ein Quatsch, Paula!", "Du bist doch nur faul."]
                answer: "Ich verstehe dich. Aber ich übe gern zu Hause."
                feedback:
                  "So ein Quatsch, Paula!": "Du darfst anderer Meinung sein. Aber so ist es unfreundlich."
                hints:
                  - "Man darf anderer Meinung sein. Es kommt darauf an, wie man es sagt."
                  - "Welcher Satz zeigt, dass man Paula verstanden hat?"
                  - "Ich verstehe dich. Aber ich übe gern zu Hause."
              - id: l1-f5
                type: speak
                text: "Darf ich auch etwas sagen?"
                say: "Du möchtest im Gespräch etwas sagen. Sag den Satz freundlich und deutlich. Dann hörst du dich und das Vorbild."
                expected_text: "Darf ich auch etwas sagen?"
                hints:
                  - "Sprich ruhig und freundlich."
                  - "Am Ende ist es eine Frage. Die Stimme geht nach oben."
                  - "Hör das Vorbild an und sag es noch einmal."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Im Sitzkreis reden alle gleichzeitig. Keiner versteht etwas.\n\nWelche Regel hilft?"
                say: "Lies, was passiert. Welche Regel hilft?"
                options: ["nacheinander sprechen", "lauter rufen", "freundlich bleiben"]
                answer: "nacheinander sprechen"
                hints: ["Was ist das Problem, wenn alle gleichzeitig reden?"]
              - id: l1-s2
                type: true_false
                text: "Herr Brandt: Wer weiß, wie viele Beine eine Spinne hat?\nJana meldet sich und wartet, bis sie drankommt.\n\nHält sich Jana an die Regeln?"
                say: "Lies, was passiert. Hält sich Jana an die Regeln?"
                answer: true
                hints: ["Ruft Jana rein, oder wartet sie?"]
              - id: l1-s3
                type: sorting
                text: "Hält sich das Kind an die Gesprächsregeln?"
                say: "Sortiere: Hält sich das Kind an die Gesprächsregeln oder nicht?"
                bins:
                  - { id: keeps, show: { text: "hält sich daran" }, say: "hält sich daran" }
                  - { id: breaks, show: { text: "hält sich nicht daran" }, say: "hält sich nicht daran" }
                options:
                  - { text: "Leo fragt nach, als er etwas nicht versteht.", bin: keeps }
                  - { text: "Mila tuschelt mit ihrer Freundin.", bin: breaks }
                  - { text: "Tom wartet, bis Ida fertig ist.", bin: keeps }
                  - { text: "Sara dreht sich weg und gähnt laut.", bin: breaks }
                option_audio: false
                hints: ["Wer hört zu, und wer stört?"]
              - id: l1-s4
                type: multiple_choice
                text: "Im Klassenrat sagt Kemal: „Ich möchte, dass wir unser Klassenzimmer grün streichen.“\n\nWelche Antwort widerspricht freundlich?"
                say: "Lies, was Kemal sagt. Welche Antwort widerspricht freundlich?"
                options: ["Ich verstehe dich, aber mir gefällt Gelb besser.", "Grün ist hässlich, Kemal.", "Das ist die blödeste Idee von allen."]
                answer: "Ich verstehe dich, aber mir gefällt Gelb besser."
                hints: ["Wer sagt seine eigene Meinung, ohne Kemal schlechtzumachen?"]
              - id: l1-s5
                type: speak
                text: "Kannst du das bitte noch einmal sagen?"
                say: "Du hast etwas nicht verstanden. Frag freundlich nach. Dann hörst du dich und das Vorbild."
                expected_text: "Kannst du das bitte noch einmal sagen?"
                hints: ["Vergiss das Wort bitte nicht."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Lotta erzählt von ihrem Urlaub. Als sie fertig ist, sagt Max: „Das war aber langweilig!“\n\nWelche Regel bricht Max?"
                say: "Lies, was passiert. Welche Regel bricht Max?"
                options: ["freundlich bleiben", "ausreden lassen", "zuhören"]
                answer: "freundlich bleiben"
              - id: l1-n2
                type: true_false
                text: "Oskar: Ich glaube, die Pflanze braucht mehr Licht, weil …\nNele: Nein, Wasser! Die braucht Wasser!\n\nLässt Nele Oskar ausreden?"
                say: "Lies das Gespräch. Lässt Nele Oskar ausreden?"
                answer: false
              - id: l1-n3
                type: sorting
                text: "Hält sich das Kind an die Gesprächsregeln?"
                say: "Sortiere: Hält sich das Kind an die Gesprächsregeln oder nicht?"
                bins:
                  - { id: keeps, show: { text: "hält sich daran" }, say: "hält sich daran" }
                  - { id: breaks, show: { text: "hält sich nicht daran" }, say: "hält sich nicht daran" }
                options:
                  - { text: "Luis nickt, während Anna spricht.", bin: keeps }
                  - { text: "Elif spricht mitten in Pauls Satz hinein.", bin: breaks }
                  - { text: "Jakob sagt: „Ich sehe das anders, weil …“", bin: keeps }
                  - { text: "Hanna spielt mit ihrem Handy.", bin: breaks }
                option_audio: false
              - id: l1-n4
                type: multiple_choice
                text: "Warum lässt man andere ausreden?"
                say: "Warum lässt man andere ausreden?"
                options: ["Damit man versteht, was sie meinen.", "Damit man selbst nichts sagen muss.", "Damit das Gespräch länger dauert."]
                answer: "Damit man versteht, was sie meinen."
              - id: l1-n5
                type: multiple_choice
                text: "Im Klassenrat wollen fünf Kinder gleichzeitig etwas sagen. Was ist gut?"
                say: "Im Klassenrat wollen fünf Kinder gleichzeitig etwas sagen. Was ist gut?"
                options: ["Sie melden sich, und die Gesprächsleitung nimmt sie nacheinander dran.", "Wer am lautesten ruft, darf zuerst.", "Alle reden gleichzeitig, dann geht es schneller."]
                answer: "Sie melden sich, und die Gesprächsleitung nimmt sie nacheinander dran."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Während Ole etwas vorliest, flüstert Emma mit ihrer Nachbarin.\n\nWelche Regel vergisst Emma?"
            say: "Lies, was passiert. Welche Regel vergisst Emma?"
            options: ["zuhören", "freundlich bleiben", "sich melden"]
            answer: "zuhören"
          - id: l1-c2
            type: true_false
            text: "Merve: Ich finde, wir sollten …\nTim wartet und schaut Merve an.\n\nHält sich Tim an die Regeln?"
            say: "Lies, was passiert. Hält sich Tim an die Regeln?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Lukas sagt: „Ich finde, wir sollten am Wandertag ins Freibad gehen.“\n\nWelche Antwort widerspricht freundlich?"
            say: "Lies, was Lukas sagt. Welche Antwort widerspricht freundlich?"
            options: ["Das Freibad ist toll, aber am See ist es ruhiger.", "Freibad ist doof.", "Du kannst ja nicht mal schwimmen."]
            answer: "Das Freibad ist toll, aber am See ist es ruhiger."

  - n: 2
    title: { de: "Auf andere eingehen", en: "Responding to others" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Pia erzählt. Jonas ruft dazwischen. Welche Regel bricht Jonas?"
            say: "Pia erzählt. Jonas ruft dazwischen. Welche Regel bricht Jonas?"
            options: ["ausreden lassen", "zuhören", "freundlich bleiben"]
            answer: "ausreden lassen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Darf man im Gespräch anderer Meinung sein?"
            say: "Darf man im Gespräch anderer Meinung sein?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Ida: Ich finde, wir sollten ein Klassenhaustier haben.\nFelix: Ich habe einen Hamster zu Hause."
            say: "In einem guten Gespräch gehst du auf das ein, was die anderen gesagt haben. Felix redet nur von sich. Er geht nicht auf Idas Idee ein."
          - text: "Ich finde auch, dass …\nIch sehe das anders, weil …\nWas meinst du mit …?\nIch möchte an Idas Idee anknüpfen: …"
            say: "Mit diesen Satzanfängen zeigst du, dass du zugehört hast. Du kannst zustimmen, widersprechen, nachfragen oder eine Idee weiterführen."
          - text: "Felix: Ich finde auch, dass ein Haustier schön wäre. Aber wer kümmert sich in den Ferien darum?"
            say: "So geht Felix auf Ida ein. Er stimmt ihr zu und stellt eine Frage, die das Gespräch weiterbringt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Sophie: Ich finde, wir sollten in der Pause mehr Bälle haben.\n\nWelche Antwort geht auf Sophie ein?"
                say: "Lies, was Sophie sagt. Welche Antwort geht auf sie ein?"
                options: ["Ich finde auch, dass wir mehr Bälle brauchen. Dann muss keiner warten.", "Ich hatte gestern Geburtstag.", "Mein Lieblingsessen ist Pizza."]
                answer: "Ich finde auch, dass wir mehr Bälle brauchen. Dann muss keiner warten."
                feedback:
                  "Ich hatte gestern Geburtstag.": "Das ist ein ganz anderes Thema. Sophie spricht über Bälle in der Pause."
                hints:
                  - "Worüber spricht Sophie?"
                  - "Sophie spricht über Bälle. Welche Antwort spricht auch über Bälle?"
                  - "Ich finde auch, dass wir mehr Bälle brauchen."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was macht das Kind? Verbinde."
                say: "Lies die Satzanfänge. Was macht das Kind damit? Verbinde."
                pairs:
                  - { left: { text: "Ich finde auch, dass …" }, right: { text: "zustimmen" } }
                  - { left: { text: "Ich sehe das anders, weil …" }, right: { text: "widersprechen" } }
                  - { left: { text: "Was meinst du mit …?" }, right: { text: "nachfragen" } }
                option_audio: false
                hints:
                  - "Lies jeden Satzanfang langsam."
                  - "Auch heißt: Ich denke das Gleiche. Eine Frage fragt nach."
                  - "Auch: zustimmen. Anders: widersprechen. Was meinst du: nachfragen."
              - id: l2-f3
                type: multiple_choice
                text: "Karim: Ich finde, wir sollten nur noch Comics lesen.\n\nWelche Antwort widerspricht freundlich und geht auf Karim ein?"
                say: "Lies, was Karim sagt. Welche Antwort widerspricht freundlich und geht auf ihn ein?"
                options: ["Ich sehe das anders. Comics sind toll, aber ich lese auch gern Sachbücher.", "Du hast keine Ahnung, Karim.", "Ich habe einen neuen Rucksack."]
                answer: "Ich sehe das anders. Comics sind toll, aber ich lese auch gern Sachbücher."
                feedback:
                  "Du hast keine Ahnung, Karim.": "Das ist unfreundlich. Sag deine Meinung, ohne Karim schlechtzumachen."
                hints:
                  - "Zwei Dinge müssen stimmen: freundlich, und es geht um Karims Idee."
                  - "Ein Satz ist unfreundlich, einer hat ein anderes Thema."
                  - "Ich sehe das anders. Comics sind toll, aber ich lese auch gern Sachbücher."
              - id: l2-f4
                type: multiple_choice
                text: "Ali: Wir könnten einen Kuchen backen und ihn verkaufen.\n\nDu verstehst nicht, wofür das Geld ist. Was fragst du?"
                say: "Lies, was Ali sagt. Du verstehst nicht, wofür das Geld ist. Was fragst du?"
                options: ["Wofür möchtest du das Geld verwenden?", "Warum redest du so viel?", "Kann ich jetzt etwas anderes erzählen?"]
                answer: "Wofür möchtest du das Geld verwenden?"
                hints:
                  - "Eine gute Frage passt genau zu dem, was du nicht verstehst."
                  - "Du weißt nicht, wofür das Geld ist."
                  - "Wofür möchtest du das Geld verwenden?"
              - id: l2-f5
                type: speak
                text: "Ich finde auch, dass wir mehr Bälle brauchen."
                say: "Stimme Sophie zu. Sag den Satz deutlich. Dann hörst du dich und das Vorbild."
                expected_text: "Ich finde auch, dass wir mehr Bälle brauchen."
                hints:
                  - "Schau dabei die Person an, mit der du sprichst."
                  - "Betone das Wort auch. Es zeigt, dass du zustimmst."
                  - "Hör das Vorbild an und sag es noch einmal."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Lea: Ich finde, unser Klassenzimmer ist zu laut.\n\nWelche Antwort geht auf Lea ein?"
                say: "Lies, was Lea sagt. Welche Antwort geht auf sie ein?"
                options: ["Ja, vielleicht hilft eine Flüsterregel bei der Stillarbeit.", "Meine Oma wohnt in Hamburg.", "Ich kann schon bis tausend zählen."]
                answer: "Ja, vielleicht hilft eine Flüsterregel bei der Stillarbeit."
                hints: ["Welche Antwort spricht auch über den Lärm?"]
              - id: l2-s2
                type: matching
                text: "Was macht das Kind? Verbinde."
                say: "Lies die Sätze. Was macht das Kind damit? Verbinde."
                pairs:
                  - { left: { text: "Genau, das denke ich auch." }, right: { text: "zustimmen" } }
                  - { left: { text: "Da bin ich anderer Meinung." }, right: { text: "widersprechen" } }
                  - { left: { text: "Wie hast du das gemeint?" }, right: { text: "nachfragen" } }
                  - { left: { text: "Zu Alis Idee möchte ich noch etwas sagen." }, right: { text: "anknüpfen" } }
                option_audio: false
                hints: ["Anknüpfen heißt: eine Idee aufgreifen und weiterführen."]
              - id: l2-s3
                type: multiple_choice
                text: "Jule: Ich möchte, dass der Ausflug in den Wald geht.\n\nWelche Antwort widerspricht freundlich und geht auf Jule ein?"
                say: "Lies, was Jule sagt. Welche Antwort widerspricht freundlich und geht auf sie ein?"
                options: ["Der Wald ist schön, aber ich fände das Museum spannender.", "Wald? Wie langweilig!", "Ich habe heute Turnschuhe an."]
                answer: "Der Wald ist schön, aber ich fände das Museum spannender."
                hints: ["Freundlich, und es geht um den Ausflug."]
              - id: l2-s4
                type: true_false
                text: "Moritz: Wir sollten den Schulhof bunt bemalen.\nAnna: Ich möchte an Moritz' Idee anknüpfen: Wir könnten auch ein Hüpfspiel aufmalen.\n\nGeht Anna auf Moritz ein?"
                say: "Lies das Gespräch. Geht Anna auf Moritz ein?"
                answer: true
                hints: ["Spricht Anna über den Schulhof?"]
              - id: l2-s5
                type: speak
                text: "Ich sehe das anders, weil ich lieber draußen spiele."
                say: "Widersprich freundlich. Sag den Satz ruhig und deutlich. Dann hörst du dich und das Vorbild."
                expected_text: "Ich sehe das anders, weil ich lieber draußen spiele."
                hints: ["Ruhig und freundlich, nicht laut."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Emil: Ich finde, wir brauchen eine Leseecke in der Klasse.\n\nWelche Antwort geht auf Emil ein?"
                say: "Lies, was Emil sagt. Welche Antwort geht auf ihn ein?"
                options: ["Gute Idee! Wir könnten Kissen von zu Hause mitbringen.", "Ich war am Wochenende im Kino.", "Wann ist eigentlich Pause?"]
                answer: "Gute Idee! Wir könnten Kissen von zu Hause mitbringen."
              - id: l2-n2
                type: matching
                text: "Was macht das Kind? Verbinde."
                say: "Lies die Sätze. Was macht das Kind damit? Verbinde."
                pairs:
                  - { left: { text: "Das finde ich auch richtig." }, right: { text: "zustimmen" } }
                  - { left: { text: "Ich glaube, das klappt nicht, weil …" }, right: { text: "widersprechen" } }
                  - { left: { text: "Meinst du die große Pause?" }, right: { text: "nachfragen" } }
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Selin: Ich finde, wir sollten jeden Freitag ein Spiel machen.\n\nWelche Antwort widerspricht freundlich und geht auf Selin ein?"
                say: "Lies, was Selin sagt. Welche Antwort widerspricht freundlich und geht auf sie ein?"
                options: ["Spiele machen Spaß, aber jeden Freitag ist mir zu oft.", "Selin will nur nicht lernen.", "Ich habe eine Katze."]
                answer: "Spiele machen Spaß, aber jeden Freitag ist mir zu oft."
              - id: l2-n4
                type: true_false
                text: "Clara: Wir sollten mehr Bäume auf den Schulhof pflanzen.\nDavid: Ich habe neue Fußballschuhe.\n\nGeht David auf Clara ein?"
                say: "Lies das Gespräch. Geht David auf Clara ein?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Ben: Wir könnten ein Sommerfest machen.\n\nDu verstehst nicht, wann das sein soll. Was fragst du?"
                say: "Lies, was Ben sagt. Du verstehst nicht, wann das Fest sein soll. Was fragst du?"
                options: ["An welchem Tag soll das Fest sein?", "Warum bist du immer so laut?", "Darf ich etwas über mein Haustier erzählen?"]
                answer: "An welchem Tag soll das Fest sein?"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Herr Kaya liest eine Geschichte vor. Leon kippelt mit dem Stuhl und summt ein Lied.\n\nWelche Regel vergisst Leon?"
            say: "Lies, was passiert. Welche Regel vergisst Leon?"
            options: ["zuhören", "nacheinander sprechen", "sich melden"]
            answer: "zuhören"
