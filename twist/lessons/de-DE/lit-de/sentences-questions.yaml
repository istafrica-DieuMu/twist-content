# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.sentences-questions
skill: lit-de.sentences.questions
curriculum: de-DE
language: de
title:
  de: Fragen stellen
  en: Asking questions
summary: >
  Building questions. Lesson 1 asks with a question word (Wer? Was? Wo?
  Wann? Wie?) and picks the word that fits the answer; lesson 2 builds
  yes-no questions by putting the verb first (Spielt Tim Fußball?), turns
  statements into questions, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Satzarten, en: Kinds of sentence }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.sentences.end-punctuation, lit-de.verbs.conjugate]
  also_practises: [lit-de.sentences.end-punctuation]
  vocabulary: { de: [Fragesatz, Fragewort, wer, was, wo, wann, wie, Fragezeichen] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: wrong-question-word
      what: Picks a question word that does not fit the answer (Wo? for a time)
      addressed: every stage of lesson 1 has a "Welches Fragewort passt?" task with wo and wann side by side, with feedback in l1-f2
    - id: statement-order
      what: Builds a Ja-Nein-Frage by keeping the statement order and adding only a question mark (Tim spielt Fußball?); that is a question asked by voice, so the tasks ask for the verb first and never call it wrong German
      addressed: lesson 2 Learn moves the verb to the front and names the voice-only question; an ordering task and a "Bei welcher Frage steht das Verb vorn?" task in every stage of lesson 2, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wer? Was? Wo? Wann? Wie?", en: "Who? What? Where? When? How?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Setz das Zeichen."
            say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
            frame: "Was machst du heute_"
            options: ["?", "."]
            answer: ["?"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Form passt? Du _ (spielen)"
            say: "Welche Form passt? Du … Das Verb heißt spielen."
            options: ["spielst", "spielt", "spielen"]
            answer: "spielst"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Wer? Was? Wo?"
            say: "Mit einem Fragewort fragst du nach etwas Bestimmtem. Wer fragt nach einer Person. Was fragt nach einer Sache. Wo fragt nach einem Ort."
          - text: "Wann? Wie?"
            say: "Wann fragt nach der Zeit. Wie fragt, wie etwas ist oder wie man etwas macht."
          - text: "Wo wohnt Oma? In Berlin."
            say: "Das Fragewort steht vorn, gleich danach kommt das Verb: Wo wohnt Oma? Die Antwort: In Berlin."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "_ hat den Kuchen gebacken? Papa."
                say: "Welches Fragewort passt? … hat den Kuchen gebacken? Die Antwort ist: Papa."
                options: ["Wer", "Wo", "Wann"]
                answer: "Wer"
                hints:
                  - "Die Antwort ist eine Person."
                  - "Nach einer Person fragst du mit …"
                  - "Wer."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "_ beginnt das Fest? Um drei Uhr."
                say: "Welches Fragewort passt? … beginnt das Fest? Die Antwort ist: Um drei Uhr."
                options: ["Wo", "Wann", "Was"]
                answer: "Wann"
                feedback:
                  "Wo": "Wo fragt nach einem Ort. Um drei Uhr ist eine Zeit, also fragst du mit Wann."
                hints:
                  - "Die Antwort ist eine Uhrzeit."
                  - "Nach der Zeit fragst du mit …"
                  - "Wann."
              - id: l1-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Fragewort mit dem, wonach es fragt."
                pairs:
                  - { left: { text: "Wo?" }, right: { text: "ein Ort" } }
                  - { left: { text: "Wer?" }, right: { text: "eine Person" } }
                  - { left: { text: "Was?" }, right: { text: "eine Sache" } }
                hints:
                  - "Denk an die Antworten: im Garten, Lena, ein Ball."
                  - "Wo fragt nach einem Ort."
                  - "Wo passt zu Ort, Wer zu Person, Was zu Sache."
              - id: l1-f4
                type: multiple_choice
                text: "_ heißt dein Hund? Bello."
                say: "Welches Fragewort passt? … heißt dein Hund? Die Antwort ist: Bello."
                options: ["Wie", "Wer", "Wo"]
                answer: "Wie"
                hints:
                  - "So fragt man nach einem Namen: … heißt du?"
                  - "Es ist das gleiche Wort wie bei: … geht es dir?"
                  - "Wie."
              - id: l1-f5
                type: true_false
                text: "Passt die Frage zur Antwort?"
                say: "Lies die Karte. Passt die Frage zur Antwort?"
                show: { drawn: letter-card, text: "Wo spielen die Kinder? Im Park." }
                answer: true
                hints:
                  - "Im Park ist ein Ort."
                  - "Nach einem Ort fragst du mit Wo."
                  - "Ja, das passt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "_ liegt die Katze? Auf dem Sofa."
                say: "Welches Fragewort passt? … liegt die Katze? Die Antwort ist: Auf dem Sofa."
                options: ["Wann", "Wo", "Wer"]
                answer: "Wo"
                hints: ["Ist die Antwort eine Zeit, ein Ort oder eine Person?"]
              - id: l1-s2
                type: multiple_choice
                text: "_ kommt der Bus? Gleich."
                say: "Welches Fragewort passt? … kommt der Bus? Die Antwort ist: Gleich."
                options: ["Wo", "Was", "Wann"]
                answer: "Wann"
                hints: ["Sagt gleich etwas über einen Ort oder eine Zeit?"]
              - id: l1-s3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Fragewort mit dem, wonach es fragt."
                pairs:
                  - { left: { text: "Wann?" }, right: { text: "eine Zeit" } }
                  - { left: { text: "Wo?" }, right: { text: "ein Ort" } }
                  - { left: { text: "Wer?" }, right: { text: "eine Person" } }
                hints: ["Denk an passende Antworten."]
              - id: l1-s4
                type: multiple_choice
                text: "_ isst du am liebsten? Nudeln."
                say: "Welches Fragewort passt? … isst du am liebsten? Die Antwort ist: Nudeln."
                options: ["Wer", "Was", "Wie"]
                answer: "Was"
                hints: ["Sind Nudeln eine Person oder eine Sache?"]
              - id: l1-s5
                type: true_false
                text: "Passt die Frage zur Antwort?"
                say: "Lies die Karte. Passt die Frage zur Antwort?"
                show: { drawn: letter-card, text: "Wann wohnt Tim? In Hamburg." }
                answer: false
                hints: ["Ist In Hamburg eine Zeit?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "_ klingelt an der Tür? Der Postbote."
                say: "Welches Fragewort passt? … klingelt an der Tür? Die Antwort ist: Der Postbote."
                options: ["Wo", "Wer", "Was"]
                answer: "Wer"
              - id: l1-n2
                type: multiple_choice
                text: "_ hast du Geburtstag? Im Mai."
                say: "Welches Fragewort passt? … hast du Geburtstag? Die Antwort ist: Im Mai."
                options: ["Wann", "Wo", "Wie"]
                answer: "Wann"
              - id: l1-n3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Frage mit ihrer Antwort."
                pairs:
                  - { left: { text: "Wo ist mein Schuh?" }, right: { text: "Unter dem Bett." } }
                  - { left: { text: "Wann essen wir?" }, right: { text: "Um zwölf Uhr." } }
                  - { left: { text: "Wer ruft an?" }, right: { text: "Oma." } }
              - id: l1-n4
                type: multiple_choice
                text: "_ ist das Wetter? Sonnig."
                say: "Welches Fragewort passt? … ist das Wetter? Die Antwort ist: Sonnig."
                options: ["Wie", "Wer", "Wo"]
                answer: "Wie"
              - id: l1-n5
                type: true_false
                text: "Passt die Frage zur Antwort?"
                say: "Lies die Karte. Passt die Frage zur Antwort?"
                show: { drawn: letter-card, text: "Was trinkst du? Saft." }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "_ wohnt der Igel? Im Laub."
            say: "Welches Fragewort passt? … wohnt der Igel? Die Antwort ist: Im Laub."
            options: ["Wann", "Wer", "Wo"]
            answer: "Wo"
          - id: l1-c2
            type: multiple_choice
            text: "_ kommt Opa zu Besuch? Am Sonntag."
            say: "Welches Fragewort passt? … kommt Opa zu Besuch? Die Antwort ist: Am Sonntag."
            options: ["Wann", "Wo", "Was"]
            answer: "Wann"
          - id: l1-c3
            type: true_false
            text: "Passt die Frage zur Antwort?"
            say: "Lies die Karte. Passt die Frage zur Antwort?"
            show: { drawn: letter-card, text: "Wer singt so schön? Lea." }
            answer: true

  - n: 2
    title: { de: "Fragen ohne Fragewort", en: "Questions without a question word" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "_ spielt Gitarre? Mein Onkel."
            say: "Welches Fragewort passt? … spielt Gitarre? Die Antwort ist: Mein Onkel."
            options: ["Wer", "Wann", "Wo"]
            answer: "Wer"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "_ fährt der Zug? Um acht."
            say: "Welches Fragewort passt? … fährt der Zug? Die Antwort ist: Um acht."
            options: ["Wo", "Wann", "Wer"]
            answer: "Wann"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Tim spielt Fußball. → Spielt Tim Fußball?"
            say: "Aus einem Aussagesatz wird eine Frage, wenn das Verb nach vorn kommt: Tim spielt Fußball. Spielt Tim Fußball? Die Antwort ist ja oder nein."
          - text: "Du hast einen Hund. → Hast du einen Hund?"
            say: "Du hast einen Hund. Hast du einen Hund? Zuerst kommt das Verb, dann die Person. Am Ende steht ein Fragezeichen."
          - text: "Tim spielt Fußball? → Spielt Tim Fußball?"
            say: "Beim Sprechen fragt man manchmal nur mit der Stimme: Tim spielt Fußball? Hier übst du die Frage mit dem Verb vorn: Spielt Tim Fußball?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Bau die Frage: „Lena malt ein Bild.“"
                say: "Mach aus dem Satz eine Frage: Lena malt ein Bild."
                options: ["Lena", "ein Bild?", "Malt"]
                slot_count: 3
                answer: ["Malt", "Lena", "ein Bild?"]
                option_audio: false
                hints:
                  - "Das Verb kommt nach vorn."
                  - "Das Verb ist malt."
                  - "Malt Lena ein Bild?"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "„Der Hund schläft.“ Bei welcher Frage steht das Verb vorn?"
                say: "Der Satz heißt: Der Hund schläft. Bei welcher Frage steht das Verb vorn?"
                options: ["Schläft der Hund?", "Der Hund schläft?", "Der schläft Hund?"]
                answer: "Schläft der Hund?"
                option_audio: false
                feedback:
                  "Der Hund schläft?": "So fragt man nur mit der Stimme. Das Verb steht hier nicht vorn. Mit dem Verb vorn heißt es: Schläft der Hund?"
                hints:
                  - "Welches Wort ist das Verb?"
                  - "Das Verb steht in der Frage ganz vorn."
                  - "Schläft der Hund?"
              - id: l2-f3
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies die Frage. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Kommt Papa heute früh nach Hause?" }
                spans: ["Kommt"]
                hints:
                  - "In dieser Frage steht das Verb an einer besonderen Stelle."
                  - "Schau ganz nach vorn."
                  - "Kommt."
              - id: l2-f4
                type: true_false
                text: "Steht das Verb vorn?"
                say: "Lies die Frage auf der Karte. Steht das Verb ganz vorn?"
                show: { drawn: letter-card, text: "Du hast Hunger?" }
                answer: false
                hints:
                  - "Welches Wort ist das Verb?"
                  - "Das Verb ist hast. Welches Wort steht ganz vorn?"
                  - "Nein. Mit dem Verb vorn heißt die Frage: Hast du Hunger?"
              - id: l2-f5
                type: multiple_choice
                text: "Welche Antwort passt? „Gehst du gern schwimmen?“"
                say: "Gehst du gern schwimmen? Welche Antwort passt?"
                options: ["Ja, sehr gern.", "Im Schwimmbad.", "Am Montag."]
                answer: "Ja, sehr gern."
                hints:
                  - "Die Frage hat kein Fragewort."
                  - "Auf solche Fragen antwortest du mit ja oder nein."
                  - "Ja, sehr gern."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Bau die Frage: „Oma backt einen Kuchen.“"
                say: "Mach aus dem Satz eine Frage: Oma backt einen Kuchen."
                options: ["einen Kuchen?", "Backt", "Oma"]
                slot_count: 3
                answer: ["Backt", "Oma", "einen Kuchen?"]
                option_audio: false
                hints: ["Welches Wort kommt nach vorn?"]
              - id: l2-s2
                type: multiple_choice
                text: "„Die Sonne scheint.“ Bei welcher Frage steht das Verb vorn?"
                say: "Der Satz heißt: Die Sonne scheint. Bei welcher Frage steht das Verb vorn?"
                options: ["Die Sonne scheint?", "Scheint die Sonne?", "Sonne scheint die?"]
                answer: "Scheint die Sonne?"
                option_audio: false
                hints: ["Wo steht das Verb in der Frage?"]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies die Frage. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Trinkst du gern Milch?" }
                spans: ["Trinkst"]
                hints: ["Wo steht das Verb bei so einer Frage?"]
              - id: l2-s4
                type: true_false
                text: "Steht das Verb vorn?"
                say: "Lies die Frage auf der Karte. Steht das Verb ganz vorn?"
                show: { drawn: letter-card, text: "Kannst du schon lesen?" }
                answer: true
                hints: ["Welches Wort ist das Verb? Wo steht es?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Antwort passt? „Hast du ein Haustier?“"
                say: "Hast du ein Haustier? Welche Antwort passt?"
                options: ["Gestern.", "Nein, leider nicht.", "Im Garten."]
                answer: "Nein, leider nicht."
                hints: ["Gibt es ein Fragewort?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Bau die Frage: „Max liest ein Buch.“"
                say: "Mach aus dem Satz eine Frage: Max liest ein Buch."
                options: ["Max", "Liest", "ein Buch?"]
                slot_count: 3
                answer: ["Liest", "Max", "ein Buch?"]
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "„Ihr wohnt in Köln.“ Bei welcher Frage steht das Verb vorn?"
                say: "Der Satz heißt: Ihr wohnt in Köln. Bei welcher Frage steht das Verb vorn?"
                options: ["Wohnt ihr in Köln?", "Ihr wohnt in Köln?", "In wohnt ihr Köln?"]
                answer: "Wohnt ihr in Köln?"
                option_audio: false
              - id: l2-n3
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies die Frage. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Regnet es morgen auch?" }
                spans: ["Regnet"]
              - id: l2-n4
                type: true_false
                text: "Steht das Verb vorn?"
                say: "Lies die Frage auf der Karte. Steht das Verb ganz vorn?"
                show: { drawn: letter-card, text: "Die Katze ist weg?" }
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Welche Antwort passt? „Magst du Schokolade?“"
                say: "Magst du Schokolade? Welche Antwort passt?"
                options: ["Im Schrank.", "Mama.", "Ja, sehr."]
                answer: "Ja, sehr."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "_ ist meine Brille? Auf dem Tisch."
            say: "Welches Fragewort passt? … ist meine Brille? Die Antwort ist: Auf dem Tisch."
            options: ["Wo", "Wann", "Wer"]
            answer: "Wo"
          - id: l2-c2
            type: ordering
            text: "Bau die Frage: „Paul hat einen Roller.“"
            say: "Mach aus dem Satz eine Frage: Paul hat einen Roller."
            options: ["einen Roller?", "Paul", "Hat"]
            slot_count: 3
            answer: ["Hat", "Paul", "einen Roller?"]
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "„Das Baby lacht.“ Bei welcher Frage steht das Verb vorn?"
            say: "Der Satz heißt: Das Baby lacht. Bei welcher Frage steht das Verb vorn?"
            options: ["Das Baby lacht?", "Baby das lacht?", "Lacht das Baby?"]
            answer: "Lacht das Baby?"
            option_audio: false
          - id: l2-c4
            type: true_false
            text: "Passt die Frage zur Antwort?"
            say: "Lies die Karte. Passt die Frage zur Antwort?"
            show: { drawn: letter-card, text: "Wo bist du geboren? Im Winter." }
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Welche Antwort passt? „Fährst du mit dem Rad?“"
            say: "Fährst du mit dem Rad? Welche Antwort passt?"
            options: ["Ja, heute schon.", "Mein Bruder.", "Um acht Uhr."]
            answer: "Ja, heute schon."
