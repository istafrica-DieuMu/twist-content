# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.report
skill: lit-de.writing.report
curriculum: de-DE
language: de
title:
  de: Einen Bericht schreiben
  en: Writing a report
summary: >
  The knowledge behind a factual report. Lesson 1 answers the W-Fragen
  (Wer? Was? Wann? Wo? Wie? Warum?), finds the W-Frage a report leaves
  open and puts events in the order they happened; lesson 2 keeps a report
  sachlich (no feelings, no suspense, no opinion), writes it in the
  Präteritum, tells a report from a story, and ends with the skill check.
  Writing a whole report freely waits for a free text task type; here the
  child sorts, orders, chooses and fills. Every event is written for
  Twist.
metadata:
  year: klasse-4
  topic: { de: Berichten, en: Reporting }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.writing.instructions, lit-de.verbs.simple-past]
  also_practises: [lit-de.verbs.simple-past, lit-de.texts-media.text-types]
  vocabulary: { de: [Bericht, berichten, W-Fragen, sachlich, Reihenfolge, Präteritum, Unfallbericht, Zeitungsbericht] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: report-as-story
      what: Writes a report like a story, with feelings, suspense words (plötzlich, auf einmal) and direct speech
      addressed: "lesson 2 Learn sets a story sentence against a report sentence; l2-f1, l2-s1, l2-n1 and l2-c3 choose the sachlich sentence (feedback on l2-f1), and l2-f3, l2-s3, l2-n3 and l2-c4 sort what belongs in a report"
    - id: missing-w-questions
      what: Leaves out when or where something happened, because the writer already knows it
      addressed: "lesson 1 Learn checks a report against the W-Fragen; l1-f3, l1-s3, l1-n3 and l2-c2 find the W-Frage that is not answered, with feedback on l1-f3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die W-Fragen beantworten", en: "Answering the W-questions" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Setze das Verb ins Präteritum."
            say: "Welche Form ist das Präteritum?"
            frame: "Gestern _ unsere Klasse ins Museum."
            options: ["fuhr", "fährt", "fahren"]
            answer: ["fuhr"]
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Leg die Schritte in die richtige Reihenfolge."
            say: "So kochst du Nudeln. Leg die Schritte in die richtige Reihenfolge."
            options: ["Nudeln ins Wasser geben", "Wasser im Topf kochen", "Nudeln abgießen"]
            slot_count: 3
            answer: ["Wasser im Topf kochen", "Nudeln ins Wasser geben", "Nudeln abgießen"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Am Dienstag, dem 12. März, stieß Jonas aus der 4b in der großen Pause auf dem Schulhof mit einem anderen Kind zusammen. Er rannte dem Ball hinterher und sah es nicht. Jonas verletzte sich am Knie. Frau Weber verband die Wunde."
            say: "Das ist ein Bericht. Ein Bericht informiert genau über etwas, das wirklich passiert ist. Wer ihn liest, weiß danach alles Wichtige, auch wenn er nicht dabei war."
          - text: "Wer? Jonas aus der 4b\nWas? Zusammenstoß, Knie verletzt\nWann? Dienstag, 12. März, große Pause\nWo? auf dem Schulhof\nWie? rannte dem Ball hinterher\nWarum? sah das Kind nicht"
            say: "Ein guter Bericht beantwortet die W-Fragen: Wer? Was? Wann? Wo? Wie? und Warum? Prüfe deinen Bericht: Fehlt eine Antwort?"
          - text: "1. Jonas rannte dem Ball hinterher.\n2. Er stieß mit einem Kind zusammen.\n3. Er verletzte sich am Knie.\n4. Frau Weber verband die Wunde."
            say: "Ein Bericht erzählt alles in der Reihenfolge, in der es passiert ist. Erst was zuerst geschah, dann was danach kam."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: matching
                text: "Welche W-Frage beantwortet die Angabe? Verbinde."
                say: "Lies die Angaben aus einem Bericht. Welche W-Frage beantworten sie? Verbinde."
                pairs:
                  - { left: { text: "am Freitagmorgen" }, right: { text: "Wann?" } }
                  - { left: { text: "im Stadtpark" }, right: { text: "Wo?" } }
                  - { left: { text: "die Klasse 4a" }, right: { text: "Wer?" } }
                option_audio: false
                hints:
                  - "Frag bei jeder Angabe: Ist das eine Zeit, ein Ort oder eine Person?"
                  - "Freitagmorgen ist eine Zeit. Stadtpark ist ein Ort."
                  - "Freitagmorgen: Wann. Stadtpark: Wo. Klasse 4a: Wer."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Am Montag pflanzte die Klasse 3c im Schulgarten zwölf Apfelbäume.\n\nWo geschah es?"
                say: "Lies den Satz aus einem Bericht. Wo geschah es?"
                options: ["im Schulgarten", "am Montag", "die Klasse 3c"]
                answer: "im Schulgarten"
                hints:
                  - "Wo fragt nach einem Ort."
                  - "Am Montag ist eine Zeit, die Klasse 3c sind Personen."
                  - "im Schulgarten."
              - id: l1-f3
                type: multiple_choice
                text: "Die Feuerwehr rettete eine Katze vom Dach der Bäckerei Müller. Die Katze war auf das Dach geklettert und kam nicht mehr herunter.\n\nWelche W-Frage beantwortet der Bericht nicht?"
                say: "Lies den Bericht. Welche W-Frage beantwortet er nicht?"
                options: ["Wann?", "Wo?", "Wer?"]
                answer: "Wann?"
                feedback:
                  "Wo?": "Der Ort steht da: auf dem Dach der Bäckerei Müller. Suche nach einer Zeit."
                hints:
                  - "Gehe die W-Fragen der Reihe nach durch."
                  - "Wer? Die Feuerwehr. Wo? Auf dem Dach. Und an welchem Tag?"
                  - "Es fehlt: Wann?"
              - id: l1-f4
                type: ordering
                text: "Leg die Sätze in die Reihenfolge, in der es passiert ist."
                say: "Lies die Sätze aus einem Bericht. Leg sie in die Reihenfolge, in der es passiert ist."
                options: ["Der Hausmeister holte eine Leiter.", "Beim Spielen flog der Ball auf das Dach der Turnhalle.", "Mit der Leiter holte er den Ball herunter."]
                slot_count: 3
                answer: ["Beim Spielen flog der Ball auf das Dach der Turnhalle.", "Der Hausmeister holte eine Leiter.", "Mit der Leiter holte er den Ball herunter."]
                option_audio: false
                hints:
                  - "Was war das Problem? Damit fängt es an."
                  - "Erst fliegt der Ball, dann kommt die Leiter."
                  - "Ball auf dem Dach, Leiter holen, Ball herunterholen."
              - id: l1-f5
                type: true_false
                text: "„Weil es stark geregnet hatte, fiel das Sportfest aus.“ Beantwortet der Satz die Frage Warum?"
                say: "Lies den Satz. Beantwortet er die Frage Warum?"
                answer: true
                hints:
                  - "Warum fragt nach dem Grund."
                  - "Achte auf das Wort weil."
                  - "Ja. Der Grund ist der starke Regen."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Welche W-Frage beantwortet die Angabe? Verbinde."
                say: "Lies die Angaben aus einem Bericht. Welche W-Frage beantworten sie? Verbinde."
                pairs:
                  - { left: { text: "weil die Straße glatt war" }, right: { text: "Warum?" } }
                  - { left: { text: "um 8 Uhr" }, right: { text: "Wann?" } }
                  - { left: { text: "vor dem Rathaus" }, right: { text: "Wo?" } }
                  - { left: { text: "Ein Lastwagen rutschte in den Graben." }, right: { text: "Was?" } }
                option_audio: false
                hints: ["Weil zeigt einen Grund."]
              - id: l1-s2
                type: multiple_choice
                text: "Am Samstagabend spielte die Schulband in der Aula vor über hundert Gästen.\n\nWann geschah es?"
                say: "Lies den Satz aus einem Bericht. Wann geschah es?"
                options: ["am Samstagabend", "in der Aula", "die Schulband"]
                answer: "am Samstagabend"
                hints: ["Wann fragt nach einer Zeit."]
              - id: l1-s3
                type: multiple_choice
                text: "Am Mittwochnachmittag fand ein Spaziergänger einen jungen Igel. Der Igel war sehr dünn und brauchte Hilfe.\n\nWelche W-Frage beantwortet der Bericht nicht?"
                say: "Lies den Bericht. Welche W-Frage beantwortet er nicht?"
                options: ["Wo?", "Wann?", "Wer?"]
                answer: "Wo?"
                hints: ["Wo hat der Spaziergänger den Igel gefunden?"]
              - id: l1-s4
                type: ordering
                text: "Leg die Sätze in die Reihenfolge, in der es passiert ist."
                say: "Lies die Sätze aus einem Bericht. Leg sie in die Reihenfolge, in der es passiert ist."
                options: ["Die Tierärztin untersuchte den Hund.", "Ein Hund lief verletzt über die Straße.", "Eine Frau brachte ihn in die Tierarztpraxis."]
                slot_count: 3
                answer: ["Ein Hund lief verletzt über die Straße.", "Eine Frau brachte ihn in die Tierarztpraxis.", "Die Tierärztin untersuchte den Hund."]
                option_audio: false
                hints: ["Was muss passieren, bevor die Tierärztin helfen kann?"]
              - id: l1-s5
                type: true_false
                text: "„Die Kinder gingen in den Wald.“ Beantwortet der Satz die Frage Wann?"
                say: "Lies den Satz. Beantwortet er die Frage Wann?"
                answer: false
                hints: ["Steht im Satz eine Zeit?"]

          - support: none
            tasks:
              - id: l1-n1
                type: matching
                text: "Welche W-Frage beantwortet die Angabe? Verbinde."
                say: "Lies die Angaben aus einem Bericht. Welche W-Frage beantworten sie? Verbinde."
                pairs:
                  - { left: { text: "mit einem Seil" }, right: { text: "Wie?" } }
                  - { left: { text: "am Bahnhof" }, right: { text: "Wo?" } }
                  - { left: { text: "zwei Polizisten" }, right: { text: "Wer?" } }
                  - { left: { text: "weil der Zug Verspätung hatte" }, right: { text: "Warum?" } }
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Beim Stadtlauf am Sonntag gewann Mila Kurz aus der 4c das Rennen der Kinder.\n\nWer gewann?"
                say: "Lies den Satz aus einem Bericht. Wer gewann das Rennen?"
                options: ["Mila Kurz", "am Sonntag", "beim Stadtlauf"]
                answer: "Mila Kurz"
              - id: l1-n3
                type: multiple_choice
                text: "Am Donnerstag um 10 Uhr brach in der Schulküche ein kleines Feuer aus. Der Hausmeister löschte es mit einem Feuerlöscher.\n\nWelche W-Frage beantwortet der Bericht nicht?"
                say: "Lies den Bericht. Welche W-Frage beantwortet er nicht?"
                options: ["Warum?", "Wo?", "Wann?"]
                answer: "Warum?"
              - id: l1-n4
                type: ordering
                text: "Leg die Sätze in die Reihenfolge, in der es passiert ist."
                say: "Lies die Sätze aus einem Bericht. Leg sie in die Reihenfolge, in der es passiert ist."
                options: ["Nach zehn Minuten fand ein Verkäufer den Jungen bei den Spielsachen.", "Im Kaufhaus verlor ein kleiner Junge seine Mutter.", "Die Mutter ließ ihn ausrufen.", "Die beiden trafen sich an der Kasse wieder."]
                slot_count: 4
                answer: ["Im Kaufhaus verlor ein kleiner Junge seine Mutter.", "Die Mutter ließ ihn ausrufen.", "Nach zehn Minuten fand ein Verkäufer den Jungen bei den Spielsachen.", "Die beiden trafen sich an der Kasse wieder."]
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "„Mit einem Kran hoben die Arbeiter das Boot aus dem Wasser.“ Beantwortet der Satz die Frage Wie?"
                say: "Lies den Satz. Beantwortet er die Frage Wie?"
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Am Freitag besuchte ein Imker die Klasse 4b im Klassenzimmer.\n\nWer kam zu Besuch?"
            say: "Lies den Satz aus einem Bericht. Wer kam zu Besuch?"
            options: ["ein Imker", "am Freitag", "im Klassenzimmer"]
            answer: "ein Imker"
          - id: l1-c2
            type: multiple_choice
            text: "Ein Lieferwagen blieb auf der Brücke stehen, weil der Motor kaputt war.\n\nWelche W-Frage beantwortet der Bericht nicht?"
            say: "Lies den Bericht. Welche W-Frage beantwortet er nicht?"
            options: ["Wann?", "Wo?", "Warum?"]
            answer: "Wann?"
          - id: l1-c3
            type: ordering
            text: "Leg die Sätze in die Reihenfolge, in der es passiert ist."
            say: "Lies die Sätze aus einem Bericht. Leg sie in die Reihenfolge, in der es passiert ist."
            options: ["Der Fahrer stieg aus und sah nach.", "Der Bus hatte einen platten Reifen.", "Ein Ersatzbus holte die Kinder ab."]
            slot_count: 3
            answer: ["Der Bus hatte einen platten Reifen.", "Der Fahrer stieg aus und sah nach.", "Ein Ersatzbus holte die Kinder ab."]
            option_audio: false

  - n: 2
    title: { de: "Sachlich im Präteritum", en: "Factual and in the past" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Am Montag stürzte im Hof ein Baum um.\n\nWo geschah es?"
            say: "Lies den Satz aus einem Bericht. Wo geschah es?"
            options: ["im Hof", "am Montag", "ein Baum"]
            answer: "im Hof"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein Bericht erzählt alles in der Reihenfolge, in der es passiert ist. Stimmt das?"
            say: "Ein Bericht erzählt alles in der Reihenfolge, in der es passiert ist. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Geschichte: Plötzlich krachte es fürchterlich! Mein Herz blieb fast stehen.\n\nBericht: Um 9 Uhr stießen zwei Fahrräder an der Ampel zusammen."
            say: "Eine Geschichte will unterhalten. Sie ist spannend und erzählt Gefühle. Ein Bericht will informieren. Er ist sachlich: kurz, genau und ohne Gefühle."
          - text: "nicht in einen Bericht:\nGefühle: Ich hatte Angst.\nSpannung: Auf einmal …\nMeinung: Das war blöd.\nwörtliche Rede: „Hilfe!“, rief er."
            say: "Das alles gehört nicht in einen Bericht. Schreib nur auf, was wirklich passiert ist."
          - text: "Die Feuerwehr kam nach fünf Minuten. Sie löschte den Brand."
            say: "Einen Bericht schreibst du im Präteritum, weil das Ereignis schon vorbei ist: kam, löschte, fuhr, sah."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Satz passt in einen Bericht?"
                say: "Lies die Sätze. Welcher passt in einen Bericht?"
                options: ["Um 14 Uhr fiel in der Schule für eine Stunde der Strom aus.", "Plötzlich wurde es stockdunkel, und wir schrien vor Schreck!", "Das war der unheimlichste Tag meines Lebens."]
                answer: "Um 14 Uhr fiel in der Schule für eine Stunde der Strom aus."
                feedback:
                  "Plötzlich wurde es stockdunkel, und wir schrien vor Schreck!": "Das ist spannend erzählt, wie in einer Geschichte. Ein Bericht ist sachlich."
                hints:
                  - "Ein Bericht ist sachlich: genau und ohne Gefühle."
                  - "Plötzlich und vor Schreck gehören in eine Geschichte. Unheimlich ist eine Meinung."
                  - "Um 14 Uhr fiel der Strom aus."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Setze das Verb ins Präteritum."
                say: "Ein Bericht steht im Präteritum. Welche Form passt?"
                frame: "Die Polizei _ den Verkehr um."
                options: ["leitete", "leitet", "leiten"]
                answer: ["leitete"]
                hints:
                  - "Das Ereignis ist schon vorbei."
                  - "Leitet ist Präsens. Welche Form zeigt die Vergangenheit?"
                  - "leitete."
              - id: l2-f3
                type: sorting
                text: "Gehört der Satz in einen Bericht?"
                say: "Sortiere die Sätze: Gehören sie in einen Bericht oder nicht?"
                bins:
                  - { id: fits, show: { text: "gehört in den Bericht" }, say: "gehört in den Bericht" }
                  - { id: out, show: { text: "gehört nicht hinein" }, say: "gehört nicht hinein" }
                options:
                  - { text: "Der Ausflug begann um 8 Uhr am Bahnhof.", bin: fits }
                  - { text: "Ich hatte schreckliches Bauchweh vor Aufregung.", bin: out }
                  - { text: "Wir fuhren mit dem Zug nach Bonn.", bin: fits }
                  - { text: "Das Museum war total langweilig.", bin: out }
                option_audio: false
                hints:
                  - "Ist das eine Tatsache? Oder ist es ein Gefühl oder eine Meinung?"
                  - "Bauchweh vor Aufregung ist ein Gefühl. Langweilig ist eine Meinung."
                  - "Ausflug und Zug gehören hinein, Bauchweh und langweilig nicht."
              - id: l2-f4
                type: true_false
                text: "„Am Montag kommt ein Zauberer in unsere Schule.“ Steht der Satz im Präteritum?"
                say: "Lies den Satz. Steht er im Präteritum?"
                answer: false
                hints:
                  - "Präteritum zeigt: Es ist schon vorbei."
                  - "Kommt ist Präsens. Im Präteritum heißt es: kam."
                  - "Nein. Richtig wäre: Am Montag kam ein Zauberer in unsere Schule."
              - id: l2-f5
                type: multiple_choice
                text: "Was will ein Bericht?"
                say: "Was will ein Bericht?"
                options: ["genau informieren", "spannend unterhalten", "zum Lachen bringen"]
                answer: "genau informieren"
                hints:
                  - "Wer liest einen Bericht, zum Beispiel in der Zeitung?"
                  - "Die Leser wollen wissen, was passiert ist."
                  - "genau informieren."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Satz passt in einen Bericht?"
                say: "Lies die Sätze. Welcher passt in einen Bericht?"
                options: ["Am Freitag sammelten 25 Kinder im Park Müll.", "Auf einmal entdeckten wir einen riesigen, ekligen Müllberg!", "Müll im Park finde ich furchtbar."]
                answer: "Am Freitag sammelten 25 Kinder im Park Müll."
                hints: ["Welcher Satz ist sachlich und genau?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Setze das Verb ins Präteritum."
                say: "Ein Bericht steht im Präteritum. Welche Form passt?"
                frame: "Der Krankenwagen _ das Kind ins Krankenhaus."
                options: ["brachte", "bringt", "bringen"]
                answer: ["brachte"]
                hints: ["Wie heißt bringen in der Vergangenheit? Er …"]
              - id: l2-s3
                type: sorting
                text: "Gehört der Satz in einen Bericht?"
                say: "Sortiere die Sätze: Gehören sie in einen Bericht oder nicht?"
                bins:
                  - { id: fits, show: { text: "gehört in den Bericht" }, say: "gehört in den Bericht" }
                  - { id: out, show: { text: "gehört nicht hinein" }, say: "gehört nicht hinein" }
                options:
                  - { text: "Das Spiel endete 2 zu 1 für die 4a.", bin: fits }
                  - { text: "„Tor!“, brüllte Ben begeistert.", bin: out }
                  - { text: "Das zweite Tor fiel in der letzten Minute.", bin: fits }
                  - { text: "Unsere Mannschaft ist einfach die beste.", bin: out }
                option_audio: false
                hints: ["Wörtliche Rede und Meinungen gehören nicht hinein."]
              - id: l2-s4
                type: true_false
                text: "„Gegen Mittag erreichte die Wandergruppe die Hütte.“ Steht der Satz im Präteritum?"
                say: "Lies den Satz. Steht er im Präteritum?"
                answer: true
                hints: ["Ist erreichte schon vorbei?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Überschrift passt zu einem Bericht?"
                say: "Welche Überschrift passt zu einem Bericht?"
                options: ["Klasse 4b gewinnt Lesewettbewerb", "Der schrecklichste Tag meines Lebens", "Das geheimnisvolle Buch"]
                answer: "Klasse 4b gewinnt Lesewettbewerb"
                hints: ["Eine Berichtsüberschrift sagt kurz und sachlich, was passiert ist."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Satz passt in einen Bericht?"
                say: "Lies die Sätze. Welcher passt in einen Bericht?"
                options: ["Am Dienstag besuchte die Klasse 3a die Feuerwache.", "Mit klopfendem Herzen betraten wir die riesige Halle.", "Feuerwehrleute sind die mutigsten Menschen der Welt."]
                answer: "Am Dienstag besuchte die Klasse 3a die Feuerwache."
              - id: l2-n2
                type: fill_in_blank
                text: "Setze das Verb ins Präteritum."
                say: "Ein Bericht steht im Präteritum. Welche Form passt?"
                frame: "Ein Zeuge _ den Unfall von seinem Fenster aus."
                options: ["sah", "sieht", "gesehen"]
                answer: ["sah"]
              - id: l2-n3
                type: sorting
                text: "Gehört der Satz in einen Bericht?"
                say: "Sortiere die Sätze: Gehören sie in einen Bericht oder nicht?"
                bins:
                  - { id: fits, show: { text: "gehört in den Bericht" }, say: "gehört in den Bericht" }
                  - { id: out, show: { text: "gehört nicht hinein" }, say: "gehört nicht hinein" }
                options:
                  - { text: "Der Flohmarkt fand am Samstag auf dem Schulhof statt.", bin: fits }
                  - { text: "Ich war so aufgeregt, dass ich kaum schlafen konnte.", bin: out }
                  - { text: "Die Klassen verdienten zusammen 340 Euro.", bin: fits }
                  - { text: "Plötzlich stand ein Clown vor mir!", bin: out }
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "In einen Bericht gehört wörtliche Rede, damit er lebendig wird. Stimmt das?"
                say: "In einen Bericht gehört wörtliche Rede, damit er lebendig wird. Stimmt das?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Welche Überschrift passt zu einem Bericht?"
                say: "Welche Überschrift passt zu einem Bericht?"
                options: ["Baum stürzt auf Schulhof", "Das Rätsel des alten Baumes", "Mein Abenteuer mit dem Sturm"]
                answer: "Baum stürzt auf Schulhof"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: matching
            text: "W-Fragen: Verbinde die Angabe mit ihrer Frage."
            say: "Lies die Angaben aus einem Zeitungsbericht. Welche W-Frage beantworten sie? Verbinde."
            pairs:
              - { left: { text: "am Mittwochabend" }, right: { text: "Wann?" } }
              - { left: { text: "im Hallenbad" }, right: { text: "Wo?" } }
              - { left: { text: "weil eine Leitung undicht war" }, right: { text: "Warum?" } }
              - { left: { text: "der Bademeister" }, right: { text: "Wer?" } }
            option_audio: false
