# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-st-sp-pf
skill: lit-de.letters.st-sp-pf
curriculum: de-DE
language: de
title:
  de: St, Sp und Pf
  en: St, Sp and Pf
summary: >
  Three letter pairs for the start of words. Lessons 1 and 2: St and Sp
  are spoken scht and schp at the start of a word but written with S
  only (Stern, Stuhl, Spiegel); the child hears the sound and chooses
  the spelling, and keeps St and Sp apart from Sch. Lesson 3: Pf is p
  and f spoken quickly together (Pferd, Apfel, Kopf), set against F.
  Lesson 4 sorts and reads words with all three and ends with the skill
  check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises:
    [lit-de.letters.umlauts, lit-de.handwriting.print-letters, lit-de.spelling.write-by-sound]
  vocabulary:
    { de: [Buchstabe, Laut, Anlaut, Wortanfang, Großbuchstabe, Kleinbuchstabe] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, syllable-arcs, word-card]
  sounds: []
  facets: [script]
  misconceptions:
    - id: scht-written
      what: Writes Scht or Schp because that is what the start of Stern or Spiegel sounds like
      addressed: lesson 1 and 2 Learn say you hear scht but write St; l1-f2, l1-s1, l1-s4, l1-n4, l2-f2, l2-n3, l2-n4, l4-c2 and l4-c3 offer the sound spelling as a distractor
    - id: st-sch
      what: Hears St at the start as plain sch (Stuhl, Schuh)
      addressed: l1-f1, l1-f4, l1-s2, l1-n3 and l2-f1 contrast St and Sp with Sch
    - id: pf-f
      what: Hears only the f in Pf and writes F (Ferd for Pferd)
      addressed: l3-f1, l3-f2, l3-s2, l3-n1, l3-n2 and l4-c4 contrast Pf and F
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das St, en: St at the start }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "u oder ü?"
            say: "Was hörst du: u oder ü?"
            audio: { de: "Füller." }
            options: ["u", "ü"]
            answer: "ü"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Säge" }
            options: [{ object: sock }, { object: saw }, { object: juice }]
            answer: saw
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "St st"
            say: "Hier stehen S und t zusammen: St. Am Anfang eines Wortes sprichst du sie wie scht. Du schreibst aber nur St."
            show: { drawn: letter-card, text: "St st" }
          - text: "Stern"
            say: "Stern. Scht ... ern. Du hörst scht und schreibst St."
            show: { object: star }
          - text: "Stuhl"
            say: "Stuhl. Scht ... uhl. Auch hier steht am Anfang nur St."
            show: { object: chair }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was fängt mit St an?"
                say: "Welches Wort fängt mit St an? Du hörst dann am Anfang scht."
                options: [{ object: star }, { object: shoe }, { object: sun }]
                answer: star
                feedback:
                  shoe: "Schuh fängt mit sch an. Danach kommt kein t."
                  sun: "Sonne fängt mit sss an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den Anfang."
                  - "Stern ... scht. Schuh ... sch. Sonne ... sss."
                  - "Stern fängt mit St an."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Wie schreibt man den Anfang?"
                audio: { de: "Stein." }
                options: ["Scht", "St", "Sch"]
                answer: "St"
                feedback:
                  Scht: "Du hörst scht. Am Wortanfang schreibst du aber nur St."
                  Sch: "Hör genau hin: Nach dem sch kommt noch ein t. Das schreibst du St."
                hints:
                  - "Hör noch einmal hin."
                  - "Hörst du nach dem sch ein t? Dann schreibst du am Anfang St."
                  - "Stein schreibt man mit St."
              - id: l1-f3
                type: true_false
                text: "Hörst du am Anfang scht?"
                say: "Stuhl. Hörst du am Anfang ein scht?"
                show: { object: chair }
                answer: true
                hints:
                  - "Sag das Wort mit: Stuhl."
                  - "Scht ... uhl. Kommt nach dem sch ein t?"
                  - "Ja, Stuhl fängt mit scht an. Man schreibt St."
                difficulty: easy
              - id: l1-f4
                type: true_false
                text: "Hörst du am Anfang scht?"
                say: "Schuh. Hörst du am Anfang ein scht?"
                show: { object: shoe }
                answer: false
                hints:
                  - "Sag das Wort mit: Schuh."
                  - "Kommt nach dem sch ein t, oder gleich das u?"
                  - "Nein, bei Schuh kommt nach dem sch gleich das u."
              - id: l1-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Stern. Was fehlt am Anfang?"
                show: { object: star }
                frame: "_ern"
                options: ["Sch", "St", "S"]
                answer: ["St"]
                hints:
                  - "Sprich das Wort langsam: Stern."
                  - "Du hörst scht. Wie schreibt man das am Wortanfang?"
                  - "Vorne fehlt St."
              - id: l1-f6
                type: tracing
                text: "Schreib St nach."
                show: { drawn: writing-lines, text: "St", mode: trace, arrows: true }
                char: "St"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Wie schreibt man den Anfang?"
                audio: { de: "Stift." }
                options: ["Sch", "St", "Scht"]
                answer: "St"
                hints: ["Scht am Anfang schreibt man kurz."]
              - id: l1-s2
                type: true_false
                text: "Hörst du am Anfang scht?"
                say: "Schere. Hörst du am Anfang ein scht?"
                show: { object: scissors }
                answer: false
                hints: ["Kommt nach dem sch ein t?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf jedes St."
                say: "Tippe auf jede Karte mit S und t."
                show: { drawn: letter-card, text: "St Sch st S St" }
                spans: ["St", "st", "St"]
                hints: ["Es sind drei. Ein S allein reicht nicht."]
              - id: l1-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Stuhl. Was fehlt am Anfang?"
                show: { object: chair }
                frame: "_uhl"
                options: ["Scht", "St"]
                answer: ["St"]
                hints: ["Du hörst scht, schreibst aber kürzer."]
              - id: l1-s5
                type: tracing
                text: "Schreib st nach."
                show: { drawn: writing-lines, text: "st", mode: trace, arrows: true }
                char: "st"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Was fängt mit St an?"
                say: "Welches Wort fängt mit St an?"
                options: [{ object: snail }, { object: chair }, { object: sock }]
                answer: chair
              - id: l1-n2
                type: audio_choice
                text: "Wie schreibt man den Anfang?"
                audio: { de: "Stall." }
                options: ["St", "Scht", "Sch"]
                answer: "St"
              - id: l1-n3
                type: audio_choice
                text: "Wie schreibt man den Anfang?"
                audio: { de: "Schal." }
                options: ["St", "Sch"]
                answer: "Sch"
              - id: l1-n4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Stiefel. Was fehlt am Anfang?"
                frame: "_iefel"
                options: ["Sch", "Scht", "St"]
                answer: ["St"]
              - id: l1-n5
                type: tracing
                text: "Schreib St ab."
                show: { drawn: writing-lines, text: "St", mode: copy, arrows: false }
                char: "St"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was fängt mit St an?"
            say: "Welches Wort fängt mit St an?"
            options: [{ object: scissors }, { object: star }, { object: saw }]
            answer: star
          - id: l1-c2
            type: audio_choice
            text: "Wie schreibt man den Anfang?"
            audio: { de: "Storch." }
            options: ["Sch", "St"]
            answer: "St"
          - id: l1-c3
            type: true_false
            text: "Hörst du am Anfang scht?"
            say: "Sonne. Hörst du am Anfang ein scht?"
            show: { object: sun }
            answer: false

  - n: 2
    title: { de: Das Sp, en: Sp at the start }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Wie schreibt man den Anfang?"
            audio: { de: "Stern." }
            options: ["St", "Sch"]
            answer: "St"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Was fängt mit St an?"
            say: "Welches Wort fängt mit St an?"
            options: [{ object: shoe }, { object: chair }]
            answer: chair
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Sp sp"
            say: "Hier stehen S und p zusammen: Sp. Am Wortanfang sprichst du sie wie schp. Du schreibst aber nur Sp."
            show: { drawn: letter-card, text: "Sp sp" }
          - text: "Spiegel"
            say: "Spiegel. Schp ... iegel. Du hörst schp und schreibst Sp."
            show: { object: mirror }
          - text: "Spinnennetz"
            say: "Spinnennetz. Schp ... innennetz. Auch hier steht am Anfang nur Sp."
            show: { object: web }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Was fängt mit Sp an?"
                say: "Welches Wort fängt mit Sp an? Du hörst dann am Anfang schp."
                options: [{ object: mirror }, { object: star }, { object: snake }]
                answer: mirror
                feedback:
                  star: "Stern fängt mit St an. Da hörst du scht, nicht schp."
                  snake: "Schlange fängt mit sch an. Danach kommt kein p."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den Anfang."
                  - "Spiegel ... schp. Stern ... scht. Schlange ... sch."
                  - "Spiegel fängt mit Sp an."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Wie schreibt man den Anfang?"
                audio: { de: "Spiel." }
                options: ["Sp", "Schp", "St"]
                answer: "Sp"
                feedback:
                  Schp: "Du hörst schp. Am Wortanfang schreibst du aber nur Sp."
                  St: "Nach dem sch hörst du ein p, kein t."
                hints:
                  - "Hör noch einmal hin."
                  - "Kommt nach dem sch ein p? Dann schreibst du am Anfang Sp."
                  - "Spiel schreibt man mit Sp."
              - id: l2-f3
                type: true_false
                text: "Hörst du am Anfang schp?"
                say: "Spinnennetz. Hörst du am Anfang ein schp?"
                show: { object: web }
                answer: true
                hints:
                  - "Sag das Wort mit: Spinnennetz."
                  - "Schp ... innennetz. Gehen nach dem sch die Lippen zu?"
                  - "Ja, Spinnennetz fängt mit schp an. Man schreibt Sp."
                difficulty: easy
              - id: l2-f4
                type: true_false
                text: "Hörst du am Anfang schp?"
                say: "Stuhl. Hörst du am Anfang ein schp?"
                show: { object: chair }
                answer: false
                hints:
                  - "Sag das Wort mit: Stuhl."
                  - "Kommt nach dem sch ein p oder ein t?"
                  - "Nein, Stuhl fängt mit scht an."
              - id: l2-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Spiegel. Was fehlt am Anfang?"
                show: { object: mirror }
                frame: "_iegel"
                options: ["St", "Sch", "Sp"]
                answer: ["Sp"]
                hints:
                  - "Sprich das Wort langsam: Spiegel."
                  - "Du hörst schp. Wie schreibt man das am Wortanfang?"
                  - "Vorne fehlt Sp."
              - id: l2-f6
                type: tracing
                text: "Schreib Sp nach."
                show: { drawn: writing-lines, text: "Sp", mode: trace, arrows: true }
                char: "Sp"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Wie schreibt man den Anfang?"
                audio: { de: "Sport." }
                options: ["St", "Schp", "Sp"]
                answer: "Sp"
                hints: ["Schp am Anfang schreibt man kurz."]
              - id: l2-s2
                type: true_false
                text: "Hörst du am Anfang schp?"
                say: "Springen. Hörst du am Anfang ein schp?"
                show: { object: jump }
                answer: true
                hints: ["Sprich es langsam: Schp ... ringen."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf jedes Sp."
                say: "Tippe auf jede Karte mit S und p."
                show: { drawn: letter-card, text: "Sp St sp S Sp" }
                spans: ["Sp", "sp", "Sp"]
                hints: ["Es sind drei. Nach dem S muss ein p stehen."]
              - id: l2-s4
                type: audio_choice
                text: "Sp oder St?"
                audio: { de: "Spaten." }
                options: ["St", "Sp"]
                answer: "Sp"
                hints: ["Gehen nach dem sch die Lippen zu?"]
              - id: l2-s5
                type: tracing
                text: "Schreib sp nach."
                show: { drawn: writing-lines, text: "sp", mode: trace, arrows: true }
                char: "sp"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Was fängt mit Sp an?"
                say: "Welches Wort fängt mit Sp an?"
                options: [{ object: star }, { object: sun }, { object: jump }]
                answer: jump
              - id: l2-n2
                type: audio_choice
                text: "Sp oder St?"
                audio: { de: "Stadt." }
                options: ["Sp", "St"]
                answer: "St"
              - id: l2-n3
                type: audio_choice
                text: "Wie schreibt man den Anfang?"
                audio: { de: "Spinne." }
                options: ["Schp", "Sp", "Sch"]
                answer: "Sp"
              - id: l2-n4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Spinnennetz. Was fehlt am Anfang?"
                show: { object: web }
                frame: "_innennetz"
                options: ["Sp", "Schp"]
                answer: ["Sp"]
              - id: l2-n5
                type: tracing
                text: "Schreib Sp ab."
                show: { drawn: writing-lines, text: "Sp", mode: copy, arrows: false }
                char: "Sp"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Was fängt mit Sp an?"
            say: "Welches Wort fängt mit Sp an?"
            options: [{ object: chair }, { object: web }, { object: snow }]
            answer: web
          - id: l2-c2
            type: audio_choice
            text: "Sp oder St?"
            audio: { de: "Spitze." }
            options: ["Sp", "St"]
            answer: "Sp"
          - id: l2-c3
            type: true_false
            text: "Hörst du am Anfang schp?"
            say: "Stern. Hörst du am Anfang ein schp?"
            show: { object: star }
            answer: false

  - n: 3
    title: { de: Das Pf, en: The sound pf }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: audio_choice
            text: "Sp oder St?"
            audio: { de: "Stiefel." }
            options: ["St", "Sp"]
            answer: "St"
            difficulty: easy
          - id: l3-w2
            type: image_multiple_choice
            text: "Was fängt mit Sp an?"
            say: "Welches Wort fängt mit Sp an?"
            options: [{ object: mirror }, { object: star }]
            answer: mirror
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Pf pf"
            say: "Hier stehen P und f zusammen: Pf. Du sprichst sie schnell nacheinander: pf. Erst gehen die Lippen zu, dann bläst es. Wie bei Pferd."
            show: { drawn: letter-card, text: "Pf pf" }
          - text: "Apfel"
            say: "Apfel. A ... pf ... el. Hier steckt das pf in der Mitte."
            show: { object: apple }
          - text: "Kopf"
            say: "Kopf. Ko ... pf. Hier steht das pf am Ende."
            show: { object: head }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: image_multiple_choice
                text: "Wo hörst du ein pf?"
                say: "In welchem Wort hörst du ein pf?"
                options: [{ object: apple }, { object: monkey }, { object: anchor }]
                answer: apple
                feedback:
                  monkey: "Bei Affe bläst es nur: fff. Bei Apfel gehen vorher die Lippen zu: pf."
                  anchor: "Bei Anker hörst du kein pf."
                hints:
                  - "Sprich jedes Wort langsam. Gehen die Lippen kurz zu, bevor es bläst?"
                  - "Apfel ... pf. Affe ... fff. Anker ... nk."
                  - "In Apfel hörst du ein pf."
                difficulty: easy
              - id: l3-f2
                type: audio_choice
                text: "Wie fängt das Wort an?"
                audio: { de: "Pferd." }
                options: ["F", "Pf", "P"]
                answer: "Pf"
                feedback:
                  F: "Hör genau hin: Vor dem fff gehen die Lippen kurz zu. Das ist pf."
                  P: "Nach dem p bläst es noch: pf."
                hints:
                  - "Hör noch einmal hin."
                  - "Sprich es nach: Pferd. Gehen erst die Lippen zu, und dann bläst es?"
                  - "Lippen zu und blasen: Das ist Pf."
              - id: l3-f3
                type: true_false
                text: "Hörst du am Ende pf?"
                say: "Kopf. Hörst du am Ende ein pf?"
                show: { object: head }
                answer: true
                hints:
                  - "Sag das Wort langsam: Kopf."
                  - "Ko ... pf. Gehen am Ende die Lippen zu, und dann bläst es?"
                  - "Ja, Kopf hört mit pf auf."
              - id: l3-f4
                type: true_false
                text: "Hörst du am Anfang pf?"
                say: "Fisch. Hörst du am Anfang ein pf?"
                show: { object: fish }
                answer: false
                hints:
                  - "Sag das Wort mit: Fisch."
                  - "Gehen am Anfang die Lippen zu, oder bläst es gleich?"
                  - "Nein, Fisch fängt nur mit fff an."
              - id: l3-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Apfel. Was fehlt in dem Wort?"
                show: { object: apple }
                frame: "A_el"
                options: ["f", "pf", "p"]
                answer: ["pf"]
                hints:
                  - "Sprich das Wort langsam: Apfel."
                  - "A ... pf ... el. Hörst du p und f?"
                  - "Es fehlt pf."
              - id: l3-f6
                type: tracing
                text: "Schreib Pf nach."
                show: { drawn: writing-lines, text: "Pf", mode: trace, arrows: true }
                char: "Pf"
                difficulty: easy

          - support: some
            tasks:
              - id: l3-s1
                type: audio_choice
                text: "Wie fängt das Wort an?"
                audio: { de: "Pfanne." }
                options: ["Pf", "P", "F"]
                answer: "Pf"
                hints: ["Gehen erst die Lippen zu, und dann bläst es?"]
              - id: l3-s2
                type: true_false
                text: "Hörst du ein pf?"
                say: "Affe. Hörst du in dem Wort ein pf?"
                show: { object: monkey }
                answer: false
                hints: ["Gehen in der Mitte die Lippen zu?"]
              - id: l3-s3
                type: highlight_in_text
                text: "Tippe auf jedes Pf."
                say: "Tippe auf jede Karte mit P und f."
                show: { drawn: letter-card, text: "Pf P pf F Pf" }
                spans: ["Pf", "pf", "Pf"]
                hints: ["Es sind drei. Es braucht beide Buchstaben."]
              - id: l3-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Kopf. Was fehlt am Ende?"
                show: { object: head }
                frame: "Ko_"
                options: ["f", "pf"]
                answer: ["pf"]
                hints: ["Gehen am Ende die Lippen zu?"]
              - id: l3-s5
                type: tracing
                text: "Schreib pf nach."
                show: { drawn: writing-lines, text: "pf", mode: trace, arrows: true }
                char: "pf"
                difficulty: easy

          - support: none
            tasks:
              - id: l3-n1
                type: audio_choice
                text: "Wie fängt das Wort an?"
                audio: { de: "Pfote." }
                options: ["P", "F", "Pf"]
                answer: "Pf"
              - id: l3-n2
                type: audio_choice
                text: "Wie fängt das Wort an?"
                audio: { de: "Feder." }
                options: ["Pf", "F"]
                answer: "F"
              - id: l3-n3
                type: true_false
                text: "Hörst du ein pf?"
                say: "Äpfel. Hörst du in dem Wort ein pf?"
                show: { object: apple, count: 3, layout: row }
                answer: true
                difficulty: easy
              - id: l3-n4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Topf. Was fehlt am Ende?"
                frame: "To_"
                options: ["p", "pf", "f"]
                answer: ["pf"]
              - id: l3-n5
                type: tracing
                text: "Schreib pf ab."
                show: { drawn: writing-lines, text: "pf", mode: copy, arrows: false }
                char: "pf"

      - activity: check
        size: quick
        tasks:
          - id: l3-c1
            type: image_multiple_choice
            text: "Wo hörst du ein pf?"
            say: "In welchem Wort hörst du ein pf?"
            options: [{ object: fish }, { object: head }, { object: foot }]
            answer: head
          - id: l3-c2
            type: audio_choice
            text: "Wie fängt das Wort an?"
            audio: { de: "Pflaster." }
            options: ["F", "Pf"]
            answer: "Pf"
          - id: l3-c3
            type: true_false
            text: "Hörst du am Anfang pf?"
            say: "Fuß. Hörst du am Anfang ein pf?"
            show: { object: foot }
            answer: false

  - n: 4
    title: { de: "Wörter mit St, Sp und Pf", en: "Words with St, Sp and Pf" }
    new_content: false
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l4-w1
            type: audio_choice
            text: "Wie fängt das Wort an?"
            audio: { de: "Pfeife." }
            options: ["Pf", "F"]
            answer: "Pf"
            difficulty: easy
          - id: l4-w2
            type: image_multiple_choice
            text: "Wo hörst du ein pf?"
            say: "In welchem Wort hörst du ein pf?"
            options: [{ object: monkey }, { object: apple }]
            answer: apple
            difficulty: easy

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l4-f1
                type: sorting
                text: "St oder Sp?"
                say: "Hörst du am Anfang scht oder schp? Tippe auf ein Bild und dann auf die Buchstaben."
                bins:
                  - { id: st, show: { text: "St" } }
                  - { id: sp, show: { text: "Sp" } }
                options:
                  - { object: star, bin: st }
                  - { object: mirror, bin: sp }
                  - { object: chair, bin: st }
                  - { object: web, bin: sp }
                hints:
                  - "Tippe auf jedes Bild und hör auf den Anfang."
                  - "Scht schreibt man St. Schp schreibt man Sp."
                  - "Stern und Stuhl: St. Spiegel und Spinnennetz: Sp."
              - id: l4-f2
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Stern" }
                options: [{ object: sun }, { object: star }, { object: snail }]
                answer: star
                hints:
                  - "St am Anfang liest du scht."
                  - "Scht ... ern."
                  - "Stern."
                difficulty: easy
              - id: l4-f3
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Spiegel", syllables: ["Spie", "gel"] }
                options: [{ object: star }, { object: scissors }, { object: mirror }]
                answer: mirror
                hints:
                  - "Sp am Anfang liest du schp."
                  - "Spie ... gel."
                  - "Spiegel."
              - id: l4-f4
                type: audio_choice
                text: "Welches Wort hörst du?"
                say: "Hör gut zu. Welches Wort hörst du? Lies die Karten."
                audio: { de: "Pferd." }
                options: ["Pfeil", "Pferd", "fährt"]
                answer: "Pferd"
                hints:
                  - "Hör auf den Anfang und auf das Ende."
                  - "Pf ... erd. Zwei Karten fangen mit Pf an."
                  - "Das Wort ist Pferd."
              - id: l4-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Zopf. Was fehlt am Ende?"
                frame: "Zo_"
                options: ["f", "p", "pf"]
                answer: ["pf"]
                hints:
                  - "Sprich das Wort langsam bis zum Ende: Zopf."
                  - "Gehen am Ende die Lippen zu, und dann bläst es?"
                  - "Am Ende fehlt pf."

          - support: some
            tasks:
              - id: l4-s1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Stuhl" }
                options: [{ object: table }, { object: chair }, { object: star }]
                answer: chair
                hints: ["Scht ... uhl."]
              - id: l4-s2
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Kopf" }
                options: [{ object: cup }, { object: cat }, { object: head }]
                answer: head
                hints: ["K ... o ... pf."]
              - id: l4-s3
                type: true_false
                text: "Stimmt das?"
                say: "Lies die Karte. Steht hier Spiel?"
                show: { drawn: word-card, text: "Spiel" }
                answer: true
                hints: ["Sp am Anfang liest du schp: Schp ... iel."]
              - id: l4-s4
                type: audio_choice
                text: "Wie schreibt man den Anfang?"
                audio: { de: "Straße." }
                options: ["Sp", "St", "Scht"]
                answer: "St"
                hints: ["Scht am Wortanfang schreibt man kurz."]
              - id: l4-s5
                type: matching
                text: "Was gehört zusammen?"
                say: "Tippe auf ein Bild und dann auf die Buchstaben, die du darin hörst."
                pairs:
                  - left: { object: star }
                    right: { text: "St" }
                  - left: { object: mirror }
                    right: { text: "Sp" }
                  - left: { object: apple }
                    right: { text: "pf" }
                hints: ["Sprich jedes Wort langsam: Stern, Spiegel, Apfel."]

          - support: none
            tasks:
              - id: l4-n1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Spinnennetz", syllables: ["Spin", "nen", "netz"] }
                options: [{ object: mirror }, { object: web }, { object: star }]
                answer: web
                difficulty: stretch
              - id: l4-n2
                type: audio_choice
                text: "Welches Wort hörst du?"
                say: "Hör gut zu. Welches Wort hörst du? Lies die Karten."
                audio: { de: "Stein." }
                options: ["Schein", "Stein", "Spiel"]
                answer: "Stein"
              - id: l4-n3
                type: audio_choice
                text: "Wie fängt das Wort an?"
                audio: { de: "Pfütze." }
                options: ["F", "P", "Pf"]
                answer: "Pf"
              - id: l4-n4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Springen. Was fehlt am Anfang?"
                show: { object: jump }
                frame: "_ringen"
                options: ["St", "Schp", "Sp"]
                answer: ["Sp"]
              - id: l4-n5
                type: true_false
                text: "Stimmt das?"
                say: "Lies die Karte. Steht hier Stuhl?"
                show: { drawn: word-card, text: "Stiel" }
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l4-c1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Spiegel" }
            options: [{ object: snail }, { object: mirror }, { object: star }]
            answer: mirror
          - id: l4-c2
            type: audio_choice
            text: "Wie schreibt man den Anfang?"
            audio: { de: "Stunde." }
            options: ["Scht", "Sch", "St"]
            answer: "St"
          - id: l4-c3
            type: audio_choice
            text: "Wie schreibt man den Anfang?"
            audio: { de: "Spaß." }
            options: ["Sp", "Schp", "Sch"]
            answer: "Sp"
          - id: l4-c4
            type: audio_choice
            text: "Wie fängt das Wort an?"
            audio: { de: "Pfirsich." }
            options: ["Pf", "F", "P"]
            answer: "Pf"
          - id: l4-c5
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Äpfel. Was fehlt in dem Wort?"
            show: { object: apple, count: 3, layout: row }
            frame: "Ä_el"
            options: ["f", "pf"]
            answer: ["pf"]
