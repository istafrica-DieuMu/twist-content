                options: ["Wir kaufen Brot, Käse und Eier.", "Wir kaufen Brot Käse und Eier.", "Wir kaufen Brot, Käse, und Eier."]
                answer: "Wir kaufen Brot, Käse und Eier."
                option_audio: false
