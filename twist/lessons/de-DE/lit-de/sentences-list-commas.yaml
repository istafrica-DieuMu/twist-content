                  "true": "Am Ende einer Aufzählung steht vor und kein Komma. Richtig ist: Stifte, Papier und Kleber."
                hints:
                  - "Schau auf die Stelle vor und."
                  - "Vor und steht in einer Aufzählung kein Komma."
                  - "Nein. Richtig ist: Stifte, Papier und Kleber."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viele Kommas fehlen? „Lea Tom Mia und Ben spielen Fangen.“"
                say: "Lies den Satz. Wie viele Kommas fehlen?"
