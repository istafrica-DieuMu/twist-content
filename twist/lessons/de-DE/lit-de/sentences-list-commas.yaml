      - activity: learn
        mode: demonstration
        screens:
          - text: "Im Korb liegen Äpfel, Birnen und Bananen."
            say: "Zählst du mehrere Dinge auf, trennst du sie mit Kommas: Im Korb liegen Äpfel, Birnen und Bananen. Vor dem letzten Ding steht oft und. Vor und steht dann kein Komma."
          - text: "Ich mag Rot, Blau, Grün und Gelb."
            say: "Ich mag Rot, Blau, Grün und Gelb. Egal, wie viele Dinge es sind: Zwischen allen steht ein Komma, nur vor und nicht."
          - text: "Willst du Saft, Milch oder Wasser?"
            say: "Willst du Saft, Milch oder Wasser? Bei oder ist es genauso: Vor oder steht kein Komma."

      - activity: practise
        setting: plain
        stages:
