    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Setz das Satzzeichen."
            say: "Welches Zeichen gehört ans Ende?"
            frame: "Hast du heute Zeit_"
            options: ["?", ".", "!"]
            answer: ["?"]
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Setz das Satzzeichen."
            say: "Welches Zeichen gehört ans Ende?"
            frame: "Wir fahren morgen ans Meer_"
