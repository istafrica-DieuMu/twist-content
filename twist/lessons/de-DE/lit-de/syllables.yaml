                hints:
                  - "Klatsch jedes Wort langsam."
                  - "Ba ... na ... ne: dreimal. Lam ... pe: zweimal."
                  - "Banane und Giraffe dreimal, Lampe und Nase zweimal."
              - id: l2-f5
