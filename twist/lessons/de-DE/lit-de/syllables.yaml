                  - { id: "2", show: { drawn: dots, count: 2, layout: row }, say: { de: "Zweimal klatschen." } }
                options:
                  - { object: ball, bin: "1" }
                  - { object: rabbit, bin: "2" }
                  - { object: fish, bin: "1" }
                  - { object: sock, bin: "2" }
                hints:
                  - "Tippe auf ein Bild, hör das Wort und klatsch mit."
                  - "Ball: einmal. Hase: Ha ... se, zweimal."
