                text: "Wie oft klatschst du?"
                say: "Igel. Klatsch das Wort mit. Wie oft hast du geklatscht?"
                show: { object: hedgehog }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "2"
                hints: ["I ... und weiter?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Wie oft klatschst du?"
                say: "Baum. Klatsch das Wort mit. Wie oft hast du geklatscht?"
                show: { object: tree }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "1"
              - id: l1-n2
                type: image_multiple_choice
                text: "Wie oft klatschst du?"
                say: "Giraffe. Klatsch das Wort mit. Wie oft hast du geklatscht?"
                show: { object: giraffe }
