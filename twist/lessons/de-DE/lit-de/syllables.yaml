# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.syllables
skill: lit-de.phonological.syllables
curriculum: de-DE
language: de
title:
  de: Silben klatschen
  en: Clapping syllables
summary: >
  Children clap words into syllables and say how many there are: Ball is
  one clap, Ha-se two, Ba-na-ne three. Each clap is shown as a dot, so the
  answers need no reading. Lesson 1 claps and counts; lesson 2 sorts words
  by their number of syllables, pairs words with their claps and ends with
  the skill check.
metadata:
  year: klasse-1
  topic: { de: Laute hören, en: Hearing sounds }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: [lit-de.phonological.rhymes]
  vocabulary: { de: [Silbe, klatschen, langsam sprechen] }
  no_reading: true
  forms: [picture, drawn, audio]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: sounds-not-syllables
      what: Claps every sound (B-a-ll) instead of every syllable
      addressed: Learn claps whole word parts; hints say each part as it is clapped ("Ba ... na ... ne")
    - id: word-length
      what: Thinks a big thing has a long word (Kuh is big, so many syllables)
      addressed: tasks set a big animal with a short word (Kuh) against a small one with a long word (Schmetterling)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Wörter klatschen, en: Clapping words }
    new_content: true
    activities:
      - activity: learn
        mode: do-it-with-me
        screens:
          - say: "Wir klatschen Wörter. Ball. Einmal klatschen: Ball. Ball hat eine Silbe."
            show: { object: ball }
          - say: "Hase. Klatsch mit: Ha ... se. Zweimal geklatscht. Hase hat zwei Silben."
            show: { object: rabbit }
          - say: "Banane. Klatsch mit: Ba ... na ... ne. Dreimal geklatscht. Banane hat drei Silben."
            show: { object: banana }
          - say: "Für jedes Klatschen malen wir einen Punkt. Drei Punkte heißen: dreimal geklatscht."
            show: { drawn: dots, count: 3, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Wie oft klatschst du?"
                say: "Sonne. Klatsch das Wort mit. Wie oft hast du geklatscht?"
                show: { object: sun }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "2"
                hints:
                  - "Sprich das Wort langsam und klatsch bei jedem Teil."
                  - "Son ... ne."
                  - "Zweimal: Sonne hat 2 Silben."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Wie oft klatschst du?"
                say: "Hund. Klatsch das Wort mit. Wie oft hast du geklatscht?"
                show: { object: dog }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "1"
                hints:
                  - "Sprich das Wort und klatsch dabei."
                  - "Hund. Nur ein Teil."
                  - "Einmal: Hund hat 1 Silbe."
                difficulty: easy
              - id: l1-f3
                type: image_multiple_choice
                text: "Wie oft klatschst du?"
                say: "Ameise. Klatsch das Wort mit. Wie oft hast du geklatscht?"
                show: { object: ant }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "3"
                hints:
                  - "Sprich das Wort ganz langsam."
                  - "A ... mei ... se."
                  - "Dreimal: Ameise hat 3 Silben."
              - id: l1-f4
                type: true_false
                text: "Klatschst du zweimal?"
                say: "Katze. Klatschst du bei Katze zweimal?"
                show: { object: cat }
                answer: true
                hints:
                  - "Klatsch das Wort mit."
                  - "Kat ... ze."
                  - "Ja, zweimal."
              - id: l1-f5
                type: image_multiple_choice
                text: "Wie oft klatschst du?"
                say: "Kuh. Klatsch das Wort mit. Wie oft hast du geklatscht?"
                show: { object: cow }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "1"
                feedback:
                  "3": "Eine Kuh ist groß, aber das Wort ist kurz: Kuh. Nur einmal klatschen."
                hints:
                  - "Achte auf das Wort, nicht darauf, wie groß das Tier ist."
                  - "Kuh. Nur ein Teil."
                  - "Einmal: Kuh hat 1 Silbe."
              - id: l1-f6
                type: image_multiple_choice
                text: "Wie oft klatschst du?"
                say: "Schmetterling. Klatsch das Wort mit. Wie oft hast du geklatscht?"
                show: { object: butterfly }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "3"
                hints:
                  - "Ein langes Wort! Sprich es langsam."
                  - "Schmet ... ter ... ling."
                  - "Dreimal: Schmetterling hat 3 Silben."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wie oft klatschst du?"
                say: "Lampe. Klatsch das Wort mit. Wie oft hast du geklatscht?"
                show: { object: lamp }
                options:
                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "2"
                hints: ["Sprich langsam und klatsch bei jedem Teil."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Wie oft klatschst du?"
                say: "Fisch. Klatsch das Wort mit. Wie oft hast du geklatscht?"
                show: { object: fish }
                options:
