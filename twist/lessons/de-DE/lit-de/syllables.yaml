                text: "Welches Wort hat 3 Silben?"
                say: "Welches Wort klatschst du dreimal?"
                options: [{ object: ball }, { object: elephant }, { object: rose }]
                answer: elephant
                hints: ["Tippe auf die Bilder und klatsch jedes Wort mit."]
              - id: l1-s6
