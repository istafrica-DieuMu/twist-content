                  - { drawn: dots, count: 1, layout: row }
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "3"
              - id: l1-n3
                type: true_false
                text: "Klatschst du einmal?"
                say: "Brot. Klatschst du bei Brot einmal?"
                show: { object: bread }
                answer: true
              - id: l1-n4
