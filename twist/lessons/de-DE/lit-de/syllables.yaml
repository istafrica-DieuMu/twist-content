                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                answer: "1"
                hints: ["Hat das Wort mehr als einen Teil?"]
              - id: l1-s3
                type: true_false
                text: "Klatschst du dreimal?"
                say: "Hose. Klatschst du bei Hose dreimal?"
                show: { object: trousers }
                answer: false
