                answer: "Kindergarten"
                option_audio: false
                hints: ["Der letzte Teil ist ein Ort mit Blumen."]
              - id: l2-s3
                type: matching
                text: "Lies die Wörter. Was passt zusammen?"
                say: "Lies jedes Wort und verbinde es mit dem passenden Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Feuerwehrmann" }, right: { object: firefighter } }
                  - { left: { text: "Spinnennetz" }, right: { object: web } }
                  - { left: { text: "Fahrrad" }, right: { object: bike } }
                hints: ["Lies jedes Wort in seinen Teilen: Feuer, wehr, mann."]
              - id: l2-s4
                type: true_false
                text: "Lies schnell. Ist es ein Tier?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Ist es ein Tier?"
                show: { drawn: letter-card, text: "Gitarre", flash: 2 }
                answer: false
                hints: ["Ist es Giraffe oder Gitarre? Schau auf die Mitte."]
              - id: l2-s5
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "freundlich", flash: 2 }
                options: ["freundlich", "Freundin", "Freunde"]
                answer: "freundlich"
                option_audio: false
                hints: ["Schau auf das Ende: lich, in oder e?"]

          - support: none
            tasks:
