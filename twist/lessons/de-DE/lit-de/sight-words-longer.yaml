                text: "Tippe auf das Obst."
                say: "Lies die Wörter genau. Tippe auf alle Obstsorten."
                show: { drawn: letter-card, text: "Erdbeere Erdkugel Banane Birne Bürste" }
                spans: ["Erdbeere", "Banane", "Birne"]
              - id: l2-n2
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "Weihnachten", flash: 2 }
                options: ["Weihnachten", "Wochenende", "Winterjacke"]
                answer: "Weihnachten"
                option_audio: false
              - id: l2-n3
                type: matching
                text: "Lies die Wörter. Was passt zusammen?"
                say: "Lies jedes Wort und verbinde es mit dem passenden Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Schmetterling" }, right: { object: butterfly } }
                  - { left: { text: "Schnecke" }, right: { object: snail } }
                  - { left: { text: "Schlange" }, right: { object: snake } }
              - id: l2-n4
                type: true_false
                text: "Lies schnell. Ist es ein Wochentag?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Ist es ein Wochentag?"
                show: { drawn: letter-card, text: "Samstag", flash: 2 }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "natürlich", flash: 2 }
                options: ["natürlich", "nämlich", "nachher"]
                answer: "natürlich"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Lies schnell. Welches Wort war es?"
            say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
            show: { drawn: letter-card, text: "Schultasche", flash: 2 }
