# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.sight-words-longer
skill: lit-de.fluency.sight-words-longer
curriculum: de-DE
language: de
title:
  de: Lange Wörter blitzlesen
  en: Flash reading longer words
summary: >
  Recognising longer words of the Grundwortschatz at a glance. Lesson 1
  flashes a word for two seconds and the child picks it from words with
  the same beginning (Hausaufgaben, Hausmeister, Haustür) or finds its
  picture; lesson 2 sees long words in parts, finds them among look-alikes
  on cards, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Blitzlesen, en: Flash reading }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.fluency.function-words, lit-de.decoding.longer-words]
  also_practises: [lit-de.spelling.core-vocabulary]
  vocabulary: { de: [Blitzlesen, Wortanfang, Wortende, Silbe] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card, syllable-arcs]
  facets: []
  misconceptions:
    - id: start-and-guess
      what: Reads the first letters and guesses the rest, so words with the same beginning get mixed up (Mittwoch and Mittag, Frühstück and Frühling)
      addressed: "every flash task offers words with the same beginning; lesson 2 Learn sets Mittwoch against Mittag; l1-f1 and l2-f2 give feedback on the look-alike"
    - id: letter-by-letter
      what: Spells a long word out letter by letter and runs out of time before the word is gone
      addressed: "lesson 1 Learn reads Schmetterling in syllables and lesson 2 Learn in word parts (Haus, auf, gaben); the full-stage hints point to the parts"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Auf einen Blick", en: "At a glance" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Lies schnell. Welches Wort war es?"
            say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
            show: { drawn: letter-card, text: "nicht", flash: 2 }
            options: ["nicht", "nichts", "noch"]
            answer: "nicht"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Tippe auf das Bild."
            say: "Lies das Wort Silbe für Silbe. Tippe dann auf das passende Bild."
            show: { drawn: syllable-arcs, word: Telefon, syllables: [Te, le, fon] }
            options: [{ object: telephone }, { object: elephant }, { object: table }]
            answer: telephone
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Schmetterling"
            say: "Schau dir dieses lange Wort an. Es ist gleich wieder weg."
            show: { drawn: letter-card, text: "Schmetterling", flash: 2 }
          - text: "Schmet | ter | ling"
            say: "Ein langes Wort liest du schneller in Silben: Schmet, ter, ling. Schmetterling. Du musst nicht jeden Buchstaben einzeln lesen."
            show: { drawn: syllable-arcs, word: Schmetterling, syllables: [Schmet, ter, ling] }
          - text: "Frühstück | Frühling"
            say: "Pass auf: Viele Wörter fangen gleich an. Frühstück und Frühling beginnen beide mit früh. Schau deshalb bis zum Ende des Wortes."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "Frühstück", flash: 2 }
                options: ["Frühstück", "Frühling", "Frühjahr"]
                answer: "Frühstück"
                option_audio: false
                feedback:
                  "Frühling": "Frühling fängt auch mit früh an. Schau dir das Ende noch einmal an."
                  "Frühjahr": "Frühjahr fängt auch mit früh an. Schau dir das Ende noch einmal an."
                hints:
                  - "Tippe auf „Nochmal sehen“ und lies das Wort bis zum Ende."
                  - "Alle drei Wörter fangen mit früh an. Wie geht das Wort weiter?"
                  - "Es war Frühstück."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Lies schnell. Tippe auf das Bild."
                say: "Das Wort ist gleich wieder weg. Lies es schnell und tippe auf das passende Bild."
                show: { drawn: letter-card, text: "Bleistift", flash: 2 }
                options: [{ object: pencil }, { object: crayon }, { object: ruler }]
                answer: pencil
                hints:
                  - "Tippe auf „Nochmal sehen“. Lies das Wort in zwei Teilen."
                  - "Das Wort fängt mit Blei an, nicht mit Bunt."
                  - "Es war Bleistift. Tippe auf den Bleistift."
              - id: l1-f3
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "Hausaufgaben", flash: 2 }
                options: ["Hausaufgaben", "Hausmeister", "Haustür"]
                answer: "Hausaufgaben"
                option_audio: false
                hints:
                  - "Tippe auf „Nochmal sehen“. Das Wort hat drei Teile."
                  - "Nach Haus kommt auf."
                  - "Es war Hausaufgaben."
              - id: l1-f4
                type: image_multiple_choice
                text: "Lies schnell. Tippe auf das Bild."
                say: "Das Wort ist gleich wieder weg. Lies es schnell und tippe auf das passende Bild."
                show: { drawn: letter-card, text: "Schneemann", flash: 2 }
                options: [{ object: snowman }, { object: snail }, { object: butterfly }]
                answer: snowman
                hints:
                  - "Tippe auf „Nochmal sehen“. Lies das Wort in zwei Teilen."
                  - "Der erste Teil ist Schnee. Was kann man aus Schnee bauen?"
                  - "Es war Schneemann."
              - id: l1-f5
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "Donnerstag", flash: 2 }
                options: ["Donnerstag", "Dienstag", "Donnerwetter"]
                answer: "Donnerstag"
                option_audio: false
                hints:
                  - "Tippe auf „Nochmal sehen“. Schau auf den Anfang und auf das Ende."
                  - "Es fängt mit Donner an und hört mit tag auf."
                  - "Es war Donnerstag."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "Kinderzimmer", flash: 2 }
                options: ["Kinderzimmer", "Kinderwagen", "Kindergarten"]
                answer: "Kinderzimmer"
                option_audio: false
                hints: ["Alle fangen mit Kinder an. Wie geht es weiter?"]
              - id: l1-s2
                type: image_multiple_choice
