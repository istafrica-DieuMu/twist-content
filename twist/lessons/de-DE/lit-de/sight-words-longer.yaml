                say: "Das Wort ist gleich wieder weg. Lies es schnell und tippe auf das passende Bild."
                show: { drawn: letter-card, text: "Luftballon", flash: 2 }
                options: [{ object: balloon }, { object: ball }, { object: lamp }]
                answer: balloon
                hints: ["Das Wort hat zwei Teile: Luft und Ballon."]
              - id: l1-s3
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "plötzlich", flash: 2 }
                options: ["plötzlich", "pünktlich", "fröhlich"]
                answer: "plötzlich"
                option_audio: false
                hints: ["Schau auf die ersten drei Buchstaben."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Lies schnell. Tippe auf das Bild."
                say: "Das Wort ist gleich wieder weg. Lies es schnell und tippe auf das passende Bild."
                show: { drawn: letter-card, text: "Schulranzen", flash: 2 }
                options: [{ object: schoolbag }, { object: shoe }, { object: scissors }]
                answer: schoolbag
                hints: ["Der erste Teil ist Schul. Was trägst du zur Schule?"]
              - id: l1-s5
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "Geschichte", flash: 2 }
                options: ["Geschichte", "Geschenke", "Gesichter"]
                answer: "Geschichte"
                option_audio: false
                hints: ["Lies in Silben: Ge, schich, te."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "Spielplatz", flash: 2 }
                options: ["Spielplatz", "Spielzeug", "Spiegel"]
                answer: "Spielplatz"
                option_audio: false
              - id: l1-n2
                type: image_multiple_choice
                text: "Lies schnell. Tippe auf das Bild."
                say: "Das Wort ist gleich wieder weg. Lies es schnell und tippe auf das passende Bild."
                show: { drawn: letter-card, text: "Krokodil", flash: 2 }
                options: [{ object: crocodile }, { object: cake }, { object: cow }]
                answer: crocodile
              - id: l1-n3
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "Großmutter", flash: 2 }
                options: ["Großmutter", "Großvater", "Großstadt"]
                answer: "Großmutter"
                option_audio: false
              - id: l1-n4
                type: image_multiple_choice
                text: "Lies schnell. Tippe auf das Bild."
                say: "Das Wort ist gleich wieder weg. Lies es schnell und tippe auf das passende Bild."
                show: { drawn: letter-card, text: "Erdbeere", flash: 2 }
                options: [{ object: strawberry }, { object: egg }, { object: elephant }]
                answer: strawberry
              - id: l1-n5
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "überall", flash: 2 }
                options: ["überall", "übermorgen", "überhaupt"]
                answer: "überall"
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Lies schnell. Welches Wort war es?"
            say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
            show: { drawn: letter-card, text: "Mittwoch", flash: 2 }
            options: ["Mittwoch", "Mittag", "Mitternacht"]
            answer: "Mittwoch"
            option_audio: false
          - id: l1-c2
            type: image_multiple_choice
            text: "Lies schnell. Tippe auf das Bild."
            say: "Das Wort ist gleich wieder weg. Lies es schnell und tippe auf das passende Bild."
            show: { drawn: letter-card, text: "Buntstift", flash: 2 }
            options: [{ object: crayon }, { object: pencil }, { object: rubber }]
            answer: crayon
          - id: l1-c3
            type: multiple_choice
            text: "Lies schnell. Welches Wort war es?"
            say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
            show: { drawn: letter-card, text: "vielleicht", flash: 2 }
            options: ["vielleicht", "vielmals", "leicht"]
            answer: "vielleicht"
            option_audio: false

  - n: 2
    title: { de: "Lange Wörter in Teilen", en: "Long words in parts" }
    new_content: true
    activities:
