            type: multiple_choice
            text: "Lies schnell. Welches Wort war es?"
            say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
            show: { drawn: letter-card, text: "Frühling", flash: 2 }
            options: ["Frühling", "Frühstück", "Frühjahr"]
            answer: "Frühling"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Lies schnell. Tippe auf das Bild."
            say: "Das Wort ist gleich wieder weg. Lies es schnell und tippe auf das passende Bild."
            show: { drawn: letter-card, text: "Schmetterling", flash: 2 }
            options: [{ object: butterfly }, { object: snail }, { object: snake }]
            answer: butterfly
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Haus | auf | gaben"
            say: "Viele lange Wörter sind aus kurzen Wörtern gebaut. In Hausaufgaben stecken Haus, auf und gaben. Wenn du die Teile siehst, liest du das lange Wort auf einen Blick."
          - text: "Mittwoch | Mittag"
            say: "Mittwoch und Mittag fangen gleich an. Der Unterschied steckt am Ende: woch oder tag. Lies immer das ganze Wort."
          - text: "Giraffe | Gitarre"
            say: "Auch in der Mitte kann ein Unterschied stecken. Giraffe und Gitarre sehen ähnlich aus. Schau genau hin, bevor du tippst."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tippe auf die Tiere."
                say: "Lies die Wörter genau. Tippe auf alle Tiere."
                show: { drawn: letter-card, text: "Giraffe Gitarre Elefant Kalender Krokodil" }
                spans: ["Giraffe", "Elefant", "Krokodil"]
                hints:
                  - "Lies jedes Wort bis zum Ende."
                  - "Gitarre sieht aus wie Giraffe. Aber auf einer Gitarre spielt man."
                  - "Tippe auf Giraffe, Elefant und Krokodil."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Lies schnell. Welches Wort war es?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Welches Wort war es?"
                show: { drawn: letter-card, text: "Mittag", flash: 2 }
                options: ["Mittag", "Mittwoch", "Mitte"]
                answer: "Mittag"
                option_audio: false
                feedback:
                  "Mittwoch": "Mittwoch fängt auch mit Mitt an. Wie hört das Wort auf?"
                hints:
                  - "Tippe auf „Nochmal sehen“ und schau auf das Ende."
                  - "Hört das Wort mit woch auf oder mit tag?"
                  - "Es war Mittag."
              - id: l2-f3
                type: matching
                text: "Lies die Wörter. Was passt zusammen?"
                say: "Lies jedes Wort und verbinde es mit dem passenden Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Radiergummi" }, right: { object: rubber } }
                  - { left: { text: "Mäppchen" }, right: { object: pencil-case } }
                  - { left: { text: "Lineal" }, right: { object: ruler } }
                hints:
                  - "Lies ein Wort nach dem anderen. Was liegt in deinem Mäppchen?"
                  - "Radiergummi hat die Teile Radier und Gummi."
                  - "Radiergummi zum Radiergummi, Mäppchen zum Mäppchen, Lineal zum Lineal."
              - id: l2-f4
                type: true_false
                text: "Lies schnell. Ist es ein Wochentag?"
                say: "Das Wort ist gleich wieder weg. Lies es schnell. Ist es ein Wochentag?"
                show: { drawn: letter-card, text: "Donnerwetter", flash: 2 }
                answer: false
                hints:
                  - "Tippe auf „Nochmal sehen“ und lies bis zum Ende."
                  - "Es fängt an wie Donnerstag. Aber hört es mit tag auf?"
                  - "Nein. Es war Donnerwetter. Das ist kein Wochentag."
              - id: l2-f5
                type: highlight_in_text
                text: "Tippe auf die Wochentage."
                say: "Lies die Wörter genau. Tippe auf alle Wochentage."
                show: { drawn: letter-card, text: "Mittwoch Mittag Dienstag Donnerwetter Sonntag" }
                spans: ["Mittwoch", "Dienstag", "Sonntag"]
                hints:
                  - "Ein Wochentag hört fast immer mit tag auf. Einer hört mit woch auf."
                  - "Mittag hört mit tag auf, ist aber eine Tageszeit."
                  - "Tippe auf Mittwoch, Dienstag und Sonntag."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tippe auf die Dinge zum Anziehen."
                say: "Lies die Wörter genau. Tippe auf alle Dinge, die man anziehen kann."
                show: { drawn: letter-card, text: "Pullover Polizist Jacke Schuhe Schule" }
