# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.adjectives-describe
skill: lit-de.adjectives.describe
curriculum: de-DE
language: de
title:
  de: Genau beschreiben mit Adjektiven
  en: Describing with adjectives
summary: >
  Choosing adjectives that fit and describe precisely. Lesson 1 picks the
  adjective that fits a picture and finds opposites (groß und klein, laut
  und leise); lesson 2 makes a description more precise (ein Hund →
  ein kleiner, brauner Hund), guesses a thing from adjectives, and ends
  with the skill check.
metadata:
  year: klasse-2
  topic: { de: Adjektive, en: Adjectives }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.adjectives.recognise]
  also_practises: [lit-de.adjectives.recognise]
  vocabulary: { de: [Adjektiv, Gegenteil, beschreiben, genau] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: vague-adjectives
      what: Uses only schön, gut and toll, which say little
      addressed: lesson 2 Learn shows that schön says less than rot and rund; a task in each stage asks which description says more
    - id: adjective-does-not-fit
      what: Picks an adjective that is true of the word in general, not of the picture
      addressed: lesson 1 tasks are about what the picture shows, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was passt? Was ist das Gegenteil?", en: "What fits? What is the opposite?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Der Tee ist heiß." }
            spans: ["heiß"]
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ist „leise“ ein Adjektiv?"
            say: "Lies das Wort auf der Karte. Ist es ein Adjektiv?"
            show: { drawn: letter-card, text: "leise" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Wal ist groß. Die Ameise ist klein."
            say: "Mit Adjektiven kannst du Dinge genau beschreiben. Der Wal ist groß. Die Ameise ist klein. Groß und klein sind Gegenteile."
            show: { objects: [whale, ant] }
          - text: "laut und leise · warm und kalt · alt und neu"
            say: "Viele Adjektive haben ein Gegenteil: laut und leise, warm und kalt, alt und neu."
          - text: "Die Banane ist gelb und krumm."
            say: "Schau genau hin: Welches Adjektiv passt zu dem, was du siehst? Die Banane ist gelb und krumm."
            show: { object: banana }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Adjektiv passt zum Bild?"
                say: "Schau dir das Bild an. Welches Adjektiv passt zur Erdbeere?"
                show: { object: strawberry }
                options: ["rot", "blau", "eckig"]
                answer: "rot"
                feedback:
                  "eckig": "Schau genau hin: Die Erdbeere hat keine Ecken."
                hints:
                  - "Welche Farbe hat die Erdbeere?"
                  - "Erdbeeren sind nicht blau und haben keine Ecken."
                  - "Die Erdbeere ist rot."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Was ist das Gegenteil?"
                say: "Verbinde jedes Adjektiv mit seinem Gegenteil."
                pairs:
                  - { left: { text: "nass" }, right: { text: "trocken" } }
                  - { left: { text: "süß" }, right: { text: "sauer" } }
                  - { left: { text: "stark" }, right: { text: "schwach" } }
                hints:
                  - "Das Gegenteil sagt genau das Umgekehrte."
                  - "Ein Handtuch ist nass. In der Sonne wird es wieder trocken."
                  - "nass und trocken, süß und sauer, stark und schwach."
              - id: l1-f3
                type: multiple_choice
                text: "Was ist das Gegenteil von „schnell“?"
                say: "Was ist das Gegenteil von schnell?"
                options: ["langsam", "schön", "laut"]
                answer: "langsam"
                hints:
                  - "Eine Schnecke ist nicht schnell."
                  - "Eine Schnecke kriecht ganz …"
                  - "Das Gegenteil von schnell ist langsam."
              - id: l1-f4
                type: true_false
                text: "Passt „rund“ zum Bild?"
                say: "Schau dir das Bild an. Ist der Ball rund?"
                show: { object: ball }
                answer: true
                hints:
                  - "Schau auf die Form."
                  - "Hat der Ball Ecken?"
                  - "Ja, der Ball ist rund."
              - id: l1-f5
                type: multiple_choice
                text: "Welches Adjektiv passt zum Bild?"
                say: "Schau dir das Bild an. Welches Adjektiv passt zum Oktopus?"
                show: { object: octopus }
                options: ["lila", "gelb", "eckig"]
                answer: "lila"
                feedback:
                  "gelb": "Schau genau hin: Der Oktopus ist nicht gelb."
                hints:
                  - "Welche Farbe hat der Oktopus?"
                  - "Er ist nicht gelb und hat keine Ecken."
                  - "Der Oktopus ist lila."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welches Adjektiv passt zum Bild?"
                say: "Schau dir das Bild an. Welches Adjektiv passt zum Frosch?"
                show: { object: frog }
                options: ["grün", "trocken", "eckig"]
                answer: "grün"
                hints: ["Schau genau hin."]
              - id: l1-s2
                type: matching
                text: "Was ist das Gegenteil?"
                say: "Verbinde jedes Adjektiv mit seinem Gegenteil."
                pairs:
                  - { left: { text: "früh" }, right: { text: "spät" } }
                  - { left: { text: "gesund" }, right: { text: "krank" } }
                  - { left: { text: "satt" }, right: { text: "hungrig" } }
                hints: ["Das Gegenteil sagt genau das Umgekehrte."]
              - id: l1-s3
                type: multiple_choice
                text: "Was ist das Gegenteil von „voll“?"
                say: "Was ist das Gegenteil von voll?"
                options: ["leer", "groß", "rund"]
                answer: "leer"
                hints: ["Denk an ein Glas Saft. Wie ist es, wenn du alles ausgetrunken hast?"]
              - id: l1-s4
                type: true_false
                text: "Passt „kalt“ zum Bild?"
                say: "Schau dir das Bild an. Ist der Schneemann kalt?"
                show: { object: snowman }
                answer: true
                hints: ["Woraus ist ein Schneemann?"]
              - id: l1-s5
                type: multiple_choice
                text: "Welches Adjektiv passt zum Bild?"
                say: "Schau dir das Bild an. Welches Adjektiv passt zur Maus?"
                show: { object: mouse }
                options: ["klein", "riesig", "laut"]
                answer: "klein"
                hints: ["Wie groß ist eine Maus?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Adjektiv passt zum Bild?"
                say: "Schau dir das Bild an. Welches Adjektiv passt zur Sonne?"
                show: { object: sun }
                options: ["hell", "nass", "leise"]
                answer: "hell"
              - id: l1-n2
                type: matching
                text: "Was ist das Gegenteil?"
                say: "Verbinde jedes Adjektiv mit seinem Gegenteil."
                pairs:
                  - { left: { text: "lang" }, right: { text: "kurz" } }
                  - { left: { text: "schwer" }, right: { text: "leicht" } }
                  - { left: { text: "dick" }, right: { text: "dünn" } }
              - id: l1-n3
                type: multiple_choice
                text: "Was ist das Gegenteil von „sauber“?"
                say: "Was ist das Gegenteil von sauber?"
                options: ["schmutzig", "nass", "schön"]
                answer: "schmutzig"
              - id: l1-n4
                type: true_false
                text: "Passt „eckig“ zum Bild?"
                say: "Schau dir das Bild an. Ist der Apfel eckig?"
                show: { object: apple }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Welches Adjektiv passt zum Bild?"
                say: "Schau dir das Bild an. Welches Adjektiv passt zur Schlange?"
                show: { object: snake }
                options: ["lang", "eckig", "flauschig"]
                answer: "lang"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist das Gegenteil von „hart“?"
            say: "Was ist das Gegenteil von hart?"
            options: ["weich", "nass", "laut"]
            answer: "weich"
          - id: l1-c2
            type: multiple_choice
            text: "Welches Adjektiv passt zum Bild?"
            say: "Schau dir das Bild an. Welches Adjektiv passt zum Wal?"
            show: { object: whale }
            options: ["riesig", "winzig", "trocken"]
            answer: "riesig"
          - id: l1-c3
            type: true_false
            text: "Passt „rot“ zum Bild?"
            say: "Schau dir das Bild an. Ist die Mütze rot?"
            show: { object: woolly-hat }
            answer: true

  - n: 2
    title: { de: Genauer beschreiben, en: Describing more precisely }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist das Gegenteil von „laut“?"
            say: "Was ist das Gegenteil von laut?"
            options: ["leise", "schnell", "groß"]
            answer: "leise"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welches Adjektiv passt zum Bild?"
            say: "Schau dir das Bild an. Welches Adjektiv passt zum Baum?"
            show: { object: tree }
            options: ["hoch", "flüssig", "laut"]
            answer: "hoch"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "ein Hund → ein kleiner, brauner Hund"
            say: "Mit Adjektiven beschreibst du genauer. Ein Hund: Das kann jeder Hund sein. Ein kleiner, brauner Hund: Jetzt weißt du, wie er aussieht."
            show: { object: dog }
          - text: "ein schöner Apfel · ein roter, runder Apfel"
            say: "Manche Adjektive sagen wenig: schön, gut, toll. Wie sieht ein schöner Apfel aus? Das weißt du nicht. Ein roter, runder Apfel: Den kannst du dir vorstellen."
            show: { object: apple }
          - text: "Es ist gelb, krumm und süß."
            say: "Ein Rätsel: Es ist gelb, krumm und süß. Was ist das? Die Adjektive verraten es: eine Banane."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Beschreibung sagt mehr?"
                say: "Welche Beschreibung sagt dir mehr über die Katze?"
                options: ["eine kleine, graue Katze", "eine schöne Katze", "eine Katze"]
                answer: "eine kleine, graue Katze"
                feedback:
                  "eine schöne Katze": "Schön sagt nicht, wie sie aussieht. Klein und grau sagt mehr."
                hints:
                  - "Bei welcher Beschreibung kannst du dir die Katze vorstellen?"
                  - "Zwei Adjektive sagen Größe und Farbe."
                  - "eine kleine, graue Katze."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Es ist rot, klein und süß. Was ist es?"
                say: "Hör zu und rate: Es ist rot, klein und süß. Was ist es?"
                options: [{ object: strawberry }, { object: banana }, { object: carrot }]
                answer: strawberry
                hints:
                  - "Fang mit der Farbe an: Was ist rot?"
                  - "Die Banane ist gelb, die Möhre ist orange."
                  - "Es ist die Erdbeere."
              - id: l2-f3
                type: fill_in_blank
                text: "Welches Adjektiv passt?"
                say: "Schau dir das Bild an. Setz das passende Adjektiv ein."
                show: { object: marble }
                frame: "Die Murmel ist _."
                options: ["rund", "eckig", "weich"]
                answer: ["rund"]
                hints:
                  - "Schau auf die Form."
                  - "Eine Murmel kann rollen. Sie ist aus hartem Glas."
                  - "Die Murmel ist rund."
              - id: l2-f4
                type: true_false
                text: "Sagt „ein toller Ball“ mehr als „ein großer, blauer Ball“?"
                say: "Sagt ein toller Ball mehr als ein großer, blauer Ball?"
                answer: false
                hints:
                  - "Was weißt du über einen tollen Ball?"
                  - "Groß und blau sagen, wie er aussieht."
                  - "Nein. Ein großer, blauer Ball sagt mehr."
              - id: l2-f5
                type: image_multiple_choice
                text: "Es ist grün, klein und quakt. Was ist es?"
                say: "Hör zu und rate: Es ist grün, klein und quakt. Was ist es?"
                options: [{ object: snake }, { object: frog }, { object: bird }]
                answer: frog
                hints:
                  - "Welches Tier quakt?"
                  - "Die Schlange ist auch grün, aber sie quakt nicht."
                  - "Es ist der Frosch."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Beschreibung sagt mehr?"
                say: "Welche Beschreibung sagt dir mehr über den Pulli?"
                options: ["ein dicker, roter Pulli", "ein toller Pulli", "ein Pulli"]
                answer: "ein dicker, roter Pulli"
                hints: ["Bei welcher kannst du dir den Pulli vorstellen?"]
              - id: l2-s2
                type: image_multiple_choice
                text: "Es ist orange, lang und knackig. Was ist es?"
                say: "Hör zu und rate: Es ist orange, lang und knackig. Was ist es?"
                options: [{ object: banana }, { object: carrot }, { object: apple }]
                answer: carrot
                hints: ["Welches Ding ist orange und lang?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Welches Adjektiv passt?"
                say: "Schau dir das Bild an. Setz das passende Adjektiv ein."
                show: { object: ant }
                frame: "Die Ameise ist _."
                options: ["winzig", "riesig", "flüssig"]
                answer: ["winzig"]
                hints: ["Wie groß ist eine Ameise?"]
              - id: l2-s4
                type: true_false
                text: "Sagt „ein schönes Haus“ mehr als „ein kleines, gelbes Haus“?"
                say: "Sagt ein schönes Haus mehr als ein kleines, gelbes Haus?"
                answer: false
                hints: ["Welche Wörter sagen, wie es aussieht?"]
              - id: l2-s5
                type: image_multiple_choice
                text: "Es ist weiß, kalt und hat eine Möhrennase. Was ist es?"
                say: "Hör zu und rate: Es ist weiß, kalt und hat eine Möhrennase. Was ist es?"
                options: [{ object: cloud }, { object: snowman }, { object: egg }]
                answer: snowman
                hints: ["Hör noch einmal genau hin: Was ist kalt?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Beschreibung sagt mehr?"
                say: "Welche Beschreibung sagt dir mehr über den Vogel?"
                options: ["ein kleiner, blauer Vogel", "ein schöner Vogel", "ein Vogel"]
                answer: "ein kleiner, blauer Vogel"
              - id: l2-n2
                type: image_multiple_choice
                text: "Es ist gelb, rund und hell am Himmel. Was ist es?"
                say: "Hör zu und rate: Es ist gelb, rund und hell am Himmel. Was ist es?"
                options: [{ object: sun }, { object: moon }, { object: ball }]
                answer: sun
              - id: l2-n3
                type: fill_in_blank
                text: "Welches Adjektiv passt?"
                say: "Schau dir das Bild an. Setz das passende Adjektiv ein."
                show: { object: balloon }
                frame: "Der Luftballon ist _."
                options: ["rot", "grün", "eckig"]
                answer: ["rot"]
              - id: l2-n4
                type: true_false
                text: "Sagt „ein langer, grüner Schal“ mehr als „ein Schal“?"
                say: "Sagt ein langer, grüner Schal mehr als ein Schal?"
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "Es ist lang, hat keine Beine und zischt. Was ist es?"
                say: "Hör zu und rate: Es ist lang, hat keine Beine und zischt. Was ist es?"
                options: [{ object: snake }, { object: frog }, { object: mouse }]
                answer: snake

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welches Adjektiv passt zum Bild?"
            say: "Schau dir das Bild an. Welches Adjektiv passt zum Ei?"
            show: { object: egg }
            options: ["oval", "eckig", "flauschig"]
            answer: "oval"
          - id: l2-c2
            type: multiple_choice
            text: "Was ist das Gegenteil von „dunkel“?"
            say: "Was ist das Gegenteil von dunkel?"
            options: ["hell", "nass", "klein"]
            answer: "hell"
          - id: l2-c3
            type: multiple_choice
            text: "Welche Beschreibung sagt mehr?"
            say: "Welche Beschreibung sagt dir mehr über den Teddy?"
            options: ["ein weicher, brauner Teddy", "ein lieber Teddy", "ein Teddy"]
            answer: "ein weicher, brauner Teddy"
          - id: l2-c4
            type: image_multiple_choice
            text: "Es ist klein, grau und piepst. Was ist es?"
            say: "Hör zu und rate: Es ist klein, grau und piepst. Was ist es?"
            options: [{ object: mouse }, { object: lion }, { object: whale }]
            answer: mouse
          - id: l2-c5
            type: fill_in_blank
            text: "Welches Adjektiv passt?"
            say: "Schau dir das Bild an. Setz das passende Adjektiv ein."
            show: { object: cloud }
            frame: "Die Wolke ist _."
            options: ["weiß", "schwarz", "eckig"]
            answer: ["weiß"]
