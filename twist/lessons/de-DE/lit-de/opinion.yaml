              - id: l2-s5
                type: multiple_choice
                text: "Welcher Gruß passt an das Ende eines Briefes an die Bürgermeisterin?"
                say: "Welcher Gruß passt an das Ende eines Briefes an die Bürgermeisterin?"
                options: ["Mit freundlichen Grüßen", "Tschüss!", "Hab dich lieb"]
                answer: "Mit freundlichen Grüßen"
                hints: ["Der Gruß ist so höflich wie die Anrede."]

