# Lesson set: Deutsch, Klasse 4. Hand-authored draft.
id: de-DE.lit-de.opinion
skill: lit-de.writing.opinion
curriculum: de-DE
language: de
title:
  de: Meinung schriftlich begründen
  en: Giving reasons for an opinion in writing
summary: >
  The knowledge behind an opinion text. Lesson 1 builds a Buchtipp and a
  short Meinungstext (Meinung, Argumente mit Beispiel, Schluss), tells a
  real argument from a sentence that is not one, and links arguments with
  denn, außerdem and deshalb; lesson 2 writes a letter with a request to
  the head teacher or the mayor (Anrede, Bitte, Argumente, Gruß), chooses
  the argument that convinces this reader, and ends with the skill check.
  Writing a whole letter freely waits for a free text task type; here the
  child sorts, orders, chooses and fills. Every letter and book is
  written for Twist.
metadata:
  year: klasse-4
  topic: { de: Berichten, en: Reporting }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.writing.letters-emails, lit-de.sentences.conjunctions]
  also_practises: [lit-de.sentences.conjunctions, lit-de.speaking.argue, lit-de.writing.letters-emails]
  vocabulary: { de: [Meinung, Argument, Beispiel, begründen, Buchtipp, außerdem, deshalb, denn, Bitte, Anrede, Gruß] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: argument-without-reason
      what: Counts any sentence about the topic, or the opinion said again, as an argument
      addressed: "lesson 1 Learn shows an argument with a reason and an example; l1-f1, l1-s1, l1-n1 and l2-c1 sort argument from not-an-argument, with feedback on l1-f2 for the repeated opinion"
    - id: own-view-only
      what: Gives only reasons that matter to the writer, not to the reader who decides
      addressed: "lesson 2 Learn picks an argument that matters to the head teacher; l2-f3, l2-s3, l2-n3 and l2-c4 choose the argument that convinces the reader, with feedback on l2-f3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Meinung und Argumente", en: "Opinion and arguments" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welches Bindewort passt?"
            say: "Welches Bindewort passt in die Lücke?"
            frame: "Ich lese das Buch gern, _ es sehr lustig ist."
            options: ["weil", "aber", "oder"]
            answer: ["weil"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Du schreibst deiner Tante einen Brief. Welcher Gruß passt ans Ende?"
            say: "Du schreibst deiner Tante einen Brief. Welcher Gruß passt ans Ende?"
            options: ["Liebe Grüße, deine Lena", "Liebe Tante Eva,", "Hallo Leute!"]
            answer: "Liebe Grüße, deine Lena"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Mein Buchtipp: „Der Leuchtturm der Möwen“\n\nIch finde, jeder sollte dieses Buch lesen. Es ist sehr spannend, denn bis zum Schluss weiß man nicht, wer die Möwen gerettet hat. Außerdem sind die Bilder wunderschön. Deshalb bekommt das Buch von mir fünf Sterne."
            say: "In einem Meinungstext sagst du zuerst deine Meinung. Dann begründest du sie mit Argumenten. Am Schluss fasst du deine Meinung noch einmal zusammen."
          - text: "Meinung: Jeder sollte das Buch lesen.\nArgument: Es ist spannend,\nBeispiel: denn bis zum Schluss weiß man nicht, wer die Möwen gerettet hat."
            say: "Ein Argument ist ein Grund für deine Meinung. Mit einem Beispiel wird es stärker. Kein Argument ist: Ich finde das Buch gut, weil es gut ist. Das wiederholt nur die Meinung."
          - text: "denn: ein Grund kommt\naußerdem: noch ein Argument\ndeshalb: die Folge, der Schluss"
            say: "Mit diesen Wörtern verbindest du deine Sätze. So kann der Leser deinen Gedanken gut folgen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Ist das ein Argument für die Meinung?"
                say: "Die Meinung ist: Wir sollten öfter draußen Unterricht machen. Sortiere: Ist das ein Argument dafür oder nicht?"
                bins:
                  - { id: arg, show: { text: "Argument" }, say: "Argument" }
                  - { id: noarg, show: { text: "kein Argument" }, say: "kein Argument" }
                options:
                  - { text: "An der frischen Luft können wir uns besser konzentrieren.", bin: arg }
                  - { text: "Draußen können wir Pflanzen und Tiere direkt beobachten.", bin: arg }
                  - { text: "Ich finde Unterricht draußen einfach gut.", bin: noarg }
                  - { text: "Unsere Schule hat einen roten Eingang.", bin: noarg }
                option_audio: false
                hints:
                  - "Ein Argument sagt, warum Unterricht draußen gut ist."
                  - "Ein Satz wiederholt nur die Meinung, einer hat nichts mit dem Thema zu tun."
                  - "Frische Luft und Beobachten sind Argumente."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Meinung: Ich empfehle das Buch „Kalle und der Wunderhund“.\n\nWelches Argument ist am stärksten?"
                say: "Lies die Meinung. Welches Argument ist am stärksten?"
                options: ["Es ist so lustig, dass ich bei jedem Kapitel lachen musste.", "Ich empfehle es, weil ich es empfehle.", "Das Buch hat 120 Seiten."]
                answer: "Es ist so lustig, dass ich bei jedem Kapitel lachen musste."
                feedback:
                  "Ich empfehle es, weil ich es empfehle.": "Das wiederholt nur die Meinung. Ein Argument nennt einen Grund."
                hints:
                  - "Ein starkes Argument sagt, warum das Buch gut ist, und gibt ein Beispiel."
                  - "Die Seitenzahl sagt nichts darüber, ob es gut ist."
                  - "Es ist so lustig, dass ich bei jedem Kapitel lachen musste."
              - id: l1-f3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort verbindet die Sätze am besten?"
                frame: "Das Buch ist spannend. _ lernt man viel über Wale."
                options: ["Außerdem", "Deshalb", "Aber"]
                answer: ["Außerdem"]
                hints:
                  - "Der zweite Satz bringt noch ein Argument."
                  - "Welches Wort heißt: noch dazu?"
                  - "Außerdem."
              - id: l1-f4
                type: ordering
                text: "Bring den Meinungstext in die richtige Reihenfolge."
                say: "Bring die Teile des Meinungstextes in die richtige Reihenfolge."
                options: ["Deshalb finde ich: Wir brauchen einen Schulhund.", "Ich wünsche mir einen Schulhund für unsere Klasse.", "Ein Hund macht gute Laune, denn alle freuen sich, wenn er kommt."]
                slot_count: 3
                answer: ["Ich wünsche mir einen Schulhund für unsere Klasse.", "Ein Hund macht gute Laune, denn alle freuen sich, wenn er kommt.", "Deshalb finde ich: Wir brauchen einen Schulhund."]
                option_audio: false
                hints:
                  - "Erst die Meinung, dann das Argument, dann der Schluss."
                  - "Deshalb zeigt den Schluss."
                  - "Erst: Ich wünsche mir … Dann: Ein Hund macht gute Laune … Zum Schluss: Deshalb …"
              - id: l1-f5
                type: multiple_choice
                text: "Was gehört nicht in einen Buchtipp?"
                say: "Was gehört nicht in einen Buchtipp?"
                options: ["wie die Geschichte ganz am Ende ausgeht", "worum es in dem Buch geht", "warum dir das Buch gefällt"]
                answer: "wie die Geschichte ganz am Ende ausgeht"
                hints:
                  - "Der Leser soll das Buch noch selbst lesen wollen."
                  - "Was würde die Spannung verderben?"
                  - "Das Ende verrätst du nicht."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Ist das ein Argument für die Meinung?"
                say: "Die Meinung ist: Jede Klasse sollte ein Hochbeet haben. Sortiere: Ist das ein Argument dafür oder nicht?"
                bins:
                  - { id: arg, show: { text: "Argument" }, say: "Argument" }
                  - { id: noarg, show: { text: "kein Argument" }, say: "kein Argument" }
                options:
                  - { text: "Wir lernen, wie Gemüse wächst.", bin: arg }
                  - { text: "Wir können unser eigenes Gemüse ernten und essen.", bin: arg }
                  - { text: "Ein Hochbeet ist toll, weil es toll ist.", bin: noarg }
                  - { text: "Gestern hat es geregnet.", bin: noarg }
                option_audio: false
                hints: ["Welche Sätze sagen, warum ein Hochbeet gut ist?"]
              - id: l1-s2
                type: multiple_choice
                text: "Meinung: Ich empfehle den Film „Die Inselbande“.\n\nWelches Argument ist am stärksten?"
                say: "Lies die Meinung. Welches Argument ist am stärksten?"
                options: ["Die Kinder lösen den Fall mit Mut und Köpfchen, das ist richtig spannend.", "Ich habe den Film am Samstag gesehen.", "Der Film ist gut, weil er gut ist."]
                answer: "Die Kinder lösen den Fall mit Mut und Köpfchen, das ist richtig spannend."
                hints: ["Welcher Satz sagt, warum der Film gut ist?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort verbindet die Sätze am besten?"
                frame: "Im Sommer ist es im Klassenzimmer sehr heiß. _ wünschen wir uns einen Ventilator."
                options: ["Deshalb", "Außerdem", "Denn"]
                answer: ["Deshalb"]
                hints: ["Der zweite Satz ist die Folge aus dem ersten."]
              - id: l1-s4
                type: ordering
                text: "Bring den Buchtipp in die richtige Reihenfolge."
                say: "Bring die Teile des Buchtipps in die richtige Reihenfolge."
                options: ["Darum gebe ich dem Buch fünf Sterne.", "Mein Buchtipp ist „Das Geheimnis im Baumhaus“.", "Es ist spannend, denn jeden Tag findet Pia eine neue Botschaft."]
                slot_count: 3
                answer: ["Mein Buchtipp ist „Das Geheimnis im Baumhaus“.", "Es ist spannend, denn jeden Tag findet Pia eine neue Botschaft.", "Darum gebe ich dem Buch fünf Sterne."]
                option_audio: false
                hints: ["Zuerst nennst du das Buch."]
              - id: l1-s5
                type: true_false
                text: "„Das Buch ist gut, denn ich finde es gut.“ Ist das ein gutes Argument?"
                say: "Lies den Satz. Ist das ein gutes Argument?"
                answer: false
                hints: ["Sagt der Teil nach denn etwas Neues?"]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Ist das ein Argument für die Meinung?"
                say: "Die Meinung ist: Wir sollten mit dem Fahrrad zur Schule fahren. Sortiere: Ist das ein Argument dafür oder nicht?"
                bins:
                  - { id: arg, show: { text: "Argument" }, say: "Argument" }
                  - { id: noarg, show: { text: "kein Argument" }, say: "kein Argument" }
                options:
                  - { text: "Radfahren hält fit.", bin: arg }
                  - { text: "Fahrräder machen keine Abgase.", bin: arg }
                  - { text: "Mein Fahrrad hat eine Klingel.", bin: noarg }
                  - { text: "Radfahren ist besser, weil es besser ist.", bin: noarg }
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Meinung: Ich empfehle das Spiel „Sternenflitzer“.\n\nWelches Argument ist am stärksten?"
                say: "Lies die Meinung. Welches Argument ist am stärksten?"
                options: ["Man kann es mit der ganzen Familie spielen, auch die Kleinen verstehen es schnell.", "Die Schachtel ist blau.", "Ich empfehle es, weil es mein Tipp ist."]
                answer: "Man kann es mit der ganzen Familie spielen, auch die Kleinen verstehen es schnell."
              - id: l1-n3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort verbindet die Sätze am besten?"
                frame: "Wir brauchen mehr Mülleimer auf dem Schulhof, _ überall liegt Papier herum."
                options: ["denn", "deshalb", "außerdem"]
                answer: ["denn"]
              - id: l1-n4
                type: ordering
                text: "Bring den Meinungstext in die richtige Reihenfolge."
                say: "Bring die Teile des Meinungstextes in die richtige Reihenfolge."
                options: ["Außerdem wäre es in den Pausen ruhiger.", "Ich finde, wir brauchen eine Leseecke.", "Dort können wir uns in Ruhe Bücher ansehen.", "Deshalb bitten wir um Kissen und ein Regal."]
                slot_count: 4
                answer: ["Ich finde, wir brauchen eine Leseecke.", "Dort können wir uns in Ruhe Bücher ansehen.", "Außerdem wäre es in den Pausen ruhiger.", "Deshalb bitten wir um Kissen und ein Regal."]
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "In einem Buchtipp verrätst du, wie die Geschichte ausgeht. Stimmt das?"
                say: "In einem Buchtipp verrätst du, wie die Geschichte ausgeht. Stimmt das?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Meinung: Ich empfehle das Buch „Fips, der kleine Drache“.\n\nWelches Argument ist am stärksten?"
            say: "Lies die Meinung. Welches Argument ist am stärksten?"
            options: ["Fips ist so tollpatschig, dass man ihn sofort lieb hat.", "Das Buch ist grün.", "Ich empfehle es, weil ich es gut finde."]
            answer: "Fips ist so tollpatschig, dass man ihn sofort lieb hat."
          - id: l1-c2
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort verbindet die Sätze am besten?"
            frame: "Der Weg zum Schwimmbad ist kurz. _ kostet der Eintritt für Kinder nur einen Euro."
            options: ["Außerdem", "Deshalb", "Denn"]
            answer: ["Außerdem"]
          - id: l1-c3
            type: true_false
            text: "„Wir sollten einen Kicker kaufen, denn dann streiten wir in der Pause weniger um den Ball.“ Ist das eine Meinung mit Argument?"
            say: "Lies den Satz. Ist das eine Meinung mit Argument?"
            answer: true

  - n: 2
    title: { de: "Ein Brief mit einer Bitte", en: "A letter with a request" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort verbindet die Sätze am besten?"
            frame: "Unser Ball ist kaputt. _ brauchen wir einen neuen."
            options: ["Deshalb", "Außerdem", "Denn"]
            answer: ["Deshalb"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "„Ich finde das gut, weil ich das gut finde.“ Ist das ein Argument?"
            say: "Lies den Satz. Ist das ein Argument?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Sehr geehrte Frau Hoffmann,\n\nwir, die Klasse 4a, möchten Sie um etwas bitten: Wir wünschen uns ein Klettergerüst auf dem Schulhof.\n\nIn den Pausen gibt es oft Streit, weil es zu wenig zum Spielen gibt. Mit einem Klettergerüst wären alle beschäftigt. Außerdem bewegen wir uns dann mehr.\n\nWir würden uns sehr über Ihre Antwort freuen.\n\nMit freundlichen Grüßen\nIhre Klasse 4a"
            say: "Das ist ein Brief an die Schulleiterin. Er hat eine Anrede, eine Bitte, Argumente und einen Gruß. Erwachsene, die du nicht gut kennst, sprichst du mit Sie an."
          - text: "Anrede: Sehr geehrte Frau Hoffmann,\nBitte: Wir wünschen uns …\nArgumente: weil …, außerdem …\nGruß: Mit freundlichen Grüßen"
            say: "Nach der Anrede steht ein Komma. Darum schreibst du das erste Wort danach klein: wir, die Klasse 4a."
          - text: "„Klettern macht uns Spaß.“\n„Mit einem Klettergerüst gibt es weniger Streit in den Pausen.“"
            say: "Überleg: Was ist der Schulleiterin wichtig? Dass ihr Spaß habt, ist schön. Aber dass es weniger Streit gibt, überzeugt sie mehr. Wähle Argumente, die für deinen Leser zählen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Du schreibst an den Bürgermeister, Herrn Becker. Welche Anrede passt?"
                say: "Du schreibst an den Bürgermeister, Herrn Becker. Welche Anrede passt?"
                options: ["Sehr geehrter Herr Becker,", "Hallo Becker,", "Lieber Bürgi,"]
                answer: "Sehr geehrter Herr Becker,"
                hints:
                  - "Den Bürgermeister kennst du nicht gut. Du schreibst höflich."
                  - "Sehr geehrter ist die höfliche Anrede."
                  - "Sehr geehrter Herr Becker,"
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Bring die Teile des Briefes in die richtige Reihenfolge."
                say: "Bring die Teile des Briefes in die richtige Reihenfolge."
                options: ["Mit freundlichen Grüßen", "Sehr geehrte Frau Schmitt,", "der Spielplatz braucht eine neue Schaukel, denn die alte ist kaputt.", "Wir hoffen auf Ihre Hilfe."]
                slot_count: 4
                answer: ["Sehr geehrte Frau Schmitt,", "der Spielplatz braucht eine neue Schaukel, denn die alte ist kaputt.", "Wir hoffen auf Ihre Hilfe.", "Mit freundlichen Grüßen"]
                option_audio: false
                hints:
                  - "Ein Brief beginnt mit der Anrede und endet mit dem Gruß."
                  - "Nach der Anrede kommen die Bitte und das Argument."
                  - "Anrede, Schaukel, hoffen, Grüße."
              - id: l2-f3
                type: multiple_choice
                text: "Du bittest die Schulleiterin um mehr Fahrradständer. Welches Argument überzeugt sie am meisten?"
                say: "Du bittest die Schulleiterin um mehr Fahrradständer. Welches Argument überzeugt sie am meisten?"
                options: ["Viele Räder liegen auf dem Weg, und Kinder stolpern darüber.", "Mein Fahrrad ist neu und sehr schön.", "Ich fahre gern Fahrrad."]
                answer: "Viele Räder liegen auf dem Weg, und Kinder stolpern darüber."
                feedback:
                  "Mein Fahrrad ist neu und sehr schön.": "Das ist dir wichtig, aber nicht der Schulleiterin. Was ist für die ganze Schule wichtig?"
                hints:
                  - "Was ist der Schulleiterin wichtig?"
                  - "Sie möchte, dass alle Kinder sicher sind."
                  - "Kinder stolpern über die Räder."
              - id: l2-f4
                type: fill_in_blank
                text: "Welches Wort passt nach der Anrede?"
                say: "Nach der Anrede steht ein Komma. Wie schreibst du das erste Wort danach?"
                frame: "Sehr geehrter Herr Becker,\n_ möchten Sie um Hilfe bitten."
                options: ["wir", "Wir"]
                answer: ["wir"]
                option_audio: false
                hints:
                  - "Nach dem Komma geht der Satz weiter."
                  - "Darum ist das erste Wort danach klein, wenn es kein Nomen ist."
                  - "wir, kleingeschrieben."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Satz ist eine höfliche Bitte an die Bürgermeisterin?"
                say: "Welcher Satz ist eine höfliche Bitte an die Bürgermeisterin?"
                options: ["Könnten Sie bitte eine Ampel vor unserer Schule aufstellen lassen?", "Stell sofort eine Ampel auf!", "Du musst uns eine Ampel geben."]
                answer: "Könnten Sie bitte eine Ampel vor unserer Schule aufstellen lassen?"
                hints:
                  - "Achte auf bitte und auf Sie."
                  - "Ein Befehl ist keine Bitte."
                  - "Könnten Sie bitte …?"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Du schreibst an die Leiterin der Stadtbücherei, Frau Kaya. Welche Anrede passt?"
                say: "Du schreibst an die Leiterin der Stadtbücherei, Frau Kaya. Welche Anrede passt?"
                options: ["Sehr geehrte Frau Kaya,", "Hi Frau Kaya!", "Liebe Bücherfrau,"]
                answer: "Sehr geehrte Frau Kaya,"
                hints: ["Welche Anrede ist höflich und nennt den Namen?"]
              - id: l2-s2
                type: ordering
                text: "Bring die Teile des Briefes in die richtige Reihenfolge."
                say: "Bring die Teile des Briefes in die richtige Reihenfolge."
                options: ["Mit freundlichen Grüßen", "Wir würden uns über eine Antwort freuen.", "Sehr geehrte Frau Kaya,", "könnten wir mit unserer Klasse die Bücherei besuchen?"]
                slot_count: 4
                answer: ["Sehr geehrte Frau Kaya,", "könnten wir mit unserer Klasse die Bücherei besuchen?", "Wir würden uns über eine Antwort freuen.", "Mit freundlichen Grüßen"]
                option_audio: false
