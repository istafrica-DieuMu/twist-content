                say: "Du bittest die Schulleiterin um einen Wasserspender. Welches Argument überzeugt sie am meisten?"
                options: ["Wer genug trinkt, kann sich im Unterricht besser konzentrieren.", "Ich mag kaltes Wasser.", "Meine Trinkflasche ist rosa."]
                answer: "Wer genug trinkt, kann sich im Unterricht besser konzentrieren."
              - id: l2-n4
                type: fill_in_blank
