                answer: "Sehr geehrter Herr Wolf,"
              - id: l2-n2
                type: ordering
                text: "Bring die Teile des Briefes in die richtige Reihenfolge."
                say: "Bring die Teile des Briefes in die richtige Reihenfolge."
                options: ["Außerdem könnten wir dort im Sommer im Schatten lesen.", "Sehr geehrter Herr Wolf,", "Mit freundlichen Grüßen", "wir wünschen uns eine Bank unter dem großen Baum."]
                slot_count: 4
                answer: ["Sehr geehrter Herr Wolf,", "wir wünschen uns eine Bank unter dem großen Baum.", "Außerdem könnten wir dort im Sommer im Schatten lesen.", "Mit freundlichen Grüßen"]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
