                text: "Du bittest den Bürgermeister um einen Zebrastreifen vor der Schule. Welches Argument überzeugt ihn am meisten?"
                say: "Du bittest den Bürgermeister um einen Zebrastreifen vor der Schule. Welches Argument überzeugt ihn am meisten?"
                options: ["Jeden Morgen überqueren hier über hundert Kinder die Straße, und die Autos fahren schnell.", "Zebrastreifen sehen schön aus.", "Mein Freund wohnt auf der anderen Seite."]
                answer: "Jeden Morgen überqueren hier über hundert Kinder die Straße, und die Autos fahren schnell."
                hints: ["Was ist dem Bürgermeister wichtig: die Sicherheit aller Kinder."]
              - id: l2-s4
                type: true_false
                text: "„Sehr geehrte Frau Hoffmann,\nWir möchten Sie etwas fragen.“ Ist das richtig geschrieben?"
                say: "Lies den Briefanfang. Ist das richtig geschrieben?"
