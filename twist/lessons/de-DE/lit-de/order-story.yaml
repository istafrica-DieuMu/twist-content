# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.order-story
skill: lit-de.comprehension.order-story
curriculum: de-DE
language: de
title:
  de: Geschichten ordnen
  en: Putting a story in order
summary: >
  Putting the parts of a short story in order. Lesson 1 reads a story of
  three short sentences and lays its pictures in order, finds what
  happens first and what is missing in the middle, and learns the order
  words zuerst, dann and zum Schluss; lesson 2 orders sentence cards with
  and without order words, uses cause and effect (first the cup falls
  over, then the table is wet), tells the beginning from the end, and
  ends with the skill check. All stories are written for Twist.
metadata:
  year: klasse-1
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.first-texts]
  also_practises: [lit-de.decoding.first-texts]
  vocabulary: { de: [Geschichte, Reihenfolge, zuerst, dann, zum Schluss, Anfang, Ende] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: effect-before-cause
      what: Puts what happens as a result before what causes it (eats the banana, then peels it; cries, then falls off the bike)
      addressed: "lesson 1 Learn asks what must happen before (pick the apple before eating it); l1-f2 (with feedback), l1-f4, l1-n4, l2-f1, l2-f5, l2-s1, l2-n1 and l2-c2 turn on cause and effect; l1-s5 gives feedback on the step that comes too early"
    - id: ignores-order-words
      what: Orders sentence cards by where they lie and does not use zuerst, dann and zum Schluss
      addressed: "lesson 1 Learn and lesson 2 Learn name the order words; l1-f3, l1-s3, l2-f3, l2-s3 and l2-c3 are sentence cards with order words; the hints in the full stage point to them"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was passiert zuerst?", en: "What happens first?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ben hat einen Ball. Der Ball ist rot.\n\nWas hat Ben?"
            say: "Lies den Text. Was hat Ben?"
            options: ["einen Ball", "einen Hund", "ein Eis"]
            answer: "einen Ball"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Lea ist müde. Sie geht ins Bett.\n\nGeht Lea ins Bett?"
            say: "Lies den Text. Geht Lea ins Bett?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Es schneit.\nIda baut einen Schneemann.\nDie Sonne scheint. Der Schneemann schmilzt."
            say: "Eine Geschichte hat eine Reihenfolge. Zuerst schneit es. Dann baut Ida einen Schneemann. Zum Schluss scheint die Sonne, und der Schneemann schmilzt. Ohne Schnee gibt es keinen Schneemann. Darum kommt der Schnee zuerst."
            show: { objects: [snow, snowman] }
          - text: "zuerst\ndann\nzum Schluss"
            say: "Diese Wörter helfen dir: zuerst, dann, zum Schluss. Das Wort zuerst zeigt dir den Anfang. Das Wort dann zeigt dir, was danach passiert. Zum Schluss zeigt dir das Ende."
          - text: "Tom isst den Apfel.\nTom pflückt einen Apfel."
            say: "Frag dich immer: Was muss vorher passieren? Tom kann den Apfel erst essen, wenn er ihn gepflückt hat. Also kommt das Pflücken zuerst."
            show: { object: apple }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Ole ist müde.\nEr geht ins Bett.\nAm Morgen klingelt die Uhr.\n\nLeg die Bilder in die Reihenfolge der Geschichte."
                say: "Lies die Geschichte. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: clock }, { object: tired }, { object: bed }]
                slot_count: 3
                answer: [tired, bed, clock]
                hints:
                  - "Lies Satz für Satz. Welches Bild passt zum ersten Satz?"
                  - "Zuerst ist Ole müde. Was macht er dann?"
                  - "Zuerst das müde Kind, dann das Bett, zum Schluss die Uhr."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Paula backt einen Kuchen.\n\nWas passiert zuerst?"
                say: "Paula backt einen Kuchen. Was passiert zuerst?"
                options: ["Paula rührt den Teig.", "Der Kuchen ist im Ofen.", "Paula isst ein Stück Kuchen."]
                answer: "Paula rührt den Teig."
                option_audio: false
                feedback:
                  "Paula isst ein Stück Kuchen.": "Kann Paula den Kuchen essen, bevor er gebacken ist?"
                hints:
                  - "Frag dich: Was muss vorher passieren?"
                  - "Ohne Teig gibt es keinen Kuchen im Ofen."
                  - "Zuerst rührt Paula den Teig."
              - id: l1-f3
                type: ordering
                text: "Leg die Sätze in die richtige Reihenfolge."
                say: "Mia malt ein Bild. Leg die Sätze in die richtige Reihenfolge."
                options: ["Dann malt sie eine Sonne.", "Zum Schluss zeigt sie Mama das Bild.", "Zuerst nimmt Mia einen gelben Stift."]
                slot_count: 3
                answer: ["Zuerst nimmt Mia einen gelben Stift.", "Dann malt sie eine Sonne.", "Zum Schluss zeigt sie Mama das Bild."]
                option_audio: false
                hints:
                  - "Achte auf die Wörter zuerst, dann und zum Schluss."
                  - "Welcher Satz fängt mit Zuerst an?"
                  - "Zuerst den Stift, dann die Sonne, zum Schluss zu Mama."
              - id: l1-f4
                type: true_false
                text: "1. Jan zieht die Schuhe an.\n2. Jan zieht die Socken an.\n\nStimmt die Reihenfolge?"
                say: "Lies die Sätze. Stimmt die Reihenfolge?"
                answer: false
                hints:
                  - "Was ziehst du zuerst an?"
                  - "Kannst du Socken über die Schuhe ziehen?"
                  - "Nein. Zuerst kommen die Socken, dann die Schuhe."
              - id: l1-f5
                type: multiple_choice
                text: "1. Can hat Durst.\n2. ?\n3. Jetzt hat Can keinen Durst mehr.\n\nWelcher Satz gehört in die Mitte?"
                say: "Lies die Geschichte. Ein Satz fehlt in der Mitte. Welcher?"
                options: ["Can trinkt ein Glas Wasser.", "Can geht schlafen.", "Can hat Hunger."]
                answer: "Can trinkt ein Glas Wasser."
                option_audio: false
                hints:
                  - "Lies den Anfang und das Ende."
                  - "Was macht man, wenn man Durst hat?"
                  - "Can trinkt ein Glas Wasser."
              - id: l1-f6
                type: ordering
                text: "Mama holt Eier.\nSie backt einen Kuchen.\nNele freut sich über den Kuchen.\n\nLeg die Bilder in die Reihenfolge der Geschichte."
                say: "Lies die Geschichte. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: happy }, { object: egg }, { object: cake }]
                slot_count: 3
                answer: [egg, cake, happy]
                hints:
                  - "Lies Satz für Satz. Welches Bild passt zum ersten Satz?"
                  - "Zuerst holt Mama Eier. Was backt sie dann?"
                  - "Zuerst die Eier, dann der Kuchen, zum Schluss das fröhliche Kind."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Der Wind weht.\nEmil lässt seinen Drachen steigen.\nDanach ist Emil müde.\n\nLeg die Bilder in die Reihenfolge der Geschichte."
                say: "Lies die Geschichte. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: kite }, { object: tired }, { object: wind }]
                slot_count: 3
                answer: [wind, kite, tired]
                hints: ["Welches Bild passt zum ersten Satz?"]
              - id: l1-s2
                type: multiple_choice
                text: "Opa pflückt Äpfel.\n\nWas passiert zuerst?"
                say: "Opa pflückt Äpfel. Was passiert zuerst?"
                options: ["Opa holt die Leiter.", "Opa steigt auf die Leiter.", "Opa pflückt die Äpfel ganz oben."]
                answer: "Opa holt die Leiter."
                option_audio: false
                hints: ["Kann Opa auf die Leiter steigen, bevor er sie geholt hat?"]
              - id: l1-s3
                type: ordering
                text: "Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Sätze über den Hund. Leg sie in die richtige Reihenfolge."
                options: ["Zum Schluss schläft er in seinem Korb.", "Zuerst rennt der Hund durch den Garten.", "Dann trinkt er Wasser."]
                slot_count: 3
                answer: ["Zuerst rennt der Hund durch den Garten.", "Dann trinkt er Wasser.", "Zum Schluss schläft er in seinem Korb."]
                option_audio: false
                hints: ["Such die Wörter zuerst, dann und zum Schluss."]
              - id: l1-s4
                type: true_false
                text: "1. Die Kerze brennt.\n2. Nele bläst die Kerze aus.\n\nStimmt die Reihenfolge?"
                say: "Lies die Sätze. Stimmt die Reihenfolge?"
                answer: true
                hints: ["Kann Nele eine Kerze auspusten, die nicht brennt?"]
              - id: l1-s5
                type: multiple_choice
                text: "1. Ben hat ein Eis.\n2. ?\n3. Jetzt hat Ben kein Eis mehr.\n\nWelcher Satz gehört in die Mitte?"
                say: "Lies die Geschichte. Ein Satz fehlt in der Mitte. Welcher?"
                options: ["Ben isst das Eis auf.", "Ben kauft ein Eis.", "Ben mag Eis."]
                answer: "Ben isst das Eis auf."
                option_audio: false
                feedback:
                  "Ben kauft ein Eis.": "Ben hat das Eis schon. Was passiert danach?"
                hints: ["Am Anfang hat Ben ein Eis, am Ende nicht mehr. Was ist dazwischen passiert?"]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Am Abend ist Lea müde.\nSie liest noch ein Buch.\nDann schläft sie im Bett.\n\nLeg die Bilder in die Reihenfolge der Geschichte."
                say: "Lies die Geschichte. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: bed }, { object: book }, { object: tired }]
                slot_count: 3
                answer: [tired, book, bed]
              - id: l1-n2
                type: multiple_choice
                text: "Papa macht eine Pizza.\n\nWas passiert zum Schluss?"
                say: "Papa macht eine Pizza. Was passiert zum Schluss?"
                options: ["Die Kinder essen die Pizza.", "Papa legt Käse auf die Pizza.", "Die Pizza backt im Ofen."]
                answer: "Die Kinder essen die Pizza."
                option_audio: false
              - id: l1-n3
                type: ordering
                text: "Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Sätze über Mia. Leg sie in die richtige Reihenfolge."
                options: ["Mia fällt hin.", "Mama klebt ihr ein Pflaster auf das Knie.", "Mia fährt mit dem Rad."]
                slot_count: 3
                answer: ["Mia fährt mit dem Rad.", "Mia fällt hin.", "Mama klebt ihr ein Pflaster auf das Knie."]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "1. Tom isst die Banane.\n2. Tom schält die Banane.\n\nStimmt die Reihenfolge?"
                say: "Lies die Sätze. Stimmt die Reihenfolge?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "1. Die Blume ist ganz trocken.\n2. ?\n3. Jetzt ist die Blume wieder frisch.\n\nWelcher Satz gehört in die Mitte?"
                say: "Lies die Geschichte. Ein Satz fehlt in der Mitte. Welcher?"
                options: ["Aylin gießt die Blume.", "Aylin pflückt die Blume.", "Die Sonne scheint heiß."]
                answer: "Aylin gießt die Blume."
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            text: "Die Sonne geht unter.\nDer Mond geht auf.\nJan geht ins Bett.\n\nLeg die Bilder in die Reihenfolge der Geschichte."
            say: "Lies die Geschichte. Leg die Bilder in die richtige Reihenfolge."
            options: [{ object: moon }, { object: bed }, { object: sun }]
            slot_count: 3
            answer: [sun, moon, bed]
          - id: l1-c2
            type: multiple_choice
            text: "Lea geht zur Schule.\n\nWas passiert zuerst?"
            say: "Lea geht zur Schule. Was passiert zuerst?"
            options: ["Lea packt ihren Schulranzen.", "Lea geht los.", "Lea sitzt in der Klasse."]
            answer: "Lea packt ihren Schulranzen."
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "1. Ole zieht die Jacke an.\n2. Ole geht nach draußen.\n\nStimmt die Reihenfolge?"
            say: "Lies die Sätze. Stimmt die Reihenfolge?"
            answer: true

  - n: 2
    title: { de: "Sätze ordnen", en: "Putting sentences in order" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Can kommt nach Hause.\n\nWas passiert zuerst?"
            say: "Can kommt nach Hause. Was passiert zuerst?"
            options: ["Can schließt die Tür auf.", "Can geht ins Haus."]
            answer: "Can schließt die Tür auf."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Dicke Wolken kommen.\nEs regnet.\nDanach scheint wieder die Sonne.\n\nLeg die Bilder in die Reihenfolge der Geschichte."
            say: "Lies die Geschichte. Leg die Bilder in die richtige Reihenfolge."
            options: [{ object: sun }, { object: cloud }, { object: rain }]
            slot_count: 3
            answer: [cloud, rain, sun]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Zuerst spielt Tim mit dem Ball.\nDann rollt der Ball in den Teich.\nTim ist traurig.\nZum Schluss holt Papa den Ball mit einem Stock heraus."
            say: "Hier ist eine Geschichte mit vier Sätzen. Am Anfang spielt Tim. In der Mitte passiert etwas: Der Ball rollt in den Teich. Am Ende wird alles gut."
          - text: "Der Ball rollt in den Teich.\nTim ist traurig."
            say: "Warum ist Tim traurig? Weil der Ball in den Teich gerollt ist. Der Grund kommt zuerst. Erst rollt der Ball weg, dann ist Tim traurig."
          - text: "Am Anfang\nIn der Mitte\nAm Ende"
            say: "Eine Geschichte hat einen Anfang, eine Mitte und ein Ende. Wenn keine Wörter wie zuerst oder dann dastehen, frag dich: Was muss vorher passieren? Was ist der Grund?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Sätze. Leg sie so, dass eine Geschichte entsteht."
                options: ["Der Becher fällt um.", "Jetzt ist der Tisch nass.", "Max stößt an den Becher."]
                slot_count: 3
                answer: ["Max stößt an den Becher.", "Der Becher fällt um.", "Jetzt ist der Tisch nass."]
                option_audio: false
                hints:
                  - "Frag dich: Warum fällt der Becher um?"
                  - "Max stößt an den Becher. Was passiert dann mit dem Becher?"
                  - "Max stößt an den Becher, der Becher fällt um, der Tisch ist nass."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "1. Pia sucht ihre Katze.\n2. Sie ruft laut: „Mimi!“\n3. ?\n\nWelcher Satz ist das Ende?"
                say: "Lies die Geschichte. Welcher Satz ist das Ende?"
                options: ["Da kommt Mimi aus dem Busch.", "Pia hat eine Katze.", "Pia geht in den Garten."]
                answer: "Da kommt Mimi aus dem Busch."
                option_audio: false
                feedback:
                  "Pia geht in den Garten.": "Das passiert eher am Anfang. Was passiert, nachdem Pia ruft?"
                hints:
                  - "Am Ende erfährst du, wie die Geschichte ausgeht."
                  - "Pia sucht und ruft. Was passiert danach?"
                  - "Mimi kommt aus dem Busch."
              - id: l2-f3
                type: ordering
                text: "Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Sätze über den Schneemann. Leg sie in die richtige Reihenfolge."
                options: ["Dann rollen sie drei Kugeln.", "Zum Schluss bekommt der Schneemann eine Mütze.", "Zuerst gehen Lars und Ida in den Schnee.", "Danach setzen sie die Kugeln aufeinander."]
                slot_count: 4
                answer: ["Zuerst gehen Lars und Ida in den Schnee.", "Dann rollen sie drei Kugeln.", "Danach setzen sie die Kugeln aufeinander.", "Zum Schluss bekommt der Schneemann eine Mütze."]
                option_audio: false
                hints:
                  - "Such zuerst den Satz mit Zuerst und den Satz mit Zum Schluss."
                  - "Dann und Danach stehen in der Mitte. Was kommt vorher: rollen oder aufeinandersetzen?"
                  - "Zuerst in den Schnee, dann Kugeln rollen, danach aufeinandersetzen, zum Schluss die Mütze."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Satz ist der Anfang der Geschichte?"
                say: "Lies die Sätze. Welcher Satz ist der Anfang der Geschichte?"
                options: ["Es war einmal ein kleiner Igel.", "Am Ende schlief er glücklich ein.", "Da fand er einen dicken Apfel."]
                answer: "Es war einmal ein kleiner Igel."
                option_audio: false
                hints:
                  - "Am Anfang erfährst du, um wen es geht."
                  - "Welcher Satz sagt dir, wer in der Geschichte vorkommt?"
                  - "Es war einmal ein kleiner Igel."
              - id: l2-f5
                type: true_false
                text: "1. Paul weint.\n2. Paul fällt vom Rad.\n3. Oma tröstet ihn.\n\nStimmt die Reihenfolge?"
                say: "Lies die Sätze. Stimmt die Reihenfolge?"
                answer: false
                hints:
                  - "Frag dich: Warum weint Paul?"
                  - "Paul weint, weil er vom Rad gefallen ist. Was passiert also zuerst?"
                  - "Nein. Zuerst fällt Paul vom Rad, dann weint er."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Sätze. Leg sie so, dass eine Geschichte entsteht."
                options: ["Der Ballon fliegt weg.", "Lina lässt die Schnur los.", "Lina hat einen roten Luftballon."]
                slot_count: 3
                answer: ["Lina hat einen roten Luftballon.", "Lina lässt die Schnur los.", "Der Ballon fliegt weg."]
                option_audio: false
                hints: ["Warum fliegt der Ballon weg?"]
              - id: l2-s2
                type: multiple_choice
                text: "1. Jonas hat Hunger.\n2. Er macht sich ein Brot mit Käse.\n3. ?\n\nWelcher Satz ist das Ende?"
                say: "Lies die Geschichte. Welcher Satz ist das Ende?"
                options: ["Jetzt ist Jonas satt.", "Jonas hat großen Hunger.", "Jonas holt das Brot."]
                answer: "Jetzt ist Jonas satt."
                option_audio: false
                hints: ["Jonas hat das Brot schon gemacht. Was passiert danach?"]
              - id: l2-s3
                type: ordering
                text: "Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Sätze über das Geschenk. Leg sie in die richtige Reihenfolge."
                options: ["Danach macht sie eine Schleife darum.", "Zuerst malt Emma ein Bild für Oma.", "Zum Schluss gibt sie Oma das Geschenk.", "Dann packt sie das Bild in Papier ein."]
                slot_count: 4
                answer: ["Zuerst malt Emma ein Bild für Oma.", "Dann packt sie das Bild in Papier ein.", "Danach macht sie eine Schleife darum.", "Zum Schluss gibt sie Oma das Geschenk."]
                option_audio: false
                hints: ["Zuerst und Zum Schluss sind leicht. Was kommt vorher: einpacken oder die Schleife?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welcher Satz ist der Anfang der Geschichte?"
                say: "Lies die Sätze. Welcher Satz ist der Anfang der Geschichte?"
                options: ["Eines Morgens wachte der Bär auf.", "Danach ging er wieder schlafen.", "Er hatte großen Hunger."]
                answer: "Eines Morgens wachte der Bär auf."
                option_audio: false
                hints: ["Ein Anfang sagt dir oft, wann es war und wer da ist."]
              - id: l2-s5
                type: true_false
                text: "1. Die Ampel wird grün.\n2. Ella geht über die Straße.\n3. Ella ist auf der anderen Seite.\n\nStimmt die Reihenfolge?"
                say: "Lies die Sätze. Stimmt die Reihenfolge?"
                answer: true
                hints: ["Wann darf Ella über die Straße gehen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Sätze. Leg sie so, dass eine Geschichte entsteht."
                options: ["Die Tasse ist kaputt.", "Die Tasse fällt auf den Boden.", "Nina trägt eine Tasse zum Tisch."]
                slot_count: 3
                answer: ["Nina trägt eine Tasse zum Tisch.", "Die Tasse fällt auf den Boden.", "Die Tasse ist kaputt."]
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "1. Finn findet einen kleinen Vogel.\n2. Der Vogel kann nicht fliegen.\n3. Finn bringt ihn zum Tierarzt.\n4. ?\n\nWelcher Satz ist das Ende?"
                say: "Lies die Geschichte. Welcher Satz ist das Ende?"
                options: ["Bald kann der Vogel wieder fliegen.", "Finn geht in den Park.", "Finn sieht einen Vogel."]
                answer: "Bald kann der Vogel wieder fliegen."
                option_audio: false
              - id: l2-n3
                type: ordering
                text: "Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Sätze über den Ausflug. Leg sie in die richtige Reihenfolge."
                options: ["Am Strand bauen sie eine Burg.", "Am Abend fahren alle müde nach Hause.", "Am Morgen steigt die Familie ins Auto."]
                slot_count: 3
                answer: ["Am Morgen steigt die Familie ins Auto.", "Am Strand bauen sie eine Burg.", "Am Abend fahren alle müde nach Hause."]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Welcher Satz ist der Anfang der Geschichte?"
                say: "Lies die Sätze. Welcher Satz ist der Anfang der Geschichte?"
                options: ["Im Wald wohnte eine kleine Maus.", "Zum Schluss war die Maus nicht mehr allein.", "Dann traf sie einen Igel."]
                answer: "Im Wald wohnte eine kleine Maus."
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "1. Leo ist im Schwimmbad.\n2. Leo trocknet sich ab.\n3. Leo springt ins Wasser.\n\nStimmt die Reihenfolge?"
                say: "Lies die Sätze. Stimmt die Reihenfolge?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            text: "Die Sonne scheint.\nAnna holt ihren Ball.\nSie spielt mit Ole Fußball.\n\nLeg die Bilder in die Reihenfolge der Geschichte."
            say: "Lies die Geschichte. Leg die Bilder in die richtige Reihenfolge."
            options: [{ object: play-football }, { object: sun }, { object: ball }]
            slot_count: 3
            answer: [sun, ball, play-football]
          - id: l2-c2
            type: ordering
            text: "Leg die Sätze in die richtige Reihenfolge."
            say: "Lies die Sätze. Leg sie so, dass eine Geschichte entsteht."
            options: ["Der Turm fällt um.", "Sami baut einen hohen Turm.", "Der Hund rennt gegen den Turm."]
            slot_count: 3
            answer: ["Sami baut einen hohen Turm.", "Der Hund rennt gegen den Turm.", "Der Turm fällt um."]
