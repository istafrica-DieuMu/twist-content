# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.adjectives-opposites
skill: lit-de.adjectives.opposites
curriculum: de-DE
language: de
title:
  de: Gegenteile
  en: Opposites
summary: >
  Adjectives come in pairs of opposites (heiß and kalt). Lesson 1 finds
  the opposite of an adjective; lesson 2 finds opposites made with un-
  (freundlich, unfreundlich), uses the opposite in a sentence and ends
  with the skill check.
metadata:
  year: klasse-3
  topic: { de: Adjektive, en: Adjectives }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.adjectives.recognise]
  also_practises: [lit-de.adjectives.describe]
  vocabulary: { de: [Gegenteil, Gegensatzpaar, un-] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: related-not-opposite
      what: Picks a word that belongs to the same topic (heiß, warm) instead of the opposite (heiß, kalt)
      addressed: lesson 1 Learn sets nass and feucht apart from trocken; most opposite questions have a word of the same kind among the options (heiß with warm, freundlich with nett), with feedback in the full stage; true/false tasks show near-synonym pairs (kalt · kühl, klein · winzig)
    - id: un-everywhere
      what: Builds an opposite with un- for any adjective (ungroß, unalt)
      addressed: lesson 2 Learn says un- works only for some words (ungroß); true/false tasks in every stage of lesson 2 and in the skill check show a made-up un- word
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "heiß und kalt", en: "hot and cold" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Die Suppe ist heiß." }
            spans: ["heiß"]
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Der Weg ist steil." }
            spans: ["steil"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "hell · dunkel"
            say: "Viele Adjektive haben ein Gegenteil. Am Tag ist es hell, in der Nacht ist es dunkel. Hell und dunkel sind ein Gegensatzpaar."
          - text: "voll · leer"
            say: "Das Glas ist voll. Jetzt ist es leer. Voll und leer sind Gegenteile."
          - text: "nass · feucht · trocken"
            say: "Pass auf: Nass und feucht sind fast gleich. Das Gegenteil von nass ist trocken."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was ist das Gegenteil von „heiß“?"
                say: "Was ist das Gegenteil von heiß?"
                options: ["kalt", "warm", "laut"]
                answer: "kalt"
                feedback:
                  "warm": "Warm ist fast wie heiß. Das Gegenteil ist kalt."
                hints:
                  - "Das Gegenteil sagt das Umgekehrte."
                  - "Denk an Eis."
                  - "kalt."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Verbinde die Gegenteile."
                say: "Verbinde jedes Adjektiv mit seinem Gegenteil."
                pairs:
                  - { left: { text: "groß" }, right: { text: "klein" } }
                  - { left: { text: "alt" }, right: { text: "neu" } }
                  - { left: { text: "laut" }, right: { text: "leise" } }
                hints:
                  - "Such zu jedem Wort das Umgekehrte."
                  - "Ein Auto kann alt oder neu sein."
                  - "groß und klein, alt und neu, laut und leise."
              - id: l1-f3
                type: multiple_choice
                text: "Was ist das Gegenteil von „schwer“?"
                say: "Was ist das Gegenteil von schwer?"
                options: ["leicht", "dick", "stark"]
                answer: "leicht"
                feedback:
                  "dick": "Dick passt oft zu schwer, ist aber nicht das Gegenteil. Das Gegenteil ist leicht."
                hints:
                  - "Ein Stein ist schwer. Eine Feder ist …"
                  - "Das Wort beginnt mit l."
                  - "leicht."
              - id: l1-f4
                type: fill_in_blank
                text: "Ergänze das Gegenteil."
                say: "Ergänze das Gegenteil. Die Schnecke ist langsam, der Hase ist …"
                frame: "Die Schnecke ist langsam, der Hase ist _."
                options: ["schnell", "langsam", "müde"]
                answer: ["schnell"]
                hints:
                  - "Der Hase macht das Umgekehrte."
                  - "Er rennt."
                  - "schnell."
              - id: l1-f5
                type: true_false
                text: "Sind das Gegenteile? breit · schmal"
                say: "Lies die Karte. Sind das Gegenteile?"
                show: { drawn: letter-card, text: "breit · schmal" }
                answer: true
                hints:
                  - "Denk an eine Straße."
                  - "Eine breite Straße, ein schmaler Weg."
                  - "Ja, das sind Gegenteile."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was ist das Gegenteil von „hart“?"
                say: "Was ist das Gegenteil von hart?"
                options: ["weich", "fest", "rund"]
                answer: "weich"
                hints: ["Fest ist fast dasselbe wie hart."]
              - id: l1-s2
                type: matching
                text: "Verbinde die Gegenteile."
                say: "Verbinde jedes Adjektiv mit seinem Gegenteil."
                pairs:
                  - { left: { text: "lang" }, right: { text: "kurz" } }
                  - { left: { text: "sauber" }, right: { text: "schmutzig" } }
                  - { left: { text: "arm" }, right: { text: "reich" } }
                hints: ["Such zu jedem Wort das Umgekehrte."]
              - id: l1-s3
                type: multiple_choice
                text: "Was ist das Gegenteil von „traurig“?"
                say: "Was ist das Gegenteil von traurig?"
                options: ["fröhlich", "böse", "still"]
                answer: "fröhlich"
                hints: ["Sagt das Wort das Umgekehrte oder nur etwas anderes?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Ergänze das Gegenteil."
                say: "Ergänze das Gegenteil. Der Riese ist stark, der Zwerg ist …"
                frame: "Der Riese ist stark, der Zwerg ist _."
                options: ["schwach", "stark", "mutig"]
                answer: ["schwach"]
                hints: ["Der Zwerg ist das Umgekehrte von stark."]
              - id: l1-s5
                type: true_false
                text: "Sind das Gegenteile? kalt · kühl"
                say: "Lies die Karte. Sind das Gegenteile?"
                show: { drawn: letter-card, text: "kalt · kühl" }
                answer: false
                hints: ["Sagen die Wörter das Umgekehrte oder fast dasselbe?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was ist das Gegenteil von „dick“?"
                say: "Was ist das Gegenteil von dick?"
                options: ["dünn", "rund", "groß"]
                answer: "dünn"
              - id: l1-n2
                type: matching
                text: "Verbinde die Gegenteile."
                say: "Verbinde jedes Adjektiv mit seinem Gegenteil."
                pairs:
                  - { left: { text: "früh" }, right: { text: "spät" } }
                  - { left: { text: "hoch" }, right: { text: "tief" } }
                  - { left: { text: "süß" }, right: { text: "sauer" } }
              - id: l1-n3
                type: multiple_choice
                text: "Was ist das Gegenteil von „mutig“?"
                say: "Was ist das Gegenteil von mutig?"
                options: ["ängstlich", "stark", "frech"]
                answer: "ängstlich"
              - id: l1-n4
                type: fill_in_blank
                text: "Ergänze das Gegenteil."
                say: "Ergänze das Gegenteil. Im Sommer sind die Tage lang, im Winter sind sie …"
                frame: "Im Sommer sind die Tage lang, im Winter sind sie _."
                options: ["kurz", "lang", "kalt"]
                answer: ["kurz"]
              - id: l1-n5
                type: true_false
                text: "Sind das Gegenteile? nah · fern"
                say: "Lies die Karte. Sind das Gegenteile?"
                show: { drawn: letter-card, text: "nah · fern" }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist das Gegenteil von „billig“?"
            say: "Was ist das Gegenteil von billig?"
            options: ["teuer", "günstig", "neu"]
            answer: "teuer"
          - id: l1-c2
            type: fill_in_blank
            text: "Ergänze das Gegenteil."
            say: "Ergänze das Gegenteil. Der See ist tief, die Pfütze ist …"
            frame: "Der See ist tief, die Pfütze ist _."
            options: ["flach", "tief", "nass"]
            answer: ["flach"]
          - id: l1-c3
            type: true_false
            text: "Sind das Gegenteile? klein · winzig"
            say: "Lies die Karte. Sind das Gegenteile?"
            show: { drawn: letter-card, text: "klein · winzig" }
            answer: false

  - n: 2
    title: { de: "freundlich und unfreundlich", en: "friendly and unfriendly" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist das Gegenteil von „eng“?"
            say: "Was ist das Gegenteil von eng?"
            options: ["weit", "schmal", "klein"]
            answer: "weit"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Sind das Gegenteile? wild · zahm"
            say: "Lies die Karte. Sind das Gegenteile?"
            show: { drawn: letter-card, text: "wild · zahm" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "ehrlich · unehrlich"
            say: "Manche Gegenteile baust du mit un-: ehrlich und unehrlich. Un- bedeutet: nicht. Unehrlich heißt nicht ehrlich."
          - text: "ruhig · unruhig"
            say: "Ruhig und unruhig. Glücklich und unglücklich. Du setzt un- vor das Wort. Es bleibt ein Adjektiv und wird kleingeschrieben."
          - text: "groß · ungroß ✗ · klein ✓"
            say: "Aber Vorsicht: Un- passt nur bei manchen Wörtern. Ungroß gibt es nicht. Das Gegenteil von groß ist klein."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was ist das Gegenteil von „freundlich“?"
                say: "Was ist das Gegenteil von freundlich?"
                options: ["unfreundlich", "nett", "lieb"]
                answer: "unfreundlich"
                feedback:
                  "nett": "Nett ist fast wie freundlich. Das Gegenteil ist unfreundlich."
                hints:
                  - "Hier hilft un-."
                  - "un- und freundlich."
                  - "unfreundlich."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Gibt es das Wort? unalt"
                say: "Lies die Karte. Gibt es dieses Wort?"
                show: { drawn: letter-card, text: "unalt" }
                answer: false
                hints:
                  - "Un- passt nur bei manchen Wörtern."
                  - "Was ist das Gegenteil von alt?"
                  - "Nein. Das Gegenteil von alt ist jung oder neu."
              - id: l2-f3
                type: fill_in_blank
                text: "Ergänze das Gegenteil."
                say: "Ergänze das Gegenteil. Das Zimmer ist ordentlich. Nach dem Spielen ist es …"
                frame: "Nach dem Spielen ist das Zimmer _."
                options: ["unordentlich", "ordentlich", "aufgeräumt"]
                answer: ["unordentlich"]
                hints:
                  - "Bau das Gegenteil mit un-."
                  - "un- und ordentlich."
                  - "unordentlich."
              - id: l2-f4
                type: matching
                text: "Verbinde die Gegenteile."
                say: "Verbinde jedes Adjektiv mit seinem Gegenteil."
                pairs:
                  - { left: { text: "möglich" }, right: { text: "unmöglich" } }
                  - { left: { text: "satt" }, right: { text: "hungrig" } }
                  - { left: { text: "bekannt" }, right: { text: "unbekannt" } }
                hints:
                  - "Zwei Gegenteile haben un-, eins nicht."
                  - "Wer viel gegessen hat, ist satt."
                  - "möglich und unmöglich, satt und hungrig, bekannt und unbekannt."
              - id: l2-f5
                type: multiple_choice
                text: "Was ist das Gegenteil von „wach“?"
                say: "Was ist das Gegenteil von wach?"
                options: ["müde", "unwach", "munter"]
                answer: "müde"
                feedback:
                  "unwach": "Unwach gibt es nicht. Das Gegenteil von wach ist müde."
                  "munter": "Munter ist fast wie wach."
                hints:
                  - "Munter ist fast dasselbe wie wach."
                  - "Das Gegenteil hat kein un-."
                  - "müde."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was ist das Gegenteil von „gesund“?"
                say: "Was ist das Gegenteil von gesund?"
                options: ["ungesund", "fit", "stark"]
                answer: "ungesund"
                hints: ["Welches Wort heißt: nicht gesund?"]
              - id: l2-s2
                type: true_false
                text: "Gibt es das Wort? unschnell"
                say: "Lies die Karte. Gibt es dieses Wort?"
                show: { drawn: letter-card, text: "unschnell" }
                answer: false
                hints: ["Was ist das Gegenteil von schnell?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Ergänze das Gegenteil."
                say: "Ergänze das Gegenteil. Die Bank ist nicht bequem, sie ist …"
                frame: "Die Bank ist _."
                options: ["unbequem", "bequem", "unweich"]
                answer: ["unbequem"]
                hints: ["Nicht bequem: Bau das Gegenteil mit un-."]
              - id: l2-s4
                type: matching
                text: "Verbinde die Gegenteile."
                say: "Verbinde jedes Adjektiv mit seinem Gegenteil."
                pairs:
                  - { left: { text: "wichtig" }, right: { text: "unwichtig" } }
                  - { left: { text: "richtig" }, right: { text: "falsch" } }
                  - { left: { text: "sicher" }, right: { text: "unsicher" } }
                hints: ["Eins der Gegenteile hat kein un-."]
              - id: l2-s5
                type: true_false
                text: "Gibt es das Wort? unsichtbar"
                say: "Lies die Karte. Gibt es dieses Wort?"
                show: { drawn: letter-card, text: "unsichtbar" }
                answer: true
                hints: ["Kann man etwas sehen, ist es sichtbar. Und wenn nicht?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Was ist das Gegenteil von „höflich“?"
                say: "Was ist das Gegenteil von höflich?"
                options: ["unhöflich", "freundlich", "leise"]
                answer: "unhöflich"
              - id: l2-n2
                type: true_false
                text: "Gibt es das Wort? unklein"
                say: "Lies die Karte. Gibt es dieses Wort?"
                show: { drawn: letter-card, text: "unklein" }
                answer: false
              - id: l2-n3
                type: fill_in_blank
                text: "Ergänze das Gegenteil."
                say: "Ergänze das Gegenteil. Das Kind ist nicht zufrieden, es ist …"
                frame: "Das Kind ist _."
                options: ["unzufrieden", "zufrieden", "unklein"]
                answer: ["unzufrieden"]
              - id: l2-n4
                type: matching
                text: "Verbinde die Gegenteile."
                say: "Verbinde jedes Adjektiv mit seinem Gegenteil."
                pairs:
                  - { left: { text: "geduldig" }, right: { text: "ungeduldig" } }
                  - { left: { text: "jung" }, right: { text: "alt" } }
                  - { left: { text: "pünktlich" }, right: { text: "unpünktlich" } }
              - id: l2-n5
                type: multiple_choice
                text: "Was ist das Gegenteil von „stumpf“?"
                say: "Was ist das Gegenteil von stumpf?"
                options: ["scharf", "unstumpf", "rund"]
                answer: "scharf"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Was ist das Gegenteil von „fair“?"
            say: "Was ist das Gegenteil von fair?"
            options: ["unfair", "gerecht", "nett"]
            answer: "unfair"
          - id: l2-c2
            type: multiple_choice
            text: "Was ist das Gegenteil von „glatt“?"
            say: "Was ist das Gegenteil von glatt?"
            options: ["rau", "weich", "eben"]
            answer: "rau"
          - id: l2-c3
            type: true_false
            text: "Gibt es das Wort? unlaut"
            say: "Lies die Karte. Gibt es dieses Wort?"
            show: { drawn: letter-card, text: "unlaut" }
            answer: false
          - id: l2-c4
            type: fill_in_blank
            text: "Ergänze das Gegenteil."
            say: "Ergänze das Gegenteil. Der Junge ist nicht vorsichtig, er ist …"
            frame: "Der Junge ist _."
            options: ["unvorsichtig", "vorsichtig", "unleise"]
            answer: ["unvorsichtig"]
          - id: l2-c5
            type: matching
            text: "Welche Wörter sind Gegenteile?"
            say: "Welche Wörter sind Gegenteile? Verbinde sie."
            pairs:
              - { left: { text: "dankbar" }, right: { text: "undankbar" } }
              - { left: { text: "fleißig" }, right: { text: "faul" } }
              - { left: { text: "schön" }, right: { text: "hässlich" } }
