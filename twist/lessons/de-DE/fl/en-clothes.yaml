# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-clothes
skill: fl.themes.clothes
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Kleidung auf Englisch
  en: Clothes in English
summary: >
  Clothes words, clothes with a colour, and saying what you are wearing.
  Lesson 1 brings jumper, jacket, dress and skirt next to the familiar
  T-shirt, trousers, shoes and hat; lesson 2 puts a colour before the
  word (a red jumper), says "I'm wearing …", and ends with the skill
  check. Instructions are in German; the English is spoken and shown in
  short form.
metadata:
  year: lernjahr-1
  topic: { de: Kleidung, en: Clothes }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.colours]
  also_practises: [fl.themes.colours, fl.grammar.plurals-articles]
  vocabulary: { en: [jumper, jacket, dress, skirt, T-shirt, trousers, shoes, hat, "I'm wearing …", "What are you wearing?"] }
  forms: [audio, picture, text, drawn]
  drawn: [colour-swatch]
  facets: []
  misconceptions:
    - id: jacket-jumper
      what: Mixes up jacket and jumper, two tops with long sleeves
      addressed: jacket and jumper share an option set in every stage of lesson 1, with feedback in l1-f1
    - id: colour-after
      what: Puts the colour after the word (a jumper red)
      addressed: lesson 2 Learn says the colour comes first, as in German; an ordering task in every stage of lesson 2
    - id: trousers-singular
      what: Says "a trousers" because Hose is singular in German
      addressed: lesson 1 Learn says trousers is always plural; l1-s4 and l2-n3 offer "a trousers"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "jumper, jacket, dress, skirt", en: "jumper, jacket, dress, skirt" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf die Farbe." }
            audio: { en: "Yellow." }
            options:
              - { drawn: colour-swatch, colour: yellow }
              - { drawn: colour-swatch, colour: green }
              - { drawn: colour-swatch, colour: blue }
            answer: yellow
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "A hat." }
            options: [{ object: hat }, { object: sock }, { object: shoe }]
            answer: hat
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Heute geht es um Kleidung. Hör zu und sprich nach.", en: "A jumper." }
            show: { object: jumper }
          - say: { en: "A jacket." }
            show: { object: jacket }
          - say: { en: "A dress." }
            show: { object: dress }
          - say: { en: "A skirt." }
            show: { object: skirt }
          - text: "trousers"
            say: { de: "Und pass auf: Die Hose heißt „trousers“. Das Wort steht immer in der Mehrzahl, also nie „a trousers“.", en: "Trousers." }
            show: { object: trousers }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "A jacket." }
                options: [{ object: jacket }, { object: jumper }, { object: dress }]
                answer: jacket
                feedback:
                  jumper: "Das ist der Pullover, „jumper“. Die Jacke mit dem Reißverschluss heißt „jacket“."
                hints:
                  - "Hör noch einmal: „jacket“."
                  - "„Jacket“ klingt fast wie Jacke."
                  - "Tippe auf die Jacke."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "A skirt." }
                options: [{ object: trousers }, { object: skirt }, { object: sock }]
                answer: skirt
                hints:
                  - "Hör noch einmal: „skirt“."
                  - "„Skirt“ ist der Rock."
                  - "Tippe auf den Rock."
              - id: l1-f3
                type: speak
                say: { de: "Sag es auf Englisch.", en: "A dress." }
                show: { object: dress }
                expected_text: a dress
                hints:
                  - "Hör noch einmal zu: „a dress“."
                  - "Das d und das r gehen zusammen: dr."
                  - "Sag mit mir: „a dress“."
              - id: l1-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes englische Wort mit dem deutschen."
                pairs:
                  - { left: { text: "jumper" }, right: { text: "der Pullover" } }
                  - { left: { text: "shoes" }, right: { text: "die Schuhe" } }
                  - { left: { text: "hat" }, right: { text: "der Hut" } }
                hints:
                  - "Fang mit dem Wort an, das du sicher weißt."
                  - "„Shoes“ klingt fast wie Schuhe."
                  - "„Jumper“ passt zu Pullover, „shoes“ zu Schuhe, „hat“ zu Hut."
              - id: l1-f5
                type: true_false
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "A T-shirt." }
                show: { object: t-shirt }
                answer: true
                hints:
                  - "Hör noch einmal: „a T-shirt“."
                  - "Auf Deutsch sagt man auch T-Shirt."
                  - "Ja, das passt."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "A jumper." }
                options: [{ object: dress }, { object: jacket }, { object: jumper }]
                answer: jumper
                hints: ["Hör noch einmal. Hat es einen Reißverschluss oder nicht?"]
              - id: l1-s2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "A dress." }
                options: [{ object: skirt }, { object: dress }, { object: t-shirt }]
                answer: dress
                hints: ["„Dress“ ist das Kleid, „skirt“ der Rock."]
              - id: l1-s3
                type: speak
                say: { de: "Sag es auf Englisch.", en: "A jacket." }
                show: { object: jacket }
                expected_text: a jacket
                hints: ["Fast wie Jacke, aber vorne klingt es wie „dsch“ und am Ende wie „it“."]
              - id: l1-s4
                type: multiple_choice
                text: "Die Hose"
                say: "Wie sagst du auf Englisch: die Hose?"
                options: ["trousers", "a trousers", "a trouser"]
                answer: "trousers"
                option_audio: false
                hints: ["Steht das Wort in der Einzahl oder in der Mehrzahl?"]
              - id: l1-s5
                type: true_false
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "A skirt." }
                show: { object: dress }
                answer: false
                hints: ["Was ist auf dem Bild? Und was heißt „skirt“?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Trousers." }
                options: [{ object: skirt }, { object: trousers }, { object: sock }]
                answer: trousers
              - id: l1-n2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "A jumper." }
                options: [{ object: jumper }, { object: t-shirt }, { object: jacket }]
                answer: jumper
              - id: l1-n3
                type: speak
                say: { de: "Was ist das? Sag es auf Englisch." }
                show: { object: skirt }
                expected_text: a skirt
              - id: l1-n4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes englische Wort mit dem deutschen."
                pairs:
                  - { left: { text: "jacket" }, right: { text: "die Jacke" } }
                  - { left: { text: "dress" }, right: { text: "das Kleid" } }
                  - { left: { text: "trousers" }, right: { text: "die Hose" } }
              - id: l1-n5
                type: true_false
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Shoes." }
                show: { object: shoe, count: 2, layout: row }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "A dress." }
            options: [{ object: jumper }, { object: skirt }, { object: dress }]
            answer: dress
          - id: l1-c2
            type: audio_choice
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "A jacket." }
            options: [{ object: jumper }, { object: jacket }, { object: t-shirt }]
            answer: jacket
          - id: l1-c3
            type: true_false
            say: { de: "Hör zu. Passt das Wort zum Bild?", en: "A jumper." }
            show: { object: skirt }
            answer: false

  - n: 2
    title: { de: "a red jumper", en: "a red jumper" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "A skirt." }
            options: [{ object: skirt }, { object: dress }, { object: trousers }]
            answer: skirt
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Die Jacke"
            say: "Wie sagst du auf Englisch: die Jacke?"
            options: ["a jacket", "a jumper", "a dress"]
            answer: "a jacket"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "a red jumper"
            say: { de: "Die Farbe steht vor dem Wort, genau wie im Deutschen: ein roter Pullover.", en: "A red jumper." }
            show: { object: jumper, colour: red, key: jumper-red }
          - text: "a green dress"
            say: { en: "A green dress." }
            show: { object: dress, colour: green, key: dress-green }
          - text: "I'm wearing a blue jacket."
            say: { de: "So sagst du, was du anhast:", en: "What are you wearing? I'm wearing a blue jacket." }
            show: { object: jacket, colour: blue, key: jacket-blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "A yellow skirt." }
                options:
                  - { object: skirt, colour: yellow, key: skirt-yellow }
                  - { object: skirt, colour: blue, key: skirt-blue }
                  - { object: dress, colour: yellow, key: dress-yellow }
                answer: skirt-yellow
                hints:
                  - "Hör auf die Farbe und auf das Kleidungsstück."
                  - "„Yellow“ ist gelb, „skirt“ ist der Rock."
                  - "Tippe auf den gelben Rock."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Bau: ein grüner Pullover"
                say: "Bau es auf Englisch: ein grüner Pullover."
                options: ["jumper", "a", "green"]
                slot_count: 3
                answer: ["a", "green", "jumper"]
                option_audio: false
                hints:
                  - "Zuerst kommt „a“."
                  - "Die Farbe steht vor dem Wort."
                  - "„a green jumper“"
              - id: l2-f3
                type: audio_choice
                say: { de: "Hör zu. Was hat das Kind an?" }
                audio: { en: "I'm wearing a red jacket." }
                options:
                  - { object: jacket, colour: red, key: jacket-red }
                  - { object: jumper, colour: red, key: jumper-red }
                  - { object: jacket, colour: green, key: jacket-green }
                answer: jacket-red
                hints:
                  - "Hör auf die zwei Wörter am Ende."
                  - "„Red“ ist rot, „jacket“ ist die Jacke."
                  - "Tippe auf die rote Jacke."
              - id: l2-f4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "A blue dress." }
                show: { object: dress, colour: blue, key: dress-blue }
                expected_text: a blue dress
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst die Farbe, dann das Kleid."
                  - "Sag mit mir: „a blue dress“."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Du hast einen gelben Pullover an. Was sagst du auf Englisch?"
                options: ["I'm wearing a yellow jumper.", "I'm wearing a jumper yellow.", "I wearing a yellow jumper."]
                answer: "I'm wearing a yellow jumper."
                option_audio: false
                feedback:
                  "I'm wearing a jumper yellow.": "Die Farbe steht vor dem Wort: „a yellow jumper“."
                hints:
                  - "Wo steht die Farbe?"
                  - "Und vor „wearing“ steht „I'm“."
                  - "Richtig ist: „I'm wearing a yellow jumper.“"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "A green jumper." }
                options:
                  - { object: jumper, colour: blue, key: jumper-blue }
                  - { object: jacket, colour: green, key: jacket-green }
                  - { object: jumper, colour: green, key: jumper-green }
                answer: jumper-green
                hints: ["Hör auf beide Wörter."]
              - id: l2-s2
                type: ordering
                text: "Bau: ein blauer Rock"
                say: "Bau es auf Englisch: ein blauer Rock."
                options: ["blue", "skirt", "a"]
                slot_count: 3
                answer: ["a", "blue", "skirt"]
                option_audio: false
                hints: ["Wo steht die Farbe?"]
              - id: l2-s3
                type: audio_choice
                say: { de: "Hör zu. Was hat das Kind an?" }
                audio: { en: "I'm wearing a yellow dress." }
                options:
                  - { object: skirt, colour: yellow, key: skirt-yellow }
                  - { object: dress, colour: yellow, key: dress-yellow }
                  - { object: dress, colour: red, key: dress-red }
                answer: dress-yellow
                hints: ["Hör auf die Farbe und auf das Wort danach."]
              - id: l2-s4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "A red skirt." }
                show: { object: skirt, colour: red, key: skirt-red }
                expected_text: a red skirt
                hints: ["Zuerst die Farbe."]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Satz ist richtig?"
                say: "Du hast eine grüne Jacke an. Was sagst du auf Englisch?"
                options: ["I'm wearing a jacket green.", "I'm wearing a green jacket.", "I'm a green jacket."]
                answer: "I'm wearing a green jacket."
                option_audio: false
                hints: ["Wo steht die Farbe? Und fehlt ein Wort?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "A yellow jacket." }
                options:
                  - { object: jacket, colour: yellow, key: jacket-yellow }
                  - { object: jumper, colour: yellow, key: jumper-yellow }
                  - { object: jacket, colour: blue, key: jacket-blue }
                answer: jacket-yellow
              - id: l2-n2
                type: ordering
                text: "Bau: ein gelbes Kleid"
                say: "Bau es auf Englisch: ein gelbes Kleid."
                options: ["dress", "yellow", "a"]
                slot_count: 3
                answer: ["a", "yellow", "dress"]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Ich habe eine rote Hose an."
                say: "Wie sagst du auf Englisch: Ich habe eine rote Hose an?"
                options: ["I'm wearing a red trousers.", "I'm wearing red trousers.", "I'm wearing trousers red."]
                answer: "I'm wearing red trousers."
                option_audio: false
              - id: l2-n4
                type: speak
                say: { de: "Was ist das? Sag es auf Englisch mit der Farbe." }
                show: { object: jumper, colour: yellow, key: jumper-yellow }
                expected_text: a yellow jumper
              - id: l2-n5
                type: audio_choice
                say: { de: "Hör zu. Was hat das Kind an?" }
                audio: { en: "I'm wearing a green skirt." }
                options:
                  - { object: skirt, colour: red, key: skirt-red }
                  - { object: dress, colour: green, key: dress-green }
                  - { object: skirt, colour: green, key: skirt-green }
                answer: skirt-green

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "A red dress." }
            options:
              - { object: dress, colour: red, key: dress-red }
              - { object: skirt, colour: red, key: skirt-red }
              - { object: dress, colour: blue, key: dress-blue }
            answer: dress-red
          - id: l2-c2
            type: audio_choice
            say: { de: "Hör zu. Was hat das Kind an?" }
            audio: { en: "I'm wearing trousers." }
            options: [{ object: trousers }, { object: skirt }, { object: dress }]
            answer: trousers
          - id: l2-c3
            type: ordering
            text: "Bau: eine rote Jacke"
            say: "Bau es auf Englisch: eine rote Jacke."
            options: ["red", "a", "jacket"]
            slot_count: 3
            answer: ["a", "red", "jacket"]
            option_audio: false
          - id: l2-c4
            type: audio_choice
            say: { de: "Hör zu. Was hat das Kind an?" }
            audio: { en: "I'm wearing a blue jumper." }
            options:
              - { object: jacket, colour: blue, key: jacket-blue }
              - { object: jumper, colour: blue, key: jumper-blue }
              - { object: jumper, colour: green, key: jumper-green }
            answer: jumper-blue
          - id: l2-c5
            type: multiple_choice
            text: "Welcher Satz ist richtig?"
            say: "Du hast einen grünen Rock an. Was sagst du auf Englisch?"
            options: ["I'm wearing a green skirt.", "I'm wearing a skirt green.", "I wearing a green skirt."]
            answer: "I'm wearing a green skirt."
            option_audio: false
