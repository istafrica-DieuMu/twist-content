# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-hello
skill: fl.themes.hello
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Hallo und Tschüss auf Englisch
  en: Hello and goodbye in English
summary: >
  Greeting, saying your name and saying goodbye, with please and thank
  you. Stufe 0 is oral only: instructions are spoken in German, the
  phrases in English. Lesson 1 brings hello, hi, goodbye, bye and good
  morning; lesson 2 adds My name is … and What's your name?, please and
  thank you, and ends with the skill check.
metadata:
  year: stufe-0
  topic: { de: Hallo, en: Hello }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: [fl.speaking.greet, fl.speaking.imitate]
  vocabulary: { en: [hello, hi, goodbye, bye, good morning, My name is, "What's your name?", please, thank you] }
  no_reading: true
  forms: [audio, picture]
  drawn: []
  facets: []
  misconceptions:
    - id: hello-for-goodbye
      what: Uses hello and goodbye the wrong way round
      addressed: every stage of lesson 1 asks whether a phrase is said to greet or to say goodbye, and sets hi against bye in the some stage; l1-f2 gives feedback when goodbye is taken for a greeting
    - id: german-sound
      what: Says English phrases with German sounds ("Gutbai", "Senk ju")
      addressed: every phrase is heard before the child says it; the speak hints show the th of thank you (tongue between the teeth) and the rounded lips for the w of What's your name?
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Hello und goodbye", en: "Hello and goodbye" }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Wenn du jemanden triffst, sagst du auf Englisch:", en: "Hello! Hi!" }
            show: { object: child }
          - say: { de: "Am Morgen kannst du auch sagen:", en: "Good morning!" }
          - say: { de: "Wenn du gehst, sagst du:", en: "Goodbye! Bye!" }
            show: { object: house }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Hello!" }
                answer: true
                hints:
                  - "Hör noch einmal: hello."
                  - "„Hello“ klingt fast wie Hallo."
                  - "Tippe auf Ja. „Hello“ sagst du zur Begrüßung."
                difficulty: easy
              - id: l1-f2
                type: true_false
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Goodbye!" }
                answer: false
                feedback:
                  "true": "„Goodbye“ sagst du, wenn du gehst. Zur Begrüßung sagst du „hello“."
                hints:
                  - "Hör noch einmal: goodbye."
                  - "„Goodbye“ heißt Tschüss oder Auf Wiedersehen."
                  - "Tippe auf Nein. „Goodbye“ sagst du zum Abschied."
              - id: l1-f3
                type: speak
                say: { de: "Begrüß deine Lehrerin auf Englisch.", en: "Hello!" }
                expected_text: hello
                hints:
                  - "Hör noch einmal: hello."
                  - "Es klingt fast wie Hallo, nur am Anfang mit e: he-llo."
                  - "Sag mit mir: hello."
              - id: l1-f4
                type: true_false
                say: { de: "Hör zu. Sagt man das am Morgen?", en: "Good morning!" }
                answer: true
                hints:
                  - "Hör noch einmal: good morning."
                  - "„Morning“ heißt Morgen."
                  - "Tippe auf Ja. „Good morning“ heißt Guten Morgen."
              - id: l1-f5
                type: speak
                say: { de: "Du gehst nach Hause. Verabschiede dich auf Englisch.", en: "Goodbye!" }
                expected_text: goodbye
                hints:
                  - "Hör noch einmal: goodbye."
                  - "Es hat zwei Teile: good … bye."
                  - "Sag mit mir: goodbye."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Bye!" }
                answer: true
                hints: ["„Bye“ ist die kurze Form von „goodbye“."]
              - id: l1-s2
                type: true_false
                say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Hi!" }
                answer: false
                hints: ["Hör noch einmal: hi. Sagst du das, wenn du kommst oder wenn du gehst?"]
              - id: l1-s3
                type: speak
                say: { de: "Es ist Morgen. Sag Guten Morgen auf Englisch.", en: "Good morning!" }
                expected_text: good morning
                hints: ["Zwei Wörter: good … morning. Sprich mir nach."]
              - id: l1-s4
                type: true_false
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Hi!" }
                answer: true
                hints: ["Hör noch einmal: hi. Wann sagst du das?"]
              - id: l1-s5
                type: speak
                say: { de: "Verabschiede dich kurz auf Englisch.", en: "Bye!" }
                expected_text: bye
                hints: ["Das kurze Wort steckt in „goodbye“: bye."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Good morning!" }
                answer: true
              - id: l1-n2
                type: true_false
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Bye!" }
                answer: false
              - id: l1-n3
                type: speak
                say: { de: "Begrüß deine Freundin ganz kurz auf Englisch.", en: "Hi!" }
                expected_text: hi
              - id: l1-n4
                type: true_false
                say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Goodbye!" }
                answer: true
              - id: l1-n5
                type: speak
                say: { de: "Sag Hallo auf Englisch.", en: "Hello!" }
                expected_text: hello

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: true_false
            say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Hello!" }
            answer: false
          - id: l1-c2
            type: true_false
            say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Hi!" }
            answer: true
          - id: l1-c3
            type: true_false
            say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Bye!" }
            answer: true

  - n: 2
    title: { de: "My name is …", en: "My name is …" }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "So fragst du nach dem Namen:", en: "What's your name?" }
            show: { object: girl }
          - say: { de: "So sagst du deinen Namen:", en: "My name is Emma." }
            show: { object: girl }
          - say: { de: "Bitte heißt „please“. Danke heißt „thank you“. Bei „th“ legst du die Zunge kurz zwischen die Zähne.", en: "Please. Thank you." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                say: { de: "Hör zu. Fragt hier jemand nach deinem Namen?", en: "What's your name?" }
                answer: true
                hints:
                  - "Hör noch einmal: What's your name?"
                  - "Hörst du das Wort „name“? Es klingt fast wie Name."
                  - "Tippe auf Ja. „What's your name?“ heißt: Wie heißt du?"
                difficulty: easy
              - id: l2-f2
                type: speak
                say: { de: "Sag deinen Namen auf Englisch. Fang so an.", en: "My name is …" }
                expected_text: my name is
                hints:
                  - "Hör noch einmal: My name is."
                  - "Dann sagst du deinen Namen."
                  - "Sag „My name is“ und dann deinen Namen."
              - id: l2-f3
                type: true_false
                say: { de: "Hör zu. Bedankt sich hier jemand?", en: "Thank you." }
                answer: true
                hints:
                  - "Hör noch einmal: thank you."
                  - "„Thank you“ heißt danke."
                  - "Tippe auf Ja."
              - id: l2-f4
                type: true_false
                say: { de: "Hör zu. Heißt das bitte?", en: "Thank you." }
                answer: false
                feedback:
                  "true": "„Thank you“ heißt danke. Bitte heißt „please“."
                hints:
                  - "Hör noch einmal: thank you."
                  - "Ist das bitte oder danke?"
                  - "Tippe auf Nein. „Thank you“ heißt danke."
              - id: l2-f5
                type: speak
                say: { de: "Du bekommst ein Geschenk. Bedank dich auf Englisch.", en: "Thank you." }
                expected_text: thank you
                hints:
                  - "Hör noch einmal: thank you."
                  - "Bei „th“ liegt die Zunge kurz zwischen den Zähnen."
                  - "Sag mit mir: thank you."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                say: { de: "Hör zu. Sagt hier jemand seinen Namen?", en: "My name is Tom." }
                answer: true
                hints: ["Was hörst du nach „My name is“?"]
              - id: l2-s2
                type: speak
                say: { de: "Frag ein Kind auf Englisch, wie es heißt.", en: "What's your name?" }
                expected_text: what's your name
                hints: ["Am Anfang machst du die Lippen rund: w … What's your name?"]
              - id: l2-s3
                type: true_false
                say: { de: "Hör zu. Heißt das bitte?", en: "Please." }
                answer: true
                hints: ["Hör noch einmal: please. Was sagst du, wenn du etwas haben möchtest?"]
              - id: l2-s4
                type: true_false
                say: { de: "Hör zu. Fragt hier jemand nach deinem Namen?", en: "Goodbye!" }
                answer: false
                hints: ["Hör auf das Wort „name“."]
              - id: l2-s5
                type: speak
                say: { de: "Du möchtest einen Stift. Sag bitte auf Englisch.", en: "Please." }
                expected_text: please
                hints: ["Ein kurzes Wort, das e klingt wie ein langes i: pliis."]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                say: { de: "Hör zu. Bedankt sich hier jemand?", en: "Please." }
                answer: false
              - id: l2-n2
                type: speak
                say: { de: "Sag deinen Namen auf Englisch.", en: "My name is …" }
                expected_text: my name is
              - id: l2-n3
                type: true_false
                say: { de: "Hör zu. Sagt hier jemand seinen Namen?", en: "My name is Lina." }
                answer: true
              - id: l2-n4
                type: true_false
                say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Hello! What's your name?" }
                answer: true
              - id: l2-n5
                type: speak
                say: { de: "Bedank dich auf Englisch.", en: "Thank you." }
                expected_text: thank you

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: true_false
            say: { de: "Hör zu. Sagt man das zum Abschied?", en: "Good morning!" }
            answer: false
          - id: l2-c2
            type: true_false
            say: { de: "Hör zu. Fragt hier jemand nach deinem Namen?", en: "Hi! What's your name?" }
            answer: true
          - id: l2-c3
            type: true_false
            say: { de: "Hör zu. Heißt das danke?", en: "Thank you, Lina." }
            answer: true
          - id: l2-c4
            type: true_false
            say: { de: "Hör zu. Sagt hier jemand seinen Namen?", en: "Hello! My name is Ben." }
            answer: true
          - id: l2-c5
            type: true_false
            say: { de: "Hör zu. Sagt man das zur Begrüßung?", en: "Bye, Mr Brown!" }
            answer: false
