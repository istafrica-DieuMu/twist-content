# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-school
skill: fl.themes.school
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Schulsachen auf Englisch
  en: School things in English
summary: >
  School things in English and asking for one politely. Stufe 0 is oral
  only: instructions are spoken in German, the words in English. Lesson 1
  brings pencil, ruler, rubber, scissors and book; lesson 2 adds school
  bag, pencil case and chair, "Can I have a …, please?" with "Here you
  are.", and ends with the skill check.
metadata:
  year: stufe-0
  topic: { de: Schule, en: School }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: [fl.speaking.imitate, fl.themes.colours]
  vocabulary: { en: [pencil, ruler, rubber, scissors, book, school bag, pencil case, chair, "Can I have a …, please?", "Here you are."] }
  no_reading: true
  forms: [audio, picture, drawn]
  drawn: [colour-swatch]
  facets: []
  misconceptions:
    - id: pencil-crayon
      what: Calls every pencil a crayon, or the other way round
      addressed: pencil and crayon sit side by side in an audio task in every stage of lesson 1, with feedback in l1-f1
    - id: rubber-german
      what: Says "Radiergummi" or a German-sounding "Gummi" for rubber
      addressed: rubber is heard in Learn and in audio tasks before the child says it; the hints in l1-f4 break it into rub and ber
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Pencil, ruler, rubber", en: "Pencil, ruler, rubber" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf die Farbe." }
            audio: { en: "Green." }
            options:
              - { drawn: colour-swatch, colour: green }
              - { drawn: colour-swatch, colour: red }
              - { drawn: colour-swatch, colour: yellow }
            answer: green
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Crayon." }
            options: [{ object: crayon }, { object: ball }, { object: car }]
            answer: crayon
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Das sind Schulsachen. Hör zu und sprich nach.", en: "Pencil." }
            show: { object: pencil }
          - say: { en: "Ruler." }
            show: { object: ruler }
          - say: { en: "Rubber." }
            show: { object: rubber }
          - say: { en: "Scissors." }
            show: { object: scissors }
          - say: { en: "Book." }
            show: { object: book }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Pencil." }
                options: [{ object: pencil }, { object: crayon }, { object: ruler }]
                answer: pencil
                feedback:
                  crayon: "Das ist ein Wachsmalstift, auf Englisch „crayon“. „Pencil“ ist der Bleistift."
                hints:
                  - "Hör noch einmal: pencil."
                  - "Mit einem „pencil“ schreibst du. Was du damit schreibst, kannst du wegradieren."
                  - "Tippe auf den Bleistift."
                difficulty: easy
              - id: l1-f2
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Ruler." }
                show: { object: ruler }
                expected_text: ruler
                hints:
                  - "Hör noch einmal zu: ruler."
                  - "Zwei Teile: ru und ler. Das u ist lang."
                  - "Sag mit mir: ruler."
                difficulty: easy
              - id: l1-f3
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Scissors." }
                options: [{ object: book }, { object: scissors }, { object: rubber }]
                answer: scissors
                hints:
                  - "Hör noch einmal: scissors."
                  - "Mit „scissors“ schneidest du Papier."
                  - "Tippe auf die Schere."
              - id: l1-f4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Rubber." }
                show: { object: rubber }
                expected_text: rubber
                hints:
                  - "Hör noch einmal zu: rubber."
                  - "Zwei Teile: rub und ber. Das u klingt fast wie ein a."
                  - "Sag mit mir: rubber."
              - id: l1-f5
                type: true_false
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Book." }
                show: { object: book }
                answer: true
                hints:
                  - "Hör noch einmal: book."
                  - "„Book“ ist ein Buch."
                  - "Tippe auf Ja."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Ruler." }
                options: [{ object: pencil }, { object: scissors }, { object: ruler }]
                answer: ruler
                hints: ["Hör noch einmal genau hin: ruler. Das Wort hat zwei Teile, ru und ler."]
              - id: l1-s2
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Pencil." }
                show: { object: pencil }
                expected_text: pencil
                hints: ["Hör noch einmal zu: pencil. Sprich es langsam in zwei Teilen nach: pen, cil."]
              - id: l1-s3
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Crayon." }
                options: [{ object: rubber }, { object: pencil }, { object: crayon }]
                answer: crayon
                hints: ["„Pencil“ oder „crayon“? Hör noch einmal genau hin."]
              - id: l1-s4
                type: true_false
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Scissors." }
                show: { object: ruler }
                answer: false
                hints: ["Hör noch einmal: scissors. Wie heißt das Ding auf dem Bild auf Englisch?"]
              - id: l1-s5
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Rubber." }
                options: [{ object: book }, { object: rubber }, { object: scissors }]
                answer: rubber
                hints: ["Hör noch einmal: rubber. Sprich das Wort leise nach und schau dir dabei die Bilder an."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Pencil." }
                options: [{ object: crayon }, { object: book }, { object: pencil }]
                answer: pencil
              - id: l1-n2
                type: speak
                say: { de: "Was ist das? Sag es auf Englisch." }
                show: { object: scissors }
                expected_text: scissors
              - id: l1-n3
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Book." }
                options: [{ object: ruler }, { object: book }, { object: rubber }]
                answer: book
              - id: l1-n4
                type: true_false
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Rubber." }
                show: { object: book }
                answer: false
              - id: l1-n5
                type: speak
                say: { de: "Was ist das? Sag es auf Englisch." }
                show: { object: book }
                expected_text: book

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Scissors." }
            options: [{ object: scissors }, { object: pencil }, { object: crayon }]
            answer: scissors
          - id: l1-c2
            type: true_false
            say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Ruler." }
            show: { object: ruler }
            answer: true
          - id: l1-c3
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Rubber." }
            options: [{ object: ruler }, { object: rubber }, { object: book }]
            answer: rubber

  - n: 2
    title: { de: "Can I have a pencil, please?", en: "Can I have a pencil, please?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Ruler." }
            options: [{ object: ruler }, { object: book }, { object: scissors }]
            answer: ruler
            difficulty: easy
          - id: l2-w2
            type: true_false
            say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Pencil." }
            show: { object: crayon }
            answer: false
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Noch mehr Schulsachen. Hör zu und sprich nach.", en: "School bag." }
            show: { object: schoolbag }
          - say: { en: "Pencil case." }
            show: { object: pencil-case }
          - say: { en: "Chair." }
            show: { object: chair }
          - say: { de: "So fragst du höflich nach etwas.", en: "Can I have a pencil, please?" }
            show: { object: pencil }
          - say: { de: "Und das sagst du, wenn du es jemandem gibst.", en: "Here you are." }
            show: { object: pencil }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "School bag." }
                options: [{ object: schoolbag }, { object: pencil-case }, { object: chair }]
                answer: schoolbag
                feedback:
                  pencil-case: "Das ist das Mäppchen, „pencil case“. Der Schulranzen heißt „school bag“."
                hints:
                  - "Hör noch einmal: school bag."
                  - "Den „school bag“ trägst du auf dem Rücken."
                  - "Tippe auf den Schulranzen."
                difficulty: easy
              - id: l2-f2
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Chair." }
                show: { object: chair }
                expected_text: chair
                hints:
                  - "Hör noch einmal zu: chair."
                  - "Es fängt mit „tsch“ an, wie bei „tschüss“."
                  - "Sag mit mir: chair."
              - id: l2-f3
                type: audio_choice
                say: { de: "Hör zu. Was möchte das Kind haben? Tippe auf das Bild." }
                audio: { en: "Can I have a ruler, please?" }
                options: [{ object: ruler }, { object: rubber }, { object: book }]
                answer: ruler
                hints:
                  - "Hör noch einmal. Welches Ding nennt das Kind?"
                  - "„Ruler“ ist das Lineal."
                  - "Tippe auf das Lineal."
              - id: l2-f4
                type: speak
                say: { de: "Du möchtest einen Bleistift. Frag auf Englisch.", en: "Can I have a pencil, please?" }
                show: { object: pencil }
                expected_text: "Can I have a pencil, please?"
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „Can I have a“, dann „pencil“, am Ende „please“."
                  - "Sag mit mir: Can I have a pencil, please?"
              - id: l2-f5
                type: speak
                say: { de: "Deine Freundin fragt nach dem Bleistift. Du gibst ihn ihr. Was sagst du auf Englisch?", en: "Here you are." }
                show: { object: pencil }
                expected_text: "Here you are."
                hints:
                  - "Hör noch einmal zu: Here you are."
                  - "Drei kurze Wörter: here, you, are."
                  - "Sag mit mir: Here you are."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Pencil case." }
                options: [{ object: chair }, { object: schoolbag }, { object: pencil-case }]
                answer: pencil-case
                hints: ["„Pencil case“ hat zwei Teile. Den ersten, „pencil“, kennst du schon."]
              - id: l2-s2
                type: speak
                say: { de: "Sag es auf Englisch.", en: "School bag." }
                show: { object: schoolbag }
                expected_text: school bag
                hints: ["Zwei Wörter: school, wie Schule, und bag."]
              - id: l2-s3
                type: audio_choice
                say: { de: "Hör zu. Was möchte das Kind haben? Tippe auf das Bild." }
                audio: { en: "Can I have the scissors, please?" }
                options: [{ object: pencil }, { object: scissors }, { object: pencil-case }]
                answer: scissors
                hints: ["Welches Ding hörst du kurz vor „please“?"]
              - id: l2-s4
                type: true_false
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Chair." }
                show: { object: schoolbag }
                answer: false
                hints: ["Hör noch einmal: chair. Wie heißt das Ding auf dem Bild auf Englisch?"]
              - id: l2-s5
                type: speak
                say: { de: "Du möchtest einen Radiergummi. Frag auf Englisch.", en: "Can I have a rubber, please?" }
                show: { object: rubber }
                expected_text: "Can I have a rubber, please?"
                hints: ["Fang mit „Can I have a“ an und hör mit „please“ auf."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Chair." }
                options: [{ object: pencil-case }, { object: chair }, { object: schoolbag }]
                answer: chair
              - id: l2-n2
                type: speak
                say: { de: "Was ist das? Sag es auf Englisch." }
                show: { object: pencil-case }
                expected_text: pencil case
              - id: l2-n3
                type: audio_choice
                say: { de: "Hör zu. Was möchte das Kind haben? Tippe auf das Bild." }
                audio: { en: "Can I have a book, please?" }
                options: [{ object: book }, { object: ruler }, { object: chair }]
                answer: book
              - id: l2-n4
                type: speak
                say: { de: "Du möchtest ein Lineal. Frag auf Englisch." }
                show: { object: ruler }
                expected_text: "Can I have a ruler, please?"
              - id: l2-n5
                type: true_false
                say: { de: "Hör zu. Passt das Wort zum Bild?", en: "School bag." }
                show: { object: schoolbag }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Was möchte das Kind haben? Tippe auf das Bild." }
            audio: { en: "Can I have a pencil case, please?" }
            options: [{ object: pencil-case }, { object: schoolbag }, { object: pencil }]
            answer: pencil-case
          - id: l2-c2
            type: audio_choice
            say: { de: "Hör zu. Was möchte das Kind? Tippe auf das Bild." }
            audio: { en: "Can I have a pencil, please?" }
            options: [{ object: crayon }, { object: scissors }, { object: pencil }]
            answer: pencil
          - id: l2-c3
            type: true_false
            say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Scissors." }
            show: { object: scissors }
            answer: true
          - id: l2-c4
            type: true_false
            say: { de: "Hör zu. Passt das Wort zum Bild?", en: "Pencil case." }
            show: { object: schoolbag }
            answer: false
          - id: l2-c5
            type: audio_choice
            say: { de: "Hör zu. Was möchte das Kind? Tippe auf das Bild." }
            audio: { en: "Can I have a chair, please?" }
            options: [{ object: pencil-case }, { object: chair }, { object: ruler }]
            answer: chair
