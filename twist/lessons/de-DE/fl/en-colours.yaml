# Model lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-colours
skill: fl.themes.colours
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Farben auf Englisch
  en: Colours in English
summary: >
  Eight colours, heard and said before they are ever read. Stufe 0 is oral
  only: every task can be done without reading. Instructions are spoken in
  German, the colour words in English. Lesson 1 brings red, blue, yellow and
  green; lesson 2 adds orange, purple, pink and brown and ends with the
  skill check.
metadata:
  year: stufe-0
  topic: { de: Colours, en: Colours }
  ages: [6-7]
  lesson_minutes: 6
  builds_on: []
  also_practises: [fl.speaking.imitate, fl.listening.classroom-phrases]
  vocabulary:
    { en: [red, blue, yellow, green, orange, purple, pink, brown, colour] }
  no_reading: true
  forms: [audio, picture, drawn]
  drawn: [colour-swatch]
  facets: []
  misconceptions:
    - id: german-sound
      what: Says English colour words with German sounds (rot for red, "blau" for blue)
      addressed: every word is heard twice before the child says it; speak tasks replay the model
    - id: purple-pink
      what: Mixes up purple and pink
      addressed: lesson 2 contrasts them directly
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-12

lessons:
  - n: 1
    title: { de: "Red, blue, yellow, green", en: "Red, blue, yellow, green" }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör zu und sprich nach.", en: "Red." }
            show: { object: crayon, colour: red }
            character: pip-wave
          - say: { en: "Blue." }
            show: { object: crayon, colour: blue }
          - say: { en: "Yellow." }
            show: { object: crayon, colour: yellow }
          - say: { en: "Green." }
            show: { object: crayon, colour: green }

      - activity: practise
        support: full
        setting: plain
        tasks:
          - id: l1-p1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf die Farbe." }
            audio: { en: "Red." }
            options:
              [
                { drawn: colour-swatch, colour: red },
                { drawn: colour-swatch, colour: blue },
                { drawn: colour-swatch, colour: green },
              ]
            answer: red
            hints:
              [
                "Hör noch einmal: red.",
                "Red ist wie eine Erdbeere.",
                "Tippe auf Rot.",
              ]
            difficulty: easy
          - id: l1-p2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf die Farbe." }
            audio: { en: "Yellow." }
            options:
              [
                { drawn: colour-swatch, colour: yellow },
                { drawn: colour-swatch, colour: red },
                { drawn: colour-swatch, colour: blue },
              ]
            answer: yellow
            hints:
              [
                "Hör noch einmal: yellow.",
                "Yellow ist wie eine Banane.",
                "Tippe auf Gelb.",
              ]
            difficulty: easy
          - id: l1-p3
            type: speak
            say: { de: "Sag es auf Englisch.", en: "Blue." }
            show: { object: crayon, colour: blue }
            expected_text: "blue"
            hints:
              [
                "Hör noch einmal zu: blue.",
                "Der Anfang klingt wie bl.",
                "Sag: blue.",
              ]
            difficulty: easy
          - id: l1-p4
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Green." }
            options:
              [{ object: frog }, { object: banana }, { object: strawberry }]
            answer: frog
            hints:
              [
                "Hör noch einmal: green.",
                "Green ist die Farbe von Gras.",
                "Der Frosch ist grün.",
              ]
            difficulty: core
          - id: l1-p5
            type: speak
            say: { de: "Welche Farbe hat die Banane? Sag es auf Englisch." }
            show: { object: banana }
            expected_text: "yellow"
            hints:
              [
                "Die Banane ist gelb.",
                "Gelb heißt auf Englisch yel...",
                "Sag: yellow.",
              ]
            difficulty: core

      - activity: check
        size: quick
        tasks:
          - {
              id: l1-c1,
              type: audio_choice,
              say: { de: "Tippe auf die Farbe." },
              audio: { en: "Blue." },
              options:
                [
                  { drawn: colour-swatch, colour: green },
                  { drawn: colour-swatch, colour: blue },
                  { drawn: colour-swatch, colour: yellow },
                ],
              answer: blue,
              difficulty: core,
            }
          - {
              id: l1-c2,
              type: audio_choice,
              say: { de: "Tippe auf die Farbe." },
              audio: { en: "Green." },
              options:
                [
                  { drawn: colour-swatch, colour: red },
                  { drawn: colour-swatch, colour: green },
                ],
              answer: green,
              difficulty: core,
            }
          - {
              id: l1-c3,
              type: audio_choice,
              say: { de: "Tippe auf das Bild." },
              audio: { en: "Red." },
              options:
                [{ object: strawberry }, { object: frog }, { object: banana }],
              answer: strawberry,
              difficulty: core,
            }

  - n: 2
    title:
      { de: "Orange, purple, pink, brown", en: "Orange, purple, pink, brown" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - {
              id: l2-w1,
              type: audio_choice,
              say: { de: "Tippe auf die Farbe." },
              audio: { en: "Yellow." },
              options:
                [
                  { drawn: colour-swatch, colour: yellow },
                  { drawn: colour-swatch, colour: blue },
                ],
              answer: yellow,
              difficulty: easy,
            }
          - {
              id: l2-w2,
              type: speak,
              say: { de: "Sag es auf Englisch." },
              show: { object: crayon, colour: red },
              expected_text: "red",
              difficulty: easy,
            }

      - activity: learn
        mode: new-word
        screens:
          - say:
              { de: "Vier neue Farben. Hör zu und sprich nach.", en: "Orange." }
            show: { object: carrot }
            character: pip-wave
          - say: { en: "Purple." }
            show: { object: crayon, colour: purple }
          - say: { en: "Pink." }
            show: { object: crayon, colour: pink }
          - say: { en: "Brown." }
            show: { object: crayon, colour: brown }

      - activity: practise
        support: some
        setting: plain
        tasks:
          - id: l2-p1
            type: audio_choice
            say: { de: "Purple oder pink? Tippe auf die Farbe." }
            audio: { en: "Purple." }
            options:
              [
                { drawn: colour-swatch, colour: purple },
                { drawn: colour-swatch, colour: pink },
              ]
            answer: purple
            feedback:
              { pink: "Das ist pink. Purple ist dunkler, wie eine Pflaume." }
            hints: ["Purple ist das dunklere von beiden."]
            difficulty: core
          - id: l2-p2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Orange." }
            options:
              [{ object: carrot }, { object: leaf }, { object: strawberry }]
            answer: carrot
            hints: ["Hör noch einmal: orange."]
            difficulty: core
          - id: l2-p3
            type: speak
            say: { de: "Sag es auf Englisch." }
            show: { object: crayon, colour: pink }
            expected_text: "pink"
            hints: ["Hör noch einmal: pink."]
            difficulty: easy
          - id: l2-p4
            type: speak
            say: { de: "Sag es auf Englisch." }
            show: { object: crayon, colour: brown }
            expected_text: "brown"
            hints: ["Hör noch einmal: brown."]
            difficulty: core

      - activity: practise
        support: none
        setting: in-context
        tasks:
          - {
              id: l2-q1,
              type: audio_choice,
              say:
                {
                  de: "Pip sagt dir eine Farbe. Tippe auf den Ball in dieser Farbe.",
                },
              audio: { en: "Blue." },
              options:
                [
                  { object: ball, colour: blue },
                  { object: ball, colour: purple },
                  { object: ball, colour: green },
                ],
              answer: blue,
              difficulty: core,
            }
          - {
              id: l2-q2,
              type: audio_choice,
              say: { de: "Tippe auf den Ballon in dieser Farbe." },
              audio: { en: "Pink." },
              options:
                [
                  { object: balloon, colour: pink },
                  { object: balloon, colour: orange },
                  { object: balloon, colour: purple },
                ],
              answer: pink,
              difficulty: core,
            }

      - activity: check
        size: skill
        tasks:
          - {
              id: l2-c1,
              type: audio_choice,
              say: { de: "Tippe auf die Farbe." },
              audio: { en: "Brown." },
              options:
                [
                  { drawn: colour-swatch, colour: brown },
                  { drawn: colour-swatch, colour: orange },
                  { drawn: colour-swatch, colour: red },
                ],
              answer: brown,
              difficulty: core,
            }
          - {
              id: l2-c2,
              type: audio_choice,
              say: { de: "Tippe auf die Farbe." },
              audio: { en: "Purple." },
              options:
                [
                  { drawn: colour-swatch, colour: pink },
                  { drawn: colour-swatch, colour: purple },
                  { drawn: colour-swatch, colour: blue },
                ],
              answer: purple,
              difficulty: core,
            }
          - {
              id: l2-c3,
              type: audio_choice,
              say: { de: "Tippe auf das Bild." },
              audio: { en: "Yellow." },
              options:
                [{ object: frog }, { object: banana }, { object: carrot }],
              answer: banana,
              difficulty: core,
            }
          - {
              id: l2-c4,
              type: audio_choice,
              say: { de: "Tippe auf das Auto in dieser Farbe." },
              audio: { en: "Green." },
              options:
                [
                  { object: car, colour: red },
                  { object: car, colour: green },
                  { object: car, colour: orange },
                ],
              answer: green,
              difficulty: core,
            }
          - {
              id: l2-c5,
              type: audio_choice,
              say: { de: "Tippe auf die Farbe." },
              audio: { en: "Orange." },
              options:
                [
                  { drawn: colour-swatch, colour: orange },
                  { drawn: colour-swatch, colour: yellow },
                  { drawn: colour-swatch, colour: brown },
                ],
              answer: orange,
              difficulty: core,
            }
