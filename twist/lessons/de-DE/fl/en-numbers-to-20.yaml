# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-numbers-to-20
skill: fl.themes.numbers-to-20
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Zahlen bis 20 auf Englisch
  en: Numbers to 20 in English
summary: >
  The numbers eleven to twenty, asking someone's age and saying a phone
  number. Lesson 1 brings eleven to fifteen and counts on from ten;
  lesson 2 adds sixteen to twenty, "How old are you? I'm …" and phone
  numbers said digit by digit (zero said as "oh"), and ends with the
  skill check. Children read numerals; the number words are spoken.
metadata:
  year: lernjahr-1
  topic: { de: Zahlen, en: Numbers }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.numbers-to-10]
  also_practises: [fl.grammar.chunks]
  vocabulary: { en: [eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty, "How old are you?", "I'm …", phone number, oh] }
  forms: [audio, text, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: eleven-twelve
      what: Says "oneteen" or "twoteen" because eleven and twelve do not follow the -teen pattern
      addressed: lesson 1 Learn sets eleven and twelve apart from the -teen numbers; both appear in every stage of lesson 1
    - id: teen-ty
      what: Mixes up thirteen and thirty, fourteen and forty, because the -teen and -ty endings sound alike
      addressed: lesson 1 Learn says the -teen is long; twenty sits against twelve in l2-f1 and l2-c3, with feedback in l2-f1, and its hint contrasts the short -ty with the long -teen; -teen numbers sit against their -ty numeral in l1-f2, l1-s2, l1-n1, l2-n1 and l2-c1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "eleven to fifteen", en: "eleven to fifteen" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Eight." }
            options: ["8", "3", "6"]
            answer: "8"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Ten." }
            options: ["2", "10", "7"]
            answer: "10"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "11 eleven · 12 twelve"
            say: { de: "Nach zehn kommen zwei besondere Zahlen. Hör zu und sprich nach.", en: "Eleven. Twelve." }
          - text: "13 thirteen · 14 fourteen · 15 fifteen"
            say: { de: "Ab dreizehn enden die Zahlen auf „teen“. Das „teen“ sprichst du lang.", en: "Thirteen. Fourteen. Fifteen." }
          - text: "10, 11, 12, 13, 14, 15"
            say: { de: "Jetzt zählen wir zusammen von zehn bis fünfzehn.", en: "Ten, eleven, twelve, thirteen, fourteen, fifteen." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Twelve." }
                options: ["12", "11", "20"]
                answer: "12"
                option_audio: false
                feedback:
                  "11": "Das ist „eleven“. „Twelve“ ist die Zwölf."
                hints:
                  - "Hör noch einmal: twelve."
                  - "„Twelve“ klingt ein bisschen wie „zwölf“."
                  - "Tippe auf die 12."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Fourteen." }
                options: ["4", "14", "40"]
                answer: "14"
                option_audio: false
                hints:
                  - "Hörst du am Ende „teen“?"
                  - "„Four“ ist vier, mit „teen“ wird es vierzehn."
                  - "Tippe auf die 14."
              - id: l1-f3
                type: speak
                say: { de: "Sag die Zahl auf Englisch.", en: "Eleven." }
                show: { drawn: letter-card, text: "11" }
                expected_text: eleven
                hints:
                  - "Hör noch einmal zu: eleven."
                  - "Drei Teile: e, le, ven. Fast wie „elf“."
                  - "Sag mit mir: eleven."
              - id: l1-f4
                type: ordering
                text: "Zähl von 10 bis 13."
                say: { de: "Hör zu und leg die Zahlen in die richtige Reihenfolge.", en: "Ten, eleven, twelve, thirteen." }
                options: ["12", "10", "13", "11"]
                slot_count: 4
                answer: ["10", "11", "12", "13"]
                option_audio: false
                hints:
                  - "Fang mit der Zehn an."
                  - "Danach kommen eleven und twelve."
                  - "10, 11, 12, 13."
              - id: l1-f5
                type: true_false
                say: { de: "Hör zu. Passt das zur Zahl auf der Karte?", en: "Thirteen." }
                show: { drawn: letter-card, text: "15" }
                answer: false
                hints:
                  - "Hör auf den Anfang: thir…"
                  - "„Thirteen“ ist dreizehn."
                  - "Nein. Auf der Karte steht fünfzehn, „fifteen“."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Eleven." }
                options: ["7", "12", "11"]
                answer: "11"
                option_audio: false
                hints: ["Es ist eine der zwei besonderen Zahlen nach der Zehn."]
              - id: l1-s2
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Fifteen." }
                options: ["15", "5", "50"]
                answer: "15"
                option_audio: false
                hints: ["Hörst du am Ende „teen“?"]
              - id: l1-s3
                type: speak
                say: { de: "Sag die Zahl auf Englisch.", en: "Thirteen." }
                show: { drawn: letter-card, text: "13" }
                expected_text: thirteen
                hints: ["Das „th“ sprichst du mit der Zunge zwischen den Zähnen."]
              - id: l1-s4
                type: ordering
                text: "Zähl von 11 bis 14."
                say: { de: "Hör zu und leg die Zahlen in die richtige Reihenfolge.", en: "Eleven, twelve, thirteen, fourteen." }
                options: ["14", "12", "11", "13"]
                slot_count: 4
                answer: ["11", "12", "13", "14"]
                option_audio: false
                hints: ["Welche Zahl kommt nach elf?"]
              - id: l1-s5
                type: true_false
                say: { de: "Hör zu. Passt das zur Zahl auf der Karte?", en: "Twelve." }
                show: { drawn: letter-card, text: "12" }
                answer: true
                hints: ["Denk an die zwei besonderen Zahlen nach der Zehn."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Thirteen." }
                options: ["3", "30", "13"]
                answer: "13"
                option_audio: false
              - id: l1-n2
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Twelve." }
                options: ["2", "12", "20"]
                answer: "12"
                option_audio: false
              - id: l1-n3
                type: speak
                say: { de: "Wie heißt die Zahl auf Englisch? Sag sie." }
                show: { drawn: letter-card, text: "14" }
                expected_text: fourteen
              - id: l1-n4
                type: ordering
                text: "Zähl rückwärts von 15 bis 12."
                say: { de: "Hör zu und leg die Zahlen in die richtige Reihenfolge.", en: "Fifteen, fourteen, thirteen, twelve." }
                options: ["13", "15", "12", "14"]
                slot_count: 4
                answer: ["15", "14", "13", "12"]
                option_audio: false
              - id: l1-n5
                type: true_false
                say: { de: "Hör zu. Passt das zur Zahl auf der Karte?", en: "Eleven." }
                show: { drawn: letter-card, text: "11" }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu und tippe auf die Zahl." }
            audio: { en: "Fourteen." }
            options: ["14", "4", "15"]
            answer: "14"
            option_audio: false
          - id: l1-c2
            type: audio_choice
            say: { de: "Hör zu und tippe auf die Zahl." }
            audio: { en: "Eleven." }
            options: ["12", "11", "17"]
            answer: "11"
            option_audio: false
          - id: l1-c3
            type: true_false
            say: { de: "Hör zu. Stimmt die Zahl auf der Karte?", en: "Fifteen." }
            show: { drawn: letter-card, text: "13" }
            answer: false

  - n: 2
    title: { de: "How old are you?", en: "How old are you?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Thirteen." }
            options: ["13", "12", "3"]
            answer: "13"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Twelve." }
            options: ["11", "15", "12"]
            answer: "12"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "16 sixteen · 17 seventeen · 18 eighteen · 19 nineteen · 20 twenty"
            say: { de: "Weiter bis zwanzig. Hör zu und sprich nach.", en: "Sixteen. Seventeen. Eighteen. Nineteen. Twenty." }
          - text: "How old are you? I'm nine."
            say: { de: "So fragst du, wie alt jemand ist, und so antwortest du:", en: "How old are you? I'm nine." }
          - text: "0 1 7 2 = oh, one, seven, two"
            say: { de: "Eine Telefonnummer sagst du Ziffer für Ziffer. Die Null heißt dabei oft „oh“.", en: "My phone number is oh, one, seven, two." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Twenty." }
                options: ["20", "12", "2"]
                answer: "20"
                option_audio: false
                feedback:
                  "12": "Das wäre „twelve“. „Twenty“ ist zwanzig."
                hints:
                  - "Hör noch einmal: twenty."
                  - "„Twenty“ endet kurz auf „ty“. Die Zahlen mit „teen“ enden lang."
                  - "Tippe auf die 20."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { de: "Hör zu. Wie alt ist das Kind?" }
                audio: { en: "How old are you? I'm eleven." }
                options: ["11", "7", "17"]
                answer: "11"
                option_audio: false
                hints:
                  - "Hör auf die Zahl nach „I'm“."
                  - "„Eleven“ ist elf."
                  - "Tippe auf die 11."
              - id: l2-f3
                type: multiple_choice
                text: "Wie fragst du: Wie alt bist du?"
                say: "Du willst wissen, wie alt ein Kind ist. Was fragst du auf Englisch?"
                options: ["How old are you?", "How are you?", "What is your name?"]
                answer: "How old are you?"
                option_audio: false
                feedback:
                  "How are you?": "Damit fragst du, wie es jemandem geht. Für das Alter brauchst du „old“: How old are you?"
                hints:
                  - "Welche Frage hat etwas mit dem Alter zu tun?"
                  - "„Old“ heißt alt."
                  - "Tippe auf „How old are you?“"
              - id: l2-f4
                type: audio_choice
                say: { de: "Hör zu. Welche Telefonnummer ist das?" }
                audio: { en: "My phone number is oh, four, nine, six." }
                options: ["0496", "4096", "0469"]
                answer: "0496"
                option_audio: false
                hints:
                  - "„Oh“ ist die Null."
                  - "Danach: four, nine, six."
                  - "Tippe auf 0496."
              - id: l2-f5
                type: speak
                say: { de: "Wie alt bist du? Antworte auf Englisch. Zum Beispiel:", en: "I'm nine." }
                expected_text: "I'm nine."
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „I'm“, dann dein Alter."
                  - "Sag mit mir: I'm nine."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Seventeen." }
                options: ["7", "17", "16"]
                answer: "17"
                option_audio: false
                hints: ["Hör auf den Anfang und auf das Ende."]
              - id: l2-s2
                type: audio_choice
                say: { de: "Hör zu. Wie alt ist das Kind?" }
                audio: { en: "How old are you? I'm ten." }
                options: ["12", "10", "20"]
                answer: "10"
                option_audio: false
                hints: ["Hör auf die Zahl nach „I'm“."]
              - id: l2-s3
                type: ordering
                text: "Bau die Frage: Wie alt bist du?"
                say: "Bau die Frage: Wie alt bist du?"
                options: ["are", "How", "you?", "old"]
                slot_count: 4
                answer: ["How", "old", "are", "you?"]
                option_audio: false
                hints: ["Die Frage fängt mit „How“ an."]
              - id: l2-s4
                type: audio_choice
                say: { de: "Hör zu. Welche Telefonnummer ist das?" }
                audio: { en: "My phone number is three, oh, eight, five." }
                options: ["3805", "3085", "3850"]
                answer: "3085"
                option_audio: false
                hints: ["Wo hörst du das „oh“?"]
              - id: l2-s5
                type: speak
                say: { de: "Sag die Zahl auf Englisch.", en: "Eighteen." }
                show: { drawn: letter-card, text: "18" }
                expected_text: eighteen
                hints: ["Die Zahl hat „teen“ am Ende."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Welche Zahl ist das?" }
                audio: { en: "Nineteen." }
                options: ["9", "19", "90"]
                answer: "19"
                option_audio: false
              - id: l2-n2
                type: audio_choice
                say: { de: "Hör zu. Wie alt ist das Kind?" }
                audio: { en: "How old are you? I'm eight." }
                options: ["18", "8", "80"]
                answer: "8"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Ich bin zehn."
                say: "Wie sagst du auf Englisch: Ich bin zehn?"
                options: ["I'm ten.", "I have ten.", "I'm ten old."]
                answer: "I'm ten."
                option_audio: false
              - id: l2-n4
                type: audio_choice
                say: { de: "Hör zu. Welche Telefonnummer ist das?" }
                audio: { en: "My phone number is seven, two, oh, oh." }
                options: ["7200", "7020", "2700"]
                answer: "7200"
                option_audio: false
              - id: l2-n5
                type: speak
                say: { de: "Wie heißt die Zahl auf Englisch? Sag sie." }
                show: { drawn: letter-card, text: "16" }
                expected_text: sixteen

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu und tippe auf die Zahl." }
            audio: { en: "Sixteen." }
            options: ["6", "16", "60"]
            answer: "16"
            option_audio: false
          - id: l2-c2
            type: audio_choice
            say: { de: "Hör zu und tippe auf die Zahl." }
            audio: { en: "Eighteen." }
            options: ["8", "80", "18"]
            answer: "18"
            option_audio: false
          - id: l2-c3
            type: audio_choice
            say: { de: "Hör zu. Wie alt ist das Kind?" }
            audio: { en: "I'm twelve." }
            options: ["12", "11", "20"]
            answer: "12"
            option_audio: false
          - id: l2-c4
            type: audio_choice
            say: { de: "Hör zu. Welche Nummer sagt das Kind?" }
            audio: { en: "My phone number is five, oh, one, nine." }
            options: ["5019", "5109", "5910"]
            answer: "5019"
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "„How old are you?“ Welche Antwort passt?"
            say: { de: "Hör zu. Welche Antwort passt zu dieser Frage?", en: "How old are you?" }
            options: ["I'm fine, thank you.", "I'm nine.", "My name is Tom."]
            answer: "I'm nine."
            option_audio: false
