# Lesson set: Englisch, Stufe 0 (oral starter, Klasse 1 and 2). Hand-authored draft.
id: de-DE.fl.en-numbers-to-10
skill: fl.themes.numbers-to-10
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Zahlen bis 10 auf Englisch
  en: Numbers to 10 in English
summary: >
  The numbers one to ten in English, heard and said before they are read.
  Stufe 0 is oral only: instructions are spoken in German, the numbers in
  English. Lesson 1 brings one to five with dice dots; lesson 2
  adds six to ten, counts things, and ends with the skill check.
metadata:
  year: stufe-0
  topic: { de: Zahlen, en: Numbers }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: [fl.speaking.imitate]
  vocabulary: { en: [one, two, three, four, five, six, seven, eight, nine, ten, "How many?"] }
  no_reading: true
  forms: [audio, picture, drawn]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: german-sound
      what: Says English numbers with German sounds ("tsvei", "drei" for three)
      addressed: every number is heard before the child says it; speak tasks replay the model and their hints break the word up
    - id: three-free
      what: Says three with a German s or f instead of th ("sri", "free"), because German has no th
      addressed: three is heard in every stage of lesson 1; l1-f3 has the child say it, and its hints show the th with the tongue between the teeth
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "One, two, three, four, five", en: "One, two, three, four, five" }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör zu und sprich nach.", en: "One." }
            show: { drawn: dots, count: 1, layout: dice }
          - say: { en: "Two." }
            show: { drawn: dots, count: 2, layout: dice }
          - say: { en: "Three." }
            show: { drawn: dots, count: 3, layout: dice }
          - say: { en: "Four." }
            show: { drawn: dots, count: 4, layout: dice }
          - say: { en: "Five." }
            show: { drawn: dots, count: 5, layout: dice }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Three." }
                options:
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                answer: "3"
                hints:
                  - "Hör noch einmal: three."
                  - "„Three“ ist drei."
                  - "Tippe auf die drei Punkte."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Five." }
                options:
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                answer: "5"
                hints:
                  - "Hör noch einmal: five."
                  - "„Five“ ist fünf."
                  - "Tippe auf die fünf Punkte."
              - id: l1-f3
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Three." }
                show: { drawn: dots, count: 3, layout: dice }
                expected_text: three
                hints:
                  - "Hör noch einmal: three."
                  - "Am Anfang legst du die Zunge kurz zwischen die Zähne: th … three."
                  - "Sag mit mir: three."
              - id: l1-f4
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "One." }
                options:
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                answer: "1"
                hints:
                  - "Hör noch einmal: one."
                  - "„One“ ist eins."
                  - "Tippe auf den einen Punkt."
              - id: l1-f5
                type: true_false
                say: { de: "Hör zu. Passt die Zahl zu den Punkten?", en: "Four." }
                show: { drawn: dots, count: 4, layout: dice }
                answer: true
                hints:
                  - "Hör noch einmal: four."
                  - "„Four“ ist vier. Zähl die Punkte."
                  - "Vier Punkte, „four“. Tippe auf Ja."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Two." }
                options:
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                answer: "2"
                hints: ["Hör noch einmal: two. Wie heißt das auf Deutsch?"]
              - id: l1-s2
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Five." }
                show: { drawn: dots, count: 5, layout: dice }
                expected_text: five
                hints: ["Hör noch einmal und sprich nach."]
              - id: l1-s3
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Four." }
                options:
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                answer: "4"
                hints: ["Hör noch einmal: four. Welche deutsche Zahl klingt fast genauso?"]
              - id: l1-s4
                type: true_false
                say: { de: "Hör zu. Passt die Zahl zu den Punkten?", en: "Three." }
                show: { drawn: dots, count: 2, layout: dice }
                answer: false
                hints: ["Zähl die Punkte."]
              - id: l1-s5
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Three." }
                options:
                  - { drawn: dots, count: 3, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 5, layout: dice }
                answer: "3"
                hints: ["Hör noch einmal: three. Wie heißt das auf Deutsch?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "One." }
                options:
                  - { drawn: dots, count: 1, layout: dice }
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                answer: "1"
              - id: l1-n2
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Two." }
                show: { drawn: dots, count: 2, layout: dice }
                expected_text: two
              - id: l1-n3
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Two." }
                options:
                  - { drawn: dots, count: 5, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                answer: "2"
              - id: l1-n4
                type: true_false
                say: { de: "Hör zu. Passt die Zahl zu den Punkten?", en: "Five." }
                show: { drawn: dots, count: 5, layout: dice }
                answer: true
              - id: l1-n5
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Four." }
                options:
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                answer: "4"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf die passenden Punkte." }
            audio: { en: "Five." }
            options:
              - { drawn: dots, count: 3, layout: dice }
              - { drawn: dots, count: 5, layout: dice }
              - { drawn: dots, count: 4, layout: dice }
            answer: "5"
          - id: l1-c2
            type: true_false
            say: { de: "Hör zu. Passt die Zahl zu den Punkten?", en: "One." }
            show: { drawn: dots, count: 2, layout: dice }
            answer: false
          - id: l1-c3
            type: audio_choice
            say: { de: "Hör zu. Tippe auf die passenden Punkte." }
            audio: { en: "Three." }
            options:
              - { drawn: dots, count: 2, layout: dice }
              - { drawn: dots, count: 4, layout: dice }
              - { drawn: dots, count: 3, layout: dice }
            answer: "3"

  - n: 2
    title: { de: "Six, seven, eight, nine, ten", en: "Six, seven, eight, nine, ten" }
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Hör zu und sprich nach.", en: "Six." }
            show: { drawn: dots, count: 6, layout: dice }
          - say: { en: "Seven." }
            show: { drawn: dots, count: 7, layout: dice }
          - say: { en: "Eight." }
            show: { drawn: dots, count: 8, layout: dice }
          - say: { en: "Nine." }
            show: { drawn: dots, count: 9, layout: dice }
          - say: { en: "Ten." }
            show: { drawn: dots, count: 10, layout: dice }
          - say: { de: "Mit „How many?“ fragst du, wie viele es sind.", en: "How many apples? Six apples." }
            show: { object: apple, count: 6 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Seven." }
                options:
                  - { drawn: dots, count: 7, layout: dice }
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 9, layout: dice }
                answer: "7"
                hints:
                  - "Hör noch einmal: seven."
                  - "„Seven“ ist sieben."
                  - "Tippe auf die sieben Punkte."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Bild." }
                audio: { en: "How many balls? Eight balls." }
                options:
                  - { object: ball, count: 8 }
                  - { object: ball, count: 6 }
                  - { object: ball, count: 10 }
                answer: "8"
                hints:
                  - "Hör noch einmal: eight."
                  - "„Eight“ ist acht."
                  - "Tippe auf die acht Bälle."
              - id: l2-f3
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Ten." }
                show: { drawn: dots, count: 10, layout: dice }
                expected_text: ten
                hints:
                  - "Hör noch einmal: ten."
                  - "„Ten“ klingt fast wie das deutsche zehn, nur mit t."
                  - "Sag mit mir: ten."
              - id: l2-f4
                type: true_false
                say: { de: "Hör zu. Passt die Zahl zu den Punkten?", en: "Nine." }
                show: { drawn: dots, count: 9, layout: dice }
                answer: true
                hints:
                  - "Hör noch einmal: nine."
                  - "„Nine“ ist neun. Zähl die Punkte."
                  - "Neun Punkte, „nine“. Tippe auf Ja."
              - id: l2-f5
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Six." }
                options:
                  - { drawn: dots, count: 8, layout: dice }
                  - { drawn: dots, count: 6, layout: dice }
                  - { drawn: dots, count: 7, layout: dice }
                answer: "6"
                hints:
                  - "Hör noch einmal: six."
                  - "„Six“ ist sechs."
                  - "Tippe auf die sechs Punkte."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Nine." }
                options:
                  - { drawn: dots, count: 9, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                  - { drawn: dots, count: 8, layout: dice }
                answer: "9"
                hints: ["Hör noch einmal genau hin."]
              - id: l2-s2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Bild." }
                audio: { en: "How many fish? Six fish." }
                options:
                  - { object: fish, count: 7 }
                  - { object: fish, count: 6 }
                  - { object: fish, count: 9 }
                answer: "6"
                hints: ["Zähl die Fische."]
              - id: l2-s3
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Seven." }
                show: { drawn: dots, count: 7, layout: dice }
                expected_text: seven
                hints: ["Hör noch einmal und sprich nach."]
              - id: l2-s4
                type: true_false
                say: { de: "Hör zu. Passt die Zahl zu den Punkten?", en: "Eight." }
                show: { drawn: dots, count: 10, layout: dice }
                answer: false
                hints: ["Zähl die Punkte."]
              - id: l2-s5
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Ten." }
                options:
                  - { drawn: dots, count: 10, layout: dice }
                  - { drawn: dots, count: 9, layout: dice }
                  - { drawn: dots, count: 6, layout: dice }
                answer: "10"
                hints: ["Hör noch einmal: ten. Wie heißt das auf Deutsch?"]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Eight." }
                options:
                  - { drawn: dots, count: 8, layout: dice }
                  - { drawn: dots, count: 7, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                answer: "8"
              - id: l2-n2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Bild." }
                audio: { en: "How many apples? Nine apples." }
                options:
                  - { object: apple, count: 9 }
                  - { object: apple, count: 7 }
                  - { object: apple, count: 5 }
                answer: "9"
              - id: l2-n3
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Eight." }
                show: { drawn: dots, count: 8, layout: dice }
                expected_text: eight
              - id: l2-n4
                type: true_false
                say: { de: "Hör zu. Passt die Zahl zu den Punkten?", en: "Six." }
                show: { drawn: dots, count: 6, layout: dice }
                answer: true
              - id: l2-n5
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passenden Punkte." }
                audio: { en: "Two." }
                options:
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 10, layout: dice }
                  - { drawn: dots, count: 7, layout: dice }
                answer: "2"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das passende Bild." }
            audio: { en: "How many balls? Three balls." }
            options:
              - { object: ball, count: 5 }
              - { object: ball, count: 3 }
              - { object: ball, count: 2 }
            answer: "3"
          - id: l2-c2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das passende Bild." }
            audio: { en: "How many balloons? Seven balloons." }
            options:
              - { object: balloon, count: 7 }
              - { object: balloon, count: 10 }
              - { object: balloon, count: 6 }
            answer: "7"
          - id: l2-c3
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das passende Bild." }
            audio: { en: "How many fish? Four fish." }
            options:
              - { object: fish, count: 4 }
              - { object: fish, count: 5 }
              - { object: fish, count: 3 }
            answer: "4"
          - id: l2-c4
            type: true_false
            say: { de: "Hör zu. Passt die Zahl zu den Punkten?", en: "Ten." }
            show: { drawn: dots, count: 8, layout: dice }
            answer: false
          - id: l2-c5
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das passende Bild." }
            audio: { en: "How many apples? Ten apples." }
            options:
              - { object: apple, count: 10 }
              - { object: apple, count: 8 }
              - { object: apple, count: 7 }
            answer: "10"
