# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-complete-sentences
skill: fl.writing.complete-sentences
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Sätze nach Muster schreiben
  en: Writing sentences from a model
summary: >
  Completing English sentences from a model and building new ones to the
  same pattern: I like ..., I have got a ..., I can ..., I am ... . Lesson
  1 fills the gap in a model sentence from a picture and learns which
  pattern says what; lesson 2 changes one part of a model to make a new
  sentence of the child's own, with a capital I, a full stop and a or an,
  and ends with the skill check. The child writes by choosing word cards
  and putting them in order; free writing is not marked.
metadata:
  year: lernjahr-2
  topic: { de: Schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.writing.words-from-memory, fl.grammar.chunks]
  also_practises: [fl.themes.hobbies, fl.themes.food, fl.themes.outside-animals, fl.grammar.plurals-articles]
  vocabulary: { en: ["I like ...", "I have got a ...", "I can ...", "I am ...", "I don't like ...", and, a, an] }
  forms: [text, picture, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: am-for-have
      what: Uses I am where I have got belongs (I am a dog, from the German Ich habe einen Hund said too fast)
      addressed: lesson 1 Learn sets I am (what you are), I have got (what you have), I like and I can side by side; l1-f2 and l2-f3 give feedback on am
    - id: missing-article
      what: Leaves out a or an after have got (I have got dog)
      addressed: lesson 2 Learn shows a dog, an apple; gap tasks in lesson 2 ask for a or an
    - id: small-i
      what: Writes i like with a small i
      addressed: lesson 2 Learn says I is always a capital letter in English; l2-f5 and l2-s5 ask which sentence is written correctly
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das Muster ergänzen, en: Completing the model }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            option_audio: false
            text: "Schreib das Wort fertig."
            say: { de: "Was fehlt bei „cat“? Tippe den Buchstaben." }
            show: { object: cat }
            frame: "c_t"
            options: ["a", "e", "o"]
            answer: ["a"]
            difficulty: easy
          - id: l1-w2
            type: ordering
            option_audio: false
            text: "Bring die Wörter in die richtige Reihenfolge."
            say: { de: "Bau den Satz: Ich mag Äpfel." }
            options: ["apples", "like", "I"]
            slot_count: 3
            answer: ["I", "like", "apples"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "I like pizza.\nI like ice cream."
            say: { de: "Das ist ein Muster. Der Anfang bleibt gleich: „I like“. Nur das Wort am Ende ändert sich. So kannst du ganz viele Sätze schreiben.", en: "I like pizza. I like ice cream." }
            show: { objects: [pizza, ice-cream] }
          - text: "I am nine.\nI have got a dog.\nI like football.\nI can swim."
            say: { de: "Vier Muster, die du schon kennst. „I am“: was du bist, zum Beispiel neun Jahre alt. „I have got“: was du hast. „I like“: was du magst. „I can“: was du kannst.", en: "I am nine. I have got a dog. I like football. I can swim." }
          - text: "I have got a ___ .\nI have got a cat."
            say: { de: "Schau auf das Bild und setz das passende Wort in die Lücke. Am Ende kommt ein Punkt.", en: "I have got a cat." }
            show: { object: cat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Das Kind mag Bananen. Ergänze den Satz." }
                show: { object: banana }
                frame: "I like _ ."
                options: ["bananas", "apples", "cats"]
                answer: ["bananas"]
                hints:
                  - "Schau auf das Bild. Was ist das?"
                  - "Banane heißt auf Englisch „banana“."
                  - "I like bananas."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Das Kind hat einen Hasen. Ergänze den Satz." }
                show: { object: rabbit }
                frame: "I _ got a rabbit."
                options: ["have", "am", "like"]
                answer: ["have"]
                feedback:
                  "am": "„I am“ heißt ich bin. Das Kind ist kein Hase, es hat einen. Also: „I have got“."
                hints:
                  - "Es geht darum, was das Kind hat."
                  - "Ich habe heißt „I have got“."
                  - "I have got a rabbit."
              - id: l1-f3
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Das Kind kann tanzen. Ergänze den Satz." }
                show: { object: dance }
                frame: "I can _ ."
                options: ["dance", "sing", "swim"]
                answer: ["dance"]
                hints:
                  - "Schau auf das Bild. Was macht das Kind?"
                  - "Tanzen heißt „dance“."
                  - "I can dance."
              - id: l1-f4
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Verbinde jeden Satzanfang mit dem passenden Ende." }
                pairs:
                  - { left: { text: "I am" }, right: { text: "ten." } }
                  - { left: { text: "I have got" }, right: { text: "a bike." } }
                  - { left: { text: "I can" }, right: { text: "swim." } }
                hints:
                  - "Fang mit dem Paar an, das du sicher weißt."
                  - "Nach „I am“ kommt, wie alt du bist."
                  - "I am ten. I have got a bike. I can swim."
              - id: l1-f5
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz."
                say: { de: "Lena ist neun Jahre alt. Ergänze den Satz." }
                frame: "I _ nine."
                options: ["am", "have", "can"]
                answer: ["am"]
                hints:
                  - "Lena sagt, wie alt sie ist."
                  - "Ich bin heißt „I am“."
                  - "I am nine."
              - id: l1-f6
                type: multiple_choice
                option_audio: false
                text: "I like pizza.\nI like cake.\nI like ..."
                say: { de: "Welcher Satz passt zum Muster?" }
                options: ["I like apples.", "I am apples.", "Like I apples."]
                answer: "I like apples."
                feedback:
                  "I am apples.": "Das hieße: Ich bin Äpfel. Im Muster steht „I like“."
                  "Like I apples.": "Die Wörter stehen in der falschen Reihenfolge. „I“ kommt zuerst."
                hints:
                  - "Der Anfang bleibt gleich."
                  - "Jeder Satz fängt mit „I like“ an."
                  - "I like apples."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Das Kind kann Fahrrad fahren. Ergänze den Satz." }
                show: { object: ride-bike }
                frame: "I can _ a bike."
                options: ["ride", "play", "like"]
                answer: ["ride"]
                hints: ["Auf dem Fahrrad heißt es „ride a bike“."]
              - id: l1-s2
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Das Kind hat eine Schwester. Ergänze den Satz." }
                show: { object: girl }
                frame: "I _ got a sister."
                options: ["have", "am", "can"]
                answer: ["have"]
                feedback:
                  "am": "„I am a sister“ hieße: Ich bin eine Schwester. Das Kind hat eine."
                hints: ["Ich habe heißt „I have got“."]
              - id: l1-s3
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Ich habe eine Katze." }
                options: ["a cat.", "I", "got", "have"]
                slot_count: 4
                answer: ["I", "have", "got", "a cat."]
                hints: ["„Have got“ steht zusammen, direkt nach „I“."]
              - id: l1-s4
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Das Kind mag Milch. Ergänze den Satz." }
                show: { object: milk }
                frame: "I _ milk."
                options: ["like", "can", "am"]
                answer: ["like"]
                hints: ["Ich mag heißt „I like“."]
              - id: l1-s5
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Verbinde jeden Satzanfang mit dem passenden Ende." }
                pairs:
                  - { left: { text: "I like" }, right: { text: "chocolate." } }
                  - { left: { text: "I can" }, right: { text: "play tennis." } }
                  - { left: { text: "I am" }, right: { text: "eight." } }
                hints: ["Nach „I am“ kommt das Alter."]
              - id: l1-s6
                type: multiple_choice
                option_audio: false
                text: "I can swim.\nI can sing.\nI can ..."
                say: { de: "Welcher Satz passt zum Muster?" }
                options: ["I can paint.", "I can a dog.", "I am paint."]
                answer: "I can paint."
                feedback:
                  "I can a dog.": "Nach „I can“ kommt etwas, das man tun kann, kein Tier."
                hints: ["Nach „I can“ kommt ein Verb, also etwas, das man tun kann."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Das Kind hat einen Ball. Ergänze den Satz." }
                show: { object: ball }
                frame: "I have got a _ ."
                options: ["ball", "bike", "book"]
                answer: ["ball"]
              - id: l1-n2
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Das Kind kann singen. Ergänze den Satz." }
                show: { object: sing }
                frame: "I _ sing."
                options: ["can", "am", "have"]
                answer: ["can"]
              - id: l1-n3
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Ich bin zehn." }
                options: ["ten.", "am", "I"]
                slot_count: 3
                answer: ["I", "am", "ten."]
              - id: l1-n4
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Das Kind mag Erdbeeren. Ergänze den Satz." }
                show: { object: strawberry }
                frame: "I like _ ."
                options: ["strawberries", "bananas", "carrots"]
                answer: ["strawberries"]
              - id: l1-n5
                type: multiple_choice
                option_audio: false
                text: "I have got a dog.\nI have got a bike.\nI have got ..."
                say: { de: "Welcher Satz passt zum Muster?" }
                options: ["I have got a book.", "I am got a book.", "I have a got book."]
                answer: "I have got a book."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            option_audio: false
            text: "Ergänze den Satz zum Bild."
            say: { de: "Das Kind mag Käse. Ergänze den Satz." }
            show: { object: cheese }
            frame: "I like _ ."
            options: ["cheese", "chips", "cake"]
            answer: ["cheese"]
          - id: l1-c2
            type: fill_in_blank
            option_audio: false
            text: "Ergänze den Satz."
            say: { de: "Tom ist elf Jahre alt. Ergänze den Satz." }
            frame: "I _ eleven."
            options: ["am", "have", "like"]
            answer: ["am"]
          - id: l1-c3
            type: ordering
            option_audio: false
            text: "Bring die Wörter in die richtige Reihenfolge."
            say: { de: "Bau den Satz: Ich kann malen." }
            options: ["paint.", "I", "can"]
            slot_count: 3
            answer: ["I", "can", "paint."]

  - n: 2
    title: { de: Eigene Sätze nach Muster, en: My own sentences from a model }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            option_audio: false
            text: "Ergänze den Satz zum Bild."
            say: { de: "Das Kind kann schwimmen. Ergänze den Satz." }
            show: { object: swim }
            frame: "I can _ ."
            options: ["swim", "read"]
            answer: ["swim"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            option_audio: false
            text: "Ergänze den Satz."
            say: { de: "Das Kind hat einen Hund. Ergänze den Satz." }
            show: { object: dog }
            frame: "I _ got a dog."
            options: ["have", "am"]
            answer: ["have"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Muster: I have got a cat.\nMein Satz: I have got a dog."
            say: { de: "Jetzt schreibst du eigene Sätze. Nimm das Muster und tausch nur ein Teil aus. Aus „a cat“ wird „a dog“, schon ist es dein Satz.", en: "I have got a cat. I have got a dog." }
            show: { objects: [cat, dog] }
          - text: "a dog, a banana\nan apple, an egg"
            say: { de: "Vor einem Ding sagst du „a“. Fängt das Wort mit a, e, i, o oder u an, wird daraus „an“: „an apple“, „an egg“.", en: "A dog. An apple. An egg." }
            show: { objects: [apple, egg] }
          - text: "I like apples and I like milk.\nI like cats but I don't like dogs."
            say: { de: "„I“ schreibst du im Englischen immer groß, auch mitten im Satz. Am Ende steht ein Punkt. Mit „and“ und „but“ machst du aus zwei Sätzen einen.", en: "I like apples and I like milk. I like cats, but I don't like dogs." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Ben hat einen Apfel. Ergänze den Satz." }
                show: { object: apple }
                frame: "I have got _ apple."
                options: ["an", "a", "the"]
                answer: ["an"]
                feedback:
                  "a": "„Apple“ fängt mit a an. Dann sagst du „an“."
                hints:
                  - "Mit welchem Buchstaben fängt „apple“ an?"
                  - "Vor a, e, i, o, u steht „an“."
                  - "I have got an apple."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                option_audio: false
                text: "Muster: I like cats.\nSchreib einen eigenen Satz zum Bild."
                say: { de: "Nimm das Muster. Das Kind mag Hunde. Tausch ein Wort aus." }
                show: { object: dog }
                frame: "I like _ ."
                options: ["dogs", "cats", "a dog"]
                answer: ["dogs"]
                feedback:
                  "cats": "Das steht im Muster. Schau auf das Bild und tausch das Wort aus."
                  "a dog": "Wenn du sagst, was du allgemein magst, nimmst du die Mehrzahl: „I like dogs“."
                hints:
                  - "„I like“ bleibt. Nur das Tier ändert sich."
                  - "Das Bild zeigt einen Hund, auf Englisch „dog“."
                  - "I like dogs."
              - id: l2-f3
                type: multiple_choice
                option_audio: false
                text: "Lisa hat einen Hamster. Welcher Satz ist richtig?"
                say: { de: "Lisa hat einen Hamster. Welcher Satz ist richtig?" }
                options: ["I have got a hamster.", "I am a hamster.", "I have got hamster."]
                answer: "I have got a hamster."
                feedback:
                  "I am a hamster.": "Das hieße: Ich bin ein Hamster. Lisa hat einen."
                  "I have got hamster.": "Vor „hamster“ fehlt „a“."
                hints:
                  - "Lisa sagt, was sie hat."
                  - "Ich habe heißt „I have got“. Vor dem Tier steht „a“."
                  - "I have got a hamster."
              - id: l2-f4
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Ich mag Pizza und ich mag Saft." }
                options: ["and", "I like juice.", "I like pizza"]
                slot_count: 3
                answer: ["I like pizza", "and", "I like juice."]
                hints:
                  - "Der Satz hat zwei Teile."
                  - "„And“ steht in der Mitte."
                  - "I like pizza and I like juice."
              - id: l2-f5
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz ist richtig geschrieben?"
                say: { de: "Welcher Satz ist richtig geschrieben?" }
                options: ["I can read.", "i can read.", "I can read"]
                answer: "I can read."
                feedback:
                  "i can read.": "„I“ schreibst du im Englischen immer groß."
                  "I can read": "Am Ende fehlt der Punkt."
                hints:
                  - "Schau auf das erste Wort und auf das Ende."
                  - "„I“ ist immer groß. Am Ende steht ein Punkt."
                  - "I can read."
              - id: l2-f6
                type: fill_in_blank
                option_audio: false
                text: "Muster: I can swim but I can't sing.\nSchreib einen eigenen Satz."
                say: { de: "Das Kind kann malen, aber nicht tanzen. Ergänze den Satz." }
                frame: "I can _ but I can't _ ."
                options: ["paint", "dance", "swim"]
                answer: ["paint", "dance"]
                hints:
                  - "Zuerst kommt, was das Kind kann."
                  - "Nach „can't“ kommt, was es nicht kann."
                  - "I can paint but I can't dance."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Mia hat ein Ei. Ergänze den Satz." }
                show: { object: egg }
                frame: "I have got _ egg."
                options: ["an", "a"]
                answer: ["an"]
                hints: ["„Egg“ fängt mit e an."]
              - id: l2-s2
                type: fill_in_blank
                option_audio: false
                text: "Muster: I have got a cat.\nSchreib einen eigenen Satz zum Bild."
                say: { de: "Nimm das Muster. Das Kind hat ein Fahrrad. Tausch ein Wort aus." }
                show: { object: bike }
                frame: "I have got a _ ."
                options: ["bike", "cat", "ball"]
                answer: ["bike"]
                hints: ["Tausch nur das Ding aus."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Ich mag keine Karotten." }
                options: ["like", "carrots.", "I", "don't"]
                slot_count: 4
                answer: ["I", "don't", "like", "carrots."]
                hints: ["„Don't“ steht vor „like“."]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Tim kann Gitarre spielen. Welcher Satz ist richtig?"
                say: { de: "Tim kann Gitarre spielen. Welcher Satz ist richtig?" }
                options: ["I can play the guitar.", "I am play the guitar.", "I have got play the guitar."]
                answer: "I can play the guitar."
                hints: ["Ich kann heißt „I can“."]
              - id: l2-s5
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz ist richtig geschrieben?"
                say: { de: "Welcher Satz ist richtig geschrieben?" }
                options: ["I like bananas and I like milk.", "I like bananas and i like milk.", "i like bananas and I like milk."]
                answer: "I like bananas and I like milk."
                feedback:
                  "I like bananas and i like milk.": "Auch mitten im Satz schreibst du „I“ groß."
                hints: ["Schau auf jedes „I“."]
              - id: l2-s6
                type: fill_in_blank
                option_audio: false
                text: "Muster: I like cats but I don't like dogs.\nSchreib einen eigenen Satz."
                say: { de: "Das Kind mag Äpfel, aber keine Bananen. Ergänze den Satz." }
                frame: "I like _ but I don't like _ ."
                options: ["apples", "bananas", "cats"]
                answer: ["apples", "bananas"]
                hints: ["Zuerst kommt, was das Kind mag."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz zum Bild."
                say: { de: "Das Kind hat eine Orange. Ergänze den Satz." }
                show: { object: orange }
                frame: "I have got _ orange."
                options: ["an", "a"]
                answer: ["an"]
              - id: l2-n2
                type: fill_in_blank
                option_audio: false
                text: "Muster: I can swim.\nSchreib einen eigenen Satz zum Bild."
                say: { de: "Nimm das Muster. Das Kind kann Tennis spielen. Tausch aus, was nötig ist." }
                show: { object: play-tennis }
                frame: "I can _ ."
                options: ["play tennis", "swim", "tennis"]
                answer: ["play tennis"]
              - id: l2-n3
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Ich habe einen Bruder und eine Schwester." }
                options: ["and a sister.", "got", "I", "a brother", "have"]
                slot_count: 5
                answer: ["I", "have", "got", "a brother", "and a sister."]
              - id: l2-n4
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz ist richtig?"
                say: { de: "Welcher Satz ist richtig?" }
                options: ["I am nine.", "I have nine.", "I nine."]
                answer: "I am nine."
              - id: l2-n5
                type: multiple_choice
                option_audio: false
                text: "Welcher Satz ist richtig geschrieben?"
                say: { de: "Welcher Satz ist richtig geschrieben?" }
                options: ["I have got a rabbit.", "i have got a rabbit.", "I have got a rabbit"]
                answer: "I have got a rabbit."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            option_audio: false
            text: "Ergänze den Satz zum Bild."
            say: { de: "Das Kind mag Pizza. Ergänze den Satz." }
            show: { object: pizza }
            frame: "I _ pizza."
            options: ["like", "am", "can"]
            answer: ["like"]
          - id: l2-c2
            type: fill_in_blank
            option_audio: false
            text: "Ergänze den Satz zum Bild."
            say: { de: "Das Kind hat ein Eis. Ergänze den Satz." }
            show: { object: ice-cream }
            frame: "I have got _ ice cream."
            options: ["an", "a"]
            answer: ["an"]
          - id: l2-c3
            type: multiple_choice
            option_audio: false
            text: "Emma hat eine Katze. Welcher Satz ist richtig?"
            say: { de: "Emma hat eine Katze. Welcher Satz ist richtig?" }
            options: ["I have got a cat.", "I am a cat.", "I have got cat."]
            answer: "I have got a cat."
          - id: l2-c4
            type: ordering
