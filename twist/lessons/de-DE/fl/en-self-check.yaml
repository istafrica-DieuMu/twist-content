# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-self-check
skill: fl.culture-strategies.self-check
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Was kann ich schon?
  en: What can I do already?
summary: >
  Judging honestly what you can already do in English and setting a next
  goal. Lesson 1 brings "I can …" and "I'm still learning …", and the rule
  that you can do something when it works without help, several times;
  short self-tests (a colour, a number, a day) stand for checking yourself.
  Lesson 2 chooses a next goal that is one step on (not too easy, not too
  hard), picks a way to practise from the word-learning tips, and checks
  again after a few days; it ends with the skill check. Instructions are in
  German; the I can sentences are read and spoken in English.
metadata:
  year: lernjahr-2
  topic: { de: Lernstrategien, en: Learning strategies }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.culture-strategies.learn-words]
  also_practises: [fl.culture-strategies.learn-words, fl.themes.colours, fl.themes.numbers-to-20]
  vocabulary: { en: ["I can …", "I'm still learning …", "My next goal: …", count, say, read, colours, numbers, days of the week, months] }
  forms: [text, audio, drawn]
  drawn: [colour-swatch]
  facets: []
  misconceptions:
    - id: once-is-enough
      what: Counts a skill as done after one success, or after doing it with help
      addressed: lesson 1 Learn sets the rule (without help, several times); l1-f5, l1-n3, the quick check and the skill check ask about help and one try, with feedback in l1-f4
    - id: cannot-is-failure
      what: Will not say "I'm still learning", or says "I can't learn English" instead
      addressed: lesson 1 Learn says it is no mistake to name what you still practise; l1-s3, l2-n4 and the skill check offer "I'm still learning" as the honest answer and "I can't …" as a wrong one
    - id: goal-size
      what: Picks a goal that is already done or far too big
      addressed: lesson 2 Learn shows a goal that is too easy and one that is too hard; every next-goal task (l2-f1, l2-s1, l2-n1, skill check) offers both, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "I can … oder I'm still learning …", en: "I can … or I'm still learning …" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Tipp hilft beim Wörterlernen?"
            say: { de: "Welcher Tipp hilft beim Wörterlernen?" }
            options: ["Ich mache mir Bildkarten.", "Ich schaue das Wort nur einmal an.", "Ich lerne alles an einem Tag."]
            answer: "Ich mache mir Bildkarten."
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Ordne die Wörter nach dem ABC."
            say: { de: "Ordne die Wörter nach dem ABC." }
            options: ["bed", "cat", "apple"]
            slot_count: 3
            answer: ["apple", "bed", "cat"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "I can count to 20."
            say: { de: "Mit I can sagst du auf Englisch, was du schon kannst. I can count to twenty heißt: Ich kann bis zwanzig zählen.", en: "I can count to twenty." }
          - text: "Kann ich es wirklich?"
            say: { de: "Aber kannst du es wirklich? Probier es aus, ohne Hilfe. Klappt es mehrmals hintereinander, dann kannst du es. Klappt es nur mit Hilfe, dann übst du noch." }
          - text: "I can say the colours.\nI'm still learning the numbers."
            say: { de: "Sag ehrlich, was du schon kannst und was du noch übst. Das ist kein Fehler. So weißt du, was du als Nächstes lernst.", en: "I can say the colours. I'm still learning the numbers." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Verbinde jeden englischen Satz mit dem deutschen." }
                pairs:
                  - { left: { text: "I can count to 20." }, right: { text: "Ich kann bis 20 zählen." } }
                  - { left: { text: "I can say the colours." }, right: { text: "Ich kann die Farben sagen." } }
                  - { left: { text: "I can sing a song." }, right: { text: "Ich kann ein Lied singen." } }
                hints:
                  - "Alle Sätze fangen mit I can an. Schau auf das Ende."
                  - "Count heißt zählen, colours sind Farben."
                  - "Sing a song heißt: ein Lied singen."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Prüf dich selbst. Kannst du die Farben? Hör zu und tippe auf die Farbe." }
                audio: { en: "Purple." }
                options:
                  - { drawn: colour-swatch, colour: purple }
                  - { drawn: colour-swatch, colour: pink }
                  - { drawn: colour-swatch, colour: blue }
                answer: purple
                hints:
                  - "Hör noch einmal genau hin."
                  - "Purple ist eine Mischung aus Rot und Blau."
                  - "Purple heißt lila."
              - id: l1-f3
                type: multiple_choice
                text: "Mia sagt zehn Farben richtig, ohne Hilfe. Was kann sie sagen?"
                say: { de: "Mia sagt zehn Farben richtig, ohne Hilfe. Was kann sie sagen?" }
                options: ["I can say the colours.", "I can count to 20.", "I'm still learning the colours."]
                answer: "I can say the colours."
                option_audio: false
                hints:
                  - "Um welches Thema geht es?"
                  - "Mia kennt die Farben, und sie braucht keine Hilfe."
                  - "Sie sagt: I can say the colours."
              - id: l1-f4
                type: multiple_choice
                text: "Woran merkst du, dass du etwas wirklich kannst?"
                say: { de: "Woran merkst du, dass du etwas wirklich kannst?" }
                options: ["Es klappt ohne Hilfe, und zwar mehrmals.", "Ich habe es einmal gehört.", "Jemand hat es mir vorgesagt."]
                answer: "Es klappt ohne Hilfe, und zwar mehrmals."
                feedback:
                  "Ich habe es einmal gehört.": "Einmal hören reicht meistens nicht. Probier es ohne Hilfe, mehrmals."
                hints:
                  - "Reicht es, wenn es einmal klappt oder wenn dir jemand hilft?"
                  - "Es kommt auf zwei Dinge an: ohne Hilfe und mehrmals."
                  - "Wenn es ohne Hilfe mehrmals klappt, kannst du es."
              - id: l1-f5
                type: true_false
                text: "Kann Tom schon sicher bis 20 zählen?"
                say: { de: "Tom zählt bis zwanzig. Bei dreizehn und vierzehn hilft ihm Mama. Kann Tom schon sicher bis zwanzig zählen?" }
                answer: false
                hints:
                  - "Braucht Tom Hilfe?"
                  - "Mama hilft ihm bei zwei Zahlen."
                  - "Nein, Tom übt noch."
              - id: l1-f6
                type: fill_in_blank
                text: "Welches Wort fehlt?"
                say: { de: "Du kannst bis zehn zählen. Welches Wort fehlt?" }
                frame: "I _ count to ten."
                options: ["can", "am", "have"]
                answer: ["can"]
                hints:
                  - "Du willst sagen: Ich kann."
                  - "Kann heißt auf Englisch can."
                  - "I can count to ten."

          - support: some
            tasks:
              - id: l1-s1
                type: speak
                text: "Sag, was du schon kannst."
                say: { de: "Sag auf Englisch: Ich kann bis zwanzig zählen.", en: "I can count to twenty." }
                expected_text: "I can count to twenty."
                hints: ["Hör noch einmal zu und sprich mit: I can, count, to twenty."]
              - id: l1-s2
                type: audio_choice
                say: { de: "Prüf dich selbst. Kannst du die Zahlen? Hör zu. Welche Zahl ist das?" }
                audio: { en: "Seventeen." }
                options: ["17", "70", "7"]
                answer: "17"
                option_audio: false
                hints: ["Seventeen endet auf teen. Das sind die Zahlen von 13 bis 19."]
              - id: l1-s3
                type: multiple_choice
                text: "Ben kennt die Tiere nur mit dem Bildwörterbuch. Was sagt er ehrlich?"
                say: { de: "Ben kann die Tiere auf Englisch nur mit dem Bildwörterbuch nennen. Was sagt er ehrlich?" }
                options: ["I'm still learning the animals.", "I can say all the animals.", "I can't learn English."]
                answer: "I'm still learning the animals."
                option_audio: false
                hints: ["Ben braucht noch Hilfe. Er übt also noch."]
              - id: l1-s4
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Verbinde jeden englischen Satz mit dem deutschen." }
                pairs:
                  - { left: { text: "I can say my name." }, right: { text: "Ich kann meinen Namen sagen." } }
                  - { left: { text: "I can say the days of the week." }, right: { text: "Ich kann die Wochentage sagen." } }
                  - { left: { text: "I can read short words." }, right: { text: "Ich kann kurze Wörter lesen." } }
                hints: ["Name, days und read helfen dir."]
              - id: l1-s5
                type: true_false
                text: "Kann Lena die Wochentage?"
                say: { de: "Lena hat die Wochentage dreimal ohne Hilfe richtig gesagt. Kann sie die Wochentage?" }
                answer: true
                hints: ["Dreimal und ohne Hilfe. Das ist sicher."]
              - id: l1-s6
                type: fill_in_blank
                text: "Du kennst alle Farben. Welches Wort fehlt?"
                say: { de: "Du kennst alle Farben. Welches Wort fehlt?" }
                frame: "I can say the _."
                options: ["colours", "count", "read"]
                answer: ["colours"]
                hints: ["Farben heißt colours."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Prüf dich selbst. Kannst du die Wochentage? Hör zu. Welcher Tag ist das?" }
                audio: { en: "Monday." }
                options: ["Montag", "Mittwoch", "Sonntag"]
                answer: "Montag"
              - id: l1-n2
                type: multiple_choice
                text: "Emma sagt alle Wochentage ohne Hilfe. Was kann sie sagen?"
                say: { de: "Emma sagt alle Wochentage richtig, ohne Hilfe. Was kann sie sagen?" }
                options: ["I can say the days of the week.", "I'm still learning the days of the week.", "I can count to 100."]
                answer: "I can say the days of the week."
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Kann Jonas das Wort jetzt sicher?"
                say: { de: "Jonas hat ein neues Wort einmal gehört. Kann er es jetzt sicher?" }
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Du übst die Zahlen noch. Welches Wort fehlt?"
                say: { de: "Du übst die Zahlen noch. Welches Wort fehlt?" }
                frame: "I'm still _ the numbers."
                options: ["learning", "can", "say"]
                answer: ["learning"]
                difficulty: stretch
              - id: l1-n5
                type: speak
                text: "Sag, was du schon kannst."
                say: { de: "Sag auf Englisch: Ich kann die Farben sagen." }
                expected_text: "I can say the colours."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was heißt „I can read short words.“?"
            say: { de: "Was heißt: I can read short words?" }
            options: ["Ich kann kurze Wörter lesen.", "Ich kann kurze Wörter schreiben.", "Ich lese gern."]
            answer: "Ich kann kurze Wörter lesen."
          - id: l1-c2
            type: true_false
            text: "Kannst du etwas sicher, wenn es nur mit Hilfe klappt?"
            say: { de: "Kannst du etwas sicher, wenn es nur mit Hilfe klappt?" }
            answer: false
          - id: l1-c3
            type: fill_in_blank
            text: "Welches Wort fehlt?"
            say: { de: "Du kannst Hallo sagen. Welches Wort fehlt?" }
            frame: "I _ say hello."
            options: ["can", "is", "have"]
            answer: ["can"]

  - n: 2
    title: { de: Mein nächstes Ziel, en: My next goal }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Woran merkst du, dass du etwas kannst?"
            say: { de: "Woran merkst du, dass du etwas kannst?" }
            options: ["Es klappt ohne Hilfe, mehrmals.", "Ich habe es einmal gesehen.", "Jemand sagt es mir vor."]
            answer: "Es klappt ohne Hilfe, mehrmals."
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was heißt I can?"
            say: { de: "Was heißt I can?" }
            options: ["ich kann", "ich habe", "ich bin"]
            answer: "ich kann"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "My next goal: I can count to 100."
            say: { de: "Wenn du weißt, was du schon kannst, suchst du dir ein nächstes Ziel. Ein gutes Ziel ist der nächste Schritt. Paul kann bis zwanzig zählen. Sein nächstes Ziel: bis hundert zählen.", en: "My next goal: I can count to one hundred." }
          - text: "nicht zu leicht, nicht zu schwer"
            say: { de: "Ein gutes Ziel ist nicht zu leicht und nicht zu schwer. Bis zehn zählen kann Paul schon. Das ist zu leicht. Ein ganzes Buch auf Englisch lesen ist noch zu schwer." }
          - text: "Ziel, üben, prüfen"
            say: { de: "Dann überlegst du, wie du übst: mit Bildkarten, jeden Tag ein bisschen, laut sprechen. Nach ein paar Tagen prüfst du dich selbst, ohne Hilfe. Klappt es, suchst du dir ein neues Ziel. Klappt es noch nicht, übst du weiter." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Aylin kann die Farben sagen. Was ist ein gutes nächstes Ziel?"
                say: { de: "Aylin kann die Farben sagen. Was ist ein gutes nächstes Ziel?" }
                options: ["Kleidung mit Farben sagen, zum Beispiel „a red jumper“", "die Farben Rot und Blau lernen", "ein ganzes Buch auf Englisch schreiben"]
                answer: "Kleidung mit Farben sagen, zum Beispiel „a red jumper“"
                feedback:
                  "die Farben Rot und Blau lernen": "Die Farben kann Aylin schon. Das Ziel ist zu leicht."
                  "ein ganzes Buch auf Englisch schreiben": "Das ist noch viel zu schwer. Ein gutes Ziel ist der nächste Schritt."
                hints:
                  - "Was kann Aylin schon?"
                  - "Ein gutes Ziel ist nicht zu leicht und nicht zu schwer."
                  - "Der nächste Schritt: Farben und Kleidung zusammen."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Ben kann schon bis 10 zählen. Ist „bis 10 zählen“ ein gutes nächstes Ziel für ihn?"
                say: { de: "Ben kann schon bis zehn zählen. Ist es ein gutes nächstes Ziel für ihn, bis zehn zu zählen?" }
                answer: false
                hints:
                  - "Was kann Ben schon?"
                  - "Bis zehn zählen kann er schon."
                  - "Nein, das Ziel ist zu leicht."
              - id: l2-f3
                type: multiple_choice
                text: "Mia will die Tiere lernen. Wie übt sie gut?"
                say: { de: "Mia will die Tiere auf Englisch lernen. Wie übt sie gut?" }
                options: ["Sie macht Bildkarten und übt jeden Tag ein paar Tiere.", "Sie liest die Liste einmal durch.", "Sie wartet, bis sie es von selbst kann."]
                answer: "Sie macht Bildkarten und übt jeden Tag ein paar Tiere."
                hints:
                  - "Denk an die Tipps zum Wörterlernen."
                  - "Bildkarten helfen, und jeden Tag ein bisschen."
                  - "Mia macht Bildkarten und übt jeden Tag."
              - id: l2-f4
                type: fill_in_blank
                text: "Welches Wort fehlt?"
                say: { de: "Emma schreibt ihr nächstes Ziel auf. Welches Wort fehlt?" }
                frame: "My next _: I can say the months."
                options: ["goal", "game", "good"]
                answer: ["goal"]
                hints:
                  - "Gesucht ist das englische Wort für Ziel."
                  - "Ziel heißt auf Englisch goal."
                  - "My next goal."
              - id: l2-f5
                type: multiple_choice
                text: "Wann prüft Mia, ob sie ihr Ziel geschafft hat?"
                say: { de: "Wann prüft Mia, ob sie ihr Ziel geschafft hat?" }
                options: ["nach ein paar Tagen Üben, ohne Hilfe", "sofort, bevor sie übt", "nie"]
                answer: "nach ein paar Tagen Üben, ohne Hilfe"
                hints:
                  - "Zuerst kommt das Üben."
                  - "Dann prüft sie sich ohne Hilfe."
                  - "Nach ein paar Tagen Üben prüft sie sich."
              - id: l2-f6
                type: ordering
                text: "In welcher Reihenfolge gehst du vor?"
                say: { de: "In welcher Reihenfolge gehst du vor? Bring die Schritte in die richtige Reihenfolge." }
                options: ["Ich übe jeden Tag ein bisschen.", "Ich schaue, was ich schon kann.", "Ich prüfe mich ohne Hilfe.", "Ich suche mir ein nächstes Ziel."]
                slot_count: 4
                answer: ["Ich schaue, was ich schon kann.", "Ich suche mir ein nächstes Ziel.", "Ich übe jeden Tag ein bisschen.", "Ich prüfe mich ohne Hilfe."]
                hints:
                  - "Was musst du wissen, bevor du ein Ziel suchst?"
                  - "Zuerst schaust du, was du schon kannst. Dann kommt das Ziel."
                  - "Danach übst du, und am Ende prüfst du dich."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Jonas kann Hallo sagen und seinen Namen nennen. Was ist ein gutes nächstes Ziel?"
                say: { de: "Jonas kann Hallo sagen und seinen Namen nennen. Was ist ein gutes nächstes Ziel?" }
                options: ["andere nach ihrem Namen fragen", "Hallo sagen", "einen langen Vortrag auf Englisch halten"]
                answer: "andere nach ihrem Namen fragen"
                hints: ["Hallo sagen kann er schon. Was ist der nächste kleine Schritt?"]
              - id: l2-s2
                type: true_false
                text: "Lena kann die Wochentage. Ist es ein gutes nächstes Ziel, die Monate zu lernen?"
                say: { de: "Lena kann die Wochentage. Ist es ein gutes nächstes Ziel, die Monate zu lernen?" }
                answer: true
                hints: ["Ist das der nächste Schritt, nicht zu leicht und nicht zu schwer?"]
              - id: l2-s3
                type: matching
                text: "Welcher Tipp passt zu welchem Ziel?"
                say: { de: "Verbinde jedes Ziel mit einem Tipp, der dabei hilft." }
                pairs:
                  - { left: { text: "neue Wörter merken" }, right: { text: "Bildkarten machen" } }
                  - { left: { text: "gut aussprechen" }, right: { text: "laut nachsprechen" } }
                  - { left: { text: "Wörter wiederfinden" }, right: { text: "Wörterheft nach Themen ordnen" } }
                hints: ["Fang mit dem Aussprechen an. Was machst du dafür mit dem Mund?"]
              - id: l2-s4
                type: multiple_choice
                text: "Max hat sein Ziel noch nicht geschafft. Was macht er jetzt?"
                say: { de: "Max prüft sich und merkt: Das Ziel klappt noch nicht. Was macht er jetzt?" }
                options: ["Er übt noch ein paar Tage weiter.", "Er gibt auf.", "Er sucht sich ein viel schwereres Ziel."]
                answer: "Er übt noch ein paar Tage weiter."
                hints: ["Klappt es noch nicht, übst du weiter."]
              - id: l2-s5
                type: speak
                text: "Sag dein nächstes Ziel."
                say: { de: "Sag Pauls Ziel auf Englisch.", en: "My next goal: I can count to one hundred." }
                expected_text: "My next goal: I can count to one hundred."
                hints: ["Hör zu und sprich mit: My next goal. I can count to one hundred."]
              - id: l2-s6
                type: ordering
                text: "Bring die Schritte in die richtige Reihenfolge."
                say: { de: "Bring die Schritte in die richtige Reihenfolge." }
                options: ["prüfen", "Ziel suchen", "üben"]
                slot_count: 3
                answer: ["Ziel suchen", "üben", "prüfen"]
                hints: ["Ohne Ziel weißt du nicht, was du üben sollst."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Emma kann die Zahlen bis 20. Was ist ein gutes nächstes Ziel?"
                say: { de: "Emma kann die Zahlen bis zwanzig. Was ist ein gutes nächstes Ziel?" }
                options: ["die Zahlen bis 100", "die Zahlen bis 10", "alle Zahlen bis zu einer Million"]
                answer: "die Zahlen bis 100"
              - id: l2-n2
                type: true_false
                text: "Darf Tim sich ein neues Ziel suchen?"
                say: { de: "Tim hat sein Ziel nach drei Tagen Üben ohne Hilfe geschafft. Darf er sich ein neues Ziel suchen?" }
                answer: true
              - id: l2-n3
                type: fill_in_blank
                text: "Welches Wort fehlt?"
                say: { de: "Paul hat sein Ziel geschafft. Welches Wort fehlt?" }
                frame: "I can _ to one hundred."
                options: ["count", "colour", "goal"]
                answer: ["count"]
              - id: l2-n4
                type: multiple_choice
                text: "Ella braucht bei den Monaten noch Hilfe. Welcher Satz ist ehrlich?"
                say: { de: "Ella braucht bei den Monaten noch Hilfe. Welcher Satz ist ehrlich?" }
                options: ["I'm still learning the months.", "I can say all the months.", "I can't learn English."]
                answer: "I'm still learning the months."
                option_audio: false
              - id: l2-n5
                type: ordering
                text: "In welcher Reihenfolge fragst du dich das?"
                say: { de: "In welcher Reihenfolge fragst du dich das? Bring die Fragen in die richtige Reihenfolge." }
                options: ["Wie übe ich?", "Was kann ich schon?", "Klappt es jetzt ohne Hilfe?", "Was will ich als Nächstes lernen?"]
                slot_count: 4
                answer: ["Was kann ich schon?", "Was will ich als Nächstes lernen?", "Wie übe ich?", "Klappt es jetzt ohne Hilfe?"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Ali sagt die Farben, aber nur mit Hilfe. Was sagt er ehrlich?"
            say: { de: "Ali sagt die Farben, aber nur mit Hilfe. Was sagt er ehrlich?" }
            options: ["I'm still learning the colours.", "I can say the colours.", "I can't speak English."]
            answer: "I'm still learning the colours."
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "Was heißt „I can say the days of the week.“?"
            say: { de: "Was heißt: I can say the days of the week?" }
            options: ["Ich kann die Wochentage sagen.", "Ich kann die Monate sagen.", "Ich kann bis sieben zählen."]
            answer: "Ich kann die Wochentage sagen."
          - id: l2-c3
            type: multiple_choice
            text: "Sara kann bis 100 zählen. Welches Ziel passt als Nächstes?"
            say: { de: "Sara kann bis hundert zählen. Welches Ziel passt als Nächstes?" }
            options: ["Preise auf Englisch sagen, zum Beispiel „fifty pence“", "bis 10 zählen", "ein ganzes Buch auf Englisch schreiben"]
            answer: "Preise auf Englisch sagen, zum Beispiel „fifty pence“"
          - id: l2-c4
            type: true_false
            text: "Kannst du etwas sicher, wenn es einmal mit Hilfe geklappt hat?"
            say: { de: "Kannst du etwas sicher, wenn es einmal mit Hilfe geklappt hat?" }
            answer: false
