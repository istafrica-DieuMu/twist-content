# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-word-picture
skill: fl.reading.word-picture
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Wörter lesen und Bildern zuordnen
  en: Reading words and matching pictures
summary: >
  The first English reading: familiar words on a word card, matched to
  their pictures. Lesson 1 reads short words (cat, sun, bed) among words
  with the same first letter; lesson 2 reads words that look alike to the
  end (snake, snail), two-word names (pencil case) and long words (butterfly),
  and ends with the skill check. The voice never says the word to be read.
metadata:
  year: lernjahr-1
  topic: { de: Lesen, en: Reading }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.name-things]
  also_practises: [fl.themes.outside-animals, fl.themes.school]
  vocabulary: { en: [cat, car, cake, fish, frog, fox, sun, bus, pig, bed, tree, duck, hat, book, ball, bee, moon, snake, snail, pencil case, butterfly, elephant, clock, clown, cloud] }
  forms: [picture, text, drawn]
  drawn: [word-card]
  facets: []
  misconceptions:
    - id: first-letter
      what: Guesses from the first letter and picks any picture that starts the same (car for cat)
      addressed: most tasks set three words or pictures with the same first letter; l1-f2 gives feedback when cat is taken for car, and lesson 1 Learn says to look to the last letter
    - id: stops-early
      what: Stops reading before the end of a word and confuses snake and snail, pencil and pencil case
      addressed: lesson 2 Learn shows snake and snail and pencil case; l2-f1 gives feedback on snake, l2-f2 sets pencil against pencil case, and the skill check reads cloud among clown and clock
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Kurze Wörter lesen", en: "Reading short words" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Duck." }
            options: [{ object: duck }, { object: dog }, { object: fish }]
            answer: duck
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Star." }
            options: [{ object: star }, { object: sun }, { object: moon }]
            answer: star
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "dog"
            say: { de: "Englische Wörter, die du schon sprechen kannst, kannst du auch lesen. Hier steht „dog“, der Hund.", en: "Dog." }
            show: { object: dog }
          - text: "cat, car"
            say: { de: "Manche Wörter fangen gleich an: „cat“ und „car“. Schau dir deshalb alle Buchstaben an, bis zum letzten.", en: "Cat. Car." }
          - text: "c a t"
            say: { de: "Lies das Wort von links nach rechts und sieh dann zum Bild. Passt alles zusammen?" }
            show: { object: cat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "fish" }
                options: [{ object: fish }, { object: frog }, { object: fox }]
                answer: fish
                hints:
                  - "Alle drei fangen mit f an. Schau auf die nächsten Buchstaben."
                  - "Nach dem f kommt ein i, dann sh."
                  - "„Fish“ ist der Fisch."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "car" }
                options: [{ object: car }, { object: cat }, { object: cake }]
                answer: car
                feedback:
                  cat: "Schau auf den letzten Buchstaben. Das Wort endet mit r, nicht mit t."
                hints:
                  - "Lies bis zum letzten Buchstaben."
                  - "c, a, r. Am Ende steht ein r."
                  - "„Car“ ist das Auto."
              - id: l1-f3
                type: matching
                option_audio: false
                say: { de: "Lies die Wörter. Was passt zusammen? Tippe auf ein Wort und dann auf das Bild." }
                text: "Was passt zusammen?"
                pairs:
                  - left: { text: "sun" }
                    right: { object: sun }
                  - left: { text: "bus" }
                    right: { object: bus }
                  - left: { text: "pig" }
                    right: { object: pig }
                hints:
                  - "Fang mit dem Wort an, das du am sichersten lesen kannst."
                  - "„Pig“ fängt mit p an."
                  - "„Sun“ ist die Sonne, „bus“ der Bus, „pig“ das Schwein."
              - id: l1-f4
                type: true_false
                text: "bed"
                say: { de: "Lies das Wort. Passt es zum Bild?" }
                show: { object: bed }
                answer: true
                hints:
                  - "Lies das Wort Buchstabe für Buchstabe."
                  - "b, e, d. Das klingt fast wie Bett."
                  - "Ja, „bed“ ist das Bett."
              - id: l1-f5
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "tree" }
                options: [{ object: tree }, { object: leaf }, { object: rose }]
                answer: tree
                hints:
                  - "Das Wort hat zwei e in der Mitte."
                  - "Es fängt mit tr an."
                  - "„Tree“ ist der Baum."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "duck" }
                options: [{ object: duck }, { object: dog }, { object: bus }]
                answer: duck
                hints: ["Nach dem d kommt ein u."]
              - id: l1-s2
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "hat" }
                options: [{ object: hat }, { object: hand }, { object: house }]
                answer: hat
                hints: ["Das Wort hat nur drei Buchstaben."]
              - id: l1-s3
                type: matching
                option_audio: false
                say: { de: "Lies die Wörter. Was passt zusammen? Tippe auf ein Wort und dann auf das Bild." }
                text: "Was passt zusammen?"
                pairs:
                  - left: { text: "book" }
                    right: { object: book }
                  - left: { text: "ball" }
                    right: { object: ball }
                  - left: { text: "bee" }
                    right: { object: bee }
                hints: ["Alle fangen mit b an. Schau auf die Buchstaben danach."]
              - id: l1-s4
                type: true_false
                text: "sock"
                say: { de: "Lies das Wort. Passt es zum Bild?" }
                show: { object: shoe }
                answer: false
                hints: ["„Sock“ ist die Socke. Was zeigt das Bild?"]
              - id: l1-s5
                type: multiple_choice
                option_audio: false
                text: "Welches Wort passt zum Bild?"
                say: { de: "Welches Wort passt zum Bild?" }
                show: { object: moon }
                options: ["moon", "mouse", "milk"]
                answer: "moon"
                hints: ["Das Wort hat zwei o in der Mitte."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "frog" }
                options: [{ object: fox }, { object: frog }, { object: fish }]
                answer: frog
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Welches Wort passt zum Bild?"
                say: { de: "Welches Wort passt zum Bild?" }
                show: { object: cake }
                options: ["cake", "cat", "car"]
                answer: "cake"
              - id: l1-n3
                type: matching
                option_audio: false
                say: { de: "Lies die Wörter. Was passt zusammen? Tippe auf ein Wort und dann auf das Bild." }
                text: "Was passt zusammen?"
                pairs:
                  - left: { text: "egg" }
                    right: { object: egg }
                  - left: { text: "apple" }
                    right: { object: apple }
                  - left: { text: "bread" }
                    right: { object: bread }
              - id: l1-n4
                type: true_false
                text: "star"
                say: { de: "Lies das Wort. Passt es zum Bild?" }
                show: { object: star }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "boat" }
                options: [{ object: boat }, { object: book }, { object: bike }]
                answer: boat

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            option_audio: false
            text: "Lies das Wort. Welches Bild passt?"
            say: { de: "Lies das Wort. Welches Bild passt?" }
            show: { drawn: word-card, text: "pig" }
            options: [{ object: pig }, { object: pie }, { object: pizza }]
            answer: pig
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Welches Wort passt zum Bild?"
            say: { de: "Welches Wort passt zum Bild?" }
            show: { object: sun }
            options: ["sun", "sock", "snake"]
            answer: "sun"
          - id: l1-c3
            type: true_false
            text: "cup"
            say: { de: "Lies das Wort. Passt es zum Bild?" }
            show: { object: cake }
            answer: false

  - n: 2
    title: { de: "Genau bis zum Ende lesen", en: "Reading to the end" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            option_audio: false
            text: "Lies das Wort. Welches Bild passt?"
            say: { de: "Lies das Wort. Welches Bild passt?" }
            show: { drawn: word-card, text: "dog" }
            options: [{ object: dog }, { object: duck }, { object: frog }]
            answer: dog
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "bus"
            say: { de: "Lies das Wort. Passt es zum Bild?" }
            show: { object: bus }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "snake, snail"
            say: { de: "Diese beiden Wörter fangen gleich an. Erst am Ende siehst du den Unterschied: „snake“ ist die Schlange, „snail“ ist die Schnecke.", en: "Snake. Snail." }
            show: { objects: [snake, snail] }
          - text: "pencil, pencil case"
            say: { de: "Manchmal gehören zwei Wörter zusammen. „Pencil“ ist der Bleistift, „pencil case“ ist das Mäppchen. Lies bis zum Schluss.", en: "Pencil. Pencil case." }
            show: { objects: [pencil, pencil-case] }
          - text: "ba-na-na, but-ter-fly"
            say: { de: "Lange Wörter liest du in Silben. Dann setzt du sie zusammen.", en: "Banana. Butterfly." }
            show: { object: butterfly }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "snail" }
                options: [{ object: snail }, { object: snake }, { object: shell }]
                answer: snail
                feedback:
                  snake: "Lies bis zum Ende: „snail“ endet mit ail, „snake“ endet mit ake."
                hints:
                  - "Zwei Wörter fangen mit sna an. Schau auf das Ende."
                  - "Das Wort endet mit ail."
                  - "„Snail“ ist die Schnecke."
              - id: l2-f2
                type: image_multiple_choice
                option_audio: false
                text: "Lies die Wörter. Welches Bild passt?"
                say: { de: "Lies die Wörter. Welches Bild passt?" }
                show: { drawn: word-card, text: "pencil case" }
                options: [{ object: pencil-case }, { object: pencil }, { object: ruler }]
                answer: pencil-case
                hints:
                  - "Hier stehen zwei Wörter. Lies beide."
                  - "„Pencil“ und „case“ gehören zusammen."
                  - "„Pencil case“ ist das Mäppchen."
              - id: l2-f3
                type: matching
                option_audio: false
                say: { de: "Lies die Wörter. Was passt zusammen? Tippe auf ein Wort und dann auf das Bild." }
                text: "Was passt zusammen?"
                pairs:
                  - left: { text: "banana" }
                    right: { object: banana }
                  - left: { text: "butterfly" }
                    right: { object: butterfly }
                  - left: { text: "elephant" }
                    right: { object: elephant }
                  - left: { text: "giraffe" }
                    right: { object: giraffe }
                hints:
                  - "Lies die langen Wörter in Silben."
                  - "Zwei Wörter fangen mit b an: „banana“ und „butterfly“."
                  - "„Elephant“ ist der Elefant, „giraffe“ die Giraffe."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Welches Wort passt zum Bild?"
                say: { de: "Welches Wort passt zum Bild?" }
                show: { object: crocodile }
                options: ["crocodile", "clock", "cloud"]
                answer: "crocodile"
                hints:
                  - "Das Tier hat einen langen Namen."
                  - "Lies in Silben: cro-co-dile."
                  - "„Crocodile“ ist das Krokodil."
              - id: l2-f5
                type: true_false
                text: "jacket"
                say: { de: "Lies das Wort. Passt es zum Bild?" }
                show: { object: jumper }
                answer: false
                hints:
                  - "Lies das Wort ganz."
                  - "„Jacket“ ist die Jacke."
                  - "Das Bild zeigt einen Pullover, keine Jacke."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "clock" }
                options: [{ object: clock }, { object: clown }, { object: cloud }]
                answer: clock
                hints: ["Alle fangen mit cl an. Das Wort endet mit ck."]
              - id: l2-s2
                type: multiple_choice
                option_audio: false
                text: "Welches Wort passt zum Bild?"
                say: { de: "Welches Wort passt zum Bild?" }
                show: { object: strawberry }
                options: ["strawberry", "star", "snowman"]
                answer: "strawberry"
                hints: ["Lies in Silben: straw-ber-ry."]
              - id: l2-s3
                type: matching
                option_audio: false
                say: { de: "Lies die Wörter. Was passt zusammen? Tippe auf ein Wort und dann auf das Bild." }
                text: "Was passt zusammen?"
                pairs:
                  - left: { text: "school bag" }
                    right: { object: schoolbag }
                  - left: { text: "telephone" }
                    right: { object: telephone }
                  - left: { text: "ice cream" }
                    right: { object: ice-cream }
                hints: ["„School bag“ und „ice cream“ sind je zwei Wörter."]
              - id: l2-s4
                type: true_false
                text: "rabbit"
                say: { de: "Lies das Wort. Passt es zum Bild?" }
                show: { object: rabbit }
                answer: true
                hints: ["Lies in Silben: rab-bit."]
              - id: l2-s5
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "monkey" }
                options: [{ object: monkey }, { object: mouse }, { object: moon }]
                answer: monkey
                hints: ["Lies in Silben: mon-key."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "snowman" }
                options: [{ object: snowman }, { object: snow }, { object: snake }]
                answer: snowman
              - id: l2-n2
                type: matching
                option_audio: false
                say: { de: "Lies die Wörter. Was passt zusammen? Tippe auf ein Wort und dann auf das Bild." }
                text: "Was passt zusammen?"
                pairs:
                  - left: { text: "ruler" }
                    right: { object: ruler }
                  - left: { text: "rubber" }
                    right: { object: rubber }
                  - left: { text: "pencil" }
                    right: { object: pencil }
              - id: l2-n3
                type: multiple_choice
                option_audio: false
                text: "Welches Wort passt zum Bild?"
                say: { de: "Welches Wort passt zum Bild?" }
                show: { object: butterfly }
                options: ["butterfly", "banana", "balloon"]
                answer: "butterfly"
              - id: l2-n4
                type: true_false
                text: "shoe"
                say: { de: "Lies das Wort. Passt es zum Bild?" }
                show: { object: sock }
                answer: false
              - id: l2-n5
                type: image_multiple_choice
                option_audio: false
                text: "Lies das Wort. Welches Bild passt?"
                say: { de: "Lies das Wort. Welches Bild passt?" }
                show: { drawn: word-card, text: "giraffe" }
                options: [{ object: giraffe }, { object: goat }, { object: girl }]
                answer: giraffe

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            option_audio: false
            text: "Lies das Wort. Welches Bild passt?"
            say: { de: "Lies das Wort. Welches Bild passt?" }
            show: { drawn: word-card, text: "cloud" }
            options: [{ object: cloud }, { object: clown }, { object: clock }]
            answer: cloud
          - id: l2-c2
            type: image_multiple_choice
            option_audio: false
            text: "Lies das Wort. Welches Bild passt?"
            say: { de: "Lies das Wort. Welches Bild passt?" }
            show: { drawn: word-card, text: "hedgehog" }
            options: [{ object: hedgehog }, { object: hand }, { object: head }]
            answer: hedgehog
          - id: l2-c3
            type: matching
            option_audio: false
            say: { de: "Lies jedes Wort bis zum Ende. Tippe auf ein Wort und dann auf das passende Bild." }
            text: "Lies bis zum Ende. Was passt zusammen?"
            pairs:
              - left: { text: "snake" }
                right: { object: snake }
              - left: { text: "snail" }
                right: { object: snail }
              - left: { text: "shell" }
                right: { object: shell }
          - id: l2-c4
            type: multiple_choice
            option_audio: false
            text: "Welches Wort passt zum Bild?"
            say: { de: "Welches Wort passt zum Bild?" }
            show: { object: telephone }
            options: ["telephone", "teacher", "table"]
            answer: "telephone"
          - id: l2-c5
            type: true_false
            text: "duck"
            say: { de: "Lies das Wort. Passt es zum Bild?" }
            show: { object: dog }
            answer: false
