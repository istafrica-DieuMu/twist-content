# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-likes
skill: fl.speaking.likes
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Was ich mag und nicht mag
  en: What I like and don't like
summary: >
  Saying what you like and do not like, and asking others. Lesson 1 brings
  I like ... and I don't like ... with food and animals, heard, read and
  built from word cards; lesson 2 asks Do you like ...?, answers with
  Yes, I do. and No, I don't., adds My favourite ... is ..., and ends with
  the skill check. Speaking tasks are practice only.
metadata:
  year: lernjahr-1
  topic: { de: Sprechen, en: Speaking }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.speaking.name-things, fl.grammar.chunks]
  also_practises: [fl.themes.food, fl.grammar.questions]
  vocabulary: { en: [I like, I don't like, "Do you like ...?", "Yes, I do.", "No, I don't.", my favourite, food, animal] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: hears-like
      what: Hears like in I don't like and takes it for liking
      addressed: lesson 1 Learn puts don't before like; l1-f2 (with feedback), l1-s1 and l1-n1 put a don't like and a like in one sentence, and the check asks for what the child does not like
    - id: yes-i-like
      what: Answers Do you like ...? with Yes, I like. instead of Yes, I do.
      addressed: lesson 2 Learn shows the short answers; l2-f1 gives feedback on Yes, I like., and l2-s1, l2-n3 and l2-c3 keep the wrong short answer among the options
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "I like ... und I don't like ...", en: "I like ... and I don't like ..." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Pizza." }
            options: [{ object: pizza }, { object: cheese }, { object: cake }]
            answer: pizza
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Ice cream." }
            options: [{ object: milk }, { object: ice-cream }, { object: apple }]
            answer: ice-cream
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "I like apples."
            say: { de: "Mit „I like“ sagst du, was du magst. „I like apples“ heißt: Ich mag Äpfel.", en: "I like apples." }
            show: { object: apple }
          - text: "I don't like cheese."
            say: { de: "Mit „I don't like“ sagst du, was du nicht magst. Das „don't“ steht vor „like“. Hör gut hin, sonst klingt es wie „I like“.", en: "I don't like cheese." }
            show: { object: cheese }
          - text: "I like cats. I don't like snakes."
            say: { de: "Bei Tieren und vielen Sachen zum Essen sagst du die Mehrzahl: „I like cats“, „I like apples“.", en: "I like cats. I don't like snakes." }
            show: { object: cat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Was mag das Kind?" }
                audio: { en: "I like bananas." }
                options: [{ object: banana }, { object: apple }, { object: cheese }]
                answer: banana
                hints:
                  - "Hör auf das Wort nach „I like“."
                  - "Bananas klingt fast wie das deutsche Wort."
                  - "Tippe auf die Banane."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Mag das Kind Käse?" }
                audio: { en: "I don't like cheese." }
                options: ["Ja, es mag Käse.", "Nein, es mag keinen Käse."]
                answer: "Nein, es mag keinen Käse."
                feedback:
                  "Ja, es mag Käse.": "Hör genau hin: „I don't like“ heißt: Ich mag nicht."
                hints:
                  - "Hörst du ein „don't“?"
                  - "I don't like cheese."
                  - "„Don't like“ heißt: mag nicht. Das Kind mag keinen Käse."
              - id: l1-f3
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Ich mag Hunde." }
                options: ["dogs", "like", "I"]
                slot_count: 3
                answer: ["I", "like", "dogs"]
                hints:
                  - "Der Satz fängt mit „I“ an."
                  - "Nach „I“ kommt „like“."
                  - "I like dogs."
              - id: l1-f4
                type: true_false
                text: "I like pizza."
                say: { de: "Lies den Satz. Mag das Kind Pizza?" }
                show: { object: pizza }
                answer: true
                hints:
                  - "Steht im Satz ein „don't“?"
                  - "Nein, da steht nur „I like“."
                  - "Ja, das Kind mag Pizza."
              - id: l1-f5
                type: speak
                say: { de: "Sag auf Englisch, dass du Eis magst.", en: "I like ice cream." }
                show: { object: ice-cream }
                expected_text: "I like ice cream"
                hints:
                  - "Fang mit „I like“ an."
                  - "Eis heißt „ice cream“."
                  - "Sag mit mir: I like ice cream."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Was mag das Kind nicht?" }
                audio: { en: "I like milk. I don't like juice." }
                options: [{ object: milk }, { object: juice }, { object: water }]
                answer: juice
                hints: ["Hör auf das Wort nach „don't like“."]
              - id: l1-s2
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz."
                say: { de: "Das Kind mag keine Karotten. Ergänze den Satz." }
                show: { object: carrot }
                frame: "I _ like carrots."
                options: ["don't", "do", "am"]
                answer: ["don't"]
                hints: ["„Nicht mögen“ heißt „don't like“."]
              - id: l1-s3
                type: image_multiple_choice
                option_audio: false
                text: "I like frogs."
                say: { de: "Lies den Satz. Welches Bild passt?" }
                options: [{ object: frog }, { object: dog }, { object: fish }]
                answer: frog
                hints: ["„Frog“ ist ein Tier, das quakt."]
              - id: l1-s4
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Ich mag keine Schlangen." }
                options: ["snakes", "like", "don't", "I"]
                slot_count: 4
                answer: ["I", "don't", "like", "snakes"]
                hints: ["„Don't“ steht vor „like“."]
              - id: l1-s5
                type: speak
                say: { de: "Sag auf Englisch, dass du keinen Käse magst.", en: "I don't like cheese." }
                show: { object: cheese }
                expected_text: "I don't like cheese"
                hints: ["Sag mit mir: I don't like cheese."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Was mag das Kind?" }
                audio: { en: "I don't like apples. I like oranges." }
                options: [{ object: apple }, { object: orange }, { object: banana }]
                answer: orange
              - id: l1-n2
                type: true_false
                text: "I don't like cats."
                say: { de: "Lies den Satz. Mag das Kind Katzen?" }
                answer: false
              - id: l1-n3
                type: fill_in_blank
                option_audio: false
                text: "Ergänze den Satz."
                say: { de: "Das Kind mag Erdbeeren. Ergänze den Satz." }
                show: { object: strawberry }
                frame: "I _ strawberries."
                options: ["like", "don't like", "am"]
                answer: ["like"]
              - id: l1-n4
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Ich mag Katzen." }
                options: ["cats", "I", "like"]
                slot_count: 3
                answer: ["I", "like", "cats"]
              - id: l1-n5
                type: audio_choice
                say: { de: "Hör zu. Was mag Ben?" }
                audio: { en: "I'm Ben. I like pizza, but I don't like carrots." }
                options: [{ object: pizza }, { object: carrot }, { object: cake }]
                answer: pizza

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Was mag das Kind nicht?" }
            audio: { en: "I don't like milk." }
            options: [{ object: milk }, { object: juice }, { object: water }]
            answer: milk
          - id: l1-c2
            type: image_multiple_choice
            option_audio: false
            text: "I like dogs."
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: dog }, { object: cat }, { object: duck }]
            answer: dog
          - id: l1-c3
            type: true_false
            text: "I like cake."
            say: { de: "Lies den Satz. Mag das Kind Kuchen?" }
            answer: true

  - n: 2
    title: { de: "Do you like ...?", en: "Do you like ...?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Was mag das Kind?" }
            audio: { en: "I like strawberries." }
            options: [{ object: strawberry }, { object: apple }, { object: banana }]
            answer: strawberry
            difficulty: easy
          - id: l2-w2
            type: ordering
            option_audio: false
            text: "Bring die Wörter in die richtige Reihenfolge."
            say: { de: "Bau den Satz: Ich mag keine Bananen." }
            options: ["bananas", "don't", "I", "like"]
            slot_count: 4
            answer: ["I", "don't", "like", "bananas"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Do you like apples?"
            say: { de: "So fragst du, ob jemand etwas mag. Die Frage fängt mit „Do you like“ an.", en: "Do you like apples?" }
            show: { object: apple }
          - text: "Yes, I do. No, I don't."
            say: { de: "Die kurze Antwort ist „Yes, I do“ oder „No, I don't“. Du sagst nicht „Yes, I like“.", en: "Do you like apples? Yes, I do. Do you like cheese? No, I don't." }
          - text: "My favourite food is pizza."
            say: { de: "Was du am allerliebsten magst, ist dein „favourite“. „My favourite food is pizza“ heißt: Mein Lieblingsessen ist Pizza.", en: "My favourite food is pizza." }
            show: { object: pizza }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Du magst Bananen. Hör die Frage. Welche Antwort passt?" }
                audio: { en: "Do you like bananas?" }
                options: ["Yes, I do.", "Yes, I like.", "Yes, I am."]
                answer: "Yes, I do."
                feedback:
                  "Yes, I like.": "Auf „Do you like …?“ antwortest du kurz mit „do“: „Yes, I do.“"
                hints:
                  - "Die Frage fängt mit „Do“ an. Die Antwort auch."
                  - "Du magst Bananen, also sagst du „Yes“."
                  - "Yes, I do."
              - id: l2-f2
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau die Frage: Magst du Katzen?" }
                options: ["like", "Do", "cats?", "you"]
                slot_count: 4
                answer: ["Do", "you", "like", "cats?"]
                hints:
                  - "Die Frage fängt mit dem Wort an, das großgeschrieben ist."
                  - "Do you ..."
                  - "Do you like cats?"
              - id: l2-f3
                type: audio_choice
                say: { de: "Hör zu. Mag Lily Hunde?" }
                audio: { en: "Lily, do you like dogs? No, I don't. I like cats." }
                options: ["Ja, Lily mag Hunde.", "Nein, Lily mag keine Hunde."]
                answer: "Nein, Lily mag keine Hunde."
                hints:
                  - "Hör auf Lilys Antwort."
                  - "Sie sagt: No, I don't."
                  - "Lily mag keine Hunde, sie mag Katzen."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Du willst wissen, ob dein Freund Pizza mag. Was fragst du?"
                say: { de: "Du willst wissen, ob dein Freund Pizza mag. Was fragst du?" }
                options: ["Do you like pizza?", "You like pizza?", "I like pizza."]
                answer: "Do you like pizza?"
                feedback:
                  "You like pizza?": "Im Englischen fängt die Frage mit „Do“ an: „Do you like pizza?“"
                hints:
                  - "Du stellst eine Frage. Welcher Satz ist eine Frage mit „Do“?"
                  - "„I like pizza“ sagt, was du selbst magst."
                  - "Do you like pizza?"
              - id: l2-f5
                type: speak
                say: { de: "Frag auf Englisch: Magst du Eis?", en: "Do you like ice cream?" }
                show: { object: ice-cream }
                expected_text: "Do you like ice cream?"
                hints:
                  - "Fang mit „Do you like“ an."
                  - "Eis heißt „ice cream“."
                  - "Sag mit mir: Do you like ice cream?"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Du magst keinen Käse. Hör die Frage. Welche Antwort passt?" }
                audio: { en: "Do you like cheese?" }
                options: ["No, I don't.", "No, I not.", "Yes, I do."]
                answer: "No, I don't."
                hints: ["Du magst keinen Käse. Die Antwort fängt mit „No“ an und hat „don't“."]
              - id: l2-s2
                type: audio_choice
                say: { de: "Hör zu. Was isst Tom am liebsten?" }
                audio: { en: "Tom, what's your favourite food? My favourite food is cake." }
                options: [{ object: pizza }, { object: cake }, { object: cheese }]
                answer: cake
                hints: ["Hör auf das Ende: My favourite food is ..."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau die Frage: Magst du Milch?" }
                options: ["milk?", "you", "like", "Do"]
                slot_count: 4
                answer: ["Do", "you", "like", "milk?"]
                hints: ["Die Frage fängt mit „Do“ an."]
              - id: l2-s4
                type: fill_in_blank
                option_audio: false
                text: "Ergänze die Antwort."
                say: { de: "Du magst Äpfel. Ergänze die Antwort." }
                frame: "Do you like apples? Yes, I _."
                options: ["do", "like", "am"]
                answer: ["do"]
                hints: ["Die Frage hat „Do“. Die Antwort auch."]
              - id: l2-s5
                type: speak
                say: { de: "Sag auf Englisch, welches Tier du am liebsten magst. Zum Beispiel so:", en: "My favourite animal is the dog." }
                show: { object: dog }
                expected_text: "My favourite animal is the dog"
                hints: ["Fang mit „My favourite animal is“ an."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Was mag Sam nicht?" }
                audio: { en: "Sam, do you like carrots? No, I don't. Do you like apples? Yes, I do." }
                options: [{ object: carrot }, { object: apple }, { object: banana }]
                answer: carrot
              - id: l2-n2
                type: multiple_choice
                option_audio: false
                text: "Du willst wissen, ob deine Freundin Fische mag. Was fragst du?"
                say: { de: "Du willst wissen, ob deine Freundin Fische mag. Was fragst du?" }
                options: ["Do you like fish?", "You like fish?", "Do you fish?"]
                answer: "Do you like fish?"
              - id: l2-n3
                type: audio_choice
                say: { de: "Du magst Erdbeeren. Hör die Frage. Welche Antwort passt?" }
                audio: { en: "Do you like strawberries?" }
                options: ["Yes, I do.", "No, I don't.", "Yes, I like."]
                answer: "Yes, I do."
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Mein Lieblingsessen ist Pizza." }
                options: ["pizza.", "food", "My", "is", "favourite"]
                slot_count: 5
                answer: ["My", "favourite", "food", "is", "pizza."]
              - id: l2-n5
                type: true_false
                text: "Mag Mia Bananen?"
                say: { de: "Hör zu. Mag Mia Bananen?", en: "Mia, do you like bananas? Yes, I do." }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Was mag das Kind?" }
            audio: { en: "I don't like milk. I like juice." }
            options: [{ object: milk }, { object: juice }, { object: water }]
            answer: juice
          - id: l2-c2
            type: ordering
            option_audio: false
            text: "Bring die Wörter in die richtige Reihenfolge."
            say: { de: "Bau den Satz: Ich mag keine Frösche." }
            options: ["frogs", "I", "like", "don't"]
            slot_count: 4
            answer: ["I", "don't", "like", "frogs"]
          - id: l2-c3
            type: audio_choice
            say: { de: "Du magst keine Karotten. Hör die Frage. Welche Antwort passt?" }
            audio: { en: "Do you like carrots?" }
            options: ["No, I don't.", "Yes, I do.", "No, I like."]
            answer: "No, I don't."
          - id: l2-c4
            type: multiple_choice
            option_audio: false
            text: "Du willst wissen, ob dein Freund Hunde mag. Was fragst du?"
            say: { de: "Du willst wissen, ob dein Freund Hunde mag. Was fragst du?" }
            options: ["Do you like dogs?", "You like dogs?", "I like dogs."]
            answer: "Do you like dogs?"
          - id: l2-c5
            type: image_multiple_choice
            option_audio: false
            text: "My favourite animal is the elephant."
            say: { de: "Lies den Satz. Welches Bild passt?" }
            options: [{ object: elephant }, { object: giraffe }, { object: lion }]
            answer: elephant
