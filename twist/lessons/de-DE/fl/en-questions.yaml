# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-questions
skill: fl.grammar.questions
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Fragen auf Englisch
  en: Questions in English
summary: >
  Questions with a question word and yes-no questions. Lesson 1 brings
  What?, Where?, Who? and How many?, what each one asks for and which
  answer fits; lesson 2 asks and answers Can you …?, Do you like …? and
  Have you got …? with the short answers (Yes, I can. No, I haven't.),
  builds questions from word cards, and ends with the skill check.
  Instructions are in German; the English is spoken and shown in short
  form.
metadata:
  year: lernjahr-1
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks]
  also_practises: [fl.themes.numbers-to-10, fl.themes.food]
  vocabulary: { en: [What, Where, Who, How many, "Can you …?", "Do you like …?", "Have you got …?", "Yes, I can.", "No, I can't.", "Yes, I have.", "No, I haven't."] }
  forms: [audio, picture, text]
  drawn: [dots]
  facets: []
  misconceptions:
    - id: where-wer
      what: Mixes up English "Where" with German "wer" because they sound alike
      addressed: lesson 1 Learn sets Where (wo) against Who (wer); l1-f2 (with feedback), l1-s2, l1-c1 and l2-w1 ask what a question word means with Wo and Wer both among the options, and the skill check (l2-c1) asks for Where with Who among the options
    - id: short-answer-verb
      what: Answers with the wrong verb (Can you swim? Yes, I do.)
      addressed: lesson 2 Learn pairs each question with its short answer; every stage of lesson 2 has a short-answer task with a mismatched verb among the options, with feedback in l2-f1
    - id: german-question-order
      what: Builds the question in German order (You can swim?)
      addressed: an ordering task in every stage of lesson 2 and in the skill check, starting with Can, Have or Do
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "What? Where? Who? How many?", en: "What? Where? Who? How many?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Was hat das Kind?" }
            audio: { en: "I have got a cat." }
            options: [{ object: dog }, { object: cat }, { object: fish }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Six." }
            options: ["6", "7", "16"]
            answer: "6"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "What? = Was?"
            say: { de: "Mit „What“ fragst du: Was?", en: "What is this? It's a ball." }
            show: { object: ball }
          - text: "Where? = Wo? · Who? = Wer?"
            say: { de: "Pass gut auf. „Where“ klingt fast wie wer, heißt aber wo. „Who“ heißt wer.", en: "Where is the cat? It's on the bed. Who is this? It's my mum." }
            show: { objects: [cat, mum] }
          - text: "How many? = Wie viele?"
            say: { de: "Mit „How many“ fragst du: Wie viele?", en: "How many balls? Three balls." }
            show: { object: ball, count: 3, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes englische Fragewort mit dem deutschen."
                pairs:
                  - { left: { text: "What?" }, right: { text: "Was?" } }
                  - { left: { text: "Who?" }, right: { text: "Wer?" } }
                  - { left: { text: "How many?" }, right: { text: "Wie viele?" } }
                hints:
                  - "Fang mit dem Wort an, das du sicher weißt."
                  - "„Who“ heißt wer."
                  - "What passt zu Was, Who zu Wer, How many zu Wie viele."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Where?"
                say: "Was heißt „Where“ auf Deutsch?"
                options: ["Wo?", "Wer?", "Was?"]
                answer: "Wo?"
                option_audio: false
                feedback:
                  "Wer?": "„Where“ klingt wie wer, heißt aber wo. Wer heißt „who“."
                hints:
                  - "Vorsicht, es klingt wie ein deutsches Wort."
                  - "Where is the cat? Die Frage will einen Ort wissen."
                  - "Wo?"
              - id: l1-f3
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passende Antwort." }
                audio: { en: "How many apples?" }
                show: { object: apple, count: 4, layout: row }
                options:
                  - { drawn: dots, count: 4, layout: dice }
                  - { drawn: dots, count: 3, layout: dice }
                  - { object: apple }
                answer: "4"
                hints:
                  - "„How many“ fragt: Wie viele?"
                  - "Die Antwort ist eine Zahl. Zähl die Äpfel."
                  - "Es sind vier Äpfel. Tippe auf die vier Punkte."
              - id: l1-f4
                type: multiple_choice
                text: "„What is this?“"
                say: { de: "Hör zu. Welche Antwort passt?", en: "What is this?" }
                show: { object: banana }
                options: ["It's a banana.", "It's in the kitchen.", "Three."]
                answer: "It's a banana."
                option_audio: false
                hints:
                  - "„What“ fragt: Was?"
                  - "Was ist das auf dem Bild?"
                  - "It's a banana."
              - id: l1-f5
                type: multiple_choice
                text: "„Who is this?“"
                say: { de: "Hör zu. Welche Antwort passt?", en: "Who is this?" }
                show: { object: grandma }
                options: ["It's my grandma.", "It's a ball.", "Two."]
                answer: "It's my grandma."
                option_audio: false
                hints:
                  - "„Who“ fragt: Wer?"
                  - "Die Antwort nennt eine Person."
                  - "It's my grandma."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Frage mit der passenden Antwort."
                pairs:
                  - { left: { text: "How many?" }, right: { text: "Five." } }
                  - { left: { text: "Where?" }, right: { text: "In the garden." } }
                  - { left: { text: "Who?" }, right: { text: "My dad." } }
                hints: ["Überleg zuerst, was jedes Fragewort auf Deutsch heißt."]
              - id: l1-s2
                type: multiple_choice
                text: "Who?"
                say: "Was heißt „Who“ auf Deutsch?"
                options: ["Wo?", "Wie viele?", "Wer?"]
                answer: "Wer?"
                option_audio: false
                hints: ["Denk an „Who is this? It's my mum.“"]
              - id: l1-s3
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passende Antwort." }
                audio: { en: "How many dogs?" }
                show: { object: dog, count: 2, layout: row }
                options:
                  - { object: dog }
                  - { drawn: dots, count: 2, layout: dice }
                  - { drawn: dots, count: 1, layout: dice }
                answer: "2"
                hints: ["Welche Art Antwort will die Frage?"]
              - id: l1-s4
                type: multiple_choice
                text: "„Where is the cat?“"
                say: { de: "Hör zu. Welche Antwort passt?", en: "Where is the cat?" }
                options: ["It's on the bed.", "It's a cat.", "Three cats."]
                answer: "It's on the bed."
                option_audio: false
                hints: ["Die Frage will einen Ort wissen."]
              - id: l1-s5
                type: multiple_choice
                text: "„What is this?“"
                say: { de: "Hör zu. Welche Antwort passt?", en: "What is this?" }
                show: { object: kite }
                options: ["It's my brother.", "It's a kite.", "On the table."]
                answer: "It's a kite."
                option_audio: false
                hints: ["Was fragt „What“?"]

          - support: none
            tasks:
              - id: l1-n1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Frage mit der passenden Antwort."
                pairs:
                  - { left: { text: "What is this?" }, right: { text: "A book." } }
                  - { left: { text: "Who is this?" }, right: { text: "My sister." } }
                  - { left: { text: "Where is the ball?" }, right: { text: "Under the chair." } }
              - id: l1-n2
                type: multiple_choice
                text: "How many?"
                say: "Was heißt „How many“ auf Deutsch?"
                options: ["Wie viele?", "Wie alt?", "Wo?"]
                answer: "Wie viele?"
                option_audio: false
              - id: l1-n3
                type: audio_choice
                say: { de: "Hör zu. Tippe auf die passende Antwort." }
                audio: { en: "How many stars?" }
                show: { object: star, count: 5, layout: row }
                options:
                  - { drawn: dots, count: 5, layout: dice }
                  - { object: star }
                  - { drawn: dots, count: 4, layout: dice }
                answer: "5"
              - id: l1-n4
                type: multiple_choice
                text: "„Who is this?“"
                say: { de: "Hör zu. Welche Antwort passt?", en: "Who is this?" }
                show: { object: dad }
                options: ["It's in the house.", "Four.", "It's my dad."]
                answer: "It's my dad."
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "„Where is the book?“"
                say: { de: "Hör zu. Welche Antwort passt?", en: "Where is the book?" }
                options: ["It's a book.", "It's on the table.", "My mum."]
                answer: "It's on the table."
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "What?"
            say: "Was heißt „What“ auf Deutsch?"
            options: ["Wer?", "Was?", "Wo?"]
            answer: "Was?"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "„Where is my bag?“"
            say: { de: "Hör zu. Welche Antwort passt?", en: "Where is my bag?" }
            options: ["It's a bag.", "Two bags.", "It's under the table."]
            answer: "It's under the table."
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "„Who is this?“"
            say: { de: "Hör zu. Welche Antwort passt?", en: "Who is this?" }
            show: { object: grandpa }
            options: ["It's my grandpa.", "It's a dog.", "Six."]
            answer: "It's my grandpa."
            option_audio: false

  - n: 2
    title: { de: "Can you swim? Yes, I can.", en: "Can you swim? Yes, I can." }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Where?"
            say: "Was heißt „Where“ auf Deutsch?"
            options: ["Wer?", "Wo?", "Was?"]
            answer: "Wo?"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf die passende Antwort." }
            audio: { en: "How many cars?" }
            show: { object: car, count: 3, layout: row }
            options:
              - { drawn: dots, count: 3, layout: dice }
              - { object: car }
              - { drawn: dots, count: 2, layout: dice }
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Can you swim? Yes, I can. / No, I can't."
            say: { de: "Auf eine Ja-Nein-Frage antwortest du kurz. Dabei nimmst du das erste Wort der Frage wieder: „can“, „do“ oder „have“.", en: "Can you swim? Yes, I can. No, I can't." }
            show: { object: swim }
          - text: "Do you like cake? Yes, I do. / No, I don't."
            say: { en: "Do you like cake? Yes, I do. No, I don't." }
            show: { object: cake }
          - text: "Have you got a pet? Yes, I have. / No, I haven't."
            say: { en: "Have you got a pet? Yes, I have. No, I haven't." }
            show: { object: rabbit }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "„Can you sing?“ Du kannst singen."
                say: { de: "Du kannst singen. Was antwortest du auf diese Frage?", en: "Can you sing?" }
                options: ["Yes, I can.", "Yes, I do.", "No, I can't."]
                answer: "Yes, I can."
                option_audio: false
                feedback:
                  "Yes, I do.": "Die Frage beginnt mit „Can“. Dann antwortest du auch mit „can“: Yes, I can."
                hints:
                  - "Mit welchem Wort fängt die Frage an?"
                  - "Die Antwort nimmt dasselbe Wort: can."
                  - "Yes, I can."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Bau die Frage: Kannst du tanzen?"
                say: "Bau die Frage: Kannst du tanzen?"
                options: ["dance?", "you", "Can"]
                slot_count: 3
                answer: ["Can", "you", "dance?"]
                option_audio: false
                hints:
                  - "Die Frage fängt mit „Can“ an."
                  - "Dann kommt „you“."
                  - "Can you dance?"
              - id: l2-f3
                type: multiple_choice
                text: "„Have you got a dog?“ Du hast keinen Hund."
                say: { de: "Du hast keinen Hund. Was antwortest du auf diese Frage?", en: "Have you got a dog?" }
                options: ["No, I haven't.", "No, I can't.", "Yes, I have."]
                answer: "No, I haven't."
                option_audio: false
                hints:
                  - "Du hast keinen, also No."
                  - "Die Frage beginnt mit „Have“."
                  - "No, I haven't."
              - id: l2-f4
                type: audio_choice
                say: { de: "Hör zu. Was fragt das Kind?" }
                audio: { en: "Do you like pizza?" }
                options: ["Magst du Pizza?", "Hast du eine Pizza?", "Kannst du Pizza backen?"]
                answer: "Magst du Pizza?"
                option_audio: false
                hints:
                  - "Hör auf die ersten Wörter."
                  - "„Do you like“ heißt: Magst du?"
                  - "Magst du Pizza?"
              - id: l2-f5
                type: speak
                say: { de: "Frag auf Englisch: Kannst du schwimmen?", en: "Can you swim?" }
                show: { object: swim }
                expected_text: "Can you swim?"
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „Can you“, dann „swim“."
                  - "Sag mit mir: Can you swim?"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "„Do you like bananas?“ Du magst Bananen."
                say: { de: "Du magst Bananen. Was antwortest du auf diese Frage?", en: "Do you like bananas?" }
                options: ["Yes, I have.", "Yes, I do.", "No, I don't."]
                answer: "Yes, I do."
                option_audio: false
                hints: ["Mit welchem Wort fängt die Frage an?"]
              - id: l2-s2
                type: ordering
                text: "Bau die Frage: Hast du eine Katze?"
                say: "Bau die Frage: Hast du eine Katze?"
                options: ["got", "a cat?", "Have", "you"]
                slot_count: 4
                answer: ["Have", "you", "got", "a cat?"]
                option_audio: false
                hints: ["Die Frage fängt mit „Have“ an."]
              - id: l2-s3
                type: multiple_choice
                text: "„Can you ride a bike?“ Du kannst nicht Rad fahren."
                say: { de: "Du kannst nicht Rad fahren. Was antwortest du auf diese Frage?", en: "Can you ride a bike?" }
                options: ["No, I don't.", "No, I can't.", "Yes, I can."]
                answer: "No, I can't."
                option_audio: false
                hints: ["Ja oder nein? Und welches Wort nimmst du?"]
              - id: l2-s4
                type: audio_choice
                say: { de: "Hör zu. Was fragt das Kind?" }
                audio: { en: "Have you got a brother?" }
                options: ["Ist das dein Bruder?", "Hast du einen Bruder?", "Magst du deinen Bruder?"]
                answer: "Hast du einen Bruder?"
                option_audio: false
                hints: ["Was heißt „Have you got“?"]
              - id: l2-s5
                type: speak
                say: { de: "Frag auf Englisch: Magst du Eis?", en: "Do you like ice cream?" }
                show: { object: ice-cream }
                expected_text: "Do you like ice cream?"
                hints: ["Die Frage fängt mit „Do you like“ an."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "„Have you got a ball?“ Du hast einen Ball."
                say: { de: "Du hast einen Ball. Was antwortest du auf diese Frage?", en: "Have you got a ball?" }
                options: ["Yes, I can.", "No, I haven't.", "Yes, I have."]
                answer: "Yes, I have."
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Bau die Frage: Magst du Äpfel?"
                say: "Bau die Frage: Magst du Äpfel?"
                options: ["like", "apples?", "you", "Do"]
                slot_count: 4
                answer: ["Do", "you", "like", "apples?"]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "„Do you like milk?“ Du magst keine Milch."
                say: { de: "Du magst keine Milch. Was antwortest du auf diese Frage?", en: "Do you like milk?" }
                options: ["No, I haven't.", "No, I don't.", "Yes, I do."]
                answer: "No, I don't."
                option_audio: false
              - id: l2-n4
                type: audio_choice
                say: { de: "Hör zu. Was fragt das Kind?" }
                audio: { en: "Can you play football?" }
                options: ["Magst du Fußball?", "Hast du einen Fußball?", "Kannst du Fußball spielen?"]
                answer: "Kannst du Fußball spielen?"
                option_audio: false
              - id: l2-n5
                type: speak
                say: { de: "Frag auf Englisch: Hast du einen Hund?" }
                show: { object: dog }
                expected_text: "Have you got a dog?"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Du willst wissen, wo der Ball ist."
            say: "Du willst wissen, wo der Ball ist. Mit welchem Wort fängt deine Frage an?"
            options: ["Where?", "Who?", "What?"]
            answer: "Where?"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "„How many books?“"
            say: { de: "Hör zu. Welche Antwort passt?", en: "How many books?" }
            options: ["Seven books.", "It's a book.", "My brother."]
            answer: "Seven books."
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "„Can you jump?“ Du kannst springen."
            say: { de: "Du kannst springen. Was antwortest du auf diese Frage?", en: "Can you jump?" }
            options: ["Yes, I do.", "Yes, I have.", "Yes, I can."]
            answer: "Yes, I can."
            option_audio: false
          - id: l2-c4
            type: ordering
            text: "Bau die Frage: Hast du ein Fahrrad?"
            say: "Bau die Frage: Hast du ein Fahrrad?"
            options: ["got", "a bike?", "you", "Have"]
            slot_count: 4
            answer: ["Have", "you", "got", "a bike?"]
            option_audio: false
          - id: l2-c5
            type: audio_choice
            say: { de: "Hör zu. Was fragt das Kind?" }
            audio: { en: "Have you got a sister?" }
            options: ["Hast du eine Schwester?", "Bist du eine Schwester?", "Magst du deine Schwester?"]
            answer: "Hast du eine Schwester?"
            option_audio: false
