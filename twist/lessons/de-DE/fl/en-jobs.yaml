# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-jobs
skill: fl.themes.jobs
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Berufe auf Englisch
  en: Jobs in English
summary: >
  Naming jobs and saying what someone does at work. Lesson 1 brings
  doctor, teacher, farmer, cook, police officer and firefighter with
  "He's a …" and "She's a …" (the English job word is the same for
  women and men); lesson 2 says what each one does (A cook cooks food.)
  and asks "What do you want to be?", with "I want", not "I will", for
  ich will, and ends with the skill check. Instructions are in German; the English is spoken and
  shown in short form.
metadata:
  year: lernjahr-2
  topic: { de: Berufe, en: Jobs }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.grammar.he-she-it]
  vocabulary: { en: [doctor, teacher, farmer, cook, police officer, firefighter, "He's a …", "She's a …", "What do you want to be?", "I want to be a …"] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: no-article
      what: Leaves out the article as in German (He is doctor.)
      addressed: lesson 1 Learn says English needs "a" before the job; a "Wie sagst du" task in every stage of lesson 1 and in the quick check offers the form without "a", with feedback in l1-f3; l2-w2 and l2-c3 offer it again
    - id: will-want
      what: Says "I will be a cook." for "Ich will Koch werden." (will is a false friend; "I want" is ich will)
      addressed: lesson 2 Learn says "I want" means ich will and "I will" means ich werde; every sentence-building task in lesson 2 has a spare "will" card, with a hint on it in l2-f4; l2-c3 offers "I will be a cook."
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "He's a doctor.", en: "He's a doctor." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Sie ist neun."
            say: "Wie sagst du auf Englisch: Sie ist neun?"
            options: ["She is nine.", "She am nine.", "She has nine."]
            answer: "She is nine."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Über wen wird gesprochen?" }
            audio: { en: "He plays football." }
            options: [{ object: boy }, { object: girl }]
            answer: boy
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Heute geht es um Berufe. Hör zu und sprich nach.", en: "He's a doctor." }
            show: { object: doctor }
          - say: { en: "She's a teacher." }
            show: { object: teacher }
          - say: { en: "He's a farmer." }
            show: { object: farmer }
          - say: { en: "He's a cook." }
            show: { object: cook }
          - say: { en: "He's a police officer." }
            show: { object: police-officer }
          - text: "He's a firefighter."
            say: { de: "Im Englischen steht vor dem Beruf ein „a“. Auf Deutsch sagst du nur: Er ist Feuerwehrmann.", en: "He's a firefighter." }
            show: { object: firefighter }
          - text: "She's a teacher. · He's a teacher."
            say: { de: "Das englische Wort für den Beruf ist für Frauen und Männer gleich. Ob es eine Frau oder ein Mann ist, zeigen „she“ und „he“:", en: "She's a teacher. He's a teacher." }
            show: { object: teacher }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "He's a farmer." }
                options: [{ object: farmer }, { object: cook }, { object: doctor }]
                answer: farmer
                hints:
                  - "Hör auf das letzte Wort."
                  - "„Farmer“ ist der Bauer."
                  - "Tippe auf den Bauern mit dem Strohhut."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "He's a police officer." }
                options: [{ object: firefighter }, { object: police-officer }, { object: teacher }]
                answer: police-officer
                hints:
                  - "Hör noch einmal: police officer."
                  - "„Police“ klingt wie Polizei."
                  - "Tippe auf den Polizisten."
              - id: l1-f3
                type: multiple_choice
                text: "Er ist Koch."
                say: "Wie sagst du auf Englisch: Er ist Koch?"
                show: { object: cook }
                options: ["He's a cook.", "He's cook.", "He a cook."]
                answer: "He's a cook."
                option_audio: false
                feedback:
                  "He's cook.": "Im Englischen steht vor dem Beruf ein „a“: He's a cook."
                hints:
                  - "Was steht im Englischen vor dem Beruf?"
                  - "Vor dem Beruf kommt „a“."
                  - "He's a cook."
              - id: l1-f4
                type: speak
                say: { de: "Wer ist das? Sag es auf Englisch.", en: "She's a teacher." }
                show: { object: teacher }
                expected_text: "She's a teacher."
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „She's a“, dann „teacher“."
                  - "Sag mit mir: She's a teacher."
              - id: l1-f5
                type: true_false
                say: { de: "Hör zu. Passt der Satz zum Bild?", en: "He's a doctor." }
                show: { object: doctor }
                answer: true
                hints:
                  - "Hör noch einmal: doctor."
                  - "„Doctor“ ist der Arzt."
                  - "Ja, das passt."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "He's a firefighter." }
                options: [{ object: police-officer }, { object: farmer }, { object: firefighter }]
                answer: firefighter
                hints: ["Hör genau auf das Wort nach „He's a“."]
              - id: l1-s2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "She's a teacher." }
                options: [{ object: doctor }, { object: teacher }, { object: cook }]
                answer: teacher
                hints: ["Hör auf das letzte Wort."]
              - id: l1-s3
                type: multiple_choice
                text: "Er ist Polizist."
                say: "Wie sagst du auf Englisch: Er ist Polizist?"
                show: { object: police-officer }
                options: ["She's a police officer.", "He's a police officer.", "He's police officer."]
                answer: "He's a police officer."
                option_audio: false
                hints: ["Er oder sie? Und was steht vor dem Beruf?"]
              - id: l1-s4
                type: speak
                say: { de: "Wer ist das? Sag es auf Englisch.", en: "He's a farmer." }
                show: { object: farmer }
                expected_text: "He's a farmer."
                hints: ["Vergiss das „a“ nicht."]
              - id: l1-s5
                type: true_false
                say: { de: "Hör zu. Passt der Satz zum Bild?", en: "He's a cook." }
                show: { object: firefighter }
                answer: false
                hints: ["Was trägt die Person auf dem Kopf?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "He's a cook." }
                options: [{ object: cook }, { object: farmer }, { object: teacher }]
                answer: cook
              - id: l1-n2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "He's a doctor." }
                options: [{ object: police-officer }, { object: doctor }, { object: firefighter }]
                answer: doctor
              - id: l1-n3
                type: multiple_choice
                text: "Er ist Bauer."
                say: "Wie sagst du auf Englisch: Er ist Bauer?"
                show: { object: farmer }
                options: ["He's farmer.", "He a farmer.", "He's a farmer."]
                answer: "He's a farmer."
                option_audio: false
              - id: l1-n4
                type: speak
                say: { de: "Wer ist das? Sag es auf Englisch." }
                show: { object: firefighter }
                expected_text: "He's a firefighter."
              - id: l1-n5
                type: true_false
                say: { de: "Hör zu. Passt der Satz zum Bild?", en: "She's a teacher." }
                show: { object: teacher }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "He's a police officer." }
            options: [{ object: doctor }, { object: police-officer }, { object: cook }]
            answer: police-officer
          - id: l1-c2
            type: multiple_choice
            text: "Er ist Arzt."
            say: "Wie sagst du auf Englisch: Er ist Arzt?"
            show: { object: doctor }
            options: ["He's doctor.", "He's a doctor.", "She's a doctor."]
            answer: "He's a doctor."
            option_audio: false
          - id: l1-c3
            type: true_false
            say: { de: "Hör zu. Passt der Satz zum Bild?", en: "He's a farmer." }
            show: { object: cook }
            answer: false

  - n: 2
    title: { de: "What do you want to be?", en: "What do you want to be?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "She's a teacher." }
            options: [{ object: teacher }, { object: farmer }, { object: firefighter }]
            answer: teacher
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Er ist Feuerwehrmann."
            say: "Wie sagst du auf Englisch: Er ist Feuerwehrmann?"
            options: ["He's a firefighter.", "He's firefighter.", "He a firefighter."]
            answer: "He's a firefighter."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A doctor helps sick people."
            say: { de: "So sagst du, was jemand bei der Arbeit macht:", en: "A doctor helps sick people." }
            show: { object: doctor }
          - text: "A farmer works on a farm."
            say: { en: "A farmer works on a farm." }
            show: { object: farmer }
          - text: "A firefighter puts out fires."
            say: { en: "A firefighter puts out fires." }
            show: { object: firefighter }
          - text: "A police officer keeps people safe."
            say: { en: "A police officer keeps people safe." }
            show: { object: police-officer }
          - text: "What do you want to be? I want to be a cook."
            say: { de: "Und so fragst du, was jemand werden will:", en: "What do you want to be? I want to be a cook." }
            show: { object: cook }
          - text: "I want to be a cook."
            say: { de: "Pass auf: „I want“ heißt ich will. „I will“ heißt ich werde. Ich will Koch werden heißt also:", en: "I want to be a cook." }
            show: { object: cook }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Wer macht das?" }
                audio: { en: "This person cooks food in a restaurant." }
                options: [{ object: cook }, { object: teacher }, { object: farmer }]
                answer: cook
                hints:
                  - "Hör auf das Wort „cooks“."
                  - "„To cook“ heißt kochen."
                  - "Tippe auf den Koch."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden Beruf mit der passenden Arbeit."
                pairs:
                  - { left: { text: "teacher" }, right: { text: "teaches children" } }
                  - { left: { text: "police officer" }, right: { text: "keeps people safe" } }
                  - { left: { text: "farmer" }, right: { text: "works on a farm" } }
                hints:
                  - "Fang mit dem Beruf an, den du sicher weißt."
                  - "„Teach“ steckt in „teacher“."
                  - "Teacher passt zu teaches children, police officer zu keeps people safe, farmer zu works on a farm."
              - id: l2-f3
                type: audio_choice
                say: { de: "Hör zu. Was will das Kind werden?" }
                audio: { en: "What do you want to be? I want to be a doctor." }
                options: [{ object: police-officer }, { object: doctor }, { object: cook }]
                answer: doctor
                hints:
                  - "Hör auf das Wort am Ende."
                  - "„Doctor“ ist der Arzt."
                  - "Tippe auf den Arzt."
              - id: l2-f4
                type: ordering
                text: "Bau den Satz: Ich will Bauer werden."
                say: "Bau den Satz auf Englisch: Ich will Bauer werden."
                options: ["want", "a farmer.", "I", "will", "to be"]
                slot_count: 4
                answer: ["I", "want", "to be", "a farmer."]
                option_audio: false
                hints:
                  - "Der Satz fängt mit „I“ an."
                  - "Ich will heißt „I want“, nicht „I will“. Eine Karte bleibt übrig."
                  - "I want to be a farmer."
              - id: l2-f5
                type: speak
                say: { de: "Was willst du werden? Antworte auf Englisch. Zum Beispiel:", en: "I want to be a teacher." }
                show: { object: teacher }
                expected_text: "I want to be a teacher."
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „I want to be a“, dann der Beruf."
                  - "Sag mit mir: I want to be a teacher."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Wer macht das?" }
                audio: { en: "This person puts out fires." }
                options: [{ object: police-officer }, { object: firefighter }, { object: doctor }]
                answer: firefighter
                hints: ["Hör auf das letzte Wort."]
              - id: l2-s2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden Beruf mit der passenden Arbeit."
                pairs:
                  - { left: { text: "doctor" }, right: { text: "helps sick people" } }
                  - { left: { text: "cook" }, right: { text: "cooks food" } }
                  - { left: { text: "firefighter" }, right: { text: "puts out fires" } }
                hints: ["Achte auf Wörter, die im Beruf stecken."]
              - id: l2-s3
                type: audio_choice
                say: { de: "Hör zu. Was will das Kind werden?" }
                audio: { en: "I want to be a police officer." }
                options: [{ object: firefighter }, { object: teacher }, { object: police-officer }]
                answer: police-officer
                hints: ["Hör auf das Wort am Ende."]
              - id: l2-s4
                type: ordering
                text: "Bau die Frage: Was willst du werden?"
                say: "Bau die Frage auf Englisch: Was willst du werden?"
                options: ["want", "What", "will", "to be?", "do you"]
                slot_count: 4
                answer: ["What", "do you", "want", "to be?"]
                option_audio: false
                hints: ["Die Frage fängt mit „What“ an."]
              - id: l2-s5
                type: speak
                say: { de: "Was willst du werden? Antworte auf Englisch. Zum Beispiel:", en: "I want to be a firefighter." }
                show: { object: firefighter }
                expected_text: "I want to be a firefighter."
                hints: ["Zuerst „I want to be a“."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Wer macht das?" }
                audio: { en: "This person teaches children at school." }
                options: [{ object: teacher }, { object: cook }, { object: farmer }]
                answer: teacher
              - id: l2-n2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jeden Beruf mit der passenden Arbeit."
                pairs:
                  - { left: { text: "farmer" }, right: { text: "works on a farm" } }
                  - { left: { text: "doctor" }, right: { text: "helps sick people" } }
                  - { left: { text: "teacher" }, right: { text: "teaches children" } }
              - id: l2-n3
                type: audio_choice
                say: { de: "Hör zu. Was will das Kind werden?" }
                audio: { en: "What do you want to be? I want to be a cook." }
                options: [{ object: farmer }, { object: cook }, { object: doctor }]
                answer: cook
              - id: l2-n4
                type: ordering
                text: "Bau den Satz: Ich will Arzt werden."
                say: "Bau den Satz auf Englisch: Ich will Arzt werden."
                options: ["a doctor.", "to be", "will", "I", "want"]
                slot_count: 4
                answer: ["I", "want", "to be", "a doctor."]
                option_audio: false
              - id: l2-n5
                type: speak
                say: { de: "Du willst zur Polizei. Sag es auf Englisch mit „I want to be a“." }
                show: { object: police-officer }
                expected_text: "I want to be a police officer."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "My dad is a farmer." }
            options: [{ object: cook }, { object: farmer }, { object: police-officer }]
            answer: farmer
          - id: l2-c2
            type: audio_choice
            say: { de: "Hör zu. Wer macht das?" }
            audio: { en: "This person helps sick people." }
            options: [{ object: doctor }, { object: farmer }, { object: firefighter }]
            answer: doctor
          - id: l2-c3
            type: multiple_choice
            text: "Ich will Koch werden."
            say: "Wie sagst du auf Englisch: Ich will Koch werden?"
            options: ["I will be a cook.", "I want to be a cook.", "I want to be cook."]
            answer: "I want to be a cook."
            option_audio: false
          - id: l2-c4
            type: audio_choice
            say: { de: "Hör zu. Was will das Kind werden?" }
            audio: { en: "I want to be a farmer." }
            options: [{ object: farmer }, { object: police-officer }, { object: cook }]
            answer: farmer
          - id: l2-c5
            type: ordering
            text: "Bau den Satz: Ich will Feuerwehrfrau werden."
            say: "Bau den Satz auf Englisch: Ich will Feuerwehrfrau werden."
            options: ["a firefighter.", "will", "want", "I", "to be"]
            slot_count: 4
            answer: ["I", "want", "to be", "a firefighter."]
            option_audio: false
