# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-plurals-articles
skill: fl.grammar.plurals-articles
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Einzahl, Mehrzahl und Begleiter
  en: One or more, and the articles
summary: >
  English plurals with -s and the articles a, an and the. Lesson 1 hears
  and builds plurals (a cat, two cats) with pictures of one or many;
  lesson 2 chooses a or an (a dog, an apple) and shows that "the" is the
  same for every word (der Hund, die Katze, das Ei: the), and ends with
  the skill check. Instructions are in German; the English is spoken and
  shown in short form.
metadata:
  year: lernjahr-1
  topic: { de: Sprachmuster, en: Language patterns }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks, fl.themes.numbers-to-10]
  also_practises: [fl.themes.numbers-to-10]
  vocabulary: { en: [a, an, the, cat, dog, apple, egg, orange, ball, elephant, octopus, ant] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: no-plural-s
      what: Leaves out the plural -s after a number (three dog)
      addressed: every stage and the check of lesson 1 have a "number + _" choice with the bare word as an option (feedback in l1-f2) and a true/false task on a number with or without -s; the skill check has "three _"
    - id: a-before-vowel
      what: Says "a apple" instead of "an apple"
      addressed: lesson 2 Learn sets a dog against an apple; every stage of lesson 2 and the skill check have an a-or-an task with a word that starts with a vowel sound, with feedback in l2-f1
    - id: gendered-the
      what: Expects "the" to change like der, die, das
      addressed: lesson 2 Learn shows der Hund, die Katze, das Ei all with "the"; every stage of lesson 2 asks about it (true/false in full and none, a choice of three in some) and the skill check has l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "a cat, two cats", en: "a cat, two cats" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Welche Zahl ist das?" }
            audio: { en: "Four." }
            options: ["4", "5", "14"]
            answer: "4"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "A dog." }
            options: [{ object: dog }, { object: cat }, { object: fish }]
            answer: dog
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "a bird · two birds"
            say: { de: "Bei mehreren Dingen hängst du im Englischen meistens ein s an. Hör zu:", en: "A bird. Two birds." }
            show: { object: bird, count: 2, layout: row }
          - text: "a ball · five balls"
            say: { en: "A ball. Five balls." }
            show: { object: ball, count: 5, layout: row }
          - text: "three cars"
            say: { de: "Nach einer Zahl ab zwei steht das Wort in der Mehrzahl, meistens mit s:", en: "Three cars." }
            show: { object: car, count: 3, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Bild." }
                audio: { en: "Three apples." }
                options:
                  - { object: apple, count: 3, layout: row }
                  - { object: apple, count: 1, layout: row }
                  - { object: apple, count: 2, layout: row }
                answer: "3"
                hints:
                  - "Hör auf die Zahl."
                  - "„Three“ ist drei."
                  - "Tippe auf die drei Äpfel."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "two _"
                say: { de: "Was passt in die Lücke? Zwei Hunde.", en: "Two …" }
                show: { object: dog, count: 2, layout: row }
                options: ["dogs", "dog", "a dog"]
                answer: "dogs"
                option_audio: false
                feedback:
                  "dog": "Es sind zwei Hunde. Nach „two“ hängst du ein s an: two dogs."
                  "a dog": "„A dog“ ist nur ein Hund. Hier sind es zwei: two dogs."
                hints:
                  - "Wie viele Hunde sind es?"
                  - "Bei mehreren hängst du ein s an."
                  - "Tippe auf „dogs“: two dogs."
              - id: l1-f3
                type: audio_choice
                say: { de: "Hör zu. Ist es eins oder sind es mehrere?" }
                audio: { en: "Cats." }
                options:
                  - { object: cat, count: 1, layout: row }
                  - { object: cat, count: 4, layout: row }
                answer: "4"
                hints:
                  - "Hör auf das Ende des Wortes."
                  - "Hörst du ein s am Ende?"
                  - "Tippe auf die vier Katzen."
              - id: l1-f4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Two eggs." }
                show: { object: egg, count: 2, layout: row }
                expected_text: two eggs
                hints:
                  - "Hör noch einmal zu: two eggs."
                  - "Vergiss das s am Ende nicht."
                  - "Sag mit mir: two eggs."
              - id: l1-f5
                type: true_false
                text: "„four ball“"
                say: { de: "Ist das richtig auf Englisch? Vier Bälle:", en: "four ball" }
                show: { object: ball, count: 4, layout: row }
                answer: false
                hints:
                  - "Es sind vier Bälle."
                  - "Fehlt am Ende etwas?"
                  - "Nein. Richtig ist: four balls."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Bild." }
                audio: { en: "Two bananas." }
                options:
                  - { object: banana, count: 1, layout: row }
                  - { object: banana, count: 2, layout: row }
                  - { object: banana, count: 4, layout: row }
                answer: "2"
                hints: ["Hör auf die Zahl."]
              - id: l1-s2
                type: multiple_choice
                text: "five _"
                say: { de: "Was passt in die Lücke? Fünf Sterne.", en: "Five …" }
                show: { object: star, count: 5, layout: row }
                options: ["star", "stars", "a star"]
                answer: "stars"
                option_audio: false
                hints: ["Wie viele sind es?"]
              - id: l1-s3
                type: audio_choice
                say: { de: "Hör zu. Ist es eins oder sind es mehrere?" }
                audio: { en: "A frog." }
                options:
                  - { object: frog, count: 3, layout: row }
                  - { object: frog, count: 1, layout: row }
                answer: "1"
                hints: ["Hörst du ein s am Ende?"]
              - id: l1-s4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Three cups." }
                show: { object: cup, count: 3, layout: row }
                expected_text: three cups
                hints: ["Denk an das s am Ende."]
              - id: l1-s5
                type: true_false
                text: "„six books“"
                say: { de: "Ist das richtig auf Englisch? Sechs Bücher:", en: "six books" }
                show: { object: book, count: 6, layout: row }
                answer: true
                hints: ["Wie viele Bücher sind es? Was braucht das Wort dann am Ende?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das passende Bild." }
                audio: { en: "Four strawberries." }
                options:
                  - { object: strawberry, count: 2, layout: row }
                  - { object: strawberry, count: 1, layout: row }
                  - { object: strawberry, count: 4, layout: row }
                answer: "4"
              - id: l1-n2
                type: multiple_choice
                text: "three _"
                say: { de: "Was passt in die Lücke? Drei Bäume.", en: "Three …" }
                show: { object: tree, count: 3, layout: row }
                options: ["a tree", "tree", "trees"]
                answer: "trees"
                option_audio: false
              - id: l1-n3
                type: audio_choice
                say: { de: "Hör zu. Ist es eins oder sind es mehrere?" }
                audio: { en: "Bees." }
                options:
                  - { object: bee, count: 1, layout: row }
                  - { object: bee, count: 5, layout: row }
                answer: "5"
              - id: l1-n4
                type: speak
                say: { de: "Wie viele Autos sind es? Sag es auf Englisch." }
                show: { object: car, count: 2, layout: row }
                expected_text: two cars
              - id: l1-n5
                type: true_false
                text: "„two kite“"
                say: { de: "Ist das richtig auf Englisch? Zwei Drachen:", en: "two kite" }
                show: { object: kite, count: 2, layout: row }
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "Five apples." }
            options:
              - { object: apple, count: 5, layout: row }
              - { object: apple, count: 3, layout: row }
              - { object: apple, count: 1, layout: row }
            answer: "5"
          - id: l1-c2
            type: multiple_choice
            text: "four _"
            say: { de: "Was passt in die Lücke? Vier Schuhe.", en: "Four …" }
            show: { object: shoe, count: 4, layout: row }
            options: ["shoe", "a shoe", "shoes"]
            answer: "shoes"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "„three cats“"
            say: { de: "Ist das richtig auf Englisch? Drei Katzen:", en: "three cats" }
            show: { object: cat, count: 3, layout: row }
            answer: true

  - n: 2
    title: { de: "a, an, the", en: "a, an, the" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "two _"
            say: { de: "Was passt in die Lücke? Zwei Vögel.", en: "Two …" }
            show: { object: bird, count: 2, layout: row }
            options: ["birds", "bird", "a bird"]
            answer: "birds"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            say: { de: "Hör zu. Ist es eins oder sind es mehrere?" }
            audio: { en: "Dogs." }
            options:
              - { object: dog, count: 1, layout: row }
              - { object: dog, count: 3, layout: row }
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "a dog · an apple"
            say: { de: "Für ein oder eine sagst du „a“. Klingt das Wort am Anfang wie a, e, i, o oder u, sagst du „an“.", en: "A dog. An apple." }
            show: { objects: [dog, apple] }
          - text: "an elephant · an octopus"
            say: { en: "An elephant. An octopus." }
            show: { objects: [elephant, octopus] }
          - text: "der Hund · die Katze · das Ei → the"
            say: { de: "Und für der, die und das gibt es im Englischen nur ein Wort:", en: "The dog. The cat. The egg." }
            show: { objects: [dog, cat, egg] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "_ orange"
                say: { de: "Welches Wort passt? Eine Orange.", en: "… orange" }
                show: { object: orange }
                options: ["an", "a"]
                answer: "an"
                option_audio: false
                feedback:
                  "a": "„Orange“ klingt am Anfang wie o. Davor sagst du „an“: an orange."
                hints:
                  - "Sprich „orange“ leise vor dich hin. Wie klingt es am Anfang?"
                  - "Klingt das Wort am Anfang wie a, e, i, o oder u, sagst du „an“."
                  - "an orange."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "_ cat"
                say: { de: "Welches Wort passt? Eine Katze.", en: "… cat" }
                show: { object: cat }
                options: ["an", "a"]
                answer: "a"
                option_audio: false
                hints:
                  - "Sprich „cat“ leise vor dich hin. Wie klingt es am Anfang?"
                  - "„Cat“ klingt am Anfang wie k, nicht wie a, e, i, o oder u."
                  - "a cat."
              - id: l2-f3
                type: true_false
                text: "„the“ heißt der, die und das."
                say: "Stimmt das? Das englische Wort „the“ steht für der, die und das."
                answer: true
                hints:
                  - "Denk an: the dog, the cat, the egg."
                  - "Ändert sich „the“?"
                  - "Ja, „the“ ist immer gleich."
              - id: l2-f4
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "An ant." }
                options: [{ object: ant }, { object: apple }, { object: egg }]
                answer: ant
                hints:
                  - "Hör auf das Wort nach „an“."
                  - "„Ant“ ist die Ameise."
                  - "Tippe auf die Ameise."
              - id: l2-f5
                type: speak
                say: { de: "Sag es auf Englisch.", en: "An egg." }
                show: { object: egg }
                expected_text: an egg
                hints:
                  - "Hör noch einmal zu: an egg."
                  - "„Egg“ klingt am Anfang wie e, also „an“."
                  - "Sag mit mir: an egg."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "_ elephant"
                say: { de: "Welches Wort passt? Ein Elefant.", en: "… elephant" }
                show: { object: elephant }
                options: ["a", "an"]
                answer: "an"
                option_audio: false
                hints: ["Wie klingt „elephant“ am Anfang?"]
              - id: l2-s2
                type: multiple_choice
                text: "_ ball"
                say: { de: "Welches Wort passt? Ein Ball.", en: "… ball" }
                show: { object: ball }
                options: ["an", "a"]
                answer: "a"
                option_audio: false
                hints: ["Wie klingt „ball“ am Anfang?"]
              - id: l2-s3
                type: multiple_choice
                text: "die Sonne · der Mond · das Haus"
                say: "Die Sonne, der Mond, das Haus. Was ist richtig auf Englisch?"
                options: ["the sun · the moon · the house", "the sun · der moon · das house", "a sun · an moon · the house"]
                answer: "the sun · the moon · the house"
                option_audio: false
                hints: ["Denk an: the dog, the cat, the egg."]
              - id: l2-s4
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "An octopus." }
                options: [{ object: fish }, { object: octopus }, { object: crocodile }]
                answer: octopus
                hints: ["Hör auf das Wort nach „an“."]
              - id: l2-s5
                type: speak
                say: { de: "Sag es auf Englisch.", en: "An orange." }
                show: { object: orange }
                expected_text: an orange
                hints: ["Hör auf den Anfang von „orange“: „a“ oder „an“?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "_ ice cream"
                say: { de: "Welches Wort passt? Ein Eis.", en: "… ice cream" }
                show: { object: ice-cream }
                options: ["a", "an"]
                answer: "an"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "_ frog"
                say: { de: "Welches Wort passt? Ein Frosch.", en: "… frog" }
                show: { object: frog }
                options: ["an", "a"]
                answer: "a"
                option_audio: false
              - id: l2-n3
                type: true_false
                text: "„the“ ändert sich wie der, die, das."
                say: "Stimmt das? Das englische Wort „the“ ändert sich wie der, die und das."
                answer: false
              - id: l2-n4
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "An elephant." }
                options: [{ object: giraffe }, { object: lion }, { object: elephant }]
                answer: elephant
              - id: l2-n5
                type: speak
                say: { de: "Was ist das? Sag es auf Englisch, mit „a“ oder „an“." }
                show: { object: apple }
                expected_text: an apple

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "_ egg"
            say: { de: "Welcher Begleiter passt? Ein Ei.", en: "… egg" }
            show: { object: egg }
            options: ["a", "an"]
            answer: "an"
            option_audio: false
          - id: l2-c2
            type: multiple_choice
            text: "_ rabbit"
            say: { de: "Welcher Begleiter passt? Ein Hase.", en: "… rabbit" }
            show: { object: rabbit }
            options: ["an", "a"]
            answer: "a"
            option_audio: false
          - id: l2-c3
            type: audio_choice
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "Two cars." }
            options:
              - { object: car, count: 1, layout: row }
              - { object: car, count: 2, layout: row }
              - { object: car, count: 3, layout: row }
            answer: "2"
          - id: l2-c4
            type: multiple_choice
            text: "three _"
            say: { de: "Was passt in die Lücke? Drei Hüte.", en: "Three …" }
            show: { object: hat, count: 3, layout: row }
            options: ["hat", "hats", "a hat"]
            answer: "hats"
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "der Bus · die Ente"
            say: "Wie heißen der Bus und die Ente auf Englisch?"
            options: ["the bus · the duck", "der bus · die duck", "a bus · an duck"]
            answer: "the bus · the duck"
            option_audio: false
