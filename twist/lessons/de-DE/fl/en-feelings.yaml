# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-feelings
skill: fl.themes.feelings
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Gefühle auf Englisch
  en: Feelings in English
summary: >
  Saying how you feel and asking others. Lesson 1 brings happy, sad,
  angry, tired and scared with "I'm …"; lesson 2 asks "Are you …?" with
  the short answers "Yes, I am." and "No, I'm not.", and ends with the
  skill check. Instructions are in German; the English is spoken and
  shown in short form.
metadata:
  year: lernjahr-1
  topic: { de: Gefühle, en: Feelings }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.grammar.chunks, fl.speaking.greet]
  also_practises: [fl.grammar.chunks, fl.grammar.questions]
  vocabulary: { en: [happy, sad, angry, tired, scared, "I'm …", "Are you …?", "Yes, I am.", "No, I'm not."] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: i-have-feeling
      what: Says "I have tired" after the German "ich habe Angst" or with the wrong verb
      addressed: lesson 1 Learn uses "I'm" for every feeling; a "Wie sagst du" task in every stage of lesson 1 offers "I have …", with feedback in l1-f3
    - id: short-answer
      what: Answers "Are you …?" with "Yes, I do." or "Yes, I'm."
      addressed: lesson 2 Learn models "Yes, I am." and "No, I'm not."; a short-answer task in every stage of lesson 2 offers "Yes, I do." or "Yes, I'm.", with feedback in l2-f1 and l2-s1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "I'm happy.", en: "I'm happy." }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ich bin neun."
            say: "Wie sagst du auf Englisch: Ich bin neun?"
            options: ["I'm nine.", "I have nine.", "I can nine."]
            answer: "I'm nine."
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie geht es dir?"
            say: "Wie fragst du auf Englisch: Wie geht es dir?"
            options: ["How are you?", "How old are you?", "Who are you?"]
            answer: "How are you?"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "So sagst du, wie du dich fühlst. Hör zu und sprich nach.", en: "I'm happy." }
            show: { object: happy }
          - say: { en: "I'm sad." }
            show: { object: sad }
          - say: { en: "I'm angry." }
            show: { object: angry }
          - say: { en: "I'm tired." }
            show: { object: tired }
          - say: { de: "Und wenn du Angst hast, sagst du:", en: "I'm scared." }
            show: { object: scared }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm tired." }
                options: [{ object: tired }, { object: sad }, { object: happy }]
                answer: tired
                hints:
                  - "Hör noch einmal: tired."
                  - "„Tired“ heißt müde."
                  - "Tippe auf das gähnende Kind."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm angry." }
                options: [{ object: happy }, { object: scared }, { object: angry }]
                answer: angry
                hints:
                  - "Hör noch einmal: angry."
                  - "„Angry“ heißt wütend."
                  - "Tippe auf das wütende Kind."
              - id: l1-f3
                type: multiple_choice
                text: "Ich habe Angst."
                say: "Wie sagst du auf Englisch: Ich habe Angst?"
                options: ["I'm scared.", "I have scared.", "I scared."]
                answer: "I'm scared."
                option_audio: false
                feedback:
                  "I have scared.": "Auf Englisch sagst du hier „I'm“, also ich bin: I'm scared."
                hints:
                  - "Auf Englisch sagst du nicht „habe“, sondern „bin“."
                  - "„I'm“ heißt ich bin."
                  - "I'm scared."
              - id: l1-f4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "I'm happy." }
                show: { object: happy }
                expected_text: "I'm happy."
                hints:
                  - "Hör noch einmal zu: I'm happy."
                  - "Zuerst „I'm“, dann „happy“."
                  - "Sag mit mir: I'm happy."
              - id: l1-f5
                type: true_false
                say: { de: "Hör zu. Passt der Satz zum Bild?", en: "I'm sad." }
                show: { object: sad }
                answer: true
                hints:
                  - "Hör noch einmal: sad."
                  - "„Sad“ heißt traurig."
                  - "Ja, das passt."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm scared." }
                options: [{ object: tired }, { object: scared }, { object: angry }]
                answer: scared
                hints: ["„Scared“ heißt: Angst haben."]
              - id: l1-s2
                type: audio_choice
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm happy." }
                options: [{ object: sad }, { object: angry }, { object: happy }]
                answer: happy
                hints: ["„Happy“ heißt fröhlich."]
              - id: l1-s3
                type: multiple_choice
                text: "Ich bin müde."
                say: "Wie sagst du auf Englisch: Ich bin müde?"
                options: ["I have tired.", "I'm tired.", "I tired."]
                answer: "I'm tired."
                option_audio: false
                hints: ["Mit welchem Wort fängt der Satz an?"]
              - id: l1-s4
                type: speak
                say: { de: "Sag es auf Englisch.", en: "I'm angry." }
                show: { object: angry }
                expected_text: "I'm angry."
                hints: ["Zuerst „I'm“."]
              - id: l1-s5
                type: true_false
                say: { de: "Hör zu. Passt der Satz zum Bild?", en: "I'm happy." }
                show: { object: tired }
                answer: false
                hints: ["Wie sieht das Kind aus?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm sad." }
                options: [{ object: happy }, { object: sad }, { object: scared }]
                answer: sad
              - id: l1-n2
                type: audio_choice
                say: { de: "Hör zu. Wie fühlt sich das Kind?" }
                audio: { en: "I'm angry." }
                options: [{ object: angry }, { object: tired }, { object: sad }]
                answer: angry
              - id: l1-n3
                type: multiple_choice
                text: "Ich bin traurig."
                say: "Wie sagst du auf Englisch: Ich bin traurig?"
                options: ["I sad.", "I have sad.", "I'm sad."]
                answer: "I'm sad."
                option_audio: false
              - id: l1-n4
                type: speak
                say: { de: "Wie fühlt sich das Kind? Sag es auf Englisch mit „I'm“." }
                show: { object: scared }
                expected_text: "I'm scared."
              - id: l1-n5
                type: true_false
                say: { de: "Hör zu. Passt der Satz zum Bild?", en: "I'm tired." }
                show: { object: tired }
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Welches Bild passt?" }
            audio: { en: "I'm scared." }
            options: [{ object: happy }, { object: scared }, { object: tired }]
            answer: scared
          - id: l1-c2
            type: multiple_choice
            text: "Ich bin fröhlich."
            say: "Wie sagst du auf Englisch: Ich bin fröhlich?"
            options: ["I'm happy.", "I have happy.", "I'm sad."]
            answer: "I'm happy."
            option_audio: false
          - id: l1-c3
            type: true_false
            say: { de: "Hör zu. Passt der Satz zum Bild?", en: "I'm angry." }
            show: { object: sad }
            answer: false

  - n: 2
    title: { de: "Are you tired?", en: "Are you tired?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Wie fühlt sich das Kind?" }
            audio: { en: "I'm happy." }
            options: [{ object: happy }, { object: angry }, { object: scared }]
            answer: happy
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ich bin wütend."
            say: "Wie sagst du auf Englisch: Ich bin wütend?"
            options: ["I'm angry.", "I'm tired.", "I have angry."]
            answer: "I'm angry."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Are you happy? Yes, I am."
            say: { de: "So fragst du, wie sich jemand fühlt, und so antwortest du mit Ja:", en: "Are you happy? Yes, I am." }
            show: { object: happy }
          - text: "Are you sad? No, I'm not."
            say: { de: "Und so antwortest du mit Nein:", en: "Are you sad? No, I'm not." }
            show: { object: happy }
          - text: "Are you …? → Yes, I am. / No, I'm not."
            say: { de: "Die Frage beginnt mit „Are you“. In der Antwort sagst du „I am“ oder „I'm not“." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "„Are you tired?“ Du bist müde."
                say: { de: "Du bist müde. Was antwortest du auf diese Frage?", en: "Are you tired?" }
                show: { object: tired }
                options: ["Yes, I am.", "Yes, I do.", "No, I'm not."]
                answer: "Yes, I am."
                option_audio: false
                feedback:
                  "Yes, I do.": "Die Frage beginnt mit „Are you“. Dann antwortest du mit „I am“: Yes, I am."
                hints:
                  - "Du bist müde, also „Yes“."
                  - "Die Antwort hat „am“."
                  - "Yes, I am."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { de: "Hör zu. Was fragt das Kind?" }
                audio: { en: "Are you scared?" }
                options: ["Hast du Angst?", "Bist du müde?", "Bist du traurig?"]
                answer: "Hast du Angst?"
                option_audio: false
                hints:
                  - "Hör auf das letzte Wort."
                  - "„Scared“ heißt Angst haben."
                  - "Hast du Angst?"
              - id: l2-f3
                type: ordering
                text: "Bau die Frage: Bist du fröhlich?"
                say: "Bau die Frage auf Englisch: Bist du fröhlich?"
                options: ["happy?", "Are", "you"]
                slot_count: 3
                answer: ["Are", "you", "happy?"]
                option_audio: false
                hints:
                  - "Die Frage beginnt mit „Are“."
                  - "Dann kommt „you“."
                  - "Are you happy?"
              - id: l2-f4
                type: multiple_choice
                text: "„Are you angry?“ Du bist nicht wütend."
                say: { de: "Du bist nicht wütend. Was antwortest du auf diese Frage?", en: "Are you angry?" }
                show: { object: happy }
                options: ["No, I'm not.", "Yes, I am.", "No, I don't."]
                answer: "No, I'm not."
                option_audio: false
                hints:
                  - "Du bist nicht wütend, also „No“."
                  - "Nach „No“ kommt „I'm not“."
                  - "No, I'm not."
              - id: l2-f5
                type: speak
                say: { de: "Frag auf Englisch: Bist du müde?", en: "Are you tired?" }
                show: { object: tired }
                expected_text: "Are you tired?"
                hints:
                  - "Hör noch einmal zu und sprich mit."
                  - "Zuerst „Are you“, dann „tired“."
                  - "Sag mit mir: Are you tired?"

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "„Are you sad?“ Du bist traurig."
                say: { de: "Du bist traurig. Was antwortest du auf diese Frage?", en: "Are you sad?" }
                show: { object: sad }
                options: ["Yes, I'm.", "Yes, I am.", "No, I'm not."]
                answer: "Yes, I am."
                option_audio: false
                feedback:
                  "Yes, I'm.": "Am Ende der kurzen Antwort sagst du „I am“, nicht „I'm“: Yes, I am."
                hints: ["Ja oder Nein? Dann schau dir das Ende der Antworten genau an."]
              - id: l2-s2
                type: audio_choice
                say: { de: "Hör zu. Was fragt das Kind?" }
                audio: { en: "Are you happy?" }
                options: ["Bist du wütend?", "Bist du fröhlich?", "Hast du Angst?"]
                answer: "Bist du fröhlich?"
                option_audio: false
                hints: ["Hör auf das letzte Wort."]
              - id: l2-s3
                type: ordering
                text: "Bau die Frage: Bist du traurig?"
                say: "Bau die Frage auf Englisch: Bist du traurig?"
                options: ["you", "sad?", "Are"]
                slot_count: 3
                answer: ["Are", "you", "sad?"]
                option_audio: false
                hints: ["Mit welchem Wort fängt die Frage an?"]
              - id: l2-s4
                type: multiple_choice
                text: "„Are you scared?“ Du hast keine Angst."
                say: { de: "Du hast keine Angst. Was antwortest du auf diese Frage?", en: "Are you scared?" }
                show: { object: happy }
                options: ["Yes, I am.", "No, I'm not.", "No, I can't."]
                answer: "No, I'm not."
                option_audio: false
                hints: ["Ja oder Nein?"]
              - id: l2-s5
                type: speak
                say: { de: "Frag auf Englisch: Bist du wütend?", en: "Are you angry?" }
                show: { object: angry }
                expected_text: "Are you angry?"
                hints: ["Die Frage beginnt mit „Are you“."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "„Are you happy?“ Du bist fröhlich."
                say: { de: "Du bist fröhlich. Was antwortest du auf diese Frage?", en: "Are you happy?" }
                show: { object: happy }
                options: ["Yes, I do.", "No, I'm not.", "Yes, I am."]
                answer: "Yes, I am."
                option_audio: false
              - id: l2-n2
                type: audio_choice
                say: { de: "Hör zu. Was fragt das Kind?" }
                audio: { en: "Are you angry?" }
                options: ["Bist du wütend?", "Bist du müde?", "Bist du traurig?"]
                answer: "Bist du wütend?"
                option_audio: false
              - id: l2-n3
                type: ordering
                text: "Bau die Frage: Hast du Angst?"
                say: "Bau die Frage auf Englisch: Hast du Angst?"
                options: ["scared?", "you", "Are"]
                slot_count: 3
                answer: ["Are", "you", "scared?"]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "„Are you tired?“ Du bist nicht müde."
                say: { de: "Du bist nicht müde. Was antwortest du auf diese Frage?", en: "Are you tired?" }
                show: { object: happy }
                options: ["No, I'm not.", "No, I don't.", "Yes, I am."]
                answer: "No, I'm not."
                option_audio: false
              - id: l2-n5
                type: speak
                say: { de: "Frag ein anderes Kind auf Englisch, ob es traurig ist." }
                show: { object: sad }
                expected_text: "Are you sad?"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Wie fühlt sich das Kind?" }
            audio: { en: "Are you happy? No, I'm not. I'm tired." }
            options: [{ object: happy }, { object: tired }, { object: angry }]
            answer: tired
          - id: l2-c2
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Kind an. Was sagt es auf Englisch?"
            show: { object: scared }
            options: ["I have scared.", "I'm happy.", "I'm scared."]
            answer: "I'm scared."
            option_audio: false
          - id: l2-c3
            type: multiple_choice
            text: "„Are you sad?“ Du bist nicht traurig."
            say: { de: "Du bist nicht traurig. Was antwortest du?", en: "Are you sad?" }
            show: { object: happy }
            options: ["No, I'm not.", "Yes, I am.", "No, I am."]
            answer: "No, I'm not."
            option_audio: false
          - id: l2-c4
            type: audio_choice
            say: { de: "Hör zu. Was fragt das Kind?" }
            audio: { en: "Are you tired?" }
            options: ["Bist du fröhlich?", "Bist du müde?", "Hast du Angst?"]
            answer: "Bist du müde?"
            option_audio: false
          - id: l2-c5
            type: ordering
            text: "Bau die Frage: Bist du wütend?"
            say: "Wie fragst du auf Englisch, ob jemand wütend ist? Bau die Frage."
            options: ["angry?", "Are", "you"]
            slot_count: 3
            answer: ["Are", "you", "angry?"]
            option_audio: false
