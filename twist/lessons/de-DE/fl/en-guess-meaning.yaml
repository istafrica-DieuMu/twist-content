# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-guess-meaning
skill: fl.culture-strategies.guess-meaning
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Neue Wörter erraten
  en: Guessing new words
summary: >
  Working out what an unknown English word means instead of giving up.
  Lesson 1 brings two tricks: look at the picture (hedgehog, snail,
  octopus) and listen for a German word that sounds alike (garden,
  summer, milk), with a warning that a word can sound alike and still mean
  something else (butterfly). Lesson 2 adds two more: the words you know
  in the sentence (thirsty next to water) and what the speaker does (a
  wave, a finger on the lips), and ends with the skill check. The English
  is spoken; questions and answers are in German.
metadata:
  year: lernjahr-1
  topic: { de: Lernstrategien, en: Learning strategies }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.listening.short-dialogues]
  also_practises: [fl.culture-strategies.compare-languages, fl.listening.classroom-phrases]
  vocabulary: { en: [hedgehog, snail, octopus, shell, garden, summer, water, milk, thirsty, sleepy, umbrella, delicious, huge, windy, "See you tomorrow!", "Well done!"] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: gives-up
      what: Stops listening or answering as soon as one word is unknown
      addressed: lesson 1 Learn says an unknown word can often be guessed; l2-s4, l2-n5 and the skill check ask which way of working helps and offer giving up as a wrong option
    - id: sound-alike-trap
      what: Trusts a word that only partly sounds like a German one, even when the picture or sentence says otherwise (butterfly as Butterbrot, snail as Schneemann, zip as Zipfel)
      addressed: l1-f1, l1-s5 and l1-n4 set a sound-alike distractor next to the picture, with feedback to look at the picture first; the skill check repeats it with zip
    - id: ignores-context
      what: Guesses from the unknown word alone and ignores the known words around it
      addressed: lesson 2 Learn works out thirsty from water; l2-f1, l2-f2, l2-f6, l2-s1, l2-s3 and l2-n5 name the known word in a hint or option (bed, raining, water, snowing, dog, giraffe)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Bilder und ähnliche Wörter, en: Pictures and words that sound alike }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Worum geht es?" }
            audio: { en: "I'm hungry. Can I have an apple, please?" }
            options: ["ums Essen", "um Tiere", "um Farben"]
            answer: "ums Essen"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Welches Tier hat das Kind?" }
            audio: { en: "Have you got a pet? Yes, I've got a dog." }
            options: [{ object: dog }, { object: cat }, { object: rabbit }]
            answer: dog
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: { de: "Manchmal hörst du ein Wort, das du noch nicht kennst. Das ist nicht schlimm. Oft kannst du es erraten. Erster Trick: Schau dir das Bild an.", en: "Look! A hedgehog!" }
            show: { object: hedgehog }
          - text: "hedgehog = Igel"
            say: { de: "Auf dem Bild ist ein Igel. Also heißt „hedgehog“ Igel." }
            show: { object: hedgehog }
          - text: "house, Haus\ngarden, Garten"
            say: { de: "Zweiter Trick: Viele englische Wörter klingen fast wie deutsche. „House“ klingt wie Haus, „garden“ klingt wie Garten. Aber Vorsicht: Nicht jedes Wort, das ähnlich klingt, bedeutet das Gleiche. Wenn es ein Bild gibt, schau zuerst aufs Bild.", en: "House. Garden." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was heißt „snail“?"
                say: { de: "Hör zu und schau auf das Bild. Was heißt „snail“?", en: "Look! A snail!" }
                show: { object: snail }
                options: ["eine Schnecke", "ein Schneemann", "ein Schaf"]
                answer: "eine Schnecke"
                feedback:
                  "ein Schneemann": "„Snail“ und Schnee fangen ähnlich an. Schau aber aufs Bild: Da ist eine Schnecke."
                hints:
                  - "Schau dir das Bild genau an."
                  - "Das Tier hat ein Haus auf dem Rücken."
                  - "Auf dem Bild ist eine Schnecke."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was heißt „garden“?"
                say: { de: "Hör genau hin. Welches deutsche Wort klingt ähnlich?", en: "Garden." }
                options: ["der Garten", "die Garage", "die Gurke"]
                answer: "der Garten"
                hints:
                  - "Sprich das Wort leise nach."
                  - "„Garden“, Garten. Hörst du es?"
                  - "„Garden“ heißt Garten."
              - id: l1-f3
                type: multiple_choice
                text: "Was heißt „octopus“?"
                say: { de: "Hör zu und schau auf das Bild. Was heißt „octopus“?", en: "An octopus." }
                show: { object: octopus }
                options: ["ein Krake", "ein Fisch", "ein Frosch"]
                answer: "ein Krake"
                feedback:
                  "ein Fisch": "Ein Krake lebt auch im Meer. Zähl mal seine Arme. Ein Fisch hat keine Arme."
                hints:
                  - "Schau dir das Bild genau an."
                  - "Das Tier hat acht lange Arme."
                  - "Es ist ein Krake."
              - id: l1-f4
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Diese Wörter klingen fast wie deutsche Wörter. Tippe auf ein englisches Wort, hör zu und verbinde es mit dem deutschen." }
                pairs:
                  - { left: { text: "water", say: { en: "Water." } }, right: { text: "das Wasser" } }
                  - { left: { text: "hand", say: { en: "Hand." } }, right: { text: "die Hand" } }
                  - { left: { text: "milk", say: { en: "Milk." } }, right: { text: "die Milch" } }
                  - { left: { text: "book", say: { en: "Book." } }, right: { text: "das Buch" } }
                hints:
                  - "Fang mit dem Wort an, das genau gleich aussieht."
                  - "Hand ist Hand. „Water“ klingt wie Wasser."
                  - "„Milk“ passt zu Milch, „book“ passt zu Buch."
              - id: l1-f5
                type: true_false
                text: "Heißt „anchor“ Anker?"
                say: { de: "Hör zu und schau auf das Bild. Heißt „anchor“ Anker?", en: "An anchor." }
                show: { object: anchor }
                answer: true
                hints:
                  - "Schau aufs Bild und hör auf das Wort."
                  - "Das Bild zeigt einen Anker. „Anchor“ klingt fast wie Anker."
                  - "Ja, „anchor“ heißt Anker."
              - id: l1-f6
                type: multiple_choice
                text: "Ben hört „hedgehog“ und weiß sofort: Igel. Was hat ihm geholfen?"
                say: { de: "Ben hört „hedgehog“ und sieht dieses Bild. Er weiß sofort: Das ist ein Igel. Was hat ihm geholfen?" }
                show: { object: hedgehog }
                options: ["das Bild", "Das Wort klingt wie Igel.", "Er hat einfach geraten."]
                answer: "das Bild"
                feedback:
                  "Das Wort klingt wie Igel.": "„Hedgehog“ klingt gar nicht wie Igel. Das Bild hat Ben geholfen."
                hints:
                  - "Sag „hedgehog“ und Igel nacheinander. Klingen sie gleich?"
                  - "Nein. Was hat Ben noch gesehen?"
                  - "Das Bild hat ihm geholfen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was heißt „shell“?"
                say: { de: "Hör zu und schau auf das Bild. Was heißt „shell“?", en: "A shell." }
                show: { object: shell }
                options: ["eine Muschel", "ein Schal", "ein Schild"]
                answer: "eine Muschel"
                hints: ["Schau aufs Bild. Was findest du am Strand?"]
              - id: l1-s2
                type: multiple_choice
                text: "Was heißt „summer“?"
                say: { de: "Hör genau hin. Was heißt „summer“?", en: "Summer." }
                options: ["der Sommer", "die Sonne", "die Suppe"]
                answer: "der Sommer"
                feedback:
                  "die Sonne": "Die Sonne heißt „sun“. „Summer“ klingt wie Sommer."
                hints: ["Sprich „summer“ leise nach. Welches deutsche Wort klingt fast gleich?"]
              - id: l1-s3
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Tippe auf ein englisches Wort, hör zu und verbinde es mit dem deutschen." }
                pairs:
                  - { left: { text: "winter", say: { en: "Winter." } }, right: { text: "der Winter" } }
                  - { left: { text: "bed", say: { en: "Bed." } }, right: { text: "das Bett" } }
                  - { left: { text: "nose", say: { en: "Nose." } }, right: { text: "die Nase" } }
                  - { left: { text: "finger", say: { en: "Finger." } }, right: { text: "der Finger" } }
                hints: ["Hör dir jedes Wort an und sprich es nach. Welches deutsche Wort klingt fast gleich?"]
              - id: l1-s4
                type: true_false
                text: "Heißt „spider“ Spinne?"
                say: { de: "Hör zu und schau auf das Bild. Heißt „spider“ Spinne?", en: "Look! A spider in its web." }
                show: { object: web }
                answer: true
                hints: ["Schau, wer in der Mitte vom Netz sitzt."]
              - id: l1-s5
                type: multiple_choice
                text: "Was heißt „rubber“?"
                say: { de: "Hör zu und schau auf das Bild. Was heißt „rubber“?", en: "A rubber." }
                show: { object: rubber }
                options: ["ein Radiergummi", "ein Gummibärchen", "ein Rabe"]
                answer: "ein Radiergummi"
                feedback:
                  "ein Gummibärchen": "„Rubber“ klingt ein bisschen nach Gummi. Das Bild zeigt aber einen Radiergummi."
                hints: ["Schau zuerst aufs Bild."]
              - id: l1-s6
                type: multiple_choice
                text: "Was heißt „brother“?"
                say: { de: "Hör genau hin. Was heißt „brother“?", en: "Brother." }
                options: ["der Bruder", "das Brot", "die Butter"]
                answer: "der Bruder"
                feedback:
                  "das Brot": "Brot heißt „bread“. „Brother“ klingt wie Bruder."
                hints: ["Denk an die Familie."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was heißt „crocodile“?"
                say: { de: "Hör zu und schau auf das Bild. Was heißt „crocodile“?", en: "A crocodile." }
                show: { object: crocodile }
                options: ["ein Krokodil", "eine Kuh", "eine Krone"]
                answer: "ein Krokodil"
              - id: l1-n2
                type: multiple_choice
                text: "Was heißt „hair“?"
                say: { de: "Hör genau hin. Was heißt „hair“?", en: "Hair." }
                options: ["das Haar", "der Hase", "die Hose"]
                answer: "das Haar"
              - id: l1-n3
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Tippe auf ein englisches Wort, hör zu und verbinde es mit dem deutschen." }
                pairs:
                  - { left: { text: "glass", say: { en: "Glass." } }, right: { text: "das Glas" } }
                  - { left: { text: "cold", say: { en: "Cold." } }, right: { text: "kalt" } }
                  - { left: { text: "fish", say: { en: "Fish." } }, right: { text: "der Fisch" } }
                  - { left: { text: "drink", say: { en: "Drink." } }, right: { text: "trinken" } }
              - id: l1-n4
                type: multiple_choice
                text: "Was heißt „butterfly“?"
                say: { de: "Hör zu und schau auf das Bild. Was heißt „butterfly“?", en: "A butterfly." }
                show: { object: butterfly }
                options: ["ein Schmetterling", "ein Butterbrot", "eine Fliege"]
                answer: "ein Schmetterling"
                feedback:
                  "ein Butterbrot": "„Butterfly“ klingt nach Butter. Das Bild zeigt aber einen Schmetterling. Schau zuerst aufs Bild."
              - id: l1-n5
                type: multiple_choice
                text: "Was heißt „swim“?"
                say: { de: "Hör genau hin. Was heißt „swim“?", en: "Swim." }
                options: ["schwimmen", "singen", "springen"]
                answer: "schwimmen"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was heißt „mirror“?"
            say: { de: "Hör zu und schau auf das Bild. Was heißt „mirror“?", en: "A mirror." }
            show: { object: mirror }
            options: ["ein Spiegel", "eine Mauer", "eine Mütze"]
            answer: "ein Spiegel"
          - id: l1-c2
            type: multiple_choice
            text: "Was heißt „storm“?"
            say: { de: "Hör genau hin. Was heißt „storm“?", en: "Storm." }
            options: ["der Sturm", "der Stuhl", "der Stern"]
            answer: "der Sturm"
          - id: l1-c3
            type: true_false
            text: "Heißt „ladder“ Lampe?"
            say: { de: "Hör zu und schau auf das Bild. Heißt „ladder“ Lampe?", en: "A ladder." }
            show: { object: ladder }
            answer: false

  - n: 2
    title: { de: Der Satz und die Hände helfen, en: The sentence and gestures help }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was heißt „saw“?"
            say: { de: "Hör zu und schau auf das Bild. Was heißt „saw“?", en: "A saw." }
            show: { object: saw }
            options: ["eine Säge", "ein Sack", "die Sahne"]
            answer: "eine Säge"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was heißt „bring“?"
            say: { de: "Hör genau hin. Was heißt „bring“?", en: "Bring." }
            options: ["bringen", "binden", "brennen"]
            answer: "bringen"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "thirsty"
            say: { de: "Dritter Trick: Die anderen Wörter im Satz helfen dir. Hör zu. Ein Wort kennst du nicht.", en: "I'm thirsty. Can I have some water, please?" }
          - text: "thirsty = durstig"
            say: { de: "„Thirsty“ kennst du noch nicht. Aber „water“ kennst du: Wasser. Wer Wasser möchte, hat Durst. Also heißt „thirsty“ durstig." }
          - text: "Be quiet!"
            say: { de: "Vierter Trick: Schau, was die Person macht. Das Kind legt den Finger auf den Mund und sagt:", en: "Shh! Be quiet, please." }
            show: { object: quiet }
          - text: "Be quiet! = Sei leise!"
            say: { de: "Der Finger auf dem Mund heißt: leise sein. Also heißt „be quiet“: Sei leise." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was heißt „sleepy“?"
                say: { de: "Hör zu. Was heißt „sleepy“?", en: "I'm sleepy. I want to go to bed." }
                options: ["müde", "hungrig", "lustig"]
                answer: "müde"
                hints:
                  - "Welches Wort im Satz kennst du?"
                  - "„Bed“ ist das Bett."
                  - "Wer ins Bett will, ist müde."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was heißt „umbrella“?"
                say: { de: "Hör zu. Was heißt „umbrella“?", en: "It's raining. Take your umbrella!" }
                options: ["der Regenschirm", "die Sonnenbrille", "die Badehose"]
                answer: "der Regenschirm"
                feedback:
                  "die Sonnenbrille": "Hör auf den Anfang: „It's raining“. Bei Regen brauchst du keine Sonnenbrille."
                hints:
                  - "Wie ist das Wetter?"
                  - "„It's raining“ heißt: Es regnet."
                  - "Bei Regen nimmst du einen Regenschirm mit."
              - id: l2-f3
                type: multiple_choice
                text: "Das Kind winkt. Was heißt „See you tomorrow!“?"
                say: { de: "Schau, was das Kind macht, und hör zu. Was heißt das?", en: "Bye! See you tomorrow!" }
                show: { object: wave }
                options: ["Bis morgen!", "Guten Morgen!", "Komm her!"]
                answer: "Bis morgen!"
                feedback:
                  "Guten Morgen!": "„Tomorrow“ heißt morgen, also am nächsten Tag. Das Kind winkt und sagt „bye“. Es verabschiedet sich."
                hints:
                  - "Was macht das Kind mit der Hand?"
                  - "Es winkt und sagt „bye“. Es verabschiedet sich."
                  - "„See you tomorrow“ heißt: Bis morgen!"
              - id: l2-f4
                type: multiple_choice
                text: "Was heißt „delicious“?"
                say: { de: "Hör zu. Was heißt „delicious“?", en: "Mmm! This cake is delicious!" }
                options: ["lecker", "eklig", "kalt"]
                answer: "lecker"
                feedback:
                  "eklig": "Hör auf den Anfang: „Mmm!“ So klingt es, wenn etwas gut schmeckt."
                hints:
                  - "Hör auf das Geräusch am Anfang."
                  - "„Mmm“ sagt man, wenn etwas gut schmeckt."
                  - "„Delicious“ heißt lecker."
              - id: l2-f5
                type: multiple_choice
                text: "Das Kind zeigt mit dem Finger. Was heißt „Over there!“?"
                say: { de: "Schau, was das Kind macht, und hör zu. Was heißt das?", en: "Look! Over there!" }
                show: { object: point }
                options: ["Da drüben!", "Komm mit!", "Setz dich!"]
                answer: "Da drüben!"
                hints:
                  - "Was macht das Kind mit dem Finger?"
                  - "Es zeigt auf etwas, das weiter weg ist."
                  - "„Over there“ heißt: Da drüben!"
              - id: l2-f6
                type: multiple_choice
                text: "Wie findest du heraus, was „thirsty“ heißt?"
                say: { de: "Du hörst: „I'm thirsty. Can I have some water?“ Wie findest du heraus, was „thirsty“ heißt?" }
                options: ["Ich höre auf das Wort, das ich kenne: water.", "Ich höre nur auf das erste Wort.", "Das geht nicht. Ich kenne das Wort ja nicht."]
                answer: "Ich höre auf das Wort, das ich kenne: water."
                feedback:
                  "Das geht nicht. Ich kenne das Wort ja nicht.": "Doch, das geht. „Water“ kennst du, und wer Wasser möchte, hat Durst."
                hints:
                  - "Gibt es im Satz ein Wort, das du schon kennst?"
                  - "Die anderen Wörter im Satz helfen dir beim Raten."
                  - "„Water“ kennst du. Wer Wasser möchte, hat Durst."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was heißt „I'm freezing“?"
                say: { de: "Hör zu. Was heißt „I'm freezing“?", en: "Brrr! It's snowing. I'm freezing!" }
                options: ["Mir ist eiskalt.", "Mir ist heiß.", "Ich bin froh."]
                answer: "Mir ist eiskalt."
                hints: ["Hör auf „brrr“ und „snowing“."]
              - id: l2-s2
                type: multiple_choice
                text: "Das Kind klatscht. Was heißt „Well done!“?"
                say: { de: "Schau, was das Kind macht, und hör zu. Was heißt das?", en: "Well done! Great job!" }
                show: { object: clap }
                options: ["Gut gemacht!", "Pass auf!", "Leider falsch."]
                answer: "Gut gemacht!"
                hints: ["Wann klatschst du für jemanden?"]
              - id: l2-s3
                type: multiple_choice
                text: "Was heißt „bark“?"
                say: { de: "Hör zu. Was heißt „bark“?", en: "Woof, woof! The dog can bark." }
                options: ["bellen", "schlafen", "fressen"]
                answer: "bellen"
                hints: ["Was macht ein Hund, wenn er „woof, woof“ macht?"]
              - id: l2-s4
                type: multiple_choice
                text: "Du hörst ein Wort, das du nicht kennst. Was ist kein guter Trick?"
                say: { de: "Du hörst ein Wort, das du nicht kennst. Was ist kein guter Trick?" }
                options: ["Ich höre einfach nicht mehr zu.", "Ich schaue mir das Bild an.", "Ich höre auf die Wörter, die ich kenne."]
                answer: "Ich höre einfach nicht mehr zu."
                hints: ["Zwei Sätze sind Tricks aus dieser Lektion."]
              - id: l2-s5
                type: multiple_choice
                text: "Was heißt „sandcastle“?"
                say: { de: "Hör zu. Was heißt „sandcastle“?", en: "We're at the beach. Let's make a sandcastle!" }
                options: ["die Sandburg", "der Sandkasten", "die Sandale"]
                answer: "die Sandburg"
                hints: ["„Sand“ ist Sand. Was baut man am Strand aus Sand?"]
              - id: l2-s6
                type: multiple_choice
                text: "Das Kind hält die Hand ans Ohr. Was heißt „Listen carefully!“?"
                say: { de: "Schau, was das Kind macht, und hör zu. Was heißt das?", en: "Listen carefully!" }
                show: { object: listen }
                options: ["Hört gut zu!", "Schaut her!", "Steht auf!"]
                answer: "Hört gut zu!"
                hints: ["Mit dem Ohr macht man etwas Bestimmtes."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Was heißt „huge“?"
                say: { de: "Hör zu. Was heißt „huge“?", en: "Look at the elephant. It's huge!" }
                options: ["riesig", "winzig", "schnell"]
                answer: "riesig"
              - id: l2-n2
                type: multiple_choice
                text: "Was heißt „windy“?"
                say: { de: "Hör zu. Was heißt „windy“?", en: "It's windy today. Let's fly a kite!" }
                options: ["windig", "sonnig", "nass"]
                answer: "windig"
              - id: l2-n3
                type: multiple_choice
                text: "Das Kind springt. Was heißt „high“?"
                say: { de: "Schau, was das Kind macht, und hör zu. Was heißt „high“?", en: "Jump! Jump as high as you can!" }
                show: { object: jump }
                options: ["hoch", "weit", "leise"]
                answer: "hoch"
              - id: l2-n4
                type: multiple_choice
                text: "Was macht das Baby?"
                say: { de: "Hör zu. Was macht das Baby?", en: "Shh! The baby is tired. She's sleeping in her bed." }
                options: ["Es schläft.", "Es weint.", "Es isst."]
                answer: "Es schläft."
              - id: l2-n5
                type: multiple_choice
                text: "Mia kennt „neck“ nicht. Was hilft ihr am besten?"
                say: { de: "Mia hört: „The giraffe has got a very long neck.“ Sie kennt „neck“ nicht. Was hilft ihr am besten?" }
                options: ["Sie denkt an die Giraffe: Was ist bei ihr so lang?", "Sie hört auf, weil sie ein Wort nicht kennt.", "Sie rät irgendein Wort."]
                answer: "Sie denkt an die Giraffe: Was ist bei ihr so lang?"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Was heißt „zip“?"
