# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-daily-life
skill: fl.culture-strategies.compare-daily-life
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Alltag in England und bei uns
  en: Daily life in England and here
summary: >
  Comparing a child's day in England with a day here, through Amy, who is
  nine and lives in England. Lesson 1 is about school: the school uniform,
  a school day from nine o'clock to half past three, lunch at school
  (school dinner or packed lunch), and starting school at four or five,
  so that Amy is in Year 5. Lesson 2 is about breakfast (cereal, toast,
  the big breakfast at the weekend) and celebrations (Bonfire Night here
  and not St Martin), and ends with the skill check. Every lesson names
  what is the same as well as what differs, and says "many children", not
  "all children".
metadata:
  year: lernjahr-2
  topic: { de: Die Welt der Sprache, en: Where the language is spoken }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.culture-strategies.where-spoken]
  also_practises: [fl.themes.school, fl.themes.food, fl.themes.clothes]
  vocabulary: { en: [school uniform, jumper, trousers, skirt, "School starts at nine o'clock.", lunchtime, packed lunch, school dinner, Year 5, breakfast, cereal, toast, jam, beans, juice, fireworks] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: all-different
      what: Thinks life in England is different in every way and misses what is the same
      addressed: lesson 1 Learn ends with what Amy and the child share; every sorting task has a bin for both countries; l1-s4, l2-n3, l2-n5 and the skill check ask what is the same
    - id: all-children
      what: Turns one child's habit into a rule for everyone ("all English children eat sausages for breakfast")
      addressed: lesson 2 Learn says Amy is one child and to say "many", not "all"; l2-f3, l2-f6, l2-s6 and the skill check offer the "all" or "nobody" sentence as a wrong option, with feedback in l2-f3 and l2-f6
    - id: year-equals-klasse
      what: Takes Year 5 to be Klasse 5
      addressed: lesson 1 Learn explains the earlier school start; l1-f4 gives feedback on Year 4, and l1-n3 asks for a German Klasse 4 child's year
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Ein Schultag in England, en: A school day in England }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Woher kommt Amy?" }
            audio: { en: "Hi! I'm Amy. I'm from Manchester, in England." }
            options: ["aus England", "aus Australien", "aus den USA"]
            answer: "aus England"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie heißt die Hauptstadt von England?"
            say: { de: "Wie heißt die Hauptstadt von England?" }
            options: ["London", "Sydney", "Dublin"]
            answer: "London"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Hi! I'm Amy. I'm nine."
            say: { de: "Amy ist neun Jahre alt und geht in England zur Schule. Hör zu, was sie erzählt.", en: "Hi! I'm Amy. I'm nine. I go to Park Road School." }
            show: { object: girl }
          - text: "school uniform"
            say: { de: "In England tragen die meisten Kinder in der Schule eine Schuluniform: einen Pulli in der Farbe der Schule, ein Hemd oder Poloshirt, dazu eine Hose oder einen Rock. Bei uns ziehen die meisten Kinder an, was sie wollen.", en: "This is my school uniform. My jumper is blue." }
            show: { object: jumper, colour: blue }
          - text: "9 o'clock, half past three"
            say: { de: "Amys Schule fängt um neun Uhr an und ist um halb vier aus. Mittags isst sie in der Schule. Es gibt ein warmes Essen, das „school dinner“, oder sie bringt ein Lunchpaket mit, eine „packed lunch“.", en: "School starts at nine o'clock. At lunchtime I have a packed lunch." }
          - text: "Year 5 = Klasse 4"
            say: { de: "In England kommen Kinder schon mit vier oder fünf Jahren in die Schule. Darum ist Amy mit neun schon in Year 5. Bei uns wäre sie in Klasse 4. Vieles ist aber auch gleich: Amy hat Mathe und Sport, sie spielt in der Pause gern Fußball, und im Sommer hat sie lange Ferien." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Welchen Pulli trägt Amy in der Schule?" }
                audio: { en: "I wear a school uniform. My jumper is red." }
                options: [{ object: jumper, colour: red }, { object: jumper, colour: blue }, { object: t-shirt }]
                answer: red
                hints:
                  - "Hör auf die Farbe am Ende."
                  - "Amy sagt: „My jumper is red.“"
                  - "„Red“ ist rot. Tippe auf den roten Pulli."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Tragen die meisten Kinder in England in der Schule eine Uniform?"
                say: { de: "Tragen die meisten Kinder in England in der Schule eine Uniform?" }
                answer: true
                hints:
                  - "Denk an Amys Pulli."
                  - "Amy sagt: „This is my school uniform.“"
                  - "Ja, die meisten Kinder in England tragen eine Schuluniform."
              - id: l1-f3
                type: audio_choice
                say: { de: "Hör zu. Wann fängt Amys Schule an?" }
                audio: { en: "School starts at nine o'clock." }
                options: ["um 9 Uhr", "um 8 Uhr", "um 10 Uhr"]
                answer: "um 9 Uhr"
                hints:
                  - "Hör auf die Zahl vor „o'clock“."
                  - "Amy sagt: „nine o'clock“."
                  - "„Nine“ ist neun. Die Schule fängt um 9 Uhr an."
              - id: l1-f4
                type: multiple_choice
                text: "Amy ist neun. In welchem Schuljahr ist sie in England?"
                say: { de: "Amy ist neun. In welchem Schuljahr ist sie in England?" }
                options: ["Year 5", "Year 4", "Year 3"]
                answer: "Year 5"
                option_audio: false
                feedback:
                  "Year 4": "Bei uns wäre Amy in Klasse 4. In England fängt die Schule früher an, darum ist sie schon in Year 5."
                hints:
                  - "Wann kommen Kinder in England in die Schule?"
                  - "Schon mit vier oder fünf. Also ein Jahr früher als bei uns."
                  - "Amy ist in Year 5."
              - id: l1-f5
                type: sorting
                text: "In England, bei uns oder in beiden Ländern?"
                say: { de: "Sortiere: Gibt es das in England, bei uns oder in beiden Ländern?" }
                bins:
                  - { id: england, show: { text: "in England" } }
                  - { id: here, show: { text: "bei uns" } }
                  - { id: both, show: { text: "in beiden Ländern" } }
                options:
                  - { text: "Schuluniform", bin: england }
                  - { text: "Schule ab 4 oder 5 Jahren", bin: england }
                  - { text: "Schule ab 6 Jahren", bin: here }
                  - { text: "eigene Kleidung in der Schule", bin: here }
                  - { text: "Mathe und Sport", bin: both }
                  - { text: "Fußball in der Pause", bin: both }
                hints:
                  - "Denk an alles, was Amy erzählt hat."
                  - "Uniform und Schule ab 4 oder 5 gibt es in England."
                  - "Mathe, Sport und Fußball in der Pause gibt es in beiden Ländern."
              - id: l1-f6
                type: multiple_choice
                text: "Was ist eine „packed lunch“?"
                say: { de: "Was ist eine „packed lunch“?" }
                options: ["ein Lunchpaket von zu Hause", "ein warmes Essen in der Schule", "ein Picknick im Park"]
                answer: "ein Lunchpaket von zu Hause"
                feedback:
                  "ein warmes Essen in der Schule": "Das warme Essen heißt „school dinner“. Eine „packed lunch“ bringst du von zu Hause mit."
                hints:
                  - "„Lunch“ ist das Mittagessen."
                  - "„Packed“ heißt eingepackt."
                  - "Es ist ein Lunchpaket von zu Hause."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Was trägt Leo zu seinem Pulli?" }
                audio: { en: "I'm Leo. I wear a green jumper and grey trousers." }
                options: [{ object: trousers }, { object: skirt }, { object: dress }]
                answer: trousers
                hints: ["„Trousers“ ist die Hose."]
              - id: l1-s2
                type: true_false
                text: "Ist die Schule in England meistens schon mittags aus?"
                say: { de: "Ist die Schule in England meistens schon mittags aus?" }
                answer: false
                hints: ["Amys Schule ist um halb vier aus."]
              - id: l1-s3
                type: fill_in_blank
                text: "Amy schreibt dir. Welches Wort fehlt?"
                say: { de: "Amy schreibt dir. Welches Wort fehlt?" }
                frame: "I wear a school _."
                options: ["uniform", "lunch", "bus"]
                answer: ["uniform"]
                hints: ["Was trägt Amy in der Schule?"]
              - id: l1-s4
                type: multiple_choice
                text: "Was ist bei Amy und dir gleich?"
                say: { de: "Was ist bei Amy und dir gleich?" }
                options: ["Wir haben beide Mathe.", "Wir tragen beide eine Schuluniform.", "Wir sind beide in Year 5."]
                answer: "Wir haben beide Mathe."
                hints: ["Denk an die Fächer."]
              - id: l1-s5
                type: audio_choice
                say: { de: "Hör zu. Was isst Ben mittags?" }
                audio: { en: "At lunchtime I have a school dinner. Today it's pizza!" }
                options: ["ein warmes Essen in der Schule", "ein Lunchpaket", "nichts"]
                answer: "ein warmes Essen in der Schule"
                hints: ["Ben sagt: „school dinner“."]
              - id: l1-s6
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Verbinde die englischen Wörter mit den deutschen." }
                pairs:
                  - { left: { text: "school uniform" }, right: { text: "die Schuluniform" } }
                  - { left: { text: "packed lunch" }, right: { text: "das Lunchpaket" } }
                  - { left: { text: "lunchtime" }, right: { text: "die Mittagspause" } }
                hints: ["„Lunch“ ist das Mittagessen."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Wann ist Amys Schule aus?" }
                audio: { en: "School finishes at half past three." }
                options: ["um halb vier", "um halb drei", "um zwölf Uhr"]
                answer: "um halb vier"
              - id: l1-n2
                type: sorting
                text: "In England, bei uns oder in beiden Ländern?"
                say: { de: "Sortiere: Gibt es das in England, bei uns oder in beiden Ländern?" }
                bins:
                  - { id: england, show: { text: "in England" } }
                  - { id: here, show: { text: "bei uns" } }
                  - { id: both, show: { text: "in beiden Ländern" } }
                options:
                  - { text: "Pulli in der Schulfarbe", bin: england }
                  - { text: "Schule bis halb vier", bin: england }
                  - { text: "Schule oft nur bis mittags", bin: here }
                  - { text: "Ferien im Sommer", bin: both }
              - id: l1-n3
                type: multiple_choice
                text: "Paul ist in Klasse 4. In welchem Schuljahr wäre er in England?"
                say: { de: "Paul ist in Klasse 4. In welchem Schuljahr wäre er in England?" }
                options: ["Year 5", "Year 4", "Year 3"]
                answer: "Year 5"
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Amy zeigt dir ihre Uniform. Welches Wort fehlt?"
                say: { de: "Amy zeigt dir ihre Uniform. Welches Wort fehlt?" }
                show: { object: jumper, colour: red }
                frame: "My _ is red."
                options: ["jumper", "lunch", "school"]
                answer: ["jumper"]
              - id: l1-n5
                type: multiple_choice
                text: "Was stimmt?"
                say: { de: "Was stimmt?" }
                options: ["In England und bei uns lernen Kinder Mathe.", "In England gibt es keine Pause.", "Bei uns tragen alle Kinder eine Uniform."]
                answer: "In England und bei uns lernen Kinder Mathe."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: true_false
            text: "Kommen Kinder in England schon mit vier oder fünf Jahren in die Schule?"
            say: { de: "Kommen Kinder in England schon mit vier oder fünf Jahren in die Schule?" }
            answer: true
          - id: l1-c2
            type: audio_choice
            say: { de: "Hör zu. Welchen Pulli trägt Ruby?" }
            audio: { en: "This is my school uniform. My jumper is green." }
            options: [{ object: jumper, colour: green }, { object: jumper, colour: yellow }, { object: jumper, colour: blue }]
            answer: green
          - id: l1-c3
            type: multiple_choice
            text: "Wo isst Amy mittags?"
            say: { de: "Wo isst Amy mittags?" }
            options: ["in der Schule", "zu Hause bei Oma", "im Bus"]
            answer: "in der Schule"

  - n: 2
    title: { de: Frühstück und Feste, en: Breakfast and celebrations }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Tragen viele Kinder in England eine Schuluniform?"
            say: { de: "Tragen viele Kinder in England eine Schuluniform?" }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            say: { de: "Hör zu. Wann fängt die Schule an?" }
            audio: { en: "My school starts at nine." }
            options: ["um 9 Uhr", "um 8 Uhr", "um 7 Uhr"]
            answer: "um 9 Uhr"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "cereal, toast"
            say: { de: "Zum Frühstück essen viele Kinder in England Cornflakes oder Müsli mit Milch, auf Englisch „cereal“. Oder sie essen Toast mit Butter und Marmelade. Bei uns gibt es oft Brot oder Brötchen.", en: "For breakfast I have cereal with milk, or toast with jam." }
            show: { objects: [milk, bread] }
          - text: "a big breakfast"
            say: { de: "Am Wochenende gibt es in manchen Familien ein großes Frühstück: Spiegeleier, Würstchen, Bohnen in Tomatensoße und Toast. Das isst aber kaum jemand jeden Tag.", en: "On Sundays we have eggs, sausages and beans!" }
            show: { object: egg }
          - text: "Bonfire Night, Sankt Martin"
            say: { de: "Auch die Feste sind ein bisschen anders. In England feiert man am 5. November Bonfire Night mit Feuerwerk. Sankt Martin mit dem Laternenumzug kennen die meisten Kinder in England nicht. Geburtstag und Weihnachten feiern Kinder in beiden Ländern gern." }
          - text: "viele, nicht alle"
            say: { de: "Und noch etwas: Amy ist nur ein Kind. Nicht alle Kinder in England machen alles gleich. Sag deshalb lieber: viele Kinder in England. Sag nicht: alle Kinder in England." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Was isst Amy zum Frühstück?" }
                audio: { en: "For breakfast I have toast with jam." }
                options: ["Toast mit Marmelade", "Brötchen mit Käse", "Müsli mit Milch"]
                answer: "Toast mit Marmelade"
                hints:
                  - "Hör auf das Wort nach „have“."
                  - "Amy sagt: „toast with jam“."
                  - "„Jam“ ist Marmelade."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was ist „cereal“?"
                say: { de: "Was ist „cereal“?" }
                options: ["Cornflakes oder Müsli", "Toast", "Eier"]
                answer: "Cornflakes oder Müsli"
                hints:
                  - "„Cereal“ isst man zum Frühstück aus einer Schüssel."
                  - "„Cereal“ isst man mit Milch."
                  - "„Cereal“ sind Cornflakes oder Müsli."
              - id: l2-f3
                type: true_false
                text: "Essen alle Kinder in England jeden Morgen Würstchen und Bohnen?"
                say: { de: "Essen alle Kinder in England jeden Morgen Würstchen und Bohnen?" }
                answer: false
                feedback:
                  "true": "Das große Frühstück gibt es in manchen Familien am Wochenende. An Schultagen essen viele Kinder Toast oder Cornflakes."
                hints:
                  - "Wann gibt es das große Frühstück?"
                  - "Am Wochenende, und nur in manchen Familien."
                  - "Nein, nicht alle und nicht jeden Morgen."
              - id: l2-f4
                type: sorting
                text: "In England, bei uns oder in beiden Ländern?"
                say: { de: "Sortiere: Gibt es das in England, bei uns oder in beiden Ländern?" }
                bins:
                  - { id: england, show: { text: "in England" } }
                  - { id: here, show: { text: "bei uns" } }
                  - { id: both, show: { text: "in beiden Ländern" } }
                options:
                  - { text: "Bonfire Night", bin: england }
                  - { text: "Bohnen in Tomatensoße zum Frühstück", bin: england }
                  - { text: "Sankt Martin mit Laternen", bin: here }
                  - { text: "Brötchen zum Frühstück", bin: here }
                  - { text: "Geburtstag feiern", bin: both }
                  - { text: "Weihnachten", bin: both }
                hints:
                  - "Fang mit den Festen an."
                  - "Bonfire Night gibt es in England, Sankt Martin bei uns."
                  - "Geburtstag und Weihnachten feiert man in beiden Ländern."
              - id: l2-f5
                type: audio_choice
                say: { de: "Hör zu. Was trinkt Leo zum Frühstück?" }
                audio: { en: "I have cereal and a glass of orange juice." }
                options: [{ object: juice }, { object: milk }, { object: water }]
                answer: juice
                hints:
                  - "Hör auf das Ende."
                  - "Leo sagt: „orange juice“."
                  - "„Juice“ ist Saft."
              - id: l2-f6
                type: multiple_choice
                text: "Welcher Satz über England stimmt?"
                say: { de: "Welcher Satz über England stimmt?" }
                options: ["Viele Kinder in England essen Toast zum Frühstück.", "Alle Kinder in England essen nur Toast.", "In England frühstückt niemand."]
                answer: "Viele Kinder in England essen Toast zum Frühstück."
                feedback:
                  "Alle Kinder in England essen nur Toast.": "„Alle“ stimmt fast nie. Sag lieber: viele Kinder."
                hints:
                  - "Achte auf die Wörter „viele“, „alle“ und „niemand“."
                  - "Nicht alle Kinder machen alles gleich."
                  - "Der Satz mit „viele“ stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Was isst die Familie am Sonntag?" }
                audio: { en: "On Sunday we have a big breakfast: eggs, sausages and beans." }
                options: ["Eier, Würstchen und Bohnen", "Brötchen mit Marmelade", "Pizza"]
                answer: "Eier, Würstchen und Bohnen"
                hints: ["„Eggs“ sind Eier, „beans“ sind Bohnen."]
              - id: l2-s2
                type: multiple_choice
                text: "Welches Fest kennen viele Kinder in England nicht?"
                say: { de: "Welches Fest kennen viele Kinder in England nicht?" }
                options: ["Sankt Martin", "Weihnachten", "Geburtstag"]
                answer: "Sankt Martin"
                hints: ["Welches Fest feiert man bei uns mit Laternen?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Amy erzählt vom Frühstück. Welches Wort fehlt?"
                say: { de: "Amy erzählt vom Frühstück. Welches Wort fehlt?" }
                frame: "For _ I have cereal."
                options: ["breakfast", "birthday", "school"]
                answer: ["breakfast"]
                hints: ["Frühstück heißt „breakfast“."]
              - id: l2-s4
                type: true_false
                text: "Feiern Kinder in England und bei uns gern Geburtstag?"
                say: { de: "Feiern Kinder in England und bei uns gern Geburtstag?" }
                answer: true
                hints: ["Denk an „Happy birthday!“"]
              - id: l2-s5
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Verbinde die englischen Frühstückswörter mit den deutschen." }
                pairs:
                  - { left: { text: "toast" }, right: { text: "der Toast" } }
                  - { left: { text: "cereal" }, right: { text: "die Cornflakes" } }
                  - { left: { text: "beans" }, right: { text: "die Bohnen" } }
                  - { left: { text: "jam" }, right: { text: "die Marmelade" } }
                hints: ["Fang mit „toast“ an. Das Wort ist fast gleich."]
              - id: l2-s6
                type: multiple_choice
                text: "Amy isst gern Toast. Was kannst du dann sagen?"
                say: { de: "Amy isst gern Toast. Was kannst du dann sagen?" }
                options: ["Amy mag Toast. Andere Kinder essen vielleicht etwas anderes.", "Alle Kinder in England essen nur Toast.", "Niemand in England mag Brot."]
                answer: "Amy mag Toast. Andere Kinder essen vielleicht etwas anderes."
                hints: ["Amy ist nur ein Kind."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Was macht Amy am 5. November?" }
                audio: { en: "On the fifth of November we watch the fireworks." }
                options: ["Sie schaut ein Feuerwerk an.", "Sie geht mit einer Laterne.", "Sie sucht Ostereier."]
                answer: "Sie schaut ein Feuerwerk an."
              - id: l2-n2
                type: sorting
                text: "In England, bei uns oder in beiden Ländern?"
                say: { de: "Sortiere: Gibt es das in England, bei uns oder in beiden Ländern?" }
                bins:
                  - { id: england, show: { text: "in England" } }
                  - { id: here, show: { text: "bei uns" } }
                  - { id: both, show: { text: "in beiden Ländern" } }
                options:
                  - { text: "Schuluniform", bin: england }
                  - { text: "Laternenumzug an Sankt Martin", bin: here }
                  - { text: "Ferien im Sommer", bin: both }
                  - { text: "Feuerwerk am 5. November", bin: england }
              - id: l2-n3
                type: multiple_choice
                text: "Was ist bei Amy und dir gleich?"
                say: { de: "Du schreibst Amy einen Brief. Was ist bei euch beiden gleich?" }
                options: ["Wir haben beide im Sommer Ferien.", "Wir tragen beide eine Schuluniform.", "Wir feiern beide Bonfire Night."]
                answer: "Wir haben beide im Sommer Ferien."
              - id: l2-n4
                type: fill_in_blank
                text: "Was schreibst du Amy? Welches Wort fehlt?"
                say: { de: "Du schreibst Amy über England. Welches Wort fehlt?" }
                frame: "In England, many children wear a school _."
                options: ["uniform", "breakfast", "juice"]
                answer: ["uniform"]
              - id: l2-n5
                type: true_false
                text: "Lukas sagt: „In England ist alles ganz anders als bei uns.“ Stimmt das?"
                say: { de: "Lukas sagt: In England ist alles ganz anders als bei uns. Stimmt das?" }
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Welchen Pulli trägt Ruby in der Schule?" }
            audio: { en: "I'm Ruby. I wear a school uniform. My jumper is yellow." }
            options: [{ object: jumper, colour: yellow }, { object: jumper, colour: blue }, { object: jumper, colour: green }]
            answer: yellow
          - id: l2-c2
            type: multiple_choice
            text: "Was stimmt über die Schule in England?"
            say: { de: "Was stimmt über die Schule in England?" }
            options: ["Viele Kinder sind bis halb vier in der Schule.", "Die Schule fängt erst mit acht Jahren an.", "Es gibt keine Pausen."]
            answer: "Viele Kinder sind bis halb vier in der Schule."
          - id: l2-c3
