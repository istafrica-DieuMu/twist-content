# Lesson set: Englisch, Lernjahr 2 (Klasse 4). Hand-authored draft.
id: de-DE.fl.en-special-days
skill: fl.themes.special-days
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Feste feiern
  en: Special days
summary: >
  Words, greetings and customs for special days in England. Lesson 1
  brings birthdays (Happy birthday!, cake, candles, presents, balloons)
  and Christmas (Merry Christmas!, Christmas tree, Father Christmas, the
  stocking, presents on the morning of 25 December rather than on
  Heiligabend). Lesson 2 brings Easter (Easter eggs, the Easter bunny, the
  egg hunt), Halloween (witch, ghost, pumpkin, Trick or treat!) and
  Bonfire Night on 5 November (bonfire, fireworks), and ends with the
  skill check. The child reads and completes short greetings for cards.
metadata:
  year: lernjahr-2
  topic: { de: Feste, en: Special days }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.themes.calendar]
  also_practises: [fl.themes.calendar, fl.culture-strategies.compare-daily-life]
  vocabulary: { en: ["Happy birthday!", cake, candle, present, balloon, "Merry Christmas!", Christmas tree, Father Christmas, stocking, "Happy Easter!", Easter egg, Easter bunny, egg hunt, Halloween, witch, ghost, pumpkin, "Trick or treat!", Bonfire Night, bonfire, fireworks] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: wrong-greeting
      what: Uses one greeting for every special day (Merry birthday, Happy Christmas on an Easter card)
      addressed: every stage has a greeting task with the other days' greetings as options (l1-f3, l1-s5, l2-s3, skill check); the card tasks give a reason in the context
    - id: presents-on-24th
      what: Expects English children to open their Christmas presents on the evening of 24 December, as in Germany
      addressed: lesson 1 Learn sets the stocking and the morning of 25 December against Heiligabend; l1-f6, l1-n2 and the skill check ask about it
    - id: halloween-bonfire
      what: Mixes up Halloween and Bonfire Night, which are only a few days apart
      addressed: lesson 2 Learn gives each its date and customs; l2-s2 and l2-s5 ask for the dates, l2-f6 and l2-n4 sort the customs
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Geburtstag und Weihnachten, en: Birthdays and Christmas }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Welcher Monat ist das?" }
            audio: { en: "December." }
            options: ["Dezember", "September", "November"]
            answer: "Dezember"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Wann hat das Kind Geburtstag?" }
            audio: { en: "When is your birthday? It's in May." }
            options: ["im Mai", "im März", "im Juli"]
            answer: "im Mai"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "Happy birthday!"
            say: { de: "Hat jemand Geburtstag, sagst du: Happy birthday! Es gibt einen Kuchen mit Kerzen, Luftballons und Geschenke. Der Kuchen heißt cake, die Kerzen heißen candles, ein Geschenk heißt present.", en: "Happy birthday! Here's a present for you." }
            show: { objects: [cake, balloon, present] }
          - text: "Merry Christmas!"
            say: { de: "Weihnachten heißt Christmas. Dann sagst du: Merry Christmas! Der Weihnachtsbaum heißt Christmas tree.", en: "Merry Christmas!" }
            show: { object: fir-tree }
          - text: "Father Christmas, stocking"
            say: { de: "In England hängen die Kinder an Heiligabend einen großen Strumpf auf, den stocking. In der Nacht zum 25. Dezember kommt Father Christmas und füllt ihn mit Geschenken. Die Kinder packen ihre Geschenke am Morgen aus. Bei uns gibt es die Geschenke meist schon am Abend vorher, an Heiligabend.", en: "Father Christmas. A stocking." }
            show: { object: sock }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Welches Fest ist das?" }
                audio: { en: "Happy birthday, Lily!" }
                options: ["Geburtstag", "Weihnachten", "Ostern"]
                answer: "Geburtstag"
                hints:
                  - "Hör auf das Wort nach happy."
                  - "Lily hört: Happy birthday."
                  - "Birthday heißt Geburtstag."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                option_audio: false
                text: "birthday cake"
                say: { de: "Lies. Welches Bild passt?" }
                options: [{ object: cake }, { object: pie }, { object: bread }]
                answer: cake
                feedback:
                  pie: "Das ist eine Pastete. Birthday cake heißt Geburtstagskuchen, mit Kerzen."
                hints:
                  - "Lies das zweite Wort: cake."
                  - "Cake heißt Kuchen."
                  - "Tippe auf den Kuchen mit der Kerze."
              - id: l1-f3
                type: multiple_choice
                text: "Was sagst du an Weihnachten?"
                say: { de: "Was sagst du an Weihnachten?" }
                options: ["Merry Christmas!", "Happy Easter!", "Good night!"]
                answer: "Merry Christmas!"
                option_audio: false
                hints:
                  - "Wie heißt Weihnachten auf Englisch?"
                  - "Weihnachten heißt Christmas."
                  - "Du sagst: Merry Christmas!"
              - id: l1-f4
                type: fill_in_blank
                text: "Lily hat heute Geburtstag. Was schreibst du auf die Karte?"
                say: { de: "Lily hat heute Geburtstag. Was schreibst du auf die Karte?" }
                frame: "Happy _, Lily!"
                options: ["birthday", "Christmas", "morning"]
                answer: ["birthday"]
                hints:
                  - "Welches Fest feiert Lily?"
                  - "Lily hat Geburtstag."
                  - "Geburtstag heißt birthday."
              - id: l1-f5
                type: audio_choice
                say: { de: "Hör zu. Was bekommt Tom?" }
                audio: { en: "Happy birthday, Tom! Here's a present for you." }
                options: [{ object: present }, { object: cake }, { object: balloon }]
                answer: present
                hints:
                  - "Hör auf das Ende: a present."
                  - "Was bekommt man zum Geburtstag?"
                  - "A present ist ein Geschenk."
              - id: l1-f6
                type: true_false
                text: "Packen Kinder in England ihre Weihnachtsgeschenke am Morgen des 25. Dezember aus?"
                say: { de: "Packen Kinder in England ihre Weihnachtsgeschenke meistens am Morgen des 25. Dezember aus?" }
                answer: true
                hints:
                  - "Wann kommt Father Christmas?"
                  - "Er kommt in der Nacht zum 25. Dezember."
                  - "Ja, am Morgen packen die Kinder aus."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                option_audio: false
                text: "Christmas tree"
                say: { de: "Lies. Welches Bild passt?" }
                options: [{ object: fir-tree }, { object: tree }, { object: leaf }]
                answer: fir-tree
                hints: ["Welchen Baum stellt man an Weihnachten ins Zimmer?"]
              - id: l1-s2
                type: audio_choice
                say: { de: "Hör zu. Welches Fest ist das?" }
                audio: { en: "Merry Christmas, Grandma!" }
                options: ["Weihnachten", "Geburtstag", "Ostern"]
                answer: "Weihnachten"
                hints: ["Christmas heißt Weihnachten."]
              - id: l1-s3
                type: multiple_choice
                text: "Wer bringt in England die Weihnachtsgeschenke?"
                say: { de: "Wer bringt in England die Weihnachtsgeschenke?" }
                options: ["Father Christmas", "der Osterhase", "die Zahnfee"]
                answer: "Father Christmas"
                hints: ["Sein Name hat das Wort Christmas."]
              - id: l1-s4
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Lies das Wort und verbinde es mit dem Bild." }
                pairs:
                  - { left: { text: "cake" }, right: { object: cake } }
                  - { left: { text: "balloon" }, right: { object: balloon } }
                  - { left: { text: "Christmas tree" }, right: { object: fir-tree } }
                  - { left: { text: "stocking" }, right: { object: sock } }
                hints: ["Fang mit dem Wort an, das du sicher weißt."]
              - id: l1-s5
                type: fill_in_blank
                text: "Was schreibst du auf eine Weihnachtskarte?"
                say: { de: "Was schreibst du auf eine Weihnachtskarte?" }
                frame: "Merry _!"
                options: ["Christmas", "birthday", "Easter"]
                answer: ["Christmas"]
                feedback:
                  "birthday": "Happy birthday sagst du zum Geburtstag. Auf die Weihnachtskarte schreibst du Merry Christmas."
                hints: ["Weihnachten heißt Christmas."]
              - id: l1-s6
                type: audio_choice
                say: { de: "Hör zu. Wie alt wird Ben heute?" }
                audio: { en: "Happy birthday, Ben! How old are you today? I'm ten!" }
                options: ["10", "9", "12"]
                answer: "10"
                hints: ["Ben sagt: I'm ten."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Was ist auf Ellas Kuchen?" }
                audio: { en: "It's my birthday today. Look at my cake! It's got nine candles." }
                options: ["neun Kerzen", "neun Erdbeeren", "zehn Kerzen"]
                answer: "neun Kerzen"
              - id: l1-n2
                type: multiple_choice
                text: "Was hängen Kinder in England an Heiligabend auf?"
                say: { de: "Was hängen Kinder in England an Heiligabend auf, damit Father Christmas etwas hineinlegt?" }
                options: ["einen großen Strumpf", "einen Luftballon", "eine Glocke"]
                answer: "einen großen Strumpf"
              - id: l1-n3
                type: fill_in_blank
                text: "Alle singen für Ella. Was fehlt?"
                say: { de: "Alle singen für Ella. Welches Wort fehlt im Lied?" }
                frame: "Happy birthday _ you!"
                options: ["to", "for", "at"]
                answer: ["to"]
                difficulty: stretch
              - id: l1-n4
                type: true_false
                text: "Ist Christmas Day am 24. Dezember?"
                say: { de: "Ist Christmas Day am 24. Dezember?" }
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                option_audio: false
                text: "balloon"
                say: { de: "Ella bekommt etwas zum Geburtstag. Lies. Welches Bild passt?" }
                options: [{ object: balloon }, { object: ball }, { object: bell }]
                answer: balloon

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Welches Fest ist das?" }
            audio: { en: "Merry Christmas and a happy New Year!" }
            options: ["Weihnachten", "Geburtstag", "Ostern"]
            answer: "Weihnachten"
          - id: l1-c2
            type: multiple_choice
            text: "Was sagst du, wenn jemand Geburtstag hat?"
            say: { de: "Was sagst du, wenn jemand Geburtstag hat?" }
            options: ["Happy birthday!", "Merry Christmas!", "Good morning!"]
            answer: "Happy birthday!"
            option_audio: false
          - id: l1-c3
            type: multiple_choice
            text: "Was ist a Christmas tree?"
            say: { de: "Was ist a Christmas tree?" }
            options: ["ein Weihnachtsbaum", "ein Osterstrauch", "ein Apfelbaum"]
            answer: "ein Weihnachtsbaum"

  - n: 2
    title: { de: "Ostern, Halloween und Bonfire Night", en: "Easter, Halloween and Bonfire Night" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Welches Fest ist das?" }
            audio: { en: "Happy birthday, Max!" }
            options: ["Geburtstag", "Weihnachten", "Ostern"]
            answer: "Geburtstag"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            option_audio: false
            text: "a present"
            say: { de: "Lies. Welches Bild passt?" }
            options: [{ object: present }, { object: cake }, { object: sock }]
            answer: present
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "Happy Easter!"
            say: { de: "Ostern heißt Easter. Dann sagst du: Happy Easter! Kinder bekommen Schokoladeneier, Easter eggs. Oft versteckt sie der Osterhase, der Easter bunny, im Garten. Die Kinder suchen sie. Das ist eine egg hunt.", en: "Happy Easter!" }
            show: { objects: [egg, rabbit] }
          - text: "Halloween: 31. Oktober"
            say: { de: "Am 31. Oktober ist Halloween. Kinder verkleiden sich, zum Beispiel als Hexe oder als Gespenst, auf Englisch witch und ghost. Sie gehen von Haus zu Haus und rufen: Trick or treat! Dann bekommen sie Süßigkeiten. Vor den Häusern leuchten Kürbisse mit Gesichtern. Kürbis heißt pumpkin.", en: "Trick or treat!" }
            show: { objects: [witch, ghost] }
          - text: "Bonfire Night: 5. November"
            say: { de: "Nur ein paar Tage später, am 5. November, ist in England Bonfire Night. Am Abend gibt es ein großes Feuer, ein bonfire, und ein Feuerwerk, fireworks. So erinnert man sich an eine alte Geschichte aus London.", en: "Look at the fireworks!" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Welches Fest ist das?" }
                audio: { en: "Happy Easter, Mum!" }
                options: ["Ostern", "Weihnachten", "Halloween"]
                answer: "Ostern"
                hints:
                  - "Hör auf das Wort nach happy."
                  - "Du hörst: Happy Easter."
                  - "Easter heißt Ostern."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                option_audio: false
                text: "Easter egg"
                say: { de: "Lies. Welches Bild passt?" }
                options: [{ object: egg }, { object: ball }, { object: apple }]
                answer: egg
                hints:
                  - "Lies das zweite Wort: egg."
                  - "Egg heißt Ei."
                  - "Tippe auf das Ei."
              - id: l2-f3
                type: multiple_choice
                text: "Was rufen Kinder an Halloween an der Haustür?"
                say: { de: "Was rufen Kinder an Halloween an der Haustür?" }
                options: ["Trick or treat!", "Happy birthday!", "Merry Christmas!"]
                answer: "Trick or treat!"
                option_audio: false
                hints:
                  - "Die Kinder wollen Süßigkeiten."
                  - "Es ist kein Geburtstag und nicht Weihnachten."
                  - "Sie rufen: Trick or treat!"
              - id: l2-f4
                type: matching
                text: "Was passt zusammen?"
                say: { de: "Verbinde die englischen Halloween-Wörter mit den deutschen." }
                pairs:
                  - { left: { text: "witch" }, right: { text: "die Hexe" } }
                  - { left: { text: "ghost" }, right: { text: "das Gespenst" } }
                  - { left: { text: "pumpkin" }, right: { text: "der Kürbis" } }
                hints:
                  - "Als was verkleiden sich Kinder an Halloween? Was leuchtet vor den Häusern?"
                  - "Witch ist die Hexe."
                  - "Ghost ist das Gespenst, pumpkin ist der Kürbis."
              - id: l2-f5
                type: multiple_choice
                text: "Was sieht man an Bonfire Night am Himmel?"
                say: { de: "Was sieht man an Bonfire Night am Himmel?" }
                options: ["ein Feuerwerk", "einen Regenbogen", "Ostereier"]
                answer: "ein Feuerwerk"
                hints:
                  - "Bonfire Night ist am Abend, wenn es dunkel ist."
                  - "Am dunklen Himmel leuchtet es bunt."
                  - "Fireworks heißt Feuerwerk."
              - id: l2-f6
                type: sorting
                text: "Zu welchem Fest gehört das?"
                say: { de: "Sortiere die Wörter: Halloween, Weihnachten oder Ostern?" }
                bins:
                  - { id: halloween, show: { text: "Halloween" } }
                  - { id: christmas, show: { text: "Weihnachten" } }
                  - { id: easter, show: { text: "Ostern" } }
                options:
                  - { text: "pumpkin", bin: halloween }
                  - { text: "ghost", bin: halloween }
                  - { text: "Christmas tree", bin: christmas }
                  - { text: "Father Christmas", bin: christmas }
                  - { text: "Easter egg", bin: easter }
                  - { text: "Easter bunny", bin: easter }
                hints:
                  - "Bei vier Wörtern steht das Fest schon im Wort."
                  - "Christmas ist Weihnachten, Easter ist Ostern."
                  - "Pumpkin und ghost gehören zu Halloween."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. An welchem Fest hörst du das?" }
                audio: { en: "Trick or treat!" }
                options: ["an Halloween", "an Ostern", "am Geburtstag"]
                answer: "an Halloween"
                hints: ["Wann gehen Kinder verkleidet von Haus zu Haus?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wann ist Bonfire Night?"
                say: { de: "Wann ist Bonfire Night?" }
                options: ["am 5. November", "am 31. Oktober", "am 25. Dezember"]
                answer: "am 5. November"
                feedback:
                  "am 31. Oktober": "Am 31. Oktober ist Halloween. Bonfire Night kommt ein paar Tage später."
                hints: ["Bonfire Night kommt kurz nach Halloween."]
              - id: l2-s3
                type: fill_in_blank
                text: "Was schreibst du auf eine Osterkarte?"
                say: { de: "Was schreibst du auf eine Osterkarte?" }
                frame: "Happy _!"
                options: ["Easter", "Christmas", "Halloween"]
                answer: ["Easter"]
                hints: ["Ostern heißt Easter."]
              - id: l2-s4
                type: image_multiple_choice
                option_audio: false
                text: "Easter bunny"
                say: { de: "Lies. Welches Bild passt?" }
                options: [{ object: rabbit }, { object: cat }, { object: mouse }]
                answer: rabbit
                hints: ["Wer versteckt die Ostereier?"]
              - id: l2-s5
                type: matching
                text: "Wann ist welches Fest?"
                say: { de: "Verbinde jedes Fest mit seinem Datum." }
                pairs:
                  - { left: { text: "Halloween" }, right: { text: "31. Oktober" } }
                  - { left: { text: "Bonfire Night" }, right: { text: "5. November" } }
                  - { left: { text: "Christmas Day" }, right: { text: "25. Dezember" } }
                hints: ["Halloween kommt zuerst, Bonfire Night ein paar Tage danach."]
              - id: l2-s6
                type: true_false
                text: "Gehen Kinder an Halloween von Haus zu Haus?"
                say: { de: "Gehen Kinder an Halloween von Haus zu Haus?" }
                answer: true
                hints: ["Denk an Trick or treat!"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Als was hat sich Mia verkleidet?" }
                audio: { en: "Look at me! I'm a witch! Trick or treat!" }
                options: [{ object: witch }, { object: ghost }, { object: cat }]
                answer: witch
              - id: l2-n2
                type: audio_choice
                say: { de: "Hör zu. Welches Fest feiert Jack?" }
                audio: { en: "It's the fifth of November. Look at the big bonfire and the fireworks!" }
                options: ["Bonfire Night", "Halloween", "Weihnachten"]
                answer: "Bonfire Night"
              - id: l2-n3
                type: fill_in_blank
                text: "Was rufen die Kinder an der Tür?"
                say: { de: "Was rufen die Kinder an der Tür? Welches Wort fehlt?" }
                frame: "Trick or _!"
                options: ["treat", "tree", "three"]
                answer: ["treat"]
                difficulty: stretch
              - id: l2-n4
                type: sorting
                text: "Zu welchem Fest gehört das?"
                say: { de: "Sortiere die Wörter: Halloween oder Bonfire Night?" }
                bins:
                  - { id: halloween, show: { text: "Halloween" } }
                  - { id: bonfire, show: { text: "Bonfire Night" } }
                options:
                  - { text: "witch", bin: halloween }
                  - { text: "Trick or treat!", bin: halloween }
                  - { text: "bonfire", bin: bonfire }
                  - { text: "fireworks", bin: bonfire }
              - id: l2-n5
                type: multiple_choice
                text: "Was suchen Kinder bei einer egg hunt?"
                say: { de: "Was suchen Kinder bei einer egg hunt?" }
                options: ["Ostereier", "Kürbisse", "Geschenke"]
                answer: "Ostereier"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Welches Fest ist das?" }
            audio: { en: "Happy birthday to you!" }
            options: ["Geburtstag", "Weihnachten", "Halloween"]
            answer: "Geburtstag"
          - id: l2-c2
            type: multiple_choice
            text: "Was sagst du am 25. Dezember?"
            say: { de: "Was sagst du am 25. Dezember?" }
            options: ["Merry Christmas!", "Trick or treat!", "Happy Easter!"]
            answer: "Merry Christmas!"
            option_audio: false
          - id: l2-c3
            type: matching
            text: "Was passt zusammen?"
            say: { de: "Verbinde jedes englische Fest mit dem deutschen." }
            pairs:
              - { left: { text: "Easter" }, right: { text: "Ostern" } }
              - { left: { text: "Christmas" }, right: { text: "Weihnachten" } }
              - { left: { text: "birthday" }, right: { text: "Geburtstag" } }
          - id: l2-c4
            type: multiple_choice
            text: "Was gibt es an Bonfire Night?"
            say: { de: "Was gibt es an Bonfire Night?" }
            options: ["ein großes Feuer und ein Feuerwerk", "Ostereier im Garten", "Geschenke im Strumpf"]
            answer: "ein großes Feuer und ein Feuerwerk"
          - id: l2-c5
            type: multiple_choice
            text: "Wo findet ein Kind in England am Weihnachtsmorgen oft seine Geschenke?"
            say: { de: "Wo findet ein Kind in England am Weihnachtsmorgen oft seine Geschenke?" }
            options: ["in einem großen Strumpf", "in einem Kürbis", "im Osternest"]
            answer: "in einem großen Strumpf"
