# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-words-from-memory
skill: fl.writing.words-from-memory
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Wörter aus dem Kopf schreiben
  en: Writing words from memory
summary: >
  Writing practised words without a model and checking them in a word
  list. Lesson 1 learns look, cover, write, check: the child sees only the
  picture and lays the word with letter cards (with one card too many),
  fills missing letters or picks the right spelling. Lesson 2 checks words
  in an alphabetical word list, finds and corrects mistakes, and ends with
  the skill check. Typing whole words waits for a letter keyboard; the
  letter cards stand in for it.
metadata:
  year: lernjahr-1
  topic: { de: Schreiben, en: Writing }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: [fl.writing.copy-words, fl.reading.sound-spelling]
  also_practises: [fl.culture-strategies.learn-words]
  vocabulary: { en: [dog, fish, book, frog, house, cake, shoe, duck, bus, chair, sun, milk, moon, lamp, ball, word list] }
  forms: [picture, text, drawn]
  drawn: [word-card]
  facets: []
  misconceptions:
    - id: german-spelling
      what: Writes from memory with German spellings (fisch, schu, milch)
      addressed: l1-f2 gives feedback on fisch, and every spelling choice keeps a German-style spelling among the options; lesson 1 Learn says to think of the letters, not only the sound
    - id: trusts-memory
      what: Does not check a word, or looks only at its first letter in the word list
      addressed: lesson 2 Learn shows checking letter by letter in the list; the find-the-mistake tasks set a wrong word next to right ones that start the same way (snake, snou, star; clock, claud, clown)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ansehen, zudecken, schreiben, prüfen", en: "Look, cover, write, check" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            option_audio: false
            text: "Welches Wort ist richtig abgeschrieben?"
            say: { de: "Oben steht das Wort. Welches Wort ist richtig abgeschrieben?" }
            show: { drawn: word-card, text: "bed" }
            options: ["bed", "bet", "bad"]
            answer: "bed"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Wie schreibt man das Wort?" }
            audio: { en: "Tree." }
            options: ["tree", "trii", "tre"]
            answer: "tree"
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "Ansehen, zudecken, schreiben, prüfen."
            say: { de: "So lernst du ein Wort auswendig. Sieh dir das Wort genau an. Deck es zu. Schreib es aus dem Kopf. Dann deckst du es auf und prüfst." }
            show: { drawn: word-card, text: "apple" }
          - text: "?"
            say: { de: "Jetzt siehst du nur das Bild. Denk an das englische Wort. Wie klingt es? Welche Buchstaben hat es?", en: "Cat." }
            show: { object: cat }
          - text: "c a t"
            say: { de: "„Cat“ hat drei Buchstaben: c, a, t. Denk an die Buchstaben, nicht nur an den Klang. Bei den Buchstabenkarten liegt oft eine Karte zu viel." }
            show: { object: cat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                option_audio: false
                text: "Schreib das Wort mit den Buchstaben."
                say: { de: "Was ist auf dem Bild? Leg das englische Wort mit den Buchstaben." }
                show: { object: dog }
                options: ["g", "d", "o"]
                slot_count: 3
                answer: ["d", "o", "g"]
                hints:
                  - "Sag das Wort leise vor dich hin."
                  - "Das Wort fängt mit d an."
                  - "d, o, g."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                option_audio: false
                text: "Wie schreibt man das Wort?"
                say: { de: "Was ist auf dem Bild? Wie schreibt man das englische Wort?" }
                show: { object: fish }
                options: ["fish", "fisch", "fihs"]
                answer: "fish"
                feedback:
                  "fisch": "So schreibt man es im Deutschen. Im Englischen schreibt man das sch nur mit s und h."
                hints:
                  - "Denk an die englische Schreibweise, nicht an die deutsche."
                  - "Das sch am Ende schreibt man im Englischen mit zwei Buchstaben."
                  - "„Fish“ schreibt man f, i, s, h."
              - id: l1-f3
                type: fill_in_blank
                option_audio: false
                text: "Welche Buchstaben fehlen?"
                say: { de: "Was ist auf dem Bild? Welche Buchstaben fehlen im englischen Wort?" }
                show: { object: book }
                frame: "b__k"
                options: ["o", "u", "e"]
                answer: ["o", "o"]
                hints:
                  - "„Book“ klingt wie „buk“."
                  - "Das u schreibt man hier mit einem doppelten Buchstaben."
                  - "Zweimal o: „book“."
              - id: l1-f4
                type: ordering
                option_audio: false
                text: "Schreib das Wort mit den Buchstaben. Eine Karte ist zu viel."
                say: { de: "Was ist auf dem Bild? Leg das englische Wort. Eine Karte brauchst du nicht." }
                show: { object: frog }
                options: ["o", "k", "f", "g", "r"]
                slot_count: 4
                answer: ["f", "r", "o", "g"]
                hints:
                  - "„Frog“ hat vier Buchstaben."
                  - "Es fängt mit f und r an."
                  - "f, r, o, g. Das k brauchst du nicht."
              - id: l1-f5
                type: multiple_choice
                option_audio: false
                text: "Wie schreibt man das Wort?"
                say: { de: "Was ist auf dem Bild? Wie schreibt man das englische Wort?" }
                show: { object: house }
                options: ["house", "haus", "hause"]
                answer: "house"
                hints:
                  - "Es klingt fast wie das deutsche „Haus“, wird aber anders geschrieben."
                  - "Das au schreibt man im Englischen hier mit ou."
                  - "„House“: h, o, u, s, e."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                option_audio: false
                text: "Schreib das Wort mit den Buchstaben. Eine Karte ist zu viel."
                say: { de: "Was ist auf dem Bild? Leg das englische Wort. Eine Karte brauchst du nicht." }
                show: { object: cake }
                options: ["e", "k", "c", "a", "s"]
                slot_count: 4
                answer: ["c", "a", "k", "e"]
                hints: ["„Cake“ endet mit einem e, das man nicht hört."]
              - id: l1-s2
                type: multiple_choice
                option_audio: false
                text: "Wie schreibt man das Wort?"
                say: { de: "Was ist auf dem Bild? Wie schreibt man das englische Wort?" }
                show: { object: shoe }
                options: ["shoe", "schu", "shu"]
                answer: "shoe"
                hints: ["Am Ende steht oe."]
              - id: l1-s3
                type: fill_in_blank
                option_audio: false
                text: "Welche Buchstaben fehlen?"
                say: { de: "Was ist auf dem Bild? Welche Buchstaben fehlen im englischen Wort?" }
                show: { object: duck }
                frame: "du__"
                options: ["c", "k", "g"]
                answer: ["c", "k"]
                hints: ["Am Ende stehen zwei Buchstaben für ein k."]
              - id: l1-s4
                type: ordering
                option_audio: false
                text: "Schreib das Wort mit den Buchstaben. Eine Karte ist zu viel."
                say: { de: "Was ist auf dem Bild? Leg das englische Wort. Eine Karte brauchst du nicht." }
                show: { object: bus }
                options: ["s", "b", "u", "z"]
                slot_count: 3
                answer: ["b", "u", "s"]
                hints: ["„Bus“ schreibt man wie im Deutschen, nur klein."]
              - id: l1-s5
                type: multiple_choice
                option_audio: false
                text: "Wie schreibt man das Wort?"
                say: { de: "Was ist auf dem Bild? Wie schreibt man das englische Wort?" }
                show: { object: chair }
                options: ["chair", "tschair", "cheir"]
                answer: "chair"
                hints: ["Das tsch schreibt man im Englischen mit ch."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                option_audio: false
                text: "Schreib das Wort mit den Buchstaben. Eine Karte ist zu viel."
                say: { de: "Was ist auf dem Bild? Leg das englische Wort. Eine Karte brauchst du nicht." }
                show: { object: sun }
                options: ["n", "u", "s", "o"]
                slot_count: 3
                answer: ["s", "u", "n"]
              - id: l1-n2
                type: multiple_choice
                option_audio: false
                text: "Wie schreibt man das Wort?"
                say: { de: "Was ist auf dem Bild? Wie schreibt man das englische Wort?" }
                show: { object: milk }
                options: ["milk", "milc", "milch"]
                answer: "milk"
              - id: l1-n3
                type: fill_in_blank
                option_audio: false
                text: "Welche Buchstaben fehlen?"
                say: { de: "Was ist auf dem Bild? Welche Buchstaben fehlen im englischen Wort?" }
                show: { object: moon }
                frame: "m__n"
                options: ["o", "u", "e"]
                answer: ["o", "o"]
              - id: l1-n4
                type: ordering
                option_audio: false
                text: "Schreib das Wort mit den Buchstaben. Eine Karte ist zu viel."
                say: { de: "Was ist auf dem Bild? Leg das englische Wort. Eine Karte brauchst du nicht." }
                show: { object: lamp }
                options: ["p", "l", "m", "a", "e"]
                slot_count: 4
                answer: ["l", "a", "m", "p"]
              - id: l1-n5
                type: multiple_choice
                option_audio: false
                text: "Wie schreibt man das Wort?"
                say: { de: "Was ist auf dem Bild? Wie schreibt man das englische Wort?" }
                show: { object: ball }
                options: ["ball", "bal", "boll"]
                answer: "ball"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: ordering
            option_audio: false
            text: "Schreib das Wort mit den Buchstaben. Eine Karte ist zu viel."
            say: { de: "Was ist auf dem Bild? Leg das englische Wort. Eine Karte brauchst du nicht." }
            show: { object: pig }
            options: ["g", "i", "p", "e"]
            slot_count: 3
            answer: ["p", "i", "g"]
          - id: l1-c2
            type: multiple_choice
            option_audio: false
            text: "Wie schreibt man das Wort?"
            say: { de: "Was ist auf dem Bild? Wie schreibt man das englische Wort?" }
            show: { object: cheese }
            options: ["cheese", "chees", "tschiis"]
            answer: "cheese"
          - id: l1-c3
            type: fill_in_blank
            option_audio: false
            text: "Welcher Buchstabe fehlt?"
            say: { de: "Was ist auf dem Bild? Welcher Buchstabe fehlt im englischen Wort?" }
            show: { object: bed }
            frame: "b_d"
            options: ["e", "ä", "a"]
            answer: ["e"]

  - n: 2
    title: { de: "In der Wörterliste nachschauen", en: "Checking in a word list" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: ordering
            option_audio: false
            text: "Schreib das Wort mit den Buchstaben."
            say: { de: "Was ist auf dem Bild? Leg das englische Wort mit den Buchstaben." }
            show: { object: cat }
            options: ["t", "c", "a"]
            slot_count: 3
            answer: ["c", "a", "t"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            option_audio: false
            text: "Wie schreibt man das Wort?"
            say: { de: "Was ist auf dem Bild? Wie schreibt man das englische Wort?" }
            show: { object: tree }
            options: ["tree", "tre", "trie"]
            answer: "tree"
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "Wörterliste:\napple\nball\nbanana\nbird\nbook"
            say: { de: "In einer Wörterliste stehen die Wörter nach dem ABC. Dort schaust du nach, ob du ein Wort richtig geschrieben hast." }
          - text: "Ich habe geschrieben: bananna\nIn der Liste steht: banana"
            say: { de: "Such das Wort zuerst mit dem ersten Buchstaben, dann mit dem zweiten. Dann vergleichst du Buchstabe für Buchstabe. Hier ist ein n zu viel." }
          - text: "bananna → banana"
            say: { de: "Du hast einen Fehler gefunden? Prima! Verbessere ihn. So merkst du dir das Wort für das nächste Mal." }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                option_audio: false
                text: "Wörterliste:\napple\nbird\nbook\ncat\nchair\n\nMia hat geschrieben: brid\nWelches Wort aus der Liste meint sie?"
                say: { de: "Mia hat ein Wort aus dem Kopf geschrieben. Schau in die Wörterliste. Welches Wort meint sie?" }
                options: ["bird", "book", "chair"]
                answer: "bird"
                hints:
                  - "Mias Wort fängt mit b an. Welche Wörter in der Liste auch?"
                  - "Mia hat die Buchstaben i und r vertauscht."
                  - "Sie meint „bird“."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                option_audio: false
                text: "Wörterliste:\nduck\negg\nfish\nfrog\n\nTom hat geschrieben: duk, egg, fish\nWelches Wort ist falsch geschrieben?"
                say: { de: "Tom hat drei Wörter aus dem Kopf geschrieben. Schau in die Wörterliste. Welches Wort ist falsch geschrieben?" }
                options: ["duk", "egg", "fish"]
                answer: "duk"
                hints:
                  - "Vergleiche jedes Wort mit der Liste."
                  - "Schau dir das erste Wort genau an."
                  - "In der Liste steht „duck“ mit ck."
              - id: l2-f3
                type: true_false
                text: "Wörterliste:\nhouse\nmilk\nmoon\n\nLea hat geschrieben: moon\nIst das richtig?"
                say: { de: "Lea hat ein Wort aus dem Kopf geschrieben. Schau in die Wörterliste. Ist das Wort richtig?" }
                answer: true
                hints:
                  - "Such das Wort mit m in der Liste."
                  - "Vergleiche Buchstabe für Buchstabe: m, o, o, n."
                  - "Ja, „moon“ ist richtig."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Welches Wort steht in der Wörterliste vor „cat“?"
                say: { de: "Die Wörter stehen nach dem ABC. Welches Wort steht vor „cat“?" }
                options: ["apple", "dog", "sun"]
                answer: "apple"
                hints:
                  - "Sag das ABC auf: a, b, c, d ..."
                  - "Welcher Buchstabe kommt vor c?"
                  - "„Apple“ fängt mit a an. A kommt vor c."
              - id: l2-f5
                type: fill_in_blank
                option_audio: false
                text: "Wörterliste:\nrabbit\nruler\nsock\n\nBen hat geschrieben: rabit\nVerbessere das Wort."
                say: { de: "Ben hat das Wort falsch geschrieben. Schau in die Wörterliste und verbessere es." }
                frame: "ra__it"
                options: ["b", "p", "d"]
                answer: ["b", "b"]
                hints:
                  - "Such das Wort mit ra in der Liste."
                  - "In der Liste steht „rabbit“."
                  - "„Rabbit“ hat zwei b."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                option_audio: false
                text: "Wörterliste:\nsnake\nsnow\nspoon\nstar\n\nMia hat geschrieben: snake, snou, star\nWelches Wort ist falsch geschrieben?"
                say: { de: "Mia hat drei Wörter aus dem Kopf geschrieben. Schau in die Wörterliste. Welches Wort ist falsch geschrieben?" }
                options: ["snake", "snou", "star"]
                answer: "snou"
                hints: ["Alle fangen mit s an. Vergleiche bis zum letzten Buchstaben."]
              - id: l2-s2
                type: true_false
                text: "Wörterliste:\ngreen\nred\nyellow\n\nTom hat geschrieben: yelow\nIst das richtig?"
                say: { de: "Tom hat ein Wort aus dem Kopf geschrieben. Schau in die Wörterliste. Ist das Wort richtig?" }
                answer: false
                hints: ["Zähl die l in der Liste."]
              - id: l2-s3
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die Reihenfolge der Wörterliste."
                say: { de: "In der Wörterliste stehen die Wörter nach dem ABC. Bring die Wörter in diese Reihenfolge." }
                options: ["dog", "apple", "cat"]
                slot_count: 3
                answer: ["apple", "cat", "dog"]
                hints: ["Schau auf den ersten Buchstaben: a, c, d."]
              - id: l2-s4
                type: fill_in_blank
                option_audio: false
                text: "Wörterliste:\nmonkey\nmouse\n\nLea hat geschrieben: mous\nVerbessere das Wort."
                say: { de: "Lea hat das Wort falsch geschrieben. Schau in die Wörterliste und verbessere es." }
                frame: "mous_"
                options: ["e", "s", "a"]
                answer: ["e"]
                hints: ["Am Ende fehlt ein Buchstabe, den man nicht hört."]
              - id: l2-s5
                type: multiple_choice
                option_audio: false
                text: "Wörterliste:\nteacher\ntree\nzebra\n\nBen hat geschrieben: teatcher\nWie schreibt man das Wort richtig?"
                say: { de: "Ben hat das Wort falsch geschrieben. Schau in die Wörterliste. Wie schreibt man es richtig?" }
                options: ["teacher", "teatcher", "ticher"]
                answer: "teacher"
                hints: ["Vergleiche mit der Liste: Steht da ein t vor dem ch?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                option_audio: false
                text: "Wörterliste:\nbanana\nbed\nbee\n\nMia hat geschrieben: banana, bet, bee\nWelches Wort ist falsch geschrieben?"
                say: { de: "Mia hat drei Wörter aus dem Kopf geschrieben. Schau in die Wörterliste. Welches Wort ist falsch geschrieben?" }
                options: ["banana", "bet", "bee"]
                answer: "bet"
              - id: l2-n2
                type: true_false
                text: "Wörterliste:\njacket\njumper\n\nTom hat geschrieben: jumper\nIst das richtig?"
                say: { de: "Tom hat ein Wort aus dem Kopf geschrieben. Schau in die Wörterliste. Ist das Wort richtig?" }
                answer: true
              - id: l2-n3
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die Reihenfolge der Wörterliste."
                say: { de: "In der Wörterliste stehen die Wörter nach dem ABC. Bring die Wörter in diese Reihenfolge." }
                options: ["sun", "bird", "moon"]
                slot_count: 3
                answer: ["bird", "moon", "sun"]
              - id: l2-n4
                type: fill_in_blank
                option_audio: false
                text: "Wörterliste:\nhand\nhead\n\nBen hat geschrieben: hed\nVerbessere das Wort."
                say: { de: "Ben hat das Wort falsch geschrieben. Schau in die Wörterliste und verbessere es." }
                frame: "h__d"
                options: ["e", "a", "o"]
                answer: ["e", "a"]
              - id: l2-n5
                type: multiple_choice
                option_audio: false
                text: "Du suchst „giraffe“ in der Wörterliste. Bei welchem Buchstaben schaust du nach?"
                say: { de: "Du suchst „giraffe“ in der Wörterliste. Bei welchem Buchstaben schaust du nach?" }
                options: ["G", "J", "D"]
                answer: "G"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: ordering
            option_audio: false
            text: "Schreib das Wort mit den Buchstaben. Eine Karte ist zu viel."
            say: { de: "Was ist auf dem Bild? Leg das englische Wort. Eine Karte brauchst du nicht." }
            show: { object: fox }
            options: ["x", "o", "f", "k"]
            slot_count: 3
            answer: ["f", "o", "x"]
          - id: l2-c2
            type: multiple_choice
            option_audio: false
            text: "Wie schreibt man das Wort?"
            say: { de: "Was ist auf dem Bild? Wie schreibt man das englische Wort?" }
            show: { object: spoon }
            options: ["spoon", "spun", "schpoon"]
            answer: "spoon"
          - id: l2-c3
            type: multiple_choice
            option_audio: false
            text: "Wörterliste:\nclock\ncloud\nclown\n\nLea hat geschrieben: clock, claud, clown\nWelches Wort ist falsch geschrieben?"
            say: { de: "Lea hat drei Wörter aus dem Kopf geschrieben. Schau in die Wörterliste. Welches Wort ist falsch geschrieben?" }
            options: ["clock", "claud", "clown"]
            answer: "claud"
          - id: l2-c4
            type: ordering
            option_audio: false
            text: "Bring die Wörter in die Reihenfolge der Wörterliste."
            say: { de: "Die Wörter stehen in der Liste nach dem ABC. Bring diese Wörter in die richtige Reihenfolge." }
            options: ["frog", "house", "egg"]
            slot_count: 3
            answer: ["egg", "frog", "house"]
          - id: l2-c5
            type: fill_in_blank
            option_audio: false
            text: "Welcher Buchstabe fehlt?"
            say: { de: "Das ist ein Hut. Welcher Buchstabe fehlt im englischen Wort?" }
            show: { object: hat }
            frame: "h_t"
            options: ["a", "e", "ä"]
            answer: ["a"]
