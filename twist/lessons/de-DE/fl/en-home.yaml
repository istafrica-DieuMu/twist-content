# Lesson set: Englisch, Lernjahr 1 (Klasse 3). Hand-authored draft.
id: de-DE.fl.en-home
skill: fl.themes.home
curriculum: de-DE
language: de # language of instructions
target_language: en # language being learnt
title:
  de: Zu Hause
  en: At home
summary: >
  Rooms and furniture. Lesson 1 learns the furniture and things in a house
  by ear and picture (bed, table, chair, lamp, mirror, clock, telephone,
  oven); lesson 2 learns the rooms (kitchen, bathroom, bedroom, living
  room, garden), says which room something is in (The oven is in the
  kitchen.), and ends with the skill check. The rooms have no pictures yet,
  so they are given as German words or read in English. Speaking tasks are
  practice only.
metadata:
  year: lernjahr-1
  topic: { de: Zu Hause, en: At home }
  ages: [8-10]
  lesson_minutes: 10
  builds_on: []
  also_practises: [fl.grammar.questions, fl.speaking.name-things]
  vocabulary: { en: [house, bed, table, chair, lamp, mirror, clock, telephone, oven, kitchen, bathroom, bedroom, living room, garden] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  misconceptions:
    - id: bedroom-bathroom
      what: Mixes up bedroom and bathroom because they sound alike
      addressed: lesson 2 Learn sets bedroom (bed) against bathroom (bath); l2-f2 gives feedback when the bed is put in the bathroom, and l2-c1 asks for bedroom with Badezimmer among the options
    - id: chair-table
      what: Mixes up chair and table
      addressed: l1-f2 gives feedback when table is tapped for chair; chair and table appear together in lesson 1 tasks
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Möbel und Sachen im Haus", en: "Furniture and things at home" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "House." }
            options: [{ object: house }, { object: mouse }, { object: car }]
            answer: house
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Box." }
            options: [{ object: box }, { object: book }, { object: ball }]
            answer: box
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - say: { de: "Das sind Möbel im Haus. Hör zu:", en: "Bed. Table. Chair." }
            show: { object: bed }
          - say: { de: "Noch mehr Sachen im Haus:", en: "Lamp. Mirror. Clock." }
            show: { object: lamp }
          - say: { de: "Und das hier: das Telefon und der Ofen in der Küche.", en: "Telephone. Oven." }
            show: { object: oven }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Table." }
                options: [{ object: table }, { object: chair }, { object: bed }]
                answer: table
                hints:
                  - "Hör noch einmal: table."
                  - "Daran sitzt ihr beim Essen."
                  - "Table ist der Tisch."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Chair." }
                options: [{ object: chair }, { object: table }, { object: lamp }]
                answer: chair
                feedback:
                  table: "Das ist der Tisch, table. Chair ist der Stuhl, darauf sitzt du."
                hints:
                  - "Hör noch einmal: chair."
                  - "Darauf sitzt du."
                  - "Chair ist der Stuhl."
              - id: l1-f3
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Mirror." }
                show: { object: mirror }
                answer: true
                hints:
                  - "Hör noch einmal: mirror."
                  - "Darin siehst du dich selbst."
                  - "Ja, mirror ist der Spiegel."
              - id: l1-f4
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Lamp." }
                options: [{ object: lamp }, { object: clock }, { object: mirror }]
                answer: lamp
                hints:
                  - "Das Wort klingt fast wie im Deutschen."
                  - "Lamp ist die Lampe."
                  - "Tippe auf die Lampe."
              - id: l1-f5
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Bed." }
                show: { object: bed }
                expected_text: "bed"
                hints:
                  - "Hör noch einmal: bed."
                  - "Es klingt fast wie Bett."
                  - "Sag mit mir: bed."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Oven." }
                options: [{ object: oven }, { object: telephone }, { object: table }]
                answer: oven
                hints: ["Oven ist der Ofen in der Küche."]
              - id: l1-s2
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Clock." }
                show: { object: telephone }
                answer: false
                hints: ["Clock ist die Uhr."]
              - id: l1-s3
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Lies die Wörter. Tippe auf ein Wort und dann auf das Bild." }
                pairs:
                  - left: { text: "bed" }
                    right: { object: bed }
                  - left: { text: "chair" }
                    right: { object: chair }
                  - left: { text: "lamp" }
                    right: { object: lamp }
                hints: ["Chair ist der Stuhl."]
              - id: l1-s4
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Telephone." }
                options: [{ object: telephone }, { object: clock }, { object: lamp }]
                answer: telephone
                hints: ["Telephone klingt fast wie Telefon."]
              - id: l1-s5
                type: speak
                say: { de: "Sag es auf Englisch.", en: "Chair." }
                show: { object: chair }
                expected_text: "chair"
                hints: ["Sag mit mir: chair. Am Anfang klingt es wie tsch."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Mirror." }
                options: [{ object: mirror }, { object: lamp }, { object: oven }]
                answer: mirror
              - id: l1-n2
                type: audio_choice
                say: { de: "Hör zu. Tippe auf das Bild." }
                audio: { en: "Bed." }
                options: [{ object: bed }, { object: table }, { object: box }]
                answer: bed
              - id: l1-n3
                type: true_false
                say: { de: "Hör zu. Passt das Bild?", en: "Table." }
                show: { object: table }
                answer: true
              - id: l1-n4
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: { de: "Lies die Wörter. Tippe auf ein Wort und dann auf das Bild." }
                pairs:
                  - left: { text: "table" }
                    right: { object: table }
                  - left: { text: "clock" }
                    right: { object: clock }
                  - left: { text: "oven" }
                    right: { object: oven }
              - id: l1-n5
                type: speak
                say: { de: "Sag es auf Englisch." }
                show: { object: lamp }
                expected_text: "lamp"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Clock." }
            options: [{ object: clock }, { object: telephone }, { object: mirror }]
            answer: clock
          - id: l1-c2
            type: true_false
            say: { de: "Hör zu. Passt das Bild?", en: "Oven." }
            show: { object: bed }
            answer: false
          - id: l1-c3
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Chair." }
            options: [{ object: chair }, { object: bed }, { object: oven }]
            answer: chair

  - n: 2
    title: { de: "Die Zimmer", en: "The rooms" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            say: { de: "Hör zu. Tippe auf das Bild." }
            audio: { en: "Telephone." }
            options: [{ object: telephone }, { object: oven }, { object: chair }]
            answer: telephone
            difficulty: easy
          - id: l2-w2
            type: true_false
            say: { de: "Hör zu. Passt das Bild?", en: "Bed." }
            show: { object: bed }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "kitchen, bathroom, bedroom, living room, garden"
            say: { de: "Das sind die Zimmer. Kitchen ist die Küche, bathroom das Badezimmer, bedroom das Schlafzimmer, living room das Wohnzimmer. Draußen ist der garden, der Garten.", en: "Kitchen. Bathroom. Bedroom. Living room. Garden." }
            show: { object: house }
          - text: "bedroom, bathroom"
            say: { de: "Hör genau hin, die zwei klingen ähnlich. In bedroom steckt bed, das Bett: Das ist das Schlafzimmer. In bathroom steckt bath, die Badewanne: Das ist das Badezimmer.", en: "Bedroom. Bathroom." }
            show: { object: bed }
          - text: "The oven is in the kitchen."
            say: { de: "So sagst du, wo etwas ist: The oven is in the kitchen. Vor dem Zimmer steht immer the.", en: "The oven is in the kitchen." }
            show: { object: oven }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                say: { de: "Hör zu. Welches Zimmer ist das?" }
                audio: { en: "Kitchen." }
                options: ["die Küche", "das Badezimmer", "das Schlafzimmer"]
                answer: "die Küche"
                hints:
                  - "Hör noch einmal: kitchen."
                  - "In diesem Zimmer steht der Ofen."
                  - "Kitchen ist die Küche."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                say: { de: "Hör zu. Wo ist das Bett?" }
                audio: { en: "Where's the bed? It's in the bedroom." }
                options: ["im Schlafzimmer", "im Badezimmer", "in der Küche"]
                answer: "im Schlafzimmer"
                feedback:
                  "im Badezimmer": "Bedroom ist das Schlafzimmer, dort steht das Bett. Das Badezimmer heißt bathroom."
                hints:
                  - "Hör auf das letzte Wort."
                  - "Bedroom: Darin steckt bed."
                  - "Das Bett steht im Schlafzimmer."
              - id: l2-f3
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Der Tisch ist in der Küche." }
                options: ["is", "The table", "the kitchen.", "in"]
                slot_count: 4
                answer: ["The table", "is", "in", "the kitchen."]
                hints:
                  - "Der Satz fängt mit The table an."
                  - "The table is ..."
                  - "The table is in the kitchen."
              - id: l2-f4
                type: multiple_choice
                option_audio: false
                text: "Wo schläfst du?"
                say: { de: "Wo schläfst du? Lies die Antworten." }
                options: ["in the bedroom", "in the kitchen", "in the garden"]
                answer: "in the bedroom"
                hints:
                  - "Wo steht dein Bett?"
                  - "Im Schlafzimmer."
                  - "Schlafzimmer heißt bedroom."
              - id: l2-f5
                type: speak
                say: { de: "Sag auf Englisch: Der Ofen ist in der Küche.", en: "The oven is in the kitchen." }
                show: { object: oven }
                expected_text: "The oven is in the kitchen."
                hints:
                  - "Fang mit The oven an."
                  - "Küche heißt kitchen."
                  - "Sag mit mir: The oven is in the kitchen."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                say: { de: "Hör zu. Welches Zimmer ist das?" }
                audio: { en: "Living room." }
                options: ["das Wohnzimmer", "die Küche", "der Garten"]
                answer: "das Wohnzimmer"
                hints: ["Living kommt von live, wohnen."]
              - id: l2-s2
                type: true_false
                text: "The oven is in the bathroom."
                say: { de: "Lies den Satz. Stimmt das?" }
                answer: false
                hints: ["Wo steht ein Ofen zum Kochen?"]
              - id: l2-s3
                type: audio_choice
                say: { de: "Hör zu. Wo ist das Telefon?" }
                audio: { en: "Mum, where's the telephone? It's in the living room." }
                options: ["im Wohnzimmer", "in der Küche", "im Garten"]
                answer: "im Wohnzimmer"
                hints: ["Hör auf die Antwort von Mama."]
              - id: l2-s4
                type: multiple_choice
                option_audio: false
                text: "Wo kochst du?"
                say: { de: "Wo kochst du? Lies die Antworten." }
                options: ["in the kitchen", "in the bathroom", "in the bedroom"]
                answer: "in the kitchen"
                hints: ["Küche heißt kitchen."]
              - id: l2-s5
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Das Bett ist im Schlafzimmer." }
                options: ["in", "the bedroom.", "The bed", "is"]
                slot_count: 4
                answer: ["The bed", "is", "in", "the bedroom."]
                hints: ["Der Satz fängt mit The bed an."]

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                say: { de: "Hör zu. Welches Zimmer ist das?" }
                audio: { en: "Bathroom." }
                options: ["das Badezimmer", "das Schlafzimmer", "die Küche"]
                answer: "das Badezimmer"
              - id: l2-n2
                type: audio_choice
                say: { de: "Hör zu. Wo ist der Ball?" }
                audio: { en: "Where's my ball? It's in the garden." }
                options: ["im Garten", "im Wohnzimmer", "in der Küche"]
                answer: "im Garten"
              - id: l2-n3
                type: multiple_choice
                option_audio: false
                text: "Wo putzt du dir die Zähne?"
                say: { de: "Wo putzt du dir die Zähne? Lies die Antworten." }
                options: ["in the bathroom", "in the bedroom", "in the living room"]
                answer: "in the bathroom"
              - id: l2-n4
                type: ordering
                option_audio: false
                text: "Bring die Wörter in die richtige Reihenfolge."
                say: { de: "Bau den Satz: Die Lampe ist im Wohnzimmer." }
                options: ["the living room.", "is", "The lamp", "in"]
                slot_count: 4
                answer: ["The lamp", "is", "in", "the living room."]
              - id: l2-n5
                type: true_false
                text: "The bed is in the bedroom."
                say: { de: "Lies den Satz. Stimmt das?" }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: audio_choice
            say: { de: "Hör zu. Welches Zimmer ist das?" }
            audio: { en: "Bedroom." }
            options: ["das Schlafzimmer", "das Badezimmer", "das Wohnzimmer"]
            answer: "das Schlafzimmer"
          - id: l2-c2
            type: audio_choice
            say: { de: "Hör zu. Wo ist die Katze?" }
            audio: { en: "Where's the cat? She's in the kitchen." }
            options: ["in der Küche", "im Badezimmer", "im Garten"]
            answer: "in der Küche"
          - id: l2-c3
            type: ordering
            option_audio: false
            text: "Bring die Wörter in die richtige Reihenfolge."
            say: { de: "Bau den Satz: Der Spiegel ist im Badezimmer." }
            options: ["The mirror", "in", "the bathroom.", "is"]
            slot_count: 4
            answer: ["The mirror", "is", "in", "the bathroom."]
          - id: l2-c4
            type: multiple_choice
            option_audio: false
            text: "Wo badest du?"
            say: { de: "Wo badest du? Lies die Antworten." }
            options: ["in the bathroom", "in the bedroom", "in the kitchen"]
            answer: "in the bathroom"
          - id: l2-c5
            type: true_false
            say: { de: "Hör zu. Passt das Bild?", en: "Lamp." }
            show: { object: lamp }
            answer: true
