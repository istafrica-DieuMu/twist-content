# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.number-puzzles-to-1000
skill: math.numbers-to-1000.number-puzzles
curriculum: de-DE
language: de
title:
  de: Zahlenrätsel bis 1000
  en: Number riddles to 1000
summary: >
  Riddles about place value to 1000. Lesson 1 solves riddles with clues
  about digits and their values; lesson 2 also judges riddles written by
  other children (is there exactly one answer?) and builds the clues for a
  given number, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value]
  also_practises: [math.numbers-to-1000.order-compare, math.numbers-to-1000.round]
  vocabulary: { de: [Rätsel, Hinweis, Hunderterziffer, Zehnerziffer, Einerziffer, eindeutig] }
  forms: [picture, text, audio, drawn]
  drawn: [place-value-chart]
  facets: []
  parts:
    - { id: digits, what: { de: Rätsel mit Hinweisen zu den Ziffern lösen, en: solving riddles with clues about the digits } }
    - { id: relations, what: { de: "Rätsel mit mehr, weniger, Runden und der größten oder kleinsten Zahl lösen", en: "solving riddles with more, less, rounding and the largest or smallest number" } }
    - { id: unique, what: { de: "prüfen, ob ein Rätsel eindeutig ist", en: checking whether a riddle has exactly one answer } }
    - { id: make, what: { de: Hinweise für ein Rätsel zu einer Zahl finden, en: finding the clues for a riddle about a number } }
  misconceptions:
    - id: one-clue
      what: Picks the first number that fits one clue
      addressed: wrong options fit some clues but not all; full-stage feedback names the broken clue
    - id: riddle-has-many-answers
      what: Writes a riddle that many numbers fit
      addressed: lesson 2 asks whether a riddle has exactly one answer and what clue would make it so
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Rätsel lösen, en: Solving riddles }
    goal:
      de: "Löse Zahlenrätsel Hinweis für Hinweis, so wie bei 630, und prüf am Ende jeden Hinweis."
      en: "Solve number riddles clue by clue, like for 630, and check every clue at the end."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Runde 347 auf Hunderter."
            options: ["300", "350", "400"]
            answer: "300"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viel ist die 8 in 586 wert?"
            options: ["8", "80", "800"]
            answer: "80"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was glaubst du? Ich denke an eine Zahl mit 6 Hundertern. Kannst du sie erraten?"
            say: "Ich denke an eine Zahl. Sie hat sechs Hunderter. Was glaubst du: Welche Zahl ist es? Rate mal."
          - text: "1. Die Hunderterziffer ist 6."
            say: "Mit sechs Hundertern gibt es viele Zahlen, von sechshundert bis sechshundertneunundneunzig. Raten ist schwer. Darum hat ein Rätsel mehrere Hinweise. Erster Hinweis: Die Hunderterziffer ist sechs. Das trägst du gleich in die Stellentafel ein."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [6, null, null] }
          - text: "2. Die Zehnerziffer ist halb so groß wie die Hunderterziffer."
            say: "Zweiter Hinweis: Die Zehnerziffer ist halb so groß wie die Hunderterziffer. Die Hälfte von sechs ist drei."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [6, 3, null] }
          - text: "3. Die Einerziffer ist 0.  → 630"
            say: "Dritter Hinweis: Die Einerziffer ist null. Die Zahl ist sechshundertdreißig. Prüfe zum Schluss jeden Hinweis noch einmal."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [6, 3, 0] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Die Hunderterziffer ist 4, die Zehnerziffer 0, die Einerziffer 7."
                say: "Die Hunderterziffer ist 4, die Zehnerziffer 0, die Einerziffer 7. Welche Zahl ist es?"
                options: ["47", "407", "470"]
                answer: "407"
                hints:
                  - "Trag jede Ziffer in ihre Spalte ein."
                  - "H: 4, Z: 0, E: 7."
                  - "Die Zahl ist 407."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Meine Zahl liegt zwischen 500 und 600. Die Zehnerziffer ist 9. Die Einerziffer ist 1."
                say: "Meine Zahl liegt zwischen 500 und 600. Die Zehnerziffer ist 9. Die Einerziffer ist 1. Welche Zahl ist es?"
                options: ["591", "519", "691"]
                answer: "591"
                feedback:
                  "691": "691 hat die richtigen Zehner und Einer, liegt aber nicht zwischen 500 und 600."
                hints:
                  - "Zwischen 500 und 600 ist die Hunderterziffer 5."
                  - "5 Hunderter, 9 Zehner, 1 Einer."
                  - "Die Zahl ist 591."
              - id: l1-f3
                type: multiple_choice
                text: "Alle drei Ziffern sind gleich. Die Zahl ist größer als 700 und kleiner als 800."
                say: "Alle drei Ziffern sind gleich. Die Zahl ist größer als 700 und kleiner als 800. Welche Zahl ist es?"
                options: ["666", "777", "888"]
                answer: "777"
                hints:
                  - "Zwischen 700 und 800: Hunderterziffer 7."
                  - "Alle Ziffern gleich."
                  - "777."
              - id: l1-f4
                type: text_input
                text: "Meine Zahl ist 10 mehr als 395."
                answer: "405"
                hints:
                  - "Zehn mehr heißt: einen Zehner dazu."
                  - "395 und 10. Über den Hunderter."
                  - "Das ist 405."
              - id: l1-f5
                type: multiple_choice
                text: "Gerundet auf Hunderter ist meine Zahl 300. Die Zehnerziffer ist 6. Die Einerziffer ist 2."
                say: "Gerundet auf Hunderter ist meine Zahl 300. Die Zehnerziffer ist 6. Die Einerziffer ist 2. Welche Zahl ist es?"
                options: ["262", "362", "326"]
                answer: "262"
                feedback:
                  "362": "362 hat die richtigen Zehner und Einer, aber gerundet ist es 400."
                hints:
                  - "Welche Zahlen werden auf 300 gerundet? Von 250 bis 349."
                  - "Zehnerziffer 6 passt nur zu 2 Hundertern: 26_."
                  - "Die Zahl ist 262."
              - id: l1-f6
                type: multiple_choice
                text: "Meine Zahl ist die größte dreistellige Zahl mit lauter verschiedenen Ziffern."
                say: "Meine Zahl ist die größte dreistellige Zahl mit lauter verschiedenen Ziffern. Welche Zahl ist es?"
                options: ["999", "987", "789"]
                answer: "987"
                hints:
                  - "Die Ziffern dürfen sich nicht wiederholen."
                  - "Nimm vorne die größte Ziffer, dann die nächstgrößere."
                  - "9, 8, 7: Die Zahl ist 987."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Die Hunderterziffer ist 8, die Zehnerziffer 5, die Einerziffer 0."
                say: "Die Hunderterziffer ist 8, die Zehnerziffer 5, die Einerziffer 0. Welche Zahl ist es?"
                options: ["805", "850", "85"]
                answer: "850"
                hints: ["H: 8, Z: 5, E: 0."]
              - id: l1-s2
                type: multiple_choice
                text: "Meine Zahl liegt zwischen 200 und 300. Die Zehnerziffer ist 4. Die Einerziffer ist 4."
                say: "Meine Zahl liegt zwischen 200 und 300. Die Zehnerziffer ist 4. Die Einerziffer ist 4. Welche Zahl ist es?"
                options: ["244", "344", "424"]
                answer: "244"
                hints: ["Hunderterziffer 2."]
              - id: l1-s3
                type: text_input
                text: "Die Eule sagt: „Meine Zahl ist 100 weniger als 1000.“"
                say: "Die Eule sagt: Meine Zahl ist hundert weniger als tausend. Welche Zahl ist es?"
                show: { object: owl }
                answer: "900"
                hints: ["Einen Hunderter weniger."]
              - id: l1-s4
                type: multiple_choice
                text: "Die Einerziffer ist um 3 größer als die Zehnerziffer. Die Zahl liegt zwischen 120 und 130."
                say: "Die Einerziffer ist um 3 größer als die Zehnerziffer. Die Zahl liegt zwischen 120 und 130. Welche Zahl ist es?"
                options: ["125", "124", "128"]
                answer: "125"
                hints: ["Zehnerziffer 2, Einerziffer 2 + 3."]
              - id: l1-s5
                type: multiple_choice
                text: "Gerundet auf Zehner ist meine Zahl 480. Sie ist gerade und größer als 482."
                say: "Gerundet auf Zehner ist meine Zahl 480. Sie ist gerade und größer als 482. Welche Zahl ist es?"
                options: ["482", "484", "486"]
                answer: "484"
                hints: ["Welche Zahlen werden auf 480 gerundet? Von 475 bis 484. Dann prüf jede."]
              - id: l1-s6
                type: multiple_choice
                text: "Meine Zahl ist die kleinste dreistellige Zahl."
                say: "Meine Zahl ist die kleinste dreistellige Zahl. Welche Zahl ist es?"
                options: ["100", "101", "111"]
                answer: "100"
                hints: ["Drei Stellen, so klein wie möglich."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Die Hunderterziffer ist 3, die Zehnerziffer 0, die Einerziffer 9."
                say: "Die Hunderterziffer ist 3, die Zehnerziffer 0, die Einerziffer 9. Welche Zahl ist es?"
                options: ["390", "309", "39"]
                answer: "309"
              - id: l1-n2
                type: multiple_choice
                text: "Meine Zahl liegt zwischen 900 und 1000. Die Zehnerziffer ist 1. Die Einerziffer ist 8."
                say: "Meine Zahl liegt zwischen 900 und 1000. Die Zehnerziffer ist 1. Die Einerziffer ist 8. Welche Zahl ist es?"
                options: ["918", "981", "818"]
                answer: "918"
              - id: l1-n3
                type: text_input
                text: "Der Fuchs sagt: „Meine Zahl ist 1 weniger als 600.“"
                say: "Der Fuchs sagt: Meine Zahl ist eins weniger als sechshundert. Welche Zahl ist es?"
                show: { object: fox }
                answer: "599"
              - id: l1-n4
                type: multiple_choice
                text: "Alle Ziffern sind gleich. Gerundet auf Hunderter ist die Zahl 200."
                say: "Alle Ziffern sind gleich. Gerundet auf Hunderter ist die Zahl 200. Welche Zahl ist es?"
                options: ["111", "222", "333"]
                answer: "222"
              - id: l1-n5
                type: multiple_choice
                text: "Die Zehnerziffer ist doppelt so groß wie die Einerziffer. Die Zahl liegt zwischen 540 und 550."
                say: "Die Zehnerziffer ist doppelt so groß wie die Einerziffer. Die Zahl liegt zwischen 540 und 550. Welche Zahl ist es?"
                options: ["542", "548", "524"]
                answer: "542"
              - id: l1-n6
                type: multiple_choice
                text: "Meine Zahl ist die kleinste dreistellige Zahl mit lauter verschiedenen Ziffern."
                say: "Meine Zahl ist die kleinste dreistellige Zahl mit lauter verschiedenen Ziffern. Welche Zahl ist es?"
                options: ["100", "102", "123"]
                answer: "102"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Die Hunderterziffer ist 7, die Zehnerziffer 2, die Einerziffer 0."
            say: "Die Hunderterziffer ist 7, die Zehnerziffer 2, die Einerziffer 0. Welche Zahl ist es?"
            options: ["702", "720", "72"]
            answer: "720"
          - id: l1-c2
            type: multiple_choice
            text: "Meine Zahl liegt zwischen 600 und 700. Die Zehnerziffer ist 3. Die Einerziffer ist 5."
            say: "Meine Zahl liegt zwischen 600 und 700. Die Zehnerziffer ist 3. Die Einerziffer ist 5. Welche Zahl ist es?"
            options: ["635", "653", "735"]
            answer: "635"
          - id: l1-c3
            type: text_input
            text: "Meine Zahl ist 10 weniger als 500."
            answer: "490"
          - id: l1-c4
            type: multiple_choice
            text: "Die Hunderterziffer ist 6, die Zehnerziffer 1, die Einerziffer 0."
            say: "Die Hunderterziffer ist sechs, die Zehnerziffer eins, die Einerziffer null. Welche Zahl ist es?"
            options: ["601", "610", "61"]
            answer: "610"
          - id: l1-c5
            type: text_input
            text: "Meine Zahl ist 100 mehr als 899."
            say: "Meine Zahl ist hundert mehr als achthundertneunundneunzig. Welche Zahl ist es?"
            answer: "999"
          - id: l1-c6
            type: multiple_choice
            text: "Alle drei Ziffern sind gleich. Gerundet auf Hunderter ist die Zahl 900."
            say: "Alle drei Ziffern sind gleich. Gerundet auf Hunderter ist die Zahl neunhundert. Welche Zahl ist es?"
            options: ["777", "888", "999"]
            answer: "888"

  - n: 2
    title: { de: Rätsel prüfen und erfinden, en: Checking and making riddles }
    goal:
      de: "Prüf, ob ein Rätsel nur eine Lösung hat, und erfinde Hinweise für eine Zahl, so wie für 736."
      en: "Check whether a riddle has only one answer, and make up clues for a number, like 736."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Meine Zahl liegt zwischen 300 und 400. Die Zehnerziffer ist 8. Die Einerziffer ist 2."
            say: "Meine Zahl liegt zwischen 300 und 400. Die Zehnerziffer ist 8. Die Einerziffer ist 2. Welche Zahl ist es?"
            options: ["382", "328", "482"]
            answer: "382"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Meine Zahl ist 100 mehr als 450."
            answer: "550"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du? Mila sagt: „Meine Zahl liegt zwischen 400 und 500.“ Kannst du ihre Zahl sicher finden?"
            say: "Mila hat ein Rätsel erfunden. Meine Zahl liegt zwischen vierhundert und fünfhundert. Was glaubst du: Kannst du ihre Zahl sicher finden?"
          - text: "Meine Zahl liegt zwischen 400 und 500."
            say: "Leider nicht. Mila hat ein Rätsel erfunden: Meine Zahl liegt zwischen vierhundert und fünfhundert. Das passt auf viele Zahlen: vierhundertzwölf, vierhundertachtzig und noch mehr. Das Rätsel ist nicht eindeutig."
          - text: "+ Die Zehnerziffer ist 0. Die Einerziffer ist 5."
            say: "Mit zwei Hinweisen mehr bleibt nur eine Zahl: vierhundertfünf. Jetzt ist das Rätsel eindeutig."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [4, 0, 5] }
          - text: "Ein Rätsel für 736"
            say: "So erfindest du ein Rätsel: Nimm eine Zahl, zum Beispiel siebenhundertsechsunddreißig. Gib für jede Stelle einen Hinweis: Sie liegt zwischen siebenhundert und achthundert. Die Zehnerziffer ist drei. Die Einerziffer ist doppelt so groß wie die Zehnerziffer."
          - text: "Wusstest du? 121, 343 und 909 kannst du vorwärts und rückwärts lesen. Solche Zahlen heißen Palindrome. Von 100 bis 999 gibt es genau 90 davon."
            say: "Wusstest du? Hunderteinundzwanzig, dreihundertdreiundvierzig und neunhundertneun sehen vorwärts und rückwärts gleich aus. Solche Zahlen heißen Palindrome. Von hundert bis neunhundertneunundneunzig gibt es genau neunzig davon. Vielleicht ist das ein Hinweis für dein nächstes Rätsel."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Ist das Rätsel eindeutig? Meine Zahl ist gerade und liegt zwischen 200 und 300."
                answer: false
                hints:
                  - "Finde zwei Zahlen, die passen."
                  - "202 und 204 passen beide."
                  - "Nein, viele Zahlen passen."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Ist das Rätsel eindeutig? Die Hunderterziffer ist 5, die Zehnerziffer 5, die Einerziffer 1."
                answer: true
                hints:
                  - "Jede Stelle hat einen Hinweis."
                  - "Es passt nur 551."
                  - "Ja, eindeutig."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Hinweis macht das Rätsel eindeutig? Meine Zahl liegt zwischen 800 und 900. Die Einerziffer ist 0."
                options: ["Sie ist gerade.", "Die Zehnerziffer ist 4.", "Sie ist größer als 800."]
                answer: "Die Zehnerziffer ist 4."
                hints:
                  - "Welche Stelle hat noch keinen Hinweis?"
                  - "Die Zehnerziffer fehlt."
                  - "Mit der Zehnerziffer 4 passt nur 840."
              - id: l2-f4
                type: fill_in_blank
                text: "Ergänze das Rätsel für 263."
                frame: "Die Hunderterziffer ist _. Die Zehnerziffer ist _. Die Einerziffer ist _."
                options: ["2", "3", "6", "26"]
                answer: ["2", "6", "3"]
                hints:
                  - "Trag 263 in die Stellentafel ein."
                  - "H: 2, Z: 6, E: 3."
                  - "2, 6, 3."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Rätsel passt zu 909?"
                options: ["Alle Ziffern sind 9.", "Hunderter- und Einerziffer sind 9, die Zehnerziffer ist 0.", "Die Zahl liegt zwischen 800 und 900.", "Die Zahl kann bellen."]
                answer: "Hunderter- und Einerziffer sind 9, die Zehnerziffer ist 0."
                feedback:
                  "Die Zahl kann bellen.": "Wuff! Zahlen können nicht bellen. Prüfe jedes Rätsel mit 909."
                hints:
                  - "Prüfe jedes Rätsel mit 909."
                  - "909 hat eine 0 bei den Zehnern."
                  - "Hunderter- und Einerziffer 9, Zehnerziffer 0."
              - id: l2-f6
                type: multiple_choice
                text: "Meine Zahl ist eine Hunderterzahl. Gerundet auf Hunderter bleibt sie gleich. Sie ist größer als 600 und kleiner als 800."
                say: "Meine Zahl ist eine Hunderterzahl. Gerundet auf Hunderter bleibt sie gleich. Sie ist größer als 600 und kleiner als 800. Welche Zahl ist es?"
                options: ["650", "700", "750"]
                answer: "700"
                hints:
                  - "Eine Hunderterzahl endet mit 00."
                  - "Zwischen 600 und 800 gibt es nur eine."
                  - "700."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Ist das Rätsel eindeutig? Meine Zahl hat die Zehnerziffer 7."
                answer: false
                hints: ["Finde zwei Zahlen, die passen."]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Hinweis macht das Rätsel eindeutig? Die Hunderterziffer ist 3. Die Zehnerziffer ist 3."
                options: ["Die Einerziffer ist 3.", "Sie ist ungerade.", "Sie ist kleiner als 400."]
                answer: "Die Einerziffer ist 3."
                hints: ["Welche Stelle fehlt?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Ergänze das Rätsel für 518."
                frame: "Die Hunderterziffer ist _. Die Zehnerziffer ist _. Die Einerziffer ist _."
                options: ["1", "5", "8", "51"]
                answer: ["5", "1", "8"]
                hints: ["H: 5, Z: 1, E: 8."]
              - id: l2-s4
                type: multiple_choice
                text: "Welches Rätsel passt zu 440?"
                options: ["Hunderter- und Zehnerziffer sind gleich, die Einerziffer ist 0.", "Alle Ziffern sind gleich.", "Die Zahl ist ungerade."]
                answer: "Hunderter- und Zehnerziffer sind gleich, die Einerziffer ist 0."
                hints: ["Prüfe mit 440."]
              - id: l2-s5
                type: multiple_choice
                text: "Meine Zahl ist 1 mehr als die größte zweistellige Zahl."
                say: "Meine Zahl ist 1 mehr als die größte zweistellige Zahl. Welche Zahl ist es?"
                options: ["99", "100", "101"]
                answer: "100"
                hints: ["Die größte zweistellige Zahl ist 99."]
              - id: l2-s6
                type: true_false
                text: "Ist das Rätsel eindeutig? Meine Zahl liegt zwischen 670 und 680 und hat die Einerziffer 4."
                answer: true
                hints: ["Welche Zahl zwischen 670 und 680 hat 4 Einer?"]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "Ist das Rätsel eindeutig? Meine Zahl ist ungerade und liegt zwischen 100 und 200."
                answer: false
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Hinweis macht das Rätsel eindeutig? Meine Zahl liegt zwischen 900 und 1000. Die Zehnerziffer ist 5."
                options: ["Die Einerziffer ist 2.", "Sie ist gerade.", "Sie ist größer als 950."]
                answer: "Die Einerziffer ist 2."
              - id: l2-n3
                type: fill_in_blank
                text: "Ergänze das Rätsel für 607."
                frame: "Die Hunderterziffer ist _. Die Zehnerziffer ist _. Die Einerziffer ist _."
                options: ["0", "6", "7", "67"]
                answer: ["6", "0", "7"]
              - id: l2-n4
                type: multiple_choice
                text: "Welches Rätsel passt zu 123?"
                options: ["Jede Ziffer ist um 1 größer als die Ziffer davor.", "Alle Ziffern sind gleich.", "Die Zahl ist gerade."]
                answer: "Jede Ziffer ist um 1 größer als die Ziffer davor."
              - id: l2-n5
                type: multiple_choice
                text: "Meine Zahl ist 1 weniger als die kleinste vierstellige Zahl."
                say: "Meine Zahl ist 1 weniger als die kleinste vierstellige Zahl. Welche Zahl ist es?"
                options: ["999", "1000", "1001"]
                answer: "999"
              - id: l2-n6
                type: true_false
                text: "Ist das Rätsel eindeutig? Die Hunderterziffer ist 2, die Einerziffer ist 9."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: digits
            type: multiple_choice
            text: "Die Hunderterziffer ist 5, die Zehnerziffer 0, die Einerziffer 4."
            say: "Die Hunderterziffer ist fünf, die Zehnerziffer null, die Einerziffer vier. Welche Zahl ist es?"
            options: ["540", "504", "54"]
            answer: "504"
          - id: l2-c2
            part: digits
            type: multiple_choice
            text: "Meine Zahl liegt zwischen 800 und 900. Die Zehnerziffer ist 6. Die Einerziffer ist 6."
            say: "Meine Zahl liegt zwischen achthundert und neunhundert. Die Zehnerziffer ist sechs. Die Einerziffer ist sechs. Welche Zahl ist es?"
            options: ["866", "686", "966"]
            answer: "866"
          - id: l2-c3
            part: relations
            type: text_input
            text: "Meine Zahl ist 10 mehr als 690."
            answer: "700"
          - id: l2-c4
            part: unique
            type: true_false
            text: "Ist das Rätsel eindeutig? Meine Zahl ist eine Zehnerzahl zwischen 300 und 400."
            answer: false
          - id: l2-c5
            part: unique
