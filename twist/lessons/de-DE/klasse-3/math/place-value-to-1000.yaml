# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.place-value-to-1000
skill: math.numbers-to-1000.place-value
curriculum: de-DE
language: de
title:
  de: Die Stellentafel bis 1000
  en: The place-value chart to 1000
summary: >
  Three-digit numbers in the Stellentafel (H, Z, E) and the value of each
  digit: in 352 the 5 is worth 50. Lesson 1 enters numbers in the chart;
  lesson 2 names what each digit is worth, splits numbers into Hunderter,
  Zehner and Einer, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.hundreds]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { de: [Stellentafel, Stelle, Ziffer, Wert, Hunderter, Zehner, Einer, zerlegen] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart, base-ten]
  facets: []
  misconceptions:
    - id: digit-is-value
      what: Says the 5 in 352 is worth 5
      addressed: lesson 2 Learn says the 5 in 352 is worth five tens, fifty, and shows it with blocks
    - id: empty-column
      what: Leaves a column empty instead of writing 0 (writes 47 for 4 H, 0 Z, 7 E)
      addressed: both lessons set numbers with a 0 in the middle; feedback in the full stage names the empty column
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "H, Z und E", en: "H, T and O" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, hundreds: 2, tens: 4, ones: 1 }
            options: ["241", "142", "7"]
            answer: "241"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "300 + 50 + 6 = _"
            answer: "356"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "H | Z | E"
            say: "Die Stellentafel bekommt eine neue Spalte: H für Hunderter. Sie steht links von den Zehnern."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [null, null, null] }
          - text: "4 H, 1 Z, 6 E"
            say: "Vier Hunderter, ein Zehner, sechs Einer. Jede Ziffer kommt in ihre Spalte."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [4, 1, 6] }
          - text: "416"
            say: "Von links gelesen: vierhundertsechzehn. Die Ziffern stehen in derselben Reihenfolge wie in der Tafel."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 5, 2] }
                options: ["352", "253", "325"]
                answer: "352"
                hints:
                  - "Lies die Tafel von links nach rechts."
                  - "3 Hunderter, 5 Zehner, 2 Einer."
                  - "Die Zahl ist 352."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Trag 647 ein."
                frame: "H: _  Z: _  E: _"
                options: ["4", "6", "7", "64"]
                answer: ["6", "4", "7"]
                hints:
                  - "Die erste Ziffer gehört zu H."
                  - "6 bei H, 4 bei Z."
                  - "H: 6, Z: 4, E: 7."
              - id: l1-f3
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [5, 0, 8] }
                options: ["58", "508", "580"]
                answer: "508"
                feedback:
                  "58": "Es gibt 5 Hunderter. Die 0 bei Z musst du mitschreiben."
                hints:
                  - "Bei Z steht eine 0."
                  - "5 Hunderter, keine Zehner, 8 Einer."
                  - "Die Zahl ist 508."
              - id: l1-f4
                type: fill_in_blank
                text: "Wie viele H, Z und E? Trag sie ein."
                show: { drawn: base-ten, hundreds: 2, tens: 7, ones: 3 }
                frame: "H: _  Z: _  E: _"
                options: ["2", "3", "7", "27"]
                answer: ["2", "7", "3"]
                hints:
                  - "Platten sind Hunderter."
                  - "2 Platten, 7 Stangen, 3 Würfel."
                  - "H: 2, Z: 7, E: 3."
              - id: l1-f5
                type: image_multiple_choice
                text: "Welche Stellentafel zeigt 730?"
                options:
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [7, 0, 3] }
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [7, 3, 0] }
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [0, 7, 3] }
                answer: "730"
                hints:
                  - "730 hat 7 Hunderter."
                  - "Und 3 Zehner, keine Einer."
                  - "H: 7, Z: 3, E: 0."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? In der Tafel steht H: 9, Z: 1, E: 4. Das ist 914."
                answer: true
                hints:
                  - "Lies von links."
                  - "9 Hunderter, 1 Zehner, 4 Einer."
                  - "Ja, 914."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [1, 9, 6] }
                options: ["196", "691", "169"]
                answer: "196"
                hints: ["Von links nach rechts."]
              - id: l1-s2
                type: fill_in_blank
                text: "Trag 380 ein."
                frame: "H: _  Z: _  E: _"
                options: ["0", "3", "8", "38"]
                answer: ["3", "8", "0"]
                hints: ["Keine Einer: 0."]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [6, 0, 0] }
                options: ["6", "60", "600"]
                answer: "600"
                hints: ["Die 6 steht bei H."]
              - id: l1-s4
                type: fill_in_blank
                text: "Wie viele H, Z und E? Trag sie ein."
                show: { drawn: base-ten, hundreds: 4, tens: 0, ones: 5 }
                frame: "H: _  Z: _  E: _"
                options: ["0", "4", "5", "45"]
                answer: ["4", "0", "5"]
                hints: ["Keine Stangen."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Welche Stellentafel zeigt 209?"
                options:
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [2, 9, 0] }
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [2, 0, 9] }
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [9, 0, 2] }
                answer: "209"
                hints: ["209 hat keine Zehner."]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? In der Tafel steht H: 4, Z: 0, E: 7. Das ist 47."
                answer: false
                hints: ["Es gibt 4 Hunderter."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [8, 2, 5] }
                options: ["825", "528", "852"]
                answer: "825"
              - id: l1-n2
                type: fill_in_blank
                text: "Trag 961 ein."
                frame: "H: _  Z: _  E: _"
                options: ["1", "6", "9", "96"]
                answer: ["9", "6", "1"]
              - id: l1-n3
                type: multiple_choice
                text: "Welche Zahl steht in der Stellentafel?"
                show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [7, 0, 1] }
                options: ["71", "701", "710"]
                answer: "701"
              - id: l1-n4
                type: fill_in_blank
                text: "Wie viele H, Z und E? Trag sie ein."
                show: { drawn: base-ten, hundreds: 3, tens: 6, ones: 8 }
                frame: "H: _  Z: _  E: _"
                options: ["3", "8", "6", "36"]
                answer: ["3", "6", "8"]
              - id: l1-n5
                type: image_multiple_choice
                text: "Welche Stellentafel zeigt 450?"
                options:
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [4, 5, 0] }
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [4, 0, 5] }
                  - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [5, 4, 0] }
                answer: "450"
              - id: l1-n6
                type: true_false
                text: "Stimmt das? In der Tafel steht H: 1, Z: 0, E: 0. Das ist 100."
                answer: true

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Zahl steht in der Stellentafel?"
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [2, 6, 4] }
            options: ["264", "462", "246"]
            answer: "264"
          - id: l1-c2
            type: fill_in_blank
            text: "Trag 805 ein."
            frame: "H: _  Z: _  E: _"
            options: ["0", "5", "8", "85"]
            answer: ["8", "0", "5"]
          - id: l1-c3
            type: image_multiple_choice
            text: "Welche Stellentafel zeigt 390?"
            options:
              - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 0, 9] }
              - { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 9, 0] }
            answer: "390"

  - n: 2
    title: { de: "Was ist die Ziffer wert?", en: "What is the digit worth?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Zahl steht in der Stellentafel?"
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [5, 3, 1] }
            options: ["531", "135", "513"]
            answer: "531"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Trag 270 ein."
            frame: "H: _  Z: _  E: _"
            options: ["0", "2", "7", "27"]
            answer: ["2", "7", "0"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "352"
            say: "In dreihundertzweiundfünfzig steht die Fünf bei den Zehnern. Sie ist also nicht fünf wert, sondern fünf Zehner: fünfzig."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 5, 2] }
          - text: "352 = 300 + 50 + 2"
            say: "So zerlegen wir die Zahl: dreihundert plus fünfzig plus zwei. Jede Ziffer zeigt ihren Wert."
            show: { drawn: base-ten, hundreds: 3, tens: 5, ones: 2 }
          - text: "525"
            say: "Bei fünfhundertfünfundzwanzig gibt es zwei Fünfen. Die linke ist fünfhundert wert, die rechte nur fünf. Die Stelle bestimmt den Wert."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [5, 2, 5] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viel ist die 4 in 247 wert?"
                options: ["4", "40", "400"]
                answer: "40"
                feedback:
                  "4": "Die 4 steht bei den Zehnern. Sie ist vier Zehner wert."
                hints:
                  - "An welcher Stelle steht die 4?"
                  - "Die 4 steht bei Z: vier Zehner."
                  - "Vier Zehner sind 40."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Zerlege 683."
                frame: "683 = _ + _ + _"
                options: ["3", "8", "80", "600"]
                answer: ["600", "80", "3"]
                hints:
                  - "Jede Ziffer hat ihren Wert."
                  - "6 Hunderter, 8 Zehner, 3 Einer."
                  - "600 + 80 + 3."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viel ist die 7 in 719 wert?"
                options: ["7", "70", "700"]
                answer: "700"
                hints:
                  - "Die 7 steht ganz links."
                  - "Ganz links stehen die Hunderter."
                  - "Sie ist 700 wert."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? In 395 ist die 9 neunzig wert."
                answer: true
                hints:
                  - "Wo steht die 9?"
                  - "Bei den Zehnern."
                  - "Ja, neun Zehner sind 90."
              - id: l2-f5
                type: fill_in_blank
                text: "Zerlege 506."
                frame: "506 = _ + _"
                options: ["5", "6", "50", "500"]
                answer: ["500", "6"]
                feedback:
                  "50": "Die 5 steht bei H. Sie ist fünfhundert wert. Bei Z steht die 0."
                hints:
                  - "Es gibt keine Zehner."
                  - "5 Hunderter und 6 Einer."
                  - "500 + 6."
              - id: l2-f6
                type: multiple_choice
                text: "In welcher Zahl ist die 3 dreihundert wert?"
                options: ["123", "231", "312"]
                answer: "312"
                hints:
                  - "Die 3 muss bei den Hundertern stehen."
                  - "Hunderter stehen ganz links."
                  - "In 312 steht die 3 ganz links."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viel ist die 8 in 382 wert?"
                options: ["8", "80", "800"]
                answer: "80"
                hints: ["An welcher Stelle steht die 8?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Zerlege 471."
                frame: "471 = _ + _ + _"
                options: ["1", "7", "70", "400"]
                answer: ["400", "70", "1"]
                hints: ["4 H, 7 Z, 1 E."]
              - id: l2-s3
                type: text_input
                text: "800 + 6 = _"
                answer: "806"
                hints: ["Keine Zehner: dort steht 0."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? In 641 ist die 6 sechzig wert."
                answer: false
                hints: ["Die 6 steht ganz links."]
              - id: l2-s5
                type: multiple_choice
                text: "In welcher Zahl ist die 5 fünfzig wert?"
                options: ["509", "950", "195"]
                answer: "950"
                hints: ["Die 5 muss bei den Zehnern stehen."]
              - id: l2-s6
                type: multiple_choice
                text: "Wie viel ist die 2 in 902 wert?"
                options: ["2", "20", "200"]
                answer: "2"
                hints: ["Die 2 steht ganz rechts."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viel ist die 6 in 165 wert?"
                options: ["6", "60", "600"]
                answer: "60"
              - id: l2-n2
                type: fill_in_blank
                text: "Zerlege 928."
                frame: "928 = _ + _ + _"
                options: ["8", "2", "20", "900"]
                answer: ["900", "20", "8"]
              - id: l2-n3
                type: text_input
                text: "700 + 40 = _"
                answer: "740"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? In 333 sind alle drei Ziffern gleich viel wert."
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "In welcher Zahl ist die 1 hundert wert?"
                options: ["410", "104", "641"]
                answer: "104"
              - id: l2-n6
                type: fill_in_blank
                text: "Zerlege 360."
                frame: "360 = _ + _"
                options: ["6", "60", "300", "30"]
                answer: ["300", "60"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welche Zahl steht in der Stellentafel?"
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [6, 0, 9] }
            options: ["69", "609", "690"]
            answer: "609"
          - id: l2-c2
            type: fill_in_blank
            text: "Wie viele H, Z und E? Trag sie ein."
            show: { drawn: base-ten, hundreds: 1, tens: 5, ones: 7 }
            frame: "H: _  Z: _  E: _"
            options: ["1", "5", "7", "15"]
            answer: ["1", "5", "7"]
          - id: l2-c3
            type: multiple_choice
            text: "Wie viel ist die 9 in 493 wert?"
            options: ["9", "90", "900"]
            answer: "90"
          - id: l2-c4
            type: fill_in_blank
            text: "Zerlege 754."
            frame: "754 = _ + _ + _"
            options: ["4", "5", "50", "700"]
            answer: ["700", "50", "4"]
          - id: l2-c5
            type: multiple_choice
            text: "In welcher Zahl ist die 4 vierhundert wert?"
            options: ["348", "481", "734"]
            answer: "481"
