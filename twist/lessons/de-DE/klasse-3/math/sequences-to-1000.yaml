            say: "Wie heißt die Regel? Von dreihundertzwölf zu dreihundertsiebenunddreißig sind es fünfundzwanzig mehr."
          - text: "+25"
            say: "Prüfe jeden Schritt: dreihundertsiebenunddreißig und fünfundzwanzig sind dreihundertzweiundsechzig, und so weiter. Erst wenn die Regel bei allen Schritten stimmt, ist sie richtig."
          - text: "Regel: immer 50 weniger"
            say: "Eine Regel erklärst du so: Sag, ob die Zahlen größer oder kleiner werden und um wie viel. Zum Beispiel: immer fünfzig weniger."

