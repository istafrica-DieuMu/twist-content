                options: ["616", "620", "625"]
                answer: "620"
                hints:
                  - "Wie groß ist der Schritt?"
                  - "Immer fünf mehr."
                  - "615 und 5 sind 620."
              - id: l1-f6
                type: fill_in_blank
                text: "Wie geht es weiter?"
                frame: "100, 125, 150, _ , _"
                options: ["155", "175", "200", "225"]
                answer: ["175", "200"]
                hints:
                  - "Wie groß ist der Schritt von 100 zu 125?"
                  - "Immer fünfundzwanzig mehr."
