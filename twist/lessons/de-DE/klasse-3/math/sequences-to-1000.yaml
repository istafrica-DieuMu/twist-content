# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.sequences-to-1000
skill: math.numbers-to-1000.sequences
curriculum: de-DE
language: de
title:
  de: Zahlenfolgen bis 1000
  en: Number sequences to 1000
summary: >
  Counting in steps (2, 5, 10, 20, 25, 30, 50, 100 and 200) from any start, across
  hundreds, and explaining the rule of a sequence. Lesson 1 continues
  sequences, including steps across a hundred (390, 400, 410); lesson 2
  finds and explains rules and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.order-compare]
  also_practises: [math.numbers-to-100.sequences]
  vocabulary: { de: [Zahlenfolge, Schritt, Regel, vorwärts, rückwärts, Hunderterübergang] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: []
  parts:
    - { id: continue, what: { de: Zahlenfolgen vorwärts und rückwärts fortsetzen, en: continuing sequences forwards and backwards } }
    - { id: hundred, what: { de: in Schritten über den Hunderter zählen, en: counting in steps across a hundred } }
    - { id: rule, what: { de: die Regel einer Folge finden und erklären, en: finding and explaining the rule of a sequence } }
    - { id: check-rule, what: { de: "prüfen, ob eine Regel bei jedem Schritt stimmt", en: checking that a rule holds at every step } }
  misconceptions:
    - id: hundred-crossing
      what: Continues 380, 390 with 3100 or 300 instead of 400
      addressed: Learn shows the step across the hundred on the number line; feedback on 3100 says that ten tens make a hundred
    - id: rule-from-two
      what: Reads the rule from the first two numbers only
      addressed: lesson 2 asks to check the rule on every step, and one sequence breaks it late
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: In großen Schritten zählen, en: Counting in big steps }
    goal:
      de: "Zähl in großen Schritten weiter, auch über den Hunderter, so wie 380, 390, 400."
      en: "Count on in big steps, across the hundred too, like 380, 390, 400."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "35, 45, 55, _"
            options: ["56", "65", "75"]
            answer: "65"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "200, 300, 400, _"
            options: ["410", "500", "401"]
            answer: "500"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "370, 380, 390, 400"
            say: "In Zehnerschritten über den Hunderter: dreihundertsiebzig, dreihundertachtzig, dreihundertneunzig, vierhundert. Neun Zehner und noch ein Zehner sind zehn Zehner, also ein neuer Hunderter: vierhundert."
            show: { drawn: number-line, from: 300, to: 500, step: 10, labels: ends, jumps: [[370, 10], [380, 10], [390, 10]] }
          - text: "250, 300, 350, 400"
            say: "In Fünfzigerschritten: zweihundertfünfzig, dreihundert, dreihundertfünfzig, vierhundert. Zwei Fünfzigerschritte sind hundert."
          - text: "725, 625, 525"
            say: "Rückwärts in Hunderterschritten: Nur die Hunderterziffer wird kleiner. Zehner und Einer bleiben gleich."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "370, 380, 390, _"
                options: ["3100", "400", "391"]
                answer: "400"
                feedback:
                  "3100": "Zehn Zehner sind ein Hunderter. Nach 390 kommt 400."
                hints:
                  - "Jeder Schritt ist zehn."
                  - "390 und 10: Jetzt sind es zehn Zehner, der nächste Hunderter."
                  - "Nach 390 kommt 400."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "150, 200, 250, _"
                options: ["260", "300", "350"]
                answer: "300"
                hints:
                  - "Wie groß ist der Schritt?"
                  - "Immer fünfzig mehr."
                  - "250 und 50 sind 300."
              - id: l1-f3
                type: fill_in_blank
                text: "Wie geht es weiter?"
                frame: "418, 518, 618, _ , _"
                options: ["619", "718", "818", "628"]
                answer: ["718", "818"]
                hints:
                  - "Welche Ziffer ändert sich?"
                  - "Nur die Hunderterziffer: immer hundert mehr."
                  - "718, 818."
              - id: l1-f4
                type: multiple_choice
                text: "830, 820, 810, _"
