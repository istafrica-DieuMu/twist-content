# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.money-calculate
skill: math.money.calculate
curriculum: de-DE
language: de
title:
  de: Mit Geldbeträgen rechnen
  en: Calculating with money
summary: >
  Lesson 1 adds and subtracts amounts with a Komma, Euro to Euro and Cent
  to Cent, and changes 100 Cent into a Euro (2,60 € + 1,50 € = 4,10 €);
  lesson 2 subtracts with change and multiplies a price (3 · 1,20 € =
  3,60 €), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Geld, en: Money }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.money.decimal-notation, math.add-sub-to-1000.semi-written]
  also_practises: [math.money.decimal-notation, math.add-sub-to-1000.semi-written]
  vocabulary: { de: [Euro, Cent, Komma, zusammen, Rückgeld, umtauschen] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: add, what: { de: Geldbeträge mit Komma addieren, en: adding amounts of money } }
    - { id: sub, what: { de: Geldbeträge mit Komma subtrahieren, en: subtracting amounts of money } }
    - { id: mult, what: { de: einen Preis vervielfachen, en: multiplying a price } }
  misconceptions:
    - id: cent-overflow
      what: Writes more than 99 Cent after the Komma (2,60 € + 1,50 € = 3,110 €)
      addressed: lesson 1 Learn changes 100 Cent into 1 Euro; every stage of lesson 1 has an addition over 100 Cent with the overflow written as an option, with feedback in l1-f2
    - id: borrow-cent
      what: Subtracts the Cent the wrong way round when there are too few (5,20 € − 1,50 € = 4,30 €)
      addressed: lesson 2 Learn changes a Euro into 100 Cent; every stage of lesson 2 offers the reversed Cent subtraction
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Beträge zusammenrechnen", en: "Adding amounts" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "2,40 € = _ ct"
            say: "Wie viele Cent sind zwei Euro vierzig?"
            answer: "240"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "60 + 50 = _"
            say: "Sechzig plus fünfzig."
            answer: "110"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "2,30 € + 1,40 € = 3,70 €"
            say: "Rechne Euro mit Euro und Cent mit Cent: zwei Euro plus ein Euro sind drei Euro, dreißig Cent plus vierzig Cent sind siebzig Cent. Zusammen drei Euro siebzig."
          - text: "2,60 € + 1,50 € = 3 € 110 ct = 4,10 €"
            say: "Hier sind es sechzig plus fünfzig Cent, also hundertzehn Cent. Hundert Cent tauschst du in einen Euro um. Es bleiben zehn Cent. Zusammen sind es vier Euro zehn."
          - text: "260 ct + 150 ct = 410 ct = 4,10 €"
            say: "Du kannst auch alles in Cent rechnen und am Ende das Komma setzen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "3,20 € + 2,50 € = _"
                say: "Drei Euro zwanzig plus zwei Euro fünfzig."
                options: ["5,70 €", "5,25 €", "57,0 €"]
                answer: "5,70 €"
                hints:
                  - "Euro mit Euro, Cent mit Cent."
                  - "Drei plus zwei Euro, zwanzig plus fünfzig Cent."
                  - "5,70 €."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "1,80 € + 2,40 € = _"
                say: "Ein Euro achtzig plus zwei Euro vierzig."
                options: ["4,20 €", "3,120 €", "3,20 €"]
                answer: "4,20 €"
                feedback:
                  "3,120 €": "Nach dem Komma stehen nur zwei Ziffern. Hundert Cent tauschst du in einen Euro um."
                hints:
                  - "Achtzig plus vierzig Cent: Sind das mehr als hundert?"
                  - "Hundertzwanzig Cent sind ein Euro und zwanzig Cent."
                  - "4,20 €."
              - id: l1-f3
                type: text_input
                text: "2,75 € + 1,25 € = _ €"
                say: "Zwei Euro fünfundsiebzig plus ein Euro fünfundzwanzig. Wie viele ganze Euro sind das?"
                answer: "4"
                hints:
                  - "Fünfundsiebzig plus fünfundzwanzig Cent."
                  - "Das sind hundert Cent, also ein Euro."
                  - "4 €."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 4,60 € + 3,60 € = 8,20 €"
                say: "Vier Euro sechzig plus drei Euro sechzig sind acht Euro zwanzig. Stimmt das?"
                answer: true
                hints:
                  - "Sechzig plus sechzig Cent sind hundertzwanzig Cent."
                  - "Sieben Euro und ein Euro zwanzig."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Ein Heft kostet 1,45 €, ein Stift 0,90 €. Was kostet beides?"
                say: "Ein Heft kostet einen Euro fünfundvierzig, ein Stift neunzig Cent. Was kostet beides zusammen?"
                options: ["2,35 €", "1,135 €", "2,45 €"]
                answer: "2,35 €"
                hints:
                  - "Rechne in Cent: hundertfünfundvierzig plus neunzig."
                  - "Zweihundertfünfunddreißig Cent."
                  - "2,35 €."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "4,10 € + 3,60 € = _"
                say: "Vier Euro zehn plus drei Euro sechzig."
                options: ["7,70 €", "7,16 €", "77,0 €"]
                answer: "7,70 €"
                hints: ["Euro mit Euro, Cent mit Cent."]
              - id: l1-s2
                type: multiple_choice
                text: "2,90 € + 1,30 € = _"
                say: "Zwei Euro neunzig plus ein Euro dreißig."
                options: ["4,20 €", "3,120 €", "3,20 €"]
                answer: "4,20 €"
                hints: ["Neunzig plus dreißig Cent sind mehr als hundert."]
              - id: l1-s3
                type: text_input
                text: "5,50 € + 2,50 € = _ €"
                say: "Fünf Euro fünfzig plus zwei Euro fünfzig. Wie viele ganze Euro sind das?"
                answer: "8"
                hints: ["Fünfzig plus fünfzig Cent."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 6,70 € + 1,40 € = 7,110 €"
                say: "Sechs Euro siebzig plus ein Euro vierzig sind sieben Komma eins eins null Euro. Stimmt das?"
                answer: false
                hints: ["Können nach dem Komma drei Ziffern stehen?"]
              - id: l1-s5
                type: multiple_choice
                text: "Ein Brot kostet 2,85 €, Butter 1,79 €. Was kostet beides?"
                say: "Ein Brot kostet zwei Euro fünfundachtzig, Butter einen Euro neunundsiebzig. Was kostet beides zusammen?"
                options: ["4,64 €", "3,164 €", "4,54 €"]
                answer: "4,64 €"
                hints: ["Rechne in Cent."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "6,30 € + 2,45 € = _"
                say: "Sechs Euro dreißig plus zwei Euro fünfundvierzig."
                options: ["8,75 €", "8,48 €", "87,5 €"]
                answer: "8,75 €"
              - id: l1-n2
                type: multiple_choice
                text: "3,70 € + 4,80 € = _"
                say: "Drei Euro siebzig plus vier Euro achtzig."
                options: ["8,50 €", "7,150 €", "7,50 €"]
                answer: "8,50 €"
              - id: l1-n3
                type: text_input
                text: "1,35 € + 2,65 € = _ €"
                say: "Ein Euro fünfunddreißig plus zwei Euro fünfundsechzig. Wie viele ganze Euro sind das?"
                answer: "4"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 9,90 € + 0,20 € = 10,10 €"
                say: "Neun Euro neunzig plus zwanzig Cent sind zehn Euro zehn. Stimmt das?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Ein Saft kostet 0,89 €, ein Brötchen 0,45 €. Was kostet beides?"
                say: "Ein Saft kostet neunundachtzig Cent, ein Brötchen fünfundvierzig Cent. Was kostet beides zusammen?"
                options: ["1,34 €", "0,134 €", "1,24 €"]
                answer: "1,34 €"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "5,40 € + 2,30 € = _"
            say: "Fünf Euro vierzig plus zwei Euro dreißig."
            options: ["7,70 €", "7,43 €", "77,0 €"]
            answer: "7,70 €"
          - id: l1-c2
            type: multiple_choice
            text: "2,70 € + 3,50 € = _"
            say: "Zwei Euro siebzig plus drei Euro fünfzig."
            options: ["6,20 €", "5,120 €", "5,20 €"]
            answer: "6,20 €"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 1,99 € + 1,01 € = 3,00 €"
            say: "Ein Euro neunundneunzig plus ein Euro und ein Cent sind drei Euro. Stimmt das?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "4,80 € + 1,60 € = _"
            say: "Vier Euro achtzig plus ein Euro sechzig."
            options: ["6,40 €", "5,140 €", "5,40 €"]
            answer: "6,40 €"
          - id: l1-c5
            type: text_input
            text: "3,25 € + 1,75 € = _ €"
            say: "Drei Euro fünfundzwanzig plus ein Euro fünfundsiebzig. Wie viele ganze Euro sind das?"
            answer: "5"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 2,55 € + 3,60 € = 5,15 €"
            say: "Zwei Euro fünfundfünfzig plus drei Euro sechzig sind fünf Euro fünfzehn. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Abziehen und vervielfachen", en: "Subtracting and multiplying" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "2,60 € + 1,60 € = _"
            say: "Zwei Euro sechzig plus ein Euro sechzig."
            options: ["4,20 €", "3,120 €", "3,20 €"]
            answer: "4,20 €"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "520 − 150 = _"
            say: "Fünfhundertzwanzig minus hundertfünfzig."
            answer: "370"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5,80 € − 2,30 € = 3,50 €"
            say: "Auch beim Abziehen rechnest du Euro mit Euro und Cent mit Cent: fünf minus zwei Euro, achtzig minus dreißig Cent. Das sind drei Euro fünfzig."
          - text: "5,20 € − 1,50 € = 3,70 €"
            say: "Zwanzig Cent minus fünfzig Cent geht nicht. Tausche einen Euro in hundert Cent um: Aus fünf Euro zwanzig werden vier Euro und hundertzwanzig Cent. Hundertzwanzig minus fünfzig sind siebzig Cent, vier minus eins sind drei Euro. Das Ergebnis ist drei Euro siebzig."
          - text: "3 · 1,20 € = 3,60 €"
            say: "Drei Hefte kosten je einen Euro zwanzig. Dreimal hundertzwanzig Cent sind dreihundertsechzig Cent, also drei Euro sechzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "7,90 € − 3,40 € = _"
                say: "Sieben Euro neunzig minus drei Euro vierzig."
                options: ["4,50 €", "4,30 €", "45,0 €"]
                answer: "4,50 €"
                hints:
                  - "Euro mit Euro, Cent mit Cent."
                  - "Sieben minus drei Euro, neunzig minus vierzig Cent."
                  - "4,50 €."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "6,30 € − 2,60 € = _"
                say: "Sechs Euro dreißig minus zwei Euro sechzig."
                options: ["3,70 €", "4,30 €", "3,30 €"]
                answer: "3,70 €"
                feedback:
                  "4,30 €": "Du hast sechzig minus dreißig gerechnet. Es sind aber nur dreißig Cent da. Tausche einen Euro um."
                hints:
                  - "Dreißig minus sechzig Cent geht nicht. Was machst du?"
                  - "Tausche einen Euro um: fünf Euro und hundertdreißig Cent."
                  - "3,70 €."
              - id: l2-f3
                type: multiple_choice
                text: "4 · 1,50 € = _"
                say: "Vier mal ein Euro fünfzig."
                options: ["6,00 €", "4,50 €", "4,200 €"]
                answer: "6,00 €"
                hints:
                  - "Rechne in Cent: viermal hundertfünfzig."
                  - "Sechshundert Cent."
                  - "6,00 €."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 10,00 € − 3,75 € = 6,25 €"
                say: "Zehn Euro minus drei Euro fünfundsiebzig sind sechs Euro fünfundzwanzig. Stimmt das?"
                answer: true
                hints:
                  - "Ergänze von drei Euro fünfundsiebzig bis zehn Euro."
                  - "Fünfundzwanzig Cent bis vier Euro, dann sechs Euro."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Eine Kugel Eis kostet 1,30 €. Was kosten 3 Kugeln?"
                say: "Eine Kugel Eis kostet einen Euro dreißig. Was kosten drei Kugeln?"
                options: ["3,90 €", "3,30 €", "4,30 €"]
                answer: "3,90 €"
                hints:
                  - "Dreimal einen Euro dreißig."
                  - "Dreimal hundertdreißig Cent."
                  - "3,90 €."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "8,75 € − 5,25 € = _"
                say: "Acht Euro fünfundsiebzig minus fünf Euro fünfundzwanzig."
                options: ["3,50 €", "3,25 €", "35,0 €"]
                answer: "3,50 €"
                hints: ["Euro mit Euro, Cent mit Cent."]
              - id: l2-s2
                type: multiple_choice
                text: "5,10 € − 1,40 € = _"
                say: "Fünf Euro zehn minus ein Euro vierzig."
                options: ["3,70 €", "4,30 €", "3,30 €"]
                answer: "3,70 €"
                hints: ["Zehn minus vierzig Cent geht nicht."]
              - id: l2-s3
                type: multiple_choice
                text: "5 · 0,80 € = _"
                say: "Fünf mal achtzig Cent."
                options: ["4,00 €", "5,80 €", "40,0 €"]
                answer: "4,00 €"
                hints: ["Fünfmal achtzig Cent."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 9,20 € − 4,60 € = 5,40 €"
                say: "Neun Euro zwanzig minus vier Euro sechzig sind fünf Euro vierzig. Stimmt das?"
                answer: false
                hints: ["Zwanzig minus sechzig Cent geht nicht."]
              - id: l2-s5
                type: multiple_choice
                text: "Ein Stift kostet 0,95 €. Was kosten 4 Stifte?"
                say: "Ein Stift kostet fünfundneunzig Cent. Was kosten vier Stifte?"
                options: ["3,80 €", "4,95 €", "3,60 €"]
                answer: "3,80 €"
                hints: ["Viermal fünfundneunzig Cent."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "9,60 € − 4,20 € = _"
                say: "Neun Euro sechzig minus vier Euro zwanzig."
                options: ["5,40 €", "5,80 €", "54,0 €"]
                answer: "5,40 €"
              - id: l2-n2
                type: multiple_choice
                text: "7,25 € − 2,75 € = _"
                say: "Sieben Euro fünfundzwanzig minus zwei Euro fünfundsiebzig."
                options: ["4,50 €", "5,50 €", "4,25 €"]
                answer: "4,50 €"
              - id: l2-n3
                type: multiple_choice
                text: "6 · 1,25 € = _"
                say: "Sechs mal ein Euro fünfundzwanzig."
                options: ["7,50 €", "6,25 €", "7,20 €"]
                answer: "7,50 €"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 20,00 € − 12,50 € = 7,50 €"
                say: "Zwanzig Euro minus zwölf Euro fünfzig sind sieben Euro fünfzig. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Eine Postkarte kostet 2,40 €. Was kosten 3 Postkarten?"
                say: "Eine Postkarte kostet zwei Euro vierzig. Was kosten drei Postkarten?"
                options: ["7,20 €", "6,40 €", "7,40 €"]
                answer: "7,20 €"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: multiple_choice
            text: "3,45 € + 2,70 € = _"
            say: "Drei Euro fünfundvierzig plus zwei Euro siebzig."
            options: ["6,15 €", "5,115 €", "5,15 €"]
            answer: "6,15 €"
          - id: l2-c2
            part: sub
            type: multiple_choice
            text: "8,40 € − 3,80 € = _"
            say: "Acht Euro vierzig minus drei Euro achtzig."
            options: ["4,60 €", "5,40 €", "4,40 €"]
            answer: "4,60 €"
          - id: l2-c3
            part: mult
            type: multiple_choice
            text: "4 · 2,25 € = _"
            say: "Vier mal zwei Euro fünfundzwanzig."
            options: ["9,00 €", "8,25 €", "8,100 €"]
            answer: "9,00 €"
          - id: l2-c4
            part: sub
            type: true_false
            text: "Stimmt das? 5,00 € − 1,99 € = 3,01 €"
            say: "Fünf Euro minus ein Euro neunundneunzig sind drei Euro und ein Cent. Stimmt das?"
            answer: true
          - id: l2-c5
            part: mult
            type: text_input
            text: "2,50 € + 2,50 € + 2,50 € + 2,50 € = _ €"
            say: "Zwei Euro fünfzig plus zwei Euro fünfzig plus zwei Euro fünfzig plus zwei Euro fünfzig. Wie viele ganze Euro sind das?"
            answer: "10"
          - id: l2-c6
            part: add
            type: multiple_choice
            text: "1,65 € + 4,20 € = _"
            say: "Ein Euro fünfundsechzig plus vier Euro zwanzig."
            options: ["5,85 €", "6,85 €", "58,5 €"]
            answer: "5,85 €"
          - id: l2-c7
            part: add
            type: multiple_choice
            text: "5,85 € + 2,35 € = _"
            say: "Fünf Euro fünfundachtzig plus zwei Euro fünfunddreißig."
            options: ["8,20 €", "7,120 €", "7,20 €"]
            answer: "8,20 €"
          - id: l2-c8
            part: add
            type: true_false
            text: "Stimmt das? 3,40 € + 2,90 € = 6,30 €"
            say: "Drei Euro vierzig plus zwei Euro neunzig sind sechs Euro dreißig. Stimmt das?"
            answer: true
          - id: l2-c9
            part: add
            type: multiple_choice
            text: "Ein Buch kostet 6,50 €, ein Lesezeichen 0,85 €. Was kostet beides?"
            say: "Ein Buch kostet sechs Euro fünfzig, ein Lesezeichen fünfundachtzig Cent. Was kostet beides zusammen?"
            options: ["7,35 €", "6,135 €", "7,45 €"]
            answer: "7,35 €"
          - id: l2-c10
            part: add
            type: text_input
            text: "4,45 € + 3,55 € = _ €"
            say: "Vier Euro fünfundvierzig plus drei Euro fünfundfünfzig. Wie viele ganze Euro sind das?"
            answer: "8"
          - id: l2-c11
            part: add
            type: multiple_choice
            text: "0,75 € + 0,60 € = _"
            say: "Fünfundsiebzig Cent plus sechzig Cent."
            options: ["1,35 €", "0,135 €", "1,25 €"]
            answer: "1,35 €"
          - id: l2-c12
            part: sub
            type: multiple_choice
            text: "6,90 € − 2,50 € = _"
            say: "Sechs Euro neunzig minus zwei Euro fünfzig."
            options: ["4,40 €", "3,40 €", "44,0 €"]
            answer: "4,40 €"
          - id: l2-c13
            part: sub
            type: multiple_choice
            text: "7,30 € − 4,70 € = _"
            say: "Sieben Euro dreißig minus vier Euro siebzig."
            options: ["2,60 €", "3,40 €", "2,40 €"]
            answer: "2,60 €"
          - id: l2-c14
            part: sub
            type: true_false
            text: "Stimmt das? 6,20 € − 2,50 € = 4,30 €"
            say: "Sechs Euro zwanzig minus zwei Euro fünfzig sind vier Euro dreißig. Stimmt das?"
            answer: false
          - id: l2-c15
            part: sub
            type: text_input
            text: "3,00 € − 2,35 € = _ ct"
            say: "Drei Euro minus zwei Euro fünfunddreißig. Wie viele Cent sind das?"
            answer: "65"
          - id: l2-c16
            part: sub
            type: multiple_choice
            text: "Mia hat 5,00 €. Sie kauft ein Heft für 1,85 €. Wie viel Geld bleibt ihr?"
            say: "Mia hat fünf Euro. Sie kauft ein Heft für einen Euro fünfundachtzig. Wie viel Geld bleibt ihr?"
            options: ["3,15 €", "4,25 €", "3,25 €"]
            answer: "3,15 €"
          - id: l2-c17
            part: mult
            type: multiple_choice
            text: "3 · 2,10 € = _"
            say: "Drei mal zwei Euro zehn."
            options: ["6,30 €", "5,10 €", "6,10 €"]
            answer: "6,30 €"
          - id: l2-c18
            part: mult
            type: multiple_choice
            text: "5 · 1,40 € = _"
            say: "Fünf mal ein Euro vierzig."
            options: ["7,00 €", "5,40 €", "5,200 €"]
            answer: "7,00 €"
          - id: l2-c19
            part: mult
            type: true_false
            text: "Stimmt das? 2 · 3,60 € = 7,20 €"
            say: "Zwei mal drei Euro sechzig sind sieben Euro zwanzig. Stimmt das?"
            answer: true
          - id: l2-c20
            part: mult
            type: text_input
            text: "8 · 0,50 € = _ €"
            say: "Acht mal fünfzig Cent. Wie viele ganze Euro sind das?"
            answer: "4"
