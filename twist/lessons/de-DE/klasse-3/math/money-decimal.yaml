# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.money-decimal
skill: math.money.decimal-notation
curriculum: de-DE
language: de
title:
  de: Geldbeträge mit Komma
  en: Money with a decimal comma
summary: >
  Lesson 1 reads and writes amounts with a Komma: before it the Euro,
  after it always two digits for the Cent (3,50 € = 3 € 50 ct = 350 ct);
  lesson 2 handles small Cent amounts (0,05 €, 2,08 €), compares and
  orders amounts, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Geld, en: Money }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.money.euro-cent]
  also_practises: [math.money.euro-cent, math.numbers-to-1000.place-value]
  vocabulary: { de: [Komma, Euro, Cent, Kommaschreibweise, Betrag] }
  forms: [drawn, text, audio, picture]
  drawn: [coins]
  facets: []
  parts:
    - { id: write, what: { de: Geldbeträge mit Komma lesen und schreiben, en: reading and writing amounts with a decimal comma } }
    - { id: cent, what: { de: Beträge mit Komma in Cent umrechnen, en: converting amounts with a comma into cents } }
    - { id: compare, what: { de: Geldbeträge vergleichen und ordnen, en: comparing and ordering amounts of money } }
  misconceptions:
    - id: one-cent-digit
      what: Writes 5 Cent as ,5 (2 € 5 ct = 2,5 €)
      addressed: lesson 2 Learn says there are always two digits after the Komma; every stage of lesson 2 offers the one-digit form, with feedback in l2-f1
    - id: compare-digit-count
      what: Compares the Cent before the Euro (2,95 € > 3,10 € because 95 > 10)
      addressed: lesson 2 Learn compares the Euro first; "Was ist mehr?" in every stage of lesson 2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Euro vor dem Komma", en: "Euros before the comma" }
    goal:
      de: "Lies und schreib Geldbeträge mit Komma. Vor dem Komma stehen die Euro, danach die Cent."
      en: "Read and write money amounts with a decimal point. Euros go before it, cents after it."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "3 € 50 ct = _ ct"
            say: "Wie viele Cent sind drei Euro und fünfzig Cent?"
            answer: "350"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie schreibst du 420 ct in Euro und Cent?"
            say: "Wie schreibst du vierhundertzwanzig Cent in Euro und Cent?"
            options: ["4 € 20 ct", "42 € 0 ct", "4 € 2 ct"]
            answer: "4 € 20 ct"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Auf dem Preisschild steht 3,50 €. Was bedeutet die 50?"
            say: "Auf dem Preisschild steht: drei Komma fünfzig Euro. Was glaubst du: Was bedeutet die Fünfzig nach dem Komma? Fünfzig Euro oder fünfzig Cent?"
            show: { drawn: coins, values: [200, 100, 50] }
          - text: "3,50 € = 3 € 50 ct"
            say: "Fünfzig Cent! Geldbeträge schreibt man oft mit Komma. Vor dem Komma stehen die Euro, nach dem Komma die Cent. Drei Komma fünfzig Euro sind drei Euro und fünfzig Cent. Man sagt: drei Euro fünfzig."
          - text: "3,50 € = 350 ct"
            say: "In Cent sind das dreihundertfünfzig Cent. Lass das Komma weg, dann hast du die Cent."
          - text: "12,99 € = 12 € 99 ct"
            say: "Nach dem Komma stehen immer genau zwei Ziffern. Zwölf Komma neunundneunzig Euro sind zwölf Euro und neunundneunzig Cent."
          - text: "Wusstest du? Die 1-, 2- und 5-Cent-Münzen sind innen aus Stahl. Darum bleiben sie an einem Magneten hängen."
            say: "Wusstest du? Die Ein-, Zwei- und Fünf-Cent-Münzen sehen aus wie Kupfer. Innen sind sie aber aus Stahl, nur außen mit Kupfer überzogen. Darum bleiben sie an einem Magneten hängen! Die anderen Euromünzen nicht. Probier es mit einem Kühlschrankmagneten aus."
            show: { drawn: coins, values: [1, 2, 5] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie schreibst du 4 € 75 ct mit Komma?"
                say: "Wie schreibst du vier Euro und fünfundsiebzig Cent mit Komma?"
                options: ["4,75 €", "47,5 €", "475 €"]
                answer: "4,75 €"
                feedback:
                  "475 €": "Vierhundertfünfundsiebzig Euro? Dafür bekommst du ja ein Fahrrad! Vor das Komma kommen die vier Euro, dahinter die fünfundsiebzig Cent."
                hints:
                  - "Vor dem Komma die Euro, nach dem Komma die Cent."
                  - "Vier Euro, dann Komma, dann fünfundsiebzig."
                  - "4,75 €."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "6,20 € = _ ct"
                say: "Wie viele Cent sind sechs Euro zwanzig?"
                answer: "620"
                hints:
                  - "Lass das Komma weg."
                  - "Sechs Euro sind sechshundert Cent, dazu zwanzig."
                  - "620 ct."
              - id: l1-f3
                type: multiple_choice
                text: "Wie schreibst du 815 ct mit Komma?"
                say: "Wie schreibst du achthundertfünfzehn Cent mit Komma?"
                options: ["8,15 €", "81,5 €", "0,815 €"]
                answer: "8,15 €"
                hints:
                  - "Hundert Cent sind ein Euro."
                  - "Achthundert Cent sind acht Euro. Die letzten zwei Ziffern sind die Cent."
                  - "8,15 €."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 9,40 € = 9 € 40 ct"
                say: "Neun Euro vierzig sind neun Euro und vierzig Cent. Stimmt das?"
                answer: true
                hints:
                  - "Vor dem Komma die Euro, nach dem Komma die Cent."
                  - "Neun Euro und vierzig Cent."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Ein Buch kostet 12,95 €. Wie viele ganze Euro sind das?"
                say: "Ein Buch kostet zwölf Euro fünfundneunzig. Wie viele ganze Euro sind das?"
                show: { object: book, count: 1 }
                options: ["12", "95", "1295"]
                answer: "12"
                hints:
                  - "Die ganzen Euro stehen vor dem Komma."
                  - "Vor dem Komma steht zwölf."
                  - "12."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie schreibst du 2 € 30 ct mit Komma?"
                say: "Wie schreibst du zwei Euro und dreißig Cent mit Komma?"
                options: ["2,30 €", "23,0 €", "230 €"]
                answer: "2,30 €"
                hints: ["Vor dem Komma die Euro."]
              - id: l1-s2
                type: text_input
                text: "7,85 € = _ ct"
                say: "Wie viele Cent sind sieben Euro fünfundachtzig?"
                answer: "785"
                hints: ["Lass das Komma weg."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie schreibst du 760 ct mit Komma?"
                say: "Wie schreibst du siebenhundertsechzig Cent mit Komma?"
                options: ["7,60 €", "0,760 €", "76,0 €"]
                answer: "7,60 €"
                hints: ["Die letzten zwei Ziffern sind die Cent."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 5,60 € = 56 ct"
                say: "Fünf Euro sechzig sind sechsundfünfzig Cent. Stimmt das?"
                answer: false
                feedback:
                  "true": "Sechsundfünfzig Cent für fünf Euro sechzig? Wer so wechselt, wird ganz schön übers Ohr gehauen! Fünf Euro sind schon fünfhundert Cent: Es sind fünfhundertsechzig Cent."
                hints: ["Fünf Euro sind schon fünfhundert Cent."]
              - id: l1-s5
                type: multiple_choice
                text: "Ein Saft kostet 1,49 €. Das sind 1 Euro und wie viele Cent?"
                say: "Ein Saft kostet eins Komma neunundvierzig Euro. Das sind ein Euro und wie viele Cent?"
                show: { object: juice, count: 1 }
                options: ["49", "1", "149"]
                answer: "49"
                hints: ["Die Cent stehen nach dem Komma."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie schreibst du 15 € 60 ct mit Komma?"
                say: "Wie schreibst du fünfzehn Euro und sechzig Cent mit Komma?"
                options: ["15,60 €", "156,0 €", "1,560 €"]
                answer: "15,60 €"
              - id: l1-n2
                type: text_input
                text: "3,99 € = _ ct"
                say: "Wie viele Cent sind drei Euro neunundneunzig?"
                answer: "399"
              - id: l1-n3
                type: multiple_choice
                text: "Wie schreibst du 830 ct mit Komma?"
                say: "Wie schreibst du achthundertdreißig Cent mit Komma?"
                options: ["8,30 €", "0,830 €", "83,0 €"]
                answer: "8,30 €"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 1,10 € = 110 ct"
                say: "Ein Euro zehn sind hundertzehn Cent. Stimmt das?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Eine Hose kostet 24,90 €. Wie viele ganze Euro sind das?"
                say: "Eine Hose kostet vierundzwanzig Euro neunzig. Wie viele ganze Euro sind das?"
                options: ["24", "90", "2490"]
                answer: "24"
                show: { object: trousers, count: 1 }
                feedback:
                  "2490": "Zweitausendvierhundertneunzig Euro für eine Hose? Die müsste aus Gold sein! Vor dem Komma stehen die Euro: vierundzwanzig."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie schreibst du 6 € 45 ct mit Komma?"
            say: "Wie schreibst du sechs Euro und fünfundvierzig Cent mit Komma?"
            options: ["6,45 €", "64,5 €", "645 €"]
            answer: "6,45 €"
          - id: l1-c2
            type: text_input
            text: "8,70 € = _ ct"
            say: "Wie viele Cent sind acht Euro siebzig?"
            answer: "870"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 950 ct = 9,50 €"
            say: "Neunhundertfünfzig Cent sind neun Euro fünfzig. Stimmt das?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Wie schreibst du 7 € 25 ct mit Komma?"
            say: "Wie schreibst du sieben Euro und fünfundzwanzig Cent mit Komma?"
            options: ["7,25 €", "72,5 €", "725 €"]
            answer: "7,25 €"
          - id: l1-c5
            type: text_input
            text: "5,35 € = _ ct"
            say: "Wie viele Cent sind fünf Euro fünfunddreißig?"
            answer: "535"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 2,80 € = 28 ct"
            say: "Zwei Euro achtzig sind achtundzwanzig Cent. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Kleine Centbeträge und vergleichen", en: "Small cents and comparing" }
    goal:
      de: "Schreib auch kleine Centbeträge richtig mit Komma, so wie 2 Euro und 5 Cent, und vergleiche Beträge."
      en: "Write small amounts of cents correctly with a decimal point, like 2 euros and 5 cents, and compare amounts."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "4,30 € = _ ct"
            say: "Wie viele Cent sind vier Euro dreißig?"
            answer: "430"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie schreibst du 5 € 10 ct mit Komma?"
            say: "Wie schreibst du fünf Euro und zehn Cent mit Komma?"
            options: ["5,10 €", "51,0 €", "510 €"]
            answer: "5,10 €"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "2 € 5 ct: 2,5 € oder 2,05 €?"
            say: "Zwei Euro und fünf Cent. Was glaubst du: Schreibt man zwei Komma fünf Euro oder zwei Komma null fünf Euro?"
            show: { drawn: coins, values: [200, 5] }
          - text: "2 € 5 ct = 2,05 €"
            say: "Zwei Komma null fünf Euro! Nach dem Komma stehen immer zwei Ziffern. Bei fünf Cent schreibst du eine Null davor: zwei Euro und fünf Cent sind zwei Komma null fünf Euro."
          - text: "50 ct = 0,50 € | 5 ct = 0,05 €"
            say: "Gibt es keine ganzen Euro, steht vor dem Komma eine Null. Fünfzig Cent sind null Komma fünfzig Euro, fünf Cent sind null Komma null fünf Euro."
          - text: "3,10 € > 2,95 €"
            say: "Zum Vergleichen schaust du zuerst auf die Euro: drei Euro sind mehr als zwei Euro. Also sind drei Euro zehn mehr als zwei Euro fünfundneunzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie schreibst du 4 € 8 ct mit Komma?"
                say: "Wie schreibst du vier Euro und acht Cent mit Komma?"
                options: ["4,08 €", "4,8 €", "4,80 €"]
                answer: "4,08 €"
                feedback:
                  "4,8 €": "Nach dem Komma stehen immer zwei Ziffern. Acht Cent schreibst du als 08."
                  "4,80 €": "4,80 € sind vier Euro achtzig, nicht acht Cent."
                hints:
                  - "Nach dem Komma stehen immer zwei Ziffern."
                  - "Acht Cent: eine Null und die Acht."
                  - "4,08 €."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie schreibst du 70 ct mit Komma?"
                say: "Wie schreibst du siebzig Cent mit Komma?"
                options: ["0,70 €", "70,0 €", "7,0 €"]
                answer: "0,70 €"
                hints:
                  - "Gibt es ganze Euro?"
                  - "Nein. Dann steht vor dem Komma eine Null."
                  - "0,70 €."
              - id: l2-f3
                type: multiple_choice
                text: "Lea hat 5,90 €, Ben hat 6,10 €. Was ist mehr?"
                say: "Lea hat fünf Euro neunzig im Sparschwein, Ben hat sechs Euro zehn. Was ist mehr?"
                options: ["6,10 €", "5,90 €"]
                answer: "6,10 €"
                hints:
                  - "Vergleiche zuerst die Euro."
                  - "Sechs Euro sind mehr als fünf Euro."
                  - "6,10 €."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 0,05 € = 5 ct"
                say: "Null Komma null fünf Euro sind fünf Cent. Stimmt das?"
                answer: true
                hints:
                  - "Vor dem Komma steht null Euro."
                  - "Nach dem Komma steht null fünf, also fünf Cent."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: ordering
                text: "Ordne von wenig nach viel."
                say: "Ordne die Beträge von wenig nach viel."
                options: ["3,20 €", "2,99 €", "3,05 €"]
                slot_count: 3
                answer: ["2,99 €", "3,05 €", "3,20 €"]
                hints:
                  - "Vergleiche zuerst die Euro."
                  - "2,99 € hat die wenigsten Euro. Bei den anderen vergleichst du die Cent."
                  - "2,99 €, 3,05 €, 3,20 €."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie schreibst du 1 € 3 ct mit Komma?"
                say: "Wie schreibst du einen Euro und drei Cent mit Komma?"
                options: ["1,03 €", "1,3 €", "1,30 €"]
                answer: "1,03 €"
                hints: ["Immer zwei Ziffern nach dem Komma."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie schreibst du 45 ct mit Komma?"
                say: "Wie schreibst du fünfundvierzig Cent mit Komma?"
                options: ["0,45 €", "45,0 €", "4,5 €"]
                answer: "0,45 €"
                hints: ["Gibt es ganze Euro?"]
              - id: l2-s3
                type: multiple_choice
                text: "Was ist mehr?"
                say: "Was ist mehr: zwei Euro fünf oder zwei Euro fünfzig?"
                options: ["2,50 €", "2,05 €"]
                answer: "2,50 €"
                hints: ["Die Euro sind gleich. Vergleiche die Cent."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 7 € 9 ct = 7,9 €"
                say: "Sieben Euro und neun Cent schreibt man sieben Komma neun Euro. Stimmt das?"
                answer: false
                feedback:
                  "true": "Sieben Komma neun Euro sind sieben Euro neunzig. Da wären aus neun Cent plötzlich neunzig geworden! Neun Cent schreibst du als null neun: 7,09 €."
                hints: ["Wie viele Ziffern stehen nach dem Komma?"]
              - id: l2-s5
                type: ordering
                text: "Ordne von wenig nach viel."
                say: "Ordne die Beträge von wenig nach viel."
                options: ["0,90 €", "1,10 €", "0,09 €"]
                slot_count: 3
                answer: ["0,09 €", "0,90 €", "1,10 €"]
                hints: ["Vergleiche zuerst die Euro, dann die Cent."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie schreibst du 10 € 1 ct mit Komma?"
                say: "Wie schreibst du zehn Euro und einen Cent mit Komma?"
                options: ["10,01 €", "10,1 €", "10,10 €"]
                answer: "10,01 €"
              - id: l2-n2
                type: multiple_choice
                text: "Wie schreibst du 9 ct mit Komma?"
                say: "Wie schreibst du neun Cent mit Komma?"
                options: ["0,09 €", "0,9 €", "9,00 €"]
                answer: "0,09 €"
              - id: l2-n3
                type: multiple_choice
                text: "Was ist weniger?"
                say: "Was ist weniger: zwölf Euro neun oder zwölf Euro neunzig?"
                options: ["12,09 €", "12,90 €"]
                answer: "12,09 €"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 0,99 € ist weniger als 1 €."
                say: "Null Komma neunundneunzig Euro sind weniger als ein Euro. Stimmt das?"
                answer: true
              - id: l2-n5
                type: ordering
                text: "Ordne von wenig nach viel."
                say: "Ordne die Beträge von wenig nach viel."
                options: ["5,50 €", "5,05 €", "4,95 €", "5,55 €"]
                slot_count: 4
                answer: ["4,95 €", "5,05 €", "5,50 €", "5,55 €"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: write
            type: multiple_choice
            text: "Wie schreibst du 3 € 6 ct mit Komma?"
            say: "Wie schreibst du drei Euro und sechs Cent mit Komma?"
            options: ["3,06 €", "3,6 €", "3,60 €"]
            answer: "3,06 €"
          - id: l2-c2
            part: cent
            type: text_input
            text: "9,25 € = _ ct"
            say: "Wie viele Cent sind neun Euro fünfundzwanzig?"
            answer: "925"
          - id: l2-c3
            part: write
            type: multiple_choice
            text: "Wie schreibst du 80 ct mit Komma?"
            say: "Wie schreibst du achtzig Cent mit Komma?"
            options: ["0,80 €", "80,0 €", "0,08 €"]
            answer: "0,80 €"
          - id: l2-c4
            part: compare
            type: multiple_choice
            text: "Was ist mehr?"
            say: "Was ist mehr: vier Euro achtundneunzig oder fünf Euro zwei?"
            options: ["5,02 €", "4,98 €"]
            answer: "5,02 €"
          - id: l2-c5
            part: cent
            type: true_false
            text: "Stimmt das? 6,40 € = 640 ct"
            say: "Sechs Euro vierzig sind sechshundertvierzig Cent. Stimmt das?"
            answer: true
          - id: l2-c6
            part: write
            type: multiple_choice
            text: "Wie schreibst du 12 € 4 ct mit Komma?"
            say: "Wie schreibst du zwölf Euro und vier Cent mit Komma?"
            options: ["12,04 €", "12,4 €", "12,40 €"]
            answer: "12,04 €"
          - id: l2-c7
            part: write
            type: multiple_choice
            text: "Wie schreibst du 7 ct mit Komma?"
            say: "Wie schreibst du sieben Cent mit Komma?"
            options: ["0,07 €", "0,7 €", "7,00 €"]
            answer: "0,07 €"
          - id: l2-c8
            part: write
            type: true_false
            text: "Stimmt das? 8 € 50 ct = 8,50 €"
            say: "Acht Euro und fünfzig Cent schreibt man acht Komma fünfzig Euro. Stimmt das?"
            answer: true
          - id: l2-c9
            part: write
            type: multiple_choice
            text: "Wie schreibst du 304 ct mit Komma?"
            say: "Wie schreibst du dreihundertvier Cent mit Komma?"
            options: ["3,04 €", "30,4 €", "3,40 €"]
            answer: "3,04 €"
          - id: l2-c10
            part: write
            type: multiple_choice
            text: "Ein Eis kostet 1,05 €. Wie viele Euro und wie viele Cent sind das?"
            say: "Ein Eis kostet eins Komma null fünf Euro. Wie viele Euro und wie viele Cent sind das?"
            show: { object: ice-cream, count: 1 }
            options: ["1 € 5 ct", "1 € 50 ct", "10 € 5 ct"]
            answer: "1 € 5 ct"
          - id: l2-c11
            part: cent
            type: text_input
            text: "4,07 € = _ ct"
            say: "Wie viele Cent sind vier Komma null sieben Euro?"
            answer: "407"
          - id: l2-c12
            part: cent
            type: text_input
            text: "0,65 € = _ ct"
            say: "Wie viele Cent sind null Komma fünfundsechzig Euro?"
            answer: "65"
          - id: l2-c13
            part: cent
            type: multiple_choice
            text: "Wie viele Cent sind 10,50 €?"
            say: "Wie viele Cent sind zehn Euro fünfzig?"
            options: ["1050 ct", "105 ct", "150 ct"]
            answer: "1050 ct"
          - id: l2-c14
            part: cent
            type: true_false
            text: "Stimmt das? 2,03 € = 230 ct"
            say: "Zwei Komma null drei Euro sind zweihundertdreißig Cent. Stimmt das?"
            answer: false
          - id: l2-c15
            part: cent
            type: text_input
            text: "Paul hat 2,60 €. Wie viele Cent sind das?"
            say: "Paul hat zwei Euro sechzig. Wie viele Cent sind das?"
            answer: "260"
          - id: l2-c16
            part: compare
            type: multiple_choice
            text: "Was ist weniger?"
            say: "Was ist weniger: acht Euro zehn oder sieben Euro neunzig?"
            options: ["7,90 €", "8,10 €"]
            answer: "7,90 €"
          - id: l2-c17
            part: compare
            type: true_false
            text: "Stimmt das? 3,09 € ist mehr als 3,90 €."
            say: "Drei Komma null neun Euro sind mehr als drei Komma neunzig Euro. Stimmt das?"
            answer: false
          - id: l2-c18
            part: compare
            type: ordering
            text: "Ordne von wenig nach viel."
            say: "Ordne die Beträge von wenig nach viel."
            options: ["6,60 €", "6,06 €", "5,99 €"]
            slot_count: 3
            answer: ["5,99 €", "6,06 €", "6,60 €"]
          - id: l2-c19
