# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.distributive
skill: math.mult-div-larger.distributive
curriculum: de-DE
language: de
title:
  de: Malaufgaben zerlegen
  en: Splitting multiplications
summary: >
  Splitting one factor to multiply bigger numbers. Lesson 1 splits a
  two-digit number into Zehner and Einer (6 · 14 = 6 · 10 + 6 · 4) and
  shows it on a Punktefeld; lesson 2 splits cleverly, also by taking away
  (7 · 19 = 7 · 20 − 7 · 1), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.tens, math.mult-div.derive-facts]
  also_practises: [math.mult-div-larger.tens, math.mult-div.all-tables]
  vocabulary: { de: [zerlegen, Zehner, Einer, Teilaufgabe, Punktefeld] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: split, what: { de: "eine Malaufgabe passend zerlegen und erklären, warum das geht", en: splitting a multiplication and explaining why it works } }
    - { id: tens-ones, what: { de: mit Zehnern und Einern zerlegen und rechnen, en: splitting into tens and ones and working it out } }
    - { id: round, what: { de: mit einer runden Zahl rechnen und den Rest wegnehmen, en: multiplying a round number and taking the extra away } }
    - { id: in-context, what: { de: Sachaufgaben mit Zerlegen lösen, en: solving word problems by splitting } }
  misconceptions:
    - id: multiply-one-part
      what: Multiplies only the Zehner or only the Einer (6 · 14 = 60 + 4)
      addressed: lesson 1 Learn splits the Punktefeld into two parts that are both multiplied; every stage of lesson 1 offers the one-part result as a chip or a true_false
    - id: take-away-one
      what: Takes away 1 instead of the whole row (7 · 19 = 140 − 1)
      addressed: lesson 2 Learn takes away a whole 7, not 1; l2-f2 and l2-c4 give the minus-one result, and the frames l2-f1, l2-s1 and l2-n1 offer it as a chip (149, 159, 299)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Zehner und Einer", en: "Tens and ones" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 · 10 = _"
            say: "Sechs mal zehn."
            answer: "60"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "9 · 30 = _"
            say: "Neun mal dreißig."
            answer: "270"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6 · 14 = 6 · 10 + 6 · 4"
            say: "Sechs mal vierzehn ist schwer. Zerlege die Vierzehn in zehn und vier. Das Punktefeld hat sechs Reihen mit je vierzehn Punkten. Teil jede Reihe in zehn Punkte und vier Punkte."
            show: { drawn: dots, array: [6, 14] }
          - text: "6 · 10 = 60 | 6 · 4 = 24 | 60 + 24 = 84"
            say: "Sechs mal zehn ist sechzig. Sechs mal vier ist vierundzwanzig. Zusammen sind das vierundachtzig."
          - text: "3 · 25 = 3 · 20 + 3 · 5 = 60 + 15 = 75"
            say: "So geht es bei jeder Zahl: Drei mal fünfundzwanzig ist drei mal zwanzig plus drei mal fünf, also sechzig plus fünfzehn, fünfundsiebzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Zerlege in Zehner und Einer."
                say: "Vier mal sechzehn. Rechne vier mal zehn und vier mal sechs, dann zusammen."
                frame: "4 · 10 = _ | 4 · 6 = _ | 4 · 16 = _"
                options: ["40", "24", "64", "46"]
                answer: ["40", "24", "64"]
                hints:
                  - "Zerlege sechzehn in zehn und sechs."
                  - "Vier mal zehn kennst du sofort, vier mal sechs steht in der Viererreihe. Am Ende zählst du beides zusammen."
                  - "40, 24 und 64."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie zerlegst du 5 · 13?"
                say: "Fünf mal dreizehn. Wie zerlegst du die Aufgabe?"
                options: ["5 · 10 + 5 · 3", "5 · 10 + 3", "5 + 10 + 3"]
                answer: "5 · 10 + 5 · 3"
                feedback:
                  "5 · 10 + 3": "Auch die Drei musst du mal fünf nehmen."
                hints:
                  - "Zerlege die Dreizehn in zehn und drei."
                  - "Beide Teile werden mal fünf genommen."
                  - "5 · 10 + 5 · 3."
              - id: l1-f3
                type: text_input
                text: "3 · 17 = _"
                say: "Drei mal siebzehn."
                answer: "51"
                hints:
                  - "Zerlege siebzehn in zehn und sieben."
                  - "Drei mal zehn ist dreißig, drei mal sieben ist einundzwanzig."
                  - "51."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 6 · 12 = 60 + 2"
                say: "Sechs mal zwölf ist sechzig plus zwei. Stimmt das?"
                answer: false
                hints:
                  - "Zerlege zwölf in zehn und zwei."
                  - "Auch die Zwei wird mal sechs genommen."
                  - "Nein. 6 · 12 = 60 + 12 = 72."
              - id: l1-f5
                type: text_input
                text: "In einer Packung sind 24 Buntstifte. Wie viele Buntstifte sind in 4 Packungen?"
                say: "In einer Packung sind vierundzwanzig Buntstifte. Wie viele Buntstifte sind in vier Packungen?"
                answer: "96"
                hints:
                  - "Welche Malaufgabe passt?"
                  - "Vier mal vierundzwanzig. Rechne vier mal zwanzig plus vier mal vier."
                  - "96 Buntstifte."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Zerlege in Zehner und Einer."
                say: "Sieben mal dreizehn. Rechne sieben mal zehn und sieben mal drei, dann zusammen."
                frame: "7 · 10 = _ | 7 · 3 = _ | 7 · 13 = _"
                options: ["70", "21", "91", "73"]
                answer: ["70", "21", "91"]
                hints: ["Zähle die beiden Teile zusammen."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie zerlegst du 8 · 15?"
                say: "Acht mal fünfzehn. Wie zerlegst du die Aufgabe?"
                options: ["8 · 10 + 8 · 5", "8 · 10 + 5", "8 · 15 + 10"]
                answer: "8 · 10 + 8 · 5"
                hints: ["Beide Teile werden mal acht genommen."]
              - id: l1-s3
                type: text_input
                text: "4 · 23 = _"
                say: "Vier mal dreiundzwanzig."
                answer: "92"
                hints: ["Vier mal zwanzig und vier mal drei."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 9 · 12 = 90 + 18"
                say: "Neun mal zwölf ist neunzig plus achtzehn. Stimmt das?"
                answer: true
                hints: ["Neun mal zehn und neun mal zwei."]
              - id: l1-s5
                type: text_input
                text: "Im Kino hat jede Reihe 18 Plätze. Wie viele Plätze haben 5 Reihen?"
                say: "Im Kino hat jede Reihe achtzehn Plätze. Wie viele Plätze haben fünf Reihen zusammen?"
                answer: "90"
                hints: ["Fünf mal zehn plus fünf mal acht."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Zerlege in Zehner und Einer."
                say: "Rechne sechs mal zehn, sechs mal sieben und sechs mal siebzehn."
                frame: "6 · 10 = _ | 6 · 7 = _ | 6 · 17 = _"
                options: ["60", "42", "102", "67"]
                answer: ["60", "42", "102"]
              - id: l1-n2
                type: multiple_choice
                text: "Wie zerlegst du 3 · 36?"
                say: "Drei mal sechsunddreißig. Wie zerlegst du die Aufgabe?"
                options: ["3 · 30 + 3 · 6", "3 · 30 + 6", "3 · 3 + 3 · 6"]
                answer: "3 · 30 + 3 · 6"
              - id: l1-n3
                type: text_input
                text: "7 · 14 = _"
                say: "Sieben mal vierzehn."
                answer: "98"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 5 · 16 = 50 + 6"
                say: "Fünf mal sechzehn ist fünfzig plus sechs. Stimmt das?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "Eine Schule hat 8 Klassen mit je 26 Kindern. Wie viele Kinder sind es?"
                say: "Eine Schule hat acht Klassen. In jeder Klasse sind sechsundzwanzig Kinder. Wie viele Kinder sind es zusammen?"
                answer: "208"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "4 · 18 = _"
            say: "Vier mal achtzehn."
            answer: "72"
          - id: l1-c2
            type: text_input
            text: "6 · 21 = _"
            say: "Sechs mal einundzwanzig."
            answer: "126"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 3 · 14 = 30 + 12"
            say: "Drei mal vierzehn ist dreißig plus zwölf. Stimmt das?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Zerlege in Zehner und Einer."
            say: "Rechne fünf mal zehn, fünf mal sieben und fünf mal siebzehn."
            frame: "5 · 10 = _ | 5 · 7 = _ | 5 · 17 = _"
            options: ["50", "35", "85", "57"]
            answer: ["50", "35", "85"]
          - id: l1-c5
            type: multiple_choice
            text: "Wie zerlegst du 4 · 28?"
            say: "Vier mal achtundzwanzig. Wie zerlegst du die Aufgabe?"
            options: ["4 · 20 + 4 · 8", "4 · 20 + 8", "4 + 20 + 8"]
            answer: "4 · 20 + 4 · 8"
          - id: l1-c6
            type: text_input
            text: "In einer Kiste sind 16 Äpfel. Wie viele Äpfel sind in 3 Kisten?"
            say: "In einer Kiste sind sechzehn Äpfel. Wie viele Äpfel sind in drei Kisten?"
            answer: "48"

  - n: 2
    title: { de: "Geschickt zerlegen", en: "Splitting cleverly" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "5 · 14 = _"
            say: "Fünf mal vierzehn."
            answer: "70"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "7 · 20 = _"
            say: "Sieben mal zwanzig."
            answer: "140"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 · 19 = 7 · 20 − 7 · 1 = 140 − 7 = 133"
            say: "Neunzehn ist eins weniger als zwanzig. Rechne sieben mal zwanzig, das ist hundertvierzig. Das ist einmal sieben zu viel. Nimm die ganze Sieben wieder weg: hundertvierzig minus sieben ist hundertdreiunddreißig."
          - text: "2 · 25 = 50 | 4 · 25 = 100"
            say: "Manchmal hilft eine Aufgabe, die du schon kennst. Zwei mal fünfundzwanzig ist fünfzig. Vier mal fünfundzwanzig ist das Doppelte, hundert."
          - text: "7 · 16 | 7 · 29 | 7 · 25"
            say: "Frag dich bei jeder Aufgabe: Zerlege ich in Zehner und Einer, oder rechne ich mit einer runden Zahl und nehme etwas weg?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne mit der runden Zahl."
                say: "Fünf mal neunundzwanzig. Rechne fünf mal dreißig und nimm fünf weg."
                frame: "5 · 30 = _ | 5 · 29 = _"
                options: ["150", "145", "149", "155"]
                answer: ["150", "145"]
                hints:
                  - "Neunundzwanzig ist eins weniger als dreißig."
                  - "Rechne erst fünf mal dreißig. Damit hast du einmal fünf zu viel. Nimm die Fünf wieder weg."
                  - "150 und 145."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? 6 · 19 = 120 − 1"
                say: "Sechs mal neunzehn ist hundertzwanzig minus eins. Stimmt das?"
                answer: false
                hints:
                  - "Wie viel hast du bei sechs mal zwanzig zu viel?"
                  - "Sechs mal zwanzig ist einmal sechs mehr als sechs mal neunzehn, nicht nur eins mehr."
                  - "Nein. 6 · 19 = 120 − 6 = 114."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Weg ist bei 9 · 21 geschickt?"
                say: "Neun mal einundzwanzig. Welcher Weg ist geschickt?"
                options: ["9 · 20 + 9", "9 · 10 + 21", "9 + 21"]
                answer: "9 · 20 + 9"
                hints:
                  - "Einundzwanzig ist eins mehr als zwanzig."
                  - "Neun mal zwanzig ist leicht. Wie viel fehlt dann noch bis neun mal einundzwanzig?"
                  - "9 · 20 + 9."
              - id: l2-f4
                type: text_input
                text: "8 · 25 = _"
                say: "Acht mal fünfundzwanzig."
                answer: "200"
                hints:
                  - "Welche Aufgabe mit fünfundzwanzig kennst du?"
                  - "Vier mal fünfundzwanzig ist hundert."
                  - "200."
              - id: l2-f5
                type: text_input
                text: "4 · 39 = _"
                say: "Vier mal neununddreißig."
                answer: "156"
                hints:
                  - "Neununddreißig ist eins weniger als vierzig."
                  - "Vier mal vierzig ist hundertsechzig. Nimm vier weg."
                  - "156."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne mit der runden Zahl."
                say: "Acht mal neunzehn. Rechne acht mal zwanzig und nimm acht weg."
                frame: "8 · 20 = _ | 8 · 19 = _"
                options: ["160", "152", "159"]
                answer: ["160", "152"]
                hints: ["Nimm eine ganze Acht weg."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? 3 · 49 = 150 − 3"
                say: "Drei mal neunundvierzig ist hundertfünfzig minus drei. Stimmt das?"
                answer: true
                hints: ["Drei mal fünfzig und eine Drei weg."]
              - id: l2-s3
                type: multiple_choice
                text: "Welcher Weg ist bei 7 · 31 geschickt?"
                say: "Sieben mal einunddreißig. Welcher Weg ist geschickt?"
                options: ["7 · 30 + 7", "7 · 30 + 1", "7 + 31"]
                answer: "7 · 30 + 7"
                hints: ["Einunddreißig ist eins mehr als dreißig."]
              - id: l2-s4
                type: text_input
                text: "6 · 25 = _"
                say: "Sechs mal fünfundzwanzig."
                answer: "150"
                hints: ["Zwei mal fünfundzwanzig ist fünfzig."]
              - id: l2-s5
                type: text_input
                text: "5 · 18 = _"
                say: "Fünf mal achtzehn."
                answer: "90"
                hints: ["Rechne fünf mal zwanzig und nimm zweimal fünf weg."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Rechne mit der runden Zahl."
                say: "Rechne sechs mal fünfzig, dann sechs mal neunundvierzig."
                frame: "6 · 50 = _ | 6 · 49 = _"
                options: ["300", "294", "299"]
                answer: ["300", "294"]
              - id: l2-n2
                type: true_false
                text: "Stimmt das? 9 · 29 = 270 − 9"
                say: "Neun mal neunundzwanzig ist zweihundertsiebzig minus neun. Stimmt das?"
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Welcher Weg ist bei 4 · 51 geschickt?"
                say: "Vier mal einundfünfzig. Welcher Weg ist geschickt?"
                options: ["4 · 50 + 4", "4 · 50 + 1", "4 · 5 + 1"]
                answer: "4 · 50 + 4"
              - id: l2-n4
                type: text_input
                text: "7 · 39 = _"
                say: "Sieben mal neununddreißig."
                answer: "273"
              - id: l2-n5
                type: text_input
                text: "Ein Fußball kostet 19 €. Wie viel Euro kosten 5 Fußbälle?"
                say: "Ein Fußball kostet neunzehn Euro. Der Sportverein kauft fünf Fußbälle. Wie viel Euro kosten sie zusammen?"
                answer: "95"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: tens-ones
            type: text_input
            text: "8 · 13 = _"
            say: "Acht mal dreizehn."
            answer: "104"
          - id: l2-c2
            part: round
            type: text_input
            text: "3 · 29 = _"
            say: "Drei mal neunundzwanzig."
            answer: "87"
          - id: l2-c3
            part: split
            type: multiple_choice
            text: "Wie zerlegst du 6 · 15?"
            say: "Sechs mal fünfzehn. Wie zerlegst du die Aufgabe?"
            options: ["6 · 10 + 6 · 5", "6 · 10 + 5", "6 + 15"]
            answer: "6 · 10 + 6 · 5"
          - id: l2-c4
            part: round
            type: true_false
            text: "Stimmt das? 4 · 19 = 80 − 1"
            say: "Vier mal neunzehn ist achtzig minus eins. Stimmt das?"
            answer: false
          - id: l2-c5
            part: tens-ones
            type: text_input
            text: "5 · 26 = _"
            say: "Fünf mal sechsundzwanzig."
            answer: "130"
          - id: l2-c6
            part: split
            type: multiple_choice
            text: "Wie zerlegst du 7 · 18?"
            say: "Sieben mal achtzehn. Wie zerlegst du die Aufgabe?"
            options: ["7 · 10 + 7 · 8", "7 · 10 + 8", "7 + 10 + 8"]
            answer: "7 · 10 + 7 · 8"
          - id: l2-c7
            part: split
            type: true_false
            text: "Stimmt das? 4 · 13 = 4 · 10 + 4 · 3"
            say: "Das Punktefeld hat vier Reihen mit je dreizehn Punkten. Vier mal dreizehn ist vier mal zehn plus vier mal drei. Stimmt das?"
            show: { drawn: dots, array: [4, 13] }
            answer: true
          - id: l2-c8
            part: split
            type: fill_in_blank
            text: "Zerlege in Zehner und Einer."
            say: "Zerlege sechs mal vierundzwanzig in Zehner und Einer."
            frame: "6 · 24 = 6 · _ + 6 · _"
            options: ["20", "4", "2", "40"]
            answer: ["20", "4"]
          - id: l2-c9
            part: split
            type: multiple_choice
            text: "Lina rechnet: 5 · 17 = 50 + 7. Was ist falsch?"
            say: "Lina rechnet fünf mal siebzehn gleich fünfzig plus sieben. Was ist falsch?"
            options: ["Sie muss auch 5 · 7 rechnen.", "Sie muss 5 · 50 rechnen.", "Sie muss 5 + 17 rechnen."]
            answer: "Sie muss auch 5 · 7 rechnen."
          - id: l2-c10
            part: tens-ones
            type: text_input
            text: "4 · 27 = _"
            say: "Vier mal siebenundzwanzig."
            answer: "108"
          - id: l2-c11
            part: tens-ones
            type: fill_in_blank
            text: "Zerlege in Zehner und Einer."
            say: "Rechne neun mal zehn, neun mal vier und neun mal vierzehn."
            frame: "9 · 10 = _ | 9 · 4 = _ | 9 · 14 = _"
            options: ["90", "36", "126", "94"]
            answer: ["90", "36", "126"]
          - id: l2-c12
            part: tens-ones
            type: multiple_choice
            text: "3 · 32 = ?"
            say: "Drei mal zweiunddreißig. Wie viel ist das?"
            options: ["96", "92", "35"]
            answer: "96"
          - id: l2-c13
            part: round
            type: fill_in_blank
            text: "Rechne mit der runden Zahl."
            say: "Rechne vier mal dreißig, dann vier mal neunundzwanzig."
            frame: "4 · 30 = _ | 4 · 29 = _"
            options: ["120", "116", "119", "124"]
            answer: ["120", "116"]
          - id: l2-c14
            part: round
            type: text_input
            text: "6 · 39 = _"
            say: "Sechs mal neununddreißig."
            answer: "234"
          - id: l2-c15
            part: round
            type: multiple_choice
            text: "Welcher Weg ist bei 8 · 49 geschickt?"
            say: "Acht mal neunundvierzig. Welcher Weg ist geschickt?"
            options: ["8 · 50 − 8", "8 · 50 − 1", "8 · 40 + 9"]
            answer: "8 · 50 − 8"
          - id: l2-c16
            part: in-context
            type: text_input
            text: "Ein Bus hat 45 Sitzplätze. Wie viele Sitzplätze haben 3 Busse?"
            say: "Ein Bus hat fünfundvierzig Sitzplätze. Wie viele Sitzplätze haben drei Busse zusammen?"
            answer: "135"
          - id: l2-c17
            part: in-context
            type: text_input
            text: "Eine Kinokarte kostet 9 €. Wie viel Euro kosten 12 Karten?"
            say: "Eine Kinokarte kostet neun Euro. Wie viel Euro kosten zwölf Karten?"
            answer: "108"
          - id: l2-c18
            part: in-context
            type: multiple_choice
            text: "Ein Regal hat 7 Bretter. Auf jedem Brett stehen 16 Bücher. Wie viele Bücher sind es?"
            say: "Ein Regal hat sieben Bretter. Auf jedem Brett stehen sechzehn Bücher. Wie viele Bücher sind es zusammen?"
            options: ["112", "76", "23"]
            answer: "112"
          - id: l2-c19
            part: in-context
            type: text_input
            text: "Ella übt jeden Tag 19 Minuten Flöte. Wie viele Minuten sind das in 9 Tagen?"
            say: "Ella übt jeden Tag neunzehn Minuten Flöte. Wie viele Minuten sind das in neun Tagen?"
            answer: "171"
          - id: l2-c20
            part: in-context
            type: true_false
            text: "Tim kauft 3 Packungen mit je 24 Keksen. Er sagt: „Das sind 64 Kekse.“ Hat Tim recht?"
            say: "Tim kauft drei Packungen mit je vierundzwanzig Keksen. Er sagt: Das sind vierundsechzig Kekse. Hat Tim recht?"
            answer: false
