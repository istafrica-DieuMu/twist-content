# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.multiples-divisors
skill: math.mult-div-larger.multiples-divisors
curriculum: de-DE
language: de
title:
  de: Vielfache und Teiler
  en: Multiples and divisors
summary: >
  Lesson 1 finds Vielfache: the numbers of a times table (Vielfache von 4
  are 4, 8, 12 …); lesson 2 finds the Teiler of a number by looking for
  multiplications that give it, in pairs (12 = 1 · 12 = 2 · 6 = 3 · 4),
  and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.div-facts]
  also_practises: [math.mult-div.all-tables, math.mult-div.div-facts]
  vocabulary: { de: [Vielfaches, Teiler, teilbar, Rest] }
  forms: [drawn, text, audio]
  drawn: [letter-card, dots]
  facets: []
  misconceptions:
    - id: multiple-divisor-mixup
      what: Mixes up Vielfache and Teiler (calls 3 a Vielfaches of 12)
      addressed: lesson 2 Learn sets the two side by side; l2-f4 and l2-n4 ask about a number that is a Teiler, not a Vielfaches, and the other way round
    - id: forget-1-and-itself
      what: Leaves out 1 and the number itself as Teiler
      addressed: lesson 2 Learn starts each list with 1 and ends it with the number; the highlight tasks in every stage of lesson 2 include 1 and the number
    - id: near-miss
      what: Takes a number one off a Vielfaches (13 as a Vielfaches of 4)
      addressed: every highlight card in lesson 1 has numbers one off a Vielfaches
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Vielfache", en: "Multiples" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Zähle in der Viererreihe. Welche Zahl fehlt?"
            frame: "4, 8, 12, _, 20"
            options: ["16", "14", "18"]
            answer: ["16"]
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "56 : 7 = _"
            say: "Sechsundfünfzig geteilt durch sieben."
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4, 8, 12, 16, 20, 24 …"
            say: "Die Zahlen der Viererreihe heißen Vielfache von vier: vier, acht, zwölf, sechzehn und so weiter. Ein Vielfaches entsteht, wenn du vier mit einer Zahl malnimmst."
          - text: "3 · 4 = 12"
            say: "Zwölf ist ein Vielfaches von vier, denn drei mal vier ist zwölf. Zwölf ist auch ein Vielfaches von drei."
            show: { drawn: dots, array: [3, 4] }
          - text: "14 : 4 = 3 Rest 2"
            say: "Vierzehn ist kein Vielfaches von vier. Teilst du durch vier, bleibt ein Rest."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf alle Vielfachen von 3."
                say: "Tippe auf alle Vielfachen von drei."
                show: { drawn: letter-card, text: "6 10 12 14 15" }
                spans: ["6", "12", "15"]
                hints:
                  - "Denk an die Dreierreihe."
                  - "Sechs ist zwei mal drei, also ein Vielfaches. Steht zehn auch in der Dreierreihe?"
                  - "6, 12 und 15."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Die ersten Vielfachen von 6"
                say: "Setze die Reihe der Vielfachen von sechs fort."
                frame: "6, 12, 18, _, _"
                options: ["24", "30", "26", "36"]
                answer: ["24", "30"]
                hints:
                  - "Zähle immer sechs weiter."
                  - "Nach achtzehn kommt achtzehn plus sechs, danach noch einmal sechs mehr."
                  - "24 und 30."
              - id: l1-f3
                type: true_false
                text: "Ist 35 ein Vielfaches von 5?"
                say: "Ist fünfunddreißig ein Vielfaches von fünf?"
                answer: true
                hints:
                  - "Steht fünfunddreißig in der Fünferreihe?"
                  - "Sieben mal fünf ist …"
                  - "Ja, 7 · 5 = 35."
              - id: l1-f4
                type: multiple_choice
                text: "Welche Zahl ist ein Vielfaches von 8?"
                say: "Welche Zahl ist ein Vielfaches von acht?"
                options: ["40", "42", "44"]
                answer: "40"
                hints:
                  - "Denk an die Achterreihe."
                  - "Acht, sechzehn, vierundzwanzig, zweiunddreißig … Wie geht es weiter?"
                  - "40."
              - id: l1-f5
                type: text_input
                text: "Wie heißt das 7. Vielfache von 9?"
                say: "Wie heißt das siebte Vielfache von neun?"
                answer: "63"
                hints:
                  - "Das siebte Vielfache ist sieben mal neun."
                  - "Zehn mal neun minus drei mal neun."
                  - "63."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf alle Vielfachen von 4."
                say: "Tippe auf alle Vielfachen von vier."
                show: { drawn: letter-card, text: "8 13 16 22 28" }
                spans: ["8", "16", "28"]
                hints: ["Denk an die Viererreihe."]
              - id: l1-s2
                type: fill_in_blank
                text: "Die ersten Vielfachen von 7"
                say: "Setze die Reihe der Vielfachen von sieben fort."
                frame: "7, 14, 21, _, _"
                options: ["28", "35", "27", "42"]
                answer: ["28", "35"]
                hints: ["Zähle immer sieben weiter."]
              - id: l1-s3
                type: true_false
                text: "Ist 26 ein Vielfaches von 6?"
                say: "Ist sechsundzwanzig ein Vielfaches von sechs?"
                answer: false
                hints: ["Steht sechsundzwanzig in der Sechserreihe?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Zahl ist ein Vielfaches von 9?"
                say: "Welche Zahl ist ein Vielfaches von neun?"
                options: ["54", "56", "58"]
                answer: "54"
                hints: ["Denk an die Neunerreihe."]
              - id: l1-s5
                type: text_input
                text: "Wie heißt das 6. Vielfache von 8?"
                say: "Wie heißt das sechste Vielfache von acht?"
                answer: "48"
                hints: ["Sechs mal acht."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf alle Vielfachen von 6."
                say: "Tippe auf alle Vielfachen von sechs."
                show: { drawn: letter-card, text: "18 25 30 32 42" }
                spans: ["18", "30", "42"]
              - id: l1-n2
                type: fill_in_blank
                text: "Die ersten Vielfachen von 9"
                say: "Setze die Reihe der Vielfachen von neun fort."
                frame: "9, 18, 27, _, _"
                options: ["36", "45", "35", "46"]
                answer: ["36", "45"]
              - id: l1-n3
                type: true_false
                text: "Ist 49 ein Vielfaches von 7?"
                say: "Ist neunundvierzig ein Vielfaches von sieben?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Welche Zahl ist kein Vielfaches von 4?"
                say: "Welche Zahl ist kein Vielfaches von vier?"
                options: ["30", "32", "36"]
                answer: "30"
              - id: l1-n5
                type: text_input
                text: "Wie heißt das 8. Vielfache von 7?"
                say: "Wie heißt das achte Vielfache von sieben?"
                answer: "56"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tippe auf alle Vielfachen von 5."
            say: "Tippe auf alle Vielfachen von fünf."
            show: { drawn: letter-card, text: "15 21 25 34 40" }
            spans: ["15", "25", "40"]
          - id: l1-c2
            type: true_false
            text: "Ist 33 ein Vielfaches von 8?"
            say: "Ist dreiunddreißig ein Vielfaches von acht?"
            answer: false
          - id: l1-c3
            type: text_input
            text: "Wie heißt das 9. Vielfache von 6?"
            say: "Wie heißt das neunte Vielfache von sechs?"
            answer: "54"

  - n: 2
    title: { de: "Teiler", en: "Divisors" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Ist 24 ein Vielfaches von 3?"
            say: "Ist vierundzwanzig ein Vielfaches von drei?"
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Zahl ist ein Vielfaches von 7?"
            say: "Welche Zahl ist ein Vielfaches von sieben?"
            options: ["42", "44", "46"]
            answer: "42"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "12 = 1 · 12 = 2 · 6 = 3 · 4"
            say: "Ein Teiler von zwölf ist eine Zahl, durch die du zwölf ohne Rest teilen kannst. Such alle Malaufgaben mit dem Ergebnis zwölf: eins mal zwölf, zwei mal sechs, drei mal vier."
            show: { drawn: dots, array: [3, 4] }
          - text: "Teiler von 12: 1, 2, 3, 4, 6, 12"
            say: "Die Teiler von zwölf sind also eins, zwei, drei, vier, sechs und zwölf. Eins und die Zahl selbst sind immer Teiler."
          - text: "3 ist ein Teiler von 12 | 12 ist ein Vielfaches von 3"
            say: "Drei ist ein Teiler von zwölf, und zwölf ist ein Vielfaches von drei. Das gehört zusammen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tippe auf alle Teiler von 18."
                say: "Tippe auf alle Teiler von achtzehn."
                show: { drawn: letter-card, text: "1 2 3 4 5 6 9 18" }
                spans: ["1", "2", "3", "6", "9", "18"]
                hints:
                  - "Such Malaufgaben mit dem Ergebnis achtzehn."
                  - "Eins mal achtzehn ist achtzehn. Welche Malaufgaben mit zwei und mit drei findest du noch?"
                  - "1, 2, 3, 6, 9 und 18."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Ergänze die Teiler von 10."
                say: "Ergänze die Teiler von zehn."
                frame: "1, 2, _, 10"
                options: ["5", "4", "3"]
                answer: ["5"]
                hints:
                  - "Welche Malaufgaben haben das Ergebnis zehn?"
                  - "Eins mal zehn und zwei mal …"
                  - "5."
              - id: l2-f3
                type: true_false
                text: "Ist 5 ein Teiler von 30?"
                say: "Ist fünf ein Teiler von dreißig?"
                answer: true
                hints:
                  - "Kannst du dreißig ohne Rest durch fünf teilen?"
                  - "Sechs mal fünf ist dreißig."
                  - "Ja, 30 : 5 = 6."
              - id: l2-f4
                type: true_false
                text: "Ist 36 ein Teiler von 6?"
                say: "Ist sechsunddreißig ein Teiler von sechs?"
                answer: false
                hints:
                  - "Kann ein Teiler größer sein als die Zahl?"
                  - "Sechsunddreißig ist ein Vielfaches von sechs."
                  - "Nein. 6 ist ein Teiler von 36."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Zahl ist kein Teiler von 24?"
                say: "Welche Zahl ist kein Teiler von vierundzwanzig?"
                options: ["5", "6", "8"]
                answer: "5"
                hints:
                  - "Teile vierundzwanzig durch jede Zahl."
                  - "Bei welcher Zahl bleibt ein Rest?"
                  - "5."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tippe auf alle Teiler von 20."
                say: "Tippe auf alle Teiler von zwanzig."
                show: { drawn: letter-card, text: "1 2 3 4 5 6 10 20" }
                spans: ["1", "2", "4", "5", "10", "20"]
                hints: ["Such Malaufgaben mit dem Ergebnis zwanzig."]
              - id: l2-s2
                type: fill_in_blank
                text: "Ergänze die Teiler von 15."
                say: "Ergänze die Teiler von fünfzehn."
                frame: "1, _, 5, 15"
                options: ["3", "2", "4"]
                answer: ["3"]
                hints: ["Welche Malaufgaben haben das Ergebnis fünfzehn?"]
              - id: l2-s3
                type: true_false
                text: "Ist 4 ein Teiler von 30?"
                say: "Ist vier ein Teiler von dreißig?"
                answer: false
                hints: ["Steht dreißig in der Viererreihe?"]
              - id: l2-s4
                type: true_false
                text: "Ist 7 ein Teiler von 28?"
                say: "Ist sieben ein Teiler von achtundzwanzig?"
                answer: true
                hints: ["Vier mal sieben ist …"]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Zahl ist kein Teiler von 16?"
                say: "Welche Zahl ist kein Teiler von sechzehn?"
                options: ["6", "4", "8"]
                answer: "6"
                hints: ["Bei welcher Zahl bleibt ein Rest?"]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tippe auf alle Teiler von 16."
                say: "Tippe auf alle Teiler von sechzehn."
                show: { drawn: letter-card, text: "1 2 3 4 6 8 16" }
                spans: ["1", "2", "4", "8", "16"]
              - id: l2-n2
                type: fill_in_blank
                text: "Ergänze die Teiler von 21."
                say: "Ergänze die Teiler von einundzwanzig."
                frame: "1, 3, _, 21"
                options: ["7", "6", "9"]
                answer: ["7"]
              - id: l2-n3
                type: true_false
                text: "Ist 9 ein Teiler von 45?"
                say: "Ist neun ein Teiler von fünfundvierzig?"
                answer: true
              - id: l2-n4
                type: true_false
                text: "Ist 8 ein Teiler von 4?"
                say: "Ist acht ein Teiler von vier?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Welche Zahl ist kein Teiler von 36?"
                say: "Welche Zahl ist kein Teiler von sechsunddreißig?"
                options: ["8", "9", "12"]
                answer: "8"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: highlight_in_text
            text: "Tippe auf alle Teiler von 14."
            say: "Tippe auf alle Teiler von vierzehn."
            show: { drawn: letter-card, text: "1 2 3 4 7 14" }
            spans: ["1", "2", "7", "14"]
          - id: l2-c2
            type: true_false
            text: "Ist 54 ein Vielfaches von 9?"
            say: "Ist vierundfünfzig ein Vielfaches von neun?"
            answer: true
          - id: l2-c3
            type: multiple_choice
            text: "Welche Zahl ist kein Teiler von 40?"
            say: "Welche Zahl ist kein Teiler von vierzig?"
            options: ["6", "5", "8"]
            answer: "6"
          - id: l2-c4
            type: fill_in_blank
            text: "Welches Vielfache von 8 fehlt?"
            say: "Welches Vielfache von acht fehlt?"
            frame: "8, 16, _, 32"
            options: ["24", "22", "26"]
            answer: ["24"]
          - id: l2-c5
            type: true_false
            text: "Ist 6 ein Teiler von 32?"
            say: "Ist sechs ein Teiler von zweiunddreißig?"
            answer: false
