# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.more-solids
skill: math.solids.more-solids
curriculum: de-DE
language: de
title:
  de: Pyramide, Zylinder, Kegel
  en: Pyramids, cylinders and cones
summary: >
  Lesson 1 names the Zylinder, the Kegel and the Pyramide by their
  surfaces (zwei Kreisflächen, ein Kreis und eine Spitze, ein Quadrat und
  Dreiecke) and finds them in things around us; lesson 2 counts Ecken,
  Kanten and Flächen of all six solids, sorts solids that can roll from
  those that cannot, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Körper, en: 3D shapes }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.solids.cube-cuboid-sphere, math.shapes.properties]
  also_practises: [math.solids.cube-cuboid-sphere]
  vocabulary: { de: [Zylinder, Kegel, Pyramide, Würfel, Quader, Kugel, Ecke, Kante, Fläche, Spitze, rollen] }
  forms: [text, audio, drawn]
  drawn: [shape]
  facets: []
  parts:
    - { id: name, what: { de: "Pyramide, Zylinder und Kegel erkennen", en: "recognising pyramids, cylinders and cones" } }
    - { id: count, what: { de: "Ecken, Kanten und Flächen zählen", en: "counting vertices, edges and faces" } }
    - { id: sort, what: { de: Körper nach ihren Eigenschaften sortieren, en: sorting 3D shapes by their properties } }
  misconceptions:
    - id: cone-pyramid-mixed
      what: Mixes up the Kegel and the Pyramide because both have a Spitze, or the Kegel and the Zylinder because both are round
      addressed: lesson 1 Learn sets the base of each apart (Kreis or Quadrat); l1-f5 has feedback on calling a Kegel a Pyramide, l1-f3 has feedback on the Kegel, l1-s3 calls a Zylinder a Kegel, l1-s5 and l1-n4 name a body by its base and its Spitze
    - id: corners-edges-faces-mixed
      what: Mixes up Ecken, Kanten and Flächen when counting (6 corners on a Würfel) or forgets the base of the Pyramide
      addressed: lesson 2 Learn shows each word on the Würfel; l2-f1 has feedback on 6 and 12, l2-f2 counts the base in its hints, l2-s1, l2-n1, l2-c2 and l2-c5 ask for one word at a time
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Neue Körper", en: "New 3D shapes" }
    goal:
      de: "Erkenne Zylinder, Kegel und Pyramide, so wie eine Dose oder eine Eiswaffel."
      en: "Spot cylinders, cones and pyramids, like a tin can or an ice cream cone."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie heißt dieser Körper?"
            say: "Wie heißt dieser Körper?"
            show: { drawn: shape, kind: cube, colour: blue }
            options: ["Würfel", "Quadrat", "Kugel"]
            answer: "Würfel"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Körper kann in jede Richtung rollen?"
            say: "Welcher Körper kann in jede Richtung rollen?"
            options: ["Kugel", "Würfel", "Quader"]
            answer: "Kugel"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "der Zylinder"
            say: "Das ist ein Zylinder. Oben und unten hat er eine Kreisfläche. Dazwischen ist er rund. Eine Dose hat die Form eines Zylinders."
            show: { drawn: shape, kind: cylinder, colour: green }
          - text: "der Kegel"
            say: "Das ist ein Kegel. Unten hat er eine Kreisfläche, oben eine Spitze. Eine Eiswaffel hat die Form eines Kegels."
            show: { drawn: shape, kind: cone, colour: orange }
          - text: "die Pyramide"
            say: "Das ist eine Pyramide. Unten hat sie ein Quadrat. Die Seiten sind Dreiecke, die oben in einer Spitze zusammenkommen. Die alten Pyramiden in Ägypten haben diese Form."
            show: { drawn: shape, kind: pyramid, colour: yellow }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißt dieser Körper?"
                say: "Wie heißt dieser Körper?"
                show: { drawn: shape, kind: cylinder, colour: blue }
                options: ["Zylinder", "Kegel", "Kugel"]
                answer: "Zylinder"
                hints:
                  - "Oben und unten ist eine Kreisfläche."
                  - "Er sieht aus wie eine Dose."
                  - "Zylinder."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Wo ist der Kegel?"
                say: "Wo ist der Kegel?"
                options:
                  - { drawn: shape, kind: cone, colour: red }
                  - { drawn: shape, kind: cylinder, colour: red }
                  - { drawn: shape, kind: pyramid, colour: red }
                answer: cone
                option_audio: false
                hints:
                  - "Ein Kegel hat unten einen Kreis und oben eine Spitze."
                  - "Die Pyramide hat unten ein Quadrat, der Zylinder hat keine Spitze."
                  - "Es ist der Körper mit dem Kreis unten und der Spitze oben."
              - id: l1-f3
                type: multiple_choice
                text: "Eine Kerze ist überall gleich dick und oben und unten flach. Welche Form hat sie?"
                say: "Eine Kerze ist überall gleich dick und oben und unten flach. Welche Form hat sie?"
                options: ["Zylinder", "Kegel", "Quader"]
                answer: "Zylinder"
                feedback:
                  "Kegel": "Ein Kegel wird nach oben immer schmaler und hat eine Spitze. Die Kerze ist überall gleich dick."
                hints:
                  - "Oben und unten ist eine Kreisfläche."
                  - "Sie sieht aus wie eine Dose."
                  - "Zylinder."
              - id: l1-f4
                type: true_false
                text: "Die Pyramide hat unten ein Quadrat."
                say: "Stimmt das? Die Pyramide hat unten ein Quadrat."
                show: { drawn: shape, kind: pyramid, colour: blue }
                answer: true
                hints:
                  - "Schau auf die Fläche, auf der die Pyramide steht."
                  - "Die Fläche unten hat vier gleich lange Seiten."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Wie heißt dieser Körper?"
                say: "Wie heißt dieser Körper?"
                show: { drawn: shape, kind: cone, colour: green }
                options: ["Kegel", "Pyramide", "Zylinder"]
                answer: "Kegel"
                feedback:
                  "Pyramide": "Eine Pyramide hat unten ein Quadrat und Dreiecke an den Seiten. Dieser Körper hat unten einen Kreis."
                hints:
                  - "Schau auf die Fläche unten."
                  - "Unten ist ein Kreis, oben eine Spitze."
                  - "Kegel."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jeden Körper mit seinem Namen."
                pairs:
                  - { left: { drawn: shape, kind: cylinder, colour: purple }, right: { text: "Zylinder" } }
                  - { left: { drawn: shape, kind: cone, colour: purple }, right: { text: "Kegel" } }
                  - { left: { drawn: shape, kind: pyramid, colour: purple }, right: { text: "Pyramide" } }
                hints: ["Schau auf die Fläche unten und ob es eine Spitze gibt."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Form hat ein Leitkegel auf der Straße?"
                say: "Welche Form hat ein Leitkegel auf der Straße?"
                options: ["Kegel", "Würfel", "Zylinder"]
                answer: "Kegel"
                hints: ["Der Name sagt es dir."]
              - id: l1-s3
                type: true_false
                text: "Das ist ein Kegel."
                say: "Stimmt das? Das ist ein Kegel."
                show: { drawn: shape, kind: cylinder, colour: orange }
                answer: false
                hints: ["Hat der Körper eine Spitze?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Wo ist die Pyramide?"
                say: "Wo ist die Pyramide?"
                options:
                  - { drawn: shape, kind: pyramid, colour: green }
                  - { drawn: shape, kind: cube, colour: green }
                  - { drawn: shape, kind: cone, colour: green }
                answer: pyramid
                option_audio: false
                hints: ["Die Pyramide hat Dreiecke als Seiten."]
              - id: l1-s5
                type: multiple_choice
                text: "Welcher Körper hat unten einen Kreis und oben eine Spitze?"
                say: "Welcher Körper hat unten einen Kreis und oben eine Spitze?"
                options: ["Kegel", "Zylinder", "Pyramide"]
                answer: "Kegel"
                hints: ["Die Pyramide hat unten ein Quadrat."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie heißt dieser Körper?"
                say: "Wie heißt dieser Körper?"
                show: { drawn: shape, kind: pyramid, colour: green }
                options: ["Pyramide", "Kegel", "Würfel"]
                answer: "Pyramide"
              - id: l1-n2
                type: multiple_choice
                text: "Welche Form hat ein abgesägter Baumstamm?"
                say: "Welche Form hat ein abgesägter Baumstamm?"
                options: ["Zylinder", "Kugel", "Pyramide"]
                answer: "Zylinder"
              - id: l1-n3
                type: image_multiple_choice
                text: "Wo ist der Zylinder?"
                say: "Wo ist der Zylinder?"
                options:
                  - { drawn: shape, kind: cylinder, colour: yellow }
                  - { drawn: shape, kind: cuboid, colour: yellow }
                  - { drawn: shape, kind: sphere, colour: yellow }
                answer: cylinder
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Eine Eiswaffel hat die Form eines Zylinders."
                say: "Stimmt das? Eine Eiswaffel hat die Form eines Zylinders."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Ein Zelt hat unten ein Quadrat und vier dreieckige Seiten. Welche Form hat es?"
                say: "Ein Zelt hat unten ein Quadrat und vier dreieckige Seiten. Welche Form hat es?"
                options: ["Pyramide", "Quader", "Kegel"]
                answer: "Pyramide"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wo ist der Kegel?"
            say: "Wo ist der Kegel?"
            options:
              - { drawn: shape, kind: cone, colour: blue }
              - { drawn: shape, kind: pyramid, colour: blue }
              - { drawn: shape, kind: cube, colour: blue }
            answer: cone
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Wie heißt dieser Körper?"
            say: "Wie heißt dieser Körper?"
            show: { drawn: shape, kind: cylinder, colour: red }
            options: ["Zylinder", "Kegel", "Quader"]
            answer: "Zylinder"
          - id: l1-c3
            type: true_false
            text: "Ein Kegel hat oben eine Spitze."
            say: "Stimmt das? Ein Kegel hat oben eine Spitze."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Welche Form hat ein Partyhut?"
            say: "Welche Form hat ein Partyhut?"
            options: ["Kegel", "Zylinder", "Pyramide"]
            answer: "Kegel"
          - id: l1-c5
            type: true_false
            text: "Eine Pyramide hat unten einen Kreis."
            say: "Stimmt das? Eine Pyramide hat unten einen Kreis."
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Wo ist die Pyramide?"
            say: "Wo ist die Pyramide?"
            options:
              - { drawn: shape, kind: pyramid, colour: purple }
              - { drawn: shape, kind: cone, colour: purple }
              - { drawn: shape, kind: cylinder, colour: purple }
            answer: pyramid
            option_audio: false

  - n: 2
    title: { de: "Ecken, Kanten, Flächen", en: "Vertices, edges and faces" }
    goal:
      de: "Zähl Ecken, Kanten und Flächen von Körpern. Ein Würfel hat 8 Ecken, 12 Kanten und 6 Flächen."
      en: "Count the corners, edges and faces of 3D shapes. A cube has 8 corners, 12 edges and 6 faces."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie heißt dieser Körper?"
            say: "Wie heißt dieser Körper?"
            show: { drawn: shape, kind: cone, colour: yellow }
            options: ["Kegel", "Zylinder", "Pyramide"]
            answer: "Kegel"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Form hat eine Dose?"
            say: "Welche Form hat eine Dose?"
            options: ["Zylinder", "Kegel", "Kugel"]
            answer: "Zylinder"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Würfel: 6 Flächen, 12 Kanten, 8 Ecken"
            say: "Körper haben Flächen, Kanten und Ecken. Die Flächen sind die Außenseiten des Körpers. Wo zwei Flächen zusammenstoßen, ist eine Kante. Wo Kanten zusammenkommen, ist eine Ecke. Ein Würfel hat sechs Flächen, zwölf Kanten und acht Ecken."
            show: { drawn: shape, kind: cube, colour: red }
          - text: "Pyramide: 5 Flächen, 8 Kanten, 5 Ecken"
            say: "Die Pyramide hat unten ein Quadrat und an den Seiten vier Dreiecke, zusammen fünf Flächen. Unten hat sie vier Kanten, zur Spitze hin noch einmal vier, zusammen acht. Dazu kommen vier Ecken unten und die Spitze oben: fünf Ecken."
            show: { drawn: shape, kind: pyramid, colour: yellow }
          - text: "Zylinder: 3 Flächen, 2 Kanten, keine Ecke"
            say: "Der Zylinder hat zwei Kreisflächen und eine gebogene Fläche dazwischen. Er hat zwei runde Kanten und keine Ecke. Mit der gebogenen Fläche kann er rollen. Der Kegel hat zwei Flächen, eine Kante und oben die Spitze."
            show: { drawn: shape, kind: cylinder, colour: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Ecken hat ein Würfel?"
                say: "Wie viele Ecken hat ein Würfel?"
                show: { drawn: shape, kind: cube, colour: green }
                options: ["8", "6", "12"]
                answer: "8"
                feedback:
                  "6": "6 hat der Würfel Flächen. Zähl die Ecken: 4 oben und 4 unten."
                  "12": "12 hat der Würfel Kanten. Ecken sind es weniger."
                hints:
                  - "Zähl die Ecken oben und unten."
                  - "4 Ecken oben, 4 Ecken unten."
                  - "8."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie viele Flächen hat die Pyramide?"
                say: "Wie viele Flächen hat die Pyramide?"
                show: { drawn: shape, kind: pyramid, colour: orange }
                options: ["5", "4", "8"]
                answer: "5"
                hints:
                  - "Zähl die Fläche unten mit."
                  - "Unten ein Quadrat, dazu 4 Dreiecke."
                  - "5."
              - id: l2-f3
                type: true_false
                text: "Ein Zylinder hat keine Ecke."
                say: "Stimmt das? Ein Zylinder hat keine Ecke."
                answer: true
                hints:
                  - "Ecken sind spitz."
                  - "Die Kanten vom Zylinder laufen rundherum."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: sorting
                text: "Kann der Körper rollen?"
                say: "Sortiere die Körper: Kann er rollen oder nicht?"
                bins:
                  - { id: rollt, show: { text: "kann rollen" }, say: "kann rollen" }
                  - { id: steht, show: { text: "kann nicht rollen" }, say: "kann nicht rollen" }
                options:
                  - { text: "Kugel", bin: rollt }
                  - { text: "Zylinder", bin: rollt }
                  - { text: "Kegel", bin: rollt }
                  - { text: "Würfel", bin: steht }
                  - { text: "Quader", bin: steht }
                  - { text: "Pyramide", bin: steht }
                hints:
                  - "Ein Körper rollt, wenn er eine gebogene Fläche hat."
                  - "Kugel, Zylinder und Kegel haben gebogene Flächen."
                  - "Kugel, Zylinder und Kegel rollen. Würfel, Quader und Pyramide nicht."
              - id: l2-f5
                type: multiple_choice
                text: "Wie viele Kanten hat eine Pyramide?"
                say: "Wie viele Kanten hat eine Pyramide?"
                options: ["8", "5", "4"]
                answer: "8"
                hints:
                  - "Zähl die Kanten unten und dann die zur Spitze."
                  - "4 Kanten unten, 4 Kanten zur Spitze."
                  - "8."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Flächen hat ein Quader?"
                say: "Wie viele Flächen hat ein Quader?"
                show: { drawn: shape, kind: cuboid, colour: purple }
                options: ["6", "8", "4"]
                answer: "6"
                hints: ["Oben, unten, vorne, hinten, links, rechts."]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Körper hat nur eine einzige Fläche?"
                say: "Welcher Körper hat nur eine einzige Fläche?"
                options: ["Kugel", "Kegel", "Zylinder"]
                answer: "Kugel"
                hints: ["Welcher Körper ist überall rund?"]
              - id: l2-s3
                type: true_false
                text: "Der Kegel hat zwei Flächen."
                say: "Stimmt das? Der Kegel hat zwei Flächen."
                show: { drawn: shape, kind: cone, colour: red }
                answer: true
                hints: ["Eine Kreisfläche unten und eine gebogene Fläche."]
              - id: l2-s4
                type: multiple_choice
                text: "Welcher Körper hat 5 Ecken?"
                say: "Welcher Körper hat fünf Ecken?"
                options: ["Pyramide", "Würfel", "Zylinder"]
                answer: "Pyramide"
                hints: ["4 Ecken unten und eine Spitze oben."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche zwei Körper haben gleich viele Ecken, Kanten und Flächen?"
                say: "Welche zwei Körper haben gleich viele Ecken, Kanten und Flächen?"
                options: ["Würfel und Quader", "Würfel und Pyramide", "Kegel und Zylinder"]
                answer: "Würfel und Quader"
                hints: ["Ein Quader ist ein lang gezogener Würfel."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele Kanten hat ein Würfel?"
                say: "Wie viele Kanten hat ein Würfel?"
                options: ["12", "8", "6"]
                answer: "12"
              - id: l2-n2
                type: multiple_choice
                text: "Wie viele Kanten hat der Zylinder?"
                say: "Wie viele Kanten hat der Zylinder?"
                show: { drawn: shape, kind: cylinder, colour: yellow }
                options: ["2", "0", "3"]
                answer: "2"
              - id: l2-n3
                type: true_false
                text: "Eine Pyramide kann rollen."
                say: "Stimmt das? Eine Pyramide kann rollen."
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Ich habe 6 Flächen, 12 Kanten und 8 Ecken. Alle Flächen sind gleich große Quadrate. Wer bin ich?"
                say: "Ich habe sechs Flächen, zwölf Kanten und acht Ecken. Alle Flächen sind gleich große Quadrate. Wer bin ich?"
                options: ["Würfel", "Zylinder", "Pyramide"]
                answer: "Würfel"
              - id: l2-n5
                type: text_input
                text: "Wie viele Ecken haben ein Würfel und eine Pyramide zusammen?"
                say: "Wie viele Ecken haben ein Würfel und eine Pyramide zusammen?"
                answer: "13"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: name
            type: multiple_choice
            text: "Welcher Körper ist das?"
            say: "Welcher Körper ist das?"
            show: { drawn: shape, kind: pyramid, colour: red }
            options: ["Pyramide", "Kegel", "Quader"]
            answer: "Pyramide"
          - id: l2-c2
            part: count
            type: multiple_choice
            text: "Wie viele Ecken hat eine Pyramide?"
            say: "Wie viele Ecken hat eine Pyramide?"
            options: ["5", "4", "8"]
            answer: "5"
          - id: l2-c3
            part: count
            type: true_false
            text: "Ein Kegel hat 2 Kanten."
            say: "Stimmt das? Ein Kegel hat zwei Kanten."
            answer: false
          - id: l2-c4
            part: name
            type: image_multiple_choice
            text: "Welcher Körper hat zwei Kreisflächen?"
            say: "Welcher Körper hat zwei Kreisflächen?"
            options:
              - { drawn: shape, kind: cylinder, colour: green }
              - { drawn: shape, kind: cone, colour: green }
              - { drawn: shape, kind: sphere, colour: green }
            answer: cylinder
            option_audio: false
          - id: l2-c5
            part: sort
            type: multiple_choice
            text: "Welcher Körper hat 6 Flächen, die nicht alle Quadrate sind?"
            say: "Welcher Körper hat sechs Flächen, die nicht alle Quadrate sind?"
            options: ["Quader", "Würfel", "Pyramide"]
            answer: "Quader"
          - id: l2-c6
            part: name
            type: multiple_choice
            text: "Eine Trommel ist überall gleich dick und oben und unten rund und flach. Welche Form hat sie?"
            say: "Eine Trommel ist überall gleich dick und oben und unten rund und flach. Welche Form hat sie?"
            options: ["Zylinder", "Kegel", "Pyramide"]
            answer: "Zylinder"
          - id: l2-c7
            part: name
            type: true_false
            text: "Das ist eine Pyramide."
            say: "Stimmt das? Das ist eine Pyramide."
            show: { drawn: shape, kind: cone, colour: blue }
            answer: false
          - id: l2-c8
            part: name
            type: multiple_choice
            text: "Welcher Körper hat unten ein Quadrat und oben eine Spitze?"
            say: "Welcher Körper hat unten ein Quadrat und oben eine Spitze?"
            options: ["Pyramide", "Kegel", "Würfel"]
            answer: "Pyramide"
          - id: l2-c9
            part: name
            type: image_multiple_choice
            text: "Welcher Körper hat die Form einer Schultüte?"
            say: "Welcher Körper hat die Form einer Schultüte?"
            options:
              - { drawn: shape, kind: cylinder, colour: orange }
              - { drawn: shape, kind: cone, colour: orange }
              - { drawn: shape, kind: pyramid, colour: orange }
            answer: cone
            option_audio: false
          - id: l2-c10
            part: name
            type: matching
            text: "Wie heißen die Körper?"
            say: "Wie heißen die Körper? Verbinde jedes Bild mit seinem Namen."
            pairs:
              - { left: { drawn: shape, kind: pyramid, colour: red }, right: { text: "Pyramide" } }
              - { left: { drawn: shape, kind: cylinder, colour: red }, right: { text: "Zylinder" } }
              - { left: { drawn: shape, kind: cone, colour: red }, right: { text: "Kegel" } }
              - { left: { drawn: shape, kind: cube, colour: red }, right: { text: "Würfel" } }
          - id: l2-c11
            part: count
            type: multiple_choice
            text: "Wie viele Flächen hat ein Würfel?"
            say: "Wie viele Flächen hat ein Würfel?"
            show: { drawn: shape, kind: cube, colour: yellow }
            options: ["6", "8", "12"]
            answer: "6"
          - id: l2-c12
            part: count
            type: multiple_choice
