                  - "806 wird 800, 395 wird 400."
                  - "800 − 400 = 400."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Überschlag für 489 + 307: 500 + 300 = 800"
                say: "Der Überschlag für vierhundertneunundachtzig plus dreihundertsieben ist fünfhundert plus dreihundert gleich achthundert. Stimmt das?"
                answer: true
                hints:
                  - "Runde 489 auf Hunderter."
                  - "489 wird 500, 307 wird 300."
                  - "Ja, 800."
              - id: l1-f5
                type: multiple_choice
                text: "Ungefähr wie viel ist 251 + 449?"
                say: "Zweihunderteinundfünfzig plus vierhundertneunundvierzig. Ungefähr wie viel ist das?"
