# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.estimate-to-1000
skill: math.add-sub-to-1000.estimate
curriculum: de-DE
language: de
title:
  de: Überschlagen
  en: Estimating
summary: >
  A Überschlag with numbers rounded to hundreds shows roughly how big a
  result is. Lesson 1 makes the Überschlag for plus and minus sums before
  calculating; lesson 2 checks results with it (does 597 fit 400 + 400?),
  finds calculations with a big mistake, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.round, math.add-sub-to-1000.semi-written]
  also_practises: [math.numbers-to-1000.round, math.add-sub-to-1000.semi-written]
  vocabulary: { de: [Überschlag, überschlagen, ungefähr, runden, Hunderter] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: estimate-add, what: { de: einen Überschlag für Plusaufgaben machen, en: estimating an addition } }
    - { id: estimate-sub, what: { de: einen Überschlag für Minusaufgaben machen, en: estimating a subtraction } }
    - { id: check, what: { de: Ergebnisse mit dem Überschlag prüfen und große Fehler finden, en: checking results against an estimate and finding big mistakes } }
  misconceptions:
    - id: round-wrong-way
      what: Rounds down whatever the tens (298 to 200)
      addressed: Learn rounds to the nearest hundred, as in Runden; feedback on the rounded-down Überschlag in the full stage
    - id: estimate-as-exact
      what: Thinks a result that matches the Überschlag must be exactly right, or that one that differs a little is wrong
      addressed: lesson 2 Learn says the Überschlag shows big mistakes only; true/false tasks have exact results near the Überschlag that are right and far ones that are wrong
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
