            say: "Der Überschlag sagt dir nicht, ob dein Ergebnis genau stimmt. Er zeigt aber große Fehler, zum Beispiel einen vergessenen Hunderter. Liegt dein Ergebnis weit weg vom Überschlag, rechne noch einmal."

