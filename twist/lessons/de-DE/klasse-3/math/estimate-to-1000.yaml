                options: ["600", "200", "800", "100", "700"]
                answer: ["600", "200", "800"]
                hints:
                  - "Runde 612 und 189 auf Hunderter."
                  - "612 wird 600, 189 wird 200."
                  - "600 + 200 = 800."
              - id: l1-f3
                type: multiple_choice
                text: "Ungefähr wie viel ist 806 − 395?"
                say: "Achthundertsechs minus dreihundertfünfundneunzig. Ungefähr wie viel ist das?"
