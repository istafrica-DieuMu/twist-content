    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Runde 382 auf Hunderter."
            say: "Runde dreihundertzweiundachtzig auf Hunderter."
            options: ["400", "300", "380"]
            answer: "400"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "500 + 300 = _"
            say: "Fünfhundert plus dreihundert."
            answer: "800"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "387 + 412 ≈ 400 + 400 = 800"
            say: "Dreihundertsiebenundachtzig plus vierhundertzwölf. Bevor du rechnest, überschlägst du: Runde beide Zahlen auf Hunderter. Vierhundert plus vierhundert ist achthundert. Das Ergebnis ist ungefähr achthundert."
          - text: "387 + 412 = 799"
            say: "Jetzt rechnest du genau: siebenhundertneunundneunzig. Das liegt nah bei achthundert. Es passt zum Überschlag."
          - text: "712 − 289 ≈ 700 − 300 = 400"
            say: "Bei Minusaufgaben geht das genauso. Siebenhundertzwölf rundest du auf siebenhundert, zweihundertneunundachtzig auf dreihundert. Siebenhundert minus dreihundert ist vierhundert."

