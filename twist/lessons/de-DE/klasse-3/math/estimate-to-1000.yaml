                  - "Runde beide Zahlen auf Hunderter."
                  - "298 wird 300, 503 wird 500."
                  - "300 + 500 = 800."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Überschlag: 612 + 189"
