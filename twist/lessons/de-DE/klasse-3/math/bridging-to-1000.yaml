# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.bridging-to-1000
skill: math.add-sub-to-1000.bridging
curriculum: de-DE
language: de
title:
  de: Über Zehner und Hunderter rechnen
  en: Adding and subtracting across tens and hundreds
summary: >
  Mental adding and subtracting that crosses a ten or a hundred, in steps
  via the full ten or hundred, as in Klasse 2. Lesson 1 adds and subtracts
  tens across a hundred (380 + 50 = 380 + 20 + 30); lesson 2 adds and
  subtracts ones across a ten and sometimes a hundred (605 − 8, 396 + 7),
  and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-1000.hundreds, math.add-sub-to-100.ones-bridge]
  also_practises: [math.add-sub-to-100.complement]
  vocabulary: { de: [voller Hunderter, voller Zehner, Hunderterübergang, Zehnerübergang, zerlegen] }
  forms: [drawn, text, audio]
  drawn: [equation, rechenstrich]
  facets: []
  parts:
    - { id: tens, what: { de: Zehner über den Hunderter addieren und subtrahieren, en: adding and subtracting tens across a hundred } }
    - { id: ones-add, what: { de: Einer über den Zehner oder Hunderter addieren, en: adding ones across a ten or a hundred } }
    - { id: ones-sub, what: { de: Einer über den Zehner oder Hunderter subtrahieren, en: subtracting ones across a ten or a hundred } }
    - { id: steps, what: { de: in Schritten über den vollen Zehner oder Hunderter rechnen, en: working in steps via the full ten or hundred } }
  misconceptions:
    - id: carry-dropped
      what: Loses the new hundred when the tens add to more than ten (290 + 40 = 230)
      addressed: Learn goes to the full hundred first; feedback on 230 in the full stage counts the thirteen tens
    - id: ones-reversed
      what: Subtracts the smaller ones digit from the larger one (703 − 5 = 702)
      addressed: lesson 2 Learn takes away in two steps via the full hundred; feedback on 702 in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Über den Hunderter, en: Across the hundred }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "520 + 40 = _"
            say: "Fünfhundertzwanzig plus vierzig."
            answer: "560"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viel fehlt von 370 bis 400?"
            say: "Wie viel fehlt von dreihundertsiebzig bis vierhundert?"
            options: ["30", "70", "130"]
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "380 + 50 = ?"
            say: "Dreihundertachtzig plus fünfzig. Bis zum vollen Hunderter vierhundert fehlen zwanzig. Wir zerlegen die fünfzig in zwanzig und dreißig."
            show: { drawn: equation, text: "380 + 50 = _", split: "50 = 20 + 30" }
          - text: "380 + 20 + 30 = 430"
            say: "Erst zwanzig bis vierhundert, dann noch dreißig: vierhundertdreißig. Das ist ein Hunderterübergang."
            show: { drawn: rechenstrich, start: 380, jumps: [20, 30] }
          - text: "620 − 40 = 580"
            say: "Bei minus genauso: Von sechshundertzwanzig erst zwanzig zurück bis zum vollen Hunderter sechshundert, dann noch zwanzig: fünfhundertachtzig."
            show: { drawn: rechenstrich, start: 620, jumps: [-20, -20] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Erst bis zum vollen Hunderter."
                say: "Dreihundertsiebzig plus sechzig. Erst bis vierhundert, dann den Rest."
                frame: "370 + 60 = 370 + 30 + _ = _"
                options: ["30", "60", "400", "430"]
                answer: ["30", "430"]
                hints:
                  - "Bis 400 fehlen 30."
                  - "60 sind 30 und noch 30."
                  - "400 + 30 = 430."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "290 + 40 = ?"
                say: "Zweihundertneunzig plus vierzig. Wie viel ist das?"
                options: ["330", "230", "690"]
                answer: "330"
                feedback:
                  "230": "Neun Zehner und vier Zehner sind dreizehn Zehner: ein neuer Hunderter und drei Zehner. Das sind 330."
                  "690": "Vierzig sind vier Zehner, nicht vier Hunderter."
                hints:
                  - "Bis 300 fehlen 10."
                  - "Dann noch 30."
                  - "330."
              - id: l1-f3
                type: multiple_choice
                text: "Welcher Sprung kommt zuerst? 450 − 70"
                say: "Vierhundertfünfzig minus siebzig. Du springst zuerst zurück bis zum vollen Hunderter. Welcher Sprung kommt zuerst?"
                show: { drawn: rechenstrich, start: 450, jumps: [], back: true }
                options: ["−50", "−70", "−20"]
                answer: "−50"
                option_audio: false
                hints:
                  - "Der volle Hunderter vor 450 ist 400."
                  - "Von 450 bis 400 sind es 50."
                  - "Erst −50, dann noch −20."
              - id: l1-f4
                type: text_input
                text: "560 + 70 = _"
                say: "Fünfhundertsechzig plus siebzig."
                answer: "630"
                hints:
                  - "Bis 600 fehlen 40."
                  - "70 sind 40 und 30."
                  - "630."
              - id: l1-f5
                type: fill_in_blank
                text: "Erst bis zum vollen Hunderter."
                say: "Siebenhundertdreißig minus fünfzig. Erst bis siebenhundert zurück, dann den Rest."
                frame: "730 − 50 = 730 − 30 − _ = _"
                options: ["20", "50", "700", "680"]
                answer: ["20", "680"]
                hints:
                  - "Von 730 bis 700 sind es 30."
                  - "50 sind 30 und 20."
                  - "700 − 20 = 680."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? 840 + 90 = 930"
                say: "Achthundertvierzig plus neunzig ist neunhundertdreißig. Stimmt das?"
                answer: true
                hints:
                  - "Bis 900 fehlen 60."
                  - "Dann noch 30."
                  - "Ja, 930."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Erst bis zum vollen Hunderter."
                say: "Vierhundertachtzig plus fünfzig. Erst bis fünfhundert, dann den Rest."
                frame: "480 + 50 = 480 + 20 + _ = _"
                options: ["20", "30", "500", "530"]
                answer: ["30", "530"]
                hints: ["Wie viel bleibt von den 50 übrig?"]
              - id: l1-s2
                type: text_input
                text: "310 − 40 = _"
                say: "Dreihundertzehn minus vierzig."
                answer: "270"
                hints: ["Spring erst zurück bis zum vollen Hunderter."]
              - id: l1-s3
                type: multiple_choice
