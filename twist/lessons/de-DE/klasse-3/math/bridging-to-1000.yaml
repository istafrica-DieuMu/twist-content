                say: "Sechshundertfünfzig plus achtzig. Wie viel ist das?"
                options: ["730", "630", "1450"]
                answer: "730"
                hints: ["Wie viel fehlt bis zum nächsten vollen Hunderter?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 520 − 60 = 480"
                say: "Fünfhundertzwanzig minus sechzig ist vierhundertachtzig. Stimmt das?"
                answer: false
                hints: ["Rechne in zwei Sprüngen über die 500."]
              - id: l1-s5
                type: text_input
                text: "190 + 30 = _"
                say: "Hundertneunzig plus dreißig."
                answer: "220"
                hints: ["Wie viel fehlt bis 200?"]
              - id: l1-s6
                type: fill_in_blank
                text: "Erst bis zum vollen Hunderter."
                say: "Neunhundertzehn minus dreißig. Erst bis neunhundert zurück, dann den Rest."
                frame: "910 − 30 = 910 − 10 − _ = _"
                options: ["20", "30", "900", "880"]
                answer: ["20", "880"]
                hints: ["Wie viel bleibt von den 30 übrig?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "770 + 40 = _"
                say: "Siebenhundertsiebzig plus vierzig."
                answer: "810"
              - id: l1-n2
                type: text_input
                text: "430 − 80 = _"
                say: "Vierhundertdreißig minus achtzig."
                answer: "350"
              - id: l1-n3
                type: multiple_choice
                text: "360 + 90 = ?"
                say: "Dreihundertsechzig plus neunzig. Wie viel ist das?"
                options: ["450", "350", "1260"]
                answer: "450"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 210 − 50 = 160"
                say: "Zweihundertzehn minus fünfzig ist hundertsechzig. Stimmt das?"
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Schreib die Schritte."
                say: "Fünfhundertachtzig plus siebzig. Schreib die Schritte."
                frame: "580 + 70 = 580 + 20 + _ = _"
                options: ["50", "70", "600", "650"]
                answer: ["50", "650"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "260 + 60 = _"
            say: "Zweihundertsechzig plus sechzig."
            answer: "320"
          - id: l1-c2
            type: text_input
            text: "740 − 70 = _"
            say: "Siebenhundertvierzig minus siebzig."
            answer: "670"
          - id: l1-c3
            type: multiple_choice
            text: "890 + 30 = ?"
            say: "Achthundertneunzig plus dreißig. Wie viel ist das?"
            options: ["920", "820", "1190"]
            answer: "920"
          - id: l1-c4
            type: fill_in_blank
            text: "Schreib die Schritte."
            say: "Vierhundertsechzig plus siebzig. Schreib die Schritte."
            frame: "460 + 70 = 460 + 40 + _ = _"
            options: ["30", "70", "500", "530"]
            answer: ["30", "530"]
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 830 − 50 = 880"
            say: "Achthundertdreißig minus fünfzig ist achthundertachtzig. Stimmt das?"
            answer: false
          - id: l1-c6
            type: text_input
            text: "150 + 80 = _"
            say: "Hundertfünfzig plus achtzig."
            answer: "230"

