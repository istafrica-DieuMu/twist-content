# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.time-minutes
skill: math.time.minutes
curriculum: de-DE
language: de
title:
  de: Minutengenau und 13 bis 24 Uhr
  en: Time to the minute, and the 24-hour clock
summary: >
  Lesson 1 reads the clock to the minute by counting from the last
  Fünferschritt (on the 4 plus 3 small marks is 23 minutes); lesson 2
  gives afternoon and evening times with 13 to 24 Uhr (3 Uhr nachmittags
  is 15 Uhr), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Uhrzeit, en: Time }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.time.five-minutes, math.numbers-to-100.sequences]
  also_practises: [math.time.five-minutes]
  vocabulary: { de: [Minute, Minutenstrich, vormittags, nachmittags, abends, 15 Uhr] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: []
  misconceptions:
    - id: skip-small-marks
      what: Reads only to the last Fünferschritt (6:23 as 6:20)
      addressed: lesson 1 Learn counts the small marks after the Fünferschritt; every stage of lesson 1 offers the rounded time
    - id: add-10-not-12
      what: Adds 10 instead of 12 for the afternoon (3 Uhr nachmittags = 13 Uhr)
      addressed: lesson 2 Learn adds 12; every stage of lesson 2 offers the +10 time, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Auf die Minute genau", en: "To the minute" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 4, minute: 25 }
            options: ["5 vor halb 5", "5 nach halb 5", "5 vor halb 4"]
            answer: "5 vor halb 5"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "20 + 3 = _"
            say: "Zwanzig plus drei."
            answer: "23"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6:23 Uhr"
            say: "Zwischen zwei Zahlen auf der Uhr sind kleine Striche. Jeder Strich ist eine Minute. Der große Zeiger steht drei Striche hinter der Vier. Zur Vier gehören zwanzig Minuten, dazu kommen drei: dreiundzwanzig Minuten. Es ist sechs Uhr dreiundzwanzig."
            show: { drawn: clock, hour: 6, minute: 23, digital: true }
          - text: "6:58 Uhr"
            say: "Hier steht der große Zeiger zwei Striche vor der Zwölf. Das sind achtundfünfzig Minuten. Es ist sechs Uhr achtundfünfzig, also zwei Minuten vor sieben."
            show: { drawn: clock, hour: 6, minute: 58, digital: true }
          - text: "zuerst Fünferschritte, dann Minutenstriche"
            say: "So liest du die Minuten: Zähle zuerst in Fünferschritten bis zur letzten Zahl, dann die kleinen Striche dazu."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es genau?"
                show: { drawn: clock, hour: 2, minute: 12 }
                options: ["2:12", "2:10", "2:02"]
                answer: "2:12"
                hints:
                  - "Zähle zuerst in Fünferschritten."
                  - "Bis zur Zwei sind es zehn Minuten. Wie viele Striche kommen dazu?"
                  - "2:12."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Wie viele Minuten nach 8 Uhr?"
                say: "Wie viele Minuten nach acht Uhr ist es?"
                show: { drawn: clock, hour: 8, minute: 37 }
                answer: "37"
                hints:
                  - "Bis zur Sieben sind es fünfunddreißig Minuten."
                  - "Zähle die kleinen Striche dazu."
                  - "37."
              - id: l1-f3
                type: true_false
                text: "Ist es 10:48 Uhr?"
                say: "Ist es zehn Uhr achtundvierzig?"
                show: { drawn: clock, hour: 10, minute: 48 }
                answer: true
                hints:
                  - "Bis zur Neun sind es fünfundvierzig Minuten."
                  - "Drei Striche weiter."
                  - "Ja, es ist 10:48 Uhr."
              - id: l1-f4
                type: image_multiple_choice
                text: "Welche Uhr zeigt 4:17 Uhr?"
                say: "Welche Uhr zeigt vier Uhr siebzehn?"
                options:
                  - { drawn: clock, hour: 4, minute: 17 }
                  - { drawn: clock, hour: 4, minute: 15 }
                  - { drawn: clock, hour: 3, minute: 20 }
                answer: "4:17"
                hints:
                  - "Siebzehn Minuten: zwei Striche nach der Drei."
                  - "Der kleine Zeiger ist kurz nach der Vier."
                  - "Die Uhr mit 4:17 Uhr."
              - id: l1-f5
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es genau?"
                show: { drawn: clock, hour: 11, minute: 56 }
                options: ["11:56", "12:56", "11:55"]
                answer: "11:56"
                hints:
                  - "Der große Zeiger steht kurz vor der Zwölf."
                  - "Es fehlen vier Minuten bis zur vollen Stunde. Welche Stunde läuft noch?"
                  - "11:56."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es genau?"
                show: { drawn: clock, hour: 7, minute: 33 }
                options: ["7:33", "7:30", "7:03"]
                answer: "7:33"
                hints: ["Fünferschritte bis zur Sechs, dann die Striche."]
              - id: l1-s2
                type: text_input
                text: "Wie viele Minuten nach 3 Uhr?"
                say: "Wie viele Minuten nach drei Uhr ist es?"
                show: { drawn: clock, hour: 3, minute: 41 }
                answer: "41"
                hints: ["Bis zur Acht sind es vierzig Minuten."]
              - id: l1-s3
                type: true_false
                text: "Ist es 5:09 Uhr?"
                say: "Ist es fünf Uhr neun?"
                show: { drawn: clock, hour: 5, minute: 6 }
                answer: false
                hints: ["Bis zur Eins sind es fünf Minuten. Zähle die Striche."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Welche Uhr zeigt 9:52 Uhr?"
                say: "Welche Uhr zeigt neun Uhr zweiundfünfzig?"
                options:
                  - { drawn: clock, hour: 9, minute: 50 }
                  - { drawn: clock, hour: 9, minute: 52 }
                  - { drawn: clock, hour: 10, minute: 52 }
                answer: "9:52"
                hints: ["Zweiundfünfzig: zwei Striche nach der Zehn."]
              - id: l1-s5
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es genau?"
                show: { drawn: clock, hour: 12, minute: 4 }
                options: ["12:04", "12:00", "12:05"]
                answer: "12:04"
                hints: ["Der große Zeiger hat die Eins noch nicht erreicht."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es genau?"
                show: { drawn: clock, hour: 1, minute: 28 }
                options: ["1:28", "1:25", "2:28"]
                answer: "1:28"
              - id: l1-n2
                type: text_input
                text: "Wie viele Minuten nach 6 Uhr?"
                say: "Wie viele Minuten nach sechs Uhr ist es?"
                show: { drawn: clock, hour: 6, minute: 19 }
                answer: "19"
              - id: l1-n3
                type: true_false
                text: "Ist es 8:44 Uhr?"
                say: "Ist es acht Uhr vierundvierzig?"
                show: { drawn: clock, hour: 8, minute: 44 }
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Welche Uhr zeigt 2:38 Uhr?"
                say: "Welche Uhr zeigt zwei Uhr achtunddreißig?"
                options:
                  - { drawn: clock, hour: 2, minute: 38 }
                  - { drawn: clock, hour: 2, minute: 35 }
                  - { drawn: clock, hour: 8, minute: 10 }
                answer: "2:38"
              - id: l1-n5
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es genau?"
                show: { drawn: clock, hour: 10, minute: 1 }
                options: ["10:01", "10:05", "10:10"]
                answer: "10:01"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es genau?"
            show: { drawn: clock, hour: 3, minute: 27 }
            options: ["3:27", "3:25", "3:07"]
            answer: "3:27"
          - id: l1-c2
            type: text_input
            text: "Wie viele Minuten nach 9 Uhr?"
            say: "Wie viele Minuten nach neun Uhr ist es?"
            show: { drawn: clock, hour: 9, minute: 53 }
            answer: "53"
          - id: l1-c3
            type: true_false
            text: "Ist es 4:31 Uhr?"
            say: "Ist es vier Uhr einunddreißig?"
            show: { drawn: clock, hour: 4, minute: 34 }
            answer: false

  - n: 2
    title: { de: "13 bis 24 Uhr", en: "The 24-hour clock" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es genau?"
            show: { drawn: clock, hour: 5, minute: 14 }
            options: ["5:14", "5:10", "5:04"]
            answer: "5:14"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "3 + 12 = _"
            say: "Drei plus zwölf."
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 Uhr nachmittags = 15 Uhr"
            say: "Der kleine Zeiger läuft an einem Tag zweimal herum. Am Nachmittag zählst du die Stunden einfach weiter: Nach zwölf Uhr mittags kommt dreizehn Uhr. Drei Uhr nachmittags ist fünfzehn Uhr."
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "+ 12"
            say: "Für die Zeit am Nachmittag und am Abend rechnest du plus zwölf: Sieben Uhr abends ist sieben plus zwölf, also neunzehn Uhr."
          - text: "18:30 = halb 7 abends"
            say: "Andersherum rechnest du minus zwölf: Achtzehn Uhr dreißig ist halb sieben abends."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "4 Uhr nachmittags. Wie viel Uhr ist das?"
                say: "Es ist vier Uhr nachmittags. Wie viel Uhr ist das?"
                options: ["16 Uhr", "14 Uhr", "4 Uhr"]
                answer: "16 Uhr"
                feedback:
                  "14 Uhr": "Am Nachmittag rechnest du plus zwölf, nicht plus zehn."
                hints:
                  - "Am Nachmittag rechnest du plus zwölf."
                  - "Vier plus zwölf."
                  - "16 Uhr."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Der Film beginnt um 19 Uhr. Wann ist das?"
                say: "Der Film beginnt um neunzehn Uhr. Wann ist das?"
                options: ["7 Uhr abends", "9 Uhr abends", "7 Uhr morgens"]
                answer: "7 Uhr abends"
                hints:
                  - "Rechne minus zwölf."
                  - "Was ist neunzehn minus zwölf? Ist das vor oder nach Mittag?"
                  - "7 Uhr abends."
              - id: l2-f3
                type: text_input
                text: "Halb 3 nachmittags = _:30 Uhr"
                say: "Halb drei am Nachmittag ist wie viel Uhr dreißig? Tippe die Stunde ein."
                answer: "14"
                hints:
                  - "Halb drei: Welche Stunde läuft gerade?"
                  - "Es ist zwei Uhr dreißig. Am Nachmittag rechnest du plus zwölf."
                  - "14:30 Uhr."
              - id: l2-f4
                type: true_false
                text: "Ist 22 Uhr dasselbe wie 10 Uhr abends?"
                say: "Ist zweiundzwanzig Uhr dasselbe wie zehn Uhr abends?"
                answer: true
                hints:
                  - "Rechne minus zwölf."
                  - "Was ist zweiundzwanzig minus zwölf?"
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Tom geht um Viertel nach 8 abends ins Bett. Welche Zeit passt?"
                say: "Tom geht um Viertel nach acht am Abend ins Bett. Welche Zeit passt?"
                options: ["20:15", "8:15", "18:15"]
                answer: "20:15"
                hints:
                  - "Viertel nach acht ist acht Uhr fünfzehn."
                  - "Am Abend: acht plus zwölf."
                  - "20:15."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "6 Uhr abends. Wie viel Uhr ist das?"
                say: "Es ist sechs Uhr abends. Wie viel Uhr ist das?"
                options: ["18 Uhr", "16 Uhr", "6 Uhr"]
                answer: "18 Uhr"
                hints: ["Rechne plus zwölf."]
              - id: l2-s2
                type: multiple_choice
                text: "Das Schwimmbad schließt um 21 Uhr. Wann ist das?"
                say: "Das Schwimmbad schließt um einundzwanzig Uhr. Wann ist das?"
                options: ["9 Uhr abends", "11 Uhr abends", "9 Uhr morgens"]
                answer: "9 Uhr abends"
                hints: ["Rechne minus zwölf."]
              - id: l2-s3
                type: text_input
                text: "1 Uhr mittags = _ Uhr"
                say: "Ein Uhr mittags. Wie viel Uhr ist das?"
                answer: "13"
                hints: ["Nach zwölf Uhr kommt …"]
              - id: l2-s4
                type: true_false
                text: "Ist 17 Uhr dasselbe wie 7 Uhr abends?"
                say: "Ist siebzehn Uhr dasselbe wie sieben Uhr abends?"
                answer: false
                hints: ["Siebzehn minus zwölf."]
              - id: l2-s5
                type: multiple_choice
                text: "Lena kommt um 20 nach 4 am Nachmittag nach Hause. Welche Zeit passt?"
                say: "Lena kommt um zwanzig nach vier am Nachmittag nach Hause. Welche Zeit passt?"
                options: ["16:20", "14:20", "4:20"]
                answer: "16:20"
                hints: ["Zwanzig nach vier ist vier Uhr zwanzig. Am Nachmittag kommen zur Stunde zwölf dazu."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "9 Uhr abends. Wie viel Uhr ist das?"
                say: "Es ist neun Uhr abends. Wie viel Uhr ist das?"
                options: ["21 Uhr", "19 Uhr", "9 Uhr"]
                answer: "21 Uhr"
              - id: l2-n2
                type: multiple_choice
                text: "Der Zug fährt um 13:45 Uhr. Wann ist das?"
                say: "Der Zug fährt um dreizehn Uhr fünfundvierzig. Wann ist das?"
                options: ["Viertel vor 2 nachmittags", "Viertel vor 1 nachmittags", "Viertel nach 1 nachmittags"]
                answer: "Viertel vor 2 nachmittags"
              - id: l2-n3
                type: text_input
                text: "Halb 6 abends = _:30 Uhr"
                say: "Halb sechs am Abend ist wie viel Uhr dreißig? Tippe die Stunde ein."
                answer: "17"
              - id: l2-n4
                type: true_false
                text: "Ist 24 Uhr Mitternacht?"
                say: "Ist vierundzwanzig Uhr Mitternacht?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Die Party beginnt um 5 nach 3 nachmittags. Welche Zeit passt?"
                say: "Die Party beginnt um fünf nach drei am Nachmittag. Welche Zeit passt?"
                options: ["15:05", "13:05", "15:15"]
                answer: "15:05"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es genau?"
            show: { drawn: clock, hour: 8, minute: 22 }
            options: ["8:22", "8:20", "8:02"]
            answer: "8:22"
          - id: l2-c2
            type: image_multiple_choice
            text: "Welche Uhr zeigt 11:39 Uhr?"
            say: "Welche Uhr zeigt elf Uhr neununddreißig?"
            options:
              - { drawn: clock, hour: 11, minute: 39 }
              - { drawn: clock, hour: 11, minute: 35 }
              - { drawn: clock, hour: 7, minute: 55 }
            answer: "11:39"
          - id: l2-c3
            type: multiple_choice
            text: "5 Uhr nachmittags. Wie viel Uhr ist das?"
            say: "Es ist fünf Uhr nachmittags. Wie viel Uhr ist das?"
            options: ["17 Uhr", "15 Uhr", "5 Uhr"]
            answer: "17 Uhr"
          - id: l2-c4
            type: multiple_choice
            text: "Das Konzert beginnt um 20 Uhr. Wann ist das?"
            say: "Das Konzert beginnt um zwanzig Uhr. Wann ist das?"
            options: ["8 Uhr abends", "10 Uhr abends", "8 Uhr morgens"]
            answer: "8 Uhr abends"
          - id: l2-c5
            type: true_false
            text: "Ist 14 Uhr dasselbe wie 2 Uhr nachmittags?"
            say: "Ist vierzehn Uhr dasselbe wie zwei Uhr nachmittags?"
            answer: true
