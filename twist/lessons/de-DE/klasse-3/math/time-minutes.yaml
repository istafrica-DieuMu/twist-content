            text: "Die Schule ist um 13:26 Uhr aus. Stell die Uhr auf diese Zeit."
            say: "Die Schule ist um dreizehn Uhr sechsundzwanzig aus. Stell die Uhr auf diese Zeit. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 1
            answer: "1:26"
          - id: l2-c13
            part: set
            type: clock_hands_drag
            text: "Das Spiel beginnt um 16:43 Uhr. Stell die Uhr auf diese Zeit."
            say: "Das Spiel beginnt um sechzehn Uhr dreiundvierzig. Stell die Uhr auf diese Zeit. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 1
            answer: "4:43"
          - id: l2-c14
            part: to-24
            type: multiple_choice
            text: "8 Uhr abends. Wie viel Uhr ist das?"
            say: "Es ist acht Uhr abends. Wie viel Uhr ist das?"
            options: ["20 Uhr", "18 Uhr", "8 Uhr"]
