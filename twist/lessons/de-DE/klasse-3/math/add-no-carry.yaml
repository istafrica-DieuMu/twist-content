          - text: "Überschlag: 350 + 20 = 370"
            say: "Mach vorher einen Überschlag. Dreihundertfünfzig plus zwanzig ist ungefähr dreihundertsiebzig. Das Ergebnis dreihundertsechsundsiebzig passt dazu."

