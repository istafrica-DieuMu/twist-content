                options: ["Der Übertrag bei den Zehnern fehlt.", "Die Einer sind falsch.", "Die Hunderter sind falsch."]
                answer: "Der Übertrag bei den Zehnern fehlt."
                feedback:
                  "Die Einer sind falsch.": "Neun plus sechs ist fünfzehn: Die Fünf unten stimmt. Aber das Kind hat die Eins nicht zu den Zehnern übertragen."
                hints:
                  - "Rechne Stelle für Stelle nach."
                  - "Einer: fünfzehn. Schreib fünf, übertrag eins."
                  - "Zehner: fünf plus zwei plus eins ist acht, nicht sieben."
              - id: l2-f3
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertneunundsiebzig plus zweihundertsechsundvierzig."
