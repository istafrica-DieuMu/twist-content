            answer: "373"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "10 Zehner sind …"
            say: "Zehn Zehner sind wie viel?"
            options: ["1 Hunderter", "1 Zehner", "10 Einer"]
            answer: "1 Hunderter"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du? 368 + 275: Brauchst du einen Übertrag oder sogar zwei?"
            say: "Dreihundertachtundsechzig plus zweihundertfünfundsiebzig. Was glaubst du: Brauchst du einen Übertrag oder sogar zwei?"
            show: { drawn: written-calc, rows: ["368", "275"], op: "+" }
          - text: "368 + 275"
            say: "Probieren wir es aus! Einer: acht plus fünf ist dreizehn. Drei schreibst du hin, eins überträgst du. Das ist der erste Übertrag."
            show: { drawn: written-calc, rows: ["368", "275"], op: "+", carry: " 1 ", result: "__3" }
          - text: "6 + 7 + 1 = 14"
            say: "Zehner: sechs plus sieben plus eins ist vierzehn. Vierzehn Zehner sind ein Hunderter und vier Zehner. Vier schreibst du hin, eins überträgst du zu den Hundertern. Das ist der zweite Übertrag!"
            show: { drawn: written-calc, rows: ["368", "275"], op: "+", carry: "11 ", result: "_43" }
          - text: "3 + 2 + 1 = 6 → 643"
            say: "Hunderter: drei plus zwei plus eins ist sechs. Das Ergebnis ist sechshundertdreiundvierzig. Der Übertrag bedeutet immer: Zehn an einer Stelle sind eins an der nächsten Stelle."
            show: { drawn: written-calc, rows: ["368", "275"], op: "+", carry: "11 ", result: "643" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an. Hier gibt es zwei Überträge."
                show: { drawn: written-calc, rows: ["457", "286"], op: "+", carry: "11 ", result: "___" }
