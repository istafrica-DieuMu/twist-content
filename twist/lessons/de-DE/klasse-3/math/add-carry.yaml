# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.add-carry
skill: math.written-add-sub.add-carry
curriculum: de-DE
language: de
title:
  de: Schriftlich addieren mit Übertrag
  en: Column addition with carrying
summary: >
  When a column makes ten or more, the ten moves to the next column as a
  small Übertrag. Lesson 1 carries from the Einer to the Zehner (347 +
  238); lesson 2 carries in two columns and explains what the Übertrag
  means (ten Einer are one Zehner), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.add-no-carry]
  also_practises: [math.add-sub-to-1000.estimate]
  vocabulary: { de: [Übertrag, übertragen, Einer, Zehner, Hunderter, schriftlich addieren] }
  forms: [picture, drawn, text, audio]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: one-carry, what: { de: mit einem Übertrag schriftlich addieren, en: column addition with one carry } }
    - { id: two-carries, what: { de: mit zwei Überträgen schriftlich addieren, en: column addition with two carries } }
    - { id: meaning, what: { de: "sagen, was man hinschreibt und was der Übertrag bedeutet", en: saying what to write down and what the carried digit means } }
    - { id: check, what: { de: Rechnungen prüfen und Fehler finden, en: checking calculations and finding mistakes } }
  misconceptions:
    - id: write-both-digits
      what: Writes 15 under the Einer instead of 5 and carrying 1
      addressed: Learn shows the 5 written and the 1 carried; "Was schreibst du bei den Einern?" offers the two-digit answer (13, 14) in every stage of lesson 1, with feedback in the full stage
    - id: forget-carry
      what: Forgets to add the carried 1 in the next column (347 + 238 = 575)
      addressed: Learn adds the Übertrag aloud; a "Wo ist der Fehler?" task with a forgotten carry in each stage of lesson 2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Übertrag zu den Zehnern, en: Carrying to the tens }
    goal:
      de: "Rechne schriftlich plus und denk an den Übertrag zu den Zehnern, so wie bei 347 + 238."
      en: "Add in columns and remember to carry to the tens, like in 347 + 238."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: dreihundertzwölf plus hundertsechsundsiebzig."
            show: { drawn: written-calc, rows: ["312", "176"], op: "+" }
            answer: "488"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "10 Einer sind …"
            say: "Zehn Einer sind wie viele Zehner?"
            options: ["1 Zehner", "10 Zehner", "100 Zehner"]
            answer: "1 Zehner"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was glaubst du? 347 + 238: Bei den Einern ist 7 + 8 = 15. Was schreibst du unter die Einer?"
            say: "Dreihundertsiebenundvierzig plus zweihundertachtunddreißig. Fang bei den Einern an: sieben plus acht ist fünfzehn. Aber unter die Einer passt nur eine Ziffer. Was glaubst du: Was schreibst du hin?"
            show: { drawn: written-calc, rows: ["347", "238"], op: "+" }
          - text: "Schreib 5, übertrag 1."
            say: "Nur die Fünf! Fünfzehn ist ein Zehner und fünf Einer. Die Fünf schreibst du unter die Einer. Den einen Zehner schreibst du klein zu den Zehnern: Das ist der Übertrag."
            show: { drawn: written-calc, rows: ["347", "238"], op: "+", carry: " 1 ", result: "__5" }
          - text: "4 + 3 + 1 = 8 | 3 + 2 = 5"
            say: "Bei den Zehnern rechnest du den Übertrag mit: vier plus drei plus eins ist acht. Bei den Hundertern: drei plus zwei ist fünf. Das Ergebnis ist fünfhundertfünfundachtzig."
            show: { drawn: written-calc, rows: ["347", "238"], op: "+", carry: " 1 ", result: "585" }
          - text: "Wusstest du? Ein Jahr hat 365 Tage. Fast alle 4 Jahre kommt der 29. Februar dazu. Dann hat das Jahr 366 Tage."
            say: "Wusstest du? Ein Jahr hat dreihundertfünfundsechzig Tage. Fast alle vier Jahre kommt ein Tag dazu, der neunundzwanzigste Februar. Dann hat das Jahr dreihundertsechsundsechzig Tage und heißt Schaltjahr. Wer am neunundzwanzigsten Februar Geburtstag hat, kann nur in einem Schaltjahr am richtigen Tag feiern!"
            show: { object: present }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an. Denk an den Übertrag."
                show: { drawn: written-calc, rows: ["256", "317"], op: "+", carry: " 1 ", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["3", "7", "5", "6"]
                answer: ["3", "7", "5"]
                hints:
                  - "Einer: sechs plus sieben ist dreizehn. Schreib drei, übertrag eins."
                  - "Zehner: fünf plus eins plus eins."
                  - "E: 3, Z: 7, H: 5. Das ist 573."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was schreibst du bei den Einern?"
                say: "Bei den Einern rechnest du neun plus vier. Was schreibst du unter die Einer, und was überträgst du?"
                show: { drawn: written-calc, rows: ["429", "134"], op: "+" }
                options: ["3, Übertrag 1", "13", "4, Übertrag 1"]
                answer: "3, Übertrag 1"
                feedback:
                  "13": "Unter eine Stelle passt nur eine Ziffer. Dreizehn ist drei Einer und ein Zehner: Die Eins wird übertragen."
                hints:
                  - "Neun plus vier ist dreizehn."
                  - "Dreizehn: ein Zehner und drei Einer."
                  - "Schreib 3, übertrag 1."
              - id: l1-f3
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: vierhundertneunundzwanzig plus hundertvierunddreißig."
                show: { drawn: written-calc, rows: ["429", "134"], op: "+" }
                answer: "563"
                hints:
                  - "Einer: neun plus vier ist dreizehn. Schreib drei, übertrag eins."
                  - "Zehner: zwei plus drei plus eins."
                  - "563."
              - id: l1-f4
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["168", "225"], op: "+", carry: " 1 ", result: "393" }
                answer: true
                hints:
                  - "Einer: acht plus fünf ist dreizehn."
                  - "Zehner: sechs plus zwei plus eins ist neun."
                  - "Ja, 393."
              - id: l1-f5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: fünfhundertsechsundvierzig plus dreihundertsiebenundzwanzig."
                show: { drawn: written-calc, rows: ["546", "327"], op: "+" }
                answer: "873"
                hints:
                  - "Einer: sechs plus sieben."
                  - "Dreizehn: Schreib drei, übertrag eins."
                  - "873."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an. Denk an den Übertrag."
                show: { drawn: written-calc, rows: ["138", "454"], op: "+", carry: " 1 ", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["2", "9", "5", "8"]
                answer: ["2", "9", "5"]
                hints: ["Acht plus vier: Was schreibst du hin, was überträgst du?"]
              - id: l1-s2
                type: text_input
                text: "Lea hat 365 Sticker, Tim hat 217. Wie viele haben beide zusammen? Rechne schriftlich."
                say: "Lea hat dreihundertfünfundsechzig Sticker, Tim hat zweihundertsiebzehn. Wie viele haben beide zusammen? Rechne schriftlich."
                show: { drawn: written-calc, rows: ["365", "217"], op: "+" }
                answer: "582"
                hints: ["Denk an den Übertrag bei den Zehnern."]
              - id: l1-s3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["237", "445"], op: "+", result: "672" }
                answer: false
                hints: ["Rechne jede Stelle nach, fang bei den Einern an."]
              - id: l1-s4
                type: multiple_choice
                text: "Einer: 7 + 7. Was schreibst du?"
                say: "Bei den Einern rechnest du sieben plus sieben. Was schreibst du unter die Einer, und was überträgst du?"
                options: ["4, Übertrag 1", "14", "7, Übertrag 1"]
                answer: "4, Übertrag 1"
                hints: ["Wie viel ist sieben plus sieben? Wie viele Zehner und Einer sind das?"]
              - id: l1-s5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: sechshundertachtundfünfzig plus zweihundertvierunddreißig."
                show: { drawn: written-calc, rows: ["658", "234"], op: "+" }
                answer: "892"
                hints: ["Einer zuerst."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: fünfhundertneunzehn plus zweihundertdreiundsiebzig. Schreib die Ziffern für die Einer, die Zehner und die Hunderter."
                show: { drawn: written-calc, rows: ["519", "273"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["2", "9", "7", "8"]
                answer: ["2", "9", "7"]
              - id: l1-n2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertsechsundachtzig plus siebenhundertsieben."
                show: { drawn: written-calc, rows: ["186", "707"], op: "+" }
                answer: "893"
              - id: l1-n3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["425", "348"], op: "+", carry: " 1 ", result: "773" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Einer: 8 + 6. Was schreibst du?"
                say: "Bei den Einern rechnest du acht plus sechs. Was schreibst du unter die Einer, und was überträgst du?"
                options: ["4, Übertrag 1", "14", "8, Übertrag 1"]
                answer: "4, Übertrag 1"
              - id: l1-n5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: dreihundertneunundvierzig plus fünfhundertsechsundzwanzig."
                show: { drawn: written-calc, rows: ["349", "526"], op: "+" }
                answer: "875"

      - activity: check
