              - id: l2-s5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihundertneunundneunzig plus fünfhundertsiebenundsechzig."
                show: { drawn: written-calc, rows: ["299", "567"], op: "+" }
                answer: "866"
