                text: "Bei den Zehnern steht ein Übertrag 1. Was bedeutet er?"
                say: "Bei den Zehnern steht ein kleiner Übertrag, eine Eins. Was bedeutet diese Eins?"
                options: ["ein Zehner aus den Einern", "ein Einer", "ein Hunderter", "ein Fleck im Heft"]
                answer: "ein Zehner aus den Einern"
                feedback:
                  "ein Fleck im Heft": "Kein Fleck! Die kleine Eins ist wichtig. Sie kommt aus den Einern."
                hints:
                  - "Woher kommt der Übertrag?"
                  - "Aus den Einern: zehn Einer."
                  - "Ein Zehner."
              - id: l2-f5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: fünfhundertsechsundachtzig plus dreihundertsiebenundvierzig."
                show: { drawn: written-calc, rows: ["586", "347"], op: "+" }
                answer: "933"
                hints:
                  - "Einer: sechs plus sieben ist dreizehn."
                  - "Zehner: acht plus vier plus eins ist dreizehn."
                  - "933."

