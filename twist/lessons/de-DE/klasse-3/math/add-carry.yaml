                  - "Zehner: fünf plus acht plus eins ist vierzehn. Schreib vier, übertrag eins."
                  - "Hunderter: vier plus zwei plus eins ist sieben. Das ist 743."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wo ist der Fehler?"
                say: "Ein Kind hat zweihundertneunundfünfzig plus dreihundertsechsundzwanzig gleich fünfhundertfünfundsiebzig gerechnet. Was ist falsch?"
