  - n: 2
    title: { de: Zwei Überträge, en: Carrying twice }
    goal:
      de: "Rechne schriftlich mit zwei Überträgen, so wie bei 368 + 275, und sag, was die kleine 1 bedeutet."
      en: "Add in columns with two carries, like in 368 + 275, and say what the small 1 means."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: hundertsiebenundzwanzig plus zweihundertsechsundvierzig."
