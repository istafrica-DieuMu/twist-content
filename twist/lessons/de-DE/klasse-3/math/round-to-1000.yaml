                text: "Runde 254."
                frame: "auf Zehner: _   auf Hunderter: _"
                options: ["200", "250", "260", "300"]
                answer: ["250", "300"]
                hints: ["Erst die Einerziffer, dann die Zehnerziffer."]
              - id: l2-s4
