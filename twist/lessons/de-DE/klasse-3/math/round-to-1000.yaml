                answer: "600"
                hints:
                  - "Welche Hunderter liegen neben 620?"
                  - "600 und 700. 620 ist näher an 600."
                  - "620 gerundet ist 600."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Runde 471 auf Hunderter."
                show: { drawn: number-line, from: 400, to: 500, step: 10, labels: ends, mark: 471 }
                options: ["400", "500", "470"]
                answer: "500"
                feedback:
                  "470": "Das ist auf Zehner gerundet. Auf Hunderter entscheidet die Zehnerziffer."
                hints:
                  - "Die Zehnerziffer entscheidet."
                  - "Sie ist 7: aufrunden."
                  - "471 gerundet ist 500."
              - id: l2-f3
                type: multiple_choice
                text: "Runde 850 auf Hunderter."
                options: ["800", "900", "850"]
                answer: "900"
                hints:
                  - "850 liegt genau in der Mitte."
                  - "Zehnerziffer 5: aufrunden."
                  - "850 gerundet ist 900."
              - id: l2-f4
