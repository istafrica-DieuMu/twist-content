# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.round-to-1000
skill: math.numbers-to-1000.round
curriculum: de-DE
language: de
title:
  de: Runden auf Zehner und Hunderter
  en: Rounding to tens and hundreds
summary: >
  Rounding finds the nearest ten or hundred, using the Nachbarzehner and
  Nachbarhunderter from the last skill. Lesson 1 rounds to tens; lesson 2
  rounds to hundreds, with the rule for 5 and 50 (round up), and ends with
  the skill check.
metadata:
  year: klasse-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.order-compare]
  also_practises: [math.numbers-to-1000.number-line]
  vocabulary: { de: [runden, aufrunden, abrunden, ungefähr, Nachbarzehner, Nachbarhunderter] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: []
  parts:
    - { id: tens, what: { de: Zahlen bis 1000 auf Zehner runden, en: rounding numbers to 1000 to the nearest ten } }
    - { id: hundreds, what: { de: Zahlen bis 1000 auf Hunderter runden, en: rounding numbers to 1000 to the nearest hundred } }
    - { id: reverse, what: { de: "Zahlen finden, die gerundet eine bestimmte Zahl ergeben", en: finding numbers that round to a given number } }
  misconceptions:
    - id: round-down-always
      what: Always cuts off the ones (rounds 47 to 40)
      addressed: Learn shows the distance to both neighbours on the number line; feedback on 40 says which neighbour is nearer
    - id: halfway
      what: Does not know what to do with 5 or 50
      addressed: Learn states the rule (bei 5 aufrunden); every stage has a halfway number
    - id: wrong-digit
      what: Looks at the ones digit when rounding to hundreds (rounds 246 to 300)
      addressed: lesson 2 Learn says which digit decides; tasks round the same number to tens and to hundreds
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Auf Zehner runden, en: Rounding to tens }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Wie heißen die Nachbarzehner von 47?"
            frame: "_ , 47, _"
            options: ["40", "46", "48", "50"]
            answer: ["40", "50"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Zehner ist näher an 83?"
            options: ["80", "90"]
            answer: "80"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "47 ≈ 50"
            say: "Runden heißt: den Zehner nehmen, der am nächsten liegt. Siebenundvierzig liegt zwischen vierzig und fünfzig. Bis fünfzig sind es nur drei Schritte. Also runden wir auf fünfzig."
            show: { drawn: number-line, from: 40, to: 50, labels: ends, mark: 47 }
          - text: "342 ≈ 340"
            say: "Dreihundertzweiundvierzig liegt zwischen dreihundertvierzig und dreihundertfünfzig. Dreihundertvierzig ist näher. Wir runden ab."
            show: { drawn: number-line, from: 340, to: 350, labels: ends, mark: 342 }
          - text: "65 ≈ 70"
            say: "Und genau in der Mitte, bei fünf Einern? Dann runden wir auf. Fünfundsechzig wird siebzig. Die Einerziffer entscheidet: null bis vier abrunden, fünf bis neun aufrunden."
            show: { drawn: number-line, from: 60, to: 70, labels: ends, mark: 65 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Runde 38 auf Zehner."
                show: { drawn: number-line, from: 30, to: 40, labels: ends, mark: 38 }
                options: ["30", "40", "38"]
                answer: "40"
                feedback:
                  "30": "38 ist näher an 40. Bis 40 sind es nur 2 Schritte."
                hints:
                  - "Welche Zehner liegen neben 38?"
                  - "30 und 40. Welcher ist näher?"
                  - "40 ist näher. 38 gerundet ist 40."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Runde 71 auf Zehner."
                show: { drawn: number-line, from: 70, to: 80, labels: ends, mark: 71 }
                options: ["70", "80", "100"]
                answer: "70"
                hints:
                  - "Die Einerziffer ist 1."
                  - "0 bis 4: abrunden."
                  - "71 gerundet ist 70."
              - id: l1-f3
                type: multiple_choice
                text: "Runde 255 auf Zehner."
                show: { drawn: number-line, from: 250, to: 260, labels: ends, mark: 255 }
                options: ["250", "260", "300"]
                answer: "260"
                hints:
                  - "255 liegt genau in der Mitte."
                  - "Bei 5 runden wir auf."
                  - "255 gerundet ist 260."
              - id: l1-f4
                type: text_input
                text: "Runde 486 auf Zehner."
                answer: "490"
                hints:
                  - "Die Nachbarzehner sind 480 und 490."
                  - "Die Einerziffer ist 6: aufrunden."
                  - "486 gerundet ist 490."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 723 auf Zehner gerundet ist 730."
                answer: false
                hints:
                  - "Welche Ziffer entscheidet?"
                  - "Die Einerziffer 3: abrunden."
                  - "Nein, 723 gerundet ist 720."
              - id: l1-f6
                type: multiple_choice
                text: "Welche Zahl ergibt auf Zehner gerundet 60?"
                options: ["54", "57", "65"]
                answer: "57"
                hints:
                  - "Welche Zahl hat 60 als nächsten Zehner?"
                  - "54 wird 50, 65 wird 70."
                  - "57 wird 60."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Runde 92 auf Zehner."
                options: ["90", "100", "92"]
                answer: "90"
                hints: ["Die Einerziffer ist 2."]
              - id: l1-s2
                type: multiple_choice
                text: "Runde 415 auf Zehner."
                options: ["410", "420", "400"]
                answer: "420"
                hints: ["Bei 5 aufrunden."]
              - id: l1-s3
                type: text_input
                text: "Runde 639 auf Zehner."
                answer: "640"
                hints: ["Die Einerziffer ist 9."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 804 auf Zehner gerundet ist 800."
                answer: true
                hints: ["Die Einerziffer ist 4."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Zahl ergibt auf Zehner gerundet 300?"
                options: ["296", "305", "289"]
                answer: "296"
                hints: ["Die Nachbarzehner von 296 sind 290 und 300."]
              - id: l1-s6
                type: text_input
                text: "Runde 148 auf Zehner."
                answer: "150"
                hints: ["Aufrunden oder abrunden?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Runde 26 auf Zehner."
                options: ["20", "30", "26"]
                answer: "30"
              - id: l1-n2
                type: text_input
                text: "Runde 563 auf Zehner."
                answer: "560"
              - id: l1-n3
                type: multiple_choice
                text: "Runde 745 auf Zehner."
                options: ["740", "750", "700"]
                answer: "750"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 997 auf Zehner gerundet ist 1000."
                answer: true
              - id: l1-n5
                type: text_input
                text: "Runde 311 auf Zehner."
                answer: "310"
              - id: l1-n6
                type: multiple_choice
                text: "Welche Zahl ergibt auf Zehner gerundet 450?"
                options: ["444", "455", "453"]
                answer: "453"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Runde 67 auf Zehner."
            options: ["60", "70", "67"]
            answer: "70"
          - id: l1-c2
            type: text_input
            text: "Runde 432 auf Zehner."
            answer: "430"
          - id: l1-c3
            type: multiple_choice
            text: "Runde 885 auf Zehner."
            options: ["880", "890", "900"]
            answer: "890"
          - id: l1-c4
            type: text_input
            text: "Runde 209 auf Zehner."
            answer: "210"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 375 auf Zehner gerundet ist 370."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Welche Zahl ergibt auf Zehner gerundet 40?"
            options: ["34", "36", "45"]
            answer: "36"

  - n: 2
    title: { de: Auf Hunderter runden, en: Rounding to hundreds }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Runde 54 auf Zehner."
            options: ["50", "60", "54"]
            answer: "50"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Runde 275 auf Zehner."
            answer: "280"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "380 ≈ 400"
            say: "Auf Hunderter runden heißt: den nächsten Hunderter nehmen. Dreihundertachtzig liegt zwischen dreihundert und vierhundert, näher an vierhundert."
            show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends, mark: 380 }
          - text: "Die Zehnerziffer entscheidet"
            say: "Beim Runden auf Hunderter entscheidet die Zehnerziffer: null bis vier abrunden, fünf bis neun aufrunden. Bei dreihundertachtzig ist sie acht: aufrunden."
          - text: "246 ≈ 250, 246 ≈ 200"
            say: "Dieselbe Zahl kann man auf Zehner und auf Hunderter runden. Zweihundertsechsundvierzig auf Zehner ist zweihundertfünfzig. Auf Hunderter ist es zweihundert, denn die Zehnerziffer ist vier."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Runde 620 auf Hunderter."
                show: { drawn: number-line, from: 600, to: 700, step: 10, labels: ends, mark: 620 }
