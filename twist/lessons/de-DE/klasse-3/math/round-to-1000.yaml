              - id: l2-s6
                type: multiple_choice
                text: "Welche Zahl ergibt auf Hunderter gerundet 700?"
                options: ["640", "680", "750"]
                answer: "680"
                hints: ["Die Nachbarhunderter von 680 sind 600 und 700."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Runde 219 auf Hunderter."
                options: ["200", "300", "220"]
                answer: "200"
              - id: l2-n2
                type: text_input
                text: "Runde 666 auf Hunderter."
                answer: "700"
              - id: l2-n3
