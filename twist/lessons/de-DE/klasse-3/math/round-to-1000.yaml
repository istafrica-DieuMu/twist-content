                hints:
                  - "Auf Zehner entscheidet die Einerziffer 8."
                  - "Auf Hunderter entscheidet die Zehnerziffer 3."
                  - "740 und 700."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 149 auf Hunderter gerundet ist 200."
                answer: false
