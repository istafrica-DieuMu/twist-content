                answer: "1000"
                hints:
                  - "Die Nachbarhunderter sind 900 und 1000."
                  - "Zehnerziffer 6: aufrunden."
                  - "962 gerundet ist 1000."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Runde 330 auf Hunderter."
                options: ["300", "400", "330"]
                answer: "300"
