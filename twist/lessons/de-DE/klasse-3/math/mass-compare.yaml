# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.mass-compare
skill: math.mass-capacity.compare-mass
curriculum: de-DE
language: de
title:
  de: Gewichte vergleichen
  en: Comparing mass
summary: >
  Lesson 1 compares two things by weight with a Balkenwaage told in words
  (die schwerere Seite geht nach unten), learns that big is not always
  heavy and what Gleichgewicht means; lesson 2 orders three things from
  two comparisons, compares weights in gleiche Würfel and ends with the
  skill check. A drawn balance waits for a balance component; the scale
  is described in text for now.
metadata:
  year: klasse-3
  topic: { de: Gewichte, en: Mass }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-20.compare-to-20]
  also_practises: []
  vocabulary: { de: [schwer, leicht, schwerer, leichter, gleich schwer, Balkenwaage, Gleichgewicht] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: balance, what: { de: "an der Balkenwaage ablesen, was schwerer ist", en: reading a balance to see which is heavier } }
    - { id: compare, what: { de: zwei Gegenstände nach dem Gewicht vergleichen, en: comparing two things by mass } }
    - { id: order, what: { de: drei Gegenstände nach dem Gewicht ordnen, en: ordering three things by mass } }
    - { id: cubes, what: { de: Gewichte in gleichen Würfeln vergleichen, en: comparing masses in identical cubes } }
  misconceptions:
    - id: bigger-is-heavier
      what: Thinks the bigger thing is always the heavier one (a balloon heavier than a stone)
      addressed: lesson 1 Learn sets a big light balloon against a small heavy stone; l1-f3 has feedback on the balloon, l1-s2 asks whether bigger always means heavier, l1-n4 compares two buckets of the same size, l1-c2 and l2-c4 offer a big light thing
    - id: balance-up-is-heavy
      what: Thinks the side of the balance that goes up is the heavier one
      addressed: lesson 1 Learn says the heavier side goes down; l1-f2, l1-f5, l1-s5 and l1-n2 read the balance both ways, l1-n3 claims the lighter side goes down
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Schwerer oder leichter?", en: "Heavier or lighter?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Zahl ist am größten?"
            say: "Welche Zahl ist am größten?"
            options: ["9", "14", "11"]
            answer: "14"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Zahl ist kleiner: 13 oder 7?"
            say: "Welche Zahl ist kleiner: dreizehn oder sieben?"
            options: ["7", "13"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Bei der Balkenwaage geht die schwerere Seite nach unten."
            say: "Das ist eine Balkenwaage. Auf jede Seite legst du etwas. Die schwerere Seite geht nach unten, die leichtere Seite geht nach oben."
          - text: "links ein Apfel, rechts eine Kirsche\nDie linke Seite ist unten.\nDer Apfel ist schwerer."
            say: "Links liegt ein Apfel, rechts eine Kirsche. Die linke Seite geht nach unten. Also ist der Apfel schwerer als die Kirsche. Wenn beide Seiten gleich hoch bleiben, ist die Waage im Gleichgewicht. Dann ist beides gleich schwer."
          - text: "Ein Luftballon ist groß, aber leicht.\nEin Stein ist klein, aber schwer."
            say: "Groß heißt nicht immer schwer. Ein Luftballon ist groß, aber er ist voll Luft und ganz leicht. Ein kleiner Stein ist schwerer."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Links liegt ein Buch, rechts ein Radiergummi. Welche Seite geht nach unten?"
                say: "Auf der Balkenwaage liegt links ein Buch und rechts ein Radiergummi. Welche Seite geht nach unten?"
                options: ["die Seite mit dem Buch", "die Seite mit dem Radiergummi", "keine, beide bleiben gleich hoch"]
                answer: "die Seite mit dem Buch"
                hints:
                  - "Die schwerere Seite geht nach unten."
                  - "Ein Buch ist viel schwerer als ein Radiergummi."
                  - "die Seite mit dem Buch."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Links liegt eine Kastanie, rechts ein Stein. Die rechte Seite ist unten. Was ist schwerer?"
                say: "Links liegt eine Kastanie, rechts ein Stein. Die rechte Seite ist unten. Was ist schwerer?"
                options: ["der Stein", "die Kastanie", "beide gleich schwer"]
                answer: "der Stein"
                feedback:
                  "die Kastanie": "Die Kastanie ist oben. Die schwerere Seite geht nach unten."
                hints:
                  - "Welche Seite ist unten?"
                  - "Rechts ist unten. Rechts liegt der Stein."
                  - "der Stein."
              - id: l1-f3
                type: multiple_choice
                text: "Was ist schwerer?"
                say: "Was ist schwerer: ein kleiner Stein oder ein großer Luftballon?"
                options: ["ein kleiner Stein", "ein großer Luftballon"]
                answer: "ein kleiner Stein"
                feedback:
                  "ein großer Luftballon": "Der Luftballon ist größer, aber er ist voll Luft. Groß heißt nicht immer schwer."
                hints:
                  - "Stell dir vor, du hältst beides in der Hand."
                  - "Ein Luftballon ist voll Luft."
                  - "ein kleiner Stein."
              - id: l1-f4
                type: true_false
                text: "Die Waage ist im Gleichgewicht. Dann sind beide Seiten gleich schwer."
                say: "Stimmt das? Die Waage ist im Gleichgewicht. Dann sind beide Seiten gleich schwer."
                answer: true
                hints:
                  - "Im Gleichgewicht sind beide Seiten gleich hoch."
                  - "Keine Seite ist schwerer, sonst ginge sie nach unten."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Links liegt ein Kürbis, rechts eine Tomate. Welche Seite ist oben?"
                say: "Auf der Waage liegt links ein Kürbis und rechts eine Tomate. Welche Seite ist oben?"
                options: ["die Seite mit der Tomate", "die Seite mit dem Kürbis"]
                answer: "die Seite mit der Tomate"
                hints:
                  - "Die leichtere Seite geht nach oben."
                  - "Was ist leichter, der Kürbis oder die Tomate?"
                  - "die Seite mit der Tomate."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Links liegt ein Schuh, rechts eine Feder. Welche Seite geht nach unten?"
                say: "Links liegt ein Schuh, rechts eine Feder. Welche Seite geht nach unten?"
                options: ["die Seite mit dem Schuh", "die Seite mit der Feder", "keine, beide bleiben gleich hoch"]
                answer: "die Seite mit dem Schuh"
                hints: ["Die schwerere Seite geht nach unten."]
              - id: l1-s2
                type: true_false
                text: "Was größer ist, ist immer auch schwerer."
                say: "Stimmt das? Was größer ist, ist immer auch schwerer."
                answer: false
                hints: ["Denk an den Luftballon und den Stein."]
              - id: l1-s3
                type: multiple_choice
                text: "Links liegt eine Banane, rechts ein Apfel. Die Waage ist im Gleichgewicht. Was stimmt?"
                say: "Links liegt eine Banane, rechts ein Apfel. Die Waage ist im Gleichgewicht. Was stimmt?"
                options: ["Beide sind gleich schwer.", "Die Banane ist schwerer.", "Der Apfel ist schwerer."]
                answer: "Beide sind gleich schwer."
                hints: ["Im Gleichgewicht ist keine Seite unten."]
              - id: l1-s4
                type: multiple_choice
                text: "Was ist am leichtesten?"
                say: "Was ist am leichtesten?"
                options: ["ein Blatt Papier", "ein Heft", "ein Buch"]
                answer: "ein Blatt Papier"
                hints: ["Ein Heft hat viele Blätter."]
              - id: l1-s5
                type: multiple_choice
                text: "Links liegt eine Melone, rechts eine Pflaume. Wie steht die Waage?"
                say: "Links liegt eine Melone, rechts eine Pflaume. Wie steht die Waage?"
                options: ["Links ist unten.", "Rechts ist unten.", "Beide Seiten sind gleich hoch."]
                answer: "Links ist unten."
                hints: ["Die Melone ist viel schwerer."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was ist schwerer?"
                say: "Was ist schwerer: ein Fahrrad oder ein Fußball?"
                options: ["ein Fahrrad", "ein Fußball"]
                answer: "ein Fahrrad"
              - id: l1-n2
                type: multiple_choice
                text: "Links liegt eine Murmel, rechts ein Wattebausch. Die linke Seite ist unten. Was ist leichter?"
                say: "Links liegt eine Murmel, rechts ein Wattebausch. Die linke Seite ist unten. Was ist leichter?"
                options: ["der Wattebausch", "die Murmel", "beide gleich schwer"]
                answer: "der Wattebausch"
              - id: l1-n3
                type: true_false
                text: "Bei der Balkenwaage geht die leichtere Seite nach unten."
                say: "Stimmt das? Bei der Balkenwaage geht die leichtere Seite nach unten."
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Zwei gleich große Eimer. Was ist schwerer?"
                say: "Zwei Eimer sind gleich groß. Was ist schwerer?"
                options: ["ein Eimer voll Sand", "ein Eimer voll Popcorn"]
                answer: "ein Eimer voll Sand"
              - id: l1-n5
                type: multiple_choice
                text: "Links liegen 3 Würfel, rechts liegt 1 Würfel. Alle Würfel sind gleich. Welche Seite geht nach unten?"
                say: "Links liegen drei Würfel, rechts liegt ein Würfel. Alle Würfel sind gleich schwer. Welche Seite geht nach unten?"
                options: ["links", "rechts", "keine"]
                answer: "links"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Links liegt eine Flasche Wasser, rechts ein Bleistift. Welche Seite geht nach unten?"
            say: "Links liegt eine Flasche Wasser, rechts ein Bleistift. Welche Seite geht nach unten?"
            options: ["die Seite mit der Flasche", "die Seite mit dem Bleistift", "keine, beide bleiben gleich hoch"]
            answer: "die Seite mit der Flasche"
          - id: l1-c2
            type: true_false
            text: "Ein aufgeblasener Luftballon ist schwerer als eine Kastanie."
            say: "Stimmt das? Ein aufgeblasener Luftballon ist schwerer als eine Kastanie."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Links liegt eine Birne, rechts eine Orange. Die Waage ist im Gleichgewicht. Was stimmt?"
            say: "Links liegt eine Birne, rechts eine Orange. Die Waage ist im Gleichgewicht. Was stimmt?"
            options: ["Beide sind gleich schwer.", "Die Birne ist schwerer.", "Die Orange ist schwerer."]
            answer: "Beide sind gleich schwer."
          - id: l1-c4
            type: multiple_choice
            text: "Links liegt eine Feder, rechts ein Apfel. Welche Seite ist oben?"
            say: "Links liegt eine Feder, rechts ein Apfel. Welche Seite ist oben?"
            options: ["die Seite mit der Feder", "die Seite mit dem Apfel"]
            answer: "die Seite mit der Feder"
          - id: l1-c5
            type: true_false
            text: "Links liegt ein Glas Marmelade, rechts ein Löffel. Die linke Seite ist unten. Das Glas ist schwerer."
            say: "Links liegt ein Glas Marmelade, rechts ein Löffel. Die linke Seite ist unten. Stimmt das: Das Glas ist schwerer?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Was ist schwerer?"
            say: "Was ist schwerer?"
            options: ["eine kleine Hantel", "ein großes Kissen"]
            answer: "eine kleine Hantel"

  - n: 2
    title: { de: "Nach dem Gewicht ordnen", en: "Ordering by mass" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Links liegt ein Hammer, rechts ein Löffel. Welche Seite geht nach unten?"
            say: "Links liegt ein Hammer, rechts ein Löffel. Welche Seite geht nach unten?"
            options: ["die Seite mit dem Hammer", "die Seite mit dem Löffel", "keine, beide bleiben gleich hoch"]
            answer: "die Seite mit dem Hammer"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Die Waage ist im Gleichgewicht. Dann ist eine Seite schwerer."
            say: "Stimmt das? Die Waage ist im Gleichgewicht. Dann ist eine Seite schwerer."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Der Ball ist schwerer als das Buch.\nDas Buch ist schwerer als der Stift.\nvon schwer nach leicht: Ball, Buch, Stift"
            say: "Der Ball ist schwerer als das Buch. Das Buch ist schwerer als der Stift. Dann ist der Ball auch schwerer als der Stift. Von schwer nach leicht heißt die Reihe: Ball, Buch, Stift."
          - text: "Apfel: so schwer wie 8 Würfel\nBirne: so schwer wie 11 Würfel\nDie Birne ist 3 Würfel schwerer."
            say: "Du kannst auch mit gleichen Würfeln wiegen. Der Apfel ist so schwer wie acht Würfel, die Birne wie elf Würfel. Mehr Würfel heißt schwerer. Die Birne ist drei Würfel schwerer als der Apfel."
          - text: "Apfel: 8 Würfel\nZitrone: 9 Würfel\nBirne: 11 Würfel\nvon leicht nach schwer: Apfel, Zitrone, Birne"
            say: "Jetzt kommt eine Zitrone dazu. Sie ist so schwer wie neun Würfel. Von leicht nach schwer: zuerst der Apfel mit acht, dann die Zitrone mit neun, dann die Birne mit elf Würfeln."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Ordne von schwer nach leicht.\nDie Tasche ist schwerer als das Buch.\nDas Buch ist schwerer als das Heft."
                say: "Die Tasche ist schwerer als das Buch. Das Buch ist schwerer als das Heft. Ordne von schwer nach leicht."
                options: ["Heft", "Tasche", "Buch"]
                slot_count: 3
                answer: ["Tasche", "Buch", "Heft"]
                hints:
                  - "Was ist am schwersten? Es ist schwerer als das Buch."
                  - "Die Tasche ist am schwersten, das Heft am leichtesten."
                  - "Tasche, Buch, Heft."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Die Orange ist so schwer wie 12 Würfel, die Kiwi wie 5 Würfel. Was ist schwerer?"
                say: "Die Orange ist so schwer wie zwölf Würfel, die Kiwi so schwer wie fünf Würfel. Was ist schwerer?"
                options: ["die Orange", "die Kiwi", "beide gleich schwer"]
                answer: "die Orange"
                hints:
                  - "Mehr Würfel heißt schwerer."
                  - "12 Würfel sind mehr als 5 Würfel."
                  - "die Orange."
              - id: l2-f3
                type: text_input
                text: "Die Orange wiegt so viel wie 12 Würfel, die Kiwi wie 5 Würfel. Um wie viele Würfel ist die Orange schwerer?"
                say: "Die Orange wiegt so viel wie zwölf Würfel, die Kiwi so viel wie fünf Würfel. Um wie viele Würfel ist die Orange schwerer?"
                answer: "7"
                hints:
                  - "Du suchst den Unterschied."
                  - "Rechne 12 − 5."
                  - "7."
              - id: l2-f4
                type: multiple_choice
                text: "Lisa ist schwerer als Tim. Tim ist schwerer als Ali. Wer ist am leichtesten?"
                say: "Lisa ist schwerer als Tim. Tim ist schwerer als Ali. Wer ist am leichtesten?"
                options: ["Ali", "Tim", "Lisa"]
                answer: "Ali"
                feedback:
                  "Tim": "Tim ist schwerer als Ali. Also ist Ali noch leichter."
                  "Lisa": "Lisa ist am schwersten. Du suchst den Leichtesten."
                hints:
                  - "Wer ist leichter als alle anderen?"
                  - "Tim ist schwerer als Ali, Lisa ist schwerer als Tim."
                  - "Ali."
              - id: l2-f5
                type: true_false
                text: "Der Hund ist schwerer als die Katze. Die Katze ist schwerer als der Hamster. Dann ist der Hamster schwerer als der Hund."
                say: "Der Hund ist schwerer als die Katze. Die Katze ist schwerer als der Hamster. Stimmt das: Dann ist der Hamster schwerer als der Hund?"
                answer: false
                hints:
                  - "Ordne zuerst: Wer ist am schwersten?"
                  - "Von schwer nach leicht: Hund, Katze, Hamster."
                  - "Nein. Der Hamster ist am leichtesten."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Ordne von leicht nach schwer.\nKiwi: 5 Würfel\nApfel: 9 Würfel\nMango: 14 Würfel"
                say: "Die Kiwi wiegt fünf Würfel, der Apfel neun Würfel, die Mango vierzehn Würfel. Ordne von leicht nach schwer."
                options: ["Mango", "Kiwi", "Apfel"]
                slot_count: 3
                answer: ["Kiwi", "Apfel", "Mango"]
                hints: ["Weniger Würfel heißt leichter. Fang mit dem Leichtesten an."]
              - id: l2-s2
                type: multiple_choice
                text: "Die Kartoffel ist leichter als die Gurke. Die Gurke ist leichter als der Kohlkopf. Was ist am schwersten?"
                say: "Die Kartoffel ist leichter als die Gurke. Die Gurke ist leichter als der Kohlkopf. Was ist am schwersten?"
                options: ["der Kohlkopf", "die Gurke", "die Kartoffel"]
                answer: "der Kohlkopf"
                hints: ["Was ist schwerer als die Gurke?"]
              - id: l2-s3
                type: text_input
                text: "Ein Ei wiegt so viel wie 6 Würfel. Wie viele Würfel wiegen 2 Eier?"
                say: "Ein Ei wiegt so viel wie sechs Würfel. Wie viele Würfel wiegen zwei Eier?"
                answer: "12"
                hints: ["Zwei Eier sind doppelt so schwer."]
              - id: l2-s4
                type: true_false
                text: "Mia ist leichter als Jan. Dann ist Jan schwerer als Mia."
                say: "Stimmt das? Mia ist leichter als Jan. Dann ist Jan schwerer als Mia."
                answer: true
                hints: ["Sag den Satz andersherum."]
              - id: l2-s5
                type: multiple_choice
                text: "Die Birne wiegt 10 Würfel. Der Apfel wiegt auch 10 Würfel. Was stimmt?"
                say: "Die Birne wiegt so viel wie zehn Würfel. Der Apfel auch. Was stimmt?"
                options: ["Beide sind gleich schwer.", "Die Birne ist schwerer.", "Der Apfel ist schwerer."]
                answer: "Beide sind gleich schwer."
                hints: ["Gleich viele Würfel heißt gleich schwer."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Ordne von schwer nach leicht.\nDer Stuhl ist schwerer als der Ball.\nDer Tisch ist schwerer als der Stuhl."
                say: "Der Stuhl ist schwerer als der Ball. Der Tisch ist schwerer als der Stuhl. Ordne von schwer nach leicht."
                options: ["Ball", "Tisch", "Stuhl"]
                slot_count: 3
                answer: ["Tisch", "Stuhl", "Ball"]
              - id: l2-n2
                type: text_input
                text: "Die Melone wiegt so viel wie 30 Würfel, die Ananas wie 18 Würfel. Um wie viele Würfel ist die Melone schwerer?"
                say: "Die Melone wiegt so viel wie dreißig Würfel, die Ananas so viel wie achtzehn Würfel. Um wie viele Würfel ist die Melone schwerer?"
                answer: "12"
              - id: l2-n3
                type: multiple_choice
                text: "Paul ist schwerer als Emma. Emma ist schwerer als Ben. Wer ist am schwersten?"
                say: "Paul ist schwerer als Emma. Emma ist schwerer als Ben. Wer ist am schwersten?"
                options: ["Paul", "Emma", "Ben"]
                answer: "Paul"
              - id: l2-n4
                type: true_false
                text: "Die Kiwi wiegt 5 Würfel, die Pflaume 3 Würfel. Die Pflaume ist schwerer."
                say: "Die Kiwi wiegt so viel wie fünf Würfel, die Pflaume wie drei Würfel. Stimmt das: Die Pflaume ist schwerer?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Links liegen 4 gleiche Würfel, rechts eine Banane. Die Waage ist im Gleichgewicht. Wie schwer ist die Banane?"
                say: "Links liegen vier gleiche Würfel, rechts liegt eine Banane. Die Waage ist im Gleichgewicht. Wie schwer ist die Banane?"
                options: ["so schwer wie 4 Würfel", "schwerer als 4 Würfel", "leichter als 4 Würfel"]
                answer: "so schwer wie 4 Würfel"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: order
            type: ordering
            text: "Ordne von leicht nach schwer.\nDer Stift ist leichter als die Schere.\nDie Schere ist leichter als das Buch."
            say: "Der Stift ist leichter als die Schere. Die Schere ist leichter als das Buch. Ordne von leicht nach schwer."
            options: ["Buch", "Stift", "Schere"]
            slot_count: 3
            answer: ["Stift", "Schere", "Buch"]
          - id: l2-c2
            part: balance
            type: multiple_choice
            text: "Links liegt ein Ziegelstein, rechts ein Schwamm. Welche Seite geht nach unten?"
            say: "Links liegt ein Ziegelstein, rechts ein Schwamm. Welche Seite geht nach unten?"
            options: ["die Seite mit dem Ziegelstein", "die Seite mit dem Schwamm", "keine, beide bleiben gleich hoch"]
            answer: "die Seite mit dem Ziegelstein"
          - id: l2-c3
            part: cubes
            type: text_input
            text: "Die Tomate wiegt so viel wie 7 Würfel, die Paprika wie 15 Würfel. Um wie viele Würfel ist die Paprika schwerer?"
            say: "Die Tomate wiegt so viel wie sieben Würfel, die Paprika so viel wie fünfzehn Würfel. Um wie viele Würfel ist die Paprika schwerer?"
            answer: "8"
          - id: l2-c4
            part: compare
            type: true_false
            text: "Ein großer, aufgeblasener Wasserball ist schwerer als ein volles Glas Honig."
            say: "Stimmt das? Ein großer, aufgeblasener Wasserball ist schwerer als ein volles Glas Honig."
            answer: false
          - id: l2-c5
            part: order
            type: multiple_choice
            text: "Oma ist schwerer als Lea. Lea ist schwerer als die Katze. Wer ist am leichtesten?"
            say: "Oma ist schwerer als Lea. Lea ist schwerer als die Katze. Wer ist am leichtesten?"
            options: ["die Katze", "Lea", "Oma"]
            answer: "die Katze"
          - id: l2-c6
            part: balance
            type: multiple_choice
            text: "Links liegt ein Ei, rechts ein Kürbis. Wie steht die Waage?"
            say: "Links liegt ein Ei, rechts ein Kürbis. Wie steht die Waage?"
            options: ["Rechts ist unten.", "Links ist unten.", "Beide Seiten sind gleich hoch."]
            answer: "Rechts ist unten."
          - id: l2-c7
            part: balance
            type: multiple_choice
            text: "Links liegt eine Birne, rechts ein Apfel. Die linke Seite ist oben. Was ist schwerer?"
            say: "Links liegt eine Birne, rechts ein Apfel. Die linke Seite ist oben. Was ist schwerer?"
            options: ["der Apfel", "die Birne", "beide gleich schwer"]
            answer: "der Apfel"
          - id: l2-c8
            part: balance
            type: true_false
            text: "Links liegt ein Schlüssel, rechts ein dickes Buch. Die Seite mit dem Schlüssel geht nach unten."
            say: "Links liegt ein Schlüssel, rechts ein dickes Buch. Stimmt das: Die Seite mit dem Schlüssel geht nach unten?"
            answer: false
          - id: l2-c9
            part: balance
            type: multiple_choice
            text: "Links liegen 2 Murmeln, rechts 2 gleiche Murmeln. Wie steht die Waage?"
