# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.order-of-operations
skill: math.mult-div-larger.order-of-operations
curriculum: de-DE
language: de
title:
  de: Punkt vor Strich und Klammern
  en: Order of operations and brackets
summary: >
  Calculations with more than one sign. Lesson 1 does mal and geteilt
  before plus and minus (3 + 4 · 2 = 11); lesson 2 does the Klammer first
  ((3 + 4) · 2 = 14), compares the same numbers with and without
  Klammer, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.div-facts, math.add-sub-to-100.sub-two-digit]
  also_practises: [math.mult-div.all-tables, math.mult-div.div-facts]
  vocabulary: { de: [Punktrechnung, Strichrechnung, Punkt vor Strich, Klammer] }
  forms: [text, audio]
  drawn: []
  facets: [operation-signs]
  parts:
    - { id: point-first, what: { de: Punkt vor Strich rechnen, en: working out × and ÷ before + and − } }
    - { id: brackets, what: { de: die Klammer zuerst rechnen, en: working out the brackets first } }
    - { id: what-first, what: { de: "erkennen, was du zuerst rechnest und welche Aufgabe passt", en: spotting which step comes first and which sum fits } }
  misconceptions:
    - id: left-to-right
      what: Works from left to right (3 + 4 · 2 = 14)
      addressed: lesson 1 Learn shows why the mal comes first; every stage of lesson 1 has a "Was rechnest du zuerst?" task; l1-f3, l1-n3 and l1-c3 give the left-to-right result, and the frames l1-f2, l1-f4 and l1-n2 offer it as a chip (32, 2, 657)
    - id: ignore-brackets
      what: Ignores the Klammer and uses Punkt vor Strich anyway ((3 + 4) · 2 = 11)
      addressed: lesson 2 Learn sets the same numbers with and without Klammer; every stage of lesson 2 has a pair task, and l2-f4 and l2-n4 give the result without the Klammer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Punkt vor Strich", en: "Times and divide first" }
    goal:
      de: "Rechne Punkt vor Strich. Bei 3 + 4 mal 2 rechnest du zuerst 4 mal 2."
      en: "Do times and divide before plus and minus. In 3 + 4 times 2, work out 4 times 2 first."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "9 · 6 = _"
            say: "Neun mal sechs."
            answer: "54"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "35 + 8 = _"
            say: "Fünfunddreißig plus acht."
            answer: "43"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 + 4 · 2"
            say: "Hier stehen ein Plus und ein Mal. Mal und geteilt heißen Punktrechnungen, denn ihre Zeichen sind aus Punkten. Plus und minus heißen Strichrechnungen, denn ihre Zeichen sind aus Strichen."
          - text: "3 + 4 · 2 = 3 + 8 = 11"
            say: "Die Regel heißt: Punkt vor Strich. Rechne zuerst vier mal zwei, das ist acht. Dann drei plus acht, das ist elf."
          - text: "20 − 12 : 3 = 20 − 4 = 16"
            say: "Auch geteilt ist eine Punktrechnung. Zwölf geteilt durch drei ist vier. Zwanzig minus vier ist sechzehn."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "5 + 3 · 4: Was rechnest du zuerst?"
                say: "Fünf plus drei mal vier. Was rechnest du zuerst?"
                options: ["3 · 4", "5 + 3"]
                answer: "3 · 4"
                feedback:
                  "5 + 3": "Denk an die Regel: Punkt vor Strich. Mal kommt zuerst."
                hints:
                  - "Welche Rechnung ist eine Punktrechnung?"
                  - "Das Malzeichen ist ein Punkt."
                  - "Zuerst 3 · 4."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Fünf plus drei mal vier. Rechne zuerst die Punktrechnung."
                frame: "5 + 3 · 4 = 5 + _ = _"
                options: ["12", "17", "32", "8"]
                answer: ["12", "17"]
                hints:
                  - "Zuerst drei mal vier."
                  - "Drei mal vier kennst du aus dem Einmaleins. Danach rechnest du fünf plus dieses Ergebnis."
                  - "12 und 17."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? 2 + 6 · 5 = 40"
                say: "Zwei plus sechs mal fünf ist vierzig. Stimmt das?"
                answer: false
                hints:
                  - "Was kommt zuerst?"
                  - "Sechs mal fünf ist dreißig. Dann zwei plus dreißig."
                  - "Nein. 2 + 6 · 5 = 32."
              - id: l1-f4
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Dreißig minus achtzehn geteilt durch sechs. Rechne zuerst die Punktrechnung."
                frame: "30 − 18 : 6 = 30 − _ = _"
                options: ["3", "27", "2", "12"]
                answer: ["3", "27"]
                hints:
                  - "Welche Rechnung ist die Punktrechnung?"
                  - "Rechne zuerst achtzehn geteilt durch sechs. Das Ergebnis ziehst du dann von dreißig ab."
                  - "3 und 27."
              - id: l1-f5
                type: text_input
                text: "10 + 7 · 3 = _"
                say: "Zehn plus sieben mal drei."
                answer: "31"
                hints:
                  - "Punkt vor Strich."
                  - "Sieben mal drei ist einundzwanzig."
                  - "31."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "40 − 8 · 3: Was rechnest du zuerst?"
                say: "Vierzig minus acht mal drei. Was rechnest du zuerst?"
                options: ["8 · 3", "40 − 8"]
                answer: "8 · 3"
                hints: ["Punkt vor Strich."]
              - id: l1-s2
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Sechs mal sieben plus acht. Rechne zuerst die Punktrechnung."
                frame: "6 · 7 + 8 = _ + 8 = _"
                options: ["42", "50", "90"]
                answer: ["42", "50"]
                hints: ["Zuerst sechs mal sieben."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? 9 + 4 · 2 = 17"
                say: "Neun plus vier mal zwei ist siebzehn. Stimmt das?"
                answer: true
                hints: ["Rechne zuerst vier mal zwei."]
              - id: l1-s4
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Fünfzig minus achtundvierzig geteilt durch acht. Rechne zuerst die Punktrechnung."
                frame: "50 − 48 : 8 = 50 − _ = _"
                options: ["6", "44", "2"]
                answer: ["6", "44"]
                hints: ["Achtundvierzig geteilt durch acht."]
              - id: l1-s5
                type: text_input
                text: "4 · 9 − 6 = _"
                say: "Vier mal neun minus sechs."
                answer: "30"
                hints: ["Zuerst vier mal neun."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "15 + 36 : 4: Was rechnest du zuerst?"
                say: "Fünfzehn plus sechsunddreißig geteilt durch vier. Was rechnest du zuerst?"
                options: ["36 : 4", "15 + 36"]
                answer: "36 : 4"
              - id: l1-n2
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Achtzig minus sieben mal neun. Rechne Schritt für Schritt."
                frame: "80 − 7 · 9 = 80 − _ = _"
                options: ["63", "17", "657"]
                answer: ["63", "17"]
              - id: l1-n3
                type: true_false
                text: "Stimmt das? 12 + 3 · 3 = 45"
                say: "Zwölf plus drei mal drei ist fünfundvierzig. Stimmt das?"
                answer: false
              - id: l1-n4
                type: text_input
                text: "5 · 8 + 7 · 2 = _"
                say: "Fünf mal acht plus sieben mal zwei."
                answer: "54"
              - id: l1-n5
                type: text_input
                text: "100 − 9 · 9 = _"
                say: "Hundert minus neun mal neun."
                answer: "19"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "8 + 6 · 5 = _"
            say: "Acht plus sechs mal fünf."
            answer: "38"
          - id: l1-c2
            type: text_input
            text: "50 − 42 : 7 = _"
            say: "Fünfzig minus zweiundvierzig geteilt durch sieben."
            answer: "44"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 7 + 2 · 4 = 36"
            say: "Sieben plus zwei mal vier ist sechsunddreißig. Stimmt das?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "18 − 12 : 6: Was rechnest du zuerst?"
            say: "Achtzehn minus zwölf geteilt durch sechs. Was rechnest du zuerst?"
            options: ["12 : 6", "18 − 12"]
            answer: "12 : 6"
          - id: l1-c5
            type: fill_in_blank
            text: "Rechne Schritt für Schritt."
            say: "Sieben plus acht mal vier. Rechne Schritt für Schritt."
            frame: "7 + 8 · 4 = 7 + _ = _"
            options: ["32", "39", "60"]
            answer: ["32", "39"]
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 40 − 5 · 6 = 10"
            say: "Vierzig minus fünf mal sechs ist zehn. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Klammern zuerst", en: "Brackets first" }
    goal:
      de: "Rechne zuerst, was in der Klammer steht. Mit Klammer kommt oft ein anderes Ergebnis heraus."
      en: "Work out what is in the brackets first. With brackets you often get a different answer."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "6 + 3 · 7 = _"
            say: "Sechs plus drei mal sieben."
            answer: "27"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "20 − 10 : 2: Was rechnest du zuerst?"
            say: "Zwanzig minus zehn geteilt durch zwei. Was rechnest du zuerst?"
            options: ["10 : 2", "20 − 10"]
            answer: "10 : 2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "(3 + 4) · 2 = 7 · 2 = 14"
            say: "Klammer auf, drei plus vier, Klammer zu, mal zwei. Was in der Klammer steht, rechnest du zuerst. Drei plus vier ist sieben. Dann sieben mal zwei, das ist vierzehn."
          - text: "3 + 4 · 2 = 11 | (3 + 4) · 2 = 14"
            say: "Die gleichen Zahlen, aber ein anderes Ergebnis: Ohne Klammer gilt Punkt vor Strich, mit Klammer kommt die Klammer zuerst."
          - text: "(20 − 8) : 4 = 12 : 4 = 3"
            say: "Zwanzig minus acht in der Klammer ist zwölf. Zwölf geteilt durch vier ist drei."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Klammer auf, fünf plus zwei, Klammer zu, mal drei. Rechne zuerst die Klammer."
                frame: "(5 + 2) · 3 = _ · 3 = _"
                options: ["7", "21", "11", "17"]
                answer: ["7", "21"]
                hints:
                  - "Was steht in der Klammer?"
                  - "Rechne zuerst fünf plus zwei. Das Ergebnis nimmst du dann mal drei."
                  - "7 und 21."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "(18 − 6) : 3: Was rechnest du zuerst?"
                say: "Klammer auf, achtzehn minus sechs, Klammer zu, geteilt durch drei. Was rechnest du zuerst?"
                options: ["18 − 6", "6 : 3"]
                answer: "18 − 6"
                hints:
                  - "Gibt es eine Klammer?"
                  - "Hier steht eine Klammer. Die rechnest du immer zuerst, noch vor der Punktrechnung."
                  - "Zuerst 18 − 6."
              - id: l2-f3
                type: fill_in_blank
                text: "Mit und ohne Klammer"
                say: "Rechne beide Aufgaben. Achte auf die Klammer."
                frame: "2 + 5 · 4 = _ | (2 + 5) · 4 = _"
                options: ["22", "28", "20"]
                answer: ["22", "28"]
                hints:
                  - "Erste Aufgabe: Punkt vor Strich. Zweite Aufgabe: Klammer zuerst."
                  - "Fünf mal vier ist zwanzig, plus zwei. Und zwei plus fünf ist sieben, mal vier."
                  - "22 und 28."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? (4 + 6) · 5 = 34"
                say: "Klammer auf, vier plus sechs, Klammer zu, mal fünf ist vierunddreißig. Stimmt das?"
                answer: false
                hints:
                  - "Was rechnest du zuerst?"
                  - "Vier plus sechs ist zehn. Zehn mal fünf ist …"
                  - "Nein. (4 + 6) · 5 = 50."
              - id: l2-f5
                type: text_input
                text: "(30 − 6) : 4 = _"
                say: "Klammer auf, dreißig minus sechs, Klammer zu, geteilt durch vier."
                answer: "6"
                hints:
                  - "Zuerst die Klammer."
                  - "Dreißig minus sechs ist vierundzwanzig."
                  - "6."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Acht mal Klammer auf, zehn minus drei, Klammer zu. Rechne zuerst die Klammer."
                frame: "8 · (10 − 3) = 8 · _ = _"
                options: ["7", "56", "77"]
                answer: ["7", "56"]
                hints: ["Rechne zuerst zehn minus drei."]
              - id: l2-s2
                type: multiple_choice
                text: "6 · (2 + 5): Was rechnest du zuerst?"
                say: "Sechs mal Klammer auf, zwei plus fünf, Klammer zu. Was rechnest du zuerst?"
                options: ["2 + 5", "6 · 2"]
                answer: "2 + 5"
                hints: ["Die Klammer kommt zuerst."]
              - id: l2-s3
                type: fill_in_blank
                text: "Mit und ohne Klammer"
                say: "Rechne beide Aufgaben. Achte auf die Klammer."
                frame: "20 − 4 · 3 = _ | (20 − 4) · 3 = _"
                options: ["8", "48", "16"]
                answer: ["8", "48"]
                hints: ["Ohne Klammer: Punkt vor Strich."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? (9 − 3) · 7 = 42"
                say: "Klammer auf, neun minus drei, Klammer zu, mal sieben ist zweiundvierzig. Stimmt das?"
                answer: true
                hints: ["Rechne zuerst die Klammer."]
              - id: l2-s5
                type: text_input
                text: "(15 + 13) : 7 = _"
                say: "Klammer auf, fünfzehn plus dreizehn, Klammer zu, geteilt durch sieben."
                answer: "4"
                hints: ["Fünfzehn plus dreizehn ist achtundzwanzig."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Klammer auf, sechsunddreißig plus vier, Klammer zu, geteilt durch fünf. Rechne Schritt für Schritt."
                frame: "(36 + 4) : 5 = _ : 5 = _"
                options: ["40", "8", "37"]
                answer: ["40", "8"]
              - id: l2-n2
                type: multiple_choice
                text: "Welche Aufgabe hat das Ergebnis 30?"
                say: "Welche Aufgabe hat das Ergebnis dreißig?"
                options: ["(1 + 5) · 5", "1 + 5 · 5", "1 · 5 + 5"]
                answer: "(1 + 5) · 5"
              - id: l2-n3
                type: fill_in_blank
                text: "Mit und ohne Klammer"
                say: "Rechne beide Aufgaben: neun plus sechs geteilt durch drei. Und: Klammer auf, neun plus sechs, Klammer zu, geteilt durch drei."
                frame: "9 + 6 : 3 = _ | (9 + 6) : 3 = _"
                options: ["11", "5", "15"]
                answer: ["11", "5"]
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 7 · (8 − 2) = 54"
                say: "Sieben mal Klammer auf, acht minus zwei, Klammer zu, ist vierundfünfzig. Stimmt das?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "(50 − 14) : 9 = _"
                say: "Klammer auf, fünfzig minus vierzehn, Klammer zu, geteilt durch neun."
                answer: "4"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: point-first
            type: text_input
            text: "4 + 8 · 6 = _"
            say: "Vier plus acht mal sechs."
            answer: "52"
          - id: l2-c2
            part: brackets
            type: text_input
            text: "(4 + 8) · 6 = _"
            say: "Klammer auf, vier plus acht, Klammer zu, mal sechs."
            answer: "72"
          - id: l2-c3
            part: what-first
            type: multiple_choice
            text: "60 − 27 : 3: Was rechnest du zuerst?"
            say: "Sechzig minus siebenundzwanzig geteilt durch drei. Was rechnest du zuerst?"
            options: ["27 : 3", "60 − 27"]
            answer: "27 : 3"
          - id: l2-c4
            part: brackets
            type: text_input
            text: "(35 − 7) : 4 = _"
            say: "Klammer auf, fünfunddreißig minus sieben, Klammer zu, geteilt durch vier."
            answer: "7"
          - id: l2-c5
            part: point-first
            type: true_false
            text: "Stimmt das? 5 · 6 − 4 = 10"
            say: "Fünf mal sechs minus vier ist zehn. Stimmt das?"
            answer: false
          - id: l2-c6
            part: point-first
            type: text_input
            text: "9 + 5 · 7 = _"
            say: "Neun plus fünf mal sieben."
            answer: "44"
          - id: l2-c7
            part: point-first
            type: text_input
            text: "72 : 8 + 16 = _"
            say: "Zweiundsiebzig geteilt durch acht plus sechzehn."
            answer: "25"
          - id: l2-c8
            part: point-first
            type: fill_in_blank
            text: "Rechne Schritt für Schritt."
            say: "Fünfundvierzig minus sechs mal sechs. Rechne Schritt für Schritt."
            frame: "45 − 6 · 6 = 45 − _ = _"
            options: ["36", "9", "234"]
            answer: ["36", "9"]
          - id: l2-c9
            part: point-first
            type: true_false
            text: "Stimmt das? 3 · 9 + 4 · 5 = 47"
            say: "Drei mal neun plus vier mal fünf ist siebenundvierzig. Stimmt das?"
            answer: true
          - id: l2-c10
            part: point-first
            type: text_input
            text: "60 − 4 · 8 = _"
            say: "Sechzig minus vier mal acht."
            answer: "28"
          - id: l2-c11
            part: brackets
            type: text_input
            text: "(12 + 6) : 3 = _"
            say: "Klammer auf, zwölf plus sechs, Klammer zu, geteilt durch drei."
            answer: "6"
          - id: l2-c12
            part: brackets
            type: fill_in_blank
            text: "Rechne Schritt für Schritt."
            say: "Neun mal Klammer auf, elf minus vier, Klammer zu. Rechne Schritt für Schritt."
            frame: "9 · (11 − 4) = 9 · _ = _"
            options: ["7", "63", "95"]
            answer: ["7", "63"]
          - id: l2-c13
            part: brackets
            type: true_false
            text: "Stimmt das? (7 + 3) · 8 = 31"
            say: "Klammer auf, sieben plus drei, Klammer zu, mal acht ist einunddreißig. Stimmt das?"
            answer: false
          - id: l2-c14
            part: brackets
            type: text_input
            text: "(45 − 5) : 8 = _"
            say: "Klammer auf, fünfundvierzig minus fünf, Klammer zu, geteilt durch acht."
            answer: "5"
          - id: l2-c15
            part: brackets
            type: fill_in_blank
            text: "Rechne beide Aufgaben."
            say: "Rechne beide Aufgaben: zehn minus sechs geteilt durch zwei. Und: Klammer auf, zehn minus sechs, Klammer zu, geteilt durch zwei."
            frame: "10 − 6 : 2 = _ | (10 − 6) : 2 = _"
            options: ["7", "2", "4"]
            answer: ["7", "2"]
          - id: l2-c16
            part: what-first
            type: multiple_choice
            text: "(9 − 4) · 6: Was rechnest du zuerst?"
            say: "Klammer auf, neun minus vier, Klammer zu, mal sechs. Was rechnest du zuerst?"
            options: ["9 − 4", "4 · 6"]
            answer: "9 − 4"
          - id: l2-c17
            part: what-first
            type: multiple_choice
            text: "30 + 7 · 8: Was rechnest du zuerst?"
            say: "Dreißig plus sieben mal acht. Was rechnest du zuerst?"
            options: ["7 · 8", "30 + 7"]
            answer: "7 · 8"
          - id: l2-c18
            part: what-first
            type: multiple_choice
            text: "Welche Aufgabe hat das Ergebnis 24?"
            say: "Welche Aufgabe hat das Ergebnis vierundzwanzig?"
            options: ["(2 + 6) · 3", "2 + 6 · 3", "2 · 6 + 3"]
            answer: "(2 + 6) · 3"
          - id: l2-c19
            part: what-first
            type: multiple_choice
            text: "Welche Aufgabe hat das Ergebnis 14?"
            say: "Welche Aufgabe hat das Ergebnis vierzehn?"
            options: ["(2 + 3) · 4", "2 + 3 · 4", "2 · 3 + 4"]
            answer: "2 + 3 · 4"
          - id: l2-c20
            part: what-first
            type: true_false
            text: "Stimmt das? Bei 6 + 4 · 5 rechnest du zuerst 6 + 4."
            say: "Bei sechs plus vier mal fünf rechnest du zuerst sechs plus vier. Stimmt das?"
            answer: false
