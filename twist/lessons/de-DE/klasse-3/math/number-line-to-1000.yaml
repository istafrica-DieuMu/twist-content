# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.number-line-to-1000
skill: math.numbers-to-1000.number-line
curriculum: de-DE
language: de
title:
  de: Der Zahlenstrahl bis 1000
  en: The number line to 1000
summary: >
  Zooming in on the Zahlenstrahl: 0 to 1000 in hundreds, one hundred in
  tens, one ten in ones. Lesson 1 finds hundreds and tens; lesson 2 reads
  arrows on lines with different steps, and ends with the skill check.
  The skill's Tausendertafel is the same idea as the Hundertertafel and
  comes in a later lesson.
metadata:
  year: klasse-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.read-write]
  also_practises: [math.numbers-to-100.number-line]
  vocabulary: { de: [Zahlenstrahl, Strich, Schritt, Ausschnitt, Pfeil, zwischen] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: []
  parts:
    - { id: find, what: { de: Zahlen am Zahlenstrahl finden, en: finding numbers on a number line } }
    - { id: read, what: { de: "ablesen, wohin der Pfeil zeigt", en: reading the number an arrow points to } }
    - { id: between, what: { de: "sagen, zwischen welchen Hundertern eine Zahl liegt", en: saying which hundreds a number lies between } }
  misconceptions:
    - id: tick-is-one
      what: Reads every tick as one more, whatever the line's step
      addressed: lesson 2 Learn asks "Wie groß ist ein Schritt?"; feedback on a step-1 reading names the step
    - id: start-at-zero
      what: Counts from 0 on a section that starts at 300
      addressed: lesson 1 uses sections and says "Fang beim ersten Strich an"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Hunderter und Zehner finden, en: Finding hundreds and tens }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: point_on_line
            text: "Wo ist 70?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
            answer: 70
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "100, 200, 300, _"
            say: "Hundert, zweihundert, dreihundert. Welche Zahl kommt dann?"
            options: ["310", "400", "301"]
            answer: "400"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "0 bis 1000"
            say: "Der Zahlenstrahl bis tausend. Ein Schritt ist hier hundert: null, hundert, zweihundert, bis tausend."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
          - text: "300 bis 400"
            say: "Jetzt ein Ausschnitt: von dreihundert bis vierhundert. Hier ist ein Schritt zehn: dreihundertzehn, dreihundertzwanzig, und so weiter."
            show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends }
          - text: "370"
            say: "Wo ist dreihundertsiebzig? Fang beim ersten Strich an, bei dreihundert, und geh sieben Zehnerschritte weiter."
            show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends, mark: 370 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: point_on_line
                text: "Wo ist 600?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
                answer: 600
                hints:
                  - "Ein Schritt ist hundert."
                  - "Zähl: hundert, zweihundert, ..."
                  - "600 ist der sechste Strich nach der Null."
                difficulty: easy
              - id: l1-f2
                type: point_on_line
                text: "Wo ist 240?"
                show: { drawn: number-line, from: 200, to: 300, step: 10, labels: ends }
                answer: 240
                hints:
                  - "Ein Schritt ist zehn."
                  - "Fang bei 200 an: 210, 220, ..."
                  - "Vier Schritte nach 200."
              - id: l1-f3
                type: point_on_line
                text: "Wo ist 900?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends }
                answer: 900
                hints:
                  - "900 ist nah an 1000."
                  - "Ein Schritt zurück von 1000."
                  - "Der Strich vor 1000."
              - id: l1-f4
                type: point_on_line
                text: "Wo ist 550?"
                show: { drawn: number-line, from: 500, to: 600, step: 10, labels: ends }
                answer: 550
                hints:
                  - "550 ist genau zwischen 500 und 600."
                  - "Zähl fünf Zehnerschritte von 500 aus."
                  - "Tipp auf die Mitte."
              - id: l1-f5
                type: point_on_line
                text: "Wo ist 780?"
                show: { drawn: number-line, from: 700, to: 800, step: 10, labels: ends }
                answer: 780
                hints:
                  - "780 ist nah an 800."
                  - "Zwei Schritte zurück von 800."
                  - "790, dann 780."
              - id: l1-f6
                type: point_on_line
                text: "Wo ist 130?"
                show: { drawn: number-line, from: 100, to: 200, step: 10, labels: ends }
                answer: 130
                hints:
                  - "Fang bei 100 an."
                  - "Drei Zehnerschritte."
                  - "110, 120, 130."

          - support: some
