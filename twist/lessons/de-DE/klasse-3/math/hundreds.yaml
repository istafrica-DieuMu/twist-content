            say: "Achthundert plus siebzig plus sechs."
            answer: "876"
          - id: l2-c18
            part: show
            type: fill_in_blank
            text: "Zerlege 715 in Hunderter, Zehner und Einer."
            say: "Zerlege siebenhundertfünfzehn in Hunderter, Zehner und Einer."
            frame: "715 = _ H, _ Z, _ E"
