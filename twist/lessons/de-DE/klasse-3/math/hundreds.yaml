            answer: ["7", "1", "5"]
          - id: l2-c19
            part: show
            type: image_multiple_choice
            text: "Welches Bild zeigt 470?"
            say: "Welches Bild zeigt vierhundertsiebzig?"
            options:
              - { drawn: base-ten, hundreds: 4, tens: 0, ones: 7 }
              - { drawn: base-ten, hundreds: 7, tens: 4, ones: 0 }
              - { drawn: base-ten, hundreds: 4, tens: 7, ones: 0 }
            answer: "470"
          - id: l2-c20
