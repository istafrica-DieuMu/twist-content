                answer: false
                feedback:
                  "true": "Hundertzweiundachtzig? Da sind unterwegs zehn verloren gegangen, wie Socken in der Waschmaschine! Drei mal sechzig ist hundertachtzig, drei mal vier ist zwölf: hundertzweiundneunzig."
                hints:
                  - "Rechne die Teilergebnisse: drei mal sechzig und drei mal vier."
                  - "Hundertachtzig und zwölf. Zähle sie genau zusammen."
                  - "Nein. 3 · 64 = 192."
              - id: l1-f5
