          - text: "3 · 124: In wie viele Teile zerlegst du 124?"
            say: "Drei mal hundertvierundzwanzig. Sechsundvierzig hast du in zwei Teile zerlegt. Was glaubst du: In wie viele Teile zerlegst du hundertvierundzwanzig?"
          - text: "3 · 124 = 3 · 100 + 3 · 20 + 3 · 4"
            say: "In drei Teile! Eine dreistellige Zahl zerlegst du in Hunderter, Zehner und Einer: hundertvierundzwanzig in hundert, zwanzig und vier."
          - text: "300 + 60 + 12 = 372"
            say: "Drei mal hundert ist dreihundert, drei mal zwanzig ist sechzig, drei mal vier ist zwölf. Zusammen sind das dreihundertzweiundsiebzig."
          - text: "Malkreuz für 4 · 215"
            show: { drawn: table, rows: [["·", 200, 10, 5], [4, 800, 40, 20]] }
            say: "Im Malkreuz bekommt jede Stelle ein eigenes Feld. Vier mal zweihundertfünfzehn ist achthundert plus vierzig plus zwanzig, also achthundertsechzig."

