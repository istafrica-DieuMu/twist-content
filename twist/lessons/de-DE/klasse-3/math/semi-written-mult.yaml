# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.semi-written-mult
skill: math.mult-div-larger.semi-written-mult
curriculum: de-DE
language: de
title:
  de: Halbschriftlich malnehmen
  en: Multiplying in steps
summary: >
  Multiplying by a one-digit number with the steps written down. Lesson
  1 splits a two-digit number into Zehner and Einer (7 · 46 = 280 + 42)
  and shows the Malkreuz; lesson 2 does the same with three-digit numbers
  (3 · 124 = 300 + 60 + 12), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.tens]
  also_practises: [math.mult-div-larger.distributive, math.mult-div-larger.tens]
  vocabulary: { de: [halbschriftlich, Rechenweg, Malkreuz, Teilergebnis, zerlegen] }
  forms: [text, audio, drawn, picture]
  drawn: [table]
  facets: []
  parts:
    - { id: two-digit, what: { de: zweistellige Zahlen mit einer einstelligen Zahl malnehmen, en: multiplying a two-digit number by a one-digit number } }
    - { id: three-digit, what: { de: dreistellige Zahlen mit einer einstelligen Zahl malnehmen, en: multiplying a three-digit number by a one-digit number } }
    - { id: steps, what: { de: "Teilergebnisse aufschreiben, auch im Malkreuz", en: "writing the partial products, also in the grid method" } }
    - { id: in-context, what: { de: Sachaufgaben zum Malnehmen, en: word problems with multiplication } }
  misconceptions:
    - id: lose-a-part
      what: Forgets one of the partial products, usually the Einer (5 · 38 = 150 + 8)
      addressed: lesson 1 Learn writes every Teilergebnis; every step frame offers a chip that adds a part of the number without multiplying it (158, 207, 167, 274, 249, 246, 651, 483)
    - id: add-instead
      what: Adds the partial results wrongly at the end (3 · 64 = 182)
      addressed: l1-f4, l1-n4 and l2-n4 are wrong in the last addition
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Zweistellig mal einstellig", en: "Two digits times one digit" }
    goal:
      de: "Zerlege die Zahl in Zehner und Einer und nimm beide mal, so wie 7 mal 40 und 7 mal 6."
      en: "Split the number into tens and ones and multiply both, like 7 times 40 and 7 times 6."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 · 30 = _"
            say: "Sechs mal dreißig."
            answer: "180"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie zerlegst du 46 in Zehner und Einer?"
            say: "Sechsundvierzig. Wie zerlegst du die Zahl in Zehner und Einer?"
            options: ["40 + 6", "4 + 6", "46 + 0"]
            answer: "40 + 6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "7 · 46: mehr oder weniger als 300?"
            say: "Sieben mal sechsundvierzig. Was glaubst du: Ist das mehr oder weniger als dreihundert? Gleich rechnen wir es aus."
          - text: "7 · 46 = 7 · 40 + 7 · 6"
            say: "Beim halbschriftlichen Rechnen schreibst du deinen Rechenweg auf. Zerlege sechsundvierzig in vierzig und sechs."
          - text: "7 · 40 = 280\n7 · 6 = 42\n280 + 42 = 322"
            say: "Sieben mal vierzig ist zweihundertachtzig. Sieben mal sechs ist zweiundvierzig. Zusammen sind das dreihundertzweiundzwanzig. Also etwas mehr als dreihundert!"
          - text: "Malkreuz für 7 · 46"
            show: { drawn: table, rows: [["·", 40, 6], [7, 280, 42]] }
            say: "Im Malkreuz schreibst du die Zehner und die Einer in die obere Zeile und die andere Zahl links davor. In die Felder kommen die Teilergebnisse. Dann zählst du sie zusammen."
          - text: "Wusstest du? 3 · 37 = 111 | 6 · 37 = 222 | 9 · 37 = 333"
            say: "Wusstest du? Die Siebenunddreißig kann zaubern. Drei mal siebenunddreißig ist hundertelf. Sechs mal siebenunddreißig ist zweihundertzweiundzwanzig. Und neun mal siebenunddreißig ist dreihundertdreiunddreißig. Rechne es mit Zehnern und Einern nach!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Fünf mal achtunddreißig. Rechne Schritt für Schritt."
                frame: "5 · 30 = _ | 5 · 8 = _ | 5 · 38 = _"
                options: ["150", "40", "190", "158"]
                answer: ["150", "40", "190"]
                hints:
                  - "Zuerst die Zehner, dann die Einer."
                  - "Fünf mal drei Zehner sind fünfzehn Zehner. Dann fünf mal acht, und am Ende zählst du beides zusammen."
                  - "150, 40 und 190."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Vier mal siebenundfünfzig. Rechne die Teilergebnisse und zähle sie zusammen."
                frame: "4 · 50 = _ | 4 · 7 = _ | 4 · 57 = _"
                options: ["200", "28", "228", "207"]
                answer: ["200", "28", "228"]
                hints:
                  - "Vier mal fünfzig und vier mal sieben."
                  - "Vier mal fünf Zehner sind zwanzig Zehner. Dann vier mal sieben, und zum Schluss zählst du beides zusammen."
                  - "200, 28 und 228."
              - id: l1-f3
                type: text_input
                text: "6 · 43 = _"
                say: "Sechs mal dreiundvierzig."
                answer: "258"
                hints:
                  - "Zerlege dreiundvierzig in vierzig und drei."
                  - "Sechs mal vierzig ist zweihundertvierzig, sechs mal drei ist achtzehn."
                  - "258."
              - id: l1-f4
                type: true_false
