                say: "Für das Fest gibt es fünfhundertsechsundsechzig Luftballons. Hoppla, zweihundertdreiundvierzig fliegen davon! Wie viele bleiben übrig? Rechne schriftlich."
                show: { drawn: written-calc, rows: ["566", "243"], op: "-" }
                answer: "323"
                hints: ["Einer zuerst."]
              - id: l1-s3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["748", "526"], op: "-", result: "232" }
                answer: false
                hints: ["Prüf jede Stelle."]
              - id: l1-s4
                type: multiple_choice
                text: "Was rechnest du bei den Einern?"
                say: "Neunhundertneunundfünfzig minus vierhundertdreizehn. Was rechnest du bei den Einern?"
                show: { drawn: written-calc, rows: ["959", "413"], op: "-" }
                options: ["9 − 3", "3 − 9", "9 − 4"]
                answer: "9 − 3"
                hints: ["Oben minus unten."]
              - id: l1-s5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: achthundertneun minus sechshundertsieben."
                show: { drawn: written-calc, rows: ["809", "607"], op: "-" }
