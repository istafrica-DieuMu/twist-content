                hints: ["Null minus null ist null."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: sechshundertsiebenundneunzig minus dreihundertvierundfünfzig."
                show: { drawn: written-calc, rows: ["697", "354"], op: "-", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["3", "4", "5", "2"]
                answer: ["3", "4", "3"]
              - id: l1-n2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: neunhundertachtundsiebzig minus fünfhundertsechsundvierzig."
                show: { drawn: written-calc, rows: ["978", "546"], op: "-" }
                answer: "432"
              - id: l1-n3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["865", "432"], op: "-", result: "433" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Was rechnest du bei den Hundertern?"
                say: "Siebenhundertachtundneunzig minus zweihundertsiebenundsechzig. Was rechnest du bei den Hundertern?"
                show: { drawn: written-calc, rows: ["798", "267"], op: "-" }
                options: ["7 − 2", "2 − 7", "9 − 6"]
                answer: "7 − 2"
              - id: l1-n5
                type: text_input
                text: "Der Zug hat 590 Plätze. 270 sind besetzt. Wie viele sind noch frei? Rechne schriftlich."
                say: "Der Zug hat fünfhundertneunzig Plätze. Zweihundertsiebzig sind besetzt. Wie viele sind noch frei? Rechne schriftlich."
                show: { drawn: written-calc, rows: ["590", "270"], op: "-" }
                answer: "320"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: achthundertsechsundsiebzig minus dreihundertvierundfünfzig."
