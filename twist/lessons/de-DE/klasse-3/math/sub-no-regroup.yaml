                say: "Hier soll fünfhundertsiebenundachtzig minus dreiundsechzig stehen. Welche Rechnung ist richtig untereinander geschrieben?"
                options: [{ drawn: written-calc, rows: ["587", "63"], op: "-" }, { drawn: written-calc, rows: ["587", "63 "], op: "-" }]
                answer: "587|63"
              - id: l2-n2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: fünfhundertsiebenundachtzig minus dreiundsechzig."
