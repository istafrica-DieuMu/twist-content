            show: { drawn: written-calc, rows: ["386", "152"], op: "-" }
            options: ["8 − 5", "5 − 8", "6 − 2"]
            answer: "8 − 5"

  - n: 2
    title: { de: Kürzere Zahlen und Probe, en: Shorter numbers and checking }
    goal:
      de: "Zieh auch kürzere Zahlen schriftlich ab und mach die Probe mit Plus, so wie 434 + 53 ist 487."
      en: "Take away shorter numbers in columns too, and check with an add sum, like 434 + 53 is 487."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: siebenhundertvierundneunzig minus dreihunderteinundsechzig."
            show: { drawn: written-calc, rows: ["794", "361"], op: "-" }
            answer: "433"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie heißt die Umkehraufgabe zu 9 − 4 = 5?"
            say: "Wie heißt die Umkehraufgabe zu neun minus vier gleich fünf?"
            options: ["5 + 4 = 9", "9 + 4 = 13", "9 + 5 = 14"]
            answer: "5 + 4 = 9"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du? 487 − 53: Die 53 hat keine Hunderter. Was passiert mit der 4 bei den Hundertern?"
            say: "Vierhundertsiebenundachtzig minus dreiundfünfzig. Die Dreiundfünfzig hat keine Hunderter. Was glaubst du: Was passiert mit der Vier bei den Hundertern?"
            show: { drawn: written-calc, rows: ["487", "53"], op: "-" }
          - text: "487 − 53"
            say: "Sie bleibt einfach stehen! Ist die untere Zahl kürzer, steht sie trotzdem Einer unter Einer. Sieben minus drei ist vier, acht minus fünf ist drei, bei den Hundertern bleibt die Vier. Vierhundertvierunddreißig."
            show: { drawn: written-calc, rows: ["487", "53"], op: "-", result: "434" }
          - text: "Probe: 434 + 53 = 487"
            say: "Mit der Umkehraufgabe machst du die Probe: Ergebnis plus die abgezogene Zahl muss die obere Zahl ergeben. Vierhundertvierunddreißig plus dreiundfünfzig ist vierhundertsiebenundachtzig. Es stimmt."
            show: { drawn: written-calc, rows: ["434", "53"], op: "+", result: "487" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Welche Rechnung ist richtig untereinander geschrieben?"
                say: "Hier soll sechshundertachtundsiebzig minus fünfundvierzig stehen. Welche Rechnung ist richtig untereinander geschrieben?"
                options: [{ drawn: written-calc, rows: ["678", "45"], op: "-" }, { drawn: written-calc, rows: ["678", "45 "], op: "-" }]
                answer: "678|45"
                feedback:
                  "678|45 ": "Hier steht die Fünf unter den Zehnern. Einer müssen unter Einern stehen."
                hints:
                  - "Wo stehen die Einer von sechshundertachtundsiebzig?"
                  - "Die Fünf muss unter der Acht stehen."
                  - "Die Rechnung, bei der die 45 ganz rechts steht."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: sechshundertachtundsiebzig minus fünfundvierzig."
                show: { drawn: written-calc, rows: ["678", "45"], op: "-" }
                answer: "633"
                hints:
                  - "Einer: acht minus fünf."
                  - "Zehner: sieben minus vier. Die Sechs bleibt."
                  - "633."
              - id: l2-f3
                type: multiple_choice
                text: "569 − 127 = 442. Wie machst du die Probe?"
                say: "Ein Kind hat fünfhundertneunundsechzig minus hundertsiebenundzwanzig gleich vierhundertzweiundvierzig gerechnet. Mit welcher Aufgabe machst du die Probe?"
                options: ["442 + 127", "569 + 127", "442 − 127", "Ich glaube es einfach."]
                answer: "442 + 127"
                feedback:
                  "Ich glaube es einfach.": "Glauben ist gut, Probe ist besser! Rechne das Ergebnis plus die abgezogene Zahl."
                  "569 + 127": "Für die Probe nimmst du das Ergebnis, nicht die obere Zahl: 442 plus 127."
                hints:
                  - "Ergebnis plus die abgezogene Zahl."
                  - "Das Ergebnis ist 442."
                  - "442 + 127."
              - id: l2-f4
                type: true_false
                text: "357 − 24 = 333\nProbe: 333 + 24 = 357\nStimmt die Rechnung?"
                say: "Dreihundertsiebenundfünfzig minus vierundzwanzig ist dreihundertdreiunddreißig. Probe: dreihundertdreiunddreißig plus vierundzwanzig ist dreihundertsiebenundfünfzig. Stimmt die Rechnung?"
                answer: true
                hints:
                  - "Kommt bei der Probe die obere Zahl heraus?"
                  - "357 ist die obere Zahl."
                  - "Ja."
              - id: l2-f5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: neunhundertfünfundachtzig minus drei."
                show: { drawn: written-calc, rows: ["985", "3"], op: "-" }
                answer: "982"
                hints:
                  - "Die Drei steht unter den Einern."
                  - "Fünf minus drei. Zehner und Hunderter bleiben."
