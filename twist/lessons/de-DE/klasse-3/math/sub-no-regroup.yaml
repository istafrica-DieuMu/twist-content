# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.sub-no-regroup
skill: math.written-add-sub.sub-no-regroup
curriculum: de-DE
language: de
title:
  de: Schriftlich subtrahieren ohne Entbündeln
  en: Column subtraction without exchanging
summary: >
  Writing the smaller number under the larger one by place value and
  subtracting in columns from the Einer, where every column has enough to
  take away. Lesson 1 subtracts three-digit numbers; lesson 2 subtracts
  shorter numbers and checks with the Umkehraufgabe, and ends with the
  skill check.
metadata:
  year: klasse-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.add-no-carry]
  also_practises: [math.add-sub-to-1000.estimate]
  vocabulary: { de: [schriftlich subtrahieren, minus, Einer, Zehner, Hunderter, Umkehraufgabe] }
  forms: [picture, drawn, text, audio]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: three-digit, what: { de: dreistellige Zahlen schriftlich subtrahieren, en: column subtraction of three-digit numbers } }
    - { id: shorter, what: { de: kürzere Zahlen stellengerecht untereinander schreiben und abziehen, en: lining up and subtracting a shorter number } }
    - { id: columns, what: { de: Stelle für Stelle von den Einern an rechnen, en: working column by column from the ones } }
    - { id: probe, what: { de: mit der Umkehraufgabe die Probe machen, en: checking with the inverse addition } }
  misconceptions:
    - id: smaller-from-larger
      what: Takes the smaller digit from the larger in each column whatever its place (lower minus upper)
      addressed: Learn says you always take the lower digit away from the upper one; here no upper digit is smaller than the one below it, a full-stage option offers the swapped column with feedback, and the next set takes up the rest
    - id: start-on-the-left
      what: Starts at the Hunderter
      addressed: Learn says "Fang bei den Einern an"; frames fill the result from the right
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Minus in Spalten, en: Subtracting in columns }
    goal:
      de: "Rechne schriftlich minus, Stelle für Stelle von den Einern an, so wie 678 − 245."
      en: "Take away in columns, place by place starting with the ones, like 678 − 245."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: dreihundertzwölf plus vierhundertsechsundfünfzig."
            show: { drawn: written-calc, rows: ["312", "456"], op: "+" }
            answer: "768"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "8 − 3 = _"
            say: "Acht minus drei."
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was glaubst du? Im Glas sind 678 Murmeln. Tom nimmt 245 heraus. Welche Zahl schreibst du beim schriftlichen Minus oben hin?"
            say: "Im Glas sind sechshundertachtundsiebzig Murmeln. Tom nimmt zweihundertfünfundvierzig heraus. Du rechnest schriftlich minus. Was glaubst du: Welche Zahl schreibst du oben hin?"
            show: { object: marble }
          - text: "678 − 245"
            say: "Die Sechshundertachtundsiebzig! Beim schriftlichen Subtrahieren steht die größere Zahl oben, die Zahl, die du abziehst, darunter. Einer unter Einer, Zehner unter Zehner."
            show: { drawn: written-calc, rows: ["678", "245"], op: "-" }
          - text: "8 − 5 = 3"
            say: "Fang bei den Einern an: acht minus fünf ist drei. Du nimmst immer die untere Ziffer von der oberen weg."
            show: { drawn: written-calc, rows: ["678", "245"], op: "-", result: "__3" }
          - text: "7 − 4 = 3\n6 − 2 = 4"
            say: "Zehner: sieben minus vier ist drei. Hunderter: sechs minus zwei ist vier. Das Ergebnis ist vierhundertdreiunddreißig. So viele Murmeln bleiben im Glas."
            show: { drawn: written-calc, rows: ["678", "245"], op: "-", result: "433" }
          - text: "Wusstest du? Auf den Südturm des Kölner Doms führen 533 Stufen. Wer 312 geschafft hat, hat noch 221 vor sich."
            say: "Wusstest du? Auf den Südturm des Kölner Doms führen fünfhundertdreiunddreißig Stufen, ganz ohne Aufzug. Wer dreihundertzwölf geschafft hat, hat noch zweihunderteinundzwanzig vor sich. Das kannst du schriftlich nachrechnen!"
            show: { object: church }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an. Nimm die untere Ziffer von der oberen weg."
                show: { drawn: written-calc, rows: ["586", "234"], op: "-", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["2", "5", "3", "4"]
                answer: ["2", "5", "3"]
                hints:
                  - "Einer: sechs minus vier."
                  - "Zehner: acht minus drei. Hunderter: fünf minus zwei."
                  - "E: 2, Z: 5, H: 3. Das ist 352."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: siebenhundertneunundachtzig minus vierhundertfünfundzwanzig."
                show: { drawn: written-calc, rows: ["789", "425"], op: "-" }
                answer: "364"
                hints:
                  - "Einer: neun minus fünf."
                  - "Zehner: acht minus zwei. Hunderter: sieben minus vier."
                  - "364."
              - id: l1-f3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["957", "314"], op: "-", result: "643" }
                answer: true
                hints:
                  - "Rechne jede Stelle nach."
                  - "Sieben minus vier, fünf minus eins, neun minus drei."
                  - "Ja, 643."
              - id: l1-f4
                type: multiple_choice
                text: "Was rechnest du bei den Zehnern?"
                say: "Achthundertsiebenundvierzig minus dreihundertzweiundzwanzig. Was rechnest du bei den Zehnern?"
                show: { drawn: written-calc, rows: ["847", "322"], op: "-" }
                options: ["4 − 2", "2 − 4", "8 − 3"]
                answer: "4 − 2"
                feedback:
                  "2 − 4": "Die untere Ziffer wird von der oberen abgezogen: vier minus zwei."
                hints:
                  - "Die Zehner stehen in der Mitte."
                  - "Oben vier, unten zwei."
                  - "4 − 2."
              - id: l1-f5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: sechshundertachtzig minus dreihundertzwanzig."
                show: { drawn: written-calc, rows: ["680", "320"], op: "-" }
                answer: "360"
                hints:
                  - "Einer: null minus null."
                  - "Zehner: acht minus zwei. Hunderter: sechs minus drei."
                  - "360."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an."
                show: { drawn: written-calc, rows: ["975", "641"], op: "-", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["4", "3", "2", "1"]
