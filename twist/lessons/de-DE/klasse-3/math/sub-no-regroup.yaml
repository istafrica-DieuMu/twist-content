            say: "Prüf die Rechnung. Stimmt sie?"
            show: { drawn: written-calc, rows: ["659", "238"], op: "-", result: "431" }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was rechnest du bei den Einern?"
            say: "Vierhundertachtundsiebzig minus hundertfünfundzwanzig. Was rechnest du bei den Einern?"
            show: { drawn: written-calc, rows: ["478", "125"], op: "-" }
            options: ["8 − 5", "5 − 8", "8 − 2"]
            answer: "8 − 5"
          - id: l1-c4
            type: fill_in_blank
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: achthundertneunundsechzig minus vierhundertfünfunddreißig."
            show: { drawn: written-calc, rows: ["869", "435"], op: "-", result: "___" }
