# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.plans-maps
skill: math.space.plans-maps
curriculum: de-DE
language: de
title:
  de: Pläne und Karten
  en: Plans and maps
summary: >
  Lesson 1 finds squares on a grid plan with the letter of the column and
  the number of the row (B2 ist der Brunnen) and names the square of a
  place; lesson 2 follows and describes routes on the plan (2 Felder nach
  rechts, 1 Feld nach unten) and ends with the skill check. The plans are
  drawn tables for now; a drawn map with pictures, and drawing a route
  into it, wait for a map component and a drawing task.
metadata:
  year: klasse-3
  topic: { de: Orientierung, en: Position and direction }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.space.follow-directions]
  also_practises: [math.space.follow-directions]
  vocabulary: { de: [Plan, Karte, Feld, Spalte, Zeile, rechts, links, oben, unten] }
  forms: [text, audio, drawn]
  drawn: [shape, table]
  facets: []
  parts:
    - { id: squares, what: { de: Felder mit Buchstabe und Zahl finden und benennen, en: finding and naming squares with a letter and a number } }
    - { id: follow, what: { de: einem Weg auf dem Plan folgen, en: following a route on the plan } }
    - { id: describe, what: { de: einen Weg auf dem Plan beschreiben, en: describing a route on the plan } }
  misconceptions:
    - id: number-first
      what: Writes the number first (2D) or swaps column and row (looks for A3 in column 3)
      addressed: lesson 1 Learn says letter first, then number; l1-f3 has feedback on reading A3 as column 3, l1-f5 has feedback on 2D, l1-s5, l1-c2 and l2-c2 offer the number first
    - id: up-down-rows
      what: Goes the wrong way on the rows (nach oben to the bigger number) or left and right the wrong way along the letters
      addressed: lesson 2 Learn says rechts is the next letter and unten the next number; l2-f3 has feedback on going down instead of up, l2-f5, l2-s4, l2-n4 and l2-c5 offer the route with the wrong direction
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Felder finden", en: "Finding squares" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist rechts neben dem Quadrat?"
            say: "Was ist rechts neben dem Quadrat?"
            show: { drawn: shape, row: [circle, square, triangle], colours: blue }
            options: ["das Dreieck", "der Kreis"]
            answer: "das Dreieck"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was ist das Gegenteil von links?"
            say: "Was ist das Gegenteil von links?"
            options: ["rechts", "oben", "unten"]
            answer: "rechts"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Der Stadtplan"
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
            say: "Das ist der Plan von einer kleinen Stadt. Oben stehen Buchstaben für die Spalten: A, B, C, D. Links stehen Zahlen für die Zeilen: eins, zwei, drei. So hat jedes Feld einen Namen."
          - text: "B2: Spalte B, Zeile 2: der Brunnen"
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]], mark: [[2, 2]] }
            say: "Das Feld B zwei findest du so: Geh in die Spalte B und dann in die Zeile zwei. Dort ist der Brunnen. Zuerst kommt der Buchstabe, dann die Zahl."
          - text: "Der Zoo: Spalte D, Zeile 2: D2"
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]], mark: [[2, 4]] }
            say: "Andersherum geht es auch. Der Zoo steht in der Spalte D und in der Zeile zwei. Sein Feld heißt D zwei."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was ist im Feld C1?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
                say: "Schau auf den Stadtplan. Was ist im Feld C eins?"
                options: ["Kiosk", "Kino", "Park"]
                answer: "Kiosk"
                hints:
                  - "Geh zuerst in die Spalte C."
                  - "Dann in die Zeile 1."
                  - "Kiosk."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "In welchem Feld ist der Spielplatz?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
                say: "In welchem Feld ist der Spielplatz?"
                options: ["B3", "C3", "B2"]
                answer: "B3"
                feedback:
                  "B2": "In B2 ist der Brunnen. Der Spielplatz ist eine Zeile tiefer."
                  "C3": "In C3 ist der See. Schau, welcher Buchstabe über dem Spielplatz steht."
                hints:
                  - "Welcher Buchstabe steht über dem Spielplatz?"
                  - "Spalte B. Welche Zahl steht links in seiner Zeile?"
                  - "B3."
              - id: l1-f3
                type: multiple_choice
                text: "Was ist im Feld A3?"
                show: { drawn: table, rows: [["", A, B, C], ["1", Eingang, Affen, Löwen], ["2", Café, Elefanten, Pinguine], ["3", Ziegen, Zebras, Spielplatz]] }
                say: "Das ist ein Plan vom Zoo. Was ist im Feld A drei?"
                options: ["Ziegen", "Löwen", "Café"]
                answer: "Ziegen"
                feedback:
                  "Löwen": "Die Löwen stehen in der dritten Spalte. Der Buchstabe A ist aber die Spalte, die 3 ist die Zeile."
                hints:
                  - "Der Buchstabe sagt die Spalte, die Zahl die Zeile."
                  - "Spalte A, dann nach unten bis zur Zeile 3."
                  - "Ziegen."
              - id: l1-f4
                type: true_false
                text: "Der Schatz liegt im Feld B2."
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Wald, Hütte, Strand, Felsen], ["2", Höhle, Schatz, Palme, Boot], ["3", Fluss, Brücke, Turm, Bucht]] }
                say: "Das ist eine Schatzkarte. Stimmt das: Der Schatz liegt im Feld B zwei?"
                answer: true
                hints:
                  - "Such den Schatz auf der Karte."
                  - "Er steht in der Spalte B und in der Zeile 2."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "In welchem Feld ist das Boot?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Wald, Hütte, Strand, Felsen], ["2", Höhle, Schatz, Palme, Boot], ["3", Fluss, Brücke, Turm, Bucht]] }
                say: "In welchem Feld ist das Boot?"
                options: ["D2", "2D", "D1"]
                answer: "D2"
                feedback:
                  "2D": "Zuerst kommt der Buchstabe, dann die Zahl."
                hints:
                  - "Welcher Buchstabe steht über dem Boot?"
                  - "Spalte D, Zeile 2. Zuerst der Buchstabe."
                  - "D2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was ist im Feld A2?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
                say: "Was ist im Feld A zwei?"
                options: ["Bank", "Park", "Post"]
                answer: "Bank"
                hints: ["Spalte A, Zeile 2."]
              - id: l1-s2
                type: multiple_choice
                text: "In welchem Feld sind die Pinguine?"
                show: { drawn: table, rows: [["", A, B, C], ["1", Eingang, Affen, Löwen], ["2", Café, Elefanten, Pinguine], ["3", Ziegen, Zebras, Spielplatz]] }
                say: "In welchem Feld sind die Pinguine?"
                options: ["C2", "B2", "C3"]
                answer: "C2"
                hints: ["Welcher Buchstabe steht über den Pinguinen?"]
              - id: l1-s3
                type: true_false
                text: "Im Feld C3 steht der Turm."
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Wald, Hütte, Strand, Felsen], ["2", Höhle, Schatz, Palme, Boot], ["3", Fluss, Brücke, Turm, Bucht]] }
                say: "Stimmt das? Im Feld C drei steht der Turm."
                answer: true
                hints: ["Spalte C, Zeile 3."]
              - id: l1-s4
                type: multiple_choice
                text: "Was ist im Feld D3?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
                say: "Was ist im Feld D drei?"
                options: ["Bahnhof", "Zoo", "See"]
                answer: "Bahnhof"
                hints: ["Ganz rechts, ganz unten."]
              - id: l1-s5
                type: multiple_choice
                text: "In welchem Feld ist der Eingang?"
                show: { drawn: table, rows: [["", A, B, C], ["1", Eingang, Affen, Löwen], ["2", Café, Elefanten, Pinguine], ["3", Ziegen, Zebras, Spielplatz]] }
                say: "In welchem Feld ist der Eingang vom Zoo?"
                options: ["A1", "1A", "B1"]
                answer: "A1"
                hints: ["Zuerst der Buchstabe, dann die Zahl."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was ist im Feld D1?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Wald, Hütte, Strand, Felsen], ["2", Höhle, Schatz, Palme, Boot], ["3", Fluss, Brücke, Turm, Bucht]] }
                say: "Was ist im Feld D eins?"
                options: ["Felsen", "Strand", "Boot"]
                answer: "Felsen"
              - id: l1-n2
                type: multiple_choice
                text: "In welchem Feld ist die Schule?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
                say: "In welchem Feld ist die Schule?"
                options: ["A1", "A3", "B1"]
                answer: "A1"
              - id: l1-n3
                type: true_false
                text: "Die Elefanten sind im Feld B1."
                show: { drawn: table, rows: [["", A, B, C], ["1", Eingang, Affen, Löwen], ["2", Café, Elefanten, Pinguine], ["3", Ziegen, Zebras, Spielplatz]] }
                say: "Stimmt das? Die Elefanten sind im Feld B eins."
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "In welchem Feld ist die Brücke?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Wald, Hütte, Strand, Felsen], ["2", Höhle, Schatz, Palme, Boot], ["3", Fluss, Brücke, Turm, Bucht]] }
                say: "In welchem Feld ist die Brücke?"
                options: ["B3", "C3", "B2"]
                answer: "B3"
              - id: l1-n5
                type: multiple_choice
                text: "Was liegt in derselben Spalte wie der Park?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
                say: "Was liegt in derselben Spalte wie der Park?"
                options: ["Brunnen", "Kiosk", "Bank"]
                answer: "Brunnen"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist im Feld B3?"
            show: { drawn: table, rows: [["", A, B, C], ["1", Eingang, Affen, Löwen], ["2", Café, Elefanten, Pinguine], ["3", Ziegen, Zebras, Spielplatz]] }
            say: "Was ist im Feld B drei?"
            options: ["Zebras", "Affen", "Spielplatz"]
            answer: "Zebras"
          - id: l1-c2
            type: multiple_choice
            text: "In welchem Feld ist die Höhle?"
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Wald, Hütte, Strand, Felsen], ["2", Höhle, Schatz, Palme, Boot], ["3", Fluss, Brücke, Turm, Bucht]] }
            say: "In welchem Feld ist die Höhle?"
            options: ["A2", "2A", "A3"]
            answer: "A2"
          - id: l1-c3
            type: true_false
            text: "Das Kino ist im Feld C2."
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
            say: "Stimmt das? Das Kino ist im Feld C zwei."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Was ist im Feld A3?"
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
            say: "Was ist im Feld A drei?"
            options: ["Post", "Bank", "See"]
            answer: "Post"
          - id: l1-c5
            type: multiple_choice
            text: "In welchem Feld ist die Bucht?"
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Wald, Hütte, Strand, Felsen], ["2", Höhle, Schatz, Palme, Boot], ["3", Fluss, Brücke, Turm, Bucht]] }
            say: "In welchem Feld ist die Bucht?"
            options: ["D3", "3D", "D2"]
            answer: "D3"
          - id: l1-c6
            type: true_false
            text: "Die Affen sind im Feld C1."
            show: { drawn: table, rows: [["", A, B, C], ["1", Eingang, Affen, Löwen], ["2", Café, Elefanten, Pinguine], ["3", Ziegen, Zebras, Spielplatz]] }
            say: "Stimmt das? Die Affen sind im Feld C eins."
            answer: false

  - n: 2
    title: { de: "Wege auf dem Plan", en: "Routes on the plan" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist im Feld B1?"
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
            say: "Was ist im Feld B eins?"
            options: ["Park", "Kiosk", "Brunnen"]
            answer: "Park"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "In welchem Feld ist das Café?"
            show: { drawn: table, rows: [["", A, B, C], ["1", Eingang, Affen, Löwen], ["2", Café, Elefanten, Pinguine], ["3", Ziegen, Zebras, Spielplatz]] }
            say: "In welchem Feld ist das Café?"
            options: ["A2", "B2", "2A"]
            answer: "A2"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Vom Brunnen (B2) 1 Feld nach rechts: Kino (C2)"
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]], mark: [[2, 2], [2, 3]] }
            say: "Auf dem Plan kannst du Wege gehen. Nach rechts kommt der nächste Buchstabe, nach unten die nächste Zahl. Vom Brunnen in B zwei gehst du ein Feld nach rechts. Du kommst zum Kino in C zwei."
          - text: "Von der Schule (A1): 2 nach rechts, dann 1 nach unten\nA1, B1, C1, C2: Kino"
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]], mark: [[1, 1], [1, 2], [1, 3], [2, 3]] }
            say: "Von der Schule in A eins gehst du zwei Felder nach rechts. Dann bist du beim Kiosk in C eins. Dann gehst du ein Feld nach unten. Jetzt bist du beim Kino in C zwei."
          - text: "Von der Post (A3) zum See (C3): 2 Felder nach rechts"
            show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]], mark: [[3, 1], [3, 2], [3, 3]] }
            say: "Wie kommst du von der Post zum See? Beide liegen in der Zeile drei. Von A bis C sind es zwei Felder nach rechts. Nach oben ginge es zur kleineren Zahl, nach links zum Buchstaben davor."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Du bist am Park (B1). Du gehst 1 Feld nach unten. Wo bist du?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
                say: "Du bist am Park in B eins. Du gehst ein Feld nach unten. Wo bist du?"
                options: ["Brunnen", "Kiosk", "Schule"]
                answer: "Brunnen"
                hints:
                  - "Nach unten kommt die nächste Zeile."
                  - "Von B1 nach B2."
                  - "Brunnen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Du bist am Eingang (A1). Du gehst 2 Felder nach rechts. Wo bist du?"
                show: { drawn: table, rows: [["", A, B, C], ["1", Eingang, Affen, Löwen], ["2", Café, Elefanten, Pinguine], ["3", Ziegen, Zebras, Spielplatz]] }
                say: "Du bist am Eingang vom Zoo in A eins. Du gehst zwei Felder nach rechts. Wo bist du?"
                options: ["Löwen", "Affen", "Ziegen"]
                answer: "Löwen"
                feedback:
                  "Affen": "Bei den Affen bist du nach 1 Feld. Geh noch ein Feld weiter."
                hints:
                  - "Nach rechts kommt der nächste Buchstabe."
                  - "Von A über B nach C."
                  - "Löwen."
              - id: l2-f3
                type: multiple_choice
                text: "Du bist am Boot (D2). Du gehst 2 Felder nach links und dann 1 Feld nach oben. Wo bist du?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Wald, Hütte, Strand, Felsen], ["2", Höhle, Schatz, Palme, Boot], ["3", Fluss, Brücke, Turm, Bucht]] }
                say: "Du bist am Boot in D zwei. Du gehst zwei Felder nach links und dann ein Feld nach oben. Wo bist du?"
                options: ["Hütte", "Schatz", "Brücke"]
                answer: "Hütte"
                feedback:
                  "Brücke": "Du bist nach unten gegangen. Nach oben kommt die kleinere Zahl, also die Zeile 1."
                  "Schatz": "Beim Schatz bist du nach 2 Feldern nach links. Jetzt noch 1 Feld nach oben."
                hints:
                  - "Nach links kommt der Buchstabe davor: von D zu B."
                  - "Dann von B2 nach oben zu B1."
                  - "Hütte."
              - id: l2-f4
                type: true_false
                text: "Von der Bank (A2) zum Zoo (D2) sind es 3 Felder nach rechts."
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
                say: "Stimmt das? Von der Bank in A zwei zum Zoo in D zwei sind es drei Felder nach rechts."
                answer: true
                hints:
                  - "Beide liegen in der Zeile 2."
                  - "Zähl die Schritte: A zu B, B zu C, C zu D."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Wie kommst du von den Ziegen (A3) zu den Pinguinen (C2)?"
                show: { drawn: table, rows: [["", A, B, C], ["1", Eingang, Affen, Löwen], ["2", Café, Elefanten, Pinguine], ["3", Ziegen, Zebras, Spielplatz]] }
                say: "Wie kommst du von den Ziegen in A drei zu den Pinguinen in C zwei?"
                options: ["2 nach rechts, 1 nach oben", "2 nach rechts, 1 nach unten", "1 nach rechts, 2 nach oben"]
                answer: "2 nach rechts, 1 nach oben"
                hints:
                  - "Von A nach C, dann von Zeile 3 nach Zeile 2."
                  - "Zur kleineren Zahl geht es nach oben."
                  - "2 nach rechts, 1 nach oben."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Du bist an der Palme (C2). Du gehst 1 Feld nach unten. Wo bist du?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Wald, Hütte, Strand, Felsen], ["2", Höhle, Schatz, Palme, Boot], ["3", Fluss, Brücke, Turm, Bucht]] }
                say: "Du bist an der Palme in C zwei. Du gehst ein Feld nach unten. Wo bist du?"
                options: ["Turm", "Strand", "Boot"]
                answer: "Turm"
                hints: ["Nach unten kommt die nächste Zahl."]
              - id: l2-s2
                type: multiple_choice
                text: "Du bist am Bahnhof (D3). Du gehst 3 Felder nach links. Wo bist du?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Schule, Park, Kiosk, Bäcker], ["2", Bank, Brunnen, Kino, Zoo], ["3", Post, Spielplatz, See, Bahnhof]] }
                say: "Du bist am Bahnhof in D drei. Du gehst drei Felder nach links. Wo bist du?"
                options: ["Post", "Spielplatz", "Bank"]
                answer: "Post"
                hints: ["Nach links kommt der Buchstabe davor: D, C, B, A."]
              - id: l2-s3
                type: true_false
                text: "Von den Affen (B1) gehst du 2 Felder nach unten. Dann bist du bei den Zebras."
                show: { drawn: table, rows: [["", A, B, C], ["1", Eingang, Affen, Löwen], ["2", Café, Elefanten, Pinguine], ["3", Ziegen, Zebras, Spielplatz]] }
                say: "Stimmt das? Von den Affen in B eins gehst du zwei Felder nach unten. Dann bist du bei den Zebras."
                answer: true
                hints: ["Von B1 über B2 nach B3."]
              - id: l2-s4
                type: multiple_choice
                text: "Wie kommst du vom Wald (A1) zum Schatz (B2)?"
                show: { drawn: table, rows: [["", A, B, C, D], ["1", Wald, Hütte, Strand, Felsen], ["2", Höhle, Schatz, Palme, Boot], ["3", Fluss, Brücke, Turm, Bucht]] }
                say: "Wie kommst du vom Wald in A eins zum Schatz in B zwei?"
                options: ["1 nach rechts, 1 nach unten", "1 nach links, 1 nach unten", "1 nach rechts, 1 nach oben"]
                answer: "1 nach rechts, 1 nach unten"
                hints: ["Von A nach B ist rechts. Von 1 nach 2 ist unten."]
              - id: l2-s5
