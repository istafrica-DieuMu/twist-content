# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.mult-div-tens
skill: math.mult-div-larger.tens
curriculum: de-DE
language: de
title:
  de: Malnehmen und Teilen mit Zehnerzahlen
  en: Multiplying and dividing with multiples of ten
summary: >
  Times-table facts carried over to tens. Lesson 1 multiplies with a
  Zehnerzahl (3 · 40 = 120, because 3 · 4 Zehner = 12 Zehner); lesson 2
  divides a Zehnerzahl (240 : 6 = 40, because 24 Zehner : 6 = 4 Zehner)
  and checks with the multiplication, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.div-inverse, math.numbers-to-1000.place-value]
  also_practises: [math.mult-div.all-tables, math.mult-div.div-facts]
  vocabulary: { de: [Zehner, Zehnerzahl, Kernaufgabe, Einmaleinsaufgabe, Probe] }
  forms: [drawn, text, audio]
  drawn: [base-ten]
  facets: []
  misconceptions:
    - id: extra-zero
      what: "Adds a zero too many or too few (6 · 80 = 4800, 280 : 7 = 4)"
      addressed: lesson 1 and 2 Learn count in Zehner; l1-f4, l2-f4 and l2-c4 are wrong by a power of ten, and the frames offer 2400, 2100, 600 and 700 as chips
    - id: wrong-core-fact
      what: Picks an addition or the wrong pairing as the helping fact (8 + 70)
      addressed: "\"Welche Kernaufgabe hilft?\" offers a plus task in l1-f3 (with feedback), l1-s3 and l2-c3, and a minus task in l2-f3 and l2-s3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Malnehmen mit Zehnerzahlen", en: "Multiplying by tens" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Welche Zahl fehlt in der Malaufgabe?"
            frame: "_ · 9 = 63"
            options: ["7", "8", "6"]
            answer: ["7"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Zehner sind 120?"
            say: "Hundertzwanzig. Wie viele Zehner sind das?"
            options: ["12", "1", "120"]
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 · 4 = 12 | 3 · 40 = 120"
            say: "Drei mal vier ist zwölf. Drei mal vier Zehner sind zwölf Zehner, also hundertzwanzig. Drei mal vierzig ist hundertzwanzig."
            show: { drawn: base-ten, tens: 12 }
          - text: "7 · 5 = 35 | 7 · 50 = 350"
            say: "Sieben mal fünf ist fünfunddreißig. Sieben mal fünf Zehner sind fünfunddreißig Zehner, also dreihundertfünfzig."
          - text: "3 · 6 = 18 | 30 · 6 = 180"
            say: "Auch wenn die Zehnerzahl vorne steht, hilft die Kernaufgabe: Drei mal sechs ist achtzehn, also ist dreißig mal sechs hundertachtzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Die Einmaleinsaufgabe hilft."
                say: "Rechne zuerst vier mal sechs, dann vier mal sechzig."
                frame: "4 · 6 = _ | 4 · 60 = _"
                options: ["24", "240", "2400", "204"]
                answer: ["24", "240"]
                hints:
                  - "Rechne zuerst die kleine Aufgabe aus dem Einmaleins."
                  - "Sechzig sind sechs Zehner. Vier mal sechs Zehner sind so viele Zehner wie vier mal sechs."
                  - "24 und 240."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "5 · 30 = _"
                say: "Fünf mal dreißig."
                answer: "150"
                hints:
                  - "Welche Einmaleinsaufgabe steckt darin?"
                  - "Fünf mal drei ist fünfzehn. Wie viele Zehner sind es dann?"
                  - "150."
              - id: l1-f3
                type: multiple_choice
                text: "Welche Kernaufgabe hilft bei 8 · 70?"
                say: "Acht mal siebzig. Welche Einmaleinsaufgabe hilft dir?"
                options: ["8 · 7", "8 + 70", "80 · 70"]
                answer: "8 · 7"
                feedback:
                  "8 + 70": "Das ist eine Plusaufgabe. Hier hilft eine Malaufgabe aus dem Einmaleins."
                hints:
                  - "Lass die Null bei siebzig erst einmal weg."
                  - "Ohne die Null bleibt von siebzig nur die Sieben."
                  - "8 · 7."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 6 · 80 = 4800"
                say: "Sechs mal achtzig ist viertausendachthundert. Stimmt das?"
                answer: false
                hints:
                  - "Welche Einmaleinsaufgabe steckt darin?"
                  - "Sechs mal acht ist achtundvierzig. Wie viele Zehner sind es?"
                  - "Nein. 6 · 80 = 480."
              - id: l1-f5
                type: text_input
                text: "Ein Heft kostet 90 Cent. Wie viel Cent kosten 4 Hefte?"
                say: "Ein Heft kostet neunzig Cent. Wie viel Cent kosten vier Hefte?"
                answer: "360"
                hints:
                  - "Welche Malaufgabe passt?"
                  - "Vier mal neunzig. Vier mal neun ist sechsunddreißig."
                  - "360 Cent."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Die Einmaleinsaufgabe hilft."
                say: "Rechne zuerst sieben mal drei, dann sieben mal dreißig."
                frame: "7 · 3 = _ | 7 · 30 = _"
                options: ["21", "210", "2100"]
                answer: ["21", "210"]
                hints: ["Sieben mal drei Zehner sind einundzwanzig Zehner."]
              - id: l1-s2
                type: text_input
                text: "9 · 40 = _"
                say: "Neun mal vierzig."
                answer: "360"
                hints: ["Neun mal vier ist sechsunddreißig."]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Kernaufgabe hilft bei 50 · 6?"
                say: "Fünfzig mal sechs. Welche Einmaleinsaufgabe hilft dir?"
                options: ["5 · 6", "50 + 6", "50 − 6"]
                answer: "5 · 6"
                hints: ["Lass die Null bei fünfzig erst einmal weg."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 3 · 90 = 270"
                say: "Drei mal neunzig ist zweihundertsiebzig. Stimmt das?"
                answer: true
                hints: ["Drei mal neun ist siebenundzwanzig."]
              - id: l1-s5
                type: text_input
                text: "Ein Bus hat 50 Plätze. Wie viele Plätze haben 6 Busse?"
                say: "Ein Bus hat fünfzig Plätze. Wie viele Plätze haben sechs Busse zusammen?"
                answer: "300"
                hints: ["Sechs mal fünfzig."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Die Einmaleinsaufgabe hilft."
                say: "Rechne zuerst acht mal sechs, dann acht mal sechzig."
                frame: "8 · 6 = _ | 8 · 60 = _"
                options: ["48", "480", "4800"]
                answer: ["48", "480"]
              - id: l1-n2
                type: text_input
                text: "7 · 80 = _"
                say: "Sieben mal achtzig."
                answer: "560"
              - id: l1-n3
                type: multiple_choice
                text: "Welche Aufgabe hat das Ergebnis 320?"
                say: "Welche Aufgabe hat das Ergebnis dreihundertzwanzig?"
                options: ["4 · 80", "4 · 8", "40 · 80"]
                answer: "4 · 80"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 20 · 9 = 180"
                say: "Zwanzig mal neun ist hundertachtzig. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "Eine Packung hat 60 Stifte. Wie viele Stifte sind in 9 Packungen?"
                say: "In einer Packung sind sechzig Stifte. Wie viele Stifte sind in neun Packungen?"
                answer: "540"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "6 · 70 = _"
            say: "Sechs mal siebzig."
            answer: "420"
          - id: l1-c2
            type: text_input
            text: "40 · 8 = _"
            say: "Vierzig mal acht."
            answer: "320"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 5 · 80 = 400"
            say: "Fünf mal achtzig ist vierhundert. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Teilen mit Zehnerzahlen", en: "Dividing tens" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "7 · 40 = _"
            say: "Sieben mal vierzig."
            answer: "280"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Welche Zahl fehlt in der Malaufgabe?"
            frame: "_ · 6 = 48"
            options: ["8", "7", "9"]
            answer: ["8"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "24 : 6 = 4 | 240 : 6 = 40"
            say: "Vierundzwanzig geteilt durch sechs ist vier. Zweihundertvierzig sind vierundzwanzig Zehner. Vierundzwanzig Zehner geteilt durch sechs sind vier Zehner, also vierzig."
            show: { drawn: base-ten, tens: 24 }
          - text: "35 : 7 = 5 | 350 : 7 = 50"
            say: "Dreihundertfünfzig sind fünfunddreißig Zehner. Geteilt durch sieben sind das fünf Zehner, also fünfzig."
          - text: "Probe: 7 · 50 = 350"
            say: "Mit der Malaufgabe machst du die Probe: Sieben mal fünfzig ist dreihundertfünfzig. Es stimmt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Die Einmaleinsaufgabe hilft."
                say: "Rechne zuerst achtzehn geteilt durch drei, dann hundertachtzig geteilt durch drei."
                frame: "18 : 3 = _ | 180 : 3 = _"
                options: ["6", "60", "600"]
                answer: ["6", "60"]
                hints:
                  - "Rechne zuerst die kleine Aufgabe aus dem Einmaleins."
                  - "Hundertachtzig sind achtzehn Zehner. Achtzehn Zehner geteilt durch drei sind so viele Zehner wie achtzehn geteilt durch drei."
                  - "6 und 60."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "320 : 8 = _"
                say: "Dreihundertzwanzig geteilt durch acht."
                answer: "40"
                hints:
                  - "Wie viele Zehner sind dreihundertzwanzig?"
                  - "Zweiunddreißig Zehner geteilt durch acht."
                  - "40."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Kernaufgabe hilft bei 450 : 9?"
                say: "Vierhundertfünfzig geteilt durch neun. Welche Einmaleinsaufgabe hilft dir?"
                options: ["45 : 9", "450 − 9", "45 · 9"]
                answer: "45 : 9"
                hints:
                  - "Wie viele Zehner sind vierhundertfünfzig?"
                  - "Fünfundvierzig Zehner. Teile sie durch neun."
                  - "45 : 9."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 280 : 7 = 4"
                say: "Zweihundertachtzig geteilt durch sieben ist vier. Stimmt das?"
                answer: false
                hints:
                  - "Mach die Probe: sieben mal vier."
                  - "Sieben mal vier ist achtundzwanzig, nicht zweihundertachtzig."
                  - "Nein. 280 : 7 = 40."
              - id: l2-f5
                type: text_input
                text: "240 Äpfel werden auf 4 Kisten verteilt. Wie viele Äpfel kommen in jede Kiste?"
                say: "Zweihundertvierzig Äpfel werden gerecht auf vier Kisten verteilt. Wie viele Äpfel kommen in jede Kiste?"
                answer: "60"
                hints:
                  - "Welche Geteiltaufgabe passt?"
                  - "Zweihundertvierzig geteilt durch vier. Vierundzwanzig Zehner geteilt durch vier."
                  - "60 Äpfel."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Die Einmaleinsaufgabe hilft."
                say: "Rechne zuerst zweiundvierzig geteilt durch sechs, dann vierhundertzwanzig geteilt durch sechs."
                frame: "42 : 6 = _ | 420 : 6 = _"
                options: ["7", "70", "700"]
                answer: ["7", "70"]
                hints: ["Zweiundvierzig Zehner geteilt durch sechs."]
              - id: l2-s2
                type: text_input
                text: "540 : 9 = _"
                say: "Fünfhundertvierzig geteilt durch neun."
                answer: "60"
                hints: ["Vierundfünfzig Zehner geteilt durch neun."]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Kernaufgabe hilft bei 630 : 7?"
                say: "Sechshundertdreißig geteilt durch sieben. Welche Einmaleinsaufgabe hilft dir?"
                options: ["63 : 7", "630 − 7", "63 · 7"]
                answer: "63 : 7"
                hints: ["Wie viele Zehner sind sechshundertdreißig?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 160 : 4 = 40"
                say: "Hundertsechzig geteilt durch vier ist vierzig. Stimmt das?"
                answer: true
                hints: ["Mach die Probe: vier mal vierzig."]
              - id: l2-s5
                type: text_input
                text: "Ein Seil ist 360 cm lang. Es wird in 6 gleich lange Stücke geschnitten. Wie viele cm ist ein Stück lang?"
                say: "Ein Seil ist dreihundertsechzig Zentimeter lang. Es wird in sechs gleich lange Stücke geschnitten. Wie viele Zentimeter ist ein Stück lang?"
                answer: "60"
                hints: ["Dreihundertsechzig geteilt durch sechs."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Die Einmaleinsaufgabe hilft."
                say: "Rechne zuerst sechsundfünfzig geteilt durch acht, dann fünfhundertsechzig geteilt durch acht."
                frame: "56 : 8 = _ | 560 : 8 = _"
                options: ["7", "70", "700"]
                answer: ["7", "70"]
              - id: l2-n2
                type: text_input
                text: "490 : 7 = _"
                say: "Vierhundertneunzig geteilt durch sieben."
                answer: "70"
              - id: l2-n3
                type: multiple_choice
                text: "Welche Aufgabe hat das Ergebnis 30?"
                say: "Welche Aufgabe hat das Ergebnis dreißig?"
                options: ["270 : 9", "27 : 9", "270 · 9"]
                answer: "270 : 9"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 400 : 5 = 80"
                say: "Vierhundert geteilt durch fünf ist achtzig. Stimmt das?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "8 Kinder laufen eine Staffel über 640 m. Jedes Kind läuft gleich weit. Wie viele Meter läuft jedes Kind?"
                say: "Acht Kinder laufen zusammen eine Staffel über sechshundertvierzig Meter. Jedes Kind läuft gleich weit. Wie viele Meter läuft jedes Kind?"
                answer: "80"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "4 · 90 = _"
            say: "Vier mal neunzig."
            answer: "360"
          - id: l2-c2
            type: text_input
            text: "720 : 8 = _"
            say: "Siebenhundertzwanzig geteilt durch acht."
            answer: "90"
          - id: l2-c3
            type: multiple_choice
            text: "Welche Kernaufgabe hilft bei 6 · 50?"
            say: "Sechs mal fünfzig. Welche Einmaleinsaufgabe hilft dir?"
            options: ["6 · 5", "6 + 50", "60 · 50"]
            answer: "6 · 5"
          - id: l2-c4
            type: true_false
            text: "Stimmt das? 210 : 3 = 7"
            say: "Zweihundertzehn geteilt durch drei ist sieben. Stimmt das?"
            answer: false
          - id: l2-c5
            type: text_input
            text: "Ein Regal hat 8 Bretter. Auf jedem Brett stehen 40 Bücher. Wie viele Bücher sind es?"
            say: "Ein Regal hat acht Bretter. Auf jedem Brett stehen vierzig Bücher. Wie viele Bücher sind es zusammen?"
            answer: "320"
