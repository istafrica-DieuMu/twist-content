            text: "Welche Aufgabe hat das Ergebnis 420?"
            say: "Welche Aufgabe hat das Ergebnis vierhundertzwanzig?"
            options: ["7 · 60", "7 · 6", "70 · 60"]
            answer: "7 · 60"
          - id: l2-c11
            part: div
            type: text_input
            text: "150 : 5 = _"
            say: "Hundertfünfzig geteilt durch fünf."
            answer: "30"
