# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.compare-chances
skill: math.chance.compare-chances
curriculum: de-DE
language: de
title:
  de: Chancen vergleichen
  en: Comparing chances
summary: >
  Lesson 1 compares chances by counting: the fields of a Glücksrad, the
  numbers on a Würfel that win (2, 4 und 6 sind gerade: 3 von 6), the
  two sides of a Münze; it also compares fields with the whole wheel
  (1 rotes von 2 Feldern beats 2 rote von 6 Feldern) and shows that a
  6 is as likely as a 1. Lesson 2 makes a Vermutung and checks it with
  a Versuch in a Strichliste: which wheel fits a result, whether the
  result fits the guess, why a second Versuch comes out a little
  differently and why many Versuche tell more than a few. It ends with
  the skill check. Spinning or rolling in the app waits for an
  experiment task.
metadata:
  year: klasse-3
  topic: { de: Wahrscheinlichkeit, en: Chance }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.chance.certain-possible-impossible, math.data.tally]
  also_practises: [math.chance.certain-possible-impossible, math.data.tally]
  vocabulary: { de: [Chance, wahrscheinlicher, gleich wahrscheinlich, Vermutung, Versuch, Strichliste, Münze, Kopf, Zahl, gerade, ungerade] }
  forms: [text, audio, drawn]
  drawn: [spinner, dots, bar-chart]
  facets: []
  parts:
    - { id: wheel, what: { de: Chancen am Glücksrad vergleichen, en: comparing chances on a spinner } }
    - { id: dice-coin, what: { de: Chancen beim Würfel und bei der Münze vergleichen, en: comparing chances with a dice and a coin } }
    - { id: guess, what: { de: eine Vermutung und ein Ergebnis zusammenbringen, en: matching a prediction and a result } }
    - { id: trials, what: { de: "wissen, dass Versuche verschieden ausgehen und viele Versuche mehr sagen", en: knowing that trials come out differently and that many trials tell more } }
  misconceptions:
    - id: counts-only-winning
      what: Compares only the winning fields and forgets the whole (2 rote Felder von 6 seem better than 1 rotes von 2)
      addressed: lesson 1 Learn compares one red field of two with two of six; l1-f5 (with feedback), l1-s5, l1-n5 and l2-c3 compare wheels with different numbers of fields
    - id: six-is-hard
      what: Thinks a 6 is harder to roll than other numbers
      addressed: lesson 1 Learn says every number has one side; l1-f4 (with feedback), l1-s4, l1-n3 and l2-c4 ask whether the 6 is rarer
    - id: one-result-is-the-truth
      what: Expects a Versuch to come out exactly as the fields say, or exactly the same the next time, or trusts a handful of tries
      addressed: lesson 2 Learn repeats a Versuch with a different result and compares 4 tries with 40; l2-f4 (with feedback), l2-f6, l2-s4, l2-s6, l2-n4, l2-n6 and l2-c5 ask about it
    - id: gamblers-fallacy
      what: Thinks after several Kopf a Zahl is now due
      addressed: lesson 2 Learn says the Münze does not remember; l2-f5 (with feedback), l2-s5 and l2-n5 ask about it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Welche Chance ist größer?", en: "Which chance is bigger?" }
    goal:
      de: "Zähl Felder und Seiten und finde heraus, was wahrscheinlicher ist, so wie Rot bei 3 von 4 Feldern."
      en: "Count fields and sides and find out what is more likely, like red on 3 of 4 fields."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Der Zeiger bleibt auf Blau stehen."
            say: "Der Zeiger bleibt auf Blau stehen. Welches Wort passt am besten?"
            show: { drawn: spinner, sectors: [red, red, blue, red, red, red] }
            options: ["unmöglich", "unwahrscheinlich", "wahrscheinlich", "sicher"]
            answer: "unwahrscheinlich"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie oft kam Rot?"
            say: "Lars hat das Glücksrad gedreht und eine Strichliste gemacht. Wie oft kam Rot?"
            show: { drawn: bar-chart, tally: true, rows: [["Rot", 12], ["Blau", 7]] }
            options: ["12", "7", "10"]
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Rot: 3 von 4 Feldern\nBlau: 1 von 4 Feldern\nRot ist wahrscheinlicher."
            say: "Zähl die Felder. Drei von vier Feldern sind rot, nur eins ist blau. Rot hat die größere Chance. Wir sagen: Rot ist wahrscheinlicher als Blau."
            show: { drawn: spinner, sectors: [red, red, blue, red] }
          - text: "gerade Zahl: 2, 4, 6 → 3 von 6\neine 6 → 1 von 6"
            say: "Ein Würfel hat sechs Seiten. Für eine gerade Zahl passen drei Seiten: zwei, vier und sechs. Für eine Sechs passt nur eine Seite. Eine gerade Zahl ist also wahrscheinlicher als eine Sechs. Übrigens: Die Sechs ist nicht schwerer zu würfeln als die Eins. Jede Zahl hat genau eine Seite."
            show: { drawn: dots, count: 6, layout: dice }
          - text: "Rad A: 1 rotes von 2 Feldern\nRad B: 2 rote von 6 Feldern"
            say: "Vorsicht! Rad B hat mehr rote Felder als Rad A. Aber bei Rad A ist die Hälfte rot, bei Rad B ist es weniger als die Hälfte. Schau immer auf alle Felder. Bei Rad A ist Rot wahrscheinlicher."
          - text: "Münze: Kopf oder Zahl"
            say: "Eine Münze hat zwei Seiten, Kopf und Zahl. Beide Seiten haben die gleiche Chance. Kopf und Zahl sind gleich wahrscheinlich."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Farbe ist am wahrscheinlichsten?"
                say: "Du drehst dieses Glücksrad. Welche Farbe ist am wahrscheinlichsten?"
                show: { drawn: spinner, sectors: [green, yellow, green, blue, green, yellow] }
                options: ["Grün", "Gelb", "Blau"]
                answer: "Grün"
                hints:
                  - "Zähl die Felder für jede Farbe."
                  - "Grün hat 3 Felder, Gelb 2, Blau 1."
                  - "Grün."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ist Rot oder Blau wahrscheinlicher?"
                say: "Ist bei diesem Glücksrad Rot oder Blau wahrscheinlicher?"
                show: { drawn: spinner, sectors: [red, blue, red, blue] }
                options: ["Rot", "Blau", "gleich wahrscheinlich"]
                answer: "gleich wahrscheinlich"
                keep_order: true
                feedback:
                  "Rot": "Zähl noch einmal: Rot hat 2 Felder, Blau hat auch 2."
                  "Blau": "Zähl noch einmal: Blau hat 2 Felder, Rot hat auch 2."
                hints:
                  - "Zähl die roten und die blauen Felder."
                  - "Rot hat 2 Felder. Blau hat 2 Felder."
                  - "Gleich viele Felder: gleich wahrscheinlich."
              - id: l1-f3
                type: multiple_choice
                text: "Du würfelst einmal. Was ist wahrscheinlicher?"
                say: "Du würfelst einmal mit einem normalen Würfel. Was ist wahrscheinlicher?"
                options: ["eine Zahl größer als 4", "eine Zahl kleiner als 4", "beides gleich"]
                answer: "eine Zahl kleiner als 4"
                hints:
                  - "Schreib die passenden Zahlen auf."
                  - "Größer als 4: 5 und 6. Kleiner als 4: 1, 2 und 3."
                  - "Kleiner als 4 hat 3 Zahlen, größer als 4 nur 2."
              - id: l1-f4
                type: true_false
                text: "Jan sagt: „Eine 6 ist schwerer zu würfeln als eine 1.“"
                say: "Jan sagt: Eine Sechs ist schwerer zu würfeln als eine Eins. Stimmt das?"
                show: { drawn: dots, count: 6, layout: dice }
                answer: false
                feedback:
                  "true": "Die 6 und die 1 haben jede genau eine Seite auf dem Würfel. Sie sind gleich wahrscheinlich."
                hints:
                  - "Wie viele Seiten hat die 6? Wie viele die 1?"
                  - "Jede Zahl steht genau einmal auf dem Würfel."
                  - "Nein. 6 und 1 sind gleich wahrscheinlich."
              - id: l1-f5
                type: image_multiple_choice
                text: "Du gewinnst bei Rot. Welches Rad nimmst du?"
                say: "Du gewinnst, wenn der Zeiger auf Rot stehen bleibt. Mit welchem Glücksrad ist deine Chance am größten?"
                options:
                  - { drawn: spinner, sectors: [red, blue], key: "1-von-2" }
                  - { drawn: spinner, sectors: [red, blue, blue, red, blue, blue], key: "2-von-6" }
                  - { drawn: spinner, sectors: [red, blue, blue, blue], key: "1-von-4" }
                answer: "1-von-2"
                feedback:
                  "2-von-6": "Hier sind zwar 2 Felder rot, aber 4 Felder blau. Beim Rad mit 2 Feldern ist die Hälfte rot."
                hints:
                  - "Vergleiche bei jedem Rad: Wie viele Felder sind rot, wie viele gibt es insgesamt?"
                  - "1 von 2 ist die Hälfte. 2 von 6 ist weniger als die Hälfte."
                  - "Das Rad mit einem roten und einem blauen Feld."
                difficulty: stretch
              - id: l1-f6
                type: multiple_choice
                text: "Kopf oder Zahl: Was ist wahrscheinlicher?"
                say: "Du wirfst eine Münze. Ist Kopf oder Zahl wahrscheinlicher?"
                options: ["Kopf", "Zahl", "gleich wahrscheinlich"]
                answer: "gleich wahrscheinlich"
                keep_order: true
                hints:
                  - "Wie viele Seiten hat eine Münze?"
                  - "Eine Seite ist Kopf, eine Seite ist Zahl."
                  - "Jede Seite hat die gleiche Chance."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Farbe ist am wenigsten wahrscheinlich?"
                say: "Welche Farbe ist bei diesem Glücksrad am wenigsten wahrscheinlich?"
                show: { drawn: spinner, sectors: [blue, red, blue, yellow, blue, red] }
                options: ["Blau", "Rot", "Gelb"]
                answer: "Gelb"
                hints: ["Welche Farbe hat die wenigsten Felder?"]
              - id: l1-s2
                type: multiple_choice
                text: "Du würfelst einmal. Was ist wahrscheinlicher?"
                say: "Du würfelst einmal. Was ist wahrscheinlicher?"
                options: ["eine ungerade Zahl", "eine 5", "beides gleich"]
                answer: "eine ungerade Zahl"
                hints: ["Ungerade Zahlen auf dem Würfel: 1, 3 und 5."]
              - id: l1-s3
                type: multiple_choice
                text: "Ist Gelb oder Grün wahrscheinlicher?"
                say: "Ist bei diesem Glücksrad Gelb oder Grün wahrscheinlicher?"
                show: { drawn: spinner, sectors: [yellow, green, green, yellow, green, yellow] }
                options: ["Gelb", "Grün", "gleich wahrscheinlich"]
                answer: "gleich wahrscheinlich"
                keep_order: true
                hints: ["Zähl die gelben und die grünen Felder."]
              - id: l1-s4
                type: true_false
                text: "Eine 3 ist genauso wahrscheinlich wie eine 6."
                say: "Du würfelst mit einem normalen Würfel. Stimmt das? Eine Drei ist genauso wahrscheinlich wie eine Sechs."
                answer: true
                hints: ["Wie oft steht jede Zahl auf dem Würfel?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Du gewinnst bei Blau. Welches Rad nimmst du?"
                say: "Du gewinnst bei Blau. Mit welchem Glücksrad ist deine Chance am größten?"
                options:
                  - { drawn: spinner, sectors: [blue, red, red, red, red, red], key: "1-von-6" }
                  - { drawn: spinner, sectors: [blue, red, blue, red, red, red], key: "2-von-6" }
                  - { drawn: spinner, sectors: [blue, blue, red], key: "2-von-3" }
                answer: "2-von-3"
                hints: ["Schau auch, wie viele Felder es insgesamt gibt."]
              - id: l1-s6
                type: multiple_choice
                text: "Du gewinnst bei einer Zahl größer als 2. Wie viele Seiten des Würfels passen?"
                say: "Du gewinnst, wenn du eine Zahl größer als zwei würfelst. Wie viele Seiten des Würfels passen?"
                options: ["4", "2", "3"]
                answer: "4"
                feedback:
                  "3": "Zähl noch einmal: 3, 4, 5 und 6."
                hints: ["Größer als 2: Welche Zahlen sind das?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Pia gewinnt bei Rot, Ole bei Gelb. Wer hat die größere Chance?"
                say: "Pia gewinnt bei Rot, Ole gewinnt bei Gelb. Wer hat die größere Chance?"
                show: { drawn: spinner, sectors: [yellow, red, yellow, yellow, red, yellow] }
                options: ["Pia", "Ole", "beide gleich"]
                answer: "Ole"
                keep_order: true
              - id: l1-n2
                type: multiple_choice
                text: "Emil gewinnt bei 1 oder 2. Lotta gewinnt bei 5 oder 6. Wer hat die größere Chance?"
                say: "Emil und Lotta würfeln. Emil gewinnt bei einer Eins oder Zwei. Lotta gewinnt bei einer Fünf oder Sechs. Wer hat die größere Chance?"
                options: ["Emil", "Lotta", "beide gleich"]
                answer: "beide gleich"
                keep_order: true
              - id: l1-n3
                type: true_false
                text: "Noah sagt: „Eine 6 kommt beim Würfeln am seltensten.“"
                say: "Noah sagt: Eine Sechs kommt beim Würfeln am seltensten. Stimmt das?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Du würfelst einmal. Was ist am wahrscheinlichsten?"
                say: "Du würfelst einmal. Was ist am wahrscheinlichsten?"
                options: ["eine 1", "eine gerade Zahl", "eine Zahl größer als 5"]
                answer: "eine gerade Zahl"
              - id: l1-n5
                type: image_multiple_choice
                text: "Du gewinnst bei Grün. Welches Rad nimmst du?"
                say: "Du gewinnst bei Grün. Mit welchem Glücksrad ist deine Chance am größten?"
                options:
                  - { drawn: spinner, sectors: [green, red, green, red, red, red], key: "2-von-6" }
                  - { drawn: spinner, sectors: [green, red, green, red], key: "2-von-4" }
                  - { drawn: spinner, sectors: [green, red, red], key: "1-von-3" }
                answer: "2-von-4"
                difficulty: stretch
              - id: l1-n6
                type: multiple_choice
                text: "Kim würfelt eine Zahl von 1 bis 6. Welches Wort passt?"
                say: "Kim würfelt eine Zahl von eins bis sechs. Welches Wort passt am besten?"
                options: ["unmöglich", "unwahrscheinlich", "wahrscheinlich", "sicher"]
                answer: "sicher"
                keep_order: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Farbe ist am wahrscheinlichsten?"
            say: "Welche Farbe ist bei diesem Glücksrad am wahrscheinlichsten?"
            show: { drawn: spinner, sectors: [blue, yellow, blue, blue, red, yellow] }
            options: ["Blau", "Gelb", "Rot"]
            answer: "Blau"
          - id: l1-c2
            type: multiple_choice
            text: "Du würfelst einmal. Was ist wahrscheinlicher?"
            say: "Du würfelst einmal. Was ist wahrscheinlicher?"
            options: ["eine Zahl kleiner als 3", "eine Zahl größer als 2", "beides gleich"]
            answer: "eine Zahl größer als 2"
            keep_order: true
          - id: l1-c3
            type: true_false
            text: "Kopf und Zahl sind gleich wahrscheinlich."
            say: "Du wirfst eine Münze. Stimmt das? Kopf und Zahl sind gleich wahrscheinlich."
            answer: true
          - id: l1-c4
            type: image_multiple_choice
            text: "Du gewinnst bei Blau. Welches Rad nimmst du?"
            say: "Du gewinnst bei Blau. Mit welchem Glücksrad ist deine Chance am größten?"
            options:
              - { drawn: spinner, sectors: [blue, red, red, red], key: "1-von-4" }
              - { drawn: spinner, sectors: [blue, red], key: "1-von-2" }
              - { drawn: spinner, sectors: [blue, red, red], key: "1-von-3" }
            answer: "1-von-2"
          - id: l1-c5
            type: multiple_choice
            text: "Ist Rot oder Grün wahrscheinlicher?"
            say: "Ist bei diesem Glücksrad Rot oder Grün wahrscheinlicher?"
            show: { drawn: spinner, sectors: [red, green, red, green, red, red] }
            options: ["Rot", "Grün", "gleich wahrscheinlich"]
            answer: "Rot"
            keep_order: true
          - id: l1-c6
            type: true_false
            text: "Du würfelst einmal. Eine gerade Zahl ist wahrscheinlicher als eine ungerade Zahl."
            say: "Du würfelst einmal. Stimmt das? Eine gerade Zahl ist wahrscheinlicher als eine ungerade Zahl."
            answer: false

  - n: 2
    title: { de: "Vermuten und ausprobieren", en: "Predict and test" }
    goal:
      de: "Stell eine Vermutung auf und prüf sie mit vielen Versuchen, so wie Lena mit dem Glücksrad."
      en: "Make a guess and test it with lots of tries, like Lena with the spinner."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ist Rot oder Blau wahrscheinlicher?"
            say: "Ist bei diesem Glücksrad Rot oder Blau wahrscheinlicher?"
            show: { drawn: spinner, sectors: [red, blue, red, red] }
            options: ["Rot", "Blau", "gleich wahrscheinlich"]
            answer: "Rot"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Du würfelst einmal. Was ist wahrscheinlicher?"
            say: "Du würfelst einmal. Was ist wahrscheinlicher?"
            options: ["eine 4", "eine 2 oder eine 4", "beides gleich"]
            answer: "eine 2 oder eine 4"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Vermutung: Rot kommt öfter als Blau."
            say: "Lena schaut sich das Glücksrad an. Drei Felder sind rot, eins ist blau. Sie vermutet: Rot kommt öfter als Blau. Das ist ihre Vermutung. Jetzt probiert sie es aus."
            show: { drawn: spinner, sectors: [red, red, blue, red] }
          - text: "Lena dreht 20-mal."
            say: "Lena dreht zwanzigmal und macht eine Strichliste. Rot kam fünfzehnmal, Blau fünfmal. Ihre Vermutung stimmt: Rot kam viel öfter."
            show: { drawn: bar-chart, tally: true, rows: [["Rot", 15], ["Blau", 5]] }
          - text: "Noch einmal 20-mal: Rot 13, Blau 7"
            say: "Lena dreht noch einmal zwanzigmal. Jetzt kommt Rot dreizehnmal und Blau siebenmal. Das ist nicht genau dasselbe. Ein Versuch geht jedes Mal ein bisschen anders aus. Aber wieder kommt Rot öfter."
            show: { drawn: bar-chart, tally: true, rows: [["Rot", 13], ["Blau", 7]] }
          - text: "4 Versuche sagen wenig.\n40 Versuche sagen mehr."
            say: "Mit nur vier Versuchen kann alles Mögliche herauskommen. Mit vielen Versuchen siehst du besser, was wahrscheinlich ist. Und noch etwas: Das Rad und die Münze haben kein Gedächtnis. Nach dreimal Kopf ist Zahl nicht wahrscheinlicher als vorher."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Vermutung passt zum Glücksrad?"
                say: "Tim will dieses Glücksrad zwanzigmal drehen. Welche Vermutung passt?"
                show: { drawn: spinner, sectors: [blue, yellow, blue, blue, yellow, blue] }
                options: ["Blau kommt öfter als Gelb.", "Gelb kommt öfter als Blau.", "Blau und Gelb kommen gleich oft."]
                answer: "Blau kommt öfter als Gelb."
                hints:
                  - "Zähl zuerst die Felder."
                  - "Blau hat 4 Felder, Gelb nur 2."
                  - "Blau kommt öfter als Gelb."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Rot 16, Blau 4. Mit welchem Glücksrad wurde gedreht?"
                say: "Sara hat zwanzigmal gedreht. Rot kam sechzehnmal, Blau viermal. Mit welchem Glücksrad hat sie wahrscheinlich gedreht?"
                options:
                  - { drawn: spinner, sectors: [red, blue, red, blue], key: "halb" }
                  - { drawn: spinner, sectors: [red, red, blue, red], key: "viel-rot" }
                  - { drawn: spinner, sectors: [blue, blue, red, blue], key: "viel-blau" }
                answer: "viel-rot"
                hints:
                  - "Welche Farbe kam viel öfter?"
                  - "Rot kam viel öfter. Das Rad hat also mehr rote Felder."
                  - "Das Rad mit drei roten Feldern und einem blauen."
              - id: l2-f3
                type: true_false
                text: "Ben vermutet: Gelb und Grün kommen etwa gleich oft. Passt das Ergebnis nach 20 Drehungen zur Vermutung?"
                say: "Ben vermutet: Gelb und Grün kommen etwa gleich oft. Er dreht zwanzigmal. Passt das Ergebnis zu seiner Vermutung?"
                show: { drawn: bar-chart, tally: true, rows: [["Gelb", 11], ["Grün", 9]] }
                answer: true
                hints:
                  - "Lies die Strichliste ab."
                  - "Gelb 11, Grün 9. Das ist fast gleich."
                  - "Ja, das passt."
              - id: l2-f4
                type: true_false
                text: "Kommt beim nächsten Mal sicher wieder genau 15-mal Rot?"
                say: "Lena hat zwanzigmal gedreht. Rot kam fünfzehnmal. Sie dreht noch einmal zwanzigmal. Kommt Rot sicher wieder genau fünfzehnmal?"
                show: { drawn: bar-chart, tally: true, rows: [["Rot", 15], ["Blau", 5]] }
                answer: false
                feedback:
                  "true": "Ein Versuch geht jedes Mal ein bisschen anders aus. Rot kommt wieder oft, aber nicht sicher genau 15-mal."
                hints:
                  - "Denk an Lenas zweiten Versuch."
                  - "Beim zweiten Mal kam Rot 13-mal, nicht 15-mal."
                  - "Nein. Es kann ein bisschen anders ausgehen."
              - id: l2-f5
                type: multiple_choice
                text: "Kopf, Kopf, Kopf. Was kommt beim nächsten Wurf?"
                say: "Mila wirft eine Münze. Dreimal hintereinander kam Kopf. Was stimmt für den nächsten Wurf?"
                options: ["Jetzt kommt sicher Zahl.", "Kopf und Zahl sind gleich wahrscheinlich.", "Jetzt kommt sicher wieder Kopf."]
                answer: "Kopf und Zahl sind gleich wahrscheinlich."
                feedback:
                  "Jetzt kommt sicher Zahl.": "Die Münze hat kein Gedächtnis. Sie weiß nicht, was vorher kam."
                hints:
                  - "Hat sich die Münze verändert?"
                  - "Die Münze hat immer noch eine Seite Kopf und eine Seite Zahl."
                  - "Kopf und Zahl sind wieder gleich wahrscheinlich."
              - id: l2-f6
                type: multiple_choice
                text: "Jonas wirft eine Münze 4-mal, Ella wirft dieselbe Münze 40-mal. Wessen Ergebnis zeigt besser, wie die Münze fällt?"
                say: "Zwei Kinder testen dieselbe Münze. Jonas wirft viermal, Ella wirft vierzigmal. Wessen Ergebnis zeigt besser, wie die Münze fällt?"
                options: ["Jonas mit 4 Würfen", "Ella mit 40 Würfen", "beide gleich gut"]
                answer: "Ella mit 40 Würfen"
                keep_order: true
                hints:
                  - "Bei wenigen Würfen kann viel Zufall dabei sein."
                  - "Mit vielen Würfen siehst du besser, was wahrscheinlich ist."
                  - "Ella mit 40 Würfen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Anna würfelt 30-mal: gerade oder ungerade Zahl? Welche Vermutung passt?"
