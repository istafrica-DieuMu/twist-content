            say: "Im Glas sind hundertfünfzig Gramm Nüsse. Wie viel Gramm fehlen bis zu einem Kilogramm?"
            options: ["850 g", "950 g", "150 g"]
            answer: "850 g"
          - id: l2-c15
            part: calc
