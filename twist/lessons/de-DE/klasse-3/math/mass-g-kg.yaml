# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.mass-g-kg
skill: math.mass-capacity.g-kg
curriculum: de-DE
language: de
title:
  de: Gramm und Kilogramm
  en: Grams and kilograms
summary: >
  Lesson 1 learns 1 kg = 1000 g, reads a kitchen scale from 0 to 1000 g
  in steps of 100 g (drawn as a number line with a pointer) and changes
  between kg and g (2 kg 300 g = 2300 g); lesson 2 reads a finer scale to 500 g
  (long ticks at the hundreds, a middle tick at 50 g more), fills up to 1 kg (700 g + 300 g), adds and compares weights in
  mixed units, and ends with the skill check. A round dial scale waits
  for a scale component.
metadata:
  year: klasse-3
  topic: { de: Gewichte, en: Mass }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mass-capacity.compare-mass, math.numbers-to-100.number-line]
  also_practises: [math.mass-capacity.compare-mass]
  vocabulary: { de: [Gramm, g, Kilogramm, kg, Waage, Skala, wiegen, ergänzen] }
  forms: [text, audio, drawn]
  drawn: [number-line]
  facets: [units]
  parts:
    - { id: read, what: { de: Gewichte an der Waage ablesen, en: reading a mass on a scale } }
    - { id: convert, what: { de: zwischen kg und g umrechnen, en: converting between kg and g } }
    - { id: calc, what: { de: mit Gewichten rechnen und bis 1 kg ergänzen, en: calculating with masses and making up to 1 kg } }
    - { id: compare, what: { de: Gewichte in g und kg vergleichen, en: comparing masses in g and kg } }
  misconceptions:
    - id: kg-as-hundred
      what: Thinks 1 kg = 100 g, or writes 2 kg 300 g as 230 g or 2030 g
      addressed: lesson 1 Learn builds 1500 g from 1000 g and 500 g; l1-f4 has feedback on 230 g and 2030 g, l1-s3, l1-n3 and l1-c3 offer the same mistakes, l2-n5 says 3000 g are 30 kg
    - id: number-not-unit
      what: Reads every long or middle tick as 100 g on a finer scale, or calls 900 g heavier than 1 kg because 900 is the bigger number
      addressed: lesson 2 Learn reads the middle tick as 50 g more; l2-f1 has feedback on counting every tick as 100 g, l2-f5 has feedback on 900 g, l2-s3, l2-n3 and l2-c5 compare mixed units
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "1 Kilogramm hat 1000 Gramm", en: "A kilogram is 1000 grams" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist schwerer?"
            say: "Was ist schwerer: ein Kürbis oder eine Kirsche?"
            options: ["ein Kürbis", "eine Kirsche"]
            answer: "ein Kürbis"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wo zeigt der Pfeil hin?"
            say: "Auf welche Zahl zeigt der Pfeil?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 70 }
            options: ["70", "7", "60"]
            answer: "70"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 kg = 1000 g"
            say: "Gewichte misst man in Gramm und Kilogramm. Ein Gramm ist sehr leicht, etwa so schwer wie eine Büroklammer. Ein Kilogramm ist so schwer wie eine Packung Mehl. Ein Kilogramm hat tausend Gramm."
          - text: "Die Waage zeigt 300 g."
            say: "Das ist die Skala einer Küchenwaage von null bis tausend Gramm. Von Strich zu Strich sind es hundert Gramm. Der längere Strich in der Mitte ist bei fünfhundert. Der Pfeil zeigt auf den dritten Strich nach der Null: dreihundert Gramm."
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 300 }
          - text: "2 kg = 2000 g\n1 kg 500 g = 1000 g + 500 g = 1500 g"
            say: "Zwei Kilogramm sind zweitausend Gramm. Ein Kilogramm und fünfhundert Gramm sind tausend Gramm und fünfhundert Gramm, zusammen tausendfünfhundert Gramm."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "1 kg = _ g"
                say: "Wie viele Gramm hat ein Kilogramm?"
                options: ["1000", "100", "10"]
                answer: "1000"
                hints:
                  - "Kilo heißt tausend."
                  - "Wie bei 1 km = 1000 m."
                  - "1000."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viel zeigt die Waage?"
                say: "Die Küchenwaage geht von null bis tausend Gramm. Wie viel zeigt sie?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 600 }
                options: ["600 g", "6 g", "500 g"]
                answer: "600 g"
                hints:
                  - "Von Strich zu Strich sind es 100 g."
                  - "Der längere Strich in der Mitte ist 500 g. Der Pfeil steht einen Strich weiter."
                  - "600 g."
              - id: l1-f3
                type: text_input
                text: "3 kg = _ g"
                say: "Wie viele Gramm sind drei Kilogramm?"
                answer: "3000"
                hints:
                  - "1 kg = 1000 g."
                  - "Dreimal 1000 g."
                  - "3000."
              - id: l1-f4
                type: multiple_choice
                text: "Der Sack Kartoffeln wiegt 2 kg 300 g. Wie viel Gramm sind das?"
                say: "Der Sack Kartoffeln wiegt zwei Kilogramm und dreihundert Gramm. Wie viel Gramm sind das?"
                options: ["2300 g", "2030 g", "230 g"]
                answer: "2300 g"
                feedback:
                  "230 g": "2 kg sind 2000 g, nicht 200 g."
                  "2030 g": "Zu den 2000 g kommen 300 g dazu, nicht 30 g."
                hints:
                  - "2 kg sind 2000 g."
                  - "2000 g + 300 g."
                  - "2300 g."
              - id: l1-f5
                type: multiple_choice
                text: "Was wiegt man in Kilogramm?"
                say: "Was wiegt man am besten in Kilogramm?"
                options: ["einen Hund", "eine Büroklammer", "ein Blatt Papier"]
                answer: "einen Hund"
                hints:
                  - "Kilogramm nimmt man für schwere Dinge."
                  - "Eine Büroklammer und ein Blatt sind sehr leicht."
                  - "Einen Hund."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viel zeigt die Waage?"
                say: "Die Küchenwaage geht von null bis tausend Gramm. Wie viel zeigt sie?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 200 }
                options: ["200 g", "2 g", "300 g"]
                answer: "200 g"
                hints: ["Von Strich zu Strich sind es 100 g."]
              - id: l1-s2
                type: text_input
                text: "5000 g = _ kg"
                say: "Wie viele Kilogramm sind fünftausend Gramm?"
                answer: "5"
                hints: ["1000 g sind 1 kg."]
              - id: l1-s3
                type: multiple_choice
                text: "Der Kürbis wiegt 1 kg 250 g. Wie viel Gramm sind das?"
                say: "Der Kürbis wiegt ein Kilogramm und zweihundertfünfzig Gramm. Wie viel Gramm sind das?"
                options: ["1250 g", "1025 g", "125 g"]
                answer: "1250 g"
                hints: ["1 kg sind 1000 g."]
              - id: l1-s4
                type: true_false
                text: "500 g sind mehr als 1 kg."
                say: "Stimmt das? Fünfhundert Gramm sind mehr als ein Kilogramm."
                answer: false
                hints: ["1 kg = 1000 g."]
              - id: l1-s5
                type: multiple_choice
                text: "Auf der Paketwaage liegt ein Paket. Wie viel zeigt sie?"
                say: "Auf der Paketwaage liegt ein Paket. Die Skala zeigt Kilogramm. Wie viel zeigt sie?"
                show: { drawn: number-line, from: 0, to: 10, labels: all, mark: 7 }
                options: ["7 kg", "7 g", "70 kg"]
                answer: "7 kg"
                hints: ["Auf dieser Skala stehen Kilogramm."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viel zeigt die Waage?"
                say: "Die Küchenwaage geht von null bis tausend Gramm. Wie viel zeigt sie?"
                show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 900 }
                options: ["900 g", "9 g", "800 g"]
                answer: "900 g"
              - id: l1-n2
                type: text_input
                text: "6 kg = _ g"
                say: "Wie viele Gramm sind sechs Kilogramm?"
                answer: "6000"
              - id: l1-n3
                type: multiple_choice
                text: "2500 g = _"
                say: "Zweitausendfünfhundert Gramm: Wie schreibst du das mit Kilogramm und Gramm?"
                options: ["2 kg 500 g", "25 kg", "2 kg 50 g"]
                answer: "2 kg 500 g"
              - id: l1-n4
                type: true_false
                text: "Eine Tafel Schokolade wiegt etwa 100 g."
                say: "Stimmt das? Eine Tafel Schokolade wiegt etwa hundert Gramm."
                answer: true
              - id: l1-n5
                type: text_input
                text: "Papa kauft 1 kg Äpfel und 500 g Kirschen. Wie viel Gramm sind das zusammen?"
                say: "Papa kauft ein Kilogramm Äpfel und fünfhundert Gramm Kirschen. Wie viel Gramm sind das zusammen?"
                answer: "1500"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viel zeigt die Waage?"
            say: "Die Küchenwaage geht von null bis tausend Gramm. Wie viel zeigt sie?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 400 }
            options: ["400 g", "4 g", "500 g"]
            answer: "400 g"
          - id: l1-c2
            type: text_input
            text: "4 kg = _ g"
            say: "Wie viele Gramm sind vier Kilogramm?"
            answer: "4000"
          - id: l1-c3
            type: multiple_choice
            text: "Die Wassermelone wiegt 1 kg 600 g. Wie viel Gramm sind das?"
            say: "Die Wassermelone wiegt ein Kilogramm und sechshundert Gramm. Wie viel Gramm sind das?"
            options: ["1600 g", "1060 g", "160 g"]
            answer: "1600 g"
          - id: l1-c4
            type: multiple_choice
            text: "Wie viel zeigt die Waage?"
            say: "Die Küchenwaage geht von null bis tausend Gramm. Wie viel zeigt sie?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 500 }
            options: ["500 g", "5 g", "400 g"]
            answer: "500 g"
          - id: l1-c5
            type: true_false
            text: "3 kg 400 g = 3400 g"
            say: "Stimmt das? Drei Kilogramm und vierhundert Gramm sind dreitausendvierhundert Gramm."
            answer: true
          - id: l1-c6
            type: text_input
            text: "8000 g = _ kg"
            say: "Wie viele Kilogramm sind achttausend Gramm?"
            answer: "8"

  - n: 2
    title: { de: "Waagen ablesen und rechnen", en: "Reading scales and calculating" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "2 kg = _ g"
            say: "Wie viele Gramm sind zwei Kilogramm?"
            answer: "2000"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viel zeigt die Waage?"
            say: "Die Küchenwaage geht von null bis tausend Gramm. Wie viel zeigt sie?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 700 }
            options: ["700 g", "7 g", "600 g"]
            answer: "700 g"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Diese Waage zeigt 350 g."
            say: "Diese Waage geht nur bis fünfhundert Gramm und hat viel mehr Striche. Die langen Striche sind hundert, zweihundert, dreihundert und vierhundert Gramm. Der mittlere Strich liegt genau dazwischen, bei fünfzig Gramm mehr. Der Pfeil steht am mittleren Strich nach dreihundert: dreihundertfünfzig Gramm."
            show: { drawn: number-line, from: 0, to: 500, step: 10, labels: ends, mark: 350 }
          - text: "700 g + _ = 1 kg\n700 g + 300 g = 1000 g = 1 kg"
            say: "Im Glas sind siebenhundert Gramm Mehl. Wie viel fehlt bis zu einem Kilogramm? Ergänze bis tausend Gramm: Es fehlen dreihundert Gramm."
          - text: "1 kg 200 g + 500 g\n= 1200 g + 500 g = 1700 g"
            say: "Ein Brot wiegt ein Kilogramm und zweihundert Gramm, ein Käse fünfhundert Gramm. Schreib beides in Gramm, dann rechne: tausendzweihundert plus fünfhundert sind tausendsiebenhundert Gramm."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viel zeigt die Waage?"
                say: "Die Waage geht von null bis fünfhundert Gramm. Wie viel zeigt sie?"
                show: { drawn: number-line, from: 0, to: 500, step: 10, labels: ends, mark: 150 }
                options: ["150 g", "300 g", "15 g"]
                answer: "150 g"
                feedback:
                  "300 g": "Nur die langen Striche sind ganze Hunderter. Der mittlere Strich liegt bei 50 g dazwischen."
                hints:
                  - "Die langen Striche sind 100 g, 200 g, 300 g und 400 g."
                  - "Der Pfeil steht am mittleren Strich nach 100 g: 50 g mehr."
                  - "150 g."
              - id: l2-f2
                type: text_input
                text: "800 g + _ g = 1 kg"
                say: "Achthundert Gramm und wie viel Gramm sind ein Kilogramm?"
                answer: "200"
                hints:
                  - "1 kg = 1000 g."
                  - "Ergänze 800 bis 1000."
                  - "200."
              - id: l2-f3
                type: multiple_choice
                text: "Ein Brot wiegt 750 g, ein Kuchen 500 g. Wie schwer sind beide zusammen?"
                say: "Ein Brot wiegt siebenhundertfünfzig Gramm, ein Kuchen fünfhundert Gramm. Wie schwer sind beide zusammen?"
                options: ["1250 g", "1205 g", "1150 g"]
                answer: "1250 g"
                hints:
                  - "Rechne 750 g + 500 g."
                  - "750 + 250 = 1000, dann noch 250."
                  - "1250 g."
              - id: l2-f4
                type: true_false
                text: "Die Waage zeigt 450 g."
                say: "Die Waage geht von null bis fünfhundert Gramm. Stimmt das: Sie zeigt vierhundertfünfzig Gramm?"
                show: { drawn: number-line, from: 0, to: 500, step: 10, labels: ends, mark: 450 }
                answer: true
                hints:
                  - "Der letzte lange Strich vor dem Ende ist 400 g."
                  - "Der Pfeil steht am mittleren Strich zwischen 400 g und 500 g."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Was ist schwerer: 1 kg oder 900 g?"
                say: "Was ist schwerer: ein Kilogramm oder neunhundert Gramm?"
                options: ["1 kg", "900 g", "beide gleich schwer"]
                answer: "1 kg"
                feedback:
                  "900 g": "900 ist die größere Zahl, aber 1 kg sind 1000 g."
                hints:
                  - "Schreib beides in Gramm."
                  - "1 kg = 1000 g."
                  - "1 kg."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viel zeigt die Waage?"
                say: "Die Waage geht von null bis fünfhundert Gramm. Wie viel zeigt sie?"
                show: { drawn: number-line, from: 0, to: 500, step: 10, labels: ends, mark: 200 }
                options: ["200 g", "400 g", "20 g"]
                answer: "200 g"
                hints: ["Zähl die langen Striche: 100 g, 200 g."]
              - id: l2-s2
                type: text_input
                text: "350 g + _ g = 1 kg"
                say: "Dreihundertfünfzig Gramm und wie viel Gramm sind ein Kilogramm?"
                answer: "650"
                hints: ["Ergänze bis 1000 g."]
              - id: l2-s3
                type: multiple_choice
                text: "Was ist schwerer: 2 kg oder 1500 g?"
                say: "Was ist schwerer: zwei Kilogramm oder tausendfünfhundert Gramm?"
                options: ["2 kg", "1500 g", "beide gleich schwer"]
                answer: "2 kg"
                hints: ["2 kg = 2000 g."]
              - id: l2-s4
                type: true_false
                text: "1 kg 50 g = 1050 g"
                say: "Stimmt das? Ein Kilogramm und fünfzig Gramm sind tausendfünfzig Gramm."
                answer: true
                hints: ["1 kg sind 1000 g."]
              - id: l2-s5
                type: text_input
                text: "Ein Paket wiegt 2 kg 400 g, ein zweites 1 kg 300 g. Wie viel Gramm wiegen beide zusammen?"
                say: "Ein Paket wiegt zwei Kilogramm und vierhundert Gramm, ein zweites ein Kilogramm und dreihundert Gramm. Wie viel Gramm wiegen beide zusammen?"
                answer: "3700"
                hints: ["Rechne alles in Gramm: 2400 g + 1300 g."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viel zeigt die Waage?"
                say: "Die Waage geht von null bis fünfhundert Gramm. Wie viel zeigt sie?"
                show: { drawn: number-line, from: 0, to: 500, step: 10, labels: ends, mark: 300 }
                options: ["300 g", "600 g", "30 g"]
                answer: "300 g"
              - id: l2-n2
                type: text_input
                text: "450 g + _ g = 1 kg"
                say: "Vierhundertfünfzig Gramm und wie viel Gramm sind ein Kilogramm?"
                answer: "550"
              - id: l2-n3
                type: multiple_choice
                text: "Was ist leichter: 800 g oder 1 kg?"
                say: "Was ist leichter: achthundert Gramm oder ein Kilogramm?"
                options: ["800 g", "1 kg", "beide gleich schwer"]
                answer: "800 g"
              - id: l2-n4
                type: text_input
                text: "Eine Packung Mehl wiegt 1 kg. Lisa nimmt 250 g für einen Kuchen. Wie viel Gramm sind noch in der Packung?"
                say: "Eine Packung Mehl wiegt ein Kilogramm. Lisa nimmt zweihundertfünfzig Gramm für einen Kuchen. Wie viel Gramm sind noch in der Packung?"
                answer: "750"
              - id: l2-n5
                type: true_false
                text: "3000 g sind 30 kg."
                say: "Stimmt das? Dreitausend Gramm sind dreißig Kilogramm."
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "Wie viel zeigt die Waage?"
            say: "Die Küchenwaage geht von null bis tausend Gramm. Wie viel zeigt sie?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 800 }
            options: ["800 g", "8 g", "700 g"]
            answer: "800 g"
          - id: l2-c2
            part: read
            type: multiple_choice
            text: "Wie viel zeigt die Waage?"
            say: "Die Waage geht von null bis fünfhundert Gramm. Wie viel zeigt sie?"
            show: { drawn: number-line, from: 0, to: 500, step: 10, labels: ends, mark: 250 }
            options: ["250 g", "500 g", "25 g"]
            answer: "250 g"
          - id: l2-c3
            part: convert
            type: text_input
            text: "3 kg 200 g = _ g"
            say: "Wie viele Gramm sind drei Kilogramm und zweihundert Gramm?"
            answer: "3200"
          - id: l2-c4
            part: calc
            type: text_input
            text: "600 g + _ g = 1 kg"
            say: "Sechshundert Gramm und wie viel Gramm sind ein Kilogramm?"
            answer: "400"
          - id: l2-c5
            part: compare
            type: multiple_choice
            text: "Was ist schwerer: 1 kg 100 g oder 1010 g?"
            say: "Was ist schwerer: ein Kilogramm und hundert Gramm oder tausendzehn Gramm?"
            options: ["1 kg 100 g", "1010 g", "beide gleich schwer"]
            answer: "1 kg 100 g"
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "Wie viel zeigt die Waage?"
            say: "Die Küchenwaage geht von null bis tausend Gramm. Wie viel zeigt sie?"
            show: { drawn: number-line, from: 0, to: 1000, step: 100, labels: ends, mark: 100 }
            options: ["100 g", "10 g", "200 g"]
            answer: "100 g"
          - id: l2-c7
            part: read
            type: multiple_choice
            text: "Wie viel zeigt die Waage?"
            say: "Die Waage geht von null bis fünfhundert Gramm. Wie viel zeigt sie?"
            show: { drawn: number-line, from: 0, to: 500, step: 10, labels: ends, mark: 50 }
            options: ["50 g", "100 g", "5 g"]
            answer: "50 g"
          - id: l2-c8
            part: read
            type: text_input
            text: "Wie viel Gramm zeigt die Waage?"
            say: "Die Waage geht von null bis fünfhundert Gramm. Wie viel Gramm zeigt sie?"
            show: { drawn: number-line, from: 0, to: 500, step: 10, labels: ends, mark: 400 }
            answer: "400"
          - id: l2-c9
            part: convert
            type: text_input
            text: "7 kg = _ g"
            say: "Wie viele Gramm sind sieben Kilogramm?"
            answer: "7000"
          - id: l2-c10
            part: convert
            type: multiple_choice
            text: "4300 g = _"
            say: "Viertausenddreihundert Gramm: Wie schreibst du das mit Kilogramm und Gramm?"
            options: ["4 kg 300 g", "43 kg", "4 kg 30 g"]
