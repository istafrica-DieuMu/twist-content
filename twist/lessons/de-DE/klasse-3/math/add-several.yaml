          - id: l1-c3
            type: multiple_choice
            text: "Was rechnest du bei den Einern?"
            say: "Dreihundertneun plus hundertsechsundzwanzig plus zweihundertachtzehn. Was rechnest du bei den Einern?"
            show: { drawn: written-calc, rows: ["309", "126", "218"], op: "+" }
            options: ["9 + 6 + 8", "9 + 6", "3 + 1 + 2"]
            answer: "9 + 6 + 8"
          - id: l1-c4
            type: fill_in_blank
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: hunderteinunddreißig plus vierhundertzwei plus zweihundertfünfundzwanzig. Schreib die Ziffern für die Einer, die Zehner und die Hunderter."
            show: { drawn: written-calc, rows: ["131", "402", "225"], op: "+", result: "___" }
            frame: "E: _  Z: _  H: _"
            options: ["8", "5", "7", "6"]
            answer: ["8", "5", "7"]
          - id: l1-c5
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: zweihundertsechsundfünfzig plus hundertachtzehn plus dreihundertdreiundzwanzig."
            show: { drawn: written-calc, rows: ["256", "118", "323"], op: "+" }
            answer: "697"
          - id: l1-c6
            type: true_false
            text: "Stimmt die Rechnung?"
            say: "Prüf die Rechnung. Stimmt sie?"
            show: { drawn: written-calc, rows: ["147", "220", "312"], op: "+", result: "679" }
            answer: true

  - n: 2
    title: { de: Kürzere Zahlen und Übertrag 2, en: Different lengths and carrying 2 }
    goal:
      de: "Rechne drei verschieden lange Zahlen schriftlich zusammen. Manchmal überträgst du sogar eine 2."
      en: "Add three numbers of different lengths in columns. Sometimes you even carry a 2."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: hundertdreizehn plus zweihundertvierundzwanzig plus dreihundertzweiundfünfzig."
            show: { drawn: written-calc, rows: ["113", "224", "352"], op: "+" }
            answer: "689"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "9 + 8 + 6 = _"
            say: "Neun plus acht plus sechs."
            answer: "23"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "325 + 48 + 106"
            say: "Dreihundertfünfundzwanzig plus achtundvierzig plus hundertsechs. Die Achtundvierzig ist kürzer: Die Acht steht unter den Einern, die Vier unter den Zehnern."
            show: { drawn: written-calc, rows: ["325", "48", "106"], op: "+" }
          - text: "5 + 8 + 6 = 19 → Schreib 9, übertrag 1."
            say: "Einer: fünf plus acht plus sechs ist neunzehn. Neun schreibst du hin, eins überträgst du. Zehner: zwei plus vier plus null plus eins ist sieben. Hunderter: drei plus eins ist vier. Das Ergebnis ist vierhundertneunundsiebzig."
            show: { drawn: written-calc, rows: ["325", "48", "106"], op: "+", carry: " 1 ", result: "479" }
          - text: "9 + 8 + 6 = 23 → Schreib 3, übertrag 2."
            say: "Bei drei Zahlen kann eine Spalte zwanzig oder mehr ergeben. Neun plus acht plus sechs ist dreiundzwanzig. Drei schreibst du hin, zwei überträgst du. Dann ist der Übertrag eine Zwei."
            show: { drawn: written-calc, rows: ["149", "28", "216"], op: "+", carry: " 2 ", result: "393" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Welche Rechnung steht richtig untereinander?"
                say: "Hier soll zweihundertsiebzehn plus sechsunddreißig plus hundertfünf stehen. Welche Rechnung ist richtig untereinander geschrieben?"
                options: [{ drawn: written-calc, rows: ["217", "36", "105"], op: "+" }, { drawn: written-calc, rows: ["217", "36 ", "105"], op: "+" }]
                answer: "217|36|105"
                feedback:
                  "217|36 |105": "Hier steht die Sechs unter den Zehnern. Einer müssen unter Einern stehen."
                hints:
                  - "Wo müssen die Einer von sechsunddreißig stehen?"
                  - "Ganz rechts, unter der Sieben."
                  - "Die Rechnung, bei der 36 rechts steht."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Einer: 7 + 9 + 8. Was schreibst du?"
                say: "Bei den Einern rechnest du sieben plus neun plus acht. Was schreibst du hin, und was überträgst du?"
                options: ["4, Übertrag 2", "4, Übertrag 1", "24"]
                answer: "4, Übertrag 2"
                feedback:
                  "4, Übertrag 1": "Sieben plus neun plus acht ist vierundzwanzig: zwei Zehner. Der Übertrag ist zwei."
                hints:
                  - "Sieben plus neun plus acht ist vierundzwanzig."
                  - "Vierundzwanzig sind zwei Zehner und vier Einer."
                  - "Schreib 4, übertrag 2."
              - id: l2-f3
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihundertsiebzehn plus sechsunddreißig plus hundertfünf."
                show: { drawn: written-calc, rows: ["217", "36", "105"], op: "+" }
                answer: "358"
                hints:
                  - "Einer: sieben plus sechs plus fünf ist achtzehn: Schreib acht, übertrag eins."
                  - "Zehner: eins plus drei plus null plus eins."
                  - "358."
              - id: l2-f4
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertsiebenundsechzig plus neunundachtzig plus zweihundertachtundfünfzig."
                show: { drawn: written-calc, rows: ["167", "89", "258"], op: "+" }
                answer: "514"
                hints:
                  - "Einer: sieben plus neun plus acht ist vierundzwanzig: Schreib vier, übertrag zwei."
                  - "Zehner: sechs plus acht plus fünf plus zwei ist einundzwanzig: Schreib eins, übertrag zwei."
                  - "514."
              - id: l2-f5
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["402", "57", "131"], op: "+", result: "590" }
                answer: true
                hints:
                  - "Einer: zwei plus sieben plus eins ist zehn."
                  - "Schreib null, übertrag eins. Zehner: null plus fünf plus drei plus eins."
                  - "Ja, 590."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Welche Rechnung steht richtig untereinander?"
                say: "Hier soll vierhundertzwanzig plus dreiundfünfzig plus hundertacht stehen. Welche Rechnung ist richtig untereinander geschrieben?"
                options: [{ drawn: written-calc, rows: ["420", "53 ", "108"], op: "+" }, { drawn: written-calc, rows: ["420", "53", "108"], op: "+" }]
                answer: "420|53|108"
                hints: ["Einer unter Einer."]
              - id: l2-s2
