# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.add-several
skill: math.written-add-sub.add-several
curriculum: de-DE
language: de
title:
  de: Mehrere Zahlen schriftlich addieren
  en: Adding several numbers in columns
summary: >
  Adding three numbers in columns, also with different numbers of digits,
  where a column can make 20 or more and carry a 2. Lesson 1 adds three
  three-digit numbers; lesson 2 mixes lengths (325 + 48 + 106), carries 2,
  and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.add-carry]
  also_practises: [math.written-add-sub.add-no-carry]
  vocabulary: { de: [Übertrag, Summand, stellengerecht, schriftlich addieren] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  parts:
    - { id: three, what: { de: drei dreistellige Zahlen schriftlich addieren, en: adding three three-digit numbers in columns } }
    - { id: lengths, what: { de: Zahlen mit verschieden vielen Stellen stellengerecht addieren, en: "adding numbers with different numbers of digits, lined up by place value" } }
    - { id: carry-2, what: { de: mit einem Übertrag von 2 rechnen, en: carrying a 2 } }
    - { id: check, what: { de: Rechnungen prüfen und Fehler finden, en: checking calculations and finding mistakes } }
  misconceptions:
    - id: carry-always-one
      what: Carries 1 even when a column makes 20 or more
      addressed: lesson 2 Learn carries 2 from a column of 23; options include the carry of 1, with feedback in the full stage
    - id: misplace-short-number
      what: Writes the short number under the wrong places
      addressed: lesson 2 Learn lines up 48 under the Zehner and Einer; one task in each stage of lesson 2 checks alignment
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Drei Zahlen untereinander, en: Three numbers in columns }
    goal:
      de: "Schreib drei Zahlen untereinander und rechne sie schriftlich zusammen, so wie 213 + 142 + 321."
      en: "Write three numbers under each other and add them in columns, like 213 + 142 + 321."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: zweihundertsechsundvierzig plus dreihundertachtunddreißig."
            show: { drawn: written-calc, rows: ["246", "338"], op: "+" }
            answer: "584"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "4 + 3 + 5 = _"
            say: "Vier plus drei plus fünf."
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "213 + 142 + 321"
            say: "Auch drei Zahlen kannst du untereinander schreiben. Einer unter Einer, Zehner unter Zehner, Hunderter unter Hunderter."
            show: { drawn: written-calc, rows: ["213", "142", "321"], op: "+" }
          - text: "3 + 2 + 1 = 6"
            say: "Fang bei den Einern an und rechne alle drei zusammen: drei plus zwei plus eins ist sechs."
            show: { drawn: written-calc, rows: ["213", "142", "321"], op: "+", result: "__6" }
          - text: "1 + 4 + 2 = 7 | 2 + 1 + 3 = 6"
            say: "Zehner: eins plus vier plus zwei ist sieben. Hunderter: zwei plus eins plus drei ist sechs. Das Ergebnis ist sechshundertsechsundsiebzig."
            show: { drawn: written-calc, rows: ["213", "142", "321"], op: "+", result: "676" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an. Rechne alle drei Zahlen zusammen."
                show: { drawn: written-calc, rows: ["121", "234", "312"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["7", "6", "5", "8"]
                answer: ["7", "6", "6"]
                hints:
                  - "Einer: eins plus vier plus zwei."
                  - "Zehner: zwei plus drei plus eins. Hunderter: eins plus zwei plus drei."
                  - "E: 7, Z: 6, H: 6. Das ist 667."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertsechsundzwanzig plus zweihundertsiebzehn plus dreihundertvierzig."
                show: { drawn: written-calc, rows: ["126", "217", "340"], op: "+" }
                answer: "683"
                hints:
                  - "Einer: sechs plus sieben plus null ist dreizehn: Schreib drei, übertrag eins."
                  - "Zehner: zwei plus eins plus vier plus eins."
                  - "683."
              - id: l1-f3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["205", "134", "410"], op: "+", result: "749" }
                answer: true
                hints:
                  - "Rechne jede Stelle mit allen drei Zahlen."
                  - "Fünf plus vier plus null ist neun."
                  - "Ja, 749."
              - id: l1-f4
                type: multiple_choice
                text: "Was rechnest du bei den Einern?"
                say: "Zweihundertachtundvierzig plus hundertfünfunddreißig plus dreihundertvier. Was rechnest du bei den Einern?"
                show: { drawn: written-calc, rows: ["248", "135", "304"], op: "+" }
                options: ["8 + 5 + 4", "8 + 5", "2 + 1 + 3"]
                answer: "8 + 5 + 4"
                hints:
                  - "Bei den Einern stehen drei Ziffern."
                  - "Acht, fünf und vier."
                  - "8 + 5 + 4."
              - id: l1-f5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihundertachtundvierzig plus hundertfünfunddreißig plus dreihundertvier."
                show: { drawn: written-calc, rows: ["248", "135", "304"], op: "+" }
                answer: "687"
                hints:
                  - "Einer: acht plus fünf plus vier ist siebzehn."
                  - "Schreib sieben, übertrag eins. Zehner: vier plus drei plus null plus eins."
                  - "687."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an. Rechne alle drei Zahlen zusammen."
                show: { drawn: written-calc, rows: ["302", "215", "171"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["8", "6", "9", "7"]
                answer: ["8", "8", "6"]
                hints: ["Rechne in jeder Spalte alle drei Ziffern."]
              - id: l1-s2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertneunzehn plus zweihundertvierundzwanzig plus hundertdreißig."
                show: { drawn: written-calc, rows: ["119", "224", "130"], op: "+" }
                answer: "473"
                hints: ["Einer: neun plus vier plus null."]
              - id: l1-s3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["312", "245", "131"], op: "+", result: "678" }
                answer: false
                hints: ["Prüf jede Stelle mit allen drei Zahlen."]
              - id: l1-s4
                type: multiple_choice
                text: "Was rechnest du bei den Zehnern?"
                say: "Hundertvierundfünfzig plus dreihundertdreiundzwanzig plus zweihundertzwölf. Was rechnest du bei den Zehnern?"
                show: { drawn: written-calc, rows: ["154", "323", "212"], op: "+" }
                options: ["5 + 2 + 1", "5 + 2", "4 + 3 + 2"]
                answer: "5 + 2 + 1"
                hints: ["Die Zehner stehen in der Mitte."]
              - id: l1-s5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihundertsechsundsechzig plus hundertsiebenundzwanzig plus vierhundertfünf."
                show: { drawn: written-calc, rows: ["266", "127", "405"], op: "+" }
                answer: "798"
                hints: ["Achte auf den Übertrag."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihunderteinundvierzig plus hundertdrei plus dreihundertzweiundzwanzig. Schreib die Ziffern für die Einer, die Zehner und die Hunderter."
                show: { drawn: written-calc, rows: ["241", "103", "322"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["6", "7", "5", "8"]
                answer: ["6", "6", "6"]
              - id: l1-n2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: dreihundertachtunddreißig plus hundertvierundvierzig plus zweihundertsechs."
                show: { drawn: written-calc, rows: ["338", "144", "206"], op: "+" }
                answer: "688"
              - id: l1-n3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["156", "218", "304"], op: "+", result: "678" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Was rechnest du bei den Hundertern?"
                say: "Dreihundertzwölf plus hundertfünfundvierzig plus zweihundertdreißig. Was rechnest du bei den Hundertern?"
                show: { drawn: written-calc, rows: ["312", "145", "230"], op: "+" }
                options: ["3 + 1 + 2", "3 + 1", "2 + 5 + 0"]
                answer: "3 + 1 + 2"
              - id: l1-n5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertsiebenundsechzig plus zweihundertfünfundvierzig plus hundertzwölf."
                show: { drawn: written-calc, rows: ["167", "245", "112"], op: "+" }
                answer: "524"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: zweihundertzwölf plus hundertsechsunddreißig plus vierhunderteinundvierzig."
