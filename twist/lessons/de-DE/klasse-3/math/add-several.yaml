# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.add-several
skill: math.written-add-sub.add-several
curriculum: de-DE
language: de
title:
  de: Mehrere Zahlen schriftlich addieren
  en: Adding several numbers in columns
summary: >
  Adding three numbers in columns, also with different numbers of digits,
  where a column can make 20 or more and carry a 2. Lesson 1 adds three
  three-digit numbers; lesson 2 mixes lengths (325 + 48 + 106), carries 2,
  and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.add-carry]
  also_practises: [math.written-add-sub.add-no-carry]
  vocabulary: { de: [Übertrag, Summand, stellengerecht, schriftlich addieren] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: []
  misconceptions:
    - id: carry-always-one
      what: Carries 1 even when a column makes 20 or more
      addressed: lesson 2 Learn carries 2 from a column of 23; options include the carry of 1, with feedback in the full stage
    - id: misplace-short-number
      what: Writes the short number under the wrong places
      addressed: lesson 2 Learn lines up 48 under the Zehner and Einer; one task in each stage of lesson 2 checks alignment
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Drei Zahlen untereinander, en: Three numbers in columns }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: zweihundertsechsundvierzig plus dreihundertachtunddreißig."
            show: { drawn: written-calc, rows: ["246", "338"], op: "+" }
            answer: "584"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "4 + 3 + 5 = _"
            say: "Vier plus drei plus fünf."
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "213 + 142 + 321"
            say: "Auch drei Zahlen kannst du untereinander schreiben. Einer unter Einer, Zehner unter Zehner, Hunderter unter Hunderter."
            show: { drawn: written-calc, rows: ["213", "142", "321"], op: "+" }
          - text: "3 + 2 + 1 = 6"
            say: "Fang bei den Einern an und rechne alle drei zusammen: drei plus zwei plus eins ist sechs."
            show: { drawn: written-calc, rows: ["213", "142", "321"], op: "+", result: "__6" }
          - text: "1 + 4 + 2 = 7 | 2 + 1 + 3 = 6"
            say: "Zehner: eins plus vier plus zwei ist sieben. Hunderter: zwei plus eins plus drei ist sechs. Das Ergebnis ist sechshundertsechsundsiebzig."
            show: { drawn: written-calc, rows: ["213", "142", "321"], op: "+", result: "676" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an. Rechne alle drei Zahlen zusammen."
                show: { drawn: written-calc, rows: ["121", "234", "312"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["7", "6", "5", "8"]
                answer: ["7", "6", "6"]
                hints:
                  - "Einer: eins plus vier plus zwei."
                  - "Zehner: zwei plus drei plus eins. Hunderter: eins plus zwei plus drei."
                  - "E: 7, Z: 6, H: 6. Das ist 667."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertsechsundzwanzig plus zweihundertsiebzehn plus dreihundertvierzig."
                show: { drawn: written-calc, rows: ["126", "217", "340"], op: "+" }
                answer: "683"
                hints:
                  - "Einer: sechs plus sieben plus null ist dreizehn: Schreib drei, übertrag eins."
                  - "Zehner: zwei plus eins plus vier plus eins."
                  - "683."
              - id: l1-f3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["205", "134", "410"], op: "+", result: "749" }
                answer: true
                hints:
                  - "Rechne jede Stelle mit allen drei Zahlen."
                  - "Fünf plus vier plus null ist neun."
                  - "Ja, 749."
              - id: l1-f4
                type: multiple_choice
                text: "Was rechnest du bei den Einern?"
                say: "Zweihundertachtundvierzig plus hundertfünfunddreißig plus dreihundertvier. Was rechnest du bei den Einern?"
                show: { drawn: written-calc, rows: ["248", "135", "304"], op: "+" }
                options: ["8 + 5 + 4", "8 + 5", "2 + 1 + 3"]
                answer: "8 + 5 + 4"
                hints:
                  - "Bei den Einern stehen drei Ziffern."
                  - "Acht, fünf und vier."
                  - "8 + 5 + 4."
              - id: l1-f5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihundertachtundvierzig plus hundertfünfunddreißig plus dreihundertvier."
                show: { drawn: written-calc, rows: ["248", "135", "304"], op: "+" }
                answer: "687"
                hints:
                  - "Einer: acht plus fünf plus vier ist siebzehn."
                  - "Schreib sieben, übertrag eins. Zehner: vier plus drei plus null plus eins."
                  - "687."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an. Rechne alle drei Zahlen zusammen."
                show: { drawn: written-calc, rows: ["302", "215", "171"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["8", "6", "9", "7"]
                answer: ["8", "8", "6"]
                hints: ["Rechne in jeder Spalte alle drei Ziffern."]
              - id: l1-s2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertneunzehn plus zweihundertvierundzwanzig plus hundertdreißig."
                show: { drawn: written-calc, rows: ["119", "224", "130"], op: "+" }
                answer: "473"
                hints: ["Einer: neun plus vier plus null."]
              - id: l1-s3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["312", "245", "131"], op: "+", result: "678" }
                answer: false
                hints: ["Prüf jede Stelle mit allen drei Zahlen."]
              - id: l1-s4
                type: multiple_choice
                text: "Was rechnest du bei den Zehnern?"
                say: "Hundertvierundfünfzig plus dreihundertdreiundzwanzig plus zweihundertzwölf. Was rechnest du bei den Zehnern?"
                show: { drawn: written-calc, rows: ["154", "323", "212"], op: "+" }
                options: ["5 + 2 + 1", "5 + 2", "4 + 3 + 2"]
                answer: "5 + 2 + 1"
                hints: ["Die Zehner stehen in der Mitte."]
              - id: l1-s5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihundertsechsundsechzig plus hundertsiebenundzwanzig plus vierhundertfünf."
                show: { drawn: written-calc, rows: ["266", "127", "405"], op: "+" }
                answer: "798"
                hints: ["Achte auf den Übertrag."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne schriftlich."
                say: "Fang bei den Einern an. Rechne alle drei Zahlen zusammen."
                show: { drawn: written-calc, rows: ["241", "103", "322"], op: "+", result: "___" }
                frame: "E: _  Z: _  H: _"
                options: ["6", "7", "5", "8"]
                answer: ["6", "6", "6"]
              - id: l1-n2
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: dreihundertachtunddreißig plus hundertvierundvierzig plus zweihundertsechs."
                show: { drawn: written-calc, rows: ["338", "144", "206"], op: "+" }
                answer: "688"
              - id: l1-n3
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["156", "218", "304"], op: "+", result: "678" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Was rechnest du bei den Hundertern?"
                say: "Dreihundertzwölf plus hundertfünfundvierzig plus zweihundertdreißig. Was rechnest du bei den Hundertern?"
                show: { drawn: written-calc, rows: ["312", "145", "230"], op: "+" }
                options: ["3 + 1 + 2", "3 + 1", "2 + 5 + 0"]
                answer: "3 + 1 + 2"
              - id: l1-n5
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertsiebenundsechzig plus zweihundertfünfundvierzig plus hundertzwölf."
                show: { drawn: written-calc, rows: ["167", "245", "112"], op: "+" }
                answer: "524"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: zweihundertzwölf plus hundertsechsunddreißig plus vierhunderteinundvierzig."
            show: { drawn: written-calc, rows: ["212", "136", "441"], op: "+" }
            answer: "789"
          - id: l1-c2
            type: true_false
            text: "Stimmt die Rechnung?"
            say: "Prüf die Rechnung. Stimmt sie?"
            show: { drawn: written-calc, rows: ["123", "234", "345"], op: "+", result: "692" }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was rechnest du bei den Einern?"
            say: "Dreihundertneun plus hundertsechsundzwanzig plus zweihundertachtzehn. Was rechnest du bei den Einern?"
            show: { drawn: written-calc, rows: ["309", "126", "218"], op: "+" }
            options: ["9 + 6 + 8", "9 + 6", "3 + 1 + 2"]
            answer: "9 + 6 + 8"

  - n: 2
    title: { de: Kürzere Zahlen und Übertrag 2, en: Different lengths and carrying 2 }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: hundertdreizehn plus zweihundertvierundzwanzig plus dreihundertzweiundfünfzig."
            show: { drawn: written-calc, rows: ["113", "224", "352"], op: "+" }
            answer: "689"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "9 + 8 + 6 = _"
            say: "Neun plus acht plus sechs."
            answer: "23"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "325 + 48 + 106"
            say: "Dreihundertfünfundzwanzig plus achtundvierzig plus hundertsechs. Die Achtundvierzig ist kürzer: Die Acht steht unter den Einern, die Vier unter den Zehnern."
            show: { drawn: written-calc, rows: ["325", "48", "106"], op: "+" }
          - text: "5 + 8 + 6 = 19 → Schreib 9, übertrag 1."
            say: "Einer: fünf plus acht plus sechs ist neunzehn. Neun schreibst du hin, eins überträgst du. Zehner: zwei plus vier plus null plus eins ist sieben. Hunderter: drei plus eins ist vier. Das Ergebnis ist vierhundertneunundsiebzig."
            show: { drawn: written-calc, rows: ["325", "48", "106"], op: "+", carry: " 1 ", result: "479" }
          - text: "9 + 8 + 6 = 23 → Schreib 3, übertrag 2."
            say: "Bei drei Zahlen kann eine Spalte zwanzig oder mehr ergeben. Neun plus acht plus sechs ist dreiundzwanzig. Drei schreibst du hin, zwei überträgst du. Dann ist der Übertrag eine Zwei."
            show: { drawn: written-calc, rows: ["149", "28", "216"], op: "+", carry: " 2 ", result: "393" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Welche Rechnung steht richtig untereinander?"
                say: "Hier soll zweihundertsiebzehn plus sechsunddreißig plus hundertfünf stehen. Welche Rechnung ist richtig untereinander geschrieben?"
                options: [{ drawn: written-calc, rows: ["217", "36", "105"], op: "+" }, { drawn: written-calc, rows: ["217", "36 ", "105"], op: "+" }]
                answer: "217|36|105"
                feedback:
                  "217|36 |105": "Hier steht die Sechs unter den Zehnern. Einer müssen unter Einern stehen."
                hints:
                  - "Wo müssen die Einer von sechsunddreißig stehen?"
                  - "Ganz rechts, unter der Sieben."
                  - "Die Rechnung, bei der 36 rechts steht."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was schreibst du bei den Einern?"
                say: "Bei den Einern rechnest du sieben plus neun plus acht. Was schreibst du hin, und was überträgst du?"
                options: ["4, Übertrag 2", "4, Übertrag 1", "24"]
                answer: "4, Übertrag 2"
                feedback:
                  "4, Übertrag 1": "Sieben plus neun plus acht ist vierundzwanzig: zwei Zehner. Der Übertrag ist zwei."
                hints:
                  - "Sieben plus neun plus acht ist vierundzwanzig."
                  - "Vierundzwanzig sind zwei Zehner und vier Einer."
                  - "Schreib 4, übertrag 2."
              - id: l2-f3
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihundertsiebzehn plus sechsunddreißig plus hundertfünf."
                show: { drawn: written-calc, rows: ["217", "36", "105"], op: "+" }
                answer: "358"
                hints:
                  - "Einer: sieben plus sechs plus fünf ist achtzehn: Schreib acht, übertrag eins."
                  - "Zehner: eins plus drei plus null plus eins."
                  - "358."
              - id: l2-f4
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertsiebenundsechzig plus neunundachtzig plus zweihundertachtundfünfzig."
                show: { drawn: written-calc, rows: ["167", "89", "258"], op: "+" }
                answer: "514"
                hints:
                  - "Einer: sieben plus neun plus acht ist vierundzwanzig: Schreib vier, übertrag zwei."
                  - "Zehner: sechs plus acht plus fünf plus zwei ist einundzwanzig: Schreib eins, übertrag zwei."
                  - "514."
              - id: l2-f5
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["402", "57", "131"], op: "+", result: "590" }
                answer: true
                hints:
                  - "Einer: zwei plus sieben plus eins ist zehn."
                  - "Schreib null, übertrag eins. Zehner: null plus fünf plus drei plus eins."
                  - "Ja, 590."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Welche Rechnung steht richtig untereinander?"
                say: "Hier soll vierhundertzwanzig plus dreiundfünfzig plus hundertacht stehen. Welche Rechnung ist richtig untereinander geschrieben?"
                options: [{ drawn: written-calc, rows: ["420", "53 ", "108"], op: "+" }, { drawn: written-calc, rows: ["420", "53", "108"], op: "+" }]
                answer: "420|53|108"
                hints: ["Einer unter Einer."]
              - id: l2-s2
                type: multiple_choice
                text: "Was schreibst du bei den Einern?"
                say: "Bei den Einern rechnest du neun plus sieben plus sechs. Was schreibst du hin, und was überträgst du?"
                options: ["2, Übertrag 2", "2, Übertrag 1", "22"]
                answer: "2, Übertrag 2"
                hints: ["Wie viele Zehner hat das Ergebnis der Spalte?"]
              - id: l2-s3
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: vierhundertzwanzig plus dreiundfünfzig plus hundertacht."
                show: { drawn: written-calc, rows: ["420", "53", "108"], op: "+" }
                answer: "581"
                hints: ["Fang bei den Einern an."]
              - id: l2-s4
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: zweihundertneunundvierzig plus achtundsiebzig plus hundertsechsundneunzig."
                show: { drawn: written-calc, rows: ["249", "78", "196"], op: "+" }
                answer: "523"
                hints: ["Bei den Einern ist der Übertrag zwei."]
              - id: l2-s5
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["338", "95", "117"], op: "+", result: "540" }
                answer: false
                hints: ["Prüf jede Stelle, auch die Überträge."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Welche Rechnung steht richtig untereinander?"
                say: "Hier soll dreihundertsechs plus vierundsiebzig plus zweihunderteinundzwanzig stehen. Welche Rechnung ist richtig untereinander geschrieben?"
                options: [{ drawn: written-calc, rows: ["306", "74", "221"], op: "+" }, { drawn: written-calc, rows: ["306", "74 ", "221"], op: "+" }]
                answer: "306|74|221"
              - id: l2-n2
                type: multiple_choice
                text: "Was schreibst du bei den Einern?"
                say: "Bei den Einern rechnest du acht plus acht plus neun. Was schreibst du hin, und was überträgst du?"
                options: ["5, Übertrag 2", "5, Übertrag 1", "25"]
                answer: "5, Übertrag 2"
              - id: l2-n3
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: dreihundertsechs plus vierundsiebzig plus zweihunderteinundzwanzig."
                show: { drawn: written-calc, rows: ["306", "74", "221"], op: "+" }
                answer: "601"
              - id: l2-n4
                type: text_input
                text: "Rechne schriftlich."
                say: "Rechne schriftlich: hundertachtundachtzig plus achtundsechzig plus dreihundertneunundzwanzig."
                show: { drawn: written-calc, rows: ["188", "68", "329"], op: "+" }
                answer: "585"
              - id: l2-n5
                type: true_false
                text: "Stimmt die Rechnung?"
                say: "Prüf die Rechnung. Stimmt sie?"
                show: { drawn: written-calc, rows: ["277", "46", "158"], op: "+", result: "481" }
                answer: true

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: zweihundertvierunddreißig plus hunderteinundzwanzig plus dreihundertdrei."
