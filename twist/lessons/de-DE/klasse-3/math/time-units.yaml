# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.time-units
skill: math.time.units
curriculum: de-DE
language: de
title:
  de: Zeiteinheiten umrechnen
  en: Converting units of time
summary: >
  Lesson 1 converts between Sekunden, Minuten, Stunden and Tagen (1 min =
  60 s, 1 h = 60 min, 1 Tag = 24 h); lesson 2 adds Wochen, Monate and
  Jahre, chooses the right unit for everyday things (eine Schulstunde
  dauert 45 Minuten), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Uhrzeit, en: Time }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.time.durations]
  also_practises: [math.time.durations, math.mult-div-larger.tens]
  vocabulary: { de: [Sekunde, Minute, Stunde, Tag, Woche, Monat, Jahr, umrechnen] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: small, what: { de: "Sekunden, Minuten und Stunden umrechnen", en: "converting seconds, minutes and hours" } }
    - { id: mixed, what: { de: Zeitspannen mit zwei Einheiten angeben, en: giving a duration in two units } }
    - { id: days, what: { de: "Tage, Wochen, Monate und Jahre umrechnen", en: "converting days, weeks, months and years" } }
    - { id: everyday, what: { de: Zeitspannen aus dem Alltag kennen und die passende Einheit wählen, en: knowing everyday durations and choosing the right unit } }
  misconceptions:
    - id: hundred-per-unit
      what: Converts with 100 instead of 60 (1 h = 100 min, 90 min = 0,9 h)
      addressed: lesson 1 Learn says time counts in sixties, not hundreds; every stage of lesson 1 offers the 100-based answer, with feedback in l1-f1
    - id: unit-sense
      what: Picks an impossible unit for an everyday span (Zähneputzen dauert 3 Stunden)
      addressed: lesson 2 Learn gives everyday anchors; "Welche Einheit passt?" in every stage of lesson 2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Sekunden, Minuten, Stunden", en: "Seconds, minutes, hours" }
    goal:
      de: "Rechne Sekunden, Minuten und Stunden um. Bei der Zeit rechnest du mit 60, nicht mit 100."
      en: "Change between seconds, minutes and hours. With time you work with 60, not 100."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Wie viele Minuten hat eine Stunde?"
            say: "Wie viele Minuten hat eine Stunde?"
            answer: "60"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "3 · 60 = _"
            say: "Drei mal sechzig."
            answer: "180"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 min = 60 s\n1 h = 60 min\n1 Tag = 24 h"
            say: "Eine Minute hat sechzig Sekunden. Eine Stunde hat sechzig Minuten. Ein Tag hat vierundzwanzig Stunden. Bei der Zeit rechnest du mit sechzig, nicht mit hundert."
          - text: "2 h 15 min = 60 min + 60 min + 15 min = 135 min"
            say: "Zwei Stunden und fünfzehn Minuten sind sechzig plus sechzig plus fünfzehn Minuten, also hundertfünfunddreißig Minuten."
          - text: "90 min = 60 min + 30 min = 1 h 30 min"
            say: "Andersherum: Neunzig Minuten sind sechzig Minuten und dreißig Minuten, also eine Stunde und dreißig Minuten."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Minuten sind 2 Stunden?"
                say: "Wie viele Minuten sind zwei Stunden?"
                options: ["120 min", "200 min", "60 min"]
                answer: "120 min"
                feedback:
                  "200 min": "Eine Stunde hat sechzig Minuten, nicht hundert."
                hints:
                  - "Eine Stunde hat sechzig Minuten."
                  - "Zwei mal sechzig."
                  - "120 min."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "3 min = _ s"
                say: "Wie viele Sekunden sind drei Minuten?"
                answer: "180"
                hints:
                  - "Eine Minute hat sechzig Sekunden."
                  - "Drei mal sechzig."
                  - "180 s."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viel sind 75 Minuten?"
                say: "Wie viel sind fünfundsiebzig Minuten?"
                options: ["1 h 15 min", "1 h 75 min", "7 h 5 min"]
                answer: "1 h 15 min"
                hints:
                  - "Nimm zuerst eine ganze Stunde heraus."
                  - "Fünfundsiebzig minus sechzig."
                  - "1 h 15 min."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 2 Tage = 48 Stunden"
                say: "Zwei Tage sind achtundvierzig Stunden. Stimmt das?"
                answer: true
                hints:
                  - "Ein Tag hat vierundzwanzig Stunden."
                  - "Zwei mal vierundzwanzig."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: text_input
                text: "Eine halbe Stunde = _ min"
                say: "Wie viele Minuten hat eine halbe Stunde?"
                answer: "30"
                hints:
                  - "Eine ganze Stunde hat sechzig Minuten."
                  - "Die Hälfte davon."
                  - "30 min."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Minuten sind 4 Stunden?"
                say: "Wie viele Minuten sind vier Stunden?"
                options: ["240 min", "400 min", "64 min"]
                answer: "240 min"
                hints: ["Vier mal sechzig."]
              - id: l1-s2
                type: text_input
                text: "2 min = _ s"
                say: "Wie viele Sekunden sind zwei Minuten?"
                answer: "120"
                hints: ["Zwei mal sechzig."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie viel sind 100 Minuten?"
                say: "Wie viel sind hundert Minuten?"
                options: ["1 h 40 min", "1 h", "10 h"]
                answer: "1 h 40 min"
                hints: ["Hundert minus sechzig."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 1 Tag = 12 Stunden"
                say: "Ein Tag hat zwölf Stunden. Stimmt das?"
                answer: false
                hints: ["Der kleine Zeiger läuft an einem Tag zweimal herum."]
              - id: l1-s5
                type: text_input
                text: "Eine Viertelstunde = _ min"
                say: "Wie viele Minuten hat eine Viertelstunde?"
                answer: "15"
                hints: ["Sechzig geteilt durch vier."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Minuten sind 3 Stunden?"
                say: "Wie viele Minuten sind drei Stunden?"
                options: ["180 min", "300 min", "90 min"]
                answer: "180 min"
              - id: l1-n2
                type: text_input
                text: "5 min = _ s"
                say: "Wie viele Sekunden sind fünf Minuten?"
                answer: "300"
              - id: l1-n3
                type: multiple_choice
                text: "Wie viel sind 130 Minuten?"
                say: "Wie viel sind hundertdreißig Minuten?"
                options: ["2 h 10 min", "1 h 30 min", "13 h"]
                answer: "2 h 10 min"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 90 s = 1 min 30 s"
                say: "Neunzig Sekunden sind eine Minute und dreißig Sekunden. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "Eine Dreiviertelstunde = _ min"
                say: "Wie viele Minuten hat eine Dreiviertelstunde?"
                answer: "45"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "5 h = _ min"
            say: "Wie viele Minuten sind fünf Stunden?"
            answer: "300"
          - id: l1-c2
            type: multiple_choice
            text: "Wie viel sind 80 Minuten?"
            say: "Wie viel sind achtzig Minuten?"
            options: ["1 h 20 min", "8 h", "1 h 80 min"]
            answer: "1 h 20 min"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 1 h = 100 min"
            say: "Eine Stunde hat hundert Minuten. Stimmt das?"
            answer: false
          - id: l1-c4
            type: text_input
            text: "8 min = _ s"
            say: "Wie viele Sekunden sind acht Minuten?"
            answer: "480"
          - id: l1-c5
            type: multiple_choice
            text: "Wie viel sind 140 Minuten?"
            say: "Wie viel sind hundertvierzig Minuten?"
            options: ["2 h 20 min", "1 h 40 min", "14 h"]
            answer: "2 h 20 min"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 120 s = 2 min"
            say: "Hundertzwanzig Sekunden sind zwei Minuten. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Woche, Monat, Jahr", en: "Week, month, year" }
    goal:
      de: "Rechne mit Wochen, Monaten und Jahren und wähl die passende Einheit, so wie 45 Minuten für eine Schulstunde."
      en: "Work with weeks, months and years and pick the right unit, like 45 minutes for a school lesson."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "10 min = _ s"
            say: "Wie viele Sekunden sind zehn Minuten?"
            answer: "600"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Wie viele Tage hat eine Woche?"
            say: "Wie viele Tage hat eine Woche?"
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 Woche = 7 Tage\n1 Jahr = 12 Monate"
            say: "Eine Woche hat sieben Tage. Ein Jahr hat zwölf Monate. Ein Monat hat dreißig oder einunddreißig Tage. Nur der Februar hat achtundzwanzig Tage, im Schaltjahr neunundzwanzig."
          - text: "1 Jahr = 365 Tage\nSchaltjahr = 366 Tage"
            say: "Ein Jahr hat dreihundertfünfundsechzig Tage. Ein Schaltjahr hat einen Tag mehr, den neunundzwanzigsten Februar: dreihundertsechsundsechzig Tage. Fast immer ist jedes vierte Jahr ein Schaltjahr."
          - text: "Zähneputzen: 3 Minuten\nSchulstunde: 45 Minuten\nSommerferien: 6 Wochen"
            say: "Merk dir Zeitspannen aus dem Alltag: Zähneputzen dauert etwa drei Minuten, eine Schulstunde fünfundvierzig Minuten, die Sommerferien etwa sechs Wochen. Damit kannst du andere Zeiten schätzen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: text_input
                text: "3 Wochen = _ Tage"
                say: "Wie viele Tage sind drei Wochen?"
                answer: "21"
                hints:
                  - "Eine Woche hat sieben Tage."
                  - "Drei mal sieben."
                  - "21 Tage."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ein Fußballspiel dauert ungefähr 90 _. Welche Einheit passt?"
                say: "Ein Fußballspiel dauert ungefähr neunzig … Welche Einheit passt?"
                options: ["Minuten", "Sekunden", "Stunden"]
                answer: "Minuten"
                hints:
                  - "Denk an eine Schulstunde: fünfundvierzig Minuten."
                  - "Ein Spiel dauert etwa zwei Schulstunden."
                  - "Minuten."
              - id: l2-f3
                type: text_input
                text: "2 Jahre = _ Monate"
                say: "Wie viele Monate sind zwei Jahre?"
                answer: "24"
                hints:
                  - "Ein Jahr hat zwölf Monate."
                  - "Zwei mal zwölf."
                  - "24 Monate."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 14 Tage = 2 Wochen"
                say: "Vierzehn Tage sind zwei Wochen. Stimmt das?"
                answer: true
                hints:
                  - "Eine Woche hat sieben Tage."
                  - "Zwei mal sieben."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Was dauert etwa 1 Minute?"
                say: "Was dauert etwa eine Minute?"
                options: ["Die Schuhe anziehen", "Eine Nacht schlafen", "Einmal blinzeln"]
                answer: "Die Schuhe anziehen"
                hints:
                  - "Eine Minute sind sechzig Sekunden."
                  - "Blinzeln dauert keine Sekunde, eine Nacht viele Stunden."
                  - "Die Schuhe anziehen."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "5 Wochen = _ Tage"
                say: "Wie viele Tage sind fünf Wochen?"
                answer: "35"
                hints: ["Fünf mal sieben."]
              - id: l2-s2
                type: multiple_choice
                text: "Ein Kindergeburtstag dauert ungefähr 3 _. Welche Einheit passt?"
                say: "Ein Kindergeburtstag dauert ungefähr drei … Welche Einheit passt?"
                options: ["Stunden", "Minuten", "Tage"]
                answer: "Stunden"
                hints: ["Drei Minuten sind so lang wie einmal Zähneputzen. Reicht das für eine Feier?"]
              - id: l2-s3
                type: text_input
                text: "36 Monate = _ Jahre"
                say: "Wie viele Jahre sind sechsunddreißig Monate?"
                answer: "3"
                hints: ["Ein Jahr hat zwölf Monate."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Ein Jahr hat 356 Tage."
                say: "Ein Jahr hat dreihundertsechsundfünfzig Tage. Stimmt das?"
                answer: false
                hints: ["Ein Jahr hat 365 Tage. Vergleiche die Ziffern genau."]
              - id: l2-s5
                type: multiple_choice
                text: "Was dauert etwa 1 Stunde?"
                say: "Was dauert etwa eine Stunde?"
                options: ["Ein Kinderfilm im Kino", "Die Hände waschen", "Ein Schuljahr"]
                answer: "Ein Kinderfilm im Kino"
                hints: ["Eine Stunde sind sechzig Minuten."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "4 Wochen = _ Tage"
                say: "Wie viele Tage sind vier Wochen?"
                answer: "28"
              - id: l2-n2
                type: multiple_choice
                text: "Ein Ei muss ungefähr 5 _ kochen. Welche Einheit passt?"
                say: "Ein Ei muss ungefähr fünf … kochen. Welche Einheit passt?"
                options: ["Minuten", "Stunden", "Sekunden"]
                answer: "Minuten"
              - id: l2-n3
                type: text_input
                text: "5 Jahre = _ Monate"
                say: "Wie viele Monate sind fünf Jahre?"
                answer: "60"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 49 Tage = 7 Wochen"
                say: "Neunundvierzig Tage sind sieben Wochen. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Was dauert etwa 1 Woche?"
                say: "Was dauert etwa eine Woche?"
                options: ["Von Montag bis zum nächsten Montag", "Eine Pause", "Die Grundschulzeit"]
                answer: "Von Montag bis zum nächsten Montag"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: small
            type: text_input
            text: "4 min = _ s"
            say: "Wie viele Sekunden sind vier Minuten?"
            answer: "240"
          - id: l2-c2
            part: mixed
            type: multiple_choice
            text: "Wie viel sind 150 Minuten?"
            say: "Wie viel sind hundertfünfzig Minuten?"
            options: ["2 h 30 min", "1 h 50 min", "15 h"]
            answer: "2 h 30 min"
          - id: l2-c3
            part: days
            type: text_input
            text: "6 Wochen = _ Tage"
            say: "Wie viele Tage sind sechs Wochen?"
            answer: "42"
          - id: l2-c4
            part: everyday
            type: multiple_choice
            text: "Ein Wochenende dauert 2 _. Welche Einheit passt?"
            say: "Ein Wochenende dauert zwei … Welche Einheit passt?"
            options: ["Tage", "Stunden", "Wochen"]
            answer: "Tage"
          - id: l2-c5
            part: days
            type: true_false
            text: "Stimmt das? 3 Tage = 72 Stunden"
            say: "Drei Tage sind zweiundsiebzig Stunden. Stimmt das?"
            answer: true
          - id: l2-c6
            part: small
            type: text_input
            text: "6 h = _ min"
            say: "Wie viele Minuten sind sechs Stunden?"
            answer: "360"
          - id: l2-c7
            part: small
            type: multiple_choice
            text: "Wie viele Sekunden sind 7 Minuten?"
            say: "Wie viele Sekunden sind sieben Minuten?"
            options: ["420 s", "700 s", "67 s"]
            answer: "420 s"
          - id: l2-c8
            part: small
            type: true_false
            text: "Stimmt das? 240 min = 4 h"
            say: "Zweihundertvierzig Minuten sind vier Stunden. Stimmt das?"
            answer: true
          - id: l2-c9
            part: small
            type: text_input
            text: "180 s = _ min"
            say: "Wie viele Minuten sind hundertachtzig Sekunden?"
            answer: "3"
          - id: l2-c10
            part: mixed
            type: multiple_choice
            text: "Wie viel sind 95 Minuten?"
            say: "Wie viel sind fünfundneunzig Minuten?"
            options: ["1 h 35 min", "1 h 95 min", "9 h 5 min"]
            answer: "1 h 35 min"
          - id: l2-c11
            part: mixed
            type: text_input
            text: "1 h 45 min = _ min"
            say: "Wie viele Minuten sind eine Stunde und fünfundvierzig Minuten?"
            answer: "105"
          - id: l2-c12
            part: mixed
            type: true_false
            text: "Stimmt das? 110 min = 1 h 10 min"
            say: "Hundertzehn Minuten sind eine Stunde und zehn Minuten. Stimmt das?"
            answer: false
          - id: l2-c13
            part: mixed
            type: multiple_choice
            text: "Wie viel sind 200 Sekunden?"
            say: "Wie viel sind zweihundert Sekunden?"
            options: ["3 min 20 s", "2 min", "20 min"]
            answer: "3 min 20 s"
          - id: l2-c14
            part: days
            type: text_input
            text: "4 Jahre = _ Monate"
            say: "Wie viele Monate sind vier Jahre?"
            answer: "48"
          - id: l2-c15
            part: days
            type: multiple_choice
            text: "Wie viele Tage hat ein Schaltjahr?"
            say: "Wie viele Tage hat ein Schaltjahr?"
            options: ["366", "365", "356"]
            answer: "366"
          - id: l2-c16
            part: days
            type: text_input
            text: "63 Tage = _ Wochen"
            say: "Wie viele Wochen sind dreiundsechzig Tage?"
            answer: "9"
          - id: l2-c17
            part: everyday
            type: multiple_choice
            text: "Die Busfahrt zur Schule dauert ungefähr 15 _. Welche Einheit passt?"
            say: "Die Busfahrt zur Schule dauert ungefähr fünfzehn … Welche Einheit passt?"
            options: ["Minuten", "Sekunden", "Stunden"]
            answer: "Minuten"
          - id: l2-c18
            part: everyday
            type: multiple_choice
            text: "Was dauert etwa 1 Sekunde?"
            say: "Was dauert etwa eine Sekunde?"
            options: ["Einmal in die Hände klatschen", "Ein Glas Wasser trinken", "Ein Buch lesen"]
            answer: "Einmal in die Hände klatschen"
          - id: l2-c19
            part: everyday
            type: true_false
            text: "Stimmt das? Zähneputzen dauert etwa 3 Stunden."
            say: "Zähneputzen dauert etwa drei Stunden. Stimmt das?"
            answer: false
          - id: l2-c20
            part: everyday
            type: multiple_choice
            text: "Was dauert etwa 1 Monat?"
            say: "Was dauert etwa einen Monat?"
            options: ["Von Anfang Mai bis Anfang Juni", "Ein Wochenende", "Ein Schultag"]
            answer: "Von Anfang Mai bis Anfang Juni"
