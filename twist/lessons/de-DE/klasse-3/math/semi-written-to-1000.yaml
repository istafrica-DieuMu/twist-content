        mode: demonstration
        screens:
          - text: "346 + 238\n346 + 200 = 546\n546 + 30 = 576\n576 + 8 = 584"
            say: "Dreihundertsechsundvierzig plus zweihundertachtunddreißig. Halbschriftlich schreibst du deine Zwischenschritte auf. Schrittweise: erst die Hunderter, dann die Zehner, dann die Einer. Jeder Schritt fängt mit dem letzten Ergebnis an."
          - text: "346 + 238 = 584"
            say: "Auf dem Rechenstrich sind das drei Sprünge: plus zweihundert, plus dreißig, plus acht."
            show: { drawn: rechenstrich, start: 346, jumps: [200, 30, 8] }
          - text: "300 + 200 = 500\n40 + 30 = 70\n6 + 8 = 14\n500 + 70 + 14 = 584"
            say: "Stellenweise rechnest du jede Stelle für sich: Hunderter plus Hunderter, Zehner plus Zehner, Einer plus Einer. Zum Schluss addierst du alle drei Ergebnisse."

