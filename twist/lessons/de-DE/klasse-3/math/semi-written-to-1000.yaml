    goal:
      de: "Rechne plus in Schritten und schreib jeden Schritt auf, so wie 346 + 200, dann + 30, dann + 8."
      en: "Add in steps and write each step down, like 346 + 200, then + 30, then + 8."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "476 + 8 = _"
            say: "Vierhundertsechsundsiebzig plus acht."
            answer: "484"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "350 + 70 = _"
            say: "Dreihundertfünfzig plus siebzig."
            answer: "420"
            difficulty: easy

