# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.add-sub-hundreds
skill: math.add-sub-to-1000.hundreds
curriculum: de-DE
language: de
title:
  de: Hunderter und Zehner bis 1000
  en: Adding and subtracting hundreds and tens to 1000
summary: >
  Adding and subtracting whole hundreds and whole tens within 1000. Lesson 1
  works with hundreds only (300 + 400, 1000 − 700), helped by the small
  sum (3 + 4 = 7); lesson 2 adds and subtracts hundreds or tens to a
  three-digit number without crossing (470 − 50, 345 + 200), where only
  one place changes, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.place-value, math.add-sub-to-100.tens]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { de: [Hunderter, Zehner, Einer, Analogieaufgabe, tausend] }
  forms: [drawn, text, audio]
  drawn: [base-ten]
  facets: []
  parts:
    - { id: hundreds, what: { de: "Hunderterzahlen addieren und subtrahieren, auch mit 1000", en: "adding and subtracting multiples of 100, also with 1000" } }
    - { id: plus-hundreds, what: { de: Hunderter zu einer dreistelligen Zahl addieren und von ihr subtrahieren, en: adding and subtracting hundreds to and from a three-digit number } }
    - { id: plus-tens, what: { de: Zehner zu einer dreistelligen Zahl addieren und von ihr subtrahieren, en: adding and subtracting tens to and from a three-digit number } }
    - { id: place, what: { de: "sagen, welche Stelle sich ändert", en: saying which place changes } }
  misconceptions:
    - id: wrong-place
      what: Adds tens as ones or as hundreds (360 + 30 = 363 or 660)
      addressed: lesson 2 Learn says which place changes; "Was ändert sich?" tasks in each stage; feedback on 363 and 660 in the full stage
    - id: zeros-pile-up
      what: Writes the small sum and adds too many zeros (200 + 500 = 7000)
      addressed: lesson 1 Learn counts in hundreds (zwei Hunderter und fünf Hunderter sind sieben Hunderter); feedback on 7000
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Mit Hundertern rechnen, en: Calculating with hundreds }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "40 + 30 = _"
            say: "Vierzig plus dreißig."
            answer: "70"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Hunderter hat 600?"
            say: "Wie viele Hunderter hat sechshundert?"
            options: ["6", "60", "600"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "300 + 400"
            say: "Dreihundert plus vierhundert. Das sind drei Hunderter und vier Hunderter."
            show: { drawn: base-ten, hundreds: 3, tens: 0, ones: 0 }
          - text: "3 + 4 = 7 | 300 + 400 = 700"
            say: "Drei Hunderter und vier Hunderter sind sieben Hunderter: siebenhundert. Die kleine Aufgabe drei plus vier hilft dir. So eine Aufgabe heißt Analogieaufgabe."
            show: { drawn: base-ten, hundreds: 7, tens: 0, ones: 0 }
          - text: "800 − 500 = 300"
            say: "Bei Minusaufgaben geht es genauso: acht Hunderter minus fünf Hunderter sind drei Hunderter."
          - text: "1000 − 400 = 600"
            say: "Tausend sind zehn Hunderter. Zehn Hunderter minus vier Hunderter sind sechs Hunderter: sechshundert."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "200 + 500 = ?"
                say: "Zweihundert plus fünfhundert. Wie viel ist das?"
                options: ["700", "250", "7000"]
                answer: "700"
                feedback:
                  "7000": "Zwei Hunderter und fünf Hunderter sind sieben Hunderter, also 700."
                  "250": "Fünfhundert sind fünf Hunderter, nicht fünf Zehner."
                hints:
                  - "Rechne mit Hundertern."
                  - "Zwei Hunderter und fünf Hunderter."
                  - "Sieben Hunderter sind 700."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst sechs minus zwei, dann sechshundert minus zweihundert."
                frame: "6 − 2 = _ | 600 − 200 = _"
                options: ["4", "40", "400", "800"]
                answer: ["4", "400"]
                hints:
                  - "Sechs minus zwei ist vier."
                  - "Sechs Hunderter minus zwei Hunderter sind vier Hunderter."
                  - "4 und 400."
              - id: l1-f3
                type: text_input
                text: "900 − 300 = _"
                say: "Neunhundert minus dreihundert."
                answer: "600"
                hints:
                  - "Neun Hunderter minus drei Hunderter."
                  - "Neun minus drei ist sechs."
                  - "600."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 400 + 600 = 1000"
                say: "Vierhundert plus sechshundert ist tausend. Stimmt das?"
                answer: true
                hints:
                  - "Vier Hunderter und sechs Hunderter."
                  - "Das sind zehn Hunderter."
                  - "Ja, zehn Hunderter sind tausend."
              - id: l1-f5
                type: multiple_choice
                text: "400 + 300: Was ändert sich?"
                say: "Vierhundert plus dreihundert. Was ändert sich: die Hunderter, die Zehner oder die Einer?"
                options: ["die Hunderter", "die Zehner", "die Einer"]
                answer: "die Hunderter"
                hints:
                  - "Dreihundert sind drei Hunderter."
                  - "Du legst Hunderter dazu."
                  - "Die Hunderter ändern sich."
              - id: l1-f6
                type: text_input
                text: "1000 − 700 = _"
                say: "Tausend minus siebenhundert."
                answer: "300"
                hints:
                  - "Tausend sind zehn Hunderter."
                  - "Zehn Hunderter minus sieben Hunderter."
                  - "300."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "500 + 300 = _"
                say: "Fünfhundert plus dreihundert."
                answer: "800"
                hints: ["Wie viele Hunderter sind es zusammen?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst vier plus fünf, dann vierhundert plus fünfhundert."
                frame: "4 + 5 = _ | 400 + 500 = _"
                options: ["9", "90", "900", "450"]
                answer: ["9", "900"]
                hints: ["Erst die kleine Aufgabe, dann in Hundertern."]
              - id: l1-s3
                type: multiple_choice
                text: "700 − 400 = ?"
                say: "Siebenhundert minus vierhundert. Wie viel ist das?"
                options: ["300", "1100", "30"]
                answer: "300"
                hints: ["Rechne mit Hundertern: sieben minus vier."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 800 − 200 = 500"
                say: "Achthundert minus zweihundert ist fünfhundert. Stimmt das?"
                answer: false
                hints: ["Rechne die kleine Aufgabe acht minus zwei."]
              - id: l1-s5
                type: text_input
                text: "1000 − 200 = _"
                say: "Tausend minus zweihundert."
                answer: "800"
                hints: ["Wie viele Hunderter hat tausend?"]
              - id: l1-s6
                type: text_input
                text: "100 + 600 = _"
                say: "Hundert plus sechshundert."
                answer: "700"
                hints: ["Zähl die Hunderter zusammen."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "300 + 300 = _"
                say: "Dreihundert plus dreihundert."
                answer: "600"
              - id: l1-n2
                type: multiple_choice
                text: "900 − 600 = ?"
                say: "Neunhundert minus sechshundert. Wie viel ist das?"
                options: ["300", "1500", "30"]
                answer: "300"
              - id: l1-n3
                type: true_false
                text: "Stimmt das? 200 + 700 = 900"
                say: "Zweihundert plus siebenhundert ist neunhundert. Stimmt das?"
                answer: true
              - id: l1-n4
                type: text_input
                text: "1000 − 500 = _"
                say: "Tausend minus fünfhundert."
                answer: "500"
              - id: l1-n5
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst sieben plus zwei, dann siebenhundert plus zweihundert."
                frame: "7 + 2 = _ | 700 + 200 = _"
                options: ["9", "90", "900", "500"]
                answer: ["9", "900"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "600 + 300 = _"
            say: "Sechshundert plus dreihundert."
            answer: "900"
          - id: l1-c2
            type: multiple_choice
            text: "800 − 300 = ?"
            say: "Achthundert minus dreihundert. Wie viel ist das?"
            options: ["500", "1100", "50"]
            answer: "500"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 1000 − 600 = 300"
            say: "Tausend minus sechshundert ist dreihundert. Stimmt das?"
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "Rechne beide Aufgaben."
            say: "Rechne sechs minus vier und sechshundert minus vierhundert."
            frame: "6 − 4 = _ | 600 − 400 = _"
            options: ["2", "20", "200", "1000"]
            answer: ["2", "200"]
          - id: l1-c5
            type: text_input
            text: "1000 − 900 = _"
            say: "Tausend minus neunhundert."
            answer: "100"
          - id: l1-c6
            type: multiple_choice
            text: "500 + 500 = ?"
            say: "Fünfhundert plus fünfhundert. Wie viel ist das?"
            options: ["1000", "100", "550"]
            answer: "1000"

  - n: 2
    title: { de: Nur eine Stelle ändert sich, en: Only one place changes }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "400 + 500 = _"
            say: "Vierhundert plus fünfhundert."
            answer: "900"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "50 + 30 = _"
            say: "Fünfzig plus dreißig."
            answer: "80"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "470 − 50"
            say: "Vierhundertsiebzig sind vier Hunderter und sieben Zehner. Wir nehmen fünf Zehner weg."
            show: { drawn: base-ten, hundreds: 4, tens: 7, ones: 0 }
          - text: "470 − 50 = 420"
            say: "Nur die Zehner ändern sich: sieben Zehner minus fünf Zehner sind zwei Zehner. Die Hunderter bleiben. Vierhundertsiebzig minus fünfzig ist vierhundertzwanzig."
            show: { drawn: base-ten, hundreds: 4, tens: 2, ones: 0 }
          - text: "345 + 200 = 545"
            say: "Bei plus zweihundert ändern sich nur die Hunderter: drei Hunderter und zwei Hunderter sind fünf Hunderter. Zehner und Einer bleiben."
          - text: "47 − 5 = 42 | 470 − 50 = 420"
            say: "Auch hier hilft eine kleine Aufgabe: siebenundvierzig minus fünf ist zweiundvierzig, also ist vierhundertsiebzig minus fünfzig vierhundertzwanzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "360 + 30 = ?"
                say: "Dreihundertsechzig plus dreißig. Wie viel ist das?"
                options: ["390", "660", "363"]
                answer: "390"
                feedback:
                  "660": "Dreißig sind drei Zehner, nicht drei Hunderter."
                  "363": "Dreißig sind drei Zehner, nicht drei Einer."
                hints:
                  - "Dreißig sind drei Zehner."
                  - "Sechs Zehner und drei Zehner sind neun Zehner."
                  - "390."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "528 + 300: Was ändert sich?"
                say: "Fünfhundertachtundzwanzig plus dreihundert. Was ändert sich: die Hunderter, die Zehner oder die Einer?"
                options: ["die Hunderter", "die Zehner", "die Einer"]
                answer: "die Hunderter"
                hints:
                  - "Dreihundert sind drei Hunderter."
                  - "Du legst Hunderter dazu."
                  - "Die Hunderter ändern sich: 828."
              - id: l2-f3
                type: text_input
                text: "690 − 40 = _"
                say: "Sechshundertneunzig minus vierzig."
                answer: "650"
                hints:
                  - "Vierzig sind vier Zehner."
                  - "Neun Zehner minus vier Zehner sind fünf Zehner."
                  - "650."
              - id: l2-f4
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst achtundfünfzig minus drei, dann fünfhundertachtzig minus dreißig."
                frame: "58 − 3 = _ | 580 − 30 = _"
                options: ["55", "550", "28", "580"]
                answer: ["55", "550"]
                hints:
                  - "Achtundfünfzig minus drei ist fünfundfünfzig."
                  - "55 Zehner sind 550."
                  - "55 und 550."
              - id: l2-f5
                type: text_input
                text: "234 + 500 = _"
                say: "Zweihundertvierunddreißig plus fünfhundert."
                answer: "734"
                hints:
                  - "Nur die Hunderter ändern sich."
                  - "Zwei Hunderter und fünf Hunderter sind sieben Hunderter."
                  - "734."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? 856 − 400 = 816"
                say: "Achthundertsechsundfünfzig minus vierhundert ist achthundertsechzehn. Stimmt das?"
                answer: false
                feedback:
                  "true": "Vierhundert sind vier Hunderter. Die Hunderter ändern sich: acht minus vier ist vier. Richtig ist 456."
                hints:
                  - "Was sind vierhundert: Hunderter, Zehner oder Einer?"
                  - "Acht Hunderter minus vier Hunderter."
                  - "Nein, richtig ist 456."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "420 + 60 = _"
                say: "Vierhundertzwanzig plus sechzig."
                answer: "480"
                hints: ["Rechne nur mit den Zehnern."]
              - id: l2-s2
                type: multiple_choice
                text: "763 − 40: Was ändert sich?"
                say: "Siebenhundertdreiundsechzig minus vierzig. Was ändert sich?"
                options: ["die Zehner", "die Hunderter", "die Einer"]
                answer: "die Zehner"
                hints: ["Was sind vierzig: Hunderter, Zehner oder Einer?"]
              - id: l2-s3
                type: text_input
                text: "915 − 600 = _"
                say: "Neunhundertfünfzehn minus sechshundert."
                answer: "315"
                hints: ["Welche Stelle ändert sich bei minus sechshundert?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst sechsunddreißig plus zwei, dann dreihundertsechzig plus zwanzig."
                frame: "36 + 2 = _ | 360 + 20 = _"
                options: ["38", "380", "56", "560"]
                answer: ["38", "380"]
                hints: ["Erst die kleine Aufgabe."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? 247 + 30 = 277"
                say: "Zweihundertsiebenundvierzig plus dreißig ist zweihundertsiebenundsiebzig. Stimmt das?"
                answer: true
                hints: ["Rechne mit den Zehnern."]
              - id: l2-s6
                type: text_input
                text: "880 − 70 = _"
                say: "Achthundertachtzig minus siebzig."
                answer: "810"
                hints: ["Wie viele Zehner bleiben?"]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "153 + 400 = _"
                say: "Hundertdreiundfünfzig plus vierhundert."
                answer: "553"
              - id: l2-n2
                type: multiple_choice
                text: "835 − 30: Was ändert sich?"
                say: "Achthundertfünfunddreißig minus dreißig. Was ändert sich: die Hunderter, die Zehner oder die Einer?"
                options: ["die Hunderter", "die Zehner", "die Einer"]
                answer: "die Zehner"
              - id: l2-n3
                type: text_input
                text: "309 + 60 = _"
                say: "Dreihundertneun plus sechzig."
                answer: "369"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 672 − 200 = 472"
                say: "Sechshundertzweiundsiebzig minus zweihundert ist vierhundertzweiundsiebzig. Stimmt das?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "790 − 90 = _"
                say: "Siebenhundertneunzig minus neunzig."
                answer: "700"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: hundreds
            type: text_input
            text: "200 + 600 = _"
            say: "Zweihundert plus sechshundert."
            answer: "800"
          - id: l2-c2
            part: plus-tens
            type: text_input
            text: "975 − 50 = _"
            say: "Neunhundertfünfundsiebzig minus fünfzig."
            answer: "925"
          - id: l2-c3
            part: plus-hundreds
            type: multiple_choice
            text: "418 + 300 = ?"
            say: "Vierhundertachtzehn plus dreihundert. Wie viel ist das?"
            options: ["718", "448", "421"]
            answer: "718"
          - id: l2-c4
            part: hundreds
            type: true_false
            text: "Stimmt das? 1000 − 300 = 700"
            say: "Tausend minus dreihundert ist siebenhundert. Stimmt das?"
            answer: true
          - id: l2-c5
            part: plus-tens
            type: fill_in_blank
            text: "Rechne beide Aufgaben."
            say: "Rechne vierundsechzig minus drei und sechshundertvierzig minus dreißig."
            frame: "64 − 3 = _ | 640 − 30 = _"
            options: ["61", "610", "34", "340"]
            answer: ["61", "610"]
          - id: l2-c6
            part: hundreds
            type: multiple_choice
            text: "100 + 800 = ?"
            say: "Hundert plus achthundert. Wie viel ist das?"
            options: ["900", "9000", "180"]
            answer: "900"
          - id: l2-c7
            part: hundreds
            type: fill_in_blank
            text: "Rechne beide Aufgaben."
            say: "Rechne neun minus vier und neunhundert minus vierhundert."
            frame: "9 − 4 = _ | 900 − 400 = _"
            options: ["5", "50", "500", "1300"]
            answer: ["5", "500"]
          - id: l2-c8
            part: hundreds
            type: text_input
            text: "In einer Kiste sind 1000 Nägel. Papa braucht 400 davon. Wie viele bleiben in der Kiste?"
            say: "In einer Kiste sind tausend Nägel. Papa braucht vierhundert davon. Wie viele bleiben in der Kiste?"
            answer: "600"
          - id: l2-c9
            part: plus-hundreds
            type: text_input
            text: "627 + 200 = _"
            say: "Sechshundertsiebenundzwanzig plus zweihundert."
            answer: "827"
          - id: l2-c10
            part: plus-hundreds
            type: text_input
            text: "584 − 300 = _"
            say: "Fünfhundertvierundachtzig minus dreihundert."
            answer: "284"
          - id: l2-c11
            part: plus-hundreds
            type: true_false
            text: "Stimmt das? 349 + 400 = 789"
            say: "Dreihundertneunundvierzig plus vierhundert ist siebenhundertneunundachtzig. Stimmt das?"
            answer: false
          - id: l2-c12
            part: plus-hundreds
            type: multiple_choice
            text: "706 − 500 = ?"
            say: "Siebenhundertsechs minus fünfhundert. Wie viel ist das?"
            options: ["206", "701", "656"]
            answer: "206"
          - id: l2-c13
            part: plus-tens
            type: text_input
            text: "530 + 40 = _"
            say: "Fünfhundertdreißig plus vierzig."
            answer: "570"
          - id: l2-c14
            part: plus-tens
            type: multiple_choice
            text: "286 − 60 = ?"
            say: "Zweihundertsechsundachtzig minus sechzig. Wie viel ist das?"
            options: ["226", "280", "346"]
            answer: "226"
          - id: l2-c15
            part: plus-tens
            type: true_false
            text: "Stimmt das? 452 + 30 = 482"
            say: "Vierhundertzweiundfünfzig plus dreißig ist vierhundertzweiundachtzig. Stimmt das?"
            answer: true
          - id: l2-c16
            part: place
            type: multiple_choice
            text: "641 + 50: Was ändert sich?"
            say: "Sechshunderteinundvierzig plus fünfzig. Was ändert sich: die Hunderter, die Zehner oder die Einer?"
            options: ["die Hunderter", "die Zehner", "die Einer"]
            answer: "die Zehner"
          - id: l2-c17
            part: place
            type: multiple_choice
            text: "389 − 200: Was ändert sich?"
            say: "Dreihundertneunundachtzig minus zweihundert. Was ändert sich: die Hunderter, die Zehner oder die Einer?"
            options: ["die Hunderter", "die Zehner", "die Einer"]
            answer: "die Hunderter"
          - id: l2-c18
            part: place
            type: true_false
            text: "215 + 60: Die Hunderter ändern sich. Stimmt das?"
            say: "Zweihundertfünfzehn plus sechzig. Die Hunderter ändern sich. Stimmt das?"
            answer: false
          - id: l2-c19
            part: place
            type: multiple_choice
            text: "Bei welcher Aufgabe ändern sich nur die Hunderter?"
            say: "Bei welcher Aufgabe ändern sich nur die Hunderter?"
            options: ["463 + 300", "463 + 30", "463 + 3"]
            answer: "463 + 300"
          - id: l2-c20
            part: place
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Fünfhundertachtunddreißig plus wie viel ist achthundertachtunddreißig?"
            frame: "538 + _ = 838"
            options: ["3", "30", "300"]
            answer: ["300"]
