# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.money-word-problems
skill: math.money.word-problems
curriculum: de-DE
language: de
title:
  de: Sachaufgaben mit Geld
  en: Money word problems
summary: >
  Lesson 1 solves shopping stories in steps: what is asked, what is
  given, the calculation and the Antwortsatz (Was kostet der Einkauf, wie
  viel bleibt übrig?); lesson 2 compares prices and offers (Was ist
  günstiger: 3 Hefte für 2,70 € oder 1 Heft für 1 €?), and ends with the
  skill check.
metadata:
  year: klasse-3
  topic: { de: Geld, en: Money }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.money.calculate, math.word-problems.multi-step]
  also_practises: [math.money.calculate, math.word-problems.multi-step]
  vocabulary: { de: [Preis, günstiger, teurer, Angebot, sparen, Antwortsatz] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: steps, what: { de: Einkaufsaufgaben in Schritten lösen, en: solving shopping problems in steps } }
    - { id: enough, what: { de: "prüfen, ob das Geld reicht", en: checking whether the money is enough } }
    - { id: answer, what: { de: den passenden Antwortsatz finden, en: choosing the answer sentence that fits } }
    - { id: compare, what: { de: Preise und Angebote vergleichen, en: comparing prices and offers } }
  misconceptions:
    - id: one-step-only
      what: Stops after the first step of a two-step story (adds the prices but forgets the change)
      addressed: lesson 1 Learn plans both steps; every stage of lesson 1 has a two-step story offering the first-step result, with feedback in l1-f2
    - id: bigger-pack-cheaper
      what: Thinks the bigger pack or the offer is always cheaper
      addressed: lesson 2 Learn works out what the single items cost and says an offer is not always cheaper; l2-s2, l2-s4 and l2-n2 have an offer that is not cheaper
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Einkaufen in Schritten", en: "Shopping in steps" }
    goal:
      de: "Löse Einkaufsaufgaben Schritt für Schritt und schreib einen Antwortsatz, so wie bei Lena mit Brot und Milch."
      en: "Solve shopping problems step by step and write an answer sentence, like Lena with bread and milk."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "2,40 € + 1,80 € = _"
            say: "Zwei Euro vierzig plus ein Euro achtzig."
            options: ["4,20 €", "3,120 €", "3,20 €"]
            answer: "4,20 €"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "10,00 € − 4,20 € = _"
            say: "Zehn Euro minus vier Euro zwanzig."
            options: ["5,80 €", "6,20 €", "5,20 €"]
            answer: "5,80 €"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lena kauft Brot für 2,40 € und Milch für 1,80 €. Sie bezahlt mit 10 €.\nFrage: Wie viel Geld bekommt Lena zurück?"
            say: "Lena kauft Brot für zwei Euro vierzig und Milch für einen Euro achtzig. Sie bezahlt mit zehn Euro. Wie viel Geld bekommt sie zurück? Lies zuerst genau: Was ist gefragt? Das Rückgeld."
          - text: "1. 2,40 € + 1,80 € = 4,20 € | 2. 10,00 € − 4,20 € = 5,80 €"
            say: "Plane die Schritte: Zuerst rechnest du, was alles kostet: vier Euro zwanzig. Dann ziehst du das vom bezahlten Geld ab: fünf Euro achtzig."
          - text: "Antwort: Lena bekommt 5,80 € zurück."
            say: "Zum Schluss schreibst du einen Antwortsatz: Lena bekommt fünf Euro achtzig zurück."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Tim kauft einen Ball für 6,50 € und eine Pumpe für 3,20 €. Reichen 10 €? Was rechnest du zuerst?"
                say: "Tim kauft einen Ball für sechs Euro fünfzig und eine Pumpe für drei Euro zwanzig. Er will wissen, ob zehn Euro reichen. Was rechnest du zuerst?"
                options: ["Was alles zusammen kostet", "Wie viel ein Ball kostet", "Wie viele Bälle er kaufen kann"]
                answer: "Was alles zusammen kostet"
                hints:
                  - "Lies die Frage genau."
                  - "Ob das Geld reicht, weißt du erst, wenn du den Preis von allem kennst."
                  - "Was alles zusammen kostet."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Mia kauft Saft für 1,30 € und Kekse für 2,20 €. Sie bezahlt mit 5 €. Wie viel bekommt sie zurück?"
                say: "Mia kauft Saft für einen Euro dreißig und Kekse für zwei Euro zwanzig. Sie bezahlt mit fünf Euro. Wie viel bekommt sie zurück?"
                options: ["1,50 €", "3,50 €", "2,50 €"]
                answer: "1,50 €"
                feedback:
                  "3,50 €": "Das ist der Preis für den Einkauf. Gefragt ist das Rückgeld."
                hints:
                  - "Rechne zuerst, was alles kostet."
                  - "Drei Euro fünfzig. Dann von fünf Euro abziehen."
                  - "1,50 €."
              - id: l1-f3
                type: multiple_choice
                text: "Ein Kinoticket kostet 6,50 €. Paul hat 20 €. Reicht es für 3 Tickets?"
                say: "Ein Kinoticket kostet sechs Euro fünfzig. Paul hat zwanzig Euro. Reicht das Geld für drei Tickets?"
                options: ["Ja, es bleiben 0,50 € übrig.", "Nein, es fehlen 0,50 €.", "Ja, es bleiben 13,50 € übrig."]
                answer: "Ja, es bleiben 0,50 € übrig."
                hints:
                  - "Rechne aus, was drei Tickets kosten."
                  - "Dreimal sechs Euro fünfzig sind neunzehn Euro fünfzig."
                  - "Ja, es bleiben 0,50 € übrig."
              - id: l1-f4
                type: true_false
                text: "Lea kauft 2 Hefte zu je 1,40 € und einen Stift für 0,90 €. Sie zahlt 3,70 €. Stimmt das?"
                say: "Lea kauft zwei Hefte zu je einem Euro vierzig und einen Stift für neunzig Cent. Sie zahlt drei Euro siebzig. Stimmt das?"
                answer: true
                hints:
                  - "Rechne zuerst die zwei Hefte."
                  - "Zwei Euro achtzig und dann neunzig Cent dazu."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Welcher Antwortsatz passt? Frage: Wie viel kostet der Einkauf? Rechnung: 3,20 € + 4,50 € = 7,70 €"
                say: "Die Frage ist: Wie viel kostet der Einkauf? Die Rechnung ergibt sieben Euro siebzig. Welcher Antwortsatz passt?"
                options: ["Der Einkauf kostet 7,70 €.", "Er bekommt 7,70 € zurück.", "Der Einkauf kostet 3,20 €."]
                answer: "Der Einkauf kostet 7,70 €."
                hints:
                  - "Der Antwortsatz beantwortet genau die Frage."
                  - "Gefragt ist der Preis des Einkaufs."
                  - "Der Einkauf kostet 7,70 €."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ben kauft 3 Brötchen zu je 0,40 € und Butter für 1,80 €. Was kostet alles? Was rechnest du zuerst?"
                say: "Ben kauft drei Brötchen zu je vierzig Cent und Butter für einen Euro achtzig. Er will wissen, was alles kostet. Was rechnest du zuerst?"
                options: ["Was die 3 Brötchen kosten", "Wie viel Geld er zurückbekommt", "Wie viel die Butter kostet"]
                answer: "Was die 3 Brötchen kosten"
                hints: ["Den Preis der Butter kennst du schon."]
              - id: l1-s2
                type: multiple_choice
                text: "Anna kauft ein Buch für 7,90 € und ein Lesezeichen für 1,50 €. Sie bezahlt mit 10 €. Wie viel bekommt sie zurück?"
                say: "Anna kauft ein Buch für sieben Euro neunzig und ein Lesezeichen für einen Euro fünfzig. Sie bezahlt mit zehn Euro. Wie viel bekommt sie zurück?"
                options: ["0,60 €", "9,40 €", "1,60 €"]
                answer: "0,60 €"
                hints: ["Rechne zuerst, was alles kostet."]
              - id: l1-s3
                type: multiple_choice
                text: "Eine Kugel Eis kostet 1,40 €. Reichen 5 € für 4 Kugeln?"
                say: "Eine Kugel Eis kostet einen Euro vierzig. Reichen fünf Euro für vier Kugeln?"
                options: ["Nein, es fehlen 0,60 €.", "Ja, es bleiben 0,60 € übrig.", "Ja, es bleiben 3,60 € übrig."]
                answer: "Nein, es fehlen 0,60 €."
                hints: ["Vier Kugeln kosten fünf Euro sechzig."]
              - id: l1-s4
                type: true_false
                text: "Tom kauft 2 Säfte zu je 0,85 € und bezahlt mit 2 €. Er bekommt 0,30 € zurück. Stimmt das?"
                say: "Tom kauft zwei Säfte zu je fünfundachtzig Cent und bezahlt mit zwei Euro. Er bekommt dreißig Cent zurück. Stimmt das?"
                answer: true
                hints: ["Zwei Säfte kosten einen Euro siebzig."]
              - id: l1-s5
                type: multiple_choice
                text: "Welcher Antwortsatz passt? Frage: Wie viel Geld bleibt übrig? Rechnung: 20,00 € − 13,40 € = 6,60 €"
                say: "Die Frage ist: Wie viel Geld bleibt übrig? Die Rechnung ergibt sechs Euro sechzig. Welcher Antwortsatz passt?"
                options: ["Es bleiben 6,60 € übrig.", "Der Einkauf kostet 6,60 €.", "Es bleiben 13,40 € übrig."]
                answer: "Es bleiben 6,60 € übrig."
                hints: ["Der Antwortsatz beantwortet genau die Frage."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Sara kauft 4 Äpfel zu je 0,35 € und Trauben für 2,10 €. Was kostet alles zusammen?"
                say: "Sara kauft vier Äpfel zu je fünfunddreißig Cent und Trauben für zwei Euro zehn. Was kostet alles zusammen?"
                options: ["3,50 €", "1,40 €", "2,45 €"]
                answer: "3,50 €"
              - id: l1-n2
                type: multiple_choice
                text: "Max kauft ein T-Shirt für 12,50 € und Socken für 4,80 €. Er bezahlt mit 20 €. Wie viel bekommt er zurück?"
                say: "Max kauft ein T-Shirt für zwölf Euro fünfzig und Socken für vier Euro achtzig. Er bezahlt mit zwanzig Euro. Wie viel bekommt er zurück?"
                options: ["2,70 €", "17,30 €", "3,70 €"]
                answer: "2,70 €"
              - id: l1-n3
                type: multiple_choice
                text: "Eine Karte für das Schwimmbad kostet 3,50 €. Reichen 15 € für 4 Kinder?"
                say: "Eine Karte für das Schwimmbad kostet drei Euro fünfzig. Reichen fünfzehn Euro für vier Kinder?"
                options: ["Ja, es bleibt 1,00 € übrig.", "Nein, es fehlt 1,00 €.", "Ja, es bleiben 11,50 € übrig."]
                answer: "Ja, es bleibt 1,00 € übrig."
              - id: l1-n4
                type: true_false
                text: "Lina kauft 3 Postkarten zu je 0,80 € und Briefmarken für 2,55 €. Sie zahlt 4,95 €. Stimmt das?"
                say: "Lina kauft drei Postkarten zu je achtzig Cent und Briefmarken für zwei Euro fünfundfünfzig. Sie zahlt vier Euro fünfundneunzig. Stimmt das?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Welcher Antwortsatz passt? Frage: Wie viel kosten 3 Hefte? Rechnung: 3 · 1,25 € = 3,75 €"
                say: "Die Frage ist: Wie viel kosten drei Hefte? Die Rechnung ergibt drei Euro fünfundsiebzig. Welcher Antwortsatz passt?"
                options: ["3 Hefte kosten 3,75 €.", "1 Heft kostet 3,75 €.", "Es bleiben 3,75 € übrig."]
                answer: "3 Hefte kosten 3,75 €."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ali kauft Brot für 2,60 € und Käse für 3,20 €. Er bezahlt mit 10 €. Wie viel bekommt er zurück?"
            say: "Ali kauft Brot für zwei Euro sechzig und Käse für drei Euro zwanzig. Er bezahlt mit zehn Euro. Wie viel bekommt er zurück?"
            options: ["4,20 €", "5,80 €", "5,20 €"]
            answer: "4,20 €"
          - id: l1-c2
            type: multiple_choice
            text: "Eine Eintrittskarte kostet 4,50 €. Reichen 10 € für 2 Karten?"
            say: "Eine Eintrittskarte kostet vier Euro fünfzig. Reichen zehn Euro für zwei Karten?"
            options: ["Ja, es bleibt 1,00 € übrig.", "Nein, es fehlt 1,00 €.", "Ja, es bleiben 5,50 € übrig."]
            answer: "Ja, es bleibt 1,00 € übrig."
          - id: l1-c3
            type: true_false
            text: "Ein Stift kostet 0,75 €. 4 Stifte kosten 3,00 €. Stimmt das?"
            say: "Ein Stift kostet fünfundsiebzig Cent. Vier Stifte kosten drei Euro. Stimmt das?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Jana kauft Nudeln für 1,20 € und Tomaten für 2,50 €. Sie bezahlt mit 5 €. Wie viel bekommt sie zurück?"
            say: "Jana kauft Nudeln für einen Euro zwanzig und Tomaten für zwei Euro fünfzig. Sie bezahlt mit fünf Euro. Wie viel bekommt sie zurück?"
            options: ["1,30 €", "3,70 €", "2,30 €"]
            answer: "1,30 €"
          - id: l1-c5
            type: multiple_choice
            text: "Welcher Antwortsatz passt? Frage: Wie viel Geld bekommt Ole zurück? Rechnung: 10,00 € − 6,80 € = 3,20 €"
            say: "Die Frage ist: Wie viel Geld bekommt Ole zurück? Die Rechnung ergibt drei Euro zwanzig. Welcher Antwortsatz passt?"
            options: ["Ole bekommt 3,20 € zurück.", "Der Einkauf kostet 3,20 €.", "Ole bekommt 6,80 € zurück."]
            answer: "Ole bekommt 3,20 € zurück."
          - id: l1-c6
            type: true_false
            text: "Ein Comic kostet 3,80 €. Emil hat 7 €. Das Geld reicht für 2 Comics. Stimmt das?"
            say: "Ein Comic kostet drei Euro achtzig. Emil hat sieben Euro. Das Geld reicht für zwei Comics. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Was ist günstiger?", en: "Which is cheaper?" }
    goal:
      de: "Vergleiche Preise und Angebote und rechne nach, was günstiger ist, so wie 3 Hefte im Angebot."
      en: "Compare prices and offers and work out which is cheaper, like 3 exercise books on offer."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ein Heft kostet 0,90 €. Was kosten 3 Hefte?"
            say: "Ein Heft kostet neunzig Cent. Was kosten drei Hefte?"
            options: ["2,70 €", "3,90 €", "2,90 €"]
            answer: "2,70 €"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist weniger?"
            say: "Was ist weniger: zwei Euro siebzig oder drei Euro?"
            options: ["2,70 €", "3,00 €"]
            answer: "2,70 €"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Einzeln: 1 Heft 1,00 € | Angebot: 3 Hefte 2,70 €"
            say: "Im Laden kostet ein Heft einen Euro. Im Angebot gibt es drei Hefte für zwei Euro siebzig. Was ist günstiger, wenn du drei Hefte brauchst?"
          - text: "3 · 1,00 € = 3,00 € | 2,70 € < 3,00 €"
            say: "Drei einzelne Hefte kosten drei Euro. Das Angebot kostet zwei Euro siebzig. Das Angebot ist günstiger. Du sparst dreißig Cent."
          - text: "Ein Angebot ist nicht immer günstiger."
            say: "Rechne immer nach. Ein großes Paket oder ein Angebot ist nicht immer billiger."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ein Saft kostet einzeln 0,80 €. Ein 4er-Pack kostet 2,80 €. Was ist für 4 Säfte günstiger?"
                say: "Ein Saft kostet einzeln achtzig Cent. Ein Viererpack kostet zwei Euro achtzig. Was ist für vier Säfte günstiger?"
                options: ["der 4er-Pack", "4 einzelne Säfte", "beides kostet gleich viel"]
                answer: "der 4er-Pack"
                hints:
                  - "Rechne aus, was vier einzelne Säfte kosten."
                  - "Viermal achtzig Cent sind drei Euro zwanzig."
                  - "der 4er-Pack."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "4 einzelne Säfte kosten 3,20 €, der 4er-Pack 2,80 €. Wie viele Cent sparst du mit dem 4er-Pack?"
                say: "Vier einzelne Säfte kosten drei Euro zwanzig, der Viererpack zwei Euro achtzig. Wie viele Cent sparst du mit dem Viererpack?"
                answer: "40"
                hints:
                  - "Ziehe den kleineren Preis vom größeren ab."
                  - "Drei Euro zwanzig minus zwei Euro achtzig."
                  - "40 Cent."
              - id: l2-f3
                type: multiple_choice
                text: "Laden A: Ball 8,99 €. Laden B: Ball 9,49 €. Wo ist der Ball günstiger?"
                say: "Im Laden A kostet der Ball acht Euro neunundneunzig, im Laden B neun Euro neunundvierzig. Wo ist er günstiger?"
                options: ["Laden A", "Laden B", "gleich teuer"]
                answer: "Laden A"
                hints:
                  - "Vergleiche zuerst die Euro."
                  - "Acht Euro sind weniger als neun Euro."
                  - "Laden A."
              - id: l2-f4
                type: true_false
                text: "Ein Stift kostet 1,20 €. Ein 5er-Pack kostet 5,50 €. Ist der 5er-Pack günstiger als 5 einzelne Stifte?"
                say: "Ein Stift kostet einen Euro zwanzig. Ein Fünferpack kostet fünf Euro fünfzig. Ist der Fünferpack günstiger als fünf einzelne Stifte?"
                answer: true
                hints:
                  - "Rechne aus, was fünf einzelne Stifte kosten."
                  - "Fünfmal ein Euro zwanzig sind sechs Euro."
                  - "Ja, der Fünferpack ist günstiger."
              - id: l2-f5
                type: multiple_choice
                text: "Kino: Kind 5 €, Erwachsener 8 €, Familienkarte für 2 Erwachsene und 2 Kinder 24 €. Was ist für diese Familie günstiger?"
                say: "Im Kino zahlt ein Kind fünf Euro, ein Erwachsener acht Euro. Eine Familienkarte für zwei Erwachsene und zwei Kinder kostet vierundzwanzig Euro. Was ist für diese Familie günstiger?"
                options: ["die Familienkarte", "einzelne Karten", "beides kostet gleich viel"]
                answer: "die Familienkarte"
                hints:
                  - "Rechne aus, was einzelne Karten kosten."
                  - "Zweimal acht Euro und zweimal fünf Euro sind sechsundzwanzig Euro."
                  - "die Familienkarte."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ein Brötchen kostet 0,45 €. 6 Brötchen kosten im Angebot 2,40 €. Was ist für 6 Brötchen günstiger?"
                say: "Ein Brötchen kostet fünfundvierzig Cent. Sechs Brötchen kosten im Angebot zwei Euro vierzig. Was ist für sechs Brötchen günstiger?"
                options: ["das Angebot", "6 einzelne Brötchen", "beides kostet gleich viel"]
                answer: "das Angebot"
                hints: ["Sechs einzelne Brötchen kosten zwei Euro siebzig."]
              - id: l2-s2
                type: multiple_choice
                text: "Ein Joghurt kostet 0,50 €. Ein 4er-Pack kostet 2,20 €. Was ist für 4 Joghurts günstiger?"
                say: "Ein Joghurt kostet fünfzig Cent. Ein Viererpack kostet zwei Euro zwanzig. Was ist für vier Joghurts günstiger?"
                options: ["4 einzelne Joghurts", "der 4er-Pack", "beides kostet gleich viel"]
                answer: "4 einzelne Joghurts"
                hints: ["Rechne aus, was vier einzelne Joghurts kosten."]
              - id: l2-s3
                type: multiple_choice
                text: "Laden A: Buch 12,95 €. Laden B: Buch 12,59 €. Wo ist das Buch günstiger?"
                say: "Im Laden A kostet das Buch zwölf Euro fünfundneunzig, im Laden B zwölf Euro neunundfünfzig. Wo ist es günstiger?"
                options: ["Laden B", "Laden A", "gleich teuer"]
                answer: "Laden B"
                hints: ["Die Euro sind gleich. Vergleiche die Cent."]
              - id: l2-s4
                type: true_false
                text: "Eine Kugel Eis kostet 1,20 €. 3 Kugeln kosten im Becher 3,60 €. Sparst du mit dem Becher?"
                say: "Eine Kugel Eis kostet einen Euro zwanzig. Drei Kugeln im Becher kosten drei Euro sechzig. Sparst du mit dem Becher?"
                answer: false
                hints: ["Was kosten drei einzelne Kugeln?"]
              - id: l2-s5
                type: text_input
                text: "Ein Heft kostet 1,10 €. 5 Hefte kosten im Angebot 4,80 €. Wie viele Cent sparst du?"
                say: "Ein Heft kostet einen Euro zehn. Fünf Hefte kosten im Angebot vier Euro achtzig. Wie viele Cent sparst du mit dem Angebot?"
                answer: "70"
                hints: ["Fünf einzelne Hefte kosten fünf Euro fünfzig."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ein Apfel kostet 0,30 €. Eine Tüte mit 10 Äpfeln kostet 2,50 €. Was ist für 10 Äpfel günstiger?"
                say: "Ein Apfel kostet dreißig Cent. Eine Tüte mit zehn Äpfeln kostet zwei Euro fünfzig. Was ist für zehn Äpfel günstiger?"
                options: ["die Tüte", "10 einzelne Äpfel", "beides kostet gleich viel"]
                answer: "die Tüte"
              - id: l2-n2
                type: multiple_choice
                text: "Eine Flasche Wasser kostet 0,60 €. Ein 6er-Pack kostet 3,60 €. Was ist für 6 Flaschen günstiger?"
                say: "Eine Flasche Wasser kostet sechzig Cent. Ein Sechserpack kostet drei Euro sechzig. Was ist für sechs Flaschen günstiger?"
                options: ["beides kostet gleich viel", "der 6er-Pack", "6 einzelne Flaschen"]
                answer: "beides kostet gleich viel"
              - id: l2-n3
                type: multiple_choice
                text: "Laden A: Mütze 9,90 €. Laden B: Mütze 10,09 €. Wo ist die Mütze günstiger?"
                say: "Im Laden A kostet die Mütze neun Euro neunzig, im Laden B zehn Euro neun. Wo ist sie günstiger?"
                options: ["Laden A", "Laden B", "gleich teuer"]
                answer: "Laden A"
              - id: l2-n4
                type: true_false
                text: "Eine Postkarte kostet 0,95 €. 4 Postkarten kosten im Angebot 3,50 €. Ist das Angebot günstiger?"
                say: "Eine Postkarte kostet fünfundneunzig Cent. Vier Postkarten kosten im Angebot drei Euro fünfzig. Ist das Angebot günstiger?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "Ein Kind zahlt 4 € Eintritt. Die Gruppenkarte für 10 Kinder kostet 35 €. Wie viel Euro spart die Gruppe?"
                say: "Ein Kind zahlt vier Euro Eintritt. Eine Gruppenkarte für zehn Kinder kostet fünfunddreißig Euro. Wie viel Euro spart die Gruppe?"
                answer: "5"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
