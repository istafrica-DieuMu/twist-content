# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.functional-tables
skill: math.patterns.functional-tables
curriculum: de-DE
language: de
title:
  de: Tabellen mit Menge und Preis
  en: Tables of quantity and price
summary: >
  Lesson 1 reads and fills price tables (1 Heft 3 €, 4 Hefte 12 €), works
  out the price of one from the price of several, and doubles the price
  when the amount doubles; lesson 2 uses the same tables for eggs in
  boxes, legs, litres per minute, joins two columns (2 Hefte und 3 Hefte
  sind 5 Hefte) and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Zusammenhänge, en: Relationships }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.all-tables, math.money.amounts-to-100]
  also_practises: [math.mult-div.all-tables]
  vocabulary: { de: [Tabelle, Anzahl, Preis, Spalte, doppelt so viel, ergänzen] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: fill, what: { de: fehlende Werte in einer Tabelle ergänzen, en: filling in missing values in a table } }
    - { id: one, what: { de: den Wert für eins finden, en: finding the value for one } }
    - { id: check, what: { de: "prüfen, ob eine Tabelle stimmt", en: checking whether a table is right } }
    - { id: combine, what: { de: Spalten zusammennehmen oder verdoppeln, en: joining or doubling columns } }
  misconceptions:
    - id: adds-not-multiplies
      what: Goes on by adding 1 or a fixed amount from column to column instead of the price of one (3 Hefte 9 €, so 4 Hefte 10 €), or adds when the amount doubles
      addressed: lesson 1 Learn adds the price of one for each Heft and doubles with the amount; l1-f1 and l2-f4 have feedback on the added step; l1-f4, l2-f5, l2-s5 and l2-c4 ask whether a table with a wrong step is right
    - id: total-as-unit-price
      what: Takes the price of several as the price of one, or halves when it should divide by three or more
      addressed: l1-f3 has feedback on taking the price of two as the price of one; l1-s3, l1-n2, l2-s2, l2-n2 and l2-c2 ask for the value of one from a column of three, four or two
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Preistabellen", en: "Price tables" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "6 · 4 = _"
            say: "Sechs mal vier."
            answer: "24"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Ein Apfel kostet 20 ct. Was kosten 3 Äpfel?"
            say: "Ein Apfel kostet zwanzig Cent. Was kosten drei Äpfel?"
            options: ["60 ct", "23 ct", "80 ct"]
            answer: "60 ct"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Hefte | 1 | 2 | 3 | 4\nPreis | 2 € | 4 € | 6 € | 8 €"
            say: "Ein Heft kostet zwei Euro. Zwei Hefte kosten vier Euro. Für jedes Heft mehr kommen zwei Euro dazu. Die Tabelle zeigt, wie die Anzahl und der Preis zusammenhängen."
          - text: "Hefte | 1 | 2 | 3 | 4 | 5\nPreis | 2 € | 4 € | 6 € | 8 € | _\n5 · 2 € = 10 €"
            say: "Was kosten fünf Hefte? Du musst nicht weiterzählen. Rechne fünf mal den Preis für ein Heft: fünf mal zwei Euro sind zehn Euro."
          - text: "Stifte | 2 | 4 | 8\nPreis | 3 € | 6 € | 12 €"
            say: "Zwei Stifte kosten drei Euro. Vier Stifte sind doppelt so viele. Also kosten sie auch doppelt so viel, sechs Euro. Acht Stifte kosten wieder doppelt so viel: zwölf Euro."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was kosten 4 Hefte?\nHefte | 1 | 2 | 3 | 4\nPreis | 3 € | 6 € | 9 € | _"
                say: "Ein Heft kostet drei Euro. Was kosten vier Hefte?"
                options: ["12 €", "10 €", "11 €"]
                answer: "12 €"
                feedback:
                  "10 €": "Du hast 1 € dazugezählt. Für jedes Heft kommen aber 3 € dazu."
                  "11 €": "Für jedes Heft kommen 3 € dazu, nicht 2 €."
                hints:
                  - "Schau, wie viel für jedes Heft dazukommt."
                  - "Von Spalte zu Spalte kommen 3 € dazu: 9 € + 3 €."
                  - "12 €."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Was kosten 5 Brötchen?\nBrötchen | 1 | 2 | 3 | 5\nPreis in ct | 40 | 80 | 120 | _"
                say: "Ein Brötchen kostet vierzig Cent. Was kosten fünf Brötchen? Gib den Preis in Cent ein."
                answer: "200"
                hints:
                  - "Nimm den Preis für ein Brötchen."
                  - "Rechne 5 · 40 ct."
                  - "200."
              - id: l1-f3
                type: multiple_choice
                text: "Was kostet 1 Ball?\nBälle | 1 | 2 | 3\nPreis | _ | 10 € | 15 €"
                say: "Zwei Bälle kosten zehn Euro, drei Bälle fünfzehn Euro. Was kostet ein Ball?"
                options: ["5 €", "10 €", "2 €"]
                answer: "5 €"
                feedback:
                  "10 €": "10 € kosten zwei Bälle. Ein Ball kostet die Hälfte."
                hints:
                  - "Zwei Bälle kosten 10 €."
                  - "Ein Ball kostet die Hälfte davon: 10 € : 2."
                  - "5 €."
              - id: l1-f4
                type: true_false
                text: "Stimmt die Tabelle?\nKerzen | 2 | 4 | 8\nPreis | 5 € | 10 € | 15 €"
                say: "Stimmt die Tabelle? Zwei Kerzen kosten fünf Euro, vier Kerzen zehn Euro und acht Kerzen fünfzehn Euro."
                answer: false
                hints:
                  - "Von 4 auf 8 Kerzen verdoppelt sich die Anzahl."
                  - "Dann verdoppelt sich auch der Preis: 10 € · 2."
                  - "Nein. 8 Kerzen kosten 20 €."
              - id: l1-f5
                type: fill_in_blank
                text: "Ergänze die Tabelle.\nSticker | 1 | 2 | 3 | 4\nPreis in ct | 20 | _ | 60 | _"
                say: "Ein Sticker kostet zwanzig Cent. Ergänze die Preise für zwei und für vier Sticker."
                frame: "2 Sticker: _ ct | 4 Sticker: _ ct"
                options: ["40", "80", "70", "30"]
                answer: ["40", "80"]
                hints:
                  - "Ein Sticker kostet 20 ct."
                  - "Rechne 2 · 20 und 4 · 20."
                  - "40 und 80."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was kosten 6 Muffins?\nMuffins | 1 | 2 | 3 | 6\nPreis | 2 € | 4 € | 6 € | _"
                say: "Ein Muffin kostet zwei Euro. Was kosten sechs Muffins?"
                options: ["12 €", "8 €", "9 €"]
                answer: "12 €"
                hints: ["6 Muffins sind doppelt so viele wie 3 Muffins."]
              - id: l1-s2
                type: text_input
                text: "Was kosten 4 Kugeln Eis?\nKugeln | 1 | 2 | 3 | 4\nPreis in ct | 90 | 180 | 270 | _"
                say: "Eine Kugel Eis kostet neunzig Cent. Was kosten vier Kugeln? Gib den Preis in Cent ein."
                answer: "360"
                hints: ["Für jede Kugel kommen 90 ct dazu."]
              - id: l1-s3
                type: multiple_choice
                text: "Was kostet 1 Buch?\nBücher | 1 | 3 | 5\nPreis | _ | 21 € | 35 €"
                say: "Drei Bücher kosten einundzwanzig Euro. Was kostet ein Buch?"
                options: ["7 €", "18 €", "5 €"]
                answer: "7 €"
                hints: ["Teile den Preis für 3 Bücher durch 3."]
              - id: l1-s4
                type: true_false
                text: "3 Hefte kosten 6 €. Dann kosten 6 Hefte 12 €."
                say: "Drei Hefte kosten sechs Euro. Dann kosten sechs Hefte zwölf Euro. Stimmt das?"
                answer: true
                hints: ["Doppelt so viele Hefte kosten doppelt so viel."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Zahl fehlt?\nÄpfel | 2 | 4 | 6 | 8\nPreis in ct | 50 | 100 | _ | 200"
                say: "Welche Zahl fehlt in der Tabelle?"
                options: ["150", "120", "300"]
                answer: "150"
                hints: ["Für 2 Äpfel mehr kommen 50 ct dazu."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Was kosten 7 Hefte?\nHefte | 1 | 2 | 7\nPreis | 3 € | 6 € | _"
                say: "Ein Heft kostet drei Euro. Was kosten sieben Hefte? Gib den Preis in Euro ein."
                answer: "21"
              - id: l1-n2
                type: multiple_choice
                text: "Was kostet 1 Brezel?\nBrezeln | 1 | 4 | 5\nPreis in ct | _ | 240 | 300"
                say: "Vier Brezeln kosten zweihundertvierzig Cent. Was kostet eine Brezel?"
                options: ["60 ct", "40 ct", "80 ct"]
                answer: "60 ct"
              - id: l1-n3
                type: multiple_choice
                text: "Was kosten 8 Stifte?\nStifte | 2 | 4 | 8\nPreis | 3 € | 6 € | _"
                say: "Zwei Stifte kosten drei Euro, vier Stifte sechs Euro. Was kosten acht Stifte?"
                options: ["12 €", "9 €", "10 €"]
                answer: "12 €"
              - id: l1-n4
                type: true_false
                text: "Stimmt die Tabelle?\nKarten | 1 | 2 | 3\nPreis in ct | 80 | 160 | 240"
                say: "Stimmt die Tabelle? Eine Karte kostet achtzig Cent, zwei Karten hundertsechzig Cent und drei Karten zweihundertvierzig Cent."
                answer: true
              - id: l1-n5
                type: text_input
                text: "Leon kauft 9 Sticker. Ein Sticker kostet 20 ct. Wie viel Cent zahlt er?"
                say: "Leon kauft neun Sticker. Ein Sticker kostet zwanzig Cent. Wie viel Cent zahlt er?"
                answer: "180"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Was kosten 6 Bälle?\nBälle | 1 | 2 | 6\nPreis | 4 € | 8 € | _"
            say: "Ein Ball kostet vier Euro. Was kosten sechs Bälle? Gib den Preis in Euro ein."
            answer: "24"
          - id: l1-c2
            type: multiple_choice
            text: "Was kostet 1 Heft?\nHefte | 1 | 2 | 4\nPreis | _ | 6 € | 12 €"
            say: "Zwei Hefte kosten sechs Euro. Was kostet ein Heft?"
            options: ["3 €", "6 €", "2 €"]
            answer: "3 €"
          - id: l1-c3
            type: true_false
            text: "4 Brötchen kosten 2 €. Dann kosten 8 Brötchen 3 €."
            say: "Vier Brötchen kosten zwei Euro. Dann kosten acht Brötchen drei Euro. Stimmt das?"
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "Ergänze die Tabelle.\nHefte | 1 | 2 | 3 | 5\nPreis | 4 € | _ | 12 € | _"
            say: "Ein Heft kostet vier Euro. Ergänze die Preise für zwei und für fünf Hefte."
            frame: "2 Hefte: _ € | 5 Hefte: _ €"
            options: ["8", "20", "16", "9"]
            answer: ["8", "20"]
          - id: l1-c5
            type: multiple_choice
            text: "Was kostet 1 Saft?\nSäfte | 1 | 3 | 4\nPreis in ct | _ | 150 | 200"
            say: "Drei Säfte kosten hundertfünfzig Cent. Was kostet ein Saft?"
            options: ["50 ct", "150 ct", "30 ct"]
            answer: "50 ct"
          - id: l1-c6
            type: true_false
            text: "Stimmt die Tabelle?\nBälle | 2 | 4 | 8\nPreis | 7 € | 14 € | 28 €"
            say: "Stimmt die Tabelle? Zwei Bälle kosten sieben Euro, vier Bälle vierzehn Euro und acht Bälle achtundzwanzig Euro."
            answer: true

  - n: 2
    title: { de: "Tabellen ergänzen", en: "Completing tables" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Was kosten 3 Hefte?\nHefte | 1 | 2 | 3\nPreis | 5 € | 10 € | _"
            say: "Ein Heft kostet fünf Euro. Was kosten drei Hefte? Gib den Preis in Euro ein."
            answer: "15"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was kostet 1 Kugel Eis?\nKugeln | 1 | 2 | 3\nPreis in ct | _ | 140 | 210"
            say: "Zwei Kugeln Eis kosten hundertvierzig Cent. Was kostet eine Kugel?"
            options: ["70 ct", "140 ct", "60 ct"]
            answer: "70 ct"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Packungen | 1 | 2 | 3 | 4\nEier | 6 | 12 | 18 | 24"
            say: "Solche Tabellen gibt es nicht nur beim Einkaufen. In einer Packung sind sechs Eier. Für jede Packung mehr kommen sechs Eier dazu. In der unteren Zeile steht die Sechserreihe."
          - text: "Packungen | 1 | 2 | 3 | 5\nEier | 6 | 12 | 18 | _\n2 Packungen + 3 Packungen = 5 Packungen\n12 + 18 = 30"
            say: "Wie viele Eier sind in fünf Packungen? Du kannst fünf mal sechs rechnen. Oder du nimmst die Spalten für zwei und für drei Packungen zusammen: zwölf plus achtzehn sind dreißig Eier."
          - text: "Minuten | 1 | 2 | 5\nLiter | 8 | 16 | 40"
            say: "Aus einem Wasserhahn laufen in einer Minute acht Liter. In zwei Minuten sind es sechzehn Liter, in fünf Minuten fünf mal acht, also vierzig Liter. Prüf jede Spalte mit der ersten: Passt sie dazu?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: text_input
                text: "Wie viele Eier sind in 4 Packungen?\nPackungen | 1 | 2 | 3 | 4\nEier | 10 | 20 | 30 | _"
                say: "In einer Packung sind zehn Eier. Wie viele Eier sind in vier Packungen?"
                answer: "40"
                hints:
                  - "Für jede Packung kommen 10 Eier dazu."
                  - "Rechne 30 + 10 oder 4 · 10."
                  - "40."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie viele Beine haben 5 Hunde?\nHunde | 1 | 2 | 3 | 5\nBeine | 4 | 8 | 12 | _"
                say: "Ein Hund hat vier Beine. Wie viele Beine haben fünf Hunde?"
                options: ["20", "16", "13"]
                answer: "20"
                feedback:
                  "16": "16 Beine haben 4 Hunde. Es sind aber 5 Hunde."
                  "13": "Du hast 1 dazugezählt. Jeder Hund hat 4 Beine."
                hints:
                  - "Jeder Hund hat 4 Beine."
                  - "Rechne 5 · 4."
                  - "20."
              - id: l2-f3
                type: fill_in_blank
                text: "Ergänze die Tabelle.\nKisten | 1 | 2 | 4 | 8\nFlaschen | 6 | 12 | _ | _"
                say: "In einer Kiste sind sechs Flaschen. Ergänze die Flaschen für vier und für acht Kisten."
                frame: "4 Kisten: _ Flaschen | 8 Kisten: _ Flaschen"
                options: ["24", "48", "18", "36"]
                answer: ["24", "48"]
                hints:
                  - "Die Anzahl der Kisten verdoppelt sich."
                  - "Dann verdoppeln sich auch die Flaschen: 12 · 2 und 24 · 2."
                  - "24 und 48."
              - id: l2-f4
                type: multiple_choice
                text: "Was kosten 5 Hefte?\nHefte | 2 | 3 | 5\nPreis | 8 € | 12 € | _"
                say: "Zwei Hefte kosten acht Euro, drei Hefte zwölf Euro. Was kosten fünf Hefte?"
                options: ["20 €", "16 €", "17 €"]
                answer: "20 €"
                feedback:
                  "16 €": "Von 3 Heften auf 5 Hefte sind es 2 Hefte mehr, nicht eins."
                  "17 €": "Du hast nur 5 € dazugezählt. Nimm die Spalten für 2 und für 3 Hefte zusammen."
                hints:
                  - "5 Hefte sind 2 Hefte und 3 Hefte."
                  - "Rechne 8 € + 12 €."
                  - "20 €."
              - id: l2-f5
                type: true_false
                text: "Stimmt die Tabelle?\nMinuten | 1 | 2 | 3 | 4\nLiter | 5 | 10 | 15 | 25"
                say: "Stimmt die Tabelle? In einer Minute laufen fünf Liter, in zwei Minuten zehn, in drei Minuten fünfzehn und in vier Minuten fünfundzwanzig Liter."
                answer: false
                hints:
                  - "Jede Minute kommen 5 Liter dazu."
                  - "Nach 15 Litern kommen 5 Liter dazu."
                  - "Nein. In 4 Minuten sind es 20 Liter."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "Wie viele Räder haben 6 Fahrräder?\nFahrräder | 1 | 2 | 3 | 6\nRäder | 2 | 4 | 6 | _"
                say: "Ein Fahrrad hat zwei Räder. Wie viele Räder haben sechs Fahrräder?"
                answer: "12"
                hints: ["Jedes Fahrrad hat 2 Räder."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie viele Kekse sind in 1 Tüte?\nTüten | 1 | 2 | 3\nKekse | _ | 16 | 24"
                say: "In zwei Tüten sind sechzehn Kekse. Wie viele Kekse sind in einer Tüte?"
                options: ["8", "16", "6"]
                answer: "8"
                hints: ["16 Kekse sind in 2 Tüten."]
              - id: l2-s3
                type: text_input
                text: "Wie viele Stühle stehen an 7 Tischen?\nTische | 1 | 2 | 7\nStühle | 4 | 8 | _"
                say: "An einem Tisch stehen vier Stühle. Wie viele Stühle stehen an sieben Tischen?"
                answer: "28"
                hints: ["An jedem Tisch stehen 4 Stühle."]
              - id: l2-s4
                type: multiple_choice
                text: "Mia liest jeden Tag gleich viele Seiten. Welche Zahl fehlt?\nTage | 1 | 2 | 4 | 8\nSeiten | 5 | 10 | _ | 40"
                say: "Mia liest jeden Tag gleich viele Seiten. Welche Zahl fehlt in der Tabelle?"
                options: ["20", "15", "30"]
                answer: "20"
                hints: ["4 Tage sind doppelt so viele wie 2 Tage."]
              - id: l2-s5
                type: true_false
                text: "Stimmt die Tabelle?\nKörbe | 1 | 2 | 3\nÄpfel | 9 | 18 | 28"
                say: "Stimmt die Tabelle? In einem Korb sind neun Äpfel, in zwei Körben achtzehn und in drei Körben achtundzwanzig."
                answer: false
                hints: ["Rechne 3 · 9."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Wie viele Beine haben 4 Spinnen?\nSpinnen | 1 | 2 | 4\nBeine | 8 | 16 | _"
                say: "Eine Spinne hat acht Beine. Wie viele Beine haben vier Spinnen?"
                answer: "32"
              - id: l2-n2
                type: multiple_choice
                text: "Wie viele Stifte sind in 1 Packung?\nPackungen | 1 | 3 | 4\nStifte | _ | 30 | 40"
                say: "In drei Packungen sind dreißig Stifte. Wie viele Stifte sind in einer Packung?"
                options: ["10", "30", "3"]
                answer: "10"
              - id: l2-n3
                type: multiple_choice
                text: "Was kosten 5 Kugeln Eis?\nKugeln | 2 | 3 | 5\nPreis in ct | 160 | 240 | _"
                say: "Zwei Kugeln Eis kosten hundertsechzig Cent, drei Kugeln zweihundertvierzig Cent. Was kosten fünf Kugeln?"
                options: ["400 ct", "320 ct", "300 ct"]
                answer: "400 ct"
              - id: l2-n4
                type: fill_in_blank
                text: "Ergänze die Tabelle.\nMinuten | 1 | 2 | 3 | 4\nLiter | 7 | 14 | _ | _"
                say: "In einer Minute laufen sieben Liter. Ergänze die Liter für drei und für vier Minuten."
                frame: "3 Minuten: _ Liter | 4 Minuten: _ Liter"
                options: ["21", "28", "15", "16"]
                answer: ["21", "28"]
              - id: l2-n5
                type: text_input
                text: "Ein Bus fährt jeden Tag 9 Runden. Wie viele Runden fährt er in 6 Tagen?"
                say: "Ein Bus fährt jeden Tag neun Runden. Wie viele Runden fährt er in sechs Tagen?"
                answer: "54"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: fill
            type: text_input
            text: "Was kosten 4 Bälle?\nBälle | 1 | 2 | 4\nPreis | 6 € | 12 € | _"
            say: "Ein Ball kostet sechs Euro. Was kosten vier Bälle? Gib den Preis in Euro ein."
            answer: "24"
          - id: l2-c2
            part: one
            type: multiple_choice
            text: "Wie viele Eier sind in 1 Packung?\nPackungen | 1 | 2 | 5\nEier | _ | 12 | 30"
            say: "In zwei Packungen sind zwölf Eier. Wie viele Eier sind in einer Packung?"
            options: ["6", "12", "5"]
            answer: "6"
          - id: l2-c3
            part: fill
            type: fill_in_blank
            text: "Ergänze die Tabelle.\nKisten | 1 | 2 | 3 | 6\nFlaschen | 4 | 8 | _ | _"
            say: "In einer Kiste sind vier Flaschen. Ergänze die Flaschen für drei und für sechs Kisten."
            frame: "3 Kisten: _ Flaschen | 6 Kisten: _ Flaschen"
            options: ["12", "24", "10", "16"]
            answer: ["12", "24"]
          - id: l2-c4
            part: check
            type: true_false
            text: "Stimmt die Tabelle?\nHefte | 1 | 2 | 4\nPreis | 3 € | 6 € | 9 €"
            say: "Stimmt die Tabelle? Ein Heft kostet drei Euro, zwei Hefte sechs Euro und vier Hefte neun Euro."
            answer: false
          - id: l2-c5
            part: combine
            type: multiple_choice
            text: "Was kosten 5 Brezeln?\nBrezeln | 2 | 3 | 5\nPreis in ct | 120 | 180 | _"
            say: "Zwei Brezeln kosten hundertzwanzig Cent, drei Brezeln hundertachtzig Cent. Was kosten fünf Brezeln?"
            options: ["300 ct", "240 ct", "200 ct"]
            answer: "300 ct"
          - id: l2-c6
            part: fill
            type: text_input
            text: "Was kosten 8 Hefte?\nHefte | 1 | 2 | 8\nPreis | 2 € | 4 € | _"
            say: "Ein Heft kostet zwei Euro. Was kosten acht Hefte? Gib den Preis in Euro ein."
            answer: "16"
          - id: l2-c7
            part: fill
            type: fill_in_blank
            text: "Ergänze die Tabelle.\nTische | 1 | 2 | 3 | 5\nBeine | 4 | _ | 12 | _"
            say: "Ein Tisch hat vier Beine. Ergänze die Beine für zwei und für fünf Tische."
            frame: "2 Tische: _ Beine | 5 Tische: _ Beine"
            options: ["8", "20", "16", "6"]
            answer: ["8", "20"]
          - id: l2-c8
            part: fill
            type: multiple_choice
            text: "Wie viele Liter sind es in 6 Minuten?\nMinuten | 1 | 2 | 6\nLiter | 9 | 18 | _"
            say: "In einer Minute laufen neun Liter. Wie viele Liter sind es in sechs Minuten?"
            options: ["54", "27", "45"]
            answer: "54"
          - id: l2-c9
            part: one
