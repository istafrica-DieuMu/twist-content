            answer: "90 : 9 + 45 : 9"
          - id: l2-c13
            part: divide
            type: text_input
            text: "128 : 4 = _"
            say: "Hundertachtundzwanzig geteilt durch vier."
            answer: "32"
          - id: l2-c14
            part: divide
            type: text_input
            text: "Beim Sportfest werden 108 Kinder auf 9 gleich große Teams verteilt. Wie viele Kinder sind in jedem Team?"
            say: "Beim Sportfest werden hundertacht Kinder auf neun gleich große Teams verteilt. Wie viele Kinder sind in jedem Team?"
            answer: "12"
          - id: l2-c15
            part: divide
