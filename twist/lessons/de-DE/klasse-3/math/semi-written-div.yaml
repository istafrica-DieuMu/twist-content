# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.semi-written-div
skill: math.mult-div-larger.semi-written-div
curriculum: de-DE
language: de
title:
  de: Halbschriftlich teilen
  en: Dividing in steps
summary: >
  Dividing by a one-digit number with the steps written down. Lesson 1
  splits the number into parts that divide easily (96 : 4 = 80 : 4 +
  16 : 4) and checks with the Probe; lesson 2 divides three-digit numbers
  and numbers that leave a Rest (97 : 4 = 24 Rest 1), and ends with the
  skill check.
metadata:
  year: klasse-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.semi-written-mult, math.mult-div.remainder]
  also_practises: [math.mult-div-larger.tens, math.mult-div.remainder]
  vocabulary: { de: [halbschriftlich, zerlegen, Teilaufgabe, Rest, Probe] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: split, what: { de: die Zahl geschickt zerlegen und in Teilaufgaben teilen, en: splitting the number well and dividing in steps } }
    - { id: divide, what: { de: zwei- und dreistellige Zahlen durch eine einstellige Zahl teilen, en: dividing two- and three-digit numbers by a one-digit number } }
    - { id: rest, what: { de: mit Rest teilen und die Probe machen, en: dividing with a remainder and checking } }
  misconceptions:
    - id: split-by-place
      what: "Splits into Zehner and Einer even when the parts do not divide (78 : 6 as 70 : 6 + 8 : 6)"
      addressed: "lesson 1 Learn picks 80 and 16 for 96 : 4; \"Wie zerlegst du …?\" in every stage of lesson 1 offers the place-value split as a wrong option"
    - id: rest-too-big
      what: "Leaves a Rest as big as or bigger than the divisor (49 : 3 = 15 Rest 4)"
      addressed: lesson 2 Learn finishes the Rest; l2-s4 asks whether 15 Rest 4 is right; the chips in l2-c3 also make 21 Rest 4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Geschickt zerlegen", en: "Splitting to divide" }
    goal:
      de: "Zerlege die Zahl in Teile, die sich gut teilen lassen, so wie 96 in 80 und 16. Mach dann die Probe."
      en: "Split the number into parts that divide easily, like 96 into 80 and 16. Then check your answer."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "80 : 4 = _"
            say: "Achtzig geteilt durch vier."
            answer: "20"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "18 : 6 = _"
            say: "Achtzehn geteilt durch sechs."
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "96 : 4 = ?"
            say: "Sechsundneunzig geteilt durch vier. Die Sechsundneunzig steht nicht im kleinen Einmaleins. Was glaubst du: Kannst du sie in zwei Zahlen zerlegen, die du leicht durch vier teilen kannst?"
          - text: "96 : 4 = 80 : 4 + 16 : 4"
            say: "Ja, das geht! Zerlege sechsundneunzig so, dass sich beide Teile gut durch vier teilen lassen: achtzig und sechzehn."
          - text: "80 : 4 = 20\n16 : 4 = 4\n20 + 4 = 24"
            say: "Achtzig geteilt durch vier ist zwanzig. Sechzehn geteilt durch vier ist vier. Zusammen sind das vierundzwanzig."
          - text: "Probe: 4 · 24 = 96"
            say: "Mit der Probe prüfst du dein Ergebnis: Vier mal vierundzwanzig ist sechsundneunzig. Es stimmt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Vierundachtzig geteilt durch drei. Rechne Schritt für Schritt."
                frame: "60 : 3 = _ | 24 : 3 = _ | 84 : 3 = _"
                options: ["20", "8", "28", "82"]
                answer: ["20", "8", "28"]
                hints:
                  - "Teile beide Teile durch drei."
                  - "Sechs Zehner geteilt durch drei sind zwei Zehner. Dann vierundzwanzig geteilt durch drei, und zum Schluss zählst du beides zusammen."
                  - "20, 8 und 28."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie zerlegst du 78 für 78 : 6?"
                say: "Achtundsiebzig geteilt durch sechs. Wie zerlegst du achtundsiebzig?"
                options: ["60 + 18", "70 + 8", "50 + 28"]
                answer: "60 + 18"
                feedback:
                  "70 + 8": "Siebzig lässt sich nicht ohne Rest durch sechs teilen. Such eine Zahl aus der Sechserreihe mal zehn."
                hints:
                  - "Welche Zehnerzahl kannst du gut durch sechs teilen?"
                  - "Sechzig geteilt durch sechs ist zehn. Was bleibt dann übrig?"
                  - "60 + 18."
              - id: l1-f3
                type: text_input
                text: "72 : 4 = _"
                say: "Zweiundsiebzig geteilt durch vier."
                answer: "18"
                hints:
                  - "Zerlege in vierzig und zweiunddreißig."
                  - "Vierzig geteilt durch vier ist zehn, zweiunddreißig geteilt durch vier ist acht."
                  - "18."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 91 : 7 = 13"
                say: "Einundneunzig geteilt durch sieben ist dreizehn. Stimmt das?"
                answer: true
                hints:
                  - "Mach die Probe."
                  - "Sieben mal dreizehn: siebzig und einundzwanzig."
                  - "Ja, 7 · 13 = 91."
              - id: l1-f5
                type: text_input
                text: "68 Stifte werden gerecht auf 4 Becher verteilt. Wie viele Stifte kommen in jeden Becher?"
                say: "Achtundsechzig Stifte werden gerecht auf vier Becher verteilt. Wie viele Stifte kommen in jeden Becher?"
                show: { object: crayon, count: 1 }
                answer: "17"
                hints:
                  - "Welche Geteiltaufgabe passt?"
                  - "Achtundsechzig geteilt durch vier: vierzig und achtundzwanzig."
                  - "17 Stifte."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Fünfundachtzig geteilt durch fünf. Rechne Schritt für Schritt."
                frame: "50 : 5 = _ | 35 : 5 = _ | 85 : 5 = _"
                options: ["10", "7", "17", "15"]
                answer: ["10", "7", "17"]
                hints: ["Teile beide Teile durch fünf."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie zerlegst du 92 für 92 : 4?"
                say: "Zweiundneunzig geteilt durch vier. Wie zerlegst du zweiundneunzig?"
                options: ["80 + 12", "90 + 2", "70 + 22"]
                answer: "80 + 12"
                hints: ["Welche Zehnerzahl kannst du gut durch vier teilen?"]
              - id: l1-s3
                type: text_input
                text: "87 : 3 = _"
                say: "Siebenundachtzig geteilt durch drei."
                answer: "29"
                hints: ["Zerlege in sechzig und siebenundzwanzig."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 64 : 4 = 14"
                say: "Vierundsechzig geteilt durch vier ist vierzehn. Stimmt das?"
                answer: false
                feedback:
                  "true": "Vier mal vierzehn ist nur sechsundfünfzig. Dann wären acht übrig geblieben! Richtig ist sechzehn."
                hints: ["Mach die Probe: vier mal vierzehn."]
              - id: l1-s5
                type: text_input
                text: "Ein Band ist 90 cm lang. Es wird in 6 gleich lange Stücke geschnitten. Wie viele cm ist ein Stück lang?"
                say: "Ein Band ist neunzig Zentimeter lang. Es wird in sechs gleich lange Stücke geschnitten. Wie viele Zentimeter ist ein Stück lang?"
                answer: "15"
                hints: ["Neunzig geteilt durch sechs: sechzig und dreißig."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Achtundneunzig geteilt durch sieben. Rechne Schritt für Schritt."
                frame: "70 : 7 = _ | 28 : 7 = _ | 98 : 7 = _"
                options: ["10", "4", "14", "12"]
                answer: ["10", "4", "14"]
              - id: l1-n2
                type: multiple_choice
                text: "Wie zerlegst du 76 für 76 : 4?"
                say: "Sechsundsiebzig geteilt durch vier. Wie zerlegst du sechsundsiebzig?"
                options: ["40 + 36", "70 + 6", "50 + 26"]
                answer: "40 + 36"
              - id: l1-n3
                type: text_input
                text: "96 : 8 = _"
                say: "Sechsundneunzig geteilt durch acht."
                answer: "12"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 75 : 5 = 15"
                say: "Fünfundsiebzig geteilt durch fünf ist fünfzehn. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "84 Kinder bilden Gruppen mit je 6 Kindern. Wie viele Gruppen gibt es?"
                say: "Vierundachtzig Kinder bilden Gruppen mit je sechs Kindern. Wie viele Gruppen gibt es?"
                show: { object: child, count: 6, layout: row }
                answer: "14"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "57 : 3 = _"
            say: "Siebenundfünfzig geteilt durch drei."
            answer: "19"
          - id: l1-c2
            type: text_input
            text: "65 : 5 = _"
            say: "Fünfundsechzig geteilt durch fünf."
            answer: "13"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 81 : 3 = 37"
            say: "Einundachtzig geteilt durch drei ist siebenunddreißig. Stimmt das?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Wie zerlegst du 96 für 96 : 8?"
            say: "Sechsundneunzig geteilt durch acht. Wie zerlegst du sechsundneunzig?"
            options: ["80 + 16", "90 + 6", "70 + 26"]
            answer: "80 + 16"
          - id: l1-c5
            type: fill_in_blank
            text: "Rechne Schritt für Schritt."
            say: "Fünfundneunzig geteilt durch fünf. Rechne Schritt für Schritt."
            frame: "80 : 5 = _ | 15 : 5 = _ | 95 : 5 = _"
            options: ["16", "3", "19", "13"]
            answer: ["16", "3", "19"]
          - id: l1-c6
            type: text_input
            text: "Lukas verteilt 72 Murmeln gerecht auf 3 Säckchen. Wie viele Murmeln kommen in jedes Säckchen?"
            say: "Lukas verteilt zweiundsiebzig Murmeln gerecht auf drei Säckchen. Wie viele Murmeln kommen in jedes Säckchen?"
            show: { object: marble, count: 1 }
            answer: "24"

  - n: 2
    title: { de: "Dreistellig und mit Rest", en: "Three digits and remainders" }
    goal:
      de: "Teil auch dreistellige Zahlen und Aufgaben mit Rest, so wie 97 geteilt durch 4 ist 24 Rest 1."
      en: "Divide three-digit numbers too, and sums with a remainder, like 97 divided by 4 is 24 remainder 1."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "84 : 6 = _"
            say: "Vierundachtzig geteilt durch sechs."
            answer: "14"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "54 : 3 = _"
            say: "Vierundfünfzig geteilt durch drei."
            answer: "18"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "156 : 6 = ? Klappt der Trick auch hier?"
            say: "Hundertsechsundfünfzig geteilt durch sechs. Das ist eine dreistellige Zahl. Was glaubst du: Klappt das Zerlegen auch hier?"
          - text: "156 : 6 = 120 : 6 + 36 : 6 = 20 + 6 = 26"
            say: "Ja, es klappt! Auch dreistellige Zahlen zerlegst du so: hundertsechsundfünfzig in hundertzwanzig und sechsunddreißig. Zwanzig plus sechs ist sechsundzwanzig."
          - text: "97 : 4 = 80 : 4 + 17 : 4 = 20 + 4 Rest 1 = 24 Rest 1"
            say: "Manchmal bleibt ein Rest. Siebzehn geteilt durch vier ist vier Rest eins. Also ist siebenundneunzig geteilt durch vier vierundzwanzig Rest eins."
          - text: "Probe: 4 · 24 + 1 = 97"
            say: "Bei der Probe zählst du den Rest dazu: Vier mal vierundzwanzig plus eins ist siebenundneunzig."
          - text: "Wusstest du? Die Erde braucht für eine Runde um die Sonne 365 Tage und fast 6 Stunden. Die 6 Stunden sind ein Rest."
            say: "Wusstest du? Die Erde braucht für eine Runde um die Sonne dreihundertfünfundsechzig Tage und fast sechs Stunden. Diese sechs Stunden sind ein Rest, der übrig bleibt. Nach vier Jahren sind es vier mal sechs, also fast vierundzwanzig Stunden: ein ganzer Tag! Darum bekommt der Februar meistens alle vier Jahre einen Tag mehr, den neunundzwanzigsten."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Dreihundertfünfundvierzig geteilt durch fünf. Rechne Schritt für Schritt."
                frame: "300 : 5 = _ | 45 : 5 = _ | 345 : 5 = _"
                options: ["60", "9", "69", "96"]
                answer: ["60", "9", "69"]
                hints:
                  - "Teile beide Teile durch fünf."
                  - "Dreihundert sind dreißig Zehner. Wie viele Zehner sind dreißig Zehner geteilt durch fünf? Dann fünfundvierzig geteilt durch fünf."
                  - "60, 9 und 69."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Rechne mit Rest."
                say: "Neunundfünfzig geteilt durch vier, mit Rest."
                frame: "59 : 4 = _ Rest _"
                options: ["14", "3", "13", "4"]
                answer: ["14", "3"]
                hints:
                  - "Zerlege in vierzig und neunzehn."
                  - "Vierzig geteilt durch vier ist zehn. Wie oft passt die Vier in neunzehn, und was bleibt übrig?"
                  - "14 Rest 3."
              - id: l2-f3
                type: text_input
                text: "248 : 4 = _"
                say: "Zweihundertachtundvierzig geteilt durch vier."
                answer: "62"
                hints:
                  - "Zerlege in zweihundertvierzig und acht."
                  - "Zweihundertvierzig geteilt durch vier ist sechzig."
                  - "62."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 75 : 7 = 10 Rest 5"
                say: "Fünfundsiebzig geteilt durch sieben ist zehn Rest fünf. Stimmt das?"
                answer: true
                hints:
                  - "Mach die Probe mit dem Rest."
                  - "Sieben mal zehn ist siebzig, plus fünf."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: text_input
                text: "Eine Klasse sammelt 186 Kastanien und verteilt sie gerecht auf 6 Körbe. Wie viele Kastanien kommen in jeden Korb?"
                say: "Eine Klasse sammelt hundertsechsundachtzig Kastanien und verteilt sie gerecht auf sechs Körbe. Wie viele Kastanien kommen in jeden Korb?"
                answer: "31"
                hints:
                  - "Welche Geteiltaufgabe passt?"
                  - "Hundertachtzig geteilt durch sechs und sechs geteilt durch sechs."
                  - "31 Kastanien."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Zweihundertzweiundsiebzig geteilt durch acht. Rechne Schritt für Schritt."
                frame: "240 : 8 = _ | 32 : 8 = _ | 272 : 8 = _"
                options: ["30", "4", "34", "43"]
                answer: ["30", "4", "34"]
                hints: ["Teile beide Teile durch acht."]
              - id: l2-s2
                type: fill_in_blank
                text: "Rechne mit Rest."
                say: "Dreiundachtzig geteilt durch sechs, mit Rest."
                frame: "83 : 6 = _ Rest _"
                options: ["13", "5", "14", "1"]
                answer: ["13", "5"]
                hints: ["Zerlege in sechzig und dreiundzwanzig."]
              - id: l2-s3
                type: text_input
                text: "357 : 7 = _"
                say: "Dreihundertsiebenundfünfzig geteilt durch sieben."
                answer: "51"
                hints: ["Zerlege in dreihundertfünfzig und sieben."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 49 : 3 = 15 Rest 4"
                say: "Neunundvierzig geteilt durch drei ist fünfzehn Rest vier. Stimmt das?"
                answer: false
                feedback:
                  "true": "Rest vier beim Teilen durch drei? Dann könnten drei von den vier Übrigen ja noch eine Gruppe bilden! Der Rest ist immer kleiner als drei: sechzehn Rest eins."
                hints: ["Darf der Rest größer sein als drei?"]
              - id: l2-s5
                type: text_input
                text: "Mia liest ein Buch mit 264 Seiten in 3 Wochen. Jede Woche liest sie gleich viele Seiten. Wie viele Seiten liest sie in einer Woche?"
                say: "Mia liest ein Buch mit zweihundertvierundsechzig Seiten in drei Wochen. Jede Woche liest sie gleich viele Seiten. Wie viele Seiten liest sie in einer Woche?"
                show: { object: book-open, count: 1 }
                answer: "88"
                hints: ["Zerlege in zweihundertvierzig und vierundzwanzig."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Rechne Schritt für Schritt."
                say: "Vierhundertachtundzwanzig geteilt durch vier. Rechne Schritt für Schritt."
                frame: "400 : 4 = _ | 28 : 4 = _ | 428 : 4 = _"
                options: ["100", "7", "107", "170"]
                answer: ["100", "7", "107"]
              - id: l2-n2
                type: fill_in_blank
                text: "Rechne mit Rest."
                say: "Einundsiebzig geteilt durch fünf, mit Rest."
                frame: "71 : 5 = _ Rest _"
                options: ["14", "1", "15", "4"]
                answer: ["14", "1"]
              - id: l2-n3
                type: text_input
                text: "432 : 6 = _"
                say: "Vierhundertzweiunddreißig geteilt durch sechs."
                answer: "72"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 100 : 7 = 14 Rest 2"
                say: "Hundert geteilt durch sieben ist vierzehn Rest zwei. Stimmt das?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "Ein Seil ist 315 cm lang. Es wird in 5 gleich lange Stücke geschnitten. Wie viele cm ist ein Stück lang?"
                say: "Ein Seil ist dreihundertfünfzehn Zentimeter lang. Es wird in fünf gleich lange Stücke geschnitten. Wie viele Zentimeter ist ein Stück lang?"
                show: { object: rope, count: 1 }
                answer: "63"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: divide
            type: text_input
            text: "92 : 4 = _"
            say: "Zweiundneunzig geteilt durch vier."
            answer: "23"
          - id: l2-c2
            part: divide
            type: text_input
            text: "185 : 5 = _"
            say: "Hundertfünfundachtzig geteilt durch fünf."
            answer: "37"
          - id: l2-c3
            part: rest
            type: fill_in_blank
            text: "Rechne mit Rest."
            say: "Siebenundsechzig geteilt durch drei, mit Rest."
            frame: "67 : 3 = _ Rest _"
            options: ["22", "1", "21", "4"]
            answer: ["22", "1"]
          - id: l2-c4
            part: divide
            type: true_false
            text: "Stimmt das? 144 : 6 = 24"
            say: "Hundertvierundvierzig geteilt durch sechs ist vierundzwanzig. Stimmt das?"
            answer: true
          - id: l2-c5
            part: divide
            type: text_input
            text: "Ein Bauer packt 168 Eier in Kartons mit je 6 Eiern. Wie viele Kartons braucht er?"
            say: "Ein Bauer packt hundertachtundsechzig Eier in Kartons mit je sechs Eiern. Wie viele Kartons braucht er?"
            show: { object: egg, count: 6, layout: row }
            answer: "28"
          - id: l2-c6
            part: split
            type: multiple_choice
            text: "Wie zerlegst du 84 für 84 : 7?"
            say: "Vierundachtzig geteilt durch sieben. Wie zerlegst du vierundachtzig?"
            options: ["70 + 14", "80 + 4", "60 + 24"]
            answer: "70 + 14"
          - id: l2-c7
            part: split
            type: multiple_choice
            text: "Wie zerlegst du 112 für 112 : 8?"
            say: "Hundertzwölf geteilt durch acht. Wie zerlegst du hundertzwölf?"
            options: ["80 + 32", "100 + 12", "110 + 2"]
            answer: "80 + 32"
          - id: l2-c8
            part: split
            type: fill_in_blank
            text: "Rechne Schritt für Schritt."
            say: "Hundertneunzehn geteilt durch sieben. Rechne Schritt für Schritt."
            frame: "70 : 7 = _ | 49 : 7 = _ | 119 : 7 = _"
            options: ["10", "7", "17", "71"]
            answer: ["10", "7", "17"]
          - id: l2-c9
            part: split
            type: fill_in_blank
            text: "Rechne Schritt für Schritt."
            say: "Zweihundertsiebenunddreißig geteilt durch drei. Rechne Schritt für Schritt."
            frame: "210 : 3 = _ | 27 : 3 = _ | 237 : 3 = _"
            options: ["70", "9", "79", "97"]
            answer: ["70", "9", "79"]
          - id: l2-c10
            part: split
            type: fill_in_blank
            text: "Welche Zahl fehlt in der Zerlegung?"
            say: "Sechsundneunzig geteilt durch sechs. Welche Zahl fehlt in der Zerlegung?"
            frame: "96 : 6 = 60 : 6 + _ : 6"
            options: ["36", "30", "6"]
            answer: ["36"]
          - id: l2-c11
            part: split
            type: true_false
            text: "Stimmt das? 72 : 3 = 60 : 3 + 12 : 3"
            say: "Zweiundsiebzig geteilt durch drei ist sechzig geteilt durch drei plus zwölf geteilt durch drei. Stimmt das?"
            answer: true
          - id: l2-c12
            part: split
            type: multiple_choice
            text: "Welche Zerlegung hilft bei 135 : 9?"
