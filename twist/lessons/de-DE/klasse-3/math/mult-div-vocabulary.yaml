# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.mult-div-vocabulary
skill: math.mult-div.vocabulary
curriculum: de-DE
language: de
title:
  de: Faktor, Produkt und Quotient
  en: Factor, product and quotient
summary: >
  The words of multiplying and dividing. Lesson 1 names the Faktoren and
  the Produkt of a Malaufgabe and calculates "das Produkt von 6 und 7";
  lesson 2 names the Quotient of a Geteiltaufgabe, sorts the words to the
  right kind of task, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div.div-facts]
  also_practises: [math.mult-div.all-tables, math.mult-div.div-facts]
  vocabulary: { de: [mal, geteilt durch, Faktor, Produkt, Quotient, multiplizieren, dividieren, Summe, Differenz] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: [operation-signs]
  parts:
    - { id: product, what: { de: Faktoren und Produkt erkennen und berechnen, en: recognising and working out factors and the product } }
    - { id: quotient, what: { de: den Quotienten erkennen und berechnen, en: recognising and working out the quotient } }
    - { id: words, what: { de: die Fachwörter der richtigen Rechenart zuordnen, en: matching the terms to the right operation } }
  misconceptions:
    - id: product-is-sum
      what: Takes the Produkt to be the sum (Produkt von 6 und 7 = 13)
      addressed: lesson 1 Learn ties Produkt to mal; l1-f2, l1-s2, l1-n2, l1-c1 and l2-c1 offer the sum, with feedback in l1-f2; l1-n4 claims the sum is the Produkt
    - id: quotient-product-swap
      what: Mixes up Produkt and Quotient
      addressed: lesson 2 Learn sets them side by side; the matching tasks in every stage of lesson 2 have both words, and l2-f4 and l2-n4 name the wrong one
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Faktor und Produkt", en: "Factor and product" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "8 · 6 = _"
            say: "Acht mal sechs."
            answer: "48"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welches Zeichen bedeutet mal?"
            say: "Welches Zeichen bedeutet mal?"
            options: ["·", ":", "+"]
            answer: "·"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 · 4 = 12"
            say: "In einer Malaufgabe heißen die Zahlen, die du malnimmst, Faktoren. Drei und vier sind die Faktoren."
          - text: "Faktor · Faktor = Produkt"
            say: "Das Ergebnis einer Malaufgabe heißt Produkt. Zwölf ist das Produkt von drei und vier."
          - text: "multiplizieren = malnehmen"
            say: "Für malnehmen sagt man auch multiplizieren."
          - text: "Plusaufgabe: Summe | Minusaufgabe: Differenz"
            say: "Auch bei Plus und Minus hat das Ergebnis einen Namen. Das Ergebnis einer Plusaufgabe heißt Summe. Das Ergebnis einer Minusaufgabe heißt Differenz."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf das Produkt."
                say: "Lies die Aufgabe. Tippe auf das Produkt."
                show: { drawn: letter-card, text: "5 · 7 = 35" }
                spans: ["35"]
                hints:
                  - "Das Produkt ist das Ergebnis einer Malaufgabe."
                  - "Was steht hinter dem Gleichheitszeichen?"
                  - "35."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie groß ist das Produkt von 6 und 7?"
                say: "Wie groß ist das Produkt von sechs und sieben?"
                options: ["42", "13", "1"]
                answer: "42"
                feedback:
                  "13": "Das ist die Summe. Beim Produkt nimmst du mal."
                hints:
                  - "Produkt heißt: Du nimmst mal."
                  - "Sechs mal sieben."
                  - "42."
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf die beiden Faktoren."
                say: "Lies die Aufgabe. Tippe auf die beiden Faktoren."
                show: { drawn: letter-card, text: "9 · 4 = 36" }
                spans: ["9", "4"]
                hints:
                  - "Faktoren sind die Zahlen, die du malnimmst."
                  - "Sie stehen vor dem Gleichheitszeichen."
                  - "9 und 4."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Bei 8 · 3 = 24 ist 24 ein Faktor."
                say: "Acht mal drei ist vierundzwanzig. Ist vierundzwanzig ein Faktor?"
                answer: false
                hints:
                  - "Was ist ein Faktor, was ein Produkt?"
                  - "Vierundzwanzig ist das Ergebnis."
                  - "Nein. 24 ist das Produkt."
              - id: l1-f5
                type: text_input
                text: "Ein Faktor ist 5, das Produkt ist 40. Wie heißt der andere Faktor?"
                say: "Ein Faktor ist fünf, das Produkt ist vierzig. Wie heißt der andere Faktor?"
                answer: "8"
                hints:
                  - "Fünf mal wie viel ist vierzig?"
                  - "Zähle in Fünferschritten bis vierzig."
                  - "8."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf das Produkt."
                say: "Lies die Aufgabe. Tippe auf das Produkt."
                show: { drawn: letter-card, text: "63 = 7 · 9" }
                spans: ["63"]
                hints: ["Das Produkt kann auch vorne stehen."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie groß ist das Produkt von 4 und 9?"
                say: "Wie groß ist das Produkt von vier und neun?"
                options: ["36", "13", "5"]
                answer: "36"
                hints: ["Produkt heißt: mal."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf die beiden Faktoren."
                say: "Lies die Aufgabe. Tippe auf die beiden Faktoren."
                show: { drawn: letter-card, text: "6 · 8 = 48" }
                spans: ["6", "8"]
                hints: ["Faktoren nimmst du mal."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? Multiplizieren heißt malnehmen."
                say: "Multiplizieren heißt malnehmen. Stimmt das?"
                answer: true
                hints: ["Welches andere Wort für malnehmen hast du gelernt?"]
              - id: l1-s5
                type: text_input
                text: "Ein Faktor ist 7, das Produkt ist 56. Wie heißt der andere Faktor?"
                say: "Ein Faktor ist sieben, das Produkt ist sechsundfünfzig. Wie heißt der andere Faktor?"
                answer: "8"
                hints: ["Sieben mal wie viel ist sechsundfünfzig?"]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf das Produkt."
                say: "Lies die Aufgabe. Tippe auf das Produkt."
                show: { drawn: letter-card, text: "3 · 9 = 27" }
                spans: ["27"]
              - id: l1-n2
                type: multiple_choice
                text: "Wie groß ist das Produkt von 8 und 5?"
                say: "Wie groß ist das Produkt von acht und fünf?"
                options: ["40", "13", "3"]
                answer: "40"
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf die beiden Faktoren."
                say: "Lies die Aufgabe. Tippe auf die beiden Faktoren."
                show: { drawn: letter-card, text: "54 = 6 · 9" }
                spans: ["6", "9"]
              - id: l1-n4
                type: true_false
                text: "Stimmt das? Das Produkt von 10 und 7 ist 17."
                say: "Das Produkt von zehn und sieben ist siebzehn. Stimmt das?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "Ein Faktor ist 9, das Produkt ist 81. Wie heißt der andere Faktor?"
                say: "Ein Faktor ist neun, das Produkt ist einundachtzig. Wie heißt der andere Faktor?"
                answer: "9"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie groß ist das Produkt von 7 und 7?"
            say: "Wie groß ist das Produkt von sieben und sieben?"
            options: ["49", "14", "0"]
            answer: "49"
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf die beiden Faktoren."
            say: "Lies die Aufgabe. Tippe auf die beiden Faktoren."
            show: { drawn: letter-card, text: "4 · 6 = 24" }
            spans: ["4", "6"]
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Bei 2 · 9 = 18 ist 18 das Produkt."
            say: "Zwei mal neun ist achtzehn. Ist achtzehn das Produkt?"
            answer: true
          - id: l1-c4
            type: highlight_in_text
            text: "Tippe auf das Produkt."
            say: "Lies die Aufgabe. Tippe auf das Produkt."
            show: { drawn: letter-card, text: "72 = 8 · 9" }
            spans: ["72"]
          - id: l1-c5
            type: text_input
            text: "Ein Faktor ist 6, das Produkt ist 42. Wie heißt der andere Faktor?"
            say: "Ein Faktor ist sechs, das Produkt ist zweiundvierzig. Wie heißt der andere Faktor?"
            answer: "7"
          - id: l1-c6
            type: multiple_choice
            text: "Wie heißt das Ergebnis einer Malaufgabe?"
            say: "Wie heißt das Ergebnis einer Malaufgabe?"
            options: ["Produkt", "Faktor", "Summe"]
            answer: "Produkt"

  - n: 2
    title: { de: "Der Quotient", en: "The quotient" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie groß ist das Produkt von 3 und 6?"
            say: "Wie groß ist das Produkt von drei und sechs?"
            options: ["18", "9", "3"]
            answer: "18"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "45 : 9 = _"
            say: "Fünfundvierzig geteilt durch neun."
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "12 : 3 = 4"
            say: "Das Ergebnis einer Geteiltaufgabe heißt Quotient. Vier ist der Quotient von zwölf und drei."
          - text: "dividieren = teilen"
            say: "Für teilen sagt man auch dividieren."
          - text: "mal: Produkt | geteilt: Quotient"
            say: "Merk dir: Beim Malnehmen heißt das Ergebnis Produkt, beim Teilen heißt es Quotient."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tippe auf den Quotienten."
                say: "Lies die Aufgabe. Tippe auf den Quotienten."
                show: { drawn: letter-card, text: "56 : 8 = 7" }
                spans: ["7"]
                hints:
                  - "Der Quotient ist das Ergebnis einer Geteiltaufgabe."
                  - "Was steht hinter dem Gleichheitszeichen?"
                  - "7."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie groß ist der Quotient von 20 und 5?"
                say: "Wie groß ist der Quotient von zwanzig und fünf?"
                options: ["4", "100", "15"]
                answer: "4"
                hints:
                  - "Quotient heißt: Du teilst."
                  - "Zwanzig geteilt durch fünf."
                  - "4."
              - id: l2-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit dem, was es bedeutet."
                pairs:
                  - { left: { text: "Produkt" }, right: { text: "Ergebnis beim Malnehmen" } }
                  - { left: { text: "Quotient" }, right: { text: "Ergebnis beim Teilen" } }
                  - { left: { text: "multiplizieren" }, right: { text: "malnehmen" } }
                  - { left: { text: "dividieren" }, right: { text: "teilen" } }
                hints:
                  - "Zwei Wörter sind Namen für Ergebnisse, zwei sind Namen für Rechenarten."
                  - "Produkt und multiplizieren gehören zum Malnehmen, Quotient und dividieren zum Teilen."
                  - "Produkt: Ergebnis beim Malnehmen. Quotient: Ergebnis beim Teilen. Multiplizieren: malnehmen. Dividieren: teilen."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Bei 36 : 4 = 9 ist 9 das Produkt."
                say: "Sechsunddreißig geteilt durch vier ist neun. Ist neun das Produkt?"
                answer: false
                hints:
                  - "Ist das eine Mal- oder eine Geteiltaufgabe?"
                  - "Das Ergebnis einer Geteiltaufgabe hat einen anderen Namen."
                  - "Nein. 9 ist der Quotient."
              - id: l2-f5
                type: text_input
                text: "Dividiere 63 durch 7."
                say: "Dividiere dreiundsechzig durch sieben."
                answer: "9"
                hints:
                  - "Dividieren heißt teilen."
                  - "Dreiundsechzig geteilt durch sieben."
                  - "9."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tippe auf den Quotienten."
                say: "Lies die Aufgabe. Tippe auf den Quotienten."
                show: { drawn: letter-card, text: "6 = 42 : 7" }
                spans: ["6"]
                hints: ["Der Quotient kann auch vorne stehen."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie groß ist der Quotient von 32 und 4?"
                say: "Wie groß ist der Quotient von zweiunddreißig und vier?"
                options: ["8", "128", "28"]
                answer: "8"
                hints: ["Quotient heißt: geteilt."]
              - id: l2-s3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Aufgabe mit dem Namen ihres Ergebnisses."
                pairs:
                  - { left: { text: "5 · 6" }, right: { text: "Produkt" } }
                  - { left: { text: "30 : 6" }, right: { text: "Quotient" } }
                  - { left: { text: "5 + 6" }, right: { text: "Summe" } }
                hints: ["Welche Rechenart siehst du?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Dividieren heißt teilen."
                say: "Dividieren heißt teilen. Stimmt das?"
                answer: true
                hints: ["Welches andere Wort für teilen hast du gelernt?"]
              - id: l2-s5
                type: text_input
                text: "Multipliziere 8 mit 7."
                say: "Multipliziere acht mit sieben."
                answer: "56"
                hints: ["Multiplizieren heißt malnehmen."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tippe auf den Quotienten."
                say: "Lies die Aufgabe. Tippe auf den Quotienten."
                show: { drawn: letter-card, text: "54 : 9 = 6" }
                spans: ["6"]
              - id: l2-n2
                type: multiple_choice
                text: "Wie groß ist der Quotient von 48 und 6?"
                say: "Wie groß ist der Quotient von achtundvierzig und sechs?"
                options: ["8", "54", "42"]
                answer: "8"
              - id: l2-n3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Aufgabe mit dem Namen ihres Ergebnisses."
                pairs:
                  - { left: { text: "9 − 3" }, right: { text: "Differenz" } }
                  - { left: { text: "9 · 3" }, right: { text: "Produkt" } }
                  - { left: { text: "9 : 3" }, right: { text: "Quotient" } }
                  - { left: { text: "9 + 3" }, right: { text: "Summe" } }
              - id: l2-n4
                type: true_false
                text: "Stimmt das? Der Quotient von 40 und 8 ist 320."
                say: "Der Quotient von vierzig und acht ist dreihundertzwanzig. Stimmt das?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "Dividiere 72 durch 8."
                say: "Dividiere zweiundsiebzig durch acht."
                answer: "9"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: product
            type: multiple_choice
            text: "Wie groß ist das Produkt von 9 und 6?"
            say: "Wie groß ist das Produkt von neun und sechs?"
            options: ["54", "15", "3"]
            answer: "54"
          - id: l2-c2
            part: quotient
            type: multiple_choice
            text: "Wie groß ist der Quotient von 35 und 5?"
            say: "Wie groß ist der Quotient von fünfunddreißig und fünf?"
            options: ["7", "175", "30"]
            answer: "7"
          - id: l2-c3
            part: product
            type: highlight_in_text
            text: "Tippe auf die beiden Faktoren."
            say: "Lies die Aufgabe. Tippe auf die beiden Faktoren."
            show: { drawn: letter-card, text: "7 · 8 = 56" }
            spans: ["7", "8"]
          - id: l2-c4
            part: quotient
            type: true_false
            text: "Stimmt das? Bei 24 : 6 = 4 ist 4 der Quotient."
            say: "Vierundzwanzig geteilt durch sechs ist vier. Ist vier der Quotient?"
            answer: true
          - id: l2-c5
            part: words
            type: text_input
            text: "Multipliziere 8 mit 9."
            say: "Multipliziere acht mit neun."
            answer: "72"
          - id: l2-c6
            part: product
            type: multiple_choice
            text: "Wie groß ist das Produkt von 8 und 4?"
            say: "Wie groß ist das Produkt von acht und vier?"
            options: ["32", "12", "2"]
            answer: "32"
          - id: l2-c7
            part: product
            type: highlight_in_text
            text: "Tippe auf das Produkt."
            say: "Lies die Aufgabe. Tippe auf das Produkt."
            show: { drawn: letter-card, text: "45 = 5 · 9" }
            spans: ["45"]
          - id: l2-c8
            part: product
            type: text_input
            text: "Ein Faktor ist 4, das Produkt ist 28. Wie heißt der andere Faktor?"
            say: "Ein Faktor ist vier, das Produkt ist achtundzwanzig. Wie heißt der andere Faktor?"
            answer: "7"
          - id: l2-c9
            part: product
            type: true_false
            text: "Stimmt das? Bei 7 · 6 = 42 sind 7 und 6 die Faktoren."
            say: "Sieben mal sechs ist zweiundvierzig. Sind sieben und sechs die Faktoren?"
            answer: true
          - id: l2-c10
            part: product
            type: true_false
            text: "Stimmt das? Das Produkt von 5 und 8 ist 13."
            say: "Das Produkt von fünf und acht ist dreizehn. Stimmt das?"
            answer: false
          - id: l2-c11
            part: quotient
            type: highlight_in_text
            text: "Tippe auf den Quotienten."
            say: "Lies die Aufgabe. Tippe auf den Quotienten."
            show: { drawn: letter-card, text: "5 = 40 : 8" }
            spans: ["5"]
          - id: l2-c12
            part: quotient
            type: multiple_choice
            text: "Wie groß ist der Quotient von 63 und 9?"
            say: "Wie groß ist der Quotient von dreiundsechzig und neun?"
            options: ["7", "72", "54"]
            answer: "7"
          - id: l2-c13
            part: quotient
            type: text_input
            text: "Wie groß ist der Quotient von 81 und 9?"
            say: "Wie groß ist der Quotient von einundachtzig und neun?"
            answer: "9"
          - id: l2-c14
            part: quotient
            type: true_false
            text: "Stimmt das? Der Quotient von 18 und 3 ist 54."
            say: "Der Quotient von achtzehn und drei ist vierundfünfzig. Stimmt das?"
            answer: false
          - id: l2-c15
            part: quotient
            type: multiple_choice
            text: "Wie heißt die 6 in 30 : 5 = 6?"
            say: "Dreißig geteilt durch fünf ist sechs. Wie heißt die Sechs?"
            options: ["Quotient", "Produkt", "Faktor"]
            answer: "Quotient"
          - id: l2-c16
            part: words
            type: matching
            text: "Welches Ergebnis gehört zu welcher Rechenart?"
            say: "Verbinde jedes Ergebnis mit seiner Rechenart."
            pairs:
              - { left: { text: "Summe" }, right: { text: "plus" } }
              - { left: { text: "Differenz" }, right: { text: "minus" } }
              - { left: { text: "Produkt" }, right: { text: "mal" } }
              - { left: { text: "Quotient" }, right: { text: "geteilt" } }
          - id: l2-c17
            part: words
            type: true_false
            text: "Stimmt das? Wenn du 8 mit 3 multiplizierst, erhältst du 11."
            say: "Wenn du acht mit drei multiplizierst, erhältst du elf. Stimmt das?"
            answer: false
          - id: l2-c18
            part: words
            type: text_input
            text: "Dividiere 56 durch 7."
            say: "Dividiere sechsundfünfzig durch sieben."
            answer: "8"
          - id: l2-c19
            part: words
            type: multiple_choice
            text: "Was bedeutet dividieren?"
            say: "Was bedeutet dividieren?"
            options: ["teilen", "malnehmen", "plus rechnen"]
            answer: "teilen"
          - id: l2-c20
            part: words
            type: sorting
            text: "Gehört das Wort zum Malnehmen oder zum Teilen?"
            say: "Sortiere die Wörter: Gehören sie zum Malnehmen oder zum Teilen?"
            bins:
              - { id: mal, show: { text: "Malnehmen" }, say: "Malnehmen" }
              - { id: teilen, show: { text: "Teilen" }, say: "Teilen" }
            options:
              - { text: "Produkt", bin: mal }
              - { text: "Faktor", bin: mal }
              - { text: "multiplizieren", bin: mal }
              - { text: "Quotient", bin: teilen }
              - { text: "dividieren", bin: teilen }
