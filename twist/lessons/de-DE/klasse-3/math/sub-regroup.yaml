# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.sub-regroup
skill: math.written-add-sub.sub-regroup
curriculum: de-DE
language: de
title:
  de: Schriftlich subtrahieren mit Entbündeln
  en: Column subtraction with exchanging
summary: >
  Written subtraction by Abziehen with Entbündeln, the method this
  curriculum uses: when a column has too few, one from the next place is
  unbundled into ten. Lesson 1 unbundles a Zehner into ten Einer (352 −
  127); lesson 2 unbundles a Hunderter into ten Zehner and does both in
  one sum, and ends with the skill check. Schools that teach Ergänzen
  with Übertrag would need their own set.
metadata:
  year: klasse-3
  topic: { de: Schriftlich rechnen, en: Column methods }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.written-add-sub.sub-no-regroup]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { de: [entbündeln, Abziehen, Zehner, Einer, Hunderter, schriftlich subtrahieren] }
  forms: [drawn, text, audio]
  drawn: [written-calc]
  facets: [written-subtraction]
  parts:
    - { id: tens, what: { de: einen Zehner entbündeln, en: exchanging a ten } }
    - { id: hundreds, what: { de: einen Hunderter entbündeln, en: exchanging a hundred } }
    - { id: twice, what: { de: zweimal entbündeln, en: exchanging twice in one calculation } }
    - { id: explain, what: { de: "erklären, wann und wie du entbündelst, und Fehler finden", en: "explaining when and how to exchange, and finding mistakes" } }
  misconceptions:
    - id: smaller-from-larger
      what: Takes the smaller digit from the larger whatever its place (352 − 127 gives 235, from 7 − 2)
      addressed: Learn says the lower digit is always taken from the upper one; "Musst du entbündeln?" offers the swapped column, with feedback in the full stage; a "Stimmt die Rechnung?" in lesson 1 and a "Wo ist der Fehler?" in lesson 2 show a swapped result
    - id: forget-to-reduce
      what: Unbundles but does not make the next place one smaller (352 − 127 = 235 via 12 − 7 and 5 − 2)
      addressed: Learn crosses the Zehner out and writes the smaller digit above it; "Wo ist der Fehler?" tasks in the full and none stages and the skill check of lesson 2, and a "Stimmt die Rechnung?" in the some stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
