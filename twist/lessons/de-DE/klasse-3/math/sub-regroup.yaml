                feedback:
                  "acht minus drei rechnen": "Du ziehst immer unten von oben ab. Drei minus acht geht nicht, also entbündelst du einen Zehner."
                hints:
                  - "Geht drei minus acht?"
                  - "Nein. Hol dir einen Zehner."
                  - "Einen Zehner entbündeln."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Rechne nach dem Entbündeln."
                say: "Ein Zehner ist entbündelt. Rechne jetzt die Einer, die Zehner und die Hunderter."
                show: { drawn: written-calc, rows: ["463", "128"], op: "-", above: " 51", cross: " x ", result: "___" }
