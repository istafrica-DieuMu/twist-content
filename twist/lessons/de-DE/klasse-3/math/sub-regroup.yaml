        tasks:
          - id: l1-w1
            type: text_input
            text: "Rechne schriftlich."
            say: "Rechne schriftlich: siebenhundertachtundsechzig minus dreihundertfünfundzwanzig."
            show: { drawn: written-calc, rows: ["768", "325"], op: "-" }
            answer: "443"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "1 Zehner sind …"
            say: "Wie viele Einer hat ein Zehner?"
            options: ["10 Einer", "1 Einer", "100 Einer"]
            answer: "10 Einer"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "352 − 127"
            say: "Dreihundertzweiundfünfzig minus hundertsiebenundzwanzig. Einer: zwei minus sieben geht nicht. Oben sind zu wenig Einer."
            show: { drawn: written-calc, rows: ["352", "127"], op: "-" }
          - text: "5 Zehner → 4 Zehner und 10 Einer"
            say: "Dann entbündelst du einen Zehner. Aus fünf Zehnern werden vier: Du streichst die Fünf durch und schreibst klein eine Vier darüber. Der Zehner wird zu zehn Einern: Über die Zwei kommt eine kleine Eins, jetzt sind es zwölf Einer."
            show: { drawn: written-calc, rows: ["352", "127"], op: "-", above: " 41", cross: " x " }
          - text: "12 − 7 = 5 | 4 − 2 = 2 | 3 − 1 = 2"
            say: "Jetzt geht es: zwölf minus sieben ist fünf. Zehner: vier minus zwei ist zwei. Hunderter: drei minus eins ist zwei. Das Ergebnis ist zweihundertfünfundzwanzig."
            show: { drawn: written-calc, rows: ["352", "127"], op: "-", above: " 41", cross: " x ", result: "225" }

