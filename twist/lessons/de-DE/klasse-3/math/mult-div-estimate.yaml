# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.mult-div-estimate
skill: math.mult-div-larger.estimate
curriculum: de-DE
language: de
title:
  de: Überschlagen beim Malnehmen und Teilen
  en: Estimating products and quotients
summary: >
  Rough results to check multiplying and dividing. Lesson 1 rounds the
  bigger number to a Zehnerzahl or Hunderterzahl (7 · 48 ≈ 7 · 50 = 350)
  and judges whether a result can be right; lesson 2 picks a number that
  divides easily for a Überschlag (396 : 4 ≈ 400 : 4 = 100), and ends
  with the skill check.
metadata:
  year: klasse-3
  topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.mult-div-larger.semi-written-mult, math.numbers-to-1000.round]
  also_practises: [math.mult-div-larger.tens, math.mult-div-larger.semi-written-div]
  vocabulary: { de: [Überschlag, runden, ungefähr, Zehnerzahl, Hunderterzahl] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: mult, what: { de: beim Malnehmen einen Überschlag machen, en: estimating a product } }
    - { id: div, what: { de: beim Teilen einen Überschlag machen, en: estimating a quotient } }
    - { id: check, what: { de: "mit dem Überschlag prüfen, ob ein Ergebnis stimmen kann", en: using an estimate to check whether a result can be right } }
  misconceptions:
    - id: round-both
      what: Rounds the one-digit factor too (7 · 48 ≈ 10 · 50)
      addressed: lesson 1 Learn rounds only the bigger number; "Welcher Überschlag passt?" in every stage of lesson 1 offers a version with both numbers rounded
    - id: easy-number-for-division
      what: "Rounds to the nearest ten even when it does not divide (396 : 4 ≈ 390 : 4)"
      addressed: "lesson 2 Learn picks 400 because it divides by 4; \"Welcher Überschlag passt?\" in every stage of lesson 2 and in the skill check offers the nearest ten as a wrong choice (250 : 6, 220 : 7, 460 : 9, 290 : 7)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Überschlag beim Malnehmen", en: "Estimating products" }
    goal:
      de: "Überschlage Malaufgaben mit einer runden Zahl, so wie 7 mal 50 bei 7 mal 48."
      en: "Estimate times sums with a round number, like 7 times 50 for 7 times 48."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Runde 48 auf Zehner."
            say: "Runde achtundvierzig auf Zehner."
            options: ["50", "40", "48"]
            answer: "50"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "7 · 50 = _"
            say: "Sieben mal fünfzig."
            answer: "350"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "7 · 48 ≈ 7 · 50 = 350"
            say: "Für einen Überschlag rundest du nur die große Zahl: Achtundvierzig wird fünfzig. Sieben mal fünfzig ist dreihundertfünfzig. Das Ergebnis ist ungefähr dreihundertfünfzig."
          - text: "7 · 48 = 336"
            say: "Genau gerechnet ist es dreihundertsechsunddreißig. Das liegt nah an dreihundertfünfzig. Die Rechnung kann stimmen."
          - text: "4 · 213 ≈ 4 · 200 = 800"
            say: "Bei einer dreistelligen Zahl rundest du auf Hunderter: Zweihundertdreizehn wird zweihundert. Vier mal zweihundert ist achthundert."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Überschlag passt zu 6 · 39?"
                say: "Sechs mal neununddreißig. Welcher Überschlag passt?"
                options: ["6 · 40", "10 · 40", "6 · 30"]
                answer: "6 · 40"
                feedback:
                  "10 · 40": "Die Sechs bleibt, wie sie ist. Du rundest nur die große Zahl."
                hints:
                  - "Runde nur die große Zahl."
                  - "Ist neununddreißig näher an dreißig oder an vierzig?"
                  - "6 · 40."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Mach einen Überschlag: 5 · 62 ≈ _"
                say: "Mach einen Überschlag: fünf mal zweiundsechzig. Ungefähr wie viel?"
                answer: "300"
                hints:
                  - "Runde zweiundsechzig auf Zehner."
                  - "Fünf mal sechzig."
                  - "300."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Ergebnis kann zu 8 · 53 stimmen?"
                say: "Acht mal dreiundfünfzig. Welches Ergebnis kann stimmen?"
                options: ["424", "244", "824"]
                answer: "424"
                hints:
                  - "Mach zuerst einen Überschlag."
                  - "Acht mal fünfzig ist vierhundert."
                  - "424."
              - id: l1-f4
                type: true_false
                text: "Kann 3 · 298 = 594 stimmen?"
                say: "Drei mal zweihundertachtundneunzig ist fünfhundertvierundneunzig. Kann das stimmen?"
                answer: false
                hints:
                  - "Runde zweihundertachtundneunzig auf Hunderter."
                  - "Drei mal dreihundert ist neunhundert."
                  - "Nein. Das Ergebnis muss ungefähr 900 sein."
              - id: l1-f5
                type: text_input
                text: "Mach einen Überschlag: 4 · 187 ≈ _"
                say: "Mach einen Überschlag: vier mal hundertsiebenundachtzig. Ungefähr wie viel?"
                answer: "800"
                hints:
