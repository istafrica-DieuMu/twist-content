# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.nets
skill: math.solids.nets
curriculum: de-DE
language: de
title:
  de: Würfelnetze
  en: Nets of a cube
summary: >
  Lesson 1 shows that a Würfelnetz is six Quadrate that fold into a
  Würfel, tells nets from shapes that do not fold (a Rechteck of 2 mal 3,
  five in a row, a block of four, two Deckel on one side) and finds where
  the sixth square must go; lesson 2 finds which faces lie opposite each
  other (in a row of three, the first and the third), uses the rule that
  opposite faces of a Spielwürfel add up to 7, and ends with the skill
  check. Folding a net with the finger waits for a 3D folding view.
metadata:
  year: klasse-3
  topic: { de: Körper, en: 3D shapes }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.solids.more-solids, math.solids.cube-cuboid-sphere]
  also_practises: []
  vocabulary: { de: [Würfel, Würfelnetz, Fläche, Quadrat, falten, aufklappen, Boden, Deckel, gegenüber, Spielwürfel, Augenzahl] }
  forms: [text, audio, drawn]
  drawn: [shape, grid]
  facets: []
  parts:
    - { id: recognise, what: { de: "erkennen, ob sich eine Figur zu einem Würfel falten lässt", en: telling whether a shape folds into a cube } }
    - { id: opposite, what: { de: gegenüberliegende Flächen im Würfelnetz finden, en: finding the opposite faces in a net } }
    - { id: dice, what: { de: gegenüberliegende Augenzahlen beim Spielwürfel und in seinem Netz, en: opposite numbers on a dice and in its net } }
  misconceptions:
    - id: any-six-squares
      what: Thinks any six Quadrate that touch make a Würfelnetz (a Rechteck of 2 mal 3, five in a row, a block of four)
      addressed: lesson 1 Learn shows the Rechteck of 2 mal 3 and gives the two warning signs; l1-f3 and l1-s1 have feedback on non-nets, l1-f4, l1-s3 and l1-n2 ask why a shape does not fold, l1-s2, l1-c2 and l2-c2 show non-nets
    - id: neighbour-is-opposite
      what: Takes a square next to a face in the net, or two squares further, as the opposite face
      addressed: lesson 2 Learn says exactly one Quadrat lies between opposite faces in a row; l2-f1 and l2-f2 have feedback on the neighbour and on two further, l2-s1, l2-n1 and l2-c3 ask again
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was ist ein Würfelnetz?", en: "What is a net of a cube?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Flächen hat ein Würfel?"
            say: "Wie viele Flächen hat ein Würfel?"
            show: { drawn: shape, kind: cube, colour: orange }
            options: ["6", "8", "12"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Form hat jede Fläche eines Würfels?"
            say: "Welche Form hat jede Fläche eines Würfels?"
            options: ["Quadrat", "Rechteck mit langen und kurzen Seiten", "Dreieck"]
            answer: "Quadrat"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ein Würfel hat 6 gleich große Quadrate als Flächen."
            say: "Ein Würfel hat sechs gleich große Flächen. Jede ist ein Quadrat. Schneidest du eine Würfelschachtel an einigen Kanten auf und klappst sie flach auseinander, bekommst du ein Würfelnetz."
            show: { drawn: shape, kind: cube, colour: yellow }
          - text: "Ein Würfelnetz"
            say: "Das ist ein Würfelnetz. Das Quadrat in der Mitte wird der Boden. Die vier Quadrate rundherum klappst du hoch, das sind die Seiten. Das letzte Quadrat unten wird der Deckel."
            show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, yellow], [0, 1, yellow], [1, 1, yellow], [2, 1, yellow], [1, 2, yellow], [1, 3, yellow]] }
          - text: "Kein Würfelnetz"
            say: "Auch dieses Rechteck hat sechs Quadrate. Aber beim Falten liegen Flächen doppelt, und eine Seite bleibt offen. Es ist kein Würfelnetz."
            show: { drawn: grid, cols: 3, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [2, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue]] }
          - text: "Nie 4 im Block. Nie 5 in einer Reihe."
            say: "Zwei Warnzeichen helfen dir. Liegen vier Quadrate als Block zusammen, zwei oben und zwei unten, ist es kein Würfelnetz. Liegen fünf oder mehr Quadrate in einer Reihe, auch nicht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Quadrate hat ein Würfelnetz?"
                say: "Wie viele Quadrate hat ein Würfelnetz?"
                options: ["6", "4", "8"]
                answer: "6"
                hints:
                  - "Jedes Quadrat im Netz wird eine Fläche des Würfels."
                  - "Denk an einen Spielwürfel: Jede Fläche hat eine andere Augenzahl, von 1 bis 6."
                  - "6 Quadrate."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Lässt sich dieses Netz zu einem Würfel falten?"
                say: "Lässt sich dieses Netz zu einem Würfel falten?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [1, 2, green], [1, 3, green]] }
                answer: true
                hints:
                  - "Nimm das Quadrat in der Mitte der Querreihe als Boden."
                  - "Links, rechts, oben und unten klappst du hoch. Das letzte Quadrat ist der Deckel."
                  - "Ja, das ist ein Würfelnetz."
              - id: l1-f3
                type: image_multiple_choice
                text: "Welches ist ein Würfelnetz?"
                say: "Welche Figur ist ein Würfelnetz?"
                options:
                  - { drawn: grid, cols: 3, rows: 2, cells: [[0, 0, orange], [1, 0, orange], [2, 0, orange], [0, 1, orange], [1, 1, orange], [2, 1, orange]], key: rechteck }
                  - { drawn: grid, cols: 6, rows: 1, cells: [[0, 0, orange], [1, 0, orange], [2, 0, orange], [3, 0, orange], [4, 0, orange], [5, 0, orange]], key: reihe }
                  - { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, orange], [0, 1, orange], [1, 1, orange], [2, 1, orange], [1, 2, orange], [1, 3, orange]], key: netz }
                answer: netz
                feedback:
                  rechteck: "Hier liegen vier Quadrate als Block. Beim Falten liegen Flächen doppelt."
                  reihe: "Sechs in einer Reihe: Nach vier Quadraten ist der Ring zu, die anderen liegen doppelt. Boden und Deckel fehlen."
                hints:
                  - "Denk an die zwei Warnzeichen: 4 im Block, 5 oder mehr in einer Reihe."
                  - "Das Rechteck hat einen Block, die lange Reihe hat 6 in einer Reihe."
                  - "Es ist das Kreuz."
              - id: l1-f4
                type: multiple_choice
                text: "Warum ist das kein Würfelnetz?"
                say: "Warum lässt sich das nicht zu einem Würfel falten?"
                show: { drawn: grid, cols: 5, rows: 2, cells: [[1, 0, purple], [0, 1, purple], [1, 1, purple], [2, 1, purple], [3, 1, purple], [4, 1, purple]] }
                options: ["Es hat 5 Quadrate in einer Reihe.", "Es hat zu wenige Quadrate.", "Die Quadrate sind zu klein."]
                answer: "Es hat 5 Quadrate in einer Reihe."
                feedback:
                  "Es hat zu wenige Quadrate.": "Zähl nach: Es sind 6 Quadrate. Schau, wie sie liegen."
                hints:
                  - "Zähl zuerst die Quadrate, dann schau auf die lange Reihe."
                  - "Vier Quadrate in einer Reihe schließen sich zum Ring. Was macht das fünfte?"
                  - "Es hat 5 Quadrate in einer Reihe."
              - id: l1-f5
                type: true_false
                text: "Lässt sich dieses Netz zu einem Würfel falten?"
                say: "Lässt sich dieses Netz zu einem Würfel falten?"
                show: { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, red], [0, 1, red], [1, 1, red], [2, 1, red], [3, 1, red], [3, 2, red]] }
                answer: true
                hints:
                  - "Die Reihe aus vier Quadraten wird ein Ring, das sind die Seiten."
                  - "Ein Quadrat liegt über der Reihe, eins darunter."
                  - "Ja, das eine wird der Deckel, das andere der Boden."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Welches ist ein Würfelnetz?"
                say: "Welche Figur ist ein Würfelnetz?"
                options:
                  - { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, blue], [3, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue]], key: oben }
                  - { drawn: grid, cols: 4, rows: 3, cells: [[1, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue], [2, 2, blue]], key: netz }
                  - { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue]], key: block }
                answer: netz
                feedback:
                  oben: "Beide Quadrate über der Reihe werden der Deckel. Unten bleibt der Würfel offen."
                  block: "Links liegen vier Quadrate als Block. Das ist ein Warnzeichen."
                hints: ["Bei einem Netz mit Viererreihe liegt ein Quadrat darüber und eins darunter."]
              - id: l1-s2
                type: true_false
                text: "Lässt sich dieses Rechteck zu einem Würfel falten?"
                say: "Lässt sich dieses Rechteck aus sechs Quadraten zu einem Würfel falten?"
                show: { drawn: grid, cols: 2, rows: 3, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [0, 2, green], [1, 2, green]] }
                answer: false
                hints: ["Siehst du einen Block aus vier Quadraten?"]
              - id: l1-s3
                type: multiple_choice
                text: "Warum ist das kein Würfelnetz?"
                say: "Warum lässt sich das nicht zu einem Würfel falten?"
                show: { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, orange], [2, 0, orange], [0, 1, orange], [1, 1, orange], [2, 1, orange], [3, 1, orange]] }
                options: ["Zwei Quadrate werden beide zum Deckel.", "Es hat 7 Quadrate.", "Es hat 5 Quadrate in einer Reihe."]
                answer: "Zwei Quadrate werden beide zum Deckel."
                hints: ["Die Viererreihe wird der Ring. Wohin klappen die zwei Quadrate oben?"]
              - id: l1-s4
                type: multiple_choice
                text: "Wo muss das sechste Quadrat hin, damit ein Würfelnetz entsteht?"
                say: "Hier fehlt ein Quadrat. Wo muss das sechste Quadrat hin, damit ein Würfelnetz entsteht: bei A, B oder C?"
                show: { drawn: grid, cols: 4, rows: 4, cells: [[1, 0, purple], [0, 1, purple], [1, 1, purple], [2, 1, purple], [1, 2, purple]], labels: [[1, 3, A], [2, 2, B], [2, 0, C]] }
                options: ["A", "B", "C"]
                answer: "A"
                option_audio: false
                hints: ["Bei B und bei C entsteht ein Block aus vier Quadraten."]
              - id: l1-s5
                type: true_false
                text: "Lässt sich dieses Netz zu einem Würfel falten?"
                say: "Lässt sich dieses Netz zu einem Würfel falten?"
                show: { drawn: grid, cols: 5, rows: 2, cells: [[0, 0, yellow], [1, 0, yellow], [2, 0, yellow], [2, 1, yellow], [3, 1, yellow], [4, 1, yellow]] }
                answer: true
                hints: ["Prüf die Warnzeichen: Gibt es einen Block? Liegen 5 in einer Reihe?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Welches ist ein Würfelnetz?"
                say: "Welche Figur ist ein Würfelnetz?"
                options:
                  - { drawn: grid, cols: 5, rows: 2, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [3, 0, red], [4, 0, red], [2, 1, red]], key: reihe }
                  - { drawn: grid, cols: 3, rows: 4, cells: [[0, 0, red], [0, 1, red], [0, 2, red], [0, 3, red], [1, 3, red], [2, 3, red]], key: winkel }
                  - { drawn: grid, cols: 4, rows: 3, cells: [[0, 0, red], [1, 0, red], [1, 1, red], [2, 1, red], [2, 2, red], [3, 2, red]], key: netz }
                answer: netz
              - id: l1-n2
                type: multiple_choice
                text: "Warum ist das kein Würfelnetz?"
                say: "Warum lässt sich das nicht zu einem Würfel falten?"
                show: { drawn: grid, cols: 3, rows: 3, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [2, 2, green]] }
                options: ["Vier Quadrate liegen als Block zusammen.", "Es hat 5 Quadrate.", "Es hat 5 Quadrate in einer Reihe."]
                answer: "Vier Quadrate liegen als Block zusammen."
              - id: l1-n3
                type: true_false
                text: "Lässt sich dieses Netz zu einem Würfel falten?"
                say: "Lässt sich dieses Netz zu einem Würfel falten?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[0, 0, blue], [1, 0, blue], [1, 1, blue], [1, 2, blue], [1, 3, blue], [2, 3, blue]] }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Wo muss das sechste Quadrat hin, damit ein Würfelnetz entsteht?"
                say: "Hier fehlt ein Quadrat. Wo muss das sechste Quadrat hin, damit ein Würfelnetz entsteht: bei A, B oder C?"
                show: { drawn: grid, cols: 5, rows: 3, cells: [[1, 0, orange], [0, 1, orange], [1, 1, orange], [2, 1, orange], [3, 1, orange]], labels: [[4, 1, A], [2, 2, B], [2, 0, C]] }
                options: ["A", "B", "C"]
                answer: "B"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Ein Würfelnetz kann 5 Quadrate in einer Reihe haben."
                say: "Stimmt das? Ein Würfelnetz kann fünf Quadrate in einer Reihe haben."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welches ist ein Würfelnetz?"
            say: "Welche Figur ist ein Würfelnetz?"
            options:
              - { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, green], [1, 0, green], [2, 0, green], [3, 0, green], [0, 1, green], [3, 1, green]], key: unten }
              - { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [1, 2, green], [1, 3, green]], key: netz }
              - { drawn: grid, cols: 3, rows: 2, cells: [[0, 0, green], [1, 0, green], [2, 0, green], [0, 1, green], [1, 1, green], [2, 1, green]], key: rechteck }
            answer: netz
          - id: l1-c2
            type: true_false
            text: "Lässt sich das zu einem Würfel falten?"
            say: "Lässt sich das zu einem Würfel falten?"
            show: { drawn: grid, cols: 4, rows: 2, cells: [[0, 0, purple], [1, 0, purple], [2, 0, purple], [3, 0, purple], [0, 1, purple], [1, 1, purple]] }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Wie viele Quadrate hat ein Würfelnetz?"
            say: "Wie viele Quadrate hat ein Würfelnetz?"
            options: ["6", "5", "8"]
            answer: "6"
          - id: l1-c4
            type: true_false
            text: "Lässt sich dieses Netz zu einem Würfel falten?"
            say: "Lässt sich dieses Netz zu einem Würfel falten?"
            show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, orange], [2, 0, orange], [0, 1, orange], [1, 1, orange], [1, 2, orange], [1, 3, orange]] }
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Warum ist das kein Würfelnetz?"
            say: "Warum lässt sich das nicht zu einem Würfel falten?"
            show: { drawn: grid, cols: 4, rows: 2, cells: [[1, 0, blue], [3, 0, blue], [0, 1, blue], [1, 1, blue], [2, 1, blue], [3, 1, blue]] }
            options: ["Zwei Quadrate werden beide zum Deckel.", "Vier Quadrate liegen als Block zusammen.", "Es hat 5 Quadrate in einer Reihe."]
            answer: "Zwei Quadrate werden beide zum Deckel."
          - id: l1-c6
            type: multiple_choice
            text: "Wo muss das sechste Quadrat hin, damit ein Würfelnetz entsteht?"
            say: "Hier fehlt ein Quadrat. Wo muss das sechste Quadrat hin, damit ein Würfelnetz entsteht: bei A, B oder C?"
            show: { drawn: grid, cols: 5, rows: 3, cells: [[0, 0, yellow], [0, 1, yellow], [1, 1, yellow], [2, 1, yellow], [3, 1, yellow]], labels: [[2, 2, A], [1, 0, B], [4, 1, C]] }
            options: ["A", "B", "C"]
            answer: "A"
            option_audio: false

  - n: 2
    title: { de: "Was liegt gegenüber?", en: "Which faces are opposite?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Lässt sich dieses Netz zu einem Würfel falten?"
            say: "Lässt sich dieses Netz zu einem Würfel falten?"
            show: { drawn: grid, cols: 4, rows: 3, cells: [[1, 0, yellow], [0, 1, yellow], [1, 1, yellow], [2, 1, yellow], [3, 1, yellow], [1, 2, yellow]] }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Warum ist das kein Würfelnetz?"
            say: "Warum lässt sich das nicht zu einem Würfel falten?"
            show: { drawn: grid, cols: 3, rows: 2, cells: [[0, 0, red], [1, 0, red], [2, 0, red], [0, 1, red], [1, 1, red], [2, 1, red]] }
            options: ["Vier Quadrate liegen als Block zusammen.", "Es hat zu wenige Quadrate."]
            answer: "Vier Quadrate liegen als Block zusammen."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "B und D liegen gegenüber."
            say: "Wenn du dieses Netz faltest, welche Flächen liegen sich gegenüber? Schau auf die Reihe B, C, D. Zwischen B und D liegt genau ein Quadrat. Also liegen B und D beim Würfel gegenüber. Genauso A und E, und C und F."
            show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, yellow], [0, 1, yellow], [1, 1, yellow], [2, 1, yellow], [1, 2, yellow], [1, 3, yellow]], labels: [[1, 0, A], [0, 1, B], [1, 1, C], [2, 1, D], [1, 2, E], [1, 3, F]] }
          - text: "Spielwürfel: gegenüber zusammen 7"
            say: "Bei einem Spielwürfel ergeben die Augen auf zwei gegenüberliegenden Flächen zusammen immer sieben: eins und sechs, zwei und fünf, drei und vier."
            show: { drawn: shape, kind: cube, colour: white }
          - text: "Was liegt der 2 gegenüber?"
            say: "In diesem Würfelnetz liegt zwischen der Zwei und der Fünf genau ein Quadrat. Also liegen sie gegenüber. Zwei plus fünf ist sieben. Das passt zum Spielwürfel."
            show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, white], [0, 1, white], [1, 1, white], [2, 1, white], [1, 2, white], [1, 3, white]], labels: [[1, 0, "3"], [0, 1, "1"], [1, 1, "2"], [2, 1, "6"], [1, 2, "4"], [1, 3, "5"]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Fläche liegt B gegenüber?"
                say: "Du faltest das Netz zu einem Würfel. Welche Fläche liegt B gegenüber?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [1, 2, green], [1, 3, green]], labels: [[1, 0, A], [0, 1, B], [1, 1, C], [2, 1, D], [1, 2, E], [1, 3, F]] }
                options: ["D", "C", "A"]
                answer: "D"
                option_audio: false
                feedback:
                  "C": "C liegt direkt neben B. Beim Würfel stoßen die beiden an einer Kante zusammen."
                hints:
                  - "Such die Reihe, in der B liegt."
                  - "In der Reihe B, C, D liegt genau ein Quadrat zwischen B und einer anderen Fläche."
                  - "D."
              - id: l2-f2
                type: multiple_choice
                text: "Welche Fläche liegt A gegenüber?"
                say: "Du faltest das Netz zu einem Würfel. Welche Fläche liegt A gegenüber?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, green], [0, 1, green], [1, 1, green], [2, 1, green], [1, 2, green], [1, 3, green]], labels: [[1, 0, A], [0, 1, B], [1, 1, C], [2, 1, D], [1, 2, E], [1, 3, F]] }
                options: ["E", "F", "C"]
                answer: "E"
                option_audio: false
                feedback:
                  "F": "Zwischen A und F liegen zwei Quadrate. Gegenüber liegt das Quadrat mit genau einem dazwischen."
                  "C": "C liegt direkt neben A. Die beiden stoßen zusammen."
                hints:
                  - "A liegt in der senkrechten Reihe A, C, E, F."
                  - "Geh von A ein Quadrat weiter, und dann noch eins."
                  - "E."
              - id: l2-f3
                type: multiple_choice
                text: "Beim Spielwürfel: Welche Zahl liegt der 2 gegenüber?"
                say: "Beim Spielwürfel: Welche Augenzahl liegt der Zwei gegenüber?"
                options: ["5", "4", "6"]
                answer: "5"
                hints:
                  - "Gegenüberliegende Flächen ergeben zusammen 7."
                  - "2 plus wie viel ist 7?"
                  - "2 + 5 = 7."
              - id: l2-f4
                type: true_false
                text: "Wird das ein richtiger Spielwürfel?"
                say: "Stimmt das? Aus diesem Netz wird ein richtiger Spielwürfel."
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, white], [0, 1, white], [1, 1, white], [2, 1, white], [1, 2, white], [1, 3, white]], labels: [[1, 0, "1"], [0, 1, "3"], [1, 1, "2"], [2, 1, "4"], [1, 2, "6"], [1, 3, "5"]] }
                answer: true
                hints:
                  - "Such die drei Paare, die gegenüber liegen."
                  - "1 und 6, 3 und 4, 2 und 5. Ergibt jedes Paar 7?"
                  - "Ja, jedes Paar ergibt 7."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Zahl gehört auf das Fragezeichen?"
                say: "Das Netz soll ein Spielwürfel werden. Welche Zahl gehört auf das Fragezeichen?"
                show: { drawn: grid, cols: 3, rows: 4, cells: [[1, 0, white], [0, 1, white], [1, 1, white], [2, 1, white], [1, 2, white], [1, 3, white]], labels: [[1, 0, "1"], [0, 1, "2"], [1, 1, "3"], [2, 1, "5"], [1, 2, "6"], [1, 3, "?"]] }
