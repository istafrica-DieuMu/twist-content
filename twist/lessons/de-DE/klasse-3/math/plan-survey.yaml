# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.plan-survey
skill: math.data.plan-survey
curriculum: de-DE
language: de
title:
  de: Eine Umfrage machen
  en: Doing a survey
summary: >
  Lesson 1 plans a class survey: a clear question that fits what you
  want to know, answers to choose from with "etwas anderes" for the
  rest, the right people to ask (the whole class, each child once, not
  only your friends), a Strichliste to collect the answers, and the
  steps in order. Lesson 2 counts the answers into a table, checks that
  the total matches the number of children asked, picks the
  Säulendiagramm that fits, says the result in a sentence that the data
  supports (9 von 24 Kindern, not "alle Kinder"), and ends with the
  skill check. Asking real classmates and drawing the chart by hand
  stay in the classroom.
metadata:
  year: klasse-3
  topic: { de: Daten, en: Data }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.data.pictograms-bar-charts, math.data.read-tables]
  also_practises: [math.data.tally, math.data.pictograms-bar-charts]
  vocabulary: { de: [Umfrage, Frage, Antwort, befragen, Strichliste, Tabelle, Säulendiagramm, Ergebnis, insgesamt, etwas anderes] }
  forms: [text, audio, drawn]
  drawn: [bar-chart]
  facets: []
  misconceptions:
    - id: open-question
      what: Asks a question with no answers to choose from or one that does not fit the goal, so the answers cannot be counted or say nothing about it
      addressed: lesson 1 Learn sets answers to choose from; l1-f1 (with feedback), l1-f2, l1-s1, l1-s2, l1-n1 and l2-c1 compare a clear question with an open or off-goal one
    - id: biased-sample
      what: Asks only some children (friends, one table, the football team) or lets a child answer twice, and still speaks for the whole class
      addressed: lesson 1 Learn asks the whole class once each; l1-f4 (with feedback), l1-s4, l1-n4, l1-n5 and l2-c2 ask who should be asked
    - id: total-not-checked
      what: Does not check that the counts add up to the number of children asked
      addressed: lesson 2 Learn adds the table up and compares with the class; l2-f3 (with feedback), l2-s3, l2-n3 and l2-c4 find a total that does not fit
    - id: overclaims-result
      what: States more than the data shows ("alle Kinder mögen Fußball" when 9 of 24 chose it)
      addressed: lesson 2 Learn writes a result sentence with "9 von 24"; l2-f5 (with feedback), l2-s5, l2-n5 and l2-c5 choose the sentence that fits
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Eine Umfrage planen", en: "Planning a survey" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Obst mögen die meisten Kinder?"
            say: "Das Säulendiagramm zeigt das Lieblingsobst der Klasse. Welches Obst mögen die meisten Kinder?"
            show: { drawn: bar-chart, rows: [["Apfel", 6], ["Birne", 3], ["Kiwi", 8]] }
            options: ["Kiwi", "Apfel", "Birne"]
            answer: "Kiwi"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Bus: 5\nFahrrad: 4\nzu Fuß: 9\nWie viele Kinder kommen mit dem Fahrrad?"
            say: "In der Tabelle steht, wie die Kinder zur Schule kommen. Wie viele Kinder kommen mit dem Fahrrad?"
            options: ["4", "5", "9"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was wollen wir wissen?\nWelches Pausenspiel mögen die Kinder der 3b am liebsten?"
            say: "Die Klasse drei b will eine Umfrage machen. Zuerst überlegt sie: Was wollen wir wissen? Welches Pausenspiel mögen die Kinder der Klasse am liebsten?"
          - text: "Was spielst du in der Pause am liebsten?\nFangen, Fußball, Seilspringen, Klettern, etwas anderes"
            say: "Dann kommt eine klare Frage mit Antworten zum Auswählen. So kann man die Antworten gut zählen. Mit „etwas anderes“ findet jedes Kind eine passende Antwort."
          - text: "Alle 24 Kinder der 3b\njedes Kind genau einmal"
            say: "Jetzt fragst du alle Kinder der Klasse, jedes Kind genau einmal. Wenn du nur deine Freunde fragst, weißt du nichts über die ganze Klasse."
          - text: "Fangen, Fußball, Seilspringen, Klettern"
            say: "Jede Antwort ist ein Strich in der Strichliste. Am Ende zählst du die Striche aus."
            show: { drawn: bar-chart, tally: true, rows: [["Fangen", 7], ["Fußball", 9], ["Seilspringen", 5], ["Klettern", 3]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ihr wollt wissen, wie die Kinder zur Schule kommen. Welche Frage passt?"
                say: "Ihr wollt wissen, wie die Kinder zur Schule kommen. Welche Frage passt zu eurer Umfrage?"
                options: ["Wie kommst du zur Schule: zu Fuß, mit dem Rad, mit dem Bus, mit dem Auto?", "Magst du die Schule?", "Wann stehst du morgens auf?"]
                answer: "Wie kommst du zur Schule: zu Fuß, mit dem Rad, mit dem Bus, mit dem Auto?"
                feedback:
                  "Magst du die Schule?": "Diese Frage sagt nichts darüber, wie die Kinder zur Schule kommen."
                hints:
                  - "Die Frage muss zu dem passen, was ihr wissen wollt."
                  - "Ihr wollt etwas über den Schulweg wissen."
                  - "Die Frage mit zu Fuß, Rad, Bus und Auto."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Mit welcher Frage kannst du die Antworten gut zählen?"
                say: "Ihr wollt wissen, was die Kinder am liebsten trinken. Mit welcher Frage könnt ihr die Antworten gut zählen?"
                options: ["Was trinkst du am liebsten: Wasser, Saft, Milch oder etwas anderes?", "Erzähl mal, was du so trinkst.", "Was hast du gestern alles getrunken?"]
                answer: "Was trinkst du am liebsten: Wasser, Saft, Milch oder etwas anderes?"
                hints:
                  - "Gut zählen kannst du, wenn es feste Antworten gibt."
                  - "Bei „Erzähl mal“ bekommst du lauter verschiedene Antworten."
                  - "Die Frage mit Wasser, Saft, Milch oder etwas anderes."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Haustier hast du?\nHund, Katze, Hase\nWelche Antwort fehlt?"
                say: "Die Frage heißt: Welches Haustier hast du? Hund, Katze oder Hase. Welche Antwort fehlt, damit jedes Kind antworten kann?"
                options: ["kein Haustier oder ein anderes", "großer Hund", "schwarze Katze"]
                answer: "kein Haustier oder ein anderes"
                hints:
                  - "Denk an ein Kind mit einem Wellensittich."
                  - "Und an ein Kind ohne Haustier."
                  - "Es fehlt: kein Haustier oder ein anderes."
              - id: l1-f4
                type: multiple_choice
                text: "Ihr wollt wissen, welches Buch die 3a am liebsten liest. Wen fragt ihr?"
                say: "Ihr wollt wissen, welches Buch die Kinder der Klasse drei a am liebsten lesen. Wen fragt ihr?"
                options: ["alle Kinder der 3a", "nur eure Freunde aus der 3a", "die Kinder in der Bücherei"]
                answer: "alle Kinder der 3a"
                feedback:
                  "nur eure Freunde aus der 3a": "Eure Freunde mögen vielleicht dieselben Bücher wie ihr. Dann stimmt das Ergebnis nicht für die ganze Klasse."
                hints:
                  - "Ihr wollt etwas über die ganze Klasse wissen."
                  - "Freunde lesen oft ähnliche Bücher."
                  - "Alle Kinder der 3a."
              - id: l1-f5
                type: multiple_choice
                text: "Wie hältst du die Antworten am besten fest?"
                say: "Du fragst vierundzwanzig Kinder nacheinander. Wie hältst du die Antworten am besten fest?"
                options: ["mit einer Strichliste", "im Kopf merken", "erst am Ende alles aufschreiben"]
                answer: "mit einer Strichliste"
                hints:
                  - "Vierundzwanzig Antworten kann man sich schlecht merken."
                  - "Nach jeder Antwort machst du einen Strich."
                  - "Mit einer Strichliste."
              - id: l1-f6
                type: ordering
                text: "Bring die Schritte der Umfrage in die richtige Reihenfolge."
                say: "Bring die Schritte der Umfrage in die richtige Reihenfolge."
                options: ["Kinder befragen", "Frage und Antworten überlegen", "Ergebnis vorstellen", "Strichliste auszählen"]
                slot_count: 4
                answer: ["Frage und Antworten überlegen", "Kinder befragen", "Strichliste auszählen", "Ergebnis vorstellen"]
                hints:
                  - "Bevor du fragst, brauchst du eine Frage."
                  - "Erst nach dem Befragen gibt es Striche zum Zählen."
                  - "Überlegen, befragen, auszählen, vorstellen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ihr wollt wissen, wohin die Klasse einen Ausflug machen möchte. Welche Frage passt?"
                say: "Ihr wollt wissen, wohin die Klasse einen Ausflug machen möchte. Welche Frage passt?"
                options: ["Wohin möchtest du: Zoo, Schwimmbad, Bauernhof oder Museum?", "Warst du schon mal im Zoo?", "Wie alt bist du?"]
                answer: "Wohin möchtest du: Zoo, Schwimmbad, Bauernhof oder Museum?"
                hints: ["Welche Frage fragt nach dem Ausflugsziel?"]
              - id: l1-s2
                type: true_false
                text: "Was isst du gern?\nIst das eine gute Frage für eine Umfrage?"
                say: "Leo will wissen, was die Kinder am liebsten essen. Er fragt: Was isst du gern? Ist das eine gute Frage für eine Umfrage?"
                answer: false
                hints: ["Wie viele verschiedene Antworten bekommt Leo wohl? Kann er sie gut zählen?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Farbe hat dein Fahrrad?\nRot, Blau, Schwarz\nWelche Antwort fehlt?"
                say: "Die Frage heißt: Welche Farbe hat dein Fahrrad? Rot, Blau oder Schwarz. Welche Antwort fehlt?"
                options: ["eine andere Farbe oder kein Fahrrad", "hellrot", "ein neues Fahrrad"]
                answer: "eine andere Farbe oder kein Fahrrad"
                hints: ["Was antwortet ein Kind mit einem grünen Fahrrad?"]
              - id: l1-s4
                type: true_false
                text: "Mila fragt nur die Kinder aus der Fußball-AG. Weiß sie dann, welchen Sport die ganze Klasse mag?"
                say: "Mila will wissen, welchen Sport die Kinder der Klasse am liebsten mögen. Sie fragt nur die Kinder aus der Fußball-AG. Weiß sie dann, was die ganze Klasse mag?"
                answer: false
                hints: ["Was antworten Kinder aus der Fußball-AG wohl?"]
              - id: l1-s5
                type: true_false
                text: "Tom stimmt zweimal ab. Ist das in Ordnung?"
                say: "Bei der Umfrage zum Lieblingsspiel stimmt Tom zweimal für Fangen ab. Ist das in Ordnung?"
                answer: false
                hints: ["Wie oft darf jedes Kind antworten?"]
              - id: l1-s6
                type: multiple_choice
                text: "Was machst du nach dem Befragen?"
                say: "Du hast alle Kinder befragt und die Striche gemacht. Was machst du als Nächstes?"
                options: ["die Striche auszählen", "eine neue Frage überlegen", "die Kinder noch einmal fragen"]
                answer: "die Striche auszählen"
                hints: ["Du willst wissen, wie viele Kinder jede Antwort gegeben haben."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ihr wollt wissen, welches Tier die Kinder im Zoo am liebsten sehen. Welche Frage passt?"
                say: "Ihr wollt wissen, welches Tier die Kinder im Zoo am liebsten sehen möchten. Welche Frage passt?"
                options: ["Welches Zootier möchtest du am liebsten sehen: Löwe, Affe, Elefant oder ein anderes?", "Hast du ein Haustier?", "Wie heißt der Zoo in unserer Stadt?"]
                answer: "Welches Zootier möchtest du am liebsten sehen: Löwe, Affe, Elefant oder ein anderes?"
              - id: l1-n2
                type: true_false
                text: "Du findest doch auch, dass Pizza das beste Essen ist?\nIst das eine gute Frage für eine Umfrage?"
                say: "Ida fragt: Du findest doch auch, dass Pizza das beste Essen ist? Ist das eine gute Frage für eine Umfrage?"
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Wie viele Geschwister hast du?\nEins, zwei, drei\nWelche Antwort fehlt?"
                say: "Die Frage heißt: Wie viele Geschwister hast du? Eins, zwei oder drei. Welche Antwort fehlt?"
                options: ["keine oder mehr als drei", "zwei Schwestern", "einen großen Bruder"]
                answer: "keine oder mehr als drei"
              - id: l1-n4
                type: multiple_choice
                text: "Ihr wollt wissen, wie lange die Kinder der ganzen Schule für den Schulweg brauchen. Wen fragt ihr?"
                say: "Ihr wollt wissen, wie lange die Kinder der ganzen Schule für den Schulweg brauchen. Wen fragt ihr am besten?"
                options: ["Kinder aus allen Klassen", "nur Kinder, die nah an der Schule wohnen", "nur Kinder, die mit dem Bus kommen"]
                answer: "Kinder aus allen Klassen"
              - id: l1-n5
                type: true_false
                text: "Paula fragt die Kinder an ihrem Tisch. Jetzt weiß sie, was die ganze Klasse denkt."
                say: "Paula fragt die vier Kinder an ihrem Gruppentisch. Stimmt das? Jetzt weiß sie, was die ganze Klasse denkt."
                answer: false
              - id: l1-n6
                type: ordering
                text: "Bring die Schritte in die richtige Reihenfolge."
                say: "Bring die Schritte der Umfrage in die richtige Reihenfolge."
                options: ["Strichliste auszählen", "Kinder befragen", "Frage und Antworten überlegen", "Säulendiagramm zeichnen"]
                slot_count: 4
                answer: ["Frage und Antworten überlegen", "Kinder befragen", "Strichliste auszählen", "Säulendiagramm zeichnen"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ihr wollt wissen, welches Instrument die Kinder lernen möchten. Welche Frage passt?"
            say: "Ihr wollt wissen, welches Instrument die Kinder gern lernen möchten. Welche Frage passt?"
            options: ["Welches Instrument möchtest du lernen: Gitarre, Klavier, Flöte, Trommel oder ein anderes?", "Magst du Musik?", "Wie heißt dein Lieblingslied?"]
            answer: "Welches Instrument möchtest du lernen: Gitarre, Klavier, Flöte, Trommel oder ein anderes?"
          - id: l1-c2
            type: true_false
            text: "Jedes Kind darf nur einmal antworten."
            say: "Stimmt das? Bei einer Umfrage darf jedes Kind nur einmal antworten."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wie hältst du die Antworten fest?"
            say: "Du fragst die Kinder der Klasse nacheinander. Wie hältst du die Antworten am besten fest?"
            options: ["mit einer Strichliste", "im Kopf merken", "gar nicht"]
            answer: "mit einer Strichliste"

  - n: 2
    title: { de: "Auswerten und vorstellen", en: "Counting and presenting" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ihr wollt wissen, welche Jahreszeit die Kinder am liebsten mögen. Welche Frage passt?"
            say: "Ihr wollt wissen, welche Jahreszeit die Kinder am liebsten mögen. Welche Frage passt?"
            options: ["Welche Jahreszeit magst du am liebsten: Frühling, Sommer, Herbst oder Winter?", "Wann hast du Geburtstag?"]
            answer: "Welche Jahreszeit magst du am liebsten: Frühling, Sommer, Herbst oder Winter?"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ben fragt nur seine Freunde. Ist das gut?"
            say: "Ben will wissen, was die ganze Klasse mag. Er fragt nur seine Freunde. Ist das gut?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Fangen: 7\nFußball: 9\nSeilspringen: 5\nKlettern: 3"
            say: "Die Klasse drei b hat ihre Strichliste ausgezählt. Jetzt schreibt sie die Zahlen in eine Tabelle."
            show: { drawn: bar-chart, tally: true, rows: [["Fangen", 7], ["Fußball", 9], ["Seilspringen", 5], ["Klettern", 3]] }
          - text: "7 + 9 + 5 + 3 = 24\nIn der Klasse sind 24 Kinder."
            say: "Dann rechnet sie alles zusammen: sieben plus neun plus fünf plus drei ist vierundzwanzig. In der Klasse sind vierundzwanzig Kinder. Es passt. Jedes Kind wurde genau einmal gezählt."
          - text: "Pausenspiele der 3b"
            say: "Mit einem Säulendiagramm sieht man das Ergebnis auf einen Blick. Die Säule für Fußball ist am höchsten."
            show: { drawn: bar-chart, rows: [["Fangen", 7], ["Fußball", 9], ["Seil", 5], ["Klettern", 3]] }
          - text: "Am liebsten spielen die Kinder Fußball: 9 von 24 Kindern."
            say: "Zum Schluss sagst du das Ergebnis in einem Satz. Schreib nur, was die Zahlen zeigen. Neun von vierundzwanzig Kindern spielen am liebsten Fußball. Das sind die meisten, aber nicht alle."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Antworten: Hund, Katze, Hund, Hase, Hund, Katze, Hund\nWie viele Kinder haben „Hund“ gesagt?"
                say: "Das sind die Antworten von sieben Kindern. Wie viele Kinder haben „Hund“ gesagt?"
                options: ["4", "3", "2"]
                answer: "4"
                hints:
                  - "Geh die Antworten der Reihe nach durch."
                  - "Mach für jeden Hund einen Strich."
                  - "4 Kinder."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Schreib die Zahlen in die Tabelle."
                say: "Zähl die Strichliste aus und schreib die Zahlen in die Tabelle."
                show: { drawn: bar-chart, tally: true, rows: [["Zoo", 8], ["Schwimmbad", 11], ["Bauernhof", 6]] }
                frame: "Zoo: _  Schwimmbad: _  Bauernhof: _"
                options: ["6", "8", "10", "11"]
                answer: ["8", "11", "6"]
                hints:
                  - "Zähl zuerst die Fünferbündel."
                  - "Schwimmbad hat zwei Fünferbündel und einen Strich."
                  - "Zoo 8, Schwimmbad 11, Bauernhof 6."
              - id: l2-f3
                type: multiple_choice
                text: "Zoo: 8\nSchwimmbad: 11\nBauernhof: 6\nIn der Klasse sind 23 Kinder. Was stimmt?"
                say: "In der Klasse sind dreiundzwanzig Kinder. Alle haben einmal abgestimmt. Was stimmt?"
                options: ["Es passt nicht: Zusammen sind es 25.", "Es passt genau.", "Es fehlen zwei Kinder."]
                answer: "Es passt nicht: Zusammen sind es 25."
                feedback:
                  "Es passt genau.": "Rechne nach: 8 + 11 + 6 = 25. Das sind 2 mehr als 23."
                hints:
                  - "Rechne alle Zahlen zusammen."
                  - "8 + 11 + 6 = 25."
                  - "25 ist mehr als 23. Es passt nicht."
              - id: l2-f4
                type: image_multiple_choice
                text: "Zoo 8, Schwimmbad 11, Bauernhof 6. Welches Säulendiagramm passt?"
                say: "Zoo acht, Schwimmbad elf, Bauernhof sechs. Welches Säulendiagramm passt?"
                options:
                  - { drawn: bar-chart, rows: [["Zoo", 8], ["Bad", 11], ["Hof", 6]], key: "8-11-6" }
                  - { drawn: bar-chart, rows: [["Zoo", 11], ["Bad", 8], ["Hof", 6]], key: "11-8-6" }
                  - { drawn: bar-chart, rows: [["Zoo", 8], ["Bad", 6], ["Hof", 11]], key: "8-6-11" }
                answer: "8-11-6"
                hints:
                  - "Welche Säule muss am höchsten sein?"
                  - "Schwimmbad hat 11. Die Säule für Bad ist am höchsten."
                  - "Zoo bis 8, Bad bis 11, Hof bis 6."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Satz passt zum Ergebnis?"
                say: "Zoo acht, Schwimmbad elf, Bauernhof sechs. Welcher Satz passt zum Ergebnis?"
                show: { drawn: bar-chart, rows: [["Zoo", 8], ["Bad", 11], ["Hof", 6]] }
                options: ["Die meisten Kinder möchten ins Schwimmbad.", "Alle Kinder möchten ins Schwimmbad.", "Kein Kind möchte auf den Bauernhof."]
                answer: "Die meisten Kinder möchten ins Schwimmbad."
                feedback:
                  "Alle Kinder möchten ins Schwimmbad.": "11 Kinder möchten ins Schwimmbad, aber nicht alle. 14 Kinder möchten woandershin."
                hints:
                  - "Lies jeden Satz und prüf ihn am Diagramm."
                  - "Schwimmbad hat die höchste Säule, aber Zoo und Hof haben auch Stimmen."
                  - "Die meisten möchten ins Schwimmbad."
              - id: l2-f6
                type: multiple_choice
                text: "Wie viele Kinder mehr möchten ins Schwimmbad als in den Zoo?"
                say: "Wie viele Kinder mehr möchten ins Schwimmbad als in den Zoo?"
                show: { drawn: bar-chart, rows: [["Zoo", 8], ["Bad", 11], ["Hof", 6]] }
                options: ["3", "19", "5"]
                answer: "3"
                hints:
                  - "Lies beide Säulen ab."
                  - "Schwimmbad 11, Zoo 8."
                  - "11 − 8 = 3."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Antworten: Rad, Bus, zu Fuß, Rad, Rad, Bus, zu Fuß, Rad\nWie viele Kinder kommen mit dem Rad?"
                say: "Das sind die Antworten von acht Kindern. Wie viele Kinder kommen mit dem Rad?"
                options: ["4", "3", "2"]
                answer: "4"
                hints: ["Mach für jedes Rad einen Strich."]
              - id: l2-s2
                type: fill_in_blank
                text: "Schreib die Zahlen in die Tabelle."
                say: "Zähl die Strichliste aus und schreib die Zahlen in die Tabelle."
                show: { drawn: bar-chart, tally: true, rows: [["Frühling", 5], ["Sommer", 12], ["Herbst", 4], ["Winter", 7]] }
                frame: "Frühling: _  Sommer: _  Herbst: _  Winter: _"
                options: ["4", "5", "7", "12"]
                answer: ["5", "12", "4", "7"]
                hints: ["Ein Fünferbündel sind 5 Striche."]
              - id: l2-s3
                type: multiple_choice
                text: "Frühling: 5\nSommer: 12\nHerbst: 4\nWinter: 7\nIn der Klasse sind 26 Kinder. Was stimmt?"
                say: "In der Klasse sind sechsundzwanzig Kinder. Alle haben einmal abgestimmt. Was stimmt?"
                options: ["Es passt nicht: Zusammen sind es 28.", "Es passt genau.", "Es passt nicht: Zusammen sind es 24."]
                answer: "Es passt nicht: Zusammen sind es 28."
                hints: ["Rechne 5 + 12 + 4 + 7."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Frühling 5, Sommer 12, Herbst 4, Winter 7. Welches Säulendiagramm passt?"
                say: "Frühling fünf, Sommer zwölf, Herbst vier, Winter sieben. Welches Säulendiagramm passt?"
