            answer: ["40", "50"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "374"
            say: "Die Nachbarzehner von dreihundertvierundsiebzig sind die Zehnerzahlen davor und danach: dreihundertsiebzig und dreihundertachtzig."
            show: { drawn: number-line, from: 370, to: 380, labels: ends, mark: 374 }
          - text: "300 | 374 | 400"
            say: "Die Nachbarhunderter sind die Hunderterzahlen davor und danach: dreihundert und vierhundert."
            show: { drawn: number-line, from: 300, to: 400, step: 10, labels: ends, mark: 374 }
          - text: "Hunderter: 300, Zehner: 370"
            say: "Ein Trick: Für den Nachbarhunderter davor bleibt nur die Hunderterziffer, der Rest wird null. Für den Nachbarzehner davor wird nur die Einerziffer null."

