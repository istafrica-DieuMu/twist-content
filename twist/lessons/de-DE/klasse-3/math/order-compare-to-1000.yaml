# Lesson set: Mathe, Klasse 3. Hand-authored draft.
id: de-DE.math.order-compare-to-1000
skill: math.numbers-to-1000.order-compare
curriculum: de-DE
language: de
title:
  de: Ordnen und vergleichen bis 1000
  en: Ordering and comparing to 1000
summary: >
  Comparing three-digit numbers from the left: hundreds first, then tens,
  then ones. Lesson 1 compares and orders; lesson 2 finds Nachbarzehner
  and Nachbarhunderter, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [math.numbers-to-1000.number-line]
  also_practises: [math.numbers-to-1000.place-value]
  vocabulary: { de: [größer als, kleiner als, Nachbarzehner, Nachbarhunderter, Stelle] }
  forms: [drawn, text, audio]
  drawn: [place-value-chart, number-line]
  facets: [operation-signs]
  parts:
    - { id: compare, what: { de: zwei Zahlen bis 1000 vergleichen, en: comparing two numbers to 1000 } }
    - { id: order, what: { de: Zahlen bis 1000 der Größe nach ordnen, en: putting numbers to 1000 in order } }
    - { id: neighbours, what: { de: Nachbarzehner und Nachbarhunderter bestimmen, en: finding the neighbouring tens and hundreds } }
  misconceptions:
    - id: more-digits-bigger-digit
      what: Compares by the biggest digit anywhere (thinks 199 > 301 because of the 9s)
      addressed: Learn compares from the left, one chart per number; feedback on 199 > 301 names the hundreds
    - id: neighbour-tens-hundreds
      what: Mixes up Nachbarzehner and Nachbarhunderter
      addressed: lesson 2 asks for both for the same number, one after the other
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Von links vergleichen, en: Compare from the left }
    goal:
      de: "Vergleiche Zahlen von links, zuerst die Hunderter. 301 ist größer als 199."
      en: "Compare numbers from the left, hundreds first. 301 is bigger than 199."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            frame: "47 _ 74"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viel ist die 3 in 352 wert?"
            options: ["3", "30", "300"]
            answer: "300"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "301 und 199"
            say: "Welche Zahl ist größer? Wir vergleichen von links, zuerst die Hunderter. Dreihunderteins hat drei Hunderter, hundertneunundneunzig nur einen."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [3, 0, 1] }
          - text: "301 und 199: 301 > 199"
            say: "Drei Hunderter sind mehr als ein Hunderter. Also ist dreihunderteins größer, auch wenn hundertneunundneunzig zwei Neunen hat."
            show: { drawn: place-value-chart, columns: [hundreds, tens, ones], values: [1, 9, 9] }
          - text: "456 < 465"
            say: "Sind die Hunderter gleich, vergleichen wir die Zehner. Vierhundertsechsundfünfzig hat fünf Zehner, vierhundertfünfundsechzig hat sechs. Sind auch die Zehner gleich, entscheiden die Einer."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "199 _ 301"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "Schau zuerst auf die Hunderter: 1 Hunderter ist weniger als 3 Hunderter."
                hints:
                  - "Vergleiche zuerst die Hunderter."
                  - "199 hat 1 Hunderter, 301 hat 3."
                  - "199 ist kleiner als 301."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "582 _ 528"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Die Hunderter sind gleich."
                  - "Vergleiche die Zehner: 8 und 2."
                  - "582 ist größer als 528."
              - id: l1-f3
                type: ordering
                text: "Ordne die Zahlen. Die kleinste zuerst."
                options: ["640", "406", "604", "460"]
                slot_count: 4
                answer: ["406", "460", "604", "640"]
                hints:
                  - "Welche Zahlen haben 4 Hunderter?"
                  - "406 und 460 zuerst. Welche davon ist kleiner?"
                  - "406, 460, 604, 640."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 738 > 783"
                answer: false
                hints:
                  - "Die Hunderter sind gleich."
                  - "Zehner: 3 und 8."
                  - "Nein, 738 ist kleiner."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Zahl ist am größten?"
                options: ["899", "980", "908"]
                answer: "980"
                hints:
                  - "Wer hat die meisten Hunderter?"
                  - "980 und 908 haben 9 Hunderter. Vergleiche die Zehner."
                  - "980 ist am größten."
              - id: l1-f6
