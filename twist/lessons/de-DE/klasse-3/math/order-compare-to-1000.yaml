                feedback:
                  "500": "500 ist ein Nachbarhunderter. Nachbarzehner sind Zehnerzahlen."
                hints:
                  - "Nachbarzehner sind die Zehnerzahlen davor und danach."
                  - "Die Einerziffer wird 0: 520. Danach kommt 530."
                  - "520 und 530."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Wie heißen die Nachbarhunderter von 528?"
                frame: "_ , 528, _"
