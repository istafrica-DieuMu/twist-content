# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.book-choice
skill: lit-de.texts-media.book-choice
curriculum: de-DE
language: de
title:
  de: Ein Buch auswählen und vorstellen
  en: Choosing and presenting a book
summary: >
  Choosing a book that suits you and presenting it. Lesson 1 uses the
  title, the Klappentext and the contents to pick a book for a reader's
  interests and tells a Sachbuch from a story; lesson 2 builds a short
  Buchvorstellung in the right order and gives a reason for liking a book,
  and ends with the skill check. All books are made up for Twist.
  Presenting a book aloud waits for a spoken, assessed task type; until
  then the skill check marks what a screen can mark (the book that fits a
  reader, the parts of a book, the order of a Buchvorstellung, an opinion
  with a reason) and Practise covers the rest.
metadata:
  year: klasse-3
  topic: { de: Bücher, en: Books }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.texts-media.story-elements]
  also_practises: [lit-de.texts-media.story-elements, lit-de.speaking.argue]
  vocabulary: { de: [Titel, Autorin, Autor, Klappentext, Inhaltsverzeichnis, Sachbuch, Buchvorstellung, Lieblingsstelle] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: choose, what: { de: "ein Buch nach den eigenen Interessen auswählen (Titel, Klappentext)", en: "choosing a book by your interests (title, blurb)" } }
    - { id: book-parts, what: { de: "Klappentext, Inhaltsverzeichnis, Sachbuch und Erzählung kennen", en: "knowing the blurb, the contents, non-fiction and stories" } }
    - { id: present, what: { de: "eine Buchvorstellung in der richtigen Reihenfolge aufbauen, ohne das Ende zu verraten", en: "building a book talk in the right order without giving away the end" } }
    - { id: reason, what: { de: "sagen, warum einem das Buch gefällt", en: saying why you like the book } }
  misconceptions:
    - id: cover-only
      what: Chooses a book only by its cover or its thickness
      addressed: "lesson 1 Learn reads the Klappentext; every stage matches a reader to a book by its Klappentext (l1-f4, l1-s4, l1-n4), with feedback on l1-f2 for choosing by thickness"
    - id: no-reason
      what: Says only that a book is good or great, without a reason
      addressed: "lesson 2 picks the opinion with a reason in every stage (l2-f3, l2-s3, l2-n3, l2-c4); feedback on l2-f3 names the bare opinion"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Welches Buch passt zu mir?", en: "Which book suits me?" }
    goal:
      de: "Finde ein Buch, das zu dir passt. Lies dafür den Titel und den Klappentext hinten auf dem Buch."
      en: "Find a book that suits you. Read the title and the blurb on the back to help you."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Im Zirkus übte der kleine Clown Pippo jeden Tag. Er wollte endlich in der großen Show auftreten.\n\nWo spielt die Geschichte?"
            say: "Lies den Text. Wo spielt die Geschichte?"
            options: ["im Zirkus", "in der Schule", "im Wald"]
            answer: "im Zirkus"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Im Zirkus übte der kleine Clown Pippo jeden Tag. Er wollte endlich in der großen Show auftreten.\n\nWer ist die Hauptfigur?"
            say: "Lies den Text. Wer ist die Hauptfigur?"
            options: ["Pippo", "der Zirkus", "die Show"]
            answer: "Pippo"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Das Geheimnis der Leuchtturminsel\nvon Hanna Berg"
            say: "Vorne auf dem Buch stehen der Titel und der Name der Autorin. Der Titel verrät oft schon, worum es geht: um ein Geheimnis auf einer Insel."
          - text: "Klappentext: In den Ferien besucht Ole seinen Onkel auf einer kleinen Insel. Nachts blinkt im alten Leuchtturm ein Licht, obwohl dort niemand wohnt. Ole will wissen, wer dahintersteckt."
            say: "Hinten auf dem Buch steht der Klappentext. Er erzählt kurz, worum es geht, aber nicht das Ende. So merkst du, ob das Buch spannend für dich ist."
          - text: "Sachbuch: erklärt Wissen | Erzählung: erzählt eine Geschichte"
            say: "Frag dich: Was interessiert mich? Willst du etwas wissen, zum Beispiel über Dinosaurier, nimm ein Sachbuch. Willst du eine Geschichte, nimm eine Erzählung."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Emil mag Fußball und lustige Geschichten. Welches Buch passt zu ihm?"
                say: "Emil mag Fußball und lustige Geschichten. Lies die Titel. Welches Buch passt zu ihm?"
                options: ["Lotti und der Fußballdrache", "Alles über Vulkane", "Die stille Nacht im Wald"]
                answer: "Lotti und der Fußballdrache"
                hints:
                  - "Was mag Emil?"
                  - "Welcher Titel hat etwas mit Fußball zu tun?"
                  - "Lotti und der Fußballdrache."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Sina sucht ein Buch für die Ferien. Wie findet sie am besten heraus, ob ihr ein Buch gefällt?"
                say: "Sina sucht ein Buch für die Ferien. Wie findet sie am besten heraus, ob ihr ein Buch gefällt?"
                options: ["Sie liest den Klappentext und die erste Seite.", "Sie nimmt das dickste Buch.", "Sie nimmt das Buch mit der schönsten Farbe."]
                answer: "Sie liest den Klappentext und die erste Seite."
                feedback:
                  "Sie nimmt das dickste Buch.": "Ein dickes Buch ist nicht automatisch spannend. Lies lieber hinein."
                hints:
                  - "Wo steht, worum es im Buch geht?"
                  - "Hinten auf dem Buch steht ein kurzer Text."
                  - "Sie liest den Klappentext und die erste Seite."
              - id: l1-f3
                type: multiple_choice
                text: "Klappentext: Wie groß war der größte Dinosaurier? Was haben Dinosaurier gefressen? In diesem Buch findest du Antworten, viele Fotos und Zeichnungen.\n\nWas für ein Buch ist das?"
                say: "Lies den Klappentext. Was für ein Buch ist das?"
                options: ["ein Sachbuch", "ein Märchen", "ein Gedichtband"]
                answer: "ein Sachbuch"
                hints:
                  - "Erzählt das Buch eine Geschichte oder erklärt es etwas?"
                  - "Es beantwortet Fragen und hat Fotos."
                  - "ein Sachbuch."
              - id: l1-f4
                type: true_false
                text: "Klappentext: Mira darf auf dem Birkenhof reiten lernen. Doch ihr Pony Flocke will einfach nicht stillstehen.\n\nPasst das Buch zu einem Kind, das Pferde liebt?"
                say: "Lies den Klappentext. Passt das Buch zu einem Kind, das Pferde liebt?"
                answer: true
                hints:
                  - "Worum geht es im Buch?"
                  - "Reiten lernen, ein Pony."
                  - "Ja, es passt."
              - id: l1-f5
                type: multiple_choice
                text: "Inhalt\n1 Wie Bienen leben ... 4\n2 Die Königin ... 10\n3 Vom Nektar zum Honig ... 16\n\nAuf welcher Seite beginnt das Kapitel über Honig?"
                say: "Lies das Inhaltsverzeichnis. Auf welcher Seite beginnt das Kapitel über Honig?"
                options: ["16", "10", "4"]
                answer: "16"
                hints:
                  - "Such das Wort Honig."
                  - "Die Zahl daneben ist die Seite."
                  - "Seite 16."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Jana mag Geheimnisse und Detektive. Welches Buch passt zu ihr?"
                say: "Jana mag Geheimnisse und Detektive. Lies die Titel. Welches Buch passt zu ihr?"
                options: ["Die Spur im Schnee: Ein Fall für Kim und Kai", "Kochen mit Kindern", "Mein erstes Pflanzenbuch"]
                answer: "Die Spur im Schnee: Ein Fall für Kim und Kai"
                hints: ["Was macht ein Detektiv?"]
              - id: l1-s2
                type: multiple_choice
                text: "Wo steht meistens der Klappentext?"
                say: "Wo steht meistens der Klappentext?"
                options: ["hinten auf dem Buch", "auf der letzten Seite der Geschichte", "im Inhaltsverzeichnis"]
                answer: "hinten auf dem Buch"
                hints: ["Dreh das Buch um."]
              - id: l1-s3
                type: multiple_choice
                text: "Klappentext: Der kleine Roboter Bolt wacht auf einem Schrottplatz auf. Er weiß nicht, wer er ist. Zusammen mit einer Ratte macht er sich auf die Suche.\n\nWas für ein Buch ist das?"
                say: "Lies den Klappentext. Was für ein Buch ist das?"
                options: ["eine Erzählung", "ein Sachbuch über Roboter", "ein Kochbuch"]
                answer: "eine Erzählung"
                hints: ["Gibt es eine Hauptfigur und ein Abenteuer?"]
              - id: l1-s4
                type: true_false
                text: "Klappentext: In diesem Buch lernst du 30 Tricks mit Karten und Münzen. Schritt für Schritt erklärt.\n\nPasst das Buch zu einem Kind, das gern Zaubertricks vorführt?"
                say: "Lies den Klappentext. Passt das Buch zu einem Kind, das gern Zaubertricks vorführt?"
                answer: true
                hints: ["Worum geht es im Buch?"]
              - id: l1-s5
                type: multiple_choice
                text: "Inhalt\n1 Die Erde ... 3\n2 Der Mond ... 12\n3 Die Sterne ... 20\n\nAuf welcher Seite beginnt das Kapitel über den Mond?"
                say: "Lies das Inhaltsverzeichnis. Auf welcher Seite beginnt das Kapitel über den Mond?"
                options: ["12", "2", "20"]
                answer: "12"
                hints: ["Die erste Zahl ist die Kapitelnummer, die zweite die Seite."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Kemal möchte wissen, wie Flugzeuge fliegen. Welches Buch passt zu ihm?"
                say: "Kemal möchte wissen, wie Flugzeuge fliegen. Lies die Titel. Welches Buch passt zu ihm?"
                options: ["Wie fliegt ein Flugzeug? Technik für Kinder", "Der Drache, der nicht fliegen wollte", "Witze für die ganze Familie"]
                answer: "Wie fliegt ein Flugzeug? Technik für Kinder"
              - id: l1-n2
                type: multiple_choice
                text: "Was steht vorne auf einem Buch?"
                say: "Was steht vorne auf einem Buch?"
                options: ["der Titel und der Name des Autors oder der Autorin", "das Ende der Geschichte", "das Inhaltsverzeichnis"]
                answer: "der Titel und der Name des Autors oder der Autorin"
              - id: l1-n3
                type: multiple_choice
                text: "Klappentext: Was fressen Haie? Wie tief tauchen Wale? Entdecke die Tiere der Ozeane mit vielen Fotos.\n\nWas für ein Buch ist das?"
                say: "Lies den Klappentext. Was für ein Buch ist das?"
                options: ["ein Sachbuch", "ein Märchen", "eine Erzählung über einen Hai namens Hugo"]
                answer: "ein Sachbuch"
              - id: l1-n4
                type: true_false
                text: "Klappentext: Ein Buch voller Gruselgeschichten. Nichts für schwache Nerven!\n\nPasst das Buch gut zu einem Kind, das sich schnell fürchtet und lustige Bücher mag?"
                say: "Lies den Klappentext. Passt das Buch gut zu einem Kind, das sich schnell fürchtet und lustige Bücher mag?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Inhalt\n1 Hunde ... 5\n2 Katzen ... 14\n3 Meerschweinchen ... 22\n\nAuf welcher Seite beginnt das Kapitel über Katzen?"
                say: "Lies das Inhaltsverzeichnis. Auf welcher Seite beginnt das Kapitel über Katzen?"
                options: ["14", "2", "22"]
                answer: "14"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Lea mag Tiere und Abenteuer. Welches Buch passt zu ihr?"
            say: "Lea mag Tiere und Abenteuer. Lies die Titel. Welches Buch passt zu ihr?"
            options: ["Fuchs Flinn rettet den Wald", "Rechnen bis 1000", "Das große Bastelbuch"]
            answer: "Fuchs Flinn rettet den Wald"
          - id: l1-c2
            type: multiple_choice
            text: "Klappentext: Wie wird aus einer Raupe ein Schmetterling? Dieses Buch erklärt es mit Bildern.\n\nWas für ein Buch ist das?"
            say: "Lies den Klappentext. Was für ein Buch ist das?"
            options: ["ein Sachbuch", "ein Märchen", "ein Gedichtband"]
            answer: "ein Sachbuch"
          - id: l1-c3
            type: true_false
            text: "Der Klappentext verrät dir immer, wie die Geschichte ausgeht. Stimmt das?"
            say: "Der Klappentext verrät dir immer, wie die Geschichte ausgeht. Stimmt das?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Inhalt\n1 Vulkane ... 4\n2 Erdbeben ... 11\n3 Wüsten ... 19\n\nAuf welcher Seite beginnt das Kapitel über Erdbeben?"
            say: "Lies das Inhaltsverzeichnis. Auf welcher Seite beginnt das Kapitel über Erdbeben?"
            options: ["11", "2", "19"]
            answer: "11"
          - id: l1-c5
            type: multiple_choice
            text: "Ella möchte lernen, wie man Kekse backt. Welches Buch passt zu ihr?"
            say: "Ella möchte lernen, wie man Kekse backt. Lies die Titel. Welches Buch passt zu ihr?"
            options: ["Die Keksbande auf großer Fahrt", "Backen mit Kindern: Kekse, Kuchen und mehr", "Gute Nacht, kleiner Bär"]
            answer: "Backen mit Kindern: Kekse, Kuchen und mehr"
          - id: l1-c6
            type: true_false
            text: "Klappentext: Max und sein Hund Bello reisen mit einem Zauberkoffer in ein fremdes Land.\n\nPasst das Buch zu einem Kind, das Abenteuergeschichten mag?"
            say: "Lies den Klappentext. Passt das Buch zu einem Kind, das Abenteuergeschichten mag?"
            answer: true

  - n: 2
    title: { de: "Mein Buch vorstellen", en: "Presenting my book" }
    goal:
      de: "Stell ein Buch vor, Schritt für Schritt, und sag am Ende, warum es dir gefällt."
      en: "Present a book step by step, and say at the end why you like it."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was erfährst du im Klappentext?"
            say: "Was erfährst du im Klappentext?"
            options: ["kurz, worum es im Buch geht", "wie das Buch ausgeht", "wie viel das Buch kostet"]
            answer: "kurz, worum es im Buch geht"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Paul will wissen, wie Ritter früher gelebt haben. Was für ein Buch nimmt er?"
            say: "Paul will wissen, wie Ritter früher gelebt haben. Was für ein Buch nimmt er?"
            options: ["ein Sachbuch über Ritter", "ein Witzebuch", "ein Gedichtband"]
            answer: "ein Sachbuch über Ritter"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1. Titel und Autorin | 2. Worum geht es? | 3. Lieblingsstelle | 4. Meine Meinung mit Grund"
            say: "Bei einer Buchvorstellung nennst du zuerst den Titel und wer das Buch geschrieben hat. Dann erzählst du kurz, worum es geht."
          - text: "„Mein Buch heißt ‚Das Geheimnis der Leuchtturminsel‘. Es ist von Hanna Berg. Ole entdeckt ein Licht in einem leeren Leuchtturm.“"
            say: "So kann der Anfang klingen: Mein Buch heißt Das Geheimnis der Leuchtturminsel. Es ist von Hanna Berg. Ole entdeckt ein Licht in einem leeren Leuchtturm. Verrate aber nicht das Ende, sonst wollen die anderen das Buch nicht mehr lesen. Danach liest du deine Lieblingsstelle vor."
          - text: "„Mir gefällt das Buch, weil es spannend ist und ich bis zum Schluss rätseln konnte.“"
            say: "Zum Schluss sagst du deine Meinung und einen Grund mit weil. Nur gut oder toll zu sagen reicht nicht."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Leg die Teile der Buchvorstellung in die richtige Reihenfolge."
                say: "Leg die Teile der Buchvorstellung in die richtige Reihenfolge."
                options: ["meine Meinung mit Grund", "Titel und Autorin", "meine Lieblingsstelle", "worum es geht"]
                slot_count: 4
                answer: ["Titel und Autorin", "worum es geht", "meine Lieblingsstelle", "meine Meinung mit Grund"]
                hints:
                  - "Was müssen die Zuhörer zuerst wissen?"
                  - "Erst das Buch nennen, dann den Inhalt."
                  - "Titel, Inhalt, Lieblingsstelle, Meinung."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was sagst du bei einer Buchvorstellung besser nicht?"
                say: "Was sagst du bei einer Buchvorstellung besser nicht?"
                options: ["wie die Geschichte am Ende ausgeht", "wie das Buch heißt", "worum es am Anfang geht"]
                answer: "wie die Geschichte am Ende ausgeht"
                hints:
                  - "Die anderen sollen das Buch auch lesen wollen."
                  - "Was nimmt die Spannung weg?"
                  - "Das Ende verrätst du nicht."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Satz sagt deine Meinung mit einem Grund?"
                say: "Welcher Satz sagt deine Meinung mit einem Grund?"
                options: ["Mir gefällt das Buch, weil die Hauptfigur so witzig ist.", "Das Buch ist toll.", "Das Buch hat 120 Seiten."]
                answer: "Mir gefällt das Buch, weil die Hauptfigur so witzig ist."
                option_audio: false
                feedback:
                  "Das Buch ist toll.": "Das ist eine Meinung, aber ohne Grund. Warum ist es toll?"
                hints:
                  - "Ein Grund beginnt oft mit weil."
                  - "Welcher Satz sagt, warum?"
                  - "Mir gefällt das Buch, weil die Hauptfigur so witzig ist."
              - id: l2-f4
                type: true_false
                text: "„Mein Buch heißt ‚Fuchs Flinn rettet den Wald‘. Es ist von Tom Weber.“ Ist das ein guter Anfang für eine Buchvorstellung?"
                say: "Lies den Satz. Ist das ein guter Anfang für eine Buchvorstellung?"
                answer: true
                hints:
                  - "Was nennst du ganz am Anfang?"
                  - "Titel und Autor stehen da."
                  - "Ja, das ist ein guter Anfang."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Satz erzählt kurz, worum es geht, ohne das Ende zu verraten?"
                say: "Welcher Satz erzählt kurz, worum es geht, ohne das Ende zu verraten?"
                options: ["Bolt ist ein Roboter, der herausfinden will, wer ihn gebaut hat.", "Am Ende findet Bolt heraus, dass ihn ein Mädchen gebaut hat.", "Das Buch ist blau und hat einen Roboter vorne drauf."]
                answer: "Bolt ist ein Roboter, der herausfinden will, wer ihn gebaut hat."
                option_audio: false
                hints:
                  - "Welcher Satz verrät das Ende?"
                  - "Welcher Satz sagt nur, wie das Buch aussieht?"
                  - "Bolt ist ein Roboter, der herausfinden will, wer ihn gebaut hat."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Leg die Sätze der Buchvorstellung in die richtige Reihenfolge."
                say: "Leg die Sätze der Buchvorstellung in die richtige Reihenfolge."
                options: ["Mir gefällt es, weil ich viel über Pferde gelernt habe.", "Mein Buch heißt „Mira und die Pferde vom Birkenhof“.", "Mira lernt reiten, aber ihr Pony ist sehr wild."]
                slot_count: 3
                answer: ["Mein Buch heißt „Mira und die Pferde vom Birkenhof“.", "Mira lernt reiten, aber ihr Pony ist sehr wild.", "Mir gefällt es, weil ich viel über Pferde gelernt habe."]
                option_audio: false
                hints: ["Titel, dann Inhalt, dann Meinung."]
              - id: l2-s2
                type: multiple_choice
                text: "Du liest deine Lieblingsstelle vor. Welche Stelle nimmst du?"
                say: "Du liest deine Lieblingsstelle vor. Welche Stelle nimmst du?"
                options: ["eine kurze, spannende Stelle aus der Mitte", "die letzte Seite mit dem Ende", "das ganze erste Kapitel"]
                answer: "eine kurze, spannende Stelle aus der Mitte"
                hints: ["Kurz soll sie sein, und das Ende bleibt geheim."]
              - id: l2-s3
                type: multiple_choice
                text: "Welcher Satz sagt deine Meinung mit einem Grund?"
                say: "Welcher Satz sagt deine Meinung mit einem Grund?"
                options: ["Ich finde das Buch spannend, weil man bis zum Schluss rätselt.", "Das Buch ist gut.", "Ich habe das Buch von Oma."]
                answer: "Ich finde das Buch spannend, weil man bis zum Schluss rätselt."
                option_audio: false
                hints: ["Welcher Satz sagt, warum?"]
              - id: l2-s4
                type: true_false
                text: "„Ich empfehle das Buch allen, die gern lachen, denn es ist voller Witze.“ Ist das eine Meinung mit Grund?"
                say: "Lies den Satz. Ist das eine Meinung mit Grund?"
                answer: true
                hints: ["Auch denn kann einen Grund einleiten."]
              - id: l2-s5
                type: multiple_choice
                text: "Für wen empfiehlst du ein Buch über Weltraum und Planeten?"
                say: "Für wen empfiehlst du ein Buch über Weltraum und Planeten?"
                options: ["für Kinder, die sich für Sterne interessieren", "für Kinder, die nur Pferde mögen", "für niemanden"]
                answer: "für Kinder, die sich für Sterne interessieren"
                hints: ["Wer hat Spaß an dem Thema?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Leg die Teile der Buchvorstellung in die richtige Reihenfolge."
                say: "Leg die Teile der Buchvorstellung in die richtige Reihenfolge."
                options: ["worum es geht", "meine Meinung mit Grund", "Titel und Autor"]
                slot_count: 3
                answer: ["Titel und Autor", "worum es geht", "meine Meinung mit Grund"]
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Satz verrät zu viel?"
                say: "Welcher Satz verrät bei einer Buchvorstellung zu viel?"
                options: ["Am Schluss stellt sich heraus, dass der Nachbar der Dieb war.", "Kim und Kai suchen einen Dieb.", "Das Buch spielt im Winter."]
                answer: "Am Schluss stellt sich heraus, dass der Nachbar der Dieb war."
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Welcher Satz sagt deine Meinung mit einem Grund?"
                say: "Welcher Satz sagt deine Meinung mit einem Grund?"
                options: ["Mir gefällt das Buch, weil die Bilder so lustig sind.", "Mir gefällt das Buch.", "Das Buch gibt es in der Bücherei."]
                answer: "Mir gefällt das Buch, weil die Bilder so lustig sind."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "„Das Buch ist super. Ende.“ Reicht das als Meinung für eine Buchvorstellung?"
                say: "Lies den Satz. Reicht das als Meinung für eine Buchvorstellung?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Was nennst du ganz am Anfang einer Buchvorstellung?"
                say: "Was nennst du ganz am Anfang einer Buchvorstellung?"
                options: ["den Titel und wer das Buch geschrieben hat", "deine Lieblingsstelle", "wie das Buch ausgeht"]
                answer: "den Titel und wer das Buch geschrieben hat"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: choose
