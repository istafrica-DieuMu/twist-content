# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.punctuation-reading
skill: lit-de.fluency.punctuation-reading
curriculum: de-DE
language: de
title:
  de: Satzzeichen beim Lesen beachten
  en: Reading with punctuation
summary: >
  Reading a sentence as a whole. Lesson 1 notices Punkt, Komma, Fragezeichen
  and Ausrufezeichen and what the voice does at each one; lesson 2 reads on
  past the end of a line, finds where a sentence really ends, reads short
  sentences aloud for practice, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Flüssig lesen, en: Reading fluently }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.fluency.word-groups, lit-de.sentences.end-punctuation]
  also_practises: [lit-de.sentences.end-punctuation]
  vocabulary: { de: [Punkt, Komma, Fragezeichen, Ausrufezeichen, Pause, Zeile, Satzende] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: line-end, what: { de: über das Zeilenende hinweg lesen, en: reading on past the end of a line } }
    - { id: marks, what: { de: "Punkt, Komma, Frage- und Ausrufezeichen beim Lesen beachten", en: "noticing full stops, commas, question and exclamation marks when reading" } }
    - { id: whole-sentence, what: { de: "einen Satz als Ganzes lesen und erkennen, wo er endet", en: "reading a sentence as a whole and seeing where it ends" } }
  misconceptions:
    - id: line-end-stop
      what: Stops at the end of every line as if the sentence ended there
      addressed: "lesson 2 Learn reads on past the line end; l2-f1, l2-f3, l2-s1, l2-n1 and l2-c1 ask where the first sentence ends, with the last word of the line as the key distractor (feedback on l2-f1)"
    - id: ignores-marks
      what: Reads over commas and question marks in the same flat voice
      addressed: "lesson 1 asks what the voice does at each mark (l1-f1, l1-f2, l1-s2, l1-n2); l1-f4 shows how a comma changes the meaning"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was die Zeichen sagen", en: "What the marks tell you" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welches Zeichen fehlt?"
            say: "Lies den Satz. Welches Zeichen gehört ans Ende?"
            frame: "Wie heißt dein Hund_"
            options: [".", "?", "!"]
            answer: ["?"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Lies schnell. Was stand da?"
            say: "Die Wortgruppe ist gleich wieder weg. Lies sie mit einem Blick. Was stand da?"
            show: { drawn: letter-card, text: "auf dem Spielplatz", flash: 2 }
            options: ["auf dem Spielplatz", "auf den Spielplatz", "an dem Spielplatz"]
            answer: "auf dem Spielplatz"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ich gehe nach Hause."
            say: "Am Punkt ist der Satz zu Ende. Deine Stimme geht nach unten, und du machst eine kleine Pause. Ich gehe nach Hause."
          - text: "Kommst du mit?"
            say: "Am Fragezeichen geht deine Stimme am Ende nach oben. Kommst du mit? Beim Ausrufezeichen sprichst du kräftig: Pass auf!"
          - text: "Nach dem Essen, Tim, gehen wir raus."
            say: "Am Komma machst du eine ganz kurze Pause, aber der Satz geht weiter. Nach dem Essen, Tim, gehen wir raus. Schau beim Lesen schon ein Stück voraus, dann siehst du die Zeichen rechtzeitig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "„Hast du meine Mütze gesehen?“ Was macht deine Stimme am Ende?"
                say: "Lies den Satz leise. Was macht deine Stimme am Ende?"
                options: ["Sie geht nach oben.", "Sie geht nach unten.", "Sie wird ganz leise."]
                answer: "Sie geht nach oben."
                feedback:
                  "Sie geht nach unten.": "Schau auf das Zeichen am Ende. Es ist kein Punkt."
                hints:
                  - "Welches Zeichen steht am Ende?"
                  - "Es ist ein Fragezeichen. Bei einer Frage klingt die Stimme anders."
                  - "Bei einer Frage geht die Stimme nach oben."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "„Halt, das Glas fällt gleich runter!“ Wie liest du den Satz?"
                say: "Lies den Satz leise. Wie liest du ihn?"
                options: ["laut und schnell, wie ein Warnruf", "leise und langsam, wie ein Geheimnis", "mit der Stimme am Ende nach oben"]
                answer: "laut und schnell, wie ein Warnruf"
                hints:
                  - "Welches Zeichen steht am Ende?"
                  - "Ein Ausrufezeichen. Jemand warnt vor etwas."
                  - "Laut und schnell, wie ein Warnruf."
              - id: l1-f3
                type: highlight_in_text
                text: "Nach welchen Wörtern machst du eine kleine Pause? Tippe sie an."
                say: "Lies den Satz. Nach welchen Wörtern machst du eine kleine Pause, weil dort ein Komma steht?"
                show: { drawn: letter-card, text: "Im Korb liegen Äpfel, Birnen, Pflaumen und Nüsse." }
                spans: ["Äpfel,", "Birnen,"]
                hints:
                  - "Such die Kommas."
                  - "Vor und gibt es kein Komma."
                  - "Nach Äpfel und nach Birnen."
              - id: l1-f4
                type: multiple_choice
                text: "„Wir essen, Opa!“ Was bedeutet der Satz?"
                say: "Lies den Satz genau. Achte auf das Komma. Was bedeutet er?"
                options: ["Jemand ruft Opa zum Essen.", "Jemand will Opa aufessen.", "Opa isst allein."]
                answer: "Jemand ruft Opa zum Essen."
                feedback:
                  "Jemand will Opa aufessen.": "Das wäre der Satz ohne Komma. Hier steht ein Komma vor Opa."
                hints:
                  - "Das Komma trennt Opa vom Rest des Satzes."
                  - "Nach dem Komma steht der Name, den man ruft."
                  - "Jemand ruft Opa zum Essen."
              - id: l1-f5
                type: true_false
                text: "„Morgen fahren wir ans Meer.“ Geht die Stimme am Ende nach oben?"
                say: "Lies den Satz leise. Geht deine Stimme am Ende nach oben?"
                answer: false
                hints:
                  - "Welches Zeichen steht am Ende?"
                  - "Ein Punkt. Der Satz erzählt etwas."
                  - "Nein, am Punkt geht die Stimme nach unten."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Nach welchem Wort machst du eine kleine Pause? Tippe es an."
                say: "Lies den Satz. Nach welchem Wort machst du eine kleine Pause, weil dort ein Komma steht?"
                show: { drawn: letter-card, text: "Als es dunkel wurde, gingen wir nach Hause." }
                spans: ["wurde,"]
                hints: ["Such das Komma."]
              - id: l1-s2
                type: multiple_choice
                text: "„Wo wohnst du?“ Was macht deine Stimme am Ende?"
                say: "Lies den Satz leise. Was macht deine Stimme am Ende?"
                options: ["Sie geht nach oben.", "Sie geht nach unten.", "Sie bleibt gleich."]
                answer: "Sie geht nach oben."
                hints: ["Welches Zeichen steht am Ende?"]
              - id: l1-s3
                type: multiple_choice
                text: "„Lauf schnell weg!“ Wie liest du den Satz?"
                say: "Lies den Satz leise. Wie liest du ihn?"
                options: ["kräftig und aufgeregt", "leise und müde", "fragend"]
                answer: "kräftig und aufgeregt"
                hints: ["Am Ende steht ein Ausrufezeichen."]
              - id: l1-s4
                type: multiple_choice
                text: "Welches Zeichen sagt dir: kurze Pause, der Satz geht weiter?"
                say: "Welches Zeichen sagt dir: Mach eine kurze Pause, aber der Satz geht weiter?"
                options: ["das Komma", "der Punkt", "das Fragezeichen"]
                answer: "das Komma"
                hints: ["Nach einem Punkt ist der Satz zu Ende."]
              - id: l1-s5
                type: true_false
                text: "„Leo, komm bitte her.“ Machst du nach Leo eine kleine Pause?"
                say: "Lies den Satz leise. Machst du nach Leo eine kleine Pause?"
                answer: true
                hints: ["Schau, was nach Leo steht."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Nach welchen Wörtern machst du eine kleine Pause? Tippe sie an."
                say: "Lies den Satz. Nach welchen Wörtern machst du eine kleine Pause, weil dort ein Komma steht?"
                show: { drawn: letter-card, text: "Ich packe Badehose, Handtuch, Sonnencreme und ein Buch ein." }
                spans: ["Badehose,", "Handtuch,"]
              - id: l1-n2
                type: multiple_choice
                text: "„Darf ich heute länger aufbleiben?“ Was macht deine Stimme am Ende?"
                say: "Lies den Satz leise. Was macht deine Stimme am Ende?"
                options: ["Sie geht nach oben.", "Sie geht nach unten.", "Sie wird ganz laut."]
                answer: "Sie geht nach oben."
              - id: l1-n3
                type: true_false
                text: "„Der Regen hört nicht auf.“ Ist der Satz an dieser Stelle zu Ende?"
                say: "Lies den Satz leise. Ist der Satz an dieser Stelle zu Ende?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "„Komm, wir spielen, Lisa!“ Mit wem spricht jemand?"
                say: "Lies den Satz genau. Achte auf die Kommas. Mit wem spricht jemand?"
                options: ["mit Lisa", "mit niemandem", "mit dem Spiel"]
                answer: "mit Lisa"
              - id: l1-n5
                type: multiple_choice
                text: "„Vorsicht, der Hund beißt!“ Wie liest du den Satz?"
                say: "Lies den Satz leise. Wie liest du ihn?"
                options: ["laut, wie eine Warnung", "leise, wie ein Gute-Nacht-Gruß", "fragend, mit der Stimme nach oben"]
                answer: "laut, wie eine Warnung"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "„Kannst du mir helfen?“ Was macht deine Stimme am Ende?"
            say: "Lies den Satz leise. Was macht deine Stimme am Ende?"
            options: ["Sie geht nach oben.", "Sie geht nach unten.", "Sie bleibt gleich."]
            answer: "Sie geht nach oben."
          - id: l1-c2
            type: highlight_in_text
            text: "Nach welchem Wort machst du eine kleine Pause? Tippe es an."
            say: "Lies den Satz. Nach welchem Wort machst du eine kleine Pause, weil dort ein Komma steht?"
            show: { drawn: letter-card, text: "Wenn die Sonne scheint, gehen wir baden." }
            spans: ["scheint,"]
          - id: l1-c3
            type: multiple_choice
            text: "Welches Zeichen sagt dir: Der Satz ist zu Ende, die Stimme geht nach unten?"
            say: "Welches Zeichen sagt dir: Der Satz ist zu Ende, und die Stimme geht nach unten?"
            options: ["der Punkt", "das Komma", "das Fragezeichen"]
            answer: "der Punkt"
          - id: l1-c4
            type: true_false
            text: "„Heute ist Montag.“ Geht deine Stimme am Ende nach unten?"
            say: "Lies den Satz leise. Geht deine Stimme am Ende nach unten?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "„Lisa, kommst du mit?“ Wo machst du eine kurze Pause?"
            say: "Lies den Satz leise. Wo machst du eine kurze Pause?"
            options: ["nach Lisa", "nach kommst", "nach du"]
            answer: "nach Lisa"
          - id: l1-c6
            type: highlight_in_text
            text: "Nach welchen Wörtern machst du eine kleine Pause? Tippe sie an."
            say: "Lies den Satz. Nach welchen Wörtern machst du eine kleine Pause, weil dort ein Komma steht?"
            show: { drawn: letter-card, text: "Mein Bruder mag Hunde, Katzen, Pferde und Hasen." }
            spans: ["Hunde,", "Katzen,"]

  - n: 2
    title: { de: "Über das Zeilenende lesen", en: "Reading past the line end" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "„Wann fängt der Film an?“ Was macht deine Stimme am Ende?"
            say: "Lies den Satz leise. Was macht deine Stimme am Ende?"
            options: ["Sie geht nach oben.", "Sie geht nach unten.", "Sie bleibt gleich."]
            answer: "Sie geht nach oben."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "„Mama, wo ist mein Schuh?“ Machst du nach Mama eine kleine Pause?"
            say: "Lies den Satz leise. Machst du nach Mama eine kleine Pause?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Am Samstag gehen Ella und ihr\nkleiner Bruder in den Zoo. Dort\nsehen sie zuerst die Affen."
            say: "Hier endet die erste Zeile mitten im Satz. Halte am Zeilenende nicht an. Lies weiter: Am Samstag gehen Ella und ihr kleiner Bruder in den Zoo."
          - text: "Am Samstag gehen Ella und ihr\nkleiner Bruder in den Zoo. Dort\nsehen sie zuerst die Affen."
            say: "Der Satz endet erst am Punkt nach Zoo. Dann kommt eine kleine Pause. Der nächste Satz beginnt mit Dort und geht wieder über die Zeile."
          - text: "Zeilenende: weiterlesen | Punkt: Pause"
            say: "Merke dir: Das Zeilenende ist kein Satzende. Nur Punkt, Fragezeichen und Ausrufezeichen beenden einen Satz."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Nach dem Frühstück holt Paul sein\nFahrrad aus dem Keller. Er pumpt\ndie Reifen auf.\n\nMit welchem Wort endet der erste Satz?"
                say: "Lies den Text. Mit welchem Wort endet der erste Satz?"
                options: ["Keller", "sein", "auf"]
                answer: "Keller"
                feedback:
                  "sein": "Bei sein endet nur die Zeile. Lies weiter bis zum Punkt."
                hints:
                  - "Such den ersten Punkt."
                  - "Lies über das Zeilenende: sein Fahrrad aus dem ..."
                  - "Der erste Satz endet mit Keller."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Die Katze sitzt am Fenster. Draußen fliegt\nein Vogel vorbei. Die Katze miaut.\n\nWie viele Sätze hat der Text?"
                say: "Lies den Text. Wie viele Sätze hat er?"
                options: ["3", "4", "2"]
                answer: "3"
                hints:
                  - "Zähle nicht die Zeilen, sondern die Punkte."
                  - "Der Text hat zwei Zeilen, aber wie viele Punkte?"
                  - "Drei Sätze."
              - id: l2-f3
                type: true_false
                text: "Im Herbst sammeln wir bunte\nBlätter im Park.\n\nEndet der Satz nach bunte?"
                say: "Lies den Text. Endet der Satz nach dem Wort bunte?"
                answer: false
                hints:
                  - "Steht nach bunte ein Punkt?"
                  - "Bunte was? Der Satz geht in der nächsten Zeile weiter."
                  - "Nein, der Satz endet erst nach Park."
              - id: l2-f4
                type: speak
                text: "Wo ist mein Turnbeutel? Ich finde ihn nicht!"
                say: "Lies die zwei Sätze laut. Achte auf das Fragezeichen und das Ausrufezeichen. Dann hörst du dich und das Vorbild."
                expected_text: "Wo ist mein Turnbeutel? Ich finde ihn nicht!"
                hints:
                  - "Beim Fragezeichen geht die Stimme nach oben."
                  - "Beim Ausrufezeichen klingst du ein bisschen aufgeregt."
                  - "Hör das Vorbild an und lies noch einmal mit."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Zeile liest du ohne Pause am Ende weiter?\n\n1: Oma backt heute einen\n2: Kuchen mit Kirschen.\n3: Wir dürfen helfen."
                say: "Lies den Text. Am Ende welcher Zeile liest du ohne Pause weiter?"
                options: ["Zeile 1", "Zeile 2", "Zeile 3"]
                answer: "Zeile 1"
                hints:
                  - "Wo steht am Zeilenende kein Punkt?"
                  - "Oma backt heute einen ... was?"
                  - "Zeile 1. Dort geht der Satz weiter."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Jeden Morgen fährt Herr Klein mit\ndem Bus zur Arbeit. Heute ist der\nBus zu spät.\n\nMit welchem Wort endet der erste Satz?"
                say: "Lies den Text. Mit welchem Wort endet der erste Satz?"
                options: ["Arbeit", "mit", "spät"]
                answer: "Arbeit"
                hints: ["Such den ersten Punkt, nicht das erste Zeilenende."]
              - id: l2-s2
                type: multiple_choice
                text: "Es regnet. Lea zieht\nihre Gummistiefel an und\nspringt in jede Pfütze.\nDas macht Spaß!\n\nWie viele Sätze hat der Text?"
                say: "Lies den Text. Wie viele Sätze hat er?"
                options: ["3", "4", "2"]
                answer: "3"
                hints: ["Zähle die Punkte und das Ausrufezeichen."]
              - id: l2-s3
                type: speak
                text: "Leise schlich der Fuchs zum Hühnerstall, doch die Hühner waren schon wach."
                say: "Lies den Satz laut, ohne beim Komma anzuhalten. Mach dort nur eine ganz kurze Pause. Dann hörst du dich und das Vorbild."
                expected_text: "Leise schlich der Fuchs zum Hühnerstall, doch die Hühner waren schon wach."
                hints: ["Lies den Satz zuerst leise und schau voraus bis zum Punkt."]
              - id: l2-s4
                type: true_false
                text: "Max hat Geburtstag. Er lädt\nseine Freunde ein.\n\nEndet ein Satz nach lädt?"
                say: "Lies den Text. Endet ein Satz nach dem Wort lädt?"
                answer: false
                hints: ["Er lädt ... wen? Lies weiter."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Zeile liest du ohne Pause am Ende weiter?\n\n1: Der Hund bellt.\n2: Dann rennt er in den\n3: Garten hinaus."
                say: "Lies den Text. Am Ende welcher Zeile liest du ohne Pause weiter?"
                options: ["Zeile 2", "Zeile 1", "Zeile 3"]
                answer: "Zeile 2"
                hints: ["Wo steht am Zeilenende kein Satzzeichen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Im Sommer zelten wir mit unseren\nNachbarn am See. Abends grillen\nwir Würstchen.\n\nMit welchem Wort endet der erste Satz?"
                say: "Lies den Text. Mit welchem Wort endet der erste Satz?"
                options: ["See", "unseren", "Würstchen"]
                answer: "See"
              - id: l2-n2
                type: multiple_choice
                text: "Wer hat die Kekse\ngegessen? Tom schaut\nweg. Seine Hände sind\nvoller Krümel.\n\nWie viele Sätze hat der Text?"
                say: "Lies den Text. Wie viele Sätze hat er?"
                options: ["3", "2", "4"]
                answer: "3"
              - id: l2-n3
                type: speak
                text: "Hilfe, mein Drachen fliegt weg! Kann ihn jemand fangen?"
                say: "Lies die zwei Sätze laut, mit Ausrufezeichen und Fragezeichen. Dann hörst du dich und das Vorbild."
                expected_text: "Hilfe, mein Drachen fliegt weg! Kann ihn jemand fangen?"
              - id: l2-n4
                type: true_false
                text: "Unsere Lehrerin liest uns jeden\nFreitag eine Geschichte vor.\n\nIst der Satz nach jeden zu Ende?"
                say: "Lies den Text. Ist der Satz nach dem Wort jeden zu Ende?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Welche Zeile liest du ohne Pause am Ende weiter?\n\n1: Wir gehen ins Kino.\n2: Der Film ist lustig.\n3: Danach essen wir ein großes"
                say: "Lies den Text. Am Ende welcher Zeile liest du ohne Pause weiter?"
                options: ["Zeile 3", "Zeile 1", "Zeile 2"]
                answer: "Zeile 3"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: line-end
            type: multiple_choice
            text: "Am Nachmittag spielen die Kinder\nim Garten Verstecken. Anna zählt\nbis zwanzig.\n\nMit welchem Wort endet der erste Satz?"
            say: "Lies den Text. Mit welchem Wort endet der erste Satz?"
            options: ["Verstecken", "Kinder", "zwanzig"]
            answer: "Verstecken"
          - id: l2-c2
            part: whole-sentence
            type: multiple_choice
            text: "Der Zug hält. Viele Leute steigen\naus. Ist Oma auch dabei? Ja, da\nwinkt sie!\n\nWie viele Sätze hat der Text?"
            say: "Lies den Text. Wie viele Sätze hat er?"
            options: ["4", "3", "5"]
            answer: "4"
          - id: l2-c3
            part: marks
            type: multiple_choice
            text: "„Bist du schon fertig?“ Wie liest du den Satz?"
            say: "Lies den Satz leise. Wie liest du ihn?"
            options: ["fragend, die Stimme geht am Ende nach oben", "erzählend, die Stimme geht am Ende nach unten", "laut und schnell, wie ein Warnruf"]
            answer: "fragend, die Stimme geht am Ende nach oben"
          - id: l2-c4
            part: marks
            type: highlight_in_text
            text: "Nach welchen Wörtern machst du eine kleine Pause? Tippe sie an."
            say: "Lies den Satz. Nach welchen Wörtern machst du eine kleine Pause, weil dort ein Komma steht?"
            show: { drawn: letter-card, text: "Am Montag, Dienstag und Mittwoch haben wir Sport, Musik oder Kunst." }
            spans: ["Montag,", "Sport,"]
          - id: l2-c5
            part: line-end
            type: true_false
            text: "Mein Onkel wohnt in einem\nalten Haus am Waldrand.\n\nEndet der Satz nach einem?"
            say: "Lies den Text. Endet der Satz nach dem Wort einem?"
            answer: false
          - id: l2-c6
            part: line-end
            type: multiple_choice
            text: "Heute Abend kommt meine Tante\naus Berlin zu Besuch. Wir holen\nsie vom Bahnhof ab.\n\nMit welchem Wort endet der erste Satz?"
            say: "Lies den Text. Mit welchem Wort endet der erste Satz?"
            options: ["Besuch", "Tante", "ab"]
            answer: "Besuch"
          - id: l2-c7
            part: marks
            type: highlight_in_text
            text: "Nach welchen Wörtern machst du eine kleine Pause? Tippe sie an."
            say: "Lies den Satz. Nach welchen Wörtern machst du eine kleine Pause, weil dort ein Komma steht?"
            show: { drawn: letter-card, text: "Als der Wecker klingelte, sprang Jan aus dem Bett, zog sich an und lief los." }
            spans: ["klingelte,", "Bett,"]
          - id: l2-c8
            part: whole-sentence
            type: multiple_choice
            text: "Unser Hund Bruno schläft am\nliebsten auf dem Sofa, aber\nMama mag das gar nicht.\n\nWie viele Sätze hat der Text?"
            say: "Lies den Text. Wie viele Sätze hat er?"
            options: ["1", "3", "2"]
            answer: "1"
          - id: l2-c9
            part: line-end
