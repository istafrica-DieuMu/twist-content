                hints:
                  - "Alle fangen mit Br an. Schau auf den dritten Buchstaben."
                  - "Die dritten Buchstaben sind i, i und o. Bei Brief und Brille musst du noch weiter schauen: e und l."
                  - "Brief, Brille, Brot."
              - id: l2-f4
                type: true_false
