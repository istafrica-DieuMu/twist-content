            say: "Bei Stern, Stift und Stuhl sind die ersten zwei Buchstaben gleich. Der dritte entscheidet: e, i, u."
          - text: "Ball, Ballon"
            say: "Ist ein Wort der Anfang eines längeren Wortes, kommt das kürzere zuerst: Ball vor Ballon."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Ordne nach dem ABC."
                say: "Ordne die Wörter nach dem ABC."
