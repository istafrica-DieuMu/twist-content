              - id: l2-s3
                type: ordering
                text: "Ordne nach dem ABC."
                say: "Ordne die Wörter nach dem ABC."
                options: ["Blume", "Blatt", "Blitz"]
                slot_count: 3
                answer: ["Blatt", "Blitz", "Blume"]
