# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.alphabet-order
skill: lit-de.letters.alphabet-order
curriculum: de-DE
language: de
title:
  de: Nach dem ABC ordnen
  en: Alphabetical order
summary: >
  Ordering words alphabetically, the step before using a Wörterbuch.
  Lesson 1 orders by the first and the second letter (Hase, Hose, Hund);
  lesson 2 orders by the third letter (Maler, Mantel, Maske) and puts a
  shorter word before a longer one that starts the same (Ball, Ballon),
  and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Das ABC, en: The alphabet }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.letters.alphabet]
  also_practises: [lit-de.letters.alphabet]
  vocabulary: { de: [ABC, Alphabet, Reihenfolge, Buchstabe] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: second, what: { de: nach dem ersten und zweiten Buchstaben ordnen, en: ordering by the first and second letter } }
    - { id: third, what: { de: nach dem dritten Buchstaben und weiter ordnen, en: ordering by the third letter and beyond } }
    - { id: shorter, what: { de: "das kürzere Wort vor das längere mit gleichem Anfang stellen (Ball, Ballon)", en: "putting the shorter word before a longer one that starts the same (Ball, Ballon)" } }
  misconceptions:
    - id: first-letter-only
      what: Stops at the first letter when words start the same
      addressed: lesson 1 Learn goes on to the second letter (Ha, Ho, Hu); every stage of lesson 1 has a set that starts with the same letter, and l1-f4 and l1-n4 show sets in the wrong order
    - id: longer-first
      what: Puts the longer word first when one word begins the other (Ballon before Ball)
      addressed: lesson 2 Learn shows Ball before Ballon; l2-f5, l2-n3, l2-n5 and the skill check task l2-c4 need the rule
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Erster und zweiter Buchstabe", en: "First and second letter" }
    goal:
      de: "Ordne Wörter nach dem ABC. Fangen sie gleich an, schau auf den zweiten Buchstaben, so wie bei Hase, Hose, Hund."
      en: "Put words in ABC order. If they start the same, look at the second letter, like Hase, Hose, Hund."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Bring die Buchstaben in die ABC-Reihenfolge."
            say: "Bring die Buchstaben in die Reihenfolge des ABC."
            options: ["D", "B", "C"]
            slot_count: 3
            answer: ["B", "C", "D"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Buchstabe kommt im ABC nach M?"
            say: "Welcher Buchstabe kommt im ABC nach M?"
            options: ["N", "L", "O"]
            answer: "N"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Apfel, Birne, Kirsche"
            say: "Im ABC ordnest du Wörter nach dem ersten Buchstaben. A wie Apfel kommt vor B wie Birne, B kommt vor K wie Kirsche."
          - text: "Hase, Hose, Hund"
            say: "Fangen Wörter mit dem gleichen Buchstaben an, schaust du auf den zweiten: Ha, Ho, Hu. A kommt vor o, und o kommt vor u."
          - text: "a b c d e f g h i j k l m n o p q r s t u v w x y z"
            say: "Sing oder sprich das ABC, wenn du unsicher bist, welcher Buchstabe zuerst kommt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Ordne nach dem ABC."
                say: "Ordne die Wörter nach dem ABC."
                options: ["Kuh", "Affe", "Esel"]
                slot_count: 3
                answer: ["Affe", "Esel", "Kuh"]
                hints:
                  - "Schau auf den ersten Buchstaben."
                  - "A, E und K: Welcher kommt im ABC zuerst?"
                  - "Affe, Esel, Kuh."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort kommt im ABC zuerst?"
                say: "Tisch, Tasse, Tor. Welches Wort kommt im ABC zuerst?"
                options: ["Tisch", "Tasse", "Tor"]
                answer: "Tasse"
                hints:
                  - "Alle fangen mit T an. Schau auf den zweiten Buchstaben."
                  - "Die zweiten Buchstaben sind i, a und o. Welcher kommt zuerst?"
                  - "Tasse."
              - id: l1-f3
                type: ordering
                text: "Ordne nach dem ABC."
                say: "Ordne die Wörter nach dem ABC."
                options: ["Sonne", "Sand", "Seil"]
                slot_count: 3
                answer: ["Sand", "Seil", "Sonne"]
                hints:
                  - "Alle fangen mit S an. Schau auf den zweiten Buchstaben."
                  - "Die zweiten Buchstaben sind a, e und o."
                  - "Sand, Seil, Sonne."
              - id: l1-f4
                type: true_false
                text: "Stimmt die Reihenfolge?"
                say: "Lies die Wörter. Stehen sie in der Reihenfolge des ABC?"
                show: { drawn: letter-card, text: "Brot Ball Buch" }
                answer: false
                hints:
                  - "Alle fangen mit B an. Schau auf den zweiten Buchstaben."
                  - "Die zweiten Buchstaben sind r, a und u. Kommt das r wirklich zuerst?"
                  - "Nein. Richtig ist Ball, Brot, Buch."
              - id: l1-f5
                type: multiple_choice
                text: "Welches Wort kommt im ABC zuletzt?"
                say: "Rabe, Rose, Rind. Welches Wort kommt im ABC zuletzt?"
                options: ["Rabe", "Rose", "Rind"]
                answer: "Rose"
                hints:
                  - "Schau auf den zweiten Buchstaben."
                  - "Die zweiten Buchstaben sind a, o und i. Welcher kommt im ABC zuletzt?"
                  - "Rose."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Ordne nach dem ABC."
                say: "Ordne die Wörter nach dem ABC."
                options: ["Wolf", "Igel", "Dachs"]
                slot_count: 3
                answer: ["Dachs", "Igel", "Wolf"]
                hints: ["Schau auf den ersten Buchstaben."]
              - id: l1-s2
                type: multiple_choice
                text: "Welches Wort kommt im ABC zuerst?"
                say: "Mond, Maus, Milch. Welches Wort kommt im ABC zuerst?"
                options: ["Mond", "Maus", "Milch"]
                answer: "Maus"
                hints: ["Schau auf den zweiten Buchstaben."]
              - id: l1-s3
                type: ordering
                text: "Ordne nach dem ABC."
                say: "Ordne die Wörter nach dem ABC."
                options: ["Pilz", "Pause", "Post"]
                slot_count: 3
                answer: ["Pause", "Pilz", "Post"]
                hints: ["Alle fangen mit P an."]
              - id: l1-s4
                type: true_false
                text: "Stimmt die Reihenfolge?"
                say: "Lies die Wörter. Stehen sie in der Reihenfolge des ABC?"
                show: { drawn: letter-card, text: "Lampe Licht Luft" }
                answer: true
                hints: ["Schau auf den zweiten Buchstaben."]
              - id: l1-s5
                type: multiple_choice
                text: "Welches Wort kommt im ABC zuletzt?"
                say: "Glas, Gurke, Gold. Welches Wort kommt im ABC zuletzt?"
                options: ["Glas", "Gurke", "Gold"]
                answer: "Gurke"
                hints: ["Schau auf den zweiten Buchstaben."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Ordne nach dem ABC."
                say: "Ordne die Wörter nach dem ABC."
                options: ["Zelt", "Nase", "Gabel", "Tafel"]
                slot_count: 4
                answer: ["Gabel", "Nase", "Tafel", "Zelt"]
              - id: l1-n2
                type: multiple_choice
                text: "Welches Wort kommt im ABC zuerst?"
                say: "Fuchs, Fisch, Feder. Welches Wort kommt im ABC zuerst?"
                options: ["Fuchs", "Fisch", "Feder"]
                answer: "Feder"
              - id: l1-n3
                type: ordering
                text: "Ordne nach dem ABC."
                say: "Ordne die Wörter nach dem ABC."
                options: ["Kuchen", "Katze", "Kerze", "Kino"]
                slot_count: 4
                answer: ["Katze", "Kerze", "Kino", "Kuchen"]
              - id: l1-n4
                type: true_false
                text: "Stimmt die Reihenfolge?"
                say: "Lies die Wörter. Stehen sie in der Reihenfolge des ABC?"
                show: { drawn: letter-card, text: "Hand Hemd Huhn Hose" }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Welches Wort kommt im ABC zuletzt?"
                say: "Wurm, Wal, Wiese. Welches Wort kommt im ABC zuletzt?"
                options: ["Wurm", "Wal", "Wiese"]
                answer: "Wurm"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: ordering
            text: "Ordne nach dem ABC."
            say: "Ordne die Wörter nach dem ABC."
            options: ["Bus", "Apfel", "Dose"]
            slot_count: 3
            answer: ["Apfel", "Bus", "Dose"]
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort kommt im ABC zuerst?"
            say: "Nuss, Nebel, Name. Welches Wort kommt im ABC zuerst?"
            options: ["Nuss", "Nebel", "Name"]
            answer: "Name"
          - id: l1-c3
            type: true_false
            text: "Stimmt die Reihenfolge?"
            say: "Lies die Wörter. Stehen sie in der Reihenfolge des ABC?"
            show: { drawn: letter-card, text: "Rad Regen Ring Ruder" }
            answer: true
          - id: l1-c4
            type: ordering
            text: "Ordne nach dem ABC."
            say: "Ordne die Wörter nach dem ABC."
            options: ["Vogel", "Hai", "Robbe"]
            slot_count: 3
            answer: ["Hai", "Robbe", "Vogel"]
          - id: l1-c5
            type: multiple_choice
            text: "Welches Wort kommt im ABC zuletzt?"
            say: "Kopf, Knie, Kinn. Welches Wort kommt im ABC zuletzt?"
            options: ["Kopf", "Knie", "Kinn"]
            answer: "Kopf"
          - id: l1-c6
