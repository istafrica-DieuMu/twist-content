                hints:
                  - "Alle fangen mit Sa an. Schau auf den dritten Buchstaben."
                  - "Die dritten Buchstaben sind f, l und n. Welcher kommt zuerst?"
                  - "Saft, Salz, Sand."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welches Wort kommt im ABC zuerst?"
