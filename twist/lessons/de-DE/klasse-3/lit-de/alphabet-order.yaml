                hints:
                  - "Alle fangen mit Wa an. Schau auf den dritten Buchstaben."
                  - "Die dritten Buchstaben sind g, l und l. Wagen kommt zuerst. Wal und Wald fangen gleich an. Welches Wort ist kürzer?"
                  - "Das kürzere Wort kommt zuerst: Wal, dann Wald. Zuletzt kommt Wald."

          - support: some
