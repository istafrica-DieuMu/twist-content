# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.text-layout
skill: lit-de.handwriting.layout
curriculum: de-DE
language: de
title:
  de: Texte übersichtlich gestalten
  en: Laying out a text clearly
summary: >
  Giving a text a clear shape, so a reader finds their way at a glance.
  Lesson 1 lays out a text by hand: a heading at the top (often in the
  middle or underlined with a ruler; classes differ, so only "at the top"
  is marked),
  a Rand left free on both sides, a new Absatz on a new line whenever
  something new begins, and a clean line through a mistake instead of
  scribbling; lesson 2 does the same on the computer: a bigger or bold
  heading set in the middle with a button, the Eingabetaste for a new
  Absatz instead of many spaces, one easy-to-read font, and ends with
  the skill check. The child judges and fixes layouts shown as text and
  described in words; the app does not draw a page yet.
metadata:
  year: klasse-3
  topic: { de: Texte gestalten, en: Laying out text }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.handwriting.copy-sentences]
  also_practises: [lit-de.comprehension.paragraphs]
  vocabulary: { de: [Überschrift, Absatz, Rand, Zeile, übersichtlich, Eingabetaste, Leertaste, fett, zentrieren, Schriftart, Schriftgröße] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: one-block
      what: Writes the whole text as one block, with no new line where something new begins
      addressed: "lesson 1 Learn sets a block against the same text in Absätze; every stage of lesson 1 asks where the new Absatz starts (l1-f2 with feedback, l1-s2, l1-n2) or how many Absätze a text needs; skill check l2-c2"
    - id: edge-to-edge
      what: Writes into the Rand and up to the very edge of the page, or squeezes the last word in
      addressed: "lesson 1 Learn shows the Rand; l1-f4 (with feedback), l1-s4 and l1-n4 ask what to do at the end of a line or what the Rand is for; l1-n3 and l2-c3 judge a text written up to the edge"
    - id: spaces-for-layout
      what: On the computer uses many Leerzeichen or Leertaste presses to move a heading or start a new line, and mixes many fonts and colours
      addressed: "lesson 2 Learn shows the Eingabetaste and the button for the middle; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c4 choose the key or the button; l2-f4, l2-s4 and l2-c5 judge fonts and colours"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ein Text mit der Hand", en: "A text by hand" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was gehört zwischen zwei Wörter?"
            options: ["eine kleine Lücke", "ein Komma", "nichts"]
            answer: "eine kleine Lücke"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Lina hat einen Satz abgeschrieben. Was macht sie zum Schluss?"
            options: ["Sie vergleicht ihn mit der Vorlage.", "Sie malt ein Bild daneben.", "Sie schreibt ihn noch zweimal."]
            answer: "Sie vergleicht ihn mit der Vorlage."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Mein Wochenende\n\nAm Samstag war ich mit Papa im Schwimmbad. Ich bin zum ersten Mal vom Dreier gesprungen.\n\nAm Sonntag haben wir Oma besucht. Sie hat Waffeln gebacken."
            say: "So sieht ein übersichtlicher Text aus. Ganz oben steht die Überschrift. Sie sagt, worum es geht. Du kannst sie in die Mitte der Zeile schreiben oder mit dem Lineal unterstreichen. Darunter lässt du eine Zeile frei."
          - text: "Am Samstag ...\n\nAm Sonntag ..."
            say: "Wenn etwas Neues anfängt, beginnst du einen neuen Absatz. Du fängst eine neue Zeile an. Oft lässt du davor eine Zeile frei. So sieht der Leser gleich: Jetzt kommt etwas anderes."
          - text: "Rand frei lassen\nWort passt nicht mehr: nächste Zeile\nFehler: sauber durchstreichen"
            say: "Links und rechts lässt du einen Rand frei. Passt ein Wort nicht mehr in die Zeile, schreibst du es in die nächste Zeile. Einen Fehler streichst du mit einem sauberen Strich durch und schreibst das Wort richtig daneben."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wo steht die Überschrift?"
                say: "Du schreibst einen Text über deine Katze. Wo schreibst du die Überschrift hin?"
                options: ["ganz oben, über den Text", "unten, unter den Text", "irgendwo an den Rand"]
                answer: "ganz oben, über den Text"
                hints:
                  - "Der Leser soll gleich sehen, worum es geht."
                  - "Was liest du bei einem Text zuerst?"
                  - "Ganz oben, über den Text."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Der Ausflug\nAm Montag sind wir mit der Klasse in den Wald gegangen. Wir haben Blätter gesammelt und Pilze angeschaut. Am Dienstag haben wir aus den Blättern ein großes Bild geklebt. Es hängt jetzt im Flur.\n\nWo beginnt ein neuer Absatz?"
                say: "Lies den Text. Hier fehlt ein Absatz. Wo beginnt ein neuer Absatz?"
                options: ["vor „Am Dienstag“", "vor „Wir haben Blätter“", "vor „Es hängt jetzt“"]
                answer: "vor „Am Dienstag“"
                feedback:
                  "vor „Wir haben Blätter“": "Hier geht es noch um den Wald am Montag. Wo fängt etwas Neues an?"
                hints:
                  - "Ein neuer Absatz beginnt, wenn etwas Neues anfängt."
                  - "Erst geht es um den Montag. Und dann?"
                  - "Vor „Am Dienstag“."
              - id: l1-f3
                type: multiple_choice
                text: "Ein Text erzählt, wie Ben seinen Hund aus dem Tierheim geholt hat. Welche Überschrift passt?"
                say: "Ein Text erzählt, wie Ben seinen Hund aus dem Tierheim geholt hat. Welche Überschrift passt?"
                options: ["Mein Hund aus dem Tierheim", "Der Text", "Heute"]
                answer: "Mein Hund aus dem Tierheim"
                hints:
                  - "Die Überschrift sagt, worum es geht."
                  - "Worum geht es in Bens Text?"
                  - "Mein Hund aus dem Tierheim."
              - id: l1-f4
                type: multiple_choice
                text: "Das Wort „Schmetterling“ passt nicht mehr in die Zeile, nur noch in den Rand. Was machst du?"
                say: "Du schreibst in dein Heft. Das Wort Schmetterling passt nicht mehr in die Zeile, nur noch in den Rand. Was machst du?"
                options: ["Ich schreibe es in die nächste Zeile.", "Ich schreibe es in den Rand.", "Ich quetsche es ganz klein dazu."]
                answer: "Ich schreibe es in die nächste Zeile."
                feedback:
                  "Ich schreibe es in den Rand.": "Der Rand bleibt frei. Dort schreibt höchstens die Lehrerin."
                  "Ich quetsche es ganz klein dazu.": "Dann kann man es schlecht lesen. Es gibt doch noch eine nächste Zeile."
                hints:
                  - "Was gehört in den Rand?"
                  - "Der Rand bleibt frei."
                  - "Das Wort kommt in die nächste Zeile."
              - id: l1-f5
                type: true_false
                text: "Ole kritzelt ein falsches Wort ganz schwarz zu. Ist das übersichtlich?"
                say: "Ole hat sich verschrieben. Er kritzelt das Wort ganz schwarz zu. Ist das übersichtlich?"
                answer: false
                hints:
                  - "Wie streichst du einen Fehler durch?"
                  - "Mit einem sauberen Strich."
                  - "Nein. Ein Strich reicht, dann schreibst du es richtig daneben."
              - id: l1-f6
                type: ordering
                text: "Was kommt auf der Seite zuerst?"
                say: "Bring die Teile einer Heftseite in die Reihenfolge von oben nach unten."
                options: ["der erste Absatz", "die Überschrift", "der zweite Absatz", "eine freie Zeile"]
                slot_count: 4
                answer: ["die Überschrift", "eine freie Zeile", "der erste Absatz", "der zweite Absatz"]
                hints:
                  - "Was steht ganz oben?"
                  - "Unter der Überschrift lässt du eine Zeile frei."
                  - "Überschrift, freie Zeile, erster Absatz, zweiter Absatz."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Die Überschrift sagt, worum es im Text geht."
                say: "Eine Überschrift sagt dem Leser, worum es im Text geht. Stimmt das?"
                answer: true
                hints: ["Was liest du bei einem Text zuerst?"]
              - id: l1-s2
                type: multiple_choice
                text: "Unser Klassenfest\nZuerst haben wir Spiele gemacht. Beim Sackhüpfen hat Mia gewonnen. Danach gab es ein Buffet. Jeder hatte etwas mitgebracht.\n\nWo beginnt ein neuer Absatz?"
                say: "Lies den Text. Hier fehlt ein Absatz. Wo beginnt ein neuer Absatz?"
                options: ["vor „Danach gab es“", "vor „Beim Sackhüpfen“", "vor „Jeder hatte“"]
                answer: "vor „Danach gab es“"
                hints: ["Wo geht es nicht mehr um die Spiele?"]
              - id: l1-s3
                type: multiple_choice
                text: "Ein Text erklärt, wie man eine Sonnenblume aus einem Kern zieht. Welche Überschrift passt?"
                say: "Ein Text erklärt, wie man eine Sonnenblume aus einem Kern zieht. Welche Überschrift passt?"
                options: ["So wächst meine Sonnenblume", "Gelb", "Mein Heft"]
                answer: "So wächst meine Sonnenblume"
                hints: ["Welche Überschrift sagt, worum es im ganzen Text geht?"]
              - id: l1-s4
                type: multiple_choice
                text: "Wofür ist der Rand?"
                options: ["Er bleibt frei, damit die Seite ordentlich aussieht.", "Dort schreibst du die längsten Wörter hin.", "Dort malst du Bilder zum Text."]
                answer: "Er bleibt frei, damit die Seite ordentlich aussieht."
                hints: ["Was passiert mit dem Rand beim Schreiben?"]
              - id: l1-s5
                type: multiple_choice
                text: "Der Herbst\nIm Herbst werden die Blätter bunt. Sie fallen von den Bäumen.\nViele Vögel fliegen in den Süden. Dort ist es wärmer.\nWir sammeln Kastanien und basteln Tiere daraus.\n\nWie viele Absätze hat der Text?"
                say: "Lies den Text. Jeder Absatz beginnt in einer neuen Zeile. Wie viele Absätze hat er?"
                options: ["3", "5", "1"]
                answer: "3"
                hints: ["Zähl die neuen Zeilen unter der Überschrift, nicht die Sätze."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was lässt du unter der Überschrift frei?"
                options: ["eine Zeile", "eine ganze Seite", "gar nichts"]
                answer: "eine Zeile"
              - id: l1-n2
                type: multiple_choice
                text: "Mein Haustier\nIch habe einen Hamster. Er heißt Pünktchen und ist hellbraun. Nachts läuft er stundenlang in seinem Rad. Am Wochenende putze ich seinen Käfig. Papa hilft mir dabei.\n\nWo beginnt ein neuer Absatz?"
                say: "Lies den Text. Hier fehlt ein Absatz. Wo beginnt ein neuer Absatz?"
                options: ["vor „Am Wochenende“", "vor „Er heißt“", "vor „Papa hilft“"]
                answer: "vor „Am Wochenende“"
              - id: l1-n3
                type: true_false
                text: "Emma schreibt bis an die Blattkante. Hat sie einen Rand gelassen?"
                say: "Emma schreibt bis ganz an die Blattkante. Hat sie einen Rand gelassen?"
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Am Ende der Zeile ist nur noch Platz für zwei Buchstaben. Das nächste Wort ist „Fahrrad“. Was machst du?"
                say: "Am Ende der Zeile ist nur noch Platz für zwei Buchstaben. Das nächste Wort ist Fahrrad. Was machst du?"
                options: ["Ich schreibe Fahrrad in die nächste Zeile.", "Ich schreibe Fa und lasse den Rest weg.", "Ich schreibe in den Rand weiter."]
                answer: "Ich schreibe Fahrrad in die nächste Zeile."
              - id: l1-n5
                type: multiple_choice
                text: "Wie verbesserst du einen Fehler übersichtlich?"
                options: ["einmal sauber durchstreichen und richtig daneben schreiben", "mit dem Finger verwischen", "dick schwarz übermalen"]
                answer: "einmal sauber durchstreichen und richtig daneben schreiben"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wann beginnst du einen neuen Absatz?"
            options: ["wenn etwas Neues anfängt", "nach jedem Satz", "nie, alles bleibt zusammen"]
            answer: "wenn etwas Neues anfängt"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ist die Zeile voll, darf ein langes Wort in den Rand."
            say: "Ein langes Wort darfst du in den Rand schreiben, wenn die Zeile voll ist. Stimmt das?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Ein Text erzählt von Linas erstem Tag in der neuen Schule. Welche Überschrift passt?"
            say: "Ein Text erzählt von Linas erstem Tag in der neuen Schule. Welche Überschrift passt?"
            options: ["Mein erster Tag in der neuen Schule", "Schule ist", "Lina"]
            answer: "Mein erster Tag in der neuen Schule"

  - n: 2
    title: { de: "Ein Text am Computer", en: "A text on the computer" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo steht die Überschrift?"
            say: "Du schreibst einen Text über den Zoo. Wo steht die Überschrift?"
            options: ["ganz oben, über dem Text", "unten links", "am rechten Rand"]
            answer: "ganz oben, über dem Text"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Ein neuer Absatz beginnt in einer neuen Zeile."
            say: "Ein neuer Absatz beginnt in einer neuen Zeile. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Eingabetaste ↵"
            say: "Am Computer gelten dieselben Regeln wie im Heft. Für einen neuen Absatz drückst du die Eingabetaste. Drückst du sie zweimal, entsteht eine freie Zeile."
          - text: "Überschrift: fett, größer, in der Mitte"
            say: "Die Überschrift machst du größer oder fett. Dazu markierst du sie zuerst und klickst dann auf den Knopf für fett. In die Mitte bringst du sie mit dem Knopf zum Zentrieren. Viele Leerzeichen davor helfen nicht. Sie verrutschen leicht."
          - text: "eine Schriftart, gut lesbar"
            say: "Nimm eine Schriftart, die man gut lesen kann, und schreib den ganzen Text darin. Viele bunte Farben und verschnörkelte Schriften machen den Text unübersichtlich. Den Rand stellt das Programm schon für dich ein."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie machst du die Überschrift sichtbar?"
                say: "Du schreibst am Computer einen Text über Delfine. Wie machst du die Überschrift gut sichtbar?"
                options: ["Ich mache sie größer oder fett.", "Ich schreibe sie ganz klein.", "Ich lasse sie weg."]
                answer: "Ich mache sie größer oder fett."
                hints:
                  - "Die Überschrift soll man zuerst sehen."
                  - "Wie fällt ein Wort auf?"
                  - "Größer oder fett."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Du willst am Computer einen neuen Absatz beginnen. Welche Taste drückst du?"
                say: "Am Computer willst du einen neuen Absatz beginnen. Welche Taste drückst du?"
                options: ["die Eingabetaste", "die Leertaste, bis die Zeile voll ist", "die Rücktaste"]
                answer: "die Eingabetaste"
                feedback:
                  "die Leertaste, bis die Zeile voll ist": "Dann rutscht der Text zwar weiter, aber schon ein Wort mehr bringt alles durcheinander. Mit der Eingabetaste beginnt eine neue Zeile."
                  "die Rücktaste": "Mit der Rücktaste löschst du Buchstaben."
                hints:
                  - "Mit welcher Taste beginnt eine neue Zeile?"
                  - "Sie ist groß und hat oft einen Pfeil, der erst nach unten und dann nach links zeigt."
                  - "Die Eingabetaste."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Zweimal die Eingabetaste, dann ist zwischen zwei Absätzen eine Zeile frei."
                say: "Am Computer drückst du zweimal die Eingabetaste. Dann ist zwischen zwei Absätzen eine freie Zeile. Stimmt das?"
                answer: true
                hints:
                  - "Einmal drücken macht eine neue Zeile."
                  - "Was passiert beim zweiten Mal?"
                  - "Ja. Dann ist eine Zeile frei."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Text ist am übersichtlichsten?"
                say: "Drei Kinder haben ihren Text am Computer geschrieben. Welcher Text ist am übersichtlichsten?"
                options: ["eine gut lesbare Schrift, Überschrift fett", "jedes Wort in einer anderen Farbe", "fünf verschiedene Schnörkelschriften"]
                answer: "eine gut lesbare Schrift, Überschrift fett"
                hints:
                  - "Was hilft dem Leser?"
                  - "Viele Farben und Schriften lenken ab."
                  - "Eine gut lesbare Schrift, Überschrift fett."
              - id: l2-f5
                type: multiple_choice
                text: "Wie bringst du die Überschrift in die Mitte?"
                options: ["mit dem Knopf zum Zentrieren", "mit vielen Leerzeichen davor", "gar nicht, sie bleibt links"]
                answer: "mit dem Knopf zum Zentrieren"
                hints:
                  - "Leerzeichen verrutschen leicht."
                  - "Das Programm hat dafür einen Knopf."
                  - "Mit dem Knopf zum Zentrieren."
              - id: l2-f6
                type: sorting
                text: "Übersichtlich oder unübersichtlich?"
                say: "Was macht einen Text am Computer übersichtlich, was macht ihn unübersichtlich? Sortiere."
                bins:
                  - { id: gut, show: { text: "übersichtlich" }, say: "übersichtlich" }
                  - { id: schlecht, show: { text: "unübersichtlich" }, say: "unübersichtlich" }
                options:
                  - { text: "Absätze mit freier Zeile", bin: gut }
                  - { text: "eine fette Überschrift", bin: gut }
                  - { text: "alles in einem Block", bin: schlecht }
                  - { text: "jede Zeile eine andere Schriftart", bin: schlecht }
                hints:
                  - "Stell dir vor, du sollst den Text lesen."
                  - "Was hilft, was stört?"
                  - "Absätze und fette Überschrift helfen. Block und viele Schriften stören."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Am Computer brauchst du keine Überschrift."
                say: "Am Computer brauchst du keine Überschrift. Stimmt das?"
                answer: false
                hints: ["Gelten am Computer dieselben Regeln wie im Heft?"]
              - id: l2-s2
                type: multiple_choice
                text: "Mitten im Text fängt etwas Neues an. Du willst am Computer einen neuen Absatz. Was machst du?"
                say: "Mitten im Text fängt etwas Neues an. Du willst am Computer einen neuen Absatz. Was machst du?"
                options: ["Ich drücke die Eingabetaste.", "Ich drücke oft die Leertaste.", "Ich schreibe einfach weiter."]
                answer: "Ich drücke die Eingabetaste."
                hints: ["Welche Taste macht eine neue Zeile?"]
              - id: l2-s3
                type: multiple_choice
                text: "Wie groß schreibst du die Überschrift?"
                options: ["größer als den Text", "kleiner als den Text", "genauso wie den Text, aber ganz unten"]
                answer: "größer als den Text"
                hints: ["Die Überschrift soll man zuerst sehen."]
              - id: l2-s4
                type: true_false
                text: "Can schreibt jedes Wort in einer anderen Farbe. Kann man das gut lesen?"
                say: "Can schreibt jedes Wort in einer anderen Farbe. So kann man seinen Text gut lesen. Stimmt das?"
                answer: false
                hints: ["Was passiert mit den Augen bei so vielen Farben?"]
              - id: l2-s5
                type: ordering
                text: "Bring die Schritte in die richtige Reihenfolge."
                say: "Du gestaltest eine Überschrift am Computer. Bring die Schritte in die richtige Reihenfolge."
                options: ["auf fett klicken", "die Überschrift schreiben", "die Überschrift markieren"]
                slot_count: 3
                answer: ["die Überschrift schreiben", "die Überschrift markieren", "auf fett klicken"]
                hints: ["Was du gestalten willst, musst du erst markieren."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Was gilt am Computer genauso wie im Heft?"
                options: ["Überschrift, Absätze und Rand", "nur die Farben", "gar nichts"]
                answer: "Überschrift, Absätze und Rand"
              - id: l2-n2
                type: multiple_choice
                text: "Wie machst du eine freie Zeile zwischen zwei Absätzen?"
                options: ["zweimal die Eingabetaste drücken", "zehnmal die Leertaste drücken", "einen Punkt setzen"]
                answer: "zweimal die Eingabetaste drücken"
              - id: l2-n3
                type: true_false
                text: "Stimmt das? Den Rand machst du am Computer selbst mit Leerzeichen."
                say: "Den Rand musst du am Computer selbst mit Leerzeichen machen. Stimmt das?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Welche Schrift wählst du für deinen Text?"
                options: ["eine schlichte, gut lesbare Schrift", "eine Schrift mit vielen Schnörkeln", "für jeden Absatz eine andere"]
                answer: "eine schlichte, gut lesbare Schrift"
              - id: l2-n5
                type: sorting
                text: "Heft oder Computer?"
                say: "Wie machst du das im Heft, wie am Computer? Sortiere."
                bins:
                  - { id: heft, show: { text: "im Heft" }, say: "im Heft" }
                  - { id: computer, show: { text: "am Computer" }, say: "am Computer" }
                options:
                  - { text: "Überschrift mit dem Lineal unterstreichen", bin: heft }
                  - { text: "Fehler sauber durchstreichen", bin: heft }
                  - { text: "Überschrift fett machen", bin: computer }
                  - { text: "Eingabetaste für einen neuen Absatz", bin: computer }

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Ein Text erklärt, wie Igel den Winter verbringen. Welche Überschrift passt?"
            say: "Ein Text erklärt, wie Igel den Winter verbringen. Welche Überschrift passt?"
            options: ["Wie Igel den Winter verbringen", "Tiere", "Mein Text"]
            answer: "Wie Igel den Winter verbringen"
          - id: l2-c2
            type: multiple_choice
            text: "Mein Geburtstag\nZum Geburtstag habe ich ein Fahrrad bekommen. Es ist rot und hat eine Klingel. Am Nachmittag kamen meine Freunde. Wir haben Schatzsuche gespielt.\n\nWo beginnt ein neuer Absatz?"
            say: "Lies den Text. Hier fehlt ein Absatz. Wo beginnt ein neuer Absatz?"
            options: ["vor „Am Nachmittag“", "vor „Es ist rot“", "vor „Wir haben Schatzsuche“"]
            answer: "vor „Am Nachmittag“"
          - id: l2-c3
            type: multiple_choice
            text: "Tom hat in seinem Heft jede Zeile bis ganz an die Blattkante geschrieben. Was hat er vergessen?"
            say: "Tom hat in seinem Heft jede Zeile bis ganz an die Blattkante geschrieben. Was hat er vergessen?"
            options: ["den Rand", "die Überschrift", "den Punkt"]
            answer: "den Rand"
          - id: l2-c4
