# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.infer
skill: lit-de.comprehension.infer
curriculum: de-DE
language: de
title:
  de: Zwischen den Zeilen lesen
  en: Reading between the lines
summary: >
  Drawing conclusions that a text does not state. Lesson 1 reads short
  texts and works out from clues what the text does not say (the weather,
  a place, a feeling); lesson 2 links two places in a text to answer a
  question, tells what stands in the text from what you can work out, and
  ends with the skill check. Every text is written for Twist.
metadata:
  year: klasse-3
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.comprehension.key-words]
  also_practises: [lit-de.comprehension.key-words, lit-de.comprehension.read-precisely]
  vocabulary: { de: [Hinweis, Textstelle, schließen, vermuten, Schlüsselwort] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: only-literal
      what: Looks only for the exact words of the answer and says it is not in the text
      addressed: "lesson 1 Learn collects clues; every stage asks a question whose answer is not written (l1-f1, l1-s1, l1-n1), with feedback on l1-f1 for the option that copies words from the text"
    - id: own-guess
      what: Answers from what they would like or know, not from the clues in the text
      addressed: "lesson 2 sorts statements into stands in the text, can be worked out, and does not fit the text (l2-f4, l2-s4, l2-n4, l2-c5); distractors in l2-f1 and l2-n2 are plausible guesses with no clue in the text"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Hinweise sammeln", en: "Collecting clues" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Igel fressen am liebsten Käfer, Würmer und Schnecken.\n\nWelches Schlüsselwort hilft bei der Frage: Was fressen Igel?"
            say: "Lies den Text. Welches Schlüsselwort hilft dir bei der Frage: Was fressen Igel?"
            options: ["fressen", "am liebsten", "und"]
            answer: "fressen"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Der Bus fährt um acht Uhr ab. Lina ist um Viertel nach acht an der Haltestelle.\n\nSteht im Text, dass Lina den Bus verpasst?"
            say: "Lies den Text genau. Steht dort wörtlich, dass Lina den Bus verpasst?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Jan zieht seine dicke Jacke an. Er setzt eine Mütze auf und nimmt seinen Schlitten mit."
            say: "Hier steht nicht, welche Jahreszeit es ist. Aber der Text gibt Hinweise: eine dicke Jacke, eine Mütze, ein Schlitten."
          - text: "dicke Jacke + Mütze + Schlitten → Winter"
            say: "Du verbindest die Hinweise und ziehst einen Schluss: Es ist Winter, und es liegt Schnee. Das steht nicht da, aber du kannst es dir denken."
          - text: "Frag dich: Welche Wörter im Text verraten es mir?"
            say: "Ein guter Schluss stützt sich immer auf Wörter im Text. Rate nicht einfach, sondern such die Hinweise."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Sophie steht an der Kasse. Sie legt Milch, Brot und Äpfel auf das Band. Die Verkäuferin lächelt sie an.\n\nWo ist Sophie?"
                say: "Lies den Text. Wo ist Sophie? Das steht nicht direkt da."
                options: ["im Supermarkt", "an der Kasse im Kino", "in der Schule"]
                answer: "im Supermarkt"
                feedback:
                  "an der Kasse im Kino": "An der Kasse stimmt, aber im Kino legt man keine Milch und kein Brot auf ein Band."
                hints:
                  - "Welche Wörter verraten den Ort?"
                  - "Kasse, Band, Milch, Brot, Äpfel. Wo kauft man das ein?"
                  - "Im Supermarkt."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Als Oskar nach Hause kommt, rennt er sofort in sein Zimmer und knallt die Tür zu. Er will mit niemandem reden.\n\nWie fühlt sich Oskar?"
                say: "Lies den Text. Wie fühlt sich Oskar?"
                options: ["wütend oder traurig", "fröhlich", "müde und ruhig"]
                answer: "wütend oder traurig"
                hints:
                  - "Was macht Oskar mit der Tür?"
                  - "Wer die Tür zuknallt und nicht reden will, ist nicht gut gelaunt."
                  - "Wütend oder traurig."
              - id: l1-f3
                type: multiple_choice
                text: "Die Kinder stehen mit ihren Schultüten vor dem Schultor. Viele sind ein bisschen aufgeregt. Heute lernen sie ihre Lehrerin kennen.\n\nWas für ein Tag ist heute?"
                say: "Lies den Text. Was für ein Tag ist heute?"
                options: ["der erste Schultag", "der letzte Schultag", "ein Geburtstag"]
                answer: "der erste Schultag"
                hints:
                  - "Wann bekommen Kinder eine Schultüte?"
                  - "Sie lernen ihre Lehrerin erst kennen."
                  - "Der erste Schultag."
              - id: l1-f4
                type: true_false
                text: "Opa holt den Schirm aus dem Schrank und zieht seine Gummistiefel an.\n\nKann man daraus schließen, dass es regnet?"
                say: "Lies den Text. Kannst du daraus schließen, dass es regnet?"
                answer: true
                hints:
                  - "Welche Hinweise gibt es?"
                  - "Schirm und Gummistiefel braucht man bei welchem Wetter?"
                  - "Ja, es regnet wahrscheinlich."
              - id: l1-f5
                type: multiple_choice
                text: "Lea gähnt. Ihre Augen fallen immer wieder zu. Das Buch rutscht ihr aus der Hand.\n\nWas passiert gleich?"
                say: "Lies den Text. Was passiert wahrscheinlich gleich?"
                options: ["Lea schläft ein.", "Lea geht joggen.", "Lea liest noch ein Buch."]
                answer: "Lea schläft ein."
                hints:
                  - "Was zeigen Gähnen und zufallende Augen?"
                  - "Lea ist sehr müde."
                  - "Lea schläft gleich ein."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Überall liegen bunte Blätter. Die Kinder sammeln Kastanien. Der Wind trägt die Drachen hoch in den Himmel.\n\nWelche Jahreszeit ist es?"
                say: "Lies den Text. Welche Jahreszeit ist es?"
                options: ["Herbst", "Sommer", "Frühling"]
                answer: "Herbst"
                hints: ["Wann fallen bunte Blätter und Kastanien?"]
              - id: l1-s2
                type: multiple_choice
                text: "Herr Braun trägt einen weißen Kittel. Er hört mit einem Stethoskop Emmas Herz ab und sagt: „Mach mal Ah!“\n\nWer ist Herr Braun?"
                say: "Lies den Text. Wer ist Herr Braun?"
                options: ["ein Arzt", "ein Bäcker", "ein Lehrer"]
                answer: "ein Arzt"
                hints: ["Wer hört das Herz ab?"]
              - id: l1-s3
                type: true_false
                text: "Finn hat Schokolade im Gesicht. Die Keksdose ist leer. Finn sagt: „Ich war das nicht!“\n\nKann man daraus schließen, dass Finn die Kekse nicht gegessen hat?"
                say: "Lies den Text. Kannst du daraus schließen, dass Finn die Kekse nicht gegessen hat?"
                answer: false
                hints: ["Was sagen die Hinweise, was sagt Finn?"]
              - id: l1-s4
                type: multiple_choice
                text: "Mama zündet acht Kerzen an. Alle singen. Mila pustet so fest sie kann.\n\nWas feiert Mila?"
                say: "Lies den Text. Was feiert Mila?"
                options: ["ihren achten Geburtstag", "Weihnachten", "ihren ersten Schultag"]
                answer: "ihren achten Geburtstag"
                hints: ["Wann pustet man Kerzen aus? Wie viele sind es?"]
              - id: l1-s5
                type: multiple_choice
                text: "Der Boden ist nass. Auf dem Tisch liegt eine umgekippte Vase. Die Katze sitzt daneben und putzt sich.\n\nWas ist wahrscheinlich passiert?"
                say: "Lies den Text. Was ist wahrscheinlich passiert?"
                options: ["Die Katze hat die Vase umgeworfen.", "Es hat ins Zimmer geregnet.", "Mama hat den Boden gewischt."]
                answer: "Die Katze hat die Vase umgeworfen."
                hints: ["Wer sitzt direkt neben der Vase?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ayla zieht ihren Badeanzug an. Sie nimmt ihre Schwimmbrille und ein Handtuch. Dann springt sie ins Becken.\n\nWo ist Ayla?"
                say: "Lies den Text. Wo ist Ayla?"
                options: ["im Schwimmbad", "in der Badewanne", "im Wald"]
                answer: "im Schwimmbad"
              - id: l1-n2
                type: multiple_choice
                text: "Ben hält seine Medaille hoch und strahlt. Seine Freunde klatschen und jubeln.\n\nWie fühlt sich Ben?"
                say: "Lies den Text. Wie fühlt sich Ben?"
                options: ["stolz und froh", "ängstlich", "gelangweilt"]
                answer: "stolz und froh"
              - id: l1-n3
                type: true_false
                text: "Die Straßen sind leer. Die Sterne funkeln am Himmel, und alle Fenster sind dunkel.\n\nKann man daraus schließen, dass es Nacht ist?"
                say: "Lies den Text. Kannst du daraus schließen, dass es Nacht ist?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Der Teig ist fertig. Noah schiebt das Blech in den heißen Ofen. Bald duftet es in der ganzen Küche.\n\nWas macht Noah?"
                say: "Lies den Text. Was macht Noah?"
                options: ["Er backt.", "Er räumt auf.", "Er kocht Suppe."]
                answer: "Er backt."
              - id: l1-n5
                type: multiple_choice
                text: "Emil hat die Hausaufgaben vergessen. Als die Lehrerin danach fragt, wird er ganz rot und schaut auf den Boden.\n\nWie fühlt sich Emil?"
                say: "Lies den Text. Wie fühlt sich Emil?"
                options: ["Es ist ihm peinlich.", "Er ist stolz.", "Er freut sich."]
                answer: "Es ist ihm peinlich."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Die Sonne brennt. Die Kinder bauen eine Sandburg, und das Meer rauscht.\n\nWo sind die Kinder?"
            say: "Lies den Text. Wo sind die Kinder?"
            options: ["am Strand", "im Sandkasten im Kindergarten", "im Schnee"]
            answer: "am Strand"
          - id: l1-c2
            type: multiple_choice
            text: "Marie hält ihren Daumen. Ein Tropfen Blut ist zu sehen. Neben ihr liegt eine Rose mit Dornen.\n\nWas ist passiert?"
            say: "Lies den Text. Was ist passiert?"
            options: ["Marie hat sich an einem Dorn gestochen.", "Marie hat sich in den Finger geschnitten.", "Marie ist hingefallen."]
            answer: "Marie hat sich an einem Dorn gestochen."
          - id: l1-c3
            type: true_false
            text: "Paul packt seinen Koffer. Er legt Badehose, Sonnencreme und Sonnenhut hinein.\n\nKann man daraus schließen, dass Paul in den Skiurlaub fährt?"
            say: "Lies den Text. Kannst du daraus schließen, dass Paul in den Skiurlaub fährt?"
            answer: false

  - n: 2
    title: { de: "Textstellen verbinden", en: "Linking parts of a text" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Clara trägt Handschuhe und Schal. Ihr Atem macht kleine Wolken in der Luft.\n\nWie ist das Wetter?"
            say: "Lies den Text. Wie ist das Wetter?"
            options: ["kalt", "heiß", "schwül"]
            answer: "kalt"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Tim zieht die Gardine zur Seite und blinzelt. Die Sonne scheint hell ins Zimmer.\n\nKann man daraus schließen, dass es Tag ist?"
            say: "Lies den Text. Kannst du daraus schließen, dass es Tag ist?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Lotte hat einen Hund. Er heißt Bruno.\nBruno bellt, wenn es klingelt.\nAm Nachmittag bellt Bruno laut. Lotte rennt zur Tür."
            say: "Manchmal brauchst du zwei Stellen im Text. Warum rennt Lotte zur Tür? In Zeile zwei steht: Bruno bellt, wenn es klingelt."
          - text: "Bruno bellt, wenn es klingelt. + Bruno bellt laut. → Es hat geklingelt."
            say: "Du verbindest die beiden Stellen: Bruno bellt, also hat es wohl geklingelt. Darum rennt Lotte zur Tür."
          - text: "steht im Text | kann ich mir denken | passt nicht zum Text"
            say: "Unterscheide immer: Was steht wirklich im Text? Was kann ich mir mit Hinweisen denken? Und was passt gar nicht zum Text?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Herr Yilmaz hat einen kleinen Laden.\nJeden Morgen um sechs backt er Brötchen.\nHeute ist er krank. Um sieben stehen die Kunden vor einer geschlossenen Tür.\n\nWarum ist der Laden heute zu?"
                say: "Lies den Text. Warum ist der Laden heute zu? Verbinde zwei Stellen."
                options: ["Herr Yilmaz ist krank.", "Es ist Sonntag.", "Die Brötchen sind ausverkauft."]
                answer: "Herr Yilmaz ist krank."
                feedback:
                  "Es ist Sonntag.": "Das kann sein, aber im Text gibt es dafür keinen Hinweis. Lies die dritte Zeile."
                hints:
                  - "Was ist heute anders als sonst?"
                  - "Lies die dritte Zeile."
                  - "Der Laden ist zu, weil Herr Yilmaz krank ist."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Mira hat zwei Geschwister: Ole und Tara.\nOle ist zwei Jahre älter als Mira.\nTara ist jünger als Mira.\n\nWer ist das älteste Kind?"
                say: "Lies den Text. Wer ist das älteste Kind? Verbinde die Stellen."
                options: ["Ole", "Mira", "Tara"]
                answer: "Ole"
                hints:
                  - "Wer ist älter als Mira? Wer ist jünger?"
                  - "Ole ist älter als Mira, Tara ist jünger als Mira."
                  - "Ole ist der Älteste."
              - id: l2-f3
                type: multiple_choice
                text: "Im Garten von Familie Klein steht ein Apfelbaum.\nIm Frühling blüht er weiß.\nJetzt ist der Baum voller roter Äpfel.\n\nWelche Jahreszeit ist jetzt wohl?"
                say: "Lies den Text. Welche Jahreszeit ist jetzt wohl?"
                options: ["Spätsommer oder Herbst", "Frühling", "Winter"]
                answer: "Spätsommer oder Herbst"
                hints:
                  - "Im Frühling blüht der Baum. Was kommt nach der Blüte?"
                  - "Wann sind Äpfel reif?"
                  - "Im Spätsommer oder Herbst."
              - id: l2-f4
                type: sorting
                text: "Ida nimmt ihren Rucksack und läuft zur Haltestelle. Sie schaut auf die Uhr und rennt los.\n\nSortiere die Sätze."
                say: "Lies den Text. Sortiere: Steht es im Text, kannst du es dir denken, oder passt es nicht zum Text?"
                bins:
                  - { id: text, show: { text: "steht im Text" }, say: "steht im Text" }
                  - { id: think, show: { text: "kann ich mir denken" }, say: "kann ich mir denken" }
                  - { id: no, show: { text: "passt nicht" }, say: "passt nicht zum Text" }
                options:
                  - { text: "Ida hat einen Rucksack.", bin: text }
                  - { text: "Ida ist spät dran.", bin: think }
                  - { text: "Ida hat viel Zeit.", bin: no }
                option_audio: false
                hints:
                  - "Lies jeden Satz und such ihn im Text."
                  - "Steht spät im Text? Warum rennt Ida los?"
                  - "Rucksack steht da, spät dran kannst du dir denken, viel Zeit passt nicht."
              - id: l2-f5
                type: true_false
                text: "Nils wohnt im dritten Stock.\nDer Aufzug ist seit Montag kaputt.\nAm Dienstag kommt Nils mit schweren Einkaufstüten nach Hause.\n\nKann man daraus schließen, dass Nils die Treppe nehmen muss?"
                say: "Lies den Text. Kannst du daraus schließen, dass Nils die Treppe nehmen muss?"
                answer: true
                hints:
                  - "Seit wann ist der Aufzug kaputt?"
                  - "Dienstag kommt nach Montag. Geht der Aufzug dann?"
                  - "Ja, er muss die Treppe nehmen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Lukas spart für ein neues Fahrrad.\nEs kostet 200 Euro.\nIn seiner Spardose sind schon 150 Euro. Zum Geburtstag bekommt er 50 Euro von Oma.\n\nWas kann Lukas jetzt tun?"
                say: "Lies den Text. Was kann Lukas jetzt tun?"
                options: ["das Fahrrad kaufen", "weiter sparen, weil Geld fehlt", "nichts, das Fahrrad ist ausverkauft"]
                answer: "das Fahrrad kaufen"
                hints: ["Rechne: 150 Euro und 50 Euro."]
              - id: l2-s2
                type: multiple_choice
                text: "Pia mag keine Tomaten.\nZum Abendessen gibt es Nudeln mit Tomatensoße.\nPia schiebt den Teller weg.\n\nWarum schiebt Pia den Teller weg?"
                say: "Lies den Text. Warum schiebt Pia den Teller weg?"
                options: ["Sie mag keine Tomaten.", "Sie ist schon satt.", "Die Nudeln sind kalt."]
                answer: "Sie mag keine Tomaten."
                hints: ["Woraus ist die Soße gemacht?"]
              - id: l2-s3
                type: true_false
                text: "Die Klasse 3b macht einen Ausflug.\nBei Regen fällt der Ausflug aus.\nAm Morgen regnet es in Strömen.\n\nFindet der Ausflug statt?"
                say: "Lies den Text. Findet der Ausflug statt?"
                answer: false
                hints: ["Was passiert bei Regen?"]
              - id: l2-s4
                type: sorting
                text: "Jakob kommt mit einem Pflaster am Knie vom Spielplatz. Er humpelt ein bisschen.\n\nSortiere die Sätze."
                say: "Lies den Text. Sortiere: Steht es im Text, kannst du es dir denken, oder passt es nicht zum Text?"
                bins:
                  - { id: text, show: { text: "steht im Text" }, say: "steht im Text" }
                  - { id: think, show: { text: "kann ich mir denken" }, say: "kann ich mir denken" }
                  - { id: no, show: { text: "passt nicht" }, say: "passt nicht zum Text" }
                options:
                  - { text: "Jakob humpelt.", bin: text }
                  - { text: "Jakob ist hingefallen.", bin: think }
                  - { text: "Jakob hat sich nicht wehgetan.", bin: no }
                option_audio: false
                hints: ["Was steht da wörtlich? Was erklärt das Pflaster?"]
              - id: l2-s5
                type: multiple_choice
                text: "Anna, Ben und Can laufen um die Wette.\nAnna ist schneller als Ben.\nCan kommt nach Ben ins Ziel.\n\nWer gewinnt?"
                say: "Lies den Text. Wer gewinnt das Rennen?"
                options: ["Anna", "Ben", "Can"]
                answer: "Anna"
                hints: ["Wer ist vor Ben, wer hinter Ben?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Frau Berg füttert jeden Abend die Vögel.\nSeit einer Woche ist sie im Urlaub.\nDie Nachbarin hat versprochen zu helfen.\n\nWer füttert jetzt die Vögel?"
                say: "Lies den Text. Wer füttert jetzt wohl die Vögel?"
                options: ["die Nachbarin", "Frau Berg", "niemand"]
                answer: "die Nachbarin"
              - id: l2-n2
                type: multiple_choice
                text: "Elias hat Angst vor Hunden.\nAuf dem Weg zur Schule sitzt ein großer Hund am Gartentor.\nElias geht heute einen anderen Weg.\n\nWarum nimmt Elias einen anderen Weg?"
                say: "Lies den Text. Warum nimmt Elias einen anderen Weg?"
                options: ["Er hat Angst vor dem Hund.", "Der andere Weg ist kürzer.", "Er will einen Freund abholen."]
                answer: "Er hat Angst vor dem Hund."
              - id: l2-n3
                type: true_false
                text: "Im Kino darf man nur mit einer Karte in den Saal.\nZoe hat ihre Karte zu Hause vergessen.\n\nKann Zoe den Film im Saal sehen?"
                say: "Lies den Text. Kann Zoe den Film im Saal sehen?"
                answer: false
              - id: l2-n4
                type: sorting
                text: "Die Blumen auf dem Balkon lassen die Köpfe hängen. Die Erde in den Töpfen ist ganz trocken.\n\nSortiere die Sätze."
                say: "Lies den Text. Sortiere: Steht es im Text, kannst du es dir denken, oder passt es nicht zum Text?"
                bins:
                  - { id: text, show: { text: "steht im Text" }, say: "steht im Text" }
                  - { id: think, show: { text: "kann ich mir denken" }, say: "kann ich mir denken" }
                  - { id: no, show: { text: "passt nicht" }, say: "passt nicht zum Text" }
                options:
                  - { text: "Die Erde ist trocken.", bin: text }
                  - { text: "Die Blumen brauchen Wasser.", bin: think }
                  - { text: "Die Blumen wurden gerade gegossen.", bin: no }
                option_audio: false
              - id: l2-n5
                type: multiple_choice
                text: "Tom ist größer als Jan.\nJan ist größer als Mats.\n\nWer ist der Kleinste?"
                say: "Lies den Text. Wer ist der Kleinste?"
                options: ["Mats", "Jan", "Tom"]
                answer: "Mats"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Leni geht jeden Mittwoch zum Turnen.\nHeute hat sie ihre Turnschuhe und ihr Trikot eingepackt.\n\nWelcher Tag ist heute wohl?"
            say: "Lies den Text. Welcher Tag ist heute wohl?"
            options: ["Mittwoch", "Sonntag", "Freitag"]
            answer: "Mittwoch"
          - id: l2-c2
            type: multiple_choice
            text: "Draußen donnert und blitzt es. Der kleine Hund kriecht unter das Sofa und zittert.\n\nWie fühlt sich der Hund?"
            say: "Lies den Text. Wie fühlt sich der Hund?"
            options: ["Er hat Angst.", "Er ist müde.", "Er will spielen."]
            answer: "Er hat Angst."
          - id: l2-c3
            type: multiple_choice
            text: "Die Bücherei schließt um 18 Uhr.\nMalik kommt um halb sieben dort an.\n\nWas passiert?"
            say: "Lies den Text. Was passiert, als Malik ankommt?"
            options: ["Die Bücherei ist schon zu.", "Malik leiht sich ein Buch aus.", "Malik muss lange warten, bis sie aufmacht."]
            answer: "Die Bücherei ist schon zu."
          - id: l2-c4
            type: true_false
            text: "Sara isst eine Erdnuss und bekommt rote Flecken im Gesicht.\nIhre Mama gibt ihr sofort eine Tablette.\n\nKann man daraus schließen, dass Sara Erdnüsse nicht verträgt?"
            say: "Lies den Text. Kannst du daraus schließen, dass Sara Erdnüsse nicht verträgt?"
            answer: true
          - id: l2-c5
            type: sorting
            text: "Der Postbote klingelt zweimal. Niemand öffnet. Er steckt einen Zettel in den Briefkasten.\n\nSortiere die Sätze."
            say: "Lies den Text. Sortiere: Steht es im Text, kannst du es dir denken, oder passt es nicht zum Text?"
            bins:
              - { id: text, show: { text: "steht im Text" }, say: "steht im Text" }
              - { id: think, show: { text: "kann ich mir denken" }, say: "kann ich mir denken" }
              - { id: no, show: { text: "passt nicht" }, say: "passt nicht zum Text" }
