# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.prompt-stories
skill: lit-de.writing.prompt-stories
curriculum: de-DE
language: de
title:
  de: Reizwörter, weiterschreiben, umschreiben
  en: Prompt words, continuing and rewriting
summary: >
  Writing a story from given words, or continuing and changing one,
  practised by choosing and ordering. Lesson 1 checks whether a story uses
  every Reizwort and makes the Reizwörter carry the plot; lesson 2 chooses
  a continuation that fits the beginning, rewrites an ending or a point of
  view, and ends with the skill check. Writing the story out freely waits
  for the write_text task type.
metadata:
  year: klasse-3
  topic: { de: Erzählen, en: Telling stories }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.writing.stories]
  also_practises: [lit-de.writing.stories, lit-de.verbs.simple-past]
  vocabulary: { de: [Reizwort, Reizwortgeschichte, weiterschreiben, umschreiben, Fortsetzung, Erzähler, Sicht] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: list-the-words
      what: Puts the Reizwörter into a list of sentences with no story connecting them
      addressed: "lesson 1 Learn and l1-f3, l1-s3, l1-n3 and l2-c2 choose between a real story and a sentence list with the same words; feedback on l1-f3 names the list"
    - id: continuation-ignores-start
      what: Continues a story with a new place, new characters or another tense, ignoring the beginning
      addressed: "lesson 2 chooses the continuation that keeps the characters, the place and the Präteritum (l2-f1, l2-s1, l2-n1, l2-c3), with feedback on l2-f1"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Geschichten zu Reizwörtern", en: "Stories from prompt words" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welches Wort macht den Satz spannender?"
            say: "Welches Wort macht den Satz spannender?"
            frame: "_ zerplatzte der Luftballon."
            options: ["Plötzlich", "Dann", "Und"]
            answer: ["Plötzlich"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was gehört in die Einleitung einer Geschichte?"
            say: "Was gehört in die Einleitung einer Geschichte?"
            options: ["wer mitspielt, wo und wann", "wie das Problem gelöst wird", "die spannendste Stelle"]
            answer: "wer mitspielt, wo und wann"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Reizwörter: Zelt, Gewitter, Taschenlampe"
            say: "Reizwörter sind Wörter, die in deiner Geschichte vorkommen müssen. Zu diesen drei Wörtern denkst du dir eine Geschichte aus."
          - text: "Am ersten Ferientag schliefen Mia und ihr Bruder im Zelt im Garten. Mitten in der Nacht zog ein Gewitter auf. Es donnerte laut. Zitternd suchte Mia ihre Taschenlampe."
            say: "Alle drei Reizwörter kommen vor, und sie hängen zusammen: Das Gewitter ist das Problem, die Taschenlampe hilft. So wird daraus eine echte Geschichte."
          - text: "Ich habe ein Zelt. Es gibt Gewitter. Die Taschenlampe ist gelb."
            say: "Das hier ist keine Geschichte. Die Wörter stehen nur nebeneinander. Überlege: Wie hängen die Reizwörter zusammen? Was ist das Problem?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Reizwörter: Schlüssel, Keller, Katze. Tippe auf die drei Reizwörter im Text."
                say: "Lies die Geschichte. Tippe auf die drei Reizwörter."
                show: { drawn: letter-card, text: "Opa schickte Ben in den Keller. Dort lag ein alter Schlüssel. Plötzlich sprang eine Katze aus der Kiste." }
                spans: ["Keller.", "Schlüssel.", "Katze"]
                hints:
                  - "Such die Wörter Schlüssel, Keller und Katze."
                  - "Jedes kommt einmal vor."
                  - "Keller, Schlüssel, Katze."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Reizwörter: Fahrrad, Regen, Freundin\n\nAm Samstag fuhr Lisa mit dem Fahrrad zu ihrer Freundin. Unterwegs überraschte sie ein heftiger Regen.\n\nKommen alle Reizwörter vor?"
                say: "Lies die Reizwörter und die Geschichte. Kommen alle Reizwörter vor?"
                options: ["Ja, alle drei.", "Nein, Regen fehlt.", "Nein, Fahrrad fehlt."]
                answer: "Ja, alle drei."
                hints:
                  - "Such jedes Reizwort im Text."
                  - "Fahrrad steht im ersten Satz, Regen im zweiten. Und die Freundin?"
                  - "Ja, alle drei kommen vor."
              - id: l1-f3
                type: multiple_choice
                text: "Reizwörter: Ball, Fenster, Nachbar\n\nWelcher Text ist eine Geschichte?"
                say: "Lies die Reizwörter. Welcher Text ist eine echte Geschichte?"
                options: ["Tim schoss den Ball zu fest. Klirr! Das Fenster vom Nachbarn war kaputt. Mit klopfendem Herzen klingelte Tim bei ihm.", "Ich habe einen Ball. Das Fenster ist groß. Mein Nachbar heißt Herr Kunz."]
                answer: "Tim schoss den Ball zu fest. Klirr! Das Fenster vom Nachbarn war kaputt. Mit klopfendem Herzen klingelte Tim bei ihm."
                option_audio: false
                feedback:
                  "Ich habe einen Ball. Das Fenster ist groß. Mein Nachbar heißt Herr Kunz.": "Hier stehen die Wörter nur nebeneinander. Es passiert nichts, und sie hängen nicht zusammen."
                hints:
                  - "In welchem Text passiert etwas?"
                  - "Hängen Ball, Fenster und Nachbar zusammen?"
                  - "Der erste Text ist eine Geschichte."
              - id: l1-f4
                type: ordering
                text: "Reizwörter: Zoo, Affe, Mütze. Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Reizwörter. Leg die Sätze der Geschichte in die richtige Reihenfolge."
                options: ["Der Wärter holte sie zurück, und alle lachten.", "Am Sonntag waren wir im Zoo.", "Plötzlich schnappte ein Affe nach meiner Mütze."]
                slot_count: 3
                answer: ["Am Sonntag waren wir im Zoo.", "Plötzlich schnappte ein Affe nach meiner Mütze.", "Der Wärter holte sie zurück, und alle lachten."]
                option_audio: false
                hints:
                  - "Welcher Satz ist die Einleitung?"
                  - "Was passiert mit der Mütze?"
                  - "Zoo, Affe schnappt Mütze, Wärter holt sie zurück."
              - id: l1-f5
                type: multiple_choice
                text: "Reizwörter: Schnee, Schlitten, Hund\n\nWas könnte in dieser Geschichte das Problem sein?"
                say: "Lies die Reizwörter. Was könnte in der Geschichte das Problem sein?"
                options: ["Der Hund rennt mit dem Schlitten davon.", "Der Schnee ist weiß.", "Der Hund hat ein Halsband."]
                answer: "Der Hund rennt mit dem Schlitten davon."
                hints:
                  - "Ein Problem bringt Spannung in die Geschichte."
                  - "Bei welchem Satz passiert etwas?"
                  - "Der Hund rennt mit dem Schlitten davon."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Reizwörter: Burg, Gespenst, Kerze. Tippe auf die drei Reizwörter im Text."
                say: "Lies die Geschichte. Tippe auf die drei Reizwörter."
                show: { drawn: letter-card, text: "In der alten Burg war es stockdunkel. Lea zündete eine Kerze an. Da schwebte ein kleines Gespenst um die Ecke." }
                spans: ["Burg", "Kerze", "Gespenst"]
                hints: ["Such die drei Wörter im Text."]
              - id: l1-s2
                type: multiple_choice
                text: "Reizwörter: Strand, Muschel, Krebs\n\nIm Urlaub lief Jonas am Strand entlang. Dort fand er eine riesige Muschel.\n\nKommen alle Reizwörter vor?"
                say: "Lies die Reizwörter und die Geschichte. Kommen alle Reizwörter vor?"
                options: ["Nein, Krebs fehlt.", "Ja, alle drei.", "Nein, Muschel fehlt."]
                answer: "Nein, Krebs fehlt."
                hints: ["Such jedes Reizwort im Text."]
              - id: l1-s3
                type: multiple_choice
                text: "Reizwörter: Kuchen, Geburtstag, Hund\n\nWelcher Text ist eine Geschichte?"
                say: "Lies die Reizwörter. Welcher Text ist eine echte Geschichte?"
                options: ["Für Omas Geburtstag backten wir einen Kuchen. Als wir kurz in den Garten gingen, sprang der Hund auf den Tisch. Der Kuchen war weg!", "Der Kuchen ist lecker. Heute ist Geburtstag. Der Hund ist braun."]
                answer: "Für Omas Geburtstag backten wir einen Kuchen. Als wir kurz in den Garten gingen, sprang der Hund auf den Tisch. Der Kuchen war weg!"
                option_audio: false
                hints: ["In welchem Text passiert etwas?"]
              - id: l1-s4
                type: ordering
                text: "Reizwörter: Wald, Pilz, Zwerg. Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Reizwörter. Leg die Sätze der Geschichte in die richtige Reihenfolge."
                options: ["Unter dem Hut saß ein winziger Zwerg und schimpfte.", "Im Herbst sammelte Paula im Wald Pilze.", "Sie wollte einen großen Pilz pflücken."]
                slot_count: 3
                answer: ["Im Herbst sammelte Paula im Wald Pilze.", "Sie wollte einen großen Pilz pflücken.", "Unter dem Hut saß ein winziger Zwerg und schimpfte."]
                option_audio: false
                hints: ["Wo und wann beginnt die Geschichte?"]
              - id: l1-s5
                type: multiple_choice
                text: "Reizwörter: Bus, Rucksack, Bahnhof\n\nWas könnte in dieser Geschichte das Problem sein?"
                say: "Lies die Reizwörter. Was könnte in der Geschichte das Problem sein?"
                options: ["Der Rucksack bleibt im Bus liegen.", "Der Bus ist gelb.", "Am Bahnhof gibt es Bänke."]
                answer: "Der Rucksack bleibt im Bus liegen."
                hints: ["Bei welchem Satz passiert etwas Schlimmes?"]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Reizwörter: Pferd, Wiese, Gewitter. Tippe auf die drei Reizwörter im Text."
                say: "Lies die Geschichte. Tippe auf die drei Reizwörter."
                show: { drawn: letter-card, text: "Das Pferd graste friedlich auf der Wiese. Doch dann kam ein Gewitter, und es lief davon." }
                spans: ["Pferd", "Wiese.", "Gewitter,"]
              - id: l1-n2
                type: multiple_choice
                text: "Reizwörter: Schule, Hamster, Pause\n\nIn der Pause sah Ali etwas Kleines unter der Bank. Es war der Hamster aus der Klasse 3a.\n\nKommen alle Reizwörter vor?"
                say: "Lies die Reizwörter und die Geschichte. Kommen alle Reizwörter vor?"
                options: ["Nein, Schule fehlt.", "Ja, alle drei.", "Nein, Hamster fehlt."]
                answer: "Nein, Schule fehlt."
              - id: l1-n3
                type: multiple_choice
                text: "Reizwörter: Baum, Drachen, Feuerwehr\n\nWelcher Text ist eine Geschichte?"
                say: "Lies die Reizwörter. Welcher Text ist eine echte Geschichte?"
                options: ["Mein Drachen blieb hoch oben im Baum hängen. Ich kam nicht heran. Zum Glück fuhr die Feuerwehr vorbei und holte ihn mit einer langen Leiter herunter.", "Der Baum ist hoch. Mein Drachen ist rot. Die Feuerwehr hat ein Auto."]
                answer: "Mein Drachen blieb hoch oben im Baum hängen. Ich kam nicht heran. Zum Glück fuhr die Feuerwehr vorbei und holte ihn mit einer langen Leiter herunter."
                option_audio: false
              - id: l1-n4
                type: ordering
                text: "Reizwörter: Schwimmbad, Brille, Taucher. Leg die Sätze in die richtige Reihenfolge."
                say: "Lies die Reizwörter. Leg die Sätze der Geschichte in die richtige Reihenfolge."
                options: ["Ein Taucher aus dem Schwimmverein holte sie vom Boden.", "Am Montag ging Opa mit uns ins Schwimmbad.", "Beim Springen fiel ihm seine Brille ins tiefe Becken."]
                slot_count: 3
                answer: ["Am Montag ging Opa mit uns ins Schwimmbad.", "Beim Springen fiel ihm seine Brille ins tiefe Becken.", "Ein Taucher aus dem Schwimmverein holte sie vom Boden."]
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Reizwörter: Zauberer, Hut, Kaninchen\n\nWas könnte in dieser Geschichte das Problem sein?"
                say: "Lies die Reizwörter. Was könnte in der Geschichte das Problem sein?"
                options: ["Das Kaninchen hüpft aus dem Hut und verschwindet im Publikum.", "Der Hut ist schwarz.", "Der Zauberer hat einen Bart."]
                answer: "Das Kaninchen hüpft aus dem Hut und verschwindet im Publikum."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Reizwörter: Insel, Boot, Schatz. Tippe auf die drei Reizwörter im Text."
            say: "Lies die Geschichte. Tippe auf die drei Reizwörter."
            show: { drawn: letter-card, text: "Mit einem kleinen Boot ruderten wir zur Insel. Dort gruben wir nach einem Schatz." }
            spans: ["Boot", "Insel.", "Schatz."]
          - id: l1-c2
            type: multiple_choice
            text: "Reizwörter: Eis, Sonne, Hose\n\nDie Sonne brannte. Ich kaufte mir ein Eis. Doch es tropfte mir auf die neue Hose.\n\nKommen alle Reizwörter vor?"
            say: "Lies die Reizwörter und die Geschichte. Kommen alle Reizwörter vor?"
            options: ["Ja, alle drei.", "Nein, Hose fehlt.", "Nein, Sonne fehlt."]
            answer: "Ja, alle drei."
          - id: l1-c3
            type: multiple_choice
            text: "Reizwörter: Zug, Fahrkarte, Schaffnerin\n\nWas könnte in dieser Geschichte das Problem sein?"
            say: "Lies die Reizwörter. Was könnte in der Geschichte das Problem sein?"
            options: ["Die Fahrkarte ist weg, und die Schaffnerin kommt.", "Der Zug hat viele Wagen.", "Die Schaffnerin hat eine Mütze."]
            answer: "Die Fahrkarte ist weg, und die Schaffnerin kommt."

  - n: 2
    title: { de: "Weiterschreiben und umschreiben", en: "Continuing and rewriting" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Reizwörter: Hut, Wind, Brücke\n\nMit einem Mal riss der Wind Opa den Hut vom Kopf. Er flog bis zur Brücke.\n\nKommen alle Reizwörter vor?"
            say: "Lies die Reizwörter und die Geschichte. Kommen alle Reizwörter vor?"
            options: ["Ja, alle drei.", "Nein, Brücke fehlt.", "Nein, Wind fehlt."]
            answer: "Ja, alle drei."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "In einer Reizwortgeschichte reicht es, wenn die Reizwörter irgendwo stehen. Sie müssen nicht zusammenhängen. Stimmt das?"
            say: "In einer Reizwortgeschichte reicht es, wenn die Reizwörter irgendwo stehen. Sie müssen nicht zusammenhängen. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Anfang: Leo und sein Hund Bruno spielten am Fluss. Plötzlich rutschte Bruno ins Wasser."
            say: "Wenn du eine Geschichte weiterschreibst, liest du den Anfang genau. Wer spielt mit? Wo sind sie? Was ist das Problem? In welcher Zeit wird erzählt?"
          - text: "Fortsetzung: Leo rannte am Ufer entlang und rief laut nach Bruno. Endlich paddelte Bruno zu ihm zurück."
            say: "Die Fortsetzung bleibt bei Leo und Bruno, am Fluss, in der Vergangenheit. Und sie löst das Problem."
          - text: "Umschreiben aus Brunos Sicht: Ich rutschte ins kalte Wasser. Ich paddelte, so schnell ich konnte."
            say: "Beim Umschreiben änderst du etwas mit Absicht: zum Beispiel das Ende oder wer erzählt. Hier erzählt Bruno selbst, mit ich."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Anfang: Emma wollte im Garten Tomaten pflücken. Da sah sie, dass eine Schnecke an der größten Tomate knabberte.\n\nWelche Fortsetzung passt?"
                say: "Lies den Anfang. Welche Fortsetzung passt?"
                options: ["Emma trug die Schnecke vorsichtig unter die Hecke und pflückte dann die Tomate.", "Am nächsten Tag fliegt Tim mit einer Rakete zum Mars.", "Emma geht in die Schule und schreibt einen Test."]
                answer: "Emma trug die Schnecke vorsichtig unter die Hecke und pflückte dann die Tomate."
                option_audio: false
                feedback:
                  "Am nächsten Tag fliegt Tim mit einer Rakete zum Mars.": "Hier ist alles neu: eine andere Figur, ein anderer Ort, eine andere Zeitform."
                hints:
                  - "Wer spielt mit, wo sind wir, was ist das Problem?"
                  - "Die Fortsetzung bleibt bei Emma, der Schnecke und im Garten."
                  - "Emma trug die Schnecke unter die Hecke."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Die Geschichte steht in der Vergangenheit. Welches Verb passt?"
                say: "Schreib die Geschichte weiter. Welches Verb passt?"
                frame: "Der Drache landete vor dem Schloss. Die Prinzessin _ ihm entgegen."
                options: ["lief", "läuft", "wird laufen"]
                answer: ["lief"]
                hints:
                  - "In welcher Zeit steht landete?"
                  - "Die Fortsetzung bleibt in der Vergangenheit."
                  - "lief."
              - id: l2-f3
                type: multiple_choice
                text: "„Der Hund sah die Wurst auf dem Tisch. Er sprang hoch und schnappte sie.“\n\nWie heißt der Satz, wenn der Hund selbst erzählt?"
                say: "Lies die Sätze. Der Hund soll selbst erzählen. Wie heißt es dann?"
                options: ["Ich sah die Wurst auf dem Tisch. Ich sprang hoch und schnappte sie.", "Er sah die Wurst auf dem Tisch. Er sprang hoch und schnappte sie.", "Du siehst die Wurst. Du springst hoch."]
                answer: "Ich sah die Wurst auf dem Tisch. Ich sprang hoch und schnappte sie."
                option_audio: false
                hints:
                  - "Wer selbst erzählt, sagt ich."
                  - "Die Zeitform bleibt gleich."
                  - "Ich sah die Wurst ... Ich sprang hoch ..."
              - id: l2-f4
                type: multiple_choice
                text: "Ende: Der Wolf fraß das Schwein und war satt.\n\nWelches neue Ende macht die Geschichte fröhlich?"
                say: "Lies das Ende. Du schreibst es um. Welches neue Ende macht die Geschichte fröhlich?"
                options: ["Der Wolf und das Schwein backten zusammen einen Kuchen und wurden Freunde.", "Der Wolf fraß das Schwein und war satt.", "Der Wolf fraß auch noch die Kuh."]
                answer: "Der Wolf und das Schwein backten zusammen einen Kuchen und wurden Freunde."
                option_audio: false
                hints:
                  - "Umschreiben heißt: etwas ändern."
                  - "Welches Ende ist fröhlich?"
                  - "Sie backen zusammen einen Kuchen."
              - id: l2-f5
                type: true_false
                text: "Anfang: Am Abend saß Familie Klein am Lagerfeuer.\nFortsetzung: Morgen geht Herr Schulz in die Stadt einkaufen.\n\nPasst die Fortsetzung zum Anfang?"
                say: "Lies den Anfang und die Fortsetzung. Passt die Fortsetzung zum Anfang?"
                answer: false
                hints:
                  - "Wer ist im Anfang, wer in der Fortsetzung?"
                  - "Ort, Zeit und Figur sind anders."
                  - "Nein, sie passt nicht."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Anfang: Mitten in der Nacht wachte Malte auf. Unter seinem Bett leuchtete etwas grün.\n\nWelche Fortsetzung passt?"
                say: "Lies den Anfang. Welche Fortsetzung passt?"
                options: ["Vorsichtig schaute Malte unter das Bett. Dort lag sein verlorenes Leuchtarmband.", "Malte isst zum Frühstück Müsli.", "Im Sommer fuhr Lea ans Meer."]
                answer: "Vorsichtig schaute Malte unter das Bett. Dort lag sein verlorenes Leuchtarmband."
                option_audio: false
                hints: ["Bleibt die Fortsetzung bei Malte und dem Licht?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Die Geschichte steht in der Vergangenheit. Welches Verb passt?"
                say: "Schreib die Geschichte weiter. Welches Verb passt?"
                frame: "Ida suchte überall nach ihrer Katze. Endlich _ sie sie im Schrank."
                options: ["fand", "findet", "finden"]
                answer: ["fand"]
                hints: ["Suchte ist Vergangenheit."]
              - id: l2-s3
                type: multiple_choice
                text: "„Das Mädchen streichelte die Katze. Die Katze schnurrte.“\n\nWie heißt es, wenn die Katze selbst erzählt?"
                say: "Lies die Sätze. Die Katze soll selbst erzählen. Wie heißt es dann?"
                options: ["Das Mädchen streichelte mich. Ich schnurrte.", "Ich streichelte die Katze. Die Katze schnurrte.", "Sie streichelte sie. Sie schnurrte."]
                answer: "Das Mädchen streichelte mich. Ich schnurrte."
                option_audio: false
                hints: ["Die Katze sagt ich und mich."]
              - id: l2-s4
                type: multiple_choice
                text: "Ende: Der Ritter verlor den Kampf gegen den Drachen und lief davon.\n\nWelches neue Ende passt zu einem mutigen Ritter?"
                say: "Lies das Ende. Du schreibst es um. Welches neue Ende passt zu einem mutigen Ritter?"
                options: ["Der Ritter stellte sich dem Drachen und befreite das Dorf.", "Der Ritter versteckte sich im Wald.", "Der Ritter verlor den Kampf und lief davon."]
                answer: "Der Ritter stellte sich dem Drachen und befreite das Dorf."
                option_audio: false
                hints: ["Was macht ein mutiger Ritter?"]
              - id: l2-s5
                type: true_false
                text: "Anfang: Paula baute mit Papa ein Vogelhaus.\nFortsetzung: Als es fertig war, hängten sie es an den Apfelbaum.\n\nPasst die Fortsetzung zum Anfang?"
                say: "Lies den Anfang und die Fortsetzung. Passt die Fortsetzung zum Anfang?"
                answer: true
                hints: ["Sind es die gleichen Figuren, und geht es um dasselbe?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Anfang: Der kleine Pinguin Pino wollte unbedingt fliegen lernen. Er kletterte auf einen hohen Eisberg.\n\nWelche Fortsetzung passt?"
                say: "Lies den Anfang. Welche Fortsetzung passt?"
                options: ["Pino breitete die Flügel aus und sprang. Platsch! Er landete im Meer und merkte, dass er schwimmen konnte wie ein Weltmeister.", "Die Katze schläft auf dem Sofa.", "Morgen hat Sara Geburtstag."]
                answer: "Pino breitete die Flügel aus und sprang. Platsch! Er landete im Meer und merkte, dass er schwimmen konnte wie ein Weltmeister."
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Die Geschichte steht in der Vergangenheit. Welches Verb passt?"
                say: "Schreib die Geschichte weiter. Welches Verb passt?"
                frame: "Der Zauberer schwang seinen Stab. Sofort _ ein Blitz durch den Raum."
                options: ["zuckte", "zuckt", "zucken"]
                answer: ["zuckte"]
              - id: l2-n3
                type: multiple_choice
