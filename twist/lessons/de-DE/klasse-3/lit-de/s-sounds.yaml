            say: "Der Kloß. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Kloß" }
            answer: true
          - id: l2-c6
            part: voiced-s
            type: fill_in_blank
            text: "s, ss oder ß?"
            say: "Die Maus. Was fehlt?"
            show: { object: mouse }
            frame: "die Mau_"
            options: ["s", "ss", "ß"]
            answer: ["s"]
          - id: l2-c7
            part: short-ss
            type: fill_in_blank
            text: "s, ss oder ß?"
            say: "Lies den Satz. Was fehlt?"
            frame: "Im Herbst sammeln wir im Wald Nü_e."
            options: ["ss", "ß", "s"]
            answer: ["ss"]
          - id: l2-c8
            part: long-sz
            type: fill_in_blank
