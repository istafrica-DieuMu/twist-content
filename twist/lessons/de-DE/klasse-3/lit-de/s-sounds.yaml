# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.s-sounds
skill: lit-de.spelling.s-sounds
curriculum: de-DE
language: de
title:
  de: s, ss oder ß?
  en: s, ss or ß?
summary: >
  Three ways to write an s sound. Lesson 1 tells the summende s (Hose,
  lesen) from the scharfe ss after a short Selbstlaut (Wasser, Kissen);
  lesson 2 adds ß after a long Selbstlaut or a Zwielaut (Fuß, gießen,
  beißen) against ss (Fluss, Nuss), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Besondere Laute, en: Special sounds }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling.double-consonants]
  also_practises: [lit-de.spelling.double-consonants, lit-de.spelling.short-long-vowels]
  vocabulary: { de: [summendes s, scharfes s, ß, kurzer Selbstlaut, langer Selbstlaut, Zwielaut] }
  forms: [picture, text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: voiced-s, what: { de: "summendes s, geschrieben mit s", en: "a voiced s, written s" } }
    - { id: short-ss, what: { de: "scharfes s nach kurzem Selbstlaut, geschrieben mit ss", en: "a sharp s after a short vowel, written ss" } }
    - { id: long-sz, what: { de: "scharfes s nach langem Selbstlaut oder Zwielaut, geschrieben mit ß", en: "a sharp s after a long vowel or a diphthong, written ß" } }
    - { id: mixed, what: { de: "s, ss und ß im selben Wort oder Satz", en: "s, ss and ß in one word or sentence" } }
  misconceptions:
    - id: ss-for-voiced
      what: Writes ss for a summendes s (Blusse, Vasse)
      addressed: lesson 1 Learn sets summend against scharf; every stage of lesson 1 has an s gap with an ss chip, l1-f4 shows Blusse, and l1-n5 asks whether the s in Rasen summt
    - id: ss-after-long
      what: Writes ss after a long vowel or a Zwielaut (heiss, Strasse, gross)
      addressed: lesson 2 Learn shows ß after long vowels and Zwielaute; every stage of lesson 2 has an ß gap, an ß choice with ss as an option, and l2-f4 and l2-n4 show heiss and Strasse
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Hose oder Wasser?", en: "Hose or Wasser?" }
    goal:
      de: "Hör, ob das s summt wie in Hose oder zischt wie in Wasser, und schreib s oder ss."
      en: "Hear whether the s buzzes like in Hose or hisses like in Wasser, and write s or ss."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Ist das a kurz oder lang?"
            say: "Hör zu. Ist das a kurz oder lang?"
            audio: { de: "Kater." }
            options: ["kurz", "lang"]
            keep_order: true
            answer: "lang"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "n oder nn?"
            say: "Die Sonne. Was fehlt?"
            frame: "So_e"
            options: ["nn", "n"]
            answer: ["nn"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Hose: summt oder zischt?"
            say: "Sag ganz langsam: Hose. Was glaubst du: Summt das s wie eine Biene, oder zischt es wie eine Schlange?"
            show: { object: trousers }
          - text: "Hose | Nase"
            say: "Es summt! Hör genau hin: Hose. Das s summt wie eine Biene. Ein summendes s schreibst du mit einem s."
            show: { object: trousers }
          - text: "Wasser | Tasse"
            say: "In Wasser summt das s nicht. Es klingt scharf und zischt. Das a davor ist kurz, und danach kommt kein anderer Mitlaut. Dann schreibst du ss, wie bei den doppelten Mitlauten."
            show: { object: water }
          - text: "summend: s | scharf nach kurzem Selbstlaut: ss"
            say: "Summt das s, schreibst du s. Zischt es nach einem kurzen Selbstlaut und folgt kein anderer Mitlaut, schreibst du ss."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "s oder ss?"
                say: "Der Hase. Was fehlt?"
                show: { object: rabbit }
                frame: "Ha_e"
                options: ["s", "ss"]
                answer: ["s"]
                hints:
                  - "Summt das s, oder zischt es?"
                  - "In Hase summt das s, und das a davor ist lang."
                  - "Ein s: Hase."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "s oder ss?"
                say: "Das Messer. Was fehlt?"
                show: { object: knife }
                frame: "Me_er"
                options: ["ss", "s"]
                answer: ["ss"]
                hints:
                  - "Summt das s, oder zischt es?"
                  - "Es zischt, und das e davor ist kurz."
                  - "Doppel-s: Messer."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Das Kissen. Welches Wort ist richtig geschrieben?"
                options: ["Kissen", "Kisen", "Kiessen"]
                answer: "Kissen"
                option_audio: false
                feedback:
                  Kiessen: "Kiessen klingt nach Kies. Ein Kissen voller Steinchen? Autsch! Das i ist kurz und das s zischt: Kissen mit ss."
                hints:
                  - "Ist das i kurz oder lang?"
                  - "Das i ist kurz, und das s zischt."
                  - "Kissen mit ss."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Die Bluse. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Blusse" }
                answer: false
                hints:
                  - "Summt das s in Bluse, oder zischt es?"
                  - "Es summt, und das u ist lang. Wie schreibst du ein summendes s?"
                  - "Nein. Richtig ist Bluse mit einem s."
              - id: l1-f5
                type: sorting
                text: "s oder ss?"
                say: "Hör dir jedes Wort an. Schreibt man es mit s wie Rose oder mit ss wie Tasse? Sortiere die Bilder."
                bins:
                  - { id: s, show: { object: rose }, say: "Mit s, wie Rose." }
                  - { id: ss, show: { object: cup }, say: "Mit ss, wie Tasse." }
                options:
                  - { object: ant, bin: s }
                  - { object: water, bin: ss }
                  - { object: cheese, bin: s }
                  - { object: knife, bin: ss }
                hints:
                  - "Hör bei jedem Wort: summt das s, oder zischt es?"
                  - "In Ameise und Käse summt das s."
                  - "Mit s: Ameise, Käse. Mit ss: Wasser, Messer."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "s oder ss?"
                say: "Die Klasse. Was fehlt?"
                frame: "Kla_e"
                options: ["ss", "s"]
                answer: ["ss"]
                hints: ["Ist das a kurz, und zischt das s?"]
              - id: l1-s2
                type: fill_in_blank
                text: "s oder ss?"
                say: "Lesen. Was fehlt?"
                frame: "le_en"
                options: ["s", "ss"]
                answer: ["s"]
                hints: ["Summt das s?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Kuss. Welches Wort ist richtig geschrieben?"
                options: ["Kuss", "Kus", "Kuß"]
                answer: "Kuss"
                option_audio: false
                hints: ["Das u ist kurz, und das s zischt."]
              - id: l1-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Der Sessel. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Sessel" }
                answer: true
                hints: ["Hör auf das s in der Mitte: Zischt es, und ist das e davor kurz?"]
              - id: l1-s5
                type: audio_choice
                text: "s oder ss?"
                say: "Hör zu. Schreibt man das Wort mit s oder mit ss?"
                audio: { de: "Die Rassel." }
                options: ["s", "ss"]
                keep_order: true
                answer: "ss"
                hints: ["Zischt das s, und ist das a davor kurz?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "s oder ss?"
                say: "Die Wiese. Was fehlt?"
                frame: "Wie_e"
                options: ["s", "ss"]
                answer: ["s"]
              - id: l1-n2
                type: fill_in_blank
                text: "s oder ss?"
                say: "Essen. Was fehlt?"
                frame: "e_en"
                options: ["ss", "s"]
                answer: ["ss"]
              - id: l1-n3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Die Schüssel. Welches Wort ist richtig geschrieben?"
                options: ["Schüssel", "Schüsel", "Schüßel"]
                answer: "Schüssel"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Müssen. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "müsen" }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "Summt das s, oder zischt es?"
                say: "Hör zu. Summt das s, oder zischt es?"
                audio: { de: "Der Rasen." }
                options: ["Es summt.", "Es zischt."]
                keep_order: true
                answer: "Es summt."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "s oder ss?"
            say: "Der Schlüssel. Was fehlt?"
            frame: "Schlü_el"
            options: ["ss", "s"]
            answer: ["ss"]
          - id: l1-c2
            type: fill_in_blank
            text: "s oder ss?"
            say: "Die Dose. Was fehlt?"
            frame: "Do_e"
            options: ["s", "ss"]
            answer: ["s"]
          - id: l1-c3
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Der Rüssel. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Rüsel" }
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "s oder ss?"
            say: "Lies den Satz. Was fehlt?"
            frame: "Das Gemü_e schmeckt heute besonders gut."
            options: ["s", "ss"]
            answer: ["s"]
          - id: l1-c5
            type: multiple_choice
            text: "Heute geht es mir schon _.\n\nWelches Wort ist richtig geschrieben?"
            say: "Besser. Heute geht es mir schon besser. Welches Wort ist richtig geschrieben?"
            options: ["besser", "beser", "bässer"]
            answer: "besser"
            option_audio: false
          - id: l1-c6
            type: audio_choice
            text: "s oder ss?"
            say: "Hör zu. Schreibt man das Wort mit s oder mit ss?"
            audio: { de: "Der Esel." }
            options: ["s", "ss"]
            keep_order: true
            answer: "s"

  - n: 2
    title: { de: "ss oder ß?", en: "ss or ß?" }
    goal:
      de: "Hör auf den Selbstlaut vor dem scharfen s. Kurz wie in Fluss heißt ss, lang wie in Fuß heißt ß."
      en: "Listen to the vowel before the sharp s. Short like in Fluss means ss, long like in Fuß means ß."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "s oder ss?"
            say: "Die Kasse. Was fehlt?"
            frame: "Ka_e"
            options: ["ss", "s"]
            answer: ["ss"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "s oder ss?"
            say: "Die Vase. Was fehlt?"
            frame: "Va_e"
            options: ["s", "ss"]
            answer: ["s"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Fuß: ss oder ß?"
            say: "Sag langsam: Fuß. Das s klingt scharf. Was glaubst du: Schreibt man Fuß mit ss oder mit ß? Hör auf das u."
            show: { object: foot }
          - text: "Fuß | gießen"
            say: "Mit ß! In Fuß klingt das s scharf. Das u davor ist lang. Nach einem langen Selbstlaut schreibst du ß, so auch bei gießen."
            show: { object: foot }
          - text: "beißen | Strauß | außen"
            say: "Auch nach einem Zwielaut steht ß: beißen, Strauß, außen."
          - text: "Wusstest du? Seit 2017 gibt es das ß auch als großen Buchstaben: STRAẞE."
            say: "Wusstest du? Lange gab es das ß nur als kleinen Buchstaben. Seit 2017 gibt es offiziell auch ein großes ß. Das brauchst du, wenn ein ganzes Wort in großen Buchstaben steht, zum Beispiel Straße auf einem Schild."
          - text: "Fluss: kurz, ss | Fuß: lang, ß"
            say: "Klingt das s scharf, frag dich: Ist der Selbstlaut davor kurz? Dann ss, wie in Fluss. Ist er lang oder ein Zwielaut? Dann ß, wie in Fuß. Am Wortende verlängerst du zuerst: Füße. Summt das s beim Verlängern, wie bei Gras und Gräser, schreibst du nur s."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "ss oder ß?"
                say: "Die Straße. Was fehlt?"
                frame: "Stra_e"
                options: ["ß", "ss"]
                answer: ["ß"]
                hints:
                  - "Das s klingt scharf. Ist der Selbstlaut davor kurz oder lang?"
                  - "Das a in Straße ist lang."
                  - "Nach einem langen Selbstlaut steht ß: Straße."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "ss oder ß?"
                say: "Die Nuss. Was fehlt?"
                frame: "Nu_"
                options: ["ss", "ß"]
                answer: ["ss"]
                hints:
                  - "Ist das u kurz oder lang?"
                  - "Das u in Nuss ist kurz."
                  - "Nach einem kurzen Selbstlaut steht ss: Nuss."
              - id: l2-f3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Groß. Welches Wort ist richtig geschrieben?"
                options: ["groß", "gross", "gros"]
                answer: "groß"
                option_audio: false
                hints:
                  - "Ist das o kurz oder lang?"
                  - "Das o ist lang, und das s klingt scharf."
                  - "Richtig ist groß mit ß."
              - id: l2-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Heiß. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "heiss" }
                answer: false
                hints:
                  - "Was steht vor dem s?"
                  - "Vor dem s steht der Zwielaut ei."
                  - "Nein. Nach ei schreibst du ß: heiß."
              - id: l2-f5
                type: audio_choice
                text: "ss oder ß?"
                say: "Hör zu. Schreibt man das Wort mit ss oder mit ß?"
                audio: { de: "Süß." }
                options: ["ss", "ß"]
                keep_order: true
                answer: "ß"
                hints:
                  - "Das s klingt scharf. Hör auf den Selbstlaut davor."
                  - "Sprich das Wort langsam. Ist das ü kurz oder lang?"
                  - "Das ü ist lang. Nach einem langen Selbstlaut steht ß: süß."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "ss oder ß?"
                say: "Der Gruß. Was fehlt?"
                frame: "Gru_"
                options: ["ß", "ss"]
                answer: ["ß"]
                hints: ["Ist das u kurz oder lang?"]
              - id: l2-s2
                type: fill_in_blank
                text: "ss oder ß?"
                say: "Das Schloss. Was fehlt?"
                frame: "Schlo_"
                options: ["ss", "ß"]
                answer: ["ss"]
                hints: ["Ist das o kurz oder lang?"]
              - id: l2-s3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Draußen. Welches Wort ist richtig geschrieben?"
                options: ["draußen", "drausen", "draussen"]
                answer: "draußen"
                option_audio: false
                hints: ["Vor dem s steht ein Zwielaut."]
              - id: l2-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Nass. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "nass" }
                answer: true
                hints: ["Ist das a kurz oder lang?"]
              - id: l2-s5
                type: audio_choice
                text: "ss oder ß?"
                say: "Hör zu. Schreibt man das Wort mit ss oder mit ß?"
                audio: { de: "Die Flosse." }
                show: { object: fish }
                options: ["ss", "ß"]
                keep_order: true
                answer: "ss"
                hints: ["Ist das o vor dem s kurz oder lang?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "ss oder ß?"
                say: "Das Floß. Was fehlt?"
                frame: "Flo_"
                options: ["ß", "ss"]
                answer: ["ß"]
              - id: l2-n2
                type: fill_in_blank
                text: "ss oder ß?"
                say: "Er muss. Was fehlt?"
                frame: "er mu_"
                options: ["ss", "ß"]
                answer: ["ss"]
              - id: l2-n3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Weiß. Welches Wort ist richtig geschrieben?"
                options: ["weiß", "weiss", "weis"]
                answer: "weiß"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Die Straße. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Strasse" }
                answer: false
              - id: l2-n5
                type: audio_choice
                text: "ss oder ß?"
                say: "Hör zu. Schreibt man das Wort mit ss oder mit ß?"
                audio: { de: "Wissen." }
                options: ["ss", "ß"]
                keep_order: true
                answer: "ss"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: long-sz
            type: fill_in_blank
            text: "s, ss oder ß?"
            say: "Die Soße. Was fehlt?"
            frame: "So_e"
            options: ["ß", "ss", "s"]
            answer: ["ß"]
          - id: l2-c2
            part: short-ss
            type: fill_in_blank
            text: "s, ss oder ß?"
            say: "Das Fass. Was fehlt?"
            frame: "Fa_"
            options: ["ss", "ß", "s"]
            answer: ["ss"]
          - id: l2-c3
            part: voiced-s
            type: fill_in_blank
            text: "s, ss oder ß?"
            say: "Der Besen. Was fehlt?"
            frame: "Be_en"
            options: ["s", "ss", "ß"]
            answer: ["s"]
          - id: l2-c4
            part: long-sz
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Fleißig. Welches Wort ist richtig geschrieben?"
            options: ["fleißig", "fleissig", "fleisig"]
            answer: "fleißig"
