# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.dictionary
skill: lit-de.spelling-strategies.dictionary
curriculum: de-DE
language: de
title:
  de: Im Wörterbuch nachschlagen
  en: Using a dictionary
summary: >
  Finding a word in the Wörterbuch quickly. Lesson 1 finds the part of
  the book (vorne, in der Mitte, hinten) and uses the Leitwörter at the
  top of a page; lesson 2 turns a word into the form the Wörterbuch lists
  (Bäume to Baum, er lief to laufen, größer to groß), and ends with the
  skill check.
metadata:
  year: klasse-3
  topic: { de: Wörterbuch, en: Dictionary }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.letters.alphabet-order, lit-de.verbs.base-form]
  also_practises: [lit-de.letters.alphabet-order, lit-de.verbs.base-form, lit-de.nouns.plural]
  vocabulary: { de: [Wörterbuch, nachschlagen, Leitwort, Grundform, Einzahl] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: book-part, what: { de: "den Teil des Wörterbuchs finden (vorne, Mitte, hinten)", en: "finding the part of the dictionary (front, middle, back)" } }
    - { id: guide-words, what: { de: mit den Leitwörtern die Seite finden, en: finding the page with the guide words } }
    - { id: noun-singular, what: { de: Nomen in der Einzahl nachschlagen, en: looking up nouns in the singular } }
    - { id: base-form, what: { de: Verben und Adjektive in der Grundform nachschlagen, en: looking up verbs and adjectives in their base form } }
  misconceptions:
    - id: look-up-as-written
      what: Looks a word up in the form it has in the text (Mäuse, er lief, kälter)
      addressed: lesson 2 Learn turns all three kinds into their Grundform; every stage of lesson 2 has a Nomen, a Verb and an Adjektiv to look up, with an inflected form as an option
    - id: guide-words-ignored
      what: Does not use the Leitwörter, or reads only the first letter
      addressed: lesson 1 Learn shows how the Leitwörter mark the first and last word of a page; every stage of lesson 1 has a Leitwörter task that needs the second or third letter
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Schnell finden", en: "Finding words fast" }
    goal:
      de: "Finde Wörter schnell im Wörterbuch. Schau auf den Teil des Buches und die Leitwörter oben auf der Seite."
      en: "Find words fast in the dictionary. Look at the right part of the book and the guide words at the top."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Ordne nach dem ABC."
            say: "Ordne die Wörter nach dem ABC."
            options: ["Hund", "Esel", "Maus"]
            slot_count: 3
            answer: ["Esel", "Hund", "Maus"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Buchstabe kommt im ABC vor R?"
            say: "Welcher Buchstabe kommt im ABC vor R?"
            options: ["Q", "S", "P"]
            answer: "Q"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Krokodil: vorne, Mitte oder hinten?"
            say: "Du suchst das Wort Krokodil im Wörterbuch. Was glaubst du: Schlägst du das Buch vorne, in der Mitte oder hinten auf?"
            show: { object: crocodile }
          - text: "vorne: A bis G | Mitte: H bis P | hinten: Q bis Z"
            say: "In der Mitte! Das Wörterbuch ist nach dem ABC geordnet. Wörter mit A bis G findest du vorne, mit H bis P in der Mitte und mit Q bis Z hinten."
          - text: "Hafen ... Hase"
            say: "Oben auf jeder Seite stehen zwei Leitwörter: das erste und das letzte Wort der Seite. Stehen dort Hafen und Hase, findest du dazwischen alle Wörter von Hafen bis Hase, zum Beispiel Hals."
          - text: "Teil | Buchstabe | Leitwörter"
            say: "So findest du ein Wort schnell: Erst suchst du den Teil des Buches, dann den Anfangsbuchstaben, dann die Leitwörter."
          - text: "Wusstest du? Am Wörterbuch der Brüder Grimm wurde über 120 Jahre lang geschrieben."
            say: "Wusstest du? Die Brüder Grimm haben 1838 mit einem riesigen Wörterbuch angefangen. Fertig war es erst 1961, über hundertzwanzig Jahre später. Da lebten die beiden schon lange nicht mehr, andere hatten weitergeschrieben. Von A bis Z, nach dem ABC."
            show: { object: book }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wo suchst du Zebra im Wörterbuch?"
                say: "Zebra. Wo suchst du das Wort im Wörterbuch?"
                show: { object: zebra }
                options: ["vorne", "in der Mitte", "hinten"]
                keep_order: true
                answer: "hinten"
                hints:
                  - "Mit welchem Buchstaben fängt Zebra an?"
                  - "Z ist der letzte Buchstabe im ABC."
                  - "hinten."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Leitwörter: Hafen und Hase. Steht Hand auf dieser Seite?"
                say: "Oben stehen die Leitwörter Hafen und Hase. Steht Hand auf dieser Seite?"
                answer: true
                hints:
                  - "Kommt Hand nach Hafen und vor Hase?"
                  - "Haf, Han, Has: Das n liegt zwischen f und s."
                  - "Ja, Hand steht auf dieser Seite."
              - id: l1-f3
                type: multiple_choice
                text: "Wo suchst du Apfel im Wörterbuch?"
                say: "Apfel. Wo suchst du das Wort im Wörterbuch?"
                options: ["vorne", "in der Mitte", "hinten"]
                keep_order: true
                answer: "vorne"
                hints:
                  - "Mit welchem Buchstaben fängt Apfel an?"
                  - "A ist der erste Buchstabe im ABC."
                  - "vorne."
              - id: l1-f4
                type: true_false
                text: "Leitwörter: Maus und Meer. Steht Milch auf dieser Seite?"
                say: "Oben stehen die Leitwörter Maus und Meer. Steht Milch auf dieser Seite?"
                answer: false
                hints:
                  - "Schau auf den zweiten Buchstaben von Maus, Meer und Milch."
                  - "Mi kommt nach Me."
                  - "Nein. Milch steht weiter hinten."
              - id: l1-f5
                type: multiple_choice
                text: "Wo suchst du Kerze im Wörterbuch?"
                say: "Kerze. Wo suchst du das Wort im Wörterbuch?"
                show: { object: candle }
                options: ["vorne", "in der Mitte", "hinten"]
                keep_order: true
                answer: "in der Mitte"
                hints:
                  - "Mit welchem Buchstaben fängt Kerze an?"
                  - "K liegt zwischen H und P."
                  - "in der Mitte."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wo suchst du Tasche im Wörterbuch?"
                say: "Tasche. Wo suchst du das Wort im Wörterbuch?"
                options: ["vorne", "in der Mitte", "hinten"]
                keep_order: true
                answer: "hinten"
                hints: ["Liegt T zwischen Q und Z?"]
              - id: l1-s2
                type: true_false
                text: "Leitwörter: Ball und Baum. Steht Bank auf dieser Seite?"
                say: "Oben stehen die Leitwörter Ball und Baum. Steht Bank auf dieser Seite?"
                answer: true
                hints: ["Schau auf den dritten Buchstaben: l, n, u."]
              - id: l1-s3
                type: multiple_choice
                text: "Wo suchst du Esel im Wörterbuch?"
                say: "Esel. Wo suchst du das Wort im Wörterbuch?"
                options: ["vorne", "in der Mitte", "hinten"]
                keep_order: true
                answer: "vorne"
                hints: ["Liegt E zwischen A und G?"]
              - id: l1-s4
                type: true_false
                text: "Leitwörter: Rose und Rücken. Steht Rabe auf dieser Seite?"
                say: "Oben stehen die Leitwörter Rose und Rücken. Steht Rabe auf dieser Seite?"
                answer: false
                hints: ["Vergleiche den zweiten Buchstaben: o, ü und a."]
              - id: l1-s5
                type: multiple_choice
                text: "Wo suchst du Nase im Wörterbuch?"
                say: "Nase. Wo suchst du das Wort im Wörterbuch?"
                show: { object: nose }
                options: ["vorne", "in der Mitte", "hinten"]
                keep_order: true
                answer: "in der Mitte"
                hints: ["Liegt N zwischen H und P?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wo suchst du Wolke im Wörterbuch?"
                say: "Wolke. Wo suchst du das Wort im Wörterbuch?"
                show: { object: cloud }
                options: ["vorne", "in der Mitte", "hinten"]
                keep_order: true
                answer: "hinten"
              - id: l1-n2
                type: true_false
                text: "Leitwörter: Kino und Kirsche. Steht Kiste auf dieser Seite?"
                say: "Oben stehen die Leitwörter Kino und Kirsche. Steht Kiste auf dieser Seite?"
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Wo suchst du Becher im Wörterbuch?"
                say: "Becher. Wo suchst du das Wort im Wörterbuch?"
                options: ["vorne", "in der Mitte", "hinten"]
                keep_order: true
                answer: "vorne"
              - id: l1-n4
                type: true_false
                text: "Leitwörter: Sonne und Spinne. Steht Sorte auf dieser Seite?"
                say: "Oben stehen die Leitwörter Sonne und Spinne. Steht Sorte auf dieser Seite?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Wo suchst du Insel im Wörterbuch?"
                say: "Insel. Wo suchst du das Wort im Wörterbuch?"
                options: ["vorne", "in der Mitte", "hinten"]
                keep_order: true
                answer: "in der Mitte"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wo suchst du Fuchs im Wörterbuch?"
            say: "Fuchs. Wo suchst du das Wort im Wörterbuch?"
            show: { object: fox }
            options: ["vorne", "in der Mitte", "hinten"]
            keep_order: true
            answer: "vorne"
          - id: l1-c2
            type: true_false
            text: "Leitwörter: Tante und Teller. Steht Tasse auf dieser Seite?"
            say: "Oben stehen die Leitwörter Tante und Teller. Steht Tasse auf dieser Seite?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wo suchst du Pilz im Wörterbuch?"
            say: "Pilz. Wo suchst du das Wort im Wörterbuch?"
            options: ["vorne", "in der Mitte", "hinten"]
            keep_order: true
            answer: "in der Mitte"
          - id: l1-c4
            type: multiple_choice
            text: "Welches Wort findest du vorne im Wörterbuch?"
            say: "Welches Wort findest du vorne im Wörterbuch?"
            options: ["Delfin", "Rakete", "Nudel"]
            answer: "Delfin"
          - id: l1-c5
            type: multiple_choice
            text: "Leitwörter: Brief und Brot. Welches Wort steht auf dieser Seite?"
            say: "Oben stehen die Leitwörter Brief und Brot. Welches Wort steht auf dieser Seite?"
            options: ["Brille", "Brei", "Brust"]
            answer: "Brille"
          - id: l1-c6
            type: true_false
            text: "Leitwörter: Ente und Erbse. Steht Esel auf dieser Seite?"
            say: "Oben stehen die Leitwörter Ente und Erbse. Steht Esel auf dieser Seite?"
            answer: false

  - n: 2
    title: { de: "Die Grundform suchen", en: "Looking up the base form" }
    goal:
      de: "Bring ein Wort in die Grundform, bevor du es nachschlägst, so wie Bäume zu Baum."
      en: "Change a word to its base form before you look it up, like Bäume to Baum."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo suchst du Ziege im Wörterbuch?"
            say: "Ziege. Wo suchst du das Wort im Wörterbuch?"
            options: ["vorne", "in der Mitte", "hinten"]
            keep_order: true
            answer: "hinten"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist die Grundform von „er läuft“?"
            say: "Er läuft. Wie heißt die Grundform?"
            options: ["laufen", "läufen", "lauft"]
            answer: "laufen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Bäume oder Baum?"
            say: "Du willst wissen, wie man Bäume schreibt. Was glaubst du: Steht im Wörterbuch Bäume oder Baum?"
            show: { object: tree, count: 3 }
          - text: "Bäume → Baum"
            say: "Baum! Im Wörterbuch stehen Nomen in der Einzahl. Suchst du Bäume, schlägst du Baum nach."
          - text: "er lief → laufen"
            say: "Verben stehen in der Grundform. Er lief findest du unter laufen."
          - text: "größer → groß"
            say: "Auch Adjektive stehen in der Grundform. Größer und am größten findest du unter groß."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Unter welchem Wort findest du Mäuse?"
                say: "Mäuse. Unter welchem Wort findest du es im Wörterbuch?"
                show: { object: mouse, count: 3 }
                options: ["Maus", "Mäuschen", "Mäuse"]
                answer: "Maus"
                hints:
                  - "Nomen stehen in der Einzahl."
                  - "Viele Mäuse. Und wenn es nur eine ist?"
                  - "Maus."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Unter welchem Wort findest du „sie sang“?"
                say: "Sie sang. Unter welchem Wort findest du es im Wörterbuch?"
                options: ["singen", "sangen", "der Sänger"]
                answer: "singen"
                hints:
                  - "Verben stehen in der Grundform."
                  - "Heute singt sie, gestern sang sie. Die Grundform ist …"
                  - "singen."
              - id: l2-f3
                type: multiple_choice
                text: "Unter welchem Wort findest du „kälter“?"
                say: "Kälter. Unter welchem Wort findest du es im Wörterbuch?"
                options: ["kalt", "die Kälte", "kälter"]
                answer: "kalt"
                hints:
                  - "Adjektive stehen in der Grundform."
                  - "Kälter, am kältesten. Wie heißt das Wort ohne er am Ende?"
                  - "kalt."
              - id: l2-f4
                type: true_false
                text: "Findest du Kinder unter Kind?"
                say: "Kinder. Findest du das Wort unter Kind?"
                answer: true
                hints:
                  - "Nomen stehen in der Einzahl."
                  - "Viele Kinder. Und wenn es nur eins ist?"
                  - "Ja, unter Kind."
              - id: l2-f5
                type: multiple_choice
                text: "Unter welchem Wort findest du „wir gingen“?"
                say: "Wir gingen. Unter welchem Wort findest du es im Wörterbuch?"
                options: ["gehen", "gingen", "der Gang"]
                answer: "gehen"
                feedback:
                  "der Gang": "Der Gang? Da bist du im Wörterbuch in den falschen Flur gelaufen! Wir gingen kommt von gehen."
                hints:
                  - "Verben stehen in der Grundform."
                  - "Gestern gingen wir, heute geht Tom. Die Grundform ist …"
                  - "gehen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Unter welchem Wort findest du Häuser?"
                say: "Häuser. Unter welchem Wort findest du es im Wörterbuch?"
                show: { object: house, count: 3 }
                options: ["Haus", "Häuschen", "Häuser"]
                answer: "Haus"
                hints: ["Nomen stehen in der Einzahl."]
              - id: l2-s2
                type: multiple_choice
                text: "Unter welchem Wort findest du „er fuhr“?"
                say: "Er fuhr. Unter welchem Wort findest du es im Wörterbuch?"
                options: ["fahren", "fuhren", "der Fahrer"]
                answer: "fahren"
                hints: ["Verben stehen in der Grundform."]
              - id: l2-s3
                type: true_false
                text: "Findest du „am schnellsten“ unter „schnell“?"
                say: "Am schnellsten. Findest du das Wort unter schnell?"
                answer: true
                hints: ["Adjektive stehen in der Grundform."]
              - id: l2-s4
                type: true_false
                text: "Findest du „er nahm“ unter „nahmen“?"
                say: "Er nahm. Findest du das Wort unter nahmen?"
                answer: false
                hints: ["Wie heißt die Grundform? Heute nimmt er …"]
              - id: l2-s5
                type: multiple_choice
                text: "Unter welchem Wort findest du „sie schrieb“?"
                say: "Sie schrieb. Unter welchem Wort findest du es im Wörterbuch?"
                options: ["schreiben", "schrieben", "die Schrift"]
                answer: "schreiben"
                hints: ["Verben stehen in der Grundform."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Unter welchem Wort findest du Füße?"
                say: "Füße. Unter welchem Wort findest du es im Wörterbuch?"
                show: { object: foot, count: 2 }
                options: ["Fuß", "Füßchen", "Füße"]
                answer: "Fuß"
              - id: l2-n2
                type: multiple_choice
                text: "Unter welchem Wort findest du „er trank“?"
                say: "Er trank. Unter welchem Wort findest du es im Wörterbuch?"
                options: ["trinken", "tranken", "das Getränk"]
                answer: "trinken"
              - id: l2-n3
                type: text_input
                keyboard: letters
                text: "Im Text steht „länger“. Unter welchem Wort schlägst du nach? Schreib es."
                say: "Im Text steht länger. Unter welchem Wort schlägst du im Wörterbuch nach? Schreib es."
                answer: "lang"
              - id: l2-n4
                type: true_false
                text: "Findest du „sie aß“ unter „essen“?"
                say: "Sie aß. Findest du das Wort unter essen?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Unter welchem Wort findest du Bücher?"
                say: "Bücher. Unter welchem Wort findest du es im Wörterbuch?"
                show: { object: book, count: 3 }
                options: ["Buch", "die Bücherei", "Bücher"]
                answer: "Buch"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: book-part
            type: multiple_choice
            text: "Wo suchst du Regen im Wörterbuch?"
            say: "Regen. Wo suchst du das Wort im Wörterbuch?"
            options: ["vorne", "in der Mitte", "hinten"]
            keep_order: true
            answer: "hinten"
          - id: l2-c2
            part: guide-words
            type: true_false
            text: "Leitwörter: Hund und Hut. Steht Huhn auf dieser Seite?"
            say: "Oben stehen die Leitwörter Hund und Hut. Steht Huhn auf dieser Seite?"
            answer: false
          - id: l2-c3
            part: base-form
            type: multiple_choice
            text: "Unter welchem Wort findest du „er sah“?"
            say: "Er sah. Unter welchem Wort findest du es im Wörterbuch?"
            options: ["sehen", "sahen", "die Sicht"]
            answer: "sehen"
          - id: l2-c4
            part: noun-singular
            type: multiple_choice
            text: "Unter welchem Wort findest du Nüsse?"
            say: "Nüsse. Unter welchem Wort findest du es im Wörterbuch?"
            options: ["Nuss", "Nüsschen", "Nüsse"]
            answer: "Nuss"
          - id: l2-c5
            part: base-form
            type: multiple_choice
            text: "Unter welchem Wort findest du „wärmer“?"
            say: "Wärmer. Unter welchem Wort findest du es im Wörterbuch?"
            options: ["warm", "die Wärme", "wärmen"]
            answer: "warm"
          - id: l2-c6
            part: book-part
            type: sorting
            text: "Wo stehen die Wörter im Wörterbuch? Sortiere."
            say: "Lies die Wörter. Wo stehen sie im Wörterbuch: vorne, in der Mitte oder hinten? Sortiere."
            bins:
              - { id: front, show: { text: "vorne" }, say: "vorne" }
              - { id: middle, show: { text: "in der Mitte" }, say: "in der Mitte" }
              - { id: back, show: { text: "hinten" }, say: "hinten" }
            options:
              - { text: "Dach", bin: front }
              - { text: "Lampe", bin: middle }
              - { text: "Oma", bin: middle }
              - { text: "Turm", bin: back }
          - id: l2-c7
            part: book-part
            type: multiple_choice
            text: "Welches Wort findest du ganz hinten im Wörterbuch?"
            say: "Welches Wort findest du ganz hinten im Wörterbuch?"
            options: ["Zucker", "Ente", "Kamel"]
            answer: "Zucker"
          - id: l2-c8
            part: book-part
            type: multiple_choice
            text: "Welches Wort findest du in der Mitte des Wörterbuchs?"
            say: "Welches Wort findest du in der Mitte des Wörterbuchs?"
            options: ["Laterne", "Auto", "Wurst"]
            answer: "Laterne"
          - id: l2-c9
            part: book-part
            type: true_false
            text: "Stimmt das? Wörter mit O findest du in der Mitte des Wörterbuchs."
            say: "Stimmt das? Wörter mit O findest du in der Mitte des Wörterbuchs."
            answer: true
          - id: l2-c10
            part: guide-words
            type: multiple_choice
            text: "Leitwörter: Garten und Geist. Welches Wort steht auf dieser Seite?"
            say: "Oben stehen die Leitwörter Garten und Geist. Welches Wort steht auf dieser Seite?"
            options: ["Gast", "Gans", "Gold"]
            answer: "Gast"
          - id: l2-c11
            part: guide-words
            type: multiple_choice
            text: "Du suchst Pferd. Auf welcher Seite steht es?"
            say: "Du suchst das Wort Pferd. Auf welcher Seite steht es?"
            options: ["Leitwörter: Pfanne und Pflaume", "Leitwörter: Papier und Pause", "Leitwörter: Pinsel und Platz"]
            answer: "Leitwörter: Pfanne und Pflaume"
          - id: l2-c12
            part: guide-words
            type: ordering
            text: "Ordne die Wörter so, wie sie im Wörterbuch stehen."
            say: "Ordne die Wörter so, wie sie im Wörterbuch stehen."
            options: ["Schule", "Schaf", "Schwein", "Schirm"]
            slot_count: 4
            answer: ["Schaf", "Schirm", "Schule", "Schwein"]
          - id: l2-c13
            part: guide-words
            type: multiple_choice
            text: "Leitwörter: Wagen und Wasser. Welches Wort steht nicht auf dieser Seite?"
            say: "Oben stehen die Leitwörter Wagen und Wasser. Welches Wort steht nicht auf dieser Seite?"
            options: ["Waage", "Wand", "Wanne"]
            answer: "Waage"
          - id: l2-c14
            part: noun-singular
            type: multiple_choice
            text: "Im Text steht: „Auf dem Dach sitzen zwei Störche.“ Welches Wort schlägst du nach?"
            say: "Auf dem Dach sitzen zwei Störche. Welches Wort schlägst du im Wörterbuch nach, wenn du Störche suchst?"
            options: ["Storch", "Störche", "Storche"]
            answer: "Storch"
