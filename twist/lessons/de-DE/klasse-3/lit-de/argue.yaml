# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.argue
skill: lit-de.speaking.argue
curriculum: de-DE
language: de
title:
  de: Meinung sagen und begründen
  en: Giving an opinion with a reason
summary: >
  Saying what you think and why, and asking politely. Lesson 1 tells an
  opinion from its reason, finds the reason that really supports an
  opinion and builds sentences with Ich finde … , weil …; lesson 2 asks
  politely (bitte, könntest du, würden Sie), chooses du or Sie, adds a
  reason to a request, and ends with the skill check. The speak tasks run
  as the record-and-compare fallback and are never scored: saying an
  opinion and a request aloud is covered by Practise, and the skill check
  marks what a screen can mark (opinion or reason, the reason that fits,
  the polite request, du or Sie).
metadata:
  year: klasse-3
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.speaking.describe-explain]
  also_practises: [lit-de.sentences.conjunctions]
  vocabulary: { de: [Meinung, Grund, begründen, weil, höflich, Bitte, könntest, würden Sie] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: opinion-reason, what: { de: Meinung und Grund unterscheiden, en: telling an opinion from its reason } }
    - { id: good-reason, what: { de: "einen Grund wählen, der die Meinung wirklich stützt, und ihn mit weil anschließen", en: "choosing a reason that really supports the opinion and joining it with weil" } }
    - { id: polite, what: { de: höflich um etwas bitten, en: asking politely for something } }
    - { id: du-sie, what: { de: du oder Sie wählen, en: choosing du or Sie } }
  misconceptions:
    - id: reason-repeats-opinion
      what: Gives the opinion again as its reason (Ich mag Pizza, weil ich Pizza mag)
      addressed: "lesson 1 Learn shows a reason that only repeats the opinion; l1-f2, l1-s2, l1-n2 and l2-c2 offer such a reason, with feedback on l1-f2"
    - id: demand-not-request
      what: Asks for something as an order, or speaks to an adult with du
      addressed: "lesson 2 Learn turns an order into a request; every stage of lesson 2 has a polite-request task and a du-or-Sie task, with feedback on l2-f1"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ich finde …, weil …", en: "I think, because …" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist eine Lupe? Welche Erklärung versteht man am besten?"
            say: "Was ist eine Lupe? Welche Erklärung versteht man am besten?"
            options: ["Ein Glas, durch das kleine Dinge groß aussehen.", "Ein Ding.", "Etwas, das ich habe."]
            answer: "Ein Glas, durch das kleine Dinge groß aussehen."
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Bindewort passt in die Lücke?"
            frame: "Ich bleibe drinnen, _ es regnet."
            options: ["weil", "und", "oder"]
            answer: ["weil"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Meinung: Ich finde Hunde toll.\nGrund: Sie spielen gern mit mir."
            say: "Eine Meinung sagt, was du denkst. Ein Grund sagt, warum du das denkst. Mit einem Grund können andere deine Meinung besser verstehen."
          - text: "Ich finde Hunde toll, weil sie gern mit mir spielen."
            say: "Mit weil verbindest du Meinung und Grund zu einem Satz. Nach weil steht das Verb am Ende: weil sie gern mit mir spielen."
          - text: "Ich finde Hunde toll, weil ich sie toll finde."
            say: "Achtung: Das ist kein Grund. Hier wird die Meinung nur wiederholt. Ein guter Grund sagt etwas Neues."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Meinung oder Grund?"
                say: "Sortiere: Ist das eine Meinung oder ein Grund?"
                bins:
                  - { id: opinion, show: { text: "Meinung" }, say: "Meinung" }
                  - { id: reason, show: { text: "Grund" }, say: "Grund" }
                options:
                  - { text: "Ich finde den Sommer am schönsten.", bin: opinion }
                  - { text: "Dann kann ich im See baden.", bin: reason }
                  - { text: "Mathe ist mein Lieblingsfach.", bin: opinion }
                  - { text: "Dabei kann ich knifflige Rätsel lösen.", bin: reason }
                option_audio: false
                hints:
                  - "Eine Meinung sagt, was jemand denkt. Ein Grund sagt, warum."
                  - "Frag bei jedem Satz: Sagt er, was jemand denkt? Oder sagt er, warum?"
                  - "Die Sätze über den Sommer und Mathe sind Meinungen. Baden und Rätsel lösen sind Gründe."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ich finde Fahrradfahren toll, weil …\n\nWelcher Grund passt am besten?"
                say: "Lies den Satzanfang. Welcher Grund passt am besten?"
                options: ["… ich damit schnell bei meinen Freunden bin.", "… ich Fahrradfahren toll finde.", "… mein Rad blau ist."]
                answer: "… ich damit schnell bei meinen Freunden bin."
                feedback:
                  "… ich Fahrradfahren toll finde.": "Das wiederholt nur die Meinung. Ein Grund sagt etwas Neues."
                hints:
                  - "Ein guter Grund erklärt, warum."
                  - "Die Farbe des Fahrrads erklärt nicht, warum Fahrradfahren toll ist."
                  - "… weil ich damit schnell bei meinen Freunden bin."
              - id: l1-f3
                type: ordering
                text: "Bau den Satz."
                say: "Bau einen Satz mit Meinung und Grund. Denk daran: Nach weil steht das Verb am Ende."
                options: ["weil", "Ich mag den Herbst,", "bunt sind.", "die Blätter"]
                slot_count: 4
                answer: ["Ich mag den Herbst,", "weil", "die Blätter", "bunt sind."]
                option_audio: false
                hints:
                  - "Zuerst kommt die Meinung, dann weil."
                  - "Nach weil: Wer ist bunt? Die Blätter."
                  - "Ich mag den Herbst, weil die Blätter bunt sind."
              - id: l1-f4
                type: true_false
                text: "„Ich finde, wir sollten mehr Sport machen, weil Bewegung gesund ist.“ Ist das eine Meinung mit einem Grund?"
                say: "Lies den Satz. Ist das eine Meinung mit einem Grund?"
                answer: true
                hints:
                  - "Suche zuerst die Meinung, dann den Grund."
                  - "Meinung: mehr Sport. Und nach weil?"
                  - "Ja. Der Grund ist: Bewegung ist gesund."
              - id: l1-f5
                type: speak
                text: "Ich finde Bücher toll, weil ich beim Lesen in andere Welten reisen kann."
                say: "Sag deine Meinung mit einem Grund. Sprich deutlich. Dann hörst du dich und das Vorbild."
                expected_text: "Ich finde Bücher toll, weil ich beim Lesen in andere Welten reisen kann."
                hints:
                  - "Mach vor weil eine kleine Pause."
                  - "Sprich so, dass alle dich verstehen."
                  - "Hör das Vorbild an und sag es noch einmal."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Meinung oder Grund?"
                say: "Sortiere: Ist das eine Meinung oder ein Grund?"
                bins:
                  - { id: opinion, show: { text: "Meinung" }, say: "Meinung" }
                  - { id: reason, show: { text: "Grund" }, say: "Grund" }
                options:
                  - { text: "Katzen sind die besten Haustiere.", bin: opinion }
                  - { text: "Sie schnurren, wenn man sie streichelt.", bin: reason }
                  - { text: "Ich finde Schwimmen besser als Laufen.", bin: opinion }
                  - { text: "Im Wasser wird mir nicht so heiß.", bin: reason }
                option_audio: false
                hints: ["Welcher Satz sagt, warum?"]
              - id: l1-s2
                type: multiple_choice
                text: "Ich finde, wir sollten einen Ausflug in den Zoo machen, weil …\n\nWelcher Grund passt am besten?"
                say: "Lies den Satzanfang. Welcher Grund passt am besten?"
                options: ["… wir dort viel über Tiere lernen.", "… ich einen Zooausflug gut finde.", "… heute Dienstag ist."]
                answer: "… wir dort viel über Tiere lernen."
                hints: ["Welcher Grund sagt etwas Neues und passt zum Zoo?"]
              - id: l1-s3
                type: ordering
                text: "Bau den Satz."
                say: "Bau einen Satz mit Meinung und Grund. Denk daran: Nach weil steht das Verb am Ende."
                options: ["Spaß macht.", "Ich male gern,", "weil", "es mir"]
                slot_count: 4
                answer: ["Ich male gern,", "weil", "es mir", "Spaß macht."]
                option_audio: false
                hints: ["Das Verb macht kommt ganz ans Ende."]
              - id: l1-s4
                type: true_false
                text: "„Ich mag Erdbeeren, weil ich Erdbeeren mag.“ Ist das ein guter Grund?"
                say: "Lies den Satz. Ist das ein guter Grund?"
                answer: false
                hints: ["Sagt der Teil nach weil etwas Neues?"]
              - id: l1-s5
                type: speak
                text: "Ich finde den Winter schön, weil wir dann Schlitten fahren können."
                say: "Sag deine Meinung mit einem Grund. Sprich deutlich. Dann hörst du dich und das Vorbild."
                expected_text: "Ich finde den Winter schön, weil wir dann Schlitten fahren können."
                hints: ["Mach vor weil eine kleine Pause."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Meinung oder Grund?"
                say: "Sortiere: Ist das eine Meinung oder ein Grund?"
                bins:
                  - { id: opinion, show: { text: "Meinung" }, say: "Meinung" }
                  - { id: reason, show: { text: "Grund" }, say: "Grund" }
                options:
                  - { text: "Ich finde Basteln toll.", bin: opinion }
                  - { text: "Am Ende habe ich etwas Eigenes gemacht.", bin: reason }
                  - { text: "Brettspiele sind besser als Videospiele.", bin: opinion }
                  - { text: "Man sitzt dabei mit der Familie zusammen.", bin: reason }
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Ich finde, unsere Klasse braucht ein Aquarium, weil …\n\nWelcher Grund passt am besten?"
                say: "Lies den Satzanfang. Welcher Grund passt am besten?"
                options: ["… wir dann jeden Tag Fische beobachten können.", "… ich ein Aquarium wichtig finde.", "… mein Bruder Nudeln mag."]
                answer: "… wir dann jeden Tag Fische beobachten können."
              - id: l1-n3
                type: ordering
                text: "Bau den Satz."
                say: "Bau einen Satz mit Meinung und Grund. Denk daran: Nach weil steht das Verb am Ende."
                options: ["laut ist.", "weil", "Ich mag die Stadt nicht,", "es dort"]
                slot_count: 4
                answer: ["Ich mag die Stadt nicht,", "weil", "es dort", "laut ist."]
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Wort verbindet Meinung und Grund?"
                say: "Welches Wort verbindet die Meinung mit dem Grund?"
                frame: "Ich finde Turnen super, _ ich gern klettere."
                options: ["weil", "aber", "oder"]
                answer: ["weil"]
              - id: l1-n5
                type: true_false
                text: "„Ich finde, der Pausenhof braucht mehr Bänke, weil viele Kinder sich ausruhen wollen.“ Ist das eine Meinung mit einem Grund?"
                say: "Lies den Satz. Ist das eine Meinung mit einem Grund?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ich finde Fußball toll, weil …\n\nWelcher Grund passt am besten?"
            say: "Lies den Satzanfang. Welcher Grund passt am besten?"
            options: ["… ich im Team mit meinen Freunden spiele.", "… ich Fußball toll finde.", "… der Ball rund ist."]
            answer: "… ich im Team mit meinen Freunden spiele."
          - id: l1-c2
            type: ordering
            text: "Bau den Satz."
            say: "Bau einen Satz mit Meinung und Grund."
            options: ["lustig sind.", "weil", "Ich mag Comics,", "die Bilder"]
            slot_count: 4
            answer: ["Ich mag Comics,", "weil", "die Bilder", "lustig sind."]
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "„Ich finde Pizza lecker, weil Pizza lecker ist.“ Ist das ein guter Grund?"
            say: "Lies den Satz. Ist das ein guter Grund?"
            answer: false
          - id: l1-c4
            type: sorting
            text: "Sortiere die Sätze: Meinung oder Grund?"
            say: "Sortiere die Sätze: Meinung oder Grund?"
            bins:
              - { id: opinion, show: { text: "Meinung" }, say: "Meinung" }
              - { id: reason, show: { text: "Grund" }, say: "Grund" }
            options:
              - { text: "Ich finde Gewitter spannend.", bin: opinion }
              - { text: "Die Blitze leuchten hell am Himmel.", bin: reason }
              - { text: "Der Winter ist die beste Jahreszeit.", bin: opinion }
              - { text: "Dann kann ich Schneemänner bauen.", bin: reason }
            option_audio: false
          - id: l1-c5
            type: fill_in_blank
            text: "Welches Wort verbindet Meinung und Grund?"
            say: "Welches Wort verbindet die Meinung mit dem Grund?"
            frame: "Ich spiele gern Gitarre, _ ich Musik liebe."
            options: ["weil", "aber", "oder"]
            answer: ["weil"]
          - id: l1-c6
            type: true_false
            text: "„Ich finde Schnecken eklig, weil sie so schleimig sind.“ Ist das eine Meinung mit einem Grund?"
            say: "Lies den Satz. Ist das eine Meinung mit einem Grund?"
            answer: true

  - n: 2
    title: { de: "Höflich bitten", en: "Asking politely" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ich finde Regentage gemütlich, weil …\n\nWelcher Grund passt am besten?"
            say: "Lies den Satzanfang. Welcher Grund passt am besten?"
            options: ["… ich dann drinnen lesen und Tee trinken kann.", "… ich Regentage gemütlich finde.", "… Regen nass ist."]
            answer: "… ich dann drinnen lesen und Tee trinken kann."
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Welches Wort verbindet Meinung und Grund?"
            say: "Welches Wort verbindet die Meinung mit dem Grund?"
            frame: "Ich gehe gern in die Bücherei, _ es dort so ruhig ist."
            options: ["weil", "und", "aber"]
            answer: ["weil"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Gib mir den Kleber!\n\nKönntest du mir bitte den Kleber geben?"
            say: "Der erste Satz ist ein Befehl. Er klingt unhöflich. Der zweite Satz ist eine Bitte. Mit könntest du und bitte fragst du freundlich."
          - text: "Freund, Schwester: Kannst du mir bitte helfen?\nLehrerin, Busfahrer: Können Sie mir bitte helfen?"
            say: "Kinder und deine Familie sprichst du mit du an. Erwachsene, die nicht zu deiner Familie gehören, sprichst du meist mit Sie an, zum Beispiel deine Lehrerin oder den Busfahrer."
          - text: "Frau Klein, könnten Sie bitte das Fenster schließen? Mir ist kalt."
            say: "Eine Bitte mit Grund ist noch besser. Dann versteht der andere, warum du fragst. Und vergiss am Ende nicht: Danke!"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Du brauchst den Radiergummi von Ella. Was sagst du?"
                say: "Du brauchst den Radiergummi von Ella. Was sagst du?"
                options: ["Ella, kannst du mir bitte kurz deinen Radiergummi leihen?", "Gib mir sofort den Radiergummi!", "Radiergummi her!"]
                answer: "Ella, kannst du mir bitte kurz deinen Radiergummi leihen?"
                feedback:
                  "Gib mir sofort den Radiergummi!": "Das ist ein Befehl. Frag lieber freundlich mit bitte."
                hints:
                  - "Eine Bitte ist eine freundliche Frage."
                  - "Welcher Satz hat ein bitte und ist eine Frage?"
                  - "Ella, kannst du mir bitte kurz deinen Radiergummi leihen?"
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Du sprichst mit dem Hausmeister. Welches Wort passt?"
                say: "Du sprichst mit dem Hausmeister. Welches Wort passt?"
                frame: "Herr Schulz, können _ mir bitte die Tür aufschließen?"
                options: ["Sie", "du", "ihr"]
                answer: ["Sie"]
                hints:
                  - "Ist der Hausmeister ein Kind oder ein Erwachsener?"
                  - "Erwachsene, die nicht zu deiner Familie gehören, sprichst du meist mit Sie an."
                  - "Herr Schulz, können Sie mir bitte die Tür aufschließen?"
              - id: l2-f3
                type: multiple_choice
                text: "Welche Bitte hat einen Grund?"
                say: "Lies die Bitten. Welche Bitte hat einen Grund?"
                options: ["Könntest du bitte leiser sein? Ich kann mich sonst nicht konzentrieren.", "Könntest du bitte leiser sein?", "Sei leise!"]
                answer: "Könntest du bitte leiser sein? Ich kann mich sonst nicht konzentrieren."
                hints:
                  - "Ein Grund sagt, warum du bittest."
                  - "Welche Bitte erklärt etwas?"
                  - "Die mit: Ich kann mich sonst nicht konzentrieren."
              - id: l2-f4
                type: sorting
                text: "Höflich oder unhöflich?"
                say: "Sortiere: Ist das höflich oder unhöflich?"
                bins:
                  - { id: polite, show: { text: "höflich" }, say: "höflich" }
                  - { id: rude, show: { text: "unhöflich" }, say: "unhöflich" }
                options:
                  - { text: "Würden Sie mir bitte den Weg zeigen?", bin: polite }
                  - { text: "Mach Platz!", bin: rude }
                  - { text: "Darf ich bitte mitspielen?", bin: polite }
                  - { text: "Ich will jetzt das Buch!", bin: rude }
                option_audio: false
                hints:
                  - "Achte auf bitte und auf Fragen."
                  - "Befehle wie Mach Platz! klingen unhöflich."
                  - "Würden Sie und Darf ich sind höflich."
              - id: l2-f5
                type: speak
                text: "Frau Meyer, könnten Sie mir bitte die Aufgabe noch einmal erklären?"
                say: "Bitte deine Lehrerin höflich um Hilfe. Sprich freundlich und deutlich. Dann hörst du dich und das Vorbild."
                expected_text: "Frau Meyer, könnten Sie mir bitte die Aufgabe noch einmal erklären?"
                hints:
                  - "Nenne zuerst den Namen."
                  - "Es ist eine Frage. Am Ende geht die Stimme nach oben."
                  - "Hör das Vorbild an und sag es noch einmal."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Dein Bruder steht vor dem Fernseher. Du kannst nichts sehen. Was sagst du?"
                say: "Dein Bruder steht vor dem Fernseher. Du kannst nichts sehen. Was sagst du?"
                options: ["Kannst du bitte ein Stück zur Seite gehen? Ich sehe nichts.", "Weg da!", "Du nervst."]
                answer: "Kannst du bitte ein Stück zur Seite gehen? Ich sehe nichts."
                hints: ["Welcher Satz ist eine freundliche Bitte mit Grund?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Du sprichst mit deiner Freundin Ida. Welches Wort passt?"
                say: "Du sprichst mit deiner Freundin Ida. Welches Wort passt?"
                frame: "Ida, kannst _ mir bitte deinen Stift leihen?"
                options: ["du", "Sie", "ihr"]
                answer: ["du"]
                hints: ["Ida ist ein Kind und deine Freundin."]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Bitte hat einen Grund?"
                say: "Lies die Bitten. Welche Bitte hat einen Grund?"
                options: ["Darf ich bitte das Fenster öffnen? Hier ist es sehr warm.", "Darf ich bitte das Fenster öffnen?", "Fenster auf!"]
                answer: "Darf ich bitte das Fenster öffnen? Hier ist es sehr warm."
                hints: ["Welche Bitte sagt, warum?"]
              - id: l2-s4
                type: sorting
                text: "Höflich oder unhöflich?"
                say: "Sortiere: Ist das höflich oder unhöflich?"
                bins:
                  - { id: polite, show: { text: "höflich" }, say: "höflich" }
                  - { id: rude, show: { text: "unhöflich" }, say: "unhöflich" }
                options:
                  - { text: "Entschuldigung, wo ist der Bahnhof?", bin: polite }
                  - { text: "Hol mir das!", bin: rude }
                  - { text: "Könnten Sie das bitte wiederholen?", bin: polite }
                  - { text: "Das ist meins, gib her!", bin: rude }
                option_audio: false
                hints: ["Achte auf bitte, Entschuldigung und Befehle."]
              - id: l2-s5
                type: speak
                text: "Mama, könntest du mir bitte beim Packen helfen? Ich finde meine Turnschuhe nicht."
                say: "Bitte deine Mama höflich um Hilfe und sag einen Grund. Dann hörst du dich und das Vorbild."
                expected_text: "Mama, könntest du mir bitte beim Packen helfen? Ich finde meine Turnschuhe nicht."
                hints: ["Erst die Bitte, dann der Grund."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Im Bus ist es voll. Du möchtest dich auf den freien Platz neben einer Frau setzen. Was sagst du?"
                say: "Im Bus ist es voll. Du möchtest dich auf den freien Platz neben einer Frau setzen. Was sagst du?"
                options: ["Entschuldigung, ist hier noch frei?", "Rutsch mal!", "Da sitze jetzt ich."]
                answer: "Entschuldigung, ist hier noch frei?"
              - id: l2-n2
                type: fill_in_blank
                text: "Du sprichst mit der Frau an der Kasse. Welches Wort passt?"
                say: "Du sprichst mit der Frau an der Kasse. Welches Wort passt?"
                frame: "Entschuldigung, haben _ auch Äpfel?"
                options: ["Sie", "du", "ihr"]
                answer: ["Sie"]
              - id: l2-n3
                type: multiple_choice
                text: "Welche Bitte hat einen Grund?"
                say: "Lies die Bitten. Welche Bitte hat einen Grund?"
                options: ["Kannst du bitte das Licht anmachen? Ich kann sonst nicht lesen.", "Kannst du bitte das Licht anmachen?", "Licht an!"]
                answer: "Kannst du bitte das Licht anmachen? Ich kann sonst nicht lesen."
              - id: l2-n4
                type: sorting
                text: "Höflich oder unhöflich?"
                say: "Sortiere: Ist das höflich oder unhöflich?"
                bins:
                  - { id: polite, show: { text: "höflich" }, say: "höflich" }
                  - { id: rude, show: { text: "unhöflich" }, say: "unhöflich" }
                options:
                  - { text: "Würdest du bitte auf mich warten?", bin: polite }
                  - { text: "Warte gefälligst!", bin: rude }
                  - { text: "Danke, dass du mir geholfen hast.", bin: polite }
                  - { text: "Beeil dich endlich!", bin: rude }
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Ein Kind sagt zu seiner Lehrerin: „Kannst du mir mal helfen?“ Spricht es sie richtig an?"
                say: "Lies, was das Kind zu seiner Lehrerin sagt. Spricht es sie richtig an?"
                answer: false

      - activity: check
