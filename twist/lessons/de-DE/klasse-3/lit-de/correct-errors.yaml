# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.correct-errors
skill: lit-de.spelling-strategies.correct-errors
curriculum: de-DE
language: de
title:
  de: Fehler finden und berichtigen
  en: Finding and fixing mistakes
summary: >
  Checking a text for spelling mistakes. Lesson 1 reads word by word,
  finds one wrong word in a sentence and names the strategy that fixes it;
  lesson 2 finds two mistakes in a short text, writes the right spelling
  and collects Fehlerwörter, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Fehler berichtigen, en: Correcting mistakes }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling-strategies.choose-strategy, lit-de.spelling-strategies.dictionary]
  also_practises: [lit-de.spelling-strategies.choose-strategy, lit-de.spelling-strategies.memory-words]
  vocabulary: { de: [Fehler, berichtigen, Strategie, Fehlerwort, Wörterbuch] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: find, what: { de: Fehler im Text finden, en: finding the mistakes in a text } }
    - { id: strategy, what: { de: "die Strategie oder das Wörterbuch wählen, das hilft", en: choosing the strategy or the dictionary that helps } }
    - { id: fix, what: { de: das Fehlerwort richtig schreiben, en: writing the wrong word correctly } }
  misconceptions:
    - id: read-for-meaning
      what: Reads a text for its meaning and skims over the wrong word
      addressed: lesson 1 Learn reads word by word; every stage has a true_false sentence, mostly correct but in two stages with a hidden mistake (l1-n5, l2-s5), so the child can neither assume there is always an error nor tap Ja without reading
    - id: fix-without-strategy
      what: Changes a word by guessing instead of with a strategy
      addressed: "every stage has a \"Welche Strategie hilft?\" task about the word just found"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wort für Wort lesen", en: "Reading word by word" }
    goal:
      de: "Lies Wort für Wort, finde das falsche Wort und verbessere es mit einer Strategie, so wie Hund mit Hunde."
      en: "Read word by word, find the wrong word and fix it with a strategy, like Hund by saying Hunde."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Strategie hilft bei Räder?"
            say: "Räder. Welche Strategie hilft dir?"
            options: ["Ableiten", "Verlängern", "Merken"]
            answer: "Ableiten"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Sie las ein Buch. Unter welchem Wort findest du „las“ im Wörterbuch?"
            say: "Sie las ein Buch. Unter welchem Wort findest du las im Wörterbuch?"
            options: ["lesen", "lasen", "der Leser"]
            answer: "lesen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Hunt bellt laut."
            say: "Lies deinen Text Wort für Wort. Bleib bei jedem Wort kurz stehen und frag dich: Stimmt es? Hier ist das Wort Hund falsch geschrieben."
          - text: "Hunt | Verlängern: Hunde | Hund"
            say: "Wähle eine Strategie: Verlängern. Hunde, also Hund mit d. Jetzt verbesserst du den Fehler."
          - text: "Unsicher? Wörterbuch!"
            say: "Hilft dir keine Strategie, schlägst du das Wort im Wörterbuch nach."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Im Wald steht ein großer Baum mit grünen Blettern." }
                spans: ["Blettern"]
                hints:
                  - "Lies langsam und bleib bei jedem Wort stehen."
                  - "Bei welchem Wort hilft Ableiten?"
                  - "Blettern. Richtig ist Blättern, von Blatt."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Er komt heute später. Wie schreibt man komt richtig?"
                say: "Er kommt heute später. Wie schreibt man das Wort kommt richtig?"
                options: ["kommt", "kohmt", "komt"]
                answer: "kommt"
                option_audio: false
                hints:
                  - "Welche Strategie hilft bei kommt?"
                  - "Bilde die Grundform: kommen. Schwinge: kom, men."
                  - "kommt mit mm."
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Die Kinder spielen im Garden." }
                spans: ["Garden"]
                hints:
                  - "Lies langsam und bleib bei jedem Wort stehen."
                  - "Schwinge jedes Wort: Gar, ten."
                  - "Garden. Richtig ist Garten."
              - id: l1-f4
                type: multiple_choice
                text: "Welche Strategie hilft bei Garten?"
                say: "Garten. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
                options: ["Schwingen", "Ableiten", "Merken"]
                answer: "Schwingen"
                hints:
                  - "Wo ist die schwierige Stelle?"
                  - "In der Mitte: d oder t? Sprich jede Silbe deutlich."
                  - "Schwingen: Gar, ten."
              - id: l1-f5
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Wir essen heute Abend Nudeln." }
                answer: true
                hints:
                  - "Prüfe jedes Wort."
                  - "Heute Abend: Abend schreibt man hier groß."
                  - "Ja, alles ist richtig."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Mein Freunt wohnt neben mir." }
                spans: ["Freunt"]
                hints: ["Bei welchem Wort hilft Verlängern?"]
              - id: l1-s2
                type: multiple_choice
                text: "Die Meuse laufen schnell. Wie schreibt man Meuse richtig?"
                say: "Die Mäuse laufen schnell. Wie schreibt man das Wort Mäuse richtig?"
                options: ["Mäuse", "Meuse", "Mäuße"]
                answer: "Mäuse"
                option_audio: false
                hints: ["Ableiten: Maus."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Am Morgen trinke ich Milch und esse Brod." }
                spans: ["Brod"]
                hints: ["Bei welchem Wort hilft Verlängern?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Strategie hilft bei Brot?"
                say: "Brot. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
                options: ["Verlängern", "Ableiten", "Schwingen"]
                answer: "Verlängern"
                hints: ["Am Ende: d oder t?"]
              - id: l1-s5
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Der Vogel singt im Baum." }
                answer: true
                hints: ["Prüfe jedes Wort."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Ich habe eine neue Jake." }
                spans: ["Jake"]
              - id: l1-n2
                type: multiple_choice
                text: "Wir fahren im Somer ans Meer. Wie schreibt man Somer richtig?"
                say: "Wir fahren im Sommer ans Meer. Wie schreibt man das Wort Sommer richtig?"
                options: ["Sommer", "Sohmer", "Somer"]
                answer: "Sommer"
                option_audio: false
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Lena liest ein Buch über Tieger." }
                spans: ["Tieger"]
              - id: l1-n4
                type: multiple_choice
                text: "Welche Strategie hilft bei Tiger?"
                say: "Tiger. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
                options: ["Merken", "Verlängern", "Ableiten"]
                answer: "Merken"
              - id: l1-n5
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Heute ist das Weter schön." }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Das Pfert frisst Gras." }
            spans: ["Pfert"]
          - id: l1-c2
            type: multiple_choice
            text: "Im Herbst fallen die Bletter. Wie schreibt man Bletter richtig?"
            say: "Im Herbst fallen die Blätter. Wie schreibt man das Wort Blätter richtig?"
            options: ["Blätter", "Bletter", "Bläter"]
            answer: "Blätter"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Ist der Satz richtig geschrieben?"
            say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
            show: { drawn: letter-card, text: "Sie trägt eine rote Mütze." }
            answer: true
          - id: l1-c4
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Morgen gehen wir alle zusammen ins Schwimbad." }
            spans: ["Schwimbad."]
          - id: l1-c5
            type: multiple_choice
            text: "Ben schreibt „Berk“ und ist unsicher. Was hilft ihm?"
            say: "Ben schreibt Berg mit k am Ende und ist unsicher. Was hilft ihm?"
            options: ["Er verlängert: die Berge.", "Er schwingt: Berk.", "Er merkt sich: Berk mit k."]
            answer: "Er verlängert: die Berge."
          - id: l1-c6
            type: true_false
            text: "Ist der Satz richtig geschrieben?"
            say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
            show: { drawn: letter-card, text: "Die Sonne scheint hell am Himel." }
            answer: false

  - n: 2
    title: { de: "Zwei Fehler im Text", en: "Two mistakes in a text" }
    goal:
      de: "Finde zwei Fehler in einem kurzen Text und schreib die Wörter richtig, so wie Fahrrad und Verstecken."
      en: "Find two mistakes in a short text and write the words correctly, like Fahrrad and Verstecken."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Das Kint schläft." }
            spans: ["Kint"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Strategie hilft bei Kind?"
            say: "Kind. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
            options: ["Verlängern", "Schwingen", "Merken"]
            answer: "Verlängern"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Morgen fahren wir mit dem Fahrad in den Wald. Dort spielen wir Versteken."
            say: "In diesem Text sind zwei Fehler. Lies langsam und finde beide: Fahrrad und Verstecken sind falsch geschrieben."
          - text: "Fahrad: fahren + Rad = Fahrrad | Versteken: Verstecken"
            say: "Fahrrad besteht aus fahren und Rad. Darum stehen dort zwei r. Verstecken schreibst du nach dem kurzen e mit ck."
          - text: "Fahrrad | Verstecken"
            say: "Schreib deine Fehlerwörter richtig auf und übe sie. Dann passiert dir der Fehler beim nächsten Mal nicht mehr."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tippe auf die zwei falsch geschriebenen Wörter."
                say: "Lies den Text Wort für Wort. Zwei Wörter sind falsch geschrieben. Tippe beide an."
                show: { drawn: letter-card, text: "Am Montag gehen wir in den Zo und sehen einen Elefanten mit großen Oren." }
                spans: ["Zo", "Oren"]
                hints:
                  - "Lies langsam und bleib bei jedem Wort stehen."
                  - "Zwei Merkwörter sind falsch: eins mit doppeltem Selbstlaut, eins mit h."
                  - "Zo und Oren. Richtig sind Zoo und Ohren."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie schreibt man Oren richtig?"
                say: "Ohren. Wie schreibt man das Wort richtig?"
                options: ["Ohren", "Ooren", "Oren"]
                answer: "Ohren"
                option_audio: false
                hints:
                  - "Ohr ist ein Merkwort."
                  - "Nach dem langen o steht ein h."
                  - "Ohren."
              - id: l2-f3
                type: highlight_in_text
                text: "Tippe auf die zwei falsch geschriebenen Wörter."
                say: "Lies den Text Wort für Wort. Zwei Wörter sind falsch geschrieben. Tippe beide an."
                show: { drawn: letter-card, text: "Die Katze fengt eine Maus und leuft weg." }
                spans: ["fengt", "leuft"]
                hints:
                  - "Lies langsam und bleib bei jedem Wort stehen."
                  - "Bei beiden Fehlern hilft ein verwandtes Wort."
                  - "fengt und leuft. Richtig sind fängt und läuft."
              - id: l2-f4
                type: multiple_choice
                text: "Welche Strategie hilft bei fängt?"
                say: "Fängt. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
                options: ["Ableiten", "Verlängern", "Schwingen"]
                answer: "Ableiten"
                hints:
                  - "Wo ist die schwierige Stelle?"
                  - "ä oder e? Gibt es ein verwandtes Wort mit a?"
                  - "Ableiten: fangen."
              - id: l2-f5
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Wir backen einen Kuchen mit Äpfeln." }
                answer: true
                hints:
                  - "Prüfe jedes Wort."
                  - "Äpfel kommt von Apfel."
                  - "Ja, alles ist richtig."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Papa kauft Brot und Kese beim Bäcker." }
                spans: ["Kese"]
                hints: ["Achte auf die Wörter mit e oder ä."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie schreibt man Kese richtig?"
                say: "Käse. Wie schreibt man das Wort richtig?"
                options: ["Käse", "Kese", "Käße"]
                answer: "Käse"
                option_audio: false
                hints: ["Käse ist ein Merkwort mit ä."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf die zwei falsch geschriebenen Wörter."
                say: "Lies den Text Wort für Wort. Zwei Wörter sind falsch geschrieben. Tippe beide an."
                show: { drawn: letter-card, text: "Im Winder baut Tom einen Schnemann." }
                spans: ["Winder", "Schnemann"]
                hints: ["Bei einem Fehler hilft Schwingen, beim anderen ein Merkwort."]
              - id: l2-s4
                type: multiple_choice
                text: "Welche Strategie hilft bei Winter?"
                say: "Winter. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
                options: ["Schwingen", "Ableiten", "Verlängern"]
                answer: "Schwingen"
                hints: ["Sprich jede Silbe deutlich: Win, ter."]
              - id: l2-s5
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Mein Bruder spielt gern Fusball." }
                answer: false
                hints: ["Prüfe jedes Wort. In Fußball steckt der Fuß."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tippe auf die zwei falsch geschriebenen Wörter."
                say: "Lies den Text Wort für Wort. Zwei Wörter sind falsch geschrieben. Tippe beide an."
                show: { drawn: letter-card, text: "Lisa färt mit dem Roller zur Schuhle." }
                spans: ["färt", "Schuhle"]
              - id: l2-n2
                type: multiple_choice
                text: "Wie schreibt man färt richtig?"
                say: "Fährt. Wie schreibt man das Wort richtig?"
                options: ["fährt", "färt", "fehrt"]
                answer: "fährt"
                option_audio: false
              - id: l2-n3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Die Blumen im Garten sind gelp." }
                spans: ["gelp"]
              - id: l2-n4
                type: multiple_choice
                text: "Welche Strategie hilft bei gelb?"
                say: "Gelb. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
                options: ["Verlängern", "Ableiten", "Merken"]
                answer: "Verlängern"
              - id: l2-n5
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Wir spielen am Nachmittag im Hof." }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: find
            type: highlight_in_text
            text: "Tippe auf die zwei falsch geschriebenen Wörter."
            say: "Lies den Text Wort für Wort. Zwei Wörter sind falsch geschrieben. Tippe beide an."
            show: { drawn: letter-card, text: "Der Hase hüpft über die Wise und frisst eine Möre." }
            spans: ["Wise", "Möre"]
          - id: l2-c2
            part: fix
            type: multiple_choice
            text: "Wie schreibt man Wise richtig?"
            say: "Wiese. Wie schreibt man das Wort richtig?"
            options: ["Wiese", "Wise", "Wiehse"]
            answer: "Wiese"
            option_audio: false
          - id: l2-c3
            part: strategy
            type: multiple_choice
            text: "Welche Strategie hilft bei Möhre?"
            say: "Möhre. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
            options: ["Merken", "Verlängern", "Ableiten"]
            answer: "Merken"
          - id: l2-c4
            part: find
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Wir trinken Tee aus großen Taßen." }
            spans: ["Taßen"]
          - id: l2-c5
            part: find
            type: true_false
            text: "Ist der Satz richtig geschrieben?"
            say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
            show: { drawn: letter-card, text: "Nachts leuchten die Sterne." }
            answer: true
          - id: l2-c6
            part: find
            type: highlight_in_text
            text: "Tippe auf die zwei falsch geschriebenen Wörter."
            say: "Lies den Text Wort für Wort. Zwei Wörter sind falsch geschrieben. Tippe beide an."
            show: { drawn: letter-card, text: "Im Juli essen wir Eis und Erdberen am Strant." }
            spans: ["Erdberen", "Strant."]
          - id: l2-c7
            part: find
            type: true_false
            text: "Ist der Satz richtig geschrieben?"
            say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
            show: { drawn: letter-card, text: "In der Pause rennen alle über den Schulhoff." }
            answer: false
          - id: l2-c8
            part: find
            type: true_false
            text: "Ist der Satz richtig geschrieben?"
            say: "Lies den Satz Wort für Wort. Ist er richtig geschrieben?"
            show: { drawn: letter-card, text: "Am Abend liest Papa mir eine Geschichte vor." }
            answer: true
          - id: l2-c9
            part: find
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Der Bauer füttert die Kühe im Stal." }
            spans: ["Stal."]
          - id: l2-c10
            part: strategy
            type: multiple_choice
            text: "Mila hat „Zelt“ geschrieben. Sie ist unsicher: d oder t am Ende? Was hilft ihr?"
            say: "Mila hat Zelt geschrieben. Sie ist unsicher: d oder t am Ende? Was hilft ihr?"
            options: ["Sie verlängert: die Zelte.", "Sie leitet ab: zählen.", "Sie schwingt: Zelt."]
            answer: "Sie verlängert: die Zelte."
          - id: l2-c11
            part: strategy
            type: matching
            text: "Welche Strategie hilft bei diesem Wort? Verbinde."
            say: "Lies die Wörter. Welche Strategie hilft dir bei jedem Wort? Verbinde."
            pairs:
              - { left: { text: "Bäume" }, right: { text: "Ableiten" } }
              - { left: { text: "Zwerg" }, right: { text: "Verlängern" } }
              - { left: { text: "Vogel" }, right: { text: "Merken" } }
              - { left: { text: "Tomate" }, right: { text: "Schwingen" } }
          - id: l2-c12
            part: strategy
