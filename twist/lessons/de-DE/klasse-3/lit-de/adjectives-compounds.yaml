            answer: "so scharf wie ein Messer"
          - id: l2-c7
            part: meaning
            type: matching
            text: "Was bedeutet jedes Adjektiv? Verbinde."
            say: "Was bedeutet jedes Adjektiv? Verbinde."
            pairs:
